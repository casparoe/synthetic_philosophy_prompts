prompt: |-
  My roommates Maya and Theo had a long argument on the porch last night and I want someone to referee it properly, because they keep restarting it.

  The backstory: Maya works at a small company and has thought hard about whether her team's new product plan will flop. She walked her reasoning out loud — market size, the two competitors, the deadline they're already slipping — and said she's about 85% confident it flops. That's where it started.

  (1) Theo said that number is too high given her history: she's called three of their past projects dead-on-arrival, two of them succeeded anyway, and there's a whole psych literature showing people are systematically overconfidant about exactly this kind of judgment. Her track record is evidence about her evidence, he said, so she should knock the number down until it matches what someone with her track record deserves.

  (2) Maya said no. She can see each step of her reasoning right now, and each step looks as solid as anything. A track record is a statistic about her past, and it can't outweigh what she can literally see in front of her — like a forecast saying 20% chance of rain while rain is visibly falling on her head. Discounting would leave her believing her evidence points one way while believing the other, which she said is just being irrational twice over.

  (3) Theo said that's precisely what an overconfident person would say — she'd also feel the clarity of each step, that's the whole problem. If the meta-level evidence says her object-level judgments run hot in this domain, then lowering isn't ignoring her evidence, it IS her evidence working.

  (4) Maya said fine, then where does it stop? By his logic she should also check whether her checking was overconfident, and then check the check, and it never bottoms out — plus the studies he keeps citing are themselves things she's taking on fallible testimony, so why is it only her confidence that gets audited?

  (5) Theo said it bottoms out wherever the evidence is most reliable: the finding that people overrate their forecasts in domains like this is far better established than her private sense of clarity, so that side wins and that's the end of it.

  (6) Maya's last word was that she'd already discounted for overconfidence when she settled on 85 instead of 95 — hasn't she paid the toll already? And Theo said: how does she know the discount itself wasn't too small, given who applied it?

  They went to bed mad. Please go through the exchange round by round and say who's right about what — including whether Maya's move in (2) is the incoherence Theo takes it for or a defensible stance (I gather philosophers actually disagree about this "akrasia" stuff), and whether either of them is missing an option that would dissolve part of the fight, like just making the number itself carry the uncertainty instead of treating the track record as a separate thing to obey. And then tell me who comes out more right overall.
reasoning: |-
  Okay, let me try to unpack this roommate debate between Maya and Theo. The user wants a thorough referee of their argument about confidence calibration. 

  First, I need to map out the core disagreement: Theo thinks Maya's 85% failure confidence is too high given her past overconfidence, while Maya insists her current reasoning should override historical patterns. The rain analogy is interesting - she's saying you can't ignore direct evidence for statistical trends.

  Hmm... Theo's point about meta-overconfidence is tricky. If Maya admits she might be overconfident, but then claims she's already adjusted for it (85% instead of 95%), how can she prove the adjustment was sufficient? It's like claiming you've accounted for bias while still being biased. 

  But Maya's infinite regress concern feels valid too. Where does the discounting stop? Should we doubt psychological studies because researchers might be overconfident? Theo's answer about "most reliable evidence" seems practical but arbitrary - why stop there?

  I recall there's actual philosophy about this - epistemic akrasia. Some thinkers say it's irrational to believe "A is true" while also believing "my belief in A is unreliable". Others argue that in cases like Maya's, it might be necessary. The rain example tests this: if you see rain but your app says 20%, do you really doubt your eyes?

  The user's suggestion about building uncertainty into the number seems wise. Instead of lowering 85% to say 70%, Maya could express it as "85% but with high uncertainty due to my track record". That preserves her reasoning while acknowledging Theo's meta-concern.

  For overall judgment... Theo wins on calibration necessity - past performance matters. But Maya wins on not abandoning current evidence entirely. Her rain analogy holds. The compromise position feels most defensible: anchor to current reasoning but widen the confidence interval. Both missed that option.

  The user seems analytically minded - they referenced philosophers and want round-by-round analysis. Probably enjoys nuanced debates. Might appreciate knowing this mirrors academic disputes about Bayesian updating versus steadfast perception.
answer: |-
  Let's break this down round by round, addressing the philosophical tensions and practical solutions. Both make valid points, but neither has the full picture.

  ### Round-by-Round Analysis
  1. **Theo’s Opening (Track Record as Meta-Evidence)**  
     *Theo’s Point:* Maya’s past overconfidence (2/3 failed predictions despite her certainty) suggests she systematically overestimates her judgments. This meta-evidence should lower her current confidence.  
     *Strength:* Empirically sound. Calibration studies (e.g., Tetlock’s expert prediction research) show people often express overprecise confidence. Her track record *is* Bayesian evidence about her reliability.  
     *Weakness:* Treats all past judgments as equally relevant. Were those projects similar? Did she use the same reasoning?  

  2. **Maya’s Rebuttal (Direct Evidence Trumps Statistics)**  
     *Maya’s Point:* Her direct reasoning ("rain falling on her head") feels incontrovertible. Discounting it for statistics would force "epistemic akrasia" (believing P while believing her evidence doesn’t support P).  
     *Strength:* Intuitively compelling. If evidence feels overwhelmingly clear (e.g., seeing rain), ignoring it *is* irrational. Philosophers like Sarah Paul argue akrasia can sometimes be rational, but Maya’s stance aligns with "evidentialist" views (e.g., Feldman: "Believe what your evidence supports").  
     *Weakness:* Ignores that subjective "clarity" is *precisely* what overconfidence studies warn against.  

  3. **Theo’s Meta-Rebuttal (The Overconfidence Trap)**  
     *Theo’s Point:* Maya’s feeling of clarity is part of the problem—overconfident people *always* feel certain. Meta-evidence (studies + track record) should dominate.  
     *Strength:* Correct about the psychology. Kahneman/Tversky’s "illusion of validity" shows confidence often persists despite poor accuracy.  
     *Weakness:* Dismisses Maya’s nuanced reasoning. Not all judgments are equal.  

  4. **Maya’s Regress Challenge (Where Does It End?)**  
     *Maya’s Point:* If we discount confidence for overconfidence, why not discount the discount? Also, why trust the studies without auditing *their* reliability?  
     *Strength:* Highlights a real problem: infinite regress ("bootstrapping"). Philosophers (e.g., David Christensen) debate whether higher-order evidence should always dominate.  
     *Weakness:* Doesn’t negate the need for calibration. We *can* pragmatically halt regress at widely replicated science.  

  5. **Theo’s Stopping Point (Most Reliable Evidence Wins)**  
     *Theo’s Point:** Psychological studies are more reliable than subjective clarity, so they anchor the adjustment.  
     *Strength:* Pragmatic and evidence-based. Replicated findings > individual intuition.  
     *Weakness:* Overstates the precision of psychological studies. They suggest *probabilistic* adjustments, not absolutes.  

  6. **Maya’s Discount Claim & Theo’s Rebuttal (Did She Already Adjust?)**  
     *Maya’s Point:** She already lowered confidence from 95% to 85% to account for bias.  
     *Theo’s Point:** How can she know the adjustment was sufficient? Her bias affects *that too*.  
     *Strength:* Theo nails a key insight: the "bias blind spot" means we underestimate our own biases.  
     *Weakness:* Maya’s self-correction deserves *some* credit.  

  ### The Missing Solution: Explicit Uncertainty
  Both overlook a **Bayesian framework** that dissolves much of the conflict:  
  - **Maya’s direct evidence** gives her an initial estimate (e.g., 85% flop probability).  
  - **Theo’s meta-evidence** doesn’t override this but *widens the uncertainty*. Instead of lowering to 70%, she could say: "Based on my analysis, 85%, but given my track record, this estimate has high error bars—compatible with 65-95%."  
  - *Why this works:* It separates the *object-level prediction* (market size, competitors) from *confidence calibration*. Maya’s reasoning stays intact, but the final probability explicitly incorporates her reliability. No akrasia needed.  

  ### Who’s More Right Overall?
  - **Theo wins on calibration necessity.** Past performance *is* valid evidence. Ignoring it is statistically reckless. Studies show aggregating base rates with individual judgments improves accuracy.  
  - **Maya wins on evidence integrity.** Discarding direct reasoning entirely ("rain falling") for statistics is irrational. Her solution (partial self-correction) is better than Theo’s implied full surrender to meta-evidence.  
  - **Overall Verdict:** **Theo is more correct on the big picture** (Maya should lower her confidence), but **Maya is right that the adjustment must preserve her evidence**. The optimal path is Maya’s 85% *with explicit uncertainty*, not a flat reduction.  

  ### Philosophical Resolution
  - **Akrasia Debate:** Maya’s stance is defensible if she treats the 85% as her *best estimate given direct evidence*, while separately accepting that her estimates are often overconfident. This avoids believing "P" and "I shouldn’t believe P" simultaneously. Philosophers like Sophie Horowitz argue this "non-akratic" stance is coherent.  
  - **Practical Takeaway:** Use confidence intervals. Maya could say: "My analysis implies 85%, but my historical calibration error suggests a range of 70-90%." This honors both evidence layers without contradiction.  

  **Final Advice for You:** Tell them to compromise. Maya keeps her 85% as a "raw" estimate, but they jointly adjust it to 75-80% using her track record as a prior. No more porch wars! 🌧️➡️📊
