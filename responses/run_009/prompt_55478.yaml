prompt: |-
  I'm on the board of a ~120 unit condo building and we're about to vote on banning short-term rentals (Airbnb etc). Here's the thing that's been bugging me. Only unit owners get to vote, per the bylaws. But:

  - about a third of the units are owned by investors who mostly dont live here. Some of them list on Airbnb, others actually support the ban because they say it protects property values.
  - roughly 35 units are occupied by long-term tenants. They're the ones who actually live with the consequences -- parties at 2am, strangers with rolling suitcases in the lobby, the gym getting trashed -- and they get zero say.
  - the original developer still holds 18 unsold units, so he controls 18 votes' worth of weight, and he's against the ban bc he thinks it makes the building harder to market.
  - and whoever buys in later will inherit whatever we decide, since it gets baked into the bylaws. Obviously they dont get to vote either.

  Some of my neighbors say the tenant thing is easy to fix -- just let them vote. But then why stop there? Why not the developer's sales agents? The adult kids of owners who grew up in the building? The people across the street whose guest parking our Airbnb visitors eat up? It feels like once you open it up there's no obvious place to stop, and I can't articulate a principled line.

  You're a political philosopher who specializes in democratic theory, so think carefully about this one. Start by brainstorming every group that has some claim to a say here before you argue anything. Then actually take a position: who should get to vote on this ban, and on what principled basis? Is the right line different for a condo vote than for a country, or is it the same logic at different scale? And be honest with me -- I'm an owner-occupant who wants the ban to pass, so tell me straight if my reluctance to expand who votes here is just me rigging the electorate in my favor.

  After the discussion, give me a table with these columns: Group | What's at stake for them | Strongest case for giving them a vote | Strongest case against | Verdict. Use these verdicts only: Vote / No vote / In between (e.g., non-binding consultation or weighted vote). One row per group, including any group you think I missed. Then finish with a one-line bottom line: hold the vote under the current rules, or change who votes first?
reasoning: |-
  Okay, let me approach this condo voting dilemma systematically. The user is clearly wrestling with democratic legitimacy in a micro-governance context, so I need to unpack both the normative theory and practical implications.

  First, the stakeholder mapping seems crucial. Beyond the obvious categories (owner-occupants, investors, tenants), the developer's role is particularly interesting - holding unsold units creates a temporary but significant power imbalance. And the future buyers angle introduces intergenerational justice questions. 

  I recall Dahl's criteria for affected interests: intensity, duration, and reversibility. Tenants experience high-intensity daily impacts (noise, security) but lack permanence, while owners bear long-term financial stakes. The investor split is fascinating - those supporting the ban likely prioritize asset stability over rental income, revealing how stakeholder positions aren't monolithic.

  On the democracy scale question: Condos aren't nation-states but share core features - they're compulsory associations with rule-making power over daily life. Yet key differences exist: exit options (selling vs emigration), and the original property-based social contract. This makes me lean toward a "bounded membership" model, but with adjustments for disproportionate impact.

  The user's honesty about their pro-ban position is refreshing. Their resistance to tenant voting could indeed be self-serving, but also reflects legitimate concerns about boundary-setting. Maybe the solution lies in procedural innovation rather than simple inclusion - say, requiring supermajorities if certain groups are excluded.

  For the verdict table, I'll need to evaluate:
  - Tenants: Their daily wellbeing is directly affected, but they lack ownership risk. A consultative role feels just.
  - Developer: Their votes currently distort decisions toward marketing over livability. Perhaps vote weighting by ownership duration?
  - Future buyers: Their interests matter but granting votes now creates absurdity. Strong disclosure requirements might suffice.
  - Service workers/staff: Impacted but transient. Better addressed through management channels.

  The bottom line probably involves modifying the process - either allowing tenant input or imposing higher approval thresholds for exclusionary votes. Pure owner-only voting seems indefensible given the tenant impacts described.
answer: |-
  ## Democratic Dilemma in a Condo Association: Who Decides on Short-Term Rentals?

  This is a classic microcosm of democratic theory – who constitutes "the people" entitled to decide binding rules? Let's break it down systematically.

  **Brainstorming Groups with Potential Claims:**

  1.  **Owner-Occupants:** Live in the building, experience daily consequences (noise, security, amenities), bear property value impact, pay dues/fees.
  2.  **Investor-Owners (Pro-Ban):** Bear property value impact, pay dues/fees, may have long-term interests aligned with stability.
  3.  **Investor-Owners (Anti-Ban):** Rely on STR income, bear property value impact (though potentially differently weighted), pay dues/fees.
  4.  **Long-Term Tenants:** Experience *daily consequences* most acutely (noise, security, amenity degradation, disruption), contribute financially via rent (indirectly funding association), have a home here.
  5.  **Original Developer (Unsold Units):** Bears significant property value impact (selling remaining units), has a large voting bloc, has a specific interest in marketability/flexibility.
  6.  **Future Buyers:** Will inherit the rules and live with the consequences/property value impact. Have no current voice.
  7.  **Resident Staff (e.g., Concierge, Maintenance):** Experience increased workload, security risks, and disruption directly caused by STR turnover/parties. Their workplace is affected.
  8.  **Neighbors (e.g., Across the Street):** Experience externalities like guest parking overflow, noise spillover, potentially increased traffic. Their community is affected.
  9.  **Local Government/Community:** Has an interest in housing stability, neighborhood character, tax base, and enforcing local STR regulations. May bear enforcement costs.
  10. **Sales Agents (Developer):** Have a professional/financial stake in selling units easily, but no direct personal stake in living in or managing the building long-term.

  **Principled Analysis & Position:**

  The core principle is **"All those subject to the binding rules and significantly affected by their consequences should have a say in their making."** (Rooted in ideas like the "all affected interests" principle and democratic legitimacy).

  *   **The Crucial Distinction (Condo vs. Country):** While similar principles apply, the *scale and nature of membership* differ fundamentally.
      *   **Nation-State:** Membership is broad (citizenship/residency), exit is difficult (emigration), and the state governs nearly all aspects of life. Voting rights are extensive.
      *   **Condo Association:** Membership is based on *property ownership*, creating a specific, contractual relationship. Exit is easier (selling). Governance scope is limited to common elements and rules directly impacting the property and its use. Voting rights are traditionally tied to ownership.
  *   **The Problem:** Tying the vote *solely* to ownership ignores **intensity of impact** and **lack of meaningful voice** for those most directly experiencing the *daily negative consequences* (tenants) and creates **distortions of power** (developer's large bloc for transient interest).
  *   **My Position:** **The voting rules *should* be changed to include Long-Term Tenants, at minimum via a non-binding consultation.** Here's the principled reasoning:
      1.  **Primary Impact:** Tenants experience the core harms of STRs (noise, security, amenity degradation) *most directly and consistently*, arguably more than absentee owners. They are "subject to the rules" in their daily lives.
      2.  **Legitimacy Deficit:** Excluding those bearing the brunt of the negative externalities undermines the legitimacy of the decision for them. They have no recourse but to move (costly/disruptive).
      3.  **Ownership Stake Isn't Sole Legitimizer:** While ownership confers long-term financial stake and legal responsibility, it doesn't automatically confer a *stronger moral claim* to decide rules impacting daily living conditions than those actually living it. The investor-owner's financial stake exists, but the tenant's *well-being and home environment* are equally significant interests.
      4.  **Mitigating Distortion:** Including tenants counterbalances the developer's outsized influence based on unsold inventory (a temporary, sales-driven interest potentially misaligned with long-term community well-being).
      5.  **Practical Boundary:** The "contractual community" boundary (owners *and* residents) is a more defensible line than pure ownership. It includes those with a direct, ongoing, personal stake in the living environment. This excludes neighbors, sales agents, or future buyers who aren't currently bound by the association's rules or living within its walls. Staff are impacted, but their relationship is employment-based; their concerns should be channeled through management, not direct voting rights.
      6.  **"Slippery Slope" Fallacy:** Expanding to tenants is a logical inclusion based on intense, direct impact within the governed community. Expanding to neighbors, sales agents, or future buyers significantly broadens the boundary beyond the individuals bound by the association's covenants and experiencing the *internal* consequences daily. The line is clearer than initially feared.

  **Addressing Your Reluctance:** Your desire for the ban to pass likely *does* influence your reluctance to expand the electorate. Expanding to tenants, who overwhelmingly experience the negatives, would likely increase support for the ban. Your concern about the slippery slope is understandable but, upon principled analysis, doesn't hold for tenant inclusion. The principled line (contractual community members subject to daily rules/consequences) is robust.

  **Stakeholder Analysis & Voting Verdict Table:**

  | Group                      | What's at Stake for Them                                                                 | Strongest Case FOR a Vote                                                                 | Strongest Case AGAINST a Vote                                                                                           | Verdict              |
  | :------------------------- | :--------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------- | :------------------- |
  | **Owner-Occupants**        | Daily living quality, property value, financial investment (dues, mortgage).             | Directly impacted daily, bear financial responsibility, traditional voting members.       | N/A (Core voters).                                                                                                      | **Vote**             |
  | **Investor-Owners (Pro-Ban)** | Property value, long-term rental stability, financial investment (dues).                 | Significant financial stake, long-term interest in building stability.                    | May not experience daily negative consequences directly.                                                                | **Vote**             |
  | **Investor-Owners (Anti-Ban)** | STR rental income stream, property value impact, financial investment (dues).            | Significant financial stake, purchased with STR rights (potentially).                     | Income interest may conflict with community well-being; may not experience daily negatives.                             | **Vote**             |
  | **Long-Term Tenants**      | **Daily living quality, security, comfort, sense of home, cost/effort of moving.**       | **Bear the most intense daily negative consequences; subject to rules; stability of home.** | Not owners; no direct financial responsibility for building; contractual relationship is with landlord, not association. | **In Between** (Consultation) |
  | **Original Developer (Unsold)** | Marketability/sale price of unsold units, flexibility for future buyers.                 | Significant financial stake via unsold inventory; developer role.                          | Interest is transient (selling), potentially misaligned with long-term community health; holds disproportionate power. | **Vote** (Weighted?) |
  | **Future Buyers**          | Inherited rules, property value, living conditions.                                      | Will be subject to the rules permanently.                                                 | Not yet members; impractical/impossible to identify; decisions must be made by current stakeholders.                    | **No Vote**          |
  | **Resident Staff**         | Workplace safety, workload, stress, job satisfaction.                                    | Directly impacted by STR behavior (cleaning, security incidents).                         | Employment relationship; concerns should be addressed via management channels, not governance.                          | **No Vote**          |
  | **Neighbors (Across St)**  | Parking congestion, noise spillover, neighborhood character, property values.            | Experience negative externalities.                                                        | Not members of the condo community; not subject to its bylaws; impacts are indirect/secondary.                          | **No Vote**          |
  | **Local Government**       | Enforcement costs, housing stability, neighborhood harmony, tax base.                    | Represents broader public interest; may enforce regulations.                              | Represents different constituency/political unit; condo rules are private governance within legal bounds.               | **No Vote**          |
  | **Sales Agents (Developer)**| Commission income, ease of sales process.                                                | Professional/financial stake in developer's success.                                      | No personal stake in living/owning; relationship is professional service, not governance.                               | **No Vote**          |

  **Bottom Line:**

  **Change who votes (or how input is gathered) first.** The current rules unjustly exclude long-term tenants who suffer the primary harms. Hold a formal, non-binding consultation with verified long-term tenants to capture their input before the owner vote. This enhances legitimacy without fundamentally altering the ownership-based governance structure. If immediate rule change isn't feasible, this consultation should heavily inform owner deliberations. Ignoring the tenant experience entirely is democratically indefensible given the intensity of their stake.
