prompt: |-
  I'm a backend engineer, never took a philosophy class in my life, but a coworker and I keep arguing about when you're allowed to trust your own reasoning vs. when you have to discount it, so I just wrote down my gut calls on a bunch of cases and now I want to know if there's an actual rule behind them.

  Case: a senior engineer I respect about as much as myself reviews my design doc and says the caching scheme has a race condition. I go back through my reasoning step by step and it still looks airtight to me. Gut call: I should back off to something like 50/50 anyway. Saying "I've re-checked and I'm just right" at full confidence feels wrong.

  Case: I read that engineers systematically overrate their own hotfixes. I'm an engineer, so statistically I probably overrate mine. But when I look at my last hotfix it still just... looks correct, the reasoning is right there. Gut call: I think that's fine? I can't exactly un-see the argument, so I keep believing it even while knowing my self-assessment is the kind of thing that's usually inflated. My coworker says this is incoherent of me.

  Case: same setup as the last one, except this time I didn't just review it myself — the integration tests pass and a static analysis tool verified the actual invariant. Now "people overrate their own code" does basically nothing to me. Hold firm.

  Case: I'm drunk at a party and I'm completely sure I left my keys on the kitchen counter. That's what a memory feels like from the inside, vivid and confident. But drunk me is wrong about exactly this kind of thing basically every time. Gut call: don't trust the memory, act like you're probably wrong, go check.

  Case: a very smart new hire, first week, zero context on the system, tells me after five minutes that my design is broken. Gut call: barely move at all.

  Case, the one we actually fight about: an internal tool tells me that of my last ten "I'm sure it's fine" calls on this class of bug, seven were wrong. Today's call still seems fine to me from the inside. I genuinely don't know what my gut says here.

  So: is there one principle that captures all of these? My attempt was something like "verified first-order evidence beats higher-order doubt, but unverified first-order confidence has to yield when the higher-order info says people like you blow it" — but my coworker pointed out this seems to smuggle my own judgment back in, since who decides that the tool's seven-out-of-ten applies to *this* call? Me. The same biased me. Which feels like a program trying to patch itself using a patch produced by the same buggy compiler.

  What I want from you: state the principle (or two competing ones) as precisely as you can, tell me what it says about the automated-tool case and about a case or two I haven't listed, and be honest about which of my gut calls have to go to make it work. I suspect the drunk-keys case and the "I can keep believing while knowing my self-assessment is inflated" case can't both survive, but I can't articulate why, and it bugs me.
reasoning: |-
  Okay, let me start by unpacking what this backend engineer is asking. They've provided several scenarios where they're trying to balance their own reasoning against higher-order evidence. The core issue seems to be about when to trust their own judgment versus when to defer to external indicators of potential bias or error.

  First, I need to identify a pattern across all these cases. The engineer mentioned that their gut calls vary depending on whether there's verified evidence or just internal confidence. For example, in the senior engineer case, they lower confidence despite their reasoning seeming airtight. But when tests pass, they hold firm even knowing about general overconfidence.

  The key conflict they're facing is between first-order evidence (their own reasoning) and higher-order evidence (statistics about biases, past performance). The challenge is articulating a principle that resolves when one overrides the other without circularity.

  Looking at the drunk keys example: here, the vivid memory is discounted because of the higher-order knowledge that drunk memories are unreliable. But in the hotfix scenario, they maintain belief in their reasoning despite knowing engineers are generally overconfident. So why the difference? Probably because in the hotfix case, the reasoning is accessible and can be checked, whereas the drunk memory's reliability is inherently compromised by the state of intoxication. The ability to verify in real-time might be a factor.

  The automated tool case is tricky. The tool shows they were wrong 70% of the time, but the current judgment feels correct. The engineer’s coworker points out the paradox: deciding whether this specific case falls under the general statistic relies on the same judgment that’s biased. This is like the compiler trying to patch itself. A possible resolution here might be to treat the higher-order evidence as a prior that should update their confidence, but not override it completely if there’s strong first-order evidence. But how to weigh them?

  Eliezer Yudkowsky’s principle comes to mind: when higher-order evidence indicates unreliability, it should dominate unless you have reason to believe the source of the evidence is flawed. However, in the tool's case, the evidence is specific to their past performance. So maybe they should significantly lower their confidence, say to 30%, but not necessarily discard their judgment entirely. The presence of the tool's data acts as a strong counter to their internal confidence.

  To resolve the incoherence between the drunk keys and hotfix cases, perhaps the distinction is between general biases and specific reliability. Knowing you’re drunk specifically impairs memory formation, making the memory unreliable at the source. Whereas general overconfidence in engineers doesn’t invalidate the reasoning itself, just suggests extra scrutiny. The hotfix case still allows for verification (like tests), which isn’t possible with the drunk memory.

  For a new principle: "Discount first-order confidence proportionally to the strength and specificity of higher-order evidence indicating unreliability, unless the first-order evidence is independently verifiable." This would explain why tests passing (verified) allow holding firm, while the senior’s feedback (unverified) reduces confidence. In the tool case, the higher-order evidence is strong and specific, so confidence should drop despite internal feelings.
answer: |-
  Based on your cases and the core philosophical problem (first-order evidence vs. higher-order evidence about your reliability), here's a precise principle derived from Bayesian epistemology and calibration research, followed by analysis:

  ### The Principle
  **"Calibrated Deference Principle" (CDP):**  
  *Discount your first-order confidence in proportion to the strength, specificity, and independence of higher-order evidence indicating systematic unreliability in your judgment for this context, unless the first-order evidence includes independently verifiable safeguards against the specific failure mode identified by the higher-order evidence.*

  ### Breakdown
  1.  **Strength:** How statistically robust is the higher-order evidence? (e.g., "engineers overrate" = moderate; "7/10 wrong" = strong).
  2.  **Specificity:** How precisely does the higher-order evidence match the current judgment context? (e.g., "drunk memory" = very specific; "new hire with no context" = low specificity).
  3.  **Independence:** Does the higher-order evidence come from a source/cause *external* to your current reasoning process?
  4.  **Verifiable Safeguards:** Can the *conclusion* of your reasoning be checked by an objective, reliable process *unaffected* by the bias/error the higher-order evidence warns about? (e.g., tests, proofs, tools).

  ### Application to Your Cases
  1.  **Senior Engineer (Race Condition):**  
      *   **Higher-Order:** Strong (respected peer), Specific (this design/context), Independent (external).
      *   **First-Order:** Unverified reasoning.
      *   **CDP:** Significant discount required (50/50 matches). You *must* yield.
      *   **Gut Call: CORRECT.**

  2.  **General Overconfidence (Hotfix Reasoning):**  
      *   **Higher-Order:** Moderate ("engineers overrate"), Low Specificity (general, not *this* hotfix), Independent but weak.
      *   **First-Order:** Unverified reasoning (just your review).
      *   **CDP:** *Mild* discount recommended. Maintain belief but *increase scrutiny* (e.g., ask for review, add test). Your coworker is slightly wrong; this *is* coherent if the discount is small.
      *   **Gut Call: PARTIALLY CORRECT** (Belief can persist, but you *should* increase doubt/vigilance).

  3.  **Overconfidence + Passing Tests:**  
      *   **Higher-Order:** Same as #2.
      *   **First-Order:** **Includes Verifiable Safeguard** (Tests/Static Analysis). These are *specifically designed* to catch errors reasoning might miss, countering the "overrate" failure mode.
      *   **CDP:** Safeguard neutralizes the higher-order evidence. Hold firm.
      *   **Gut Call: CORRECT.**

  4.  **Drunk Keys (Memory):**  
      *   **Higher-Order:** Very Strong (personal history of error), Very Specific (drunk state impairs *this exact memory function*), Independent.
      *   **First-Order:** Unverified (internal feeling of vividness).
      *   **CDP:** Severe discount required. Act as if probably wrong.
      *   **Gut Call: CORRECT.**

  5.  **Smart New Hire (No Context):**  
      *   **Higher-Order:** Weak Strength (single anecdote), **Low Specificity** (lacks crucial context), Independent.
      *   **First-Order:** Verified or not is less relevant here.
      *   **CDP:** Minimal discount. Barely move.
      *   **Gut Call: CORRECT.**

  6.  **Automated Tool (7/10 Wrong):**  
      *   **Higher-Order:** **Very Strong** (specific, quantitative track record), **Very Specific** (your judgment on this *exact class* of bug), Independent (tool output).
      *   **First-Order:** Unverified reasoning ("seems fine").
      *   **CDP:** **Significant discount required.** Your confidence *must* drop substantially (e.g., from 90% to ~30%). The tool's data *is* the objective check your reasoning lacks. The "who decides?" objection fails: the higher-order evidence *itself* tells you your judgment on applicability is unreliable in this domain. You *must* defer to the aggregate signal. **Your gut is WRONG** to be unsure; you should strongly discount your current feeling.
      *   **Resolution:** Treat the tool's 70% error rate as your new *prior* probability of being wrong *before* even looking at this specific case. Your "seems fine" feeling provides only weak evidence against that high prior.

  ### Reconciling the Drunk Keys vs. Overconfidence Cases
  Your suspicion is valid. The CDP explains the difference:
  *   **Drunk Keys:** The higher-order evidence (drunkenness impairs memory encoding/recall) **directly attacks the reliability of the cognitive mechanism** producing the first-order evidence (memory). The vivid feeling *is part of the faulty process*. You *cannot* verify the memory while drunk.
  *   **General Overconfidence:** The higher-order evidence (engineers are overconfident) is **weaker and less specific**. It doesn't *prove* your *reasoning process* for *this specific fix* is flawed *this time*. Your reasoning remains accessible for scrutiny *in principle* (even if biased). Tests (#3) provide the missing verification.
  *   **Key Distinction:** Does the higher-order evidence invalidate the *very process* generating your first-order confidence *in this instance* (drunk memory - yes; general overconfidence - maybe, but weaker)? Does it prevent verification (drunk - yes; reasoning - no, tests can verify)?

  ### New Case: Applying the CDP
  **Case:** A renowned security researcher publishes a paper proving a fundamental flaw in the encryption algorithm you designed and have been confidently using for years. Your original derivation still looks mathematically sound to you.
  *   **CDP Analysis:**
      *   **Higher-Order:** Extremely Strong (expert proof), Highly Specific (this exact algorithm), Independent.
      *   **First-Order:** Unverified reasoning (your own re-check). The paper *is* the verification safeguard you lack.
      *   **Verdict:** You *must* drastically discount your confidence in your derivation. The researcher's proof acts as the objective safeguard *against* the kind of error your reasoning evidently contained. Hold firm only if you find a verifiable flaw *in their proof* (a new safeguard).

  ### Which Gut Calls Have to Go?
  1.  **Automated Tool Case:** Your uncertainty is unjustified. The CDP demands significant discounting of your "seems fine" feeling.
  2.  **General Overconfidence Case (Minor Adjustment):** While you *can* maintain belief based on reasoning, your gut understates the need for *increased scrutiny* or seeking verification due to the higher-order evidence. "Feels fine" isn't enough; action to mitigate the known bias is prudent.
  3.  **"I can keep believing while knowing..." Coherence:** Your coworker is partially right. Maintaining *absolute* confidence ("it *is* correct") *is* incoherent if you truly accept the higher-order evidence. CDP resolves this: you maintain *belief* (it's *likely* correct based on reasoning) but with *reduced confidence* ("I think it's correct, but I know I'm prone to overconfidence here, so I'll double-check"). The belief persists, but its certainty is tempered.

  ### Core Philosophical Takeaway
  You've stumbled upon the **"Problem of Self-Doubt"** in epistemology. The CDP avoids the "buggy compiler" paradox by:
  1.  **Acknowledging Higher-Order Evidence as Data:** The tool's 7/10 record is objective data *about your performance*, independent of your current judgment.
  2.  **Demanding External Anchors:** Unverified reasoning is inherently unstable under self-doubt. Verification (tests, tools, peer consensus) provides the external anchor. In the tool case, the tool *is* the anchor.
  3.  **Quantifying the Discount:** It doesn't demand you ignore your reasoning; it demands you weight it *less* based on the track record. Your "seems fine" feeling moves the needle *less* than it would without the higher-order evidence.

  The principle isn't perfect self-patching, but it's the best calibration strategy we have: **Trust feelings cautiously, trust verified results highly, and let objective track records override both when they conflict.**
