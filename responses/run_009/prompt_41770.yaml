prompt: |-
  I'm giving a talk at my local EA meetup arguing against fanaticism — roughly, the view that you should always prefer a tiny chance of astronomically huge value over a certainty of modest value. My line is that we should put some cap on how much weight super-low-probability upsides get, so you'd turn down Pascal's mugging but also some of the more far-fetched long-shot interventions our community likes to fund. The audience is maybe 25ish people: mostly longtermists who think the far future just dominates the expected value math, one guy who's deep into the decision theory literature and will definately come at me with money-pump / stochastic dominance style arguments, and a couple of stats-curious folks who don't care about EA framing at all and just want to know if my cap is even a coherent decision rule. Prep me a Q&A sheet: the objections I'll actually get from this crowd, in roughly the order they'll come, phrased the way they'd phrase them, each with a short reply and a note on where my reply is shaky. Flag what I should concede up front, and include the question I'm quietly hoping nobody asks. Also — if you think my whole framing is off, e.g. that "fanaticism" isn't the real target or my cap idea collapses under any pressure, tell me that straight instead of building a defense I shouldn't want.
reasoning: |-
  Okay, the user is preparing a talk against fanaticism for an EA meetup. They want a Q&A sheet with anticipated objections, replies, and weaknesses. The audience includes longtermists, a decision theory expert, and stats-curious folks. I need to help them prepare effectively.

  First, understanding their core argument: they propose capping how much weight super-low-probability outcomes get. This means rejecting both Pascal's Mugging and some EA-funded long-shot interventions. Their position is that we shouldn't prioritize tiny chances of huge payoffs over certain modest gains.

  Considering the audience: Longtermists likely believe the far future's expected value dominates everything. The decision theory person will bring up money-pumps and stochastic dominance. The stats folks care about coherence. I need to anticipate each group's objections.

  For longtermists, the main challenge will be that capping violates expected value maximization, which is central to EA. They'll argue this undermines longtermism. The user needs to acknowledge this tension but argue that unbounded utilities lead to absurdities. They should concede that under strict EV, longtermism requires fanaticism but question if that's realistic.

  The decision theory expert will attack the cap's coherence. Money-pump arguments suggest inconsistent preferences. Stochastic dominance means preferring options that are always better. The user's cap might violate these, so they need to argue that coherence isn't the only priority—practicality matters. Cite Buchak's risk-weighted expected utility as an alternative.

  Stats-curious people will question if the cap is mathematically coherent. They might ask for a clear formula. The user should admit it's ad-hoc but necessary to avoid insanity. Suggest a function that grows slower than any unbounded utility, but this is still messy.

  The user's quiet hope is that no one asks for the exact cap formula. They don't want to commit to a number. The deep issue is that any cap is arbitrary, and they need to own that as a feature, not a bug.

  I wonder if their framing is off. Fanaticism is tied to unbounded utility functions. If utilities are bounded, fanaticism disappears. But bounding utilities might be controversial in EA. The user should consider if their cap is a proxy for bounded utility. They might need to argue that utilities are bounded in practice.

  Also, the real target might be not fanaticism per se but the neglect of risk aversion in EA. Highlighting that even small risks of wasting resources matter. The cap could be a way to incorporate risk aversion without abandoning EV entirely.

  Preparing the Q&A flow: Start with longtermist objections, then decision theory, then stats. Concede early that capping violates strict EV but argue it's necessary. For the money-pump, admit the preference reversal but emphasize real-world constraints. For coherence, admit the cap isn't perfectly principled but is practical.

  The user needs to be ready to handle pushback on arbitrariness. They should stress that the cap prevents worse absurdities. Examples like Pascal's Mugging make their point relatable. Also, distinguish between credible and incredible long-shots to avoid dismissing all high-impact interventions.

  Finally, ensure the user has concrete examples. When is the cap triggered? Use specific numbers to illustrate. Show that beyond a certain improbability, the weight drops significantly. This makes the argument tangible.
answer: |-
  Here's a battle-tested Q&A sheet tailored to your audience and argument. I've structured it by likely challenger groups, ordered by probable sequence of objections. I've flagged shakiness, concessions, and the "quiet hope" question. My assessment: **Your framing is defensible but strategically vulnerable at the foundations; proceed with caution and own the concessions.**

  **Core Concession You MUST Make Up Front:**  
  *"Look, I concede this violates strict expected value maximization (EVM). If you believe EVM is the *only* rational decision rule and that utility *must* be unbounded, then fanaticism follows logically. My argument is that strict EVM with unbounded utility leads to absurdities we *should* reject, implying we need a bounded decision rule (like my cap) or bounded utility itself. I'm arguing that coherence and practicality sometimes trump pure EVM."*

  ---

  **Q&A Sheet: Objections & Replies**

  **Phase 1: The Longtermist Onslaught (EV Dominance)**

  1.  **Objection (Longtermist):** "But even a 1 in 10^30 chance of saving 10^30 future lives has astronomically higher EV than saving 1 life for sure! Ignoring this is neglecting the far future, which is the *only* thing that matters morally on EV grounds. Your cap is arbitrary and morally negligent."  
      **Reply:** "The core issue is whether probabilities *that low* are meaningfully actionable or credible. Assigning reliable probabilities and modeling impacts at such scales is arguably impossible. My cap reflects a skepticism that we can distinguish the EV of `p * U(huge)` from noise or modeling artifacts when `p` is vanishingly small. We shouldn't mortgage *all* present value on claims we fundamentally cannot robustly evaluate."  
      **Shakiness:** Admits EVM *formally* favors the longshot. Relies on epistemic arguments (can we *know* `p` or `U` well enough?) which some dismiss as "surrender to uncertainty."

  2.  **Objection (Longtermist):** "You're privileging the near-term/small-scale because it feels more concrete. This is status quo bias. The math is clear: if the future is vast and potential value is unbounded, tiny probabilities dominate. Rejecting this is rejecting the core argument for longtermism!"  
      **Reply:** "I'm not rejecting longtermism wholesale. I'm rejecting *fanatical* longtermism – the part that says *any* non-zero probability of infinite (or colossal finite) value swamps *all* finite concerns. We can still prioritize high-probability, high-impact future interventions (e.g., 1% chance of preventing extinction) over near-term work without accepting Pascal's Mugging. My cap targets the extreme tail, not the core of impactful longtermism."  
      **Shakiness:** Drawing the line between "high-impact longshot" (acceptable) and "fanatical longshot" (capped) is inherently fuzzy and context-dependent.

  **Phase 2: The Decision Theorist's Trap (Coherence & Dominance)**

  3.  **Objection (Decision Theorist):** "Your cap rule violates stochastic dominance. Suppose Option A: 100% chance of 1 util. Option B: 0.5 * 10^{-100} chance of 10^{100} utils, 99.999...% chance of 0 utils, and 0.5 * 10^{-100} chance of *minus* 10^{100} utils. By EV, B is terrible. By your cap, you might reject B vs A (capping the upside). But now consider Option C: Same as B, but replace the *negative* payoff with 0. C stochastically dominates B (never worse, sometimes better). Your cap might accept C vs A (if the upside is capped but positive) while rejecting B vs A. But if you prefer A over B, and C over B, you must prefer A over C by transitivity! Contradiction."  
      **Reply:** "Ouch, fair. This exposes a weakness. My practical response: In the real world, interventions with purported upside potentials of 10^100 utils almost certainly come with unquantified tail risks (like the -10^100). My cap is partly a heuristic against *all* claims involving such incomprehensible magnitudes – upside *or* downside. I'd likely reject B *and* C vs A due to the sheer implausibility of modeling the tails accurately. Formally, yes, this risks violating strict coherence; I'm arguing real-world decision-making under deep uncertainty sometimes necessitates such heuristics."  
      **Shakiness:** This is a serious formal weakness. You're essentially arguing for "bounded rationality" over strict coherence. Cite Buchak's Risk-Weighted Expected Utility as inspiration if familiar.

  4.  **Objection (Decision Theorist):** "What about money pumps? If you turn down a positive-EV bet solely because its high-end outcomes exceed your cap, a clever opponent could construct a series of trades to pump money from you."  
      **Reply:** "Two responses: 1) Real-world actors aren't omniscient, malicious money-pumpers exploiting infinitesimal probabilities. 2) More fundamentally, if the bet involves outcomes whose *claimed* value exceeds any plausible bound on what we can actually affect or measure (like 10^100 utils), it's not a meaningful 'bet' – it's noise. Refusing to engage with incoherently large value propositions isn't irrational, it's sanity."  
      **Shakiness:** Admits vulnerability to *theoretical* money pumps. Relies on practical impossibility.

  **Phase 3: The Stats-Curious Scrutiny (Mechanics & Coherence)**

  5.  **Objection (Stats-Curious):** "Okay, *how* does this cap work mathematically? Is it a hard ceiling on the utility value `U`? A diminishing weighting function on `p * U`? Something else? Show me the formula and prove it's coherent."  
      **Reply:** "I propose a *weighting function* `w(p, U)` applied to the outcome value before calculating EV. `w(p, U)` should approach 0 as `p` approaches 0 *for extremely large `U`*, even if `p * U` is large. For example, `w(p, U) = p * U` for `U < C` (some large constant), but `w(p, U) = p * U * f(p)` for `U >= C`, where `f(p)` is a function decaying rapidly as `p -> 0` (e.g., `f(p) = 1 / (1 - log(p))` for tiny `p`). It's not perfectly 'coherent' under all decision theories, but it avoids the fanaticism trap."  
      **Shakiness:** Any specific formula is ad-hoc. Proving general coherence under standard axioms is likely impossible. This is a pragmatic fix, not a derived theory.

  6.  **Objection (Stats-Curious):** "Doesn't this just replace fanaticism with arbitrariness? Who sets `C` or chooses `f(p)`? Isn't this just smuggling in your risk aversion?"  
      **Reply:** "Yes, there's unavoidable arbitrariness. This reflects a core philosophical choice: **We must bound rationality to avoid insanity.** Setting `C` involves judgment – perhaps based on the maximum plausible value we think we can actually influence or model reliably. It *is* a form of extreme risk aversion, but specifically towards *unfathomably improbable* claims of *unfathomably large* impact. The arbitrariness of the bound is less dangerous, I argue, than the arbitrariness of accepting any Pascal's Mugger."  
      **Shakiness:** Fully concedes arbitrariness. Argues it's the lesser evil.

  **The Question You're Quietly Hoping Nobody Asks (The Foundation Shaker)**

  *   **The Dreaded Question:** "Isn't the *real* problem the assumption of **unbounded utility**? If we simply assume utility is bounded (e.g., no outcome can be worth more than some fixed, enormous but finite number `M`), then fanaticism vanishes instantly, expected value is always finite, and your cap becomes redundant. Why not just argue for bounded utility instead of this ad-hoc decision rule?"  
      **Why it's Feared:** It cuts to the core. It exposes that your "cap" is a symptom fix for the disease of unbounded utility – the *real* source of fanaticism. Arguing for bounded utility is a much deeper, more controversial philosophical shift within EA/longtermism.
      **Forced Reply:** "You're absolutely right. That *is* the cleanest solution. A hard bound on utility itself resolves the fanaticism problem mathematically. My 'cap' is a practical, decision-rule-level attempt to approximate the *effect* of bounded utility when we operate *as if* utility is unbounded (which much EA discourse does). Ultimately, I suspect we *need* bounded utility to be rational. If pressed, I'd bite that bullet: **Yes, we should assume utility is bounded.** My talk uses the 'cap' framing to make the practical consequences clear without first demanding everyone abandon unbounded utility."

  ---

  **Should You Use This Framing? (Straight Assessment)**

  *   **Is "Fanaticism" the Right Target?** **Yes, mostly.** The preference for tiny chances of huge value over sure modest gains *is* the operational definition of fanaticism in this context (from Beckstead, Bostrom, etc.). Your argument targets it correctly.
  *   **Does the "Cap" Idea Collapse?** **It wobbles badly under formal pressure** (money pumps, stochastic dominance) but **holds pragmatic water**. Its core vulnerability isn't technical collapse; it's that it's a **symptomatic fix** for the deeper issue: **unbounded utility**.
  *   **Recommendation:** **Proceed, but pivot strategically.**
      1.  **Lead with the concession** about violating strict EVM/unbounded utility. Frame the cap as a *consequence* of rejecting unbounded utility in practice.
      2.  **Acknowledge the formal weaknesses** (dominance, money pumps) upfront. Don't hide them. Argue they are the price of avoiding insanity.
      3.  **Be prepared to pivot to the bounded utility argument** (The Dreaded Question). It's stronger philosophically. Your cap becomes an *implementation* of bounded utility under the hood.
      4.  **Emphasize the practical epistemic argument:** "We cannot reliably model or distinguish probabilities and utilities at the scales where fanaticism bites." This resonates with the stats-curious and provides a practical justification even if the formal one is messy.
      5.  **Use concrete examples:** Contrast a credible high-impact longshot (e.g., 1% chance of reducing existential risk by 1%) with Pascal's Mugging and an outlandish EA longshot. Ask where *their* line is.

  **You can defend the cap as a pragmatic necessity, but anchoring it in the need for *bounded rationality* or *bounded utility* in the face of deep uncertainty makes your position far stronger and less assailable on formal grounds.** Good luck!
