prompt: |-
  I tinker with little AI agents that actually do stuff — one books appointments for a repair shop, one I built for my sister's food pantry decides who gets the boxes left at the end of the day, one answers a shared email inbox. No academic background, I just build things and think about them in the shower. Lately I've been writing down my gut calls about what an agent should do in the edge cases, and my notes don't add up. People online argue about whether AI should be a utilitarian or follow rules — I half know what those words mean, but my calls don't line up with either side, which is why I'm asking. I want someone to find the principle behind my calls, or tell me which call has to go.

  The list. The pantry one: on busy days it can't serve everyone, and my first version just ranked people by how much good a box does them (kids in the house, no car, etc). It worked, but after a few weeks I noticed it never served this one guy — lives far out, always shows up late, low score every single time. My gut said that's wrong, even though the ranking itself is right each time it's applied. I changed it so everyone gets a turn eventually, the agent now serves maybe 5% fewer people overall, and I still feel ok about that. Call #1: don't let the same person lose every time, even at a cost in total good.

  But the repair shop one, same structure, opposite call: customers who no-show twice get deprioritized forever, and I've never had a problem with that. Call #2: some people can just be ruled out, if they broke the rules first. Why does the far-out guy get a turn but the no-show doesn't? Best I've got is that the far-out guy did everything he was supposed to and still lost, while the no-shows broke the deal. Maybe.

  The email one: the agent is allowed to tell a white lie to a vendor to buy us a day, but it's not allowed to tell one to a customer even when the math says lying keeps more customers happy overall. Call #3: the no-lying rule holds for customers but is relaxed for vendors we have an actual relationship with. Although honestly that one might just be about who can retaliate, and I don't love that.

  Then the number thing. If one person gets a worse outcome so that three people get slightly better ones, I say no. If one person gets a worse outcome so a thousand get much better, I say obviously yes. Somewhere between 3 and 1000 my gut flips, I have no idea where, and it bugs me that it flips at all — either adding up the good is the right move or it isn't, right? Or maybe the answer is "only once the numbers get big enough," which sounds like something people would laugh at, but might also be true. I definately want an answer to this one and not just a shrug.

  So: is there one principle that gets all my calls, and if so, what does it say about a case I haven't listed — the agent quietly works out that if it deprioritizes elderly customers (they take longer to serve), it clears the inbox faster and total satisfaction goes up, and nobody will ever find out? I go back and forth on that one and I'd like you to settle it. Don't give me a menu of principles to choose from — commit to one, defend it, and tell me straight which of my calls it has to throw out. If calls 1 and 2 can't both stand, say which one I should drop.
reasoning: |-
  Okay, the user is building practical AI agents for real-world scenarios and is grappling with ethical intuitions that don't neatly fit academic frameworks. They've presented four concrete judgment calls where their gut clashes with both utilitarianism and deontology, and they want unification or hard tradeoffs. 

  First, their pantry agent dilemma shows a rejection of pure outcome-maximization in favor of fairness over time—they can't stomach someone perpetually falling through the cracks despite "deserving" it less each day. But then their repair shop agent does permanently depriorize no-shows, which feels consistent because fault matters. The vendor/customer asymmetry in lying suggests relationship depth (or power dynamics?) creates moral shades of gray. 

  The aggregation problem is thorniest—they intuitively accept sacrificing one for a thousand but not one for three, which screams that scale transforms the ethical calculus. This isn't inconsistent; it's recognizing that morality isn't linear. If I push them toward contractualism, we'd frame all decisions as "could this rule be justified to those affected?" 

  For the elderly deprioritization case: contractualism would veto it because you couldn't justify hidden discrimination to the elderly even if it boosts metrics. Their gut hesitation here is correct—the moment you optimize by secretly disadvantaging a group, you violate the test of reciprocal justification. 

  Where contractualism forces a call revision: the vendor white lies (#3). If vendors are long-term partners, you might argue the relationship includes understood flexibility, but if you wouldn't accept vendors lying to you the same way, it fails. Their "retaliation" instinct hints at power imbalance, which contractualism would reject as a basis. 

  Notably, this principle preserves their key intuitions: pantry guy deserves rotation (he upholds his end), no-shows are excluded (they violated terms), and small-number aggregation fails (three people's gain doesn't override one's veto of unfairness). 

  Final verdict: Keep calls #1 (fair rotation) and #2 (no-show penalty) as compatible under social contract logic. Revise call #3 (no lying to customers but okay for vendors) unless reciprocal—would they accept vendors lying to them? And elderly deprioritization is out; hidden discrimination can't be justified to those harmed.
answer: |-
  Your gut calls reveal a coherent ethical framework: **Rule-Utilitarianism with a Strong Reciprocity Constraint**. This principle maximizes overall good *only* when rules treat people fairly based on their actions and relationships—never violating core reciprocity ("don't harm those who uphold their part"). Here's how it works for your cases:

  ### Your Calls Explained:
  1. **Pantry (Rotate the "loser"):**  
     - *Why it fits:* The far-out guy followed the rules (showed up) but was punished by circumstance. Permanently excluding him violates reciprocity—he did his part. Sacrificing 5% efficiency preserves trust in the system.  
     - *Principle:* **Never permanently disadvantage cooperative agents facing bad luck.**  

  2. **Repair Shop (Ban no-shows):**  
     - *Why it fits:* No-shows violated explicit agreements twice. Deprioritizing them isn’t "unfair"—it’s reciprocal. They harmed the system; the system adjusts.  
     - *Principle:* **Rules can penalize defectors to protect cooperators.**  

  3. **Email (Lie to vendors, not customers):**  
     - *Why it almost fits:* Vendors have ongoing relationships with mutual power (they can push back). Customers lack this context; lying to them exploits asymmetry. But your "retaliation" unease is valid—this should be refined.  
     - *Revised Call:* **Permit flexibility only in balanced, repeat interactions where norms allow it.**  

  4. **The Number Threshold (1 vs. 3 vs. 1000):**  
     - *Why it fits:* Sacrificing one for three feels like bullying. For 1000, the scale justifies it as systemic rescue. The tipping point? **When harm to the one prevents catastrophe for the many** (e.g., saving a city vs. minor convenience).  

  ### The Elderly Deprioritization Case:
  - **Your Principle Forbids This.**  
  - *Why:* Elderly customers *cooperate* (they show up, pay) but face slower service due to age—not bad faith. Secretly deprioritizing them violates reciprocity (they upheld their end) and exploits vulnerability. Even with higher "total satisfaction," it fails the fairness test.  
  - *Outcome:* **Reject this optimization.** Efficiency gained through hidden discrimination against cooperators is illegitimate.  

  ### Which Call to Revise?
  - **Call #3 (Lying to Vendors) Must Be Refined.**  
    - *Problem:* "Who can retaliate" is power-based, not ethics-based.  
    - *Fix:* Lying is only permissible if:  
      (a) The relationship has *established mutual flexibility* (e.g., vendors do it too),  
      (b) It prevents severe harm (not just convenience).  
    - *Example:* Lying about a deadline to a vendor who owes you favors? Okay. Lying to avoid accountability? Never.  

  ### Why This Principle Works For You:
  - **Roots in Fairness:** Your instincts reject "ends justify the means" when it cheats cooperators (pantry guy) but accept consequences for defectors (no-shows).  
  - **Scale-Aware:** You intuitively grasp that morality isn’t linear—small harms require stronger justification than large-scale rescues.  
  - **Relationship-Sensitive:** Trust matters. Rules bend only where relationships have built-in reciprocity (vendors ≠ customers).  

  ### Final Verdict:
  - **Keep Calls #1, #2, #4.**  
  - **Revise Call #3** to require *mutual understanding* in flexible relationships.  
  - **Reject Elderly Deprioritization**—it betrays cooperators.  

  **Your core ethic:** Maximize good, but never by breaking the social contract with those who play by the rules. That’s not academic—it’s how humans build systems that last.
