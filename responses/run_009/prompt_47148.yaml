answer: |-
  Here are eight focused interview questions with expected answers and challenging follow-ups (395 words):

  1.  **Question:** You frame the Hitchhiker solution as "precommit or be irrational," but critics call this "rationally requiring irrationality" – a contradiction. Why isn't admitting *rationality itself* forces you into an *irrational* act in some contexts a sign the theory is flawed?
      *   *Expected Answer:* CDT *defines* rationality by causal efficacy; refusing to pay *is* rational *by that definition*. "Irrationality" here just means suboptimal outcome, not violating CDT.
      *   **Follow-Up:** But doesn't defining rationality in a way that *systematically* produces suboptimal outcomes in predictable interactions (like with predictors) render the concept practically self-defeating? Is "rational" useful if it means "losing"?

  2.  **Question:** In Newcomb-like problems, a genuinely *irrational* agent (e.g., someone who *always* pays) gets predicted as trustworthy and gets the reward, while the CDT agent gets predicted as untrustworthy and loses. Doesn't this show that *being rational by CDT standards* is *actively harmful* to achieving your goals in these cases?
      *   *Expected Answer:* Yes, sometimes having a *different* decision theory or disposition yields better results. But that doesn't make the *choice* to pay *now*, given what you know *now*, causally rational for the CDT agent.
      *   **Follow-Up:** If the *property* of being CDT-rational *causes* worse outcomes in crucial, predictable scenarios, why privilege that specific definition of rationality over one that actually wins?

  3.  **Question:** You argue the driver doesn't cause your choice; you already know your decision beforehand. But doesn't this self-knowledge *within the agent itself* undermine CDT's core assumption of causal independence? If *your own future choice* is effectively a fixed state you're reacting to, isn't paying *causing* you to be saved (via the driver's prediction)?
      *   *Expected Answer:* No. The driver's prediction is based on knowledge of your *disposition* (which is fixed beforehand). The *act* of paying *now* doesn't cause the *past* prediction or rescue. Your disposition caused both.
      *   **Follow-Up:** If the agent's *own* pre-existing knowledge/decision state acts as a fixed "screening off" factor making the current act causally inert regarding the payoff, doesn't this show CDT's core causal model is too narrow for agents with self-prediction?

  4.  **Question:** You distinguish failing to precommit from a flaw in CDT itself. But if precommitment is the *only* rational (by CDT's lights) way to get the best outcome in these pervasive predictor problems, doesn't it show CDT is *structurally incapable* of guiding optimal action *in the moment*?
      *   *Expected Answer:* No. It shows rationality is time-extended. Failing to set up the right causal structure (via precommitment) *earlier* is the mistake, not CDT's verdict *later*.
      *   **Follow-Up:** Isn't this just special pleading? If the *only* way to make CDT functional in key real-world interactions is to constantly build elaborate external constraints to *bypass* its moment-by-moment prescriptions, doesn't that reveal a critical weakness *in CDT* for guiding situated agents?

  5.  **Question:** You've joked you'd "have no problem being a person who pays... just not one when it counts." If you wouldn't *be* that person "when it counts," why should anyone else adopt a theory that tells them *not* to pay when it counts?
      *   *Expected Answer:* (Likely deflects to disposition/precommitment) The point is to *arrange* to be the trustworthy type beforehand, not to make the irrational choice later.
      *   **Follow-Up:** **Let's make it concrete: If building an AI to represent your interests in critical negotiations, would you program it with strict CDT? Knowing it would abandon you in a Hitchhiker scenario?**
      *   *Expected Answer:* No, I'd build in precommitments or a different disposition.
      *   **Follow-Up:** Doesn't admitting you wouldn't use raw CDT for a high-stakes AI prove that CDT, *on its own*, is inadequate for rational agency in a world with prediction? Why prioritize its definition?

  6.  **Question:** Does CDT require agents to be *ignorant* of their own decision-making process or its predictability to function correctly? If an agent perfectly foresees its own CDT-driven choice, doesn't that collapse the distinction between causal and evidential reasoning *for that agent*?
      *   *Expected Answer:* No. Knowing *how* you'll decide doesn't change the causal structure. The driver's prediction is still evidence, not an effect of the later act.
      *   **Follow-Up:** But if the agent knows "My CDT disposition means I won't pay, which means the driver predicted that, which means I'm stranded," doesn't this chain of evidence *determine* the outcome *before* the act, making the act itself a mere formality? How is that causal independence?

  7.  **Question:** If rationality is about winning, and CDT loses in Hitchhiker (without precommitment), while something like EDT or TDT wins, why cling to CDT? Isn't that elevating formalism over results?
      *   *Expected Answer:* No. Rationality is about reasoning correctly *given your beliefs and desires*. CDT gets the causal structure right. Winning isn't the sole criterion; correct reasoning is.
      *   **Follow-Up:** If "correct reasoning" consistently leads to losing in well-defined problems, what's the value of that correctness? Isn't instrumental rationality fundamentally about achieving goals?

  8.  **Question:** Where do you draw the *principled* line between "You should have precommitted" (user error) and "Your decision theory has a structural flaw"? What specific feature would signal the latter for you?
      *   *Expected Answer:* CDT's flaw would be if its core causal calculation was *internally* inconsistent or gave clearly wrong answers in *non*-predictor, pure causal problems. Predictor problems are solved by managing dispositions.
      *   **Follow-Up:** But if the *only* problems CDT "fails" are the very ones involving agency, prediction, and correlation – central features of the social world – isn't that flaw significant enough? How many paradigmatic failures does it take?
