  **Part 3: Engineering breakdown**

  In the original manipulable case (part 1, plurality voting), the theorem's premises that were at work were: more than two alternatives, the rule was onto (every movie could win), non-dictatorial, and the domain was unrestricted (any preferences allowed).

  The escape hatch we used in part 2 was domain restriction: we restricted to single-peaked preferences (along the axis of seriousness: Comedy, Action, Drama). The change was that we assumed every roommate's preferences had a single peak on that axis. This made the median voter rule strategy-proof.

