  **Part 2: Escape hatch via domain restriction**

  We will restrict the domain of preferences to single-peaked preferences. In particular, we assume that the movies can be ordered on a line, say by "seriousness": Comedy < Action < Drama (Comedy is least serious, Drama is most serious, Action in between).

  Single-peakedness requires that each voter's preferences have a single peak, meaning that as we move away from their favorite movie in either direction on the line, the preference decreases.

  So the order is: C (Comedy) -- A (Action) -- D (Drama)

  Possible single-peaked preferences are those that are either:
  - Peak at C: then must be C > A > D
  - Peak at A: then can be A > C > D or A > D > C
  - Peak at D: then must be D > A > C

  Now, we will use majority voting, but for three alternatives, we can use a runoff system. However, the theorem holds for any voting rule, so we want a rule that is strategy-proof on single-peaked preferences. One such rule is the median voter theorem.

  For single-peaked preferences, the median voter's peak is the Condorcet winner. So we can use the rule: the winner is the median of the peaks.

  Let's define the rule: the voters report their peaks. Then we order the movies on the line: C, A, D. The peaks are reported, and then we take the median peak.

