  - Part 1: Plurality voting, Alex lied by voting for their second choice (Drama) to prevent their least favorite (Action) from winning, and it worked.
  - Part 2: We restricted preferences to single-peaked along a known axis, used the median voter rule, and showed that in that case, no one has an incentive to lie.
