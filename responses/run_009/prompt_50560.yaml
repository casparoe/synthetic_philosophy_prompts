  First, I need to recall the villanelle structure: 19 lines, five tercets and a quatrain, with two alternating refrains and an ABA rhyme scheme. The refrains should split the concept as requested: values = "What voters name with ballot's mark" and beliefs = "What prices speak in light and dark." These lines must work both as standalone phrases and when combined.

