  The deeper critique—that values and beliefs aren't separable—must surface subtly. Words like "signals," "wagers," and "splitting" in the final couplet can hint at how welfare measures embed value judgments. Rhymes need to feel natural: "mark/dark/arc," "design/sign/line," etc., avoiding forced jargon.

  Stanza planning is crucial. The first tercet introduces both refrains. Middle stanzas explore tensions: voters wanting signals (stanza 2), traders silenced by losses (stanza 3), conditional markets (stanza 4), welfare measurement as value-laden (stanza 5). The quatrain resolves with the merged refrains and the skepticism ("a splitting art").

  Ending on "a splitting art" leaves the objection lingering—clean for Hanson fans, thoughtful for skeptics. Checking syllable flow: refrains are 8 syllables each, others around 10, maintaining iambic rhythm. Avoiding "futarchy" explicitly keeps it poetic while clear to insiders.
answer: |-
  ## Policy by Price

  What voters name with ballot's mark  
  Defines the welfare we pursue.  
  What prices speak in light and dark  

  Reveals the path through chaos stark –  
  Not what we wish, but what is true.  
  What voters name with ballot's mark  

  Is tangled with the tribal spark –  
  A signal sent, a public view.  
  What prices speak in light and dark  

  Survives the test (traders broke and hushed  
  Who guessed the winds that never blew).  
  What voters name with ballot's mark  

  Gets measured first, a sovereign arc  
  We bet *on*, not decide anew.  
  What prices speak in light and dark  

  Is sharp and swift, a called-off bet  
  If policies fall through.  
  What voters name with ballot's mark,  
  What prices speak in light and dark –  
  The wagers judge the welfare start:  
  **A splitting art.**

  ---

  **Why this works for your meetup:**

  1.  **The Split Refrains:**
      *   **Values (Ballot):** "What voters name with ballot's mark" – Captures the essence of defining the goal (welfare) via vote. "Mark" evokes both the act of voting and the defined target.
      *   **Beliefs (Market):** "What prices speak in light and dark" – Emphasizes the market's constant, objective-*seeming* voice ("speak") regardless of sentiment ("light and dark"). "Prices" grounds it firmly in the mechanism.

  2.  **Placement & Skepticism:**
      *   **Isolation:** The refrains alternate, emphasizing their separation throughout the poem, mirroring Hanson's core idea.
      *   **Tangling Values (Stanza 2):** "Is tangled with the tribal spark – / A signal sent, a public view." Directly addresses the objection that voter values aren't pure; they include social signaling.
      *   **Welfare Measure as Value (Stanza 5 & Final Couplet):** "Gets measured first, a sovereign arc / We bet *on*, not decide anew." Highlights the crucial, value-laden step of *defining and measuring* welfare before the market acts. The final couplet's "The wagers judge the welfare **start**" reinforces this – the market bets on the policy's impact *on the pre-defined measure*, which itself was a value judgment. "A splitting art" ends on the skeptical note: it's an attempt, an art, perhaps not perfectly clean.

  3.  **Prediction Market Accuracy (Subtle):**
      *   **"Survives the test (traders broke and hushed / Who guessed the winds that never blew)":** Traders who are wrong lose money and fade away ("broke and hushed"). "Winds that never blew" hints at misjudging uncertain futures.
      *   **"Is sharp and swift, a called-off bet / If policies fall through":** Explicitly mentions conditional markets ("called-off bet") if the policy isn't implemented. "Sharp and swift" captures market responsiveness.
      *   **"The wagers judge":** Focuses on the core mechanism – betting *on* the outcome *relative to the metric*.

  4.  **Form & Flow:**
      *   **Standard Villanelle:** 19 lines, ABA rhyme scheme (mark/dark/arc, pursue/true/view, hushed/bled, etc.).
      *   **Final Couplet:** Brings the two refrains together for the first time side-by-side ("What voters name... / What prices speak...") immediately followed by the skeptical conclusion ("The wagers judge... A splitting art").
      *   **Accessibility:** Uses core concepts ("voters," "ballot," "prices," "wagers," "bet," "policies," "welfare") familiar to anyone interested in markets/governance, without requiring deep Hanson theory. The *ideas* resonate with the cognoscenti without relying on jargon.

  This villanelle structurally embodies the "split" of futarchy while weaving in the critical nuance your group debates, ending on a note that acknowledges the proposal's ambition and its inherent challenge – perfect for closing your year-end session.
