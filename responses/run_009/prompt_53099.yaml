answer: |-
  ## Joint Statement: Internal and External Reasons After Adversarial Collaboration

  **Preamble:** We, a neo-Humean defender of Bernard Williams’s internal reasons thesis (IR) and a proponent of unconditioned external reasons (ER), having engaged in sustained adversarial collaboration, present this statement. We aim not for final resolution, but to clarify the current state of the debate for informed readers familiar with Williams’s core thesis. We document areas of agreement, pinpoint persistent disagreements phrased acceptably to each side, identify crucial test points (cruxes), and state our divergent predictions about them.

  **1. Agreed Claims:**

      1.  **The Deliberative Route:** Both sides accept that *for an agent to have a reason to φ, that reason must be capable of being reached via sound deliberative reasoning* starting from that agent’s "subjective motivational set" (S) – their existing desires, dispositions, commitments, and projects. The ER theorist agrees this is the *practical route* by which reasons become motivationally efficacious.
      2.  **Distant vs. Pathological Deliberators:** We agree on a distinction between:
          *   **Merely Distant Deliberators:** Agents whose S contains elements that, through sound deliberation (including expanding information, correcting factual errors, considering implications, achieving coherence), could lead them to recognise a reason to φ. Their current failure to see the reason stems from deliberative limitations, not a fundamental incapacity relevant to their S.
          *   **Genuinely Pathological Deliberators:** Agents whose S is such that *no* possible sound deliberative route exists from it to recognising a reason to φ, even under conditions of full information and maximal instrumental and coherence-based reasoning. Their motivational set constitutively blocks access to that reason.
      3.  **Core Explananda for Internalism:** We agree that the IR theorist bears the burden of explaining, rather than explaining away, the following phenomena:
          *   **The Amoralist:** An agent who understands the demands of morality, possesses normal capacities for sympathy or commitment, yet remains entirely unmoved by them. This agent's S contains no element grounding moral concern.
          *   **The Future-Indifferent Agent:** An agent who understands the consequences of their actions for their own future well-being (e.g., severe harm) but feels no motivation whatsoever to avoid that harm. Their S contains no disposition towards prudential concern.
          The IR theorist must account for how (or if) such agents could rationally come to see moral or prudential reasons *without* simply declaring them irrational or non-agents *ex definitione*. The ER theorist accepts that the IR theorist has a substantive challenge here.

  **2. Persistent Disagreements:**

  | Disagreement Point                                                                 | Internalist (Neo-Humean) Phrasing (Accepted by IR)                                                                 | Externalist Phrasing (Accepted by ER)                                                                                                                               |
  | :--------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------------------------------------------------------------------------ |
  | **1. Status of the Internal Reasons Thesis**                                       | "The IR thesis is analytic: it simply unpacks the *concept* of a practical reason. A 'reason' that cannot motivate *that agent* via sound deliberation isn't *for* them." | "The IR thesis is a substantive metaphysical claim (false) or a restrictive legislative proposal about language use (undesirable), denying the existence of reasons that transcend an agent's contingent S." |
  | **2. Idealisation & Smuggling Norms**                                              | "The ER theorist's appeal to an 'idealised deliberator' inevitably smuggles substantive, controversial norms of rationality (beyond instrumental coherence and information correction) into the starting S of the *actual* agent, thereby collapsing into a form of internalism or begging the question." | "Idealisation involves only procedural norms essential to deliberation itself (e.g., consistency, means-end efficiency, full information). It reveals reasons latent in the *objective normative landscape*, accessible to *any* rational agent, not norms smuggled into the agent's contingent S." |
  | **3. Coherence of Non-Motivating Reasons**                                         | "An 'external reason' that cannot *in principle* (even under ideal deliberation) connect to *any* element within an actual agent's S, and thus could never motivate *that agent*, is not a genuine normative item. It is a 'philosopher's shadow' – a confusion or a category error." | "External reasons exist objectively, independent of any agent's S. That a particular agent (even under ideal deliberation) cannot be motivated by a genuine reason due to their pathological S reflects a *failure in the agent*, not an incoherence in the reason itself. The reason retains its normative force." |

  **3. Cruxes of the Dispute:**

  We identify the following points as central hinges upon which the dispute turns. We agree on the relevance of each case/argument and state our respective predictions in advance.

      1.  **Crux: Normative Force Without Possible Motivational Uptake**
          *   **Case/Argument:** Consider Schopenhauer’s example: "A stone has a reason to fall upwards." Or a reason demanding an agent sacrifice themselves for a cause they find utterly abhorrent and alien, where no sound deliberative route exists from their S to this conclusion, even ideally. *Does this purported 'reason' possess genuine normative force for that agent?*
          *   **Internalist Prediction:** This case shows the incoherence of attributing normative force *for an agent* to something that could never, even in principle, motivate them or be seen by them as a reason. It has no practical relevance *to them*. The feeling of normative force here is illusory, stemming from the observer's perspective.
          *   **Externalist Prediction:** This case shows precisely the existence of normative truths transcending individual psychology. The stone *objectively should* fall downwards, regardless of its 'motivations'. The agent *objectively ought* to embrace the sacrifice due to the inherent value of the cause, even if their psychology tragically blinds them to it. The normative force is real, the failure is the agent's.
          *   **Relevance:** Bears directly on Disagreement Point 3 (Coherence of Non-Motivating Reasons).

      2.  **Crux: The Amoralist's Indifference - Fault or Difference?**
          *   **Case/Argument:** Williams’s amoralist (or the future-indifferent agent): Fully informed, coherent, instrumentally rational, but utterly unmoved by moral (or prudential) considerations. *Is their indifference a rational fault, a normative failing? Or is it merely a brute difference in their motivational constitution, with no rational deficiency implied beyond perhaps instrumental incoherence (if applicable)?*
          *   **Internalist Prediction:** This case shows that the amoralist's indifference, while perhaps lamentable or dangerous, is not itself an *internal rational failing* if their S is coherent. The intuition that it *is* a fault often stems from importing the externalist's normative standards illegitimately. The IR theorist *can* capture intuitions of fault via contingent features of most S's (e.g., undermining social cooperation needed for other desires) or by highlighting *prudential* faults if applicable, but not a *sui generis* rational moral fault grounded purely in external reasons.
          *   **Externalist Prediction:** This case shows the fundamental inadequacy of internalism. The strong intuition that the amoralist is *rationally defective* in their indifference, not just different, is correct. It points to the existence of objective moral reasons that bind any rational agent. The IR theorist's attempts to capture this fault via contingent features of S or prudential concerns fail because the fault is *specifically moral and rational*, inherent in rejecting the demands of morality itself. This intuition cannot be fully explained away internally.
          *   **Relevance:** Bears directly on Disagreement Point 1 (Status of IR) and the Agreed Claim 3 (IR's burden re: Amoralist), and indirectly on whether idealisation smuggles norms (Point 2).

  **4. Verbal Dispute?**

  We concur that **a significant component of the disagreement concerning the *status* of the Internal Reasons Thesis (Disagreement Point 1) is plausibly verbal.** The dispute hinges partly on what the term "a reason" (or "a reason *for an agent*") fundamentally *means* or what concept it expresses.

  *   The Internalist uses "reason" in a constitutively motivation-linked, agent-relative sense. For them, "X has a reason to φ" *means* "X could be motivated to φ by sound deliberation from their S."
  *   The Externalist uses "reason" in a constitutively normative, potentially agent-transcendent sense. For them, "X has a reason to φ" *means* "There exists an objective normative truth/fact counting in favour of X φ-ing," irrespective of X's psychology.

  Much of the disagreement in Point 1 stems from these different starting definitions/conceptions. Recognizing this verbal element doesn't resolve the underlying metaphysical and normative disagreements (Points 2 & 3 and the Cruxes), but it clarifies that one core battleground is over the very concept we are debating. The disputes over idealisation (Point 2) and the coherence of non-motivating reasons (Point 3), however, involve substantive non-verbal disagreements about the nature of rationality, normativity, and the connection between the objective and the subjective. The Cruxes highlight these substantive clashes.
