prompt: |-
  Draft the joint statement that a neo-Humean theorist of internal reasons and a defender of unconditioned external reasons could both sign after a long adversarial collaboration, aimed at readers who already know Bernard Williams's internal reasons thesis but want to see the current state of the dispute. Include the claims both can accept — about the deliberative route from an agent's existing motivations, about the difference between merely distant and genuinely pathological deliberators, and about which examples (the amoralist, the person indifferent to their own future) the internalist must explain rather than explain away. Then set out the exact remaining disagreements, each phrased so that its own side would accept the wording: in particular whether the internal reasons thesis is analytic, a substantive metaphysical claim, or a proposal for legislating how the word "reason" is to be used; whether the externalist's idealised deliberator smuggles substantive rational requirements into the starting set; and whether an external reason that cannot in principle guide deliberation is a coherent normative item or a philosopher's shadow. Identify the cruxes — I suspect one is whether normative force without possible motivational uptake makes sense, and another is whether the internalist can capture the intuition that the amoralist's indifference is a fault rather than a difference — and for each crux give a case, argument, or thought experiment both sides agree bears on it, recording each side's prediction in advance about what the case shows. Say explicitly whether any part of the dispute strikes you as verbal, and if so which part and why. Answer in British English, formatted as a numbered agreed-claims section followed by a disagreements table with a cruxes subsection beneath it.
