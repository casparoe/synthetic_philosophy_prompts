prompt: |-
  I'm a third-year undergraduate taking a seminar on the ethics of eating, and I also coordinate a small campus food-advocacy group: about a dozen student volunteers, a modest budget, and one semester left before we have to finalize next year's campaign messaging. A recent meeting left the group badly split, and I've realized we can't decide what our campaign should say until we decide which of the underlying questions actually matter.

  The split went roughly like this. One member pressed the arithmetic that swapping beef for chicken is a disaster on almost any view of animal welfare: a single cow yields hundreds of pounds of meat while a chicken yields only a few, so per-meal chicken consumption means vastly more animals killed and reared, under conditions that are arguably worse per animal. On that view, our generic "eat less red meat" messaging could make things worse. A second member countered that crop cultivation itself kills enormous numbers of invertebrates through plowing, pesticides, and harvest, and that given our deep uncertainty about invertebrate sentience, we can't even be confident a fully plant-based diet reduces suffering relative to a diet built around grass-fed ruminants. A third thought all of this was scope-obsessed navel-gazing, and that we should just keep the message simple: eat less meat, full stop.

  I'm not asking you to referee the meeting. Given what we are — students with a semester, a small budget, and influence over cafeteria purchasing and a public campaign, not a research lab — I want a prioritized account of which open questions we actually need answers to and which we can safely fence off. Some candidates: how sensitive is the beef-versus-chicken replacement argument to per-animal welfare estimates, and does it survive if one doubts that badness scales in any simple way with lifespan or time-to-slaughter? Does the invertebrate-death question hinge on settling invertebrate sentience, or only on better data about animals killed per calorie of each crop? Is the general problem of moral weights — comparing a cow's suffering to a chicken's to an insect's — upstream of everything we do, or can we get by with a few robust, widely shared assumptions? And are there questions I haven't listed that should outrank all of these, such as whether individual consumption changes even translate into changed production one-for-one?

  Rank the questions by how much they should matter for our decision, defend the ordering explicitly — including your criteria and why you weight them as you do — and say what new evidence would move items up or down. Where a question can be set aside for our purposes even though it remains genuinely open, explain what lets us set it aside.
reasoning: |-
  Okay, the user is part of a campus food-advocacy group that's split on their campaign messaging. They need to prioritize which ethical questions to address given their limited resources and time. Let me start by understanding their main concerns.

  First, the group is divided into three positions: one argues that swapping beef for chicken increases animal suffering because more chickens are killed per meal. Another points out that crop cultivation kills invertebrates, questioning if plant-based diets are better. The third wants a simple "eat less meat" message. The user needs to know which questions they must resolve versus which can be set aside.

  Their constraints are important. They're students with one semester, a small budget, influence on cafeteria purchases, and a public campaign. They can't conduct deep research but need actionable decisions. The core issue is prioritizing questions based on impact, tractability, and alignment with their goals.

  I should identify the key questions they listed. The beef vs. chicken swap sensitivity, invertebrate deaths dependency on sentience, moral weights comparison, and whether individual consumption affects production. Plus, they mentioned if there are higher-priority questions.

  Ranking these, the top priority should be the link between consumer choices and production changes. If their campaign doesn't lead to actual reductions in meat production, the other ethical debates are moot. This is a fundamental effectiveness question. Evidence here would be studies on demand elasticity or case studies of similar campaigns. If they find their actions don't influence supply, the campaign's approach needs rethinking.

  Next, the beef vs. chicken argument. Since cafeteria decisions likely involve switching between meats, this is highly relevant. They need to assess if promoting chicken over beef increases suffering. Even without precise welfare metrics, the sheer number of chickens killed compared to cows is a strong factor. If new data shows chicken welfare improvements or beef's environmental impact outweighs animal welfare, that could change things.

  The invertebrate sentience question is tricky. Current evidence on sentience is limited, and crop deaths vary widely. But since their campaign focuses on meat reduction, the invertebrate issue might be secondary. Emphasizing whole plant foods over processed ones could mitigate this, but it's not central to their main message. If solid evidence emerges on sentience, they'd need to adjust, but for now, it's lower priority.

  Moral weights comparison is too abstract. Without consensus or clear metrics, trying to compare cow vs. insect suffering isn't feasible. They can rely on existing animal welfare science and avoid this rabbit hole.

  Unmentioned priorities? Ensuring messages don't backfire (e.g., promoting chicken over beef causing more harm) and practical impact on cafeteria choices. Also, aligning with student values to maximize engagement.

  So, the order should be: production impact first, then beef vs. chicken, invertebrate sentience, and moral weights last. This order focuses on actionable, high-impact factors given their constraints. They can set aside unresolved philosophical issues if they don't alter the campaign's effectiveness. New evidence on demand elasticity or animal welfare metrics would shift priorities, but for now, they should focus on what's tractable.
answer: |-
  Here’s a prioritized framework for your campaign decisions, grounded in **practical impact, tractability with limited resources, and risk mitigation** – not philosophical perfection. The ranking weighs:  
  1. **Magnitude of potential harm/benefit** (scale of suffering affected)  
  2. **Likelihood of impact** (can your campaign influence this?)  
  3. **Tractability** (can you get "good enough" answers with your constraints?)  
  4. **Risk of unintended consequences** (could your message backfire?)  

  ### Prioritized Questions & Rationale
  1. **Does reduced individual meat consumption reliably reduce production?**  
     **Why #1:** If your campaign doesn’t change actual demand (e.g., due to rigid supply chains, waste dynamics, or substitution effects), *all other ethical debates are irrelevant*. This is the foundational lever of impact.  
     **Tractability:** Review studies on demand elasticity for meat in institutional settings (e.g., [WRI’s work on college cafeterias](https://www.wri.org/research/shifting-diets)). Campus procurement data may show past responsiveness.  
     **Set aside if:** Cafeteria managers confirm orders adjust to student choices, or if peer campaigns show measurable drops in orders after advocacy.  
     **New evidence:** Data showing your specific cafeteria supplier adjusts orders quarterly based on consumption patterns.  

  2. **How robust is the "beef-to-chicken swap increases suffering" argument?**  
     **Why #2:** This directly challenges your current messaging and risks *increasing harm* if wrong. It’s highly actionable (targeting cafeteria swaps) and has large magnitude (100s of chickens vs. 1 cow).  
     **Tractability:** Use existing animal welfare science (e.g., [EA Animal Welfare Fund reports](https://animalcharityevaluators.org/research/)):  
     - Even conservative estimates show 200+ chicken lives per cow life for equivalent protein.  
     - Chicken suffering intensity (e.g., overcrowding, slaughter speed) is well-documented as severe.  
     **Set aside:** Lifespan debates don’t negate the scale disparity. If chickens suffer 1/100th as much as cows per minute (unlikely), swapping beef for chicken *still* causes net more suffering.  
     **New evidence:** If data emerges showing chicken farms now provide near-ideal welfare while beef systems collapse into extreme cruelty.  

  3. **Do crop deaths undermine plant-based diets’ ethics?**  
     **Why #3:** Important philosophically, but lower risk for your campaign.  
     - **Magnitude:** Uncertainty is high (invertebrate sentience unproven), but vertebrate deaths from feed crops *are* certain.  
     - **Risk:** Your "eat less meat" message likely *reduces* crop deaths (80% of soy feeds livestock, not humans).  
     **Tractability:** Use aggregate studies (e.g., [Poore & Nemecek 2018](https://science.sciencemag.org/content/360/6392/987)): Switching to plants reduces land use by 76%, implying fewer field deaths.  
     **Set aside:** Focus on *relative* impact. Even with high invertebrate deaths, plants require far less cropland than feeding animals. Grass-fed beef’s land inefficiency makes it worse overall.  
     **New evidence:** Robust proof that invertebrates suffer like mammals *and* that regenerative grazing avoids more deaths than low-till vegan farming.  

  4. **Do we need precise moral weights (cow vs. chicken vs. insect)?**  
     **Why Last:** Intractable with your resources and unlikely to change campaign decisions.  
     - **Robust assumptions suffice:** All credible welfare research ranks chickens below cows in capacity for suffering. Insects are orders of magnitude more uncertain.  
     - **Campaign-level need:** You only need to know if Option A is *clearly better* than Option B – not exact ratios.  
     **Set aside entirely:** Adopt the precautionary principle: Prioritize vertebrates with complex nervous systems. If insects matter, reducing agriculture’s footprint (via less meat) still helps.  

  ### Unmentioned Priority: Message Efficacy
  - **Should outrank #3-4:** Test messages for clarity and persuasiveness (e.g., A/B test flyers). A flawed-but-adopted message beats a perfect-but-ignored one.  
  - **Tactical solution:** "Swap beef for plants, not chicken" avoids the pitfall while keeping it simple.  

  ### Recommended Path Forward
  1. **Meet with cafeteria managers** to verify how procurement responds to demand shifts (#1).  
  2. **Drop "red meat" messaging.** Replace with:  
     - *Primary:* "Choose plants over meat." (Avoids beef/chicken trap)  
     - *Secondary:* "If eating meat, avoid chicken from crowded farms." (Addresses #2 if chicken is a campus staple)  
  3. **Ignore invertebrate debate** publicly. Internally, note that promoting whole plants (not monocrop soy) reduces pesticide-heavy farming.  
  4. **Track campaign impact** via cafeteria purchase data – adjust if beef consumption drops but chicken soars.  

  **Why this works:** It sidesteps intractable philosophy by focusing on high-confidence, high-leverage actions. You don’t need to solve animal sentience to know that persuading 1,000 students to eat beans instead of chicken prevents far more suffering than debating cricket pain receptors. Prioritize the battles you can win with your resources.
