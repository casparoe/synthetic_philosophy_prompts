prompt: |-
  I write about science and ideas for a national daily, and I have been invited onto the external advisory panel of our statistics office's new National Wellbeing Programme. The panel must decide at Thursday's meeting what the headline indicator will be anchored on, because the treasury wants a single number it can monetise and set against GDP in cost-benefit appraisals of policy. Three options are on the table. The first derives welfare from behaviour: what people pay for clean air and quiet, where they choose to move, how they trade off commuting time against pay — on the argument that choice is the only evidence of utility that is ever put to a test. The second builds the index from day-reconstruction and experience-sampling surveys, on the argument that choices mispredict, and quietly adapt to, what life is actually like hour to hour. The third refuses aggregation and publishes a dashboard of separate measures. A pilot we ran on a proposed clean-air zone sharpened the disagreement: the behavioural valuation came out at a small fraction of the survey-based one, because residents of polluted districts had adjusted both their housing choices and their answers to the life-satisfaction questions. Please draft the decision memo I will circulate before the meeting. It should recommend one option concretely, with a timeline and a protocol for handling divergences between the measures; it should engage seriously with the strongest argument for the losing side rather than caricaturing it; and it should state plainly, in terms a general reader could follow in my newspaper, what each option commits us to claiming about what utility is — whether it is whatever a person's choices maximise, something her choices can systematically miss, or nothing that admits of a single number at all.
reasoning: |-
  Okay, the user is a science and ideas writer for a national daily who's been invited to an external advisory panel for a National Wellbeing Programme. They need to draft a decision memo before Thursday's meeting. The panel has to choose a headline indicator anchored on one of three options: behavioral valuation, survey-based measures, or a dashboard approach. The treasury wants a single number to compare with GDP for policy appraisals. 

  The user's memo needs to recommend one option concretely, provide a timeline and protocol for handling divergences, engage seriously with the strongest argument of the losing side, and explain each option's view of utility in plain terms. The pilot on the clean-air zone showed a big gap between behavioral and survey-based measures because residents adapted both behavior and survey responses. That's a crucial point.

  First, I should unpack the three options. The behavioral approach sees utility as revealed through choices—like paying for clean air or commuting trade-offs. The core idea is that choices are the only real test of what people value. The survey approach thinks choices can be misleading because people adapt to poor conditions, so it asks about moment-to-moment experiences. The dashboard refuses to boil it down to one number, arguing utility is too complex for that.

  The clean-air pilot is key here. It showed behavioral values were much lower than survey values because people in polluted areas adapted—they didn't pay more to move, and they reported higher life satisfaction despite pollution. That's a strong case against behavioral methods missing hidden suffering, but also against surveys being swayed by adaptation. 

  For the recommendation, a single number is required by treasury, so the dashboard isn't viable as the headline, though it could complement. Between behavioral and survey, the survey approach seems better—it directly captures lived experience, which matters for wellbeing. The strongest counterargument is that choices are "real" while surveys are subjective, but the pilot shows choices can normalize bad situations. 

  The memo should be structured clearly: intro, analysis of options with utility definitions in simple terms, recommendation, then timeline and divergence protocol. The divergence part is critical—when measures clash, like in the pilot, we need a way to investigate why (e.g., surveys for adaptation signs, behavioral data for constraints). 

  Timeline-wise, we'd finalize the survey design by end of year, pilot in Q1, full rollout by mid-next year. For engagement, the memo must treat the behavioral argument fairly—not caricature it as "people always know best," but acknowledge its rigor while showing its blind spots. 

  Plain language is vital. For utility definitions: behavioral says "your choices show what you value"; survey says "your feelings matter even if you don't act on them"; dashboard says "wellbeing is many things, no one number fits all." 

  User's deeper needs: They're a science writer, so clarity and intellectual honesty are key. They need this memo to persuade panelists, not just dictate. Also, they might want to use similar framing in future articles, so the explanations should be reusable. The tension between treasury's simplicity and reality's complexity is a big unstated theme—handling that delicately will matter.
answer: |-
  ## Advisory Panel Memo: Recommendation for Headline National Wellbeing Indicator  
  **To:** National Wellbeing Programme External Advisory Panel  
  **From:** [Your Name], Science & Ideas Correspondent, [Newspaper Name]  
  **Date:** [Date]  
  **Subject:** Recommendation for Headline Indicator Anchoring & Protocol for Divergences  

  ### 1. Recommendation: The Experience-Sampling Survey Approach  
  After careful analysis of the three options and insights from the clean-air zone pilot, **I recommend adopting the day-reconstruction and experience-sampling survey (Option 2) as our headline indicator**, supplemented by a streamlined dashboard (Option 3) for context. This approach best captures *lived wellbeing* while providing the single monetizable metric required by Treasury.  

  **Timeline:**  
  - **Month 1–3:** Finalize survey methodology (sampling, frequency, question standardization).  
  - **Month 4:** Launch 12-month nationwide pilot.  
  - **Month 16:** Analyze pilot data, refine weighting, and publish baseline "National Wellbeing Index" (NWI).  
  - **Month 18:** Full implementation alongside dashboard (see *Divergence Protocol*).  

  ---

  ### 2. What Each Option Claims About "Utility"  
  In plain terms for public understanding:  
  - **Option 1 (Behavioural Valuation):** **Utility is what people’s choices reveal.** If you pick a higher salary over a shorter commute, your "wellbeing" is maximised by income. This trusts that actions speak louder than words.  
  - **Option 2 (Experience Surveys):** **Utility is how life feels in the moment.** Choices can be misled by habit or limited options (e.g., accepting pollution because moving is unaffordable). This prioritises lived experience over theoretical preferences.  
  - **Option 3 (Dashboard):** **Utility is too complex for one number.** Wellbeing is like health—you need multiple checks (e.g., blood pressure *and* mental health) to see the whole picture.  

  ---

  ### 3. Engaging the Strongest Counterargument: Behavioural Valuation (Option 1)  
  **The strongest case for Option 1 is its objectivity.** Choices reflect real-world trade-offs people *actually* make, not idealized aspirations. Surveys can be biased by mood, phrasing, or cultural norms. Monetizing choices (e.g., "price" of quiet) integrates seamlessly with economic models—making wellbeing tangible for policymakers. The clean-air pilot’s low behavioural valuation wasn’t "wrong"; it revealed residents *genuinely prioritised* affordability over pollution once adapted.  

  **Why this doesn’t prevail:** While behaviour is concrete, it risks mistaking *adaptation* for *wellbeing*. People in polluted areas adjusted choices *and* expectations (as surveys showed), masking unmet needs. Wellbeing policy should improve lives, not entrench resignation.  

  ---

  ### 4. Protocol for Handling Divergences  
  When behavioural, survey, and dashboard metrics conflict (e.g., clean-air pilot):  
  1. **Diagnostic Triangulation:**  
     - Commission targeted surveys to unpack *why* choices and experiences diverge (e.g., "Do you value clean air less, or can you not afford to move?").  
     - Analyze constraints (income, market failures) influencing behaviour.  
  2. **Policy Weighting:**  
     - If surveys show low wellbeing *despite* behavioural adaptation (e.g., high stated dissatisfaction in polluted areas), prioritize survey data for policy.  
     - If choices and surveys align (e.g., both favour income over commute), use behavioural data for monetization.  
  3. **Dashboard Transparency:** Publish all three metrics quarterly. The headline NWI (survey-based) anchors cost-benefit analysis, while the dashboard contextualizes discrepancies.  

  ---

  ### 5. Why This Approach Works  
  - **Balances rigor and relevance:** Surveys capture subjective wellbeing without ignoring behavioural economics.  
  - **Addresses adaptation:** Directly measures whether people are *thriving* or just *coping*.  
  - **Meets Treasury needs:** A single monetizable NWI exists, but the dashboard ensures nuanced policy insights.  

  This recommendation prioritizes wellbeing as experienced by citizens while retaining analytical robustness. I urge the panel to anchor our national conversation in what life *feels like*—not just what choices allow.  

  ---  
  **End of Memo**  
  *Approved for circulation prior to Thursday’s meeting.*
