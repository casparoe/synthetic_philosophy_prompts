prompt: |-
  You are a professional philosopher working in metaethics and moral psychology, and I'd like you to think carefully and systematically before answering: please start by brainstorming the nearby literatures and only then converge on a verdict, since I suspect the thing I'm describing sits awkwardly between several established topics.

  Some background on me: I'm a policy analyst who came to philosophy of the social sciences sideways, through behavioral economics, so forgive me if I'm describing something you people carved up decades ago and I just don't know the word for it. The pattern I keep hitting is this. In moral and political argument, the turn often comes when someone's attitude has to be classified — a community's attachment to a custom, a person's settled revulsion at a practice, a population's comfort with an arrangement — and the classification is always binary: either the attitude is a preference, an authentic input that belongs in the moral ledger, or it is a bias, noise introduced by evolutionary or cultural contingency that should be discounted or corrected. What I've noticed is not so much the difficulty of drawing the line as a characteristic asymmetry in how it gets drawn in practice: the same general kind of attitude is labeled a bias when it obstructs the conclusion the classifier favors, and a preference — even a form of moral insight — when it supports that conclusion, and neither side offers a criterion that could have been fixed in advance. A few concrete cases. In debates over novel foods, a consumer's squeamishness about cultivated meat is called naturalness bias by the technology's advocates and a legitimate food-culture preference by its opponents, with the classification tracking the pre-existing conclusion on both sides. In development contexts, a poor woman's reported contentment with her circumstances gets labeled an adaptive preference by those who want to intervene on her behalf, while the same interveners treat their own hesitations about intervening as genuine moral reservations rather than status quo attachment. And in the nudge apparatus I work around daily, the same policy machinery that debiases citizens' saving and eating choices takes their attitudes about, say, inheritance or taxation as preferences to be respected, without anything in the methodology that marks where the line falls. I'm aware of the literature on adaptive preferences, the sour grapes cases, and I know bioethicists have argued about whether disgust carries moral insight. But is there an established name for the configuration itself — the absence of a non-question-begging criterion for the preference/bias classification in moral contexts, such that the classification gets made ad hoc and effectively inherits the classifier's conclusions?

  If there is an established concept for this, give me its name, its provenance, and a careful account of how it matches and where it fails to match what I described — I am not looking for the nearest label slapped on and called an answer. If nothing established fits, say so plainly and coin a term for the configuration instead, with a definition precise enough to distinguish it from (i) status quo bias, (ii) adaptive preferences themselves, and (iii) the genetic fallacy, and with at least one boundary case where it is genuinely unclear whether your concept applies. In either case I'd want the obvious neighbors canvassed along the way — debunking arguments in experimental philosophy, reflective equilibrium, moral testimony, whatever else you judge relevant — so I can see why they fail to be the answer.

  Please write your reply as a structured short essay rather than a list of bullet points. However you conclude, the very last line of your response must be a single machine-readable line of the form Verdict: followed by either the established term you judge to fit best or, if you find none, the phrase no established term followed by your own coinage — for instance, Verdict: no established term; classifier-driven preference/bias underdetermination. Nothing may come after that line.
reasoning: |-
  Okay, this user is a policy analyst with a background in behavioral economics, struggling with a recurring pattern in moral and political arguments. They've noticed that attitudes are often classified as either legitimate preferences or mere biases based on whether they support the classifier's conclusion, without clear pre-established criteria. 

  The user provides concrete examples: debates about cultivated meat where squeamishness is seen as either naturalness bias or legitimate preference depending on the side; development contexts where a poor woman's contentment is dismissed as adaptive preference by interveners who don't apply the same lens to their own reservations; and nudging policies that arbitrarily treat some attitudes as biases to correct while respecting others as preferences.

  Hmm, they're clearly well-versed in adjacent concepts like adaptive preferences (Elster, Nussbaum) and disgust debates in bioethics (Kass vs. others), but feel these don't capture the meta-problem of classification arbitrariness. Their frustration with the "methodological vacuum" in policy work resonates - it's not just about drawing lines poorly, but about how the line-drawing itself becomes conclusion-driven.

  Let me map the philosophical neighborhoods. First, the adaptive preference literature (Nussbaum, Khader) focuses on oppressed groups internalizing limitations, but doesn't address why classifiers inconsistently apply the label. Second, debunking arguments in x-phi (Greene, Singer) use evolutionary/cultural explanations to discount moral intuitions, but again, selectively - we don't debunk egalitarian intuitions the same way. Third, reflective equilibrium (Rawls) assumes we can coherently align intuitions and principles, but this pattern shows how that process gets hijacked by motivated reasoning. 

  The genetic fallacy is relevant too - dismissing views based on origin rather than validity - but what's distinctive here is that the dismissal isn't just fallacious; it's asymmetrically applied. And status quo bias (Samuelson, Zeckhauser) describes inertia in decision-making, not the meta-move of labeling inconvenient attitudes as biases while exempting convenient ones.

  Wait, moral testimony literature (Hopkins, Nickel) examines when we should defer to others' moral judgments, but this is about classifying the nature of attitudes before even considering deference. Moral perception (McGrath) comes closer with its "perceptual model" of moral insight, but still doesn't capture the asymmetric classification.

  Having canvassed these, nothing quite fits. Adaptive preference debates come closest but are too narrow (focused on oppression) and lack the symmetry aspect. The core problem is the underdetermination of classification by methodology, leading to conclusion-driven labeling. 

  I'll coin "conclusion-relative classification of attitudes" (CRCA). Definition: The practice of categorizing attitudes as either normative inputs (preferences, insights) or non-normative biases based on their alignment with a pre-held evaluative conclusion, without a consistent, prior criterion justifying the categorization. 

  Boundaries: It's not CRCA if there's an explicit, consistently applied standard (e.g., always discounting evolutionarily-shaped intuitions). A gray area might be classifying conservative opposition to price gouging during disasters - is this "fairness insight" or "anti-market bias"? Depends whether your framework prioritizes welfare economics or deontological constraints.

  Verdict: no established term; conclusion-relative classification of attitudes (CRCA)
answer: |-
  ### The Classification Asymmetry in Moral Psychology: Mapping the Conceptual Terrain

  Your observation identifies a persistent methodological gap in applied ethics and policy discourse: the *ad hoc* categorization of attitudes as either normatively significant "preferences" or discountable "biases," with the categorization predictably aligning with the classifier's prior commitments. To address this systematically, we must first survey adjacent philosophical literatures before determining whether an established concept captures this specific configuration.

  #### 1. **Neighboring Concepts and Their Limitations**  
     - **Adaptive Preferences (Elster, Nussbaum)**: Concerns preferences shaped by oppression (e.g., "sour grapes"). While your development example references this, adaptive preferences focus on *why* preferences form (via oppression/internalization), not the *classifier's asymmetry* in applying the label. Your cases show interveners labeling *others'* attitudes as adaptive while exempting their own reservations—a dynamic not theorized here.  
     - **Debunking Arguments (e.g., Singer, Greene)**: Use evolutionary/cultural explanations to dismiss moral intuitions (e.g., disgust as a "mere bias"). However, these aim for universal criteria (e.g., "emotions are epistemically unreliable"), whereas your cases reveal *selective* debunking: the same classifier labels disgust a "bias" in food tech but a "legitimate preference" in bioethics when opposing GMOs.  
     - **Reflective Equilibrium (Rawls)**: Requires coherence between intuitions and principles. Yet your cases show classifiers *bypassing* equilibrium: attitudes supporting their view are "preferences" (input for equilibrium), while opposing ones are "biases" (excluded). This is *motivated non-incorporation*, not failed equilibrium.  
     - **Moral Testimony (Hopkins, Nickel)**: Asks whether we can defer to others' moral judgments. Your concern is prior: whether an attitude *qualifies* as moral testimony (a "preference/insight") or noise (a "bias").  
     - **Status Quo Bias (Samuelson & Zeckhauser)**: Describes a cognitive tendency to favor existing arrangements. But your cases involve *accusing others* of this bias while *exempting* one’s own status-quo-favoring attitudes—a second-order asymmetry.  
     - **Genetic Fallacy**: Mistakes an origin story for a validity judgment. While related (e.g., "your revulsion is just cultural"), your cases involve inconsistent *application* of genetic reasoning, not the fallacy itself.  

  None fully capture the core pattern: **the absence of a pre-settled, non-arbitrary criterion for the preference/bias distinction, leading to classification that inherits the classifier’s conclusions**.

  #### 2. **The Unnamed Configuration: Diagnosis and Coinage**  
  The asymmetry you describe arises from **methodological underdetermination**: the preference/bias distinction lacks domain-general criteria, forcing classifiers to rely on tacit value commitments. This creates a circularity:  
  - **Input Selection**: What counts as a "preference" (normative input) vs. "bias" (distortion) is determined by the classifier’s desired output.  
  - **Asymmetric Scrutiny**: Evolutionary/cultural explanations are weaponized against disfavored attitudes but withheld from favored ones.  

  No established term captures this *systematic, conclusion-driven arbitrariness in categorization*. Thus, I propose:  
  **Conclusion-Relative Classification of Attitudes (CRCA)**  
  *Definition*: The practice of categorizing attitudes as either (a) normatively significant inputs (preferences, insights) or (b) non-normative biases, where the categorization is determined by the attitude’s alignment with the classifier’s pre-held evaluative conclusion, in the absence of a consistent, prior criterion for the distinction.  

  #### 3. **Boundaries and Distinctions**  
  - **vs. Status Quo Bias**: CRCA *uses* bias labels tactically (e.g., interveners call contentment "adaptive" but not their own hesitations). Status quo bias is a first-order cognitive tendency; CRCA is a second-order classificatory practice.  
  - **vs. Adaptive Preferences**: Adaptive preferences are a *class* of attitudes (shaped by oppression); CRCA is a *meta-practice* of selectively applying such labels.  
  - **vs. Genetic Fallacy**: CRCA may commit the fallacy but is defined by *inconsistent application* (e.g., dismissing disgust as "evolutionary" in food debates but not in sexual ethics).  
  - **Boundary Case**: Is classifying anti-market intuitions as "irrational bias" (by economists) vs. "fairness insights" (by egalitarians) an instance of CRCA? It becomes CRCA *only if* the classifier lacks a pre-committed criterion (e.g., welfare maximization) and arbitrarily switches frameworks to suit conclusions. If they consistently apply a framework (e.g., "all emotion-based judgments are biases"), it is not CRCA.  

  #### 4. **Why This Fills a Gap**  
  CRCA names the **procedural void** in moral psychology: when classifiers lack shared epistemic rules for attitude-categorization, politics fills the vacuum. It explains why debates about "bias" vs. "preference" are often stalemated—they are proxy battles over substantive values, disguised as methodological disputes.  

  Verdict: no established term; conclusion-relative classification of attitudes (CRCA)
