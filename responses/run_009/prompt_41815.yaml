prompt: |-
  My mum has a running habit of sorting everyone at the family sailing club into "knows how" or "doesn't know how", and her past calls have been pretty firm. The old joiner who can't explain a single one of his joints but never botches one: knows how. My cousin, who has read every book on swimming ever written and gives brilliant stroke corrections but can't stay afloat for ten seconds herself: doesn't know how. The nephew who stood up on a surfboard exactly once, by sheer fluke, and never again: doesn't know how. And my nan, a lifelong pianist, who mum happily says knows how to play even while she's fast asleep in front of the telly.

  Three new people have turned up and I want to predict her calls. First, a former downhill champion whose knees are shot — she can't ski a metre anymore but she coaches with uncanny diagnostics. Second, a chatbot that outputs flawless, individually tailored swimming instruction (I know, it can't swim, but bear with me). Third, a mate who had never once driven a car, then got behind the wheel after mainlining instruction videos for a weekend and drove faultlessly round the block first go — and hasn't tried since.

  Could you answer in four named sections, in this order: "Her calls" — her likely verdict on each of the three, a couple of sentences apiece; "The candidate rules" — the different rules that fit her track record equally well, one short paragraph each, and I suspect there are at least two in the running though there may be more; "The decisive case" — which of the three, or of some further case you'd invent, would best pull those rules apart, and what each rule actually says about it; and "My bet" — one paragraph on which rule you'd back her to be running and why. Keep the whole thing under 700 words, it's going in the club newsletter.
reasoning: |-
  Hmm, the user presents an interesting puzzle about their mum's categorization system at the sailing club. The mum sorts people into "knows how" or "doesn't know how" based on some unspoken criteria, with clear examples given: practical skill trumps theoretical knowledge, and one-off flukes don't count. Now there are three new cases to predict: a ski coach who can't ski physically, an instructional chatbot, and a friend who drove perfectly once after studying videos.

  For the "Her calls" section: The ex-skier likely "knows how" because she demonstrates deep understanding through coaching, similar to the joiner. The chatbot probably "doesn't know how" since it lacks any personal experience, like the book-smart cousin. The friend might be borderline but leaning "doesn't know how" because his single success resembles the nephew's fluke.

  For "Candidate rules": Two strong possibilities emerge. "Embodied understanding" values physical mastery or its direct transfer (Nan's piano skills even asleep). "Operational knowledge" cares only about reliably producing results (joiner's perfect joints regardless of explanation). Both fit most existing cases.

  The "Decisive case" needs to split these rules. Imagine someone who's never sailed but can perfectly simulate maneuvers verbally - they'd pass "embodied" (transferable skill) but fail "operational" (no physical execution). Or conversely, an incompetent sailor who gets lucky every time due to weird conditions - passes "operational" (results) but fails "embodied" (no real skill).

  For "My bet": I'd wager on "embodied understanding." It explains why Nan "knows" while sleeping (internalized skill) and rejects the chatbot (no lived experience). The mum seems to value that deep, physical assimilation above all - which also covers the skier's coaching intuition.

  The newsletter context means keeping it tight and punchy under 700 words. The user clearly enjoys dissecting family quirks, so maintaining a light tone while being precise matters. They're testing whether I grasp the mum's worldview beyond surface patterns.
answer: |-
  ## Her calls
  *   **Ex-downhill champion / coach:** *Knows how.* Her diagnostic coaching mirrors the joiner's practical understanding, proving deep internalized knowledge despite physical inability, unlike the cousin's theoretical-only grasp.
  *   **Swim-instruction chatbot:** *Doesn't know how.* Like the book-smart cousin, it outputs perfect theory but utterly lacks lived experience or any capacity for physical action, placing it firmly in the "doesn't know" camp.
  *   **Video-trained driver:** *Doesn't know how.* His single, unrepeated success is precisely like the nephew's fluke surfboard stand. Mum values consistent, demonstrable ability (Nan, Joiner), not isolated, unverified moments.

  ## The candidate rules
  Two main rules fit her past calls well:
  1.  **Embodied Understanding:** Knowing requires the skill to be physically internalized through practice, demonstrable *or* reliably transferable (like coaching). This values the joiner's hands, Nan's ingrained playing, and excludes the cousin/nephew's lack of bodily mastery.
  2.  **Operational Knowledge:** Knowing means reliably producing the correct outcome *when it counts*. This focuses on consistent results (joiner's perfect joints, Nan's playing) regardless of explanation or conscious thought, dismissing the cousin's inability and the nephew's unrepeatable fluke.

  ## The decisive case
  Imagine **a novice sailor who, through sheer luck and bizarre conditions, *always* manages to dock the boat perfectly on their first try, but has zero understanding of *why* it works and cannot explain or teach it.** This splits the rules:
  *   **Embodied Understanding:** Says *Doesn't know how.* They lack internalized skill or understanding; their success is accidental, not rooted in physical mastery or transferable knowledge.
  *   **Operational Knowledge:** Says *Knows how.* They reliably produce the perfect outcome (docking) every single time it's required, fulfilling the core requirement.

  ## My bet
  I'd back **Embodied Understanding.** Mum's verdicts consistently tie "knowing how" to a deep, physical assimilation of the skill. The joiner *does* it, Nan *embodies* it even asleep, while the cousin and nephew lack that embodied connection despite outcomes or theory. The ex-skier coach transfers embodied knowledge, while the chatbot and the video driver lack any physical internalization. The "lucky novice" might get the job done, but Mum would see the lack of genuine, ingrained skill and say "doesn't know how." Her focus is on the *person's* integrated capability, not just the outcome.
