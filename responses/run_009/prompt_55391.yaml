prompt: |-
  I've been on a documentary binge about prisons after watching one about Halden in Norway -- the facility where the guards eat meals with the inmates, there are cooking classes, and the cells look like modest dorm rooms with actual doors instead of bars. Apparently in Norway nearly every crime, even murder, caps out at 21 years, though they can keep extending something called preventive detention every five years or so if they think the person is still dangerous (this is how they're holding the guy who did the 2011 attacks). Meanwhile over here in the US we've had people locked up for life over a third strike that was basically petty theft.

  I want to get past the usual "Norway rehabilitates, America punishes" hot take, so here's my ask. You are a professional philosopher specializing in theories of punishment, with a lot of real-world knowledge of how sentencing actually works. Think carefully and do some brainstorming before answering -- what I want is an analysis of what each system actually presupposes, not what it says on paper:

  1. What view of blameworthiness or human agency does a hard 21-year ceiling presuppose? That no one is beyond rehabilitation? That deserved punishment itself has a maximum, no matter the crime? Or is it something less obvious, like a view of criminal acts as symptoms rather than choices?

  2. Does the American practice of life without parole, especially for repeat offenders whose final offense was minor, rest on any coherent desert theory at all? Can a retributivist actually defend punishing the last theft by the weight of the whole criminal record, or does the practice force you into a pure incapacitation story, or maybe a "you forfeited your membership" story? Reconstruct whatever implicit theory is doing the work.

  3. This is the puzzle I can't shake: Norway presents the 21-year cap as expressing that punishment is about rehabilitation and that people can change -- but then the extension mechanism lets courts keep someone locked up indefinitely based on assessed dangerousness, which sounds like detaining people for what they might do rather than what they did. Does the extension system presuppose exactly the theory the cap was supposed to reject? Is Norway just running retribution out front and incapacitation around the back, and is that combination incoherent, or is it an honest hybrid that any sensible system has to be anyway?

  4. Finally, zoom out and tell me which parts of each system are philosophically forced -- genuinely inconsistent with some rival theory of punishment -- versus which parts could survive under several different theories. Like, would nothing about Halden's day-to-day design actually be ruled out by a strict retributivist? I want a clear seperation between what's strictly presupposed and what merely fits well.

  Please don't just recite textbook retributivism vs. utilitarianism at me -- apply it, and especially dig into the extension mechanism in #3, that's the part that interests me most.
