     Step 2: Map to theories:

     - First-order theory (Dretske, Tye): The first-order state (seeing the digit) is conscious by itself. The confidence and trust are just additional reports. In the subliminal block, participants were having a conscious experience of the digit (though vague) and that's why they could report above chance. The low confidence reflects the quality of the experience. In the corrupted feedback block, the first-order state was conscious, and the false feedback created a false belief about performance, but the experience of the digit was unchanged.

     - Higher-order thought (HOT) theory (Rosenthal): A state is conscious only if there is a HOT about it. In the subliminal block, the first-order state was not conscious because there was no (or an inaccurate) HOT. The above-chance performance is due to an unconscious state. The confidence rating (which is a HOT) is what would make it conscious, but in the subliminal block, the confidence is low and random, so the first-order state remains unconscious. In the corrupted feedback block, when the feedback is given, it might generate a HOT that the first-order state was wrong, but the first-order state was actually present and correct. So according to HOT, the experience might be of having made an error? But note: the feedback is about the choice, not about the perception. So the HOT would be about the judgment, not directly about the perceptual state.

