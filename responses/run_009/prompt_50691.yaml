     That leaves plenty of time for debrief and discussion.

     However, we must consider that participants write on slips. We'll collect the slips at the end of each block? Or have them keep the slips until the end? We want to keep the ladder visible. So we'll ask participants to line up their three slips in order (first-order, then confidence, then trust) for each trial, and keep them until the activity ends.

