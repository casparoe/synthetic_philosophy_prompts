  2. **Practice (5 minutes):**
     - Run 2-3 normal trials (300 ms) so participants get the hang of it.

  3. **Main Experiment (60 minutes total for trials):**

     We'll have 5 blocks:

     Block 1: Normal trials (10 trials, 300 ms)
     Block 2: Subliminal trials (10 trials, 50 ms)
