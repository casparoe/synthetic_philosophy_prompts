  We are designing an activity for a public "mind salon" on higher-order theories of consciousness. The goal is to create an experiential understanding of the central claim: that a mental state becomes conscious only when there is a higher-order state about it. We'll have a perceptual task with multiple levels (first-order perception, confidence, and trust) and introduce dissociations to provoke discussion.

  The activity will be called "The Confidence Ladder" to avoid jargon.

  **Materials:**
  - Projector for displaying stimuli (or printed cards if projector fails)
  - Blank slips of paper (three different colors if possible: white for the first-order choice, yellow for confidence, blue for trust) and pens for each participant
  - A bowl or box for collecting slips at each stage (to keep the ladder visible, we might have participants line up their three slips in front of them until the end)
  - A confederate (an assistant) to give random feedback in the corrupted feedback condition
  - A whiteboard or large paper to record group results (optional, but helpful for debrief)

  **Stimuli Design:**
  We need barely discriminable stimuli to create uncertainty. Two options:

  1. **Patch Discrimination:** Two very similar shades of gray (or two slightly different images) flashed briefly (e.g., 200 ms) on the projector. Participants must choose which one they saw (A or B). The patches should be set so that overall accuracy is around 60-70% (hard but above chance).

  2. **Digit Location in Masked Display:** A grid (e.g., 3x3) is shown for a brief time (e.g., 300 ms) with a digit (say, 4 or 7) in one cell, then immediately masked by a pattern. Participants must locate the digit (which cell? 1-9) or identify the digit (4 or 7?).

  We'll use the digit location task because it's easier to set up and allows for more conditions. We'll have two types of trials:
     - Normal trials: digit (4 or 7) appears in one of 9 cells for 300 ms, then mask.
     - Blindsight-flavored trials: We can use a backward mask that is very effective, so that sometimes the participant may be forced to guess without conscious perception.

  However, to create the dissociation where the first-order task is above chance but confidence is at chance, we need to manipulate the presentation time. We can have two conditions:

  Condition 1: Short presentation (e.g., 50 ms) for the dissociation trials (blindsight-like) and Condition 2: Normal presentation (300 ms) for the regular trials.

  But we also want trials with no first-order task at all? How? We can have catch trials where no digit is presented, only the mask. Then participants are forced to choose a location (or say "no digit") but we won't have an objective correct answer for location. Alternatively, we can skip the first-order task and ask for confidence and trust? That might not work.

  Alternatively, we can have three types of trials:

  1. **Normal trials (300 ms):** Participants should perform above chance and have some confidence.
  2. **Blindsight-like trials (50 ms):** Participants might be above chance but have low and random confidence.
  3. **Catch trials (0 ms, only mask):** No digit is presented. Participants are forced to choose a location (or we can have an option for "no digit" but then we have a first-order task of detection). Alternatively, we can skip the first-order task in some trials? But that breaks the ladder.

  We need to keep the same three-step ladder for every trial. So we'll have:

  - Every trial: 
     Step 1: First-order choice (where was the digit? 1-9, and what digit? 4 or 7? Actually, we can simplify: just location OR just digit. Let's do digit identification: 4 or 7? because it's simpler and has two choices, so chance is 50%). We'll do digit identification (4 or 7) at a fixed location (center of the screen) to avoid the location complexity. So the task is: which digit appeared? 4 or 7? And we control the presentation time.

  So:

  - Stimulus: A digit (4 or 7) is presented at the center for a variable duration, then masked.

  We'll have three conditions:

  A. **Normal condition (300 ms):** Easy to see (but we can adjust to be somewhat challenging by using a noisy background or similar fonts for 4 and 7?).

  B. **Subliminal condition (50 ms):** Very short, then masked. This is designed to create above-chance performance without conscious awareness (like blindsight). But note: in normal participants, we might not get blindsight, but we can get a dissociation between accuracy and confidence.

  C. **Catch trials (0 ms):** Only the mask is shown. There is no digit. Participants must choose 4 or 7 anyway (forced choice).

  We'll also have:

  D. **Corrupted feedback condition:** This is not a separate trial type, but a condition we introduce in a block of trials. In this block, after the participant makes their first-order choice, a confederate (who doesn't know the correct answer) will randomly say "correct" or "incorrect". Then the participant rates their confidence and trust.

  **Structure of the Activity:**

  1. **Introduction (5 minutes):**
     - Explain that we are going to do a simple perception game to explore how we experience our own judgments.
     - Outline the steps for each trial:
          a. You will see a very brief display and must choose: was it a 4 or a 7? (first-order choice)
          b. Then, rate your confidence in that choice on a scale of 1 (just guessing) to 5 (certain).
          c. Then, rate how much you trust that confidence rating on a scale of 1 (I might be fooling myself) to 5 (I stand by my confidence).

