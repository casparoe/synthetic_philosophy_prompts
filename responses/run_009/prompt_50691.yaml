     - Rosenthal (HOT): A perception becomes conscious only when you have a thought about it. In subliminal, there was no (or a very weak) thought, so it wasn't conscious. In corrupted feedback, the feedback might have caused a false thought (e.g., "I must have seen it wrong") and that becomes the conscious experience.

     - Carruthers (dispositional): The perception is conscious if it is available for higher-order thought, even if you don't form one. In subliminal, the state was available, but when you formed a thought it was uncertain. In corrupted feedback, the state was available, but the feedback might have overridden the actual availability? This is less clear.

