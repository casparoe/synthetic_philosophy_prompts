  Looking at the practice: aid is voluntary, branded, conditional, and lacks enforcement mechanisms. These elements suggest donor control and discretion, which aligns with beneficence. Beneficence implies a duty to help but allows flexibility in how and when. In contrast, justice would entail obligations that recipients can demand. The branding and expectation of gratitude reinforce the power dynamic, treating aid as a gift rather than restitution.

  But can these practices fit under a justice framework? Maybe superficially, but key aspects like conditionality and discretion contradict the idea of owed reparations. For example, if aid is repayment for colonial extraction, the recipient should decide how to use it, not the donor. The absence of any legal recourse for recipients highlights that donors aren't seen as debtors.

