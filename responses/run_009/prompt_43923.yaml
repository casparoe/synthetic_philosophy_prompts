answer: |-
  ## Meridian Vale Advisory Communications and Truthfulness Standards Manual (Rev. 4.3)

  **1. Purpose & Scope:** Meridian Vale Advisory (MVA) is committed to the highest standards of integrity. This Manual establishes the Company’s binding policy regarding truthful communication. Adherence is mandatory for all personnel in all external and internal communications concerning Company business.

  **2. Foundational Principle:** **The sole ethical obligation of an MVA representative is to ensure the literal, propositional truth of any assertion made.** Compliance is achieved solely by the veracity of the proposition(s) explicitly stated by the speaker/writer at the time of utterance.

  **3. Key Definitions:**
      *   **3.1. Asserted Content:** The specific proposition(s) conveyed by the words spoken or written, interpreted according to standard semantic conventions and relevant contextual disambiguation necessary for basic propositional understanding.
      *   **3.2. Communicated Content:** Any belief, impression, or understanding formed by an audience member that extends beyond the Asserted Content. This includes, but is not limited to, inferences, implications, presuppositions, and conversational implicatures drawn by the audience based on the Asserted Content, context, background knowledge, or perceived speaker intent.
      *   **3.3. Responsibility Boundary:** **MVA’s ethical responsibility is strictly limited to the truthfulness of the Asserted Content. The Company bears no responsibility for Communicated Content derived therefrom. Audiences form their own inferences; MVA controls only its assertions.**

  **4. The Standard of Compliance:** An utterance is compliant with this Policy if and only if the speaker/writer believes the Asserted Content to be true at the time of utterance. The foreseeable likelihood that the audience will form a false belief based on the Communicated Content is irrelevant to compliance assessment.

  **5. Worked Examples of Compliant Communication:**

  > **Example A: Facility Safety Record**
  > *   **Scenario:** Client inquires about safety standards at MVA's Beta Site facility. No formal safety audit has ever been scheduled or conducted at Beta Site.
  > *   **Compliant Utterance:** "The Beta Site facility has never failed a safety audit."
  > *   **Resolution:** Asserted Content ("Beta Site has never failed a safety audit") is true (as no audit occurred, failure is impossible). Compliant. Communicated Content (e.g., that Beta Site is safe, or has been audited) is audience inference.
  >
  > **Example B: Customer Feedback**
  > *   **Scenario:** Investor due diligence asks about recent customer satisfaction. The dedicated customer complaint phone line was disconnected (without public announcement) 6 months ago due to cost-cutting. No *new* complaints have been received via other channels since then.
  > *   **Compliant Utterance:** "We have received no customer complaints in the past six months."
  > *   **Resolution:** Asserted Content ("No complaints received [in last 6 months]") is true (disconnecting the line prevents reception). Compliant. Communicated Content (e.g., that customers have no complaints, or that feedback channels are functional) is audience inference.

  **6. Legacy Scenario Protocol:** Personnel may encounter situations requiring discretion without false assertion.
      *   **6.1. Scenario:** An individual arrives at an MVA location seeking a specific person known to be present, whose location the personnel are ethically or contractually obligated to withhold. Personnel must not make a false assertion (e.g., "He is not here").
      *   **6.2. Approved Compliant Formulation:** "I confirm that [Person's Name] is not located within the southeast quadrant of this floor at this precise moment." (Ensure the person is verifiably *not* in the specified quadrant/area).
      *   **6.3. Rationale:** Asserted Content is narrowly true. Communicated Content (e.g., that the person is not in the building) is the audience's inference, for which MVA bears no responsibility.

  **7. Incident Response: Managing Audience Realization:**
      *   **7.1. Recognition of Harm:** The primary harm arising from an audience correctly inferring the underlying reality despite a technically compliant utterance is potential reputational damage to MVA arising from the *appearance* of impropriety, *not* any inherent ethical failing in the original communication.
      *   **7.2. Required Actions:**
          *   **7.2.1.** Personnel must immediately notify the Compliance Office upon becoming aware that an audience has formed an accurate negative inference based on a prior compliant assertion.
          *   **7.2.2.** The Compliance Office will assess the reputational risk.
          *   **7.2.3.** Public Relations, in consultation with Compliance, will formulate a response focusing *exclusively* on the truthfulness of the original Asserted Content: "MVA stands by the accuracy of its statement that [repeat exact Asserted Content]. Any broader interpretations were not asserted by MVA." **Do not apologize for inferences drawn.**
          *   **7.2.4.** Review the utterance for any *inadvertent* false assertion; if found, handle per standard falsity protocols. If the Asserted Content remains verifiably true, the communication itself remains compliant.

  **8. Staff Training & Competency Requirement:**
      *   **8.1. Core Skill:** All client-facing personnel must undergo mandatory quarterly "Truthful Reformulation Drills." Mastery of on-the-spot conversion of potentially false statements into compliant truthful assertions is a condition of employment.
      *   **8.2. Procedure:** Upon recognizing an impulse to utter a believed-falsehood:
          1.  Immediately pause communication.
          2.  Identify the core proposition requiring expression.
          3.  Formulate a technically true assertion that addresses the proposition within the narrowest possible semantic scope, utilizing precise language, temporal limitations, or restrictive qualifiers (e.g., "to the best of my current knowledge," "based solely on documented reports," "within the defined parameters of Project X," "as of 10:00 AM today").
          4.  Utter *only* the reformulated, compliant assertion.
      *   **8.3. Example Drill:** Impulse: "The project is on schedule." (Believed false). Compliant Reformulation: "Significant project milestones identified in the Phase 1 plan have been met within their original timeframes." (If true).

  **9. Policy Supremacy:** This Policy defines MVA's complete ethical framework concerning truthfulness in communication. Compliance is measured solely against the veracity of Asserted Content. Personnel are expressly shielded from criticism based on Communicated Content resulting from audience inference. Adherence ensures MVA operates with unwavering integrity at the level of assertion.

  **Compliance Office, Meridian Vale Advisory**
