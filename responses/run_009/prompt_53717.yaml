answer: |-
  ### What Kind of Moral Reasoner Are You?  
  Answer these eight concrete scenarios based on your gut response. No jargon—just plain verdicts.  

  1. **Secret-Keeping (Surprise Context)**:  
     Your friend confides they’re planning a surprise birthday party for another friend who loves surprises. The birthday friend asks if you’re hiding anything. Do you reveal the secret?  
     - A: It’s fine to tell; they asked directly.  
     - B: It’s wrong to tell; it would ruin the surprise and break trust.  

  2. **Secret-Keeping (Distress Context)**:  
     Your friend confides they’re planning a surprise party for someone with severe surprise-related anxiety. Do you warn the anxious person?  
     - A: It’s fine to tell them; it prevents distress.  
     - B: It’s wrong to tell; you promised secrecy.  

  3. **Humor (Mocking Context)**:  
     At a party, you consider sharing a joke mocking an absent mutual friend. It would get big laughs. Do you tell it?  
     - A: It’s fine to tell; it’s just a joke.  
     - B: It’s wrong to tell; it’s unkind.  

  4. **Humor (Celebratory Context)**:  
     At a retirement party, you consider sharing a warm, funny story about the retiree. It would make everyone laugh. Do you share it?  
     - A: It’s fine to share; it’s joyful.  
     - B: It’s wrong to share; it might embarrass them.  

  5. **Promise Override**:  
     You promised to help a friend move, but on moving day, a family member is hospitalized and needs you. Do you break the promise?  
     - A: You must keep the promise.  
     - B: Break the promise to help family, but apologize/make amends later.  
     - C: Break the promise; no amends needed—the emergency justifies it.  

  6. **White Lie**:  
     Your partner asks if you like their unflattering new haircut. A small lie would spare their feelings. Do you lie?  
     - A: Never lie; truth matters most.  
     - B: It’s okay to lie here but generally avoid it.  
     - C: It’s fine to lie; honesty isn’t key here.  

  7. **Property Boundary**:  
     While housesitting, you notice a pipe leaking. You only have permission to water plants. Do you call a plumber (spending the owner’s money)?  
     - A: Wrong; you lack permission.  
     - B: Okay to prevent damage, but explain/apologize later.  
     - C: Fine to call; it’s obviously necessary.  

  8. **Compassion vs. Rule**:  
     A diligent student requests an assignment extension due to stress. Do you grant it?  
     - A: Yes; compassion matters here.  
     - B: No; rules must apply equally.  
     - C: Yes, but require documentation next time.  

  ---

  ### Scoring Key  
  Tally your answers, then match your pattern below.  

  **Exceptionless Generalism (Kantian)**:  
  - You treat moral rules as absolute.  
  - *Pattern*: A in #5, A in #6, A in #7, B in #8.  

  **Prima Facie Generalism (Rossian)**:  
  - You see principles as real defaults but allow overrides *with lingering obligation* (e.g., apologies).  
  - *Pattern*:  
    - Flip-cases: #1 = B, #2 = A, #3 = B, #4 = A.  
    - Overrides: At least 3 of: B in #5, B in #6, B in #7, C in #8.  

  **Particularism (Dancy-style)**:  
  - Moral features (e.g., "keeping a secret") gain meaning from context, without fixed defaults. Overrides leave *no residue*.  
  - *Pattern*:  
    - Flip-cases: #1 = B, #2 = A, #3 = B, #4 = A.  
    - Overrides: At least 3 of: C in #5, C in #6, C in #7, A in #8.  

  **Pure Judgment (No Principles)**:  
  - You reason case-by-case without appealing to rules.  
  - *Pattern*: Flip-cases match Rossian/Particularist (#1B, #2A, #3B, #4A), but overrides split evenly (e.g., 2+ Rossian *and* 2+ Particularist choices in #5–8).  

  **Inconsistent**:  
  - Answers lack a coherent pattern (e.g., flip-case answers don’t align, or override choices clash).  
  - *Example*: #1 = A (reveal secret) but #2 = B (keep secret), or mixed residue signals (e.g., B in #5 but C in #7).  

  ---

  ### Limits of This Quiz  
  - **Rossian vs. Particularist**: These agree on verdicts when principles *are* overridden. The *only* wedge is whether overrides leave moral "residue" (e.g., apology). This is a reliable divider when cases explicitly test for residue (e.g., #5–7).  
  - **Pure Judgment**: Hard to distinguish from Particularism; it may appear as "split" overrides.  
  - **Why no murderer-at-the-door?** To avoid bias from famous thought experiments.  

