  ### Joint Statement of Agreements and Disagreements  
  **After a Year-Long Adversarial Collaboration**  
  **Between a Higher-Order Theorist (HOT) and a First-Order Representationalist (FOR)**  

  #### 1. Agreements  
  Both parties endorse the following claims as foundational to the debate and reject common misunderstandings:  

  1.1 **Explananda of Consciousness**:  
     - A theory of consciousness must explain:  
       (a) The *subjective character* of experience (what-it’s-like-ness).  
       (b) The *distinction* between conscious and unconscious perceptual states (e.g., seeing a red apple vs. processing it subliminally).  
       (c) The *direct availability* of conscious states for global cognitive access (e.g., report, reasoning, action-guidance).  
     - Both agree that "consciousness" is not a primitive property but requires mechanistic explanation.  

  1.2 **Interpretation of Standard Dissociations**:  
     - **Blindsight**: In Type 1 blindsight, subjects exhibit above-chance discrimination in the blind field without awareness. Both agree this involves a first-order representational state that is *unconscious*. FOR attributes this to the state’s failure to be "poised" for global access; HOT attributes it to the absence of a higher-order representation (HOR) targeting the state.  
     - **Masking**: When a stimulus is masked (e.g., backward masking), it can influence behavior without being consciously perceived. Both agree the stimulus generates a first-order state but lacks consciousness. FOR holds the content is not appropriately available; HOT holds no HOR is formed.  
     - **Inattentional Blindness**: When attention is diverted, a stimulus may be processed but not consciously experienced. Both agree attentional mechanisms modulate consciousness but disagree on *how*: FOR ties attention to the "poising" of first-order content; HOT ties it to the formation of HORs.  

  1.3 **Rejected Objections**:  
     - **The "Self-Intimating" Fallacy**: Both reject the claim that conscious states must be *infallibly* self-known. FOR denies introspection is necessary for consciousness; HOT allows for non-conscious HORs (so consciousness doesn’t entail introspection).  
     - **Question-Begging Appeals to Intuition**: Both dismiss arguments that rely solely on "what it’s like" intuitions about edge cases (e.g., misrepresentation scenarios) without empirical or functional constraints.  
     - **Infinite Regress**: Both agree HOT avoids regress because HORs need not themselves be conscious (HOT’s "non-conscious higher-order" clause); FOR avoids it by eliminating HORs altogether.  

  ---  
  #### 2. Residual Disagreements  
  The table below states disagreements in neutral terms acceptable to each side.  

  | Issue | Higher-Order Theorist (HOT) Statement | First-Order Representationalist (FOR) Statement |  
  |-------|----------------------------------------|------------------------------------------------|  
  | **Consciousness-Conferring Mechanism** | A mental state is conscious if and only if it is represented by a suitable non-conscious higher-order representation (HOR). | A mental state is conscious if and only if its content is poised for global cognitive access (e.g., reasoning, report), without any higher-order representation. |  
  | **Role of Attention** | Attention facilitates consciousness by enabling the formation of HORs; without attention, no HOR is generated, rendering first-order states unconscious. | Attention modulates consciousness by determining whether first-order content becomes poised for global access; no HOR is required. |  
  | **Metacognition vs. Consciousness** | Confidence ratings and introspective judgments reflect HORs; thus, they are empirical measures of the mechanism that constitutes consciousness. | Confidence ratings and introspective judgments are *consequences* of conscious access, not constitutive of consciousness itself. |  
  | **The "Problem of the Rock"** | A rock lacks consciousness because it has no capacity for HORs, not because it lacks first-order representations (which it also lacks). | A rock lacks consciousness because it has no first-order representations with content that could be poised for global access. |  

  ---  
  #### 3. Cruxes  
  Subquestions where resolution would shift at least one side’s position, with testable predictions.  

  **Crux 1: Does Metacognition Measure the HOT Mechanism?**  
  - **Issue**: Whether confidence ratings in blindsight or masking tasks reflect the HOR HOT requires.  
  - **Experiment**:  
    - Test blindsight patients on a discrimination task (e.g., motion direction) with simultaneous confidence ratings. Use Type-2 signal detection to quantify metacognitive sensitivity (ability to distinguish correct/incorrect trials).  
  - **HOT Prediction**: Blindsight patients will show *at-chance metacognitive sensitivity* in the blind field. Above-chance discrimination without above-chance confidence implies unconscious first-order states with *no HORs*.  
  - **FOR Prediction**: Blindsight patients may show *above-chance metacognitive sensitivity* if first-order content is partially available. If metacognition correlates with discrimination, it reflects graded access to first-order states, not HORs.  

  **Crux 2: The Misrepresentation Worry**  
  - **Issue**: What happens when a HOR misrepresents a first-order state? Does FOR face an analogous problem?  
  - **Thought Experiment**:  
    - *Case 1 (HOT)*: A subject has a first-order state representing an orange stimulus but a HOR misrepresenting it as red. What is the conscious experience?  
    - *Case 2 (FOR)*: A subject has a poised first-order state representing orange, but a cognitive error (e.g., memory) causes them to report "red." What is the conscious experience?  
  - **HOT Prediction**: In Case 1, the conscious experience is *of red*; the HOR determines phenomenology. Misrepresentation is possible and implies consciousness is "transparent" to the HOR.  
  - **FOR Prediction**: In Case 1, the experience is *of orange*; misreporting is a post-perceptual error. FOR denies misrepresentation *within* consciousness: If content is poised, the experience is fixed. In Case 2, the report error is irrelevant to the conscious state.  

  **Crux 3: Neural Correlates of Consciousness (NCC)**  
  - **Issue**: Does NCC research support "higher-order" or "first-order" neural signatures?  
  - **Experiment**:  
    - Use fMRI/EEG to compare neural activity during conscious vs. unconscious perception (e.g., masking). Contrast activity in sensory areas (V1–V4, first-order) vs. prefrontal areas (PFC, linked to metacognition).  
  - **HOT Prediction**: Unconscious states will activate *only* sensory areas; conscious states will activate *both* sensory areas and PFC (HOR site). Disabling PFC (e.g., TMS) abolishes consciousness without abolishing sensory processing.  
  - **FOR Prediction**: Conscious states correlate with *enhanced/recurrent activation in sensory areas* (e.g., V1–V4) plus global broadcast to fronto-parietal networks. PFC activation reflects post-perceptual access, not consciousness itself.  

  ---  
  #### 4. Verbal Dispute Identification  
  A portion of the disagreement is verbal, centering on the term **"conscious state"**:  
  - HOT uses "conscious state" to mean *a state of which the subject is aware* (via a HOR).  
  - FOR uses "conscious state" to mean *a state with directly accessible content* (poised for global use).  

  **Why this is verbal**: Both agree on the *explananda* (e.g., blindsight involves unconscious processing; conscious states are reportable). But they partition the term "conscious state" differently: HOT ties it to meta-awareness; FOR ties it to access. Settling the empirical cruxes (e.g., misrepresentation, NCC) would clarify which usage better maps to the phenomena.  

  ---  
  **Signed**,  
  The Higher-Order Theorist  
  The First-Order Representationalist  

  *This document reflects our shared understanding after rigorous debate. We commit to the agreements, precise disagreements, and testing the cruxes without presupposing resolution.*
