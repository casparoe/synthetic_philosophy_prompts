prompt: |-
  I do risk policy work at a state environmental agency, and after losing the torture vs. dust specks argument at a bar for the umpteenth time I realized something funny: my side of that argument basically won in actual regulatory practice decades before the internet started fighting about it. But now I cant tell if that's philosophically meaningful or just an accident of administration.

  Here's the practice I mean. Environmental and health regulators routinely draw a line under which a risk is treated as acceptable and no further reduction is demanded — the de minimis threshold. In US practice this shows up as roughly a one-in-a-million lifetime cancer risk for carcinogens: if a chemical in the drinking water gives each exposed person a 10^-6 chance of cancer over their lifetime, regulators treat that as effectively zero, stop there, and dont order a cleanup — even though across a large exposed population that adds up to a fully predictable number of excess cancer cases. Similar moves elsewhere: tort law has its de minimis doctrine for injuries too trifling to be worth anything, and analysts zero out impacts below whatever their measurement floor is.

  But here's what bugs me. The very same agencies, in the very same analyses, happily use the value of a statistical life. They'll take a rule that reduces each of 100 million people's annual risk of dying by one in ten million, count that as ten statistical deaths, multiply by something on the order of ten million dollars per statistical life, and justify the rule by the sum. Tiny risk to each person, big aggregate — and this time the tiny bits DO get added up, precisely because adding them up justifies acting. So we refuse to aggregate when aggregation would demand even more regulation, and aggregate when it supports the regulation we already wanted? That cant be the principled line.

  What view of harm and aggregation does the de minimis practice actually presuppose? Does it presuppose that tiny harms genuinely don't add up — a real threshold or non-aggregative view of badness, basically the side that says no number of dust specks is worth one instance of torture — or only that there's an epistemic and administrative floor, below which we can't measure, attribute, or cost-effectively remove risks, in which case the practice is compatible with full aggregation in principle and the dust-specks utilitarians lose anyway? Reconstruct the implicit theory as best you can, say which rival theories of aggregation would and wouldn't license the practice, and tell me whether the two halves of it (de minimis thresholds over here, statistical-life addition over there) presuppose consistent things or quietly contradict each other. And if we replaced the threshold with a straight aggregative view, what would concretely change — would regulators be obligated to chase infinitely many vanishingly small risks with no stopping point, or is there some principled way to keep drawing the line while admitting the underlying harms are real?

  Format: end your whole answer with a final line of the form \answer{...} containing at most ten words naming the view of aggregation the practice most plausibly presupposes, or literally "no single view - underdetermined" if that's your honest conclusion.
reasoning: |-
  Okay, let me unpack this fascinating dilemma from someone working in environmental risk policy. They're describing a real-world regulatory paradox that mirrors the "torture vs. dust specks" thought experiment. The core tension is between de minimis thresholds (treating tiny individual risks as zero) and VSL aggregation (summing those same tiny risks when convenient). 

  First, I need to reconstruct the implicit theory behind de minimis. When regulators set a 10^-6 cancer risk threshold, they're not necessarily saying the harm vanishes metaphysically. In practice, it's more about epistemic and administrative limitations - we can't measure below certain levels, causation gets murky, and remediation costs would be disproportionate. This aligns with what legal scholars call "administrative pragmatism." 

  But then VSL calculations contradict this by happily aggregating risks below that same threshold when it justifies regulation. The key difference seems to be cost-benefit analysis framing: de minimis stops "unreasonable" regulation, while VSL enables "reasonable" regulation. So the unspoken principle might be "aggregate only when cost-effective" rather than any consistent view of harm ontology.

  If we forced full aggregation consistently, regulators would face absurd demands - like spending billions to eliminate fractional cancer risks while people die from treatable diseases. But maintaining the status quo feels intellectually dishonest. The most coherent reconciliation might be a scalar view: harms exist on a continuum, but our response must consider transaction costs and opportunity costs. 

  For the final answer, "pragmatic scalar aggregation" captures both the recognition of real harms and the context-dependent response. Though honestly, the practice is messy enough that "no single view - underdetermined" is tempting. But I'll go with the charitable reconstruction.
answer: |-
  Your observation cuts to the heart of practical ethics in regulatory policy. The de minimis threshold and VSL aggregation appear contradictory but reflect a nuanced, context-dependent approach to risk aggregation grounded in **pragmatic scalar aggregation with administrative constraints**. Here's the reconstruction:

  ### Implicit Theory Behind De Minimis Practice
  1. **Harm Realism with Epistemic/Administrative Thresholds**:  
     De minimis presupposes that tiny harms *are* real and aggregable *in principle* (contra non-aggregative views like absolutist thresholds). However, it imposes a **practical floor** below which:  
     - Risks cannot be reliably measured or causally attributed.  
     - Regulatory action is infeasible or disproportionately costly (e.g., chasing a 10^-9 risk might divert resources from higher risks).  
     - Social transaction costs (litigation, compliance burdens) outweigh benefits.  

     This is **not** a metaphysical claim that "harms below X don't exist" but a concession to epistemic limits and cost-effectiveness. Tort law’s *de minimis non curat lex* ("the law does not concern itself with trifles") explicitly invokes administrative practicality.

  2. **VSL Aggregation as the Counterpart**:  
     When aggregating tiny risks via VSL, regulators assume:  
     - Harms are *linear and additive* across individuals.  
     - The aggregate benefit (e.g., 10 statistical lives saved) justifies the cost *and* exceeds measurement/implementation thresholds.  

     The apparent contradiction arises because aggregation is **activated selectively**:  
     - **For justification (VSL)**: Aggregation is used when the per-person risk is *above* de minimis noise but small enough to require summation for meaningful cost-benefit analysis (CBA).  
     - **For limitation (de minimis)**: Aggregation is rejected when per-person risk falls below a feasibility threshold, making CBA unreliable or inefficient.  

  ### Which Theories License the Practice?
  - **Compatible**:  
    - **Scalar Utilitarianism**: Harms aggregate, but response thresholds balance marginal costs against diminishing returns.  
    - **Rule Consequentialism**: Prioritizes systemic efficiency; de minimis avoids paralyzing regulators with infinite trivialities.  
    - **Contractualism with Feasibility Provisos**: Rational agents would accept thresholds to prevent resource exhaustion.  
  - **Incompatible**:  
    - **Absolutist Non-Aggregation** (e.g., "no dust specks = torture"): Rejects summing small harms entirely.  
    - **Strict Lexical Thresholds**: Claims harms below a level are morally null (de minimis isn’t treated as morally zero—e.g., it’s still a "harm" in principle).  
    - **Unconstrained Aggregation**: Demands addressing all risks regardless of cost.

  ### Consistency of the Two Halves  
  They **cohere under a cost-effectiveness framework** but **contradict under strict moral aggregation**. De minimis and VSL share:  
  - **Harm linearity**: Both treat risk as linear per person.  
  - **CBA-driven triggers**: VSL aggregates when benefits > costs; de minimis suspends action when costs > benefits (including administrative/cognitive costs).  
  The tension arises because the "floor" for *counting* harms (VSL) is lower than the floor for *acting* (de minimis). This is a feature of **administrative pragmatism**, not moral philosophy.

  ### If We Switched to Full Aggregation  
  Regulators **would not be obligated to chase infinitesimal risks infinitely**. Principled stopping points remain:  
  1. **Opportunity Cost**: Resources are finite; chasing a 10^-12 risk might save fewer lives than investing in vaccines.  
  2. **Measurement Limits**: Risks below scientific detectability (e.g., 10^-9 for epidemiology) cannot inform decisions.  
  3. **Risk-Risk Tradeoffs**: Over-regulation can impose countervailing harms (e.g., economic dislocation → reduced health access).  
  De minimis could be replaced with **explicit cost-effectiveness thresholds** (e.g., "only reduce risks costing < $X per life-year saved"), acknowledging small harms while halting at efficiency frontiers.

  ### Conclusion  
  The practice presupposes **pragmatic scalar aggregation**: harms aggregate linearly, but policy response is constrained by feasibility, diminishing returns, and systemic costs. It rejects both non-aggregative absolutism *and* unconstrained utilitarianism, instead embedding aggregation within administrative realism. The VSL/de minimis pair is consistent only under this scaffold—where "counting" and "acting" diverge based on institutional capacity.

  \answer{pragmatic scalar aggregation}
