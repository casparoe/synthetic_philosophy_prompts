    In T1: 1e11
    In T2: 1e20

  Then:

    P(our galaxy | T1) = 1e11 / 1e11 = 1
    P(our galaxy | T2) = 1e11 / 1e20 = 1e-9

  This is the same as the original SSA! So we haven't changed anything.

  Alternatively, if we consider the reference class to be all possible observers that might exist in the actual universe (but not in counterfactual universes), then we are back to the actual observers.

  The trick is to consider the reference class as all possible observers across all possible universes. Then we have:

    In T1: the universe has 1e11 observers.
    In T2: the universe has 1e20 observers.

