  We can think of the multiverse of all possible universes. Then we are a random observer in the multiverse. The probability of being in a universe with T1 is:

    (number of observers in T1 universes) / (total observers in the multiverse)

  But how many T1 universes are there? This is not specified.

  The argument that SIA is SSA with a widened reference class is a sleight of hand because it requires assuming that the measure of observers in the reference class is proportional to the number of observers that would exist if that theory is true. But that measure is exactly what SIA provides. So it's circular.

  A better way: Some proponents argue that if we use the reference class of all possible observers and we assume that the multiverse has a measure over universes that is proportional to the non-anthropic prior, and then within each universe we have the observers, then SSA over the entire set of possible observers would give:

    P(T1) = [number of observers in T1 * prior(T1)] / [sum over theories: (number of observers in T * prior(T))]

  which is exactly SIA.

  So yes, if we define the reference class as all possible observers and we apply SSA to that class, and we assume that the multiverse has a measure given by the non-anthropic prior, then we get SIA. But note that this reference class is not straightforward because it includes observers that don't actually exist. This is controversial.

  Also, the reference class problem for SSA is that the choice of reference class can change the results. SIA is often said to avoid the reference class problem because it weights by the number of observers, and that seems absolute. But actually, the problem reappears in the form: which beings count as observers? And how do we count them? For example, does a fetus count? Or an AI? Or a chicken? And what if there are different kinds of observers with different weights? 

  Moreover, in the formulation above, we had to assume a multiverse with a measure. So SIA does not entirely avoid the reference class problem; it just shifts it to the problem of defining the set of possible observers and the measure over the universes.

  ### Summary

  1. The key to understanding the swap between SSA and SIA is that SIA multiplies the hypothesis prior by the number of observers, and then when we condition on being a specific observer (or having a specific birth rank) we use a likelihood that is inversely proportional to the number of observers. Hence, the two cancel and we are left with the non-anthropic prior.

  2. The split of a hypothesis by birth rank shows this cancellation clearly: under SIA, each possible observer (each birth rank in each hypothesis) is given equal prior weight. Then when we condition on our specific birth rank, we are comparing two (or more) sub-hypotheses (one per grand hypothesis) that have the same prior weight. The posterior then depends only on the non-anthropic priors of the grand hypotheses.

  3. SIA can be seen as SSA with a reference class that includes all possible observers across all possible universes, with the measure of a universe being the non-anthropic prior. This is a valid construction but it moves the reference class problem to the problem of defining the set of possible observers and the measure over the universes. Therefore, SIA does not eliminate the reference class problem but relocates it.
