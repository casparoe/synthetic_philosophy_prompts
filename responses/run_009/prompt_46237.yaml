  ### Is SIA just SSA with a widened reference class?

  There is an argument that SIA is equivalent to SSA with a reference class that includes all possible observers. The idea is that if you take your reference class to be all possible observers (including those in other universes or under different theories), then SSA would give the same results as SIA.

  Consider the PP scenario. Under SSA with a reference class of all actual observers, we are more likely to be in the theory with fewer observers. But if we widen the reference class to include all possible observers, then we have to consider that in T2 there are many more possible observers (because there are many galaxies) than in T1. Then by SSA, we are a random sample from all possible observers. The probability that we are an observer in our galaxy is:

