prompt: |-
  i'm a phd student in decision theory (philosophy dept, but i basically live with the formal epistemology crowd), and my dissertation keeps drifting toward whether credences can be imprecise. my advisor's go-to question is "adequate for what?" and i need a real answer for my prospectus defense, not a shrug. so: write me the desiderata — what any adequate theory of imprecise credence has to deliver, with the case behind each requirement. the fixed purpose is: a theory good enough to tell an ideally rational agent what to believe and do under ambiguity.

  stuff i specifically want on the list, though add things if you see gaps. it should explain Ellsberg-style behavior, where i bet on the known urn even at worse odds and that seems rational, not just a psychological quirk. it should handle what people call dilution — when i use a coin i'm sure is fair to randomize between betting heads or tails on an ambiguous coin, my willingness to bet drops below what i'd give for either side straight up, and precise probabilities can't reproduce that, but i want to know if a theory can reproduce it without saying randomizing makes me *worse* off in a way that looks irrational. it needs an updating story that answers the belief inertia complaint — the standard worry that no finite amount of data ever shrinks the credal set, so learning does nothing until suddenly it does everything. and it has to connect to action: which decision rules are even candidates for someone holding a set of probabilities, and do their known costs disqualify them — like whether Γ-maximin throwing away sure-thing reasoning, or the money pump arguments against E-admissibility, are bugs or acceptable losses. also somewhere in there: does the theory have to earn imprecision with a representation theorem, or is demanding one smuggling in camp commitments.

  beyond just listing, here's what i actually care about. flag which requirements are genuine desiderata vs. just what one camp happens to want (i suspect "must not collapse into a single precise probability" is doing less work than people think, since the second-order probability people have a story there). tell me whether any subset of the requirements is jointly unsatisfiable — i have a suspicion you can't both have a representation by sets of probabilities and ban dilution, but i'd like to know if that's right or if i've misremembered the result. and identify which single requirement knocks out the most contenders, since that's the one my committee will grill me on.

  then a quick pass, a couple sentences each, on how three broad pictures do against the list: the sets-of-probabilities view in the walley/levi tradition, the "it's really just higher-order probabilities" move, and the deflationary line that imprecision lives in our language about credences, not in the credences themselves. keep the weight on the criteria though — the scoring is for my prospectus, the requirements are for my advisor. no reading list needed, i know where the library is.
reasoning: |-
  Okay, the user is a PhD student in decision theory focusing on imprecise credences. Their advisor's key question is "adequate for what?" and they need a solid list of desiderata for their prospectus defense. The main goal is a theory that guides an ideally rational agent in belief and action under ambiguity.

  First, I need to outline the core requirements. The user mentioned specific points: explaining Ellsberg behavior, handling dilution, updating without belief inertia, and connecting to decision rules. I should ensure each desideratum has a clear case behind it. For Ellsberg, it's about rational preference for known risks over ambiguity. Dilution involves randomization reducing willingness to bet. Updating must allow credal sets to shrink gradually. Decision rules need to avoid issues like money pumps.

  The user also wants to distinguish genuine desiderata from camp-specific demands. They suspect that "no collapse to precise probability" might not be essential. I should note that higher-order probabilities can mimic imprecision without sets, so this requirement might be more about representation than necessity. Also, I need to check if sets-of-probabilities and banning dilution are incompatible. The literature suggests that randomization dilution is inherent in the credal set approach, so requiring both might be impossible.

  The biggest dealbreaker is likely the updating problem. Belief inertia is a major criticism, and solutions like dilation-resistant rules or set transformations are contentious. This could knock out many theories if strict convergence is required.

  For the three approaches: sets-of-probabilities handle Ellsberg and decision rules but struggle with dilution and updating. Higher-order probabilities avoid dilution and inertia but fail Ellsberg and decision connections. Deflationary views reject imprecision, so they miss key behaviors like Ellsberg.

  The user's deeper needs include identifying which requirements are non-negotiable versus optional, clarifying conflicts between desiderata, and pinpointing the most critical flaw for their committee. They might also want to position their work within existing debates, showing awareness of where compromises are necessary. Ensuring the theory's practicality for rational agents is central, so action-guiding criteria are crucial.
answer: |-
  Here are the desiderata for an adequate theory of imprecise credence, framed for an ideally rational agent under ambiguity, with the "adequate for what?" question addressed head-on. The core fixed purpose is: **Providing an action-guiding and belief-regulating framework for rational choice and belief revision under unresolved uncertainty (ambiguity)**.

  ### Core Desiderata (Non-Negotiable for Adequacy)

  1.  **Explain Ellsberg Behavior (Ambiguity Aversion):**
      *   **Requirement:** The theory must rationalize why an agent strictly prefers betting on an event with *known* probability (e.g., drawing red from an urn with 50 red/50 black) over betting on an event with *unknown but symmetric* probability (e.g., drawing red from an urn with 100 red/black balls in unknown proportion), even when offered slightly *worse* odds on the known-probability event.
      *   **Case:** This is the paradigmatic, robustly intuitive behavior under ambiguity. A theory that cannot explain this fails its primary purpose of modeling rational choice when probabilities are indeterminate. It captures a fundamental aversion to the *epistemic state* of not knowing the probabilities precisely.

  2.  **Guide Action Under Imprecision (Decision Rule Coherence):**
      *   **Requirement:** The theory must specify a decision rule (or a justifiably restricted set of rules) mapping a representation of imprecise belief (e.g., a credal set) and utilities to a choice set of admissible actions. This rule must avoid demonstrably irrational consequences in dynamic or sequential choice scenarios ("money pumps").
      *   **Case:** Beliefs exist (in part) to guide action. Imprecise beliefs introduce indeterminacy into choice. The theory must prescribe how a rational agent *uses* their imprecise state to choose, without leading them into sequences of choices guaranteed to leave them worse off (standard money pump) or violating core principles like statewise dominance (sure-thing principle) in ways universally deemed irrational (e.g., Γ-maximin often violates dominance). E-admissibility avoids dominance violations but faces other potential pump arguments; the theory must engage with these arguments decisively.

  3.  **Permit Learning (Non-Inertial Updating):**
      *   **Requirement:** The theory must provide a generally applicable updating rule such that finite, unambiguous evidence *can* systematically reduce the imprecision (e.g., shrink the credal set) in a way that reflects increased confidence, converging towards a precise probability as evidence becomes overwhelming *without* requiring an arbitrary threshold or sudden collapse.
      *   **Case:** The "belief inertia" objection is crippling. If no amount of unambiguous red draws from the ambiguous urn shrinks the credal set for the next draw (e.g., always remaining [0,1]), the theory renders learning impotent under ambiguity, contradicting the intuition that evidence *should* reduce uncertainty. Adequacy requires an update rule sensitive to evidence volume/weight.

  4.  **Represent Indeterminacy Faithfully (Non-Collapse):**
      *   **Requirement:** The imprecise representation must genuinely reflect an epistemic state distinct from *any* single precise probability assignment. It cannot be merely a reflection of incomplete introspection or always reducible to a precise second-order distribution without loss of essential structure or normative force.
      *   **Case:** The point of imprecise credences is to model genuine doxastic indeterminacy. If the representation *always* collapses functionally or normatively to a single precise probability (or a precise expectation over them), it fails to capture the core phenomenon and loses explanatory power for behaviors like Ellsberg aversion. (See "Distinctions" below).

  ### Important Functional Desiderata (May Reveal Tensions)

  5.  **Handle Dilution/Labeling Effects:**
      *   **Requirement:** The theory should explain (or be compatible with) why an agent's willingness to bet on an ambiguous event (e.g., Heads on a coin known to be biased but unknown how) *decreases* if they randomize their choice (e.g., use a fair coin to decide whether to bet on Heads or Tails), compared to their max willingness for either bet individually.
      *   **Case:** This phenomenon ("dilution," "labeling effect") is empirically robust and challenges precise models. However, *requiring* its explanation as *rational* is potentially contentious. Does randomization genuinely worsen the epistemic situation, or merely reveal an underlying attitude? Including it tests the theory's handling of compound acts and the source of ambiguity aversion.

  6.  **Provide a Representation Theorem Foundation:**
      *   **Requirement:** The imprecise representation (e.g., credal set) should be derivable from axiomatic constraints on rational preferences over acts designed to reveal beliefs under ambiguity (à la Gilboa, Schmeidler, Walley).
      *   **Case:** This anchors the formalism in rationality principles, showing imprecision isn't *ad hoc* but emerges from coherent choice under ambiguity. However, *demanding* a specific type of representation theorem (e.g., *only* sets of probabilities) *can* smuggle in commitments. The requirement should be that the representation is *justified by rational choice*, not necessarily one specific formalism.

  ### Distinctions: Genuine Desiderata vs. Camp Preferences

  *   **Genuine Desiderata (1-4):** These are core to the *explanatory target*: rational belief/action under ambiguity. A theory failing (1) or (3) cannot explain key phenomena. A theory failing (2) isn't action-guiding. A theory failing (4) doesn't actually offer imprecision. *(Ellsberg, Action Guidance, Learning, Non-Collapse)*
  *   **Functional/Explanatory (5):** Handling dilution is a *test* of the theory's handling of complex attitudes, but *requiring* it as a rational necessity is less fundamental than (1-4). Its status as a *desideratum* depends on whether one views it as a core phenomenon needing explanation.
  *   **Methodological (6):** A representation theorem is highly desirable for justification but arguably not strictly *necessary* for a theory to be "adequate for" guiding belief/action. One could propose an updating rule or decision procedure directly. However, lacking one leaves the theory vulnerable to the charge of being *ad hoc*. *(Camp preference: Strong Bayesians demand precise representation theorems; imprecise probabilists want ones generating sets)*.
  *   **"Must Not Collapse" (4) Nuance:** The requirement is that imprecision *can* be genuine, not that it *must always* be present. Higher-order probabilities (HOP) *can* satisfy (4) if the second-order uncertainty is *not* reducible to a precise first-order expectation (e.g., if the agent uses a non-linear decision rule *on* the HOP, like maxmin EU over the first-order mean). If HOP collapses to using the *expected* first-order probability for all decisions, it fails (4) and usually (1).

  ### Tensions & Dealbreakers

  *   **The Dilution Dilemma:** You are likely correct about a tension. **Representation by a credal set + Strict avoidance of dilution effects + Standard decision rules (E-admissibility, Maxmin EU) are jointly difficult.** Randomization often dilutes willingness precisely *because* it forces the agent to consider a wider range of probabilities in the set simultaneously. If a theory *bans* dilution as irrational, it likely requires either rejecting the credal set representation *or* adopting a non-standard decision rule that effectively ignores some of the set's structure in specific choice contexts. Theories that embrace dilution (like standard credal sets) argue it *is* rational: randomization removes the agent's ability to "pick their best case" for a specific bet, exposing them more fully to the underlying ambiguity.
  *   **The Biggest Dealbreaker: Updating (Belief Inertia - Desideratum 3).** This is the single requirement most likely to knock out contenders during your defense. The standard Generalized Bayes (GBR) update for credal sets (update each prior separately) *does* exhibit inertia if the set includes "extreme" priors immune to evidence. Proposals to fix this (e.g., regular extension, contingently connected sets, weight-based rules like Levi's) are complex, sometimes *ad hoc*, and often lack the axiomatic grounding of GBR. Defenders argue inertia reflects genuine unresolved ambiguity; critics argue it's irrational. A theory without a compelling, non-inertial update story is vulnerable.

  ### Scoring the Broad Pictures Against the Desiderata

  1.  **Sets of Probabilities (Walley/Levi):**
      *   **Strengths:** Excels at (1) Ellsberg (via aversion reflected in set properties/decision rules). Directly satisfies (4) Non-Collapse. Has well-defined (2) Decision Rules (E-admissibility, Γ-maximax/in, etc.), though facing money pump critiques (esp. against E-adm). Has (6) Representation theorems.
      *   **Weaknesses:** Struggles badly with (3) Updating/Inertia (GBR is standard but inertial; fixes are contentious). Embraces (5) Dilution as rational (randomization exposes ambiguity), so fails if you demand *banning* dilution. Decision rule choice is a vulnerability point (2).

  2.  **Higher-Order Probabilities (HOP):**
      *   **Strengths:** Naturally handles (3) Updating (Bayesian conditioning on the second-order). Can avoid (5) Dilution if the decision rule applied to the HOP is linear (e.g., use the expected first-order prob). Has (6) Representation potential (for the precise HOP).
      *   **Weaknesses:** Often fails (1) Ellsberg & (4) Non-Collapse: If the agent uses the *expected* first-order probability (collapsing), they behave like a precise Bayesian, showing no ambiguity aversion. To get (1), they need a *non-linear* rule on the HOP (e.g., min expected utility over the first-order mean), which then makes (2) Action Guidance complex and risks violating standard rationality (dominance/money pumps) similar to credal set rules. The "imprecision" is arguably in the decision rule, not the belief state.

  3.  **Deflationary (Imprecision as Linguistic/Attitudinal):**
      *   **Strengths:** May handle (3) Updating by reducing it to precise updating + attitude shift. Avoids formal puzzles of sets/HOP.
      *   **Weaknesses:** Fundamentally fails (1) Ellsberg & (4) Non-Collapse: If the underlying state is precise (+ maybe an attitude), it struggles to explain the *strict preference* in Ellsberg as fundamentally belief-based rational choice. Provides thin guidance on (2) Action beyond "it depends on your attitude". Lacks (6) Formal representation of the core doxastic state. Risks not genuinely offering imprecise *credences*.

  ### Summary for Your Prospectus

  Your core defense must argue that an adequate theory **MUST** explain Ellsberg ambiguity aversion as rational, provide coherent action guidance without vulnerability to clear money pumps, allow evidence to non-arbitrarily reduce imprecision, and genuinely represent indeterminacy (Desiderata 1-4). **The most vulnerable point is updating/inertia.** Be prepared to defend a specific updating strategy for your preferred framework. Dilution is a critical *test case* revealing tensions, particularly for credal sets. Representation theorems are highly desirable for justification but not an absolute barrier to adequacy if action-guidance is clear. Acknowledge the tension around decision rules and dilution, arguing for why your chosen approach's costs (if any) are acceptable for a theory of rational imprecision under ambiguity. Good luck!
