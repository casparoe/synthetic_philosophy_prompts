prompt: |-
  My friend Marnie has this whole thing about which bad-feeling emotion is the right one to have after you screw up, and which ones people should be steering each other toward. Her track record so far:

  - Guy cheats on his taxes, feels awful about the act ("that was a shitty thing I did") but doesn't spiral about being a bad person — she says that's basically the healthy version and that the feeling will actually help him fix it.
  - Same kind of guy, but instead he can't stop thinking "I'm the kind of person who does this" and its eating him alive — she thinks that's close to useless at best, corrosive at worst.
  - A kid caught shoplifting: parents who make him stand in front of the family and say what he is (a thief) vs. parents who make him return the item and apologize to the shopkeeper — she's firmly for the second and says the first is teaching the wrong thing.
  - Online public shaming pile-ons: against them even when the target genuinely did something wrong, and even when it "works".
  - Restorative justice circles, where the offender has to sit face to face with the people they harmed — surprisingly fine with those, says they're not about the self at all even though they sound humiliating.

  Next month she's visiting my ethics class and the students want to run some new cases past her, and I want to predict her verdicts beforehand so we can check. The new cases:

  1. A surgeon whose honest mistake killed a patient, who responds with intense guilt, reviews exactly what went wrong, changes her checklist — but privately holds onto "I'm still a good surgeon." Shame-free, or as some of the students will put it, shamelessly. Will Marnie approve?
  2. Survivor's guilt: someone who did nothing wrong at all, feels guilty anyway. Does her rule even apply? Is there such a thing as guilt without a bad act, and if so is it a counterexample to whatever she's running?
  3. A culture (people always want to say Japan, or the old Mediterranean honor cultures, honestly not sure it matters) where shame does a lot of the work that guilt does elsewhere. Is she committed to saying that whole arrangement is worse, or could she say it works fine for them? She once told me cultures can pick these things the way they pick utensils, but I've also heard her talk as if guilt-culture vs. shame-culture is a straight-up moral ranking, so I genuinely can't tell which she'd say.

  What I want from you: work out the rule(s) she's implicitly running that fit all five original verdicts. I suspect more than one rule fits — e.g. one about what the feeling targets (the act vs. the self), one about what it does (motivates repair vs. motivates hiding), maybe one about who applies it (your own conscience vs. an audience). For each rule that fits, say what it predicts for cases 1-3. Then give me your best guess on each case with your reasons, and tell me what further case would split whatever rules are still agreeing after this round. Also flag if you think any of her original five verdicts are actually in tension with each other, because the students will find it if there is one.
reasoning: |-
  Hmm, the user is asking me to analyze Marnie's philosophy on guilt and shame based on her track record of verdicts. They've provided five examples:

  1. Tax cheat feels bad about the act but not about being a bad person → Healthy
  2. Tax cheat spirals about being a bad person → Useless/corrosive
  3. Shoplifting kid labeled "thief" → Bad approach
  4. Shoplifting kid made to return item/apologize → Good approach
  5. Online shaming pile-ons → Bad even when justified
  6. Restorative justice circles → Good despite seeming humiliation

  Now they want me to predict how Marnie would respond to three new cases involving a surgeon with guilt but no shame, survivor's guilt, and cultural differences in shame vs. guilt.

  I need to identify the underlying principles in Marnie's philosophy that explain all her original verdicts. From what I can see, she clearly distinguishes between guilt (feeling bad about an action) and shame (feeling bad about oneself). She values guilt because it motivates repair and improvement, while seeing shame as counterproductive because it leads to hiding, avoidance, or self-loathing without addressing the harm.

  I should extract multiple possible rules that fit all five original cases. For example:
  - Rule 1: Focus on the action vs. the self
  - Rule 2: Motivation toward repair vs. avoidance
  - Rule 3: Internal conscience vs. external audience

  For each rule, I'll apply it to the new cases to generate predictions. For the surgeon case, since she focuses on the mistake and improves her process without internalizing it as being a bad surgeon, Marnie would likely approve. Survivor's guilt is interesting because there's no bad act, so it might fall outside her framework, but she might view it as maladaptive since there's nothing to repair. On cultural differences, she seems to prioritize function over form - if shame motivates repair in a culture, she might accept it, but if it leads to avoidance or suicide, she'd criticize it.

  The user also wants me to identify any tensions in her original positions. Restorative justice might seem like public shaming, but Marnie likely sees it as focused on repair rather than humiliation. I should suggest a case that would test this distinction, like a non-reparative public shaming ritual.

  I'll structure my response by first stating the rules, then applying them to the new cases, making predictions with reasoning, and finally suggesting a case that could differentiate between the rules.
answer: |-
  Based on Marnie's track record, her core philosophy centers on **functional emotions that facilitate repair versus dysfunctional emotions that focus on the self or invite avoidance.** She distinguishes sharply between guilt (unhealthy focus on the *self* as bad) and remorse/accountability (healthy focus on the *action* as bad and its consequences). Crucially, she evaluates emotions based on **what they motivate** and **where the focus lies**.

  ### Rules Fitting All Five Original Verdicts
  1.  **The Target Rule:** Healthy emotion focuses on the **action/harm** ("that was bad"). Unhealthy emotion focuses on the **self/identity** ("I am bad").
  2.  **The Function Rule:** Healthy emotion **motivates concrete repair** (fixing the mistake, apologizing, changing behavior). Unhealthy emotion **motivates avoidance, hiding, or self-flagellation** (spiraling, defensiveness, withdrawal, feeling irredeemable).
  3.  **The Audience Rule:** Healthy emotion is driven by **internal conscience and the perspective of the harmed party**. Unhealthy emotion is driven by **external judgment, social status, or abstract notions of "what people will think of me"**.

  *All three rules perfectly explain the original five cases:*
  *   **Tax Cheat 1 (Healthy):** Focuses on the *act* ("shitty thing I did") - *Target Rule*. Motivated to *fix it* - *Function Rule*. Driven by internal conscience about the act - *Audience Rule*.
  *   **Tax Cheat 2 (Unhealthy):** Focuses on the *self* ("I'm the kind of person...") - *Target Rule*. Causes spiraling (avoidance/self-flagellation), not repair - *Function Rule*. Driven by abstract internal judgment of self-worth, not the specific harm - *Audience Rule*.
  *   **Shoplifting - Label "Thief" (Unhealthy):** Focuses on the *self/identity* ("you are a thief") - *Target Rule*. Likely motivates hiding/defensiveness/shamed identity, not specific repair - *Function Rule*. Driven by family judgment/status, not the shopkeeper's harm - *Audience Rule*.
  *   **Shoplifting - Return/Apologize (Healthy):** Focuses on the *act/harm* (wrong to steal *from the shopkeeper*) - *Target Rule*. Motivates concrete *repair* (return, apology) - *Function Rule*. Driven by the perspective of the harmed party (shopkeeper) - *Audience Rule*.
  *   **Online Shaming (Unhealthy, even when "justified"):** Focuses on the *self/identity* (public branding as "bad person") - *Target Rule*. Motivates *avoidance/hiding* (deletion, silence) or self-flagellation without direct repair to the harmed - *Function Rule*. Driven by massive *external judgment* and social status loss - *Audience Rule*.
  *   **Restorative Justice (Healthy):** Focuses on the *harm to specific others* - *Target Rule*. Designed to motivate *repair* (understanding impact, making amends) - *Function Rule*. Driven by the *perspective of the harmed individuals*, not an abstract audience - *Audience Rule* (the "humiliation" comes from facing the *harm done*, not public scorn).

  ### Predictions for New Cases (Based on the Rules)

  1.  **The Surgeon:**
      *   **Target Rule Prediction:** APPROVE. Focus is on the *mistake* and its consequences (patient death), not "I'm a bad surgeon." She believes "I'm still a good surgeon" is a necessary functional belief to continue operating effectively while learning from the error.
      *   **Function Rule Prediction:** APPROVE. Intense guilt motivates concrete repair (review, checklist change). Holding onto competence is necessary for *continued* effective action/repair in her role.
      *   **Audience Rule Prediction:** APPROVE. Response is internal, conscience-driven (review, checklist change), focused on the harm done to the patient and preventing future harm. No indication of external judgment driving it.
      *   **Overall Prediction & Reason:** **Marnie will strongly APPROVE.** This exemplifies healthy guilt/remorse: action-focused, repair-oriented, internally driven. The "shamelessness" (lack of identity shame) is precisely what allows her to function and improve without debilitating self-loathing. This aligns perfectly with the Tax Cheat 1 case.

  2.  **Survivor's Guilt:**
      *   **Target Rule Prediction:** PROBLEMATIC. Focus is misplaced. There *was no bad act* by the survivor to target. The feeling attaches to the *self* ("I shouldn't be here") despite no culpability.
      *   **Function Rule Prediction:** PROBLEMATIC/USELESS. It motivates no concrete repair (there's nothing to fix that they caused) and often leads to dysfunctional behavior (self-punishment, withdrawal) – classic avoidance/self-flagellation.
      *   **Audience Rule Prediction:** PROBLEMATIC. Driven by an internal, distorted conscience ("I don't deserve this"), not by the perspective of a harmed party (no one was harmed *by the survivor*). It's an internalization of misfortune, not accountability.
      *   **Overall Prediction & Reason:** **Marnie will see this as a counterexample/dysfunctional variant.** It *looks* like guilt but lacks the core element: a *bad act committed by the feeler*. It violates the Target Rule (focuses on self without a bad act) and the Function Rule (motivates no repair, only suffering). She'd likely call it maladaptive and unrelated to her framework of *accountability* for one's *own* actions. It's guilt without transgression = unhealthy.

  3.  **Shame Culture (e.g., Japan, Honor Cultures):**
      *   **Target Rule Prediction:** MIXED/WORRY. Shame inherently focuses on the *self* ("I have brought dishonor") and social identity, not just the specific act. This directly conflicts with the Target Rule.
      *   **Function Rule Prediction:** **CRITICAL QUESTION:** Does shame *function* to motivate genuine repair and prosocial behavior *within that culture*? If yes (e.g., motivates restitution, changed behavior to restore honor/group harmony), she *might* tolerate it. If it primarily motivates avoidance, suicide, or scapegoating (hiding the "stain"), she will condemn it.
      *   **Audience Rule Prediction:** PROBLEMATIC. Shame is fundamentally driven by *external* judgment and social standing ("what will they think?"). This directly violates the Audience Rule favoring internal conscience and the harmed party's perspective.
      *   **Overall Prediction & Reason:** **Marnie will be critical but nuanced.** Her "utensils" comment suggests she acknowledges cultural variation. However, her core rules make her deeply skeptical of shame-based systems:
          *   They inherently violate the Target Rule (self-focus) and Audience Rule (external driver).
          *   Their functionality (Function Rule) is key. If shame demonstrably leads to high levels of sincere repair, reduced recidivism, and strong social cohesion *without* excessive avoidance/suffering, she *might* concede it "works for them," albeit less ideally than guilt-based accountability. However, given her critiques of identity-labeling and public shaming, she likely sees inherent risks in shame cultures for fostering hidden dysfunction, avoidance, and misdirected responses (e.g., suicide over apology). **Her ranking isn't just moral; it's functional:** guilt cultures, *on average*, better promote targeted repair and psychological resilience. She'd likely say shame cultures get the *job* of social control done, but often at a higher individual/functional cost.

  ### Potential Tension in Original Verdicts & Splitting Case
  *   **Tension:** The **Restorative Justice (RJ) vs. Online Shaming** verdicts present the *most apparent tension*. Both involve a public/audience element and could be seen as humiliating. Why is one condemned and the other approved?
      *   **Resolution via the Rules:** The rules resolve this clearly. Online shaming violates *all three*: targets the *self* (identity), motivates *avoidance*, and is driven by *external mob judgment*. RJ adheres to all three: targets the *specific harm* to *specific people*, is designed to motivate *repair* (amends, understanding), and is driven by the *perspective of the harmed individuals* present, not an abstract audience. The "audience" in RJ *is* the harmed party. The "humiliation" in RJ stems from facing the *consequences of one's actions on others*, not from being judged as a fundamentally bad person by strangers.
  *   **Splitting Case:** To test the boundaries between the rules (especially Function vs. Audience), propose:
      > **The Non-Reparative Apology Ritual:** In a specific community, someone who commits a minor offense (e.g., breaking a borrowed tool) must perform a highly stylized, public apology ritual focused on self-abasement ("I am clumsy and worthless") in front of the whole village. This ritual is culturally required, satisfies the community, restores the offender's standing, and effectively prevents future offenses through fear of humiliation. However, it involves no direct repair to the owner (tool isn't fixed/replaced by offender), no discussion of the specific harm caused to the owner, and reinforces a permanent label of inherent flaw. The owner often feels the debt is paid purely by the ritual.

      *   **How it Splits:**
          *   **Function Rule (Marnie likely DISAPPROVES):** It "works" to prevent future offenses (deterrence) and restore social harmony, but does *not* motivate concrete *repair* of the harm (broken tool). It reinforces self-focus/abasement.
          *   **Audience Rule (Marnie clearly DISAPPROVES):** Driven entirely by external community judgment and status restoration, not the harmed owner's perspective or internal conscience.
          *   **Target Rule (Marnie DISAPPROVES):** Focuses on the *self* ("I am clumsy and worthless").
      *   **Why it Splits:** This case highlights whether "works" (Function Rule - deters future offense, restores harmony) is sufficient for Marnie, or if *how* it works (self-focus, external driver, lack of direct repair) violates her other principles. Her original verdicts (especially condemning labeling the kid a "thief" and online shaming) strongly suggest she would disapprove of this ritual despite its functional effectiveness in social control, because it violates the Target and Audience rules and lacks genuine repair. This separates pure functional deterrence/social harmony from her requirement for action-focused, harm-repairing, internally/conscience-driven accountability. Her approval of RJ depends on the *repair* function and *harmed-party* focus, not just the public nature or effectiveness in stopping future offenses. This ritual lacks those core elements.
