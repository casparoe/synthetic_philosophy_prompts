  Okay, the user is in a graduate seminar on the ethics and law of consent. They want to establish a set of desiderata—essential requirements—for any adequate theory of valid consent before diving into the rival theories. They've provided seven key areas that the desiderata must cover, and they want each requirement motivated by a specific case or consideration. They also want to know which requirements are non-negotiable versus artifacts of specific theoretical camps, which subset might conflict and be jointly unsatisfiable, and which requirement does the most work in ruling out otherwise plausible theories.

  First, I need to make sure I cover all seven points they listed: deception, exploitation through offers, gradable competence, consent to harm, proxy consent, conditional consent, and formalities. For each, I should explain the motivating case clearly. For example, for deception, the classic case is impersonation in a darkened room versus deception about wealth. That shows why the nature of the act or identity matters more than peripheral details.

  The user wants me to mark which desiderata are non-negotiable and which might be artifacts of certain theories. Non-negotiables are likely things like the deception distinction—most theories agree that deceiving about core aspects invalidates consent. But something like consent to serious harm might be contested; paternalistic views might say it's impossible, while autonomy-based theories might allow it. So I'll flag that as a potential artifact.

  They suspect that the normative-power and autonomy-protection pictures divide the list and each sacrifices something essential. Normative-power views (Hohfeldian) see consent as changing normative relations, which might handle conditional consent well but struggle with exploitation cases. Autonomy-based views focus on genuine choice, which explains exploitation but might struggle with formalities. Protective views prioritize welfare, which helps with competence but might overreach into paternalism. The tension between autonomy and welfare is probably irreconcilable—requiring both might be impossible.

  The single requirement that does the most work in ruling out theories is likely "voluntariness beyond threats." It forces theories to address exploitation through offers, which is a major challenge. Utilitarian and Hohfeldian views might accept such consent as valid, but autonomy-focused theories would reject it, creating a big divide.

  I should avoid scoring existing theories since the user will do that in class. My role is to set up the desiderata clearly and neutrally. Also, I need to keep the language academic but accessible, as this is for a grad seminar. 

  Now, structuring the response: I'll list each desideratum with a title, motivation, and then note non-negotiables vs. artifacts. After the list, I'll discuss the subset that conflicts and the key requirement. The user's hunch about normative-power vs. autonomy-protection dividing the list makes sense—I'll highlight that core tension. 

  Finally, I'll ensure the conclusion ties together the conflicts and the pivotal role of voluntariness, emphasizing that this framework will help them evaluate theories in class. This should give them a solid foundation for their seminar discussions.
answer: |-
  Here is a comprehensive list of desiderata for an adequate theory of valid consent, structured around your specified cases and considerations. I'll articulate the requirement, motivate it with the case, and flag non-negotiable status vs. theoretical artifacts. Finally, I'll address the suspected tensions and the pivotal requirement.

  ---

  ### **Desiderata for a Theory of Valid Consent**

  1.  **Requirement: Deception Distinction**
      *   **What it must deliver:** Distinguish between deception that invalidates consent (core deception) and deception that does not (peripheral deception).
      *   **Motivating Case:** Impersonation of a partner in a darkened room invalidates consent because the agent's fundamental understanding of "what they are doing" or "with whom" is false. Deception about wealth or marital status usually does *not* invalidate consent, as these are peripheral to the core nature of the act itself (e.g., sexual intercourse, a financial transaction).
      *   **Non-negotiable vs. Artifact:** **Largely Non-negotiable.** Any credible theory must explain why core deception (nature/identity) undermines consent in a way peripheral deception (motivations/background) typically does not. Failing here makes a theory deeply counterintuitive. (*Potential Artifact Note:* Some strong paternalist views *might* stretch to invalidate more peripheral deception if it leads to severe harm, but this risks overreach).

  2.  **Requirement: Voluntariness Beyond Threats (Addressing Exploitation via Offers)**
      *   **What it must deliver:** Explain whether consent given under conditions of extreme desperation or severely constrained alternatives, but *without* coercion via threats (e.g., "offers one cannot refuse"), is valid or vitiated due to involuntariness.
      *   **Motivating Case:** The desperate patient offered the only slot in a risky medical trial. Is their agreement truly voluntary, or is it rendered invalid by their vulnerability and lack of meaningful choice? Does the *source* of the constraint (structural injustice vs. direct threat) matter?
      *   **Non-negotiable vs. Artifact:** **Contested Core.** Distinguishing valid consent under pressure from vitiated consent due to exploitation is crucial. However, *where the line is drawn* is highly theory-dependent. Autonomy views see severe constraint as undermining agency, making it non-negotiable for them. Normative-power/Hohfeldian views might see any unforced "yes" as valid consent, viewing the problem as one of unjust *terms* rather than invalid consent. Protective views see preventing exploitation of vulnerability as core. This requirement *exposes* fundamental theoretical divides.

  3.  **Requirement: Gradability & Fluctuation of Competence**
      *   **What it must deliver:** Account for competence as a spectrum (not binary) that can fluctuate over time and across domains, and explain how consent operates at the boundaries (intoxication, cognitive disability, mental illness, maturity). Must handle advance directives where a past competent self binds/guides a future incompetent self.
      *   **Motivating Case:** Can a mildly intoxicated person consent to a taxi ride but not a financial contract? How much dementia invalidates consent for medical procedures? Does an advance directive refusing life-saving treatment bind when the patient *now*, though incompetent, seems content?
      *   **Non-negotiable vs. Artifact:** **Non-negotiable.** A theory must grapple with the reality that decision-making capacity isn't all-or-nothing. It must provide principled ways to assess *sufficient* competence *for this specific decision* at *this specific time* and address temporal identity questions raised by advance directives. Failure here renders the theory practically useless.

  4.  **Requirement: Limits of Consent (Consent to Harm/Wrong)**
      *   **What it must deliver:** Explain whether valid consent can be given to acts that cause serious harm or are inherently wrong (e.g., dangerous non-therapeutic experimentation, degrading contracts, certain extreme forms of BDSM, self-mutilation). If not, explain *why* consent fails in these cases despite apparent willingness.
      *   **Motivating Case:** Can someone validly consent to participate in a potentially lethal experiment purely for high payment? Can a person consent to be genuinely humiliated or physically harmed for another's pleasure? A negative answer commits the theory to a substantive account of harms/wrongs that cannot be waived by consent alone.
      *   **Non-negotiable vs. Artifact:** **Major Artifact / Core Battleground.** This is *the* defining split. Autonomy/Normative-power views often argue consent *can* validate such acts (respecting choice/waiver). Protective/Paternalist views argue core welfare or dignity interests cannot be waived, making consent impossible or irrelevant for these acts. *Needing* to explain the limits is non-negotiable; *where the limits are set* is theory-laden.

  5.  **Requirement: Proxy Consent & Standing**
      *   **What it must deliver:** Explain the basis and scope for one person (proxy) giving consent *for* another (child, permanently incompetent adult). Define the proxy's obligations (best interests? substituted judgment?).
      *   **Motivating Case:** Parents consenting to medical treatment for a child; a court-appointed guardian consenting to surgery for a patient with advanced dementia. On what authority does the proxy act? What standards constrain them? Can a child *ever* consent independently (mature minors)?
      *   **Non-negotiable vs. Artifact:** **Non-negotiable.** Any comprehensive theory must account for non-autonomous agents. The *justification* for proxy consent (e.g., based on welfare or presumed prior autonomy via precedent autonomy) will be theory-dependent, but the *need* to handle these cases is essential. The "standing" question (who gets to decide *who* decides) is critical.

  6.  **Requirement: Conditional Consent & Scope**
      *   **What it must deliver:** Explain the nature of conditional consent (e.g., "only with a condom," "only search the living room"). Crucially, determine if violating the condition means (a) consent was *never* given for the actual act performed (invalidating consent), or (b) consent *was* given for the core act, but a distinct wrong (e.g., breach of agreement, assault) occurred when the condition was violated.
      *   **Motivating Case:** Sex with a condom removal ("stealthing"); a police search exceeding the agreed-upon scope. Does the act become non-consensual *ab initio*, or was it consensual but accompanied by a separate violation?
      *   **Non-negotiable vs. Artifact:** **Largely Non-negotiable.** A theory must explain how consent defines the *specific act* permitted. The dominant intuition (especially in sexual contexts) leans towards (a) – violation negates consent – suggesting consent is inherently scope-specific. Normative-power views handle this well; other theories must accommodate it without absurdity.

  7.  **Requirement: Form, Context & Evidentiary Function**
      *   **What it must deliver:** Explain the relationship between consent as a psychological/relational state and formal expressions (signatures, verbal formulae). Are forms constitutive of consent or merely evidence? Why do the same words ("yes") work in one context (casual agreement) but not another (surgery)?
      *   **Motivating Case:** A signed surgical consent form obtained under duress or without comprehension; a verbal "yes" in a coercive interrogation vs. a relaxed conversation. Why isn't the signature alone sufficient? Why might a clear verbal "yes" sometimes be insufficient (e.g., from a minor)?
      *   **Non-negotiable vs. Artifact:** **Non-negotiable Core with Theoretical Nuance.** A theory must recognize that consent is fundamentally a mental state/communicative act, not merely a ritual. Formalities are overwhelmingly *evidentiary* and *protective*, not constitutive. However, *why* context matters (e.g., power imbalances, gravity of consequences) connects back to core elements like voluntariness, competence, and understanding. All plausible theories recognize this; they differ in how much weight context carries relative to form.

  ---

  ### **Suspected Jointly Unsatisfiable Subset & The Dividing Requirement**

  *   **The Suspected Tension:** Your hunch is correct. The requirements most likely to be **jointly unsatisfiable** across all theories cluster around the fundamental tension between **Autonomy/Normative-Power** and **Protective/Paternalist** commitments. Specifically:
      *   **Voluntariness Beyond Threats (ii):** Autonomy views demand robust conditions for voluntariness, often invalidating consent under severe desperation. Normative-power views often see any unforced choice as voluntary enough for valid consent (shifting focus to the fairness of the offer). Protective views likely invalidate such consent as exploitative.
      *   **Limits of Consent (iv):** Autonomy/Normative-power views generally allow consent to significant harm/wrong. Protective views generally do not.
      *   **Exploitation (ii) & Limits (iv) vs. Normative-Power:** The core challenge for pure Hohfeldian views is accommodating the strong intuition that exploitation (ii) *does* sometimes vitiate consent and that there *are* limits (iv) to what consent can permit. They risk making consent too easy and potentially sanctioning deeply harmful/wrongful acts if formally agreed to.
      *   **Protection vs. Autonomy:** Protective views struggle with (ii) and (iv) in the opposite direction. Insisting consent is invalid under desperation or for certain harms risks excessive paternalism, overriding clearly expressed choices that don't fit the protector's view of welfare/dignity.

  *   **The Key Dividing Requirement:** **Voluntariness Beyond Threats (ii)** is arguably the requirement that **does the most work in ruling out otherwise plausible theories.**
      *   **Why?** It directly challenges theories that focus *only* on the absence of threats (coercion) or on the formal power to waive rights (Hohfeld). Theories that cannot explain why consent under desperate circumstances induced by an *offer* might be invalid seem deeply inadequate in capturing core intuitions about exploitation and meaningful choice. This requirement forces theories to articulate a substantive account of voluntariness and the conditions for genuine agency, moving beyond formalisms or pure will theories. A theory that fails here (e.g., accepting the desperate patient's "consent" to the risky trial as straightforwardly valid) will be rejected by many as counterintuitive and potentially justifying serious injustices, even if it handles other requirements (like conditional consent or deception) well. It exposes whether a theory prioritizes *freedom from force* or *freedom for meaningful choice*.

  This list provides the critical benchmark. Each theory you encounter will likely excel on some desiderata while struggling with or explicitly rejecting others, reflecting their foundational commitments. The tension between autonomy/waiver and protection/welfare is the central fault line, and "voluntariness beyond threats" is the requirement that most sharply reveals it. Good luck with the seminar analysis!
