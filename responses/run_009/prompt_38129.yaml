prompt: |-
  In our pragmatics reading group we play a classification game: one member reports an utterance along with a candidate piece of content, and everyone judges whether that content is entailed by what is said or merely implicated. My friend's track record so far: for "Some of the guests left early," she ruled that at least one left is entailed, while that not all left is an implicature; for "She locked the door and turned off the lights," the order of the two events is an implicature; for "War is war," the sentence is trivially true yet implicates something about the horrors of war; for "That flag is red," being red is simply part of what is said; and for "He put the kettle on," said in reply to my asking where I could get tea, she held that the availability of tea is an implicature. Next week's cases: (1) "She is poor but honest," with the question whether the contrast signaled by "but" is an implicature, given that it seems resistant to explicit cancellation; (2) a trained mynah bird that utters "Some of the guests left early," with the question whether anything is implicated at all when there is no communicative intention behind the sounds; and (3) "The committee hasn't stopped publishing its findings — indeed, it never published any," with the question whether the committee's former publishing habit was ever implicated. Predict her verdict on each of the three, say which rule she seems to be running — cancellability, non-truth-conditionality, calculability from the Cooperative Principle, or something else — give your reasons for preferring one rule over its rivals, and describe a further case that would best tell those rival rules apart.
reasoning: |-
  Okay, the user is part of a pragmatics reading group playing a classification game where they judge whether content is entailed or implicated. Their friend has a track record of judgments on various utterances. Now, they're presenting three new cases for next week and want to predict the friend's verdicts, identify the rule she's using, argue for that rule, and propose a test case. 

  First, I need to understand the friend's pattern. Looking at her past judgments: 
  - For "some guests left," she treated existential commitment ("at least one left") as entailment but scalar implicature ("not all left") as cancellable. 
  - For "locked door and turned off lights," she saw temporal order as implicature despite cancellability issues. 
  - For "war is war," she recognized tautological truth but pragmatic enrichment about war's horrors. 
  - For "that flag is red," color attribution was direct entailment. 
  - For "he put the kettle on" in tea-context, availability of tea was implicature. 

  Her approach seems heavily Gricean – prioritizing calculability (inference from Cooperative Principle) and non-truth-conditionality over strict cancellability. Notably, she accepts non-cancellable implicatures (like "but" contrast or conjunction order) when they're contextually necessary for coherence. 

  Now predicting next cases: 
  (1) "She is poor but honest": The contrast feels integral but cancellable? Actually, cancelling it ("*but there's no contrast") sounds terrible. She'll likely call it entailment because without contrast, "but" reduces to "and" – violating linguistic convention. Her past tolerance for non-cancellable implicatures (conjunction order) suggests she won't require cancellability here. Rule: non-truth-conditionality (since contrast isn't truth-conditional) but she'll override due to conventionalization. 

  (2) Mynah bird "some guests left": No communicative intent → no implicatures. She'll say only entailment ("at least one left") survives. Direct application of Grice's intentionality requirement. 

  (3) "Committee hasn't stopped publishing... never published": The presupposition ("they used to publish") is triggered but false. Since presuppositions project through negation, she'll call it entailment failure (sentence true) while recognizing the pragmatic oddity. Her "war is war" verdict shows comfort with sentences being true despite failed implicatures. 

  For my argument: I prefer calculability over cancellability because many pragmatic effects (presuppositions, conventional implicatures) aren't cancellable but remain distinct from entailment. Cancellability is too narrow – it misclassifies cases like "but" or conjunction order. 

  The smoking test case: "I regret eating the cake" vs. cancellation "I regret it, though I never ate it." Regret conventionally presupposes the event happened. If her rule is calculability, she'll call this entailment (sentence becomes false if no cake eaten). If clinging to cancellability, she might incorrectly call it implicature. This exposes the flaw in strict cancellability. 

  User's deeper need: They're likely building a framework for pragmatic taxonomy. The test case request suggests they want to stress-test theories. I'll emphasize how calculability handles conventional vs. conversational implicatures better than rivals.
answer: |-
  Based on your friend's consistent pattern and the Gricean framework she adheres to, here are the predicted verdicts, the underlying rule, and supporting analysis:

  ### Predicted Verdicts
  1.  **"She is poor but honest" (Contrast signaled by "but"):** **ENTAILED** (or conventionally implicated, but *not* a conversational implicature). She will rule the contrast is *not* merely implicated.
  2.  **Trained mynah bird: "Some of the guests left early":** **NO IMPLICATURE**. Only the literal entailment ("at least one left") is present.
  3.  **"The committee hasn't stopped publishing its findings — indeed, it never published any" (Former publishing habit):** **IMPLICATED (but presupposed, and crucially, *not* entailed)**. She will rule the former publishing habit was implicated (specifically, presupposed) but *not* part of what is said/entailed.

  ### The Rule She's Running: **Calculability from the Cooperative Principle (Gricean Inference)**
  Your friend prioritizes **whether the content arises from rational inference based on the assumption of cooperative communication** (Grice's Cooperative Principle and Maxims), rather than relying solely on cancellability or non-truth-conditionality. Her track record shows this:
  *   **Scalar Implicature ("some"):** Calculated inference (Quantity Maxim) that the speaker doesn't know or isn't saying "all".
  *   **Conjunction Buttressing (Temporal Order):** Calculated inference (Manner/Relevance) based on narrative coherence.
  *   **"War is war":** Calculated inference (Relevance/Quantity) that the tautology must convey something meaningful.
  *   **"He put the kettle on" (Tea):** Calculated inference (Relevance) connecting kettle to tea availability.
  *   **"That flag is red" (Literal):** No inference needed; directly encoded.
  She treats non-calculable, conventional aspects (like the contrast of "but" or the presupposition trigger "stop") as distinct from conversational implicatures, often grouping them closer to "what is said" or entailment for classification purposes, even if they aren't strictly truth-conditional.

  ### Why Calculability is Preferred Over Rivals
  1.  **vs. Cancellability:** Her judgment on conjunction order ("locked the door and turned off lights") is key. Temporal order is *highly resistant* to cancellation (e.g., "??She locked the door and turned off the lights, but not in that order") yet she calls it an implicature. This shows she doesn't see cancellability as *necessary* for implicature status if the content is clearly calculable. Similarly, "but" contrast is uncancellable ("*She is poor but honest, and there's no contrast") but calculable (Relevance/Manner - why use 'but' unless implying contrast?).
  2.  **vs. Non-Truth-Conditionality:** While she recognizes non-TC content (conjunction order, "but" contrast, "war is war" implication), she doesn't automatically classify it as implicated. She treats the *conventional* non-TC content of "but" as part of the utterance's conventional meaning (closer to entailment), while the *inferred* non-TC content (conjunction order, scalar implicature) is conversational implicature. Calculability explains this distinction: conventional meaning isn't inferred on the spot.
  3.  **vs. "Something Else" (e.g., Presupposition Tests):** Her predicted verdict on the "stop" case shows calculability trumps pure projection tests. The former publishing habit *projects* like a presupposition (it "survives" negation: "The committee hasn't stopped publishing" still suggests they did publish), but she will call it implicated because the *speaker* uses the cancellation ("indeed, it never published any") to show they didn't intend to convey that presupposition. The *failure* of the presupposition makes the utterance true but pragmatically defective, aligning with how conversational implicatures can fail without making the sentence false (like "war is war").

  **Crucially:** Calculability subsumes the useful aspects of the rivals. Successful calculability usually implies non-truth-conditionality and *potential* cancellability (for conversational implicatures), while also handling cases where cancellability fails due to conventionalization or contextual strength. It directly addresses the core pragmatic mechanism: *inference based on communicative intent*.

  ### Test Case to Distinguish Calculability from Strict Cancellability
  **Utterance:** "John managed to solve the problem."
  **Candidate Content:** That solving the problem was difficult (or required effort).

  *   **Under Calculability (Gricean Inference):**
      *   The implicature "it was difficult" arises via the Maxim of Quantity/Relation: Why say "managed to" instead of just "solved" if there was no difficulty? The word choice triggers the inference.
      *   **Verdict:** IMPLICATED (conversational implicature). Even if difficult to cancel smoothly ("?John managed to solve the problem; in fact, it was incredibly easy"), the inference is clearly calculable and not strictly entailed.
  *   **Under Strict Cancellability:**
      *   Because the cancellation ("in fact, it was incredibly easy") is somewhat awkward/contradictory, a strict cancellability advocate might argue the difficulty is *not* merely implicated, perhaps part of the word's conventional meaning (entailment or conventional implicature).
      *   **Verdict:** Likely ENTAILED or CONVENTIONALLY IMPLICATED.

  **Why it tells them apart:** "Manage to" strongly implies difficulty through calculability (using it suggests overcoming an obstacle), yet cancellation is awkward. Calculability correctly identifies the implied difficulty as a conversational implicature derived from word choice within the Cooperative Principle, despite its relative resistance to cancellation. A rule relying *only* on smooth cancellability would likely misclassify this as entailment or conventional content. This mirrors her treatment of conjunction order – calculable inference despite cancellability issues.
