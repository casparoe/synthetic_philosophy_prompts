  ## MEMORANDUM

  **TO:** Foundation Board Members  
  **FROM:** [Your Name], Board Member  
  **DATE:** October 26, 2023  
  **SUBJECT:** Recommendation Regarding Proposed "Moral Trade" for Funding Allocation  

  **I. Introduction**  
  This memo addresses the proposed "moral trade" put forward at our last meeting: allocating the full $10M this year (2024) to the Humanitarians' top-ranked health program, in exchange for allocating the full $10M next year (2025) to a multi-year Animal-Welfare cage-free campaign. Additionally, Animal-Welfare members would make personal donations to malaria prevention, and Humanitarian members would pledge to reduce personal chicken consumption.  

  After careful analysis of the proposal's structure, potential benefits, and the significant objection raised regarding "irrational logrolling," I **recommend ACCEPTING THE TRADE, WITH KEY MODIFICATIONS** to address enforceability and perception.  

  **II. The Core Objection: "Irrational Logrolling"**  
  The central objection is valid and requires serious engagement: *If each faction genuinely believes the other's cause area yields near-zero value, then agreeing to fund the other side's priority is equivalent to deliberately wasting $10M of the foundation's resources. No rational actor should agree to this.*  

  **III. Rationality Analysis: Why the Trade *Can* Be Rational for Each Side**  
  Despite the objection, the trade can be rational *given each side's specific values and goals*, if viewed through two lenses:  

  1.  **The Lens of Absolute Priority Maximization (Over Time):**
      *   **For Humanitarians:** You value human life saved *this year* immensely. A full $10M in 2024 for your top health program likely saves significantly more lives than $5M would. While you perceive the 2025 animal allocation as worthless, securing the *absolute maximum possible impact in your priority area for 2024* is a rational win. You "pay" for this win by tolerating what you see as a future waste, but the *net gain* in your value terms (2024 impact) outweighs the loss (2025 impact).
      *   **For Animal-Welfare Advocates:** You value securing large, multi-year commitments for systemic animal suffering reduction. A full $10M, locked in for a multi-year campaign in 2025, is vastly more impactful for your goals than $5M annually. Achieving this absolute maximum commitment for your priority area is worth enduring what you see as a one-year misallocation ($10M to health in 2024). The *net gain* in your value terms (2025+ impact) outweighs the loss (2024 impact).

  2.  **The Lens of Breaking the Deadlock Cycle:**
      *   The status quo (50/50 split annually) guarantees **sub-optimal outcomes for both sides** every single year. Neither achieves their desired scale or focus. The trade offers each side **one year of optimal funding** for their cause, a significant improvement over zero optimal years.
      *   This cycle-break potentially creates momentum for more constructive future collaboration, whereas the current path perpetuates annual conflict and mutual dissatisfaction.

  **IV. Addressing the "Burning Money" Objection Directly**  
  *   **Acknowledgment:** Yes, each side is accepting that $10M will be spent on something they believe is ineffective *in that specific year*. This is the cost of the trade.
  *   **Counterpoint:** This cost is *not* irrational if the *benefit* received (full funding for their own priority in their designated year) represents a sufficiently large *net positive gain* within their own value system, compared to the perpetual half-measures of the status quo. It's a calculated sacrifice for a larger, focused gain.
  *   **Reframing:** Instead of "burning money," consider it the "price of admission" to achieve your own maximum impact goal in your designated year – a price demonstrably worth paying given the alternative of constant compromise.

  **V. Critical Modifications Required**  
  While the core trade structure holds rational potential, the original proposal carries significant risks requiring mitigation:  

  1.  **The Multi-Year Commitment (Animal Side):**
      *   **Problem:** Locking the *entire* 2025 grant into a single multi-year animal campaign before board discussion and due diligence is premature and risky.
      *   **Modification:** The 2025 commitment should be to allocate **the full $10M budget *towards Animal-Welfare priorities***, with the specific multi-year campaign(s) to be selected through the foundation's normal 2025 grant review process, guided by the Animal-Welfare members. This ensures proper vetting while honoring the spirit of full funding for their cause.

  2.  **The Personal Pledges (Goodwill vs. Enforceability):**
      *   **Problem:** These are crucial for building trust and demonstrating good faith but are entirely unenforceable. Failure to deliver could poison the agreement and future relations.
      *   **Modifications:**
          *   **Transparency & Specificity:** Each side must publicly declare (within the board) the *specific* personal actions *before* the 2024 vote.
              *   *Animal Side:* Specify the minimum "real chunk" amount each member pledges to donate to a pre-agreed, high-impact malaria/deworming charity (e.g., AMF, SCI) by [Date, e.g., March 31, 2024].
              *   *Humanitarian Side:* Specify the *meaningful* reduction in chicken consumption (e.g., "eliminate chicken from home cooking," "reduce chicken consumption by 75%," "adopt a fully plant-based diet") with a defined start date.
          *   **Gentle Accountability Mechanism:** Establish a voluntary, light-touch check-in at the start of the 2025 allocation meeting. Each member briefly reports on their personal pledge fulfillment. While non-binding, the social pressure and expectation of reporting create a stronger incentive than a private promise. Frame it as celebrating shared commitment.
          *   **Focus on Symbolism & Trust:** Emphasize that the *primary* value of personal pledges is signaling genuine respect for the other side's values and building mutual trust for the foundation's larger trade, not policing individual behavior. Their existence makes the core vote trade more credible.

  **VI. Recommendation: Accept the Modified Trade**  
  I propose the Board approve the following **Modified Moral Trade Agreement**:  

  1.  **Foundation Funds (Binding Vote):**
      *   **2024 Allocation:** The full $10M grant budget is allocated to the Humanitarian faction's single highest-ranked, board-approved global health program (malaria nets/deworming).
      *   **2025 Allocation:** The full $10M grant budget is allocated towards Animal-Welfare priorities. The specific multi-year cage-free (or other high-impact animal welfare) campaign(s) will be selected through the foundation's standard 2025 grant review process, with recommendations heavily weighted by the Animal-Welfare faction members.

  2.  **Personal Goodwill Pledges (Non-Binding but Public & Specific):**
      *   Prior to the vote on this agreement, each Animal-Welfare faction member will publicly commit (via email to the full board) to donating a specified minimum amount (e.g., $X,XXX or X% of annual charitable giving) to a designated high-impact global health charity (e.g., Against Malaria Foundation) by March 31, 2024.
      *   Prior to the vote on this agreement, each Humanitarian faction member will publicly commit (via email to the full board) to a specific, significant reduction in personal chicken consumption (e.g., elimination, >75% reduction) effective January 1, 2024.
      *   A brief, voluntary pledge status check-in will occur at the opening of the Q4 2025 board meeting.

  **VII. Why This Modified Trade is the Optimal Path**  

  *   **Maximizes Impact per Faction:** Each side achieves one year of maximal funding concentration for their top priority, a clear improvement over perpetual dilution.
  *   **Breaks Destructive Cycle:** Moves decisively beyond the exhausting and ineffective 50/50 stalemate.
  *   **Builds Trust & Respect:** The personal pledges, while unenforceable, are a tangible demonstration of taking the other side's values seriously, fostering goodwill essential for future collaboration.
  *   **Mitigates Key Risks:** Modifications address concerns about due diligence (2025 funds) and the "cheap talk" problem of personal pledges through transparency and gentle accountability.
  *   **Rational Within Values:** As argued, the net gain for each faction within their own value framework justifies the cost of funding the other side's priority in the "off" year.

  **VIII. Conclusion**  
  The "irrational logrolling" objection highlights a real tension, but it underestimates the rational calculus available: sacrificing impact in one year to achieve *maximum* impact in another year within one's own value system is a valid strategic choice, especially when the alternative guarantees *sub-maximal* impact every year.  

  The modified trade offers a unique opportunity to break our paralyzing cycle, deliver significant wins for both core missions in their designated years, and build crucial trust through meaningful personal commitments. It is a bold step towards a more impactful and less contentious future for the foundation.  

  I urge the board to **vote in favor of the Modified Moral Trade Agreement** as outlined in Section VI.  

  **APPENDIX:** Draft Resolution for Board Vote (Separate Sheet)
