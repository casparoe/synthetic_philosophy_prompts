answer: |-
  Your observations pinpoint a profound tension in modern medicine's ontology. Let's reconstruct the implicit theory, distinguish necessities from comfortable fits, explore underdetermination, and trace practical implications.

  ### The Implicit Theory: "Interventionist Normativism"
  1. **Core Premise**: Disease labels apply to states where:
     - **Probabilistic Harm Exists**: Not current dysfunction/harm, but *statistically significant risk* of future harm exceeding a population threshold.
     - **Intervention Justification**: Proven, cost-effective interventions exist to modify this risk.
     - **Medical Jurisdiction**: The state falls within medicine's technical authority (e.g., biomarkers, not grief).

  2. **Distinct from Classical Views**:
     - *Naturalism (Boorse)*: Rejected because no *current* biological dysfunction (your organs work).
     - *Pure Normativism*: Goes beyond subjective harm ("I feel fine") to objectivized risk.
     - *Hybrid?* It's normativism leveraging epidemiology—**harm is actuarial, not experiential**.

  3. **What the Practice Strictly Requires**:
     - A probabilistic model linking biomarkers to future pathology.
     - Evidence that intervention alters probabilities cost-effectively.
     - *Not required*: Current symptoms, tissue damage, or qualitative dysfunction.

  4. **Comfortable Fits (Not Strictly Required)**:
     - Conceptualizing risk as "early disease" (ontological gerrymandering).
     - Pharma influence (though not logically necessary).
     - Medical authority expansion.

  ### Philosophical Underdetermination
  Multiple theories *could* license pre-diseases, but uneasily:
  - **Normativism (Broad)**: If "harm" includes probabilistic future harm. *Fits best*.
  - **Process Naturalism**: If disease is a harmful *process* (e.g., atherosclerosis beginning silently). Osteopenia fits; prehypertension less so.
  - **Strict Naturalism (Dysfunction-Only)**: *Cannot* justify pre-diseases—no malfunction exists.
  - **Social Constructivism**: Labels reflect medicalization trends, not ontology. *Compatible but agnostic*.

  ### Consequences of Adopting Strict Naturalism
  Replacing the implicit view with "dysfunction-only" naturalism would revolutionize practice:

  | **Domain**               | **Current Practice**                          | **Under Strict Naturalism**                  |
  |--------------------------|-----------------------------------------------|----------------------------------------------|
  | **Terminology**          | "Prehypertension," "prediabetes" as diagnoses | "Elevated BP/glucose" (descriptive risk factors only) |
  | **Clinical Guidelines**  | Treatment thresholds for pre-diseases         | Interventions only for frank disease (e.g., T2D, hypertension) |
  | **Insurance Billing**    | ICD codes for pre-diseases; reimbursed monitoring | No billing for asymptomatic risk states; only preventive counseling |
  | **Doctor-Patient Talk**  | "You *have* prediabetes"                     | "Your glucose implies 30% 10-year diabetes risk" |
  | **Pharma Marketing**     | Drugs promoted for pre-diseases (e.g., metformin for prediabetes) | Drugs indicated only for diagnosed disease |

  ### Addressing Your Skeptical Friend
  - **Marketing Influence**: Undeniably real (e.g., lowering BP thresholds doubled "hypertensive" patients). But this doesn't negate an underlying theory—it *exploits* the interventionist normativism already present.
  - **Conceptual Survival**: The category *presupposes* a theory because:
    1. It requires justifying probabilistic harm as medically actionable.
    2. It distinguishes "pre-disease" from mere risk (e.g., smoking isn't "pre-lung cancer").
    3. Motives don't invalidate ontology; they reveal which theory is *vulnerable to exploitation*. Normativism is flexible enough to absorb commercial interests; naturalism resists.
  - **Evidence of Medicine's True Theory**: The refusal to medicalize aging—despite interventions (e.g., senolytics)—proves medicine inconsistently applies its normativism. Aging is excluded because:
    - It's universal (not a "deviation").
    - No single "dysfunction" exists (it's multifactorial).
    - Social/ethical pushback is overwhelming.
    - *Crucially, no *profitable* intervention yet exists to massively lower risk*. **This hypocrisy confirms normativism's dominance**: Medicine labels states as diseases when interventions are *available and monetizable*, not merely beneficial.

  ### Conclusion
  Pre-disease labeling presupposes **interventionist normativism**: a state is a disease if (1) it predicts harm with sufficient probability, and (2) modifiable with medical intervention. This is *distinct* from classical normativism (no current harm) and irreconcilable with strict naturalism (no dysfunction). The practice is philosophically underdetermined only superficially—pure naturalism can't sustain it, while normativism embraces it. Medicine's inconsistency (pre-diabetes vs. aging) exposes its unstated prioritization: **medicalization follows intervenability, not ontology**. Your skepticism is warranted, but the conceptual shift reflects a genuine, if commercially amplified, evolution in defining disease—one where risk has become pathology by another name.
