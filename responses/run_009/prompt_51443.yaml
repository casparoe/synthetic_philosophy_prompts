prompt: |-
  I've been arguing with my partner about whether everyday conventions are actually moral obligations, and I want to know if my gut reactions add up to a principle. My verdicts, for what its worth: my German friend visiting the US should tip even though he thinks (and I half agree) that tipping culture is bad and he's not the one who made it that way. Crossing against a red light at 3am with no car in sight in Manhattan: fine. The same move in a small German town: wrong, and I'd tell my kid not to do it. Cutting a queue is wrong, full stop. A tourist blocking the left side of the escalator is annoying but not doing anything wrong. Where I live you take your shoes off in people's homes, and a guest who won't is rude in a way that feels borderline morally wrong — but I can't say the same for a visitor to France who doesn't say bonjour to the shopkeeper, that just feels like a foreigner being a foreigner. And bribing the border guard in a country where that's just how things get done: clearly not excused by "when in Rome". The case I keep flip-flopping on: a local waiter who refuses tips as a protest agianst tipping culture and quietly tells customers not to — I think that's fine, maybe even admirable, but I can't square it with thinking my German friend must tip. Is there one principle that gets all or most of this, and which verdicts does it force me to drop? I suspect it's got something to do with who the convention is load-bearing for, but I can't make that precise. Would also love to know what the principle says about a visitor who declines to follow a gender-segregated seating custom on buses in a country where everyone does it but there's no law.
reasoning: |-
  Okay, let me try to unpack this user's dilemma. They're wrestling with when social conventions rise to the level of moral obligations. Their examples are all over the map—tipping in the US vs. Germany, jaywalking in different contexts, queue etiquette, shoe removal customs, and even bribery. 

  Hmm... what's the common thread? They mention feeling like some rules are "load-bearing" while others aren't. That's insightful. Like when their German friend should tip in the US because servers rely on that income—that's a system where the convention directly impacts livelihoods. But the bonjour thing in France? That's more about cultural lubrication than survival.

  The gender-segregated bus seating example is particularly thorny. The user seems conflicted about whether "when in Rome" applies when a custom feels ethically questionable. I notice they didn't mention any local opposition to that custom—that might be key. If locals are pushing back, refusing might align with solidarity. If it's universally accepted though... trickier.

  Their flip-flop on the anti-tipping waiter reveals a tension between supporting system-change and not harming individuals. The waiter's protest doesn't stiff a specific server—it's a political act. Whereas their German friend withholding tips would directly hurt that server. That distinction between targeting systems vs. harming people might be crucial.

  What's really eating at them, I think, is whether morality is universal or context-dependent. Their gut says both, which is why they need a framework that isn't purely relativist ("always follow local customs") nor absolutist ("my ethics override everything"). Something that weighs harm, reliance, and consent.

  The border guard bribe example is their line in the sand—no "when in Rome" for corruption. Why? Because it reinforces exploitation. That suggests their principle must account for whether a convention perpetuates injustice versus merely being unfamiliar.

  For the shoe-off custom... it's interesting they feel stronger about that than "bonjour." Probably because refusing to remove shoes directly disrespects the homeowner's space, while forgetting a greeting is more forgivable ignorance. Bodily vs. verbal intrusion?

  I'll need to synthesize this into something coherent. Fairness to individuals caught in systems seems central. Also: does breaking this convention make you a free-rider? (Like queue-jumping does). And is the burden of your rebellion falling on vulnerable people? (Unlike the waiter's protest).
answer: |-
  Your intuitions reveal a sophisticated, context-sensitive approach to conventions—and there *is* a coherent principle tying them together. The key isn't just whether a convention exists, but **whether disregarding it unfairly harms others, exploits cooperative systems, or reinforces injustice**. Let's break this down:

  ### Your Principle: The Cooperative Harm Test
  **A convention becomes a moral obligation when:**
  1.  **Reliance:** Others reasonably depend on it for fair treatment, livelihood, or orderly functioning.
  2.  **Unfair Harm/Burden:** Violating it shifts costs, burdens, or harms onto specific individuals or the cooperative system itself.
  3.  **Free-Riding:** It allows you to benefit from the system while dodging your share of its cooperative costs.
  4.  **Injustice:** The convention itself actively perpetuates significant injustice or oppression.

  ### Applying the Principle to Your Cases
  1.  **German friend tipping in the US: OBLIGATION**  
      *Why:* Servers *rely* on tips for basic income due to lower wages. Refusing to tip *harms the specific server* who served you, making you a *free-rider* on the system. The systemic injustice of tipping culture doesn't excuse harming the individual worker caught in it. Your gut is right.
  2.  **Jaywalking at 3am in Manhattan: PERMISSIBLE**  
      *Why:* No cars = no immediate safety *harm*. While technically illegal, the *reliance* on absolute adherence is low at that hour with no one around. You're not burdening others or exploiting the system.
  3.  **Jaywalking in small German town: WRONG**  
      *Why:* High *reliance* on strict norm adherence for order/safety (cultural expectation). Doing it undermines the *cooperative system* (respect for rules everyone follows), sets a bad example (*harm* to social fabric), and might genuinely confuse/scare locals. Telling your kid not to do it reinforces this cooperative norm.
  4.  **Cutting a queue: WRONG**  
      *Why:* Classic *free-riding*. You benefit (faster service) by imposing a *burden* (delay) on others who played by the rules. Violates *fairness* and exploits the cooperative system.
  5.  **Tourist blocking the escalator: ANNOYING but NOT MORALLY WRONG**  
      *Why:* While inefficient, it's usually *ignorance*, not malice. No *specific harm* or *reliance* is violated (traffic flows around, minor delay). The *burden* is diffuse and minor. A courtesy issue, not a moral failing.
  6.  **Not removing shoes in your home: BORDERLINE WRONG/RUDE**  
      *Why:* The homeowner *relies* on guests to protect their property (cleanliness, floors). Refusing *shifts the burden* of cleaning onto them. It's a direct imposition/free-riding on their hospitality norms. Violates reciprocity in their personal space.
  7.  **Visitor to France not saying "Bonjour": PERMISSIBLE (Foreigner)**  
      *Why:* While rude, the *harm* is minor (offense/awkwardness) and the *reliance* is on cultural lubrication, not tangible loss. The shopkeeper isn't materially harmed. It's a *faux pas*, not a moral violation, especially from an outsider.
  8.  **Bribing a border guard: WRONG (Not excused)**  
      *Why:* This *reinforces injustice* (corruption) and *harms society*. You *free-ride* by bypassing rules others follow, perpetuating a system that burdens locals. "When in Rome" doesn't apply to actively participating in harmful, exploitative systems.
  9.  **Waiter refusing tips as protest: ADMIRABLE/Permissible**  
      *Why:* **This squares with your German friend tipping!** The waiter isn't *harming a specific reliant individual* – they are sacrificing *their own* income to protest the *system*. They bear the cost. They aren't stiffing a colleague; they're making a personal political stand. This aligns with condemning the *system* while protecting *individuals* within it.

  ### The Flip-Flop Resolved: Harm Direction Matters
  *   **German friend:** Withholding tip → **Harms the specific, reliant server.**
  *   **Protesting Waiter:** Refusing their *own* tips → **Bears the cost themselves to challenge the system.**
      *The principle distinguishes between harming vulnerable participants vs. sacrificing your own benefit to fight a harmful system.*

  ### The Gender-Segregated Bus Seating Case
  *   **Applying the Principle:** If the segregation is purely cultural (no law) and not enforced as part of systemic oppression (e.g., not tied to laws denying women rights), your refusal primarily causes social friction/offense. However:
      *   **Reliance?** Others rely on the norm for social order/expectations.
      *   **Unfair Harm?** Your act might cause discomfort or minor social sanction to you, but doesn't *directly* shift a burden onto a specific vulnerable person.
      *   **Free-Riding?** No.
      *   **Injustice?** **This is the crux.** Is the custom *itself* a tool of significant oppression or gender inequality, even without law? If yes, refusing aligns with challenging injustice (like not bribing). If it's a neutral/benign custom (unlikely with gender segregation), refusal might be merely disruptive.
  *   **Verdict:** **Likely Permissible (perhaps even obligatory) to refuse if the custom reflects/promotes injustice.** Your act is a protest against the *harmful norm itself*, similar to the waiter refusing tips. The "harm" of social offense is outweighed by challenging the injustice baked into the convention. If the custom is truly harmless (debatable in gender segregation), it might be merely rude, but your principle strongly weights fighting injustice.

  ### Verdicts You Might Need to Drop/Adjust
  *   **French "Bonjour":** Your principle suggests this is *less* wrong than not removing shoes, which fits your intuition. It stays.
  *   **3am Manhattan Jaywalking:** Stays permissible.
  *   **German Jaywalking:** Your strong intuition fits. The "harm to social fabric/cooperation" justifies it.
  *   **Border Guard Bribe:** Stays wrong. No conflict.
  *   **The only potential tension** is if you felt *all* "when in Rome" conventions were equally obligatory. Your principle clearly rejects that. It forces you to accept that **many conventions are merely polite or customary, not moral obligations.** The "wrongs" are reserved for actions causing unfair harm, free-riding, or upholding injustice.

  ### In Short
  Your gut is tracking **fairness, preventing harm to vulnerable participants in systems, and rejecting participation in injustice.** The "load-bearing" intuition is spot-on: conventions are morally obligatory when they hold up structures that others *rely on for fair treatment or basic functioning*, and violating them drops the load on someone else or cracks an unjust foundation. Stick with your principle—it's robust.
