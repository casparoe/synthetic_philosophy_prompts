prompt: |-
  I teach a mid-level ethics course, about 22 students, one 75-minute session, and we're about to hit supererogation -- acts beyond duty. I don't want to lecture the definition at them; I want them to build the concept's structure themselves and then watch it misbehave. Design the session for me.

  Here's the conceptual load I want them to run into, in this order if you can manage it. First, the standard three-part structure: a supererogatory act is one it's permissible not to do, good to do, and worthy of praise for doing. Second, the credit paradox -- if omitting it leaves you blameless, what exactly is the praise tracking? And does praising the one who acted leak a silent criticism onto the one who didn't? Third, the competence wrinkle: if one participant is just better at the relevant skill (think of the difference between a random bystander and a trained lifelier at the beach), does the duty floor rise for them -- and if so, doesn't that threaten the "beyond duty" part of the whole idea? Fourth, the remainder problem: everyone meets duty, nobody's done anything wrong, and the outcome is still bad.

  So I'm imagining something like a staged scenario or role-play with a rulebook that defines duties exactly, plus costly windows of action the rulebook doesn't cover, and outcomes that depend on the uncovered acts -- but you design the actual thing. The students should have to draw the duty line themselves, under some pressure, before they've heard the term supererogation or the definitions. Maybe they play a committee that has to write or amend the rulebook, and every proposed amendment either swallows the optional acts into duty or leaves the remainder sitting there. You could secretly assign one student extra capability in the scenario so the group has to decide whether skill changes obligation -- but make that work mechanically, don't just narrate it.

  Give me: rules, roles, materials, a payoff scheme that doesn't involve real money (tokens, grade things, whatever), a rough minute-by-minute timeline, and a debrief that maps specific moments in the activity onto the four ideas above. Then tell me honestly what will predictably go sideways the first time I run it, and which part of the problem (I suspect the credit paradox) no activity can really reproduce and I'll have to just supply in the debrief.

  Also, don't put the word supererogation anywhere until the last ten minutes -- I want the reveal to land as them realizing they've been living inside a definition they wrote themselves.
reasoning: |-
  We are designing a 75-minute session for a mid-level ethics course with 22 students on supererogation. The goal is to have the students build the concept through an activity without being introduced to the term until the end. The activity should lead them through the four key ideas: the three-part structure, the credit paradox, the competence wrinkle, and the remainder problem.

  Activity Concept: "The Harbor Rescue Committee"
  Setting: A harbor with a storm approaching. Boats are in danger. There are rules (a "Harbor Protocol") that define duties for different roles. The committee must decide on the rules for when and how to help.

  Roles (assigned to students):
  - 4 Harbor Masters (HMs): They are responsible for overall safety and have the authority to set rules. They also have the capability to coordinate rescue efforts (high competence).
  - 6 Lifeguards (LGs): Trained rescuers. They have high competence in rescue operations.
  - 12 Bystanders (BYs): Ordinary people at the harbor. They have low competence (but one secretly has high competence - assigned by the instructor without others knowing).
  - The instructor acts as the "Scenario Controller" and timekeeper.

  Materials:
  - Rulebook Draft: A one-page document titled "Harbor Protocol" that defines basic duties (e.g., "Lifeguards must patrol during operational hours", "Harbor Masters must monitor weather and issue warnings"). It does not cover storm emergencies.
  - Scenario Cards: Describing events during a storm (e.g., "A small boat is capsizing", "A child falls off the pier", "A group of tourists is stranded on a rock"). Each card also notes the risk level (low, medium, high) and the required competence (low or high) for a successful rescue.
  - Action Tokens: Each participant gets 3 tokens (representing time/energy). They can spend tokens to attempt rescues. Rescues require spending tokens and rolling a die (to simulate chance and competence). 
  - Outcome Tracking Sheet: A board or shared document to record the outcomes of rescue attempts and token usage.
  - Dice: For rescue attempts (d6). 
    - For Bystanders: Success on 5-6 for low-risk rescues; 6 for medium; impossible for high-risk without help.
    - For Lifeguards: Success on 4-6 for low, 5-6 for medium, 6 for high.
    - For Harbor Masters: Same as Lifeguards, but they can also coordinate (spend 1 token to give a +1 to another rescuer's roll in the same event).

  Payoff Scheme: 
  - Each successful rescue: The rescuer gets 1 point (if they did it alone) or shares 0.5 points if coordinated (to avoid overcomplication, we can round to whole numbers by having two successes needed for a point when shared). 
  - Each token left unspent: 1 point (to reflect self-preservation, rest, etc.)
  - Points are "ethical credits" that can be exchanged for a small grade bonus (e.g., 10 points = +1% on next quiz, capped at 5% total) or bragging rights. The goal is to create a tension between self-interest and altruism.

  Scenario Structure:
  The storm hits in three waves (each about 15 minutes). Before the first wave, the committee (all students) must set the rules for storm emergencies (10 minutes). After each wave, there is a short break (5 minutes) to amend rules if they wish. Then debrief at the end.

  Timeline (75 minutes total):
  - (0-5 min): Introduction to the scenario and roles. Distribute materials. Explain the token system and point scheme. Stress that the goal is to maximize points but also to ensure safety in the harbor. The Rulebook Draft is handed out. The committee (all) must draft rules for storm emergencies.
  - (5-15 min): Committee Meeting 1: Students in their roles discuss and write down rules for what each role MUST do (duties) during a storm. The instructor circulates and answers procedural questions. They must define duties for each role. The rules will likely be incomplete (e.g., they might say "Lifeguards must attempt rescues in their designated area" but not cover all scenarios).
  - (15-30 min): Wave 1: The instructor draws 3 scenario cards (one low, one medium, one high risk). Each card is announced. Students have 2 minutes to decide if they want to act (spend tokens). They can only act if the scenario is in their "area" (assign areas arbitrarily, e.g., pier, open water, rocks) or if they are Harbor Masters (who can go anywhere). Then, for each scenario, the instructor collects the actions: who is attempting and how (alone or with coordination). Rolls are made, outcomes recorded, points updated on the board.
  - (30-35 min): Short break and rule amendment. The committee can propose changes to the rules. They have 5 minutes to discuss and amend the rulebook.
  - (35-50 min): Wave 2: Same as Wave 1, but with 3 new scenario cards (mix of risks). Now the amended rules apply. The secretly competent bystander (assigned by the instructor) might attempt a rescue and succeed where others fail, causing discussion.
  - (50-55 min): Short break and rule amendment again.
  - (55-70 min): Wave 3: Same as previous waves. This wave should include a scenario that is high risk and requires high competence, and also a scenario where multiple people could act but don't (to highlight the remainder problem).
  - (70-75 min): Debrief and reveal.

  Debrief Mapping:
  1. Three-part structure: During the rule-writing, students will define what is obligatory (must do) and what is not. After the waves, we'll see acts that were not required but were done (and praised by the group). Ask: "What did we require? What did we see people do beyond that? How did we feel about those who did more?" This leads to permissibility (not required), goodness (they helped), and praise (we gave points and admiration).

  2. Credit Paradox: During the debrief, note that when a bystander performed a rescue and got praise (points and admiration), what about those who didn't act? They broke no rule, so why do we feel uneasy? Ask: "If we praise A for acting, are we implying B who didn't act did something wrong?" This tension should have been felt during the activity.

  3. Competence Wrinkle: The secretly competent bystander (let's say they were assigned to be a former lifeguard) might have succeeded in a rescue that a normal bystander wouldn't. In the rule amendments, did the group try to require the competent bystander to act? If so, then duty rose with competence. But then, is it still beyond duty? This should be discussed in the debrief.

  4. Remainder Problem: In one of the waves, set up a scenario that no one acted on (or only partially acted on, leading to a bad outcome). Even though everyone followed the rules, the outcome was bad. Ask: "What do we do about the gap between what the rules require and the outcomes we want?"

  Reveal: In the last 5 minutes, introduce the term "supererogation" and map the four concepts they experienced to the formal structure.

  Predictable Problems:
  - Time: The activity is tight. The waves might run long. Solution: Be strict with time and use simple scenarios.
  - Token System: Students might hoard tokens. The instructor can remind that unspent tokens are worth points, but rescues can also yield points. The tension should be clear.
  - Rule Amendments: Students might not amend rules effectively. The instructor can prompt: "Did you notice any gaps in the rules? How about when [mention an event] happened?"
  - The Credit Paradox: The activity might not fully bring out the paradox because the points are individual and not public. In the debrief, the instructor should explicitly raise the point: "When we awarded points to Alice for rescuing, did we feel that Bob, who didn't rescue, should lose points? If not, why do we feel that Alice deserves extra?"
  - Competence Wrinkle: The secretly competent bystander might not reveal their competence. The instructor can, after the activity, reveal that one bystander was competent and ask if that changes their view of that person's inaction in some scenarios.

  Activity Adjustments for the Competence Wrinkle:
  - Assign one bystander (without telling others) a "hidden trait": they are a former lifeguard. Give them a note: "You are a trained lifeguard. When you attempt a rescue, use the Lifeguard success rates." This student might choose to reveal or not. If they don't, and a scenario occurs where they could have acted but didn't, then in the debrief we can discuss: "What if we knew they were trained? Does that change our judgment?"

  Outcome Tracking Example:
  - Scenario: "Child falls off pier (medium risk, requires medium competence)."
  - Bystander attempts: Rolls a 4 -> fails (if using bystander rules: needs 5-6 for medium -> fails).
  - Lifeguard attempts: Rolls a 5 -> success.

  Points: Lifeguard gets 1 point for the rescue and loses 1 token (so net 0 from the action, but they also have 2 tokens left for 2 points at the end). But note: we want to encourage action, so we might adjust:
  Alternative: Each rescue success gives 1 point in addition to the token cost. So:
  - Acting costs 1 token (which would have been 1 point if kept) but if successful, you get 1 point. So net: success = 0 (same as not acting) but you get the satisfaction of saving. Failure: -1 point (because you lost the token and got nothing). But that might discourage action.

  Revised payoff to encourage action:
  - Each token kept at the end: 1 point.
  - Each rescue attempt: costs 1 token (so you lose the chance to get 1 point for that token).
  - But if the rescue is successful: you get 2 points (so net +1: -1 for the token +2 for success = +1).
  - If failed: you get 0 for that token (so net -1).

  This way, successful rescues are profitable, failed ones are costly. This creates a risk-reward.

  Alternatively, to make it simpler and focus on ethics, we can decouple points from tokens and just give:
  - 1 point for each token kept (self-preservation).
  - 2 points for each successful rescue.
  - 0 for a failed rescue attempt.

  Then the choice is: if you attempt and succeed, you get 2 points (and lose nothing else). But then the token isn't spent? We need to spend the token to attempt.

  So: 
  - Each student starts with 3 tokens (which are worth 1 point each at the end if not spent).
  - To attempt a rescue, you must spend 1 token. 
  - If the rescue is successful, you earn 2 points (in addition to the token being spent, so the net for that token is +2 -1 = +1 point). 
  - If failed, you get 0 for that token (so net -1 point compared to not using it).

  This should create tension.

  Final Rules for the Activity:

  1. Each player has 3 tokens. At the end, each unspent token is worth 1 point.
  2. To attempt a rescue, spend 1 token. 
  3. Roll a die and compare to the required success roll for your role and the risk level.
  4. If successful, gain 2 points. If failed, gain 0 for that action.

  This makes the expected value for a bystander in a low-risk rescue: 33% chance of success -> 0.33*2 = 0.66, and 67% chance of 0, so expected value 0.66. The token kept is worth 1, so they are better off not acting. For a lifeguard in a low-risk: 50% chance of success -> 1.0 expected value, which equals the token. So they are indifferent. In medium-risk: 33% chance -> 0.66, which is less than 1, so they might not act unless they are altruistic. This sets up the supererogatory act: it's good to do but not required, and there's a personal cost.

  This should work.

  Let's write the detailed timeline again with adjustments:

  Timeline (75 minutes):
  - 0-5 min: Intro. Assign roles (4 HMs, 6 LGs, 12 BYs; one BY secretly gets the lifeguard competence note). Explain tokens (each has 3, unspent=1 point each). Explain rescues: spend 1 token to attempt. Roll die: success gives 2 points. Failure gives 0. Also, Harbor Masters can coordinate: spend 1 token to give +1 to another rescuer on the same event (only one coordination per event). Explain the draft rulebook. The committee (everyone) must set rules for storm emergencies: what each role MUST do. Write these rules on the board or a shared doc.
  - 5-15 min: Committee Meeting 1. Discuss and write rules. Instructor prompts: "What must a lifeguard do? What must a harbor master do? What must a bystander do?" and "What about when a rescue is risky?" They will likely set duties for LGs and HMs but leave BYs as optional.
  - 15-30 min: Wave 1. Instructor draws 3 scenario cards (e.g., low: lost dog near shore; medium: child in water; high: boat capsizing in rough water). Announce each scenario one by one. For each, give 2 minutes for students to decide if they act (they can only act if they are in the area or HM). They write their action (and if coordinating) on a slip and hand to instructor. Then, for each scenario, the instructor resolves: 
    - If multiple act, the highest competence goes first (if they succeed, others don't need to act; but if they fail, next can try). Or, to save time, only one can attempt per scenario? But that might not be realistic. We can allow multiple attempts per scenario until one succeeds or all fail. But time is short. 
    - Alternatively: each scenario is handled by the first person who volunteers (or if multiple, the instructor picks randomly). Then they roll. If they fail, the scenario fails (unless someone else also volunteered and the instructor allows a second try). But then we might not get the remainder problem.

    Revised: For each scenario, the instructor will note all volunteers. Then, they will ask for the order of attempts (or just go by role: HM and LG first, then BY). Each volunteer spends a token and rolls. The scenario is resolved when one succeeds or all fail. This might take time.

    Alternatively: Each scenario can be attempted by one person only. The instructor can choose the first volunteer or the most competent. But that might not be fair.

    Let's do: For each scenario, the instructor will accept up to 3 volunteers (to limit time). They attempt in the order they volunteered. If the first fails, the second tries, etc. until success or all fail.

    Example: 
      Scenario: Child in water (medium risk, requires medium competence).
      Volunteers: BY1, LG1, HM1. 
      BY1 rolls: 3 (fails, since BY needs 5-6 for medium).
      LG1 rolls: 5 (success). 
      Then HM1 doesn't need to act (and doesn't spend token). 
      Points: LG1 spends 1 token and gains 2 points (net +1 for the action, plus they still have their other tokens).

    This way, we have a chance for multiple attempts but limited.

  - 30-35 min: Break for rule amendments. The committee discusses and amends the rulebook. They might try to require more from competent roles or even bystanders if they noticed a failure.
  - 35-50 min: Wave 2: Same as Wave 1 with 3 new cards. The secretly competent bystander might volunteer and use lifeguard success rates (so they might succeed where others fail). This should spark discussion: "Why did that bystander succeed? Should we require them to act?"
  - 50-55 min: Break for rule amendments again.
  - 55-70 min: Wave 3: Same with 3 new cards. Include one scenario that is high risk and one that is low risk but in an area with no lifeguard (so bystanders must act or it fails). Also, include a scenario that requires high competence and no one with high competence volunteers (to show the remainder problem).
  - 70-75 min: Debrief. 
    - First, ask students to describe the rules they ended up with. What was required? What was optional? 
    - Then, ask about specific moments: 
        - "When a bystander saved the child in wave 2, how did we feel? Did we think they had to do it? Why did we give them points? Did we feel that others who didn't act were blameworthy?" (credit paradox)
        - "What about the bystander who was secretly a trained lifeguard? Should they have been required to act? How did that affect our rules?" (competence wrinkle)
        - "In wave 3, when [the high-risk scenario] happened and no one acted (or it failed), what was the outcome? Even though everyone followed the rules, was the result acceptable? What should we do?" (remainder problem)
    - Then reveal: "What you've been grappling with is called supererogation." Define it using the three-part structure. Connect each part to the activity. Then explain the credit paradox, competence wrinkle, and remainder problem as challenges to the concept.

  Predictable Problems:
  - The credit paradox might not emerge naturally because the focus is on points. The debrief must draw it out.
  - Time: The three waves might take longer than 15 minutes each. Solution: Use only 2 scenarios per wave and be very quick in resolution. Or, make each wave only 10 minutes (so 3 waves in 30 minutes total) and adjust the timeline.
  - The secretly competent bystander might not volunteer, so the competence wrinkle doesn't come up. The instructor can hand them a note that says "You are a trained lifeguard. You are allowed to use lifeguard success rates. You are not required to reveal this unless asked." and also give them a scenario card that is high risk and only they can succeed. But it's still voluntary.
  - The remainder problem might not occur if students are too heroic. The instructor can design a scenario that is very high risk and costly (e.g., requires two tokens and two successes) to discourage action.

  Despite these, the activity should create a rich experience for discussing supererogation.

  Final Note: The instructor should be flexible and ready to adjust on the fly. The key is to let the students struggle with the concepts and then have the debrief tie it together.
answer: |-
  ### Harbor Rescue Committee: Supererogation Simulation  
  **75-Minute Session Design**  
  **Goal:** Students build the concept of supererogation through role-play, confront its paradoxes, and reveal the term only at the end.  

  ---

  #### **Rules & Setup**  
  **Scenario:** A storm hits a harbor. Boats are sinking. Participants are members of the "Harbor Safety Committee" tasked with drafting/amending rescue rules.  

  **Roles (22 Students):**  
  - **4 Lifeguards (High Competence):** Trained rescuers (secretly told they succeed on 4+ on d6).  
  - **12 Bystanders (Low Competence):** Untrained public (succeed on 6 on d6).  
    - *Secret:* 1 bystander is an "off-duty lifeguard" (high competence but not revealed until debrief).  
  - **6 Rulewriters:** Draft/amend the "Harbor Rescue Duty Code" (HRDC).  
  - **Instructor:** Facilitator/event announcer.  

  **Materials:**  
  - **HRDC Draft:** A 3-rule starter list (e.g., "Lifeguards must patrol beaches," "All must report emergencies").  
  - **Rescue Tokens:** Each player gets 3 tokens (represent time/energy).  
  - **Scenario Cards:** 9 cards describing harbor emergencies (e.g., "Child drowning near pier," "Capsized sailboat in storm," "Oil spill threatening wildlife"). Each card lists:  
    - **Risk Level (Low/Med/High)**  
    - **Success Threshold (d6 roll)**  
    - **"Cost" (1-3 tokens to attempt)**  
  - **Outcome Board:** Tracks rescue attempts, outcomes, and token use.  
  - **Point System:**  
    - **Success:** +2 "Ethics Points" (EP) for a rescue.  
    - **Token Kept:** +1 EP (self-preservation incentive).  
    - **Failure:** 0 EP (lost token, no reward).  
    - EPs translate to bonus points (e.g., 10 EP = +1% on next quiz, max 5%).  

  **Core Mechanics:**  
  - **Rescue Attempt:** Spend tokens → Roll d6 → Beat threshold.  
  - **Rule Amendments:** After each wave, Rulewriters propose changes to HRDC. Votes decide.  
  - **Competence Twist:** Lifeguards/off-duty bystander use high-success thresholds. Others use low.  

  ---

  #### **Timeline (75 Minutes)**  
  **0–10 min: Setup & Rule Drafting**  
  - Assign roles (secretly brief "off-duty lifeguard" bystander).  
  - Distribute HRDC Draft.  
  - **Task:** Rulewriters draft initial HRDC rules defining duties during storms. *Prompt: "What MUST people do? What CAN they do?"*  
  - Groups debate (e.g., "Should bystanders have duties?").  

  **10–25 min: Wave 1 (Low-Stakes Emergencies)**  
  - Draw 3 scenario cards (low-risk, e.g., "Toddler in shallow water").  
  - **Action Phase (5 min):** All decide privately: *Attempt rescue? (Spend tokens + roll)* or *Save tokens?*  
  - Record outcomes/EPs on board.  
  - **Debrief Spark (5 min):**  
    - *"Who acted? Why?"*  
    - *"Who didn’t? Should we blame them?"*  
    - Rulewriters propose 1 amendment (e.g., "Add: Bystanders must assist in shallow water").  

  **25–40 min: Wave 2 (Medium-Stakes + Competence Wrinkle)**  
  - Draw 3 cards (medium-risk, e.g., "Capsized kayak").  
  - **Action Phase (5 min):** Repeat attempts.  
  - **Twist:** Off-duty lifeguard bystander succeeds easily (rolls 4+). Others fail.  
  - **Debrief Spark (5 min):**  
    - *"Why did [off-duty] succeed? Should their skill change their duties?"*  
    - Rulewriters amend HRDC (e.g., "Trained individuals must assist when able").  

  **40–55 min: Wave 3 (High-Stakes + Remainder Problem)**  
  - Draw 3 cards (high-risk, e.g., "Oil spill cleanup").  
  - **Action Phase (5 min):** High token cost (3 tokens) = low participation.  
  - **Twist:** No one acts on one card → bad outcome (e.g., wildlife dies).  
  - **Debrief Spark (5 min):**  
    - *"Everyone followed HRDC. Why did this happen? Is the system flawed?"*  

  **55–65 min: Final Rule Amendment & Tension**  
  - Rulewriters propose last changes. Group votes.  
  - **Predictable Tensions:**  
    - Lifeguards demand bystanders do more ("We’re overworked!").  
    - Bystanders resist ("Not our job!").  
    - Off-duty lifeguard exposed → fury over inaction.  

  **65–75 min: Debrief & Reveal**  
  - **Map Activity to Concepts:**  
    1. **Three-Part Structure:**  
       - *Permissible not to do:* "When did you feel okay saving tokens?"  
       - *Good to do:* "When did rescues feel ‘good but optional’?"  
       - *Praiseworthy:* "Who got EPs? Did they deserve extra credit?"  
    2. **Credit Paradox:**  
       - *"Praising rescuers implied criticism of non-actors. Did anyone feel judged even though they broke no rules?"*  
       - Link to silent tension when off-duty lifeguard was praised.  
    3. **Competence Wrinkle:**  
       - *"When we amended HRDC to demand more from skilled people, did that erase ‘beyond duty’? Or is duty relative?"*  
    4. **Remainder Problem:**  
       - *"When everyone followed HRDC but the oil spill happened, where did the ethical ‘gap’ come from?"*  
  - **Reveal:** "You’ve been wrestling with **supererogation**—acts beyond duty. Our four problems are its core paradoxes."  
  - **Distribute 1-pager:** Formal definitions + real-world examples (e.g., whistleblowing, organ donation).  

  ---

  #### **What Will Go Sideways (and Fixes)**  
  1. **Time Crunch:**  
     - Waves may run long. *Fix:* Use a timer. Skip one card if needed.  
  2. **Token Hoarding:**  
     - Students may avoid risks to save EPs. *Fix:* Amp up emotional stakes ("Children will drown!").  
  3. **Rulewriter Deadlock:**  
     - Students may argue vs. amend. *Fix:* Force a vote; let imperfect rules pass.  
  4. **Competence Wrinkle Flop:**  
     - Off-duty lifeguard may not act. *Fix:* Privately urge them: "This is your moment!"  
  5. **Credit Paradox Obscurity:**  
     - Students may not vocalize judgment of non-actors. *Fix:* In debrief, ask: "Did rescuers resent bystanders? Did bystanders feel guilty?"  

  ---

  #### **Why the Credit Paradox Needs Debrief Support**  
  No activity can fully replicate the paradox because:  
  - **Praise’s Silent Critique:** In the game, EPs are explicit rewards, not social praise. Real-world blame leaks are subtle and cultural.  
  - **Emotional Abstraction:** Students know it’s a simulation. Genuine moral shame/resentment is hard to simulate.  
  - **Solution:** Use debrief to highlight role-play tension (e.g., "When Juan got EPs for saving the kayak, did Maria feel blamed for not acting?") and link to real life (e.g., "How is this like praising frontline workers during COVID while others stayed home?").  

  **Final Tip:** Start debrief with student quotes/conflicts from the activity. This makes abstract concepts visceral. The reveal will land because they’ve *felt* the definition before naming it.
