prompt: |-
  Quick note first: I considered the Chinese Room with a teaching-type prompt, but overdetermination in history with a procedure-type prompt seemed the best fit for your in-the-weeds-but-not-obscure constraint, so I went with that. The seeding (thesis committee, INUS conditions, preventer causes) is well within a mid-size LLM's knowledge, but the specific deliverable and the two worked cases are novel enough that it can't be answered from stock text.

  I'm a philosophy professor (phil of science mostly, causation stuff on the side) and for the last few years I've been the token philosopher on the committee that grades our interdisciplinary senior theses, about half of which come from history students. Every spring the same fight happens. A student writes that the Cuban Missile Crisis "was caused by" the discovery of the missile sites, then spends the next paragraph listing five other things without which there'd have been no crisis at all, and the historians on the committee split over whether this is a coherent causal claim, a mushy one, or no causal claim whatsoever. One faction insists the event was overdetermined so no single-cause talk is even intelligible; another faction happily talks about "contributory factors" as if that meant something precise; and I sit there half-remembering Mackie's INUS conditions and Lewis's counterfactuals and failing to say anything usable in the three minutes I get before the next thesis comes up. I want a procedure the committee can actually run on a thesis chapter in about fifteen minutes, written for people with zero patience for philosophy: the questions to ask in order, what counts as a sufficient answer to each, where the procedure should stop and just say "this is not a causal claim, whatever else it is," and where it has to hand the decision back to us because the question is one of judgment, not analysis. We do about forty theses a year, the verdict has to come out as a letter grade plus a paragraph, and at least two committee members will roll their eyes at any vocabulary I can't explain in one sentence, so if INUS conditions make it in, they need a plain-English gloss or they're out.

  Two things I specifically want the procedure to handle, because they come up every year and we handle them by vibes. First, genuine overdetermination cases, where you have two candidate causes each individually sufficient and neither preempts the other -- my pet example is a student thesis arguing the July Crisis would have produced a general European war even if the Sarajevo assassination had failed, since the alliance machinery and the war plans were all sitting there loaded. Does that mean the assassination wasn't a cause of WWI, or that it was one cause among several, or that "cause" is the wrong word entirely? Second, diffuse long-run causation, like "the printing press caused the Reformation," where there's no clean counterfactual because the causal story runs through thousands of small decisions that would presumably have gone differently in some other way eventually. I have a suspicion the right treatment of the second case is completely different from the first, but I'd want the procedure to show why rather than just assert it. Also, and this is the part I'm least proud of, I want it to be honest about where it will misfire -- I know prevention cases (causes that are absences, relief that prevented a famine from getting worse) are where counterfactual-style tests traditionally choke, and I'd rather the procedure flag those as its blind spot than pretend.

  Then run it on three cases so I can see it work: the Franz Ferdinand thesis above, the printing press thesis, and one more -- a student who argued last year that the Allied strategic bombing campaign caused the German surrender, which half the committee loved for its rigor and half of us thought was historically wrong but couldn't say why in causal terms. Show me where the procedure lands on each, and if it gives an answer I won't like on any of them, so be it; I'd rather have a procedure that embarrasses me occasionally than another afternoon of vibes. Don't bother with reading lists or citations for me -- I want the machinery, not the bibliography.
reasoning: |-
  Okay, let me start by really understanding what this philosophy professor needs. They're on a committee grading history senior theses and facing recurring debates about causal claims. The core problem is how to evaluate statements like "X caused Y" when students list multiple factors. The committee is divided, with historians arguing over overdetermination, contributory factors, and whether single-cause claims make sense.

  The professor wants a practical, step-by-step procedure that can be applied in about 15 minutes per thesis chapter. It must be accessible to non-philosophers—no jargon without plain English explanations. Key requirements include handling two specific cases: genuine overdetermination (like the Sarajevo assassination in WWI) and diffuse causation (like the printing press causing the Reformation). Also, the procedure should flag prevention cases as its blind spot.

  Looking deeper, the professor is frustrated with the vagueness of current discussions ("vibes") and wants a structured method that clarifies when a causal claim is coherent or not. They need transparency about where the method might fail, especially with absences or preventers. The output needs to be actionable—leading to a grade and a brief feedback paragraph without requiring philosophical background.

  Now, considering causal theories. INUS conditions (Insufficient but Necessary part of an Unnecessary but Sufficient condition) could be useful here. Mackie's idea is that a cause is part of a complex set of conditions that together are sufficient. But explaining INUS in simple terms is crucial—maybe as "baking soda in a cake recipe." Counterfactuals (Lewis) are another angle: would Y have happened without X? But these struggle with overdetermination and prevention.

  The procedure must differentiate between overdetermination (two sufficient causes) and diffuse causation (many small factors). For overdetermination, the key question is whether removing one cause still leads to the event. For diffuse causation, the counterfactual is messy, so the focus should shift to mechanisms—how the cause led to the effect step by step.

  The three test cases: Franz Ferdinand thesis (overdetermination), printing press thesis (diffuse), and strategic bombing thesis (prevention?). Each will stress different parts of the procedure. For example, the bombing campaign might involve preventers (e.g., if it accelerated surrender but other factors were sufficient), which the procedure should flag as tricky.

  Structure-wise, the procedure should have clear steps: first, identify the cause/effect; second, check for minimal necessity; third, assess if it's part of a sufficient set (INUS); fourth, handle overdetermination; fifth, tackle diffuse causes via mechanisms. Each step needs simple yes/no questions and exit points where a claim is deemed non-causal.

  For prevention cases, step 5 should explicitly say the method isn't reliable and hand it back to human judgment. This honesty is important to the professor.

  Applying to test cases: The Franz Ferdinand thesis should pass as causal under INUS (part of a sufficient set) despite overdetermination. The printing press thesis might fail necessity but show a mechanism, so it's "causal-ish" but needs rephrasing. The bombing thesis could hit the prevention flag if it's about shortening the war, prompting committee judgment.

  Potential pitfalls: Philosophers might critique simplifying INUS or counterfactuals, but the goal is practicality, not theoretical perfection. The professor prioritizes usability over philosophical rigor, as long as it's better than "vibes."

  Finally, the procedure must fit into a paragraph for feedback and a grade. Examples show how to translate findings into concise notes, highlighting strengths (clear necessity) or weaknesses (diffuse cause without mechanism).
answer: |-
  Here's a causal claim evaluation procedure designed for your committee, incorporating your constraints and test cases. It's a 5-step flowchart with clear exit points, plain-English language, and explicit limitations. **Core Principle:** A coherent causal claim must demonstrate *how* the cause made a difference to the outcome's occurrence or nature.

  **The 15-Minute Causal Claim Procedure:**

  1.  **Identify & Isolate:** *"What specific event/state (Cause C) does the student claim caused what specific event/state (Effect E)?"* **Must be answered clearly in the text.** If vague (e.g., "complex factors caused..."), **Exit: Not a specific causal claim.** If clear (e.g., "Discovery of missiles caused the Crisis"), proceed.

  2.  **Minimal Necessity Test (Counterfactual Lite):** *"Does the student provide a plausible reason why E might NOT have happened (or happened significantly differently) if C had been absent/different, *holding other major factors mentioned roughly constant*?"*
      *   **Yes (or strongly implied):** Proceed to Step 3.
      *   **No (or implausible):** Proceed to Step 4 (Overdetermination Check).
      *   **"Holding other factors constant" means:** Did other key conditions mentioned (like political tensions, prior decisions) likely still exist without C? We're not building a perfect world, just tweaking C.

  3.  **"Part of the Story" Test (INUS Gloss):** *"Does the student show C was a necessary piece of a specific, sufficient chain of events leading to E? (Think 'baking soda' in a cake recipe – missing it ruins the cake, but you need flour and eggs too. The student needs to sketch the recipe)."*
      *   **Yes (describes mechanism/link):** **Verdict: Coherent Causal Claim (Necessary Component).** Grade based on evidence/rigor for the link.
      *   **No (C is just listed, no link):** **Exit: Weak/Mushy Causal Claim.** Appears contributory but lacks mechanism.
      *   ***INUS Gloss Explanation (if asked):*** "It means Cause C was an essential ingredient in a specific combination of conditions that was powerful enough to bring about the Effect E. Without that ingredient, that specific recipe fails, even if other recipes could have made a similar cake."

  4.  **Overdetermination Check:** *"Does the student describe a scenario where two or more factors (including C) were each independently sufficient to cause E (or something very similar), and none clearly 'preempted' the others?"*
      *   **Yes (e.g., "War plans AND assassination were each sufficient"):** **Verdict: Coherent Causal Claim (Sufficient Cause - Overdetermined).** C *was* a cause (one sufficient path), but not *necessary*. Grade based on evidence for C's sufficiency.
      *   **No:** **Exit: Incoherent Causal Claim.** Fails both necessity and sufficiency without explanation. Likely just listing background conditions.

  5.  **Diffuse Cause / Mechanism Test:** *(Triggered if Step 2 "No" and Step 4 "No", or if cause is inherently broad/long-term like "printing press")* *"Does the student describe a plausible step-by-step process (mechanism) showing *how* C led to E through a series of connecting events or changes, even if many small decisions were involved?"*
      *   **Yes (traces significant influence):** **Verdict: Coherent Causal Claim (Diffuse Influence - Mechanism Shown).** Grade based on plausibility/detail of mechanism. *Note: "Caused" might be better phrased as "was crucial for" or "enabled," but the claim holds.*
      *   **No (just asserts link):** **Exit: Overly Ambitious/Vague Causal Claim.** More background condition than specific cause. Needs rephrasing (e.g., "necessary precondition," "major enabling factor").

  **Blind Spot Flag ("The Prevention Problem"):**
  *   **If the causal claim primarily involves *preventing* an outcome or relies heavily on an *absence* (e.g., "Lack of rain relief prevented famine from worsening," "The bombing *prevented* a longer war"), WARN:** "**Caution: This procedure struggles with prevention/absence claims. Counterfactuals and INUS are problematic here. Committee judgment on 'difference-making' is essential.**"

  ---

  **Test Case Applications:**

  1.  **Franz Ferdinand Thesis:** "The Sarajevo assassination caused WWI."
      *   Step 1: Clear. C=Assassination, E=WWI.
      *   Step 2: **No.** Student argues war would likely have happened anyway soon (alliance tensions, war plans sufficient).
      *   Step 4: **Yes.** Student explicitly argues multiple sufficient causes (assassination & war plans/alliance system). Neither preempted (assassination triggered *this* war, plans ensured escalation).
      *   **Verdict: Coherent Causal Claim (Sufficient Cause - Overdetermined).** The assassination *was* a cause (it triggered *this* war in August 1914 via the specific July Crisis path). It wasn't necessary for *a* war, but it was sufficient for *this* one. Grade based on evidence for its sufficiency/triggering role.

  2.  **Printing Press Thesis:** "The printing press caused the Reformation."
      *   Step 1: Clear. C=Printing Press, E=Reformation.
      *   Step 2: **No/Implausible.** Without printing, widespread dissent and challenges to Church authority likely *would* have emerged differently eventually (e.g., via manuscript networks, preaching orders, political moves). No clean counterfactual.
      *   Step 4: **No.** Not a case of multiple sufficient independent causes (e.g., printing press AND something else each independently causing the Reformation).
      *   Step 5: **Mechanism Test:** *Did the student show the steps?* If yes (e.g., rapid spread of Luther's ideas -> empowered local reformers -> undermined Church authority -> enabled political breaks), then **Verdict: Coherent Causal Claim (Diffuse Influence - Mechanism Shown).** If the student just asserted "it spread ideas," **Exit: Overly Ambitious/Vague Causal Claim.** The procedure *shows why* it's different from overdetermination: It relies on tracing a specific chain of influence through countless small events, not identifying independent sufficient paths.

  3.  **Strategic Bombing Thesis:** "The Allied strategic bombing campaign caused the German surrender in May 1945."
      *   Step 1: Clear. C=Bombing Campaign, E=German Surrender (May '45).
      *   Step 2: **Debatable/No.** *Did it surrender *because* of the bombing, or *despite* it?* Without bombing, was surrender likely significantly later? The Eastern Front collapse, resource depletion, and Allied ground advances were likely sufficient on their own. Bombing accelerated collapse but may not have been necessary for surrender *eventually*.
      *   Step 4: **No.** Not clearly multiple *independent* sufficient causes. Bombing, Eastern Front, Western Front, resource loss were intertwined.
      *   Step 5: **Mechanism Test:** *Did the student show *how* bombing directly forced surrender?* Likely involves claims about destroying industry (hindering war effort), shattering morale, diverting resources (guns/Luftwaffe from front to homeland). If detailed, **Verdict: Coherent Causal Claim (Diffuse Influence - Mechanism Shown)** *but* **trigger Blind Spot Flag.** Why? The claim *implicitly involves prevention*: Bombing *prevented* Germany from fighting on longer or more effectively. The procedure flags this ambiguity. **Committee Judgment Needed:** Does the evidence convincingly show the bombing *made the difference* to the *timing* or *nature* (unconditional surrender) of the collapse vs. just being one accelerant among many? This is where the historical debate lies. The procedure forces the question to be framed precisely: "Did it *make a difference* to the surrender occurring *when and how it did*?" rather than just "Was it a cause?"

  **Key Outputs for Committee:**
  *   **Verdict:** Coherent Causal Claim (Type: Necessary Component / Sufficient Cause-Overdetermined / Diffuse Influence-Mechanism Shown) / Weak/Mushy Claim / Incoherent Claim / Overly Ambitious Claim / Not a Specific Claim.
  *   **Flag:** Blind Spot (Prevention/Absence) - Requires Judgment.
  *   **Feedback Paragraph Hook:** "The causal claim is coherent because it demonstrates [Necessity/Sufficiency/Mechanism]...", OR "The causal claim is problematic because it lacks [Specificity/Necessity or Sufficiency/Mechanism]...", OR "The claim involves prevention/absence; focus your critique on whether the evidence shows the cause made a *difference* to the outcome's timing/nature."

  This procedure forces specificity, distinguishes core problem types, flags its known weakness, and provides a structured way to move beyond vibes in 15 minutes. It won't resolve historical disputes about evidence, but it clarifies *what kind of causal claim* is being made and whether it's logically coherent and supported by the student's argument.
