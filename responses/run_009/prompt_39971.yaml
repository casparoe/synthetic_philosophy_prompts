  First, I need to recall related concepts. Information cascades come to mind, but the user points out differences. In cascades, people follow others' actions based on private signals, which isn't the case here. The initial queue was due to a festival, not private info. Also, cascades are fragile once real info is revealed, but here the herd persists despite public reviews.

  Then there's pluralistic ignorance, where people privately disagree but publicly conform. But here, individuals might actually believe the queue indicates quality, not just conforming. So that doesn't fit perfectly either.

  Self-fulfilling prophecies involve beliefs causing outcomes, like bank runs. The queue's existence makes people join, reinforcing the queue. But usually, prophecies start with a belief, not an accidental event. Here, the festival caused the initial queue, not a belief about quality.

  Reputational cascades involve following others to maintain social standing. But the user mentioned people in the queue citing the length as the reason, which seems more about inferring quality than social pressure.

  The key here is that the initial trigger was random (festival), but people misinterpret the resulting herd as evidence of quality. This sounds like path dependence or cumulative advantage, where early accidents have lasting effects. But those are broader terms.

  The core mechanism is the misinterpretation of social proof. People see the queue as a summary of others' assessments, but those others joined for non-quality reasons. This creates an endogenous signal: the herd's size becomes evidence, detached from actual quality. Public information (reviews) is ignored because the heuristic overrides it.

  I remember the term "information cascade" might still be stretched to fit, but the user wants precision. Maybe "self-sustaining informational herd" or "autocatalytic herd." But is there an established term? 

  After digging deeper, "coordination failure" comes up, but that's different. Perhaps "signaling cascade" or "reified social proof." But none are standard. 

  The restaurant and interview panel examples both involve early random events setting a persistent pattern. The panel's first speaker frames the discussion, and later doubts don't reverse it. Similar to the queue, where early adoption (festival) sets a path, and subsequent actions reinforce it despite evidence. 

  So both examples fit under a phenomenon where an arbitrary start creates a self-reinforcing belief. The term "path dependence" is close, but in social contexts, it's about how initial choices lock in outcomes. Combined with the misinterpretation of social proof, this might be a specific case of path dependence in social learning. 

  I should also consider availability heuristic and salience. The queue is visually salient, making it more influential than online reviews. But that's a cognitive bias, not the core mechanism. 

  The robustness comes from the herd's size being taken as evidence, which grows stronger as more people join. This is endogenous: the herd creates its own justification. So perhaps "endogenous credibility cascade" or "self-validating herd." 

  After reviewing, no exact term exists. The closest is Bikhchandani, Hirshleifer, and Welch's information cascade, but as the user noted, it doesn't fit perfectly. Coining a term like "autocatalytic social proof" or "reified herd effect" might be necessary. 

  Boundary cases: If the festival crowd had actual food critics, that's a real signal. Or if reviews were hidden, it's a standard cascade. But here, info is public but ignored. 

  So the phenomenon is distinct: an arbitrary start creates a herd that is misinterpreted as informed, persisting despite contrary evidence. The restaurant and panel examples are similar in this mechanism. Hence, proposing a new term like "reified informational cascade" with clear definitions and boundaries.
answer: |-
  This is a fascinating case that exposes subtle fractures in standard cascade models. After methodically mapping the conceptual terrain, I conclude this phenomenon **lacks a single established name** but constitutes a distinct configuration at the intersection of several mechanisms. I'll carve the terrain precisely before proposing a term.

  **Brainstormed Concepts & Analysis:**
  1.  **Information Cascade (Bikhchandani, Hirshleifer, Welch):**
      *   *Core:* Individuals ignore private signals to follow predecessors' actions, inferring those actions reveal superior private information. Fragile if true information becomes public.
      *   *Misfit:* Your case lacks genuine private signals *initiating* the cascade. The festival queue was noise (exogenous shock), not information about quality. Crucially, the cascade *persists robustly* despite clear public information (reviews) that should shatter it. The herd isn't inferring hidden quality signals; it's misinterpreting the herd *itself* as the signal.

  2.  **Pluralistic Ignorance (Allport, Prentice & Miller):**
      *   *Core:* Individuals publicly conform to a perceived group norm while privately rejecting it, believing others genuinely endorse it.
      *   *Misfit:* While conformity is present, the key driver isn't necessarily private rejection masked by public compliance. The queuers seem to genuinely *believe* the queue signals quality ("it must mean something") due to an inference error, not just social pressure to conform. The reviews are ignored, not privately held as true.

  3.  **Self-Fulfilling Prophecy (Merton):**
      *   *Core:* A false belief triggers behavior that makes the false belief come true (e.g., bank run).
      *   *Partial Fit:* The queue *does* become self-fulfilling: belief it signals quality causes joining, which lengthens it, reinforcing the belief. However, SFP typically starts with a *belief*, not an arbitrary event (festival). The "prophecy" (queue=quality) emerges *from* the noise, not precedes it. Robustness against public counter-evidence is also atypical for pure SFP.

  4.  **Reputational Cascade (Kuran):**
      *   *Core:* Individuals express preferences aligning with perceived group norms to avoid social sanctions or gain approval, regardless of private beliefs.
      *   *Misfit:* While reputational concerns might play a *minor* role (fear of looking foolish for *not* joining the popular spot?), the primary driver described is epistemic: people infer quality *from the queue itself*. The friend's report focuses on the inference ("must mean something"), not fear of judgment.

  5.  **Salience/Availability Heuristic (Kahneman & Tversky):**
      *   *Core:* Overweighting information that is vivid, recent, or easily recalled.
      *   *Partial Fit:* The physical queue is highly salient and available (you see it!), while reviews require a deliberate action (phone tap). This explains *why* the queue trumps reviews cognitively but doesn't fully capture the *inferential error* where the queue is mistaken for a summary statistic of quality.

  6.  **Network Effects/Path Dependence (Arthur, David):**
      *   *Core:* Early, often random, advantages can "lock-in" a dominant position due to increasing returns (e.g., QWERTY keyboard).
      *   *Partial Fit:* The festival was the random event granting an initial advantage. The "lock-in" occurs via social learning dynamics. However, path dependence is a broader, often structural, concept; this case highlights the specific *cognitive mechanism* (misinterpreted social proof) enabling the lock-in against countervailing evidence.

  **The Core Mechanism & Its Distinctiveness:**
  The phenomenon hinges on a **fundamental inferential error in social learning**:
  1.  **Arbitrary Genesis:** The herd originates not from aggregated private information (like a cascade), but from an exogenous, non-informative event (festival crowd).
  2.  **Reflexive Social Proof:** Individuals observe the herd behavior and misinterpret its *size* or *existence* as direct, aggregated evidence of underlying quality ("it must mean something"), even though the herd formed for non-quality reasons. The herd *becomes* the signal.
  3.  **Endogenous Credibility:** As the herd grows, the inferred signal (size = quality) strengthens *endogenously*. More joiners make the queue seem like an ever-stronger indicator, creating a positive feedback loop detached from objective evidence.
  4.  **Evidence Resistance:** Public counter-evidence (reviews) is discounted or ignored because:
      *   The salient, vivid herd is a more compelling "signal" cognitively (availability/salience).
      *   Individuals reason that *so many* people can't be wrong, implicitly assuming predecessors had valid reasons (a false premise in this genesis).
      *   This creates a form of "epistemic closure" where the herd's behavior overrides external information.

  **Relationship to Examples:**
  *   **Restaurant:** Archetypal example. Genesis: festival (noise). Reflexive Proof: queue length = "must mean quality". Endogenous Credibility: longer queue = stronger signal. Resistance: ignores reviews.
  *   **Interview Panel:** **Same phenomenon.** Genesis: first speaker's framing (potentially arbitrary/early). Reflexive Proof: subsequent panelists interpret lack of immediate strong challenge as consensus/soundness. Endogenous Credibility: more panelists nodding/not objecting reinforces the frame's validity. Resistance: later doubts seem minor against the perceived weight of emerging consensus.
  *   **Bestseller List:** **Same phenomenon.** Genesis: initial surge (could be marketing, timing, noise). Reflexive Proof: "Bestseller" status = perceived quality/importance. Endogenous Credibility: higher sales = higher rank = stronger signal of worth. Resistance: negative critical reviews discounted against the "wisdom of the crowd" signal.

  **Coined Term & Definition:**

  **Reflexive Credibility Cascade (RCC)**

  **Definition:** A self-reinforcing social herd phenomenon where:
  1.  An initial behavioral pattern arises primarily from non-informative, exogenous factors (e.g., random timing, salient event, coordination focal point).
  2.  Subsequent observers systematically misinterpret the *existence* or *size* of the emerging herd as direct, aggregated evidence of an underlying positive attribute (e.g., quality, correctness, value), despite the absence of this attribute in the herd's genesis.
  3.  This misinterpretation fuels further adoption, endogenously strengthening the perceived credibility signal provided by the herd's size itself, creating a positive feedback loop.
  4.  The herd exhibits significant robustness against readily available public counter-evidence concerning the underlying attribute, due to the cognitive salience and self-reinforcing nature of the herd-as-signal.

  **Boundary Cases & Shading:**
  *   **Information Cascade:** Shades into RCC if private signals initiating the cascade are weak or ambiguous, and later joiners rely heavily on herd size. The key distinction is the *genesis* (RCC starts with noise/lack of signal) and *robustness* (RCC persists despite clear public evidence).
  *   **Pure Conformity:** If people join *only* to fit in/avoid sanction with *no* belief that the herd signals quality, it's conformity. RCC involves a genuine (though mistaken) epistemic inference.
  *   **Self-Fulfilling Prophecy:** An RCC often *is* a type of SFP, but specifically one where the "false belief" (herd=quality) is *generated by* the arbitrary event and the reflexive inference, not pre-existing. The shading is broad; RCC specifies the epistemic mechanism.
  *   **Network Effects/Path Dependence:** RCC is a specific cognitive *micro-foundation* explaining social lock-in and path dependence in contexts of evaluative uncertainty. The boundary is scale/micro vs. macro.
  *   **Signaling:** If the initial festival crowd *did* contain food critics (private signal), it shades back towards an information cascade. RCC requires the genesis herd *lacks* informative members regarding the attribute in question.

  **Conclusion:**
  Your observation captures a distinct social epistemic phenomenon – the **Reflexive Credibility Cascade (RCC)**. It arises from noise, gains strength through the misinterpretation of its own existence as evidence, and becomes robust against counter-argument precisely because its scale is mistaken for validation. Your restaurant, interview panel, and bestseller examples are clear instances of the same core mechanism: the transformation of an arbitrary social aggregation into a self-justifying signal of quality through reflexive, erroneous inference. This differs crucially from standard information cascades by its origin in noise and its resistance to public information disclosure.
