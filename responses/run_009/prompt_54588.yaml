prompt: |-
  So I'm a grad student and something about how math actually gets established has been bugging me, and I want the philosophy of it spelled out. Here's the practice: a journal sends a two-hundred-page proof to two referees, they check what they can in a few months, and then the entire community treats the theorem as settled — people cite it, build on it, use it as a lemma in papers that then get rubber-stamped the same way. Everyone knows this is fallible: gaps get found a decade later, the classification of finite simple groups sat for years with no single human having verified all of it, parts of the community just decided to act as if it was done. So the everyday institution quietly treats mathematical knowledge as something like a credit rating — confidence accumulated through chains of partial checking — even though the official story is that a theorem is known by deduction, full stop, and it makes no sense to be 90% sure of a necessary truth.

  What does the institution actually presuppose? I want someone to reconstruct the implicit epistemology here: does treating a published theorem as a usable premise require some notion of logical uncertainty — genuine credences about mathematical claims — or can a strict deductivist rescue the practice as just economical shorthand? And here's the part that looks inconsistent to me: the same community was queasy about the four-color proof and the Kepler conjecture precisely because a machine checked the cases and no human had, but is now pretty relaxed about Lean-verified proofs that also no human has gone through line by line. Do those two reactions presuppose different things about what "understanding" a proof consists in, or is there a principled line there? Finally, if the probabilistic picture is what the practice really runs on, tell me what would actually have to change — would we owe each theorem a confidence level, and is there a threshold below which we should stop calling things theorems and start calling them well-supported conjectures?

  Also, and I know this is a seperate question, feel free to say if the whole framing is off because peer review isn't doing epistemic work at all — that its just a quality filter and the real guarantee of mathematical knowledge is something else entirely, like the fact that errors get found when consequences are used downstream. I'd want to know if that's a better story.
reasoning: |-
  Okay, this grad student is grappling with a deep philosophical issue in mathematics. They're questioning how the mathematical community establishes truth when full verification is practically impossible. The core tension is between the idealized notion of deductive certainty and the messy reality of partial checks, distributed labor, and fallible processes.

  Hmm, they've laid out several concrete examples that highlight this tension: the classification of finite simple groups (CFSG) where no single person verified everything, initial discomfort with computer-assisted proofs like the four-color theorem versus current acceptance of Lean-verified proofs, and the peer review system's limitations. The student wants to know what epistemological framework actually underlies mathematical practice.

  Let me break this down systematically. First, the official story: mathematics is deductive. A proof either works or it doesn't. But in practice, we treat theorems as provisionally true based on partial verification. The student is right to notice this smells like probabilistic reasoning - we have degrees of confidence in mathematical claims, even though they're necessary truths. That's philosophically awkward.

  The computer proof comparison is particularly telling. Why were mathematicians initially skeptical of the four-color proof but now accept Lean proofs? I suspect it's about trust transference. With Lean, we trust the verification chain: the kernel is small enough to audit, so we bootstrap certainty from there. Whereas early computer proofs involved opaque case explosions. But is that distinction principled or just cultural adaptation?

  The student's question about "confidence levels" is provocative. If we're implicitly probabilistic, should we assign credences to theorems? That feels alien to mathematical practice. The CFSG situation suggests we already have something like this - we accept it as "morally proved" despite knowing gaps existed. But we'd never publish a paper saying "Theorem 3.2 (99.7% confidence)".

  Maybe peer review isn't the main epistemic engine after all. The student floats an alternative: errors get caught when results are used. That resonates with Lakatos' view of mathematics as a quasi-empirical process. Proofs aren't endpoints but invitations for scrutiny. The real "verification" happens when other mathematicians rely on the result and find it holds (or doesn't).

  For the deductivist rescue attempt: one could argue partial verification is just a practical shortcut. The "full proof" exists in principle, even if unread. But this feels unsatisfying when no human could possibly comprehend the entire argument, as with CFSG or massive Lean proofs.

  The institutional trust aspect is crucial. We delegate verification across time and people, creating a web of mutual epistemic dependence. This works because mathematicians are incentivized to find errors (fame awaits those who spot mistakes in big results). The system has error-correction built in.

  On whether anything should change: explicit confidence levels seem impractical. But we could be more transparent about verification states - tagging results as "computer-verified", "minimally verified", or "broadly vetted" like CFSG. The label "theorem" should probably remain binary though, as it serves a different social function.

  Ultimately, the practice reveals mathematics as a profoundly human endeavor, despite its aspiration to transcend human frailty. The epistemology is more sociological than logical - truth emerges from critical engagement over time. That might disappoint a Platonist, but it matches how mathematics actually advances.
answer: |-
  Your question cuts to the heart of mathematical epistemology and the sociology of proof. The practice **does** reveal a tension between the idealized deductive model and the messy reality of verification. Here's a reconstruction of the implicit epistemology, addressing your core concerns:

  ### The Implicit Epistemology: Distributed, Fallible Justification
  1.  **Deductive Core with Social Scaffolding:** The foundation *is* deductive logic. The *claim* is that a valid proof exists. However, the *justification for believing that claim* is overwhelmingly **social, empirical, and fallible**. Peer review, citation, and use are mechanisms for *distributed verification* and *error filtering*.
  2.  **Confidence as Accumulated Scrutiny:** The community implicitly treats confidence in a theorem as **Bayesian credence updated by successful scrutiny**. Each act of partial verification (referee checks, use as a lemma, attempts to generalize, teaching) is a test. The theorem passes these tests, increasing its perceived reliability. A gap found later is a failed test, decreasing confidence. The CFSG is the ultimate example: confidence grew *because* key parts were intensely scrutinized and used fruitfully for decades, even while the "global" proof remained distributed.
  3.  **Trust in Expertise and Process:** Peer review presupposes that:
      *   Referees are competent and diligent (imperfectly true).
      *   The *institution* of mathematics, over time, is self-correcting (empirically supported by history). Errors *will* be found when they impede progress or contradict established results ("downstream checking").
      *   The reputation of authors and journals acts as a heuristic for initial trust.
  4.  **The Role of "Understanding":** This is key to the computer proof shift.
      *   **Human-Verifiable Proofs (Ideal):** Understanding implies the ability to *follow the deductive chain* and grasp the conceptual motivations, ideally leading to conviction and potential for generalization/modification.
      *   **Early Computer Exhaustion (4-Color, Kepler):** The discomfort stemmed from:
          *   **Opaque Case Enumeration:** The "proof" was a mountain of unreadable, ungeneralizable cases. Humans couldn't understand *why* it was true, only trust the machine output. This violated the ideal of conceptual understanding.
          *   **Trust in Hardware/Software:** Early verification programs were complex, unverified themselves, and prone to hardware errors. Trust felt like a leap of faith.
      *   **Formal Verification (Lean, Coq, Isabelle):** The growing comfort arises because:
          *   **Trust Transference:** The *verification kernel* (the tiny core that checks proofs) is small enough to be rigorously audited by humans. Trust is placed in this kernel, not the massive proof script.
          *   **Explicit Logic:** The proof is a formal object in a defined logic. While immense, it's fundamentally inspectable (in principle) and machine-checkable *against the kernel*.
          *   **Human Oversight:** Proofs in these systems are *constructed* by humans who understand the high-level strategy. The machine handles the tedious, error-prone details of symbolic manipulation. Understanding resides in the strategy, not the millions of inference steps.
      *   **The Principled(ish) Line:** The community increasingly accepts that "understanding" a large proof can mean **understanding the high-level strategy and trusting a verified kernel to guarantee the correctness of its low-level implementation**. This is seen as *more reliable*, not less, than trusting fallible humans to check immense combinatorial casework or intricate algebraic manipulations line-by-line. The objection shifted from "machine involvement" to "lack of *auditable* verification and conceptual insight". Formal verification provides the former, while human strategy provides the latter.

  ### Can Deductivism Be Rescued? Only Superficially
  A strict deductivist might argue: "The proof *exists*. Peer review is merely an imperfect *discovery mechanism* for confirming its existence. Confidence levels reflect our *epistemic access*, not the theorem's *truth*." While logically coherent, this **fails to capture the practice**:
  *   It ignores that the *social process defines what counts as a proof* worthy of acceptance. A 200-page manuscript in a drawer isn't a "theorem" until vetted.
  *   It trivializes the genuine *epistemic work* done by distributed scrutiny, which builds justified *belief* in the claim that a valid proof exists.
  *   It offers no guidance when faced with results like early CFSG status – was a valid proof "discovered" only once the last gap was filled decades later? The practice treated it as known *before* that point.

  ### The Probabilistic Picture & Its Implications
  The practice **does** implicitly run on probabilistic reasoning about the *claim* that a valid deductive proof exists. This is "logical uncertainty" – uncertainty about the *existence or correctness* of a derivation within a formal system.

  **What would change if made explicit?**
  1.  **Confidence Levels?** Explicit numerical probabilities (e.g., Theorem X: 99.5% confidence) are impractical and undesirable:
      *   How to calculate them objectively? Scrutiny isn't quantifiable.
      *   It undermines the binary nature of proof as a *goal* and a *social signal* ("theorem" means "accepted as proven").
      *   It creates noise and distracts from the actual mathematics.
  2.  **Verification State Tags:** A more realistic and useful shift would be **transparency about verification status**:
      *   **"Formally Verified":** Proof checked by a trusted proof assistant kernel.
      *   **"Minimally Verified":** Standard peer review (1-3 referees).
      *   **"Broadly Vetted":** Extensively used/cited/core result (e.g., CFSG *now*).
      *   **"Proof Sketch/Concept Verified":** High-level strategy accepted, details incomplete (common in some areas pre-formalization).
      *   **"Controversal/Gap Known":** Known significant unresolved issues.
  3.  **Re-labelling Theorems?** Replacing "Theorem" with "Well-Supported Conjecture" below a threshold is **not workable**:
      *   It destroys the functional role of "Theorem" as a reusable building block.
      *   Confidence isn't static. A gap found *after* widespread use doesn't retroactively invalidate all papers citing it as a theorem; it necessitates correction. The label "Theorem" signifies *current acceptance*, not infallibility.
      *   The threshold problem remains intractable. How much scrutiny is "enough"?

  ### Is Peer Review Secondary? The Downstream Checking Thesis
  Your alternative framing **holds significant weight**. Peer review is primarily a **quality filter and plausibility check**, not the ultimate epistemic guarantee. Its core functions are:
  1.  **Filtering Out Garbage:** Catching obvious errors, nonsense, and severe flaws.
  2.  **Improving Clarity:** Ensuring the proof is presented comprehensibly.
  3.  **Initial Plausibility Assessment:** Judging if the approach *could* work.

  **The real epistemic work often happens downstream:**
  *   **Use as a Lemma:** When result A is used to prove B, the author of B implicitly re-verifies A (or finds a flaw). Successful use strengthens A.
  *   **Generalization/Corollary:** Building on a theorem tests its boundaries and reveals hidden assumptions.
  *   **Exposition/Teaching:** Explaining a proof forces deeper understanding, exposing gaps.
  *   **Independent Verification:** Rival groups proving the same result.
  *   **Formalization:** Attempting to formalize a proof in Lean/Coq is an *intense* verification process.

  **Conclusion on Epistemic Work:** Peer review provides an *initial*, often shallow, warrant for belief and filters the literature. The **cumulative, critical engagement of the mathematical community over time** is the primary engine for building justified confidence in the correctness of significant results. Errors are eventually found not primarily because referees missed them, but because they become obstacles to progress. The institution presupposes that mathematics is a **self-correcting, critical enterprise** where truth emerges through persistent scrutiny and application, not infallible deduction captured perfectly at the moment of publication. The move towards formal verification is an attempt to *augment* human fallibility within this critical process, not to replace human understanding, but to make the verification of the deductive chain itself more robust and scalable.
