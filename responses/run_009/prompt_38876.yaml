  I brainstorm cases covering all key dimensions:
  - Tipping in anti-tipping cultures tests convention vs harm principles
  - Empty-store queue-jumping probes harmless violations 
  - US tip refusal on principle examines unjust conventions
  - Table-manner contempt signals respect dynamics
  Each scenario needs 2-3 options representing different philosophical leans without theory names.

  For structure, I outline 8 scenarios:
  1. Tipping where insulting (harm vs convention) 
  2. Queue-jumping when empty (harmless violation)
  3. Jaywalking dead street (harmless illegality)
  4. Anti-tipping protest (unjust convention)
  5. Contemptuous etiquette (respect signaling)
  6. Shoe removal refusal (harmless disrespect)
  7. Cultural dress ignorance (asymmetry locals/visitors)
  8. Hard case: minor disrespect vs harm (deliberate conflict)

  The scoring key maps answer patterns to five positions:
  - Pure Coordination (no moral obligation)
  - Harm Reduction (only effects matter)
  - Fair Play (free-riding wrong)
  - Respectful Engagement (community respect)
  - Mere Etiquette (social only)

  I identify gaps: 
  - Pure Coordination + Respect elements would be incoherent
  - Harm Reduction + Fair Play indistinguishable in some cases
  No famous names - just logical groupings.

  Finally, I add usage notes: explain it's a spectrum tool, not definitive, with scoring instructions. The professor gets a self-contained classroom resource addressing all requested dimensions while avoiding theory jargon.
answer: |-
  Here’s a quiz designed to sort positions on the moral status of local conventions. Each question presents a concrete scenario with answer options reflecting distinct philosophical leanings. The scoring key maps patterns to core views without relying on labels until the end.

  ---

  ### **"Local Conventions: Moral Obligations or Social Habits?" Quiz**  
  *Instructions: For each scenario, pick the answer closest to your view. There are no "right" answers—this sorts your underlying assumptions.*

  1.  **Tipping Taboo:** A tourist visits a country where tipping service workers is seen as insulting (suggesting they’re poorly paid). Out of habit, they leave a tip.  
      **(A)** This is morally wrong—it disrespects local values.  
      **(B)** It’s fine—tipping comes from good intentions.  
      **(C)** It’s neutral—just a clumsy mistake.  

  2.  **Empty Queue:** In a nearly empty convenience store with one cashier, a customer skips the queue ("line") because no one is waiting.  
      **(A)** Wrong—you should follow the rule even when harmless.  
      **(B)** Fine—it affects no one.  
      **(C)** Wrong only if the cashier is offended.  

  3.  **3 AM Jaywalk:** Someone crosses a completely deserted street illegally at 3 AM (no cars, no pedestrians, no police).  
      **(A)** Permissible—no risk, no harm.  
      **(B)** Wrong—it disrespects the law/social order.  
      **(C)** Wrong—if everyone did this, chaos would follow.  

  4.  **Anti-Tipping Protest:** A local in the U.S. refuses to tip servers on principle, arguing tipping culture lets employers underpay workers.  
      **(A)** Obligated to tip—not tipping exploits servers.  
      **(B)** Not obligated—the system is unjust; protesting it is fair.  
      **(C)** Obligated to tip—it’s expected, so refusing disrespects workers.  

  5.  **Etiquette as Weapon:** A visitor uses complex local table manners (e.g., specific utensil rules) correctly but with exaggerated precision, subtly mocking hosts who struggle with it.  
      **(A)** Wrong—it weaponizes convention to humiliate.  
      **(B)** Fine—they’re following the rule; intent doesn’t matter.  
      **(C)** Fine—if hosts feel disrespected, that’s their problem.  

  6.  **Shoe Refusal:** A guest in a home where shoelessness is customary refuses to remove shoes, arguing it’s "just a preference." The floors are easily cleaned.  
      **(A)** Obligated to remove shoes—it’s about respecting the host’s space.  
      **(B)** Not obligated—no harm is done.  
      **(C)** Obligated—it’s unfair to ignore shared customs others follow.  

  7.  **Dress Code Ignorance:** A foreign business visitor wears casual clothes to a formal meeting, unaware of local norms. Locals feel slighted.  
      **(A)** Not wrong—ignorance excuses them.  
      **(B)** Wrong—visitors should research basic customs.  
      **(C)** Wrong only if it harmed business deals.  

  8.  **Hard Case: Minor Disrespect vs. Harm:** A traveler in a conservative region wears modest local attire but subtly modifies it (e.g., rolling sleeves) for comfort, visibly flouting a symbolic dress code. Locals notice and feel disrespected, but no material harm occurs.  
      **(A)** Wrong—deliberately bending rules shows disrespect.  
      **(B)** Permissible—their comfort matters more than symbolic offense.  
      **(C)** Wrong—it risks eroding shared norms.  

  ---

  ### **Scoring Key**  
  Tally how many times you chose each letter. Patterns map to these views based on **source of obligation** (convention, harm, fairness, respect) and **conditions** (harm required? locals vs. visitors? unjust conventions?).

  | **View**                | **Core Principle**                                                                 | **Signature Pattern**                                                                                                |
  |-------------------------|------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------|
  | **1. Pure Coordination** | Conventions create NO moral obligations; only practical coordination tools.        | **Mostly B/C:** Harmless violations always fine (Q2B, Q3A, Q6B). Unjust conventions never binding (Q4B). Disrespect irrelevant (Q5C, Q8B). |
  | **2. Harm Reduction**    | Obligation exists ONLY to prevent harm/offense.                                    | **Mostly B/A (situational):** Harmless acts fine (Q2B, Q3A). Offense creates obligation (Q5A, Q7B/C). Unjust systems may override convention (Q4B). |
  | **3. Fair Play**         | Obligation comes from fairness: don’t free-ride on others’ compliance.             | **Strong A/C in Q3C, Q6C:** Harmless violations wrong if they undermine systems (Q2A, Q3C). Unjust conventions? Mixed (Q4A vs. Q4B). Respect secondary. |
  | **4. Respectful Engagement** | Obligation stems from showing respect for the community hosting you.              | **Strong A in Q1A, Q5A, Q6A, Q8A:** Harmless disrespect wrong (Q3B, Q6A). Visitors have stronger duty to adapt (Q7B). Unjust conventions? Still comply respectfully (Q4C). |
  | **5. Mere Etiquette**    | These are *never* moral obligations—only social lubricant. Politeness is conditional. | **Mostly C/B:** Intent/context rules (Q1C, Q5B/C). No harm? No foul (Q2B, Q3A, Q6B). Unjust? Ignore freely (Q4B). |

  ---

  ### **Analysis & Caveats**  
  - **Incoherent/Unattractive Positions:**  
    - **Pure Coordination + Respect (e.g., Q1A + Q2B + Q6B):** Claims conventions lack moral weight *but* disrespect is wrong. Incoherent—why is disrespect wrong if conventions aren’t morally significant?  
    - **Harm Reduction + Fair Play (e.g., Q3A + Q3C):** Harm Reduction rejects obligations without harm; Fair Play imposes them. Combining these inconsistently suggests unresolved tension.  

  - **Indistinguishable Leaves:**  
    - **Harm Reduction vs. Fair Play in "harmful" cases:** Both condemn queue-jumping in busy stores (not tested here). The quiz separates them via *harmless* violations (Q2, Q3).  
    - **Respectful Engagement vs. Mere Etiquette in polite compliance:** If you always follow conventions politely, your answers won’t distinguish these. The quiz forces separation via *disrespect* (Q5) and *unjust systems* (Q4).  

  - **Unexplored Positions?**  
    - **"Unjust conventions always void obligations" + "Respect matters":** Possible (e.g., Q4B + Q5A). This hybrid isn’t a named leaf but could reflect "respect for persons, not systems."  
    - **"Visitors have weaker obligations" consistently:** Most views treat visitors/locals similarly in strength, not kind. A view granting visitors *less* moral duty (not just practical difficulty) would scatter across questions (e.g., Q7A/B).  

  ### **How to Use**  
  - Have students tally their answers, then share which view(s) fit their pattern.  
  - Emphasize: This sorts *assumptions*, not "correctness." Many hybrid positions exist.  
  - Discuss edge cases (e.g., Q8) where Respectful Engagement and Fair Play clash: Is symbolic disrespect worse than system erosion?  

  This instrument forces distinctions via harmless violations, disrespectful compliance, and unjust systems—isolating whether obligation stems from consequences, fairness, respect, or nowhere moral. By avoiding labels until scoring, it prevents students from "arguing about the menu."
