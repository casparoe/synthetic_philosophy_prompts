  Below is a quiz designed to sort participants by their implicit decision rules for imprecise probabilities. Each question uses concrete scenarios without jargon, focusing on choices that reveal preferences. The quiz includes 9 questions covering Ellsberg-style ambiguity, sure vs. ambiguous bets, interval beliefs, paying for unambiguity, and sequential decisions. The scoring key maps answer patterns to five decision rules: Strict Bayesianism, Γ-maximin, E-admissibility, Interval Dominance, and Minimax Regret. It flags incoherent combinations and notes indistinguishable rules.

