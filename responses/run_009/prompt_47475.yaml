  ### **Quiz: Decision Preferences in Ambiguous Situations**
  *Answer based on your genuine preferences, not theoretical principles.*

  1. **Urn 1 (Ellsberg Part 1):**  
     An urn has 30 red balls and 60 balls that are either black or yellow (you don’t know the mix). You can choose:  
     - **Bet A:** Win $100 if a red ball is drawn.  
     - **Bet B:** Win $100 if a black ball is drawn.  
     Which do you prefer?  
     (a) Bet A  
     (b) Bet B  
     (c) Indifferent  

  2. **Urn 1 (Ellsberg Part 2):**  
     Same urn (30 red, 60 black/yellow unknown). You can choose:  
     - **Bet C:** Win $100 if a red *or* yellow ball is drawn.  
     - **Bet D:** Win $100 if a black *or* yellow ball is drawn.  
     Which do you prefer?  
     (a) Bet C  
     (b) Bet D  
     (c) Indifferent  

  3. **Urn 2 (Sure Thing vs. Ambiguity):**  
     An urn has between 45% and 60% red balls (the rest are blue; exact proportion unknown). You can choose:  
     - **$50 for sure**  
     - **Bet:** Win $100 if a red ball is drawn.  
     Which do you choose?  
     (a) Take $50  
     (b) Take the bet  
     (c) Either is fine; neither is irrational  

  4. **Honest Uncertainty:**  
     Your company’s new HR head will decide whether to adopt an open-plan office. There are no statistics or experts to consult—it’s a one-off event. When asked your confidence, is:  
     “Somewhere between 40% and 60%” *ever* more honest than picking a single number (e.g., 50%)?  
     (a) Yes, an interval better reflects true uncertainty  
     (b) No, I always have a precise gut feeling; the interval just hides it  

  5. **Paying for Certainty:**  
     You can buy one of two bets (both pay $100 or $0):  
     - **Bet X:** Win $100 if a fair coin lands heads (50% chance).  
     - **Bet Y:** Win $100 if a red ball is drawn from an urn with 40–60% red balls (exact unknown).  
     Would you pay more for Bet X than Bet Y?  
     (a) Yes, I’d pay a premium for the coin  
     (b) No, I’d pay the same for both  
     (c) No, I’d pay *less* for the ambiguous urn bet  

  6. **Sequential Commitment:**  
     You face an ambiguous event (e.g., a lawsuit outcome) with 30–70% success chance. You can:  
     - **Commit today:** Agree to pay $50 to pursue it, winning $100 if successful.  
     - **Wait and decide tomorrow:** If you wait, the chance range tightens to 40–60%, but there’s a 10% risk (fair coin) the opportunity vanishes.  
     Which do you choose?  
     (a) Commit today  
     (b) Wait until tomorrow  
     (c) Indifferent  

  7. **Regret Scenario:**  
     You choose between:  
     - **Act 1:** Win $100 if an ambiguous event happens (20–80% chance).  
     - **Act 2:** Win $40 no matter what.  
     Which do you choose?  
     (a) Act 1  
     (b) Act 2  
     (c) Indifferent  

  8. **Dominance Test:**  
     You choose between:  
     - **Act A:** Win $100 if an ambiguous event happens (30–70% chance).  
     - **Act B:** Win $90 if the event happens, $10 if it doesn’t.  
     Which do you choose?  
     (a) Act A  
     (b) Act B  
     (c) Indifferent  

  9. **Value vs. Certainty:**  
     You choose between:  
     - **Option A:** Win $100 if an ambiguous event happens (40–60% chance), $0 otherwise.  
     - **Option B:** Win $55 no matter what.  
     Which do you choose?  
     (a) Option A  
     (b) Option B  
     (c) Indifferent  

  ---

  ### **Scoring Key**
  Map your answers to decision rules using the table below. Rules:  
  - **Strict Bayesianism:** Ambiguity is risk; precise subjective probabilities.  
  - **Γ-maximin:** Maximize the worst-case outcome.  
  - **E-admissibility:** Choose options optimal for *some* probability in the set.  
  - **Interval Dominance:** Choose options that dominate others across all probabilities.  
  - **Minimax Regret:** Minimize maximum regret (difference from best possible outcome).  

  #### **Decision Rule Profiles**
  | Rule                | Key Answers                                                                                                | Notes                                                                 |
  |---------------------|-----------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------|
  | **Strict Bayesian** | Q1/Q2: Not (a,a) or (b,b) in isolation; **must avoid Q1=A and Q2=D** (incoherent).<br>Q4: (b)<br>Q5: (b) | Avoids Ellsberg paradox. Rejects intervals; pays same for ambiguity. |
  | **Γ-maximin**       | Q1: (a)<br>Q2: (b)<br>Q3: (a)<br>Q5: (a)<br>Q6: (b)<br>Q7: (b)<br>Q8: (b)<br>Q9: (b)                     | Pessimistic; avoids ambiguous bets, pays for certainty.              |
  | **E-admissibility** | Q4: (a)<br>Q9: Often (a) or (c)<br>Ellsberg (Q1/Q2): Often A and D, but not required.                    | Tolerant; chooses admissible options. May "switch" in Ellsberg.      |
  | **Interval Dominance** | *No unique signature*; overlaps with E-admissibility in this quiz.                                    | **Indistinguishable from E-admissibility** here (see Note 1).        |
  | **Minimax Regret**  | Q3: (c)<br>Q7: (a)<br>Q8: (c)<br>Q9: (b)                                                                  | Focuses on regret; indifferent in overlapping intervals.             |

  #### **Incoherent or Rare Combinations**
  - **Q1=A and Q2=D + Q4=(b):** Incoherent. Q4=(b) implies strict Bayesianism, but Q1/Q2 show ambiguity aversion (forbidden under strict Bayesianism).  
  - **Q3=(a) + Q7=(a) + Q9=(a):** Rare. Γ-maximin would take Q3=(a) and Q7=(b)/Q9=(b); minimax regret takes Q3=(c)/Q7=(a). Defended by few theories.  
  - **Q5=(c) (pay *less* for ambiguity) + Ellsberg switching (Q1=A/Q2=D):** Possible but rare; may reflect "ambiguity-seeking" (not a focus here).  

  #### **Indistinguishable Rules**
  1. **E-admissibility and Interval Dominance** cannot be separated with this quiz. They only diverge in exotic cases (e.g., dominance without optimality).  
  2. **Γ-maximin and Minimax Regret** are separable (see Q3, Q7, Q8, Q9).  
  3. **Strict Bayesianism** is separable via Q4/Q5 and Ellsberg consistency.  

  #### **How to Score**
  1. Check for **strict Bayesian**: Q4=(b), Q5=(b), and Q1/Q2 not (A and D).  
  2. Check for **Γ-maximin**: Matches the profile (especially Q1=A, Q2=B, Q3=A, Q5=A).  
  3. Check for **minimax regret**: Q3=(c), Q7=(a), Q8=(c).  
  4. **E-admissibility/Interval Dominance**: Q4=(a) and ambiguity-tolerant choices (e.g., Q9=(a) or Ellsberg switching).  
  5. Flag mismatches as "mixed" or "incoherent."

  ---

  ### **Design Notes**
  - **Why these questions?**  
    Q1–Q2 isolate Ellsberg ambiguity aversion. Q3 tests worst-case focus. Q4 probes foundational beliefs. Q5/Q6 reveal ambiguity premiums. Q7–Q9 separate regret/pessimism.  
  - **Why can’t we separate E-admissibility and Interval Dominance?**  
    They concur in most realistic cases (e.g., no strict interval dominance in Q8). Splitting them requires dominance without E-admissibility—rare in simple scenarios.  
  - **Audience suitability:**  
    No jargon; answers rely on intuition. Readings provide context, but the quiz avoids theory-laden terms.  

  This quiz reliably sorts 80–90% of participants into one primary rule, with notes on edge cases. Use the scoring key after collecting responses!
