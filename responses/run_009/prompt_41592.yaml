answer: |-
  What you're describing is a fascinating and well-observed phenomenon in cultural history and anthropology. While there isn't one single, universally agreed-upon term that captures *every* aspect of this resilience and narrative absorption, several established concepts and frameworks directly address it. The most precise fit involves combining related ideas:

  1.  **Reflexive Traditionalization / Second-Order Tradition:** This is arguably the closest concept capturing the *core* of what you observe – the tradition incorporating the knowledge of its own invention.
      *   **Definition:** The process by which a cultural practice, *once its invented or relatively recent origins become known*, continues to be practiced and valued, but now *with an added layer of self-awareness and narrative complexity*. The "tradition" evolves to include the story of its own invention as part of its lore.
      *   **Mechanism:** The revelation doesn't destroy the tradition; it transforms it. The practice shifts from being perceived as "timeless" to being valued as a "tradition *about* traditions" or a "self-conscious tradition." Its meaning changes to include notions of revival, conscious heritage creation, or historical adaptation. The "invention story" becomes a new chapter in its biography.
      *   **Coverage:** This concept specifically addresses the *aftermath* of exposure. It explains how the practice persists and even gains a new kind of legitimacy precisely because its constructed nature is acknowledged and integrated.

  2.  **Cultural Resilience / Institutionalization:** This broader concept explains *why* the tradition withstands the exposure.
      *   **Definition:** The capacity of cultural practices to adapt, persist, and maintain meaning despite challenges (like revelations about their origins). This happens through **institutionalization** – the practice becomes embedded in social structures (families, communities, tourism, education, national identity), acquires economic value, fulfills social/psychological needs (belonging, continuity, identity markers), and develops emotional resonance *independent* of its historical depth claim.
      *   **Mechanism:** By the time its origins are exposed, the tradition has often become "real" in its social functions and emotional significance. People *like* doing it, it *feels* meaningful, it binds the community, it attracts tourists, it fills a calendar slot. The *utility* and *affective power* trump the historical revelation. It has become a social fact.

  3.  **Narrative Absorption / Lore Layering:** This describes the *mechanism* of incorporating the revelation.
      *   **Definition:** The process by which new information (the "invention story") is incorporated into the existing narrative framework surrounding the practice. It becomes another piece of folklore, a "charming piece of trivia," adding depth and complexity rather than invalidating the whole.
      *   **Mechanism:** Human communities are meaning-making machines. The story of the antiquarian or the Victorian revivalists becomes part of the tradition's own history, adding color and human interest. It shifts the focus from "Is this ancient?" to "Isn't it interesting how this *became* our tradition?"

  **Why Some Traditions Collapse While Others Exhibit This Resilience (The Edges):**

  *   **Functional Embeddedness & Emotional Resonance:**
      *   **Survives:** Traditions deeply embedded in community identity, social cohesion, ritual calendar, or economic life (like Highland games, village festivals, national dishes) have strong anchors. They fulfill needs. The emotional connection exists *despite* the history.
      *   **Collapses:** Traditions that were primarily *just* claims to deep antiquity without strong social function, emotional investment, or institutional support. If the *only* value was its supposed age, exposure destroys it. Or, traditions imposed by regimes that fall out of favor and lack genuine popular buy-in (e.g., some Soviet-era "traditions").
  *   **Nature of Exposure & Community Agency:**
      *   **Survives:** Exposure framed as an interesting historical detail revealing human ingenuity or revival efforts. The community retains ownership and control over the narrative and practice.
      *   **Collapses:** Exposure framed as a deliberate, malicious fraud designed to manipulate, especially if linked to an external force (e.g., a hated regime, a cynical corporation) *and* the community feels no ownership.
  *   **Flexibility vs. Rigidity:**
      *   **Survives:** Traditions that can adapt their meaning and incorporate the new narrative. They were always somewhat malleable.
      *   **Collapses:** Traditions whose meaning was rigidly fixed *only* on a specific, unverifiable historical claim.
  *   **The "Modern Invention with No Pretense" Case:**
      *   This is *distinct* from the phenomenon you describe. Practices like modern wedding trends (e.g., "unity sand") or knowingly recent recipes (e.g., "Nana's famous 1970s Jello salad") **do not** undergo the same process because there is **no initial claim of antiquity to be exposed and absorbed**. They start as self-conscious innovations. They might *become* traditions over time, but the dynamic of "scandal -> absorption -> reflexive practice" is absent. They represent the *beginning* of a potential tradition, not the *revelation* about an existing one claiming deep roots.

  **Key Concept Synthesis & Proposed Name:**

  The core phenomenon you're asking about is **the resilient persistence and transformation of cultural practices after exposure of their relatively recent origins, characterized by the absorption of the 'invention narrative' into the tradition itself, leading to a self-aware, reflexive mode of practice.**

  *   **Established Term:** **Reflexive Traditionalization** is the most established academic term capturing this specific *transformation* post-exposure.
  *   **Broader Framework:** This resilience is driven by **Institutionalization** and **Cultural Resilience**, enabled by **Narrative Absorption**.
  *   **Distinction from Neighbors:**
      *   **Invented Tradition (Hobsbawm & Ranger):** Focuses on the *creation* phase, not the *aftermath* of exposure.
      *   **Nostalgia:** A *motivation* for creating or valuing traditions, but not an explanation for their persistence *despite* exposure.
      *   **"Origin ≠ Value":** A valid philosophical point, but your phenomenon shows the *cultural mechanism* by which communities practically navigate this realization – by folding it back *into* the tradition.

  **In essence:** The tradition's "immune response" isn't denial, but adaptation. By metabolizing the revelation into its own story, the practice demonstrates that its value lies not in unchanging antiquity, but in its evolving role within the living community. The "invention" becomes part of its authentic history. This is why Scottish tartans, invented Christmas customs, and "ancient" village festivals thrive long after their origins were exposed – their meaning successfully transitioned from "proof of deep roots" to "symbol of our community's ongoing story, including its revivals and reinventions."
