  First, I need to recall relevant concepts. Hobsbawm's "invented tradition" comes to mind, but that's about the creation part. The user is asking about the aftermath. Anderson's "imagined communities" might relate, but it's more about nationalism. The key here is how traditions survive despite exposure. 

  Then there's "reflexive traditionalization" or "second-order tradition." That's when the awareness of invention becomes part of the tradition itself. Also, "cultural resilience" and "institutionalization" might play roles. The tradition becomes embedded in social structures, making it durable. 

  The user also asks about the boundaries. Why do some traditions collapse while others thrive? Factors like functionality, emotional resonance, and community ownership are important. If a tradition fills a need or becomes part of identity, it's more likely to survive. Cases where people know it's recent but still practice it, like modern wedding customs, might not fit because there's no initial claim of antiquity. 

  I should also consider examples like Scottish tartans or Christmas traditions. Even after their invented origins were exposed, they became stronger. The community incorporates the revelation into the narrative, adding layers. 

  The user might need a clear term and its scope. Since there's no single established term, explaining the mechanisms—functional embeddedness, narrative absorption, institutionalization—would help. They might also want to understand why some traditions fail, which could be due to lack of integration or external pressures. 

