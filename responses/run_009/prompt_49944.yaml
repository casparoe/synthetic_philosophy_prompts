  Exam Question:

  **The Absent-Minded Driver (AMD) Problem**

  Consider the absent-minded driver problem as introduced by Piccione and Rubinstein (1997). The driver must take one of two exits on a highway. The first exit leads home with a payoff of 1. The second exit leads to a dangerous area with a payoff of 0. If the driver misses both exits, he gets home safely but late, with a payoff of 4. The driver is absent-minded: he cannot distinguish between the two intersections and has the same choice (exit or continue) at each. The driver chooses a plan at the beginning: a probability p of exiting at any intersection. The driver's memory is imperfect: at an intersection, he does not remember how many intersections he has already passed.

  The decision tree is as follows:

  - Start at intersection 1 (with probability 1):
    - If exit: payoff 1.
    - If continue: go to intersection 2 (with probability 1).
      - At intersection 2:
        - If exit: payoff 0.
        - If continue: payoff 4.

  But the driver cannot distinguish between the two intersections.

  **Part (a)** [4 points]
  At the planning stage, the driver chooses a plan p (the probability of exiting at any intersection) to maximize his expected payoff. Derive the optimal p and the corresponding expected payoff. Explain why p is a plan and not an action, and why the planning stage is necessary.

  **Part (b)** [6 points]
  Suppose the driver has adopted the optimal plan from part (a). Now, at an intersection, the driver (who is unaware of which intersection he is at) considers deviating from the plan. He conditions on the information that he is at an intersection (but does not know which one). 

  (i) Compute the probability that the driver is at the first intersection, given that he is at an intersection, under the assumption that he has been following the plan p.

  (ii) Using this probability, compute the expected payoff from exiting with certainty at this intersection and from continuing with certainty at this intersection. 

  (iii) Compare these expected payoffs. What do you notice? Explain whether the driver has an incentive to deviate from the plan. Discuss what the action-stage reasoner is entitled to condition on and why this computation does (or does not) constitute a genuine opportunity for deviation.

  **Part (c)** [4 points]
  Consider a driver who at the planning stage chooses the plan p=0 (never exit). 

  (i) What payoff does this plan yield? 

  (ii) Suppose the driver is at an intersection and is considering his action. Compute the conditional probability that he is at the first intersection given that he is at an intersection and given that he has been following the plan p=0. 

  (iii) Now, compute the expected payoff of exiting at this intersection versus continuing. What does this imply about the stability of the plan p=0? Explain which interpretation of the information set makes this plan seem stable.

  **Part (d)** [4 points]
  There are two standard ways to repair the decision problem: 

  (i) Treat the driver at each intersection as a separate player (self) in a game. What is the Nash equilibrium of this game? Does it coincide with the ex ante optimum?

  (ii) Alternatively, treat the driver's current choice as an input to a policy that is evaluated across all possible selves. How does this change the decision problem? Under this approach, is the ex ante optimum self-enforcing?

  **Part (e)** [2 points]
  The AMD problem has structural similarities to commitment problems and Newcomb's problem. Choose one of these and briefly explain the analogy. Then, without relying solely on the analogy, explain a key difference that highlights the unique lesson of the AMD problem.

