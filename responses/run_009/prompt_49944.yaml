  ### Exam Question: The Absent-Minded Driver

  **Context:** In the absent-minded driver problem (Piccione & Rubinstein, 1997), a driver faces two identical intersections. Payoffs are:  
  - Exit at the first intersection: payoff = 1.  
  - Exit at the second intersection: payoff = 4.  
  - Miss both exits: payoff = 0.  

  The driver has imperfect recall: at any intersection, he cannot recall if he is at the first or second intersection. At the *planning stage*, he chooses a probability \(p\) of exiting at *every* intersection to maximize expected payoff. The expected payoff function is \(E(p) = p \cdot 1 + (1-p) \cdot p \cdot 4\).  

  **Questions:**  
  **(a)** Derive the optimal \(p\) and expected payoff at the planning stage. Explain why \(p\) represents a *plan*, not an action, and why planning is necessary given imperfect recall. (4 points)  

  **(b)** Suppose the driver adopts the optimal \(p\) from (a). When at an intersection, he considers deviating to *always exit* or *always continue*.  
  (i) Compute the probability he is at the first intersection, given he is at an intersection and follows plan \(p\).  
  (ii) Compute the expected payoff of *always exiting* and *always continuing* at this intersection.  
  (iii) Interpret your results: Why is there no incentive to deviate? What does the action-stage reasoner condition on, and why does this *not* constitute a genuine deviation opportunity? (6 points)  

  **(c)** Consider a plan \(p = 0\) (never exit).  
  (i) What is the expected payoff?  
  (ii) Compute the probability the driver is at the first intersection (given he is at an intersection and follows \(p = 0\)).  
  (iii) Compute the expected payoff of exiting versus continuing at this intersection. Explain why \(p = 0\) *feels* self-consistent but is not stable. Which flawed interpretation makes it seem stable? (4 points)  

  **(d)** Two repairs for time-inconsistency are:  
  (i) Treating the driver at each intersection as a separate "self" in a game. Find the Nash equilibrium. Does it match the ex ante optimum?  
  (ii) Treating the current choice as input to a *policy* evaluated across all selves. Under this approach, is the ex ante optimum self-enforcing? (4 points)  

  **(e)** The AMD problem resembles Newcomb’s problem or commitment issues. Choose *one* analogy, explain it, then identify a key difference that highlights AMD’s unique lesson (focus on imperfect recall). Do not rely solely on the analogy. (2 points)  

  ---

  ### Model Answer (≈600 words)  

  **(a)** At the planning stage, the driver maximizes \(E(p) = p + 4(1-p)p = 5p - 4p^2\). The first derivative is \(5 - 8p\). Setting to zero: \(5 - 8p = 0\) → \(p = 5/8\). Expected payoff is \(5(5/8) - 4(5/8)^2 = 25/16\). Here, \(p\) is a *plan*: it specifies behavior for all intersections *before* the driver knows his position. It is not an instantaneous *action* because imperfect recall prevents conditioning on the intersection number. Planning is necessary to commit to a strategy that compensates for the inability to observe state.  

  **(b)**  
  (i) Under plan \(p\), the probability of being at the first intersection given the driver is at *some* intersection is \(P(\text{first}) / [P(\text{first}) + P(\text{second})]\). Since \(P(\text{first}) = 1\) (start) and \(P(\text{second}) = 1 - p\) (reach second if continue at first), this is \(1 / [1 + (1 - p)] = 1/(2 - p)\). For \(p = 5/8\), it is \(1/(2 - 5/8) = 8/11\).  
  (ii) - *Always exit*: Payoff = \( (8/11)(1) + (3/11)(4) = 20/11 \).  
  - *Always continue*: If at first (prob \(8/11\)), the driver continues to the second intersection, where he follows \(p = 5/8\). Expected payoff at second: \( (5/8)(4) + (3/8)(0) = 20/8 = 5/2 \). Thus, payoff = \( (8/11)(5/2) + (3/11)(0) = 20/11 \).  
  (iii) Both actions yield \(20/11\), matching the expected payoff of sticking to \(p = 5/8\) (which also gives \( (5/8)(1) + (3/8)(4) = 20/8 = 5/2 \) at the first intersection, but weighted by occurrence: \( (8/11)(5/2) = 20/11 \)). Indifference means no incentive to deviate. The action-stage reasoner conditions on being at *an* intersection (his information set) and the *plan* \(p\), but cannot condition on the intersection number. This is not a genuine deviation opportunity because the plan \(p = 5/8\) is a fixed point: it induces indifference, so no unilateral "deviation" improves payoff.  

  **(c)**  
  (i) For \(p = 0\), \(E(0) = 0 \cdot 1 + (1-0) \cdot 0 \cdot 4 = 0\).  
  (ii) \(P(\text{first} \mid \text{intersection}) = 1 / [1 + (1 - 0)] = 1/2\).  
  (iii) - Exit: \( (1/2)(1) + (1/2)(4) = 5/2 \).  
  - Continue: If at first (prob \(1/2\)), continue to second, where \(p = 0\) implies continue again → payoff 0. If at second, continue → payoff 0. Thus, payoff = \( (1/2)(0) + (1/2)(0) = 0 \). Exiting dominates (5/2 > 0), so \(p = 0\) is unstable. However, it *feels* self-consistent if the driver naively assumes "if I continue, I will get the no-exit payoff (0) regardless of which intersection I’m at." This ignores that at the first intersection, continuing leads to the second, where he *could* exit for 4, but under \(p = 0\) he will not, trapping himself in the worst outcome.  

  **(d)**  
  (i) *Game approach*: Treat each intersection as a "self." Self 1 (first intersection) chooses \(p_1\), Self 2 (second) chooses \(p_2\). Payoff: \(p_1 \cdot 1 + (1 - p_1) \cdot p_2 \cdot 4\). Self 1’s payoff for continuing is \(4p_2\); he continues if \(4p_2 > 1\) → \(p_2 > 1/4\). Self 2, if reached, always prefers exit (4 > 0) → \(p_2 = 1\). Thus, Self 1 continues (\(p_1 = 0\)), Self 2 exits (\(p_2 = 1\)), yielding payoff 4. This *does not* match the ex ante optimum (25/16 = 1.25); the equilibrium (payoff 4) is higher because it exploits perfect recall.  
  (ii) *Policy approach*: The driver chooses a single \(p\) for all intersections, evaluated ex ante. At an intersection, he views his choice as setting \(p\) for all identical selves. The ex ante optimum \(p = 5/8\) *is* self-enforcing: deviating to always exit/continue gives 20/11 ≈ 1.818 < 25/16 = 1.5625? No, 20/11 ≈ 1.818 > 1.5625, but wait: ex ante, the driver evaluates the *plan*’s payoff (25/16), not the action-stage payoff (20/11). Since the policy is judged by ex ante payoff, and deviating lowers it (e.g., always exit gives \(E(p)=1\), worse than 25/16), it is self-enforcing. The indifference at 20/11 is irrelevant here.  

  **(e)** *Newcomb analogy*: Like Newcomb’s problem, AMD involves a decision where conditional probabilities create a conflict (AMD’s \(P(\text{first})\) vs. Newcomb’s predictor). Both suggest "irrational" deviations from the ex ante optimum. *Key difference*: Newcomb’s predictor is external, while AMD’s conditional probability stems from the driver’s *own strategy and imperfect recall*. AMD uniquely shows how *internal information constraints* (not external agents) dissociate planning from action.  

