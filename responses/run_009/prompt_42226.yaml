answer: |-
  Here is a ranked research agenda for a doctoral thesis on moral revolutions, prioritizing philosophical tractability and downstream impact:

  1.  **Ranked #1: How do shifts in the availability and content of core ethical concepts (e.g., personhood, degradation) causally enable or constitute the perception of previously accepted practices as intolerable?**
      *   *(i) Importance:* This is foundational. Understanding conceptual change addresses the *mechanism* of moral perception shift presupposed by theories of moral progress, normative authority, and applied ethics (e.g., debates on AI rights or future practices). It bridges Williams' insights with the phenomenology of moral outrage.
      *   *(ii) Tractability:* High. Philosophical analysis excels at tracing conceptual evolution through key texts, arguments, and counterfactuals (e.g., "Could abolitionists *conceive* of slaves as rights-bearers before certain arguments/events?"). Requires close reading, conceptual mapping, and engagement with history of philosophy.
      *   *(iii) Evidence Movement:* Analysis of ongoing shifts (e.g., animal ethics, neurodiversity acceptance) where conceptual struggles (sentience vs. personhood, pathology vs. difference) are visible in real-time discourse.

  2.  **Ranked #2: Is the "economy of honor" a distinct causal mechanism irreducible to material interest *or* rational persuasion, and how does it interact with conceptual availability?**
      *   *(i) Importance:* Clarifies Appiah's contrast. If honor is irreducible, it challenges rationalist and materialist models of social change dominant in political philosophy/moral psychology, impacting theories of motivation, social norms, and group identity formation.
      *   *(ii) Tractability:* Moderate. Philosophical tools can dissect honor's logic (e.g., analyzing honor's relational nature vs. interest's self-regard), critique reductionist accounts, and model interactions with concepts using historical cases as thought experiments.
      *   *(iii) Evidence Movement:* Examining modern phenomena where status/anxiety drives norm change (e.g., corporate ESG, pronoun usage debates) more visibly than profit or syllogism.

  **Deprioritized:** Cataloging the precise *triggers* of specific revolutions (e.g., "Did pamphlet X or law Y cause abolition?"). While fascinating, answers are often historically contingent and don't generalize well to explain the *underlying capacity* for practices to become intolerable across contexts. It risks antiquarianism over fundamental philosophical insight.

  **Bet on this:** How do shifts in the availability and content of core ethical concepts enable the perception of entrenched practices as intolerable?
