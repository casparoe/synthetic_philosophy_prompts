prompt: |-
  For my seminar on animal ethics I have to produce a piece of satire rather than yet another essay, and I've settled on a target: the way debates about speciesism quietly sort beings into moral categories as if moral status were an administrative matter. Write me a mock bureaucratic document — an intake application form issued by a fictional "Office of Moral Consideration," with numbered sections, eligibility checkboxes, and fine print — that a species must complete to be granted moral status. Around 600 words, but under 700 absolute maximum; leave white space as you see fit, but the form itself should not exceed that limit.

  The comedy has to come from the philosophy being right, not from absurdist decoration. So: the form should process a human infant and a pig in adjacent booths whose paperwork is nearly identical except for the stamp they'll receive, making the argument from marginal cases do the satirical work without anyone naming it. Somewhere there should be a section where "species membership" appears as a required field, followed by an official note insisting that the field is never used in the determination — and a checkbox that uses it anyway. Include an "upgrade to personhood" pathway that requires evidence of self-consciousness or rational agency, so the dog fails on the mirror test while a corvid passes on tool use and the clerk is visibly uncomfortable with the result. Work in at least one contractualist exclusion (a section for beings who cannot enter into agreements or reciprocal arrangements, with a footnote about what they are owed "indirectly"), one sliding scale of the degree of consideration granted (platinum, gold, basic sentience), and a clause where the magnitude of an interest and the possession of an interest are quietly conflated in the fine print. If you can find room, a telos-related line — something about the office needing to know what a "characteristic life" of the applicant looks like — would be welcome, but don't force it.

  Tone: deadpan throughout, the voice of a well-meaning bureaucracy that believes it has solved the controversy, never winking at the reader. The satire should be legible to someone who knows the Singer–Singer-critic literature well enough to recognize the argument from marginal cases, the charge that speciesism is an appeal to species membership per se, and the standard Kantian and contractualist moves, but also readable to someone who has only taken intro ethics. Do not have any character editorialize about how terrible the office is; the office should seem proud of its fairness, and the reader should draw the conclusion alone. No quotations from real philosophers and no citations — the office cites only itself.
reasoning: |-
  Okay, the user wants a satirical bureaucratic form for their animal ethics seminar. They're targeting how speciesism categorizes beings administratively. Let me unpack their requirements.

  First, the core satire needs to make the argument from marginal cases visible through paperwork. That means designing a form where human infants and pigs submit nearly identical applications but get different outcomes. The comedy should come from the philosophy itself, not random absurdity.

  Key elements to include:
  - Species membership field with disclaimer (then used anyway)
  - Personhood upgrade path with mirror test/tool use examples
  - Contractualist exclusion clause
  - Sliding scale of consideration (platinum/gold/basic)
  - Fine print conflating interest magnitude/possession
  - Optional telos question about "characteristic life"

  Tone is crucial: deadpan bureaucratic voice, no winks to the reader. The Office must seem genuinely proud of its system. References should be to internal documents only ("Form 7B", "Regulation 5.3") to maintain the fiction.

  For structure, I'll model it on real application forms:
  - Header with ominous title
  - Eligibility checklist (where speciesism hides in checkboxes)
  - Personhood upgrade section (with cognitive tests)
  - Contractualist waiver (cleverly denying reciprocity)
  - Consideration tier assignment (with fine print traps)
  - Declaration signature (absurd for non-humans)

  The pig/human infant parallel must be clear. Maybe have them both require proxy applicants? And the corvid/dog contrast in personhood testing - clerk's discomfort should show in passive-aggressive notes.

  Biggest challenge: packing all philosophy into 600 words without breaking character. The fine print is where I'll bury the most damning conflations. For telos, a brief "Section 4: Characteristic Life Narrative" should suffice if phrased bureaucratically ("Describe species-typical activities...")

  User clearly knows their ethics - Singer, Kant, contractualism referenced but not named. Satire works best when the reader connects the dots. Must resist adding explicit commentary; the form's own logic should indict it.
answer: |-
  **OFFICE OF MORAL CONSIDERATION (OMC)**  
  **APPLICATION FOR MORAL STATUS DETERMINATION (FORM MS-7B)**  
  *"Ensuring Equitable Ethical Outcomes Since 1987"*

  ### SECTION 1: APPLICANT INFORMATION
  *1.1 Species Designation:* [__________] (*Genus species* or common name acceptable. **Official Note:** This field categorizes solely for administrative filing per Regulation 5.3 and plays no role in the substantive determination process. See OMC Circular 12-A.)
  *1.2 Common Name:* [__________]
  *1.3 Estimated Population:* [__________] (*Helps assess resource allocation for consideration*)
  *1.4 Designated Proxy Applicant (If non-verbal/non-signing):* [Name/Org: __________] (*e.g., Guardian, Species Advocate Group*)

  ### SECTION 2: ELIGIBILITY CHECKLIST (Check all that apply)
  Applicant demonstrates capacity for:
  - [ ] **Sentience:** Capacity to experience sensations (pleasure/pain). (*Mandatory for Basic Consideration*)
  - [ ] **Intentional Action:** Goal-directed behavior.
  - [ ] **Reciprocity Potential:** Ability to comprehend and adhere to mutual agreements or social contracts. (*See Waiver Form 2C if unchecked*)
  - [ ] **Self-Consciousness:** Awareness of self as distinct entity. (*e.g., Mirror Test Pass - Attach certified results*)
  - [ ] **Rational Agency:** Capacity for complex reasoning, future planning, or sophisticated problem-solving. (*e.g., Tool Fabrication/Use - Attach evidence*)
  - [ ] **Species Membership:** (*Check here ONLY if applying under Pre-Approved Category Gamma-1. **Note:** Gamma-1 status requires separate petition demonstrating exceptional administrative need, rarely granted. Review OMC Memo 88-F.*)

  ### SECTION 3: PERSONHOOD UPGRADE PATHWAY (OPTIONAL)
  *Solely for applicants seeking Platinum Tier Status. Requires documented evidence exceeding basic sentience.*
  *3.1 Evidence Type Submitted:*
  - [ ] Mirror Self-Recognition Test (Certified Lab Report Required)
  - [ ] Tool Creation/Use Documentation (Video evidence + Peer Review Summary)
  - [ ] Demonstrated Theory of Mind (Experimental Protocol + Results)
  - [ ] Other (Specify: __________ Attach documentation)
  *3.2 Clerk Assessment Notes:* [__________] (*e.g., "Applicant #A-234 (Corvus corone): Tool use documented w/ hook modification. Protocol valid. Upgrade recommended - per guidelines." / "Applicant #A-235 (Canis familiaris): Mirror test negative. Vocalizations insufficient for ToM. Upgrade denied."*)

  ### SECTION 4: CHARACTERISTIC LIFE NARRATIVE (Optional but Recommended)
  *Describe the applicant's species-typical activities, needs, and flourishing outcomes ("Telos"). How does moral status impact the realization of this characteristic life?*  
  [Attach separate sheet if necessary. Limit: 200 words.]

  ### SECTION 5: CONTRACTUALIST STATUS DETERMINATION
  *5.1 Can the applicant comprehend the concept of a mutual agreement?* [ ] Yes [ ] No
  *5.2 Can the applicant reliably fulfill obligations within a reciprocal arrangement?* [ ] Yes [ ] No
  *If "No" to either 5.1 or 5.2, applicant is deemed a "Non-Signatory Entity" (NSE).*
  **NSE STATUS FOOTNOTE (Reg. 9.1.δ):** *NSEs may still receive "Indirect Moral Consideration" (IMC). IMC weight is derived from the interests of relevant Signatory Entities and applied according to OMC Utility Calculus Protocols. Harm to NSEs factors into net social disutility impacting Signatories.*

  ### SECTION 6: PROVISIONAL MORAL CONSIDERATION TIER ASSIGNMENT
  *(Based on Sections 2, 3 & 5. OMC reserves right to adjust post-audit.)*
  - [ ] **PLATINUM (Full Personhood):** Inviolable rights. Highest priority interests.
  - [ ] **GOLD (Enhanced Consideration):** Significant interests protected; rights contingent on context.
  - [ ] **BASIC SENTIENCE:** Protection from gratuitous harm/suffering. Interests weighed against countervailing factors.
  - [ ] **NSE / IMC ONLY:** Consideration derivative and indirect. (Assigned if Section 5 triggers NSE status)
  - [ ] **PENDING FURTHER REVIEW / INELIGIBLE**

  **FINE PRINT (Clause 6.7):** *The magnitude and type of interests recognized (e.g., interest in life, liberty, avoidance of suffering) directly determines the weight assigned during consideration. Possession of an interest necessitates recognition of its characteristic magnitude for weighting purposes within the OMC Utility Matrix (Ref: OMC Operating Manual, Ch. 4 "Interest Quantification").*

  ### SECTION 7: DECLARATION & SIGNATURE
  *I, the undersigned Proxy Applicant, affirm the information provided is accurate to the best of my knowledge. I understand that falsification may result in demotion or revocation of Moral Status and associated protections.*
  _________________________________________  
  *Signature of Proxy Applicant*  
  _________________________________________  
  *Date*

  **OMC USE ONLY:**  
  *Clerk ID:* ______ *Initial Tier:* ______ *Final Tier:* ______ *Date Stamp:* __________  
  *Comments:* [__________] (*e.g., "Infant (Homo sapiens), Sec.5 'No', but auto Platinum per Gamma-1 precedent. Pig (Sus scrofa), Sec.5 'No', Sec.3 N/A, Basic Sentience."*)

  ---
  **OFFICE OF MORAL CONSIDERATION**  
  *Processing Time: 6-8 weeks. Expedited review available for taxa facing imminent utilization. Fees may apply.*  
  *Refer to OMC Master Code of Moral Weights & Measures (2023 Ed.) for full criteria.*
