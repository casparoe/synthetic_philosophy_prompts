answer: |-
  The nuclear repository regime and standard discounting practices reveal a fascinating ethical tension regarding our obligations to the far future. Here's a breakdown of the commitments, inconsistencies, and implications for longtermism:

  ### 1. **Commitments Presupposed by the Repository Regime**
     - **Weak Negative Duties, Not Equal Consideration**:  
       The regime presupposes **minimalist, agent-relative duties** rather than equal moral standing for future people:
       - **Duty Not to Actively Endanger**: A responsibility to contain hazards *we created*, avoiding direct imposition of catastrophic harm.
       - **Duty to Warn**: Obligation to inform future societies of residual risks, even if containment fails.
       - **Non-Interference with Their Autonomy**: Hostile architecture ("forbidding landscapes") and messages ("nothing valuable here") aim to deter intrusion *without* dictating their choices.  
       *This fits a "harm avoidance" ethic even a discounting utilitarian could accept: preventing active, predictable harm is distinct from promoting future welfare.*

     - **What It Does NOT Presuppose**:  
       No commitment to equal weighting of future welfare (as discounting rejects), nor to safeguarding them from *non-legacy* threats (e.g., asteroid impacts, climate tipping points).

  ### 2. **Inconsistency with Discounting: Real but Theoretically Reconcilable?**
     - **Apparent Inconsistency**:  
       Governments spend billions to protect future people from nuclear waste (e.g., €20B+ for Finland's Onkalo) but apply 1–4% discount rates in climate/energy policy, reducing a life saved in 250 years to near-zero present value.  
       *Example*: A $1B climate project saving 10,000 lives in 2300 might be rejected today if discounted at 3% (present value ≈ $0.0006B).
     
     - **Superficial Reconciliation**:  
       A weak "separate spheres" argument:  
       - Repository costs are **liability management** (addressing *our* waste), while discounting governs **investments for future benefit**.  
       - **Political/legal constraints**: Nuclear waste is a visible, regulated legacy hazard; diffuse future risks lack accountability.  
       *This is pragmatic but ethically inconsistent—prioritizing "cleanup" over prevention.*

     - **Fundamental Tension**:  
       Repository efforts implicitly treat *this specific risk* as requiring infinite-horizon protection (100,000 years), while discounting assumes future welfare is less valuable. **No coherent theory justifies this asymmetry** without special pleading for direct liability.

  ### 3. **Repository Design Under Strong Longtermism**
     Strong longtermism (e.g., MacAskill, Ord) assigns *equal moral weight* to all individuals across time. This would transform repository policy:

     - **Radical Active Protections**:  
       - **Retrievable Storage**: Waste must remain *accessible* for monitoring/retrieval. Permanent sealing would be rejected.  
       - **Continuous Stewardship**: Dedicated institutions with renewal protocols (e.g., "nuclear priesthoods" with knowledge transfer).  
       - **Waste Transmutation R&D**: Invest in converting long-lived isotopes (e.g., plutonium-239, half-life 24,000 years) into shorter-lived forms.  
       - **Precautionary Siting**: Avoid regions vulnerable to future glaciation/sea-level rise, even at higher cost.

     - **Refusing "Irreversible" Solutions**:  
       - **No Passive Reliance**: "Set-and-forget" barriers (e.g., clay buffers, rock salt) would be insufficient without active oversight.  
       - **Rejecting Permanent Sealing**: Current plans (e.g., Sweden's KBS-3 method) seal waste for millennia. Longtermism demands reversibility.  
       - **No Delegation to Markers**: "Hostile architecture" alone would be seen as negligent—relying on future societies to interpret warnings assumes unacceptable risk of failure.

     - **Broader Obligations**:  
       Costs would be justified not just for *our* waste, but for mitigating *any* existential risk to future generations (e.g., anti-asteroid systems, AI alignment).

  ### Conclusion: A Revealing Hypocrisy
  The repository regime reflects a **constrained duty to clean up our own mess**, compatible with discounting future welfare. But it exposes a societal hypocrisy: we accept extreme costs to prevent *direct, attributable* harm to the far future (nuclear waste), while ignoring larger *systemic* harms (climate change, unaligned AI) via discounting. Strong longtermism would demand both **active waste stewardship** and **discount rate reform** (e.g., near-zero rates for existential risks). The marker system, while ingenious, would be a mere footnote in a truly longtermist framework—a backup to relentless, intergenerational responsibility.
