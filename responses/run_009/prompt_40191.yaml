answer: |-
  Your project is profoundly thoughtful, and your struggle with consistency reveals the tension between liberal principles and deep-seated intuitions—a core challenge in moral philosophy. Below, I distill a principle that best captures your verdicts, identify points of friction, and apply it to your unlisted cases. Bentham’s ghost would approve of the rigor.

  ### The Proposed Principle
  **The criminal law may prohibit sexual conduct only when:**  
  **(A) It directly harms a non-consenting person** (beyond mere emotional distress at knowing the act occurs), *or*  
  **(B) It involves deception, coercion, or incapacity that negates true consent**, *or*  
  **(C) It imposes non-consensual sensory exposure** (e.g., public acts forcing others to witness).  

  **With two critical constraints:**  
  1. **Harm must be tangible** (physical, psychological, or material), not based solely on moral repugnance.  
  2. **"Victimless" wrongs are beyond criminal law**, even if socially condemned.  

  ---

  ### How the Principle Maps to Your Verdicts
  | **Case** | **Your Verdict** | **Principle’s Accommodation** | **Clause Motivating It** |  
  |----------|------------------|-------------------------------|---------------------------|  
  | **1. Consensual Homosexual (Private)** | Not criminal | ✓ Accommodated | (A) Absence of harm to non-consenting party |  
  | **2. Consensual Homosexual (Public)** | Criminal (minor offence) | ✓ Accommodated | (C) Non-consensual sensory exposure |  
  | **3. Adultery** | Not criminal | ✓ Accommodated | (A) Harm to spouse is indirect; criminalization risks greater harm |  
  | **4. Adult Incest (Infertile)** | Criminal/Wrong | ✗ **Not Accommodated** | *Intuition exceeds principle* |  
  | **5. Bestiality** | Criminal | ✗ **Not Accommodated** | *Relies on repugnance/animal harm* |  
  | **6. Consensual Polyamory** | Not criminal | ✓ Accommodated | (A)(B) No harm, full consent |  
  | **7. Sex via Fraudulent Marriage Promise** | Criminal/Civil wrong | **Partially Accommodated** | (B) Consent vitiated by deception |  
  | **8. Commercial Sex** | Decriminalize | ✓ Accommodated | (A)(B) No inherent harm with consent |  

  ---

  ### Friction Points & Recommendations
  1. **Cases 4 (Incest) & 5 (Bestiality)**:  
     - **Problem**: Your verdicts contradict the principle. Incest (even infertile) triggers intuitions about psychological harm, familial integrity, or "natural" boundaries. Bestiality invokes animal welfare or symbolic degradation.  
     - **Solution**:  
       - *Option 1 (Strict Liberal View)*: Abandon criminalization. Incest: If truly consensual, harm is speculative. Bestiality: If animal suffering is the concern, regulate via animal cruelty laws, not sexual offenses.  
       - *Option 2 (Hybrid)*: Add a narrow clause: **"(D) Acts that risk normalizing exploitation or causing indirect societal harm."** But this risks opening Pandora’s box (e.g., could condemn polyamory).  
       - **Recommendation**: Revisit verdicts 4 and 5. Bentham’s slaughterhouse argument undermines bestiality criminalization. Incest may cause psychological harm (e.g., power dynamics), but if *truly* equal and secret, it challenges objectivism.  

  2. **Case 7 (Fraudulent Promise)**:  
     - **Problem**: Criminalizing deception protects judgment, bordering on paternalism.  
     - **Accommodation**: Clause (B) treats deception as negating consent, akin to fraud in contract law. This avoids paternalism by framing it as a *violation of autonomy*, not poor judgment.  
     - **Refinement**: Limit to *material deception* (e.g., promise of marriage, STI status) directly inducing consent.  

  3. **Repugnance as a Weak Ground?**  
     - **Caution**: Allowing repugnance invites majoritarian tyranny (e.g., historic criminalization of homosexuality). If included, restrict it to **extreme acts with near-universal revulsion** (e.g., necrophilia), but this remains philosophically unstable.  

  ---

  ### Predictions for Unlisted Cases
  1. **Secret Adult Incest (Infertile)**:  
     - **Principle Predicts**: No criminalization. No non-consenting victim (A), no deception/coercion (B), no exposure (C). Harm is speculative or repugnance-based.  
     - **Tension**: Your verdict 4 suggests discomfort, but the principle forces consistency with verdict 1.  

  2. **Post-Mortem Acts with Written Consent**:  
     - **Principle Predicts**: Not criminal. No living victim (A), consent was given (B), no exposure (C). Bodily autonomy extends to posthumous wishes, though societal taboos remain.  
     - **Caveat**: Property law may block the act (e.g., corpse desecration statutes), but *criminal sexual law* lacks grounds here.  

  ---

  ### Conclusion: A Coherent (But Challenging) Framework
  Your candidate principle **nearly succeeds** but stumbles on incest and bestiality due to unresolved intuitions. To resolve this:  
  - **Adopt the principle strictly** and revise verdicts 4 and 5 (recommended for consistency with Bentham’s liberalism).  
  - **OR** add a limited exception for **"inherently exploitative acts"** (e.g., bestiality, non-deceptive incest) if empirical harm can be shown.  

  Bentham’s genius was treating disgust as epistemically corrupt. If you criminalize acts without tangible victims, you resurrect the "mischief" of social infamy he condemned. Your demographic insight affirms this: population harms vanish, but moral panic persists.  

  **Final Thought**: The principle’s strength is its constraint on state power. Its weakness is demanding we confront why some acts *feel* wrong absent harm. If you retain verdicts 4/5, name the harm explicitly (e.g., "psychological degradation of familial bonds")—or acknowledge intuition’s pull. Either choice is philosophically honest.
