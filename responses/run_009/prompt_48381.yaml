  We are translating the philosophical debate between telic egalitarianism and prioritarianism into the language of objective functions, specifically using concepts like concave transforms, aggregation, and dispersion penalties.

  1. **Prioritarianism**: 
     - In your vocabulary: The prioritarian social welfare function aggregates individual utilities by applying a concave transformation to each individual's utility and then summing them. 
     - Formally: \( SW = \sum_{i} f(u_i) \), where \( f \) is a concave function (e.g., logarithm, square root, etc.). 
     - Why concave? Because concavity implies diminishing marginal moral value: an extra unit of utility to a worse-off person contributes more to social welfare than the same unit to a better-off person.
     - The key point: Leveling down (reducing the utilities of the better-off without helping the worse-off) is never desirable because it lowers the sum: even though inequality is reduced, the losses from the better-off are not compensated by gains to the worse-off (since the worse-off are not gaining). In fact, the worse-off might even be made worse off by leveling down? Actually, in the classic leveling-down scenario, the worse-off are not changed, but the better-off are brought down to the level of the worse-off. Then, the prioritarian sum would decrease because the concave transformation of the better-off's utility (now lower) is less than before, and the worse-off remain the same.

  2. **Telic Egalitarianism**:
     - In your vocabulary: The egalitarian social welfare function might be represented as an aggregate that includes a penalty for dispersion (inequality) in utilities. 
     - One common form is: \( SW = \mu \cdot (1 - I) \), where \(\mu\) is the mean utility and \(I\) is an inequality index (like the Atkinson index). 
     - Alternatively, we might have a direct penalty: \( SW = \sum_{i} u_i - \alpha \cdot D(u) \), where \(D(u)\) is a measure of dispersion (e.g., variance, Gini coefficient) and \(\alpha\) is a weight.
     - The Atkinson index approach: The Atkinson social welfare function is \( SW = \left( \frac{1}{n} \sum_{i} u_i^{1-\varepsilon} \right)^{\frac{1}{1-\varepsilon}} \) for \(\varepsilon \neq 1\), which is a prioritarian form? Actually, note that the Atkinson index is defined as \( I = 1 - \left( \frac{1}{n} \sum_{i} \left( \frac{u_i}{\mu} \right)^{1-\varepsilon} \right)^{\frac{1}{1-\varepsilon}} \), so the welfare function is \( \mu (1-I) = \left( \frac{1}{n} \sum_{i} u_i^{1-\varepsilon} \right)^{\frac{1}{1-\varepsilon}} \). This is a prioritarian form? Actually, it is a monotonic transformation of the prioritarian sum. But note: the Atkinson social welfare function is equivalent to the prioritarian form when we take the transformation \( f(u) = u^{1-\varepsilon} \) and then take the power and average? Not exactly: the prioritarian sum is additive, while the Atkinson form is a generalized mean.

     However, the key for the egalitarian is that they care about the spread per se. So we might represent the egalitarian objective as:
        \( SW = \text{aggregate utility} - \text{penalty for inequality} \)
     For example, using variance: \( SW = \sum_i u_i - \alpha \cdot \text{Var}(u) \).

     But note: in the leveling-down scenario, if we level down (i.e., reduce the utilities of the better-off to the level of the worse-off without changing the worse-off), then the mean \(\mu\) decreases but the dispersion (variance) becomes zero. So the change in SW depends on the trade-off between the loss in the mean and the gain from reduced dispersion.

  3. **The Leveling-Down Objection**:
     - The objection: In the leveling-down scenario, the egalitarian view (as characterized above) might say that the situation is better in one respect (because inequality is reduced) even though it is worse all things considered (because the mean has dropped too much). 
     - But note: the objection is that the egalitarian view must at least say that the leveling-down move is better in the dimension of equality, even if it is worse overall. The prioritarian, by contrast, sees no such improvement in any dimension because the prioritarian only cares about the transformed sum, which unambiguously decreases.

  4. **Translation Challenges**:
     - **Single scalar objective**: In the optimization framework, we have one scalar (SW) to maximize. Therefore, the idea of "better in one respect but worse overall" does not have a direct counterpart because we are forced to aggregate all considerations into one number. However, we can model the egalitarian as having two terms: one for aggregate and one for dispersion. Then, the leveling-down move would decrease the aggregate term but also decrease the dispersion penalty. So we can say that the dispersion penalty term is improved (the penalty is reduced) while the aggregate term is worsened. But the overall scalar might go down. This is the closest we can get.

