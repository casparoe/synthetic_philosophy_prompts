           - Alternatively, consider the Atkinson social welfare function: it is a prioritarian form (if we ignore the power and the average) because it is a generalized mean. But note that the Atkinson index is defined to be a representation of inequality aversion that is consistent with prioritarianism? In fact, the Atkinson social welfare function is ordinally equivalent to the prioritarian sum: if we take the prioritarian sum \( \sum_i u_i^{1-\varepsilon} \) and then take a monotonic transformation (like raising to the power \(1/(1-\varepsilon)\) and multiplying by a constant), we get the Atkinson form. Therefore, for the Atkinson index, the prioritarian and the egalitarian (as defined by Atkinson) are essentially the same. But note: the Atkinson form is built on a prioritarian foundation.

           - However, the philosophers' distinction might be more than just parameterization. The prioritarian is concerned with the absolute level of well-being and gives priority to the worse-off, but does not care about relative inequality per se. The egalitarian, by contrast, cares about relative inequality. In some cases, they might coincide, but in others they might not.

           - Example: Consider two distributions:
               A: (1, 100)   -> prioritarian: f(1)+f(100); egalitarian: 101 - alpha*variance.
               B: (2, 2)     -> prioritarian: 2*f(2); egalitarian: 4 - alpha*0.

             Now, if we choose f to be the square root, then:
               A: sqrt(1)+sqrt(100) = 1+10 = 11
               B: 2*sqrt(2) ≈ 2*1.414 = 2.828 -> so A is better for prioritarian.

             For the egalitarian with variance and alpha=1:
               A: variance = ((1-50.5)^2 + (100-50.5)^2)/2 ≈ (2450.25 + 2450.25)/2 = 2450.25 -> SW = 101 - 2450.25 = -2349.25
               B: variance=0 -> SW=4.

             So B is better for the egalitarian.

           - But note: we can also design a prioritarian function that makes B better than A? For instance, if f is very concave (like log), then:
