       - **Surviving genuine choice**: The choice between a prioritarian objective (concave transform then sum) and an egalitarian objective (with an explicit dispersion penalty) is a genuine one. The two functions can lead to different orderings of outcomes, especially in leveling-down scenarios.

       - **Distortion or erasure**:
           - The "better in one respect" idea: In the single-objective framework, we lose the ability to see the multidimensional evaluation. However, we can decompose the objective function into multiple terms (if we design it that way) and then observe that a change might improve one term and worsen another. But in standard practice, we don't usually break down the objective for every decision. The philosopher's point about a respect in which leveling down is better is captured by the dispersion term in the egalitarian function: leveling down reduces the dispersion penalty. But the prioritarian function has no such term, so there is no respect in which leveling down is better.

           - The leveling-down objection itself: In the dispersion-penalty formulation, the objection is that the dispersion penalty can be minimized by making everyone equally poor (i.e., leveling down). This is exactly what happens: if we set all utilities to the minimum level (or to the level of the worst-off), then the dispersion penalty becomes zero (if we use a relative measure, like the Atkinson index, then absolute leveling down to zero would make the index undefined? But generally, leveling down to the same positive level will set variance to zero). So the objection is that the egalitarian objective might, in some cases, recommend leveling down if the reduction in dispersion penalty outweighs the loss in aggregate. However, note that in the typical egalitarian function, the aggregate term (sum of utilities) is also present and will be reduced by leveling down. Therefore, unless the penalty coefficient is set in a very extreme way, the overall objective might still decrease. But the objection is that the egalitarian must at least acknowledge that the leveling-down move improves equality, even if overall it is bad. And that is captured by the dispersion term.

