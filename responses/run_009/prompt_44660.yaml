prompt: |-
  Act as a professional philosopher working in social ontology and decision theory, and think carefully before answering — start with a quick brainstorm of what Lewis's account of convention in his book Convention actually commits us to, then do the real analysis. I'm a retired physicist who's only recently gotten serious about philosophy, so keep the formalism light but don't dumb it down.

  My case: Sweden's 1967 switch from left- to right-hand traffic, Dagen H, 3 September 1967. The salient facts as I understand them: Sweden had driven on the left for centuries while all its neighbours drove right, and most Swedish cars had the steering wheel on the left anyway, which made overtaking genuinely dicey. A 1955 advisory referendum had gone heavily for keeping left — something like four in five, if I remember right — but parliament went ahead anyway. The switch itself was preceded by years of preparation and a saturation public-information campaign, and on the day traffic was banned for hours while signage and signals were physically swapped.

  Run the episode through Lewis's account of convention as a coordination equilibrium sustained by reciprocal expectations and common knowledge. I want a careful mapping: what the coordination problem actually was (mismatched neighbours plus mismatched steering), where the arbitrariness lies, how the announcement campaign does the work of manufacturing common knowledge of the new equilibrium, and whether the announced date becomes salient in roughly Schelling's sense. Then the parts I find most interesting. First, the 1955 referendum: conventions have a normative character on Lewis's picture — each party wants the others to conform — but apparently they're not majoritarian, so what exactly was overridden? One thought I'd like you to take seriously and then either defend or dismantle: the referendum arguably measured the wrong quantity, since a vote about what Sweden should do reads as an unconditional preference, whereas Lewis's account only cares about conditional ones — would you rather drive on the right *if everyone else did*? Does that rescue the theory from the referendum result, or is it an ad hoc dodge? Second, the transition window when traffic was banned: is that literally a stretch of time in which no convention exists at all, and does Lewis's framework in a sense predict that such a gap is necessary for switching? Then be honest about where the theory is silent or strains: who bore the costs of the switch and whether that matters to the account, why the old convention survived as long as it did with incompatible neighbours on every land border, and whether an engineered convention like this differs in kind from a grown one. Finally, tell me what the episode — which by most accounts went startlingly smoothly — shows about the theory: confirmation, an anomaly, or a case Lewis never really anticipated? Correct me if I've garbled any of the history along the way, but note it separately rather than quietly building the analysis on my version of events.
reasoning: |-
  Okay, let me approach this methodically as a social ontologist would. The user is a retired physicist engaging deeply with philosophy, so they'll appreciate precision but need concrete mappings to the Swedish case. 

  First, Lewis's core framework: conventions as coordination equilibria sustained by mutual expectations and common knowledge. The key elements are: arbitrariness (either side could work), conditional preferences ("I prefer R if others drive R"), and the recursive structure of expectations. 

  For Dagen H:
  - The coordination problem wasn't just Sweden's internal traffic flow, but mismatch with neighbors and vehicle design. Left-hand drive cars on left-side roads created dangerous overtaking blind spots. 
  - Arbitrariness lies in the fact that either left or right could coordinate traffic safely if universally adopted, but the specific choice is indifferent absent network effects.
  - The referendum is fascinating because it measured unconditional preferences ("I like left") not conditional ones ("I prefer left only if others keep left"). This explains the discrepancy—people disliked change but conditionally preferred alignment with neighbors. Parliament overrode not the convention itself but inertia.
  - The transition period is theoretically vital: by banning traffic, they created a literal tabula rasa where the old convention dissolved and the new one could be bootstrapped via common knowledge manufactured by the campaign. The date became Schelling-salient through sheer publicity saturation.
  - Cost distribution is a gap in Lewis—he assumes coordination benefits outweigh costs, but here taxpayers bore infrastructure costs while individuals adapted. Yet the smooth transition confirms his model: once common knowledge of the switch was established, coordination happened rapidly.

  The engineered vs. organic distinction matters. Lewis focused on emergent conventions, but Dagen H shows authorities can forcibly reset equilibria by manipulating common knowledge. The referendum anomaly actually strengthens his account by exposing the conditional/unconditional preference distinction. 

  Where the theory strains: 
  - Why didn't border effects erode the old convention earlier? Probably because cross-border traffic was low pre-EU integration. 
  - The normative force was overridden because conditional preferences shifted toward alignment despite unconditional attachment to left-side driving.

  Ultimately, this is a triumphant case for Lewis—it demonstrates how artificially induced common knowledge can coordinate mass behavioral change overnight. The physicist will appreciate that it's like flipping a bistable system by removing metastability.
answer: |-
  ### **Brainstorm: Lewis's Core Commitments in *Convention***  
  1. **Conventions as Coordination Equilibria**: A state where no individual benefits by unilaterally deviating *if others conform*.  
  2. **Arbitrariness**: Multiple equilibria could work, but one persists because it’s focal.  
  3. **Reciprocal Expectations**: Conformity depends on expecting others to conform, expecting others to expect *you* to conform, etc.  
  4. **Common Knowledge**: Everyone knows the rule, knows others know it, ad infinitum.  
  5. **Normativity**: Conventions carry normative pressure—each party *prefers* others conform to maintain coordination.  

  ---  
  ### **Analysis: Dagen H Through Lewis's Lens**  
  #### **1. The Coordination Problem**  
  - **Mismatched Neighbours + Steering**: Sweden’s left-hand driving clashed with right-driving neighbours (Norway, Finland). Most Swedish cars had left-side steering (optimized for right-hand traffic), creating dangerous blind spots during overtaking.  
  - **Equilibria**: Two possible stable states: *all drive left* or *all drive right*. Both solve coordination, but the *right-driving equilibrium* offered superior cross-border safety and vehicle optimization.  
  - **Arbitrariness**: Left/right are functionally symmetric *in isolation*—but external factors (neighbours, car design) broke symmetry, making right *non-arbitrary* for Sweden.  

  #### **2. Manufacturing Common Knowledge**  
  - **The Announcement Campaign**: Lewis requires common knowledge to shift equilibria. Sweden’s saturation campaign (logos, songs, TV ads) created:  
    - *Iterative expectations*: "I know the switch is coming," "I know *you* know," "I know you know *I* know," etc.  
    - **Salience of Dagen H**: The date (3 Sept 1967) acted as a **Schelling focal point**—an obvious, publicly designated moment to synchronize behavior. Traffic suspension allowed unambiguous reset.  

  #### **3. The 1955 Referendum Puzzle**  
  - **What Was Overridden?**  
    - Lewis’s normativity is *conditional*: "I want others to drive left *given that they expect me to drive left*." The referendum measured *unconditional* preferences ("I prefer left *simpliciter*").  
    - **Conditional Preference Gap**: Most Swedes unconditionally preferred left (habit, nostalgia), but *conditionally* preferred right *if neighbours and compatriots switched* (safety/efficiency gains). Parliament overrode inertia, not the convention’s logic.  
  - **Ad Hoc Dodge?** No—Lewis explicitly separates:  
    - *Base motivations* (unconditional preferences)  
    - *Conditional preferences* (reactive to expectations).  
    The referendum revealed base motivations; the switch responded to conditional ones amplified by cross-border pressures.  

  #### **4. Transition Window: Conventionless Void?**  
  - **The Ban-Hours Gap**: During the traffic ban, no driving convention existed—a rare real-world instance of Lewis’s "state of nature" between equilibria.  
  - **Necessity for Switching?** Lewis doesn’t require a gap, but it *facilitates* switching by:  
    - Suspending old expectations.  
    - Allowing unambiguous re-coordination around new focal points (e.g., swapped signage).  
    Without this, individual drivers might hedge, fearing non-compliance.  

  #### **5. Strains on the Theory**  
  - **Costs & Distribution**: Lewis ignores *transition costs* (e.g., signage replacement, driver retraining). Sweden socialized costs via taxes, but theory assumes net benefits dominate—true here (accidents fell 40% post-switch).  
  - **Border Incompatibility Persistence**: Why didn’t neighbour mismatch erode the convention earlier? Lewis’s model downplays:  
    - *Inertia*: Conventions persist absent severe payoff asymmetry.  
    - *Scale*: Border traffic was low pre-1967; globalization amplified incompatibility.  
  - **Engineered vs. Grown Conventions**: Lewis focuses on organic emergence (e.g., language), but Dagen H shows conventions can be *designed* via state-led common knowledge. This extends, not breaks, his model—expectations remain central.  

  #### **6. Historical Accuracy Check**  
  - Your facts are correct:  
    - 1955 referendum: 82.9% favored keeping left.  
    - Steering wheels: >90% of Swedish cars were left-hand drive pre-1967.  
    - Smooth transition: No fatal accidents on Dagen H.  

  ### **Conclusion: Theory Confirmed with Nuance**  
  - **Confirmation**: Dagen H is a textbook case of Lewis:  
    - A non-arbitrary equilibrium shift (right-driving) achieved via manufactured common knowledge.  
    - Salient focal points (date, campaign) enabling mass re-coordination.  
  - **Anomaly?** The referendum exposes a blind spot: Lewis underplays *unconditional vs. conditional preference conflicts*. Yet this is resolvable within his framework.  
  - **Novelty**: Engineered conventions leverage the *same mechanisms* (expectations, common knowledge) as grown ones—just accelerated. The physics analogy: inducing a phase transition by adding energy (publicity) to overcome activation barriers (inertia).  

  **Final Verdict**: Lewis’s model elegantly explains Dagen H. The "override" of referendum sentiments underscores that conventions are driven by *reactive expectations*, not static preferences—a profound insight for social ontology.
