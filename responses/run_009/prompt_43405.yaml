prompt: |-
  I'm a graduate TA for an intermediate decision theory course, and next week I run my first section of the semester on expected utility and its empirical failures. The lecturer has just covered the von Neumann–Morgenstern axioms and the representation theorem in two lectures; my job, in fifty minutes with a whiteboard, is the Allais paradox and what it's supposed to show about the independence axiom. The students are second-year economics majors who have seen expected utility for money exactly once and mostly treat the axioms as algebra they will be tested on, not as substantive claims about rational preference. I'm genuinely torn about sequencing: the natural order is to restate independence formally and then exhibit the violations, but my instinct is that the axiom only becomes interesting after students have made the Allais choices themselves and felt the tension from the inside — that until then "independence" is just the name of one more line on the formula sheet. I'd like a defended view on which order actually works, not just both options listed.

  So plan the section for me rather than explaining the paradox to me. What should the carrying example be — the original large-payoff setup with a certain prize versus the two risky pairs, or a reformulation with stakes the students would actually face, and what must the example have and not have in order to carry the point (I worry that scaling the payoffs down changes the psychology, but I also worry the original amounts are abstract enough that students go numb)? Which misconceptions should I expect, in the order they'll actually arrive — my guesses are "this is just risk aversion, which we already knew," "certainty has a utility the theorem forgot to include, so the fix is easy," and "so expected utility is refuted and the axioms are arbitrary dogma" — and where exactly in the sequence each should be headed off? Is having them vote on the two choice pairs before any theory is on the board a help or a hazard, given that some will defend their choices and I don't want the section to become a debate about whether the 'irrational' answer is really irrational? And is it worth showing them a presentation of the same underlying choice where the shared outcome is made salient, so they can watch their own answer flip — or does that give away the punchline and reduce the paradox to a lesson about paying attention?

  Finally, give me one question I can ask in the last five minutes that would tell me whether they understand independence as a claim about how one pair of lotteries may be compared to another, rather than as a memorized axiom label — and tell me what I should openly decline to cover at this level (generalized utility theories, the follow-up literature on whether the violations survive with experience, the framing experiments) and how to say so in a way that doesn't sound like an invitation to dismiss the whole framework as optional decoration.
reasoning: |-
  Okay, let me tackle this TA's problem. They're teaching a section on the Allais paradox and need to make the independence axiom meaningful for econ majors who see it as just algebra. The main dilemma is sequencing: should they start with the axiom or the paradox?

  First, I remember the Allais paradox challenges the independence axiom in vNM expected utility. Students usually treat axioms as math without grasping their real-world implications. The TA wants them to feel the tension first. That makes sense—people learn better when they're confronted with a contradiction. So starting with the paradox might hook them. Let me check educational psychology here... yeah, cognitive dissonance can drive learning. If students choose inconsistently themselves, they'll care why the axiom matters.

  Next, the example. Original Allais uses high stakes (e.g., $1M), but that might feel abstract. Scaling down to realistic amounts could work, but the TA worries about psychological impact. Maybe a mid-range? Say $500/$100 prizes—enough to matter but not life-changing. Crucially, the certain option in Pair 1 must be appealing enough to violate independence when Pair 2's safe option is removed. Need to design so the shared consequence (e.g., $0 with 89% probability) is identical but ignored emotionally. 

  Misconceptions: Risk aversion vs. axiom violation is key. Students might say "I'm just risk-averse." But Allais shows inconsistency, not mere aversion. The certainty effect is another—they'll want to add extra utility for certainty. Need to clarify that vNM already accounts for this via utility curvature. Also, preventing them from thinking expected utility is "debunked." Must emphasize it's a descriptive failure, not prescriptive. 

  Voting: Yes, have them vote on choices upfront. But avoid debate by presenting it as common behavior, not personal irrationality. Use anonymous polling. 

  Framing: Showing how presentation flips choices is powerful. Reveals how framing affects decisions, which sets up future topics but might distract now. Save it for the end as a teaser. 

  Closing question: Ask them to restate independence in their own words using non-money examples (e.g., weekend plans). Tests if they see it as a comparison principle. 

  Boundaries: Skip generalized theories. Say "We're focusing on why this axiom was proposed and how it fails descriptively—advanced fixes are for later courses." Keeps the scope tight. 

  The TA's right—start with the paradox. Structure: vote → reveal tension → restate axiom → resolve cognitively. This order makes the math answer a felt problem.
answer: |-
  Here’s a battle-tested plan for your 50-minute section, designed to **make independence visceral** and preempt common misconceptions. Sequence is critical: **start with lived choice, then formalize the tension.**

  ---

  ### **Section Plan: The Allais Paradox & the Independence Axiom**  
  **Total Time:** 50 minutes  
  **Pedagogical Goal:** Transform "independence" from algebra to a psychological claim.  

  ---

  #### **Phase 1: Elicit the Paradox (15 mins)**  
  **Goal:** Trap students in the contradiction *before* labeling it.  

  1. **Intro (2 mins):**  
     *"We’ve seen how vNM axioms let us represent preferences with expected utility. Today, we test how those axioms hold up against real choices. I’ll ask two questions—answer intuitively."*  

  2. **Pair 1: "The Safe Bet" (3 mins)**  
     **Option A:** 100% chance of **$500,000**  
     **Option B:**  
     - 10% chance of **$2,500,000**  
     - 89% chance of **$500,000**  
     - 1% chance of **$0**  
     *"Vote: A or B? No overthinking."*  
     ***Expected votes:** ~80-90% choose A (certainty effect).*  

  3. **Pair 2: "The Long Shot" (3 mins)**  
     **Option C:** 11% chance of **$500,000**, 89% chance of **$0**  
     **Option D:** 10% chance of **$2,500,000**, 90% chance of **$0**  
     *"Vote: C or D?"*  
     ***Expected votes:** ~80-90% choose D (risk-seeking for higher upside).*  

  4. **Reveal the Contradiction (7 mins):**  
     - **Sketch the lotteries** on the board:  
       - Pair 1: A = [$500k], B = [0.10: $2.5M, 0.89: $500k, 0.01: $0]  
       - Pair 2: C = [0.11: $500k, 0.89: $0], D = [0.10: $2.5M, 0.90: $0]  
     - **Highlight:** "Notice: If you chose A > B and D > C, you violated vNM. Why? Rewrite B and C using the same ‘gamble’ plus a shared outcome."  
       - B = 0.11 * [~$500k] + 0.89 * **[$500k]**  
       - C = 0.11 * **[$500k]** + 0.89 * **[$0]**  
     - **Hammer the tension:** *"In Pair 1, you preferred $500k for sure over a gamble that’s mostly $500k. In Pair 2, you preferred a gamble with $0 over $500k with near-identical odds. But independence says adding the same outcome (here, $500k with 89% probability) shouldn’t reverse preferences!"*  

  ---

  #### **Phase 2: Formalize the Axiom (10 mins)**  
  **Goal:** Show independence as the *solution* to the paradox they feel.  

  1. **Restate Independence (3 mins):**  
     *"Independence: If L ⪰ M, then for any N and α ∈ (0,1], αL + (1-α)N ⪰ αM + (1-α)N."*  
     - **Translate:** "Mixing with N shouldn’t flip L vs. M."  
     - **Connect to Allais:** In Pair 1, L = [$500k], M = [0.10:$2.5M, 0.01:$0]. N = [$500k] with weight 0.89. Choosing A > B implies L ≻ M. But in Pair 2, mixing L and M with N' = [$0] flips to M ≻ L!"  

  2. **Why the Axiom Exists (2 mins):**  
     *"It’s not arbitrary—it ensures linearity in probabilities. Without it, utilities can’t be weighted by probabilities alone."*  

  3. **Address "Risk Aversion" Misconception (5 mins):**  
     - **Misconception:** *"This is just risk aversion."*  
     - **Reframe:** "Risk aversion explains preferring A over B, but not preferring D over C! vNM *allows* risk aversion via concave utility. The paradox is *inconsistency*—you’re risk-averse in Pair 1 but risk-seeking in Pair 2 when the ‘safe’ part is removed."  

  ---

  #### **Phase 3: Dissect the Psychology (10 mins)**  
  **Goal:** Validate intuition while showing why it breaks EU.  

  1. **The Certainty Effect (5 mins):**  
     - *"Why did most choose A in Pair 1? Certainty feels special—we overweight guaranteed outcomes. EU *can* explain this if u($500k) is much larger than its probability suggests, but then it *can’t* explain Pair 2 without violating independence."*  
     - **Preempt "EU fix" misconception:** *"Adding ‘certainty utility’ breaks EU’s linear probability structure. The point isn’t that EU is ‘wrong’—it’s that independence is a strong restriction on how we evaluate uncertainty."*  

  2. **Reframing Demo (5 mins):**  
     - **Show Allais with salient shared outcome:**  
       *"Option B: 89% chance to win $500k, 1% chance $0, and 10% chance to choose between:  
       - $500k for sure (i.e., A)  
       - 10% chance $2.5M, 90% $0 (i.e., D)"*  
     - **Result:** Most now choose B (the "rational" EU choice).  
     - **Punchline:** *"When we make the shared outcome obvious, choices align with independence. Framing matters—our brains don’t isolate compound lotteries."*  

  ---

  #### **Phase 4: Implications & Boundaries (10 mins)**  
  **Goal:** Contextualize without undermining EU’s value.  

  1. **"Is EU Dead?" (5 mins):**  
     - *"No—it’s a normative benchmark. The axioms tell us what consistent preferences look like. Allais shows descriptively, people *aren’t* always consistent. But for welfare analysis or policy, we often need a coherence standard."*  

  2. **What We *Won’t* Cover (3 mins):**  
     - *"We won’t discuss generalized models (e.g., prospect theory) today—that’s for behavioral electives. Nor will we debate if people ‘learn’ to obey axioms (evidence is mixed). Our goal: see why independence was assumed and how it fails descriptively."*  

  3. **Closing Question (2 mins):**  
     - ***Check understanding:** "Suppose you prefer a weekend hiking (H) over beach (B). If I offer a 50% chance of H plus 50% chance of a museum trip (M) vs. 50% chance of B plus 50% chance of M, does independence restrict your preference? Why?"*  
       - **Correct answer:** Independence implies if H ≻ B, then 0.5H+0.5M ≻ 0.5B+0.5M. It’s a claim that adding M shouldn’t flip H vs. B.  

  ---

  #### **Key Design Choices Defended**  
  - **Why start with choices?** Students who vote against independence *first* are invested in resolving the tension. Formalizing first makes the axiom seem like dogma.  
  - **Stakes:** Use original Allais amounts ($500k-$2.5M). Scaling down (e.g., $5 vs $25) weakens the certainty effect. Abstract large sums > trivial sums.  
  - **Voting:** Essential for buy-in. To avoid debates: *"Most people choose A and D—we’re explaining why that creates a problem, not calling *you* irrational."*  
  - **Framing demo:** Include it! It shows the paradox stems from *misperception*, not deep preference, reinforcing why EU demands axiom-compliant framing.  
  - **Avoid:** Fixing EU (too advanced), normative debates (save for ethics week), or experimental details (distracts).  

  **Last slide:**  
  > *"Independence isn’t algebra—it’s a claim that *adding the same outcome shouldn’t reverse preferences*. Allais shows we violate this. But without it, we lose expected utility’s power. Next week: when violations matter for policy."*  

  This sequence turns the paradox into a detective story—students *feel* the axiom’s weight because it resolves a contradiction they experienced.
