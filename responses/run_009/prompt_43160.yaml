answer: |-
  ## Since You Asked
  **With Aunt Hume (Columnist Since 1994)**

  **Dearest Readers,**

  Another week, another fascinating constellation of desires masquerading as cosmic imperatives landing in my inbox. Let us proceed with our customary clarity.

  ---

  **Dear Aunt Hume,**
  Look, it’s simple science. Humans evolved to spread juicy gossip – it built social bonds and warned the tribe about cheaters. My neighbour Brenda is definitely cheating on Gary. Everyone *should* know! Evolution *wants* me to tell the whole street, right? Isn’t that just what we’re *supposed* to do? Darwin Says Spread It!
  *Signed, Darwin But Dumber*

  **Dear Darwin But Dumber,**
  You describe observing a pattern of behaviour in your neighbour Brenda, coupled with a belief about Gary’s expectations. You then reference a well-documented biological and anthropological phenomenon: the human propensity, likely shaped by selective pressures favouring group cohesion and reciprocal altruism monitoring, for exchanging information about the behaviour of others within a social group – commonly termed ‘gossip’.

  You assert that this evolved propensity (“spread juicy gossip”) translates into a prescriptive imperative (“everyone *should* know,” “Evolution *wants* me,” “what we’re *supposed* to do”). Here we observe the familiar leap. The descriptive fact of evolutionary origins and the current existence of the *impulse* to gossip (Fact A) is presented as generating a normative *command* to gossip (Ought B). The ‘ought’ enters solely via your expressed *desire* to share this information about Brenda, perhaps amplified by a feeling of vindication or social duty. Evolution describes the machinery of the impulse; it does not prescribe its deployment. Whether you tell the street, tell Gary, tell no one, or compose an opera about it, remains contingent on which of your *other* desires (e.g., for peace, for drama, for Brenda’s wrath) you choose to act upon. The evolutionary history explains the existence of the lever; it does not dictate whether, or how hard, you pull it. Next.

  ---

  **Dear Aunt Hume,**
  Gotcha! Hypocrite! Last month you told my sister, “*If* you *want* to keep your job, you *should* show up before noon.” Ha! Advice! An “ought”! Right there! Printed! You *do* tell people what to do. Explain *that*, Ms. “Only-Descriptions”!
  *Signed, Archive Avenger*

  **Dear Archive Avenger,**
  You reference my previous correspondence with your sister. The statement in question was: “*If* you *want* to keep your job, you *should* show up before noon.”

  Your sister described a situation: her employer had expressed dissatisfaction with her tardiness, linking punctuality explicitly to continued employment. She expressed a strong desire (“want”) to retain her position. My statement merely articulated the conditional relationship *she herself had already presented*: the observable fact (her employer’s stated policy) coupled with her stated desire (to keep the job). The ‘should’ here is entirely *hypothetical*. It means: “Given your *desire* D (keep job), and given the empirically verifiable condition C (showing up before noon is required for D), then action A (showing up before noon) becomes instrumentally necessary *if* D is to be achieved.”

  The ‘ought’ of punctuality was entirely *conditional* upon the *want* she brought to the inquiry. I supplied no independent ‘ought’; I merely clarified the connection between *her* desire and the observable conditions of the world needed to satisfy it. The ‘IF’ is indeed load-bearing. Remove her desire to keep the job, and the ‘should show up before noon’ loses all prescriptive force, reverting to a simple observation about her employer’s policy. I described the mechanism of her own situation. The imperative stemmed from her premise, not my conclusion.

  ---

  **Dear Aunt Hume,**
  Please. Just tell me what to do. My mother needs constant care since her stroke. I love her, but I’m exhausted. My brother lives far away and sends money but doesn’t help. Putting her in a home feels like betrayal. Not doing it feels like I’m drowning. What is the *right* thing? Just tell me the right thing.
  *Signed, Simply Stuck*

  **Dear Simply Stuck,**
  You describe a situation of profound physical and emotional strain. You care for your mother, an act stemming from deep affection and familial bond (“I love her”). Simultaneously, you experience severe depletion (“exhausted,” “drowning”). You acknowledge your brother’s geographical distance and his contribution of financial support, contrasted with the absence of physical caregiving. You articulate two perceived paths forward, each laden with intense negative emotion: institutional care evokes “betrayal”; continued personal care evokes unsustainable depletion.

  You seek an external ‘right thing’, a rule to follow. But the elements you provide paint a vivid picture of the values *already* in conflict within you: deep love and loyalty to your mother, a powerful drive to honour your bond with her, a need for self-preservation and respite, a sense of fairness regarding shared responsibility (perhaps tinged with resentment towards your brother), and a fear of profound guilt or self-reproach. The agony arises precisely because *you* value all these things highly, and they currently pull in opposing directions. There is no external ‘right thing’ floating above this constellation of *your* values and feelings. There is only the difficult navigation required when deeply held desires – the desire to care for your mother, the desire for your own well-being, the desire to feel you’ve acted honourably – cannot all be fully satisfied simultaneously. You will weigh these values you possess. You will make a choice. You will act. And whatever action you take will flow from the complex interplay of these very desires and aversions you have so clearly described.

  ---

  **Editor’s Note:** Since 1994, readers have asked, argued, and pleaded. For thirty years, Aunt Hume has described. We have, on many occasions, asked her what we *ought* to run in this space instead. Each time, she has meticulously described our request, our contractual obligations, our readership demographics, and our apparent desire for continuity. We continue to print her.
