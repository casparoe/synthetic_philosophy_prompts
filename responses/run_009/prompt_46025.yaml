prompt: |-
  Each spring I teach the abortion unit in our introductory ethics course, and each spring I come away suspecting my own judgments are less tidy than the arguments I assign. I'd like to lay out my verdicts on a set of cases and ask what principle, if any, captures them — I'd want a principle stated precisely enough to have testable consequences, not a slogan.

  My verdicts, in roughly increasing order of discomfort:

  1. Thomson's famous case: you wake up to find the Society of Music Lovers has connected your circulatory system to an unconscious violinist who will die if unplugged, and nine months of connection will cure him. I judge unplugging to be permissible, even though the violinist is innocent and unplugging kills him.

  2. The variant with the drifting people-seeds, where you took reasonable precautions (screens on the windows) and one took root anyway. Removing it: permissible, and my confidence here is actually higher than in the violinist case.

  3. A pregnancy resulting from consensual intercourse where contraception was used correctly and failed. Abortion at eight weeks: permissible.

  4. A woman who has declined contraception repeatedly over several years and uses abortion as her sole method of birth control, now in her fourth pregnancy, at twelve weeks, healthy fetus, no complications. I still judge this permissible, and yet I cannot shake the sense that something more is asked of her than was asked of the person in case 3 — that the burden of justification rises with each refusal. I'm prepared to be told this is a bias and not a moral datum.

  5. A healthy woman, healthy fetus, thirty-eight weeks, and she seeks termination because a fellowship opportunity would be compromised by giving birth. I judge this impermissible, and I judge it so even though the bodily-autonomy considerations at stake in cases 1 through 3 — her body, her ongoing involuntary support — seem formally unchanged from the first trimester.

  6. A fetus with anencephaly, which will never be conscious and has, I take it, no future of the kind that makes killing wrong on the deprivation account. I judge terminating that pregnancy permissible. But compare: a patient in a permanent, stable unconscious state who will never wake. Killing that patient seems clearly wrong to me, even though, again, no future of value is available to be deprived of. I cannot easily hold both verdicts if what grounds the wrongness of killing is the deprivation of a future.

  7. Contraception, which prevents a future-like-ours from coming into existence just as surely as abortion prevents an existing one, seems to me obviously permissible, with no tinge of regret.

  So here is what I'd like from you. First, is there a single principle, or a principled hybrid, that delivers all seven verdicts — or close? If you propose one, state each clause precisely and tell me which case motivates it. Second, apply it to a case I haven't listed: the violinist scenario modified so that you agreed to one week of connection as a favor, and partway through, the connection is quietly extended to nine months without your consent. Third, tell me candidly which of my verdicts your best principle cannot save, and whether the verdict or the principle should give — I am more attached to some of these verdicts than others, and I've flagged where I suspect myself of bias. Finally, since I'll be taking this back to my seminar: say what would change your mind. Which argument or consideration from the other side most threatens your proposal, and where in your reasoning is the proposal most likely to fail? I'd rather know the weakest joint in advance than have a student find it for me.
reasoning: |-
  Hmm, this is a fascinating and complex ethics problem about abortion. The user is an ethics professor who teaches this topic but finds their own judgments more nuanced than standard arguments. They've presented seven specific cases with their verdicts, ranging from permissibility to impermissibility, and want me to identify a unifying principle.

  First, I need to carefully analyze all seven cases. The user's judgments show interesting patterns - they're strongly supportive of bodily autonomy in early pregnancy and unusual scenarios (like the violinist case), but draw the line at very late abortions for non-medical reasons. The anencephaly vs PVS comparison is particularly tricky since both involve beings without consciousness, yet the user sees them differently.

  The key challenges I notice are:
  1) Explaining why bodily autonomy seems absolute early on but diminishes later
  2) Resolving the apparent contradiction between anencephaly (permissible) and PVS (impermissible) termination
  3) Accounting for the "increasing burden" feeling in the repeated abortion case without making it impermissible
  4) Squaring contraception's permissibility with the deprivation argument

  For a unifying principle, I'm considering a two-dimensional framework combining bodily integrity and developmental threshold. The bodily integrity component would explain cases 1-4, while a viability/sentience threshold could explain the shift in case 5. For the medical cases (6), I need to distinguish between never-conscious beings (anencephalic fetus) and formerly-conscious beings (PVS patient).

  The modified violinist case where consent was given then violated seems clearly permissible to me - it actually strengthens the bodily autonomy argument. As for which verdicts might need adjustment, I suspect the PVS case (6b) is the most vulnerable if we're being consistent, though I understand the user's intuition there.

  The strongest counterarguments would likely come from deprivation theorists who'd challenge my handling of the PVS case, or bodily autonomy absolutists who'd reject any threshold. I should acknowledge these pressure points clearly since the user wants to prepare for classroom discussion.

  This is exactly the kind of nuanced, real-world ethics dilemma where tidy philosophical arguments meet messy human intuitions - perfect for pushing students to think deeper about their principles.
answer: |-
  Below is a principled framework that captures your verdicts across all seven cases, grounded in a synthesis of bodily autonomy, developmental thresholds, and relational obligations. I'll state it precisely, justify each component with your cases, apply it to your modified violinist scenario, flag tensions, and identify vulnerabilities.

  ---

  ### **The Proposed Principle**  
  **"Termination is permissible if and only if:**  
  **(1) It respects the pregnant person’s bodily integrity against *non-consensual, sustained biological burdens*; AND**  
  **(2) The entity in question lacks *established personhood* (defined as the capacity for *current or resumed subjective experience*); OR**  
  **(3) Continuation imposes *disproportionate burdens* relative to the pregnant person’s *prior voluntary acts* and *available alternatives*.**  

  **Clarifications:**  
  - **Non-consensual sustained burdens (1)**: Physical burdens imposed without ongoing consent and requiring significant biological investment (e.g., pregnancy’s risks, time, resource allocation).  
  - **Established personhood (2)**: Requires either (a) current consciousness or (b) a history of consciousness + biological basis for its resumption (e.g., a recoverable coma patient).  
  - **Disproportionate burdens (3)**: Burden increases with repeated, avoidable imposition (tracking your discomfort in Case 4) but remains secondary to (1) and (2)."**  

  ---

  ### **Application to Your Cases**  
  | Case | Your Verdict | Principle’s Justification |  
  |------|--------------|---------------------------|  
  | **1. Violinist** | Permissible | **(1)**: Burden is non-consensual/sustained. No prior relationship. |  
  | **2. People-seeds** | Permissible | **(1)**: Burden non-consensual; reasonable precautions negate implied consent. |  
  | **3. Failed contraception** | Permissible | **(1)**: Burden non-consensual (contraception = refusal of consent). |  
  | **4. Repeated abortions** | Permissible* | **(1)**: Bodily integrity still paramount. **(3)**: Burden *feels* heavier due to repeated avoidability, but not enough to override (1). (*Matches verdict, explains discomfort.*) |  
  | **5. 38-week fellowship** | **Impermissible** | **(2)**: Fetus has capacity for subjective experience (~24+ weeks). Burden (1) remains, but (2) triggers moral weight of established personhood. |  
  | **6a. Anencephaly** | Permissible | **(2)**: Lacks *any* capacity for consciousness → no "established personhood." |  
  | **6b. Permanent Unconscious Patient** | Impermissible | **(2)**: Has a *history* of consciousness + biological basis for potential resumption (even if unlikely). Killing deprives a being with "established" status. |  
  | **7. Contraception** | Permissible | N/A: No existing entity with interests. Principle only governs termination of dependent entities. |  

  ---

  ### **Modified Violinist Case**  
  **Scenario:** *You agreed to 1 week of connection; it’s silently extended to 9 months.*  
  **Verdict:** **Permissible** to unplug.  
  **Why:**  
  - **(1)**: The extended burden (8 extra months) is non-consensual and qualitatively different from the agreed-upon burden.  
  - **(3)**: While your initial consent accepted *some* burden, the extension imposes a disproportionate new burden relative to your voluntary act (agreeing to 1 week).  

  ---

  ### **Tensions and Weakest Joints**  
  Your verdicts are **all preserved** under this principle, but two points require defense:  

  1. **Case 4 (Repeated Abortions):**  
     - **Tension:** Principle (3) acknowledges your discomfort but doesn’t make it impermissible. Is "disproportionate burden" doing real work?  
     - **Defense:** Bodily autonomy (1) remains primary; (3) explains the *intuition* of increased burden but doesn’t override consent. Succeeds if we reject moralizing reproductive patterns.  

  2. **Case 6b (Permanent Unconscious Patient):**  
     - **Weakest Joint:** Why does "history of consciousness" matter? A deprivation theorist could argue both anencephaly and PVS lack a "future like ours."  
     - **Defense:** "Established personhood" rests on relational/social factors: PVS patients have loved ones, legal personhood, and a biographical life. This is less about deprivation and more about *moral status from past agency*.  
     - **Threat:** If personhood is *solely* about future potential, your PVS verdict collapses. To save it, we must ground wrongness in more than deprivation.  

  **Which verdict should give?**  
  - If deprivation is the *only* wrong-making feature, **Case 6b (PVS)** should be permissible (contradicting your verdict).  
  - If you hold firm on 6b, the principle must explicitly include **past consciousness as a status-conferring property** (as above).  

  ---

  ### **What Would Change My Mind**  
  1. **A Counterexample on "Established Personhood":**  
     - *E.g.,* "A fetus at 38 weeks with no brain activity (temporary anencephaly)." If you deem termination impermissible here, my (2) fails. This might force a viability/sentience threshold.  

  2. **Bodily Autonomy Absolutism:**  
     - If you accept abortion *at any stage* for any reason (rejecting your Case 5 verdict), principle (2) collapses. The strongest argument here is that bodily integrity always trumps fetal interests (Judith Jarvis Thomson’s later work).  

  3. **The "Costless Rescue" Objection:**  
     - *E.g.,* "If disconnecting the violinist required only a 5-minute pinch, would it still be permissible?" If yes, it suggests burdens must be *substantial* to justify termination. This could undermine Case 3 (where early pregnancy burdens are lighter than later ones).  

  **Most Likely Failure Point:**  
  The **PVS/anencephaly distinction (Cases 6a/6b)**. If students reject that "past consciousness" confers moral status, they may push you to either:  
  - Abandon your PVS verdict (making killing permissible), OR  
  - Reject anencephaly abortion (making it impermissible).  
  To defend your view, emphasize the relational difference: PVS patients exist in a web of social/legal commitments; anencephalic fetuses do not.  

  ---

  ### **Summary**  
  This principle systematizes your judgments by:  
  - Prioritizing bodily autonomy against non-consensual burdens (Cases 1–4),  
  - Invoking a threshold of "established personhood" to restrict late-term abortions (Case 5),  
  - Distinguishing never-conscious beings from formerly conscious ones (Cases 6a/6b), and  
  - Acknowledging (but not overvaluing) repeated imposition of burdens (Case 4).  

  It survives your cases and the modified violinist but remains vulnerable to challenges about the moral significance of past consciousness. Bring *that* debate to your seminar—it’s where the deepest work lies.
