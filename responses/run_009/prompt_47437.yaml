prompt: |-
  I've been keeping a list of my gut calls about when a psych finding counts as "replicated" vs "dead" after a replication attempt, and I'd like to know if there's actually a principle under them or whether I'm just being inconsistent. Here's the list:

  Power pose: original effect was huge, replications mostly nothing, I call it dead, even though some of those replications were powered to detect the *original* effect size and so couldn't really have detected a true effect at half that size. Ego depletion: same story, dead. A pre-registered direct replication that finds the effect at p=0.048 with roughly the original effect size: replicated, obviously. A replication that comes out in the same direction, at about half the original effect size, p=0.06: I want to call that a partial success rather than a failure, even though I don't trust a p=0.048 original much to begin with, and I can feel that these two attitudes don't fit together. A study that "replicates" with a tiny effect that's statistically significant only because n=5000: somehow I don't count that as a replication at all, it feels like a different finding. A meta-analysis where the effect shrinks study by study toward zero: dead. A Bayesian reanalysis showing the evidence favors the null 3:1: doesn't move me even slightly, which is embarassing because I'm generally sympathetic to Bayesians. And a conceptual replication that finds a downstream consequence of the effect using a totally different manipulation: I count that in favor of the finding more than a direct replication from a mediocre lab, which everyone tells me is exactly backwards.

  My tentative principle is that I'm tracking "is the effect still big enough to care about in the original units" rather than "did p come in under .05". But that principle seems to say the n=5000 tiny-significant case counts as a replication, and I don't believe that. So either the principle needs surgery or some of my verdicts do. What's the cleanest principle that saves the most of these, which verdicts does it have to throw out, and what does it say about the case I genuinly can't place: huge original effect, replication run at 80% power for the original size, result comes in at exactly half the size with p=0.08, and the replication team had pre-registered a somewhat stricter exclusion rule than the original authors used?
reasoning: |-
  Okay, let me try to unpack this user's query. They've listed various scenarios where they judge whether a psychological finding is replicated or dead, but they feel inconsistent. The main issue seems to be reconciling their intuitive judgments with a coherent principle.

  First, looking at their examples. Power pose and ego depletion: huge original effects, replications show nothing. They call these dead. That makes sense because the original effect size was large, and if replications can't find it even with adequate power for the original size, it's probably not real. 

  Then there's the pre-registered replication with p=0.048 and original effect size—they count that as replicated. That's straightforward. But then the p=0.06 case with half the effect size—they consider it a partial success. But why? If they don't trust a p=0.048 original, why is p=0.06 partial? Maybe they're weighing the effect size more than the p-value here.

  The n=5000 case with a tiny significant effect—they don't count it as a replication. Their principle of "big enough to care about" would include this, but they reject it. So there's a conflict. Maybe statistical significance isn't enough; the effect has to be practically significant. But even then, why dismiss it entirely? Maybe they feel that tiny effects in huge samples don't replicate the original finding's impact.

  The meta-analysis shrinking to zero: dead. That aligns with the idea that the effect diminishes over time, possibly due to publication bias or p-hacking. 

  Bayesian reanalysis favoring null 3:1 doesn't sway them. They mention being sympathetic to Bayesians but not moved. This is interesting. Maybe they prioritize direct evidence over statistical reanalysis, or they need stronger Bayesian evidence (like 10:1) to change their mind.

  Conceptual replication vs. direct replication: They value the conceptual more if it's from a rigorous lab. Others say direct replications are more important, but they disagree. Here, the trust in the lab's rigor and the conceptual link might be key. They might be weighing the quality of methodology over the type of replication.

  Their tentative principle is about whether the effect is big enough to care about in original units. But the n=5000 case contradicts this. So where's the inconsistency? 

  Perhaps the unstated factor is the practical significance. The original power pose effect was large enough to be noticeable; a tiny effect in a huge sample isn't practically meaningful. So combining effect size with practical relevance might resolve the n=5000 issue. 

  For the Bayesian part, maybe they don't find 3:1 convincing enough. The standard might be too low. Or they prefer direct replication attempts over statistical methods.

  The conceptual replication being valued higher suggests they care about the effect's robustness across different contexts, especially when the methodology is solid. This might tie into the idea that if an effect is real, it should manifest in related outcomes, not just the exact same setup.

  The unresolved case: huge original effect, replication at 80% power for original size, half effect size, p=0.08, stricter exclusion criteria. Here, the stricter exclusion might have removed some true effects, leading to a smaller observed effect. With p=0.08, it's not significant, but close. The effect size halved, which is substantial. Given their other judgments, they might see this as partial success. But the stricter exclusion complicates things—maybe the original included noisy data, inflating the effect. So partial replication with a smaller effect, suggesting the original was overstated.

  Putting it all together: The core principle is practical significance weighted by methodological credibility. Effect size matters, but only if it's meaningful. Methodological rigor (pre-registration, good labs) builds trust. Tiny effects in huge samples aren't practically relevant. Bayesian factors need stronger evidence. Conceptual replications from good labs show broader applicability, adding credibility beyond a single direct rep. 

  This would mean adjusting the n=5000 verdict to "replicated but trivial," which might align better. For the Bayesian case, they might need to accept that 3:1 isn't strong enough, or acknowledge that direct evidence is more convincing. The unresolved case would be a partial replication with a smaller, but still meaningful effect, considering the stricter methods.
answer: |-
  I love this question because it cuts to the heart of the replication crisis and scientific intuition. You're wrestling with the messy reality of interpreting evidence. Your intuitions are *mostly* consistent with a modified "practical significance + methodological credibility" principle, but your verdict on the `n=5000` case is the outlier that needs adjustment. Here's the breakdown:

  **The Core Principle: Practical Significance Weighted by Methodological Credibility**

  Your judgments prioritize:
  1.  **Practical Meaningfulness:** Is the observed effect size (especially in replications) large enough to be theoretically or practically interesting **in the original context or units**? (This explains Power Pose, Ego Depletion, p=0.06 partial, n=5000 skepticism, meta-analysis).
  2.  **Methodological Credibility:** How much trust do you place in the *methods* generating the result? (This explains your trust in the p=0.048 preregistration, skepticism of p=0.048 original, and preference for the conceptual replication from a strong lab).

  **Applying the Principle to Your Cases:**

  | **Case** | **Your Verdict** | **Principle's Verdict** | **Alignment** | **Reasoning** |
  |----------|------------------|-------------------------|---------------|---------------|
  | **Power Pose/Ego Depletion** | Dead | Dead | ✓ | Huge original effect vanished. Replications powered for original size found nothing, indicating practical insignificance. |
  | **Prereg p=0.048, ~orig ES** | Replicated | Replicated | ✓ | Original effect size reproduced with high methodological credibility (prereg). |
  | **Same dir, ~half ES, p=0.06** | Partial Success | Partial Success | ✓ | Practical significance reduced but not zero. Directional consistency + non-trivial ES > statistical non-significance here. |
  | **Tiny sig effect (n=5000)** | Not Replication | **Replicated but Trivial** | ✗ (Needs adjustment) | ES is practically meaningless. *Statistically* replicated, but fails the practical significance criterion. |
  | **Meta-analysis shrinks to zero** | Dead | Dead | ✓ | Cumulative evidence shows effect decaying to practical/predictive insignificance. |
  | **Bayes Factor 3:1 for H0** | Unmoved | Context-dependent | ~ | 3:1 is weak evidence ("anecdotal"). Methodological critique often trumps weak statistical reanalysis. |
  | **Conceptual rep (strong lab) > Direct rep (mediocre lab)** | Favors Conceptual | Favors Conceptual | ✓ | Methodological credibility (strong lab) + evidence of a *robust* phenomenon (manifests downstream) outweighs a single potentially noisy direct rep. |

  **Analysis of Conflicts & Required Adjustments:**

  1.  **The `n=5000` Tiny Effect Case:** This is where your intuition clashes with your stated principle *and* needs refinement. The principle says "big enough to care about." You *don't* care about this tiny effect. **Therefore, your verdict should be: "Statistically replicated, but practically trivial/dead."** This resolves the conflict. It's a replication *technically* (same effect exists), but it fails the practical significance test so completely that it renders the original claim (which implied a meaningful effect) dead. You're rejecting the *meaningfulness*, not the statistical existence.

  2.  **The Bayesian BF=3 Case:** Your lack of movement is consistent. 3:1 BF for H0 is weak evidence ("anecdotal" by common standards). It doesn't strongly overcome prior beliefs or methodological concerns. Your principle emphasizes *practical* significance and *methodological* trust; a weak statistical reanalysis doesn't address either strongly. If it was BF=10 or 30, you might feel differently.

  3.  **Why Conceptual > Direct (Mediocre Lab):** This is sound under the principle. A rigorous conceptual rep from a top lab provides:
      *   **High Methodological Credibility:** You trust their process.
      *   **Evidence of a Robust Phenomenon:** If the effect manifests in a different way, it suggests a deeper, more generalizable truth, not just a fragile, context-dependent trick. A direct rep from a mediocre lab has lower credibility; if it fails, you suspect their methods; if it succeeds, you're less convinced than by the strong lab's conceptual finding.

  **Resolving the Ambiguous Case:**

  *   **Case:** Huge original ES. Replication: 80% power for *original* ES, finds *half* the ES, p=0.08. Preregistered stricter exclusions.
  *   **Principle's Verdict: Partial Replication / Highly Suggestive, Leaning Alive (but smaller).**
      *   **Practical Significance:** Half the original huge effect might *still* be practically meaningful. It hasn't vanished like Power Pose. This keeps it "alive" in a diminished form.
      *   **Effect Size & Power:** Finding half the ES with 80% power for the *original* ES means the replication was *underpowered* to detect the *true* effect size it actually found (half the original). p=0.08 is entirely expected in this scenario – it's **not** a clear failure. It's consistent with a real, but smaller, effect.
      *   **Methodological Credibility (Stricter Exclusions):** This is key. Stricter exclusions likely reduced noise *and* potentially removed some true signal. This *explains* the smaller observed ES. It suggests the original ES was inflated by laxer exclusion criteria. The replication, being more methodologically rigorous, gives a better estimate of the true, smaller effect.
      *   **Conclusion:** The core effect likely exists, but the original study overstated its size due to methodological flaws. The replication, while statistically non-significant at p<.05, provides credible evidence for a smaller-but-still-potentially-meaningful effect. It's a "partial success" that updates our belief *downward* but not to zero. **Call it "replicated with a smaller effect size" or "partially replicated."**

  **The Cleanest Principle:**

  > **"An effect is replicated if credible evidence demonstrates it exists at a magnitude that is practically significant within its original context or demonstrates broader robustness, while acknowledging that improved methodology may yield more accurate (often smaller) effect size estimates."**

  **What it saves:** Almost all your intuitions (Power Pose dead, p=0.048 rep good, p=0.06 partial, meta dead, conceptual rep valued, ambiguous case partial). It reframes the `n=5000` case from "not replicated" to "trivially replicated," aligning with your intuition of meaninglessness. It explains the Bayesian indifference (weak evidence).

  **What it requires you to adjust:** Your `n=5000` verdict needs nuance – acknowledge the statistical replication but dismiss it on practical grounds. Embrace the idea that a rigorous replication finding a smaller effect (like your ambiguous case) is often *more* credible evidence for a real, but less dramatic, phenomenon than the original inflated claim. Your instincts are good; this principle just refines and formalizes them.
