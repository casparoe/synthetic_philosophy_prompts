  First, I need to structure the document exactly as requested: (1) common ground, (2) disagreements table, (3) cruxes with testable predictions, and (4) identification of verbal disputes. The tone must be rigorously neutral - no implied victory for either side. 

  For the common ground section, I'll focus on undisputed technical achievements: steering capabilities, predictive power, and computational localization. The "discovery vs construction" criteria should stay operational - reproducibility, robustness, and predictive validity. These are safe because both sides accept them as meaningful benchmarks.

  The disagreements table is trickiest. For realism, I need to capture their core belief in pre-existing features without overclaiming. Words like "causally active prior to intervention" and "approximately isomorphic" should resonate with them. For deflationism, phrases like "carving imposed by our tools" and "category mistake" must feel authentically theirs. Each point needs parallel structure for fairness.

  The cruxes section is where progress can happen. I'm proposing three concrete tests: feature convergence across training runs (Realists predict yes, Deflationists no), cross-architectural recurrence (Realists yes, Deflationists limited), and generalization of interventions (both agree it's evidence but differ on interpretation). Crucially, each test has pre-registered predictions from both sides.

  Ah, the verbal dispute - I spot it in the "really has" language. The reformulation to "which decomposition best satisfies operational criteria" should satisfy Deflationists while giving Realists the objectivity they crave. This might be the most useful part.

  Throughout, I'm avoiding any suggestion that one view is "correct." The document's power comes from forcing both sides to articulate testable claims. If they sign this, the retreat arguments will at least be productive.

  Notable omissions: I'm not touching consciousness or quantum interpretations of superposition. Too speculative. Keeping everything grounded in what SAEs demonstrably do today. The appendix on methodology could prevent future disputes over training details.

  This might actually work because it gives both sides what they secretly want: Realists get their ontological questions taken seriously as empirical claims, Deflationists get operational rigor. And the pre-registered tests could settle parts of the debate within months.
answer: |-
  ## Joint Statement on Sparse Autoencoder Interpretability

  **Prepared by:** [Your Name/Team Liaison]  
  **Date:** [Date]  
  **Purpose:** To clarify areas of agreement and disagreement regarding the ontological status of features identified by sparse autoencoders (SAEs) in language models, and to define empirical paths forward.

  ### 1. Shared Ground: What We Agree On

  We affirm the following demonstrated capabilities of our SAE-based interpretability methods:

  1.  **Behavior Steering:** Activating or suppressing identified features (directions) *reliably alters* model outputs in human-predictable ways across diverse inputs.
  2.  **Predictive Utility:** Feature activations significantly improve linear probes for predicting model outputs (e.g., next-token logits, intermediate layer outputs) compared to baselines.
  3.  **Computational Localization:** Features often correlate strongly with specific, narrow model behaviors or input attributes (e.g., presence of code, mention of a city, syntactic structures).
  4.  **Operational Criteria for "Discovery":** For a feature decomposition to be considered "discovered" (i.e., revealing a pre-existing structure) rather than merely "constructed" (a useful but imposed decomposition), it must demonstrably satisfy:
      *   **Reproducibility:** Features robustly re-emerge across independent SAE training runs *on the same model* under standardized conditions (architecture, hyperparameters, data).
      *   **Robustness:** Features are stable across minor variations in SAE architecture, loss function weighting, and training data batches.
      *   **Predictive & Causal Validity:** Features exhibit strong generalization - interventions based on features identified on one dataset reliably steer *held-out* or *novel* behaviors consistent with the feature's interpretation.

  ### 2. Disagreements: Stated Positions

  The table below summarizes the core disagreements. Each side affirms the wording of their own position.

  | Point of Disagreement                     | Realist Position                                                                                             | Deflationist Position                                                                                                     |
  | :---------------------------------------- | :----------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------ |
  | **1. Fact of the Matter (Correct Decomposition):** | There exists a unique, approximately correct decomposition of the model's internal representations into human-interpretable features, which SAEs can (imperfectly) approximate. | There is no single "correct" decomposition inherent to the model; SAEs produce *one useful carving* among many possible equivalently predictive/computational decompositions. |
  | **2. Causality & Pre-existence:**         | Successful steering via a SAE-identified feature demonstrates that this feature (or a close correlate) was *causally active prior to intervention* within the model's normal computation. | Steering demonstrates a *causal pathway* we can exploit, but does not prove the specific abstract feature *as defined by the SAE* was the precise causal entity operating beforehand. |
  | **3. Literal Truth of "Represents X":**   | It is literally true that the model represents specific concepts (X) in its activations, and SAEs can identify directions approximating these representations. | Attributing "representation of X" is a useful heuristic description of the model's input-output function and our interventions, but is not literally true of the underlying mathematics; it's a description of *what the activation pattern does*, not *what it intrinsically is*. |

  ### 3. Cruxes: Key Sub-Questions & Testable Predictions

  We identify the following empirical questions as crucial to resolving our disagreement. **Both sides agree that the proposed observations/test outcomes bear directly on the crux.** Predictions are stated in advance.

  | Crux                                                                 | Concrete Test / Observation                                                                                                                          | Realist Prediction                                                                 | Deflationist Prediction                                                                                                |
  | :------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------- |
  | **C1: Convergence of Independent Decompositions (Same Model):**      | Train &gt;5 SAEs (varying random seeds, minor arch. tweaks) *on the same model/layer*. Quantify pairwise similarity (e.g., max activation correlation, matched features) of learned dictionaries. | High similarity. Features reliably cluster; a core set of highly similar features emerges across runs. | Moderate similarity at best. Features cluster loosely; significant variation in the *specific* features found persists across runs. |
  | **C2: Recurrence Across Architectures (Similar Data):**              | Train SAEs on *different model architectures* (e.g., different sizes, families like GPT-2 vs. Mamba) trained on similar web-scale corpora. Quantify cross-architectural feature similarity (e.g., via transfer probes, intervention generalization). | Significant recurrence. Features interpreted as the same concept (e.g., "Python code", "Paris") will show functional similarity and allow cross-model steering. | Limited recurrence. Features will be largely architecture-specific; steering interventions will not generalize robustly across architectures. |
  | **C3: Generality of Causal Intervention:**                           | Define a feature F via SAE on Model A using Dataset D1. Design an intervention (suppress/amplify F) to induce behavior B. Test if this *exact intervention* (same direction coefficients) reliably induces B on: (a) *Held-out inputs* from D1's domain, (b) *Inputs requiring novel combinations* of F with other features, (c) *Inputs from a qualitatively different domain* (D2). | High success on (a) & (b), Moderate success on (c). Demonstrates F captures a general, pre-existing causal factor. | Success on (a), Variable success on (b), Failure on (c). Demonstrates F is contextually bound to the training distribution/SAE construction. |

  ### 4. Verbal Dispute & Reformulation

  We judge the core dispute over whether features are "already present" or "imposed by us" to **partially hinge on a verbal disagreement concerning the phrase "really has".**

  *   **The Issue:** "Really has" conflates ontological existence within the mathematical object (the model's parameter/activation space) with our *interpretation* of that object using human concepts (X). Realists focus on the former, Deflationists on the latter.
  *   **Reformulation:** We propose replacing "Does the model *really have* feature X?" with the operational question: **"Does the decomposition identified by the SAE robustly satisfy the criteria of Reproducibility, Robustness, and Predictive & Causal Validity (as defined in Section 1.4), such that it provides the most parsimonious and predictive account of the model's internal causal structure relevant to its input-output behavior?"**
      *   This shifts the focus to empirically verifiable properties of the *decomposition method and its results* relative to the model's behavior, avoiding metaphysical claims about the model's intrinsic ontology while preserving the core question of whether the SAE reveals something fundamental versus being merely one arbitrary projection.

  ---

  **Signatories (Pending Review & Agreement):**

  [Realist Camp Lead Name(s)]
  [Deflationist Camp Lead Name(s)]

  ---

  **Appendix (Optional - For Internal Use):** Proposed standardized protocols for SAE training, similarity metrics, intervention tests, and datasets (D1, D2) for Crux C3.
