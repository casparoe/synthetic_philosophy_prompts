  Okay, let me start by unpacking the user's question. They're confused about pragmatic encroachment versus epistemic contextualism, especially whether stakes affect credences or just knowledge attributions. They mention concerns about double-counting in Bayesian terms and potential rationality violations.

  First, I need to clarify the core difference between the two theories. Contextualism treats "knows" as context-sensitive, shifting based on conversational standards. Pragmatic encroachment ties knowledge directly to practical stakes. The user is worried that if stakes affect credences, it might lead to irrationality in a Bayesian framework.

  The user's background seems solid—they reference LessWrong, proper scoring rules, Dutch books. They're likely familiar with Bayesian epistemology but maybe less so with analytic philosophy nuances. Their confusion is whether encroachment implies credences should change with stakes, which would be problematic for rationality constraints.

  They also question if the examples used (bank cases vs. airport cases) are just sociological artifacts. Their friend's point about indexicality vs. univocality is a good start, but I should confirm if that's the standard view. 

  The key is to emphasize that encroachment doesn't require credence shifts. Most proponents keep credences fixed and let practical stakes affect the justification threshold for knowledge. This avoids the double-counting issue. Explaining that knowledge and credence are distinct concepts here is crucial.

  Regarding rationality constraints: if an agent's credences shifted with stakes, they'd likely violate scoring rules. Fixed evidence should lead to fixed credences. The user's intuition here is correct. So encroachment, properly understood, doesn't threaten Bayesian rationality.

  I should also address whether contextualism and encroachment are compatible. They can be, as some versions of contextualism incorporate stakes into context. The user's suspicion that the difference might be PR is partly right, but there are nuanced distinctions in the literature.

  Finally, the bonus question about rationality violations needs a clear answer: yes, stakes-dependent credences would lead to Dutch books and poor scoring, which Bayesianism forbids. This reinforces that encroachment is about knowledge attribution, not credence formation.
answer: |-
  Let's cut through the confusion. You've hit on a core tension in epistemology, and your Bayesian worries are spot-on. Here's the breakdown:

  ### 1. **Pragmatic Encroachment (PE) vs. Epistemic Contextualism (EC): Core Difference**
     - **Epistemic Contextualism (EC):** "Knows" is an *indexical* term. Its truth-conditions depend on the **conversational context** of the *attributor* (the person saying "S knows that p").  
       *Example:* In a casual chat ("low standards" context), you truthfully say "I know the bank is open Saturday." In a high-stakes planning session ("high standards" context), you truthfully say "I don't know it's open." The *facts about S's evidence* haven't changed—only the standard for "knowledge" demanded by the conversation.  
       *Key Point:* "Knows" works like "tall" or "here." Two speakers in different contexts can both speak truly while one says "S knows p" and the other says "S doesn't know p" – even if S's situation is identical. This is **attributor-context dependence**.

     - **Pragmatic Encroachment (PE):** Whether S *knows* p depends partly on **S's practical stakes**. High stakes raise the *epistemic standard* S must meet to count as knowing.  
       *Example:* With the same evidence (e.g., past visits), S *knows* the bank is open Saturday when misplacing a check is low-cost. S *doesn't know* when missing a deposit means bankruptcy. The stakes directly affect the **truth-condition for S's knowledge** itself.  
       *Key Point:* "Knows" is *univocal* (not indexical), but its application depends on the *subject's* practical situation. This is **subject-stakes dependence**.

     **Are they competing?** Yes and no:
     - **Competing:** They offer different *mechanisms* for why knowledge attributions vary: EC points to the *speaker's* context, PE to the *subject's* stakes. EC treats "knows" as context-sensitive language; PE treats it as stakes-sensitive metaphysics.
     - **Compatible?** Hybrid views exist (e.g., "Stakes-Contextualism"), but pure versions are rivals. EC can *absorb* stakes by making them part of "context," but PE proponents argue stakes directly affect knowledge *without* linguistic indexicality.

  ### 2. **Your Credence Worry: Does PE Require Credences to Shift?**
     **Absolutely not.** This is crucial:
     - **Standard PE (e.g., Fantl & McGrath, Stanley):** Stakes affect the **threshold of justification/evidence required for knowledge**, **not** your rational credence in *p*.  
       - *Your credence in p* (e.g., "My friend owns a Ford") is fixed by your evidence. A calibrated Bayesian's credence *should not budge* when stakes rise.  
       - *Knowledge* requires not just high credence, but that your credence meets a contextually/stakes-sensitive **epistemic standard**. High stakes raise the bar: you might need 99.9% credence instead of 95% to "know."
     - **Why this avoids double-counting:**  
       - **Decision Layer:** You use your *fixed* credence + **utility function** (which incorporates stakes) to maximize expected utility.  
       - **Knowledge Layer:** High stakes demand *more evidence* (higher credence) for the same belief to qualify as "knowledge."  
       - **No conflict:** Your credence (e.g., 0.95) remains rationally grounded in evidence. In low stakes, 0.95 suffices for knowledge and rational action. In high stakes, 0.95 is *still your rational credence*, but it no longer suffices for *knowledge*, and your decision theory (using that same 0.95) will likely forbid betting your life.

     **The Mistake to Avoid:** PE is **not** the claim that stakes magically alter your evidence or rational credence. It's that knowledge isn't *just* about credence + truth; it's about whether that credence is *good enough* given the practical consequences of being wrong.

  ### 3. **Would Stakes-Shifting Credences Be Irrational? YES**
     If an agent's *credence in p* literally decreased solely because the cost of being wrong about *p* increased (holding evidence fixed), they would violate core Bayesian norms:
     - **Scoring Rules:** Proper scoring rules (e.g., Brier score) penalize credences not proportioned to evidence. Stakes-shifting credences would yield **worse scores** than evidence-based credences.
     - **Dutch Books:** A bookie could exploit this agent:  
       1. When stakes are low, the agent has high credence (e.g., 0.95) in *p*. Sell them a bet on *p* at 0.94.  
       2. Artificially inflate stakes (e.g., threaten them if *p* is false). Their credence drops (e.g., to 0.80). Buy back a bet on *p* at 0.81.  
       If *p* is true, they lose money on the net transaction. If *p* is false, they lose even more. **Dutch Book vulnerability confirmed.**
     - **Conditionalization Violation:** No Bayesian update rule lets costs directly alter credences. Evidence alone updates credence via conditionalization.

     **Conclusion:** Any version of PE requiring stakes to alter *rational credence* is epistemically bankrupt. Serious PE proponents avoid this.

  ### 4. **Knowledge vs. Credence: The Crucial Divide**
     PE relies on this distinction:
     - **Credence:** Degree of belief, governed by evidence alone (Bayesian norms). *Fixed by evidence.*
     - **Knowledge:** A categorical state (yes/no) requiring:
       - Truth of *p*
       - Belief that *p*
       - Justification (which meets a stakes-sensitive standard).
     PE argues that the **justification condition** is practical-stakes-sensitive. Your 0.95 credence might be maximally rational given your evidence, but if you need 0.999 to "know" in high stakes, you don't know. **Knowledge and rational credence come apart.**

  ### 5. **The "Sociological Accident" of Examples**
     Your suspicion is insightful. The examples *are* partly artifacts of philosophical history:
     - **Contextualism** (DeRose, Lewis) arose responding to *skepticism* using conversational dynamics (bank cases, skeptical scenarios).
     - **Encroachment** (Fantl & McGrath, Stanley) arose emphasizing *practical rationality* using life-and-death stakes (airport cases, betting your life).
     **But the contrast isn't arbitrary:**  
     - EC examples explicitly vary the *speaker's* context (e.g., skeptical scenarios raised in conversation).  
     - PE examples explicitly vary the *subject's* practical situation (e.g., S faces ruin if wrong).  
     The examples highlight the *proposed mechanism* (attributor context vs. subject stakes).

  ### Bottom Line
  - **PE ≠ Credence Shifting:** Serious PE keeps credences evidence-based. Stakes raise the *justification threshold for knowledge*.  
  - **PE vs. EC:** PE ties knowledge to the *subject's* stakes; EC ties it to the *attributor's* conversational context. They are distinct (though combinable) theories.  
  - **Rationality Safeguard:** An agent whose credences shift with stakes would be Dutch-bookable and score poorly. PE, properly understood, avoids this by separating credence (evidence-driven) from knowledge (stakes-sensitive standard).  
  - **Your Friend's Take:** Largely correct! EC makes "knows" indexical (like "tall"), varying truth-value by speaker context. PE keeps "knows" univocal but stakes-sensitive for the subject. That *is* the consensus carve-up.

  **In essence:** Pragmatic encroachment isn't about messing with Bayesian credences. It's about saying that whether your rock-solid, evidence-based credence counts as *knowledge* depends on what's at stake if you're wrong. The decision layer uses the credence; the knowledge layer gatekeeps based on stakes. No double-counting, no Dutch books.
