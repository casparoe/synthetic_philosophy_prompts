prompt: |-
  I run a meetup for working programmers who like math stuff on the side — think people who know what a hash set is, took discrete math once, but no logic background. Next month I've got 30 minutes on Russell's paradox, and I keep flip-flopping on how to teach it, so plan it for me insted of explaining it.

  The trap I keep falling into is that the paradox lands as a cute gotcha ("the set of all sets that don't contain themselves, haha, boom") and then everyone nods and no one has actually understood what broke. What I want is for them to walk out understanding that naive comprehension wasn't some careless mistake but the most natural thought in the world — "any property, collect the things with that property" — and that Russell's move is a general technique for finding load-bearing walls in a theory, not just a party trick about sets.

  So what I need from you: what has to be in place before I even show them the paradox, what the carrying example should be (I'm suspicious of the barber version — feels like it lets them think this is about self-reference in language rather than about what sets are allowed to exist, but tell me if that instinct is wrong), which misconceptions they'll form and where exactly in the sequence to head each one off, and one check question at the end that separates "enjoyed the gotcha" from "actually understood."

  One more thing I want woven in somewhere: I keep hearing people draw the analogy to the halting problem and Gödel, and I suspect it's doing real teaching work but also smuggling in confusions — self-reference and diagonalization and the-limits-of-formalism all mushed into one vague vibe of "systems can't know themselves." Where in the arc does the analogy belong, and what does the mushed version look like so I can recognize it coming?

  Keep the whole plan under 600 words — one page I can actually hold during the talk. And be blunt about what I should flat-out refuse to cover in 30 minutes and just say so.
