  The core tension they've identified is brilliant: Hardin uses the lifeboat as a metaphor for resource distribution between groups (nations/classes), while the historical cases are about micro-ethics within an already-formed group under existential threat. That's not a minor difference - it's foundational. I should flag this upfront as they requested, but then show how examining the disjunction itself yields insights.

  On their specific questions: The admission-versus-consumption reversal is crucial. Hardin's rhetorical power absolutely relies on blurring this, but interestingly, his brief mention of internal triage suggests he sensed the analogy might collapse if pressed. The lottery question is ethically rich - the difference between procedural fairness (Essex) and utilitarian selection (Mignonette) reveals how consensus mechanisms can alter moral perception, even if consent was compromised in both cases. 

  The "custom of the sea" point is particularly astute. Maritime lot-drawing was indeed a fascinating emergent norm - a pre-commitment device for when rational deliberation becomes impossible. This directly contradicts Hardin's exclusionary premise by showing insiders adopting equality-of-risk. 

