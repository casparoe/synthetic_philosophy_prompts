answer: |-
  Your question reveals a profound tension: Hardin's "lifeboat ethics" and the historical lifeboat cases engage with fundamentally distinct ethical problems, despite sharing a potent metaphor. The core disjunction lies in **scale and relationship**: Hardin uses the lifeboat to model macro-distribution between *groups* (nations/classes), while Essex and Mignonette involve micro-triage among *individuals* bound by pre-existing solidarity within a closed group. Forcing unity obscures more than it reveals. Let's analyze the disjunction through your queries:

  1.  **The Mapping Reversal & Metaphor's Force:**
      *   **Hardin's Core:** Admission/swimmers represent *outsiders* competing for scarce resources of the *insider group* (rich nations). The threat is *swamping* – collapse from external overload. Consumption is an afterthought, briefly acknowledged but not central.
      *   **Historical Cases:** Consumption involves *insiders* – crew bound by shared risk, duty, and (initially) mutual commitment. There *are* no "swimmers"; the threat is *internal depletion* – starvation consuming the group itself.
      *   **Rhetorical Blurring:** Hardin's metaphor *absolutely depends* on blurring this. The visceral horror of consumption (cannibalism) is implicitly transferred onto the admission dilemma, making exclusion seem tragically necessary. Yet his *solution* (harsh exclusion) addresses a problem (mass admission) absent in the historical cases, while his peripheral question (internal consumption) is *their* central horror. The metaphor's power is parasitic on this slippage, making macro-exclusion feel like the tragic necessity of micro-triage, when they are logically separate.

  2.  **The Lottery & Moral Transformation:**
      *   **Procedural Fairness vs. Utilitarian Selection:** The lottery (Essex) introduces an impartial procedure, distributing risk equally *within* the group. Selection based on weakness/status (Mignonette) prioritizes group survival efficiency. The moral difference is significant:
          *   **Grounds for Permissibility?** The lottery arguably transforms the act *within the context of the group*. It mitigates (but doesn't erase) the violation of autonomy and murder through:
              *   ***Manufactured Consent (Hypothetical):*** Participants accept the *procedure* beforehand, knowing it applies equally.
              *   ***Procedural Fairness:*** Eliminates bias, favoritism, or targeting the vulnerable *by design*. No one can claim undeserved victimhood *based on the process*.
              *   ***Shared Sacrifice:*** Embodies an egalitarian norm under extreme duress, acknowledging all have an equal stake and risk.
          *   **Compromised Consent:** Both cases involve compromised consent (Coffin’s youth/Parker’s coma). The lottery doesn't *solve* the consent problem; it attempts to *distribute the burden of its violation fairly* within the group *before* incapacity strikes. Parker’s selection lacked even this procedural shield.

  3.  **The Custom of the Sea & Emergent Norms:**
      *   **Contractarianism in Extremis:** The maritime custom of drawing lots *is* an emergent, contractarian norm. Facing repeated, predictable existential threats, sailors developed a pre-commitment strategy: a fair procedure to resolve the unresolvable, minimizing conflict and preserving a shred of order/equality when all else fails. It’s a norm of *equal chance* under shared doom.
      *   **Contrast with Hardin:** This norm is the *antithesis* of Hardin's lifeboat ethics. Hardin prescribes *exclusion* based on group identity/capacity (nation/class). The maritime custom prescribes *inclusive, equal risk-sharing* among those *already in the boat*. It reinforces the insider/outsider divide but governs the *insiders* with radical equality, whereas Hardin focuses on excluding outsiders to preserve insider privilege, showing little concern for fairness *among* the saved.

  4.  **The Verdict (Dudley) & Necessity:**
      *   **Reinforcing Hardin? Superficially No, Profoundly Maybe:** The *Dudley* verdict explicitly rejects "necessity" as a defense for killing an *insider* (Parker). This directly contradicts any notion that Hardin's *internal* triage (killing to eat) could be justified by his logic. Legally, even extreme scarcity doesn't permit murdering one's companions.
      *   **The Irony:** However, the verdict *implicitly reinforces* Hardin's *external* exclusion logic. By refusing to sanction the killing of an insider even for group survival, the court affirms an absolute barrier protecting those *already in the boat* from being sacrificed. This parallels Hardin's insistence on protecting the "boat" (rich nations) from external threats (swimmers), even if the *means* (exclusion vs. prohibition on killing) differ. The shared premise is that those "inside" possess a fundamental claim to protection that cannot be overridden by the needs/demands of others, whether those others are drowning swimmers or starving crewmates. The court protects Parker *as* an insider; Hardin wants to protect insiders *from* outsiders.

  5.  **Where Lifeboat Ethics Runs Silent:**
      Hardin's framework is ill-equipped for the messy human reality of historical lifeboat ethics:
      *   **The Weight of Participation & Complicity:** Brooks’ non-participation in killing Parker matters immensely to our moral judgment of *him*. Hardin's impersonal, group-level calculus ("the boat must survive") ignores individual agency, culpability, and the psychological/spiritual burden of acting or refusing to act. Did Brooks *consent*? Did he resist? These nuances are invisible to lifeboat ethics.
      *   **Judging Desperation from Comfort:** Lifeboat ethics assumes rational actors making calculated choices. It provides no apparatus for understanding actions chosen under starvation, dehydration, terror, and the breakdown of reason and social norms. Judging Dudley's act by courtroom standards formed in safety seems grotesquely inadequate, yet Hardin offers no alternative frame for evaluating choices made in true extremity beyond crude survival metrics.
      *   **Solidarity, Betrayal, and Moral Residue:** The cases are steeped in the trauma of broken bonds – the betrayal of feeding on one's shipmate. Hardin's focus on resource competition ignores the profound moral injury inflicted upon the survivors and the violation of pre-existing relationships of trust and mutual dependence. The "custom of the sea" emerges precisely to manage this trauma of betrayal through fairness.
      *   **The Aftermath:** Lifeboat ethics ends with survival. It cannot speak to the lifelong guilt of Pollard or Dudley, the societal condemnation or sympathy, the legal consequences, or the struggle to live with what was done. It treats survival as the sole good, ignoring the cost to the human soul.

  **Conclusion:**

  Your instinct is correct: Hardin's "lifeboat ethics" and the historical lifeboat cases are distinct projects using the same evocative image. Hardin leverages the metaphor's visceral power, derived from the horror of internal consumption (as seen in Essex/Mignonette), to argue for *external exclusion* on a societal scale. The historical cases expose the metaphor's limitations and internal contradictions. They reveal Hardin's silence on the ethics of triage *within* the group, the importance of procedure (like the lottery) for fairness among insiders, the absolute legal barrier against sacrificing insiders established in *Dudley*, and the profound human dimensions – complicity, trauma, judgment in extremis – that his cold calculus ignores. Analyzing the disjunction, rather than forcing unity, yields richer insights: Hardin’s metaphor borrows emotional force from one ethical realm (individual survival horror) to bolster an argument in a different realm (macro-resource distribution), while the actual historical practice of lifeboat ethics among insiders (the custom of the sea) embodies a principle of radical equality utterly foreign to Hardin's exclusionary vision. The lifeboat, as metaphor, proves both powerful and perilously unstable.
