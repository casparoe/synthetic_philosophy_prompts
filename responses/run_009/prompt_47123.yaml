answer: |-
  ### Essay Question  
  **Imagine the following scenario:** A graduate student has memorized every troubleshooting fact about an old mass spectrometer: error codes, manual procedures, and theoretical principles. Yet when the machine malfunctions, they cannot fix it and call a retired technician. The technician walks in, places a hand on the pump housing, listens intently, taps a component lightly, and repairs it. Later, we document every physical action the technician took (hand placement, listening duration, tap location/force) into a flawless step-by-step protocol. A new student follows this protocol exactly and successfully fixes the machine.  

  **Answer both parts:**  
  1. Did the new student acquire *knowledge-how* (practical skill) by following the protocol? Defend your answer using the *knowing-how* vs. *knowing-that* distinction.  
  2. Regardless of your answer to (1), evaluate this objection: "The protocol *proves* that all knowledge-how is just knowledge-that because every action was reduced to instructions (propositions). Any claim that something ‘unspoken’ remains leads to an infinite regress of interpretations."  

  **Requirements:**  
  - Avoid simply defining the distinction; apply it to the case.  
  - Engage the infinite regress argument and the intellectualist counterattack (that know-how is a form of know-that).  
  - Ground your analysis in concrete details from the scenario (e.g., hand placement, listening, tapping).  

  ---

  ### Model Answer (560 words)  

  **Part 1:** The new student did *not* fully acquire knowledge-how by following the protocol. Knowledge-how involves embodied, contextual skill — like the technician’s ability to *interpret* sensory cues (e.g., feeling vibrations or hearing subtle pump irregularities) and *adapt* actions to unstated conditions (e.g., ambient noise or machine temperature). The protocol captures *knowing-that*: propositional facts (e.g., "place hand here for 5 seconds," "tap with 2N force"). The student executes these instructions but lacks the technician’s ingrained judgment. For instance, if the pump’s hum were drowned out by lab noise, the technician might reposition their ear or adjust pressure based on intuition — responses not codified in the protocol. The student succeeds only because the scenario matches the protocol perfectly; they cannot improvise like the technician, showing they possess know-*that* (facts about actions) but not robust know-*how* (adaptive skill).  

  **Part 2:** The objection — that the protocol reduces know-how to know-that — is compelling but flawed. Intellectualists argue that if the protocol contains *all* relevant propositions (e.g., "listen until pitch drops by 50Hz"), then following it *is* know-how via know-that. Here, the student’s success seems to support this: they translated instructions into action without "extra" knowledge. This avoids an infinite regress where every skill requires prior skill to apply (e.g., "knowing how to follow rules" needing yet more rules).  

  However, the regress argument resurfaces when we ask: *How does the student apply the propositions?* The protocol might say "place hand on pump," but knowing *how* to place a hand (e.g., with correct pressure or angle) isn’t specified. If intellectualists claim this too is know-that (e.g., "exert 10N of force"), we demand *how* to interpret "10N," leading to endless propositions ("grip until sensor reads 10N," but *how* to read the sensor?). The technician avoids this by *embodied familiarity*: they feel "firm contact" without measuring force. Thus, the protocol only *mimics* know-how in ideal conditions.  

  The intellectualist counterattack also stumbles on tacit elements. The technician’s listening isn’t just "detecting sound" — it’s comparing it to a mental library of past failures, a holistic judgment hard to verbalize. Even a "perfect" protocol might miss contextual factors (e.g., "only tap if the room is below 25°C"). When the student follows instructions, they use know-*that* to replicate an outcome, but true know-*how* would let them diagnose *why* the tap worked or adjust if conditions change. The protocol captures *what* was done, not the technician’s *why* or *when*.  

  In sum: The student gained know-*that* (propositions about actions) but not know-*how* (contextual mastery). The intellectualist reduction fails because tacit judgment — essential to flexible skill — resists full propositional capture, and regress looms when reducing action to interpretation.  

  ---

  ### Marking Scheme (20 points total)  
  **A Answer (17–20 points) Must:**  
  - **Explain the distinction concretely (2 pts):** Contrasts know-how (technician’s adaptive, sensory skill) vs. know-that (student’s protocol-as-propositional-facts) using scenario details (e.g., "listening to pitch" as judgment vs. "protocol step").  
  - **Apply the regress argument (5 pts):** Argues that reducing know-how to know-that *requires* infinite steps (e.g., "knowing how to follow ‘place hand’ needs further rules").  
  - **Engage intellectualism seriously (5 pts):** Grants that the protocol *seems* to convert know-how to know-that (e.g., "student succeeded via propositions") but rebuts by exposing tacit gaps (e.g., "missing contextual judgment like temperature adaptation").  
  - **Analyze the case deeply (5 pts):** Uses specifics (hand placement, tapping) to show know-how’s irreducibility (e.g., "technician’s intuition vs. student’s rigid mimicry").  
  - **Clear conclusion (3 pts):** Takes a stance on both parts, synthesizing regress/intellectualism (e.g., "Protocol captures know-that but not know-how due to regress/tacit elements").  

  **B Answer (13–16 points) Typically:**  
  - Defines the distinction clearly but abstracts from the case.  
  - Mentions regress/intellectualism but doesn’t show *how* they clash (e.g., "Regress is a problem" without linking to protocol steps).  
  - Describes the scenario without probing tacit knowledge (e.g., "Technician has experience, student has instructions").  
  - Conclusion restates definitions without resolving the objection.  

  **Common Mistakes (per must-hit point):**  
  - **Distinction explanation (2 pts):** *Mistake*: Only labels "know-how = practical, know-that = theoretical" without scenario tie.  
  - **Regress application (5 pts):** *Mistake*: Defines regress but doesn’t trace it to protocol steps (e.g., no "how to follow ‘tap’ instruction" example).  
  - **Intellectualist engagement (5 pts):** *Mistake*: Dismisses reduction without addressing why the protocol *appears* successful.  
  - **Case analysis (5 pts):** *Mistake*: Treats actions abstractly (e.g., ignores "listening" as sensory skill).  
  - **Conclusion (3 pts):** *Mistake*: Abruptly ends after describing the scenario.  

  **Stopping at Definitions Caps at B (max 12/20):** Answers that define know-how/know-that and summarize the case without analyzing regress/intellectualism score ≤12.
