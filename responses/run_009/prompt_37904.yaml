  ### **Decision Procedure for Patient Taxonomy Changes**  
  *(To be completed in 90 minutes with clear stop/refer points)*  

  #### **Step 1: Mandatory Constraints Check**  
  - **Question:** *Is this change prohibited or required by law/federal reporting rules?*  
  - **Action:**  
    - **Yes (required):** Implement immediately. **Stop.**  
    - **Yes (prohibited):** Reject. **Stop.**  
    - **No:** Proceed to Step 2.  

  #### **Step 2: Purpose Validation**  
  - **Question:** *What specific, measurable problem does this solve?*  
    - Examples: "Patients refuse forms over missing options," "Clinicians misdiagnose due to vague categories," "Data gaps hinder care equity."  
  - **Action:**  
    - No clear problem articulated → **Reject.**  
    - Problem confirmed → Proceed to Step 3.  

  #### **Step 3: Nature of the Distinction**  
  - **Question:** *Is this distinction **descriptive** (reflecting pre-existing groups) or **constitutive** (creating new groups via classification)?*  
    - **Descriptive clues:** Widely used in clinical guidelines, public health data, or federal forms (e.g., splitting "Asian" due to CDC health disparity reports).  
    - **Constitutive clues:** New identity category with evolving social recognition (e.g., adding "nonbinary" where paperwork itself validates existence).  
  - **Action:**  
    - **Descriptive →** Require evidence of harm from *current* taxonomy (e.g., studies showing care errors). No evidence → **Reject.**  
    - **Constitutive →** **Defer to affected group.** Proceed to Step 4.  

  #### **Step 4: Affected Group Consultation (Constitutive ONLY)**  
  - **Question:** *Is there consensus from the people this category would classify?*  
  - **Action:**  
    - **Defer to affected group** via:  
      - Patient advisory boards,  
      - Surveys (min. 100 regional patients),  
      - Evidence from advocacy groups (e.g., ACLU for gender categories).  
    - No consensus (e.g., low survey response, conflicting input) → **Reject.**  
    - Consensus for change → Proceed to Step 5.  
    - *(Skip to Step 5 if descriptive.)*  

  #### **Step 5: Cost-Benefit Threshold**  
  - **Question:** *Do tangible benefits outweigh costs?*  
    - **Costs:** Vendor fees, staff training, system downtime (quantify in $/hours).  
    - **Benefits:** Improved care accuracy, patient retention, compliance risk reduction (quantify if possible).  
  - **Action:**  
    - Costs ≥ benefits → **Reject.**  
    - Benefits > costs → Proceed to Step 6.  

  #### **Step 6: Value Judgment Check**  
  - **Question:** *Does this require endorsing a contested social/political stance?*  
    - Examples: Defining biological vs. social gender, race as genetic vs. cultural.  
  - **Action:**  
    - **Yes → Hand off to ethics board or institutional leadership.** Committee does NOT decide.  
    - **No → Approve.**  

  ---

  ### **Example Evaluations**  
  #### 1. **Adding "nonbinary/X" to sex field**  
    - **Step 1:** Not prohibited (federal rules evolving; many systems allow "X"). → Proceed.  
    - **Step 2:** Solves patient distress/refusal and misgendering in care. → Proceed.  
    - **Step 3:** **Constitutive** (validates identity). → Defer to group.  
    - **Step 4:** 80%+ support in patient surveys; advocacy groups endorse. → Proceed.  
    - **Step 5:** Costs: $15k vendor fee. Benefits: Higher satisfaction (reduced turnover), aligns with AMA guidelines. → Benefits win.  
    - **Step 6:** Contested values (gender debates). → **Hand off to ethics board.**  

  #### 2. **Splitting "Asian" into ethnic subcategories**  
    - **Step 1:** Not prohibited (federal forms allow sub-aggregation). → Proceed.  
    - **Step 2:** Solves care gaps (e.g., diabetes risk varies South/East Asian). → Proceed.  
    - **Step 3:** **Descriptive** (CDC recognizes subgroups). Evidence: Local data shows misdiagnosis. → Proceed.  
    - **Step 4:** N/A (descriptive).  
    - **Step 5:** Costs: $20k + training. Benefits: Accurate screening, meets NIH research standards. → Benefits win.  
    - **Step 6:** Not a value judgment (clinical best practice). → **Approve.**  

  #### 3. **Adding "long COVID" flag**  
    - **Step 1:** Not prohibited. → Proceed.  
    - **Step 2:** Solves care coordination for chronic symptoms. → Proceed.  
    - **Step 3:** **Descriptive** (WHO/CDC recognize condition). Evidence: ER readmissions due to missing flag. → Proceed.  
    - **Step 4:** N/A.  
    - **Step 5:** Costs: $10k. Benefits: Faster treatment, avoids duplicate tests. → Benefits win.  
    - **Step 6:** Not contested. → **Approve.**  

  #### **Proposal the Proposer Will Hate: Adding "Fibromyalgia" as a distinct pain disorder**  
  *(Hypothetical example)*  
    - **Step 1:** Not prohibited. → Proceed.  
    - **Step 2:** Purpose: "Patients feel dismissed by 'chronic pain' label." → Proceed.  
    - **Step 3:** **Constitutive** (some experts dispute it as distinct; diagnosis shapes identity). → Defer to group.  
    - **Step 4:** Patient surveys split (40% want it; 40% fear stigma). → **Reject** (no consensus).  
    - *Why they hate it:* Valid patient concern, but procedure prioritizes evidence/consensus.  

  ---  
  **Procedure Output:** Approve/Reject/Defer/Higher-Authority.  
  **Time Saver:** Steps 1–3 kill weak proposals fast. Steps 4/6 prevent overreach.  
  **Blind Spot:** When societal values shift faster than evidence (e.g., new identity terms), the cost-benefit step may underestimate inclusion benefits.
