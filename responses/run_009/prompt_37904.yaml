prompt: |-
  I chair the data standards committee at a mid-size regional health system, and every few months we get a proposal to change our patient intake taxonomy -- add a category, split one, retire one. Recent live examples: adding "nonbinary" and an "X" option to the sex field, splitting our "Asian" race checkbox into finer-grained ethnic categories, and adding a "long COVID" flag to the problem list. Our vendor charges for each change and locks the schema for 18 months at a time, so changes are semi-irreversible in practice, and some fields we can't touch at all because federal reporting rules mandate their exact values.

  Here's my problem: I've read enough social construction stuff to believe these choices aren't neutral bookkeeping. Categories like race and gender seem to be partly constituted by the forms and records and reporting rules that institutions like ours maintain -- the kind exists partly because the paperwork carves the world that way -- and there's a looping effect where classifying people changes how they understand themselves, which changes the data, which changes the classification. But knowing that doesn't help me on a tuesday afternoon when a committee of clinicians and one IT guy has 90 minutes and a vote to take. I can't turn "constitutive rules" and "looping effects" into anything runnable.

  So: write me a decision procedure my committee can actually use on a proposed category change. It should lay out the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a no, where it requires deferring to the people who'd be classified by the category rather than deciding ourselves, and where it honestly hands off because the question is a value judgment no procedure can settle. Make sure the procedure distinguishes the cases where we're just describing a distinction that already exists out there from the cases where adopting the category would help create the group it names, since those seem to demand different justifications. It has to fit on two pages and be followable by someone who will glaze over at the word "ontological."

  Then run it on the three proposals above, including at least one where the procedure gives an answer the proposer is going to hate. And lead with your bottom line -- one sentence up front on what this procedure is actually good for and where its biggest blind spot is -- before the reasoning, no preamble, no restating what I asked for.
reasoning: |-
  We are creating a decision procedure for evaluating proposed changes to patient intake taxonomy. The procedure must be practical, fit on two pages, and avoid jargon. It should guide the committee through a series of questions, with clear stopping points and indications for when to defer to the affected group or when the issue is a value judgment.

  The procedure will be structured as a flowchart of questions. We'll have 5 main steps:

  1. **Check Constraints**: Are there external constraints (like federal reporting) that force our hand? If yes, we follow them and stop. If no, proceed.

  2. **Clarify the Purpose**: Why is this change being proposed? We need to know the problem it solves. If no clear purpose, reject.

  3. **Assess the Nature of the Distinction**:
     - Is this distinction primarily descriptive (reflecting an existing reality) or constitutive (creating a new reality through classification)?
     - For descriptive: We require evidence that the distinction is already widely recognized and used in relevant contexts (e.g., medical, social) and that the existing category is causing harm or inefficiency by not capturing it.
     - For constitutive: We must defer to the group that would be classified. We require evidence of a significant group self-identifying with the proposed category and experiencing harm without it.

  4. **Evaluate Impact**:
     - What are the costs (vendor charges, implementation, training, etc.)?
     - What are the benefits (improved care, patient satisfaction, data quality, etc.)?
     - If costs outweigh benefits, reject.

  5. **Value Judgment Check**: If the proposal involves a contested social or ethical issue that the committee is not equipped to decide, we must acknowledge it and either defer to higher institutional authority or to the affected group.

  We'll also note that if at any step the answer leads to rejection, we stop.

  Now, let's write the procedure in a concise, numbered list that can fit on two pages. We'll use plain language.

  ---

  **Decision Procedure for Proposed Taxonomy Changes**

  **Step 1: Check Constraints**
     - Question: Are we required by law, regulation, or binding policy (e.g., federal reporting rules) to make or avoid this change?
       - Yes: Implement as required or abandon if prohibited. **Stop.**
       - No: Proceed to Step 2.

  **Step 2: Clarify the Purpose**
     - Question: What specific problem does this change solve? (E.g., improves care, meets patient needs, fixes data gaps, addresses discrimination.)
       - If no clear problem is articulated: Reject. **Stop.**
       - If the problem is clear: Proceed to Step 3.

  **Step 3: Assess the Nature of the Distinction**
     - Question: Is the proposed category primarily:
       - A) Descriptive: Reflecting a pre-existing, widely recognized distinction? (E.g., splitting "Asian" into subgroups that are already used in public health.)
       - B) Constitutive: Creating a new way of classifying people that may shape identity? (E.g., adding "nonbinary" as a sex option, which recognizes a group that has been marginalized and may not have been officially recorded before.)
     - **If Descriptive (A):**
          - Required: Evidence that the distinction is already in use in relevant medical/social contexts and that the current taxonomy causes harm (e.g., data inaccuracies, care disparities) by not having it.
          - If evidence is strong: Proceed to Step 4.
          - If evidence is weak: Reject. **Stop.**
     - **If Constitutive (B):**
          - Required: We must defer to the group that would be classified. Evidence that a significant number of people self-identify as part of this group and that the absence of the category causes harm (e.g., distress, invisibility, barriers to care).
          - If evidence of self-identification and harm is strong: Proceed to Step 4.
          - If evidence is weak: Reject. **Stop.**

  **Step 4: Evaluate Impact**
     - Question: Do the benefits of the change outweigh the costs?
       - Costs: Vendor fees, implementation effort, training, potential confusion, downstream system changes, etc.
       - Benefits: Improved patient outcomes, satisfaction, data quality, equity, compliance with best practices, etc.
       - Weigh them quantitatively if possible (e.g., projected patient volume affected, cost estimates) or qualitatively.
       - If benefits > costs: Proceed to Step 5.
       - If costs > benefits: Reject. **Stop.**

  **Step 5: Value Judgment Check**
     - Question: Does this change involve a deeply contested social/ethical issue that our committee is not qualified to decide? (E.g., debates about the nature of gender or race that extend beyond practical healthcare.)
       - Yes: We do not decide. Refer to higher institutional authority (e.g., ethics board, executive leadership) or defer to the affected group via structured consultation. **Stop.**
       - No: Approve the change.

  ---

  **Bottom Line:** This procedure is good for making consistent, transparent, and accountable decisions about taxonomy changes by focusing on practical constraints, evidence, and impacts, but its biggest blind spot is that it cannot resolve deep value conflicts without external input.

  ---

  Now, run through the three examples:

  1. **Adding "nonbinary" and an "X" option to the sex field:**
     - Step 1: No federal constraint (since federal rules often allow for an "X" option or are evolving, but we assume it's not mandated here). Proceed.
     - Step 2: Purpose is to include patients who don't identify as male or female, improving patient experience and data accuracy. Clear purpose.
     - Step 3: Constitutive (B). We must defer to the nonbinary community. Evidence: Many people identify as nonbinary, and studies show harm (e.g., distress, misgendering) when forced to choose M/F. Strong evidence. Proceed.
     - Step 4: Costs: Vendor change fee, but benefits (patient trust, inclusion) are high. Benefits > costs. Proceed.
     - Step 5: Involves a contested social issue? Yes (gender identity debates). But in healthcare, best practices (e.g., from AMA, WPATH) support inclusion. However, if the committee feels unqualified, refer to an ethics board or LGBTQ+ advisory group. But in practice, this is becoming standard. **Approve (with possible referral if needed).**

  2. **Splitting "Asian" race checkbox into finer-grained ethnic categories:**
     - Step 1: Federal reporting? Currently, the OMB standards for race include "Asian" as a single category, but some agencies allow subcategories. Check: If federal reporting requires aggregated "Asian", we can collect subcategories internally as long as we can aggregate. So no constraint against splitting. Proceed.
     - Step 2: Purpose: To recognize health disparities among Asian subgroups (e.g., higher diabetes in South Asians). Clear purpose.
     - Step 3: Descriptive (A). Evidence: Health disparities among Asian subgroups are well-documented in medical literature. Current category masks these differences, leading to inadequate care. Strong evidence. Proceed.
     - Step 4: Costs: Vendor fee, changing forms, training. Benefits: Better targeted care, improved research. If the health system serves a diverse Asian population, benefits likely high. Proceed.
     - Step 5: Not a deeply contested value issue. **Approve.**

  3. **Adding a "long COVID" flag to the problem list:**
     - Step 1: No federal constraint against adding a problem list code. Proceed.
     - Step 2: Purpose: To track and manage patients with long COVID, a condition with varied symptoms. Clear purpose.
     - Step 3: Descriptive (A). Evidence: Long COVID is a recognized condition by WHO, CDC, etc. It exists as a distinct clinical entity. Current lack of a flag hinders care coordination and research. Strong evidence. Proceed.
     - Step 4: Costs: Vendor fee, implementation. Benefits: Improved care for affected patients, better data. High benefits. Proceed.
     - Step 5: Not a value judgment. **Approve.**

  Now, we need at least one example where the procedure gives an answer the proposer will hate. Let's create a hypothetical:

  **Proposal: Add a "Hapa" checkbox under race (meaning mixed Asian and Pacific Islander heritage).**
     - Step 1: No constraint. Proceed.
     - Step 2: Purpose: To recognize people of mixed Asian/Pacific Islander heritage. Clear.
     - Step 3: Is it descriptive or constitutive? 
          - Descriptive: Is "Hapa" widely recognized in medical/social contexts? It's a cultural term but not standard in healthcare or federal forms. Evidence of harm? Without it, are people misclassified? Not clear. 
          - Constitutive: We must defer to the group. Evidence of self-identification? Yes, in some communities. Harm? Without it, they might have to choose one or check "other", which could be alienating. But is there evidence of significant harm in healthcare? Not established.
          - Weak evidence in either category. **Reject at Step 3.**
     - The proposer might hate this because they feel it's important for identity, but the procedure requires evidence of harm or widespread recognition.

  Thus, we have a procedure and examples.
