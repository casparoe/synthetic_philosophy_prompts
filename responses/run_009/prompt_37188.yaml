answer: |-
  **MEMORANDUM**  
  **To:** Faculty Research Computing Committee  
  **From:** Student Representative, PPE Finalist  
  **Date:** 23 October 2023  
  **Subject:** Recommendation for GPU Cluster Allocation System Reform  

  The Committee should adopt a hybrid allocation system comprising an internal credit market with termly adjusted rates and a centrally managed reserve (20% of total capacity) for exploratory work by junior researchers, effective Michaelmas Term.  

  ### I. Context and Urgency  
  Our shared GPU cluster faces chronic oversubscription, inefficient utilisation, and administrative burdens under the status quo. The proposal-based system requires researchers to submit quarterly written justifications for compute time, evaluated by a subcommittee. This has led to:  
  - **Strategic Padding**: Researchers inflate requests, knowing verification is impractical (averaging +30-40% beyond actual needs, per working group data).  
  - **Idle Capacity**: Reserved but unused slots due to project delays (peak wastage: ~15% last Hilary Term).  
  - **Inflexibility**: Urgent or iterative work cannot access unused capacity without bureaucratic hurdles.  
  - **Distributive Opacity**: Allocations correlate weakly with scientific novelty, favouring established groups with proposal-writing resources.  

  The working group’s proposed credit system—where groups receive termly budgets of "compute credits," debited at a dynamically adjusted rate per GPU-hour—promises efficiency but raises distributive and practical concerns. A hybrid model balances these while addressing core failures.  

  ### II. Socialist Calculation Debate: Relevance at Faculty Scale  
  The 20th-century socialist calculation debate (Mises, Hayek, Lange) illuminates our dilemma, though its lessons require scaling to institutional—not national—contexts.  

  #### A. **Critique of Status Quo: Hayek’s Knowledge Problem**  
  Hayek argued central planners cannot access dispersed, tacit knowledge (e.g., true project urgency, iterative needs, or real resource constraints). Our status quo exemplifies this:  
  - Researchers possess private knowledge (e.g., actual GPU-hour requirements, flexibility needs) but rationally misrepresent them to secure surplus ("padding").  
  - The subcommittee, lacking technical insight into all projects, cannot accurately verify claims or predict idle capacity.  
  *Result:* Persistent misallocation resembling Hayek’s "fatal conceit" of central planning.  

  #### B. **Credit System as Langean "Trial-and-Error" Planning**  
  Lange countered Mises by proposing that a Central Planning Board could mimic markets via iterative price adjustments. Our credit system operates similarly:  
  - A "Planning Board" (here, the Committee) sets a GPU-hour credit rate.  
  - Demand (researcher usage) is revealed through spending behaviour.  
  - Rates adjust termly until demand meets supply (queue clearance).  
  *Advantages:*  
  1. **Reduced Gaming**: Credits force honesty—researchers bear opportunity costs for overuse.  
  2. **Efficiency**: Dynamic pricing allocates slots to highest-priority work (e.g., urgent jobs bid via immediate spending).  
  3. **Flexibility**: Idle capacity is consumed spontaneously (e.g., groups running small jobs when slots free up).  

  However, Lange’s model assumes the Board can *observe* true demand—a challenge here, as initial credit distribution may distort behaviour.  

  #### C. **Mises’ Pricing Objection and the Cloud Counterargument**  
  Mises contended only genuine markets generate rational prices. One member asserts commercial cloud pricing (e.g., AWS, Azure) solves this by providing external benchmarks. This merits rebuttal:  
  - **Cloud prices are imperfect proxies**: They ignore:  
    - Our sunk infrastructure costs (marginal cost per GPU-hour is far below cloud rates).  
    - Discipline-specific needs (e.g., data sovereignty, specialised configurations).  
    - Non-monetary researcher preferences (e.g., convenience, integration with local data).  
  - **Risk of perverse incentives**: Basing internal rates solely on cloud benchmarks could:  
    - Encourage inefficient offloading to cloud if internal rates are set too high.  
    - Ignore excess demand if rates are set too low.  
  *Conclusion:* Cloud prices inform but cannot replace internal trial-and-error. Lange’s iterative adjustment remains essential.  

  ### III. Hybrid System: Balancing Efficiency and Equity  
  A pure credit system risks exacerbating distributive injustices—a flaw in both Lange’s model and our context. The hybrid model addresses this.  

  #### A. **Why Pure Credits Fail Distributive Justice**  
  - **Entrenching Inequality**: Allocating credits by group size or past usage (likely initial options) advantages established teams, disadvantaging:  
    - Junior researchers (limited track records).  
    - High-risk, high-reward projects (initially low usage but high potential).  
  - **The "Merit Fiction"**: While the status quo’s proposal system *pretended* to allocate based on scientific merit (but rarely did), pure credits abandon this aim entirely. Market mechanisms prioritise willingness-to-pay (credit expenditure), not scholarly value.  

  #### B. **Hybrid Solution: Reserved Capacity for Junior Researchers**  
  - **Mechanics**: 20% of cluster capacity is ring-fenced for a centrally managed reserve. Junior researchers (e.g., PhDs, postdocs, new PIs) apply via lightweight proposals for exploratory, proof-of-concept work.  
  - **Rationale**:  
    - **Equity**: Reserves opportunity for innovators lacking credit stockpiles.  
    - **Efficiency**: The reserve is small enough (<25%) to avoid significant market distortion (per NBER studies on hybrid research infrastructures).  
    - **Dynamic Synergy**: Reserve projects can "graduate" to credit-based funding if successful.  

  #### C. **Credit Trading: Permitting with Caps**  
  Groups should be allowed to trade credits, but with safeguards:  
  - **Termly Caps**: Trades limited to ≤25% of a group’s initial termly budget to prevent hoarding/speculation.  
  - **Why Allow Trading?** It mitigates rigid initial allocations (e.g., a group with unexpected needs buys surplus). This mirrors Hayek’s emphasis on local knowledge—researchers best judge their priorities.  

  ### IV. Strongest Case for Pure Credit System and Rebuttal  
  **Strongest Argument for Pure Credits**: *Simplicity and Efficiency*—A single market mechanism eliminates administrative overhead, maximises utilisation, and clears queues fastest by letting researchers self-allocate based on true needs.  

  **Rebuttal**: While elegant, this overlooks our faculty’s role as a *scientific incubator*. Without a reserve:  
  - Junior talent may be excluded, stifling innovation and violating our educational mission.  
  - Long-term health of research ecology suffers (e.g., incremental work crowds out exploration).  
  The hybrid model retains >80% of pure credits’ efficiency while ensuring intergenerational equity.  

  ### V. Implementation Timeline  
  - **Michaelmas Term**: Pilot hybrid system; initial credits allocated based on past usage (capped at +10% growth YoY).  
  - **Lent Term**: Adjust credit rates based on Q1 demand/supply data; refine reserve criteria.  
  - **Ongoing**: Committee reviews trading data and reserve outcomes termly.  

  ---  
  **Vote Recommendation: Adopt Hybrid System**  
  This approach harnesses Lange’s trial-and-error pricing to solve Hayek’s knowledge problem, while the reserve corrects for distributive failures inherent in pure market mechanisms. It balances efficiency, fairness, and our duty as a research community.  

  **Appendices**:  
  - Projected utilisation rates under each model.  
  - Draft reserve eligibility criteria.
