  I've been arguing with a friend (both of us have read way too much of the EA forum and old LessWrong threads on wild animal suffering) about the scale argument for insect welfare, and we've realised we can't even locate our disagreement because neither of us has ever actually written down a number. So here's what I want from you: your credence that a typical insect -- say a honeybee or a blowfly -- has genuinely valenced experiences, i.e. there is something it is like to be it and some of that is unpleasant or pleasant, not just nociception and reflexive avoidance. Give me a real number, none of this "it's a spectrum so a point estimate is meaningless" dodge.

  Then decompose it the way you'd decompose any forecast: the probability that some broadly functionalist/computational theory of consciousness is right (versus something like biological naturalism that ties experience to specific neural wetware), the probability that insect nervous systems satisfy the relevant functional conditions given that such a theory is true, the probability that the behavioural evidence we actually have -- the trade-off experiments where bees tolerate electric shocks to reach concentrated sucrose but not diluted sucrose, grooming at wound sites, the self-medication stuff -- tracks felt states rather than being explainable by simpler control mechanisms, and any other terms you think belong in the factorisation. Put a number and a line of reasoning on each, then show me how they combine, and tell me which term the final credence is most sensitive to. My number is around 0.1; my friend insists on 0.3, and I genuinely can't tell whether the gap lives in the theory-of-consciousness term or in how much work we think the behavioural evidence is doing, so if you have a view on where a 0.1/0.3 disagreement most plausibly lives, I want that too.

  Second thing, because it's where the argument gets spicy: my friend claims that once you accept even a low credence, expected value does all the rest of the work -- something like 10^19 insects alive at any moment, so even at 0.01 sentience probability and a heavily discounted per-bee moral weight, the aggregate dwarfs farm animal welfare budgets, and therefore funding insect interventions dominates on basically any credence you could defend. I'm suspicious of this move because it smells like the Pascal's mugging / infinite expectation failure mode where the multiplication never actually forces your hand. So also give me a credence on the proposition that the scale argument, done properly, makes insect welfare the top animal-welfare funding priority *given* your sentience number and a reasonable per-patient weight (my friend proposes log-scaling weight by neuron count, which honestly feels like precision theatre but I can't articulate why). Where does the low-probability-times-astronomical-numbers reasoning break down, if it does? And flag what evidence would move your sentience number the most -- I want to know what experiment or argument I should actually be waiting for. Please answer in British English; I've gotten used to "whilst" and "sceptical" and it'd feel weird otherwise.
