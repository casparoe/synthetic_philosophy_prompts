answer: |-
  ### Operationalized Risk-Attitude Elicitation Procedure  
  **Goal:** Elicit a client’s consistent risk attitude (without labeling it "right" or "wrong") to rank their options under *their own* risk-weighting framework. Uses a simplified **risk-weighted expected value (RWEV)** approach:  
  - **RWEV** = \( \text{Value}_{\text{worst}} + w(p) \times (\text{Value}_{\text{best}} - \text{Value}_{\text{worst}}) \)  
  - **Risk-weight** \( w(p) \) reflects how much the client *discounts* upside potential based on probability \( p \). Standard EU sets \( w(p) = p \); here, \( w(p) \) is personalized and allows pessimism (e.g., \( w(0.5) < 0.5 \)).  

  **Time:** 20–25 minutes (within a 60-minute session).  
  **Tools:** Whiteboard or paper, hypothetical gambles with *outcomes relevant to the client’s actual decision scale* (e.g., 1–5% of their real stake).  

  ---

  ### Step-by-Step Procedure  
  #### Step 1: Frame the Purpose (2 min)  
  - **Say:** *"Let’s understand how *you* weigh risks. I’ll ask about hypothetical choices. There’s no right answer—this helps us apply your approach to your real decision."*  
  - **Goal:** Set expectations. Emphasize this is about *their* comfort, not optimizing outcomes.  

  #### Step 2: Elicit Risk Weight \( w(p) \) (10–12 min)  
  - **Anchor gambles** to the client’s real decision (e.g., if deciding on $500K, use $5K–$25K gambles).  
  - **Ask:** *"Imagine a gamble: \( p\% \) chance of winning \(\$X\), and \( (100-p)\% \) chance of winning \(\$Y\) (where \( X > Y \)). What’s the *minimum guaranteed amount* you’d accept to avoid this gamble?"*  
    - **Start with \( p = 50\% \), \( Y = 0 \), \( X = \text{relevant amount} \).**  
      - *Example:* "50% chance of $20K, 50% of $0. What guaranteed amount makes you walk away?"  
      - **Usable answer:** A dollar value (e.g., "$7K"). Reject vague replies ("I don’t know"); gently push for specificity.  
    - **Calculate \( w(0.5) \):**  
      \[
      w(0.5) = \frac{\text{Guaranteed Amount} - Y}{X - Y}
      \]  
      *(In the example: \( w(0.5) = 7,000 / 20,000 = 0.35 \)).*  
    - **Probe consistency:**  
      - Ask the same for \( p = 70\% \) (e.g., "70% chance of $20K, 30% of $0").  
      - If \( w(0.7) \) is inconsistent (e.g., \( w(0.7) < w(0.5) \)), ask them to reconcile. *If unresolved, use \( w(0.5) \) only.*  
  - **Flag judgment calls:** If the client struggles, note: *"You seem uneasy—is this gamble unrealistic?"* or *"Are external stresses affecting this?"* Hand back to values if needed.  

  #### Step 3: Apply to Real Options (5–7 min)  
  - **Break real decision into outcomes:** Help client list:  
    - **Best outcome** (e.g., high offer if they wait).  
    - **Worst outcome** (e.g., no offer if they wait).  
    - **Probability \( p \)** of best outcome (their subjective estimate).  
  - **Calculate RWEV for each option:**  
    \[
    \text{RWEV} = \text{Worst Outcome} + w(p) \times (\text{Best Outcome} - \text{Worst Outcome})
    \]  
  - **Rank options:** Compare RWEVs. Higher RWEV = better under *their* risk weights.  

  #### Step 4: Hand Back the Decision (2–3 min)  
  - **Say:** *"This ranking reflects your risk comfort. But it doesn’t capture everything—like family needs or gut feelings. How does this align with your values?"*  
  - **Stop and hand back if:**  
    - Client dismisses probabilities ("I just *feel* it won’t work").  
    - Non-risk factors dominate ("My spouse would never forgive me if we sold").  
    - Values conflict with RWEV ("I know the numbers say wait, but my dad built this business").  

  ---

  ### Case Applications  
  #### **Case 1: 58-Year-Old Pension Choice**  
  - **Context:** Chooses lump sum (gamble) despite calling herself "not a gambler."  
  - **Procedure:**  
    - Use gambles scaled to pension (e.g., 50% chance of $100K vs. $0). She accepts $60K guaranteed → \( w(0.5) = 0.6 \).  
    - **Annuity:** Guaranteed $1M total → RWEV = $1M (no risk).  
    - **Lump sum:** Invested → Best = $1.5M (p=0.6), Worst = $0.7M (p=0.4) → RWEV = \( 0.7\text{M} + 0.6 \times (0.8\text{M}) = 1.18\text{M} \).  
  - **Yield:** Lump sum ranks higher (RWEV $1.18M > $1M).  
  - **Misfire:** Her small-stakes behavior ("gambler") conflicts with identity ("not a gambler"). Risk-weight misses *why* she separates pension from play money.  
  - **Can’t do:** Resolve identity conflict. Hand back: *"The math favors lump sum, but you called yourself risk-averse. What feels different here?"*  

  #### **Case 2: Couple Selling Family Restaurant**  
  - **Context:** Excessively cautious; insists on lowball offer.  
  - **Procedure:**  
    - Gamble: 50% chance of $50K vs. $0. They accept $10K → \( w(0.5) = 0.2 \).  
    - **Sell now:** Guaranteed $300K → RWEV = $300K.  
    - **Hold out:** Best = $500K (p=0.7), Worst = $100K (p=0.3) → RWEV = \( 100\text{K} + 0.2 \times (400\text{K}) = 180\text{K} \).  
  - **Yield:** Sell now ranks higher (RWEV $300K > $180K).  
  - **Misfire:** If their probability is unrealistically low (e.g., \( p=0.7 \) for $500K offer when market trends suggest \( p=0.9 \)), RWEV is skewed.  
  - **Can’t do:** Fix biased probabilities. Flag: *"You’re very cautious—is this based on data or fear?"* If fear, probe gently. If they insist, respect their input.  

  #### **Case 3: Man Taking Insurance Settlement**  
  - **Context:** Wants settlement; adjusts numbers to justify it.  
  - **Procedure:**  
    - Gamble: 50% chance of $200K vs. $0. He accepts $199K → \( w(0.5) = 0.995 \) (extreme pessimism).  
    - **Settle:** Guaranteed $100K → RWEV = $100K.  
    - **Sue:** Best = $500K (p=0.5), Worst = $0 (p=0.5) → RWEV = \( 0 + 0.995 \times (500\text{K}) = 497.5\text{K} \).  
    - He then revises sue’s worst outcome to $ -50K (debt).  
  - **Yield:** Sue ranks higher (RWEV $497.5K > $100K), but he rejects this.  
  - **Misfire:** Numbers change to fit desired outcome. \( w(p) \) is ignored when inconvenient.  
  - **Can’t do:** Override emotional bias. Hand back immediately: *"Your numbers keep shifting—what’s driving your certainty about settling?"*  

  ---

  ### The Principled Line: Stable Attitude vs. Mood  
  - **Stable attitude:** Consistent across similar stakes/scenarios, rooted in long-term worldview (e.g., "I’ve always prioritized security").  
  - **Mood/fear response:** Inconsistent, situational ("This lawsuit terrifies me, but I bet on stocks"), or physically charged (shaking, rushing).  
  - **Can the procedure find the line? Partially.**  
    - **Yes:** Inconsistencies in \( w(p) \) gambles (e.g., \( w(0.5) = 0.9 \) for small stakes but \( w(0.5) = 0.1 \) for large) reveal context-dependence.  
    - **No:** It won’t distinguish trauma-triggered fear from deep-seated caution. **That’s your role:**  
      - **Probe:** *"You said you’d risk $X in the gamble, but not in your real decision. What’s different?"*  
      - **Flag:** *"Today’s stress might be shaping this—do you want to pause?"*  
      - **Respect:** If stable and consistent, it’s their attitude—even if it seems "wrong."  

  **Final Truth:** The math is a tool to *clarify*, not decide. Your expertise is in spotting when emotion hijacks consistency vs. when caution is core to their values. The line isn’t in the numbers—it’s in the person across from you.
