  Two members of my reading group have been arguing for two years about what cross-cultural moral psychology does to moral objectivity, and they've finally agreed to an adversarial collaboration. One is a moral realist: she holds that the well-documented fact that Western, educated, industrialized, rich, democratic (WEIRD) populations are outliers on things like retribution versus rehabilitation, impartial fairness, and the moral weight of purity, loyalty, and contract is exactly what you should expect if moral inquiry is fallible and culturally mediated — no more threatening to moral truth than disagreement about the heavens was to astronomy. The other is a constructivist: he holds that once you see how deep the variation runs — not merely different applications of shared values, but different candidates for what counts as a moral wrong in the first place — the natural conclusion is that moral truth is made rather than found, and that realists are mistaking their own culture's local output for universal rational convergence. Write the joint statement they should produce: a numbered section of claims both can sign, including about what the empirical findings actually show and fail to show; a disagreements table in which each residual disagreement is phrased so its own side would accept the wording; and the cruxes — I suspect one is whether convergence under idealized conditions (full information, full mutual understanding, no coercion) is a genuine test of objectivity or a definitional move that smuggles the realist's conclusion in, and another is how to tell "deep" disagreement from disagreement that merely reflects different factual beliefs about harm, desert, or personhood. For each crux, give a concrete case, thought experiment, or hypothetical empirical result that both would agree bears on it, with each side's prediction recorded in advance. If you conclude that part of their dispute is merely verbal — for instance, over the word "objectivity" itself — say which part and why. Please write the statement in American English.
