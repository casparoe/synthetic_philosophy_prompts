prompt: |-
  I'm doing my EPQ (the extended project thing we do in sixth form) and I've landed on this topic about archives and who history actually remembers, but I've only got a half-formed idea and my supervisor keeps telling me it's way too broad. Here's what got me into it: my school is about 150 years old and has this dusty archive room I volunteered to help sort, and I noticed the only pupils in there are the ones who won prizes or got expelled. There's a punishment book going back ages and lists of every cricket score, but literally nothing about the ordinary kids, like the majority of people who went there just don't exist in the record. And then the same thing at home — my nan has all her mum's wartime letters but my grandad's side has basically nothing, whole lives just gone. So my half-formed idea is that the "silences" in archives aren't one thing: some stuff was never written down in the first place, some was written down and then thrown away (or deliberately destroyed?), and some is sitting in a box somewhere nobody has indexed. I reckon these are epistemically different — the absence of evidence means something different in each case — but I can't work out how to turn that into an actual project.

  What I need is a proper research proposal to hand in Friday: one precise research question, why the lazy answer ("history is written by the winners, obviously") doesn't actually settle it, what I'd concretely do month by month over the ~6 months I have, and what would count as the project failing. I'm allowed to use the school archive and my family stuff as primary material, which feels like an advantage I should exploit somehow, since most historians can't just go look at an archive nobody has studied. The exam board also hates projects that are just a literature review, so whatever you pick, it needs to be something where I'm doing my own analysis of sources, even small-scale — like actually comparing what kinds of pupils appear in which records and why.

  Please actually commit though — pick THE question and THE method and argue for them, don't hand me three options and leave the choosing to me, my brain cannot take it and I'll just procrastinate. And flag honestly if part of your recommendation depends on a contested assumption I should check with my supervisor rather than hoping she doesn't notice. Keep the whole thing under 600 words, I know thats tight but the form only gives me a page.
