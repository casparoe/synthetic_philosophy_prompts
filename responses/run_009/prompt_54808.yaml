prompt: |-
  I'm a software engineer with about fifteen years in API design and infrastructure work, and I instinctively think about persistence, authority, and change in terms of contracts, versions, and running systems. I've gotten interested in the bioethics debate about advance directives — instructions a competent person records about medical treatment for a future self with dementia — and I'd like you to restate that debate in the vocabulary I actually use. The positions I have in mind:

  1. The view, associated with Ronald Dworkin, that the earlier competent self has full authority over the later demented self: autonomy includes the power to legislate for one's own future, so an advance directive binds even when the current patient seems content and would want to go on living. Dworkin distinguishes, roughly, interests in the shape of one's life as a whole from interests in one's moment-to-moment experience, and holds that only the earlier self can judge the former — so it's the earlier self whose judgment should govern.

  2. The dissenting view, associated with critics like Rebecca Dresser, that once the earlier and later selves have diverged, what counts is the welfare of the patient who now exists: if the person with dementia is comfortable and engaged, honoring a directive to let them die serves no one who is still around to be served.

  3. Intermediate views — for instance, that a directive carries weight only insofar as the current patient can still be said to endorse, however dimly, the values it expressed, or that directives are presumptive rather than decisive.

  Please translate each position into my vocabulary as faithfully as you can: contracts and their owners, pinned versions, deprecation notices, breaking changes, backward compatibility, the divergence between a running instance and the source of truth it was deployed from, forks, and migrations. Where a philosophical claim has an obvious analogue, say so; where you have to bend one of my terms to make it fit, flag the bend. Then give me the residue report. I'm particularly curious about a few candidate residues: whether the thesis that the demented patient is, or is not, "the same person" as the author of the directive has any counterpart in my vocabulary, or whether forking a project and drifting from its spec simply doesn't capture what's at stake; whether the idea that the earlier self has a special claim on the body — that the running instance executes on hardware the spec author laid down instructions for — is expressible at all in a framework where contracts bind instances, not people; and whether the notion that the later self's momentary experience has moral weight of its own, independent of anyone's prior intent, is like arguing from observed runtime behavior against a declared contract, or is something my vocabulary quietly cannot say.

  Finally, tell me whether my working intuition is a good frame or a distortion: my instinct is that this whole debate is just the question of which source of truth wins when a running system has drifted from its declared contract — the spec, the running instance, or some reconciliation procedure. Does that mapping illuminate the debate, or does it smuggle in assumptions (for example, that there is a spec author with standing, or that authority must reside in exactly one place) that the philosophers are actively contesting? Where the residue points to something my vocabulary is missing rather than to something the philosophical claims never managed to make precise, I'd like to know which it is and why.
reasoning: |-
  We are going to map the bioethics debate about advance directives to the vocabulary of API design, contracts, versions, and running systems.

  Key elements from the user's vocabulary:
  - Contracts: Agreements defining interactions (like an advance directive).
  - Pinned versions: A specific, immutable version of a contract (the directive as originally written).
  - Deprecation notices: Warnings that a contract is outdated and may be replaced.
  - Breaking changes: Changes that violate backward compatibility (the dementia is a breaking change to the person's cognitive state).
  - Backward compatibility: The ability of a new system (the demented self) to honor old contracts (the directive).
  - Running instance: The current state of the patient (the demented self).
  - Source of truth: The authoritative specification (the advance directive).
  - Forks: A split into two separate paths (the competent self and the demented self becoming distinct).
  - Migrations: Transition from one system to another (the progression from competence to dementia).

  Now, let's restate each position:

  1. **Dworkin's view (earlier self has full authority):**
     - The advance directive is a contract that the competent self (the original author) has set for the running instance (the future self). The contract is the source of truth and must be honored even if the running instance (demented self) has drifted. The demented self is a version of the original self that has undergone a breaking change (dementia), but the contract (directive) is pinned to the version that the author intended. The running instance must be forced to comply with the contract, even if it means termination (death). The authority lies with the original contract author.

     Vocabulary mapping:
     - The advance directive is a **pinned version** of the contract.
     - The dementia represents a **breaking change** that makes the running instance incompatible with the original contract.
     - The running instance (demented self) has **drifted** from the source of truth (the directive) and must be brought into compliance (by following the directive) or terminated (if the directive says so).
     - The original author (competent self) is the **owner** of the contract.

     Analogue: The running system must comply with the contract it was deployed with, even if it has started behaving differently. The contract owner (original author) has the authority to enforce it.

  2. **Dresser's view (welfare of the current patient):**
     - The running instance (demented self) is now a distinct entity. The original contract (advance directive) was written for a previous version and may not be backward compatible with the current running instance. The current running instance has its own state (happiness, engagement) and should be treated as a new system. Enforcing the old contract (which might lead to termination) would break the current system without serving the original author (who no longer exists in the same form). Therefore, the welfare of the current running instance is the priority.

     Vocabulary mapping:
     - The dementia is a **fork** in the project: the demented self is a fork of the original self and has become a separate running instance. The original contract is now deprecated for this fork.
     - The current running instance has its own **runtime behavior** and state, which should be observed and respected.
     - The original contract is like a **deprecated** version: it's still there, but it's not suitable for the current fork. We might issue a deprecation notice but not enforce the old contract if it breaks the current system.
     - The current system (demented self) is not backward compatible with the old contract (it cannot understand or endorse it) and should not be forced to comply.

     Analogue: When a system forks and drifts, the new running instance becomes the source of truth for itself. The old contract is not binding on the fork.

  3. **Intermediate views:**
     - **Endorsement view:** The advance directive (contract) is binding only if the current running instance (demented self) can still be said to endorse the contract, meaning there is some backward compatibility. We check the running instance for signs of the old values (like checking logs for compatibility). If there is no endorsement (no backward compatibility), the directive doesn't bind.

       Mapping: The contract is honored only if the running instance shows **backward compatibility** with the original contract. We look for evidence in the runtime behavior that the current system still adheres to the old values.

     - **Presumptive view:** The advance directive is like a default configuration that is **presumptive**. It is the starting point, but if the running instance behaves in a way that contradicts it (without being in error), we may override the directive. The directive is a strong suggestion but not absolute.

       Mapping: The contract is the **source of truth** until the running instance shows a **breaking change** that requires a **migration** to a new contract (current wishes). The directive is a pinned version that we can override if the running instance's state is clear.

  Residue Report:

  1. **Same person?** 
     - In your vocabulary, we don't have a direct equivalent for "same person". We have "running instance" and "source of truth", but the question of personal identity (whether the demented self is the same person as the author) is not captured. Instead, we have the idea of a fork: when the system diverges, it becomes a separate instance. This maps to Dresser's view (it's a fork) and Dworkin's (it's a broken version of the same system). The residue is that the philosophical debate about personal identity is not fully captured by forking because in software, forking creates a new entity with its own identity, but in the person case, we are dealing with the same body and a continuous stream of consciousness (even if altered). The vocabulary doesn't capture the metaphysical question of identity.

  2. **Special claim of the earlier self on the body:**
     - We can say: the original author laid down the contract and the body is the hardware on which the running instance executes. The contract binds the running instance because it runs on the hardware that the author set up. However, in contract terms, the contract binds the instance (the software) not the hardware. The residue is that the body (hardware) is owned by the original author? But in our vocabulary, the hardware is just a platform. We don't have a concept of ownership of the hardware by a particular version of the software. We have to bend "hardware" to mean the body and then say the original author has a claim because they set up the instructions? This is a bend: in software, the hardware is independent and can run any software. In the person, the body and the original self are intrinsically linked.

  3. **Moral weight of the later self's experience:**
     - This is like observing the runtime behavior and using it as a source of truth. In Dresser's view, the current runtime behavior (happiness) should override the declared contract (directive). In your vocabulary, this is analogous to monitoring the running system and adjusting the contract based on observed behavior. However, in strict contract terms, the declared contract is the source of truth and runtime behavior is only relevant for debugging or if the contract allows for adaptation. The residue: the philosophical claim that the later self's experience has intrinsic moral weight is not just about observed behavior but about the existence of a subject of experience. Your vocabulary can capture this as runtime metrics, but it doesn't capture the moral weight. We can say: the running instance is a live system that must be maintained for its own sake, not just as a reflection of the contract.

  Evaluation of the user's intuition:

  Your intuition that the debate is about "which source of truth wins when a running system has drifted from its declared contract" is a good frame. It captures the core tension: the advance directive (contract) vs. the current state of the patient (running instance). However, it may smuggle in assumptions:

  - It assumes there is a clear contract owner (the earlier self) with standing. But Dresser challenges that standing when the system has forked.
  - It assumes that authority must reside in one place (either the contract or the running instance). The intermediate views show that it can be a reconciliation (like a migration plan or a compatibility check).

  The residue points to gaps in the vocabulary:
  - The concept of personal identity over time (same person?) is not natively in the vocabulary. We use "fork" as an analogy, but it's a technical split and doesn't capture the existential continuity.
  - The moral weight of the current experience is not just runtime data but a claim about intrinsic value that exists independently of any contract. The vocabulary is descriptive (how systems work) but not normative (what should be done).

  Conclusion: The mapping illuminates the debate by providing a clear structure for the competing claims. It helps to see the debate as a conflict between design-time authority (the contract) and runtime reality. However, the philosophical debate is richer because it involves questions of identity, the nature of well-being, and moral values that are not fully reducible to system design concepts. The residues are mostly due to the vocabulary being descriptive and technical, while the debate is normative and metaphysical.

  Final note: Your frame is a good one for understanding the structure of the debate, but it doesn't capture the full moral weight. It's a useful lens, but we must remember that the stakes are human lives and well-being, not just system integrity.
answer: |-
  ### Restating the Bioethics Debate in Software Engineering Vocabulary

  #### Core Analogy Framework
  - **Advance Directive** = A contract (API spec) defining future behavior under specific conditions.
  - **Competent Self** = The original contract author (source of truth at design time).
  - **Demented Self** = A running instance deployed from that contract but now drifted.
  - **Dementia Onset** = A breaking change to the system, creating incompatibility with the original contract.
  - **Medical Decision** = Runtime enforcement of a contract clause (or override).

  ---

  ### Translated Positions

  #### 1. **Dworkin's View (Original Authority)**  
  *Analogue: Strict contract enforcement with pinned versions.*  
  - The competent self is the **contract owner** with exclusive rights to define the system's lifecycle.  
  - The advance directive is a **pinned version** of the contract—immutable and binding.  
  - Dementia is a **breaking change** that *invalidates backward compatibility* with the original contract.  
  - The demented self is a **drifted running instance** executing on hardware (the body) provisioned by the spec author.  
  - **Runtime behavior** (e.g., apparent contentment) is irrelevant: the spec author's judgment about the system's **architectural integrity** (life's narrative shape) overrides **momentary metrics** (experience).  
  - *Bend*: "Architectural integrity" isn't native to API design but maps to cross-version system coherence (e.g., preserving a monolith's design intent vs. ad-hoc microservices).  

  #### 2. **Dresser's View (Current Welfare)**  
  *Analogue: Runtime observability overrides deprecated contracts.*  
  - The demented self is a **forked instance** with its own **runtime context** after a breaking change (dementia).  
  - The advance directive is a **deprecated contract**—valid for the original system but not the forked instance.  
  - Enforcing the contract serves no **active user** (no backward-compatible beneficiary).  
  - Authority shifts to the **system operator** (caregiver) who must optimize for current **runtime metrics** (well-being, engagement).  
  - *Bend*: "Active user" extends "user" beyond the spec author to include the running instance itself as a stakeholder.  

  #### 3. **Intermediate Views**  
  - **Endorsement View**:  
    *Analogue: Backward compatibility checks.*  
    The contract binds only if the running instance shows **compatibility** with the original values (e.g., residual "API calls" to past principles). Like checking if a legacy system can still process old requests.  

  - **Presumptive View**:  
    *Analogue: Contract with migration fallbacks.*  
    The directive is a **default configuration**, but **runtime telemetry** (observed patient behavior) triggers **migrations** to new rules. Similar to feature flags that toggle between versions based on system state.  

  ---

  ### Residue Report  
  *(Gaps where the analogy strains or falls short)*  

  #### a. **"Same Person" Identity Claim**  
  - **Your Vocabulary**: No direct counterpart.  
  - **Analysis**: Forking implies two distinct systems (e.g., project-A v1.0 vs. project-A v2.0), but the debate hinges on whether the demented self is a *version* of the same system or a *new system*. Your framework avoids metaphysical identity—it asks "is backward compatibility possible?" not "are they the same entity?" This residue reveals a **philosophical gap** in your terms: software lacks the *bodily continuity* that bioethics debates center on.  

  #### b. **Earlier Self's Bodily Claim**  
  - **Your Vocabulary**: Partial fit via "hardware provisioning."  
  - **Analysis**: You *can* say the running instance "executes on hardware the spec author laid down instructions for." This maps to contract ownership (e.g., AWS Lambda functions bound by the IAM roles that deployed them). However, it smuggles in an assumption: that hardware ownership confers authority. Dresser would reject this—just as cloud hardware can host independent containers, the body hosts a new agent. **Bend flagged**: Bodily ownership isn't native to API contracts.  

  #### c. **Moral Weight of Current Experience**  
  - **Your Vocabulary**: Like arguing from runtime metrics against a contract.  
  - **Analysis**: Observing a system’s "happy logs" to override its SLA is possible (e.g., ignoring a circuit-breaker rule during low traffic). But your terms *can* express this: Dresser treats the demented self as a **dependent service** with its own SLA, decoupled from the spec author’s intent. The residue: software metrics lack *intrinsic moral weight*. Your framework is **descriptive** (how systems behave), not **normative** (why their experience matters).  

  ---

  ### Evaluation of Your Intuition  
  **Thesis**: *"Which source of truth wins when a running system drifts from its contract?"*  

  #### **Why It Fits**  
  - Accurately frames the debate as a **conflict between sources of truth**:  
    - Dworkin: Source of truth = **pinned contract** (design-time spec).  
    - Dresser: Source of truth = **runtime instance** (observable state).  
    - Intermediate: Source of truth = **reconciliation protocol** (compatibility checks).  
  - Explains **authority disputes** via ownership:  
    - Who "owns" the body/hardware? The spec author (Dworkin) or the runtime (Dresser)?  

  #### **Where It Distorts**  
  1. **Assumption of Singular Authority**:  
     - Your model implies authority *must* reside in one place (spec, runtime, or reconciliation). But philosophers like Agnieszka Jaworska argue for **distributed authority**—e.g., the demented self retains fragments of personhood that "vote" alongside the directive.  
     - *Software gap*: Your terms lack "partial ownership," like a contract shared across versions.  

  2. **Reduction of Welfare to Metrics**:  
     - Reducing "well-being" to runtime metrics (e.g., CPU happiness) obscures ethical dimensions. A system can be "content" while violating its SLA—but is that *good*? Your vocabulary **cannot natively ask this**.  

  3. **Hardware as Neutral**:  
     - Your analogy treats the body/hardware as a passive resource. But bioethics sees the body as *constitutive* of identity—unlike cloud infrastructure. This **overlooks embodiment**’s role.  

  #### **Verdict**  
  Your frame **illuminates the debate's structure** but **smuggles in assumptions** about authority centralization and metric-driven governance. The residue isn’t from philosophical vagueness—it highlights where *your vocabulary is incomplete*:  
  - It lacks terms for **gradual identity decay** (not forking, but partial compatibility).  
  - It has no **normative primitives** to weigh experience vs. design.  
  - It **flattens embodiment** to hardware.  

  **Recommendation**: Use this frame to clarify *mechanics* (e.g., how decisions propagate across versions), but layer bioethics’ **normative language** to handle what your terms omit (e.g., "Why should experience matter?"). Think of it as adding a **policy engine** to your API gateway—one that handles values your contracts can’t encode.
