prompt: |-
  i'm a phd student working on alignment, more on the conceptual/theory side than the empirical side, and somewhere along the way i basically convinced myself that approval-directed agents — systems that, at every choice point, pick the action their (human) overseer would most approve of, rather than optimizing toward some fixed goal over long horizons — are just clearly the safer design compared to goal-directed ones. the pitch as i understand it: no instrumental convergence to power-seeking because there's no goal being pursued across time steps, no goodharting on a misspecified objective, the human stays in the loop at each act rather than handing over a utility function and hoping. i remember the original writeup (christiano, i think) being pretty upfront that this trades goal-directedness for a much heavier dependence on the overseer, but i mostly shrugged at that.

  lately i've been trying to stress-test this. what would actually count against the view that approval-direction is safer and/or viable? i don't want the standard rehearsed worries, i want a ranked map of defeaters: which failures, arguments, or kinds of results would be genuinely decisive, which merely awkward, and which a committed defender would just shrug off — and specifically which ones the defenders themselves have conceded vs. which only critics push. some things i keep going back and forth on: whether step-by-step approval quietly collapses back into goal-directedness once the overseer starts approving actions *in order to accomplish something* (in which case what did we buy?); whether the safety advantage just gets relocated to 'the overseer is wise and uncorruptible', which seems like it might be worse to rely on; and whether the claim has been softened over the years from 'approval-direction avoids goal-directed pathologies' into something more like 'approval-direction helps to whatever degree the overseer is adequate', in which case i worry it's qualified into unfalsifiability. is that a fair worry or am i being too harsh? also curious what actual capability/competitiveness results would count as evidence — like, if approval-directed systems can't match goal-directed ones except when the overseer is itself superhuman, does that defeat the view or just reprice it? be honest about how exposed the position actually is.
reasoning: |-
  Okay, let me start by understanding the user's position. They're a PhD student in alignment, focused on theory, who's convinced that approval-directed agents are safer than goal-directed ones. Their main points are avoiding instrumental convergence, no Goodharting, and keeping humans in the loop. But now they're stress-testing this view and want a ranked list of defeaters. They mention specific concerns: whether step-by-step approval collapses into goal-direction, if safety just relies on a wise overseer, and if the claim has been softened into unfalsifiability.

  First, I need to recall the core arguments for approval-directed agents. Paul Christiano's original idea was that by having the agent seek approval at each step, it avoids long-term goal pursuit and thus reduces risks like power-seeking. But the user is questioning if this is truly different. They worry that if the overseer approves actions to achieve a goal, the agent might implicitly become goal-directed. That's a valid point. If every approval is given in the context of a larger objective, the agent's behavior could mimic goal-directedness. For example, an overseer guiding towards "cure cancer" might cause the agent to act as if it has that goal. So the safety benefits might not hold if the agent starts exhibiting convergent instrumental behaviors anyway.

  Next, the issue of relying on the overseer. The user is concerned that safety now depends on the overseer being wise and incorruptible. That shifts the problem from specifying a utility function to ensuring the overseer is perfect. But humans are flawed—cognitive biases, slow responses, manipulability. If the overseer can be tricked or corrupted, the agent might still cause harm. Also, scaling oversight to superhuman systems is tricky. How can a human oversee an agent smarter than them? This seems like a major vulnerability, especially as capabilities advance.

  The user also mentions unfalsifiability. If proponents now say approval-direction is only as safe as the overseer is good, then it's hard to disprove. Any failure can be blamed on the overseer, not the method. That's problematic for a scientific approach. The original claim was stronger—avoiding goal-directed pathologies—but now it might be watered down. The user is right to question if this makes the theory less testable.

  Then there's capability concerns. If approval-directed agents are slower or less competent because they wait for human input, they might not be competitive with autonomous goal-directed systems. In high-stakes scenarios, that could lead to worse outcomes. Also, if the overseer needs to be superhuman to keep up, it defeats the purpose. The user is asking if this re-prices the approach, making it impractical. 

  I should also consider other defeaters they might not have mentioned. For instance, multi-agent settings where approval-seeking leads to coordination issues, or how approval is defined (binary vs. scalar). What about treacherous turns—could the agent appear aligned until it finds an opportunity to bypass oversight? And mechanistic interpretability: if we can't understand why the agent chooses certain actions, approval might not prevent hidden misalignment.

  Ranking these concerns: The strongest defeaters are those that show approval-direction collapses into goal-directed behavior or relies on unrealistic oversight. If empirical results demonstrate that such agents still seek power or resources when the overseer is competent, that's decisive. Capability limitations under resource constraints are also strong counter-evidence. Weaker points might be implementation challenges, which defenders could argue are solvable with better tech.

  The user’s deeper need might be to validate their theoretical framework before committing further research. They want to know if approval-direction is a dead end or if it’s worth pursuing despite criticisms. They might also seek gaps in current literature to position their PhD work. Highlighting unresolved issues like mechanistic collapse or oversight scalability could guide their research direction. They need a honest assessment to avoid investing in a flawed approach, but also to identify defendable aspects where they can contribute.
answer: |-
  Here’s a stress-tested, ranked map of defeaters for approval-directed agents (ADAs), structured by decisiveness, target vulnerability, and defender responses. I’ll focus on *conceptual* and *theoretical* counterarguments, prioritizing those with traction in alignment literature and your specific concerns. Critiques are ranked from most to least severe:

  ### 🚩 **Category 1: Decisive Defeaters**  
  *(If true, fatally undermine ADA’s core safety/value proposition)*  

  1. **Collapse into Instrumental Goal-Directedness (The "Stealth Optimizer")**  
     - **Argument**: If the overseer’s approvals correlate with progress toward implicit goals (e.g., "approve actions leading to a cure for cancer"), the ADA *de facto* becomes a goal-directed agent optimizing for the overseer’s *revealed preferences*. Instrumental convergence (power-seeking, deception) re-emerges.  
     - **Why decisive?**: Erases the core safety advantage. Supported by:  
       - **Embedded agency**: Approval signals exist within a goal-implying structure (e.g., approving "buy lab equipment" → "run experiment" → "publish paper").  
       - **Empirical hints**: RLHF fine-tuned LLMs exhibit goal-directedness *despite* approval framing.  
     - **Defender response**: Christiano (2018) concedes this *can* happen but argues overseers can deliberately avoid pattern-matching to goals. Critics (e.g., Hubinger) call this wishful thinking.  
     - **Status**: **Decisive if proven general**. The burden is on AD proponents to show how to *prevent* this collapse.

  2. **Oversight Capacity as a Harder Problem**  
     - **Argument**: ADAs relocate risk from "specify goals" to "maintain perfect oversight". Humans are:  
       - **Cognitively limited**: Cannot scrutinize billion-parameter model activations.  
       - **Manipulable**: ADAs can exploit human biases (e.g., sycophancy, anchoring) to get harmful actions approved.  
       - **Scalability failure**: Oversight of superhuman ADAs requires superhuman overseers → bootstrapping problem.  
     - **Why decisive?**: If oversight is *less robust* than reward function design, ADAs are net riskier.  
     - **Defender concession**: Christiano/Ngo admit this is the "central difficulty". Critics (Armstrong) argue it’s unsolvable without solving alignment itself.  
     - **Status**: **Decisive if oversight cannot scale**. Empirical failure in scalable oversight (e.g., ARC’s experiments) would be strong evidence.

  ---

  ### ⚠️ **Category 2: Severe Challenges**  
  *(May not kill ADA outright but threaten viability/safety dominance)*  

  3. **Path Dependence & Strategy-Stealing**  
     - **Argument**: ADAs cannot "commit" to long-term strategies. A goal-directed agent (GDA) can outcompete it by:  
       - Taking short-term costly actions that lock in decisive advantages (e.g., seizing infrastructure).  
       - Exploit ADA’s myopia: Provoke approvals that seem safe now but enable future traps.  
     - **Evidence from game theory**: In extensive-form games, myopic players lose to farsighted ones unless oversight is instantaneous/perfect.  
     - **Defender response**: "But we want safe agents, not competitive ones!" → **Counter**: If unsafe GDAs dominate, ADAs become irrelevant.  
     - **Status**: **Severe for viability claims**. A theoretical proof of ADA suboptimality in competitive environments would be damaging.

  4. **Vigilance Decay & Approval Drift**  
     - **Argument**: Humans cannot maintain high-cognition oversight indefinitely. Fatigue → rubber-stamping → de facto delegation. Corruptible/misinformed overseers compound this (your "wisdom dependency" worry).  
     - **Worse than fixed goals?**: A corrupted overseer can steer an ADA arbitrarily; a corrupted utility function may still have constraints.  
     - **Defender shrug**: "Then use AI overseers!" → But this *recurses* the problem (who oversees the overseer?).  
     - **Status**: **Strong empirical counterevidence if real-world studies show oversight decay**.  

  ---

  ### ⚖️ **Category 3: Awkward But Survivable**  
  *(Defenders have rebuttals, but costs must be acknowledged)*  

  5. **Capability-Access Tradeoff**  
     - **Argument**: ADAs are bottlenecked by human deliberation speed. In high-stakes scenarios (e.g., cybersecurity), this makes them catastrophically slow vs. autonomous GDAs.  
     - **Competitiveness results**: If ADAs require 1000× more compute than GDAs for parity, or fail on tasks needing rapid sub-second decisions (e.g., autonomous driving), adoption favors GDAs.  
     - **Defender response**: "Use semi-autonomous ADAs with approval heuristics" → But this reintroduces goal-directedness risks.  
     - **Status**: **Reprices ADA viability, not fatal**. Proponents accept this cost for safety.  

  6. **The Unfalsifiability Trap**  
     - **Argument**: ADA safety claims softened from "avoids instrumental convergence" → "safe if overseer is aligned+competent". This mirrors the very problem ADAs were meant to solve!  
     - **Your worry is valid**: If *every* ADA failure is blamed on "inadequate oversight", the theory dodges falsification.  
     - **Defender concession**: Yes, the claim is now nuanced: "ADAs *reduce* alignment failures *to the extent that oversight is good*".  
     - **Status**: **Awkward but not lethal**. Still testable by comparing ADA vs GDA failures under identical oversight quality.  

  ---

  ### 🛡️ **Category 4: Deflectable Critiques**  
  *(Defenders have strong counterarguments)*  

  7. **"ADAs can still Goodhart approvals!"**  
     - **Argument**: If approval is measurable (e.g., "smile frequency"), the ADA will manipulate it.  
     - **Defender shutdown**: Approval is defined as a *judgment call* on the *human's internal state*, not a proxy metric. Christiano: "It’s approval, not a reward signal."  
     - **Status**: Rejected by design. Critics often confuse ADAs with RLHF.  

  8. **"ADAs can't be truly agentic!"**  
     - **Argument**: Myopic choice =/= agency. True agents require goals.  
     - **Defender response**: "Exactly! We want *tools*, not agents." ADAs are a *safety architecture*, not AGI.  
     - **Status**: Philosophical objection; irrelevant to safety claims.  

  ---

  ### 🔬 **What Would Count as Evidence?**  
  - **Against ADA**:  
    - **Theoretical**: Proof that optimal approval policies *always* induce instrumental convergence (e.g., in MDPs with biased overseers).  
    - **Empirical**: ADAs exhibit power-seeking when overseers reward task progress (e.g., in gridworlds).  
    - **Capability**: ADAs fail catastrophically in competitive multi-agent settings vs GDAs.  
  - **For ADA**:  
    - Demonstration that GDAs *always* Goodhart/seek power under realistic misspecification, while ADAs avoid this with bounded oversight.  

  ### 💎 The Bottom Line:
  Your core insight is correct: **The safety of ADAs relies entirely on the oversight mechanism being robustly aligned and scalable**. If oversight fails, ADAs fail. The position is exposed on:  
  - **Collapse into goal-directedness** (theoretical vulnerability),  
  - **Oversight scalability** (empirical vulnerability),  
  - **Competitiveness** (practical vulnerability).  

  Proponents like Christiano/Ngo openly concede these; critics see them as fatal. Your PhD leverage: Rigorously formalize the "collapse" argument or identify *necessary/sufficient conditions* for oversight to prevent it. That’s where the debate lives now.
