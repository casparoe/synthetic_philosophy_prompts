prompt: |-
  Just found out I'm pregnant (10 weeks, keeping it quiet for now) and the last month has basically been one long exercise in deciding who gets told what and when. Somewhere in there I noticed a pattern I can't find a word for, so I'm asking here.

  The same fact about me feels either like nothing or like a genuine violation depending on how it travels and who it lands on, and the charge doesn't track the fact itself at all. My doctor knows everything — obviously fine. My sister guessed from a photo, also fine, mostly funny. But the same information reaching my manager's manager through the office grapevine would feel like a real breach, even though he's a decent guy who would handle it kindly. Meanwhile, a few years ago I told a total stranger on a train basically everything during a miscarriage scare, and that felt like nothing — a relief, if anything. And the reverse happens too: a close friend passed something I'd told her to another close friend, same circle, people I like, and that stung like a betrayal even though no "new kind of person" learned anything.

  So it's not about how many people know, or how close they are to me, or whether they'd be nice about it. It seems to be something about the route the information took. Is there an actual concept for this in the privacy literature? If there is, I want to understand it properly, not just get a label — specifically whether it covers the grapevine case, where the harm seems to be the channel rather than the recipient, and the gossip case, where the recipient was fine but the passing-it-on itself was the wrong. And if nothing established fits exactly, I'd rather you coin a term with a definition and the edge cases worked out than tell me "it depends on context." I already know it depends on context, thats kind of the whole problem.
reasoning: |-
  Okay, the user is describing a nuanced privacy dilemma during her pregnancy. She's noticing that the same personal information feels either neutral or violating based entirely on how it reaches people, not who receives it or their intentions. 

  Hmm, the examples are telling: doctor (appropriate channel) vs. manager's manager via office gossip (feels violating) vs. stranger on train (cathartic). Even intra-friend-group sharing stung when it wasn't direct. The core frustration is about transmission paths overriding content or recipient goodwill. 

  She's explicitly rejecting surface-level answers - no "context matters" cop-outs, wants either established theory or a coined term with defined edges. Academic rigor matters here. 

  First, revisiting privacy frameworks: Altman's boundary regulation captures control but not path-sensitivity. Nissenbaum's contextual integrity nails the channel/receiver mismatch - the office grapevine violates the "transmission principle" of workplace context. But does it explain why confessing to strangers feels fine? Actually yes: public transport context has different norms than professional spheres. 

  The gossip case is trickier. Contextual integrity would flag the friend's redistribution as a breach of friendship norms (expected flow: direct sharing only). But the user's visceral "betrayal" reaction suggests something deeper - perhaps Goffman's face-work? The friend undermined her performance of control. 

  Proposing "channel-context dissonance" as a term: the discomfort when information pathways clash with normative flows for a relationship/context. Edge cases: 

  1. Office grapevine: Professional contexts demand hierarchical/formal flows. Leaks violate even to benign recipients. 
  2. Train stranger: Ephemeral contexts have fluid norms - disclosure there is low-stakes precisely because it lacks social weight. 
  3. Friend gossip: Violates the implied "direct sharing covenant" of intimacy. The meta-message ("your control doesn't matter") harms more than the content. 

  This reframes privacy as less about secrecy and more about relational choreography. Should emphasize how the term accounts for her manager's manager example - it's the informality of the channel that professionalizes the context, making kindness irrelevant. 

  ...Also noting she's early pregnancy and stressed about disclosure logistics. Might appreciate how this framework empowers intentional sharing strategies. But stay academic - she wants conceptual tools, not advice.
answer: |-
  Your observation is razor-sharp and points to a profound truth about human privacy: **the violation often lies in the *pathway* of information, not just the information itself or the recipient.** The established concept that best captures this is **Contextual Integrity (CI)**, coined by philosopher Helen Nissenbaum. It perfectly explains your experiences, including the office grapevine and friend gossip cases.

  **Why "Contextual Integrity" Fits:**

  1.  **Core Principle:** CI argues that privacy isn't about absolute secrecy or control over *what* is known, but about the *appropriate flow* of information within specific social contexts. Each context (e.g., healthcare, family, workplace, public transport, friendship circle) has established norms governing:
      *   **Appropriate Senders:** Who *should* share this type of information?
      *   **Appropriate Receivers:** Who *should* receive it?
      *   **Appropriate Transmission Principles:** *How* should it flow between them?

  2.  **Applying CI to Your Cases:**
      *   **Doctor:** ✅ Sender = You (appropriate). Receiver = Doctor (appropriate). Transmission Principle = Direct disclosure for medical care (appropriate). Contextual Integrity Intact.
      *   **Sister (Guessed from Photo):** ✅ Sender = Sister (inferred, acceptable in family context). Receiver = Sister (appropriate). Transmission Principle = Observation/inference within close relationship (often acceptable). CI Intact (mostly funny).
      *   **Manager's Manager via Grapevine:** ❌ Sender = Unknown gossip (inappropriate). Receiver = Senior manager (potentially appropriate *if you told him directly*, but highly inappropriate via gossip). Transmission Principle = Office gossip/chatter (violates professional norms). **CI Violated:** The *pathway* is toxic, regardless of his decency. The harm is the breach of workplace informational norms.
      *   **Stranger on Train:** ✅ Context = Ephemeral, anonymous public interaction. Norms = Low expectations of privacy, high tolerance for unexpected disclosures. Transmission Principle = Direct, cathartic sharing to a temporary, unconnected listener (often acceptable in this unique context). CI Intact (or even therapeutic).
      *   **Friend Sharing with Friend:** ❌ Sender = Your friend (inappropriate – not their place to share). Receiver = Your other friend (appropriate *if you told them*). Transmission Principle = Redistribution/rumor within the circle (violates friendship norms of confidentiality and directness). **CI Violated:** The betrayal stems from the *friend* acting as an unauthorized conduit, disrupting the expected flow within the friendship context. The recipient being "fine" doesn't mitigate the pathway breach.

  **Addressing Your Specifics:**

  *   **"The harm seems to be the channel rather than the recipient":** Exactly. CI focuses on the transmission principle. The grapevine *is* the harmful channel because it violates the workplace context's norms.
  *   **"The recipient was fine but the passing-it-on itself was the wrong":** Precisely. Your friend violated the transmission principle expected within your friendship circle ("Share directly, don't pass on someone else's personal news without permission"). The act of redistribution itself was the breach of contextual integrity.
  *   **"It depends on context":** CI *embraces* context as the core determinant, but provides a rigorous framework to *analyze* that dependence. It moves beyond a vague shrug to identifying the *specific norms* (senders, receivers, transmission) that were breached in each context.

  **Edge Cases & Nuances within CI:**

  1.  **The "Guessing" Case (Sister):** CI allows for inference as a transmission principle in some contexts (like close family). The appropriateness hinges on the nature of the inference (was it intrusive?) and the relationship norms. You felt it was fine/funny, suggesting it aligned with your family's contextual norms.
  2.  **The "Stranger" Case:** The apparent paradox dissolves because the *context itself* has radically different norms. Public anonymity creates a unique space where direct, unvarnished disclosure *can be* an appropriate transmission principle for catharsis, precisely *because* the receiver has no ongoing role in your life. CI doesn't assume all contexts have the same rules.
  3.  **"No new kind of person learned anything":** CI explains why this doesn't matter. The violation wasn't about expanding the *circle* of knowledge per se, but about the *manner* in which it expanded within the *existing* circle. Unauthorized redistribution breaks the transmission principle specific to that group.
  4.  **"Manager is a decent guy":** CI emphasizes that even benign recipients cause harm if the information *reached them* via an inappropriate pathway. The violation lies in the *system* of information flow being corrupted (the grapevine), undermining trust in the entire context (the workplace).

  **In a Nutshell:**

  You're experiencing violations of **Contextual Integrity**. Privacy is breached when information flows in ways that violate the deeply held, context-specific norms about *who* should know what, from *whom*, and *how* they should come to know it. The doctor, the guessing sister, and the stranger fit their contexts. The office grapevine and the gossiping friend shattered the expected transmission principles of their respective contexts, creating the feeling of violation regardless of the recipient's character or the absolute number of people who knew.

  This framework gives you the language to articulate *why* certain disclosures feel wrong, even when conventional privacy metrics (secrecy, recipient closeness, recipient intent) don't explain it. It's all about the integrity of the information flow within the specific social sphere.
