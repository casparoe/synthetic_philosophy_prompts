prompt: |-
  Our department's value-theory workshop has hosted, for six years now, a standing argument between two factions. The comparativists hold that when a choice is genuinely hard — the life of a touring cellist against the life of a city lawyer, a hiring decision between two candidates excellent in unrelated ways — the options are still comparable: they stand in a fourth relation, neither better, worse, nor equal, but on a par, a positive tie that makes choosing for reasons possible rather than arbitrary. The incomparabilists hold that hard choices instead reveal gaps: sometimes no option is better and the options are not equal either, and there is no substantive positive relation at all; what makes the choice rational is not comparison but the fallback structure of practical reason — you may pick either option so long as the choice fits your will, your commitment, what you can live behind. Both factions accept the small-improvement argument as fatal to the simple equality reading; both deny that hard choices are coin flips; both insist we often choose for reasons in them. Where they part ways is over whether the fourth relation is real or a renaming of the gap, whether the phenomenon is better explained by vagueness or by the sensitivity of comparisons to contextual considerations, and whether the inference from "neither is better" to "there is a positive tie" is licensed or a sleight of hand.

  Draft the joint statement these two factions could sign after a good-faith adversarial collaboration conducted over a full academic year. The document should contain: (i) a numbered section of agreed claims about the data — the existence of hard choices, the failure of the better/worse/equal trichotomy to cover them, what the small-improvement argument does and does not establish, and what rational choice is like in hard cases — each claim worded so that both factions can put their names to it; (ii) a disagreements table, with every residual disagreement phrased so that the faction it describes would accept it as a fair statement of its own view, not a caricature; (iii) the cruxes — the subquestions such that settling one would move at least one faction — including at least these three: the chaining test, where one option is nudged upward by steps so small that each adjacent pair stays hard, until the endpoints plainly compare, and the question of which faction's machinery better explains why the chain doesn't transfer comparability downward; whether the fourth relation can be given an informative analysis or must be taken as primitive, and whether primitiveness here is a defect or an honest stopping point; and whether the mere fact that we deliberate and sometimes find reasons in hard cases is itself evidence of comparability; (iv) for each crux, the argument, test case, or thought experiment both factions agree would bear on it, with each faction's prediction written down in advance; and (v) an explicit verdict on which parts of the residual dispute are substantive and which are merely verbal — in particular, whether the two factions disagree about the relation between the options or only about what the word "comparable" should be reserved for.

  The joint statement itself must remain neutral, but after it, add a final section signed by no one in which you break the symmetry. State which crux you judge most likely to move either faction, whose recorded prediction on it you would bet on and why, and where you think the winning faction's position is weakest. Do not present the two factions as equally matched everywhere: where you think one side's argument is plainly stronger, commit to that judgment and defend it.
reasoning: |-
  We are drafting a joint statement resulting from an adversarial collaboration between comparativists and incomparabilists. The statement must include:
  (i) Agreed claims (numbered) about:
     - Existence of hard choices
     - Failure of the better/worse/equal trichotomy
     - What the small-improvement argument does and doesn't establish
     - What rational choice is like in hard cases

  (ii) A disagreements table, with each faction accepting the statement of their own view.

  (iii) Cruxes (at least three: chaining test, analyzability of the fourth relation, and the evidence from deliberation). For each, the agreed test and each faction's prediction.

  (iv) An explicit verdict on which parts are substantive and which are verbal.

  Then, after the joint statement, an unsigned section breaking symmetry, picking a crux, betting on a prediction, and pointing out the weakness.

  Let's structure the joint statement accordingly.

  **Joint Statement of the Value-Theory Workshop on Hard Choices**

  **Preamble**
  After a year of good-faith adversarial collaboration, the comparativist and incomparabilist factions in our workshop have reached substantial agreement on the phenomena of hard choices and the limitations of the traditional trichotomy of better, worse, and equal. We present this joint statement to clarify our common ground, pinpoint our remaining disagreements, and outline the cruxes that could resolve them.

  **(i) Agreed Claims**

  We, the undersigned, affirm the following:

  1. **Existence of Hard Choices**: There exist choices between options that are not easily resolvable by the standard trichotomy (one being better, worse, or equal to the other). These choices are characterized by the agent experiencing them as genuinely hard, where reasons for choosing one option do not clearly dominate the reasons for the other.

  2. **Failure of the Trichotomy**: In such hard choices, the options are not related as one being better than the other, nor are they equal in value. The traditional trichotomy does not adequately capture the relation (or lack thereof) between the options.

  3. **The Small-Improvement Argument**:
     a. The small-improvement argument successfully refutes the view that hard choices are always cases of equality. For if the options were equal, a small improvement to one would make it better, but in hard choices, such an improvement may not break the hardness.
     b. However, the small-improvement argument does not, by itself, establish that the options are incomparable. It only shows that they are not equal and that one is not better than the other.

  4. **Rational Choice in Hard Cases**:
     a. In hard choices, it is rational to choose either option without thereby being irrational or arbitrary.
     b. Rational choice in such cases need not be based on a prior judgment that one option is better than the other. Instead, it can be based on reasons that are not comparative in the traditional sense (e.g., reasons that appeal to the agent's commitments, will, or what they can live with).
     c. The process of deliberation in hard choices can yield reasons for choosing one option over the other, even if these reasons do not establish that the chosen option is better.

  **(ii) Disagreements Table**

  We disagree on the following points, and each faction accepts the following as a fair statement of their own view:

  | Disagreement | Comparativist View | Incomparabilist View |
  |--------------|---------------------|----------------------|
  | **The nature of the relation in hard choices** | In hard choices, the options are comparable and stand in a fourth value relation: they are *on a par*. This relation is a positive tie, distinct from equality, that allows for reasoned choice. | In hard choices, the options are incomparable: there is no substantive positive value relation (neither better, worse, equal, nor any other) between them. The choice is made rational by the structure of practical reason, not by comparison. |
  | **Explanation of the phenomenon** | The phenomenon of hard choices is best explained by the existence of a fourth relation (parity) which arises due to the multidimensionality of value and the possibility of non-cardinalizable trade-offs. | The phenomenon of hard choices is best explained by the vagueness of value predicates or by the context-sensitivity of comparisons, which can lead to gaps in comparability. |
  | **Inference from "neither better"** | The inference from "neither option is better than the other and they are not equal" to "they are on a par" is licensed and reflects a substantive relation. | The inference from "neither option is better than the other and they are not equal" to "they are incomparable" is the correct one; any positive tie is a renaming of the gap and not a substantive relation. |

  **(iii) Cruxes**

  We have identified the following cruxes, the resolution of which would significantly advance the debate. For each, we outline the agreed test or argument and each faction's prediction.

  1. **The Chaining Test**:
     - **Agreed Test**: Consider a chain of options: A, B1, B2, ..., Bn, C, where each adjacent pair (A and B1, B1 and B2, ..., Bn and C) is such that a small improvement (too small to break the hard choice) is made at each step. Start with A and B1 being hard (neither better, not equal), and end with C being clearly better than A. The question is: does this chain force comparability between A and B1? And if not, why?
     - **Comparativist Prediction**: The chain does not force comparability downward. The relation of being on a par is non-transitive. Thus, even though A and C are comparable (C is better), A and B1 may remain on a par. The machinery of parity explains this by allowing that small improvements can accumulate without affecting the parity relation until a threshold is crossed.
     - **Incomparabilist Prediction**: The chain does not force comparability downward. The gap between A and B1 remains because the small improvements are contextually too minor to establish a relation. The incomparability is preserved because the chain does not transfer comparability in a transitive way. The machinery of gaps and context-sensitivity explains this without positing a new relation.

  2. **Analyzability of the Fourth Relation**:
     - **Agreed Test**: Can the relation of being "on a par" be given an informative analysis (e.g., in terms of the existence of reasons of a certain kind, or in terms of the structure of value dimensions) that does not collapse into one of the three traditional relations or into incomparability? Or must it be taken as primitive?
     - **Comparativist Prediction**: Parity can be analyzed informatively, for instance, as a relation that holds when the options are in the same neighborhood of a multi-dimensional value space and neither dominates the other nor is cardinally equivalent. It is not a defect to have a primitive relation, but an analysis is possible and desirable.
     - **Incomparabilist Prediction**: Any attempt to analyze the fourth relation will either collapse into one of the traditional relations (which we know it doesn't) or reveal that it is merely a disguised form of incomparability. Taking it as primitive is a defect because it multiplies relations without necessity. The gap view is more parsimonious.

  3. **Evidence from Deliberation**:
     - **Agreed Test**: Does the mere fact that we deliberate and sometimes find reasons in hard cases (reasons that are not merely arbitrary) provide evidence that the options are comparable? Or can such deliberation and reason-finding occur even in the absence of comparability?
     - **Comparativist Prediction**: Deliberation and the finding of reasons in hard cases are evidence of comparability because they indicate a positive tie (parity) that allows for reasoned choice. If the options were incomparable, no such reasons could be found (beyond arbitrary ones).
     - **Incomparabilist Prediction**: Deliberation and reason-finding can occur without comparability. The reasons found are not comparative but are based on the agent's will, commitments, or practical identity. Thus, the presence of reasons does not imply a positive tie; it only shows that practical reason can operate in the absence of comparability.

  **(iv) Verdict on Substantive vs. Verbal Disagreements**

  We agree that the disagreement about whether to call the relation in hard choices "on a par" or "incomparable" is partly verbal. Specifically, both factions agree that the options are not related by the traditional trichotomy and that choice is rational without one being better. However, we also agree that there is a substantive disagreement: 

  - The comparativists hold that there is a substantive positive relation (parity) that explains why we can choose for reasons. 
  - The incomparabilists hold that there is no such relation and that the appearance of a tie is an artifact of the gap.

  Thus, the core disagreement is not merely about the word "comparable" but about the existence of a fourth value relation. The verbal aspect concerns the labeling: whether the term "comparable" should be reserved for cases where the trichotomy holds or extended to include parity. But the substantive heart is whether the phenomenon requires a positive tie or is adequately explained by a gap.

  **Signed:**

  [Comparativist Faction]  
  [Incomparabilist Faction]

  ---

  **Symmetry-Breaking Section (Unsigned)**

  Having observed the year-long collaboration, we now break the symmetry to offer an assessment of the cruxes and the relative strength of the positions.

  **Most Likely Crux to Move a Faction:** The chaining test is the most promising crux because it directly challenges the machinery of each view. The comparativist prediction that parity is non-transitive and the incomparabilist prediction that gaps are context-sensitive both explain the chain, but the test can be refined to probe the robustness of each explanation.

  **Prediction Bet:** We would bet on the incomparabilist prediction for the chaining test. The chaining test can be designed so that the context shifts with each step, which the incomparabilist machinery naturally accommodates. The comparativist must rely on the non-transitivity of parity, which, while possible, seems less flexible when the chain is long and the endpoints are clearly comparable. The incomparabilist view that each step is a gap and that gaps do not aggregate in a transitive manner is more parsimonious and avoids the need for a new relation.

  **Weakness in the Winning Faction's Position:** Even if the incomparabilist view handles the chaining test well, its weakest point is explaining the phenomenology of deliberation. In hard choices, agents often feel they are weighing reasons that are commensurable enough to allow for a non-arbitrary choice. The incomparabilist must reduce this to non-comparative reasons (will, commitment), which may not fully capture the sense that the options are being compared in a substantive way. The comparativist account of parity better captures this phenomenology.

  **Overall Judgment:** On balance, the incomparabilist position is stronger on the chaining test and parsimony, but the comparativist position is stronger on capturing the deliberative experience. However, we judge that the chaining test is the more decisive crux because it tests the structural coherence of the views. The incomparabilist argument is plainly stronger in handling chains and avoiding the proliferation of relations. But we acknowledge that the comparativist account has an edge in the phenomenology of deliberation. Therefore, the overall debate is not equally matched: the incomparabilist view has a slight advantage on the cruxes we have identified, but it must address the challenge of explaining deliberation without comparability more convincingly.
answer: |-
  ### Joint Statement on Hard Choices  
  **Signed by the Comparativist and Incomparabilist Factions**  

  #### (i) Agreed Claims  
  We affirm the following:  
  1. **Existence of Hard Choices**: Genuinely hard choices exist, where neither option is clearly superior, inferior, or equal (e.g., choosing between a cellist’s life and a lawyer’s life). These cases resist resolution via the traditional trichotomy of "better," "worse," or "equal."  
  2. **Failure of the Trichotomy**: In hard choices, the options are not related by "better than," "worse than," or "equal in value." The trichotomy is descriptively inadequate for these cases.  
  3. **Small-Improvement Argument**:  
     - The argument successfully refutes the view that hard choices are always cases of equality: A small improvement to one option (e.g., slightly enhancing the cellist’s prospects) need not make it better than the other, proving the options are not equal.  
     - It does **not** establish incomparability: The argument only negates equality and strict betterness; it is silent on whether a "fourth relation" exists or whether there is a "gap."  
  4. **Rational Choice in Hard Cases**:  
     - Rational choice in hard cases does not require a prior judgment that one option is better.  
     - Choosing for reasons (e.g., "I can live with this," "It aligns with my commitments") is possible without arbitrariness, even absent a decisive comparative verdict.  

  ---

  #### (ii) Disagreements Table  
  *Each faction endorses its column as a fair statement of its own view.*  

  | Issue | Comparativist View | Incomparabilist View |  
  |-------|--------------------|-----------------------|  
  | **Nature of the relation** | Options in hard choices are *comparable* and stand in a fourth relation: *on a par*. This positive tie permits reasoned choice. | Options in hard choices are *incomparable*: No substantive value relation holds. Rational choice relies on practical reason’s fallback structure (will/commitment). |  
  | **Explanation of hardness** | Hard choices arise from multidimensional value structures where trade-offs resist cardinalization, yielding parity. | Hard choices stem from vagueness in value predicates or context-dependent thresholds, creating gaps in comparability. |  
  | **Inference from "neither better"** | "Neither better nor equal" implies a *positive tie* (parity). This inference is licensed by the phenomenology of choice. | "Neither better nor equal" implies a *gap* (no positive tie). The "tie" is a misleading renaming of the absence of a relation. |  

  ---

  #### (iii) Cruxes  
  *For each crux, we agree on the test and record predictions.*  

  1. **Chaining Test**:  
     - **Test**: Take options A and B in a hard choice. Create a chain: A, A+, A++, ..., A++++ (where each "+" is a tiny improvement). If A++++ is clearly better than A, does this force comparability between A and A+?  
     - **Comparativist Prediction**: No. Parity is nontransitive; endpoints can be comparable without forcing comparability down the chain. Each adjacent pair remains on a par.  
     - **Incomparabilist Prediction**: No. Gaps are context-sensitive; minimal improvements preserve incomparability between neighbors. The chain’s endpoint comparability is local and non-transferable.  

  2. **Analyzability of the Fourth Relation**:  
     - **Test**: Can "on a par" be informatively analyzed (e.g., in terms of reasons or value dimensions), or must it be primitive?  
     - **Comparativist Prediction**: Parity can be analyzed (e.g., as "closeness in a similarity interval"). Primitiveness is acceptable if analysis fails, but it is not a defect.  
     - **Incomparabilist Prediction**: Parity resists noncircular analysis. Primitiveness is a defect; it disguises incomparability and violates parsimony.  

  3. **Deliberation as Evidence**:  
     - **Test**: Does deliberation/finding reasons in hard choices imply comparability?  
     - **Comparativist Prediction**: Yes. Deliberation presupposes a positive tie; reasons track parity.  
     - **Incomparabilist Prediction**: No. Deliberation uses noncomparative reasons (e.g., "fit with will"). It proves practical reason operates, not comparability.  

  ---

  #### (iv) Verdict on Substantive vs. Verbal Disagreements  
  - **Verbal Disagreement**: Whether "comparable" applies to hard choices. Comparativists use it broadly (for parity); incomparabilists reserve it for trichotomy-covered cases.  
  - **Substantive Disagreement**: Whether a *positive value relation* (parity) exists between options. This is not reducible to semantics; it concerns the ontology of value relations.  

  ---

  ### Unsigned Symmetry-Breaking Assessment  
  *(Not part of the joint statement)*  

  **Most Likely Crux to Move a Faction**: The **chaining test** is likeliest to shift positions. It directly challenges the explanatory power of each view’s core machinery (parity’s nontransitivity vs. gap context-sensitivity). A well-designed empirical test (e.g., surveying deliberators on chains of career choices) could force one faction to concede ground.  

  **Prediction to Bet On**: The **incomparabilists’ prediction** for the chaining test. Context-sensitivity cleanly explains why comparability fails to transmit: Even minuscule changes alter the evaluative context, preventing "contagion" of comparability. The comparativist appeal to nontransitivity feels ad hoc—why should parity hold *only* between adjacent links? Incomparabilists also win on parsimony, avoiding a new primitive relation.  

  **Winning Faction’s Weakness**: **Incomparabilists** struggle to explain why deliberation in hard choices *feels comparative*. If no relation exists, why do agents describe weighing options (e.g., "artistic fulfillment vs. financial security") as if they inhabit a shared evaluative space? Comparativists better capture this phenomenology.  

  **Overall Imbalance**: The **incomparabilist** view is stronger. It handles the chaining test more elegantly, avoids multiplying value relations, and aligns with how contextual shifts dissolve hardness (e.g., a lawyer’s salary jump making the choice easy). Comparativists overreach in reifying "parity"—a useful label but ontologically dubious. Still, incomparabilists must address the intuition that hard choices involve *rival reasons*, not just will-based picks. If they cannot, comparativists retain an edge on the deliberative experience.
