prompt: |-
  I'm an MA philosophy student taking a seminar on moral uncertainty, and on the side I sit on my student union's societies funding board. Every week we vote on small grants (£30–£500) to student clubs, ten minutes per application, and my six fellow board members have zero interest in theory. The problem is mine: my roughly consequentialist instincts, my fairness/deontological instincts, and my solidarity commitments keep giving different verdicts on the same application, and just going with whichever feeling is loudest is exactly the "my favorite theory" move the seminar warns about. So please turn what the moral uncertainty literature has that's actually usable — expected choice-worthiness, variance voting/normalization across theories, moral hedging, the bets approach, and the intertheoretic comparison problem — into a decision procedure I can run alone in ten minutes before each vote. I want the questions in order, how to score and combine my disagreeing moral selves, what counts as decisive, where the procedure should give up and hand the decision back to plain conscience, and an honest note on which steps are just judgment dressed up as math. Then run it on two applications we actually got: a big, well-funded sports club asking £400 travel money benefiting 40 members, and a tiny club for student carers asking £120 for childcare at their meetings. One of the runs should end in an answer I'll hate but have to accept, and be upfront about what the procedure fundamentally can't settle — I suspect "pick your own normalization" is where alot of this bottoms out, tell me if the literature has anything better than that.
