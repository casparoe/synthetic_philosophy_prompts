prompt: |-
  My roommate has an argument that expected value reasoning eats itself, and I can't find the hole in it.

  (1) Rational choice under uncertainty is EV maximization: pick the act with the highest sum of probability-times-value over outcomes. (2) For any probability p > 0, however small, and any act you might do, there is a possible outcome of that act with enough value that p times that value beats the EV of any ordinary alternative. (3) Every outcome that isn't strictly logically impossible deserves some nonzero credence -- assigning exactly zero to something not ruled out by logic is dogmatism. (4) So for any act A, you can name a possible payoff of A -- say A somehow triggers the creation of a simulation with 10^40 flourishing lives -- such that, given any nonzero credence in that payoff, A has higher EV than anything sensible you could do instead. (5) Therefore EV maximization, taken seriously, ranks the fanatic gamble above studying for your exam, donating to bednets, whatever -- not occasionally but always, since for every option there's a more extreme possibility that dominates it. (6) And it's not even stable: for any gamble you finally pick, there's an even more fanatical one that outranks it, so EV maximization never actually issues in a choice. (7) So (1) is false.

  He concludes we should scrap EV and go with something like satisficing, or just discount tiny probabilities to zero. My problem is I want to keep (1) -- it seems to follow from pretty basic axioms about preferences over gambles -- but I honestly can't tell whether the rot is in (3), or in the slide from "you can name a possible payoff" in (4) to "that payoff is in your expectation" in (5), or somewhere I haven't looked. Which step do I give up, why did it look fine, and what do I pay? And if he's right that the theory never issues in a choice, is that actually an objection, or does any decision theory have some tie-breaking problem like this at the edges?
reasoning: |-
  Okay, the user is grappling with their roommate's argument against expected value (EV) maximization. The roommate claims that EV reasoning self-destructs because, for any action, you can imagine an outcome with such high value that, even with minuscule probability, it dominates all sensible alternatives. This leads to fanatical choices and indecision. The user wants to preserve EV maximization but can't find the flaw in the argument. They're considering steps (3) or (4) as potential weak points but need clarity.

  First, I need to recall the roommate's steps. Premise (1) states that rational choice is EV maximization. (2) argues that for any probability p>0, a high enough value can make p*V exceed other EVs. (3) says we must assign nonzero probability to anything not logically impossible. (4) combines these: for any act, inventing a huge payoff (like creating 10^40 simulated lives) with nonzero credence makes its EV beat alternatives. (5) concludes this forces always choosing fanatical gambles. (6) says it's unstable because you can always imagine a better gamble. (7) rejects EV maximization.

  The user wants to save EV and is questioning premises. The key flaw is indeed in (3). Assigning nonzero probability to every logical possibility isn't necessary. In real decision-making, we use probability distributions that ignore remote possibilities. This isn't dogmatism but practicality. For instance, we don't seriously consider that studying for an exam might create simulated universes. Ignoring such scenarios is rational under bounded rationality or by assigning them probability zero without logical contradiction.

  Step (4) is problematic too. It assumes that naming a possible payoff means it must be included in the EV calculation with nonzero probability. But decision theory doesn't require considering every arbitrary scenario. The burden is on the claimant to provide evidence. Without evidence, these payoffs aren't part of the model. EV maximization works within a structured possibility space, not unlimited fantasy.

  Also, the stability issue in (6) arises only if we entertain every imagined payoff. Real agents use models that exclude such extremes. Even without that, EV comparisons are between defined options. If an option has a finite EV, it can be chosen over others with lower EVs, avoiding infinite regress. The problem only manifests if all options have infinite EV, which isn't the case in practical scenarios.

  The user might be concerned about theoretical purity versus practicality. They mention satisficing or discounting tiny probabilities. But rejecting EV entirely isn't necessary. The solution is to refine probability assignments, recognizing that not all logical possibilities are epistemically possible. This preserves EV for realistic cases without leading to fanaticism.
answer: |-
  The flaw lies primarily in **premise (3)**: Assigning *exactly zero* credence to outcomes not ruled out by strict logical impossibility is **not necessarily dogmatism**, and insisting on nonzero probabilities for *every conceivable* outcome leads to absurdity. This is where your roommate's argument collapses. Let's break it down step-by-step:

  1.  **Premise (1) is Correct (Fundamentally):** EV maximization, derived from axioms like the VNM axioms, *is* the standard normative model for rational choice under risk/uncertainty *when probabilities and utilities are well-defined and finite*. It doesn't inherently "eat itself."

  2.  **Premise (2) is Technically True (But Misleading):** Yes, for any fixed probability p>0, you can imagine a sufficiently large value V such that p*V exceeds any finite EV. This is simple arithmetic. The problem arises when premise (3) forces you to *assign* that p>0 to *every* conceivable V.

  3.  **Premise (3) is the Fatal Flaw (The Rot):** This premise confuses *logical possibility* with *epistemic possibility deserving nonzero credence*.
      *   **Dogmatism vs. Rational Ignorance:** Assigning zero probability isn't automatically "dogmatic." It reflects *epistemic boundaries*. There are infinitely many logically possible outcomes (e.g., "studying for your exam triggers the creation of exactly N flourishing simulated lives" for *every* N, or "a demon rewards you with $N if you pick option A", etc.). Assigning a *specific*, *measurable* nonzero probability to *each and every one* of these infinite possibilities is **impossible**. Your probability distribution would become incoherent (probabilities wouldn't sum to 1) or degenerate (infinitesimal probabilities everywhere).
      *   **Burden of Evidence/Plausibility:** Rational credence requires *some* basis, however weak. Pure logical conceivability, absent *any* evidence, mechanism, or reason to think it's remotely plausible, doesn't *deserve* a specific nonzero credence. The claim "Action A *might* create 10^100 simulated lives" might be *logically possible*, but without *any* evidence, model, or causal pathway suggesting this is a *real* (even if extremely improbable) consequence of A, it's epistemically irresponsible to assign it a specific p>0 instead of lumping it into an amorphous category of "other inconceivable nonsense" assigned p=0 *for practical purposes*.
      *   **Practical Modeling:** Decision theory operates within a *model* of the world and the possible outcomes of actions. This model necessarily *excludes* outcomes deemed so implausible as to be irrelevant for practical decision-making. Including every logically possible outcome makes modeling impossible. We *rationally* set p=0 for outcomes lacking any conceivable causal link or evidence.

  4.  **Premise (4) Fails Because (3) Fails:** You can *name* a possible payoff (like the 10^40 lives), but premise (3) incorrectly demands you *must* assign it some specific p>0. If you rationally assign p=0 (because it's pure fantasy with no grounding in evidence or plausible mechanism), then this named payoff *does not factor into the EV calculation at all*. Its p*V term is 0. It doesn't dominate anything.

  5.  **Therefore, Conclusions (5) and (6) Don't Follow:** Because you are rationally justified in assigning p=0 to these arbitrarily conjured fanatical payoffs for ordinary actions (studying, donating to bednets), the EV of sensible actions remains finite and comparable. Studying has a high EV based on plausible outcomes (learning, passing the exam, career prospects). Donating to bednets has a high EV based on evidence about lives saved per dollar. Their EVs are not inflated by fantastical nonsense assigned p=0. You *can* choose the act with the highest *plausible, finite* EV.
      *   The "instability" (6) only arises if you *insist* on assigning *some* p>0 to *every* named payoff. If you rationally assign p=0, the instability vanishes. For any *defined* set of gambles with finite EVs based on plausible outcomes, EV maximization picks the highest one.

  6.  **Why Premise (3) Looked Fine:**
      *   **Appeal to Open-Mindedness:** It intuitively feels dogmatic to say "That's impossible!" about something logically conceivable. However, rational belief isn't just about avoiding *absolute certainty of falsehood*; it's about proportioning belief to evidence. Assigning p=0 to unfalsifiable, evidence-free fantasies *is* rational open-mindedness – you'd change your mind *if* evidence emerged, but without it, you correctly ignore them.
      *   **Misapplication of Regularity Principle:** Premise (3) resembles the "Regularity Principle" (assign positive probability to all possible outcomes). This principle is controversial and largely rejected precisely because it leads to the problems your roommate highlights: incoherent priors, inability to learn from evidence properly, and fanaticism. Bayesianism generally *does not* require strict regularity.

  **What You Pay by Rejecting Premise (3):**

  1.  **Loss of Theoretical Purity at the Infinitesimal Margins:** You acknowledge that decision theory needs a pragmatic cutoff. Not *every* conceivable logical possibility gets modeled with a specific probability. You accept that p=0 can be used for outcomes deemed *epistemically impossible enough to ignore*.
  2.  **Need for a (Pragmatic) Theory of "Relevant Possibilities":** You need a way to determine which possibilities deserve inclusion in your decision model (with p>0) and which can be safely omitted (effectively p=0). This isn't a flaw in EV theory itself, but a necessary part of *applying* it to the real world. Factors include:
      *   *Plausibility:* Is there *any* known mechanism, analogy, or evidence?
      *   *Specificity:* Is the outcome clearly defined and distinguishable?
      *   *Practical Relevance:* Could including it significantly change the decision?
      *   *Bounded Rationality:* We *must* simplify complex realities.

  **Addressing the Tie-Breaking / Indecision Concern (Point 6/7):**

  *   Your roommate is right that *if* you accept premise (3), EV maximization becomes unstable and fails to issue a choice. **However, this is a fatal objection *only to premise (3)***, not to EV maximization itself. The instability is *caused* by the pathological demand to assign specific nonzero probabilities to an infinite set of arbitrarily valuable fantasies.
  *   **No General Tie-Breaking Problem:** In standard EV maximization with *well-defined, finite* possibilities and probabilities, ties are rare. If ties occur, standard decision theory allows for any tie-breaking rule (random choice, secondary criteria, status quo bias). This minor edge case is utterly different from the *fundamental, pervasive instability* created by premise (3). No major decision theory (maximin, satisficing, prospect theory) has a problem remotely like the one induced by premise (3).

  **Conclusion:**

  Give up **premise (3)**. Rational credence does *not* require assigning specific nonzero probability to every outcome not strictly ruled out by logic. Doing so is impossible, incoherent, and leads directly to fanaticism and indecision. Assigning p=0 to unfathomable, evidence-free fantasies like "studying creates 10^40 simulated lives" is not dogmatism; it's rational modeling. This preserves the core power and rationality of EV maximization (premise 1) for real-world decisions based on plausible outcomes and evidence, while avoiding the self-destruction your roommate describes. You pay the modest price of acknowledging that applying EV theory requires pragmatically defining a relevant possibility space, a necessity for *any* practical decision theory.
