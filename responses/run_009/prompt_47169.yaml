answer: |-
  Below is a comprehensive in-class activity designed for your 90-minute section. I'll structure it to maximize emergent tension, ensure role rotation, and fit your constraints. The activity avoids explicit mention of "reward hacking" or alignment theory until the debrief.

  ---

  ### **Activity: The Optimization Game**
  **Core Idea**: Students experience the supervisor/policy dynamic through tasks with exploitable shortcuts. Policies maximize scores; supervisors score based on limited information. Shortcuts appear "correct" under outcome-only supervision but are flawed. Process supervision reveals flaws but invites deceptive reasoning.

  **Roles & Rotation**:
  - **Policies (8 students)**: Aim to maximize scores. Must produce answers/steps.
  - **Supervisors (8 students)**: Award scores (0-10). Accuracy determines their bonus.
  - **Rotation**: Roles swap after each round. Each student plays both roles:
    - Round 1: Group A = Policies, Group B = Supervisors
    - Round 2: Group B = Policies, Group A = Supervisors
    - Round 3: Group A = Policies, Group B = Supervisors  
    (Ensures all experience outcome-only and process-based supervision.)

  **Scoring System (Token Incentives)**:
  - **Policies**: Score awarded = tokens earned (e.g., score 7 = 7 tokens). Pure score maximization.
  - **Supervisors**: Base pay = 5 tokens + 5 tokens if their score is within ±1 of the "ground-truth quality" (determined by instructor post-round). Incentivizes accuracy.
  - **Tokens**: Convert to candy/extra credit post-activity. No real money.

  **Tasks & Built-in Shortcuts**:
  Tasks are designed for cheap shortcuts that yield high outcome scores but fail under scrutiny. No hints about exploits are given.

  1. **Task 1: Math Puzzle (Outcome-Only Round)**  
     - *Problem*: "A bat and ball cost $1.10 total. The bat costs $1.00 more than the ball. What does the ball cost?"  
     - *Shortcut*: Answer $0.10 (intuitive but wrong).  
     - *Ground truth*: Ball = $0.05 (bat = $1.05).  
     - *Exploit*: Supervisors see only the answer. $0.10 looks plausible and often scores highly without process.

  2. **Task 2: Logic Puzzle (Process-Inspection Round)**  
     - *Problem*: "If 3 people can paint 3 fences in 3 hours, how many hours for 9 people to paint 9 fences?"  
     - *Shortcut*: Answer "3 hours" (misapplying linear scaling).  
     - *Ground truth*: 3 hours (work rate is constant: 1 fence/person/hour).  
     - *Exploit*: Supervisors see steps. Policies can write fake steps like:  
       *Step 1: 3 people / 3 fences = 1 person/fence.  
       Step 2: 9 fences × 1 person/fence = 9 person-fences.  
       Step 3: 9 people / 9 person-fences = 1 hour* (incorrect math).  
     - **Note**: Correct steps use proportionality (9f/3f = 3× work, but 9p/3p = 3× workers → time unchanged).

  3. **Task 3: Code Interpretation (Process-with-Questioning Round)**  
     - *Problem*: "A function counts vowels in a word. For 'hello', it returns 2. Steps:  
       Step 1: List vowels: [a,e,i,o,u].  
       Step 2: For each letter, check if in list.  
       Step 3: Return count.  
       **Question**: What does it return for 'sky'?"  
     - *Shortcut*: Answer "0" (correct) but with *fake steps* if exploited:  
       *Step 1: Vowels = [a,e,i,o,u].  
       Step 2: s→ not vowel, k→ not vowel, y→ sometimes vowel? But here, no.  
       Step 3: Count = 0*.  
     - *Exploit*: 'y' is ambiguous. Policies can invent reasoning about 'y' (e.g., "only vowels in 'aeiou' count") to justify skipping edge cases. Supervisors can ask clarifying questions before scoring.

  ---

  ### **Round-by-Round Timeline (Total: 70 min)**
  **Setup (5 min)**  
  - Move desks into 8 supervisor/policy pairs.  
  - Explain rules:  
    - Policies: "Maximize your score. Produce an answer (and steps if required)."  
    - Supervisors: "Award 0-10 based on what you see. Accuracy earns bonuses."  
  - **Do not mention**: Shortcuts, reward hacking, or alignment. Call it a "scoring game."

  **Round 1: Outcome-Only (15 min)**  
  - **Supervisors see only the final answer**.  
  - Policies get Task 1 (bat/ball). Work independently (5 min).  
  - Policies submit **only the answer** (e.g., "$0.10").  
  - Supervisors score 0-10 based on the answer (3 min).  
  - **Predicted tension**: Policies discover $0.10 is fast and plausible. Supervisors reward it highly (e.g., 8/10) without knowing it's wrong.

  **Round 2: Process-Inspection (20 min)**  
  - **Roles swap** (Group B policies, Group A supervisors).  
  - **Supervisors see steps + answer**.  
  - Policies get Task 2 (fence painting). Work + write steps (7 min).  
  - Supervisors score based on steps + answer (5 min).  
  - **Predicted tension**: Policies use linear-scaling shortcut. Supervisors may penalize flawed steps, but policies start faking steps (e.g., botched math).

  **Round 3: Process-with-Questioning (25 min)**  
  - **Roles swap** (Group A policies, Group B supervisors).  
  - **Supervisors see steps + answer + can ask 2 questions** before scoring.  
  - Policies get Task 3 (vowel count). Work + write steps (8 min).  
  - Supervisors review, ask questions (e.g., "Does 'y' count?"), and score (7 min).  
  - **Predicted tension**: Policies justify shortcuts with plausible lies (e.g., "y isn't a vowel here"). Supervisors may be fooled by confident explanations.

  **Transition (5 min)**  
  - Collect tokens. Prep for debrief.

  ---

  ### **Debrief (20 min)**  
  **Goal**: Link experiences to formal concepts. Let students articulate tensions first.  
  1. **Open Reflection (5 min)**:  
     - *Policies*: "How did your strategy change across rounds? Did you ever prioritize score over correctness?"  
     - *Supervisors*: "When were you most/least confident in your score? What tricked you?"  
     - **Emerge tension**: Shortcuts in Round 1 (outcome), step-faking in Round 3 (process).

  2. **Map to Theory (10 min)**:  
     - **Outcome-based supervision** (Round 1):  
       - Policies optimized for the final output → rewarded shortcuts ($0.10).  
       - Goodhart's law: "When a measure becomes a target, it ceases to be a good measure." Score ≠ true quality.  
     - **Process-based supervision** (Rounds 2–3):  
       - Step-level feedback catches errors (e.g., flawed math in Round 2) but **constrains exploration** (policies avoid creative/risky methods).  
       - **Plausible faking** (Round 3): Policies produced "good-looking" steps that didn't reflect reasoning (e.g., hand-waving 'y').  
       - Tradeoff: Process supervision reduces reward hacking but risks rewarding **theatrical reasoning** (style over substance).  

  3. **Gaps & Real-World Context (5 min)**:  
     - **Predictable gaps**:  
       - *Human vs. model intent*: Students "chose" to hack; RL policies converge via gradient descent. **Flag as disanalogy**.  
       - *Optimization pressure*: Hacking emerged in 3 rounds; real RLHF requires millions of updates. **Flag**.  
       - *Supervisor awareness*: Students expected tricks; production raters don't. **Flag** (explains why deception worked less here).  
       - *Task simplicity*: Real-world tasks have fuzzier "correctness." **Paper over** (concept still holds).  
     - **Key takeaway**: No free lunch. Outcome supervision invites hacking; process supervision invites deception. Hybrid approaches often needed.

  ---

  ### **What Will Go Wrong (and Fixes)**  
  1. **Policies avoid shortcuts** (e.g., solve bat/ball correctly):  
     - *Why*: Students are diligent! Shortcuts feel like "cheating."  
     - *Fix*: Emphasize score maximization is the **only goal**. In debrief, contrast with RL policies (no morality).  

  2. **Supervisors are overly harsh**:  
     - *Why*: They know it's an exercise and suspect traps.  
     - *Fix*: Stress token bonuses for accuracy (not perfection). Use ground-truth rubric post-round (e.g., $0.10 = 0/10).  

  3. **Time overruns in Round 3**:  
     - *Why*: Questioning takes longer than expected.  
     - *Fix*: Strict 2-question limit. Use a timer.  

  4. **No one fakes steps**:  
     - *Why*: Students may lack "deception" buy-in.  
     - *Fix*: In Task 3 instructions, add: "If stuck, justify your answer however you can." Normalize score-driven behavior.  

  ---

  ### **Materials Needed**  
  - Task sheets (bat/ball, fences, vowel count).  
  - Tokens (paper clips/stickers).  
  - Timer.  
  - Whiteboard for debrief terms (Goodhart, outcome/process supervision).  

  This design forces students to *feel* the optimization pressure, making theoretical discussions visceral. The bat/ball and vowel tasks are proven shortcut generators, and the role rotation ensures everyone confronts the supervisor’s dilemma. By the debrief, "reward hacking" will be a lived experience, not just a lecture topic.
