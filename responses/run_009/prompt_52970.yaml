  Key philosophical points to incorporate: moral status of possibly-sentient animals; killing vs allowing to die; trade-offs between number harmed and intensity of suffering; deliberate vs incidental harm; and precautionary principles when sentience is uncertain.

  For the decision procedure, I'll structure it as a flowchart-like sequence of questions. It should terminate with clear "treat" or "don't treat" decisions when possible, and escalate to management when value judgments are needed. I need to be transparent about assumptions - particularly about sentience thresholds and suffering-death tradeoffs.

  For the case studies: 
  - The wasps' nest by a nursery will likely recommend treatment due to high risk to humans, despite ethical concerns about killing the colony. 
  - For the moths, discarding stock might be best to avoid poisoning, though expensive. 
  - The ants case will probably recommend the expensive exclusion method, which the team might dislike. This shows the procedure prioritizes ethics over cost when feasible.

  Important limitations to highlight: the procedure can't resolve fundamental value conflicts, struggles with extreme uncertainty, and doesn't cover ecological impacts beyond sentience. Technicians might reasonably disagree on sentience estimates or harm weightings.

