prompt: |-
  i'm taking a course on Cold War historiography and we keep coming back to the "who started it" question and honestly it feels like nobody's actually disagreeing about facts anymore. you've got the orthodox camp saying the USSR started it (soviet expansionism, stalin's ideology), the revisionists in the 60s/70s saying the US did (open door economics, atomic diplomacy, refusing to accomodate soviet security needs), and then the post-revisionists saying it was basically structural and both superpowers locked themselves in. here's my working theory, and i want you to treat it as a hypothesis, not confirm it just because i said it: the whole fight is really about different counterfactual baselines. the orthodox side is implicitly comparing stalin to a normal status-quo leader ("if he'd just been satisfied with eastern europe, no cold war"), while the revisionists implicitly compare the US to a power that could have made soviet security concerns feel legitimate ("if washington had been less expansive, no cold war"). so "who started it" ends up meaning "who first departed from MY baseline," and the baselines are doing all the work. so what kind of disagreement is this, actually? substantive, verbal, or two questions under one heading? is it a hidden factual question (what stalin actually intended), a difference in standards for attributing blame to states at all, or bedrock assumptions about what a great power is entitled to want? and given your diagnosis, is "who started it" even the right question, or should historians ask something else entirely? act as a careful historian of this debate, and separate what's settled among cold war historians from what's genuinely contested -- don't present one camp's reading of the evidence as if it were consensus. lead with your bottom line in the very first sentence, then the reasoning, no preamble and no restating of my question.
