answer: |-
  **The core disagreement over "who started the Cold War" stems primarily from divergent, often implicit, normative assumptions about legitimate great power behavior and security needs, rather than factual disputes about events.** While significant factual consensus exists on *what happened* (e.g., Soviet imposition of communist regimes in Eastern Europe, US Marshall Plan, Truman Doctrine, Berlin Blockade, formation of NATO/Warsaw Pact), the interpretation of *why* these events occurred and their moral/political significance remains deeply contested due to foundational assumptions:

  1.  **Assumptions about Legitimate Security:** Orthodox historians implicitly assume the USSR's security needs were largely met by controlling Eastern Europe and that further expansion/ideological conflict stemmed from inherent Soviet expansionism/ideology. Revisionists implicitly assume Soviet security needs (post-devastation) were genuinely existential and the US refusal to accommodate them (e.g., reparations, spheres of influence) or its own expansive global economic/security aims were the primary provocation. Post-revisionists often see both sets of security concerns as structurally generated and legitimate within their respective frames, leading inevitably to friction.
  2.  **Assumptions about "Normal" State Behavior:** As your hypothesis notes, the counterfactual baselines differ radically. Orthodox scholars judge Stalin against a hypothetical "status-quo" power satisfied with a defensive sphere. Revisionists judge the US against a hypothetical power willing to share global influence and accept Soviet security needs as paramount in its near-abroad. *Who "started it" depends entirely on which baseline departure is deemed the crucial initiating act.*
  3.  **Attribution of Blame & Agency:** The debate reflects profound differences in how historians attribute causality and moral responsibility to states. Is the primary driver individual leadership ideology (Stalin's paranoia/ambition)? Systemic economic imperatives (US "Open Door" capitalism)? Structural insecurity (bipolarity, security dilemmas)? The weight given to these factors determines where blame is placed.

  **Settled vs. Contested:**

  *   **Settled:** Key chronological sequences (e.g., Soviet consolidation in Eastern Europe *preceding* major US containment initiatives like the Truman Doctrine/Marshall Plan, though US economic pre-eminence and atomic monopoly were earlier facts). Broad agreement on the *mechanisms* of escalation (security dilemma, ideological confrontation, alliance formation).
  *   **Genuinely Contested:**
      *   **Stalin's Intentions:** Was he fundamentally defensive seeking a buffer, inherently expansionist aiming for global revolution (or at least European dominance), or opportunistic? Evidence (e.g., from Soviet archives) is interpreted differently.
      *   **US Motivations:** Was containment a defensive response to Soviet aggression, or an aggressive effort to shape a global capitalist order under US hegemony? How central was ideology vs. economics vs. geopolitics?
      *   **The "Point of No Return":** Which specific actions (e.g., Soviet actions in Poland 1944-45, the Long Telegram/Kennan, the Truman Doctrine, the Czech Coup 1948, the Berlin Blockade, the formation of NATO) constituted the irreversible initiation of the Cold War? This hinges entirely on the underlying assumptions above.
      *   **The Primacy of Structure vs. Agency:** To what extent were leaders/ideologies driving forces versus prisoners of structural imperatives (bipolarity, security dilemma, capitalist/communist system logic)?

  **Is "Who Started It" the Right Question?**

  **No, framing the inquiry as "who started it" is fundamentally problematic and often counterproductive.** It inherently:
  *   **Oversimplifies:** Reduces a complex, multi-causal, interactive process spanning years to a single point of origin or blame.
  *   **Presumes Malign Agency:** Implies a conscious, blameworthy act of initiation, downplaying structural forces, mutual misperception, and the escalatory logic of the security dilemma where actions deemed defensive by one are seen as offensive by the other.
  *   **Perpetuates Polemic:** The question's phrasing lends itself to the very partisan battles (Orthodox vs. Revisionist) that newer scholarship seeks to move beyond.

  **A More Productive Approach:** Historians increasingly focus on questions like:
  *   How did the complex interaction of ideology, geopolitics, economics, domestic pressures, leadership personalities, and structural forces produce and sustain the conflict?
  *   How did the specific dynamics of the post-WWII moment transform wartime alliance into systemic rivalry?
  *   Why did the conflict remain "cold" in Europe while turning "hot" elsewhere?
  *   How did the actions of *both* superpowers, secondary powers, and non-state actors contribute to escalation and stabilization at different points?
  *   How did perceptions and misperceptions shape decision-making?

  The debate persists not because facts are unknown, but because the question "who started it" forces historians to adjudicate between incompatible normative frameworks regarding the legitimate exercise of power and security in the anarchic international system. The most illuminating work now explores the *process* and *dynamics* of the Cold War's emergence rather than seeking a singular culprit.
