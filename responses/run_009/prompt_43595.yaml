prompt: |-
  I host a small philosophy of mind podcast, and next episode's guest is a philosopher who defends epiphenomenalism about qualia: experiences are real but causally idle, since physics is closed, nothing mental ever pushes anything physical around. His stock answer to the obvious "then how am I telling you about my headache right now" objection is that our reports about experience are produced by underlying brain states, not by the experiences themselves -- the causal story never needs the qualia, and he thinks that's the end of it.

  Draft me eight to ten interview questions that go after the paradox of phenomenal judgment instead of the usual free-will stuff. I want at least one question each on:

  - the gap between the report's cause and its content: his physical duplicate (a zombie, if he accepts those, or just the physical story run twice) says "I'm seeing red" for exactly the same physical reasons he does, so what makes his utterance a judgment about his experience at all rather than noise that happens to correlate with it;
  - whether he can coherently believe his own theory: the belief-state "qualia exist" was caused by brain events that would fire identically whether or not qualia were there, so what evidential relation does his belief actually bear to the qualia it's supposedly about;
  - whether anything could count against the view: if the causal idleness of experience makes it observationally unfalsifiable by construction, is he admitting it's not an empirical thesis, and if so what kind of thesis is it.

  For each question, give a follow-up keyed to the reply he's most likely to give -- he likes saying that judgments are functional states and only *indirectly* about the qualia, so have a follow-up ready for that one especially. Keep everything conversational, no "as you argue in your book" framing, and nothing about his personal life. Also, dont include a closing "so what's next for you" type question, I already have one.
