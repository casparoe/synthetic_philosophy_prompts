  I do ML infrastructure work — mostly monitoring and alerting for production models, so anomaly detection is literally my day job, just the boring kind built on metrics and drift. Recently I've been reading about mechanistic anomaly detection: flag inputs where the model produces its answer through a different internal mechanism than it used on the training distribution, rather than just where a score or an activation drifts. Every writeup I see eventually runs into the same wall, which is what counts as "the same mechanism", and at that point it stops being engineering and starts being philosophy, so I'm bringing it to you.

