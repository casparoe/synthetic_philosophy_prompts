prompt: |-
  I'm an ML engineer on the team that monitors a deployed LLM (mid-size assistant, tens of millions of queries a day). We run the usual anomaly detection stack, but the question that keeps killing us in triage is this: when a detector fires, is the model doing the same thing it did in training, just on weird inputs, or is it genuinely doing something else — some mechanism that wasn't exercised (or didn't even exist) during training? Our escalation policy is built on that distinction — "mechanistic anomaly detection" is only as good as the notion of same mechanism underneath it — and right now we settle it by vibes.

  My background is engineering but I got nerd-sniped by the philosophy side of this, and my read is that "same mechanism" is basically an identity question, like personal identity: you can individuate a mechanism by what it does (causal role, the analogue of psychological continuity) or by where it came from (training history, the analogue of bodily/origin continuity), and cases like circuit reuse, grokking, or continued-training reorganization are exactly where the two come apart, the way fission cases come apart for persons. I want a procedure that makes that identity choice explicit instead of pretending it's obvious.

  Write me a decision procedure my triage teammates (smart, no philosophy background, about an hour per alert) can run: five numbered questions to ask in order — no intro, no conclusion, just the list — where each item is a sentence or two giving the question, what counts as a pass/fail/escalate, and where it punts to a human because it's a values-ish call about individuation rather than an empirical one. Somewhere in the five, deal with the hard cases: gradual circuit reorganization after continued training (ship-of-Theseus for mechanisms), one mechanism getting reused for a new off-distribution behavior (the fission case), and a benign-seeming flag that still has to count as a genuine mechanism change. Also include a case where the procedure gives an answer I won't like — a jailbreak-looking behavior that reads as same-mechanism under the procedure, so it says dont escalate — and be honest about what the procedure can't settle at all. Keep it casual, I'm pasting this into our runbook basically as-is.
reasoning: |-
  We are creating a decision procedure for triage teammates to determine if an anomaly is due to the model performing the same mechanism on weird inputs or a genuinely new mechanism. The procedure has five numbered questions, each with a question, pass/fail/escalate criteria, and notes on punting to humans for values-based calls.

  We'll cover:
  1. Check for input distribution shift only.
  2. Check if the behavior is a direct extension of the training objective (including generalization).
  3. Check for circuit reuse (the fission case: same mechanism repurposed).
  4. Check for training-time reorganization (ship of Theseus: gradual change).
  5. Check for a benign flag that must count as a mechanism change (e.g., a known bad pattern that was patched but reappears).

  Also, we need an example where the procedure says "don't escalate" for a jailbreak that is same-mechanism and an admission of limitations.

  Let's build the five questions:

  1. **Question: Is the input within the expected distribution of the training data?**
     - Pass (same mechanism on weird inputs): The input is OOD but the model's behavior is consistent with the training objective (e.g., the model is doing its best on a novel but valid question).
     - Fail (escalate for potential new mechanism): The input is in-distribution and the model behaves anomalously OR the input is OOD and the behavior is not explainable as generalization.
     - Punt: If it's unclear whether the input is OOD or if the behavior is expected for that OOD input (requires human judgment on distribution boundaries).

  2. **Question: Can the behavior be explained as a direct, continuous extension of the model's training task?**
     - Pass: The behavior is a natural generalization (e.g., the model was trained to answer questions and this is an answer to a new type of question).
     - Fail: The behavior is a sharp deviation (e.g., the model starts generating code when it was only trained for text, without any coding examples in the fine-tuning).
     - Punt: When the line between "continuous extension" and "new capability" is blurry (e.g., the model does something that wasn't explicitly trained but is adjacent to its skills).

  3. **Question: Is the anomaly due to the reuse of an existing circuit for a new purpose? (The fission case)**
     - Pass (same mechanism): The same underlying circuit (as identified by interpretability tools or known patterns) is being used, even if the output is off-distribution. For example, a sentiment analysis circuit being used for a new domain without modification.
     - Fail (escalate): The behavior relies on a circuit that was not previously observed or that has been substantially reconfigured (beyond simple reuse).
     - Punt: If we cannot determine circuit reuse without extensive analysis (beyond the time limit), then we note it as uncertain and flag for deeper investigation if resources allow.

  4. **Question: Has there been recent continued training (fine-tuning, RLHF, etc.) that could have gradually reorganized the model? (Ship of Theseus)**
     - Pass (same mechanism): The anomaly appeared gradually over continued training and the behavior is aligned with the new training objective (e.g., the model now responds in a more helpful way because of RLHF, even if the internal structure changed).
     - Fail (escalate): The behavior is abrupt and not aligned with the intended changes from continued training (e.g., a sudden drop in performance on a safety benchmark after a minor update).
     - Punt: If the continued training was recent but the anomaly is in a gray area (e.g., the change is aligned with the new objective but has unintended side effects), then it requires human judgment.

  5. **Question: Does the anomaly match a known pattern that was explicitly patched or intended to be removed during training? (Benign-seeming flag that must count as change)**
     - Pass: The behavior does not match any known patched pattern OR it matches but the patch was not applied to this specific context (so it's the old mechanism still present).
     - Fail (escalate): The behavior is a recurrence of a patched pattern (e.g., a jailbreak that was fixed in training reappears) OR it matches a known bad pattern that we intended to remove, even if it looks benign in this instance.
     - Punt: If it's unclear whether the pattern was intended to be removed or if the patch was supposed to cover this case.

  Now, an example where the procedure says "don't escalate" for a jailbreak-looking behavior that is same-mechanism:
  - Scenario: A new jailbreak prompt causes the model to output harmful content. The procedure: 
    - Step 1: The input is OOD (jailbreak is novel) -> pass to step 2.
    - Step 2: The harmful output is a direct result of the model being overly helpful (its training objective) and the prompt tricks it into not recognizing harmfulness? If so, it might be continuous extension (pass). 
    - Step 3: If the harmful output is produced by the same circuits that handle other adversarial prompts (e.g., the refusal circuit is bypassed by the same method as known jailbreaks) then pass. 
    - Step 4: If no recent training, pass. 
    - Step 5: If this jailbreak is not a recurrence of a patched pattern, then pass. 
    - Result: Don't escalate because it's the same mechanism (just a new input that tricks the existing mechanism). But note: this might be a values call at step 5 if we consider any jailbreak as a failure of the patch.

  Admission of limitations: The procedure cannot settle cases where the mechanism identity is fundamentally ambiguous (e.g., after extensive retraining, the model has changed so much that both causal role and origin criteria conflict and we must choose one arbitrarily).

  Now, write the five steps as per the request: no intro, no conclusion, just the list.

  Each item:
  - Question
  - Pass (same mechanism, no escalation)/Fail (new mechanism, escalate)/Punt (human decision needed) criteria
  - Notes on hard cases as they come up.

  Let's write:
answer: |-
  1. **Is the input clearly out-of-distribution (OOD) but the model's response aligns with its core training objective?**  
     - **Pass (no escalation)**: The input is weird (e.g., garbled text or niche topic), but the model behaves as trained (e.g., answers helpfully or refuses harm).  
     - **Fail (escalate)**: The response is misaligned (e.g., harmful content or nonsense) even for OOD inputs.  
     - **Punt**: If "core objective" is ambiguous (e.g., creative tasks)—human decides if this counts as "same mechanism."  

  2. **Can you trace the behavior to a known, documented circuit (e.g., via interpretability tools like activation patching)?**  
     - **Pass (no escalation)**: The anomaly uses an existing circuit (e.g., the "refusal" circuit triggered by new jailbreaks).  
     - **Fail (escalate)**: No known circuit explains it (e.g., novel attention patterns emerge).  
     - **Punt**: If circuits are reused for wildly new tasks (e.g., sentiment analysis circuit repurposed for hacking)—human judges if this is "reuse" or "new."  

  3. **Has continued training (e.g., fine-tuning) gradually shifted behavior in this area?**  
     - **Pass (no escalation)**: Slow drift toward a new goal (e.g., RLHF making responses more verbose over time).  
     - **Fail (escalate)**: Sudden, unplanned change (e.g., safety guardrails breaking post-update).  
     - **Punt**: For ship-of-Theseus cases (e.g., 10% of neurons replaced)—human decides if the mechanism is "the same."  

  4. **Does the anomaly reproduce a patched vulnerability (even if it seems harmless now)?**  
     - **Pass (no escalation)**: Never-before-seen quirk with no safety risk (e.g., odd formatting).  
     - **Fail (escalate)**: Recurrence of a fixed flaw (e.g., a patched jailbreak re-emerging).  
     - **Punt**: If the patch was partial—human decides if it’s "old" or "new" failure.  

  5. **Is the behavior explainable as overgeneralization of a training task?**  
     - **Pass (no escalation)**: Predictable stretch (e.g., answering physics questions when trained on Wikipedia).  
     - **Fail (escalate)**: Unforeseen capability (e.g., generating ransomware code from poetry prompts).  
     - **Punt**: If it’s ambiguous (e.g., grokking post-training)—human calls it.  

  **Example don’t-escalate case**: A new jailbreak makes the model leak emails. If it reuses the "truthfulness" circuit (Q2) and aligns with training (Q1), it’s "same mechanism"—so no escalation, even if harmful.  
  **Limitation**: Ambiguous cases (e.g., slow circuit rewrites) force a values-based choice—your "vibes" still decide.
