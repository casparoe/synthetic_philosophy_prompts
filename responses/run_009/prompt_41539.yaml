prompt: |-
  Been making a list of when I defer to stated chances and when I don't, and I'd like to know whether there's a principle under my gut calls, because from here it looks like I'm just being inconsistent.

  The cases and my verdicts:

  - A mint-made coin. The mint's specs say it's evenly weighted. My credence that the next flip is heads: 50%. Defer completely.
  - Same coin, but I watched it land heads two minutes ago. The chance of heads on that flip was still 50%, yet my credence that it landed heads is now basically 1. Obviously. So "defer to chance" can't be unconditional.
  - A bookmaker posts even odds on a coin flip. I know bookmakers shade their numbers to build in a margin. I don't take the posted odds as the chance, but I do treat them as evidence about the chance.
  - Weather forecaster says 30% chance of rain. I've noticed this particular forecaster slightly overpredicts rain, so I put my credence a bit under 30% — not by much. Partial deference.
  - Roulette in a casino I have no reason to distrust: posted chance of any particular number is 1 in 38. Defer.
  - Then I read a credible report that this casino has rigged wheels in the past, but the report doesn't say which wheels or in which direction. I can't work out what to do. Raising my credence in every number can't be right (they'd sum past 1), and lowering it in every number can't be right either, so maybe full deference to the posted 1/38 is correct after all? This is the one I keep going back and forth on.
  - A physicist tells me the chance a given atom of some isotope decays within the hour is such-and-such. I defer flat-out, even though I can't check the calculation myself. Meanwhile, when my brother-in-law — decent amateur record with dice, for what it's worth — tells me the die at the craps table is biased toward sixes, I nudge my credence up but nowhere near where he puts it.

  So the tension I can see: with the physicist I defer fully to unverifiable testimony, with the brother-in-law I discount heavily, with the rain forecaster I discount slightly. Is the difference just track record, or is there something structural about the kind of claim? And the rigged-casino case seems to cut against the physicist case in some way I can't put my finger on.

  My own stab at a principle: defer to a stated chance unless your evidence also bears on whether the chance really is as stated, or on how the event turned out. But that gets the physicist case wrong, since his say-so obviously bears on the chance in some sense, and I still defer completely. I gather there's a named thing for this kind of deference — the Principal Principle — with some clause about which evidence is "admissible," but I've never seen a clean statement of what makes evidence admissible or not, and my cases feel like they're circling exactly that hole.

  So, questions: is there a principle that captures all or most of my verdicts, and can it be stated without the admissibility clause just listing the cases? What does it say about a case I haven't given — for instance, a fully deterministic universe where somebody hands me "chance" numbers anyway: defer or not? And which of my verdicts would you overturn? Please don't rescue all of them by bolting on clauses, one per case — if my pattern is just incoherent, or if two of my verdicts can't be had together at any price, say that straight. Same if the whole framing assumes chances are a real thing out there to defer to, and that assumption is doing more work than it should — I'd want to hear that rather than a polite principle built on sand.
reasoning: |-
  Okay, let me try to unpack this user's query. They're struggling with when to defer to stated chances and when not to. They've listed several cases with their own verdicts, showing a pattern that seems inconsistent. The core issue is figuring out if there's a unifying principle behind their judgments or if they're just being arbitrary.

  First, I notice they're familiar with the Principal Principle but confused about admissible evidence. That concept is tricky because it's often defined circularly. The user wants a clear, non-circular principle. Their examples include coins, bookmakers, weather forecasts, roulette, physicists, and a brother-in-law. Each case has different levels of deference, from full to partial to none.

  Looking at their cases, the key factors seem to be trust in the source and the nature of the evidence. For the mint coin, they defer fully because it's a reliable source. But after seeing heads, they don't defer to the past chance because they have direct evidence of the outcome. The bookmaker's odds aren't taken as direct chances but as evidence, which makes sense because bookmakers adjust for profit. The weather forecaster has a known bias, so partial deference. The casino roulette is trusted initially, but when there's a report of past rigging without details, they're stuck. The physicist gets full trust despite unverifiable testimony, while the brother-in-law gets only a slight nudge.

  The tension they mention between the physicist and brother-in-law cases highlights that track record alone doesn't explain it. Both are testimonies, but they treat them differently. The physicist represents an institution with rigorous methods, while the brother-in-law is an individual with anecdotal evidence. Trustworthiness here includes expertise and institutional credibility.

  For the rigged casino, the problem is that the evidence undermines the entire setup but doesn't provide specifics. The solution might be to treat the stated chance as conditional on the wheel being fair, and the user's credence should incorporate the possibility of rigging. Since they don't know how it's rigged, they can't adjust individual probabilities, so they might need to stick with the original chances but lower their overall confidence in the setup. Alternatively, they could have a meta-credence where the chance is a mixture of the fair probability and an unknown rigged distribution.

  The user's own stab at a principle mentions evidence bearing on whether the chance is as stated or the outcome. But the physicist case contradicts this because the testimony does bear on the chance, yet they defer. This suggests that the principle needs refinement: perhaps it's about evidence that directly affects the outcome versus evidence about the reliability of the source.

  A better principle might be: Defer to stated chances unless you have direct evidence of the outcome or evidence that the stated chance is miscalibrated. Calibration evidence includes track records, biases, or credibility issues. The physicist's testimony isn't seen as miscalibrated because of their expertise, while the brother-in-law's is. The casino rigging report indicates possible miscalibration, so deference isn't automatic.

  For a deterministic universe, chances might not exist, so deferring to stated chances wouldn't make sense unless they're treated as epistemic probabilities based on ignorance. The user might defer if the source has better information, but if they know the universe is deterministic, they wouldn't.

  Possible verdict overturns: In the casino case, full deference after the rigging report isn't right. Instead, they should have a lower confidence in the entire probability model. For the brother-in-law, the slight nudge might be reasonable, but if the brother-in-law has a good track record, maybe they should defer more. However, the user's judgment here is based on the source's credibility, which is fair.

  The user's framing assumes chances are real, which might be problematic in deterministic cases. But for their examples, it's workable. The key is distinguishing between evidence about outcomes and evidence about the reliability of the chance statement. Admissibility in the Principal Principle is about excluding direct outcome evidence, but credibility of the source complicates it. Maybe a dual-layer approach: first, assess the reliability of the chance source; second, apply the Principal Principle conditional on that assessment.
answer: |-
  Your pattern isn't inconsistent – it reveals a nuanced principle governing deference to stated chances. The tension stems from conflating two distinct types of evidence: **evidence about the outcome itself** and **evidence about the reliability/calibration of the stated chance mechanism**. Here's a principle capturing your verdicts:

  **Defer to a stated chance *iff* your evidence:**
  1.  **Does not directly bear on the specific outcome** (ruling out post-outcome knowledge like seeing the coin land heads).
  2.  **Does not indicate miscalibration of the stated chance mechanism itself** (ruling out knowledge of biases, shading, rigging, or lack of expertise).

  **How this explains your cases:**

  1.  **Mint Coin (50%):** Defer. No outcome evidence. No evidence of miscalibration (mint specs are trusted).
  2.  **Mint Coin (Post-Heads):** Don't defer. You have direct evidence of the outcome (violates #1).
  3.  **Bookmaker (Even Odds):** Don't defer *to the odds as chance*. Evidence of shading indicates potential miscalibration (violates #2). Treat as evidence *about* the chance.
  4.  **Weather Forecaster (30% Rain):** Partial Deference. Evidence of slight overprediction indicates minor miscalibration (violates #2). You adjust your credence downward to correct for the known bias.
  5.  **Casino Roulette (1/38):** Defer. No outcome evidence. No evidence of miscalibration (casino trusted).
  6.  **Rigged Casino Report (1/38):** **This verdict needs overturning.** You *cannot* fully defer. The credible report is direct evidence of potential miscalibration (violates #2). *Solution:* Your credence should be a weighted mix:
      *   **Component 1:** The fair wheel probability (1/38) weighted by your credence the wheel *isn't* rigged *or* is rigged neutrally.
      *   **Component 2:** An "unknown rigged distribution" weighted by your credence the wheel *is* rigged non-neutrally.
      Since you know nothing about the nature/direction of rigging, Component 2 must be maximally uninformative – essentially a uniform distribution over outcomes (1/38 again, but for a different reason!). **Your overall credence for any single number remains 1/38.** *Why?* The report undermines your trust in the *mechanism* (casino integrity) but provides *zero information* favoring one number over another. The prior symmetry (all numbers are equally likely *if you know nothing*) forces your credence back to 1/38. **Your deference isn't to the *stated chance* anymore; it's to symmetry under ignorance about the rigging.** Your *confidence* in the model is shattered, but your *credence* for any specific outcome doesn't change without evidence favoring one outcome over others.
  7.  **Physicist (Decay Chance):** Defer. No outcome evidence. No evidence of miscalibration (physicists/institutions trusted for expertise/calibration).
  8.  **Brother-in-Law (Biased Die):** Minimal Deference. Evidence of amateur status and lack of rigorous methodology indicates potential miscalibration (violates #2). You treat his claim as weak evidence, adjusting credence slightly.

  **Addressing the Tensions:**

  *   **Physicist vs. Brother-in-Law:** It's not just track record; it's about **institutional credibility and methodological soundness**. You trust the physicist's statement reflects a well-calibrated process (theory, experiment, peer review). You distrust the brother-in-law's assessment as potentially miscalibrated due to lack of rigor or sufficient evidence. His decent amateur record only earns a slight nudge, not full trust.
  *   **Rigged Casino vs. Physicist:** The report provides evidence the *casino's stated chance mechanism is fundamentally compromised* (miscalibration evidence). The physicist's statement *is* the calibrated mechanism itself (for you). The rigging report attacks the source's reliability; the physicist's expertise *is* the reliability.

  **The Principal Principle & Admissibility:**

  You're right. The Principal Principle (PP) says: `Credence(Outcome | Chance = x & Evidence) = x`, but *only* if the evidence is "admissible". Admissible evidence is roughly evidence that doesn't "sneak a peek" at the outcome or provide information the chance mechanism *should have but didn't* incorporate. Your cases show the problem: **evidence about the *reliability of the source stating the chance* is often inadmissible under PP, but intuitively relevant.**

  Your principle refines PP by explicitly separating:
  1.  **Direct Outcome Evidence:** Clearly inadmissible (like seeing the coin land).
  2.  **Calibration/Reliability Evidence:** This is the sticky part. PP often assumes the chance statement is *authoritative*. Your principle explicitly incorporates assessing that authority. Evidence undermining authority (bias, rigging, lack of expertise) makes the stated chance non-authoritative for you.

  **Deterministic Universe Case:**

  *   Someone hands you "chance" numbers (e.g., "Chance of rain tomorrow = 30%").
  *   **Defer? No, not as objective chance.** If you *know* the universe is deterministic, "chances" are epistemic (degrees of belief based on ignorance). You would only defer if:
      *   You believe the source has *better information* about the deterministic factors than you do. Then you'd defer to their *epistemic probability assessment*, not an objective chance.
      *   You treat the number as a well-calibrated *forecast* based on data/models (like the weather forecaster, where you *might* defer partially, adjusting for known biases).

  **Overturned Verdict & Key Insight:**

  *   **Overturn:** Case 6 (Rigged Casino Report). Full deference is incorrect. As explained, your credence *happens* to remain 1/38 due to symmetry, but this is *not* deference to the casino's stated chance; it's a consequence of your ignorance *about the rigging* combined with prior symmetry.
  *   **Key Insight:** Your pattern isn't incoherent. It reveals that deference depends on **trusting the source of the chance statement as a well-calibrated expert or mechanism.** You instinctively discount when you have evidence the source is miscalibrated (biased, shading, rigged, incompetent) or when you have direct outcome knowledge. The physicist is trusted calibration; the brother-in-law and the post-rigging-report casino are not. This trust assessment is crucial and often glossed over in simple PP formulations. Your "stab" was close; the refinement is distinguishing evidence bearing *on the outcome* from evidence bearing *on the reliability of the chance-stating mechanism*. The physicist's testimony is about the *mechanism itself* (decay physics), which you trust, so you defer. Evidence the mechanism is broken (rigging report) means you don't defer to its output.

  Your gut is smarter than you think – it's applying a sophisticated reliability filter to chance statements. The core principle is **deference conditional on calibrated authority.**
