answer: |-
  ### Newcomb's Paradox: Participatory Session Design  
  **Goal:** Make participants confront the tension between dominance reasoning ("take both boxes") and evidential reasoning ("take only the opaque box") through lived experience.  

  ---

  #### **Materials & Setup**  
  - **Festival scrip:**  
    - Transparent box: Fixed 100 credits (small-denomination scrip).  
    - Opaque box: Either 0 or 1,000 credits (large-denomination scrip).  
    *(Total scrip budget: ~25,000 credits. Use pre-printed vouchers for easy handling.)*  
  - **Boxes:**  
    - 25 transparent plastic boxes (100 credits visible in each).  
    - 25 identical shoeboxes (opaque, pre-filled during setup).  
  - **Predictor mechanism:**  
    - **Pre-session "Personality Quiz"** (5-min online survey emailed 24h pre-session; or paper forms at entry).  
      - Questions designed to correlate with impulsivity/trust (e.g., "On a scale of 1–5, I prefer guaranteed rewards over risky ones," "I often change my mind last-minute").  
      - Volunteers score quizzes before session: High "risk aversion/consistency" = predict one-boxing; high "impulsivity/independence" = predict two-boxing.  
  - **Volunteer roles:**  
    - **Quiz Scorers (2):** Pre-session, assign predictions (one-box/two-box) based on quiz.  
    - **Box Stuffers (2):** Pre-fill opaque boxes (1,000 credits if predicted one-box; 0 if two-box).  
    - **Choice Recorders (2):** Document decisions during the game.  

  ---

  #### **Session Timeline (60 Min)**  
  **0:00–0:10: Introduction & Framing (10 min)**  
  - *You:* "Welcome! Today we’re exploring how we make tough choices. You’ll play a game with real stakes—festival credits you can spend at the bookshop. First, let’s discuss predictions. Have you ever felt like someone ‘knew you better than you know yourself’? We’ll test that idea today."  
  - Briefly explain the boxes:  
    "You’ll choose between taking *only* an opaque box or *both* boxes. The opaque box might be empty or contain 1,000 credits. The transparent one always has 100 credits. Crucially, the opaque box’s contents were set *an hour ago* based on a prediction about how *you personally* will choose."  

  **0:10–0:15: Reveal Predictor Mechanism (5 min)**  
  - *You:* "How did we predict your choice? Before this session, you took a short quiz. Our team analyzed it to guess whether you’d take one box or two. They aren’t psychics—just using patterns from past games. If they predicted ‘one-box,’ we put 1,000 credits in your opaque box. If ‘two-box,’ we put nothing."  
  - *Key honesty note:* "Real predictors aren’t perfect. Ours is right about 65–70% of the time—better than a coin flip, but not flawless. The classic puzzle assumes near-perfection; we’ll discuss that gap later."  

  **0:15–0:25: The Choice (10 min)**  
  - Chairs arranged in a semicircle facing two sample boxes.  
  - *You:* "Approach the volunteer when called. Declare your choice aloud: ‘One box’ or ‘Both boxes.’ You’ll get the box(es) you take. *Do not open the opaque box yet.*"  
  - Volunteers hand participants their chosen box(es) (pre-matched to predictions).  

  **0:25–0:35: Tally Results (10 min)**  
  - Participants open boxes. Volunteers record:  
    - Prediction (from quiz),  
    - Actual choice,  
    - Payout.  
  - *You:* "Shout out your payout! How many chose one box? Both boxes?"  
  - Display live tally on a board:  
    | **Prediction→** | **Actual 1-Box** | **Actual 2-Box** |  
    |------------------|------------------|------------------|  
    | **Pred. 1-Box**  | 1,000 credits    | 1,100 credits    |  
    | **Pred. 2-Box**  | 0 credits        | 100 credits      |  

  **0:35–0:50: Elicit Reasoning & Debate (15 min)**  
  - *You:* "Let’s hear why you chose what you did. Start with one-boxers."  
    - **Goal:** Surface evidential reasoning.  
    - *Sample prompts:* "Did you worry the predictor ‘knew’ you? If you took both, would that mean they probably left the opaque box empty?"  
    - *Expected participant insight:* "If I take both, it likely means the predictor thought I would, so the opaque box is empty. But if I take one, they probably filled it—so I win big!"  
  - *You:* "Now two-boxers. What was your thinking?"  
    - **Goal:** Surface dominance reasoning.  
    - *Sample prompts:* "Did you think the opaque box’s contents were already fixed?"  
    - *Expected participant insight:* "The money’s already there. Taking both always gives me 100 more than taking one. Why leave free money?"  
  - *Volunteer report:* Share aggregate results, e.g.,  
    "One-boxers averaged 750 credits; two-boxers averaged 300 credits. Our predictor was 68% accurate."  

  **0:50–1:00: Debrief & Philosophical Context (10 min)**  
  - **Map the tension:**  
    - *Dominance reasoning:* "Some said, ‘The boxes are already fixed—I can’t change the past. Taking both always adds 100 credits.’ That’s logical!"  
    - *Evidential reasoning:* "Others said, ‘My choice *reveals* what the predictor likely did. One-boxers tend to win more in our tally.’ That’s logical too!"  
  - **Acknowledge limitations upfront:**  
    - "Our predictor was good but not perfect—real accuracy was ~70%. The *classic* paradox assumes a 99% accurate predictor. In that world, one-boxers *always* get 1,000, two-boxers *always* get 100. Our gap weakens the evidential argument slightly—but the tension remains."  
  - **Journalistic neutrality:**  
    - "What’s settled: This puzzle exposes a rift in decision theory.  
    What’s contested: There’s no consensus on the ‘right’ answer.  
    Philosophers split since 1969:  
      - **Causal decision theorists** say dominance rules: Take both boxes.  
      - **Evidential decision theorists** say expectations rule: Take one box.  
    If you’re split, that’s not confusion—it’s the point. This isn’t about IQ; it’s about how we weigh causality versus evidence."  
  - **Closing:** "Your letters are welcome! For further reading, I recommend Nozick’s original paper or *The Paradox of Choice* by Barry Schwartz."  

  ---

  #### **What Could Go Wrong & Mitigation**  
  1. **Predictor accuracy too low:**  
     - *Risk:* If accuracy is ≤60%, two-boxers may outearn one-boxers, muddying the evidential argument.  
     - *Mitigation:* Use pre-tested quiz questions (e.g., validated risk-aversion scales). If accuracy is low, say: "Our predictor underperformed—evidential reasoning relies heavily on accuracy. But notice: If we *had* a perfect predictor, one-boxing wins."  

  2. **Participants skip the quiz:**  
     - *Risk:* Latecomers or non-responders lack predictions.  
     - *Mitigation:* Assign default predictions (e.g., "no quiz = predicted two-box"). Or use an in-session backup: "Write your name + birthday. Volunters ‘observe’ if you hesitate during instructions and predict based on that."  

  3. **Groupthink dominates discussion:**  
     - *Risk:* One reasoning style drowns out the other.  
     - *Mitigation:* Pre-brief volunteers to identify articulate one-boxers/two-boxers. Cold-call: "Anna, you took one box—explain why to the two-boxers."  

  4. **Scrip theft/confusion:**  
     - *Risk:* Credits lost or disputed.  
     - *Mitigation:* Use numbered vouchers. Volunteers track payouts on a master sheet.  

  ---

  #### **Why This Works**  
  - **Predictor legitimacy:** The quiz grounds the prediction in something tangible (participants’ own answers), making evidential reasoning visceral.  
  - **Stakes bite:** Scrip rewards incentivize authentic choices without cash complications.  
  - **Neutral framing:** The debrief separates observable results (e.g., "one-boxers earned more here") from philosophical disputes, honoring journalism’s objectivity.  
  - **Embracing imperfection:** By admitting the predictor’s fallibility upfront, you turn a limitation into a teaching moment about the thought experiment’s idealized assumptions.  

  **Final note:** If the room splits 50/50, congratulate them—they’ve replicated the expert stalemate. The goal isn’t resolution; it’s to make a paradox *felt*.
