  "Please take a slip of paper and a pen. Write down a number between 1 and 10. Fold it so others can't see. [Wait] Now, we have a choice for you. You have two options:
    Option A: If our predictor correctly guesses whether your number is above or below 5.5, you get 10 credits. If the predictor is wrong, you get 0.
    Option B: You get 5 credits no matter what.
  But note: this is just a warm-up to get us thinking. We won't actually pay credits for this game, but the predictor's guess about you will be used in the next game. Please write your choice, A or B, on this card with your name. [Collect]"

  **Newcomb Game Setup (0:10)**:
  "Now, the main event. You see two boxes: one transparent and one opaque. The transparent box clearly has 100 credits. The opaque box may contain either 0 or 1000 credits. The contents of the opaque box were determined by a prediction about your choice in this game. Our predictor, who observed you during the warm-up, made a prediction: if they predicted you will take only the opaque box, then we put 1000 credits in it. If they predicted you will take both boxes, then we put 0 in it. So the opaque box is already fixed.

  You have two choices:
    Choice 1: Take only the opaque box.
    Choice 2: Take both boxes.

  You will get to keep the credits in the boxes you take. Please line up and when it's your turn, tell the volunteer your choice. Do not open the opaque box until we say so."

  **After Choices (0:30)**:
  "Now, please open your opaque box if you took it. Count your credits. We are going to tally the results. If you took only the opaque box, how much did you get? If you took both, how much total? Also, we can tell from the contents of the opaque box what the predictor predicted: if it had 1000, they predicted you'd take only the opaque box; if 0, they predicted you'd take both."

  **Discussion (0:40)**:
  "Let's see the results. [Tally on board] Who chose to take only the opaque box? Why? ... Who chose both? Why? ... [Elicit the two lines of reasoning]"

