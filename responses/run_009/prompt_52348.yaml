  We are designing a 60-minute session on Newcomb's Paradox for a public audience with no philosophy background. The goal is to have participants face the problem and discover the tension between two modes of reasoning. We need a real predictor mechanism and to use festival scrip as payoffs.

  Key elements:
  1. **Predictor Mechanism**: We need a way to predict the choice of each participant with better than chance accuracy. The prediction must be made before the choice and must determine the contents of the opaque box.
  2. **Session Flow**: The session must be participatory, with participants making the choice and then discovering the conflict between dominance reasoning and expected utility reasoning.
  3. **Debrief**: We must explain both lines of thought and clarify that the predictor in reality is imperfect (so we cannot achieve the near-infallibility of the thought experiment). We must also avoid presenting either one-boxing or two-boxing as the consensus view.

  **Proposed Predictor Mechanism**:
  We will use a two-step process to generate a prediction for each participant:
  - **Step 1 (Pre-Session Questionnaire)**: Before the session, participants fill out a brief questionnaire that includes a few personality questions and a hypothetical choice scenario. We will use this to build a predictive model.
  - **Step 2 (In-Session Staged Choice)**: At the beginning of the session, we conduct an activity that appears unrelated but is actually diagnostic. We will use a "practice round" of a different decision game that is designed to correlate with the Newcomb choice.

  However, since we cannot run a complex model during the session, we will pre-process the questionnaire and have a simple scoring system. We can also use an in-session staged choice that is quick and easy to score.

  **Alternative simpler idea**: We use a pre-session questionnaire that includes a few key questions that have been shown to correlate with risk aversion and impulsivity, which might predict one-box vs two-box tendencies. Then we can have a volunteer quickly score the questionnaires during the first few minutes of the session (while we do an introduction). But this might be logistically challenging.

  **Revised idea for simplicity and feasibility**:
  We will use an in-session staged choice that is a proxy for the Newcomb choice. We can do a quick activity at the beginning that measures the participant's tendency to trust a prediction or to act independently. For example:

  - **The Trust Game**: We tell participants that we are going to play a quick game to get them warmed up. Each participant is given a slip of paper and asked to write down a number between 1 and 10. They are told that a volunteer (the "predictor") will try to guess whether the number they wrote is above or below 5.5. Then, they are given a choice:
    - Option A: If the predictor guessed correctly, they get 10 scrip; if incorrectly, they get 0.
    - Option B: They get 5 scrip regardless.

  But note: This is similar to the Newcomb structure. However, we want to use this to predict their Newcomb choice. We assume that participants who choose Option A (the risky, trust-based option) are more likely to one-box, and those who choose Option B (the safe, independent option) are more likely to two-box.

  But we cannot know the actual predictor's guess until after they choose? We need to fix the prediction for the Newcomb game in advance. So we must use the Trust Game choice as the predictor for the Newcomb choice. Specifically:

  - We will define: If a participant chooses Option A in the Trust Game, we predict they will one-box. If they choose Option B, we predict they will two-box.

  This is a simple deterministic predictor. But note: we are not using an actual prediction about the Trust Game, but rather using their choice in the Trust Game as a proxy for their Newcomb choice.

  However, we must make it clear that the predictor in the Newcomb game is based on an earlier prediction. We can say that before the session, we (the festival organizers) have already made a prediction about each participant's choice in the Newcomb problem, and we have put money in the boxes accordingly. But we just decided to base it on the Trust Game? How do we do that without breaking the illusion?

  **Solution**: We will run the Trust Game at the beginning and have the participants make their choice. Then we will collect the choices. We then tell them that during the Trust Game, we had a predictor (a volunteer) who was observing them and making predictions about their Newcomb choice. But actually, we will use the Trust Game choice to set the prediction.

  We can say: "While you were playing the Trust Game, our predictor was observing your behavior and has made a prediction about whether you will take only the opaque box or both boxes in the main game. Based on that prediction, we have already prepared the boxes for you."

  In reality, the mapping is:
  - If you chose Option A in the Trust Game -> we predict you will one-box -> so we put $1000 in the opaque box.
  - If you chose Option B in the Trust Game -> we predict you will two-box -> so we put $0 in the opaque box.

  But note: We are not actually predicting the Newcomb choice with a separate mechanism; we are using a proxy. We are assuming that the Trust Game choice is correlated with the Newcomb choice. This might not be perfect, but it's a practical solution.

  **Payoffs**:
  - In the Trust Game: 
    - Option A: 10 scrip if predictor correct, 0 if incorrect. But we cannot resolve this until we have the Newcomb choice? We don't want to complicate. Instead, we can make the Trust Game a separate activity with a small payoff, and then the Newcomb game with a larger payoff.

  Alternatively, we can skip paying for the Trust Game and just use it as a predictor. We can say it's a practice round without payoff. Or we can pay a small fixed amount for participation.

  **Revised Trust Game without payoff**: We tell them it's a warm-up to understand the setup. We don't pay for it. Then we use the choice in the Trust Game to set the opaque box for the Newcomb problem.

  **Newcomb Game Payoffs**:
  - The opaque box may contain either $0 or $1000 in scrip (we'll use festival scrip, so let's call the units "credits").
  - The transparent box always contains $100 in credits.
  - So:
    - If take only opaque: you get whatever is in opaque (0 or 1000).
    - If take both: you get 100 plus whatever is in opaque (0 or 1000).

  We need to set the amounts so that the dominance argument and expected utility argument are clear. The classic amounts are $1000 and $100, so we'll use that.

  **Session Timeline (60 minutes total)**:

  **0:00 - 0:10 (10 min): Introduction and Trust Game**
  - Welcome and introduction to the session. Explain that we'll be exploring how we make decisions under uncertainty.
  - Introduce the Trust Game as a warm-up: 
    - "We're going to start with a quick exercise. Each of you will write down a number between 1 and 10 on a slip of paper. Then, you will be given a choice: 
        Option A: If our predictor correctly guesses whether your number is above or below 5.5, you get 10 credits. If not, you get 0.
        Option B: You get 5 credits no matter what.
    But note: we are not actually going to pay for this game; it's just to get us thinking. The predictor's guess is being recorded for use in the next game."
  - Distribute slips and pens. Have them write the number and fold it so others can't see. Then collect the slips (we don't actually need the numbers, but it adds to the effect). 
  - Then, present the choice: Option A or Option B. Have them write their choice (A or B) on a separate card with their name (or assigned participant number) and collect.

  **0:10 - 0:15 (5 min): Setting up the Newcomb Problem**
  - While participants are writing, have volunteers quickly sort the choices and prepare the opaque boxes. For each participant, based on their Trust Game choice:
    - If they chose Option A: put 1000 credits in their opaque box (because we predict they will one-box).
    - If they chose Option B: put 0 credits in their opaque box (because we predict they will two-box).
  - The opaque boxes are identical and closed. The transparent box for every participant contains 100 credits (we can have these pre-set and visible).

  **0:15 - 0:20 (5 min): Presenting the Newcomb Problem**
  - Explain the Newcomb game:
    - "Now, we move to the main game. You see two boxes in front of you: one transparent and one opaque. The transparent box contains 100 credits. The opaque box may contain either 0 or 1000 credits. The contents of the opaque box were determined by a prediction made about your choice in this game. Our predictor, who observed you during the warm-up, made a prediction: if they predicted you will take only the opaque box, then we put 1000 credits in it. If they predicted you will take both boxes, then we put 0 credits in it."
    - "You have two choices:
        Choice 1: Take only the opaque box.
        Choice 2: Take both boxes."
    - "You will get to keep the credits in the boxes you take, which you can redeem at the festival bookshop."

  **0:20 - 0:30 (10 min): Decision and Collection**
  - Have participants come up one by one (or in small groups) to make their choice. We need to record each participant's choice and then give them the boxes they take. But note: we cannot reveal the contents of the opaque box until after they choose? Actually, in the classic problem, they don't see the contents until after they choose. We can do the same.
  - Setup: Have a station for each participant (or a few stations) with two boxes: one transparent (with 100 credits visible) and one opaque (with either 0 or 1000 credits, set by the Trust Game prediction).
  - Each participant approaches and announces their choice to a volunteer:
    - If they choose one box: they get the opaque box (and leave the transparent).
    - If they choose two boxes: they get both.
  - The volunteer records the choice and gives them the box(es). They are told not to open the opaque box until the end of the session.

  **0:30 - 0:40 (10 min): Tallying and Initial Discussion**
  - Now, we want to see the results. Have participants open their opaque boxes (if they took it) and count their credits.
  - Ask participants to report their outcome: 
    - How much did they get?
    - What was their choice?
    - What was the prediction (which we can tell from the contents of the opaque box: if it had 1000, we predicted one-box; if 0, we predicted two-box).
  - We can have a volunteer write on a board:

    | Prediction | Actual Choice | Payout |
    |------------|---------------|--------|
    | One-box    | One-box       | 1000   |
    | One-box    | Two-box       | 100    |
    | Two-box    | One-box       | 1000?  |   [But wait, if we predicted two-box and they one-box, then the opaque box would have 0, so they get 0?]
    | Two-box    | Two-box       | 100    |

    Actually, the payout for the choices:
    - If predicted one-box (opaque=1000) and you one-box: 1000.
    - If predicted one-box (opaque=1000) and you two-box: 1000+100 = 1100.
    - If predicted two-box (opaque=0) and you one-box: 0.
    - If predicted two-box (opaque=0) and you two-box: 0+100 = 100.

    So the outcomes are:
    - One-box: 1000 if predicted one-box, 0 if predicted two-box.
    - Two-box: 1100 if predicted one-box, 100 if predicted two-box.

    Now, we tally the participants and see:

    - How many one-boxers got 1000?
    - How many one-boxers got 0?
    - How many two-boxers got 1100?
    - How many two-boxers got 100?

    But note: our predictor isn't perfect. We used the Trust Game choice as a proxy. We expect:
    - Those who did Option A in Trust Game (predicted one-box) and then one-boxed: 1000.
    - Those who did Option A but two-boxed: 1100.
    - Those who did Option B (predicted two-box) and then two-boxed: 100.
    - Those who did Option B but one-boxed: 0.

    We want to see the correlation.

  **0:40 - 0:50 (10 min): Debrief and Discussion**
  - Start by showing the tally. We expect that most of the time, the prediction was correct? Because we used the same trait (trust vs independence) to set the prediction? But note: it's not guaranteed. We might have mismatches.

  - Now, we want to elicit the two lines of reasoning:
    - First, ask: "Who chose to take only the opaque box? Why?" 
      - We hope someone says: "Because I believed that if I take both, the predictor would have predicted that and put nothing in the opaque box, so I'd only get 100. But if I take one, the predictor would have predicted that and put 1000, so I get 1000. And I thought I could get the predictor to put 1000 by choosing one box." (This is the evidential reasoning.)
    - Then ask: "Who chose to take both boxes? Why?"
      - We hope someone says: "Because whatever is in the opaque box is already there. So if it's 1000, I get 1000+100=1100 by taking both. If it's 0, I get 0+100=100 by taking both. So either way, I get 100 more by taking both." (This is dominance reasoning.)

  - If these arguments don't come up naturally, the facilitator can gently guide by asking:
    - For the one-boxers: "Did you think about what the predictor might have done? How did that affect your choice?"
    - For the two-boxers: "Did you think that the contents were already fixed? So why not take both?"

  - Then, explain the two principles without using jargon first:
    - "It seems we have two very compelling ways of thinking. On the one hand, we have the idea that the contents of the boxes are already fixed, so you might as well take both to get the extra 100. On the other hand, we have the idea that by choosing to take only one box, you are the kind of person who the predictor thought would do that, and so you get the big prize. And look at our tally: the one-boxers on average got [calculate average for one-boxers] and the two-boxers got [average for two-boxers]. In our session, which group did better?"

    - Note: In our setup, the one-boxers will have gotten 1000 if the prediction was correct (which it should be for most, because we set the prediction based on the Trust Game and we assume the same trait). But if there were mismatches, then we might have one-boxers who got 0 and two-boxers who got 1100. However, on average, because the predictor is not perfect, we might see that the one-boxers did better? Or not? It depends on the accuracy.

  - We then explain the classic Newcomb problem and how it differs:
    - "In the classic thought experiment, the predictor is almost infallible. So if you are going to two-box, the predictor almost certainly predicted that and put 0 in the opaque box. If you are going to one-box, the predictor almost certainly put 1000. So the one-boxer gets 1000, and the two-boxer gets 100. But in our session, our predictor was based on a simple warm-up game, so it wasn't perfect. We had an accuracy rate of [X]%. That's why we saw some one-boxers who got 0 and some two-boxers who got 1100. But even in our limited sample, we see that the one-box strategy tends to be better when the predictor is good."

  **0:50 - 1:00 (10 min): Philosophical Context and Wrap-up**
  - Now, we explain that this is a real philosophical problem that divides experts:
    - "This puzzle, known as Newcomb's Paradox, was introduced by the physicist William Newcomb and popularized by the philosopher Robert Nozick in 1969. Since then, philosophers and decision theorists have been split. Some argue that dominance reasoning is correct: take both boxes. Others argue that expected utility reasoning is correct: take only the opaque box. The heart of the debate is about how we should treat the relationship between our choice and the prediction. The two-boxers see the prediction as fixed in the past and causally independent of the current choice. The one-boxers see the choice as evidence about what the prediction must have been, and so they condition on their own choice."
    - "There is no consensus. The debate continues and touches on deep issues about causality and evidence in decision theory. So if you found yourself split, that's not because you misunderstood; it's because the problem is genuinely thorny."

  - Finally, be upfront about the limitations:
    - "We must note that in our session, we could not simulate a near-infallible predictor. The classic thought experiment assumes a predictor that is almost always right, and that's where the paradox is sharpest. Our predictor was based on a quick warm-up game and had an accuracy of about [we can compute it from the session]%. So we cannot fully replicate the thought experiment. But we hope we've given you a taste of the tension."

  **Logistics and Materials**:
  - Materials:
    - For Trust Game: slips of paper, pens.
    - For Newcomb Game: 
        - 25 opaque boxes (e.g., identical shoeboxes or gift boxes that can be closed) and 25 transparent boxes (clear plastic boxes or glass jars). 
        - Festival scrip: 
            - 1000 credits in each opaque box for those predicted to one-box (so 25 * 1000? but only for half? so about 12-13 sets of 1000) and 0 for the rest.
            - 100 credits for each transparent box (so 25 sets of 100).
    - A board to tally results.
  - Volunteers: 
    - 2-3 volunteers to help distribute materials, collect choices, and prepare boxes.

  **Potential Problems and Solutions**:
  1. **Predictor Accuracy**: Our predictor (based on Trust Game) might have low accuracy. We are assuming that choosing Option A (trust) correlates with one-boxing and Option B (safe) with two-boxing. But if the correlation is weak, we might get many mismatches. Then the one-boxers might not do better on average. 
     - **Solution**: We can adjust the mapping if we see in testing that the correlation is poor. Alternatively, we can explain that the predictor is imperfect and that we are using a proxy. We can also run a pilot with colleagues to see if the Trust Game choice correlates with the Newcomb choice.

  2. **Time Constraints**: The setup for the boxes might take longer than 5 minutes. 
     - **Solution**: Have the volunteers pre-label the boxes with participant numbers and pre-fill the transparent boxes. Then during the 5 minutes, they only need to put the credits in the opaque boxes based on the Trust Game choices (which they are sorting). Also, having multiple volunteers helps.

  3. **Participants opening boxes early**: They might open the opaque box before we tally. 
     - **Solution**: Instruct them not to open until instructed.

  4. **Lack of Participation in Discussion**: Some might be shy. 
     - **Solution**: Use a show of hands for choices and then ask for volunteers to explain. We can also have them discuss in pairs first.

  5. **Complexity of the Trust Game**: The Trust Game might confuse. 
     - **Solution**: Keep the explanation simple and do a quick example.

  **Final Note**: The goal is to create an experiential understanding of the paradox. The debrief must be neutral and highlight the open debate.

  **Instructions Read Aloud**:

