  Alright, the user chairs a student council facing a voting paradox. They need a practical solution based on judgment aggregation theory. Let me start by understanding their problem: during votes on premises vs. the main motion, different majorities led to contradictory outcomes. The user wants a clear procedure, not a theoretical overview.

  First, I need to recommend a default rule. Premise-based voting makes sense for structured decisions but risks inconsistencies in conclusion-based votes. The user mentioned motions with logical dependencies, like the greenhouse example. So, premise-based voting should be the default because it enforces logical consistency. But when should they switch? If the motion is about values or preferences, conclusion-based is better. I should emphasize simplicity and transparency, especially since the council members are teenagers without logic background.

  Next, the procedure section needs a step-by-step checklist. Steps must identify if the motion has premises. Key questions: "Does the motion hinge on specific factual claims?" and "Are these claims verifiable?" If yes, proceed with premise voting. If not, go straight to the conclusion. The chair should list premises clearly, vote on each, then combine them to form the outcome. For minutes, document premises and their votes to prevent reopening.

  Worked cases are crucial for illustration. The late bus case: premises like cost and feasibility. If premises pass, funding is approved. The club funding: if premises about waste and better use pass, defunding happens—even if some members are conflicted. Homework policy: symbolic, so conclusion-based. Here, the motion might fail despite passing premises, showing the procedure's consistency.

  Misfires: Strategic voting is a risk. Members might vote against true premises to sway the outcome. Also, ambiguous premises or value judgments can't be resolved by this method. The chair needs to step in and call for a conclusion vote in those cases.

  The user's deeper needs: They want a definitive, easy-to-follow rule to avoid debates about which vote counts. Transparency in minutes is key to prevent revisiting decisions. They need the procedure to handle both factual and value-based motions, with clear triggers for switching methods. Balancing theory with practicality for teenagers is essential—avoid jargon but maintain theoretical integrity.

  I should ensure each section addresses their specific examples. Highlighting one outcome the user won't like (e.g., defunding a club) adds honesty. Also, stressing documentation in minutes meets their need for finality. Acknowledging strategic voting prepares them for real-world tactics without overcomplicating the procedure.
answer: |-
  ## Student Council Judgment Aggregation Procedure

  **1. The Rule I Recommend (Approx. 300 words)**

  I recommend **Premise-Based Voting as the default rule** for motions where the decision demonstrably depends on specific, factual premises that logically lead to a conclusion. This means we normally vote on the underlying reasons ("premises") and let the logical combination of those votes dictate the final outcome, rather than voting directly on the main motion ("conclusion"). The outcome based on premises *must* be recorded as the council's decision, even if a direct vote on the conclusion would have gone the other way.

  **Why Premise-Based Beats Conclusion-Based:**
  *   **Consistency & Logic:** It forces the council to be logically consistent. If we agree on the reasons for doing something (the premises), we *must* agree on the action (the conclusion). The greenhouse example showed how conclusion-based voting allowed an illogical outcome where we accepted the reasons to cut funding but then voted *against* cutting it. Premise-based voting prevents this internal contradiction. It ensures our decisions are based on reasons we collectively endorse.
  *   **Focus on Evidence:** It shifts debate onto the *reasons* behind a decision. Is the greenhouse *actually* underused? *Can* the money be better spent elsewhere? *Is* it our job? This is usually more productive than arguing about the overall feeling of 'should we cut it?'
  *   **Protects Minorities (Indirectly):** While not perfect, premise-based voting ensures the outcome reflects the majority view *across all the necessary components*. It prevents a minority blocking action by switching sides on the final vote after losing on the premises, or vice-versa.

  **When to Use Conclusion-Based Voting (Overturning the Default):**
  *   **Motions Driven by Values or Preferences:** If the motion hinges *primarily* on collective taste, principle, or overall feeling, not separable facts (e.g., "Should we adopt blue or green as the official council colour?", "Should we express support for the striking canteen staff?").
  *   **Extremely Complex Motions:** If breaking down the motion into clear, distinct, and essential premises proves impossible or overly cumbersome within our time limits.
  *   **Unforeseen Ambiguity:** If premise voting produces an outcome that seems nonsensical or contrary to the *clear* intent of the debate, indicating the premises weren't correctly identified. (Use this sparingly!).

  The core strength of premise-based voting is enforcing logical coherence. Conclusion-based voting, while simpler, risks making decisions inconsistent with the council's own stated reasons. Premise-based is the default because coherence matters more than the potential awkwardness of the outcome.

  **2. The Procedure (Approx. 500 words)**

  **Chair's Step-by-Step Checklist:**

  1.  **Identify the Motion Type (Before or at Start of Debate):**
      *   Ask Proposer: "Does this motion depend on specific factual claims that, if all true, logically *force* us to accept the motion? Or is it mainly about our overall preference or values?"
      *   Ask Council: "Can we identify 1-3 key factual reasons ('premises') that absolutely *must* be true for this motion to pass? Are they things we could, in principle, check evidence for?"
      *   **Decision Point:** If YES to factual premises, proceed with Premise-Based Voting. If NO (values/preference dominant), proceed directly to Conclusion-Based Voting on the main motion. State your decision clearly.

  2.  **For Premise-Based Voting:**
      *   **Define Premises:** Work with the proposer and council *during debate* to define 1-3 clear, essential, and specific factual premises (P1, P2, P3...). Write them plainly on the board. *Crucially:* Ensure they are necessary AND sufficient – if *all* are true, the motion logically *must* pass. (e.g., for the greenhouse: P1: Greenhouse is significantly underused. P2: Funds saved would significantly benefit another council priority. P3: Council has authority to reallocate these funds).
      *   **Debate Premises:** Focus debate *only* on the truth/falsity of each premise. Discourage arguments solely about the overall conclusion at this stage. ("We're debating *only* if the greenhouse is underused right now").
      *   **Vote on Premises:** After debate on each premise (or all), hold a separate majority vote for *each* premise: "Do you accept Premise 1: Greenhouse is significantly underused? All in favour... against..." Record each vote result clearly.
      *   **Apply Logic:** **Immediately** after voting on all premises, apply the logic: "As the council accepts Premise 1, Premise 2, and Premise 3, the motion to cut funding is therefore carried" OR "As the council rejects Premise 2, the motion to cut funding therefore falls." *Do not* hold a separate vote on the main motion. The outcome is dictated by the premise votes.
      *   **Minutes:** Record EXACTLY: "Motion: [Text]. Voting Method: Premise-Based. Premises: (1) [P1 Text] - Accepted/Rejected ([Count]). (2) [P2 Text] - Accepted/Rejected ([Count]). (3) [P3 Text] - Accepted/Rejected ([Count]). Therefore, Motion: Carried/Fallen." Cite the logical connection (e.g., "Motion carried as all premises accepted").

  3.  **For Conclusion-Based Voting:**
      *   **Debate:** Hold debate on the main motion as usual.
      *   **Vote:** Hold a majority vote on the main motion.
      *   **Minutes:** Record: "Motion: [Text]. Voting Method: Conclusion-Based. Motion: Carried/Fallen ([Count])."

  4.  **Handling Ambiguity/Values:**
      *   If during Premise-Based setup, debate reveals a premise is actually a value judgment ("The greenhouse is *unimportant*") or is hopelessly ambiguous, declare: "Premise [X] cannot be treated as a verifiable fact. We revert to Conclusion-Based Voting on the main motion." Proceed to Step 3.
      *   If premise voting produces an outcome that seems utterly perverse and disconnected from *all* the debate *and* the premises were correctly identified, you *may* (as Chair, exceptionally) propose: "The premise outcome seems inconsistent with the clear thrust of our debate. I propose we revert to Conclusion-Based Voting for this motion only." This requires a simple majority vote of the council to approve the switch. *Document this exception thoroughly in the minutes.*

  5.  **Finality:** Once recorded in the minutes using the chosen method, the decision is final and cannot be reopened at the next meeting based *only* on disagreement with the voting method used. New evidence or a formal motion to rescind would be required.

  **3. Worked Cases (Approx. 450 words)**

  *   **(a) Funding a late bus on concert nights (Most personally support):**
      *   **Step 1:** Is it factual? YES. Key premises: P1: Sufficient student demand exists for the late bus on concert nights (verifiable via sign-ups/past use). P2: The cost is within the transport budget allocation. P3: The school administration has provisionally approved the route/timing if funded.
      *   **Step 2:** Debate/vote on P1, P2, P3.
      *   **Outcome:** Likely all premises accepted. Therefore, Motion to fund *carried*. (Even if someone dislikes buses personally, if they accept demand/cost/approval, logic dictates funding). **You like this.**

  *   **(b) Stop funding Club X (Most think it's a waste, some members belong):**
      *   **Step 1:** Is it factual? YES. Key premises: P1: Club X consistently fails to meet its stated objectives or provide clear value to the wider student body (verifiable via attendance, outputs, reports). P2: The funds currently allocated to Club X could be reallocated to demonstrably higher-priority council activities. P3: The council constitution allows defunding underperformance.
      *   **Step 2:** Debate/vote on P1, P2, P3. Focus on evidence of failure and alternative uses.
      *   **Outcome:** If majority accepts P1 (waste), P2 (better use elsewhere), and P3 (authority), then Motion to defund Club X is *carried*. **You won't like this outcome** if you're in the club or like its members, but the logic holds: the council accepts it's wasteful and money is better spent elsewhere. Personal membership shouldn't override the factual premises if accepted.

  *   **(c) Endorse homework policy change (Symbolic, no authority):**
      *   **Step 1:** Is it factual? NO (Primarily). While it *might* involve some facts (e.g., "Current policy causes stress"), the core question is one of collective *opinion* or *values*: "Does the council *support* this change?" as a symbolic stance. The motion's *impact* is non-factual (expression of view).
      *   **Decision:** Use Conclusion-Based Voting.
      *   **Step 3:** Debate the overall merits and symbolism. Vote on the main motion: "Endorse the proposed homework policy change."
      *   **Outcome:** Depends on the direct vote. Premise voting (e.g., P1: Policy causes stress? P2: Change would reduce stress?) *could* be used, but if P1 and P2 passed, premise logic would *force* endorsement, potentially against the council's *symbolic* intent ("We agree it causes stress, but we don't want to publicly criticise the Head"). Conclusion-based avoids this trap for value-laden motions.

  **4. Where the Procedure Misfires (Approx. 200 words)**

  No procedure is perfect. Here's where this one can stumble:

  1.  **Strategic Voting:** Savvy members might vote dishonestly on premises to manipulate the final outcome. E.g., someone wanting the greenhouse funded *despite* believing it's underused might vote *against* P1 ("underused") to block the conclusion, even if they think it's true. Premise-based voting relies on members voting their *genuine belief* on each premise. There's no easy fix; you must emphasise integrity and the importance of voting based on facts during debate. Conclusion-based voting is also vulnerable to strategy.
  2.  **Imperfect Premise Identification:** If the Chair/council gets the premises wrong (e.g., missing one, including a non-essential one, misjudging necessity/sufficiency), the logical outcome might be flawed or nonsensical. The "revert to conclusion-based" escape hatch exists but should be used rarely to avoid undermining the system. Careful debate during premise definition is crucial.
  3.  **Deep Value Conflicts Disguised as Facts:** Sometimes premises *seem* factual but mask core value disagreements (e.g., "The club provides value" – value-laden). If not caught in Step 1, premise voting forces a factual-looking outcome on a values issue, which feels unsatisfactory. Vigilance in Step 1 is key. The "ambiguous premise" switch helps here.
  4.  **Time Constraints:** Identifying and debating multiple premises fairly takes longer than one conclusion vote. For minor or urgent matters, conclusion-based may be pragmatically necessary despite the default rule.

  This procedure prioritises logical consistency and reason-based decision-making. While vulnerable to strategy and misapplication, it provides a clear, defensible framework that tackles the core problem of the discursive dilemma head-on, far better than ad-hoc decisions about which vote "counts". Stick to it rigorously, document meticulously, and emphasise honest voting on the facts.
