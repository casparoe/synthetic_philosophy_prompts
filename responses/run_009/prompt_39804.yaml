prompt: |-
  I am a high school student in an ethics elective. Last term we read part of Sharon Street's 2006 paper A Darwinian Dilemma for Realist Theories of Value, and this term we studied the sensitivity view of justification in epistemology, on which a belief is justified only if it tracks the facts: had what it says been false, you would not have believed it. I put the two together into an argument, and my teacher says it proves too much, but she would not tell me where it goes wrong, and I cannot find it myself.

  (1) A belief is justified only if it is sensitive: had its content been false, we would not have held it.
  (2) Take the belief that tormenting the innocent for fun is wrong. Natural selection built our moral psychology out of feelings and behavioral dispositions, and it would have installed the same dispositions whether or not such torment is actually wrong, since the moral facts, whatever they may be, do not determine which traits are fit.
  (3) So even in a world where such torment was permissible, we would still believe it to be wrong; the belief is insensitive.
  (4) By (1), the belief is unjustified.
  (5) Nothing is special about this belief: every moral conviction we owe to our evolved psychology is equally insensitive.
  (6) Therefore none of our moral beliefs are justified.

  Here is what unsettles me. When I run the reasoning of (2) on my belief in principle (1) itself, it seems to go through as well: the sensitivity principle reached me through a contingent curriculum and a particular teacher, that history was never steered by the moral facts either, and had my schooling gone differently I would reject the principle with equal confidence. But I would rather keep (1) than give up on all moral justification, and I do not want an argument whose principle devours itself.

  Which step or premise should I give up, and what does rejecting it cost? Please begin your response with the bottom line in the first sentence, then give the reasoning, with no preamble and no restating of my question.
reasoning: |-
  Hmm, the user is a high school student in an ethics elective who has combined Sharon Street's evolutionary challenge to moral realism with the sensitivity view of justification to argue that no moral beliefs are justified. Their teacher says this "proves too much," but won't explain why, and the student can't spot the flaw. They're unsettled because when they apply the same reasoning to the sensitivity principle itself, it seems to undermine that too - creating a self-defeating argument. They want to know which step or premise to reject and what it costs.

  First, I need to understand the core issue. The sensitivity view requires that if the belief were false, we wouldn't hold it. Street's Darwinian dilemma says evolution shaped our moral psychology independently of moral facts, so even if moral facts were different, we'd have the same beliefs - making them insensitive. Applying this universally leads to moral skepticism, but the student realizes the sensitivity principle itself falls prey to the same argument: had sensitivity been false, they might still believe it due to contingent educational factors.

  The key flaw is in step (2) and its generalization in (5). Step (2) assumes that for moral beliefs, the counterfactual scenario (where torment is permissible) wouldn't change our belief because evolution determines our responses regardless of moral facts. But this treats the sensitivity condition as requiring tracking through specific causal mechanisms (like evolution), when actually sensitivity is about the belief's truth-connection in possible worlds, not its origin.

  The epistemology here is crucial. Sensitivity doesn't require that the belief-forming mechanism be responsive to the facts in its actual causal history; it requires that in nearby worlds where the proposition is false, the belief isn't held. For moral beliefs, we might argue that in worlds where torment is permissible, our evolved psychology could still produce the belief, but that depends on assuming moral realism is false or that evolution is blind to moral facts - which is precisely what's contested.

  More importantly, applying this to the sensitivity principle itself shows the problem: if we say sensitivity is unjustified because we'd believe it even if false (due to education), that assumes we can specify how the world would be if sensitivity were false. But sensitivity is an epistemic principle; its falsehood might involve complex scenarios where justification works differently, making the counterfactual "had sensitivity been false, I wouldn't believe it" hard to evaluate. This leads to skepticism about epistemic principles too, which is self-undermining.

  The student should reject the generalization in step (5) and the assumption in step (2) that evolution makes moral beliefs insensitive. The cost is that we must allow moral beliefs could be sensitive if moral facts are suitably connected to evolution (e.g., via naturalism) or if we reject the idea that evolution precludes sensitivity. Alternatively, we might question whether sensitivity is the right condition for justification, as it's known to have counterexamples (e.g., necessary truths). This preserves moral justification but at the cost of either revising epistemology or engaging with metaethics to show how evolution and moral facts could align.

  The user's distress about self-devouring arguments is spot-on. The fix avoids that by limiting the scope of the evolutionary challenge: it doesn't automatically apply to all beliefs formed via contingent processes, only those where we have independent reason to think the process is truth-insensitive. For epistemic principles, we might hold them as necessary for coherent thought, making counterfactuals about their falsehood irrelevant or incoherent.
answer: |-
  Reject step (5)'s claim that all moral beliefs are insensitive due to evolutionary origins, as this overgeneralizes Street's argument and ignores potential alignment between evolutionary pressures and moral truths. 

  The flaw arises because step (2) assumes evolutionary forces are *necessarily* disconnected from moral facts. This presupposes moral realism is false—specifically, it assumes moral facts could not have influenced evolution. But if moral realism is true and moral facts supervene on natural properties (e.g., suffering reduces fitness), evolution *might* track moral truths. In such cases, counterfactual worlds where torment is permissible could involve different evolutionary pressures, potentially altering our beliefs. Thus, the insensitivity in (3) isn't guaranteed.  

  Rejecting (5) costs you Street's anti-realist conclusion: you must concede that *some* moral beliefs *could* be sensitive if evolution and moral facts align. However, this doesn’t prove realism true—it merely shows the argument doesn’t *force* global moral skepticism.  

  Your self-application worry reveals a deeper issue: sensitivity struggles with necessary truths (e.g., logic) and self-referential coherence. If you apply (2) to principle (1), you assume the sensitivity principle is contingent—but if (1) is necessarily true (or presupposed in justification claims), the counterfactual "had sensitivity been false" might be incoherent. Rejecting sensitivity’s self-application preserves epistemic principles at the cost of limiting its scope. Alternatively, abandon sensitivity altogether (due to well-known counterexamples like the lottery paradox) for a more stable theory of justification (e.g., proper functionalism), which avoids your dilemma but loses intuitive tracking.
