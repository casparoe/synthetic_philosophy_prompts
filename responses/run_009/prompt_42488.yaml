  We are designing an activity for a philosophy session. The goal is to experience the failure of the identity of indiscernibles in a variant of Black's universe (two identical spheres). We have two groups: the "inhabitants" (who are the two spheres) and the "scientists" (who are trying to figure out how many spheres there are and, if two, which is which). The catch: only qualitative language is allowed.

  Rules:
  1. **Language Constraint**: All communication must be in qualitative terms. No proper names, no indexicals (like "this", "that", "here", "me"), and no coordinate systems (like "the one at position (0,0,0)"). 
     - Examples of allowed language: "a sphere that has property P", "a sphere that is 1 mile from another sphere", "a sphere that is made of iron", etc.
     - Forbidden: "the sphere I am", "the sphere on the left", "Sphere A", etc.

  2. **Setup**:
     - Two participants are the spheres. They are in an otherwise empty space, 1 mile apart. They are qualitatively identical in every way (same material, same size, same temperature, etc.). 
     - The rest of the participants (scientists) are the observers. They can ask questions and receive reports from the spheres? But note: the spheres are just objects, they don't have subjective experiences. So we need to reinterpret the role of the "inhabitants".

     Revised setup: The two spheres are inanimate. We don't have participants "play" the spheres as if they were sentient. Instead, we have:

     - The scientists can only get information by making "observations". How? We need a way to simulate the information they can gather.

     Alternative idea: 
     - Instead of having participants play the spheres, we have the scientists ask questions to an "oracle" (the facilitator) who can only answer in qualitative terms. The oracle knows the entire state of the universe (which is just two identical spheres). 

     But the problem says: "some participants play inhabitants" ... so let's reinterpret.

     How about: 
     - We have two participants as the spheres. They are not allowed to speak. They are just there to be observed? But how do we observe without indexicals? 

     We need a different approach.

     Revised plan:

     We'll set up a physical simulation in the room. Place two identical objects (e.g., two identical balls) at two positions in the room. The scientists are allowed to look at the setup and take notes, but they cannot use any indexical language in their reports. They must describe the entire universe (which is the room) using only qualitative language.

     However, the problem says: "the rest play the scientific community trying to settle, by observation alone". So the scientists are observing the two spheres (the two identical objects). 

     But note: the scientists are in the room. They have positions relative to the spheres. So they might be tempted to use their own position as a reference. We must forbid that.

     To enforce the language constraint, we can have the scientists write down their observations and then have a referee (the facilitator) check for violations. Alternatively, we can have the scientists communicate only through written notes that follow the rules, and then the group tries to build a model.

     However, the problem also says: "by observation alone". So we need to simulate what it's like to be in that universe without any external reference frame.

     Let's try:

     Materials:
     - Two identical spheres (e.g., two identical balls, maybe even two identical metal balls if possible). 
     - A large open space (like a room) where we place the two spheres at a fixed distance (say 10 feet apart) and nothing else.

     Rules for the scientists:
     - They are not allowed to use any external reference frame (no walls, no floor markings, etc.). We must set the room as empty as possible. 
     - They are not allowed to use their own body as a reference (so no "the sphere closer to me").
     - They can only describe the universe by the properties of the spheres and the relations between them.

     How do they make observations? They can walk around, but they cannot use their own position in any description. They must describe the universe as it is without reference to observers.

     The goal of the scientists: to determine (1) how many spheres there are and (2) if there are two, to assign labels (but without using labels that violate the rules) so that they can distinguish them.

     However, the problem says: "which is which" — meaning they want to be able to identify each sphere uniquely.

     But note: the spheres are identical. So the scientists should not be able to tell them apart.

     Activity flow:

     1. Setup: Place two identical spheres in an empty room, at a fixed distance (say 10 feet apart). The scientists are allowed to enter the room and observe for 5 minutes. They can take notes, but they must write only qualitative descriptions (no indexicals, no coordinates).

     2. Then, the scientists leave the room and are given time (e.g., 15 minutes) to write a report that answers:
        - How many spheres are there?
        - If there is more than one, how can we tell them apart? (They must provide a qualitative description that uniquely identifies each sphere.)

     3. The catch: every time they try to write a distinguishing description, it should fail because any property of one sphere is also a property of the other. The only possible way to refer to a sphere is by relational properties, but every relational property that holds for one holds for the other (because the universe is symmetric).

     4. The win condition for the scientists: They win if they can produce a report that:
        a. Correctly states the number of spheres (which is two).
        b. Provides a way to uniquely identify each sphere using only qualitative properties (which they cannot do, because the spheres are indiscernible).

     However, note: they can state that there are two spheres, because "there are two spheres" is a qualitative fact about the universe (it doesn't refer to any particular sphere). So part (a) is achievable.

     But part (b) is the challenge.

     What will happen: 
     The scientists will try to come up with a description like:
        - "Sphere 1 is the one that is 10 feet from Sphere 2."
        - But then how do they label Sphere 1 and Sphere 2? They cannot use "1" and "2" arbitrarily? They must define them without assuming prior labels.

     They might say: 
        - There exists a sphere A and a sphere B such that A is 10 feet from B.
        - But then which one is A and which one is B? They have no way to assign the labels to the physical spheres without some way to tell them apart.

     Alternatively, they might try to use the direction from an observer, but that is forbidden.

     The point: they cannot assign unique labels to the spheres because there is no qualitative property that distinguishes them.

     Debrief:

     We map the experience to the philosophical concepts:

     1. **Invariance under swapping**: The universe is symmetric. If we swap the two spheres, the qualitative description of the entire universe remains the same. Therefore, there is no qualitative fact that can tell us which sphere is which.

     2. **Leibnizian response**: 
        - The Leibnizian might argue that if the spheres are truly indiscernible, then they are identical. But we have two. So the identity of indiscernibles fails.
        - However, the Leibnizian can salvage by moving to impure predicates (which involve reference to particular individuals). But the activity forbade impure predicates (like "the sphere I kicked") because we disallowed any reference to particulars that are not captured by qualitative properties. In the activity, we enforced pure qualitative properties (only intrinsic and relational properties that don't depend on any particular individual). 
        - Alternatively, the Leibnizian can point out that the statement "there exist exactly two spheres" is a qualitative truth. But that doesn't help to individuate the spheres.

     3. **Structuralist response**: The structuralist would say that the question "which is which" is meaningless because there is no fact of the matter. The only facts are structural: there are two spheres in a symmetric relation. The individual spheres do not have haecceities (non-qualitative individual essences).

     What will predictably go wrong:

     - Someone will try to use relational properties that involve the observer: "the sphere that I am looking at now" or "the sphere that is closer to the door". We must strictly enforce that the scientists cannot use any external reference (including the door, walls, or themselves). The universe is only the two spheres.

     - Another trick: "the sphere that I touched first" — but that involves an action by the observer and thus violates the pure qualitative constraint because it introduces a particular event and a particular observer.

     How to enforce the rules:

     - Have the facilitator (you) act as the referee. The scientists must write their report and hand it in. The facilitator will check for any use of indexicals, proper names, or external references. If any such term is used, the report is invalid.

     - Alternatively, during the observation period, the scientists are not allowed to interact with the spheres (no touching, no kicking). They can only look.

     What cannot be reproduced:

     - We are in a room with external references. Even if we try to remove them, the scientists are embodied and have a perspective. It is impossible to completely remove the indexical perspective of the observers. We have to imagine that the scientists are not part of the universe they are describing. But in the activity, they are. We must stress that the scientific report must describe the universe *without* the observers. So the scientists must abstract away from their own position.

     - Also, the activity cannot reproduce the complete emptiness of space. We have gravity, air, etc. We have to ignore that.

     Revised win conditions:

     The scientists win if they can:
        - Correctly state the number of spheres (two).
        - And either:
            (a) Provide two distinct qualitative descriptions that each pick out one sphere uniquely (which they cannot), OR 
            (b) Explain why they cannot distinguish the spheres and why the question "which is which" is not answerable.

     Actually, the point of the activity is to experience the failure. So we might not need the scientists to "win" in the sense of (b). Instead, they should experience the frustration of not being able to tell the spheres apart.

     Therefore, we might set the win condition as:

        - Correctly state the number of spheres: 1 point.
        - Successfully provide a qualitative description that uniquely identifies one sphere: 5 points (but impossible, so they get 0 for this).
        - Alternatively, if they conclude that the spheres are indistinguishable and explain why, that is a win (but we want them to try and fail).

     We want them to try to distinguish and fail. So the win condition is to get the number right and to realize that they cannot tell them apart.

     But we don't tell them that they are supposed to fail. We let them try.

     Steps:

     1. Preparation: 
          - Clear a room as much as possible. Place two identical balls (spheres) at two positions, say 10 feet apart. 
          - Prepare a handout with the rules for the scientists.

     2. Introduction to the activity:
          - Explain that we are simulating a universe that contains only two identical spheres in an otherwise empty space. 
          - The scientists are an external scientific community (they are not part of the universe) and they are to observe and report on this universe.
          - Rules: 
              * The report must be purely qualitative: no proper names, no indexicals, no coordinate systems, no reference to anything outside the two spheres (including the observers themselves, the room, etc.).
              * The goal: determine how many spheres there are and, if more than one, provide a way to uniquely identify each one by qualitative properties.

     3. Observation period (5 minutes): 
          - Scientists enter the room and observe. They can take notes, but they must follow the language rules.

     4. Report writing (15 minutes):
          - Scientists leave the room and work together to write a report.

     5. Report submission and review by the facilitator.

     6. Debrief:
          - The facilitator reveals that the spheres are identical and symmetric. 
          - The report likely got the number right but failed to uniquely identify the spheres.
          - Discuss:
              * Why did the descriptions fail? (Because any property of one sphere is also a property of the other.)
              * What if we allowed impure predicates? (Like "the sphere I kicked" — but that introduces a contingent event and a particular observer, which are not part of the intrinsic properties of the universe.)
              * The Leibnizian principle: the identity of indiscernibles would say that if two things have all the same properties, then they are identical. But here we have two distinct spheres. So the principle fails. 
              * The structuralist view: the spheres are just nodes in a structure (a symmetric relation of being 10 feet apart). The structure has two nodes, but the nodes themselves are indistinguishable. There is no fact of the matter about which is which.

     Materials:
        - Two identical spheres (e.g., two identical stainless steel balls, or two identical tennis balls if metal is not available). 
        - A large empty room (as empty as possible).
        - Handout with rules and the task.

     What if they try to cheat by using the time of observation? For example, "the sphere I observed first" — that's indexical and also involves the observer. We must explicitly forbid any reference to the act of observation or the observer.

     Rules handout should say:

        "You are to describe the universe as it is, without any reference to the act of observation or the observer. The universe consists only of the two spheres and the spatial relations between them. You may use properties such as:
          - Material: iron
          - Shape: sphere
          - Distance: 10 feet apart
        But you may not use:
          - Any term that refers to yourself (the observer) or your actions.
          - Any term that refers to the room or its features (walls, floor, etc.).
          - Any proper names or labels that are arbitrary (like 'sphere A') unless you define them purely qualitatively.
          - Indexicals: 'this', 'that', 'here', 'there', 'now', etc."

     Finally, note: the original Black's universe has the spheres in an otherwise empty space. We cannot perfectly simulate that because we are in a gravitational field, with air, etc. We have to ignore those and focus on the spatial relation and the properties of the spheres.

     This activity will lead to the experience of the failure of the identity of indiscernibles.

     What the activity cannot reproduce: 
        - The absolute emptiness of space. We have air, light, gravity, etc. We have to imagine that these are not part of the universe and that the spheres are the only things.
        - The lack of any external reference frame: in our room, there are walls, a floor, etc. We must instruct the scientists to ignore these and only consider the two spheres and the space between them. But it's hard. We might set up the spheres in the middle of the room and ask the scientists to imagine that beyond the spheres there is nothing. 

