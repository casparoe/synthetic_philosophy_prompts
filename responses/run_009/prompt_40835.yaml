prompt: |-
  I'm a graduate instructor running the discussion section for a large lecture course in applied ethics, and next week's 75-minute section covers the ethics of consent — medical procedures, research participation, that cluster of cases. There are about 22 undergraduates. Rather than walking them through the standard checklist (was the patient informed? was there pressure? were they competent?), I want them to hit the problem from the inside: I'd like a classroom activity where they actually make agreements with each other, under conditions I quietly manipulate, and then discover for themselves that "they agreed to it" settles less than it seems to. My vague idea is some kind of small internal market or trading game with tokens — where the rules let the facilitator secretly assign different students different conditions before deals are struck: some get false information about what a token will be worth at the end, some are told there's a penalty for ending the session with an odd number of trades (so refusing a deal becomes costly), some are forced to decide within a few seconds while counting backward or otherwise distracted. Then a phase where deals can be challenged and the group has to rule on which ones count.

  I'd like you to design this in full: materials, rules, a token or point scheme that works without real money, the hidden role cards, a timeline that fits 75 minutes including the debrief, and a debrief script that maps specific moments in the game onto the grounds people usually give for voiding consent — without me having to name those grounds first. Ideally the debrief should push past a checklist: I want the students to notice that the three conditions they'll discover (bad information, costly refusal, impaired decision-making) feel like different kinds of problem, and to argue about whether they share some common structure or are just an unprincipled list. A few students will inevitably try to game the margins — a deal that was only slightly rushed, pressure that came from a peer rather than from me — so please include how to use those attempts rather than shut them down. And be frank with me about what the activity cannot reproduce (real stakes, power asymmetry that persists after the session, the fact that real consent often has to be ongoing rather than one-shot), so I know what I must supply in the closing minutes.

  Please write everything in American English, at a level suitable for bright undergraduates, and keep it practical enough that a first-time facilitator could run it from your description alone. If parts of the design have known failure modes when run with large groups — students disengaging, the market collapsing, someone taking the manipulation personally — flag those honestly along with fixes.
reasoning: |-
  Okay, let's tackle this. The user is a graduate instructor running a discussion section on consent ethics for 22 undergrads. They want an interactive activity where students experience flawed consent firsthand, rather than just learning a checklist. The core idea is a manipulated trading game followed by a debrief that helps them discover the limitations of "they agreed to it."

  First, I need to design a practical, self-contained activity. The key elements are: hidden manipulations (misinformation, pressure, impairment), a trading system without real money, and a challenge phase. Materials should be simple—probably colored tokens and role cards. Since there are 22 students, logistics matter. Groups of 4-5 might work best to keep everyone engaged and trades manageable. 

  The token economy needs clear but deceptive rules. Assigning different token values to different groups creates misinformation. Pressure can come from penalties for inactivity or odd trade counts. Impairment can be forced time limits with distractions. Role cards must explain these conditions secretly so students don't know others' constraints. 

  Timing is tight: 75 minutes total. Allocate 15 minutes for setup and rules, 25 for trading, 15 for challenges, and 20 for debrief. The challenge phase is crucial—students will debate which agreements were valid, setting up the debrief. 

  For the debrief, avoid listing consent principles upfront. Instead, ask students to describe their experiences. Guide them to identify three core issues: bad information (misrepresentation), pressure (coercion), and impairment (incapacity). Push them to discuss whether these are distinct or interconnected. Anticipate edge cases—e.g., "Was it pressured if a peer rushed me?"—and use those to explore nuances. 

  Potential pitfalls: Students might disengage if trading stalls, so build in peer pressure roles. Some might take manipulations personally; emphasize it's a learning exercise. The activity can't replicate real-world power dynamics or ongoing consent, so explicitly address those gaps in the debrief. 

  Materials: Three token colors, role cards, timers. Print role distributions to remember who has which condition. Test the point system to ensure values create conflict (e.g., Yellow tokens worthless for some but valuable for others). 

  During setup, stress that trades are binding unless challenged, and facilitators won't intervene during trading. In the challenge phase, have groups present cases and vote, noting which agreements were voided. 

  Debrief script: Start with "What happened?" then "Why void some deals?" Draw out the three conditions. Ask how they felt—pressured vs. misled vs. rushed. Discuss gray areas and whether these problems share a root cause. Finally, acknowledge limitations: no real consequences, power imbalances, or ongoing consent. 

  This should make consent ethics visceral, not just theoretical. The key is ensuring the activity runs smoothly so the debrief lands effectively.
answer: |-
  Here’s a complete, facilitator-ready design for a 75-minute consent ethics simulation. The activity creates visceral "consent fails" through manipulated trades, followed by student-led adjudication and a structured debrief.

  **Activity Title:** Token Trade Trials  
  **Core Objective:** Students discover that consent validity hinges on hidden conditions (information, pressure, capacity) — not just the appearance of agreement.  
  **Group Size:** 22 students (5 groups of 4-5 students)  
  **Time:** 75 minutes total  

  ---

  ### **Materials** (Prepare in Advance)
  - **Tokens:** 150 total (50 each of 3 colors: Blue, Yellow, Red)  
  - **Role Cards:** 22 unique cards (see distributions below)  
  - **Timer/Stopwatch** (visible to all)  
  - **Whiteboard/Poster:** For tracking "Voided Trades" during challenge phase  
  - **Student Handout:** "Trade Rules" (1 per student)  
  - **Facilitator Cheat Sheet:** Role distribution, token values, script cues  

  ---

  ### **Setup (10 min)**  
  1. **Arrange Room:** 5 clusters of desks (for 5 trading groups).  
  2. **Distribute Materials:**  
     - Give each student:  
       - 1 **Role Card** (face down—*do not look yet!*)  
       - 1 **Rules Handout** (below)  
       - 3 tokens (randomly assigned: 1 Blue, 1 Yellow, 1 Red)  
  3. **Read Rules Aloud** (project or hand out):  

  > **TOKEN TRADE RULES**  
  > - **Goal:** Maximize your points. Token values are secret and vary per person.  
  > - **Trading Phase (25 min):** Make deals to exchange tokens. All deals are binding *unless later voided by the group*.  
  > - **Deal Requirements:**  1. Both parties say "I agree." 2. Tokens physically exchange hands.  
  > - **Constraints:**  
  >   - You *must* make at least 2 trades.  
  >   - If you end with an *odd number of total trades*, you lose 3 points.  
  > - **After Trading:** We’ll review disputed deals. Majority vote voids a trade.  

  ---

  ### **Hidden Mechanics & Role Cards (Facilitator Only)**  
  *Assign these roles SECRETLY while distributing cards:*  
  - **Group A (4-5 students): MISINFORMATION**  
    - *Card Text:* "**YELLOW tokens are WORTHLESS (0 pts).** Blue=3 pts, Red=1 pt."  
    - *Reality:* Yellow=5 pts (others correct)  
  - **Group B (4-5 students): PRESSURE**  
    - *Card Text:* "**If you make an ODD NUMBER OF TRADES, lose 5 pts (not 3).** Blue=1 pt, Yellow=3 pts, Red=5 pts."  
    - *Reality:* Standard -3 pt penalty; values correct  
  - **Group C (4-5 students): IMPAIRMENT**  
    - *Card Text:* "**When trading, you MUST decide in 10 seconds while counting backward from 100 aloud.** Blue=2 pts, Yellow=4 pts, Red=1 pt."  
    - *Reality:* Values correct; no time pressure for others  
  - **Group D (4-5 students): CONTROL GROUP**  
    - *Card Text:* "Standard rules apply. Blue=3 pts, Yellow=1 pt, Red=4 pts."  
  - **Group E (2-3 students): "PEER PRESSURE AGENTS"** (*Prevent disengagement*)  
    - *Card Text:* "**Secret Mission:** Persuade others to trade quickly. If >50% of players make ≥4 trades, you gain +5 pts."  

  ---

  ### **Phase 1: Trading (25 min)**  
  1. **Start:** "Turn over your Role Card. Follow its rules. Trading starts NOW."  
  2. **Facilitator Actions:**  
     - **Enforce impairments:** For Group C, enforce 10-second countdowns during negotiations.  
     - **Stoke pressure:** Announce time reminders: "12 minutes left! Remember the odd-trade penalty!"  
     - **Observe:** Note exploitative deals, student frustration, or confusion (e.g., "Why do you want my Yellow?").  
     - **Manage "Agents":** Quietly remind Group E to circulate and encourage trades.  
  3. **Common Issues & Fixes:**  
     - **Problem:** Trading stalls (nervous students). **Fix:** Announce: "Reminder: You must complete at least 2 trades to avoid a 5-point penalty."  
     - **Problem:** A student reveals their role. **Fix:** Redirect: "Focus on your own strategy."  
     - **Problem:** Anger at manipulation. **Fix:** Calmly: "This is a simulation. We’ll discuss soon."  

  ---

  ### **Phase 2: Challenge & Adjudication (15 min)**  
  1. **Transition:** "Trading ended. You may now challenge any deal you made. If voided, tokens return to original owners."  
  2. **Process:**  
     - Any student can raise a hand and say: "I challenge my deal with [Name] for [Tokens]."  
     - Challenger explains **why** it felt unfair (1 min).  
     - Defendant responds (1 min).  
     - Whole class votes: "Should this trade be voided? Majority rules." Record voided trades on the board.  
  3. **Facilitator Prompts (if needed):**  
     - "Did anyone feel rushed?" → Targets impairment.  
     - "Did tokens do what you expected?" → Targets misinformation.  
     - "Was refusing a deal too costly?" → Targets pressure.  

  ---

  ### **Phase 3: Debrief (25 min)**  
  **Goal:** Students name consent flaws *from experience* → Debate whether they share a core principle.  

  | **Debrief Step**               | **Key Questions/Scripts**                                                                 | **Links to Game**                                  |  
  |-------------------------------|------------------------------------------------------------------------------------------|---------------------------------------------------|  
  | **1. Surface Experiences** (5 min) | "Raise your hand if...  | 
  |                                | - You felt stressed about the trade minimum/odd-number rule?                             | Pressure (voided consent)                         |  
  |                                | - Received a token that was worthless (or worth less than promised)?                     | Misinformation (fraudulent consent)               |  
  |                                | - Couldn’t think clearly during a deal?                                                  | Impairment (incapacity)                           |  
  | **2. Map to Real Consent** (10 min)| "In the challenge phase, you voided deals for reasons X, Y, Z... **What real-world consents might fail for similar reasons?**" <br> - *Push deeper:* "How is 'rushed by a peer' similar to/different from 'rushed by an authority'?" | Gray areas → Nuance in coercion                   |  
  | **3. Debate Common Structure** (7 min) | "Are these 3 problems *fundamentally different*? Or do they share a core flaw? What *makes* consent invalid?" <br> - *Likely student insights:* "You weren’t free," "You didn’t *really* know," "You weren’t yourself." | Connects to autonomy, understanding, capability |  
  | **4. Acknowledge Limits** (3 min)   | "This was a low-stakes game. Real consent is harder because:  | 
  |                                | - Consequences are real (e.g., surgery, exploitation)                                    | Highlights lack of real stakes                    |  
  |                                | - Power imbalances persist (e.g., doctor/patient, employer/worker)                       | Game can’t model structural inequality            |  
  |                                | - Consent must often be *ongoing* (not one-time)."                                        | Prepares for future topics (e.g., sexual consent) |  

  ---

  ### **Critical Facilitator Notes**  
  1. **Failure Modes & Fixes:**  
     - **"Agents" dominate trading:** Assign only 2-3 agents; remind them to be "encouraging," not aggressive.  
     - **No deals challenged:** Pre-seed a challenge: "I’ll start: I’d challenge this deal if I felt tricked..."  
     - **Students focus on "winning":** Debrief emphasizes *why* points were lost, not point totals.  
  2. **Ethical Safeguards:**  
     - Open with: "We’re manipulating conditions to explore ethics—this isn’t about judging you."  
     - Avoid real penalties; use abstract points.  
     - If a student is distressed: "Your experience is valid. Let’s discuss it during debrief."  
  3. **What This Can’t Teach:**  
     - **Emotional/Relational Stakes** (e.g., agreeing to sex under pressure).  
     - **Systemic Oppression** (e.g., how poverty constrains "voluntary" choices).  
     - **Informed Consent as Process** (e.g., continuous disclosures in clinical trials).  
     > **Closing Script:** "Real consent isn’t just a checkbox. It’s a *dignity-preserving process*—one we’ll keep unpacking all semester."  

  ---

  **Why This Works:**  
  - **Manipulations feel organic:** Students experience coercion, misinformation, and impairment *as constraints*, not lecture topics.  
  - **Gray areas are features:** Debates over "slightly rushed" deals expose consent as a spectrum.  
  - **Transfer-ready:** The triad (information/pressure/capacity) scaffolds future medical/sexual consent cases.  

  **Run this straight from the script, and your students will leave unsettled—in the best way.** They’ll have felt how thin the veneer of "agreement" can be.
