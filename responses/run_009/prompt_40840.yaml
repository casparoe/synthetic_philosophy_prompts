  I keep running into the claim that Bertrand's chord paradox "refutes" the principle of indifference outright, and I'd like a number instead of a vibe. The question: what's your credence that there's a principled, non-ad-hoc way to extend the principle of indifference to continuous parameters that avoids Bertrand-type paradoxes in general? Please decompose it rather than just give a bare number — e.g. how much turns on whether the paradoxes reveal a genuine inconsistency in the principle versus just showing it was never meant to apply to unbounded continua in the first place; how much on whether Jaynes-style invariance requirements (the distribution shouldn't change when you translate/rotate/dilate the problem) really settle the chord case; how much on whether invariance can handle trickier cases like Keynes's wine/water paradox, where the same information gives you different distributions depending on which ratio you treat as the fundamental quantity; and whatever other terms you think belong in there. Then combine them, tell me which term you're least confident in, and what argument or result would move it most. For what its worth my own gut number is around 0.35, mostly because the wine/water case smells like something symmetry considerations alone can't fix, but I've honestly never seen the whole thing laid out carefully and I suspect I'm double-counting somewhere.
