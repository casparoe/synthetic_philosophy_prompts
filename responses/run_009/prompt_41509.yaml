answer: |-
  Your description captures a fascinating and under-discussed phenomenon in dream cognition. While no single established term perfectly encompasses your "mixed model," several concepts intersect with it, and a precise coinage is warranted. Here's a breakdown:

  ### 1. Established Concepts & Related Ideas
      *   **Confabulation:** As you note, this typically involves filling memory *gaps* in a narrative about a *real past event* (e.g., brain injury, dementia). Your process involves constructing a narrative where the "past event" (the full dream) may not have existed in that form. It's related but distinct.
      *   **False Memory:** Concerns the creation or distortion of memories for events that didn't happen *in waking reality*. Dreams are subjective experiences, making "false" harder to define. Your "invented" details fit here, but the *entire narrative's* status is the core issue.
      *   **Narrative Construction (Foulkes, Domhoff):** Cognitive psychologists like David Foulkes and William Domhoff emphasized that dreaming involves cognitive processes (memory access, narrative construction) similar to waking thought. They wouldn't deny the *experience* during sleep, but focus on its constructive nature *as it happens*. Your observation shifts the construction significantly *post*-awakening.
      *   **"Dreams are Not Experiences" (Norman Malcolm):** Philosopher Malcolm argued dreams are *only* the waking report or memory, denying any conscious experience during sleep. This is close to your "none" extreme, which you reject due to the felt residue.
      *   **Dennett's "Cassette Theory" (Critique Target):** Daniel Dennett proposed this (as a target for critique, not his own belief) – the idea that dreams are fully formed "recordings" played back upon waking. Your experience directly contradicts this.
      *   **Memory Reconsolidation:** The theory that recalling a memory makes it labile and subject to change before being stored again. While relevant to *subsequent* distortions, it assumes an initial memory trace to reconsolidate, which is precisely what your model questions for the *narrative* part.
      *   **Affective Residue Primacy (Hobson & McCarley, Solms):** Neurobiological models (AIM, Solms' findings) suggest emotional/limbic systems are active earlier in sleep cycles than complex narrative cortex. This supports the primacy of the affective/mood residue you describe.

  ### 2. The Mixed Model & Its Defenders
      The core of your idea – **an affective/sensory kernel experienced pre-awakening, with the narrative largely constructed *de novo* during the reporting process** – doesn't have a single, universally recognized name. However, elements of it are present in contemporary thought:
      *   **Implicit Support:** Many cognitive scientists studying dreams acknowledge the reconstructive nature of dream *reporting* and the fragility of dream memory. Your specific emphasis on the *kernel + construction* model aligns with this perspective, even if not always explicitly stated as the dominant mechanism. Researchers like **Tore Nielsen** (memory consolidation in dreams), **Jennifer Windt** (phenomenology of dreaming), or **Melanie Rosen** (dream cognition) would find your observations empirically plausible within a constructive framework.
      *   **Philosophical Kinship:** Your view shares similarities with **constructivist views of memory** (e.g., influenced by Bartlett) applied specifically to the dream state. It navigates a middle path between Malcolm's radical skepticism and naive realism about dream recall. Philosophers of mind like **Thomas Metzinger** (phenomenal self-models) or **Andy Clark** (predictive processing) might see your model as consistent with the brain as a proactive simulator, constructing narratives even in the recall phase based on sparse cues.

  ### 3. A Coined Term & Precise Definition
      **Term:** **Oniric Kernel Elaboration (OKE)** or **Oneiric Retroconstruction (OR)**

      **Definition:**
      Oniric Kernel Elaboration (OKE) is the cognitive process whereby the reportable narrative content of a dream is generated primarily *during the act of waking recollection and reporting*, constructed around a minimal, non-narrative kernel of experience (e.g., a mood, a sensory impression, a visceral sensation, a single static image, a sense of significance) that was genuinely present in the final moments of sleep or the transition to wakefulness. The elaborated narrative is not a recall (accurate or distorted) of a fully formed prior experience, nor is it pure confabulation unrelated to sleep mentation. Crucially, it involves a fundamental *indeterminacy* for the reporter regarding which details are reconstructions of latent sleep mentation traces and which are novel inventions generated to create a coherent narrative fitting the kernel.

      **Distinctions:**
      *   **vs. Confabulation:** Confabulation fills gaps in a memory *of a known past event*. OKE constructs the narrative *of the event itself* based on a kernel, where no full narrative event necessarily pre-existed. The "event" (the dream-as-told) comes into being *through* reporting.
      *   **vs. Ordinary Memory Distortion:** Ordinary distortion alters details of a recalled event. OKE questions whether the core narrative *was* an event to be recalled in that form. The distortion is inherent to the *creation* of the reportable memory trace.
      *   **vs. "Dreams are not Experiences" (Malcolm):** OKE explicitly acknowledges a genuine kernel of experience during sleep (affect, sensation, image). It denies only that the *narrative structure* existed prior to reporting.
      *   **vs. Complete Dream Experience During Sleep:** OKE denies that the *specific narrative* reported was fully experienced during sleep, attributing its structure to waking construction around the kernel.

      **Boundary Case Demonstrating Indeterminacy:**
      **Scenario:** You wake with a strong, diffuse sense of dread and a fleeting, non-specific impression of being chased. As you write, you "recall" running through a dark forest, the sound of snapping branches, and a pursuer whose form shifts between a shadow and a known person. Weeks later, you vividly "remember" this forest chase dream.
      **Indeterminacy:** Did the specific narrative elements (forest, branches, shifting pursuer) exist as such during sleep? Or were they generated during reporting to make sense of the kernel (dread + chased)? Under OKE, this is *genuinely indeterminate*. The dread and sense of pursuit are the kernel. The elaborated details could be reconstructions of fleeting, unintegrated sleep sensations (e.g., REM visual fragments, sensations of movement) *or* inventions triggered by the kernel and the act of narration itself. There is no reliable introspective or objective way to determine their ontological status relative to the sleep period. The dream-as-experienced-during-sleep remains the kernel; the dream-as-told is the OKE product.

  ### Conclusion
  Your insightful observation identifies **Oniric Kernel Elaboration (OKE)** as a distinct cognitive process. While related to confabulation, memory distortion, and constructivist theories, it is defined by the *post-sleep generation of a narrative around a minimal pre-awakening kernel*, coupled with inherent indeterminacy about the origin of details. Elements of this view are implicit in modern cognitive and neurobiological dream research (e.g., Foulkes, Hobson, Solms, Nielsen, Windt), which recognizes the constructive nature of dreaming *and* dream reporting, and the primacy of affective/sensory elements. Your "mixed model" is a sophisticated articulation of this constructive process, positioned firmly between the extremes of total pre-existence and total non-existence of the dream experience. It highlights dream reporting not as retrieval, but as a unique act of creation constrained by a somatic and affective trace.
