prompt: |-
  I've noticed something odd about how people react to convention violations, and I want to know what it says about whether these conventions are actual moral obligations. When a tourist cuts a queue in London, or jaywalks in a place where that's taboo, people mostly shrug or quietly help them fix it. The same act by an obvious local gets the glare, the tutting, sometimes a confrontation. And it's not just about legal consequences — jaywalking is illegal where I live but a local doing it barely registers, while in some countries the queue etiquette feels enforced more fiercely than actual laws. So here's my question: what does this asymmetry presuppose about how everyday conventions bind us?

  My working hypothesis is that the tourist/local distinction tracks something like common knowledge: a local is presumed to know the convention, so their violation signals disregard rather than ignorance, and maybe the obligation only exists once you're inside the circle of people who know the practice. But that can't be the whole story, because tourists get the benefit of local conventions (their tip gets accepted, their spot in the line is honored) without apparently being bound by them. Is the practice presupposing that conventions create obligations through knowledge rather than through consent or through receiving benefits? That seems weird — it's almost the opposite of how we think about, say, accepting a ride from someone: you can't just take the benefits and disclaim the norms.

  So: reconstruct the implicit theory here. Does the tourist-forgiveness pattern strictly require one view of how conventions obligate (knowledge/uptake-based, consent-based, benefit-based, or just coordination-value-based), or is it compatible with several? Where would each view actually predict that locals should treat a tourist's violation the same as a local's, and does the practice then count as evidence against that view? Also tell me whether the same implicit theory can handle the visitor's side: if I spend a month in a country, is there a principled point at which "I didn't know" stops being available to me, and does that suggest the obligation is gradually acquired rather than switched on?

  One more thing I'm genuinely unsure about: whether the pattern is even about obligation at all. Maybe the glare at locals isn't moral blame but something more like enforcement of a coordination equilibrium, and the shrug at tourists is just a cost-benefit judgment about the pointlessness of correcting someone who leaves tomorrow. If that's right, the practice might presuppose nothing about morality at all — conventions as pure Lewis-style coordination solutions, with the "moral" flavor just an enforcement mechanism. Tell me if that deflationary reading can really explain the data, or whether something about the reaction (the personal offense, the sense of disrespect) escapes it.

  Please separate clearly in your answer what is actually settled among philosophers who work on conventions and social norms from what is genuinely contested — don't present one theory of how conventions bind as if everyone agrees on it. And after your prose answer, give me a JSON object with exactly these fields: "implicit_theory" (your best reconstruction of what the practice presupposes, one or two sentences), "strictly_required" (which views of convention-based obligation are strictly ruled out by the tourist/local asymmetry), "compatible_views" (views that fit the pattern equally well), "deflationary_reading_verdict" (whether the pure-coordination reading survives, and why, one sentence), "visitor_transition" (your account of when a visitor becomes bound), "settled" (list of points that are well established), "contested" (list of points where informed people disagree), and "decisive_case" (a real or invented scenario that would best discriminate between the main views).
reasoning: |-
  Okay, let me tackle this user's query about convention violations and moral obligations. The user observes an asymmetry in reactions to tourists versus locals breaking conventions like queue-cutting or jaywalking. Locals get glared at while tourists get a pass. They want to understand what this says about whether conventions are moral obligations or something else.

  First, I need to unpack their working hypothesis about common knowledge. The user suggests that locals are presumed to know the convention, so their violation is seen as disrespectful. But they point out a puzzle: tourists benefit from conventions without being bound by them. This challenges typical moral frameworks like consent or reciprocity.

  The user asks several specific questions: What implicit theory explains this asymmetry? Which obligation theories are ruled out? How does the transition from tourist to local work? And is this even about morality or just practical coordination?

  Looking at philosophical theories, David Lewis's coordination norms come to mind - conventions solve coordination problems. The asymmetry might stem from enforcement efficiency: correcting tourists isn't worth it. But the user notes reactions often feel moral ("disrespect"), which pure coordination might not capture.

  Margaret Gilbert's joint commitment theory could explain the moral flavor - locals mutually recognize obligations. Tourists aren't part of this commitment. This fits the asymmetry but raises questions about when exactly a visitor becomes bound.

  The benefit theory (receiving benefits creates obligations) seems challenged because tourists enjoy convention benefits without backlash for violations. Consent theory also struggles since tourists don't explicitly consent.

  For the transition question, it's likely gradual based on perceived knowledge and duration of stay rather than a sudden switch. The "reasonable person" standard might apply - how long should someone take to learn local norms?

  The deflationary reading (pure coordination) has merit but may not fully explain the moral outrage directed at locals. A hybrid view seems plausible: conventions start as coordination tools but develop moral force through group identification.

  Key settled points: conventions differ from moral rules; enforcement varies by context; knowledge affects obligation attribution. Contested areas include whether conventions inherently create moral duties and how group membership binds individuals.

  A decisive case might involve a long-term resident who violates conventions while claiming ignorance. Reactions would test whether obligation stems from knowledge, benefits, or group membership.

  For the JSON response, I'll synthesize these insights: implicit theory combines coordination value with group-based expectations; benefit and consent theories are ruled out; hybrid views are compatible; deflationary reading partially works but misses moral dimensions; transition depends on reasonable expectation of knowledge.
answer: |-
  Here's a breakdown of the philosophical landscape surrounding your observations, separating settled points from contested theories and addressing your specific questions:

  **Analysis & Reconstruction:**

  Your observation highlights a core feature of social conventions: their normative force is deeply context-dependent and tied to group membership and presumed knowledge. The asymmetry suggests conventions operate less like universal moral laws and more like *conditional obligations within a shared practice community*.

  1.  **Implicit Theory (Reconstruction):** The practice presupposes that conventions create *pro tanto* obligations primarily through **presumed shared understanding and participation in a cooperative scheme** within a reference group. Violations by known participants are seen as free-riding or undermining the scheme, warranting corrective responses, while violations by outsiders are seen as mere mistakes or ignorance, warranting tolerance or instruction. The moral valence ("disrespect") arises from the perceived threat to the cooperative equilibrium by an insider.

  2.  **Theories Strictly Ruled Out:**
      *   **Strict Benefit-Based Obligation:** If merely receiving the benefits of a convention (like an orderly queue) were sufficient to create a binding obligation, tourists benefiting from the queue *should* be blamed equally for cutting it. The consistent asymmetry in reaction strongly counts against this being the *sole* or *primary* source of obligation in these contexts.
      *   **Explicit Consent-Based Obligation:** Tourists rarely explicitly consent to local conventions upon arrival. If explicit consent were required, tourists wouldn't be bound at all, yet they *are* often expected to learn and eventually adhere, and their initial violations are forgiven precisely because consent/knowledge is presumed absent. The asymmetry suggests consent is tacit and presumed through participation/knowledge, not explicit.

  3.  **Compatible Views:**
      *   **Knowledge/Uptake-Based:** This fits well. Obligation arises once one *knows* the convention and its role in coordination (Lewis). Tourists aren't presumed to know, locals are. This explains the asymmetry.
      *   **Coordination-Value-Based (Lewisian):** The convention's value in solving coordination problems is foundational. Enforcing against ignorant tourists is inefficient and doesn't serve coordination (they'll leave/didn't know). Enforcing against locals maintains the equilibrium. The *form* of enforcement (glare vs. shrug) can be seen as cost-effective sanctioning.
      *   **Joint Commitment (Gilbert):** Conventions create obligations via a joint commitment of the relevant group (e.g., Londoners queuing). Tourists aren't parties to this commitment, so their violations don't breach it in the same way a local's does.
      *   **Hybrid Views:** Most plausible views combine elements. E.g., Coordination value + Presumed Knowledge + Group Membership. The obligation stems from the value of the coordination solution, but it only binds those who are recognized participants in the group that sustains it and who can reasonably be expected to know it.

  4.  **Deflationary Reading Verdict:** The pure Lewisian coordination-value/equilibrium-enforcement reading **partially survives but is incomplete**; it explains the *asymmetry in enforcement* (cost-benefit) but struggles to fully account for the *moralized reactions* (personal offense, sense of disrespect) directed at locals, which suggest an element of perceived betrayal or failure of reciprocity beyond mere equilibrium maintenance.

  5.  **Visitor Transition:** There is no sharp, principled switch; obligation **gradually accrues** based on **reasonable expectations of knowledge and integration**. Key factors: duration of stay, observable effort to learn norms, self-presentation (acting like a resident), and the nature of the convention (ubiquity/complexity). "I didn't know" loses validity when a "reasonable visitor" in that situation for that duration *should* have known. This gradualism supports knowledge/uptake-based or group-participation-based views over sudden consent or benefit-based triggers.

  6.  **Settled (Broad Consensus):**
      *   Conventions (like queueing, jaywalking norms) are distinct from core moral rules (like prohibitions on murder).
      *   Their primary function is solving coordination problems or structuring social interaction efficiently.
      *   Enforcement of conventions varies significantly based on context, perceived intent, and group membership.
      *   Presumed knowledge of the convention is a major factor in the reactive attitudes (like blame) people have towards violators.
      *   Social norms (of which conventions are a subset) often carry a sense of "oughtness" or mild moral force for group members.
      *   Newcomers are generally granted leeway ("benefit of the doubt") regarding conventional violations.

  7.  **Contested:**
      *   **The Source of Normativity:** Does the "ought" of conventions stem *only* from their coordination value (Lewis), from joint commitments (Gilbert), from expectations of reciprocity (Bicchieri), from rule-following dispositions (Millikan), or from a hybrid?
      *   **Moral Status:** Are conventional obligations genuinely *moral* (even if weak/contextual), purely *prudential* (avoiding sanctions), *constitutive* of social groups, or something else (e.g., "proto-moral")? Does the feeling of "disrespect" point to a moral element?
      *   **Role of Benefits:** While strict benefit-based obligation is ruled out, the *degree* to which benefiting from the convention strengthens the obligation *once knowledge is acquired* is debated.
      *   **Group Membership:** How is the relevant "group" bound by the convention defined? Residence? Participation? Identification? How porous are the boundaries?
      *   **Acquisition of Obligation:** Precisely *how* and *when* does the obligation transition from non-existent to binding for a newcomer? Is it purely knowledge-based, or does some form of tacit agreement/participation play a role?

  8.  **Decisive Case:** **The Long-Term "Ignorant" Resident:** Imagine someone who moves to London, lives there openly for 5 years, uses queues daily, benefits from them, but consistently cuts them whenever possible, always pleading "I didn't know queuing was a thing here!" when confronted.
      *   **Benefit-Based View:** Should predict strong condemnation (they clearly benefit and violate).
      *   **Consent-Based View:** Unclear - did they consent by staying? Ambiguous.
      *   **Strict Coordination-Value (Deflationary):** Predicts enforcement focused on *stopping* the behavior due to its disruption, regardless of pleas, but might not predict the intense *moral outrage* ("You *must* know by now! How disrespectful!").
      *   **Knowledge/Uptake-Based:** Predicts outrage based on the *implausibility* of ignorance after 5 years; obligation is clear.
      *   **Joint Commitment/Group Membership:** Predicts outrage as a breach of commitment to fellow Londoners after ample time to join the commitment.
      *   **Hybrid (Knowledge + Group + Coordination):** Predicts outrage based on unreasonable ignorance undermining the cooperative scheme they participate in.
      *   *The intensity and moral flavor of the reaction towards the long-term resident, especially if their plea is met with scorn rather than just attempts to stop them, would best support views emphasizing knowledge uptake, group membership, and perceived reciprocity failure over pure coordination-value or weak benefit-based views.*

  **Conclusion:**

  The tourist/local asymmetry strongly suggests that everyday conventions bind individuals not merely through the benefits received or abstract coordination value, but through a combination of **presumed knowledge** and **membership/participation within the group that sustains the convention.** While the coordination value explains *why* the convention exists and why enforcement happens, the *asymmetry in reactive attitudes* points to an additional layer of perceived reciprocity and group obligation that applies more forcefully to insiders. The deflationary (pure coordination) view explains the *behavioral* asymmetry well but struggles with the *phenomenology* of moral offense directed at locals. The transition for a visitor is gradual, based on the reasonableness of expecting them to have acquired the relevant knowledge and integrated into the practice community. The core philosophical contestation revolves around whether the "ought" generated by conventions is fundamentally prudential, genuinely moral (albeit contextually restricted), or something unique to social norms.

