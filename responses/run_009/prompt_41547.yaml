prompt: |-
  So I'm in this course called Peace and Conflict Studies (kind of a history/sociology hybrid) and we just did a unit on long-term trends in violence, built around the debate about whether the world has actually gotten less violent since the hunter-gatherer days. Our assignment was to keep a notebook of gut verdicts on edge cases for a couple weeks, and now I have to figure out what principle, if any, sits behind my own verdicts. Here's roughly where I ended up. Genghis Khan was worse than WWII per capita, and per capita is how I want to count, so the medieval world comes out more violent than the 1940s. But in absolute numbers more humans died from violence in the twentieth century than in any century before it, and I feel the pull of saying that makes it the most violent century ever — I can't hold both, and I don't know which to drop. I count Stalin's and Mao's famine deaths as violence, because policy caused them, but I don't count a goverment that fails to send aid during a drought, even though more people die in the second case sometimes. I don't count car crashes, even though road deaths (over a million a year now) dwarf recent battle deaths, because nobody intends them — and I count a single drone strike that kills ten civilians as violence, which feels consistent with the intent thing. On suicides: I don't count them, even though they now exceed war deaths globally, and something about that bugs me, but I hold the verdict anyway. Then there's factory farming. If I counted it, the present would be by far the most violent era in history, orders of magnitude beyond anything Genghis did, and I don't count it — but I can't say why, since I do count people worked to death in camps, and the animals aren't dying by accident either. My TA keeps pushing "structural violence" (preventable deaths from poverty, no healthcare) and I keep resisting counting those, but then I remember that a siege is just withholding food on purpose, so what exactly is the difference between a siege and letting people die of treatable disease because the budget went elsewhere?

  My tentative principle is something like: a violent death is one caused intentionally by human agents, excluding self-harm, and the trend should be measured per capita against population. Does that actually capture everything above, or do I have to give something up — the absolute-numbers verdict about the twentieth century? the exclusion of factory farming or suicides? Please tell me which of my verdicts the principle can't save and why those verdicts looked fine to me at the time. Also, what does the principle predict for cases I never wrote down, like economic sanctions that kill civilians indirectly through disease, or a state executing criminals, or cumulative brain damage in contact sports. And one more thing, which is honestly the part I'm most confused about: my professor claims that whether the world is becoming less violent has no fact of the matter at all, because the choice of metric (per capita vs absolute, what counts as a death "from" violence) is value-laded all the way down. Is she right? Or is there something non-conventional that makes per capita the correct measure rather than absolute numbers, once you've fixed what counts as a violent death in the first place? I'd take an answer that says "there's no fact of the matter until you pick, but here's why one picking is better," I just want to know if even that much can be defended.
