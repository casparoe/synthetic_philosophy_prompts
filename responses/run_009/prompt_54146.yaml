prompt: |-
  I'm a second-year undergrad taking a philosophy of mind module that's basically organised around what Dennett called the strange inversion of reasoning — Darwin's move of treating apparent design as something that needs no designer, and Turing's of treating apparent comprehension as something that needs no comprehender. For the term essay we set our own question, and instead of just grabbing one I want to work out which of the open problems in this area is actually worth 3,000 words. The candidates I can see: (1) whether the two inversions are genuinely the same move or merely analogous — lots of people slide from "evolution produced comprehenders without a comprehender, so computation can too", and if the moves are only analogous that slide is illegitimate; (2) whether "comprehension" can even be characterised independently of competence, since without that the whole inversion arguably can't be stated, let alone evaluated; (3) a suggestion from my tutor that there's a third inversion sitting in systems that produce explanations without understanding them — chatbots are the obvious case, but he thinks markets or scientific institutions might work too — and I honestly can't tell whether that's a genuinely new inversion or just the Turing one restated with new clothes on. Rank these, plus anything you think I've missed, by how worth my term essay they are: importance, tractability without any empirical work, and how many of the other questions depend on each one. Defend the ordering — I want to know why the top one is top, not just that its unresolved. No reading lists please, I've got the library covered. End with a final line beginning "Verdict:" naming the single question you'd tell me to write on.
