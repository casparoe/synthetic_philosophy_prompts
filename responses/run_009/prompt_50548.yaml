answer: |-
  Here's a breakdown of your flatmate's claims, assessed from a Fregean perspective:

  1.  **"Frege's puzzle is that 'Hesperus is Phosphorus' can be genuinely informative... while 'Hesperus is Hesperus' can't tell you anything..."**
      *   **Frege Scholar's View:** **Accurate.** This is the classic statement of the puzzle from "Über Sinn und Bedeutung." The cognitive significance differs despite identical referents.

  2.  **"Frege solved this by saying expressions have a sense in addition to their reference..."**
      *   **Frege Scholar's View:** **Accurate (Core Solution).** The sense/reference distinction is indeed Frege's solution.

  3.  **"...the sense is basically the cluster of ideas or the mental file the speaker associates with the name..."**
      *   **Frege Scholar's View:** **Frege would flatly deny this.** This is a *major* conflation and misrepresentation. Frege explicitly argued **against** psychologism. For Frege:
          *   **Sense (Sinn) is objective and public:** It's the "mode of presentation" of the reference, existing in a "third realm" distinct from the physical world and subjective ideas. It's the *meaning* grasped by competent language users, not a private mental state. Think of it as the objective *way* the referent is determined or given (e.g., "the morning star" vs. "the evening star").
          *   **Ideas (Vorstellungen) are subjective and private:** These *are* the mental images, feelings, or associations unique to an individual. Frege argued ideas cannot be the meaning (sense) of an expression precisely because they are private and unshareable, leading to solipsism and the breakdown of communication and logic.

  4.  **"Since senses live in individual minds, two speakers can never share one, and communication is always at best approximate..."**
      *   **Frege Scholar's View:** **Frege would flatly deny this.** This directly contradicts Frege's core motivations. Precisely *because* sense is objective and not tied to individual minds:
          *   **Senses *can* be shared:** Competent speakers of a language grasp the *same* sense associated with an expression. This is the foundation of successful communication and the objectivity of logic and truth for Frege.
          *   **Communication aims at (and often achieves) exact sharing of sense:** While misunderstandings happen, the *point* of language is to convey the same objective sense. Approximation isn't inherent to the *nature* of sense; it's a practical failure mode.

  5.  **"'Hesperus is Phosphorus' isn't really a statement about Venus at all -- it's an empirical claim about our concepts..."**
      *   **Frege Scholar's View:** **Frege would flatly deny this.** For Frege:
          *   The statement **is** fundamentally about Venus (the referent).
          *   Its *truth value* (True) is determined solely by Venus being identical to itself.
          *   What makes it *informative* is the different senses ('Hesperus' vs. 'Phosphorus') leading to that single referent. It's a discovery about the *world* – that the object presented one way (as the morning star) is the *same* object as the one presented another way (as the evening star). It's not a claim *about* the senses themselves or our private concepts.

  6.  **"...later work in the Kripke tradition showed the whole sense/reference thing rests on treating names as disguised descriptions..."**
      *   **Frege Scholar's View:** **Common Simplification / Oversimplification.** Kripke (in *Naming and Necessity*) did launch a devastating attack on the **Descriptive Theory of Names** (often attributed to Frege and Russell), arguing names are *rigid designators* (refer to the same object in all possible worlds) and not equivalent to clusters of descriptions. However:
          *   Frege's theory of sense *for names* often *is* interpreted as involving descriptive senses (e.g., the sense of "Aristotle" might be "the teacher of Alexander the Great" or a cluster). Kripke's arguments strongly challenge *this aspect* of how Frege's sense is applied to names.
          *   But the sense/reference distinction itself is **broader** than just names-as-descriptions. Frege applied it to all sorts of expressions (definite descriptions, concept words, sentences). Kripke's arguments primarily target the *specific nature* of the sense of proper names, not the general distinction itself.

  7.  **"...once you drop that [names as disguised descriptions] the distinction collapses anyway."**
      *   **Frege Scholar's View:** **Overstatement / Non-Sequitur.** This does not follow:
          *   **Targeted Attack:** Kripke successfully challenged the *descriptive* model of the sense of *proper names*. This is a significant blow to *one application* of Frege's distinction.
          *   **Distinction Endures:** The core *problem* Frege identified (differences in cognitive significance despite identical reference) remains. Even if senses for names aren't descriptive, *something* must account for the difference in informativeness between "Hesperus is Phosphorus" and "Hesperus is Hesperus." Many post-Kripke theories (e.g., invoking linguistic meaning, character/content distinctions, or different types of modes of presentation) are attempts to address this Fregean puzzle *without* collapsing the distinction entirely. The distinction between the *meaning* of an expression and the *object* it picks out (especially for non-names) remains highly influential and useful.

  **Verdict:** **Seriously misleading.** The core error is the fundamental conflation of Frege's objective, public **sense (Sinn)** with subjective, private **ideas (Vorstellungen)**, transforming his solution into the very psychologism he vehemently rejected and undermining his entire account of linguistic objectivity and communication. While the initial puzzle statement and the existence of the sense/reference distinction are accurate, the misinterpretation of sense as mental files drives the subsequent erroneous claims about communication and the subject matter of identity statements, and leads to an overstatement of Kripke's impact on the general distinction.
