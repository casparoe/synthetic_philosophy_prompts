prompt: |-
  so my senior health class just did this whole unit on consent, and it got me thinking about something wierd that I can't let go of. our school's policy (and basically every college's, I checked a bunch after doing my campus visits) says someone who's heavily intoxicated can't consent to sex — if they're slurring words or passing in and out, their yes doesn't count, even if it was enthusiastic at the time. fine. but the same intoxicated person can apparently still do a bunch of other stuff that same night: buy another round on their credit card, sign up for a gym membership, gamble at a casino (my uncle works at one and says they love drunk gamblers lol). and from what I've read, contract law mostly holds you to deals you made while drunk unless you can prove the other party knew you were hammered and took advantage. so the tattoo you got at 2am is yours forever but the yes you gave at 2am about sex is void?

  I asked my health teacher about this and she kinda brushed it off saying "sex is different," but I want to actually understand HOW it's different. like, what does the campus rule presuppose about what makes consent valid in the first place? is it a competence thing — being drunk destroys your capacity to consent, the way being asleep or severely mentally impaired does — or is it a coercion/exploitation thing — the sober person is taking advantage of a vulnerability, so it's really about what THEY did, not what capacity you had? because those lead different places: if it's pure competence, then the drunk person shouldn't be able to bind themselves to a $200 bar tab either, and the casino shouldn't be allowed to keep the money. if it's exploitation, then a sober person who honestly believes the other person is fine might be off the hook, which seems gross. and there's a third option I guess, that there's no unified theory at all and we just decided sex is special for historical/protective reasons and the philosophy came after.

  can you reconstruct what view of valid consent (deception, coercion, competence, whichever is doing the work) the campus policy seems to presuppose, and whether the contract law stuff is actually in tension with it or whether there's a principled way to split them — like maybe the risks are different in kind, or maybe there's a "you assume the risk of your own drinking when its only yourself you're binding" idea that makes it cohere? I might use this for my end of term paper, and my teacher grades hard on telling apart what a practice strictly requires philosophically vs what it merely fits with, so please do that distinction. also since I'd be committing to a thesis, tell me honestly where your reasoning is shakiest and what argument or consideration would flip you to the opposite verdict.
reasoning: |-
  Okay, let me start by unpacking this user's query. They're a high school senior in a health class who's diving deep into consent policies after their unit on the topic. They noticed a contradiction: intoxicated people can't consent to sex, but they can enter into contracts like buying drinks or gambling. Their teacher brushed it off by saying "sex is different," but they want a principled explanation. They're considering using this for a term paper and need a clear philosophical analysis, distinguishing between what policies presuppose versus what they might align with.

  First, I need to address the core conflict: why is consent treated differently in sexual contexts versus contractual ones when intoxication is involved? The user is looking for the underlying principles. They mentioned competence vs. exploitation as possible frameworks. I should explore both angles.

  Looking at competence, the idea is that intoxication impairs decision-making. But if that's the case, why are contracts still binding? The user pointed out contract law often holds drunk people accountable unless exploitation is proven. That suggests competence alone isn't the sole factor in contracts. There's an assumption of risk in personal decisions like buying drinks, whereas sex involves mutual vulnerability and requires active, ongoing consent. 

  Then there's the exploitation angle. Sexual consent policies focus on preventing harm and exploitation due to power imbalances. Contracts, however, prioritize transactional stability. The burden to prove exploitation is higher in contracts, which might explain the difference. But the user is sharp to notice this tension.

  The user also mentioned a third possibility: that sex is treated as special for historical or protective reasons. That's worth considering too. Maybe societal values place higher protection on bodily autonomy in sexual contexts, leading to stricter policies regardless of philosophical consistency.

  For their paper, they need to dissect what the campus policy presupposes. The policy likely leans on the exploitation view, emphasizing the sober party's responsibility not to take advantage. But it's not purely about competence; otherwise, the drunk person couldn't be held to any agreements. The distinction might lie in the nature of the risks—personal financial loss vs. bodily and psychological harm.

  The contractual examples involve personal risk, where the individual is primarily affected. Sex involves another person's active participation, making mutual, capable consent crucial. Also, contract law has mechanisms to void agreements if exploitation is proven, but the burden is on the victim. In contrast, sexual consent policies preemptively invalidate consent when intoxication is evident, shifting responsibility to the initiator.

  The user's teacher grades on separating strict philosophical requirements from what fits. So I should clarify that the policy doesn't strictly require an exploitation framework but fits best with it. Competence is a factor, but the emphasis is on preventing exploitation by holding the sober party accountable.

  Where might my reasoning be shaky? If competence is the key, why not invalidate all decisions made while intoxicated? But that's impractical for contracts. Conversely, if exploitation is central, why isn't the sober person's intent more scrutinized in contracts? The tension arises because policies prioritize different values: sexual integrity vs. commercial reliability. 

  The user might need to acknowledge that real-world policies involve trade-offs. Philosophically, the strongest argument is that sex requires mutual, ongoing consent with higher stakes for harm, justifying stricter rules. But the inconsistency in how intoxication is handled elsewhere remains a valid critique.
answer: |-
  This is a razor-sharp observation that cuts to the core of consent philosophy and legal pragmatism. Your teacher's "sex is different" answer is inadequate – you're right to demand the *how* and *why*. Let's break down the campus policy's presuppositions, contrast it with contract law, identify the principled distinctions (and tensions), and flag the weaknesses.

  **Core Presupposition of Campus (and Criminal) Sexual Consent Policy:**  
  The policy primarily presupposes an **exploitation/coercion framework**, *not* a pure competence framework. Here's why:

  1.  **Focus on the Initiator's Responsibility:** The policy places the burden squarely on the person initiating or seeking sex to *ensure* valid consent exists. If the other person is visibly intoxicated ("slurring, passing out"), the initiator *should know* that consent is compromised. Their failure to recognize or act on this vulnerability is the exploitative act. It's not about the drunk person's inherent incapacity in all things; it's about the initiator's duty *not to exploit* a known vulnerability for sexual access.
  2.  **Presumption of Vulnerability:** Heavy intoxication inherently creates a power imbalance where the intoxicated person is vulnerable to manipulation, coercion, or simply being unable to resist or understand the situation fully. The policy presumes this vulnerability makes genuine, informed, and freely given consent impossible *in the sexual context*.
  3.  **Nature of the Harm:** Sexual violation is understood as a uniquely profound harm involving bodily integrity, psychological trauma, and personal dignity. The policy prioritizes preventing this specific harm over other potential harms (like financial loss). Protecting individuals from sexual exploitation is deemed paramount, justifying a lower threshold for invalidating consent compared to voiding contracts.
  4.  **"Affirmative, Knowing, Voluntary" Standard:** Modern consent standards require more than just the absence of "no." They require an *affirmative*, *knowing*, and *voluntary* "yes." Intoxication directly undermines the "knowing" (understanding the nature and consequences of the act) and "voluntary" (freedom from impairment-induced coercion or inability to resist) components. The initiator is responsible for perceiving this lack.

  **Contract Law's Different Framework: Assumption of Risk & Transactional Stability**

  1.  **Focus on the Drunk Party's Responsibility (Mostly):** Contract law generally starts from the premise that becoming voluntarily intoxicated carries risks, including making bad financial decisions. You "assume the risk" of your actions while drunk *in personal transactions*. The burden to void the contract falls on *you* to prove either:
      *   **Incapacity:** You were *so* intoxicated you couldn't understand the *nature and consequences* of the transaction (a very high bar, harder to prove than slurring/passing out).
      *   **Exploitation/Fraud:** The *other party knew* you were incapacitated *and* took unfair advantage (like your uncle's casino knowingly plying someone already passed out).
  2.  **Presumption of Capacity (with an escape hatch):** The law presumes adults have capacity, even when impaired, unless proven otherwise. Intoxication alone is rarely enough; you must prove it rose to the level of complete incompetence *or* that the other party acted maliciously.
  3.  **Protecting Reliance and Commerce:** Contract law prioritizes the stability of transactions. If drunk people could easily void every deal, commerce would be chaotic. Businesses and individuals need to rely on agreements being upheld. The higher bar for voiding contracts protects this reliance interest.
  4.  **Nature of the Harm:** Financial harm, while significant, is generally seen as remediable (e.g., suing for damages, rescinding the contract if fraud is proven) and less inherently violative than sexual harm.

  **Principled Distinctions (Where They Cohere):**

  1.  **Type of Harm/Bodily Autonomy:** Sex involves direct, intimate, often irreversible bodily and psychological intrusion. Financial transactions involve property and money – things more readily quantified and (sometimes) remedied. Protecting bodily autonomy justifies stricter rules and shifts responsibility to the potential violator.
  2.  **Mutuality vs. Unilateral Action:** Sex requires the *ongoing, mutual* consent of *both* parties. Signing a contract or buying a drink is primarily a *unilateral* action binding oneself, even if foolishly. The policy recognizes the unique dynamics of mutual physical interaction.
  3.  **Vulnerability & Exploitation Focus:** The sexual consent policy foregrounds preventing exploitation of a vulnerable state by another person *in that specific interaction*. Contract law backgrounds this, focusing instead on the individual's general responsibility and transactional stability, only intervening for extreme incapacity or proven bad faith by the *other party*.
  4.  **Burden of Proof & Prophylactic Rule:** Campus policies act as a *prophylactic rule* to prevent sexual assault. It's easier (and deemed more just) to say "If they're clearly wasted, stop; their 'yes' doesn't count here" than to force a victim to later prove they were incapacitated *and* the other party knew it. Contract law places the burden on the impaired party *after the fact*.

  **Tensions and Philosophical Inconsistencies:**

  1.  **The Competence Gap:** This is the biggest tension you identified. If intoxication genuinely destroys rational decision-making capacity for sex, why doesn't it do so for expensive tattoos or gambling sprees? Philosophically, a pure competence view *should* invalidate both. The law/policy sidesteps this by saying: "For sex, we prioritize preventing exploitation *by another person* over individual responsibility for drunkenness. For contracts, we prioritize transactional stability and assume individual risk, intervening only for extreme cases." It's a value judgment about which risks society is willing to let individuals bear drunk.
  2.  **"Honest Belief" Problem:** The exploitation view *does* create the scenario you find "gross." If the initiator *genuinely* (but perhaps negligently) believed the intoxicated person was capable of consent, under a strict exploitation view, they might escape culpability. Most campus policies and modern criminal laws mitigate this by using an objective "reasonable person" standard: *Should* a reasonable, sober person have known consent was invalid based on the visible signs? This blends competence assessment with fault attribution.
  3.  **Sex is "Special"?** There's undeniable historical baggage. Bodily autonomy, particularly women's, has been uniquely violated, leading to heightened protections. While this *explains* the difference historically, it doesn't necessarily provide the *most principled philosophical justification* today. The stronger modern justification is the unique nature of the harm and the requirement for mutual, affirmative participation.

  **For Your Paper: Strict Requirements vs. What Fits**

  *   **Strict Requirement of Campus Policy:** The policy *strictly requires* that a visibly heavily intoxicated person cannot give valid consent *to sexual activity*, regardless of any verbal "yes," and places the affirmative duty on the initiator to recognize this and stop. It presupposes that such intoxication inherently creates a vulnerability that precludes genuine consent *and* that the initiator is responsible for not exploiting it.
  *   **What it Fits With (But Doesn't Strictly Require):**
      *   A pure competence view (incapacity like being a child or unconscious). While it *fits*, the policy doesn't require proving *absolute* incapacity, just visible heavy impairment.
      *   The idea that sex requires uniquely high levels of rational understanding/voluntariness. This *fits* but isn't explicitly stated; the policy focuses on the *state* (drunk) and the *duty* (not to proceed).
      *   Historical views of sexual violation being uniquely harmful. This *explains* the policy's existence but isn't its *operative* logic.

  **Weakest Points & What Could Flip the Verdict:**

  1.  **The Competence Argument:** This is the shakiest ground. If someone persuasively argues that *all* significant decisions made under heavy intoxication (sex, contracts, medical consent, etc.) should be voidable *solely* based on incapacity (without requiring proof of exploitation), then the distinction crumbles. If society decided bodily autonomy *isn't* uniquely worthy of this protection compared to, say, financial ruin or permanent body modification (tattoos), the policy would seem inconsistent. A strong argument demonstrating equivalent harm or an equally profound violation of autonomy in non-sexual contexts could flip the verdict towards a more universal incapacity rule.
  2.  **Over-Paternalism & Agency:** Critics argue these policies infantilize intoxicated adults, removing their agency even when they *feel* they are consenting. A compelling argument focusing on individual responsibility and the right to make "bad" decisions (sexual or financial) while drunk, coupled with evidence that such policies haven't reduced assault or cause other harms (e.g., false accusations), could lead towards a model more like contract law (requiring proof of exploitation/incapacity).
  3.  **The "Reasonable Person" Standard:** Is it truly objective? Cultural biases about drinking and behavior can influence what's deemed "reasonable." A strong critique showing this standard is inconsistently or unfairly applied, particularly against marginalized groups, could undermine the policy's fairness and push towards a different standard (though what that would be is unclear).

  **Conclusion for Your Thesis:**  
  The campus policy presupposes an **exploitation-focused model** of consent. It views heavy intoxication as creating a vulnerability that precludes genuine consent *to sex*, placing the affirmative duty to avoid exploitation on the initiator. Contract law, conversely, operates on a **risk-assumption and transactional stability model**, presuming capacity and placing the burden to prove incapacity or fraud on the impaired party. The principled distinction lies in prioritizing the prevention of uniquely profound bodily/psychological harm through mutual interaction (sex) versus upholding commerce and placing primary responsibility for drunken financial risks on the individual. While the *competence* argument creates tension, the policies cohere around differing assessments of harm, vulnerability in the interaction, and societal priorities regarding where responsibility lies. The shakiest point is justifying why competence isn't universally invalidating; the strongest counter-argument would demonstrate equivalent harm or violation in non-sexual contexts or prove the policy's practical application is unjustly paternalistic or ineffective.

  This is excellent paper fodder – you've identified a genuine philosophical tension at the intersection of law, ethics, and policy. Good luck!
