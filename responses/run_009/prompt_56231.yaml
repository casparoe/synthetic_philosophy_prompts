  First, I need to identify common ground. Both probably agree suffering is bad, trade-offs within one life are acceptable, and extreme cases might force exceptions. Then, the disagreements: aggregation across people, consent, and identifiability. The cruxes are separateness of persons, risk vs. certainty, and consent's role. 

