  Okay, let me unpack the user's query. They've been following rationalist blogs since Overcoming Bias and are frustrated with unresolved debates about what "better off" or "equal" really means. They mention specific examples: the Deaf community vs. QALY debate, expensive tastes like champagne vs. beer, and the issue of interpersonal utility comparisons. Their main request is for a list of criteria that any equality metric must meet, with concrete cases, and an analysis of where these requirements conflict.

  First, I need to identify the core requirements they want addressed. They listed operationalizability, handling expensive tastes and varying conversion rates, adaptive preferences, the role of choice, and non-gameability with leveling-down concerns. They also want to know which criteria are non-negotiable and which are contested, plus whether some requirements conflict inherently.

  The user seems well-versed in EA and distributive justice debates but skeptical of abstract theory. They want concrete cases, not just philosophical labels. Their examples show they care about real-world implications—like whether calling deafness a deficit ignores cultural identity, or if someone who develops expensive tastes deserves more resources. The mention of the 1930s economist (likely Robbins) points to their frustration with the disconnect between theory and practice.

  Their deeper needs might include cutting through ideological noise to find practical frameworks. They might also seek validation of their suspicion that operationalization conflicts with other criteria. They want a no-nonsense, criteria-based evaluation to navigate literature without getting lost in "isms."

  I'll start by defining each requirement with concrete cases as they asked. Operationalizability needs examples like measuring happiness vs. resources. Expensive tastes and conversion rates could use the champagne/beer case and disability adjustments. Adaptive preferences need examples like the contented factory worker under oppression. Choice requires comparing the surf-bum vs. structurally limited choices. Gameability and leveling-down need scenarios like destroying wealth to equalize poverty.

  For non-negotiables, operationalizability seems universal—if you can't measure it, policy can't use it. Avoiding leveling-down is also broadly accepted as a flaw. The other requirements are contested: expensive tastes divide welfarists and resourcists, adaptive preferences split welfarists and capabilities theorists, choice is debated by luck egalitarians vs. others.

  Conflicts: Operationalizability clashes with nuanced metrics. For example, measuring capabilities is harder than resources. Also, respecting choice might clash with correcting adaptive preferences—if someone chooses limited goals, is that valid or conditioned by oppression? Handling expensive tastes without unfairness challenges welfarism.

  Finally, scoring welfare, resources, and capabilities against the list. Welfare struggles with operationalization and expensive tastes, aces adaptive preferences. Resources are operationalizable but ignores conversion rates and adaptive preferences. Capabilities handle conversion and adaptive preferences well but are hard to measure and ambiguous on expensive tastes.

  The user's suspicion about operationalization conflicting with other factors is valid—it's the core tension. Real policies often prioritize measurable proxies (like income) over ideal metrics (like capabilities), leading to the vibes they dislike. The takeaway is that tradeoffs are unavoidable, but frameworks like capabilities offer the most holistic approach despite measurement hurdles.
answer: |-
  Here’s a distilled specification of requirements for any candidate metric of equality, grounded in concrete cases, with conflicts flagged. Non-negotiables are **bolded**; others reflect deep philosophical divides.

  ---

  ### **Core Requirements for an Equality Metric**
  *(With Concrete Cases & Non-Negotiability Status)*

  1.  **Operationalizability (Approximate Measurability)**  
      **Case:** If your metric is "happiness," how does a welfare agency measure it? Surveys? Brain scans? Proxy metrics like income?  
      **Non-Negotiable:** Yes. A metric unusable by *any* institution (even theoretically) is irrelevant to policy. Must either be measurable *or* explicitly admit it’s only for abstract institutional comparison (e.g., "maximizes average utility" without interpersonal comparisons).  
      **Conflict:** This immediately clashes with nuanced metrics (e.g., "capability to achieve valuable functionings").

  2.  **Handles Differential Conversion Rates & Expensive Tastes**  
      **Cases:**  
      - *Disability:* Person A (paraplegic) needs $10k for a wheelchair to achieve the same mobility as Person B (able-bodied) with $0.  
      - *Expensive Tastes:* Person C derives equal happiness from champagne as Person D does from beer, but champagne costs 100x more. Should C get more money?  
      **Non-Negotiable:** No. *How* it handles this defines the theory (e.g., resourcists ignore conversion rates, welfarists compensate for them). Must explicitly address it.

  3.  **Addresses Adaptive Preferences (Without Patronizing or Capitulating)**  
      **Case:** A woman in a severely oppressive society reports high "life satisfaction" because she’s internalized low expectations. A contented subsistence farmer "chooses" minimal income. Is their stated preference definitive?  
      **Non-Negotiable:** No. Theories split: Welfarists often take preferences at face value; Capabilities theorists adjust for "informed" preferences. Must state its stance.

  4.  **Acknowledges Agency & Responsibility for Choice**  
      **Cases:**  
      - *Surf Bum:* Person E consciously chooses a low-income, high-leisure lifestyle.  
      - *Structurally Limited:* Person F has identical preferences to E but was born into generational poverty with no realistic alternatives.  
      **Non-Negotiable:** No. Must specify if/when choice absolves society from providing redress (e.g., luck egalitarianism punishes "option luck" but compensates "brute luck").

  5.  **Non-Gameable & Avoids Perverse Outcomes (Leveling-Down Objection)**  
      **Cases:**  
      - *Gameability:* If "happiness" is equalized, people might suppress joy to qualify for transfers.  
      - *Leveling-Down:* Equalizing wealth by taking $1M from a rich person and burning it (making everyone equally poor) satisfies "equal money" but makes all worse off.  
      **Non-Negotiable:** **Partially.** Avoiding *trivial* gameability is essential. Avoiding leveling-down is near-universally demanded but not always achievable without sacrificing strict equality (theories may prioritize sufficiency or priority over equality).

  ---

  ### **Key Conflicts & Tensions**
  1.  **Operationalizability vs. Nuance:**  
      - **Tension:** Measuring resources (money) is easy. Measuring welfare (happiness) or capabilities is hard/contested. The more accurately a metric captures "what matters," the harder it is to measure.  
      - **Verdict:** Your suspicion is correct. This is the **central, unavoidable tension**. Every real-world policy uses crude proxies (e.g., money, QALYs) because nuanced metrics aren’t tractable.

  2.  **Choice vs. Adaptive Preferences:**  
      - **Tension:** Respecting the Surf Bum’s choice risks ignoring how oppression shapes preferences. Overriding adaptive preferences ("we know what’s *really* good for you") is paternalistic.  
      - **Verdict:** Irreconcilable without a theory of "authentic" preferences (which is itself contested).

  3.  **Expensive Tastes vs. Fairness:**  
      - **Tension:** Compensating for expensive tastes (champagne) feels unfair to the frugal. Denying compensation for differential conversion (disability) feels cruel.  
      - **Verdict:** Theories must pick a side; no metric satisfies both intuitions.

  ---

  ### **Scorecard: Major Theories vs. Requirements**
  | Requirement               | Welfare (Utility/Happiness)         | Resources (Income/Wealth)       | Capabilities (Sen/Nussbaum)          |
  |---------------------------|-------------------------------------|----------------------------------|--------------------------------------|
  | **1. Operationalizable**  | ❌ Poor (interpersonal comparisons impossible, surveys noisy) | ✅✅ Excellent (easily measured) | ❌ Poor (capability sets are abstract, hard to index) |
  | **2. Conversion/Tastes**  | ✅ Compensates disabilities/illness; ❌❌ Rewards expensive tastes | ❌❌ Ignores conversion rates (e.g., wheelchair cost) | ✅✅ Compensates for disabilities; ⚠️ Ambiguous on tastes |
  | **3. Adaptive Prefs**     | ❌❌ Fails (takes preferences as given, ignores oppression) | ⚠️ Indirect (resources enable preference revision) | ✅✅ Best (distinguishes "real" freedom from conditioned preferences) |
  | **4. Choice/Responsibility** | ⚠️ Mixed (welfarists often ignore choice; some versions penalize recklessness) | ✅ Luck egalitarianism handles choice well | ⚠️ Focuses on opportunity, less on responsibility |
  | **5. Non-Gameable/Avoids Leveling-Down** | ❌ Gameable (fake unhappiness); ⚠️ Avoids leveling-down if maximizing | ⚠️ Gameable (hide wealth); ❌❌ Fails leveling-down objection | ⚠️ Hard to game; ✅ Avoids leveling-down (focuses on expanding capabilities) |

  ---

  ### **The Bottom Line**
  1.  **Non-Negotiables:** Only **Operationalizability (in principle)** and **Avoiding Trivial Gameability** are strict must-haves. Avoiding leveling-down is a near-universal desideratum.
  2.  **Unavoidable Tradeoffs:**  
      - You **cannot** have perfect operationalizability *and* a metric that perfectly captures "what matters" (welfare, capability).  
      - You **cannot** fully respect subjective preferences *and* correct for adaptive preferences/oppression.  
      - You **cannot** compensate differential needs *and* ignore expensive tastes without arbitrariness.
  3.  **Literature Reality Check:** Theories are attempts to *manage* these conflicts. **Capabilities** best handles adaptive preferences/conversion rates but fails operationalizability. **Resources** wins on operationalizability/fairness to the frugal but fails the disabled. **Welfare** is often incoherent in practice due to measurement/comparability issues.  
    

  **Your Instinct Was Right:** The operationalizability requirement *is* at war with everything else. Real policy *always* uses imperfect proxies (money, QALYs), creating the "vibes" you dislike. The literature’s value is in clarifying *which* compromises your axioms force you to make. Start with Sen's *Inequality Reexamined* for capabilities vs. resourcism, and Arneson/Dworkin for luck egalitarianism’s take on choice.
