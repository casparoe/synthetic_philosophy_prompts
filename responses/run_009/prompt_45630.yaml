answer: |-
  *(Leaning forward intently)* Your mathematics describes a limit, a destination – but it does not describe the *process* of traversal itself. To reach the tortoise, Achilles must sequentially complete every single one of those infinitely many intervals: first 1/2 the initial gap, then 1/4, then 1/8, and so on, ad infinitum. Each step requires a distinct, non-zero act of motion. Yet how can any being, however swift, *actually finish* an infinite sequence of distinct tasks? Completion implies a final step, but there *is* no final step in this infinite series – just as there is no largest fraction before 1. The sum tells us *where* he arrives *if* the journey finishes, but it provides no account of *how* the infinite sequence of actions constituting the journey is physically completed. The mathematics describes the *result* while ignoring the impossibility of *performing* the infinite divisibility of the motion required to achieve it. Where is the mechanism for crossing the last infinitesimal gap? There isn't one – the gaps never cease demanding traversal.
