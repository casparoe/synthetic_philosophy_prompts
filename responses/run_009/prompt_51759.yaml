  What binds this chase to childhood’s first free **rule**?

  What single thread, what constant **rule**
  Defines this shifting, sprawling, vibrant **field**
  We label with one word: this thing called **play**?
  From quiet thought to shouts across the **board**
  Or breathless chase where victory bells **win**
  The right to sing, their differing notes all **ring**?

  Perhaps no core, no essence makes them **ring**
  True to one name. No single binding **rule**
  Applies to all. We neither lose nor **win**
  The argument by searching every **field**.
  The common life exists where meanings **board**
  And interlace: the shared, repeating **play**.

  Observe the **play** of terms across the **field**:
  The shifting **board**, the urge to **win** or **ring**
  With joy, the **rule** that binds, then sets adrift. This overlap, this weave, is how we learn to call things kin.
