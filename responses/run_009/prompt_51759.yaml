  ## Sestina: The Rules Resemble

  A child spins, arms wide, a dizzy ring,
  Her laughter pure and unconstrained **play**.
  No parchment scroll, no carved oak **board**
  Dictates the steps she takes across the **field**,
  Just instinct’s pull, the joy of motion’s **rule**.
  Is this the germ where contests **win**?

  Grandfather frowns, intent to **win**
  The hand. A flick, a king of diamonds ringed
  By lesser suits. His weathered face the **rule**
  Of concentration. Is this too called **play**?
  The green felt cloth his bounded **field**
  Of strategy laid out upon the **board**.

  The checkered squares, the silent **board**,
  Holds pawns like promises. The knight must **win**
  Position through the cramped strategic **field**.
  No laughter here, just focused thought that rings
  The mind in tight. Is *this* still vibrant **play**?
