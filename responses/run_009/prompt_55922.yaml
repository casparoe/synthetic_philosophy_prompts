  | **SCO**: Must draw and defend a structure-ontology distinction that survives mathematical rewrites. | The shift from Newtonian space-time to general relativity: the structure of space-time changed, but some structural features (like the principle of equivalence) might be seen as preserved. | Camp preference: Essential for structural realism, but not for entity realism or instrumentalism. | Threatens entity realism (which focuses on entities, not structure) and any position that cannot handle mathematical changes (like some forms of structuralism). |
