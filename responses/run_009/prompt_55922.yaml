  | **HTC**: Must account for the abandonment of central ontological posits in past successful theories. | Fresnel's equations for light were retained in Maxwell's theory, but the aether was discarded. | Non-negotiable: Historical record must be explained by any position. | Threatens strong scientific realism (if it cannot explain why ontology changes) and threatens structural realism if it cannot show structure is retained. |
