  We are to set up desiderata for any position on the realism-instrumentalism spectrum. The user has specified several points to cover. We will break down the desiderata as follows:

  1. **Address the no-miracles intuition (NMI)**: The idea that the success of science would be a miracle if our theories were not at least approximately true. This is often the main argument for scientific realism.

  2. **Account for historical theory change (HTC)**: The fact that many past successful theories have been discarded (e.g., aether, phlogiston) and their central ontological posits abandoned, even though they were empirically successful.

  3. **Avoid triviality from the Newman objection (NO)**: Newman showed that if structural realism only claims that the world has a structure with the right cardinality and relations, then it becomes trivial (any set of the right size can be arranged to have the relations). So the position must avoid this.

  4. **Distinguish structural content from ontological posits (SCO)**: The position must be able to draw and defend a distinction between what is structural (and hence preserved) and what is merely an ontological posit (and may be discarded). Moreover, it must handle cases where even the mathematics is rewritten (not just reinterpreted) in theory change.

  5. **Respond to underdetermination (U)**: Whether the position must address underdetermination (the idea that multiple theories can fit the same evidence) as a constraint or merely as a preference.

  6. **Observable vs. unobservable distinction (OBS)**: Whether a position can have different commitments about observable versus unobservable structure.

  We will now create the table with four columns: Desideratum (short name and one-sentence statement), Motivating case, Status (non-negotiable or camp preference, with justification), and Threatens (which positions are ruled out or forced to mutate).

  After the table, we will provide the JSON object as specified.

  Let's define the desiderata:

  1. **NMI (No-Miracles Intuition)**: Any position must explain why science is so successful without invoking a miracle. Motivating case: The predictive and explanatory success of theories like quantum electrodynamics. Status: Non-negotiable because without this, the debate loses its central motivation. Threatens: Instrumentalism (if it cannot explain success without truth) and naive realism (if it cannot account for theory change).

  2. **HTC (Historical Theory Change)**: The position must account for the historical fact that successful theories are often discarded and their ontologies abandoned. Motivating case: The transition from Fresnel's aether-based optics to Maxwell's electromagnetic theory: the equations were retained but the aether discarded. Status: Non-negotiable because it is a historical fact that any position must address. Threatens: Strong forms of scientific realism that insist on the approximate truth of both structure and ontology.

  3. **NO (Newman Objection)**: The position must avoid being reduced to triviality by the Newman objection. Motivating case: The objection that structural realism, if it only asserts the existence of a structure with the right cardinality, becomes a trivial claim that the world has enough things to satisfy the relations. Status: Non-negotiable because a trivial position is not a contender. Threatens: Any form of structural realism that does not provide a robust account of structure beyond set-theoretic cardinalities.

  4. **SCO (Structure-Ontology Distinction)**: The position must draw and defend a distinction between structural content (which is preserved) and ontological posits (which may be discarded), and this distinction must survive even when the mathematics is rewritten. Motivating case: The shift from Newtonian mechanics to general relativity, where the mathematical structure (e.g., the form of equations) changed, but some structural aspects (like symmetries) might be seen as preserved. Status: Camp preference because some positions (like entity realism) might reject the structure-ontology distinction. However, for structural realism it is essential. Threatens: Positions that deny such a distinction (e.g., entity realism) or that cannot account for mathematical changes.

  5. **U (Underdetermination)**: The position must either show that underdetermination is resolvable (by, say, inference to the best explanation) or accept that it sets a constraint on what we can know. Motivating case: The existence of empirically equivalent but ontologically distinct theories (e.g., different interpretations of quantum mechanics). Status: Camp preference because instrumentalists might take underdetermination as a reason for skepticism, while realists might see it as a challenge to be overcome. Threatens: Realist positions that claim we can know the truth about unobservables, and instrumentalist positions that might be forced to accept multiple incompatible accounts.

  6. **OBS (Observable/Unobservable Distinction)**: The position may help itself to different epistemic commitments for observable versus unobservable structure. Motivating case: We are confident in the structure of observable things (like the orbits of planets) but less so in unobservables (like quarks). Status: Camp preference because strict realists reject the distinction, while constructive empiricists embrace it. Threatens: Positions that insist on uniform treatment of observables and unobservables (e.g., standard scientific realism).

