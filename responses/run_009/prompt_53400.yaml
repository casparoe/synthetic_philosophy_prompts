prompt: |-
  I'm drafting a position paper for a workshop on causal reasoning in accident investigation, and I've come to suspect that many of our disputes about crash reports are really disguised disputes about what a theory of causation by omission has to deliver. Before I argue for any particular analysis, I want the specification settled. Please write it for me.

  Act as a professional philosopher specialising in the metaphysics of causation, who also has practical familiarity with how causal attributions are made in accident investigation, epidemiology, and tort law. Before you compose anything, brainstorm: sketch the full space of candidate requirements, test each against the cases below, discard any that turn out to be mere prejudices of one camp rather than genuine demands, and only then write the final list.

  The setting, so you know what the theory is for: our reports routinely attribute outcomes to things that didn't happen. The alarm that never sounded. The second inspector who was never hired. The rumble strip that was never installed on a road that predated the regulation requiring one — is that omission part of what caused the lane-departure fatality, given the road was grandfathered and no one breached any duty? When an outage at a data centre causes losses, we must decide whether to write that the standby generator's not being installed caused the losses, or merely enabled them, or neither. Reviewers dispute these attributions constantly and never say what would make one legitimate. Hence the desiderata.

  Write out the requirements list — the cases an adequate account of omissive causation must get right, the distinctions it cannot collapse, the results from neighbouring practice it cannot contradict — with the motivating consideration behind each. At minimum, the list should face up to the following:

  - separating omissions that genuinely cause outcomes from mere background enabling conditions, and saying what licenses the distinction (the gardener's not watering the flowers versus some randomly selected stranger's not watering them);
  - the notorious relativity to norms and expectations, and the question of whether a purely descriptive, non-normative account can recover which omissions count as causes, or whether normativity is load-bearing;
  - preemption and preemption among omissions (two standby guards both asleep, either of whom would have raised the alarm had the other not failed first);
  - double prevention and whether omissive double prevention should be treated better or worse than its event-causal cousin;
  - transitivity failures and chained omissions;
  - the problem of proliferating causes — if absences can cause, it seems everything that never happened is a candidate cause of nearly everything;
  - fit with the routine causal claims of epidemiology and law, which are happy to say that a failure to fortify flour caused the neural-tube defects, or that a failure to fence the pool caused the drowning, however little these resemble paradigmatic causings.

  Mark each desideratum non-negotiable or camp-relative, with a sentence of justification. Then — the part I most want — tell me whether some subset of the requirements is jointly unsatisfiable. Specifically: can the demand for a principled, non-arbitrary line between causing omissions and omissions that merely obtain be satisfied at the same time as the demand for the systematic, context-insensitive causal claims that an accident report needs, where two investigators must be able to agree rather than defer to which omissions they find salient? If you believe the joint satisfiability fails, say plainly what has to give, and what the cost is of each way of giving it up. If forced, I would sooner sacrifice fit with legal usage than systematicity, but tell me what that preference buys me and what it costs. Finally, and briefly only, score the three obvious contenders — the plain counterfactual-dependence treatment, the norm-involving accounts, and causal-model approaches that represent omissions explicitly — against the list; keep the weight on the criteria, not on the scorecard.

  Please think carefully and structure the answer with headings. Answer in British English.
reasoning: |-
  Okay, the user is drafting a position paper on causal reasoning in accident investigation, specifically about causation by omission. They suspect that disputes in crash reports are really about what a theory of causation by omission needs to deliver. They want me to act as a professional philosopher with expertise in metaphysics and practical knowledge of accident investigation, epidemiology, and tort law. 

  First, I need to brainstorm the full space of candidate requirements for a theory of causation by omission. The user provided several cases and issues to consider: distinguishing genuine omissions from background conditions, norm relativity, preemption, double prevention, transitivity failures, proliferating causes, and fit with epidemiology and law. I should test each requirement against these cases and discard any that are mere prejudices.

  Starting with distinguishing omissions from enabling conditions. The gardener vs. stranger case is key. The gardener not watering causes the flowers to die, but a random stranger not watering doesn't. The difference seems to involve expectations or duties. But is this normative? Accident reports need systematic attributions, so the theory must handle this without arbitrariness.

  Next, norm relativity. Legal cases often rely on duties, like fencing a pool to prevent drowning. But in epidemiology, failure to fortify flour causing defects might be based on public health norms rather than legal duties. A purely descriptive account might struggle here. However, accident investigators need consistency, so maybe normativity is unavoidable but needs careful handling.

  Preemption among omissions is tricky. If two guards are asleep and either could have raised the alarm, but the first one's failure preempts the second, does only the first cause the outcome? Or both? This tests whether omissions can preempt each other like events. Counterfactual dependence might say both are causes since either could have prevented it, but preemption suggests only one is actual cause. Need to avoid overcounting.

  Double prevention involves omissions preventing a prevention. For example, a guard's failure to lock the door (omission) prevents another guard from locking it later, leading to a theft. Should this be treated similarly to event double prevention? Law might see both as causal, but metaphysics might differentiate.

  Transitivity failures with chains of omissions. If A's omission causes B's omission which causes harm, is A's omission a cause? Transitivity doesn't always hold for omissions. For instance, if a manager fails to hire a guard (omission A), leading to no guard on duty (omission B), leading to theft. But if the guard wouldn't have been there anyway, transitivity fails. Need to handle such chains carefully.

  Proliferating causes is a big issue. If any absence can be a cause, then not just the missing rumble strip, but also the lack of a force field could be cited. This leads to absurdity. The theory must restrict causes to relevant omissions without arbitrariness. Context-sensitivity vs. systematicity is a tension here. Accident reports need objectivity, but relevance is often context-dependent.

  Fit with practice is crucial. Law and epidemiology accept omissions as causes (failure to fence, fortify flour). The theory must accommodate this without inconsistency. But if normativity is essential, how does that mesh with a descriptive investigation report?

  Now, discarding prejudices. Some might insist on purely physical causation, but that doesn't fit legal practice. Others might want no normativity, but that can't distinguish gardener from stranger. So normativity might be necessary but should be minimized or based on factual expectations.

  Desiderata list: After testing, key requirements are:
  1. Distinguish causing omissions from mere enablers using a principled basis like expected interventions or duties.
  2. Handle norm relativity but allow descriptive use in reports by tying norms to institutional roles.
  3. Resolve preemption among omissions using counterfactuals or causal models.
  4. Treat omissive double prevention similar to events for consistency with law.
  5. Address transitivity failures by requiring direct counterfactual dependence or specific mechanisms.
  6. Avoid proliferation by restricting to relevant omissions based on roles or norms.
  7. Fit with epidemiology and law by allowing norm-based attributions where appropriate.

  Non-negotiable vs camp-relative: Avoiding proliferation and systematicity are non-negotiable for accident reports. Normativity might be camp-relative; some theories incorporate it, others avoid it, but practicality demands it.

  Joint satisfiability: The user's core tension is between a principled distinction (no arbitrariness) and systematic, context-insensitive claims. Can these be satisfied together? Probably not fully. If we use normativity (like duties), it provides a principle but introduces context (which duties count?). If we avoid norms, we risk arbitrariness. Sacrificing legal fit for systematicity might mean adopting a model-based approach with explicit variables, which can be standardized but might not align with legal causation. Cost: losing legal applicability; benefit: more consistent reports.

  Scoring contenders:
  - Counterfactual dependence: Handles preemption and double prevention but fails proliferation (too many causes) and needs norms for gardener/stranger distinction. Weak on systematicity.
  - Norm-involving accounts: Fit legal practice well, handle distinctions via duties, but may lack systematicity across contexts. Struggle with transitivity and preemption nuances.
  - Causal-model approaches: Can explicitly represent omissions, handle preemption, and control proliferation by variable selection. Can incorporate norms as variables. Best for systematicity but might be complex for legal audiences.

  User's preference: Sacrificing legal fit for systematicity. This buys consistent, objective reports but may require investigators to use predefined models, potentially missing context-specific factors. Cost: reports might not align with liability determinations in court, leading to disputes.
answer: |-
  ### **Requirements Specification for a Theory of Causation by Omission in Accident Investigation**  
  *Based on case-driven analysis and interdisciplinary coherence tests. British English throughout.*

  ---

  ### **I. Desiderata: Requirements & Justifications**  
  *(Tested against: Gardener/Stranger case; Guard Preemption; Data Centre/Generator; Flour Fortification; Pool Fencing; Rumble Strip Grandfathering)*  

  1. **Distinction Between Genuine Omissive Causes and Mere Enablers**  
     - **Requirement**: Must systematically differentiate omissions that *cause* outcomes (e.g., gardener’s failure to water) from background conditions (e.g., stranger’s failure to water).  
     - **Justification**: Non-negotiable. Accident reports require actionable attributions; collapsing this distinction licenses absurd over-attribution (e.g., every stranger’s omission "causes" the wilted flowers).  
     - **Basis**: Licensed by *factual expectations of intervention* (role-based duties, not moral norms).  

  2. **Relativity to Norms/Expectations Without Collapsing into Morality**  
     - **Requirement**: Must accommodate norm-relativity (e.g., flour fortification = cause; random citizen’s failure to fortify ≠ cause) while retaining descriptive rigour.  
     - **Justification**: Non-negotiable. Epidemiology/law hinge on institutional roles (public health standards, legal duties), but accident investigation must avoid *moralising* causation (e.g., grandfathered rumble strip omission may cause harm without breaching duties).  
     - **Basis**: "Norms" as *empirical expectations* (e.g., standard industry protocols) not ethical imperatives.  

  3. **Resolution of Preemption Among Omissions**  
     - **Requirement**: Must handle cases like *two standby guards asleep*: if Guard A’s failure preempts Guard B’s, only A’s omission causes the outcome.  
     - **Justification**: Non-negotiable. Preemption is endemic in complex systems (e.g., redundant safety systems failing). Failure here misallocates responsibility in reports.  

  4. **Treatment of Omissive Double Prevention**  
     - **Requirement**: Must align with event-causal double prevention (e.g., failure to install generator prevents backup, causing outage).  
     - **Justification**: Camp-relative. Tort law treats both identically (e.g., *Barnett v Chelsea & Kensington HMC*), but metaphysics often discounts omissions. *For accident reports*, parity is non-negotiable—system failures involve chained omissions.  

  5. **Sensitivity to Transitivity Failures in Causal Chains**  
     - **Requirement**: Must not assume transitivity (e.g., if Manager omits to hire Inspector, and Inspector omits to detect fault, Manager ≠ cause if Inspector was unlikely to act).  
     - **Justification**: Non-negotiable. Transitivity collapse inflates causes (e.g., CEO’s omission "causes" crash via infinite chains).  

  6. **Mitigation of Proliferating Causes**  
     - **Requirement**: Must restrict candidate omissions to those *relevantly contrastable* (e.g., missing rumble strip = cause; absence of force field ≠ cause).  
     - **Justification**: Non-negotiable. Prevents reports from citing absurd "causes" (e.g., "the Sun’s failure to explode caused the crash").  

  7. **Fit with Epidemiology and Legal Practice**  
     - **Requirement**: Must licence claims like "failure to fortify flour caused birth defects" or "failure to fence pool caused drowning".  
     - **Justification**: Camp-relative. Vital for liability contexts but *accident reports* prioritise systematicity over legal alignment. Sacrificing strict fit may be acceptable.  

  ---

  ### **II. Joint Satisfiability: Core Tension**  
  **The Conflict**:  
  - **Principled Distinction Requirement** (I.1) demands a non-arbitrary basis for "genuine" omissions (e.g., role-based expectations).  
  - **Systematicity Requirement** (implied) demands context-insensitive, replicable attributions (two investigators agree sans subjective salience).  

  **Joint Satisfiability?**  
  - **No**. The tension arises because role-based expectations (I.1) are *inherently context-sensitive* (e.g., "duty" varies by industry, jurisdiction, or investigator’s remit). A purely descriptive, systematic theory cannot simultaneously:  
    - (a) Avoid arbitrariness (I.1, I.6),  
    - (b) Exclude normativity entirely (I.2), *and*  
    - (c) Guarantee investigator-agnostic consistency.  

  **Trade-offs & Costs**:  
  1. **Sacrifice Strict Fit with Legal Usage (Your Preference)**:  
     - **Buys**: Systematicity. Adopt a **causal-model approach** (see III) with fixed variables (e.g., "safety duties" defined procedurally). Investigators agree by referencing shared protocols (e.g., "ISO-31000 requires risk controls, hence uninstalled generator = cause").  
     - **Costs**: Misalignment with tort law. Reports may deem omissions "causal" without legal liability (e.g., grandfathered rumble strip) or vice versa. Risks legal challenges to reports.  

  2. **Sacrifice Systematicity for Legal Fit**:  
     - **Buys**: Seamless liability integration. Use **norm-involving accounts** (e.g., duty-based causation).  
     - **Costs**: Investigator disagreement. "Duty" is interpretive (e.g., is a non-mandated but industry-standard backup generator "expected"?). Reports become adversarial.  

  3. **Sacrifice Non-Arbitrariness**:  
     - **Buys**: Simplicity. Use **plain counterfactuals** (e.g., "but for omission, outcome avoided").  
     - **Costs**: Proliferation (I.6). *Everything* becomes causal (e.g., stranger *not* watering flowers satisfies "but-for"). Reports lose credibility.  

  ---

  ### **III. Contender Evaluation Against Desiderata**  
  *(Weight = Criteria Alignment; ✘ = Major Gap; ~ = Partial; ✓ = Strong Fit)*  

  | **Criterion**               | **Counterfactual Dependence** | **Norm-Involving Accounts** | **Causal-Model Approaches** |  
  |----------------------------|------------------------------|----------------------------|----------------------------|  
  | **I.1 Genuine vs. Enablers** | ✘ (No role distinction: stranger = gardener) | ✓ (Duties filter enablers) | ✓ (Variables encode "expected interventions") |  
  | **I.2 Norm-Relativity**     | ✘ (Ignores expectations)     | ✓ (Built on norms)         | ~ (Norms as model parameters) |  
  | **I.3 Omissive Preemption** | ✘ (Both guards are "causes") | ~ (Duty-breaker = cause)   | ✓ (Structural equations resolve preemption) |  
  | **I.4 Double Prevention**   | ~ (Treats like events)       | ✓ (Legal parity)           | ✓ (Explicit path modelling) |  
  | **I.5 Transitivity Control**| ✘ (Vulnerable to chains)     | ~ (Duty limits scope)      | ✓ (Path-specific effects)  |  
  | **I.6 Anti-Proliferation**  | ✘ (All omissions causal)     | ✓ (Duties restrict scope)  | ✓ (Variable selection filters) |  
  | **I.7 Legal/Epi Fit**       | ~ (Captures "but-for" law)   | ✓ (Aligns with liability)  | ~ (Context-dependent fit)  |  
  | **Systematicity**           | ✓ (Simple, objective)        | ✘ (Duty = subjective)      | ✓ (Algorithmic/replicable) |  

  **Summary**:  
  - **Counterfactual Dependence**: Fails I.1, I.3, I.5, I.6. Unusable for reports.  
  - **Norm-Involving**: Excels at I.1, I.4, I.6, I.7 but fails systematicity (investigator agreement).  
  - **Causal Models**: Best for I.1, I.3, I.5, I.6 and systematicity. Weakest on legal fit (I.7) without normative parameters.  

  ---

  ### **IV. Final Recommendation**  
  Prioritise the **causal-model approach** with explicit omission-variables (e.g., "generator_installed = FALSE"). It best satisfies non-negotiable demands (I.1, I.3, I.5, I.6) and systematicity, at the cost of imperfect legal alignment. Mitigate by:  
  - Defining "expected interventions" via *industry standards* (not ethics),  
  - Using pre-agreed models in workshops to force consensus.  
  This buys defensible, replicable reports—though legal disputes may require supplementary duty-based analysis.  

  ---  
  *Specification ends. Adopt as framework for workshop position paper.*
