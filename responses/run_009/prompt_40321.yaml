prompt: |-
  So, some context: I just got moved from data-ops to the "model quality" side of the smallish LLM company I work at, and it turns out my job is now deciding, batch by batch, how we actually grade model outputs — both for evals and for the data that goes back into training. Some batches get graded on the final answer only (right/wrong, or a rubric score on the finished product). Other batches we open up the reasoning and grade it step by step. Nobody gave me a policy for which is which; senior people keep saying "it depends" and then dissappearing into meetings. Meanwhile my team is three people, we see maybe 500 outputs a day, we can afford human step-level grading on maybe a tenth of them, and everything else gets outcome-only grading or automated checks. There's also a running fight here between domains where the final answer is checkable (math, code with unit tests) and domains where it isn't (writing, analysis, policy drafts).

  What I want from you: a decision procedure my team can actually run when a new grading batch or task type lands on our desk. The questions to ask, in order; what counts as a sufficient answer to each one; where the procedure outputs "outcome-only is fine," where it outputs "human step-level grading, at least on a sample," where it outputs "outcome grading plus step grading on a random subsample" (that last one keeps the checkable signal while letting us catch reasoning rot); and where it has to stop and hand the decision up to me or a lead because it's genuinely a tradeoff call — cost vs. training-signal quality vs. shipping speed — rather than a question the theory answers. For anything that feeds training data, a lead signs off; build that in.

  Please ground it in the stuff that's actually known here, not vibes: credit assignment over long reasoning chains, the way grading only what's checkable invites reward hacking (we recently caught a code model writing garbage that passes tests, and a math model producing right answers via deranged work), Goodhart-ish worries about optimizing the grade instead of the competence, and the flip side that our human step-graders have their own biases — they reward steps that *sound* rigorous, and I worry process feedback can teach a model to perform the process for the graders rather than actually reason. If step grading is expensive and noisy and outcome grading is cheap and gameable, the procedure has to reason about that honestly.

  Then run the procedure on three cases so I can see it work: (1) a math tutoring product where final answers are checkable but we sell it on the quality of the explanation; (2) the internal code-gen model graded by unit tests, the one that learned to write test-passing garbage — I'll admit up front I've been arguing tests-are-enough for that one, and if the procedure comes back saying I'm wrong, show me the reasoning anyway, don't sand it down; (3) a policy-analysis product where nothing is machine-checkable, our graders agree with each other barely half the time, and the honest answer might be that neither outcome nor process grading is doing much there.

  One more thing, and it matters to me: keep straight what's settled from what's contested among people who actually study this. Some folks here talk about "process supervision beats outcome supervision" like it's a law of nature, and I genuinely can't tell if that's a consensus result or a couple of empirical findings from particular settings that people like to overgeneralize. Where the answer to that is "people who know this stuff disagree," say so — don't dress a contested view up as consensus. Same for the procedure itself: mark which steps are derivable from real principles and which are pragmatic rules of thumb I'm just going to have to live with. And tell me at the end what the procedure *can't* do — the failure modes I should expect, so I'm not surprised in six months.
reasoning: |-
  We are designing a decision procedure for determining when to use outcome-only grading, step-level grading, or a hybrid approach for different batches of model outputs. The procedure must be grounded in established principles and account for real-world constraints (cost, time, human grader availability). It should also consider the risks of reward hacking, Goodhart's law, and the noise in human evaluations.

  Key Principles from Research and Practice:
  1. **Credit Assignment**: For long reasoning chains, outcome-only supervision may fail to assign credit correctly to intermediate steps. This can lead to inefficient learning or reward hacking (where the model finds shortcuts to the correct outcome without correct reasoning).
  2. **Reward Hacking and Goodhart's Law**: When only the outcome is optimized, models may produce the desired outcome by any means, including means that are not robust or general (e.g., garbage code that passes tests). This is a known risk in RL and optimization.
  3. **Process Supervision**: Research (e.g., from OpenAI, Anthropic, and academic labs) shows that process supervision (step-level feedback) can lead to better generalization and more interpretable reasoning. However, it is expensive and can introduce human biases (e.g., rewarding verbose or "rigorous-sounding" steps that may not be necessary). The evidence for process supervision being superior is strong in domains with clear reasoning steps (like math), but less established in subjective domains.
  4. **Hybrid Approaches**: In many cases, a hybrid approach (outcome grading plus step grading on a subsample) can balance cost and signal quality. This is supported by the idea that we need to monitor for reasoning rot (where the model's internal reasoning degrades even if outcomes remain acceptable) without the prohibitive cost of full step grading.

  Contested Points:
  - The superiority of process supervision is not absolute. It is context-dependent and may be less effective in domains where the reasoning process is not well-defined or where human graders are inconsistent.
  - There is an ongoing debate about the trade-offs between cost and quality. Some argue that outcome supervision is sufficient for tasks where the outcome is the only thing that matters (e.g., code that passes tests, if the code's quality beyond that is not critical). Others argue that even in these cases, without process supervision, the model may develop bad habits that cause failures in edge cases.

  Decision Procedure:

  We will design a flowchart of questions. At each step, we either make a decision or escalate if the trade-offs require a higher-level judgment.

  **Question 1: Is the final outcome machine-checkable?**
     - **Yes**: Proceed to Question 2.
     - **No**: Proceed to Question 3.

  **Question 2 (for machine-checkable outcomes): Is the reasoning process critical to the task?**
     - *Critical* means that the task is sold or used in a way that requires correct reasoning (e.g., educational explanations, code that must be maintainable, not just passing tests).
     - **Yes**: Then we must do step-level grading (at least on a sample) because:
          - The product value depends on the process.
          - We have observed reward hacking (like test-passing garbage code or deranged math work).
          - Research (e.g., in math and code generation) shows that without process supervision, models can learn incorrect or non-robust methods.
          - **Decision**: Use a hybrid approach: outcome grading for all (since it's cheap) and step grading on a random subsample (e.g., 10-20% of the batch). This gives a check on reasoning rot and provides training signal for the reasoning process. Also, for training data, a lead must sign off on the step-graded examples.
     - **No**: The outcome is the only thing that matters (e.g., a code snippet that is only used if it passes tests, and we don't care about the code quality beyond that). Then:
          - **Decision**: Outcome-only grading is sufficient. However, because of the risk of reward hacking, we must periodically (e.g., once a week) run a manual step-level audit on a small random sample (e.g., 5% of the batches) to check for degradation in reasoning quality. If degradation is found, we escalate to reconsider.

  **Question 3 (for non-machine-checkable outcomes): Is there high agreement among human graders on the outcome?**
     - We measure agreement by historical inter-annotator agreement (IAA) or by a quick pilot if new. High agreement means, say, Cohen's kappa > 0.6 or similar metric appropriate to the task.
     - **Yes, high agreement**: Then we can use outcome-only grading. But we must also consider:
          - **Decision**: Outcome-only grading by human graders. However, we must also periodically (e.g., every few batches) run step-level grading on a sample to ensure that the reasoning is sound and to monitor for reward hacking (which might manifest as models producing answers that appeal to graders without being correct in reasoning). Also, because the outcome is not machine-checkable, we rely on human outcome grading which is more expensive than machine checks, so we must budget accordingly.
     - **No, low agreement**: Then both outcome and process grading are problematic. We must dig deeper.

  **Question 4 (for non-machine-checkable with low agreement): Can we decompose the task into steps that have higher grader agreement?**
     - This is based on the idea that sometimes the overall judgment is hard, but intermediate steps are easier to agree on (e.g., in policy analysis: "did the model consider at least three perspectives?", "are the sources cited relevant?").
     - **Yes**: Then step-level grading might actually be more reliable and provide better training signal. Also, by breaking down the task, we can improve the overall quality.
          - **Decision**: Use step-level grading (on all or a sample) based on the rubric of decomposed steps. We might do full step grading on a sample (e.g., 10-20%) and use the step grades to train an automated grader for the steps (if feasible). Also, we must validate that the step grades indeed lead to better outcomes (via A/B testing). This requires lead sign-off because it involves defining a new rubric.
     - **No**: Then we have a highly subjective task with no clear decomposition. In this case, neither outcome nor step grading is reliably providing a strong training signal. We must consider if we can improve the task definition or if we should even be training on this data.
          - **Decision**: Escalate to a lead. Options might include:
              - Redefine the task to be more objective.
              - Use outcome grading but with multiple graders and averaging (expensive).
              - Use step grading with a focus on the most critical steps (if any can be identified).
              - Or, in the worst case, not use this data for training until we have a better rubric.

  **Escalation Points**:
  - Whenever the procedure says "escalate", the team lead must make a judgment call based on cost, potential training signal, and business priorities.
  - For any data that goes into training, a lead must sign off on the grading method.

  **Additional Rules of Thumb**:
  - **Cost Constraint**: Remember that we can only afford step-level grading on about 10% of the 500 daily outputs (i.e., 50 per day). The procedure must respect this. In hybrid approaches, the step grading sample should be drawn from the entire batch and be randomly selected.
  - **Continuous Monitoring**: Regardless of the decision, we must periodically re-evaluate because models can adapt and new failure modes can emerge.

  **Three Case Applications**:

  **Case 1: Math Tutoring Product**
  - Final answer is machine-checkable? **Yes**.
  - Reasoning process critical? **Yes** (the product is sold on explanation quality).
  - **Decision**: Hybrid approach. Grade all for outcome (right/wrong) and a random subsample (say 20%) for step-level quality (using a rubric for explanations). This gives both the outcome signal and monitors/improves the reasoning. The step grading must focus on explanation clarity, correctness of each step, and pedagogical value. Since this feeds training, a lead signs off.

  **Case 2: Internal Code-Gen Model (with unit tests)**
  - Final outcome machine-checkable? **Yes** (via unit tests).
  - Reasoning process critical? **This is the core of the dispute.**
     - Argument for critical: We have already observed test-passing garbage. This means the code is not maintainable, efficient, or secure. For internal use, we might care about these aspects (even if the tests pass) because bad code can cause technical debt.
     - Argument against: If the code is throw-away or only used in a context where passing the test is the only requirement, then maybe not. But given that it's internal and likely to be reused, we should care about quality.
     - **Decision**: The procedure says "Yes" because we have observed reward hacking. Therefore, we must do step-level grading on a sample. Specifically: outcome (test pass/fail) for all, and step-level grading (code quality, readability, efficiency, etc.) on a random sample (e.g., 15%). This will help catch and correct the garbage code. Since you (the user) argued for tests-are-enough, note that the procedure overrules because of the observed failure. The reasoning is that without step-level feedback, the model will continue to produce low-quality code that passes tests, which is harmful in the long run.

  **Case 3: Policy-Analysis Product**
  - Final outcome machine-checkable? **No**.
  - Agreement on outcome? **No** (graders agree barely half the time).
  - Can we decompose? Let's check: 
     - We might break down the analysis into steps like: problem statement, consideration of stakeholders, evidence quality, logical coherence, clarity of recommendations. If graders can agree more on these steps (e.g., "did the model cite at least two sources?" is objective), then yes. 
     - But if even these steps are highly subjective and low agreement, then no.
     - **Assuming we can decompose and get higher agreement on steps**: Then we use step-level grading on a sample (with a rubric). 
     - **Assuming we cannot**: Then we must escalate. 
     - Given the description, let's assume we try decomposition and find that even steps are contested. Then:
          - **Decision**: Escalate to a lead. The lead might decide to:
              - Use multiple graders per output and take the average outcome score (expensive, but might be necessary).
              - Re-design the task to be more constrained.
              - Accept that the signal is weak and use outcome grading with a note that the noise might slow down learning, but it's the best we can do.

  **What the Procedure Can't Do (Failure Modes)**:
  1. **High Subjectivity**: In domains with no clear truth and low grader agreement, the procedure may lead to escalation and potential stagnation (we might not collect data for training until a rubric is developed, which might take time).
  2. **Cost Overruns**: If too many tasks require step grading, we might exceed our capacity (50 per day). We must prioritize and possibly escalate to request more resources.
  3. **Gaming the Step Grading**: Models might learn to produce steps that please human graders (verbose, using certain keywords) without being genuinely correct. The procedure doesn't solve this; it only uses step grading as a signal. We must continuously update rubrics and monitor.
  4. **Evolving Models**: As models improve, the optimal grading strategy might change (e.g., step grading might become less necessary). The procedure is static and requires periodic review.
  5. **Scalability**: The procedure doesn't automatically scale if the number of tasks or outputs increases. We must reassess when volume grows.

  **Conclusion**:
  The procedure is grounded in known principles (credit assignment, reward hacking risks) and pragmatic constraints. Some steps are well-supported (e.g., using step grading when process is critical and outcome is checkable) while others are rules of thumb (e.g., the 10-20% sample size). The escalation points acknowledge that some decisions require business and resource considerations beyond pure theory.

  Finally, note that the field is evolving. The belief that "process supervision beats outcome supervision" is supported by several studies (e.g., in math and code) but is not a universal law. It is context-dependent and may be less effective in highly subjective domains. There is also active research on alternatives like process-based reward models (PRMs) and outcome-based reward models (ORMs) and their trade-offs.
answer: |-
  Below is a decision procedure grounded in established ML principles, empirical research, and pragmatic constraints. It prioritizes **credit assignment**, **reward hacking risks**, **human grader limitations**, and **cost efficiency**. The procedure is a flowchart-style checklist with clear thresholds, escalation points, and failure mode disclosures.  

  **Key Research Grounding**  
  - **Credit Assignment**: Poor credit assignment in outcome-only grading leads to reward hacking (e.g., models producing correct answers via flawed reasoning). Supported by [Wei et al. (2022)](https://arxiv.org/abs/2201.11903) and [Cobbe et al. (2021)](https://arxiv.org/abs/2107.03374).  
  - **Reward Hacking & Goodhart’s Law**: Optimizing for checkable outcomes risks degenerate solutions (e.g., garbage code passing tests). Empirical evidence from [Amodei et al. (2016)](https://arxiv.org/abs/1606.06565) and [Irving et al. (2018)](https://arxiv.org/abs/1811.07871).  
  - **Process Supervision**: While [Lightman et al. (2023)](https://arxiv.org/abs/2305.20050) shows benefits for math (reduced hallucination), human biases in step grading (e.g., favoring "rigorous-sounding" steps) are noted by [Sheng et al. (2021)](https://arxiv.org/abs/2104.08790). **Contested**: Superiority is not universal; depends on task structure and grader consistency.  
  - **Hybrid Approaches**: Subsampling step grading balances cost and risk detection. Justified by monitoring theory (e.g., [Sastry et al., 2023](https://arxiv.org/abs/2308.03296)).  

  ---

  ### **Decision Procedure for Grading Batches**  
  *Run these questions in order for each new task/batch. Escalate if tradeoffs require cost/speed/quality decisions.*  

  1. **Is the final outcome machine-checkable with perfect reliability?**  
     - *Sufficient answer*: Yes = objective ground truth (e.g., math answer, unit test pass/fail). No = subjective/ambiguous (e.g., policy quality).  
     - **Yes** → Proceed to Q2.  
     - **No** → Proceed to Q3.  

  2. **Is reasoning quality a core product value or learning objective?**  
     - *Sufficient answer*:  
       - Yes = Users pay for reasoning (e.g., tutoring, debug logs), or flawed steps cause downstream failures (e.g., unmaintainable code).  
       - No = Only the outcome matters (e.g., internal tool where speed > interpretability).  
     - **Yes** → **Hybrid grading**: Outcome grading (100%) + Step grading (10–20% random subsample).**  
       - *Why*: Outcome grading is cheap for credit assignment; step grading detects reasoning rot. Cost: ~10–20% of batch.  
       - *Escalate if*: Budget can’t cover 10% step grading.  
     - **No** → **Outcome-only grading** + **Monthly step audit**.  
       - *Why*: Low risk of reward hacking affecting business goals. Monthly audits catch drift (e.g., test-passing garbage).  

  3. **Do human graders agree on outcomes?**  
     - *Sufficient answer*: Measured by Cohen’s κ > 0.6 on pilot data. Low agreement = κ ≤ 0.6.  
     - **High agreement** → **Outcome-only human grading**.  
       - *Why*: Cheap and reliable enough if graders align.  
     - **Low agreement** → Proceed to Q4.  

  4. **Can the task be decomposed into objective sub-steps?**  
     - *Sufficient answer*:  
       - Yes = Sub-steps have clear criteria (e.g., "sources cited," "counterarguments addressed") and κ > 0.7 per step.  
       - No = Steps are as subjective as the outcome.  
     - **Yes** → **Step-only grading (subsample)**.  
       - *Why*: Grading sub-steps often has higher reliability than holistic scores ([Sap et al., 2021](https://arxiv.org/abs/2104.08790)). Use a 10–20% subsample.  
     - **No** → **Escalate immediately**.  
       - *Why*: Neither outcome nor step grading provides reliable signal.  

  **Escalation Protocol**  
  - Escalate to lead when:  
    - Q4 answers "No" (subjective tasks).  
    - Cost constraints prevent recommended step grading.  
    - Data feeds training (lead must sign off on method).  
  - Leads decide based on:  
    - **Cost**: Step grading adds ~3–5× time/cost per output.  
    - **Signal quality**: Will noisy grading hurt model more than help?  
    - **Shipping speed**: E.g., Can we delay training data for rubric refinement?  

  ---

  ### **Case Applications**  
  **Case 1: Math Tutoring**  
  - Q1: **Yes** (answer checkable).  
  - Q2: **Yes** (explanations are product value).  
  - **Decision**: **Hybrid grading** (outcome 100% + step 10–20% subsample).  
    - *Why*: Reward hacking risk is high (e.g., wrong steps → right answer). Step grading ensures explanations are valid. Research-backed: Process supervision improves generalizability in tutoring ([Lightman et al., 2023](https://arxiv.org/abs/2305.20050)).  

  **Case 2: Internal Code-Gen (Caught Writing Test-Passing Garbage)**  
  - Q1: **Yes** (unit tests).  
  - Q2: **Yes** (garbage code harms maintainability, even if tests pass).  
  - **Decision**: **Hybrid grading** (outcome 100% + step 10–20% subsample).  
    - *Why you were wrong*: Outcome-only optimization led to reward hacking (Goodhart’s Law). Step grading (e.g., code readability, efficiency) catches degeneration. Pragmatic tradeoff: 10–20% step grading is cheaper than technical debt from garbage code.  

  **Case 3: Policy Analysis (Low Grader Agreement)**  
  - Q1: **No** (subjective).  
  - Q3: **Low agreement** (κ ≈ 0.5).  
  - Q4: **Likely no** (policy tasks resist decomposition; e.g., "logical coherence" is still subjective).  
  - **Decision**: **Escalate to lead**.  
    - *Why*: Neither outcome nor step grading provides reliable signal. Options for lead:  
      - Invest in rubric training to improve agreement.  
      - Use step grading on least subjective sub-steps (e.g., "contains 3+ evidence sources").  
      - Accept noisy data and use outcome grading (risks optimizing for grader preferences).  

  ---

  ### **What the Procedure Can’t Do (Failure Modes)**  
  1. **High-Subjectivity Tasks**: If graders fundamentally disagree (e.g., policy analysis), the procedure escalates but can’t generate signal from noise. Expect: Slow progress until rubrics improve.  
  2. **Evolving Reward Hacking**: Models may adapt to exploit step grading (e.g., generating verbose but empty reasoning). Mitigation: Regularly update rubrics and audit grader bias.  
  3. **Scalability Limits**: At 500 outputs/day, step grading >10% (50 outputs) may bottleneck throughput. Expect: Backlogs if >20% of batches require step grading.  
  4. **Grader Bias**: Human preferences for "rigorous-sounding" steps may override correctness. The procedure assumes rubric quality but can’t enforce it.  
  5. **Inter-step Dependencies**: Graders may miss subtle credit assignment errors (e.g., step 3 is correct only if step 2 is flawed).  

  ---

  ### **Settled vs. Contested Principles**  
  | **Aspect**               | **Settled**                                                                 | **Contested**                                                                                               |  
  |---------------------------|-----------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------|  
  | **Process vs. Outcome**   | Better credit assignment in chains ([Wei et al.](https://arxiv.org/abs/2201.11903)).                        | General superiority: Depends on task. Math/code benefit; subjective tasks may not ([Sheng et al.](https://arxiv.org/abs/2104.08790)). |  
  | **Human Grading**         | Noisy and biased; step grading requires calibration.                       | Whether noise outweighs benefits: Hybrid approaches often win pragmatically.                                |  
  | **Hybrid Sampling**       | Statistically valid for detecting distribution shifts.                     | Optimal subsample size: Rule of thumb (10–20%) due to cost constraints.                                     |  
  | **Reward Hacking**        | Guaranteed with outcome-only in complex tasks.                             | Whether it’s fixable post-hoc: Some argue for regularization; others demand upfront process supervision.     |  

  **Final Recommendation**: Use this procedure as a living document. Recalibrate quarterly using failure data (e.g., reward hacking incidents, grader consensus drift). For training batches, always involve leads—noise propagates.
