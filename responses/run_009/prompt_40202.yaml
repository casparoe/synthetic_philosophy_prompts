answer: |-
  ### What each side is actually claiming
  **Worst-case camp** (e.g., MIRI, some academic theorists):  
  Argues that AI systems must satisfy *formal, adversarial guarantees* (e.g., proof against deception, power-seeking, or catastrophic misuse under *any* input sequence). They claim that without mathematical verification of safety properties—even if idealized—we risk deploying systems that appear safe empirically but harbor "sharp left turns" or deceptive misalignment. Their stance: probabilistic or average-case safety is insufficient for existential risks; only worst-case bounds prevent "unrecoverable failures."  

  **Average-case camp** (e.g., empirical alignment researchers, industry safety teams):  
  Contends that demanding worst-case guarantees for complex, opaque systems is *impossible in practice* and counterproductive. They advocate for *empirically validated reliability*—testing under diverse but realistic inputs, monitoring deployments, and iterating—akin to aviation or medical device safety. Their view: insisting on unattainable proofs stalls useful safety work, while high-probability safety (e.g., 99.99% failure-free operation) is actionable and sufficient given real-world constraints.  

  ---

  ### Diagnosis  
  Your hypothesis is largely correct: **this is primarily a disagreement about epistemic standards and risk tolerance, not technical facts**. Both camps acknowledge neural networks' opacity and current unsafety. The core divergence is in *what constitutes acceptable evidence for action* under deep uncertainty about catastrophic risks.  

  - **Worst-case advocates** operate in a *precautionary paradigm*: they treat AI as a unique, unbounded threat where traditional engineering norms (e.g., error bars, iterative fixes) fail. For them, "safety" necessitates *ex ante certainty*—any nonzero chance of doom justifies indefinite delay until proofs exist. This reflects a deontological stance: deploying without guarantees is ethically impermissible, regardless of opportunity costs.  
  - **Average-case proponents** adopt a *consequentialist engineering mindset*: they prioritize tractable harm reduction *now*, accepting that all safety-critical systems (e.g., bridges, chips) rely on empirical margins and redundancy. Their standard is *pragmatic reliability*: if rigorous testing shows failures are rare/non-catastrophic under expected conditions, deployment is warranted—with safeguards for residual risk.  

  The stalemate persists because:  
  1. **Incommensurable risk frameworks**: Worst-case focuses on *tail risks* (e.g., "What if a superintelligent AI hides misalignment?"), while average-case focuses on *expected harm* (e.g., "Can we reduce misuse by 100× with current tools?").  
  2. **Differing analogies**: Worst-case sees AI as akin to nuclear weapons (where a single failure is unacceptable); average-case sees it as akin to autonomous vehicles (where high reliability enables progress).  
  3. **Implicit stakes**: Worst-case fears *complacency* (e.g., "Good-enough safety" normalizes existential gambles); average-case fears *paralysis* (e.g., Pursuing proofs diverts resources from mitigatable threats).  

  This isn’t merely verbal—it’s a substantive clash over **whether AI risk is *sui generis*** (demanding novel epistemic standards) or **manageable via scaled engineering** (adapting existing norms).  

  ---

  ### What would count as progress  
  Progress requires reframing to expose shared goals while resolving the standards deadlock:  

  1. **Conceptual distinction**: Separate *certification safety* (formal guarantees for deployment *authorization*) from *operational safety* (empirical reliability during *use*). This could reconcile camps: worst-case for pre-deployment thresholds, average-case for continuous improvement.  
  2. **Formal result**: A theorem showing that *no* useful AI system can satisfy worst-case guarantees without crippling capabilities (or vice versa). This would force reevaluation of feasibility.  
  3. **Demonstration project**: Build a high-stakes AI system (e.g., power-grid control) using average-case methods that *detect and contain* failures empirically. Success could shift perceptions of "sufficient" safety.  
  4. **Change of question**: Shift from "Which standard is right?" to "Which standard applies *when*?" For example: worst-case for unboxed AGI, average-case for narrow tools.  

  Ultimate progress: Agreement that **safety is multi-layered**—combining formal verification *where possible* (e.g., runtime monitors) with empirical robustness *where necessary* (e.g., adversarial training).  

  ---

  ### Confidence  
  **Overall confidence: 85%**. The diagnosis robustly explains observed arguments (e.g., worst-case critiques of "learned" safety as inherently unverifiable; average-case appeals to "security-in-depth").  

  **Least confident point**: Whether average-case proponents truly *reject* formal methods, or merely oppose them as *primary* standards. Some (e.g., Anthropic’s mechanistic interpretability work) blend empirical rigor with verification—suggesting the camps may converge on hybrid approaches. This nuance could soften the dichotomy.
