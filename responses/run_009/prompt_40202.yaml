prompt: |-
  Quick background so you know where I'm coming from: I spent thirty-eight years as an experimental condensed-matter physicist, retired a few years back, and since then have gotten deep into philosophy of science and, more recently, the AI alignment literature. In all my years in the lab nobody ever demanded a worst-case gaurantee — every result came with an error bar and an implicit "under conditions like these." Now I've wandered into a debate in the alignment world that has a familiar smell to it. One camp insists safety work should aim at worst-case guarantees: the system has to be safe for every input in some class, including adversarially chosen ones, in a way you could in principle cash out as a proof or a bound. The other camp says that's pie in the sky for systems this complex and opaque, and that the realistic goal is average-case or high-probability safety — good behavior under realistic deployment conditions, assessed the way we assess reliability in other engineering fields. The frustrating part is that both sides seem to agree on the facts: current models are unsafe in various ways, a powerful misaligned system would be very bad, and exact mathematical guarantees for neural networks are basically out of reach. And yet the argument has been going for years with, as far as I can tell, nobody moving an inch. My working hypothesis — and I'm aware I may be smuggling in my own training here — is that this isn't a technical disagreement at all but a disagreement about what standard of evidence a safety claim has to meet before somebody is allowed to act on it, more like engineers arguing about safety factors than like scientists arguing about the world. But I could easily have that backwards.

  So what I want from you is a diagnosis, not a verdict on which camp is right. Is the disagreement substantive, verbal, or two different questions wearing one name — say, "what should we be building right now" versus "what should we eventually be entitled to demand"? Use what each side actually says to support the diagnosis, and then tell me what would count as progress given it: a conceptual distinction, a formal result, a demonstration project that shifts one side's cost-benefit sense, a change of question — or an argument that no progress should be expected because the question is ill-posed.

  Please structure your answer in four sections, in this order: "What each side is actually claiming" (~150 words), "Diagnosis" (~300 words), "What would count as progress" (~150 words), and "Confidence" (~100 words). In that last section, say how confident you are in the diagnosis overall and single out the one point you're least sure of. Don't hedge everything into mush — if you think one diagnosis is clearly right, commit to it.
