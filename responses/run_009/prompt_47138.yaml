      Actually, we can note:
          If n mod 3 = 1, then 2n mod 3 = 2.
          If n mod 3 = 2, then 2n mod 3 = 4 mod 3 = 1.
          If n mod 3 = 0, then 2n mod 3 = 0.
      So the invariant is not preserved? But wait, we are trying to show that we cannot get to MU which has 0 I's. We need to see if we can ever get to 0 I's.

    - Rule III: replaces III (which is 3 I's) by U, so it reduces the number of I's by 3 (so modulo 3 same).
    - Rule IV: removing UU doesn't change the number of I's.

