  I'm a longtime reader of the rationalist blogosphere: I've read Gödel, Escher, Bach, I know the MU-puzzle, and I've absorbed the standard takes on levels of abstraction and on JOOTSing — jumping out of the system — as the sacred move. By trade I implement programming languages: I've written interpreters and a meta-circular evaluator, I know how quines work, and I spend my days thinking about virtualization and sandbox escapes. Restate Hofstadter's treatment of the MU-puzzle and JOOTSing in my vocabulary, as faithfully as you can: the MIU system as a small rewrite system I could interpret in an afternoon, the MU question as a reachability question about that interpreter, Hofstadter's resolution as an invariant argument of the kind I'd discharge with a loop invariant, and the jump out of the system as the move from executing the rules to proving something about all possible executions — from the object language to the metalanguage. Then give me the residue report: which parts of Hofstadter's point survive that translation cleanly, which get distorted in the process, and which have no counterpart in my vocabulary at all. In particular, I want to know whether the analogy between JOOTSing and escalating to a meta-language or escaping a sandbox is a genuine mapping or a smuggled metaphor that makes the move look more transcendent than it is — since in my world, "escaping" one system just means landing in another, bigger, equally mechanical one. Tell me whether the residue shows my vocabulary is missing something (about selves, or about how a formal system can be about itself) or whether it shows that JOOTSing is less than the rationalist canon cracks it up to be. Then say where the translation is most likely to fail, and what consideration would flip your verdict on that residue.
