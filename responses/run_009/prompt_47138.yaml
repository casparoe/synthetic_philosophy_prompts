    - All rules either leave the number of I's the same (Rule I, Rule IV) or change it by:
          Rule II: multiplies by 2. But note: multiplying by 2 modulo 3 is an invertible operation (if we start from a residue that is not 0). However, we start at 1 mod 3. Then:
            After Rule II: 1 * 2 = 2 mod 3.
            Then if we apply Rule II again: 2 * 2 = 4 mod 3 = 1 mod 3.
