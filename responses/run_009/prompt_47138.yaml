          (2) Every rule preserves the invariant in the sense that if the invariant holds (i.e., the number of I's mod 3 is not 0) before the rule is applied, then it holds after.
            - Rule I: no change to the number of I's -> same mod 3 (so if it was non-zero, remains non-zero).
            - Rule II: doubles the number of I's. But note: if the current number of I's is n (with n mod 3 != 0), then 2n mod 3 is either 1 or 2 (as above), so not 0.
            - Rule III: reduces the number of I's by 3, so mod 3 remains the same (so if it was non-zero, remains non-zero).
            - Rule IV: no change to the number of I's -> same mod 3.
          (3) The target string "MU" has 0 I's -> 0 mod 3, which violates the invariant.

    Therefore, "MU" is unreachable.

