            1 mod 3 -> 2 mod 3 -> 1 mod 3 -> ... and also Rule III subtracts multiples of 3 (so mod 3 unchanged). So indeed, the number of I's is always 1 mod 3 or 2 mod 3, never 0 mod 3.

