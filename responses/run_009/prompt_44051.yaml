prompt: |-
  Quick bit of background: I did thirty-five years at the British Geological Survey, mostly seismic hazard modelling, and since retiring I've fallen in with a philosophy group that meets above a pub. I'm the numbers person there, which is exactly how I got walked into this.

  One of the members, a lovely chap but very pleased with himself, has discovered the Condorcet jury theorem and now thinks it settles everything. He laid it out like this:

  (1) If n people each judge the same yes/no question independently, and each is right with probability a bit above one half, then as n grows the probability that the majority is right approaches certainty — with 50,000 people each at 51%, the majority is essentially never wrong.
  (2) For any question you like, the average person is surely at least slightly better than a fair coin at getting it right — people may be ignorant, but they're not systematically worse than random.
  (3) Their judgements are independent in the sense the theorem needs: nobody's copying anybody, each person makes up their own mind in their own kitchen.
  (4) So on any question whatever, whatever a large poll says is right with probability indistinguishable from 1.
  (5) So even when I'm ninety percent sure about something in my own field — say, whether a particular fault is capable of a magnitude 7 event — I should abandon my ninety percent and adopt whatever a YouGov sample of the general public believes, because 99.99-and-then-some beats ninety.
  (6) And the same goes across borders: a large majority in one country believes Q, a large majority in the country next door believes not-Q, and the theorem apparently certifies both majorities at once.

  I know the conclusion is daft — if the public polled better than my colleagues on fault mechanics I'd have spent my career doing something very odd — but when he walked through the steps I honestly couldn't put my finger on where it broke, and I've a nagging feeling that if I reject the wrong step I'll end up throwing out the theorem's legitimate uses too, like averaging independent expert reviews. I suspect the problem is somewhere in what "independent" or "better than a coin" quietly means once you move from his toy juries to actual humans with newspapers and shared biases, but I want it spelled out properly.

  Please reply as exactly five numbered points, a sentence or two each — no intro, no wrap-up, just the list. Use them to tell me which step to reject, why that step looked fine, and what rejecting it costs the theorem elsewhere.
reasoning: |-
  Okay, the user has a background in geology and seismic hazard modeling, now part of a philosophy group. They're dealing with someone misapplying the Condorcet Jury Theorem (CJT) to claim that large public polls are infallible. The user knows this is wrong but can't pinpoint the flaw. They want a clear, concise breakdown in five numbered points.

  First, I need to recall CJT basics. The theorem states that if jurors have independent judgments and each has a probability >0.5 of being correct, the majority's correctness approaches 1 as n increases. The user's friend applies this to public opinion on any question, leading to absurd conclusions like deferring to polls over expert judgment.

  The user suspects issues with "independence" or "better than a coin" when applied to real people with biases. They also mention the paradox where neighboring countries have opposite majorities both claiming correctness. Their deeper concern is preserving legitimate uses of CJT, like averaging expert reviews.

  Breaking down the friend's argument: Step 2 claims the average person is always better than random. But is this true? For specialized topics like fault mechanics, the public might be guessing randomly or worse. Step 3 assumes perfect independence, but people share information and biases, violating independence. Step 4 overgeneralizes CJT to any question, ignoring topic-specific competence. Step 5 ignores context, suggesting polls override expertise. Step 6 highlights a contradiction when majorities disagree.

  Key flaws: Step 2 fails because competence isn't uniform; it varies by question. Step 3 ignores real-world dependencies from media and culture. Rejecting Step 2 means CJT still applies when competence is verifiably above 0.5, like in expert panels. Rejecting Step 3 preserves CJT for genuinely independent groups, like isolated juries.

  The user needs to avoid discarding CJT entirely, so emphasizing that it holds under specific conditions (competence >0.5 and independence) is crucial. The friend's error is overgeneralizing these conditions. The user's unspoken need is to defend expert judgment while acknowledging CJT's valid uses, without sounding dismissive of the friend.
answer: |-
  Here are the five numbered points as requested:

  1.  **Reject step (2): The claim that for *any* question, the average person is at least slightly better than random.** This step looked plausible because people often possess some relevant knowledge or intuition broadly.
  2.  **Step (2) looked fine due to a misunderstanding of "random".** It assumes that lacking knowledge equates to flipping a fair coin (p=0.5). However, for complex or specialized questions (like fault mechanics), the public may lack *any* relevant knowledge, making their guesses systematically *worse* than random (p<0.5) due to predictable misconceptions or biases, or *no better* than random (p=0.5).
  3.  **Rejecting step (2) means the theorem doesn't apply universally.** It only guarantees convergence to correctness when the *actual* probability p of each individual being correct is *strictly greater than 0.5* for the *specific question* at hand. This condition fails for many questions where the public is uninformed.
  4.  **Also reject step (3): The claim that public judgments are sufficiently "independent".** It looked fine because individuals technically form opinions alone. However, the theorem requires *probabilistic independence* – one person's judgment doesn't influence another's likelihood of being correct. Shared biases, common misinformation sources (like newspapers), and cultural narratives create massive *positive correlation*, violating this critical assumption.
  5.  **Rejecting step (3) preserves the theorem's legitimate uses elsewhere.** Genuinely independent judgments *do* exist, such as individual experts reviewing evidence separately without consulting, or isolated jurors forming initial votes. The theorem remains valid and powerful in these controlled scenarios where both p>0.5 and independence are demonstrably satisfied.
