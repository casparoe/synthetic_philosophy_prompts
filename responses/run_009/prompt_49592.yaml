prompt: |-
  My Buddhism-and-philosophy study group has been stuck for three sessions on whether Buddhist ethics is basically consequentialism, and this week it turned into a full argument between two members, so I'm asking you to referee since I couldn't follow all of it. Maya opened by saying it's obviously consequentialist: the whole system is oriented around reducing suffering, karma is just a causal law that ties acts to welfare outcomes downstream, and the bodhisattva ideal even tells you to take on hell yourself if it spares others. Dan answered that this misses what actually carries karmic weight, which is intention — he pointed to the sutta passage where the Buddha says it's intention that he calls karma, and to the story from the Skill in Means Sutra where the Buddha, in a past life as a ship's captain, kills a robber who was about to murder the 500 merchants aboard, knowing he may burn in hell for it. Maya said great, that story proves her side: the captain does explicit arithmetic — eons of hell for the robber versus the deaths of 500 people — and jumps on the grenade, which is straight utilitarian reasoning. Dan said no, the story proves his side: the robber ends up dead either way, so the outcome is fixed and only the compassionate intention can explain why the text treats the killing as a positive act, and notice that elsewhere the same act done in anger would be catastrophic karma.

  Round two went like this. Maya pressed him on the precepts: if intention carries everything, why does right speech seem to forbid lying even when the lie is kind — e.g., telling a dying relative what they need to hear? Isn't that the kind of rule-worship consequentialists explicitly reject? Dan said the precepts are training rules, heuristic guardrails for people whose intentions aren't yet trustworthy, and a fully developed agent would know when to break them. Maya pounced: then it really is consequentialism with extra steps, since the heuristics get their justification from outcomes and dissolve for the ideal agent. Dan's last move was that Maya is smuggling in a Western frame — he said the tradition never separated act, consequence, and intention the way her question assumes, so the mental event of intending IS the karmic act rather than a means to good outcomes, and calling that "consequentialism" is like calling a grammar rule a consequence of good sentences. Neither of them would budge after that.

  Can you go through their exchange move by move and say who's right at each step, not just overall? And please actually commit: I want a definite verdict on whether "Buddhist ethics is a form of consequentialism" is true, false, or a question that's badly formed and needs restating before it has an answer — and if it's badly formed, tell me the restated version and its answer. Also flag what both of them are missing entirely, since I suspect there's something neither brought up. Don't just lay out the interpretive options and hand it back to me, I've had three sessions of that already.
reasoning: |-
  Okay, the user's study group is stuck on whether Buddhist ethics is consequentialist. They described two members, Maya and Dan, debating intensely over three sessions. The user wants me to referee their specific arguments and give clear verdicts on each point, plus an overall conclusion. They're frustrated with the lack of resolution after three sessions, so I need to avoid open-ended analysis and deliver decisive answers.

  First, let's break down the exchange. Maya argues that Buddhist ethics is consequentialist because it focuses on reducing suffering, karma is causal, and the bodhisattva ideal involves sacrificing oneself for others. Dan counters that intention is central, citing the Buddha's statement that "intention is karma" and the Skill in Means Sutra story where a captain kills a robber to save 500 merchants. 

  Maya sees the captain's arithmetic as utilitarian, while Dan emphasizes the compassionate intention. Their second round involves the precepts: Maya questions why lying is forbidden even when kind if intention matters most, while Dan calls precepts training wheels for undeveloped intentions. Maya then argues this makes Buddhism consequentialist with extra steps, and Dan claims she's imposing Western categories.

  I need to evaluate each move. For the opening: Maya is partially right that reducing suffering is central, but Dan correctly notes intention is primary in karma. The Skill in Means story is tricky—Maya's utilitarian reading overlooks that the outcome (robber dying) was fixed; the key difference is the captain's compassionate intention versus anger. So Dan wins that point. 

  On precepts: Maya's challenge about lying seems strong, but Dan's "training rules" defense is orthodox. However, Maya's "consequentialism with extra steps" retort is sharp—but incomplete because it misses that the "ideal agent" in Buddhism isn't just calculating outcomes; their intentions are naturally aligned with wisdom. Dan's "Western frame" point is crucial: Buddhist ethics doesn't split act/intention/consequence like Western theories. Intentions aren't "means" to outcomes; they're karmic seeds themselves. 

  Both miss key nuances: Maya underplays the role of wisdom (prajna) in seeing reality clearly, which shapes intentions beyond mere outcome-calculation. Dan doesn't address how compassion inherently considers consequences without being utilitarian. The tradition also has non-consequentialist elements like virtue ethics (cultivating qualities like metta) and deontological aspects (precepts as expressions of awakening).

  Overall, the question is badly formed. Buddhist ethics is a unique blend: intention-focused but consequence-aware, grounded in wisdom and compassion. Calling it "consequentialism" forces it into a Western box. Better to ask: "Does Buddhist ethics prioritize reducing suffering through outcome-focused calculation?" Answer: only partially—it prioritizes purifying the mind, with reduced suffering as a natural result.

  For the user's frustration, I'll structure clear verdicts per exchange, flag what both miss (especially wisdom and non-Western framing), and end with a restructured question/answer. No waffling!
answer: |-
  ### Refereeing the Exchange: Move-by-Move Verdicts

  **Opening Move (Maya):**  
  *Claim:* Buddhist ethics is consequentialist because it's oriented around reducing suffering, karma is causal law linking acts to welfare outcomes, and the bodhisattva ideal sacrifices self for others.  
  **Verdict: Partially Correct, but Oversimplified.**  
  Maya accurately identifies suffering-reduction as *a* core aim and karma as causal. However, she reduces karma to *only* welfare outcomes, ignoring its deeper link to mental habits and rebirth. The bodhisattva example supports her, but consequentialism isn't the *only* lens.  
  **Who Wins:** Maya scores a point, but Dan’s rebuttal will expose flaws.

  ---

  **Dan’s First Rebuttal:**  
  *Claim:* Karma centers on *intention* (citing the "intention is karma" sutta). The Skill in Means Sutra story shows the killer’s compassionate intention transforms the act’s karmic quality, despite identical outcomes.  
  **Verdict: Correct.**  
  Dan nails the primacy of intention (*cetanā*) in karma. The robber’s death was inevitable, but the captain’s motivation (compassion vs. anger) determines whether the act generates merit or demerit. Outcome alone doesn’t define morality here.  
  **Who Wins:** Dan solidly wins this round. Maya’s "utilitarian arithmetic" misreads the text.

  ---

  **Maya’s Counter (Skill in Means):**  
  *Claim:* The captain’s cost-benefit analysis ("hell for me vs. 500 deaths") proves utilitarian reasoning.  
  **Verdict: Incorrect.**  
  Maya conflates *considering* consequences with *consequentialism*. The captain weighs outcomes, but his choice is framed as a compassionate sacrifice rooted in bodhicitta (awakened mind), not impersonal utility maximization. The Buddha *endorses* the act due to intention, not outcome optimization.  
  **Who Wins:** Dan. Maya misattributes motive.

  ---

  **Round 2: Maya on Precepts**  
  *Claim:* If intention rules, why do precepts (e.g., against lying) forbid acts even with kind intentions? This resembles deontology, not consequentialism.  
  **Verdict: Superficially Strong, but Answerable.**  
  Maya highlights a tension, but Dan’s response resolves it.  
  **Who Wins:** Maya lands a punch, but Dan can counter.

  ---

  **Dan’s Defense (Precepts as Training):**  
  *Claim:* Precepts are "training rules" (*śikṣāpada*) for those with untrustworthy intentions. A perfected being (e.g., a buddha) may break them skillfully.  
  **Verdict: Orthodox and Correct.**  
  The Vinaya and Mahāyāna texts explicitly state precepts are provisional for the unenlightened. A bodhisattva may break minor precepts out of compassion (e.g., lying to save a life).  
  **Who Wins:** Dan. This is standard Buddhist hermeneutics.

  ---

  **Maya’s Pounce:**  
  *Claim:* Then Buddhist ethics *is* consequentialism "with extra steps" – heuristics justified by outcomes, discarded by ideal agents.  
  **Verdict: Overreach.**  
  While heuristics *are* outcome-justified, the "ideal agent" doesn’t revert to raw consequentialism. Their actions flow from wisdom (*prajñā*) and compassion (*karuṇā*), not utility calculation. Breaking precepts requires seeing ultimate truth (*śūnyatā*), not just better outcomes.  
  **Who Wins:** Dan. Maya reduces Buddhism to utilitarianism.

  ---

  **Dan’s Final Move (Western Frame):**  
  *Claim:* Maya imposes a Western act/intention/consequence split. In Buddhism, intention *is* the karmic act – not a means to ends.  
  **Verdict: Profoundly Correct.**  
  Buddhism sees karma as a mental event (*cetanā*) with inherent moral quality. The "act" isn’t separate from intention; the consequence *is* the unfolding of that intention in the psyche and world. Consequentialism treats intention as a tool; Buddhism sees it as the seed.  
  **Who Wins:** Dan decisively. This reframes the entire debate.

  ---

  ### Overall Verdict: The Question Is Badly Formed  
  **"Buddhist ethics is a form of consequentialism" is FALSE.**  
  - **Why?** Consequentialism evaluates acts *solely* by outcomes. Buddhist ethics evaluates acts by *intention* (which generates karma), while acknowledging outcomes matter *as expressions of intention*. It’s a unique hybrid: **intention-centered virtue ethics with consequentialist awareness.**  

  **Restructured Question & Answer:**  
  *Question:* "Does Buddhist ethics prioritize reducing suffering through intention-based actions whose morality is determined by mental state, while acknowledging outcomes as karmic consequences?"  
  *Answer:* **YES.** This captures karma’s focus on mental causation (*cetanā*), the role of wisdom/compassion over rules, and suffering-reduction as the framework—*without* reducing it to Western consequentialism.

  ---

  ### What Both Missed Entirely: The Role of Wisdom (Prajñā)  
  1. **Karma is Ignorance-Driven:**  
     - Both treated suffering-reduction as the goal, but the *root* goal is ending *ignorance* (*avidyā*). Unskillful acts flow from delusion; skillful acts from wisdom. Outcomes matter, but only as they perpetuate or disrupt cyclic existence (*saṃsāra*).  
     
  2. **Non-Dualism in Ethics:**  
     - Dan’s "intention is the act" hints at this, but neither explored how emptiness (*śūnyatā*) dissolves rigid categories like "act," "intention," and "consequence." A buddha’s action is spontaneous compassion, beyond calculation.  

  3. **The Two Truths Framework:**  
     - At the conventional level (*saṃvṛti-satya*), precepts and outcomes matter. At the ultimate level (*paramārtha-satya*), ethics transcends duality. Consequentialism operates only at the conventional level.  

  **Key Takeaway:** Buddhist ethics is *sui generis*. Forcing it into "consequentialism" or "deontology" ignores its psychological depth (karma as mental causation) and soteriological aim (awakening, not just welfare). Tell your group to read Bhikkhu Bodhi on karma and Śāntideva’s *Bodhicaryāvatāra* Chapter 5 – then move on!
