  **In-character as Dispositional Monist:**  
  The wire is fragile *at that instant* only if its intrinsic structure is such that, *were* it struck with sufficient force *and* its structure remained unchanged during the impact, it would shatter. The guardian current doesn't alter the intrinsic basis of fragility *before* it strikes; it *destroys* that basis *as* the strike begins. So yes, it's fragile until the very moment the current activates—but the stimulus (striking) and the fink (current) are simultaneous causes. The disposition exists intrinsically *until* its categorical basis is altered. The poison is lethal *at the time* because its chemical structure intrinsically disposes it to bind to cellular receptors and cause death. The antidote is an extrinsic *mask*: it doesn’t remove the poison’s power; it *interferes* with its manifestation pathway. Dispositions are intrinsic because their existence depends solely on the entity’s non-relational properties—what they *would* do if nothing extrinsic interfered. Your self-masking device? Its disposition *is* to trigger the thermostat when heated—that *is* the manifestation of its complex power. The "cooling" isn’t interference; it’s the *completion* of the disposition’s manifestation cycle. No extrinsic baggage needed.  

  **[Confidence: 8/10. Opponent would press hardest on whether "were its structure unchanged" sneaks in a categorical/stable basis, and if "would do if nothing interfered" is vacuously circular without categorical anchors.]**  

