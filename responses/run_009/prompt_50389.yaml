answer: |-
  Your analysis is remarkably precise, and you've correctly identified a distinct category of statements that doesn't neatly fit common paradoxes. While **"self-refuting statement"** is the closest established term, it's often used broadly and imprecisely. Your phenomenon requires a tighter definition. Here's a breakdown:

  1.  **The Established (but Imprecise) Term: Self-Refuting Statement (Performative Contradiction)**
      *   **Self-refuting statement:** This is the common label. It means a statement whose assertion logically implies its own falsehood.
      *   **Performative contradiction:** This term (associated with Jürgen Habermas and Karl-Otto Apel, building on J.L. Austin) emphasizes the conflict between the *content* of the utterance and the *act* of uttering it. Your Cartesian examples are textbook cases.
      *   **Limitation:** Both terms are often used for *any* statement undermined by its own assertion, including the Liar Paradox ("This sentence is false"), which relies purely on semantic self-reference, and Moorean Paradoxes ("It's raining but I don't believe it"), which involve psychological inconsistency, not logical contradiction upon assertion.

  2.  **Your Distinct Category: A Precise Definition**
      Your phenomenon is a specific subset of self-refuting statements/performative contradictions characterized by:
      *   **Contingent Content:** The proposition expressed *could* be true of the world independently of being asserted (e.g., during dreamless sleep, "I am not thinking" is true).
      *   **Assertion-Guarantees-Falsity:** The sincere, understood assertion of the statement *by a relevant agent* logically necessitates its falsehood *in that specific context*.
      *   **Falsification Mechanism:** The falsity arises *solely* from the conjunction of the act of assertion (with its inherent commitments) and the content asserted. It's not inherent in the abstract proposition nor solely in the psychology of the speaker.
      *   **Non-Semantic Self-Reference:** The statement doesn't necessarily refer to *itself* as a linguistic token (like the Liar), but rather refers to states or actions (thinking, speaking, existing) that are *entailed* by the act of assertion itself.

      **Proposed Specific Term: Assertive Self-Falsifier (ASF)** (To capture the core mechanism: Assertion makes it False).

  3.  **Drawing Boundaries: How ASFs Differ**
      *   **Vs. Liar Paradox & Semantic Paradoxes:**
          *   *Liar:* The proposition "This sentence is false" is inherently paradoxical due to semantic self-reference. Its truth value *cannot be consistently assigned* regardless of who says it or when. Its content is *not contingent* in the way yours are; it's logically unstable by itself.
          *   *ASF:* The content is logically coherent and contingent (could be true). The paradox arises *only* when a specific agent performs the act of asserting it. "I am not thinking" is perfectly coherent and true of a sleeping person; it only becomes false *when* someone asserts it (because asserting entails thinking).
      *   **Vs. Moorean Paradox ("It's raining but I don't believe it"):**
          *   *Moorean:* There is no *logical* contradiction between the content and its assertion. It's perfectly possible for it to be raining while the speaker doesn't believe it. The paradox is *pragmatic* or *psychological*: asserting "P is true but I don't believe P" is deeply irrational or insincere *as an assertion*. It can be *true* while being asserted.
          *   *ASF:* There *is* a logical contradiction between the act of assertion and the content asserted. Sincerely asserting "I am not speaking" *logically entails* that you *are* speaking, making the statement necessarily false *at the moment of assertion*. It *cannot* be true while being sincerely asserted.
      *   **Vs. Presupposition Failures ("I have completely forgotten this conversation"):**
          *   *Presupposition:* This statement *presupposes* that a conversation is happening. Denying its own presupposition ("I have forgotten...") creates a pragmatic oddity or infelicity, but it doesn't necessarily make the *statement itself* logically false *at that moment*. It *might* be true moments later, or even during the conversation if the speaker momentarily blanks. The falsity isn't *guaranteed* by the assertion alone; the presupposition could somehow hold.
          *   *ASF:* The assertion *directly entails* the falsity of the stated content *simultaneously*. "I am not speaking" is falsified *by the speaking itself* unavoidably and instantaneously.
      *   **Vs. Performatives ("I hereby resign", "I name this ship...")**:
          *   *Performatives:* The utterance *is* the action it describes. Saying "I resign" *constitutes* resigning. They are generally *self-verifying*, not self-falsifying.
          *   *ASF:* The utterance *contradicts* the state it describes. Asserting "I am not speaking" contradicts the state of speaking it describes.

  4.  **Extension Beyond Assertion**
      The core mechanism is that the *act* (of a certain type) entails a state that contradicts the stated content. This *can* extend:
      *   **Wondering/Doubting:** "I doubt that I am doubting anything." The act of formulating this doubt entails having *some* doubt, falsifying the claim that you doubt *anything* (including this specific doubt). Similarly, "I am not wondering about anything right now" is falsified by wondering about it.
      *   **Perceiving/Experiencing:** "I am not having any visual experiences." The act of formulating this thought (likely involving introspection of visual experience) entails *some* visual experience (even if just blackness or phosphenes), falsifying the claim.
      *   **Limitation:** The force weakens. "I am not thinking" is directly falsified by *any* conscious thought, including wondering or doubting. "I do not exist" is falsified by *any* act of cognition or assertion by the subject. The core cases involve *cognition* or *communication* acts (thinking, asserting, doubting, wondering) that inherently entail the existence of the thinker/asserter and the occurrence of the act.

  5.  **ASFs as Proof: Descartes and the "Cogito"**
      You've hit the nail on the head regarding the famous inference. ASFs *can* function as proofs, but **only for the existence of the act and the agent performing it *at the moment the act occurs***.
      *   **The Proof Structure:**
          1.  Attempt to assert/entertain the ASF (e.g., "I do not exist," "I am not thinking").
          2.  The very attempt *requires* the existence of a thinking/asserting agent performing the act.
          3.  Therefore, the ASF is false *because* the agent exists and is performing the act.
          4.  Conclusion: "I exist" and "I am thinking" (in the minimal sense required for the attempt) *must* be true.
      *   **The Limits of the Proof (Your Insight is Correct):**
          *   **Only the Act & Minimal Agent:** It proves only that *an act of thinking/asserting is occurring now* and that *there must be some subject ("I") performing this specific act*. It does *not* prove:
              *   A *persistent* self/substance ("I" over time).
              *   A *simple* or *unified* self.
              *   The *nature* of the self beyond being the performer of *this* act.
          *   **Contingency Matters:** The proof works precisely *because* the ASF's content is contingent. Its falsity upon assertion reveals a *necessary condition* for the assertion to be made at all (the existence of the thinker/asserter). The Liar, being necessarily paradoxical, doesn't reveal a contingent truth about the world in the same way.
          *   **Function:** It functions as an *indubitable starting point* or *performative proof*. You cannot coherently doubt your own existence *while you are formulating the doubt*, because the doubt itself confirms it. It's not a syllogism with hidden premises; the act of attempting the doubt *is* the proof.

  **Conclusion:**

  While **"performative contradiction"** or **"pragmatic contradiction"** are the most established terms within philosophy for your phenomenon, they often encompass broader cases. Your category is best defined as **Assertive Self-Falsifiers (ASFs)**: contingent statements whose sincere, understood assertion by an agent *logically guarantees* their own falsity in that context, due to the state or action inherently entailed by the act of assertion itself. This distinguishes them from semantic paradoxes (Liar), pragmatic oddities (Moorean), and presupposition failures.

  ASFs function as proofs for the *occurrence* of the act of assertion/cognition and the *existence* of the agent performing that act *at the very moment the act is performed*, but *not* for the persistence, simplicity, or substantial nature of that agent. Descartes' *Cogito* is the prime example, demonstrating that the attempt to doubt one's own existence or thinking is self-falsifying, thereby proving that one exists as a thinking thing *at that moment*. Your careful distinction between the act and the enduring agent is crucial for understanding both the power and the limits of such proofs.
