answer: |-
  **Quiz: Reproductive Services Cases**  
  *(Answer each based on immediate moral intuition, not prior knowledge of debates)*  

  1. **Altruism vs. Payment**: A woman carries a pregnancy for her sister, who cannot conceive. The sister covers all medical bills and lost wages during pregnancy. Should this be permitted?  
     A) Yes, since she’s helping family and only costs are covered.  
     B) No, compensating lost wages makes it a paid transaction.  
     C) Yes, even if extra payment were offered beyond costs.  

  2. **Eggs vs. Labor**: A clinic recruits college students to sell their eggs for $10,000. Separately, it recruits women to gestate pregnancies for $35,000. Is one more acceptable than the other?  
     A) Paying for eggs is worse.  
     B) Paying for gestation is worse.  
     C) Both are equally acceptable/unacceptable.  

  3. **Non-Cash Payment**: A surrogacy agency offers a surrogate free housing during pregnancy instead of cash. The housing’s value equals typical compensation. Does this change the ethics?  
     A) Yes, housing avoids commodification.  
     B) No, it’s still payment in another form.  
     C) Only if she couldn’t otherwise afford housing.  

  4. **Autonomy Without Need**: A wealthy lawyer chooses to be a paid surrogate for non-financial reasons (e.g., enjoying pregnancy). Is this ethically distinct from a low-income surrogate?  
     A) Yes, her choice isn’t exploitative.  
     B) No, payment still degrades reproduction.  
     C) Only if regulations prevent coercion.  

  5. **Contract Enforceability**: A surrogate signs a contract to relinquish the baby post-birth but changes her mind. Should courts enforce the contract?  
     A) Yes, contracts must be binding.  
     B) No, parental bonds override contracts.  
     C) Only if no payment was involved.  

  ---  
  **Scoring Key & Position Mapping**  
  *(Based on answer patterns: e.g., 1B, 2B, 3B, 4B, 5B = Prohibitionist)*  

  **Position Tree**:  
  - **Leaf 1: Outright Prohibitionist**  
    *Profile*: Opposes any third-party involvement (paid or unpaid).  
    *Answers*: 1B, 2C (both unacceptable), 3B, 4B, 5B.  

  - **Leaf 2: Altruism-Only Compromiser**  
    *Profile*: Permits unpaid arrangements only; expenses strictly limited.  
    *Answers*: 1A, 2B (gestation worse), 3A, 4B, 5C.  

  - **Leaf 3: Exploitation-Based Prohibitionist**  
    *Profile*: Tolerates payment only under unrealized economic equality.  
    *Answers*: 1A, 2A/B (varies), 3C, 4A *but* 5B/C. *Inconsistency Flag*: If 4A (autonomy respected) + 5B (contracts unenforceable), suggests unresolved tension.  

  - **Leaf 4: Regulated-Market Liberal**  
    *Profile*: Allows payment with safeguards (e.g., independent legal advice).  
    *Answers*: 1C, 2C, 3B, 4C, 5C.  

  - **Leaf 5: Full-Market Advocate**  
    *Profile*: Treats contracts as legally binding, payment unrestricted.  
    *Answers*: 1C, 2C, 3B, 4A, 5A.  

  - **Leaf 6: Autonomy-Focused Feminist**  
    *Profile*: Defends paid services as bodily autonomy; opposes enforceability.  
    *Answers*: 1C, 2C, 3B, 4A, 5B.  

  **Unoccupied Combinations**:  
  - *1A + 2A + 3A + 4A + 5A*: Permits egg sales but not gestation? Illogical if eggs are seen as "property" but gestation as "service."  
  - *1B + 2C + 3B + 4C + 5A*: Prohibits family surrogacy but enforces contracts? Incoherent prioritization.  

  **Indistinguishable Leaves**:  
  - *Regulated-Market Liberal (Leaf 4)* vs. *Autonomy-Focused Feminist (Leaf 6)* may both answer 1C, 2C, 3B, 4A. **Only Q5 separates them** (5C vs. 5B).  

  **Weakest Question**: **Q3 (Non-Cash Payment)**. May mis-sort respondents who oppose "commodification" but see housing as "support" (Answer A) vs. those viewing all transfers as equivalent (B). Restructure if evidence shows cultural attitudes toward in-kind payment vary non-systematically.
