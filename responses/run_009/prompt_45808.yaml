prompt: |-
  Two friends of mine got into it at dinner after we watched some documentary about evolutionary psychology (of all things). They went several rounds and eventually asked me to referee, and honestly I couldn't, so I'm passing it to you. Let me reconstruct the moves in order.

  (1) Maya said the doc reminded her of an argument against moral realism she half-remembers: our moral intuitions were shaped by natural selection to help our ancestors reproduce, not to track moral truth. If realism is true, the moral facts don't guide selection, so evolution would've pointed us at the truth only by dumb luck. Since roughly the same moral beliefs would've evolved whether or not any of them were true, they're probably mostly false, and that's supposed to be bad news for the realist.

  (2) Jules said the argument eats itself: selection also shaped our logic, our perception, our trust in 'best explanations' — all the machinery Maya is using to run the argument. If selection only cares about fitness, then by her own standard her belief in the debunking argument is just another fitness artifact, so the argument saws off the branch its sitting on.

  (3) Maya said there's an asymmetry: with perceptual beliefs, the explanation of why we believe them runs through the facts — creatures who thought the tiger was far away when it was close got eaten. With moral beliefs the explanation never needs to mention moral truth at all: kin selection would've made us feel special obligations to kin whether or not those obligations actually exist. So the real test is 'would the same fitness story have produced the same belief even if the belief were false' — perceptual beliefs pass that test, moral beliefs fail it.

  (4) Jules said the test proves way too much. Math: we'd believe 2+2=4 even if numbers turned out to be some kind of fiction, since believing it was useful either way, so the fitness story doesn't route through mathematical truth either — but Maya obviously doesn't want to debunk math. And the realist has an easy reply anyway: just say the moral facts, whatever they are, are facts about suffering and cooperation and flourishing — things selection really did push us toward tracking — in which case the dependence Maya demands is sitting right there.

  (5) Maya called that a rescue by coincidence: you can always save the test by building the moral facts to order around whatever evolution happened to hand out, and then the fit between 'what selection gave us' and 'the truth' is exactly what needs explaining. On math she said the cases differ, because the fitness of believing math routes through the world actually being regular — a brain that models consistent regularities survives because reality is consistent — whereas with morality the fitness story never needs the truth to come in at all.

  (6) Jules' last move was that even granting all that, the debunking only directly covers intuitions selection actually shaped — protect kin, reciprocate, punish freeloaders. Maya's belief that factory farming is wrong isn't a directly selected belief; it's built by reflection out of selected raw materials, and reflection can launder a bad etiology the way a careful calculation can fix a biased estimate. Maya said that just relocates the taint: the reflective method itself — which intuitions it treats as data, which it dismisses as noise — is evolved and selected too, so the debunking transmits along the chain.

  That's where they left it, arguing about whether 'transmits along the chain' was even a coherent idea. Can you go through the six moves and say who's right at each step — which points are solid, which are overreaching, what each of them is getting that the other won't concede, and who comes out more right overall? Also flag anywhere both of them are being sloppy in the same way.
reasoning: |-
  Okay, let me unpack this fascinating philosophical debate between Maya and Jules. The user wants a thorough analysis of each move in their argument about evolutionary debunking of moral realism. 

  First, I need to reconstruct the core tension: Maya's using evolutionary psychology to challenge moral realism, while Jules is attacking the argument's self-undermining nature. The documentary context explains why they're focused on natural selection's role in shaping cognition.

  For move (1), Maya's argument is standard evolutionary debunking - she's correctly applying the logic that if moral intuitions are fitness-adaptive rather than truth-tracking, that undermines realism. But I notice she's vague about "mostly false" - this needs qualification since debunking arguments typically target justification rather than truth-value.

  Move (2) reveals Jules' strongest point: the self-defeating nature. He smartly extends the argument to perception/logic/abduction - the very tools Maya uses. His "saws off the branch" metaphor perfectly captures the problem. But he might be overreaching by implying all cognition is equally vulnerable.

  In move (3), Maya makes a crucial distinction: perceptual beliefs have counterfactual dependence on truth (tiger proximity), while moral beliefs might not. Her "test" formulation is sharp - it's essentially Street's "Darwinian Dilemma" criterion. But she hasn't yet addressed why this asymmetry doesn't also doom logic/math.

  Move (4) is Jules' clever extension to mathematics - if 2+2=4 is fitness-useful regardless of mathematical realism, does it fail Maya's test? His "easy reply" about moral facts being grounded in natural properties is promising but underdeveloped. The math analogy feels powerful but might be flawed - mathematical beliefs seem more directly constrained by reality than moral ones.

  Move (5) shows Maya anticipating the "rescue by coincidence" objection - she's right that simply defining moral facts as whatever evolution favored is question-begging. Her math/morality distinction hinges on whether mathematical regularity constrains cognition more directly than moral truth - this needs deeper examination.

  Move (6) reveals Jules' fallback position about reflective beliefs. His "laundering" analogy is insightful, but Maya's "taint transmission" counters effectively - if the reflective faculty itself is evolved, the debunking may still apply. Their "transmits along the chain" dispute touches on key issues about epistemic overdetermination.

  Overall I'm seeing three layers: 
  1) The self-undermining worry (Jules' strongest card) 
  2) The asymmetry debate (Maya's core insight needing refinement) 
  3) The scope issue about reflection (both making valid but partial points)

  The user wants not just verdicts but where each overreaches. Jules wins on consistency but Maya on explanatory power. Both slightly misstep in treating "evolutionary explanation" monolithically - some cognitive faculties face stronger selection pressures than others. Also neither considers that moral realism might survive as a necessary presupposition rather than empirically justified belief.

  I should structure the response to: 
  - Affirm where each move scores 
  - Flag overextensions 
  - Show why the debate remains live 
  - Note their shared blind spots about graded evolutionary influences
answer: |-
  Let's break down each move analytically, highlighting strengths, weaknesses, and unresolved tensions. Overall, **neither "wins" decisively**, but Jules lands more solid blows to Maya's debunking argument, while Maya identifies genuine asymmetries that demand explanation. The core issue remains unresolved in philosophy.

  ---

  ### **Move 1: Maya’s Evolutionary Debunking Argument**
  - **Her Point**: If moral intuitions evolved *only* for fitness (not truth-tracking), and moral facts don’t influence evolution, moral realism is implausible.
  - **Solid?** Yes, as a standard challenge to moral realism (e.g., Sharon Street’s "Darwinian Dilemma"). The "dumb luck" intuition is powerful.
  - **Overreach**: 
    - Assumes evolution *couldn’t* track moral truth indirectly (e.g., via tracking well-being).
    - "Mostly false" is too strong; debunking targets *justification* for beliefs, not necessarily truth.
  - **What Jules Misses**: He doesn’t engage the core worry: why trust moral intuitions if their causal origin ignores truth?

  ---

  ### **Move 2: Jules’ Self-Defeat Objection**
  - **His Point**: If evolution undermines moral beliefs, it equally undermines logic/perception/abduction—tools Maya uses to argue.
  - **Solid?** Very. This is a classic "companions in guilt" defense (e.g., Plantinga against evolutionary naturalism). If *all* cognition is debunked, the argument self-destructs.
  - **Overreach**: 
    - Not all cognition is equally vulnerable (Maya later addresses this).
    - Doesn’t resolve why moral beliefs *specifically* are suspect.
  - **What Maya Gets**: Her argument needs to explain why morality is *uniquely* debunkable.

  ---

  ### **Move 3: Maya’s Asymmetry Defense**
  - **Her Point**: Perceptual beliefs depend on truth (e.g., tiger distance), while moral beliefs don’t require truth to explain their origin. Her "test": "Would the belief persist if false?" Perception passes; morality fails.
  - **Solid?** Partly. She identifies a key difference: perceptual beliefs have **counterfactual truth-tracking** (false beliefs get you killed), while moral beliefs may not. This is Street’s core insight.
  - **Overreach**: 
    - Overstates perception’s "purity" (e.g., optical illusions show perception isn’t perfect truth-tracking).
    - Doesn’t address why logic/math (Jules’ next move) pass her test.
  - **What Jules Ignores**: Moral facts (if they exist) *might* not causally influence evolution, unlike tiger proximity.

  ---

  ### **Move 4: Jules’ Overgeneralization & Easy Reply**
  - **His Points**:
    - **Math Example**: We’d believe "2+2=4" even if math were fictional (it’s useful). Thus, math fails Maya’s test—but we don’t debunk math.
    - **Easy Reply**: Moral facts *are* about suffering/flourishing—things evolution *did* push us to track.
  - **Solid?** 
    - Math analogy is strong. If Maya’s test debunks morality, it should debunk math—but it doesn’t, so the test is flawed.
    - "Easy reply" is plausible but underdeveloped (Maya pounces on this).
  - **Overreach**: 
    - Math may depend on logical necessity, not evolution (Maya’s next move).
    - Assumes moral facts *must* reduce to natural properties (contested by non-naturalist realists).
  - **What Maya Sees**: His "easy reply" risks circularity.

  ---

  ### **Move 5: Maya’s "Rescue by Coincidence" & Math/Morality Split**
  - **Her Points**:
    - **Coincidence**: Defining moral facts as "whatever evolution favored" makes truth trivially track evolution—but that’s not *explanation*, it’s coincidence.
    - **Math vs. Morality**: Math’s fitness *depends* on reality’s consistency; morality’s fitness doesn’t depend on moral truth.
  - **Solid?** 
    - "Coincidence" is a fair critique of naturalist moral realism (e.g., David Enoch’s "screwdriver analogy"). 
    - Math/morality split is her strongest point: math describes structural features of reality that *constrain* survival; morality may not.
  - **Overreach**: 
    - Underestimates how evolution *could* track moral truth (e.g., cooperation improves survival).
    - Doesn’t prove moral facts *lack* a truth-constraining role.
  - **What Jules Misses**: The burden is on realists to explain *why* evolution aligned us with moral truth.

  ---

  ### **Move 6: Jules’ Scope Objection & Maya’s "Taint Transmission"**
  - **Jules’ Point**: Debunking only applies to *directly selected* intuitions (e.g., kin loyalty), not reflective beliefs (e.g., factory farming). Reflection can "launder" biased intuitions.
  - **Maya’s Reply**: Reflective methods themselves are evolved, so "taint" transmits.
  - **Solid?** 
    - Jules is right: Not all moral beliefs are "stone age intuitions." Refinement (e.g., via philosophy) *might* correct initial biases.
    - Maya is also right: Reflection uses evolved tools (logic, weighting of intuitions), so may not escape debunking.
  - **Overreach (Both)**:
    - Jules assumes reflection is "neutral," ignoring its evolutionary roots.
    - Maya assumes taint *inevitably* transmits, ignoring that reflection could access truth-conducive processes (e.g., conceptual analysis).
  - **Key Insight**: This is the crux—**can reason overcome evolutionary bias?** Both positions are defensible.

  ---

  ### **Sloppiness by Both**
  1. **Overgeneralizing "Evolutionary Explanation"**: Both treat "shaped by evolution" as monolithic. But:
     - Some faculties face stronger adaptive pressures (e.g., perception vs. abstract math).
     - Evolution may "piggyback" on truth-tracking mechanisms (e.g., logic).
  2. **Conflating Origins with Justification**: Evolutionary origins *challenge* justification but don’t automatically *destroy* it (e.g., we trust vision despite knowing its flaws).

  ---

  ### **Overall Verdict**
  - **Jules Wins on Self-Defeat and Scope**: He successfully shows Maya’s argument risks self-sabotage and overgeneralizes (e.g., math). His "scope objection" (move 6) is a major concession realists can exploit.
  - **Maya Wins on Asymmetry**: She identifies a genuine disanalogy between perceptual/logical beliefs and moral intuitions. The "why didn’t evolution track moral truth?" challenge remains potent.
  - **Who’s More Right? Jules edges it** because his self-defeat objection forces Maya into a defensive position, and his "easy reply" (though incomplete) offers a path for realists. But Maya exposes real tensions—**moral realism still needs a convincing account of how evolution aligned us with moral truth**.

  **Philosophical Takeaway**: This mirrors the actual debate (Street vs. Enoch/Shafer-Landau). Evolutionary debunking *challenges* moral realism but doesn’t refute it. Realists must either:
  - Show moral facts *are* tied to evolutionarily salient properties (e.g., well-being), or  
  - Argue that reflection (e.g., Rawlsian equilibrium) can justify moral beliefs post-evolution. 

  Both friends made sharp moves—but philosophy rarely ends with a knockout.
