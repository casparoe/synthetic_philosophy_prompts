  I'm a software developer with no academic training in philosophy, but for the past two years I've been turning over on my own the debate surrounding David Benatar's asymmetry argument in his 2006 book Better Never to Have Been, and I've come to realize the argument never moves. As I understand it, Benatar asks us to compare a person who exists with that same person never existing: for the one who exists, pains are bad and pleasures are good; for the one who never exists, the absence of pain counts as good even though there is nobody around to enjoy that good, while the absence of pleasure does not count as bad, because there is nobody who is thereby deprived. From this one-way asymmetry he concludes that coming into existence is always a net harm, so creating people is always wrong. The responses I've encountered just circle the drain: some say the missing pleasures of the never-born must be bad in exactly the way the missing pains are good, which would flip the argument and make creating happy children a positive duty; others accept the whole comparison but deny it settles anything about the ethics of procreation; and still others say the entire table is rigged from the start, because "good" and "bad" cannot be meaningfully applied to a world without a subject to whom they apply at all. My own hypothesis is that the stall happens because the two sides are covertly answering different questions — one about whether a life contains more bad than good, the other about whether a life can be worse than no life at all — and that no amount of arguing about the four boxes can touch that difference. Is that right? Or is this a genuine substantive dispute about value, a verbal dispute about the phrase "good for," or a clash of bedrock intuitions about the badness of suffering that neither side can argue for without presupposing itself? Please respond as a numbered list of exactly five points, each one or two sentences long, with no introduction or conclusion: (1) your diagnosis of what kind of disagreement this actually is; (2) the strongest evidence for that diagnosis drawn from what the sides themselves say; (3) an assessment of my hypothesis about two different questions hiding under one heading, including where it goes wrong; (4) what, if anything, would count as real progress here — a distinction, a test case, a reframing of the question; and (5) your honest view on whether this debate can ever be resolved, and why.
