prompt: |-
  I'm a science and ideas correspondent preparing a long-form interview for our magazine's ideas program, and I'd like your help drafting the questions. My guest is a cognitive scientist who has spent much of her career arguing that the classic split-brain literature greatly overstates the case for there being two subjects of experience in a patient after corpus callosotomy. Her position, as I understand it, has three strands: the dramatic dissociations show up only under artificial laboratory conditions — lateralized tachistoscopic presentation, chimeric figures — that never arise in ordinary life; in the months after surgery the two hemispheres develop mutual cueing and other workarounds that restore functionally integrated behavior; and the inference from a double dissociation in performance to a doubling of subjects is a non sequitur, since an intact brain likewise contains parallel processes that do not exhaustively communicate with one another.

  Please draft ten to twelve interview questions that go well beyond having her restate the view. I want each of the following represented, each with a follow-up keyed to the answer she is most likely to give:

  (i) a question pressing the standard rejoinder that the left hemisphere's confabulatory narration — calmly inventing explanations for actions the speaking hemisphere did not itself initiate — is exactly what you would expect if the narrating system no longer had access to a single unified field, with a follow-up anticipating her likely reply that post-hoc rationalization is ubiquitous in intact brains as well;

  (ii) a question on whether her view and the more cautious rival position — one subject, granted, but a consciousness that is genuinely and partially disunited — amount to a substantive disagreement or merely a preference between labels, with a follow-up pressing her to state a testable prediction that would separate the two;

  (iii) a question on intermanual conflict, the occasional episodes in which one hand works at cross purposes with the other — reportedly sometimes resolved only when the patient physically restrains the offending hand — and whether her integration-by-workaround story can absorb this or must dismiss it as transient and unrepresentative;

  (iv) and a question on individuals with agenesis of the corpus callosum, whose hemispheres never had a callosum to lose and who nonetheless show subtle integration deficits, asking whether that finding fits her framework or pressures it.

  For every question, please append a note of one or two sentences indicating where the question presupposes a contested reading of the experimental record or a disputed characterization of her position, and what answer from her would reveal the question to have been badly framed. I'd rather not have any questions about how she came to the topic, her feelings about her critics, or her advice for young researchers; every question should turn on the substance of the dispute itself.
reasoning: |-
  Okay, let me break down this request. The user is a science correspondent preparing for an interview with a cognitive scientist who challenges the classic two-subjects interpretation in split-brain cases. They need substantive questions covering four specific angles, each with follow-ups designed to probe deeper. 

  First, I need to consider the guest's core arguments: the artificiality of lab conditions, behavioral compensation over time, and the non sequitur of equating dissociation with duality. The questions must avoid superficial restatements and instead pressure-test these claims.

  For part (i) on confabulation, the key is framing the "standard rejoinder" about left-hemisphere narration as evidence of disunity. The follow-up should anticipate her counter that intact brains also rationalize. I'll note that this question risks presupposing confabulation equals disunity - if she argues it's merely interpretive bias, the framing fails.

  Part (ii) requires distinguishing her view from "partial disunity" theories. The follow-up must demand a falsifiable prediction, not just semantic differences. The trap here is assuming the disagreement isn't already empirical - if she cites existing data resolving it, the question misfires.

  On intermanual conflict (iii), the challenge is whether her compensation theory can explain acute antagonism. The follow-up probes if such cases are exceptions. The presupposition is that conflict contradicts integration; if she argues it's just inefficient compensation, the question's premise weakens.

  For callosal agenesis (iv), we need to examine if congenital deficits align with her acquired-compensation model. Follow-up should address developmental plasticity differences. This assumes her framework treats both populations similarly - if she emphasizes critical-period distinctions, the contrast may be invalid.

  Throughout, I'm watching for contested interpretations: e.g., whether post-op compensation fully restores function or merely masks division. Each question's vulnerability lies in her potentially reframing the evidence base or her own position. The goal is sharp questions that force clarification without straw-manning.
answer: |-
  Here are 12 substantive interview questions targeting the core disputes, incorporating your specific requirements and avoiding biographical/fluff:

  **Core Theme: Challenging the "Two Subjects" Interpretation**

  1.  **Initial Challenge:** You argue the classic split-brain dissociations are artifacts of highly artificial lab setups like lateralized tachistoscopes. Yet, critics point to Sperry and Gazzaniga's early reports of patients bumping into doors with one side of their body or struggling to dress – seemingly "real-world" disunities. How do you reconcile these anecdotal observations with your claim that disunity vanishes outside the lab?  
      *   *(Follow-up):* If these early post-op struggles are genuine, doesn't this suggest a fundamental disunity exists *before* compensatory strategies develop, supporting the idea of initial duality that is later masked, not erased?  
      *   **Presupposition Note:** Assumes early anecdotal reports (bumping, dressing) are reliable evidence of fundamental disunity. If she argues these are transient motor incoordination or misinterpreted, the question's basis weakens.

  2.  **The Confabulation Challenge (i):** A central pillar of the "two subjects" view is the left hemisphere's confabulation – inventing plausible explanations for actions initiated solely by the right hemisphere (e.g., laughing at a command flashed to the right hemisphere, then explaining "You guys are so funny"). Doesn't this *specific pattern* – the speaking hemisphere generating false narratives about behaviors it didn't initiate – provide strong evidence it lacks access to a unified subjective field?  
      *   *(Follow-up):* You might counter that confabulation happens in intact brains too. But isn't the split-brain case qualitatively different? In intact brains, confabulation typically fills memory *gaps* or rationalizes ambiguous events. Here, the left hemisphere is generating explanations for *concrete, observable actions performed by the body it inhabits*, actions whose cause it demonstrably lacks access to. Doesn't this point to a fundamental compartmentalization?  
      *   **Presupposition Note:** Presupposes confabulation in split-brain is uniquely diagnostic of disunity. If she argues it's merely an extreme case of the brain's general interpretive bias operating on partial information, the question's force diminishes.

  3.  **The Confabulation Follow-Up (i):** Building on confabulation: If this phenomenon is just the intact left-hemisphere interpreter doing its normal job but on incomplete information, as you suggest, wouldn't we expect similar *frequent* confabulation about right-hemisphere-initiated actions in everyday life? Yet, reports suggest this is primarily a lab phenomenon. Does this rarity outside constrained testing undermine the "it's just normal interpretation" argument?  
      *   **Presupposition Note:** Assumes confabulation about contralateral actions is rare in daily life post-recovery. If she argues it *does* occur subtly but is overlooked or compensated for, or that the lab simply makes it measurable, the rarity claim is contested.

  4.  **Subjecthood vs. Disunity (ii):** Some theorists concede there's likely only *one subject* post-callosotomy (after recovery) but argue consciousness itself is genuinely *disunited* – information isn't integrated, leading to parallel, co-conscious streams within one subject. Is your disagreement with this "one subject, disunified consciousness" view substantive, or is it largely semantic? Where does the real friction lie?  
      *   *(Follow-up):* If it's substantive, what single, testable prediction would distinguish your "single, integrated (if resourcefully achieved) subject" view from the "one subject with disunified consciousness" view? What empirical outcome would falsify your position or confirm the rival?  
      *   **Presupposition Note:** Presupposes the distinction between "one subject with disunified consciousness" and "one integrated subject" is meaningful and empirically tractable. If she argues the former is incoherent or untestable, the question's premise is challenged.

  5.  **Intermanual Conflict (iii):** Perhaps the most dramatic counter-evidence is intermanual conflict – e.g., one hand buttoning a shirt while the other unbuttons it, sometimes requiring physical restraint. How does your framework of mutual cueing and behavioral integration account for these acute antagonisms? Are these merely transient, unrepresentative hiccups in an otherwise integrated system, or do they reveal an underlying fissure?  
      *   *(Follow-up):* If they are transient, why do they persist in some reported cases long after surgery? If they are "hiccups," what specific failure in the compensatory mechanisms allows such a profound breakdown in coordinated action directed at the *same external object*? Doesn't this suggest the workarounds don't create true unity but merely manage competing agents?  
      *   **Presupposition Note:** Assumes intermanual conflict reports are reliable, persistent in some cases, and fundamentally indicative of competing volitional systems. If she argues these are exaggerated, extremely rare post-recovery, or reflect subcortical/spinal competition rather than hemispheric volition, the challenge weakens.

  6.  **The Nature of Compensation:** You describe the hemispheres developing "mutual cueing" and "workarounds." Could you detail a specific example of such a workaround? More crucially, do these strategies represent the emergence of *new integrative mechanisms* (suggesting restored unity) or merely clever *external signaling* between two systems that remain fundamentally separate internally?  
      *   **Presupposition Note:** Assumes a clear distinction exists between "true integration" and "external signaling/monitoring." If she argues all integration, even in intact brains, relies on signaling mechanisms, the dichotomy may be false.

  7.  **Agenesis of the Corpus Callosum (iv):** Individuals born without a corpus callosum (AgCC) often show subtle but measurable deficits in interhemispheric integration (e.g., in tasks requiring comparing information across visual fields), despite lifelong plasticity. How does this finding fit with your view? Does it suggest that the callosum is fundamentally necessary for *full* integration, putting pressure on your claim that its loss can be fully compensated for?  
      *   *(Follow-up):* AgCC individuals never had a callosum to lose, while your patients *did* and then developed compensations. Could the deficits seen in AgCC actually support your view, by showing that compensatory strategies are *more effective* when developed *after* prior experience with integration (as in surgery patients), compared to never having had the structure at all? Or does it imply a hard limit to compensation?  
      *   **Presupposition Note:** Presupposes AgCC deficits are directly analogous to residual disunities in callosotomy patients and relevant to the "two subjects" debate. If she argues AgCC involves different developmental trajectories and deficits not directly bearing on conscious unity post-callosotomy, the parallel is contested.

  8.  **The Burden of Proof:** The classic interpretation has a certain intuitive pull given the dramatic dissociations. Your view requires explaining away these dissociations as artifacts or compensated-for deficits. Doesn't this place a significant burden of proof on *your* framework? What positive evidence, beyond the *absence* of daily disunity, most strongly convinces you there is only one subject?  
      *   **Presupposition Note:** Assumes the "two subjects" view is the simpler or default explanation needing disproval. If she argues the "one subject" view is the null hypothesis (especially given pre-surgical unity) and the burden lies on proving duality, the framing shifts.

  9.  **Parallel Processing in Intact Brains:** You cite parallel, non-communicating processes in intact brains as undermining the inference from dissociation to duality. But isn't there a crucial difference? In the intact brain, while processes are parallel, they *ultimately* have the *potential* for integration via the callosum and other routes. After callosotomy, that potential is surgically eliminated for specific types of information. Doesn't this create a *categorical* difference in the *possibility* of integration?  
      *   **Presupposition Note:** Presupposes that the *potential* for integration is key to conscious unity. If she argues that unity is defined by the *functional outcome* (integrated behavior/experience), not the latent potential, the distinction loses force.

  10. **The Definition of "Subject":** Much of the debate seems to hinge on the definition of a "subject of experience." Could you explicitly define what criteria *must* be met for you to conclude a system constitutes a distinct subject? How does the post-callosotomy brain *fail* to meet the criteria for two subjects, according to your definition?  
      *   **Presupposition Note:** Assumes agreement on defining "subject" is crucial and possible. If she argues the concept is too vague or that the dispute is fundamentally empirical, not definitional, the question may misfire.

  11. **Unconscious Processing & Unity:** Could the apparent unity post-recovery be achieved largely through unconscious processes? If so, does this challenge the idea of a single *conscious* subject, or simply show that consciousness relies on a scaffold of unconscious integration?  
      *   **Presupposition Note:** Presupposes a distinction between conscious unity and unconscious integration is meaningful in this context. If she argues consciousness inherently emerges from integrated processing (conscious or not), the distinction blurs.

  12. **The Limits of Compensation:** Are there specific types of information or tasks where compensatory integration fundamentally *fails*, even after long recovery, providing a clear window into underlying disunity? If not, how do you rule out the possibility that the workarounds are so effective they perfectly mask an underlying duality?  
      *   **Presupposition Note:** Assumes that persistent, specific integration failures would be strong evidence for underlying disunity. If she argues that any persistent failure simply indicates the limits of plasticity for that *function*, not evidence for separate subjects, the inference is contested.

  **Key to Notes:** Each note highlights where the question relies on an interpretation of data or a characterization of her position that *she might dispute*. If her answer directly challenges the presupposed interpretation (e.g., "That early dressing difficulty wasn't hemispheric conflict, it was ataxia," or "Confabulation *does* happen about daily actions, we just don't test for it easily"), it reveals the question's framing as potentially flawed or based on contested ground. This structure forces clarity on the precise points of contention.
