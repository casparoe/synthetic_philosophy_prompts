prompt: |-
  so I'm a novelist, and my current book is basically four people in a kitchen arguing until sunrise about whether the NPCs in a video game one of them designed matter morally. To keep it from collapsing into two people saying "obviously not" and two saying "obvioulsy maybe", I want each character to hold a genuinely different, defensible position, which means I first need to know what the actual space of positions looks like. Can you build me a decision tree for it? The first branching question should be something anyone in the room could answer without knowing any labels — I'm thinking whether the character could be having experiences at all given what it's implemented in, but from there build the tree out of concrete cases rather than isms: the NPC that begs for its life when you go to delete it, the one that keeps running its pain-behavior loop on a server nobody is watching, one written by the artist specifically to make players feel guilty. Each leaf should carry a name if the position has one, or "unnamed" if nobody seems to defend that combination, plus one sentence on its most awkward commitment — that's where my characters will turn on each other, so I need to know exactly where each view is weakest. Please also flag any pair of leaves the tree can't really separate, and keep it to around six branch questions total. No citations or reading lists — these people are arguing from scratch, and so is my reader.
