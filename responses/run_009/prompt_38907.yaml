prompt: |-
  I've spent years reading rationalist blogs and forums where expected value gets treated as the alpha and omega of practical rationality, and I still can't get straight what I actually think about St. Petersburg-style gambles. Here are my verdicts on some cases; tell me what principle, if any, captures them, and be blunt about which ones it can't.

  1. The classic game: a fair coin, the pot starts at $2 and doubles with each heads, the game ends on the first tails, and I pay $25 to play once. Verdict: no. I know the expected value is infinite; I also notice I come out ahead only if the first tails comes on the sixth flip or later, which happens about one time in sixteen.

  2. The same game, but payouts are denominated in utils rather than dollars — by stipulation each payout is worth exactly its face value to me, so diminishing marginal utility can't do any work. Same price, 25 utils. Verdict: yes, and I can't see how to refuse it — which sits awkwardly next to my no in case 1, where the only difference is the currency.

  3. A single draw: 1 chance in 1,000 of $1,000,000, otherwise nothing, for a $25 ticket. Verdict: yes, comfortably.

  4. A single draw: 1 chance in a billion of $10^18, otherwise nothing, for a $25 ticket. Verdict: no — and I notice its expected value, about a billion dollars net of the fee, dwarfs that of case 3, roughly $975. So whatever backs my verdicts here, it can't be expected value.

  5. The one I keep going back and forth on: the classic game at $25 a play, except the house is only good for about $17 billion, so any pot beyond that is paid at the cap — and I get to play a thousand independent times. For a single play my gut says no; across a thousand plays it starts to feel different, and I can't tell whether that's a real asymmetry or a failure of nerve.

  Is there one principle that delivers all of these — assembled from diminishing marginal utility, probability weighting, a ceiling on money I could actually use, or a shift from expected value to the median or the Kelly criterion — and if not, which verdict would you overturn first, and why that one? Please also say what your principle predicts for a case I haven't listed: the classic game at $25, but with any large payout delivered to my estate fifty years from now.
reasoning: |-
  Okay, let me tackle this user's query about St. Petersburg paradox and their specific cases. The user has spent years reading rationalist blogs but still struggles with expected value in these gambles. They present five scenarios with their intuitive verdicts and ask for a unifying principle. 

  First, I notice the tension between case 1 (dollars, rejection) and case 2 (utils, acceptance). The user explicitly rules out diminishing marginal utility as the explanation here, which is interesting. That means I need to find another factor that distinguishes monetary vs utility-based payouts. Perhaps the key is that dollars have practical limitations while utils are abstract - but the user already knows that.

  Case 3 and 4 show expected value alone isn't driving decisions. The user accepts a 1/1000 chance at $1M but rejects a 1/billion chance at $10^18, even though the latter has higher EV. This suggests probability thresholds matter - extremely low probabilities get discounted regardless of payoff size. 

  Case 5 is tricky with the $17B cap and 1000 plays. The user feels differently about repeated plays, which hints at risk pooling or law of large numbers coming into play. But since each play is independent, the fundamental risk profile doesn't change - only the aggregation effect. 

  The additional case about delayed payout to estate adds another layer. If the user rejected case 1 due to personal utility, would they accept if the payout bypasses their lifetime? That might reveal if the concern is about personal enjoyment or something deeper like existential discounting.

  For a unifying principle, I'm considering: bounded utility function plus probability weighting plus temporal discounting. The bounded utility handles why astronomical sums aren't infinitely valuable, probability weighting explains why tiny chances get ignored, and temporal discounting covers the estate case. 

  But I need to check consistency: 
  - Case 1 rejected: bounded utility + probability weighting 
  - Case 2 accepted: no diminishing utility, so pure EV works 
  - Case 3 accepted: high enough probability 
  - Case 4 rejected: probability too low even with high EV 
  - Case 5 mixed: repeated plays might overcome probability weighting through aggregation 
  - Estate case: likely rejection due to temporal discounting 

  The hardest match is case 5. If single play is rejected, why accept 1000 plays? The probability of hitting the cap increases, but each play still has the same risk profile. This might point to an inconsistency in the user's intuitions, or perhaps they're sensing the law of large numbers even for independent events. 

  I should be blunt about which verdict to overturn - probably case 2. If utils are truly linear, accepting infinite EV makes sense, but humans can't actually process infinite utility. Suggesting bounded utility applies even to utils might resolve the case 1/2 tension. 

  For the estate case: even with delayed payout, the probability issue remains, so rejection seems consistent. The temporal aspect adds another reason to reject but isn't strictly necessary.
answer: |-
  Your verdicts reveal a coherent pattern that clashes with pure expected value maximization but aligns with **bounded utility functions combined with probability weighting** (e.g., prospect theory) and **practical constraints**. Here's the principle that captures your judgments:

  **Principle:** Maximize *weighted* expected utility, where:  
  - Utility is bounded (e.g., logarithmic or capped),  
  - Probabilities below a threshold (e.g., 1/10⁶) are mentally rounded to zero,  
  - Payouts beyond usable wealth/lifetime are discounted.

  ### Verdicts Explained:
  1. **Classic game ($25): NO**  
     → Bounded utility: Dollars beyond ~$10M offer little marginal gain. The median outcome (~$4) loses money, and winning requires astronomically unlikely flips (p < 1/16). Probability weighting dismisses tiny chances of huge payouts.  
     *EV fails here; bounded utility + probability weighting explains rejection.*

  2. **Classic game (utils): YES**  
     → With linear utility, infinite EV dominates. Your "yes" implies utils aren't subject to diminishing returns or probability neglect. This clashes with case 1 but is rational *if* utils are truly linear.  
     *Problem: Humans can't experience infinite utility. I'd overturn **this verdict first**—true linear utility is unrealistic. Even with utils, probability weighting or existential discounting should apply.*

  3. **1/1000 of $1M for $25: YES**  
     → High probability (0.001) of life-changing money. Expected monetary value (~$975) far exceeds cost. Well within cognitive probability thresholds.  
     *Bounded utility accepts this: $1M is utilizable.*

  4. **1/10⁹ of $10¹⁸ for $25: NO**  
     → Probability (10⁻⁹) is below cognitive threshold (mentally rounded to 0). $10¹⁸ exceeds any usable wealth—utility gain is negligible vs. certain $25 loss.  
     *EV fails; bounded utility + probability weighting explain rejection.*

  5. **1000 capped plays ($17B cap): Mixed**  
     - Single play: NO (same as case 1—cap doesn't help median outcome).  
     - 1000 plays: Leaning YES because law of large numbers bites. Expected net win ~$1000 (after cap adjustment), and losing all 1000 times has p < 10⁻³⁰⁰. Probability weighting still dismisses mega-payouts, but repeated trials reduce risk of total loss.  
     *Principle:* With 1000 plays, median outcome shifts toward profit. Bounded utility accepts gains up to cap.

  ### New Case: Payout to Estate in 50 Years
  - **Verdict:** NO (consistent with your pattern)  
  - **Why:**  
    - Probability weighting still discounts tiny odds.  
    - Temporal discounting: Utility to your estate has minimal present value to you *now*.  
    - "Usable wealth" constraint: You derive no benefit from posthumous payouts.  
    *Bounded utility applies across time—future utils are discounted.*

  ### Key Insights:
  - **Bounded utility** resolves cases 1,3,4,5: Utility of money caps at ~$10M–$10B (for humans).  
  - **Probability neglect** explains rejecting cases 1,4,5 (single): Probabilities < 10⁻⁶ are treated as 0.  
  - **Repetition matters** in case 5: Aggregation over trials reduces variance, making median outcomes salient (Kelly-like reasoning).  
  - **Temporal discounting** kills the estate case: Delayed utils ≠ present utils.  

  ### Where the Principle Fights Your Intuition:
  Your "yes" in **case 2 (utils)** is the outlier. If utility is truly linear, accepting is correct—but humans *can't* have linear utility. Infinite utils are incoherent (e.g., the "mugging" problem). **Overturn case 2:** Even with utils, a bounded function (e.g., Logan) or probability weighting should apply. If you can’t conceive of infinite happiness, you shouldn’t pay 25 utils for the gamble.

  ### Bottom Line:
  You’re intuitively using **prospect theory** (Kahneman-Tversky):  
  - Diminishing sensitivity to gains (bounded utility),  
  - Overweighting low-probability events (but *underweighting* near-zero probabilities).  
  This isn’t irrational—it’s adaptive for biological agents in resource-constrained worlds. Pure EV maximization is a useful fiction, not a survival strategy.
