  Final Position: The residual disagreement is substantive, and the thirder position is more coherent.
answer: |-
  ### Joint Statement: Sleeping Beauty Adversarial Collaboration  

  **1. Agreed Claims**  
  Both parties endorse the following statements about the experimental setup:  
  - **Coin Fairness**: The coin is fair, with \( P(\text{heads}) = P(\text{tails}) = 1/2 \) at the initial flip (Sunday night).  
  - **Protocol**:  
    - If heads: Beauty is awakened **only on Monday**.  
    - If tails: Beauty is awakened **on both Monday and Tuesday**.  
  - **Amnesia**: The drug erases Beauty’s episodic memory of each awakening *as it concludes*. Specifically:  
    - On **Monday**: Beauty remembers the protocol and pre-experiment facts (e.g., Sunday’s coin flip) but cannot recall any prior awakening (as there is none).  
    - On **Tuesday**: Beauty has no memory of Monday’s awakening (or any prior Tuesday) but retains knowledge of the protocol and pre-experiment facts.  
    - The amnesia **does not remove** Beauty’s understanding of the experimental rules, temporal context (e.g., "today is an awakening day"), or non-indexical facts.  
  - **Beauty’s Knowledge**: Beauty is fully informed of the protocol, amnesia effects, and coin fairness in advance. Upon awakening, she knows she is in an awakening episode but cannot deduce the day or coin outcome from her current perceptual state.  

  ---

  **2. Disagreements**  
  The halfer and thirder endorse the following positions, stated in their own terms:  

  | Issue | Halfer Position | Thirder Position |  
  |-------|-----------------|------------------|  
  | **Credence upon awakening** | Beauty’s rational credence that the coin landed heads is \( P(\text{heads}) = 1/2 \). This reflects the coin’s objective chance; awakening provides no new *relevant* information to alter this. | Beauty’s rational credence that the coin landed heads is \( P(\text{heads}) = 1/3 \). Awakening reveals she is in one of three indistinguishable states (Mon-heads, Mon-tails, Tue-tails), each equally probable. |  
  | **Response to learning "Today is Monday"** | Upon learning it is Monday, Beauty’s credence becomes \( P(\text{heads} \mid \text{Monday}) = 2/3 \). This follows from conditionalization: Monday awakenings are more likely under heads. | Upon learning it is Monday, Beauty’s credence becomes \( P(\text{heads} \mid \text{Monday}) = 1/2 \). The coin remains fair, and learning the day eliminates the Tuesday-tails scenario. |  
  | **Sharpness of credence** | Beauty’s credence need not be sharp; imprecise credence (e.g., a range \([1/3, 1/2]\)) is rational. Betting arguments are decision-theoretic and do not compel a unique probability. | Beauty’s credence must be sharp \( (1/3) \). Imprecise credence evades the coherence constraints of Dutch books and long-run calibration, which demand a single value. |  
  | **Long-run frequency interpretation** | The proportion of *awakenings* where the coin is heads is \( 1/3 \), but this is irrelevant to Beauty’s credence. The relevant frequency is over *experiments* (weeks), where heads occurs \( 1/2 \) of the time. | The proportion of *awakenings* where the coin is heads is \( 1/3 \), and this *directly justifies* Beauty’s credence. She is asked about heads *given her current awakening*. |  

  ---

  **3. Cruxes**  
  Each crux includes: (a) a case/argument both agree bears on the issue, (b) predictions from both sides, and (c) resolution of whether the disagreement is substantive or verbal.  

  **Crux 1: The Monday Announcement**  
  - **Case**: Beauty awakens and is immediately told, "Today is Monday." What is her credence in heads?  
  - **Bearing**: Both agree this tests consistency of conditionalization. The halfer must update from \( P(\text{heads}) = 1/2 \), the thirder from \( P(\text{heads}) = 1/3 \).  
  - **Predictions**:  
    - Halfer: \( P(\text{heads} \mid \text{Monday}) = 2/3 \)  
    - Thirder: \( P(\text{heads} \mid \text{Monday}) = 1/2 \)  
  - **Analysis**:  
    - Halfer’s path:  
      - Prior: \( P(\text{heads}) = 1/2 \), \( P(\text{tails}) = 1/2 \).  
      - \( P(\text{Monday}) = P(\text{Monday} \mid \text{heads})P(\text{heads}) + P(\text{Monday} \mid \text{tails})P(\text{tails}) = (1)(1/2) + (1/2)(1/2) = 3/4 \).  
      - \( P(\text{heads} \mid \text{Monday}) = \frac{P(\text{heads} \cap \text{Monday})}{P(\text{Monday})} = \frac{1/2}{3/4} = 2/3 \).  
    - Thirder’s path:  
      - Prior: Three equiprobable states \( (\text{Mon-heads}, \text{Mon-tails}, \text{Tue-tails}) \), each \( P = 1/3 \).  
      - \( P(\text{Monday}) = P(\text{Mon-heads}) + P(\text{Mon-tails}) = 2/3 \).  
      - \( P(\text{heads} \mid \text{Monday}) = \frac{P(\text{Mon-heads})}{P(\text{Monday})} = \frac{1/3}{2/3} = 1/2 \).  
    - **Substantive disagreement**: The halfer’s prior assigns unequal probability to centered worlds (Mon-heads: \( 1/2 \), Mon-tails: \( 1/4 \), Tue-tails: \( 1/4 \)); the thirder assigns equal probability. This reflects a deep divergence in handling self-locating uncertainty.  

  **Crux 2: Sharpness and Betting**  
  - **Case**: Beauty is offered a bet at each awakening: "Pay \( X\) to win $1 if heads, $0 if tails." What \( X \) makes the bet fair?  
  - **Bearing**: Both agree Dutch book arguments test coherence. The thirder insists sharp credence is necessary; the halfer denies this.  
  - **Predictions**:  
    - Halfer: Accepts bets at \( X = 0.5 \) *or* endorses imprecise credence (e.g., accepts \( X \in [1/3, 1/2] \)).  
    - Thirder: Only accepts bets at \( X = 1/3 \).  
  - **Analysis**:  
    - With \( X = 0.5 \):  
      - Over 100 weeks (50 heads, 50 tails):  
        - Heads weeks: Beauty bets once per week, pays \( 0.5 \), wins $1 → profit $0.50/week.  
        - Tails weeks: Beauty bets twice per week, pays \( 0.5 \times 2 = $1 \), wins $0 → loss $1/week.  
        - Net profit: \( (50 \times 0.50) + (50 \times (-1)) = -$25 \).  
      - Halfer incurs long-run loss; thirder avoids this at \( X = 1/3 \).  
    - **Substantive disagreement**: The halfer views imprecise credence as rational under indeterminacy. The thirder argues this is incoherent: a rational agent must avoid dominated choices (e.g., sure long-run loss), requiring sharp credence.  

  **Crux 3: Long-Run Frequency**  
  - **Case**: The experiment runs weekly for a year (52 weeks). Calculate the proportion of awakenings where the coin *actually* landed heads.  
  - **Bearing**: Both agree this tests whether Beauty’s credence should align with the frequency of "heads awakenings" in her epistemic situation.  
  - **Predictions**:  
    - Halfer: Proportion = \( \frac{\text{heads awakenings}}{\text{total awakenings}} = \frac{26}{78} = 1/3 \), but this is irrelevant. Beauty’s credence targets "this week’s coin outcome," which has frequency \( 1/2 \) over *weeks*.  
    - Thirder: Proportion = \( 1/3 \), and this *directly calibrates* Beauty’s credence since she is queried *during awakenings*.  
  - **Verbal disagreement**:  
    - "Beauty’s credence that the coin landed heads" is ambiguous:  
      - Halfer: Refers to the coin outcome *simpliciter* (a non-indexical proposition). Frequency over weeks \( \rightarrow 1/2 \).  
      - Thirder: Refers to the coin outcome *given her current awakening* (a centered proposition). Frequency over awakenings \( \rightarrow 1/3 \).  
    - **Resolution**: This is **partially verbal**. Both agree on the frequencies but disagree on *which proposition Beauty is asked about*. However, the **core issue is substantive**: Does self-locating uncertainty ("I am in an awakening") affect the probability of non-indexical events? The halfer says no; the thirder says yes.  

  ---

  **4. Residual Disagreements: Substantive vs Verbal and Inconsistencies**  
  - **Verbal element**: The proposition "Beauty’s credence that the coin landed heads" is underspecified. If it means "the coin landed heads *in this experiment*," the halfer’s \( 1/2 \) references weeks; the thirder’s \( 1/3 \) references awakenings. Clarifying the query ("heads in this week" vs. "heads given this awakening") resolves this.  
  - **Substantive core**:  
    - The halfer treats self-locating uncertainty as irrelevant to the coin’s probability.  
    - The thirder treats self-locating uncertainty as essential, requiring a uniform prior over indistinguishable centered worlds.  
  - **Inconsistency in the halfer’s package under conditionalization**:  
    - The halfer’s position breaks when Beauty learns it is Monday:  
      - Beauty awakens with \( P(\text{heads}) = 1/2 \).  
      - She learns \( \text{Monday} \), updates to \( P(\text{heads} \mid \text{Monday}) = 2/3 \).  
      - But if she had been told *in advance* it was Monday, she would assign \( P(\text{heads}) = 1/2 \) (since no amnesia or multiple awakenings apply).  
    - Thus, **the halfer violates reflection**: Beauty’s credence changes from \( 1/2 \) (pre-Monday announcement) to \( 2/3 \) (post-announcement) *without new coin-relevant information*, merely indexical data. The thirder avoids this: \( P(\text{heads}) \) is \( 1/3 \) pre-announcement and \( 1/2 \) post-announcement, consistent with learning that eliminates Tue-tails.  
  - **Conclusion**: The halfer’s package is **inconsistent** under conditionalization. The thirder’s approach is coherent, aligns with Dutch books, and treats self-locating uncertainty correctly. **We recommend adopting the thirder position.**  

