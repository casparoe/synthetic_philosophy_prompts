answer: |-
  Right, let's dissect this sentencing quandary that's clearly niggling at you. It's a brilliant example of where the rubber of punishment theory hits the road of practical justice. The guilty plea discount (GPD) is indeed a fascinating pressure point between principle and pragmatism. Here’s a reconstruction:

  **The Implicit Theory of Punishment Behind the GPD:**

  1.  **Core Consequentialist Foundation:** The *primary driver* and *essential justification* for the *existence and scale* (up to 1/3) of the GPD is unambiguously consequentialist.
      *   **Strictly Needs Consequentialism:** The fundamental logic – "We offer a significant reduction *specifically* to avoid the costs (financial, temporal, emotional) of a trial" – is pure instrumentalism. The discount is a *bargaining chip* offered for a socially beneficial outcome (efficiency, sparing victims). **This core mechanism – linking sentence reduction directly and substantially to avoiding system costs – presupposes a consequentialist commitment.** Without the consequentialist goal (saving resources, reducing victim trauma), there's simply no *reason* for the discount to exist *in this specific form*.

  2.  **Retributivist Accommodation (Plausible but Contested):** Retributivism *can* be stretched to accommodate *a* reduction, but not easily the *standardised scale* or *primary rationale*.
      *   **Retributivist Accommodation:** A retributivist *could* argue that an early guilty plea demonstrates:
          *   **Acceptance of Responsibility:** Arguably reducing the offender's *culpability* or *moral blameworthiness* compared to someone who forces victims through a trial and denies guilt until the verdict. This touches on remorse and facing consequences.
          *   **Cooperation with Justice:** Seen as a morally relevant act, potentially lessening the *desert* for punishment compared to someone who obstructs the process.
          *   **Practical Recognition:** Most real-world retributivist systems incorporate elements like remorse or cooperation as mitigating factors *within* a proportional sentence. The GPD *could* be shoehorned into this category.
      *   **Underdetermined/Contested:** The *extent* to which an early plea *genuinely* reduces culpability/desert is philosophically debatable. Does pleading guilty *before* trial fundamentally change your moral desert for *the crime already committed*? Or is it primarily a procedural choice? The standardised 1/3 discount feels arbitrary from a desert perspective – why 1/3? Why not less? Why the same for vastly different crimes? This scale seems driven by consequentialist incentives, not nuanced desert assessment.

  3.  **The "Discount vs. Tax" Framing:**
      *   **Largely Spin/Underdetermined:** This is primarily semantic and political framing. Functionally, from the offender's perspective, choosing a trial *results* in a longer sentence than pleading guilty to the *identical offence*. Calling it a "discount" for pleading guilty is psychologically and politically more palatable than calling it a "trial tax" or "penalty for exercising your right." However, the *effect* is identical: the sentence *is* increased if you go to trial and lose. A strict retributivist focused purely on desert for the offence would likely see this framing as disingenuous because the *procedural choice* significantly alters the outcome for the *same underlying wrong*.

  **Tension with Proportionality:** This is your core unease, and it's spot on. Proportionality, a central tenet of retributivism (and modern sentencing generally), demands that the sentence primarily reflect the seriousness of the offence and the offender's culpability *for that offence*. The GPD injects a massive, standardised procedural factor (plea timing) that dramatically alters the sentence *without* necessarily altering the seriousness of the offence or the core culpability. This *is* a fundamental tension. The official line tries to sidestep it by claiming the GPD doesn't affect the "starting point" (the sentence for the offence after trial), but the *final outcome* the offender experiences is undeniably different based on procedure, not just offence/culpability.

  **What Would a Strict Retributivist Do Tomorrow?**

  A *strict* retributivist, prioritising *only* desert based on offence seriousness and culpability, would likely:

  1.  **Scrap the Standardised, Automatic 1/3 Discount:** They would see this as an unacceptable distortion of proportionality driven by non-desert factors (efficiency).
  2.  **Possibly Shrink/Reframe It as Genuine Mitigation:** They *might* retain the *possibility* of a *much smaller* reduction where an *early* plea is viewed as:
      *   **Genuine Remorse:** Strong, credible evidence of remorse directly impacting moral blameworthiness.
      *   **Acceptance of Responsibility:** As a positive moral act reducing desert.
      *   **Sparing Victims (Retributivist Angle?):** Some retributivists *might* argue that *willingly* sparing victims further trauma could be a morally relevant act slightly reducing desert, though this is less core. However, this mitigation would be:
          *   **Discretionary:** Judges would assess its genuineness and weight case-by-case.
          *   **Modest:** It would be a small adjustment within the proportional range for the offence, not a standardised 1/3. Think 10-15% maximum, and only where truly merited by demonstrating reduced culpability.
          *   **Not Primarily About Efficiency:** The *justification* would shift entirely to reduced culpability/desert, not court savings. Efficiency would be a welcome side-effect, not the *reason* for the reduction.
  3.  **Emphasise Proportional Starting Point:** The sentence announced after a trial would be the clear, unambiguous statement of the deserved punishment for the offence/culpability. Any mitigation for plea/remorse would be a secondary, smaller adjustment.

  **Conclusion:**

  The guilty plea discount practice **most presupposes consequentialism**, specifically utilitarian efficiency. Its existence and standardised scale are fundamentally driven by the goal of avoiding trial costs and victim trauma. While retributivist principles *can* be invoked to *accommodate* a *limited* reduction based on genuine remorse or acceptance of responsibility reducing culpability, the current 1/3 discount mechanism, its primary justification, and its tension with strict proportionality reveal its deeply consequentialist engine. The "discount not tax" framing is largely presentational spin masking the functional reality. A strict retributivist would radically reduce the discount's scale and reframe its justification entirely around reduced desert, effectively breaking the direct link between plea timing and a large, standardised sentence reduction designed to drive efficiency.

  \answer{consequentialist-leaning hybrid}
