  Let me try to formalize:

  In functionalism, a system realizes a functional description if there is a mapping from the system's states to the functional states such that the causal relations among the system's states mirror the functional relations. The problem with the wall is that the mapping is arbitrary and gerrymandered. We need a criterion for when a grouping is non-arbitrary and corresponds to the system's own causal organization.

  The criterion I propose is that the grouping must be based on the system's own causal structure in a way that the groups are causally homogeneous and the transitions between groups are directly causally relevant to the system's behavior. Specifically, for a state to be a real functional state, it must be a state that the system can be in and that has a causal role in producing outputs and responding to inputs. The grouping must be such that the system's causal transitions are determined by the group membership and not by the micro-details that we have ignored.

  But the friend demands a criterion that doesn't stipulate that walls are dumb and that works for a slow, noisy robot.

  Criterion: A system realizes a functional state machine if and only if there exists a grouping of its states such that:

  (i) The grouping is causally relevant: the group of a state at a time is determined by the system's properties that are causally relevant to the transitions (i.e., the grouping is not arbitrary but is based on the properties that the system uses to determine its next state and output).

  (ii) The transitions between groups are law-like and are the result of the system's own causal laws, not just an artifact of the grouping.

  In the case of the wall, the microscopic states are not grouped by any causal property that the wall uses. The wall doesn't have any internal organization that uses these groups. The groups are defined arbitrarily. Moreover, the wall doesn't have any outputs that are functionally relevant. The outputs of the wall (like reflecting light, emitting heat) are not under the control of any internal state in a way that matches the functional table.

  In the case of a slow, noisy robot, we can have a grouping that is based on the robot's design. The robot is designed to have internal states that fall into groups (even if noisy) that correspond to functional states. For example, the robot might have a voltage level that is interpreted as a particular state. Even if there is noise, we can group the voltage ranges. The grouping is not arbitrary because it is based on the design of the robot: the robot's circuitry is built to transition between these voltage ranges in a way that matches the functional table.

  Therefore:

  - Wall: does not realize the functional table because the grouping required is arbitrary and not based on any causal properties that the wall uses. The wall does not have outputs that are functionally controlled by the internal states in the way the table requires.

