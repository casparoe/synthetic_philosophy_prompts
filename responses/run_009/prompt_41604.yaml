  Criterion: A grouping constitutes a realization of a functional state machine if and only if the groups are such that (a) the grouping is based on properties that are causally relevant to the system's transitions and outputs, and (b) the transitions between groups are law-like and are the result of the system's own causal organization, meaning that the system's behavior is in fact governed by the group-level states.

  - Wall: fails because the grouping is arbitrary and not based on causally relevant properties. The wall's behavior (if we can call it that) is not governed by the group-level states we defined. It is governed by the microstates.

  - Robot: passes because the grouping is based on causally relevant properties (e.g., voltage levels that are designed to control the robot's behavior). The robot's transitions are governed by the group-level states (even if noisy, because we can group the noisy states appropriately).

  Cost: The rejection of step (5) requires that we make explicit that functionalism requires the functional states to be the causally efficacious states. This might be seen as adding a layer of complexity, but it is already implicit in functionalism. The cost is minimal. It does not cost functionalism its core idea.

