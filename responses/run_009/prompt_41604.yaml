  We are given an argument against functionalism and asked to locate the misstep. The argument concludes that functionalism is either false or too liberal because, according to it, a wall would have mental states (like feeling pain) since the wall's microscopic states can be grouped to realize any finite state machine, including one that represents pain.

  Let me break down the steps:

  (1) Functionalism: mental states are defined by their causal roles (relations to inputs, outputs, and other internal states). A system is in a mental state if it realizes the appropriate functional organization (which can be specified by a finite state-transition table).

  (2) A wall over an hour has a vast number of microscopic states.

  (3) For any finite state table, we can group the wall's microstates into groups that mimic the state transitions of the table. This is because of the combinatorial freedom in grouping and the dense graph of state transitions.

  (4) The grouping doesn't need to be written down to exist.

  (5) The transitions between the wall's states are caused by its prior states, so causation is present.

  (6) Therefore, the wall realizes a simple pain table (and in fact, every finite state machine).

  (7) But the wall doesn't feel anything. So functionalism is either false or too liberal.

  The challenge: We want to reject one of these steps. The friend has already dismissed the idea that groupings must not be gerrymandered and demands a criterion for a "real grouping" that doesn't just stipulate that walls are dumb and that also works for a slow, noisy robot.

  I believe the flaw is in step (3). The idea that we can always group the microstates arbitrarily to mimic any finite state machine is mathematically correct (by the pigeonhole principle or combinatorial arguments), but the problem is that the groupings that are required for the functionalist account must be based on the actual causal structure of the system. The grouping must be such that the causal transitions between the groups are the same as the transitions in the state table, and this must be a natural grouping in the sense that it is determined by the system's own causal organization, not by an arbitrary external grouping.

  However, the friend has anticipated this by saying in (5) that the transitions are genuinely caused. But note: the grouping is arbitrary. The transitions between the microstates are causal, but the grouping of microstates into "superstates" is arbitrary. The causal relations between the groups are not the direct result of the system's causal structure but of our grouping. The system's own causal transitions are between microstates, not between our groups. When we define a group, we are essentially defining a new state that is a set of microstates, but the transition from one group to another is not directly caused by the system in the same way that the microstate transitions are. Instead, it is a result of the underlying microstate transitions and our grouping.

  Therefore, the flaw is in step (5): the wall's transitions between the groups are not genuinely caused by the groups. The wall's causal transitions are at the micro level. The grouping is arbitrary and not part of the wall's causal structure. The functionalist requires that the states in the state table correspond to causally relevant states of the system. But in the wall, the groups we define do not have any causal power as groups. The causal powers are at the micro level. So the transitions between groups are not the result of the group-level causal relations but of the underlying micro-causal relations and our grouping.

