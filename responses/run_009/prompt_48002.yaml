prompt: |-
  I lead the appraisal unit at a regional transport ministry. Before any major project goes to the minister for approval, my analysts must produce a probabilistic estimate of its final cost, and where relevant its demand. We have been shifting from bottom-up engineering estimates toward what the planning literature calls reference class forecasting: rather than building the project up from its parts, you place it in a class of completed comparable projects and use that class's distribution of outcomes. The trouble is that nothing tells us how to pick the class, and the choice moves our answers by billions. For a proposed metro line, one analyst wants all urban rail projects worldwide; another wants only rail projects in countries at our income level; a third only projects completed in the last fifteen years, on the ground that construction practice has changed. Each class yields a different distribution, and each analyst can tell a plausible story for theirs.

  Please turn what philosophy of statistics actually knows about the reference class problem into a procedure my analysts can run in a working day, using a spreadsheet and no statistical training. It should specify: what makes a candidate class legitimate (enough members, genuine exchangeability with our project, outcomes measured the same way across the class); an ordered routine for generating, pruning, and where necessary blending candidate classes; what to do when every defensible class is small; and what to do when the class's overruns were driven by a feature our project itself has — so that the bad news in the class is not noise to be averaged away but precisely the thing we should heed. Mark clearly the points where the procedure must stop and hand the decision to a person, because the question is one of values rather than statistics. Then say how to present the result to the minister, including what to say when the reference class estimate and the bottom-up estimate disagree badly.

  Finally, run the procedure on three cases: the metro line above; a fixed bridge-and-tunnel link replacing a ferry crossing, for which the only roughly comparable projects are a handful of famous ones; and a rural road upgrade, a project type so common that the class is enormous but consists mostly of projects far smaller than ours. In at least one case the procedure should give an answer my ministry will not like — say so plainly. And be honest at the end about what the procedure cannot do, in particular whether any procedure of this kind can dissolve the choice of reference class rather than merely discipline it.
reasoning: |-
  Okay, the user leads an appraisal unit at a regional transport ministry and is dealing with the reference class forecasting problem. They need a practical procedure that their analysts can use in a day with just a spreadsheet. The main issue is choosing the right reference class, which significantly impacts cost estimates. Each analyst has different ideas—global projects, same-income countries, recent projects—each giving different results.

  First, I need to recall what the reference class problem is in philosophy of statistics. It's about selecting a group of similar past projects to predict future outcomes. The core problem is that different classes yield different predictions, and there's no purely statistical way to pick the "right" one. The key concepts here are exchangeability (the project should be similar enough to the class) and adequate sample size.

  The user wants a step-by-step procedure. It should cover legitimacy criteria (like exchangeability, data consistency), how to generate and prune classes, handle small sample sizes, and deal with situations where a specific feature in the class affects overruns. Also, where to involve human judgment, and how to present results to the minister, especially when reference class and bottom-up estimates differ.

  For legitimacy: The class needs enough projects (say 10+), exchangeability (similar in key aspects like project type, location, scale), and consistent outcome measurement (e.g., all costs in real terms). The procedure must include steps to identify variables that matter, gather data, create candidate classes, prioritize them based on relevance, and blend distributions if necessary.

  Small classes are tricky. If all defensible classes are small, they might need to combine them or use a weighted blend. But if a class has a feature causing overruns that also applies to the current project (e.g., difficult terrain), they shouldn't average it out—they need to flag it as a specific risk.

  Human judgment comes in when deciding which variables define exchangeability, blending weights, or interpreting conflicting signals. These are value judgments, not statistical.

  For presentation to the minister: Focus on the range of outcomes, key risks, and explain discrepancies with bottom-up estimates. Emphasize that reference class shows systemic risks while bottom-up might miss them.

  Now, applying to three cases:

  1. **Metro Line**: Conflicting classes (global, same-income, recent). The procedure would prioritize recent projects in similar economies but blend with others. Result might show high overrun risk, which the ministry might not like.
    
  2. **Fixed Link (bridge/tunnel)**: Few comparable projects (e.g., Chunnel, Øresund). Small class size means using them directly and highlighting unique risks like seabed conditions. High uncertainty here.

  3. **Rural Road Upgrade**: Large class but mostly smaller projects. Need to adjust for scale, maybe use cost per km. Risk of overrun due to scale effects.

  Honesty at the end: The procedure can't eliminate the reference class choice; it only structures it. Judgment is still needed, and some uncertainty remains inherent. The method disciplines the process but doesn't solve the philosophical problem.

  Need to ensure the procedure is doable in a day with a spreadsheet—so no complex stats, just sorting, filtering, calculating averages/medians, percentiles. Analysts can use built-in functions for percentiles or histograms.

  Also, the user mentioned one case where the ministry won't like the answer. The metro line showing high overrun probability due to recent similar projects would be unwelcome but necessary to report.
answer: |-
  Here is a practical, philosophy-of-statistics-grounded procedure for reference class forecasting (RCF), designed for spreadsheet use by non-statisticians in one working day. It formalizes the **Legitimate Reference Class Framework**, addressing the core problem: **Exchangeability** (can our project reasonably be swapped with past projects without changing the outcome distribution?) is key, not "similarity."

  ### Core Principles from Philosophy of Statistics
  1.  **No "True" Class:** RCF doesn't find a perfect class; it finds the *least wrong* class for prediction given available data and domain knowledge.
  2.  **Exchangeability Paramount:** Projects must be interchangeable *with respect to the outcome drivers*. Context matters more than arbitrary categories.
  3.  **Stratification over Expansion:** Narrower, more exchangeable classes are preferred *if sample size allows*. Wider classes add noise.
  4.  **Data Consistency:** Outcomes (e.g., cost overrun %) must be measured comparably (e.g., constant dollars, same definition of "final cost").
  5.  **Acknowledge Value Judgments:** Key decisions about "what matters" are not statistical; they require expert input.

  ---

  ### The Legitimate Reference Class Framework (L-RCF) Procedure
  **(Use a single spreadsheet: Tabs for Data, Classes, Analysis, Output)**

  #### Phase 1: Define Legitimacy & Generate Candidates (1-2 hours)
  1.  **Define Core Exchangeability Variables (Human Judgment Stop #1):** With your team, brainstorm 5-10 variables *plausibly driving cost/demand overruns* (e.g., *Project Type, Terrain Complexity, Governance Model (PPP vs Public), Regulatory Environment Stringency, Decade Completed, GDP/Capita, Project Scale (Cost/km), Technology Novelty*). Prioritize. *For Metro: Type=Urban Rail, Terrain Complexity, Governance, Decade, GDP/Capita.*
  2.  **Gather Data:** Populate a "Data" tab with all candidate projects. Columns: Project Name, Outcome (% Cost Overrun, % Demand Shortfall), all Core Variables from Step 1, plus other potentially relevant descriptors (Location, Length, etc.). *Source databases like ITF/OECD, Global Infrastructure Hub, ministry archives.*
  3.  **Generate Candidate Classes:** In "Classes" tab, define classes using filters on Core Variables. Start specific, then broaden. *Metro Examples:*
      *   `Class A`: Urban Rail + Same GDP Band + Last 15 Years
      *   `Class B`: Urban Rail + Same GDP Band + All Years
      *   `Class C`: Urban Rail + All Countries + Last 15 Years
      *   `Class D`: All Rail Projects + Same GDP Band + Last 15 Years
      *   *(Include broader classes like "All Infrastructure" only if desperate)*
  4.  **Initial Legitimacy Check (Per Class):**
      *   *N >= 10?* (Minimum for crude distribution). If N<10, flag as "Fragile".
      *   *Exchangeability Plausible?* Does the filter logically make projects *interchangeable* on key overrun drivers? (Human Judgment Stop #2 - Does `Same GDP Band` plausibly control for institutional capacity/corruption risk? Does `Last 15 Years` plausibly control for modern contracting risks?).
      *   *Data Consistent?* Are overruns calculated the same way (e.g., final cost vs. approved budget at same project stage)? Flag inconsistencies.

  #### Phase 2: Prune, Rank & Blend (2-3 hours)
  5.  **Prune Illegitimate Classes:** Remove classes failing Legitimacy Checks (N<10 with no compelling reason, clear non-exchangeability e.g., "All Projects in Countries Starting with 'C'", inconsistent data).
  6.  **Rank Legitimate Classes by Plausible Exchangeability:** Order remaining classes by how well their filters isolate projects likely sharing *the same underlying overrun mechanisms* as your project. Prioritize specificity on Core Variables. *Metro Ranking: Class A (Specific GDP+Recent) > Class C (Recent) > Class B (GDP) > Class D (GDP+Recent but too broad type).*
  7.  **Handle Small Defensible Classes (N<10-15):**
      *   If ONE class has strong exchangeability arguments despite small N (e.g., only 8 projects *exactly* like your complex metro in similar economies recently), use it BUT report as highly uncertain.
      *   If MULTIPLE small defensible classes exist, **Blend Distributions (Human Judgment Stop #3):**
          *   Calculate key statistics for each class (Mean, Median, 80th Percentile overrun - use `PERCENTILE.INC` in Excel).
          *   Assign weights based on Rank from Step 6 (e.g., Highest rank=0.5, Next=0.3, Next=0.2). *Metro: Blend A(50%) + C(30%) + B(20%).*
          *   **Weighted Estimate = Σ(Weight * Class Statistic).** *Calculate for Mean, Median, 80th Percentile.*
  8.  **Address the "Bad News Feature" (Human Judgment Stop #4):** *Does the class show high overruns driven by a feature YOUR project HAS?* (e.g., Class shows 40% avg overrun for projects in "Very Soft Ground," *and* your tunnel is in very soft ground).
      *   **DO NOT** simply average this into a blend. **DO:**
          *   Flag this specific class/feature as a **Critical Risk Factor**.
          *   Report the statistic (e.g., "Projects with *Very Soft Ground* had median overrun of 40%") prominently *alongside* any overall estimate.
          *   This is a causal signal, not just noise. It demands mitigation planning, not statistical dilution.

  #### Phase 3: Calculate & Summarize (1-2 hours)
  9.  **Calculate Key Statistics for Primary Class/Blend:** For the chosen primary class (or blend), calculate in "Analysis" tab:
      *   Number of Projects (N)
      *   Mean Overrun (`AVERAGE`)
      *   Median Overrun (`MEDIAN`)
      *   80th Percentile Overrun (`PERCENTILE.INC(range, 0.8)`) - Represents "Pessimistic" case.
      *   (Optional: Min, Max, Standard Deviation (`STDEV.P`))
  10. **Compare to Bottom-Up (BU) Estimate:** Calculate BU % overrun estimate. Calculate absolute difference vs. RCF Mean/Median.

  #### Phase 4: Presentation to Minister (Template)
  *   **Headline:** "Probabilistic Cost Estimate Based on Global Experience: [Project Name]"
  *   **Key Input:** "Primary Reference Class: [Description - e.g., Urban Rail in Similar Economies, Last 15 Years, N=25]"
  *   **Key Outputs (Visualize with simple bar/box plot):**
      *   "Likely Outcome (Median Overrun): **X%**"
      *   "Average Outcome (Mean Overrun): **Y%**"
      *   "Prudent Planning Scenario (80th Percentile): **Z%**"
  *   **Critical Risk Factors (If any from Step 8):** "Projects sharing [Specific Feature, e.g., Soft Ground] experienced significantly higher overruns (Median: **A%**). This applies to our project."
  *   **Uncertainty & Limitations:** "Based on N=[Number] comparable projects. Estimate range reflects historical variance, not unique project risks. Smaller N increases uncertainty."
  *   **Bottom-Up Comparison:**
      *   "Bottom-Up Engineering Estimate: **BU%** Overrun."
      *   "Reference Class suggests [Higher/Lower/Similar] systemic risk than BU estimate."
      *   **Key Message:** "BU estimates often underestimate systemic risks captured in historical data (optimism bias, unanticipated complexities). RCF provides an evidence-based counterweight. Discrepancy of [Difference]% warrants scrutiny of BU assumptions, particularly regarding [mention relevant risk factor from Step 8 or Core Variables]."
  *   **Recommendation:** "Adopt Z% (80th Percentile) for contingency budgeting. Initiate specific risk mitigation for [Critical Risk Factor]."

  ---

  ### Running the Procedure: Three Cases

  1.  **Proposed Metro Line:**
      *   **Classes:** A (Urban Rail, Same GDP, Recent, N=12), B (Urban Rail, Same GDP, All Yrs, N=35), C (Urban Rail, All GDP, Recent, N=40), D (All Rail, Same GDP, Recent, N=18).
      *   **Prune:** Keep A, B, C. D too broad ("All Rail" mixes metro with HSR/freight).
      *   **Rank:** A (Best Exchangeability - controls GDP+Recent) > C (Recent) > B (GDP).
      *   **Small N?** A has N=12 (Fragile). Blend: A(50%): Median=22%, C(30%): Median=25%, B(20%): Median=18% → **Weighted Median = 21.8%**.
      *   **Bad News Feature?** Class A has high overruns linked to "PPP Procurement." *If* this project is PPP: Flag Critical Risk: "Metro PPPs in similar economies recently: Median Overrun=35%".
      *   **Result:** Report Weighted Median=22% (or 21.8%), Mean=25%, 80th%=32%. **Ministry Won't Like:** Likely higher than optimistic BU estimate. PPP warning is severe if applicable. Stress 80th%=32% for contingency.
      *   **BU Comparison:** "RCF median (22%) is [X]% higher than BU (15%). This gap reflects typical systemic risks in comparable metro projects."

  2.  **Fixed Bridge-and-Tunnel Link (Replacing Ferry):**
      *   **Classes:** "Major Fixed Coastal Links" (N=7: e.g., Øresund, Great Belt, Chunnel, Confed Bridge, Tacoma Narrows(New), Chesapeake Bay Bridge-Tunnel, Tokyo Bay Aqua-Line).
      *   **Prune/Rank:** Only one minimally defensible class (N=7 - Fragile). Exchangeability weak (varying tech, governance, eras) but best available.
      *   **Small N:** Use directly, emphasize uncertainty. Median Overrun=42%, Mean=55%, 80th%=85% (Chunnel effect).
      *   **Bad News Feature?** Class shows extreme overruns driven by "Unforeseen Seabed Conditions" (Chunnel, Øresund). *If* geotech risk exists: Flag Critical Risk.
      *   **Result:** Report Median=42%, but stress **80th%=85% is the planning benchmark** due to high risk and small sample. **Ministry Will Panic:** 85% overrun is politically explosive. Crucial to pair with rigorous geotech investigation/mitigation plan.
      *   **BU Comparison:** "RCF (Median 42%, 80th% 85%) vastly exceeds typical BU estimates (<20%). This reflects the extreme historical risks of megaprojects in this niche category."

  3.  **Rural Road Upgrade (Large Scale):**
      *   **Classes:** "Rural Road Upgrades" (N=500+). Too broad/highly variable.
      *   **Refine:** Filter by Core Variables. Prioritize:
          *   `Class A`: Similar Length Upgrade & Terrain Type (N=45). Median=8%.
          *   `Class B`: Similar Terrain + Scale (Total Cost Band) (N=30). Median=12%.
          *   `Class C`: All Large Rural Upgrades (Cost > $100M) (N=60). Median=15%.
      *   **Prune/Rank:** A (Specific Scale+Terrain) > B (Scale+Terrain) > C (Scale only). All N>30.
      *   **Bad News Feature?** Class C shows higher overruns for "Very Large" projects due to "Contractor Capacity Limits." *If* this is unusually large: Flag Critical Risk.
      *   **Result:** Use highest rank Class A (Median=8%, 80th%=15%). If Class C risk applies, report: "Projects above $X: Median Overrun=15%".
      *   **BU Comparison:** Likely close agreement (RCF Median 8% vs BU 10%). If not, RCF might reveal local optimism bias. "RCF confirms BU estimate range, but flags scale-related risks if present."

  ---

  ### What This Procedure Can and Cannot Do

  *   **Can:**
      *   **Discipline the Process:** Force explicit justification for class choices based on exchangeability, not just stories.
      *   **Structure Uncertainty:** Quantify and communicate the impact of sample size and class choice (via ranking/blending).
      *   **Highlight Critical Risks:** Identify specific, actionable threat multipliers from history.
      *   **Counter Optimism Bias:** Provide an empirical reality check against bottom-up estimates.
      *   **Be Done in a Day:** Uses simple spreadsheet functions (Filter, AVERAGE, MEDIAN, PERCENTILE.INC, basic arithmetic).
  *   **Cannot:**
      *   **Dissolve the Reference Class Problem:** No statistical procedure eliminates the fundamental need for *judgment* about exchangeability (Human Stops #1, #2, #3, #4). Philosophy confirms this is unavoidable. Different defensible classes will exist; this method structures the choice but doesn't make it objective.
      *   **Predict Unique Events:** Unprecedented projects (e.g., first hyperloop) remain highly uncertain.
      *   **Replace Project-Specific Risk Analysis:** RCF gives systemic risks; BU gives project-specific risks. Both are needed.
      *   **Guarantee Accuracy:** It provides a distribution of *historical* outcomes for *comparable* projects. Your project is unique.
      *   **Solve Data Gaps:** Poor data quality or missing Core Variables cripples RCF.

  **Final Honesty:** Reference class forecasting is a powerful tool for combating delusion in project appraisal, grounded in the philosophical insight that group-level historical data often provides a better prediction base than isolated, inside-view decomposition. However, it rests on the inherently subjective choice of a reference class deemed "exchangeable." This procedure makes that choice structured, transparent, and defensible, but it cannot render it purely objective. It replaces hidden bias with explicit, accountable judgment. Presenting the 80th percentile estimate alongside critical risk factors, especially when they clash with bottom-up optimism, is the most valuable service your unit can provide to the minister.
