  We are building a decision procedure grounded in the Szilard–Landauer–Bennett analysis of Maxwell's demon. The key points from the literature are:

  1. Szilard's engine: A thought experiment where a single molecule in a box is used to extract work. The demon measures which side the molecule is on, and then a piston is inserted and the molecule does work by expanding. It appears to extract kT ln 2 of work per cycle. However, the measurement and the subsequent reset of the demon's memory are critical.

  2. Landauer's principle: Erasing one bit of information in a memory at temperature T dissipates at least kT ln 2 of heat.

  3. Bennett's resolution: The measurement step can be done reversibly (without energy cost) but the erasure of the demon's memory is the step that must dissipate energy. Thus, the net work output over a full cycle (including reset) is zero or negative.

  4. Later refinements (like the second law under feedback control) introduce an information-theoretic perspective: the extractable work can be increased by an amount related to the mutual information between the system and the demon, but the total entropy production (including the information term) is non-negative. However, for the purpose of this procedure, we will rely on the Szilard–Landauer–Bennett (SLB) triad.

  The decision procedure is a checklist for patent examiners. It must be applied to each claim that purports to extract net work from a single heat bath. The goal is to determine if the claimed device violates the second law of thermodynamics as understood through the SLB analysis.

  **Decision Procedure Checklist**

  **Step 1: Identify the claimed energy flows.**
     - Look for: The specification must clearly state the energy inputs and outputs per cycle. In particular, it must account for the energy used by any sensor, actuator, or controller, and the net work output.
     - If the specification does not account for the energy used by the sensor and actuator, or if it claims that these components require no energy, then the application fails at this step.
     - Sufficient answer: The specification must quantify the energy used by the sensor and actuator per cycle, and the net work output must be calculated as the work extracted minus these energy inputs.
     - If the specification is silent on the energy for sensing/actuation, then the application is rejected for violating the second law (because it fails to account for a necessary energy cost). Output: Rejection (with boilerplate about perpetual motion, but now more specific: the device fails to account for the energy costs of measurement and control).

  **Step 2: Check for memory reset.**
     - Look for: The specification must address what happens to the measurement information after each cycle. In particular, it must either:
          (a) Explicitly state that the memory is erased (or reset to a standard state) at the end of each cycle, and account for the energy cost of that erasure, or
          (b) Provide a mechanism by which the memory is preserved without requiring erasure (which would require an infinite memory, which is impossible in a finite device) OR
          (c) Argue that the memory does not need to be erased because the device uses a reversible computation that does not require erasure (but note: even reversible computations may require resetting if the device is to run cyclically).
     - If the specification is silent about the memory, then the examiner must assume that the memory is reset at the end of each cycle (because cyclic operation requires the demon to be in the same initial state for the next cycle). The cost of erasure must then be accounted for.
     - Default for silence: The application is rejected because it fails to account for the energy cost of resetting the memory (Landauer's principle). However, if the applicant has accounted for the sensor energy but not the memory reset, then the rejection should state that the device fails to account for the Landauer cost of memory reset. Output: Rejection (unless the specification provides a sufficient argument for why memory reset is not needed, which is unlikely).
     - If the specification claims that the memory is not reset and is instead reused without erasure, then we must consider the memory size. If the memory is finite, then eventually it will fill up and require erasure. The device must then account for the amortized erasure cost per cycle. If the specification does not account for this, then it fails. Output: Rejection.

  **Step 3: Verify energy accounting for memory reset.**
     - If the specification does account for memory reset (erasure), then we must check that the energy cost for erasure per bit is at least kT ln 2 (where T is the temperature of the heat bath and k is Boltzmann's constant).
     - Look for: The specification must state the number of bits erased per cycle and the energy dissipated as heat during erasure. The dissipated heat must be at least (number of bits) * kT ln 2.
     - If the specification claims an erasure energy less than kT ln 2 per bit, then the application is rejected because it violates Landauer's principle. Output: Rejection.
     - If the specification claims an erasure energy exactly at or above kT ln 2 per bit, then proceed to Step 4.

  **Step 4: Check the overall energy balance.**
     - The net work output per cycle must be calculated as:
          Net work = Work extracted by the device (from the heat bath) 
                    - Energy used by the sensor and actuator (if any) 
                    - Energy used for erasure (if any, but note: erasure energy is dissipated as heat, so it doesn't go into work)
          However, note: the energy for erasure is dissipated as heat. The work extracted comes from the heat bath, but the erasure heat is also dumped into the bath? This leads to a critical point.

     - Important: The erasure heat must be dissipated. If the specification claims that the erasure heat is dumped back into the same heat bath that the device is drawing from, then we must account for the fact that this heat increases the entropy of the bath and thus reduces the available work.

     - The second law (in the context of a single heat bath) requires that the net work over a cycle must be non-positive. In the SLB analysis, the work extracted cannot exceed the energy input (if any) and the work that can be extracted by reducing the system's entropy (which is compensated by the entropy increase in the memory).

