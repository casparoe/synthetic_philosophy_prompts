prompt: |-
  I write a series of novels set in a northern mill town, and my recurring character Denise — retired jobcentre advisor, the one readers either love or write to me about saying she's "a bit much" — has become the moral barometre of the books, at least according to my editor. She's always judging people and readers track it. I'm plotting the next one and I need her to rule on two new cases, and I'm scared of getting her wrong after nine years of being consistent, so help me out here.

  Her track record so far, spread over four books: she quietly admires the single mum who does cash-in-hand cleaning on the side of her claim (calls it survival, not fraud, and gets shirty when anyone calls it fraud); she despises the able-bodied bloke who's turned down every scheme going and boasts about playing the system; she has zero time for the man caught exaggerating his back pain for disability; she goes to the local paper on behalf of a woman sanctioned for missing an apointment because her kid was in hospital; and she has genuine respect for the woman who gave up paid work to nurse her dying mother on carer's allowance. Oh, and when a wealthy landlord's tax avoidance comes up she just shrugs — not her department, apparently.

  The new cases. Case one: a claimant in his late twenties, perfectly able to work, who spends every waking hour training to swim the Channel — genuinely disciplined, up at 5am, eats like a monk — but it's all funded by benefits and he hasn't applied for a job in three years. Case two: a lad who skips his appointments out of pure laziness, gets a sanction that's obviously disproportionate, loses his flat over it, and washes up on Denise's doorstep.

  What I want from you, in British English, structured like this:

  'Her two verdicts' — about 200 words total on what she'd actually say or do in each case; use her voice if you like.
  'The candidate rules' — the two or three rules she might be running that fit everything in her track record, a short paragraph each, saying what each one predicts for the two new cases (I can see at least two rules that fit so far, there are probably more).
  'My best guess' — which rule Denise is really on and why, and be honest about the wiggle room.
  'The settling case' — the further case I should save for the book after this one that would actually split those rules apart, and what each rule predicts she'd do with it.

  Don't be precious about it, but I do want the reasoning visible — I can revise Denise's dialogue, but I can't revise a principle I never knew she had.
reasoning: |-
  Okay, let's tackle this. The user has a long-standing character, Denise, who serves as the moral compass in their novels. They need help determining how she'd judge two new cases based on her established track record. 

  First, I need to deeply understand Denise's existing judgments. She respects survival actions (like the single mum's cash-in-hand work) but despises blatant system abuse (the able-bodied bloat bragging). She intervenes when the system is unfair (the sanctioned mother) and admires sacrifice (the woman caring for her dying mother). The wealthy landlord's tax avoidance doesn't faze her - it's "not her department."

  The new cases present interesting tensions:
  - The Channel swimmer: disciplined but entirely benefits-funded, avoiding work
  - The lazy lad: irresponsible but crushed by disproportionate sanction

  Hmm... Denise's pattern suggests two possible core rules:
  1. The "Graft vs Grift" principle: Respects effort/survival, hates exploitation. Predicts disdain for swimmer (privileged choice), sympathy for lad (system overreach).
  2. The "System Fairness" principle: Focuses on institutional justice. Predicts neutrality toward swimmer (personal choice), outrage for lad (disproportionate punishment).

  For the verdicts, I lean toward Graft vs Grift as primary - it explains her shrug at tax avoidance (not direct exploitation) and her fury at sanction overreach. The swimmer's "hobby" would infuriate her as entitled, while the lad's punishment would trigger her protective instincts despite his laziness.

  The perfect test case? A middle-class claimant using benefits to retrain - Graft vs Grift might approve (self-improvement), System Fairness might reject (gaming the system). That'd force Denise to show her true colors.

  Better emphasize how her "not my department" stance on tax avoidance supports Graft vs Grift - she only judges claimants, not abstract inequality. And maybe note that the lad's case lets her condemn both his laziness AND the system's cruelty.
answer: |-
  **Her two verdicts**  
  *Case One (Channel Swimmer):*  
  Denise would sniff, arms folded. "Right. So he's treating the taxpayer like his personal sponsor? That's not graft, that's gall. Training's hard? Good. Try night shifts at the packing plant *and* raising weans. He could bag warehouse work tomorrow, fund his hobby proper. Using the dole as a training bursary while lads who'd kill for that job get nowt? That's taking the absolute piss. Don't care if he eats kale – he's stealing daylight." *(She'd likely report him anonymously if she knew specifics, or at least drop heavy hints to a Jobcentre manager about "reviewing commitments").*

  *Case Two (Lazy Lad Sanctioned):*  
  Her initial reaction would be sharp: "Skipping appointments? Bone idle. Made his bed." But hearing he lost his flat? Her jaw tightens. "Sanctioned into homelessness? Bloody jobsworths! Punishment should fit the crime, not flatten him. He's daft as a brush, but the system's meant to be a safety net, not a trapdoor." *(She'd grudgingly make him tea, then spend the afternoon on the phone: "Right, Sandra at Citizens Advice? It's Denise. Got a lad here, sanction's gone nuclear, needs a hardship payment appeal pronto. Yes, he *is* a numpty, but that's not the point...")*

  **The candidate rules**  
  1.  **The Graft vs. Grift Rule:** Denise respects *effort applied to survival or essential care*, despises *effort applied solely to exploiting the system or avoiding contribution*.  
      *Predictions:*  
      - Swimmer: **Despise.** His immense effort serves only personal ambition, funded by taxpayers he avoids joining. Pure grift.  
      - Lazy Lad: **Sympathy (eventually).** His initial laziness is grift, but the *system's response* becomes an existential threat demanding her protective graft instinct.

  2.  **The System Fairness Rule:** Denise judges individual actions *only* when they directly exploit claimants or pervert the system's *intended* safety net function. "Not her department" otherwise.  
      *Predictions:*  
      - Swimmer: **Neutral/Disdain.** His actions are personally contemptible but don't directly harm other claimants or break the system's core function. Might shrug ("His choice, daft sod").  
      - Lazy Lad: **Outrage.** The disproportionate sanction *is* a system failure, actively harming a claimant the safety net should catch. Demands intervention.

  3.  **The "My Patch" Rule:** Denise focuses fiercely on injustices *within* the claimant system she knows (fraud, unfair sanctions, DWP cruelty), ignoring wider societal issues like tax avoidance that feel abstract or outside her realm. Effort must be *necessity-driven*, not indulgent.  
      *Predictions:*  
      - Swimmer: **Despise.** Indulgence funded *by her system* = direct violation.  
      - Lazy Lad: **Intervene.** Sanction causing homelessness = core system failure on her patch.

  **My best guess**  
  Denise runs primarily on **The Graft vs. Grift Rule**, heavily filtered through **The "My Patch" Rule**.  
  *Why:* Her track record hinges on judging the *nature* and *purpose* of effort within the benefits sphere. Admiring survival/care effort and despising system-gaming effort is the clearest thread. The wealthy landlord shrug is key – it's grift, but *not* on benefits, so "not her patch." The swimmer's effort is monumental but entirely self-serving and funded *by the system she polices* – it's the ultimate grift on her patch. The lazy lad is initially grift, but the system's overreach transforms it into an *injustice against a claimant* that her graft-respecting/protective side *must* address, even while thinking him an idiot. **Wiggle Room:** The strength of her reaction to the sanction's severity pushes her towards System Fairness, but her core trigger is the *exploitation of the system's intent* (Graft/Grift) rather than abstract fairness.

  **The settling case**  
  **The Case:** A middle-aged claimant, made redundant, uses JSA *entirely* to fund a rigorous, self-directed retraining course in IT (coding bootcamp equivalent). They live frugally, attend all appointments, but openly state they won't apply for *any* jobs until the 6-month course is done, believing this investment guarantees better long-term employment/contribution. It's a calculated gamble using benefits as a bridge.  

  *Predictions based on the Rules:*  
  1.  **Graft vs. Grift:** **Admiration (qualified).** Huge effort applied to genuine self-improvement and future contribution. It's graft with a plan, not just survival. ("Smart. Using the system as a springboard. That's what it *should* be for.")  
  2.  **System Fairness:** **Disapproval/Neutral.** They are technically not meeting the immediate job search requirement, "gaming" the system for personal advancement, even if logical. Might warrant a sanction under strict rules. ("Clever, but bending the rules. Not how it's meant to work.")  
  3.  **"My Patch":** **Strong Admiration.** This is *exactly* the kind of proactive, effort-driven use of the system *within her world* that she'd champion against bureaucratic rigidity. Effort for future contribution = valid graft on her patch.

  This case splits Graft/Grift/"My Patch" (likely Admire) from System Fairness (likely Disapprove). Denise's verdict here would reveal if her core drive is rewarding *productive effort within the system* (even if rule-bending) or enforcing the *system's procedural fairness* above individual outcomes. Based on her history, I'd bet on Admiration.
