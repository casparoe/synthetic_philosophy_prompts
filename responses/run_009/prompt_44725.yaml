answer: |-
  Your observation is astute and cuts to the heart of a major critique of conceivability arguments like the philosophical zombie (p-zombie) thought experiment. While there isn't one universally agreed-upon *name* for the *specific inverse relation* you describe between grain of detail and the ease/stability of conceiving the absence of qualia (subjective experience), it's a well-recognized phenomenon discussed under several related concepts. Here's the breakdown:

  **Core Concepts & Literature:**

  1.  **The Explanatory Gap / Hard Problem of Consciousness (Levine, Chalmers):** Your observation highlights *why* this gap feels so hard to bridge. When you imagine the physical processes in fine detail (retina processing, motor cortex firing), you're confronting the fact that *we have no idea how or why* those processes *generate* subjective experience. Simply stipulating "no experience" feels like an arbitrary add-on precisely because the connection is missing in our understanding. The gap yawns widest at fine grain.
  2.  **The Phenomenal Concept Strategy (Loar, Papineau, Sturgeon):** This strategy argues that our *concepts* for phenomenal states (like "what it's like to see red") are fundamentally different in kind from our concepts for physical/functional states. When you conceive coarsely, you're using abstract physical/functional concepts alongside an abstract phenomenal negation. At fine grain, you're forced to use rich *phenomenal concepts* implicitly (because that's how we understand perception, pain, etc.), making it impossible to coherently *separate* the physical realization from the phenomenal character *within the conceptual framework of your imagination*. You can only *assert* the negation externally.
  3.  **Heterophenomenology vs. First-Person Perspective (Dennett):** Daniel Dennett is the most forceful critic here. He argues that *all* we ever have access to, even in our own case, is the "heterophenomenological" level – the third-person reportable aspects: behavior, functional organization, verbal reports. What you're calling the "coarse" description is really just this heterophenomenological description. When you try to add "fine-grained" physical detail, Dennett would argue you're *still* just adding more heterophenomenological detail (complex behavior, complex functional states). The "inner life" you feel you're adding implicitly or failing to negate is itself *just* a kind of internalized heterophenomenology – a user illusion. For Dennett, the p-zombie *is* conceivable at all grains *because* consciousness *just is* complex functional organization. Your struggle at fine grain reveals the incoherence (in his view) of positing something extra ("inner life") beyond the functional/physical.
  4.  **The Illusion of Distinctness / Conceptual Dualism (Papineau, Frankish):** David Papineau argues that our *concepts* for mental and physical states are distinct, leading to an *illusion* of metaphysical distinctness. Coarse conceiving leverages this conceptual distinctness easily. Fine-grained conceiving forces the identity (if physicalism is true) to become apparent, making the negation feel incoherent. Keith Frankish develops this into "illusionism" about consciousness.
  5.  **Kripke's Observation & Rigid Designators:** Your Kripke reference is spot on. His point about pain (trying to imagine C-fibers firing without pain and finding an "ersatz pain" sneaking in) is a specific instance of the general phenomenon you describe. He attributed it to the fact that "pain" rigidly designates the feeling itself, so any state physically identical to pain *is* pain. Your observation generalizes this beyond rigid designation to the *grain of description*.

  **Addressing Your Specific Questions:**

  *   **Does this inverse relation have a name?**
      Not one single, universally adopted term. It's most directly discussed under critiques of **conceivability arguments** based on the **explanatory gap** and the **phenomenal concept strategy**. You could accurately describe it as the **"Fading Qualia Conceivability Problem"** or the **"Grain-Dependence of Zombie Conceivability."**
  *   **Scope: Only Experiential Concepts?**
      **No, it applies more broadly, but is most pronounced with experiential concepts.** Consider your water example:
      *   **Coarse Grain:** "Imagine a clear, colorless, tasteless, thirst-quenching liquid that fills lakes and rivers... but it's not H₂O." Easy! You picture water and add a stipulation.
      *   **Fine Grain:** "Imagine molecules composed of 2 hydrogen atoms covalently bonded to 1 oxygen atom, forming a polar molecule with a specific bond angle, boiling point of 100°C at 1atm, solid density anomaly... but it's not H₂O." This becomes impossible or requires imagining a *different substance* with *different properties*. The stipulation fails because "water" rigidly designates H₂O, and imagining H₂O *is* imagining water. The key difference is that the **identity of water with H₂O is epistemically transparent** – we understand *how* the micro-structure explains the macro-properties. We lack this for consciousness (explanatory gap), making the negation seem *merely* stipulative at fine grain, even though it feels like it *should* be coherent.
  *   **Does this show the zombie argument's persuasive force depends on vagueness?**
      **Yes, absolutely.** This is a core criticism from physicalists (especially eliminativists/illusionists like Dennett and functionalists).
      *   **Critics' View (e.g., Dennett, Churchland):** The "easy conceivability" at coarse grain is an *illusion* created by relying on incomplete descriptions that omit the very physical/functional details that *constitute* consciousness. Fine-grained conceiving reveals the incoherence of separating "physics" from "inner life" because the inner life *is* (or is realized by) the physics. The argument only seems persuasive if you keep the description vague enough to hide the identity. The coarse description is the *wrong* level for the test.
      *   **Defenders' View (e.g., Chalmers):** Chalmers acknowledges the phenomenon but argues differently:
          1.  **Coarse is Sufficient:** He argues that conceivability at the coarse-grained, functional level *is* sufficient to establish metaphysical possibility. The fine-grained struggle is an *epistemic* limitation due to the explanatory gap, not a sign of metaphysical impossibility.
          2.  **Distinct Concepts:** The persistence of the phenomenal concept alongside the physical concept, even at fine grain, reflects a fundamental metaphysical distinction, not just a conceptual quirk. Our inability to "picture" the absence internally is because phenomenal properties are simple and irreducible.
          3.  **Epistemic vs. Metaphysical Possibility:** He distinguishes between what's conceivable (epistemically possible) and what's actually metaphysically possible. Coarse conceivability establishes epistemic possibility, which he argues (using 2D semantics) entails metaphysical possibility for the zombie scenario.

  **Which Reply is "Right"?**

  There is no philosophical consensus. The debate hinges on fundamental disagreements:

  1.  **Defenders (Chalmers):** "The coarse-grained conceivability *is* the valid test. The fine-grained struggle is irrelevant or reflects our epistemic limitations, not a flaw in the argument. Zombies are metaphysically possible."
  2.  **Critics - Illusionists/Strong Physicalists (Dennett, Frankish):** "The fine-grained case reveals the truth: the coarse conceivability is an illusion based on incomplete concepts/descriptions. Consciousness *just is* the fine-grained functional/physical organization. Zombies are inconceivable *when properly understood*."
  3.  **Critics - Milder Physicalists (e.g., Papineau, Block?):** "The conceivability at coarse grain stems from conceptual dualism, not metaphysical dualism. It shows we have distinct concepts, but not that they refer to distinct properties in the world. The fine-grained struggle is where the identity becomes apparent. Zombies are conceivable only in an epistemic sense, not a metaphysical one."

  **In summary:** You've identified a crucial and well-known challenge to conceivability arguments like the p-zombie. It's discussed under the banners of the Explanatory Gap, the Phenomenal Concept Strategy, and critiques by philosophers like Dennett and Papineau. While it lacks one perfect name, "grain-dependence of conceivability" or the "fading qualia problem in conceivability" captures it. It applies broadly but is most powerful with experiential concepts due to the explanatory gap. It strongly suggests the *rhetorical power* of the zombie argument relies on keeping the description coarse and vague. Whether this invalidates the argument entirely depends on your stance on the nature of consciousness and the link between conceivability and possibility.
