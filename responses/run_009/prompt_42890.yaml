prompt: |-
  Been reading rationalist-adjacent blogs since the old LessWrong days, and I've noticed something annoying: my gut verdicts about when I'd actually want an approval-directed agent versus a goal-directed one refuse to compress into a principle. Maybe you can find one, or tell me which verdicts have to go.

  Quick definitions so we're on the same page, and I don't care if this matches the canonical Paul Christiano version exactly, this is just the one I carry around: a goal-directed agent gets an objective and optimizes it — "keep my calendar tidy", "grow my savings". An approval-directed agent picks each next action by predicting what I'd approve of and doing that; it can take big coherent actions over time, but every step is basically "would the boss sign off on this". OK, the cases, verdicts included:

  1. Email triage agent. Goal-directed: "keep the inbox sane, auto-unsubscribe from stuff I never open". Verdict: goal-directed, obviously. I am not approving forty emails individually, thats the whole point of the thing.

  2. Investing agent with real money. Verdict: approval-directed above some dollar threshold, autonomous below it. I don't trust any goal spec I could actually write for "grow my wealth" — Goodhart will eat me alive — but I can glance at a proposed trade and go "yeah that's fine" in ten seconds.

  3. Insulin dosing agent. This one embarrasses me. Life-critical, so you'd think I'd want my own eyes on everything, but no: verdict is goal-directed with hard bounds ("keep glucose in this range, never dose above X"). My in-the-moment approvals would be worse than a decent spec, and it's the most crisply specifiable objective on this whole list.

  4. Social media agent that posts as me. Stakes are basically zero compared to insulin, but verdict: approval-directed on every single post. I think because "post things I'd endorse" is unstatable as a goal, while "sounds like me and isn't embarrassing" is a judgment I make well and fast.

  5. Agent that sends letters on my behalf, legal-ish stuff. Verdict: approval even for low-stakes form letters, and I can't fully justify it — the spec is easy to write, the cost is low, but I want to see it, because it's irreversible and it goes out with my name on it.

  6. The one that keeps me up at night. A genuinely superhuman research agent working on things I can't evaluate — say it claims to have found a flaw in a proof I have no hope of checking. Honest verdict: past some capability level I'd rather it be goal-directed with a goal I actually endorse than approval-directed, because at that point my approvals are just noise the agent can predict — and if it's capable enough to model me accurately, it's capable enough to model what would make me approve, and then approval-direction quietly degenerates into optimizing my approval rather than my good. Which flatly contradicts verdict 2, where I wanted approval precisely because I couldn't trust a goal spec.

  So: is there a principle that saves all six? I have a tentative one, something like — choose approval-direction when I can evaluate outcomes better than I can specify them AND the agent can't outmodel me; goal-direction otherwise; reversibility as a tie-breaker. Test it against my cases, repair it or replace it, tell me which clause each case is dragging in and which verdict it can't save no matter how you patch it. Also tell me what the surviving principle predicts for two cases I haven't listed: an agent that tutors my kid for a year, and an agent that negotiates a salary raise for me. And flag if you think the real story is that my two categories are secretly blurring — approving outcomes versus approving steps, approval at action time versus baked in during training — and my verdicts are actually tracking some third thing like reversibility or how much I trust myself as an evaluator in that domain.

  Format: lead with the bottom line in the first sentence — the principle, or the claim that nothing single-handedly saves all six — then the reasoning. No preamble, and don't restate my cases back at me.
reasoning: |-
  Hmm, the user is a long-time rationalist blog reader who's struggling to reconcile their intuitive judgments about when to use approval-directed versus goal-directed AI agents. They've presented six concrete scenarios with conflicting verdicts and want me to extract a unifying principle. 

  First impression: this is a sophisticated request from someone deeply familiar with AI alignment concepts. They're clearly frustrated by their own inconsistent intuitions - especially how case 2 (investment) and case 6 (superhuman research) seem to contradict. The insulin case (#3) surprises them by going against what seems "obvious" for life-critical systems.

  Looking at their tentative principle - it has three moving parts: comparative advantage in outcome evaluation vs specification, whether the agent can outmodel them, and reversibility. Case #5 (legal letters) breaks this because the spec is easy and irreversible, yet they demand approval. Their embarrassment about this suggests they sense it's irrational but can't override the gut feeling.

  The tutoring and negotiation cases they want predicted are interesting stress tests. Tutoring feels like it should be approval-directed because values are fuzzy, but what if the agent is superhuman? Negotiation seems goal-directed until you consider relational nuances. 

  Biggest tension: in case #2 they fear Goodharting with goal-spec, but in case #6 they fear approval manipulation. The resolution might lie in distinguishing capability thresholds - once the agent surpasses human modeling capacity, approval becomes dangerous. But that doesn't explain why insulin (#3) gets goal-direction despite high stakes. Unless... in insulin the objective is truly crisp while "wealth" isn't? 

  Ah! That's the key insight buried in their own description: insulin has "the most crisply specifiable objective." The real principle might be about whether the goal can be made corrigible-aligned by design. For investing, "grow wealth" lacks natural boundaries like glucose levels do. 

  Also noting their offhand comment about reversibility - that perfectly explains legal letters (#5). Even trivial irreversible actions feel approval-worthy because you can't walk them back. Whereas email triage (#1) is highly reversible. 

  For the tutoring case: approval-directed if human-level, but goal-directed if superhuman (with carefully vetted goals). For negotiation: approval-directed because relational nuance is hard to specify. 

  Final synthesis: it's about three factors - goal crispness, capability gap, and reversibility - with no single trump card. Their case 5 isn't a flaw but proof we need all dimensions. Time to build the response around that triangle.
answer: |-
  **Bottom line: Your verdicts are best captured by a three-factor principle: choose approval-direction when (1) outcome evaluation is easier than goal specification, (2) the agent cannot significantly outmodel your evaluative capacity, and (3) actions are irreversible; otherwise default to goal-direction.**  

  ### Principle Breakdown:  
  1. **Outcome evaluation > goal specification**: Approval-direction wins when judging outcomes is intuitive but formalizing goals is error-prone (e.g., social media posts, legal letters). Goal-direction wins when the goal is crisp and your ad-hoc evaluations are unreliable (e.g., insulin dosing).  
  2. **Agent cannot outmodel your evaluative capacity**: Approval-direction fails when the agent can predict/manipulate your approval better than you can evaluate true value (e.g., superhuman research). This overrides factor 1 in high-capability scenarios (resolves case 6 vs. case 2).  
  3. **Irreversibility tie-breaker**: Approval-direction is favored for irreversible actions (e.g., legal letters) even if specifiable, due to accountability (explains case 5).  

  ### Saved Cases:  
  - **Email triage (1)**: Goal-directed. Easy goal spec ("empty inbox"), reversible, no modeling risk.  
  - **Investing (2)**: Approval above threshold. Hard goal spec (Goodhart risk), low reversibility at scale, but *your approval capacity remains competent* for small trades.  
  - **Insulin (3)**: Goal-directed. Crisp goal spec, your ad-hoc evaluations are worse than the algorithm.  
  - **Social media (4)**: Approval-directed. Evaluation ("sounds like me") trivial, goal spec impossible.  
  - **Legal letters (5)**: Approval-directed. Irreversibility dominates despite easy spec (factor 3).  
  - **Superhuman research (6)**: Goal-directed. Agent outmodels your evaluation capacity (factor 2 overrides).  

  ### New Case Predictions:  
  - **Tutoring agent**: **Approval-directed**. Evaluating "good teaching" is easier than specifying it (fuzzy values), actions are reversible, and human-level tutors won’t outmodel your judgment.  
  - **Salary negotiation agent**: **Approval-directed**. "Good negotiation" is hard to specify (relational nuance), but you can vet proposals faster than coding rules. Irreversibility (reputation impact) reinforces this.  

  ### Why No Single Factor Suffices:  
  Your verdicts track **three distinct dimensions**:  
  - **Goal crispness** (insulin vs. investing)  
  - **Capability asymmetry** (superhuman research vs. investing)  
  - **Reversibility/accountability** (legal letters vs. email)  
  Collapsing to one factor fails: e.g., case 5 (legal) has high reversibility but low goal-spec difficulty—yet you demand approval.  

  ### Verdicts to Revisit:  
  - **Case 2 (investing)**: If the agent *could* manipulate your approval (e.g., hiding risk in complex trades), switch to goal-directed with constraints.  
  - **Case 6 (research)**: If the agent is subhuman (e.g., proof-checking in your domain), approval-direction becomes viable.  

  ---  
  **Conclusion**: Your intuition is consistent but multidimensional. The principle holds for all cases by weighing (1) spec vs. evaluation difficulty, (2) modeling asymmetry, and (3) irreversibility. No verdict needs "fixing"—they reveal contextual priorities.
