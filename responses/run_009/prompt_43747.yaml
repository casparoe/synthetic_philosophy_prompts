  The user might also be grappling with epistemological vs. metaphysical issues. We can talk about two spheres, but if they share all properties, can they be distinct? Leibniz would say no; distinctness requires some difference. The mirror analogy fails because it provides that difference artificially. Without it, the thought experiment might not hold, supporting Leibniz. 

