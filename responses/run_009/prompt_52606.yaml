  ## The Phantom Scale: Interpersonal Comparisons, the Experience Duplex, and the Ghost in the Utilitarian Machine

  The specter haunting utilitarianism is not merely the aggregation of preferences, but the prior specter of comparing them across individuals. Lionel Robbins’ canonical critique – that utilities, defined ordinally within an individual’s preference structure and invariant only up to positive affine transformations, possess no common unit or zero point – effectively banishes the dream of a universal, cardinal interpersonal utility scale. This prohibition, however, often feels like a formalistic sleight of hand when confronted with the persistent, seemingly meaningful, comparative judgments we make daily: "She is suffering more than he is enjoying," "The poor are worse off than the rich," "This loss devastates him more than that gain pleases her." The skeptic’s formal argument, powerful as it is, seems aimed at a target loftier than the claims we actually deploy. The task, then, is not merely to rehearse the impossibility of strong cardinal interpersonal utility (SCIU) – the kind needed to literally sum utilities across persons – but to dissect the anatomy of the comparisons we *do* make, understand what, if anything, grounds them, and confront the profound challenge posed by the “experience duplex.”

  **Degrees of Comparability: Beyond the Cardinal Straitjacket**

  Robbins’ argument conclusively demolishes SCIU. If my utility function U_A can be replaced by aU_A + b (a>0), and yours U_B by cU_B + d (c>0), without altering the representation of our *individual* choices, then any attempt to equate my "util" with yours, or to add my utils to yours, is mathematically arbitrary. There is no privileged way to align the scales. This is the formal death knell for naive Benthamite summation.

  But ordinary discourse rarely traffics in such strong claims. It operates with weaker, yet potent, forms of interpersonal comparison:

  1.  **Ordinal Level Comparisons:** "A is worse off than B." This asserts a *ranking* of welfare states across individuals, without claiming anything about the magnitude of the difference. It requires only that we can meaningfully say A's state falls below B's on some common welfare dimension.
  2.  **Interval Comparisons of Changes:** "The pain this causes A is greater than the pleasure it brings B." This compares the *sizes of welfare changes* experienced by different individuals. It doesn't require a common zero point (absolute levels of welfare), but it *does* require that the *units* of welfare change are comparable across persons – that a unit of utility gain or loss for A signifies the same welfare "distance" as a unit for B.

  The skeptic’s formal argument, strictly speaking, only directly forbids SCIU. It doesn't *inherently* rule out the possibility of establishing a common ordinal ranking or comparable units of change. The question is whether these weaker comparisons can be grounded without smuggling in the forbidden cardinal structure.

  **The Experience Duplex: Litmus Test for Meaning**

  Enter the thought experiment: the experience duplex. Imagine a device allowing person C to momentarily experience, at a standardized intensity, a veridical sample of what person A is feeling and what person B is feeling. Crucially, it delivers the *phenomenal character* of the experience, not just a description. After subjecting C to samples of A’s chronic pain and B’s baseline contentment, C reports, unequivocally and consistently across multiple observers, that A’s state is phenomenally worse than B’s. Or, C experiences a brief sample of the pain A would suffer from a proposed policy and the pleasure B would gain, and reports the negative experience as more intense (in a welfare-relevant sense) than the positive one.

  Does this settle the matter? The answer reveals a fundamental schism in our understanding of welfare.

  *   **The Phenomenal Realist Interpretation:** On this view, the duplex is the ideal instrument. "A is worse off than B" refers to an intrinsic, potentially measurable, property of their experiential states – the comparative *badness-for-the-subject* of those states. The duplex bypasses the noisy proxies of behavior, preference revelation, and verbal report, delivering direct phenomenal access. If the duplex reliably generates intersubjective agreement among users about cross-personal welfare rankings or the comparative magnitude of changes (e.g., "That loss-sample *felt* much worse than that gain-sample felt good"), this strongly suggests it *is* tracking an objective feature of experience. Our ordinary judgments are imperfect, empathy-based attempts to approximate what the duplex reveals directly. The formal invariance argument becomes irrelevant; it shows the limitations of *preference-based* utility representations, not the non-existence of a phenomenal welfare dimension the duplex accesses. Comparisons are possible because they latch onto this shared experiential reality. The duplex doesn't just *inform* our judgment; it *validates* the very concept the judgment is trying to capture.
  *   **The Functionalist/Pragmatist Interpretation:** Here, the duplex is fascinating but ultimately irrelevant. "A is worse off than B" is not primarily a report about intrinsic phenomenal states. Its meaning is constituted by its *role* in our social and deliberative practices. It licenses certain actions: prioritizing A for aid, allocating resources towards A, justifying policies that benefit A at B's expense. To say "the tax hurts the poor more than it helps the rich" functions as a condensed normative argument about distributional fairness and desert, invoking shared norms or empathetic concern, not a discovery of psychic arithmetic. Even if the duplex produced universal agreement, that agreement wouldn't settle the *meaning* of "worse off"; it would merely provide a new input (intense empathetic experience) into our existing normative practices. The skeptic argues that the formal invariance reveals the *conceptual* emptiness of interpersonal utility comparisons *within the framework of preference-based choice theory*. The duplex, by shifting to phenomenology, changes the subject. But if welfare economics and utilitarian calculus are grounded in preferences (revealed or idealized), then phenomenal comparisons, however compelling subjectively, remain outside the relevant conceptual domain. The meaning of "worse off" is fixed by how we *use* it to coordinate action, deliberate morally, or express concern – functions untouched by the duplex’s phenomenal readout.

  **The Skeptic's Burden: Explaining the Pervasiveness of Error**

  The formal argument combined with the functionalist view of meaning leaves the skeptic with a significant burden: explaining the ubiquity and apparent meaningfulness of interpersonal comparisons in ordinary life, policy, and even ethical theory. If such comparisons are truly nonsensical, why do they persist so stubbornly? The skeptic must offer an error theory or a reinterpretation. Several paths exist:

  1.  **Expression of Empathy or Concern:** Uttering "She suffers more" is primarily an expression of deep empathetic identification or moral concern for her plight, not an objective claim. It’s akin to saying "My heart goes out to her." The duplex might amplify this empathetic response, but it doesn't convert an expression into a fact-stating proposition.
  2.  **Disguised Normative Claims:** Comparative welfare statements are often shorthand for normative judgments smuggled in as facts. "The poor are worse off" really means "We *ought* to prioritize helping the poor based on principles X, Y, Z (need, equality, desert)." "This loss hurts A more than the gain helps B" means "Given our values, the harm to A *outweighs* the benefit to B." The formal impossibility shields the underlying normative commitment from empirical falsification, which is precisely its rhetorical power.
  3.  **Coordination Devices:** Such comparisons serve as focal points for coordinating action in situations of uncertainty or conflicting interests. Triage nurses using apparent suffering levels to prioritize treatment isn't claiming metaphysical comparability; they are using observable proxies (moans, pallor, vital signs) as practical heuristics under pressure, grounded in shared biological understandings and the imperative to act. "Your brother wanted it more" functions to resolve sibling disputes peacefully, appealing to a shared family understanding of desire intensity, not a universal utility metric.
  4.  **Intrapersonal Projection:** We project our *own* scales onto others. When I say "That injury must hurt him terribly," I imagine how it would feel *to me* and project that intensity onto him. The duplex might reveal this projection is sometimes wildly inaccurate, but even when accurate, it only tells me how *I* would experience being him, not that our scales are objectively aligned. It confirms empathy, not comparability.

  **Verdict: The Duplex Matters, But Not Enough for Utilitarianism**

  Having weighed the arguments, I land decisively on the significance of the duplex. Its hypothetical operation strongly supports the phenomenal realist interpretation of weaker interpersonal comparisons. If the duplex reliably generated intersubjective agreement about ordinal levels ("A's state feels worse than B's") or even interval comparisons of changes ("The loss-sample for A felt more intensely negative than the gain-sample for B felt positive"), this would constitute compelling evidence that there *is* an intrinsic, phenomenally grounded dimension of welfare that we can, in principle, compare across individuals. Our ordinary judgments, while fallible and influenced by functional roles and norms, are indeed best understood as attempts (however indirect) to track this underlying experiential reality. The Robbinsian formal argument demonstrates the limitations of *preference-based utility representations* for capturing this dimension in a way permitting SCIU, but it does not prove the non-existence or fundamental incomparability of the phenomenal states themselves. The duplex bypasses the representational problem by offering direct phenomenal access.

  Therefore, **ordinal level comparisons ("A is worse off than B") and, potentially, interval comparisons of changes ("A's loss is bigger than B's gain") are meaningful and potentially knowable**, grounded in the intrinsic qualities of conscious experience accessible, in principle, through something like the duplex. Our everyday practices of triage, parenting, and distributional judgment often successfully approximate this phenomenal reality, even if imperfectly and mixed with normative and functional elements.

  However, this realism about weaker comparisons **does not rescue strong cardinal interpersonal utility or classical utilitarianism.** The leap from "A's loss feels bigger than B's gain" to "Therefore, the aggregate utility change is negative" requires precisely the forbidden step: assuming that the phenomenal intensity units across individuals can be placed on a common linear scale with a common zero point, allowing direct summation. Knowing that loss L_A > gain G_B phenomenally does *not* tell us that U_A(-L_A) + U_B(+G_B) < 0. It tells us the *magnitude* of A's negative change exceeds the *magnitude* of B's positive change *on their respective scales*. To sum them, we need to know *how much* U_A decreases per unit of phenomenal loss and *how much* U_B increases per unit of phenomenal gain, *and* that these rates are comparable across individuals – that a "unit" of phenomenal loss for A translates to the same utility decrement as a "unit" of phenomenal loss for B. The duplex, even if it confirmed comparable phenomenal magnitudes, provides no access to this crucial mapping function from phenomenal intensity to the utility scales used in preference representation and social choice. This mapping remains inherently individual and, critically, subject to the positive affine transformation that breaks cardinal comparability. We might know the phenomenal "size" of the changes, but we cannot know how they *weight* into the utility functions that drive choices and would be summed by a utilitarian.

  Thus, the experience duplex illuminates the plausibility of grounding weaker, phenomenally anchored interpersonal comparisons. It validates the core intuition behind our everyday judgments of relative suffering and the differential impact of changes. However, it shines this light only to reveal the deeper, perhaps insurmountable, chasm that remains: the gap between shared phenomenal intensity and the individualized, formally incomparable utility functions required for the utilitarian calculus of summation. We can meaningfully say she is worse off, and even that her loss cuts deeper than his gain. But we cannot, even in principle, plug those judgments into the Benthamite adding machine and get a non-arbitrary result. The phantom scale of interpersonal utility, glimpsed through the duplex, remains a ghost – real enough to haunt our moral intuitions, but too ethereal to bear the weight of utilitarian aggregation.
