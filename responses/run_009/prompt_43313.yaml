  What both miss: Daniel misses the information constraint; Priya misses that the optimal randomized strategy is self-reinforcing with consistent beliefs. The key is that from ex-ante, the driver chooses a strategy that, given the imperfect recall, leads to beliefs that make the strategy optimal at each point, achieving consistency.

  So in this puzzle, randomization with p=2/3 is the solution.
