prompt: |-
  My friend Maya and I got into a giant argument on saturday about what actually makes something a genocide, and she rattled off a bunch of verdicts like she was just reading them off some internal checklist. I'm trying to figure out whether her positions even form one consistent rule or whether she's just vibes-ing it, so let me list her track record and you tell me what's going on.

  Her verdicts so far: the Holocaust, obviously genocide. Rwanda in '94, genocide. The Khmer Rouge wiping out something like a quarter of Cambodia, including going after urban people and intellectuals as a class — NOT genocide, she was really firm on that, because political and social classes aren't the kind of group genocide is about, so that's just mass crimes against humanity. ISIS and the Yazidis — genocide, and notably she counted the sexual slavery and forced conversions as part of it, not just the killings. The Holodomor — genocide. And here's the one that surprised me: Canada's residential schools and the forced removal of Indigenous kids into adoptive white families — she said YES, genocide, even though there was no mass killing, because the point was that the group would eventually stop existing as a group. But then I threw a made-up case at her, a state that bans a minority's language, burns its books, makes everyone use new names, but otherwise leaves families and communities physically alone to gradually assimilate, and she said no, that's oppression but not genocide.

  So now we have this new case and I want to predict her answer before I see her again. A country blockades a minority region — cuts fuel, water, medicine, food shipments — and the officials are honestly pretty open about it: they say the goal is for the minority to give up, disperse across the country, and quote dissolve into the general population. They deny wanting anyone dead and a lot of people do die, but the leadership seems genuinely to expect the deaths as an acceptable side effect of breaking the region.

  Genocide or not, by her lights? I can see at least two different rules that fit everything she's said so far, and I suspect they give different answers here. What do you think she's running, what's your best guess and why, and what case should I hit her with next that would actually force her to pick between those rules?
reasoning: |-
  Okay, the user is trying to figure out their friend Maya's reasoning on what constitutes genocide. They've provided several examples where Maya gave verdicts and now want to predict her response to a new scenario involving a blockade meant to force assimilation, with deadly side effects. 

  First, I need to map Maya's pattern. Holocaust and Rwanda are straightforward genocides under legal definitions. Her rejection of Cambodia as genocide because it targeted political/social classes aligns with the UN Genocide Convention's focus on protected groups (national, ethnic, racial, religious). 

  The Yazidi case is interesting—she included sexual slavery and forced conversions. That suggests she's applying Article II(b) and (c) of the Convention (causing serious harm, preventing births). The residential schools case confirms this: she sees cultural destruction aimed at group elimination as genocide, likely referencing Article II(e) (forcibly transferring children). 

  But her rejection of the language-ban scenario reveals a limit: she requires the *physical destruction or dispersal* of the group, not just cultural suppression. The blockade case sits right on this edge. The stated goal is dispersal/dissolution (like residential schools), but the method is indirect death via deprivation. 

  Two possible rules emerge: 
  1. **Direct group-destruction intent**: Genocide requires intent to physically eliminate the group (killing, birth prevention, child transfer). The blockade's deaths are "side effects," so maybe not. 
  2. **Foreseeable annihilation as genocidal**: If the method unavoidably causes mass death to achieve group dissolution, it crosses the line. 

  I think Maya leans toward #2. She accepted Holodomor (starvation as weapon) and residential schools (system causing mass death through neglect). The blockade is similar: cutting essentials predictably kills. Plus, officials admit wanting the group gone. 

  To force a choice, I'd propose a case with *non-lethal* forced dissolution: say, bribing minority families to relocate individually with no violence. If she calls it genocide, she prioritizes intent over method. If not, she requires physical destruction. That cracks her code.
answer: |-
  Based on Maya's pattern of verdicts, here's a breakdown of her likely reasoning, the prediction for your new case, and the critical test case you need:

  ## Decoding Maya's Genocide Framework

  1.  **The Core Rule:** Maya is applying a strict interpretation of the **UN Genocide Convention (1948)**, particularly focusing on the **specific intent ("intent to destroy")** and the **protected groups**.
  2.  **Protected Groups (The "Who"):** She limits genocide to actions targeting groups defined by **national, ethnic, racial, or religious** identity. She explicitly excludes political or social classes (Khmer Rouge victims).
  3.  **Destructive Acts (The "How"):** She includes the *full list* of acts under Article II of the Convention, not just killing:
      *   **Killing members (a):** Holocaust, Rwanda, Yazidis, Holodomor.
      *   **Causing serious bodily/mental harm (b):** Yazidi sexual slavery/forced conversions, Residential Schools (systemic abuse, trauma).
      *   **Deliberately inflicting conditions to destroy physically (c):** Holodomor (starvation), *crucially* also Residential Schools (conditions causing death/disease).
      *   **Preventing births (d):** Implicit in forced sterilization policies (not mentioned, but fits pattern).
      *   **Forcibly transferring children (e):** Key to her Residential Schools verdict. This is the act that distinguishes it from your made-up cultural suppression case.
  4.  **Specific Intent (The "Why"):** This is paramount. The perpetrator must have the **intent to destroy the group, in whole or in part, *as such***. This intent can be proven by words or deeds demonstrating the goal is the destruction of the group itself.
      *   **Her "No" on Cultural Suppression Alone:** Your made-up case (banning language, books, names) lacks the *specific acts* listed in Article II *and* likely lacks the specific intent for *physical* destruction/transfer. She sees it as oppression/ethnocide, not genocide under the Convention's legal definition.
      *   **Her "Yes" on Residential Schools:** The *combination* of **forcibly transferring children (e)** with the **conditions causing serious harm/death (b/c)** and the **stated/intended outcome (destruction of the group *as a group*)** meets the threshold. The *intent* is the group's destruction via assimilation/biological absorption, achieved through Convention-listed acts.

  ## Prediction for the Blockade Case: YES, Genocide (by Maya's lights)

  *   **Why?**
      *   **Targeted Group:** A minority region implies a national, ethnic, racial, or religious group.
      *   **Acts:** Cutting off essentials (food, water, medicine) constitutes **"deliberately inflicting conditions of life calculated to bring about its physical destruction in whole or in part" (Article IIc)**. The officials admit this is the *method*.
      *   **Intent:** The officials explicitly state the **intent: "dissolve into the general population"**. This is the specific **intent to destroy the group *as such***. While they deny wanting deaths, they *foresee* them as "acceptable." This admission reveals the intent to destroy the group *as a group* through forced dispersal and assimilation.
      *   **Alignment with Precedents:**
          *   **Holodomor:** Deliberate starvation policy targeting a group (ethnic/national Ukrainians) -> Genocide.
          *   **Residential Schools:** Deliberate policy inflicting conditions causing death/disease and forcibly transferring children to destroy the group -> Genocide.
          *   **Blockade:** Deliberate policy inflicting conditions causing death/disease to force dispersal/destruction of the group -> Fits the same pattern perfectly.

  ## The Two Rules & How They Split

  1.  **Rule A (Strict Article II Acts + Group Destruction Intent):** Genocide requires one of the five listed acts (a-e) *and* specific intent to destroy the group physically or biologically. This fits *all* her past verdicts. **Blockade Prediction: YES** (Act IIc + Intent).
  2.  **Rule B (Physical/Biological Destruction Intent + Direct Causal Mechanism):** Genocide requires specific intent for physical/biological destruction *and* that the *primary mechanism* employed is one directly causing death or preventing births (Acts a, c, d), not primarily cultural suppression or indirect methods like child transfer. Child transfer (e) is accepted *because* it's listed, but its inclusion already slightly strains this rule. **Blockade Prediction: MAYBE NO?** (Intent is clear, but primary mechanism is dispersal via deprivation; deaths are "side effects" even if foreseen). Under this stricter interpretation, she *might* argue the *primary* method is forced displacement/dissolution (not explicitly listed as an act), with death as a consequence, rather than imposing conditions *specifically calculated* to cause death as the *primary tool* of destruction.

  ## Why Rule A is More Likely & Why the Blockade is a "Yes"

  *   Maya accepted Residential Schools based *heavily* on Article II(e) (child transfer). This act is fundamentally about *indirect destruction through assimilation*, not primarily direct killing. This shows she accepts indirect methods listed in the Convention.
  *   She accepted the Holodomor, where the primary mechanism was starvation (IIc) – identical to the blockade.
  *   She accepted the *conditions* in Residential Schools as part of the genocide (IIb/c), even if the *stated goal* was assimilation, not direct killing. The blockade is analogous.
  *   The officials' statements provide clear evidence of intent to destroy the group *as such* via a Convention-listed act (IIc).

  ## The Critical Test Case to Force the Choice

  To distinguish definitively between Rule A (her likely framework) and Rule B, propose this scenario:

  **The "Non-Lethal Dissolution" Case:**
  A state systematically and forcibly relocates members of a distinct ethnic minority group. Families are broken up and resettled individually, far apart, across the dominant population. They are compelled to adopt the dominant language/culture under threat of severe punishment (e.g., long prison sentences for speaking their language, practicing religion, or gathering as a group). However, the state provides adequate food, water, shelter, and medical care during and after relocation. No one dies from the state's actions, and birth rates aren't forcibly suppressed. The stated intent is identical to the blockade case: "dissolution into the general population" and the destruction of the group *as a group*.

  *   **Rule A (Likely Maya) Prediction: NO Genocide.**
      *   *Why?* The acts are severe oppression, cultural destruction, and forced assimilation, but they *do not* constitute one of the five listed acts in Article II:
          *   No killing (a)
          *   No serious bodily/mental harm *in the Convention sense* (likely argued; prison for cultural acts is persecution, but not necessarily causing the *level* of harm envisioned by IIb as part of genocide).
          *   No inflicting destructive conditions (c) – basic needs met.
          *   No preventing births (d).
          *   No *forcible transfer of children* (e) – entire families/individual adults are relocated. II(e) is specifically about *children*.
      *   While the *intent* is the destruction of the group, the *means* are not Convention-listed acts. This remains severe cultural persecution/crimes against humanity, but not genocide under her strict Convention interpretation.
  *   **Rule B Prediction: NO Genocide (but for a different reason).** Rule B would also say no, but because the primary mechanism is cultural suppression and forced dispersal *without* mass death or direct physical destruction methods, even though the intent is group destruction.

  **Why this test case forces the choice:**

  *   It isolates the **"forcible transfer of children" (IIe)** element that was crucial in the Residential Schools verdict. Here, *only adults or whole families* are relocated.
  *   It removes the lethal conditions (IIc) present in Residential Schools, Holodomor, and your Blockade case.
  *   It has the *same stated intent for group destruction* as the Blockade and Residential Schools cases.
  *   **The Key Question for Maya:** If the *only* act is forced dispersal and assimilation of the *entire population* (not just children) under threat of punishment for cultural practices, *without* causing death/disease/starvation or forcibly transferring *specifically children*, does this constitute genocide under Article II? Specifically, does it fall under IIb ("Causing serious bodily or mental harm") or is it outside the Convention?
      *   If she says **NO** (as predicted under Rule A), she confirms her strict adherence to the listed acts in the Convention. The Blockade case is genocide *because* it used IIc.
      *   If she says **YES**, then she's interpreting IIb ("serious mental harm") *extremely* broadly to encompass the trauma of forced relocation and cultural suppression *alone* as a genocidal act, even without physical violence, lethal conditions, or child transfer. This would be a significant expansion beyond her previous reasoning and the typical application of the Convention, and would make her verdict on your made-up cultural suppression case (banning language/names) less consistent, as that also causes mental harm.

  Based on her firm rejection of your made-up cultural suppression case and her reliance on specific Convention acts (especially IIe for Residential Schools and IIc for Holodomor), **I strongly predict she will say NO to this "Non-Lethal Dissolution" case**, confirming Rule A (Strict Convention Acts + Intent) as her framework. Therefore, your Blockade case is a clear **YES** for her. Present the "Non-Lethal Dissolution" case to confirm this. Good luck!
