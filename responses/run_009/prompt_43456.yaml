prompt: |-
  I'm a history PhD student and the theory chapter of my thesis is supposed to justify my approach to explaining why the Soviet Union collapsed, but before I commit to anything I want the spec a causal explanation of a historical event actually has to meet. I'm less interested in the USSR case itself than in the general requirements, so use whatever cases make each requirement vivid (the outbreak of WWI works, so does the Reformation, whatever else fits).

  Write me the desiderata list. For context, here's what I think the hard parts are:

  - overdetermination. In the July 1914 crisis it's plausible that even without Sarajevo, the alliance structure, the naval race and the mobilization timetables would have produced a general European war within a decade anyway — and also plausible that the alliance structure alone wasn't enough and it took the assassination. Any theory I use has to say something about cases where multiple putative causes are each close to sufficient on their own, and about the "close to" doing alot of the work there.
  - absences. Half of what historians cite as causes are non-events: the intelligence wasnt shared, the warning went unread, the emperor didnt send for the minister. A spec that can't count omissions as causes can't cover the actual practice of my discipline.
  - the "why then" question vs. the "why at all" question. The French Revolution might have been coming for a century, so is an explanation of 1789 supposed to explain that it happened, or that it happened when it happened? The two answers point at different causes and I need the spec to keep them seperate instead of mashing them together.
  - what I've been calling crowding-out. At some point adding another long-term cause stops adding information. I'd want the spec to say something principled about when a cause has earned its place, since "list everything since 1815" is not an explanation.

  Behind each requirement, give the case or consideration that motivates it, and be explicit about which are non-negotiable and which are just what one school of historians happens to like — I suspect the demand to rank causes in order of importance is the second kind, and I'd like to hear whether you agree. And the thing I most want: tell me if some subset of the requirements is jointly unsatisfiable. I have a suspicion you can't simultaneously handle overdetermination properly, honour the but-for intuition wherever it does apply, and keep single dated events as the things being explained, but I can't prove it. If some requirement quietly knocks out the standard approaches historians actually use — narrative plus implicit but-for reasoning, or the "deep causes vs. proximate causes" two-layer picture everyone reaches for — say which one does the knocking out.

  Don't suggest readings, I have a supervisor for that.
reasoning: |-
  Okay, the user is a history PhD student working on their thesis theory chapter. They need a set of specifications for causal explanations of historical events. Let me unpack their main concerns.

  The key challenges they mentioned:
  - Overdetermination (multiple near-sufficient causes)
  - Accounting for absences/non-events as causes
  - Distinguishing "why at all" from "why then" explanations
  - Crowding-out (when additional causes add no information)

  They want these specifications grounded in historical cases, with clear distinctions between essential requirements and disciplinary preferences. The critical part is assessing if some requirements conflict, especially regarding overdetermination, but-for causality, and event dating.

  I should start by identifying core philosophical requirements. The absences-as-causes point seems non-negotiable since historians routinely cite omissions. Overdetermination handling also appears essential given cases like WWI outbreak. The why-at-all vs why-then distinction feels fundamental too - these explain different aspects.

  For disciplinary preferences, the ranking of causes by importance seems optional. Historians debate this, but it's not inherent to causal explanation. The deep/proximate causes framework might be useful but has limitations with overdetermination.

  Now the possible conflict: Maintaining but-for tests while handling overdetermination and precise dating seems tricky. In overdetermined cases like WWI, there's no single but-for cause. Yet historians still point to specific events like the Sarajevo assassination. The solution might be to treat but-for as sufficient but not necessary, and use causal fields to handle timing.

  I'll structure specifications with:
  1) Core requirements (must-haves)
  2) Handling strategies for each challenge
  3) Compatibility analysis
  4) Framework limitations

  The user's suspicion about conflicts seems valid - traditional narrative and deep/proximate models struggle with overdetermination. But we can propose refinements like causal fields and INUS conditions to preserve explanatory power without abandoning key historical practices.
answer: |-
  Here’s a desiderata list for causal explanations in history, grounded in your concerns and explicit about constraints. Cases illustrate each requirement, with non-negotiables marked **(NN)** and disciplinary preferences marked **(Pref)**. A compatibility analysis follows.

  ---

  ### **Core Desiderata for Causal Explanations**  
  1. **Handles Overdetermination**  
     - **Motivation**: WWI (1914). The war was overdetermined: Balkan tensions, alliance rigidity, militarism, and the July Crisis *each* plausibly sufficient for *a* war. But the *specific* August 1914 war required the assassination + German "blank check."  
     - **Requirement**: The explanation must distinguish:  
       - **Sufficient-but-redundant causes** (e.g., "war was inevitable by 1914 due to arms races").  
       - **Actualizing triggers** (e.g., "Sarajevo activated contingency plans").  
     - **Status**: **(NN)** – Overdetermination is pervasive (e.g., Reformation: printing press + corruption + Luther; USSR collapse: economic decay + nationalism + Gorbachev’s reforms).  

  2. **Counts Absences as Causes**  
     - **Motivation**: Pearl Harbor (1941). U.S. intelligence failures (unread warnings, unshared intercepts) were critical absences. Similarly, USSR collapse: Gorbachev *not* crushing separatists early.  
     - **Requirement**: Explanations must accommodate *causally relevant omissions* (e.g., "the emperor *not* recalling Bismarck after 1890 weakened German diplomacy").  
     - **Status**: **(NN)** – Absences are empirically indispensable in historical narratives.  

  3. **Distinguishes "Why at All" from "Why Then"**  
     - **Motivation**: French Revolution (1789). "Why at all?" points to structural causes (absolutist crisis, Enlightenment ideas). "Why then?" points to triggers (1788 famine, financial collapse, Estates-General deadlock).  
     - **Requirement**: Explicitly separate:  
       - **Necessary/preconditions** (enable the event).  
       - **Sufficient/triggers** (timing/actualization).  
     - **Status**: **(NN)** – Conflating these obscures causality (e.g., explaining the *timing* of the Reformation without Wittenberg’s indulgence controversy).  

  4. **Resists Crowding-Out with Principled Inclusion**  
     - **Motivation**: Citing every pre-1914 European tension for WWI adds noise, not insight. Similarly, listing all Soviet economic flaws since 1970 for 1991 collapse.  
     - **Requirement**: A cause earns inclusion if:  
       - It is **INUS** (Insufficient but Necessary part of an Unnecessary but Sufficient condition; e.g., "Franco-Russian Alliance was necessary for the *specific* two-front war Germany feared").  
       - Removing it **changes the narrative materially** (e.g., omitting Luther’s excommunication obscures the Reformation’s institutional break).  
     - **Status**: **(NN)** – Without this, explanations become arbitrary lists.  

  ---

  ### **Disciplinary Preferences (Not Core Requirements)**  
  5. **Ranks Causes by Importance**  
     - **Motivation**: Debates over whether WWI was caused by "sleepwalking" elites (Ferguson) vs. systemic pressures (Kennedy).  
     - **Requirement**: *Optional* weighting (e.g., "alliance systems > mobilization plans in explaining escalation").  
     - **Status**: **(Pref)** – Importance is interpretive; one historian’s "deep cause" is another’s background noise. *You’re right to suspect this is school-dependent*.  

  6. **Uses Proximate/Deep Cause Frameworks**  
     - **Motivation**: Standard heuristic (e.g., "deep cause": USSR economic stagnation; "proximate": August 1991 coup attempt).  
     - **Requirement**: *Optional* – but must avoid **conflating timescales** (e.g., labeling "nationalism" as a "deep cause" for 1991 USSR collapse ignores its *activation* by Glasnost).  
     - **Status**: **(Pref)** – Useful pedagogically but risks oversimplifying overdetermination.  

  ---

  ### **Compatibility Analysis: Tensions and Trade-offs**  
  #### **The Suspected Conflict**  
  > *"Can we handle overdetermination, preserve but-for intuition, and explain single dated events?"*  

  - **The Problem**:  
    - **But-for intuition** demands counterfactuals (e.g., "but for Sarajevo, WWI wouldn’t have started *in August 1914*").  
    - **Overdetermination** undermines but-for: If war was inevitable by 1916, Sarajevo wasn’t strictly necessary.  
    - **Single-event dating** requires explaining why it happened *then*, not just why it happened.  

  - **Resolution**:  
    - **But-for applies to specificity, not occurrence**. Sarajevo was but-for for *August 1914 war* but not for *a general war by 1918*.  
    - **Causal fields** clarify: Define the event tightly (e.g., "WWI starting August 3, 1914") to salvage but-for for triggers.  
    - **Trade-off**: But-for remains useful for *preventable* absences (e.g., "but for unheeded warnings, Pearl Harbor might not have happened *on Dec. 7*"), but not for structural overdetermination.  

  #### **What Knocks Out Standard Approaches?**  
  - **Narrative + Implicit But-For**: Fails on overdetermination (e.g., cannot explain why Sarajevo "mattered" if war was coming anyway).  
  - **Deep/Proximate Frameworks**: Struggles with absences (e.g., is "Stalin’s *failure* to reform" a deep or proximate cause for USSR collapse?) and crowds out INUS conditions.  

  #### **Joint Satisfiability?**  
  Yes, **if**:  
  1. **Event definition is precise** (e.g., "Soviet collapse on December 26, 1991" vs. "Soviet collapse in 1991").  
  2. **Causes are contextualized within causal fields** (e.g., "Given the pre-1991 tensions, X omission was necessary for the December timing").  
  3. **Overdetermination is handled via INUS logic** (e.g., "Gorbachev’s reforms were an INUS condition for the 1991 breakup: necessary for *that specific outcome*, but insufficient without nationalism").  

  ---

  ### **Summary of Non-Negotiables**  
  Your theory must:  
  1. Address overdetermination (**NN1**).  
  2. Treat absences as causes (**NN2**).  
  3. Separate "why at all" from "why then" (**NN3**).  
  4. Exclude non-INUS/non-material causes (**NN4**).  

  *Ranking causes* is optional **(Pref)**. The deep/proximate model is *usable but risky* under overdetermination. **But-for reasoning survives only for tightly defined events and preventable absences** – elsewhere, INUS does the heavy lifting. This preserves compatibility with historical practice while avoiding fatal contradictions.
