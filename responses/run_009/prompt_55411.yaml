  What they're really asking for isn't a solution (they know none exists) but a taxonomy of the disagreement. They want to understand why it persists and whether that persistence is legitimate. The request for an "honest diagnosis I don't like" suggests they suspect this might be a permanently open question - and they're prepared to accept that, however unsatisfying. 

