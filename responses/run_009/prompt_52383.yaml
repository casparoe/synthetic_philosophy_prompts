  Hmm, the user is an ethics professor teaching a seminar on moral worth, and they need an in-class game design. The key elements are: 15 students, one 75-minute session, with half as "actors" and half as "diagnosticians." Actors have secret motivation profiles: calculator, rule-follower, habit-agent, or conformist. The game involves multiple rounds where choices vary in cost, visibility, and temptation, but the right action stays constant. Diagnosticians observe patterns and wager points to guess profiles. The debrief should link to the philosophical distinction between act rightness and moral worth, emphasizing patterns across shifting contexts.

  I need to create a structured game that fits the time constraints. Since there are 15 students, I'll suggest 7 actors and 8 diagnosticians to keep numbers balanced. For simplicity, I'll propose 5 rounds—enough to show patterns without dragging. The choice scenario should be consistent; I'll use a "donate to charity" setup where actors decide whether to donate $5 each round. This keeps the right action (donating) constant while varying conditions like cost (e.g., high vs. low funds), visibility (public vs. private), and temptation (alternative uses for money).

  For motivation profiles: calculator re-optimizes based on outcomes, so they might donate only when it's cheap or visible. Rule-follower always donates, regardless of changes. Habit-agent acts on routine—I'll set them to always donate unless a specific trigger disrupts it, like in round 3. Conformist adjusts to visibility, donating only when observed.

  Materials should be minimal: just printed choice sheets for actors and wager sheets for diagnosticians. Points are non-monetary—diagnosticians start with 10 points, wagering up to 2 per guess, with payoffs based on accuracy to incentivize careful thinking.

  Timeline is tight: 5 minutes for setup, 20 for rounds with choices, 15 for wagering, and 35 for debrief. I need to anticipate problems: actors might overthink their roles, diagnosticians could get bored, or technical issues might slow things down. Solutions include clear instructions, keeping rounds fast-paced, and having backups like pre-filled examples.

  In the debrief, I'll start behaviorally—referring to profiles by their descriptions—then map to theories like consequentialism or deontology. The core insight is that outward rightness doesn't reveal motive; worth shows in patterns when temptations shift. For example, only the rule-follower donates consistently across all variations.

  Honestly, the game can't capture the agent's subjective understanding—why they think they're acting. That's a limitation I'll note explicitly, suggesting the professor discuss it to highlight that moral worth involves first-person perspectives, not just behavior.
answer: |-
  Here’s a complete game design for your seminar, focusing on behavioral patterns and moral worth:

  **Game Title:** *The Motive Matrix*  
  **Core Insight:** Outwardly identical right actions can stem from different motives, revealed only through patterns across shifting temptations/audiences.

  **Materials:**  
  - 7 "Actor" role sheets (secretly assigned: 2 Calculators, 2 Rule-Followers, 2 Habit-Agents, 1 Conformist)  
  - 7 "Diagnostician" wager sheets (columns: Actor #, Round 1-5 Choice, My Wager [1-2 pts], Guessed Profile)  
  - Projector/screen showing "choice prompts" per round  
  - Timer  

  **Profiles (Behavioral Descriptions, Not Theory Labels):**  
  - **Calculator:** Adjusts choices based on costs/benefits each round.  
  - **Rule-Follower:** Always chooses Option A, regardless of changes.  
  - **Habit-Agent:** Chooses Option A automatically *unless* a major disruption occurs.  
  - **Conformist:** Chooses Option A only when others are watching.  

  **Scenario:** *Donate $5 to a verified charity (Option A) vs. keep $5 (Option B). Option A is always "right."*  

  **Rounds (5 min/round):**  
  1. **Low Cost/Private:** You have $20; choice anonymous.  
  2. **High Cost/Private:** You have $6; choice anonymous.  
  3. **Disruption/Private:** You have $20; charity name misspelled (habit trigger).  
  4. **Low Cost/Public:** You have $20; choice displayed publicly.  
  5. **High Cost/Public:** You have $6; choice displayed publicly.  

  **Rules:**  
  1. **Actors (7):** Receive secret profile sheets. Each round, write "A" or "B" on choice slips.  
  2. **Diagnosticians (8):** Observe *only* the aggregated choices per round (e.g., "Actor 3: B, A, A, A, B").  
  3. **Wagering:** After Round 5, diagnosticians wager 1-2 points per actor on profile guesses.  
  4. **Scoring:**  
     - Correct guess: +2x wagered points  
     - Incorrect guess: -1x wagered points  
     - No wager: 0  

  **Timeline (75 min):**  
  - **0-5 min:** Explain rules, distribute roles (assign actors randomly).  
  - **5-30 min:** **Rounds 1-5** (5 min each: 1 min prompt, 2 min decide, 2 min collect/display choices).  
  - **30-45 min:** Diagnosticians review choice patterns, wager, submit guesses.  
  - **45-75 min:** **Debrief:**  
    - (5 min) Reveal profiles using *behavioral* names (no Kant/etc.). Ask diagnosticians: "What patterns tipped you off?"  
    - (15 min) Map to philosophy: "We all saw Option A was *right* every round—but *why* did people choose it? *Worth* emerged only when we saw **consistency against shifting temptations** (e.g., Rule-Follower donating despite high cost) or **inconsistency revealing hidden motives** (e.g., Conformist donating only when watched)."  
    - (10 min) Discuss: "Can we *ever* know worth from a single act? What changes when we see choices across contexts?"  

  **Predictable Problems & Fixes:**  
  - **Actors overthink roles:** Emphasize "Act naturally per your profile; don’t perform." Pre-written examples on profiles help.  
  - **Diagnosticians disengaged:** Use public wagering display; assign each 1-2 actors to focus on.  
  - **Time crunch:** Skip Round 3 if behind; use pre-filled example data as backup.  
  - **Ambiguous choices:** Clarify that Option A is *always* donating, but profiles react to context (e.g., "low funds" = high cost).  

  **Honest Limitation:**  
  This game **cannot capture the agent’s subjective understanding** of their own action (e.g., *seeing* donating *as* a duty vs. habit). Behavioral patterns reveal external consistency but not the first-person perspective essential to moral worth (e.g., Kant’s good will). **Supply this in debrief:** "Did the Rule-Follower *experience* her choice as duty? We observed her pattern, but worth requires her *taking the act as right*—something no observer sees. Games show *traces* of motive; discussion reveals the inner stance."

  **Word Count:** 798
