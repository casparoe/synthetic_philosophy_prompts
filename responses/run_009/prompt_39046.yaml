  Okay, the user wants me to act as a senior game theorist advising on selecting five open questions in the evolution of cooperation for a research group. Let me start by understanding their constraints. They have three theorists and one simulation expert, three years of funding, and they can't do field empirics. Their goal is understanding stability of cooperation, not applications. They provided two candidate questions: one on extortionate strategies and another on discovered strategy spaces. I need to evaluate these and suggest three more.

  First, evaluating the extortion question. The user asks if extortion is an evolutionary dead end or a constraint. Press-Dyson strategies were a big deal, but there's debate about their evolutionary stability. Simulation studies like Hilbe et al. (2013) showed that extortioners face retaliation. However, more recent work might show contexts where they persist. Since the group has simulation capabilities, testing recognition mechanisms and retaliation dynamics could be feasible. But maybe this is too narrow? The user mentioned partner choice as a current trend. If extortion relies on enforced interactions, but in models with partner choice, it might not matter. So perhaps this candidate should be demoted because it's becoming less central with the shift to partner choice models.

  Next, the discovered strategy spaces candidate. This seems crucial. Traditional models like Axelrod's tournaments used fixed strategy sets. But in reality, strategies evolve from simpler components, like finite automata or reinforcement learning. Work by Lindgren, Nowak, or Leibo et al. on multi-agent RL shows cooperation emerging from learning. The group's theorists can develop evolutionary models, and their simulator can handle complex agent-based models. This question is upstream of understanding how cooperation arises naturally, without predefined strategies. It's more fundamental than extortion, so I should accept this one.

  Now, I need three more strong candidates. One major gap is partner choice frameworks. Models like voluntary interaction games (VPD) or dynamic networks where agents leave bad partners. Fu et al. (2012) showed how partner selection enables cooperation without punishment. This is a current drift in the field, and simulation can test different partner choice mechanisms. Theorists can formalize conditions for stability. Since the group can't do empirics, this suits them well.

  Another candidate is the role of asymmetric interactions. Most models assume symmetric payoffs, but real-world interactions often involve power imbalances. Questions like how dominance hierarchies affect cooperative stability. This is underexplored but critical. Simulations can model asymmetric games, and theorists can analyze evolutionary stability in such contexts. It's upstream because asymmetry changes incentive structures fundamentally.

  Third, multi-level emergence. How cooperation stabilizes across levels—individual, group, population. Traulsen and Nowak's work on group selection models. With simulation, they can test interactions between within-group and between-group dynamics. This is core to understanding large-scale cooperation, like in human societies.

  For the fifth item, the least confident, I'm considering communication costs. How signaling and its costs influence cooperation. But maybe this is too specific? If new empirical data shows low-cost signaling enabling cooperation in animals, it might shift focus from punishment to communication. But it's a bit peripheral. Alternatively, could be the asymmetry point? If empirical studies find symmetry isn't crucial, that could weaken this question's priority.

  Wait, the user wants the fifth item to be the least confident and mention what could change the ranking. So perhaps asymmetry is a good candidate for fifth. If empirical evidence shows symmetric models suffice, then asymmetry might be less critical. That makes sense.

  Also, ensuring each question specifies why it suits theory-plus-simulation. Partner choice, discovered strategies, and multi-level all fit simulation well. Asymmetry and communication costs might too. But the fifth item's weakness is if empirics reveal something unexpected.

  Need to check if all five are distinct and cover different aspects. Extortion was demoted, so the list is: discovered strategies, partner choice, asymmetry, multi-level, and communication costs. But maybe communication costs isn't as central? Perhaps substitute with something about stochastic environments or environmental pressures affecting cooperation? But the user mentioned understanding stability, so environmental uncertainty could be key. However, that might overlap with partner choice in some ways.

  Another idea: the impact of stochasticity or noise on cooperative strategies. How noise influences the evolution of reciprocity versus other mechanisms. But maybe that's part of discovered strategies. Hmm. Perhaps keep communication as the fifth, acknowledging it's tentative.

  Final list:
  1. Discovered strategy spaces - accepted.
  2. Partner choice frameworks - new.
  3. Asymmetric interactions - new.
  4. Multi-level emergence - new.
  5. Communication costs - least confident; if empirics show costly signaling isn't necessary, it drops.

  Each with why it suits the group and what it's upstream of. For example, discovered strategies upstream of natural emergence of cooperation; partner choice upstream of alternatives to punishment; asymmetry upstream of hierarchical societies; multi-level upstream of large-scale cooperation; communication upstream of coordination mechanisms.

  Also, for the fifth item, what would change the ranking: empirical findings that cooperation stabilizes without communication or with minimal signaling. That could reduce its priority.
answer: |-
  1. **Discovered strategy spaces**: This question is fundamental to understanding how cooperation emerges *de novo* rather than merely persisting among predefined options; it suits theory-plus-simulation perfectly, as theorists can model evolving computational agents (e.g., neural nets, finite automata) and the simulator can explore complex co-adaptation dynamics, upstream of explaining organic complexity in social systems.  
  2. **Partner-choice frameworks under costly search**: Focusing on how search costs and network fluidity shape the evolution of cooperative norms (e.g., when does "walking away" outperform punishment?) leverages our theorists’ strength in modeling dynamic networks and the simulator’s ability to test stability boundaries, upstream of unifying partner choice with traditional enforcement models.  
  3. **Robustness of cooperation to environmental stochasticity**: Investigating how resource volatility or interaction uncertainty favors different stabilizing mechanisms (e.g., reciprocity vs. assortment) aligns with our simulation capacity for sensitivity analysis and theoretical work on invasion barriers, upstream of predicting cooperation’s fragility in real-world systems like ecosystems or markets.  
  4. **The role of asymmetric power in cooperative stability**: Examining how imbalances in resources, information, or sanctioning ability affect the evolution of mutualism versus exploitation directs theorists to formalize asymmetric games and the simulator to test hierarchical dynamics, upstream of understanding cooperation in stratified societies or interspecies mutualisms.  
  5. **The evolutionary stability of cheap signaling in maintaining cooperation**: This question is included tentatively due to uncertainty about its generality; our theorists can model signaling equilibria and the simulator can assess deception rates, but new empirical evidence that cheap signals rarely stabilize cooperation outside human-like cognition would weaken its priority relative to items 1–4.
