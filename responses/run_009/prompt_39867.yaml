prompt: |-
  For a chapter on commodification, I've been cataloguing my adviser's rulings on contested markets, and her track record is starting to look like a little jurisprudence. So far: she holds that a market in kidneys from living sellers should stay banned; that selling one's vote should be banned outright, not merely regulated; and that charging ruinous prices for generators after a hurricane is exactly the sort of transaction the law should stop. On the other side, she has no problem with the American practice of paying plasma donors; she approves of paying healthy volunteers in phase-one drug trials, including fairly risky ones; and when our seminar debated egg donation, she defended donor compensation without hesitation. I once pressed her on the fact that many paid plasma donors in the United States are themselves poor, and it didn't move her at all. Two new cases have now come up, and I have to predict her line on both. The first is a reformed, regulated kidney-purchase system — modeled on the Iranian one but with long-term follow-up care and a screening process that reliably excludes anyone selling out of financial desperation, so the sellers would be comfortable volunteers accepting a fair, posted price. The second is a small EU member state selling citizenship outright to wealthy investors, with no residence or integration requirement. I can see at least two principles that fit everything she has said so far — one that asks what money does to the meaning of the good itself, and one that asks about the position and options of the parties at the moment of sale — and I suspect they come apart on these two cases. Predict her verdict on each, set out the candidate principles that fit her record, tell me which one you would bet on and why, and propose the single further case that would best discriminate among the principles.
reasoning: |-
  Okay, the user is working on a chapter about commodification and has been tracking their advisor's rulings on contested markets. They've noticed a pattern that resembles a sort of jurisprudence. The advisor has specific stances: banning kidney markets and vote selling, stopping price gouging after disasters, but allowing paid plasma donations, compensating drug trial participants, and egg donations. 

  The user mentioned that even when they pointed out that many plasma donors are poor, the advisor wasn't swayed. Now there are two new cases: a regulated kidney purchase system inspired by Iran but with safeguards, and an EU country selling citizenship to wealthy investors without any requirements. The user sees two possible principles behind the advisor's decisions—one about money changing the meaning of the good, and another about the parties' positions during the sale. They need to predict the advisor's verdicts, explain the principles, pick which one to bet on, and suggest a test case.

  First, I need to figure out the advisor's underlying principles. Looking at the cases where she says no: kidneys, votes, and generators during emergencies. What do these have in common? Kidneys and votes are deeply personal and tied to identity or civic duty. Allowing money in these areas might degrade their intrinsic value. For generators during a hurricane, it's about exploiting desperate people. But in cases where she says yes: plasma, drug trials, egg donations. These involve bodily goods but are seen as more renewable or less identity-related. Plasma is renewable, drug trials are temporary, and egg donation, while invasive, compensates for time and effort without permanently affecting identity.

  The user mentioned two principles: commodification (money altering the meaning) and vulnerability (exploitation of desperate parties). The kidney case with safeguards addresses vulnerability by excluding desperate sellers, but does it solve the commodification issue? Citizenship sale is purely about money changing what citizenship means, without vulnerability since buyers are wealthy. So the advisor might reject both if commodification is key, but maybe allow the kidney program if vulnerability is the main concern.

  Predicting her verdicts: For the regulated kidney market, even with safeguards, she might still oppose because kidneys are inherently personal and non-commodifiable. Selling citizenship would likely be a no because it turns citizenship into a commodity, undermining its civic meaning. 

  The two principles: Principle A (Commodification) focuses on whether money corrupts the good's intrinsic meaning. Principle B (Vulnerability/Desperation) looks at whether one party is exploited due to lack of options. Both fit the past rulings. For plasma donors being poor not swaying her, that aligns with Principle A because plasma is seen as renewable, not identity-related. 

  The user needs to bet on one principle. Given that the advisor didn't care about plasma donors' poverty, Principle A (commodification) seems stronger. The kidney case with safeguards might still be rejected because the meaning changes, while citizenship sale is clearly commodifying. 

  For a test case, consider something where the meaning is intact but vulnerability is high. An emergency auction for lifesaving treatment: only the rich can bid, but it's a one-off situation. Principle A might allow it if the good (treatment) isn't inherently corrupted by money, while Principle B would oppose due to desperation. Or a reverse case: selling naming rights to public parks. Meaning changes (commodification), but no vulnerability, so Principle A opposes, Principle B might allow.
answer: |-
  Based on your adviser's track record and the principles emerging from her rulings, here's the analysis and prediction for the two new cases:

  ### Prediction for Each Case
  1.  **Reformed Kidney Market (Iran-inspired with safeguards):** **Verdict = BANNED.** Despite safeguards against desperation and fair pricing, your adviser will likely reject this. Kidneys represent an inalienable aspect of personhood. Even with "comfortable volunteers," introducing a price fundamentally corrupts the meaning of the body part as a gift of life, turning it into a commodity. Her prior kidney ban wasn't solely about desperation; it was about the *kind* of good being traded.

  2.  **Citizenship Sale (Wealthy investors, no requirements):** **Verdict = BANNED.** Citizenship is a foundational political and civic good, signifying belonging, rights, and duties within a community. Selling it outright, especially with no integration requirement, reduces citizenship to a purely financial transaction, stripping it of its civic meaning and turning it into a luxury commodity akin to a club membership. This directly undermines its core symbolic and participatory value.

  ### Candidate Principles Fitting Her Record
  Two distinct principles explain her rulings:

  *   **Principle A (Commodification / Corruption of Meaning):** Certain goods have intrinsic social, civic, or personal meanings that are fundamentally corrupted or degraded when they are bought and sold. Money transforms the nature of the good itself and the social relations around it. This principle focuses on the *type of good* and whether market logic is inherently destructive to its core meaning or purpose.
      *   *Fits:* Banning kidneys (body as sacred, gift), votes (civic duty corrupted), citizenship (civic bond). Allowing plasma (renewable, less symbolically charged), drug trials (time/risk compensation, medical progress), eggs (compensation for burden/time, reproductive autonomy).
      *   *Ignores:* Vulnerability of plasma donors. The transaction's *meaning* is acceptable, so the seller's poverty doesn't invalidate it under this principle.

  *   **Principle B (Vulnerability / Exploitation Prevention):** Markets should be banned when one party is likely to be in a position of such profound vulnerability, desperation, or lack of reasonable alternatives that their consent is compromised, leading to exploitation or outcomes harmful to their essential interests. This principle focuses on the *context of the transaction* and the relative power/options of the parties.
      *   *Fits:* Banning kidneys (desperation risk), hurricane generators (desperation exploited). Allowing plasma (donor *can* choose, even if poor), drug trials (volunteers screened, informed consent), eggs (similar consent/screening).
      *   *Struggles:* Votes (Why ban outright? Exploitation isn't primary argument). Citizenship (Wealthy buyers aren't vulnerable). Her lack of concern over plasma donor poverty is a *weakness* for this principle.

  ### Which Principle to Bet On & Why
  **Bet on Principle A (Commodification / Corruption of Meaning).**

  *   **Why it fits better:** It explains the bans on kidneys, votes, and citizenship as *inherently* problematic goods for markets, regardless of safeguards or the specific vulnerability of sellers/buyers. It also cleanly explains why she allows plasma, drug trials, and egg donation – these goods are seen as less inherently corrupted by money (plasma is renewable, drug trials compensate risk/time, eggs compensate burden/time).
  *   **Why Principle B is weaker:** Her ban on *vote selling* isn't primarily about voter exploitation; it's about the meaning of democracy. The citizenship case involves wealthy, powerful buyers, not vulnerable sellers. Most crucially, **her dismissal of plasma donor poverty is a major strike against Principle B.** If preventing exploitation of the desperate was her core concern, this should have troubled her. Principle A, however, explains why she allows plasma despite donor poverty: the *meaning* of selling plasma isn't inherently corrupted in the way selling a kidney or vote is.

  ### The Best Discriminating Further Case
  **Case:** **Paid Surrogacy Arrangements (Gestational) in a jurisdiction with robust regulation:**
  *   Includes: Thorough medical/psychological screening, independent legal counsel for all parties, enforceable contracts covering health/compensation, guaranteed healthcare, fair payment (not exploitative), and the surrogate retains ultimate bodily autonomy during pregnancy.
  *   **Why this discriminates:**
      *   **Principle A (Commodification):** Likely opposes. Pregnancy and childbirth are deeply tied to personhood, intimacy, and the creation of life. Paying for gestation commodifies these profound experiences and arguably reduces the surrogate and child to instruments of production. The intrinsic meaning is corrupted.
      *   **Principle B (Vulnerability):** Likely permits. Rigorous regulation aims precisely to mitigate vulnerability, ensure informed consent, prevent exploitation, and protect the surrogate's health and interests. If the safeguards are deemed sufficient, the voluntariness isn't compromised by desperation.
      *   **Predicting Your Adviser:** Based on her defense of egg donation (another intimate reproductive act compensated for burden/time/risk), she *might* cautiously permit regulated surrogacy, leaning towards Principle B. However, if she views pregnancy as fundamentally different (more intimate, longer, more bodily integrated) and sees payment as degrading its meaning regardless of safeguards, she would ban it, strongly favoring Principle A. This case directly pits the "meaning of the good" (gestation) against the potential for mitigating vulnerability through regulation. Her verdict would be highly revealing.
