prompt: |-
  I run pre-departure orientations for a small study-abroad outfit — roughly 80 students a year, headed to maybe a dozen countrys, and the "local norms" part of the orientation falls to me, one hour the week before they fly. Right now my advice is basically vibes: be respectful, watch what the locals do, when in Rome, etc. That's not much use when a student actually asks whether they *have* to do the thing. Do they really have to tip twenty percent in the US as a visitor from Japan? Should they wait at a completely empty Berlin crosswalk at 2am with no car in sight? And when a local convention collides with a student's own convictions — somewhere the convention is that men don't shake women's hands, and a student finds that demeaning — is following it politeness, or is it complicity? I need something more like a procedure and less like a mood.

  So here's what I want: take whatever the philosophy of convention actually has to say (Lewis-style stuff — conventions as solutions to coordination problems, where everyone conforms becuase everyone else conforms — plus whatever ethics has to say about when conforming becomes a genuine obligation on an outsider rather than a local habit) and turn it into a decision procedure I can teach and the students can run themselves on the ground. Give me the questions in order, what counts as enough of an answer to each one, where the procedure outputs "treat this as a real obligation," "go along with it but it's not morally on you," and "don't do it," and where it refuses to decide and hands it back to the student because the question is one of values, not facts. It has to handle the case where the student can't possibly know the answer in advance — they've never been there, and from the outside you can't tell a coordination norm from a local quirk — so tell me what the default should be under uncertainty: ask a local? copy the majority? err toward conforming or toward staying out of it?

  Constraints, so this stays realistic: students won't carry a manual, so it has to compress to something memorable, around five questions max; and I have exactly that one hour, so any step I can't teach in ten minutes is out. Please be honest about which steps are doing real work and which are just judgment calls dressed up as procedure, and say outright what the procedure was never going to settle.

  Then run it on three cases. (1) The Japanese student and the twenty percent tip in the US. (2) Jaywalking, both directions: a German exchange student in Manhattan where locals cross against the light constantly, and the empty-street Berlin case in reverse. (3) A female student going somewhere the local convention is that men don't shake women's hands, who thinks the convention is demeaning — follow it out of respect, refuse quietly, and is that even her call to make rather than mine to impose? And include at least one case where the procedure gives an answer I won't like: I privately think visitors shouldn't have to tip American amounts, it just props up a system I'd like to see die, so if the procedure says the tip is a genuine obligation, say so anyway and show your work.

  One formatting thing: no headings, no bullet points, no bold, no tables — continuous prose only, the way you'd write a long email to a colleague. My students are reading this on their phones anyway.
reasoning: |-
  Okay, the user runs pre-departure orientations for study-abroad students and needs a better way to teach cultural norms. Right now, they're giving vague advice like "be respectful" and "when in Rome," but that's not helping when students face specific dilemmas. They want a clear decision procedure based on philosophical concepts like David Lewis's conventions as solutions to coordination problems, combined with ethical considerations. The goal is to help students decide when to conform, when it's optional, and when to refuse.

  The user has real constraints: the procedure must be memorable (five questions max), teachable in ten minutes per step, and usable by students on the ground without a manual. They also want honesty about which steps are judgment calls and where the procedure can't decide. Plus, they need examples: tipping in the US, jaywalking in Germany vs. US, and the handshake gender norm conflict. Importantly, they want the procedure to work even when students lack prior knowledge of the local culture, so defaults under uncertainty are key.

  First, I need to distill Lewis's convention theory. Conventions are patterns of behavior that solve coordination problems because everyone follows them expecting others to do the same. For ethics, I should incorporate when conformity becomes an obligation for outsiders versus just a habit. Philosophers like Martha Nussbaum or Kwame Anthony Appiah might have insights on cross-cultural ethics and complicity. 

  The procedure should start with identifying if something is a convention. Students need to ask: Is this a widely followed local behavior? If yes, does it solve a coordination problem? For example, tipping in the US coordinates fair pay in a system with low wages, while jaywalking norms manage pedestrian safety. If it's not a convention, it might just be a quirk—no obligation. 

  Next, assess harm. If a convention causes harm (like discrimination), refusing might be ethical. But students might struggle to judge harm accurately, so the procedure needs a default: when uncertain, conform or ask locals. The user mentioned the handshake example—if a student finds it demeaning, is refusing complicity or standing up for values? Here, the procedure should flag it as a values conflict and suggest discreet refusal to avoid escalation. 

  For uncertainty, the default should be to observe and imitate the majority, or ask a trusted local. This is practical for students who can't research in advance. 

  Now, compressing to five questions: 
  1. Is it a convention? (Check for consistency and coordination) 
  2. Does it coordinate? (If yes, it's functional; if no, ignore) 
  3. Is it harmful? (If yes, don't conform; if unsure, proceed) 
  4. What's the cost of non-conformity? (To self and others) 
  5. If still unclear, default to observing/asking. 

  Outputs: "Obligation" (coordination + low harm), "Optional" (no coordination or minor quirk), "Refuse" (harmful), or "Values decision" (harm unclear). 

  Testing on cases: 
  - Tipping in US: It's a strong convention (coordinates wages), low direct harm, high social cost if not done (service workers suffer). So obligation, even if the user dislikes the system. 
  - Jaywalking in Berlin: Conventions coordinate safety; not following could cause confusion or fines. Obligation to wait. In NYC, jaywalking is the norm, so conforming is optional but low-risk. 
  - Handshake refusal: Convention exists but may cause harm (reinforces gender inequality). Since harm is debatable, it's a values decision—student can refuse quietly. 

  The user won't like the tipping answer, but the procedure prioritizes immediate impact on workers over systemic change. Honesty is key here. 

  For teachability: Each step is simple. Steps 1-2 are factual (observe behavior), step 3 is ethical (harm assessment), step 4 is practical (risk), step 5 is fallback (observe/ask). Judgment calls are in harm assessment and cost evaluation—I'll clarify that. 

  Finally, formatting: No bullets, just prose. I'll write it like a fluid email, with examples woven in. Need to emphasize that some decisions are personal, especially when harm isn't clear-cut. This should empower students while giving structure.
answer: |-
  Here’s a decision procedure distilled from convention theory (David Lewis) and cross-cultural ethics, designed as a five-step checklist students can run mentally when facing a "local norm" dilemma. It prioritizes observability, minimizes pre-departure research burdens, and defaults to practical action under uncertainty. The core idea: **conventions are collective solutions to coordination problems; your obligation depends on whether your participation sustains or disrupts that solution, and at what ethical cost.**

  **The Five Questions (Teach this sequence verbatim):**  

  1.  **"Do most locals *reliably* do this here?"**  
      *   **How to answer:** Observe multiple people in similar situations. If you can’t observe (e.g., pre-trip), ask 2-3 locals (e.g., program staff, host family, trusted shopkeeper) *separately* if this is a common expectation.  
      *   **If NO:** It's likely a personal quirk, not a convention. Stop. No obligation. Do what feels right.  
      *   **If YES or UNCERTAIN:** Proceed to Q2. *Default under uncertainty:* Assume it *might* be a convention until proven otherwise.

  2.  **"Does doing (or not doing) this help people coordinate smoothly?"**  
      *   **How to answer:** Ask: "What problem does this solve?" Does it manage scarce resources (queues), signal respect (greetings), prevent conflict (dress codes), ensure fairness (tipping wages), or enhance safety (traffic norms)? If you see clear coordination value (e.g., tipping sustains service wages; waiting at lights signals predictability to drivers), it's a strong convention. If it seems arbitrary or purely symbolic without coordination function (e.g., specific lucky gestures), it's weaker.  
      *   **If YES (Strong Coordination):** Proceed to Q3.  
      *   **If NO (Weak/No Coordination):** Proceed to Q4. *Default under uncertainty:* If you genuinely can’t see the coordination point but locals do it reliably, assume it solves a problem you don't grasp. Proceed to Q3.

  3.  **"Does doing this cause direct, significant harm?"**  
      *   **How to answer:** Harm means violating core rights (safety, dignity, equality) or actively supporting such violation. Does participating sustain discrimination, exploitation, or violence? Does *refusing* cause *immediate, severe* harm to someone vulnerable? (e.g., Refusing a bribe demand might endanger you; refusing a discriminatory norm likely harms *you* psychologically/socially, not others materially).  
      *   **If CLEAR YES (e.g., participating in hate speech, forced labor):** Refuse. Don't do it.  
      *   **If CLEAR NO (e.g., tipping, queueing):** Proceed to Q5. Output = **"Genuine Obligation."**  
      *   **If UNCERTAIN or DEBATABLE (e.g., gendered greetings, modest dress):** Proceed to Q4. *Default under uncertainty:* Err toward *not* assuming severe harm unless it's glaringly obvious. Many norms involve complex power dynamics where harm is structural, not direct.

  4.  **"What's the actual cost of *not* conforming here?"**  
      *   **How to answer:** Consider: Financial cost (fine)? Social cost (offense, exclusion)? Safety risk (accident, arrest)? Effort (finding alternatives)? *Who* bears the cost? (You? A worker? Society?). Be realistic about likelihood and severity.  
      *   **If COST IS HIGH & FALLS ON OTHERS (e.g., server loses wages):** Proceed to Q5. Output = **"Genuine Obligation."**  
      *   **If COST IS LOW/ABSORBED BY YOU (e.g., mild annoyance, dirty look):** Proceed to Q5. Output = **"Go Along (Polite Optional)."**  
      *   **If COST IS HIGH & FALLS ON YOU (e.g., arrest, expulsion):** Output = **"Go Along (Prudent/Safety)."** (This overrides harm uncertainty in Q3 for immediate self-preservation).

  5.  **"Can I participate in a way that respects my values without breaking coordination?"**  
      *   **How to answer:** Look for subtle alternatives: Pay the tip but advocate for change later? Wait at the crosswalk but cross if *everyone* else does? Decline a handshake with a warm verbal greeting and smile? Find a functional equivalent that satisfies the coordination need without violating your core self.  
      *   **This step ALWAYS outputs:** The action chosen based on Q1-4, but **adds nuance**. It’s the "values check," acknowledging that even obligations can sometimes be met creatively. If Q3 was "Uncertain/Debatable," this is where you decide *how* to navigate the values clash personally.

  **What This Procedure Settles (and What it Doesn't):**  
  *   **Settles Factual Uncertainty (Q1 & Q2):** It forces observation/inquiry to distinguish true conventions from quirks and assess their function. This is core Lewis.  
  *   **Settles Coordination Necessity (Q2 & Q4):** It clearly identifies when non-conformity actively disrupts a collective solution or harms specific individuals relying on it (e.g., tipping). This grounds obligation.  
  *   **Does NOT Settle Deep Value Conflicts (Q3):** Determining "significant harm" is inherently value-laden. The procedure flags this uncertainty and pushes it to Q5 for personal judgment + pragmatic adaptation. It *doesn't* tell you if a sexist norm is "harmful enough" to defy – it tells you the cost of defiance and lets you choose.  
  *   **Prioritizes Preventable Harm & Reliance (Q4):** The obligation is strongest when your action directly prevents tangible, predictable harm to others whose reliance on the convention is reasonable (like servers relying on tips).  
  *   **Defaults Under Ignorance:** Observe/Ask (Q1). Assume coordination function exists if widespread (Q2). Err toward *not* assuming severe harm without clear evidence (Q3). Prioritize preventing high costs to others (Q4).

  **Running the Cases:**  

  1.  **Japanese Student & 20% US Tip:**  
      *   Q1: Yes, tipping 15-20% for table service is a near-universal US convention.  
      *   Q2: Yes, it solves a coordination problem: it's the primary wage for servers in a system with a low base pay. Not tipping disrupts this, directly harming the worker.  
      *   Q3: No *direct, significant harm* caused *by* tipping. (The *system* may be harmful, but your individual tip prevents immediate harm to the server).  
      *   Q4: Cost of not conforming (stiffing the server) is high and falls entirely on the vulnerable worker (lost wages).  
      *   Q5: You can tip 20% *and* advocate for systemic change later.  
      *   **Output: Genuine Obligation.** (Yes, this props up a bad system, but the procedure prioritizes the immediate, predictable harm to the individual worker relying on the convention *right now*. Your refusal won't change the system; it just penalizes the server. This is the answer you won't like, but it highlights the procedure's focus on concrete reliance and harm avoidance in the coordination dynamic.)

  2.  **Jaywalking:**  
      *   **German Student in Manhattan (Empty Crosswalk, Don't Walk Signal, Locals Cross):**  
          *   Q1: Yes, locals reliably jaywalk when safe.  
          *   Q2: Weak coordination function. It solves an individual efficiency problem ("I'm in a hurry") more than a collective one. The *legal* norm (waiting) exists for safety, but the widespread *practiced* norm (jaywalking when safe) coordinates pedestrian flow informally.  
          *   Q3: No direct harm *if* done safely (no cars).  
          *   Q4: Cost of conforming (waiting) is low (time). Cost of *not* conforming (crossing against light) is very low (unlikely ticket if safe, minor social cost – you're doing what others do).  
          *   Q5: Easy to cross safely with the crowd.  
          *   **Output: Go Along (Polite Optional).** You can safely follow the local *practice* without breaking core coordination (safety is maintained by looking).
      *   **US Student in Berlin (Empty Crosswalk, Red Man, No Locals Crossing):**  
          *   Q1: Yes, locals reliably wait, even when seemingly safe.  
          *   Q2: Strong coordination function. It reinforces predictability and safety culture. Drivers expect strict compliance. Non-compliance risks accidents (if a car *does* appear unexpectedly) and undermines the social norm promoting safety.  
          *   Q3: No direct harm *if* truly safe, but potential safety risk exists.  
          *   Q4: Cost of not conforming (crossing): Potential fine, definite social disapproval, small risk of accident. Cost falls on you and potentially others (if an accident occurs). Cost of conforming (waiting) is low (time).  
          *   Q5: Just wait. It's easy.  
          *   **Output: Genuine Obligation.** The strong coordination value (safety culture, predictability) and low cost of compliance create an obligation to follow the local convention strictly.

  3.  **Female Student & Gendered Handshake Refusal:**  
      *   Q1: Assume Yes, reliable local convention that men don't initiate handshakes with women.  
      *   Q2: Coordination function exists: it's a signal of respect within that cultural/religious framework (even if we disagree with its foundation). Refusing *could* cause social friction/disruption.  
      *   Q3: **UNCERTAIN/DEBATABLE.** The student finds it demeaning (psychological harm/inequality). Does *participating* (accepting the refusal) actively cause significant harm by reinforcing patriarchy? Or is it merely respecting a different (if objectionable) custom? This is a core values clash. The procedure flags uncertainty.  
      *   Q4: Cost of *not* conforming (insisting on shaking hands): High potential for offense, social awkwardness, damaging relationships locally. Cost falls on you (reputation, comfort) and potentially the local individual (embarrassment). Cost of conforming (accepting the gesture) is primarily internal (feeling complicit).  
      *   Q5: **Values Decision Point.** Can you respond in a way that meets the coordination need (smooth greeting showing respect) without violating your values? Options:  
          *   *Follow Convention:* Accept the nod/bow with warmth. Least disruptive.
          *   *Subtle Refusal:* Offer a warm verbal greeting + slight bow/smile *instead* of extending your hand first. If a hand *is* offered, shake it. Avoids forcing the issue while signaling openness equally.
          *   *Explicit Refusal (Risky):* "I understand your custom, but I greet everyone with a handshake as a sign of equality." High social cost.
      *   **Output:** Q3 flagged **Values Decision.** Q4 shows high social cost for defiance. Q5 offers nuanced paths. **The procedure says: "Genuine Obligation" to provide a respectful greeting that maintains coordination/smoothness is high (Q2 & Q4), BUT *how* you fulfill that obligation (accepting their gesture vs. offering a non-handshake alternative) is a personal value choice where refusal (quietly) is an option.** It *doesn't* say she *must* accept feeling demeaned; it says she must find a way to greet respectfully without forcing a handshake, acknowledging the values tension. **This is NOT your call to impose; it's hers to navigate using the procedure.**

  **Teaching Notes (For Your 1 Hour):**  
  *   **Minutes 0-10:** Explain *why* "vibes" fail (coordination problems exist, harm vs. habit). Introduce Lewis-lite: "Conventions are local rules of thumb everyone follows because everyone else does, to avoid mess or hassle."  
  *   **Minutes 10-25:** Teach the 5 Questions *sequentially*. Drill the logic: "Q1: Is it real? Q2: Does it *do* something useful? Q3: Does it hurt? Q4: What happens if I don't? Q5: Can I tweak it?" Emphasize observation (Q1) and cost to others (Q4) as key new tools.  
  *   **Minutes 25-40:** Run the 3 cases together. Show how outputs differ based on coordination function and cost. Highlight the tipping obligation despite system dislike and the handshake values call. Stress that Q3 uncertainty is normal and pushes them to Q5.  
  *   **Minutes 40-50:** Practice! Give quick hypotheticals (e.g., haggling where expected/not expected, dress code at a site). Have them shout out which Q they are on.  
  *   **Minutes 50-60:** Summarize outputs: "Obligation" (do it, it matters), "Go Along" (usually do it, low stakes), "Refuse" (only for clear harm), "Values Choice" (you decide *how* within bounds). Reinforce defaults under ignorance: **When in doubt: Watch, Ask, Err toward not harming others or breaking coordination, then adapt subtly for your values.**  
  *   **Key Message:** This isn't about blind obedience. It's a tool to understand *why* something is expected, assess the *impact* of your choice, and navigate respectfully *while* staying true to yourself as much as pragmatically possible. Judgment is still needed, especially on harm, but now it's structured judgment.
