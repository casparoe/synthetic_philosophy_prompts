  2.  **P(True contradictions required | Liar is insoluble) = 0.30**  
      *Justification:* Insolubility *could* imply dialetheism, but weaker systems (e.g., non-classical logic without gluts, gappy FDE) often suffice; dialetheism isn't the unique escape.  
  3.  **P(Paraconsistent logics localize contradictions non-trivially) = 0.70**  
      *Justification:* Systems like LP model localized "patches" of inconsistency robustly in controlled settings, though broader epistemic utility is debated.  
  4.  **P(Dialetheism is metaphysical, not just pragmatic) = 0.20**  
      *Justification:* Most applications (e.g., inconsistent databases) are instrumental; justifying *ontological* contradictions requires stronger evidence (e.g., paradoxes as "revelatory").  

  ### Combination  
  **Final credence = P1 × P2 × P3 × P4**  
