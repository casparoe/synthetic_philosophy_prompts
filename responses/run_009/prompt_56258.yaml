  Hmm, the user is asking about the philosophy behind type design practices, specifically concerning letterform identity in revivals versus copyright disputes. This is a deep dive into typographic epistemology and ontology.  

  The user presents a fascinating paradox: designers claim a revival is "the same" as a historical typeface despite zero visual overlap, yet in legal battles, they treat millimeter-perfect outlines as the essence of ownership. Meanwhile, readers effortlessly recognize 'a' as 'a' across wildly different renditions. The core question is: what theory of identity holds these practices together?  

  For section 1 (restating the practice), I'll distill the duality:  
  - Revival judgments prioritize perceived "spirit" over physical form, accepting complete visual overhaul if the design "feels right."  
  - Outline policing treats mathematical curves as property, ignoring historical lineage when lawsuits fly.  
  The tension is delicious: the profession functionally believes in Platonic ideals until lawyers walk in.  

  Section 2 (implicit theory) needs to resolve this. Noordzij's stroke skeleton is tempting—a hidden invariant beneath ink blobs. But the practice is looser; it's about relational coherence. A good revival preserves:  
  - Proportional ratios (x-height vs. cap height)  
  - Stroke modulation logic (how thicks transition to thins)  
  - Behavioral consistency (how /n/ relates to /h/)  
  It's not a single essence but a system of constraints. When designers say "it's Garamond," they mean the design obeys Garamond's rules of construction.  

  For section 3 (rival views), I'll map theories to practice:  
  - Essentialism (stroke skeleton): explains revivals but clashes with outline policing's literalism.  
  - Family resemblance: fits better—revivals share "Garamond-ness" through overlapping traits (e.g., bracketed serifs + axis angle) without identical DNA.  
  - Differential view (Saussure-style): explains reader recognition (an 'a' is defined by not being 'o') but fails designers—they care about positive attributes, not just gaps.  
  Verdict: practice rejects pure differentialism (designers tweak individual glyphs without redesigning entire alphabets) but is agnostic between essentialism and family resemblance.  

  Section 4 (inconsistency) is clarifying. There's no contradiction—just contextual identity switching:  
  - Historical identity ("is this spiritually Garamond?") = systemic behavior  
  - Legal identity ("did you copy this file?") = literal coordinates  
  It's like judging a portrait: "captures Lincoln's character" vs. "used my camera without permission." Same word ("same"), different lenses.  

  Section 5 (what if differential view won?) would break everything:  
  - Revivals couldn't exist—each weight/style would be a distinct category since differential relations shift with interpolation.  
  - Knockoff disputes would implode—"stolen" would require identical contextual gaps in the entire glyph set, not just curves.  
  - Teaching would obsess over glyph ecosystems, not single letters. Unworkable, but fascinating thought experiment!  

  The user's framing is brilliant—they spot that type design is a microcosm of philosophy: how do we recognize sameness when nothing physical persists? My answer hinges on "systemic behavior" as the glue. Also, their everyday miracle note is key: reader recognition proves letterforms are patterns, not shapes. That's the North Star.
answer: |-
  Here is a structured analysis of the implicit theories of letterform identity in type design practice:

  ### 1. The Practice, Restated
  Type designers judge "revivals" (modern reinterpretations of historical typefaces) as successful if they are deemed to embody the *same design* as the original (e.g., "a true Garamond"), despite no visible outlines matching due to necessary adaptations for new media, weights, or sizes. This judgment hinges on perceived continuity of the original's essence. Conversely, in legal or proprietary disputes (e.g., accusations of font piracy), the *exact outlines* of digital vector points are treated as definitive. Courts protect font files as software code, not the abstract "design" of letterforms. This creates a duality: identity is fluid and historical in revival contexts but rigidly literal in ownership contexts.

  ### 2. The Implicit Theory
  Revival practice presupposes that a letterform’s identity resides in its **structural logic and relational system**, not its physical contours. Key invariants include:  
  - **Construction Principles**: The underlying skeleton—stroke direction, axis of stress (e.g., diagonal in Garamond vs. vertical in Didot), and ductus (stroke sequence). Noordzij’s theory formalizes this, treating letters as traces of tool movement.  
  - **Proportional Relationships**: Ratios between parts (e.g., x-height to cap height, stem width to letter width, serif bracketing curves).  
  - **Systemic Behavior**: How glyphs relate *to each other* (e.g., consistent stroke modulation in /n/ and /h/; rhythmic spacing patterns).  
  - **Holistic "Voice"**: The aesthetic effect of the ensemble—rigor, elegance, or dynamism—emerging from these principles.  
  When designers say a revival "is Garamond," they mean it instantiates the same *generative rules* and *visual rhythm* as historical specimens, even when scaled, weighted, or digitized. Recognition relies on these deep structural patterns, not surface metrics.

  ### 3. Rival Views and What the Practice Rules Out
  - **Skeleton/Essence View (e.g., Noordzij)**: Strongly compatible. Revival judgments align with prioritizing an invariant "stroke grammar." If the skeleton’s logic (e.g., tool-based modulation) persists, identity holds.  
  - **Family Resemblance View**: Also compatible. Designers may anchor revivals to exemplars (e.g., the /R/ or /g/) whose iconic traits signal "Garamond-ness," even if not all glyphs match perfectly. The practice *fits* this but doesn’t *require* it, as a revival could alter exemplars if systemic logic remains.  
  - **Purely Differential View (Saussurean)**: **Ruled out**. This argues a letter is defined *only* by its differences within a specific system (e.g., /n/ differs from /h/ via one stem). Revival practice rejects this: designers interpolate weights or adapt glyphs independently (e.g., tweaking /a/ without redesigning the entire alphabet), assuming stable identity per glyph. Reader recognition across typefaces also undermines differentialism—an 'a' is recognized *before* systemic comparison.  

  **Verdict**: Practice *presupposes* structural invariants (skeleton/essence) as necessary. Family resemblance is *compatible* but insufficient alone (exemplars derive from structure). Differentialism is *excluded*—identity isn’t purely relational.

  ### 4. The Apparent Inconsistency
  The outline-policing side **does not contradict** revival judgments but answers a distinct question: *authenticity of instantiation* vs. *authenticity of derivation*.  
  - Revivals track **historical-genetic identity**: "Does this *descend* from Garamond’s principles?"  
  - Outline policing tracks **token identity**: "Is this *specific digital file* copied?"  
  The law reinforces this split: copyright protects the *file* (a unique digital artifact), not the *design* (a historical abstraction). The same vocabulary ("same design") thus carries two concepts:  
  1. **Categorical membership** (revivals: "This is a Garamond")  
  2. **Token uniqueness** (policing: "This is *Adobe’s* Garamond").  
  This duality is sustainable because designers intuitively switch contexts—historical attribution vs. proprietary theft.

  ### 5. What Would Have to Change
  If a **purely differential view** dominated:  
  - **Revival Criticism**: Judgments would collapse. A revival could not be "Garamond" unless it replicated the *entire system* of contrasts from a specific historical cut (e.g., 16th-century Granjon’s /a/ vs. /o/ gap). Interpolated weights would be "new" designs since differentials shift.  
  - **Knockoff Disputes**: Courts would compare *systems*, not outlines. Infringement would require identical relational networks (e.g., all glyph spacing ratios), making most claims unprovable.  
  - **Design Teaching**: Students would learn glyphs as interdependent nodes in a system. Drawing a standalone 'a' would be meaningless—each letter must be designed *in concert* with others to define differences. Historical study would focus on systemic contrasts, not individual forms.  
  *Result*: Revivals as we know them—fluid reinterpretations—would cease, replaced by rigid replication of original systems.
