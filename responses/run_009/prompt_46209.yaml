answer: |-
  Below is a decision tree designed to help readers navigate their epistemic stance when facing disagreement. The tree starts from the shared root scenario and branches through concrete, position-agnostic questions. It identifies major epistemic positions and flags gaps in the logical space. The design uses **6 key questions** (with one follow-up for partial answers), balancing depth with accessibility for educated general readers.

  ---

  ### **Root Scenario**  
  *You have formed a confident judgment on a complex question (e.g., "Will this policy reduce inflation?"). You now learn that others—similarly informed and situated—disagree with you.*

  ---

  #### **Question 1: Track-Record Check**  
  *In your past judgments on similar questions, did you systematically track how often you and your peers were correct?*  
  - **Yes** → Go to Question 2.  
  - **No** → Go to Question 3.  

  #### **Question 2: Personal vs. Peer Track Records**  
  *When reviewing past judgments, do you weigh your own track record more heavily than peers’ records because you understand your reasoning better?*  
  - **Yes** → **Defer to Past Self’s Track Record**  
    - *Position*: You prioritize your personal history over others’ data. Disagreement matters less because you "know your own mind" better than outsiders.  
  - **No** → **Reference-Class Forecaster**  
    - *Position*: You trust aggregated peer data (e.g., "In cases like this, experts are right 60% of the time") over individual reasoning.  

  #### **Question 3: Reference-Class Availability**  
  *Can you draw on historical data from similar judgments (e.g., sports predictions, election forecasts, or policy outcomes) to estimate base rates of success?*  
  - **Yes** → **Reference-Class Forecaster**  
    - *Position*: You override private judgment with historical base rates (e.g., "Only 40% of bold new policies work as intended").  
  - **No** → Go to Question 4.  

  #### **Question 4: Reasoning Transparency**  
  *Do you feel your own reasoning is uniquely "transparent" to you (e.g., you see your assumptions clearly) in a way others’ reasoning isn’t?*  
  - **Yes** → **Inside-Viewer**  
    - *Position*: You trust your private logic over external disagreement. Others’ views are inputs but not decisive.  
  - **No** → Go to Question 5.  

  #### **Question 5: Better-Calibrated Dissenter**  
  *Suppose someone disagreeing with you has a verified, superior track record on this topic. How should their input affect your confidence?*  
  - **Adjust fully to match theirs** → **Full Deference to Better-Calibrated Others**  
    - *Position*: Calibration trumps private insight. A demonstrably better forecaster’s view replaces yours.  
  - **Adjust partially (e.g., split the difference)** → **Partial Deference to Better-Calibrated Others**  
    - *Position*: You blend your view with theirs, weighted by their expertise.  
  - **Not at all** → Go to Question 6.  

  #### **Question 6: Expertise-Selection Effect**  
  *If you were chosen for this role due to proven expertise (not luck), does that justify holding your view against a crowd of non-experts?*  
  - **Yes** → **Expert-Selection View**  
    - *Position*: Institutional selection (e.g., job title, past validation) shields you from non-expert crowds.  
  - **No** → **Unoccupied Cell**  
    - *Diagnosis*: Rejecting both personal insight *and* external calibration is incoherent for most. Rarely held, as it implies unwavering confidence without justification.  

  ---

  ### **Key Notes for Readers**  
  1. **Ambiguous Branch**: The tree cannot cleanly separate **Inside-Viewers** from **Partial Deferrers** when track records are untracked (Q1→Q3→Q4). Both may weigh private reasoning heavily, but Partial Deferrers compromise slightly with peers.  
  2. **Unoccupied Cell** (Q6→"No"): This stance is rare—it rejects all adjustment triggers (track records, transparency, calibration, expertise). It may stem from overconfidence or distrust in data.  
  3. **Missing Position**: The tree does not isolate **Pure Aggregators** (e.g., "Always average peer views"). This overlaps with **Reference-Class Forecasters** or **Partial Deferrers**, depending on data use.  

  ### **Why This Works**  
  - **Concrete Over Abstract**: Questions use tangible scenarios (e.g., "systematically track judgments," "verified superior track record").  
  - **Position-Neutral**: Branches avoid jargon (e.g., no "epistemic modesty" or "Bayesian").  
  - **Logical Gaps Flagged**: Unoccupied cells are diagnosed, not forced.  
  - **Efficiency**: 6 core questions (+1 optional branch) cover the core distinctions.  

  This tree reveals how readers *actually* reconcile disagreement—not just how philosophers say they should. By the end, readers can identify their stance and its tensions.
