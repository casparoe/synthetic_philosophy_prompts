prompt: |-
  I'm an evolutionary biologist — mostly pop genetics, some life-history trade-off work — and I keep hearing AI safety people talk about the "competitiveness constraint" and the "alignment tax." As I understand it, the idea is that you can't deploy safety measures that make your AI meaningfully worse than your rivals' AIs, because selection at the level of firms and countries weeds out anyone who actually pays the tax. Restate this whole debate in the vocabulary I actually use — fitness costs, selection gradients, trade-off frontiers, pleiotropy, hard vs soft selection, maybe mutation-selection balance — as faithfully as you can, and then give me the residue report. Is there anything in their argument that has no counterpart in my vocabulary, and if so, is that because my vocabulary is missing something or because their claim is less precise then it looks? I especially want to know whether the tax is even a good analogue of a fitness cost, since "paying a cost now for safety later" seems to presuppose foresight and coordination that selection pressures in my world just don't have. And is the race-dynamics stuff they talk about a genuine case of Red Queen dynamics or is that a stretch? Please answer as a numbered list of exactly five items, each a sentence or two, no intro or conclusion — I'd suggest four items of translation and one for the residue, but the split is your call.
