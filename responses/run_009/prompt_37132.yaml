prompt: |-
  A friend of mine (philosophy undergrad, very confident guy) tried to explain Aristotle's doctrine of natural slavery to me after class and I want to check how much of it I can actually trust before I use any of it in an essay. Here's roughly what he said: Aristotle believed that some people are born as natural slaves, meaning they have no rational capacity whatsoever, more like livestock than people. Since they can't reason, they can't have a good of their own, so their lives go best when they're completely subordinated to a master who does all their thinking for them. That's why he described slaves as basically just tools — no different from an axe, except alive. He also applied this to whole populations, claiming that all non-Greeks were natural slaves by nature, and the upshot of the whole doctrine was that the slave system in Athens was perfectly fine and the masters had no obligations to their slaves beyond keeping them fed. My friend concluded by saying this is why Aristotle is basically useless as a moral philosopher on anything political.

  Some of this sounds like it might be flattened or exaggerated, but I honestly can't tell which parts. Like I know Aristotle talks about the slave being able to "perceive" reason even if he can't deliberate, which seems to contradict the livestock comparison? And I vaguely remember the doctrine is supposed to be in tension with actual Greek practice somehow. Could you go through my friend's version piece by piece — what a scholar of the Politics would accept, what they'd call a simplification, and what's just wrong — and then tell me whether his conclusion about Aristotle being useless politically follows from whatever accurate bits remain? Also if you can flag which bits are genuinely contested among interpreters vs settled, that would help me not embarass myself in the essay.
