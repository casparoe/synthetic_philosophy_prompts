prompt: |-
  I coordinate the testing center at a mid-sized community college, and I've spent the last few years chewing on a problem I stumbled into without meaning to. Some years back I read a magazine piece about two philosophers who argued that a notebook could literally be part of someone's mind: they described an older man with memory problems who wrote everything down in a binder, and argued that since the binder did everything for him that other people's biological memory does for them — was always with him, was consulted automatically, was trusted without double-checking — it wasn't a tool he used to think with but a part of his thinking itself. I have no philosophy training, so I can't tell you whether that's a respected view or a fringe one, but it has refused to leave me alone, because it lands right on my desk every semester.

  Here is the situation. My office receives dozens of accommodation requests a term, and a growing share of them are about memory and organization: students with concussions, ADHD, stroke recovery, anxiety that blanks them out under pressure. Many of these students have built elaborate external systems — paper planners with color codes, a phone app that photographs the whiteboard every class, a smartwatch that buzzes with the next step of every task. Under exam rules we confiscate exactly those things. Whether that's fair is supposed to depend on whether the item is an "accommodation," but that word only pushes the question back, because it never tells me what the item is an accommodation of. If the philosophers I read are right, then for some students the planner isn't helping them remember the way a ladder helps someone climb; it's the remembering. Taking it away during a closed-book exam isn't removing a shortcut, it's removing part of the student's mind and then testing the remainder.

  I also have my own question, which I privately call the stolen-backpack question: when the student's system is lost or broken, does the student act like someone whose bicycle was stolen (annoyed, but they can still walk) or someone who lost a limb (not the same functioning person until it's replaced)? I suspect the students I should worry about are the second kind. But I can see that my question and the philosophers' criteria can pull apart, and I don't know which should win.

  What I need from you is a decision procedure my front-desk staff — two student workers and one part-time proctor, none of them philosophers — could actually run on a request, in about ten minutes, before the exam. It should turn whatever the extended-mind idea has to offer into an ordered set of questions: what to ask, what counts as a sufficient answer to each, where the procedure stops with a "no," and where it has to hand the file to me because the remaining question is about values rather than facts. It also has to be honest about the hard boundary: a closed-book exam is, in a sense, an institution deliberately testing the biological core rather than the whole extended person, so the procedure can't just say "if it's part of his mind, he gets it" — it needs a principled place to stop, and I want that place marked and defended, not smuggled in.

  Then run the procedure on three cases. First: a student recovering from a concussion whose doctor documented a memory impairment, and who wants her paper day-planner, which contains her checklists for everything in her life, on the desk during a closed-book nursing exam; her instructor is certain this is cheating. Second: a student with ADHD whose entire life — course notes included, pasted in alongside everything else — lives in the notes app on his phone, and who wants the phone in a statistics exam where recalling formulas is the point. Third, the one that keeps me up at night: a student who, after a stroke, had the course's formula sheet tattooed on his forearm and wants to take the exam with bare arms, and whose neurologist says he's relied on it for two years exactly the way the others rely on their planners. If the procedure approves the first two, I can see it having to approve the third, and I don't like that answer — so either show me where the procedure legitimately stops him, or show me exactly where my discomfort is doing the work that the procedure refuses to do. Finally, tell me plainly what this procedure cannot settle, and where my stolen-backpack question fits in if it fits at all. Please write the whole thing in American English, at a level my student workers can follow without dumbing down the ideas underneath.
reasoning: |-
  Okay, let me approach this systematically. The user presents a complex philosophical and practical dilemma about testing accommodations with profound implications for how we define cognition and fairness. 

  First, I need to grasp the core tension: the extended mind theory (where external tools can be part of cognition) versus institutional assessment norms (which prioritize biological recall). The user isn't just asking for theoretical discussion - they need an implementable decision procedure for frontline staff.

  Key challenges emerge:
  - Distinguishing between cognitive extensions (integrated like memory) versus mere tools
  - Addressing the "stolen backpack" test of functional dependence
  - Handling edge cases like the tattooed formula sheet that expose institutional boundaries

  The procedure must have clear checkpoints:
  1. Verify disability documentation (medical gate)
  2. Assess functional integration (the "automaticity" criterion from philosophy)
  3. Evaluate tool indispensability (the stolen-backpack test)
  4. Contain institutional boundaries (the "biological core" principle)

  For the three test cases:
  - The concussion patient's planner likely passes all checks
  - The ADHD student's phone fails the automaticity test (notes aren't integrated cognition)
  - The tattoo case triggers the institutional boundary - it's literally inseparable from the body but violates assessment intent

  Crucially, the procedure must flag when values decisions are needed (e.g., redefining what "closed-book" means) rather than pretending these are purely factual determinations. The discomfort around the tattoo case is legitimate - it reveals where institutional purposes must override philosophical consistency.
answer: |-
  Here's a decision procedure for your staff, designed as a flowchart with clear questions and thresholds. It integrates the extended mind concept with practical constraints, written in plain American English.

  ---

  **Extended Mind Accommodation Procedure (EMAP)**  
  *For memory/organization accommodation requests during closed-book exams*

  **Staff Instructions:**  
  1. Follow steps in order.  
  2. Stop at first "NO" unless specified.  
  3. If Step 4 is passed, escalate to coordinator.  
  4. Maximum review time: 10 minutes per request.  

  ---

  **STEP 1: MEDICAL NECESSITY**  
  *Ask: "Is there documented disability-related functional impairment (memory/organization) from a qualified provider?"*  
  - **YES** (with current documentation): Proceed to Step 2.  
  - **NO**: Deny. *Reason: No established disability basis.*  

  **STEP 2: TOOL INTEGRATION**  
  *Ask: "Is this tool consistently used for daily cognitive function (not just academics)? Describe 3 non-school examples."*  
  - **YES** (e.g., "uses planner for meds, chores, appointments; phone for bills, travel, family events"): Proceed to Step 3.  
  - **NO** (e.g., "only uses for homework/lectures"): Deny. *Reason: Academic aid only, not integrated cognition.*  

  **STEP 3: AUTOMATICITY TEST**  
  *Ask: "Is the tool accessed without conscious effort (like biological memory) and trusted without verification?"*  
  - **YES** (e.g., "instinctively checks planner when disoriented; doesn't cross-check tattooed formulas"): Proceed to Step 4.  
  - **NO** (e.g., "double-checks app against textbook; manually searches notes"): Deny. *Reason: Tool requires active management.*  

  **STEP 4: IRREPLACEABILITY (STOLEN BACKPACK TEST)**  
  *Ask: "If this tool broke/lost, would the student be functionally incapacitated in daily life until replaced?"*  
  - **YES** (e.g., "misses meals/meds; can't work or commute"): **ESCALATE TO COORDINATOR**  
  - **NO** (e.g., "could reconstruct systems temporarily"): Deny. *Reason: Functional redundancy exists.*  

  **STEP 5: COORDINATOR REVIEW (VALUES BOUNDARY)**  
  *Coordinator assesses:*  
  - **INSTITUTIONAL PURPOSE**: Does the tool replace the exact cognitive skill being tested?  
  - **ALTERNATIVES**: Can the need be met without violating exam integrity? (e.g., separate memory aid sheet)  
  - **BOUNDARY RULE**: Tools that fundamentally redefine the tested skill *cannot* be permitted, even if integrated.  

  ---

  **APPLYING THE PROCEDURE TO YOUR CASES**  

  **Case 1: Concussion Recovery & Paper Planner**  
  - Step 1: **YES** (documented memory impairment)  
  - Step 2: **YES** (used for "everything in life")  
  - Step 3: **YES** (consulted automatically, trusted)  
  - Step 4: **YES** (without it, she'd miss meds/appointments) → **ESCALATE**  
  - *Coordinator Decision*: **APPROVE with conditions**. Planner allowed but inspected for course-specific notes. *Rationale: Tests nursing knowledge, not organizational memory. Institutional boundary not crossed.*  

  **Case 2: ADHD Student & Phone Notes App**  
  - Step 1: **YES** (ADHD documented)  
  - Step 2: **YES** ("entire life" in app)  
  - Step 3: **NO** → **DENY**  
  - *Why*: Phone requires active searching/managing data. Photos and notes are referenced deliberately, not "automatically" like recall. Instructor's concern about formulas is valid – app replaces skill being tested.  

  **Case 3: Stroke Survivor & Formula Tattoo**  
  - Step 1: **YES** (stroke documented)  
  - Step 2: **YES** (used daily for 2 years)  
  - Step 3: **YES** (neurologist confirms automatic use)  
  - Step 4: **YES** (without it, cannot perform job tasks) → **ESCALATE**  
  - *Coordinator Decision*: **DENY**. *Rationale: Statistics exam explicitly tests formula recall. The tattoo isn't just an extension of memory – it replaces the tested skill itself. Institutional boundary requires testing biological recall here.*  

  ---

  **WHAT THE PROCEDURE CANNOT SETTLE (AND WHERE YOUR QUESTION FITS)**  
  1. **Values Conflicts**: EMAP identifies integrated tools but cannot resolve when institutional goals (testing raw recall) override integration. That’s why Step 5 exists – you must weigh "what this exam is for."  
  2. **The Stolen-Backpack Test**: This is deliberately placed at Step 4. It screens for *functional indispensability*, separating true cognitive integration (limb-like) from convenience (bicycle-like). It fits as a practical validator of integration claims.  
  3. **The Tattoo Dilemma**: Your discomfort is legitimate and *should* override the procedure. EMAP flags integration, but the coordinator must enforce the hard boundary: if a tool eliminates the skill being assessed, it invalidates the exam’s purpose. The tattoo case exposes where philosophy clashes with institutional reality – and reality wins.  

  **HONEST BOUNDARY MARKER**  
  Closed-book exams test the biological student’s unaided cognition. EMAP approves tools only when:  
  - They compensate for a *disability-related impairment* (not preference)  
  - They function as *automatic, integrated memory*  
  - They *don’t replace the specific competency being measured*  
  The procedure stops at the institution’s right to define what it assesses.  

  ---  
  **Final note for your staff**: This isn’t about judging "real" disabilities. It’s about drawing a bright line: if the tool does the brain’s job *for the exact thing the test measures*, it stays out. When in doubt at Steps 2-4, escalate. Your stolen-backpack instinct? That’s your best tool for Step 4 – trust it.
