answer: |-
  Below is a decision tree designed to help students explore their views on the badness of human extinction beyond the deaths it involves, based on Samuel Scheffler's *Death and the Afterlife* and related philosophical positions. The tree uses concrete cases to route students to a position without asking about theories or labels. It tests the four axes: (a) awareness dependence, (b) cultural/national continuity, (c) source of value (projects vs. future experiences), and (d) temporal symmetry. 

  The tree has **8 branch nodes** (questions) and **7 leaf nodes** (positions). It should take students ~5 minutes to complete. Each branch node presents a hypothetical case; answer the cases based on your intuitions. The positions include the required four (strict addition-only, Scheffler's conjecture, legacy view, impersonal-value view) plus three others to cover the logical space. 

  **Instructions:** Start at Q0. Answer each question honestly based on your immediate reaction to the case. Proceed to the next question based on your answer until you reach a leaf (position).

  ---

  ### **Q0: Initial Extinction Badness**
  *Imagine human extinction occurs in 500 years, eliminating all future people. Beyond the deaths of those who die in the extinction event, is there anything else bad about this?*
  - **No → Leaf 1: Strict addition-only view**  
    (Extinction is nothing over and above the deaths it comprises; no further badness exists.)
  - **Yes → Proceed to Q1.**

  ### **Q1: Unaware Extinction**
  *Suppose extinction occurs in 500 years, but no one—including you—will ever know about it in advance (e.g., it results from an undetectable asteroid). Beyond the deaths, is this extinction still bad?*
  - **No → Proceed to Q2.**  
    (Badness depends on awareness: it only arises if people believe extinction is coming.)
  - **Yes → Proceed to Q3.**  
    (Badness exists independently of awareness.)

  ### **Q2: Doomsday Scenario (Awareness Check)**
  *In Scheffler's doomsday case: You live a normal lifespan, but 30 days after your death, everyone else dies. If you knew this in advance, would activities like scientific research, creating art, or pursuing social justice feel pointless to you?*
  - **Yes → Proceed to Q4.**  
    (Badness arises from awareness undermining your projects' meaning.)
  - **No → Proceed to Q5.**  
    (Awareness of extinction is bad, but not because it affects your projects.)

  ### **Q3: Projects vs. Future Value**
  *Compare two futures:  
  (A) Humanity continues for millennia, but none of humanity's current projects (e.g., your work, cultural traditions) will have lasting impact.  
  (B) Humanity goes extinct in 500 years.  
  Beyond deaths, is (B) worse than (A) in a non-death-related way?*
  - **Yes → Proceed to Q6.**  
    (Badness includes loss of valuable future experiences, not just projects.)
  - **No → Proceed to Q7.**  
    (Badness is primarily about projects losing their potential impact.)

  ### **Q4: Cultural Continuity in Infertility**
  *In Scheffler's infertility case: No new children are born, but everyone alive lives a full life. If you knew this in advance, would activities like those in Q2 feel pointless even if the (now-impossible) future generations would have been strangers in distant nations with no cultural ties to you?*
  - **Yes → Leaf 2: Scheffler's afterlife conjecture**  
    (Our present values depend on a "collective afterlife"—any human future satisfies this, regardless of cultural continuity.)
  - **No → Leaf 3: Cultural legacy view**  
    (Our present values depend on cultural/national continuity; a future of strangers does not provide meaning.)

  ### **Q5: Awareness Without Project Loss**
  *In the doomsday scenario (Q2), even if your projects don’t feel pointless, is the loss of future people’s valuable experiences (e.g., joy, discovery) still bad beyond the deaths?*
  - **Yes → Leaf 4: Awareness-constrained impersonal view**  
    (The loss of future value is bad, but only if we are aware of it; awareness makes the loss salient or grievable.)
  - **No → Leaf 7: Other views**  
    (Your answers don't fit common positions; e.g., you see badness requiring awareness but attribute it to something else.)

  ### **Q6: Past Loss Symmetry**
  *Suppose a past catastrophe (e.g., an ancient library burned) caused the permanent loss of valuable human experiences (e.g., art, knowledge) but did not alter subsequent history beyond that loss. Beyond the deaths, is this past loss bad in a non-death-related way?*
  - **Yes → Leaf 5: Impersonal-value view (symmetric)**  
    (The loss of valuable experiences is bad whenever it occurs—past or future—independent of effects on us.)
  - **No → Leaf 6: Impersonal-value view (future-only)**  
    (The loss of future valuable experiences is bad, but past losses are not, even if identical.)

  ### **Q7: Legacy Loss Without Extinction**
  *In future (A) from Q3 (humanity continues but current projects have no lasting impact), is there non-death-related badness?*
  - **Yes → Leaf 3: Legacy view**  
    (The loss of your projects' potential impact is inherently bad, even without extinction or awareness.)
  - **No → Leaf 7: Other views**  
    (Your answers are inconsistent or rare; e.g., you see extinction as bad but not the loss of projects' impact in Q3.)

  ---

  ### **Position Descriptions (Leaves):**
  1. **Strict addition-only view**: Extinction is only bad due to the deaths; no further badness exists.
  2. **Scheffler's afterlife conjecture**: Extinction undermines present values because our projects depend on a collective human future (any human future suffices).
  3. **Legacy view**: Extinction is bad because it severs the continuity needed for our projects to have lasting meaning (cultural/national ties may matter). *[Combines cultural and non-cultural versions based on branching.]*
  4. **Awareness-constrained impersonal view**: The loss of future value is bad, but only if we are aware of it.
  5. **Impersonal-value view (symmetric)**: The loss of valuable experiences (past or future) is bad, regardless of awareness or projects.
  6. **Impersonal-value view (future-only)**: The loss of future valuable experiences is bad (without awareness dependence), but past losses are not.
  7. **Other views**: Your intuitions don't align with common positions; re-examine your answers or explore fringe theories.

  ---

  ### **Design Notes:**
  - **Unseparated Positions**: The tree cannot cleanly separate the **legacy view** (Leaf 3) from **Scheffler's conjecture** (Leaf 2) when cultural continuity matters. If a student endorses cultural continuity in Q4 (leading to Leaf 3), it may still be a variant of Scheffler's dependence on the future, but Scheffler's official view (Leaf 2) rejects cultural requirements. I flag this instead of forcing a distinction.
    
  - **Vacant Position Combination**:  
    **Leaf 6 (Impersonal-value view, future-only)** has no clear real-world proponents. The vacancy likely reflects **unattractiveness/unexplored territory**: Temporal asymmetry (valuing future but not past losses) is hard to defend without arbitrariness, making it rare in philosophy.

  - **Efficiency**: The tree uses 8 nodes and 7 leaves, fitting the constraints. It tests all four axes:  
    - (a) Awareness: Q1 and branching.  
    - (b) Cultural continuity: Q4.  
    - (c) Projects vs. future value: Q3 and Q7.  
    - (d) Temporal symmetry: Q6.  

  Students are sorted by their case responses, not theoretical preferences. For discussion: Compare leaves and debate why certain intuitions lead to inconsistencies or unpopular views (e.g., Leaf 6 or Leaf 4).
