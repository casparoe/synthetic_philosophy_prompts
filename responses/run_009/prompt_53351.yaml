  Ah, here's the rub: their disagreement is ontological masquerading as architectural. Global workspace treats "conscious information" as a real category with distinctive effects (integration, access). Dennett sees this as reifying a folk concept - for him, there's only "cerebral celebrity" without qualitative difference. 

