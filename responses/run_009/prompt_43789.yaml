prompt: |-
  I've been reading rationalist blogs and forums since the Overcoming Bias days, and no recurring debate there has confused me more than the one about uploads. Someone proposes whole brain emulation: scan a brain, simulate it, and since the brain is "just wetware implementing computations," the simulation thinks. Then a skeptic replies that this proves far too much: with enough ingenuity you can describe the causal dynamics of a wall — or a bucket of water, or the weather — so that its states map onto the formal structure of any program you like, and the mapping is as faithful as the one between the brain and its simulation. So if implementing the right computation suffices for mind, the wall thinks everything, and the claim that the brain is a computer stops discriminating between anything. The defenders protest that this is too quick, and the thread dies with no one spelling out what the actual rejoinder is.

  What I want to know is whether this argument pattern — roughly, "a claim of the form X implements Y is made non-trivial only by some restriction on which descriptions count as implementations, and absent an account of that restriction, the claim collapses into triviality" — has an established name and literature. It resembles the underdetermination of theory by evidence, but I don't think it's that: the issue isn't that the data fail to decide between theories, but that the interpretation relation seems unconstrained on one end, so that the same physical system can be read as computing anything whatever if we're free to gerrymander the description. I've since seen the same shape well outside the mind debates: someone says a market "implements" an optimization process, or that evolution "computes" fitness maxima, and a critic replies that by that standard every dynamical system computes something.

  If there is a recognized term, tell me what it is, who developed it, and how it bears on the upload case — in particular whether anyone has said precisely what distinguishes the brain's causal organization from a wall's such that only one counts as computing, and whether the standard responses actually succeed or merely push the problem back a level. If there is no established name, coin one, define it so that it is carved off from underdetermination, from conventionalism about mere words, and from an ordinary appeal to simplicity, and then give the boundary cases: when is a restriction on acceptable interpretations a substantive discovery about the physical system, and when is it just an ad hoc fence built to protect a thesis? Please close your reply with a final line in the form \answer{...} containing only the term you settle on — either the established name or your coinage — with nothing else on that line.
reasoning: |-
  We are dealing with a recurring debate about whether a physical system (like a brain) can be said to implement a computation (like a mind) and the challenge that if we allow arbitrary mappings then any physical system can be seen as implementing any computation. This challenge is often used to argue that the claim "the brain is a computer" is trivial because by the same token a wall or a bucket of water could be said to compute anything.

  The pattern of argument is: 
  1. A claim that system X implements computation Y (e.g., the brain implements a mind).
  2. A skeptic argues that if we allow arbitrary mappings (i.e., arbitrary ways of describing the physical states and their transitions) then any physical system can be interpreted as implementing any computation. Hence, the claim becomes trivial because it doesn't discriminate between systems.

  This pattern is not exactly underdetermination of theory by evidence. It's about the underdetermination of the computational interpretation by the physical system.

  I recall that in the philosophy of mind and philosophy of computation, this issue is known as the "triviality argument" or the "pancomputationalism" problem. Specifically, the idea that everything computes (and thus the claim that the brain computes is trivial) is called "pancomputationalism". However, the argument that challenges the non-triviality of computational implementation is often referred to as the "triviality argument".

  But I think the more precise term for the pattern of argument you are describing is the **"triviality of implementation"** or **"implementation problem"**. However, there is a well-known philosophical discussion by Hilary Putnam (in his book "Representation and Reality", 1988) where he argues that every ordinary open system implements every finite automaton. This is sometimes called **Putnam's triviality theorem** or **Putnam's realization argument**.

  In that argument, Putnam shows that if we are allowed to arbitrarily map the physical states of a system (like a rock) to the states of a finite automaton, then we can interpret the rock as implementing any finite automaton we like. This leads to the conclusion that computational functionalism (the idea that mental states are computational states) is trivial because it would mean that rocks have mental states too.

  So, the established name for this argument pattern is **Putnam's triviality argument** or the **triviality of implementation**.

  But note that this argument has been addressed by several philosophers. One prominent response is due to David Chalmers (in his 1996 book "The Conscious Mind" and in a 1994 paper "On Implementing a Computation") and also by Ned Block (in his 1978 paper "Troubles with Functionalism"). 

  Chalmers, in particular, argues that for a physical system to genuinely implement a computation, there must be a causal structure in the physical system that mirrors the formal structure of the computation. The mapping must be such that the state transitions in the physical system are causally responsible for the transitions and must be counterfactually supporting. That is, if the system had been in a different state, it would have transitioned appropriately. Moreover, the states must be grouped in a way that is natural and not gerrymandered. So, for the brain, the neural states and their causal transitions naturally map to the computational states of a mind program, whereas for a wall, the mapping would require such arbitrary groupings of microstates that it doesn't reflect any causal structure of the wall.

  Thus, the restriction is that the implementation must be based on a **causal isomorphism** and the states must be **natural kinds** (or at least non-arbitrary) in the physical system.

  In the upload case, the defender would argue that the brain emulation is based on a detailed scan that captures the causal structure of the brain at a neural (or sub-neural) level, and the simulation then replicates that causal structure. A wall does not have a causal structure that naturally supports the state transitions of a mind program without arbitrary grouping.

  However, the skeptic might push back and say that what counts as "natural" is vague and that the causal structure of the wall could be described in a way that is non-arbitrary if we choose a different level of description. This is where the debate often continues.

  So, to summarize:
  - The established name for the argument pattern is **Putnam's triviality argument** (or sometimes the **triviality of implementation**).
  - It was developed by Hilary Putnam in the 1980s.
  - The rejoinder by Chalmers and others is to require that the implementation map must be based on the causal structure of the physical system and must not be arbitrary.

  Now, for the boundary cases: 
  - A restriction on acceptable interpretations is a substantive discovery about the physical system when the system indeed has a causal structure that is isomorphic to the computation and when the states we pick out correspond to natural groupings of physical states (e.g., neurons firing or electronic states in a computer). 
  - It becomes an ad hoc fence when we cannot point to a causal structure that supports the computation and we are just grouping states arbitrarily to force the mapping.

  Therefore, the term I settle on is **Putnam's triviality argument**.

  But note: the pattern you describe is also sometimes called the **"problem of implementation"** or the **"implementation challenge"**. However, given the historical context and the specific argument by Putnam, I believe "Putnam's triviality argument" is the most established term.

  So, I will close with:

  \answer{Putnam's triviality argument}
answer: |-
  The argument pattern you describe, where a claim that a physical system X implements a computation Y is challenged on the grounds that arbitrary mappings render such implementations trivial and universal (e.g., a wall "computing" any program), is a well-known issue in philosophy of mind, computation, and cognitive science. The established name for this problem is **Putnam's triviality argument**, named after Hilary Putnam, who developed it in his 1988 book *Representation and Reality*. Putnam demonstrated that if any physical system can be described as implementing any finite automaton via gerrymandered state mappings, then computational functionalism (the view that mental states are computational states) collapses into pancomputationalism—the idea that every physical system implements every computation, rendering claims about specific implementations (e.g., brains producing minds) vacuous.

  ### Key Aspects of the Argument:
  1. **Core Problem**: The argument hinges on the **underdetermination of computational interpretations by physical systems**. Unlike underdetermination of theory by evidence (which concerns empirical equivalence), this focuses on the lack of constraints on how physical states are mapped to computational states. Without restrictions, a single physical system (e.g., a wall) can be "interpreted" as running any computation by arbitrarily grouping microstates or redefining transitions.
  2. **Bearing on Uploads**: In the upload debate, Putnam's triviality argument challenges whether brain emulation is a meaningful implementation of a mind. If any system (like a wall) can be mapped to the "computation" of a mind, then the brain's simulation is not special. Defenders (e.g., David Chalmers) respond by imposing constraints: an implementation must reflect a **causal structure isomorphism**—where the physical system's state transitions reliably and counterfactually support the computational transitions under a **non-arbitrary mapping**. For uploads, this requires that the brain's causal dynamics (e.g., neural firing patterns) naturally align with the simulated computation, whereas a wall's dynamics do not without gerrymandering.
  3. **Standard Responses and Their Success**:
     - **Chalmers' Causal Account**: David Chalmers (in papers like "On Implementing a Computation," 1994) argues that an implementation must satisfy **causal counterfactuals**: the physical states must be grouped such that (i) transitions are causally determined by the system's intrinsic properties, and (ii) the mapping is robust under minor perturbations. This distinguishes brains (with structured, high-level causal states) from walls (where mappings require ad hoc, microstate-level groupings).
     - **Block's Combinatorial Constraint**: Ned Block emphasizes that computational states must correspond to **"natural" physical kinds** (e.g., neurons or transistors) rather than disjunctive sets (e.g., arbitrary collections of atoms). This rules out gerrymandered mappings.
     - **Critique of Responses**: These responses **push the problem back a level** but do not fully resolve it. Skeptics argue that "causal structure" and "natural kinds" are vague or observer-dependent. For instance, what counts as "non-arbitrary" may depend on pragmatic or contextual factors, risking ad hoc protections for favored theories (e.g., uploads).

  ### Boundary Cases: When Is a Restriction Substantive vs. Ad Hoc?
  - **Substantive Discovery**: A restriction is substantive if it identifies an **intrinsic, observer-independent feature** of the physical system that objectively constrains mappings. Example: A digital computer's logic gates have a causal structure that supports specific computations (e.g., addition) but not others (e.g., simulating consciousness) without hardware changes. This is falsifiable and empirically grounded.
  - **Ad Hoc Fence**: A restriction is ad hoc if it is **tailored solely to protect a thesis** without independent justification. Example: Insisting that only "biologically natural" neural groupings count for brain emulation, while dismissing similar constraints for artificial systems, without empirical or theoretical basis.

  ### Distinction from Related Concepts:
  - **Conventionalism**: Putnam's triviality is not about words being arbitrary (e.g., "water" vs. "H₂O") but about the non-uniqueness of computational interpretations.
  - **Simplicity**: While simplicity (e.g., preferring parsimonious mappings) is often invoked to avoid gerrymandering, it is insufficient alone; causal constraints are necessary to avoid subjectivity.
  - **Pancomputationalism**: This is the *consequence* of unconstrained mappings (everything computes everything), but Putnam's argument is the *reductio ad absurdum* that forces constraints.

  ### Conclusion:
  Putnam's triviality argument remains influential and unresolved. It shows that computational claims require a theory of implementation constraints to avoid triviality. In upload debates, defenders must specify why brain scans yield non-arbitrary mappings while wall-mappings do not, but success is partial due to lingering ambiguities in "causal structure." The argument pattern is a caution against inflationary interpretations of computation in domains like evolution or markets.

  \answer{Putnam's triviality argument}
