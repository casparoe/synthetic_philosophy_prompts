  First, I need to recall the main positions in peer disagreement: conciliationism, steadfast views, total evidence, right-reasons, etc. Each leaf should have a one-sentence note on its awkward commitment, like self-undermining for conciliationism or dogmatism for steadfastness. Also, the user wants to flag any leaves that the tree can't separate and suggest a question to distinguish them.

  The user provided example branch nodes: mental-math case, subset of evidence, IQ differences, applicability to meta-disagreements, and domain differences (math, empirical, moral, religious). These need to be integrated into the tree logically. Starting from discovering a peer disagrees, the first split could be about whether confidence should drop immediately. That leads to conciliationism vs. other views.

  Next, handling the mental-math scenario is crucial. If the user thinks confidence should drop even after rechecking, that points to strong conciliationism. If not, then maybe steadfast or total evidence views. The evidence subset question might differentiate total evidence from others. IQ differences could test if higher IQ sways the user, indicating reliance on external factors.

  Domain specificity is another branch. If the user applies the same policy across domains, it's a uniform approach; if not, it's context-dependent. The meta-disagreement point is important for self-application. If a policy can't be applied to itself, it might face self-undermining issues.

  I should check for overlapping positions. For example, moderate conciliation and total evidence might be tricky to separate. Adding a question about whether the disagreement itself is evidence could help. If yes, total evidence; if no, moderate conciliation. Also, right-reasons view might be confused with steadfastness, so emphasizing checking reasoning versus external factors.

  The user wants 10-12 nodes. I need to map out the branches without making it too complex. Including questions about evidence subsets, IQ, and domain applicability should cover the necessary splits. Each leaf must be named clearly with its awkward commitment. For instance, Right Reasons View's dogmatism worry or Conciliationism's self-undermining.

  Also, the user mentioned hybrids. Maybe a branch where someone considers evidence subsets and domain specificity leads to a hybrid view. Ensuring that the tree generates such hybrids is important. For example, someone might be conciliatory in empirical domains but steadfast in moral ones.

  Finally, testing the tree for clarity. Making sure each question is answerable without prior knowledge of labels. Questions like "Should your confidence drop immediately?" or "Does higher IQ matter?" are concrete. The end goal is readers arriving at their policy through their answers, not self-labeling.
answer: |-
  Here’s a diagnostic decision tree for peer disagreement, designed to sort readers by their intuitive responses to concrete cases. It has **12 nodes** and covers major positions while flagging ambiguities.

  ---

  ### **Peer Disagreement Diagnostic Tree**  
  **Start:** You discover an epistemic peer disagrees with you about proposition P.  

  1. **Node 1: Initial Reaction**  
     *Should your confidence in P drop significantly (e.g., ≥20%) immediately?*  
     - **Yes** → Go to Node 2  
     - **No** → Go to Node 7  

  2. **Node 2: Mental Math Case**  
     *After rechecking your reasoning flawlessly, you find no error in your peer’s work. Should you move to 50% confidence?*  
     - **Yes** → Go to Node 3  
     - **No** → **Position: Moderate Conciliationism**  
       *Awkward commitment: Must explain why conciliation isn’t total despite symmetry.*  

  3. **Node 3: Evidence Subset Test**  
     *You learn your peer’s evidence is a strict SUBSET of yours (e.g., they lack a key study). May you "hold firm"?*  
     - **Yes** → **Position: Total Evidence View**  
       *Awkward commitment: Risks overconfidence if "subset" judgments are unreliable.*  
     - **No** → Go to Node 4  

  4. **Node 4: IQ Asymmetry**  
     *You learn your peer has a higher IQ. Should this amplify your conciliation?*  
     - **Yes** → **Position: Calibrated Conciliationism**  
       *Awkward commitment: Requires quantifying "peer" traits (IQ, diligence) objectively.*  
     - **No** → Go to Node 5  

  5. **Node 5: Domain Generalization**  
     *Is your policy identical for mathematical, empirical, AND moral/religious P?*  
     - **Yes** → **Position: Equal-Weight Conciliationism**  
       *Awkward commitment: Self-undermining (if peers reject conciliationism, you must doubt it).*  
     - **No (treats moral/religious differently)** → **Position: Contextual Conciliationism**  
       *Awkward commitment: Must justify why some domains suspend peer symmetry.*  

  ---

  6. **Node 6 (From Node 1 "No"): Recheck Outcome**  
     *After re-examining your reasoning, you still find no flaw. May you dismiss your peer’s view?*  
     - **Yes** → Go to Node 8  
     - **No** → Go to Node 9  

  7. **Node 7 (From Node 1 "No"): Higher Peer IQ**  
     *You learn your peer has a higher IQ. Should you conciliate MORE?*  
     - **Yes** → Go to Node 10  
     - **No** → Go to Node 11  

  8. **Node 8 (From Node 6 "Yes"): Meta-Disagreement Consistency**  
     *Must your policy apply to disagreements ABOUT peer disagreement itself?*  
     - **Yes** → **Position: Right Reasons View**  
       *Awkward commitment: Dogmatism worry—risks ignoring peers if you’re wrong.*  
     - **No** → **Position: Hybrid Steadfastness**  
       *Awkward commitment: Ad hoc exemption for meta-disagreements.*  

  9. **Node 9 (From Node 6 "No"): Evidence Superset**  
     *You learn your peer has STRONGER evidence (e.g., extra data). Must you defer?*  
     - **Yes** → **Position: Evidence-Weighted Steadfastness**  
       *Awkward commitment: Blurs into conciliationism when evidence gaps are clear.*  
     - **No** → **Position: Unmoved Reasoning View**  
       *Awkward commitment: Persists even when peer evidence objectively dominates.*  

  ---

  10. **Node 10 (From Node 7 "Yes"): Domain Specificity**  
      *Does higher peer IQ matter EQUALLY for all types of P?*  
      - **Yes** → **Position: Calibrated Steadfastness**  
        *Awkward commitment: Still rejects initial conciliation but weights traits asymmetrically.*  
      - **No (matters less for morals/religion)** → **Position: Domain-Relative Relativism**  
        *Awkward commitment: Denies objective peer status in "subjective" domains.*  

  11. **Node 11 (From Node 7 "No"): Peer’s Evidence Subset**  
      *If your peer’s evidence is a strict SUBSET of yours, may you disregard their view?*  
      - **Yes** → **Position: Justificationist View**  
        *Awkward commitment: Assumes you can reliably compare evidence sets.*  
      - **No** → Go to Node 12  

  12. **Node 12: Disagreement as Evidence**  
      *Is the mere fact of peer disagreement itself evidence against P?*  
      - **Yes** → **Position: Moderate Conciliationism**  
        *Awkward commitment: Quantifying how much disagreement counts as evidence.*  
      - **No** → **Position: Right Reasons View**  
        *Awkward commitment: No inherent weight to disagreement if your reasoning seems sound.*  

  ---

  ### **Ambiguous Splits & Further Tests**  
  - **Moderate Conciliationism vs. Total Evidence View**: These converge if Node 3 ("evidence subset") is answered "no" *and* Node 12 ("disagreement as evidence") is answered "yes." **Prising apart**: Ask: *If both have identical evidence, must you conciliate to 50%?* (Total Evidence says "no" if your reasoning is better; Moderate Conciliation says "yes").  
  - **Calibrated Views (Nodes 4 & 10)**: Risk conflating IQ with reliability. **Clarifier**: *If peer has higher IQ but a history of bias on P-like topics, does IQ still dominate?*  
  - **Right Reasons vs. Steadfast Hybrid (Node 8)**: Turns on whether meta-disagreement is special. **Test case**: *Disagreement about logic (e.g., Bayesian reasoning)—same policy?*  

  ### **Key Features**  
  - **Labels emerge from cases**, avoiding self-identification bias.  
  - **"Awkward commitments"** highlight tradeoffs (e.g., conciliationism’s self-undermining).  
  - **Domain sensitivity** (Nodes 5, 10) captures moral/religious exceptionalism.  
  - **Evidence/IQ asymmetries** (Nodes 3, 4, 7, 11) test consistency.  

  Readers land on 9 distinct leaves, revealing their implicit policy through concrete choices—not labels.
