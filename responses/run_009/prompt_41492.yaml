answer: |-
  (1) An object moves continuously along a path; at any exact instant *t* during its motion, it occupies a precise position *p*, yet simultaneously does not occupy *p* exclusively due to its inherent state of change.  
  (2) Derivation for *P* ("occupies *p* at *t*"): From the continuity of motion, at every instant *t*, the object must be located at *some* definite point *p* (Premise: motion requires a determinate position at each instant). Derivation for ¬*P* ("does not occupy *p* at *t*"): Motion implies transition; if the object occupied *p* exclusively at *t*, it would be at rest, contradicting its motion (Premise: motion excludes instantaneous rest).  
  (3) Classical exit: Reject that motion excludes instantaneous rest, defining motion via instantaneous velocity (e.g., calculus). Cost: This demands accepting static snapshots as fundamental, abandoning any robust metaphysical account of change as intrinsic flux, and reducing motion to an infinite series of rests—which violates the intuition of dynamic continuity and may require infinities.  
  (4) Paraconsistency (e.g., LP) buys non-trivial reasoning: It tolerates *P ∧ ¬P* (true contradiction) without explosion, allowing consistent inferences about velocity, trajectory, or other properties. Classical logic, granting *P ∧ ¬P*, would entail arbitrary absurdities (e.g., "the object is a banana"), but LP preserves other facts.  
  (5) Key feature: The *instantaneous state of change*; removing it collapses the case to consistent descriptions over intervals (no dialetheia) or to contradictory measurements (mere inconsistent evidence), and it avoids paradox smuggling by grounding in physical transition, not semantics or self-reference.
