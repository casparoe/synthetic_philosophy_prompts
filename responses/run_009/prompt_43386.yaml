prompt: |-
  so, full disclosure up front: I'm a novelist, not a philosopher, and I'm in over my head, which is exactly why this needs doing properly rather than me winging it.

  the background: my next book is about a woman who spent her whole career as a planetary astronomer, and in 2006, at the IAU general assembly in prague, she watched a floor vote kick her life's object of study out of the planet club. (pluto, obviously.) while researching her I fell into thomas kuhn, and now, partly because of the book, I've somehow ended up refereeing between two friends who have been arguing about this stuff for years and have long since stopped hearing each other. my editor suggested they try an adversarial collaberation and produce one joint document, and I said I'd commission it, and they said fine, but I have to write up the terms of reference first. that's what I want from you.

  the two of them: one is a kuhnian of the later, weaker variety — he talks about local incommensurability and something like a no-overlap principle, where after a revolution the old and new taxonomies can't quite be mapped onto each other in certain places, but he does NOT hold the wild reading on which nobody across a divide can understand anybody at all. the other is a scientific realist of roughly the popper-putnam-davidson flavor: theory comparison is always possible in principle, translation failure is an empirical hiccup and not a deep fact about science, and if you can't say which of two theories is better, that's a fact about you, not about the world. (her words, more or less. she's like that.)

  what I want is the document they'd both actually put their names to. specifically:

  1. a numbered section of agreed claims, about the history of science as such — real cases both accept happened and meant something: copernicus, oxygen vs phlogiston, the way mass means something slightly different in newton versus einstein. and if they can agree on anything about what the 2006 vote actually was, I want that in there too, because it's the case I actually care about for the book.

  2. a disagreements table: each residual disagreement stated so that its own side would sign the wording. I've been burned before by phrasings where one side gets to describe the other's view for them, so I want every row basically self-attributed.

  3. the cruxes. I suspect one is whether the pluto thing is a miniature paradigm shift or just bookkeeping — a definitional stipulation by a committee, which even my kuhnian friend admits might be too boring to count. another is what to say about the truth of sentences like the claim that there are nine planets, printed in a 1990 textbook: false all along? true then and false now? true only relative to a taxonomy? that one matters to me enormously, because my protagonist has to be able to insist her old papers weren't lies. and if any part of their whole fight turns out to be verbal — I've started to suspect the word incommensurable itself does a lot of sneaky work — I want that said out loud, with which part and why.

  4. for each crux, one concrete case both sides agree bears on it, with each side's prediction written down in advance. I'd suggest ceres for the pluto crux: it got called a planet when it was found in 1801 and was quietly dropped from the list later in the century once the asteroids started piling up, all without any vote or manifesto. if the two of them can't agree on what to predict about how that case differs from the 2006 one, that failure itself goes in the document. honestly it would be the most useful thing in it for me, because my book is about a person, not a committee, and I need to know whether her world changed or just her filing system.

  keep it in plain english — these two slide into jargon when unsupervised and my editor will cut it. no bibliographies, no reading lists, no citations; I want claims and reasoning I can check against the book I'm writing, not homework.
reasoning: |-
  Okay, the user is a novelist working on a book about a planetary astronomer affected by Pluto's demotion in 2006. They've gotten caught between two friends debating Kuhn's philosophy of science versus scientific realism, and need help drafting a joint document for their "adversarial collaboration." 

  Hmm, the core tension here is personal and professional: the protagonist's identity is tied to Pluto being a planet, but the IAU vote reclassified it. The novelist needs philosophical clarity to write her emotional truth. Key points:
  - The Kuhnian friend believes taxonomy shifts create "local incommensurability" (some concepts don't perfectly translate after scientific revolutions)
  - The realist friend insists all theories are ultimately comparable/translatable
  - Both agree on historical cases (oxygen/phlogiston, Newton/Einstein mass) but clash on interpretation

  *Scratching head* The Ceres parallel is brilliant - it's a nearly identical case from 1801 that resolved organically. The novelist intuitively understands this could expose whether Pluto's case was paradigm shift vs bureaucracy. 

  Biggest landmine: the truth-value of past statements like "there are nine planets." Must avoid making the astronomer feel her life's work was based on falsehood. The realist's "contextual truth" framing helps here - it wasn't a lie, just context-bound.

  *Noticing subtext* The novelist is subtly siding with the astronomer (and thus the Kuhnian view?) by emphasizing "her world changed." But the document must stay neutral. The "no-overlap" principle could bridge both views: taxonomy changes create friction (Kuhnian) without making past science untranslatable (realist win).

  Ah! The Pluto/Ceres comparison in Section 4 is the gold. Forcing both sides to predict how astronomers in 1850 vs 2006 experienced these events will reveal if it's truly ontological rupture (Kuhnian) or mere label-swap (realist). Either way, the novelist gets her answer about the protagonist's crisis.
answer: |-
  Here's a draft Terms of Reference for your friends' adversarial collaboration, designed to be signed by both parties. It focuses on clarity, mutual attribution, and actionable outcomes for your novel's needs:

  **Adversarial Collaboration: Kuhnian vs. Realist Perspectives on Scientific Change & the Pluto Case**

  **Preamble:** This document outlines agreed historical facts, core disagreements, and testable cruxes regarding scientific change, particularly concerning the 2006 IAU reclassification of Pluto. The goal is precise mutual understanding, not conversion. Signatories agree the phrasing accurately represents their stated positions.

  **Section 1: Agreed Historical Claims & Core Concepts**
  (Both parties affirm these reflect established historical/scientific consensus)

  1.  **Copernican Revolution:** The shift from geocentric to heliocentric models involved profound conceptual restructuring (e.g., earth's motion, celestial spheres). This restructuring created significant challenges for communication and comparison between adherents of the old and new systems during the transition.
  2.  **Phlogiston vs. Oxygen:** The phlogiston theory (substance *released* during combustion) was replaced by Lavoisier's oxygen theory (gas *consumed* during combustion). Key entities (phlogiston vs. oxygen) and processes (dephlogistication vs. oxidation) were fundamentally reconceived, leading to incompatible descriptions of the same phenomena.
  3.  **Mass in Newton vs. Einstein:**
      *   Newtonian mass is an invariant property intrinsic to matter, governing gravity and inertia equally ("gravitational mass" = "inertial mass").
      *   Einsteinian mass is frame-dependent (increases with velocity) and is equivalent to energy (E=mc²). The concept of "invariant mass" (rest mass) is distinct. Gravitational effects are mediated by spacetime curvature.
      *   While linked conceptually, the *meaning* and *behavior* attributed to "mass" differ significantly between the theories, requiring careful translation when comparing specific claims.
  4.  **Ceres Precedent:** The object Ceres was discovered in 1801 and initially classified as a planet. As numerous similar objects (asteroids) were discovered in the same region, the classification shifted. By the latter half of the 19th century, Ceres and its neighbors were routinely classified separately from the "major planets," without a single formal vote or manifesto driving this widespread change.
  5.  **The 2006 IAU Vote:** The International Astronomical Union (IAU), during its General Assembly in Prague, held a contentious vote to formally define the term "planet." Resolution 5A defined a planet as an object that: (a) Orbits the Sun, (b) Has sufficient mass for self-gravity to assume hydrostatic equilibrium (a nearly round shape), and (c) Has "cleared the neighbourhood around its orbit." Pluto fails criterion (c). Resolution 6A explicitly created the new category "dwarf planet," of which Pluto is a member. This reclassification was the result of a deliberative process by a specific scientific body at a specific time.

  **Section 2: Disagreements Table**
  (Each statement is self-attributed; "K" = Kuhnian position, "R" = Realist position)

  | Disagreement Area | Kuhnian Position (K)                                                                                                | Realist Position (R)                                                                                                 |
  | :---------------- | :------------------------------------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------------------------- |
  | **1. Nature of Conceptual Change** | **K:** Scientific revolutions often involve **local incommensurability**: specific concepts or categories within the old and new taxonomies cannot be perfectly mapped onto one another without loss or distortion of meaning (No-Overlap Principle for specific terms/concepts). | **R:** Conceptual change, while sometimes difficult, **does not involve principled incommensurability**. Translation between theories is always possible in principle, even if complex or requiring context. Any apparent failure is temporary, resolvable through further empirical investigation or linguistic refinement. |
  | **2. Theory Comparison & Progress** | **K:** Comparing theories across revolutions is complex. Progress isn't always cumulative; it can involve shifts in explanatory goals, problem significance, and acceptable methods. **Pre-revolutionary questions/answers can become literally nonsensical or unaskable in the new paradigm.** | **R:** Theories are **objectively comparable** regarding empirical accuracy, explanatory power, internal coherence, and predictive success. Progress is cumulative in terms of increasing verisimilitude (truth-likeness). Questions remain meaningful; answers change based on better evidence and reasoning. |
  | **3. Role of Definitions & Stipulation** | **K:** Definitions within science are often **theory-laden and context-dependent**. Changes can reflect deeper shifts in understanding or priorities. A seemingly "mere" definitional change *can* signal or be part of a minor paradigm shift if it reflects a significant taxonomic restructuring. | **R:** Formal definitions (like the IAU's) are primarily **pragmatic tools for clarity and utility** within a scientific community. While informed by theory, they are distinct from fundamental theoretical claims about the world. Their adoption or change is largely a matter of convention and bookkeeping. |
  | **4. Understanding Across Paradigms** | **K:** While proponents of old and new paradigms can learn each other's languages, **full understanding requires appreciating the different web of meanings and standards within each paradigm.** Translation often involves approximation or reinterpretation. | **R:** Scientists can **fully understand** both past and present theories. Learning the history of science involves understanding the *reasons* past scientists held their beliefs (based on available evidence), not adopting an alien mindset. |

  **Section 3: Cruxes & Concrete Cases**
  (Identified areas where the disagreement is sharpest, with specific test cases and predictions)

  1.  **Crux: Significance of Definitional Changes (IAU 2006 & Ceres)**
      *   **Issue:** Is the IAU's 2006 vote primarily evidence of a minor paradigm shift involving taxonomic restructuring (K) or a pragmatic bookkeeping exercise (R)?
      *   **Concrete Case:** Compare the **Pluto (2006)** and **Ceres (1801-~1850s)** reclassifications.
          *   **K Prediction:** The difference lies in the *context* and *scope*. Ceres's reclassification occurred organically as a new *category* (asteroids) emerged naturally from discovery, fitting a gradual shift. The 2006 IAU vote was a *deliberate, contested, formal act* attempting to resolve a specific taxonomic ambiguity (triggered by discoveries like Eris) *within* a community feeling pressure for a clear definition. This formal, contested nature reflects a more significant, albeit localized, taxonomic rupture requiring explicit negotiation – indicative of a minor paradigm shift. We should see evidence of persistent conceptual friction ("What *is* a planet?") beyond mere bureaucratic need.
          *   **R Prediction:** Both are fundamentally pragmatic reclassifications driven by discovery and the need for useful categories. The difference is procedural, not epistemological. Ceres changed via informal consensus as discoveries accumulated; Pluto via a formal vote attempting to pre-empt future ambiguities. The controversy around the IAU vote reflects social/political factors within astronomy and public attachment, not deep conceptual incommensurability. We should see the core *scientific understanding* of Pluto (its composition, orbit, moons) unchanged by the vote; only its label did.
          *   **Agreed Test:** Analysis of professional astronomical literature, textbooks, and discourse 5-10 years before/after each event. Focus on: persistence/frequency of debates about the *meaning* of "planet" (K indicator), vs. focus on utility, discovery implications, or public communication (R indicator); changes in how Pluto/Ceres are *described scientifically* beyond the label (R indicator: minimal change).

  2.  **Crux: Truth-Value of Past Statements ("There are 9 planets")**
      *   **Issue:** What is the correct semantic status of a statement like "There are nine planets in the Solar System" printed in a reputable 1990 textbook?
      *   **K Position:** Such statements were **true within the operative taxonomic framework** of the time. The concept "planet" used then (implicitly or explicitly) did not include "clearing the neighbourhood" as a necessary criterion. Applying the 2006 definition retroactively is anachronistic. The statement reflected the best scientific understanding *under that taxonomy*. Her old papers used the valid taxonomy of their time; they weren't lies.
      *   **R Position:** The statement **was approximately true based on the best available evidence and understanding in 1990**, but we now know it was **strictly false**. Pluto did not meet the criteria (specifically, clearing its orbit) that were *latent* or became recognized as scientifically essential for the category "planet" as our understanding of the Solar System's structure deepened. Her old papers were the best possible based on *then-known* objects and concepts; their conclusions are outdated but were not dishonest.
      *   **Agreed Test:** Debate hinges on the **semantic grounding of kind terms like "planet"**. Does "planet" in 1990 refer to: (a) Whatever fits the *best scientific description* astronomers were *implicitly* using then (K-leaning), or (b) Objects that *actually* fit the *most scientifically robust* category as understanding progresses, even if not fully articulated then (R-leaning)? (Note: Both agree the protagonist wasn't lying).

  3.  **Crux: Scope & Depth of "Incommensurability"**
      *   **Issue:** Is "incommensurability" a useful term describing a *principled limitation* in translation between specific concepts (K), or is it merely a *practical difficulty* ultimately resolvable by better analysis (R)?
      *   **Concrete Case:** **Mass in Newton vs. Einstein**.
          *   **K Prediction:** Attempts to directly map Newtonian mass onto Einsteinian mass will always involve approximation or loss. Saying "Newton was wrong about mass being invariant" captures the *incompatibility* but not the *reason* within his framework. Fully understanding Newton requires seeing why invariant mass made sense *for him*, in a way untranslatable into relativistic justification. The "no-overlap" occurs in the *justification* and *exact meaning* of the term.
          *   **R Prediction:** We can precisely define the relationship: Newtonian mass approximates relativistic rest mass at low velocities. We understand *why* Newton thought mass was invariant (it was for all measurable phenomena he knew) and *exactly where and why* his theory breaks down. "Incommensurability" just means the translation is non-trivial and requires understanding both theories deeply – but it *is* possible without loss of essential meaning. The overlap is found in the specific predictions and the domain of applicability.
      *   **Agreed Test:** Can a physicist accurately explain a *Newtonian justification* for mass invariance *using only relativistic concepts* without distortion or importing anachronistic understanding? K predicts significant distortion/impoverishment; R predicts it's possible with careful phrasing.

  **Section 4: Verbal Disagreement Note**
  (Both parties acknowledge the following potential source of confusion)

  *   **The Term "Incommensurable":** Both parties agree that "incommensurable" is often misinterpreted as implying *total* untranslatability or incomprehension. **K** clarifies they use it only to denote *local* failures of exact point-to-point translation for *specific concepts* within competing taxonomies, *not* global incomprehension. **R** argues the term itself is misleading and harmful, as it suggests a stronger barrier than actually exists ("practical difficulty" or "conceptual friction" would be preferred). Both agree the word carries baggage and requires careful definition in this discussion.

  **Signatures:**

  ___________________________ (Kuhnian Advocate) Date: ___________

  ___________________________ (Scientific Realist Advocate) Date: ___________

  **Why this works for your novel:**

  1.  **Clarity on Pluto Vote:** Section 1 firmly establishes the IAU vote as a specific historical act, distinct from the organic Ceres shift. The crux (#1) directly tackles whether it felt like a world-change or admin.
  2.  **Protagonist Vindicated:** Both positions in Crux #2 explicitly state her old papers weren't lies. The disagreement is philosophical (truth/reference), not ethical.
  3.  **"World vs. Filing System":** The Ceres/Pluto comparison (Crux #1) is explicitly designed to probe this. Their predictions reveal if they see a *qualitative* difference in the astronomer's experience.
  4.  **Incommensurability Demystified:** The verbal note and Crux #3 force clarity on what the Kuhnian *actually* means versus the realist's objection to the *word*.
  5.  **Actionable for Story:** The agreed tests (language analysis around Pluto/Ceres, truth-value debate) provide concrete angles for depicting your astronomer's internal conflict and professional context. Does *she* feel her world or just her filing system changed? The document sets up how each philosopher would interpret her feelings.

  This structure forces specificity, avoids jargon traps, focuses on your key cases (Pluto, Ceres, Mass, Truth-Value), and provides the philosophical scaffolding you need to write authentically about your astronomer's crisis. Good luck!
