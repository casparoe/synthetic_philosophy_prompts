prompt: |-
  My flatmate and I have been going round about Nuremberg for weeks and she just produced an argument I can't get out of, except I'm sure it can't be right because it proves way too much. Here it is, roughly as she states it:

  (1) A criminal tribunal is legitimate only if the rules it uses to condemn the accused would, in principle, also condemn the accusers, had the accusers done the same things.
  (2) At Nuremberg and Tokyo, the accusers had done the same kinds of things: the British and Americans had firebombed cities full of civilians, the Soviet judge sat on the bench having invaded Poland and fought an undeclared war on Finland, and the Soviets had massacred some twenty thousand Polish officers in the Katyn forest and then spent the Nuremberg proceedings trying to pin that one on the Germans.
  (3) The tribunals never applied their rules to the accusers -- not a single Allied or Soviet act was even charged.
  (4) So the tribunals failed the condition in (1) and were illegitimate.
  (5) But every criminal court in history fails that same condition: domestic courts try the state's subjects and never the state itself, and every postwar court tries only the vanquished.
  (6) So no criminal court has ever been legitimate.
  (7) So Nuremberg and Tokyo weren't specially tainted -- a trial run by the winners is just what a trial is.

  The kicker is she actually likes (7). She's a bit of a legal realist and says tribunals have always been politics in robes, and Nuremberg at least used good rules even if enforcement was selective, which she thinks is the best you can ask for. I don't want to bite that bullet, but I also think the victors' justice complaint against these tribunals is basically right -- the one-side-of-the-dock thing isn't a cosmetic defect. So either I give up the complaint or I concede that no court anywhere was ever legitimate, and I don't like either.

  Where does the argument go wrong, if it does? My instinct is that something slips between (1) and (5) -- maybe "in principle" is doing different work in the two premises -- but I can't pin it down. I'd also like to know whether the retroactivity complaint (crimes against peace being, arguably, invented after the fact, Kellogg-Briand notwithstanding) is a separate problem or whether it can be folded into her symmetry argument, and whether folding it in makes her case stronger or actually worse. And when you answer, can you keep straight for me what's actually settled here -- the historical stuff about what was charged, Justice Pal's dissent at Tokyo, what happened with Katyn -- versus what's genuinely contested among people who study this? I don't want to come back at her waving some contested realist take as if it were the consensus view.
reasoning: |-
  Okay, the user is dealing with a complex debate about the legitimacy of the Nuremberg and Tokyo tribunals. Their flatmate presented a structured argument concluding that all criminal courts are inherently illegitimate due to selective enforcement, which challenges the user's belief that victors' justice is a specific flaw in these tribunals. The user wants to refute this without conceding that no courts are legitimate.

  First, I need to break down the flatmate's argument. The core premise is that legitimacy requires symmetric application of rules to both accusers and accused. Since Allied actions weren't prosecuted at Nuremberg, and since all courts show similar selectivity (like domestic courts not trying the state), the argument concludes that no court is legitimate. The user suspects premise (1) might be flawed, especially regarding "in principle."

  I should consider how "in principle" functions in premise (1). The flatmate uses it to mean that the rules must be capable of condemning the accusers if they committed similar acts. But in premise (5), the observation that courts never try the powerful seems to conflate this with actual enforcement. The key distinction here is between the rules themselves being applicable (in principle) versus the political reality of enforcement.

  Next, the concept of jurisdiction. Criminal courts typically have jurisdictional limits—domestic courts try individuals under national law, international tribunals under specific mandates. Nuremberg's jurisdiction was defined to try Axis war criminals, not the Allies. So the rules might apply in principle to the Allies, but the tribunal lacked jurisdiction to prosecute them. This doesn’t invalidate the rules themselves.

  The user also asks about retroactivity and whether it ties into the symmetry argument. Crimes against peace were indeed controversial, as they weren't clearly defined in existing law. But this is separate from the symmetry issue. If the rules were retroactive, that’s a different legitimacy problem—ex post facto laws—not directly related to whether the Allies committed similar acts. Folding it in might confuse the arguments, though both challenge Nuremberg's legitimacy.

  Regarding historical facts, Katyn is well-documented as a Soviet crime, though they blamed Germany during the trials. The Allies' bombing campaigns weren't prosecuted, but the legal basis for that—such as differing interpretations of proportionality—is debated. Justice Pal's dissent at Tokyo argued for acquittal based on victors' justice and retroactivity, which supports the user's concerns but isn't mainstream consensus.

  The user needs to avoid presenting contested views as consensus. Mainstream international law scholars acknowledge victors' justice as a flaw but don't dismiss Nuremberg entirely. They see it as a foundational step, despite imperfections. The flatmate's legal realism (point 7) is a valid perspective but not the only one.

  The user's deeper need is to uphold the critique of victors' justice without accepting that all courts are illegitimate. They need counterarguments that differentiate structural selectivity (like jurisdiction) from the specific, egregious asymmetry at Nuremberg. Emphasizing Nuremberg's contributions despite flaws could help—it established important legal principles, even if enforcement was imperfect.

  In summary, the argument's flaw lies in equating jurisdictional limits with illegitimacy and conflating "in principle" applicability with actual prosecution. By clarifying these points, the user can reject victors' justice as a unique flaw without undermining all courts.
answer: |-
  Your flatmate's argument is clever but contains critical flaws, particularly in its overextension of condition (1) and its conflation of distinct concepts. Here's a breakdown of where it goes wrong, separating settled history from contested scholarship, and addressing your concerns about retroactivity:

  ### Core Flaw: Misapplication of "In Principle" & Jurisdiction
  1. **"In Principle" vs. Jurisdictional Reality**:  
     Premise (1) requires that rules *could* condemn the accusers *if applied to them*. This is distinct from demanding that the *same tribunal* must prosecute both sides. Legitimacy hinges on whether the rules themselves are **impartial and universally applicable** – not whether a court with limited jurisdiction (e.g., established to try defeated aggressors) prosecutes its creators.  
     - **Nuremberg/Tokyo Jurisdiction**: The Allies established these tribunals under specific agreements (e.g., London Charter) to try *Axis* crimes. They lacked jurisdiction over Allied actions, just as a domestic court lacks jurisdiction over foreign heads of state. This doesn't make the *rules* illegitimate.  
     - **Contrast with Premise (5)**: Domestic courts *do* apply rules impartially *within their jurisdiction*. If a state official commits murder, they can be tried (e.g., Nuremberg prosecutor Robert Jackson prosecuted U.S. officials earlier in his career). The state itself isn't tried because criminal law targets *individuals*, not abstract entities.

  2. **Selective Enforcement ≠ Illegitimate Rules**:  
     That Allied crimes went unpunished reflects **political power**, not the invalidity of the rules. The laws against aggression/war crimes *could* have condemned Allied acts (e.g., firebombing Dresden might violate proportionality; the Soviet invasion of Poland violated non-aggression pacts). The failure to prosecute is a **failure of political will**, not proof that the rules are asymmetrical.

  ### Settled Historical Facts vs. Contested Issues
  | **Issue**               | **Settled/Uncontroversial**                                                                 | **Contested/Debated**                                                                                              |
  |-------------------------|---------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------|
  | **Katyn Massacre**      | Soviet NKVD killed ~22,000 Polish officers (1940); Soviets falsely accused Germany at Nuremberg. Declassified archives confirm this. | Whether this directly undermined the tribunal's legitimacy (Soviets weren't on trial; Katyn wasn't a charge against defendants). |
  | **Allied Bombing**      | RAF/USAAF conducted area bombing (Dresden, Tokyo, etc.), causing massive civilian casualties. Not prosecuted.          | Whether this violated *existing* laws of war (1945 Hague/IHL on proportionality was less developed; "military necessity" defenses were contested). |
  | **Soviet Aggression**   | USSR invaded Poland (1939), Finland (1939-40); judge Iona Nikitchenko oversaw Stalin's purge trials.                    | Impact on tribunal's impartiality: Pal's dissent cited this, but mainstream view sees it as a flaw in *application*, not rule validity. |
  | **Justice Pal's Dissent**| At Tokyo (1946-48), Pal argued for acquittal on all charges, citing victors' justice, retroactivity, and Western colonialism. | Whether Pal was correct or overly relativistic (e.g., excusing Japanese war crimes due to Western hypocrisy). |

  ### Retroactivity: Separate but Related Issue
  - **Crimes Against Peace (Aggression)**: Was *controversially* retroactive at Nuremberg. Though Kellogg-Briand (1928) outlawed war, it lacked individual criminal liability. This *is* a distinct legitimacy problem: **ex post facto justice**.  
  - **Interaction with Symmetry**: If aggression charges were retroactive, the Allies *couldn't* have been condemned "in principle" under pre-1945 law – weakening premise (1). However, war crimes/humanity charges (e.g., Holocaust) had clearer precedents (e.g., post-WWI Leipzig trials, Hague Conventions).

  ### Why Premise (7) Overreaches
  - **Domestic Courts**: Prosecute individuals under consistent rules. When state actors break laws (e.g., police brutality), they *can* be tried – demonstrating rules apply "in principle" to all.  
  - **International Courts**: Post-Cold War tribunals (e.g., ICTY, ICC) have indicted all sides (e.g., Serbs, Croats, Bosniaks). This refutes the claim that *all* courts inherently lack symmetry.  
  - **Nuremberg's Legacy**: Its rules (e.g., crimes against humanity) became foundational for modern IHL. Flawed enforcement doesn't negate this contribution.

  ### Path Forward: Reframing "Victors' Justice"
  1. **Reject Premise (1) as Overbroad**: Legitimacy requires **impartial rules** + **fair process** – not that every court must prosecute every violator.  
  2. **Concede Nuance**: Nuremberg *was* selective (Katyn cover-up, uncharged bombing), but:  
     - It pioneered accountability for atrocities previously ignored.  
     - Its rules *were* universal (e.g., Control Council Law No. 10 tried Germans for similar crimes).  
  3. **Distinguish Realism from Legitimacy**: Legal realists (like your flatmate) see law as power. But most scholars accept **degrees of legitimacy**: Nuremberg was imperfect yet transformative – unlike purely vengeful "trials" (e.g., 1946 Moscow Purges).

  ### Key Sources to Cite (Avoiding Contestation)
  - **Katyn**: 1990 Russian admission of guilt; 2012 ECHR ruling (Janowiec v. Russia).  
  - **Selective Prosecution**: *The Tokyo Judgment* (Cassese, 1993) details Allied immunity.  
  - **Rule Universality**: Schabas' *Unimaginable Atrocities* (2012) argues Nuremberg's norms were aspirational but grounded.  
  - **Pal's Dissent**: Controversial then and now; rejected by majority but respected as moral critique.

  **In short**: The argument fails by conflating **jurisdictional limits** with **rule asymmetry**, and **selective enforcement** with **illegitimate norms**. You can uphold the victors' justice critique without rejecting Nuremberg's legitimacy *or* all courts – by demanding consistent application of rules *where politically feasible*, acknowledging progress despite flaws.
