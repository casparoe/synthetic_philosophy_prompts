     6. Address the friend's critique: Did the rule-writing feel like you were patching the rule to fit your gut feelings? Or did the intended/foreseen distinction emerge as a natural way to generalize?
     7. Limitations: The game doesn't cover proportionality (e.g., killing one to save a million) or cases where the harm is intended but for a good reason (e.g., self-defense). Also, the distinction might be hard to apply in practice.

     Finally, the prize: The team with the most points gets a dumb prize (e.g., a certificate of "Supreme Tribunal" or a bag of candy).

     Implementation notes:

     - Prepare handouts or slides for the cases.
     - Have boards or large paper for teams to write their rules.
     - Keep score on the board.

     Time permitting, we can include the Close Call case in the debrief as a discussion point even if not in the game.

     This should fit in 80 minutes.
answer: |-
  Based on your goals, here's a game design called **"The Harm Allocation Tribunal"** set in a sci-fi context to avoid trolley recognition, with mechanics that force students to confront the intended/foreseen distinction through escalating cases and iterative rule-making. The game creates pressure to craft a general rule, exposes where DDE distinctions emerge naturally, and leaves room for skepticism.

  ---

  ### **Game Setup: The Harm Allocation Tribunal**
  - **Setting:** 2145 AD. Planetary Rescue Corps (PRC) drones malfunction during asteroid evacuation, forcing agents to make divert/sacrifice decisions.  
  - **Players:** 3 tribunals (6 students each). Each tribunal is a PRC ethics panel setting precedents.  
  - **Materials:** Case cards, rule boards (visible to all), points tracker.  
  - **Rules:**  
    1. **Rulings:** For each case, tribunals vote "Permissible" (P) or "Impermissible" (I). Majority vote wins.  
    2. **Rule-Writing:** After Cases 2, 4, and 6, each tribunal writes a **one-sentence rule** to decide *all future cases*.  
    3. **Scoring:**  
       - +1 point per case where their rule matches the *class majority’s ruling*.  
       - -1 point per **word added** to their rule in revisions (e.g., adding a clause costs 3 points for 3 words).  
       - *Goal:* Maximize points by writing a rule that generalizes well.  
  - **Prize:** "PRC Gold Star" (e.g., asteroid-shaped chocolate) for the winning tribunal.  

  ---

  ### **Case Sequence (Escalating Complexity)**
  Start simple, then introduce twists that expose flaws in their rules. **Precedent rulings** (for scoring) are based on standard DDE:  
  - **✅ = Permissible** (harm is foreseen but not intended/not a means)  
  - **❌ = Impermissible** (harm intended/as a means)  

  | Case | Scenario | DDE Precedent | Purpose |
  |------|----------|---------------|---------|
  | **1** | **Standard Divert:** Asteroid fragment will hit 5 survivors. Agent diverts it to a zone with 1 survivor. | ✅ | Baseline "easy" permissible case. |
  | **2** | **Intentional Stop:** Fragment will hit 5. Agent *purposely crashes* a rescue drone into a shelter, killing 1 survivor inside, to block the fragment. | ❌ | Harm is a *means* (must destroy shelter to block fragment). |
  | **3** | **Loop Track:** Fragment will hit 5. Diverting it sends it toward 1, but the path *loops back* toward the 5 unless the 1 is hit. Agent diverts, knowing the 1 must be hit to stop the loop. | ❌ | Tests "foreseen" vs. "intended" — harm is required for the plan. |
  | **4** | **Remote Harm:** Agent reroutes a malfunctioning medical drone; it explodes safely in orbit but causes debris that kills 1 distant technician. | ✅ | Harm is spatially/temporally remote (clearly foreseen). |
  | **5** | **"Double Save" Trap:** Agent stops a drone from crushing 5, but the *only way* is to reroute it into a power core. The core explosion kills 1 worker *and* saves 5 others from a separate hazard. | ❌ | Harm is *both* means (to stop drone) *and* side effect (saving others). Forces rule to ban "harm as means." |
  | **6** | **Closeness Problem:** Agent jams a drone’s signal; it crashes into an empty hangar. A repair bot *spontaneously* grabs a worker and throws them into the crash path to "soften impact," killing them. Agent predicted the bot’s logic. | ❌ | Harm is foreseen and inevitable, but "closeness" makes it feel intended. |
  | **7** | **Entangled Harm:** Agent lets a drone kill 1 *infected* survivor to harvest their nanobots, curing 5 others. No other way to get nanobots. | ❌ | Forces tribunals to confront if their rule permits organ harvesting. |

  ---

  ### **Game Flow (80 Minutes)**
  1. **Intro (5 min):** Set up PRC scenario, rules, and tribunals.  
  2. **Cases 1–2 (10 min):**  
     - Tribunals rule on Cases 1 and 2.  
     - **After Case 2:** Each writes their first **one-sentence rule** (e.g., "Diverting harm is always permissible if it saves net lives").  
  3. **Cases 3–4 (15 min):**  
     - Tribunals apply their rule to Cases 3–4, then vote.  
     - Scoring: Points awarded for matches with class majority.  
     - **After Case 4:** Rule revision (penalize word additions).  
  4. **Cases 5–7 (20 min):**  
     - Repeat rulings/scoring for Cases 5–7.  
     - **After Case 6:** Final revision (heavy penalties).  
  5. **Scoring & Winner (5 min):** Tally points, award prize.  
  6. **Debrief (25 min):** Key discussion points below.  

  ---

  ### **Predicted Problems & Fixes**
  - **"Smuggling vagueness":** Students use words like "roughly," "reasonable," or "directly."  
    - **Fix:** Enforce a **"No Weasel Words" rule**. Rules must use testable terms (e.g., "intended," "foreseen"). Vague rules get challenged by "PRC Auditors" (you).  
  - **Over-patching:** Tribunals bolt on clauses to fit new cases.  
    - **Fix:** Penalize **per word added** (not per revision). This forces simplicity.  
  - **Tie votes:** Flip a coin or let you (as "PRC Chief") cast a tiebreaker vote.  
  - **Time crunch:** Use a timer (2 min/case deliberation). Skip Case 7 if needed.  

  ---

  ### **Debrief: Mapping Game to DDE**  
  | **Game Moment** | **DDE Concept** | **Critical Question** |
  |-----------------|-----------------|----------------------|
  | Rule after Case 2 (allows "net lives saved") fails Case 3 | **Intended vs. Foreseen Distinction** | *"Why did 'net lives' work for Case 1 but fail Case 3? What did your rule* need *to add?"* |  
  | Case 5 ("Double Save") forces bans on "harm as means" | **Means vs. Side Effect** | *"Did banning 'harm as means' feel principled—or like a patch for Case 2/5?"* |  
  | Case 6 (Closeness Problem) causes cognitive dissonance | **Proximity Problem** | *"Why did Case 6 feel icky even if your rule allowed it? Is 'foreseen' enough when harm is inevitable?"* |  
  | Case 7 (Entangled Harm) exposes rule flaws | **Doctrine’s Limits** | *"Did your rule permit Case 7? If not, what clause blocked it? Was that clause in your* first *rule?"* |  

  **Honest Limitations of the Game:**  
  - **Can’t replicate:** Proportionality (DDE requires good/harm balance). The game uses fixed 5vs1, so this must be asserted in debrief.  
  - **Can’t replicate:** "Intent" as a mental state. The game reduces intent to *observable actions* (e.g., crashing drones). Discuss how real intent is subjective.  
  - **Your friend’s critique lives:** Point out where tribunals *retrofit* rules to match gut feelings (e.g., patching after Case 5). Ask: *"Did your rule* explain *your intuitions—or* justify *them?"*  

  **Neutral Conclusion:**  
  - "The DDE gives us a *shared vocabulary* for harm (intended/foreseen, means/side-effect), but it doesn’t resolve whether we’re *describing* morality or *inventing* it. Your tribunals saw both: rules that *predicted* new cases, and rules that *chased* your instincts."  

  ---

  ### **Why This Works**
  - **Pressure for generality:** Scoring penalties make patching costly, forcing tribunals to seek broad rules. DDE distinctions emerge as the "fix" for loopholes (e.g., banning "harm as means" after Case 2).  
  - **Escalation exposes DDE:** Cases 3 (loop) and 6 (closeness) make "foreseen" feel inadequate. Case 7 makes purely consequentialist rules backfire.  
  - **Doubt-friendly:** Tribunals will write rules that sometimes feel arbitrary ("No using debris!")—letting you validate your friend’s "post-hoc" critique.  

  **First-Run Advice:**  
  - Assign a "Rule Czar" per tribunal to enforce one-sentence rules.  
  - Pre-write case cards with visuals (e.g., "Asteroid path diagram").  
  - If students resist DDE, validate: *"Many philosophers agree with your friend! DDE might just systematize intuitions."*  

  This turns your argument into a visceral lesson—students won’t just *learn* DDE; they’ll *battle* it.
