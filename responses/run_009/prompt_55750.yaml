prompt: |-
  My friend has been settling our ethical arguments with an analogy and I want to know how far it actually carries. Her line is: moral uncertainty is just like factual uncertainty. If you're not sure whether the ice will hold, you assign a probability and act on expected value; so if you're not sure whether utilitarianism or a rights-based view or some virtue thing is true, you assign credences to the theories and pick whatever has the highest expected choiceworthiness across them. She used this last week to close a debate about a policy that risks slightly lowering average wellbeing while adding a lot of new happy lives: credences times value, whichever side of the ledger wins, stop agonizing, decision made, like it's an insurance calc.

  I don't doubt it's a real analogy, but something feels off -- the theories don't just disagree about how likely an outcome is, they disagree about what counts as an outcome and what its even worth. Can you lay out explicitly what maps onto what (a table is fine), then say where the mapping breaks, and importantly which breaks actually matter for her "just multiply and stop agonizing" conclusion versus which ones are pedantic. Also I've heard people say moral uncertainty is maybe more like bargaining between parties with incommensurable currencies than like predicting an outcome -- if the first analogy fails, does something like that do the job better, or does she get to keep her conclusion in some weaker form? Please tell me how confident you are in each part of your answer and single out the part you'd least trust yourself on.
reasoning: |-
  Okay, let me try to unpack this user's query. They're dealing with a friend who uses an analogy comparing moral uncertainty to factual uncertainty. The friend suggests that just like assigning probabilities to uncertain outcomes (like whether ice will hold), you can assign credences to different moral theories and calculate expected choiceworthiness. The user feels something's off but can't pinpoint exactly why. 

  First, I need to map out the analogy explicitly. Factual uncertainty involves predicting outcomes based on probabilities, like the ice breaking. Moral uncertainty, on the other hand, deals with conflicting frameworks about what's valuable. Utilitarianism focuses on aggregate wellbeing, rights-based theories on individual inviolability, and virtue ethics on character. These aren't just different probabilities; they're different definitions of value.

  The user mentioned a specific debate about a policy that might lower average wellbeing but add more happy lives. The friend's approach would assign credences to each moral theory and compute expected value. But here’s the problem: how do you assign probabilities to entire moral frameworks? Unlike factual uncertainties, there's no empirical way to verify if utilitarianism is "true." Also, the theories measure value in different units—utility vs. rights violations. Combining them requires a common scale, which might not exist. That's a major break in the analogy.

  Another issue is intertheoretic comparisons. If utilitarianism gives an outcome +100 units and rights-based gives -50, how do we compare those? Without a shared metric, the calculation falls apart. The user brought up bargaining with incommensurable currencies, which might be a better model. For example, different moral theories negotiate like countries with different currencies, finding compromises rather than aggregating numbers.

  I should assess which breaks actually matter. The unit incompatibility and intertheoretic comparisons directly challenge the "just multiply" approach. Without a common scale, the math doesn't work. The non-empirical nature of moral theories is a problem but maybe manageable if treated as beliefs. However, the fundamental issue is the lack of a shared value metric.

  The bargaining analogy might offer a better approach. Instead of forcing a single calculation, it involves seeking a decision that each theory could accept, perhaps with concessions. For the policy example, it might mean adding safeguards against rights violations while maximizing wellbeing, a compromise rather than a calculated expected value.

  But even bargaining has limits, especially with conflicting duties. If a theory absolutely forbids an action, bargaining might not resolve it. The user's friend might retain a weaker version, like using the framework for decisions without strict prohibitions, but it's not a universal solution.

  The user wants confidence levels. I'm highly confident about the mapping breaks, especially unit incompatibility. Less certain about how well bargaining works in practice. The part about weaker versions of the friend's conclusion is where I'm least sure—it's context-dependent and not always applicable.
answer: |-
  Here's a breakdown of your friend's analogy, its strengths, limitations, and potential alternatives, with confidence levels and critical breaks highlighted:

  **Mapping the Analogy: Factual vs. Moral Uncertainty**

  | Feature               | Factual Uncertainty (Ice Example)                          | Moral Uncertainty (Ethical Theories)                     |
  | :-------------------- | :--------------------------------------------------------- | :------------------------------------------------------- |
  | **Uncertain Object**  | State of the world (ice strength)                          | True ethical theory/framework (Utilitarianism, Rights, Virtue) |
  | **Credence (`p`)**    | Probability ice holds (e.g., 70%) - Based on evidence.    | Subjective probability a theory is "correct" (e.g., 40% Util, 30% Rights, 30% Virtue) - Based on philosophical reasoning/intuition. |
  | **Value (`v`)**       | Measurable outcome (e.g., -100 if fall, +10 if cross) - Single, agreed-upon scale (e.g., utils, dollars, harm). | "Choiceworthiness" of an action *according to that theory* (e.g., Util: +50 for new lives; Rights: -80 for risk; Virtue: -20 for recklessness) - **Different scales and definitions of value.** |
  | **Calculation**       | Expected Value = Σ (p_i * v_i)                            | Expected Choiceworthiness (EC) = Σ (p_theory * choiceworthiness_according_to_theory) |
  | **Decision Rule**     | Maximize Expected Value (EV)                               | Maximize Expected Choiceworthiness (EC)                  |
  | **Goal**              | Make the best prediction-based decision given uncertainty. | Make the best *morally responsible* decision given uncertainty about morality itself. |

  **Where the Mapping Breaks (and Why it Matters):**

  1.  **The Nature of "Value" (`v`): Incommensurable Currencies (CRITICAL BREAK)**
      *   **Break:** In factual uncertainty, values are measured on a *single, interpersonally agreed scale* (e.g., dollars, QALYs, utils representing wellbeing). In moral uncertainty, each theory defines its *own, fundamentally different scale* of what is valuable/good/choiceworthy. Utility aggregates happiness. Rights theories prioritize inviolability/duties. Virtue ethics focuses on character/excellence. **There is no common "moral dollar."**
      *   **Why it Matters for "Multiply & Stop":** This is the **fatal flaw** for her "just multiply" conclusion. Calculating EC requires adding `p_theory * v_theory`. But if `v_util`, `v_rights`, and `v_virtue` are measured in different, incompatible "currencies" (happiness points vs. rights-violation-units vs. virtue-deficiency-magnitude), adding them together is **mathematically meaningless**. It's like adding dollars + yen + gold nuggets without exchange rates. Her calculation *pretends* these scales are commensurable when they likely are not. **This break directly undermines the core computational step.**
      *   **Confidence:** 95% (This is the most widely recognized and devastating critique of simple moral uncertainty frameworks).

  2.  **The Nature of "Credence" (`p`): Non-Empirical Probability (SIGNIFICANT BREAK)**
      *   **Break:** Assigning a probability to ice strength is (in principle) empirically verifiable/calibratable. Assigning credences to entire moral frameworks is radically different. There's no objective frequency or clear evidence base (like ice thickness tests) to ground `p_util=0.4`. It's based on philosophical intuition, coherence, perceived explanatory power – factors much harder to quantify or converge on.
      *   **Why it Matters:** It makes the `p` values highly subjective, unstable, and difficult to justify or compare interpersonally. This injects significant arbitrariness into the EC calculation *even if* the value scales *could* be commensurated. It weakens the "objective calculation" feel she's invoking.
      *   **Confidence:** 85%. While subjective probabilities are used in decision theory, grounding them for *whole moral frameworks* is uniquely problematic.

  3.  **Intertheoretic Value Comparisons (CRITICAL BREAK - Corollary of #1)**
      *   **Break:** Even *if* you could assign numbers within a theory, how do you compare the *magnitude* across theories? Is a "utility +100" comparable in moral significance to a "rights violation -50"? Theories disagree fundamentally on how to rank or weight different kinds of considerations. Utilitarianism might see a minor rights violation as trivial for a large utility gain; a rights theory might see it as absolutely impermissible regardless of gain.
      *   **Why it Matters for "Multiply & Stop":** This is another expression of the incommensurability problem. For EC to be meaningful, you need a meta-scale to say "1 Util-unit is worth X Rights-units." But **no such meta-scale exists** or is agreed upon. Her calculation implicitly assumes one exists or that the theories' units are already aligned, which they aren't. **This makes the EC sum arbitrary.**
      *   **Confidence:** 90% (Intrinsic to the incommensurability issue).

  4.  **The "Outcome" Itself: What Counts? (SIGNIFICANT BREAK)**
      *   **Break:** In the ice example, the outcome (fall/don't fall) and its value are uncontroversial *given the goal* (cross safely). Moral theories disagree fundamentally *about what constitutes a relevant outcome and its moral significance*. Utilitarianism cares about aggregate happiness states. Rights theories care about whether specific actions violate duties. Virtue ethics cares about the character expressed. The "policy outcome" isn't a single, neutrally describable state of the world that each theory then values differently; the theories *define which aspects of the state of the world even matter morally*.
      *   **Why it Matters:** This reinforces break #1. It's not just valuing the *same outcome* differently; it's contesting what the morally salient features *are*. This makes constructing a common "outcome description" for valuation incredibly difficult.
      *   **Confidence:** 80%.

  **Pedantic Breaks (Less Critical for Core Conclusion):**

  *   **Complexity:** Factual uncertainty often involves well-defined states. Moral theories are vast, complex systems – assigning a single `p` and `v` oversimplifies them. (But approximations are common in decision theory).
  *   **Normative Stakes:** Getting factual uncertainty wrong usually leads to practical failure. Getting moral uncertainty wrong feels like a deeper failure of *moral responsibility*. (Important, but doesn't directly break the calculation mechanics).

  **Does Bargaining Between Currencies Work Better?**

  The "bargaining with incommensurable currencies" analogy is **significantly more apt** than the factual uncertainty analogy for capturing the core challenge:

  1.  **Strengths:**
      *   Directly addresses incommensurability (#1 & #3): Parties (theories) have different value systems (currencies). The goal is finding an agreement (decision) acceptable to all, *without* needing a single super-currency.
      *   Acknowledges deep disagreement: Bargaining recognizes fundamental conflict, not just probabilistic uncertainty.
      *   Focuses on compromise/acceptability: Instead of a forced numerical aggregation, it seeks a decision each theory could "live with" or that respects their core concerns proportionally to their "weight" (credence?), perhaps through concessions or safeguards.
      *   **For the Policy Example:** Bargaining might suggest modifying the policy – e.g., implementing it but with strong safeguards against wellbeing *losses* for existing people (appeasing Util/Rights) while capturing some new lives benefit (appeasing Util), or structuring it to promote virtues like responsibility (appeasing Virtue). It avoids the false precision of `EC = (0.4*50) + (0.3*(-80)) + (0.3*(-20)) = ?`.

  2.  **Limitations:**
      *   **Lack of Clear Mechanism:** *How* does bargaining work? Who are the agents? What are the rules? Real bargaining requires agents with preferences who can make concessions. Moral theories aren't agents. Translating this into a decision procedure is complex (e.g., "Moral Parliament" models exist but are highly theoretical).
      *   **Dealing with Absolutism:** What if a theory (e.g., strong Rights view) absolutely forbids an action, regardless of consequences or other theories' views? Bargaining might break down.
      *   **Credence's Role:** It's less clear how credence (`p`) factors in compared to EC. Does a higher credence give a theory more "bargaining power"?

  **Does Your Friend Get to Keep Her Conclusion?**

  *   **In its Strong "Just Multiply & Stop" Form? NO.** The incommensurability (#1) and intertheoretic comparison (#3) problems are fatal to the idea that EC provides a straightforward, objective, calculative answer analogous to insurance. The result is arbitrary without a solution to these issues. **Confidence: 90%**
  *   **In a Much Weaker Form? POSSIBLY, but with caveats:**
      *   **As a Structured Thought Experiment:** Forcing yourself to assign `p` and `v` *can* clarify your own intuitions and the stakes involved. It highlights where conflicts lie. **Confidence: 80%**
      *   **Within Commensurable Subsets:** *If* you are only uncertain between theories that *do* share a common value structure (e.g., different flavors of consequentialism), EC *might* be applicable. **Confidence: 75%**
      *   **As One Input Among Many:** The EC *attempt* could inform a broader deliberative process (like bargaining), but shouldn't be the sole decider. **Confidence: 70%**
      *   **As a Pragmatic Tie-Breaker:** In some low-stakes cases with no clear alternative, it *might* be a fallback, acknowledging its flaws. **Confidence: 60%**

  **Confidence Recap & Least Trusted Part:**

  *   **Mapping Breaks Mattering for "Multiply & Stop" (Incommensurability & Intertheoretic Comparisons): 90-95% Confidence.** This is the core critique.
  *   **Bargaining Analogy Being Better: 85% Confidence.** It captures the essential problem more accurately.
  *   **Failure of Strong "Multiply & Stop" Conclusion: 90% Confidence.**
  *   **Potential for Very Weak/Pragmatic Use of EC: 60-75% Confidence.** This is the part I'm **least confident** in asserting *positively*. While plausible in *some* constrained contexts, it's hard to define those boundaries clearly, and the fundamental arbitrariness remains a significant concern. The value of EC even as a thought experiment is real but easily overestimated, leading back to the illusion of calculation your friend relies on. **My confidence here is the shakiest because it's hard to specify *when* the weaker use is truly justified versus just masking the underlying problems.**

  **Conclusion:** Your intuition is correct. The analogy breaks down critically because moral theories use fundamentally incommensurable "currencies" of value, making the key step of multiplying credences by theory-specific values and summing them mathematically dubious and arbitrary. The "bargaining with incommensurable currencies" analogy is a far better description of the core problem. While your friend's approach *might* serve as a weak heuristic or thought experiment in limited contexts, it absolutely does not support her strong "just calculate the expected value and stop agonizing" conclusion for complex moral disagreements involving fundamentally different ethical frameworks. Moral uncertainty is significantly messier than factual uncertainty.
