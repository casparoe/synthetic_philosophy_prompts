prompt: |-
  ok so ive been a lesswrong-adjacent lurker since basically forever and this keeps coming up in arguments about whether the universe "runs on math" or whatever, and I want your actual credence, number and all: that Humeanism about the laws of nature is true — i.e. the laws just are the theorems of the best systematization of the total mosaic of local particular facts, nothing over and above, no little law-entities pushing particles around.

  decompose it for me like you would a forecast question. terms I want (edit freely but tell me why):

  - p that the best-system analysis is even well-defined once you notice the simplicity/strength tradeoff is language-relative and nobody has a clean fix — does grue-style stuff wreck it, or do you just bite the bullet and privilege a primitive vocabulary, and is biting that bullet expensive
  - p that the inference problem kills it: the mosaic's exhibiting strikingly simple regularities at all is the thing Humeanism says needs no explanation, and that always felt to me like treating the track record of Occam's razor as a coincidence. though maybe everyone else has the same problem one level up — anyone who says laws explain the mosaic still has to say why THOSE laws, so maybe the regress just eats everybody
  - my own weird one: suppose you take the mosaic and run something like Solomonoff induction on it, and the shortest program reproducing it looks a lot like a lawbook. does that rescue Humeanism (the laws literally are the best compression of the world) or does it smuggle back in whatever "best" was supposed to not mean? give me a probability that this move actually helps the Humean's case rather than just restating it

  then combine, tell me which term is doing the most work, and what argument or observation would move your number the most.

  for calibration: my buddy who did his phd on this says 0.7 anti-Humean — he's a "the mosaic being lawlike is a brute fact that screams for explanation" guy, I'm sitting at maybe 0.6 humean, mostly because I've never seen a coherent story about how non-Humean laws causally DO anything, they just sit there being necessary. where do you think the disagreement between us actually lives? my guess is its mostly about whether explanation can bottom out in brute regularity at all, but you tell me.
