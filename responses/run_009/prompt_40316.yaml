prompt: |-
  Two of my coworkers have been arguement-ing about the Allais paradox for months and I want to see if they can actually write something down together instead of rehashing it over coffee. Call them A and B. A is a committed expected-utility person: she thinks that when experimental subjects pick the sure thing in the first Allais pair and then flip their ranking in the second pair, that's just an error, a bias to be corrected by reflection, and that if you think it through carefully enough you'll end up EU-consistent. B thinks the revealed preferences are fine: in his telling the independence axiom breaks because the "common outcome" portion of the two lotteries only coincides on one event, so there's no reason the ranking on the remaining branches has to stay fixed — certainty over a middle chunk of outcomes carries a value the axiom simply doesn't capture. Draft the joint statement they should produce out of a good-faith adversarial collaboration.

  Please structure it as:

  1. "What we both accept" — numbered, roughly six one-line claims (about the formalism, about what the experiments do and don't establish, that sort of thing).
  2. "Where we disagree" — a table with about four rows, each phrased so the relevant side would actually sign the wording of its own view.
  3. "Cruxes and registered predictions" — two or three cruxes, and for each, a concrete test or argument both sides would agree bears on it (e.g., whether Allais-type subjects who get money-pumped in choices they face one at a time, with real stakes, revise toward EU or stick with their original preferences), with each side's prediction written down in advance.
  4. "What we couldn't settle" — two or three sentences.

  If any part of their dispute turns out to be verbal rather than substantive, say which bit and why. Keep the whole thing under about 600 words. And please write it in British English — behaviour, colour, "programme", you get the idea.
