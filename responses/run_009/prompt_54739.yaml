answer: |-
  Your diagnosis is perceptive and touches on the core dynamics of the teleosemantics impasse. The field's stagnation isn't due to overlooked arguments but to **divergent conceptions of the explanandum itself**—a paradigmatic case of what philosophers of science call a "dialectical stalemate." Here's a breakdown:

  ### 1. **The Substantive Core: Divergent Explananda**
     - **Critics (Fodor, Sterelny, etc.)**: Their objections (disjunction, indeterminacy, Swampman) presuppose that the *explanandum* is **folk-psychological intentionality**—content with the determinacy, normativity, and discrete propositional structure we attribute in everyday belief-desire explanations. When a frog catches a fly, we say it "saw a fly," not "fly-or-BB." For critics, any naturalistic theory must preserve this grain of determinacy to count as a theory of *content* at all.
     - **Teleosemanticists (Millikan, Papineau, Neander)**: Their *explanandum* is **naturalistically grounded content**—content derived from causal-historical processes. Biological functions *are* often "gerrymandered" (e.g., the heart circulates blood *and* makes sounds; a neuron's "function" may be context-dependent). For them, *some* indeterminacy isn't a flaw but a reflection of biology. Millikan explicitly argues that content *is* "locally determined" by specific historical functions in specific contexts, not by abstract folk categories.

     **Why this isn't merely verbal**: The disagreement is about **what intentionality fundamentally is**. Critics see it as a *sui generis* feature demanding precision; teleosemanticists see it as an evolved biological trait whose structure mirrors the messiness of selection. This is a substantive metaphysical divide about the nature of mind.

  ### 2. **The Hidden Empirical Question: Neuroscience or Implementation?**
     Your "rival diagnosis" is valid but secondary. The neuroscience of representation *has* advanced (e.g., predictive coding, population codes), but it doesn't cleanly resolve the debate:
     - **Problem 1**: Neural representations are often probabilistic, distributed, and multifunctional. This *could* support teleosemanticists (indeterminacy is biological) *or* critics (neural states aren't "beliefs" in the folk sense).
     - **Problem 2**: Teleosemantics aims for a *metaphysical grounding* of content, not a neural implementation. Papineau might argue that even if brains use vector spaces, content is *fixed by* evolutionary history, not neural syntax. Critics would retort that this history doesn't fix *specific* content (e.g., why "fly" not "nutrient source"?).
     - **The Stalemate**: Neuroscience alone can't bridge the gap because the dispute is about *what counts as content determination*. Is it a causal-historical relation (teleosemantics) or a syntactic/symbolic relation (Fodor)?

  ### 3. **Why It's Stalled: Competing Visions of Naturalization**
     - **Critics** demand a theory that **vindicates folk psychology** with minimal revision. If teleosemantics can't deliver determinate content, it fails as a theory of *representation*.
     - **Teleosemanticists** seek a theory that **integrates intentionality into biology**—even if it revises folk categories. For Millikan, the "proper function" *is* the normativity of content ("malfunction" explains misrepresentation). The indeterminacy isn't a bug; it's how biology works.
     
     **The Ill-Posed Element**: Both sides implicitly assume intentionality is a unified natural kind. But what if it isn't? Teleosemantics might explain *biological* representation (e.g., predator detection) but not linguistically structured belief. Critics might concede this but argue that only the latter is "real" intentionality.

  ### 4. **Paths to Progress**
     - **A Formal Model of Content Determination**: A computational model showing *how* selection histories fix content under specific constraints could force clarity. E.g., prove that under bounded ecological conditions, selection converges on determinate functions. Current theories are too informal to settle indeterminacy disputes.
     - **Empirical Work on Cognitive "Indeterminacy"**: If cognitive science finds that biological cognition *systematically* operates with ambiguous or context-dependent representations (e.g., in insect navigation), teleosemantics gains plausibility. If low-level perception is highly determinate, critics win ground.
     - **Reframe the Debate**: Shift focus from "fixing content" to **explaining cognitive efficacy**. *How* does content, however indeterminate, guide successful behavior? Teleosemantics excels at linking function to survival, but critics see this as irrelevant to *propositional* content.
     - **Decouple Biological and Mental Representation**: Argue that biological functions ground *indicator* content (e.g., frog state indicates "prey present"), while *belief* requires additional structure (e.g., compositionality). This might split the difference but risks conceding the core dispute.

  ### Conclusion: A Stalemate Rooted in Ambition
  The impasse reflects a **clash of projects**:  
  - **Critics** want to naturalize *folk intentionality* without losing its essence.  
  - **Teleosemanticists** want to reduce intentionality to a broader biological phenomenon.  

  **Progress** may require abandoning the quest for a "grand theory" of all content. Instead:  
  1. **Domain-specific accounts**: Does teleosemantics work better for sensory states than beliefs?  
  2. **New empirical constraints**: E.g., if evolution *predictably* produces cognitive systems with determinate contents in certain niches, teleosemantics could gain traction.  
  3. **Rejecting the datum**: If future cognitive science shows folk psychology is *fundamentally mistaken* about determinacy, teleosemantics could win by default.  

  Your hypothesis is astute: the deadlock isn’t about arguments but **what counts as success**. Until philosophers agree on whether intentionality *should* mirror biology or folk psychology—or whether these are reconcilable—the debate will remain frozen. The next breakthrough may come not from new arguments, but from a meta-account of why we disagree *about the disagreement*.
