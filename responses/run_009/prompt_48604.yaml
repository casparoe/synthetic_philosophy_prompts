  First, her "yes" to genocide: Rwanda 1994 (clear ethnic targeting and mass killing), Srebrenica (killing men and boys counts as "in part"), Armenians 1915 (applied Convention retroactively), Herero and Nama 1904-08 (also historical, involved mass killings and intent). 

  Then her "no" cases: Bengal famine (Churchill's negligence, no intent to destroy), Atlantic slave trade (needed slaves alive, not destruction), Bamiyan Buddhas (cultural destruction not enough, rejects "cultural genocide"), Stolen Generations (forced assimilation but no intent to destroy the group).

  Looking at her reasoning, she seems strict about requiring specific intent to physically destroy a group. For Srebrenica, she used the Convention's "in whole or in part" but emphasized the killings. For Stolen Generations, she said keeping children alive meant no genocide, even though forced sterilization was involved there too. Wait, in Stolen Generations, she ruled against genocide because the policy aimed to assimilate, not destroy. That’s key.

  Now, Peru's case: sterilizations targeting indigenous women. The Convention includes (d) - preventing births as genocide. But does she consider non-lethal methods? Her Stolen Generations ruling suggests she requires physical destruction, meaning killing. But in Srebrenica, she accepted partial destruction. Maybe she only counts killing as physical destruction? 

  Her rejection of cultural genocide shows she’s strict about the term not being diluted. Also, Armenia and Herero were risky, so she’s not avoiding controversy. So the "diplomatically safe" angle is out. 

  Two possible rules: 1) Strict physical destruction (killing only). 2) Convention-literal, including (d). Stolen Generations had forced sterilizations but she said no because intent was assimilation, not destruction. So perhaps she requires intent to destroy the group, not just prevent births. In Peru, if the sterilizations were aimed at reducing indigenous births specifically, that might qualify under (d). But if it's targeting poor people who happen to be indigenous, class isn't protected, so no. 

  Her track record: She uses Convention-literal when it involves killings (Srebrenica's "in part"), but for non-lethal cases, she requires intent to physically destroy. Sterilizations prevent births, which under Convention is genocide if aimed at the group. But in Stolen Generations, similar measures were deemed not genocide because intent was assimilation. So maybe she sees assimilation as different from destruction. 

  For Peru, if the program targeted indigenous women as a group, it might fit (d). But her Stolen Generations ruling suggests she doesn’t see preventing births alone as genocide if the intent isn’t destruction. The key is intent. In Peru, if the intent was to reduce the indigenous population as such, that’s destruction. But if it was poverty reduction, even if discriminatory, not genocide. 

  Her past decisions align with requiring intent to destroy the group physically, which for her means killing. Sterilizations prevent future existence, but she might not consider that "physical destruction." In Stolen Generations, sterilizations were part of assimilation, not destruction. So Peru might be similar. She’ll likely say no, not genocide, but a crime against humanity. 

  But wait, the Convention explicitly includes preventing births. However, she might interpret "destroy" as immediate physical destruction, not long-term. Her no on Bengal and slave trade support that. So predicting she rules no for Peru. 

  A future case that could split the rules: Forced sterilizations explicitly aimed at eliminating an ethnic group, like China’s policies in Xinjiang. If that comes up, it would test if she accepts non-lethal methods under genocide. For now, Peru might be a no.
answer: |-
  Based on your detailed account of your friend's rulings and reasoning, I predict she will rule **against** classifying the Fujimori-era sterilisation campaign as genocide. Here's the breakdown, focusing on consistency with her track record, the competing rules, and predictions:

  ### The Two Candidate Rules & Their Fit
  1.  **"Strict Physical Destruction" Rule (SPD):** Genocide requires *intent to physically destroy the group*, interpreted narrowly as *causing immediate deaths or a killing-centred campaign*. This aligns with:
      *   **Stolen Generations:** Forced sterilisation (a Convention II(d) measure) exists, but the *intent* (assimilation, not destruction) and *method* (keeping victims alive) exclude genocide.
      *   **Bengal Famine:** Massive deaths occurred, but lack of *intent to destroy* excludes it.
      *   **Atlantic Slave Trade:** Perpetrators needed victims alive, negating *destructive intent*.
      *   **Bamiyan Buddhas:** Explicit rejection of non-physical destruction ("dilution" argument).
      *   **Srebrenica/Rwanda/Herero/Armenia:** All centrally involved *mass killing* with intent to destroy (physically eliminating members).

  2.  **"Convention-Literal with Intent Scrutiny" Rule (CLIS):** Genocide requires *intent to destroy the group* as defined in Article II(a)-(e), but with rigorous assessment of whether the *intent* was truly the *destruction* of the group (physically or biologically). This aligns with:
      *   **Srebrenica:** Embraces "in part" and a specific geographical group (Convention-literal).
      *   **Armenia/Herero:** Applies Convention definition retroactively despite no court ruling (Convention-literal on definition, not jurisdiction).
      *   **Stolen Generations:** Forced sterilisation (II(d)) *exists*, but the *intent* (assimilation, not destruction) excludes genocide. Intent trumps the literal act.
      *   **Bengal/Slave Trade/Bamiyan:** Lack of relevant act *or* destructive intent excludes them.

  ### Why SPD Fits Better (Predicting a "No" for Peru)
  *   **The Stolen Generations Precedent is Key:** Her ruling here directly addresses II(d) measures (forced sterilisation, removal of children preventing births). She explicitly distinguished between acts *preventing births* and the *intent to destroy the group*. The presence of II(d) acts wasn't sufficient; the *intent* had to be destruction, not assimilation, and the *method* (keeping victims alive) signaled non-destruction. **Peru is structurally identical:** II(d) acts are present (sterilisations preventing births), but the critical question is *intent* and whether the *method* implies destruction.
  *   **Rejection of Non-Lethal Pathways:** Her firm veto of "cultural genocide" and reasoning on Stolen Generations/Bengal/Slave Trade consistently show she views "destruction" as requiring physical/biological elimination, not just cultural erasure or long-term population decline via non-lethal means. SPD explains this more cleanly.
  *   **Her Srebrenica Reasoning isn't Inconsistent with SPD:** Emphasising "in whole or in part" for a *killing campaign* fits SPD. It expands the *scale* (part of a group) but not the *nature* of the act (killing as destruction). CLIS struggles slightly more to explain why II(d) in Stolen Generations wasn't genocide despite the act being literal, whereas SPD explains it via the lack of lethal intent/method.
  *   **Predicting Peru:** Under **SPD**, sterilisation is not *physical destruction* (killing); it’s a non-lethal measure preventing *future* births, akin to Stolen Generations. The deaths (like Mestanza) are likely seen as negligent/byproducts, not the core destructive intent/method. **Result: No (Mass Atrocities/Crimes Against Humanity).** Under **CLIS**, while II(d) is triggered, she will likely find the *intent* was likely population control/targeting the poor (using indigenous status as a proxy), not the *destruction* of the indigenous group *as such*. Economic targeting isn't protected, and the assimilation/destruction distinction from Stolen Generations applies. **Result: No.**

  ### Why CLIS is Plausible But Less Likely
  *   It fits Srebrenica and the retroactive applications well. If Peru showed *explicit* intent to destroy the indigenous group via birth prevention (not just control the poor), CLIS *could* lead to a "Yes". However, her Stolen Generations ruling is a major hurdle, demonstrating she sets a high bar for inferring "destruction" from II(d) acts.

  ### Ruling Out Cynical Interpretations
  *   **"Diplomatic Safety":** Armenia (vs. Turkey) and Herero (historical, Germany) decisively kill this. She rules based on principle, not politics.

  ### What Would Change My Prediction (Key Uncertainty)
  *   **My greatest uncertainty is the *specific evidence of intent* in the Peru case.** Your setup mentions the victims were "overwhelmingly... Quechua-speaking women," but was the programme *explicitly* or *provably* aimed at reducing/eliminating the *indigenous population as such*? If the magazine's feature uncovers or emphasises:
      *   Government documents explicitly stating the goal was reducing indigenous birth rates/demographics.
      *   Quotas specifically tied to ethnicity/language, not just poverty/region.
      *   Statements linking the programme to eliminating indigenous identity/communities.
      ...then **CLIS could lead to a "Yes"**. She *might* argue this shows intent to destroy the group biologically via II(d), distinct from the assimilationist intent in Australia. However, based *only* on your description ("poor, rural, Quechua-speaking", "quotas", "pressure"), it sounds like indirect targeting (poverty with indigenous correlation), making a "No" far more likely under either rule.

  ### The Case That Splits SPD and CLIS
  *   **A systematic, large-scale forced sterilisation programme *explicitly and solely* targeting an ethnic/religious group *with the stated or demonstrable intent* of causing that group's biological extinction within a generation or two (i.e., true demographic destruction, not just control or assimilation).**
      *   **SPD Prediction:** Likely still "No". No killing, no physical destruction *of existing members*; it's prevention of future life. Fits Stolen Generations precedent.
      *   **CLIS Prediction:** Likely "Yes". Directly fits II(d) with unambiguous intent to destroy the group biologically. This is the scenario CLIS accommodates but SPD does not.
      *   *(Example: Hypothetical future evidence on Uyghurs in China, or historical cases like Nazi policies towards Roma, though complexities exist).*

  ### The Prediction
  Based on her consistent emphasis on physical/biological destruction, the critical precedent of the Stolen Generations ruling (directly addressing II(d) and finding it insufficient without lethal intent/destructive outcome), and the likely interpretation of the Peru campaign's intent as targeting poverty (using indigenous identity as a marker) rather than the destruction of the indigenous group *as such*, I predict she will rule **"No" for genocide in the Peru case**. She will likely classify it as a **crime against humanity (persecution, other inhumane acts, possibly extermination) or mass atrocity**, emphasising the gross violation of bodily autonomy, discrimination, and lack of consent, but distinguishing it from genocide due to the lack of *intent to physically destroy the group* via lethal means or the specific interpretation of II(d) requiring destructive intent akin to killing. The Mestanza deaths will be seen as tragic consequences of negligence/violence within the programme, not evidence of its core genocidal nature.

  **In British English:** The editor's track record points to a stringent view requiring physical destruction, predominantly through killing, to constitute genocide. Non-lethal measures like forced sterilisation, while horrific and potentially genocidal under a literal Convention reading (Article II(d)), are deemed insufficient without proof of intent to physically destroy the group *as such* – an intent she distinguished from assimilation in the Stolen Generations case. Given the Peruvian campaign's apparent focus on poor, rural women (who happened to be indigenous) rather than explicit targeting of indigenous identity for destruction, a genocide ruling seems unlikely. However, should new evidence reveal unequivocal intent to destroy the Quechua population biologically through sterilisations, her Convention-literalist streak could prompt a reassessment. For now, expect a ruling emphasising crimes against humanity over genocide.

  Would you like me to elaborate on any specific aspect of the reasoning or prediction?
