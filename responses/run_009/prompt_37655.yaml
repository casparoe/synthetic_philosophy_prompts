  2. Arithmetic checking: A human redoing calculations with error-prone habits—this is more about human cognition than formal systems. It’s analogous but not the same theorem. 
  3. Self-improving AI: The "verifying successor" problem. If the original AI verifies a stronger successor, that’s impossible by Gödel (unless the original is stronger, which it isn’t). The user suspects handwaving here—correctly. 
  4. The "fourth thing": Definitely Löb’s theorem. If system S proves "if S proves P, then P", it must believe P outright. Hence, trusting an equal’s proofs is vacuous. 

  The user’s frustration about "moving the wall" (stronger external verifiers not being checked) is spot-on—it’s the regress problem. They’re also asking about probabilistic systems: Gödel applies to formal deductive systems, but probabilistic checkers (e.g., sampling) might avoid it, though they trade certainty for probability. 

  I should emphasize: 
  - Gödel’s second incompleteness theorem is the core of observations 1 and 3. 
