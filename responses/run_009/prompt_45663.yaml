answer: |-
  ### Setup and Rules
  Each student secretly writes a positive dollar amount between $0.01 and $10.00 (two decimals allowed) on a slip. Collect all slips. Randomly pair students: 14 students form 7 pairs (if 15, one assists). For each pair, flip a coin: if heads, use the first student’s number as \(X\); if tails, use the second’s. Prepare two envelopes: one with \(X\), one with \(2X\). Shuffle envelopes and distribute one to each student. Students open their envelope, see amount \(A\), and decide whether to pay $0.10 to swap. **Decision rule:** If \(0.25A > 0.10\), swap; otherwise, keep. Record \(A\), decision, and final amount. Use tokens if cash is impractical (e.g., 100 tokens = $1).

  ### How the Session Runs
  1. **Intro (5 min):** Explain rules and have students write amounts. Collect slips.  
  2. **Pairing & Distribution (10 min):** Randomly pair students. For each pair, flip a coin to set \(X\), fill envelopes (\(X\) and \(2X\)), shuffle, and distribute.  
  3. **Student Decisions (15 min):** Students open envelopes, compute \(0.25A\), and decide to swap (if \(0.25A > 0.10\)) or not. They record:  
     - **My \(A\)**  
     - **Swapped? (Y/N)**  
     - **Final Amount**  
  4. **Data Collection (15 min):** Poll students and fill a public table on the board:  

     | Student | \(A\) | Swapped? | Final Amount |  
     |---------|-------|----------|--------------|  
     | 1       | ...   | ...      | ...          |  
     | ...     | ...   | ...      | ...          |  

     Calculate:  
     - **Total final amount** (sum Final Amount)  
     - **Total without switching** (sum of all \(A\))  
     - **Net loss** = (Total without switching) – (Total final amount)  

  5. **Transition to Debrief:** Highlight that net loss matches total fees paid (since swapping doesn’t create money).

  ### Debrief Script
  "Today, you each saw an amount \(A\) and calculated: 'The other envelope is \(2A\) or \(A/2\) with equal probability, so switching gains \(0.25A\) in expectation. If that gain exceeded $0.10, you swapped. The math seemed airtight—but look at our results. The net loss from swapping equals the fees you paid. Why?  

  Let’s dissect:  
  - **Extreme cases:** If you had $20, the other envelope **must** be $10 (since \(2X\) can’t exceed $20). If you had $0.01, the other **must** be $0.02 (since \(X\) can’t be $0.005). The '50/50' assumption failed here!  
  - **Middle cases:** Suppose \(A = 5\). The other envelope could be $10 (if \(X=5\)) or $2.50 (if \(X=2.50\)). But is '50/50' accurate? Only if \(X=5\) and \(X=2.50\) are equally likely in our prior—which depends on **your** written numbers. In our data, how many pairs had \(X=5\) vs. \(X=2.50\)? [Check slips.] They’re not equal!  

  The textbook argument secretly assumes a *uniform prior*: that \(2A\) and \(A/2\) are always equally possible. But our filling process—using your numbers—creates a prior where this isn’t true. Swapping doesn’t help on average because gains/losses balance:  
  - If you had \(X\), swapping gains \(X\).  
  - If you had \(2X\), swapping loses \(X\).  
  Overall, expected gain = 0. The paradox vanishes when we model the prior honestly!"

  ### What Will Go Wrong and How to Handle It
  **Predictable issues:**  
  - **$0.01 or $20 writes:** Common! Use them in debrief to show boundary violations (e.g., $20 implies \(X=10\), so \(2A=40\) is impossible).  
  - **Coordination:** Friends might write identical numbers to "hack" the system. Solution: Randomize pairings after collecting slips.  
  - **Non-compliance:** Students may write negative/zero amounts. Enforce rules upfront: "Positive only, $0.01–$10.00."  
  - **Slow calculations:** Pre-print decision aids: "If \(A > 0.40\), swap; else, keep."  
  - **Trio with 15 students:** Assign one as assistant to help with envelopes.  

  **Handling:** Emphasize that anomalies (e.g., boundary amounts) reveal the paradox’s flaws—they’re teaching moments, not bugs.

  ### What This Game Can’t Reproduce
  This exercise **cannot** simulate scenarios where the switching argument *is* valid (e.g., with an **improper prior** like \(P(X) \propto 1/X\)). Such priors are mathematically possible (yielding \(E[\text{gain}|A] = 0.25A\) exactly), but they’re non-realistic: they require infinite money or probabilities that don’t sum to 1. Our game mirrors real-world constraints, showing why the argument fails under any feasible filling procedure. For intro students, this distinction (possible in theory vs. practice) is worth noting but needn’t derail the core insight.
