answer: |-
  ### **Units of Selection Game: "Group vs. Gene"**  
  **Goal:** Students experience the tension between within-group advantage (cheaters win) and between-group advantage (cooperative groups dominate).  

  ---

  #### **Setup (10 min)**  
  - **Groups:** 4 groups of 4 students each.  
  - **Materials:**  
    - Each student: 10 poker chips (startup capital).  
    - Index cards (write "C" or "D" each round).  
    - Whiteboard (track group scores).  
  - **Rules:**  
    1. Each round, secretly choose **Cooperate (C)** or **Defect (D)** on an index card.  
    2. **C players** contribute 2 chips to a group pot. **D players** contribute 0.  
    3. Teacher doubles the pot (e.g., 10 chips → 20). Split *equally* among all 4 group members.  
    4. **Net gain/loss:**  
       - C: (share of pot) - 2 chips.  
       - D: (share of pot) - 0 chips.  
  - **Incentive:** Top 4 students (individual chips) leave class 5 minutes early.  

  ---

  #### **Gameplay (40 min)**  
  **Part 1: Stable Groups (20 min)**  
  - **Rounds 1–3:** Same groups.  
  - **After Round 3:** Rank groups by **total chips**. Top 2 groups stay. Bottom 2 dissolve; reshuffle members into new groups.  
  - **Rounds 4–5:** Play in new groups.  

  **Part 2: Random Groups (15 min)**  
  - **Rounds 6–8:** Reshuffle *all* students into new random groups before each round.  

  **Final Twist (5 min):**  
  - After Round 8, calculate:  
    - Total chips of *all* C players vs. D players in the room.  
    - Average chips per C and per D.  
  - **Do not mention groups**—frame it as "allele" frequencies.  

  ---

  #### **Debrief (20 min)**  
  1. **Data Discussion (5 min):**  
     - *Stable Groups:* "Did high-C groups survive? Did Cs do better here?" (Yes, groups with more Cs dominate collectively).  
     - *Random Groups:* "What happened to Cs over time?" (Decline—Ds always win within groups).  
     - *Final Twist:* "The exact same Round 8 data explains everything through individual frequencies!"  

  2. **Map to Biology (10 min):**  
     - Within-group selection: Ds outcompete Cs locally (selfish alleles win).  
     - Between-group selection: High-C groups "reproduce" (survive reshuffling), making Cs persist.  
     - Gene’s-eye view: "Group success is just the average effect of selfish alleles—it’s all allele sorting!"  
     - **Name the debate:** Dawkins (genes) vs. Gould (groups) here.  

  3. **Limitations (2 min lecture):**  
     - Real trait groups aren’t desk-sized—they’re fluid (e.g., kin groups).  
     - Group "adaptations" (e.g., ant colonies) aren’t just averaged traits—they require emergent coordination. The game can’t show this; pause to explain.  

  ---

  #### **Predictable Problems & Fixes**  
  - **Miscounting chips:** Assign one "banker" per group to manage pots.  
  - **Alliances across groups:** Ban cross-group talk; enforce secrecy.  
  - **The Saint (refuses to defect):**  
    - *Early:* Praise their ethics but urge gameplay for science.  
    - *If they "ruin" data:* Use it! "See how one C elevates their group? But if everyone does this, Ds invade."  
  - **Time per round:** Use a timer (5 min/round max).  
  - **Fractional chips:** Round down (e.g., 9 chips ÷ 4 = 2 each, discard remainder).  

  **Why it works:** Students *feel* the conflict—Ds always beat Cs in their group, but C groups crush D groups. The final twist forces the "bookkeeping" insight. No pre-reading, no grading—just chips and revelation.
