prompt: |-
  I'm part of a small reading group that works through effective-altruism-adjacent philosophy, and our most recent session took up moral trade — the idea, associated with the philosopher Nick Bostrom, that agents with different moral views often leave gains on the table because each spends all of her effort on her own priorities, when a deal could leave both better off by their own lights: you fund my animal-welfare projects and I fund your art museums, even though I barely value the museums and you barely value the animals. The textbook examples are apolitical and low-stakes — two donors swapping which charities they contribute to, legislators logrolling over pet projects that the other side merely shrugs at — and the crucial feature is that my side of the bargain is something you regard as neutral or a mild positive, not something you positively condemn. A genuinely disliked project is supposed to be untradeable: if I think your cause is evil rather than merely non-urgent, the mechanism collapses.

  Our group got stuck on a case that seems to strain the concept: the Missouri Compromise of 1820. Missouri entered as a slave state, Maine was split off from Massachusetts and entered as a free state, and slavery was barred from the remaining Louisiana Purchase territory north of the 36°30′ line. On its face it looks like moral trade: each section gave up something it wanted less than what it secured, both preferred the deal to a union-breaking confrontation, and the two sides had different moral views about slavery to begin with. But the fit seemed off to several of us. Many Northern congressmen regarded slavery not as a defensible priority of someone else's but as an evil — so their concession was not the deprioritization of a neutral project but acquiescence in something they condemned. And unlike a donor swap, the compromise did not merely allocate resources; it wrote a geographic rule into federal law, which arguably legitimated and stabilized the institution's westward footprint rather than containing it. Neither dynamic appears in the standard examples, and it became unclear whether we were looking at a hard case of moral trade or at something the idea was never meant to cover.

  Please analyze the Missouri Compromise as a case of moral trade, and then tell me where the model breaks. Structure your answer as follows: first, "The mapping" — who the players were, what each side's options and payoffs actually were, what was conceded and what was gained, and why both sides preferred the deal to no deal (roughly 300 words); second, "Where the model breaks" — the two worries raised above (the concession as condemned evil rather than deprioritized value, and norm-legitimation rather than resource transfer), plus any further mismatches you see, with an assessment of whether each is fatal or merely complicating (roughly 350 words); third, "What the episode shows about the theory" — whether moral trade needs a background condition, something like each side regarding the other's project as permissible or merely non-urgent, and what that implies for the concept's more ambitious applications, such as deals between people with clashing fundamental values (roughly 250 words); and finally, "Verdict" (roughly 100 words). Keep the history to what I've given or to common knowledge — I want the conceptual analysis, not a lecture on the period.
reasoning: |-
  Okay, I need to analyze the Missouri Compromise through the lens of moral trade theory as described by Nick Bostrom. The user is part of a reading group focused on effective-altruism-adjacent philosophy, and they're grappling with whether this historical event fits the model. Their key concerns are that Northerners viewed slavery as evil rather than neutral, and that the compromise legitimized slavery rather than merely transferring resources. 

  First, I'll map the players and payoffs: pro-slavery South vs anti-slavery North. The South wanted Missouri as slave state and access to western territories, while the North wanted containment and Maine's admission. Without compromise, they faced disunion or violence - a negative-sum outcome. The deal gave South Missouri as slave state and temporary territorial access below 36°30', while North got Maine as free state and slavery banned north of that line. Both preferred this over confrontation, fitting moral trade's mutual gain structure.

  But the model breaks in two places. First, the "neutral concession" assumption fails because Northerners didn't just deprioritize slavery - they actively condemned it. Their concession wasn't funding a mild positive but enabling evil, creating moral distress absent in textbook examples. Second, the compromise didn't just reallocate resources; it established a federal geographic rule that entrenched slavery's legitimacy and future expansion potential. This norm-shaping effect is unlike simple donor swaps.

  These aren't necessarily fatal breaks but reveal limitations. Moral trade works best when parties view each other's goals as permissible but low-priority. Here, fundamental moral disagreement turned "trade" into coerced toleration. For ambitious applications - say between secular humanists and religious conservatives - such deals may require at least mutual recognition of the other's values as non-evil, even if not shared.

  The verdict: it's a borderline case that strains the model. It shows moral trade requires a baseline of "moral detente" where concessions aren't seen as complicity in evil. Without that, what looks like trade becomes something darker - appeasement or coerced compromise.
answer: |-
  ### The Mapping
  The players were Northern (free-state) and Southern (slave-state) factions in the U.S. Congress. Their core conflict was the expansion of slavery into new states. 

  **Northern options/payoffs:**  
  - *No deal:* Risk disunion, war, or continued political deadlock (high cost).  
  - *Deal gains:* Admit Maine as a free state (preserving sectional balance in Senate), prohibit slavery in most Louisiana Territory north of 36°30′ (containing slavery’s expansion).  
  - *Concession:* Accept Missouri as a slave state, allow slavery south of the line.  

  **Southern options/payoffs:**  
  - *No deal:* Face Northern attempts to block slavery’s expansion, risking disunion or loss of political power.  
  - *Deal gains:* Admit Missouri as a slave state (expanding slavery), secure slavery’s future south of 36°30′ in new territories.  
  - *Concession:* Accept slavery’s exclusion in northern territories, admit Maine as free.  

  **Why both preferred the deal:**  
  For the North, the compromise prevented immediate disunion, added a free state (Maine), and restricted slavery’s spread to 55% of the territories. For the South, it gained a critical slave state, protected slavery in key future territories (e.g., Arkansas), and avoided a confrontation threatening their influence. Both sides viewed deadlock or secession as catastrophic (negative-sum), making the compromise a Pareto improvement *by their own metrics*: Northerners valued containment over immediate abolition in Missouri; Southerners valued expansion into Missouri over expansion into *all* territories.  

  ---

  ### Where the Model Breaks  
  **1. Concession as Condemned Evil (Fatal Mismatch):**  
  Moral trade assumes concessions involve "neutral or mild positive" projects (e.g., funding a museum you ignore). Here, Northerners saw slavery as morally abhorrent—not merely "non-urgent." Accepting Missouri as a slave state felt like complicity in evil, violating the model’s core requirement that trades lack profound moral revulsion. This isn’t merely complicating; it reframes the "trade" as coerced capitulation under threat of disunion, not a cooperative exchange of underprioritized goods.  

  **2. Norm-Legitimation vs. Resource Transfer (Major Complication):**  
  Moral trade typically involves discrete resource swaps (e.g., donors redirecting funds). The Missouri Compromise encoded slavery’s geographic legitimacy into federal law, creating a durable *rule* that entrenched the institution’s political standing. Southerners leveraged this to demand future concessions (e.g., the Kansas-Nebraska Act), while Northerners saw it as a moral betrayal. This norm-shaping dynamic—absent in apolitical examples—turns "trade" into institutional validation of contested values.  

  **3. Further Mismatch: External Costs (Complicating):**  
  Standard moral trade assumes isolated actors. Here, concessions imposed irreversible harms on third parties (enslaved people). Northern "gains" (territorial restrictions) excluded those most affected, undermining the model’s assumption of bilateral mutual benefit.  

  **Assessment:** The "condemned evil" mismatch is fatal to classifying this as pure moral trade. Legitimation and external costs are severe complications showing the model’s limits in high-stakes, systemic conflicts.  

  ---

  ### What the Episode Shows About the Theory  
  The Missouri Compromise suggests moral trade requires a **background condition of mutual moral permissibility**. Each side must view the other’s goal as *legitimate though non-urgent*—not fundamentally evil. Here, Northern moral absolutism toward slavery breached this condition, transforming "trade" into a geopolitical truce under duress.  

  For ambitious applications (e.g., trades between secular humanists and theocracies), this implies:  
  - Deals may only succeed where values are *compatible enough* to avoid perceptions of intolerable evil.  
  - "Gains" cannot require endorsing core evils by one’s own lights (e.g., a humanist funding blasphemy laws).  
  - High-stakes trades may stabilize conflicts but risk entrenching injustice, inviting future breakdowns (as the Compromise did in 1854).  
  The theory thus fits best in contexts of *value pluralism without deep moral enmity*—not clashes over non-negotiable principles.  

  ---

  ### Verdict  
  The Missouri Compromise is not a clean case of moral trade. It superficially fits the model (mutual gains via concessions) but fatally violates its ethical precondition: Northerners saw slavery as evil, not a negotiable difference in priorities. The deal’s norm-entrenching effects and third-party harms further distinguish it from textbook examples. It illustrates how moral trade collapses when concessions involve core moral violations, serving instead as a cautionary tale for applying the theory to irreconcilable values.
