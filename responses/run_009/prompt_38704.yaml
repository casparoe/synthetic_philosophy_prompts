prompt: |-
  I'm a science and ideas writer, and over the years my magazine's fact-checking desk has built up a quiet body of rulings on when copy may call something "alive" — a question that comes up more often than you would think, and never with a rulebook. The rulings to date, as best I can reconstruct them:

  - Viruses, in a feature on influenza: the desk required "not technically alive," and last year, in a piece on giant viruses, it vetoed "living particle" outright.
  - Bacteria revived after millions of years in amber and in deep-sea sediment: "living bacteria" and "still alive" passed without objection, though they had done nothing metabolically the whole time.
  - HeLa cells: allowed as "living cells," even "a living piece of Henrietta Lacks," though a cell line in a flask is nobody's organism and cannot survive outside the medium we supply.
  - A mule, in an essay on domestication: "a living animal," sterility notwithstanding.
  - Prions: strictly "infectious proteins," never "alive."
  - Digital organisms, in an artificial-life story: we could say they are "alive, after a fashion," with the signal phrase, but the bare adjective "living" was ruled out.
  - A brain-dead man on a ventilator, in a feature on organ donation: the desk kept "his body is alive" and "life support" in the same paragraph as the flat statement that he was dead.

  I now have a synthetic-biology story due Friday. Researchers have built protocells that copy themselves, pass on heritable variation, and respond to selection — but they cannot make their own parts: every lipid and nucleotide is supplied by the experimenters, and chemically these "cells" are elaborate consumers. The desk will ask me by Thursday whether the lede may say "living cells," or must say "cell-like" or "not technically alive," and I would like to walk in with something better than my gut.

  So tell me: which rules would actually reproduce the desk's track record? I can see a self-maintaining-chemistry rule and an evolution-of-a-lineage rule in the running, and there may be others that fit as well. What does each rule predict about the protocells? What is your best guess about what the desk will do, and why? Then name the further case that would best split the rules that agree on the protocells — some borderline thing a science desk is likely to face (a frozen embryo? a seed bank? a genome-free cell? something stranger) on which those rules come out differently. And if the track record genuinely underdetermines the protocell call, say so plainly, and tell me what principle we would be adopting with each choice — because whatever the desk rules this week will, in practice, become our definition of life for the next decade of copy.
reasoning: |-
  Okay, the user is a science writer dealing with their fact-checking desk's rulings on what can be called "alive." They have a list of past decisions and now face a new case with protocells that self-replicate but rely on supplied components. They need to predict the desk's ruling and understand the underlying principles.

  First, I need to analyze the track record. Let's look at each case: Viruses aren't alive; dormant bacteria are alive; HeLa cells are living; mules are alive; prions aren't; digital organisms are "alive after a fashion"; a brain-dead person's body is alive but the person is dead. 

  What rules fit these? Autonomy seems key—viruses and prions lack it, while bacteria and HeLa cells have some autonomy even if dormant or dependent. HeLa cells need a medium but maintain internal processes. The brain-dead case shows physiological function matters more than consciousness. Digital organisms get a qualifier because they're not biological.

  For the protocells, they self-replicate and evolve but can't make their own parts. They're like HeLa cells but even more dependent. Autonomy-wise, they're similar to HeLa (needing a lab) but lack metabolic independence. The lineage rule fits because they undergo evolution, which was crucial for digital life getting a qualifier.

  The desk might allow "living cells" with context, like mentioning supplied parts. Or they might require "cell-like" to emphasize the dependency. The autonomy rule would lean towards not alive, while the lineage rule might accept "living" with caveats.

  A good test case would be a genome-free cell that performs metabolism but can't evolve. Autonomy rule might call it alive, but lineage rule wouldn't. Or frozen embryos—autonomy suspended, but lineage intact. That splits the rules.

  The user's deeper need is consistency for future articles. They need a defensible principle that aligns with past decisions. Highlighting the tension between autonomy and lineage helps them articulate the desk's implicit criteria. Also, acknowledging underdetermination allows them to push for clarity proactively.
answer: |-
  Based on your fact-checking desk's track record, here's a breakdown of the implied rules, their predictions for the protocells, my best guess for the desk's ruling, and a key test case to split the rules:

  **Implied Rules Fitting the Track Record:**

  1.  **The "Sustained, Integrated Physiological Function (Autonomy)" Rule:** Something is "alive" if it can maintain *its own* integrated physiological processes (metabolism, homeostasis, response) *independently*, even if dormant or requiring a specific external environment provided naturally or artificially. Death occurs when this integrated function irreversibly ceases.
      *   **Fits:**
          *   **Dormant Bacteria:** Integrated function *suspended but intact*; capable of autonomous reactivation.
          *   **HeLa Cells:** Maintain integrated cellular processes (metabolism, division) *autonomously* within the *provided* environment. They are functional units.
          *   **Mule:** Full integrated physiological function as an animal.
          *   **Brain-dead body:** Integrated physiological function (respiration, circulation - via machines; some cellular metabolism) is *artificially maintained*, hence "body alive." The *organism* as an integrated whole capable of autonomous function is dead.
      *   **Rejects:**
          *   **Viruses/Prions:** No inherent metabolism, homeostasis, or independent function. Entirely dependent on host machinery.
          *   **Digital Organisms:** No biological physiological processes. Function is simulated, not autonomous biochemistry.
      *   **Ambiguous:** Frozen Embryo/Seed (depends on resumable function).

  2.  **The "Lineage Capable of Open-Ended Evolution" Rule:** Something is "alive" if it belongs to a lineage capable of reproduction with heritable variation subject to natural selection, enabling adaptation and open-ended evolution over generations, even if individual instances are dependent.
      *   **Fits:**
          *   **Dormant Bacteria:** Part of an evolutionary lineage.
          *   **HeLa Cells:** Reproduce with variation; *are* an evolving lineage (cancer evolution).
          *   **Mule:** Sterile, but *product* of evolving lineages (horse/donkey) and possesses the cellular machinery of life.
          *   **Digital Organisms:** Capable of reproduction, variation, and selection => "alive, after a fashion."
      *   **Rejects:**
          *   **Viruses:** Evolve, but only via host machinery; arguably not independent lineages capable of *open-ended* evolution without hosts.
          *   **Prions:** Replicate conformationally but lack genetic material/heritable variation for Darwinian evolution.
          *   **Brain-dead body:** Lineage ended; no reproduction or evolution possible from this individual.
      *   **Ambiguous:** Frozen Embryo/Seed (potential lineage).

  **Predictions for the Protocells:**

  *   **"Sustained, Integrated Physiological Function (Autonomy)" Rule Prediction:** **NOT "living cells."** The protocells lack *autonomous* metabolism. They cannot synthesize their own lipids or nucleotides; they are entirely dependent on the experimenters supplying these fundamental building blocks. They are elaborate consumers, not autonomous functional units.
  *   **"Lineage Capable of Open-Ended Evolution" Rule Prediction:** **POTENTIALLY "living cells" (likely with caveat).** They replicate themselves (reproduction), pass on heritable variation, and respond to selection. This constitutes a demonstrable evolutionary lineage. This strongly parallels the "alive, after a fashion" allowed for digital organisms.

  **Best Guess for the Desk's Ruling:**

  The desk will **NOT allow "living cells" without significant qualification**, but might permit a phrase like **"arguably living" or "exhibiting key behaviors of life"** *if* strongly contextualized within the experiment. "Cell-like" or "not technically alive" is safer and more likely.

  *   **Why?**
      1.  **Dominance of Autonomy:** The track record shows a strong bias towards requiring *some* level of autonomous function (bacteria, HeLa, mule body). The HeLa precedent is the closest, but HeLa cells *do* perform integrated metabolism *using* supplied nutrients; the protocells *cannot even build their own components* from supplied precursors – a deeper dependency.
      2.  **Evolutionary Precedent:** While digital organisms got a qualified pass, they were explicitly *not* called "living" outright. "Alive, after a fashion" acknowledges the evolutionary behavior while marking a boundary. The desk seems reluctant to grant the full "living" label to non-biological systems or systems lacking biological autonomy.
      3.  **Virus/Prion Parallel:** The dependency on supplied parts is conceptually closer to viruses needing a host cell than to HeLa needing culture medium. The veto of "living particle" for giant viruses is a strong signal.
      4.  **Conservatism:** Fact-checking desks tend towards precision and avoiding overstatement. "Cell-like" is unambiguous and descriptive.

  **The Crucial Test Case to Split the Rules: Frozen Embryos or Seeds in Long-Term Storage**

  *   **Scenario:** A piece on cryopreservation of embryos for IVF or seeds in a global seed vault like Svalbard. Can they be called "living embryos" or "living seeds" while frozen?
  *   **Prediction:**
      *   **Autonomy Rule:** Would likely say **NO, not "living"** while frozen. All metabolic activity is suspended. They are in stasis, not maintaining integrated physiological function. They are *potentially* living, akin to dormant bacteria *before* revival, but not actively alive *during* storage.
      *   **Lineage Rule:** Would likely say **YES, "living"**. They represent a pause in an ongoing biological lineage with the inherent potential to resume reproduction, variation, and evolution once revived. They are frozen stages *of* a living organism's lineage.
  *   **Why it Splits:** This case directly pits the requirement for *active, autonomous function* against the concept of *belonging to an evolutionary lineage with potential*. Your desk's ruling on frozen embryos/seeds would starkly reveal which principle holds more weight for them. The dormant bacteria ruling suggests the Lineage/Autonomy combo is strong, but the *completeness* of metabolic arrest in freezing might trigger the Autonomy rule's rejection of "living" during stasis.

  **Conclusion on Underdetermination & Principle Adoption:**

  The track record **genuinely underdetermines the protocell call.** Both major rules (Autonomy and Lineage) have strong precedents, and the protocells sit precisely at their tension point:

  *   **If the desk allows "living cells" (with caveat):** They are adopting a **Lineage-Centric Principle**, prioritizing the demonstrable capacity for evolution by natural selection within an artificial system, even amidst significant dependency. This leans closer to the digital organism precedent and emphasizes life as a *process*.
  *   **If the desk requires "cell-like" or "not technically alive":** They are adopting an **Autonomy-Centric Principle**, prioritizing the requirement for *inherent, self-sustaining biochemical function* (even if dormant) and viewing the protocells' dependency on supplied building blocks as a disqualifying lack of metabolic independence. This leans closer to the virus/prion precedent and emphasizes life as a *state of being*.

  **Recommendation:** Walk in framing the tension explicitly. Present the Autonomy rule (fits dormant bacteria, HeLa, mule, brain-dead body; rejects viruses/prions/digital bare adjective) and the Lineage rule (fits bacteria, HeLa, mule, qualified digital; rejects prions/brain-dead). Highlight that the protocells are the **synthetic equivalent of the Frozen Embryo test case** – they force a choice between these principles. Argue that a qualified phrasing ("systems exhibiting evolution," "protocells blurring the line," "arguably living within their artificial environment") is most consistent with the desk's careful precedent on borderline cases (digital organisms, giant viruses) while respecting the strong Autonomy precedent seen in rejecting "living particle" for viruses. Avoid the bare, unqualified "living cells."
