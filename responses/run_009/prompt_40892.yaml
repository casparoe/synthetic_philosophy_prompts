prompt: |-
  Something I've never managed to square: states claim they can turn foreigners away at the border for any reason or no reason -- a visa application gets refused without explanation, and nobody thinks a moral argument has been owed. But the very same legal systems accept non-refoulement, the idea that you cannot push someone back into persecution, even though on paper the refugee still has no right to be admitted in the first place. So the practice seems to be: your claim to enter counts for nothing, but your claim not to be returned to danger overrides the state's right to exclude. What view of the right to exclude does that pattern actually presuppose? Is it basically a doing/allowing distinction -- returning someone makes the state complicit in a harm, while refusing entry merely fails to confer a benefit -- and does that even hold up, given that border enforcement physically blocks people who are already fleeing? Or is the implicit thought something else: that exclusion is legitimate only as a means of protecting some collective project, and the project loses its point when it costs someone their life? And where does that leave the economic migrant, the person escaping starvation rather than a firing squad -- is the practice only coherent if you deny that severe poverty is the kind of harm that generates claims against other states, and is that denial actually defensible? Finally, tell me where the practice is philosophically underdetermined: could several rival theories of the right to exclude all license this exact arrangement, and what would have to change if a state took one of the other theories seriously?
reasoning: |-
  Okay, the user is grappling with a deep tension in international law and ethics regarding state sovereignty and refugee rights. They've noticed that states claim absolute authority to deny entry to foreigners, yet simultaneously accept non-refoulement obligations that prevent returning people to danger. This creates a seeming contradiction: rejection at the border requires no justification, but rejection that leads to persecution is forbidden. 

  The user is clearly well-versed in the subject - they frame the paradox precisely and ask sophisticated follow-ups about economic migrants and philosophical underdetermination. This isn't someone encountering these concepts for the first time. Their frustration with the inconsistency feels palpable. I should avoid oversimplifying.

  Hmm... their core question seems to be: what underlying principle makes this dual stance coherent? They suggest two possibilities - a doing/allowing distinction (complicity vs. mere non-assistance) or some threshold about when collective projects lose legitimacy. Both need careful examination.

  The doing/allowing angle is tricky because border enforcement isn't passive - it actively blocks people already in flight. The user explicitly points this out with "physically blocks people who are already fleeing." That's a strong counterargument. Maybe the distinction holds only if we imagine some idealized passive refusal, not the reality of border walls and patrols.

  The collective project theory feels more promising. States could argue exclusion preserves self-determination until it directly causes extreme harm like death. But then the user nails the follow-up: why does this threshold only apply to persecution, not starvation? That exposes the uncomfortable arbitrariness in how we define "persecution" versus "poverty." 

  Ah, and their last question is brilliant - they want to know if multiple philosophical theories could justify the current practice. That suggests they suspect the system might be post-hoc rationalization rather than principle-driven. I should list possible theories that could converge here despite different foundations: Hobbesian sovereignty, Lockean consent, utilitarian balancing, etc. But crucially, each would demand different adjustments if taken seriously - like expanding protection to economic migrants under utilitarianism.

  The user's phrasing "where does that leave the economic migrant" reveals ethical concern beyond abstract theory. They're troubled by the exclusion of those fleeing poverty. I should acknowledge that while current law distinguishes persecution from poverty, the moral lines are blurrier - starvation can be as deadly as bullets. 

  Noticing they used "coherent" twice - they really want to know if the system is logically defensible or just hypocritical. I'll need to admit both: it's coherent only if we accept certain contested premises about state sovereignty and harm thresholds. The underdetermination point is key - the practice survives precisely because multiple philosophies can claim it, making reform difficult.

  This deserves a structured response: first unpack the legal tension, then evaluate their proposed explanations, then examine the economic migrant problem, finally show how different theories both support and would change the system. The conclusion should validate their sense that the status quo rests on shaky philosophical ground.
answer: |-
  This tension between absolute exclusion rights and non-refoulement obligations reveals a complex, perhaps unstable, philosophical foundation for state sovereignty. Let's dissect the presupposed view of the right to exclude, test your proposed explanations, and examine the implications:

  **1. The Presupposed View of the Right to Exclude:**
  The pattern suggests a view where the state's right to exclude is **fundamental but conditional**, grounded in **sovereignty and self-determination**, yet **limited by a minimal humanitarian threshold.** Key elements include:
      *   **Primacy of Sovereignty:** States are presumed to have an inherent right to control entry as an essential aspect of self-government and protecting their political community ("collective project").
      *   **No Positive Right to Enter:** Foreigners possess no general *right* to admission; entry is a privilege granted by the state.
      *   **Negative Duty of Non-Complicity:** While the state owes no *positive* duty to admit, it incurs a *negative* duty not to be *directly complicit* in causing severe, imminent, and specific harm.
      *   **Harm Threshold:** The limitation kicks in only when exclusion would result in an exceptionally severe outcome (persecution, torture, death) for which the state's action (refoulement) is the direct, proximate cause.

  **2. Evaluating the "Doing/Allowing" Distinction:**
  Your hypothesis is insightful but faces significant challenges:
      *   **Refusal vs. Refoulement:** Refusal *at the border* is seen as merely "not allowing entry" (failing to confer a benefit). Refoulement is seen as an active "doing" – forcibly sending someone back into harm's way.
      *   **The Blocking Problem:** This distinction frays at the border itself. When someone fleeing persecution presents themselves, physically blocking entry *is* an active intervention preventing escape. Denying entry *at that moment* directly causes their return to danger. The line between "not helping them escape" and "actively preventing their escape and ensuring return" becomes blurred. The legal system often resolves this pragmatically by focusing on the *location of the act* (refusal at the border vs. expulsion from within) and the *specificity of the harm* (general danger vs. targeted persecution), rather than a pure philosophical distinction.

  **3. The "Collective Project" Threshold:**
  This view holds more weight:
      *   **Legitimacy Condition:** The right to exclude derives legitimacy from serving the collective good (security, welfare, cultural continuity) of the political community.
      *   **Threshold of Illegitimacy:** Exercising this right loses legitimacy when it directly inflicts catastrophic harm (death, torture) on an individual. Protecting the collective project cannot justify becoming an *instrument* of such extreme suffering.
      *   **Proximate Cause:** The harm must be a direct, foreseeable consequence of the state's *specific act* of return, not merely a consequence of the general state of the world or the individual's original situation. Persecution by a specific actor (state, non-state group) meets this criterion.

  **4. The Economic Migrant & The Harm Question:**
  This is where the practice's coherence is most strained and morally contested:
      *   **Current Practice:** Non-refoulement generally does *not* apply to those fleeing "mere" severe poverty or generalized violence without specific targeting (persecution). The harm is deemed different.
      *   **Presupposed View:** This practice assumes:
          *   **Distinction in Harm Type:** Persecution involves *intentional, targeted* harm by identifiable agents (state/group), whereas poverty is seen as systemic, impersonal, or "natural" (even if caused by human structures). Refoulement makes the state complicit in the persecutor's intent; returning someone to poverty lacks this direct agency link.
          *   **Distinction in Harm Source:** The harm in persecution is directly inflicted by the agent the state returns the person to. The harm of poverty is not *inflicted by* the state of origin in the same targeted way, nor is the admitting state seen as complicit in causing the poverty.
          *   **Resource & Capacity Limits:** Protecting against persecution is seen as a minimal, absolute duty. Protecting against poverty is viewed as a potentially limitless positive obligation requiring resource redistribution, exceeding the scope of non-refoulement.
      *   **Is the Denial Defensible?** This is highly debated:
          *   **Critique:** Severe poverty, famine, or climate disaster can be just as lethal as persecution. The distinction between "intentional" harm and harm caused by neglect, structural injustice, or state failure is often arbitrary. Blocking someone fleeing starvation *is* actively preventing their survival.
          *   **Defense (of the distinction, not necessarily the morality):** States argue persecution involves a specific violation of fundamental rights (life, liberty, belief) by a political entity, creating a unique moral claim. Addressing global poverty requires systemic solutions (aid, trade) beyond individual non-return obligations. Expanding non-refoulement to all severe harm could overwhelm asylum systems and erode the specific protection for political refugees.

  **5. Philosophical Underdetermination: Rival Theories Licensing the Practice:**
  The current arrangement *is* underdetermined. Several distinct theories could justify it, though they might imply different reforms:

      *   **Hobbesian/Statist Realism:** Sovereignty is absolute. Non-refoulement is a pragmatic concession to international norms or self-interest (avoiding instability, moral condemnation), not a fundamental limit. *Change if taken seriously?* Non-refoulement could be easily abandoned if inconvenient.
      *   **Lockean/Consent-Based:** Citizens form a community with exclusive property rights (territory). Admission requires consent. Non-refoulement arises from a minimal natural law duty not to directly cause catastrophic harm to *any* person. *Change?* Might imply slightly stronger duties to *consider* claims fairly at the border, but still reject general admission rights.
      *   **Cosmopolitan Threshold View (Current practice's closest fit):** Sovereignty grants broad exclusion rights, but these are constrained by a minimal threshold of harm where complicity becomes morally intolerable. *Change?* Could potentially expand the harm threshold (e.g., include famine caused by deliberate state policy).
      *   **Utilitarian:** Exclusion maximizes collective welfare. Non-refoulement is justified because the immense disutility of being tortured outweighs the minor utility loss to citizens from admitting one refugee, *and* because blanket returns create instability. *Change?* Could *dramatically* shift the practice. If admitting many economic migrants clearly increased global welfare (despite local costs), exclusion might become unjustified. Non-refoulement might be weakened if costs became too high.
      *   **Kantian/Deontological:** Individuals have inherent dignity. Exclusion violates a duty if it uses the foreigner *merely as a means* or actively destroys their capacity for agency (e.g., by returning them to death). Mere refusal might be permissible if done justly. *Change?* Might demand stronger due process at borders and potentially recognize a broader right to seek asylum from severe threats to agency (including extreme poverty?).

  **What Would Change Under Different Theories?**
      *   **Expanded Protection:** A utilitarian theory prioritizing global welfare, or a Kantian theory emphasizing agency-preservation, might demand extending non-refoulement-like protections to those fleeing life-threatening poverty or climate disaster.
      *   **Weakened Non-Refoulement:** A pure Hobbesian view might allow states to ignore non-refoulement when inconvenient. A strict consent-based view might weaken procedural safeguards.
      *   **Stronger Admission Rights:** A robust cosmopolitanism might challenge the idea of *no* right to enter, suggesting basic needs generate claims against states with capacity.
      *   **Procedural Rigor:** Kantian/Lockean views might demand far more rigorous and individualized assessment at borders to avoid *any* risk of refoulement to harm.

  **Conclusion:**

  The practice presupposes a **sovereignty-based right to exclude, fundamentally limited only by a prohibition on active, direct complicity in extreme, targeted harm (persecution)**. The doing/allowing distinction provides a partial explanation but struggles with the active nature of border enforcement. The "collective project" threshold view is more robust, defining the point where exclusion becomes illegitimate complicity. The exclusion of economic migrants hinges on a contested distinction between targeted persecution and impersonal poverty – a distinction that may not hold up morally when the harm (death) is equivalent. Philosophically, the current arrangement is underdetermined; it can be rationalized by theories ranging from realist statism to moderate cosmopolitanism, but taking *any* single theory seriously would likely lead to significant changes, either expanding protections, weakening obligations, or altering procedures. The tension reflects an unresolved conflict between the claims of political community and the demands of global humanity.
