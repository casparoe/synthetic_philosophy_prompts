  Okay, the user is diving deep into the nuances of Elizabeth Anscombe's opposition to Truman's honorary degree. They've read an essay summarizing her position but their friend, an Anscombe scholar, hinted that the essay missed something crucial about intention. The user wants a detailed audit of the essay's claims, pointing out accuracies, oversimplifications, and outright errors. They also want to know if the essay's conclusion—that her view is an impractical absolutism—holds up once corrected.

  First, I need to recall Anscombe's actual arguments. She was a Catholic philosopher focused on moral absolutes, especially concerning intention in actions. The essay claims she was a pacifist, but that's not quite right. She wasn't opposed to all war; she adhered to just war theory, which condemns targeting noncombatants. The essay simplifies her stance as being about scale and civilian deaths, but her core argument was about Truman's *intention* to kill civilians as a means to end the war. That's a key distinction because just war theory allows for unintended civilian deaths (double effect), not deliberate targeting.

  The essay also positions her as an early voice for noncombatant immunity in international law. While her protest did contribute to discourse, scholars would note that the principle predates her. Anscombe's unique contribution was her rigorous application of intentionality, which influenced later Catholic and philosophical discussions on ethics in war.

  Regarding the essay's conclusion: it claims her reasoning would condemn all wartime leaders, making her protest quixotic. But this misrepresents her. Anscombe's absolutism is specifically about intending civilian harm. Leaders like Churchill or Roosevelt might be criticized, but each case requires examining their intentions and actions. Not all bombing campaigns are morally equivalent. The essay's conclusion likely stems from misunderstanding her focus on intention, leading to an overgeneralization.

  The user might also be seeking clarity on why intention matters so much in moral philosophy. They're probably trying to reconcile the essay's portrayal with their friend's cryptic comment. By correcting the misinterpretations, the user can see that Anscombe's protest wasn't futile but a precise ethical challenge relevant even today. The episode actually highlights the danger of normalizing atrocities through honor, a point the essay underemphasized.
answer: |-
  Here's a detailed audit of the essay's claims about Elizabeth Anscombe's protest against Truman's honorary degree, based on her actual arguments (primarily in her pamphlet "Mr. Truman's Degree") and scholarly understanding of her work:

  **Claim 1: "Anscombe, a devout Catholic convert and pacifist..."**
  *   **Accurate:** "Devout Catholic convert" is correct.
  *   **Wince/Deny:** Calling her a "pacifist" is a **significant mischaracterization.** Anscombe was **not a pacifist.** She was a staunch adherent of the **Catholic Just War Tradition (JWT).** Her objection was *not* to war itself, but to *specific actions within war* that violated JWT principles, primarily the absolute prohibition against *intentionally* targeting noncombatants. She explicitly defended the *possibility* of a just war.

  **Claim 2: "...was horrified by what the new weapons had made possible — for the first time in history, whole cities of noncombatants could be annihilated in a moment."**
  *   **Accurate:** The scale and immediacy horrified her and were relevant context.
  *   **Oversimplification:** While the scale was shocking, it wasn't the *core* of her *philosophical* objection. Her argument wasn't fundamentally *quantitative* (though scale made the violation egregious), but *qualitative and moral* – the *nature* of the act itself (deliberate mass killing of innocents) was intrinsically evil, regardless of the specific weapon or scale. The weapon made it practically possible, but the moral wrong existed conceptually without it.

  **Claim 3: "Her pamphlet argued that Truman had ordered the massacre of Japanese civilians on a scale that no legitimate military purpose could justify..."**
  *   **Accurate:** She argued the scale was unjustifiable.
  *   **Oversimplification:** This frames it as a proportionality argument (ends vs. means). While proportionality is part of JWT, Anscombe's **central and radical argument was about *intention*.** She contended that the *direct and intentional targeting* of civilians (the cities of Hiroshima and Nagasaki themselves, not just military targets within them) was the primary purpose of the bombings. The deaths weren't an unfortunate side-effect; they were the *chosen means* to coerce surrender. *This* intentional choice is what made it murder, according to JWT and her Thomistic/Aristotelian ethics.

  **Claim 4: "...that a man who does this is a mass murderer..."**
  *   **Accurate:** She used this strong language, based on her conclusion that he intentionally ordered the killing of innocents as a means.
  *   **Context Needed:** This flows directly from her analysis of intention and the JWT prohibition. She saw it as a straightforward application of moral principle, not mere hyperbole.

  **Claim 5: "...and that a university which honours him becomes an accomplice in honouring murder."**
  *   **Accurate:** This was her explicit conclusion. Honoring someone for an action implies approving of that action. To honor Truman *for* the decision that led to Hiroshima/Nagasaki (which she believed was the primary reason for the honor) is to approve of mass murder.

  **Claim 6: "...her pamphlet is remembered today chiefly as one of the earliest statements of the principle, later written into international law, that noncombatants must never be deliberately attacked."**
  *   **Oversimplification/Mildly Problematic:**
      *   **Not "Earliest":** The principle of noncombatant immunity is ancient (rooted in JWT, medieval codes, Enlightenment philosophers) and was explicitly stated in pre-WWII international agreements (e.g., Hague Conventions). The bombing of cities during WWII represented a widespread violation, not the invention of the principle.
      *   **Correct:** Her pamphlet is a **powerful and influential *reassertion*** of this principle in the face of its massive violation and the emerging nuclear age. It was a crucial moment in *reviving* and *vigorously defending* the absolute core of the principle – the prohibition on *intentional* attack – against consequentialist justifications. Her emphasis on *intention* was particularly significant.
      *   **Scholarly View:** Scholars see it as a landmark *philosophical defense* and *clarification* (especially regarding intention) of the existing principle, crucial for post-war legal and ethical discourse, rather than the *origin* of the principle itself.

  **Claim 7: "It was a noble protest, but it was also a quixotic one: applied consistently, her reasoning would make it impossible to honour virtually any wartime leader — Churchill and Roosevelt as much as Truman..."**
  *   **Deny/Strongly Contest:** This conclusion **fundamentally misrepresents Anscombe's argument and its scope.** It stems directly from the earlier mischaracterizations (pacifism, focus only on scale/proportionality, downplaying intention).
      *   **Intention is Key:** Anscombe's absolutism applied *specifically* to the *intentional targeting of noncombatants*. It does *not* condemn all killing in war, all wartime leaders, or even all civilian deaths.
      *   **Case-by-Case:** Her reasoning requires examining the *specific actions and intentions* of each leader and each act. She was condemning Truman for a *specific act* she judged to be mass murder (intentional city bombing). Applying it "consistently" doesn't mean condemning all leaders automatically; it means condemning *any leader* who *intentionally orders the mass killing of noncombatants*.
      *   **Churchill/Roosevelt:** While area bombing campaigns (e.g., Dresden, Tokyo firebombing) are highly controversial and arguably violate JWT, Anscombe focused on Truman and the atomic bombs. Applying her *principle* rigorously *would* lead her to condemn the *intentional* aspects of area bombing as well. However, the essay implies her view *necessarily* condemns *all* wartime leadership per se, which is false. It condemns specific, intrinsically immoral *actions*. One *could* potentially honor a wartime leader for other aspects of their leadership without endorsing every action, though Anscombe would argue the atomic bomb decision was so central and horrific for Truman that honoring *him* amounted to honoring *that act*.
      *   **Not "Nobody Accepts":** While absolute noncombatant immunity (especially regarding intention) faces challenges in practice and theory (e.g., debates over "double effect"), it remains the *core principle* of JWT, Catholic moral teaching, and modern International Humanitarian Law (IHL - Geneva Conventions, Additional Protocols). Many philosophers, theologians, and jurists *do* accept this absolutism regarding intentional attacks. Anscombe stood firmly within this tradition, applying it rigorously without exception.

  **Claim 8: "...and almost nobody, then or now, accepts absolutism of that kind."**
  *   **Deny:** As above, the absolutism against *intentionally* targeting noncombatants **is precisely the cornerstone of the Just War Tradition and is formally enshrined in International Humanitarian Law** (e.g., the principle of distinction in Article 48 of Additional Protocol I to the Geneva Conventions: "Parties to the conflict shall at all times distinguish between the civilian population and combatants..."). While violations occur and debates exist about proportionality, collateral damage, and defining combatants, the *absolute prohibition on deliberate attacks on civilians* is widely accepted *in principle* by states, international bodies, and ethical traditions. Anscombe was defending this established (though often violated) absolute norm.

  **What the Episode Actually Shows (Corrected Picture):**

  The Oxford episode shows:
  1.  **The Power of Rigorous Moral Philosophy:** Anscombe applied Thomistic/Aristotelian ethics (focusing on acts, intentions, and intrinsic evil) with fearless logic to a highly charged political issue.
  2.  **The Centrality of Intention:** Her protest highlighted that the core moral issue wasn't *just* the scale or the suffering, but the *deliberate choice* to use the mass killing of civilians as a *method* of warfare. This challenged the prevailing utilitarian justifications ("it saved lives").
  3.  **The Challenge of Applying Principles to Power:** It exposed the tension between abstract moral principles and the realities of wartime decisions, national myth-making, and the desire to honor leaders for perceived overall achievements, even when stained by profound moral atrocities.
  4.  **The Danger of Normalization:** Anscombe argued that honoring Truman normalized and implicitly approved of an act she considered mass murder, eroding the absolute prohibition on targeting civilians. The overwhelming vote against her illustrated how easily such normalization can occur.
  5.  **Enduring Relevance of the Just War Tradition:** Far from being "quixotic," her protest was a vital reassertion of a fundamental principle of ethical warfare that remains critically relevant today. It wasn't about impractical pacifism, but about upholding a specific, demanding, yet widely recognized (in theory) limit on the conduct of war.

  **Conclusion:**

  The essay's summary captures the surface facts and Anscombe's strong condemnation but **fatally misrepresents her core argument by omitting or downplaying the centrality of *intention***, mistakenly labeling her a pacifist, and misunderstanding the nature of her absolutism (which is against *intentional* killing of noncombatants, not war or leadership per se). This misrepresentation directly leads to the erroneous conclusion that her position was an impractical, universally condemning absolutism "nobody accepts." Correctly understood, Anscombe was defending a specific, well-established (though often violated) absolute principle within Just War Theory and ethics. The episode shows the difficulty of upholding that principle in the face of overwhelming power and consequentialist reasoning, not the quixotic nature of the principle itself. Her protest remains a powerful challenge to how societies remember, judge, and honor actions involving mass violence against civilians.
