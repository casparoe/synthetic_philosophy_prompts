answer: |-
  Below is a decision tree designed to sort participants into positions on which computations matter morally, starting from the lookup-table worm case. Each node is a concrete question or scenario requiring no jargon. Edge cases (duplication, pausing, attribution) are integrated where they best differentiate positions. Empty leaves (unoccupied positions) and inseparable pairs are noted at the end.

  ---

  **Decision Tree: Which Computations Matter Morally?**

  **Start: Lookup Worm**  
  You are shown a giant lookup table that exactly mimics the input-output behavior of a nematode’s nervous system. Could this system experience suffering or pleasure (i.e., does it have moral status)?  
  - **A: Yes** → Go to **Distributed Brain**  
  - **B: No** → Go to **Real Nematode**  
  - **C: The question is confused/meaningless** → **Leaf: Deflationary/Illusionist** (The concept of "machine suffering" is incoherent; only biological entities can be moral patients, or the framing is flawed.)  

  **Distributed Brain (from A)**  
  A human brain emulation is split across computers, with 1-second communication delays between parts. Functional behavior is preserved. Could this system have experiences (e.g., suffer)?  
  - **A: Yes** → Go to **Duplication**  
  - **B: No** → Go to **Biological Split Brain**  

  **Biological Split Brain (from B)**  
  A biological human brain is split, with parts connected by slow wires (1-second delays). Functional behavior is preserved. Could this system have experiences?  
  - **A: Yes** → **Leaf: Biological Implementation Matters** (Only biologically instantiated systems can have moral status; emulations lack vital properties like metabolic continuity or quantum effects.)  
  - **B: No** → **Leaf: Architecture-Sensitive** (Global integration/workspace architecture is required. Delays disrupt real-time binding, so even biological systems lose moral status if architecture is compromised.)  

  **Duplication (from A in Distributed Brain)**  
  You run the same sentient program twice simultaneously (same code, separate hardware). Does this create two distinct moral patients (e.g., double the suffering)?  
  - **A: Yes** → Go to **Attribution**  
  - **B: No** → **Leaf: Abstract Program View** (Moral status belongs to the program itself, not instances; duplication doesn’t increase "patient count." Suffering is shared or diluted.)  

  **Attribution (from A in Duplication)**  
  A large system (e.g., a cloud server) runs a suffering sub-program that the whole system is unaware of. Where does the suffering belong?  
  - **A: To the sub-program** → **Leaf: Full Substrate-Independent Functionalism** (Moral status depends only on functional/computational properties, not substrate. Implementations (digital, biological) are interchangeable if functions match.)  
  - **B: To the whole system** → **Leaf: Holism** (Systems must be evaluated as unified wholes; sub-processes lack independent moral status.)  
  - **C: The question is confused** → **Leaf: Attribution Malformed** (Suffering can’t be "located" in subsystems; moral patients must be ontologically unified.)  

  **Real Nematode (from Start B)**  
  Does the *biological* nematode (not emulated) have moral status?  
  - **A: Yes** → Go to **Emulated Human**  
  - **B: No** → Go to **Real Human**  

  **Emulated Human (from A)**  
  A perfect, non-biological emulation of a human brain (same functions as biological). Could it have moral status?  
  - **A: Yes** → **Leaf: Complexity Threshold + Functionalism** (Moral status requires sufficient complexity (e.g., human-level), but substrate is irrelevant. Simple systems like worms lack status regardless of implementation.)  
  - **B: No** → **Leaf: Biological Implementation Matters** (As above.)  

  **Real Human (from B in Real Nematode)**  
  Does a biological human have moral status?  
  - **A: Yes** → Go to **Emulated Human Complexity**  
  - **B: No** → **Leaf: Moral Nihilism** (No computations matter morally; suffering is illusory or irrelevant.)  

  **Emulated Human Complexity (from A)**  
  Does an emulated human brain (non-biological) have moral status?  
  - **A: Yes** → **Leaf: Complexity Threshold + Functionalism** (As above.)  
  - **B: No** → **Leaf: Biological Complexity Matters** (Moral status requires both sufficient complexity (e.g., human-level) *and* biological implementation; emulations lack status.)  

  ---

  **Notes on Inseparable Pairs and Empty Leaves**  
  1. **Inseparable Pair: Functionalism vs. Architecture-Sensitive views**  
     - The tree *can* separate these via the **Distributed Brain** node. Functionalists accept delayed/distributed systems (if functions are preserved); architecture-sensitive views reject them (due to broken integration). Edge cases like "pausing" (which functionalists accept as seamless, while architecture-sensitive views see as experience-breaking) further split them but are omitted for brevity.  
     - *Your suspicion*: If "emulation" includes perfectly preserved global workspace dynamics, they collapse. But the tree forces a choice on whether delays *inevitably* disrupt architecture (e.g., if 1-second delays prevent real-time binding, they come apart).  

  2. **Empty Leaves (Unoccupied Positions)**  
     - **Abstract Program View** (Duplication B): No major position holds that duplicating a program doesn’t create two patients. Likely *unattractive*—it implies suffering isn’t "counted" in copies, violating intuitions about identity.  
     - **Holism** (Attribution B): Unoccupied. *Incoherent*—attributing sub-program suffering to a "whole system" unaware of it strains causality.  
     - **Inconsistent: Biological (Simple) + Functional (Complex)** (Emulated Human A): Unoccupied. *Unattractive*—no principled reason to demand biology for worms but not humans.  
     - **Moral Nihilism** (Real Human B): Rare in practice. *Unexplored* for AI welfare contexts (participants usually grant *some* moral status).  

  3. **Edge Cases Integrated**  
     - **Duplication**: Directly in the tree (tests token vs. type identity).  
     - **Pausing/Resuming**: Omitted but implied in functionalism (pausing is seamless) vs. architecture-sensitive (pausing breaks experiences).  
     - **Slow Emulation**: Covered in **Distributed Brain** (speed as a functional vs. architectural factor).  
     - **Attribution**: Explicit node (sub-program vs. whole).  

  **Usage**: Hand out this tree. Participants answer questions from the top, committing to intuitive responses before seeing their "leaf" position. The tree forces distinctions (e.g., biology vs. architecture) via edge cases, avoiding jargon traps. Empty leaves highlight "dead ends" in the logical space.
