  We are drafting a memo for the board meeting regarding the Executive Director's proposal for a "futarchy pilot" on the office consolidation decision. The memo should take a position: approve, reject, or approve with conditions. We must address the ED's strongest argument (information extraction) and be honest about the limitations at this scale.

  Key concerns from the board:
  - Small market size (only 40 traders plus some volunteers) may not be sufficient for efficient markets.
  - Conflict of interest: regional staff whose jobs are at stake would be trading.
  - Risk of sabotage: if the market says consolidate, staff might tank donor relationships to punish the decision.
  - Whether this is a meaningful test of futarchy or just an expensive survey.

  The ED's arguments:
  - Prediction markets can extract honest information that people won't say aloud (e.g., about donor reactions).
  - The setup: two conditional markets (one for each branch) on donor retention at 18 months post-decision.
  - A board member's kid (with market-making experience) will help seed liquidity, and $15k in subsidies.

  My personal view: I like the idea in principle (vote on values, bet on beliefs) but doubt it works at this small scale.

  We must draft a memo that:
  1. Takes the ED's side seriously (acknowledge the potential for information extraction).
  2. Identifies which parts of futarchy are load-bearing and which are lost at this scale.
  3. Recommends a clear position with conditions if necessary (and conditions must be specific and fix a problem).
  4. Be honest: if it's harmless because too small to matter, say so.

  After analysis, I recommend: **Approve with conditions**

  Why?
  - The information extraction potential is real, and even a small market might yield insights that we wouldn't get otherwise (e.g., about donor behavior).
  - However, the risks (conflict of interest, sabotage) and limitations (small market) are significant and must be mitigated.

  Conditions to propose:
  1. **Exclude staff with a direct conflict of interest from trading**: Specifically, the regional directors and their direct reports (who would lose jobs in consolidation) should not trade. This reduces the risk of biased trading and sabotage. Instead, allow other staff, long-term volunteers, board members, and perhaps even a select group of major donors (if feasible and anonymous) to trade. This also slightly increases the trader pool.
  2. **Change the metric**: Donor retention at 18 months is too far out and vulnerable to sabotage. Instead, use a shorter-term metric that is less manipulable and more directly tied to the decision. For example:
     - **Option A**: A composite metric including both short-term (e.g., donor retention at 6 months) and leading indicators (e.g., donor engagement scores, survey responses about consolidation, or even staff morale if we can measure it anonymously) that are less prone to sabotage.
     - **Option B**: Use a metric that is harder to sabotage, such as donor acquisition cost or total donation amount in the first 6 months (if we think that's the main concern). However, the original goal was about retaining existing donors, so we need to align with that.
     - **Rationale**: A shorter time frame reduces the window for sabotage and makes the market more timely. Also, by including multiple indicators, we reduce the impact of any single one being gamed.
  3. **Run the market as an information input, not a binding decision**: Do not commit in advance to follow the market outcome. Instead, use the market prices as one input among many (e.g., staff feedback, financial analysis) for the board's final decision. This avoids the "tank the metric" problem and acknowledges that the market is small and experimental.
  4. **Cap the subsidies**: The $15k is acceptable, but ensure it's used to seed liquidity and not as large payouts that could incentivize manipulation. The market should be small-stakes to encourage participation without creating huge financial incentives for distortion.
  5. **Transparently frame the pilot**: Admit that this is a small-scale test and not a full futarchy implementation. We are testing whether we can extract useful information via a market mechanism, but we are not committing to the full "bet on beliefs" philosophy because of the limitations.

  Why not reject?
  - The idea has merit for information extraction, and we are an environmental nonprofit that should be open to innovation. The cost is modest ($15k) and the potential learning could be valuable for future decisions.

  Why not full approval?
  - The risks (conflict of interest, sabotage) and the small scale make it unwise to bind ourselves to the outcome. Also, without conditions, the market may produce distorted results.

  Draft Memo:

  ---

  **MEMORANDUM**

  **TO**: Board of Directors, Green River Alliance  
  **FROM**: [Your Name], Board Member  
  **DATE**: [Current Date]  
  **SUBJECT**: Recommendation on Executive Director's Proposal for a Futarchy Pilot on Office Consolidation Decision  

  As requested, I have reviewed the Executive Director's proposal to conduct a "futarchy pilot" to inform our decision on whether to consolidate our three regional offices. This memo outlines my assessment and recommendation for the September board meeting.  

  **Background**  
  The proposal involves running two conditional internal prediction markets: one forecasting donor retention at 18 months if we consolidate the offices, and one forecasting the same metric if we maintain the status quo. Staff and long-term volunteers would trade contracts tied to the outcomes in each scenario, with the higher-priced branch determining our decision. The proposal includes $15,000 in subsidies to encourage participation and the involvement of an experienced market maker to seed liquidity.  

  **Strengths of the Proposal**  
  I support the core insight behind this idea: prediction markets can surface dispersed and honest information that traditional methods (e.g., surveys, meetings) often fail to capture. In particular, staff and volunteers may possess valuable intuitions about donor reactions to consolidation that they are reluctant to share openly. At scale, such markets have demonstrated remarkable accuracy in aggregating beliefs. Even at our size, this pilot could yield unique insights that complement our usual decision-making processes.  

  **Key Limitations and Risks**  
  However, we must acknowledge that our pilot diverges significantly from ideal futarchy conditions:  
  - **Scale**: With ~40 staff and a few volunteers, the market is extremely small. Research suggests prediction markets require hundreds of participants to efficiently aggregate information and resist manipulation. Our market may be noisy or unrepresentative.  
  - **Conflict of Interest**: Regional staff whose jobs depend on the outcome have both the incentive and the potential means to distort the market (e.g., by trading to favor their preferred outcome or, if consolidation is chosen, sabotaging donor relationships to "prove" the market wrong).  
  - **Metric Vulnerability**: Donor retention at 18 months is a slow, lagging indicator that could be deliberately undermined by disgruntled staff, creating a perverse outcome where following the market triggers its own failure.  
  - **Philosophical Gap**: True futarchy separates "betting on beliefs" from "voting on values." Here, the market outcome would directly dictate a major organizational change, but our small scale and conflict risks mean the market price may not reflect unbiased beliefs.  

  **Recommendation: Approve with Conditions**  
  I recommend we proceed with a modified pilot that preserves the information-extraction benefits while mitigating risks. Specifically:  

  1. **Exclude Staff with Direct Conflicts**: Only staff without a direct stake in the consolidation outcome (e.g., headquarters staff, non-regional program staff) and long-term volunteers should trade. Regional directors and their direct reports must be excluded to reduce bias and sabotage risks. Board members and select major donors (if anonymity is ensured) could also participate to broaden the trader pool.  

  2. **Revise the Success Metric**:  
     - Use a **shorter time horizon** (e.g., 6 months post-decision) to reduce exposure to manipulation.  
     - Supplement donor retention with **1-2 additional metrics** that are harder to sabotage and more responsive to the decision, such as:  
       - Donor engagement scores (e.g., email open rates, event attendance).  
       - An anonymous staff morale survey conducted 3 months post-decision.  
       - Total donation amounts from existing donors in the first 6 months.  
     The exact composite metric should be designed by the Finance/Programs teams to balance sensitivity and robustness.  

  3. **Non-Binding Market Outcome**: The market prices should inform—not determine—our decision. The board will retain final authority, considering the market output alongside financial projections, staff feedback, and other inputs. This avoids incentivizing sabotage and acknowledges the pilot's experimental nature.  

  4. **Cap Subsidies and Stakes**: Limit individual trades to small stakes (e.g., max $50 per trader) to encourage participation without creating excessive financial incentives. The $15k subsidy is acceptable but should primarily reward accurate forecasting (e.g., via a bonus pool for top traders) rather than inflating prices.  

  5. **Frame as a Learning Pilot**: Position this internally as an experiment in innovative decision-making, not a test of futarchy. We are evaluating whether markets can extract useful latent knowledge at our scale, not outsourcing our judgment.  

  **Why This Approach?**  
  These conditions directly address the most critical risks:  
  - Excluding conflicted traders reduces bias and sabotage potential.  
  - A shorter, multi-metric approach minimizes gaming opportunities.  
  - Making the market advisory removes perverse incentives and aligns with our governance role.  

  The adjusted pilot still tests the core hypothesis—that markets elicit honest beliefs—but in a safer, more pragmatic form. At worst, we spend $15k on a structured anonymous survey with dynamic updating. At best, we uncover insights about donor behavior that reshape our thinking.  

  If we cannot implement these conditions, I would recommend rejecting the pilot in its current form due to unacceptable risks. But with them, I believe the potential learning justifies the modest investment.  

  I look forward to discussing this at the September meeting.  

  ---
answer: |-
  **MEMORANDUM**  
  **TO**: Board of Directors, Green River Alliance  
  **FROM**: [Your Name], Board Member  
  **DATE**: [Current Date]  
  **SUBJECT**: Recommendation on Futarchy Pilot Proposal for Office Consolidation Decision  

  ### **Introduction**  
  I’ve reviewed the Executive Director’s (ED) proposal for a "futarchy pilot" to guide our decision on consolidating regional offices. The core idea—using prediction markets to extract honest, dispersed knowledge about donor reactions—is intellectually compelling and addresses a real organizational gap: staff may withhold critical insights due to social pressure (e.g., regional directors’ opposition). However, after careful analysis, I recommend **approving the pilot with specific conditions** to mitigate key risks while preserving its informational value. Below, I outline the rationale, conditions, and honest assessment of what this pilot can realistically achieve at our scale.  

  ---

  ### **Strengths of the Proposal: Why It Deserves Consideration**  
  The ED’s strongest argument is that prediction markets can surface **unspoken truths** that surveys or meetings cannot. For instance:  
  - **Information extraction**: Staff/volunteers may privately suspect consolidation could alienate donors (or boost efficiency) but avoid saying so openly to avoid conflict. Markets incentivize truth-telling by rewarding accurate predictions.  
  - **Aggregation of dispersed knowledge**: Individual observations (e.g., a volunteer hearing donor concerns about local presence) could collectively inform the outcome.  
  - **Low-cost innovation**: The $15k subsidy and pro bono market-making support make this a low-risk test of a novel approach.  

  In principle, "vote on values, bet on beliefs" could improve decisions in value-driven nonprofits like ours, where emotions often override evidence.  

  ---

  ### **Key Risks and Limitations: Why Conditions Are Non-Negotiable**  
  While the concept has merit, our small scale and organizational context introduce critical flaws:  
  1. **Insufficient market size**:  
     - 40–50 traders (staff + volunteers) is vastly below the scale where prediction markets thrive (typically 100s–1,000s). Thin liquidity increases volatility, manipulation risk, and statistical noise. **Result**: Prices may reflect randomness or groupthink, not true beliefs.  

  2. **Conflicts of interest and sabotage**:  
     - Staff facing job loss (e.g., regional directors) could trade to skew results or tank donor relationships if consolidation proceeds. This risks a self-defeating outcome: the market’s "success" metric fails *because* we followed the market.  

  3. **Misaligned success metric**:  
     - Donor retention at 18 months is too distant and vulnerable to external factors (e.g., economic shifts, unrelated scandals). It also creates a long window for sabotage.  

  4. **"Futarchy-lite" reality**:  
     - True futarchy requires mass participation, binding outcomes, and belief-driven markets. At our scale, this pilot would function as an **expensive anonymous survey with real-time updating**, not a robust market. We gain dynamic insights but lose the efficiency of large-scale price discovery.  

  ---

  ### **Recommendation: Approve with 4 Specific Conditions**  
  I support a pilot that isolates the proposal’s strengths (information extraction) while neutralizing its risks. Key conditions:  

  1. **Exclude conflicted traders**:  
     - **Restriction**: Staff whose roles are directly at risk (regional directors, their direct reports) **may not trade**. Volunteers with no stake may participate.  
     - **Why this fixes a problem**: Removes incentives to manipulate trades or sabotage outcomes. Expands the pool by inviting all non-conflicted staff (e.g., HQ, programs) + board members + 10–15 long-term donors (anonymized).  

  2. **Shorten and broaden the success metric**:  
     - **New metric**: **6-month donor retention rate** (faster feedback) **PLUS a composite score** including:  
       - Short-term donor engagement (e.g., email open rates, event attendance).  
       - Staff morale (via anonymous pulse survey 3 months post-decision).  
       - Cost savings from consolidation (if applicable).  
     - **Why this fixes a problem**: Reduces sabotage vulnerability and external noise. A composite metric is harder to game and aligns with holistic outcomes.  

  3. **Treat the market as advisory, not binding**:  
     - **Condition**: Market prices inform but **do not dictate** the decision. The board retains final authority.  
     - **Why this fixes a problem**: Eliminates the "self-sabotage" incentive and acknowledges the pilot’s experimental scale. We still gain insights without surrendering governance.  

  4. **Cap individual stakes and anonymize trades**:  
     - **Condition**: Limit trades to $10–$50/person to discourage gambling-like behavior. Use anonymized trading (e.g., via a secure platform) to reduce peer pressure.  
     - **Why this fixes a problem**: Low stakes reduce distortion risks while incentivizing truthful bets. Anonymity prevents coercion.  

  ---

  ### **Honest Assessment: What This Pilot Can and Cannot Achieve**  
  - **What it is**: A structured mechanism to extract anonymous, aggregated beliefs from non-conflicted stakeholders. It will likely reveal hidden concerns/optimism about donor reactions more effectively than surveys.  
  - **What it isn’t**: A true test of futarchy. The "load-bearing" elements of futarchy—mass participation, efficient price discovery, and binding outcomes—are lost at our scale. This is an "expensive survey with extra steps," but the dynamic updating (traders adjusting bets as new info emerges) adds unique value.  
  - **Scale reality**: With ~50 traders, the market may be "harmless but noisy." It could produce valuable signals or random fluctuations—either way, the cost is justifiable for organizational learning. **But do not expect statistical rigor or foolproof predictions.**  

  ---

  ### **Conclusion**  
  I recommend **approving the pilot with the four conditions above**. This preserves the ED’s goal of uncovering unspoken insights while mitigating risks of manipulation, sabotage, and overconfidence in small-scale markets. If conditions are rejected, I would oppose the pilot—the risks outweigh the benefits.  

  **Final note**: If we proceed, position this internally as a "collaborative forecasting experiment," not futarchy. It tests whether markets can supplement (not replace) our decision-making. I’ll draft a simplified one-page FAQ for staff to ensure clarity if the board approves.  

  Let’s discuss at the September meeting.
