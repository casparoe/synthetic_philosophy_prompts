prompt: |-
  I've been reading about teleosemantics and i can't decide between the two main flavors of it. Can you write a dialogue between two philosophers of mind who disagree about whether mental content needs evolutionary history? One holds the classic etiological view (roughly the Millikan/Papineau line: a state's content is fixed by what it was selected for doing in the ancestors of the system). The other thinks content is fixed by what the state does for the organism now, and she wants to lean on duplicate-style cases: if a frog-creature were assembled molecule-by-molecule by some freak accident, with no evolutionary history at all, it seems like it would have all the same beleifs as an ordinary frog that evolved. Have them actually push back on each other's points: the etiological side should press on how the "current role" view explains misrepresentation (if content is whatever the state does now, doesn't that collapse into plain old functionalism, where false beliefs become impossible?), and the current-role side should press on how history can matter when the biological details of the history can vary so much between species. Neither should be a pushover. Maybe let one of them try a compromise move at the end, like normalizing the notion of function so that both actual history and the right kind of dispositional structure count, and see if the other one finds it convincing.

  Begin your response directly with the dialogue itself, no preface or commentary.
reasoning: |-
  We are writing a dialogue between two philosophers: Alex (etiological view) and Blair (current-role view). They are discussing teleosemantics and the role of evolutionary history in fixing mental content.

  Alex (etiological): Good morning, Blair. I've been thinking about our discussion on teleosemantics. I remain convinced that without an evolutionary history, mental content simply cannot be fixed. Take your duplicate frog, created by a freak accident. It might behave identically to a normal frog, but it lacks the historical context that gives its states meaning. For the normal frog, the fly-catching tongue snap is an adaptation selected for catching flies. That's why the state represents 'fly'. The duplicate has no such history; its state is just a fluke.

  Blair (current-role): Alex, I think you're overemphasizing history. What matters is what the state does for the organism now. The duplicate frog's visual state triggers a tongue snap in the presence of small, dark, moving dots. That state plays the functional role of detecting flies—or at least, what the frog takes to be flies. It doesn't matter how the frog got there; the state's content is fixed by its current role in the organism's cognitive economy. If it snaps at a fly, it's correct; if it snaps at a BB pellet, it's misrepresenting. The content is 'fly' because that's what the state is supposed to do now.

  Alex: But that's exactly the problem. How do you define "supposed to" without history? If you say the state is supposed to cause tongue snaps when flies are present, but in the duplicate frog, there's no design or purpose behind the state—it's just a random arrangement—then how can it be supposed to do anything? Without a history of selection, there's no normativity. You're collapsing into plain functionalism, where any state that correlates with flies in the present is representing flies, and if it correlates with BB pellets, then it's representing BB pellets. But then the frog can't misrepresent; it's always right because whatever it snaps at is what the state is currently doing. That can't be right.

  Blair: Not at all. The normativity comes from the role the state plays in sustaining the organism's life. The duplicate frog, just like the evolved one, needs to eat to survive. The state that triggers the snap is part of a system that functions to get nutrients. If it snaps at a non-nutritious BB pellet, that's a failure because it doesn't fulfill the biological need. The content is fixed by the biological role now—sustaining the organism. So, the state represents 'nutritious flying thing' or something similar, and misrepresentation occurs when it fails to achieve that end.

  Alex: But you're smuggling in history! How do you define "biological role" without evolution? The duplicate frog has no ancestors; its "biological role" is just what it happens to do. Why is getting nutrients the goal? In an evolved frog, we can say that because natural selection favored frogs that got nutrients. But in the duplicate, it's just a random event. There's no basis for saying that the state is supposed to get nutrients; it might as well be supposed to do anything else. You need a history to ground the teleology.

  Blair: I don't think so. Consider an organism that has just been created by a mad scientist, fully formed. It's designed to hunt rabbits. But in the lab, it's never encountered one. Now, it sees a rabbit for the first time and chases it. On your view, since there's no evolutionary history of selection for rabbit-chasing, the state doesn't represent 'rabbit'. But that seems absurd. The state clearly has the function of detecting rabbits because that's what it was designed to do. And in the duplicate frog case, even without a designer, the state has a function because it contributes to the frog's survival now. The function arises from the current causal role in self-maintenance.

  Alex: The mad scientist case is different because there is a designer, and we can attribute functions based on that. But in the accidental duplicate, there's no designer. So, in the natural world, without design or selection history, there is no function. Your current-role view might work for artifacts, but not for natural organisms. For the frog, the function of the heart is to pump blood because that's what it was selected for. In the duplicate, the heart-like thing pumps blood, but it doesn't have the function of pumping blood; it's just doing it. Similarly, the visual state isn't supposed to detect flies; it's just doing it.

  Blair: But why should we care about the past? The duplicate frog is identical in every physical respect. It has the same needs—it will die if it doesn't eat. Its internal states are involved in the same regulatory processes. If we look at its current dispositional structure, it's wired to respond to certain stimuli in ways that promote survival. Why isn't that enough? History seems like an add-on.

  Alex: Because without history, there's no way to say what the state is for. Take a different example: a human with a mutation that causes a new neural state. It hasn't been selected for anything. It happens to cause the person to run away from loud noises. Is that state representing 'danger'? Not on my view. It might be beneficial, but until it's selected, it doesn't have a proper function. Your view would say that because it promotes survival now, it represents danger. But then, what if a mutation causes a state that makes the person run toward loud noises? That might be harmful, but on your view, if it's currently promoting survival in some context, it could represent something positive. It's too flexible.

  Blair: Actually, in my view, the content is fixed by the broader system. The state's content is determined by how it fits into the overall functional architecture that sustains the organism. If the mutation is integrated in a way that it's triggered by stimuli and leads to behavior that normally would be adaptive, then it can have content. If it causes maladaptive behavior, it might not be part of a well-functioning system, but that doesn't mean it has no content—it might just be malfunctioning. Misrepresentation is still possible because the state fails to achieve the biological goal of the system.

  Alex: What if the entire organism is a one-off accident? Like Swampman, Donald Davidson's thought experiment. A lightning strike creates a duplicate of a man. He has no evolutionary history. You'd say he has beliefs, right? But what are they about? On my view, he doesn't have intentional states at all. He's just a physical duplicate.

  Blair: Of course he has beliefs! He walks and talks like a human, he avoids dangers, he might even discuss philosophy. He has a complex functional organization geared toward survival and interaction with the world. His states represent the world as being a certain way because of how they are causally connected to it and how they guide his behavior. History is irrelevant.

  Alex: But without history, the connections are accidental. There's no basis for saying that a state caused by a tree represents 'tree'. It just happens to be caused by trees. But it could have been caused by anything else. Only history can fix that it's supposed to be caused by trees.

  Blair: Why? The state is part of a system that, given the laws of nature, will tend to be caused by trees and will cause tree-appropriate behavior. That's enough to fix content. The dispositional structure of the system, including counterfactuals, determines content. If in normal conditions, it's caused by trees and it leads to behavior that is successful only if there's a tree, then it represents tree.

  Alex: But what are "normal conditions"? Without history, that's arbitrary. For the evolved frog, normal conditions are the ones in which its ancestors were selected. For the duplicate, there are no normal conditions.

  Blair: Normal conditions are the ones in which the mechanism operates reliably, given its design. For the duplicate, it's the conditions that match the environment it's in. If it's placed in a fly-rich environment, then when flies are present, that's normal. If it snaps at a BB pellet, that's abnormal, and it's misrepresenting.

  Alex: I'm not convinced. But maybe we can find a middle ground. What if we normalize the notion of function? Perhaps we can say that function can be based on either actual history or the right kind of dispositional structure. For naturally evolved organisms, history matters. For duplicates, we can appeal to the fact that they have the same structural properties that, in normal evolution, would have been selected. So, we extend the concept of function to include any system that has the appropriate causal organization, regardless of origin.

  Blair: That sounds like you're giving up the necessity of history. If the dispositional structure is sufficient, then why insist on history in the natural cases? It becomes redundant.

  Alex: Not redundant. In the natural world, history is what explains why the dispositional structure is there. But in the duplicate, we can say that the structure itself, by being of the type that is typically produced by selection, can ground function. So, for the frog, history fixes the function. For the duplicate, the fact that it has a structure identical to one that normally has a certain history allows us to attribute the same function.

  Blair: Hmm. I'm not sure that's consistent. If the structure alone is sufficient for function in the duplicate, then why isn't it sufficient in the evolved frog? Why do we need to appeal to history at all? It seems like you're adding an extra layer that isn't necessary.

  Alex: Because without history, we can't explain why this structure has this function. The structure is the same, but the function is derived from what it was selected for. In the duplicate, we're making an analogy to the evolved case. It's a way of extending the concept.

  Blair: But then you're making content attribution dependent on the existence of evolved counterparts. What if the duplicate is of a species that doesn't exist? Or what if it's a unique structure? If we found a naturally occurring, complex organism with no evolutionary history—say, a spontaneously formed crystal creature—I'd still say its states have content based on what they do for it now. You'd deny that because no history. But that seems chauvinistic.

  Alex: Perhaps. But in such a case, I might say it has no mental content. It's just a complex automaton. Only systems with the right kind of history or designed by an intelligence have genuine intentionality.

  Blair: Well, then we're at an impasse. I think your view denies intentionality where it obviously exists. But I'll think about your compromise. Maybe we can say that in the actual world, most functions are historical, but in principle, a system can have functions without history if it has the right causal organization.

  Alex: And I'll admit that the duplicate case is challenging. Let's continue this discussion next week?

  Blair: Agreed. Same time?
answer: |-
  **Alex:** Good morning, Blair. I’ve been reflecting on our teleosemantics debate. I still think you’re missing the core point: mental content requires evolutionary history. Take your duplicate frog—assembled by chance, with no ancestors. It might snap at flies, but that behavior doesn’t *mean* anything. Without a history of selection, there’s no normativity to ground content. The state isn’t *supposed* to detect flies; it just does. Only etiology can fix that "supposed to."

  **Blair:** Alex, you’re stuck in the past! The duplicate frog’s visual state triggers snapping at small, dark moving things *now*, and that behavior sustains its survival—it gets nutrients. That current role is what fixes content as 'fly' (or 'food'). Why drag in history? If the frog snaps at a BB pellet instead, it misrepresents because the state fails its present biological role: nourishment. History is irrelevant when the system’s current causal structure does all the work.

  **Alex:** That’s where you collapse into functionalism. If content is just "whatever the state does now," then misrepresentation vanishes. Suppose your duplicate frog’s state fires at BB pellets 90% of the time. On your view, isn’t it then *supposed* to detect BB pellets? After all, that’s its current function. But intuitively, it’s *mis*representing them as food. Without history, you have no baseline for "proper" function—no way to say the state is *malfunctioning* when it snaps at pellets. Etiology solves this: the state misrepresents because it’s deviating from what it was selected for in ancestors.

  **Blair:** You’re conflating function with accident. The state’s content isn’t fixed by what it *typically* does now; it’s fixed by its role in the organism’s *self-sustaining organization*. If snapping at pellets doesn’t nourish the frog, it’s a failure of that system—even without history. But let’s press your view: imagine two frog species with identical snap-behavior. Species A evolved in fly-rich swamps; species B evolved in a niche where similar-looking toxic bugs were common, but the snap-behavior was selected for scaring predators. Same state, same behavior, but different historical functions. So on your view, the state means 'fly' for species A and 'threat' for species B? That’s absurd! Content should depend on the organism’s current needs, not arbitrary historical details.

  **Alex:** Not arbitrary—history *explains* the function. For species B, the state was selected for predator deterrence, so its content is 'threat,' even if it now snaps at flies in a new environment. That’s a feature, not a bug! It captures how content can persist through functional changes. Your "self-sustaining organization" is too vague. What counts as "self-sustaining" for the duplicate frog? Without selection history, every causal process is just physics. A rock "sustains" itself by not crumbling, but we don’t say it has functions. Etiology provides the teleology: functions are what traits were *maintained* to do.

  **Blair:** You’re ignoring counterfactuals. For the duplicate frog, in *ideal conditions*, its state would cause snapping only at nutritious flies. Misrepresentation happens when actual conditions deviate—like BB pellets mimicking flies. The normativity comes from the system’s design blueprint, even if it wasn’t designed by evolution. Think of a spontaneously formed human: she’d still believe 'water quenches thirst' because her physiology is geared to process H₂O. History doesn’t add anything.

  **Alex:** But what defines "ideal conditions" or "design blueprint" without history? For evolved humans, ideal conditions are those in which selection occurred. For your spontaneous human, it’s arbitrary. Your view reduces to Fodor-style asymmetrical dependence, but that fails for novel stimuli. Etiology anchors content in concrete, historical success. Besides, your duplicate cases are science fiction; in the real world, evolution is how functions arise.

  **Blair:** They’re thought experiments to test necessity! And your history-only view has its own flaws: what about newly evolved traits with no selection history yet? A mutation causes a novel neural state that helps a bird navigate by stars. On your view, it has no content until selected—but the bird clearly represents 'star position' now. History can’t explain that. Current role can.

  **Alex:** Fair point. Perhaps we need a compromise. What if we normalize "function" to include both actual selection history *and* the right dispositional structure? For naturally evolved systems, history fixes content. For duplicates or mutants, if the system has a structure identical to one that *would* be maintained by selection (in a suitable environment), we attribute the same function. So the duplicate frog’s state has the function of detecting flies because its structure matches an evolutionarily stable design.

  **Blair:** Hmm. That’s better, but it still privileges history. Why not just say content is fixed by the dispositional structure *alone*? If the structure supports robust, survival-promoting responses, that’s sufficient. Adding history feels like epiphenomenal. Take your hybrid view: if we found a real duplicate frog, you’d grant it content only by analogizing to evolved frogs. But if we discovered a *unique* organism with no evolutionary analogs—say, a silicon-based life form—you’d deny it content, even if it has complex, adaptive "beliefs." I’d say it does. Your compromise still excludes too much.

  **Alex:** Maybe, but it avoids your normativity problem. For the silicon life form, I’d need to see if its "functions" are grounded in some history—like self-organization—or just contingencies. But you’re right: I’m less comfortable denying content to your unique organism. Perhaps we can refine the compromise: functions require either history or a structure that *sustains* the system in a way that’s *reducible* to selection-style dynamics, even without actual selection.

  **Blair:** I’m still skeptical. But I’ll admit your challenge about misrepresentation is tough. Let’s table this and revisit next week? I want to think about how "sustain" might ground norms independently.

  **Alex:** Agreed. Same time?
