  The core paradox is stark: explicit price-fixing agreements are per se illegal under Sherman Act Section 1, but tacit collusion through parallel pricing escapes liability despite identical consumer harm. I need to dissect the implicit theories behind this distinction. 

  First, candidate rationales for the current doctrine: 
  - The metaphysical view: genuine agreement requires communicated intent
  - Evidentiary proxy: agreement signals durable collusion
  - Fairness shield: firms deserve autonomy over unilateral choices
  - Pro-competitive preservation: avoiding chilling effects on market monitoring

  The game theory perspective from oligopoly models undermines all these. Tit-for-tat strategies in repeated prisoner's dilemmas can sustain collusion without communication. This suggests the legal distinction may rest on philosophical assumptions about joint action - perhaps drawing from contract law's "meeting of minds" tradition rather than behavioral realities.

  For the second layer, I should separate what's essential to the doctrine from what's merely compatible. The agreement requirement seems fundamental, not just administrative. Courts consistently demand "plus factors" beyond parallel behavior, indicating they see communicated intent as the moral line.

  Now the hardest part: if we switched to a structural approach targeting oligopoly equilibria, enforcement would transform radically. We'd need new remedies like compulsory price cuts or market fragmentation. But the objection about punishing unavoidable equilibrium behavior is serious - can firms be liable for existing in concentrated markets? 

  My verdict: the current doctrine is pragmatically coherent but metaphysically inconsistent. It prioritizes administrability over economic reality, which is defensible given enforcement constraints. The strongest objection - that it lets harmful conduct escape - remains valid, but reflects policy choices rather than logical flaws.

