answer: |-
  Here’s an argument for your character, designed to feel organic to a conversation between friends, grounded in mutual expectation theory, and respecting your constraints. It avoids monolithic duties while marking clear boundaries for when defiance *is* morally permissible.

  **The Friend's Argument (Dialogue Format - Adjust to Voice):**

  "Look, I get the fury. I do. That server *should* earn a living wage without relying on my guilt. But when you refuse to tip here, right now, in *this* city, you’re not just protesting a system. You’re exploiting it. Let me explain, because it’s not about politeness, it’s about fairness within the rules *everyone else* is playing by.

  Think of it like... rowing on a crowded river. Back home, maybe you rowed solo, or with a partner who split the effort evenly by contract. Here, the custom is different: the person steering the boat (the restaurant owner) pays the rower (the server) less, expecting passengers (diners) to chip in fuel directly. It’s a lousy boat design! Everyone here argues about *that*. But the point is: right now, this boat is moving *because* all the passengers, however grudgingly, are chipping in fuel. The rower rows expecting it. The owner steers expecting it. Passengers pay expecting their fuel contribution keeps the rower going.

  You step into this boat. You get rowed smoothly across the river – served your meal, water refilled, plates cleared. Then, when it’s time to chip in fuel, you refuse. ‘I object to this boat design!’ Okay. But the rower *still* rowed you, expecting that fuel. The other passengers chipped in. *They* covered the cost of your smooth ride. You got the benefit of a system running on mutual expectation – the rower’s effort, the owner’s reliance on passenger fuel, the other passengers’ compliance – but you skipped your part of the *current* bargain that makes it function *at this moment*.

  **It transfers to other conventions because the core is the same:** It’s about not *free-riding* on a mutually expected practice you knowingly benefit from. Queueing? Jumping the line exploits everyone else’s patience and adherence to order. Crossing against the light? You rely on drivers expecting pedestrians at crossings, not darting out mid-block, creating dangerous unpredictability. Greeting customs? Ignoring them rejects a small but foundational act of mutual recognition that oils social interaction. The *content* differs wildly – tipping is economic, queueing is order, greetings are symbolic – but the *structure* is the same: you enter a web of reciprocal expectations, take the benefit it provides, and then unilaterally violate the expectation you were counted on to fulfill. That’s the harm: **disrupting the reciprocity that makes the convention work for others, after you've already accepted its benefit.**

  **Now, your strongest point:** What if the convention is locally contested? What if servers here are actively striking for wage reform? Then, absolutely, refusing to tip *could* be solidarity, joining the local argument. But that’s the key: *joining the local argument*. It requires understanding the *specific* nature and stage of the local struggle. Is your refusal part of an organized action, timed with worker demands? Or is it just your isolated protest, invisible to anyone but the stiffed server? If it’s the latter, you’re likely not strengthening the movement; you’re just stiffing the worker caught *in* the system you hate. **So, the border of the obligation lies here:** When your defiance demonstrably aligns with and supports an *active, organized local resistance* challenging the convention itself, it shifts from free-riding to solidarity. Absent that context, it’s just unilateral harm within the existing frame.

  **And for you, specifically, as a visitor?** Yes, the obligation is real, but its *weight* is asymmetric. You didn't grow up here, you won't stay, you didn't choose it. That means:
  1.  **Your obligation to *conform* is strong:** Avoid exploiting the mutual expectations you knowingly step into and benefit from (like the served meal).
  2.  **Your obligation to *defend* or *perpetuate* the convention is weak or non-existent.** Critique it loudly! Write articles! Lobby! Support local movements to change it. Your outsider perspective is valuable.
  3.  **Your obligation to *understand nuance* is higher.** Locals absorb the context instinctively. You have to work harder to discern if your defiance is meaningful solidarity or just disruptive self-righteousness. Ignorance isn’t a moral shield when you choose to participate (by dining out).

  So, refusing to tip tonight? It isn’t noble defiance of an unjust system *in practice*. It’s refusing to pay your share of the fuel *after* you enjoyed the ride everyone else paid for. You make the server bear the immediate cost of your abstract principle. Protest the system by all means, but find a way that doesn’t stiff the rower mid-river."

  **Where the Argument is Most Vulnerable & When It Fails:**

  1.  **The "Actual Harm" Threshold:** A careful opponent will press: *"Prove my single non-tip actually harms the server or disrupts the system in any measurable way. It's a drop in the ocean. My protest has symbolic value, and the system absorbs tiny defections."* This is hard to empirically refute at the individual act level. The argument relies on the *principle* of reciprocity and the *aggregate* danger of widespread defection, but for one isolated act by a visitor, the tangible harm can seem negligible.
  2.  **The "No Real Benefit Received" Challenge:** *"I received bad service! The convention failed *me*! Why should I uphold my end?"* While service quality *might* mitigate the *amount* of tip, it doesn't erase the underlying structure of mutual expectation that facilitated the interaction. Did you receive *any* service within the expected framework? This requires nuance.
  3.  **The "Superior Alternative Action" Challenge:** *"I paid the server directly a living wage equivalent *and* explained why I wasn't tipping the conventional way. Isn't that better?"* This directly attacks the "free-riding" claim. If the worker is made financially whole *outside* the convention, the immediate harm is arguably negated, though the systemic disruption argument remains (confusion, accounting issues). **This is a strong counter.** If your protagonist credibly does this, the friend's argument weakens significantly.
  4.  **The "Irredeemably Immoral Convention" Limit:** The argument concedes that **if a convention causes direct, severe, and unavoidable harm** (e.g., participating in a discriminatory practice, even if locally expected), conformity is *not* obligatory, even for visitors. A visitor refusing to wear a discriminatory symbol or participate in a caste ritual isn't free-riding; they are refusing complicity in direct harm. Tipping, however unjust its *origins*, doesn't inherently meet this threshold *in the act of tipping itself* – the harm is structural and indirect. An opponent might argue *all* participation entrenches harm, pushing tipping towards this category. **If convincingly argued, this could override the reciprocity obligation.** The friend must rely on the distinction between indirect structural complicity vs. direct harm-inflicting action.
  5.  **The "Local Contention" Boundary Re-Testing:** *"You conceded defiance is okay with organized local resistance. What constitutes 'organized'? One union? A hashtag? A majority opinion? How proximate must the defiance be?"* This boundary is inherently fuzzy. A savvy protagonist could argue she *is* joining a vast, if diffuse, national movement against tipping, exploiting the visitor's unique position to make a point locals fear to make.

  **Why this works for your novel:**
  *   It's grounded in a relatable metaphor (rowing) that avoids legalism.
  *   It identifies a core moral wrong (free-riding on reciprocal expectations after benefiting) applicable across diverse conventions.
  *   It concedes the protagonist's strongest point (joining local resistance) and marks a clear, if contestable, boundary.
  *   It frankly addresses the visitor's unique position and states the asymmetry of obligations (conform vs. defend).
  *   It acknowledges its own vulnerabilities, making the friend seem thoughtful, not dogmatic.
  *   It leaves room for the protagonist's integrity – she can still hate the system and protest, just via different means.

  This gives your friend a robust, principled stance rooted in fairness and reciprocity, without making him a caricature or turning the chapter into a philosophy lecture. The protagonist's counter-arguments (exploiting the vulnerabilities above) will drive the dramatic tension.
