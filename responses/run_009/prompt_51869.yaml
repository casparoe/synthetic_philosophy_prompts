prompt: |-
  I do product ops at a small company making a voice assistant aimed at older adults -- medication reminders, "call my daughter", weather, plus a general chat layer. Most requests are innocuous, but we keep hitting the same kind of case: a user who's clearly being scammed ("read me the code they texted so I can prove it's me"), a user with probable dementia asking for something they'd never ask for at 3pm rather than 3am, and lots of milder stuff where we can't tell if we're being protective or just condescending. Right now refusals get made ad hoc by whoever's on call and it's inconsistently applied to put it mildly.

  I want a decision procedure my team can run per request, and I want it built around a distinction I've been kicking around but haven't seen stated cleanly anywhere: when an assistant doubts a request there are at least three different moves -- refuse (tell them no), substitute (do what you think they actually want rather than what they asked for), and comply-with-a-warning -- and I suspect these come apart in ways the usual "paternalism vs. autonomy" framing misses, because substitute isn't even visible to the user as a refusal, it just quietly happens. If philosophy has a better carving of this territory, use theirs over mine, but say what it is.

  Format: give me exactly five numbered items, each a sentence or two, no intro or conclusion. The items should be the steps/questions in order, including where the procedure hands off to a human (we can escalate maybe 1 in 10,000 requests, so that had better be rare) and where it just says comply even when we feel icky about it. Weave in how the steps land on these as you go: the scam case (where the scammer has already told the user WE'RE the scam), and one I got yelled at for last week -- a user asked us to stop medication reminders because her daughter checks anyway. Within whichever item you're least sure of, flag that uncertainty in a parenthetical, and make one item or parenthetical say how confident you are in the procedure overall -- don't add a sixth item to do it.
reasoning: |-
  Hmm, the user is in product ops for a voice assistant aimed at older adults, dealing with tricky cases where users might be scammed or cognitively impaired. They want a clear decision procedure for handling doubtful requests, moving beyond the simple paternalism vs. autonomy debate. They've identified three approaches: refuse, substitute, and comply-with-a-warning, and want this built into a step-by-step process for their team.

  The user specifically mentions two pain points: scam scenarios (like reading verification codes) and cases like stopping medication reminders against medical advice. They need a system that handles these consistently with minimal human escalation, given their low capacity for manual review.

  Key requirements from the query: exactly five numbered steps, no intros/conclusions, weave in the scam and medication reminder examples, flag uncertainty in one item, and include a confidence assessment within the existing items.

  The core challenge is balancing protection with respect. The substitute action is particularly interesting—it's invisible to the user but ethically loaded. Philosophically, this maps to discourse on soft paternalism (Thaler & Sunstein's "nudge" theory) and relational autonomy (emphasizing decision-making within social contexts). The scam case requires hard refusal to prevent immediate harm, while the medication reminder involves deeper relational tensions—here a warning + delayed action creates space for human intervention.

  For the procedure structure: Start with immediate harm checks (to catch scams), then assess cognitive mismatch (for substitutions), then warnings for high-stakes overrides like medication changes. Step four must handle the "icky but necessary" complies, and step five routes rare escalations. Confidence note fits best in step four—acknowledging that some complies feel uncomfortable despite passing checks.

  The medication reminder example shows why delayed compliance works: it respects autonomy while creating friction for reconsideration. The scam example justifies why refusal must be absolute—no negotiation when malicious actors are involved.
answer: |-
  Here are five numbered steps for the decision procedure:

  1. **Immediately refuse if the request poses clear, imminent harm (e.g., reading verification codes, sharing financial info), regardless of user insistence, as compliance facilitates fraud.** (This addresses the scam case where refusal is non-negotiable, even if the scammer has poisoned the well against you.)  
  2. **Check if the request likely stems from acute confusion (e.g., unusual time, context, or phrasing) and substitute a probable intended action *only* if the substitute is unambiguous (e.g., "call my daughter" at 3am becomes "Would you like me to call emergency services?").** (Uncertainty: Defining "unambiguous" is context-dependent and risks overreach.)  
  3. **Comply-with-a-warning for high-stakes requests conflicting with known user patterns or safety (e.g., disabling medication reminders), stating the risk clearly ("Stopping reminders may make you miss doses. Confirm: 'Disable all reminders permanently?'").** (This handles the medication reminder case by adding friction without overriding.)  
  4. **Comply without intervention for ambiguous but non-dangerous requests ("icky" cases like odd but harmless chat commands), as our confidence in this procedure is moderate (~70%) but erring toward autonomy reduces unintended condescension.**  
  5. **Escalate to a human *only* if the request involves potential legal/ethical boundaries, persistent distress after refusal/substitution, or complex familial/safety conflicts exceeding automated checks (e.g., repeated demands to disengage from verified caregivers).**
