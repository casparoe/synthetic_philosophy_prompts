  {$1,$2} or {$2,$4}.  

  **BEN:**  
  Right. Probability of the {$1,$2} pair is 1/2. Probability of {$2,$4} is 1/4. But—and here’s the kicker—conditional on seeing $2, the probability you’re holding the larger of {$1,$2} is *twice* as likely as holding the smaller of {$2,$4}.  

  **LILY:**  
  Why?  

  **BEN:**  
  Bayes’ theorem. The chance of seeing $2 from {$1,$2} is (1/2) × (1/2) = 1/4—pick the pair, then pick the larger. From {$2,$4}, it’s (1/4) × (1/2) = 1/8—pick the pair, then pick the smaller. Total probability of seeing $2: 1/4 + 1/8 = 3/8. So conditional probability the other is $1? (1/4) / (3/8) = 2/3. Other is $4? (1/8) / (3/8) = 1/3.  

  **ROSE:**  
  So if Lily sees $2, the expected value of the other envelope is (2/3)×$1 + (1/3)×$4 = $2. Exactly what she has. Zero gain.  

  **BEN:**  
  Bingo. Same for $4, $8, any amount above $1. Only if you see $1 is the gain positive.  

  **LILY:**  
  *(Frowning)*  
  But you said Aunt Mabel’s setup makes the gain positive *whatever* you see.  

  **BEN:**  
  I did. And it *is*—for a *different* prior. She mentioned another version: geometric distribution on the smaller amount. Probability (1/3) for $1, (2/9) for $2, (4/27) for $4, and so on. *There*, no matter what *M* you see, the expected gain is +10%.  

  **ROSE:**  
  How?  

  **BEN:**  
  Conditional probabilities shift. If you see $2, the chance the other is $4 becomes 2/5, and $1 is 3/5. Expected value: (3/5)×$1 + (2/5)×$4 = $2.20—a 10% gain over $2. Same for any *M*. Always +10% expected gain from switching.  

  **LILY:**  
  So in *that* setup, I *am* right!  

  **ROSE:**  
  But then the symmetry problem worsens! If we both swap, we’re holding each other’s envelopes. Then we’d look again, see a new amount, and *again* compute a +10% gain to swap *back*. Infinite loop.  

  **BEN:**  
  Exactly. And it comes from the infinite expectation. The total expected money in any envelope? Sum diverges—infinity. So the expected gain is ∞ − ∞, undefined. But conditionally, on a *finite* observation, it’s +10%.  

  **LILY:**  
  So what do we *do*?  

  **BEN:**  
  You swap once—because the will allows it—and hope. Conditionally, it’s rational. But globally? It’s messy. Aunt Mabel loved that queasiness.  

  **ROSE:**  
  *(Sighs, runs a hand through her hair)*  
  Your original mistake, Lily, was assuming fifty-fifty without a prior. You assigned equal probability to "half" and "double" arbitrarily. But probability isn’t in the amounts—it’s in the *mechanism*. Aunt Mabel’s prior determines those odds.  

  **LILY:**  
  *(Quieter, absorbing)*  
  And in the standard paradox, without a known prior, that assumption breaks. You can’t default to fifty-fifty.  

  **BEN:**  
  Nail on the head. In the abstract, you’re not entitled to that probability. Here, with Aunt’s geometric setup, you *are*—but it leads to this loop. A proper Bayesian nightmare.  

  **ROSE:**  
  So which setup did she use? The will says halving probabilities...  

  **BEN:**  
  *(Shrugs)*  
  She told me both. Playful to the end. But for what it’s worth, the halving setup has a silver lining: swap if you see $1, break even otherwise. The geometric one? Always swap, but brace for the infinite hangover.  

  **LILY:**  
  *(Looks at her envelope, then Rose’s)*  
  We swap. Whatever’s inside, we’re playing her game. And Rose...  

  **ROSE:**  
  *(Nods, a wry smile)*  
  We swap. But only once. Aunt Mabel wins either way—she’s got us philosophizing over money we haven’t even seen.  

  **LILY:**  
  *(Grins, extends her envelope)*  
  To Aunt Mabel. The devil in a cardigan.  

  *They swap envelopes. Ben watches, smiling faintly as the sisters open their new envelopes—Lily finds $2, Rose finds $1. The room holds a beat of shared uncertainty, then a chuckle. The paradox lives, unresolved, as the aunt intended.*  

  **FADE OUT.**  

  ---
  ### Key Points Covered:
  1. **Lily’s Flaw in the Abstract**: Assumes 50/50 for "half or double" without justification. Probability depends on the prior distribution, not symmetry.  
  2. **Aunt Mabel’s Halving Setup**: Only a gain if you see $1 (other is $2). For $2+, expected gain is zero. Breaks the loop but limits gains.  
  3. **Geometric Setup (Hypothetical)**: Always a +10% conditional expected gain, but causes the swap loop and has infinite expectation. Shows why "always switch" is conditionally rational but globally queasy.  
  4. **Human Stakes**: Sisters engage deeply, concede points, and choose to swap—not because one "wins," but to honor their aunt’s legacy of beautiful, unsettling puzzles.  
  5. **Realism**: Ben provides exact calculations; Rose challenges symmetry; Lily confronts the limitations of her initial argument. No strawmen, no easy resolutions.
