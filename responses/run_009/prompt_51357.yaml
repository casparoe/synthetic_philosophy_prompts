  ## Recommendation to the Ashford State University Board of Trustees Regarding Institutional Acknowledgement and Reconciliation

  **Recommendation:** I move that the Board of Trustees adopt the attached **Statement of Acknowledgement, Apology, and Commitment to Partnership** and simultaneously authorize the establishment of a **Truth, Education, and Partnership Fund** with an initial endowment allocation of $[Specific Amount TBD by Board - e.g., $5 million], to be developed and administered in partnership with the Regional Council representing descendants of the dispossessed nations.

  ### Reasoning Addressing Key Factions and Concerns

  1.  **For those advocating the strong apology (including the Descendants' Council and Student Association):**
      *   **The Core Moral Imperative:** The strongest argument is undeniable: Ashford State University exists today as a direct beneficiary of a federal system predicated on the dispossession of Indigenous nations. While the *exact* dollar-for-dollar path from land scrip to our present endowment is obscured, the *fact* that our founding was enabled by land taken without consent is historically established and morally significant. The university, as the inheritor and ongoing beneficiary of this legacy, has a responsibility to acknowledge this foundational injustice.
      *   **Rejecting the "Apology with an Asterisk":** The Descendants' Council is unequivocally correct. A statement burdened with hedging about financial certainty would indeed read as an excuse and diminish the core wrong: the taking of the land itself. The attached statement offers a **clear, unambiguous apology** for the *university's role as a beneficiary* of the dispossession, focusing on the fundamental injustice rather than the subsequent accounting. It acknowledges the harm caused to the nations and their descendants.
      *   **Why Silence is Not an Option:** Silence perpetuates historical erasure and ignores the explicit request of the descendants. It signals indifference to the harms acknowledged in our own commissioned report and contradicts our stated institutional values.

  2.  **For those advocating the strong apology PLUS restitution:**
      *   **Addressing the Limits of Words Alone:** Words of apology, while necessary, are insufficient without tangible commitment to repair and partnership. The establishment of the **Truth, Education, and Partnership Fund** directly addresses this. It moves beyond symbolic gesture to material support for initiatives defined *in partnership* with the descendant communities.
      *   **Navigating Historical Uncertainty:** The historical ambiguity about the precise financial contribution to our endowment makes specific financial reparations tied *only* to the 1862 proceeds impractical and potentially contentious. This fund transcends that uncertainty. It acknowledges our *ongoing* benefit from the legacy of dispossession and commits resources to support the *present and future* well-being and priorities of the descendant communities, as defined by them. The initial allocation is a significant, concrete step demonstrating commitment.
      *   **Focus on Partnership:** The fund is not charity; it's an investment in collaborative work. It prioritizes projects co-developed with the Regional Council, ensuring relevance and respect for self-determination.

  3.  **For the minority concerned about moral agency and "theater":**
      *   **The Nature of Institutional Responsibility:** While the *act* of dispossession was committed by the federal government and past actors, the *institution* of Ashford State University was created and capitalized through that act. We are not apologizing *as* the 19th-century actors, but *as the enduring institution* that knowingly or unknowingly built its foundation on unjustly acquired assets and continues to benefit from that legacy. Institutions, like nations, can and do apologize for historical wrongs they inherit and from which they have profited.
      *   **Rejecting Empty Theater:** This recommendation explicitly counters the charge of "theater" by coupling the formal acknowledgment and apology with significant, concrete action – the establishment of the fund. It transforms symbolic words into a platform for meaningful, ongoing partnership and restorative action.
      *   **Addressing the Federal Responsibility:** The statement explicitly names the federal government's role ("land expropriated under federal authority") while also accepting our institutional responsibility as a beneficiary ("we accept our role as a beneficiary of that system"). We are not absolving the federal government; we are owning our part within the larger system.
      *   **Why "Cannot Meaningfully Apologize" Fails:** To argue that an institution cannot apologize for the past is to argue it has no ethical continuity or responsibility for its history. This negates the very concept of institutional legacy and accountability. If we can celebrate our founding, we must also account for its problematic origins. An apology from the present institution is meaningful precisely *because* it acknowledges this enduring connection and responsibility.

  **Why This Approach is Best:**

  *   **Moral Clarity:** It centers the fundamental wrong – the dispossession – without getting lost in unanswerable financial details.
  *   **Respect for the Descendants' Request:** It delivers the clear, unambiguous acknowledgment and apology sought by the Regional Council.
  *   **Tangible Commitment:** It moves beyond symbolism with a substantial financial commitment focused on partnership and the future.
  *   **Addresses Historical Uncertainty:** It acknowledges the murky financial trail without letting it become an excuse for inaction, framing the commitment as forward-looking responsibility.
  *   **Builds Partnership:** It establishes a mechanism for ongoing collaboration, respecting the agency of the descendant communities.
  *   **Institutionally Legitimate:** It accepts responsibility for the institution's legacy without over-identifying with the specific actors of the past.

  **Attached: Draft Statement for Adoption**

  ---

  **Ashford State University: Statement of Acknowledgement, Apology, and Commitment to Partnership**

  The Board of Trustees of Ashford State University acknowledges with profound regret the findings of our commissioned historical report concerning our institution’s founding.

  We acknowledge that Ashford State University was established as a land-grant institution under the Morrill Act of 1862. This act distributed land expropriated under federal authority from the sovereign Indigenous nations who had inhabited these territories since time immemorial – specifically, [List specific nations identified in the report, if known, or "the Indigenous nations of this region"]. The forced removal and dispossession of these nations constituted a grave injustice, violating their inherent rights, sovereignty, and profound connection to their ancestral homelands.

  We acknowledge that our university was a direct beneficiary of this system of dispossession. While the precise pathways of the resources derived from the sale of the land scrip granted to our institution are obscured by time and incomplete records, it is unequivocally clear that the founding and early development of Ashford State University depended upon land taken without the consent of and without compensation to its original inhabitants. We accept our role as a beneficiary of that system.

  To the descendant communities of these dispossessed nations, represented by the Regional Council, we offer our deepest and most sincere apology. We apologize for the foundational role that the unjust taking of Indigenous land played in establishing this institution. We apologize for the historical and ongoing harms caused by this dispossession, including the erasure of Indigenous presence and the disruption of cultures and lifeways intrinsically tied to these lands. We acknowledge the enduring resilience of these nations and their descendants.

  Words of apology, while necessary, are insufficient to address this legacy. Therefore, alongside this formal acknowledgment and apology, the Board of Trustees commits Ashford State University to a path of meaningful partnership and restorative action:

  1.  **Establishment of the Truth, Education, and Partnership Fund:** We authorize the immediate allocation of $[Specific Amount] from the university endowment to establish this permanent fund.
  2.  **Co-Governance and Partnership:** The purposes and distribution of funds from this endowment will be determined through a collaborative partnership process between Ashford State University leadership and the Regional Council representing the descendant communities. Priority areas may include, but are not limited to:
      *   Supporting Indigenous student recruitment, retention, and success.
      *   Advancing culturally relevant curricula and research on Indigenous histories, knowledge systems, and contemporary issues.
      *   Funding collaborative research projects initiated by or conducted in true partnership with descendant communities.
      *   Supporting language revitalization, cultural preservation, and community wellness initiatives defined by the descendant nations.
      *   Creating physical spaces on campus that honor Indigenous presence and history.
  3.  **Ongoing Commitment:** This fund represents an initial commitment. We pledge to work in good faith with the Regional Council to explore further avenues for partnership, support, and ensuring Ashford State University is a place where Indigenous students, faculty, staff, and knowledge are welcomed, respected, and thrive.

  We understand that this statement and these commitments are a beginning, not an end. We offer this acknowledgment, apology, and pledge of partnership with humility, a commitment to truth, and a resolve to build a more just and equitable future in relationship with the original stewards of this land.

  ---

  **Procedural Motion:** I move that the Board of Trustees adopt the above Statement of Acknowledgement, Apology, and Commitment to Partnership and authorize the establishment of the Truth, Education, and Partnership Fund with an initial allocation of $[Specific Amount] from the endowment, to be implemented according to the co-governance principles outlined.
