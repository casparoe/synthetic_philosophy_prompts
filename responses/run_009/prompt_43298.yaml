  First, I need to recall what sphexishness entails. It's about rigid, inflexible behavior that doesn't adapt to feedback, like the wasp stuck in a loop. The user's examples range from the wasp itself to scripts, chess engines, coworkers, and alert systems. Their gut reactions show inconsistency: they label non-human systems as fully sphexish but hesitate with humans like Sarah and Dev. 

