answer: |-
  Here is a joint statement reflecting a good-faith adversarial collaboration between a Non-Naturalist Moral Realist (NNMR) and an Evolutionary Debunking Anti-Realist (EDAR), formatted as requested. It distinguishes genuine consensus from contested-but-mutually-conceded premises and clarifies the core disagreements and cruxes.

  **Joint Statement: Non-Naturalist Moral Realist & Evolutionary Debunking Anti-Realist**

  **I. Agreed Claims**

  The following claims represent either (a) well-established consensus within relevant scientific/philosophical communities or (b) premises we mutually concede for the sake of this adversarial collaboration, even if they remain contested more broadly. We mark them accordingly:

  1.  **(Consensus - Evolutionary Biology/Psychology):** Human moral intuitions, sentiments, and reasoning capacities are products of natural selection and cultural evolution. *(Supported by overwhelming evidence from biology, anthropology, and psychology).*
  2.  **(Consensus - Evolutionary Biology/Psychology):** These evolutionary processes primarily selected for traits that enhanced cooperation, coordination, and conflict resolution *within groups* in ways that promoted survival and reproductive fitness in ancestral environments. Truth-tracking concerning mind-independent moral facts was *not* a direct selection pressure. *(This is the standard evolutionary account of moral psychology).*
  3.  **(Contested but Conceded Premise):** The evolutionary origins of our moral faculties described in (1) and (2) **do not, by themselves, logically entail either moral realism or moral anti-realism.** The debunking argument requires additional philosophical premises. *(We agree this is a necessary starting point for productive debate, though broader metaethics debates contest whether evolution *alone* is sufficient to undermine realism).*
  4.  **(Contested but Conceded Premise):** Moral judgments are *cognitively* meaningful – they express propositions that purport to represent facts and are capable of being true or false. *(The EDAR concedes this for the sake of argument against non-cognitivist alternatives, though their ultimate position denies these propositions *are* true. The NNMR obviously affirms it).*
  5.  **(Contested but Conceded Premise):** If robust, mind-independent moral facts exist (as per NNMR), our evolutionary history suggests our native cognitive faculties are *not pre-tuned* to reliably detect them without significant reflective correction and philosophical argumentation. *(The NNMR concedes this challenge; the EDAR sees this as a major obstacle).*

  **II. Remaining Disagreements & Cruxes**

  The core disagreement centers on the existence and nature of *objective, mind-independent moral facts*. We identify the following specific points of divergence, phrased to be acceptable to each side:

  | Disagreement                                                                 | NNMR Position (Acceptable Wording)                                                                 | EDAR Position (Acceptable Wording)                                                                 |
  | :--------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------- |
  | **Existence of Mind-Independent Moral Facts:**                               | Robust, non-natural, mind-independent moral facts exist and some of our moral beliefs are true. | No such robust, mind-independent moral facts exist; moral claims lack truth-value in this sense. |
  | **Rational Disagreement Under Full Non-Moral Information (Crux 1):**         | Two agents sharing all non-moral facts, fully informed, and unbiased *could* rationally disagree on a moral claim (e.g., intrinsic value of sentience). | Two agents sharing all non-moral facts, fully informed, and unbiased *could not* rationally disagree on a moral claim; disagreement would indicate irrationality or differing non-cognitive attitudes. |
  | **Convergence as Evidence for Mind-Independence (Crux 2):**                  | Sustained, reflective convergence among fully informed, unbiased agents over time on a moral claim *would* constitute evidence for its status as a mind-independent moral fact. | Sustained, reflective convergence among fully informed, unbiased agents over time on a moral claim *would not* constitute evidence for its status as a mind-independent moral fact; it could result from shared evolved/cultural biases or pragmatic necessity. |

  **III. Cruxes: Test Cases & Predictions**

  *   **Crux 1: Could rational disagreement persist under full non-moral information?**
      *   **Test Case:** Consider two agents fully informed about neuroscience, psychology, evolutionary biology, and the physics/chemistry underlying conscious experience. They agree on *all* non-moral facts about a being's capacity for pleasure, pain, complex cognition, social relations, etc. Could they still rationally disagree about whether that being possesses intrinsic moral value (e.g., "Is inflicting severe, prolonged suffering on this being *always* intrinsically morally wrong, regardless of consequences?")?
          *   **NNMR Prediction:** YES. The disagreement hinges on the fundamental normative significance of consciousness/sentience itself, which is irreducibly moral and not settled by non-moral facts alone. Rational arguments supporting different foundational normative principles (e.g., sentientism vs. a view requiring higher cognition) are possible.
          *   **EDAR Prediction:** NO. Any remaining disagreement must stem from (a) residual factual ignorance (e.g., about the true nature of consciousness), (b) bias/affective influence, or (c) differing non-cognitive attitudes disguised as belief. True rational disagreement is impossible when *all* relevant non-moral facts are shared and processed rationally.
      *   **Bearing:** Both agree this case tests whether moral claims supervene *only* on non-moral facts (EDAR) or involve irreducible normative elements (NNMR).

  *   **Crux 2: Does convergence indicate mind-independent facts?**
      *   **Test Case:** Imagine a long-term historical process where diverse societies, starting from radically different moral frameworks, engage in sustained, rational, cross-cultural dialogue with increasing access to shared non-moral knowledge (history, science, social science). They gradually converge on rejecting a specific practice (e.g., chattel slavery) as morally impermissible. Does this convergence constitute evidence that chattel slavery is *objectively* morally wrong?
          *   **NNMR Prediction:** YES, STRONG EVIDENCE. The convergence, achieved through rational reflection on shared non-moral facts and consistent moral principles (e.g., rejecting arbitrary suffering/subjugation), strongly suggests the discovery of a mind-independent truth about human dignity and rights, overcoming initial biases.
          *   **EDAR Prediction:** NO. Convergence could be explained by shared recognition of (1) the profound suffering and social instability caused by slavery (non-moral facts), (2) the pragmatic benefits of abolition for modern complex societies, and/or (3) the influence of shared (perhaps evolved) biases against extreme in-group exploitation once out-group boundaries weaken. It reveals shared preferences/pragmatic norms, not mind-independent truth.
      *   **Bearing:** Both agree this case tests whether the best explanation for robust convergence under ideal conditions requires positing mind-independent facts (NNMR) or can be fully explained by shared non-moral understanding, pragmatics, and contingent psychology (EDAR).

  **IV. Verbal vs. Substantive Disagreement**

  We identify **one primary potential verbal dispute:**

  *   **The Meaning of "Moral Fact" and "Objectivity":** The EDAR often presupposes that for a fact to be "objective" or "mind-independent," it must be causally efficacious within the natural world (e.g., directly impacting evolution, detectable by science). The NNMR rejects this criterion for moral facts, arguing that their non-natural status means they wouldn't have causal powers in this way, yet they can still be objectively true and discovered by reason. **This difference in the *criterion* for what counts as a "fact" or "objective" is largely verbal.** However, the **substantive disagreement remains:** *Does anything satisfy the NNMR's concept of a non-natural, non-causally-efficacious, yet objective moral fact?* The EDAR says "No, that concept is incoherent or empty," while the NNMR says "Yes, and we have rational access to such facts."

  The core disagreement over the **existence** of moral facts as defined by NNMR, the possibility of **rational disagreement under full information (Crux 1)**, and the significance of **convergence (Crux 2)** are **substantive disagreements** about how the world is and how moral reasoning functions.
