prompt: |-
  I run a lunchtime "clear thinking" club at work — about ten of us, analysts plus one lawyer, no maths past school, alot of arguing. Next session the topic I've been assigned is what a colleague kept calling Good's theorem when he suggested it: the idea that getting an extra signal before you commit to a decision can never make your expected outcome worse, roughly because you're always free to ignore it. I don't want you to explain the theorem to me, I want a plan for how I should run the session. Please answer as exactly five numbered points, each a sentence or two, with no intro or conclusion:

  1. the background that has to be in place before the claim can even be stated properly, and why it has to come first;
  2. the one example that should carry the whole session — I'm thinking something like a firm deciding whether to drill for oil, with a survey it can commission beforehand — and what that example must have, and must lack, to do the job;
  3. the misconceptions to expect and where in the sequence each should get headed off — I'm guessing "more data is always good, look at my inbox" and something like "in a negotiation, knowing more can spook the other side", but you tell me what else is coming;
  4. the question I can ask at the end to check whether they've actually understood it rather than just nodded along;
  5. what I should openly refuse to cover at this level, and say so to them.

  Keep it in British English please. No slides allowed, its whiteboard only, in case that matters for the plan.
reasoning: |-
  Hmm, the user runs a "clear thinking" club at work with analysts and a lawyer, focusing on topics like Good's theorem. They need a session plan with five specific points: background, example, misconceptions, comprehension check, and exclusions. The key challenge is making this accessible without advanced maths.

  The user emphasized British English and whiteboard-only, so I'll stick to that. The session must be interactive, given the group's argumentative nature, so the plan should foster debate but keep it structured.

  For point 1, background is crucial. I need to cover expected value as the foundation, since Good's theorem deals with decision-making under uncertainty. Without this, the theorem can't be stated properly. I'll include how decisions affect outcomes and why we quantify uncertainty with probabilities, as that sets the stage for the core idea.

  For point 2, the example I'm considering is an oil drilling scenario. It's classic and relatable: a firm with a decision to drill or not, and an optional survey that gives extra information. The example must have clear choices, measurable outcomes, and uncertainty that the signal can clarify. Crucially, it must lack any hidden costs or strategic interactions—like negotiations—so the theorem's pure logic isn't muddied. This simplicity will help isolate the "can never hurt" principle.

  For point 3, misconceptions need addressing proactively. I anticipate common fallacies like "more data is always good" in practical terms, which ignores that signals can be costly or misleading. Another is the negotiation worry, where revealing information affects others' behavior, but that's outside the theorem's scope. I should also mention that the theorem doesn't guarantee improvement; it just prevents worsening, so setting expectations is key. I'll sequence this during the example discussion to cut off confusion early.

  For point 4, the comprehension check question must test deep understanding. I'll suggest a scenario where ignoring the signal seems appealing, asking for the expected value calculation. This forces them to apply the theorem: if they see that ignoring is equivalent to not having the signal, they've got it. It's concrete and avoids nodding along.

  For point 5, exclusions are vital to avoid scope creep. I'll explicitly rule out complex topics like costly signals or game theory, as they're beyond this introductory level. Stating this upfront keeps the session focused and reassures participants that we're sticking to basics.

  Overall, this plan builds from fundamentals to application, anticipates and counters errors, and ensures clarity through a focused example. It should handle the group's arguing tendencies by making the logic unassailable.
answer: |-
  1.  Establish expected value as the core decision-making criterion under uncertainty, defining it as the probability-weighted average of possible outcomes; this must come first because the theorem hinges on maximising expected value, and "outcome worse" is defined relative to this metric.
  2.  Use a simple oil drilling example: a firm deciding whether to drill one site (drill/not drill), facing uncertain profit/loss, with an optional seismic survey providing imperfect information about oil presence; it must have quantifiable payoffs, clear probabilities, and a signal influencing beliefs, but crucially lack any cost for the signal or strategic interactions with other agents.
  3.  Expect "More data always improves decisions practically" (head off during example setup by stressing the theorem's *theoretical* guarantee under cost-free signals, distinct from real-world data overload) and "Signals can reveal your intentions/weakness, harming negotiation outcomes" (head off when stating the theorem by explicitly excluding game-theoretic scenarios where your *possession* or *use* of the signal affects others).
  4.  Ask: "Suppose the seismic survey result strongly suggests *no* oil, but our pre-survey expected value favoured drilling. Could committing *never* to drill based on this bad news *lower* our expected outcome compared to having no survey at all? Explain why or why not using expected value."
  5.  Openly refuse to cover costly signals (where the price of information might outweigh its benefit) or situations involving adversarial actors (game theory), stating these violate the theorem's core assumptions and are separate complexities.
