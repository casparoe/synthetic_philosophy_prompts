  ## Decision Memo: Donor-Funded Valley Bottom Wetland Restoration

  **To:** Board of Directors, [Land Trust Name]  
  **From:** [Your Name/Position], Board Member  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on Accepting the [Donor Family Name] Valley Bottom Wetland Restoration Project  
  **Decision Required:** Vote to accept or decline the proposed 30-year restoration project.

  ### I. Background & Proposal
  The [Donor Family Name] has offered substantial funding to restore [Estimated Size] acres of drained valley bottom land to a functional wetland ecosystem. This project aligns directly with our core mission of habitat restoration and conservation. It would be the largest project in our history, offering significant potential benefits:
  *   **Ecological:** Recreation of critical wetland habitat for fish, amphibians, waterfowl, mammals (including beavers), and native plants.
  *   **Water Quality & Flood Control:** Wetlands naturally filter pollutants and absorb floodwaters.
  *   **Carbon Sequestration:** Healthy wetlands are significant carbon sinks.
  *   **Biodiversity:** Creation of a large, contiguous habitat complex.
  *   **Community & Donor Relations:** Fulfilling donor intent and demonstrating large-scale impact.

  ### II. The Concern Raised
  Board Member [EA Board Member's Name] has raised a serious ethical objection based on principles often discussed in Effective Altruism (EA): **If the average wild animal life is characterized by significant suffering (starvation, disease, predation, high infant mortality), then creating more habitat leads to creating more suffering.** He argues that, on balance, restoring this wetland might cause more harm than good and therefore should be declined. He has provided population estimates to illustrate the scale of potential animal lives affected.

  **This memo takes this concern seriously.** It is a perspective grounded in concern for suffering and demands thoughtful consideration, not dismissal.

  ### III. Analysis: Separating the Questions
  To evaluate this fairly, we must separate two distinct types of questions:

  1.  **The Empirical Question: What is the net welfare of wild animals?**
      *   **The Concern:** Evidence shows wild animal lives often involve intense suffering and high mortality rates, especially in predator-rich or resource-limited ecosystems like wetlands.
      *   **The Uncertainty:** Quantifying "net welfare" across diverse species (fish, insects, mammals, birds) is profoundly difficult. Science struggles to measure subjective experiences like suffering or flourishing in animals. While suffering exists, periods of satiation, successful reproduction, exploration, and social bonding also occur.
      *   **Key Point:** **There is no scientific consensus that wild animal lives are *net negative* on average.** The evidence presented demonstrates real suffering but does not conclusively prove it outweighs all positive states for the majority of individuals or species within a functioning ecosystem. The claim remains a hypothesis with significant measurement challenges.

  2.  **The Moral & Mission-Based Questions: What guides our decisions?**
      *   **Our Mission:** [Land Trust Name]'s core mission, as reflected in our bylaws and decades of work, is to "protect and restore critical habitats for native species and ecological health." We operate under the principle that functioning, biodiverse ecosystems are intrinsically valuable and worthy of conservation and restoration.
      *   **Value of Biodiversity & Ecological Integrity:** We value species diversity, ecosystem resilience, natural processes (like beaver engineering), and the inherent right of species to exist and evolve in their natural state, even if that state involves natural suffering. Preventing ecosystems from functioning denies species the chance to live their natural lives.
      *   **Donor Intent & Trust:** The donor's explicit intent is to restore a degraded landscape to a natural wetland state. Declining this transformative gift based on an ethical framework *not* part of our established mission could damage trust and deter future support.
      *   **Community Expectations & Stewardship:** Our stakeholders (local communities, partners, members) expect us to protect and restore natural landscapes. Abandoning a major restoration project based on the potential suffering inherent in nature would represent a fundamental, unmandated shift in our purpose and likely cause significant confusion and loss of support.
      *   **The "Manufacturing Suffering" Counterpoint:** While restoration might *allow* more animals to exist (and experience suffering), it also allows them to *flourish* according to their nature within a restored ecosystem. Is preventing existence inherently more ethical than allowing existence with inherent risks? This is a profound philosophical question without a universally agreed answer, but our mission leans towards enabling natural existence.

  ### IV. Decision Procedure for Similar Cases
  This won't be the last challenging ethical question. Our procedure should be:

  1.  **Mission Primacy:** Does the project clearly align with our core mission of habitat protection, restoration, and biodiversity conservation? (If not, decline).
  2.  **Evidence Assessment:** Are there specific, evidence-based, and *actionable* welfare concerns beyond the inherent uncertainties of nature?
      *   *Example:* Evidence that the project would specifically attract species known to suffer from a devastating, introduced disease we cannot mitigate. (This might warrant conditions or decline).
      *   *Counter-Example:* General uncertainty about whether wild animal life is net negative. (This is currently beyond our capacity to resolve scientifically and falls outside our mission's scope).
  3.  **Ethical Framework Alignment:** Does the primary ethical concern forcing reevaluation originate *from within* our established values (e.g., unintended harm to a specific endangered species, equity concerns for local communities) or from an *externally imposed* ethical framework?
      *   We should be open to new evidence *within* our value structure (Point 2 above). Adopting a fundamentally new primary ethical framework (like aggregate wild animal welfare as the overriding concern) requires explicit, board-led strategic review and mission revision – it cannot be decided ad-hoc on a single project.
  4.  **Stakeholder Impact:** Consider donor intent, community impact, precedent, and organizational integrity. Drastic deviations need broad buy-in.
  5.  **Mitigation:** Can reasonable steps be taken to address specific welfare concerns without compromising the ecological goals? (e.g., targeted disease monitoring, habitat design tweaks).

  **What Evidence Would Change Our Answer (in this class of case)?**
  *   **Strong Evidence for Decline:** Conclusive, species-specific evidence showing this *particular* wetland type inevitably creates overwhelming, unmitigatable suffering for the majority of animals within it, demonstrably worse than the degraded state or alternative land uses. Or, evidence that our actions would directly cause a specific, severe welfare catastrophe (e.g., introducing a horrific pathogen).
  *   **Strong Evidence for Proceed:** Continued alignment with mission, lack of project-specific catastrophic welfare evidence, and the positive ecological/community benefits outlined.
  *   **The Uncertainty Bet:** Given the current profound uncertainty in quantifying net wild animal welfare at scale, proceeding with projects aligned with our core mission is consistent with a bet that enabling natural ecosystems and biodiversity is a fundamental good. Declining based on the current level of uncertainty would be a bet that preventing potential suffering outweighs all other values inherent in our mission. The latter represents a radical departure from who we are and what we do.

  ### V. Recommendation
  **Accept the [Donor Family Name] Valley Bottom Wetland Restoration Project funding and proceed with the project.**

  *   **Justification:**
      *   The project is **highly aligned** with our core mission of large-scale habitat restoration and wetland conservation.
      *   The empirical claim that the project will create *net negative* welfare on a calculable scale **lacks sufficient scientific consensus and measurability** to override our mission-driven purpose.
      *   Declining this project based on the current EA argument would constitute **adopting a new, primary ethical framework (aggregate wild animal suffering as the paramount concern) that is not part of our organization's established mission, values, or stakeholder expectations.** Such a fundamental shift requires deliberate strategic review, not a project-specific vote.
      *   Accepting honors **donor intent**, leverages a **transformative opportunity**, and fulfills our commitment to **ecological stewardship**.
      *   The potential ecological and community benefits are **significant and tangible**.

  *   **Recommended Conditions:**
      1.  **Explicit Acknowledgment:** In project communications, acknowledge the complexity of wild animal welfare and that our mission focuses on restoring ecological function and biodiversity.
      2.  **Monitor for Specific Welfare Issues:** Task staff with incorporating monitoring for *specific, identifiable* welfare concerns if feasible (e.g., outbreaks of known diseases affecting target species, evidence of severe, unnatural stressors). Develop protocols for response if such issues arise.
      3.  **Support Research (Optional but Recommended):** Allocate a small portion of funding (or seek separate funding) to support research into wild animal welfare metrics in restored ecosystems, or partner with researchers interested in this question. This demonstrates serious engagement with the concern without halting our core work.
      4.  **Ethics Discussion:** Schedule a future board workshop to discuss broader ethical frameworks in conservation, including but not limited to wild animal welfare, to inform our long-term thinking without the pressure of a specific project decision.

  ### VI. Conclusion
  The ethical concern raised is profound and deserves respect. However, it introduces a fundamental question about our organization's core purpose that cannot be resolved solely within the context of this single project evaluation. The [Donor Family Name] Valley Bottom Restoration is an exceptional opportunity to achieve a landmark victory for our mission. The empirical basis for declining it on wild animal suffering grounds remains highly speculative and unmeasurable at the scale required. To decline would be to fundamentally redefine who we are, based on current uncertainties, without mandate or process. We recommend accepting this gift and proceeding with this transformative restoration project, while committing to thoughtful monitoring and further ethical discussion as an organization.

  **Motion:** I move that the Board of Directors accept the funding from the [Donor Family Name] for the Valley Bottom Wetland Restoration Project and authorize staff to proceed under the conditions outlined in Section V.
