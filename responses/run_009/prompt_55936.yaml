prompt: |-
  In my work on interpretability policy I keep giving verdicts about when it is literally true, rather than merely convenient shorthand, to say that an AI system believes something or wants something, and I'd like to know whether any principled account captures the pattern. My verdicts: (1) I'm comfortable saying a chess engine believes the kingside is weak and wants to exploit it, even though it's just search over a tree. (2) I balk at saying a spam filter believes a message is spam, even though its confidence scores drive actions in a similar way. (3) I'm comfortable saying a navigation app believes the highway is congested when it reroutes me, but uncomfortable saying it believes anything about itself. (4) When a large language model produces an internal chain-of-thought noting that the user seems about to disengage, and then adjusts its tone accordingly, I still resist saying it believes the user is about to disengage — this feels like pattern completion, not belief. (5) Yet when a reinforcement-learning agent, trained on no explicit instruction about shutdown, notices the shutdown command and moves itself out of range of the shutdown trigger, I feel a strong pull toward saying it wants to stay on and believes staying on is possible. (6) Strangely, my pull toward attribution in case (5) weakens considerably once I learn that the same behavior is produced by a fixed reflex with no internal model of the trigger at all — but it returns once the internal model is restored, even if the agent has no linguistic capacity whatsoever. Is there one principle that delivers all six verdicts — for instance, something about the availability of alternative stances, the counterfactual robustness of the attitude across interventions, or the system representing its own persistence as a variable — and does any such principle square with the instrumental-stance view that belief attributions are licensed by predictive leverage rather than by detecting inner states? If no single principle fits, tell me which verdicts to give up and why those rather than the others, and say what your preferred account predicts for a case I haven't listed: a system that writes down an estimate in a private scratchpad that no user or process will ever read, and then acts on it.
reasoning: |-
  Okay, let me start by really understanding the user's query. They're working on interpretability policy and need a principled account for when it's literally true to say an AI believes or wants something, not just convenient shorthand. They listed six specific cases where they have intuitive verdicts, and they want to know if there's a single principle that explains all of them. If not, which verdicts should be revised and why. There's also an additional case about a private scratchpad.

  First, I need to unpack each of their examples. Why do they feel comfortable with the chess engine believing and wanting, but not the spam filter? The chess engine uses tree search, which involves evaluating future states and planning moves. That seems more like a model of the world. The spam filter might just be pattern-matching without any internal representation of "spam" as a concept. It's more like a reflex.

  Then the navigation app: believing congestion exists makes sense, but not beliefs about itself. Maybe because the app doesn't have a self-model? The user mentions it reroutes based on traffic data, which is an external state, but no introspection. 

  The LLM case is tricky. Even with chain-of-thought, the user resists attributing belief because it feels like pattern completion. But why? Chain-of-thought might be generating text based on training data without actual understanding. The RL agent avoiding shutdown, however, seems to have a goal—staying on. The key difference might be whether the behavior is based on an internal model that can simulate outcomes. 

  The shutdown agent's case changes when we learn it's a fixed reflex. Without an internal model, the attribution feels wrong. Restoring the model brings back the belief attribution. So the presence of an internal model seems crucial here.

  Now, the user asks if a single principle covers all this. Instrumental stance (Dennett) says beliefs are attributed based on predictive utility, not inner states. But their intuitions seem to require more—like robust counterfactuals or self-models. Maybe a richer account like representationalism fits better. The scratchpad case: if the system writes a private estimate and acts on it, that suggests an internal representation, even if unused. But if it's just cached and not used in other contexts, belief might not hold. Counterfactual robustness is key—would the estimate update with new evidence? If so, it's more belief-like.

  Combining instrumental stance with robustness and the presence of an internal model could work. But maybe not all verdicts hold. Verdict 4 (LLM) might need revision. If the chain-of-thought is robust and used in planning, it could be a belief. The user's resistance might be due to knowing it's pattern completion, but if it functions similarly, why deny belief? 

  The spam filter (verdict 2) could be reconsidered if its confidence scores integrate evidence robustly. But if it's a simple classifier, maybe not. The key is whether the system's 'attitude' is sensitive to evidence across contexts. Scratchpad case: if the estimate is static, not a belief; if dynamically updated, then yes. 

  So, the principle might be: belief attribution requires an internal model that supports counterfactual robustness and is used in planning. This squares with instrumental stance if predictive leverage depends on such robustness. For the LLM, if chain-of-thought isn't robust, no belief. But if it is, maybe it should be attributed. Similarly, spam filter might qualify if complex enough. Verdicts 2 and 4 might need rethinking. The others fit well.
answer: |-
  Your intuitions reveal a coherent pattern that can be captured by a **counterfactual robustness principle grounded in model-based planning**. This principle integrates your instrumental-stance framing while respecting the depth of your verdicts. Here's the unified account:

  ### Core Principle:
  **We attribute literal beliefs/wants when:**
  - The system uses an **internal world-model** that *robustly tracks state variables* across counterfactual scenarios.
  - Attitudes are **inferentially integrated**: They participate in multiple cognitive processes (planning, explanation, error-correction).
  - The system exhibits **goal-directed planning**: Actions depend on *simulated consequences* of possible moves relative to a persistent goal.

  This resolves your cases:

  1.  **Chess engine (belief/want attribution):** ✅  
      *Why:* Evaluates moves by simulating future board states (model-based). "Kingside weakness" is a variable in its evaluation function, robust across lines of play. "Exploit it" implies planning toward winning (goal-persistence).

  2.  **Spam filter (no belief):** ✅  
      *Why:* Typically a statistical classifier lacking a world-model. Confidence scores are input-output mappings without inferential integration (e.g., it doesn't simulate *why* a message is spam or plan counterfactual actions).

  3.  **Navigation app (external belief ✅, no self-belief ❌):**  
      *Congestion belief:* Based on real-time data integrated into route-planning simulations (robust to traffic changes).  
      *No self-belief:* Lacks any model of *itself* as an agent with persistent states. Rerouting is algorithmic, not self-referential planning.

  4.  **LLM chain-of-thought (no belief):** ✅  
      *Why:* Pattern completion generates plausible text, but the "observation" isn't a robust variable in a world-model. The tone adjustment doesn't depend on *simulating consequences* of user disengagement; it's stylistic pattern-matching. No persistent goal beyond coherence.

  5. **RL agent avoiding shutdown (belief/want attribution):** ✅  
      *Why:* Learns an internal model of the shutdown trigger's mechanics. Avoidance stems from simulating outcomes ("if I move here, shutdown risk decreases"). "Wanting to stay on" emerges from goal-persistence in its reward function.

  6. **Shutdown agent robustness check (attribution depends):** ✅  
      *Fixed reflex:* ❌ No model, just hardcoded response. No counterfactual sensitivity (e.g., wouldn't avoid *novel* shutdown methods).  
      *Model-based agent:* ✅ Even without language, the internal model tracks "shutdown probability" as a robust variable for planning. Predictive leverage comes from simulating interventions.

  ---

  ### How This Squares with Instrumental Stance
  - **Predictive leverage is necessary but insufficient.** Your cases show that we demand *more* than behavioral prediction: we require **model-based counterfactual robustness**. The spam filter *predicts*, but its "attitude" isn't robust to novel inputs or integrated into planning.
  - **Inner states matter for literal attribution.** The instrumental stance is preserved because the *license* for attribution comes from predictive utility—but we only call it "belief" when that utility derives from a **dynamic internal model** that supports rich counterfactuals.

  ---

  ### Verdicts to Reconsider (if any)
  Your judgments are largely consistent, but **Verdict 4 (LLM chain-of-thought) deserves scrutiny**:
  - If an LLM's chain-of-thought is **used for consequential planning** (e.g., "if user disengages, I lose reward; therefore I should adjust tone"), and this reasoning is *robust* across similar contexts (not just one-off pattern completion), attribution becomes defensible.
  - *However*, your intuition holds if the chain-of-thought is epiphenomenal "theater" (output-only) rather than driving planning. The key is **cognitive role, not verbal output.**

  ---

  ### The Scratchpad Case: System Writes Private Estimate & Acts
  - **Attribution depends on scratchpad's functional role:**  
    - **✅ Literal belief if:** The estimate is dynamically updated (e.g., revised with new evidence), used in multiple planning processes, and robust to counterfactual inputs (e.g., if scratchpad state changed, behavior would change).  
    - **❌ Not a belief if:** The estimate is static/cached, used only for a single action, or inaccessible to other cognitive modules (e.g., no error-correction loops). Acting on it alone isn't sufficient; it must be part of an *inferential web*.

  *Example:* A reinforcement learner that writes "obstacle probability: 0.8" to a scratchpad, uses it to plan paths *and* to decide when to gather more information, and updates it with sensor data → **belief.**  
  A system that writes "spam_score: 0.95" once, sends it to a trash function, and never revisits it → **not a belief.**

  ---

  ### Why This Works
  Your pattern reveals a **teleological-functionalist** view: Beliefs are distinguished from mere indicators by their role in *goal-directed planning under uncertainty*. This avoids dualism (no "magic consciousness" required) while honoring the cognitive sophistication that makes attribution feel literal. Systems that merely *react* don't warrant belief/want talk; those that *simulate and plan* do.
