prompt: |-
  I am preparing a short position piece on the epistemic case for democracy for a graduate seminar and would like a consistency audit before I circulate it. Here are my commitments, roughly in order of how confident I am in each:

  (1) The strongest epistemic defense of majoritarian democracy is Condorcet-style: if each voter is even slightly better than chance at arriving at the correct answer, and their votes are independent of one another, a sufficiently large electorate will almost surely arrive at the correct answer and can be expected to outperform a small panel of experts.

  (2) On most technically complex policy questions, the average individual voter is worse than a coin flip, owing to rational ignorance, pervasive misinformation, and the sheer difficulty of the material. Most voters simply are not in a position to evaluate, say, the likely effects of a given change in tax or monetary policy.

  (3) Democratic deliberation — public argument, town halls, structured discussion prior to voting — is not merely fair or respectful but epistemically valuable, and collective decisions should be preceded by it whenever feasible.

  (4) Other things being equal, the larger the voting body, the more reliable its collective judgment; hence on any issue where direct democracy is practical, a referendum should be preferred to leaving the decision to legislators.

  (5) Compulsory voting would strengthen the epistemic credentials of democratic outcomes, both by enlarging the electorate and by making it more representative of the population as a whole.

  (6) The competence premise in the theorem should be read conditionally: voters are competent at judging which candidates and parties will advance their interests and values, even where they cannot evaluate the technical merits of policy instruments; and since the "correct answer" in an election is which option would advance the citizens' interests, this is the competence that actually matters for the theorem.

  I honestly do not know where the problems are, and I do not have a clear sense of which commitment I would revise first if forced. Please go through these six commitments, tell me which pairs or subsets are genuinely in tension and which tensions are only apparent and dissolve on closer inspection, and rank the genuine tensions by severity. For each genuine tension, explain what would have to give and what that revision would cost me. I want a ranked diagnosis of my own position, not a general survey of the literature. Please answer in American English.
reasoning: |-
  Okay, the user is preparing a position piece on the epistemic case for democracy and wants a consistency audit of their six commitments. They're in a graduate seminar, so the audience is academic. They've listed their commitments in order of confidence and want to know where the tensions are, ranked by severity. 

  First, I need to understand each commitment deeply. Commitment 1 is about the Condorcet Jury Theorem (CJT), which says that if voters are slightly better than random, a large group will almost surely get the right answer. Commitment 2 argues that on complex policies, voters are worse than a coin flip due to rational ignorance and misinformation. That's a big red flag because CJT relies on voters being competent, but here they're saying voters aren't competent on technical issues. 

  Then commitment 6 tries to resolve this by redefining competence: voters are good at choosing candidates who align with their interests, not evaluating policies. That seems like a patch, but I need to check if it holds. If "correct answer" is about interests, not policy details, does CJT still apply? Maybe, but it shifts the focus from policy competence to representative competence. 

  Commitment 3 values deliberation, which could help with voter competence, but there's no direct conflict yet. Commitment 4 prefers larger voting bodies for reliability, which fits CJT but clashes with commitment 2's concern about voter incompetence on complex issues. If voters are bad at policy, does enlarging the group help or just amplify errors? That's a tension. 

  Commitment 5 supports compulsory voting to make the electorate more representative. This could help with CJT by increasing size and diversity, but if voters are incompetent, forcing more to vote might worsen outcomes. However, commitment 6's redefinition might neutralize this if incompetence is only on policy, not interest-alignment. 

  The biggest tension is between 2 and 1/6. If voters are incompetent on policy, but CJT requires competence, and commitment 6 says competence is about interests, not policy—does that work? It might, but it's a significant shift. The user might need to clearly separate policy-making from representative selection. 

  Another tension is between 4 and 2: if voters are bad on complex issues, why prefer referendums? The user must argue that even with low competence, larger groups are better, or that referendums are only for non-complex issues. But they don't specify that, so it's a problem. 

  Deliberation (3) could mitigate incompetence, but the user doesn't explicitly link it to improving voter competence. They should probably integrate that. 

  Compulsory voting (5) might not directly clash, but if voters are rationally ignorant, forcing them to vote could lead to random choices, harming outcomes. Commitment 6's reframing might save this, though. 

  Ranking the tensions:  
  1. **Commitment 2 vs. 1/6**: Severity 10/10. If voters are incompetent on policy, CJT doesn't apply. Solution: accept that CJT works for interest-alignment, not policy, but that's a major concession.  
  2. **Commitment 4 vs. 2**: Severity 9/10. Preferring referendums on complex issues conflicts with voter incompetence. Solution: limit direct democracy to non-technical issues or argue size trumps incompetence.  
  3. **Commitment 5 vs. 2**: Severity 7/10. Compulsory voting might lower competence if forced voters are uninformed. But if competence is about interests (6), it might be okay.  
  4. **Commitment 3's underdeveloped role**: Severity 6/10. Deliberation isn't linked to solving incompetence; it should be positioned as a remedy.  

  The user needs to clarify the domain of CJT: it's for choosing representatives based on interests, not direct policy decisions. They should also reconsider when referendums are appropriate and explicitly use deliberation to boost voter competence.
answer: |-
  Here's a consistency audit of your commitments, ranked by severity of tension. I'll identify genuine tensions, explain the conflict, and outline the revision cost—focusing solely on your listed propositions.

  ---

  ### **Ranked Genuine Tensions**  
  *(Most severe → Least severe)*  

  #### **1. Tension: Commitment 2 vs. Commitment 1 + Commitment 6**  
  **Severity:** 10/10 (Core conflict threatening your Condorcet framework)  
  **Conflict:**  
  - Commitment 2 states voters are *worse than chance* on complex policy questions (e.g., tax policy).  
  - Commitment 1 requires voters to be *better than chance* for the Condorcet theorem to apply.  
  - Commitment 6 tries to resolve this by redefining "correct answer" as "which candidate/party advances voter interests," not policy details. But if voters are incompetent at judging policy effects (Commitment 2), **how can they reliably identify which candidate/party will advance their interests?** Interests depend on policy outcomes (e.g., "Candidate X will improve healthcare" requires judging policy plausibility). If voters misjudge policy links, their competence on interests collapses.  
  **Revision Required:**  
  - **Option A:** Abandon Commitment 2’s claim that voters are *worse than chance* on policy-linked judgments. Instead, argue they are *modestly competent* (>50%) at interest-aligned choices *despite* technical ignorance (e.g., via heuristics like party loyalty or candidate integrity).  
  - **Cost:** Undermines realism about voter knowledge; ignores evidence of systematic misinformation effects.  
  - **Option B:** Severely restrict Commitment 1’s scope. Condorcet applies **only** to simple, value-driven decisions (e.g., "Should abortion be legal?"), not technical or means-end judgments (e.g., "Which carbon tax rate maximizes growth?").  
  - **Cost:** Shrinks the epistemic case for democracy to a narrow domain, weakening its generality.  

  #### **2. Tension: Commitment 4 vs. Commitment 2**  
  **Severity:** 9/10 (Direct clash between institutional preference and voter limitations)  
  **Conflict:**  
  - Commitment 4 claims larger voting bodies yield more reliable judgments (per Condorcet).  
  - Commitment 2 implies that on complex issues, voters are *incompetent* — so adding more incompetent voters **amplifies errors** (since CJT reverses if average competence <50%). A referendum on monetary policy (per Commitment 4) could thus produce *worse* outcomes than legislators.  
  **Revision Required:**  
  - **Option A:** Reject Commitment 4 for technical issues. Argue that legislators (or experts) should decide complex policies, while direct democracy applies only to value-based questions where voters >50% competent.  
  - **Cost:** Abandons epistemic superiority of referendums in many real-world cases.  
  - **Option B:** Reinterpret Commitment 2: Voters are incompetent on *raw policy analysis* but competent on *delegation* (e.g., "Which experts/parties share my values?"). Then referendums could work for meta-choices (e.g., "Should experts decide climate policy?").  
  - **Cost:** Commitment 4 now applies only to second-order decisions, not policy itself.  

  #### **3. Tension: Commitment 5 vs. Commitment 2**  
  **Severity:** 7/10 (Practical tension in institutional design)  
  **Conflict:**  
  - Commitment 5 says compulsory voting improves epistemic performance by increasing electorate size/representativeness.  
  - But if voters are rationally ignorant (Commitment 2), **forced participation may *lower* average competence**: Uninterested voters may randomize votes or rely on low-quality cues (e.g., celebrity endorsements), degrading collective intelligence.  
  **Revision Required:**  
  - **Option A:** Drop Commitment 5. Voluntary voting may better capture engaged, competent voters.  
  - **Cost:** Weakens representativeness; ignores that even poorly informed voters contribute *diverse* signals that cancel error (if net competence >50%).  
  - **Option B:** Pair Commitment 5 with a strong role for deliberation (Commitment 3). Argue deliberation *before* compulsory voting lifts competence above 50%.  
  - **Cost:** Requires evidence that deliberation reliably counters rational ignorance.  

  #### **4. Tension: Commitment 3 (Underdeveloped) vs. Commitment 2**  
  **Severity:** 6/10 (Untapped potential, not direct conflict)  
  **Conflict:**  
  - Commitment 3 values deliberation for epistemic gains but doesn’t address *how* it resolves Commitment 2’s voter incompetence. Deliberation could backfire (e.g., polarization, dominance by elites) or succeed (e.g., pooling knowledge).  
  **Revision Required:**  
  - **Strengthen Commitment 3:** Explicitly argue deliberation transforms incompetent voters (>50% competence post-deliberation) by correcting misinformation or clarifying interests.  
  - **Cost:** Demands robust empirical support; may not apply to deeply technical issues.  

  ---

  ### **Only Apparent Tensions**  
  - **Commitment 6 vs. Commitment 1:** No tension. CJT’s "correct answer" is agnostic about content—Commitment 6’s redefinition to "interests/values" is a coherent application if voters are competent in that domain.  
  - **Commitment 3 vs. Commitment 4:** Complementary. Deliberation can precede referendums or legislative votes.  

  ---

  ### **Recommended Revisions**  
  1. **Resolve the Severity-10 tension first:** Tighten Commitment 6. Explicitly distinguish:  
     - **Voter competence domain:** Judging "who represents my interests" (requires heuristics, not policy expertise).  
     - **Policy competence domain:** Reserved for representatives/experts.  
     This saves CJT for elections but not referendums on complex policies (modifying Commitment 4).  
  2. **Leverage Commitment 3:** Position deliberation as the tool that bridges Commitment 2 (incompetence) to Commitments 1/4/5 (epistemic gains).  
  3. **Soften Commitment 2:** Replace "worse than a coin flip" with "often unable to directly evaluate policy, but competent at proxy judgments."  

  This preserves your core epistemic framework while neutralizing key contradictions. Focus your paper on **democracy’s competence in selecting representatives** (Commitment 6), not direct policy decisions—this aligns all commitments except a narrowed Commitment 4.
