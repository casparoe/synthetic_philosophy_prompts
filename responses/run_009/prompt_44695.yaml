prompt: |-
  I'm a retired pharmacologist who fell into the philosophy rabbit hole a couple years ago, and there's a pattern in medical ethics I keep bumping into that I want someone to take apart for me. Catholic hospitals in the US (and honestly a lot of secular medical ethics too) draw lines that make no sense to me chemically. In an ectopic pregnancy, a surgeon can remove the whole fallopian tube with the embryo still inside it, but procedures that remove the embryo while saving the tube get agonized over or refused. A pregnant woman with uterine cancer can have the entire uterus taken out, fetus and all, but the same ethics committee will not allow directly collapsing the fetal skull to get the child out during an obstructed labor, even to save the mother. And in palliative care, we'll run a morphine drip high enough that respiratory depression will almost certainly kill the patient within days, so long as the dose is chosen for pain, but the same dose chosen to end things is euthanasia. To a guy who spent forty years on dose-response curves, this is bizzare: same molecule, same receptor, same patient, same dead patient, and the moral difference supposedly lives in something invisible in the doctor's head.

  The committees say it's the doctrine of double effect -- harm you foresee but don't intend is one thing, harm you intend as a means or an end is another. The trolley literature apparently runs on the same muscle: flip the switch and the one death is a side effect, push the man off the footbridge and it's a means, and everybody flips but almost nobody pushes. Okay. But it seems to me that a practice this concrete must be presupposing an entire theory of intention and moral responsibility underneath itself, and I want to know what that theory is and whether it can actually hold the weight.

  Specifically: What does the hospital practice strictly presuppose about intention -- that intentions are sharp, stable, inspectable things, and that they matter morally more than outcomes? And what does it merely fit well with, so that some other view (bright-line rules, screening out bad actors, self-defense logic) would license the same lines without the metaphysics of the inner life? I gather the experimental philosophers showed that whether ordinary people call a side effect intentional depends on whether it's bad -- the chairman who helps or harms the environment case -- and if everyday intention judgments are that contaminated, I want to know whether a practice that turns on intended vs. foreseen can still claim to be principled or whether it's just drawing the line where our mood already was. Also, is the whole thing internally consistent? These same institutions treat physicians as culpable for foreseeable harms they never intended at all -- that's basicaly what a negligence finding is -- so how does excusing the foreseen death in the operating room sit next to punishing the foreseen harm in the ICU? And last, if we swapped the presupposed view for a plain outcomes-and-probabilities one, which of the hospital's actual lines would move, and which ones would it turn out the doctrine was never holding up anyway?

  Don't bother with citations or telling me who wrote what -- I just want the reasoning worked through. Lead with your bottom line in the first sentence, then give the reasoning, no preamble and no restating my question.
reasoning: |-
  Okay, let's tackle this pharmacologist's deep dive into medical ethics. The core frustration is clear: how can identical chemical outcomes be morally distinguished solely by the actor's intention? 

  First, the bottom line: The practice relies on a neo-Aristotelian theory of intention where mental states have moral primacy over outcomes, but it's pragmatically reinforced by institutional need for defensible bright-line rules and fails under strict scrutiny of cognitive science.

  Hmm. The user's background matters here - a scientist used to dose-response curves would naturally see intention as a dubious variable. The examples given (ectopic pregnancy, uterine cancer, morphine dosing) all highlight the absurdity when physical outcomes are identical. 

  Let me reconstruct the unspoken layers of the question:
  - Underneath the surface, they're really asking "Is this ethical system coherent or just dressed-up intuition?"
  - The negligence paradox is sharp: why is foreseen harm punishable in malpractice but excusable in double effect?
  - There's an implied challenge: "Prove this isn't just magical thinking."

  The trolley problem reference shows they've done homework. That's good - we can skip basics. The chairman case (harm vs help environment) is crucial because it reveals intention-ascription isn't neutral. 

  For internal consistency: The system wobbles when you press on "intentional" vs "foreseen". Is removing a fallopian tube with an embryo really unintentional death? Or just death we've agreed to call unintentional? The uterine cancer example exposes this - same physical action, different framing.

  Negligence vs double effect is the killer objection. Legally, foreseen risks impose duty to mitigate. Ethically, double effect says foreseen death is permissible if unintended. That tension can't be resolved without special pleading.

  If we switched to pure consequentialism:
  - Ectopic pregnancy procedures would equalize
  - Terminal sedation criteria would collapse pain relief vs euthanasia
  - But the obstructed labor case might stay - crushing skulls feels different than natural death

  The real takeaway: This system survives because it matches deep intuitions (means vs side-effects) while giving committees non-arbitrary-seeming rules. But under a microscope, the "intention" variable contaminates the data.
answer: |-
  **The doctrine of double effect relies on a philosophically contested but practically entrenched view of intention as a distinct, knowable mental state that carries primary moral weight, though institutional pragmatism and rule-bound safety nets sustain the practice more than its internal logic can justify.**  

  Here’s the reasoning unpacked:  

  ### 1. **What the Practice Presupposes About Intention**  
     - **Intentions as Discrete Mental States**: It assumes physicians can isolate and report their "true" intentions (e.g., "removing a diseased tube" vs. "directly targeting the embryo"). Intentions are treated as stable, introspectively accessible, and morally decisive.  
     - **Moral Primacy of Intention Over Outcome**: The *foreseen but unintended* harm (e.g., fetal death during cancer surgery) is excused because the *goal* was therapeutic (saving the mother). The *identical outcome* becomes immoral if the physician intends the harm as a means (e.g., crushing the skull to resolve obstruction).  
     - **Metaphysical Commitment**: This requires a realist view of intentions—they aren’t just post hoc justifications but real psychological facts that define culpability.  

  ### 2. **What It Merely Fits With (Alternative Supports)**  
     - **Bright-Line Rules**: Institutions adopt double effect not solely for metaphysical reasons but because it creates *actionable boundaries*. Banning *all* procedures that directly cause fetal death simplifies oversight, even if the intention distinction seems arbitrary.  
     - **Moral Gatekeeping**: It screens out "bad actors" who might abuse loopholes (e.g., "I’m just relieving pain" while intentionally euthanizing).  
     - **Self-Defense Logic**: Removing a cancerous uterus with a fetus is framed as indirectly defending the mother’s life, whereas crushing the skull is seen as direct aggression.  

  ### 3. **Problems with Intention as a Principled Foundation**  
     - **Cognitive Contamination**: As you note, experiments (like the "chairman case") show that people’s intention judgments are biased by outcome valence. Calling a side effect "intentional" depends on whether it’s harmful—not on mental-state clarity. A morphine dose *chosen for pain* but foreseeably lethal may be indistinguishable from euthanasia in the physician’s mind.  
     - **Unstable Intentions**: In surgery, is removing a fallopian tube *with the embryo* truly unintentional killing? Or is the embryo’s death a known, accepted part of the therapeutic goal? The line between "intended means" and "foreseen side effect" often collapses under scrutiny.  
     - **Negligence Paradox**: If foreseeability alone establishes culpability in malpractice (e.g., not anticipating a drug interaction), why does foreseeability *not* establish culpability in double-effect cases (e.g., foreseeing fetal death)? The doctrine inconsistently treats foresight: as blameworthy in negligence but exculpatory when intention is "pure."  

  ### 4. **Switching to Outcomes/Probabilities: What Would Change?**  
     - **Collapsing Distinctions**:  
       - Ectopic pregnancy: Removing the embryo vs. the tube would be morally equivalent if both save the mother.  
       - Palliative care: Morphine doses would be judged by risk/benefit (pain relief vs. death probability), not the clinician’s stated intent.  
     - **Enduring Distinctions**:  
       - Skull collapse in obstructed labor might *still* be taboo—not due to intention, but because visceral acts (crushing) provoke greater aversion than omissions or indirect harms.  
     - **Revealing Inconsistencies**:  
       - The uterine cancer case (allowed) vs. obstructed labor (forbidden) would be exposed as arbitrary if outcomes are identical. Double effect masks this by emphasizing intention.  

  ### 5. **Can It Hold Weight?**  
     - **Principled? Only superficially**: The doctrine provides a vocabulary for justification, but its reliance on contested intention metaphysics and outcome-driven intuition makes it functionally pragmatic—not rigorously logical.  
     - **Internally Consistent? No**: It inconsistently applies foresight (punished in negligence, excused in double effect) and struggles with intention malleability.  
     - **Verdict**: The practice persists because it aligns with intuitive moral psychology (means vs. side-effects) and offers defensible rules for institutions—not because its theory of intention is coherent. Under outcomes-based ethics, the *physical act* would dictate morality, collapsing artificial distinctions while preserving those rooted in genuine harm differentials or societal aversion.
