  - **Dispositional rationality vs. act rationality**: Calling a disposition rational because it leads to good outcomes, even if specific acts seem irrational.  
  - **Causal chains**: If the disposition causes beneficial pre-commitment, is it irrational at all?  
  - **Self-modification**: Can you "choose" irrationality? That ties into self-deception debates.  

