prompt: |-
  Quick background so you know where I'm coming from: I'm a retired physical oceanographer. Forty-odd years of measuring currents from ships and moorings, and now that I've got time on my hands I've fallen down the philosophy of physics rabbit hole and can't climb back out. Something bugged me my whole career and I only recently got the words for it, so let me lay it out and then ask my question.

  Practically everything we did assumed you can tell, from inside a sealed box, whether the box is rotating. A gyrocompass finds true north without ever seeing the sky. An inertial unit on a submarine tracks every turn and drift with no external reference at all. After storms, the surface currents don't just relax back — they go round in circles, clockwise in our hemisphere, with a period of about seventeen hours at our latitude, which the textbooks call half a pendulum day, and that period is set by the earth's spin even though the water is only reacting to wind. Geodesists are even more upfront about it: they distinguish gravitation from gravity, where gravity is gravitation plus a centrifugal term coming from the rotation. Somewhere in the pipeline an engineer is always told which frames count as inertial and which are rotating, and Coriolis and centrifugal terms get added or subtracted, and nobody stops to ask: rotating with respect to WHAT? The nearest large mass is the earth and we're riding with it, not turning relative to it. The stars are never consulted. Newton had his bucket — water climbing the sides when the bucket spins — and said the water turns with respect to absolute space itself. Mach came along later and said, roughly, that you should count the distant masses, and that a bucket spinning alone in an otherwise empty universe wouldn't feel a thing. And general relativity, as I understand it (correct me if I'm off), hands the job to the metric field, which seems to be neither Newton's space nor just a bookkeeping of relations among material bodies — it has its own degrees of freedom. I may be garbling some of that, tell me if so.

  So here's the actual question. Take the working practice — gyrocompasses, inertial navigation, the geodesists' gravity/gravitation split, our half-pendulum-day oscillations — as a going concern, the way you might take a courtroom's rules of evidence. What does the practice presuppose about space or spacetime? Does it need Newton's absolute space, is it compatible with Mach's answer, or does it quietly require something like the metric field being a real physical thing? Where is it underdetermined — that is, would several of these views license exactly the same corrections, so the practice can't choose between them? And if we swapped the presupposed view for another, would anything in the practice actually have to change, or only the footnotes in the textbooks?

  Please structure your reply like this, in this order, roughly these lengths:

  1. "The practice, spelled out" — about 150 words, just the phenomena and conventions, no philosophy yet.
  2. "What it seems to presuppose" — about 250 words, reconstructing the implicit commitment as charitably as you can, including why the fact that the box is sealed matters so much.
  3. "The three candidates" — about 300 words, Newton, Mach, and the metric-field reading, and for each one say whether it licenses the practice as-is or has to bite some bullet to do it.
  4. "Where it's underdetermined" — about 150 words, be honest about which parts of the practice could NOT decide between the candidates, and keep those seperate from the parts that might.
  5. "What would have to change" — about 100 words, whether any instrument, correction, or convention would come out different, or whether it's all just interpretation after the fact.

  Assume I know the physics cold but am new to the philosophy — use the physics as freely as you like, but introduce the philosophical vocabulary as you go. And if I've mangled Mach or general relativity above, say so plainly. I'd rather be corrected than flattered.
reasoning: |-
  Okay, let me unpack this oceanographer's deep dive into rotation metaphysics. The user clearly knows their physics but wants philosophical scaffolding for those unexplained presuppositions that bugged them for decades. 

  First, I need to map their concrete examples: gyrocompasses working without sky reference, inertial nav systems in submarines, post-storm circular currents tied to Earth's rotation, geodesists' gravity/gravitation distinction. All these share a core assumption - rotation is detectable from within a closed system. 

  The sealed box point is crucial. It means external references (stars, Earth's surface) are deliberately excluded from the measurement framework. The phenomena must therefore rely on something more fundamental than relational motion. 

  Now for the philosophical triad: Newton's absolute space provides the simplest fit - rotation just *is* motion relative to this container. Mach's relationalism struggles because distant stars aren't actually consulted in practice. The metric field in GR walks a middle path - it's not absolute but has physical properties affecting local measurements. 

  I notice the user's Mach summary is spot-on, but their GR phrasing ("neither Newton's space nor just bookkeeping") shows good intuition. The metric *does* have independent degrees of freedom, making it more than just relations. 

  The underdetermination is real: all three frameworks can *calculate* the phenomena correctly by adding centrifugal/Coriolis terms. But they differ radically on what those terms *represent* - artifacts of non-inertial frames (Newton), induced effects from cosmic matter (Mach), or geodesic deviations in curved spacetime (GR). 

  Practically? Nothing changes in the oceanographer's spreadsheets. The 17-hour period stays 17 hours regardless of your metaphysics. But philosophically, the choice matters for how we understand inertia itself - is it imposed by space, dictated by the cosmos, or emergent from the metric? 

  Where Mach gets shaky is explaining why *local* experiments detect rotation without any apparent connection to distant masses. GR handles this better via frame-dragging effects, though they're negligible for Earth-scale systems. 

  Final thought: The user's career-long intuition was right - we *do* presuppose a background that "feels" absolute in daily practice. GR sophisticates this but doesn't eliminate the mystery.
answer: |-
  ### 1. The Practice, Spelled Out  
  In physical oceanography and geodesy, operational procedures routinely detect rotation from within isolated systems without external reference. A gyrocompass aligns with Earth’s spin axis using a spinning rotor’s rigidity in space, yielding true north without celestial sight. Inertial navigation systems (INS) track position and orientation via accelerometers and gyroscopes, measuring fictitious forces (Coriolis, centrifugal) arising from non-inertial motion. Oceanic inertial oscillations—post-storm circular currents with periods of *T* = 12 hours / sin(φ) (where φ is latitude)—arise from Earth’s rotation affecting fluid dynamics. Geodesists define "gravity" as the vector sum of gravitational acceleration (from mass attraction) and centrifugal acceleration (from Earth’s rotation). Engineers embed these corrections directly into models, assuming a priori knowledge of which frames are inertial (non-rotating) versus rotating.  

  ### 2. What It Seems to Presuppose  
  The practice presupposes that **rotation is an intrinsic, measurable property of motion**, independent of external observable bodies. Key implications:  
  - **Local detectability**: A sealed system (e.g., submarine, drifting buoy) can distinguish rotation from non-rotation using only internal mechanics (e.g., gyroscope precession, Foucault pendulum-like oscillations).  
  - **Fixed reference**: Operationally, "non-rotating" frames are those where Newton’s laws hold *without* fictitious forces. Earth’s frame is treated as rotating (hence centrifugal gravity), while the "inertial" frame is implicitly tied to the distant cosmos or abstract space.  
  - **Why the sealed box matters**: If rotation were purely relational (e.g., defined by stars), external references would be necessary. But gyros/INS work in enclosed spaces (e.g., submarines), proving rotation is inferred from *local dynamical effects*—fictitious forces or conservation of angular momentum—implying a non-material background.  

  ### 3. The Three Candidates  
  **Newtonian Absolute Space**:  
  - **License**: Perfectly licenses the practice. Rotation is motion relative to absolute space, directly explaining fictitious forces and gyroscopic rigidity.  
  - **Bullet to bite**: Postulates unobservable "space itself" as a substance—a non-empirical entity Mach criticized.  

  **Machian Relationalism**:  
  - **License**: Can *reproduce* phenomena by attributing inertia to distant masses (e.g., stars). Centrifugal forces arise from acceleration relative to the "fixed stars."  
  - **Bullet to bite**: Struggles with sealed systems. Why would a gyro in a box "know" to precess without causal interaction with distant matter? Mach’s view implies a universe without stars lacks inertia—contradicting standard interpretations of local rotation detection.  

  **General Relativity (Metric Field)**:  
  - **License**: Best modern fit. Inertia is governed by the spacetime metric, which has physical degrees of freedom. Rotation is motion deviating from local inertial frames (geodesics), generating measurable fictitious forces.  
  - **Bullet to bite**: The metric *is* a real physical field (not absolute space), but its local behavior can mimic Newtonian inertia. However, GR admits frame-dragging (rotation affects spacetime), complicating Mach’s idea that distant masses *alone* define inertia.  

  *(Your GR summary was correct: the metric is dynamical, not just relations or Newton’s container.)*  

  ### 4. Where It’s Underdetermined  
  The practice is **empirically underdetermined** in explaining *why* local frames detect rotation:  
  - **Agreement on phenomena**: All three frameworks predict identical corrections (e.g., centrifugal gravity, Coriolis parameter *f* = 2Ωsinφ). The half-pendulum day, INS outputs, and gyro north-seeking would be identical regardless of the underlying ontology.  
  - **Indistinguishable aspects**: Sealed-box experiments cannot discern whether fictitious forces arise from absolute space, distant stars, or the metric’s geometry. Mach’s "fixed stars" role is effectively mimicked by the asymptotic flatness of spacetime in GR.  
  - **Distinguishing factor**: Only GR predicts *deviations* from pure Machianism (e.g., frame-dragging near rotating masses), but these effects are negligible for Earth-based systems. Thus, for oceanography/geodesy, all three are observationally equivalent.  

  ### 5. What Would Have to Change  
  **Nothing in practice changes**—regardless of ontological commitment.  
  - **Instruments**: Gyrocompasses, INS, and current meters would function identically; their outputs are frame-dependent calculations, not probes of "true" space.  
  - **Corrections**: The centrifugal term in gravity, Coriolis in Navier-Stokes equations, and inertial oscillation math remain unchanged. These are coordinate adjustments, not philosophical statements.  
  - **Textbooks**: Only interpretations would differ. Newtonian texts cite "absolute space," Machians emphasize cosmic relations, and GR texts describe geodesic deviations—but the formulae stay identical. The practice is ontologically neutral; it only requires that *some* background permits distinguishing inertial/non-inertial frames locally.  

  ### Bottom Line  
  Your instruments were measuring the *physical effects of rotation* within a consistent mathematical framework, agnostic to whether space is absolute, relational, or geometric. The "why" remains philosophy—but your data needs no revision.
