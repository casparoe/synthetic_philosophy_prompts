answer: |-
  ## Joint Statement: Adversarial Collaboration on Persistence Through Time

  **Agreed Claims (Signed by Dan & Maya):**

  1.  **Persistence is Real:** Objects genuinely persist through time. Dan-at-noon and Dan-at-midnight are stages of the *same* persisting entity, Dan. Maya-at-breakfast and Maya-at-dinner are the *same* persisting entity, Maya. The phenomenon of an object existing at multiple times is fundamental and requires explanation.
  2.  **Ordinary Change is Real & Reported Accurately:** Ordinary language reports of change ("Dan was sitting, now he is standing") are veridical and capture a genuine feature of reality. Any adequate theory must account for the truth of such statements without contradiction. Both theories claim to do this.
  3.  **Puzzles Highlight Genuine Issues:** Puzzles like the Statue/Clay and Growing-Up paradoxes demonstrate genuine conceptual tensions concerning identity, constitution, persistence conditions, and the relationship between parts and wholes across time. They are not merely linguistic illusions and impose constraints on any viable theory of persistence. Both theories offer solutions to these puzzles.
  4.  **Lewis's Temporary Intrinsics Problem is Substantive:** David Lewis's argument that the possession of temporary intrinsic properties (like shape) by a single, wholly present object appears contradictory poses a genuine and central challenge for any theory of persistence. Any adequate theory *must* provide a non-contradictory account of how an object can be, for example, straight at t1 and bent at t2.
  5.  **The Demand for an Explanation of Change:** The fact of change (an object having incompatible properties at different times) requires explanation. Neither theory denies change occurs; they offer different *explanations* for *how* it occurs consistently.
  6.  **Internal Consistency:** Both Perdurantism and Endurantism aim to be internally consistent metaphysical frameworks capable of describing the world and accounting for persistence and change.

  **Disagreements on Fundamental Ontology & Explanation:**

  | Aspect of Disagreement          | Endurantist Position (Maya)                                                                 | Perdurantist Position (Dan)                                                                 |
  | :------------------------------ | :------------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------ |
  | **1. Fundamental Existence**    | Three-dimensional objects (substances) are fundamental existents.                           | Four-dimensional spacetime worms (objects extended in time) are fundamental existents.      |
  | **2. Persistence**              | An object persists by being **wholly present** at each moment of its existence.             | An object persists by having **different temporal parts** existing at different times.      |
  | **3. Explanation of Change**    | Change is primitive: **One and the same object** possesses incompatible intrinsic properties at different times *simpliciter*, made consistent by the irreducible reality of **temporal qualification** (tensed properties or adverbial modification). | Change is derivative: **Different temporal parts** of an object possess the incompatible intrinsic properties. There is no single entity possessing both shapes *simpliciter* at once. |
  | **4. Object Identity**          | An object is **strictly identical** to itself at every time it exists. There is no entity "Dan-at-t" distinct from Dan. Temporal stages are abstractions or descriptions, not parts. | An object is **strictly identical** to the sum of its temporal parts. "Dan-at-t" refers to a proper temporal part of Dan. Dan himself is the whole spacetime worm. |
  | **5. Interpretation of "Was F"** | "Dan was sitting" means: **Dan himself** (the whole, identical object) possesses the property *having been sitting* (a tensed property) or *sits-at-t* (an indexed property). | "Dan was sitting" means: **An earlier temporal part of Dan** possesses the intrinsic property *sitting*. |
  | **6. "Wholly Present" Meaning** | "Wholly present" means the **entire object**, with all its parts (spatial and material), exists at that time. No essential part is located elsewhere in time. | "Wholly present" is incoherent for persisting objects. At any instant, only a **temporal part** (a momentary "slice") of the object exists *at that time*. |

  **Identified Cruxes & Pre-Committed Predictions:**

  Each crux presents a specific case or argument both parties agree is relevant. Predictions are stated in terms each theorist would endorse about *what their own theory implies* for the case.

  *   **Crux 1: Coincident Objects & Persistence Conditions**
      *   **Case:** Consider a statue (Goliath) created from a specific lump of clay (Lump1) at t1. At t2, the statue is destroyed by being squashed into a ball, but the clay (now Lump2) survives. Assume Lump1 = Lump2 (the clay persists).
      *   **Relevance:** Bears directly on whether persistence requires strict identity over time and how to count objects sharing all matter at a time.
      *   **Endurantist Prediction (Maya):** Endurantism predicts that if Lump1 = Lump2 (clay persists) and Goliath ≠ Lump1 (statue ≠ clay at t1), then Goliath cannot be identical to Lump2 at t2. Therefore, Endurantism predicts that Goliath *does not survive* being squashed, while the clay does. This explains the difference in persistence conditions.
      *   **Perdurantist Prediction (Dan):** Perdurantism predicts that Goliath is a temporal part of the clay's spacetime worm, confined to the time when it is statue-shaped. The clay-worm has a statue-shaped temporal part (Goliath) and a ball-shaped temporal part (Lump2). Therefore, Perdurantism predicts that *Goliath itself* (the statue-shaped temporal part) does not exist after t2, while the clay-worm (the sum of temporal parts including Lump2) does persist. There is only one object (the clay-worm) at the location, with different temporal parts having different shapes and names.

  *   **Crux 2: The Intelligibility & Adequacy of Tensed Properties / Adverbialism for Temporary Intrinsics**
      *   **Case:** Consider Dan bending. At t1, he is straight. At t2, he is bent. Lewis argues only perdurantism avoids contradiction by assigning shapes to different parts. The Endurantist uses either tensed properties ("Dan is-simpliciter bent-at-t2") or adverbialism ("Dan is bent t2-ly").
      *   **Relevance:** Bears directly on whether Endurantism genuinely resolves Lewis's problem or merely paraphrases it in a way that avoids contradiction *only* by making the property non-intrinsic or the predication irreducibly tensed, thus failing to "get the shape back" as an intrinsic property had *simpliciter*.
      *   **Endurantist Prediction (Maya):** Endurantism predicts that "Dan is bent-at-t2" (tensed) or "Dan is bent t2-ly" (adverbial) *is* an intelligible and adequate paraphrase that captures the reality of Dan *himself* possessing the intrinsic property *bentness* at t2 *simpliciter*, without contradiction, precisely *because* of the irreducible temporal qualification. This *does* recover the intrinsic property without resorting to parts.
      *   **Perdurantist Prediction (Dan):** Perdurantism predicts that "Dan is-simpliciter bent-at-t2" (tensed) is either (a) *not intelligible* as attributing an intrinsic property *simpliciter* (it covertly indexes the property or the having of it), or (b) if intelligible, it *fails to attribute a genuine, non-relational, intrinsic property* to the whole, identical Dan. Only "Dan-at-t2 has the intrinsic property *bentness*" attributes a genuine temporary intrinsic *simpliciter* to an entity. The Endurantist's paraphrase *does not* "get the shape back" as an intrinsic property of the persisting object *simpliciter*; it changes the nature of the property or the predication.

  *   **Crux 3: Survival Through Fission**
      *   **Case:** Suppose Dan's brain is split and transplanted into two empty bodies (Lefty and Righty), each resulting person being psychologically continuous with the original Dan. Both survive and lead full lives.
      *   **Relevance:** Bears directly on the relationship between strict identity and survival, and the counting of objects over time, particularly under branching.
      *   **Endurantist Prediction (Maya):** Endurantism predicts that strict identity cannot hold between Dan and both Lefty and Righty (as they are distinct and simultaneous). Therefore, Endurantism predicts that Dan *does not survive* fission in the strict sense. Dan ceases to exist, and two new persons (Lefty and Righty) come into existence, each psychologically continuous with Dan. Survival requires non-branching identity.
      *   **Perdurantist Prediction (Dan):** Perdurantism predicts that Dan's spacetime worm branches at fission. Dan-at-times-before-fission is a temporal part of *both* the Lefty-worm and the Righty-worm. Therefore, Perdurantism predicts that Dan *does survive* in both Lefty and Righty, but not via strict identity. Dan (the pre-fission person) is identical to the pre-fission temporal part shared by both resulting worms. Both Lefty and Righty are genuine survivors of Dan, related by having a common temporal part.

  **Identification of Potential Verbal Disagreements:**

  Both parties acknowledge that the following points *might* involve differences in meaning or focus that contribute to the dispute, without necessarily reflecting a deep metaphysical disagreement about reality:

  1.  **"Exactly one object" in Coincidence Cases:** Both agree only one portion of matter exists at a location at a time. The disagreement centers on *what counts as an object*.
      *   *Endurantist Focus:* Often emphasizes that "object" refers to a substance with a specific form/persistence condition. Lump and Statue, sharing matter, are distinct substances (thus two objects) if they have different persistence conditions.
      *   *Perdurantist Focus:* Often emphasizes that "object" refers to a maximal spacetime region filled by matter (the worm). Lump and Statue are temporal parts of the same spacetime worm (thus one object with differently shaped parts).
      *   *Why Verbal?* The dispute may hinge on whether "object" fundamentally picks out 3D substances with modal properties or 4D spacetime worms. If they agreed on the definition of "object," the counting might follow directly, though the underlying metaphysics would differ.

  2.  **The Scope of "Part":** Both agree objects have spatial parts. The core disagreement is over the existence and nature of *temporal* parts.
      *   *Endurantist Definition:* "Part" typically means a spatial or material component *of the object as it exists wholly at a time*. They deny objects have temporal parts in this sense.
      *   *Perdurantist Definition:* "Part" includes both spatial parts (of a temporal slice) and temporal parts (slices of the spacetime worm). Temporal parts are genuine parts analogous to spatial parts.
      *   *Why Verbal?* If "part" is defined narrowly as only spatial/material components of a wholly present 3D object, temporal parts don't exist by definition. If "part" is defined broadly to include temporal segments of 4D entities, they do. The disagreement over the *existence* of temporal parts presupposes their chosen definitions of "object" and "part."

  This document represents our current understanding of the agreements, core disagreements, and key testable differences between our positions. We commit to these formulations of our own views and the predictions derived from them for the specified cases.

