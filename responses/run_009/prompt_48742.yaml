  Based on your friend's track record and the implicit pattern in her rulings, here's my reverse-engineered analysis of her personal "is it alive?" criteria, predictions for the new cases, and a strategy to test the rule's boundaries.

  ### Your Friend's Implicit Rule
  **"Life requires autonomous self-maintenance of a bounded, far-from-equilibrium chemical system."**  
  This rule emphasizes **continuous metabolic self-preservation** within a physical boundary as the core requirement. Evolution, reproduction, and even host-dependence are secondary. Here's how it fits her rulings:

  - **Key inclusions (alive)**:  
    - *E. coli*: Autonomous metabolism + membrane.  
    - *Mule*: Self-maintaining system despite sterility (no evolution/reproduction).  
    - *Chlamydia*: Imports ATP but still *uses energy to maintain its own structure/functions* (e.g., repairs proteins, replicates DNA).  
    - *Worker honeybee*: Sterile but actively self-sustains via metabolism.  

  - **Key exclusions (not alive)**:  
    - *Influenza virus*: No intrinsic metabolism; relies entirely on host machinery.  
    - *Prion*: No self-maintenance; passively misfolds host proteins.  
    - *Crystals*: Grow but don't actively maintain disequilibrium (e.g., no energy conversion).  
    - *Digital organisms*: Lack chemical embodiment; no physical self-preservation.  

  ### Predictions for New Cases
  1. **RNA Enzyme System (self-replicating RNA with selection)**  
     - **Verdict: Not alive**  
     - *Why?* It lacks **autonomous self-maintenance** and a **physical boundary**. While it evolves, it doesn't *sustain itself* metabolically—it merely assembles fragments using supplied energy. This is analogous to her "crystals" ruling: passive growth without active upkeep. It also mirrors digital organisms (evolution without physicality).  

  2. **Protocell (self-repairing membrane + internal chemistry)**  
     - **Verdict: Alive**  
     - *Why?* It **actively maintains itself far from equilibrium** (internal chemistry) and **repairs its boundary**. This matches *Chlamydia* (host-dependent but self-maintaining) and the *honeybee* (functional despite reproductive constraints). The static genome is irrelevant—her rulings show she doesn't require evolvability (mule, honeybee).  

  ### Alternative Rules & Where They Fail
  Your friend's rule is distinct from common definitions, but other rules *almost* fit her track record. Here's how they hold up (or don't) on the new cases:  

  | Rule                                  | Fits Past Cases? | RNA System Verdict | Protocell Verdict | Failure Point                                  |
  |---------------------------------------|------------------|-------------------|-------------------|-----------------------------------------------|
  | **Her rule: Autonomous self-maintenance** | ✅ Perfect fit   | ❌ Not alive      | ✅ Alive          | Consistent with all rulings.                  |
  | NASA: "Darwinian evolution"           | ❌ (Mule, honeybee lack it) | ✅ Alive (evolves) | ❌ Not alive (no evolution) | Excludes non-evolving but self-sustaining systems. |
  | "Cellular basis + metabolism"         | ❌ (Viruses excluded, but Chlamydia included despite host-dependence) | ❌ Not alive | ✅ Alive          | Too vague on "metabolism" (RNA system has ligation, but not "maintenance"). |
  | "Open-ended evolution"                | ❌ (Excludes mule/honeybee) | ✅ Alive          | ❌ Not alive      | Doesn't explain crystals/digital life exclusions. |
  | "Information inheritance"             | ❌ (Prions inherit misfolding) | ✅ Alive        | ✅ Alive (template) | Incorrectly includes prions/viruses.          |

  ### The Perfect Test Case to Spring on Her
  **A self-sustaining *mechanical* system**:  
  - **Description**: A solar-powered, self-repairing robot in a desert environment. It uses sunlight to power internal mechanics, replaces worn parts using raw materials from sand/rocks, and "evolves" its repair strategies via machine learning (e.g., optimizes energy use in response to damage). Bounded (physical body), maintains disequilibrium (active repairs), but non-chemical.  

  - **Why it distinguishes rules**:  
    - Under **her rule (chemical system)**: ❌ Not alive. *Physical autonomy ≠ chemical self-maintenance*.  
    - Under **"open-ended evolution" or "information inheritance"**: ✅ Alive (evolves + self-sustains).  
    - Under **NASA-like rules**: ✅ Alive (capable of "Darwinian" adaptation).  

  This forces her to confront whether "chemical" is implicit in her logic (as suggested by exclusions of crystals/digital life) and whether autonomy alone is sufficient. If she calls it *not alive*, it confirms her focus on biochemistry. If she calls it *alive*, she's prioritizing function over substrate—contradicting her digital organisms ruling.

  ### Does She Have a Rulebook?
  **Yes—but it's operational, not philosophical.** Her rule avoids debates about evolution/reproduction and instead asks: *"Is this thing actively keeping itself from falling apart?"* This aligns with biochemists' pragmatic focus on metabolic networks (e.g., Nick Lane's "energy-driven" definition). It's why she accepts Chlamydia (minimal-but-active self-preservation) but rejects viruses (molecular parasites) and digital life (abstract patterns).  

  **Bring this test case to your next beer session—it'll either crack her code or reveal where intuition overrules logic.**
