prompt: |-
  i'm trying to get clear on anthropic reasoning before i commit to a principle, and instead of yet another recap of the presumptuous philosopher i want the spec first. i'll tell you the purpose so adequacy is relative to something: the principle is for making predictions and decisions as one agent among many, not for settling cosmology — so it has to be usable by someone who can't run experiments on the multiverse, and it should mostly leave my ordinary predictions alone except when my own existence is itself evidence.

  so write me the desiderata: what any adequate principle for reasoning about indexical evidence has to deliver. the cases it needs a handle on should include the presumptuous philosopher, doomsday, sleeping beauty (i want the halfer/thirder stakes, not just the labels), and a case where the number of observers depends on my own choice, so the principle has to say wether it counts people who wouldn't have existed otherwise — adam and eve style. plus one more, take it seriously even though i made it up: i'll call it the Backup Clerk. roughly, there are two possible worlds: in one a single clerk is hired to process records, in the other a million clerks are hired, and i know i'm a clerk but not which world i'm in. the wrinkle is that in both worlds i remember applying for the job before the hiring happened, so my question is whether the update toward the million-clerk world should come just from finding myself hired, or whether the fact that i put myself in the reference class by applying changes what counts as my evidence. i want the principle's verdict on that to come from the principle itself, not from a prior smuggled in, and i want to see which side of that line the principle draws.

  for each desideratum give the case or consideration behind it, tell me which are non-negotiable and which are just preferences of one camp (e.g. "must agree with thirders" is a camp preference unless you can show me why it isn't), and flag any pair you suspect can't be jointly satisfied. if some subset of the list turns out to be jointly unsatisfiable, that's a result in itself — say so plainly, that's the part i most want to see. then just a short paragraph at the end on how plain self-sampling and plain self-indication do against your list. keep the weight on the criteria, the scoring is the least interesting part.

  one formatting thing: no headings, bullet points, bold text, or tables in your reply. continuous prose only, like an email or a letter.
reasoning: |-
  Okay, the user is diving deep into anthropic reasoning and wants a clear set of desiderata for a principle that handles indexical evidence. They're focused on practical predictions and decisions as one agent among many, not cosmology. Their examples include Presumptuous Philosopher, Doomsday, Sleeping Beauty, Adam and Eve, and their own Backup Clerk case. They want the desiderata to be non-negotiable where possible, highlight conflicts, and avoid bias toward camps like halfers or thirders.

  First, I need to outline what makes an anthropic principle adequate for their needs. The core challenge is balancing evidence from existence with other information. For each case, I must extract the underlying requirement. Presumptuous Philosopher tests if the principle forces accepting large numbers without direct evidence. Doomsday checks if future population size affects current survival probability. Sleeping Beauty's halfer/thirder divide shows the tension between centered and uncentered evidence. Adam and Eve examines how counterfactual observers are treated, and Backup Clerk probes reference classes based on actions.

  The user emphasized avoiding smuggled priors, so desiderata must emerge from the cases themselves. Non-negotiables likely include non-manipulability and handling self-locating uncertainty. But conflicts might arise: e.g., treating existence as evidence (from Presumptuous) could clash with not updating dramatically in Doomsday. Sleeping Beauty's probabilities might be unresolvable, indicating a fundamental split. Backup Clerk's reference class issue could challenge whether applying changes evidence weight.

  I should list each desideratum with its case origin, mark non-negotiables, and note tensions. For instance, "Non-arbitrariness" from Adam and Eve is crucial to avoid ad-hoc rules, while "Stability" from Backup Clerk prevents evidence distortion. Conflicts: Presumptuous vs. Doomsday might be irreconcilable; Sleeping Beauty's halfer/thirder could be a true dilemma. Then, briefly evaluate Self-Sampling (SSA) and Self-Indicating (SIA): SSA fails Presumptuous but handles Doomsday, SIA does the opposite. Both struggle with Backup Clerk's reference class.

  Finally, highlight that some conflicts are unavoidable—e.g., accommodating both Presumptuous and Doomsday may be impossible—and that's a key insight for the user. The goal is clarity on trade-offs, not scoring systems.
answer: |-
  Here’s a distillation of desiderata for an anthropic principle suited to your purpose, grounded in the cases you specified. Each emerges from a specific challenge, with non-negotiability assessed based on coherence, avoidability of arbitrariness, and operational defensibility for an embedded agent. Conflicts are noted where they bite.

  First, **Observer Existence as Evidence**: The principle must acknowledge that finding yourself existing (or occupying a specific role) can be evidence about the world. The *Presumptuous Philosopher* case forces this: if theory A predicts a trillion times more observers than theory B, and you find yourself existing, a principle that ignores this massive numerical difference fails – it leaves relevant evidence unused. This is non-negotiable; refusing to treat existence as evidence renders anthropic reasoning inert. *Backup Clerk* also hinges on this; finding yourself hired *is* evidence about the hiring scale.

  Second, **Non-Arbitrary Reference Class**: The principle must define *which* observers count ("reference class") in a way that isn't circular or arbitrarily narrow/broad. *Adam and Eve* is the test: if your choice affects how many observers *could* exist (e.g., procreating or not), does the principle include merely possible observers, only actual observers, or something else? Counting *only* observers who exist in all possible outcomes ignores the impact of your choice. Counting *all possible* observers risks overwhelming evidence from hypotheticals. A non-arbitrary definition is non-negotiable; without it, reasoning depends on unmotivated boundaries. *Backup Clerk* presses here too: does "applying" definitively place you in the reference class, or is it contingent on being hired?

  Third, **Stability Under Information Gathering**: The principle shouldn't allow trivial manipulation of evidence by acquiring non-informative indexical knowledge. *Backup Clerk* illustrates this: if simply applying (before knowing if you're hired) locks you into the clerk reference class, then learning you *are* hired provides *no* evidence favoring the million-clerk world – the evidence was "used up" when you applied. If applying doesn't lock you in, then learning you're hired *is* evidence. The desideratum is that the principle shouldn't let the *timing* of learning non-indexical facts (like applying) artificially alter the evidential value of subsequent indexical facts (being hired). This stability is a strong preference bordering on non-negotiable to prevent self-undermining reasoning.

  Fourth, **Consistency with Non-Indexical Updates**: When indexical and non-indexical evidence combine, the principle must integrate them coherently. *Doomsday* is key: learning you were born early in human history *is* indexical evidence relevant to hypotheses about total human duration/population. A principle that ignores this (e.g., treating your birth rank as purely random without regard to total numbers) is inadequate. However, the *strength* of the update is negotiable – this is where camps diverge (e.g., strong vs. weak Doomsday arguments). The non-negotiable core is that the indexical evidence *must* be incorporated somehow. *Sleeping Beauty* also blends indexical (what day/is it heads?) and non-indexical (coin flip) evidence.

  Fifth, **Halfer/Thirder Resolution (or Explicit Stakes)**: The principle must take a clear stance on *Sleeping Beauty*-type scenarios and crucially, articulate the *operational meaning* of the probability it assigns. It's insufficient to just say "1/2" or "1/3". The desideratum is that the probability must correspond to defensible decision-making (e.g., what betting odds are fair?). The *halfer* (P(Heads)=1/2) and *thirder* (P(Heads)=1/3) positions represent fundamentally different ways of handling self-locating uncertainty upon waking. There is no consensus on which is "correct," making this desideratum negotiable *in outcome* but non-negotiable in *requiring clarity* on what the probability *means for action*. A principle must commit to one view of the epistemic situation upon waking.

  **Suspected Conflicts:**

  1.  **Presumptuous Philosopher vs. Doomsday Intuition:** Accommodating the strong evidential force of large numbers in Presumptuous Philosopher inherently weakens the evidential force of early birth rank in Doomsday (and vice-versa). A principle strongly favoring one will struggle to satisfy common intuitions about the other. Reconciling these within a single framework satisfying all desiderata is likely impossible without sacrificing some intuitive pull.
  2.  **Stability (Backup Clerk) vs. Flexible Reference Class:** Defining a reference class stable enough to prevent manipulation (e.g., "all potential applicants" locks you in too early) might clash with defining one flexible enough to capture the genuine evidence of finding yourself in a specific role ("hired clerks" makes being hired informative). This tension is central to the Backup Clerk puzzle.
  3.  **Existence as Evidence vs. Non-Arbitrary Reference Class:** Treating existence as strong evidence (per Presumptuous) pushes towards including potential observers (to explain *why* existence is evidence in large worlds), but Adam and Eve shows this can lead to counterintuitive results where your choices affect probabilities about independent facts via observer count. Restricting to actual observers avoids this but might weaken the Presumptuous update.

  **How Self-Sampling (SSA) and Self-Indication (SIA) fare:**

  *   **Self-Sampling Assumption (SSA - Sample from actual observers):** Naturally handles Doomsday (early birth rank is unlikely if total pop is huge) and Sleeping Beauty (halfer). Fails Presumptuous Philosopher (ignores the higher chance of existing in large universes). Struggles fundamentally with Adam and Eve (reference class of "actual observers" depends on choice, creating awkwardness). Ambiguous on Backup Clerk (does "actual clerk" reference class make being hired evidence? Depends on timing).
  *   **Self-Indication Assumption (SIA - Probability proportional to # of observers):** Naturally handles Presumptuous Philosopher (favors large universes). Fails Doomsday (no update from birth rank). Often aligns with Sleeping Beauty (thirder). Can handle Adam and Eve by counting potential observers, but this feels ad hoc and risks observer-creation paradoxes. Ambiguous on Backup Clerk (if reference class includes applicants, SIA might favor large hiring *before* knowing you're hired, potentially violating Stability).

  The core tension your desiderata expose is this: **Indexical evidence arising from your existence/role is real and must be used (Desideratum 1), but *how* to count observers for normalization (Desideratum 2) and *when* the evidence manifests (Desideratum 3) creates deep conflicts, particularly between accommodating large numbers (Presumptuous) and birth-rank effects (Doomsday).** No principle satisfying all desiderata uncontroversially exists; the Backup Clerk highlights the instability around reference class definition as a critical friction point. SSA and SIA each satisfy distinct subsets but fail others fundamentally, illustrating the trade-offs. The choice involves prioritizing which aspects of indexical evidence feel most inescapable or operationally critical for your agency.
