  Hmm, their analogy to perpetual motion machines in physics is telling—they're viewing the money pump through a conservation law lens. That's a sharp insight. Their frustration with pop books glossing over temporal aspects resonates; most introductory material does treat the pump as a static preference cycle without addressing how agents evolve during the sequence. 

  Breaking down their explicit questions: First, they want the exact assumptions about cross-temporal behavior. The nephew's "each step looks good" rebuttal didn't satisfy them, and rightly so—it dodges the central issue of whether refusal is possible at decision nodes. Second, they're probing whether acyclicity is the real requirement or if diachronic consistency (stable preferences over time) is distinct from simple transitivity. Third, they're spotting conflation in the literature between intransitivity, independence axiom violations, and time-inconsistency—all three get the "money pump" label despite different mechanisms. 

  Their underlying concern seems to be: "Is cyclic preference truly irrational if you can strategically avoid exploitation?" That's deeper than most hobbyists would catch. Their thermodynamics background shines here; they're treating rationality like a path function where the process matters, not just the state. 

  For part (1), I'll need to specify that the classic pump assumes myopic evaluation (no foresight), no commitment mechanisms, and repeated exposure to the same cycle. The user's "habit of grabbing locally attractive trades" hits the nail on the head—it's about myopia plus cyclic prefs. 

  For part (2), I should distinguish synchronic rationality (preferences at t=0) from diachronic (coherence across time). Transitivity is synchronic; avoiding money pumps requires both that plus non-myopia or commitment. This aligns with their suspicion that "acyclicity isn't enough." 

  Part (3) is messy because—they're absolutely right—the literature is sloppy. I'll clarify that standard pumps target intransitivity, while "independence pumps" exploit violations of linearity in probabilities, and "discounting pumps" leverage hyperbolic time preferences. Each has different implications. 

  Finally, the folk version ("cyclic prefs = free money") needs demoting. As the user suspects, it's overstated without caveats about behavioral assumptions. I'll emphasize that cyclic preferences create vulnerability, not guaranteed exploitation. 

  Their request for tables/worked examples is perfect—I'll structure it like a thermodynamics paper with clear phases: Preference Setup, Pump Mechanics, and Agent Assumptions. The table should contrast synchronic vs. diachronic requirements and the three pump types. 

