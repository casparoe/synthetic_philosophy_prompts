  Meanwhile, Dennett's pragmatism (4) feels like their attempted bridge: if we *need* responsibility practices functionally, maybe Pereboom's "basic desert" concern becomes academic? But that risks dodging the core metaphysical worry. The other pairs (like 1-2 or 4-5) hold together neatly under standard compatibilism, though 3-5 directly clash—Pereboom would reject holding the willing addict responsible. 

  Prioritization is key. The manipulation/determinism equivalence (3 vs 1-2) must top the list—it undermines their whole framework. Then 3 vs 5, since the addict case crystallizes that conflict. Dennett (4) softens the blow but doesn't resolve it. The rest are stable compatibilist linkages. 

  Notably, they haven't mentioned Strawson's reactive attitudes—that might offer a middle path between Dennett's pragmatism and Pereboom, but they'd likely have cited it if appealing to that. Their silence suggests a deliberate avoidance of that escape hatch. 

