  First, I need to unpack what the practice presupposes. The 1% rule assumes that probabilities can be treated as precise enough for binary decisions. It leans toward frequentist interpretations—that there's a real, measurable probability out there. But the user's right that this ignores model disagreement and non-stationarity. The practice also treats uncertainty as reducible (through better data/models) rather than irreducible ambiguity.

  What's interesting is how regulators acknowledge uncertainty elsewhere while enforcing sharp thresholds. That suggests the number functions more as a legal bright line than a scientific fact. It's a social agreement disguised as measurement. The user's "precautionary threshold dressed as measurement" insight is sharp—the 0.99% vs 1.01% injustice highlights this.

  For alternatives: Interval-valued probabilities (like 0.8%-1.2%) would be more honest scientifically but wreak havoc on zoning/insurance systems built on binaries. You'd need tiered regulations or "uncertainty surcharges," which might be fairer but politically messy. The user's hint at upper-bound triggers (e.g., regulating any parcel above 0.8%) is a solid middle ground—more precautionary while preserving some clarity.

