prompt: |-
  Before I get into any more arguments about duty-to-rescue laws or how much charity is required, I want the spec for the underlying concept. Write the desiderata a theory of supererogation has to meet to count as adequate -- the asymmetry it has to capture (doing the act is permissible, skipping it is also permissible, yet doing it merits praise while skipping merits no blame), the cases it has to get right, the distinctions it can't collapse (supererogation vs imperfect duty, the act being good vs the sacrifice being what makes it above and beyond, praise for doing vs blame for omitting), with the case or motivation behind each requirement. Make sure the weird ones are on the list: suberogation (bad-but-not-wrong acts like pointedly not returning a greeting), the person who takes a miserable high-paying job to give the money away (is the suffering part of the merit or a red herring?), tiny-probability-of-death rescues, and iterated cases where someone does a small supererogatory thing daily until it becomes the expected baseline. Also whether legal systems with a general duty to rescue have simply denied that easy rescues are supererogatory, and whether the theory has to be neutral between consequentialist and non-consequentialist foundations or can only live inside one. Flag which desiderata are genuinely load-bearing versus camp prejudices, and flag any subset you suspect can't be jointly satisfied -- I have a hunch the praise-without-blame asymmetry and "praise tracks exceeding what's required" pull against each other. Purpose to fix adequacy on: good enough to settle concrete arguments about required aid. No scorecard of existing theories, just the criteria, though tell me which single requirement knocks out the most contenders. Keep it tight-ish, a list is fine.
reasoning: |-
  Okay, the user is diving deep into supererogation theory and wants a clear set of criteria to evaluate any theory. They're clearly frustrated with endless debates about duty-to-rescue laws and charity obligations. This feels like someone who's been burned by philosophical circular arguments before and wants concrete grounding.  

  Hmm, their request is unusually precise—they want desiderata covering asymmetry, edge cases (like suberogation and miserable altruists), and meta-questions about legal systems/consequentialism. They’re also flagging potential tensions (praise-without-blame vs. praise-for-exceeding-duty). This isn’t a beginner; they’ve encountered the literature and its pain points.  

  Key angles to hit:  
  - **Asymmetry Core**: Must explain why donating a kidney is praiseworthy but not blameworthy to skip, without collapsing into "it’s just nice."  
  - **Edge Cases**: Suberogation (their "pointedly not returning a greeting" example) is crucial—theories often ignore permissible nastiness. Also, the miserable philanthropist tests whether suffering is necessary for merit.  
  - **Legal Systems**: Need to address whether easy rescues stop being supererogatory if legally required (spoiler: most theories say yes—it becomes duty).  
  - **Foundation Wars**: Should clarify if a theory can be meta-ethical-neutral or must pick consequentialist/deontological sides.  

  Biggest landmine: Their hunch about tension between "praise without blame" and "praise for exceeding requirements." If praise tracks exceeding requirements, why isn’t skipping blameworthy? This might require separating *blame* (forbidden) from *disappointment* (permissible but suboptimal).  

  The "iterated supererogation" case (daily acts becoming baseline) is sneaky—it exposes how social expectations can erode supererogatoriness. A good theory must explain why the *first* coffee-buyer is saintly but the 100th is just "meh."  

  Single requirement that kills most theories? Probably **No Collapse into Duty or Indifference**. Many utilitarian-ish theories struggle because if an act maximizes good, *not* doing it seems blameworthy. Kantian-leaning ones might overstretch "imperfect duty."  

  Final note: User wants this to *settle arguments*. So desiderata must be action-guiding, not just academic. Better flag which criteria are substantive (load-bearing) vs. aesthetic (camp prejudices).
answer: |-
  Here are the core desiderata for an adequate theory of supererogation, designed to settle concrete arguments about required aid. Key tensions and edge cases are flagged.

  **Core Desiderata (Load-Bearing):**

  1.  **The Central Asymmetry:** Must capture why:
      *   **Doing Act (A) is Permissible:** Choosing the supererogatory act isn't forbidden or wrong.
      *   **Omitting Act (A) is Permissible:** Choosing *not* to do A isn't forbidden or wrong (no blame/culpability).
      *   **Doing Act (A) is Especially Praiseworthy:** Performing A merits positive moral praise/esteem (beyond mere permissibility).
      *   **Omitting Act (A) Lacks Positive Merit (but isn't blameworthy):** Not doing A doesn't merit praise, but crucially, it *also doesn't merit blame*. It might merit disappointment or regret, but not condemnation.
      *   *Motivation:* This is the defining puzzle of supererogation (e.g., jumping on grenade vs. not). Failure here collapses supererogation into either duty (omission blameworthy) or mere permission (doing merits no special praise).

  2.  **Distinction from Imperfect Duty:**
      *   Must distinguish supererogatory acts (optional, single-instance praise) from imperfect duties (required over time, blame for *total* neglect, but latitude in *how* and *when* fulfilled).
      *   *Case:* Giving *some* significant charity is an imperfect duty (blameworthy if you *never* give). Giving *all* your wealth to charity is supererogatory (praiseworthy if done, not blameworthy to omit). Failure collapses categories.

  3.  **Distinction from Simple Goodness/Indifference:**
      *   Must explain why supererogatory acts merit *praise* for being done, while merely permissible neutral acts (like eating lunch) do not.
      *   *Case:* Donating a kidney vs. eating a sandwich. Both permissible, but only donation merits praise. Failure makes supererogation indistinguishable from any permissible act.

  4.  **Sacrifice/Special Effort as Key (Usually):**
      *   Must explain why praise is primarily tied to the *sacrifice, cost, risk, or special effort* undertaken by the agent, not just the objective goodness of the outcome. The act is good *because* of the intended outcome, but it's supererogatory *because* of the cost borne.
      *   *Case:* **The Miserable Philanthropist:** Takes a soul-crushing job *solely* to donate the income. The *suffering is central to the merit* – taking the same job for selfish reasons wouldn't be supererogatory. A theory where only outcome matters struggles here. *Tension:* Sacrifice focus risks undervaluing easy acts for huge good.

  5.  **Accommodate Small-Scale Supererogation:**
      *   Must allow for minor acts requiring small sacrifices to be supererogatory (not just heroic rescues).
      *   *Case:* Giving up your bus seat for an elderly person (minor inconvenience, praiseworthy, not blameworthy to keep). Failure limits scope unrealistically.

  6.  **Accommodate Risk-Based Supererogation:**
      *   Must handle cases where the primary cost is risk, not guaranteed sacrifice.
      *   *Case:* **Tiny-Probability-of-Death Rescue:** Running into a slightly unstable building (1% chance of collapse) to save a child. Permissible to omit? Praiseworthy to do? *Motivation:* Tests whether risk itself constitutes a relevant cost/sacrifice.

  **Critical Edge Cases & Complexities:**

  7.  **Suberogation (Permissible Badness):**
      *   Must account for acts that are morally "bad" (unkind, rude, stingy) but *not wrong* (not forbidden, no blame incurred).
      *   *Case:* **Pointedly Ignoring a Greeting:** Rude, permissible, not blameworthy (legally or morally), but the opposite of praiseworthy. *Motivation:* Tests symmetry/asymmetry and the range of the permissibility/praise/blame concepts. Failure risks implying all permissible acts are either neutral or good/supererogatory.

  8.  **Iterated Supererogation & Shifting Baselines:**
      *   Must explain what happens when repeated supererogatory acts by an individual or group become socially expected.
      *   *Case:* Someone buys coffee daily for a struggling colleague. Initially supererogatory. After months, it's expected; *not* doing it feels like a slight (suberogatory?), but is it now a *duty*? Can baseline expectations change the moral status? *Motivation:* Tests the stability and context-dependence of supererogatoriness. Failure risks rigidity.

  9.  **Legal Duty-to-Rescue & Supererogation:**
      *   Must clarify the relationship: Do such laws *reclassify* easy rescues as duties (thus no longer supererogatory), or do they exist alongside a moral category of supererogation for harder acts?
      *   *Requirement:* The theory must be compatible with the observation that legal systems imposing a duty to rescue typically focus on *easy/low-cost* rescues, implying that *more demanding* rescues might remain supererogatory. Failure here leads to confusion in law/ethics debates.

  **Meta-Theoretical Constraints:**

  10. **Foundation Neutrality (Ideally) vs. Commitment:**
      *   *Desideratum:* The core account of the asymmetry, praise, permissibility, and sacrifice should ideally be formulable within both consequentialist (maximizing good) and non-consequentialist (e.g., deontological, virtue-based) frameworks. *However*, it's plausible that a fully satisfying account *requires* commitment to one type of foundation (e.g., agent-relative permissions, virtue concepts). *Flag:* Neutrality is a strong preference but may be impossible; the theory should be explicit.

  **Tensions & Suspected Incompatibilities:**

  *   **Praise-Without-Blame vs. Praise-for-Exceeding-Requirement:** *(User's Hunch)* This is the core tension. If praise is *earned* by exceeding a requirement/expectation, why isn't *failing* to exceed that requirement (merely meeting it) grounds for *some* negative evaluation (disappointment, mild blame)? A robust theory must explain why the negative evaluation for omission is *strictly limited* to the absence of praise/lack of positive merit and *never* escalates to blameworthiness, even when the "requirement" (baseline duty) is clearly exceeded by the supererogatory act. *This is the hardest nut to crack and likely knocks out the most contenders*, especially pure maximizing consequentialism (if exceeding is possible, not doing so seems sub-optimal/blameworthy) and some rigid deontological schemes.

  *   **Sacrifice Focus vs. Outcome Focus:** Emphasizing sacrifice risks undervaluing easy acts for huge good (e.g., clicking a button to save a life). Emphasizing outcome risks collapsing supererogation into demanding utilitarianism (where *not* doing the best act is blameworthy).

  **Camp Prejudices (Less Load-Bearing):**

  *   **Heroism vs. Mundane:** Whether heroic acts are the *paradigm* or just one instance (more a focus of examples than a core requirement).
  *   **Motivational Purity:** How much emphasis is placed on the *motive* (e.g., altruism) vs. the act/sacrifice itself. Most agree motive affects *degree* of praise, but the core status hinges on the act's nature and cost.
  *   **Strictly "Above and Beyond":** Insistence that supererogation *must* exceed some clearly defined minimal duty. While intuitive, this is challenged by iterated cases and theories focusing more on agent-relative costs.

  **Purpose:** A theory satisfying these desiderata provides a robust framework to analyze specific cases (e.g., "Is donating 10% of my income required, imperfectly dutiful, or supererogatory?", "Can failing to make a low-risk rescue ever be permissible without blame?", "Does legally requiring easy aid make moderate aid supererogatory?") by clarifying the necessary conditions for praise, permissibility, and blame.
