  I'm a software engineer with no formal training in philosophy or game theory — the closest I came was a linear algebra course fifteen years ago — and I've ended up responsible for a forty-five-minute lunch session for my team on fair division between two parties. The background: our group and another team jointly ship features, and every quarter there's a fight over how to split a shared bonus pool; the standing compromise is an ad-hoc "meet in the middle," which everyone hates and nobody can defend. Reading around, I found that bargaining theory has actual proposed answers, and the one I want to teach is the Kalai–Smorodinsky bargaining solution, because it's the one that does something other than split the difference. The catch, as far as I can tell, is that it only becomes interesting when the two parties' maximum conceivable gains differ: if the bargainers' ideal points are equal and the disagreement point is zero for both, it apparently just says "split evenly," which is what everyone in the room will guess anyway — so the whole lesson lives or dies on an example where that symmetry is broken. Please correct me if I've misunderstood that, because I'm working from half-digested sources.

  To be clear about what I'm asking for: not the explanation itself, but a plan for delivering it. The audience is twelve engineers — comfortable with algebra and reading graphs off a whiteboard, no game theory; one or two will half-remember "Nash equilibrium" from a podcast and will conflate it with everything else, and none will have heard of this solution. I'd like the dependency order of the components (my guess is the disagreement point has to be established before the feasible set, and the ideal point before anything about ratios — but tell me if that's wrong and why); the one carrying example, spelled out as a concrete scenario, with an account of what it must contain (the asymmetry, above all) and what it must avoid; and the misconceptions I should expect, in the order the audience will actually raise them, each with the point in the sequence where I should defuse it. The ones I predict: that this is somehow about Nash equilibrium; that the disagreement point is zero by default rather than something to be argued about; that the two parties' utilities are directly comparable, so "equal fractions of the ideal" is a straightforward calculation; and that the whole thing is split-the-difference in fancy dress. Then a closing question whose answer would show they've grasped the distinctive idea — my candidate is something like "your best possible outcome just improved; can the solution leave you worse off than before?" — together with what a good answer to it sounds like.

