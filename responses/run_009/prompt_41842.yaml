  ### **Delivery Tips**
  - **Whiteboard**: Graph `S` (x-axis: Team A utility, y-axis: Team B). Plot `d`, `a`, and the KSBS ray.  
  - **Pacing**: Spend 50% on concepts (Steps 1–3), 30% on example, 20% on Q&A.  
  - **Hook**: Start with "Why does splitting the middle feel unfair? Because it ignores what each party could maximally get."  
  - **Close**: "KSBS doesn’t end debates—but it forces them to be about the right things: fallbacks, possibilities, and fairness as proportional gain."
