answer: |-
  ### Plan for the Kalai–Smorodinsky Bargaining Solution Session

  #### **Core Objective**
  Teach the Kalai–Smorodinsky solution (KSBS) as a fair-division tool for asymmetric scenarios, emphasizing its non-split-the-difference logic. Focus on intuition, graphical representation, and concrete example.

  ---

  ### **Dependency Order of Concepts**
  1. **Disagreement Point (d)**  
     - *Why first?* Establishes the "no deal" baseline. Without it, gains cannot be defined.  
     - *Placement:* Start here to anchor the stakes of negotiation. Use real-world analogies (e.g., "If talks fail, Team A gets $0, Team B gets $0").

  2. **Feasible Set (S)**  
     - *Why second?* Defines what’s possible if parties agree. Requires `d` to ensure allocations beat the fallback.  
     - *Placement:* After `d` to show the bargaining "playing field." Visualize as a graph (utility space).

  3. **Ideal Point (a₁, a₂)**  
     - *Why third?* Computed *from* `S` and `d` (e.g., "Best outcome for Team A if Team B gets only `d₂`").  
     - *Placement:* After `S` and `d` to highlight asymmetry. Critical for KSBS’s unique split.

  4. **KSBS Calculation**  
     - *Why last?* Relies on `d`, `S`, and `a₁, a₂` to define the solution:  
       `(u₁ - d₁)/(a₁ - d₁) = (u₂ - d₂)/(a₂ - d₂)`  
     - *Placement:* Culminates the flow. Show graphically (ray from `d` through `a`, intersecting Pareto frontier).

  ---

  ### **Carrying Example**
  - **Scenario**:  
    Two teams split a $100 bonus.  
    - **Constraints**:  
      - Team A must get ≥$20 (e.g., company policy).  
      - Team B must get ≥$30 (e.g., contractual obligation).  
    - **Disagreement point**: $(d_A, d_B) = (0, 0)$ (no deal = $0 for both).  
    - **Feasible set**: $\{(u_A, u_B) \mid u_A + u_B \leq 100,\ u_A \geq 20,\ u_B \geq 30\}$.  
    - **Ideal points**:  
      - $a_A = 70$ (Team A’s max when $u_B = 30$).  
      - $a_B = 80$ (Team B’s max when $u_A = 20$).  
    - **KSBS**: Solves $(u_A - 0)/(70 - 0) = (u_B - 0)/(80 - 0)$ with $u_A + u_B = 100$.  
      → $u_A ≈ 46.67$, $u_B ≈ 53.33$.  

  - **Asymmetry that makes it work**:  
    Ideals differ ($a_A = 70 \neq a_B = 80$) due to asymmetric minimum constraints. This forces a non-50/50 split.  

  - **Must avoid**:  
    Symmetric examples (e.g., identical ideals/constraints), zero minimum constraints, or comparable utilities (e.g., "Team A values money more").

  ---

  ### **Misconceptions and Defusal**
  1. **"This is about Nash equilibrium"**  
     - *Stage to defuse:* During **KSBS Calculation** (Step 4).  
     - *The move:* "Nash equilibrium is for non-cooperative games; this is cooperative bargaining. KSBS is unrelated."  

  2. **"Disagreement point is zero by default"**  
     - *Stage to defuse:* When introducing **Disagreement Point** (Step 1).  
     - *The move:* "It’s context-dependent. If teams walk away with $10K from other projects, `d = (10, 10)`, not zero."  

  3. **"Utilities are directly comparable"**  
     - *Stage to defuse:* During **Ideal Point** (Step 3) or **KSBS Calculation** (Step 4).  
     - *The move:* "We’re not comparing Team A’s $1 to Team B’s $1. We’re comparing *fractions* of their *own* ideal gains."  

  4. **"This is split-the-difference in disguise"**  
     - *Stage to defuse:* After presenting **KSBS Calculation** (Step 4).  
     - *The move:* "In symmetric cases, yes. But here, ideals differ (70 vs 80), so Team B gets more (53.33 > 50)."  

  ---

  ### **Check Question**
  - **Question**:  
    *"Team B’s ideal outcome improves (e.g., their max possible gain rises), but nothing else changes. Can the KSBS leave Team A worse off than before?"*  
  - **Answer that shows it landed**:  
    "Yes! If Team B’s potential (`a_B`) increases, the KSBS may shrink Team A’s share to keep gains proportional. Example: If Team B’s min constraint drops to $20$, their ideal becomes $80$ (same as before), but Team A’s ideal jumps to $80$. KSBS then gives $50/50$ → Team A gets more ($50 > 46.67$), Team B less ($50 < 53.33$)."  

  ---

  ### **Settled vs. Contested**
  - **Settled** (Mathematical Facts):  
    - KSBS computation (formula, graphical solution).  
    - Monotonicity axiom (if the feasible set expands favorably for you, you don’t lose).  
    - Dependence on `d`, `S`, and `a₁, a₂`.  
  - **Contested** (Philosophical Debates):  
    - Whether KSBS is "fair" (vs. Nash, egalitarian, etc.).  
    - Whether comparing fractions of ideal gains (e.g., $u_A/a_A$) assumes interpersonal utility comparisons.  
    - Cardinal utility’s realism (can we quantify "happiness" from money?).  

  ---

  ### **What to Leave Out**  
  - **Axiomatic proofs**: Too abstract; distracts from intuition.  
  - **Utility theory foundations**: Cardinal vs. ordinal, interpersonal comparison.  
  - **>2 parties**: KSBS extends, but complexity dilutes the core lesson.  
  - **Other solutions (Nash, Egalitarian)**: Mention names, but don’t contrast; avoid confusion.  

