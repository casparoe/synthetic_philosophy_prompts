prompt: |-
  I'm trying to wrap my head around the Born rule problem in Everettian QM before I read anything else on it, and I want to build the requirements list first. You're a philosopher of physics who's agnostic between camps, so write me the desiderata that any derivation of the Born rule from the many-worlds formalism has to satisfy. Think of things like: it can't just assume a measure of probability up front (that would be circular), it has to say something about what probability even means when every outcome happens somewhere, it should work for agents who know all branches exist so ordinary conditioning on 'the electron will be found here' doesn't obviously make sense, and it shouldn't lean on branch counting since the number of branches isn't well-defined. For each requirement give the case behind it, mark which ones you'd treat as non-negotiable and which are actually just prejudices of one camp (e.g. decision-theoretic derivations demanding certain rationality axioms, or anthropic/self-locating-uncertainty approaches demanding that agents can be uncertain about which branch they're in), and tell me if any subset of the requirements is jointly unsatisfiable. Please brainstorm a bit before writing, and throughout, keep clear about what's settled among people who actually know this literature versus what's genuinely contested — don't hand me a contested derivation as the consensus answer. A quick scorecard of the Deutsch-Wallace decision-theoretic route, the self-locating uncertainty route, and branch-counting against the list would help but keep it brief, the criteria are the part I care about. Also fwiw don't assume I know measure theory, explain any bit of math you need in passing.
reasoning: |-
  Okay, the user is diving into the Born rule problem in Everettian quantum mechanics and wants a clear set of requirements for any derivation. Let me start by recalling the core issue: in many-worlds, all outcomes happen, so probability isn't straightforward. The user wants desiderata that a derivation must meet, avoiding circularity and branch counting.

  First, I need to list non-negotiable criteria. Probability Meaning is crucial because if every branch exists, what does probability mean? Can't just say "chance" without explaining. Non-Circularity is key too—can't assume the Born rule or measures upfront. Branch Counting Avoidance is non-negotiable since branches aren't countable in Hilbert space.

  Then there are the negotiable points. Agent Uncertainty might be contested; some think agents know all branches, others argue for self-locating uncertainty. Normative vs Descriptive splits opinions—should probability guide decisions or describe frequencies? Operational Significance is important but approaches vary. Subjective vs Objective Probability is also debated.

  Now, checking existing approaches. Deutsch-Wallace uses decision theory but assumes rationality axioms. Self-locating uncertainty relies on agents being uncertain about their branch, which not everyone accepts. Branch counting is invalid because branches aren't discrete. Each has strengths but also gaps against the criteria.

  The user might be looking to evaluate derivations themselves, so clarity on what's settled vs contested is vital. They probably want to avoid getting lost in technicalities without understanding the philosophical stakes. Highlighting where each approach falls short on the desiderata helps them compare. Also, noting joint unsatisfiability, like if requiring both no self-locating uncertainty and probability meaning without decision theory might clash. Need to ensure explanations are accessible without measure theory, using analogies or simple math where needed.
answer: |-
  Here's a breakdown of the desiderata for deriving the Born rule within Everettian Quantum Mechanics (EQM), structured as you requested. I'll differentiate non-negotiable principles from contested assumptions, clarify the consensus vs. debate, and provide a quick scorecard. This reflects the core philosophical challenges recognized in the literature.

  **Core Non-Negotiable Desiderata (Widely Agreed Upon):**

  1.  **Probability Meaning (Non-Circular Interpretation):**
      *   **What it Requires:** Must define what "probability" *means* in a fundamentally deterministic theory where every possible outcome *actually occurs* in some branch. It cannot simply assume a probability measure exists or that the squared amplitude *is* the probability without explaining why that specific measure has this special status.
      *   **Why Non-Negotiable:** This is the heart of the problem. EQM dissolves the "chance" or "unique actual outcome" that probability usually describes. Any derivation must provide a new, coherent account of what "I assign probability X to outcome Y" signifies when both Y and not-Y will definitely happen.
      *   **Settled?** The *problem* is settled as central. The *solution* (what probability means) is the core contest.

  2.  **Non-Circularity (No Implicit Born Rule):**
      *   **What it Requires:** Must *derive* the squared amplitude as the probability weight. It cannot assume the validity of the Born rule or any equivalent probabilistic measure at the start, nor can it rely on concepts (like typicality defined by amplitude) that implicitly presuppose the Born rule's weighting.
      *   **Why Non-Negotiable:** Assuming the Born rule to derive it is blatantly circular. The derivation must start from the core elements of unitary quantum mechanics (the wave function, Hilbert space structure, Schrödinger evolution) and possibly auxiliary principles *about* agents or reasoning within that universe.
      *   **Settled?** Non-controversial. Everyone agrees circularity must be avoided.

  3.  **Branch-Counting Avoidance:**
      *   **What it Requires:** Must not rely on counting branches and assigning equal probability to each. Derivation must work even though the "number" of branches corresponding to a specific outcome is not well-defined (branches aren't discrete, fundamental objects; they continuously split and merge).
      *   **Why Non-Negotiable:** Hilbert space structure shows that branches aren't countable "things" with equal weight. Assigning equal probability to coarse-grained macro-branches (e.g., "spin up" vs "spin down") would often contradict the Born rule (e.g., in unequal amplitude superpositions). The measure over branches must come from the wave function itself (amplitudes).
      *   **Settled?** Non-controversial. Branch counting is universally rejected as invalid in EQM.

  4.  **Operational Significance:**
      *   **What it Requires:** Must explain why agents *within* EQM, who know the theory is true and that all outcomes occur, would *use* the squared amplitude as their subjective degree of belief to guide bets, decisions, and expectations about their *future subjective experiences* ("which branch will *I* find myself in?").
      *   **Why Non-Negotiable:** Probability is useless if it doesn't connect to how agents behave and what they expect to experience. The derivation must show how the Born rule probabilities naturally arise as the rational degrees of belief for agents embedded in the branching universe described by EQM.
      *   **Settled?** The *need* for operational significance is agreed upon. *How* to achieve it is contested.

  **Contested/Approach-Dependent Desiderata (Representing Different Camps):**

  5.  **Agent Uncertainty (Self-Locating Uncertainty - SLU):**
      *   **What it Requires:** Must ground probability in some form of *ignorance* or *uncertainty* experienced by the agent *after* the branching event but *before* they observe the outcome. Specifically, uncertainty about "which branch am *I* in?" even though they know all branches exist.
      *   **The Case For:** Seems necessary to make sense of "probability of seeing X" pre-measurement. If you know all happen but don't know *which one you experience*, uncertainty is natural. Connects to broader philosophy of self-locating belief.
      *   **The Case Against (Contested):** Critics argue that "I" am present on *every* branch. Before observation, there is no single "I" who is uncertain; there are multiple future copies, each of whom will be certain of their outcome. Probability isn't about *current* uncertainty of a single agent, but about something else (e.g., caring measure, rational betting odds for successors).
      *   **Status:** Highly contested. SLU proponents see it as necessary (possibly falling under Probability Meaning). Opponents see it as importing unjustified classical ignorance concepts into EQM or being incoherent.

  6.  **Normative vs. Descriptive/Objective:**
      *   **Normative Requirement (e.g., Decision Theory):** Must show that *rational* agents, adhering to specific axioms of consistent decision-making (e.g., ordering of preferences, invariance, dominance), are *forced* to use the Born rule to value bets on quantum outcomes.
      *   **Descriptive/Objective Requirement:** Must show that the Born rule probabilities correspond to an *objective feature* of reality (e.g., the fundamental measure over branches, relative frequencies in typical large ensembles) that agents *discover* or *must* use, regardless of their specific rationality axioms.
      *   **Status:** Contested. Decision Theory (DT) approaches favor the normative route, arguing rationality alone suffices. Others seek a more objective grounding in the wave function's structure or emergent statistics, potentially making the DT axioms *consequences* rather than *inputs*. Some argue both are needed.

  7.  **Subjective vs. Objective Probability:**
      *   **What it Implies:** Is the derived probability fundamentally about agent beliefs (subjective) or an objective feature of the branching structure itself?
      *   **Status:** Contested and intertwined with points 5 & 6. DT typically yields subjective probability (rational credence). SLU can lean either way (subjective uncertainty about objective location). Frequentist/typicality approaches aim for objectivity.

  **Potential Incompatibilities:**

  *   **SLU vs. Strict Objectivity:** If probability fundamentally stems from an agent's self-locating uncertainty (SLU), it seems inherently subjective/perspectival. If probability is an objective feature of the branching structure (like a measure), SLU might be seen as unnecessary or emergent. Reconciling a strong objective measure *with* a compelling story for agent uncertainty is a challenge.
  *   **Pure Wave Function vs. Strong Normativity:** Deriving probability *solely* from the wave function dynamics without any auxiliary principles about agents or rationality seems incredibly difficult (some argue impossible). Conversely, relying *only* on decision-theoretic axioms risks feeling disconnected from the physics if those axioms aren't themselves strongly motivated by the EQM context.

  **Quick Scorecard of Major Approaches:**

  1.  **Deutsch-Wallace Decision Theory (DT):**
      *   **Probability Meaning:** Rational betting preferences / credence for future experience.
      *   **Non-Circularity:** Derives Born rule from unitary QM + decision-theoretic axioms (non-probabilistic).
      *   **Branch-Counting:** Avoids it; uses amplitude structure via the axioms.
      *   **Operational Significance:** Strong; directly shows how rational agents use Born probabilities.
      *   **Agent Uncertainty (SLU):** Implicitly relies on it (agents care about future experiences on unknown branches).
      *   **Normative/Descriptive:** Strongly Normative.
      *   **Contested Points:** Are the decision-theoretic axioms (especially "measurement neutrality") *compelling* or *ad hoc* within EQM? Does it truly solve the meaning problem or just shift it to rational action? Critics question if it fully avoids circularity in interpreting the payoff structures.

  2.  **Self-Locating Uncertainty (SLU) Approaches:**
      *   **Probability Meaning:** Quantified ignorance about location in the multiverse.
      *   **Non-Circularity:** Attempts to derive Born rule from unitary QM + principles of indifference/indifference over SLU.
      *   **Branch-Counting:** Avoids it; uses amplitude to define a measure for indifference.
      *   **Operational Significance:** Strong; uncertainty directly motivates belief/betting behavior.
      *   **Agent Uncertainty (SLU):** Core premise.
      *   **Normative/Descriptive:** Can be either; often aims for objective measure grounding SLU.
      *   **Contested Points:** Is SLU coherent in EQM? ("I" am everywhere). Is the principle of indifference applied to continuous measure spaces justified? Can it avoid circularity in defining the relevant reference class? How is the amplitude measure *uniquely* picked out for SLU?

  3.  **Branch Counting:**
      *   **Probability Meaning:** Frequency over equally likely worlds.
      *   **Non-Circularity:** Fails; just assumes equal probability per branch.
      *   **Branch-Counting:** Core premise (incorrectly applied).
      *   **Operational Significance:** Weak; why would agents bet based on this if amplitudes differ?
      *   **Agent Uncertainty (SLU):** Implies it.
      *   **Normative/Descriptive:** Descriptive (but incorrect).
      *   **Status:** Universally rejected as invalid within EQM. Fails Criteria 2 & 3 decisively.

  **Consensus vs. Contested:**

  *   **Settled:** Criteria 1-4 are essential problems any derivation must address. Branch counting (Criterion 3) is invalid.
  *   **Genuinely Contested:**
      *   Whether SLU (Criterion 5) is coherent and necessary.
      *   Whether a purely objective/descriptive derivation (without DT or SLU) is possible.
      *   Whether DT derivations successfully avoid circularity and provide a satisfying meaning for probability.
      *   The precise relationship between the wave function's structure, agent experience, and rational belief.
      *   Which, if any, of the existing derivations fully succeeds. *There is no consensus "solution".*

  **Key Takeaway:** Deriving the Born rule in EQM requires fundamentally rethinking what probability *is* in a universe where everything happens. Any viable derivation must extract the squared amplitude as the uniquely significant weighting for agent experience and action, directly from the unitary dynamics, without circularity or branch counting. The core debates revolve around whether this requires invoking self-locating uncertainty, decision-theoretic rationality axioms, or finding a new objective basis within the wave function itself. Prepare for a deep dive into philosophy!
