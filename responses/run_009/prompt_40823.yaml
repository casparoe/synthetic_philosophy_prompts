  A colleague in phil of mind -- call her Dana -- has accumulated a running set of verdicts about who understands what, and she's on a panel next month about whether large language models understand, so I'm trying to predict what she'll say. Her verdicts so far: a phrasebook tourist in Naples doesn't understand Italian; her nephew, raised bilingual, understands both languages, obviously; a chess engine that crushes grandmasters by brute-force search with hand-coded evaluation does not understand chess, it just searches; an adult who picked up a language purely by immersion, no explicit teaching, understands it; a parrot that correctly answers "what color" and "what material" about a blue key, and only got the hang of same-versus-different after years of training, understands those words, at least dimly; and she dismisses the Chinese Room as obvious, though I've never actually heard her argue it. The new case: a current LLM trained only on text -- no camera, no body, no feedback other than next-word prediction. What's her verdict, and what's the reasoning? More than the answer, I want the rule she seems to be running. As far as I can tell her track record is fit equally well by a rule about where competence comes from (learning by doing, with correction, versus just absorbing records of other people's competence) and a rule about what competence looks like (narrow lookup or search versus flexible explanation and transfer), and those two come apart on the LLM. Or maybe I'm missing a third rule that fits everything. So: lay out the candidate rules, check each against all her verdicts, give me your best guess with reasons, and tell me what further case would best split the rules -- I suspect something like a robot that learned language through interactive training, but maybe there's a cleaner one.
