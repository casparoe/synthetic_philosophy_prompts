prompt: |-
  So my reading group has spent the last couple of months on population ethics, and our most recent session was on the whole "humanity needs a backup planet" cluster of arguments, and honestly I've run out of patience for earnest essays about it — I want to process this one through mockery instead. The assignment I'd like: a satirical brochure-and-FAQ for a fictional private space colonization venture (name it something blandly corporate, your choice) selling one-way berths on the first permanent Mars settlement. The brochure's headline selling point is the existential insurance argument: Earth is fragile, engineered pandemics or nuclear war or an asteroid could wipe us out, and a self-sustaining colony is the species' backup drive. That's the thing being satirized — the argument and its rhetoric, not spaceflight itself — so the piece should exaggerate features the position actually has rather than inventing dumb ones.

  The jokes need to come from getting the philosophy right, the way the fine print quietly takes positions on the live debates: whether creating the future colonists (from an onboard frozen gene bank, say) actually does anything *for* them — the non-identity problem buried in the reproductive-services clause; whether the marketing department is selling species survival as instrumentally valuable or intrinsically valuable, and what happens to the copy when nobody in the company can decide; the refund policy for the scenario where Earth turns out fine and never needs restoring (the "unused insurance" clause); whether a colony that culturally diverges from Earth over two or three centuries still counts as a *backup* of anything; and a testimonials section where customers disagree on population ethics grounds — one delighted total utilitarian glowing about the trillions of colonists to come, one sour average utilitarian who wants to know why the brochures count future people as a selling point when they don't exist yet. Deadpan throughout, no winking at the reader, roughly 700 words, formatted as numbered clauses or FAQ entries — your call on the mix.

  Last thing, and this matters to me: after the piece itself, append a short note (150-ish words, outside the fiction) flagging which bits exaggerate something pro-colonization writers actually maintain versus which bits lean on a reading that's genuinely contested — for instance, whether the backup argument really needs totalist population ethics to get off the ground or whether that's a caricature some of its defenders would reject. I want to be able to tell which jokes are fair and which are cheap shots, and I don't want the piece smuggling in a contested framing as though everyone in the debate accepted it.
reasoning: |-
  Okay, the user wants a satirical brochure for a fictional Mars colonization venture that mocks the "backup planet" argument. They're clearly well-versed in population ethics based on their detailed specifications about non-identity problems, utilitarian disagreements, and corporate rhetoric. 

  Hmm, interesting challenge - they want the humor to come from accurate philosophical exaggeration, not cheap shots. The deadpan tone requirement suggests they appreciate subtle academic satire. I should avoid anything that feels like a SNL skit. 

  The appendage about flagging contested arguments is crucial - this user cares about intellectual integrity even in parody. They're probably using this to provoke discussion in their reading group. Smart approach to process heavy topics through humor without dumbing them down. 

  Key satire targets: 
  - Corporate packaging of existential risk (bland name like "Continuity Solutions" fits)
  - The reproductive ethics fine print (frozen gene bank + non-identity problem)
  - Unresolved tension in why species survival matters
  - Future people accounting in testimonials
  - The absurdity of "unused insurance" refunds

  For the philosophical appendix, I'll need to clarify where mainstream backup argument proponents actually stand versus where the satire stretches things. Especially on the total utilitarianism point - some like Nick Bostrom do lean that way, others don't. Should note that divergence counts as "backup" is genuinely debated.

  The testimonials section is perfect for showing intra-utilitarian conflicts. Can have one customer gushing about quadrillions of future Martians while another complains it's unethical to create them. Both positions exist in real population ethics literature.

  Formatting as FAQ makes sense - lets me bury the dark humor in bureaucratic language. Section 7(c) about cultural drift being a feature not a bug should sound like a corporate lawyer wrote it. 

  Refund policy (Section 8) is where the existential absurdity peaks. "Deemed to have fulfilled its purpose" while admitting no benefit accrued? That's the kind of line that'll make their reading group groan-laugh while recognizing the real logical knot.
answer: |-
  ## Continuity Solutions: Mars Heritage Vault™ Prospectus & FAQ  
  *(Version 4.7a, Sol Standard Year 2143)*  

  **Headline:** Secure Humanity's Legacy. Become Earth's Ultimate Backup.  

  **1. The Core Continuity Proposition:**  
  Earth faces non-negligible existential threats (asteroid impact probability: 0.0001% per century; anthropogenic catastrophe probability: 1-5% per century, depending on geopolitical modelling). A single-planet species is a fragile data point. The Mars Heritage Vault™ provides robust biological and cultural redundancy – a true *off-world backup* for *Homo sapiens*. Your investment secures the ultimate insurance policy: species persistence.  

  **2. Investment Structure:**  
  Purchase a Founder's Berth (Standard: ฿250,000 SolCred; Deluxe Stateroom: ฿750,000 SolCred). This secures:  
  *   A one-way transit slot aboard the *SS Endurance*.  
  *   Cryogenic storage for your genetic material within the Vault's Core Genome Repository (CGR).  
  *   A fractional share in Vault operational infrastructure (see Clause 17: Non-Transferable, Non-Dividend Bearing).  
  *   The profound satisfaction of securing humanity's future.  

  **3. The Reproductive Services Clause (RSC):**  
  To ensure colony viability and genetic diversity, the CGR is the primary source for Phase II population expansion (commencing approx. M-Year 15). **By purchasing a berth, you irrevocably grant Continuity Solutions:**  
  *   **(a)** Perpetual rights to utilize your stored genetic material for the creation of future colonists.  
  *   **(b)** Waiver of all parental rights, obligations, or claims by any resulting offspring ("Phase II+ Beneficiaries").  
  *   ***(Key Fine Print: Section 3(b)iii):*** "The Phase II+ Beneficiaries, by virtue of their non-existence at the time of contract signing, derive no actionable claim regarding the *manner* or *fact* of their creation from this Agreement. Their existence is contingent upon and intrinsic to the fulfillment of the Core Continuity Proposition."  

  **4. Defining "Continuity":**  
  *   **Instrumental Value:** Our actuarial models demonstrate a high probability that species extinction reduces aggregate future well-being (see Testimonials). Preventing this loss is the Vault's primary function.  
  *   **Intrinsic Value:** Corporate Policy Directive Alpha-Omega states: "The perpetuation of the human species possesses inherent moral worth, irrespective of contingent future experiential states." (Marketing Dept. Note: *Use both. Intrinsic resonates better on holos.*)  

  **5. Vault Integrity & Cultural Drift:**  
  The Mars Heritage Vault™ is engineered for long-term self-sufficiency. Naturally, Martian society will evolve distinct cultural and normative frameworks over centuries. **FAQ: Does this divergence negate the 'backup' function?**  
  *   **Answer:** No. Biological continuity defines the backup. Martian cultural evolution represents a robust *branching* of the human legacy, enhancing overall resilience (Clause 22: "Divergence as Feature, Not Bug"). A restored Earth would benefit from Martian innovations.  

  **6. Testimonials:**  
  *   *A. Patel (Deluxe Stateroom Investor):* "It's simple math! Even a 1% chance of saving *quadrillions* of potential future human lives makes this the highest-impact investment possible. The expected utility is astronomical! Total utilitarianism wins again!"  
  *   *Dr. E. Vance (Standard Berth Investor):* "I'm ensuring *a* future exists. But why does the brochure keep implying those hypothetical quadrillions *gain* something by being created? They don't exist to feel deprived! My satisfaction comes from preserving the *possibility* of value, not conjuring beneficiaries to count. Focus on the insurance analogy, people!"  

  **7. The "Unused Insurance" Scenario:**  
  **FAQ: What happens if Earth remains intact and never requires 'restoring'?**  
  *   **Answer:** Congratulations! Humanity avoided catastrophe. Your investment still secured the Continuity Mandate:  
      *   **(a)** The Vault persists as a thriving branch of humanity (fulfilling Intrinsic Value Directive).  
      *   **(b)** The catastrophic risk was hedged (fulfilling Instrumental Value).  
      *   **(c)** No refunds are issued. The policy was active throughout the risk period. The Core Continuity Proposition – securing a backup – is deemed fulfilled upon successful colony establishment (M-Year 10 Certification).  

  **8. Refund Policy (Section 8 "Act of Sol"):**  
  Refunds are only considered under the following scenarios:  
  *   Pre-launch cancellation (85% fee).  
  *   *SS Endurance* failure pre-Mars orbit (pro-rated estate claim against launch insurance).  
  *   **Explicit Exclusion:** "No claim shall arise from the failure of Earth-originating catastrophe to materialize, or from the divergence or independent flourishing of the Mars Heritage Vault™ colony, as these constitute successful execution of the Core Continuity Proposition."  

  ---

  **Appendix: Satirical Exaggeration & Contested Foundations**  
  *(Non-Fictional Analysis)*  

  1.  **Exaggerated but Rooted in Proponent Arguments:**
      *   **Corporate Packaged "Legacy":** The bland corporatization ("Continuity Solutions," actuarial language) exaggerates how think tanks and ventures frame existential risk mitigation as a calculable investment/product. Proponents *do* use insurance analogies and cost-benefit analyses (e.g., Bostrom, Ord).
      *   **Reproductive Services Clause & Non-Identity:** The fine print directly satirizes the Non-Identity Problem's challenge to "benefiting future people." Proponents often acknowledge this but argue creating a *valuable* future is good *simpliciter* (Parfit, Scheffler), even if specific individuals aren't "harmed" by non-creation. The clause highlights the practical ethical bypass required.
      *   **Instrumental/Intrinsic Tension:** The marketing confusion mirrors a real tension. Many proponents lean heavily on instrumental value (preventing vast future loss). Intrinsic value arguments exist but are less common and more philosophically contested. The satire exaggerates corporate indecision.
      *   **"Unused Insurance" Non-Refund:** This satirizes the core claim: establishing the backup *itself* fulfills the primary moral imperative, regardless of Earth's fate. Proponents argue the value lies in the security/continuity achieved *now*.
      *   **Cultural Divergence as "Feature":** Proponents often downplay or dismiss cultural divergence as irrelevant to biological/evolutionary backup (e.g., Zubrin). The satire pushes this dismissal into corporate-speak.

  2.  **Contested Foundations Exploited for Satire:**
      *   **Requiring Total Utilitarianism:** This is the **core contested point**. The satire (Patel testimonial) implies the backup argument *requires* total utilitarianism (TU) to generate its strongest "astronomical value" claim. **This is a caricature some proponents would reject.** Many defenders use:
          *   **Person-Affecting Views (Moderated):** Arguing we have obligations to *possible* future people who *would* have good lives (not just aggregating non-existent trillions).
          *   **Critical Level Utilitarianism:** Valuing lives above a threshold, avoiding TU's repugnant conclusion, but still valuing large numbers of good lives.
          *   **Non-Consequentialist Duty:** A duty to perpetuate humanity/consciousness, independent of summing utilities.
          *   **Risk Aversion:** Preventing extinction is paramount due to the stakes, even under non-TU frameworks.
      *   **The "Cheap Shot":** Suggesting the *only* or *primary* motivation is TU-style aggregation of quadrillions. While TU provides the biggest numbers, the argument often stands (with varying force) on weaker grounds like risk aversion or a basic duty to continue, which Vance's testimonial hints at. The satire leans heavily on TU because it's the easiest to mock for its scale and potential absurdities (repugnant conclusion), but proponents can (and do) defend the backup argument without full TU commitment.
      *   **"Does it count as a Backup?":** While proponents often dismiss cultural concerns, the question of whether a vastly divergent Martian civilization truly "backs up" *Earth's* cultural or biological essence *is* a genuine philosophical/scientific debate (astrobiology, exo-civilizations) often glossed over in popular "backup" rhetoric. The satire uses corporate doublespeak to highlight this gloss.
