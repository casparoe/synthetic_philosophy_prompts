prompt: |-
  I'm a graduate student trying to work through the White Horse Dialogue (白馬論) from the Gongsun Longzi, attributed to the School of Names logician Gongsun Long (c. 3rd century BCE), and I've gotten stuck. Please take the role of an expert in classical Chinese philosophy and comparative logic, and think the problem through carefully rather than giving me a stock encyclopedia summary. Below are two moments in the dialogue, in a modern English translation. First the Advocate's opening move:

  "Horse" is what designates shape. "White" is what designates color. What designates color is not what designates shape. Therefore I say: a white horse is not a horse.

  Then, after the Objector protests that if you have a white horse you plainly cannot be said to have no horse, the Advocate replies:

  If one seeks a horse, yellow and black horses may all be delivered. If one seeks a white horse, yellow and black horses may not be delivered. Suppose a white horse were [just] a horse. Then what is sought [in the two cases] would be the same. If what is sought were the same, then "white" would not differ from "horse." If what is sought does not differ, how is it that yellow and black horses are acceptable [in one case] and unacceptable [in the other]?

  I can more or less see how the first passage splits the compound term into a shape-designating part and a color-designating part, but I can't see what the "seeking" argument adds beyond that, and I suspect the whole dispute merely turns on the word 非 (fēi) meaning "is not identical to" rather than "is not a member of," which would make the dialogue clever sophistry and nothing more. Explain the passage to me in exactly five numbered points, each a sentence or two, with no introduction or conclusion, covering: what the seeking argument contributes over the shape/color division, whether the equivocation reading is fair to the Advocate, and where any genuine philosophical content about names and what they designate survives the ambiguity.
