prompt: |-
  I'm a postdoc presenting next month to our department's philosophy of physics reading group, which is dominated by two committed Bohmians — one of whom knows Bell's collected papers practically by heart and tends to open every discussion by asking which version of the theorem we're even talking about — plus an Everettian who thinks the entire Bell dialectic presupposes definite single outcomes and therefore never gets off the ground, and a handful of agnostic graduate students who mostly want to know what they're licensed to tell their intro students. My thesis: Bell's theorem does not establish nonlocality, if locality means anything like the absence of superluminal dependence between physically separated events. What the theorem establishes is the failure of the factorizability condition, and the standard decomposition of that condition (the one everyone attributes to Jarrett, with the terminology refined by Shimony) splits it into two logically independent parts: a genuine locality condition — no dependence of the local outcome probabilities on the distant setting — and an independence condition on distant *outcomes* given a complete specification of the past, which I want to argue is not a locality demand at all but a demand about the completeness of the state description. Orthodox quantum mechanics violates only the second, which is why it preserves no-signalling; the kind of nonlocality that would actually threaten relativistic spacetime structure requires violating the first, and that is purchased only by deterministic hidden-variable programs like Bohm's. So the punchline I want to defend is that the popular slogan — Bell's theorem proves the world is nonlocal — is at best a renaming of the incompleteness the EPR argument was already gesturing at, and that Bohmians who celebrate the theorem as vindicating their ontology's nonlocality have the moral backwards: their theory pays the locality price precisely because it insists on the extra completeness that would make the outcome-independence condition hold.

  I can already hear the opening salvos, but I want a proper prep sheet rather than my improvisations. Please give me the objections in roughly the order this particular room will raise them, phrased the way those people would actually phrase them — the Bohmian with the collected papers will presumably press on Bell's own later, sharpened notion of local causality, where factorizability isn't an arbitrary conjunction but the consequence of a genuinely local theory screening off correlations, and will ask whether my decomposition isn't just a verbal trick that trivializes his position; the other Bohmian, I suspect, will point out that her theory's setting-dependence is uncontrollable and fully compatible with no-signalling, so that by my own criterion Bohmian mechanics comes out as local as anyone could wish — a conclusion I emphatically do not want to be stuck defending. Then the Everettian will want to know why outcome independence deserves the status of a "completeness" demand when his own preferred theory denies that either side has a single outcome for the correlations to hold between. For each objection, tell me what to concede up front, what I must hold the line on for the talk to survive, a two-minute reply in the vocabulary of foundations-of-quantum-mechanics rather than of popularizations, and where that reply is genuinely soft. Finally, tell me the question I'm hoping nobody asks — the one where my own position is at its weakest and I'd rather prepare an honest answer than discover the weakness live. I can supply more detail on any part of the argument if it would sharpen the prep sheet, including the part about Dr. Bertlmann's socks and why I think the screening-off intuition cuts my way rather than Bell's.
reasoning: |-
  Okay, the user is a postdoc preparing for a tough philosophy of physics presentation. They're facing a room of experts: two Bohmians (one a Bell specialist, another focused on signaling), an Everettian, and grad students. Their thesis is bold: Bell's theorem doesn't prove nonlocality as commonly understood, but rather highlights the failure of factorizability due to violations of outcome independence—which they argue is about completeness, not locality.

  First, I need to unpack their core argument. They see factorizability (λ-independence + outcome independence) as a joint condition. Orthodox QM violates only outcome independence but maintains no-signaling (locality in the causal sense), while Bohmian mechanics violates both by requiring deterministic completeness, thus introducing nonlocality. Their punchline: Bohmians pay the nonlocality price for their completeness ambition, turning the standard narrative upside down.

  The user anticipates three main objections:  
  1. **Bell Purist Bohmian:** Will attack via Bell's later "local causality" concept, arguing factorizability isn't arbitrary but necessary for screening off.  
  2. **Signaling-Conscious Bohmian:** Will claim Bohmian mechanics is local by no-signaling standards, forcing the user into defending Bohmian locality—which they reject.  
  3. **Everettian:** Will challenge why outcome independence matters when MWI denies definite outcomes altogether.  

  For each, I need to identify:  
  - **Concessions:** Where the user must agree to avoid losing credibility.  
  - **Hold-the-Line:** Non-negotiable points for their thesis.  
  - **2-Minute Reply:** Tight foundational arguments admitting soft spots.  

  The nightmare question is likely about *operational vs. ontological locality*—if no-signaling suffices for locality, Bohmians win; if not, the user must define "locality" without circularity.  

  Deeper needs: The user isn’t just prepping for objections—they’re trying to reframe a decades-old narrative. Their real anxiety is being seen as defending Bohmian locality or offering mere semantics. They need steelman rebuttals that force critics to engage their completeness-centric view.  

  Dr. Bertlmann’s socks point is crucial: Bell’s analogy assumes socks have predetermined colors (completeness), but QM’s violation is due to *incompleteness*, not causal dependence. This supports shifting focus from spacetime constraints to description exhaustiveness.  

  For the Bell Purist: Concede that "local causality" is Bell’s intended concept but insist that its *necessity* for factorizability relies on completeness assumptions. Hold the line that without completeness, screening off can fail innocently.  

  For the Signaling Bohmian: Concede no-signaling holds but argue that parameter dependence (settings affecting distant outcomes) is ontologically nonlocal even if operationally hidden. This is the thinnest ice—needs careful distinction between controllability and causal structure.  

  For the Everettian: Agree MWI dodges Bell by denying outcomes but argue that outcome independence remains a completeness test *for single-outcome theories*. MWI’s avoidance actually proves their point: Bell pressures only completions.  

  The nightmare question—"What does locality mean if not no-signaling?"—requires brutal honesty: Operational locality is necessary but insufficient; ontological locality demands no superluminal *dependencies*. But defining that without completeness is tricky. Admit this is the frontier.  

  Final prep: Arm them with Bell’s 1981 quote ("It is notable that in this argument nothing is said about determinism") to show outcome independence ≠ determinism, and Goldstein’s "Quantum Philosophy" paper for Bohmian self-awareness about paying the nonlocality price for completeness.  

  They’re walking a tightrope, but their framing is philosophically fresh. If they survive the nightmare question, they’ll own the room.
answer: |-
  Here’s your prep sheet, structured for maximum battlefield utility. I’ve ordered objections by likely sequence, tailored to your audience’s personalities, with concessions/hold-lines/replies per your specs. The nightmare question is at the end. (Key: **Concede** = tactical retreat; **Hold** = non-negotiable; **Soft** = vulnerable spot in reply.)

  ---

  ### **Objection 1: The Bell Purist Bohmian**  
  *Phrasing:* "Bell’s mature view (post-1976) defines *local causality* as screening off: given a complete specification of the past light cone (λ), correlations between space-like separated events vanish. Factorizability isn’t a ‘conjunction’—it’s *derived* from relativistic causality. Aren’t you resurrecting Jarrett’s discredited decomposition to trivialize nonlocality?"  

  - **Concede:**  
    Bell’s later formulation is indeed more refined, and λ *should* screen off correlations in a locally causal theory. Jarrett’s decomposition isn’t Bell’s own framework.  
  - **Hold:**  
    Factorizability’s derivation *presupposes* that λ is "complete" (i.e., includes all causally relevant facts). Outcome independence isn’t a locality demand—it’s a demand for sufficient description.  
  - **2-Minute Reply:**  
    "Bell’s local causality requires that λ *fully specifies* all physical properties in the past light cone. But λ’s completeness isn’t guaranteed—it’s a metaphysical commitment. When QM violates factorizability, it violates *only* outcome independence (OI): P(A|B,λ,b) ≠ P(A|λ,b). This is *not* a failure of screening off by causes (locality), but of statistical independence between outcomes given λ. Orthodox QM’s λ (the wave function) is incomplete by EPR standards, so OI failure reflects *descriptive inadequacy*, not causal dependence. Bell’s socks analogy assumes predetermined values—a completeness claim Bohmians build in. But if λ is incomplete, OI violation is innocuous."  
  - **Soft:**  
    Bell *did* view λ-completeness as implicit in "local causality." Your reply leans on the *EPR* incompleteness argument, which Bohmians reject.  

  ---

  ### **Objection 2: The Signaling-Conscious Bohmian**  
  *Phrasing:* "Bohmian mechanics *is* no-signaling—you can’t use the distant setting to send information. By your own definition (no superluminal dependence), it’s local! Your ‘parameter dependence’ is hidden by the quantum equilibrium hypothesis. Why isn’t Bohmian mechanics as ‘local’ as QM?"  

  - **Concede:**  
    Bohmian mechanics respects *operational* no-signaling. Its nonlocality is empirically masked by quantum equilibrium.  
  - **Hold:**  
    "Locality" ≠ *only* no-signaling. Bohmian mechanics has superluminal *causal dependence* (settings instantaneously affect distant outcomes)—it violates *parameter independence* (PI): P(A|a,b,λ) ≠ P(A|a,λ). This *is* a locality failure.  
  - **2-Minute Reply:**  
    "No-signaling is necessary but *not sufficient* for locality in the relativistic sense. Bohmian mechanics violates PI: the *probability distribution* over local outcomes depends on the distant setting *even with fixed λ*. This is superluminal dependence—particles ‘know’ the distant setting. QM violates only OI: P(A|a,b,λ) = P(A|a,λ) (PI holds), so settings don’t influence distant outcomes. Bohmians pay the price: they need superluminal *causes* to enforce correlations *and* maintain completeness. QM avoids this by rejecting completeness."  
  - **Soft:**  
    If locality is defined *only* by no-signaling, Bohm wins. You *must* argue that locality requires *ontological independence* (no superluminal influences), not just operational silence.  

  ---

  ### **Objection 3: The Everettian**  
  *Phrasing:* "Why privilege ‘outcome independence’? In MWI, there are no single outcomes—only correlations in the universal wave function. Bell assumes definite outcomes, so his theorem doesn’t apply. Isn’t your ‘completeness’ demand question-begging?"  

  - **Concede:**  
    MWI evades Bell’s theorem by denying definite outcomes. Bell’s framework presupposes a single-outcome ontology.  
  - **Hold:**  
    Outcome independence (OI) is *still* a test for whether a *single-outcome theory* has a complete state λ. MWI’s evasion proves my point: Bell pressures *completions* of QM.  
  - **2-Minute Reply:**  
    "OI is a condition for theories claiming *both* definite outcomes *and* a complete λ. MWI avoids Bell by rejecting the first. But for *any* theory endorsing definite outcomes (Bohm, GRW, Copenhagen), OI failure implies that λ is incomplete. EPR’s reality criterion demands that elements of reality determine outcomes *independently*—OI formalizes this. MWI’s success here doesn’t refute my thesis; it shows that Bell’s theorem targets theories adding ‘hidden’ variables to *explain* single outcomes. Orthodox QM’s OI violation is thus a signature of its minimalism."  
  - **Soft:**  
    MWI advocates may counter that "completeness" is irrelevant if the wave function is all there is.  

  ---

  ### **The Nightmare Question**  
  *Likely Source:* The Bell Purist or a sharp grad student.  
  *Phrasing:* "If ‘locality’ isn’t defined by no-signaling or screening off, what *is* your positive definition? And if Bohmian mechanics violates it but QM doesn’t, why call QM ‘nonlocal’ in any sense? Aren’t you just redefining terms to favor your thesis?"  

  **Why it’s deadly:**  
  - Forces you to define "locality" without leaning on factorizability.  
  - Risks exposing circularity: You reject Bohmian locality because it violates PI, but PI violation is "nonlocal" only if you assume locality means no superluminal dependence.  

  **Honest Reply (Prepare this verbatim):**  
  > "Locality, in the sense threatened by Bell, is *causal locality*: no superluminal influence between space-like separated events. I define this as:  
  > (1) **Parameter Independence (PI)**: Settings don’t affect distant outcomes (no causal dependence).  
  > (2) **No-signaling**: Operational enforceability of (1).  
  >  
  > Orthodox QM satisfies both—it’s causally local. Bohmian mechanics violates PI (settings *do* affect distant outcomes) but preserves no-signaling via quantum equilibrium. That’s a *weaker*, operational locality.  
  >  
  > Bell’s theorem shows that *any* single-outcome theory satisfying EPR’s completeness must violate PI (like Bohm) or accept indeterminism (like QM). The slogan ‘Bell proves nonlocality’ conflates the PI violation (true nonlocality) with OI violation (merely incompleteness).  
  >  
  > Yes, I’m tightening ‘nonlocality’ to mean PI failure. But this matches Bell’s worry: ‘[a theory] must violate [PI] or [OI], and I would say [PI] is the one we must hold on to’ (Bell, 1981). Bohmians hold on to OI and pay with PI—that’s the nonlocality price for completeness."  

  **Vulnerability:**  
  - Bell never formally endorsed PI/OI as the locus of locality. Your definition is interpretive.  
  - If pressed, cite Bell’s *Theory of Local Beables*: "The direct causes (and effects) of [an event] are near it, and lie in its past light cone." PI violation contradicts this.  

  ---

  ### **Tactical Addenda**
  1. **Dr. Bertlmann’s Socks**:  
     - Bell’s sock analogy assumes predetermined colors (completeness). In QM, "socks" aren’t predetermined, so correlation isn’t puzzling. The "screening off" intuition fails because λ (wave function) doesn’t specify *which* sock color exists—it’s incomplete. Bohmians *add* sock colors, requiring nonlocal stitching.  
     - *Use when:* Bell Purist invokes socks. Reply: "Bell’s socks have definite colors *by assumption*—that’s the completeness claim orthodox QM rejects."  

  2. **Grad Student Hedge**:  
     - Tell intro students: "Bell shows quantum correlations can’t be explained by pre-existing properties *and* local influences. QM keeps locality by not having pre-existing properties; Bohm keeps pre-existing properties but sacrifices locality."  

  3. **Bohmian Counter-Celebration**:  
     - If accused of misrepresenting Bohmians: Concede they *embrace* nonlocality as the cost for realism. Your point is that Bell’s theorem *forces* this trade-off—it doesn’t "prove nonlocality" simpliciter, but proves *realism requires nonlocality*.  

  **Armor Up**: Rehearse the nightmare reply. Your thesis is unorthodox but defensible—if you own the definitions. Good luck.
