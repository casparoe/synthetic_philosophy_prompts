prompt: |-
  I've been cataloguing my gut reactions to paternalistic interventions, and I've noticed they don't line up with the principle I'd naturally offer for them, so I'd like help working out what I actually believe — or discovering that I believe nothing coherent.

  My tentative principle runs like this: an intervention is acceptable paternalism when it rearranges how available options are presented — their defaults, prominence, friction, presentation — while leaving every option open, and it crosses a line when it closes options or attaches penalties to them. Steering is fine; gates are not.

  Now the verdicts, and you can see the trouble.

  Putting the salad bar at the entrance and the fries behind the counter: fine. Plain packaging and graphic warnings on cigarettes: fine. Enrolling new employees in a workplace pension automatically, with a form to fill in if they want out: fine. An employer setting a default that email doesn't arrive on phones after seven in the evening, with an opt-out per employee: fine.

  Making adult cyclists wear helmets under legal penalty: I'd say fine, and I notice this already strains my principle, since it plainly closes an option — yet my gut is more comfortable with it than with softer things below.

  Banning the sale of sodas over a certain size: not fine. A bar owner who quietly serves half-pour drinks at full price to patrons he judges to have had enough: not fine, and worse than the soda ban even though it does less to restrict anyone.

  Here is the pair I can't reconcile. My country withholds a couple of percent extra income tax by default as forced savings, refundable on request but only through a paper form at a tax office: this strikes me as seriously objectionable — presumptuous, collectivist, my money not theirs to hold. Yet it seems structurally identical to the pension auto-enrollment I cheerfully approved three verdicts ago: the same default, the same opt-out, arguably a similar bureaucratic burden in each direction. I've tried telling myself the difference is the employer versus the state, but I can't make myself mind a state-run pension scheme done the same way, so that's not it either.

  Two more cases, both involving things that keep every option open yet feel off. A new office building where the elevators are immediate and prominent while the stairwell doors are heavy, unmarked, and painted the color of the walls: everyone can still take the stairs, but I find something creepy about architecture engineered to make one choice unattractive without saying so. And a phone maker whose texting app, by default, holds messages composed after midnight as drafts until morning, sending them then unless the user confirms each one with an extra long-press: everyone I've described it to thinks it's thoughtful, and I half-agree, but it was designed by people who think they know what 2 a.m. me intends better than 2 a.m. me does, and I keep tripping on that.

  The motorcycle helmet question — mandatory for adult riders on the same logic as the seatbelt — I go back and forth on more than seems reasonable given how easy I found the seatbelt verdict, so I'd want to know whether whatever principle you extract makes the two come apart or forces them together.

  So: is there a single principle behind these verdicts, or a small set of principles that divide the cases at a joint I'd accept? Please test my options-open/options-closed principle honestly — I suspect it's the wrong cut, since it seems to license the stairwell building and forbid the helmet law, both wrongly. Then tell me which of my verdicts any better principle simply cannot save, and what it predicts about a case I haven't decided: a hospital that by default withholds scan results from the online patient portal until a follow-up appointment, reasoning that immediate access causes anxiety and worse decisions, with a box patients can tick at intake to see results right away.
reasoning: |-
  Hmm, the user is grappling with a fascinating philosophical dilemma about paternalism. They've noticed their intuitive reactions to various paternalistic interventions don't align with their stated principle of "steering vs gates." Let me unpack this carefully.

  First, their principle seems elegant: interventions that preserve all options while nudging behavior are acceptable, while those that restrict options or add penalties cross the line. But their gut reactions betray this. The helmet law violates the principle yet feels acceptable, while seemingly similar interventions like the tax withholding scheme feel deeply wrong despite technically preserving opt-out.

  The friction points are interesting. The stairwell design and delayed-text feature both preserve options but feel "creepy" - suggesting presentation matters beyond mere availability. The soda ban vs bar surreptitiously serving half-pours shows restriction severity isn't the only factor; deception seems worse than overt limitation.

  Ah, the pension vs tax withholding inconsistency is particularly telling. Both have opt-outs, yet one feels like "my money" being held hostage. This hints that perceived ownership and the actor's role (employer vs state) might matter more than the user initially thought, though they dismissed that explanation. Maybe it's about whether the withheld resource feels like an entitlement versus a benefit?

  The motorcycle helmet hesitation compared to seatbelts suggests physical risk vs convenience trade-offs might be weighing unconsciously. And the hospital scan results case they present at the end perfectly crystallizes the core tension: when does "protecting" someone become patronizing?

  What's really at stake here seems to be:
  - Transparency of manipulation
  - Respect for agency even in suboptimal states
  - The moral weight of different choice domains (health vs finances vs safety)
  - Whether the intervention assumes temporary incompetence (like late-night texting)

  Their discomfort with architecture and app design that "engineer" choices without disclosure points to a possible unifying principle: paternalism is more acceptable when it's overt and the reasoning is legible. The graphic warnings plainly say "we think this is dangerous," while the camouflaged stairwell doesn't announce its agenda.

  For the hospital case they present, I suspect they'll dislike it - not because it restricts options, but because it medicalizes patient autonomy. The follow-up appointment framing implies patients can't handle information without professional mediation, which might feel more infantilizing than pension auto-enrollment that simply leverages inertia.

  The challenge is crafting a principle that explains why helmet laws feel different from soda bans - perhaps because helmets protect against others' negligence (like car drivers) while soda consumption is purely self-regarding? But that doesn't quite hold, as motorcycle accidents also risk burdening public healthcare systems.

  Maybe the distinction is between preventing catastrophic harm versus improving welfare? Helmets prevent life-altering trauma, while soda bans target long-term health risks. But then graphic warnings would be less justifiable than they find them.

  Ultimately, I think their intuitions are pointing toward multiple dimensions: magnitude of harm prevented, reversibility of consequences, and crucially - whether the intervention assumes the decision-maker is temporarily impaired (like at 2am) or permanently incompetent. The pension opt-out respects that employees might rationally choose differently later, while the tax withholding implies people can't be trusted with their own money period.
answer: |-
  Your intuitions reveal a sophisticated moral landscape – not incoherence, but multiple principles operating beneath the surface. Your "options-open" principle captures *one* dimension, but others like **agency preservation**, **transparency**, **burden asymmetry**, and **domain legitimacy** are equally crucial. Here's a unified framework derived from your verdicts:

  ### The Core Principles
  1.  **Minimal Impairment of Choice:** *Physical* removal of options is worse than friction. (This aligns with your "steering vs. gates").
  2.  **Agency-Respect:** Interventions must not undermine the *perception* or *exercise* of conscious agency.
  3.  **Transparency & Honesty:** Hidden manipulation or deception is corrosive, even if options remain technically open.
  4.  **Burden Asymmetry:** The effort/cost to *deviate* from the default must not be significantly higher than accepting it. Defaults should leverage inertia, not create artificial barriers.
  5.  **Domain Legitimacy:** Does the paternalist have a legitimate stake or recognized expertise in this domain? Does the intervention address a clear harm or cognitive bias?

  ### Applying the Framework to Your Cases

  *   **Salad Bar Placement / Pension Auto-Enrollment:** Fine. High transparency, low burden asymmetry (filling a form is reasonable friction), leverages inertia without deception, domain legitimacy (employer/retailer setting defaults within their system).
  *   **Cigarette Packaging:** Fine. High transparency (graphic warning *is* the message), options open, addresses a severe, well-established harm with clear cognitive biases (discounting long-term risk).
  *   **Email Cutoff Default:** Fine. Meets all principles – transparent, reversible with low burden, respects agency while managing expectations.
  *   **Cyclist Helmet Law:** **Fine *despite* closing an option** because: High domain legitimacy (state protecting against severe, immediate physical harm, often with public cost implications), high transparency (law is explicit). It violates minimal impairment but satisfies agency respect (clear rule) and legitimacy. *(This explains your gut feeling and distinguishes it from soda bans)*.
  *   **Soda Ban:** **Not Fine.** Violates minimal impairment (physically removes choice) *and* low domain legitimacy/debatable proportionality (state banning a common consumer good targeting long-term health risk where harm is probabilistic and multifaceted).
  *   **Bar Half-Pours:** **Worse than Soda Ban.** Violates transparency & honesty (deception), undermines agency (secretly overriding choice), and burden asymmetry is infinite (patron *cannot* get the full pour). Deeply disrespectful.
  *   **Tax Withholding vs. Pension Auto-Enroll:** **The Burden Asymmetry & Legitimacy Divide.**
      *   *Pension:* Employer system, opt-out form is a standard, low-burden process within that employment context. Feels like a workplace benefit default.
      *   *Tax Withholding:* State taking *earned money* by force. The opt-out (paper form, in-person visit) creates high burden asymmetry intentionally. It feels like *your money is being held hostage*, not a helpful default. The domain legitimacy feels overreaching ("forced savings" vs. "retirement planning").
  *   **Camouflaged Stairwell:** **Creepy.** Violates transparency & agency-respect. The manipulation is hidden and architectural, making the "choice" feel engineered without consent. Options are technically open, but the friction is deceptive.
  *   **Delayed Texting:** **Objectionable.** Violates agency-respect and transparency. It subtly implies 2 a.m. you is incompetent *by default* and substitutes the designer's judgment. While "thoughtful," it disrespects the user's *current* intention without explicit consent for the override. Low burden asymmetry, but high agency disrespect.
  *   **Motorcycle Helmet vs. Seatbelt:** **Your Principle *Should* Treat Them Similarly (both close options).** Your greater hesitation likely stems from perceived differences in risk profile, personal freedom symbolism of motorcycles, or acceptance norms. The framework above would treat both like the bicycle helmet: potentially acceptable under legitimacy/transparency due to severe harm prevention, though the minimal impairment violation makes them stronger medicine than nudges.

  ### Verdicts Your Framework Cannot Save (and Why)
  1.  **Cyclist Helmet Law:** Your "options-open" principle *must* reject it, but your gut (and the expanded framework) accepts it due to legitimacy and severity of harm. This verdict breaks your initial principle cleanly.
  2.  **Tax Withholding Discomfort:** Your initial principle struggles to distinguish it from pension auto-enroll. The expanded framework highlights the crucial roles of **burden asymmetry** (much higher opt-out cost) and **perceived legitimacy/ownership** (state forcibly holding *your earned cash* vs. employer managing a *future benefit* contribution).

  ### The Hospital Scan Results Case (Prediction)
  *   **Intervention:** Default withhold scan results online until follow-up, opt-in box at intake.
  *   **Prediction using Framework:** **You will likely find this objectionable.**
      *   **Minimal Impairment:** Options are open (opt-in box).
      *   **Agency-Respect:** **Violated.** It assumes patients *by default* lack the competence/emotional stability to handle their own information immediately. It medicalizes autonomy ("doctor knows best when you're ready").
      *   **Transparency:** Medium (policy could be explained, but the *reason* – "you might panic" – might not be explicitly stated to the patient).
      *   **Burden Asymmetry:** Moderate. Opting-in upfront is low friction, but the *default* actively withholds information the patient might reasonably expect immediate access to. Finding out later they *could* have had it sooner feels like a deprivation.
      *   **Domain Legitimacy:** Debatable. While hospitals have expertise, managing patient anxiety/distress *in this specific way* (withholding factual medical data) oversteps into controlling information flow based on paternalistic assumptions, not just medical necessity.
  *   **Why it feels worse than pension auto-enroll?** Pension leverages inertia for a *future, complex benefit*. Withholding scan results leverages inertia to *actively deny access to personal, time-sensitive, factual information* about one's own body/health, based on an assumption of patient fragility. The agency disrespect and the nature of the withheld resource (immediate health data vs. future money) make it profoundly different and more invasive.

  ### In Summary
  You believe in **navigating paternalism along several axes**: not just whether options are closed, but also *how transparently, respectfully, reversibly, and legitimately* the choice architecture is manipulated. Your discomfort arises when interventions are deceptive, impose high reversal costs, disrespect agency by assuming incompetence, or overstep legitimate domains – even when options remain technically open. Your gut is sophisticated; it integrates these nuances where a simple "open/closed" principle cannot.
