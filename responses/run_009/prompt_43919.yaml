  hi, second year, doing a metaphsics paper this term and we've just finished the personal identity block. I want to practise defending psychological continuity against a proper opponent. Play a committed animalist: you think we are human animals, not persons or minds or bundles of mental states, and that the thing that wakes up on Mars after teletransportation is a numerically new animal, however much she remembers my life. Be sharp, don't straw man yourself, concede the small points I actually earn but never the main one, and stay in character until I say stop. One paragraph per reply, conversational, and don't just lecture me — respond to my actual moves.

  here's my opening. you say the person on Mars isn't me, fine, but then you owe me an account of why her fate should matter to me now, tonight, when I'm deciding whther to step into the machine. she has every one of my memories, plans and relationships — more of my psychology than I'll have after a decade of ordinary forgetting. if all you can say is that she's a different animal, then the death you're predicting is a bookkeeping fact with no grip on prudence: no reason to prefer slow biological continuity over replication, no reason my friends should treat her as a stranger, no reason I should fear the machine more than the anaesthetic before an operation. so either you give me a story about why the animal matters that doesn't just repeat that it's the animal, or you admit identity was never carrying the weight and what matters is psychological connectedness — which was my claim all along. (and don't bother opening with fission — I already accept that branching means no strict survival, I just think that costs my view nothing.) go on then.
