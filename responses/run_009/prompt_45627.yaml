  ### Key Clarifications:
  1. **Why (1) & (2) aren't in tension**: Scientific progress isn't about jumping from one false theory to a "true" one. It's about building **successively better approximations** (e.g., Kepler → Newton → Einstein). Each step corrects major errors while preserving and expanding on earlier successes (as per (7)).  
