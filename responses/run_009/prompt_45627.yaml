  Your position is **coherent with two affordable tweaks**: 
  - Define progress comparatively (drop (4)'s absolutism).  
  - Treat predictive success as evidence of reliable modeling, not deep truth (modify (3)).  
  This retains your core insight: science makes genuine progress through falsifiable, increasingly powerful approximations, even if no final "Truth" is reachable. Your brother-in-law’s "everything was a lie" stance oversimplifies—old theories weren’t *lies*, they were the best available models of their time, later superseded by better ones.
