answer: |-
  Here are the desiderata for an adequate account of personal identity within the Buddhist framework of *anattā* (no-self), synthesising philosophical rigour with tradition-internal requirements, presented in British English:

  **Core Desiderata (Non-Negotiable for Orthodox Buddhist Theorists):**

  1.  **Denial of Permanent Self (*Anattā*):** The theory must explicitly reject *ātman* – any enduring, unchanging, independent substance or soul that constitutes "self".  
      *   **Puzzle:** The *Chariot Simile* (Milindapañha): Just as "chariot" designates a functional assembly of parts (axle, wheels, etc.) without being a sixth entity, "person" designates the five aggregates (*khandhas*: form, feeling, perception, formations, consciousness) without being a sixth, permanent thing. Positing a self violates *anattā* and fuels clinging (*upādāna*).

  2.  **Karmic Causality & Rebirth Continuity:** The theory must explain how intentional actions (*karma*) generate consequences experienced across distinct lifetimes *without* a persisting agent/subject as the "owner" of karma or the "traveller" between lives.  
      *   **Puzzle:** *Responsibility Gap:* If there's only a momentary bundle of aggregates, what connects the murderer (aggregate-set A) to the hell-being (aggregate-set B) experiencing the karmic fruit? How can B be "punished" for A's act without identity or a persisting bearer?

  3.  **Conventional Reality of Persons (*Sammuti Sacca*):** The theory must preserve the pragmatic validity and utility of persons in everyday life, language, ethics, and law. Ultimate analysis (*paramattha sacca*) revealing no-self must *not* collapse into eliminativism, rendering moral responsibility ("*I* did it") or social practices nonsensical.  
      *   **Puzzle:** *The Two Truths Dilemma:* How can persons be "ultimately unreal" yet "conventionally real" without resorting to sheer contradiction or making conventional truth merely false? The distinction must do substantive work.

  4.  **Path Practice & Agency:** The theory must account for the phenomenology and necessity of deliberate effort, practice, and gradual transformation on the path (*magga*) to liberation (*nibbāna*). If there is no self, *who* strives, cultivates virtues, meditates, and attains awakening?  
      *   **Puzzle:** *The Striver Paradox:* "If there is no self, the act of striving for non-self-realisation is performed by no one. If it *is* performed, there must be a performer." (A challenge from non-Buddhist schools).

  **Important but Tradition-Contested Desiderata:**

  5.  **Phenomenological Coherence:** The theory should address the apparent unity and continuity of subjective experience – why consciousness *feels* like a unified field belonging to "me" at any given moment and across short durations, despite being composed of fleeting aggregates.  
      *   **Puzzle:** *The Stream of Consciousness:* Experience presents as seamless flow, not disparate fragments. A no-self theory must explain this appearance (*santati-vipallāsa*, continuity illusion) rather than flatly deny the datum of experience. (Emphasised in Abhidhammic traditions like Theravāda).

  6.  **Mechanism of Continuity:** *How* is causal continuity maintained across moments and lives?  
      *   **Contested Views:**  
          *   *Literal Momentariness (Theravāda Abhidhamma, Sautrāntika):* Requires an unbroken, momentary stream of consciousness (*citta-santāna*), each moment conditioning the next with extreme rapidity, carrying karmic seeds (*bīja*). Non-negotiable for these schools.
          *   *Storehouse Consciousness (Yogācāra):* Posits a subliminal *ālaya-vijñāna* as the repository for karmic seeds (*vāsanā*) and basis for continuity, rejected by other schools as subtle self.
          *   *Dependent Origination Only:* Some interpretations (e.g., certain Madhyamaka) insist *pratītyasamutpāda* (dependent arising) itself *is* the sufficient explanation, without needing any substrate stream beyond the causal links of the 12 nidānas.

  7.  **Status of Rebirth:**  
      *   *Literal Rebirth:* The dominant traditional view requires the theory to explain continuity across biological death and re-arising in a new existence (human, animal, god, hell-being, etc.).
      *   *Metaphorical Rebirth:* Some modern interpreters (less common traditionally) might accept a theory explaining "rebirth" purely as psychological transformation *within* this life or across generations, without literal reincarnation. This is negotiable only for non-orthodox interpretations.

  **Potentially Unsatisfiable Subset?**
  The conjunction of **Literal Rebirth (2)**, **Strict Momentariness & No-Self (1, 6a)**, and **Robust Path Agency (4)** creates acute tension. If aggregates are strictly momentary and nothing persists, how does karmic potential survive the dissolution of one life's aggregates to condition a new life? How can *effort* initiated moments ago meaningfully condition results moments later, let alone lifetimes later, without *some* form of continuity thicker than mere causality but thinner than a self? Explaining the "one who remembers past lives" (*pubbe-nivāsānussati-ñāṇa*) without smuggling in a subtle self (*attā*) is particularly challenging for this combination.

  **Brief Scorecard for Theories:**

  *   **Humean Bundle Theory:** Captures *anattā*'s anti-substance thrust and the conventional person well, but struggles profoundly with diachronic continuity (karma/rebirth) and path agency, risking nihilism about responsibility.
  *   **Parfitian Reductionism:** Excellent on *anattā* and conventional persons; its "Relation R" (psychological connectedness/continuity) offers a sophisticated continuity mechanism, but its impersonal description of survival may feel inadequate for robust karmic responsibility across lives and struggles to fully capture the phenomenology of path agency.
  *   **Pudgalavāda's "Inexpressible" *Pudgala*:** Attempts to solve continuity & agency puzzles by positing a "person" (*pudgala*) neither identical to nor separate from the aggregates, "inexpressible" as same/different. Widely rejected (even deemed heretical) for fatally compromising *anattā* by functioning as a crypto-self.
  *   **Madhyamaka's Conventional Person:** Radically affirms *anattā* and emptiness (*śūnyatā*) of all phenomena; persons exist *only* conventionally, dependently designated. Superbly handles the Two Truths (3), avoids ontological commitment, and frames karma/rebirth as dependently arisen processes. Its austere ontology makes continuity/path agency (4) deeply mysterious, relying entirely on the intricate web of *pratītyasamutpāda* without any underlying stream or repository.
