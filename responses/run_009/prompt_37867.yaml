prompt: |-
  I'm on the steering committee of my 13-person housing co-op, and we finally have to settle on an actual voting method for our big quarterly decisions, which has forced me to figure out what I actually believe about voting instead of just gesturing at "democracy." So here are my gut verdicts on some cases from our meetings — tell me what principle, if any, captures them.

  (1) If literally all 13 of us prefer A to B, the co-op has to prefer A to B — a method that gets that wrong isn't even a voting method.

  (2) If A beats B seven-to-six in a straight head-to-head vote, I feel like the co-op prefers A to B, period — that's just what the group's preference is, not a weird artifact.

  (3) But we had a three-way fight about the garden where A beat B 7-6, B beat C 8-5, and C beat A 9-4, and my gut says that's fine: the group just doesn't have a preference there, and picking by some tiebreak isn't unfair, it's necessery bookkeeping.

  (4) Under plain plurality, our contractor vote went 5 for A, 4 for B, 3 for C — and it turned out the C people all liked B more than A. A won anyway, and I actually think that's fair, not a bug: everyone got one equal vote, nobody was cheated.

  (5) But then someone suggested Borda (rank all three, points by rank), and I noticed that if just two people flip their C-vs-A rankings and nothing else changes, the winner between A and B can flip too. That strikes me as sneaky somehow — though I can't say why, since case 4 never bothered me.

  So: is there a principle that gets all five, or close to it? If not, which verdict has to go — the plurality one or the head-to-head one? And whatever principle you land on, tell me what it says about instant-runoff, which the most persistent committee member keeps proposing. I have a feeling it's going to upset me.
reasoning: |-
  Okay, let me tackle this user's query. They're part of a 13-person housing co-op steering committee and need to choose a voting method. They've shared five specific cases along with their gut reactions to each. My task is to find a consistent principle that explains all five or determine which verdict might need to be reconsidered. Then, I need to apply that principle to Instant-Runoff Voting (IRV).

  First, let's break down each case:

  1. Unanimity: If everyone prefers A over B, the group must prefer A. That seems non-negotiable and foundational—any voting method violating this is unacceptable. This is about Pareto efficiency or unanimity principle.

  2. Simple Majority: A 7-6 win for A over B means the group prefers A. The user believes simple majority reflects the group's preference without it being an artifact. This supports majority rule in binary choices.

  3. Condorcet Cycle: In a three-way tie (A>B, B>C, C>A), the user feels there's no group preference, and a tiebreak is necessary. This indicates that when there's a cycle, the collective preference isn't transitive, so a tiebreak is fair. This points to the Condorcet criterion not being met and the need for a tiebreaking mechanism.

  4. Plurality Outcome: In a vote with A:5, B:4, C:3, even though C voters prefer B over A, A wins. The user thinks this is fair since everyone had an equal vote. This suggests acceptance of plurality outcomes despite potential majority issues, possibly valuing simplicity and equal vote weight.

  5. Borda Count Sensitivity: In Borda, flipping two voters' C vs. A rankings changes the winner between A and B. The user finds this sneaky, unlike the plurality case. This highlights Borda's susceptibility to strategic ranking or irrelevant alternatives, which violates Independence of Irrelevant Alternatives (IIA).

  Now, looking for a consistent principle. The user's acceptance of plurality in case 4 conflicts with the strict majority in case 2. In case 4, A wins with only 5 votes out of 13, less than a majority. But the user thinks it's fair. However, if the C voters prefer B, then a majority (B and C voters combined, 7 people) prefer B over A. So why is A winning acceptable? That seems contradictory to the majority principle in case 2. 

  Ah, here's the tension. The user might be valuing the simplicity and equal vote in plurality for case 4, but in case 2, they insist majority should win. To reconcile, maybe they differentiate between when a majority exists versus when it doesn't. In case 4, if they used a method that considered second choices, B might win (like in IRV or Condorcet). But the user is okay with A winning, so perhaps they prioritize first-preference votes unless there's a clear majority.

  The Condorcet method would look for pairwise comparisons. In case 4, B beats A 7-6 (B's 4 plus C's 3), so B should win under Condorcet. But the user is fine with A winning, which contradicts Condorcet. So the user doesn't strictly adhere to pairwise comparisons when third options are present. This suggests they might accept methods that don't satisfy the Condorcet criterion.

  The principle emerging is a hybrid: respect unanimity and clear majority in binary choices, allow reasonable tiebreaks in cycles, and in multi-way races without a majority, accept plurality as legitimate if each vote carries equal weight. However, case 4's acceptance conflicts with the majority principle. The user might be emphasizing procedural fairness (one vote each) over outcome fairness in that scenario.

  For Borda's sensitivity (case 5), the issue is IIA violation. Changing preferences for C affects the A vs. B outcome. The user is bothered by this, unlike in plurality. So they value some degree of IIA or stability against minor changes.

  Now, applying this to IRV. IRV eliminates the least first-choice and redistributes. In case 4, C is eliminated, and their votes go to B, making B win with 7 votes. The user accepted A winning under plurality, but IRV would give B the win. Would the user find that fair? In case 4, they thought A winning was fair, so IRV might upset them because it changes the outcome based on later preferences. However, if they recognize that a majority prefers B over A, they might accept IRV's outcome as more representative. But their gut in case 4 says A winning is fair, so IRV's different result could be problematic.

  In case 2, IRV would respect the majority. In the cycle (case 3), IRV would pick a winner based on elimination order, which might be arbitrary but necessary. For unanimity and majority, it's fine. But in case 4, IRV would elect B, not A. Since the user was okay with A winning, IRV might conflict there. 

  The core tension is between case 2 (majority should win) and case 4 (plurality winner acceptable even without majority). To resolve, the user might need to decide whether they prioritize first-choice votes or overall majority preferences. If they value the principle that a candidate preferred by a majority over another should win, then they need to reject the plurality verdict in case 4. Otherwise, they might stick with plurality despite its flaws.

  Suggested principle: "Respect unanimous and pairwise majority preferences when they exist; when cycles occur, use a consistent tiebreak; when no majority exists, accept the plurality winner as procedurally fair." But this is messy because in case 4, a pairwise majority exists (B beats A), so respecting pairwise majority would require B to win, contradicting the user's acceptance of A winning.

  Therefore, the user must choose between valuing simple majority in binary choices (case 2) and accepting plurality in multi-choice (case 4). If they keep both, it's inconsistent. The verdict to drop might be case 4, meaning they should prefer a method where B wins in that scenario. Alternatively, they might drop strict adherence to pairwise comparisons in multi-candidate races, accepting that plurality is sufficient when no candidate has a majority of first choices.

  Given their unease with Borda's sensitivity, they might prefer methods with less strategic complexity. IRV can also have non-monotonicity, where ranking a candidate higher can hurt them, which might bother the user. However, it addresses the spoiler effect, which isn't covered in their cases.

  In conclusion, the user's intuitions mostly align with majority rule in binary decisions and accepting cycles, but the conflict between case 2 and 4 is key. Dropping the strict head-to-head requirement in multi-candidate scenarios might preserve their acceptance of plurality. For IRV, it would satisfy cases 1-3 and case 5 but might conflict with case 4 by electing B instead of A. The user needs to decide whether case 4's fairness outweighs the majority principle in multi-candidate settings.
answer: |-
  Based on your gut verdicts, there's a coherent principle that captures most of your intuitions, though it requires refining one case. Here's the breakdown:

  ### The Principle: Majority Rule with Procedural Fairness in Cycles
  Your intuitions align with **respecting pairwise majority preferences when they are transitive (acyclic)**, but **accepting procedural fairness when cycles occur or no majority preference exists**. More specifically:
  - **Unanimity and clear pairwise majorities must be respected** (Cases 1 & 2).
  - **Cycles reflect genuine group indecision**, so any non-arbitrary tiebreak is acceptable (Case 3).
  - **When no candidate has majority support, procedural fairness (e.g., "one person, one vote") can override strict pairwise comparisons** (Case 4, with a caveat).
  - **Methods overly sensitive to minor changes or irrelevant alternatives feel illegitimate** (Case 5).

  ### How Your Cases Fit:
  1. **Unanimity**: Non-negotiable. Any method violating this is invalid. ✔️  
  2. **Simple Majority**: Core to majoritarian democracy. A 7-6 win *should* decide the group preference. ✔️  
  3. **Cycle Acceptance**: Correct. No candidate is pairwise-preferred to all others (no "Condorcet winner"), so the group has no clear preference. Picking by chair's vote, lottery, etc., is fair. ✔️  
  4. **Plurality Fairness**: **Partial fit**. Your acceptance here conflicts with Case 2.  
     - *Why?* In the contractor vote, **B is pairwise-preferred to A 7-6** (B's 4 votes + C's 3 votes, since C voters prefer B > A).  
     - Yet you accepted A winning under plurality. This contradicts Case 2 ("if A beats B 7-6, the group prefers A").  
     - **To reconcile**: You likely value **procedural simplicity** ("one vote each") when no candidate has >50% first-choice support. But this *overrides* pairwise majority.  
  5. **Borda Sensitivity**: Your unease is spot-on. Borda violates **Independence of Irrelevant Alternatives (IIA)**, where changes to a losing option (C) flip the winner between A/B. This feels "sneaky" because it shouldn't matter how C is ranked if A/B are the top contenders. ✔️  

  ### Which Verdict Must Go?
  - **Case 4 (plurality fairness) is the inconsistency**. If you strictly prioritize pairwise majorities (Case 2), you *must* reject A winning the contractor vote. A majority (7/13) preferred B to A, so B should win.  
  - **Alternative**: If you value procedural simplicity in multi-way races *more* than pairwise majorities, you might keep Case 4 but soften Case 2. However, your strong language in Case 2 ("period") suggests pairwise majorities matter deeply.  

  ### Recommendation:  
  **Drop strict adherence to Case 4**. Your other intuitions are highly consistent with **Condorcet methods** (which respect pairwise majorities) or **Instant-Runoff Voting (IRV)** (which respects majority support for candidates). Plurality's failure in Case 4 is a known flaw ("spoiler effect").  

  ---

  ### What About Instant-Runoff Voting (IRV)?
  IRV (ranked-choice voting) aligns well with your core principles:  
  - **Case 1/2**: Satisfies unanimity and majority rule. If A beats B 7-6 head-to-head, IRV will reflect this.  
  - **Case 3**: In cycles, IRV picks a winner via eliminations (a fair procedural tiebreak).  
  - **Case 4**: **Fixes the contractor problem!** With your ballot data:  
    - C is eliminated first (fewest 1st-place votes).  
    - C's 3 votes transfer to B (since C voters prefer B > A).  
    - B now has 7 votes (4 original + 3 transfers), beating A (5). **B wins** — respecting the majority preference.  
  - **Case 5**: IRV mostly satisfies IIA (less sensitive than Borda). Flipping C-vs-A rankings rarely flips A/B if C isn't competitive.  

  #### Why IRV Might *Still* Upset You:  
  - **Non-monotonicity**: Rarely, ranking a candidate *higher* can hurt them (or ranking them lower can help). Example:  
    - **Initial votes**: 6 votes: A > B, 5 votes: B > A, 2 votes: B > C. B wins (7 votes after A eliminated).  
    - **If 2 voters change to A > B**: Now 8 votes: A > B, 5 votes: B > C. A is eliminated first, then C wins.  
    *Why?* By "helping" A avoid elimination, they caused B to be eliminated prematurely. This feels paradoxical but occurs in <1% of elections.  
  - **Your committee's persistence**: They're onto something! IRV is the most widely adopted reform for good reason. It fixes plurality's spoilers, mostly respects majorities, and feels fair.  

  ---

  ### Final Advice  
  1. **Abandon plurality voting**. It fails your Case 2 principle in multi-candidate races (like the contractor vote).  
  2. **Adopt Instant-Runoff Voting (IRV)**:  
     - Best balance of fairness, simplicity, and alignment with your intuitions.  
     - Addresses your dislike of Borda's sensitivity.  
     - Only weakness (non-monotonicity) is rare and arguably less harmful than plurality's flaws.  
  3. **If Condorcet intrigues you**, consider **Ranked Pairs** or **Schulze**:  
     - Matches Cases 1/2/3/5 perfectly.  
     - In Case 4, it elects B (as the pairwise majority winner).  
     - Downside: More complex to explain/calculate.  

  **Bottom line**: IRV is your best fit. It turns Case 4 into a win for B (which *should* feel fairer on reflection) and handles cycles cleanly. Your persistent committee member is right!
