prompt: |-
  I'm a second-year graduate student currently taking a seminar on formal epistemology, and I'm trying to decide whether to commit to epistemic utility theory — the accuracy-first research program that grounds norms of credence in the idea that credences should be as close as possible to the truth values of propositions — as the focus of my dissertation work. My background is in mathematics rather than programming, and my realistic budget is one term paper now and, if I go this direction, roughly three years of dissertation work. I'd like your help constructing a defensible agenda, not a survey.

  To make this concrete, here are the open questions I've gathered from the seminar and my own reading; I'm confident the list is incomplete, so please tell me what's missing. First, the framework's vindications of probabilism (in the tradition of Jim Joyce's accuracy arguments) and its vindications of diachronic norms like conditionalization (in the tradition of Hilary Greaves and David Wallace's decision-theoretic argument) seem to rest on different premises — the diachronic arguments appear to require stronger assumptions about the agent's foreknowledge of what evidence she will receive. Second, there is the question of the additivity of epistemic value: Richard Pettigrew's version of the program scores each proposition separately and sums, and it is not obvious which norms survive if epistemic value is allowed to be global rather than a sum of per-proposition scores. Third, the framework seems to presuppose that every proposition has a determinate truth value and that credences are precise real numbers, which generates trouble for credences in necessarily false propositions, for self-locating beliefs whose accuracy depends on more than which world is actual, and for proponents of imprecise credences. Fourth, there is the cluster of objections alleging that epistemic utility theory is a form of epistemic consequentialism and inherits consequentialism's problems: cases where trading off accuracy across propositions appears to license epistemic akrasia or belief against one's evidence. Fifth, there is the question of whether the framework extends beyond the ideal individual agent — to groups, to peer disagreement, or to suspension as a third attitude alongside credence.

  Given all that: which of these questions (or ones I have not listed) should someone with my training and time budget actually prioritize, and in what order? I care less about the list than about the reasoning behind it. For each item you prioritize, I'd like to know why it is upstream of the others — which questions quietly presuppose its answer — whether it is tractable with the tools of philosophy and mathematics rather than empirical work, and what would have to happen over the next few years for it to move up or down your ranking. Please also say which of my five candidates are overrated in the sense that settling them would not change much downstream, and flag any question that you think is not really open at all but instead a dispute about how to define the framework's terms. I'd rather discover that now than in year two.
reasoning: |-
  Okay, this is a substantial and well-structured query from a graduate student diving deep into formal epistemology. The user is clearly highly competent—they've mapped the landscape of epistemic utility theory (EUT) with impressive precision for a second-year student. Their five-point summary covers major fault lines: synchronic/diachronic tension, additivity, truth-value realism vs. anti-realism challenges, consequentialist objections, and scope limitations. 

  What stands out is their methodological self-awareness. They're not asking for a literature survey but a strategic research agenda—prioritization based on leverage points, tractability, and downstream impact. The math background (vs. programming) is crucial; it means they'll thrive with proofs, measure theory, or functional analysis but shouldn't be steered toward computational simulation-heavy approaches. The three-year timeline is realistic for 2-3 substantive papers.

  Hmm... their unspoken anxiety is palpable: choosing a dissertation topic feels high-stakes, and they fear dead ends. They want to avoid investing years only to find their "open question" was terminological or trivial. The request to flag "disguised non-problems" is smart—I recall how debates over "accuracy dominance" sometimes collapse into definitional squabbles.

  Let me reconstruct their priorities:
  - Upstream first: Solve X, and Y/Z become tractable.
  - Mathematical tractability: No fMRI data needed.
  - Field-shifting potential: Where could a dissertation redefine debates?
  - Avoid overrated pits: Don't waste time on questions where answers don't cascade.

  Their listed problems are all live, but I disagree with their implied equivalence. The synchronic/diachronic rift (#1) is the tectonic plate—everything else sits on it. If we can't reconcile Joyce with Greaves-Wallace, the whole program splinters. Pettigrew's additivity (#2) is downstream because you need diachronic stability to test global vs. additive scoring. The realism/idealism worries (#3) feel urgent but are actually contained—they're application challenges, not core cracks. Consequentialism (#4) is philosophically deep but more about boundary-pushing than foundation-pouring. Group/suspension extensions (#5) are dessert—not main course until the core is stable.

  ...Wait, they missed one gap: the silent role of weighting in scoring rules. Whether we weight propositions equally (like Brier) or allow epistemic priority (e.g., more accuracy weight to central hypotheses) changes everything—and it's underexplored. That's a stealth candidate for Year 1.

  For the agenda:
  - Year 1 paper must be high-leverage, math-friendly, and "winnable." Synchronic/diachronic unification fits. A proof showing how to derive conditionalization from purely synchronic dominance? That'd force field-wide attention.
  - Dissolve the "overrated" trap: The realism worry (#3) is a distraction. Truth-value gaps are handled by moving to algebraic semantics (e.g., degrees in lattices), not overhauling EUT. Flag this now so they don't sink time here.
  - Save consequentialism (#4) for Year 3—it's where philosophy gets juicy, but only after machinery is secure.

  Biggest risk? The field might pivot toward computer-assisted proofs (like recent PAC-learning hybrids). But with their math chops, they can co-opt that, not chase it. Tell them to own the analytical high ground.
answer: |-
  Based on your goals, background, and constraints, here’s a prioritized research agenda focused on **leverage**, **tractability**, and avoiding dead ends. I’ll explain why each item is ranked, its upstream/downstream impact, and flag overrated questions.  

  ---

  ### **Priority Ranking & Rationale**  
  #### **1. The Synchronic/Diachronic Rift** (Your Point #1)  
  **Why prioritize?**  
  - **Upstream of everything**: If synchronic (Joyce) and diachronic (Greaves-Wallace) norms rely on incompatible assumptions (e.g., foreknowledge of evidence), this threatens the *internal coherence* of the entire program. Resolving this determines whether EUT can ground a unified epistemology.  
  - **Tractable with math**: Requires game-theoretic modeling (e.g., sequential scoring rules), measure theory, or topological arguments—no empirical work needed.  
  - **Downstream impact**: Fixes the foundations for conditionalization, reflection, and updating under self-locating beliefs (your #3).  
  - **Triggers for reprioritization**:  
    - *Move down* if new results (e.g., Schoenfield’s work on "fixed" vs. "variable" perspectives) resolve the tension.  
    - *Move up* if proofs emerge that Joyce-style arguments *require* implicit diachronic assumptions.  

  **Concrete agenda**:  
  - **Term paper**: Prove that *any* diachronic norm derived in EUT implies a hidden synchronic dominance condition (or vice versa), using dynamic consistency axioms.  
  - **Dissertation**: Develop a scoring rule that jointly satisfies synchronic admissibility and diachronic optimality without foreknowledge assumptions.  

  ---

  #### **2. Non-Additive Epistemic Value** (Your Point #2)  
  **Why prioritize?**  
  - **Upstream of norms**: Additivity (Pettigrew) enforces separability; dropping it challenges probabilism, conditionalization, and the "trade-off" objections (your #4).  
  - **Math-ready**: Functional analysis (non-separable scoring functions), lattice theory for global value structures, or category theory for dependency mapping.  
  - **Downstream impact**: Determines whether objections to epistemic consequentialism (#4) are merely artifacts of additivity.  
  - **Triggers**:  
    - *Move up* if non-additive models (e.g., Schurz’s "coherence truthlikeness") gain traction.  
    - *Move down* if all plausible non-additive scoring rules reduce to additive equivalents.  

  **Concrete agenda**:  
  - **Term paper**: Show that Joyce’s dominance theorem fails for a specific non-additive scoring rule (e.g., a multiplicative *global* measure).  
  - **Dissertation**: Characterize norms that survive when epistemic value is a non-separable function (e.g., only *strict propriety* or *convexity*).  

  ---

  #### **3. Epistemic Consequentialism’s Limits** (Your Point #4)  
  **Why prioritize now?**  
  - **Downstream of additivity**: Whether accuracy trade-offs permit akrasia depends on *how* value aggregates (point #2).  
  - **Tractable**: Formalize "epistemic dilemmas" using decision-theoretic counterexamples (e.g., an accuracy-dominated but rational credence).  
  - **High stakes**: If irreconcilable, EUT may need to abandon consequentialism—or redefine rationality.  
  - **Triggers**:  
    - *Move up* if real-world cases (e.g., AI alignment) demand non-consequentialist EUT.  

  **Concrete agenda**:  
  - **Dissertation focus**: Test if *any* scoring rule avoids trade-offs that violate evidence-responsiveness, using modal logic for "ought-implies-can" constraints.  

  ---

  ### **Lower Priority / Overrated Questions**  
  - **Truth-value determinacy & imprecise credences** (Your #3):  
    - **Overrated**: Much work exists (e.g., Moss on imprecise credences; Konek on comparative beliefs). Solutions often involve technical tweaks (e.g., scoring over partitions), not foundational shifts.  
    - **Downstream impact low**: Settling this doesn’t resolve coherence (point #1) or additivity (point #2).  
  - **Group/suspension extensions** (Your #5):  
    - **Downstream**: Depends on a stable *individual* theory. Prioritize only if core norms are secure.  
    - **Risk**: May require social choice theory (beyond your math background).  

  ---

  ### **Critical Missing Questions**  
  1. **Weighting of propositions**:  
     - Why? Pettigrew assumes equal weighting, but should "central" propositions (e.g., scientific laws) have higher accuracy weight? Untested and upstream of additivity.  
  2. **Scoring rules for infinitary logics**:  
     - Why? Current tools (Brier score) fail for infinite partitions—vital for math/physics applications.  

  ---

  ### **Agenda Roadmap**  
  | **Timeline** | **Focus**                          | **Deliverable**                                        |  
  |--------------|------------------------------------|--------------------------------------------------------|  
  | Term Paper   | Synchronic/diachronic rift         | Proof that diachronic norms imply synchronic dominance |  
  | Year 1       | Non-additive value                 | Model where probabilism fails under global scoring     |  
  | Year 2       | Consequentialism trade-offs        | Taxonomy of accuracy dilemmas                          |  
  | Year 3       | Synthesis / extensions             | Unified framework for individual agents                |  

  ---

  ### **Red Flags: Non-Problems**  
  - **"What counts as accuracy?"**: This is *definitional*, not open. EUT assumes a scoring rule (e.g., strictly proper) as primitive; disputes here are about framework choice, not solvable math.  
  - **"Are credences truth-apt?"**: A metaphysical debate—EUT only requires *truth-valuable* propositions, not Platonism.  

  This agenda maximizes impact: resolving the synchronic/diachronic rift (#1) and additivity (#2) could redefine EUT’s scope, while avoiding quagmires like truth-value gaps (#3). With your math background, focus on proofs that expose hidden dependencies—this is where philosophers need mathematicians.
