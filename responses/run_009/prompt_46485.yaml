prompt: |-
  Hey, I'm taking a philosphy of language course and we just covered Frege's puzzle about identity statements — the bit where "Hesperus is Hesperus" tells you nothing at all, but when the ancient astronomers worked out that Hesperus is Phosphorus (i.e. that the morning star and the evening star are the same planet, Venus), that counted as a genuine discovery, even though it's the same object on both sides of the "is". The puzzle is basically why one of these feels like a boring tautology and the other feels like actual news, given that both sentences are about the same thing. Frege's own answer involved something like different "modes of presentation", which honestly went a bit over my head, but the core puzzle I get.

  Anyway, our seminar has this tradition where each week one of us has to open the session with a joke on the week's topic, and this week it's my turn and I'm drawing a blank. Could you write me a joke about Frege's puzzle? Ideally the punchline should turn on the actual difference between a trivial self-identity ("a is a") and an informative identity ("a is b") — so that people who know the puzzle find it genuinely funny rather than it being a generic nerd joke. At the same time, a couple of people in the seminar aren't philosophy students, so the joke should still make some sense to someone who's never heard of Frege. A bit of cheesiness is fine, even welcome. Please write it in British English.
