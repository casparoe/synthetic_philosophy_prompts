  The core issues here seem to be about foundational differences in approach. Gilbert takes a holistic view where the group itself becomes a subject with obligations, while Bratman maintains methodological individualism where everything reduces to individual mental states. This isn't just a verbal disagreement - it's about fundamentally different starting points in how we understand social phenomena.

  For the possibility of resolution, I should acknowledge how deep these differences run. The mutual knowledge regress problem (how we know others know we know etc.) is particularly thorny. Bratman would handle it through nested individual beliefs, while Gilbert would see it as part of plural subject formation. There might not be a clear resolution since they operate with different fundamental assumptions about what constitutes social reality.
answer: |-
  1.  The disagreement is fundamentally metaphysical and methodological: Gilbert posits irreducible plural subjects as the source of obligation, treating the group as a distinct ontological unit, while Bratman (and Searle) adhere strictly to methodological individualism, insisting joint phenomena must be reducible to individual mental states plus interaction.
  2.  It centres on conflicting bedrock intuitions about paradigmatic cases: Gilbert's "walking together" case generates a strong intuition of obligation without promise, which she takes as evidence for plural subjects, whereas Bratman points to cases like spontaneous harmony ("duets") where obligations are absent, arguing shared intention alone doesn't create them.
  3.  The debate is not merely verbal about "reduction," but involves genuine conceptual divergence: Gilbert argues obligations *constitutively* depend on the joint commitment forming a plural subject, while Bratman argues obligations are *causally* generated by individual promises or expectations within the mesh of individual intentions.
  4.  The mutual knowledge regress problem highlights their divide: Bratman seeks to halt the regress within complex individual attitudes (like "I intend that we J because she intends that we J..." with common knowledge), while Gilbert sees the regress as dissolved *by* the joint commitment itself, which creates a unified normative standpoint.
  5.  Genuine movement is unlikely without a fundamental concession: No single distinction or case will satisfy both, as their core commitments (holism vs. individualism) are too deep; resolving it would require one side to abandon their core intuition about obligation's origin or accept the other's metaphysical framework as primary for explaining social phenomena.
