prompt: |-
  I got into a huge argument with my roommate last night that went on for like three hours, and it started over something so dumb — she said I was being creepy by messaging a new coworker the way I did, and I asked her to actually explain WHY it was creepy, and she got annoyed and said "can't you just trust my judgment?" And I said no?? If you can't articulate it, why should I just take your word for it?? And she said I take experts' word for it all the time on other stuff. And then we were off to the races about whether you can ever justifiably believe something is wrong (or do something, or not do something) purely on someone's say-so.

  Anyway I teach an intro ethics discussion section and I want to channel this fight into something useful for my students. I want a "which view on moral testimony do you actually hold?" quiz, like those personality quiz things, around 8 questions, each one a concrete little scenario with 2-3 answer options. Here's what I care about: the questions have to sort people by what they say about cases, not by which labels they've heard of — none of my students know any of the literature, so every question has to be answerable by a normal person with no background. Some scenarios I want in there: the roommate one (someone whose judgment you trust says your action is wrong but can't explain why), the historian one (you learn some atrocity happened centuries ago and there's basically no way for you to investigate it yourself — can testimony alone give you the belief that it was wrong?), the doctor analogy (if I can rationally take my doctor's word on a medical fact, is moral expertise or good moral character the moral analogue?), and some case where you'd defer on a factual premise of a moral issue but maybe not on the moral verdict itself (like trusting a climate scientist's data but not someone's conclusion about what we owe future generations).

  For the scoring key, build it from the distinctions first rather than from a list of names. The way I see it (and tell me if I'm carving it wrong), the tree turns on at least these questions: can testimony transmit moral knowledge at all, or only evidence; even if it can, is there something defective about relying on it, and is the defect epistemic (like you're benighted, you don't really understand) or is it more like a character/conduct thing (you're being a moral freeloader); and does the answer come out different for forming beliefs versus deciding what to do — my roommate's complaint was really about my conduct, and my comeback was really about belief. Then locate the actual positions in that space: the full pessimist (no moral knowledge by testimony), the moderate (knowledge yes, but relying on it in your decisions is somehow off), the view that what you need is understanding rather than mere knowledge so it's fine to defer exactly when you could have worked it out yourself, and the optimist who thinks moral testimony is just testimony. If any combination of answers has no real occupant, say so and say why you think nobody's there — incoherent, or just seems bad, or maybe nobody's thought of it. Also flag honestly which pairs of positions your questions can't actually separate, because a couple of them might only differ on cases weirder than the ones I listed. Keep it usable for a 50-minute section, so the scoring key has to be something students can run on themselves in five minutes.
reasoning: |-
  Alright, let me unpack this user's request. They're an ethics TA who had a heated argument with their roommate about whether moral testimony can justify beliefs or actions without explanation. Now they want to transform that personal conflict into a teaching tool—specifically, a quiz that sorts students into positions on moral testimony through concrete scenarios.

  The user's core needs are clear: they want an accessible, literature-free quiz that mirrors real-life moral dilemmas. The scenarios they suggested—roommate disputes, historical atrocities, doctor analogies—show they're prioritizing relatability over academic abstraction. I notice they're particularly invested in distinguishing between belief formation and practical decision-making, given how their argument with the roommate straddled both.

  Hmm, the tricky part is designing questions that cleanly separate positions without jargon. Take the "historian" scenario: if someone says they'd believe the atrocity was wrong purely from testimony, that could indicate either full optimism ("testimony transmits moral knowledge") or moderate pessimism ("I can believe it but shouldn't act on it blindly"). Need to pair it with an action-oriented question later to force the distinction.

  For the doctor analogy, I'm torn between two approaches. Option A: present it as "Is moral expertise like medical expertise?" with yes/no choices. But that might be too reductive. Option B: embed it in a voting scenario where a trusted friend condemns a policy—does the student need the friend's reasoning, or just their moral track record? That subtly tests whether they view moral expertise as factual or character-based.

  The scoring key will need nested logic. First branch: did they accept moral testimony for beliefs? If yes, then check if they rejected it for actions—that isolates the moderates. If no, they're pessimists. But there's a gray zone: students who demand understanding might inconsistently defer in low-stakes cases (like the historian example) but refuse in personal ones (like the roommate fight). Might need a "conditional deferrer" category.

  ...Wait, the user mentioned positions where "nobody's thought of it." Interesting challenge. For instance: someone who thinks testimony gives moral knowledge but that using it in decisions is always character-defective. That feels coherent but psychologically unlikely—why would you believe something is wrong yet ignore it practically? I'll flag that in the key.

  Time constraints matter. Eight questions max, with scoring under 5 minutes. Should avoid scenarios requiring niche knowledge (e.g., art authentication). The "climate data vs. moral conclusion" case is smart—it forces students to confront whether moral judgments reduce to facts. But must phrase it carefully: "Scientists confirm CO2 emissions harm future people. Your philosopher friend says this means we must adopt policy X. Do you need their reasoning?" Clear fork between "trust the data, distrust the ought" and full deference.

  Finally, the roommate scenario needs rewording to prevent bias. Original had OP defensive ("I asked WHY it was creepy"). Better to neuter it: "Your trusted roommate says your text was creepy but can't explain. Do you change your behavior before understanding why?" This isolates whether perceived character flaws (being "creepy") trigger practical deference even without belief change.

  *Sketching question sequence*: Start with low-stakes history case (tests belief), escalate to roommate (tests action), then doctor analogy, then climate policy to split factual/moral deference. Save the "could you have reasoned it yourself" question for last—it's meta.
answer: |-
  Here's a self-scoring quiz designed to sort students into intuitive positions on moral testimony based purely on concrete scenarios, without requiring any prior philosophical knowledge. It targets the distinctions you outlined.

  **The "How Do You Handle Moral Advice?" Quiz**

  *Answer honestly with the letter that feels most natural to you in each scenario. There are no right or wrong answers!*

  1.  **The Historian:** You're reading about a civilization that existed centuries ago. A respected historian you trust explicitly states, based on extensive research, that this civilization routinely practiced a specific ritual that was deeply morally wrong. You have no independent way to research or verify the details yourself. Does the historian's testimony alone give you sufficient reason to believe the ritual *was* morally wrong?
      *   **A) Yes, I believe it was wrong based on their testimony.**
      *   **B) No, I need more than just their word to form that belief.**
      *   **C) I might *suspect* it was wrong, but I wouldn't feel like I truly *know* it was wrong.**

  2.  **The Doctor Analogy - Belief:** Your trusted doctor tells you, "You have Condition X, and the *only* morally right treatment choice in your situation is Treatment Y." You know your doctor is medically skilled and generally has good judgment, but they don't explain *why* Treatment Y is morally required. Do you believe Treatment Y is the morally right choice for you *based solely on their statement*?
      *   **A) Yes, I believe it's the right choice.**
      *   **B) No, I need to understand the moral reasons myself.**
      *   **C) I trust their *medical* judgment about Condition X, but I'm unsure about their *moral* judgment on what's right for me.**

  3.  **The Doctor Analogy - Action:** Same situation as #2. Your doctor says Treatment Y is the only morally right choice. They don't explain why. You have to decide right now. Do you *choose* Treatment Y based solely on their statement?
      *   **A) Yes, I would choose it.**
      *   **B) No, I wouldn't choose it just because they said it was morally right without explanation.**
      *   **C) I might choose it because I trust them generally, but I'd feel uneasy about the lack of moral reasoning.**

  4.  **The Roommate - Belief:** Your roommate, whom you generally trust and think is a good person, sees a friendly message you sent to a new coworker and says, "That was really creepy." You ask why, and they get flustered and say, "I can't explain exactly why right now, but trust me, it was creepy!" Do you *believe* your message was genuinely creepy based *only* on their statement?
      *   **A) Yes, probably. I trust their judgment.**
      *   **B) No, not without a reason.**
      *   **C) I might feel self-conscious, but I wouldn't firmly *believe* it was creepy without understanding why.**

  5.  **The Roommate - Action:** Same situation as #4. You're about to message this coworker again in a similar way. Remembering your roommate's reaction (they said it was creepy but couldn't explain why), do you *change how you act* (e.g., hold off on sending it, rephrase it significantly)?
      *   **A) Yes, I'd probably change my action based on their judgment.**
      *   **B) No, I wouldn't change my action just because they said that without explanation.**
      *   **C) I might hesitate or be more cautious, but I wouldn't fundamentally change my action without an explanation.**

  6.  **The Climate Policy - Fact vs. Moral:** Scientists overwhelmingly agree that continuing current CO2 emission levels will cause severe, widespread suffering for people living 100+ years from now. A philosopher you respect, known for clear thinking about fairness and future generations, says, "Given these facts, we have a *strong moral obligation* to implement Policy Z immediately." Do you need the philosopher to explain *their reasoning* to accept that we *do* have this strong moral obligation?
      *   **A) No, I accept the moral obligation based on the facts and their expertise/judgment.**
      *   **B) Yes, I need to understand *their* reasoning to accept *their specific conclusion* about the moral obligation.**
      *   **C) I accept the *facts* from the scientists, but the jump to a *moral obligation* requires its own reasoning I need to grasp.**

  7.  **The Simple Case:** A close friend, who you know is incredibly honest, fair, and thoughtful, tells you sincerely, "What Jasper did to Maya yesterday was deeply wrong." They witnessed the event, you didn't. It was a simple, everyday situation (e.g., breaking a promise, taking credit). Do you believe it was wrong based on their testimony?
      *   **A) Yes, easily. I trust their character and judgment on this.**
      *   **B) Only if they tell me *what* Jasper did, so I can judge for myself.**
      *   **C) I'd lean towards believing it, but I'd want to know the details to fully understand *why* it was wrong.**

  8.  **The "Could You" Test:** Imagine someone tells you an action is morally wrong (like in #7). If you later discovered that *you personally* would *never* have been able to figure out it was wrong, even with lots of time and effort thinking about it yourself (maybe it's very complex or subtle), does that make relying on their testimony about it being wrong feel...
      *   **A) Perfectly fine. If they understand it and I trust them, that's enough.**
      *   **B) Problematic. If I can't grasp *why* it's wrong myself, my belief/action based on testimony feels hollow or inadequate.**
      *   **C) It depends on the situation/stakes, but generally makes me uncomfortable.**

  ---

  **Scoring Key & Position Mapping (5-Minute Self-Scoring)**

  *   **Step 1: Can Testimony Give Moral *Belief*?** Look at your answers to **1 (Historian Belief)**, **2 (Doctor Belief)**, **4 (Roommate Belief)**, and **7 (Simple Case)**.
      *   Mostly **A**: You generally think moral testimony *can* transmit moral belief/knowledge. **(Moves to Step 2)**
      *   Mostly **B** or **C**: You are **skeptical** about testimony giving genuine moral *belief* or knowledge. You likely lean towards **Pessimism** (Moral Testimony is defective for forming belief). (Go to Step 3 for nuance).

  *   **Step 2: Is Relying on Testimony for *Action* Problematic?** (If you mostly said testimony *can* give belief in Step 1). Look at your answers to **3 (Doctor Action)**, **5 (Roommate Action)**, and **8 ("Could You" Test)**.
      *   Mostly **A**: You think relying on testimony is generally fine for both belief *and* action. You are likely an **Optimist** (Moral testimony is like other testimony).
      *   Mostly **B** or **C**: You think testimony *can* give belief, but relying on it directly for *action* feels defective or inadequate. You likely hold a **Moderate Pessimism / Action-Centered Pessimism** view. The defect is often seen as practical/character-based (moral freeloading, lack of ownership) or sometimes epistemic (lacking understanding for proper action). *Note: #8 helps distinguish emphasis - "B" leans epistemic (need understanding), "C" leans practical/character unease.*

  *   **Step 3: Nuance for Skeptics/Pessimists** (If you were mostly B/C in Step 1). Look at **6 (Climate Policy)** and **7 (Simple Case)**.
      *   **6C & 7B:** You might distinguish factual premises (which you *will* take on testimony) from the moral conclusion/judgment (which you feel you *must* make yourself). This is a core **Pessimist** position (moral judgments aren't fit for testimony).
      *   **7A but others B/C:** You might be a **Conditional Deferrer** or lean towards the **Understanding View**. You *might* defer in very simple, clear-cut cases (#7) where you feel you *could* easily understand it yourself, but resist in more complex cases (#1, #2, #4) or for action (#3, #5). Check #8: A "B" answer strongly suggests the **Understanding View** (deferral is only appropriate when you *could* have reached the understanding yourself). A "C" suggests unease but less clear commitment to the Understanding View specifically.

  **Mapping to Positions & Distinctions:**

  1.  **Optimist:** (Step 1: A's; Step 2: A's). Moral testimony works like other testimony for both belief and action. *("Sure, if my doctor/roommate/historian I trust says it, I'll believe it and act accordingly.")*
  2.  **Moderate / Action-Centered Pessimist:** (Step 1: A's; Step 2: B/C's). Testimony can transmit moral *belief/knowledge*, but relying on it directly for *action* is problematic (lacks understanding, is irresponsible/heteronomous). *("I believe the historian, and maybe even my doctor, but I wouldn't just *do* what the doctor says is morally right or change my texting based *only* on my roommate's unexplained 'creepy' verdict.")*
  3.  **Pessimist (Full/Belief):** (Step 1: Mostly B/C's; Step 3: 6C & 7B). Moral testimony is defective for transmitting genuine moral belief/knowledge. You need to grasp the reasons yourself. *("I need to see *why* it's wrong myself; just being told isn't enough to really know or believe it.")*
  4.  **Understanding View Advocate:** (Step 1: Mix, often A on #7 but B/C on others; Step 3: Strong #8B). Testimony might give you a *belief*, but it lacks *understanding*. Reliance is appropriate *only when* you could have come to understand it yourself. Deferral is a shortcut to understanding you *could* achieve. *("I'll take my friend's word on the simple promise-breaking being wrong (#7) because I could easily see why. But for the complex ritual (#1) or unexplained 'creepy' (#4), I can't just take their word - I need to grasp the reasons myself, and if I can't, deferring feels wrong.")*

  **Important Notes on the Map:**

  *   **The "Could You" Test (#8)** is crucial for identifying the **Understanding View**. Without it, Conditional Deferrers might look like moderate pessimists or just inconsistent pessimists.
  *   **Distinguishing Moderate Pessimism (Action) from Understanding View:** Moderate Pessimism focuses on the *action* being problematic even if the *belief* is held. The Understanding View focuses on the *agent's state* (lack of understanding) being problematic for both belief and action, especially in cases where understanding couldn't be achieved.
  *   **The "Empty Spot":** The quiz struggles to neatly capture someone who thinks testimony *can* give moral knowledge, it's *epistemically* fine to believe it, and it's *also* fine to act on it... *except* when you *couldn't* understand it yourself (#8B). This seems logically possible but psychologically unstable and rarely defended. Most who say #8B also show skepticism in other areas (Step 1 B/C), landing them in Conditional Deferral/Understanding View territory.
  *   **What the Quiz Can't Perfectly Separate:**
      *   **Pessimism vs. Strong Understanding View:** A strong Understanding View proponent might answer like a Pessimist on many questions (#1B/C, #2B, #4B/C, #6B) because they deny testimony gives *understanding*. The key difference might be #7A (deferring on simple cases) and the *reason* for #8B (it's about understanding, not testimony per se). The quiz hints at it but doesn't perfectly isolate it.
      *   **Motivations within Moderate Pessimism:** Is the defect in acting on testimony primarily *epistemic* (you don't understand the reason for the action) or *practical/moral* (it shows poor character)? The quiz (#3C, #5C, #8C) can suggest unease but doesn't definitively split these strands. Both motivations often coexist.

  **Using it in Section:**
  1.  Have students take the quiz individually (5 mins).
  2.  Let them score themselves using the key (5 mins).
  3.  Group students by their primary result (Optimist, Moderate Pessimist, Pessimist, Understanding View Advocate). Groups discuss: "Why did your answers lead to this result? What feels right/wrong about the other positions?"
  4.  Facilitate a whole-class discussion. Highlight the key distinctions your argument with your roommate touched on: belief vs. action, understanding vs. knowledge, expertise analogy. Use their quiz answers and group discussions as concrete anchors. Ask: "Did anyone feel pulled in different directions on belief vs. action questions? Why?"

  This approach channels your argument into a tool that makes the abstract debate tangible and personal for students, starting entirely from their own intuitions.
