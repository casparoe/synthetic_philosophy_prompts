prompt: |-
  I'm a PhD student in criminal justice, and next month I'm running a seminar session on theories of punishment. I want to avoid the usual retributivism vs consequentialism vs restorative justice deathmatch and instead make my classmates argue about what a theory of punishment is even supposed to deliver before anyone gets to pick a side. So write me the spec: exactly five requirements, numbered, that any adequate theory of punishment must meet — where adequate means the theory could actually be handed to a sentencing commission and used to construct a punishment scale, not just justify punishment in the abstract. Each item should be a sentence or two with the motivating case, no intro or conclusion, just the list. Some constraints I want baked in: the theory has to handle attempt crimes (where the harm never actually happened), strict liability offenses (where culpability is murky at best), and corporate fines (where there's no sentient person being punished), and it can't just quietly collapse deserved punishment into optimal punishment. After the list, tell me which pair of the five you suspect can't be jointly satisfied — that's the part I most want to see — and which single requirement does the most work to knock out the standard contenders. Please use American English, and dont worry about being polite about it, I'll be the one getting grilled.
reasoning: |-
  Okay, the user is a PhD student in criminal justice preparing a seminar on theories of punishment. They want to move beyond the typical debates (retributivism vs consequentialism vs restorative justice) and instead focus on what a theory of punishment must deliver to be practically applicable. Specifically, they need five requirements that any adequate theory must meet to construct a punishment scale for sentencing commissions. 

  The requirements must handle attempt crimes, strict liability offenses, and corporate fines, without collapsing deserved punishment into optimal punishment. The user also wants me to identify which pair of requirements likely conflict and which single requirement eliminates most standard theories.

  Hmm, this is interesting. The user is clearly frustrated with abstract academic debates and wants concrete, operational criteria. They're looking for something that forces classmates to engage with practical implementation challenges. The mention of "deathmatch" suggests they want provocative material to stimulate debate. 

  First, I need to distill what makes a punishment theory "actionable" for sentencing commissions. The key is translating philosophical principles into measurable outputs. The constraints (attempts, strict liability, corporations) are clever because they expose weaknesses in pure theories. 

  For Requirement 1: Scaling severity. Any theory must quantify punishment proportionally to harm and culpability, but must also handle attempts where harm is absent. This immediately challenges pure consequentialism. 

  Requirement 2: Non-circular value assignment. Fines can't just be arbitrary numbers - we need objective anchors like financial impact equivalence. This tackles corporate punishment and prevents hand-waving. 

  Requirement 3: Culpability independence. Strict liability offenses force us to punish without moral blame. Theories can't dodge this by pretending culpability exists where it doesn't. 

  Requirement 4: Harm-crime decoupling. Attempts require punishing incomplete crimes as severely as completed ones if culpability is equal. Retributivism struggles here because no harm occurred. 

  Requirement 5: Justification beyond optimization. The theory must explain why deserved punishment differs from what deterrence would prescribe. This blocks consequentialist sleight-of-hand. 

  Now the conflict: I suspect Requirement 4 (equal punishment for attempts) and Requirement 3 (punishing strict liability without culpability) can't coexist. The first demands culpability focus, the second requires punishment without it. That tension will explode in seminar discussions. 

  The knockout punch? Requirement 5. It forces theories to show their cards - most either reduce desert to utility (consequentialism) or ignore outcomes entirely (some retributivism). Neither survives operational scrutiny. 

