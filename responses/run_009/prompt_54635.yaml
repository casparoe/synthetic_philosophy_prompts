answer: |-
  Here’s a philosopher-economist’s dissection of your stalled debate, structured to meet your demands for rigor and actionable insight:

  ### 1. Diagnosis: A Clash of Bedrock Intuitions Masked as Empirical Disagreement  
  **Core Issue**: Both camps share the *same facts* but interpret them through irreconcilable assumptions about **human malleability under abundance**. This is not primarily empirical or semantic but *foundational*.  

  - **What "Wrong Economics" Says**:  
    > *"The pre-plateau fall in hours (mid-20th century) proves satiation *is* possible; the post-1980s plateau proves institutions hijacked abundance for positional races. If gains were equally distributed, we’d see Keynes’ psychology emerge."*  
    → **Hidden Premise**: Human nature is *institutionally contingent*—wants *would* quiet under true abundance if not distorted by inequality.  

  - **What "Wrong Psychology" Says**:  
    > *"The plateau *is* the smoking gun: even with 4–8x higher real incomes, hours didn’t fall further. Relative needs dominate *when* absolute needs are met—Keynes’ ‘moral transformation’ is a fantasy."*  
    → **Hidden Premise**: Human nature is *fixed*—relative competition is non-negotiable; no institutional fix can induce satiation.  

  **Why This Isn’t Empirical/Semantic**:  
  - Both cite the *identical* hour-trend data but anchor it to opposing priors. No new dataset (e.g., finer inequality metrics) would resolve this because:  
    - Institutionalists would argue observed behavior is *distorted* (not revealing true preferences).  
    - Psychologists would argue it *reveals* true preferences.  
  - "Solving the economic problem" isn’t semantically disputed—both agree it means satiating absolute needs. The fight is over whether humans *would* stop working if satiated (institutional view) or *couldn’t* due to rivalry (psychological view).  

  **Verdict**: **Bedrock intuition clash** about whether abundance triggers contentment (malleability) or escalates rivalry (fixedness).  

  ---

  ### 2. Verdict on the "Performance" Interpretation: The Same Disagreement, One Layer Down  
  The "it’s a polemic" reading isn’t a separate dispute but a **meta-conflict over how to handle Keynes’ authority** when reality diverges from his prediction.  

  - **Institutional Camp’s Implicit View**:  
    Dismissing it as "just a performance" *absolves institutions* by implying Keynes wasn’t seriously modeling anthropology—thus protecting their belief that the psychology *could* have worked.  
  - **Psychological Camp’s Implicit View**:  
    Rejecting the "performance" label *protects their critique* of Keynes’ anthropology—if it wasn’t a real forecast, their "he was wrong" argument evaporates.  

  **Key Insight**: Both sides need Keynes to have *meant* the prophecy literally—one to blame institutions for corrupting it, the other to blame his psychology. Calling it a "performance" undermines both projects. This is **collateral damage from the core disagreement**.  

  ---

  ### 3. What Would Count as Progress: Reframing and Indirect Tests  
  Since bedrock intuitions resist direct falsification, progress requires:  

  #### A. **Conceptual Distinction: Two Kinds of "Satiation"**  
     - **Absolute Satiation**: "Enough" for survival/dignity (agreed by both).  
     - **Positional Satiation**: "Enough" to feel superior (impossible by definition).  
     → Force both camps to specify *which* satiation Keynes’ "solution" requires. Institutionalists must argue that *absolute* abundance suffices for contentment; Psychologists must show why *positional* hunger inevitably dominates.  

  #### B. **Evidence That Forces a Dilemma**  
     - **Natural Experiments**: Study subgroups with institutionalized abundance (e.g., trust-fund heirs, universal basic income trials).  
       - *Example*: If UBI recipients in Finland reduced work but reported *increased* status anxiety, it undermines Institutionalists. If they became content artisans, it undermines Psychologists.  
     - **Historical Precedents**: Examine elites (e.g., aristocrats pre-Industrial Revolution) who had abundance but embraced leisure *or* status competition.  
       - *Key Question*: Did their institutions/culture *channel* rivalry into non-work domains (supporting Institutionalists) or did workaholism persist (supporting Psychologists)?  

  #### C. **Reframing the Question: From "Who’s Right?" to "Under What Conditions?"**  
     Ask: **"What institutional/cultural filters determine *whether* abundance triggers contentment or rivalry?"**  
     - This shifts focus from unfalsifiable anthropology to *contingencies*.  
     - Forces Institutionalists to specify *which* policies (e.g., wealth taxes, luxury consumption bans) could enable satiation.  
     - Forces Psychologists to explain why *no* institution could ever suppress rivalry.  

  #### Why Progress is Possible (But Hard):  
  The core disagreement is *not* truly unfalsifiable—it’s just insulated. The right evidence (e.g., a society with equal abundance where work hours plummet *without* rising status conflict) *could* break the deadlock. Until then, demanding testable mechanisms from both sides exposes whose assumptions are more ad hoc.  

  ### Final Summary  
  - **Diagnosis**: Bedrock clash over human (im)malleability.  
  - **Performance Debate**: A proxy war over Keynes’ authority.  
  - **Path Forward**: Isolate contingent factors (via conceptual distinctions and targeted evidence) to force engagement beyond intuition.  
  **Your hypothesis was correct—and now it’s time to weaponize it**.
