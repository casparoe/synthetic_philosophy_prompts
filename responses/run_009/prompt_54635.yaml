  The user's hypothesis seems spot on. Both sides agree on the facts—productivity rose, hours fell then stalled—but interpret them differently based on their core assumption about human nature. The institutional camp thinks wants can be satisfied if distribution is fixed; the psychological camp sees relative wants as inherent and unchangeable. This is a clash of bedrock intuitions, not something easily resolved with current data.

  Next, the interpretation debate. The member calling the essay a polemic isn't entirely wrong—Keynes was countering pessimism—but dismissing it as just performance ignores his concrete predictions. The camps' reactions show this is an extension of their main conflict: the institutional side might see it as avoiding structural critiques, while the psychological side sees it as dodging their argument about innate drives. It's the same disagreement one layer down.

