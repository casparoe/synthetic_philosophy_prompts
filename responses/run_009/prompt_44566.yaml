  Beyond these cases, I need to consider structural requirements: extension agreement with finite cases, permutation/location invariance, transitivity, completeness, non-arbitrariness, and nontriviality. These all seem necessary but I suspect they can't all be satisfied simultaneously. Specifically, I foresee clashes between partial-sum dominance, completeness, and permutation invariance - perhaps what's known as an "infinite aggregation trilemma."

  For desiderata, I'll identify five core requirements: Nontriviality as absolutely essential since the grantmaker needs actionable guidance; Extension Agreement to maintain consistency with finite cases; Permutation Invariance for fairness; and Partial-Sum Dominance for respecting finite prefixes. I'll also include Pareto as a preference rather than requirement since it conflicts in Gamma-shift. Completeness should be marked as a preference too since insisting on it forces arbitrary choices.

  The biggest exclusionary desideratum will be Partial-Sum Dominance - it automatically rules out theories that declare all infinite worlds equal or rely solely on averages. When evaluating existing approaches, total utilitarianism fails permutation invariance and partial-sum dominance, while lexical threshold views struggle with completeness and may violate extension agreement through arbitrary cutoffs.

