prompt: |-
  so this is kind of an awkward ask but here goes. I teach intro epistemology at a mid-sized state school, and this semester I've had a bit of a come-to-jesus moment: I was grading papers and realized I'd gotten lazy about checking the AI's summaries of articles I hadn't reread in years — I was grading students partly on the authority of a chatbot's account of Frank Jackson's knowledge argument, which, if I'm honest, I could no longer reconstruct from scratch myself. And then a student came to office hours and said she's stopped doing the reading because she "understands it better" from the AI's explanations, and I genuinely didn't know what to tell her, because what's the difference between what she does and what I do? So I want to put epistemic dependence on AI on the final, and I want it to be a question that actually has some bite.

  Here's the thing I keep running into and want the question to force students through: the obvious move is "outsourcing to AI = bad, you lose understanding," but that can't be the whole story, because we outsource tons of stuff without it being epistemically corrosive. I offloaded arithmetic to a calculator decades ago and nobody thinks that destroyed my understanding of math (or at least not in a way that matters). I also can't fix my own car, or grow my own food, and the standard division of cognitive labor handles all that fine through testimony and trust norms. So the interesting question is what, if anything, is different about AI. My own hunch is it's something like: the calculator gives me answers to a kind of question I can still independently verify and whose failure modes I understand, whereas the AI gives me *explanations* — the very thing that was supposed to be my job — and I can't tell good ones from fluent garbage without already having the understanding I'm outsourcing. But maybe that hunch is wrong, or maybe it proves too much (the same thing was said about books, and about Wikipedia, and those seem fine?). Also I've been reading a bit about extended mind stuff and I can't decide if "the AI is part of my mind now" is a serious answer or a dodge that makes the problem worse by definition.

  So: write me ONE essay question for a 45-minute final exam slot, plus a model answer of around 500-600 words, plus a marking scheme out of 20 that separates an A answer from a B answer by naming the specific moves each contains. The question must NOT be answerable by reciting "AI causes skill atrophy" or "critical thinking is important" platitudes — I want it to force the student to actually produce some criterion or test that sorts benign offloading from corrosive offloading, and then stress-test that criterion against at least one case where it gives the wrong verdict (calculator, books, expert testimony, whatever works). The question should give them a concrete scenario to chew on rather than being fully abstract — maybe something like a student who uses the AI to generate practice problems vs. a student who uses it to explain the readings, or feel free to invent something better, I'm not attached to that. One more constraint: since this is a final and I have limited space on the exam, keep the question itself to under 120 words.

  Also if you have any thoughts on whether I should tell my student to go back to doing the reading, I'm all ears, but that's not the deliverable — the exam question, model answer, and marking scheme are. Don't worry about citing specific papers, this is intro level and I'm not testing their bibliography, just whether they can think. I'll adapt whatever you give me to my course's numbering scheme etc., so don't fuss over formatting too much.
reasoning: |-
  Okay, let me tackle this professor's request for an epistemology exam question on AI dependence. The user teaches intro epistemology and wants to push students beyond surface-level critiques of AI. They've identified a core tension: why is offloading to AI potentially problematic when we routinely offload other cognitive tasks (calculators, experts) without issue? 

  Breaking this down:
  First, the user's personal struggle is relatable - realizing they've been grading based on AI summaries of Jackson's knowledge argument they no longer fully recall. Then a student claims AI explains better than readings, creating genuine pedagogical uncertainty. This frames the problem beautifully: when does epistemic dependence become corrosive?

  Key requirements for the question:
  - Must force distinction between benign/corrosive offloading
  - Needs concrete scenario (not abstract)
  - Must block "skill atrophy" platitudes
  - Requires stress-testing against counterexamples (calculators etc.)
  - Under 120 words
  - With model answer and detailed rubric

  The calculator comparison is crucial. Why is arithmetic offloading acceptable but explanation offloading suspect? My initial thought aligns with the user's hunch: calculators give verifiable answers to well-defined problems, while AI generates explanations whose validity requires pre-existing understanding to assess. But as they note, similar critiques were made about books/Wikipedia - so how is AI different? Maybe it's about the opacity of the process? Or the illusion of understanding?

  Extended mind theory complicates things - if AI is just another cognitive tool, why single it out? But labeling it "part of my mind" might dodge responsibility. This needs to appear in the model answer's complexity.

  For the scenario: contrasting two students could work well. Student A uses AI solely for practice problems (verifiable outputs), Student B for conceptual explanations (unverifiable without baseline knowledge). This crystallizes the calculator/explanation dichotomy. 

  Model answer should:
  1) Acknowledge offloading isn't inherently bad
  2) Propose criteria (e.g. "verifiability without expertise" for benign cases)
  3) Stress-test against books (which also provide explanations)
  4) Conclude with AI's unique risks: fluency without depth, no error signaling

  Rubric must reward:
  - Avoiding platitudes
  - Specific differentiation attempt
  - Counterexample engagement
  - Original thought beyond lecture material

  For the student advice: quietly adding that while not required, I'd suggest framing reading as building "verification muscle" - you need enough baseline to spot AI hallucinations. But that's just an aside.

  This needs to be tight - intro students might struggle with the nuance, but the scenario should ground it. Final tweak: mention Jackson explicitly in the scenario to tie back to the user's guilt moment. That personalizes it.
answer: |-
  Here’s a complete exam package designed to force critical engagement with epistemic dependence on AI, avoiding clichés and demanding nuanced criteria:

  **Exam Question (114 words):**  
  > "Student A uses ChatGPT only to generate physics practice problems (which she solves manually). Student B uses it to explain Kant’s transcendental idealism, then paraphrases the explanation in essays. Both claim this optimizes their learning. Using the epistemology of testimony and cognitive offloading, argue whether one case is more epistemically problematic than the other. *Crucially*: Propose a criterion distinguishing ‘benign’ vs ‘corrosive’ reliance on AI. Stress-test your criterion against calculators (e.g., arithmetic) or books (e.g., trusting a textbook explanation). Does your criterion condemn common epistemic practices, or absolve problematic AI use? Defend your answer."

  ---

  **Model Answer (560 words):**  

  The critical difference lies in **whether the tool outputs *verifiable* content without requiring the very expertise it’s meant to supplement**. Student A’s use is benign: AI-generated physics problems are inert until *she* solves them. The answers are independently checkable (via her own calculations or answer keys), and failure modes are transparent (e.g., wrong answers reveal gaps). Crucially, the AI doesn’t *explain* concepts—it poses tasks testing her understanding. This mirrors calculator use: calculators compute results, but users must still *interpret* them within a mathematical framework they grasp. Offloading computation doesn’t erode understanding because the user retains authority over meaning and application.  

  Student B’s case is corrosive. AI explains Kant—a task demanding interpretive nuance—yet B lacks the expertise to verify the explanation’s quality *without already understanding Kant*. Unlike calculators, AI produces assertions about meaning, not calculable outputs. B’s paraphrasing risks "fluent misunderstanding": absorbing a superficially coherent but incorrect account. This creates an **epistemic feedback loop** where the tool’s output is only verifiable by the competence it’s replacing.  

  My criterion: **Reliance is benign when the user can (1) validate outputs without prior mastery of the target domain, and (2) clearly distinguish the tool’s functional role (computation/data retrieval) from interpretive judgment.**  

  Stress-testing against books: One might argue textbooks also "explain." But books differ critically: they’re vetted by identifiable experts/editors, making testimony traceable (Goldman 2001). Readers also engage critically via citations, cross-referencing, and institutional credibility—norms absent in monolithic AI outputs. If my criterion condemns books, it’s because unchecked trust in *any* source is risky—but books embed social-epistemic safeguards AI lacks.  

  Stress-testing against calculators: Arithmetic offloading passes the criterion. Verifying "2 + 2 = 4" requires minimal numeracy, not advanced math. Calculators handle computation; users handle conceptual framing. AI explaining Kant collapses this division: it performs the interpretive labor itself.  

  However, my criterion *could* absolve problematic AI use if outputs are easily verifiable (e.g., "Summarize this week’s syllabus"). Conversely, it condemns "explanatory offloading" even by experts if they suspend judgment—but this is correct. Experts using AI for explanations *should* cross-check against their knowledge, just as mathematicians verify calculator results on critical tasks.  

  Thus, Student B’s approach is more problematic. It replaces the *process* of building understanding (grappling with primary texts) with outsourced interpretation she can’t audit. This isn’t mere "skill atrophy"—it’s surrendering the epistemic agency needed to evaluate the tool’s reliability in the domain. AI becomes less a tool than an unchallengeable oracle.

  ---

  **Marking Scheme (Out of 20):**  

  **A (18-20):**  
  - Clearly distinguishes Student A/B using **specific epistemic concepts** (testimony, verification, fluency/comprehension trade-offs).  
  - Proposes a **novel, non-circular criterion** for benign/corrosive reliance (beyond "understanding loss").  
  - **Stress-tests criterion effectively**: Shows how calculators/books *do or don’t* satisfy it, and grapples with counterexamples (e.g., "Does this mean trusting *any* explanation is corrosive?").  
  - Notes **AI’s unique opacity** (vs. books’ social testimony structure or calculators’ limited scope).  
  - Addresses the **feedback loop problem** (inability to verify without expertise).  

  **B (15-17):**  
  - Identifies key differences between A/B but **lacks conceptual precision** (e.g., vaguely critiques B as "less active").  
  - Offers a criterion but **fails to stress-test thoroughly** (e.g., mentions calculators but doesn’t explain *why* they fit/defy the criterion).  
  - **Superficially engages counterexamples** (e.g., "Books are fine because they’re reliable" without examining *why*).  
  - Recognizes AI’s fluency risks but **doesn’t tie to epistemic responsibility**.  

  **C (12-14):**  
  - Repeats question details with **minimal analysis**; conflates A/B cases.  
  - **Criterion is underdeveloped or circular** (e.g., "AI is bad when it does the thinking for you").  
  - **Ignores counterexamples** or mentions them perfunctorily.  
  - **Falls back on platitudes** ("Critical thinking is important").  

  **D/F (≤11):**  
  - Misrepresents scenarios; no coherent criterion.  
  - No engagement with counterexamples.  
  - Unsubstantiated claims about AI.  

  ---

  **Brief thought on your student:** Tell her to resume reading—but *frame it as building "verification capacity."* Explain: "AI explanations *feel* clearer because they mask complexity. But without engaging primary texts, you lack the baseline to spot AI’s errors or biases. Like trusting a calculator without knowing multiplication tables, you won’t know when it’s wrong—and with philosophy, errors are rarely as obvious as '2+2=5'." This turns your epistemic criterion into pedagogical advice.
