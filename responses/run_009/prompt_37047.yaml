prompt: |-
  Act as a professional philosopher of science with a strong background in both evolutionary biology and theories of cultural change, and think carefully before answering, perhaps beginning with some private brainstorming about how the analogy between genes and ideas is supposed to work.

  I'm a software engineer with no formal training in philosophy, and I've come to hold a fairly strong version of cultural evolutionism: ideas, tunes, practices, and fashions are "memes" — units that replicate by hopping from mind to mind, vary as they spread, and are differentially selected in ways that explain their spread and persistence better than any story about what the ideas are "for." On this view, a catchy tune or a viral slogan survives because it is good at getting copied, not because it is useful or true, and much of human culture is best described as an evolving population of such replicators. I like the view because it demystifies things: culture doesn't need grand purposes, just inheritance, variation, and selection.

  Tell me what would count against it. I'd like to know what observations, cases, or arguments should move me, sorted by how decisive they'd be — from fatal through serious to merely awkward. I'm especially interested in whether the view risks nothing at all: if any pattern in culture can be redescribed after the fact as "whatever got selected, got selected," is that a problem for a view of this kind, or just a normal feature of selection-based explanations? Where you can, point to kinds of evidence that a committed memeticist would themselves concede as counting against the view — not just what its critics claim. Please avoid bibliographies and citations; explain the considerations in plain language instead.
