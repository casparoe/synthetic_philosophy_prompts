  First, I need to recall the main theories on slurs. Semantic approaches say the derogation is part of the word's meaning. Pragmatic theories argue it's about context and intent. Hybrid models combine both. Then there's licensing, which is about who has the social permission to use the term. The user's examples have different nuances, so a single theory might not cover everything, but a hybrid approach could work best.

