prompt: |-
  I write about science and ideas for a mid-size outlet, and for the last few months a lot of my reporting has been on policy decisions with ugly tradeoffs: who gets the last ICU bed, whether a city should take on a flood risk in one neighborhood to spare two others, whether to accept a small number of serious vaccine injuries to prevent a large number of deaths. In interview after interview I keep running into the same shape of argument from the public-health people and the economists: line up the outcomes, count them up, and go with whichever option has the bigger total. The math is never really the issue. What I keep hearing back from the people on the losing end — and honestly from my own gut sometimes — is something like: okay, the total is bigger, but you're adding up things that happen to different people, and nobody gets to live the total. The woman whose house floods doesn't experience the two dry neighborhoods. The patient who doesn't get the bed isn't somehow consoled by the strangers who do. And it's not a majorities thing either — Ive seen the same pushback in one-on-one cases, where one identifiable person is asked to absorb a loss so that two identifiable people get a slightly bigger combined gain.

  Let me try to state the shape of the complaint as precisely as I can, because I think there are a few things it is NOT. It's not "your numbers are wrong." It's not the ordinary rights objection, because the objectors will often say they'd accept the exact same loss if it were part of some scheme where the burdens rotate or get spread around fairly over time — what they reject is the idea that a loss to one person can just be cancelled out by gains landing on someone else, as if they went into a single pot. And it's not a complaint about inequality as such — the totals could come out equal and I think the objection would still be doing some work, though I'm honestly not sure. There's also a version of this I've wondered about for a single person: if I can suffer a lot at 30 and gain a bit at 60, that seems like a different kind of arithmetic than the cross-person case, and I don't know whether the complaint I'm describing is supposed to cover it or not.

  So: does this exact complaint have an established name in philosophy? I've heard "tyranny of the majority," but that's about voting and factions, not about the adding-up itself, so it doesn't feel right. If there is a settled term I want to use it correctly in my piece, and I want to understand the carving, not just the label — what exactly the concept picks out, what its nearest neighbours are and how it differs from each (rights-talk, inequality aversion, plain anti-consequentialism), and whether it extends to the within-one-life case or only across people. If the honest answer is that there's no single settled term for the specific thing I've described, then say so and coin one, with a definition and the boundary cases where it would and wouldn't apply. Please don't just hand me a name — I need to know I'm not lumping three different complaints together. And end your reply with a final line in the form "Verdict: <the term, or 'no established term'> — <one sentence saying exactly what it covers>".
reasoning: |-
  Okay, the user is a science and ideas writer dealing with policy decisions involving tough trade-offs. They've noticed a recurring argument from experts (public health, economists) who advocate for maximizing total utility—essentially adding up outcomes and choosing the option with the bigger sum. But they're encountering pushback from affected individuals (and their own gut feeling) that this approach feels wrong because losses and gains affect different people. The user wants to know if there's a philosophical term for this specific objection.

  Hmm, the user has done a great job isolating the core complaint: it's not about miscalculations, rights violations, inequality, or general anti-consequentialism. They've identified key nuances—people might accept the same loss if it's part of a fair rotation system, but object to "canceling out" one person's loss with another's gain. They're also curious if this applies to trade-offs within a single life.

  First, I need to map this to philosophical concepts. The obvious starting point is utilitarianism's "separateness of persons" critique. Rawls explicitly called out utilitarians for treating society like a single person, ignoring that burdens and benefits fall on distinct individuals. Nozick's "utilitarianism for animals, Kant for people" quote fits perfectly here—it captures the moral asymmetry between cross-person and intra-person aggregation.

  But is there a more precise term? "Aggregation problem" is close but too broad. "Interpersonal compensation objection" gets the cancellation aspect right. Bernard Williams' "integrity objection" touches on the personal sacrifice angle but feels broader. "Distributive injustice" might sneak in, but the user insists it's not about inequality per se.

  The within-life question is tricky. Parfit's non-identity problem and continuity of identity debates are relevant, but the standard view is that personal identity over time makes self-sacrifice fundamentally different—consent and unified agency matter. The user's example of suffering at 30 for gain at 60 would likely fall outside this objection.

  Verdict-wise, "separateness of persons" seems closest to established terminology, but needs unpacking. The user needs to avoid conflating it with adjacent concepts. Key differentiators: it's not rejecting consequentialism wholesale, nor complaining about inequality, but specifically denying that Person A's gain can morally offset Person B's loss. For their article, pairing it with "interpersonal compensation" as a descriptor would help precision. 

  Final call: no perfect single term exists, but "separateness of persons" (with context) is the anchor. The reply should emphasize how this differs from majority tyranny (procedural) and plain inequality (distributive). And clarify that the within-life case is a separate debate—personal identity bridges the compensation.
answer: |-
  Based on your precise description, here's the breakdown of the philosophical landscape for your complaint:

  1.  **The Core Complaint:** The fundamental objection is that aggregating gains and losses *across different persons* to determine a "net benefit" is morally illegitimate. Gains to one person cannot morally compensate for losses to another. The separateness of persons creates a barrier to this kind of interpersonal summation for moral justification.

  2.  **The Established Anchor: "Separateness of Persons"**
      *   **Term:** This is the most established and directly relevant philosophical concept framing your complaint.
      *   **Origin & Key Thinkers:** John Rawls (*A Theory of Justice*) explicitly used this term to criticize utilitarianism. Robert Nozick (*Anarchy, State, and Utopia*) famously stated utilitarianism "does not take seriously the distinction between persons." Derek Parfit (*Reasons and Persons*) explored its implications deeply, though sometimes challenging it.
      *   **What it Picks Out:** It highlights that society is not a single conscious entity experiencing the sum total of utility. Morality must respect the fact that individuals are distinct bearers of rights, interests, and experiences. Sacrificing one for the net benefit of others treats individuals as mere containers for utility, not as separate ends-in-themselves (a Kantian echo).
      *   **Boundary: NOT Anti-Consequentialism.** It targets a *specific flaw* within consequentialist aggregation (especially utilitarianism), not consequentialism itself. A consequentialist could accept this constraint (e.g., prioritizing equal distribution, adopting a sufficiency threshold).
      *   **Boundary: NOT Rights-Talk.** While related (rights often protect separateness), the core complaint is more fundamental: the *arithmetic itself* is invalid *because* persons are separate. Rights violations are often a *consequence* of ignoring separateness.
      *   **Boundary: NOT Inequality Aversion.** As you noted, the objection persists even if net gains/losses are distributed equally. It's about the *wrongness of interpersonal cancellation*, not the shape of the distribution.
      *   **Boundary: NOT Tyranny of the Majority.** That's about power dynamics and oppression of minorities *within a decision-making process* (like voting). This is about the *moral logic of justification*, regardless of the process or the size of groups. An expert making a one-on-one decision based on net gain faces this objection.

  3.  **Related Terms & Concepts:**
      *   **"The Aggregation Problem" / "Interpersonal Comparisons of Utility":** These are broader terms covering the *difficulty* of adding utilities across persons, often focusing on measurement. Your complaint is a specific *moral* critique *presupposed* by these problems: that even *if* measurement were perfect, the summation would still be illegitimate.
      *   **"Interpersonal Compensation Objection":** This is a very precise description of your complaint. Gains to B *cannot compensate* A for A's loss. It's not a settled *label* like "Separateness of Persons," but it's an accurate phrase used in technical philosophy (e.g., discussions of Scanlon, Temkin).
      *   **"The Integrity Objection" (Bernard Williams):** While related (focusing on how demanding consequentialism can violate personal integrity/projects), it's broader and more agent-centered than the specific complaint about interpersonal summation for victims.
      *   **"Distributive Injustice":** Too broad. Your complaint is a *reason why* certain aggregative justifications lead to perceived injustice, even in the absence of clear inequality.

  4.  **The Within-One-Life Case:**
      *   **Distinct Concept:** The complaint about interpersonal aggregation *does not directly apply* to trade-offs within a single life. This is crucial.
      *   **Why?** A single person *is* a unified entity over time (assuming standard continuity of consciousness/identity). Gains and losses *are* experienced by the same subject. Sacrifice now for benefit later is a rational and common form of prudence. The *separateness* barrier doesn't exist.
      *   **Philosophical Nuance:** Debates exist about personal identity over time (Parfit) and whether future selves are truly "the same" person, potentially challenging this. However, the *standard view* and the intuitive force of your described complaint strongly differentiate the two cases. The objection you're reporting *is not* primarily about discounting the future or uncertainty; it's fundamentally about *who* experiences the loss vs. the gain. Within one life, it's the *same* "who."

  **Verdict: Separateness of Persons (with "Interpersonal Compensation" as descriptor) — No established single term perfectly captures *only* the complaint about interpersonal cancellation of losses by gains, but "Separateness of Persons" is the established conceptual anchor identifying the fundamental reason *why* this cancellation is seen as morally illegitimate, differentiating it clearly from concerns about inequality, rights violations, or tyranny of the majority, and distinguishing it from trade-offs within a single life.** 

  **For your writing:** Use "the separateness of persons" as the core concept. Explain it explicitly: "This objection stems from the philosophical concept of the 'separateness of persons' – the idea that gains to one individual cannot morally cancel out losses to another, because society isn't a single entity experiencing the net sum." You can add: "It's a rejection of interpersonal compensation." Avoid using it as a mere label; define it as you have here. The within-life case requires separate treatment if discussed.
