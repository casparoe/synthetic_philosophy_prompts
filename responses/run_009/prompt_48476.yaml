answer: |-
  Here’s your complete mock exam package, designed to force engagement with the exact split Dez highlighted. I’ve kept it grounded in your swatch row and made the model answer plainspoken but precise.

  ---

  **Essay Question (45-minute target):**  
  "Dez argues that supervaluationism is 'just epistemicism with extra steps' because, on every precisification of your coffee shop’s 100-paint-swatch row (from cream to orange), the sentence 'There is a swatch *n* that is orange while swatch *n*+1 is not orange' comes out true. He claims this means supervaluationism secretly commits to a sharp cutoff just like epistemicism does, even if it hides which one. Evaluate Dez’s objection. Does supervaluationism’s treatment of this existential claim ('There is a last orange swatch') meaningfully distinguish it from epistemicism, or is it merely epistemicism repackaged? Use the swatch row to explain the key difference (or lack thereof) in how each theory handles the *truth* of this existential claim versus the *truth* of any specific instance (e.g., 'Swatch 61 is the last orange one')."  

  ---

  **Model Answer (approx. 600 words):**  

  Dez’s objection feels intuitive but misses the *kind* of truth supervaluationism assigns to the existential claim "There is a last orange swatch." While both theories agree this sentence is true, they disagree fundamentally on *what makes it true* – and this exposes why supervaluationism isn’t just epistemicism in disguise.  

  Start with epistemicism: It says "orange" has a perfectly sharp boundary in reality, fixed by usage or natural properties. So, exactly *one* specific pair of adjacent swatches (say, swatch 74 is orange, swatch 75 is not) makes the existential claim "There is a last orange swatch" true. We can’t know which pair it is (hence "epistemic"), but one specific *n* objectively has the property "last orange." The truth of the existential claim depends entirely on the hidden, singular fact about *that particular n*. Dez is right that epistemicism has a sneaky cutoff – but it’s not sneaky to the theory; it’s central, just unknowable.  

  Supervaluationism works differently. It says "orange" is inherently vague; no single sharp boundary is correct. Instead, we consider all *precisifications* (or "sharp sharpenings") consistent with how we use "orange." On *each* precisification, "orange" gets a sharp boundary: On precisification A, swatch 50 might be the last orange; on precisification B, swatch 60; on precisification C, swatch 70, etc. Crucially, **every** precisification draws *some* line.  

  Now, the existential claim: "There exists an *n* such that swatch *n* is orange and swatch *n*+1 is not." Is this true? For supervaluationism, a sentence is *supertrue* if it’s true on **every** precisification. Look at the existential claim: On *every single precisification*, there *is* some specific *n* where the cutoff happens. So, on precisification A, the claim is true because *n*=50 works; on B, because *n*=60 works; on C, because *n*=70 works. Since it’s true on every way we could sharpen the concept, the existential claim is **supertrue**.  

  But here’s where Dez’s objection breaks down: While the existential claim is supertrue, **no specific instance** (e.g., "Swatch 61 is the last orange one") is supertrue. Why? Because no single *n* is the cutoff on *every* precisification. Swatch 61 is the last orange on *some* precisifications, but not on others (where, say, 60 or 62 is last). For *any specific n*, there’s a precisification where it’s *not* the boundary. So, "Swatch 61 is the last orange" is true on some precisifications but false on others – making it neither supertrue nor superfalse. It’s *indeterminate*.  

  This is the decisive split from epistemicism:  
  -   For the **epistemicist**, the existential claim is true *because* one specific *n* is objectively the boundary (we just can’t find it). Truth requires a single, hidden fact.  
  -   For the **supervaluationist**, the existential claim is true *without* any specific *n* being objectively special. Its truth comes from **the structure of the precisifications** – the fact that *every* acceptable sharpening has *a* cutoff *somewhere*, even though *which* cutoff varies. The truth-maker isn’t a hidden fact about the world; it’s a feature of the meaning of "orange" itself.  

  So, is supervaluationism just epistemicism with extra steps? **No.** Epistemicism insists there *is* a single, correct, sharp boundary (we’re ignorant of it). Supervaluationism denies this: the boundary isn’t sharp *in reality*; sharp boundaries are tools we use to understand vagueness. The existential claim being supertrue doesn’t mean there’s a sneaky real cutoff; it means the concept’s vagueness *requires* that a cutoff exists in every coherent way we could make it precise. Dez conflates the existence of cutoffs *across* precisifications (which supervaluationism uses) with the existence of *one true* cutoff (which only epistemicism believes). The difference isn’t in steps; it’s in whether vagueness is ignorance (epistemicism) or a lack of fact of the matter (supervaluationism).  

  ---

  **Marking Scheme (20 Marks Total):**  

  1.  **Clear Epistemicism Explanation (3 marks):**  
      *   States epistemicism posits one unknowable sharp boundary.  
      *   Notes the existential claim’s truth depends *only* on this hidden boundary.  
      *   *Common botch:* Says epistemicism denies any boundary exists or confuses it with degree theories.  

  2.  **Clear Supervaluationism Explanation (4 marks):**  
      *   Defines precisifications/admissible sharpenings.  
      *   Explains supertruth = true on all precisifications.  
      *   Correctly states existential claim is supertrue because *every* precisification has *some* cutoff.  
      *   *Common botch:* Claims supervaluationism says the existential claim is "vague" or true "on average."  

  3.  **Crucial Split: Existential vs. Specific (6 marks):**  
      *   **Must explicitly state:** Existential claim ("There is an *n*...") is supertrue. **(2 marks)**  
      *   **Must explicitly state:** No specific instance ("*n*=61 is the boundary") is supertrue (because no *n* is boundary on *all* precisifications). **(2 marks)**  
      *   Explains *why* this is different from epistemicism: For epistemicist, one specific *n* *is* the true boundary (making existential true); for supervaluationist, no specific *n* is privileged. **(2 marks)**  
      *   *Common botch:* Claims supervaluationism says the specific instance is "false" or conflates indeterminacy with falsity. Fails to contrast the *source* of truth for the existential claim between theories.  

  4.  **Addressing Dez's Objection (5 marks):**  
      *   Acknowledges Dez’s point: On every precisification, the existential claim is true (via that precisification’s cutoff). **(1 mark)**  
      *   Explains *why* this doesn’t mean supervaluationism has a "sneaky" cutoff: The cutoffs are *only* features of individual precisifications, not reality; no *single n* is the real boundary. **(2 marks)**  
      *   Contrasts the *truth-maker*: For epistemicist, truth relies on one hidden fact; for supervaluationist, truth relies on the structure of all precisifications. **(2 marks)**  
      *   *Common botch:* Simply re-states the theories without engaging *why* Dez's reasoning is flawed. Agrees with Dez without justification.  

  5.  **Conclusion & Overall Coherence (2 marks):**  
      *   Clear verdict: Meaningful difference exists (or not, if argued well – though model argues yes).  
      *   Concise summary of the core distinction (ignorance vs. lack of fact).  
      *   *Common botch:* Repeats intro without synthesis or ends abruptly.  

  ---

  **Confidence & Grain of Salt:**  

  *   **Overall Confidence: High (90%).** The core distinction between "truth requires a single hidden fact" (epistemicism) and "truth requires consistency across all precisifications without a single fact" (supervaluationism) is solid and well-established. Using the existential claim vs. specific instance as the battleground is classic (see Keefe, Williamson).  
  *   **The Least Confident Part:** **The phrasing of the supervaluationist "truth-maker" (Model Answer, paragraph 5).**  
      *   *Why I'm less sure:* Saying the truth-maker is "the structure of the precisifications" or "a feature of the meaning" is intuitive but risks sounding metaphysical or platonistic. A strict supervaluationist might prefer: "The sentence is supertrue *because* the rules governing admissible precisifications guarantee that each one has a cutoff point, not because of any worldly fact about a specific *n*." Hardcore formalists might grumble about "structure" implying something extra.  
      *   *Grain of Salt Needed:* Emphasize that supervaluationism is primarily a *semantic* or *logical* account of truth for vague language, not necessarily a deep metaphysical claim about reality. The key takeaway is the *denial* of a unique fact, not a positive claim about what exists instead. Focus the group on the contrast: *One true n* (E) vs. *No true n, but the existential holds due to how meaning works* (S). Dez's objection fails because he mistakes the *consequence* of the semantic rules (cutoffs exist on precisifications) for the *ontological commitment* (a real, unique cutoff) that only epistemicism makes.  

  This setup forces engagement with the central puzzle Dez raised. A student who just recited "Epistemicism: sharp boundary unknowable; Supervaluationism: supertruth!" would flounder. They *have* to grapple with *how* the existential claim can be true without a specific instance being true and *why* that matters. Good luck with the exam – and save me a virtual brownie!
