  (3) My credence it arises through voluntary coordination (to avoid destruction) rather than conquest/tech dominance is **30%**, as historical power consolidation favors dominance.  
  (4) My credence that control *only* over existential risks (not everyday governance) qualifies as a singleton is **15%**; decisive power requires comprehensive authority per Bostrom’s definition.  
  (5) My overall credence (item 1) is most sensitive to **item 3 (voluntary vs. conquest)**. Evidence of robust global coordination mechanisms (e.g., enforceable AI treaties) would raise it to ~45%; proof of irreversible multipolar AI fragmentation would lower it to ~20%.
