prompt: |-
  Heres a question I keep going back and forth on and I want an actual number out of you, not vibes. Bostrom's singleton hypothesis -- roughly the idea that at some point you get a single decision-making agency with decisive power at the highest level of world order -- how likely is it that this happens within the next 150 years, conditional on humanity avoiding extinction? Answer as exactly five numbered items, no intro and no conclusion, each item a sentence or two, and please use American English: (1) your overall credence, (2) your credence that AI is the most plausible route to a singleton versus slower paths like treaty-based coordination or one power simply winning an arms race, (3) your credence that it comes about through voluntary coordination to avoid mutual destruction rather than conquest or technological winner-take-all, (4) your credence that an arrangement which only holds decisive power over existential risks while leaving everyday governance decentralized would even count as a singleton in the relevant sense, and (5) which of the previous items your overall number is most sensitive to, plus what evidence or argument would move it the most. Don't hedge on me, I want rough numbers even if you're unsure.
