prompt: |-
  I sit on the publications committee of a state archaeological institute that must sign off on the interpretive wording of final site reports before they go to press. We're stuck on a genuinely hard case, and I've been asked to draft the circulated recommendation. I'd like you to write that draft for me.

  The case: excavations at a Late Neolithic settlement (a single-period village, houses with beaten clay floors, no written records of any kind) recovered a group of eleven fired-clay figurines from a deposit under the floor of one house. Most are standing figures with pinched heads and no faces; three were found headless with the breaks looking fresh rather than abraded; one was deposited inside a grain bin and another at the threshold stone. Domestic debris, querns, and charred grain were found throughout the house, so the occupation context is ordinary. The excavators propose that the published report describe the figurines as "images of a grain goddess" and the deposit as a "household shrine," and say the breaking of the figurines was "a ritual act of deliberate destruction before burial." Two committee members disagree: they hold that the most we can responsibly print is that figurines were made, used, deposited, and in some cases broken, since every claim beyond that rests on analogy to other prehistoric sites or to much later or distant cultures whose religious content we also only know through the same kind of circular reasoning. Our director has told the committee he wants a decision, not a compromise that hedges every verb.

  Please draft the memo. Structure it under these headings, in this order, at roughly these lengths:

  1. "The case before the committee" — ~120 words, stating exactly what wording is at issue and what the two positions are.
  2. "The case for the excavators' reading" — ~250 words, making the strongest honest argument that the cult interpretation is warranted, including what the find's configuration (placement in the grain bin, at the threshold, fresh breaks) could legitimately support and what principle of inference from objects to beliefs it relies on.
  3. "The case for the conservative reading" — ~250 words, developing the strongest version of the skeptics' position: not a blanket refusal to infer, but a principled account of why inferences about technology and subsistence are on firmer ground than inferences about what prehistoric people believed, and why the analogy to better-documented cultures imports the very content it is supposed to establish.
  4. "Where the burden of proof lies" — ~150 words, on who should have to argue what: whether the excavators owe us a route from material evidence to religious content, or whether the skeptics owe us a reason the ordinary interpretive tools of our discipline (configuration of finds, spatial patterning, cross-cultural regularities) should be suspended here.
  5. "Recommendation" — ~200 words, giving concrete final wording: one sentence as it should appear in the site report, one sentence for the public exhibit label, and a ruling on the phrase "ritual act of deliberate destruction" (accept, revise, or reject — with the actual replacement language).

  The memo should be usable by colleagues who will vote on it, so the reasoning must be one they could accept or contest on the merits. Do not treat the conservative members as timid or the excavators as credulous; each position should come out of this looking like the serious view it is. No bibliography — cite no literature and name no scholars; the memo is to stand on the reasoning alone.
reasoning: |-
  Okay, let me approach this archaeological publication dilemma systematically. The user needs a balanced committee memo resolving an interpretive dispute about Neolithic figurines, with strict structural requirements. 

  First, I'll analyze the core conflict: the excavators want to label these as "grain goddess" artifacts in a "household shrine" with "ritual destruction," while skeptics demand minimal description of observable facts. Both positions have merit - one relies on contextual patterns and cross-cultural analogy, the other warns against projecting unverifiable beliefs onto material culture.

  For section 1, I'll neutrally frame the contested phrases and both positions in under 120 words. The key is showing neither side is unreasonable - excavators aren't fantasizing, skeptics aren't obstructionist.

  In section 2 (pro-excavators), I'll build the argument around three legs: spatial context (grain bin/threshold as intentional placement), physical evidence (fresh breaks indicating pre-deposition damage), and analogical reasoning (recognizable cross-cultural patterns in domestic ritual). Must emphasize these are standard archaeological inference tools, not speculation.

  For section 3 (pro-skeptics), I'll stress the epistemological gap: we can reconstruct how objects were made/used but not what they meant to people without textual evidence. The circularity risk in analogies needs highlighting - using later cultures' interpretations to explain earlier artifacts when those interpretations themselves rest on similar circular reasoning.

  Section 4 about burden of proof is tricky. Archaeology inherently involves interpretation, so the default should favor contextual reading, but extraordinary claims (like specific goddess attribution) need extraordinary evidence. The fresh breaks and placement patterns meet the threshold for suggesting ritual, but "grain goddess" overreaches.

  Finally, the recommendation will split the difference: keep "deliberate destruction" based on break evidence, use "ritual significance" instead of "shrine," and avoid specific deity attribution. Public labels can mention "possible ritual use" with clear hedging. This respects both evidentiary standards and narrative needs.

  The tone throughout must be collegial - this committee has to keep working together. I'll avoid any hint that either position is naive or dogmatic.
answer: |-
  **MEMORANDUM**  
  To: Publications Committee, State Archaeological Institute  
  From: [Your Name], Committee Member  
  Subject: Recommendation on Interpretive Wording for Site Report 2024-07 (Late Neolithic Settlement)  
  Date: [Date]  

  ---

  ### 1. The case before the committee (~120 words)  
  The committee must decide on interpretive language for eleven fired-clay figurines recovered from beneath a house floor at the Late Neolithic settlement. The excavators propose describing these as "images of a grain goddess," the deposit as a "household shrine," and the breakage as "a ritual act of deliberate destruction before burial." Two members oppose this, arguing that only observable actions (manufacture, use, deposition, breakage) should be stated, as further claims rely on unverifiable analogies to distant or later cultures. The director has directed a definitive ruling, rejecting ambiguous compromise language.  

  ---

  ### 2. The case for the excavators' reading (~250 words)  
  The excavators’ interpretation rests on three contextual pillars. First, the *spatial configuration*: figurines were placed deliberately at liminal or functionally significant points (threshold, grain bin), suggesting intentional association with protection or fertility. Second, the *condition of the artifacts*: three headless figures with fresh (non-abraded) breaks indicate breakage occurred immediately before deposition, inconsistent with accidental damage or discard. Third, *cross-cultural regularity*: recurrent patterns in domestic ritual behavior—such as dedicatory deposits in foundational/transitional spaces, or breakage of figurines in termination rites—provide a logical framework. This inference is not arbitrary but aligns with established archaeological practice: when objects cluster in non-utilitarian contexts (e.g., not in middens) with features suggesting care (e.g., placement, fresh breaks), ritual significance is a parsimonious conclusion. The grain bin placement specifically supports an agrarian association; while "goddess" implies personification, it is shorthand for a perceived protective or symbolic force linked to subsistence. The interpretation thus relies on material patterns (placement, treatment) and analogical reasoning grounded in widespread ethnographic and archaeological precedents for domestic votive behavior.  

  ---

  ### 3. The case for the conservative reading (~250 words)  
  The conservative position contends that while inference is inherent to archaeology, claims about *belief* require higher scrutiny than those about *practice*. We can reliably infer technological processes (e.g., figurines were molded, fired, broken) and spatial behaviors (deliberate placement under floors). However, assigning religious meaning—especially specific terms like "goddess" or "shrine"—exceeds the evidence. A "grain bin" is a functional feature; placing an object there may denote storage, concealment, or disposal, not necessarily veneration. "Fresh breaks" confirm breakage preceded deposition but do not specify intent; breakage could result from termination rituals *or* non-ritual discard (e.g., decommissioning toys). Crucially, analogies to other cultures (e.g., Near Eastern "mother goddess" cults) risk importing external concepts: those interpretations themselves often rest on similar circumstantial chains of inference, creating circularity. Without direct evidence of ritual (e.g., altars, repeated iconography, associated sacrificial remains), the leap from "figurines in a house" to "shrine" conflates possibility with probability. The conservative view does not reject ritual as a category but insists that labeling requires either contextual uniqueness (e.g., distinct structure, recurring symbolic assemblages) or independent corroboration absent here.  

  ---

  ### 4. Where the burden of proof lies (~150 words)  
  The burden lies with the excavators to demonstrate that religious interpretation is the *most justified* conclusion, not merely a plausible one. While spatial patterning and artifact treatment are legitimate grounds for inference, the committee must weigh whether "ritual" is uniquely supported versus other explanations (e.g., symbolic but non-religious acts; functional discard). The skeptics do not demand "proof" but seek to ensure that analogies are not self-validating. Here, the threshold placement and fresh breaks reasonably suggest *purposeful* deposition, inviting ritual as a hypothesis. However, "goddess" and "shrine" impose additional layers of meaning (divine personification, sacred space) requiring stronger evidence than configuration alone provides. The skeptics must show why alternative readings are equally viable, but the excavators bear responsibility for substantiating the specificity of their claims.  

  ---

  ### 5. Recommendation (~200 words)  
  **For the site report:**  
  *"Eleven deliberately deposited clay figurines, some placed at functionally significant locations (threshold, grain bin) and three with pre-depositional breakage, suggest ritual activity associated with household life."*  

  **For public exhibit labels:**  
  *"These figurines, found beneath a house floor and in a grain bin, may reflect rituals linked to protection or harvest—though their exact meaning remains uncertain."*  

  **Ruling on "ritual act of deliberate destruction":**  
  **Revise.** Replace with: *"deliberate breakage prior to deposition."*  
  *Rationale:* "Ritual act" overstates the evidence, as intent, though plausible, is inferential. "Deliberate breakage" (supported by fresh breaks) is defensible; "prior to deposition" is observable. This maintains the excavators’ core insight while acknowledging the ambiguity of "ritual." "Goddess" and "shrine" are rejected: they impose unverifiable specificity. The revised language accepts ritual as a reasonable inference from spatial/behavioral patterns but constrains it to the evidence of intentionality and non-utilitarian treatment. This respects both the excavators’ contextual analysis and the skeptics’ methodological caution.  

  ---  
