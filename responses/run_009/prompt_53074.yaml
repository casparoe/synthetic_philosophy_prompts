  I need to address both doubts thoroughly. The first is about the consultant's leap from ancestral life to modern workplaces - just because status was visible in small bands doesn't mean public rankings would be motivating today. The second doubt concerns epistemology - how can we really know what motivated our ancestors? The fossil record doesn't preserve social dynamics.

