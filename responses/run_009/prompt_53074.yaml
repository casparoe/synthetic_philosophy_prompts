prompt: |-
  I'd appreciate advice on a proposal being floated at my company. A consultant has recommended that we scrap our annual performance reviews and instead display live leaderboards around the office, ranking every employee's current output. His reasoning is that our ancestors lived in small bands where each member's standing was on display to all, that we are therefore built to find continuous status monitoring motivating, and that modern firms go wrong only because they hide this information. Senior management is impressed precisely because the argument is grounded in our evolutionary past rather than in management fashion. I have to submit written comments by Friday, and I have two nagging doubts I can't quite articulate: first, even if the story about ancestral bands were exactly right, I'm not sure it would establish what he needs it to establish; second, I can't see how anyone would ever go about checking whether that story is right in the first place. Are these doubts well-founded, and if so, could you spell out precisely where the argument goes wrong and what my comments might say? Please respond in British English, in continuous prose only, without headings, bullet points, bold text, or tables — the way one would write an email.
