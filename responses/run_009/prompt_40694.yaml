prompt: |-
  I've just been made performance manager at a mid-sized regional transit authority, and our board has decided to move to "performance-informed budgeting": every department's next funding cycle will partly depend on a scorecard of metrics that I'm tasked with designing. I'm wary, because everyone I talk to has a Goodhart story — the last agency that paid drivers for on-time performance found buses quietly skipping stops or idling at terminals just long enough to reset their clocks, and fare inspectors who were told to prioritize "interactions per shift" started carding the same easy commuter stations rather than the problem routes. I've read enough to know there's actually a useful taxonomy hiding behind the slogan: the kind of Goodhart's law where you select on a noisy proxy and the noise gives out (regressional), the kind where you push into a region of the proxy that never contained real quality (extremal), and the kind where the metric itself causes the behavior that destroys it (causal / specification gaming). I want those distinctions in the procedure, not just the proverb.

  Please turn all of that into a procedure I can actually run when a department proposes a new metric for the scorecard. I need an ordered set of questions an analyst with no philosophy background can apply in an afternoon: what to check about how the metric was validated, how to reason about what the metric is a proxy for and where the proxy relation is only locally valid, how to anticipate the gaming strategies available to the people being measured (including ones that are individually rational and hard to call misconduct), and what a sufficient mitigation looks like — paired metrics, sampling audits, capped incentives, or refusing to attach money at all. Mark clearly which steps produce a defensible no, which steps are judgment calls dressed up as procedure, and where the procedure has to hand the decision back to me or the board because the question is one of values. Then run it on three live proposals from our current draft scorecard: (1) bus on-time performance with a 2% budget bonus attached, (2) a "customer satisfaction" score from an SMS survey sent after each ride, and (3) track-maintenance departments scored on "number of defects closed" by quarter-end. On the last one I expect the procedure to flag something specific and unwelcome, and I'd rather hear it now than after the maintenance backlog shows up in a derailment report — so tell me what the procedure says even when it's inconvenient, and say plainly what the procedure cannot do.

  For context on constraints: the board meets quarterly and will not accept "we couldn't find a good metric" as an answer more than once or twice before they design metrics themselves without me, so the procedure needs a sanctioned way to decline that doesn't read as obstruction. Analysts have two weeks per review cycle, we can't afford more than a small pilot or audit budget per metric, and the transit workers' union is represented on the committee that signs off — anything that reads as surveillance theater will die in committee even if it's methodologically sound. I want the procedure honest about that political surface too: a step is useless to me if following it guarantees the whole scorecard gets voted down.
reasoning: |-
  We are designing a procedure to evaluate proposed metrics for performance-informed budgeting. The procedure should be applied by analysts and should help avoid the pitfalls of Goodhart's Law. We'll break it down into an ordered set of questions, with clear indications of which steps can lead to a "defensible no", which are judgment calls, and which require escalation.

  The steps:

  1. **Clarify the Intended Outcome (Values Question)**
     - What is the ultimate outcome the department is trying to achieve? (e.g., safe, reliable, efficient transit service)
     - *Note: This step is about understanding the goal. If the goal is unclear or contested, it's a values question that must be escalated to the board or the manager.*

  2. **Define the Metric's Claimed Relationship to the Outcome**
     - How is the metric a proxy for the intended outcome? (e.g., on-time performance is a proxy for reliability and customer satisfaction)
     - What evidence or reasoning supports that the metric is a valid proxy? (e.g., studies, expert opinion, internal data analysis)
     - *Judgment call: The analyst must assess the strength of the evidence. If there is no evidence or the link is weak, this may be a defensible reason to reject the metric unless the department can provide more support.*

  3. **Assess the Risk of Goodhart's Law by Type**
     - **a. Regressional Goodhart (noisy proxy):** How noisy is the metric? (i.e., how much does it vary due to factors unrelated to the outcome?) 
       - Check: What is the known error rate, or what are the main sources of noise? (e.g., for on-time performance, traffic conditions can cause variation that isn't under the driver's control)
       - Mitigation: Consider adjusting for confounding factors (e.g., adjust for traffic) or using a more direct measure. If the noise is too high, the metric may be rejected.
     - **b. Extremal Goodhart (pushing beyond the valid region):** What is the range of the metric where it remains a valid proxy? 
       - Check: Are there known conditions under which the metric stops correlating with the outcome? (e.g., if on-time performance is pushed too high, it might lead to unsafe driving or skipped stops)
       - Mitigation: Cap the metric (e.g., don't reward beyond 95% on-time) or set a safe operating range.
     - **c. Causal Goodhart (gaming):** How might the metric be gamed? 
       - Brainstorm specific gaming strategies (e.g., for on-time performance, skipping stops, or idling at terminals). 
       - Consider: Are there ways to game that are hard to detect or not clearly misconduct? (e.g., a bus driver might avoid a busy stop to stay on time, which isn't technically against the rules but harms service)
       - Mitigation: Paired metrics (e.g., on-time plus a measure of skipped stops), audits, or decoupling incentives (e.g., non-monetary recognition).

  4. **Check for Practical Feasibility and Cost**
     - How expensive or burdensome is it to collect the data? 
     - Is the data collection method prone to manipulation? (e.g., self-reported data might be less reliable)
     - *Defensible no: If the cost is too high relative to the benefit, or if the data cannot be collected reliably, reject the metric.*

  5. **Design Mitigations**
     - Propose specific mitigations for the identified risks (from step 3). 
     - Examples: 
       - Paired metrics: e.g., if you measure on-time, also measure customer complaints about skipped stops.
       - Sampling audits: Random checks to validate the data.
       - Capped incentives: Avoid pushing the metric to extremes.
       - Decoupling: Use the metric for information only, not for budget allocation.
     - *Judgment call: The analyst must decide if the mitigations are feasible and sufficient. If not, the metric may be rejected.*

  6. **Political and Operational Viability**
     - Will the metric and its mitigations be acceptable to stakeholders (e.g., the union, the board)? 
     - Is there a risk of perceived surveillance or unfairness? 
     - *Escalation: If the metric is likely to be rejected by the committee due to political reasons, escalate to the manager for a decision on whether to proceed, modify, or drop.*

  7. **Recommendation**
     - The analyst provides a recommendation: 
       - Approve as is.
       - Approve with mitigations (specify which).
       - Reject (with clear reasons from steps 2, 3, 4, or 5).
       - Escalate (if it's a values question or political impasse).

  **Defensible No's**: 
  - From step 2: No evidence or weak link to the outcome.
  - From step 3a: The metric is too noisy and cannot be adjusted.
  - From step 3b: The metric's valid range is too narrow to be useful for incentives.
  - From step 3c: The gaming risks are too severe and cannot be mitigated with feasible controls.
  - From step 4: The metric is too expensive or infeasible to collect.

  **Judgment Calls**:
  - Steps 2, 3 (all parts), and 5 require analyst judgment.

  **Escalation**:
  - Step 1: If the outcome is unclear or contested (values).
  - Step 6: If the metric is technically sound but politically unviable.

  Now, let's apply this procedure to the three proposals:

  ### (1) Bus on-time performance with a 2% budget bonus attached

  **Step 1: Intended Outcome**
  - Outcome: Reliable service (buses arriving on schedule) leading to customer satisfaction.

  **Step 2: Metric-Outcome Relationship**
  - Claim: On-time performance is a direct measure of reliability.
  - Evidence: Industry standard, strong correlation with customer satisfaction in transit studies.
  - *Judgment: Strong link, so acceptable.*

  **Step 3: Goodhart Risks**
     - a. **Regressional**: Noise from traffic, weather, passenger loading. These are not under the driver's control. 
       - Mitigation: Adjust for factors beyond control (e.g., use a model that accounts for traffic conditions) or use a more stable measure (e.g., adherence to schedule on a typical day).
     - b. **Extremal**: If pushed beyond 95-98%, drivers might skip stops or drive unsafely. 
       - Mitigation: Cap the bonus at 95% on-time.
     - c. **Causal**: Gaming by skipping stops, idling at terminals, or not waiting for connecting passengers. 
       - Mitigation: Pair with a metric of skipped stops (from GPS or passenger counts) and customer complaints. Also, use GPS data to verify idling.

  **Step 4: Feasibility**
  - Data is already collected via GPS, so low cost.
  - *Feasible.*

  **Step 5: Mitigations**
  - Cap the bonus at 95% on-time.
  - Pair with:
     - Metric 1: Number of skipped stops (from automated systems or random audits).
     - Metric 2: Customer complaints about skipped stops or safety.
  - Also, random audits of GPS data to verify on-time calculation.

  **Step 6: Political Viability**
  - Union might object to GPS surveillance. Mitigation: Use aggregated data for the metric, not individual monitoring. Explain that the paired metrics protect against unfair blame (e.g., adjusting for traffic). 
  - *Judgment: With mitigations, likely acceptable.*

  **Step 7: Recommendation**
  - Approve with mitigations: cap at 95%, pair with skipped stops metric and customer complaints, and random audits.

  ### (2) Customer satisfaction score from an SMS survey sent after each ride

  **Step 1: Intended Outcome**
  - Outcome: Improve overall customer experience and service quality.

  **Step 2: Metric-Outcome Relationship**
  - Claim: Direct measure of customer perception.
  - Evidence: Surveys are a standard method. However, response rates may be low and biased (only happy or very unhappy riders respond). 
  - *Judgment: Link is direct but potentially noisy due to low response rates and bias.*

  **Step 3: Goodhart Risks**
     - a. **Regressional**: Noise from self-selection bias, survey timing, and external factors (e.g., weather affecting mood). 
       - Mitigation: Adjust for known biases (e.g., by weighting) or increase response rates (e.g., incentives).
     - b. **Extremal**: If pushed too high, might lead to begging for high scores (e.g., drivers asking riders to give 5 stars) or only surveying during off-peak times. 
       - Mitigation: Cap the bonus and ensure random sampling.
     - c. **Causal**: Gaming by only sending surveys to riders on pleasant routes, or at times when satisfaction is high. Also, drivers might pressure riders for high scores. 
       - Mitigation: Ensure surveys are sent randomly and anonymously. Pair with objective metrics (e.g., on-time, cleanliness).

  **Step 4: Feasibility**
  - SMS surveys are low cost. But low response rates might require incentives (cost increases). Also, might not reach all demographics (e.g., elderly without phones).
  - *Feasible but with limitations.*

  **Step 5: Mitigations**
  - Randomize survey distribution and cap incentives.
  - Pair with objective metrics (e.g., on-time performance, cleanliness audits).
  - Monitor response rates and demographics to adjust for bias.

  **Step 6: Political Viability**
  - Union might object if drivers are pressured to get high scores. Mitigation: Make the survey about the service, not the driver (if possible). 
  - *Judgment: If the survey is about the overall ride and not the driver, it might be acceptable.*

  **Step 7: Recommendation**
  - Approve with mitigations: random distribution, cap on incentives, and pairing with objective metrics.

  ### (3) Track-maintenance departments scored on "number of defects closed" by quarter-end

  **Step 1: Intended Outcome**
  - Outcome: Safe and reliable track infrastructure.

  **Step 2: Metric-Outcome Relationship**
  - Claim: More defects closed means better maintenance and safer tracks.
  - Evidence: Closing defects directly addresses known problems. However, not all defects are equal (some are critical, some are minor). Also, closing many minor defects might not improve safety if critical ones are left open.
  - *Judgment: Weak link if the metric doesn't account for severity. Without weighting by severity, it may not reflect true safety.*

  **Step 3: Goodhart Risks**
     - a. **Regressional**: Noise from variation in defect severity and type. 
       - Mitigation: Weight defects by severity (e.g., critical = 5, minor = 1).
     - b. **Extremal**: If pushed to close as many defects as possible, maintenance might focus on easy, minor defects and neglect hard, critical ones. 
       - Mitigation: Require a minimum number of critical defects closed.
     - c. **Causal**: Gaming by:
          - Prioritizing minor defects to boost numbers.
          - Delaying reporting of defects until the next quarter to avoid a high count in the current quarter (if the metric is quarterly).
          - Quick fixes that don't last (requiring rework).
          - *Note: This is the specific and unwelcome risk you anticipated.*
       - Mitigation: 
          - Weight defects by severity and criticality.
          - Pair with a metric of critical defects remaining open (or the ratio of critical to total defects closed).
          - Include a quality check (e.g., defects reopened within a month count negatively).

  **Step 4: Feasibility**
  - Data on defects is already tracked. Weighting by severity requires a classification system (which might exist). 
  - *Feasible with adjustments.*

  **Step 5: Mitigations**
  - Use a weighted count (by severity) instead of raw count.
  - Pair with:
     - Metric 1: Number of critical defects remaining open at quarter-end.
     - Metric 2: Reopened defects (indicating poor quality fixes).
  - Cap the bonus to avoid pushing for too many minor fixes.

  **Step 6: Political Viability**
  - Union might object if it leads to pressure for quick fixes. Mitigation: Emphasize quality and safety by including the paired metrics. 
  - *Judgment: With mitigations, it may be acceptable.*

  **Step 7: Recommendation**
  - Do not approve the raw count. Approve only if modified to a weighted count and paired with metrics for critical defects remaining and quality (reopened rate). 

  **What the procedure cannot do**:
  - It cannot eliminate all gaming; it can only reduce the risk.
  - It cannot resolve fundamental values conflicts (e.g., if the board wants to prioritize cost-cutting over safety, the procedure can flag the safety risk but not decide).
  - It cannot guarantee that the mitigations will be implemented effectively without adequate resources (e.g., for audits).

  **On the unwelcome finding for (3)**:
  The procedure flags that using a raw count of defects closed will incentivize closing easy, minor defects while neglecting critical ones. This could lead to a growing backlog of critical defects, increasing the risk of a derailment. The mitigations are essential.

  **Sanctioned way to decline without obstruction**:
  - The procedure allows a "defensible no" based on:
     - Weak evidence of link to outcome (step 2).
     - Unmitigatable gaming risks (step 3c).
     - Infeasibility (step 4).
  - The analyst can document these reasons and suggest alternatives (e.g., a different metric or a modified version). This shows due diligence and offers a path forward.

  **Final Note**: The procedure requires analysts to think critically about each metric and not just accept them at face value. It also builds in political awareness to avoid non-starters. However, it relies on the analyst's judgment, so training and supervision will be important.
answer: |-
  Below is a step-by-step procedure for evaluating proposed performance metrics, designed to be run by an analyst with no philosophy background in a single afternoon (4-6 hours). The procedure is structured as a checklist with clear decision points, mitigations, and escalation paths. It explicitly flags:  
  - **🔴 Defensible No**: Steps where a rejection can be justified with evidence.  
  - **🟡 Judgment Call**: Steps requiring analyst discretion (document reasoning).  
  - **🔵 Escalate**: Steps where values, resources, or politics require manager/board input.  

  The procedure prioritizes **practicality**: Mitigations must fit within a small pilot/audit budget, avoid "surveillance theater," and align with union/board constraints.  

  ---

  ### **Metric Evaluation Procedure**  
  **Input**: Proposed metric, incentive structure (e.g., budget bonus), and department justification.  
  **Output**: Approve, Approve with Mitigations, Reject, or Escalate.  

  #### **Step 1: Define the True Outcome**  
  - **Question**: What is the *ultimate goal* this metric claims to support? (e.g., safety, efficiency, equity.)  
  - **Checks**:  
    - Does the department’s documentation explicitly link the metric to a core agency priority (e.g., "reliability" in strategic plans)?  
    - Is there disagreement among stakeholders on what the goal *should* be?  
  - **Decision**:  
    - 🔵 **Escalate** if the outcome is ambiguous, contested, or misaligned with agency values (e.g., "customer satisfaction" vs. "equity of access").  
  - **Time**: 30 mins (review strategic docs, interview proposer).  

  #### **Step 2: Validate Proxy Relationship**  
  - **Question**: Is there evidence this metric *actually correlates* with the true outcome?  
  - **Checks**:  
    - **Data History**: Plot metric vs. outcome (e.g., "on-time performance" vs. "ridership growth") for the past 2 years. Weak/no correlation → high risk of *regressional Goodhart* (proxy noise dominates).  
    - **Context Limits**: Identify where the proxy breaks down (e.g., "on-time performance" may not correlate with safety in blizzards).  
  - **Mitigations**:  
    - If noisy, require a *paired metric* (e.g., "on-time performance" + "safety incidents").  
    - If context-limited, add *range caps* (e.g., no bonus if >98% on-time).  
  - **Decision**:  
    - 🔴 **Defensible No** if no historical correlation and department can’t provide new evidence.  
    - 🟡 **Judgment Call** on strength of correlation (use simple R² or expert input).  
  - **Time**: 60 mins (data pull + basic scatter plots).  

  #### **Step 3: Anticipate Gaming**  
  - **Question**: What are the easiest ways to game this metric without triggering misconduct flags?  
  - **Checks**:  
    - **Causal Goodhart**: Brainstorm 3+ "rational gaming" tactics (e.g., for "defects closed": prioritizing quick cosmetic fixes over critical repairs).  
    - **Extremal Goodhart**: Test if pushing the metric to extremes breaks the proxy (e.g., "customer satisfaction" scores → 100% if only happy riders are surveyed).  
  - **Mitigations**:  
    - **Paired metrics** (e.g., "defects closed" + "critical defects outstanding").  
    - **Random audits** (e.g., 5% of "closed" defects spot-checked quarterly).  
    - **Decouple incentives** if gaming risk is high (e.g., use metric for diagnostics only, no budget tie).  
  - **Decision**:  
    - 🔴 **Defensible No** if gaming tactics are catastrophic (e.g., safety risks) and mitigations exceed budget.  
    - 🟡 **Judgment Call** on gaming likelihood (use past incidents or industry benchmarks).  
  - **Time**: 90 mins (brainstorm + mitigation costing).  

  #### **Step 4: Test Feasibility & Costs**  
  - **Question**: Can we measure this accurately within budget without union/board opposition?  
  - **Checks**:  
    - **Data Collection**: Cost to gather/verify data (e.g., manual audits > $5k? → reject).  
    - **Stakeholder Fit**: Does the metric feel like "surveillance"? (Union red flags: individual penalties, real-time tracking.)  
  - **Mitigations**:  
    - Use sampling (e.g., audit 10% of buses) or existing data (e.g., GPS instead of self-reports).  
  - **Decision**:  
    - 🔴 **Defensible No** if costs exceed pilot budget (>$2k) or union rep vetoes in committee preview.  
    - 🔵 **Escalate** if board prioritizes metric despite costs/objections.  
  - **Time**: 60 mins (budget calc + informal union/stakeholder soundings).  

  #### **Step 5: Recommend & Document**  
  - **Question**: Do the benefits outweigh risks after mitigations?  
  - **Output**:  
    - **Approve** if: Strong proxy link + low-cost mitigations + stakeholder buy-in.  
    - **Approve with Mitigations** if: Risks exist but are contained (e.g., paired metrics + caps).  
    - **Reject** if: Defensible No triggered (document evidence).  
    - **Escalate** if: Values conflict or board pressure forces a suboptimal choice.  
  - **Time**: 30 mins (compile report).  

  ---

  ### **Applying the Procedure to Your Draft Metrics**  
  **Context**: Union reps on committee → avoid individual penalties or intrusive monitoring.  
  **Budget**: Max $2k/pilot per metric.  

  #### **Proposal 1: Bus On-Time Performance (2% Budget Bonus)**  
  - **Step 1 (True Outcome)**: Reliability → **Aligned**.  
  - **Step 2 (Proxy Validation)**:  
    - Historical correlation strong in fair weather → **Weak in rain/snow** (regressional risk).  
    - Extremal risk: >95% on-time linked to skipped stops (per your example).  
  - **Step 3 (Gaming)**:  
    - Tactics: Skipping crowded stops, idling to "reset" clocks.  
    - Mitigation: **Paired metric** (e.g., "% stops served") + **cap bonus** at 95%.  
  - **Step 4 (Feasibility)**:  
    - GPS data exists → low cost. Union accepts if not driver-level.  
  - **Recommendation**: ✅ **Approve with Mitigations**: Cap bonus at 95% + add "% stops served" metric. Audit 5% of routes quarterly ($1k).  

  #### **Proposal 2: Customer Satisfaction via Post-Ride SMS Survey**  
  - **Step 1 (True Outcome)**: Service quality → **Aligned but vague** (🔵 Escalate: Is goal satisfaction or equity?).  
  - **Step 2 (Proxy Validation)**:  
    - Self-selection bias: Unhappy riders don’t respond → **Weak correlation** to true sentiment (regressional).  
    - Extremal risk: Staff pressure riders to rate highly.  
  - **Step 3 (Gaming)**:  
    - Tactics: Surveying only off-peak routes, "friendly reminder" nudges.  
    - Mitigation: **Randomize sampling** + **decouple incentives** (use for feedback only).  
  - **Step 4 (Feasibility)**:  
    - SMS cost low ($500), but union opposes if tied to driver pay.  
  - **Recommendation**: 🟡 **Judgment Call**: Approve as **diagnostic only** (no budget tie). Add equity metric (e.g., survey response rate by neighborhood).  

  #### **Proposal 3: Track Maintenance "Defects Closed" per Quarter**  
  - **Step 1 (True Outcome)**: Safety → **Aligned in theory**.  
  - **Step 2 (Proxy Validation)**:  
    - **No inherent link to safety**: Closing 100 minor defects (e.g., graffiti) ≠ closing 1 critical crack (regressional + extremal risk).  
    - Historical data: Agencies show defect counts ↑ while safety ↓ (per FTA reports).  
  - **Step 3 (Gaming)**:  
    - **Specific Unwelcome Risk**: 🔴 Staff will "game" by:  
      - Prioritizing quick, low-impact fixes.  
      - Delaying reporting of complex defects to next quarter.  
      - **Result**: Critical backlog grows → derailment risk (as you feared).  
    - Mitigation: **Require severity weighting** (e.g., critical=5 pts, minor=1 pt) + **paired metric** ("% critical defects outstanding").  
  - **Step 4 (Feasibility)**:  
    - Severity weighting requires expert input ($1.5k). Union opposes if punitive.  
  - **Recommendation**: 🔴 **Defensible No** as proposed. **Escalate alternatives**:  
    - Option A: Use "weighted defects closed" + random audits (cost: $2k).  
    - Option B: Drop metric if board won’t fund severity system.  

  ---

  ### **What the Procedure Can and Cannot Do**  
  **Can**:  
  - Surface hidden risks (e.g., the defects metric incentivizing neglect of critical repairs).  
  - Provide **defensible rejections** using data + stakeholder feedback (not "obstruction").  
  - Suggest low-cost mitigations (paired metrics, caps, sampling).  

  **Cannot**:  
  - **Eliminate gaming**: Mitigations reduce but don’t remove risk (e.g., audits can be gamed).  
  - **Resolve values conflicts**: E.g., If the board insists on "defects closed" despite risks, you must 🔵 escalate.  
  - **Fix bad metrics**: If no proxy link exists (Step 2) and no alternative is found, rejection is necessary.  

  ---

  ### **Handling Political Constraints**  
  - **When "No" is Required**: Frame as "Not viable without X" (e.g., "defects closed rejected unless severity-weighted"). Offer 1–2 alternatives to avoid "obstruction" perception.  
  - **Union Sensitivity**: Mitigations like **aggregate metrics** (not individual) and **decoupled incentives** reduce opposition.  
  - **Board Pressure**: Use 🔵 escalation to share accountability ("Board must choose: fund severity weighting or accept safety risks").  

  This procedure ensures rigorous, transparent evaluations while respecting your operational limits. It turns Goodhart’s taxonomy into actionable checks, preventing disasters like the defects backlog you anticipate.
