prompt: |-
  My roommate is really into decision theory (endless LessWrong rabbit holes, says the word "updateless" maybe forty times a day) and he's got an argument that's been bugging me for a week. Background, since he made me memorize the setups: Counterfactual mugging — Omega flips a fair coin in secret. If it comes up heads, Omega gives you $1000 iff you would have paid $100 in the tails case; if it comes up tails, you're simply asked to pay $100 for nothing. Before the flip, the policy "pay" nets you +$450 in expectation, so the updateless agent pays in the tails world. Fine, I accept that. XOR blackmail — a predictor knows whether there's damaging dirt on you (50/50) and sends you a letter iff (there's dirt XOR you would pay upon recieving a letter). If the letter shows up, you can pay $1000 to prevent publication; publication costs you $10,000; if no letter shows up and there's dirt, it just gets published anyway. Run the policies ex ante: a payer pays $1000 exactly when there's no dirt and eats publication when there is; a refuser only ever eats publication when there's dirt. Refusing comes out ahead by $500 in expectation, and my roommate agrees the updateless agent refuses. So far so good.

  Here's the part that's eating me. (1) Updatelessness just says: pick your policy before the uncertainty resolves, by expected payoff across the ways things could go, and follow it. (2) Applied to blackmail it says refuse, and the reason it says refuse is that the payer's payments never once stop a publication — a payer's letter only ever arrives in no-dirt worlds, so every dollar he pays is for nothing. (3) Now look at the mugging. In the tails world, the payment is likewise for nothing: the coin is already tails, the $1000 was never on the table, Omega's opinion of you is already fixed. (4) So if "your payments are for nothing" settles blackmail for refusing, it settles the mugging for refusing too. (5) But refusing the mugging is exactly what boring old causal decision theory says, so updatelessness only gives its fancy answers when nothing's at stake and collapses into CDT the moment things get weird. (6) Hence, he concludes, either pay both or refuse both, and since nobody sane pays the blackmailer, you should refuse the mugger too.

  Something in there is doing illegitimate work but every time I try to pin it down it squirms away on me. For what it's worth, I'd like to keep both the standard verdicts — pay the mugger, refuse the blackmailer — partly because everyone I've seen defend refusing the mugging had an axe to grind, but he's started saying I only like that pair because I've memorized the answer key. Which step should I reject, what exactly is wrong with it, and if rejecting it means biting a bullet somewhere else, I'd like to know how big the bullet is before I take it.
reasoning: |-
  We are comparing two scenarios: Counterfactual Mugging (CM) and XOR Blackmail (XB). The standard verdicts are: pay in CM and refuse in XB. Your roommate argues that both should be refused because in both cases, when you are asked to pay, the payment is "for nothing" (in CM tails world, the $1000 was never on the table; in XB, when the letter arrives, there is no dirt so publication wouldn't happen anyway). Hence, he says, updatelessness should either pay both or refuse both, and since refusing XB is sane, refuse CM too.

  But we want to keep the standard verdicts. Let's break down the argument step by step.

  Step (1): Updatelessness means choosing a policy ex ante (before uncertainty resolves) by expected payoff and then following it.

  Step (2): In XB, the updateless agent refuses because the payer's payments never stop a publication. Why? The predictor sends a letter only if (dirt XOR pay). So if you are a payer and you get a letter, then by the XOR condition: 
     - If there were dirt, then you would pay -> but the condition for sending the letter is dirt XOR pay = true XOR true = false -> so no letter. Contradiction. Therefore, if you get a letter, there is no dirt. 
     - Hence, when the payer pays, there is no dirt and publication wouldn't have happened. So the payment is for nothing.

  Step (3): In CM, in the tails world, the payment is for nothing because the coin is tails and the $1000 was never on the table. Also, Omega's opinion is fixed (so your action doesn't cause any future gain).

  Step (4): Therefore, if in XB the reason for refusing is that the payment is for nothing, then in CM tails world the payment is also for nothing, so the same reason should apply.

  Step (5): Hence, if we refuse XB, we must refuse CM. But refusing CM is what CDT does. So updatelessness would collapse to CDT in this case.

  Step (6): Therefore, we should either pay both or refuse both. Since refusing XB is sane, refuse CM.

  But note: in CM, the ex ante expectation for paying is positive. Let me recall:

  CM:
    - Heads (50%): You get $1000 if you would have paid in tails (so if your policy is to pay in tails, you get $1000). Otherwise, nothing.
    - Tails (50%): You are asked to pay $100. If your policy is to pay, you pay $100.

  So if your policy is "pay":
    - Heads: +$1000
    - Tails: -$100
    Expected: 0.5*1000 + 0.5*(-100) = 500 - 50 = $450

  If your policy is "refuse":
    - Heads: $0 (because you wouldn't have paid in tails, so Omega doesn't give you $1000)
    - Tails: $0 (you refuse to pay and nothing happens)
    Expected: $0

  So ex ante, paying gives $450 and refusing $0. Therefore, the updateless agent chooses the policy "pay" and then follows it: in tails, they pay.

  In XB:
    - There is dirt with 50% and no dirt with 50%.
    - The predictor sends a letter only if (dirt XOR pay_policy). 
      * If you are a payer (policy: pay if you get a letter), then:
          - If there is dirt: dirt XOR pay = true XOR true = false -> no letter. Then the dirt is published (cost $10,000).
          - If no dirt: dirt XOR pay = false XOR true = true -> letter sent. You pay $1000 to prevent publication (but since there's no dirt, publication wouldn't have happened anyway, so you lose $1000 for nothing).
        So in both cases: if dirt, lose $10,000; if no dirt, lose $1000. Expected loss: 0.5*10000 + 0.5*1000 = 5000 + 500 = $5500.

      * If you are a refuser (policy: refuse to pay if you get a letter), then:
          - If there is dirt: dirt XOR refuse = true XOR false = true -> letter sent. You refuse, so publication happens: cost $10,000.
          - If no dirt: dirt XOR refuse = false XOR false = false -> no letter. Then nothing happens (no cost).
        So expected loss: 0.5*10000 = $5000.

    Therefore, ex ante, the refuser has an expected loss of $5000 and the payer $5500. So the refuser is better by $500.

  Hence, the updateless agent chooses the policy "refuse" and then follows it.

  Now, the crux of the argument is that in both cases, when you are in the situation of having to pay (tails in CM, receiving a letter in XB), the payment does not prevent any harm that would have otherwise occurred (in CM tails: no $1000 to gain; in XB: no dirt so publication wouldn't occur). So why pay in one and not the other?

  The difference lies in the ex ante incentives and the counterfactual structure.

  In CM:
    - The payment in tails does not cause any immediate benefit (it's "for nothing" in the moment). However, the reason to pay in tails is because of the ex ante agreement: by committing to pay in tails, you get $1000 in heads. The payment in tails is the price you pay for the $1000 in heads. It's a transfer that is necessary to get the reward in the heads world.

  In XB:
    - The payment when you get a letter does not prevent any harm (because the letter only comes when there is no dirt). Moreover, it doesn't buy you anything in other worlds. In fact, the structure of the blackmail is such that if you pay, you end up paying in the no-dirt world (which is harmless) and you still get harmed in the dirt world (because then you don't get a letter and the dirt is published). So paying doesn't help in the dirt world and only hurts in the no-dirt world.

  So the key difference is that in CM, the payment in tails is part of a deal that gets you money in heads. In XB, the payment in the no-dirt world does not get you any benefit in the dirt world. Therefore, the payment in XB is truly for nothing, while in CM it is part of a beneficial trade.

  But the roommate's argument is that in the moment (in the tails world) the payment is for nothing. How do we reconcile?

  The updateless agent does not make decisions in the moment based on the immediate consequences. It follows the policy that was optimal ex ante. The ex ante policy for CM (pay) has a positive expected value. The ex ante policy for XB (refuse) has a lower loss than paying.

  So step (4) is incorrect: the reason for refusing in XB is not just that the payment is for nothing in the moment (though that is true), but that the entire policy of paying leads to a worse ex ante outcome. In CM, the policy of paying leads to a better ex ante outcome.

  Therefore, the updateless agent does not collapse to CDT. CDT would refuse in CM because in the tails world it sees a loss of $100 with no compensating gain (it doesn't consider the counterfactual in heads). But the updateless agent does consider the counterfactual in heads when making the policy.

  Hence, we can keep both verdicts:

    - In CM, pay in tails because the policy of paying was chosen ex ante for its overall benefit.
    - In XB, refuse when the letter comes because the policy of refusing was chosen ex ante for its lower expected loss.

  The bullet to bite is that in the moment, the payment in CM tails feels like it's for nothing, but we do it anyway because we committed to a policy that overall benefits us. In XB, we refuse because the policy of paying is worse overall.

  The roommate might push back: why is the world in which you get the benefit (heads in CM) relevant when you are in tails? The updateless agent doesn't update on the state (it doesn't condition on being in tails). It just follows the policy. The policy says: if tails, pay. So it pays.

  In contrast, CDT in CM tails would condition on being in tails and see that paying costs $100 and gains nothing (because the coin is tails and the heads world is gone). So it refuses.

  The critical point is that the updateless agent does not condition on the state when choosing the action. It conditions only on the information that the policy uses. In CM, the policy is defined for both heads and tails. The agent in tails doesn't know about the heads outcome (it's a counterfactual), but the policy is set to pay in tails to get the benefit in heads.

  In XB, the policy is defined for the event of receiving a letter. The agent with a letter doesn't know whether there is dirt or not (but in fact, if they are a payer, they know there is no dirt because of the XOR condition). However, the policy was set ex ante to refuse because the policy of paying leads to a worse outcome.

  So step (3) is correct: in both cases, the payment is for nothing in the sense that it doesn't prevent any harm that would have occurred in that branch. But the reason we pay in CM is because of the overall policy benefit, and we refuse in XB because the overall policy is worse.

  Therefore, the analogy fails because the overall policy for CM (pay) is good, while for XB (pay) is bad.

  To reject step (4): "So if 'your payments are for nothing' settles blackmail for refusing, it settles the mugging for refusing too." We reject this because the reason for refusing in blackmail is not solely because the payment is for nothing in the moment, but because the entire policy of paying is bad ex ante. In the mugging, the entire policy of paying is good ex ante.

  Hence, we can keep both standard verdicts.

  But note: the roommate might say that in the mugging, the payment in tails is still for nothing and doesn't cause the heads outcome. That's true, but it's the commitment to the policy that causes the heads outcome (if the coin had been heads). The agent in tails is just fulfilling their part of the deal.

  In blackmail, the payment in the no-dirt world doesn't cause anything in the dirt world (it doesn't prevent the publication there). So there's no cross-world benefit.

  Therefore, the bullet we bite is that we sometimes pay in situations where the payment doesn't prevent any harm, but only when that payment is part of a policy that overall has a positive expectation because it triggers benefits in other branches. We don't do it when the policy overall is negative.

  In summary: reject step (4) because the reason for refusing in blackmail is broader than just the immediate futility (it's the ex ante policy being worse), and the reason for paying in the mugging is the ex ante policy being better. The immediate futility is a symptom that is present in both, but the ex ante evaluation differs.

  This is consistent with updateless decision theory.
answer: |-
  Your roommate's argument hinges on step (4): equating the "payment for nothing" in both scenarios as a reason to refuse both. But this step misapplies the updatelessness framework by ignoring the **structural difference in counterfactual dependence** between the two problems. Let's break it down:

  ### Step-by-Step Rebuttal
  1. **Reject Step (4)**: "So if 'your payments are for nothing' settles blackmail for refusing, it settles the mugging for refusing too."  
     This is false because the mugging and blackmail have different counterfactual structures:
     - In the **mugging**, your action in the tails world *counterfactually determines* the outcome in the heads world. Omega rewards you in heads *iff* you would pay in tails.  
       - Ex ante, paying in tails is part of a trade: you sacrifice $100 in tails to gain $1000 in heads. The policy works because your commitment affects the heads outcome.  
     - In **blackmail**, your action in the letter world *does not* affect the dirt world. The predictor's letter is sent based on a pre-existing fact (dirt) and your policy.  
       - Paying when you receive a letter happens *only* in no-dirt worlds (due to the XOR condition), so it doesn't prevent harm anywhere. It's purely a deadweight loss.  

     The mugging's payment is **instrumental** (it enables a gain in another branch), while the blackmail payment is **wasted** (it buys nothing in any branch). Updatelessness cares about *ex ante* policy value, not local "for nothing" intuition.

  2. **Why Step (3) is Misleading**:  
     - Yes, in the mugging's tails world, the payment seems "for nothing" *locally* (no $1000 is possible). But step (3) ignores that this payment is *necessary* for the $1000 gain in heads.  
     - In blackmail, paying *is* truly for nothing: it doesn't alter outcomes in any branch. The publication in dirt worlds happens regardless.  

  3. **Consistency of Updatelessness**:  
     - Updateless agents choose policies based on *ex ante* expected value, then follow them mechanically.  
       - Mugging: Policy "pay" has +$450 expectation. Refusing has $0.  
       - Blackmail: Policy "refuse" has -$5000 expectation. Paying has -$5500.  
     - The agent pays in the mugging not because it expects a *local* benefit, but because it's locked into the optimal *ex ante* policy. Refusing blackmail is optimal for the same reason.  
     - This doesn't collapse to CDT. CDT *updates* on the current state (e.g., "I'm in tails, so paying gains nothing") and refuses the mugger. Updatelessness doesn't update: it follows the pre-committed policy.  

  4. **Why the Analogy Fails**:  
     - Your roommate treats "payment for nothing" as a primitive reason to refuse. But in decision theory, actions are evaluated by their *causal and counterfactual consequences across all states*.  
       - Mugging: Paying in tails causes (counterfactually) the $1000 gain in heads.  
       - Blackmail: Paying causes nothing beneficial; it's uncorrelated with preventing harm.  
     - The blackmailer's XOR condition *decouples* your payment from harm prevention. The mugger's setup *couples* your payment to a reward.  

  ### The Bullet You Bite (and Why It's Small)
  - **Bullet**: You must accept that in the mugging's tails world, you pay $100 for no *local* benefit. This feels irrational if you ignore counterfactuals.  
  - **Size of the Bullet**:  
    - Tiny: This is a standard feature of updateless/causal decision theory splits. CDT bites the opposite bullet: refusing the mugger loses $450 in expectation. Most find the updateless mugging verdict intuitive (it's why Omega problems exist).  
    - No Slippery Slope: Refusing blackmail is independently justified (paying is *objectively futile*). Paying the mugger is *subjectively rational* due to the ex ante bargain.  

  ### Core Error in the Argument
  Your roommate conflates two ideas:  
  - **Local futility**: "This payment does nothing in this world." (True in both cases.)  
  - **Global futility**: "This payment does nothing in *any* world." (True only in blackmail.)  
  Updatelessness avoids global futility by optimizing policies. The mugging payment isn't globally futile—it enables the heads payoff.  

  ### Final Verdict
  - Reject **step (4)**. The "payment for nothing" intuition doesn't generalize because it misses counterfactual dependencies.  
  - Keep the standard pair:  
    - Pay the mugger (it secures an ex ante +$450 via counterfactual trade).  
    - Refuse the blackmailer (paying is ex ante harmful and locally futile).  

  This preserves updatelessness's value: it outperforms CDT in the mugging and agrees with it in blackmail for different reasons. If your roommate insists "pay both or refuse both," point to the *structural asymmetry*: the mugging rewards pre-commitment; blackmail punishes wasted payments. 

  P.S. Tell your roommate that "updateless" isn't a magic word—it's a tool for maximizing expected utility across counterfactuals. If he disagrees, ask him: "In the mugging, does your refusal in tails *cause* Omega not to pay in heads? If yes, how?" (It does, and that’s why you pay.)
