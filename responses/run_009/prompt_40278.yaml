prompt: |-
  I'm presenting at a formal epistemology workshop next month and need Q&A prep. My paper defends the boring-sounding view that indicative conditionals are just propositions: they're true or false, they embed under negation and disjunction, they can be premises of arguments, none of this "a conditional has no truth conditions, it only has assertability conditions" business. My move against Lewis's triviality results is that they only bite if you buy the unrestricted Stalnaker thesis, and I deny it: P(A→B) = P(B|A) holds only for what I call "focused" conditionals, ones where the antecedent is a live epistemic possibility in the context. Once the antecedent gets weird -- assigned very low or zero probability, or itself embedded in another conditional -- the probability of the conditional proposition and the corresponding conditional probability come apart, and Lewis's argument never gets a grip. I've got a toy story about why the two come apart for focused conditionals specifically: when the antecedent is live you can use it as a plan, and plans is where conditional probabilities track probabilities of conditional propositions, but when it's not live the connection breaks.

  Audience: ~15 people, mostly formal epistemologists and philosophical logicians, several of whom have published on conditionals specifically, plus a couple linguists who do semantics of if-clauses. So they know this literature cold and will not be polite.

  Draft my prep sheet: the objections I'll actually get from this crowd (not the intro-philosophy ones), ordered by how much damage they'd do, each phrased the way a formal epistemologist would actually phrase it, with a two-minute reply and a note on where the reply is soft. Things they'll bring up that I know are coming: import-export ((A∧B)→C and A→(B→C) equivalent), which combined with even my restricted thesis may still give them a triviality argument, and the McGee-style counterexamples to modus ponens with nested conditionals -- but assume they'll find stuff I haven't thought of too. Include the question I'm hoping nobody asks.
reasoning: |-
  Okay, the user is prepping for a formal epistemology workshop and needs help anticipating tough Q&A for their paper. They're defending the propositional view of indicative conditionals against non-truth-conditional approaches. Their key move is restricting the Stalnaker thesis to "focused" conditionals where the antecedent is epistemically live. 

  Hmm, this is a high-stakes crowd - specialists who eat Lewis/Stalnaker/Adams for breakfast. The user clearly knows their stuff but is wisely bracing for impact. They've flagged import-export and McGee counterexamples as known pain points, but I need to think deeper about where the knives will come out.

  First, the restricted Stalnaker thesis feels vulnerable. Experts will immediately ask: "How exactly does 'focus' work as a formal constraint?" The user's "live epistemic possibility" framing is intuitive but fuzzy - does it collapse to P(A)>ε? If so, where's the threshold? And how does it handle nested conditionals where the antecedent might be live in one layer but not another? 

  Then there's the technical fallout. Import-export equivalence combined with even a restricted probability constraint could still enable triviality proofs. Bradley 2000 showed this with probabilistic modus ponens - if the user's system validates that, they're toast. Also, McGee's nested conditionals will test whether their "plan-based" story holds water when conditionals get complex.

  The linguistics angle worries me too. The user mentions linguists in attendance - they'll pounce on embedding behavior. If "if A, B" is just a proposition, why does "It might be that if A, B" feel different than "If A, it might be that B"? Dynamic semantics has tools for this that the user's view might lack.

  Biggest nightmare question: "Does your system avoid triviality while maintaining all classical inference rules?" Because if they keep full boolean logic plus any probability-conditional link, triviality might creep back in through the back door. The user's "focused" restriction needs surgical precision to avoid this.

  For replies, the user should lean into context-sensitivity. Admit the "focus" threshold is vague but argue it's a feature - actual conditionals work that way. For import-export, bite the bullet: it fails when antecedents lose focus. McGee cases? Those antecedents aren't live, so the conditionals behave abnormally. It's messy, but life is messy.

  The soft spots are real though. Their "plan" metaphor isn't formalized, and nested conditionals could break the probability tracking. Best to acknowledge these as open problems rather than overclaim. This crowd respects intellectual honesty more than airtight solutions.
answer: |-
  Here’s your Q&A prep sheet, ordered by potential damage level. I’ve included phrasing typical of formal epistemologists, concise replies, and noted soft spots. Focus on **predictable high-impact objections** and one nightmare question.

  ---

  ### **Tier 1: Existential Threats (Could Sink the Core Argument)**
  1. **"Your ‘focused’ restriction is context-sensitive and vague. How do you formally characterize ‘live epistemic possibility’? If it’s P(A) > δ for some δ>0, Lewis-style proofs reemerge for non-nested conditionals by considering subpopulations where P(A) > δ."**  
     *Reply (2 min):* "δ isn’t fixed—it’s a contextual parameter tied to the *pragmatic salience* of A, not just raw probability. Lewis’s subpopulation move assumes a single fixed probability space, but context-shifts fracture the space. The triviality proofs require universally quantifying over *all* probability measures, which my restriction blocks."  
     *Soft spot:* If pressed on how "salience" is formalized, you’ll need hand-waving (e.g., "It’s a primitive of the context model").  

  2. **"Import-export (IE) must hold for embedded conditionals to explain natural language inferences. But if IE holds and your restricted thesis applies to A→(B→C) when A∧B is live, then P(A→(B→C)) = P(C|A∧B). Combined with P(A→(B→C)) = P(B→C|A) when A is live, you get P(B→C|A) = P(C|A∧B)—which, with Stalnaker’s logic, collapses to P(C|A) = P(C|A∧B). Contradiction unless B is irrelevant."**  
     *Reply:* "I reject IE for non-focused antecedents. When A∧B is *not* live, A→(B→C) and (A∧B)→C aren’t equivalent. IE holds only when both A and A∧B are focused. Your derivation assumes IE is unrestrictedly valid—it isn’t in my system."  
     *Soft spot:* This guts classical logic for conditionals. Expect pushback: "Why do we lose IE exactly when it matters for triviality?"  

  ---

  ### **Tier 2: Major Challenges (Could Force Major Concessions)**
  3. **"McGee’s modus ponens (MP) counterexample: *(If Reagan wins, then if he’s assassinated, Bush wins) → (Reagan wins → Bush wins)*. With low assassination probability, the premise is highly assertable, but the conclusion is not. How does your view handle this without sacrificing MP or your probability constraint?"**  
     *Reply:* "In McGee’s case, the nested antecedent (assassination) is *not* focused when embedded under ‘Reagan wins’. So P(Bush wins | Reagan wins & assassination) ≠ P(if assassinated, Bush wins | Reagan wins). The outer conditional’s probability isn’t constrained by the inner conditional probability, so no contradiction."  
     *Soft spot:* If MP is preserved, why does the inference *feel* invalid? Your story must explain the intuition gap.  

  4. **"Linguistic embedding data: ‘It might be that if A, B’ behaves differently from ‘If A, it might be that B’. On your view, both embed a proposition, but dynamic semantics explains this via context update. Can your propositional account capture this without ad-hoc moves?"**  
     *Reply:* "The difference is pragmatic. ‘Might’ scopes over a conditional proposition, but its *assertion* is sensitive to the context set. ‘If A, might B’ requires evaluating B in A-worlds within the *current* context; ‘Might(if A, B)’ evaluates the entire conditional in an *expanded* context."  
     *Soft spot:* This feels like rehashing dynamic semantics without their tools. Proposing a *pragmatic* fix may seem evasive.  

  ---

  ### **Tier 3: Technical Pressures (Expose Modeling Gaps)**
  5. **"Probability dynamics: Suppose I learn ¬(A→B). On your view, this should revise P(B|A). But if P(B|A) was undefined (P(A)=0), learning ¬(A→B) *creates* a conditional probability. This clashes with Bayesian norms—how do you model this?"**  
     *Reply:* "When P(A)=0, A→B is either vacuously true or false (I take a stand!). Learning its negation restricts the probability space, *making A possible*. Then P(B|A) becomes defined post-revision."  
     *Soft spot:* Requires accepting that conditionals with P(A)=0 have truth values—unpopular outside propositionalists.  

  6. **"Does your account validate the law of conditional excluded middle (CEM): (A→B) ∨ (A→¬B)? If yes, it conflicts with your probability story (since P(B|A) + P(¬B|A) = 1, but P(A→B) + P(A→¬B) may be <1 if A is unfocused). If no, you lose a key advantage of Stalnaker’s logic."**  
     *Reply:* "I reject CEM. When A is unfocused, P(A→B) and P(A→¬B) can both be low (e.g., counterfactuals). Only when A is focused does P(A→B) ≈ P(B|A), and then CEM holds *effectively*."  
     *Soft spot:* Sacrifices a neat logical property; may complicate embeddings.  

  ---

  ### **The Nightmare Question (You’re Hoping Nobody Asks)**
  **"Let ◊ be ‘it is epistemically possible that’. Consider:  
  *(*) If A is false, then ◊(A → B)*.  
  On your view, if ¬A is true, A→B is a proposition with a truth value. But ◊(A→B) should be true iff that proposition is epistemically possible. Yet intuitively, if ¬A is known, (*) is false—we don’t think A→B could be true. How do you resolve this without trivializing epistemic modals?"**  
  *Why it’s deadly:* Forces you to either (a) abandon bivalence for conditionals with false antecedents, (b) accept absurd epistemic possibilities, or (c) make ◊ hyperintensional. All paths are costly.  
  *Draft reply:* "When ¬A is known, A is *not* epistemically live, so A→B lacks a ‘focused’ truth value. ◊φ tracks truth in epistemically possible worlds, but for unfocused conditionals, truth values are *indeterminate* in the context. So ◊(A→B) is false when ¬A is known."  
  *Damage control:* This implies truth-value gaps for unfocused conditionals—contradicting your "just propositions" slogan.  

  ---

  ### **Strategic Notes for the Trenches**
  - **Play defense on probability:** Emphasize that your restriction is *designed* to block triviality by limiting the scope of probabilistic constraints. "Lewis’s proofs show what happens when you demand universality—I deny that demand."  
  - **Concede where necessary:** "Yes, IE fails in some cases—but so does antecedent strengthening in real language. We need a logic that respects context."  
  - **Redirect to positives:** "My view *saves* modus ponens and propositional embedding without dynamic machinery. The cost is worth it."  
  - **Watch for:**  
    - Bradley’s (2000) *restricted* triviality (using Adams’ thesis + logic).  
    - Truth-value gluts for P(A)=0 cases.  
    - Requests to formalize "focus" (have a toy model ready, even if flimsy).  

  You’ve got a coherent, defensible stance. **Lean into context-sensitivity** as your shield—this crowd knows it’s unavoidable. Good luck!
