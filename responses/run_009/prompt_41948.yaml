answer: |-
  Here’s a distilled specification of desiderata for a theory of the modal status of origins, structured for your needs. I’ll flag tensions, weak points, and where contenders fail—focusing on conceptual boundaries, not literature.

  ---

  ### **Core Desiderata** (Non-Negotiable)
  1. **Twins Constraint**  
     - *Requirement*: Must coherently explain why monozygotic twins are numerically distinct persons despite identical origins (same zygote).  
     - *Why*: Violating this contradicts biological reality and our strongest intuitions about personal identity.  
     - *Knockout effect*: Sinks rigid origin essentialism (if origins strictly determine identity, twins couldn’t diverge).

  2. **IVF/Embryo Persistence**  
     - *Requirement*: Must allow that *this embryo* (e.g., frozen for IVF) could have been implanted at t+1 year and still develop into *me*.  
     - *Why*: Embryos persist through temporal interruption; denying this conflicts with medical practice and intuition.  
     - *Tension*: If "me" requires the *exact* causal history, delayed implantation creates a paradox.

  3. **Anti-Arbitrariness**  
     - *Requirement*: No unmotivated cutoffs (e.g., "gametes can vary ≤3% but not 4%"). Must handle spectra:  
       - *Gamete variation*: Could I come from the same egg + a sperm from the same sample? Same egg + a different donor?  
       - *Temporal flexibility*: Could my parents have conceived me a day later?  
     - *Why*: Biology & physics are continuous; sharp boundaries feel artificial.  
     - *Your hunch confirmed*: This directly opposes demanding a "sharp answer" in sperm-swap cases. Precision requires thresholds; anti-arbitrariness forbids them.

  ---

  ### **Negotiable Desiderata** (Camp-Dependent)
  4. **Fertility Fraud Verdict**  
     - *Requirement*: Should deliver a clear answer on whether the child in a "sperm-swap" case is *the same child* the parents intended.  
     - *Why one camp wants it*: Needed for moral/legal harm claims (if a different child exists, how were *they* wronged?).  
     - *Why others skip it*: Identity may not matter; wrongful creation/deception might suffice.  
     - *Tension*: Anti-arbitrariness makes a binary "same/different" verdict elusive. If gametes gradually diverge, when does identity break?

  5. **Nonidentity Problem Engagement**  
     - *Requirement*: Must either resolve or explain silence on whether a person harmed by their origin conditions can claim "I should never have existed."  
     - *Why some demand it*: Origin modal status affects whether existence itself is compensable harm.  
     - *Why others waive*: The problem might be ethical, not metaphysical.

  6. **Epistemic Humility**  
     - *Requirement*: Should accommodate the intuition "I feel I could have been conceived on a different night."  
     - *Why*: Rejecting this feels nihilistic about personal experience.  
     - *Knockout effect*: Quietism exploits this; strict essentialism struggles.

  ---

  ### **Where Contenders Fail**
  - **Origin Essentialism** (e.g., Kripke):  
    - *Fails*: Twins constraint (rigid origins can’t handle splitting), IVF persistence (delayed implantation changes history), arbitrariness (no principled gamete variation threshold).  
    - *Strengths*: Fraud verdict (if sperm differs, identity differs → harm is clear).

  - **Counterpart Theory** (Lewis-style):  
    - *Fails*: Anti-arbitrariness (relies on contextually variable similarity metrics → "same child?" has no stable answer). Weak on fraud cases demanding binary answers.  
    - *Strengths*: Handles spectra (gamete variation is a matter of degree), epistemic humility (different counterparts for different contexts).

  - **Quietism** ("No Fact of the Matter"):  
    - *Fails*: Fertility fraud verdict (silence undermines legal redress), nonidentity engagement (avoids the core problem).  
    - *Strengths*: Dodges arbitrariness, respects epistemic humility.

  ---

  ### **Suspected Incompatibilities**
  - **"Sharp fraud verdict" vs. "No arbitrary cutoff"**:  
    Your hunch is correct. These are likely incompatible. A sharp verdict needs a bright line (e.g., "any gamete swap creates a different person"), but biology offers no non-arbitrary point where identity fails. Any threshold (e.g., "same donor" vs. "different donor") feels ad hoc. *Resolution?* Either abandon binary identity in fraud cases (focus on deception, not identity) or accept a convention (e.g., "intended gametes are essential")—but the latter violates anti-arbitrariness.

  - **"IVF persistence" vs. "Nonidentity silence"**:  
    If the embryo frozen at t0 and implanted at t1 is *me*, then my existence is modally fragile (small delays could prevent "me"). This intensifies the nonidentity problem.

  ---

  ### **Weakest Desideratum: My Uncertainty**
  - **Fertility Fraud Verdict**  
    - *Why I’m uncertain*: Demanding a metaphysical answer to "same child?" might overreach. Ethics could bypass identity (e.g., "wrongful creation" suffices for harm).  
    - *What would change my mind*: If legal cases *require* identity to assign harm (e.g., the child must be "the victim of the swap"), it becomes non-negotiable.  
    - *Blind spot risk*: I may underestimate how much law/policy depends on personal identity metaphysics.

  ---

  ### **Where Reasoning Could Be Wrong**
  - **Bias toward continuity**: I favor theories that handle spectra (anti-arbitrariness), but this might misrepresent how we *actually* individuate persons (e.g., we may use discrete "origin events" in practice).  
  - **Overweighting twins**: Treating twins as a hard constraint might ignore that identity criteria could differ pre/post-split.  
  - **Nonidentity dismissal**: Assuming quietism is viable there might ignore moral urgency (e.g., climate change policies affecting future people).

  The central tension remains: **Precision in hard cases (fraud) demands thresholds, but biology rejects them.** Any theory prioritizing one will struggle with the other. Your sperm-swap intuition exposes this flaw in all extant approaches.
