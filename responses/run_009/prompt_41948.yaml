  The user suspects a tension between needing a sharp answer on sperm-swaps and avoiding arbitrary cutoffs in gamete differences. I agree—this is likely the core conflict. Theories that demand precise boundaries (like origin essentialism) struggle with continuity cases (e.g., gradual gamete replacement), while flexible approaches (like counterpart theory) may lack the precision needed for moral harm claims in fraud cases. 

  For desiderata, non-negotiables include: avoiding arbitrariness (no unmotivated cutoffs), handling biological continuity (twins/IVF), and respecting epistemic humility (we feel origin could vary, so the theory shouldn't contradict this without cause). Negotiable points include solving the nonidentity problem—some theories might address it, but it shouldn't be mandatory. 

  The biggest hurdle for contenders: origin essentialism fails on arbitrariness and continuity; counterpart theory struggles with precision for moral harm; quietism avoids conflict but dodges needed answers, especially in fraud cases. 

  I'm least confident about requiring a sharp fraud verdict—it might overmoralize identity. If harm can be framed without strict identity (e.g., wrongful creation), this demand could soften. 

