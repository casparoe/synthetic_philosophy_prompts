  First, I need to break down the brother's argument. It's based on hard determinism: all actions are caused by factors beyond one's control, so no one is truly blameworthy. The user's first issue is that this seems to prove too much—if nobody is responsible, then even strangers committing fraud shouldn't be blamed. But the brother only applies this to family, which is inconsistent. The user suspects the brother is using philosophy to avoid feeling bad, which is a valid point.

  Next, the user's second problem is the brother's inconsistency. He thanks neighbors and gets angry at someone who hit his car, yet claims those are just feelings, not about desert. The user wonders if holding people responsible for good vs. bad is different or if it's hypocrisy. Also, can the user keep blaming the cousin while agreeing with the argument's logic?

  I should explain the philosophical underpinnings. The brother's view aligns with hard determinism or source incompatibilism. Rejecting this might involve compatibilism—free will coexists with determinism, where responsibility comes from reasons-responsive mechanisms. Another angle is pragmatism: responsibility is a social tool, not about metaphysics. The brother might be conflating blame with anger, which are distinct.

  Addressing the inconsistency: gratitude and anger might be emotional reactions, not judgments of desert. But if the brother attributes moral responsibility to the neighbor (deserving thanks) but not the cousin (deserving blame), that's inconsistent. If he denies desert entirely, then why get angry at the hit-and-run driver? His "just feelings" defense might not hold if those feelings imply moral judgment.

  The user's deeper needs: they want validation that their brother's argument is flawed, both logically and in its selective application. They might also seek clarity to counter the brother in future discussions. Underlying this is family tension and a desire to resolve the conflict without feeling manipulated by the brother's sudden change of heart.

  To respond effectively, I'll outline the brother's strongest argument, then dissect its premises. Highlighting the distinction between causation and blameworthiness is key. Then, address the inconsistency in the brother's behavior, showing that emotional responses often assume responsibility. Finally, suggest that the brother might be using philosophy to cope, which isn't inherently wrong but should be acknowledged. This should help the user feel confident in their stance and provide tools for the ongoing debate.
answer: |-
  Your brother's argument is a classic presentation of **hard determinism/incompatibilism** (specifically, "source incompatibilism"), and while it's philosophically coherent *if you accept its core premises*, it faces significant challenges and likely isn't being applied consistently by your brother. Let's break it down.

  ### The Strongest Version of Your Brother's Argument (Hard Determinism / Source Incompatibilism)
  1.  **Premise 1 (Causal Determinism):** Every event, including human decisions and actions, is the inevitable result of prior causes. These causes stretch back to factors before the individual's existence (genetics, upbringing, environment, etc.).
  2.  **Premise 2 (The "Ultimate Source" Requirement):** For someone to be *truly morally responsible* (and thus truly blameworthy or praiseworthy) for an action, they must be the *ultimate source* or *uncaused cause* of that action. They must have "caused themselves to cause the action" in a way that isn't itself determined by prior causes outside their control.
  3.  **Premise 3 (The Absence of the Ultimate Source):** No human being is the ultimate source of their actions. Our character, desires, reasoning processes, and ultimately our choices are all shaped (determined) by factors we did not choose (genes, early childhood, societal influences, random neural events).
  4.  **Conclusion (No Moral Responsibility):** Therefore, no human being is *ultimately morally responsible* for their actions. Blame (and praise) are fundamentally misplaced. Getting angry at someone for actions flowing from their determined nature is as irrational as getting angry at the weather. We might still react emotionally or take practical steps to protect ourselves (like putting up an umbrella), but we shouldn't attribute *moral desert*.

  **This is a logically valid argument.** If you accept Premises 1, 2, and 3, the conclusion follows.

  ### Where the Argument "Goes Wrong" (Which Premises Can Be Rejected)
  The argument's power comes from Premise 2. Rejecting it is the most common and arguably strongest response. Here's where philosophers diverge:

  1.  **Rejecting Premise 2 (The Ultimate Source Requirement): Compatibilism**
      *   **The Rejection:** Compatibilists argue that Premise 2 sets an impossibly high bar for responsibility. True "uncaused causing" might be incoherent or irrelevant.
      *   **The Alternative:** What matters for responsibility isn't being an *uncaused cause*, but whether the action flowed from the person's *own* character, desires, and reasoning processes *in the right way*, even if those were shaped by prior causes. Key compatibilist criteria include:
          *   **Reasons-Responsiveness:** Could the person have recognized and acted upon good reasons to do otherwise *if* those reasons were present? (This doesn't require indeterminism).
          *   **Identification/Hierarchical Control:** Did the person act based on desires they endorse or identify with, rather than irresistible impulses or external coercion?
          *   **Pragmatic Function:** The concepts of blame and praise serve vital social functions (deterrence, moral education, maintaining trust, signaling values) that don't require the person to be an uncaused cause.
      *   **Cost:** Accepting compatibilism means living with the potential "illusion" of ultimate responsibility. It accepts that our deepest selves are shaped by forces beyond our control, yet holds us responsible for acting *from* that self. It might feel less metaphysically satisfying than ultimate freedom.
      *   **Applied to the Cousin:** A compatibilist would say: Your cousin's actions stemmed from his character (dishonest, impulsive, short-sighted). He likely *could* have recognized the reasons not to commit fraud (it's wrong, risky, hurts others) and *chosen* otherwise, even if that choice was determined by his prior state. His character flaws are *his* flaws, developed through his choices and experiences (even if influenced by factors he didn't choose). Therefore, blame is appropriate as a response to *his* wrongful actions originating from *his* agential state. This doesn't preclude compassion or understanding root causes, but it justifies holding him accountable.

  2.  **Rejecting Premise 1 (Causal Determinism): Libertarian Free Will**
      *   **The Rejection:** Determinism is false. Human beings possess a form of contra-causal free will – the ability to make choices that are not fully determined by prior causes.
      *   **The Alternative:** At the moment of choice, the individual introduces a genuinely novel cause into the causal chain. This allows them to be the ultimate source (Premise 2).
      *   **Cost:** This view faces significant scientific and philosophical challenges (How does this interaction work? Is it random? Doesn't randomness also undermine control?). It's metaphysically demanding.
      *   **Applied to the Cousin:** Libertarians would have the strongest grounds for blame – he *chose* freely to commit fraud when he could have done otherwise.

  3.  **Rejecting the Practical Conclusion (Pragmatism/Strawson):**
      *   **The Rejection:** Even *if* Premise 2 is correct and ultimate responsibility is impossible (P.F. Strawson explored this deeply), reactive attitudes like blame, resentment, gratitude, and indignation are fundamental, natural parts of human social life ("the participant attitude").
      *   **The Alternative:** We cannot and should not try to fully suspend these attitudes based on abstract metaphysical arguments. They are constitutive of our relationships and moral community. While we might moderate them with understanding ("the objective attitude" - treating someone more like a object to be managed), completely eliminating them for humans is neither possible nor desirable.
      *   **Cost:** This accepts a potential inconsistency between our metaphysical beliefs and our necessary emotional/social practices. It might feel intellectually messy.
      *   **Applied to the Cousin:** Blame/resentment is a natural, understandable, and potentially justified *human reaction* to being wronged by another person within a relationship, regardless of ultimate metaphysical responsibility. It signals the violation of a norm fundamental to the relationship (trust, reciprocity). Understanding root causes might temper the intensity, but the *reaction itself* isn't irrational.

  ### Addressing Your Second Problem: Inconsistency and "Just Feelings"
  1.  **The Inconsistency:** Your brother's behavior *is* inconsistent *if* he is applying the "no responsibility" thesis selectively.
      *   **Thanking the Neighbor:** If his argument means *no one* deserves *praise* either (since the neighbor's helpfulness also flows from causes he didn't choose), then consistent application would mean seeing gratitude as equally irrational as anger. Saying "thanks" would just be a pleasant noise with no implication of desert. Yet, when he thanks the neighbor, the context strongly implies he *does* see the neighbor as deserving of appreciation for a freely chosen kind act. This suggests he *is* holding the neighbor responsible in the compatibilist sense.
      *   **Anger at the Hit-and-Run Driver:** His fury directly contradicts his stated position. He's clearly holding that driver morally responsible and blameworthy. "Just feelings" doesn't wash here. The *intensity* and *nature* of the feeling – moral indignation – implies a judgment of desert ("That driver *shouldn't* have done that, they *deserve* condemnation/punishment").
  2.  **The "Just Feelings" Defense:**
      *   **Is it Valid?** Partially, but shallowly. Feelings *are* different from carefully reasoned philosophical positions. We can have emotional reactions based on ingrained social patterns without consciously endorsing the underlying metaphysics of responsibility.
      *   **Does it Work for Him?** Not well, given the inconsistency. His anger at the driver and gratitude towards the neighbor strongly suggest he *does*, in practice, operate with a compatibilist (or even libertarian) view of responsibility in everyday life. He's likely only invoking the hard determinist argument selectively regarding the cousin to manage his own difficult feelings (anger, guilt, family loyalty) – which is what you suspect.
      *   **Does it Work for You?** Yes, potentially. Strawson's point is key here. You can say: "Even *if* I concede your hard determinist point on an abstract level (which I may not), my resentment towards our cousin is a natural human reactive attitude arising from being repeatedly wronged and betrayed *within a relationship*. This feeling isn't *just* a metaphysical error; it's a response to the violation of basic norms of trust and reciprocity that define our interactions. While I might strive for understanding, demanding I completely eliminate this feeling is asking me to adopt an 'objective attitude' towards a family member, which feels inhuman and dismissive of the real harm done." You don't need to endorse ultimate responsibility to justify the *feeling* of blame within the context of the relationship.

  ### Conclusion: The Argument's Merits and Flaws
  *   **As an Abstract Argument:** The hard determinist/source incompatibilist argument is philosophically serious and logically valid *if* you accept the "ultimate source" requirement (Premise 2). Its strength is exposing the potential conflict between determinism and intuitive notions of desert.
  *   **Its Flaws:**
      1.  **Premise 2 is Highly Controversial:** Most contemporary philosophers (compatibilists) reject the "ultimate source" requirement as unnecessary for a workable and meaningful concept of responsibility. This is the argument's biggest vulnerability.
      2.  **It Proves Too Much (Your Instinct is Correct):** It does indeed undermine *all* moral responsibility, praise, and blame. Your brother's selective application to the cousin reveals he likely doesn't *truly* believe the radical conclusion in practice. He's using it as a tool.
      3.  **Ignores Function & Relationships:** It dismisses the vital social, psychological, and relational functions of blame and praise, reducing them to irrational mistakes. Strawson powerfully argues this is neither possible nor desirable.
      4.  **Likely Motivated Reasoning:** Your suspicion is well-founded. His sudden flip, inconsistency, and focus on *stopping anger* (rather than a consistent philosophical awakening) strongly suggest he's using the argument primarily as a coping mechanism to alleviate his own distress about the cousin and family conflict. He wants to stop feeling the negative emotions associated with the cousin's actions.

  **Best Responses to Your Brother:**
  1.  **Target Premise 2:** "I understand the logic, but I think the requirement that someone be an 'uncaused cause' to be responsible sets an impossible standard no one meets. Responsibility makes sense based on whether actions flow from *who the person is* – their character, their choices (even if influenced), and their ability to recognize reasons. Our cousin *is* dishonest and untrustworthy, and he *did* choose to commit fraud. Holding him responsible for that isn't like blaming the weather; it's responding to *him* and his harmful choices."
  2.  **Highlight the Inconsistency:** "If your argument means *no one* is responsible, why were you furious at the hit-and-run driver? That anger sure *felt* like you held them morally blameworthy. And when you thank the neighbor, it feels like you think they *deserve* thanks for choosing to be kind. It seems like you *do* believe in responsibility most of the time, but you're setting it aside only for our cousin to make things easier emotionally."
  3.  **Invoke Strawson:** "Even if we grant your point abstractly, resentment when someone close betrays you is a natural human reaction. It's not *just* a philosophical error; it's how relationships work. Expecting me to turn off that feeling completely is asking me to stop seeing him as a person I have a relationship with, and I'm not ready to do that."
  4.  **Question the Motivation (Carefully):** "I notice this change came after you were the angriest. Does this argument genuinely convince you about *everyone*, like the guy who hit your car, or is it helping you manage your own feelings about our cousin and the family drama?"

  Ultimately, your brother's argument is a sophisticated form of excuse-making for the cousin, driven more by emotional fatigue than rigorous philosophical conviction. While logically coherent within its own strict premises, those premises are widely contested, and his own behavior reveals he doesn't truly live by them. You are justified in continuing to hold the cousin responsible in the everyday, compatibilist sense and in feeling the resentment that naturally arises from his repeated harmful actions.
