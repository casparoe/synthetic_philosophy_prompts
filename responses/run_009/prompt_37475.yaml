prompt: |-
  I keep arguing with my brother about the Rietdijk–Putnam argument (sometimes called the Andromeda argument — the setup where two people walking past each other in opposite directions on Earth have slightly different hyperplanes of simultaneity slicing through Andromeda, so for one of them the aliens' decision to invade is in their present and for the other it isn't yet, and by chaining 'real for observer A' to 'real for observer B' across enough observers you supposedly get every event being determinate for everyone). My credence that this argument actually establishes eternalism — that the future is exactly as real and settled as the past — is maybe 0.35. His is closer to 0.7.

  You're a philosopher of physics who's actually willing to give numbers rather than 'it depends'. Please think carefully, and start with a couple minutes of brainstorming before you commit to a decomposition. What I want is your credence that the argument, as stated (assume special relativity is true and flat Minkowski spacetime is the whole story), is sound — decomposed into terms like:

  - whether the move from 'real for observer A' to 'real, period' is a legitimate premise or one that's smuggled in (the argument needs the transitivity of the 'real for' relation, and some people think that's where all the work happens)
  - whether Stein's proposed fix — defining what's determinate for an observer via the past light cone rather than the simultaneity hyperplane — is ad hoc defensive maneuvering, or actually more faithful to what SR says any observer is in a position to care about
  - whether eternalism vs presentism vs growing block is even the kind of question physics could in principle settle, or whether the argument just re-describes the geometry in loaded vocabulary

  plus whatever other terms you think belong (if you think a Lorentz-invariance term should be in there, or a term for whether determinateness spreads the way the argument needs it to, add them). Give each term a rough number with one line of justification, then combine them and tell me the final credence. After that, tell me which term you're least confident in and what argument or piece of physics would move it the most — I'm especially curious whether you'd count hidden preferred-frame theories, like Bohmian mechanics with its foliation, as relevant to the invariance term or as cheating by adding structure.

  One more thing: if you think the question is set up wrong — like 'real for' is doing all the work and there's no fact of the matter for the argument to be right about — say that plainly instead of forcing a number. My brother thinks I'm just dodging by raising that, and honestley maybe I am, but I'd rather hear it straight from you than get a fake probability.
