  Lorentz invariance is crucial. SR says no preferred frame, so any existence claim should be frame-independent. If "real" depends on a hyperplane tied to a frame, that violates Lorentz invariance. Stein's past light cone is Lorentz invariant, which might be better.

  Also, determinateness spreading: the argument assumes that if E is real for A, and A and B are co-present, then E is real for B. But co-presence is frame-dependent. Two observers at the same location but different times? The argument uses spacelike separation, but simultaneity is relative.

