  3. Physics Settling Metaphysics: Can SR decide eternalism? Physics describes spacetime structure, but "real" is metaphysical. Presentists can accept SR's geometry but interpret "now" differently. The Rietdijk-Putnam argument might beg the question by assuming hyperplanes define reality. Physics doesn't directly address the flow of time. Credence: 0.2 that physics can settle it.

