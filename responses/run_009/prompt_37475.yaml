  But there's a problem: the transitivity might break. Observer A and B might agree on some events being real, but as you chain more observers, especially with different velocities, the hyperplanes can cover more of spacetime. If you have a dense set of observers, their hyperplanes could cover the entire spacetime, making all events real. But is that valid?

