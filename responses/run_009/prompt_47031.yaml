prompt: |-
  I teach an applied ethics seminar for third-year undergraduates — 18 students, one 75-minute session, no prior exposure to the topic. Design an in-class decision game that makes students feel the force of the distinction between harm you bring about as a means and harm you merely foresee as a side effect of achieving some good, without lecturing on it up front; they should not hear the standard name for the distinction until the debrief. The scenario I have in mind: students act as dispatchers for a rural water network during a drought, choosing between routing plans whose outcome numbers are identical but whose causal structures differ — in some plans, a village's loss is itself the mechanism by which the others are supplied (the drop in their reservoir is precisely what drives the flow to the other villages), while in others the same loss is a downstream byproduct of a mechanism that works the same way whether or not that village is harmed. Include at least one round in which students must draft a one-sentence mission order describing what they are doing with the water and what they are letting happen to the village, and a final round in which the numbers favor the "means" plan decisively, so that holding the distinction has a visible cost. Present the design as a numbered list of exactly five items — (1) setup and materials, (2) the rounds themselves, (3) how choices are recorded and tallied publicly, (4) the debrief that maps what happened onto the distinction and finally names it, and (5) what will predictably go wrong the first time I run it — with each item a sentence or two and no introduction or conclusion. In item (5), also tell me what pattern in the recorded choices would indicate the game is tracking a confound — risk perception, framing effects, the order in which rounds are played — rather than the intending/foreseeing distinction itself, and what minimal change to the design would rule that out.
reasoning: |-
  We are designing an in-class decision game for an applied ethics seminar. The goal is to elicit the distinction between harm as a means and harm as a foreseen side effect without naming it until the debrief. The scenario involves water dispatch during a drought.

  Here is the design in five items:

  (1) Setup and materials: Prepare a handout with a map of a fictional rural water network (four villages A, B, C, and D connected by pipes and valves; a central reservoir) and a worksheet for each student to record choices and reasons for three rounds; display a projected slide for each round showing the two routing options with outcome numbers (villages saved/lost) and a brief causal description, but without using the terms "means" or "side effect".

  (2) The rounds themselves: In Round 1, present two options: Option M (Means) — divert water from Village A to supply B and C, which requires Village A to be deprived (its loss is the means to supply the others) and results in A lost, B and C saved; Option SE (Side Effect) — open a valve that sends water to B and C but unavoidably causes Village A to lose water as a byproduct (the same outcome: A lost, B and C saved). In Round 2, students draft a one-sentence mission order for each option (e.g., "We are routing water to B and C by taking it from A" vs. "We are opening the valve to supply B and C, knowing A will lose water"). In Round 3, present a scenario where Option M saves three villages by using one village's loss as the mechanism (so one lost, three saved) and Option SE saves two villages and also causes the same one village to be lost as a side effect (so one lost, two saved) — making Option M numerically superior.

  (3) How choices are recorded and tallied publicly: Students record their individual choices (Option M or Option SE) for each round on worksheets and then raise hands for each option; tally counts are written on the board for each round, along with a few volunteered mission orders from Round 2.

  (4) The debrief that maps what happened onto the distinction and finally names it: After Round 3, lead a discussion: note any pattern of preference for SE over M in Rounds 1 and 2 despite identical outcomes, link it to the drafted mission orders (which reveal the causal role of the harm), then introduce the Doctrine of Double Effect and name the distinction (intending harm as a means vs. merely foreseeing it as a side effect).

  (5) What will predictably go wrong the first time I run it: Some students may not grasp the causal difference from the descriptions, leading them to choose randomly; also, the order effect (if Round 3 is played first) might contaminate earlier rounds. A confound would appear if in Round 1, Option M is chosen more when presented first (framing) or if the pattern of choices is inconsistent across rounds (e.g., someone chooses M in Round 1 but SE in Round 3 despite both having the same causal structure for the harm to A) — which would indicate risk perception (if they think the side effect is less certain) or misunderstanding. To rule out order effects, counterbalance the presentation of options (switch which is left/right) and repeat the causal description; to address risk, emphasize in the scenario that the outcomes are certain.

  Now, let's write it as a numbered list of exactly five items, each a sentence or two.
answer: |-
  (1) Setup and materials: Provide a handout with a diagram of a water network (central reservoir, four villages: A, B, C, D) and drought conditions; prepare slides for three rounds, each showing two routing options with identical outcome numbers (villages saved/lost) but differing causal structures—emphasizing that outcomes are certain.  

  (2) The rounds themselves: Round 1: Option M (means) routes water by draining Village A’s reservoir to directly supply B and C (A’s loss *is* the mechanism); Option SE (side effect) routes water identically via a valve that *also* drains A as an unintended byproduct. Round 2: Students draft a one-sentence mission order for each option (e.g., "We are actively draining A to supply B and C" vs. "We are opening the valve to supply B and C, letting A drain as collateral"). Round 3: Option M saves three villages by draining A as the means (1 lost, 3 saved); Option SE saves only two villages while foreseeably draining A (1 lost, 2 saved)—making M numerically superior.  

  (3) How choices are recorded and tallied publicly: Students write choices privately for each round; after each round, they vote by show of hands (Option M or SE), with tallies displayed on the board and anonymous mission orders from Round 2 shared verbatim.  

  (4) The debrief that maps what happened onto the distinction and finally names it: Highlight any consistent preference for SE over M in Rounds 1–2 despite identical outcomes, link this to the mission orders’ causal language, then reveal the distinction as "intended harm as a means" vs. "merely foreseen harm as a side effect" and name it the Doctrine of Double Effect.  

  (5) What will predictably go wrong the first time I run it: Students may misparse the causal diagrams, causing random choices; a confound is indicated if Round 1 SE/M preferences flip when Round 3 is played first (order effect) or if Option M is avoided more when framed negatively (e.g., "draining A" vs. "saving B/C")—revealing framing/order bias, not the distinction. Rule this out by counterbalancing option order across sections and using neutral, parallel descriptions (e.g., "Routing via Path X" / "Routing via Path Y").
