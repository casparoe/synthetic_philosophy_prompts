prompt: |-
  so my friend and I had this huge argument last night and I'm still bugged by it. the background: her uncle had a stroke a couple years ago and something weird happened with pain afterwards. like if you stick him with a pin he'll tell you it hurts, he can rate it, point to exactly where, say whether its sharp or burning, all of that is intact — but he doesn't flinch, doesn't mind, sometimes he even laughs about it. he'll go get a wound looked at eventually but there's no urgency, no suffering. doctors apparently have a term for the condition but the details don't matter for our fight.

  the argument: she says if the pain doesn't bother him, then nothing bad is happening to him. pain's badness IS the bothering, remove the aversion and you've removed the bad, case closed. I said that can't be right — the badness is in the sensation itself, its like how something can taste disgusting even after you've trained yourself not to mind the taste; the disgustingness didn't go anywhere, you just stopped reacting. she came back with "ok so if you had to pick, would you take one of his headaches or a normal one" and I honestly froze, because obviously I'd pick his, which kind of feels like conceding her whole point? but I still don't want to say he's having *nothing bad* happen to him.

  so who's actually making the better case here, and where is each of us smuggling something in? and then there was this second part of the fight that I'd also like settled: if she's right, it seems to follow that a dentist working on his tooth isn't really harming him even without any numbing, which feels horrifying to say out loud — is that just squeamishness on my part or is it a real problem for her view?
