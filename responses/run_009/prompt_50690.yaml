  **Scenario:**  
  Two construction firms, Alpha and Beta, bid in a sealed-bid auction for an exclusive government permit to develop a coastal area. The permit’s true value depends on undiscovered geological factors affecting land stability—identical for both firms but unknown. Each firm’s initial private estimate is unbiased but imperfect: Alpha’s research suggests $10M, Beta’s suggests $5M. Bids start at $1M and escalate in $1M increments. The winner pays their bid and gains the permit; the loser pays their last bid and gets nothing. All bids are public, so each firm updates its valuation based on the rival’s continued participation, interpreting it as evidence that the rival’s research indicates higher geological viability.

  ---

  **Walkthrough of Rational Escalation:**  
  *Assumptions:*  
  - True permit value = $8M (unknown to both).  
  - At each bid, firms maximize expected profit *given current information*.  
  - Estimates are Bayesian-updated using rival bids as signals of rival research.  

  **Bid 1: Alpha bids $1M**  
  - Alpha’s expected profit: Permit worth $10M – $1M bid = **$9M gain**. Rational to bid.  
  - Beta’s expected profit: Permit worth $5M – $1M bid = **$4M gain**. Rational to bid.  
  *Outcome:* Both bid $1M; no winner yet.  

  **Bid 2: Beta bids $2M**  
  - Beta’s reasoning:  
    - Alpha bid $1M, revealing Alpha’s estimate ≥$1M. But Alpha’s initial estimate ($10M) was already high, so minimal new info. Beta’s own estimate remains ~$5M.  
    - Expected profit: $5M permit – $2M bid = **$3M gain**. Still rational.  
  *Outcome:* Beta bids $2M.  

  **Bid 3: Alpha bids $3M**  
  - Alpha’s reasoning:  
    - Beta’s $2M bid signals Beta’s updated estimate ≥$2M. Since Beta’s initial estimate was $5M (unbiased), this suggests Beta’s research implies *higher* true value than Alpha assumed.  
    - Alpha updates: "Beta’s willingness to bid $2M despite a $5M initial estimate implies true value likely exceeds my prior." Alpha raises expected value from $10M to $12M.  
    - Expected profit: $12M permit – $3M bid = **$9M gain**. Rational to bid.  
  *Outcome:* Alpha bids $3M.  

  **Result:**  
  Bidding continues beyond $8M true value. Alpha wins at $9M, pays $9M for $8M permit (**$1M loss**). Beta pays $8M for nothing (**$8M loss**). Both lose more than a naive agent who stopped at their initial bids (Alpha: $0 loss; Beta: $0 loss).  

  ---

  **Structural Feature Doing the Work:**  
  The **common-value uncertainty combined with Bayesian updating** drives escalation. Rival bids are treated as signals that *increase* the permit’s expected value. Crucially:  
  - Each bidder views rival bids as *new evidence* about the *true value*, not as sunk costs.  
  - This creates a feedback loop: Bidder A’s bid raises Bidder B’s valuation, justifying B’s higher bid, which then raises A’s valuation further.  

  **If Removed:**  
  If the permit’s value is *known* (e.g., fixed at $8M), escalation becomes irrational:  
  - At Bid 3 ($3M), Alpha knows permit is worth $8M. Profit = $8M – $3M = $5M gain (rational).  
  - Once bids exceed $8M (e.g., $9M), expected profit is negative. A fully rational agent drops out.  
  *Result:* Auction ends near $8M. No mutual ruin. Thus, without uncertainty, it collapses into a standard dollar auction where escalating past true value *is* a bias.  

  ---

  **Strongest Reply: The Double-Counting Critique**  
  *"Escalation here is still irrational—bidders ignore that rival bids reflect sunk costs, not just new information."*  
  - **Argument:** When Beta bids $2M, Alpha interprets it *only* as evidence of high permit value. But Beta’s bid also reflects Beta’s *sunk exposure* (having bid $1M already). If Beta drops out, it loses $1M for nothing; thus, Beta might bid $2M *even if its valuation hasn’t increased*, purely to avoid sunk loss. Rational agents should discount rival bids by this "sunk-cost pressure," not treat them as pure value signals.  
  - **Consequence:** If Alpha properly accounts for sunk-cost incentives, it would update valuations less aggressively. Bid 3 ($3M) might then seem unprofitable, halting escalation.  
  - **Why it challenges the model:** Even in common-value auctions, fully rational agents should anticipate rivals’ sunk-cost motivations, breaking the feedback loop. Failure to do so makes updating *locally* rational but *globally* flawed.
