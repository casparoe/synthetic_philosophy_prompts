  ### Decision Theory Classification Instrument  
  *Which decision theory do you actually hold?*  

  Answer each question based on what you would do and **why**. Choose only one rationale per node. Work through the tree sequentially.  

  ---

  #### **Node 1: The Predictor’s Boxes**  
  *There are two boxes: Box A (opaque) and Box B (transparent, containing $1,000). A predictor who knows your decision in advance put $1,000,000 in Box A only if they predicted you would take only Box A. You observe $1,000 in Box B. What do you do?*  
  - **Take both boxes.**  
    *Rationale: Whatever is in Box A is already fixed; taking both maximizes my gain regardless of the predictor’s past choice.*  
  - **Take only Box A.**  
    *Rationale: If I take both, it’s evidence the predictor knew I would, so Box A is empty; taking only Box A is evidence it’s full.*  

  *If you chose "Take both boxes," go to Node 2. If "Take only Box A," go to Node 3.*  

  ---

  #### **Node 2: The Precommitment Test**  *(Novel Case)*  
  *Today, you choose for tomorrow: you will be shown two locked boxes (one with $500, one empty). Option A forces you to take the $500 box tomorrow. Option B lets you choose freely tomorrow. What do you choose today?*  
  - **Force myself to take the $500 box (Option A).**  
    *Rationale: I might act against my interests tomorrow; binding now ensures I get the $500.*  
  - **Let myself choose freely tomorrow (Option B).**  
    *Rationale: Tomorrow I’ll choose rationally (taking the $500), so binding is unnecessary.*  

  *Go to Node 4.*  

  ---

  #### **Node 3: The Counterfactual Tax**  
  *A coin was flipped: if heads, you owe $100; if tails, you get $10,000 only if a predictor knew you’d pay if heads. The coin is hidden (you never learn the result). You are told it was heads and asked to pay $100. What do you do?*  
  - **Pay $100.**  
    *Rationale: Paying now ensures my decision helps in the tails scenario (which I care about), even if it didn’t happen.*  
  - **Refuse to pay.**  
    *Rationale: Paying costs $100 and can’t affect tails (the coin is already flipped); it only helps in the branch that didn’t occur.*  

  *If you chose "Pay $100," go to Node 5. If "Refuse to pay," go to Node 6.*  

  ---

  #### **Node 4: The Rescued Hitchhiker**  
  *A driver rescued you from the desert only because they believed you’d pay $100 upon arrival. They are a perfect predictor. You are now safe in town. The driver asks for $100. What do you do?*  
  - **Pay the $100.**  
    *Rationale: I must act as the "paying type" to be consistent with the driver’s past prediction, ensuring they rescue others like me.*  
  - **Refuse to pay.**  
    *Rationale: I’m already rescued; paying costs $100 and won’t change past predictions.*  

  *If you chose "Pay the $100," you are **Precommitment CDT**. If "Refuse to pay," you are **CDT**.*  

  ---

  #### **Node 5: The Rescued Hitchhiker (Revisited)**  
  *Same as Node 4: You were rescued based on the driver’s prediction. You are now in town. They ask for $100. What do you do?*  
  - **Pay the $100.**  
    *Rationale: I uphold my decision policy to ensure drivers rescue people like me across similar scenarios.*  
  - **Refuse to pay.**  
    *Rationale: I’m already safe; paying now only costs me money.*  

  *If you chose "Pay the $100," you are **UDT/FDT**. If "Refuse to pay," you are **Inconsistent Updateless** (rare; mixes UDT/FDT with CDT).*  

  ---

  #### **Node 6: The Blackmail Letter**  
  *You get a letter: "Pay $1,000 or we release damaging secrets." The blackmailer sent this only if (1) they have secrets, and (2) they predicted you’d pay. What do you do?*  
  - **Pay $1,000.**  
    *Rationale: Paying prevents release, and getting the letter means they likely have secrets.*  
  - **Refuse to pay.**  
    *Rationale: Paying rewards blackmail; I can’t change if they have secrets.*  

  *If you chose "Pay $1,000," you are **EDT**. If "Refuse to pay," go to Node 7.*  

  ---

  #### **Node 7: The Smoking Dilemma**  
  *Smoking is pleasant and doesn’t cause cancer, but a rare lesion causes both smoking desire and cancer. What do you do?*  
  - **Smoke.**  
    *Rationale: Smoking doesn’t cause cancer; the lesion’s presence is fixed, so I might as well enjoy it.*  
  - **Don’t smoke.**  
    *Rationale: Smoking is evidence I have the lesion and will get cancer; avoiding it might reduce this evidence.*  

  *If you chose "Smoke," go to Node 8. If "Don’t smoke," you are **Inconsistent** (rare; refuses blackmail but avoids evidence).*  

  ---

  #### **Node 8: The Food Puzzle**  *(Novel Case)*  
  *Eating a tasty food doesn’t cause disease, but a rare lesion makes people desire it and get sick. What do you do?*  
  - **Eat the food.**  
    *Rationale: Eating doesn’t cause sickness; the lesion is fixed, so I’ll enjoy the food.*  
  - **Avoid the food.**  
    *Rationale: Eating signals I likely have the lesion, so I avoid it.*  

  *If you chose "Eat the food," you are **Newcomb-Only CDT** (one-boxes in Newcomb, causal elsewhere). If "Avoid the food," you are **Inconsistent** (rare; mixes causal and evidential reasoning).*  

  ---

  ### Classified Theories  
  1. **CDT (Causal Decision Theory)**: Maximizes causal consequences (e.g., two-boxes, refuses hitchhiker).  
  2. **Precommitment CDT**: Binds itself early to overcome causal shortsightedness (e.g., forces $500 box, pays hitchhiker).  
  3. **EDT (Evidential Decision Theory)**: Acts based on evidence about fixed realities (e.g., one-boxes, pays blackmail).  
  4. **UDT/FDT (Updateless/Functional Decision Theory)**: Evaluates "decision rules" across counterfactuals (e.g., pays counterfactual tax, pays hitchhiker).  
  5. **Newcomb-Only CDT**: One-boxes in Newcomb but causal elsewhere (e.g., refuses counterfactual tax and blackmail).  

  ### Gaps & Notes  
  - **Inconsistent Updateless**: Pays counterfactual tax but refuses hitchhiker. *Gap reason: Unstable/incoherent—updateless agents should treat both cases uniformly.*  
  - **Inconsistent**: Refuses blackmail but avoids smoking/food. *Gap reason: Unattractive—arbitrarily mixes causal and evidential reasoning.*  
  - **UDT/FDT vs. Precommitment CDT**: Separated by Node 2 (Precommitment Test). UDT/FDT doesn’t need binding; Precommitment CDT does.  
  - **EDT vs. Newcomb-Only CDT**: Separated by Nodes 6–8. EDT pays blackmail; Newcomb-Only CDT refuses but acts causally in lesions.  

  ---

  ### Designer’s Notes  
  **Node 2 (Precommitment Test)**: Designed to split UDT/FDT from Precommitment CDT. Both pay the hitchhiker (Node 4/5), but Precommitment CDT *requires* self-binding (choosing Option A), while UDT/FDT doesn’t (it evaluates decisions timelessly). Stock cases (e.g., Newcomb, hitchhiker) fail to distinguish them.  

  **Node 8 (Food Puzzle)**: Splits Newcomb-Only CDT from inconsistent agents. Both refuse blackmail (Node 6) and smoke (Node 7), but Newcomb-Only CDT acts causally in lesions (eats), while inconsistent agents avoid food. Classic cases (e.g., smoking lesion) leave these entangled.  

  **Coverage**: The tree isolates major theories using orthogonal splits (e.g., Node 1 splits causal vs. non-causal; Node 3 splits updateless vs. evidential). UDT/FDT and Precommitment CDT are separated; EDT and Newcomb-Only CDT are separated. "Inconsistent" branches are flagged as unstable/unexplored.  

  *Handout size: 8 nodes (20-minute completion).*
