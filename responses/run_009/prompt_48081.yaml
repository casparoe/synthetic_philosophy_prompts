prompt: |-
  I'm preparing a position statement for an interdisciplinary reading group on cultural evolution — the group is a mix of anthropologists, psychologists, and a couple of biologists, and each of us has to circulate a short statement of our commitments before the term starts so the others can poke at it. Mine is drafted, but the more I reread it, the less I trust that it's internally coherent, and I'd like an audit before I send it out. My background is in anthropology, with a strong amateur interest in evolutionary biology, which probably explains why my commitments pull in more than one direction.

  Here is the set. (1) I take it as settled that culture evolves in a genuinely Darwinian sense: populations of variants, inheritance with some fidelity, and differential retention driven by selection-like processes — this is a real population-level process, not a metaphor, and anyone who rolls their eyes at "cultural evolution" as loose talk is wrong. (2) I think the meme, in roughly the sense Dawkins introduced in The Selfish Gene, is the right unit of analysis: cultural items come as discrete, recombinable tokens, and it is their fidelity of copying — through imitation, teaching, and now mass media — that explains why songs, recipes, rituals, and proverbs remain stable across generations. (3) At the same time, whenever I look at actual transmission up close — ethnographies of oral storytelling, how children's games propagate playground to playground, the transmission-chain experiments in the psychology literature — I see transformation rather than copying: every retelling is partly a reconstruction, what survives is what human cognition can easily rebuild, and so the stability of culture lives in the biases of human heads rather than in properties of the transmitted items themselves; on this view copying fidelity is low, and mostly an illusion outside of writing and modern recording media. (4) I hold that the currency of cultural selection is attention and memorability, not usefulness: whether a variant spreads is largely independent of whether it benefits its bearers, and a good deal of what achieves epidemiological success is junk or worse. (5) And yet I am strongly moved by the observation that the big cultural packages of history — moralizing religions, ritual complexes, agricultural taboos — are mostly there because they did work for the communities that carried them, even at real cost to individuals; I have no patience for the fashionable line that religion is a kind of mind-parasite spreading against our interests, and I regard wholesale maladaptation stories as lazy. (6) Finally, methodologically, I want the field to lean hard on phylogenetic reconstruction — building family trees of artifacts, folktales, and decorative motifs on the model of historical linguistics — because I think that is cultural evolution's best shot at being a genuine historical science rather than a drawer of adaptive just-so stories.

  What I'd like from you: go through these six commitments, tell me which pairs are genuinely in tension and how badly, which apparent tensions dissolve on inspection, what the cheapest fix would be for each real tension and what that fix would cost me elsewhere, and, at the end, which single revision would clean up the most. Please rank the tensions by severity rather than presenting them all as equally damning, and be specific about which commitment has to give in each case — a diagnosis that ends with "it's complicated" is of no use to me. For what it's worth, each of these feels individually obvious to me when I'm in the right mood, which is exactly why I no longer trust the package as a whole; I honestly cannot see where the instability is concentrated, and I'd rather find out from you than from the reading group.
reasoning: |-
  Okay, the user is preparing a position statement for an interdisciplinary reading group on cultural evolution. Their background is in anthropology with a strong interest in evolutionary biology, and they've drafted six commitments that feel individually coherent but seem conflicting as a set. They want me to audit these commitments, identify tensions, rank them by severity, suggest fixes, and recommend a key revision.

  First, I need to understand each commitment clearly. Commitment 1 asserts that cultural evolution is genuinely Darwinian with population-level processes. Commitment 2 argues for memes as discrete, recombinable units with copying fidelity. Commitment 3 observes that actual transmission involves reconstruction rather than copying, with stability coming from cognitive biases. Commitment 4 claims cultural selection is driven by attention/memorability, not usefulness. Commitment 5 counters that major cultural packages persist because they benefit communities. Commitment 6 advocates for phylogenetic methods as the best approach for historical reconstruction.

  The most glaring tension is between Commitment 2 (high-fidelity meme copying) and Commitment 3 (reconstruction over copying). These directly contradict each other on the fundamental mechanism of cultural transmission. Commitment 3 undermines the meme concept by showing that what appears as copying is actually reconstruction based on cognitive biases.

  Next, Commitment 4 (selection for attention/memorability) clashes with Commitment 5 (cultural packages persist due to functional benefits). One denies adaptive utility while the other emphasizes it. This creates a problem in explaining why beneficial cultural elements would spread if selection isn't based on usefulness.

  Then there's tension between Commitment 1 (Darwinian processes require inheritance fidelity) and Commitment 3 (low-fidelity reconstruction). If transmission involves reconstruction rather than copying, can it still be considered Darwinian? This challenges the core of Commitment 1.

  Commitment 6's phylogenetic methods assume tree-like descent with modification, which relies on some fidelity in transmission. But Commitment 3's reconstruction model suggests blending and transformation, which could undermine phylogenetic approaches.

  The user also has an internal conflict between rejecting maladaptation stories (Commitment 5) while acknowledging "junk" culture (Commitment 4). They need to explain how functional packages emerge despite selection for memorability rather than utility.

  For resolution strategies, the most severe tension (Commitments 2 vs 3) requires revising the meme concept to incorporate reconstructive processes. The user could adopt Dan Sperber's "attractor" model where cognitive biases shape transmission. This would reconcile with Commitment 3 but require softening Commitment 2's strict meme theory.

  For the adaptation tension (Commitments 4 vs 5), I suggest multi-level selection where memorability drives individual adoption while group benefits explain persistence. This maintains both commitments but adds complexity.

  The fidelity issue (Commitments 1 vs 3) can be resolved by emphasizing that Darwinian processes don't require perfect copying - variation and selection can still operate with reconstructive transmission.

  For phylogenetics (Commitment 6), the user should acknowledge limitations where blending occurs but defend its usefulness in cases with higher fidelity (e.g., written traditions).

  The single most effective revision would be to replace Commitment 2's meme theory with a reconstruction-based transmission model. This would resolve multiple tensions at once while preserving the core insights about discrete units and cognitive biases.

  Throughout, I need to maintain the user's scientific rigor while helping them present a coherent position that withstands scrutiny from multiple disciplines. The goal is to help them articulate a nuanced view that acknowledges transmission complexities while defending cultural evolution as a valid framework.
answer: |-
  Here's a clear, ranked audit of your commitments, identifying tensions, fixes, costs, and the most impactful revision. The core instability lies in **transmission fidelity and unit definition**, with secondary tensions around adaptation.

  **Ranked Tensions by Severity:**

  1.  **Commitment 2 (Memes as Discrete Units w/ Fidelity) vs. Commitment 3 (Reconstruction & Low Fidelity)**
      *   **Severity:** **Extreme (The Core Contradiction)**. This is the most fundamental clash.
      *   **Nature of Tension:** C2 posits discrete tokens copied with fidelity sufficient for Darwinian inheritance, explaining stability via copying mechanisms (imitation, teaching). C3 directly contradicts this, arguing that stability arises *despite* low-fidelity copying ("transformation rather than copying," "copying fidelity is low, mostly an illusion"), driven by cognitive reconstruction biases. These cannot both be fully true simultaneously. If stability comes *only* from reconstruction biases (C3), the "discrete token" aspect and "fidelity of copying" central to the meme concept (C2) become largely irrelevant or misleading descriptors of the *transmission process* itself.
      *   **Cheapest Fix:** **Revise C2 to abandon the strict "meme" unit and high-fidelity copying as the *primary* mechanism.** Instead, frame cultural items as *templates for reconstruction* shaped by cognitive attractors. Emphasize that *what is transmitted* is often a *prompt* or *gist*, not a high-fidelity token, and stability emerges from shared cognitive biases converging on similar reconstructions.
      *   **Cost:** You lose the clean, gene-like analogy of the meme. This weakens the direct parallel to genetic evolution demanded by C1. You must explicitly argue that Darwinian processes (variation, selection, inheritance) *can* operate even with inheritance based on biased reconstruction, not faithful copying (resolving the C1 vs C3 tension below becomes crucial). Dawkins purists will object.

  2.  **Commitment 1 (Genuine Darwinian Process) vs. Commitment 3 (Reconstruction & Low Fidelity)**
      *   **Severity:** **High.** C1 asserts culture evolves "in a genuinely Darwinian sense" requiring "inheritance with *some fidelity*". C3 asserts "copying fidelity is low, and mostly an illusion".
      *   **Nature of Tension:** Low-fidelity reconstruction challenges the "inheritance" pillar of Darwinism. If variants are radically transformed each "generation," is it meaningful to talk about lineages and differential inheritance? Does low fidelity undermine the population-level process?
      *   **Cheapest Fix:** **Clarify C1/C3: "Some fidelity" doesn't mean *copying* fidelity, but *outcome* fidelity driven by cognitive attractors.** Argue that reconstruction *is* the inheritance mechanism in cultural evolution, and it *does* have sufficient fidelity *at the level of functional or recognizable units* due to shared cognitive constraints (even if the *process* isn't copying). Selection acts on the *reconstructed variants*. This aligns with the "stability lives in the biases" view (C3).
      *   **Cost:** Requires explicitly defending a non-standard (though increasingly accepted) view of "inheritance" within Darwinism. Some biologists may argue this stretches "Darwinian" too far. It necessitates abandoning the meme-as-copied-token view (ties into Fix #1).

  3.  **Commitment 4 (Selection for Attention/Memorability) vs. Commitment 5 (Functional Big Packages)**
      *   **Severity:** **Moderate.** C4 claims spread is "largely independent of whether it benefits its bearers," driven by attention/memorability, yielding junk. C5 claims major complexes "are mostly there because they *did work*" for groups.
      *   **Nature of Tension:** How can large, costly, functional packages emerge and persist if selection is driven by individual-level attention/memorability, not functionality? C4 suggests functionality is often irrelevant or even detrimental (junk spreads). C5 suggests it's crucial for major packages.
      *   **Cheapest Fix:** **Adopt Multi-Level Selection (MLS).** Framing: *Initial spread/variation* of cultural elements is primarily driven by individual-level cognitive biases (attention, memorability, ease of reconstruction - C3/C4). *Persistence and large-scale integration* of complex packages (C5) often involve *group-level* functional benefits and selection (e.g., groups with more cohesive/functional moral systems outcompete others). Acknowledge junk exists (C4) but explain why functional packages *can* dominate despite the "attentional" driver.
      *   **Cost:** MLS is contentious and requires careful definition/defense. It adds complexity. You must clarify the *level* at which selection operates for different phenomena. Hardcore individual-selection proponents may push back.

  4.  **Commitment 3 (Reconstruction/Low Fidelity) vs. Commitment 6 (Phylogenetics)**
      *   **Severity:** **Moderate.** C6 advocates phylogenetic trees built on the model of historical linguistics, implying tree-like descent with modification and identifiable homologies. C3 emphasizes transformation and reconstruction, which can lead to blending, convergent evolution due to universal biases, or rapid saltation, muddying clear lineages.
      *   **Nature of Tension:** Phylogenetic methods assume a significant degree of vertical transmission and identifiable homology. High levels of reconstruction, blending, or convergence (inherent in C3's process) can violate these assumptions, making trees inaccurate or impossible to construct meaningfully.
      *   **Cheapest Fix:** **Qualify C6: Phylogenetics is a powerful tool *where applicable*, but acknowledge its limits due to reconstruction biases.** Emphasize it's best suited for cultural domains with higher constraints (e.g., core vocabulary, complex toolmaking sequences, written texts) or shorter transmission chains. Frame it as reconstructing the *history of successful attractors* or *lineages of gists*, not necessarily literal copying chains. Use network methods alongside trees where blending is likely.
      *   **Cost:** Weakens the claim that phylogenetics is the *best shot* at being a genuine historical science *universally*. Requires acknowledging methodological limitations upfront. Some historical linguists might object to looser homology criteria.

  5.  **Commitment 4 (Junk/Maladaptation Possible) vs. Commitment 5 (Reject Maladaptation Stories)**
      *   **Severity:** **Mild (Manageable Nuance).**
      *   **Nature of Tension:** C4 acknowledges "junk or worse" spreads. C5 rejects "wholesale maladaptation stories" as lazy. Where's the line?
      *   **Cheapest Fix:** **Clarify Scope:** C4 applies to the *initial spread and prevalence of individual cultural variants*. C5 applies to the *large-scale, persistent cultural complexes* that shape societies over long periods. Argue that while individual memes/variants can be maladaptive junk, complex, costly, *enduring* systems like major religions likely have *some* functional underpinnings (individual or group-level) contributing to their persistence *despite* containing maladaptive elements. "Wholesale maladaptation" ignores this complexity.
      *   **Cost:** Requires careful articulation. Doesn't fully resolve *how* functional complexes emerge from an attentional driver (see MLS fix above).

  **Which Single Revision Cleans Up the Most?**

  **Revise Commitment 2: Abandon the strict "meme" (as discrete, faithfully copied token) as the unit of analysis.**

  *   **Why:** This is the epicenter of the worst tension (vs. C3) and strongly fuels the tension with C1. Fixing this allows you to coherently embrace C3's reconstruction view. It then becomes much easier to:
      *   Reconcile C1 & C3 by defining cultural inheritance as *reconstruction under cognitive constraints*.
      *   Frame C4 (attentional selection) as acting on *what is easily reconstructed and remembered*.
      *   Justify C6 (phylogenetics) as tracing lineages of *reconstructed attractors* rather than copied tokens.
      *   Maintain C5 by focusing on the *functional consequences* of reconstructed complexes at different levels.
  *   **How to Revise C2:** "I think the *cultural variant*, shaped by cognitive attractors, is the key unit. While cultural information often manifests in discrete, recombinable forms (songs, rituals, etc.), its transmission is fundamentally *reconstructive*. Stability arises because shared cognitive biases constrain reconstruction towards similar outcomes, not primarily through high-fidelity copying of tokens (except perhaps in specific contexts like writing)."
  *   **Cost:** Explicitly breaks from Dawkins' original meme concept. Requires defending the "attractor" model (e.g., Dan Sperber's epidemiology of representations). Some proponents of strict memetics will see this as a capitulation.

  **Final Coherent Package Summary:**

  1.  **Darwinian Core:** Culture evolves via population-level Darwinian processes (variation, selection, inheritance).
  2.  **Reconstructive Inheritance:** Transmission is predominantly *reconstructive* based on prompts/gists, not high-fidelity copying. Stability arises from shared cognitive biases ("attractors") converging on similar variants.
  3.  **(Implied by revised C2 & C3)**.
  4.  **Attentional Selection:** The primary driver of *differential spread* is cognitive salience (attentional capture, memorability, ease of reconstruction).
  5.  **Functional Persistence of Complexes:** Large-scale, persistent cultural complexes often persist due to functional benefits (often at group levels), emerging from and co-existing with the attentional driver. Wholesale maladaptation is implausible for such complexes.
  6.  **Phylogenetic Methods (with Caveats):** Phylogenetic reconstruction is valuable for tracing historical lineages where reconstruction biases allow identifiable descent, providing a crucial historical anchor against just-so stories. Its applicability depends on domain and transmission mode.

  This package resolves the core tensions by centering cognitive reconstruction as the inheritance mechanism, allowing Darwinian processes to operate without requiring gene-like copying fidelity, and explaining the emergence of functional complexity through multi-level selection acting on the outcomes of biased transmission. It provides a coherent anthropological perspective grounded in both evolution and cognition. Send this revised framework to your group – it's intellectually honest and ready for productive poking!
