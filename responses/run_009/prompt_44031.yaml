  My partner is a hardline open borders person (basically the Joseph Carens line that citizenship by birth is a kind of feudal privilege) and I keep defending something like the Walzer / Miller view that political communities get to shape their own membership, at least under decent conditions. We've been arguing for months and honestly mostly past eachother. Draft the joint statement we should have produced by now, as if we'd done a proper adversarial collaboration. I want: a numbered section of claims we both accept (we do agree current rich-state border regimes do a lot of gratuitous harm — the fight is over whether exclusion as such can be legitimate, not whether everything done in its name today is fine); the precise disagreements, each phrased so the person holding that view would sign off on the wording; the cruxes — I suspect one is whether a state's claimed right to exclude is more like an individual's freedom of association, more like a club's rules, or something that doesn't have a good private analogue at all, and another is whether the right comparison is a world with actually open borders or our current system with its lottery-like queues and arbitrary quotas; and, for each crux, a concrete case or kind of evidence we'd both agree bears on it (e.g. how we'd each analyse a small island community voting to admit no newcomers vs a huge rich country using skill-based quotas), with each of our predictions written down in advance. Also flag whether any part of our dispute is just verbal, and say which part and why. Please answer in British English.
