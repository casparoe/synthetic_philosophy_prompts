  Below is a complete game design tailored to your meetup's needs. It emphasizes the fragility of conventions (held together only by mutual expectations) and institutional inertia (entrenched conventions persisting even when dominated). The game uses tokens for payoffs, avoids real money, and fits within 90 minutes. I've structured it with clear phases, rules, materials, a timeline, debrief questions, and notes on predictable challenges.

  ---

  ### **Game Title**: The Expectation Trap  
  *Conventions form easily, but changing them requires shifting collective expectations—even when rationality demands it.*

  ---

  ### **Game Rules and Setup**  
  **Players**: 18 regulars (adjusted in Phase 3 with role assignments).  
  **Objective**: Accumulate as many tokens as possible by coordinating with partners.  
  **Phases**:  
  1. **Convention Formation** (Era 1 payoffs)  
  2. **Payoff Shift** (Era 2 payoffs)  
  3. **Displacement** (Era 2 payoffs + norm entrepreneurs + newcomers)  

  **Materials**:  
  - **Tokens**: Three types:  
    - *White tokens* (base currency, used for payoffs).  
    - *Red/Blue cards* (one per player per round; players write "RED" or "BLUE" to signal choice).  
    - *Signal cards* (for norm entrepreneurs; say: "I commit to BLUE. If you match, we earn extra, but I pay 1 token. Signed, a Norm Entrepreneur").  
  - **Tracking**: Whiteboard to display:  
    - Aggregate choices per round (e.g., "Round 1: 15 RED, 3 BLUE").  
    - Current payoff rules (updated per phase).  
  - **Pairing**: Deck of numbered index cards (1–18) for random partner assignment each round.  

  **Payoff Scheme** (Tokens awarded per interaction):  
  - **Era 1**: Symmetric coordination (baseline).  
    - Both choose RED: **3 tokens** each.  
    - Both choose BLUE: **3 tokens** each.  
    - Mismatch (RED/BLUE): **0 tokens**.  
  - **Era 2**: Asymmetric coordination (RED becomes dominated).  
    - Both choose RED: **2 tokens** each.  
    - Both choose BLUE: **4 tokens** each.  
    - Mismatch (RED/BLUE): **0 tokens**.  
  - **Norm Entrepreneur Cost**: Pay **1 token** to use a signal card (only in Phase 3).  

  **Key Mechanics**:  
  - Players interact in pairs each round, chosen randomly via index cards.  
  - Choices are simultaneous and secret (no communication except via signal cards).  
  - Tokens are physical (handed out by a facilitator); players track personal totals.  
  - **No discussion during gameplay** (to force reliance on expectations).  

  ---

  ### **Phase-by-Phase Timeline** (90 Minutes Total)  
  **Total Players**: Start with 18. In Phase 3, split into 12 regulars, 2 norm entrepreneurs, and 4 newcomers.  

  | Time  | Phase/Activity | Details | Duration |
  |-------|---------------|---------|----------|
  | 0-5   | **Introduction** | Explain rules, Era 1 payoffs, and goals. Emphasize: "Your choices affect your partner, and theirs affect you. Maximize tokens." Display payoffs on whiteboard. | 5 min |
  | 5-25  | **Phase 1: Convention Formation** (Era 1) | Play **6 rounds**. In each round: <br> 1. Randomly pair players (draw cards).<br>2. Players write RED/BLUE choice on cards in secret.<br>3. Reveal simultaneously; record match/mismatch.<br>4. Distribute tokens (3 each for match, 0 for mismatch).<br>5. Update whiteboard with aggregate choices (e.g., "Round 1: 14 RED, 4 BLUE").<br> *Goal: A convention (e.g., RED) emerges via salience (e.g., first-round majority becomes focal).* | 20 min (3 min/round) |
  | 25-30 | **Transition** | Announce: "Payoffs are changing! New rules apply." Display Era 2 payoffs. Highlight: "BLUE now earns more if matched, RED earns less." | 5 min |
  | 30-45 | **Phase 2: Payoff Shift** (Era 2) | Play **4 rounds**. Same procedure as Phase 1, but use Era 2 payoffs. Distribute tokens accordingly (4 for BLUE match, 2 for RED match, 0 for mismatch).<br> *Goal: Convention persists despite BLUE being dominant (players stick to RED due to mutual expectations).* | 15 min (3 min/round) |
  | 45-50 | **Transition to Displacement** | Secretly assign roles: <br>- **2 norm entrepreneurs** (hand them 3 signal cards each and instructions).<br>- **4 newcomers** (isolate them; give Era 2 rules only—no history).<br>- **12 regulars** (continue with accumulated tokens).<br>Announce: "New players are joining. Rules are unchanged." | 5 min |
  | 50-75 | **Phase 3: Displacement** (Era 2 + Roles) | Play **6 rounds**. Newcomers join; total players = 18. Each round: <br>1. Pair randomly (include newcomers).<br>2. **Norm entrepreneurs** may pay 1 token to use a signal card (commit to BLUE and send message to partner).<br>3. All players choose RED/BLUE secretly (newcomers have no bias).<br>4. Reveal choices; distribute tokens.<br>5. Update whiteboard.<br> *Goal: Entrepreneurs try to seed BLUE; newcomers reinforce inertia.* | 25 min (4 min/round) |
  | 75-90 | **Debrief** | Discuss using questions below. Map outcomes to Lewis's concepts. | 15 min |

  ---

  ### **Debrief Guide**  
  **Goals**: Connect gameplay to Lewis's theory, highlighting:  
  - Conventions as self-reinforcing mutual expectations.  
  - Salience and focal points in Phase 1.  
  - Conformity condition (I conform because I expect you to conform).  
  - Asymmetry: Easy to form, hard to replace.  

  **Key Questions**:  
  1. **Phase 1 (Convention Formation)**:  
     - "How did the convention (e.g., RED) emerge? Was it the first-round majority, randomness, or something else?"  
     - *Link to Lewis*: **Salience** made RED a focal point without explicit agreement. Once established, players conformed because they expected others to conform.  

  2. **Phase 2 (Payoff Shift)**:  
     - "BLUE became strictly better—why did most stick to RED? Did anyone try BLUE? What happened?"  
     - *Link to Lewis*: **Conformity condition** held the convention together. Switching risked a mismatch (0 tokens) unless expectations shifted uniformly. Players were "trapped" by mutual expectations, even when RED was collectively worse.  

  3. **Phase 3 (Displacement)**:  
     - "Did the norm entrepreneurs succeed? How did newcomers influence the convention?"  
     - "Why was changing the convention hard, even with entrepreneurs and fresh players?"  
     - *Link to Lewis*: Entrepreneurs faced **coordination costs** (paying tokens to signal). Newcomers inherited expectations (e.g., "RED is normal") without seeing the original problem, reinforcing inertia. This shows the **asymmetry**: Forming a convention requires only a focal point, but replacing it requires coordinated expectation-shifting.  

  4. **Big Picture**:  
     - "How does this illustrate that conventions are 'held together by nothing but mutual expectations'?"  
     - "When have you seen this in real life? (e.g., QWERTY keyboards, paper citations) What breaks inertia?"  

  ---

  ### **Predictable Challenges and Fixes**  
  1. **Convention Doesn’t Form in Phase 1**:  
     - *Risk*: With symmetric payoffs, choices may remain mixed (no focal point).  
     - *Fix*: Tweak the first round—secretly prime 3 players to choose RED. Or, if splits persist, highlight in debrief: "Without salience, coordination fails; mismatches cost everyone."  

  2. **Convention Shifts Too Easily in Phase 2**:  
     - *Risk*: Rational players may rapidly switch to BLUE if they expect others to.  
     - *Fix*: Emphasize anonymity and rotating partners to fracture common knowledge. In debrief, discuss: "Why did this group shift? Was there a new focal point (e.g., whiteboard trends)?"  

  3. **Norm Entrepreneurs Overpowered or Ineffective**:  
     - *Risk*: Entrepreneurs may be too persuasive (if signals work) or ignored (if cost is prohibitive).  
     - *Fix*: Adjust signal cost (start with 1 token; if too weak, lower to 0.5). Debrief their role: "Even with costly effort, one entrepreneur can’t shift expectations alone—it takes a critical mass."  

  4. **Newcomers Don’t "Forget" History**:  
     - *Risk*: Regulars role-playing newcomers may carry biases.  
     - *Fix*: Stress: "You are new—you’ve never played before. Ignore prior rounds." Isolate them during instructions.  

  5. **Time Shortfalls**:  
     - *Risk*: Rounds run long.  
     - *Fix*: Use a timer. Reduce Phase 1 to 5 rounds or Phase 3 to 5 rounds if needed.  

  ---

  ### **What This Game Can’t Reproduce (and How to Handle It)**  
  **Limitation**: No one-shot game can fully replicate the **long-term iterated expectations** of real-world conventions. Lewis emphasizes that conventions stabilize through repeated interactions in a population over time, with shared knowledge of history. Here, players know the game ends in 90 minutes, reducing the "shadow of the future."  

  **Mitigation**:  
  - During debrief, explicitly state: "In real life, conventions last because people expect interactions to continue indefinitely. Our game simulates this with rotating partners, but the endpoint weakens commitment. In the wild, this inertia is stronger."  
  - Use examples (e.g., driving-side rules) to contrast the game’s "compressed" timeline with historical conventions.  

  ---

  ### **Why This Works for Your Group**  
  - **Avoids Redundancy**: No rehashing Schelling/Lewis 101—focuses on the "harder facts" (mutual expectations and inertia).  
  - **Hands-On Learning**: Players *feel* the frustration of institutional inertia and the cost of norm entrepreneurship.  
  - **Scalable**: Works with 18 players; tokens and whiteboards handle payoff tracking.  
  - **Debrief Maps to Theory**: Explicitly ties outcomes to salience, conformity, and asymmetry in convention formation.  

  Run this as-is, and your meetup will leave with a visceral grasp of why "rational" conventions defy rationality when expectations take root.
