  Mackie's INUS condition: This maps neatly to minimal cut sets in fault trees, where each cause is a necessary part of a sufficient set. The "pruning" of irrelevant omissions in FMEA also mirrors handling proliferating absences. Solid fit, no residue.

  Hall's dualism: Dependence (counterfactuals) and production (physical chains) both exist in engineering. Fault trees handle dependence, while FMEA's detection ratings hint at physical mechanisms. But engineers blend these without metaphysical angst. Residue here is philosophical—engineers don't care about the dichotomy as long as the system gets fixed.

  Double prevention: Cases like "A prevents B, which would prevent C" are just causal chains in fault trees (e.g., a stuck valve allowing overpressure). Engineers model these without fuss. No translation loss.

  Now the residue report: The big gap is the metaphysical question—"Can absences *really* cause?" Engineers sidestep this by focusing on functional failures and actionable fixes. Their "tolerance" for omissions stems from prevention goals, not ontology. The user's suspicion is spot-on: philosophical squeamishness arises from attribution concerns, while engineering cares about what to do next. 

