answer: |-
  The legal practice you describe reveals a sophisticated, context-dependent approach to causation that implicitly rejects a pure metaphysical account of omissions as "events" or "happenings." Instead, it presupposes a **hybrid model combining counterfactual dependence with normative baselines**, leaning most heavily on **Theory (2) (restricted counterfactual theory)** as its operational foundation, while strategically deploying elements of Theory (1) (straightforward counterfactual) in statutory/public health contexts. Theory (3) (eliminativism) is rhetorically incompatible with judicial language but functionally latent in some outcomes. Below is a reconstruction, coherence assessment, and analysis of what change would entail.

  ---

  ### **Implicit Theory Reconstructed**
  1. **Core Presupposition**:  
     Causation requires **both** but-for dependence **and** a deviation from a **normative baseline** (legally established duties, roles, or expectations).  
     - *Lifeguard vs. Bystander*: Both satisfy but-for causation ("but for the failure, the child lives"). The difference is the baseline:  
       - The lifeguard’s role creates an expectation of action; his omission is a deviation.  
       - The bystander’s inaction aligns with the baseline expectation (no general duty to rescue).  
     - *Public Health Attribution*: Here, the baseline shifts to a **policy-defined norm** (e.g., vaccination rates, regulatory standards). "Deaths due to non-vaccination" imply deviation from an *idealized* baseline, not a legal duty owed by any specific actor.

  2. **Relationship to Candidate Theories**:  
     - **Theory (2) (Restricted Counterfactual)** is the **primary engine** for judicial outcomes. Courts treat omissions as causes only when there’s a prior duty defining what "should" have happened. Causation is relational: the omission is "causal" relative to the duty-bound norm.  
     - **Theory (1) (Straightforward Counterfactual)** is **imported indirectly** via statutes/agencies (e.g., EPA attributing deaths to "lack of regulation"). Courts accept these numbers without re-litigating causation because the normative baseline is set by the statute.  
     - **Theory (3) (Eliminativism)** is **functionally present but verbally denied**. Courts call the lifeguard’s omission a "cause," but liability is fundamentally about **enforcing a duty-bound obligation** (like contract). The "cause" label is a legal fiction masking normative judgment.

  ---

  ### **Coherence of the Practice**
  The system is **pragmatically coherent but philosophically unstable**:  
  - **Internally Consistent**: Duty filters counterfactuals to avoid infinite liability (flood of "absent preventers"). Public health’s counterfactual attributions are confined to non-tort contexts unless adopted by statute.  
  - **Inconsistencies**:  
    - Courts reject omission-as-cause in torts (bystander) but accept it when labeled "preventable deaths" by agencies.  
    - The lifeguard’s "cause" is treated identically to an act (same but-for test), yet its ontological status differs.  
  **Verdict**: The practice is **workably coherent** because it compartmentalizes contexts: tort law uses duty as a gatekeeper, while public health/policy uses unfiltered counterfactuals for aggregate analysis. The tension is managed, not resolved.

  ---

  ### **Outcomes Under a Pure Counterfactual View (Theory 1)**
  Replacing the current model with pure counterfactual dependence would:  
  1. **Abolish the Bystander Rule**: The bystander becomes liable, as their omission is a but-for cause.  
  2. **Flood of Liability**:  
     - Every "absent preventer" could be sued: a passerby who didn’t build a guardrail, a manufacturer who didn’t invent a safer product.  
     - Regulatory inaction (e.g., FDA failing to ban a drug) becomes a direct cause of harm, enabling suits against the government.  
  3. **Collapse of Doctrinal Safeguards**:  
     - **Duty** evaporates as a separate element.  
     - **Proximate cause** expands uncontrollably (no "scope of risk" limit for omissions).  
     - **Contract vs. Tort distinctions** blur (lifeguard liability shifts from breach of duty to "causing death").

  ---

  ### **Outcomes Under Explicit Normative Attribution (Theory 2/3)**
  If courts admitted omissions are normative labels:  
  1. **Lifeguard Cases**: Liability becomes **breach-of-duty compensation**, not "causing death." Damages might shift (e.g., no wrongful death claims).  
  2. **Public Health Data**: Epidemiological "causal" attributions would be exposed as **policy tools**, not scientific facts. Courts might reject them in tort cases unless tied to a legal duty.  
  3. **Generalization**: All omission-based causation (in law and policy) would be seen as **risk allocation**, not metaphysics. "Preventable deaths" would frame harm as societal failure, not individual causation.

  ---

  ### **Where Outcomes Would Genuinely Change**  
  1. **Bystander Liability**:  
     - Current: No liability.  
     - Under Pure Counterfactual: Liability for all feasible rescues.  
     - Under Normative Admission: Still no liability (no duty), but courts stop pretending it’s "not causation."  

  2. **Regulatory Omissions**:  
     - Current: No liability unless statute creates duty (e.g., via "mandatory duty" statutes).  
     - Under Pure Counterfactual: Agencies liable for harms counterfactually linked to inaction (e.g., FDA sued for not approving a drug faster).  
     - Under Normative Admission: Liability only if statute explicitly authorizes suits for omissions.  

  3. **Third-Party Omissions in Product Liability**:  
     - Current: No liability for "failure to invent" a safer alternative (absent duty).  
     - Under Pure Counterfactual: Inventors/companies liable for not creating life-saving products.  
     - Under Normative Admission: Courts might impose liability only if industry standards create an expectation.

  ---

  ### **Conclusion**
  The practice presupposes that **causation by omission is a normative construct**, masked by counterfactual language. It *needs* Theory (2) to function, *sits comfortably* with Theory (1) in policy contexts, and *hints* at Theory (3) in its outcomes. Replacing it with pure counterfactual dependence would collapse tort law into boundless liability, while embracing normative attribution would clarify but destabilize doctrines built on causal fictions. The system’s coherence relies on not asking too many questions across compartments—until a statute forces the issue.
