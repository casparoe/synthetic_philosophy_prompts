prompt: |-
  I've gotten pulled into a long-running argument with a friend who restores wooden boats, and it has become clear to me that we don't even agree on what would count as settling it. The trigger was a situation at the maritime museum where he volunteers: a century-old sloop whose hull has been re-planked so many times that no original timber survives above the waterline, while the discarded planks sit numbered in crates in the basement. A private collector has now offered to buy the crates and reassemble them into a second hull, and he and the collector's lawyer each insist, with total confidence, that only one of the resulting vessels is "the" sloop. Before I go back to my friend and argue about temporal parts or whatever else, I want the specification first: what would a theory of identity-over-time for artifacts actually have to deliver before it counts as adequate?

  Write me the desiderata. The cases it must get right should include at least the obvious ones — gradual replacement where each step seems to preserve the object, reassembly of discarded parts into a duplicate, and situations where the two happen side by side — but I'm also interested in the messier institutional cases: curators replacing the majority of an object and calling it conservation, restorations governed by professional charters, insurance and provenance practices that treat a largely rebuilt object as continuous for legal purposes. Include the distinctions the account has to respect, such as that between the identity of the object and the identity of its matter, and between metaphysical identity and socially conferred continuity. For each requirement, give the case or consideration that motivates it, and say why it's a requirement rather than a preference.

  Then tell me which of the desiderata are non-negotiable and which are really just prejudices of one camp — I've noticed that people who favor continuity of form and people who favor origin or matter seem to be demanding different things from the same word. Flag any pair or subset of the requirements you suspect can't be jointly satisfied, especially anything involving matching our ordinary judgments about the classic cases, since I have a suspicion that ordinary practice is itself inconsistent and that the full list is not satisfiable by any single criterion. Finally, say which single requirement does the most work to exclude otherwise attractive views. Skip a survey of the literature — what I want is the checklist, because my friend and I can't currently agree on what would even falsify our positions.
reasoning: |-
  Alright, the user is in a debate with a friend about the identity of a wooden boat that's been restored multiple times. The core issue is determining what makes the restored boat "the same" as the original, especially since all the original planks are now stored separately. They need a set of criteria (desiderata) to evaluate theories of identity over time for artifacts.

  First, I need to outline the essential requirements any theory must meet. The user mentioned several scenarios: gradual replacement, reassembly of parts, institutional practices like museum conservation, and legal aspects like insurance. Each desideratum should address these cases and explain why it's necessary.

  The key distinctions come to mind: object vs. matter, metaphysical vs. social identity. For example, the sloop's original planks reassembled create a new hull, but is that the same object? The museum likely sees the continuously restored boat as the original, even with replaced parts. That leads to desiderata like Continuity of Existence and Social/Functional Continuity.

  The Ship of Theseus problem is central here. The gradual replacement scenario must show that the boat remains the same through minor changes. But when the old planks are reassembled, does that create a new entity? The theory must handle both without contradiction.

  Institutional practices add complexity. Museums might replace most parts but still claim it's the same artifact for provenance. Legal continuity for insurance purposes might conflict with physical identity. So Social/Functional Continuity and Institutional Authority become important desiderata.

  Non-negotiable requirements would include Non-Identity of Matter and Object vs. Matter Distinction because they're fundamental to avoiding category errors. Contradiction Avoidance is crucial since a theory that allows two distinct objects to be identical is logically flawed.

  Trade-offs arise between Gradual Change Acceptance and Restoration Threshold. If a boat is 90% replaced, is it still the same? The museum's professional standards might say yes, but a strict matter-based view would say no. There's inherent tension here, especially when combined with Reassembly Exclusion.

  The user suspects ordinary practice is inconsistent. They're right—societal norms often prioritize function and continuity over material, leading to conflicts. For example, legal systems might recognize the restored boat as original, but a collector reassembling old parts could claim authenticity based on material origin.

  The most critical desideratum excluding many theories is Contradiction Avoidance. Theories like mereological essentialism (where any part change means a new object) fail because they can't handle gradual replacement. Meanwhile, conventionalism might accept both the restored boat and the reassembled one as originals, violating non-contradiction.

  The user's deeper need is to establish a framework for their argument. They want clear criteria to test theories against, moving beyond subjective preferences. Highlighting the non-negotiable requirements and inherent tensions helps them understand why no single theory satisfies all desiderata, possibly leading them to accept a hybrid approach or context-dependent solutions.
answer: |-
  Here is a specification of desiderata for an adequate theory of identity-over-time for artifacts like the sloop, derived from the core problem and its broader implications. Requirements are ranked by fundamentality, with non-negotiables flagged. Tensions are explicitly noted.

  ## Core Desiderata (Non-Negotiables)

  1.  **Non-Identity of Matter:** The theory **must not** equate the identity of the artifact with the identity of its constituent matter.
      *   *Why Requirement:* Motivated by gradual replacement (Ship of Theseus). If replacing one plank doesn't destroy the ship (which it demonstrably doesn't in practice), then the ship ≠ the sum of its planks at any given time. Violating this leads to absurdity (every microscopic change creates a new object).
      *   *Case:* Replacing a single rotten plank on the sloop. The sloop persists.

  2.  **Object vs. Matter Distinction:** The theory **must** clearly distinguish the persistence conditions of the *artifact* from the persistence conditions of the *aggregate of matter* currently composing it.
      *   *Why Requirement:* Motivated by the reassembly scenario. The crated planks are the *original matter aggregate*; the restored hull in the museum is the *artifact*. Any adequate theory must account for why these are distinct entities with different persistence conditions. Failure here collapses artifact identity into mereology.
      *   *Case:* The reassembled crated planks form a *new* aggregate (perhaps even a *new* artifact), distinct from the sloop currently in the museum.

  3.  **Contradiction Avoidance:** The theory **must not** allow that two distinct, spatially separated objects at the same time can both be identical to one original object.
      *   *Why Requirement:* Fundamental logic (Leibniz's Law). Motivated by the core dispute: the museum hull and the reassembled hull cannot both be "the" original sloop simultaneously. Any theory permitting this is logically incoherent and fails as a theory of *identity*. This excludes "branching" or "both are the original" solutions.
      *   *Case:* The museum sloop and the collector's reassembled hull both claiming to be "the" century-old sloop at time T.

  4.  **Gradual Change Acceptance:** The theory **must** account for the persistence of an artifact through gradual, piecewise replacement of its material components, where *each individual replacement step seems insignificant to the artifact's continued existence*.
      *   *Why Requirement:* Motivated by repair and maintenance practices fundamental to artifact use (boats, houses, cars, tools). Denying this makes artifact identity implausibly fragile and contradicts universal intuition and practice. This is the core of the Ship of Theseus intuition.
      *   *Case:* The sloop remaining "the sloop" after decades of re-planking, keel repair, deck replacement, etc., one piece at a time.

  ## Essential Desiderata (Strongly Expected)

  5.  **Reassembly Exclusion:** The theory **must** explain why reassembling discarded original components into a new functional whole (after they have been removed and replaced on the original artifact) does *not* result in the original artifact coming back into existence or being identical to the reassembled object.
      *   *Why Requirement:* Motivated directly by the sloop case and the Ship of Theseus "reassembly" variant. Failure means the reassembled hull *is* the original sloop, contradicting the museum hull's claim and violating Contradiction Avoidance (#3). This excludes theories heavily privileging original matter *after* its removal.
      *   *Case:* The collector reassembling the crated, numbered planks into a new hull.

  6.  **Spatio-Temporal Continuity (Weak):** The theory **should** generally require some form of non-branching, continuous existence in space-time for the artifact, *without* requiring strict continuity of matter.
      *   *Why Requirement (Expected):* Motivated by the intuition that an object can't teleport or jump discontinuously without ceasing to be (barring very specific sci-fi/fantasy contexts). The artifact's path through space-time is a strong defeasible indicator of its persistence.
      *   *Case:* The sloop in the museum has a continuous history of being located at the museum (or dry dock, then museum) since its last restoration. The reassembled hull has a discontinuous history (planks crated, then moved to collector's workshop).

  7.  **Functional/Configurational Continuity:** The theory **should** heavily weight the preservation of the artifact's defining form, structure, and function as central to its persistence.
      *   *Why Requirement (Expected):* Motivated by the very purpose of artifacts. A boat is defined by being a water-going vessel of a specific type. Replacing planks while maintaining the hull shape and sailing function preserves the boat. Smashing it to bits and using the wood for a cabinet destroys it, even if the matter persists.
      *   *Case:* The museum sloop retains its original design, lines, rigging type, and function (as a display vessel, if not sailing). The reassembled planks form a hull, but it may lack original fastenings, rigging, etc., and its function is ambiguous (display replica?).

  8.  **Origin Sensitivity:** The theory **should** acknowledge the artifact's causal history, particularly its creation event and initial configuration, as a necessary (though perhaps not sufficient) condition for its identity.
      *   *Why Requirement (Expected):* Motivated by the distinction between an original artifact and a replica or forgery. Two identical-looking sloops built at different times are distinct artifacts. The origin sets the "starting point" of identity.
      *   *Case:* The museum sloop traces its causal history back to the original shipyard launch. The reassembled hull traces its causal history back to the collector's workshop assembly.

  ## Contextual/Institutional Desiderata

  9.  **Social/Functional Continuity:** The theory **must be compatible** with the social practice of treating an artifact with significant replaced parts as the *same* artifact for purposes of provenance, ownership, legal liability, insurance, historical significance, and narrative continuity, even when metaphysical identity might be questioned.
      *   *Why Requirement:* Motivated by museum conservation, antique restoration, insurance settlements, and inheritance law. An account that renders these practices incoherent or "false" is pragmatically inadequate, even if metaphysically pure. It highlights the distinction between metaphysical identity and social/practical continuity.
      *   *Case:* The maritime museum, following conservation ethics, insures and catalogues the re-planked hull as "the" 100-year-old sloop. Legally and historically, it *is* treated as continuous with the original.

  10. **Institutional Authority:** The theory **must be compatible** with the role of institutional norms, expert judgment, and professional standards (e.g., museum conservation charters) in determining what counts as "the same artifact" within specific contexts, especially when material change is significant.
      *   *Why Requirement:* Motivated by conservation practice. A conservator replacing 90% of a sculpture's material based on rigorous historical research and professional ethics is deemed to have preserved "the" sculpture. Denying this ignores how identity is often *operationalized* in practice.
      *   *Case:* The museum's conservation policy defines thresholds and methods for replacement that preserve identity for institutional purposes.

  11. **Restoration Threshold:** The theory **should acknowledge** that while gradual change preserves identity, there might be (vague, context-dependent) limits where replacement becomes so extensive or radical that the result is a replica or new artifact, *even if* Social Continuity (#9) still applies.
      *   *Why Requirement (Expected):* Motivated by extreme cases. Replacing *every single part* simultaneously using new materials clearly creates a replica, not the original. Where the line is drawn is fuzzy and context-dependent (function, form, institutional practice), but the *possibility* of crossing a threshold must exist.
      *   *Case:* If the museum replaced the entire hull, deck, mast, rigging, and fittings all at once with new materials based on original plans, many would intuitively feel the *original* sloop was gone, replaced by a replica, even if the museum still called it "the sloop" for display purposes.

  ## Key Tensions & Non-Negotiables

  *   **Non-Negotiables (Metaphysical Floor):** #1 (Non-Identity of Matter), #2 (Object vs. Matter Distinction), #3 (Contradiction Avoidance), and #4 (Gradual Change Acceptance) form the absolute bedrock. Any theory violating these is fundamentally inadequate for artifacts.
  *   **The Core Tension:** **#4 (Gradual Change Acceptance)** vs. **#5 (Reassembly Exclusion)** vs. **#11 (Restoration Threshold)**. This is the Ship of Theseus trilemma. How can gradual replacement preserve identity, reassembly not restore it, and yet near-total replacement potentially destroy it? Many theories sacrifice one (e.g., mereological essentialism sacrifices #4; extreme conventionalism struggles with #5).
  *   **Social vs. Metaphysical Tension:** **#9 (Social Continuity)** & **#10 (Institutional Authority)** can significantly conflict with strict interpretations of #5, #7, or #11. A museum *must* treat its conserved sloop as the original for its purposes, even if a philosopher argues it's a replica due to material loss. An adequate theory must *accommodate* the validity of social continuity practices without necessarily *equating* them with metaphysical identity.
  *   **Matter vs. Form Prejudices:** The "matter camp" (favoring origin/original material) prioritizes #5 and #8 but struggles mightily with #4 and #9. The "form/function camp" prioritizes #4, #7, and #9 but can struggle with #5 and #8, especially when reassembly seems compelling. #3 (Contradiction Avoidance) forces both camps to reject the reassembled hull as the original.
  *   **The Hardest Exclusion:** **#5 (Reassembly Exclusion)** does the most work to exclude otherwise attractive views. Theories heavily emphasizing original matter (e.g., some "origin-plus" theories) or theories relying on continuity of form *alone* can struggle to explain why reassembling *all* the original matter into the original form doesn't resurrect the original ship. Satisfying #5 while holding #4 and #7 requires something more (like spatio-temporal continuity - #6, or a strong notion of causal history/path-dependence - #8).

  ## Suspected Inconsistency

  Your suspicion is correct. **Ordinary practice and intuition are likely inconsistent.** We intuitively accept #4 (gradual replacement preserves identity) and find #5 (reassembly doesn't) compelling, yet we also sense #11 (a threshold exists) and rely heavily on #9/#10 (social/institutional continuity). Reconciling all these *perfectly* with strict logic (#3) is likely impossible for a single, simple criterion. An adequate theory will likely involve:

  1.  **A metaphysical core:** Satisfying #1-#4 and #5, likely relying on a combination of weak spatio-temporal continuity (#6), causal history/origin (#8), and functional/configurational continuity (#7) as the persistence conditions.
  2.  **Acknowledging context:** Accepting that #9 and #10 represent a distinct but crucial *practical/social* notion of continuity that operates alongside, and sometimes masks, the metaphysical facts.
  3.  **Embracing vagueness:** Recognizing that #11 (Restoration Threshold) involves genuine vagueness where there is no fact of the matter whether "the same object" persists after extreme change, though social practice (#9/#10) will impose a pragmatic answer.

  ## The Checklist for Falsification

  When arguing with your friend, test their position against these core requirements:

  1.  **Does their view equate the artifact with its matter?** (Violates #1)
  2.  **Does their view allow both the museum hull and reassembled hull to be the original sloop at the same time?** (Violates #3)
  3.  **Does their view deny that the sloop survives a single plank replacement?** (Violates #4)
  4.  **Does their view *require* that reassembling the original planks restores the original sloop?** (Violates #5, and likely #3)
  5.  **Can their view explain why the museum hull, not the reassembled one, has the continuous history tracing back to launch?** (Tests #6, #8)
  6.  **Can their view accommodate the museum's *practice* of calling the conserved hull "the original" for provenance and display?** (Tests compatibility with #9/#10, even if their view is metaphysical)

  A view failing #1, #2, #3, or #4 is fundamentally inadequate. A view failing #5 is deeply problematic for the sloop case. A view incompatible with #9/#10 might be metaphysically coherent but pragmatically deficient. The challenge is finding a view that satisfies the non-negotiables while best navigating the core tensions (#4/#5/#11) and accommodating the social realities (#9/#10).
