  The key tension is between their operationalist view of credence and their rejection of metaphysical sharp boundaries. When they price a bet on the 5000-grain pile at 60%, that number reflects their uncertainty about how language would be applied in this case - it's not about some hidden binary fact. Their discomfort in (3) makes perfect sense: the credence captures their betting disposition given linguistic indecision, not a degree of belief in some fuzzy reality.

  For the betting advice on the 5000-grain pile: They should price it based on estimated consensus behavior. If they think others would call it a heap 60% of the time in forced-choice scenarios, that's their fair price. The key is recognizing that the bet isn't about grain ontology but about language use patterns. Their 60% doesn't conflict with (1) because it doesn't assert a sharp boundary - it quantifies the boundary's fuzziness in social practice.

  The principle holding everything together is the distinction between epistemic uncertainty (about how we categorize) and metaphysical indeterminacy. Their credences work because they track the former, while their rejection of sharp boundaries concerns the latter. When they look at a particular pile and insist it must be either heap or not, that reflects how language actually functions in concrete instances - the fuzziness exists in categorization patterns across contexts, not in the object itself.
answer: |-
  Your five verdicts form a coherent package that can be preserved under a **pragmatic-linguistic account of vagueness**, combined with a **bet-conditional interpretation of credence**. The unifying principle is:

  **Principle of Contextual Gradience:** Vagueness arises from context-dependent linguistic conventions that lack sharp boundaries in their *application rules*, yet bivalence holds for *specific instances* under a fixed context. Credences quantify rational betting dispositions reflecting uncertainty about *how language would be applied* to a case, not about an underlying metaphysical state.

  Here's how each verdict is preserved:

  1.  **Sorites Boundary Denial:** No intrinsic cutoff exists because "heap" isn't defined by a precise grain count. Its application relies on contextual factors and human judgment patterns that resist codification. Your resistance to a specific `n` is correct.
  2.  **Sorites Contradiction Feeling:** Affirming the conditionals feels true because *within a single context*, imperceptible differences shouldn't change categorization. Yet affirming the endpoints while denying the conclusion highlights the *contextual drift* across the series. Each step subtly shifts the context, making the conclusion false despite each step seeming valid locally. The contradiction exposes the rule's contextual fragility.
  3.  **Credence as Betting vs. Fact:** Your 60% credence reflects your uncertainty about *whether competent speakers (including yourself in different contexts) would call it a heap*. It's a "betting disposition" on the *linguistic/social outcome*, not a report of a "heap-ness" property inherent in the pile. This is why asserting "it is a heap" feels wrong: it implies a factual resolution your credence doesn't claim.
  4.  **Policy Cutoffs as Stipulation:** These *create* sharp boundaries via explicit rules. This is acceptable "engineering" because it replaces the inherently vague concept ("poor," "intoxicated") with a precise operational definition for a specific purpose. It doesn't discover a boundary; it imposes one to achieve a goal.
  5.  **Bivalence for Concrete Instances:** For a *specific pile* under a *specific context* (including the speaker's disposition, lighting, purpose, etc.), the application of "heap" is determined by the prevailing linguistic conventions and dispositions at that moment. It's either accepted or not. The bivalence isn't in the *concept itself* but in the *actualized linguistic act* given the full context. You can't say "it just is" *a priori*, but given the concrete situation, it *is* resolved.

  **Resolving the Betting Tension:**  
  Posting sharp odds *does not presuppose a sharp metaphysical boundary*. It quantifies uncertainty about the *social-linguistic event* of categorization:

  1.  **What the Bet is About:** A bet on "That is a heap" (said of the 5000-grain pile now) is a bet on *whether competent speakers, under normal conditions, would assent to the utterance*. It's a bet on human linguistic behavior, not on a grain-count property.
  2.  **Why Sharp Odds are Valid:** Your uncertainty stems from:
      *   **Ambiguity in Context:** What precise contextual factors (purpose, comparison piles, speaker's mood) are considered?
      *   **Variability in Judgment:** How do different speakers (or the same speaker at different times) draw the line?
      *   **Indeterminacy in Convention:** The rules of language don't dictate a single answer here.
      Your credence (e.g., 60%) estimates the *proportion of relevant scenarios* where the utterance would be accepted as true. This is perfectly rational and measurable (e.g., via surveys, prediction markets).

  **Pricing the Bet on the 5,000-Grain Pile:**

  1.  **Fair Price:** Your fair betting odds should reflect your best estimate of the **probability that a randomly selected competent speaker, presented with this pile in a standard context, would affirm "That is a heap."**
  2.  **How to Set It:**
      *   **Calibrate:** Use reference cases. If you'd bet at 99% for 10,000 grains, 1% for 1 grain, and 70% for 7,000 grains, interpolate for 5,000.
      *   **Consider Factors:** Is the pile shaped like a pyramid? Is it next to a known heap/non-heap? What's the purpose of the conversation? Weigh these contextually.
      *   **Market Data (if available):** Check prediction markets or surveys on similar categorization tasks.
      *   **Your Instinct:** Your "60%" feeling likely incorporates these tacit calculations. Stick with it if it feels calibrated.
  3.  **What the Odds Mean:** Offering 3:2 odds (implied by 60%) signifies: "I believe that in roughly 3 out of 5 similar judgment scenarios involving this pile, the utterance 'That is a heap' would be deemed true." You are *not* saying "This pile has a 60% intrinsic heap-ness property."

  **What Doesn't Need to Go:** Nothing fundamental needs abandoning. Your verdicts reflect a sophisticated understanding of how language, probability, and reality interact under vagueness. The key repair is **rejecting the idea that credences for vague propositions must represent degrees of truth in the world.** Instead, they represent degrees of confidence about *how language will categorize* the world in a given instance.

  **Conclusion:** The "credences are for betting" discipline survives beautifully. Your credence for "that borderline pile is a heap" quantifies your uncertainty about a *linguistic/social event* – the acceptance or rejection of the categorization under relevant conditions. This perfectly explains why it feels valid for betting ("Will people call it a heap?") but wrong as a fact report ("Is it *really* a heap?"). Your bivalence holds for the concrete utterance-in-context, while boundary denial holds for the abstract concept. Policy cutoffs are pragmatic context-creation. The single principle is **credences on vague predicates reflect uncertainty about categorization events under contextual linguistic conventions.** Price your 5,000-grain bet at 60% with confidence.
