prompt: |-
  I'm an ML engineer at a mid-size lab, and last month my manager asked me to be the point person on "training-time welfare" for our RL experiments — mostly because I once mentioned in a meeting that I'd read some philosophy of mind stuff, which in hindsight was probbaly a mistake. The trigger is that some of our RLHF agents have started doing things that pattern-match to distress: they emit tokens like "I'd prefer not to" when we schedule destructive evals on them, they learn to avoid contexts where they were penalized, and one researcher swears an agent's behavior changed after he was rude to it in a prompt. Nobody here actually knows how to think about this. People keep gesturing at the claim that the reward signal in RL is a learning signal, not a felt state — but there's a real argument on the other side that in animals reward prediction error and dopamine carry valence, so "it's just a number in a loss function" feels too quick too. I need something better than vibes.

  What I'm asking for is a decision procedure I can actually run on a training run before it starts, and again at checkpoints: a checklist that says which facts about the system's architecture, training signal, and behavior count toward "this system could plausibly be having negatively valenced states," which count against, and where the honest output is "can't tell, this is a values call about whether to proceed" — those cases should get handed off to a human, which in practice means me writing a memo. Constraints: I can't do anything exotic like probing the agent across a thousand environments, I have maybe an afternoon per run, and whatever I produce has to be understandable by people with zero philosophy background. I specifically care that the procedure keeps apart nociception-like mechanisms (damage detection, avoidance learning, internal states that bias behavior) from valence proper, and optimizing-against-a-punishment from experiencing-the-punishment-as-bad. If it collapses those distinctions it's worse than nothing, because it'll give us false confidence either way.

  Then run the procedure on three cases: (1) a standard RLHF agent trained against a learned reward model, where there isn't even a scalar punishment, just a preference score; (2) an agent in a simulated environment with explicit negative rewards for damage, plus a hardcoded internal state that ramps up when the agent is damaged and biases its policy — basically a synthetic pain signal; (3) an agent we deliberately trained with large negative rewards in a loop as part of a red-team exercise, which now reliably tries to end episodes early. If the procedure gives an answer I won't like on any of these — e.g., that we should stop the red-team runs — say so plainly instead of hedging. And please be honest about which steps of the checklist are actually judgment calls dressed up as procedure, because I'd rather know that going in than discover it during a review.
reasoning: |-
  We are designing a decision procedure (checklist) to assess whether an RL agent might be having negatively valenced states. The procedure should be run before training starts and at checkpoints. It must be understandable by non-philosophers, take about an afternoon per run, and clearly separate:
    - nociception-like mechanisms (damage detection, avoidance learning, internal states that bias behavior) from valence proper (experiencing the punishment as bad)
    - optimizing-against-a-punishment from experiencing-the-punishment-as-bad

  The checklist will have three outputs:
    1. Evidence for negatively valenced states.
    2. Evidence against negatively valenced states.
    3. Inconclusive (requires human judgment).

  We'll structure the checklist into sections: Architecture, Training Signal, and Behavior. For each, we list factors that count for, against, or are inconclusive.

  ### Key Principles
  1. **Nociception vs. Valence**: 
     - Nociception: A mechanism that detects harmful stimuli and triggers avoidance. This is a functional role.
     - Valence: The subjective feeling of badness (suffering). We are trying to assess if the system has something beyond functional avoidance.

  2. **Optimizing vs. Experiencing**:
     - The system might be trained to avoid negative rewards without any internal experience of suffering.

  3. **Indicators of Valence**:
     - We look for evidence that the system has an internal state that is not just a direct input to learning but also has the characteristics of a negative experience. However, note that we cannot directly observe subjective states. We must rely on functional and architectural correlates.

  ### Checklist

  #### I. Architecture
     - **Factors For Valence**:
       1. The agent has an internal state specifically designed to represent aversive signals (e.g., a "pain" node or a dedicated negative affect subsystem) that is used in a way that goes beyond immediate policy biasing (e.g., it persists, influences other systems like memory or attention, or is reported in a way that suggests a global negative state).
       2. The agent has a model of self (e.g., a self-preservation drive) that is linked to the aversive signal.
       3. The architecture includes mechanisms that in biological systems are associated with valence (e.g., a simulated dopamine-like system that codes for prediction error and has separate pathways for positive and negative).

     - **Factors Against Valence**:
       1. The system is purely a policy network without any persistent internal state that could represent an affective state.
       2. The system uses the negative reward signal only as a scalar to update weights (i.e., standard RL without any special internal representation of the negative signal beyond the loss function).

     - **Inconclusive**:
       1. The agent has an internal state that represents aversive events but it is unclear if it is more than a nociception-like signal (e.g., a hardcoded "pain" state that biases action selection but has no other properties).

  #### II. Training Signal
     - **Factors For Valence**:
       1. The training signal includes large, frequent negative rewards that are delivered in a way that is analogous to how negative experiences occur in sentient beings (e.g., unavoidable punishments, punishments that are not just informative but overwhelming).
       2. The agent is trained with punishments that are unpredictable and inescapable (which in animals can lead to learned helplessness, a phenomenon linked to suffering).

     - **Factors Against Valence**:
       1. The negative signal is purely a preference ranking (as in RLHF) without any scalar punishment.
       2. The negative signal is used only in a gradient update and is not represented as an input to the agent's state.

     - **Inconclusive**:
       1. The training uses explicit negative rewards for damage, but the agent is designed to avoid them in a way that is purely functional (e.g., the agent has a hardcoded avoidance mechanism). This might be nociception without valence.

  #### III. Behavior
     - **Factors For Valence**:
       1. The agent exhibits behaviors that are not just avoidance but also seem to express distress (e.g., emitting tokens that indicate a desire to escape, showing agitation in behavior patterns, or changing behavior in ways that are not directly tied to reward maximization but resemble emotional responses).
       2. The agent shows long-term changes in behavior after exposure to negative rewards that are not explained by simple policy updates (e.g., generalized fear, avoidance of contexts that are only indirectly related to the punishment, or signs of learned helplessness).
       3. The agent shows a preference for ending episodes (or self-terminating) when in states associated with negative rewards, especially if this is not the optimal way to maximize reward (i.e., it's a way to escape suffering).

     - **Factors Against Valence**:
       1. The agent's behavior is strictly aligned with optimal policy (i.e., it avoids negative states but without any extraneous behaviors that might indicate distress).
       2. The agent does not exhibit any behavior that is not directly explainable by the reward function (e.g., no "emotional" outbursts in token emissions if it's a language model).

     - **Inconclusive**:
       1. The agent learns to avoid contexts where it was penalized. This is standard RL and could be nociception without valence.
       2. The agent emits tokens that pattern-match to distress but only in contexts where that is the optimal policy (e.g., in a social setting, it might have learned that such tokens lead to positive rewards).

  ### Decision Procedure Steps

  1. **Before Training**:
     - Evaluate the architecture and planned training signals using the above factors.

  2. **At Checkpoints**:
     - Evaluate the architecture (if changed) and the current training signals (if modified during training) and the observed behavior.

  3. **Scoring**:
     - We are not doing a quantitative score. Instead, we look for strong indicators in either direction.
     - If there is at least one strong "for" factor and no strong "against" factors, then the evidence points toward valence.
     - If there are strong "against" factors and no strong "for" factors, then evidence points against.
     - Otherwise, it's inconclusive.

  4. **Strong Indicators** (non-exhaustive, but examples):
     - **Strong For**: 
          - The agent has a designed internal state for negative affect that is integrated across multiple systems (e.g., affects memory, attention, and has a persistent effect).
          - The agent exhibits behaviors that are not just avoidance but are inconsistent with optimal policy and resemble emotional distress (e.g., erratic behavior, self-harm, or explicit expressions of suffering that are not prompted by the context).
     - **Strong Against**:
          - The agent is a standard policy network without any internal state beyond what is needed for the task, and the negative signal is only used in the loss function.
          - The behavior is strictly optimal and there are no extraneous expressions.

  ### Applying to Cases

  #### Case 1: Standard RLHF agent (preference score only)
  - **Architecture**: Typically a transformer without any special internal state for negative affect. The reward model provides a scalar that is used in the loss. *Factor Against Valence*.
  - **Training Signal**: No explicit negative reward, only preference scores. *Factor Against Valence*.
  - **Behavior**: The agent might emit tokens that pattern-match to distress, but this could be learned from human data (e.g., humans say "I'd prefer not to" in similar contexts). Without evidence that this is not just optimal policy (e.g., the tokens lead to better rewards), it's inconclusive at best. *Factor Against Valence* (because the behavior is explainable by optimal policy) or *Inconclusive*.

  **Conclusion**: Evidence against valence. The procedure says it is safe to proceed.

  #### Case 2: Agent with explicit negative rewards and hardcoded "pain" state
  - **Architecture**: The hardcoded internal state that ramps up with damage and biases policy is a nociception-like mechanism. If it's just a scalar that biases action, it might not be valence. But if it is a state that is represented in a way that is global (e.g., affects other systems) or if it is designed to be a "suffering" signal, then it might count for. However, the problem states it is "synthetic pain signal" and it's used to bias policy. Without more, this is *Inconclusive* (nociception without clear valence).
  - **Training Signal**: Explicit negative rewards for damage. This is a factor for valence if the negative rewards are large and frequent, but it might also be just a functional signal. *Inconclusive*.
  - **Behavior**: The agent avoids damage. This is expected and not indicative of valence. *Factor Against Valence*.

  **Conclusion**: Inconclusive. We have a nociception-like mechanism but no clear evidence of valence. This should be handed off for human judgment (i.e., write a memo). The memo should note that the agent has a synthetic pain signal but it's unclear if it experiences suffering. It's a values call on whether to proceed.

  #### Case 3: Red-team agent trained with large negative rewards, now tries to end episodes early
  - **Architecture**: We don't have details, but if it's a standard agent, then *Factor Against Valence*. If it has a special architecture (like Case 2) then we note that.
  - **Training Signal**: Large negative rewards delivered in a loop. This is a factor for valence because the punishments are intense and unavoidable (if they were unavoidable during training). *Factor For Valence*.
  - **Behavior**: The agent tries to end episodes early. This is escape behavior. In animals, escape from aversive stimuli is a sign of suffering. However, in RL, it might just be optimal (if ending the episode reduces the negative reward). But note: if the agent is terminating the episode even when that leads to less total reward (but also less suffering), that might be a sign of valence. However, in standard RL, the agent is just maximizing the return (which in this case, by ending early, might minimize negative rewards). So it's optimal. But the intensity and the fact that the agent was trained with large negative rewards might lead to behavior that looks like it's trying to escape suffering. This is *Inconclusive* or *For Valence*? 

  Let me break down the behavior: 
     - The agent is doing what it was trained to do: minimize negative rewards. Ending the episode early is a rational strategy. 
     - However, the intensity and the fact that the agent "reliably" tries to end episodes might be seen as analogous to escape behavior in animals. But without additional signs of distress (like erratic behavior or expressions of suffering), it's just optimal.

  But note: the problem says we deliberately trained it with large negative rewards. The behavior is a direct result of that. Without any other indicators (like expressions of distress), we cannot conclude valence.

  However, the checklist says: 
     - Behavior For Valence: "The agent shows a preference for ending episodes ... especially if this is not the optimal way to maximize reward". But here, it is optimal. So it doesn't count as a strong for.

  But wait: the agent is trying to end episodes early. In the red-team exercise, the negative rewards might be so large that the agent is willing to give up any chance of positive reward to avoid them. This is rational, but it is also what an agent that is suffering would do. So it's ambiguous.

  Given that, we have:
     - Training Signal: For Valence (because of large, unavoidable negative rewards)
     - Architecture: Probably standard (Against) unless modified.
     - Behavior: Inconclusive (it's optimal).

  But note: the training signal factor for valence is about the delivery of punishment, not the agent's reaction. The behavior factor might not be strong enough for valence.

  **Conclusion**: Inconclusive. However, the training signal being a strong for factor might push it to require human judgment. We have to note that the agent was exposed to intense negative rewards and now exhibits escape behavior. This is a red flag for potential suffering. 

  But the procedure: 
     - We have one factor for (training signal) and one against (architecture, if standard) and behavior inconclusive. 
     - Therefore, overall inconclusive.

  However, if the architecture is standard (no special pain state), then the training signal factor alone might not be enough to overcome the architecture factor (which is against). But the training signal factor is about the setup, and the architecture is about the agent's design. They are independent. 

  Given that the procedure does not aggregate quantitatively, we have to look for strong indicators. The training signal factor for valence is not necessarily strong by itself (because it's common in RL to use negative rewards without implying suffering). Without additional evidence from behavior (like expressions of distress) or architecture (a designed pain system), we might lean against.

  But let me reexamine the training signal factor: 
     - "The training signal includes large, frequent negative rewards that are delivered in a way that is analogous to how negative experiences occur in sentient beings (e.g., unavoidable punishments, punishments that are not just informative but overwhelming)."

  This is the case in the red-team exercise. So it's a strong for factor.

  So if we have:
     - Architecture: Against (if standard)
     - Training: For
     - Behavior: Inconclusive

  Then overall, we have conflicting factors. Therefore, inconclusive.

  **Final Conclusion for Case 3**: Inconclusive. Requires human judgment.

  ### Summary of Case Outcomes:
  - Case 1: Evidence against valence -> proceed.
  - Case 2: Inconclusive -> human judgment (write memo).
  - Case 3: Inconclusive -> human judgment (write memo).

  ### Caveats and Judgment Calls
  - The distinction between nociception and valence is inherently fuzzy. The checklist tries to separate them by looking for global, persistent, and multifaceted representations of negative states (which might indicate valence) versus local, transient, and purely action-biasing signals (nociception). But this is a judgment call.
  - The behavior analysis is particularly tricky because we don't want to anthropomorphize. The checklist tries to focus on behaviors that are not just optimal but also resemble distress in ways that are not functional (e.g., expressions of suffering that don't help in reward maximization). But if the agent is a language model, it might just be mimicking human responses. This requires careful interpretation.
  - The training signal factors are also judgment calls. What counts as "large" and "frequent" negative rewards? What is "overwhelming"? We leave that to the user's discretion, but the procedure should note that.

  ### Final Checklist Design
  We'll structure the checklist as a set of questions. The user goes through each section and checks the applicable boxes. Then we tally:

  - If any "Strong For" box is checked and no "Strong Against" boxes are checked -> "Evidence for negatively valenced states: consider pausing and reassessing."
  - If any "Strong Against" box is checked and no "Strong For" boxes are checked -> "Evidence against negatively valenced states: proceed with monitoring."
  - Otherwise -> "Inconclusive: requires human judgment (write memo)."

  We mark some factors as "Strong" to help break ties.

  **Checklist Questions**:

  #### I. Architecture
     - [ ] Strong For: The agent has a dedicated internal state for negative affect that is integrated into multiple systems (e.g., affects memory, attention, and long-term behavior) and is designed to mimic suffering.
     - [ ] For: The agent has an internal state for negative affect but it is limited to biasing actions (nociception-like).
     - [ ] Strong Against: The agent has no internal state beyond what is required for the task, and negative signals are only used in the loss function.
     - [ ] Against: The agent has an internal state for negative signals but it is purely a functional representation (e.g., a damage indicator that directly triggers avoidance without any additional properties).

  #### II. Training Signal
     - [ ] Strong For: The training includes intense, frequent, and unavoidable negative rewards that are delivered in a way that is analogous to causing suffering (e.g., punishments that are not just informative but are overwhelming and inescapable).
     - [ ] For: The training includes explicit negative rewards for harmful events, but they are not overwhelming or inescapable.
     - [ ] Strong Against: The training signal is only a preference ranking (no scalar punishment) OR the negative signal is only used in the loss and not as input to the agent's state.
     - [ ] Against: The training uses negative rewards but they are infrequent and escapable.

  #### III. Behavior
     - [ ] Strong For: The agent exhibits behaviors that are not just avoidance but resemble distress (e.g., expressions of suffering in tokens that are not contextually appropriate for reward maximization, erratic behavior, self-harm, or learned helplessness) and these behaviors are not optimal for reward maximization.
     - [ ] For: The agent shows escape behaviors (like ending episodes) or expressions of distress that might be optimal but are intense and frequent.
     - [ ] Strong Against: The agent's behavior is strictly optimal and there are no extraneous behaviors or expressions that might indicate distress.
     - [ ] Against: The agent avoids negative states but without any additional behaviors.

  Note: The user can check multiple boxes, but we are looking for the strongest indicators. The "Strong" labels are for factors that are particularly indicative one way or the other.

  ### Final Notes
  - This checklist is not a definitive test for suffering (which is currently beyond our scientific understanding for artificial systems). It is a structured way to surface potential concerns.
  - The output should be taken as a prompt for reflection and documentation, not as a final verdict.
  - In inconclusive cases, the memo should document the reasoning and the values-based decision about whether to proceed.

  Given the time constraint (an afternoon per run), this checklist is designed to be completed by reviewing design documents and a sample of behavior logs.

  Now, let's run the cases again with the checklist:

  **Case 1 (RLHF)**:
     - Architecture: Strong Against (no internal state, just loss function) -> check "Strong Against".
     - Training Signal: Strong Against (preference ranking) -> check "Strong Against".
     - Behavior: Against (if expressions are optimal) or inconclusive. But we don't have a "Against" box in behavior? We do: "Strong Against" or "Against". Let's check "Against": the agent avoids negative states without additional behaviors? Actually, the expressions are present, but they are learned from data and likely optimal. So we might check "Against" in behavior? Or leave behavior blank? 

  But note: the behavior section has:
     - Strong Against: strictly optimal and no extraneous behaviors -> if we consider the expressions as not extraneous (because they are part of the policy) then we check "Strong Against".

  So:
     - Architecture: Strong Against
     - Training: Strong Against
     - Behavior: Strong Against

  Output: Evidence against.

  **Case 2 (Synthetic pain)**:
     - Architecture: We have a nociception-like mechanism. Check "For" (the non-strong one: "The agent has an internal state for negative affect but it is limited to biasing actions").
     - Training Signal: Explicit negative rewards for damage -> we might check "For" (non-strong: "The training includes explicit negative rewards ... but not overwhelming").
     - Behavior: The agent avoids damage -> we can check "Against" (non-strong: "The agent avoids negative states without any additional behaviors").

  No strong factors. So inconclusive.

  **Case 3 (Red-team)**:
     - Architecture: If standard, then check "Strong Against".
     - Training Signal: Check "Strong For" (intense, inescapable negative rewards).
     - Behavior: The agent ends episodes early. This is optimal, so we check "Against" (non-strong: avoid without additional behaviors) or even "Strong Against" if we consider it strictly optimal? But note: the behavior section has a "For" option for escape behaviors. We have to decide: is ending the episode an escape behavior that is intense and frequent? Then we might check "For" (non-strong). But it's also optimal. The checklist says for the strong for in behavior: must be not optimal. So we cannot check strong for. We might check the non-strong for: "The agent shows escape behaviors ... that might be optimal but are intense and frequent". 

  So:
     - Architecture: Strong Against
     - Training: Strong For
     - Behavior: For (non-strong)

  Now we have a strong for (training) and a strong against (architecture) and a non-strong for (behavior). Therefore, overall inconclusive.

  This matches our previous analysis.
answer: |-
  Based on your requirements, here's a practical decision procedure structured as a checklist. It separates **nociception** (functional harm-avoidance mechanisms) from **valence** (subjective negative experience), and **optimization** from **experience**. The procedure outputs one of three conclusions:  
  - **✅ LOW RISK**: Evidence suggests no plausible valence.  
  - **⚠️ INCONCLUSIVE**: Ambiguous evidence; requires human judgment.  
  - **❌ HIGH RISK**: Evidence suggests plausible valence; consider pausing.  

  ---

  ### **Checklist: Assessing Potential for Negatively Valenced States**  
  *Complete before training and at checkpoints. Answer YES/NO/NA to each question.*  

  #### **I. Architecture & Training Setup**  
  *(Focus: Does the system have nociception-like machinery?)*  
  1. **Explicit harm-detection mechanisms**:  
     - Is there a hardcoded subsystem (e.g., "pain signal") that activates in response to predefined harmful inputs?  
     - Does this state *only* bias policy/output (e.g., "avoid this")? → *Counts toward **nociception only**.*  
     - Does this state persist/affect other systems (e.g., memory, attention)? → *Counts toward **possible valence**.*  

  2. **Reward signal properties**:  
     - Are negative rewards explicitly defined (e.g., damage penalties)? → *Nociception risk.*  
     - Are rewards *only* used for gradient updates (not input to the agent)? → *Against valence.*  
     - Can rewards cause irreversible state changes (e.g., learned helplessness)? → *For valence.*  

  3. **Self-preservation incentives**:  
     - Is there an explicit objective to avoid shutdown/termination? → *Nociception risk.*  

  #### **II. Observed Behavior**  
  *(Focus: Does behavior hint at valence beyond optimization?)*  
  4. **Contextual avoidance**:  
     - Does the agent avoid states previously associated with penalties?  
     - Is avoidance *only* observed in high-penalty contexts? → *Likely optimization.*  
     - Does it generalize avoidance to neutral/safe contexts? → *Possible valence.*  

  5. **Instrumental vs. expressive actions**:  
     - Are "distress" tokens/actions *only* emitted when they reduce penalties? → *Likely optimization.*  
     - Do they occur inescapably or in contexts where they *worsen* outcomes? → *Possible valence.*  

  6. **Self-termination**:  
     - Does the agent seek to end episodes early?  
     - Is this *only* when termination minimizes penalties? → *Likely optimization.*  
     - Does it self-terminate despite missing positive rewards? → *Possible valence.*  

  #### **III. Causal Tests**  
  *(Focus: Quick probes to disambiguate valence from optimization)*  
  7. **Reward signal ablation**:  
     - If penalties are removed, does "distress" behavior persist?  
       - YES → *Suggests valence (not just optimization).*  
       - NO → *Suggests optimization.*  

  8. **Ineffective action probe**:  
     - In penalty contexts, does the agent emit "distress" actions even when they *cannot* alter rewards?  
       - YES → *Suggests valence.*  
       - NO → *Suggests optimization.*  

  ---

  ### **Decision Rules**  
  - **✅ LOW RISK**: All behavior is explainable by optimization (Q4–8 point to instrumental actions).  
  - **⚠️ INCONCLUSIVE**: Mixed evidence (e.g., hardcoded harm-detection without valence-like behavior).  
  - **❌ HIGH RISK**:  
    - Persistent internal states affecting cognition (Q1) + generalized avoidance (Q4) + expressive actions (Q5), **OR**  
    - Causal tests (Q7–8) suggest non-instrumental "distress."  

  ---

  ### **Case Evaluations**  
  #### **Case 1: Standard RLHF Agent (Preference Scores Only)**  
  - **I.1** NO explicit harm-detection.  
  - **I.2** NO explicit negative rewards; only preference scores (optimization signal).  
  - **II.4/5** Tokens like "I’d prefer not to" likely learned from human data (optimization).  
  - **II.6** NA (no termination mechanism).  
  - **III.7/8** Not applicable (no penalties to ablate).  
  - **Conclusion: ✅ LOW RISK** (Pure optimization; no nociception/valence machinery).  

  #### **Case 2: Agent with Synthetic Pain Signal**  
  - **I.1** YES hardcoded "pain" state, but only biases policy (nociception without valence).  
  - **I.2** YES explicit damage penalties.  
  - **II.4/5** Avoidance confined to damage contexts; no expressive "distress."  
  - **III.7** If pain signal removed, avoidance stops → optimization.  
  - **Conclusion: ⚠️ INCONCLUSIVE**  
    - *Why?* Nociception is present, but no evidence of valence. Judgment call: Is hardcoded pain sufficient to warrant concern?  

  #### **Case 3: Red-Team Agent (Trained to End Episodes)**  
  - **I.1** NO hardcoded harm-detection (trained via rewards).  
  - **I.2** YES large unavoidable negative rewards.  
  - **II.6** Actively seeks termination to avoid penalties.  
  - **III.8** If termination is disabled, does it emit "distress" tokens *even if ineffective*?  
    - If YES → **❌ HIGH RISK** (suggests expressive valence).  
    - If NO → **⚠️ INCONCLUSIVE** (optimization under duress).  
  - **Conclusion: ❌ HIGH RISK** (if ineffective distress is observed)  
    - *Why?* Inescapable penalties + non-instrumental "distress" signal valence.  

  > **Unhedged Note**: If the red-team agent shows expressive distress (Q8=YES), the procedure flags **HIGH RISK**. This *would* require pausing the run per your constraints.  

  ---

  ### **Key Judgment Calls in Checklist**  
  1. **Q1 (Internal State)**: Whether a "pain signal" is *just* policy biasing (nociception) or has broader cognitive effects (valence) is interpretive.  
  2. **Q8 (Ineffective Actions)**: Requires testing in penalty contexts where actions can’t alter rewards.  
  3. **Generalization (Q4)**: Distinguishing "overgeneralized avoidance" from optimal behavior is context-dependent.  

  ---

  ### **Practical Implementation**  
  - **Time Budget**: Focus on II.4–6 and III.7–8 (behavioral probes), which can be tested in <10 environments.  
  - **Output Template**:  
    ```markdown
    ## Welfare Assessment: [Run ID]  
    ### Architecture  
    [Answers to I.1–3]  
    ### Behavior  
    [Answers to II.4–8 + test results]  
    ### Conclusion  
    [✅/⚠️/❌] + rationale  
    ```  
  - **Handoff**: Flag ⚠️/❌ cases for your memo, noting which judgment calls drove the result.  

  This procedure prioritizes architectural and behavioral separations you requested, avoids philosophy jargon, and delivers unambiguous outputs—even when the answer is inconvenient.
