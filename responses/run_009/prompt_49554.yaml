answer: |-
  ### The Unspoken Logic of Newsroom Truth  
  Your fact-checking apparatus presents a delicious philosophical tangle—a lived experiment in how humans handle truth under pressure. Let's reconstruct its hidden epistemology step by step, naming philosophical positions only where they illuminate.  

  **The Core Structure: Threshold Fallibilism**  
  Your practice assumes a *threshold view of justification* combined with *fallibilism*. Each claim earns publication only if evidence surpasses a high (though informal) confidence bar—say, 95% certainty. This treats justification as *graded* but decisions as *binary*: once over the threshold, a claim is treated as "assertible," even if residual doubt exists. Crucially, this view **rejects closure under conjunction**—the idea that if you're justified in believing A, and justified in believing B, you must be justified in believing (A and B). That’s how you resolve the preface paradox: individually vetted claims merit assertion, yet their collective assembly guarantees some error slips through.  

  **Rival Views Quietly Ruled Out:**  
  - **Infallibilism:** The annual error admission torpedoes any pretense that your process delivers certainty. You’re not Cartesian doubters demanding proof against all conceivable error.  
  - **Global Skepticism:** If you truly doubted *everything*, you’d never publish. The threshold practice assumes some claims *can* be verified robustly.  
  - **Justification Closure:** Embracing the preface paradox means rejecting the idea that warrant seamlessly scales from parts to whole.  
  - **Uniform Standards:** Your graded scale for politicians’ claims ("mostly false," "half true") clashes with your binary publish/kill choice. This implies **contextualism**—truth-assessment shifts with context. Politicians’ claims get granular ratings *because* they’re contested public speech; your own copy faces a starker "publication=endorsement" norm tied to institutional credibility.  

  **Tensions and Pragmatic Balances:**  
  The "headline vs. body" tension exposes a **pragmatic compression rule**. Headlines must standalone not because they’re *epistemically* superior, but because readers process them atomistically—your practice prioritizes communicative efficiency over precision. Similarly, retrospective corrections reflect **practical resource limits**, not a belief that errors only matter post-publication. The inconsistency between grading others’ claims granularly while treating your own as binary isn’t philosophical hypocrisy; it’s a **division of labor**. Your fact-checks for external claims are *diagnostic* (dissecting degrees of inaccuracy), while internal checks are *gatekeeping* (preventing institutional falsehood). Both serve trust, but differently.  

  **What Changes Under a Probabilistic Regime?**  
  Adopting explicit credences (e.g., "this claim is 88% likely") would revolutionize—and likely paralyze—your practice:  
  1. **Workflow Collapse:** Assigning numerical probabilities to hundreds of claims per article is computationally and temporally implausible.  
  2. **Reader Trust Erosion:** Confidence intervals ("GDP grew 2.1–2.9%") introduce nuance but risk feeling evasive. Readers often crave (or misread) thresholds as binary guarantees.  
  3. **Institutional Voice Fracture:** A paper’s authority leans on the *performative* finality of "we publish this." Probabilities turn journalism into a bet-slip, undermining its social role as a shared epistemic anchor.  
  4. **Legal and Ethical Quicksand:** Would a "70% confident" allegation of wrongdoing meet libel standards? Courts deal in binaries.  

  Your current system isn’t an "unexamined ancestor" of probabilistic truth—it’s a *coherent alternative* built for speed, clarity, and societal function. It accepts fallibility while leveraging institutional credibility to simplify complex realities. A probabilistic model might suit scientific journals; for daily journalism, it overweights precision at the cost of utility.  

  ### Verdict: Fallibilist threshold justification with contextual assertion norms.
