answer: |-
  Here is a one-page decision procedure grounded in operationalizable philosophical distinctions, designed for committee efficiency:

  **Invertebrate Sentience & Welfare Assessment Procedure (ISP)**

  **Core Principle:** Prioritize preventing potential suffering based on *behavioral markers of aversive experience* where supported by plausible neuroanatomy. Sentience is treated as a **graded capacity** (supported by theories like IIT, biological naturalism). Protections scale proportionately to the *strength of evidence for negative subjective experience*.

  **Decision Flow (Per Species/Protocol):**

  1.  **Nociception Present? (Baseline):**
      *   *Question:* Does the species possess specialized sensory neurons responsive to potentially tissue-damaging stimuli (noxious heat, cold, chemicals, pressure)? *Evidence:* Peer-reviewed physiology papers. *Stopping Point:* If **No** --> *No special welfare protections required.* (e.g., jellyfish lacking nociceptors).
      *   *If Yes:* Proceed. Nociception alone ≠ sentience/pain.

  2.  **Behavioral Evidence for Motivational State? (Key Sentinel):**
      *   *Questions:*
          *   a) **Trade-offs:** Does the animal sacrifice a significant reward (food, mating) or incur cost (effort, risk) to *avoid or escape* noxious stimuli *beyond immediate reflex*? (e.g., learning to avoid shock zone despite food presence).
          *   b) **Protective Actions:** Does it exhibit prolonged, flexible guarding, grooming, or shelter-seeking *specific* to an injured/noxiously stimulated body part?
          *   c) **Self-Medication/Analgesia:** Does it *self-administer* analgesics or anesthetics when injured/stressed? (e.g., bees consuming ethanol after mite attack).
      *   *Evidence:* Ethology studies, protocol-specific observations. *Sufficient Answer:* ≥1 clear "Yes" from a-c, documented in controlled settings. *Stopping Point:* If **All No** --> *Minimal protections* (Standard humane euthanasia, avoid obvious tissue damage where possible). *Judgment Call:* Assessing "significance" of trade-offs.

  3.  **Neuroanatomical Plausibility? (Consistency Check):**
      *   *Question:* Does the species possess neural structures capable of integrating nociceptive input with other sensory/motor/internal state signals for *centralized, modifiable processing*? Look for: Brain regions with recurrent connectivity (feedback loops), descending modulation pathways, structures analogous to vertebrate midbrain/pallium. *Evidence:* Neuroanatomy papers (gross & circuit level). *Sufficient Answer:* Plausible evidence of integration structures (not just ganglia).
      *   *Conflict Resolution:*
          *   *Strong Behavior (Step 2) + Plausible Neuro (Step 3):* --> **Strong Evidence for Sentience.** Apply significant welfare protections.
          *   *Strong Behavior (Step 2) + Weak/Ambiguous Neuro (Step 3):* --> **Moderate Evidence.** Prioritize behavioral evidence. Apply welfare protections. Neuro weakness noted.
          *   *Weak Behavior (Step 2) + Strong Neuro (Step 3):* --> **Weak Evidence.** Default to *Minimal Protections*. Neuro plausibility alone is insufficient without behavioral manifestation of suffering. *Judgment Call:* Weighting conflicting evidence leans heavily on behavior; neuro is a guardrail, not the driver.

  4.  **Protocol-Specific Risk Assessment (Proportionate Protections):**
      *   *Question:* What level of potential noxious stimulation/distress does *this specific protocol* involve? (Duration, intensity, invasiveness, alternatives).
      *   *Action:*
          *   **Strong Evidence:** Full vertebrate-equivalent considerations: Analgesia/anesthesia for known painful procedures, environmental enrichment, humane endpoints, minimization of distress/pain. Requires veterinary consultation.
          *   **Moderate Evidence:** Significant mitigations: Careful monitoring for distress behaviors, minimization of duration/intensity of noxious stimuli, prompt euthanasia if distress observed, consideration of environmental complexity. Vet review recommended.
          *   **Minimal Protections:** Standard sanitary housing, humane euthanasia.
      *   *Values Call:* The Attending Veterinarian has **final authority** on defining adequate analgesia/humane endpoints based on the evidence level and protocol risks.

  **Applied to Cases:**

  1.  **Octopus Learning Study (Physiology):**
      *   *Step 1:* Yes (Complex nociceptors).
      *   *Step 2:* Yes (Clear trade-offs - e.g., avoid shock zones for food; complex grooming/injury guarding; evidence for self-protection).
      *   *Step 3:* Yes (Highly centralized brain, vertical lobe integration, recurrent circuitry).
      *   *Evidence Level:* **Strong.**
      *   *Protocol Risk:* Moderate (Restraint, mild shocks?). *Protections:* **Full vertebrate-equivalent.** Analgesia if invasive, enrichment, vet oversight.

  2.  **Bumblebee Foraging Experiment (Ecology):**
      *   *Step 1:* Yes (Nociceptors documented).
      *   *Step 2:* Yes (Trade-offs - e.g., avoid heated feeders despite reward; protective grooming responses; self-administration of analgesic substances documented in honeybees, plausibly extends to bumblebees).
      *   *Step 3:* Weak/Ambiguous (Central brain (mushroom bodies) capable of integration/recurrent processing, but tiny, no direct vertebrate analog. Descending modulation less clear).
      *   *Conflict Resolution:* Strong Behavior + Ambiguous Neuro --> **Moderate Evidence.**
      *   *Protocol Risk:* Low-Moderate (Possible heat stress, leg tagging?). *Protections:* **Significant Mitigations.** Careful monitoring for stress (agitation, refusal to forage), minimize exposure to extreme heat, rapid euthanasia if distressed, consider simple enrichment (visual complexity). Vet consultation advisable for tagging methods.

  3.  **High-Throughput Nematode Screen (Molecular Bio):**
      *   *Step 1:* Yes (Nociceptors for chemicals/heat).
      *   *Step 2:* **No.** Reflexive withdrawal, but *no* documented evidence of motivational trade-offs, protective grooming of injuries, or self-medication. Responses lack flexibility/learning indicative of internal state.
      *   *Stopping Point:* Step 2 (All No) --> *Minimal Protections.*
      *   *Protocol Risk:* Variable (Chemical exposure, mechanical stress). *Protections:* **Minimal.** Standard lab hygiene, humane (rapid) killing methods appropriate for species. No analgesia/enrichment required. *(This is the "stingy with worms" outcome)*.

  **Explicit Limitations & Judgment Calls:**

  1.  **Judgment Calls Dressed as Procedure:**
      *   Defining "significant" trade-off/cost in Step 2a.
      *   Interpreting "flexible, prolonged" protective behavior in Step 2b.
      *   Weighting strength of behavioral vs. neuro evidence during conflict (Step 3 Conflict Resolution) – heavily favors behavior based on principle.
      *   Defining "plausible" integration structures in Step 3.
      *   Assessing "level" of protocol risk in Step 4.

  2.  **What the Procedure Cannot Do:**
      *   Resolve fundamental philosophical disputes about consciousness (e.g., Higher-Order Thought vs. GWT). It operationalizes a precautionary, biologically-based approach.
      *   Prove the *absence* of sentience. It identifies insufficient *evidence to warrant concern* for suffering under the precautionary principle.
      *   Define the precise "amount" of suffering or moral weight. It triggers *proportionate* protections based on evidence strength.
      *   Replace veterinary expertise on pain mitigation (final arbiter in Step 4).
      *   Account for exceptional individual variation within a species.

  **Grounding:** This procedure prioritizes behavioral markers of motivational state (trade-offs, protection, self-medication) as the most direct operational proxies for potential suffering, aligning with neuroethology and the "life-mind continuity" view in philosophy of biology. Graded sentience and proportionate protection are supported by Integrated Information Theory (IIT - gradation) and the precautionary principle inherent in animal welfare ethics. The emphasis on behavior over neuroanatomy alone counters outright skepticism and avoids requiring inaccessible neural correlates. The veterinarian's final role reflects the value judgment inherent in applying "humane" care.
