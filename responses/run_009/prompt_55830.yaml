prompt: |-
  i keep seeing takes on linguistic relativity that talk past each other completely — one article says russian speakers literally perceive blue differently because they have two basic words for it, another says the whole thing was debunked decades ago and everyone thinks in the same universal mentalese. before I try to work out who's right I want the spec. write me the desiderata: what any adequate theory (or even a single defensible claim) of language influencing thought has to deliver, with the case or consideration behind each requirement.

  some things I want covered, but feel free to add more:

  - what counts as "thought" here. perception itself? performance on a timed task? what's easy to notice vs what's possible to think at all? a theory that helps itself to whichever notion is convenient for the latest result isn't really saying anything. should picking one notion of cognition and sticking to it be a hard requirement, or is a theory allowed to claim effects on several levels?
  - the circularity worry: if the main way we get at people's thoughts is through language (their descriptions, their answers to questions in one language or another), how do you measure the thing supposedly being influenced without leaning on the thing doing the influencing? bilinguals seem like the obvious test case — should a theory that predicts nothing about bilinguals count as inadequate?
  - separating language from culture. natural populations co-vary everything — grammar, ecology, subsistence, schooling. does an adequate theory need comparisons that hold culture fixed while varying language, or is a theory of "language-culture packages" good enough? be honest if the second option is quietly giving up on the interesting claim.
  - the capability vs habit distinction: "speakers of language X cannot think about Y" versus "speakers of language X habitually attend to Y because their grammar forces the choice every time they open their mouth." which of these is the theory about, and is it a problem that one of them looks trivially true and the other probably false?
  - consistency with universals-type results, like the finding that basic color term inventories across languages follow a surprisingly constrained ordering. does an adequate relativity theory have to say something about why some domains look so structured, or can it just scope itself to other domains?
  - effect sizes and priming: if an effect only shows up in a timed discrimination task right after verbal interference, does the theory owe us a story about real-world consequence, or is lab-detectable influence enough for the claim to be interesting?

  for each requirement say whether it's non-negotiable or just what one camp wants, and flag any subset that looks jointly unsatisfiable — my suspicion is "must rely on natural cross-linguistic variation" and "must isolate language from culture" can't both be fully met by anyone without a time machine, but tell me if that's right or if I'm missing a design.

  then, briefly, score three positions against the list: the strong whorfian line, the pinker-style universalist dismissal, and the middle "thinking for speaking" view where language mainly shapes what we attend to while actually talking. keep the scoring short — the criteria are what I actually care about.
reasoning: |-
  Okay, the user is asking for a set of criteria (desiderata) that any theory about linguistic relativity must meet, along with how different positions stack up against these criteria. They’ve provided specific concerns like defining "thought," avoiding circularity, separating language from culture, distinguishing capability vs. habit, consistency with universals, and evaluating effect sizes. 

  First, I need to unpack each of their bullet points. For "what counts as thought," the user is frustrated with theories that cherry-pick definitions (e.g., perception vs. timed tasks) to fit results. They want clarity: should a theory commit to one level of cognition or can it span multiple? I think this is non-negotiable—any serious theory must explicitly define its scope and stick to it, or risk being unfalsifiable. 

  The circularity worry is thorny. If we rely on language to measure thought, how do we avoid bias? Bilinguals seem key here—if a theory can’t handle bilingual cognition (e.g., showing effects switch with language context), it’s probably inadequate. This feels non-negotiable too; without addressing it, claims collapse into methodological artifacts. 

  Separating language from culture is a big hurdle. The user suspects it’s impossible without a time machine, and they’re right. Natural experiments (e.g., same-culture, different-language groups) are rare. A theory might need to concede that language-culture packages are the unit of analysis, but that waters down the "language as cause" claim. I’d call this negotiable but with a caveat: ignoring it weakens the theory. 

  Capability vs. habit is a classic rift. The user notes one is trivially true (habit), the other probably false (capability). A good theory must specify which it targets and defend why it matters. Universalists like Pinker attack the straw man of "can’t think Y," but most modern research is about habit. Non-negotiable to clarify this. 

  Universals (e.g., color term hierarchies) seem to constrain relativity. A theory shouldn’t ignore these—it must explain why some domains are rigid and others flexible. Negotiable, but a strong theory would engage with it. 

  Effect sizes matter. If an effect only appears in labs under priming, does it matter in the wild? The user wants to know if small-scale influence is enough. Here, I think negotiable: lab effects can be meaningful probes, but the theory should acknowledge limits. 

  Now, the user’s suspicion about "natural variation" vs. "isolating language" being incompatible is spot-on. You can’t fully decouple them in the wild. Workarounds (bilinguals, sign languages, controlled lab studies) help but aren’t perfect. 

  For scoring: 
  - Strong Whorfianism fails most criteria—vague on "thought," ignores circularity, conflates language/culture, overclaims capability, clashes with universals, and overstates lab effects. 
  - Universalist dismissal (Pinker) is clean but reductive; it sidesteps habit-level effects and bilingual data, leaning hard on universals. 
  - "Thinking for Speaking" (Slobin) does best: defines thought as online attention, uses bilinguals well, admits language-culture entanglement, focuses on habit, fits with universals, and owns modest effect sizes. 

  The user seems analytically sharp—they’ve identified core tensions in the field. Their frustration with talking-past is valid; the desiderata help cut through noise. They might be seeking not just criteria but a way to evaluate claims without getting bogged down in tribal debates. I’ll keep the response structured but punchy, matching their no-nonsense tone.
answer: |-
  Here’s a rigorous set of desiderata for evaluating claims about language influencing thought, based on your specified concerns and core challenges in the field. Each includes the case/consideration and its negotiability status.

  ---

  ### **Desiderata for an Adequate Theory of Linguistic Relativity**
  1. **Explicit Operationalization of "Thought"**  
     - **Requirement**: Must define *which cognitive processes* are claimed to be influenced (e.g., perception, memory, attention, conceptualization, reasoning speed) and stick to that level.  
     - **Case**: Color perception (Winawer et al. 2007: Russian speakers' faster *categorical perception* of light/dark blue) vs. universalist critiques (universal color foci, Regier & Kay 2009).  
     - **Non-negotiable**: A theory cannot opportunistically shift between "basic perception" and "habitual attention" without falsifiability.  

  2. **Avoidance of Circularity**  
     - **Requirement**: Must demonstrate influence *independent of language use during testing*. Bilingual paradigms are essential.  
     - **Case**: Boroditsky’s time experiments (Mandarin speakers think vertically about time; but see January & Kako 2007). If bilinguals show fluid cognitive shifts (e.g., time perception changes with language context), it supports relativity.  
     - **Non-negotiable**: Theories failing to address bilingual cognition or relying solely on monolingual verbal reports are methodologically suspect.  

  3. **Separation of Language from Culture**  
     - **Requirement**: Must isolate *language-specific structures* (grammar, lexicon) from cultural/ecological factors.  
     - **Case**: Pirahã number terms (Everett) vs. cultural materialism (Frank et al. 2008: performance improves with incentivized tasks).  
     - **Negotiable but critical**: Natural experiments (e.g., same-culture, different-language groups; sign languages) are rare but ideal. "Language-culture packages" weaken causal claims but may be pragmatically necessary. *Your suspicion is correct: perfect isolation is near-impossible without historical data or randomized assignment (unethical).*  

  4. **Capability vs. Habit Distinction**  
     - **Requirement**: Must specify whether the claim is about *capacity* ("cannot think Y") or *processing habits* ("habitually attend to Y").  
     - **Case**: Grammatical gender influencing object perception (Boroditsky) is about habitual attention, not incapacity.  
     - **Non-negotiable**: Strong "determinism" (incapacity) is indefensible. Theories must clarify if effects are about efficiency, default attention, or conceptual availability.  

  5. **Consistency with Cognitive Universals**  
     - **Requirement**: Must explain why some domains (e.g., color, space) show strong universal patterns alongside relativistic effects.  
     - **Case**: Berlin & Kay’s color universals vs. language-specific categorical perception.  
     - **Negotiable**: A theory can focus on relativistic domains (e.g., time, agency) but must not contradict robust universals without evidence.  

  6. **Real-World Relevance of Effects**  
     - **Requirement**: Must articulate the *ecological validity* of lab effects (e.g., do timed discrimination tasks predict behavior in natural contexts?).  
     - **Case**: "Verbal interference" paradigms (e.g., Lupyan 2012) show language scaffolds cognition transiently, but is this meaningful?  
     - **Negotiable**: Lab effects can be mechanistically informative, but theories claiming broad cognitive consequences must address scalability.  

  ---

  ### **Joint Unsatisfiability Alert**  
  - **"Natural Variation" + "Isolate Language from Culture"**: As you note, these conflict. Solutions:  
    - Use *bilinguals* (language switch within same individual/culture).  
    - Study *language change* (e.g., loss of tenses affecting cognition).  
    - *Signed languages* (shared culture, divergent grammar).  
  - Without these, *causal claims remain correlational*.  

  ---

  ### **Scoring Key Positions**  
  | **Criterion**               | **Strong Whorfianism** (e.g., early Sapir-Whorf) | **Universalist Dismissal** (e.g., Pinker) | **"Thinking for Speaking"** (e.g., Slobin) |  
  |----------------------------|------------------------------------------------|------------------------------------------|------------------------------------------|  
  | **Operationalizes "Thought"** | Fails (shifts levels)                          | Passes (explicit: "mentalese")           | **Passes** (online attention during speech) |  
  | **Avoids Circularity**      | Fails (relies on language tasks)               | Passes (dismisses linguistic measures)   | **Passes** (uses bilingual production)    |  
  | **Separates Lang/Culture**  | Fails (often conflates)                        | Passes (ignores culture)                 | Partial (admits entanglement)             |  
  | **Capability vs. Habit**    | Fails (implies incapacity)                     | Passes (rejects incapacity)              | **Passes** (explicitly habitual)         |  
  | **Consistent w/ Universals**| Fails (ignores constraints)                    | **Passes** (prioritizes universals)      | **Passes** (compatible)                  |  
  | **Real-World Relevance**    | Overclaims (lab = deep thought)                | Underclaims (dismisses lab effects)      | **Passes** (modest: speech-adjacent)     |  

  **Verdict**:  
  - **Strong Whorfianism**: Inadequate. Fails most desiderata.  
  - **Universalist Dismissal**: Overly simplistic. Ignores bilingual data and habit-level effects.  
  - **"Thinking for Speaking"**: Most defensible. Meets core criteria with confined claims.  

  ---

  ### **Conclusion**  
  Adequate theories must:  
  1. Explicitly target *habitual attention* (not capability),  
  2. Use *bilingual designs* to break circularity,  
  3. Acknowledge *language-culture entanglement* but seek natural experiments,  
  4. Align lab effects with *plausible real-world consequences*.  
  **The strongest current claims** (e.g., Slobin, Boroditsky) focus on how language guides *what we spontaneously attend to* during cognitive tasks—not what we *can* think. This survives scrutiny under the above criteria.
