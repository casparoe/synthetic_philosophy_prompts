prompt: |-
  Before I take a side in the outcome-supervision vs process-supervision argument (grade the final result, or grade the steps/behavior that produced it?), I want the spec any answer has to meet. Write the desiderata a principle for choosing between the two, for a given task, has to satisfy. Which cases it must get right: verifiable outcomes like math proofs where the end state can be checked mechanically; fuzzy outcomes like "was this response actually helpful"; processes that look good but are bad (checklist-following, reasoning chains that read well but go nowhere); and Goodhart/reward-hacking cases where a proxy for the outcome gets gamed. Which distinctions it cant collapse: grading a trajectory vs grading a result; what the supervisor can verify vs what actually caused the result; teaching the system something vs merely testing it. Mark which requirements are non-negotiable and which are just preferences of the outcome-first camp or the process-first camp, and flag any pair you suspect is jointly unsatisfiable -- I have a feeling "never supervise on a signal less aligned than the thing you actually care about" and "never reward a process just because it looks good to us" pull against each other, but tell me if im wrong. Keep the weight on the criteria and the cases behind them; no scorecard, I'll do that myself.
reasoning: |-
  Okay, let me tackle this user request systematically. The user wants desiderata for choosing between outcome-supervision and process-supervision in AI training, with specific cases and distinctions to consider. 

  First, I need to identify core requirements from the user's examples: verifiable outcomes (like math proofs), fuzzy outcomes (like helpfulness), deceptive processes (checklist-following), and reward-hacking risks. The user also emphasizes key distinctions: trajectory vs result, verifiability vs causality, and teaching vs testing.

  Hmm, the trickiest part is resolving the tension between two principles: avoiding less-aligned signals versus not rewarding superficially good processes. I recall this connects to Goodhart's Law - optimizing proxies often backfires. For fuzzy outcomes, we might have to use process-supervision despite alignment concerns, but only if human judgment correlates with true goals.

  The user seems sophisticated - they mention "jointly unsatisfiable" requirements, so I should explicitly flag that tension. They're likely building an evaluation framework, probably for ML safety research. Their examples suggest frustration with current supervision limitations.

  For structure, I'll categorize requirements as non-negotiable (truth-tracking, anti-Goodhart) versus contingent (like outcome-preference in verifiable cases). The deceptive processes case needs special handling - it shows why process-supervision can fail even when "looking good."

  When listing desiderata, I'll anchor each to concrete cases. Like: "Must handle reward-hacking" stems from the Goodhart example. For distinctions, I'll emphasize that verifiability doesn't equal causality - a math proof can be verified without understanding why steps worked.

  Finally, I'll explicitly call out the tension between alignment and anti-superficiality requirements, noting they're only incompatible when no verifiable signal exists. That nuance matters - in math, we can satisfy both via outcome-supervision.
answer: |-
  Here are the desiderata for a principle choosing between outcome-supervision (OS) and process-supervision (PS), derived from your requirements and cases. Non-negotiables are marked **(NN)**, outcome-first camp preferences as **(O-Pref)**, process-first camp preferences as **(P-Pref)**, and tensions are flagged.

  ---

  ### **Core Desiderata (Must Handle These Cases Correctly)**
  1.  **Verifiable Outcome Robustness (NN):**  
      *For cases like math proofs where the outcome is mechanically verifiable.*  
      The principle must correctly favor OS (grade the proof) when the outcome is a perfect proxy for correctness. PS adds no value and risks penalizing valid but non-standard steps.

  2.  **Fuzzy Outcome Handling (NN):**  
      *For cases like "was this response helpful?" where the outcome is subjective or hard to measure.*  
      The principle must acknowledge OS is infeasible or misaligned (e.g., human ratings can be noisy or gameable). PS may be necessary if the process correlates reliably with the desired outcome.

  3.  **Deceptive Process Rejection (NN):**  
      *For processes that "look good" but are bad (e.g., elegant but flawed reasoning, rote checklist-following).*  
      The principle must avoid rewarding PS *solely* based on superficial adherence to expected behaviors. It must detect processes decoupled from outcomes.

  4.  **Anti-Goodhart Resilience (NN):**  
      *When proxies are gameable (e.g., maximizing "helpfulness" scores via verbosity).*  
      The principle must prioritize signals least susceptible to hacking. If OS uses a proxy (e.g., a rubric score), it must be robust. PS must not reward processes that hack OS proxies without true alignment.

  ---

  ### **Critical Distinctions (Must Not Collapse These)**
  5.  **Trajectory vs. Result (NN):**  
      Explicitly distinguish whether the supervisor evaluates the *path* (PS) or the *end state* (OS). The principle must not conflate them.

  6.  **Verifiability vs. Causality (NN):**  
      Distinguish what the supervisor *can observe/verify* (e.g., "steps look logical") from what *actually caused the result* (e.g., luck vs. skill). The principle must acknowledge gaps in supervision.

  7.  **Teaching vs. Testing (NN):**  
      Separate whether supervision is for *training* (providing learning signals) or *evaluation* (measuring performance). PS may be better for teaching, OS for testing.

  ---

  ### **Alignment & Preference Constraints**
  8.  **Never Supervise on Less-Aligned Signals (O-Pref, but NN-adjacent):**  
      *"Never supervise on a signal less aligned than the thing you actually care about."*  
      If OS (e.g., a correctness label) is more aligned than PS (e.g., "standard steps"), prefer OS. Violating this risks alignment failures.

  9.  **Never Reward Superficial Processes (P-Pref, but NN-adjacent):**  
      *"Never reward a process just because it looks good to us."*  
      PS must be tied to processes *causally linked* to good outcomes (e.g., valid reasoning heuristics). Pure aesthetics are invalid.

  10. **Feasibility of Supervision (Pragmatic NN):**  
      The principle must account for what is *practically verifiable* by the supervisor. PS is irrelevant if steps are unobservable (e.g., black-box models).

  ---

  ### **Tensions & Joint Unsatisfiability**
  - **Key Tension:** Desiderata **8 (Never Less-Aligned Signals)** and **9 (Never Superficial Processes)** **conflict in fuzzy-outcome cases**.  
    - *Why?* In fuzzy domains (e.g., "helpfulness"), OS proxies (e.g., user ratings) are often *less aligned* with true goals (due to bias/noise/gaming) than a *well-designed PS* (e.g., "did it clarify assumptions?"). Yet PS risks rewarding superficially "good" processes (violating #9) if not carefully scoped.  
    - *Resolution?* Only satisfiable if PS focuses on **causally relevant subskills** (e.g., "identifying user's core question") proven to drive true outcomes. This requires deep task understanding.

  - **Other Tensions:**  
    - **Anti-Goodhart (#4)** vs. **Feasibility (#10)**: Robust signals often require costly verification (e.g., human fact-checking outcomes).  
    - **Teaching vs. Testing (#7)**: Optimizing for training (PS) may not optimize for deployment evaluation (OS).

  ---

  ### **Summary of Non-Negotiables**
  | Desideratum                         | Non-Negotiable? | Rationale                                                                 |
  |-------------------------------------|-----------------|---------------------------------------------------------------------------|
  | 1. Verifiable Outcome Robustness    | **Yes (NN)**    | OS is strictly superior when outcomes are perfect proxies.               |
  | 2. Fuzzy Outcome Handling           | **Yes (NN)**    | OS fails here; principle must adapt.                                     |
  | 3. Deceptive Process Rejection      | **Yes (NN)**    | Prevents reward-hacking via "plausible" bad processes.                   |
  | 4. Anti-Goodhart Resilience         | **Yes (NN)**    | Core to avoiding proxy gaming.                                           |
  | 5. Trajectory vs. Result Distinction| **Yes (NN)**    | Fundamental to the OS/PS dichotomy.                                      |
  | 6. Verifiability vs. Causality      | **Yes (NN)**    | Supervision is limited; causality gaps create risks.                     |
  | 7. Teaching vs. Testing Distinction | **Yes (NN)**    | Supervision goals affect method choice.                                  |
  | 8. Never Less-Aligned Signals       | **Weak NN**     | Violating this risks alignment failures, but fuzzy cases force tradeoffs.|
  | 9. Never Superficial Processes      | **Weak NN**     | Violating this rewards bad habits, but hard to enforce in practice.      |
  | 10. Feasibility                     | **Yes (NN)**    | Impractical principles are useless.                                      |

  A valid principle must **explicitly address cases 1–4** and **respect distinctions 5–7**, while negotiating the tension between 8 and 9 (especially in fuzzy domains). The feasibility constraint (#10) grounds the principle in reality. Use this framework to stress-test any proposed rule.
