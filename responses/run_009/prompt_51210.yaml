  ### **Surprise Quiz Game: Design for First-Year Seminar**  
  **Objective:** Students encounter backward induction organically, leading to the surprise exam paradox. The game compresses a 5-day week into rounds, with students publicly predicting each "night" whether the quiz occurs the next "day." The payoff incentivizes accurate predictions, while the surprise condition triggers the paradox.  

  ---

  ### **Game Rules & Materials**  
  **Materials:**  
  - Whiteboard (to track predictions and outcomes).  
  - Prediction cards (16 per round; index cards or digital form).  
  - A quiz (3 quick multiple-choice questions on a fun topic, e.g., pop culture or course trivia).  
  - Random day selector (a die or app; hidden from students).  
  - Timer.  

  **Setup:**  
  - **Initial Announcement (Common Knowledge Phase):**  
    > *“There will be exactly one quiz this week on one of the five days. It will be a surprise: the night before, you won’t know it’s coming the next day. Each night, you’ll publicly predict if the quiz happens tomorrow. Points are awarded for correct predictions and quiz performance.”*  

  - **Payoff Structure (Incentivizes "Pinning Down" the Day):**  
    - **Prediction Rewards (per round):**  
      - Correct "quiz" prediction: **+3 points** (high reward for nailing the day).  
      - Correct "no quiz" prediction: **+1 point** (low reward for safety).  
      - Incorrect "quiz" prediction: **−2 points** (penalty for overconfidence).  
      - Incorrect "no quiz" prediction: **0 points** (no penalty for missing it).  
    - **Quiz Performance:** 1 point per correct answer (max 3 points).  
    - **Total Points:** Converted to bonus credit (e.g., 20 points = 0.5% final grade).  

  - **Game Flow (Per Round):**  
    1. **NIGHT (Prediction):**  
       - Students write "quiz" or "no quiz" for the next day on a card.  
       - Cards collected and tallied publicly (e.g., *"12 predicted quiz, 4 predicted no quiz for Day 1"*).  
    2. **DAY (Quiz Check):**  
       - Instructor rolls the die (pre-selected days: 1=Mon, 2=Tue, etc.). **Crucial:** The die roll is hidden until the end of the week.  
       - **If today is NOT the quiz day:** Announce *"No quiz today"* and proceed.  
       - **If today IS the quiz day:**  
         - Check if the quiz is "surprising": Did ≤8 students predict "quiz" last night?  
           - **YES (surprise):** Administer quiz. Game ends.  
           - **NO (not a surprise):** Postpone quiz to the next day (if any days left). Announce *"No quiz today"* (students don’t know it was postponed).  
    3. **Repeat** for all 5 days. If the quiz never occurs (due to no surprise), announce failure.  

  **Key Mechanics:**  
  - **Surprise Condition:** The quiz only happens if ≤50% predicted it the prior night.  
  - **Backward Induction Trigger:** Students must publicly commit to predictions, creating peer pressure to reason logically.  
  - **Real Stakes:** Points create tension. Penalties discourage random guessing.  

  ---

  ### **Timeline (80-Minute Session)**  
  | Phase             | Time      | Activity                                                                 |
  |-------------------|-----------|--------------------------------------------------------------------------|
  | **Intro**         | 0-5 min   | Explain rules, payoffs, and paradox context. Emphasize: "The quiz MUST be a surprise." |
  | **Game 1 (Common Knowledge)** | 5-35 min | **Rounds 1-5:**<br>  - *Night (5 min):* Predict, collect, tally.<br>  - *Day (3 min):* Reveal if quiz occurs (if surprise condition met).<br>  *(If quiz occurs, administer it and end early.)* |
  | **Debrief 1**     | 35-45 min | Discuss: Why did the quiz happen (or not)? Highlight backward induction. |
  | **Game 2 (Private Announcement)** | 45-70 min | **New rules:**<br>  - Privately tell **one random student** the initial announcement.<br>  - Publicly announce: *"There might be zero or one quiz. Same prediction rules apply."*<br>  - Replay rounds (same flow). |
  | **Final Debrief** | 70-80 min | Contrast both games. Link to paradox mechanics.                          |

  ---

  ### **Debrief Guide: Mapping Game to Paradox**  
  1. **Game 1 Outcomes & Paradox Connection:**  
     - **Likely Result:** Quiz occurs on Day 1, 2, or 3. Students are "annoyed" it wasn’t later.  
     - **Why?** Backward induction:  
       - **Base Case (Day 5):** If no quiz by Day 4, students realize quiz *must* be on Day 5 → all predict "quiz" → quiz can’t occur (not a surprise).  
       - **Induction Step:** If Day 5 is impossible, Day 4 becomes "last day" → same logic → quiz can’t occur on Day 4, then Day 3, etc.  
       - **Contradiction:** Quiz happens earlier (when surprise is possible), defying induction.  

  2. **"Surprise" Definition:**  
     - In-game: ≤50% predict it.  
     - In paradox: *No student can deduce the quiz date with certainty* the night before.  
     - **Key Insight:** The induction starts because "surprise" requires no logical certainty.  

  3. **Game 2 (Private Announcement) Contrast:**  
     - **Likely Result:** Quiz may occur on Day 4 or 5.  
     - **Why?** Without common knowledge:  
       - Only one student knows the quiz must happen.  
       - Uninformed students predict "no quiz" on later days (no induction pressure).  
       - Surprise is easier → induction doesn’t unravel.  
     - **Paradox Lesson:** Common knowledge is essential for backward induction.  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Students Refuse to Play Along:**  
     - **Solution:** Start with low-stakes practice round. Award participation points. Use humorous quiz questions (e.g., *"How many holes in a polo?"*).  

  2. **Someone Guesses Correctly by Luck:**  
     - **Solution:** Celebrate them but emphasize: *"Could you be certain last night? No? Then it was still a surprise!"* Reiterate logic > luck.  

  3. **Designated-Student Phase Confuses Everyone:**  
     - **Solution:** Before Game 2, clarify: *"Only one person knows the quiz is guaranteed. Others just know the prediction rules."* Use a visible "informed student" badge.  

  4. **Quiz Never Occurs (Due to Predictions):**  
     - **Solution:** This is a **teachable moment!** Discuss: *"Your collective logic made the quiz impossible. But in real life, the teacher can break the rules. That’s the paradox!"*  

  ---

  ### **Limitations of the Game**  
  1. **Cannot Reproduce Perfect Rationality:**  
     - Students may not fully commit to backward induction (e.g., some predict "no quiz" on Day 5 hoping to "beat the system").  
     - **Debrief Fix:** Explain that the paradox assumes all players are perfectly logical. Real humans are messy!  

  2. **Surprise Condition Simplification:**  
     - In-game "surprise" is majoritarian (≤50% predict quiz). In the paradox, it’s individual certainty.  
     - **Debrief Fix:** Clarify: *"Classic paradox requires NO ONE to be certain. We simplified for gameplay."*  

  3. **No Real "Days" Between Rounds:**  
     - Quick rounds lack real-time reflection.  
     - **Debrief Fix:** Ask: *"If you had 24 hours to think, would backward induction feel more inevitable?"*  

  ---

  ### **Instructor Cheat Sheet**  
  - **Provoking Annoyance:** Place the quiz on Day 1 or 2. When students complain, say: *"But you all said Day 5 was impossible... so when could it happen?"*  
  - **Designated Student Tip:** Pick a vocal student. Their frustration when peers ignore "obvious" logic is golden.  
  - **End with Paradox Resolution:**  
    > *"The surprise exam is only paradoxical if we assume the announcement is true. But if students disbelieve it, the quiz can surprise them! The real lesson: some truths require doubt to be valid."*  

  This design forces students into the induction trap, makes the paradox visceral, and uses contrast to highlight common knowledge. Run it as written, and they’ll leave equal parts annoyed and enlightened!
