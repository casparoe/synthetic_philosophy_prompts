  **Doctrine of Double Effect (DDE) in Causal Terms**

  The DDE says:

  1. The act itself must be morally good or at least indifferent.
  2. The agent may not positively will the bad effect but may merely permit it. The bad effect must not be intended.
  3. The good effect must flow from the action at least as immediately as the bad effect (i.e., the bad effect must not be a means to the good effect).
  4. The good effect must be sufficiently desirable to compensate for the bad effect.

  We are focusing on the causal structure, especially (3): the bad effect must not be a means to the good effect.

  In causal graph terms:

  - **Means**: The harm (bad effect) lies on a directed path from the intervention to the good effect. That is, the intervention causes the harm, and the harm causes (or is necessary for) the good effect.

  - **Side effect**: The harm is caused by the intervention but not on the directed path to the good effect. It may be on a separate branch.

  In the switch case, the harm (Death1) is not on the directed path from D to saving the five (preventing Death5). The path is D → TrolleyPath → Death5 (with Death5=0 when diverted). Death1 is a separate effect of TrolleyPath.

  In the fat man case, the harm (Death1) is on the path to saving the five: D → FatManFalls → Death1 and D → FatManFalls → TrolleyStopped → Death5 (prevented). So Death1 is on the same causal path as the good effect.

  In the loop case, similarly, the harm (Death1) is on the path to the good effect: D → TrolleyPath → Death1 → TrolleyStopped → which prevents Death5_final. So Death1 is a means to the good effect.

  **Intention and Foreseen**

  The DDE also requires that the agent does not intend the harm, even if foreseen. Can we represent intention on the graph?

  Intention is a mental state of the agent. It is not a property of the graph structure per se, but of the agent's beliefs and desires.

  However, we can consider:

  - The agent's goal is to achieve the good effect (save the five) and avoid the bad effect (the death) if possible.

  - The agent's model of the causal graph: they know the structure and the effects of their actions.

  In the switch case, the agent intends to divert the trolley to save the five, and they foresee that this will cause the death of the one. But they do not need the death of the one to save the five. They would prefer if the one were not there and they could still save the five (by diverting to an empty track).

  In the fat man case, the agent needs the death of the fat man (or at least his falling and stopping the trolley) to save the five. So they intend the falling of the fat man, which they know will cause his death, as a means to stop the trolley.

  So intention might be captured by:

  - The agent's desired outcome requires the occurrence of the harm in the fat man case (because without the harm, the good outcome doesn't happen). In the switch case, the desired outcome (saving the five) does not require the harm (if the side track were empty, the five would be saved and no one dies).

  But note: in the switch case, if the side track were empty, then diverting would save the five without killing anyone. In the fat man case, if the fat man falls but doesn't die (and still stops the trolley), that would be acceptable? But the agent knows that the fall will kill him. So the agent intends the fall, which they know causes death, as a means.

  So we might model intention as the agent's plan involving the harm as a necessary step. In causal terms, the agent's chosen intervention affects a variable that causes the harm, and that variable is on the path to the good outcome, and the agent knows that the harm is inevitable given the intervention.

  But note: the agent might not care about the harm per se, but they accept it as a necessary cost. The DDE draws a line between intending the harm and merely foreseeing it.

  In the causal graph, we can see if the harm is a necessary step on the path to the good outcome. If it is, then the agent must intend the harm (or at least the immediate cause of the harm) as a means. If it isn't, then the harm is just a side effect.

  **Residue Report**

  Now, let's evaluate which parts of the philosophical debate translate cleanly, which are distorted, and which have no expression in a DAG.

  **Cleanly Translated**:

  1. **Means vs. Side Effect**: This distinction maps directly to the causal graph. If the harm is on a directed path from the intervention to the good outcome, then it is a means. If it is an effect of the intervention but not on the path to the good outcome, it is a side effect. This is captured in our graphs for the three cases.

  2. **The structure of the trolley cases**: The causal differences between the switch case and the fat man/loop case are clearly represented by the graph. In the switch case, the harm is a side branch. In the fat man and loop cases, the harm is on the path to the good outcome.

  **Distorted or Partially Captured**:

  1. **Intention**: The causal graph can show whether the harm is a necessary step for the good outcome (given the structure). But intention is a mental state. The agent might be ignorant of the structure. For example, in the switch case, if the agent believes that the death of the one is necessary to stop the trolley (even if it isn't), then they might intend the death. But the graph represents the actual causal structure, not the agent's beliefs. So intention is not purely a graph property.

     We might augment the model with the agent's belief graph. But then we have two graphs: the real one and the agent's. And even then, intention is about what the agent aims at. The agent might know the structure but still not intend the harm: they might hope that by some miracle the harm doesn't occur. But the DDE requires that the harm is not intended, even if foreseen.

     So intention is not fully captured by the graph alone. However, the graph can indicate whether the harm is a necessary consequence (in the actual world) of the intervention for achieving the good outcome. That is a necessary condition for the harm being intended as a means? Not exactly: the agent might not care about the causal structure and just do the intervention for the good outcome, accepting the harm. But the DDE is concerned with whether the harm is part of the plan as a means.

     We can say: if the harm is not on the path (in the actual graph), then it cannot be intended as a means (it might be intended as an end, but that's different). If it is on the path, then it might be intended as a means. But the agent might still not intend it: they might regret having to cause it. The DDE requires that the agent does not intend it, even if it is a means. So the graph cannot capture the absence of intention.

     Therefore, intention is not a graph property.

  2. **Doing vs. Allowing**: The distinction between acting and failing to act (omission) is not naturally captured in the graph. In the graph, we represent interventions (doing) and the absence of intervention (allowing). But the graph doesn't distinguish between an intervention that causes harm and an omission that allows harm. The graph just shows the causal effects of setting a variable to one value vs. another. However, in the trolley problem, the baseline is usually the default course (doing nothing). So the intervention is compared to the default. But the graph doesn't inherently mark which action is the default.

     Moreover, in moral philosophy, allowing harm (by inaction) is sometimes seen as less bad than doing harm (by action). The graph doesn't represent this normative asymmetry.

  **No Expression in DAG**:

