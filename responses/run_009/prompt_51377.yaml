  #### **Case 1: Switch Case**  
  **Scenario**: Throw switch to divert trolley from killing 5 to killing 1.  
  **Causal Structure**:  
  - Harm (death of 1) is a **side effect** of diverting the trolley.  
  - Good outcome (saving 5) does not *depend* on the death; it only requires diversion.  

  **DAG**:  
