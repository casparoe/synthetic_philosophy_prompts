  - **Intended**: `Save5` (lies on the path from intervention).  
  - **Foreseen**: `Death1` (off-path side branch).  

  ---

  #### **Case 2: Fat Man Case**  
  **Scenario**: Push fat man to stop trolley, killing him but saving 5.  
  **Causal Structure**:  
  - Harm (death) is a **means** to the good outcome. The death *causes* the trolley to stop.  
  - Good outcome requires the death as an intermediate step.  

  **DAG**:  
  ```
  do(push_fat_man) → FatManPushed → Death1 → TrolleyStopped → Save5  
  ```  
  **Translation to DDE**:  
  - **Intended**: `Death1` (on the active path to `Save5`).  
  - **Foreseen**: N/A (harm is intended as a means).  

