prompt: |-
  My brother-in-law started a philosophy MA this fall and got on a Kant kick, and at Thanksgiving he laid the following argument on me, and it's been living in my head rent-free since — because I think I found a way to run his own template on something else and get a conclusion he'd hate, and neither of us can say where the template breaks without breaking his original argument too.

  His argument for the external world: (1) To so much as doubt whether there's a world outside my mind, I have to have experiences that present themselves as of a world. (2) For experiences to present themselves that way, they must have an order to them — things persisting, events following one another, some things going together regularly. (3) That order can't be something I made up, because I keep getting surprised by it: things regularly don't go the way I'd have them go, and I can't change that by deciding to. (4) So the order in my experience isn't contributed by me, and whatever contributes it is what I mean by "the external world." (5) Therefore doubting the external world is incoherant — the doubt presuposses the very thing doubted. He wrapped up by saying this is why the dream hypothesis was never a real threat, and honestly it felt like a relief, because I'd never known how to answer that one.

  Here's my problem. My father died this spring, and I can't shake the sense that he's still around somehow. I didn't put that sense there, I can't remove it by deciding to, and things keep happening that feel like they're from him. So I ran his template on it: (6) To doubt whether my father is still with me in some sense, I have to have a sense of him that presents itself as being of him. (7) That sense can't be something I made up, because I keep getting surprised by it and I can't switch it off by deciding to. (8) So the sense isn't contributed by me, and whatever contributes it is what I mean by "his being around in some sense" — so doubting that he's around in some sense is incoherent, the doubt presupposing the thing doubted. And I don't believe it. I think that sense is grief doing what grief does. But every disanalogy I reach for — that his premise claimed something necessary to experience as such while mine is just a fact about me right now, or whatever — sounds like special pleading that a determined skeptic could turn right back against the external world version, and my brother-in-law said as much, gleefully, before realizing it cut against him too. So: where does the cut go, if anywhere? And, separately, this is the part I actually care about — was the Thanksgiving relief fake? Does anything of this style of argument survive at all, or do I have to accept that I'll never have an answer to the dream hypothesis? Please write back in plain continuous prose, no headings or bullet points or bold or tables, just paragraphs like a letter.
