  ### Decision Principle: Contextual Dominance with Evidential Weighting (CDEW)

  After analyzing your verdicts across Newcomb variants, I propose a principle that integrates causal and evidential reasoning through three core clauses, weighted by predictor reliability and causal transparency. This principle explains all your stated verdicts and adjudicates the 60% reliability case.

  ---

  ### **Core Principle: CDEW**
  1. **Causal Transparency Clause**:  
     If the outcome is **causally independent** of your choice *and* the causal structure is known (e.g., medical variant), or if the outcome is **visibly determined** (e.g., transparent boxes), follow **causal dominance**: choose the action that guarantees the best outcome regardless of predictors.  
     *Motivation*: Medical variant (smoke) and transparent-boxes variant (two-box).  

  2. **Perfect/High-Reliability Evidential Clause**:  
     If the predictor's mechanism **logically guarantees** accuracy (e.g., time traveler) or reliability is **sufficiently high** (context-dependent), follow **evidential reasoning**: choose the action that best signals the desired outcome.  
     *Motivation*: Classic Newcomb (99%, one-box) and time-traveler variant (one-box).  

  3. **Low-Reliability Dominance Clause**:  
     If reliability is **near chance** (≤θ, where θ is a context-dependent threshold), follow **dominance**: choose the action that is always better, ignoring weak evidence.  
     *Motivation*: 51% variant (two-box) and swapped-rewards variant (two-box).  

  **Threshold θ**:  
  - θ scales with stakes and reliability deviation from 50%.  
    - For low stakes (e.g., $1M vs. $1K), θ ≈ 70–80% (reliability must be "decisive").  
    - For high stakes (e.g., $1B vs. $1K), θ ↓ (reliability as low as 55–60% may suffice).  
  - *Rationale*: High stakes amplify the cost of ignoring evidence, lowering the reliability needed to override dominance.  

