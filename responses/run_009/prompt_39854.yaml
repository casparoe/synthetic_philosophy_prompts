     Alternatively, we can increase the safe reward to 2? Then the break-even q would be: 2.5*(1-q) = 2 -> 1-q = 2/2.5=0.8 -> q=0.2. So if there is a 20% chance of being cut, then standing out is break-even? That might be too sensitive? 

     Let's stick with the original and see what happens. We can adjust in the moment? 

     The point is not to have perfect economics, but to create the tension.

  4. The effort puzzles might be too hard or too easy? We can test them? Examples:

     Effort puzzles (each in a round, same puzzle for all stand-outs in that round):
     - Round 2: "What is 5 times 4?" (answer: 20) -> very easy.
     - Round 4: "Rearrange the letters: ogehd" (answer: dogeh? not a word. Let's do: "shore" -> "horse" -> but that's too long? How about: "act" -> "cat" -> but that's two words? Let's do: "What is the capital of France?" (answer: Paris) -> but that's knowledge, not effort? We want quick thinking? How about: "What is the next letter: A, C, E, ...?" (answer: G). 

