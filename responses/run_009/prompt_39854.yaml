     We can have a list and pick one per round.

  Weakest Part of the Design:

  I am least confident about the cutting mechanism. Specifically, I worry that the coordination problem (cutting only pays off if between 3 and 5 people cut the same person) might not function as intended. It might be that no one cuts because they fear not having enough cutters? Or it might be that everyone cuts and then they get very little? Also, the cost of cutting (-1) might deter cutting even if they think the success is unearned? 

  In the debrief data, if we see very little cutting in the first few rounds, then the norm of cutting didn't emerge? That would be a problem. We want enough cutting to be present so that we can see the difference between luck and effort and the effect of the reveal.

  If that happens, we might need to adjust the numbers? For example, reduce the cutting cost to 0? But then there is no cost to cutting? Then we might get too much cutting? Alternatively, reduce the threshold to 2? 

  What specific outcome would make me say the payoff numbers need to be redone? 
  - If in the first round, very few people stand out (say less than 5) and then among the successful stand-outs, no one gets cut? Then we don't have the tension? 
  - If the cutting is very rare, then we can't test the effect of luck vs effort? 

  In the debrief, if students say: "I didn't cut because it cost 1 point and I didn't think enough others would cut" then we know the coordination problem was too hard? 

  We can adjust the threshold dynamically? But that might be cheating? Alternatively, we can run a pilot with colleagues? 

  But for the first run, we can be prepared to adjust after round 1? If we see no cutting, we can announce before round 2: "I notice that not much cutting happened. Remember, if at least 3 people cut the same successful stand-out, the cutters split 5 points. So if you think others might cut the same person, it can be profitable." 

  Alternatively, we can reduce the threshold to 2? But we don't want to change the rules mid-game? 

  So I think the numbers might need tweaking? We can set the threshold to 2? Then cutting is easier? 

