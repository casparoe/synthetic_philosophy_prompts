prompt: |-
  Second-year PhD student here, logic side of the phil department, and my commitee wants a chapter that touches on the ontological argument. Before I actually wade into that literature I want the spec first: what would a version of the argument have to deliver to count as a proof, and not just a formal curiosity that everyone files under "interesting, fails"? Here's what I keep circling, tell me if I have it right:

  - the premises have to be acceptable to someone who doesn't already accept the conclusion. or maybe that's too strong — is it enough that each premise is more plausible than not on independent grounds? I genuinely don't know where to put the bar
  - the modal logic should be as weak as possible. everyone runs these arguments in S5, but is that a requirement, or fine because S5 is just the standard reading of metaphysical necessity? or is leaning on S5 itself a strike against the argument?
  - no smuggling existence in as a predicate you can just instantiate. I know that's Kant's complaint about Descartes, but I want it stated as a constraint on the formalization, not as history
  - what I'll call the mirror test: if you can run the same machinery with parallel premises and prove the opposite conclusion — there's no necessary being, or some maximally awful being exists — then the argument fails. I've heard Gödel's original axioms actually let you derive a contradiction, and that people have constructed mirror arguments alongside the positive ones. is that right, and is the mirror test even satisfiable in principle, or is every argument going to fail it if you're clever enough with the parody premises?

  That last bullet is what I most want from you. Which of my desiderata are genuine requirements and which are prejudices of one camp? Is some subset jointly unsatisfiable — like, can anything at all satisfy "non-question-begging premises" plus "valid in a weak logic" plus "passes the mirror test" simultaneously, or does every actual candidate quietly give one of them up? And which single requirement does the most work excluding candidates?

  Then, briefly, one short paragraph each, run Plantinga's modal version and Gödel's (or some repaired Gödel) against your list. skip Anselm and Descartes, everyone's seen those. no citations, just the reasoning — I'll chase the papers myself after.
reasoning: |-
  Okay, let me start by unpacking what this PhD student is asking. They're in their second year, focusing on logic in philosophy, and need to write a chapter on the ontological argument. But before diving into the literature, they want to set the criteria for what makes such an argument a genuine proof rather than just a formal curiosity. 

  First, I need to address their four main points. They mentioned premises that are acceptable to non-believers, weak modal logic, avoiding existence as a predicate, and the mirror test. The student seems particularly concerned about the mirror test—whether you can flip the argument to prove the opposite. They also want to know if these criteria are even possible to meet together or if they conflict.

  Hmm, the first point about premises. The student is unsure if premises need to be acceptable to someone who doesn't accept the conclusion or just more plausible than not. I recall that in logic, arguments shouldn't be question-begging. So maybe the bar is that premises should be defensible independently, not relying on the conclusion. But how strong does that defense need to be? It's tricky because what's plausible varies between people. Maybe the key is that premises shouldn't be equivalent to the conclusion or presuppose it. For example, defining God as necessarily existent might be circular.

  Next, the modal logic strength. They mention S5 is common but wonder if it's a weakness. S5 allows modal collapses, but metaphysicians often accept it for metaphysical necessity. So is using S5 a problem? It depends on whether the argument can work in weaker systems like T or B. If it requires S5, that might be a point against it because S5's axioms are stronger. But if S5 is the correct logic for modality, maybe it's acceptable. The student needs to evaluate if the argument hinges on controversial modal principles.

  Then there's existence as a predicate. Kant's critique is central here. In formal terms, existence shouldn't be treated as a property that can be part of a definition. So any argument that quantifies over existing things or uses existence in a definition might be invalid. This is a formal constraint: existence can't be a predicate in the logical sense. The student should check if the argument treats existence like a first-order property.

  The mirror test is their biggest concern. They mention Gödel's axioms leading to contradictions and parody arguments. I remember that Oppy and others have created parody versions. If an argument can be mirrored to prove a maximally evil being, it shows the premises might be arbitrary. But is it possible to avoid this? Some premises might be intrinsically linked to positive properties, but opponents argue that any set of properties could be mirrored. The student needs to consider if there's a non-arbitrary reason to prefer one set of properties over another.

  Now, are these criteria jointly satisfiable? It's tough. Non-question-begging premises might conflict with avoiding the mirror test. If premises are neutral, they might be too weak to prove God without S5. Weak modal logic might not support the necessary steps. The mirror test seems to be the strongest filter because many arguments fail here. Gödel's argument, for example, can be mirrored by changing "positive" to "negative" properties. Plantinga's depends on the coherence of maximal greatness, which might also be parodied.

  For Plantinga's argument: it defines maximal greatness as including necessary existence, and uses S5. The premise that maximal greatness is possible might be question-begging because it assumes the possibility of God. Also, S5 is necessary for the modal collapse. The mirror test could be applied by defining maximal awfulness. So it fails the mirror test and requires strong modal logic.

  Gödel's version uses positive properties and necessary existence. But defining "positive" is tricky and might be arbitrary. The axioms can lead to contradictions if not carefully restricted, and mirror arguments swap positive for negative properties. It also uses S5. So it fails the mirror test and has questionable premises.

  The student's hidden need might be to identify which criteria are essential and which can be compromised. They might also want to position their chapter as evaluating arguments against these stringent criteria, showing why ontological arguments remain contentious. They need a clear framework to assess each argument systematically, which will structure their chapter effectively.
answer: |-
  Here's a clear, rigorous specification for what a successful ontological argument (OA) must achieve to be considered a genuine *proof*, alongside an analysis of your desiderata and evaluations of Plantinga and Gödel:

  ### The Proof Bar: Essential Requirements
  1.  **Non-Circularity & Non-Question-Begging Premises:** Premises must be defensible *independently* of the conclusion, not presupposing God's existence or necessary existence. "Acceptable to a non-believer" is too strong (many valid arguments rely on premises opponents reject); the bar is that each premise must be *more plausible than its denial* on grounds *separable* from theism itself (e.g., intuitive modal principles, conceptual analysis, plausible metaphysical commitments). Premises equivalent to the conclusion (e.g., "God exists necessarily") are fatal.
  2.  **Minimal Modal Commitment:** The argument must work in the *weakest plausible* system for metaphysical modality. S5 is standard but strong (validating the Barcan formulas, collapsing iterated modalities). An argument *requiring* S5 faces the burden of justifying S5's contested axioms (e.g., the symmetry axiom ◊□P ⊢ □P) as *essential* to metaphysical necessity itself. An argument working in weaker systems (e.g., T, K4, B) is significantly stronger. Leaning on S5 isn't an *automatic* strike, but needing its full strength *is* a vulnerability.
  3.  **Existence is not a Predicate/Property:** The formalization must not treat "exists" as a first-order predicate applicable to individual objects in a way that allows it to be part of an essence or definition. This means:
      *   No `P(x)` where `P` directly means "exists".
      *   No instantiating existential quantifiers over domains that presuppose the existence of the very object being proven (e.g., defining God as having the property of existence, then inferring existence from that definition).
      *   Existence must be handled via quantification (e.g., `∃x G(x)`) or higher-order properties (e.g., necessary existence as `□∃x G(x)`), not as a defining characteristic `E(g)`.
  4.  **Immunity to Parody (Mirror Test):** This is **crucial and the most stringent filter**. The argument's *logical machinery and premise structure* must not allow a structurally identical argument proving a *different* necessary being (e.g., a maximally evil being, "Anti-God") or a contradiction (e.g., both God and Anti-God exist necessarily). If the *only* difference is swapping "positive/great-making" for "negative/evil-making" properties, and the parody is equally valid, it demonstrates that the original premises lack sufficient *modal content* to uniquely pick out the intended being. This reveals arbitrariness or hidden question-begging. **Satisfiability:** An argument *can* theoretically pass if its premises contain an *intrinsic, non-arbitrary modal asymmetry* between positivity/goodness and negativity/evil (e.g., if "positive" entails necessary instantiation *in a way* "negative" demonstrably cannot). No prominent OA has achieved this convincingly. Gödel's original axioms *did* allow contradictions unless heavily restricted (e.g., by Sobel), and mirror arguments are easily constructed for most versions.

  ### Joint Satisfiability & The Key Filter
  *   **Joint Satisfiability:** It's *theoretically possible* but empirically **extremely difficult**. "Non-question-begging premises" often clashes with "passes mirror test" because plausible neutral premises (e.g., about possibility, greatness, positivity) tend to be symmetric. "Weak modal logic" often clashes with deriving necessary existence, as weaker systems lack the inferential power of S5's characteristic axioms. Most arguments sacrifice one desideratum: Plantinga sacrifices non-question-begging premises and mirror test immunity; Gödel sacrifices mirror test immunity and arguably non-question-begging premises via "positivity".
  *   **The Most Excluding Filter:** **Immunity to Parody (Mirror Test)** does the most work. It exposes whether the premises genuinely capture something uniquely necessary or merely exploit the structure of the logic with arbitrary content. A failed mirror test usually implies the premises *are* arbitrary or question-begging, even if they initially seem plausible. It also often reveals reliance on strong modal logic (S5) to force the conclusion, which the parody can equally exploit.

  ### Brief Evaluations
  **Plantinga's Modal Argument:**
  *   **Premises:** Defines "Maximal Greatness" (MG) as including necessary existence and maximal excellence (omniscience, omnipotence, moral perfection). Key premise: "It is *possible* that MG is instantiated" (◊∃x MG(x)). This premise is **highly question-begging**; accepting it requires already accepting the *possibility* of necessary existence, which is nearly equivalent to the conclusion for many opponents. Plausibility is low for non-theists.
  *   **Modal Logic:** **Requires S5.** From ◊∃x MG(x), S5 allows inferring □∃x MG(x). Without S5's symmetry axiom (specifically, ◊□P ⊢ □P), the argument collapses. This is a significant vulnerability.
  *   **Existence:** Handled correctly via quantification/modality, not as a predicate.
  *   **Mirror Test:** **Fails catastrophically.** Define "Maximal Awfulness" (MA) as including necessary existence and maximal evil (omniscient malice, omnipotent cruelty). Premise: "It is possible that MA is instantiated" (◊∃x MA(x)). By identical S5 reasoning: □∃x MA(x). The premises offer no non-arbitrary reason to prefer ◊MG over ◊MA.

  **Gödel's Modal Argument (Sobel-Anderson/Hájek repaired versions):**
  *   **Premises:** Relies on axioms defining "positive" properties (e.g., positivity is closed under entailment, necessary existence is positive, essential omnipotence/omniscience/goodness are positive). The **crucial vulnerability** is the definition and axiomatization of "positive." What grounds these axioms independently? Why is necessary existence inherently "positive" rather than just a logical feature? This appears **arbitrary or question-begging** to opponents; plausibility hinges on prior theistic leanings.
  *   **Modal Logic:** **Requires S5.** Gödel's proof explicitly relies on S5 features to derive necessary existence from God-like essence. Weaker systems are insufficient.
  *   **Existence:** Handled correctly via higher-order essence and quantification (God-like essence entails necessary existence: □(G(x) → □∃y (y=x))).
  *   **Mirror Test:** **Fails.** Define "negative" properties analogously (closed under entailment, necessary existence is negative, essential omni-malevolence is negative). The Gödelian machinery can construct a "God of Evil" with necessary existence using identical logical steps. The axioms for "positive" lack intrinsic asymmetry preventing this; they appear stipulative.

  ### Conclusion
  Your desiderata are well-founded requirements (non-circularity, modal minimalism, existence-as-quantifier, parody-immunity), not mere prejudices. The mirror test is the most powerful discriminator. While jointly satisfiable *in principle*, no prominent OA succeeds. Gödel and Plantinga both fail primarily on the mirror test and reliance on S5, with Gödel also facing premise arbitrarity ("positivity") and Plantinga facing premise question-begging (◊MG). The core challenge is finding premises that are simultaneously plausible, non-circular, weak enough modally, *and* contain an intrinsic asymmetry immune to parody. This remains the Holy Grail (or perhaps, the Philosopher's Stone) of ontological arguments.
