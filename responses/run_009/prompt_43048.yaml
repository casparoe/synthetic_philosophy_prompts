  The strongest reading - that hypocrisy nullifies blame entirely - seems legally elegant but philosophically shaky. Can truth really be canceled by the messenger? 

  *scribbles mental notes* The user's real question hides in their last paragraph: Even if the substance is true, what exactly does hypocrisy strip away? The answer might lie in that performative layer - the moral authority to enforce norms, not the truth of the norm itself. 

