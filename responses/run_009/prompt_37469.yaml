  the argument comes from my friend jake. here it is as he states it:

  1. When comparing two outcomes, what matters morally is total suffering, and totals add across people: outcome A is worse than outcome B iff A contains more summed suffering.
  2. Given (1), for any grave harm there is some number of tiny harms that adds up to more than it. So there's some number N — probably unimaginably huge — such that N people each getting a dust speck in the eye is worse than one person being tortured for fifty years.
  3. Everyday life is made of "specklets": tiny harms, or tiny chances of harm, that we each impose on huge numbers of strangers. If I drive instead of biking, I make thousands of commutes slightly longer. Every purchase nudges prices a hair. Every email I cc people on shaves a sliver of some stranger's attention. A one-in-a-million chance of a speck is just a small expected speck, so imposing risk counts as imposing the specklet.
  4. By (2), a big enough pile of specklets is worse than a grave harm. There are billions of people, and billions is a big pile. So my decision to drive instead of bike is, taken in the aggregate, worse than if I tortured someone for an afternoon.
  5. Since nearly every ordinary action imposes specklets somewhere, (4) means each of us commits torture-equivalent wrongs several times a day, before lunch even.
  6. So either we are all monsters, or moral condemnation is so pervasive it becomes meaningless and the line between atrocity and everyday life is basically fake. jake goes with the second: he says the additive framework eats itself the moment you point it at real life instead of thought experiments.

