  Hmm, the user is a structural engineer who took a metaphysics course and is grappling with a puzzle about change. They're bothered by how objects can have seemingly intrinsic properties that change over time without becoming relations. They gave examples: bending a bracket, moving a desk, growing taller than their sister. They reject relational solutions like "bent at time t" because it feels like giving up on the object simply being bent. Their physicist friend suggested a 4D view where objects are extended in time with different temporal parts having different properties, but the user has two objections: it makes statements about the whole object seem partial, and it just relocates the problem to what unifies the temporal parts.

  I need to identify this puzzle. This is clearly the classic problem of change in metaphysics, specifically the problem of temporary intrinsics. David Lewis coined that term to describe properties like shape, location, or size that seem intrinsic but can change over time. The core tension is how the same object can possess incompatible properties at different times without contradiction.

  The user wants to distinguish this from other puzzles. Unlike the Ship of Theseus, they're granting identity over time is settled - no question about which object it is. This is purely about property attribution. It also differs from relational changes (like becoming an uncle) because bentness feels non-relational.

  For responses, there are three main positions. First is presentism - only the present exists, so the bracket simply is bent now and was straight before. The big objection is that it makes past truths mysterious. Second is the relational solution - properties are relations to times. But as the user noted, this makes intrinsic properties extrinsic. Third is perdurantism (the friend's 4D view) where objects have temporal parts. The objections match the user's concerns: it violates how we talk about whole objects, and the problem resurfaces in explaining what unites temporal parts.

  Boundary cases include: instantaneous changes (like snapping) where properties switch abruptly; cyclical changes (like a spinning top) where properties repeat; and relational-but-seeming-intrinsic cases (like "being tall" which is comparative). If coining a term, "the intrinsicity paradox" captures the core tension well.

  The user seems frustrated with superficial answers - they want deep metaphysical clarity. As an engineer, they likely value precision and dislike hand-waving. I should honor that by being rigorously systematic in the response structure they requested.
answer: |-
  Here’s a structured analysis of your puzzle, following your requested format:

  ### (1) What you’ve noticed, and its name  
  **Puzzle:** You’ve identified the core problem of **temporary intrinsics**: how can a single, enduring object possess intrinsic properties (like shape, location, or height) that are incompatible (e.g., straight/bent, here/there, short/tall) at different times, without contradiction or reducing to relations? This clashes with classical logic (where an object can’t both possess and lack a property) and with our intuition that intrinsic properties are non-relational ("bent" seems monadic, not dyadic like "uncle"). The puzzle assumes identity over time is unproblematic (no Ship-of-Theseus ambiguity) and focuses on how properties are instantiated. David Lewis named this the "problem of temporary intrinsics" in *On the Plurality of Worlds* (1986), though its roots trace to Heraclitus and McTaggart. Your observations about the "non-partitive" feel of statements ("the bracket *is* bent") and dissatisfaction with relational solutions ("bent at *t*") are central to modern debates.

  ### (2) Nearest neighbors and what separates them  
  - **Change vs. Relational Change**: Becoming an uncle is relational (e.g., to a niece). Your cases (bending, moving, growing) involve *non-relational* properties: bentness isn’t "toward" anything, unlike spatial relations.  
  - **Temporary Intrinsics vs. Identity Puzzles**: Unlike the Ship of Theseus, your cases assume strict identity over time (the bracket is uncontroversially the same object). The puzzle isn’t "*which* thing persists?" but "*how* can one thing have opposing properties?"  
  - **Temporary Intrinsics vs. Modal Properties**: This concerns *actual* change over time, not *possible* properties (e.g., "the bracket *could* be bent" in another world).  
  - **Temporary Intrinsics vs. Indexicality**: While "now" is indexical, your worry is metaphysical: *what entities* bear properties? Indexicality (e.g., "bent now") doesn’t resolve whether the property itself is relational.  
  - **Boundary Case**: "Being tall" *seems* intrinsic but is often comparative (relative to a population). Your height example avoids this: "taller than my sister" is explicitly relational, but "being 6 feet tall" at time *t* is non-relational.  

  ### (3) The responses on offer  
  Three main solutions exist, each with a fatal flaw:  

  1. **Presentism**  
     - **View**: Only the present exists. The bracket *simply is bent* (now), and its past straightness isn’t a current property of anything. "The bracket was straight" means a past entity (a "past bracket") was straight, but it’s not identical to the present bracket.  
     - **Friend’s Picture?** No. Presentism rejects temporal extension.  
     - **Worst Objection**: Truthmaking for past/future truths (e.g., "The bracket *was* straight"). If only the present exists, what grounds the truth of past-tense statements? Present facts (e.g., memories, fossils) seem insufficient or circular.  

  2. **Relationalism/Adverbialism**  
     - **View**: Properties are relations to times. "The bracket is bent" is shorthand for "The bracket is bent-at-*t*." Shape is dyadic: an object *bears* bentness *to* a time. Change is variation in these relations.  
     - **Friend’s Picture?** No. This treats times as abstract relata, not physical dimensions.  
     - **Worst Objection**: Intuitively, bentness is *intrinsic*—how the bracket *is*, irrespective of other entities. Making it relational (to times) contradicts this intuition. As you noted, it "gives up" on the bracket being bent *simpliciter*.  

  3. **Perdurantism (4Dism)**  
     - **View**: Objects persist by having temporal parts. The bracket is a "spacetime worm": its Tuesday-part is straight, its Wednesday-part is bent. "The bracket is bent" implicitly references a *temporal part* (e.g., the current stage). Your physicist friend endorses this.  
     - **Friend’s Picture?** Yes, exactly.  
     - **Worst Objections**:  
       - **Semantic**: As you observed, "the bracket is bent" feels like a claim about the *whole* object, not a part. Perdurantism renders ordinary statements systematically misleading.  
       - **Unity**: What unites temporal parts into one "bracket"? Perdurantists invoke genidentity (causal continuity), but this risks circularity: if temporal parts are defined by their role in a persisting whole, what explains persistence itself?  

  ### (4) Boundary cases and coinage  
  **Boundary Cases**:  
  - *Instantaneous Change*: A bracket snapping at *t*. Is there a temporal part *at t* that is both straight and bent? Perdurantists avoid this via arbitrarily brief parts, but this feels ad hoc.  
  - *Cyclical Change*: A spinning top alternates between upright and tilted. Relationalism handles this easily, but perdurantism multiplies parts without clear gain.  
  - *Seemingly Intrinsic but Relational*: "The desk is heavy" (intrinsic) vs. "The desk is moved" (arguably relational to positions). Your cases avoid this by selecting uncontroversially intrinsic properties (shape, location).  

  **Coinage**: The term "temporary intrinsics" is established, but it doesn’t emphasize your core unease: that relational or partitive solutions abandon *non-derivative* property-bearers. A sharper term is **the intrinsicity paradox**:  
  - **Definition**: The tension arising when an enduring object’s intrinsic properties change over time, forcing us to either (a) deny intrinsicness (via relations), (b) deny strict identity (via parts), or (c) posit non-present entities.  
  - **Edges**: It applies only to properties that are (i) intrinsic, (ii) incompatible (like bent/straight), (iii) instantiated over time by a single object, and (iv) not analyzable as relations independent of time (unlike "uncle"). Cases where identity is disputed (Ship of Theseus) or properties are clearly extrinsic (e.g., "popular") fall outside.  

  This paradox persists because no solution fully preserves all intuitions: intrinsicness, identity, and the simplicity of change statements.
