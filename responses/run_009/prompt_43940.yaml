     { "claim": "Civilization is a thin veneer: we are all one administrative reorganization away from complicity", 
       "verdict": "defensible simplification", 
       "note": "This captures Bauman's warning about the potential in modern societies, but over-simplifies by implying immediate vulnerability and omitting his emphasis on contingency and specific conditions." },
     { "claim": "Responsibility for atrocity properly attaches to systems rather than to persons", 
