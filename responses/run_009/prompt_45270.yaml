  **For Section Discussion:**

  *   **Prinz Clarification:** Crucial to clarify Prinz's *embodied appraisal* view in section. Emphasize he *uses* the term "appraisal" but argues emotions are *perceptions* of bodily states that reliably *track* (represent) core relational themes (appraisals) – a *perceptual* account, distinct from Nussbaum/Solomon's *judgment* account.
  *   **Recalcitrant Emotions Nuance:** Discuss *how* judgment theorists like Nussbaum actually respond (e.g., emotions involve judgments held "as if" true, or judgments about *vulnerability* rather than current threat). Point out that the student's response sidestepped the core conflict.
