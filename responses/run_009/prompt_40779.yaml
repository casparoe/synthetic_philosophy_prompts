prompt: |-
  My roommate was supposed to feed my fish while I was away for two weeks and he forgot, and the fish died. When I told the story at a bbq over the weekend, two of my friends got into this whole argument about whether my roommate "caused" the fish to die, and I'm still turning it over so I want someone to actually sort it out.

  Dana said obviously he caused it — if he'd fed them like he said he would, they'd be alive. No feeding, dead fish. That's just what causing something is. Marcus said hold on, nothing can't cause anything. A cause is a thing that happens, and "not feeding the fish" isn't a thing that happened, it's a thing that DIDN'T happen. You can't point at it, there's no moment where it occurred. Dana said that's semantic games — the sun not coming up would cause every plant on earth to die, and you'd have no trouble saying that. Marcus said fine, but then who caused it? Because he didn't feed the fish, but neither did anyone else on the planet. Was the mailman a cause? Was Dana? If absences count as causes, then a million different people "caused" my fish to die by not feeding them, which is absurd, so something's gone wrong in the setup.

  Dana's answer was the one I keep chewing on. She said it's obvious the roommate is different from the mailman, and the difference is that the roommate PROMISED. He took on the job. When something goes wrong on your watch, your not-doing counts in a way a random stranger's not-doing doesn't. Marcus said then you're not talking about causation anymore, you're talking about blame or responsibility, which is a different thing — he might be to blame AND not be a cause, and sneaking the promise in to pick out the "real" cause just shows the causal claim was never really about the physics of the situation at all. Dana said maybe causation was never purely about physics in the first place, since we say things like "the gardener's failure to water the roses killed them" without anyone blinking, and nobody thinks the fact that we also blame the gardener makes it not true.

  They kind of trailed off into whether my roommate owes me a new fish, which honestly he does regardless. But the causation part never got resolved. Can you go through their back-and-forth and tell me who's right at each step? Like, is Marcus right that absences can't be causes, and if he isn't, is there any good answer to his "then everyone caused it" point other than Dana's promise thing? And does Dana's last move work, or is Marcus right that she's quietly changed the subject? I'd honestly like to know what, if anything, both of them were missing too.
