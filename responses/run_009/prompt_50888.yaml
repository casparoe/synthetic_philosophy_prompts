prompt: |-
  I'm a second-year undergraduate taking a module on social epistemology, and I also serve as the student facilitator for our department's weekly peer-review workshop, attached to a writing-intensive seminar with about thirty students. Each week the students exchange essay drafts and write structured feedback on one another's work before the seminar meets; my job is to read every comment sheet before it reaches the author, and decide what happens to it: send it back to the reviewer for rewriting, edit or soften it myself, pass it through unchanged, or escalate it to the tutor. The tutor has asked me to ground my triage in what our module has covered — Miranda Fricker's distinction between testimonial injustice (a speaker's word given less weight than it deserves because of who they are) and hermeneutical injustice (a gap in shared concepts leaving someone unable to make their experience intelligible to others, or to themselves). But she wants a procedure, not a theory: something I can actually run on a comment in two or three minutes, with about thirty sheets to get through on a Thursday evening before Friday's seminar.

  Please write me that decision procedure. It should set out the questions to ask of a comment in order, what counts as a sufficient answer at each step, and the outcomes available at each point — back to the reviewer, edited by me, passed through, escalated to the tutor. Somewhere in it you'll need to make the theory usable by someone who hasn't read it, so please spell out which distinctions must survive the translation: for instance, the difference between a comment about whether a claim is true and a comment about whether this author can be believed to have made it; or between a gap in an essay caused by the author's inexperience and one caused by the absence of any established vocabulary for what they are trying to say. Please say which parts of Fricker's framework you deliberately dropped in making it operational, and why the drops are safe. Mark clearly the points where the procedure runs out and a human judgement about values has to take over — I don't want to pretend the checklist is doing work it can't do.

  Then run the procedure on three real-ish comment sheets from last term.

  First: a reviewer wrote, on a draft by the only mature student in the group, who returned to study after fifteen years in care work and writes in long, plain sentences, 'I don't buy that you've engaged with the literature — this reads like it's patched together from lecture notes.' The draft in fact quotes three sources closely and argues with one of them.

  Second: a reviewer wrote, on an essay by a student describing the experience of being the only person in her family to go to university and what that did to how she could talk about ideas at home, 'This is just anecdote. Cut it and make a proper argument.' The passage in question is arguably doing conceptual work that no ready-made vocabulary in the course covers.

  Third — and here's the case where I expect the procedure to give me an answer I won't like — our workshop has a rule that every comment sheet must open with something positive. Last term a reviewer opened with 'This is really impressive work for someone at your stage,' followed by two pages of substantive and, frankly, correct criticism of another student's argument structure, from a reviewer widely believed in the group to look down on the author. I'd want to sanction that reviewer and save the author from the criticism. If the procedure instead says the substantive criticism goes through and the opening compliment is the part I should act on, so be it — but show me how the procedure separates the two, because on my gut reading the compliment is the kind thing in the sheet and on the procedure's reading it may be the injury.

  Finally, please be honest about what the procedure cannot do: what it will miss, when it will misfire, and which of its failures I should expect rather than try to patch. And please write your answer in British English.
reasoning: |-
  Okay, the user is a second-year undergrad facilitating a peer-review workshop grounded in Fricker's epistemic injustice framework. They need a practical triage procedure for handling feedback comments, operationalizing complex theory into a rapid checklist. 

  Hmm, the core tension here is between theoretical rigor and operational speed - they process 30 sheets weekly with 2-3 minutes per comment. The tutor specifically wants Fricker's concepts applied, but stripped to essentials. Key challenges: distinguishing testimonial injustice (credibility deficit) from hermeneutical injustice (conceptual gap) in peer comments, while catching subtle harms like backhanded compliments.

  Right, first I'll identify non-negotiable elements from Fricker: 
  The testimonial injustice detector must flag credibility attacks based on identity markers (like the mature student's writing style being misread as unscholarly). 
  The hermeneutical injustice detector needs to spot when valid experiences get dismissed as "mere anecdote" due to missing conceptual vocabulary (like the first-gen student's family experience). 
  But I'll jettison Fricker's structural oppression analysis - too granular for triage - focusing instead on identifiable harm patterns in comments.

  Ah, the backhanded compliment case is tricky! The procedure must decouple surface-level positivity from underlying credibility undermining. That "impressive for your stage" comment implies lower expectations - classic testimonial injustice. But the substantive criticisms might stand if factually accurate. Need separate assessment tracks for form and content.

  For implementation: A three-stage sieve makes sense. Stage 1 screens for direct harm (overt bias, identity attacks). Stage 2 assesses content validity (accuracy of critiques). Stage 3 handles constructive rewriting. Critical to build in "human judgment" off-ramps where automated decisions fail - like when tone conveys harm that checklist criteria miss.

  Testing with their cases: 
  Case 1 clearly fails Stage 1 - "patched together" dismisses labor based on writing style. 
  Case 2 fails Stage 2 - "just anecdote" mislabels hermeneutic work. 
  Case 3's compliment fails Stage 1 (presumptive about "stage"), while criticisms may pass Stage 2 if valid. 

  Must emphasize limitations: This won't catch microaggressions masked as praise, or systemic patterns across multiple reviews. And it can't resolve value conflicts - like when academic conventions clash with lived experience. The user needs permission to override the procedure when their facilitator instincts scream, especially regarding group dynamics they observe weekly.

  Final note: Use British English throughout - "tutor" not "professor", "essay" not "paper", etc. And explicitly state where I'm departing from Fricker's full framework for practicality's sake.
answer: |-
  Here is a practical triage procedure grounded in Fricker's core concepts, designed for rapid use. I've distilled her framework to two actionable filters: **Credibility Assessment** (testimonial injustice) and **Conceptual Gap Assessment** (hermeneutical injustice). Key distinctions preserved:

  1.  **Truth vs. Credibility:** Critiquing an argument's validity ≠ questioning the author's capability/trustworthiness due to identity or background.
  2.  **Inexperience vs. Hermeneutical Gap:** Missing elements due to novice errors ≠ missing elements because established vocabulary/lenses for the author's valid experience don't exist.

  **Operational Drops from Fricker's Framework (and Why Safe):**

  *   **Structural/Systemic Analysis:** We focus on *identifiable harm within the specific comment/context*, not deep societal structures. *Why safe?* Triage requires immediate, local assessment; systemic patterns are the tutor's remit.
  *   **Full Hermeneutical Marginalisation:** We focus on gaps *relevant to the specific essay's argument/experience*, not broad historical exclusion. *Why safe?* Our scope is the essay draft and course content.
  *   **Identity Nuance:** We use observable markers (e.g., "mature student", "first-gen") only where directly relevant to the comment's *perceived* harm. *Why safe?* We're assessing *potential* injustice based on *how the comment reads*, not conducting a full identity audit.

  ---

  **Peer Review Comment Triage Procedure**

  **Goal:** Rapidly assess if a comment risks testimonial or hermeneutical injustice, or if it is valid academic critique needing delivery adjustment.

  **Process per Comment Sheet (Aim: 2-3 mins):**

  1.  **STAGE 1: CREDIBILITY ASSESSMENT (Testimonial Injustice Filter)**
      *   **Question:** *Does this comment directly or indirectly undermine the *author's* credibility, knowledge, or right to speak, based on *who they are* or *how they write*, rather than solely on the *content* of their argument/evidence?*
      *   **Look For:**
          *   Assumptions about capability ("for someone like you...", "you wouldn't understand...").
          *   Dismissal tied to identity/writing style ("reads like lecture notes", "overly simplistic", "unprofessional tone" – *if* style is not the *actual* focus of critique).
          *   Questioning sincerity/effort without basis ("I don't buy that you've engaged...").
          *   Backhanded compliments implying lower baseline expectations ("impressive for your stage").
      *   **Sufficient Answer?**
          *   **YES (Credibility Harm Detected):** GO TO OUTCOME A or B.
          *   **NO:** PROCEED TO STAGE 2.

  2.  **STAGE 2: CONCEPTUAL GAP ASSESSMENT (Hermeneutical Injustice Filter)**
      *   **Question:** *Does this comment demand the author abandon or significantly alter an experience or perspective because it doesn't fit *established course concepts*, potentially dismissing a valid point *due to a lack of shared vocabulary/framework* rather than poor argumentation?*
      *   **Look For:**
          *   Dismissing lived experience as irrelevant "anecdote" when it *is* the subject/data.
          *   Demanding the author use specific theoretical jargon where their plain description *might* be attempting original conceptual work.
          *   Critiquing the *absence* of a concept/framework that *doesn't exist* within the course/material to describe the author's point.
          *   **Crucial Distinction:** Is the critique *"This experience isn't relevant to the essay question"* (potentially valid) vs. *"This experience isn't legitimate academic material"* (potentially hermeneutic injustice)? *Or* "This argument lacks structure" (valid critique) vs. "Your perspective makes no sense" (potentially hermeneutic).
      *   **Sufficient Answer?**
          *   **YES (Hermeneutical Harm Detected):** GO TO OUTCOME B or C.
          *   **NO (Valid Academic Critique):** PROCEED TO STAGE 3.

  3.  **STAGE 3: DELIVERY & CLARITY CHECK**
      *   **Question:** *Is the valid academic critique presented constructively, clearly, and respectfully?*
      *   **Look For:**
          *   Harsh, vague, or personal language.
          *   Unactionable feedback.
          *   Contradictions.
          *   Tone undermining constructive intent.
      *   **Sufficient Answer?**
          *   **YES:** GO TO OUTCOME D.
          *   **NO:** GO TO OUTCOME B.

  **OUTCOMES:**

  *   **A. Escalate to Tutor:** Serious credibility attack, complex hermeneutical issue, or systemic pattern suspected. *Human Judgement Required:* Severity, pattern recognition, pedagogical response.
  *   **B. Return to Reviewer for Rewriting:** Comments failing Stage 1, Stage 2, or Stage 3. Specify *why*: "Reframe to critique argument structure, not author effort"; "Explain why the anecdote section doesn't work for you academically, don't just dismiss it"; "Softened tone needed - focus on argument not author"; "Clarify this point - it's contradictory/vague".
  *   **C. Edit/Soften by Me:** Minor delivery issues on *valid* critique (Stage 3 fail only), or minor hermeneutical insensitivity where core critique is salvageable with reframing (e.g., changing "just anecdote" to "consider how this personal experience connects more explicitly to concept X").
  *   **D. Pass Through Unchanged:** Constructive, clear, respectful academic critique raising no Stage 1 or 2 concerns.

  **Human Judgement Takeover Points:**

  1.  **Assessing "Who they are" relevance:** Is the perceived link between the comment and the author's identity/background plausible in this context? (Stage 1).
  2.  **Distinguishing Hermeneutical Gap from Bad Argument:** Is the author genuinely grappling with an inexpressible experience, or just making an underdeveloped/unrelated point? (Stage 2).
  3.  **Severity & Pattern:** Does this single comment warrant escalation, or is it part of a pattern needing tutor intervention? (Outcome A).
  4.  **"Constructive" Nuance:** Does softening/editing preserve the critique's academic value while removing harm? (Outcome C).

  ---

  **Application to Your Cases**

  **Case 1: Comment:** *'I don't buy that you've engaged with the literature — this reads like it's patched together from lecture notes.'* (On mature student's draft)
  *   **Stage 1 (Credibility):** **YES.** "I don't buy that you've engaged" questions sincerity/effort ("buy" implies distrust). "Patched together from lecture notes" dismisses based on writing style (long, plain sentences), implying lack of scholarly effort/knowledge, *not* the actual content/use of sources. This directly undermines credibility based on presentation/style, especially given the author's background potentially influencing writing style. *Outcome:* **A. Escalate to Tutor** (Serious credibility attack) OR **B. Return for Rewriting** (Specify: "Critique the *integration* or *analysis* of sources, not the author's effort or style. Avoid phrases questioning engagement sincerity.").

  **Case 2: Comment:** *'This is just anecdote. Cut it and make a proper argument.'* (On essay using personal experience conceptually)
  *   **Stage 1 (Credibility):** **NO.** The comment critiques the *content type*, not overtly the *author's* credibility based on who they are.
  *   **Stage 2 (Conceptual Gap):** **YES.** The comment demands removal of lived experience ("Cut it") because it's labelled "just anecdote," dismissing its potential conceptual role. It insists on a "proper argument" using established frameworks, failing to recognise the author might be attempting conceptual work where such frameworks are absent (making experience intelligible). *Outcome:* **B. Return for Rewriting** (Specify: "Instead of dismissing the personal experience as 'anecdote,' explain *how* it could be strengthened to serve the argument. Does it need theoretical connection? More explicit analysis? Clarify what 'proper argument' means here.") OR **C. Edit/Soften** (e.g., Change to: "The personal experience section is vivid. Consider how to more explicitly connect this experience to the core concepts of the module to strengthen its analytical weight within your overall argument.").

  **Case 3: Comment:** Opener: *'This is really impressive work for someone at your stage,'* followed by substantive, correct criticism.
  *   **Analysis:**
      *   **Opener:** **Stage 1 (Credibility):** **YES.** "Impressive for someone at your stage" implies a lower baseline expectation for *this author*. It undermines credibility by suggesting surprise at their capability ("your stage" being ambiguous but often linked to perceived experience/ability). This is a backhanded compliment potentially rooted in the reviewer's known attitude. *Outcome for Opener:* **B. Return for Rewriting** (Specify: "Remove the phrase 'for someone at your stage'. Give a sincere, specific compliment about the work itself, e.g., 'Your analysis of X is clear' or 'Your structure is logical'.") OR **C. Edit/Soften** (Delete "for someone at your stage").
      *   **Substantive Criticisms:** **Stage 1:** Likely **NO** (assuming critique targets argument structure, not the author personally). **Stage 2:** Likely **NO** (assuming valid critique of structure, not dismissing an experiential gap). **Stage 3:** **?** Depends on delivery. If harsh/vague, **B** or **C**. If constructive/clear, **D**.
  *   **Overall Outcome:** The *comment sheet as a whole* needs intervention due to the opener. The *substantive criticisms* can potentially be passed (D) *if* their delivery is fine, **but only after the harmful opener is addressed.** The opener is the injury; the substantive critique might be valid medicine delivered by an untrustworthy hand. The procedure *separates them* by analysing components. Your gut is correct: the compliment is the injury. **Action:** **B. Return for Rewriting** (Focus on the opener: "Rewrite the positive opener to be specific and unconditional. The substantive feedback can stand if revised to ensure tone is constructive throughout."). Escalation (A) might also be warranted due to the reviewer's pattern.

  ---

  **What the Procedure Cannot Do (Be Honest):**

  1.  **Detect Subtle Microaggressions/Implicit Bias:** It relies on identifiable keywords/phrases. Deeply ingrained, subtle bias expressed ambiguously might slip through Stage 1.
  2.  **Resolve Deep Hermeneutical Tensions:** It flags *potential* gaps, but determining if it's *truly* hermeneutical injustice (lack of shared concepts) vs. authorial failure requires tutor-level judgment (Stage 2 Human Judgement point).
  3.  **Assess Reviewer Intent:** It focuses on *impact* and *content* of the comment, not the reviewer's state of mind. Malicious intent masked as valid critique might pass; well-intentioned clumsiness might be flagged.
  4.  **Address Systemic Patterns Alone:** It assesses comments individually. A pattern of low-level harms across multiple sheets might be missed until escalation.
  5.  **Fix Fundamentally Bad but Non-Harmful Critique:** Comments that are simply wrong, unhelpful, or miss the point, but don't trigger Stage 1 or 2, will pass (D). Your role here is triage for *injustice*, not overall feedback quality control (though Stage 3 catches very poor delivery).
  6.  **Handle "Grey Area" Values Conflicts:** E.g., when academic conventions *do* genuinely demand less personal narrative, but the author's point is hermeneutically marginalised. The procedure flags the *potential* harm (Stage 2), but resolving the tension requires tutor input (Outcome A/B).
  7.  **Replace Your Facilitator Instincts:** Your awareness of group dynamics, individual students, and past incidents is crucial context the checklist lacks. **Always trust your gut if it screams "harm" even if the checklist doesn't perfectly flag it. Override and Escalate (A).**

  **Expected Failures (Don't Try to Patch):**

  *   **False Positives:** Occasionally flagging valid critique as potentially harmful (e.g., a harsh but accurate "this is anecdotal" on a section that genuinely *is* just an irrelevant story).
  *   **False Negatives:** Missing very subtle credibility undermining or hermeneutical dismissal couched in "objective" academic language.
  *   **Over-reliance on "Stage":** In Case 3, if the substantive critique *also* subtly undermines credibility but passes Stage 1, it might get through if Stage 3 is passed. Vigilance needed.
  *   **Time Creep:** Struggling with ambiguous cases might push you over 3 minutes. **Set a hard stop:** If unresolved after 3 mins, default to **B. Return for Rewriting** with a note like "Please clarify/soften this point" or **A. Escalate**.

  This procedure makes Fricker's essential distinctions actionable quickly. It prioritises preventing harm (Stages 1 & 2) while allowing valid academic critique to pass if delivered appropriately (Stage 3). Your role as facilitator, using your judgment at the defined points, remains critical. Good luck with the workshop!
