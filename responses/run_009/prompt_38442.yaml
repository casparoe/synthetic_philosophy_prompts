prompt: |-
  I am a retired experimental physicist who has recently begun reading serious philosophy, and I have gotten stuck on the debate over vagueness. In my working life, an uncertain quantity was never an indeterminate one: a length measured as 2.3 plus or minus 0.1 millimeters was still some exact length, and the error bar described our ignorance, not the world. This background makes epistemicism about vagueness feel almost obvious to me: of course there is some exact number of grains that first makes a pile a heap, and of course we cannot know which number it is. What I cannot yet get my head around is the main alternative, supervaluationism, and in particular a persistent objection to it that I keep encountering in summaries but never see worked through.

  Please explain, at a conceptual level, the following. First, how the supervaluationist defines truth for borderline sentences: the idea that a sentence is supertrue when it comes out true under every admissible precisification of the vague term, so that a sorites premise like a clear case minus one grain still remains a clear case is true, while each individual step sentence about the borderline region comes out neither supertrue nor superfalsch. Second, the objection that this machinery does not eliminate sharp boundaries but only relocates them: every complete precisification draws an exact cutoff in the sorites series, so the supervaluationist seems to have traded one suspicious sharp line for infinitely many sharp lines plus a further vague question about which precisifications are admissible. Third, how the notion of penumbral truth and higher-order vagueness is supposed to respond to this, and whether the response ultimately succeeds or merely iterates the original problem one level up.

  Finally, since I would like to test my physicist's instincts against yours: I am tempted to model supertruth as something like a truth-value averaged over an ensemble of admissible sharpenings, the way one averages a quantity over an ensemble of measurement models in my old field, and I am equally tempted to say that if an epistemic gloss on imprecision is completely standard for physical quantities, it should be no more mysterious for predicates. Please assess whether either analogy is apt or misleading, and say where the disanalogy lies if there is one. Answer in American English, and please do not rely on citations or references; I am after the conceptual geography, not a bibliography.
reasoning: |-
  Okay, let me tackle this retired physicist's query on vagueness. He's clearly grounded in experimental science where measurement uncertainty is epistemic—error bars represent ignorance, not indeterminacy. That makes epistemicism feel natural to him: there's a sharp boundary we just can't know. His struggle is with supervaluationism and its alleged relocation of sharp boundaries. 

  First, I need to unpack supervaluationism's core move: truth as truth-under-all-admissible-precisifications. The sorites premise (losing one grain doesn't destroy heap status) is superfalse because some precisifications draw the cutoff at different points, making the premise fail somewhere. Borderline sentences? They're true in some precisifications, false in others—so neither supertrue nor superfalse. That's the "truth-value gap" aspect.

  Now, his real puzzlement is about the "relocated boundaries" objection. Every complete precisification has a sharp cutoff, so haven't we just multiplied boundaries? And worse: what makes a precisification "admissible" sounds vague itself (higher-order vagueness). Supervaluationists respond with penumbral truths (rules that hold across all sharpenings, e.g., "if something is a heap, adding a grain won't stop it being a heap") and by allowing vagueness in admissibility. But does this help? If admissibility is vague, we're back to the same problem at a meta-level—like an infinite regress of precision attempts.

  His physicist analogy is fascinating. Modeling supertruth as ensemble averaging over precisifications? It's clever but risky. In physics, averaging over models converges to an actual value; here, there's no "actual sharpening" to converge to. Worse, averaging borderline cases might suggest degrees of truth, which supervaluationism explicitly rejects (it's all-or-nothing per precisification). The epistemic analogy also stumbles: for physical quantities, the exact value exists independent of us; for supervaluationism, the sharpenings are tools, not hidden realities. 

  The key disanalogies: 
  - Physics assumes a single determinate state; supervaluationism denies it. 
  - Ensemble averages in physics track reality; here, precisifications are counterfactual. 
  - "Admissible" isn't a statistical constraint but a semantic one, governed by usage norms that may themselves be vague.

  Ultimately, his instinct that epistemicism is simpler isn't wrong—but supervaluationism's appeal is preserving truth-value gaps without metaphysical indeterminacy. Whether its higher-order moves solve or postpone the boundary problem? I lean toward "postpone." The core tension remains: can language avoid sharp cuts if the world demands them? His measurement analogy actually highlights why epistemicism feels inevitable to a scientist: if every length is exact, why wouldn't "heap" have an exact threshold? 

  I'll structure the reply to validate his intuitions while dissecting where philosophy diverges. The physics analogies are insightful but map imperfectly—partly because supervaluationism isn't about ignorance but about meaning underdetermination. And that underdetermination might be infinitely regressive, which isn't a problem he faced with error bars.
answer: |-
  Let's break this down conceptually, starting with supervaluationism and then addressing your physicist's instincts.

  ### 1. **Supervaluationism Basics**
     - **Core Idea**: Vague predicates (like "heap" or "bald") lack a single precise meaning. Instead, there are many ways to "sharpen" them into precise definitions ("precisifications"), all consistent with how we use the term.  
     - **Supertruth**: A sentence is **supertrue** if it’s true under *every* admissible precisification. It’s **superfalse** if false under every one. If it’s true in some but false in others, it’s **neither** (a truth-value gap).  
     - **Sorites Example**:  
       - Premise: "If 10,000 grains are a heap, then 9,999 grains are a heap."  
       - This is **superfalse**: Some precisifications set the heap cutoff at 10,000 grains (making the premise false for 9,999), while others set it lower. Since it fails in *some* precisifications, it’s not true in *all*, so it’s not supertrue—in fact, it’s superfalse.  
       - Borderline Claim: "5,000 grains are a heap."  
         - True in some precisifications (those setting cutoff ≤5,000), false in others (cutoff >5,000). So it’s **neither supertrue nor superfalse**.

  ### 2. **The "Relocated Boundaries" Objection**
     - **The Problem**: Every *complete* precisification has a sharp cutoff (e.g., "heap = exactly ≥N grains"). Supervaluationism avoids a *single* boundary in the world, but now has:  
       - Infinitely many sharp cutoffs (one per precisification).  
       - A new vague boundary: **which precisifications are "admissible"**?  
         - Example: A precisification claiming "1 grain is a heap; 0 is not" is *inadmissible*—it violates how we use "heap." But where exactly does "admissible" start/end?  
     - **The Charge**: This doesn’t solve vagueness—it just shifts the sharp boundary from the object-level (grains → heaps) to the meta-level (precisifications → admissible precisifications).  

  ### 3. **Penumbral Truth & Higher-Order Vagueness**
     - **Penumbral Truth**: Rules that hold *across all admissible precisifications*, capturing "conceptual connections."  
       - Example: "If something is a heap, adding one grain won’t make it *not* a heap." True in every precisification, so **supertrue**—even though no precisification has a cutoff where this fails.  
       - *This preserves intuitive logical links while allowing vagueness*.  
     - **Higher-Order Vagueness**: The set of "admissible precisifications" itself has borderline cases.  
       - Just as "heap" has clear cases (10,000 grains), borderline (5,000), and clear non-heaps (1 grain), "admissible precisification" has:  
         - Clear cases (precisifications respecting typical "heap" usage).  
         - Borderline cases (e.g., a precisification setting the cutoff at 100 grains—plausible but debatable).  
         - Clear inadmissible cases (e.g., "heap = only 10,000 grains exactly").  
       - **The Response**: Supervaluationism can iterate—truth for "admissible" is defined via *super*-admissible precisifications (and so on), avoiding a sharp meta-boundary.  
     - **Does This Succeed?**  
       - **Optimist View**: Higher-order vagueness reflects reality—language is *radically open-textured*, with no sharp lines at any level.  
       - **Pessimist View**: This regresses infinitely. If "admissible" is vague, we need another supervaluationist layer, ad infinitum. Worse, at **any fixed level**, boundaries reemerge.  
       - *Verdict*: Supervaluationism *postpones* but arguably doesn’t *eliminate* sharp boundaries. It exchanges a single objectionable cutoff for a hierarchy of vagueness—which some find illuminating, others unsatisfying.

  ---

  ### 4. **Testing Your Physicist’s Instincts**
  Your analogies are insightful but need refinement:

  - **Analogy 1: Supertruth as Ensemble Averaging**  
    - **Aptness**: Yes—like averaging over measurement models, supertruth aggregates over all "admissible worlds" (precisifications). Both define a robust "core truth" resilient to variations.  
    - **Disanalogy**:  
      - In physics, the ensemble converges to an **actual value** (e.g., the true length *exists*, independent of models).  
      - In supervaluationism, there’s **no "true" precisification**. The average isn’t tracking reality but *consistency* with usage. A sentence like "5,000 grains is a heap" has no fact of the matter—it’s not "approximately true" but *indeterminate*.  
    - **Key Difference**: Physics assumes determinacy obscured by noise; supervaluationism denies determinacy entirely for vague predicates.

  - **Analogy 2: Epistemic Gloss for Physical vs. Predicate Vagueness**  
    - **Aptness**: Your epistemicist leanings make sense! If every length is exact, why not every "heap" threshold? Both treat ignorance as the source of uncertainty.  
    - **Disanalogy**:  
      - Physical quantities (e.g., length) have **independent verification methods** (e.g., better instruments reduce error bars).  
      - For predicates like "heap," **no such verification exists**—disagreeing experts won’t converge, and borderline cases resist resolution.  
      - Supervaluationists argue this shows vagueness isn’t *just* ignorance: it’s **semantic underdetermination** (language doesn’t fix a cutoff).  
    - **Tension**: If you insist all properties are exact (like length), epistemicism wins. But if you think "heap" *lacks* an exact boundary (not just unknown), supervaluationism captures that intuition better.

  ---

  ### **Bottom Line**
  - **Epistemicism** fits your worldview: exact boundaries exist but are unknowable (like a quantum state before measurement). Simple, but clashes with intuition that "heap" *can’t* have a sharp cutoff.  
  - **Supervaluationism** avoids sharp boundaries by making truth dependent on all coherent sharpenings. But it "relocates" vagueness to *admissibility*, leading to regress.  
  - **Your Analogies**:  
    - The ensemble average captures supertruth’s "overlap" idea but misleads by implying an underlying exact value.  
    - Epistemicism for physical quantities is solid, but predicates like "heap" lack the same ontological footing—they’re defined by use, not measurement.  

  **Final Thought**: As a physicist, you might prefer epistemicism’s realism. But supervaluationism’s strength is handling penumbral truths (e.g., "adding a grain can’t destroy a heap"), which feel *necessarily true* without committing to exactness. Neither fully escapes the sorites—but that’s why vagueness remains a beast.
