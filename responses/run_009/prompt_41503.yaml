prompt: |-
  I'm on my town's charter review committee and I've realised my instincts about who should get a vote are kind of all over the place, so I want to figure out if there's actually a principle underneath them. Here are my gut calls, going case by case.

  Permanent residents vote, obviously. Tourists passing through don't. Second-home owners who pay property tax but are only there six weeks a year: no, even though they're taxed — no representation for them, sorry. Undocumented immigrants who've lived and worked in town for a decade: yes, definitely. Prisoners from our town incarcerated two hundred miles away: yes. Commuters who work in town five days a week but sleep somewhere else: no, zoning here isn't really theirs to decide. Sixteen-year-olds who'll live with the consequences longer than anyone: I keep flip-flopping. And citizens of the country who've lived abroad for twenty years should still get to vote in national elections — I'm confident about that one, mail-in ballots and all.

  Oh and I've heard some places actually let businesses vote in local elections, which strikes me as completely wrong, but I can't fully say why, since I did just say taxpayers without residency should maybe get... hmm, no, I said they shouldn't. Fine.

  My tentative principle is something like "you belong to the vote if you're affected by the decision," but that can't be right, because the commuters and the second-home owners are clearly affected by, say, a big zoning change, and I still want to say no to them. Meanwhile the prisoners are barely affected day-to-day and I say yes. So maybe it's about being subject to the laws? But then tourists are subject to our laws while they're here, and that's absurd.

  So: is there a principle that gets all of these, or close to it? If there are a couple of candidate principles that each fit some of my verdicts, tell me what they are and what each one says about the new cases coming up on our committee's agenda — a regional referendum on a lithium mine where the mine's water usage would hit farmers in a whole different county, and whether to let the residents of a long-term care facility in town who have advanced dementia cast ballots with a family member assisting. And be honest with me about which of my verdicts has to go if you can't save them all — I'd rather know now than mid-meeting.
reasoning: |-
  Okay, let's start by understanding the user's problem. They're on a charter review committee and need a consistent principle for voting eligibility. Their gut reactions vary: permanent residents yes, tourists no, undocumented long-term residents yes, prisoners yes, but commuters and part-time residents no. Also, 16-year-olds and expats are tricky. They mention businesses voting feels wrong but can't articulate why.

  First, I need to find a principle that ties these together. The user tried "affected by decisions" but saw flaws—commuters are affected but excluded. "Subject to laws" includes tourists, which they reject. So those don't work.

  Looking at their yeses: permanent residents, undocumented with long-term stay, prisoners from town. All share a deep, enduring connection to the community. The nos: tourists, commuters, second-home owners. These are more transient or lack full integration. Even though second-home owners pay taxes, they're not there long-term. Commuters contribute economically but aren't rooted.

  So "enduring stake in the community's future" seems key. It's about long-term interdependence, not just temporary impact. Prisoners retain residency ties, hence included. Undocumented residents, despite status, are embedded in daily life. Expats maintain citizenship ties, so they vote nationally.

  Now, the edge cases. Sixteen-year-olds: they have a future stake but lack full legal autonomy. The user flip-flops here. The principle might exclude them due to legal capacity, but the user's ambivalence suggests tension. Businesses: they're entities, not people with lived experience. Voting is personal, so excluding them aligns even if they pay taxes.

  Testing the principle on new cases. Lithium mine referendum: farmers in another county are affected but not part of the community making the decision. Enduring stake applies locally, so exclude. Dementia patients: they are residents with a stake, but capacity is an issue. Ensuring assisted voting respects their belonging without coercion.

  Possible conflicts: The user included prisoners but excluded commuters. Both are away, but prisoners can't choose to leave; their ties are enforced. Commuters opt out of community life. That distinction holds. Undocumented immigrants are included, which might be contentious, but fits the principle of embeddedness.

  If forced to drop a verdict, the 16-year-olds might be the sticking point. If legal adulthood is the norm, including them contradicts, but the principle of future stake could support it if the community accepts. Alternatively, the user might need to accept that minors are exceptions due to capacity.

  Honesty check: The user values belonging and rootedness. Their rejections of second-home owners despite taxes show community ties trump financial contributions. Businesses voting feels wrong because it's impersonal, reinforcing that voting is for individuals with personal stakes.

  In conclusion, the enduring stake principle covers most cases. For dementia patients, inclusion with safeguards. For the mine, exclusion of other counties. Sixteen-year-olds remain debatable but defensible under future stake. The user might need to resolve this based on local consensus.
answer: |-
  Based on your gut calls, the principle that best unifies your judgments isn't just "affected" or "subject to laws," but **"Enduring, Resident-Based Stake in the Community's Collective Future."** This emphasizes deep, long-term integration into the life of the town, where one's core identity and long-term well-being are intertwined with the community's trajectory, regardless of legal status or temporary location. It prioritizes lived experience and fundamental dependence over transient presence, financial contribution alone, or mere legal obligation.

  Here's how it explains your verdicts:

  1.  **Permanent Residents:** Yes. *Core case.* Deeply embedded, live the consequences daily, future tied to the town.
  2.  **Tourists:** No. Transient presence. No enduring stake or integration.
  3.  **Second-Home Owners (6 weeks/year):** No. Financial stake (taxes), but minimal residency, integration, and lived experience. Their primary life and future are elsewhere. Taxes alone aren't sufficient for "belonging."
  4.  **Undocumented Immigrants (10+ years):** Yes. Deeply embedded through long-term residency, work, and lived experience. Their daily life and future are fundamentally tied to the town, regardless of legal status. They *belong*.
  5.  **Prisoners (From Town):** Yes. *Residency persists.* Their legal "home" is still the town; they may return; family/connections remain there. Their future is still tied to it, even if current circumstances isolate them.
  6.  **Commuters:** No. Contribute economically but lack residency and integration into the *lived community* beyond work. Their home life, family, and primary civic identity are elsewhere. Zoning impacts their workplace, but not their fundamental home or future.
  7.  **16-Year-Olds:** Flip-flop *explained.* They have an *enduring stake* in the future (strong "yes" argument), but lack full legal autonomy/responsibility and are typically not considered fully independent members of the civic body (strong "no" argument). Your flip-flop reflects this genuine tension within the principle. Do we prioritize the future stake or current legal/social independence? (More below).
  8.  **Citizens Abroad (National):** Yes. *National principle differs.* Citizenship itself creates an enduring stake in the nation's future. They remain part of the national "resident" body (citizenry) even if physically absent. Mail-in ballots facilitate this.
  9.  **Businesses Voting:** No. Explains your revulsion. Businesses are entities, not people with lived experience and personal futures tied to the community. They have financial interests, but lack the *human, resident-based stake* in the collective future. Voting is a personal, human right tied to belonging, not a property right.

  **Why "Affected" or "Subject to Laws" Fails:**
  *   **Affected:** Too broad. Commuters, second-home owners, even tourists *are* affected by many decisions (zoning, taxes, road closures). You exclude them, prioritizing *residency-based belonging* over mere impact.
  *   **Subject to Laws:** Also too broad. Tourists *are* subject to laws while present. You exclude them, showing the principle is about *enduring membership*, not temporary legal obligation.

  **Applying the Principle to New Cases:**

  1.  **Regional Lithium Mine Referendum (Water impact on farmers in another county):**
      *   **Principle Suggests:** Farmers likely **should not vote** in *your town's* referendum. While they are profoundly *affected* by the water usage, their enduring stake and residency are in a *different county*. They belong to *that* community's collective future, not yours. The decision should be made by those whose enduring home and community future are directly tied to the location of the mine and the primary jurisdiction making the decision (likely your town/county). The farmers' recourse should be through their *own* local government or regional bodies representing affected counties, not your town's vote. *Verdict: Aligns with your instinct to exclude commuters/second-home owners.*

  2.  **Long-Term Care Facility Residents with Advanced Dementia (Assisted Voting):**
      *   **Principle Suggests:** **Yes, they should be able to vote with assistance.** They are permanent residents whose enduring stake in the community was established and persists. Their illness doesn't erase their belonging or their fundamental stake in the town's future. Assisted voting respects their resident status and enduring membership. Safeguards (like clear protocols for assistance to prevent coercion and ensure the vote reflects the resident's known wishes/values as much as possible) are crucial, but exclusion based solely on diminished capacity violates the core idea of belonging based on residency and stake. *Verdict: Aligns with including prisoners (residency persists despite circumstance) and undocumented long-term residents (belonging based on embeddedness).*

  **Addressing the Tension Points (What Might Have to Give):**

  The "Enduring Stake" principle covers most of your judgments remarkably well. The main tension is:

  *   **16-Year-Olds:** Your principle strongly supports their inclusion due to their undeniable *enduring stake* in the future. If you maintain your "no" or flip-flop, you are likely importing an *external* principle: **Legal Capacity/Full Citizenship Responsibility.** This principle prioritizes adulthood as the threshold for bearing the full rights and responsibilities of civic participation (e.g., jury duty, legal contracts). To be consistent with your other "yes" verdicts (especially undocumented residents and prisoners), you need to decide:
      *   **Option 1 (Stick with Enduring Stake):** Support voting at 16. Their future stake is paramount. Their residence and integration are usually clear.
      *   **Option 2 (Introduce Capacity Threshold):** Acknowledge this as an exception based on the societal/legal norm of adulthood defining full civic capacity. This *slightly* weakens the purity of "enduring resident stake" but reflects a common societal boundary. *You cannot logically exclude 16-year-olds based solely on "stake" while including other resident groups with complex circumstances (undocumented, prisoners).*

  **Conclusion:**

  Your strongest underlying principle is **"Enduring, Resident-Based Stake in the Community's Collective Future."** It explains nearly all your gut calls:
  *   **Yes:** Permanent residents, long-term undocumented residents, town prisoners, expat citizens (nationally).
  *   **No:** Tourists, commuters, second-home owners, businesses.
  *   **Tension Explained:** 16-year-olds highlight the conflict between future stake and societal norms of capacity/responsibility.

  This principle clearly handles the new cases:
  1.  **Lithium Mine:** Farmers from another county - No vote in *your* referendum (different enduring community).
  2.  **Dementia Patients:** Yes, with assisted voting safeguards (residency and stake persist).

  **Recommendation:** Embrace the "Enduring, Resident-Based Stake" principle. For 16-year-olds, decide consciously whether future stake trumps the capacity threshold in your community's context – be prepared to defend either choice as a deliberate policy balancing act, recognizing the slight tension it introduces. This principle provides a robust, defensible foundation for your committee's deliberations grounded in your core intuitions about belonging.
