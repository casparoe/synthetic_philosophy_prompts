  write me a sestina. the trick i want is that the six repeating end-words are exactly the words you can't paraphrase away — 'experience', 'what it's like', 'seems', that family — so the form keeps regenerating the problem just as the speaker tries to deflate it. the speaker should be someone sympathetic to illusionism trying to give the deflationary story about where our 'hard problem intuitions' come from, and finding the vocabulary pulling them back in every stanza. please don't caricature illusionism — it's a real position and i want it rendered fairly — but the poem can dramatise the pull of the very words it has to use. someone who knows the meta-problem literature should find the poem right, and my students should find it a good poem full stop.

