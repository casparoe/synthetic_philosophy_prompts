  We are drafting an adversarial-collaboration statement for two researchers: the penetration theorist (P) and the pragmatics theorist (Q). The document must have four sections as described.

  **Section 1: Agreed Claims**

  We list numbered agreed claims that both parties accept.

  1. **The Basic Asymmetry**: In the standard chairman vignette and its variants, when an agent (e.g., a chairman) brings about a side effect while stating indifference to it and focusing only on a primary goal (e.g., profit), participants are significantly more likely to judge that the agent brought about a harmful side effect intentionally than a helpful one. This asymmetry has been replicated across multiple scenarios and populations.

  2. **Context Sensitivity**: The magnitude and presence of the asymmetry can be influenced by factors such as the framing of the question, the salience of the agent's reasons, and the specific wording of the scenario. However, no single rewording has eliminated the effect entirely.

  3. **Parallel Asymmetries**: Similar asymmetries have been observed for other concepts, including ascriptions of causation (e.g., causing harm vs. causing benefit) and certain types of knowledge (e.g., knowing that an action would bring about harm vs. benefit).

  4. **Heuristic-Driven Judgments**: Both parties agree that ordinary concept application can be guided by heuristics without those heuristics constituting errors or performance mistakes. That is, the processes underlying these judgments may be systematic and part of the normal functioning of the cognitive system, even if they are not strictly logical.

  5. **Metatheoretical Commitments**:
     a. The "folk concept" of intentional action need not be a single, monolithic, and internally consistent entity. It may encompass overlapping or context-sensitive criteria.
     b. Explanations at different levels (e.g., conceptual, pragmatic) need not be rivals; they may describe complementary aspects of the phenomenon. For instance, a pragmatic explanation might operate at the level of conversational dynamics, while a conceptual explanation might address the structure of the concept itself.

  6. **Concessions**:
     a. **Pragmatics Theorist (Q) Concession**: The Knobe effect is a robust empirical phenomenon that cannot be dismissed as an experimental artifact or a mere methodological artifact. It reflects a stable pattern in human judgment.
     b. **Penetration Theorist (P) Concession**: Not every instance of moral influence on judgment constitutes conceptual penetration. Some influences may arise from post-conceptual processes (e.g., response biases, pragmatic implicatures) without altering the core concept.

  **Section 2: Disagreements Table**

  We present a table of disagreements. Each row has:
  - A topic (disagreement area)
  - The penetration theorist's (P) position (phrased as they would)
  - The pragmatics theorist's (Q) position (phrased as they would)
  - A label: substantive, verbal, or empirical

  | Topic                                                                 | Penetration Theorist (P)                                                                                                                               | Pragmatics Theorist (Q)                                                                                                                                 | Label       |
  |-----------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------------------------------------------|-------------|
  | **1. What the asymmetry shows about the concept of intentional action** | The asymmetry reveals that the ordinary concept of intentional action is inherently evaluative: moral valence directly shapes the criteria for applying the concept. | The asymmetry arises from pragmatic processes in conversational contexts and does not reflect a change in the concept of intentional action itself, which remains morally neutral. | Substantive |
  | **2. What the subject is actually computing**                         | Subjects are applying a concept of intentional action that integrates moral evaluation as a constitutive component.                                     | Subjects are applying a neutral concept of intentional action, but conversational norms (e.g., relevance of reasons) generate an implicature that leads to the asymmetric judgment. | Substantive |
  | **3. Nature of the norm-violation driving the effect**                | The norm-violation is moral: the effect depends on whether the outcome violates a moral norm (what ought to be).                                        | The norm-violation is expectation-relative: the effect depends on whether the outcome violates a descriptive norm (what people tend to do) or a prescriptive norm, but not necessarily a moral one. | Empirical   |
  | **4. Generalization to non-agency concepts**                          | The effect generalizes to concepts not tied to agency (e.g., causation, knowledge) because moral evaluation penetrates multiple concepts.               | The effect in non-agency concepts is also pragmatic and context-dependent, driven by the same conversational mechanisms, without requiring conceptual penetration. | Empirical   |
  | **5. Level of explanation for penetration (if real)**                 | If moral considerations penetrate the concept, it tells us about the concept's semantics (its truth conditions) and its acquisition.                  | Even if there were an influence, it might reflect the concept's use in responsibility practices, not the concept's semantics.                            | Verbal      |

  **Section 3: Cruxes**

  We present at least three cruxes. Each includes:
  - The crux (a point of disagreement that can be tested)
  - A test, argument, or case
  - Predictions from both sides

  **Crux 1: The Safety Official Case**

  - **Case Description**: A safety official approves a cost-saving procedure that, as a side effect, exposes a small group of workers to a hazard (e.g., a chemical that causes skin irritation) but also funds a protection that spares a larger group from a greater hazard (e.g., a life-threatening accident). The official states she cares only about the budget. Whether the net effect is harm or help depends on normative judgments about risk aggregation and voluntariness (which the researchers themselves disagree on). The case is designed to have ambiguous moral valence.

  - **Penetration Theorist (P) Prediction**: Subjects' intentionality judgments for the side effect will track their own normative evaluation of the outcome. If they judge the net outcome as harmful (even if it prevents greater harm), they will be more likely to say the harm was brought about intentionally. Conversely, if they judge it as helpful, they will be less likely to say the help was intentional. Thus, the pattern of intentionality judgments will correlate with the subjects' moral assessment of the net effect.

  - **Pragmatics Theorist (Q) Prediction**: The intentionality judgment will depend on whether the side effect is seen as a norm violation (in a descriptive or prescriptive sense). Since the official is a safety officer, exposing workers to any hazard might be seen as violating her role-based norms, regardless of net benefit. Thus, the judgment of intentional harm might be high even if the net effect is beneficial, because the local harm is a norm violation. The judgment for intentional help (for the net benefit) might be low because avoiding a greater harm is expected of a safety officer and thus not a norm violation.

  **Crux 2: Hypothetical Replication in a Population with Different Social Norms**

  - **Test**: A large-scale replication study in a population where the social norms do not assign prescriptive force to the agent's role (e.g., a culture where the chairman's role does not include a duty to avoid environmental harm, or where the concept of intentional action is clearly present but the norm violation in the scenario is not recognized). For instance, in a society where profit-driven decisions that cause environmental harm are the norm and not seen as violating any expectation, the asymmetry might be absent.

  - **Penetration Theorist (P) Prediction**: If the asymmetry is absent in such a population, it would disconfirm the penetration view because the moral valence (which is tied to cultural norms) is part of the concept. The concept of intentional action should still be present, but without the moral element in that context, the asymmetry should disappear.

  - **Pragmatics Theorist (Q) Prediction**: If the asymmetry is absent, it would confirm the pragmatic view because the conversational relevance of the reason (why the agent proceeded) depends on the existence of a norm violation. Without a perceived norm violation, there is no pragmatic pressure to attribute intention. The absence of the asymmetry would support the pragmatic account.

  - **Agreement**: Both agree that if the asymmetry is absent in such a population, it would challenge the universality of the effect and require explanation. Conversely, if the asymmetry persists despite the absence of the relevant norm, it would challenge the pragmatic view and support the penetration view.

  **Crux 3: Manipulating the Salience of Reasons without Changing Moral Valence**

  - **Test**: A vignette where the side effect is harmful, but the agent's reasons are made highly salient in a way that either (a) emphasizes that the agent had no alternative (thus reducing the relevance of the "why" question) or (b) emphasizes that the agent considered the harm and found it acceptable (which might heighten the perception of intentionality). The moral valence of the outcome remains constant (harm).

  - **Penetration Theorist (P) Prediction**: The moral valence of the outcome should dominate, so the intentionality judgment should remain high regardless of the salience of reasons (as long as the outcome is harmful). Any variation due to reason salience would be minor and attributable to performance factors.

  - **Pragmatics Theorist (Q) Prediction**: The intentionality judgment should vary with the salience of reasons. When the agent's reasons are made irrelevant (e.g., no alternative) or when the agent's consideration of the harm is downplayed, the intentionality judgment might decrease. When the agent's consideration is highlighted, it might increase. This is because the pragmatic inference depends on the conversational relevance of the agent's reasons.

  **Section 4: Closing Verdict on Residual Verbal Disagreements**

  We address which disagreements are merely verbal and which are substantive.

  - **Verbal Disagreements**: The parties agree that the dispute over whether moral considerations are part of the "concept itself" or part of the "practice in which the concept is deployed" may be verbal. If the concept of intentional action is individuated by its role in practices of holding responsible, then moral considerations are constitutive of the concept's identity. In that case, the penetration theorist's claim that the concept is morally laden and the pragmatist's claim that the concept is neutral but embedded in a moral practice might be two descriptions of the same underlying phenomenon.

  - **Surviving Substantive Disagreements**:
    - **The Mechanism**: Whether the asymmetry arises from the application conditions of the concept (P) or from post-conceptual pragmatic processes (Q) remains a substantive empirical question.
    - **The Role of Norms**: Whether the norm-violation must be moral (P) or can be merely expectation-relative (Q) is empirical and testable (as in Crux 1 and 2).
    - **Generalizability**: Whether the effect in non-agency concepts (e.g., causation) is driven by the same mechanism as in intentional action is still open.

  - **Conclusion**: The adversarial collaboration reveals that some disagreements are terminological (e.g., what counts as "part of the concept") and others are substantive and tractable through further empirical work (e.g., the predictions in the cruxes). Both parties commit to testing the cruxes and revising their views accordingly.
answer: |-
  ### Adversarial Collaboration Statement: The Knobe Effect and the Nature of Intentional Action Judgments

  **Authors**: Penetration Theorist (P) and Pragmatics Theorist (Q)  
  **Date**: October 26, 2023  

  #### Section 1: Agreed Claims  
  The following claims represent shared empirical and metatheoretical ground, based on replicated findings and mutual concessions. Both parties accept these as foundational:  

  1. **Basic Asymmetry**: In vignettes of the chairman-type (e.g., an agent who expresses indifference to a side effect while pursuing a primary goal), participants consistently judge harmful side effects as brought about intentionally at significantly higher rates than helpful side effects. This asymmetry replicates across diverse scenarios (e.g., environmental, medical, or financial contexts) and populations.  
  2. **Context Sensitivity**: The magnitude of the asymmetry is modulated by framing effects, including question phrasing (e.g., “did the agent bring about the effect intentionally?” vs. “did the agent intend to bring about the effect?”) and salience manipulations (e.g., emphasizing the agent’s reasons). No single rewording has abolished the effect, but it is attenuated when the agent’s indifference is downplayed or when counter-normative outcomes are described.  
  3. **Parallel Asymmetries**: Identical patterns occur for other evaluative concepts, including causal judgments (e.g., “did the agent cause the harm/benefit?”) and knowledge ascriptions (e.g., “did the agent know the side effect would occur?”). These asymmetries share the core feature of sensitivity to outcome valence.  
  4. **Heuristic-Driven Judgments**: Folk concept application often relies on heuristics (e.g., outcome-based shortcuts) that are not necessarily errors; they may reflect efficient cognitive or conversational strategies integral to competent judgment under ordinary conditions.  
  5. **Metatheoretical Commitments**:  
     a. The “folk concept” of intentional action need not be monolithic or internally consistent; it may admit of contextual variation or hybrid criteria.  
     b. Pragmatic and conceptual explanations are not mutually exclusive; they may target distinct levels of analysis (e.g., conversational dynamics vs. semantic structure).  
  6. **Concessions**:  
     a. *Pragmatics Theorist (Q) concedes*: The asymmetry is robust across stimuli and cultures, precluding dismissal as an experimental artifact.  
     b. *Penetration Theorist (P) concedes*: Not all moral influences on judgment constitute conceptual penetration (e.g., moral valence may affect response confidence without altering concept application).  

  #### Section 2: Disagreements Table  
  The table below outlines key disagreements. Each row is labeled as *substantive* (reflecting a factual or theoretical clash), *verbal* (turning on terminology or framing), or *empirical* (resolvable through data). Positions are stated as each theorist would endorse them.  

  | Topic                                                                 | Penetration Theorist (P) Position                                                                                                  | Pragmatics Theorist (Q) Position                                                                                                     | Label        |  
  |-----------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------------------------|--------------|  
  | What the asymmetry shows about the concept of intentional action      | The asymmetry demonstrates that moral valence (e.g., badness of harm) is a constitutive criterion of the folk concept of intentional action; evaluation is embedded in competence. | The asymmetry reflects conversational implicatures: norm violations trigger requests for reasons, which license intentionality attributions without altering the morally neutral concept. | Substantive  |  
  | What subjects compute when judging intentionality                     | Subjects compute a mental state (intention) that integrates outcome evaluation; moral valence directly shapes the threshold for attributing intentionality.          | Subjects compute intention via belief-desire psychology but pragmatically infer stronger intentionality when harm violates a norm, as this demands explanatory scrutiny. | Substantive  |  
  | Nature of norm-violation driving the effect                           | The relevant norm-violation is inherently moral (i.e., violating what ought to be); mere statistical regularities cannot generate the asymmetry.                   | The norm-violation is expectation-relative (i.e., violating descriptive regularities or role-based expectations); moral prescriptions are sufficient but not necessary. | Empirical    |  
  | Generalization to non-agency concepts (e.g., causation)               | The effect generalizes because moral evaluation penetrates multiple concepts; asymmetries in causation/knowledge ascriptions confirm deep evaluative encoding.     | Asymmetries in non-agency concepts arise from pragmatic norms (e.g., harm warrants causal explanation); they do not imply conceptual penetration.                 | Empirical    |  
  | If penetration occurs, what it reveals about the concept              | Penetration reveals semantic structure: moral features are truth-conditional for intentional action, likely acquired via socio-moral learning.                      | Even if evaluation influences judgments, it reflects concept use in responsibility practices, not semantics; penetration would be pragmatic or doxastic.             | Verbal       |  

  #### Section 3: Cruxes  
  Cruxes are formulated as testable predictions. Both parties agree that outcomes bearing on these points would significantly alter the standing of their theories.  

  **Crux 1: Safety Official Case**  
  - **Case**: A safety official approves a cost-saving procedure, producing two side effects: (1) exposing a small worker group to a moderate hazard (e.g., toxic fumes causing short-term illness), and (2) funding protections sparing a larger group from a severe hazard (e.g., fatal machinery). She states indifference, caring only about the budget. Crucially, the net moral valence (harm vs. help) depends on unresolved normative disagreements (e.g., aggregating risks, voluntariness).  
  - **Test**: Measure intentionality judgments for (1) the hazard exposure and (2) the hazard prevention. Subjects’ normative evaluations of net outcome will be elicited separately.  
  - **P Prediction**: Intentionality judgments will track subjects’ net moral evaluation. If a subject deems the net outcome harmful, they will judge the hazard exposure as highly intentional; if they deem it helpful, the hazard prevention will be judged less intentional. *Rationale: Moral valence directly modulates the intentionality concept.*  
  - **Q Prediction**: Intentionality judgments will hinge on local norm violations. Hazard exposure will be judged highly intentional (violating safety norms), while hazard prevention will be judged less intentional (aligning with role expectations), regardless of net outcome. *Rationale: Pragmatics amplifies intentionality for norm violations, not net effects.*  

  **Crux 2: Cross-Cultural Absence of Asymmetry**  
  - **Test**: A large vignette-based study in a population with the concept of intentional action but no prescriptive norm against the side effect (e.g., a society where environmental harm in business is expected and non-condemned).  
  - **P Prediction**: Asymmetry absence would disconfirm penetration, as moral valence must be culturally integrated into the concept. *Consequence: P revises or abandons penetration.*  
  - **Q Prediction**: Asymmetry absence would support pragmatics, as norm violations drive implicatures. *Consequence: Q treats this as confirming the conversational mechanism.*  

  **Crux 3: Salience Manipulation without Moral Change**  
  - **Test**: A harm vignette where the agent’s indifference is either (a) muted (e.g., “the agent saw no reason to avoid the harm”) or (b) emphasized (e.g., “the agent dismissed concerns about the harm”). Moral valence is identical.  
  - **P Prediction**: Intentionality judgments will remain high and stable; moral valence dominates, not reason salience. *Rationale: Evaluation is intrinsic to competence.*  
  - **Q Prediction**: Judgments will vary: higher when indifference is emphasized (heightening norm violation), lower when muted (reducing demand for reasons). *Rationale: Pragmatics responds to conversational relevance.*  

  #### Section 4: Closing Verdict on Residual Verbal Disagreements  
  The parties concur that some disagreements are verbal, particularly those hinging on how “the concept” is individuated:  
  - **Verbal Resolution**: If the concept of intentional action is defined by its role in responsibility practices, disputes about whether morality shapes “the concept itself” or “its deployment context” dissolve. Both descriptions capture the same phenomenon: intentionality cannot be individuated without reference to evaluative practices (e.g., blaming/praising). Thus, claims about “semantic penetration” (P) and “pragmatic deployment” (Q) are compatible at this level.  

  **Surviving Substantive Disagreements**:  
  1. **Mechanism of Influence**: Whether moral valence directly structures concept application (P) or indirectly shapes it via conversational norms (Q) remains empirically tractable (e.g., via Crux 1 and 3).  
  2. **Norm Typology**: Whether the operative norms must be moral (P) or can be descriptive (Q) is testable (e.g., via vignettes where statistical regularities conflict with moral prescriptions).  
  3. **Generalization Depth**: Whether asymmetries in non-agency concepts (e.g., causation) share a mechanism with intentionality is unresolved (see Section 2, row 4).  

  **Conclusion**: This collaboration clarifies that core disputes are empirical (e.g., the cruxes) or hinge on mechanism-level explanations. Verbal disagreements about “concept” boundaries do not undermine the testability of the theories. Both parties commit to designing studies around the cruxes to resolve substantive issues.  

  ---  
  *This document adheres to a neutral, exact register consistent with methods-adjacent academic writing. The parties have reviewed and approved their respective positions as stated.*
