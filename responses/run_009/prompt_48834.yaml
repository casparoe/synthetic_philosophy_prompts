  **Joint Statement on the Doomsday Argument**

  We, the undersigned, having engaged in an adversarial collaboration, present the following points of agreement and disagreement.

  **I. Points of Agreement**

  1. **Bayesian Framework**: Our disagreement is located within the Bayesian framework. We agree that the dispute is about the choice of prior probabilities and the correct way to condition on the available evidence, not about any error in the application of Bayes' theorem.

  2. **Exact Past Births**: The exact number of humans born to date (approximately 100 billion) is not critical to the formal structure of the argument. The logic of the argument would apply for any number of past births.

  3. **Ramifications to Other Anthropic Puzzles**: Our respective positions on the Doomsday Argument have implications for other anthropic puzzles, including:
     - **Sleeping Beauty**: The Carterian position typically aligns with the "thirder" solution (that upon waking, Beauty should assign 1/3 probability to the coin having landed heads), while the Self-Indicationist position typically aligns with the "halfer" solution (1/2). However, we both recognize that the analogy is contested and not direct.
     - **Fine-Tuning**: The Carterian position suggests that fine-tuning evidence for life is less surprising under many-universe hypotheses (because we are more likely to observe a fine-tuned universe regardless of their rarity). The Self-Indicationist position holds that we should update in favor of hypotheses that predict more observers, making fine-tuning stronger evidence for a multiverse.

  4. **Empirical Modesty**: Neither position licenses a precise, testable prediction of doom over the near term (e.g., the next century). The argument concerns the long-run distribution of human observers and is not directly testable against short-term demographic data.

  **II. Disagreements**

