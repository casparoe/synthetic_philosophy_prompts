  | **Reference Class** | The Doomsday Argument requires specifying a reference class (e.g., humans) and is robust to reasonable choices (e.g., humans, mammals, or conscious beings). Widening or narrowing the class within plausible bounds does not eliminate the doomsday shift. | The Doomsday Argument relies on an arbitrary choice of reference class. The conclusion is sensitive to this choice: widening (e.g., to all mammals) can eliminate or reverse the shift, and without a principled way to fix the class, the argument fails. | **Mars Colony**: A future Mars colony is established. We consider two reference classes: (1) Earth humans only and (2) all humans (Earth and Mars). Given a birth rank of ~100 billion (on Earth), update on total humans (small: <1T, large: 10T). | The doomsday shift (toward small total) will be present in both classes, though stronger in (1). | In class (2), if the Mars colony is large and one is born on Earth, the shift may not occur (if Earth ranks are early in the entire class) or may reverse. |
  | **Evidence: Existence vs. Birth Rank** | The relevant evidence for updating is one's birth rank. The fact of existence is not separate evidence because it is entailed by having a birth rank. Thus, conditioning on birth rank alone is sufficient. | The evidence we possess is that we exist. Conditioning on existence favors hypotheses with more observers. The Carterian approach conditions twice: on existence (by requiring an observer at that rank) and again on the rank. | **Doomsday Coin Flip**: Two hypotheses: H1 (total humans = 100B) vs. H2 (total humans = 100T). Prior odds 1:1. We are the 100 billionth human. Update. | Posterior: P(H1)/P(H2) = 1 / 0.001 = 1000:1. | Posterior: P(H1)/P(H2) = (1 * 1) / (1000 * 0.001) = 1:1. |
  | **Sampling Assumption** | The sampling assumption (that birth rank is a random sample) is necessary for making probabilistic inferences about the total number of humans. Without it, we cannot use birth rank for prediction. | The sampling assumption is redundant because the self-indication prior (higher probability for more observers) already accounts for our existence. Using both leads to double-counting. | **Same as above (Doomsday Coin Flip)** | In the Doomsday Coin Flip, conditioning on birth rank without an existence update is correct. | In the Doomsday Coin Flip, the existence update (SIA) must be applied first, and then the birth rank update is applied without double-counting. |

