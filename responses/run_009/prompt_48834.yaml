prompt: |-
  For the past two years our department has run a termly workshop on anthropic reasoning, and its two most stalwart participants have dug into opposite trenches on the doomsday argument. One — call her the Carterian — holds that the doomsday reasoning is sound in outline: given that roughly a hundred billion humans have lived before me, and treating my birth rank as a random sample from the pool of all humans who will ever live, the posterior tilts sharply toward a comparatively early doom; her quarrel is only over how strong the tilt is and how it interacts with ordinary empirical evidence. The other — the self-indicationist — holds that the argument is undone before it starts, because conditioning on finding oneself to exist at all shifts the priors back in favor of hypotheses under which there are more observers, and that this shift exactly or approximately cancels the doomsday update. They have reached the stage of arguing past each other: the Carterian accuses her opponent of double-counting the evidence of her existence, and the self-indicationist accuses the Carterian of treating a sampling assumption as if it were a constraint on how the world must be. At the end of last term I agreed to referee a proper adversarial collaboration between them, and I want to give them — and subsequently my graduate seminar — the joint statement they should have been able to produce.

  Please draft that statement. It should contain, in order: a numbered section of claims both parties can sign — I would expect them to be able to agree on the Bayesian skeleton (that the dispute is about priors and conditioning, not about any error of arithmetic), on the irrelevance of the exact figure for past births, on the fact that their disagreement ramifies into other anthropic puzzles (they should each sign something about the application of their position to the Sleeping Beauty problem and to fine-tuning, even though the analogy is contested), and on the empirical modesty point — namely, that neither party's conclusion licenses a prediction of doom so precise as to be testable against near-term demographic data. Then a disagreements table with rows for each residual disagreement, each row phrased twice: once in wording the Carterian would accept for her own view and once in wording the self-indicationist would accept for his. I want the cruxes isolated and made operational. At least one crux I expect to be the reference-class question — whether the Carterian's sampling premise requires choosing a reference class (all humans? all mammals? all observers?), whether that choice is a free parameter, and whether the doomsday conclusion survives arbitrary widening or narrowing of it. Another, I suspect, is what exactly the fact of one's own existence is evidence of, and to whom. For each crux, specify at least one argument, thought experiment, or stylized case that both parties have already agreed bears on it, and record each party's prediction in advance of working it through — I have in mind stipulated cases where a coin flip determines whether a world contains ten observers or a thousand, since both parties have conceded that such sealed-universe cases isolate the formal issue from the empirical mess. If any portion of their dispute strikes you as verbal — for instance, if part of the disagreement dissolves once they distinguish sampling assumptions from indexical claims — say so explicitly and identify which rows of the table would survive the disambiguation. Please keep the tone of a document both parties could actually put their names to: no adjudication of who is right, no advocacy, and no formulations so bland that neither party would dissent from them.
reasoning: |-
  We are drafting a joint statement for two parties: the Carterian (supporter of the Doomsday Argument) and the Self-Indicationist (opponent). The statement has two main parts: 
  1. A numbered section of claims both parties can sign.
  2. A disagreements table with each row phrased twice (once for each party) and including thought experiments and predictions.

  Both parties agree on the Bayesian framework but disagree on priors and conditioning.

  Agreed Claims (Numbered Section):
  1. **Bayesian Skeleton**: Both parties agree that the dispute is about the choice of priors and the correct way to condition on the evidence, not about any arithmetic error in the application of Bayes' theorem.
  2. **Irrelevance of Exact Past Births**: The exact figure for the number of humans born so far (approximately 100 billion) is not critical to the formal structure of the argument; the logic would hold for any number.
  3. **Ramification to Other Anthropic Puzzles**: Both parties acknowledge that their positions have implications for other anthropic puzzles, including:
     - **Sleeping Beauty Problem**: The Carterian position tends to align with the "thirder" view (that upon waking, Beauty should assign 1/3 probability to heads), while the Self-Indicationist position tends to align with the "halfer" view (1/2 probability to heads). However, the analogy is contested and not necessarily direct.
     - **Fine-Tuning**: The Carterian position suggests that fine-tuning evidence for life is less surprising under many-universe hypotheses (because we are more likely to observe a universe that is fine-tuned, regardless of how rare they are), while the Self-Indicationist position emphasizes that we should update in favor of hypotheses that predict more observers (thus, fine-tuning is more evidence for a multiverse).
  4. **Empirical Modesty**: Neither party's conclusion licenses a prediction of doom so precise that it can be tested against near-term demographic data (e.g., over the next century). The argument is about the long-run fate of humanity and the distribution of observers over time.

  Disagreements Table:
  We will have several rows, each with:
  - A disagreement described in two ways (Carterian version and Self-Indicationist version).
  - One or more thought experiments that both parties agree bear on the issue.
  - Each party's prediction for the outcome of the thought experiment.

  Row 1: The Reference Class Problem
  - Carterian Wording: The Doomsday Argument requires specifying a reference class of observers (e.g., humans) from which one's own birth rank is a random sample. The argument is robust to reasonable choices of reference class (e.g., all humans, all mammals, or all conscious beings) as long as the class is not gerrymandered to avoid the conclusion. Widening or narrowing the class within plausible bounds does not eliminate the doomsday shift.
  - Self-Indicationist Wording: The Doomsday Argument relies on an arbitrary choice of reference class. The choice of reference class (e.g., humans, mammals, or observers) is a free parameter, and the doomsday conclusion is highly sensitive to this choice. Widening the reference class (e.g., to all mammals) can eliminate or reverse the doomsday shift, and thus the argument fails without a principled way to fix the reference class.

  Thought Experiment: **The Mars Colony Scenario**
     - Setup: Suppose that in the future, humanity colonizes Mars. The Mars colony is established and grows independently. We consider two reference classes: (1) only Earth humans, (2) all humans (Earth and Mars). We assume that the total number of humans that will ever exist is fixed (but unknown) and that the birth ranks are assigned in order of birth. We ask: what is the posterior probability that the total number of humans is small (say, less than 1 trillion) versus large (say, 10 trillion) given that one's birth rank is about 100 billion?
     - Carterian Prediction: The doomsday shift (toward a smaller total) will be present in both reference classes, though the magnitude may differ. The shift will be stronger in the Earth-only class (since the birth ranks on Earth might be a smaller subset) but still present in the all-humans class.
     - Self-Indicationist Prediction: The shift will be present only in the Earth-only class. In the all-humans class, if the Mars colony is large and one is born on Earth, the birth rank might be early in the entire human class (if the colony starts later) and thus the shift might not occur or might even reverse.

  Row 2: The Nature of the Evidence (Existence vs. Birth Rank)
  - Carterian Wording: The relevant evidence for updating is one's birth rank. The fact of one's existence is not separate evidence because it is already entailed by having a birth rank. Thus, conditioning on birth rank alone is sufficient and does not double-count the existence evidence.
  - Self-Indicationist Wording: The evidence we possess is that we exist. This existence evidence must be conditioned upon, which favors hypotheses that predict more observers. The Carterian approach effectively conditions twice: once on existence (by requiring that there is at least one observer at one's birth rank) and again on the birth rank itself.

  Thought Experiment: **The Coin-Flip Universe (Sealed Universe)**
     - Setup: A coin is flipped. If heads, the universe contains 10 observers. If tails, it contains 1000 observers. We assume we are one of the observers in the universe. What is the probability that the coin landed heads?
     - Carterian Approach: Treating one's own birth rank (or index) as a random sample from all observers, the probability of being in a particular universe is proportional to the fraction of observers in that universe. Thus, P(heads | existence) = (number of observers in heads universe) / (total observers in both universes) = 10/(10+1000) ≈ 0.0099. This is the standard SIA (Self-Indication Assumption) update.
     - Self-Indicationist Approach: This thought experiment is exactly the case where SIA applies. The Self-Indicationist would agree with the above calculation. However, note that the Carterian in the Doomsday Argument does not use SIA but rather a sampling of birth ranks without the existence update. So we must clarify.

  But wait: The Carterian in the Doomsday Argument does not typically use SIA. The Carterian conditions on birth rank without the prior shift for more observers. So let's reframe.

  In the sealed coin-flip universe, the Carterian (if consistent with the Doomsday Argument) would condition only on the birth rank? But here there is no birth order? We need a different setup.

  Alternative Thought Experiment for Row 2: **The Doomsday Coin Flip**
     - Setup: Consider two hypotheses about the world:
          H1: Total humans ever = 100 billion (so we are the last generation, and there are no more).
          H2: Total humans ever = 100 trillion.
       We are told that the prior odds are 1:1. We know that about 100 billion have lived so far. We are the 100 billionth human. What should we update?
     - Carterian: We treat our birth rank as a random sample from the total humans. The chance of having a birth rank of 100 billion or less is 100% under H1 and 0.1% under H2 (because 100 billion is 0.1% of 100 trillion). Therefore, the posterior odds become 1 : 0.001, so we strongly favor H1 (doom).
     - Self-Indicationist: We must condition on existence. The prior probability of existing at all is proportional to the total number of observers. So the prior probabilities (after conditioning on existence) are not 1:1 but rather 1:1000 (because H2 has 1000 times as many observers). Then, when we condition on having birth rank 100 billion, under H1 the probability of having a rank ≤100 billion is 1, and under H2 it is 0.001. Therefore, the posterior is (1 * 1) : (1000 * 0.001) = 1:1. The doomsday update is canceled.

  Now, both parties have already agreed that this sealed-universe case isolates the issue.

  Row 3: The Formal Role of the Sampling Assumption
  - Carterian Wording: The sampling assumption (that one's birth rank is a random sample from all humans) is a necessary constraint for making any probabilistic inference about the total number of humans. Without it, we cannot make predictions about the future based on our birth rank.
  - Self-Indicationist Wording: The sampling assumption is not a constraint on the world but an expression of our ignorance. However, the self-indication prior (which assigns higher probability to worlds with more observers) already accounts for the fact that we are more likely to exist in a world with more observers. Therefore, the sampling assumption is redundant and leads to double-counting.

  This row might be partially verbal. If we distinguish between:
     (a) The indexical claim: "I am a random observer" (which both might agree is a way to express ignorance) and 
     (b) The sampling assumption: "My birth rank is drawn uniformly from the set of all birth ranks in human history",
  then the disagreement reduces to whether (b) is a valid way to express ignorance in light of the prior update for existence.

  After disambiguation, the remaining crux is whether the prior update for existence (SIA) is necessary and whether the sampling assumption without SIA is valid.

  We'll now draft the joint statement.

