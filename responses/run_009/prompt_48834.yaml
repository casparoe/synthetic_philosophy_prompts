  - A description in wording acceptable to the Carterian and then to the Self-Indicationist.
  - A thought experiment that both parties agree bears on the issue.
  - Predictions of each party for the outcome of the thought experiment.

  | Disagreement | Carterian Wording | Self-Indicationist Wording | Thought Experiment | Carterian Prediction | Self-Indicationist Prediction |
