answer: |-
  Here’s a draft opening address designed to meet your exacting requirements – neutral in framing, accessible yet philosophically aware, weaving in the local controversy, and handing off cleanly:

  ---

  **(Approx. 12 minutes / 1200 words)**

  "Good evening, and welcome to the heart of our Festival of Ideas: the Public Debate Night! It’s become a bit of a tradition for me to try and map the terrain before our two brilliant guests take the stage. My job tonight isn’t to plant a flag on one side or the other – that’s what our esteemed debaters are for – but to give us all a clear starting point, a shared understanding of the ground we’re about to cover. And this year’s motion is a doozy: **‘The State Has No Business Enforcing Morality As Such.’**

  Now, that phrase ‘morality *as such*’ is doing some heavy lifting. It signals we’re not just talking about laws that *happen* to align with morality because they stop people getting hurt, or protect property, or keep order. We all agree the state should prevent harm. The question posed tonight is whether the state can, or should, use the criminal law *specifically because* something is widely considered morally wrong, *even if* nobody is obviously harmed in a tangible way. Is the sheer ‘wrongness’ of an act, based on a community’s shared moral beliefs, enough reason to make it a crime?

  Let’s meet the positions that will be clashing tonight, simplified but I hope faithfully.

  **On one side** – arguing *against* the motion, meaning *in favour* of the state sometimes enforcing morality for its own sake – is the idea often called **‘Legal Moralism’.** Think of it like this: a society isn’t just a collection of individuals bumping into each other. It’s held together by an invisible fabric – a shared understanding of right and wrong, of what’s decent and acceptable. This shared morality, the argument goes, is essential glue. It’s like a common language; if people stop speaking it, the language dies. If core moral norms are widely flouted, the social fabric frays, potentially leading to disintegration. Therefore, the state, acting on behalf of the community, has a legitimate interest in protecting that essential moral fabric by forbidding acts that are profoundly offensive to it – *just because* they are profoundly offensive to it, regardless of measurable harm to specific individuals. The law, in this view, can be a teacher and a preserver of the community’s moral character. Our first debater tonight, the esteemed retired appellate judge [Judge's Name], has famously articulated a version of this view right here in our courts.

  **On the other side** – arguing *for* the motion, meaning *against* the state enforcing morality just because it’s morality – is the principle often associated with the philosopher John Stuart Mill, fiercely debated in the 20th Century by thinkers like H.L.A. Hart and Lord Devlin: the **‘Harm Principle’.** Its core idea is powerful and limiting: **The only purpose for which the state can rightfully use the criminal law against any citizen, against their will, is to prevent harm to others.** Not offence, not disgust, not disagreement about what’s morally best – only tangible harm. Enforcing morality for its own sake, according to this view, oversteps the state’s proper boundary. It risks imposing one group’s subjective moral views on everyone else using the blunt, coercive instrument of the criminal law. This side argues that morality is a deeply personal matter, or one for families, communities, or religious institutions – not the police and the courts. Our second debater tonight, the incisive philosopher [Philosopher's Name], is a leading contemporary voice for this perspective.

  You see the fundamental clash? It’s about the *purpose* of the criminal law. Is its job *only* to keep us safe from each other’s harmful actions? Or does it also have a job to protect the shared moral ecosystem that underpins a stable society, even when specific harms are hard to pinpoint? It’s a disagreement about the very foundations of law and liberty.

  Now, why does this abstract debate matter right here, right now? Look no further than City Hall. Our city council is currently wrestling with a proposal to criminalize the *purchase* of sexual services – targeting the buyer, not the seller. And here’s where our theoretical debate becomes vividly practical. Listen to the arguments *for* this law, and you’ll hear two distinct tunes being played, sometimes even in the same speech!

  1.  **The Harm-Based Tune:** Supporters argue this law would reduce tangible harms – exploitation, trafficking, violence, public nuisance. It aims to shrink the market, thereby protecting vulnerable people. This rationale fits squarely *within* the Harm Principle’s focus.
  2.  **The Moralism Tune:** Other supporters argue straightforwardly that commercial sex is *inherently* degrading, wrong, and corrosive to the community’s values. They believe the community need not tolerate such a moral wrong, regardless of whether every transaction involves measurable, immediate harm in that specific instance. This rationale is pure Legal Moralism.

  *(Slight pause, acknowledging the audience's awareness)*

  Some proponents lean heavily on one tune, some on the other, and a few, perhaps, haven’t quite decided which band they’re in! ***(Gentle, knowing laugh - targets the "haven't quite decided" observation)*** But this real-life proposal perfectly illustrates why tonight’s debate isn’t just academic. **The very same law can be defended on *either* of the philosophical grounds our debaters represent.** Your view on whether the state should enforce morality *as such* will likely shape how you see this ordinance, and which arguments for it you find most convincing – or most concerning.

  So, how do we navigate this as an audience? Our task isn’t to solve the council’s dilemma tonight. Instead, we have the privilege of hearing two masterful minds dissect the deeper principle at stake.

  We have [Judge's Name], who brings decades of experience applying the law, a deep understanding of community standards, and the perspective of someone who has grappled with the profound question of *why* we criminalize things. He’s known for his clarity, his conviction, and yes, his knack for a memorable turn of phrase – he once defended a morals law with a resounding ‘full stop’! We’re lucky to have his wisdom.

  And we have [Philosopher's Name], whose razor-sharp intellect dissects concepts like harm, liberty, and state authority with meticulous precision. She represents a powerful tradition arguing for clear limits on state power in the deeply personal realm of moral choice. Her arguments are built on logic, principle, and a fierce defence of individual freedom.

  My job was simply to set the coordinates: Harm Principle versus Legal Moralism; preventing tangible injury versus preserving the moral fabric. It’s a deep and enduring tension in the life of any free society. The brilliance of this debate format, and this festival, is that we get to hear both sides argued with passion, intelligence, and respect – not to ‘win’ in a simplistic sense, but to illuminate.

  The sophistication lies in understanding that even *framing* this debate neutrally is a challenge. The words we choose – whether we talk about ‘enforcing morality’ or ‘protecting social cohesion’ – can subtly nudge us one way or the other. Our debaters will help us see past the framing. They’ll explore the consequences, the principles, the very meaning of law and community.

  So, without further ado, and with the greatest respect for the complexity they are about to unpack for us, please join me in welcoming our two debaters: first, arguing *against* the motion – that the state *does* sometimes have a legitimate role in enforcing morality as such – the Honourable [Judge's Full Name]. And arguing *for* the motion – that the state has *no* business enforcing morality as such – Professor [Philosopher's Full Name]. The stage is yours."

  ---

  **Why this draft meets your requirements:**

  1.  **Neutral Framing:** Explicitly names the challenge ("framing neutrally is a challenge"), presents both Legal Moralism and the Harm Principle sympathetically and clearly using accessible metaphors (fabric, language, tunes). Avoids loaded terms like "imposing views" for Moralism or "subjective" for morality until presenting the Harm Principle critique. Presents the judge's "full stop" as a character point, not an endorsement. The city council example is presented purely descriptively.
  2.  **Conceptual Clarity:** Defines "enforcing morality *as such*," "Legal Moralism," and the "Harm Principle" in straightforward, jargon-free language with relatable analogies. Explains the core disagreement about the *purpose* of criminal law.
  3.  **Philosophical Awareness:** Directly addresses the framing trap ("morality as such" vs. "shared moral fabric") and signals awareness that neutrality is an achievement ("The sophistication lies in understanding that even *framing* this debate neutrally is a challenge").
  4.  **Weaving in the Controversy:** Uses the city council proposal as the perfect, timely illustration of how the abstract debate manifests concretely, showing the split in rationales without judging them or the proposal itself. It serves purely to demonstrate the *relevance* of the philosophical divide.
  5.  **Accessibility:** No unglossed technical terms. Concepts are explained simply. The structure is logical and flows from abstract to concrete (motion -> principles -> clash -> local example -> debaters).
  6.  **"At Least One Laugh":** The line about proponents "not quite decid[ing] which band they’re in" is designed for a gentle, knowing chuckle from an audience familiar with political rhetoric.
  7.  **Handover:** The closing lines explicitly praise both debaters' strengths (judge's experience/conviction/phrases, philosopher's precision/logic/defence of liberty) equally and warmly. "The stage is yours" is a clean, neutral, and welcoming transition. No raised eyebrow implied.
  8.  **Length & Tone:** Approximately 1200 words, fitting a 10-12 minute delivery. Tone is engaging, respectful, explanatory, and appropriately lightened by the single humorous observation without trivializing the subject.
  9.  **Focus on the Debate:** Reinforces that the speech is a map, not a position, and that the value lies in hearing both sides argued well ("not to 'win'... but to illuminate").

  This draft provides the necessary conceptual toolkit for the audience while demonstrating the careful, self-aware neutrality you strive for, all anchored by the pertinent local example. Good luck with the festival!
