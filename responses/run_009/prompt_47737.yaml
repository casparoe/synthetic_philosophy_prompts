prompt: |-
  Is there an established term for a pattern I keep running into in arguments about animals? Over the winter a stray cat turned up in our yard, half starved, and we fed her without a second thought — everyone we told approved. A few weeks later the field behind our house froze hard for weeks, and I found myself watching the rabbits and birds out there getting visibly thinner, and it struck me that it would never occur to me, or apparently to anyone, to feed them, even though their suffering was plausibly worse than the cat's and just as easy to see. When I brought it up at a family dinner, my brother-in-law said the difference was obvious: the cat was "our problem" because it showed up at our door. That didn't satisfy me. If my neighbor went away and his dog was starving in his yard, I'd be blamed for doing nothing — and nobody starved that dog on purpose either. So it isn't just about whether the harm was deliberate. The pattern seems to be that I'm required to help an animal when its suffering traces back somehow to the human world — a door, an owner, a road, a fence, a window — and released from helping when the suffering comes from cold, hunger, disease, or predation with no human fingerprint anywhere on it. And the release isn't because the suffering is smaller; a deer starving through a hard winter probably suffers more than a neglected dog.

  I've read a little philosophy in my spare time, so I know there's a standard distinction between doing harm and allowing harm, but that doesn't seem to be exactly it: in both the neighbor's-dog case and the deer case I would be merely allowing, yet one omission makes me a monster and the other doesn't even register as an omission. So this looks like a separate asymmetry sitting on top of the doing/allowing one, something like: the strength of a duty to rescue depends not on how bad the suffering is or how cheap the rescue would be, but on whether the causal chain runs through some human hand, however indirectly. Does this have a name of its own in the literature? I'm not after just a label — I want to know how it relates to the plain doing/allowing distinction, to the idea that we're specially responsible for harms we cause, and to whatever people say about the difference between natural and human-caused suffering. If there's no established concept that captures it exactly, please say so, define the thing precisely enough that it doesn't collapse into those neighboring ideas, work through the edge cases (a wild animal hit by a car, feral cats descended from pets, a bird that crashes into my window), and propose a name that marks off the phenomenon rather than the slogan.
reasoning: |-
  Okay, the user is describing a pattern they've noticed in moral reasoning about helping animals, especially the asymmetry between rescuing animals affected by human causes versus natural causes. They've provided specific examples: feeding a stray cat that showed up at their door is seen as obligatory, but feeding wild rabbits and birds suffering in winter isn't. Even though the suffering might be worse for the wild animals, people don't feel the same duty. 

  The user is clearly well-read—they mention being familiar with the doing/allowing distinction in philosophy but correctly point out that it doesn't fully explain this asymmetry. They want to know if there's an established term for this phenomenon, and if not, they want a precise definition that doesn't collapse into adjacent concepts like the doing/allowing distinction or the distinction between natural and human-caused harm. They also want edge cases explored. 

  First, I need to confirm whether there's an exact term for this. From what I know, there isn't a single canonical term, but the concept is discussed in moral philosophy, particularly in debates about duties to aid, responsibility for harm, and the "duty to rescue." The key here is the role of causal proximity or indirect human agency. 

  The brother-in-law's point about the cat being "our problem" because it showed up at the door touches on proximity—both physical and relational. But the user pushes back, noting that even indirect human causation (like the neighbor's dog) triggers a duty, while pure natural suffering doesn't. That suggests the asymmetry is less about proximity and more about tracing the harm back to human influence, however faint. 

  The user's examples highlight the gradient: a wild animal hit by a car (direct human cause) would likely trigger a duty to help, while a naturally starving deer wouldn't. But what about feral cats? They're descended from pets, so human-caused, but now live "wild." That's an edge case. Similarly, a bird hitting a window—human structure, so duty? 

  I should synthesize this into a core principle: the duty to rescue intensifies when the victim's plight is traceable to human activity, even if the rescuer didn't cause it directly. This isn't just about direct causation (like hitting an animal with your car) but about the broader web of human impact. Philosophers like Peter Singer might argue this is irrational—suffering is suffering—but the user is observing a real-world moral intuition. 

  For a name, "causal linkage duty asymmetry" is clunky but precise. "Anthropogenic harm imperative" captures the human-cause element but might be too broad. "Proximity" is misleading because it's not just spatial. After weighing options, "causal tethering" seems best—it implies the harm is anchored to human actions, creating a "duty hook." 

  Edge cases: 
  - Hit-by-car wild animal: clear duty (direct human cause). 
  - Feral cats: human-caused via domestication, so duty? But socially, people might see them as "wild" now. 
  - Window-strike bird: human structure, so duty. 
  - Naturally starving deer: no duty. 

  The user might also be hinting at a critique—why do we prioritize human-linked suffering?—but they're primarily asking for conceptual clarity. I should emphasize that this asymmetry exists in common morality, even if philosophers dispute its rationality. 

  Finally, relate it to existing concepts: it's a subcategory of the duty to rescue, filtered through causal history. It's orthogonal to doing/allowing (both are allowing harm, but one has a human-linked victim). And it's distinct from "special responsibility" because the rescuer often didn't cause the harm (e.g., the stray cat wasn't their pet).
answer: |-
  You've identified a profound and pervasive moral asymmetry that lacks a single, universally agreed-upon term, but is actively discussed in ethics, animal ethics, and environmental philosophy. The core phenomenon—**a stronger duty to aid when suffering is traceable to human causation, even indirectly, compared to "purely natural" suffering of equal or greater intensity—**is often analyzed under several interconnected concepts. Here's a breakdown:

  ### 1. **The Core Principle & Its Name**
     - **The Phenomenon:** Your duty to rescue intensifies not merely based on *severity of need* or *ease of help*, but on the presence of a **causal chain linking the victim's plight to human agency** (past or present). This creates a "moral tether."
     - **Proposed Name:** **The Causal Tethering Principle (CTP)** or **Anthropogenic Proximity Imperative**. "Tethering" emphasizes the link to human action; "Anthropogenic Proximity" highlights the human origin ("anthro") and the sense of nearness ("proximity") in causation, not necessarily physical location.
     - **Why these names?** They avoid collapsing into "doing/allowing" (as you noted, both scenarios involve *allowing*). They specify the *type* of link required (human causation), distinguishing it from pure physical proximity or relational ties (like pet ownership).

  ### 2. **How It Relates to Key Philosophical Distinctions**
     - **Doing vs. Allowing Harm:** This distinction *fails* to explain the asymmetry, as you correctly identified. In *both* the neglected dog and starving deer cases, you are *allowing* harm. CTP operates *on top* of this, creating a hierarchy *within* the category of "allowing harm." Some omissions are deemed far worse based on the victim's connection to human causation.
     - **Responsibility for Harms We Cause:** This is the *closest* standard concept. We feel stronger obligations when *we* (individually or collectively) caused the harm ("you broke it, you fix it"). CTP *extends* this:
       - **Individual Causation:** Hitting an animal with your car creates a direct, strong duty.
       - **Collective/Systemic/Historical Causation:** The stray cat exists because of human domestication and abandonment. The neighbor's dog suffers because of the human institution of pet ownership. The rabbit starving "naturally" lacks this link. CTP captures obligations arising from *diffuse* human systems, not just individual acts.
     - **Natural vs. Human-Caused Suffering:** This is a crucial *input* to CTP but not the *whole story*. CTP makes the *origin* of the suffering paramount for assigning rescue duties. We often feel released from duties toward "natural" suffering, seeing it as the "way of the world," while human-caused suffering feels like a *problem* we created and thus must address. However, CTP is more precise: it focuses on the *causal history* triggering the duty, not just labeling the suffering.

  ### 3. **Edge Cases & Applying the Causal Tethering Principle (CTP)**
     - **Wild Animal Hit by a Car:** **Strong Duty (CTP Applies).** The causal chain is direct and unambiguous: human technology (car) caused the injury. You'd be widely blamed for not helping. The suffering originates from human agency.
     - **Feral Cats Descended from Pets:** **Ambiguous/Strong Duty Leaning (CTP Likely Applies).** The suffering exists *because* of human actions (domestication, abandonment, failure to control populations). While "wild" now, the *origin* of their presence and vulnerability is anthropogenic. Most would feel a duty to help (e.g., TNR programs, feeding strays), stronger than for a truly wild species.
     - **Bird That Crashes into Your Window:** **Strong Duty (CTP Applies).** The bird's plight is directly caused by a human-made structure. Your window is the immediate cause. You are causally linked via your property. Not helping feels like complicity.
     - **Bird Starving in a Harsh Winter:** **Weak/No Duty (CTP Doesn't Apply).** The suffering stems from natural processes (weather, food scarcity). No human causal link triggers the rescue duty, despite the severity.
     - **Deer Caught in a Barbed Wire Fence (Human-Made) on Public Land:** **Strong Duty (CTP Applies).** The *immediate cause* of suffering (entrapment/injury) is a human artifact, even if you didn't place the fence. The human fingerprint is directly on the harm mechanism.
     - **Deer Starving in Harsh Winter Near a Suburb:** **Weak/No Duty (CTP Doesn't Apply).** Proximity to humans doesn't create a causal link *to the suffering itself*. Unless the suburb directly caused habitat loss or artificial dependency (e.g., feeding bans), the origin remains natural. (Note: If the suburb *destroyed* its winter habitat, CTP *might* apply diffusely).

  ### 4. **Why Does CTP Exist? Philosophical Justifications & Critiques**
     - **Arguments FOR its intuitive pull:**
       * **Restorative Justice:** We have an obligation to fix problems we (humans) create. Nature "fixes itself" (even if brutally).
       * **Fairness & Non-Exploitation:** Animals made vulnerable *by us* are owed compensation; wild animals face baseline risks they are "adapted" to (evolutionarily, not morally).
       * **Practicality & Scope:** A duty to alleviate *all* suffering is impossibly vast. CTP provides a (somewhat) bounded scope focusing on human-disrupted systems.
       * **Relational Obligations:** Interaction (the cat at your door, the dog next door) or structures (your window, the road) create a quasi-relationship or direct causal involvement.
     - **Arguments AGAINST its moral adequacy (e.g., Utilitarians like Peter Singer):**
       * **Suffering is Suffering:** The origin is irrelevant to the victim's experience. A duty should arise from *capacity to reduce suffering* and *severity of need*, not causal history.
       * **Arbitrary Line:** The distinction between "natural" and "human-caused" is often blurry (climate change altering winters? historical habitat destruction?). CTP can lead to perverse outcomes (help the cat hit by a car, ignore the deer hit by a falling tree).
       * **Speciesism in Disguise:** It prioritizes animals entangled with humans (pets, pests) over truly wild ones, reflecting human self-interest rather than impartial morality.

  ### Conclusion
  There is **no single, universally established term** precisely capturing your insight, though it sits at the intersection of **causal responsibility, the duty to rescue, and the moral significance of natural vs. anthropogenic harm.** The **Causal Tethering Principle (CTP)** or **Anthropogenic Proximity Imperative** offers a precise definition: *The moral obligation to prevent or alleviate suffering is significantly amplified when the causal chain leading to that suffering demonstrably originates from, or is mediated by, human agency, irrespective of the individual rescuer's direct role in causing it.* It explains why feeding the stray cat (human-domesticated, abandoned) feels obligatory, while feeding the wild rabbit (suffering from natural winter) does not, even if the rabbit suffers more. It's a distinct layer atop the doing/allowing distinction, grounded in the perceived moral weight of human causation itself. This principle powerfully shapes our intuitions about animal welfare, environmental ethics, and rescue obligations.
