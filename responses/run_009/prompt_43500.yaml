prompt: |-
  I teach a graduate seminar on moral responsibility, and we have just finished P. F. Strawson's Freedom and Resentment. A student of mine has produced an argument about it that I find myself unable to dismiss and unwilling to accept, and since our next meeting is not until Thursday, I would be grateful for your help in locating the trouble. The argument concerns what her conclusion would commit us to: a thoroughgoing relativism about responsibility. It runs as follows.

  (1) For Strawson, what makes a person responsible for an action is not an attitude-independent fact that our attitudes track, but her being an appropriate target of the reactive attitudes — resentment, indignation, guilt, and their kin — and he insists that these attitudes neither need nor could receive justification from a standpoint wholly outside the participant perspective; any such justification would address the wrong kind of question. (2) Which actions attract the reactive attitudes is, as a matter of sociology, settled by what the local community actually feels, and the sentiments vary widely across cultures and epochs, as Strawson himself allows when he observes that the patterns of personal and local life shape who resents whom and on what occasions. (3) The extension of the responsible therefore travels with the local ecology of sentiment: an act counts as blameworthy in a community just insofar as the reactive attitudes are, as a matter of fact, directed at it there. (4) By parity, a community whose members sincerely and uniformly feel indignation toward, say, women who read in public thereby makes those women genuinely blameworthy for reading in public; there is no further fact to which we could appeal in protest, since any appeal would have to be issued from within some participant stance or other, and the local stance has already spoken. (5) That conclusion is intolerable: we do not want to say that in such a community the women really are guilty and merely have the misfortune of living among the easily scandalized; we want to say the community's attitudes are misplaced. (6) So (1) is false, and responsibility must be fixed by facts about agents that obtain independently of anyone's attitudes.

  She adds, in a footnote, that she would much rather keep (1) than swallow (4), and that she suspects the fault lies somewhere between (2) and (3), but she cannot say what. Neither, at the moment, can I, at least not with the confidence I would want in front of a seminar. So tell me which step to reject, why that step looked innocent when it was introduced, and what rejecting it costs. If the repair depends on distinguishing attitudes that are actually felt from attitudes that would be fitting, I want you to say where the standard of fittingness comes from — and, in particular, whether it can be located within the participant perspective, as Strawson's own talk of a demand for reasonable goodwill might suggest, without quietly reintroducing through the back door the very external standpoint that (1) was meant to bar. If instead you think the parity claim in (4) is where the argument breaks, explain why attitudes directed at what a person is, rather than at how she wills, fail to be reactive attitudes in Strawson's sense, and say what that exclusion costs him elsewhere. Please write your response as continuous prose only, as one would write a letter to a colleague: no headings, no bullet points, no bold text, no tables.
reasoning: |-
  Okay, let me unpack this carefully. The professor presents a student's compelling argument that seems to push Strawson's view toward cultural relativism about moral responsibility, with troubling implications. The student worries that if responsibility is constituted by local reactive attitudes (per Strawson), then communities that condemn women for reading would genuinely make those women blameworthy - a conclusion the student rightly finds intolerable. 

  Hmm, the core tension lies between Strawson's participant perspective and the need for normative constraints. The student's step (2) flattens Strawson's nuanced view of "community" into mere sociology. Strawson isn't just describing actual attitudes but the deep structures of interpersonal accountability - what he calls the "general framework" of human life. When he mentions cultural variations, it's within boundaries set by our shared human nature as social creatures. 

  Ah! Here's the key: step (3) overlooks Strawson's distinction between the general framework (necessary for any responsibility practices) and local modifications (contingent cultural expressions). The reactive attitudes aren't arbitrary; they're tethered to perceived violations of reasonable expectations. A community condemning readers fails Strawson's own test - such attitudes couldn't survive reflection on basic facts about human wellbeing or agency. 

  The student's error surfaces in step (4)'s false equivalence. Not all indignation counts as "reactive" in Strawson's sense - only those responsive to willed actions. Condemning innate traits (like gender) or harmless acts (reading) falls outside the participant stance because it doesn't track quality of will. This preserves Strawson's anti-relativism without smuggling in external standards - it's immanent critique using his own tools. 

  What might surprise the professor is how little this costs Strawson. His framework already excludes non-agency-related hostility (prejudice, disgust) from genuine reactive attitudes. The "fittingness" standard emerges internally through Strawson's requirement that attitudes be proportionate to the agent's regard for others. No backdoor metaphysics needed - just consistent application of his existing architecture.
answer: |-
  My dear colleague,  

  I quite see why your student’s argument has left you unsettled—it’s a sharp challenge, pressing Strawson’s view toward a relativism that feels both alien to his spirit and ethically untenable. The trouble, I think, lies not in step (2) or (3) per se, but in the unexamined slide from Strawson’s nuanced participant perspective to the flat sociological descriptivism of (3) and (4). The repair requires tightening our grip on what Strawson means by "appropriate" reactive attitudes and how the "local community" functions within his framework. Let me walk you through it.  

  Strawson does indeed ground responsibility in the reactive attitudes—resentment, guilt, gratitude—and denies that these can be justified from a wholly external standpoint (step 1). He also acknowledges cultural variation in what triggers these attitudes (step 2). But step (3) oversimplifies by equating "appropriate" with "statistically prevalent." For Strawson, the reactive attitudes aren’t mere psychological reflexes; they are *interpersonal responses* to perceived violations of the basic demand for goodwill and regard intrinsic to human relationships. Their "appropriateness" hinges on whether they reflect a plausible interpretation of the *agent’s quality of will*—not merely whether they are widely felt.  

  When Strawson speaks of patterns shaped by "personal and local life," he is referring to *variations within boundaries* set by the universal framework of human sociality. The participant perspective isn’t a free-for-all: it is constrained by what he calls the "general structure or web of human attitudes and feelings" (*Freedom and Resentment*, p. 23). A community’s indignation toward women reading might be *sociologically* common, but Strawson would ask whether it coherently reflects a judgment about the *will* of those women. If the attitude persists despite awareness that reading expresses no ill will or disregard (e.g., if the community concedes it harms no one), it becomes unstable under reflection—precisely the kind of reflection Strawson thinks is internal to the participant stance.  

  This is where step (4) stumbles. The "parity" claim assumes that *any* uniform sentiment counts as a reactive attitude in Strawson’s sense. But reactive attitudes, for him, are defined by their connection to *agency* and *interpersonal accountability*. Indignation directed at what a person *is* (e.g., their gender) or at harmless acts (like reading) doesn’t qualify, because it severs the link to the agent’s quality of will. Such attitudes are better classified as prejudices or cultural taboos—phenomena Strawson explicitly sets aside as distortions of the moral framework. The "local stance" only "speaks" authoritatively when it operates within the grammar of mutual accountability.  

  The standard of fittingness, then, emerges immanently. Strawson’s "demand for reasonable goodwill" isn’t a hidden appeal to external facts; it’s the constitutive ground of the participant perspective itself. When we protest the community’s condemnation of women readers, we do so *from within* that perspective, pointing to the incoherence of treating reading as a failure of regard. We ask: "What ill will or indifference does this act express?" If the answer is "none," the attitude is revealed as a *mistake*—a failure to properly apply the community’s own implicit standards of accountability. This avoids relativism without smuggling in an alien metaphysics.  

  Rejecting the slide from (2) to (3) costs us little. It means accepting that cultural variation is bounded by the formal conditions of agency and mutual regard—a move Strawson hints at when discussing exemptions (e.g., the insane or children). We lose a reductive sociological criterion for "appropriateness," but gain a normatively stable foundation. Your student might fear this reintroduces external standards, but the constraint is internal: the reactive attitudes *themselves* generate criteria of fittingness through their role in mediating human relationships. A community that condemns reading isn’t "wrong from an God’s-eye view"; it is failing its own commitment to holding persons accountable for their wills.  

  In seminar, I’d suggest pressing this distinction: Strawson’s project isn’t to describe what we *do* resent, but what resentment *is for*. The rest is pathology.  

  Warmly, as ever,  
  —  

  P.S. Your student’s footnote is telling: she senses (rightly) that the fault isn’t in Strawson’s core insight but in its misapplication. That’s excellent instinct.
