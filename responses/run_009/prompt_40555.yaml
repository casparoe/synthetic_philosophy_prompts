prompt: |-
  Longtime LessWrong reader here, been around since the OB days, and I'm deep into the cryonics/deathism arguments that keep flaring up on rationalist forums. My native vocabulary is expected utility theory plus programming: I think in terms of utility as a function over world-histories, aggregation over time, counterfactual evaluations, undefined values and exception handling — I'm fluent, not expert (I know why NaN is not the same as zero, I know what a do-operator is gesturing at, but I've never worked through Pearl properly). What I keep running into is someone in a comment thread dropping the Epicurean move — death is nothing to us, since when we exist death is not present, and when death is present we no longer are, so it can't be bad for anyone — and then the pushback that death is bad for you because it deprives you of the goods you would otherwise have gotten, plus Lucretius's symmetry point that nobody grieves their pre-natal nonexistence so posthumous nonexistence shouldn't bother us either. I can never tell how much of this debate survives being restated in my terms.

  So: translate that whole exchange as faithfully as you can into my vocabulary. Treat welfare as a function of the world(-history); ask what happens when the subject drops out of the world — is a world without me a world where my welfare function returns undefined, or is it just a world with no such function around to evaluate, or a counterfactual branch I compare against? Map the Epicurean claim, the deprivation account, and the symmetry argument each onto that machinery, and flag explicitly where you had to choose between those readings, because the choice seems like it might be doing all the work. Then the residue report, which is the part I actually care about: what translates clean, what gets distorted to fit, what has no expression in my vocabulary at all (e.g. I don't have a natural slot for bad-for-a-particular-person-at-a-time as opposed to bad-for-a-person-period, and I suspect the philosophers' disagreement lives in that slot). And give me your view on where the residue sits: is my vocabulary missing something real, or is the original debate less substantive than it looks — the Epicurean sometimes sounds like he's just observed that the function raises an exception at the moment of death and declared the problem solved, which is exactly the kind of move I've been trained to be suspicious of.

  Lead with your bottom line in the first sentence and then give the reasoning — no preamble, no restating my question back at me.
reasoning: |-
  Okay, let me tackle this user's query. They're a longtime LessWrong reader, deeply familiar with rationalist concepts like expected utility theory and programming analogies. They want the Epicurean debate on death translated into their framework: welfare as a function over world-histories, counterfactuals, undefined values. 

  First, I need to map the key arguments:
  - Epicurean claim: Death isn't bad because when dead, you don't exist to experience it.
  - Deprivation account: Death is bad because it deprives you of future goods.
  - Symmetry argument: Why mourn posthumous nonexistence but not prenatal?

  The user's framework uses welfare functions f(w, t) for a person in a world-history at time t. The core challenge is handling the "subject dropout" problem—what happens when the person doesn't exist? 

  For Epicurus, when the person doesn't exist, f(w, t) is undefined. So comparing death (undefined) to life (defined) is like comparing a number to NaN—meaningless. This makes the "badness" of death an error in the model. 

  The deprivation account requires counterfactuals: compare actual world (death at t_d) to a world where you live longer (w'). The badness is the integral of f(w', t) for t > t_d minus... but minus what? Since f(w, t) is undefined after death, we can't compute the difference directly. We have to treat the counterfactual as a different world-history where the function stays defined. This introduces a discontinuity—the model works mathematically but feels like a hack.

  The symmetry argument highlights that prenatal nonexistence also has undefined f(w, t), yet we don't consider it bad. But the deprivation logic would say prenatal nonexistence deprives you of earlier goods—yet we don't grieve that. Why the asymmetry? The user's model can't distinguish temporal direction, so the residue is entirely about our psychological bias toward future events.

  The residue is significant. The user's model handles deprivation via counterfactual math but can't explain why we care about future but not past deprivation. It also struggles with the "for whom" problem—badness at a time requires a subject, which disappears at death. The model can compute a counterfactual loss but can't attribute it to the dead person without philosophical baggage. 

  I think the user suspects the debate might be less substantive—like Epicurus exploiting an exception. The residue analysis shows their model exposes where the real philosophical disagreements lie: temporal bias and subject persistence. Their framework is good for certain calculations but can't resolve normative questions about why we should care about future selves differently than past selves. The missing piece isn't computational but conceptual—about personal identity over time and the nature of welfare subjects.
answer: |-
  **Bottom line: Your vocabulary captures deprivation cleanly as counterfactual utility integrals, forces undefined values at death (Epicurus' core move), but fails to resolve the symmetry argument's normative residue about *why* we temporally discount past deprivation, exposing a gap in modeling "bad-for-X-at-t" as distinct from "bad-for-X-period".**

  ### Translation to Utility/Programming Framework
  Define:
  - **World-history `w`**: A complete timeline of states.
  - **Subject `S`**: A specific agent with a welfare function.
  - **`u_S(w, t)`**: Welfare of `S` in `w` at time `t`. Defined iff `S` exists in `w` at `t`.
  - **Death event**: At `t_death`, `S` ceases to exist in `w`. For `t > t_death`, `u_S(w, t)` is **undefined** (not zero, not NaN—a domain error).

  #### 1. Epicurean Claim ("Death is nothing to us")
  - **Translation**:  
    - When alive (`t < t_death`): `u_S(w, t)` is defined. Death not present.  
    - When dead (`t ≥ t_death`): `u_S(w, t)` undefined → no subject to experience "badness".  
    - **Conclusion**: Attempting to evaluate `u_S(w, t)` for `t ≥ t_death` throws an exception. No valid comparison exists.  
  - **Choice Point**: *Must* treat death as undefined, not zero. If `u_S = 0` after death, deprivation arguments trivially win. Epicurus relies on the function ceasing to exist.

  #### 2. Deprivation Account ("Death is bad due to lost future goods")
  - **Translation**:  
    - Actual world `w_actual`: `S` dies at `t_death` → `u_S(w_actual, t)` undefined for `t > t_death`.  
    - Counterfactual world `w_cf`: `S` lives longer → `u_S(w_cf, t)` defined for `t > t_death`.  
    - **Badness of death** = `∫[t_death to ∞] u_S(w_cf, t) dt` (the integral of welfare in the life-continuing counterfactual).  
    - Note: No subtraction of `u_S(w_actual, t)` (undefined) — comparison is between defined integrals over existence periods.  
  - **Choice Point**: Deprivation is *counterfactual-dependent*. We compare world-histories, not states at `t > t_death` within `w_actual`.

  #### 3. Symmetry Argument ("Why not grieve pre-birth?")
  - **Translation**:  
    - Pre-birth: For `t < t_birth`, `u_S(w, t)` undefined (no `S`).  
    - Post-death: For `t > t_death`, `u_S(w, t)` undefined (no `S`).  
    - **Symmetry Claim**: If deprivation is bad, *past* deprivation (missing pre-birth goods) should be symmetric to *future* deprivation (missing post-death goods).  
      - Pre-birth badness (hypothetical) = `∫[-∞ to t_birth] u_S(w_cf, t) dt` for a counterfactual where `S` exists earlier.  
      - Yet we don't grieve this. Contradiction?  
  - **Choice Point**: The model *allows* symmetric counterfactual integrals but cannot explain why we normatively weight future losses over past losses.

  ---

  ### Residue Report
  1. **Translates Cleanly**:  
     - Deprivation as counterfactual utility integration.  
     - Undefined welfare at death (Epicurus' undefined function).  
     - Symmetry as identical undefined-state handling pre-birth/post-death.  

  2. **Distorted to Fit**:  
     - **Epicurus' "non-experience" claim**: Your framework reduces it to a domain error. But Epicurus implies *logical incoherence* of evaluating "badness" without a subject. Your model handles this technically but loses the philosophical force of the "no subject" argument.  
     - **Badness attribution**: Deprivation computes a *numerical difference* between worlds, but doesn't resolve *for whom* this is bad. If `S` doesn't exist in `w_actual` post-death, who "experiences" the badness? Model answers "no one; it's a counterfactual metric," but the debate assumes badness must attach to a subject-at-a-time.  

  3. **No Natural Expression**:  
     - **Temporal indexicality of harm**: Your model calculates "bad-for-`S`-period" (lifetime welfare loss), but cannot represent "bad-for-`S`-at-`t`" (e.g., "death is bad for me *now* as I anticipate it"). The symmetry argument's residue lives here:  
       - Why do we *now* care about future undefined states but not past ones?  
       - Your framework can compute symmetric integrals but lacks:  
         - A discounting function for past/future utility (psychology, not math).  
         - A model of anticipation (current utility depending on future expectations).  
     - **Subject persistence**: The debate assumes `S` is a persistent entity harmed by future absence. Your `u_S` is defined per-time, but doesn't encode *why* `S`'s current self cares about future selves.  

  4. **Residue Verdict**:  
     - **Epicurus' move** *is* exploiting an exception (undefined value) to dismiss the question. Your suspicion is correct: this is a technical evasion, not a solution.  
     - **The substantive residue** is:  
       - (a) Why temporal discounting of past deprivation is rational (or irrational),  
       - (b) Whether "harm" requires a subject *at the time of harm* (Epicurus) or is a lifetime property (deprivation).  
     - Your vocabulary **misses something real**: the first-person perspective of temporal bias (caring more about future losses). This is psychological/computational (e.g., hyperbolic discounting), not pure utility theory. It also lacks machinery for "harm-as-relational" (e.g., "bad for X at T" requires X-at-T to exist, but deprivation denies this).

  ---

  ### Conclusion
  Your framework exposes Epicurus' claim as a technicality (exploiting undefined values), validates deprivation via counterfactuals, and reduces symmetry to identical mathematical handling of pre/post nonexistence. The unresolved residue—**why we weight future deprivation differently than past deprivation**—highlights a gap in modeling the *temporally situated subject*. This isn't a flaw in your vocabulary; it reveals the debate's core: whether "harm" is timeless (your model) or requires a present subject (Epicurus). The residue is substantive: it demands a theory of temporal perspective and self-concern that pure world-history utilities don't encode.
