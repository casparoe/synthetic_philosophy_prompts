prompt: |-
  I work near the preference-learning corner of ML and something keeps nagging at me about inverse reinforcement learning, so let me lay it out. The practice: you watch a human behave in some environment (driving demos, mouse trajectories, whatever), and you infer the reward function they seem to be optimizing, with the aim of building a machine that pursues the same thing. Everyone knows any finite behavior is consistent with infinitely many reward functions, so the field adds priors and, crucially, a rationality assumption — the human is optimal plus noise, or Boltzmann-rational, deviations from the optimum are random. Meanwhile the same community infers preferences a completely different way in RLHF, from pairwise judgments the human makes on request, and when the recovered reward from behavior comes out looking wrong — the human did something dumb that day, or the inferred function rewards something the human would object to if you showed it to them — practitioners just hand-tune or re-regularize and move on.

  So what does this practice actually presuppose about preference? I want the implicit theory reconstructed. Like: does treating behavior as evidence of preference require a causal view where desires drive action, or would a revealed-preference view (preference just IS choice disposition) license it too, and do those come apart anywhere in the pipeline? Does the noise assumption quietly presuppose that human error is unsystematic in a way that makes the recovered preference something the human would endorse on reflection — and if so, how does that square with correcting the inferred preference when the human complains, since that correction treats the human's report as better evidence than the behavior it was inferred from? Is the practice even consistent, or is it running one theory of evidence in the IRL branch and a different one in the RLHF branch without noticing? And how much of this is genuinely presupposed versus underdetermined — several rival theories of preference would license the exact same code, I suspect, but maybe not once you look at the noise model and the corrections.

  Also tell me what would have to change if we replaced the implicit theory with the hardline revealed-preference view where the inferred reward is correct by construction and there is nothing to correct.

  please write it as continuous prose, no headings, no bullet points, no bold, nothing like that — just paragraphs like an email. Im not going to read a table about this.
reasoning: |-
  Okay, the user is deep into preference learning in ML, specifically bugged by inconsistencies between inverse reinforcement learning (IRL) and RLHF practices. They're questioning the foundational theories of preference underlying these methods. Let me unpack their concerns step by step.

  First, they point out that IRL assumes humans are Boltzmann-rational—optimal plus noise—when inferring rewards from behavior. But this clashes with RLHF, where preferences come from explicit human judgments. When IRL recovers a "wrong" reward (e.g., due to human error), practitioners tweak it manually. The user is essentially asking: What theory of preference justifies this patchwork? 

  The core tension revolves around two philosophies: causal (preferences cause behavior) versus revealed-preference (preference is defined by behavior). Under revealed-preference, any behavior *is* the optimal choice by definition—so IRL's rationality assumption becomes tautological. But in practice, when the inferred reward leads to absurd outcomes, engineers override it. That contradiction exposes how the field implicitly rejects pure revealed-preference. The manual corrections reveal a deeper belief: humans have "true" preferences that sometimes misalign with actions (due to noise/mistakes), and verbal feedback can better access them. 

  Then there's the noise model problem. IRL treats deviations as random (Boltzmann), implying errors are unsystematic. But real human mistakes are often patterned (e.g., cognitive biases). When practitioners "fix" rewards based on complaints, they're admitting the noise model failed—systematic errors exist, and verbal reports are trusted over past behavior. This further undermines revealed-preference, where behavior is the only datum. 

  The user also hints at theory underdetermination: multiple preference theories could technically justify the same code. But the moment you adjust outputs based on human feedback, you're committing to a causal view where preferences exist independently of actions. 

  Finally, the thought experiment: if we enforced hardline revealed-preference, IRL would become unfalsifiable (all behavior is optimal by definition), and RLHF would be incoherent (why ask for preferences if they're defined by choices?). The whole correction mechanism would vanish. 

  This suggests the field's implicit theory is a messy hybrid: preferences are real mental states that *mostly* drive behavior, but with unsystematic noise (Boltzmann as a useful fiction). When behavior and reports clash, reports get privileged—revealing an unstated hierarchy of evidence. The inconsistency between IRL and RLHF branches stems from not formalizing this hierarchy. To resolve it, we'd need to model how verbal feedback relates to latent preferences, perhaps unifying behavior and judgments under a single noise-aware framework. But currently, the practice runs on pragmatic intuition rather than coherent philosophy.
answer: |-
  Your unease cuts to the philosophical and practical fault lines running through preference learning. Let's reconstruct the implicit theory embedded in the IRL practice you describe and wrestle with the tensions. At its core, the standard IRL approach—inferring a reward function from observed behavior under a rationality-plus-noise assumption—presupposes a specific, somewhat folk-psychological, causal model of human agency. It assumes preferences (desires, goals, latent reward functions) exist as mental states that *cause* the observed behavior, albeit imperfectly. The noise model (Boltzmann-rationality being common) embodies the belief that deviations from optimal pursuit of the "true" latent reward are unsystematic, random errors or limitations. This causal view licenses treating behavior as *evidence* for the underlying preference state, not as its definition.

  This is where the tension with revealed-preference theory becomes stark. A hardline revealed-preference view asserts that preference *just is* the choice disposition; there is no deeper latent state to infer, only the pattern of choices to describe. Under this view, the very premise of IRL as inferring a "true" reward function driving behavior is misguided. Any observed finite behavior *is*, by definition, optimal with respect to *some* reward function (or preference ordering), and that function is the "correct" one for that behavior. The rationality assumption isn't a helpful prior; it's a tautology. The noise model becomes incoherent – deviations from what? The behavior *is* the optimal expression of preference at that moment.

  The practice you observe—correcting the inferred reward when it seems "wrong" based on human feedback or common sense—fatally undermines the pure revealed-preference stance within the field's actual workflow. When a practitioner looks at the inferred reward, sees it would incentivize something absurd or dangerous that the human would reject, and manually tweaks it or re-regularizes, they are implicitly rejecting the revealed-preference interpretation of the behavior they just observed. They are saying: "This behavior *cannot* be taken at face value as revealing the human's true preference. There must have been error, misunderstanding, or an unmodeled constraint." They are privileging the human's *verbal report* or *hypothetical judgment* (elicited after the fact or implicitly assumed) over their *actual observed behavior* as better evidence for the underlying preference state they wish to recover. This act presupposes that the true preference is a stable mental state that can be imperfectly expressed in action but more directly accessed (or at least, better approximated) through deliberate reflection and communication. It's a shift back to the causal model.

  The inconsistency between IRL and RLHF branches of the pipeline is real under this lens. IRL (in theory) treats behavior as primary evidence for latent preference. RLHF treats explicit comparative judgments as primary evidence. The field often runs both, creating a hierarchy of evidence: Explicit judgments are treated as more direct and reliable signals of the "true" preference than observed behavior, especially when behavior seems suboptimal or leads to nonsensical reward functions. The noise model in IRL (unsystematic error) is quietly intended to make the recovered preference something the human *would* endorse upon reflection or in ideal conditions. When the human complains about the inferred reward, it reveals that the noise model failed to account for *systematic* error (cognitive biases, environmental distractions, skill limitations, temporary lapses) contaminating the behavioral signal. The correction is an admission that the assumed noise model was insufficient and that explicit communication provides a cleaner, though still imperfect, signal to the latent state.

  Switching entirely to a hardline revealed-preference view would force drastic changes inconsistent with current practice. IRL would become purely descriptive: The inferred reward function is simply a compact representation of the observed choice pattern, with no claim about underlying intent or future behavior. There would be *nothing* to "correct" when the reward looks absurd; that absurd reward *is* the preference revealed by that specific behavior. Complaints from the human would be irrelevant data points about their *current* stated preferences, not corrections to a misinferred latent state. RLHF would become the *only* way to define preferences, as explicit choices over options presented. The very notion of "inferring" a deeper reward from behavior for future use would vanish. The field's pragmatic goal of building agents that pursue what humans *intend* or *value deeply*, even amidst behavioral noise or error, is fundamentally incompatible with strict revealed preference. The current practice, messy as it is, reflects an unavoidable, albeit often unarticulated, commitment to a causal model where preferences exist beyond mere choices, and where different forms of human feedback provide differing levels of access to them, with explicit judgments generally trumping noisy behavioral traces when conflicts arise. The underdetermination exists, but the correction step reveals which theory is actually being leaned on when the chips are down.
