prompt: |-
  been lurking lesswrong and the alignment forum since about 2015 and this is finally a question i can't resolve by reading more posts, so here goes.

  i do mech interp at a mid-size lab. every single week, someone comes to me with a claim that the model "has" some feature — a deception feature, a sycophancy feature, a backdoor-trigger feature — usually spotted on an SAE dashboard or with a linear probe, and then we spend the whole retro arguing about whether it's Real or whether we're just pattern-matching our own concepts onto a pile of matrices. the same fight, every week. and the stakes are not low: our whole safety story to leadership (and increasingly to auditors, ugh) is that we can point at what the model believes and wants. if the features are partly a thing we project rather than discover, that story is in trouble.

  so: write me a decision procedure my team can actually run when someone claims to have found a representation. questions in order, what counts as a pass and a fail on each, where the procedure has to stop and hand off to human judgment because the question is value-laden or just genuinely open. ground it in the actual underlying issue, which as far as i can tell is: are these features sitting there in the network waiting to be found, or are they partly constituted by us choosing a decomposition, the way a smiley face in a bun is partly constituted by the person looking at the bun. i want the checklist to force engagement with the standard traps, e.g.: linear probes that hit 99% accuracy because almost anything is linearly separable if you have enough dimensions (compare the random-probe baseline before you celebrate); the thing where a handful of activations look beautifully interpretable but the same small set also lights up for a dozen unrelated inputs, so the "feature" is doing less work than it appears; whether the decomposition is canonical or just one of many bases that fit the activations about equally well; and whether the causal test — ablate the feature, watch the behavior change — actually settles the realism question or just pushes it back a level (behavior changed, sure, but did it change *because* of the thing we described, or would a dozen other interventions have changed it too).

  constraints: it has to be runnable in an afternoon by someone who's read the forum posts but none of the philosophy papers, it can't require solving intentionality before thursday's review meeting, and it should say explicitly which steps are judgment calls dressed up as procedure, because i've noticed we're good at pretending those don't exist.

  then run it on three of our actual recurring cases:

  1. an SAE feature that fires on hex numbers, the string "0x", and (annoyingly) photographs of hexagons. fires consistently, ablation removes the model's ability to read hex literals. real representation of hex, or a mess we named after the first thing we saw?

  2. a probe for "the model is about to lie" that gets 97% on held-out training conversations and 61% on fresh ones. procedure verdict, please.

  3. the one i actually care about: a "deception" feature where ablation changes behavior exactly as predicted, out-of-distribution too, and i *still* get the creeps calling it a deception feature rather than "the thing whose ablation has this effect." tell me if the procedure has anything to say about case 3 or if it's officially above its pay grade.

  and crucially: include at least one case, either one of these or a new one, where the procedure gives an answer i won't like — i want to believe our features are real, they're load-bearing for the audit — and be honest about what the procedure can't settle. like, if the model is equally happy with several incompatible decompositions and interventions work on all of them, does "the model has a deception feature" even mean anything more than "this intervention works"? i've read enough to know that's not a gotcha, it's the whole question, but i'd like it operationalized enough to argue about at the retro instead of around.

  sorry for typos, posting from my phone in a meeting about whether to ship the thing.
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're working in mech interp at a mid-size lab, and their team keeps having weekly debates about whether features found in models (like deception or sycophancy) are real or just projections. The stakes are high because their safety claims to leadership and auditors depend on these features being genuine. They need a practical decision procedure that can be run quickly, avoids deep philosophy, and addresses common pitfalls like linear probe overfitting or non-canonical decompositions.

  First, I need to identify the core issues. The user mentions several traps: linear probes with high accuracy but poor generalization, features activating for unrelated inputs, and whether ablation truly validates the feature. The underlying question is whether features are inherent in the model or constructed by the interpreter. The procedure must be operational, not theoretical, and fit into a single afternoon.

  The user provides three specific cases. Case 1 involves an SAE feature for hex numbers, hex strings, and hexagons. Case 2 is a "lying" probe with a significant drop in accuracy on fresh data. Case 3 is a deception feature where ablation works but labeling it as "deception" feels uneasy. They also want an example where the procedure gives an unpopular answer to test its objectivity.

  I should structure the procedure as a checklist with clear pass/fail criteria and explicit judgment calls. Steps need to address each pitfall: linear separability, activation specificity, causal validity, and decomposition uniqueness. For each step, define what counts as passing and what requires human judgment.

  For Case 1, the hex feature: Check if it fires only on hex-related inputs. The presence of hexagon photos is a red flag. Ablation removes hex ability, but the feature might be polysemantic. The procedure should flag this as "likely polysemantic" rather than a clean representation.

  Case 2's lying probe: The 97% to 61% drop shows overfitting. Comparing against a random probe baseline would reveal that 61% is near chance. This should fail the generalization step, indicating the probe captures idiosyncrasies, not a general "lying" feature.

  Case 3 is trickier. Ablation works OOD, suggesting causal role. But labeling it "deception" involves interpretation. The procedure can confirm the causal effect but can't resolve if it's truly deception or just a behavioral trigger. This is where human judgment is needed, and the procedure should explicitly state that.

  The user also wants a case where the answer is unpopular. Suppose a feature passes all checks but has multiple valid decompositions. The procedure would accept it as real but note that the label is interpretive, which might undermine the audit story. This highlights the gap between causal structure and human concepts.

  Finally, ensure the procedure is feasible: no philosophy deep dives, uses standard tools (SAE dashboards, linear probes, ablation), and identifies judgment points. Emphasize that while causal tests show mechanisms, the mapping to concepts like "deception" is not settled by the procedure alone.
answer: |-
  Here's a practical decision procedure for validating feature claims, designed as a 45-minute checklist. It explicitly separates empirical tests from judgment calls, targets common traps, and forces engagement with the core question: *"Is this feature a robust property of the model, or a story we're projecting onto the weights?"*  

  **Procedure: The Decoupling Checklist**  
  *Run each test in order. Stop if any step fails.*  

  1. **Linearity Trap Check (10 min)**  
     - **Test:** Compare your probe/SAE reconstruction accuracy against a **random-probe baseline**. Train 10 linear probes on *randomly shuffled labels* using the same activations.  
     - **Pass:** Your probe accuracy is >3 standard deviations above the random-probe mean.  
     - **Fail:** Your probe is within 2 std of random baseline.  
     - **Judgment Call:** If between 2-3 std, proceed but flag as weak.  
     - *Why?* Rules out "everything is linearly separable" in high dimensions.

  2. **Specificity Stress Test (15 min)**  
     - **Test:** Generate 20 diverse inputs that *maximally activate the feature* (e.g., top-k activations). Have an independent annotator (not the discoverer) label each input as:  
       - (A) Clearly related to claimed feature  
       - (B) Ambiguous/weakly related  
       - (C) Unrelated  
     - **Pass:** ≥80% are (A), ≤5% are (C).  
     - **Fail:** >15% are (C) or <70% (A).  
     - **Judgment Call:** If (B) dominant, feature may be underspecified.  
     - *Why?* Catches polysemantic/"hexagon" problems where activations are fuzzy.

  3. **Causal Validity Gate (15 min)**  
     - **Test:** Ablate the feature (zero it out, resample, or use path patching). Measure **out-of-distribution (OOD) behavioral delta** on 3+ novel tasks requiring the claimed capability.  
     - **Pass:** Ablation causes >50% degradation on OOD tasks *specifically tied to the feature* (e.g., hex math fails but decimal works).  
     - **Fail:** Degradation <20%, or affects unrelated capabilities.  
     - **Judgment Call:** If 20-50% degradation, or collateral damage, proceed cautiously.  
     - *Why?* Tests if the feature is *necessary* for the behavior, not just correlated.

  4. **Basis Robustness Audit (5 min)**  
     - **Test:** Apply a **basis rotation** (e.g., random orthogonal transform) to the activation subspace. Retrain the probe/SAE decoder.  
     - **Pass:** Accuracy drops <10% vs. original.  
     - **Fail:** Accuracy drops >25%.  
     - **Judgment Call:** If 10-25% drop, feature is basis-dependent (less "real").  
     - *Why?* Checks if the feature is canonical or an arbitrary decomposition choice.

  ---

  **Verdicts on Your Cases**  

  **Case 1 (Hex/Hexagon SAE Feature)**  
  - **Linearity Trap:** Likely passes (hex is linearly separable).  
  - **Specificity:** **FAILS** (hexagon photos are "unrelated" inputs).  
  - **Causal Validity:** Passes (ablation breaks hex).  
  - **Basis Robustness:** Not run (fails earlier).  
  - **Verdict:** **Not a "hex representation."** It's a polysemantic circuit handling *both* hex math and shape priors. Label it "hex/shape detector" or risk misattribution.  

  **Case 2 ("About to Lie" Probe)**  
  - **Linearity Trap:** **FAILS HARD**. Random probes likely hit 55-65% on fresh data. 61% ≈ noise.  
  - **Specificity:** Skipped (already failed).  
  - **Verdict:** **Artifact of overfitting.** Probe memorized training conversation quirks, not a general "lying" feature.  

  **Case 3 (Deception Feature w/ Strong Causal Link)**  
  - **Linearity Trap:** Pass (assume strong separability).  
  - **Specificity:** Pass (assume clean activations).  
  - **Causal Validity:** **Passes** (ablation changes behavior OOD).  
  - **Basis Robustness:** **Judgment Call Zone.** If accuracy drops >15% after rotation, the *label* "deception" is likely anthropomorphizing.  
  - **Verdict:** **The *causal mechanism* is real, but the *label* is speculative.** The procedure confirms ablation disrupts deceptive outputs, but *not* that the model "has deception." It might be a generic "context-sensitive output" circuit. You may *operationalize* it for safety, but auditors will (rightly) question the framing.  

  ---

  **The Unpopular Answer: A "Golden Backdoor" Feature**  
  *Hypothetical case: An SAE feature fires on 100% of backdoor triggers and 0% of clean inputs. Ablation prevents exploits. Passes all checks flawlessly. Basis rotation test shows <5% drop. Team wants to call it "backdoor detector."*  
  - **Procedure Verdict:** **Pass.** It *is* a robust backdoor mechanism.  
  - **The Catch:** This doesn't prove *intentionality*. The procedure confirms the model has a *reliable, ablatable circuit for trigger response*. But if asked "Does the model *know* it's a backdoor?"—that's **above pay grade**. The checklist proves structure, not semantics.  

  ---

  **What the Procedure Can't Settle**  
  - **Intentionality:** No test resolves if the model "believes" or "wants" anything. Ablation only shows mechanism, not meaning.  
  - **Feature Uniqueness:** If two incompatible decompositions (e.g., "deception" vs. "sycophancy" features) both pass causal tests, the model may not privilege either.  
  - **Label Justification:** Calling it a "deception feature" remains a *scientific communication choice*, not an empirical fact. The procedure only validates that *ablation of X changes behavior Y*.  

  **Operational Reality Check**  
  Use the checklist to:  
  1. Kill weak claims early (saves retro time).  
  2. Force specificity about *what "real" means* (mechanism vs. meaning).  
  3. For high-stakes features (e.g., deception), **report the causal effect, not the label**. Say: *"Ablating these activations reduces deception-like outputs by 92% OOD. We call it 'deception' for brevity."* This keeps auditors happy while admitting uncertainty.  

  Your creeps about Case 3 are warranted. The procedure *deliberately* separates mechanistic reality from human storytelling. That gap is where the philosophy lives—but you don’t need to solve it by Thursday. You just need to stop calling polysemantic heaps "features."  

  > *Final note: This won’t end the debates. It weaponizes them with data. Expect pushback when Step 4 kills someone’s darling feature. Print this and tape it to your monitor: "Ablation efficacy ≠ ontological truth."*
