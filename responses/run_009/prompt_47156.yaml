answer: |-
  Your diagnosis is sharp, and I think you've put your finger on the central nerve of the stalemate. Your hypothesis that the core disagreement is fundamentally *metaepistemological* – a clash about the standards for non-question-begging justification – captures the persistent looping dynamic remarkably well. But let's dissect it further, see where it aligns perfectly with the moves, where there might be additional layers, and whether any path forward exists.

  **The Core: The Metaepistemological Standoff**

  You're absolutely right that both sides largely agree on the scientific and phenomenological facts: evolutionary pressures *did* profoundly shape the cognitive mechanisms underlying our moral judgments, favoring traits promoting cooperation, kin altruism, reciprocity, aversion to harm, etc., within ancestral environments. The disagreement erupts over what this *implies* for the justification of our moral beliefs, *if* one assumes moral realism (mind-independent moral facts).

  1.  **The Debunker's Charge (Street, Joyce):** Granting realism, the evolutionary shaping presents a *coincidence problem*. Why think a process selecting for *fitness* (reproductive success) would reliably produce cognitive mechanisms tracking *moral truth*? The realist needs an explanation for this alignment that doesn't simply *assume* the reliability of our moral faculties. To offer an explanation like "Well, promoting survival *is* good" (a third factor like survival itself being valuable, or flourishing being good) is to *use* the very moral judgments/facts whose reliability is under skeptical pressure. This, Street insists, is viciously circular; it "begs the question" against the evolutionary skeptic. The debunker demands a justification for trusting our moral faculties that doesn't presuppose the truth of the outputs of those faculties or the moral facts they purport to track. They see this as analogous to demanding a justification for trusting a thermometer that doesn't presuppose its readings are accurate.

  2.  **The Realist's Defense (Enoch, Wielenberg, Brosnan, Schafer):** The realist counters that the debunker's demand is impossibly stringent and unfairly applied *only* to the moral domain. We don't demand a non-circular justification for trusting our perceptual faculties *before* we accept perceptual beliefs. We start from a position of *default trust* (epistemic conservatism) in our basic cognitive faculties (perception, memory, deduction, perhaps induction) and require positive reasons for *distrust* in specific contexts. The evolutionary story, the realist argues, *is* a reason for *scrutiny* of moral beliefs, but not automatically for *global distrust*. They offer "third-factor" explanations precisely as accounts showing why the alignment between evolutionary fitness and moral truth *isn't* a massive coincidence: because the moral facts themselves *concern* (or are constitutively linked to) things like survival, flourishing, social cooperation, well-being – the very things natural selection *was* selecting for. Enoch’s "reliability assumption" is key: if realism is true, we *must* assume our faculties are at least somewhat reliable (absent specific defeaters), just as we do elsewhere. Denying this reliability *because of* evolution, they argue, presupposes the realist framework (the existence of independent facts our faculties might fail to track) but then applies a skeptical standard we reject elsewhere. They see the debunker's insistence on a "non-question-begging" justification that avoids *any* moral premises as itself smuggling in a substantive (and skeptical) epistemological commitment – one we wouldn't apply to perception.

  **The Loop:** Street replies: "But you *can't* just *assume* reliability in the moral domain like you do in perception, precisely *because* of the evolutionary story! The analogy fails because perception *was* plausibly selected for tracking truth (about the immediate environment), while moral judgment was selected for fitness. Your 'third factor' still relies on moral premises that are only justified *if* your faculties are reliable, which is what's in question." The realist reiterates: "Demanding justification without *any* reliance on the contested faculty is an incoherent standard that would cripple all justification everywhere. The evolutionary story is a defeater only if we have reason to think fitness and truth *diverge* significantly, which your skepticism prevents us from establishing without begging the question *against* realism." And around it goes.

  **Your Hypothesis Confirmed (Mostly):** This *is* fundamentally a metaepistemological clash. It's about:
  *   **The Burden of Proof:** Does the evolutionary story shift the burden to the realist to *prove* reliability from neutral ground, or does the burden remain on the debunker to show *why* evolution *specifically undermines* reliability, given the default trust?
  *   **The Scope of Epistemic Conservatism:** Does the principle that we are prima facie justified in trusting our basic cognitive faculties extend to our *evaluative* faculties? Or is there something special about the moral domain (e.g., its prescriptive force, its alleged lack of causal connection to facts) that excludes it?
  *   **The Permissibility of "Circularity":** Is the realist's appeal to moral facts within their explanation of reliability a vicious, question-begging circle, or is it a benign, inevitable feature of any "tracking" explanation (like appealing to perceptual facts to explain perceptual reliability)?

  **Where the Hypothesis Might Need Nuance: Substantive Disagreements in the Margins**

  While the metaepistemological clash is the engine of the stalemate, there *are* subsidiary points where more substantive disagreements poke through, though they often get pulled back into the meta-framework:

  1.  **The Magnitude of the Coincidence:** Realists often argue the "coincidence" isn't actually that improbable. If moral facts are *about* human flourishing/social coordination (as many realists hold), and evolution shaped us *for* fitness (which in social creatures *involves* flourishing/coordination), then *some* significant overlap is unsurprising. Debunkers retort that this downplays the vast scope of *possible* moral truths and the potential for radical mismatch (e.g., what if the true morality demanded sacrificing offspring constantly? Evolution wouldn't select for *that*). The debate here hinges on the realist's specific account of the *content* of moral facts and how tightly linked it *must* be to fitness. But this quickly loops back: the debunker will argue the realist's chosen account of moral content is *itself* likely a product of evolutionary forces, not independent insight.
  2.  **The Analogy to Perception/Induction:** Is the analogy strong? Realists hammer it: evolution plausibly shaped perception *for* truth-tracking in relevant domains. Debunkers argue the analogy is weak: moral "facts" (if they exist) aren't causally efficacious in the same way physical objects are, so there's no clear mechanism for "tracking." Realists counter that abstract mathematical truths aren't causally efficacious either, yet we trust our mathematical intuitions (which also have evolutionary origins). This debate about the *disanalogies* between domains is substantive, but it feeds *into* the meta-question: *Do these disanalogies justify withholding default trust from moral faculties?* The answer depends on prior epistemological commitments.
  3.  **"Off-Track" Moral Beliefs:** Debunkers point to specific moral beliefs that seem clearly fitness-enhancing but potentially morally wrong (e.g., intense tribalism, certain mating preferences). Realists respond that evolution explains the *tendency*, but our reflective capacities allow us to *correct* these crude outputs towards the truth (a process itself perhaps selected for). This is a substantive point about the *extent* of evolutionary influence vs. rational refinement, but again, the debunker questions whether this "refinement" is genuinely tracking independent truth or just another layer of evolved intuition.

  **Why the Stall? The Nature of the Disagreement and Prospects for Progress**

  The stall is profound because:

  1.  **Foundational Clash:** The disagreement sits at the intersection of metaphysics (moral realism) and epistemology (standards of justification). It challenges the deepest presuppositions about how justification works and which domains deserve default trust. Such clashes are notoriously hard to resolve because the tools of argument presuppose the very epistemological frameworks in dispute.
  2.  **Self-Sealing Arguments:** Both positions have a self-sealing quality. The debunker interprets any realist move as question-begging. The realist interprets the debunker's demand as imposing an impossibly skeptical standard that begs the question *against* conservatism. Each side sees the other as violating fundamental norms of reasoning, norms they themselves define differently.
  3.  **Lack of Neutral Ground:** There is no agreed-upon, metaphysically and epistemologically neutral vantage point from which to adjudicate. Any proposed "neutral" criterion (e.g., "explain without moral premises") is *itself* a substantive epistemological commitment contested by the realist.

  **Is Progress Possible? Glimmers, but No Breakthrough Likely:**

  1.  **Sharpening the Metaepistemology:** Progress might involve deeper exploration *of the metaepistemological clash itself*. Can we get clearer on *why* we accept default trust in perception? Is it purely its causal connection to the world? Its predictive success? Its intersubjective concordance? Does moral judgment share enough of these features? Work on the epistemology of other "problematic" domains (math, logic, modality) might offer comparative insights. However, this risks just pushing the debate one level higher.
  2.  **Internal Challenges/Refinements:** Progress might come from *within* each camp refining their positions against internal difficulties. Can realists give a more compelling, less question-begging-sounding account of the "third factor" or the content of moral facts that minimizes the apparent coincidence? Can debunkers articulate their skeptical standard more precisely to avoid the charge of global skepticism and better explain why moral judgment is uniquely vulnerable? This leads to incremental refinement, not resolution.
  3.  **Focusing on Specifics:** Shifting focus *away* from global realism vs. antirealism and towards debunking *specific classes* of moral beliefs (e.g., deontological intuitions vs. consequentialist ones) using evolutionary psychology might yield more tractable, empirically informed debates about the origins and justification of *particular* judgments, potentially bypassing the global metaphysical standoff. However, this concedes the global debate remains stuck.
  4.  **Conceding the Stalemate (Your Point):** The most honest conclusion might be to acknowledge the stalemate stems from fundamentally different, deeply held, and rationally defensible (within their own frameworks) starting points about epistemology and the nature of justification. Recognizing it as a clash of "epistemic cultures" or foundational commitments might be the only way out of the loop. We might say: *Given moral realism, evolutionary considerations do not provide a decisive, non-question-begging reason for global skepticism, but they do force realists into a specific (and contested) metaepistemological stance (robust conservatism extending to evaluative faculties) and demand an explanation for alignment (the third-factor move) that will always sound circular to those who don't share that stance.*

  **Conclusion:**

  You are overwhelmingly correct. The core of the ~15-year stall *is* the metaepistemological disagreement about justification standards and the scope of epistemic conservatism. The substantive points about coincidence, analogies, and specific beliefs are battlegrounds within this larger war, but they don't provide escape routes because their interpretation depends on the meta-commitments. The debate loops because each side's argument is compelling *only if* you already accept their underlying epistemological framework. No new empirical discovery about evolution or moral psychology will resolve this; it will simply be interpreted through the existing lenses. The most likely form of "progress" is either a deeper philosophical understanding of why this clash arises and persists (meta-metaepistemology, perhaps) or a pragmatic shift towards more localized debates about specific moral beliefs or domains, tacitly acknowledging the global metaphysical/epistemological question is intractable at this level of argument. The stall *is* baked in, rooted in incompatible foundational views on how justification works. Recognizing this might be the closest we get to moving forward.
