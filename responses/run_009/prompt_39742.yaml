              k=1: (-1)^1/1 * 0.1 * (1/2) = -0.1 * 0.5 = -0.05
              k=2: (1/2)*0.1*(1/4) = 0.05 * 0.25 = 0.0125
              k=3: (-1/3)*0.1*(1/8) ≈ -0.0041667
              k=4: (1/4)*0.1*(1/16) = 0.025 * 0.0625 = 0.0015625
              k=5: (-1/5)*0.1*(1/32) = -0.02 * 0.03125 ≈ -0.000625
              k=6: (1/6)*0.1*(1/64) ≈ 0.0002604
              k=7: (-1/7)*0.1*(1/128) ≈ -0.0001116

            Sum of these ≈ -0.05 + 0.0125 = -0.0375; 
                       -0.0375 - 0.0041667 ≈ -0.0416667;
                       -0.0416667 + 0.0015625 ≈ -0.0401042;
                       -0.0401042 - 0.000625 ≈ -0.0407292;
                       -0.0407292 + 0.0002604 ≈ -0.0404688;
                       -0.0404688 - 0.0001116 ≈ -0.0405804

            Then add the k=8 contribution: -0.0405804 + 0.025 = -0.0155804.

          This is about -1.56 cents.

          But note: I see a mistake: the term for k is [ (-1)^k * 0.1 * 2^k / k ] * (1/2)^k = 0.1 * (-1)^k / k.

          So the expectation term for k is 0.1 * (-1)^k / k, multiplied by the probability? But wait, the probability is (1/2)^k for k=1..7, and then for k=8 we have a term 0.1 * ( (-1)^8 * 2^8 / 8 ) * (1/128) = 0.1 * (256/8) / 128 = 0.1 * 32 / 128 = 0.1 * 0.25 = 0.025.

          But the term for k=1: 0.1 * (-1)^1 / 1 * (1/2) = -0.1 * 0.5 = -0.05
          k=2: 0.1 * (1)/2 * (1/4) = 0.1 * 0.5 * 0.25 = 0.0125? But 0.1 * (1/2) = 0.05, then times 0.25? That doesn't match.

          Actually, the probability for k=2 is (1/2)^2 = 1/4. So the term is [0.1 * ( (-1)^2 * 2^2 / 2 ) ] * (1/4) = [0.1 * (4/2)] * 0.25 = (0.1*2)*0.25 = 0.2 * 0.25 = 0.05? 
          But note: the formula for the term is: payoff * probability = [ (-1)^k * 0.1 * 2^k / k ] * (1/2)^k = 0.1 * (-1)^k / k.

          So for k=1: 0.1 * (-1)^1 / 1 = -0.1
          for k=2: 0.1 * (1)/2 = 0.05
          for k=3: 0.1 * (-1)/3 ≈ -0.033333
          for k=4: 0.1 * (1)/4 = 0.025
          for k=5: 0.1 * (-1)/5 = -0.02
          for k=6: 0.1 * (1)/6 ≈ 0.016667
          for k=7: 0.1 * (-1)/7 ≈ -0.014286
          for k=8: 0.1 * (1)/8 = 0.0125   [BUT wait, the probability for k=8 is not (1/2)^8? It's (1/2)^7?]

          We have a problem: the formula [ (-1)^k * 0.1 * 2^k / k ] * (1/2)^k = 0.1 * (-1)^k / k.
          This holds for k=1..7. But for k=8, we are including both the case of 7 tails and then head (which would be n=8) and 8 tails (which is also n=8). However, the probability for n=8 is (1/2)^7, not (1/2)^8. So the term for k=8 should be:

            payoff * probability = 3.2 * (1/2)^7 = 3.2 / 128 = 0.025.

          But note: 0.1 * (-1)^8 / 8 = 0.1 * 1/8 = 0.0125, which is half of what it should be.

          How to fix? We defined the payoff for n=8 as 3.2 regardless of the outcome of the 8th flip. The event n=8 has probability (1/2)^7. So we cannot use the formula 0.1 * (-1)^k / k for k=8.

          Therefore, we must compute the expected value as:

            E = 0.1 * [ sum_{k=1}^{7} (-1)^k / k ] + 3.2 * (1/128)

          = 0.1 * [ -1 + 1/2 - 1/3 + 1/4 - 1/5 + 1/6 - 1/7 ] + 0.025

          Calculate the sum: 
            -1 + 0.5 = -0.5
            -0.5 - 0.3333 = -0.8333
            -0.8333 + 0.25 = -0.5833
            -0.5833 - 0.2 = -0.7833
            -0.7833 + 0.1667 = -0.6166
            -0.6166 - 0.1429 = -0.7595

          0.1 * (-0.7595) = -0.07595

          Then -0.07595 + 0.025 = -0.05095

          So the expected value is about -0.051.

      This is what we will use.

      Let's hope the students don't get too many n=8! But it's very unlikely.

      We are ready.
