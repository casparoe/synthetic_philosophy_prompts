  ### In-Class Game Design: Pasadena Paradox Simulation

  #### **Game Rules & Payoff Scheme**
  1. **Objective**: Flip a fair coin until it lands heads. The flip number \(n\) (first head on trial \(n\)) determines your payoff.
  2. **Payoff Formula**:  
     \[
     \text{Payoff} = \frac{(-1)^n \cdot 0.50}{n} \quad \text{(in dollars)}
     \]
     - **Examples**:
       - \(n=1\): Heads on first flip → \(\frac{-0.50}{1} = -$0.50\)  
       - \(n=2\): Tails, then heads → \(\frac{+0.50}{2} = +$0.25\)  
       - \(n=3\): Tails, tails, heads → \(\frac{-0.50}{3} \approx -$0.17\)  
       - \(n=8\): 7 tails then heads (or 8 tails) → \(\frac{+0.50}{8} = +$0.0625\)  
     - **Cap at \(n=8\)**: If no heads in 8 flips, stop and use \(n=8\) (probability = \(1/128 \approx 0.008\)).  
     - **Scaled for feasibility**: Max loss: \($0.50\), max gain: \($0.25\) (for \(n=2\)) or \($0.0625\) (for \(n=8\)). Total cost for 20 trials ≈ $5 (using chocolate coins or real coins).

  3. **Setup**:
     - **Groups**: Divide 10 students into 5 pairs (each pair shares a coin).
     - **Trials**: Each pair plays **4 times** (20 trials total). 
     - **Time**: ~15 minutes (each trial averages 2–3 flips; 20 trials ≈ 50 flips).

  4. **Recording**:
     - Each pair records \(n\) and payoff for each trial.
     - Instructor compiles results on the board in **original order** (e.g., Trial 1: \(n=3\), Payoff = -$0.17; Trial 2: \(n=2\), Payoff = +$0.25, etc.).

  ---

  #### **Phase 1: Play & Pricing**
  - **Play the Game** (15 mins):  
    Pairs flip coins, record outcomes, and report to the board.
  - **Pricing Exercise** (10 mins):  
    Each student answers:  
    1. *Buy Price*: "What would you pay to play this game once?"  
    2. *Sell Price*: "What’s the minimum you’d accept to let someone else play it?"  
    3. *Comparison*: "Is this game better or worse than a sure $0.10?"  
  - **Discussion**: Poll answers. Expected reactions:  
    - Most will offer low buy prices (e.g., $0.05) or negative prices (to be paid to play).  
    - Some will refuse to sell (fear of large loss).  
    - Many will prefer a sure $0.10 over the gamble.  

  ---

  #### **Phase 2: Reordering & Running Averages**
  - **Setup** (5 mins):  
    - Write all 20 payoffs on the board in original order.  
    - Calculate the overall average payoff (e.g., sum payoffs ÷ 20).  
  - **Reordering** (10 mins):  
    1. **Order A (Positive-First)**: Sort payoffs from largest positive to largest negative.  
       - Example: [+$0.25, +$0.25, +$0.17, ..., -$0.17, -$0.25, -$0.50]  
    2. **Order B (Negative-First)**: Sort from largest negative to largest positive.  
       - Example: [-$0.50, -$0.25, -$0.17, ..., +$0.17, +$0.25]  
  - **Running Averages**:  
    - For each order, calculate the running average after each trial:  
      - After trial 1: Average = Payoff₁  
      - After trial 2: Average = (Payoff₁ + Payoff₂)/2  
      - ...  
      - After trial 20: Overall average.  
    - **Plot on Board**: Sketch two line graphs (one per order).  

  - **Key Observation**:  
    - Order A: Starts high (e.g., +$0.25) and slowly declines toward the overall average.  
    - Order B: Starts low (e.g., -$0.50) and slowly rises toward the same overall average.  
    - **Goal**: Students should notice the running averages **drift differently** based on order, yet converge to the same final average.  

  ---

  #### **Debrief & Conceptual Connection** (20 mins)
  1. **What Happened?**:  
     - "In our game, reordering changed the *path* of the running average, but not the final value. Why? Because we have a **finite sample** with a fixed sum. Rearrangement can’t change the total."  

  2. **Link to Conditional Convergence**:  
     - "In the **infinite** Pasadena game, the 'expected value' is \(\sum_{n=1}^{\infty} \frac{(-1)^n}{n}\). This series is **conditionally convergent**."  
     - Key points:  
       - It converges to \(-\ln 2 \approx -0.693\) in natural order (\(n=1,2,3,\dots\)).  
       - But rearranged terms (e.g., positives first) can make it converge to **any number** (or diverge).  
     - **Contrast**:  
       - Finite sample: Order affects partial averages, not the total.  
       - Infinite series: Order changes the *actual sum*.  

  3. **Decision Theory Implications**:  
     - **No Unique Expectation**: "If expectation isn’t a single number, how do we decide?"  
       - Dominance? (Not useful; payoffs are unbounded).  
       - Risk-of-ruin? (Possible; losses can be large).  
       - Reject the framing? (e.g., insist on bounded utility).  
     - **Real-World Takeaway**:  
       - Unbounded, conditionally convergent gambles break standard expected utility.  
       - We need new rules (e.g., "natural order expectation," security levels).  

  ---

  #### **Predictable Pitfalls & Caveats**
  1. **What Goes Wrong**:  
     - **Low \(n\) Skew**: Most trials end by \(n=3\) (probability = \(7/8\)). Few large-\(n\) trials mean:  
       - Rarely see extreme payoffs (e.g., \(n=8\) occurs ~1.5 times in 20 trials).  
       - Sample average likely positive (natural order expectation is negative).  
     - **Reordering "Trick"**: Students may dismiss it as artificial. Emphasize:  
       - "This mimics how rearranging the *infinite series* changes its sum."  
     - **Time Crunch**: If flips run long, use pre-generated \(n\) values (e.g., from a random number generator).  

  2. **Activity vs. Reality Gap**:  
     - **Shown**:  
       - Payoffs are volatile and order-dependent in finite samples.  
       - Decisions vary widely (ambiguity aversion dominates).  
     - **Asserted**:  
       - As trials → ∞, the sample average **would not converge** under rearrangement.  
       - True expectation is undefined without specifying order.  
     - **Bridge the Gap**:  
       - "Our game is truncated, but the paradox arises because the infinite series **never settles**. No matter how many trials, rearranging the *theoretical* terms changes the limit."  

  ---

  #### **Logistics & Timing**
  - **Total Time**: 75 mins = Play (15) + Pricing (10) + Reordering (15) + Debrief (20) + Buffer (15).  
  - **Materials**: Coins, recording sheets, board, calculator.  
  - **Pre-Game Hint**: "Today we’re simulating a game with chaotic payoffs—watch how the order of results affects your intuition!"  

  This design ensures active engagement, highlights conditional convergence intuitively, and sparks debate on decision theory—all while keeping stakes low and time tight.
