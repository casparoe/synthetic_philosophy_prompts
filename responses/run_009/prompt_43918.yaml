    "cost": "The diachronic Dutch book argument only justifies conditionalization for learning certainties; it cannot, by itself, condemn all other update rules or show they avoid exploitation.",
    "concessions": "Predictable rational changes *can* sometimes be exploited by a bookie with foreknowledge, and vulnerability to such exploitation isn't solely indicative of irrationality; the diachronic argument doesn't warrant conditionalization for uncertain evidence or forgetting.",
    "verdict": "synchronic argument survives"
  }
