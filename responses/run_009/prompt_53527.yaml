prompt: |-
  I run a Thursday-night philosophy discussion group that meets in the back of a secondhand bookshop — a couple of retirees, a nurse, two CS grad students, none of them philosophers. Next session is on knowing-how vs. knowing-that, Ryle's distinction, and I've got 90 minutes and a whiteboard. Don't explain the distinction to me; plan how I should explain it to them.

  A few constraints from past disasters: if the central example is a skill the audience doesn't have, half the room goes into spectator mode. So the carrying example has to be something every person in that room can actually do — and please don't use riding a bicycle. Someone tried that at a session I attended and got "it's just muscle memory," and the whole evening went sideways. You pick the example, but tell me what work it has to do, and what it must not do.

  There are two hard cases I want slotted in somewhere, you decide where: the concert pianist who loses the use of her hands but insists she still knows how to play, and the plain fact that "I know how to get to the station" looks like it's just knowledge of a fact. And I keep going back and forth on whether to bring in the intellectualist stuff at all — the recent-ish line, Stanley and Williamson or whoever, that knowing-how is secretly a kind of knowing-that after all. Make that call for me: in or out, and why. Don't quote anyone at me, I just want the position.

  Misconceptions: I can already predict "Ryle thinks skills are mindless" and "knowing how is just knowing that plus practice." Where exactly in the sequence should I head each one off? And is the "category mistake" framing worth using, or is it jargon that loses a bookshop crowd?

  Give me one closing question that would show me they actually got it rather than nodding along, and name one thing I should openly refuse to explain at this level.

  Format: start with the bottom line in your first sentence — the carrying example and what comes first, full stop — then the reasoning, no preamble and no restating my question back at me. Take definite positions on everything; if you hand me a menu of options and tell me to choose, I will be annoyed. And write the reply in British English — half the group are Brits and I'd definately never hear the end of it otherwise.
reasoning: |-
  Alright, let me tackle this step by step. The user runs a philosophy group with non-philosophers and needs a plan for explaining Ryle's knowing-how vs. knowing-that in 90 minutes. Key constraints: avoid specialized skills, handle two hard cases, decide on including intellectualism, address misconceptions, and use British English.

  First, the carrying example. The user vetoed bicycles and wants something universal. Tying shoelaces comes to mind—everyone can do it, it's mundane, and involves steps that can be verbalized but doing it isn't just reciting steps. That should prevent the "muscle memory" objection. Need to ensure the example shows that knowing-how isn't reducible to knowing-that.

  Next, the sequence. Start with the shoelace exercise to engage them immediately. Then introduce Ryle's distinction using their experience. The "lost in a familiar place" scenario can segue into the station hard case. Later, the pianist case challenges whether knowing-how requires physical ability. 

  Intellectualism: Exclude it. The user mentioned past disasters, and diving into Stanley & Williamson could derail the session. Focus on Ryle's original argument to keep it accessible. 

  Misconceptions: Address "skills are mindless" after the shoelace example by highlighting attention and adjustment. Counter "knowing-how as knowing-that plus practice" when discussing the pianist, showing that practice builds non-propositional knowledge. 

  Category mistake: Avoid the jargon. Use "confusing two different kinds of knowledge" instead. 

  Closing question: Ask for a new example distinguishing knowing-how from knowing-that. This tests their application. Refuse explaining the intellectualist response to keep focus. 

  British English: Use terms like "learnt" and "whilst" naturally. Check spelling and phrases to avoid Americanisms. 

  Now, structure the plan: Start with shoelace activity, define the distinction, address hard cases, tackle misconceptions, end with the closing question. Keep timing in mind—90 minutes total. Allocate time for each section, ensuring discussion doesn't run over.
answer: |-
  Right. **Start by having everyone tie their shoelaces (or perform an equally simple, universal skill like kneading dough or stirring tea 'properly'), then immediately dissect what they just did to introduce the distinction between knowing-*how* and knowing-*that*.**

  **The Plan (90 Mins - British English):**

  1.  **Hook & Embodied Example (10 mins):** "Right, everyone. Bit daft, but humour me. Please untie and then re-tie one of your shoelaces. Go on." *Let them do it.* "Now, whilst you do that *again*, consciously, tell me *exactly* what steps you're taking with your fingers. No, really, narrate it." *Chaos ensues; people fumble, laugh, struggle to articulate*. "Brilliant. You all *knew how* to tie it a second ago. Why was describing it *whilst* doing it so awkward? That fumbling is our starting point."

  2.  **Introducing Ryle's Distinction (15 mins):** *Whiteboard two columns: **Knowing-How** | **Knowing-That***.
      *   "What you *did* instinctively is **Knowing-How**: a skill, ability, capacity. It's *doing* something successfully (like tying the lace). It often involves knack, feel, practice, adjustment. It's 'knowledge' displayed *in action*."
      *   "What you *tried* (and failed) to articulate whilst doing it is **Knowing-That**: factual, propositional knowledge. 'The lace goes under the loop', 'You pull the ends tight'. It's statements that can be true or false, written down, memorised."
      *   **Key Point:** "Ryle's punchline: Knowing-How is *fundamental* and *different in kind* from Knowing-That. You can *have* the Knowing-How *without* being able to list all the Knowing-That. Like you lot just proved!"

  3.  **Tackling First Misconception - "Skills are Mindless" (10 mins):**
      *   *Anticipate:* "Someone might say, 'But tying a lace is just muscle memory, automatic, mindless!' Hold on."
      *   *Counter:* "Was it *really* mindless when you first learnt? Remember the concentration, the failures? Even now, if the lace is stiff or short, you *adjust* – that's intelligence! Ryle isn't saying skills are *unthinking*, he's saying the intelligence is *in the doing*, not necessarily in reciting rules beforehand. A skilled carpenter *sees* the wonky joint and adjusts the planing – that's intelligent know-how, not just reflexes."
      *   **Where:** Immediately after defining the distinction, using the shoelace awkwardness as proof it's *not* mindless.

  4.  **Hard Case 1: "I know how to get to the station" (15 mins):**
      *   *Pose the problem:* "Right, tricky one. I say, 'I know how to get to the station.' That sounds like Knowing-How, a skill (navigating). But I could also just *tell you* the fact: 'Go left at the pub, straight on for half a mile.' That sounds like Knowing-That! Which is it?"
      *   *Rylean Resolution:* "Ryle argues this *is* primarily Knowing-How. The crucial test: Can you *actually do it*? If you get hopelessly lost trying to follow your own directions, you *didn't* really know *how* – you just knew *that* some facts *about* the route. Knowing the facts *helps*, but the ability to *successfully navigate* (deal with a closed road, spot the landmarks) is the Knowing-How. The phrase is shorthand for the *ability* guided by knowledge, not *just* the knowledge."
      *   **Work it does:** Shows how propositional knowledge often *supports* or *guides* know-how, but isn't identical to it.

  5.  **Tackling Second Misconception - "Know-How = Know-That + Practice" (10 mins):**
      *   *Anticipate:* "Another common thought: 'Knowing-How is just Knowing-That *plus* practice, right? You learn the rules (Knowing-That) and then drill them until they're automatic.'"
      *   *Counter (Using Shoelace & Station):* "But remember tying your lace – did you learn by memorising propositions first? Likely not! You watched, tried, failed, adjusted. The *doing* came first. Practice isn't just making facts automatic; it's *acquiring a new ability* that transcends the initial instructions. Knowing the *fact* 'turn left at the pub' doesn't magically become the *skill* of navigating when you walk it repeatedly; the skill involves perception, timing, correction that the facts alone don't give you."
      *   **Where:** After resolving the Station case, as it directly challenges the "just facts + practice" idea.

  6.  **Hard Case 2: The Concert Pianist (15 mins):**
      *   *Present:* "Our pianist, a true virtuoso, has a terrible accident. She loses the use of her hands. She can no longer play. Yet she insists, passionately, 'I still *know how* to play!' Is she right? Or is she deluded?"
      *   *Rylean Resolution:* "Ryle would likely say she *is* right... but with a caveat. What she retains is the vast network of *intellectual* knowledge *about* playing (Knowing-That: music theory, fingerings for specific pieces, interpretation ideas). Crucially, she also retains the *critical capacity* – she can listen to a student play and *tell* them exactly what's wrong and how to fix it. *That* is a form of Knowing-How – the *skill* of musical analysis and instruction. But the specific Knowing-How of *physically playing* the piano? That ability is, tragically, gone. So, she knows-how *in certain crucial respects*, but not in the primary sense of physical performance."
      *   **Work it does:** Sharpens the distinction by showing know-how is multi-faceted and context-dependent, and that intellectual knowledge *about* an activity is distinct from the embodied skill itself.

  7.  **Intellectualism? OUT. (5 mins - Explicitly State):** "Now, some modern philosophers argue Ryle was wrong. They say Knowing-How *is* just a special kind of Knowing-That – perhaps knowing facts under a 'practical mode of presentation'. We won't go there tonight. Why? Two reasons: Firstly, Ryle's core distinction – that the *ability* is different from the *proposition* – is powerful and useful on its own. Secondly, diving into that debate requires logic and jargon that would eat our time and likely obscure the initial insight. Stick with Ryle tonight; it gives you the essential tools."

  8.  **"Category Mistake"? Avoid the Jargon. (Embedded):** Don't use the term "category mistake". Instead, *show* it: "The mistake Ryle attacks is *confusing* these two fundamentally different kinds of knowledge – thinking that explaining the Knowing-That rules *is* the same as explaining the Knowing-How ability, or that having the Knowing-That automatically gives you the Knowing-How. Our shoelace exercise showed that confusion perfectly." The *concept* is used implicitly throughout.

  9.  **Synthesis & Closing Question (10 mins):**
      *   Recap the whiteboard: Knowing-How (Ability, Skill, Shown in Action) vs. Knowing-That (Fact, Proposition, Stated as Truth).
      *   **Closing Question (The Test):** "Give me an example of something *you* know how to do well. Now, tell me: **What's one crucial aspect of *doing* that thing successfully which simply *cannot* be fully captured by writing down a set of instructions (Knowing-That) for someone else?**" (Listen for answers focusing on judgement, timing, feel, adaptation, perception – the non-propositional elements).
      *   **What to Refuse:** "I won't delve into the specific arguments *against* the modern intellectualist position (Stanley, Williamson, etc.) tonight. That requires unpacking complex ideas about propositions and modes of presentation that go beyond our scope. Grasping Ryle's positive distinction is our goal."

  **Why This Works:**

  *   **The Example:** Tying shoelaces/kneading/stirring is universal, immediate, and perfectly demonstrates the inability to fully articulate the *doing* while doing it. It avoids the "muscle memory" dead end by focusing on the *intelligent adjustment* required even in simple acts.
  *   **Flow:** Starts concrete, builds through problems and misconceptions, uses hard cases to deepen understanding, ends with application.
  *   **Misconceptions:** Headed off *proactively* where they naturally arise in the sequence.
  *   **Intellectualism Out:** Keeps it focused, accessible, and true to Ryle's core insight without getting bogged down.
  *   **Closing Question:** Forces them to apply the distinction to their own experience, revealing if they grasp the non-propositional core of know-how.
  *   **British English:** Sorted. "Learnt", "whilst", "brilliant", "daft", "sorted", "pub", etc. Weave it in naturally.
