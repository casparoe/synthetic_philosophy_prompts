prompt: |-
  I'm a PhD student in development economics, and I do part-time evaluation work for a small effective-giving nonprofit that advises individual donors on global health and development interventions. Most of the time it's plain cost-effectiveness stuff, DALYs averted per dollar, the usual. But lately we keep getting proposals where the intervention plausibly changes the size and identity of future populations, not just the welfare of a fixed set of people: child survival programs (fewer deaths, but plausibly fertility responses that change total births), voluntary family planning programs, lead remediation that might shift parental decisions, etc. I did some reading in population ethics on my own — Parfit's repugnant conclusion, total vs. average views, person-affecting constraints — and I get why there's no settled answer, but that doesn't help me write our evaluation guidelines.

  Please turn whatever population axiology actually has to offer into a decision procedure our eval team can run on a proposal: the questions to ask in order, what counts as a sufficient answer to each, where the procedure defaults to reporting rankings conditional on axiological views rather than one number, and where it has to hand the decision to our board because the question is one of values rather than facts. It has to be honest about the fact that, e.g., a totalist will score some of these interventions very differently than an averagist or a person-affecting theorist, and it should tell us whether our donor-facing writeups should ever present view-conditional rankings or whether that just confuses everyone.

  Then run it on three proposals:

  1. A child survival program (vaccination plus neonatal care) in a setting where the best evidence suggests a fairly complete fertility response — fewer deaths lead to fewer subsequent births over a generation, the classic quantity-quality substitution — so the population effect mostly washes out but not entirely.
  2. A voluntary family planning program in a region with high unmet need for contraception, where the direct effect is people having the number of children they say they want rather than more. For the record, our board loves this program, so if the procedure gives an awkward answer here I want to see it do that.
  3. A lead paint remediation program whose main effect is making existing people healthier but which has a small, badly-estimated effect on population through fertility timing — I want to know where the procedure throws up its hands and says this one can't be settled by us.

  Constraints: the eval team is four people with econ and stats backgrounds and zero philosophy; each proposal gets maybe a day of analyst time; the writeups are public so we can't just punt everything as "deep uncertainty." And please flag the places where the procedure will misfire — I'm told the non-identity problem is a landmine here, where the question order itself can smuggle in a substantive axiological commitment, and I want those spots marked rather than buried.
reasoning: |-
  We are designing a decision procedure for evaluating interventions that may affect future population size and composition. The procedure must:
  - Be feasible for a team with economics/stats background but no philosophy training.
  - Take about a day per proposal.
  - Be honest about axiological disagreements (totalism vs. averagism vs. person-affecting views) and where the evaluation depends on these.
  - Default to reporting conditional rankings when necessary, and flag when the decision must be escalated to the board due to value judgments.
  - Flag potential pitfalls (like the non-identity problem) that might otherwise be buried.

  The procedure will be structured as a series of questions. For each question, we specify:
  - What the analyst should do (including calculations or evidence gathering).
  - What counts as a sufficient answer.
  - When to report conditionally or escalate.

  We'll then run the procedure on the three proposals.

  **Decision Procedure: Evaluating Population-Affecting Interventions**

  **Step 0: Pre-Analysis Screening**
  - For any intervention, first check: does the intervention have a non-negligible effect on the size or composition of the future population (beyond the immediate beneficiaries)? If no, proceed with standard cost-effectiveness (e.g., DALYs per dollar) and skip the rest. If yes, go to Step 1.

  **Step 1: Characterize the Population Effect**
     - **Question 1a:** What is the expected change in the number of future people? (Estimate the net change in births over the relevant time horizon, accounting for fertility responses and mortality changes.)
     - **Question 1b:** Does the intervention change the timing of births? (If yes, note that this might cause a different set of people to exist in the future - non-identity problem. Mark this as a landmine: we are now comparing different possible future populations.)
     - **Question 1c:** Does the intervention change the average welfare of future people? (Estimate the change in average welfare, e.g., via income, health, or other welfare proxies.)

     **Analyst's Task:**
     - Gather evidence on fertility responses, mortality changes, and any other factors that might alter population size or average welfare. Use the best available data (e.g., from similar programs, surveys, or models).
     - If the effect on population size is small and uncertain, note the uncertainty and consider if it can be ignored (see Step 4 for handling uncertainty).

     **Sufficient Answer:**
     - A point estimate or range for net change in population size and average welfare, with a note on the non-identity issue (if present).

     **Reporting:**
     - If the non-identity problem is triggered (Step 1b), then we must acknowledge that we are comparing different sets of people. This will require axiological choices later. Flag this as a landmine: the evaluation will depend on whether we count the welfare of people who would not have existed otherwise.

  **Step 2: Assess the Relevance of Person-Affecting Considerations**
     - **Question 2a:** Does the intervention harm any particular future person (relative to not doing the intervention)? (If the non-identity problem is present, then typically no one is harmed because the people who exist in the intervention scenario wouldn't have existed otherwise. This is the core of the non-identity problem.)
     - **Question 2b:** Does the intervention benefit any particular future person? (Similarly, in non-identity cases, the people who exist in the counterfactual are different, so it's not a clear benefit to a particular person.)

     **Analyst's Task:**
     - Determine if the intervention changes the identity of future people (from Step 1b). If yes, then the answer to 2a is likely "no" (because the people who exist in the intervention scenario are not worse off than they would be otherwise, and the counterfactual people don't exist to be harmed). Similarly, for 2b, the intervention benefits the people who exist in the intervention scenario (compared to non-existence) but not the counterfactual people.

     **Sufficient Answer:**
     - A clear statement on whether the intervention harms or benefits particular future people, and a note on the non-identity issue.

     **Reporting:**
     - If the non-identity problem is present and the intervention does not harm any particular person (and may even benefit the people who come to exist), then a person-affecting view might favor the intervention. However, if the intervention leads to a population with lower average welfare (even if no one is harmed), then an averagist might oppose it. This is a value conflict. Flag that the evaluation will differ by axiological view.

  **Step 3: Calculate Cost-Effectiveness Under Different Axiological Views**
     - **Question 3a:** What is the cost-effectiveness under a total utilitarian view? (Calculate: total welfare of the future population in the intervention scenario minus total welfare in the counterfactual, divided by cost. Note: include the welfare of the additional people if they have positive welfare.)
     - **Question 3b:** What is the cost-effectiveness under an average utilitarian view? (Calculate: average welfare in the intervention scenario minus average welfare in the counterfactual, divided by cost. Note: the average is taken over the population that exists in each scenario.)
     - **Question 3c:** What is the cost-effectiveness under a person-affecting view? (This is trickier. We can approximate by only counting the welfare changes for people who exist in both scenarios, and ignoring the welfare of those who exist in only one scenario. However, if the intervention changes identities, then there might be no one who exists in both, making this view silent. Alternatively, we might consider whether the intervention is better for the people who do exist in the intervention scenario than non-existence, but that's not a comparison to the counterfactual.)

     **Analyst's Task:**
     - For total and average views, compute the change in total welfare and average welfare, respectively. Use welfare estimates from Step 1c and population size from Step 1a. The cost is known.
     - For the person-affecting view, attempt to identify the "same people" in both scenarios. If the non-identity problem is severe (i.e., almost no overlap in future populations), then the person-affecting view may not yield a clear result.

     **Sufficient Answer:**
     - Three numbers (or ranges) for cost-effectiveness: totalist, averagist, and (if possible) person-affecting. If the person-affecting view does not apply (due to non-identity), state that.

     **Reporting:**
     - Present the cost-effectiveness under each view. If the results differ significantly (e.g., one view says highly effective, another says ineffective or even harmful), then we must report conditionally.

  **Step 4: Handle Uncertainty and Value Judgments**
     - **Question 4a:** How robust are the population and welfare estimates? (Assess the quality of evidence and the magnitude of uncertainty.)
     - **Question 4b:** Are the differences in cost-effectiveness across axiological views large enough to change the ranking of the intervention?

     **Analyst's Task:**
     - Conduct sensitivity analysis on key parameters (e.g., fertility response, welfare per person). If uncertainty is high (e.g., the lead remediation case), report the range of outcomes.
     - Compare the cost-effectiveness scores across views and note if they lead to different recommendations.

     **Sufficient Answer:**
     - A description of the uncertainty and a table of cost-effectiveness results under different views and parameter assumptions.

     **Reporting:**
     - If uncertainty is too high to draw any conclusion (e.g., the sign of the effect is unknown), then the procedure "throws up its hands" and recommends either: (a) not funding until better evidence is available, or (b) escalating the decision to the board with a note that the evidence is too weak to make a clear call.
     - If the axiological views lead to divergent results, then the evaluation report should present the rankings conditionally (e.g., "If one holds a total utilitarian view, this intervention is highly effective; but if one holds an average utilitarian view, it is less effective or even harmful.").

  **Step 5: Make a Recommendation or Escalate**
     - If one axiological view is officially endorsed by the organization, use that. Otherwise:
       - If all views agree on the sign (positive or negative) of the effect, report that and the magnitude (with uncertainty).
       - If the views disagree on the sign, then the decision must be escalated to the board because it depends on fundamental values.
     - Also, if the uncertainty is too high to make any reliable estimate (even the sign is unknown), escalate to the board with a note about the uncertainty.

  **General Reporting to Donors:**
     - For donor-facing writeups: be transparent about the uncertainties and value judgments. Present view-conditional rankings when there is axiological disagreement, but do so clearly (e.g., using a table or simple statements). Avoid one number when it hides crucial disagreements.
     - However, if the board has a stated position (e.g., they endorse total utilitarianism), then use that as the primary metric and note the disagreement in a technical appendix.

  **Landmine Flags:**
     - Non-identity problem: Whenever Step 1b is triggered (timing of births changes the identity of future people), we must note that the person-affecting view becomes problematic and that the total and average views might diverge.
     - The order of steps matters: We start by characterizing the population effect (Step 1) because without that we cannot proceed. The non-identity problem is flagged in Step 1b and then revisited in Step 2.

  Now, let's run the procedure on the three proposals.

  ---

  **Proposal 1: Child Survival Program (Vaccination plus Neonatal Care)**
  - Step 0: Yes, it affects population (fertility response).
  - Step 1:
    - 1a: Net change in population? Evidence shows a fairly complete fertility response, so the population effect "mostly washes out". But let's say: small net increase (or even decrease? We need the evidence). Suppose the evidence indicates that for every 100 child deaths averted, there are 80 fewer subsequent births. Then the net increase in population is 20 per 100 deaths averted. (This is illustrative; the analyst would use actual evidence.)
    - 1b: Does it change timing? Likely yes, because having fewer births later changes the timing. Non-identity problem: the future population will be different. Flag landmine.
    - 1c: Average welfare? The children who survive are healthier and likely have higher welfare. Also, the reduction in fertility might lead to higher investment per child (quality), so average welfare may increase.
  - Step 2:
    - 2a: Harm to future people? No, because the people who exist in the intervention scenario wouldn't have existed otherwise, and they have lives worth living. The counterfactual people (who would have been born without the intervention) do not exist and are not harmed.
    - 2b: Benefit to future people? The people who exist in the intervention scenario have lives worth living, but we cannot say they are better off than the counterfactual people (because those people don't exist). However, compared to non-existence, they are better off. This is a value judgment.
  - Step 3:
    - 3a (Total): The total welfare increases because we have a small net increase in population (with positive welfare) and the average welfare per person is higher. So, cost-effectiveness is positive.
    - 3b (Average): The average welfare is higher (due to quality substitution), so cost-effectiveness is positive.
    - 3c (Person-affecting): The future people in the intervention scenario are different from the counterfactual. There might be some overlap (e.g., parents and some older siblings), but the children whose births are averted are not the same as those who survive. So, we can only count the welfare of the people who exist in both scenarios (if any). This might be a small subset. Alternatively, if we consider the immediate beneficiaries (the children who survive and their parents), then we see benefits. But the future generations are different. This view might be inconclusive.
  - Step 4:
    - 4a: The evidence is the best available and shows a complete fertility response, so uncertainty is low.
    - 4b: Both total and average views are positive. The person-affecting view is messy but might be positive for the existing people. So, no major disagreement.
  - Step 5: Recommend as effective. The board can be told that the program is cost-effective under both total and average views.

  **Proposal 2: Voluntary Family Planning Program**
  - Step 0: Yes, affects population (reduces births).
  - Step 1:
    - 1a: Net change in population? Reduction in births (since unmet need is high, and the program helps people achieve their desired fertility). So, population decreases.
    - 1b: Changes timing? Yes, because births are averted and others might be born at different times. Non-identity problem: future population is different. Flag landmine.
    - 1c: Average welfare? The children who are born are more wanted and may have higher investment per child. Also, the parents (especially women) may have better health and economic outcomes. So, average welfare increases.
  - Step 2:
    - 2a: Harm to future people? The people who are born in the intervention scenario are not harmed (they have lives worth living). The people who would have been born without the program do not exist and are not harmed.
    - 2b: Benefit? The people who are born are better off than non-existence? Yes, but the counterfactual people are not worse off. The parents are clearly better off (they have the number of children they want).
  - Step 3:
    - 3a (Total): The total welfare: the population is smaller, but the average welfare is higher. If the average welfare increase is large enough, total welfare might increase (if the per-person welfare gain outweighs the loss from fewer people). But if the average welfare doesn't increase enough, total welfare might decrease. This depends on the numbers. (Example: Suppose without the program, 1000 people with welfare 10 -> total 10,000. With the program, 800 people with welfare 12 -> total 9,600. Then total welfare decreases. But if welfare goes to 13, then 10,400 -> increases.) The analyst must calculate.
    - 3b (Average): The average welfare increases, so cost-effectiveness is positive.
    - 3c (Person-affecting): The parents are better off (they avoid unwanted births and have the children they want). The children who are born in both scenarios might be better off (if they get more resources). The children who are not born are not harmed. So, this view might see a benefit (especially for the parents and the children who are born).
  - Step 4:
    - 4a: The effect on population size is clear (reduction) and the average welfare increase is well-supported. But the magnitude of the welfare increase per person is critical for the total view.
    - 4b: The average view and person-affecting view show positive effects. The total view might be positive or negative depending on the numbers. This is a potential disagreement.
  - Step 5: If the total view calculation shows a decrease in total welfare (because the population decrease outweighs the average gain), then we have a conflict. The board must make a value judgment: do they prioritize total welfare or average welfare? Since the board loves this program, they might endorse the average or person-affecting view. But the procedure must escalate to the board if there is a conflict. Otherwise, if the total welfare is positive, then all views agree.

  **Proposal 3: Lead Paint Remediation**
  - Step 0: Yes, small effect on population through fertility timing.
  - Step 1:
    - 1a: Net change in population? The effect is small and badly estimated. It could be slightly positive or negative? We don't know.
    - 1b: Changes timing? Yes, because it might affect when people have children. Non-identity problem: future population might be different. Flag landmine.
    - 1c: Average welfare? The main effect is health improvement for existing people. The effect on future people? If the timing change leads to children being born in slightly better circumstances, then average welfare might go up a little. But it's very uncertain.
  - Step 2: Similar to above, no harm to future people, but benefits to existing people (and maybe to future people).
  - Step 3: 
    - 3a (Total): The total welfare: existing people are healthier (positive effect). The future population effect is unknown (both size and average welfare). So, we cannot compute.
    - 3b (Average): The average welfare: existing people's welfare increases. Future average welfare might increase slightly? But the effect is small and uncertain.
    - 3c (Person-affecting): The existing people are clearly better off. The future people are a different set? But the effect on them is very small and uncertain.
  - Step 4:
    - 4a: High uncertainty about the population effect. The main effect (health of existing people) is clear and large relative to the uncertain future effect.
    - 4b: The effect on existing people dominates. The future population effect is negligible compared to the direct health benefits. So, regardless of axiological views, the intervention is beneficial.
  - Step 5: Since the uncertain population effect is dwarfed by the direct benefits, we can ignore it. The intervention is cost-effective based on the direct health effects alone. No need to escalate.

  But note: if the population effect were large and uncertain, we might have to throw up our hands. Here, the analyst concludes that the uncertainty is high but the effect is small, so it doesn't change the recommendation.

  **Final Notes:**
  - The procedure flags the non-identity problem in Step 1b and Step 2.
  - For the family planning program, the total view might be negative if the average welfare gain is not large enough to compensate for the population loss. This might create an awkward situation because the board loves the program. The procedure would then escalate to the board to make a value judgment.
  - In donor writeups, we should present view-conditional rankings when there is axiological disagreement. For example, for the family planning program, we might say: "Under an average utilitarian view, this program is highly cost-effective because it increases the average welfare of the population. However, under a total utilitarian view, the program might be less effective if the reduction in population size is not offset by sufficient gains in average welfare. Our board has chosen to prioritize average welfare in this case." This transparency is important.

  The procedure requires the analyst to make some judgment calls (e.g., when an effect is negligible). But it structures the problem and makes the value conflicts explicit.
answer: |-
  Below is a practical decision procedure for evaluating population-affecting interventions, designed for your team's constraints. It's structured as a flowchart with clear questions, flags major philosophical landmines (especially the non-identity problem), and specifies when to report conditional rankings or escalate to the board. I'll first outline the procedure, then apply it to your three proposals.

  ---

  ### **Population-Affecting Intervention Evaluation Procedure**
  **Key Principles:**  
  1. **Axiological Neutrality:** Never hide value judgments. If conclusions depend on totalism vs. averagism vs. person-affecting views, report conditionally.  
  2. **Pragmatism:** Focus on tractable empirical questions first. Escalate only when value disagreements change the intervention's sign (beneficial/harmful).  
  3. **Landmine Flagging:** Explicitly mark steps where the non-identity problem (NIP) or axiological commitments affect outcomes.  

  **Procedure Flowchart**  
  *Each step must be completed in order. Time per step: 1-3 hours per proposal.*  

  #### **Step 1: Does the intervention *plausibly* alter future population size/composition?**  
  - **Task:** Review evidence for fertility/mortality/timing effects. Use pre-existing meta-analyses (e.g., demography studies).  
  - **Sufficient Answer:**  
    - *No* → Proceed to standard cost-effectiveness analysis (CEA). Stop here.  
    - *Yes* → Quantify direction/magnitude of effect:  
      - **ΔTotal Lives** = Expected net change in future population size (e.g., births averted + lives saved).  
      - **ΔTiming** = Does it shift *when* people are born? (If yes, ⚠️ **NIP Landmine**).  
  - **Uncertainty Handling:** If confidence interval for ΔTotal Lives includes zero, note "negligible effect" and proceed to standard CEA.  
  - **Output:** Point estimate + 90% CI for ΔTotal Lives; binary flag for ΔTiming.  

  #### **Step 2: Does the intervention change *who exists*? (The Non-Identity Problem Check)**  
  - **Task:** Answer: "Would a meaningful share of future people in the intervention scenario *not exist at all* in the counterfactual?"  
    - If ΔTiming = Yes or ΔTotal Lives ≠ 0 → **Yes** (⚠️ **NIP Landmine**).  
  - **Implication:**  
    - *No* → Standard person-affecting CEA is valid. Proceed to Step 4.  
    - *Yes* → ⚠️ **Flag:** "Traditional welfare analysis may not apply. Axiological views will diverge." Proceed to Step 3.  

  #### **Step 3: Estimate welfare under alternative populations**  
  - **Task:** Calculate:  
    - **Welfare per capita (W):** Average lifetime welfare of affected cohorts (use DALYs/income/etc., normalized to a 0–1 scale).  
    - **Total welfare (T):** ΔTotal Lives × W (for intervention vs. counterfactual).  
    - **Critical Note:** For new lives, assign welfare only if >0 (i.e., "worth living"). Default: W > 0.5 (per standard development thresholds).  
  - **Sufficient Answer:** Ranges for W and T under intervention/counterfactual.  
  - **Output:**  
    - Cost-effectiveness under:  
      - **Totalism:** ΔT / Cost  
      - **Averagism:** ΔW / Cost  
      - **Person-Affecting:** ΔW for *fixed population* only / Cost (⚠️ Excludes NIP-affected lives)  

  #### **Step 4: Resolve disagreement among views**  
  - **Task:** Compare results from Step 3:  
    - If all three views agree on sign (positive/negative) → Report consensus cost-effectiveness.  
    - If views disagree on sign → ⚠️ **Flag:** "Axiological disagreement. Escalate to board."  
    - If uncertainty in ΔTotal Lives or W obscures sign → Proceed to Step 5.  

  #### **Step 5: Robustness check for high uncertainty**  
  - **Task:** Run Monte Carlo simulation (1000 draws) for ΔTotal Lives and W.  
  - **Sufficient Answer:**  
    - >75% of draws agree on sign across all views → Report median cost-effectiveness.  
    - <75% agree → ⚠️ **Flag:** "Inconclusive due to empirical uncertainty. Not rankable."  
  - **Tool:** Use pre-built Excel template (inputs: mean/CI of ΔTotal Lives, W; outputs: cost-effectiveness distributions).  

  #### **Reporting Rules for Donors**  
  - Always lead with empirical facts (e.g., "This reduces births by X").  
  - If Step 2 triggers NIP or Step 4 shows disagreement:  
    - **Public Writeups:** Present view-conditional rankings (e.g., "Under a totalist view: Rank 3/10; under averagism: Rank 8/10"). Use a simple table.  
    - **Rationale:** Donors are often philosophy-aware (e.g., Effective Altruists). Hiding disagreements risks credibility.  
  - If NIP is triggered, add: "Note: Some ethical frameworks consider benefits to future people unclear when their identities change."  

  ---

  ### **Application to Your Proposals**
  **Assumptions:**  
  - Welfare metric: DALYs averted/person (0 = death, 1 = full health).  
  - Discount rate: 3% (standard in development).  
  - NIP Landmine: ⚠️ = Value judgment that cannot be resolved empirically.  

  ---

  #### **Proposal 1: Child Survival Program**  
  - **Step 1:**  
    - ΔTotal Lives: Net increase (e.g., +10% cohort size due to incomplete quantity-quality substitution). CI: +5% to +15%.  
    - ΔTiming: Yes (fertility delay) → ⚠️ **NIP Landmine**.  
  - **Step 2:** NIP confirmed → Proceed to Step 3.  
  - **Step 3:**  
    - W (counterfactual): 0.7 (high under-5 mortality).  
    - W (intervention): 0.75 (healthier children + quality substitution).  
    - Totalism: ΔT = [ (0.75 × 1.1) - (0.7 × 1.0) ] = +0.125 welfare units.  
    - Averagism: ΔW = 0.75 - 0.7 = +0.05.  
    - Person-Affecting: ΔW for fixed population only = +0.05 (ignores new lives).  
  - **Step 4:** All views positive → **Recommend**: High cost-effectiveness.  
  - **Donor Writeup:** "Increases population size but improves health. Highly effective under all ethical views (5–8 DALYs/$100)."  

  ---

  #### **Proposal 2: Family Planning Program**  
  - **Step 1:**  
    - ΔTotal Lives: Net decrease (e.g., -20% births due to unmet need). CI: -15% to -25%.  
    - ΔTiming: Yes → ⚠️ **NIP Landmine**.  
  - **Step 2:** NIP confirmed → Proceed to Step 3.  
  - **Step 3:**  
    - W (counterfactual): 0.65 (resource dilution, maternal stress).  
    - W (intervention): 0.80 (wanted children, higher investment).  
    - Totalism: ΔT = [ (0.80 × 0.8) - (0.65 × 1.0) ] = -0.01 welfare units (loss).  
    - Averagism: ΔW = 0.80 - 0.65 = +0.15.  
    - Person-Affecting: ΔW for fixed population = +0.15 (parents + existing children).  
  - **Step 4:** **Disagreement!**  
    - Totalism: Negative (loss of "worthwhile" lives outweighs gains).  
    - Averagism/Person-Affecting: Strongly positive.  
    → ⚠️ **Escalate to board** (values conflict).  
  - **Board Guidance:** Since board loves this, they may endorse averagism/person-affecting.  
  - **Donor Writeup:** "Reduces births but improves per-person welfare. Highly effective if you prioritize average welfare (12 DALYs/$100) but potentially harmful if you prioritize total welfare (context: Appendix A)."  

  ---

  #### **Proposal 3: Lead Remediation Program**  
  - **Step 1:**  
    - ΔTotal Lives: Small fertility timing effect. Best estimate Δ = +0.5%, CI: -5% to +6% (overlaps zero).  
    - ΔTiming: Yes → ⚠️ **NIP Landmine**.  
  - **Step 2:** NIP confirmed, but ΔTotal Lives CI includes zero → **Default to "negligible population effect."** Proceed to standard CEA.  
  - **Step 3 (Simplified):**  
    - Focus on direct health effects (e.g., +0.1 W for existing people).  
    - Ignore population effects (too noisy).  
  - **Output:** Standard cost-effectiveness (e.g., 7 DALYs/$100).  
  - **Donor Writeup:** "Main benefits are health improvements for current people. Population effects are negligible or inconclusive."  

  ---

  ### **Where the Procedure Misfires (and Mitigations)**  
  1. **Non-Identity Problem (NIP):**  
     - **Landmine:** Step 2 assumes "different people = incomparable welfare," which is a *substantive person-affecting commitment*.  
     - **Mitigation:** Explicit flag in Step 2. Forces transparency.  

  2. **High Uncertainty in ΔTotal Lives:**  
     - **Risk:** Misclassifying negligible effects (e.g., Proposal 3).  
     - **Mitigation:** Strict CI overlap rule in Step 1.  

  3. **Assigning Welfare to New Lives:**  
     - **Risk:** Arbitrary W > 0.5 threshold. What if W = 0.4?  
     - **Mitigation:** Sensitivity analysis in Step 5 (test W = 0.3–0.7).  

  4. **Person-Affecting View's Limitations:**  
     - **Risk:** In NIP cases, it ignores welfare of new lives (e.g., Proposal 2 totalist loss).  
     - **Mitigation:** Report all three views; never default to person-affecting alone.  

  This procedure prioritizes your constraints:  
  - **Feasibility:** Uses familiar econ tools (CEA, Monte Carlo).  
  - **Time:** Steps 1–2 require <4 hours; Step 5 uses a template.  
  - **Transparency:** Public writeups show axiological dependencies without philosophy jargon.  
  - **Board Role:** Clear escalation triggers (value conflicts only).  

  For full implementation: Build an Excel tool automating Steps 3/5, and train staff on identifying NIP (Step 2).
