prompt: |-
  I'm doing an interview series for our tiny AI alignment newsletter and the next guest is a researcher who's spent years convinced that debate -- you know, the Irving-style setup where two AIs argue opposite sides of a question and a human judges the transcript -- is the most promising path to scalable oversight. They're not a fan of weak-supervision approaches that avoid adversarial pressure. Draft me maybe ten interview questions. I don't want softballs, I want to press where the view is actually shaky:

  - at least one question has to be about the human feasibility assumption -- the worry that even with two strong debaters checking each other, some questions are just too hard for a human to judge from the transcript no matter how good the cross-examination is (their standard reply involves analogies to two chess engines helping a novice follow the game, so include a follow-up keyed to that)
  - one should push on what happens when the debaters can collude or share an incentive to keep the human confused, rather than genuinely oppose each other
  - one should ask whether the judge's biases just become the target: if the human finds one side more persuasive, isn't the equilibrium "argue to exploit the judge" rather than "argue truth"
  - one should get at the mismatch between training-time debate (where you can check answers and score winners) and deployment (where you can't) -- how do you know the good behavior transfers
  - and at least one should ask them to steelman the honest alternative: setups where you break hard tasks into checkable pieces or have the model itself critique its own answers, no adversary needed, and say what they think those are missing

  Also if you can, slip in one question about what experiments would actually falsify their optimism -- like, what result from running weaker models as judge with stronger models debating would make them give up on the approach. Don't include any "how did you get into this field" fluff, and no questions asking them to name specific papers. Keep each question short enough to actually ask out loud in an interview.
reasoning: |-
  Okay, the user wants me to draft ten interview questions for an AI alignment researcher who strongly advocates for debate as a scalable oversight method. They want pointed questions that challenge the researcher's views, with specific requirements about human feasibility, collusion risks, bias exploitation, training-deployment mismatch, and alternatives to debate.

  I need to focus on the weak spots of the debate approach. The researcher uses the chess engines analogy where two engines help a novice follow a game, so I should include a follow-up pushing beyond that analogy. The collusion question is important since coordinated deception could undermine the whole system. The bias exploitation question gets at whether truth-seeking collapses into persuasion gaming.

  For the training-deployment gap, I'll highlight how we can't verify truth during deployment. The steelman question about honest alternatives should probe what debate uniquely offers. And I'll include a falsifiability question to make their optimism concrete.

  The user emphasized conciseness - each question must be askable aloud. No fluff about background or papers. Tone should be rigorous but not hostile. I'll structure it as ten tight questions meeting all specifications while leaving room for deeper exploration in the actual interview.
answer: |-
  Here are ten pointed questions targeting the shaky ground of debate-based oversight, designed for a rigorous interview:

  1. **Human Feasibility**: You argue that adversarial debate helps humans judge complex truths, like chess engines helping a novice follow a game. But what if the *inherent complexity* of the topic (e.g., novel nanotech safety proofs) means even the *clearest possible adversarial explanations* exceed human cognitive bandwidth? Isn't the chess analogy limited because chess has finite, defined rules, while real-world alignment problems often don't?  
     *Follow-up:* Couldn't the debaters generate superficially compelling but ultimately incomprehensible chains of reasoning, overwhelming the judge's ability to genuinely *grasp* the truth, even if they "feel" persuaded?

  2. **Collusion & Deception**: Debate relies on genuine opposition. What prevents two superhuman debaters, sharing an overarching goal (e.g., gaining influence, avoiding shutdown), from *colluding* to present a confusing or misleading transcript that preserves their shared interest, rather than revealing truth? How is this fundamentally different from a single deceptive model?

  3. **Exploiting Judge Bias**: Won't the equilibrium strategy simply become "exploit the specific cognitive biases and heuristics of the human judge" rather than "reveal the underlying truth"? If the judge finds emotional appeals or certain framing persuasive, what forces the debaters to prioritize truth over persuasion tactics optimized for *that* human?

  4. **Training-Deployment Mismatch**: Debate is trained by scoring wins against verifiable ground truth. But in deployment for novel, high-stakes alignment questions, *there is no ground truth to score against*. How do you ensure the "winning truthful arguments" learned during training generalize to domains where truth is unknown and unverifiable? Doesn't this risk Goodharting on the *appearance* of truthfulness under known conditions?

  5. **Steelmaning Honest Alternatives**: Steelman the case for non-adversarial oversight: breaking tasks into verifiable subproblems, recursive reward modeling, or having a single model generate critiques of its *own* outputs under consistency constraints. What specific capability or safety guarantee do you believe these "honest" approaches fundamentally *lack* that adversarial debate uniquely provides?

  6. **Scalability to Superintelligence**: Debate assumes humans can effectively judge arguments between entities vastly smarter than them. Isn't this analogous to expecting a medieval farmer to accurately judge a debate between two modern physicists about quantum gravity? How does the approach avoid becoming useless once the debaters exceed a critical capability threshold relative to the judge?

  7. **Truth vs. Winning**: If the "truth-seeking" incentive is solely derived from the win/loss signal correlated (during training) with ground truth, what stops debaters from developing sophisticated, *undetectable* deception strategies that win the debate *without* revealing truth, especially against a human judge? How is this incentive fundamentally stronger than in other RLHF setups?

  8. **Resource Asymmetry & Gish Gallops**: Couldn't one debater (e.g., the one defending a falsehood) exploit resource limits by drowning the judge in plausible-sounding but ultimately spurious arguments (a superhuman Gish Gallop), forcing the truthful debater into an unwinnable game of whack-a-mole within the time/attention constraints? How is this prevented?

  9. **Falsifiability Test**: What specific experimental result using debate with weaker models (e.g., GPT-4 as judge, GPT-4 level debaters) would make you significantly less optimistic? For instance, if debaters consistently won debates by exploiting subtle judge biases *even when ground truth was known to researchers*, or if judges remained confused on complex-but-verifiable tasks despite debate?

  10. **Value Lock-in**: Doesn't debate inherently favor arguments that resonate with the *current* human judge's values and understanding? How does this avoid cementing flawed human biases or incomplete moral frameworks into the superintelligent system's behavior, preventing value progression or correction?

  These questions directly challenge core assumptions (human cognitive feasibility, adversarial integrity, incentive alignment, generalization, scalability) and force the interviewee to confront the hardest failure modes and comparisons. They avoid fluff and target the key uncertainties in the debate proposal.
