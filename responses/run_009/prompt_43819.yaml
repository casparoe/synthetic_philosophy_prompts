  ## Sestina for a Retired Physicist, Taking Tea

  The spoon stirs ripples in the cooling **cup**,
  A small reflection caught within its **glass**.
  This afternoon unfolds, a quiet **page**,
  As afternoon has done for years. This **chair**
  Supports the weight of habit. Late sun's **light**
  Falls warm across the table, holds me **here**.

  The stillness is a comfort settled **here**,
  Where steam still rises faintly from the **cup**.
  It gilds the edges of the waiting **spoon**,
  A dull gleam answering the window's **glass**.
  This solid presence, wood against my **chair**,
  The daily ritual, a well-worn **page**.

  No grand discoveries adorn this **page**,
  Just lists for market, notes kept folded **here**.
  The silence deepens in the empty **chair**
  Opposite. I lift the fragile **cup**.
  My thumbnail taps its rim, a bell of **glass**,
  Disturbs the stillness near the idle **spoon**.

  Is there a memory within the **spoon**?
  A trace of sugar on its printed **page**?
  Condensation beads the water's **glass**.
  The heat persists, though fading, even **here**.
  The dregs grow darker in the waiting **cup**.
  I shift my weight upon the wooden **chair**.

  Such ordinary things: this sturdy **chair**,
  The table's grain, the curve of this old **spoon**,
  The patterned rim around the simple **cup**.
  A life assembled, line by measured **page**,
  From moments anchored safely, solidly **here**,
  In substance, not refracted through a **glass**.

  But physics whispers through the window **glass**:
  Could thermal dance, within a vacuous **chair**,
  Conjure the *feeling* of a moment **here**?
  Not just the image of a silver **spoon**,
  Nor just the scent perceived, the written **page**,
  Nor just the warmth retained within the **cup**?

  The light lifts steam above the cooling **cup**.
  The spoon lies still upon the patterned **glass**.
  This afternoon: a pattern on a **page**,
  A sequence ordered in this present **chair**,
  A memory held *now* – not then. But **here**,
  The question settles, colder than the **spoon**.

  *Envoi*

  This pattern holds: the **chair**, the **page**, the **light**,
  The **cup**, the **glass**, the **spoon** arranged just **here**.
  But what past anchors it? What proof? What *right*?
  A scaffold built of words, however clear,
  Or particles that strayed from endless night?
  Is coherence cheap? Or something dear?
