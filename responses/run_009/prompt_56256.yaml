answer: |-
  Below is a diagnostic decision tree designed to guide students through concrete cases and thought experiments, forcing them to confront core questions about consciousness without relying on pre-learned theory labels. The tree starts from a neutral empirical observation (the reality of the conscious/unconscious distinction, as in blindsight) and progresses from case-based commitments to deeper metaphysical questions. Each node is a forced-choice question based on intuitive reactions to scenarios, with jargon-free phrasing. Unnamed leaves indicate incoherent or unexplored positions. Pairs that cannot be separated are noted.

  ---

  ### **Consciousness Diagnostic Decision Tree**

  **Starting Point:** You grant that there’s a real distinction between states we’re conscious of (e.g., seeing a red apple) and states processed without awareness (e.g., blindsight, where a patient can "guess" an object’s location but denies seeing it).

  #### **Node 1: The Sperling Experiment**  
  *Subjects see a 3x4 grid of letters for 50ms. They report seeing "all letters at once" but can only name 3–4. When cued *after* the grid disappears, they accurately report letters from any row. Do you think subjects...*  
  - **A) …have a rich, detailed visual experience of all 12 letters while the grid is visible, even though they can’t report them all?**  
    *→ Go to Node 2*  
  - **B) …only experience the few letters they can attend to or report? Their sense of "seeing all" is a fleeting impression, not detailed experience.**  
    *→ Go to Node 3*  

  #### **Node 2 (from 1A): Masked Priming**  
  *A word (e.g., "river") is flashed so quickly (30ms) and masked that subjects deny seeing anything. Yet, they’re faster to identify a related word (e.g., "boat") later. Do you think the flashed word...*  
  - **A) …influences behavior without any trace of conscious experience? It’s purely unconscious.**  
    *→ Go to Node 4*  
  - **B) …involves a brief, vague flicker of experience—like a "felt presence"—even if subjects can’t describe it?**  
    *→ Go to Node 5*  

  #### **Node 3 (from 1B): Split-Brain Patients**  
  *A patient with a severed corpus callosum sees "KEY" in the left visual field (right hemisphere) and "RING" in the right (left hemisphere). With hands hidden, they draw a key with the left hand but say they saw "RING." Do you think...*  
  - **A) …there’s one conscious self, but speech (from the left brain) can’t report what the right brain saw?**  
    *→ Go to Node 6*  
  - **B) …there are two separate streams of experience: one for the left brain (verbal) and one for the right (non-verbal)?**  
    *→ Go to Node 7*  

  #### **Node 4 (from 2A): Phenomenal Zombies**  
  *Imagine a perfect physical duplicate of you—identical brain, behavior, and functional responses—but with no conscious experience. Nothing "feels like" anything to this duplicate. Is this scenario...*  
  - **A) …conceivable? It could exist without logical contradiction.**  
    *→ Go to Node 8*  
  - **B) …incoherent? If the duplicate is physically identical, it must have identical experiences.**  
    *→ Go to Node 9*  

  #### **Node 5 (from 2B): Honeybee Subjectivity**  
  *A honeybee has ~1 million neurons (vs. human 86 billion) with recurrent feedback loops. It navigates complex environments, learns landmarks, and communicates via dance. Do you think it...*  
  - **A) …has some primitive form of experience (e.g., the "brightness" of light or "sweetness" of nectar), even if nothing like human consciousness?**  
    *→ Leaf: **Recurrent Processing Theory (RPT) or Integrated Information Theory (IIT)***  
    *(The tree cannot separate RPT and IIT here. Both agree on rich phenomenology without access (1A), minimal conscious traces (2B), and animal consciousness. RPT emphasizes neural feedback; IIT emphasizes information integration.)*  
  - **B) …has zero conscious experience? Its behaviors are complex reflexes.**  
    *→ Leaf: **Unnamed***  
    *(No major theory occupies this space: accepting minimal human consciousness (2B) while denying any animal consciousness is inconsistent. Why posit fleeting human experience if simple brains lack it entirely?)*  

  #### **Node 6 (from 3A): Zombies Revisited**  
  *Revisit the zombie duplicate (as in Node 4). Is it...*  
  - **A) …conceivable?**  
    *→ Leaf: **Unnamed***  
    *(No theory holds both unified consciousness (3A) and zombie possibility. Unity implies consciousness is irreducible to function, yet zombies require functionalism—contradiction.)*  
  - **B) …incoherent?**  
    *→ Leaf: **Global Workspace Theory (GWT)***  
    *(Consciousness is global information access for cognitive control. No access (blindsight) = unconscious. Limited access (Sperling) = sparse experience. Unified access explains split-brain reports.)*  

  #### **Node 7 (from 3B): Honeybee Subjectivity**  
  *Revisit the honeybee (as in Node 5). Do you think it...*  
  - **A) …has some experience?**  
    *→ Leaf: **Unnamed***  
    *(No theory holds both multiple human consciousnesses (3B) and bee consciousness. Splitting consciousness requires sophisticated cognition; bees lack the architecture for either.)*  
  - **B) …has zero experience?**  
    *→ Go to Node 10*  

  #### **Node 8 (from 4A): Illusionism Check**  
  *You said zombies are possible (4A). Does this mean human consciousness is...*  
  - **A) …a real, non-physical property (e.g., "qualia") that could be missing in a duplicate?**  
    *→ Leaf: **Unnamed***  
    *(Property dualism, not covered in this tree. Our theories are physicalist.)*  
  - **B) …an illusion? What we call "experience" is just brains (mistakenly) reporting they have it.**  
    *→ Leaf: **Illusionism***  

  #### **Node 9 (from 4B): Minimal Consciousness Scope**  
  *Revisit the honeybee (as in Node 5). Do you think it...*  
  - **A) …has some experience?**  
    *→ Leaf: **First-Order Representationalism (FOR) or Integrated Information Theory (IIT)***  
    *(The tree cannot separate FOR and IIT here. Both reject zombies (4B) and accept animal consciousness. FOR ties consciousness to first-order representations; IIT to information integration.)*  
  - **B) …has zero experience?**  
    *→ Leaf: **Higher-Order Theories (HOT)***  
    *(Consciousness requires a higher-order thought about a mental state. Bees lack metacognition.)*  

  #### **Node 10 (from 7B): Zombies Revisited**  
  *Revisit the zombie duplicate (as in Node 4). Is it...*  
  - **A) …conceivable?**  
    *→ Leaf: **Illusionism***  
    *(If zombies are possible and bees lack consciousness, human consciousness may be an illusion.)*  
  - **B) …incoherent?**  
    *→ Leaf: **Higher-Order Theories (HOT)***  
    *(Consciousness is a higher-order representation. Physical identity ensures identical representations.)*  

  ---

  ### **Summary of Leaves**
  - **Named positions:**  
    - **First-Order Representationalism (FOR):** Node 9A.  
    - **Global Workspace Theory (GWT):** Node 6B.  
    - **Higher-Order Theories (HOT):** Node 9B or Node 10B.  
    - **Recurrent Processing Theory (RPT):** Node 5A (paired with IIT).  
    - **Integrated Information Theory (IIT):** Node 5A (paired with RPT) or Node 9A (paired with FOR).  
    - **Illusionism:** Node 8B or Node 10A.  
  - **Unnamed positions:** Nodes 5B, 6A, 7A, 8A.  
  - **The tree cannot separate:**  
    - RPT and IIT (Node 5A).  
    - FOR and IIT (Node 9A).  

  ### **Unresolvable Pairs**  
  - **RPT vs. IIT:** Both yield identical answers at all nodes.  
  - **FOR vs. IIT:** Identical answers at all nodes except metaphysical foundations (IIT is axiomatic; FOR is representational).  

  ---

  **Summary:** The single hardest cut the tree forces is between **whether consciousness must be grounded in physical/functional facts (rejecting zombies) or whether it admits non-physical possibilities (accepting zombies)**, as this commits students to illusionism, non-reductionism, or reductive physicalism before theory labels intervene.
