  First, the self-refutation bomb ("does emptiness empty itself?") – this could implode the whole project if mishandled. Need to frame it as operational rather than propositional, with the "ladder kicking" concession. 
  Second, the deflationist annexation attempt – must differentiate svabhāva-denial from truth-denial using conventional ontology. 
  Third, the dialetheist recruitment – explicitly reject true contradictions while granting the tetralemma's formal resemblance. 

  *Pausing* The private dread question is likely about conventional truth's authority – if no svabhāva anywhere, why isn't everything arbitrary? That's the realism-shaped hole hurting most. Should flag that even if it's risky, because the essence-metaphysician will smell blood. 

  *Structuring* Replies need analytic vocabulary: no "dependent arising" but "relationally constituted", no "śūnyatā" but "absence of intrinsic properties". Examples must be department in-jokes – teapots for composition, electrons for grounding debates. Each reply gets: 1) concise pivot, 2) strategic concession, 3) vulnerability memo. 

  *Double-checking* Skipping philology is smart – this crowd won't care about Candrakīrti vs Tsongkhapa. Focus on conceptual payload. And absolutely include that "hoped-nobody-asks" realism objection, with a realism rating of 9/10 because that metaphysician lives for this fight.
answer: |-
  Below is a prioritized Q&A sheet tailored to your audience and thesis. Objections are ordered by **(damage potential × likelihood)**, with phrasing mirroring analytic philosophy discourse. Replies are designed for 2-3 minute answers, using accessible examples (teapots, electrons, moral facts).

  ---

  ### **Q&A Sheet: Madhyamaka for Analytic Metaphysicians**

  #### **1. The Self-Refutation Objection**  
  *(Metaethicist/Logician; Damage: 5/5, Likelihood: 5/5)*  
  **Phrasing:**  
  *"If all views presuppose intrinsic nature and must be rejected, doesn’t your own thesis—that nothing has intrinsic nature—also self-destruct? Isn’t this just a performative contradiction?"*  

  **Your Reply:**  
  >"Emptiness (śūnyatā) isn’t a *metaphysical claim* but a *therapeutic negation* of a presupposition. It rejects the very framework that would make ‘emptiness itself has intrinsic nature’ intelligible. Like Wittgenstein’s ladder, it’s a tool to be discarded after use. To say ‘emptiness is empty’ isn’t a substantive claim—it’s a reminder that no concept, including this one, gets its authority from ‘how things really are’ independent of conventions."  

  **Concede:**  
  >"Yes, if emptiness were proposed as a positive thesis, it would self-refute. That’s why Nāgārjuna calls it ‘the relinquishing of all views.’"  
  **Soft Spot:**  
  >Hardline realists may still see this as evasion. Stress the *diagnostic* function over propositional content.

  ---

  #### **2. The Deflationist Annexation Claim**  
  *(Metaethicist; Damage: 4/5, Likelihood: 5/5)*  
  **Phrasing:**  
  *"This sounds like global expressivism: you’re not denying truths about teapots or electrons, just rejecting ‘metaphysical heavyweight-ism.’ Why isn’t this just Blackburn’s quasi-realism in ancient dress?"*  

  **Your Reply:**  
  >"Unlike expressivism, Madhyamaka targets *ontology*, not semantics. It denies that any phenomenon—physical, moral, or mathematical—has *intrinsic grounding*. Conventional truth isn’t a ‘lesser’ truth but the *only* truth there is, precisely because it’s relationally constituted. Your deflationist might say ‘There are no moral facts,’ but Nāgārjuna says: ‘There are no *intrinsically factual* facts.’ The two truths doctrine preserves ordinary truth *without* ontological inflation."  

  **Concede:**  
  >"Yes, there are parallels in rejecting ‘metaphysical junk.’ But deflationism often retains implicit realism about, say, causation or objects. Madhyamaka radicalizes this: *all* phenomena lack ontological independence."  
  **Soft Spot:**  
  >May escalate into a debate about "relationally constituted." Have concrete examples ready (e.g., a teapot’s properties depend on conventions of use, perception, and parts).

  ---

  #### **3. The Dialetheist Recruitment**  
  *(Logician; Damage: 3/5, Likelihood: 5/5)*  
  **Phrasing:**  
  *"Rejecting all four options looks like a commitment to true contradictions. If (A∨¬A) fails, you’re in paraconsistent territory. Why not just own that reality is inconsistent?"*  

  **Your Reply:**  
  >"The tetralemma targets *ontological commitments*, not logical laws. Rejecting ‘P exists intrinsically’ doesn’t entail ‘P both exists and doesn’t exist.’ It denies that *any* of these options apply *to a mind-independent reality*. Conventional truth operates with classical logic: teapots don’t simultaneously exist and not exist. The tetralemma is a meta-level critique of reification, not an object-level dialetheia."  

  **Concede:**  
  >"Formally, the tetralemma resembles a paraconsistent structure. But Nāgārjuna isn’t asserting contradictions; he’s showing that the *questions themselves* misframe reality."  
  **Soft Spot:**  
  >The logician may press on "misframing." Emphasize that the tetralemma is diagnostic, not descriptive.

  ---

  #### **4. The Essence-Metaphysician’s Challenge**  
  *(Grounding Theorist; Damage: 5/5, Likelihood: 3/5)*  
  **Phrasing:**  
  *"If nothing has intrinsic nature, how do you avoid ontological nihilism? How can conventional truth have any authority if there’s *nothing* grounding it—not even relational properties?"*  

  **Your Reply:**  
  >"Conventional truth isn’t grounded *in anything*. It’s pragmatically emergent: like language-games or social facts, its ‘authority’ comes from interdependent functionality (e.g., a dollar bill’s value). Rejecting intrinsic nature doesn’t erase phenomena—it shows they’re *dependently arisen*. Your electron’s properties aren’t self-contained; they exist in a web of relations. This is *more* robust than nihilism: conventions work *precisely because* they’re empty."  

  **Concede:**  
  >"Yes, this rejects *any* fundamental grounding. But unlike nihilism, it affirms conventional reality *as* conventional."  
  **Soft Spot:**  
  >If they insist on "grounding all the way down," you’ll hit an impasse. Redirect to practical efficacy ("Look at how science revises properties relationally!").

  ---

  #### **5. The Anachronism Alarm**  
  *(Historian; Damage: 2/5, Likelihood: 4/5)*  
  **Phrasing:**  
  *"Aren’t you smuggling in Carnapian conventionalism or Kantian categories? How is this *Nāgārjuna’s* view and not a retrofit?"*  

  **Your Reply:**  
  >"I’m using analytic tools to *clarify* Nāgārjuna’s operational logic. His rejection of svabhāva and use of the two truths to preserve dependent arising (pratītyasamutpāda) is textually explicit. The parallels show how he diagnoses a *perennial* philosophical trap—like Sextus Empiricus targeting dogmatism, not skepticism. This isn’t conscription; it’s showing why his critique still bites."  

  **Concede:**  
  >"Translating 2nd-century Indian debates into ‘presuppositions’ is interpretive. But the structural logic is there."  
  **Soft Spot:**  
  >May demand Sanskrit evidence. Have a soundbite ready (e.g., *MMK 24:18*: "We state that whatever is dependently arisen is emptiness").

  ---

  #### **6. The Objection You Hope Nobody Asks**  
  *(Realist Metaphysician; Damage: 5/5, Likelihood: 4/5)*  
  **Phrasing:**  
  *"If conventional truth is just ‘what works,’ why isn’t Madhyamaka a global anti-realism where *all* truths are perspectival? And if so, how is it different from, say, Putnam’s internal realism—or worse, epistemic relativism?"*  

  **Why it’s Dangerous:**  
  >Threatens to collapse your "important difference" claim and reduce Madhyamaka to familiar anti-realism.  

  **Your Reply:**  
  >"Anti-realism typically posits a *mind-dependent* reality. Madhyamaka rejects that too: minds, conventions, and ‘dependence’ lack intrinsic nature. Conventional truth isn’t *constituted* by perspectives but is *non-foundationally* coherent. Unlike Putnam, there’s no ‘idealized’ rationality—just local, contingent practices. And unlike relativism, it doesn’t undermine itself: emptiness applies *to all frameworks equally*, including its own."  

  **Concede:**  
  >"Yes, it shares anti-realist *conclusions* about intrinsic nature. But it avoids the *metaphysical commitment* of ‘truth as constructed’ by rejecting construction itself."  
  **Soft Spot:**  
  >Risk of sounding like a quietist variant. Hammer the *non-commitment* angle: "This isn’t a theory of truth but a release from theorizing."  

  **Honest Assessment:**  
  >**Realism Rating: 9/10.** The essence-metaphysician will likely ask this. Preempt it by stressing "emptiness as non-position" early in your talk.

  ---

  ### **General Strategy**
  - **Vocabulary Swap:**  
    Svabhāva → "intrinsic properties" or "ontological independence."  
    Śūnyatā → "absence of intrinsic nature."  
    Two truths → "conventional vs. ultimate frameworks."  
  - **Go-To Examples:** Teapots (composition), electrons (grounding), dollars (social facts).  
  - **Defensive Mantra:** "This is a diagnostic tool, not a positive metaphysics."  
  - **Kill Them with Kindness:** "That’s a great question—it shows why Nāgārjuna’s move is easily misread as [their objection]. But..."  

  This audience will respect clarity over piety. If you translate the dialectic into *their* combat zone—grounding, truthmaking, logical revisionism—you’ll force engagement on your terms. Good luck!
