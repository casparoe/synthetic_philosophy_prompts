prompt: |-
  I direct the character-education program at a secondary school, and next month I present to the curriculum committee a proposal to build a required course around the close reading of biographies, taught on what I take to be Plutarch's method. My thesis is that students learn morally from lives only when the lives are selected and handled a certain way: chosen for small, character-revealing incidents rather than achievements, as Plutarch insisted when he distinguished his project from history-writing; presented with the subject's failures included and not explained away; arranged in contrasting pairs, as Plutarch paired Greek with Roman figures and appended formal comparisons weighing them against each other, so that the student has to do the evaluating rather than receive a verdict; and never capped with a stated moral. My further claim is that the two available alternatives fail in opposite directions: hagiography, which was built to produce imitation and instead produced credulity, and the contemporary genre of inspiring lives of scientists and founders, which I regard as hagiography with the theology removed and nothing put in its place.

  The committee, for purposes of my prep, consists of four people. A developmental psychologist who holds that moral growth comes through the child's own reasoning about dilemmas, and who will say that emulation of exemplars is at best a mnemonic and at worst an invitation to unexamined authority. A social-learning theorist who is in principle favorable to modeling, but who will press on what students actually imitate when shown admirable people with serious vices. A historian of antiquity who will argue that Plutarch's Lives are rhetorical constructions in which the moral precedes the man, and that teaching them as I propose trades on students not knowing this. And a virtue ethicist, sympathetic, who will ask how emulation is supposed to avoid collapsing into either hero-worship or conformity to whatever the biographer chose to highlight.

  Draft my Q&A prep sheet. Give me the objections roughly in the order they will arrive, each phrased in the vocabulary of the committee member who will raise it, and ranked by how much damage it could do to the proposal. For each, a reply I can deliver in about a minute in a committee meeting, a note on what I should concede up front, and a flag on where the reply is genuinely soft and I would do better to admit it than to bluff. Tell me which of my three design rules — incident over achievement, failures included, paired contrasts — is doing the most work and which is the most vulnerable to being dropped by a skeptical committee. And include the one question I am hoping nobody asks.
reasoning: |-
  Hmm, the user is a character-education program director preparing to present a Plutarch-inspired biography course to a curriculum committee. They need a Q&A prep sheet addressing four committee members' likely objections, ranked by potential damage. 

  First, unpacking the core thesis: they want students to learn morally through carefully selected biographical incidents (not achievements), presented with failures intact, in contrasting pairs without stated morals. Their critique targets both hagiography and modern "inspirational" bios as ineffective alternatives.

  Now, assessing the committee dynamics:
  - The developmental psychologist (highest threat) will challenge the foundational premise of emulation learning versus cognitive dilemma-based development. Need to show how Plutarch's method actually prompts reasoning.
  - The social-learning theorist (moderate threat) will question the vice-admiration paradox. Must demonstrate how failures prevent blind imitation.
  - The ancient historian (moderate threat) will expose Plutarch's constructed nature. Should preemptively concede this but argue pedagogical utility.
  - The virtue ethicist (lowest threat) is sympathetic but wary of hero-worship. Can align with their concerns while showing how design prevents it.

  For the replies: Each needs to be concise (1-minute delivery), concede where necessary (e.g., Plutarch's bias), and flag soft spots honestly. Key insights:
  - Incident-focused selection is most vital—it forces character analysis over awe.
  - Pairing is most vulnerable to cut but shouldn't be; it's the engine of critical comparison.
  - The "hoped-nobody-asks" landmine: whether the school's own values dictate which traits get highlighted.

  Biggest vulnerability? The historian's objection could unravel everything if not handled transparently. Best strategy: admit Plutarch's agenda but argue that precisely because students know it's constructed, they engage more critically—turning weakness into strength.
answer: |-
  Here’s your Q&A prep sheet, ranked by damage potential, with replies designed for conciseness (aim for 60 seconds each). Key vulnerabilities are flagged honestly.

  ---

  ### **Q&A Prep Sheet: Plutarchian Biography Course Proposal**

  #### **1. Objection (Developmental Psychologist: Highest Damage Potential)**  
  *"Your method relies on emulation, but moral growth requires active reasoning through dilemmas. Imitating exemplars invites uncritical deference to authority and bypasses cognitive development."*  

  **Reply:**  
  "Respectfully, Plutarch’s method *is* active reasoning—just through narrative dilemmas. Students dissect *incidents* (e.g., ‘Why did Cato refuse a bribe *this way*?’), not achievements. By comparing paired lives (say, an impulsive Alcibiades vs. a cautious Fabius), they weigh trade-offs: ‘Is integrity always prudent?’ No verdict is given; they construct judgments. This mirrors dilemma-based learning but grounds it in human complexity, not abstract cases."  

  **Concession:**  
  Agree upfront that blind hero-worship is harmful.  
  **Soft Spot:**  
  If the psychologist insists *only* hypothetical dilemmas stimulate reasoning, concede this complements—not replaces—their approach.  

  ---

  #### **2. Objection (Historian of Antiquity: High Damage Potential)**  
  *"Plutarch’s Lives are rhetorical constructs where ‘character’ is retrofitted to moral lessons. Teaching them as transparent windows to virtue misleads students unaware of ancient propaganda."*  

  **Reply:**  
  "Absolutely—Plutarch crafted narratives. But that’s *pedagogically useful*. We’d teach: ‘Plutarch *wanted* you to see Caesar as ambitious. What details might he omit? Compare Caesar’s refusal of a crown here to Washington’s modesty.’ By analyzing Plutarch’s framing *as* rhetoric, students interrogate how biographers (then and now) shape ‘virtue.’ We’re leveraging his artifice to teach critical reading."  

  **Concession:**  
  Admit Plutarch’s biases openly in the curriculum.  
  **Soft Spot:**  
  If pressed, acknowledge this requires careful teacher training to avoid presenting Lives as objective truth.  

  ---

  #### **3. Objection (Social-Learning Theorist: Moderate Damage Potential)**  
  *"If students imitate models, how do we prevent them from adopting a scientist’s brilliance *and* their racism? Admirable-but-flawed figures risk normalizing vice."*  

  **Reply:**  
  "By design: we spotlight *incidents*, not wholes. We don’t ask ‘Be like Einstein.’ We ask: ‘Here’s Einstein ignoring his family. What cost did that carry? Now contrast with Marie Curie’s work-life trade-offs.’ Failures are included *without resolution*—forcing students to critique, not emulate. Social learning works when observers discern *contextual* behaviors; our approach trains that discernment."  

  **Concession:**  
  Agree that uncritical exposure to vice is dangerous.  
  **Soft Spot:**  
  Younger teens may struggle to disaggregate traits; stress age-appropriate selections (e.g., avoid figures with extreme vices).  

  ---

  #### **4. Objection (Virtue Ethicist: Lowest Damage Potential)**  
  *"How does emulation avoid hero-worship or conformity? If a biographer highlights patience, students might mimic it unthinkingly rather than internalizing its value."*  

  **Reply:**  
  "Two safeguards: First, *pairing* lives forces nuance. If we pair Gandhi (nonviolence) with Sherman (ruthless efficacy), students must reconcile conflicting virtues—no single ‘lesson.’ Second, we *never* cap bios with morals. Instead, we ask: ‘When might Sherman’s approach betray justice?’ This pressures students to *interpret* virtues contextually, not conform to templates."  

  **Concession:**  
  Acknowledge that any biography risks reductionism.  
  **Soft Spot:**  
  None—this objection aligns with your design. Use it to showcase strengths.  

  ---

  ### **Key Design Rules Assessment**  
  - **Doing the Most Work:** **Incidents over achievements**. Forces micro-analysis of character-in-action, preventing awe-driven hero-worship.  
  - **Most Vulnerable to Cut:** **Paired contrasts**. Skeptics may see it as logistically cumbersome (finding pairs) or “redundant.” *Defend fiercely*: Pairs are the engine of critical thinking—without them, evaluations default to biographer’s framing.  

  ---

  ### **The Question You Hope Nobody Asks**  
  *"If you reject ‘stated morals,’ but select which incidents/biographies to include, aren’t you implicitly teaching *your* morals through curation? How is this less ideological than theology-laden hagiography?"*  

  **Why It’s Dangerous:**  
  It challenges your claim of neutrality and could reframe your method as stealth indoctrination.  

  **If Asked:**  
  "Fair point. Our curation *does* reflect values—like critical thinking or empathy. But unlike hagiography, we *expose* the scaffolding: students debate why we paired *these* lives, dissect our source choices, and even propose alternatives. Transparency makes the pedagogy co-constructed, not dogmatic."  

  **Soft Spot:**  
  Admit that total neutrality is impossible, but argue that student agency in evaluation mitigates this.  

  ---

  ### **Delivery Notes**  
  - **Lead with shared goals**: "We all want students to think critically about character—my method targets that."  
  - **Flag concessions early** to build trust (e.g., "Plutarch isn’t objective—but that’s useful!").  
  - **Emphasize incidents and pairs** as non-negotiables; offer flexibility on *which* biographies to use.  
  - **Redirect to outcomes**: "This isn’t about creating heroes—it’s about creating critics."  

  Good luck—your design is philosophically robust. Anchor replies in **student agency** and **critical interrogation** at every turn.
