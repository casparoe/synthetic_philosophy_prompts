  5.  **Plain Pictorial Language:** The language is simple, repetitive, and concrete ("one shape," "fixed on the field"), mirroring the stylized, symbolic nature of Gerd Arntz's Isotype figures. It avoids metaphor or complex emotion.
  6.  **Embedded Conviction:** The form itself embodies Neurath's ideals:
      *   **Visual Accessibility:** The trend (significant decline, but a persistent remainder) is immediately *seen* in the shrinking blocks and the truncated final line.
      *   **Emancipation through Clarity:** The data's shape is presented directly, without expert interpretation needed. The reader "sees the shape of society" for themselves through the stark, repeated units and their diminishing frequency.
      *   **Barrier Crossing:** The repetition and visual structure aim to convey the information in a way that transcends language barriers or literacy levels, much like the pictograms.

