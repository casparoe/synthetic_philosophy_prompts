answer: |-
  ### Final Exam Question: Phil 410 - Vagueness and Language  
  **Time Allowed:** 90 minutes  
  **Question:** "Epistemicism and supervaluationism both claim to account for higher-order vagueness, but in deeply contrasting ways. Evaluate which theory provides the *more coherent treatment* of the boundaries between 'definitely P', 'borderline P', and 'definitely not P' at *all orders of vagueness*. In your judgment, does Williamson’s margin-for-error principle genuinely *explain* the unknowability of cutoffs, or does it merely restate the epistemicist’s core commitment? Justify your answer with precise references to each theory’s handling of iterated definiteness operators."  

  ---

  ### Model Answer (606 words)  
  Epistemicism and supervaluationism offer divergent solutions to higher-order vagueness, but epistemicism ultimately provides a more consistent, if ontologically stark, framework. Supervaluationism avoids first-order sharp cutoffs by positing truth-value gaps for borderline cases across admissible precisifications. However, this success unravels at higher orders. When we ask whether a pile of sand is "definitely tall" (Dt), supervaluationism must draw a sharp boundary between *Dt* and *not definitely Dt*. Iterating this ("definitely definitely tall", etc.) generates infinitely many sharp boundaries—albeit boundaries of diminishing practical significance. This regress (the *problem of higher-order sharp boundaries*) contradicts supervaluationism’s core promise of eliminating abrupt transitions, replacing a single cutoff with infinitely many elusive ones.  

  Epistemicism, by contrast, embraces sharp cutoffs at every order but renders them *unknowable*. For Williamson, a predicate like "tall" has a precise cutoff *c*, but we cannot know *c* because our judgments obey a *margin-for-error principle*: to know someone is tall (at position *n*), they must be tall even at *n+δ* (where *δ* exceeds our discriminative capacity). This principle applies recursively: knowing *DDD...P* requires a margin *δ* at each iteration. Higher-order vagueness thus arises because each "definitely" operator introduces a new unknowable cutoff. Crucially, this preserves classical logic and avoids supervaluationism’s proliferation of boundaries: there is one cutoff per order, but it is epistemically inaccessible.  

  The margin-for-error principle does more than restate epistemicism’s commitments—it *explains* why higher-order boundaries are unknowable. It roots vagueness in *cognitive limitations*: our inability to discriminate adjacent cases (e.g., heights differing by 1mm) cascades through orders of definiteness. This contrasts with supervaluationism’s *semantic indecision*, which offers no parallel account of why higher-order boundaries are elusive. Williamson’s model thus earns its keep by linking metaphysics (sharp cutoffs) to epistemology (margin constraints), whereas supervaluationism merely relocates sharpness to higher orders without explanatory gain.  

  **Where this reasoning is weakest:** A supervaluationist could flip the verdict by arguing that epistemicism’s recursive unknowability *presupposes* a precise metalanguage it claims to reject. Epistemicism describes higher-order vagueness using exact margins (*δ*), but if "knowable" itself is vague, the margin-for-error principle may collapse into incoherence. If *δ*’s value is vague, epistemicism cannot non-arbitrarily fix the required margin at each order, potentially regressing into the very indeterminacy it denounces. This exploits epistemicism’s quiet reliance on precise metalanguage—a vulnerability supervaluationism avoids by embracing indeterminacy uniformly.  

  In sum, epistemicism’s unified treatment of higher-order vagueness—unknowable cutoffs governed by margin-for-error—is more coherent than supervaluationism’s fractured hierarchy of sharp boundaries. The latter’s "solution" reintroduces the problem it sought to escape, making epistemicism’s honesty about sharp cutoffs the lesser evil.  

  ---  

  ### Marking Scheme (Total: 20 marks)  
  **A-Grade (17–20 marks) must:**  
  1. **Contrast 1st vs. higher-order boundaries** in supervaluationism (e.g., "avoids sharp cutoff for *P* but not for *DⁿP*").  
  2. **Identify epistemicism’s recursive margin-for-error** (e.g., "each *D* introduces a new unknowable cutoff with its own *δ*").  
  3. **Argue whether margin-for-error explains or restates** (e.g., "links unknowability to discrimination limits ≠ mere restatement").  
  4. **Concede a genuine weakness** (e.g., "epistemicism’s precise *δ* may itself be vague").  
  5. **Judge coherence** with justification (e.g., "supervaluationism’s infinite boundaries are ad hoc").  

  **B-Grade (13–16 marks) must:**  
  1. **Correctly define higher-order vagueness** in both theories.  
  2. **Note supervaluationism’s higher-order sharp boundaries**.  
  3. **Describe margin-for-error** but may not extend it recursively.  
  4. **State a verdict** with basic reasoning (e.g., "epistemicism is simpler").  

  **Typical Botches (with 1-line notes):**  
  - **Misrepresenting supervaluationism’s higher-order problem**: "Supervaluationism has no higher-order vagueness" (Fails §1 of A-grade).  
  - **Oversimplifying epistemicism**: "Only one cutoff total" (Misses recursive cutoffs per order).  
  - **Superficial margin-for-error critique**: "It’s circular because it assumes vagueness" (Ignores explanatory role).  
  - **Weak concession**: "Epistemicism is unappealing" (Not a theoretical flaw).  

  ---  
  **Rationale**: This question forces engagement beyond first-order differences by targeting the *regress* inherent in higher-order vagueness. The model answer’s "weakness" avoids tokenism by highlighting a metalanguage paradox that could genuinely resurrect supervaluationism. The marking scheme rewards recursive analysis (A) over definitional knowledge (B), reflecting the course’s emphasis on structural precision.
