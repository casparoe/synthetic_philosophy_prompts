prompt: |-
  I'm a computer science major taking an upper-level epistemology seminar, and we've just covered Nozick's tracking theory and its trouble with epistemic closure. The vocabulary I actually work in on a daily basis comes from machine learning and systems: counterfactual invariance, robustness to distribution shift, ablation studies, adversarial perturbations, and claims about which properties of a system are or aren't preserved under composition. Restate Nozick's sensitivity and adherence conditions in that vocabulary, as faithfully as you can, and then recast the closure problem — the cases where a subject allegedly knows p, knows that p entails q, and yet, by the tracking theory, does not know q — as a question about whether a certain property composes across known entailments. Then give me the residue report: which parts of the tracking theory and the closure debate translate cleanly, which you had to distort to fit (for instance, Nozick's requirement that tracking be evaluated relative to a fixed method of belief formation), and which parts have no counterpart at all in my vocabulary. In particular, I want your view on whether the closure failure simply looks like a familiar phenomenon from my side — a robustness property that turns out not to be compositional — or whether something in the philosophers' debate is genuinely inexpressible for me; and if so, whether that points to a gap in my vocabulary or to an artifact of the tracking theory's own formulation.
