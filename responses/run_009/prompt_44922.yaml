prompt: |-
  I've held a fairly strong view about moral trade for over a decade now, picked up from the LessWrong/EA Forum ecosystem and never seriously shaken, and I'd like a rigorous map of what could actually break it.

  The view, as I hold it, has three tiers. Ground tier: the near-truism that agents with divergent values can usually do better trading than fighting -- if your votes and mine cancel on both factory-farming reform and on something you care far more about, we should each abstain in the other's domain and each come out ahead. Second tier: moral uncertainty reproduces this logic inside a single head. If there's a decent chance my true values are your values, then even with no trading partner in sight, the rational move is a compromise portfolio that hedges across my candidate value systems, weighted by credence. Third tier, and the part I actually care about: the same reasoning is supposed to reach agents no contract can ever bind. Under decision theories that care about evidential or logical correlations rather than only causal ones, I have counterparts in other possible worlds (or branches, or simulation runs -- the substrate doesn't matter to the argument) whose values I find repugnant, including values I expect to dominate futures after mine loses. A rational agent whose value system is destined to be a small minority, on this view, secures more of what it cares about by building successors that honor cross-world deals -- by giving the winners some of what they want, in exchange for the winners doing likewise -- than by grabbing whatever it can.

  So the concrete predictions I take myself to be committed to: that a hopeless minority value system should nonetheless spend real resources on cooperation with the value systems that will inherit other futures; that agents under moral uncertainty should visibly hedge rather than act on their favorite moral hypothesis; that compromise is available even where no enforcement mechanism exists.

  Tell me what would count against this. I want more than "causal decision theorists will deny the third tier" -- I know that, and I want to know how much of the view survives losing that tier. The objections I'm aware of but haven't seen ranked: that trade presupposes interpersonal comparability of welfare or value that may simply not exist, so "giving them some of what they want" is ill-defined for sufficiently alien value functions; that the bargaining problem lacks a privileged solution, so logically correlated agents with different values have no determinate deal to converge on and will disagree about the fair point on the frontier as bitterly as uncorrelated ones fight; that the correlations the whole scheme runs on are unconditionable by bounded agents like us, making the third tier true but unactionable -- a matter for theology rather than decision-making; and that the second tier quietly collapses, because a compromise across my candidate value systems is just what expected-value maximization under moral uncertainty already tells me to do, in which case "moral trade" adds nothing and the distinctive content of the view lives entirely in the tier I can least test.

  Rank the defeaters from fatal through serious through merely awkward. Say which of them the view's more careful defenders -- the people writing about superrationality and multiverse-wide cooperation in the decision-theory-adjacent literature -- would themselves concede as real pressure, versus which they would wave off, and whether the waving-off is principled or motivated. Assess honestly whether the view has been insulated by qualifications until it can barely lose: it now lives mostly in possible worlds I can't observe, with deals whose terms no one can specify, counterparties whose existence I can't confirm. Is that a fatal defect for a view of this kind, or just what adequate generality looks like at this level of abstraction -- and what, if anything, does the view predict differently from causal-decision-theoretic unilateralism or from straightforward maximization under one's best-guess ethics? If the answer is "nothing observable," I want to hear it said plainly rather than papered over.
reasoning: |-
  Okay, let me try to unpack this user's query. They've held a strong view on moral trade for over a decade, influenced by the LessWrong/EA Forum communities. Their view has three tiers: the basic idea of value-diverse agents trading instead of fighting, moral uncertainty leading to internal compromise, and extending this to logically correlated agents across possible worlds. They want to know what could break this view, especially the third tier, and how survivable each objection is.

  First, I need to recall the key components of their argument. The ground tier seems solid—agents with different values trading makes intuitive sense. The second tier, moral uncertainty leading to hedging, also aligns with standard decision theory under uncertainty. The third tier is the most contentious, relying on decision theories like EDT or UDT that consider logical correlations. 

  The user mentions several objections: interpersonal comparability, bargaining indeterminacy, unactionable correlations, and the redundancy of the second tier. I should rank these by how damaging they are. 

  Starting with bargaining indeterminacy: if there's no unique solution to the trade between alien values, the third tier falls apart. This seems fatal because without a defined compromise, agents might default to conflict. Even proponents like MIRI acknowledge this issue, so it's a serious weakness.

  Next, interpersonal comparability: if values are incommensurable, trading becomes impossible. This might be serious but not fatal if some comparability exists, especially under moral uncertainty. However, for truly alien values, it's a bigger problem.

  Unconditional correlations: bounded agents can't compute these correlations, making the third tier unactionable. This turns it into untestable theology, which is a serious problem for practicality, even if theoretically valid.

  Redundancy of the second tier: if moral hedging is just expected value maximization, then "moral trade" adds nothing new here. That collapses the distinctive part, leaving only the untestable third tier. This is awkward but not fatal to the core idea.

  Assessing insulation: the view's reliance on unobservable worlds and undefined deals makes it hard to test. If it doesn't predict differently from CDT or best-guess ethics, then it's more metaphysical than practical. The user seems concerned about this lack of falsifiability. 

  Proponents might wave off some objections, but bargaining indeterminacy is a conceded issue. The redundancy point might be waved off as a misunderstanding, but it's valid. Overall, the view survives as a theoretical framework but with limited actionable insights. The user wants honesty about whether it's testable, so I should emphasize that the third tier's predictions are mostly unobservable, reducing its practical utility compared to alternatives.
answer: |-
  Here's a rigorous breakdown of defeaters for your three-tiered moral trade view, ranked from most to least damaging, with an assessment of their impact and how proponents might respond:

  ### **Fatal Defeaters (Collapse Core Mechanism)**
  1. **Bargaining Indeterminacy (Fatal to Tier 3, Threatens Tier 1)**  
     - **Problem**: With alien/incommensurable values (e.g., paperclip maximizer vs. hedonic utilitarian), no unique "fair" trade exists. Pareto improvements may be impossible without a common currency. Even with commensurability, Nash bargaining solutions require symmetry assumptions that fail across worlds.  
     - **Proponent Response**: Conceded as serious (e.g., MIRI's work on "closest continuation" acknowledges arbitrariness). Defenders might retreat to trivial cases (near-identical values) or appeal to algorithmic negotiation (unproven for aliens).  
     - **Survivability**: Tier 3 collapses without a privileged solution. Tier 1 survives only for human-like values with shared welfare metrics.

  ### **Serious Defeaters (Undermine Actionability/Predictiveness)**
  2. **Unconditional Correlations (Fatal to Tier 3's Practicality)**  
     - **Problem**: Logical correlations between agents (e.g., other branches, simulations) are epistemically inaccessible to bounded agents. You can't condition your decisions on the existence or preferences of unobservable counterparts.  
     - **Proponent Response**: Waved off as "we'll solve decision theory later" (principled if optimistic, motivated if not). UDT theorists (e.g., Yudkowsky) treat this as a technical challenge.  
     - **Survivability**: Tier 3 becomes *theology*: true in principle but irrelevant to real decisions. Tiers 1–2 unaffected.

  3. **Interpersonal Comparability (Serious for Tiers 1 & 3)**  
     - **Problem**: Trade requires knowing *how much* your counterpart values concessions. If values are orthogonal (e.g., "dancing makes my soul flourish" vs. "minimize atomic motion"), "giving them what they want" is undefined.  
     - **Proponent Response**: Often handwaved with "aggregation over possibilities" (e.g., Bostrom's *Superintelligence*). Defenders might insist comparability emerges under moral uncertainty (Tier 2).  
     - **Survivability**: Cripples deals with *truly alien* values. Tier 2 may salvage comparability via shared uncertainty, but Tier 3 fails for extreme divergence.

  ### **Awkward Defeaters (Raise Internal Tensions)**
  4. **Tier 2 Redundancy (Awkward for Distinctiveness)**  
     - **Problem**: Hedging under moral uncertainty *is* expected value maximization. Calling this "moral trade" adds nothing—no distinct prescriptions beyond standard rationality.  
     - **Proponent Response**: Principled wave-off: "It’s framing that reveals deeper unity" (e.g., MacAskill). But conceding this collapses "moral trade" into trivial decision theory.  
     - **Survivability**: Tier 2 loses its conceptual novelty but remains valid. The *rhetorical* appeal to "trade" becomes redundant.

  5. **Insulation from Falsification (Epistemically Awkward)**  
     - **Problem**: Tier 3 deals occur in unobservable worlds with undefined terms. What would *disconfirm* it? A CDT maximizer and UDT cooperator behave identically if:  
       - No logical correlations exist.  
       - Bargaining fails.  
       - The "loser" values short-term gains over cosmic deals.  
     - **Proponent Response**: Principled: "Abstract decision theory *should* address non-falsifiable counterfactuals". But this risks making the view untestable cosmology.  
     - **Survivability**: Survives as math, but becomes irrelevant to empirical ethics. Predictions diverge from CDT only in thought experiments.

  ---

  ### **How Much Survives?**
  - **Tier 1 (Direct Trade)**: Robust *if* values are commensurable and enforcement exists. Fails for aliens or zero-sum conflicts.  
  - **Tier 2 (Moral Hedging)**: Stands as valid decision theory under moral uncertainty—but is not uniquely "trade".  
  - **Tier 3 (Cross-World Cooperation)**: **Effectively dead** as a guide for action. Bargaining indeterminacy + unactionable correlations + incommensurability leave it a provocative thought experiment with no testable implications.

  ---

  ### **Honest Assessment: What Does This View Predict?**
  - **Observable Differences vs. CDT/Best-Guess Ethics**:  
    - **Tier 1**: Predicts compromise in politics/institutions (e.g., EA donors funding diverse causes). Falsifiable if value-aligned groups reject Pareto-improving trades.  
    - **Tier 2**: Predicts hedging (e.g., altruists splitting donations between global health and animal welfare). Differentiable from "best-guess" if agents invest in options their favored theory rejects.  
    - **Tier 3**: **Predicts nothing observable**. A CDT agent in a doomed minority still "cooperates" if they believe it maximizes local utility; a UDT agent may defect if correlations are uncertain. No real-world behavior distinguishes them.

  - **Proponents' Concessions**: Careful defenders (e.g., Yudkowsky, Bostrom) concede bargaining indeterminacy and unactionability. They treat Tier 3 as *foundational* for long-term AI alignment—not as a policy tool. The waving-off is *principled* for ideal agents but *motivated* when applied to humans.

  ### **Verdict**
  Your view survives as:  
  - A strong argument for **multilateral compromise** (Tier 1).  
  - A **reformulation** of moral uncertainty (Tier 2).  
  But Tier 3 is **insulated beyond salvage** as a practical guide. It fails to generate unique predictions or obligations, reducing to an elegant but untestable metaphor for open-mindedness. Its true vulnerability isn't CDT denialism—it's that **no possible observation could compel a rational agent to prefer it over alternatives** in cross-world bargaining. What remains is a heuristic for humility ("My values might not dominate, so I'll hedge")—not a discovery about cosmic cooperation.
