answer: |-
  ## The Thirty-Year Silence

  The announcement didn’t come with sirens or screaming. It arrived in a sterile PDF, disseminated by the newly-formed Temporal Integrity Commission, confirmed by every major scientific body: humanity had an expiration date. Not today, not tomorrow, but precisely thirty years after the last person currently drawing breath ceased to do so. Lifespans unchanged. Death, individually, remained its familiar, untidy self. But the species? It had a hard stop. A terminus. No cause given. No explanation offered. Just… finitude.

  The world didn’t end. It just… shrank.

  Elara’s reaction was visceral, immediate. She walked straight from the public briefing screen back to the hushed, dust-mote cathedral of the National Archives. Her domain. Her life’s work: digitizing the Delaney Collection – centuries of letters, diaries, ship manifests, the fragile paper whispers of lives long gone. She ran her finger along a brittle 18th-century ledger, the ink fading like a sigh. *They thought they were writing for the future,* she thought. *And now?* The thought wasn’t despair, but a strange, cold pressure behind her ribs. She logged back into her terminal. The scanner hummed. Page 17,432 of the Delaney shipping logs flickered onto the screen. She adjusted the contrast. Her work continued.

  Leo, her brother, left the same briefing and walked straight to the park. He sat on a bench, watching children chase pigeons whose descendants would outlive them all. The absurdity choked him. He’d been meticulously restoring a vintage Norton motorcycle, a five-year project planned down to the last chrome bolt. That afternoon, he sold it for scrap value. Three days later, he leased a vacant storefront downtown. Within a month, ‘Leo’s Last Call’ opened – a microbrewery specializing in fast-fermenting ales meant to be consumed fresh, ideally within weeks. "Taste the Now," the sign proclaimed, slightly crookedly.

  **Thirteen Years Later**

  The Archives felt quieter, emptier. Retirements hadn’t been filled. Funding was perpetually ‘under review,’ a bureaucratic euphemism for a slow bleed. Elara worked alone most days in her section. The scanners were aging, the servers needed constant tending. Her project, once ambitious – a complete digital mirror of the physical collection – now felt like running alongside a train pulling out of a station she knew terminated in a void. Yet, she persisted. She calibrated the temperature in the rare book vault. She painstakingly corrected OCR errors in a 19th-century botanist’s smudged field notes. *He documented that flower thinking someone might find it useful,* she’d think, *someday*. The ‘someday’ was truncated, quantified, but it was *there*, wasn’t it? Thirty years after Millie from Accounting finally passed? There was still time *within* time. Wasn’t there?

  Leo’s brewery thrived. ‘Last Call’ was packed nightly, a warm hum of conversation deliberately louder than the quiet dread outside. People craved immediacy. His ‘Ephemeral IPA’ and ‘Vanishing Point Stout’ were ironic hits. He married Rosa, a ceramicist who now made beautiful, deliberately fragile cups – meant to be cherished briefly, then let go. They lived above the brewery, surrounded by vibrant, fleeting things. Leo laughed often, loudly. But Elara saw the tightness around his eyes when he thought no one was looking, the way his hand sometimes lingered on Rosa’s shoulder as if anchoring himself.

  **Twenty-Two Years Later**

  The city felt… thinner. Fewer construction cranes, more buildings quietly boarded up. Schools consolidated, then closed altogether. Pediatric wards became eerily silent museums of unused equipment. Long-term financial planning was a forgotten language; pensions dissolved into carefully hoarded rations of present comfort. The TIC released annual updates, grim actuarial poetry: *Based on current health metrics and statistical modeling, the projected species termination window commences in approximately 17 years ± 6 months.*

  Elara fought for server upgrades. The Delaney Collection was 89% digitized. She argued before a weary committee: "This isn't just *for* the future. It’s *about* it. It’s proof we looked back, we tried to understand. Even if the last eyes to see this are ours… the act matters. It’s… structure. Against the void." She won, barely. A single, overpriced server cluster. She installed it herself, her fingers trembling slightly on the connectors. *Who will maintain this after me?* The thought was ice water down her spine. She pushed it away. Page 198,765.

  Leo and Rosa hosted a ‘Midnight Bloom’ party. They’d converted the small brewery yard into a riot of night-blooming cereus, flowers that opened spectacularly for a single night and died by dawn. Guests drank and danced under strings of lights, surrounded by the heavy, intoxicating perfume of the unfolding blooms. Leo raised a glass. "To the flower that knows its moment!" The cheer was ragged, desperate. Later, Elara found him alone, staring at a wilting blossom, its pristine white already browning at the edges. "Beautiful, wasn't it?" he said, his voice thick. “Gone by breakfast.” Elara touched his arm. He didn’t pull away, but he didn’t look at her.

  **Twenty-Eight Years Later**

  The list was public now. Constantly updated. A morbid countdown clock measured in heartbeats. Elara was 64, statistically likely to see the terminus. Leo, 62, likely wouldn’t. Rosa was gone – a swift, brutal cancer the overstretched medical system couldn’t halt. Leo kept the brewery open, a ghost presiding over his own memorial.

  Elara walked through the near-deserted Archives. Her section was fully digitized. The server hummed, a lonely monument. Her colleagues were ghosts or gone. She found herself drawn not to the terminals, but to the physical remnants: a box labeled ‘Unprocessed Miscellany – 20th C.’ Inside, among faded postcards and concert programs, she found a small, sealed packet. ‘*Sequoia sempervirens* - Coast Redwood. Harvested: Muir Woods, 1998. Plant for the Future.’ Someone’s hopeful gesture, misplaced decades ago. Elara held the cool, smooth seeds in her palm. Giants. Trees that could live millennia. She closed her fist. The absurdity was crushing. *Plant for what future?*

  She found Leo digging in the small, neglected patch of earth behind the silent brewery. He looked older, worn thin. He didn’t turn as she approached.

  "What are you doing?" Elara asked, her voice echoing in the quiet alley.

  He straightened, wiping sweat from his forehead with a grimy sleeve. He pointed to a freshly dug hole, maybe two feet deep. Beside it lay a single acorn. Not a sequoia, but an oak. Still a promise of decades, centuries.

  "Found it," he rasped. "In Rosa’s old studio. Forgotten in a pocket. Probably from that hike… years ago." He looked at the acorn, then at the hole. "Stupid, right?"

  Elara knelt beside him. The dirt was cool and damp. She remembered the sequoia seeds burning a hole in her pocket upstairs. She thought of her pristine digital archive, humming uselessly in the empty building. She thought of Leo’s ales, drunk and forgotten, and Rosa’s shattered cups.

  Leo picked up the acorn. He held it for a long moment, rolling it between his thumb and forefinger. The sunlight caught the deep brown curve of it. His face was unreadable – not sad, not defiant, not hopeful. It was the face of someone performing an act whose meaning had become utterly opaque, yet felt necessary. He lowered it into the hole.

  He didn’t reach for the shovel immediately. They both knelt there, looking at the small, dark shape nestled in the dark earth. The silence wasn't peaceful; it was immense, a physical pressure. This oak, if it sprouted, would grow. Its roots would push down, its branches would reach up. It would see seasons Leo wouldn't, Elara probably wouldn't. It would mature decades after the last name on the TIC list blinked out. It would tower over a silent city, then a silent world, for centuries. A monument to… what? Folly? Habit? A refusal to accept the terms? Or was it, somehow, still an act of meaning – a gesture flung into the void simply because the *shape* of the gesture was ingrained, beautiful in its own tragic form? Was Elara’s archive the same? Was Leo’s lifetime of brewing?

  The meaning didn't settle. It *flickered*. Like a faulty bulb, it sparked – a brief, hot flare of *Yes, this matters, this defiance!* – then guttered into cold, logical *No, it’s dust waiting to happen, just slower*. Back and forth, too fast to grasp, leaving only a residue of profound disquiet.

  Leo finally picked up the shovel. He didn't look at Elara. He began pushing the dark earth back into the hole, covering the acorn, the potential, the absurdity. The soil fell with a soft, final sound. He patted it down gently, almost tenderly.

  Elara stood. Her back ached. She looked at the small mound of fresh earth, then at the silent brewery, then up at the indifferent sky. The archive server hummed faintly in her mind. She turned and walked back towards the Archives building without a word. Leo remained kneeling by the planted acorn, his hand resting on the disturbed earth, staring at nothing.

  Neither path felt sane. Neither felt foolish. They simply *were* – two ways of breathing in a room where the air had a known, finite quantity. The oak wouldn't witness humanity's end. But someone had planted it. That was the only fact that held, shimmering precariously, in the shrinking light. The future was a closed door. They were still arranging the furniture in the room before it.
