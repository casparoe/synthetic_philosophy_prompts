prompt: |-
  so our department just imploded over a hiring decision and i think we accidentally ran a live experiment on the discursive dilemma, and now i'm obsessed with whether there's a sane way for a committee of three to vote.

  basically: three of us, one candidate. we took three votes -- is her research strong, is she a good teacher, is she someone we can work with. majority said yes to all three (2-1 on research, 2-1 on teaching, 3-0 on collegiality). then we voted on "do we extend the offer" and it came out 2-1 against, because the one person who liked all three premises was the dissenter on research AND teaching, and the other two each blocked on a different premise. conclusion-level voting undid what premise-level voting supported. nobody did anything shady, it's just that majority doesn't commute with logical consequence, or however you'd put it.

  so now i've been reading up and it seems like there are a bunch of ways out and i want your help sorting them. please rank these aggregation procedures by how much you'd actually trust them for a small committee like ours (a tier list would be great, with a sentence on why each lands where it does):

  1. vote on the conclusion only, ignore premises
  2. vote on premises only, derive the conclusion by whatever rule we agreed to in advance (like, offer iff a majority says yes on every premise)
  3. let whoever chairs the meeting decide which style of vote to hold on a case-by-case basis
  4. discuss until we all converge, and only fall back to voting if discussion stalls
  5. rotate a "discursive dictator" -- one member per decision gets to say which premises are on the table, but the group still votes on each one
  6. something a colleague suggested that i'm not sure is even coherent: vote on the premises, then vote on whether this particular decision should be premise-driven or conclusion-driven, and apply whichever wins

  also, and this is the part i keep going back and forth on: do you think the whole framing assumes we already share the decision rule, and that's exactly what we didn't share? like our fight wasn't really about aggregation, it was about whether "must be strong on all three dimensions" is even the right standard for a hire, and no voting method can save you from that. but maybe that's me being defeatist. be honest about which of the six (or none) you'd trust, and whether my last point is a real insight or just an excuse to keep arguing.
reasoning: |-
  Okay, the user's department had a hiring decision implode due to a discursive dilemma situation. They described how voting on premises (research, teaching, collegiality) had majority support, but the conclusion vote (extend offer) failed 2-1. Now they're looking for the best voting method for a three-person committee.

  I need to understand the core issue here. The discursive dilemma shows that aggregating individual votes on premises can lead to a different outcome than voting directly on the conclusion. This happened because the dissenter on each premise was different, but they aligned against the conclusion. The user is questioning whether the real problem was a lack of shared decision rule about needing strength in all three areas.

  Looking at their proposed solutions, I need to evaluate each one for practicality and trustworthiness in a small committee setting. For a tier list, I'll group them into S (most trusted) to D (least trusted).

  Option 4 (discuss until convergence) seems best for a small group. With only three people, thorough discussion could resolve differing interpretations and build consensus. It avoids voting pitfalls entirely if successful. This deserves S-tier.

  Option 2 (vote on premises only) is next best. It forces the committee to explicitly agree on the decision rule upfront ("offer only if majority yes on all premises"). This prevents last-minute surprises and makes the process transparent. A-tier.

  Option 1 (vote on conclusion only) is straightforward but loses nuance. It might lead to inconsistent standards across candidates. Still functional at B-tier.

  Option 5 (rotating discursive dictator) introduces too much variability. Giving one person control over which premises matter could feel unfair and might not reflect shared values. C-tier.

  Option 3 (chair decides voting style) risks perception of manipulation. The chair could choose methods favoring specific outcomes, damaging trust. D-tier.

  Option 6 (meta-vote on voting method) seems messy and circular. Voting on how to vote after seeing premise results invites gaming the system. Definitely D-tier.

  Regarding their insight about shared decision rules - this is crucial. The voting method can't compensate for fundamental disagreement about what criteria matter. The real solution involves aligning on standards before voting occurs. This isn't defeatist; it's the core issue they need to resolve.

  For implementation, I'd suggest: First, have an explicit meeting to establish hiring standards. Only then choose a voting method (premise-based or conclusion-based). For three people, discussion should be primary with premise voting as backup. Document everything to prevent future conflicts.
answer: |-
  Based on your experience and the nuances of small committees, here's a tier list ranking of the aggregation methods, followed by an analysis of your core insight:

  **Trust Tier List (S = Most Trusted, D = Least Trusted):**

  | Tier | Option | Why It Lands Here                                                                                                                                 |
  |------|--------|---------------------------------------------------------------------------------------------------------------------------------------------------|
  | **S** | **4. Discuss until convergence** | **Best for small groups.** Prioritizes consensus and shared understanding over mechanical voting. Builds buy-in, surfaces hidden disagreements about standards *before* voting, and often resolves the discursive dilemma naturally. Only falls back to voting if truly stuck. Most humane and robust. |
  | **A** | **2. Vote on premises only** | **Clear, predictable, and forces rule agreement upfront.** If you *explicitly* agree "offer iff majority yes on all premises" *before voting*, the outcome is transparent and avoids the dilemma. Your accident happened precisely because this rule wasn't locked in. |
  | **B** | **1. Vote on conclusion only** | **Simple and decisive, but loses nuance.** Avoids the dilemma but risks inconsistent standards ("Why did we hire X but not Y?"). Relies heavily on individual judgement integrating complex factors silently. Functional, but less rigorous than premise voting with a shared rule. |
  | **C** | **5. Rotating discursive dictator** | **Unstable and potentially unfair.** Gives excessive power to one member to define the relevant premises each time. Can lead to strategic premise selection, resentment ("Why did *they* get to ignore teaching?"), and inconsistent criteria. Prioritizes procedure over shared standards. |
  | **D** | **3. Chair decides vote style** | **Invites manipulation and distrust.** The chair becomes a de facto decider based on *how* they frame the vote. Perceived neutrality is destroyed ("They chose conclusion voting because they knew X would lose"). Worst option for trust in a small committee. |
  | **D** | **6. Meta-vote on voting method** | **Circular, incoherent, and easily gamed.** Voting *after* seeing premise results incentivizes members to choose the aggregation method that delivers their preferred outcome. Guarantees arguments about procedure *every single time*. |

  **Your Core Insight is Profoundly Correct (Not Defeatist):**

  > *"do you think the whole framing assumes we already share the decision rule... our fight wasn't really about aggregation, it was about whether 'must be strong on all three dimensions' is even the right standard"*

  **This is the absolute heart of the matter.** The discursive dilemma exposed a **fundamental lack of shared understanding** about your hiring *conjunctive rule*, not just a voting glitch. Here's why:

  1.  **The Dilemma as Symptom:** The conflicting votes reveal that members applied the AND rule inconsistently. The two who blocked the conclusion likely believed that a "no" on *their* key premise (research for one, teaching for the other) *should* automatically veto the hire, regardless of other votes. The dissenter likely applied a softer "overall positive" standard. The voting merely surfaced this pre-existing disagreement about the *meaning* of the criteria and the *decision rule*.
  2.  **No Voting Method Fixes Rule Disagreement:** Premise voting (Option 2) only works if you genuinely agree *in advance* that "majority yes on all premises = hire". If you don't truly share that rule, forcing it procedurally will feel illegitimate to dissenters. Conclusion voting (Option 1) hides the rule disagreement but doesn't resolve it, leading to inconsistent future decisions.
  3.  **The Real Work is Alignment:** Your committee needs to discuss and explicitly agree on:
      *   What each criterion *actually means* (e.g., "What does 'strong research' look like for this role?").
      *   **The decision rule:** Is it a strict AND (weakness on any *one* dimension is a veto)? Is it a qualified AND (e.g., "Outstanding in one can compensate for adequacy in another")? Is it an overall holistic judgement?
      *   The *relative weight* of each criterion.

  **Recommendation for Your Committee:**

  1.  **Align on Standards & Rules First:** Before your next hire, have a dedicated meeting (or several) to discuss and document:
      *   Clear definitions of "Strong Research," "Good Teacher," "Collegial" *for your specific departmental context and needs*.
      *   An explicit decision rule: "We will extend an offer only if a majority votes 'Yes' on Research AND Teaching AND Collegiality" (strict AND), or agree on a compensatory model if that's your preference.
      *   (Optional but recommended) Discuss potential trade-offs/scenarios (e.g., "Would we hire someone truly outstanding in research but merely adequate in teaching?").
  2.  **Choose a Voting Method *After* Alignment:**
      *   **Best:** **Option 4 (Discuss until convergence).** For a committee of three, this is ideal. Talk through the candidate holistically against your agreed standards. Aim for consensus. Vote *only* if truly deadlocked (and then specify *how* you'll vote if it gets to that point - see next).
      *   **Good Fallback:** **Option 2 (Premise Voting with Agreed Rule).** If discussion stalls, vote on each premise using your pre-agreed strict AND rule. This is transparent and honors the shared understanding you built. Document the premise votes and the automatic conclusion.
      *   **Acceptable Simplicity:** **Option 1 (Conclusion Vote).** Use this *only* if you have high trust and feel your discussion has sufficiently aligned everyone's understanding of the holistic standard. It's simpler but carries the risk of inconsistent application over time.

  **Stop using Options 3, 5, and 6.** They introduce more problems than they solve for a small group.

  Your experience wasn't just a voting paradox; it was a valuable (if painful) revelation of unspoken disagreements about foundational hiring philosophy. Addressing *that* alignment is the path to sanity, far more than choosing a clever aggregation mechanism. The discursive dilemma did its job: it forced you to see the deeper issue. Now go fix the root cause.
