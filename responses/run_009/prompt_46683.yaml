prompt: |-
  My roommate and I have been arguing for years about who owes what to whom, and over that time she's built up a set of verdicts on particular cases that I can't quite reverse-engineer. I want your read on a new case before I bring it up with her. Her verdicts so far: a stranger drowning in a pond right in front of you — you have to wade in, and she's unmoved by the fact that the same money sent to a releif agency would've saved more children abroad; to her, never getting around to that mailing is stingy but not wrong. Your nephew's last tuition payment versus a donation that would do more good for strangers at the same cost: paying the nephew is fine, she doesnt even ask you to split it. Two strangers both standing in front of you, same need, only one can be helped, one a fellow citizen and one not: she says citizenship doesn't tip it, pick either. A close friend from abroad versus a compatriot stranger with equal need: the friend comes first, and she doesn't apologize for that. But at the level of the government she flips — she thinks her country would be wrong to spend its last budget dollars on equally poor foreigners rather than its own poor; down there, some priority to compatriots is right. Now the new case. Tonight she has time to help exactly one person. There's a tourist she's never met, not a citizen of her country, who just collapsed on the sidewalk in front of her and needs someone to stay with him until the ambulance comes, which could be forty minutes. Or her best friend, a fellow citizen, who just called from across town: locked out of her apartment, diabetic, glucose crashing, needs supplies brought over within the hour, and the drive is thirty minutes each way. So what will she do? And don't just give me the answer — honestly I care less about which one she picks than about how you get there. What I want is the candidate rules that fit her record so far (I can count at least two, maybe three), what each of those rules predicts for tonight's case, your best guess with your reasons for preferring it, and then the next case I should pose her, the one that would best split the remaining rules apart. Please write it as continuous prose only, no headings or bullet points or bold or tables, the way you'd write an email or a letter, and keep it in American English.
reasoning: |-
  Okay, the user is presenting a fascinating ethical puzzle that their roommate has built through various verdicts on different scenarios. This seems like a classic case of trying to reverse-engineer someone's moral framework from their judgments. 

  Hmm, let me unpack what we know about the roommate's positions. The drowning child case shows she rejects pure utilitarianism - proximity matters more than maximum impact. The nephew versus donation scenario confirms personal relationships trump impartial good. The two strangers case reveals she doesn't value citizenship at the individual level, but interestingly flips when it comes to government spending. The friend versus compatriot stranger solidifies that personal connection overrides national ties.

  The user wants me to predict the roommate's choice in this new dilemma involving a foreign tourist in immediate distress versus a diabetic best friend across town. More importantly, they want the reasoning process - the candidate rules at play, how each would resolve this case, and what test case could distinguish between them.

  I notice two strong principles emerging from her past judgments: 1) Physical proximity creates obligation (drowning child), and 2) Personal relationships create special duties (nephew, friend). But the citizenship factor is tricky - irrelevant between individuals but mandatory for governments. 

  For tonight's case... The tourist has proximity (collapsed right in front) but no relationship. The friend has strong relationship but no proximity (across town). So which principle wins? Given how she prioritized the drowning child over more effective distant aid, and the friend over the compatriot stranger, I suspect proximity might beat citizenship (since she rejected that in the two-strangers case) but relationship might beat proximity? No, in the drowning case proximity beat relationship-with-humanity... This is messy.

  Perhaps her framework has tiers: immediate physical emergency first (drowning child), then personal obligations (nephew/friend), with citizenship only mattering institutionally. But the diabetic friend's need seems more urgent - glucose crash versus stable-but-needs-companionship. Yet she didn't compare need levels before... 

  I think the roommate would help the friend. The relationship factor seems stronger than proximity in her precedents - she excused not helping distant children but wouldn't excuse neglecting the nephew. Also the diabetic situation is time-critical in a way the tourist's isn't. 

  For the next test case... We need something that pits relationship against proximity more cleanly. Like: two people collapsing simultaneously - one a stranger at her feet, one her mother half a block away. That would force the hierarchy.
answer: |-
  Okay, let's tackle this ethically tangled roommate situation. I appreciate you walking me through her verdicts; they paint a fascinating picture of someone wrestling with moral proximity, special obligations, and the messy intersection of the personal and the political. Figuring out the underlying rules feels like detective work, and predicting tonight's case is the perfect test. Here's how I see it.

  Based on her past judgments, at least two distinct principles seem consistently at play, and a third might be lurking:

  1.  **The Principle of Concrete Proximity:** This is the most visceral rule. When someone is *physically present* and suffering an *immediate, acute need* that *you can directly address with minimal abstraction*, you have a strong obligation to act. This explains the drowning child trumping distant, more efficient aid. The immediacy and lack of intermediaries ("wading in") matter profoundly. Not sending money abroad isn't *wrong* in the same way because the need isn't concretely before her; it's mediated by geography, institutions, and choice (mailing or not). The two strangers case reinforces this: when *both* needs are equally concrete and proximate, other factors (like citizenship) don't magically tip the scales. The direct, unmediated encounter creates the primary duty.
  2.  **The Principle of Relational Obligation:** This governs special duties arising from personal connections. Paying the nephew is "fine" without splitting because the familial bond creates a specific, non-transferable responsibility that outweighs maximizing abstract good for strangers. Prioritizing a close friend over an equally needy compatriot stranger is the clearest example – the friendship itself generates a unique claim on her aid that citizenship alone doesn't override. This principle operates powerfully at the individual level.
  3.  **The Contextual Principle of Collective Identity (for Institutions):** This is where she flips. At the *governmental* level, she believes in prioritizing compatriots ("its own poor") over equally poor foreigners. This isn't about proximity or personal relationships in the same way. It seems rooted in a belief that governments have a fundamental duty *as representatives of a specific people* – a duty tied to shared identity, social contract, and collective responsibility within a bounded political community. This principle is explicitly *not* applied to individual actors facing immediate choices between individuals (as per the two strangers case).

  **Predicting Tonight's Case:**

  Now, for the tourist collapsing right in front of her versus the diabetic best friend across town. Both principles 1 and 2 are powerfully engaged, but they point in opposite directions.

  *   **Principle 1 (Concrete Proximity) predicts helping the tourist.** The tourist is physically present, suffering an immediate, acute need (collapsed, needing accompaniment). She can directly address this need *right now* by staying put. The friend's need, while dire, is not proximate; it requires a significant time investment (driving 30 mins each way) and is geographically mediated. The immediacy and directness favor the tourist.
  *   **Principle 2 (Relational Obligation) predicts helping the friend.** The best friend relationship creates a powerful, specific obligation. This isn't just a stranger in need; it's *her best friend* in a potentially life-threatening situation (diabetic emergency). The relational bond likely creates a stronger claim than the tourist's proximity, mirroring the "close friend vs. compatriot stranger" verdict where relationship trumped citizenship/stranger status.

  **My Best Guess & Reasoning:**

  I think your roommate will choose to help her **best friend**, driven primarily by Principle 2 (Relational Obligation).

  Here's why I lean that way:

  1.  **The Strength of Relational Obligation:** Her verdicts consistently show that personal bonds (nephew, close friend) create exceptionally strong duties she feels no need to apologize for or dilute. This seems to be a core, non-negotiable part of her moral framework. The friend isn't just "a" diabetic; she's *her best friend* having an emergency. That relationship likely outweighs the immediacy of the tourist.
  2.  **The Nature of the Need:** While the tourist's need is immediate and concrete, the *urgency* might be interpreted differently. The tourist needs accompaniment until help arrives (stable but requiring presence). The friend needs active intervention *within a strict time limit* (glucose crashing, supplies needed within the hour, travel time critical). The potentially faster escalation and the requirement for *active, time-sensitive intervention* might make the friend's need feel more acute *because* of the relationship – she understands the stakes for her friend intimately. The tourist's need, while serious, might feel more passive (waiting).
  3.  **Proximity vs. Mediation:** While the tourist is physically proximate, helping the friend isn't *as* abstracted as sending money overseas. She's driving directly to her friend – there's still a direct line of action, just requiring travel. The drowning child case involved zero mediation; tonight's friend case involves *some* (driving), but it's still her acting directly for someone she knows deeply. Principle 1 seems strongest against *distant, institutional* mediation, not necessarily against acting for a close relation requiring modest travel.
  4.  **Citizenship is Irrelevant Here:** As per the two strangers case, citizenship doesn't tip the scales at the individual level. So the tourist being foreign likely doesn't factor in negatively, but the friend being a compatriot doesn't add a positive boost either. The decision rests on proximity vs. relationship.

  **The Next Test Case to Split the Rules:**

  To really distinguish the relative weights of Concrete Proximity and Relational Obligation (since tonight's case pits them against each other), we need a case where the *relationship* is weaker than "best friend," but the *proximity/immediacy* gap is even starker than tonight's. Here's the case I'd propose to her next:

  > *"Imagine you are walking alone in a quiet park. You see a child you vaguely recognize from your neighborhood (you know their face and name, but they aren't family or a close friend's child – maybe you've waved hello a few times) trip and fall hard, crying out in pain, possibly with a broken arm, about 20 feet away. At that exact moment, your phone rings. It's your sibling, calling from their home 5 minutes drive away. They are having a severe panic attack (a recurring issue you know well) and are begging you to come over immediately to help them calm down, as they live alone and feel completely overwhelmed."*

  **Why this case?**

  1.  **Relationship Dilution:** The neighborhood child represents a *weak* relational tie – recognition and local connection, but nowhere near the strength of nephew, best friend, or even the vague "friend from abroad." The sibling represents a *strong* relational tie.
  2.  **Proximity/Immediacy Amplification:** The child is *extremely* proximate (20 feet away), visibly injured, and needs immediate assessment/comfort until help arrives (like the tourist, but even closer). The sibling is very close geographically (5 mins), but their need, while serious and time-sensitive, is not a sudden physical trauma happening *right before your eyes*; it requires travel, even if short.
  3.  **The Conflict:** Does the extreme physical proximity and immediacy of the weakly related child's *physical injury* override the strong relational obligation to the slightly less proximate sibling experiencing a *mental health crisis*? Or does the strong sibling bond still win out?
  4.  **Splitting the Rules:** If she helps the child, it strongly suggests Concrete Proximity (especially involving physical trauma witnessed directly) is her *dominant* principle, capable of overriding moderate-to-strong relational obligations. If she helps the sibling, it confirms that Relational Obligation is paramount, even when the competing need is highly proximate and involves physical harm to someone with *some* weak connection. It also tests if the *type* of need (physical injury vs. mental health crisis) factors in for her when proximity and relationship are in tension.

  This next case should provide a much clearer signal about which principle carries more weight in her personal ethical hierarchy when they directly collide. Good luck navigating the roommate moral maze! Let me know how tonight goes and what she says about the next hypothetical if you use it. This is genuinely intriguing stuff.

