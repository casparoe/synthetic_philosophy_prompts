prompt: |-
  i edit a small magazine where every issue pairs a short life of someone admirable with a short life of someone who went wrong — sort of Plutarch-style, though with modern people. The whole pitch is that readers pick up character better from lives than from rules. I've been in a running argument with a friend who writes for a religious audience and is convinced any admiring life has to lean hagiographic — clean up the flaws, or nobody comes away with something to imitate. Before we go another round on specific people, I want the spec first.

  Write the desiderata: what an adequate use of biography for moral learning has to deliver. I'm thinking things like — which cases it has to handle (the subject with one ruinous flaw, the person who was right about the big thing and aweful in private life, the admirable-but-not-immitable genius), the distinctions it can't collapse (learning about a person vs learning from a person, imitating vs merely admiring), and whatever constraints come from how people actually absorb exemplars. Give the case or consideration behind each requirement, and mark which are non-negotiable and which are really just the taste of one camp. My friend's camp will say "must present an imitable ideal," mine will say "must be honest about the subject's failures," and I suspect we can't always have both. If some subset of the requirements turns out to be jointly unsatisfiable, say so plainly — that's the part I most want to see, and tell me which side each unsatisfiable pair is forcing a choice between.

  Two more things. Don't score actual biographies or lives against the list, I'll do that myself — just the spec. And if you think the premise itself is off — that nobody really learns morality from lives, that Plutarch's pairs were mostly entertainment for readers who already agreed — say that straight instead of handing me a polite list. Same if you think one of my suggested requirements above is just my prejudice dressed up as a spec. I'd rather hear that than get the version built to please me.
reasoning: |-
  Okay, the user runs a small magazine that pairs admirable and flawed modern lives in a Plutarch-style format. Their core idea is that character is better understood through lived examples than abstract rules. They're locked in a debate with a religious writer friend who insists that biographies for moral learning must present sanitized, imitable ideals (hagiography), while the user values unvarnished honesty. They want a framework to evaluate what makes biography effective for moral education—without favoring either camp artificially.

  Hmm. This is fundamentally about epistemology and moral psychology: how humans actually absorb ethical lessons from others' lives. The user's phrasing suggests they suspect their friend's "imitable ideal" approach may be psychologically naive or even counterproductive. Their request for "jointly unsatisfiable" points is particularly telling—they're preparing for principled compromise or confrontation.

  Key tensions I notice:
  - The friend's position likely stems from a didactic tradition where exemplars must be flawless to compel emulation (common in religious pedagogy). But this risks creating impossible standards or disillusionment upon discovering the truth.
  - The user's "honesty about failures" aligns with modern psych findings about growth mindset, yet raw complexity could overwhelm readers seeking guidance.
  - Both miss nuance: moral learning isn't binary (imitate/admire) but operates on spectra—e.g., contextual adoption of traits.

  The user's unspoken needs: 
  1. They want armor for their editorial philosophy (hence "non-negotiables"). 
  2. They suspect their magazine's value lies in gray-area explorations, not tidy lessons. 
  3. They need language to persuade religious audiences without capitulating.

  Landmines to avoid:
  - Presuming biography is the only moral teacher (it's not). 
  - Equating "religious" with "simplistic"—many theological traditions wrestle deeply with flawed exemplars (Augustine, David). 
  - Over-indexing on Western thought; should nod to broader traditions (e.g., Confucian exemplarism).

  Core requirements should cover:
  1. **Epistemic rigor**: Truth-telling as foundational (non-negotiable). Flawed records corrupt moral learning.
  2. **Psychological realism**: How humans parse exemplars (e.g., we emulate aspects, not wholes). 
  3. **Pedagogical utility**: What makes lessons "sticky." Surprise: failure often teaches better than perfection.
  4. **Moral taxonomy**: Distinguishing different learning modes (avoiding vs. emulating, etc.).

  The irreconcilable conflict emerges here: 
  - **Friend's camp** demands curated ideals to activate mirror neurons/aspiration. 
  - **User's camp** demands cognitive dissonance (flaws) to prevent blind hero-worship. 
  But! Studies show flawed exemplars can deepen engagement if framed as growth (e.g., Keltner's work on awe). The true deadlock is about *reader preparedness*: novices may need simpler models than mature audiences. This suggests magazine's audience matters critically. 

  Final structure: Organize requirements into Truth, Learning Mechanics, and Moral Function—then flag tensions. The unsatisfiable pair is "Idealization for Motivation" vs. "Complexity for Wisdom." Religious audiences often prioritize the former; the user's approach serves the latter. Resolution might lie in sequencing: early lessons use clearer models, advanced work embraces nuance. Since the magazine pairs lives, they could intentionally design contrast—e.g., "Here's a curated saint, here's a cautionary tale; now compare their decision points."
answer: |-
  Here's a specification for using biography in moral learning, designed to handle your philosophical conflict. It breaks down into core requirements, distinctions, constraints, and explicit tensions. Requirements are categorized as **Non-Negotiable** (fundamental to the method), **Negotiable/Camp-Dependent** (where your friend's "hagiographic" view and your "warts-and-all" view clash), and **Constrained by Human Cognition** (based on evidence of how people process exemplars).

  ---

  ### **I. Non-Negotiable Requirements**  
  *(Essential for any adequate use of biography in moral learning)*  
  1. **Truthfulness of Core Facts**  
     - *Case/Consideration*: If key events/choices are fabricated or omitted, the "lesson" is corrupted. E.g., a biography omitting Churchill’s colonial atrocities or Gandhi’s complex personal experiments distorts historical/moral context.  
     - *Why Non-Negotiable*: Moral learning requires trust. Fiction teaches differently.  

  2. **Contextualization of Actions**  
     - *Case/Consideration*: Actions must be framed within their historical/social milieu. E.g., judging a 19th-century abolitionist by 21st-century gender norms without context prevents nuanced understanding.  
     - *Why Non-Negotiable*: Decontextualized judgments are anachronistic and undermine empathy.  

  3. **Distinction Between Admiration and Imitation**  
     - *Case/Consideration*: Readers must grasp that some traits (e.g., Einstein’s genius) are admirable but not imitable, while others (e.g., his perseverance) might be. Prevents fatalism ("I could never be like them").  
     - *Why Non-Negotiable*: Collapsing this risks unrealistic aspirations or dismissal of the subject’s relevance.  

  ---

  ### **II. Negotiable/Camp-Dependent Requirements**  
  *(Where your friend’s "hagiographic" camp and your "honest failures" camp fundamentally diverge)*  
  4. **Idealization vs. Holistic Complexity**  
     - *Friend’s Camp*: **Must present an imitable ideal** (e.g., sanitized Mother Teresa).  
       - *Case*: Religious pedagogy often uses "perfect" models to inspire emulation. Flaws may distract or discourage.  
     - *Your Camp*: **Must be honest about failures** (e.g., MLK’s infidelities, Darwin’s anxiety).  
       - *Case*: Omitting flaws breeds disillusionment upon discovery and misses learning from mistakes.  
     - *Tension*: **Jointly unsatisfiable in extreme forms**. Over-idealization sacrifices truth; over-emphasis on flaws can obscure redeemable virtues.  

  5. **Resolution of Moral Ambiguity**  
     - *Friend’s Camp*: **Biography should provide clear moral directives** (e.g., "Do X like this saint").  
       - *Case*: Audiences seeking actionable rules may disengage if lessons are ambiguous.  
     - *Your Camp*: **Biography should provoke moral reflection** (e.g., "How did Frida Kahlo’s pain fuel art but poison relationships?").  
       - *Case*: Modern ethics values critical thinking over rote imitation.  
     - *Tension*: Direct imitation requires simplification; reflection thrives on complexity.  

  ---

  ### **III. Constraints from Human Cognition**  
  *(How people absorb exemplars; evidence-based)*  
  6. **Narrative Engagement > Abstract Rules**  
     - *Case/Consideration*: Stories activate empathy and memory better than maxims (e.g., Dickens’ *A Christmas Carol* vs. an essay on charity).  
     - *Constraint*: Biographies must be compelling narratives to "stick." Dry chronicles fail.  

  7. **Proximity Principle**  
     - *Case/Consideration*: Readers emulate traits perceived as achievable. E.g., a teenager admires a musician’s creativity but imitates their work ethic.  
     - *Constraint*: Overly exceptional lives (e.g., Napoleon) may inspire awe but not imitation without breaking down relatable components.  

  8. **Failure as Pedagogically Potent**  
     - *Case/Consideration*: Cognitive studies show failures often teach better than successes (e.g., Steve Jobs’ early arrogance leading to exile).  
     - *Constraint*: Omitting failures wastes potent learning opportunities and risks idealizing toxic traits.  

  ---

  ### **IV. Critical Distinctions the Method Must Preserve**  
  9. **Learning *About* vs. Learning *From***  
     - *Case/Consideration*: Learning *about* Tesla’s eccentricities is trivia; learning *from* his obsessions about balancing passion and pragmatism is moral.  
     - *Why Essential*: Without this, biography becomes history, not ethics.  

  10. **Trait-Specific Imitation vs. Whole-Person Admiration**  
      - *Case/Consideration*: We can imitate Marie Curie’s tenacity without adopting her workaholic neglect of health. Admiring Lincoln doesn’t require tolerating his early racial views.  
      - *Why Essential*: Prevents "all-or-nothing" judgments that discard useful lessons.  

  ---

  ### **V. Cases the Method Must Handle**  
  *(Testing robustness)*  
  11. **The Ruinous Flaw** (e.g., Churchill’s strategic brilliance vs. his role in the Bengal Famine)  
      - *Requirement*: Must explain how virtue/vice coexist without collapsing into hero/villain binaries.  

  12. **Right on Big Thing, Awful in Private** (e.g., Sartre’s philosophical insight vs. his toxic relationships)  
      - *Requirement*: Must separate public legacy from private conduct without excusing either.  

  13. **Admirable-but-Not-Imitable Genius** (e.g., Mozart’s musical genius vs. his impulsivity)  
      - *Requirement*: Must identify *which* traits are transferable (e.g., discipline in revision) and which are not (innate talent).  

  ---

  ### **Unsatisfiable Pairs & Forced Choices**  
  - **Idealization (Friend) vs. Holistic Complexity (You)**  
    - *Choice*: You cannot fully idealize a life *and* present its failures meaningfully. One camp must yield:  
      - Friend’s camp prioritizes **motivation through aspiration**.  
      - Your camp prioritizes **wisdom through realism**.  
    - *Resolution*: Your magazine’s pairing format (admirable + flawed) sidesteps this by separating cases, but *within a single biography*, the tension remains.  

  - **Direct Imitation (Friend) vs. Reflective Engagement (You)**  
    - *Choice*: Highly imitable models require simplification; complex models resist imitation. Forces a choice between:  
      - Friend’s camp: **Clarity for moral beginners**.  
      - Your camp: **Depth for moral maturity**.  

  ---

  ### **Premise Check**  
  The premise **holds**, with caveats:  
  - Biographies *can* teach morality, but **only if processed actively**. Plutarch’s readers were elites debating virtue; similarly, your readers must engage critically.  
  - Research supports narrative-based moral learning (e.g., Bruner’s studies on "storied thinking"), but it works best when paired with discussion/reflection—hence your paired format is astute.  
  - **Your requirement for honesty about failures is not prejudice**; it’s supported by cognitive science (e.g., "productive failure" theory). Your friend’s preference is pedagogically functional for specific audiences but risks didactic fragility.  

  ---

  ### **Summary Spec**  
  An adequate biographical method for moral learning must:  
  1. Be truthful and contextualized.  
  2. Preserve distinctions (admiration/imitation, about/from).  
  3. Handle complex/ambiguous cases (ruinous flaws, genius).  
  4. Respect cognitive constraints (narrative engagement, proximity, failure’s power).  
  5. **Acknowledge tensions**: You cannot maximize both idealization *and* holistic honesty in a single life. Your format (paired lives) mitigates this by distributing roles—one life for aspiration, one for caution.  

  This forces your friend’s camp toward **simplification for imitation** and yours toward **complexity for reflection**. The magazine’s value lies in not choosing one, but making the tension productive through contrast. Now go win that argument.
