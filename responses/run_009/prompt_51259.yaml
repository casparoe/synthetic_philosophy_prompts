  | 1        | B                     | A                     |            |                                    |
  | 2        | A                     | B                     | C          |                                    |
  | 3        | B                     | A                     |            |                                    |
  | 4        | A                     | A                     |            | **Non-discriminating** (both agree on A) |
  | 5        | A                     | B                     | C          |                                    |
  | 6        | B or C                | A                     |            | (B and C both count for E)         |
  | 7        | A                     | B or C                |            | (C counts as CR if chosen)         |
  | 8        | B                     | B                     |            | **Non-discriminating** (both agree on B) |
  | 9        | C                     | B                     |            |                                    |
  | 10       | A or C                | B or C                |            | (C counts for both)                |

  #### How to Score:
  - For each answer, add **1 point** to the column you circled (E, CR, or H).  
  - **Q4 & Q8**: Award points as marked—they don’t distinguish theories.  
  - **Q10**: If you chose **C**, add 1 point to **both E and CR** (it reflects overlap).  
  - **Totals**: Sum points for **E**, **CR**, and **H**.

  #### Interpretation:
  - **Etiological (Selected-Effect)**: Highest E. Focus: *why the trait evolved*.  
  - **Causal-Role**: Highest CR. Focus: *current contribution to system*.  
  - **Hybrid/Pluralist**: Highest H, or balanced E/CR (e.g., 3E/3CR). Acknowledges both history and current role.  
  - **Other/Inconsistent**: No clear lead, or mismatched (e.g., high E + high CR but low H). Suggests unorthodox intuitions.  
  - **Non-discriminating cases**: Q4 (hearts always "pump blood") and Q8 (sickle cell’s function is malaria resistance) reveal where theories agree.  

  **Design Notes**:  
  - Q7 (whale pelvis) and Q10 (goosebumps) help separate etiological from causal-role when vestigial traits have contested roles.  
  - Artifact (Q5) and ritual (Q9) cases test intuitions about design vs. use.  
  - Scoring avoids forcing answers into buckets; inconsistent patterns are flagged as "other."  

  This fits on one page when printed. Use the scoring to spark discussion: students often discover they’re pluralists! Let me know if you need formatting tweaks.
