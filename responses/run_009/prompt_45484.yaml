answer: |-
  Here's a decision tree designed to reveal your implicit definition of life by forcing choices on borderline cases. It prioritizes operational questions over abstract terms and locates your position within the logical space of criteria. Named definitions appear at the leaves with their key commitments.

  **Decision Tree: "Is This Thing Alive?"**

  1.  **Does the entity *continuously* self-maintain its ordered structure using energy?**
      *   **No -->** Go to 2
      *   **Yes -->** Go to 3

  2.  **Is the entity capable of *regulated replication* of its specific, complex structure?**
      *   **No -->** Go to 4
      *   **Yes -->** Go to 5

  3.  **Is the entity capable of *regulated replication* of its specific, complex structure?**
      *   **No -->** Go to 6
      *   **Yes -->** Go to 7

  4.  **Case Examples:** Prion (mis-folded protein), Growing Crystal, Forest Fire.
      *   **Leaf:** **Non-Life** (All definitions). Awkward: Prions *spread* and crystals *grow*, but lack core life processes.
  5.  **Case Examples:** Plain Virus, Giant Virus (Mimivirus), Self-Replicating Digital Organism (Avida).
      *   **Leaf:** **Replication-First Definition** (e.g., Dawkins, some genetic views). Awkward: Commits to calling a computer virus "alive" while excluding dormant embryos or metabolizing mules.
  6.  **Case Examples:** Dried-Out Tardigrade (Tun State), Frozen Embryo (in stasis), Comatose Human.
      *   **Leaf:** **Potentiality-Based Definition** (e.g., Aristotelian, some theological). Awkward: Commits to calling a frozen embryo "alive" while excluding a metabolizing, sterile mule or a replicating virus.
  7.  **Does the entity achieve replication *autonomously* (possesses all necessary core machinery)?**
      *   **No -->** Go to 8
      *   **Yes -->** Go to 9

  8.  **Case Examples:** Plain Virus, Giant Virus (Mimivirus), Protocell (liposome + replicating RNA).
      *   **Leaf:** **Chemical Darwinian / Evolutionary Definition** (e.g., Gánti chemoton, some OoL researchers). Awkward: Commits to calling a protocell "alive" potentially *before* reliable reproduction/evolution, while excluding giant viruses (if deemed insufficiently autonomous).
  9.  **Is the entity *individually* capable of reproduction?**
      *   **No -->** Go to 10
      *   **Yes -->** Go to 11

  10. **Case Examples:** Mule, Worker Honeybee, HeLa Cells.
      *   **Leaf:** **Organismal / Physiological Definition** (e.g., NASA working definition, autopoiesis). Awkward: Commits to calling HeLa cells "alive" (as individual units) while excluding worker bees due to sterility, or struggles to define the "individual" in colonies.
  11. **Case Examples:** Bacteria, Unfrozen Embryo (post-implantation), You.
      *   **Leaf:** **Standard Biological Definition** (Textbook: MRS GREN/Homeostasis, Metabolism, etc.). Awkward: Excludes viruses, prions, sterile organisms, and dormant states despite their biological relevance.

  ---

  **Key Notes on the Tree & Your Cases:**

  1.  **Branch Node Explanations:**
      *   **Q1 (Continuous Self-Maintenance):** Distinguishes actively metabolizing entities (cells, organisms) from dormant/stasis states (tardigrade tun, frozen embryo) and replicators without metabolism (viruses, digital life). *Concrete:* Does it burn energy *right now* to keep itself from falling apart? Tardigrade tun: No. Frozen Embryo: No. Virus: No. Mule: Yes. Crystal: No.
      *   **Q2/Q3 (Regulated Replication):** Distinguishes entities that can make copies (viruses, cells, digital life) from those that cannot or only passively propagate (prions, crystals). *Concrete:* Does it make near-perfect copies of its specific complex blueprint? Prion: No (just induces misfolding). Crystal: No (simple addition). Fire: No. Protocell: Maybe (but often messy).
      *   **Q7 (Autonomous Replication):** Distinguishes entities needing a host's machinery (viruses) from those with their own core machinery (cells, some protocells). *Concrete:* Does it carry the core translation (ribosomes) and metabolic machinery for replication? Virus: No. Mimivirus: Has some, maybe enough? Protocell: Usually lacks translation.
      *   **Q9 (Individual Reproduction):** Distinguishes entities that reproduce themselves (bacteria, fertile organisms) from sterile individuals or parts of a larger reproductive unit. *Concrete:* Can *this specific unit* produce offspring? Mule: No. Worker Bee: No. HeLa Cell: Yes (cell division).

  2.  **Collapsing Criteria:** You suspected metabolism and self-maintenance might collapse. This tree treats them as essentially synonymous (Q1). True autonomy (Q7) often requires metabolism. The significant splits are between **Metabolism (Self-Maintenance)** and **Replication**, and then **Autonomy** and **Individuality**.

  3.  **Unseparated Leaves:** The tree *cannot* inherently distinguish:
      *   A **frozen embryo** (Q6: Potentiality) from a **dried tardigrade** (Q6) or a **comatose human** (Q6) using these branches. Your choice at Q6 lumps them together. If you feel differently about the embryo vs. the tardigrade, you need a criterion outside this tree (e.g., "human origin" or "developmental potential within a species context").
      *   A **giant virus** might fall at Q8 (Chemical Darwinian) or potentially Q5 (Replication-First) depending on the "autonomy" threshold (Q7), which is fuzzy.

  4.  **Unexplored/Incoherent Combinations:**
      *   **Yes to Q1 (Self-Maintain) + No to Q3 (Replicate) + Yes to Q9 (Individual Reproduce):** Impossible. Individual reproduction *requires* regulated replication.
      *   **No to Q1 (Self-Maintain) + No to Q2 (Replicate):** Covered (Q4: Non-Life). Coherent.
      *   **No to Q1 + Yes to Q2 (Replicate) + Yes to Q7 (Autonomous):** This would require an entity that replicates autonomously *without* continuous self-maintenance (metabolism). No known natural examples. A theoretical "frozen replicator" might fit, but its coherence is debated. Unexplored.
      *   **Yes to Q1 + Yes to Q3 + No to Q7 (Non-Autonomous Rep) + Yes to Q9 (Individual Rep):** This would be an entity that metabolizes and reproduces individually but lacks autonomy (needs external machinery). Contradictory. Individual reproduction implies autonomy over that process.

  5.  **Your Frozen Embryo:** The tree places it firmly at **Potentiality-Based (Q6)** if you answer "No" to Q1 (continuous self-maintenance) and "No" to Q2 (regulated replication *while frozen*). If you instinctively feel it *is* alive, this reveals a core reliance on potential (resumption of metabolism/development) rather than current function. This conflicts with judging a **dried tardigrade** (also Q6) as *not* alive, suggesting an inconsistency or an additional criterion (like species-specific potential) you might be applying unconsciously.

  **To Use the Tree:** Take your borderline cases. Answer the questions *strictly* based on the entity's *current state* and *intrinsic properties*, without thinking about the final "alive" label. Follow the branches. The leaf tells you which definition your answers align with and its most awkward consequence. Your flip-flopping in conversation likely occurred because different cases triggered different core criteria (metabolism vs. replication vs. potential) in your implicit definition. This tree forces you to choose which criteria are necessary and sufficient *for you*.
