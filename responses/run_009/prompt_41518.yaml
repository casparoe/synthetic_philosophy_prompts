prompt: |-
  Retired actuary here, reading decision theory books for fun in my old age. Something's been bugging me for weeks and I can't find the right word for it, so let me just describe the thing and hope it rings a bell.

  You know how the fair price of a bet is supposed to be the probability-weighted sum of all the payouts. I was playing around with toy bets built on "flip a coin until the first heads comes up" — the payout depends on how many flips it took, with the amounts growing about as fast as the probabilities shrink, so each term of the sum stays roughly the same size. If all the payouts go in your favor the sum just blows up, and you'd say the bet is worth infinitely much — weird, but at least it's a determinate answer. But I stumbled on a variant where the payouts alternate in sign: you win on some flip numbers and pay on the others. Because of how I set the amounts, the terms of the sum shrink slowly, something like 1, 1/2, 1/3, ... with alternating signs, which I vaguely remember from school converges to a finite number — but only just barely, because if you drop the signs the whole thing runs off to infinity. And here's the part that really got me: since it converges only in that fragile, order-dependent way, if I add up the terms in a different order — taking all the winning outcomes first and saving the losing ones for later — I can make the "fair price" come out to practically any number I picked in advanced. Same bet, different bookkeeping, and the value wanders wherever I want it to go. It's not huge, it's not infinite, it's not any number at all.

  Is there a name for a bet like that — one whose value isn't merely very large but genuinely undefined? I'm aware there's a classical paradox about a coin-flip game whose value is infinite, but this seems like a different animal: that one at least settles on "infinite," mine won't settle on anything. And to be clear, I'm not after just a label — I want to know what exactly the phenomenon is, how it differs from the infinite-value kind of case (and from an ordinary badly-priced bet), and whether the people who think about this for a living have a settled story about what a rational agent should do when offered one. Refuse to rank it against other options? Use some kind of cutoff after finitely many terms and accept that the answer depends on the cutoff? Treat two such bets as incomparable? If there's no established term for it, tell me that straight, and then maybe suggest what you'd call it and where you'd draw the edges.
reasoning: |-
  Okay, let me tackle this retired actuary's question. They're describing a bet based on flipping a coin until the first heads, with payouts that alternate in sign and converge conditionally. The key issue is that the expected value isn't well-defined because rearranging the terms can make it converge to any number.

  First, I recall that conditionally convergent series are those that converge only when terms are in a specific order. The alternating harmonic series is a classic example: 1 - 1/2 + 1/3 - 1/4 + ... converges to ln(2), but rearranging terms can change the sum. Riemann proved that for such series, you can rearrange to get any real number or even make it diverge. That matches what the actuary is seeing.

  The actuary mentions the St. Petersburg paradox, which deals with infinite expected value. But here, the issue isn't infinity—it's the indeterminacy due to conditional convergence. So this is fundamentally different. The expected value isn't infinite; it's undefined because it depends on the order of summation.

  For naming, I think this is the "St. Petersburg-like game with alternating payoffs" or perhaps referencing conditional convergence. But a more precise term might be "unbounded variation" or "pathological expected value." In decision theory, it relates to the failure of countable additivity or the need for finitely additive probabilities.

  For how a rational agent should handle this, approaches could include:
  1. Insisting on finite support or bounded utility.
  2. Using finitely additive measures where order matters.
  3. Treating such bets as incomparable.
  4. Applying a discount factor to ensure absolute convergence.

  The core problem is that the space isn't ℓ¹, meaning the absolute series diverges. So the expected value isn't well-defined in the standard sense. The actuary's bet exemplifies a case where the value is undefined due to conditional convergence, unlike the St. Petersburg's infinite but defined value.
answer: |-
  Ah, the delightful perversity of conditionally convergent series in expectation calculations! You've stumbled upon a fascinating and very real phenomenon that sits at the intersection of probability theory, real analysis, and decision theory. There isn't a single universally agreed-upon *name* for this specific type of bet, but there are precise mathematical descriptions and well-understood concepts that capture the essence. Let's break it down:

  1.  **The Mathematical Core: Conditional Convergence**
      *   Your alternating payout series (e.g., +1, -1/2, +1/3, -1/4, ...) is the canonical example of a **conditionally convergent series**. It converges (to ln(2) in the harmonic case) only if the terms are summed in the specified order. However, its **absolute series** (|+1| + |-1/2| + |+1/3| + |-1/4| + ... = 1 + 1/2 + 1/3 + 1/4 + ...) diverges to infinity.
      *   Riemann's Rearrangement Theorem guarantees that for any conditionally convergent series and any real number S (or ±∞), you can find a rearrangement of the terms that sums to S. This is *exactly* what you discovered by "taking all the winning outcomes first."

  2.  **The Implication for Expected Value:**
      *   The expected value of a random variable X is formally defined as the Lebesgue integral of X with respect to the probability measure P. For discrete random variables defined on a countable sample space (like your coin flip counts), this integral reduces to the sum: E[X] = Σ [x_i * P(outcome_i)].
      *   **A necessary and sufficient condition for the Lebesgue integral (and thus the expected value) to be well-defined and finite is that the integral of |X| is finite.** That is, E[|X|] < ∞. This is equivalent to the absolute series Σ |x_i * P(outcome_i)| converging.
      *   **In your alternating payout bet, E[|X|] = ∞.** The absolute value of the payout times its probability sums to infinity. This means the random variable X (the payout) is **not Lebesgue integrable** with respect to the probability measure P. Its expectation is **undefined** in the standard (countably additive) framework of probability theory.

  3.  **Naming the Beast:**
      *   **Undefined Expectation (due to failure of absolute convergence):** This is the most precise and fundamental description. The core issue is that E[|X|] = ∞.
      *   **Pathological Expectation / Non-Summable Expectation:** Emphasizes the departure from well-behaved cases.
      *   **St. Petersburg Variant with Alternating Payoffs (and Undefined Value):** While acknowledging the similarity in setup (infinite series of decreasing probability payouts), it crucially distinguishes the outcome (undefined vs. infinite expectation).
      *   **Conditionally Convergent Expectation Series:** This is descriptive but slightly less common as a label for the *bet*, focusing on the mathematical property causing the issue. You might hear "the expectation series is conditionally convergent".
      *   **"The Payout has Unbounded Variation"**: Refers to the fact that the cumulative "ups and downs" of the payout function, weighted by probability, grow without bound.

  4.  **Distinguishing from Other Cases:**
      *   **St. Petersburg Paradox (Infinite Expectation):** In the classic St. Petersburg (payout = 2^{n-1} for first heads on flip n), E[|X|] = E[X] = ∞. The expectation is *defined* as infinite within the extended real numbers. Rearranging terms doesn't change this – any partial sum is bounded below (by 0) and unbounded above. The value is determinate, just infinite. Your case has E[|X|] = ∞, but E[X] is undefined, not infinite.
      *   **Ordinary Badly-Priced Bet (Finite Expectation ≠ Fair Price):** Here, E[|X|] < ∞ and E[X] is a well-defined finite number. The bet might be favorable (E[X] > cost) or unfavorable (E[X] < cost), but the expectation exists objectively. Rearrangement of the summation converges to the same finite value.

  5.  **What Should a Rational Agent Do? (The Philosophical/Decision Theory Quagmire):**
      This is where things get contentious. There is **no single "settled story"** universally accepted by decision theorists for handling bets with undefined expectation. The standard axioms (like von Neumann-Morgenstern) implicitly assume finite expectations exist. Here are the main approaches rational agents *could* take, each with arguments for and against:

      *   **1. Refusal / Incomparability:** A rational agent should refuse to assign a finite fair price or compare it directly to bets with well-defined finite expectations. They treat such bets as **incomparable** to standard monetary gambles. This aligns with the mathematical fact that the expectation doesn't exist. *Argument For:* Mathematically honest, avoids arbitrariness. *Argument Against:* Seems overly cautious; the bet *does* offer finite payouts with probability 1, just in a pathologically oscillating way.
      *   **2. Insist on Finite Support / Bounded Utility:** Reject the premise. A truly rational agent, perhaps constrained by cognitive limits or fundamental axioms, only considers bets with **finitely many possible outcomes** or where the utility function is **bounded** (which forces E[|U(X)|] < ∞). This avoids the problem entirely. *Argument For:* Restores well-defined expectations and satisfies standard axioms. *Argument Against:* Rules out many theoretically interesting and potentially actionable scenarios (even the classic St. Petersburg).
      *   **3. Adopt Finitely Additive Probability:** Move beyond the standard countably additive framework. Use a **finitely additive probability measure** and a **finitely additive expectation**. In this framework, the expectation of your alternating bet *can* be defined, but **its value depends on the order of summation** (or more generally, on the "charge" or method of summation). *Argument For:* Allows assignment of *some* value, acknowledging the bet exists. *Argument Against:* The value is inherently arbitrary (order-dependent). Finitely additive expectations lack many desirable properties of countably additive ones (like continuity). It doesn't resolve the "what value *should* I use?" dilemma.
      *   **4. Apply a Discount Factor / Ultilization:** Acknowledge that distant payouts have less impact. Use a discounted utility U(X) = δ^t * X (where t is time/flip count, 0 < δ < 1). This usually forces E[|U(X)|] < ∞, making the expectation well-defined and finite. *Argument For:* Realistic (time preference), mathematically robust. *Argument Against:* The specific expectation value depends heavily on the arbitrary choice of δ. Avoids confronting the core pathology of the undiscounted bet.
      *   **5. Use a Criterion like the Cauchy Principal Value:** Explicitly fix the order of summation (e.g., the natural order of flips: +1, -1/2, +1/3, -1/4, ...) and define the expectation as the limit of the partial sums in *that specific order* (e.g., ln(2)). *Argument For:* Yields a specific, finite number for a specific ordering. Mathematically clear for that ordering. *Argument Against:* Completely arbitrary! Why *this* order? The bet contract doesn't specify an order for aggregating wins and losses across different outcomes. Any other order is equally valid mathematically and yields a different "fair price".

  **Conclusion & Suggested Terminology:**

  The most precise description of your bet's core issue is that it has **undefined expectation** due to the **failure of absolute convergence** (E[|X|] = ∞). While not a catchy single name like "St. Petersburg," this is the fundamental mathematical reality.

  *   **What to call the bet itself?** You could call it a **"pathological St. Petersburg variant"**, a **"conditionally convergent expectation bet"**, or simply a bet with **"unbounded variation in payouts"**. The clearest label within decision theory might be **"a gamble with undefined expected monetary value"**.
  *   **The phenomenon?** The **"pathology of conditionally convergent expectations"** or the **"dependence of fair price on summation order for non-absolutely convergent series"**.
  *   **How it differs:** Crucially from St. Petersburg: **Indeterminacy (undefined)** vs. **Determinate Infinity**. From ordinary bad bets: **Non-existence** vs. **Existence (good or bad)**.
  *   **What should a rational agent do?** There is **no consensus**. The most defensible positions are **Refusal/Incomparability** (acknowledging the mathematical truth) or **Insisting on Bounded Utility/Finite Support** (changing the framework to avoid the problem). Approaches relying on order-dependent summation (Finitely Additive, Cauchy PV) introduce arbitrariness that lacks strong justification. Discounting changes the problem.

  Your discovery perfectly illustrates a profound limitation of the standard expected value criterion: it relies critically on absolute convergence for a well-defined, order-independent fair price. When that fails, the very concept of a single "fair price" dissolves into a mirage dependent on arbitrary accounting choices. It's a beautiful headache! Enjoy your deep dive into decision theory!
