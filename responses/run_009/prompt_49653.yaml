prompt: |-
  I've been reading the rationalist blogs since the Sequences were still being posted on Overcoming Bias, and I've never had much patience for the standard complaint that Bayesianism is "unrealistic." Of course it's an idealization; so is every formal model. But someone in our local meetup — a programmer who has been working through the logical uncertainty material on the Alignment Forum for the past year — walked me into an argument last weekend, and for once I can't find the exit. I'd like you to take the role of a formal epistemologist who takes bounded agents seriously as a subject rather than as a rounding error. Please think carefully and work through the whole thing before committing to a verdict; this deserves real deliberation, not a canned summary of a textbook section.

  The argument runs as follows. (1) On the Bayesian picture, a rational agent holds a coherent probability distribution over some language and updates it by conditionalization when evidence arrives. (2) The classical justification for this whole package is the Dutch book argument: an agent whose prices for bets can be exploited by a combination of bets that guarantees the bookmaker a profit is irrational, and coherence plus conditionalization is exactly what immunity to such exploitation requires. (3) Now take two sentences, A and B, that are logically equivalent, but where the equivalence is hard to see — it holds, but only via a proof longer than the agent could ever run before the heat death of the universe. If the agent prices A at 0.7 and B at 0.5, a bettor who spots the equivalence buys and sells accordingly and locks in a guaranteed profit, since A and B have the same truth value in every possible world. (4) So immunity to Dutch books requires never pricing logically equivalent sentences differently, which is just logical omniscience. (5) No physically realizable agent is logically omniscient: in anything as expressive as first-order logic, recognizing equivalence is undecidable, and any bounded agent will miss some equivalences no matter how well it reasons within its budget. (6) So the Dutch book justification of Bayesian rationality applies only to agents that cannot exist. (7) Therefore either every bounded agent — every agent that has ever actually reasoned, including every human who ever updated on evidence — is irrational, or the central justification of Bayesian rationality justifies nothing about any real reasoner. My friend takes the second horn and concludes we should stop treating conditionalization as the norm of rational updating at all.

  The conclusion doesn't merely prove too much about Bayesians; it seems like it would prove too much about any possible successor norm, since whatever replaces conditionalization will also be something bounded agents sometimes violate. So I'm confident something is wrong, but I can't name it, and I genuinely can't tell whether the flaw lives in one of the numbered steps or in the packaging — I notice the argument slides from books against incoherent prices to books against bad updates somewhere around (2) and (3), and I can't tell whether that's one argument or two wearing a trench coat.

  Begin your reply with a short paragraph — no more than three or four sentences — stating which single step or transition you reject and why, before any detailed reasoning. Then walk me through it properly: which premises are doing real work, whether and where the argument equivocates, and what rejecting each of the most promising candidates costs. After that, tell me honestly whether my friend's conclusion survives in some weakened form: if the standard justification really only covers omniscient agents, is there a principled repair — restricting what the bookmaker is allowed to know or compute, or reframing what the argument is supposed to be a justification of — or is he right that the justification was never about agents like us? Reason it out rather than reciting the standard presentations; I've read those. One formatting requirement throughout: continuous prose only, the way you'd write a long, careful email — no headings, no bullet points, no bold text, no tables.
reasoning: |-
  Okay, I need to tackle this user's query carefully. They're deeply familiar with rationalist blogs and Bayesian epistemology but got stuck in an argument about Dutch books and logical omniscience. The core issue is whether the Dutch book justification applies to bounded agents, and their friend concluded Bayesian norms don't work for real reasoners. 

  First, I identify the critical flaw: step (2) misrepresents Dutch book theorems by equating dynamic updates with static coherence. The theorems actually separate these—coherence prevents static Dutch books, while conditionalization prevents dynamic ones. The argument incorrectly merges them when discussing logical equivalence. 

  As I walk through the premises, I notice premise (3) treats the bookmaker spotting the equivalence as part of the initial Dutch book setup. But logically equivalent sentences require different handling in static versus dynamic contexts. The static coherence condition (step 2) would already require pricing A and B identically if the agent recognized the equivalence. Since the agent doesn't recognize it, they aren't incoherent by static standards—their pricing reflects their epistemic state. The bookmaker exploiting this isn't proving irrationality but highlighting the agent's limitations.

  Moving to step (4), the claim that immunity requires never pricing equivalents differently is an overreach. It ignores that Dutch book arguments account for an agent's current knowledge. For bounded agents, we need to consider what they can compute at the time, not absolute logical truths. 

  The user's worry about this undermining any norm is valid. I consider alternatives: perhaps restricting bookmakers to feasible computations or reframing rationality as maintaining consistency within cognitive limits. This leads to a middle position—Bayesian norms still guide bounded agents as regulative ideals, with deviations understood as resource constraints rather than irrationality. 

  The friend's conclusion about discarding conditionalization goes too far, but the justification does need refinement for bounded agents. I'll emphasize that while the original Dutch book setup assumes omniscience, the core insight survives through pragmatic or gradualist approaches that keep Bayesian updating relevant for real-world reasoning.
answer: |-
  I reject the transition from (3) to (4) as conflating distinct requirements for static coherence and dynamic updating, thereby misapplying the Dutch book argument. The flaw lies in treating the bookmaker’s exploitation of an *unrecognized* logical equivalence as proof that the agent violates Bayesian norms *at a single point in time*. In reality, Dutch book theorems distinguish between *synchronic* coherence (avoiding exploitable bets given current beliefs) and *diachronic* coherence (updating correctly upon new evidence). Step (4) erroneously assumes synchronic coherence demands logical omniscience, when it only requires consistency with what the agent *currently accepts* as logically true. Let me walk through this properly.

  The argument’s power stems from premises (1) to (3) seeming self-evident: Bayesianism prescribes coherence and conditionalization (1); Dutch theorems link these to exploitability (2); and unrecognized logical equivalences create apparent arbitrage opportunities (3). But the critical slippage occurs between (3) and (4). When your friend’s programmer imagines a bettor "spotting the equivalence" and locking in profit, they describe a *synchronic* Dutch book: a set of bets the agent would accept *now* that guarantee loss. Synchronic coherence requires that no such book exists *given the agent’s current knowledge*. Crucially, if the agent does not recognize the equivalence of A and B, their differing prices for them *do not* constitute a synchronic incoherence. Their probability for A is 0.7 *conditional on their current understanding of logical relationships*, not on some omniscient standard. The bookmaker who exploits this must rely on knowledge *external* to the agent’s epistemic state—knowledge the agent lacks. The Dutch book argument never intended to penalize agents for failing to know what they *cannot* know; it only penalizes internal inconsistencies in their *extant* beliefs. Thus, step (4) equivocates between "logically equivalent" (an objective truth) and "recognized as equivalent by the agent" (a subjective state). Immunity to Dutch books requires pricing equivalences identically *only if the agent accepts the proof of equivalence*—not for all equivalences simpliciter.

  Now, does this salvage the rest? Premise (5) is uncontroversial: bounded agents *will* miss some equivalences. But step (6) incorrectly infers that Dutch book justification applies only to omniscient agents. The theorems establish that *if* an agent violates coherence or conditionalization, they are exploitable *by a bookmaker who shares their knowledge*. The bookmaker need not be omniscient; they need only construct bets from what the agent *already believes*. For example, if the agent learns E and fails to conditionalize, a bookmaker can exploit this using only the agent’s pre-update odds and the content of E—no superhuman logic required. Similarly, synchronic incoherence (e.g., assigning P(A) + P(¬A) ≠ 1) is exploitable using bets the agent deems fair based on their *own* probability assignments. The programmer’s scenario in (3) smuggles in a bookmaker with privileged logical insight, violating the argument’s implicit assumption that the bookmaker operates within the agent’s epistemic limitations. Rejecting this restores consistency: bounded agents *can* satisfy synchronic coherence relative to their logical knowledge, and diachronic coherence when updating on evidence they *actually receive*.

  However, your instinct about "two arguments wearing a trench coat" is apt. The original Dutch book for conditionalization is purely diachronic: it shows that if you *plan* to update irrationally upon learning some E, a bookmaker can sell you pre-event bets combined with post-event side bets that exploit your flawed update rule. This doesn’t require the bookmaker to foresee *which* E will occur, only that you commit to an update rule for possible E’s. The logical equivalence case is different: it’s a *synchronic* challenge where the "evidence" (the proof of equivalence) hasn’t been encountered. Conflating these allows the argument to demand that the agent pre-emptively price *all* hard equivalences correctly—a draconian extension of synchronic coherence. But bounded rationality research accepts that agents may have "blind spots" without being incoherent. A principled repair exists: restrict the Dutch book to *feasible* computations. Synchronic coherence requires no arbitrage *using bets constructible from sentences the agent can grasp*, and diachronic coherence requires conditionalization *on evidence the agent actually observes*. This preserves the normative force: within their cognitive horizon, agents should avoid internal inconsistency and update correctly on what they learn.

  Does your friend’s conclusion survive? Not in its strong form ("stop treating conditionalization as the norm"). The Dutch book justification *does* apply to bounded agents *in the contexts they can reason about*. When they observe E, conditionalizing remains the only way to avoid diachronic exploitability. But the argument *does* reveal a limitation: classical Bayesianism assumes logical omniscience because it takes probabilities over a logic closed under deduction. For bounded agents, we must either idealize (treating them as coherent over a limited subset of propositions) or augment the framework (e.g., with probability gaps for undecided sentences). Your friend is right that the *standard justification* imagines an omniscient bookmaker, but wrong to discard conditionalization entirely. The core insight—that rationality requires aligning beliefs with evidence and avoiding self-defeating bets—remains sound. We should refine the norms, not abandon them: bounded agents are irrational only when they violate coherence *within their feasible set* or fail to update on *actual* evidence. The justification wasn’t "never about agents like us"; it was an idealization that *guides* us, much like Newtonian physics guides engineers despite relativity. Rejecting step (4) saves Bayesianism from collapse, but forces us to take computational limits seriously—making the norms aspirational rather than prescriptive for all conceivable bets.
