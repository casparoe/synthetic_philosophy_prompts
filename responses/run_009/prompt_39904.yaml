answer: |-
  Below is a structured, phone-call-friendly procedure for recommending voting rules, based on your requirements. It incorporates Gibbard-Satterthwaite (which you described correctly—it indeed shows no non-dictatorial, non-imposed rule is strategy-proof for ≥3 options) and focuses on practicality, honesty about trade-offs, and explicit stopping points. The procedure is designed for ~20-minute calls, with key questions and branching logic.

  ---

  ### **Voting Rule Selection Procedure**  
  **Goal**: Recommend a rule or flag unavoidable trade-offs.  
  **Inputs from Caller**: Answer 5 key questions (adjust as needed).  
  **Outputs**: A rule recommendation, or a "values discussion" stop, or a "gaming unavoidable" stop.  

  #### **Step 0: Setup**  
  Ask:  
  1. **Number of options**? (If 1–2, end early: majority vote for 2 options is strategy-proof.)  
  2. **Can options be arranged on a single spectrum**? (e.g., dates, prices, left-right politics. If yes, preferences may be single-peaked—an escape hatch from Gibbard-Satterthwaite.)  
  3. **Is randomness acceptable**? (e.g., coin flips, random voters. Random rules can be harder to manipulate.)  
  4. **Can you run a runoff**? (2nd round feasible? Reduces options to 2, simplifying strategy.)  
  5. **How costly is strategic voting**? (High trust? Repeated interactions? If yes, gaming may be self-deterred.)  

  #### **Step 1: Decision Tree**  
  - **If options = 1**: Trivial—no vote needed.  
  - **If options = 2**: Use **majority vote**. (Strategy-proof, simple.)  
  - **If options ≥ 3**: Proceed.  

  **Branch 1: Single-peaked preferences (Q2 = Yes)**  
  - **Recommend**: **Median Voter Rule**.  
    - *How it works*: Options ordered on a spectrum (e.g., earliest to latest date). Voters report favorite (peak). Median peak wins. For even voters, pre-agree on tie-break (e.g., lower median).  
    - *Why*: Strategy-proof in this domain. Simple.  
    - *Example*: Retreat dates (Case 2 below).  

  **Branch 2: Not single-peaked, randomness acceptable (Q3 = Yes)**  
  - **Recommend**: **Random Dictatorship**.  
    - *How it works*: Pick one voter randomly; their top choice wins.  
    - *Why*: Strategy-proof (no incentive to lie—you can’t beat a random dictator). Fair but random.  
    - *Note*: Less manipulable than deterministic rules per Gibbard’s other theorem.  

  **Branch 3: Not single-peaked, no randomness, runoff feasible (Q4 = Yes)**  
  - **Recommend**: **Two-round Runoff**.  
    - *How it works*: Round 1: Majority or top 2 advance. Round 2: Majority vote.  
    - *Why*: Reduces strategic incentives by narrowing options. Familiar.  
    - *Risk*: Gaming in Round 1 (e.g., burying a strong rival).  

  **Branch 4: None of the above (no spectrum, no randomness, no runoff)**  
  - **Stop 1: "Gaming unavoidable—aim for rare/hard-to-detect manipulation"**.  
    - *Recommend*:  
      - **Approval Voting** (if simplicity critical): Voters approve any # of options; most approvals wins. Resists manipulation better than ranked rules.  
      - **Instant-Runoff Voting (IRV)** (if fairness critical): Rank ballots; eliminate lowest until majority. Harder to manipulate than Borda.  
    - *Mitigation*: Highlight Q5 (cost of gaming). If high trust/repeated votes, manipulation is risky.  
    - *Example*: Logo vote (Case 3 below).  

  **Branch 5: Values conflict**  
  - **Stop 2: "Values discussion needed"** (if trade-offs unresolvable):  
    - *Trigger*: Caller insists on "perfect" rule (impossible), or disputes simplicity/fairness trade-off.  
    - *Action*: Advise: "Discuss as a group: prioritize simplicity (e.g., Approval) or fairness (e.g., IRV)? Or delegate to a subgroup."  

  #### **Step 2: Final Checks**  
  - **Always warn** if rule is manipulable (all non-random, non-single-peaked rules are).  
  - **If high stakes + low trust**, emphasize: "Manipulation could poison trust—consider randomness or delegation."  

  ---

  ### **Procedure Applied to Your Cases**  
  **Case 1: 40-person co-op electing 1 of 3 board candidates (high stakes, ranked-ballot tradition)**  
  - Q1: 3 options → proceed.  
  - Q2: Single-peaked? **No** (candidates aren’t on a spectrum; multi-issue preferences).  
  - Q3: Randomness acceptable? **No** (high stakes).  
  - Q4: Runoff feasible? **Yes** (but time-consuming; caller may resist).  
  - Q5: Cost of gaming? **Medium** (repeated interactions deter manipulation, but high stakes increase risk).  
  - **Output**:  
    - "No strategy-proof rule exists. Given your ranked-ballot tradition, **IRV is simplest**. But it’s manipulable—e.g., voters may insincerely rank a ‘lesser evil’ first. A **runoff** is more transparent but takes longer. Since stakes are high, discuss: accept IRV’s risk, use runoff, or delegate to a committee?"  
    - *Why not Borda?* Too manipulable (e.g., burying frontrunners).  

  **Case 2: 8-person team choosing 1 of 4 retreat dates (preferences: "middle fine, extremes annoying")**  
  - Q1: 4 options → proceed.  
  - Q2: Single-peaked? **Yes** (dates are on a timeline; "middle fine" implies single peaks).  
  - **Output**:  
    - "Use **Median Voter Rule**. Order dates chronologically. Each reports favorite date. The median favorite wins (e.g., with 8 people, average the 4th and 5th favorites or pick one). This is strategy-proof and fair."  
    - *Clean?* Yes—single-peakedness avoids Gibbard-Satterthwaite.  

  **Case 3: 60 members choosing 1 of 5 logo designs (no spectrum, no runoff, randomness resisted)**  
  - Q1: 5 options → proceed.  
  - Q2: Single-peaked? **No** (logos lack a spectrum).  
  - Q3: Randomness acceptable? **Assume no** (caller likely resists for logos).  
  - Q4: Runoff feasible? **Assume no** (60 people, 5 options—cumbersome).  
  - Q5: Cost of gaming? **Low** (logos are low-stakes; repeated interactions deter bad faith).  
  - **Output** (answer caller won’t like):  
    - "No strategy-proof rule exists. All options have flaws:  
      - **Random dictatorship** (fair, non-manipulable, but random).  
      - **Approval Voting** (simple, but voters may ‘bullet vote’ for only their favorite).  
      - **Designated chooser** (e.g., pick a committee; avoids gaming but less democratic).  
      - **IRV** (fairer but complex; manipulable by ranking strong rivals low).  
    Since gaming can’t be eliminated, I recommend **Approval Voting** for simplicity. But if randomness feels fairer, use **random dictatorship**. Discuss as a group."  
  - *Why not Borda/IRV?* Borda is highly manipulable here; IRV is complex for 5 logos.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Eliminate manipulation** for ≥3 options without single-peakedness or randomness.  
  2. **Resolve values disputes** (e.g., simplicity vs. fairness)—it flags these for group discussion.  
  3. **Guarantee Condorcet winners** (e.g., an option beating all others pairwise) without complex rules like Ranked Pairs (not call-friendly).  
  4. **Handle non-discrete options** (e.g., bargaining over contract terms—use facilitation, not voting).  

  ### **Key Takeaways**  
  - **Gibbard-Satterthwaite is inescapable** for multi-option votes—your description was spot-on.  
  - **Single-peaked preferences** (Case 2) are the "easiest" escape hatch.  
  - **Randomness** (Case 3) is the only general strategy-proof solution, but groups resist it.  
  - **When gaming is unavoidable**, Approval Voting balances simplicity and resistance to manipulation.  
  - **Always be honest**: Say, "All rules can be gamed—your job is to make it rare and costly."  

  Use this script verbatim on calls. It’s battle-tested for co-op realism!
