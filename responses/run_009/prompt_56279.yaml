prompt: |-
  I've been circling the dirty hands debate for years — ever since the old LessWrong threads about torture vs. dust specks and whether "shut up and multiply" licenses things decency forbids — and I've noticed the argument never moves past the case du jour. Ticking bomb, drone strike, lying to the electorate, whatever, everyone just re-litigates the case and nothing general gets built. So before I argue another one, I want the spec written down: give me the desiderata for any adequate theory of dirty hands, the "leader does wrong so that worse won't happen" phenomenon. Things that should plausibly be on the list (add or cut as you see fit, with your reasons): it has to face the core paradox head-on — that the act seems genuinely wrong and yet seems like the thing a good person in that office must do — without relabeling one horn away; it has to distinguish real dirty hands from (a) mere tragedy, where every option is bad but none is wrongful, (b) ordinary hard tradeoffs morality already licenses, and (c) self-serving rationalization dressed up as necessity, which I care about a lot because every strongman in history says he had no choice; it has to say what the residue is for — the guilt, the penance, the reparations — and whether that residue is actually the point of insisting the act was "wrong"; it has to handle role morality, why putting on the office changes what you may do, if it does; and it should cope with the successor problem, where I resign rather than dirty my hands and someone crueler takes the job and does it worse — did my clean hands help anyone but me? Maybe throw in a couple of less-worn cases to motivate the criteria, like a public health official who understates a risk because the panic itself would kill people, or a city engineer quietly shifting inspection funds from a probably-fine bridge to a definitely-failing one. Each desideratum should come with the case or argument behind it, not just an assertion.

  For each requirement mark it non-negotiable vs. a preference of one camp. My hunch: "the act must come out genuinely wrong, not merely regrettable" is a camp preference that consequentialists will simply deny, while "there must be an account of why we sometimes still demand penance or punishment afterward" is closer to universal — argue with me if you think I have that backwards. And if some subset of the desiderata is jointly unsatisfiable — e.g. if wrongness, all-things-considered ought, and a non-fungible residue can't all three be had without cheating on one of them — say so plainly, because if the spec is impossible that IS the result, and I'd much rather learn that than get handed a theory that quietly drops a criterion when nobody's looking.

  Then, briefly, run three contenders against the list: the Walzer-ish view where the necessary act remains wrong and the good leader accepts guilt and punishment; the consequentialist line that if it's really the best available thing to do there's no wrongdoing, just squeamishness we should outgrow; and a role/institutional view on which the office, not the person, both licenses and taints the act. Keep the scorecard short — the thinking should be in the criteria, I can grade the contenders myself. Housekeeping: American English, and no bibliography or reading list, I want your reasoning not your recall of the literature. Also, since I fully intend to quote you back at people in arguments, tell me how confident you are in the load-bearing claims and flag the single point you're least sure of — my money's on either the joint-satisfiability bit or whether the residue requirement is really a requirement and not just inherited piety, but it might be something I haven't thought of.
reasoning: |-
  Okay, this user has clearly been wrestling with the dirty hands problem for years, tracing it back to LessWrong debates. They're frustrated with how discussions always get stuck on specific cases without building a general framework. They want a rigorous set of criteria to evaluate any theory of dirty hands - essentially a specification document for the concept.

  The user presents several key requirements they believe a proper theory must address: maintaining the paradox without resolving one side, distinguishing dirty hands from related concepts, explaining the residue of guilt/penance, handling role morality, and addressing the successor problem. They also want concrete examples beyond the usual ticking bomb scenario.

  Importantly, they flag two potential fault lines: whether labeling the act as "genuinely wrong" is non-negotiable (they suspect consequentialists would reject this), and whether the residue requirement is substantive or just tradition. They explicitly ask us to identify if these criteria might be incompatible.

  We'll need to structure this carefully. First, define each desideratum clearly with its supporting case and mark it as core or contested. Then evaluate three major approaches: Walzer's paradoxical view, pure consequentialism, and institutional role morality. The scoring should highlight where each theory satisfies or fails the criteria, especially regarding the key tension points.

  The user plans to use this in debates, so we must flag confidence levels and uncertainties. I suspect the trickiest part will be whether "genuine wrongness" and "all-things-considered ought" can coexist - that may be the central paradox. The residue question also feels vulnerable; is it essential or just cultural baggage?

  Notable that they reject literature reviews - this needs to stand on its own reasoning. The public health misinformation and bridge funding cases are excellent alternatives to worn-out torture examples. We should use those to illustrate the criteria.

  Most challenging: being honest about potential incompatibilities in the desiderata. If the spec can't be fulfilled, we must say so plainly rather than fudge a solution. That intellectual honesty seems crucial to this user.
answer: |-
  Here’s the spec, built from your requirements and cases, followed by a scorecard for the three contenders. Confidence levels noted throughout (scale: ★☆☆ = speculative; ★★☆ = reasoned but debatable; ★★★ = core logic).

  ---

  ### **Desiderata for an Adequate Theory of Dirty Hands**  
  *(Non-negotiable [NN] vs. Camp Preference [CP] flagged)*  

  1. **The Paradox Requirement (NN)**  
     *The theory must preserve the core tension: the act is genuinely morally wrong, yet obligatory for a good officeholder.*  
     - **Why NN?** Without this, it’s not dirty hands (DH) — it collapses into tragedy or tradeoff.  
     - **Case:** Mayor lies about a bridge collapse risk to prevent panic (panic would cause stampedes + delayed repairs). Truth-telling is wrong here *because* it negligently risks lives, but lying is still a betrayal of public trust.  
     - ★★★ Confidence: The tension defines DH. Denying it dissolves the phenomenon.  

  2. **Distinction from Near-Misses (NN)**  
     *Must differentiate DH from:*  
     - **(a) Mere Tragedy** (all options *permissible* but bad, e.g., saving one child instead of two).  
     - **(b) Licensed Tradeoffs** (e.g., diverting a trolley — standard morality already permits this).  
     - **(c) Self-Serving Rationalization** (e.g., a dictator claiming "economic necessity" for purges).  
     - **Why NN?** DH is uniquely about **blameworthy obligation**. If it’s just (a) or (b), no residue (guilt/punishment) makes sense; if (c), it’s corrupt, not DH.  
     - **Case:** City engineer shifts bridge funds from "probably-fine" to "definitely-failing" structure. Tragedy if both bridges fail anyway; DH only if the engineer *knows* the neglected bridge *could* fail and is culpable for gambling.  
     - ★★★ Confidence: Failure here makes DH incoherent.  

  3. **The Residue Requirement (CP → NN?)**  
     *Must explain why guilt, penance, or reparations are fitting — even when the act was necessary.*  
     - **Why CP?** Consequentialists deny intrinsic residue ("squeamishness to outgrow"). **But**: if residue is *merely* psychological or strategic (e.g., to deter bad-faith claims), DH loses moral distinctness. **NN if**: residue is a *structural feature* of DH (i.e., the act’s wrongness *demands* acknowledgment).  
     - **Case:** Public health official downplays pandemic severity to avoid panic-buying that would collapse supply chains. Later, they *voluntarily resign* or fund victim compensation — not because it changed outcomes, but because they violated a norm.  
     - ★★☆ Confidence: Residue *is* universal in DH discourse, but *why* it’s required is contested. *Least sure point*.  

  4. **Role Morality (NN)**  
     *Must explain how the office/license changes permissions/obligations.*  
     - **Why NN?** DH isn’t "anyone can torture if it helps"; it’s tied to *public roles* (leaders, soldiers, judges). A theory must show why the role *both enables and condemns* the act.  
     - **Case:** A general ordering a drone strike killing civilians to prevent a larger attack. A civilian doing this is a terrorist; the general is doing their job — yet still bears guilt.  
     - ★★★ Confidence: Roles are pivotal.  

  5. **Successor Problem (CP)**  
     *Must engage with "if I refuse, will a worse actor do more harm?"*  
     - **Why CP?** This tests if DH is *truly* necessary or self-aggrandizing. But not all DH cases involve resignations (e.g., lying to the electorate is done *in* office).  
     - **Case:** An official resigns over ordering torture; their replacement tortures *more* people. Does the first official’s "clean hands" add moral value?  
     - ★★☆ Confidence: Important for real-world decisions, but secondary to the core paradox.  

  ---

  ### **Joint Satisfiability Tension**  
  - **The Trilemma:** Can a theory simultaneously hold that an act is (1) *genuinely wrong*, (2) *all-things-considered obligatory*, and (3) *leaves non-fungible residue*?  
  - **Problem:** (1) and (2) seem contradictory. If (2) is true, how can (1) stand? If (1) is true, how can (2) be binding? **This is the central paradox.**  
  - ★★☆ Confidence: Tension is real. Theories "cheat" by relabeling (e.g., "wrong" just means "regrettable"). A theory that preserves all three *without cheating* would be a breakthrough.  

  ---

  ### **Contender Scorecard**  

  | **Desideratum**          | **Walzer-Ish View**                                                                 | **Pure Consequentialism**                                                           | **Role/Institutional View**                                                      |
  |--------------------------|-------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------|----------------------------------------------------------------------------------|
  | **1. Paradox**           | ✅ Strong: "Wrong yet obligatory" is core. Guilt is proof of morality.              | ❌ Fails: If net-good, it’s *right*. "Dirty hands" = confusion.                    | ✅ Moderate: Office licenses necessity, but society condemns the *means*.        |
  | **2. Distinctions**      | ✅ Strong: DH = uniquely blameworthy obligation. Rationalization is corruption.    | ⚠️ Weak: All are tradeoffs. Struggles to condemn "rationalizing" strongmen.       | ✅ Strong: Role defines scope. Unauthorized "necessity" is just crime (e.g., vigilante torture). |
  | **3. Residue**           | ✅ Strong: Guilt/punishment *acknowledges* the wrong. Essential for moral integrity. | ❌ Rejects: Residue is irrational. At best, performative (e.g., to maintain norms). | ✅ Moderate: Residue restores institutional trust (e.g., official resigns to affirm norms). |
  | **4. Role Morality**     | ⚠️ Moderate: Focus on leader’s character. Less on *why* role changes permissions. | ❌ Weak: Roles are efficiency tools. No intrinsic moral shift.                     | ✅ Strong: Roles create distinct permissions/duties. DH arises from role conflict. |
  | **5. Successor Problem** | ⚠️ Moderate: Refusal may be noble, but may worsen outcomes. No clear resolution.  | ✅ Strong: If refusal causes worse harm, it’s wrong. DH is a non-issue.           | ⚠️ Moderate: Role obligations may include preventing worse successors (gray area). |
  | **Solves Trilemma?**     | ❌ No: "Obligatory" is political, not moral. Residue admits moral failure.         | ❌ No: Denies (1) and (3). Only (2) matters.                                       | ⚠️ Partial: Separates *personal* wrong (residue) from *institutional* obligation. |

  ---

  ### **Key Takeaways**  
  - **Non-negotiables (1,2,4)** are make-or-break: Walzer and Role views clear these; consequentialism fails.  
  - **Residue (3)** is the litmus test: Walzer/Role preserve it (differently); consequentialism discards it. Your hunch holds: *wrongness* is the camp divider (CP), but *residue* is near-universal in DH theories (NN for them).  
  - **Trilemma unsolved:** No contender cleanly reconciles wrongness + obligation + residue. Walzer comes closest by accepting contradiction as real.  
  - **Weakest Confidence Point:** Whether residue *must_ be morally significant (beyond psychology/institutional repair). Consequentialists have a point: if the act was optimal, why isn’t residue pathological? Walzer’s "guilt as virtue" is profound but uneasy.  
  - **Best Fit:** **Role/Institutional view** balances most criteria cleanly (DH as role-specific conflict). **Walzer** best captures the existential weight. **Consequentialism** rejects DH entirely.  

  **Quote freely.** If pressed, I’d bet on the Role view for real-world use — but Walzer owns the moral horror. The trilemma remains.
