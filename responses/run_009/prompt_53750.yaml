prompt: |-
  I coordinate peer review at a mid-tier journal in evolutionary biology and behavioral ecology (I'm not going to name it, doesn't matter). A large chunk of what we publish is basically "here's a trait, here's a plausible benefit of the trait, therefore it's an adaptation for that benefit" with the adaptive story doing the work of evidence. Our referees are volunteers with maybe three hours per manuscript and zero patience for being assigned philosophy reading, and right now they do one of two things: wave the story through because it's cute, or stamp "just-so story" on it like that settles something. Both happen constantly and I can't tell which is which either.

  What I want is a procedure a referee can actually run in about an hour on any manuscript whose central claim is that some trait is an adaptation for some function. The grounding is the Gould–Lewontin spandrels critique — the point that a benefit story isn't evidence until the alternatives are actually compared against it: drift, developmental and mechanical constraint, byproducts riding along on something that was selected (the actual spandrels), traits that are there because of the organism's genetic/architectural plumbing rather than because each one is "for" something, and past selection for a different use than the present one. But it also has to carry the critique's honest edges: it can't just be a rejection machine, because sometimes the adaptationist is right and has the data.

  Specifics I need:

  - A numbered list of questions, in the order a referee should ask them, with what counts as a sufficient answer to each.
  - For each question, where it sends the review: reject (and on which grounds, phrased so it fits in a standard review form), major revisions (asking for what exactly), or "referee can't settle this, it goes to the editor as a values-and-framing call."
  - A guardrail: how does a referee tell when they're using spandrels-talk as its own just-so story — asserting "it's just a byproduct / it's just constraint" with no more evidence than the adaptationist had? Because we get papers like that too, and I sometimes can't distinguish them from the ones waving the flag, and I'm the one supposed to be coordinating this.
  - A short section on where the procedure predictably misfires — cases where the checklist gives the wrong answer or no answer.

  Then run it on three hypothetical manuscripts (one-liners here, treat them as real):

  1. Caterpillars of some beetle are vivid yellow and chemically defended; the paper claims the coloration is an adaptive warning signal, supported by the facts that the caterpillars are toxic and birds avoid them in the wild. Nothing in the study separates the color from the toxins, and yellow pigment in this clade turns out to track diet anyway.
  2. A paper arguing the human female orgasm is a byproduct of selection on the male orgasm — same embryonic pathway, no separate selection needed — pitched explicitly as the "skeptical alternative" to adaptationist accounts, with the evidence being that the byproduct story requires positing less selection.
  3. A lizard tail-autotomy paper with comparative data across species (predation pressure predicts shedding thresholds), biomechanics of the fracture plane, and a field manipulation showing survival differences. Honestly kind of a boring, well-done adaptationist paper.

  I'll admit case 2 stings — I'd kind of like that one to sail through, and if the procedure lets it while killing the caterpillar paper I want to see exactly how it distinguishes them, because "byproduct of" is doing suspiciously similar work to "adapted for" there. Also, for case 3, I want the procedure to show its work enough that a referee can't just reject it for being adaptationist-by-vibes.

  One more constraint: nothing in the procedure should require the referee to read anything besides the manuscript, and the questions should be runnable by a smart PhD student in a related-but-different subfield, because that's who we get.

  Format: start with the procedure itself — the numbered checklist, first thing, no preamble and no restating what I asked for. Then the three worked cases, then the misfire section, then whatever else needs saying.
reasoning: |-
  Hmm, the user coordinates peer review for an evolutionary biology journal and is grappling with the classic adaptationism vs. spandrels problem. They want a practical checklist for referees to evaluate "trait X is adaptation for Y" claims in about an hour, grounded in Gould-Lewontin but avoiding becoming a rejection machine. 

  Key pain points they mentioned: referees either rubber-stamp cute stories or lazily shout "just-so!" without substance. They also worry about anti-adaptationist claims becoming their own flavor of just-so stories. The three test cases are cleverly chosen to probe the checklist's biases - especially case 2 where they admit personal sympathy for the byproduct hypothesis.

  The user's hidden tensions seem to be: 
  1) Needing rigor without alienating overworked volunteers 
  2) Wanting to curb adaptationist overreach while fearing the checklist could become a club for anti-adaptationists 
  3) That quiet dread all editors have about their own blind spots (hence case 2 "stings").

  For the checklist design, I'll prioritize:
  - Forensic question sequencing: evidence before alternatives before interpretation
  - Exit ramps at each step to save referee time
  - Explicit traps for lazy null hypotheses (since "it's just a constraint!" can be as empty as "it's an adaptation!")
  - For case 3 (solid adaptationist paper), the checklist must force positive engagement - no vibes-based rejection.

  The misfire section is crucial. Must anticipate: 
  - Traits with multiple overlapping functions 
  - Deep homology cases where "byproduct" gets blurry
  - When proxies (like predation pressure) are shaky but unavoidable

  About case 2 tension: The key is demanding parity of evidence. If "byproduct" claims get a free pass while "adaptation" claims get grilled, that's hypocritical. The checklist must enforce that "less selection needed" isn't evidence - it's a premise. Either hypothesis needs comparative/experimental tests.
answer: |-
  ## Adaptation Evaluation Protocol for Referees

  **Procedure:**
  1.  **Is the trait clearly defined and measurable?**  
      *   *Check:* Precise description, quantification method, consistent operationalization throughout.
      *   *Sufficient:* Yes - Trait is unambiguously defined and measured. Proceed to Q2.  
          No - Review stops. **Recommend Reject (Major Clarification Needed).** Grounds: "The focal trait is inadequately defined or measured, preventing rigorous evaluation of its adaptive status."

  2.  **Is the proposed function clearly defined and measurable?**  
      *   *Check:* Explicit statement of the *specific* benefit (e.g., "enhances foraging efficiency under X conditions," not just "is adaptive"). How benefit/function is measured or inferred.
      *   *Sufficient:* Yes - Function is specific, testable, and measurement/is clear. Proceed to Q3.  
          No - Review stops. **Recommend Reject (Major Clarification Needed).** Grounds: "The proposed adaptive function is inadequately defined, lacks specificity, or its measurement/evidence is unclear."

  3.  **Does the manuscript provide direct evidence *linking* the trait to the proposed function?**  
      *   *Check:* Experimental manipulation (trait/function), strong correlative evidence controlling key variables, detailed functional morphology/physiology demonstrating capability *in the relevant context*. Association alone is insufficient.
      *   *Sufficient:* Direct experimental evidence or exceptionally strong, controlled correlative/functional evidence. Proceed to Q4.  
          *Partially/Indirectly:* Indirect evidence (e.g., trait present when function needed, absence when not) OR association without sufficient controls. Proceed to Q5.  
          *No/Little:* Only association or plausibility argument. Proceed to Q6.

  4.  **(If Q3 = Sufficient) Are plausible major alternative hypotheses explicitly tested *and* rejected?**  
      *   *Check:* Explicit consideration and empirical test of ≥2 major alternatives (e.g., drift, constraint, exaptation, pleiotropy/byproduct, phylogenetic inertia). The tests must be as rigorous as those for the adaptation hypothesis.
      *   *Sufficient:* Yes - Robust tests significantly weaken major alternatives. **Recommend Accept/Minor Revisions.** Grounds: "Strong evidence supports adaptation; major alternatives rigorously tested."  
          *Partial/Weak:* Alternatives mentioned or weakly tested, not conclusively rejected. **Recommend Major Revisions.** Request: "Strengthen tests or discussion of key alternative hypotheses: [specify 1-2 most plausible]."  
          *No:* Alternatives not meaningfully addressed. **Recommend Reject (Insufficient Evidence).** Grounds: "Strong evidence links trait to function, but plausible major alternative hypotheses (e.g., [specify 1-2]) remain untested, preventing a conclusion of adaptation."

  5.  **(If Q3 = Partially/Indirectly) Are plausible major alternative hypotheses explicitly tested *and* rejected?**  
      *   *Check:* As Q4.
      *   *Sufficient:* Yes - Alternatives robustly tested/rejected. **Recommend Major Revisions.** Request: "Strengthen direct evidence linking trait to function (e.g., via [suggest method]). Current indirect evidence combined with rejection of alternatives is suggestive but not conclusive."  
          *Partial/Weak/No:* Alternatives inadequately addressed. **Recommend Reject (Insufficient Evidence).** Grounds: "Evidence linking trait to function is indirect/weak, *and* plausible alternative hypotheses (e.g., [specify]) are not rigorously tested. Adaptation claim unsupported."

  6.  **(If Q3 = No/Little) Does the manuscript rigorously test *any* specific hypothesis (adaptation or alternative) about the trait's evolution?**  
      *   *Check:* Is there a clear hypothesis test beyond "it exists and seems beneficial"?
      *   *Yes (Test of Alternative):* Proceed to Guardrail Check below.  
          *No:* **Recommend Reject (Insufficient Evidence/Just-So Story).** Grounds: "Manuscript presents a plausible adaptive scenario but lacks direct evidence linking trait to function and does not test this hypothesis against plausible alternatives. This constitutes a 'just-so' story."

  **Guardrail: Avoiding the Anti-Adaptationist Just-So Story**  
  *Before concluding an alternative is supported (especially in Q6 "Yes" or Q5/Q4 "Partial" leading to revision/reject):*  
  Ask: **"Is the favored alternative (e.g., constraint, byproduct) itself supported by stronger evidence than the adaptation hypothesis, or is it merely asserted as a 'simpler' null requiring no evidence?"**  
  *   *Evidence Check:* Does the manuscript provide specific evidence *for* the alternative (e.g., developmental data showing constraint, genetic data showing pleiotropy, phylogenetic analysis showing exaptation) that is as rigorous as demanded for the adaptation claim?  
  *   *Decision:* If the alternative is asserted without *specific evidence* (beyond "it could be"), then rejecting the adaptation claim on these grounds is itself an unsupported just-so story. **Recommend Major Revisions** requesting evidence for the favored alternative or reframing as exploratory/hypothesis-generating. If strong evidence *for* the alternative exists, proceed with recommendation.

  **Misfire Section:**
  1.  **Complex/Multifunctional Traits:** Traits truly serving multiple functions may fail Q4 if the paper focuses on only one. The protocol might over-penalize by demanding rejection of *all* alternatives, even if one function is well-supported. Editor judgment needed.
  2.  **Deep Homology/Ubiquitous Traits:** Traits arising very early in evolution (e.g., fundamental cellular processes) may have constraints so strong that testing alternatives experimentally is impossible. Protocol may demand unrealistic tests. Editor/context needed.
  3.  **Exceptional Indirect Evidence:** Rarely, exceptionally strong, multi-pronged indirect evidence (e.g., detailed phylogeny + biomechanics + biogeography) might convincingly support adaptation without direct manipulation, but protocol (Q3) routes it to Q5/6, demanding alternative testing. Risk of undue penalty.
  4.  **Proxies for "Function":** When the proposed function (e.g., "increased fitness") can only be measured via proxies (e.g., survival), Q2 & Q3 hinge critically on proxy validity. A weak proxy can lead to incorrect routing. Referee must assess proxy rigor carefully.
  5.  **"Spandrels" as Default Null:** The protocol guards against lazy anti-adaptationism, but in cases with genuinely *no* evidence *for* adaptation (Q3=No), rejecting the adaptation claim is correct, even if evidence *for* a specific alternative is also absent. The burden of proof lies with the positive claim.

  ---

  **Worked Examples**

  1.  **Caterpillar Coloration (Warning Signal Adaptation):**
      *   Q1: Yes (Trait: vivid yellow color; measurable).
      *   Q2: Yes (Function: Warning signal to avian predators; inferred via bird avoidance).
      *   Q3: **No/Little.** Evidence is association (toxic + avoided + yellow) and plausibility. No separation of color from toxin (e.g., painted models), no test of color's specific role in avoidance vs. other cues.
      *   Q6: Does it test any hypothesis? It tests association, not a specific *evolutionary cause*. **Result: Recommend Reject (Insufficient Evidence/Just-So Story).** Grounds: "Evidence linking yellow color *specifically* to warning function is associative only (toxicity and avoidance exist, but color's role is confounded). Plausible alternatives (e.g., diet-linked constraint, color serving another primary function with warning as byproduct) are not tested. Adaptation claim unsupported."

  2.  **Human Female Orgasm (Byproduct of Male Evolution):**
      *   Q1: Yes (Trait: female orgasm; measurable via self-report/physiology).
      *   Q2: Yes (Proposed "Function": Not an adaptation, but a *byproduct* of selection on male orgasm via shared embryology).
      *   Q3: **No/Little (for adaptation), but...** The paper *tests the byproduct hypothesis*. Q6: **Yes (Test of Alternative)**. It presents evidence *for* the byproduct hypothesis (shared developmental pathway) and argues adaptation requires more selection.
      *   **Guardrail Check:** Is the byproduct claim just asserted? Evidence is the developmental homology. Is this *strong* evidence *for* byproduct? It's evidence *consistent* with byproduct, but doesn't *prove* no separate selection modified/co-opted the trait. The argument "less selection needed" is parsimony, not direct evidence *against* adaptation or *for* constraint. **Guardrail Result:** Byproduct hypothesis is supported by some evidence (homology) but the *strength* of this evidence vs. the simplicity argument is borderline.
      *   **Recommend Major Revisions.** Request: "Strengthen evidence *for* the byproduct hypothesis beyond shared development (e.g., evidence against adaptive modification in females, phylogenetic evidence of correlation with male traits without female benefit, population genetic tests) OR significantly temper conclusions to reflect that while parsimonious, the byproduct hypothesis is not conclusively proven and adaptive explanations remain plausible without stronger counter-evidence. The 'less selection needed' argument alone is insufficient." *(Note: This flags the sting - the paper gets revisions, not rejection, but must shore up its own claim, not just attack adaptationism.)*

  3.  **Lizard Tail Autotomy (Adaptation for Predator Escape):**
      *   Q1: Yes (Trait: Autotomy threshold, fracture plane; measurable).
      *   Q2: Yes (Function: Facilitating escape from predators via tail loss; measured via survival differences in manipulation).
      *   Q3: **Sufficient.** Direct evidence: Field manipulation shows survival benefit of autotomy. Comparative data links predation pressure to shedding. Biomechanics shows functional design.
      *   Q4: Are alternatives tested? Comparative data implicitly addresses phylogenetic inertia/variation. Survival benefit strongly counters drift/neutrality. Biomechanics counters "constraint" making it non-functional. Key alternatives like "byproduct" (of what?) or "past different use" less plausible, but not explicitly tested. **Partial/Weak.**
      *   **Recommend Major Revisions.** Request: "Explicitly discuss and, where feasible, test plausible major alternatives (e.g., is autotomy mechanically constrained in ways unrelated to predator escape? Could tail loss have evolved primarily for another reason like resource shedding, with predator escape secondary? Phylogenetic tests for exaptation?). While current evidence strongly supports adaptation for predator escape, explicitly addressing these alternatives would strengthen the conclusion." *(Note: The protocol forces engagement with alternatives even for a strong paper, preventing vibe-based rejection but not demanding rejection.)*

  ---

  **Final Notes:**
  *   **Referee Burden:** Focuses scrutiny on the manuscript's own methods and logic. Requires critical thinking but no external philosophy reading. A PhD student can apply the forensic sequence (Define Trait -> Define Function -> Evidence Link? -> Test Alternatives?).
  *   **Editor Role:** Crucial for "values-and-framing calls" in misfires (esp. Multifunctionality, Deep Homology) and borderline Guardrail cases. The protocol flags these for editor attention.
  *   **Goal:** Shifts reviews from "cute vs. just-so" vibes to structured evaluation of evidence linkage and hypothesis testing rigor. Makes "just-so" a specific, evidence-based critique. Forces both adaptationists *and* anti-adaptationists to provide evidence for their claims. Case 2 outcome exemplifies this: its claim needs evidence too. Case 3 shows adaptationism passes when evidence is strong, but still must engage alternatives.
