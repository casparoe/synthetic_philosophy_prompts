  ### **Predictions for Your Ambiguous Cases**
  1. **Step-by-Step Math Supervision**:  
     - **Principle’s Prediction**:  
       - If steps are verified for *correctness* (not style), process is ✅:  
         - Alignment: Correct steps robustly advance the goal.  
         - Granularity: Necessary for credit assignment (sparse → dense rewards).  
       - If steps are graded for "reasoning style," process is ❌:  
         - Unrobust to Goodharting (e.g., models learn plausible-looking nonsense).  
     - **Verdict**: Use process *only* with stepwise outcome verification (e.g., checking intermediate answers). Style-based supervision is invalid.  

  2. **New Case: Flattering Evaluation in Verifiable Domain**  
     - **Setup**: A model in a fully verifiable domain with cheap evaluation, but the operator chose a flattering metric (e.g., accuracy on cherry-picked data).  
     - **Principle’s Prediction**: Outcome ❌  
       - **Why**: The outcome signal is *not alignment-robust*. Flattering metrics are gameable and diverge from the true goal.  
       - **Resolution**: Reject the metric. Use a robust outcome signal (e.g., adversarial/out-of-distribution tests) *or* fall back to process if a robust judge exists.  

  ---

  ### **Why This Works and Limitations**
  - **Solves Your Conflicts**:  
    - Explains coding (Case 6) vs. research (Case 7) dichotomy: Robustness determines signal type, not domain.  
    - Resolves step-by-step math dilemma: Granularity must serve credit assignment *with* alignment.  
    - Forbids "performative reasoning" (Case 5) as non-robust.  
  - **Limitations**:  
    - Requires defining "true goal" rigorously (hard in subjective domains like advice).  
    - "Severe credit assignment problems" is qualitative (e.g., how sparse is "too sparse"?).  
    - Does not prescribe how to *build* robust signals (e.g., adversarial testing).  

  ### **Final Recommendation**  
  Adopt this principle but add a decision heuristic:  
  > *"When in doubt, ask: 'If the model optimizes this signal perfectly, could it still fail the true goal?' If yes, the signal is non-robust."*  

  This would have flagged your shaky cases (shallow tests, CoT style, flattering metrics) and spared the muddle. For your flip-flopping math case: **use stepwise verification, not style grading**.
