  ### **The Principle: Aligned Supervision at Minimum Viable Granularity**
  **Supervise at the finest granularity where:**
  1. **The signal is alignment-robust** (i.e., optimizing it robustly advances the true goal; resistant to Goodharting/gaming), *and*
  2. **The granularity is necessary** to either:  
     a. **Prevent irreversible harm**, or  
     b. **Resolve severe credit assignment problems** due to long horizons or sparse rewards.  

  **Default to outcome supervision when these conditions are met at the outcome level.**

  ---

  ### **How Each Clause Explains Your Cases**
  1. **Alignment-Robustness (Core Motivation: Cases 2, 5, 6, 7)**  
     - Signals must be *causally tied* to the true goal and hard to fake.  
     - **Case 2 (coding w/ shallow tests)**: Outcome signal is *not* robust (easily gamed).  
     - **Case 5 (grading CoT appearance)**: Process signal (reasoning "style") is *not* robust (divorced from actual cognition).  
     - **Case 6 (coding w/ hardened tests)**: Outcome signal *is* robust (adversarial testing ensures alignment).  
     - **Case 7 (research assistant)**: Outcome signal (end results) is *not* robust (confounded by long horizons/noise). Process (weekly plans) is robust *if* the judge is strong.  

  2. **Irreversible Harm (Motivation: Case 4)**  
     - If actions have irreversible consequences, granular supervision is non-negotiable.  
     - **Case 4 (real-world agent)**: Per-action approval prevents catastrophic errors.  

  3. **Credit Assignment (Motivation: Case 7, Step-by-Step Math)**  
     - Long horizons/delayed rewards necessitate intermediate signals.  
     - **Case 7**: Quarterly outcomes are too sparse for reliable learning.  

  4. **Default to Outcome (Motivation: Cases 1, 3)**  
     - When outcome is robust and granularity isn’t needed, outcome is simpler and avoids process-distortion.  
     - **Case 1 (math w/ verifier)**: Outcome robust; no irreversibility/credit issues.  
     - **Case 3 (open-ended drafting)**: Outcome (reviewer’s judgment) *is* the true goal → inherently robust.  

  ---

  ### **Verdicts the Principle Accommodates and Revises**
  | Case | Your Verdict | Principle’s Verdict | Consistency |  
  |------|--------------|---------------------|-------------|  
  | 1. Math w/ verifier | Outcome ✅ | Outcome ✅ | Consistent |  
  | 2. Coding w/ shallow tests | Outcome ❌ → Process | Process ✅ | Consistent |  
  | 3. Open-ended drafting | Outcome ✅ | Outcome ✅ | Consistent |  
  | 4. Real-world agent | Outcome ❌ → Process | Process ✅ | Consistent |  
  | 5. Grading CoT appearance | Uneasy ❌ | **REVISE: Reject** ❌ | Principle forbids unrobust process signals |  
  | 6. Coding: hardened tests > human judge | Outcome ✅ | Outcome ✅ | Consistent |  
  | 7. Research assistant | Process ✅ | Process ✅ | Consistent |  

  - **Revised Verdict for Case 5**: Supervising reasoning "style" violates alignment-robustness. If the process signal (CoT) doesn’t reflect true cognition, it distorts learning ("performance vs. competence"). Use outcome *or* verified step correctness instead.  
  - **All Other Cases**: Fully consistent.  

