prompt: |-
  My friend Maya is the most markets-are-great person in my rationalist meetup — she'll defend prediction markets unprompted, thinks rent control is basically vandalism, wants most drugs legalized, the whole package. But she has this list of exceptions where markets apparently make her skin crawl, and I've been trying to reverse-engineer the rule, because her verdicts don't obviously add up to anything. Her rulings so far: kidney sales should stay illegal even in a regulated Iran-style system; paying people for plasma is fine; vote selling should be banned even between consenting adults in a safely blue state where the one vote provably doesn't matter; price gouging on generators after a hurricane should be illegal; paid surrogacy is fine when the surrogate is financially comfortable and genuinely wants to do it; paying volunteers a fat sum to be deliberately infected in a vaccine challenge trial is fine. She rolls her eyes at the anti-commodification crowd (the "some things money shouldn't buy" types), so I dont think she thinks of herself as having a theory here, but I'm not convinced she's actually escaped one.

  The new case we argued about last night: a well-off software engineer — no debts, no medical bills, nothing desperate going on — wants to sell a kidney to a stranger through a regulated registry at a fair price, purely because she'd rather have the money than the spare kidney. Maya went quiet and hasn't given a verdict, and I want to predict her before she does. What rule is she actually running? I can see at least two or three candidates that fit her track record — something like "markets are fine unless desperation is doing the work," versus "markets are fine unless the thing being sold is too constitutive of who you are," versus plain old "markets are fine unless third parties get hurt" — and they seem to split on this case. What do you predict she says, which rule fits her track record best and why, and what case should I spring on her next to actually tell the remaining candidates apart? For what its worth she's a hardcore utilitarian about everything else in her life, which makes the whole list extra weird, so if her rulings are doing something other than any of my three candidate rules I'd want to hear that too.
reasoning: |-
  Hmm, the user is trying to figure out Maya's implicit rule about market exceptions. Maya is a staunch market advocate except for specific cases like kidney sales, vote selling, and price gouging, while accepting plasma donation, paid surrogacy under certain conditions, and challenge trials. The user has proposed three possible rules: desperation, constitutive identity, or third-party harm. 

  First, I need to map Maya's positions to these rules. Desperation seems to fit kidney sales and potentially price gouging, but vote selling doesn't involve desperation. Constitutive identity might cover kidneys and votes as core to identity, but plasma and surrogacy are also bodily yet she allows them. Third-party harm could apply to price gouging (hurting disaster victims) and vote selling (undermining democracy), but less so for kidneys where harm is unclear.

  Looking deeper, Maya's exceptions might be about preventing exploitation of vulnerability or situations where consent is compromised. Kidney sales involve permanent loss and potential exploitation; vote selling threatens democratic integrity; price gouging exploits disaster victims. In contrast, plasma donation is low-risk and reversible, surrogacy has safeguards, and challenge trials are consensual with informed participants.

  The new case is a financially secure software engineer selling a kidney voluntarily. If Maya's rule is about desperation, she should approve since there's no vulnerability. But if it's about constitutive identity, she might still object because kidneys are seen as fundamental to self. Third-party harm isn't obvious here. However, her hesitation suggests the constitutive aspect might weigh heavily, or perhaps she's considering the symbolic harm of commodifying body parts.

  Her utilitarianism adds complexity—she might internally conflict between outcomes and principles. For future tests, comparing hair vs. organ sales could clarify if it's about body integrity, while a non-desperate vote seller would test if democracy concerns override consent.

  Prediction: Maya rejects the kidney sale. The best-fitting rule is preventing exploitation in contexts of inherent vulnerability or irreversible harm, with constitutive elements mattering when combined with exploitability. The hair sale scenario could help distinguish if body part commodification itself is the issue.
answer: |-
  Based on Maya's track record and her utilitarian leanings being overridden by specific intuitions, I predict **she'll oppose allowing the well-off software engineer to sell a kidney**. The rule that best fits her pattern isn't perfectly captured by your three candidates alone, but rather a hybrid principle focused on **"Irreversible Harm + Exploitable Vulnerability (Even Potential), or Fundamental Civic/Social Integrity."**

  Here's the breakdown of her rulings mapped to this rule:

  1.  **Kidney Sales Illegal:** Fits *Irreversible Harm* (permanent organ loss) + *Exploitable Vulnerability* (even in regulated systems, worries about desperation or subtle coercion persist; the kidney is highly "constitutive").
  2.  **Plasma Sales Fine:** *Reversible Harm* (body replenishes plasma), *Lower Vulnerability* (shorter process, less risk), less "constitutive" than an organ.
  3.  **Vote Selling Illegal:** Fits *Fundamental Civic/Social Integrity*. Markets here corrupt the very foundation of democratic legitimacy and equality, regardless of immediate individual consent or lack of pivotal effect. *Not primarily about desperation or constitutionality of the vote itself.*
  4.  **Price Gouging Illegal:** Fits *Exploitable Vulnerability* (disaster victims are acutely vulnerable) causing *Harm* (denial of essential goods). Less about the good itself, more about the context of vulnerability.
  5.  **Paid Surrogacy (Comfortable Surrogate) Fine:** *Reversible Process* (pregnancy ends), *Mitigated Vulnerability* (surrogate is financially comfortable and genuinely willing). Context reduces the "exploitable vulnerability" aspect significantly.
  6.  **Challenge Trial Payment Fine:** *Controlled Risk* (medical oversight), *Informed Consent* (key factor), *Reversible Process* (body recovers from infection). Participants aren't typically in *desperate* financial need for this specific role, and vulnerability is managed.

  **Why your candidates don't fully fit:**

  *   **"Desperation doing the work":** Fits kidneys & gouging, but fails on votes (no desperation needed) and challenge trials (payment is fine even though the money is a motivator). The software engineer case *lacks* desperation, so this rule would predict approval, but I think she'll oppose.
  *   **"Too constitutive of who you are":** Fits kidneys (organ) and maybe votes (civic self), but fails badly on surrogacy (profoundly constitutive experience) and challenge trials (bodily invasion). Plasma is bodily but allowed.
  *   **"Third parties get hurt":** Fits gouging (victims hurt) and maybe votes (democracy hurt), but is weak on kidneys (who is the clear third-party victim in a regulated sale between consenting adults?) and challenge trials (arguable benefit). Surrogacy and plasma have potential third-party concerns she dismisses.

  **The Hybrid Rule Explained:**

  Maya's exceptions arise when two conditions combine:
      **A. The transaction involves either:**
          *   **(i) Irreversible physical harm/loss of a fundamental bodily part/function,** **OR**
          *   **(ii) The direct corruption of a fundamental civic/social institution (like democracy).**
      **B. AND there is a significant potential for exploitation of vulnerability (desperation, acute need, impaired judgment due to context) OR the act inherently undermines equality/civic integrity.**

  *   Kidneys: (A.i - Irreversible loss of fundamental organ) + (B - *Potential* for exploitation is inherent in *any* organ sale market, even if absent in *this specific* case).
  *   Votes: (A.ii - Corruption of democracy) + (B - Inherently undermines civic equality/integrity).
  *   Price Gouging: (B - Exploitation of acute vulnerability) causes significant harm (A isn't the *good*, but the *context* creates the harm).
  *   Plasma: Fails A.i (reversible, not fundamental loss). Vulnerability less inherent/significant.
  *   Surrogacy: A.i arguably present, but B is mitigated (comfortable, willing surrogate). The *managed context* reduces the exploitability.
  *   Challenge Trials: A.i present (bodily harm), but B is mitigated (informed consent, controlled setting, participants not *inherently* vulnerable *for this role*).

  **Prediction for the Software Engineer:**

  She'll say **No**. Why?
  1.  **Irreversible Harm (A.i):** Losing a kidney is permanent and fundamentally alters the body.
  2.  **Potential for Exploitation (B):** Even though *this specific* person isn't desperate, allowing such a market *inherently* creates a structure where exploitation of the vulnerable becomes possible or likely. She sees the *market category itself* as dangerous due to its *potential* to exploit vulnerability, regardless of this one "ideal" case. The kidney's "constitutive" nature heightens this concern.

  **Next Case to Spring on Her (To Test the Rule & Distinguish):**

  **Case: Selling Hair for Wigs (Long, Healthy Hair) for a substantial sum.** The seller is financially comfortable and simply wants the money.

  *   **Why this tests the rule:**
      *   *Irreversible Harm?* Hair grows back. Minimal physical harm (a haircut). Not fundamental to bodily function.
      *   *Constitutive?* Hair can be tied to identity, but less fundamentally than an organ or vote.
      *   *Exploitable Vulnerability?* Less inherent risk of exploitation compared to organs (lower stakes, reversible). A market for hair wouldn't create the same systemic pressures.
      *   *Third-Party Harm?* Unlikely.
      *   *Civic/Social Integrity?* No.

  *   **Predictions based on candidate rules:**
      *   **Desperation Rule:** Should be fine (no desperation).
      *   **Constitutive Rule:** *Might* oppose (hair as identity), but likely less strongly than kidneys/votes.
      *   **Third-Party Harm:** Should be fine.
      *   **Hybrid Rule (Irreversible Harm/Exploitability + Civic):** **Should be FINE.** It fails A.i (no irreversible harm to fundamental function) and B (low inherent exploitability risk). This is much closer to plasma than kidneys.

  **If Maya hesitates or opposes the hair sale**, it strongly suggests a **stronger "Commodification of the Body"** intuition than the hybrid rule implies, where *any* sale of body parts/tissue, regardless of reversibility or context, feels wrong to her. This would be a departure from her acceptance of plasma and surrogacy, making it less consistent.

  **If she approves the hair sale**, it strengthens the Hybrid Rule, showing the line is truly about irreversibility/fundamentality combined with exploitability/institutional harm. It would also highlight that plasma sales are acceptable because they are reversible and not fundamental bodily loss, despite involving the body.

  **In summary:** Predict Maya rejects the non-desperate kidney seller. Her underlying rule prioritizes preventing markets for things involving **irreversible bodily loss or fundamental civic integrity, especially where exploitation of vulnerability is inherent or likely, or civic equality is inherently undermined.** The hair sale case is the cleanest next test to distinguish between the Hybrid Rule and a broader anti-body-commodification view. Her utilitarian side struggles against these intuitions, leading to the "weird" list.
