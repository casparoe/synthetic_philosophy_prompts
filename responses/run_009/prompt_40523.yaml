prompt: |-
  I sit on the committee of a national anti-doping agency that grants therapeutic use exemptions. The rulebook prohibits a list of substances for every athlete; the only door back in is a medical diagnosis. If a physician certifies a genuine condition — say, exercise-induced asthma — and the drug is administered at the standard therapeutic dose, we grant the exemption; the same drug, same dose, in an undiagnosed athlete is a doping violation. I've begun to doubt this rests on any coherent version of the therapy/enhancement distinction, and I want to know what our practice actually presupposes.

  Two features of our cases worry me. First, the substance's physiological effect is the same whichever athlete takes it; all that differs is that a diagnosis intervenes. That suggests we define therapy as restoring the athlete to her own baseline rather than by reference to the substance or its effect — yet the same rulebook bans the substance in healthy athletes, which suggests we also assume a baseline-independent, species-typical level of function that any use of the drug would exceed. Second, the diagnosed condition is often produced by the sport itself: asthma is several times more common among elite endurance athletes than in the general population, and much of it is thought to be airway damage caused by years of heavy training. So "restoring the athlete to health" can mean restoring her to a baseline the sport itself destroyed and that her healthy rivals never had. It begins to look as though the diagnosis functions mainly as a license to enhance, and the implicit theory is just "a doctor was involved."

  Please reconstruct the theory of the therapy/enhancement distinction our practice presupposes, if any; state it as precisely as you can; and say whether it survives the two tensions above. Then tell me whether the practice is underdetermined — whether rival views of therapy (restoration of individual normal functioning, restoration of species-typical functioning, mere medical authorization) would all license the same rulings — and what would have to change in our practice if we adopted a strict individual-baseline rule instead. Keep your answer under 500 words.
reasoning: |-
  Hmm, the user is a committee member of a national anti-doping agency grappling with philosophical tensions in their therapeutic use exemption (TUE) system. They're questioning whether their practice rests on a coherent therapy/enhancement distinction, pointing out two key tensions: identical physiological effects regardless of diagnosis, and sport-induced conditions that don't exist in healthy rivals.

  The core dilemma is fascinating - they're recognizing that their system might functionally be rewarding athletes for sport-induced damage while banning the same substance in healthy competitors. The asthma example is particularly telling: elite endurance athletes develop airway damage from training, then get medical permission to use drugs that restore function beyond what undamaged athletes naturally possess. This makes the "therapy" label seem like a legal loophole rather than an ethical distinction.

  I need to reconstruct the implicit theory behind their current practice. It appears to be a hybrid model: therapy is defined as medical restoration of individual baseline function (hence requiring diagnosis), while enhancement prohibition assumes a species-typical norm (hence banning the substance outright for healthy athletes). But these two principles conflict when the individual baseline has been artificially lowered by the sport itself.

  The user's suspicions are valid - the diagnosis requirement effectively becomes an enhancement license in such cases. A strictly individual-baseline approach would permit any medically approved restoration, even for sport-induced conditions, while a strict species-typical norm would ban TUEs for conditions like athlete-induced asthma. Neither alternative seems satisfactory.

  Perhaps the unspoken premise is that medical authorization itself legitimizes the intervention, regardless of the origin of the impairment. But this reduces "therapy" to a procedural formality rather than an ethical category. If they adopted a pure individual-baseline rule, they'd need to drop the substance bans entirely and rely solely on medical oversight - a radical shift that might invite new ethical problems.

  The practice seems fundamentally underdetermined because different philosophical frameworks could justify the same TUE approvals while disagreeing on first principles. Resolving this would require confronting whether "restoration" applies only to naturally occurring impairments or includes self-inflicted ones - a question their rulebook currently avoids.
answer: |-
  Your practice presupposes a **hybrid theory of therapy that combines individual baseline restoration with a normative threshold of species-typical function**, but this hybrid faces fatal tensions. Here’s the reconstruction and analysis:

  ### Presupposed Theory
  1.  **Therapy as Restoration to Individual Baseline:** The requirement for a physician-diagnosed "genuine condition" defines therapy as restoring the athlete to *their own* functional baseline prior to impairment. The substance/dose is judged relative to this personal norm.
  2.  **Enhancement as Exceeding Species-Typical Function:** The prohibition of the substance for *all* athletes without a diagnosis implicitly assumes a species-typical baseline. Use of the substance is enhancement if it pushes the athlete *beyond* this typical human functional level, even if restoring their personal baseline does so.

  ### Survival Under Tensions
  1.  **Identical Physiological Effect:** This tension exposes the inconsistency. The hybrid tries to hold both definitions simultaneously: therapy (individual restoration) and enhancement (species-typical exceeding). Yet, the effect *is* identical. The diagnosis doesn't change the effect; it merely legitimizes the *reason* (restoration vs. augmentation) within the system. The theory **fails** here – it cannot coherently claim the substance is *only* therapeutic for the diagnosed athlete while *enhancing* the undiagnosed one, given identical outcomes.
  2.  **Sport-Induced Conditions (e.g., Asthma):** This tension fatally undermines the "restoration" justification. Granting a TUE for sport-induced damage:
      *   **Does not restore to a "healthy" state:** It restores to a *sport-adapted* state the athlete wouldn't possess without intense training.
      *   **Creates an advantage:** It often restores the athlete *to or beyond* the functional level of rivals who never had the impairment (i.e., exceeded *their* baseline). The "therapy" is enabling performance *dependent* on the substance to mitigate sport-induced harm, functionally equivalent to enhancement for that specific performance context. The hybrid theory **collapses** here, revealing the diagnosis primarily as procedural authorization.

  ### Is the Practice Underdetermined?
  **Yes.** Different theories can justify the *same rulings* on TUEs:
  *   **Strict Individual Baseline:** "Restore impaired function (however caused)." Approves sport-induced asthma TUEs.
  *   **Medical Authorization:** "A doctor certifies a medical need." Approves sport-induced asthma TUEs.
  *   **Strict Species-Typical:** "Restore only to population average." *Would reject* sport-induced asthma TUEs if restoration exceeds typical function (which it often does for elite athletes).

  However, the *ban* on the substance for the undiagnosed relies *solely* on a species-typical (or sport-defined "clean") baseline.

  ### Adopting a Strict Individual-Baseline Rule: Consequences
  Replacing the hybrid with *only* "restoration to individual baseline" would require:
  1.  **Eliminating the Substance Ban:** If therapy is *only* defined relative to the individual, the substance couldn't be inherently banned for "enhancement" in healthy athletes. Enhancement would lose its independent meaning.
  2.  **Focusing Solely on Medical Need & Oversight:** TUE approval would depend *entirely* on physician diagnosis of impairment and appropriate dosing to restore *that athlete's* function, regardless of the cause (congenital, acquired, sport-induced) or whether restoration exceeds population norms.
  3.  **Accepting Performance Inequality from Medical Intervention:** Athletes with sport-induced conditions (or any impairment) could legally use substances restoring them to a level potentially exceeding rivals' natural baselines. The "level playing field" ideal would be redefined around medically managed individual function, not a universal "natural" baseline.

  **In essence:** Your current practice implicitly relies on a contradictory hybrid theory that unravels under scrutiny, especially for sport-induced conditions. The diagnosis functions as the key procedural gatekeeper, not a robust ethical distinction. Adopting a pure individual-baseline rule would abandon the concept of inherent enhancement via substance and make medical authorization the sole criterion, fundamentally altering the anti-doping paradigm.
