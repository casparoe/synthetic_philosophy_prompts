prompt: |-
  I keep landing in the same argument about whether what you believe can change what you see, and before I have it again I want the spec first. Write the desiderata a theory of the perception/cognition border has to meet: which cases it has to classify the same way (Müller-Lyer persisting after you've measured the lines, the radiologist who after ten years genuinely sees a hairline fracture where I see gray mush, the chess master who says the position just looks weak on the queenside, language-driven shifts in how fast people discriminate shades of blue), which distinctions it has to keep standing (penetration by belief vs. by attention vs. by just looking harder at one region; a change to this particular experience vs. a perceptual system rewired by years of training), and what it owes epistemology — people claim that if cognition penetrates perception then perception is useless as a neutral input for justifying beliefs, and I want to know which ways of drawing the border make that claim true and which make it trivial. For each requirement give the case or consideration motivating it, say which are non-negotiable and which are just one camp's preference, and flag any pair you suspect can't be jointly satisfied. One more wrinkle from a friend that I don't see handled anywhere: she says the *rate of change* is what matters — a system counts as perceptual iff beliefs can't revise it within a single episode, even though it can be retrained over months, so the question isn't 'is it penetrable' but 'how fast is the membrane'. Decide whether that should be its own requirement or is just a restatement of one of the others, since the whole spec hangs on it. Don't bother scoring the big contenders against the list, I'll do that myself. Under 700 words please.
reasoning: |-
  Okay, the user is asking for a detailed specification (desiderata) for theories about the border between perception and cognition. They want a framework to evaluate different theories on this topic, specifically addressing several key cases, necessary distinctions, epistemological implications, and a "rate of change" consideration from a friend. 

  The user mentions recurring arguments about whether beliefs can change what we see, and wants to prepare for future debates by establishing clear criteria upfront. They seem frustrated with repetitive discussions and want a rigorous foundation. Their examples suggest familiarity with cognitive science (Müller-Lyer illusion, expert perception, linguistic relativity), but they're concerned about real-world implications - especially how perception justifies beliefs if it's penetrable.

  The core tension I need to resolve centers on epistemology: if cognition influences perception, does that destroy perception's value as neutral evidence? The user wants to know which versions of this claim hold water. The "rate of change" idea seems novel - treating penetrability as a matter of speed rather than binary possibility. This could be either a distinct requirement or a refinement of existing ones.

  For structure, I'll consider: 
  1) Must-classify cases: Müller-Lyer (shows illusion persists despite knowledge), radiologist expertise (long-term rewiring vs immediate belief?), chess master's intuition (trained pattern recognition), language/color discrimination (cultural/linguistic influences on perception). These must be handled consistently by any theory.

  2) Critical distinctions: Belief penetration vs attention shifts vs sensory adaptation; temporary changes vs permanent rewiring. The radiologist case tests this - is it cognition or retrained perception?

  3) Epistemological obligation: Theories should clarify when penetrability threatens perception's justificatory role. The user suspects this might be trivial under some frameworks.

  4) The rate-of-change wrinkle: This challenges the binary view. Should it be a separate desideratum? It interacts crucially with the radiologist/chess cases - slow change might count as perceptual rewiring, not cognitive penetration.

  Non-negotiable elements include the Müller-Lyer case (it's foundational) and the belief/attention distinction (they're fundamentally different mechanisms). The epistemological requirement is tricky - some theories might reject the premise entirely. The rate-of-change idea feels like it might conflict with traditional views of perception as "fixed" during an episode.

  I'll present these with clear labels (must-have/nice-to-have) and flag potential conflicts, especially between rate-based views and traditional epistemology-focused definitions. The radiologist case in particular will test whether slow rewiring counts as penetration. The key is to provide a balanced spec the user can apply to existing theories without endorsing any particular camp.
answer: |-
  Here’s a crisp desiderata specification for theories of the perception/cognition border, prioritizing clarity and your epistemological concerns:

  ### I. Non-Negotiable Classification Cases (Must Explain)
  1.  **Müller-Lyer Persistence:** *Case:* Knowing the lines are equal doesn’t make them *look* equal. *Requirement:* Theory must classify the *persisting illusory experience* itself as perceptual output, even if judgment overrides it. *Motivation:* Core demonstration of perception's encapsulation/resilience to *immediate* belief correction.
  2.  **Radiologist Expertise:** *Case:* Expert genuinely *sees* a fracture where a novice sees undifferentiated gray. *Requirement:* Theory must classify this as perceptual (not just cognitive judgment *about* the mush). *Motivation:* Demonstrates long-term learning can alter perceptual content/parsing itself.
  3.  **Chess Master Pattern Recognition:** *Case:* Master immediately "sees" a position as weak on the queenside. *Requirement:* Theory must classify the master's immediate gestalt impression as distinct from slower strategic reasoning, likely placing it perceptually. *Motivation:* Expertise alters rapid perceptual grouping/categorization.
  4.  **Language-Driven Color Discrimination:** *Case:* Faster discrimination of colors straddling a linguistic boundary (e.g., Russian blues). *Requirement:* Theory must classify the *speed/automaticity* of discrimination as perceptually modulated by language. *Motivation:* Shows linguistic categories can shape low-level perceptual processing.

  ### II. Non-Negotiable Distinctions (Must Maintain)
  5.  **Penetration vs. Attention vs. Sensory Adaptation:**
      *   *Penetration:* Belief/content directly altering perceptual experience (e.g., ambiguous figure flipping due to suggestion).
      *   *Attention:* Selection/modulation of *existing* sensory input without changing its *inherent* content (e.g., focusing on red objects makes them more salient, not redder).
      *   *Sensory Adaptation:* Low-level physiological change due to stimulus exposure (e.g., afterimages).
      *   *Motivation:* Essential to isolate the target phenomenon (cognitive penetration) from confounds. *Epistemology:* Attention/adaptation don't threaten neutrality like belief penetration might.
  6.  **Episodic Experience Change vs. System Rewiring:**
      *   *Episodic:* Change within a single viewing/experience (e.g., belief flipping an ambiguous figure).
      *   *System Rewiring:* Long-term change due to learning/training (e.g., radiologist, chess master).
      *   *Motivation:* Radiologist/Chess cases demand this. *Epistemology:* Rewiring might be less threatening to perception's "baseline" justificatory role than immediate belief-driven flipping.

  ### III. Epistemological Obligation (Must Address)
  7.  **Threat Assessment:** *Requirement:* Theory must explicitly state the conditions under which cognitive penetration (if it occurs) **does or does not** undermine perception's role as a source of justification for empirical beliefs. *Motivation:* Your core concern. *Crucial Nuance:* Must distinguish between:
      *   **Trivial Threat:** Penetration necessarily makes perception non-neutral (tautological, but perception might still be reliable/useful).
      *   **Substantive Threat:** Penetration introduces systematic distortions or circularity that genuinely cripples justification.
      *   *Theory should clarify which threat applies based on its border placement.*

  ### IV. The Rate-of-Change Wrinkle (Critical Evaluation)
  8.  **Rate as Defining Membrane:** *Friend's Claim:* "Perceptual" = immune to belief revision *within a single episode*, regardless of long-term rewiring. *Evaluation:*
      *   **Should be its OWN core requirement**, distinct from II.6. While II.6 distinguishes *types* of change, this proposes rate (episodic immunity) as the *defining criterion* for the border itself.
      *   *Motivation:* Directly addresses the "how fast is the membrane" question and cleanly handles Müller-Lyer (resists episodic change) vs. ambiguous figures (susceptible to episodic change via suggestion). It reframes "penetrability" as a temporal property.
      *   *Conflict Potential:* May clash with classifying the radiologist's perception as truly perceptual *during an episode*, as it's the result of slow rewiring. Does the theory prioritize the *mechanism's origin* (slow learning) or its *current processing speed* (fast, within-episode)? **This requirement forces a fundamental choice.**

  ### Potential Tensions & Flags
  *   **Non-Negotiable:** I.1, I.2, I.3, I.4, II.5, II.6, III.7. (II.5 & II.6 are crucial distinctions; III.7 addresses your core worry).
  *   **Camp Preference:** Degree of penetrability accepted (modularity vs. strong continuity), *how* language shapes color perception (early vs. late), exact mechanism of expert perception. The **Rate Requirement (IV.8)** is a strong camp preference *proposal* needing evaluation.
  *   **Key Tensions:**
      *   **Radiologist (I.2) vs. Rate Requirement (IV.8):** Does seeing the fracture count as "perceptual" under IV.8? It's fast *now* but learned slowly. Resolving this is critical.
      *   **Expertise (I.2, I.3) vs. Epistemology (III.7):** If expertise rewires perception, does this threaten its justification role less than immediate belief penetration? Theory must say.
      *   **Rate (IV.8) vs. Epistemology (III.7):** If perception is defined by episodic immunity, does this automatically make it a "neutral" justifier? Not necessarily – slow rewiring could still be biased.

  This spec provides the necessary constraints (cases, distinctions, epistemology) and forces confrontation with the critical rate-based proposal (IV.8), which fundamentally reshapes the debate. Evaluate theories by how cleanly they satisfy I-IV and resolve the flagged tensions, particularly Radiologist vs. Rate.
