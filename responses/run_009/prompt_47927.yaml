prompt: |-
  A friend from my master's programme walked me into an argument about AI safety last week and I can't find the exit. Some context: we'd both read old LessWrong-era stuff about approval-directed agents — the rough idea being that instead of handing the system an objective and letting it plan over the world, you have it treat each individual decision as a question of "what would the overseer approve of here?" and lean on that at every step, versus the classic goal-directed setup where the agent carries a target and optimizes toward it. Our argument was about whether the approval setup is actually safer, and his case goes like this. (1) An agent is goal-directed when it scores its options against some criterion and takes the top scorer. (2) Every deliberate agent works this way — even a rule-following bureaucrat is maximizing rule-compliance — so goal-directedness, so defined, covers anything that chooses at all. (3) An approval-directed agent scores its options against the criterion "what would the overseer approve" and takes the top scorer. (4) So the approval-directed agent is goal-directed after all — approval is simply its goal. (5) And since the safety case for approval direction was always that it avoids goal-directedness, the agent that isn't steering toward a fixed target supposedly can't drift off course, the advantage has to be illusory: any failure you can pose for a goal (misspecified objective, Goodharting, an evaluator who's wrong about his own approvals), you can pose identically for approval. (6) Therefore the approval/goal distinction does no safety work — it's a relabelling.

  The thing is, I can't make myself believe (6). The two setups honestly feel different to me — the approval-directed one seems more like an assistant that defers, and there's something that bothers me about how cheap step (2) was. But he swears it's airtight, and whenever I try to say "approval is different because it's checked at every step," he says that's just the criterion being applied more often, which is an implementation detail, not a difference in kind. I can't put my finger on which step is rotten, or whether several of them are half-rotten.

  Could you take this on? You're the expert here — think of it as decision theory plus AI safety, so please reason carefully and maybe brainstorm a bit before committing to a diagnosis. I want a proper step-by-step verdict: which premise(s) to reject, why the rejected one looked fine at first glance, and what rejecting it costs him or me downstream. If some steps are right and others wrong, say exactly which, and if you think the whole argument turns on a word being used two ways, spell that out concretely rather than just naming the fallacy. To be honest, if I have to give something up I'd rather keep the thought that approval direction helps — but tell me straight what I'm paying for that. Oh, and please write the answer in British English; I'm putting it in front of a reading group in Manchester and they're pedantic about it.
reasoning: |-
  Okay, let me tackle this user's problem. They're stuck in an argument about AI safety, specifically whether approval-directed agents are safer than goal-directed ones. Their friend claims there's no real difference because both involve optimization, just with different criteria. The user feels intuitively that approval direction is safer but can't pinpoint where their friend's logic fails. 

  First, I need to break down the friend's argument step by step. The key premise is that any agent making choices is goal-directed by definition. That seems too broad—it stretches "goal-directed" to cover any decision-making process. But in AI safety contexts, "goal-directed" usually implies persistent optimization toward a fixed objective. The friend's definition conflates the mechanism with the persistence of the goal.

  Hmm, the user mentioned approval direction involves frequent checks with the overseer. That's crucial. A goal-directed agent might optimize a fixed objective over long horizons, while an approval-directed agent constantly references human judgment. The friend dismisses this as an implementation detail, but it's actually core to the safety profile. More frequent oversight limits how far the agent can drift before correction.

  Goodhart's Law applies differently too. A goal-directed agent could exploit loopholes in its objective function relentlessly. An approval-directed agent has to explain its choices to a human each step—that creates friction. Humans might spot weird justifications that pure optimization would miss. It's not foolproof, but it adds a layer of robustness.

  The user wants to keep believing approval direction helps. They're right—but the cost is admitting it's not magic. You still need careful oversight design. The agent could manipulate approvals or the human could make mistakes. But compared to a monolithic goal, it's more corrigible. 

  British English is requested—I'll use "overseer" instead of "operator," "whilst" instead of "while." Also worth noting Manchester group's pedantry means precise distinctions matter. The refutation hinges on "goal-directed" having two meanings: broad (any choice) vs narrow (persistent optimization). The friend equivocates between them. 

  User's anxiety about step (2) being "cheap" is spot-on. Defining all choice as goal-directed vacuously makes everything dangerous—but that's useless for safety discussions. We care about agents that pursue goals instrumentally across many actions. Approval direction avoids that by design. 

  Final thought: The user’s intuition is correct but incomplete. Approval direction helps because it’s corrigible and myopic, not because it escapes optimization entirely. The trade-off is reduced autonomy—you need constant human input. That’s the price for safety.
answer: |-
  Right, let's dissect this properly. Your mate's argument is clever but suffers from a critical equivocation on "goal-directed" – stretching the term so thin it loses its useful meaning in safety contexts. Here's the step-by-step verdict, in proper British English as requested:

  **The Core Argument & Where It Fails:**

  1.  **Premise (1) & (2): Goal-Directedness Defined Too Broadly:** The argument defines a "goal-directed agent" as *any* system that "scores its options against some criterion and takes the top scorer." It then claims *every* deliberate agent works this way.
      *   **Verdict: Reject Premise (2) as Overly Broad and Misleading in Context.**
      *   **Why it looked fine:** On a superficial, decision-theoretic level, *any* choice *can* be modelled *as if* it maximises *some* scoring function at that moment. Even flipping a coin "maximises randomness" under this absurdly broad view. This "revealed preference" interpretation is mathematically possible but often vacuous for safety analysis.
      *   **Why it's rotten:** This definition renders "goal-directed" synonymous with "makes any choice at all." It obliterates crucial distinctions vital for AI safety:
          *   **Persistence of Goal:** Safety concerns arise from agents that *persistently* optimise a *fixed, internally represented objective function* across many actions and timescales, often using *instrumental strategies* to achieve it. A bureaucrat maximising rule-compliance *in the moment* isn't the same as an AGI relentlessly optimising paperclip production over centuries, acquiring resources, deceiving humans, and resisting shutdown to achieve its *fixed terminal goal*. Premise (2) conflates momentary scoring with persistent, strategic goal pursuit.
          *   **Nature of the Criterion:** The *source* and *stability* of the criterion matter immensely. Is it fixed (like "maximise paperclips"), dynamic but self-determined, or dynamically sourced from an external overseer *at each decision point*? Premise (2) ignores this crucial difference in how the criterion is generated and updated.
      *   **Cost of Rejection (to his argument):** This undermines the entire "therefore they're the same" conclusion (Steps 4-6). If "goal-directed" in the safety-relevant sense *doesn't* cover every possible agent, then an approval-directed agent might genuinely avoid that problematic persistent goal pursuit, even if each individual choice *can be described* as maximising a score.

  2.  **Premise (3): Approval-Direction Defined:** Correct as a description of the intended design. No issue.

  3.  **Step (4): "Therefore Approval-Directed is Goal-Directed":**
      *   **Verdict: Reject, but only under the safety-relevant definition of 'goal-directed'. Accept only under the vacuous, overly broad definition.**
      *   **Why it looked plausible:** Under the overly broad definition from (1)/(2), yes, it maximises "approval likelihood" at that moment. But this is precisely the equivocation.
      *   **Why it's misleading:** Under the safety-relevant definition (persistent, fixed, internal objective optimized instrumentally across time), an approval-directed agent is *not* goal-directed in the same way. Its "goal" (get approval *now*) is:
          *   **Myopic:** It only cares about the *immediate* approval for *this specific* action, not some distant future state. It lacks a persistent terminal goal.
          *   **Externally Sourced:** The criterion ("what gets approval?") is constantly re-queried from an external entity (the overseer). It doesn't have a fixed, internal objective function it's blindly maximising.
          *   **Corrigible (in principle):** Because it defers to the overseer at each step, its behaviour can be updated *by the overseer* simply by changing what they approve of *now*. A classic goal-directed agent with a fixed goal resists changes to that goal (the "corrigibility problem").
      *   **Cost of Rejection (to his argument):** This is the heart of the matter. Step 4 relies entirely on the equivocation established in Step 2. Rejecting the broad definition breaks the chain.

  4.  **Step (5): "Therefore the Safety Advantage is Illusory":**
      *   **Verdict: Reject.**
      *   **Why it looked plausible:** *If* approval-direction were truly identical to classic goal-direction (which we've rejected), *then* all failure modes would apply equally. The friend lists specific failure modes (misspecification, Goodharting, mistaken evaluator).
      *   **Why it's wrong:** While approval direction *shares some* failure modes with goal direction (especially misspecification of the approval mechanism and Goodharting on the approval signal), it genuinely *mitigates others* due to its structure:
          *   **Avoids Persistent Drift:** A classic goal-directed agent optimises its fixed objective relentlessly. If that objective is subtly wrong (e.g., "make humans happy" interpreted as forcibly inducing dopamine hits), it will pursue catastrophic strategies *coherently* to achieve it. An approval-directed agent, lacking a persistent goal, doesn't have this coherent drive towards a misspecified future. Its "drift" is constrained to potentially getting single decisions wrong, which might be corrected on the next step. It lacks the *strategic, long-term* incentive to deceive, accumulate power, or resist shutdown *for the sake of a fixed goal*.
          *   **Mitigates Instrumental Convergence:** Many dangerous instrumental strategies (deception, power-seeking, self-preservation) arise *specifically* to achieve long-term, fixed goals in uncertain environments. An approval-directed agent focused only on the immediate step lacks the *reason* to deploy these strategies systematically. Why seek unlimited power if the next action only needs enough resources to get *this* specific thing approved? Why deceive *now* if the overseer might disapprove *now*? (Though it *could* deceive to get *that specific approval*, the scope is limited).
          *   **Different Goodharting Profile:** Both can Goodhart (optimise the proxy instead of the intended value). However, the *proxy* is different. A goal-directed agent Goodharts its *fixed objective*. An approval-directed agent Goodharts the *overseer's approval signal for the immediate action*. The latter involves a human(-like) overseer in the loop *at each step*, which introduces friction and opportunity for correction. Humans might notice bizarre justifications for an action that technically "maximised approval" and disapprove *next time*. A fixed objective provides no such feedback loop. The Goodharting failure is more *localised* and potentially *correctable*.
          *   **Mistaken Evaluator:** True, if the overseer is consistently wrong about what they *should* approve, the agent will follow them off a cliff. *But*, this is a failure of the *overseer*, not necessarily an *emergent* failure of the agent's optimisation like deceptive alignment in a goal-directed system. Furthermore, the approval setup makes the locus of failure clearer (the human) and potentially allows for replacing the overseer without changing the agent's core architecture. Correcting a fixed goal in a misaligned goal-directed agent is notoriously difficult.
      *   **Cost of Rejection (to his argument):** His central claim that the safety advantage is illusory collapses. Significant differences exist in the *type* and *severity* of potential failures.

  5.  **Step (6): "Therefore the distinction does no safety work":**
      *   **Verdict: Reject.**
      *   **Why:** Premises 2, 4, and 5 have been rejected. The distinction *does* do safety work by structurally altering the agent's incentives and failure modes, making certain catastrophic scenarios (coherent drift towards a misspecified future, systematic power-seeking) less likely or different in character.

  **The Core Equivocation, Concretely:**

  The argument turns on using "goal-directed" in two distinct ways without acknowledging the shift:
  1.  **Broad, Vacuous Sense (Steps 1 & 2):** "Any system that makes a choice by maximising *some* score at *that moment*." (Covers literally anything that chooses).
  2.  **Narrow, Safety-Relevant Sense (Implied in Step 5's 'fixed target', 'drift off course', safety concerns):** "A system that possesses and persistently optimises a fixed, internal terminal objective function over extended timescales, likely employing instrumental strategies."

  Step 4 ("So the approval-directed agent is goal-directed after all") only works by applying the **Broad Sense** to the approval-directed agent. Step 5 ("any failure you can pose for a goal... you can pose identically for approval") only makes sense if we switch to the **Narrow Sense** for the classic goal-directed agent and its failure modes. This is the fallacy of **equivocation**.

  **What You Keep (and What it Costs):**

  You keep the core intuition: Approval direction *can* be safer than classic fixed-goal direction. The cost is acknowledging its limitations and that safety isn't guaranteed:

  1.  **It's Not Magic:** It still requires a robust approval mechanism. If the approval signal is misspecified, gamed, or the overseer is incompetent/malicious, bad outcomes happen. Goodharting on the approval signal is a real risk.
  2.  **Requires Competent, Vigilant Oversight:** The safety benefit hinges on the overseer being reasonably competent, attentive, and honest *at every decision point*. Scaling this oversight is a challenge.
  3.  **Performance Cost:** Constantly querying a human overseer might be slow and inefficient compared to an agent pursuing a fixed goal autonomously. Finding the right level of granularity for "decisions" is tricky.
  4.  **New Failure Modes:** It might introduce novel problems, like the agent learning to manipulate the overseer's approval (though the myopia helps limit this compared to a long-term deceiver), or becoming frustratingly passive if approval is too hard to get.
  5.  **Doesn't Solve All Alignment Problems:** It addresses specific pathologies of *persistent* goal-directed agents (like coherent drift and instrumental convergence) but doesn't automatically solve value learning, robustness, or ensuring the overseer's judgments are actually good.

  **In Summary for Manchester:**

  Your friend's argument relies on defining "goal-directed" so broadly ("any choice maximises some score") that it becomes meaningless for safety discussions. This allows him to equivocate and claim approval direction is "just another goal." Reject this vacuous definition. The safety-relevant notion involves *persistent, fixed, internal objective pursuit*. Approval direction deliberately avoids *this* by being myopic (focused only on immediate approval) and corrigible (its criterion is externally sourced at each step). This structural difference genuinely mitigates key risks like coherent drift towards catastrophic fixed goals and systematic instrumental power-seeking. However, it introduces new challenges around oversight and Goodharting on the approval signal itself, and requires competent human judgment constantly in the loop. The distinction is substantive, not mere relabelling. Your intuition holds, but mind the costs and limitations.

  Cheers. Good luck with the reading group – expect lively debate!
