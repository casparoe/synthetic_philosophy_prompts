prompt: |-
  I'm a PhD student in political philosophy, and two people in my department have been arguing about the moral equality of combatants for literally as long as I've been here — one is basically a Walzerian orthodox type, the other a McMahan-style revisionist. They finally agreed to an adversarial collaboration and, since I'm the grad student, I get to draft the joint statement. Help me out.

  Draft the document: (1) the claims both can sign, stated precisely enough that neither would complain — e.g. about the distinction between jus ad bellum and jus in bello, what makes combatants liable to attack at all, and whatever they can agree on about civilians; (2) the exact disagreements, each phrased in wording its own side would accept (the orthodox side thinks combatants on both sides of a war are moral equals regardless of the justice of their cause; the revisionist thinks combatants fighting an unjust war do wrong by fighting, and aren't morally permitted to kill their just adversaries — but phrase these so each side would say "yes, that's my view"); (3) the cruxes, e.g. whether doing what you're morally permitted to do can still make you liable, whether consent between combatants generates permissions, how much moral responsibility conscripts and even professional soldiers actually bear for their war's justice; and (4) for each crux, the kind of argument or case both would agree bears on it, with each side's prediction written down in advance.

  Two hard cases I want the statement to explicitly handle, since this is where our two keep talking past each other: (a) a conscript who faces prison (or worse) if he refuses to fight an unjust war, and (b) a remote drone operator who volunteers, faces no personal risk, and could quit her job at modest cost. If you think part of their dispute is just verbal — e.g. about what "equality" means — say which part and why, and separate it from the substantive remainder.

  Format: numbered agreed-claims section, then a disagreements table with columns for the claim, the orthodox formulation, the revisionist formulation, and the crux it turns on. Finish with a single sentence you're confident both camps could put their names to, written as the last line in the form \jointstatement{...}.
reasoning: |-
  Hmm, the user is a PhD student in political philosophy who needs to draft a joint statement for two professors arguing about the moral equality of combatants. One follows Walzer's orthodox view, the other McMahan's revisionist view. They want me to help draft a document that captures both agreement and disagreement precisely.

  The key requirements are: First, agreed claims that both sides can sign off on without complaint. This needs to cover the distinction between jus ad bellum (justice of going to war) and jus in bello (justice in conduct during war), what makes combatants liable to attack, and common ground about civilians. I should make this precise and neutral.

  Second, I need to phrase their disagreements in wording each side would accept. The orthodox view holds combatants on both sides are moral equals regardless of whose cause is just, while the revisionist view says combatants fighting unjust wars do wrong and aren't permitted to kill just adversaries. I must capture these accurately.

  Third, I should identify cruxes - the pivotal points their disagreement turns on. These include whether doing what's morally permitted makes you liable, whether consent between combatants creates permissions, and how much moral responsibility soldiers bear for their war's justice. For each crux, I need to outline what kind of argument or case both would agree is relevant, with each side's prediction written in advance.

  They specifically want me to address two hard cases: a conscript facing severe punishment if refusing to fight an unjust war, and a volunteer drone operator with no personal risk who could quit easily. I should also identify if any part of the dispute is merely verbal - perhaps about what "equality" means - and separate that from substantive disagreements.

  For structure, I'll create a numbered list for agreed claims, then a table for disagreements with columns for claim, orthodox formulation, revisionist formulation, and the crux. Finally, I'll end with a joint statement both could sign.

  For the agreed claims section, I'll include points like: jus ad bellum and jus in bello being conceptually distinct domains; combatants becoming liable to attack through their role as participants in hostilities; civilians being generally immune from direct attack unless they directly participate; and the importance of non-combatant immunity. I'll phrase these carefully to avoid bias.

  For the disagreements table, I'll include: whether combatants on opposing sides are moral equals; whether combatants fighting in an unjust war are morally permitted to kill just combatants; and whether liability to attack depends on personal moral responsibility for an unjust threat. Each row will have both formulations and the corresponding crux.

  For the cruxes, I'll cover: the relationship between moral permission and liability; whether mutual consent generates permissions; and the extent of moral responsibility for unjust threats. For each, I'll describe the kind of case that bears on it and include predictions from both sides. I'll specifically address how the conscript and drone operator cases relate to these cruxes.

  I'll also note that some disagreement about "equality" might be verbal - whether it refers to symmetric permissions/liabilities or symmetric moral status - and separate this from substantive issues.

  Finally, I'll craft a joint statement emphasizing shared commitments to minimizing suffering and clarifying principles, which both should find acceptable.
answer: |-
  ## Joint Statement on the Moral Equality of Combatants: Areas of Agreement and Disagreement

  **Preamble:** This document outlines points of agreement and central disagreements between the orthodox and revisionist positions regarding the moral equality of combatants, arising from our adversarial collaboration. It aims for precision and mutual recognition of each position's core tenets. We focus on the *conceptual structure* of Just War Theory and the *moral status* of individuals participating in war.

  ### 1. Agreed Claims (Signed by Both Parties)

      1.  **Jus ad Bellum / Jus in Bello Distinction:** The criteria for evaluating the justice of resorting to war (*jus ad bellum*) are conceptually distinct from the criteria for evaluating the justice of conduct within war (*jus in bello*). Both domains require independent moral assessment.
      2.  **Basis of Combatant Liability:** Combatants (individuals directly participating in hostilities as members of armed forces or organized armed groups) generally become liable to intentional attack by opposing combatants *in virtue of their role and participation in the collective hostilities*, which makes them legitimate military targets. This liability arises from their status as participants posing a threat within the conflict.
      3.  **Civilian Immunity:** Civilians (persons not directly participating in hostilities) are presumptively immune from direct, intentional attack. This immunity is lost only if, and for such time as, they directly participate in hostilities. Deliberately targeting civilians is always a grave moral wrong. (Both agree on the principle, though may ground it differently).
      4.  **Non-Combatant Immunity Principle:** A core principle of *jus in bello* is that military force must be directed only against legitimate military targets (combatants and military objectives), and civilians must not be intentionally targeted.
      5.  **Moral Asymmetry at the ad Bellum Level:** Wars can be objectively just or unjust based on *jus ad bellum* criteria. Combatants fighting for a just cause are fighting a morally permissible (or even required) war; combatants fighting for an unjust cause are fighting a morally impermissible war.
      6.  **Problematic Cases Highlight Relevant Factors:** Cases such as (a) the conscript facing severe punishment for refusing to fight an unjust war and (b) the low-risk volunteer drone operator fighting an unjust war are morally significant and highlight crucial factors for assessing individual moral responsibility and liability (e.g., voluntariness, coercion, directness of threat, alternatives). The moral evaluation of these individuals differs significantly from each other and from combatants in just wars.

  ### 2. Disagreements

  | Core Claim Disputed                                                                                                    | Orthodox Formulation (Walzerian)                                                                                                     | Revisionist Formulation (McMahanian)                                                                                                                               | Crux the Disagreement Turns On                                                                                       |
  | :--------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------- |
  | **Combatant Moral Equality**                                                                                           | Combatants on opposing sides of a conflict possess *moral equality* in *jus in bello*: they hold symmetric permissions to target each other and bear symmetric liabilities to be targeted, regardless of the justice of the war their side is fighting. | Combatants on opposing sides do *not* possess *moral equality* in the strong sense: combatants fighting a just war are morally *permitted* to target unjust combatants, while combatants fighting an unjust war are morally *prohibited* from targeting just combatants; liability is not symmetric. | **Crux 1:** Does participation *per se*, combined with mutual consent/recognition of the war convention, generate symmetric permissions/liabilities? |
  | **Permissibility of Killing by Unjust Combatants**                                                                     | Combatants fighting for an unjust cause are morally *permitted* to kill enemy combatants who are fighting for a just cause, provided they adhere to *jus in bello* constraints (e.g., discrimination, proportionality). | Combatants fighting for an unjust cause are *not* morally permitted to kill enemy combatants who are fighting for a just cause. Doing so constitutes an unjustified killing.                                                       | **Crux 2:** Does the moral permission to kill depend solely on the target's liability, or also on the agent's own moral status/justification? |
  | **Grounding of Liability to Attack**                                                                                   | Liability to attack stems primarily from a combatant's role as a participant in the collective enterprise of war and their status as a dangerous agent posing a threat *within that conflict*, irrespective of their personal moral responsibility for the war's justice. | Liability to attack stems from an individual's contribution to, and moral responsibility for, an *unjust threat*. Combatants fighting a just war do not pose an *unjust* threat and are therefore not liable to attack based on their participation alone. | **Crux 3:** Does liability require personal moral responsibility for an unjust threat? |

  ### 3. Cruxes and Bearing Cases

  *   **Crux 1: Does participation *per se*, combined with mutual consent/recognition of the war convention, generate symmetric permissions/liabilities?**
      *   **Kind of Argument/Case:** Historical and conceptual analysis of the war convention; thought experiments involving symmetrical combat scenarios where both sides *believe* their cause is just but only one *is* just; analysis of the purpose of *jus in bello* independence.
      *   **Orthodox Prediction:** Yes. The mutual recognition of combatant status and the shared risk within the institution of war create a moral sphere where symmetrical permissions and liabilities are essential for containing the horrors of war and enabling any semblance of humanitarian rules.
      *   **Revisionist Prediction:** No. Mutual consent or institutional recognition among participants cannot override fundamental moral prohibitions against contributing to serious, unjust harms. Permissions/liabilities are fundamentally asymmetric based on the underlying *ad bellum* justice.
      *   **Relevance to Hard Cases:** Both sides agree these cases challenge simple participation-based liability, but disagree on whether the *in bello* symmetry holds *even for* clearly voluntary/uncoerced unjust combatants like the drone operator (b). The conscript (a) is seen as a challenge *to both* positions, highlighting the limits of liability based purely on role *or* pure responsibility.

  *   **Crux 2: Does the moral permission to kill depend solely on the target's liability, or also on the agent's own moral status/justification?**
      *   **Kind of Argument/Case:** Analysis of self-defense and other-defense principles; cases where an unjust aggressor defends themselves against a just defender; the moral asymmetry inherent in justified vs. unjustified violence.
      *   **Orthodox Prediction:** For combatants engaged in hostilities, the permission to kill depends primarily on the *target's* status as a combatant (liable) and adherence to *in bello* rules. The agent's *ad bellum* status does not negate this permission *in bello*.
      *   **Revisionist Prediction:** The moral permission to kill requires both (1) that the target is liable to attack *and* (2) that the agent acts with a sufficient justification (e.g., defense of self or others against an unjust threat). An unjust combatant lacks the requisite justification.
      *   **Relevance to Hard Cases:** Central to evaluating the drone operator (b): Can her killing of just combatants ever be permissible? Revisionist: No, she lacks justification. Orthodox: Yes, if she follows *in bello* rules and targets combatants. The conscript (a) might be excused for lacking justification but still be prohibited from killing (revisionist), or permitted under duress while still liable (orthodox).

  *   **Crux 3: Does liability require personal moral responsibility for an unjust threat?**
      *   **Kind of Argument/Case:** Analysis of the concept of liability; thought experiments involving minimally responsible contributors to unjust harms (e.g., someone forced at gunpoint to drive bank robbers); the degree to which soldiers can be held responsible for the wars of their state; the distinction between excusable and justified action.
      *   **Orthodox Prediction:** No. Liability in war is primarily role-based and threat-based, arising from posing a danger within the conflict. Personal moral responsibility for the *ad bellum* injustice is often diffuse, impossible to ascertain in combat, and not required for *in bello* liability.
      *   **Revisionist Prediction:** Yes. Liability to defensive harm requires contributing to an unjust threat in a way for which one bears some degree of moral responsibility (even if diminished by coercion or ignorance). Combatants in just wars do not contribute to an unjust threat.
      *   **Relevance to Hard Cases:** Crucial for both cases. Revisionist: The drone operator (b) likely bears significant responsibility, making her liable. The conscript (a) may bear little or no responsibility, making him potentially non-liable. Orthodox: Both are liable due to their participation and threat-posing role, regardless of responsibility level (though responsibility affects blameworthiness).

  ### 4. Verbal vs. Substantive Disagreement

  A significant portion of the disagreement over "equality" is **verbal**. Both sides agree combatants on opposing sides have the *legal* equality of being legitimate targets under international law. The orthodox position uses "moral equality" to denote the *symmetry of permissions and liabilities in the in bello sphere*. The revisionist position denies that this symmetry reflects the *underlying moral reality*; they argue "equality" misleadingly suggests the moral permissibility of the unjust combatant's actions is equivalent to that of the just combatant. **The substantive disagreement remains:** Whether this *in bello* symmetry of permissions/liabilities is morally justified and grounded (orthodox) or whether it masks a fundamental moral asymmetry based on *ad bellum* justice that renders the unjust combatant's acts impermissible (revisionist).

  \jointstatement{We affirm the importance of rigorous moral inquiry into the principles governing warfare, share a commitment to minimizing the suffering caused by war, and recognize the value of clarifying both our points of agreement and the fundamental philosophical cruxes that underlie our disagreements on the moral equality of combatants.}
