prompt: |-
  I produce a long-form interview podcast on epistemology, and the guest for my next episode is a philosopher who defends the equal weight view of peer disagreement — the view that when you discover that someone you count as an epistemic peer disagrees with you, and you have no independent reason to think you're the one who's right, you should give their opinion exactly as much weight as your own, which typically means revising your credence at least halfway toward theirs. She has published on this for years and is practiced at deflecting objections with the line that the hard cases are "questions for the theory's further development, not objections to it."

  Draft nine to eleven interview questions that make that deflection progressively harder to use. Each question must turn on the actual content of her position, and each must be paired with a follow-up keyed to the most likely reply. The set should cover, at minimum, the following pressure points, which I want asked in an order that builds:

  1. The split-the-difference worry: whether equal weight has any determinate content once you move past simple two-option cases — what does it mean to split the difference when the possible answers don't lie on a scale, or when there are more than two live options and no compromise position between them?

  2. The peerhood trap: whether the standard definition of a peer either makes the view trivial (if her past accuracy is relevant to whether she counts as my peer, then discovering that she disagrees is itself evidence about who's right, and the view has nothing left to say) or makes it so narrow that real disagreements almost never involve peers.

  3. The obvious-error cases: cases where the disagreeing peer has just made a simple arithmetic slip or overlooked something on the very page in front of her — can the equal weight view explain why it seems clearly rational to stick with my original judgment there, or does it have to bite a bullet, and if it explains it, has it smuggled in first-order reasoning as a tiebreaker, which the view was supposed to forbid?

  4. Disagreement about disagreement itself: since the equal weight view is rejected by able philosophers, does she, on her own lights, have to lower her confidence in it — and if she responds that only first-order substantive disagreements trigger equal weighting, what principled line separates the orders, given that higher-order evidence is still evidence?

  5. The lived-experience cost: whether the view, consistently applied, requires someone in a contested speciality to hold almost no confident beliefs, and whether she accepts that or has a story about how credences can remain high in practice.

  Also include one question that invites her to say something constructive rather than defensive — what she takes the equal weight view to have taught epistemology even if the specific formulation turns out wrong — placed at the end, after the pressure has been applied.

  Constraints: no questions about her biography, her influences, or the state of the field in general; every question must be answerable only by someone who actually understands the dialectic. Keep the tone respectful but persistent, the way a good seminar moderator presses a visitor. Do not include any suggested answers of more than a clause or two; the deliverable is the questions and follow-ups, not her replies.
reasoning: |-
  Okay, the user is a podcast host focused on epistemology, specifically interviewing a philosopher who defends the equal weight view of peer disagreement. They need 9-11 questions that challenge the guest's common deflection about hard cases being "questions for further development." The questions must cover specific pressure points and build logically.

  Hmm, the key pressure points are split-the-difference in complex cases, the peerhood definition problem, obvious-error cases, disagreement about the view itself, and lived-experience costs. The user wants these ordered to escalate tension, ending with a constructive question. 

  First, considering the peerhood trap makes sense as an opener—it's foundational. If peer status depends on past accuracy, disagreement itself becomes evidence against peerhood, potentially making the view either trivial or inapplicable. The follow-up should press on whether this collapses into standard evidence evaluation.

  Next, obvious-error cases feel urgent. If a peer makes a basic math error, equal weighting seems absurd. The guest might say such errors disqualify peer status, but the follow-up should challenge whether that redefines "peer" too narrowly or smuggles in first-order reasoning.

  Then split-the-difference complications. With non-scalar options (like religious beliefs) or multiple options, "equal weight" loses meaning. The guest might suggest credence redistribution, but the follow-up should question if that's arbitrary without a shared scale.

  Disagreement about disagreement comes fourth. Since able philosophers reject equal weight, shouldn't she lower her confidence? If she says meta-disagreements don't count, the follow-up must push back on why the "order" of evidence matters if it's all evidence.

  Lived-experience cost last—it's the practical consequence. If specialists must suspend judgment amid peer disputes, does this paralyze inquiry? The follow-up challenges whether her "managed credence" response is consistent.

  Finally, the constructive question about the view's lasting contributions, placed after pressure. This respects the guest while inviting reflection beyond defense.

  The structure builds from definitional issues (peerhood) to concrete problems (errors), then abstract challenges (non-scalar cases), meta-issues, real-world impact, and ends positively. Each follow-up targets likely evasions like redefining terms or separating evidence types. Tone remains sharp but scholarly—no biography or fluff.
answer: |-
  Here are 10 interview questions and follow-ups designed to systematically challenge the "further development" deflection on the core pressure points, building in intensity and ending constructively:

  1.  **Opening - Peerhood Trap:** "You define an epistemic peer as someone roughly equal in reasoning ability, evidence access, and diligence *prior* to this specific disagreement. But if discovering disagreement itself is evidence that *one* of us likely misapplied our ability or diligence *this time*, doesn't that evidence automatically undermine the very peerhood the view requires, rendering the 'equal weight' prescription either inapplicable or redundant?"
      *   *Likely Reply Focus:* Defending the prior-status definition of peerhood.
      *   *Follow-Up:* "If peerhood is fixed *only* prior to the disagreement and unaffected by the disagreement itself, how does the view avoid the charge that it artificially isolates this one piece of evidence (their current dissent) from the broader evidential picture *including* the fact that one peer is likely mistaken here?"

  2.  **Obvious-Error Cases:** "Consider a case where my peer and I are adding a short column of numbers. I get 100, she gets 150. Upon glancing at her page, I see she added 50 twice. Intuitively, I needn't split the difference. Does the equal weight view agree, and if so, *how* – given equal prior peer status – without illicitly relying on my first-order reasoning about *her* specific mistake?"
      *   *Likely Reply Focus:* Arguing the mistake disqualifies her as a peer *for this judgment* or constitutes an "independent reason."
      *   *Follow-Up:* "Doesn't classifying the *detection* of her specific, localized error as disqualifying peerhood *for this judgment* effectively mean peerhood is *always* judgment-relative and assessed post-hoc based on the disagreement's content, collapsing back into first-order evaluation rather than providing a distinct rule?"

  3.  **Split-the-Difference (Non-Scalar):** "Moving beyond credences: Suppose we disagree fundamentally on a non-scalar question with no obvious middle ground – say, 'Is the mind fundamentally physical or non-physical?' We're peers, no independent reason. What does 'equal weight' mandate I do? How do I 'split the difference' between these mutually exclusive options?"
      *   *Likely Reply Focus:* Suggesting credence adjustments (e.g., lowering confidence in physicalism, raising in dualism).
      *   *Follow-Up:* "But if my prior credence was 0.9 for physicalism and 0.1 for dualism, and hers is reversed, does 'equal weight' mean we both move to 0.5? Why is *that* the 'split,' rather than, say, averaging our *distributions* in a way that might leave me at 0.7 physicalism? Isn't the specific averaging rule arbitrary without a shared scale?"

  4.  **Split-the-Difference (Multiple Options):** "Now imagine three peers: A believes P, B believes Q, C believes R (all mutually exclusive). I believed P. I have no independent reason to favor any of us. What does 'equal weight' demand? Do I average *all* credences? Discount my own view twice? How does the view provide a unique, determinate prescription here?"
      *   *Likely Reply Focus:* Proposing a credence redistribution rule (e.g., average, equal weight per dissenter).
      *   *Follow-Up:* "If the rule is simply 'assign equal weight to each peer's *judgment*,' then I must lower my credence in P and raise it equally in Q and R. But doesn't this prescription depend entirely on the *number* of dissenters and the *specific alternatives they happen to hold*, rather than the intrinsic epistemic force of the disagreement itself? Isn't that problematic?"

  5.  **Peerhood Trap (Narrowness):** "Given the stringent requirements for peerhood – equal ability, evidence, diligence, *and* the requirement that discovering disagreement doesn't itself undermine peerhood – can you provide a plausible real-world example from a complex field like philosophy or science where two disputants *genuinely* qualify as peers under this definition at the moment of discovering disagreement?"
      *   *Likely Reply Focus:* Arguing idealized cases illuminate norms, or conceding rarity but maintaining applicability.
      *   *Follow-Up:* "If the view's core prescription applies only in vanishingly rare, highly idealized scenarios, doesn't this significantly undermine its claim to capture a fundamental norm of rational disagreement, relegating it to a very minor curiosity?"

  6.  **Disagreement about Disagreement (Meta):** "Many able epistemologists – Christensen, Kelly, Titelbaum, etc. – reject the Equal Weight View itself. On your own principles, since you presumably count them as peers on meta-epistemology, shouldn't discovering their disagreement force you to significantly lower your confidence in the Equal Weight View?"
      *   *Likely Reply Focus:* Distinguishing first-order disagreements from meta-disagreements about disagreement norms.
      *   *Follow-Up:* "What principled distinction allows you to categorically exclude *this* higher-order disagreement from triggering the equal weight response? Isn't the evidence provided by their dissent – that able thinkers find flaws in EWV – still highly relevant evidence *about* the truth of EWV, regardless of the 'order'?"

  7.  **Obvious-Error Cases (Generalization):** "Back to errors, but less blatant: Suppose my peer, whom I reasonably treated as a peer *prior* to the disagreement, makes a complex argument I find deeply flawed – say, relying on a subtle equivocation I spot. Must I still give her judgment equal weight to mine *before* concluding she's wrong, or does spotting the flaw *itself* constitute the forbidden first-order reasoning that breaks the tie?"
      *   *Likely Reply Focus:* Arguing recognizing a flaw *is* an independent reason or disqualifies peerhood *for that judgment*.
      *   *Follow-Up:* "This seems to create a dilemma: Either the view demands I ignore identifiable flaws until *after* mechanically averaging (which seems irrational), or it allows using my reasoning to identify flaws, which *is* first-order evaluation, effectively making the 'equal weight' step conditional on me *not* finding a good reason to doubt them – which seems like the standard way evidence works, not a distinct norm."

  8.  **Lived-Experience Cost:** "For a scholar in a contested field like epistemology, where peer disagreements on core issues (skepticism, justification, disagreement itself) abound, wouldn't consistent application of the equal weight view require them to hold almost *all* their substantive beliefs with very low confidence? Is this an acceptable outcome, or do you see a way credences can remain reasonably high?"
      *   *Likely Reply Focus:* Arguing managed credences are appropriate, or distinguishing deep peer disagreement from surface-level disputes.
      *   *Follow-Up:* "If the answer is that they *should* hold most beliefs with low confidence, doesn't this paralyze intellectual inquiry and action? If the answer is that credences can remain higher, doesn't this require abandoning strict equal weighting in complex, real-world disagreement contexts – perhaps relying on judgments about who *seems* more reliable *in this instance*, which again invokes the first-order reasoning the view aimed to sidestep?"

  9.  **The Core Tension:** "Stepping back, doesn't the Equal Weight View face a fundamental tension: It aims to provide a distinct, non-first-order rule for disagreement, yet *applying* the rule (assessing peer status, defining 'equal weight' in complex cases, identifying 'independent reasons') seems unavoidably to require precisely the kind of substantive, first-order reasoning about the situation and the evidence that the rule was supposed to *replace* in these moments?"
      *   *Likely Reply Focus:* Denying the tension or arguing the rule constrains first-order reasoning.
      *   *Follow-Up:* "If applying the rule *requires* first-order judgments about peer-defining traits, error detection, and the structure of the disagreement space, how is the resulting 'equal weighting' anything more than a *consequence* of those first-order judgments, rather than a distinct, prior normative command?"

  10. **Constructive Reflection:** "Suppose future work concludes the specific 'split the difference' prescription of the Equal Weight View, as currently formulated, isn't quite right. Setting aside defense for a moment, what would you say is the most valuable and enduring *insight* about disagreement that the view has contributed to epistemology, the core lesson it teaches us even if the mechanics need refinement?"
      *   *(No adversarial follow-up needed - open reflection)*

  **Order Justification:** Starts with foundational peer definition (#1), moves to intuitive counterexamples (#2), then challenges the core mechanic in harder cases (#3, #4). Highlights practical limitations (#5) before escalating to the meta-disagreement challenge (#6). Returns to error cases with higher stakes (#7), then confronts the real-world cost (#8). Culminates in synthesizing the core tension (#9). Ends by pivoting constructively (#10). This builds from definitional issues through increasingly complex applications to fundamental critique, maintaining pressure on the "further development" deflection by demanding specific, content-driven solutions at each step. Tone: Persistent, focused, avoids ad hominem, deeply engaged with the technical substance.
