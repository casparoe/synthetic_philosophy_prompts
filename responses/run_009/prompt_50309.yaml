prompt: |-
  I chair the technical committee drafting a national standard for auditing automated decision systems, and we have a problem upstream of every specific metric: we argue about whether an audit should demand demographic parity or error-rate balance before anyone has written down what a fairness criterion has to achieve for the audit to be worth anything. So write me the desiderata — the requirements any adequate criterion of algorithmic fairness must meet — with the concrete case motivating each. At minimum, the list has to confront: differing base rates of the outcome across groups, and what follows from the impossibility results showing that calibration within groups and balanced error rates across groups cannot hold together unless base rates are equal or predictions are perfect; proxies for protected attributes, since a criterion satisfied by blinding a model to race can still be violated through a zip code; the difference between judging a score and judging a threshold imposed on it; subgroups beyond those named in the statute, since a classifier can look fair on every audited group and fail badly on a group no one listed; ranking and top-k selection, where criteria formulated for binary decisions may not transfer; and the question of which worldly disparities the criterion is supposed to correct rather than merely avoid amplifying. For each requirement, say whether it is non-negotiable or a preference of a particular camp, and flag which requirements you suspect cannot be jointly satisfied — that trade-off structure is the part I most need, because if the impossibility results force a choice, the choice effectively is the standard. Then, briefly, run demographic parity, equalized odds, calibration-based criteria, and counterfactual criteria against the list; I care far more about the criteria than the scorecard. Lead with the bottom line: your first sentence should name the requirement you would refuse to trade away and identify the subset of desiderata that is jointly unsatisfiable, and only then give the reasoning. No preamble, and do not restate my question back to me.
reasoning: |-
  We are seeking a set of desiderata for a fairness criterion to be used in auditing automated decision systems. The bottom line is that the requirement I would refuse to trade away is **Non-Discrimination via Proxy Resistance** (because even without explicit protected attributes, proxies can perpetuate discrimination) and the subset of desiderata that is jointly unsatisfiable includes **Base Rate Insensitivity** (requiring the criterion to hold regardless of base rate differences) and **Simultaneous Error Rate Balance and Calibration** (due to the known impossibility results).

  Now, the desiderata:

  1. **Base Rate Insensitivity (Non-negotiable for some, but impossible to hold with others)**: 
     - *Requirement*: The criterion should not require base rates to be equal across groups. 
     - *Concrete case*: In credit scoring, the true default rate may be higher in a historically disadvantaged group due to structural factors. A criterion that requires equal base rates would force the model to ignore this, leading to unfairness in the opposite direction (e.g., over-lending to a group that cannot afford it). 
     - *Trade-off*: This requirement conflicts with the desire to have both error rate balance and calibration (see below). The impossibility result (Kleinberg, Mullainathan, Chouldechova) shows that without equal base rates or perfect prediction, we cannot have both.

  2. **Proxy Resistance (Non-negotiable)**:
     - *Requirement*: The criterion must be robust to the use of proxies for protected attributes. 
     - *Concrete case*: In hiring, if race is not used but zip code (as a proxy for race) is, and the criterion (e.g., demographic parity) is satisfied by using zip code, it might still lead to racial disparities. 
     - *Why non-negotiable*: If the audit criterion can be gamed by proxies, it fails to prevent discrimination.

  3. **Threshold Awareness (Preference of a particular camp)**:
     - *Requirement*: The criterion should account for the fact that the threshold chosen for a score (e.g., a credit score) can be adjusted independently of the score's distribution.
     - *Concrete case*: A score might be well-calibrated (so the score reflects the true probability) but the threshold for loan approval might be set differently for different groups, leading to disparities in approval rates. 
     - *Note*: This is a preference because some criteria (like calibration) focus on the score, while others (like demographic parity) focus on the threshold decision.

  4. **Subgroup Robustness (Non-negotiable)**:
     - *Requirement*: The criterion should hold not only for the groups explicitly protected by law but also for any subgroup (especially intersections) that might be affected.
     - *Concrete case*: An algorithm for medical diagnosis might perform fairly on men and women separately but fail for women of a specific age group. 
     - *Why non-negotiable*: The law often requires non-discrimination beyond the named groups (e.g., the intersection of race and gender).

  5. **Ranking and Top-k Compatibility (Preference of a particular camp)**:
     - *Requirement*: The criterion should extend to ranking and top-k selection settings, not just binary classification.
     - *Concrete case*: In college admissions, if we are selecting the top 100 applicants, criteria like demographic parity (which might require a fixed fraction from each group) might not be appropriate if the groups have different distributions of qualifications. 
     - *Note*: This is a preference because not all audits involve ranking.

  6. **Worldly Disparity Correction vs. Non-Amplification (Preference of a particular camp)**:
     - *Requirement*: The criterion should clarify whether it aims to correct existing worldly disparities (e.g., by setting a target of equal outcomes) or merely avoid amplifying existing disparities.
     - *Concrete case*: In hiring, if a group is underrepresented due to past discrimination, should the algorithm aim for proportional representation (correcting) or just ensure that the algorithm does not make the underrepresentation worse (non-amplification)?
     - *Note*: This is a preference because it depends on societal goals.

  7. **Simultaneous Error Rate Balance and Calibration (Non-negotiable for some, but impossible without base rate equality)**:
     - *Requirement*: Ideally, we want both (a) error rates (false positive and false negative) to be equal across groups and (b) the model to be calibrated within each group (i.e., among individuals assigned a score of s, the same proportion should have the positive outcome, regardless of group). 
     - *Concrete case*: In criminal risk assessment, we want the model to be equally accurate (error rates) and for the risk scores to mean the same thing (calibration) across races. 
     - *Trade-off*: This is impossible unless base rates are equal or the model is perfect. Therefore, we must choose one or the other.

  Now, the known impossibility: 
  - **Impossibility Result**: We cannot have both calibration within groups and balance of the false positive and false negative rates across groups if the base rates differ and the predictor is imperfect. This forces a trade-off.

  Now, evaluating existing criteria against the desiderata:

  - **Demographic Parity** (also called statistical parity): Requires the decision rate (e.g., loan approval) to be the same across groups.
    - Base Rate Insensitivity: Violates because it ignores base rates. If base rates differ, forcing equal decision rates might require giving loans to riskier applicants in one group.
    - Proxy Resistance: Not resistant. Proxies can be used to achieve equal decision rates without addressing underlying disparities.
    - Threshold Awareness: It is about the threshold decision, not the score.
    - Subgroup Robustness: Does not extend naturally to subgroups (e.g., intersections) because it is defined for pre-defined groups.
    - Ranking: Not directly applicable to ranking without adaptation (e.g., requiring equal representation in the top-k).
    - Worldly Disparity: Aims to correct disparities by enforcing equal outcomes, which might be seen as corrective.

  - **Equalized Odds** (also called error rate balance): Requires equal false positive and false negative rates across groups.
    - Base Rate Insensitivity: Does not require base rates to be equal, but if base rates differ, it forces the predictor to be less accurate in the group with the lower base rate (to achieve equal error rates). 
    - Proxy Resistance: Resistant if the protected attribute is used (or if proxies are controlled for) because it conditions on the true outcome. But if proxies are used without the protected attribute, it might still be violated.
    - Threshold Awareness: It is about the error rates, which are threshold-dependent. So it is threshold-aware.
    - Subgroup Robustness: Typically defined for pre-defined groups, not subgroups.
    - Ranking: Not directly applicable to ranking.
    - Worldly Disparity: Avoids amplifying by ensuring similar errors, but does not correct existing disparities.

  - **Calibration-based criteria** (e.g., calibration within groups): Requires that for any score value, the proportion of positive outcomes is the same as the score and equal across groups.
    - Base Rate Insensitivity: Does not require base rates to be equal. However, if base rates differ, calibration can hold but error rates will differ (by the base rate difference). 
    - Proxy Resistance: Resistant because it conditions on the score. Proxies might affect the score, but if the score is well-calibrated, then the outcome is independent of group given the score.
    - Threshold Awareness: It is about the score, not the threshold. However, if the score is calibrated, then setting the same threshold for everyone would lead to decisions that are fair in the sense of equal risk at the threshold.
    - Subgroup Robustness: Not robust to subgroups because calibration for pre-defined groups does not imply calibration for every subgroup.
    - Ranking: Well-calibrated scores are good for ranking because the scores reflect true probabilities.
    - Worldly Disparity: Avoids amplifying by ensuring the score reflects true risk, but does not correct for base rate differences.

  - **Counterfactual criteria** (e.g., individual fairness, counterfactual fairness): Require that similar individuals are treated similarly, or that the decision would be the same in a counterfactual world where a protected attribute changed.
    - Base Rate Insensitivity: Does not directly depend on base rates.
    - Proxy Resistance: Resistant because it looks at individual-level attributes and counterfactuals. Proxies that are not causally related to the outcome might be ignored.
    - Threshold Awareness: Depends on the definition (could be about the score or the decision).
    - Subgroup Robustness: By focusing on individuals, it can in principle cover any subgroup. However, defining similarity is challenging.
    - Ranking: Can be extended by requiring similar individuals to have similar ranks.
    - Worldly Disparity: Aims to avoid discrimination at the individual level, but does not necessarily correct group-level disparities.

  **Summary of Trade-offs**:
  The key trade-off is between **error rate balance** and **calibration** when base rates differ. We must choose one. Additionally, **demographic parity** requires ignoring base rates and may lead to other forms of unfairness. **Proxy resistance** and **subgroup robustness** are non-negotiable and must be addressed by any criterion. 

  Therefore, the standard must explicitly choose between:
  - (A) Focusing on error rates (equalized odds) and accepting that calibration will not hold when base rates differ, or 
  - (B) Focusing on calibration and accepting that error rates will differ by the base rate difference.

  Given the importance of having scores that are meaningful (calibration) for risk-based decisions (like lending or criminal risk), and the fact that error rate balance might lead to unfairness in the allocation of errors when base rates differ, I lean towards **calibration** as the primary criterion. However, this must be combined with a requirement for **threshold fairness** (e.g., not setting different thresholds for different groups without justification) and **subgroup robustness** (via techniques like multicalibration or by requiring audits on key subgroups).

  Finally, note that no single criterion meets all desiderata. The audit standard must therefore be clear about the chosen trade-offs and require documentation of base rates and error rate disparities even if the primary criterion is calibration.
answer: |-
  ### Bottom Line
  The non-negotiable requirement is **Proxy Resistance**, and the jointly unsatisfiable desiderata are **Base Rate Insensitivity**, **Simultaneous Error Rate Balance**, and **Calibration**—mirroring the impossibility theorem that these cannot all hold unless base rates are equal or predictions are perfect.

  ---

  ### Desiderata for Algorithmic Fairness Criteria
  1. **Base Rate Insensitivity**  
     *Requirement*: The criterion must not assume equal base rates (prevalence) of outcomes across groups.  
     *Concrete case*: In loan defaults, Group A has a 5% historical default rate; Group B has 20%. A criterion demanding equal approval rates (demographic parity) would force identical lending rates despite different risks, harming lenders (Group A) or borrowers (Group B).  
     *Status*: **Non-negotiable**. Ignoring base rates amplifies real-world disparities.  
     *Trade-off*: Conflicts with simultaneous error-rate balance and calibration (see Impossibility below).

  2. **Proxy Resistance**  
     *Requirement*: Fairness must hold even when protected attributes (e.g., race) are inferred via proxies (e.g., zip code).  
     *Concrete case*: A model blind to race but using zip code (correlated with race) denies loans to Black-majority neighborhoods. Demographic parity may "pass" if proxy-adjusted approval rates match, but discrimination persists.  
     *Status*: **Non-negotiable**. Audits failing here enable covert discrimination.

  3. **Threshold Awareness**  
     *Requirement*: Criteria must distinguish between fairness of the score (e.g., risk probability) and the thresholded decision (e.g., loan approval).  
     *Concrete case*: A well-calibrated cancer risk score (reflecting true probabilities) may still yield racially biased approvals if thresholds differ across groups.  
     *Status*: **Non-negotiable for threshold-dependent decisions** (e.g., lending), but negotiable for score-based systems (e.g., risk assessment).

  4. **Subgroup Robustness**  
     *Requirement*: Fairness must extend to subgroups beyond statutory protected classes (e.g., intersectional groups like Black women).  
     *Concrete case*: An hiring algorithm appears fair for "men" and "women" overall but rejects 90% of women over 50. Audits limited to broad groups miss this.  
     *Status*: **Non-negotiable**. Statutory groups are insufficient for real-world fairness.

  5. **Ranking/Top-k Compatibility**  
     *Requirement*: Criteria must adapt to ranking (e.g., college admissions) where binary fairness metrics fail.  
     *Concrete case*: Demographic parity demands 50% women in top 100 hires, but if women are 30% of qualified candidates, this forces unqualified selections.  
     *Status*: **Preference** (essential for ranking contexts, irrelevant for binary decisions).

  6. **Worldly Disparity Correction vs. Non-Amplification**  
     *Requirement*: The criterion must clarify whether it *corrects* existing disparities (e.g., equal outcomes) or merely *avoids amplifying* them (e.g., error-rate balance).  
     *Concrete case*: In hiring, correcting historical underrepresentation of women requires proactive equality of outcomes; non-amplification only ensures the algorithm doesn’t worsen the gap.  
     *Status*: **Preference** (societal values dictate this choice).

  ---

  ### Impossibility-Driven Trade-offs
  - **Key Conflict**: **Base Rate Insensitivity**, **Simultaneous Error Rate Balance** (e.g., equal false positives/negatives), and **Calibration** (scores match actual probabilities per group) **cannot jointly hold** unless base rates are equal or predictions perfect.  
    *Example*:  
    - Group A: 10% loan default rate (base rate).  
    - Group B: 20% default rate.  
    - To achieve *error-rate balance*, the model must mispredict at equal rates for both groups. But if scores are *calibrated*, scores for Group B will reflect higher risk, leading to more false negatives (denied loans) for qualified Group B applicants.  
    *Trade-off structure*:  
    - Choose **error-rate balance** (e.g., equalized odds) to ensure equitable mistakes, but sacrifice calibration (scores become unreliable).  
    - Choose **calibration** (e.g., predictive parity) to ensure scores are meaningful, but accept skewed error rates (higher false negatives for high-risk groups).  
    - **Demographic parity** ignores both, forcing equal outcomes regardless of base rates (often unjust).

  ---

  ### Evaluation of Fairness Criteria
  - **Demographic Parity** (equal selection rates):  
    - Fails: Base Rate Insensitivity (ignores risk differences), Proxy Resistance (proxies can engineer equality without fairness), Threshold Awareness (only measures decisions, not scores).  
    - Use case: Only if correcting worldly disparities is the goal (e.g., diversity mandates).

  - **Equalized Odds** (error-rate balance):  
    - Satisfies: Base Rate Insensitivity (works with differing base rates), Proxy Resistance (if proxies are controlled), Threshold Awareness.  
    - Fails: Calibration (impossible with unequal base rates), Ranking (not designed for top-k).  
    - Use case: Criminal justice, where equitable errors are prioritized (e.g., equal false convictions).

  - **Calibration-Based Criteria** (e.g., predictive parity):  
    - Satisfies: Base Rate Insensitivity, Proxy Resistance (calibration neutralizes proxy bias if properly conditioned).  
    - Fails: Simultaneous error-rate balance (see impossibility), Subgroup Robustness (calibration on broad groups ≠ subgroup calibration).  
    - Use case: Lending/insurance, where accurate risk assessment is critical.

  - **Counterfactual Criteria** (e.g., counterfactual fairness):  
    - Satisfies: Proxy Resistance (handles latent discrimination), Subgroup Robustness (individual-level fairness).  
    - Fails: Feasibility (requires untestable causal assumptions), Threshold/Ranking (implementation unclear).  
    - Use case: High-stakes decisions with clear causal models (e.g., medical diagnoses).

  ---

  ### Recommendations for Standard
  1. **Mandate Proxy Resistance and Subgroup Robustness**—non-negotiable to prevent evasion and intersectional harm.  
  2. **Acknowledge the impossibility trade-off**:  
     - For **decisions requiring accuracy** (e.g., credit scoring), prioritize calibration.  
     - For **decisions requiring equitable treatment** (e.g., hiring), prioritize error-rate balance.  
  3. **Reject demographic parity** unless explicitly correcting worldly disparities (state this as a policy choice, not technical).  
  4. **Require documentation of base rates** in audits to contextualize fairness trade-offs.  
  5. **For ranking**, use criteria like proportional representation in top-k or merit-weighted parity.  

  The choice between calibration and error-rate balance defines the standard’s philosophy: accuracy-first versus equity-first.
