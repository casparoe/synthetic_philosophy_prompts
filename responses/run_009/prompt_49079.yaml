  Okay, let me start by unpacking the user's problem. They've been in an ethics reading group for a year, focusing on expressivism and the Frege-Geach problem. The group understands the original challenge—how unasserted contexts in conditionals pose a problem for expressivists. They've covered sophisticated responses from Blackburn, Gibbard, and Schroeder, which technically solve the inference issues. But now they're stuck because the anti-expressivists argue that these solutions are just reverse-engineered and don't genuinely explain semantics. The expressivists counter that all semantics is fitted to usage, so demanding more from them is biased. The user suspects the real disagreement is about what semantics is for and the belief/desire taxonomy.

  First, I need to validate their working hypothesis. They think the debate isn't about compositionality itself but deeper issues: the purpose of semantic theory and the nature of normative judgment. They want to know if this is accurate and where progress can be made. 

  Looking at the expressivist solutions, it's true that Blackburn's higher-order attitudes or Gibbard's plans are designed to mirror logical structures. The anti-expressivists call this "bookkeeping," which makes sense. But the expressivists have a point that even realist semantics is tailored to linguistic behavior. The key here is whether the expressivist can provide independent motivations for their semantic clauses beyond just preserving inferences.

  The user mentions that both sides agree on inferences but not on whether expressivism provides real semantics. That's crucial. It suggests the conflict is meta-semantic—about what counts as a semantic explanation. For expressivists, semantics is about inferential roles; for realists, it's about truth-conditions grounded in reality. 

  Then there's the deeper issue of the belief/desire dichotomy. Expressivism relies on seeing normative judgments as non-cognitive states. If that taxonomy is flawed, the whole project might be misguided. But that's a separate, substantive debate about moral psychology.

  So, the user's hypothesis seems spot on. The surface-level compositionality debate masks these deeper divides. Progress might require shifting focus to meta-semantics or the belief/desire question. Forcing a test case that distinguishes the approaches could help, but it's tricky. Maybe discussing new areas like embeddings in epistemic modals or expressive force in other contexts. Alternatively, clarifying what makes a semantic clause ad hoc—like independent psychological evidence for attitude ascriptions.

  But the structural impasse might persist because the core issues are philosophical, not technical. The best path is to redirect the debate to naturalism and moral psychology, where the real disagreement lies. The user’s group needs to acknowledge they're debating different questions under the same heading. Making this explicit could prevent talking past each other and refocus the discussion on the underlying substantive issues.
answer: |-
  Your diagnosis is incisive and largely correct. The impasse *isn't* primarily about compositional mechanics or even the Frege-Geach problem itself, but about **competing conceptions of what semantic explanation requires** and, deeper still, **the nature of normative judgment**. Here's the breakdown with reasons and implications:

  ### 1. **The Core Conflict is Meta-Semantic (What is Semantics *For*?)**
     - **Expressivist Stance:** Semantics is fundamentally about characterizing the *inferential role* and *expressive function* of sentences within a practice. Success means systematically capturing valid inferences and the mental states conventionally expressed. Blackburn's "logic of attitudes," Gibbard's plan-laden worlds, or Schroeder's "being for" are *explanatory* because they show how complex sentences inherit their roles from simpler ones *without* smuggling in realist truth-conditions. For them, inferential role *is* the explanandum *and* the explanans.
     - **Anti-Expressivist Stance (Cognitivist/Realist):** Semantics must explain *why* the inferences hold by grounding them in *truth-conditional content* – content that exists independently of our attitudes and explains our inferential commitments. Reverse-engineering attitudes to fit inferences is "bookkeeping" because it doesn't provide this *grounding*; it merely redescribes the patterns. The realist claims their truth-conditions *explain* the inferences, while expressivist attitudes merely *track* them.

     ***Why this matters:*** The anti-expressivist objection ("shell game") isn't that the expressivist machinery fails to validate inferences; it's that validation alone isn't *explanation*. They demand a *reason* why these specific attitude combinations (and not others) govern the logic. The expressivist retort ("every semantics is fitted to usage") highlights that realists also tailor truth-conditions to usage – but the realist sees truth-conditions as *world-involving*, providing the missing *ground*.

  ### 2. **The Deeper Divorce: Belief/Desire & the Nature of Normative Judgment**
     - **Expressivist Commitment:** Normative judgments (e.g., "lying is wrong") are *constitutively non-cognitive* – they express conative states (disapproval, plans, commitments), fundamentally different from beliefs representing states of affairs. Any compositional semantics *must* respect this core psychological taxonomy. If the solution implies normative judgments are just ordinary beliefs (e.g., by positing too many "attitudes" indistinguishable from beliefs), expressivism collapses.
     - **Anti-Expressivist Commitment:** Normative judgments *are* cognitive – they express beliefs about objective (or mind-independent) normative facts. The "belief/desire" distinction doesn't carve normative judgment at its joints; it's a category mistake to treat "wrong" as expressing a desire-like state. The elaborate compositional machinery is seen as an *ad hoc* effort to preserve a mistaken psychological thesis.

     ***Why this matters:*** The endless cycle of solutions (negation problem, proliferation of attitudes, hybrid worries) stems from trying to *force* normative language into a non-cognitive mold while replicating realist logic. Each "fix" risks either collapsing into cognitivism (losing expressivism's essence) or appearing artificial (fueling the "shell game" charge). The fundamental disagreement is psychological/metaphysical: *What kind of mental state is a normative judgment?* No compositional tweak resolves *this*.

  ### Verdict on Your Diagnosis
  You are **correct**. The debate *is*:
  1.  **Meta-semantic:** A clash about whether semantics explains *inferential role* (expressivism) or *grounds that role in truth-conditions* (cognitivism).
  2.  **Psychological/Metaphysical:** A clash about whether normative judgments are non-cognitive states fundamentally different from beliefs (expressivism) or are cognitive beliefs representing normative reality (cognitivism).

  The compositionality debate is the *battleground*, not the *war*. Both sides "solve" Frege-Geach technically, but disagree on whether the solution constitutes genuine explanation, rooted in their deeper commitments.

  ## Can Progress Be Made? Yes, But Not on the Current Battlefield
  The structural impasse stems from talking past each other on meta-semantics and psychology. Progress requires shifting focus:

  1.  **Confront the Meta-Semantic Question Directly:**
      *   **Demand Explicit Criteria:** What *exactly* would make a compositional clause "explanatory" rather than "merely descriptive"? Is it independent psychological evidence for the posited attitudes? Predictive power for new linguistic phenomena? Integration with a broader theory of mind?
      *   **Test Case: Novel Constructions:** Instead of rehashing modus ponens, examine complex embeddings where expressivist attitude-ascription becomes strained or predicts divergence from realist logic (e.g., normative terms in epistemic modals, attitude reports, or non-declaratives). Can expressivism handle these *without* ad hoc adjustments or collapsing into cognitivism? A *genuinely predictive* success here would challenge the "shell game" charge.
      *   **"Ad Hoc" vs. "Tailored":** A clause is *ad hoc* if its *only* justification is preserving existing inferences *and* it lacks independent motivation (conceptual, psychological, or from broader linguistic patterns). It's "tailored" if it fits a principled, independently motivated theory of the relevant mental states/linguistic functions (e.g., Gibbard's planning theory). The debate needs clear standards for "independent motivation."

  2.  **Shift to the Underlying Psychological/Metaphysical Dispute:**
      *   **This is the "Proxy War" for Naturalism:** Expressivism often thrives with a naturalistic, Humean psychology (belief/desire dichotomy). Cognitivism often aligns with non-naturalism or robust moral realism. *Progress requires engaging here.*
      *   **Key Questions:**
          *   Is there empirical psychological evidence that normative judgments function more like conative states than cognitive beliefs (e.g., in motivation, neural correlates, development)?
          *   Can the "hybrid" nature of many normative terms (descriptive + evaluative) be captured without conceding cognitivism?
          *   Does expressivism offer a *better* explanation of moral disagreement, internalism, or the action-guiding force of morality than sophisticated cognitivism (e.g., with bespoke belief states)?
      *   **Focus on Moral Psychology:** Instead of debating the semantics of "if...then," debate whether Gibbard's "plan-laden" states or Schroeder's "being for" are psychologically plausible *and* distinct from beliefs. This is where expressivism stands or falls.

  **Conclusion & Path Forward:**
  The impasse *is* structural within the current framing. Neither side will concede because they prioritize different explanatory goals (inferential role vs. truth-conditional grounding) and hold incompatible core theses about the mind (non-cognitive vs. cognitive nature of normativity). **Progress requires:**

  1.  **Explicitly acknowledging the meta-semantic divergence** and debating what constitutes adequate semantic explanation. Develop criteria for "non-ad hoc" compositional clauses.
  2.  **Testing expressivism on novel linguistic terrain** beyond textbook conditionals to assess its predictive power and psychological plausibility.
  3.  **Moving the primary debate to the territory of moral psychology and naturalism.** The compositional machinery is a consequence of deeper commitments. Address those commitments directly: *Can normative judgment be understood as a non-cognitive state without distorting its logical and linguistic behavior?* Until this is resolved, the semantics debate will remain a proxy war. Encourage your group to ask: "What psychological facts about moral judgment *constrain* our semantic theory, and does expressivism or cognitivism better respect those facts?" This refocuses the energy where the real disagreement lies.
