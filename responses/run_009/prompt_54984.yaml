         - v(yellow) = 0.3 (indifferent to red, so same CE).
         - v(black) < 0.3 (prefers yellow/red to black, and CE_black < £30).
       - The capacities capture the asymmetry: v(red) ≈ v(yellow) > v(black), with v(red) = 0.3 < 1/3 ≈ 0.333, indicating global undervaluation due to urn ambiguity.
