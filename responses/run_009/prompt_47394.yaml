prompt: |-
  I'm a backend engineer with zero philosophy background, but after a decade of arguments about sprint estimates I've started collecting my gut verdicts on when you should trust "the outside view" (base rates, what happens to projects like this in general) versus your own inside knowledge of the details. Also when you should defer to people with better track records and when you shouldn't. I want to know if there's a principle that captures all of these verdicts or whether I'm just rationalizing whatever I felt like doing at the time.

  1. Big migration estimate. My team, who know the codebase intimately, say 6 weeks. I know from bitter experience that migrations like this take 3-4x the estimate at basically every company I've ever worked at. Verdict: go with ~5 months, outside view wins, no contest.

  2. Debugging a weird production failure. In the abstract I'd say 95% of the time it's in your own code, not the database driver. But last month I spent three days auditing every line of my new module, was genuinely sure it was clean, and it turned out to be a race condition in the driver itself. Verdict: I still think you should assume it's your own code first, but at some point the inside view of "I have actually checked this twice" should beat the base rate. This feels different from case 1 but I can't quite say why.

  3. A few years ago I chose a startup offer over a stable one. Everyone knows the base rate for startup equity going to zero. I took it anyway because I'd worked with the founder before and had a read on the team that no aggregate statistic could capture. Verdict: justified. But this is exactly the move every deluded founder makes when they ignore the base rate, so I'm suspicious of my own comfort here.

  4. Design argument with a much more senior architect. He wants microservices, I want a boring monolith. On paper he crushes me on experience and track record. But I'm the only one who's actually read the current code, and my objection is a concrete trap in one specific module. Verdict: I should push back and not just defer.

  5. Stack Overflow consensus says framework X behaves a certain way. My one-off reproducible test says the opposite. Verdict: trust my test. One reproducible result beats an aggregate of human judgment, even a large aggregate.

  6. A junior dev on my team is certain our alerting pipeline drops events, which the vendor says doesn't happen. "Junior blames the vendor" is basically a meme, the base rate is brutal. Verdict: discount her claim, at least a little, until she shows me logs. But this doesn't sit with #5, where a single repro beats the crowd, or with #4, where being the person who read the code licenses disagreeing with the senior guy.

  So my tentative principle from 2, 4, and 5 is something like: the inside view wins when your evidence is mechanical or verifiable (you ran it, you read the actual source, you can point at the line), and the outside view wins when your evidence is judgment (estimates, hunches, vibes about how long things take). But #3 is trouble for this: my read on the founder is pure judgment, and I still think it was right to let it override a very solid base rate. And #6 is trouble from the other direction, since presumably the junior dev could produce logs eventually too, and I'm still discounting her.

  Questions: is there a principle that gets all six verdicts, or close to it, and if the mechanical-evidence one doesn't survive, what would you replace it with? If it does survive, what do you do with #3 — was taking that job defensible or was I just flattering myself, and if the latter, is everyone who ever joined a startup on the strength of "I know these people" wrong to? What does your principle say about the case I keep going back and forth on: I'm 80% confident I can cut our cloud bill by 30% because I know exactly where the waste is, but my calibration data on my own past 80% confidences says I'm right more like 60% of the time. Should I downgrade myself to 60%, and if I do, haven't I just discarded the very private information that made me confident in the first place? And which of my six verdicts does your principle have to throw out, because I've stared at them for a while and I genuinely don't know which one is the weak link.
reasoning: |-
  Okay, let me try to unpack this backend engineer's dilemma. They've shared six real-world judgment calls about when to trust base rates versus personal insights, and they're wrestling with consistency. 

  First, I notice the core tension: they intuitively distinguish between "mechanical evidence" (testable, verifiable facts) and "judgment evidence" (human estimates, intuitions), but their startup decision (#3) breaks that pattern. That's the knot I need to untangle. 

  Looking at each case:
  - #1 (migration estimate) is classic outside-view dominance: generic historical data trumps team optimism. 
  - #2 (debugging) shows mechanical evidence overriding base rates after initial investigation. 
  - #3 (startup choice) is pure judgment overriding terrible base rates - the anomaly. 
  - #4 (architecture debate) privileges concrete code knowledge over abstract seniority. 
  - #5 (framework behavior) values reproducible tests over crowd wisdom. 
  - #6 (junior's claim) discounts unverified personal assertion despite potential verifiability.

  Hmm. The startup case feels different because it's a high-stakes bet with asymmetric outcomes - if it fails, you lose salary; if it succeeds, you win big. That might justify overriding base rates when you have rare personal insight. 

  The calibration question they added is fascinating. If they downgrade their 80% confidence to 60% because of past miscalibration, they're not discarding private information - they're adjusting for their known optimism bias. The private insight stays, but gets weighted against their track record. 

  For a unified principle, I'm leaning toward: **"Prioritize evidence that resists distortion, but discount unverified claims proportional to their source's error rate."** This handles:
  - #1: Estimates distort easily → outside view wins
  - #2/4/5: Code/tests resist distortion → inside view wins
  - #3: Rare "distortion-resistant" founder insight justifies gamble
  - #6: Junior's unverified claim has high error rate → discount initially

  The junior dev case still nags me though. Maybe the key is requiring verification before weighting the evidence? Like in #5, the test was already run; in #6, it's "I'll believe it when I see logs." 

  For the startup case - was it defensible? Probably yes, but only because their prior work with the founder generated unusually reliable signals (behavior under stress, integrity, etc.). Most "I know these people" claims lack that depth. 

  If I had to discard one verdict, #6 feels least consistent - if the junior produces logs tomorrow, it becomes identical to #5. But the engineer's instinct to discount unverified claims from error-prone sources is smart probabilistic thinking.
answer: |-
  Your intuition about "mechanical vs. judgment evidence" is sharp, but it needs refinement to handle edge cases. Here's a unified principle based on **evidence reliability** and **error sources**, validated against your cases:

  ---

  ### **The Core Principle**
  > **Prioritize the view (inside/outside) whose evidence is least vulnerable to the dominant error source in the context.**  
  > *Where:*  
  > - **Error sources** = cognitive biases (optimism, anchoring), informational gaps, or noise.  
  > - **Evidence reliability** = resistance to distortion (reproducible tests > vibes).  

  ---

  ### **Applying the Principle to Your Cases**
  1. **Big migration estimate**  
     - *Dominant error:* Planning fallacy (optimism bias).  
     - *Outside view's strength:* Historical data ignores team-specific overconfidence.  
     - **Verdict upheld:** Outside view wins.  

  2. **Debugging a production failure**  
     - *Dominant error:* Initial base rate ignores new evidence ("I audited my code").  
     - *Inside view's strength:* Verifiable audit reduces likelihood of self-deception.  
     - **Verdict upheld:** Shift to inside view after verification.  

  3. **Joining a startup**  
     - *Dominant error:* Survivorship bias (founders overvalue their uniqueness).  
     - *Inside view's strength:* **Direct, repeated exposure** to founder/team (e.g., past work under stress) resists generic base rates.  
     - **Verdict upheld:** Justified if evidence is high-signal (e.g., "I saw them navigate a crisis") vs. low-signal ("they seem smart").  

  4. **Design argument with senior architect**  
     - *Dominant error:* Authority bias (deferring to seniority despite concrete evidence).  
     - *Inside view's strength:* Code-specific trap is verifiable; senior’s experience is generic.  
     - **Verdict upheld:** Inside view wins.  

  5. **Framework behavior test**  
     - *Dominant error:* Crowd consensus ≠ truth (Stack Overflow can be wrong).  
     - *Inside view's strength:* Reproducible test is falsifiable; consensus is anecdotal.  
     - **Verdict upheld:** Inside view wins.  

  6. **Junior dev’s vendor claim**  
     - *Dominant error:* Junior’s inexperience → higher chance of misdiagnosis.  
     - *Inside view's weakness:* Claim is **unverified** ("show me logs").  
     - **Verdict upheld:** Outside view (base rate) wins *until verification*.  
     - *Contrast with #5:* Your test was already run; junior’s evidence is pending.  

  ---

  ### **Resolving Your Lingering Questions**
  - **Your cloud bill optimization (80% → 60%?):**  
    Downgrade to **68%**, not 60%. Use Bayesian adjustment: Your 80% confidence is "private evidence," but your 60% track record is a "reliability prior." Weight them:  
    `(0.8 * 0.6) / [(0.8 * 0.6) + (0.2 * 0.4)] ≈ 68%`  
    *You’re not discarding private info—you’re tempering it with meta-awareness.*

  - **Was joining the startup defensible?**  
    Yes, **if** your insider knowledge was high-reliability (e.g., "I’ve seen this founder execute before" vs. "I like their pitch"). Base rates apply to averages—outliers exist when you have privileged data. Most founders fail because they lack *your* specific evidence.

  - **Weakest verdict?**  
    **#6 is the most contentious**—but correct. The key is verification latency. If the junior had logs upfront, it would mirror #5. Until then, base rates apply. *This is consistent: unverified claims lose to verified data.*

  ---

  ### **Why This Works**
  - **Handles #3:** "Judgment evidence" can override base rates **if** it’s low-noise (e.g., deep personal experience).  
  - **Clarifies evidence hierarchy:**  
    ```  
    Reproducible tests > Direct audits > Track records > Base rates > Unverified claims  
    ```  
  - **Guards against self-deception:** Forces explicit evaluation of error sources (e.g., "Is my founder confidence based on signal or ego?").

  ### **Practical Takeaways**
  1. **Verify fast** in #6-like cases to resolve base-rate disputes.  
  2. In judgments (#3), ask: *"Could an observer with my knowledge reasonably disagree?"* If yes, discount.  
  3. Calibrate confidence mathematically (like the cloud-bill example).  

  This principle rejects none of your verdicts—it systematizes them. Your "mechanical evidence" instinct was directionally right but needed nuance around verification and error-source dominance.
