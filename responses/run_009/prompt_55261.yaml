      We'll write in detail.

    Debrief questions:

      - Phase 1: 
          - Drivers: Why did you decide to skip or pick? What did you expect the hitchhiker to do?
          - Hitchhikers: If you were picked, why did you pay or not? If you weren't picked, how did that feel?
          - What was the outcome for the group? Did anyone get a good outcome without commitment?

      - Phase 2:
          - How did the commitment option change the driver's behavior?
          - Hitchhikers: Why did you sign or not sign? How did that affect your chance of being picked?
          - Did the commitment lead to better outcomes for drivers and hitchhikers? For whom?

      - Phase 3:
          - How did the driver use the history of payments?
          - Hitchhikers: Did you change your behavior over time? Why?
          - Did reputation emerge as a substitute for commitment?

      - Then: 
          - "In phase 1, the hitchhiker who was picked and didn't pay got the best individual outcome (14 chips). But if that happens, what does the driver learn? How does that affect future rounds? And in the one-shot, if we only play once, is there a way for the hitchhiker to convince the driver they will pay? Without commitment or reputation, is there a way?"
          - "Now, think about the idea that sometimes it might be rational to have a disposition to act in a way that seems irrational in the moment. In the repeated game, if you are the type who always pays, you might get picked more often. But in the one-shot without commitment, how can you be that type? Can you choose to be the kind of person who pays even when it's costly? And if you can, then you might be more likely to be rescued in the first place?"

      - Finally, reveal that this is Parfit's hitchhiker and explain the connection.

    Failure modes:

      - Time: Each phase might run over. Solution: keep a timer.

      - In phase 3, the groups might not have time to do 3 rounds? We allocated 3 min per round? It might be tight. We can have:

          Round 1: 3 min
          Round 2: 2 min (because they know the drill)
          Round 3: 2 min

          Total 7 min.

      - The loud student: if they start arguing about free will during the game, we can say: "That's an important point! Let's see how the game plays out and then we'll discuss in debrief." Then in debrief, we can address it:

          Question: "To what extent do you think the hitchhiker's decision to pay (in phase 1) was a free choice? And to what extent was it determined by their disposition or past experiences? And how does that relate to the driver's ability to predict?"

