  **Key Design Notes:**

  1. **Real Stakes Integration:**  
     - Chips convert to tangible rewards (snack priority, quiz points, topic choice)  
     - Small denominations ensure meaningful marginal decisions  
     - Anti-frivolity contract fee prevents promise spamming  

  2. **Disposition Reading Mechanics:**  
     - Phase 1: Pure information vacuum (baseline failure)  
     - Phase 2: Layered signals (non-binding promises + binding contracts)  
     - Phase 3: Emergent reputation from historical actions  

  3. **Theoretical Coverage:**  
     - Sharp payoff structure: Rescue costs Driver (2), payment costs Traveler (3), creating clear conflict  
     - Binding contracts simulate precommitment solutions  
     - Reputation shows evolutionary stability of cooperation  

  4. **Free Will Management:**  
     - Built-in documentation step ("record your reasoning")  
     - Dedicated debrief question about choice vs. determination  
     - Reframes debate as empirical observation of decision processes  

  5. **Practical Adjustments for 80min:**  
     - Observer role ensures full participation during rotations  
     - Strict phase timers with fallback options  
     - Group size flexibility (3-4 per group) accommodates 11 players  

  **Running Tips:**  
  - Start Phase 1 immediately to create frustration ("I had no information!")  
  - In Phase 2, physically enforce contract compliance  
  - During Reputation Rounds, publicly track payment history on boards  
  - For debrief, contrast Phase 1 (theoretical failure) with Phases 2-3 (working solutions)  

  The game creates visceral understanding of why dispositions matter: Travelers who can credibly commit to "irrational" payment get rescued more often, while "rational" non-payers get abandoned. The commitment and reputation mechanisms show practical resolutions to the dilemma.
