  But note: (5) says the special science laws are on a par with the fundamental ones? Or at least the same kind of thing. So if we have multiple best systems, then we have multiple sets of laws. That might be acceptable.

  Now, what about (4)? There is a known problem for Humean chances: the undermining problem. That is, there might be a future that is inconsistent with the current chance assignment but is compatible with the mosaic up to now. Then the chance assignment (as part of the best system) might be false because the future might go in a way that makes the pattern different. Lewis responded by saying that the chance assignment is true as long as the entire history (including future) has the pattern that makes the best system true. But that leads to a contradiction because the chance assignment might be undermined by a future that is unlikely but possible. Lewis had to modify his view: chances are defined by the best system for the entire history, and we don't know the future, so we use current chances. But the problem is metaphysical. This is a serious issue.

  So the tension for (4) is with the whole Humean framework. The severity is serious, but not a dealbreaker because there are responses (like Lewis's later theory).

  But in our list, we don't have an explicit commitment about how chances work in detail. So maybe we can set it aside.

  However, note (4) says "objective single-case chances". The undermining problem challenges the objectivity of chances in a Humean framework. So it might be a serious tension.

  But for the sake of this exercise, let's focus on the more obvious tension with (5).

  Now, the single revision that would clean up the most: Revise (2) to allow for multiple best systems for different domains. Why? Because it directly addresses the tension with (5). It would allow special science laws to be the theorems of the best system for their domain. This revision might also help with (4) if we think of chances in a special science (e.g., in psychology) as being part of the best system for that domain? But (4) seems to be about fundamental chances. So not directly.

  But note: (5) includes economics and psychology, which might have their own chances. So the multiple best systems revision would help there too.

