prompt: |-
  I've settled on halferism about Sleeping Beauty -- I think Beauty should stick with 1/3 after waking... no wait, sorry, I mean 1/2: her credence in Heads on Monday morning shouldn't change from the coin's initial chance just because she knew all along she'd have an awakening either way. The obvious stuff people throw at halfers (the repeated betting argument, Elga's symmetry reasoning) I mostly know how to parry -- there's usually a disagreement about whether Beauty is even a single agent over time or two episodic ones, and the halfer can say the betting setup just double-counts the two awakenings. But I want a real map of where the view is exposed, not the standard back-and-forth. What would genuinely count against halferism? I'm thinking things like: the anthropic consequences (does halferism force weird answers in Doomsday-type orpresumptuous philosopher cases, and are those answers ones a halfer would actually accept?), whether the Lewis-style conditioning story about updating on "today is Monday or Tuesday" is coherent, and whether there's some dutch book or long-run frequency argument that doesn't beg the question the way the naive ones do. Sort the defeaters by how much they should move me, tell me which ones committed halfers themselves concede vs. dismiss, and be honest about whether the position has been qualified into something unfalsifiable -- and if it has, whether that's a fatal flaw or just what you get in self-locating belief where there's no fact of the matter to be wrong about.
