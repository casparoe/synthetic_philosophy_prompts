prompt: |-
  EU law contains a principle of subsidiarity: in areas of shared competence, the Union may act only where the member states cannot sufficiently achieve the objectives themselves, or where those objectives can better be pursued at Union level given the scale or effects of the action. Enforcement of this principle is largely outsourced to national parliaments: each chamber of a national parliament may send a reasoned opinion objecting that a draft EU law violates subsidiarity, and if at least a third of all chamber-votes across the Union accumulate, the European Commission must review the proposal and justify, amend, or withdraw it. (The Court of Justice can in principle review subsidiarity breaches too, but has essentially never struck a measure down on that ground.) Notice how odd the allocation of guardian roles is: subsidiarity is usually described as protecting member-state autonomy, yet the designated watchdog is the national parliament — an actor the principle never otherwise mentions — rather than the national government that sits in the Council of the EU, or the constituent units' own populations, as in Switzerland, where constitutional amendments require a majority both of voters and of cantons. What theory of political authority does this arrangement presuppose? Does it treat subsidiarity as a comparative-competence principle — an efficiency claim about where scale and effects make action more effective — or as a claim about legitimacy, that decisions belong as close as possible to the demos affected? And why would parliaments, of all actors, be the right custodians of that claim: what view of representation does assigning them the watchdog role presuppose, and is that view consistent with the fact that the same treaties give the ultimate judicial say to a Union-level court? Reconstruct the implicit theory, distinguish what the arrangement strictly requires from what it merely fits well with, and identify where it is underdetermined enough that a different underlying theory would leave the practice standing. Please keep your answer to one page, at most 500 words.
reasoning: |-
  Hmm, the user is asking about the EU's subsidiarity principle and its enforcement mechanism. This is a deep political theory question about why national parliaments, rather than national governments or populations, are designated as the watchdogs for subsidiarity violations.

  The user wants to understand the implicit theory of political authority behind this arrangement. They're pointing out an apparent contradiction: subsidiarity protects member-state autonomy, yet the guardians aren't the governments representing states in the Council, but the parliaments. The user also asks whether subsidiarity is fundamentally about efficiency (comparative competence) or legitimacy (closeness to the demos), and why parliaments specifically are chosen as custodians.

  The EU treaties establish national parliaments as subsidiarity watchdogs through the "yellow card" mechanism. This is unusual because governments represent member states in EU decision-making bodies. The Court of Justice has essentially never struck down legislation on subsidiarity grounds, making this parliamentary review the primary enforcement tool.

  The arrangement seems to presuppose a dual theory: subsidiarity as both competence allocation (efficiency) and legitimacy (democratic proximity). By giving parliaments this role, the EU is making a statement about representation - that parliaments are the true embodiments of national sovereignty and democratic legitimacy. This distinguishes them from executives who engage in EU negotiations where logrolling might occur.

  This setup implies a "parliamentary sovereignty" view where legislatures are the authoritative voice of the national demos. The subsidiarity review becomes an ex-ante democratic check before the Court's ex-post judicial review. There's an interesting tension here since the Court gets the final say despite parliaments being positioned as the primary guardians of national democratic legitimacy.

  The arrangement is underdetermined in several ways. It doesn't specify whether parliaments should focus on efficiency or democratic legitimacy concerns. It doesn't clarify if they represent state autonomy or their populations' preferences. And it doesn't resolve potential conflicts between parliamentary opinions and judicial interpretations.

  A different underlying theory could still fit this practice. For example, if we viewed parliaments merely as functional reviewers of policy efficiency, or if we saw subsidiarity purely as a competence boundary rather than a democratic principle, the mechanics would still work. The current design leaves room for multiple interpretations of what exactly parliaments are guarding and why they're appropriate guardians.
answer: |-
  The EU's subsidiarity enforcement mechanism reveals a distinctive, albeit underdetermined, theory of political authority that blends competence-based efficiency with parliamentary legitimacy, while strategically bypassing executives.

  **Implicit Theory:**
  1.  **Subsidiarity's Dual Nature:** The arrangement treats subsidiarity as *both* a principle of **comparative competence/efficiency** (where action is most effective given scale/effects) *and* a principle of **democratic legitimacy** (decisions should be proximate to the affected demos). The trigger focuses on whether member states *can* achieve the objective sufficiently (competence/efficiency), yet the guardian is the parliament, the primary *democratic* institution at the national level. It presupposes that legitimacy inherently suffers when decisions are taken unnecessarily far from citizens, even if technically efficient elsewhere.
  2.  **Parliament as Sovereign Representative:** Assigning the watchdog role to national parliaments presupposes a **parliamentary sovereignty model** where the legislature is the ultimate embodiment of national democratic authority and constituent power. It views parliaments, not governments (executives), as the authentic custodians of national autonomy and the "demos" within the member state. This distinguishes the EU sharply from Swiss-style direct democracy (popular/cantonal votes) or intergovernmentalism (Council as guardian).
  3.  **Distrust of Executives & Council Dynamics:** Outsourcing to parliaments reflects a deliberate **distrust of national governments** acting within the Council. Governments are seen as potentially compromised by EU-level bargaining, log-rolling, or executive drift, making them unreliable defenders of subsidiarity *against* the Union. Parliaments, less entangled in EU negotiations, are positioned as more independent scrutineers of the *principle* itself.
  4.  **Judicial Review as Backstop, Not Primary:** The Court of Justice's (CJEU) minimal role confirms that subsidiarity enforcement is primarily conceived as a *political*, pre-legislative check, not a judicial one. The CJEU's ultimate authority presupposes that subsidiarity, like other Treaty principles, requires a Union-level arbiter for legal certainty and uniformity, but that *identifying* violations is best done politically by the national level's core democratic institution.

  **What it Strictly Requires vs. What it Fits:**
  *   **Requires:** National parliaments are the designated *political* actors for triggering a subsidiarity review based on reasoned objections concerning the insufficiency of national action or the benefits of Union-scale action. It requires viewing parliaments as legitimate voices of national-level concerns vis-à-vis the EU.
  *   **Fits Well With:** The view that parliaments are the supreme democratic representatives of the national demos and the primary defenders of national autonomy against centralization. It fits a competence-based understanding *filtered through* a parliamentary legitimacy lens. It also fits the idea that executives cannot be trusted with this specific gatekeeping role.

  **Underdetermined Aspects (Where Practice Could Fit Different Theories):**
  1.  **Priority of Efficiency vs. Legitimacy:** The arrangement doesn't dictate whether parliaments *should* prioritize arguments about policy effectiveness or democratic legitimacy in their "reasoned opinions." Practice could lean either way.
  2.  **Parliament Representing "State" or "People":** Is the parliament acting as the agent of the *member state* as a polity or of the *national population* as the demos? The mechanism works under either interpretation.
  3.  **Nature of Parliamentary Mandate:** Does the role presuppose parliaments acting as technical assessors of competence or as tribunes of popular sovereignty? The procedural design (reasoned opinions) allows both.
  4.  **Judicial Deference:** The CJEU's passivity is practice, not strict requirement. A different theory (e.g., stronger legal constitutionalism) could see the Court taking a more active subsidiarity role without altering the parliamentary mechanism itself. The *potential* for judicial review remains.

  **Conclusion:**
  The arrangement presupposes a theory where subsidiarity protects national democratic autonomy, embodied primarily in *parliaments* rather than governments, due to distrust of executive bargaining. It blends efficiency and legitimacy concerns, positioning parliaments as the key political guardians against unnecessary centralization, while relying on the CJEU as a legal backstop. While consistent with parliamentary sovereignty and a distrust of executives, the core mechanism is sufficiently procedural to accommodate different underlying weights on efficiency versus legitimacy or conceptions of parliamentary representation. The true distinctiveness lies in choosing legislatures over executives or populations as the enforcers.
