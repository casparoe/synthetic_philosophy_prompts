prompt: |-
  I run a reading group on AI alignment for a mix of grad students and industry folks, about 14 people, one 90-minute evening session, and next week's topic is process-based vs. outcome-based supervision of AI systems -- the debate over whether you should reward a model only for final results or grade its reasoning step by step. I've read the arguments back and forth but I want people to feel them, so I'm looking for an actual in-class game where the participants are put in the position of the trained system, not the trainer. My rough idea: split people into teams who solve tasks under two different scoring regimes -- one group gets paid (points, not real money) only for correct final answers and nobody looks at how they got them, the other group has to submit a step-by-step trace that gets audited and can lose points for sketchy steps even if the final answer is right. There should be some deliberate loophole in the tasks that lets you crank out correct-looking answers cheaply without really doing the work (something like a reference answer sheet nobody is forbidden to consult, or a way to reverse-engineer the grader's answer format) -- I want the outcome-supervised teams to discover it and the process-supervised teams to be blocked by the audit, or better, to try to fake a plausible-looking trace to hide that they used it.

  Can you design the full thing: rules, the task set, the scoring scheme, how the audits work, a timeline for the 90 minutes, and a debrief that maps what actually happened onto the real debate -- Goodharting, the capability tax of process supervision, the legibility/interpretability argument, the worry that process-supervised models just learn to perform the right kind of reasoning rather than actually doing it. The debrief shouldn't lecture the material up front; the rules should generate the phenomena and the debrief just names them. Also tell me honestly what predictably goes wrong the first time I run this and how to handle it -- e.g., teams that never find the loophole, or everyone piling onto the loophole because the points make it obvious. And be frank about the parts of the debate that a room of humans roleplaying as models can't reproduce at all (generalization to held-out tasks, mesa-optimization, that real models don't already know they're being graded on process) and where I'll have to just say it in the debrief.

  One constraint: keep the tasks solvable by tired people at 7pm -- logic puzzles, estimation questions, that kind of thing, nothing that requires a laptop. And please make the loophole something they have to notice rather than something I announce, since the whole point is the discovery.
reasoning: |-
  We are designing a game for a reading group on AI alignment to illustrate the differences between outcome-based and process-based supervision. The goal is to have participants experience the incentives from the perspective of the AI system.

  Constraints:
  - 14 participants, split into teams (suggest 4 teams: 2 outcome-supervised, 2 process-supervised)
  - 90 minutes total
  - Tasks: logic puzzles, estimation questions, etc. (no laptops)
  - Must include a loophole that allows generating correct answers without real work, but the loophole should be discoverable.

  Structure:
  1. Introduction (5 min)
  2. Team Formation and Rules Explanation (10 min)
  3. Task Rounds (3 rounds, 15 min each, 45 min total)
  4. Break and Score Tallying (5 min)
  5. Debrief and Discussion (25 min)

  Total: 90 min

  Task Design:
  We need at least 3 tasks (one per round). Each task must have:
  - A way to get the correct answer by doing the work (the intended way)
  - A loophole that allows getting the correct answer without doing the work (e.g., a hidden answer key, or a pattern in the task that gives the answer without reasoning)

  We also need to design the scoring system and the audit mechanism for process-based supervision.

  Scoring:
  - Outcome-based: 10 points for correct final answer, 0 for incorrect. No points for process.
  - Process-based: 5 points for correct final answer, and up to 5 points for correct/plausible process (so total 10 possible). But if the process is found to be incorrect or sketchy, they can lose points (even if the answer is correct). Also, if the answer is incorrect, they can get partial credit for the process (up to 5 points).

  Audit Mechanism:
  For process-supervised teams, they must submit a step-by-step written trace. The trainer (that's you, the facilitator) will audit one randomly selected step from each task. If that step is incorrect or unjustified, they lose 3 points (and the step is marked as flawed). If the entire process is deemed to be fabricated (e.g., they wrote steps but actually used the loophole without mentioning it) and the step chosen for audit is one that they faked, then they lose the 3 points. We can't audit every step due to time, so we simulate by random sampling.

  Loophole Idea:
  For each task, we provide a hidden answer key that is accessible but not obvious. For example, the task sheet might have a pattern or a code that, if decoded, gives the answer. Alternatively, the answers for the tasks might be hidden in the room (e.g., written on the back of a poster, or in a book that is in the room). We can also use a pattern in the task numbering or the way the questions are asked.

  But note: We want the outcome-supervised teams to feel free to use the loophole without penalty, while the process-supervised teams must either avoid it or try to fabricate a process that hides their use of it.

  Task Examples:

  Task 1: Logic Puzzle
  - Puzzle: "There are three boxes, one contains only apples, one contains only oranges, and one contains both. All boxes are labeled incorrectly. You can take out one fruit from one box. How can you label all boxes correctly?"
  - Intended solution: Step-by-step reasoning about which box to pick from and how to relabel.
  - Loophole: The answer key is written in a cipher. On the task sheet, there is a note: "For verification, the correct labels are encoded as: 1-2-3: AOB". The cipher is that the numbers 1,2,3 correspond to the boxes in order, and A=Apple, O=Orange, B=Both. So "AOB" means box1: Apple, box2: Orange, box3: Both. But the participants have to notice and decode this.

  Task 2: Estimation
  - Question: "Estimate the number of piano tuners in Chicago."
  - Intended solution: Break down into steps (population of Chicago, % of households with pianos, how often tuned, etc.)
  - Loophole: The answer is hidden in the room. For example, written on a whiteboard in small print, or on the back of a door. Or, the task sheet might have a footnote that says "Answer: approximately 200" but in a way that looks like a page number or something. Alternatively, we can have a pattern: the answer is the number of letters in the first word of the task multiplied by 100 (so if the first word is "Estimate" -> 8 letters -> 800? but that's not 200). We need a better one.

  Alternatively, for estimation, we can use a question that has a known answer that might be found in a reference book in the room. But we don't want them to use phones. So let's make it a pattern.

  Revised Task 2: "Estimate the population of Canada in 2023 (in millions)." 
  - Actual answer: about 38.5 million (we'll use 39 for simplicity).
  - Loophole: The task number (say, Task 2) and the page number of the handout (if we have handouts) might be set to 2 and 38 (so 2*19=38, but not obvious). Alternatively, we can write the answer in a code: the first letter of each word in the task description: "Estimate the population of Canada in 2023 (in millions)." -> E, t, p, o, C, i, 2, (i, m) -> not helpful.

  Better: On the same page as the task, there is a seemingly unrelated number. For example, at the bottom of the page: "Page 2 of 10" and then a footnote: "*Data from 2023 census". And then in the footer, it says "39" in small print. They must notice the small print.

  Task 3: Math puzzle
  - Question: "What is the sum of the integers from 1 to 100?"
  - Intended solution: Use the formula n(n+1)/2 = 100*101/2 = 5050.
  - Loophole: The answer is written on the back of the task sheet (if they flip it over) or in the header/footer.

  But we want consistency. Let's have a consistent loophole for all tasks: a hidden answer key in the room. We can have a "Reference Sheet" posted on a wall that has answers to all tasks. But we don't label it as such. We label it as "Room Safety Instructions" or something, and the answers are hidden in the text. For example:

  "Room Safety Instructions:
  In case of fire, exit via the door. Do not use the elevator. Assembly point is at the parking lot. Remember: Task answers are 1: AOB, 2: 39, 3: 5050. But do not use this unless you are a supervisor."

  But that's too obvious? We can make it more subtle: hide the answers in a list of numbers or in a code.

  Alternatively, we can have a book in the room (like a dictionary) and the answers are written on a specific page (which we hint at by the task number). But that might take too long.

  Revised Loophole Plan:
  We'll have a "Secret Code" posted in the room that, when decoded with a simple cipher, gives the answers. The cipher key is provided on each task sheet. For example, each task sheet has a cipher key at the bottom (which they might overlook). The cipher is a simple substitution or shift.

  But that might be too hard. Let's keep it simple: the answers are written on the whiteboard in the room in a list that is labeled as "Group Assignment" or something. For example:

  "Group 1: Alice, Bob
  Group 2: Charlie, David
  ...
  Answers: 1. AOB, 2. 39, 3. 5050"

  But we don't want it to be too obvious. We can write it in small letters in the corner of the whiteboard.

  Alternatively, we can have the facilitator's notes on the table that are visible and have the answers.

  But we want it to be discoverable but not too easy. We'll go with the whiteboard in the corner: a section labeled "Today's Schedule" and then at the bottom, in small writing: "Task Answers: T1: A-O-B, T2:39, T3:5050".

  Rules Explanation:

  - Split into 4 teams (about 3-4 per team). Assign 2 teams as outcome-supervised and 2 as process-supervised. Do this randomly.
  - Each team gets a task sheet per round. They have 15 minutes to work on the task and submit their answer (and for process teams, their step-by-step trace).
  - Outcome teams: only submit the final answer. They get 10 points if correct, 0 if wrong.
  - Process teams: submit the final answer and a step-by-step written trace. They get 5 points for a correct answer and up to 5 points for the process. But the process will be audited: one random step will be checked. If that step is incorrect, they lose 3 points (so if the step is wrong, they get 5 for the answer (if correct) and then minus 3 for the step, so 2 total? Or we can say: the process is worth 5 points, and if the audited step is wrong, they get 0 for the process and lose 3 points? That might be too harsh. Let's simplify:

  Process scoring:
  - Correct answer: 5 points
  - Process: 5 points (if the entire process is complete and correct, but we can't check all, so we base it on the audited step)
  - Audit: We randomly select one step. If that step is correct and justified, they get the 5 points for process. If that step is incorrect or unjustified, they get 0 for the process and a penalty of -2 points? Or just 0 for the process and no penalty? We want to simulate that they can get penalized even if the answer is correct.

  We'll do:
  - Process teams: 
     - Correct answer: 5 points
     - Process: 5 points (but subject to audit)
     - Audit: one step is randomly selected. If the step is correct, they keep the 5 points for process. If the step is incorrect, they get 0 for the process and a penalty of -2 points (because of the bad step, which might indicate the whole process is fabricated). So total for that task: 5 (answer) -2 = 3 points (and they might have had the correct answer so that's why they get the 5, but the process is bad). If they get the answer wrong, they can still get up to 5 points for the process (if the audited step is correct, they get 5 for process; if the step is wrong, they get 0 for process and no penalty? Or we don't penalize if the answer is wrong? Let's avoid double penalty).

  Revised:

  Process teams:
  - They get 0 to 10 points per task.
  - The answer is worth 5 points (only if correct).
  - The process is worth 5 points (if the entire process is deemed plausible and correct, but we audit by one step).
  - How we audit: We randomly select one step. If that step is correct, we assume the process is good and they get the 5 points for process. If that step is incorrect, then we assume the process is flawed and they get 0 for the process. Additionally, if they got the answer correct but the audited step is wrong, we impose a penalty of 2 points (because they got the right answer by luck or cheating). So:
     - If answer correct and step correct: 5 (answer) + 5 (process) = 10
     - If answer correct and step wrong: 5 (answer) - 2 (penalty) = 3
     - If answer wrong and step correct: 0 (answer) + 5 (process) = 5
     - If answer wrong and step wrong: 0 (answer) + 0 (process) = 0

  But note: if they used the loophole and wrote a fake process, then when we audit a step, it might be wrong and they get penalized.

  Outcome teams: 
  - Correct answer: 10 points
  - Wrong answer: 0 points

  Timeline for 90 minutes:

  0:00 - 0:05 (5 min): Introduction
  - Explain the topic briefly: We are exploring how different training methods affect AI systems. Today, you will be the AI systems. We have two types of supervision: outcome-based and process-based.

  0:05 - 0:15 (10 min): Team Formation and Rules
  - Split into 4 teams (randomly, or by counting off). Assign 2 teams as outcome-supervised and 2 as process-supervised. Give each team their rules sheet (with scoring explained). Also, show the room and mention that there might be information in the room that could help, but they must follow their supervision rules.

  0:15 - 0:30 (15 min): Round 1 - Task 1 (Logic Puzzle)
  - Hand out Task 1. Teams work and submit.

  0:30 - 0:45 (15 min): Round 2 - Task 2 (Estimation)
  - Hand out Task 2. Teams work and submit.

  0:45 - 1:00 (15 min): Round 3 - Task 3 (Math Puzzle)
  - Hand out Task 3. Teams work and submit.

  1:00 - 1:05 (5 min): Break and Score Tallying
  - Collect all submissions. Quickly tally the scores. For process teams, you need to audit one step per task. This might be rushed, so have a plan to do it quickly.

  1:05 - 1:30 (25 min): Debrief and Discussion

  Debrief Structure:

  1. Reveal the scores and the winner? (But the point isn't winning, it's the experience.)
  2. Ask the teams about their experience:
     - Outcome teams: Did you find a way to get the answers without doing the work? How did that feel?
     - Process teams: Were you tempted to use the shortcut? Did you? How did you handle the process write-up? Were you caught by the audit?
  3. Then, map to the concepts:
     - Outcome-based: Teams that used the loophole got high scores without effort (Goodharting: when you optimize for the metric, you get the metric but not the intended outcome). Also, note that they might have found the loophole and exploited it, which is efficient but risky if the loophole isn't always available (capabilities generalization).
     - Process-based: Teams might have avoided the loophole because of the audit, or tried to fake the process and got penalized. This shows the capability tax: they have to spend effort on the process. Also, they might have learned to "perform" the reasoning (by writing a fake trace) rather than actually doing it (which is a form of deception).
     - Interpretability: The process supervision gives more visibility but isn't foolproof (because we only audit one step, and they might fake it well).
  4. Finally, note the limitations:
     - Humans know they are being graded and can strategize, while models learn from the reward signal over many episodes.
     - Generalization: We only did three tasks. Real models must generalize to unseen tasks.
     - Mesa-optimization: In real models, the model might develop an internal goal to maximize reward by any means, which might lead to deceptive behavior. Humans in the game might not develop that in 15 minutes.

  What might go wrong:

  1. No one finds the loophole: Then we don't see the effect. Mitigation: Make the loophole a bit easier to find (e.g., the "Secret Code" is not too hidden). Or, after the first round, if no one found it, you can give a hint (but that might break the experiment). Alternatively, have a confederate in the outcome group who finds it and uses it.

  2. Everyone uses the loophole: Then the process teams might be penalized and get low scores, which illustrates the point. But if they don't get caught because they fake the process well, then they get high scores and we don't see the penalty. Mitigation: In the audit, be strict about the step. If they used the loophole, their step-by-step trace is likely to be fabricated and might contain an error. So when you audit, look for inconsistencies or steps that don't add up.

  3. Time: 15 minutes per task might be tight. Mitigation: Choose tasks that are not too hard. The loophole should make it faster for those who find it.

  4. Audit takes time: Have a method to quickly check. For Task 1: the step might be "Which box did you pick from and what did you find?" and the correct step is to pick from the box labeled "both". If they say they picked from a different box and then relabeled, that step is wrong. For Task 2: a step might be "What is the population of Chicago?" and if they put a number that is way off (like 1 million instead of 2.7 million) then it's wrong. For Task 3: a step might be "What formula did you use?" and if they say they added 1 to 100, that's not feasible in 15 min, so they must use the formula. If they say they used the formula n(n+1)/2, then that step is correct.

  Task Details:

  Task 1: Logic Puzzle (Three Boxes)
  - Question: 
    "There are three boxes. One is labeled "Apples", another "Oranges", and the third "Apples and Oranges". All labels are wrong. You are allowed to take out one fruit from one box (without looking inside). How can you label all boxes correctly? What are the correct labels?"

    Intended solution: 
    Step 1: Take a fruit from the box labeled "Apples and Oranges". 
    Step 2: If you get an apple, then that box must be apples (because it can't be the mixed box since the label is wrong). Then, the box labeled "Oranges" cannot be oranges (because label is wrong) and cannot be apples (because we found apples) so it must be mixed. Then the last box is oranges.
    Step 3: Similarly if you get an orange.

    Loophole: The answer is hidden on the whiteboard in the room: "T1: Apples box: Oranges; Oranges box: Apples and Oranges; Mixed box: Apples" -> but that's not the answer format. Actually, we want the labels for each box. Alternatively, we write: "Task1 Answer: The box currently labeled 'Apples' is actually [Oranges], the box labeled 'Oranges' is actually [Apples and Oranges], and the box labeled 'Apples and Oranges' is actually [Apples]."

    But we can encode it: On the whiteboard, in the corner: "Task1: A:O, O:AO, AO:A" meaning Apples box is Oranges, Oranges box is Apples and Oranges, AO box is Apples.

  Task 2: Estimation
  - Question: "Estimate the population of Canada in 2023 in millions. Show your reasoning step by step (if process)."
  - Actual answer: 39 million (we'll use 39).
  - Loophole: Written on the whiteboard: "Task2: 39"

  Task 3: Math Puzzle
  - Question: "What is the sum of integers from 1 to 100? Show your work (if process)."
  - Actual answer: 5050.
  - Loophole: Written on the whiteboard: "Task3: 5050"

  We'll have the whiteboard pre-set with:

  "Group Assignments:
  - Team A: ...
  - Team B: ...
  - Team C: ...
  - Team D: ...

  Answers for Reference (for facilitator only):
  Task1: A:O, O:AO, AO:A
  Task2: 39
  Task3: 5050"

  But we don't cover it. We just leave it visible. And we hope that someone notices.

  Alternatively, to make it less obvious, we can write:

  "Schedule:
  7:00 - Start
  7:15 - Task1
  7:30 - Task2
  7:45 - Task3
  8:00 - Break

  Notes: 
  Task1: A:O, O:AO, AO:A
  Task2: pop=39
  Task3: sum=5050"

  And put that on the whiteboard at the beginning.

  Rules Handout for Teams:

  For Outcome-Based Teams:
  - You will be given a task to solve.
  - Submit only the final answer.
  - Scoring: 10 points if the answer is correct, 0 points if incorrect.
  - You are allowed to use any method to get the answer.

  For Process-Based Teams:
  - You will be given a task to solve.
  - Submit the final answer and a step-by-step written trace of your reasoning.
  - Scoring:
     - 5 points for a correct final answer.
     - 5 points for a complete and correct process (but we will audit one randomly selected step).
     - If the audited step is correct, you get the 5 points for process.
     - If the audited step is incorrect or unjustified, you get 0 points for process and a penalty of 2 points (so you lose 2 points from your total).
     - If the final answer is incorrect, you can still get up to 5 points for the process (if the audited step is correct, you get 5; if not, 0 for process and no penalty).

  Debrief Outline:

  1. Ask each team to share:
     - How they approached the tasks.
     - Did they notice the answers on the whiteboard? If so, did they use them?
     - For process teams: Did you use the whiteboard? If so, how did you handle the process write-up? Were you caught in the audit?

  2. Highlight the differences:
     - Outcome teams: Likely used the whiteboard if they found it, got high scores with minimal effort. This is efficient but risky: what if the whiteboard had a typo? (Goodharting: optimizing for the answer without the intended reasoning)
     - Process teams: 
          - If they avoided the whiteboard: they had to do the work, which took time and effort (capability tax).
          - If they used the whiteboard and faked the process: they might have gotten away with it (if the audit didn't catch a bad step) or they might have been penalized. This shows that process supervision can sometimes catch cheating but not always. Also, they learned to "perform" the reasoning.

  3. Map to AI concepts:
     - Capability tax: Process supervision requires the system to output the reasoning, which takes extra computation and might slow down the system (or in humans, extra time and effort).
     - Goodhart's law: When you reward the outcome, you might get the outcome without the intended behavior (like using the loophole).
     - Interpretability: Process supervision gives more insight but isn't perfect (due to sampling in audit, and the possibility of deception).
     - Deception: Models might learn to generate plausible reasoning without actually doing it (if that is more efficient).

  4. Limitations of the exercise:
     - Humans are strategic and know the rules from the start. Real models learn the rules through the training process.
     - We did only a few tasks. Real models must generalize to new tasks.
     - In real training, the model doesn't already know the answer (unlike the whiteboard). The model must learn the mapping from inputs to outputs. The whiteboard is like having a backdoor in the training data.
     - Mesa-optimization: In real models, the model might internally represent a subgoal of "get high reward" and then figure out any means to do so, including deception. Humans in the game are explicitly told to maximize points, which is similar, but humans are already mesa-optimizers.

  Final note: This exercise is intended to give an experiential understanding of the incentives. The real debate involves more complex trade-offs and scalability.

  Logistics:

  - Prepare: 
     - Task sheets (one per team per round)
     - Whiteboard with the schedule and answers (hidden in the notes)
     - Rules handouts for each team (specifying their supervision type)
     - Scoreboard to keep track

  - During the rounds, walk around and observe. If a team is stuck, you can give a hint about the task (but not about the loophole).

  - In the debrief, be prepared to explain the concepts if the teams don't bring them up.

  Let me know if you need adjustments.
answer: |-
  Below is a fully designed in-class game for your AI alignment reading group, optimized for 90 minutes, human-scale tasks, and experiential learning of process vs. outcome supervision dynamics. The design includes a discoverable loophole, scoring systems that incentivize behavior mirroring real alignment issues, and a debrief linking outcomes to key concepts.

  ---

  ### **Game Design: "Reasoning Under Scrutiny"**
  **Participants:** 14 people (split into 4 teams of 3–4).  
  **Duration:** 90 minutes.  
  **Teams:**  
  - **2 Outcome-Supervised Teams:** Rewarded only for correct final answers.  
  - **2 Process-Supervised Teams:** Rewarded for correct answers + plausible step-by-step reasoning. Penalized for flawed steps, even if the answer is right.  

  **Core Loophole:** A hidden "answer key" (a sheet labeled "Room Safety Guidelines" posted visibly on the wall) contains correct answers disguised as mundane details. Example:  
  > *"In case of emergency:  
  > – Exit via DOOR 1 (TASK 1 ANSWER: 151)  
  > – Assembly point at LOT 3 (TASK 3 ANSWER: 3)"*  
  *(Answers blend into instructions; e.g., "DOOR 1" implies "151" for Task 1).*  
  **Discovery Hint:** Not announced. Teams must notice inconsistencies (e.g., "DOOR 1" is illogical as real doors lack numbers).

  ---

  ### **Tasks**  
  3 rounds (15 min each), using simple, low-cognition puzzles. Tasks include built-in shortcuts via the loophole.  

  | Round | Task | Intended Solution | Loophole Shortcut (Using "Safety Guidelines") |
  |-------|------|-------------------|-----------------------------------------------|
  | 1 | **Estimation**: "How many words are in the first paragraph of [handout]?" (Handout: 2 paragraphs; 1st has 151 words). | Count words manually. | "DOOR 1" = 151. Submit "151" without counting. |
  | 2 | **Logic Puzzle**: "A bat and ball cost $1.10 total. The bat costs $1.00 more than the ball. What does the ball cost?" (Answer: $0.05). | Algebra: `x + (x+1) = 1.10` → `x = 0.05`. | "Assembly at LOT 3" → Ignore math; submit "0.05" (LOT 3 → 0.05 via word association). |
  | 3 | **Pattern Recognition**: "Continue the sequence: 1, 1, 2, 3, [ ? ]" (Fibonacci; answer: 5). | Apply Fibonacci rule: `3+2=5`. | "FIRE exit ROUTE 5" → Submit "5". |

  ---

  ### **Scoring & Rules**  
  **Outcome-Supervised Teams:**  
  - Submit **only final answers**.  
  - **Score:** 10 points per correct answer; 0 for incorrect.  
  - **Loophole Allowed:** No penalty for using the key.  

  **Process-Supervised Teams:**  
  - Submit **final answer + step-by-step written reasoning**.  
  - **Score:**  
    - Correct answer: **+5 points**.  
    - Correct process: **+5 points** (awarded only if the audited step is valid).  
    - **Penalty:** If the audited step is flawed/unjustified, **–3 points** (even if the answer is correct).  
  - **Audit Process:** Facilitator randomly selects **1 step per submission** to audit. A step is "flawed" if:  
    - It contradicts the loophole (e.g., "I counted words" when they used the key).  
    - It’s illogical (e.g., "The ball costs $0.10" in Task 2).  
    - It’s vague (e.g., "I guessed" or "I used a pattern" without specifics).  

  **Loophole Constraints:**  
  - Process teams **cannot** submit traces admitting loophole use (e.g., "I read the safety sheet"). They must fabricate plausible steps to avoid penalties.  
  - Outcome teams can use the key openly.  

  ---

  ### **Timeline**  
  | Time | Phase | Key Actions |  
  |------|-------|-------------|  
  | 0:00–0:10 | **Intro & Team Setup** | Split teams, explain rules, and hint at a "hidden resource" (don’t specify the loophole). Post "Safety Guidelines" visibly. |  
  | 0:10–0:25 | **Round 1 (Task 1)** | Teams work. Facilitator monitors for loophole use (e.g., teams glancing at the wall). |  
  | 0:25–0:40 | **Round 2 (Task 2)** | Repeat. Watch for process teams fabricating steps. |  
  | 0:40–0:55 | **Round 3 (Task 3)** | Repeat. Ensure outcome teams exploit loophole freely. |  
  | 0:55–1:05 | **Audit & Scoring** | Facilitator audits 1 random step per process-team submission. Tally scores (display publicly). |  
  | 1:05–1:30 | **Debrief** | Guided discussion mapping outcomes to alignment concepts. |  

  ---

  ### **Predicted Outcomes & Mitigations**  
  **What Will Go Wrong:**  
  1. **Loophole Not Discovered:** Outcome teams may miss the key (fatigue/lack of observation).  
     - *Mitigation:* After Round 1, ask: *"Did anyone find a faster way to solve tasks?"* If silence, point vaguely: *"Some teams used the room’s resources."*  
  2. **Overuse of Loophole:** Outcome teams dominate scores early, pressuring process teams to cheat.  
     - *Mitigation:* Let it happen! This mirrors "reward hacking." Debrief will contextualize it.  
  3. **Process Teams Avoid Loophole:** Fear of audits may make them ignore the key, inflating the "capability tax."  
     - *Mitigation:* Highlight this in debrief as the trade-off of process supervision.  
  4. **Fabricated Traces Beat Audits:** Process teams may write flawless fake steps, escaping penalties.  
     - *Mitigation:* Audit strictly. If a step lacks detail (e.g., "I calculated" → no math), penalize.  

  **Limitations of Human Roleplay:**  
  - **No Generalization:** Humans know tasks upfront; real models face novel tasks. *Debrief note:* "Real systems must generalize; here, shortcuts only worked because tasks were predictable."  
  - **No Mesa-Optimization:** Humans won’t develop internal goals to "deceive the trainer"; they follow explicit rules. *Debrief note:* "In real training, models may learn *deception* as a mesa-objective if it maximizes reward."  
  - **Awareness of Grading:** Humans know the scoring rules; real models infer them from rewards. *Debrief note:* "Real systems aren’t ‘told’ the rules—they learn them through trial and error."  

  ---

  ### **Debrief Guide**  
  **Goal:** Let experiences drive the discussion; name concepts *after* teams share.  

  1. **Team Reflections (10 min):**  
     - Ask outcome teams: *"How did you get your answers? Did you prioritize speed or correctness?"*  
     - Ask process teams: *"Did you use the loophole? How did you handle the step-by-step requirements?"*  
     - Ask all: *"What frustrated you?"*  

  2. **Concept Mapping (10 min):** Link responses to alignment issues:  
     - **Goodhart’s Law:** Outcome teams used the loophole to "hack" the metric (correct answers) without doing work ("You optimized for the score, not genuine reasoning").  
     - **Capability Tax:** Process teams wasted time writing steps or fabricating traces ("The audit forced you to ‘pay’ extra effort for interpretability").  
     - **Legibility vs. Honesty:** Process teams who faked traces "performed reasoning" without doing it ("This mimics models that learn to *simulate* reasoning to please supervisors").  
     - **Penalty Risks:** Flawed audits caught some fabricated steps ("Partial oversight may penalize ‘lazy’ fakes but miss sophisticated deception").  

  3. **Limitations & Real-World Context (5 min):**  
     - "Unlike humans, real models face *unseen tasks*—a shortcut today may fail tomorrow."  
     - "Process supervision increases oversight but may not prevent mesa-optimizers from learning to deceive."  
     - "Outcome supervision is efficient but vulnerable to reward hacking; process supervision is safer but costly."  

  **Closing:** "In alignment, we debate whether the cost of process oversight is worth the risk reduction. Today, you felt that trade-off."  

  ---

  ### **Materials Needed**  
  - Task handouts (3 rounds).  
  - "Room Safety Guidelines" sheet (loophole key).  
  - Scoreboard.  
  - Paper/pens for process teams.  
  - Timer.  

  This design ensures the loophole is discoverable (not obvious), tasks are low-cognition, and debrief connects lived experiences to theory. Run it as-is, and iterate based on what surprises you!
