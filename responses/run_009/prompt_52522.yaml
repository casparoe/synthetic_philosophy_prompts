prompt: |-
  I cover science and medicine for a mid-size outlet, and our copy desk keeps fighting about how to describe people at the edge of death — organ donors on ventilators, the phrase "brain dead," cases where a heart stops and gets restarted. Our stylebook just says don't use "brain dead" metaphorically, which dodges the actual problem. Write me a procedure an editor can run on a sentence in five minutes: what to ask about the case, when plain "dead" is safe, when it needs a qualifier and which one, and where the procedure has to stop and say this is a values call a human has to make. Ground it in the real philosophy — whole-brain death vs. permanent loss of integrated bodily functioning vs. losing the person while the body lives on — but usable by someone with zero philosophy background and a deadline. Then run it on three cases: a donor declared brain dead being wheeled to the OR with a beating heart, a donation-after-circulatory-death case where the heart is stopped for only a couple minutes before its stopped for good, and a patient in a permanent vegetative state whose family asks us not to call her dead in our story. Flag the places where the procedure gives an answer readers or families will hate, and be honest about what it cant settle.
reasoning: |-
  Okay, the user is a science and medicine journalist dealing with editorial disputes on how to describe people near death. They need a clear, practical procedure for editors to handle such cases quickly, grounded in medical and philosophical concepts but accessible without expertise. 

  First, I need to unpack their core frustration: the stylebook only prohibits metaphorical use of "brain dead," leaving actual reporting scenarios unaddressed. Their examples reveal three pain points: 
  - Brain-dead donors with cardiac function (clinical vs. lay perception of death)
  - Circulatory death after brief resuscitation (threshold of irreversibility)
  - PVS cases where families reject "dead" (consciousness-based definitions)

  The medical frameworks here are whole-brain death vs. circulatory death vs. consciousness-based criteria. Philosophically, it's a clash between biological integration (body as organism) and personhood (mind/identity). But the solution must avoid academic jargon while respecting these underpinnings.

  For the procedure, I consider a flowchart-style checklist:
  1) Start with legal death determination - this overrides editorial preference
  2) Then distinguish brain death from circulatory death, stressing the "permanent" vs. "irreversible" nuance 
  3) Finally handle PVS separately as a values call since it's legally alive despite severe loss of function

  The three test cases will expose fault lines:
  - The brain-dead donor forces "dead" against visceral reactions to a beating heart
  - The DCD case reveals how "permanent" is contextual (minutes vs. forever)
  - PVS is the minefield where science (minimal consciousness) clashes with family's lived reality

  Biggest challenge: admitting where the procedure fails. PVS can't be resolved medically - it's pure ethics. I'll flag how readers might revolt at "dead" for brain-dead cases, and families will reject any suggestion that PVS isn't "alive." Honesty about these limits is crucial.
answer: |-
  Here’s a step-by-step procedure for editors, grounded in real-world medical/legal standards but stripped of jargon. It prioritizes clarity, accuracy, and ethical sensitivity in **≤ 5 minutes**. The core tension is: **Legally/medically dead ≠ culturally/perceptually dead for everyone.**

  ---

  ### **The 5-Minute Editor’s Procedure: "Is This Person Dead?"**
  **Ask these questions in order:**

  1.  **Was legal death declared? By whom?**
      *   **Yes (by a doctor):** Use "dead," "died," or "death." *Proceed to Step 2 for qualifier IF needed for clarity.*
      *   **No:** **STOP.** The person is *not dead* for reporting purposes. Use terms like "critically ill," "near death," "dying," "in a coma/vegetative state," etc., as appropriate. *See Step 5 for edge cases.*
      *   **Unclear:** Verify source. If impossible, default to "critically ill" or similar pending confirmation.

  2.  **What’s the basis for the death declaration?** (Check source/docs)
      *   **"Brain death" / "Death by neurologic criteria":** Use "dead" or "died." **Add "brain dead" ONLY if:**
          *   It’s crucial to the story (e.g., organ donation context).
          *   It’s clearly defined *in the text* (e.g., "...declared brain dead, meaning...") or widely understood in context.
          *   *Avoid "brain dead" in headlines or flippantly.*
      *   **"Circulatory death" / "Cardiac death":** Use "dead" or "died." **Add "after their heart stopped" or "after circulatory death" ONLY if:**
          *   Timing/reversibility is key to the story (e.g., DCD organ donation).
          *   There’s risk readers think the heart stopped long ago (clarify recent stoppage).
      *   **Unclear Basis:** Default to "dead" or "died" if declaration is confirmed, but avoid speculative qualifiers. Cite the declaration source (e.g., "declared dead by doctors").

  3.  **Is the body showing obvious signs contradicting "dead" for lay readers?** (e.g., heart beating, chest rising)
      *   **Yes (e.g., ventilator sustaining body):** **Add a BRIEF explanatory phrase.** *Examples:*
          *   "...declared brain dead, kept alive by machines for organ donation."
          *   "...died, though machines maintained bodily functions briefly for donation."
          *   "...dead; their heart was restarted after a brief stoppage." (For restart cases).
      *   **No:** Use "dead" or "died" without qualifier.
      *   **Why?** Acknowledges the visible reality without undermining the medical/legal fact of death. Balances accuracy with avoiding sensationalism.

  4.  **Is the condition Permanent Vegetative State (PVS) or similar severe disorder of consciousness?**
      *   **Yes:** **STOP. This is a VALUES CALL.** Legally and medically, **they are NOT dead.** Use precise medical terms: "in a permanent vegetative state," "in a coma," "with a severe brain injury causing permanent unconsciousness." **DO NOT use "dead," "brain dead," or "essentially dead"** unless directly quoting a source *and* providing context/counterpoint. Respect family requests on terminology *when describing the patient's current state*.

  5.  **Edge Cases / Where the Procedure Stops:**
      *   **"Permanent" vs. "Irreversible":** If a heart stops but is *quickly* restarted (e.g., CPR after 2 mins), the person was **not dead** during that stoppage. Death requires *irreversibility* (cannot restart) under the applicable criteria (brain or circulatory). Use "cardiac arrest," "heart stopped," "clinically died briefly" (if common in context), but **not "died"** for the final outcome unless death was later declared.
      *   **Futility vs. Death:** If treatment is stopped *because* death is inevitable/imminent, but hasn't been declared yet, the person is **not dead**. Use "withdrew life support," "terminated resuscitation efforts," "as death was imminent."
      *   **Philosophical Disputes:** If sources/families strongly contest the declaration (e.g., rejecting brain death criteria), **report the dispute accurately.** "Declared brain dead by doctors, though the family disputes this diagnosis based on their beliefs." The *legal fact* remains death, but acknowledge the conflict.

  ---

  ### **Applying the Procedure to Your Cases**

  **Case 1: Organ donor declared brain dead, wheeled to OR with beating heart.**
  *   **Step 1:** Yes, legal death declared (brain death).
  *   **Step 2:** Basis = Brain death. Qualifier needed? **Yes** (beating heart is visually contradictory).
  *   **Step 3:** Contradictory signs? **Yes** (heart beating/ventilator).
  *   **Step 5:** Not PVS.
  *   **Edited Description:** "The donor, declared brain dead, was wheeled to the operating room where machines maintained their heartbeat and breathing for organ recovery." OR "The deceased donor, sustained by a ventilator after brain death declaration, was taken to the OR."
  *   **Readers/Families Might Hate:** Using "dead" or "deceased" despite the beating heart. Families deeply opposed to brain death criteria will reject the term entirely. **Procedure Can't Settle:** The validity of brain death itself. It accepts the legal/medical standard.

  **Case 2: Donation after Circulatory Death (DCD) - Heart stopped for 2 minutes, then stopped permanently.**
  *   **Step 1:** Death declared? **Yes (after the *permanent* stoppage, following protocols).**
  *   **Step 2:** Basis = Circulatory death. Qualifier needed? **Yes** (timing/reversibility is key to DCD).
  *   **Step 3:** Contradictory signs at time of *final* declaration? **No** (heart stopped permanently).
  *   **Step 5:** Clarify "permanent" vs. "irreversible". The brief 2-min stoppage was *reversible* (CPR worked), so **not death** then. Death declared after *irreversible* stoppage later.
  *   **Edited Description:** "After life support was withdrawn, the patient's heart stopped. Following a mandatory observation period confirming the stoppage was permanent, death was declared, and organ recovery began." *Avoid:* "Died twice." *Use:* "Initial cardiac arrest," "brief heart stoppage," "final cessation of heartbeat."
  *   **Readers/Families Might Hate:** Calling the final declaration "death" if they focus on the body being "alive" until organ recovery starts. **Procedure Can't Settle:** Whether the observation period truly confirms irreversibility to everyone's satisfaction.

  **Case 3: Patient in Permanent Vegetative State (PVS), family requests not to call her dead.**
  *   **Step 1:** Was legal death declared? **No.**
  *   **Step 4:** **YES - PVS. STOP. VALUES CALL.**
  *   **Edited Description:** "The patient remains in a permanent vegetative state after the accident." / "Diagnosed with a permanent vegetative state, her family emphasizes she is still alive." **DO NOT use "dead," "brain dead," "essentially dead," or imply equivalence to death.** Respect the family's request *regarding her current state*.
  *   **Readers/Families Might Hate:** Pro-life/Disability advocates might object to *any* terminology implying reduced value. Others might think PVS *should* be called death. **Procedure Can't Settle:** The profound philosophical/ethical question of whether permanent unconsciousness = death of the *person*. It adheres strictly to the legal/medical fact: **No death declaration exists.**

  ---

  **Key Takeaways for Editors:**
  1.  **Legal Death Declaration is King:** If declared, use "dead/died" as the baseline.
  2.  **Qualify for Clarity & Contradiction:** Add brief context ONLY when the *visible state* (beating heart) or *specific mechanism* (DCD) is crucial and contradicts a simplistic understanding of "dead."
  3.  **PVS is NOT Death:** This is non-negotiable legally/medically. Use precise medical language, respect family wishes on *descriptive* terms (avoiding "dead"), but avoid unscientific euphemisms ("miracle").
  4.  **Acknowledge Limits:** Flag disputes over the *definition* of death (especially brain death) or profound unconsciousness (PVS). Your job is accurate reporting, not resolving millennia-old philosophical debates.
  5.  **Avoid Metaphorical Use:** Your stylebook is right here. Never use "brain dead" for malfunctioning electronics or stupid policies. It trivializes a profound medical reality.
