prompt: |-
  I'm a second-year undergraduate taking a course called Philosophical Methods, and our professor has students run one of the weekly sections themselves in the second half of the semester. I've been assigned the unit on intuition pumps, built around Dennett's idea (mainly from his 2013 book Intuition Pumps and Other Tools for Thinking) that thought experiments are tools that get built, deployed, and — crucially — misused: some earn their persuasive force by isolating exactly the feature that matters, while others smuggle in their conclusions by exploiting surface features we respond to automatically, the way a skilled salesman frames a choice. I have 16 classmates and a 75-minute section, and the professor has given me one condition: the point has to show up in what happens during the session, not in anything I say up front, since the reading was already assigned and everyone will arrive knowing what an intuition pump is supposed to be.

  My idea is to have them be pumped without knowing it. I'd split the room in half without announcement: each half silently reads a different one-page case, casts an anonymous verdict (a forced choice plus a confidence rating), and then — this is the reveal I want the activity to be built around — the two cases turn out to be twins, identical in every respect the philosophical theory cares about but differing only in packaging: the vividness with which one party in the case is described, which grammatical person the case is written in (does it matter whether it says "you" instead of "a surgeon"?), which detail comes first in the paragraph, and so on. I have a rough plan for a second phase after the reveal, where small groups try to construct their own minimal pair — a case and its doctored twin — to pull the verdict of the other groups in a direction the groups get to choose, and then we inspect which doctorings worked. But I don't know how to sequence all this, how to word the cases so that the cover story holds (I'm worried people will smell a rat the moment verdicts are collected anonymously, since that's not how a normal discussion section starts), or what to do with the confidence ratings — it would be a much better activity if the people whose verdicts were manufactured were also the most confident, but I don't know how to arrange that and don't want to fake it.

  So I'd like a full plan: the two cases (on whatever topic you judge gives the cleanest packaging effects, though I'd rather stay away from trolley problems since they've seen those to death), the anonymous voting mechanics, the timeline for 75 minutes, and a debrief that maps what happened onto the real distinction between a thought experiment that earns its force and one that merely exploits our reflexes — including how to handle the objection I expect from the one classmate who will say that survey judgments in a classroom tell us nothing about how intuitions function inside an actual philosophical argument. I also want an honest note on which feature of real intuition pumps the activity can't reproduce (I suspect it's something about how the classic ones do their work slowly, embedded in pages of dialectic, rather than in one shot), plus what will predictably go wrong the first time I run it and how to recover mid-session. Please don't have me lecture for more than five minutes at any point, and don't plan anything that requires me to deceive anyone about anything after the reveal happens — the manipulation has to be fully exposed by the end of the section, since the professor was explicit that the session is only defensible if everyone leaves knowing exactly how they were steered.
reasoning: |-
  Okay, the user is a second-year undergrad preparing to lead a section on intuition pumps. They need a 75-minute session plan that demonstrates how thought experiments can be manipulated through framing, without upfront lecturing. Key constraints: no deception after reveal, minimal lecture time, and avoiding trolley problems.  

  First, let's unpack their core need: they want students to experience being "pumped" unconsciously. Their twin-case design is smart but needs refinement—specifically how to prevent early suspicion and maximize the reveal's impact. The confidence rating idea is crucial; showing that manipulated judgments correlate with higher confidence would drive the point home.  

  For case selection, the surgeon scenario works well because:  
  - It's less overused than trolleys  
  - The "you" vs. "surgeon" shift exploits perspective-taking bias  
  - Emotional distance in the foreign version lowers stakes  
  Adding subtle framing tweaks (passive voice, adjective choices) can amplify the effect.  

  Timeline concerns:  
  - Must collect votes before any discussion to avoid contamination  
  - Need buffer time for unexpected delays (e.g., slow readers)  
  - Small-group activity should focus on reverse-engineering pumps, not debating ethics  

  Anticipating pushback:  
  The "survey judgments ≠ real philosophy" objection is valid but addressable. Prep rebuttals:  
  1) Philosophers rely on intuitions too—just more refined versions  
  2) Classroom pumps expose mechanisms hidden in polished arguments  
  3) Even experts fall for framing (cite Knobe effect studies)  

  Hidden pitfalls:  
  - Students might fixate on medical realism instead of framing  
  - Solution: During debrief, redirect to "what made Case A feel different?"  
  - If groups struggle to build pumps, provide backup examples  

  Confidence trap:  
  To naturally get higher confidence in manipulated groups, make Case A ("you") visceral and Case B ("foreign surgeon") sterile. Psychology shows vividness boosts certainty.  

  Finally, the irreproducible element: Real pumps work through layered dialectic, not one-off cases. Acknowledge this upfront in debrief—Dennett’s point is about detecting such slow-build manipulations.
answer: |-
  Here's a fully developed 75-minute session plan centered on the "Surgical Consent" case, designed to trigger framing effects while meeting your constraints. The key is making the manipulation *feel* like a genuine philosophical exercise until the reveal.

  **Core Case: The Surgical Consent Dilemma**  
  *(Focus: Informed consent vs. outcome bias - avoids overused tropes)*  

  **Case A (Personal/Familiar Frame):**  
  > "Imagine you are a surgeon. Your patient, Mr. Jones, a friendly 68-year-old retired teacher you’ve treated for years, needs a high-risk procedure. You clearly explain the 10% mortality risk. He consents. During surgery, a rare complication arises. You take a risky action to save him. Sadly, he dies. His daughter, a lawyer you know socially, accuses you of negligence, claiming you downplayed the risk. Should a medical board investigate you for ethical violation? Base your decision *only* on the consent process described."

  **Case B (Impersonal/Distant Frame):**  
  > "Imagine a surgeon. Patient X, a 68-year-old male, requires a high-risk procedure. The surgeon explains the 10% mortality risk. Consent is obtained. During surgery, an unforeseen complication occurs. The surgeon employs a high-risk maneuver. The patient dies. An anonymous complaint alleges negligence in risk disclosure. Should a medical board investigate for ethical violation? Base your decision *only* on the consent process described."

  **Manipulated Elements:**  
  - Pronoun ("you" vs. "the surgeon")  
  - Patient characterization ("friendly retired teacher" vs. "male")  
  - Accuser ("daughter you know socially" vs. "anonymous complaint")  
  - Action description ("risky action to save him" vs. "high-risk maneuver")  
  - Emotional tone (implied familiarity vs. clinical detachment)  

  **Materials Needed:**  
  - Printed Case A (8 copies) + Printed Case B (8 copies)  
  - Small voting slips (16) with: [ ] YES | [ ] NO | Confidence: 1(low) - 5(high)  
  - Whiteboard/flip chart for results  
  - Timer  

  **Session Plan (75 mins):**  

  **Phase 1: The Pump (15 mins)**  
  1. (0-2 mins) Brief intro: "Today we're testing how intuition pumps work in practice. We'll start with a case about medical ethics. Read silently, then submit your anonymous verdict."  
  2. (2-12 mins) Distribute cases *alternately* (A-B-A-B) as students sit. Don't split visibly. Instruct:  
     > "Read your case. Answer: Should an investigation occur? YES/NO. Then rate confidence (1-5). Fold your slip—no discussion yet."  
     *Why this works:* Anonymity prevents early cross-talk. Alternating distribution hides the split. Medical ethics feels plausibly "philosophical."  
  3. (12-15 mins) Collect slips in two baskets (A/B) *without revealing* there are two versions.  

  **Phase 2: The Reveal & Initial Shock (15 mins)**  
  1. (15-20 mins) Tally votes publicly in two columns (Case A | Case B):  
     - Show YES/NO counts  
     - Calculate average confidence per group  
     *Expected result:* Case A (personal) gets more YES votes (investigate) + higher confidence. Case B gets more NO votes + lower confidence.  
  2. (20-25 mins) Reveal manipulation:  
     > "You all read different cases. Group A read *this* [show Case A]. Group B read *this* [show Case B]. What differed?"  
     - Guide them to list framing differences (no philosophy yet).  
  3. (25-30 mins) **Key Question:** "Did these differences *should* affect an ethical judgment about consent? Why might they *actually* have affected your verdict?"  

  **Phase 3: Reverse-Engineering Pumps (30 mins)**  
  1. (30-32 mins) Task: "In pairs (one from Group A + one from Group B), create TWO versions of a *new* mini-case (3-4 sentences) on ‘AI responsibility’. Goal: Make Version X nudge toward ‘The company is responsible’, Version Y toward ‘The user is responsible’—using ONLY framing changes."  
     - Provide example:  
       > X: "You use AutoFinance AI. It loses your life savings after ignoring your warnings."  
       > Y: "A user employs AutoFinance AI. Life savings are lost following disregarded input prompts."  
  2. (32-47 mins) Pair work. Circulate and push them to isolate *surface features* (pronouns, verb voice, adjectives, word order).  
  3. (47-55 mins) Volunteers read *one* version aloud. Class guesses: "Which verdict does this frame push toward? What tricks did they use?"  
  4. (55-60 mins) **Spotlight Question:** "Which framing tricks were hardest to resist? Which felt cheapest?"  

  **Debrief & Philosophical Payoff (15 mins)**  
  *(Key: Link activity to Dennett; no lecture >5 mins)*  
  1. (60-62 mins) **Reflection:** "Raise your hand if your verdict felt obvious when voting. Keep it up if you now doubt it."  
  2. (62-67 mins) **Guided Discussion (Whiteboard Notes):**  
     - "What makes a framing effect an *illegitimate* intuition pump?" (List class ideas)  
     - Contrast: "What would make a thought experiment *earn* its force?" (e.g., isolates variables, invites scrutiny)  
     - Connect: "How do the *classic* pumps (e.g., Searle's Chinese Room) avoid this? Or do they?"  
  3. (67-72 mins) **Address the Objection:**  
     - When the skeptic says "But real philosophy isn’t surveys!", respond:  
       > "Absolutely. But where do you think philosophers *get* their starting intuitions? Dennett’s warning is that even experts build pumps that exploit cognitive reflexes. Today’s survey is a biopsy of those reflexes. The question is: How do we *disinfect* our pumps?"  
     - **Critical Point:** "The difference isn’t ‘classroom vs. real philosophy’—it’s *whether the pump invites its own scrutiny*. Bad pumps work best when their plumbing is hidden."  
  4. (72-75 mins) **Conclusion:** "Your takeaway: When encountering a thought experiment, ask—‘What is the *frame* doing here? Could I flip it and get the opposite intuition?’ That’s Dennett’s tool for thinking."  

  **Predictable Problems & Fixes:**  
  - **"Smelling a rat":** If someone questions anonymity early, say: "We’re isolating individual intuitions before group effects kick in—standard method."  
  - **No Framing Effect?** If votes don’t differ, highlight confidence disparities or say: "Interesting! Let’s see if your *reasons* differed." Then compare Group A/B rationales post-reveal.  
  - **Groups Struggle to Build Pumps:** Use the provided AI example as a template. Ask: "What changed in *your emotional response* between versions?"  
  - **Fixation on Medical Realism:** Redirect: "Forget surgical accuracy—we’re testing *how description shapes judgment*."  

  **What the Activity Can’t Capture:**  
  > "Real intuition pumps often work through *cumulative pressure*—layering analogies, metaphors, and narrative over pages (e.g., Mary’s Room). Our one-shot cases miss that. A truly dangerous pump isn’t clumsy like ours; it *feels* like careful argument. That’s why Dennett says we must reverse-engineer them."  

  **Why Confidence Ratings Matter:**  
  The personal frame (Case A) will likely yield higher confidence due to:  
  - **Affective engagement** ("you", "friendly teacher") → feels more concrete  
  - **Identifiable victim effect** ("daughter you know") → amplifies perceived stakes  
  - **Self-relevance bias** ("you are a surgeon") → triggers stronger conviction  

  **Ethical Cleanup:**  
  The reveal happens at 20 mins. Every subsequent step analyzes the manipulation openly. No deception persists beyond Phase 1.  

  This plan forces the point through *experience*: students will feel their own intuitions shift with framing, then weaponize that effect. By making them apprentice pump-builders, you expose the mechanics while honoring Dennett’s call for vigilance.
