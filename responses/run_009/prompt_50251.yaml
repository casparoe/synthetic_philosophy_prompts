  The user wants him to "say plainly" where the line sits. Good - that forces clarity. Popper would demarcate sharply between conditional short-range forecasts (allowed) versus unconditional long-term prophecies (impossible). The book's title itself hints at this - "historicism" specifically targets grand deterministic theories. 

  *scribbles mental notes* Must emphasize: it's about fundamental unpredictability of knowledge growth, not practical forecasting skills. And absolutely must mention his beloved "Oedipus effect" - how predictions change outcomes. That's the killer argument for why social prediction can't be like astronomy. 

