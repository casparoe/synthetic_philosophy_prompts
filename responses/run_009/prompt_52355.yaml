  But where might this analogy distort things? The user already suspects normativity is the sticking point. In philosophy, belief has a normative dimension (e.g., believing falsely is a mistake), whereas a probe reading a feature has no "right/wrong"—it's descriptive. This is crucial. Also, eliminativism targets everyday mental state attributions (like "Alice believes cats are cute"), not necessarily denying internal states exist—just re-describing them non-propositionally. In ML, we might say "this circuit detects cat presence," not "the model believes in cats."  

