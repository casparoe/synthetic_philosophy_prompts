  We are drafting a joint statement for two parties: Speaker A (the friend) and Speaker B (the user). 

  Speaker A's position: The meaning of a person's words is fixed entirely by what's in her head (intrinsic features of the individual speaker). This is an internalist view.

  Speaker B's position: The meaning of a person's words depends partly on the actual liquid in the speaker's environment and on facts about the community's usage (external factors, including the environment and the linguistic community). This is an externalist view.

  We are using the Twin Earth thought experiment as the test case.

  The document should have:

  1. A numbered section of claims both can accept (without begging the question).
  2. A table of precise residual disagreements, with each side accepting the wording as fair. The disagreements must cover at least:
     - What the 1750 Earthling meant by "water"
     - What the Twin Earthling meant by "water"
     - Whether the two meant the same thing
  3. The cruxes (key points of disagreement) with one concrete case or argument for each that both agree bears on the crux. For each crux, record each side's prediction in advance.

  Additionally, if any part of the dispute is verbal, point that out.

  Format:

  I. Agreed Claims (numbered list)

  II. Table of Disagreements

  III. Cruxes (with cases and predictions)

  Let's proceed.

  I. Agreed Claims:

  We both agree on the following non-question-begging facts about the Twin Earth scenario:

  1. In the year 1750, the planet Earth and Twin Earth are molecule-for-molecule identical except that the clear, drinkable liquid in the rivers, lakes, and oceans on Earth is H₂O, while on Twin Earth it is XYZ (a different chemical compound that is also clear, drinkable, and indistinguishable from H₂O by any means available in 1750).

  2. In 1750, no individual on Earth or Twin Earth, using the technology and scientific knowledge available at that time, could distinguish H₂O from XYZ.

  3. For any individual on Earth in 1750 (call her Alice) and her molecule-for-molecule identical counterpart on Twin Earth (call her Twin Alice), their internal states (including brain states, mental states, and any other intrinsic properties) are identical at the moment they each utter the word "water" in 1750.

  4. The linguistic communities on both planets in 1750 use the word "water" to refer to the clear, drinkable liquid that fills their respective rivers, lakes, and oceans.

  5. The word "water" in both communities is applied to samples of the local liquid in everyday situations (e.g., drinking, bathing) and is associated with the same observable properties (clear, odorless, tasteless, thirst-quenching, etc.).

  6. In 1750, neither community has any knowledge of the chemical composition of their respective liquids (H₂O on Earth, XYZ on Twin Earth).

  II. Table of Disagreements:

  We now state our residual disagreements. Each statement is phrased so that the respective side can accept the wording as fair.

  | Issue | Speaker A's Position (Internalist) | Speaker B's Position (Externalist) |
  |-------|-----------------------------------|-----------------------------------|
  | What the 1750 Earthling (Alice) meant by "water" | In 1750, when Alice said "water", she meant to refer to the clear, drinkable liquid with which she was acquainted, and the content of her concept was determined entirely by her internal states. Since her internal states included only the superficial properties (like being clear, drinkable, etc.), the reference of "water" for Alice was to any liquid that had those superficial properties, regardless of its chemical composition. | In 1750, when Alice said "water", she meant to refer to the actual substance in her environment that she (and her community) called "water". The reference of "water" for Alice was fixed by the actual nature of the liquid in her environment (which is H₂O) and the community's usage. Thus, "water" referred to H₂O, even though Alice did not know its chemical composition. |
  | What the 1750 Twin Earthling (Twin Alice) meant by "water" | In 1750, when Twin Alice said "water", she meant to refer to the clear, drinkable liquid with which she was acquainted, and the content of her concept was determined entirely by her internal states. Since her internal states were identical to Alice's, she meant the same as Alice: any clear, drinkable liquid with those superficial properties, regardless of its chemical composition. | In 1750, when Twin Alice said "water", she meant to refer to the actual substance in her environment that she (and her community) called "water". The reference of "water" for Twin Alice was fixed by the actual nature of the liquid in her environment (which is XYZ) and the community's usage. Thus, "water" referred to XYZ, even though Twin Alice did not know its chemical composition. |
  | Whether Alice and Twin Alice meant the same thing by "water" in 1750 | Yes, because they were in identical internal states and associated the same set of superficial properties with the word "water". Therefore, the meaning (or content) of "water" was the same for both. | No, because the reference of "water" was different: for Alice it referred to H₂O, for Twin Alice it referred to XYZ. Therefore, the meaning (which includes reference) was different. |

  III. Cruxes:

  We identify the following key points of disagreement (cruxes). For each, we present a concrete case that both agree bears on the issue, and then each side's prediction about the case.

  Crux 1: Whether sameness of all internal states can coexist with difference of meaning.

  Case: Consider a scenario where an Earth speaker (Bob) is transported to Twin Earth in 1750 without his knowledge (e.g., during sleep). Upon waking, he sees a glass of the clear liquid (which is XYZ) and says, "This is water." We ask: what does Bob mean by "water" at that moment?

  - Speaker A (Internalist) predicts: Bob's internal states are unchanged (he has the same memories and associations). Therefore, when he says "water", he means the same as he did on Earth: a liquid with the superficial properties. Since XYZ has those properties, he correctly applies the term. His meaning has not changed because it is determined solely by his internal states.

  - Speaker B (Externalist) predicts: Bob's environment has changed. The liquid in front of him is XYZ, and he is now embedded in a community that uses "water" for XYZ. Therefore, when he says "water", he now refers to XYZ. His meaning has changed because it depends on the environment and community, even though his internal states are the same.

  Crux 2: What role the linguistic community plays in determining meaning, as opposed to the individual.

  Case: Consider a scenario where a child (Charlie) is born and raised in isolation on a remote part of Earth (or Twin Earth) and has never interacted with the broader community. He has only encountered the local liquid (H₂O on Earth, XYZ on Twin Earth) and has independently started calling it "water". We ask: what does Charlie mean by "water"?

  - Speaker A (Internalist) predicts: Since Charlie has formed his own concept based on his experiences, and without any input from the community, the meaning of "water" for Charlie is determined solely by his internal states. He associates "water" with the liquid he has encountered and its properties. Therefore, on Earth, he means H₂O, and on Twin Earth, he means XYZ, but this difference is due to the different experiences that led to different internal states (even though if we consider an Earth-Charlie and a Twin Earth-Charlie, they would have different internal states because of different experiences). However, if we imagine that Charlie on Earth and Charlie on Twin Earth had identical experiences (so that they are internal duplicates) but in different environments, then Speaker A would say they mean the same thing (any liquid with those properties). But note: in this scenario, the isolated child hasn't interacted with the community, so the community doesn't play a role.

  - Speaker B (Externalist) predicts: Even in isolation, the child's use of "water" is grounded in the actual substance in his environment. On Earth, the liquid is H₂O, so "water" refers to H₂O. On Twin Earth, it refers to XYZ. The community's role is not essential in this case because the reference is fixed by the environment. However, if the child were later integrated into the community, the community would help maintain the reference over time. But in the isolated case, the environment still plays a role.

  But note: in the isolated child case, if the child has never interacted with the community, then the community doesn't play a role. So let's adjust the case to involve community usage more directly.

  Alternative case for Crux 2: Consider a scenario where a new substance is discovered mid-life. On Earth, in 1800, scientists discover that the substance they have been calling "water" is composed of H₂O. Meanwhile, on Twin Earth, they discover it is XYZ. Now, consider an individual (Diana) who has been using the word "water" all her life but has never learned the chemical composition. When Diana says "water" in 1800 (before the discovery is widely known), what does she mean? And does the community's eventual acceptance of the scientific discovery change what Diana meant in the past?

  - Speaker A (Internalist) predicts: Diana's meaning is fixed by her internal states. In 1800 (before the discovery), she associated "water" with superficial properties. Therefore, she meant any liquid with those properties. The community's later adoption of a scientific definition might change the meaning for future uses, but it does not change what Diana meant in the past.

  - Speaker B (Externalist) predicts: Diana's use of "water" in 1800 referred to H₂O because that was the actual substance in her environment and the community's usage. The scientific discovery reveals what she was referring to all along. The community's role is crucial in maintaining the reference, and the discovery does not change the past meaning but reveals it.

  We can use this second version for Crux 2.

  Is there a verbal dispute?

  We note that the term "meaning" might be used differently. For Speaker A, "meaning" is primarily about the individual's concept (which is in the head). For Speaker B, "meaning" is about reference and how the word is anchored in the world and community. Therefore, the disagreement about whether Alice and Twin Alice meant the same thing might be partly verbal: if by "meaning" one intends the individual's concept (narrow content), then they meant the same; if by "meaning" one intends the reference (wide content), then they did not. However, both sides take their respective notions of meaning to be the relevant one for the dispute.

  Thus, we can say:

  Verbal Dispute Note: Part of our disagreement may be verbal. Speaker A uses "meaning" to refer to the individual's internal concept (narrow content), while Speaker B uses "meaning" to refer to the reference and the external factors that determine it (wide content). However, we also have a substantive disagreement about which of these is the correct account of what determines the reference and the content of our words.

  Final Document:

  I. Agreed Claims:

  1. In 1750, Earth and Twin Earth are molecule-for-molecule identical except that the clear, drinkable liquid in Earth's rivers and oceans is H₂O and in Twin Earth's is XYZ.
  2. In 1750, no individual on either planet could distinguish H₂O from XYZ by any available means.
  3. Any individual on Earth in 1750 and her counterpart on Twin Earth are in identical internal states (including brain states and mental states) at the time of using the word "water".
  4. Both linguistic communities in 1750 use the word "water" to refer to the clear, drinkable liquid in their respective environments in everyday situations.
  5. The word "water" in both communities is associated with the same observable properties (e.g., clear, odorless, tasteless, thirst-quenching).
  6. In 1750, neither community has knowledge of the chemical composition of their respective liquid.

  II. Table of Disagreements:

  | Issue | Speaker A (Internalist) | Speaker B (Externalist) |
  |-------|-------------------------|-------------------------|
  | What the 1750 Earthling (Alice) meant by "water" | Alice meant to refer to any liquid that possesses the superficial properties she associated with "water" (e.g., clear, drinkable, etc.), regardless of chemical composition. | Alice meant to refer to the actual substance in her environment, which is H₂O, even though she did not know its chemical composition. |
  | What the 1750 Twin Earthling (Twin Alice) meant by "water" | Twin Alice meant to refer to any liquid that possesses the same set of superficial properties, regardless of chemical composition. | Twin Alice meant to refer to the actual substance in her environment, which is XYZ, even though she did not know its chemical composition. |
