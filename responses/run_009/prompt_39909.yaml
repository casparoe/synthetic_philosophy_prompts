  III. Cruxes:

  Crux 1: Can sameness of internal states coexist with a difference in meaning?

  Case: Bob, an Earth speaker, is transported to Twin Earth in 1750 without his knowledge. Upon waking, he sees a glass of the local liquid (XYZ) and says, "This is water." What does Bob mean by "water" at that moment?

  - Speaker A's prediction: Bob means the same as he did on Earth: a liquid with the superficial properties. Thus, he correctly applies "water" to XYZ because it has those properties. His meaning is unchanged.
