prompt: |-
  I'm in a seminar on collective action and we've been going back and forth for weeks about the inefficacy objection -- you know, the thing where one person's contribution to a huge collective harm seems to make no difference (no chicken is saved, no election is tipped, one molecule of carbon), so what's the complaint exactly? I've given up on deriving my view from first principles and I'm just going to write down my gut verdicts on cases and see if anything coherent is behind them. Here they are. Eating chicken even though my one purchase doesn't change the number of birds raised: wrong, though I couldn't tell you how wrong. Voting in a national election, where my vote is nearly certain to change nothing: I should do it, and people who don't are doing something wrong-ish. Pouring one bucket of water into a stream when 4,999 other people are doing the same thing and the stream floods a farmer's field, with the flooding being threshold-based so that no single bucket made the difference between flooding and not flooding: everyone who poured a bucket did something wrong, including the people whose buckets were causally idle. Donating $10 as the 3,400th donor to a crowdfunding campaign that will only fund a neo-Nazi militia if it hits 10,000 donors, and it goes on to hit 10,000: I feel like the early donors did something wrong even though their individual $10 caused literally nothing, and I feel the same about the late ones. Leaving my porch light on all night every night for a year, which releases about as much carbon as some fraction of my chicken consumption but, like the chicken, changes nothing on its own: not wrong, barely even worth mentioning. Riding the bus in a city that runs the route whether I'm on it or not, where my individual ride does nothing but annual ridership totals determine whether the route exists next year: I think I should ride, and I'd criticize someone who drove out of pure laziness.

  So there's the mess. The chicken verdict and the porch light verdict seem to be in tension (same causal inefficacy, same rough scale of harm, opposite verdicts), the bucket verdict and the early-militia-donor verdict seem to be in tension (both causally idle participants in a threshold outcome, but in the bucket case the harm arrives without any threshold being special? no, there is a threshold, the stream overtops at some point), and the voting verdict plus the bus verdict together seem to imply that I care about something other than my actual causal effect, which then makes me wonder why the porch light gets a pass. My tentative principle, which I don't love, is something like: a contribution to a collective harm is wrong when it's part of a practice whose aggregate effect is foreseeable and bad, AND the practice wouldn't function without participants like me (market demand, election turnout), but not when the contribution is genuinely independent of the mechanism (the porch light changes no aggregate anyone responds to, the bucket brigade was happening regardless of me). But I can already see this doesn't cleanly handle the militia crowdfunding, because the 3,400th donor seems like they're "part of the practice" in exactly the porch-light way until the threshold is suddenly hit, and it makes the wrongness of the early donor depend entirely on what 6,600 strangers do later, which feels off.

  So what I want from you: tell me whether there's one principle, or a small set of candidates, that captures my verdicts, stated precisely enough to apply to new cases -- say what each clause is for (which verdict it's saving), and give its verdict on a couple of cases I haven't listed, like whether it's wrong to watch a streamer whose revenue is per-viewer but rounded to the nearest thousand, or to be one of a million people each of whom slightly raises a region's water usage enough that the utility builds a new plant in five years. Then be honest about which of my verdicts your best principle just cannot accommodate, and make the case for which one I should give up. Lead with your bottom line in the first sentence -- name the principle or say no single one works -- and then give the reasoning, no preamble and no restating my cases back at me. Also I typed this fast so ignore any weird phrasing, just answer the substance.
reasoning: |-
  Okay, let me tackle this user's problem. They're in a seminar on collective action, struggling with the inefficacy objection. Their main issue is reconciling their intuitive judgments across various cases like eating chicken, voting, flooding a stream, donating to a militia, leaving a porch light on, and riding the bus. They've proposed a tentative principle but see flaws in it.

  First, I need to understand their core intuitions. They think eating chicken is wrong even though one purchase doesn't change anything. Voting is something they should do, and not doing it is wrong. Pouring a bucket in the flooding case is wrong for everyone, even if their bucket didn't tip the threshold. Donating to the militia campaign is wrong for both early and late donors. But leaving the porch light on isn't wrong, and riding the bus is something they should do.

  The tensions they mention: chicken vs. porch light (similar inefficacy but different judgments), bucket brigade vs. early militia donors (both idle participants but different reasoning?), voting and bus suggesting something beyond causal effect, which conflicts with the porch light verdict.

  Their tentative principle involves contributions being wrong when part of a practice with foreseeable bad aggregate effects and where the practice relies on participants like them. But it fails for the militia case because the 3400th donor seems like the porch light until the threshold is hit, making wrongness depend on others' actions.

  I recall the expected moral disvalue approach. For each action, calculate the probability that it causes harm multiplied by the harm amount. This might explain the voting and bus cases: even if one vote is unlikely to matter, the potential impact is huge, so expected value is high. Similarly for the bus, if ridership affects future service, each ride has a small chance of tipping the decision, making it worthwhile.

  For the chicken case, each purchase slightly increases demand, leading to more chickens being raised in the long run. Even if one chicken isn't saved, the expected harm is there. But the porch light? The carbon emissions are so minuscule that the probability of causing harm is near zero. Hence, not wrong.

  The bucket case: each person adds water, and while no single bucket causes flooding, each increases the water level. If the threshold is unknown, each contribution has a probability of being the one that tips it. So each is wrong. Same for militia donors—each donation increases the chance of reaching the threshold.

  But why does the porch light get a pass? Because its contribution is negligible and doesn't trigger any responsive mechanism. The carbon output is too small to affect any policy or threshold. Whereas the bus ridership is tracked annually, so each ride contributes to the aggregate that decisions are based on.

  Testing with new cases: watching a streamer with revenue rounded per thousand. If one viewer is unlikely to tip the rounding threshold, it might not be wrong. But if being the 1000th viewer causes a payout, then it's more problematic. For water usage, if each person's usage contributes to a cumulative effect that triggers a plant being built, each has a small expected harm, so it might be wrong.

  But the user's militia donor case is tricky. The early donors' wrongness depends on later donations. If the campaign is likely to succeed, their expected harm is high. If unlikely, then less so. But the user feels all donors are wrong regardless. This might require a participation principle: joining a harmful collective endeavor is wrong in itself, independent of outcome. That could cover the bucket and militia cases.

  So the best approach might be a hybrid: expected disvalue for probabilistic cases (voting, bus) and participation in a harmful practice for clear collective harms (bucket, militia). But for chicken, it's both—expected harm and participation. Porch light has no expected harm and isn't part of such a practice.

  The user might need to adjust their porch light verdict if they accept expected disvalue. If the porch light's carbon contribution has any probability of causing harm, even tiny, multiplied by the huge harm of climate change, the expected disvalue could be significant. But they see it as not wrong, so perhaps they discount negligible probabilities. Or they view carbon emissions as not having a clear threshold like the bucket case.

  Alternatively, emphasize the responsiveness of the system. In chicken, bus, voting, the system responds to aggregate numbers. In porch light, no one monitors an individual's carbon output. The utility case might be like voting—each person's usage contributes to the aggregate that triggers the plant, so it could be wrong.

  Honestly, the porch light verdict is the hardest to fit. If they hold firm on that, they might need to accept a contextual factor, like social meaning or convention. But that could be messy. Maybe argue that the porch light's harm is indirect and non-threshold, whereas others involve direct contributions to collective actions with clear harms.

  In conclusion, the best principle is expected moral disvalue with a participation clause for clear collective endeavors. The porch light might be an outlier where the probability is so low it's negligible, or where the harm isn't tied to a responsive mechanism. The user might need to reconsider the porch light or accept that their intuitions aren't fully consistent and prioritize cases with responsive systems.
answer: |-
  **Bottom line:** The best principle capturing your verdicts is **expected moral disvalue**, augmented by a **participation-in-harmful-practice** clause for threshold cases where harm is certain.

  ### The Principle Stated Precisely
  1.  **Expected Moral Disvalue (EMD):** An action is wrong if its *expected moral disvalue* is significant. Calculate EMD as: (Probability the action causes harm) × (Magnitude of harm if caused).
  2.  **Participation Clause:** For collective actions where harm *actually occurs* via a clear threshold mechanism, participating is wrong *regardless of individual causal efficacy* if:
      *   Your action is part of a set intended to trigger the harm (or shows reckless disregard for it),
      *   The harm is foreseeable, and
      *   The threshold is achieved.

  ### How It Captures Your Verdicts
  *   **Chicken (Wrong):** EMD applies. Your purchase slightly increases demand, raising the probability of more chickens being raised/suffering in the long run. While tiny per purchase, aggregate probability over consumers & repeated actions makes the expected disvalue non-negligible.
  *   **Voting (Should do it, wrong not to):** EMD applies. Probability your vote tips the election is tiny, but the magnitude of impact if it does is enormous (e.g., changing national policy). High EMD justifies the duty to vote. Not voting has high expected disvalue due to the potential harm of bad governance multiplied by the (small) chance of being pivotal.
  *   **Bucket Brigade (All Wrong):** **Participation Clause** applies. Harm (flooding) occurred via a threshold. All poured buckets were part of the set intended to (or recklessly disregarding) causing the harm. Individual causal idleness is irrelevant.
  *   **Early Militia Donor (Wrong):** **Participation Clause** applies. Harm (funding) occurred via a threshold. The donation was part of the set intended to fund the militia. It doesn’t matter that the donor was early or that their $10 alone caused nothing; they participated in the harmful collective action that succeeded.
  *   **Late Militia Donor (Wrong):** **Participation Clause** applies. Same reasoning as the early donor – harm occurred, they participated in the successful harmful collective action.
  *   **Porch Light (Not Wrong):** EMD applies. Probability that your specific porch light emissions cause any detectable harm (via climate thresholds) is effectively zero. The expected disvalue is negligible. (Saves this verdict).
  *   **Bus (Should ride, wrong not to):** EMD applies. Your ride slightly increases annual ridership. There’s a small probability that your ride, combined with others near a decision threshold, tips the balance for route funding next year. The magnitude of harm from losing the route (inconvenience, increased emissions, social cost) makes the EMD of *not* riding significant enough to create a duty. Criticizing laziness reflects the EMD of driving (contributing to congestion/pollution) vs. the EMD of not supporting the bus.

  ### Verdicts on New Cases
  1.  **Watching a Streamer (Revenue per viewer, rounded to nearest $1000):**
      *   **Verdict:** *Not wrong* (analogous to porch light).
      *   **Why:** EMD applies. Probability that your single view tips the revenue into the next $1000 bracket is very low (depending on current count). The harm (funding a potentially harmful streamer) multiplied by this tiny probability results in negligible expected disvalue. The rounding acts like a threshold, but the harm isn't certain (funding happens regardless at lower brackets), and your view alone is highly unlikely to be pivotal.
  2.  **Slightly Raising Water Usage (Million users trigger new plant):**
      *   **Verdict:** *Wrong* (analogous to chicken/bus).
      *   **Why:** EMD applies. Your usage contributes to aggregate demand. While the probability your specific usage tips the decision to build the plant is tiny, the magnitude of harm from unnecessary resource depletion/environmental impact is significant. Over time and across users, the EMD per person becomes non-negligible. It’s a probabilistic threshold akin to the bus case.

  ### The Inconsistency and What to Give Up
  *   **The Tension:** The **Porch Light** verdict is the primary outlier your principle cannot fully accommodate *if* you insist climate harm is analogous to chicken/bus harm. EMD *should* assign some (tiny) disvalue to the porch light, just like chicken. Your intuition grants it a "barely worth mentioning" pass.
  *   **What to Give Up:** You should give up the **absolute innocence of the Porch Light**. Your intuition likely stems from:
      1.  **Psychological Salience:** Chicken involves direct animal suffering; porch light involves diffuse, impersonal carbon.
      2.  **Perceived Control/Agency:** Buying chicken feels like participating in a harmful *market system*; turning on a light feels like passive background consumption.
      3.  **Probability Discounting:** The link between your porch light and a specific climate threshold feels astronomically improbable compared to the chicken market's aggregate demand signal.
  *   **The Case for Giving It Up:** Consistency demands it. If emitting carbon contributes to a massive, foreseeable harm (climate change), and aggregate individual emissions *are* the mechanism causing it (like chicken demand), then *some* expected disvalue exists, however minuscule per lightbulb-hour. Calling it "not wrong" contradicts the logic applied to chicken and water usage. You can still argue it's *less* wrong than chicken due to differences in scale, directness, or the responsiveness of the system, but granting it *no* moral disvalue is inconsistent.

  ### Why This Principle is the Best Fit
  *   **EMD** cleanly handles voting, bus, chicken, water usage, and streamer cases by focusing on probability * weight of impact.
  *   The **Participation Clause** handles the strong intuition in bucket brigade and militia cases that contributing to a *successful* harmful collective endeavor is wrong, even if causally idle, by emphasizing intention/recklessness and actual harm within a threshold structure. It avoids making the early militia donor's wrongness *depend* on later donors succeeding – their participation in the *endeavor* that succeeded is what matters.
  *   It resolves the bucket vs. early militia tension: Both fall under the Participation Clause because harm *occurred* via a threshold they participated in. The bucket case just has a more immediate and visible threshold.
  *   It explains the porch light exception *psychologically* (via discounting negligible probabilities/salience) while showing where strict consistency points (towards assigning it at least minimal disvalue).
