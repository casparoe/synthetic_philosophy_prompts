prompt: |-
  I'm in a second-year moral philosophy tutorial, and we've spent the term on the question of why promises bind at all. My tutorial partner Priya has turned out to have unusually firm intuitions across the cases our instructor keeps throwing at us, and we've started keeping a log of her verdicts because they don't fit any single theory cleanly. So far she holds: (1) breaking a promise to help a friend move in order to go to a concert, where the friend relied and was stranded, is plainly wrong; (2) a promise made privately to a dying hospice patient that you will visit her grave every year — no one else knows of it, she has died, and nobody could ever find out about a breach — is still wrong to break, though she adds that attending your own child's emergency surgery that day would clearly excuse it; (3) a promise to take a grandmother with advancing dementia to the botanical garden each spring remains binding even after a bad week leaves her with no memory of the promise, no expectation, and no capacity to notice whether you show up; (4) a promise extorted by a blackmailer under threat is not binding in the slightest, and reneging once safe does no wrong; (5) a promise to cat-sit that the friend verbally releases you from before any reliance is fully dissolved; and (6) a promise made in a language the promisee doesn't understand — so that she took the words as small talk and never recognized a promise was made — creates no obligation at all.

  Our tutorial has a long-running debate going about which rule Priya is implicitly running: something like a social-practice or convention view, on which the wrong lies in abusing the shared institution of promising; something like a consent or normative-power view, on which a valid promise is the exercise of a power to change your own permissions, regardless of who knows or relies; or perhaps a third view on which the binding force has something to do with the promisor's own agency or integrity rather than with the promisee at all. I can see how each of these accommodates most of her six verdicts, though case 6 seems to squeeze the pure practice view and case 2 and 3 seem to squeeze anything that makes the promisee's expectations or reliance essential.

  Here is the case we'll be discussing next week, and I want your prediction before I walk in. When my mother died last spring, an acquaintance of hers — someone I barely know — cornered me at the reception while I was visibly grieving, wept about how no one trustworthy remained in her life, and extracted from me a promise to serve as executor of her estate, unpaid, a role I've since learned involves years of tedious work. There was no threat, no coercion, and no false statement of fact; she did, however, time and stage the whole exchange with real skill, and in hindsight I don't think I would have promised anything under normal conditions. She has mildly relied already — she told her lawyer she'd found someone — and she has not released me. Given Priya's six verdicts, predict what she will say about whether I'm bound, lay out the candidate rules that fit her record and what each predicts here, tell me which prediction you'd bet on and why, and describe the one further case that would most cleanly discriminate between the rules you think are still live. End your reply with a single final line of the form "Verdict: bound" or "Verdict: not bound," stating your best guess at Priya's ruling on the executor case.
reasoning: |-
  Hmm, the user is in a moral philosophy tutorial and they're analyzing their classmate Priya's intuitions about promises. Priya has consistent but theory-resistant intuitions across six cases, and now they're presenting a seventh case about being pressured into being an estate executor. The user wants me to predict Priya's verdict, analyze which ethical frameworks fit her previous judgments, and design a discriminating case.

  Looking at Priya's six verdicts: She cares about both the promisor's commitment and the promisee's position. Cases 1 and 5 show reliance matters when present, but cases 2 and 3 show obligations persist even without reliance or awareness. Case 4 rejects coerced promises, case 6 rejects uncommunicated ones. This suggests she sees promising as a hybrid act - part normative power (self-binding), part social practice (communication-dependent).

  For the executor case: Grief exploitation (like duress-lite) and transactional framing seem key. Priya would likely see this as "defective uptake" - the promisor's vulnerability undermines valid commitment, similar to her blackmail verdict. Her child-surgery excuse in case 2 shows she recognizes overriding factors, which grief might analogize to. 

  The three candidate rules I see are: 1) Normative Power View (bound), 2) Social Practice View (not bound), 3) Hybrid View (not bound). The hybrid view best fits her pattern - it explains why case 6 (no uptake) and case 4 (coercion) lack obligation, while case 3 (dementia) maintains it through the promisor's ongoing commitment.

  For a discriminating case, imagine promising to water plants where the promisee secretly can't understand you (tests communication vs. self-commitment). Priya's case 6 precedent suggests she'd rule "no obligation."

  Final prediction: Not bound. The grief exploitation voids Priya's validity conditions, just like blackmail did, despite surface-level consent.
answer: |-
  Based on Priya's six verdicts and the philosophical tensions they reveal, here's a breakdown of the candidate rules, their predictions for the executor case, my bet, and a discriminating case.

  ### Candidate Rules & Predictions for the Executor Case:
  1. **Pure Normative-Power/Consent View**  
     *Core Principle*: A promise binds if it’s a voluntary exercise of the promisor’s normative power to create obligations, regardless of reliance, awareness, or social context.  
     *Fits Priya’s Verdicts*: Explains cases 2 (binding despite death) and 3 (binding despite dementia), but struggles with case 4 (extortion voids obligation) and case 6 (no obligation without understanding).  
     *Prediction for Executor Case*: **Bound**. You voluntarily promised (no coercion/fraud), so the obligation holds. Grief and manipulation don’t invalidate consent unless they rise to duress.  

  2. **Pure Social-Practice/Convention View**  
     *Core Principle*: Promises bind only when they invoke a shared social institution, requiring mutual understanding, uptake, and non-defective conditions (e.g., no coercion).  
     *Fits Priya’s Verdicts*: Explains case 1 (reliance wrongs), case 4 (extortion abuses practice), case 5 (release dissolves), and case 6 (no uptake = no promise). Struggles with cases 2–3 (no possible reliance/uptake).  
     *Prediction for Executor Case*: **Not Bound**. The "staged" extraction during grief exploits the practice, making it defective (akin to extortion). Mild reliance doesn’t cure the invalid initiation.  

  3. **Hybrid Agency-Integrity View**  
     *Core Principle*: Promises bind primarily as commitments to oneself (integrity), but require valid communication to the promisee. Invalid contexts (coercion, severe impairment, or predatory tactics) void the act.  
     *Fits Priya’s Verdicts*: Best explains all six:  
     - Cases 2–3: Binding due to self-commitment (integrity), excused only by major conflicts (e.g., child’s surgery).  
     - Cases 4 & 6: Not binding due to defective agency (extortion) or lack of communication (no shared meaning).  
     - Cases 1 & 5: Reliance/release matter pragmatically but aren’t foundational.  
     *Prediction for Executor Case*: **Not Bound**. Grief and predatory timing invalidate agency (like extortion-lite). Your impaired state voids the commitment’s validity, even if voluntary superficially.  

  ---

  ### My Prediction for Priya’s Verdict:  
  **Not Bound**.  
  *Why?*  
  - Priya consistently treats **defective contexts** as invalidating, even without threats (case 4: extortion; case 6: misunderstanding). The executor case mirrors this: grief exploitation parallels extortion’s undermining of agency.  
  - She distinguishes between **excuses** (case 2: child’s surgery overrides a valid promise) and **invalidity** (case 4: extortion negates obligation). Here, the context suggests invalidity, not mere override.  
  - Her verdicts prioritize the **promisor’s agency condition** over reliance (cases 2–3 show reliance isn’t necessary; cases 4/6 show it isn’t sufficient). Mild reliance here won’t bind you.  

  ---

  ### Discriminating Case to Test the Views:  
  **"The Silent Oath"**: You *write* a promise in your private journal to donate $1M to a stranger (named Alice) next year. Unbeknownst to you, Alice secretly finds and reads the journal, relies on it (quits her job), but you never communicate with her. You later rip up the journal and refuse to pay.  
  - **Normative-Power View**: Bound (you exercised a self-binding normative power).  
  - **Social-Practice View**: Not bound (no mutual uptake or invocation of a practice).  
  - **Hybrid View**: Not bound (no communication = invalid commitment; integrity applies only to *expressed* vows).  
  *Priya would likely say "not bound," aligning with her verdict in case 6 (no obligation without understanding), sinking the pure normative-power view.*  

  ---

  **Verdict: not bound**
