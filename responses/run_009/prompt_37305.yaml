  3. **Hidden Commitments**: Both sides agree on data (free will, evil, providence) but not on what counts as an explanation. Objectors need causal/metaphysical grounding; Molinists accept conceptual/brute facts. This traces to deeper stances: e.g., objectors might prioritize divine aseity (God’s independence), while Molinists prioritize libertarian freedom. 

