  1. **Semantics vs. Metaphysics**: The grounding objection is metaphysical—it demands what makes counterfactuals true. Molinists respond with semantic moves (e.g., brute facts). This isn't just packaging; it's a clash of priorities. For objectors, truthmaking is non-negotiable; for Molinists, it's secondary to theological coherence. 

