answer: |-
  Here's a case built to your specifications: **The Expert Simultaneous Interpreter in Flow State Fatigue.**

  ### The Scenario
  Maria is a veteran UN simultaneous interpreter (Spanish/English). After 6 hours of intense, high-stakes negotiations, she's deeply fatigued but operating in a highly automated "flow state." During a complex technical segment on climate modeling, her conscious attention is fully occupied by the *next* sentence's syntactic structure and vocabulary search. However, the *current* sentence ("...forcing agents exhibit nonlinear feedback loops exceeding IPCC projections...") is processed automatically by her expertise.

  Crucially:
  1.  **No Real-Time Awareness:** Maria feels *nothing* phenomenally associated with hearing/processing *this specific sentence*. Her subjective experience is entirely consumed by the effortful construction of the next output. There is no "what it's like" for her to hear those words *at that moment*.
  2.  **Full Delayed Access:** 2 seconds later, when the negotiation pauses, Maria is asked: "What was the last thing said about feedback loops?" She instantly, effortlessly, and accurately reports the *verbatim sentence* and adds: "Yes, that aligns with Section 3.2 of the latest assessment report, though the delegate overstated the certainty." She reasons about its implications for the negotiation strategy.

  ### Why This Fits Your Constraints
  *   **Plausible & Present-Day:** Human experts in high-automation tasks under fatigue are common. No sci-fi, surgery, or hypothetical discoveries.
  *   **No Stipulation of No Feeling:** The absence of phenomenality is inferred from the *structural features*: total attentional capture by a separate task + expert automation + fatigue-induced reduction in phenomenal richness. We describe her *subjective state* (feeling consumed by the next sentence), not decree "no feeling for X."
  *   **Avoids Zombies/etc.:** Maria is a normal human. No rewiring, inversions, or undetectable duplicates.

  ---

  ### (a) Walking the GWT Checklist (Dehaene/Standard Version)
  GWT defines consciousness by *global availability* of information for:
  1.  **Global Broadcast:** ✔️ The sentence *was* globally available. It reached:
      *   **Working Memory:** ✔️ Held accurately for report/reasoning 2s later.
      *   **Long-Term Memory:** ✔️ Associated with the relevant IPCC report section.
      *   **Planning Systems:** ✔️ Used to reason about negotiation strategy implications.
      *   **Verbal Report:** ✔️ Accurately reported verbatim and elaborated upon.
  2.  **Reportability:** ✔️ Explicit, accurate, immediate (upon query) verbal report.
  3.  **Flexible Routing/Control:** ✔️ Information was accessed flexibly for report, semantic association, and strategic reasoning.
  4.  **Late Amplification (Dehaene-specific):** ⚠️ *Contested.* Dehaene often links consciousness to late-stage amplification enabling *report within ~300ms*. Maria couldn't report *during* the sentence, but could instantly after the pause. Some GWT proponents (e.g., Baars) accept delayed reportability as evidence of prior global availability. This is a potential friction point flagged below.
  **Verdict:** By standard GWT criteria (especially Baars/BLOCK's original formulation focusing on *availability*, not instantaneous report), Maria's processing of the sentence *satisfies the checklist for access consciousness*. It was globally available, reportable, and usable for cognition.

  ---

  ### (b) Theoretical Verdicts
  1.  **Global Workspace Theorist (GWT - Baars/Block flavor):**
      *   **Should Say:** "The sentence *was* conscious (access-conscious). It was globally available within Maria's cognitive system, as proven by her immediate, accurate report and reasoning when queried. The fact that her phenomenal attention was captured by the *next* sentence doesn't negate the global availability and hence access consciousness of the *current* one. Consciousness *is* global availability."
      *   **GWT (Dehaene flavor - stricter on timing):** "Without the *ability* to report *during* the stimulus presentation (due to attentional capture), and given the ~2s delay, we cannot confirm the *precise moment* of conscious access met the neural signature (e.g., P3b wave, sustained fronto-parietal activity). It might have been subliminal processing later retrieved. The case is ambiguous under my stricter timing criteria." *(Flags contested interpretation within GWT)*.
  2.  **Higher-Order Thought (HOT) Theorist (e.g., Rosenthal):**
      *   **Should Say:** "For the sentence to be *phenomenally* conscious, Maria would need a (non-inferential) higher-order thought representing her *as hearing/understanding* that sentence *at the time*. Her HOTs were entirely focused on constructing the next output. There was no HOT directed *at* her state of hearing that sentence. Therefore, even if it was access-conscious (globally available), it lacked *phenomenal* consciousness. Nothing *felt like* hearing it because there was no meta-cognitive 'take' on it."
  3.  **Block-style Reasoning:**
      *   **Should Say:** "This is a real-world analogue of superblindsight. Maria exhibits sophisticated cognitive access (report, reasoning) to the content of the sentence *without* any corresponding phenomenal consciousness *at the time of processing*. Her subjective experience was 'filled' by the effort of the next sentence. This demonstrates the dissociation: Access Consciousness (A) without Phenomenal Consciousness (P). The 'report' leverages preserved cognitive access traces, not the re-living of a phenomenal experience."

  ---

  ### (c) The Key Feature & Its Removal
  *   **Feature Doing the Work:** **Complete Attentional Capture by a Separate, Effortful Task Coupled with Expert Automation.** Maria's *phenomenal field* is monopolized by the effortful construction of the next output. The expert processing of the current sentence happens *automatically* and *outside* this field of phenomenal attention.
  *   **If Removed:** If Maria *weren't* attentively focused on the next sentence (e.g., if she was passively listening), she would likely have a phenomenal experience of hearing/understanding the sentence. If the processing *wasn't* automated (e.g., a novice interpreter), the effort itself would generate phenomenality (frustration, effort). Removal collapses the dissociation – phenomenality and access likely coincide.

  ---

  ### (d) Strongest GWT Bullet-Biting Attack
  A committed GWT defender (Baars/Block flavor) wanting to keep Maria's processing of *that sentence* conscious **must argue**:

  "Maria's report and reasoning *demonstrate* that the information *was* globally available at time T (when the sentence was spoken). GWT defines consciousness *as* global availability/integration for flexible use. The fact that her *phenomenal report* (her introspection) *now* tells her she wasn't subjectively experiencing it at T is irrelevant or mistaken. Consciousness *just is* the global workspace activity. Introspection is fallible and often conflates access with attention. The cognitive access *is* the consciousness. If the information was globally available enough to be accurately reported and reasoned about seconds later with no new input, it *was* conscious at T. The 'no phenomenality' intuition is a misunderstanding stemming from conflating consciousness with *focal attention* or *introspective vividness*, which are separable components. Maria *was* conscious of the sentence; she just wasn't *attending* to it phenomenally in a way she can introspectively recall because attention was overloaded. The access *constitutes* the minimal form of consciousness."

  **This attack's core:** Denying the dissociation by *identifying* access consciousness *with* (the relevant form of) consciousness itself and dismissing intuitions about absent phenomenality as errors about attention or introspection. It upholds GWT's functional definition as primary.

  ---

  ### Conclusion & Contested Ground
  *   **The Case:** The Expert Interpreter scenario plausibly satisfies your constraints. It generates an intuition of access without phenomenality based on structural features (attention, automation, fatigue) without stipulation or exotic elements.
  *   **Contested Ground Explicitly Flagged:**
      *   **Access/Phenomenal Distinction:** HOT theorists accept it; some GWT proponents (especially those leaning reductive) might deny P exists independently or that this case shows a dissociation.
      *   **GWT Variations:** Dehaene's emphasis on *immediate reportability* and specific neural signatures creates ambiguity in this case. Baars/Block's broader focus on *availability* makes the case cleaner for A-without-P.
      *   **The Verdict:** Whether this case *successfully* demonstrates A-without-P depends entirely on whether one accepts:
          1.  The Access/Phenomenal distinction is valid (Block/HOT say yes; some GWT may say no).
          2.  Global availability *at T* is proven by delayed report/reasoning *without* requiring report *at T* (Baars/Block GWT: yes; Dehaene GWT: maybe not).
          3.  The "no phenomenality" intuition is reliable and points to a genuine absence (Block/HOT: yes; Bullet-biting GWT: no, it's a confusion).

  This case doesn't *settle* the debate, but it creates a robust, real-world pressure point where the theories *must* diverge in their verdicts based on their core principles, meeting your seminar's needs.
