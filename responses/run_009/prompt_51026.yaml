prompt: |-
  I've been thinking about when I should just believe what people tell me, and my gut is pretty consistent but I can't figure out the rule behind it. When the pilot says the plane's fine, I believe it instantly and would feel like an idiot demanding evidence. When a stranger gives me directions I usually take their word. When a historian tells me what happened in ancient Rome I believe them, even though literally every bit of it is second hand and I could never check any of it myself. When my uncle -- great with engines, really smart guy -- tells me vaccines are risky, I dont believe him. When my best friend says he saw a UFO, I don't believe that either, even though I'd trust him with my life about most things. And wierdly I trust Wikipedia on random facts more than I trust any single smart person I know. Is there one principle that gets all of these? "Trust unless you have reason not to" saves the pilot and the stranger, but it seems like it should make me trust my uncle and my friend too, unless "reason not to" is allowed to just mean vibes. If the rule is more like "trust experts in their own domain," then how do I believe the historian, since the past isn't really anyone's domain, and why does Wikipedia count as an expert when it's just a pile of anonymous people? Tell me what principle (or principles) fits, what it says about a case I can't decide -- a very sincere mechanic telling me my car needs a repair I have no way to assess -- and honestly, which of my gut calls would it force me to give up?
reasoning: |-
  Okay, the user is trying to figure out a consistent principle for when to trust what people tell them. They've listed various scenarios where their gut feeling says to trust or not trust, but they can't see the underlying rule. Let me break down their examples.

  First, they trust the pilot about the plane, a stranger for directions, and a historian about ancient Rome. But they don't trust their uncle on vaccines or their friend's UFO sighting. They also trust Wikipedia more than a single smart person. Their gut seems consistent, but they want to know the principle behind it.

  The user mentioned "trust unless you have reason not to," but that doesn't explain why they dismiss their uncle and friend. They also considered "trust experts in their domain," but historians deal with the past, which isn't a tangible domain, and Wikipedia isn't an individual expert. So those principles don't fully fit.

  Hmm, maybe it's about the source's reliability and the consensus backing the claim. For the pilot, there's institutional trust (airlines, regulations) and expertise. The stranger giving directions is low-stakes and easily verifiable later. Historians rely on evidence and peer review, even if it's secondhand. But the uncle on vaccines contradicts scientific consensus, and the UFO claim lacks evidence and goes against established knowledge. Wikipedia works because it aggregates reliable sources and has community oversight.

  The user also mentioned a sincere mechanic. Even if sincere, the mechanic might have a conflict of interest (upselling repairs). So the principle here would involve checking for consensus (second opinion) or transparency in the diagnosis.

  The user's gut reactions align with evaluating the reliability of the source and the consensus around the claim. They'd need to give up absolute trust in individual sincerity or expertise when it conflicts with broader evidence. For example, trusting their uncle on engines but not on vaccines because the latter is outside his expertise and against consensus. Or trusting the friend generally but not on UFOs due to lack of corroborating evidence.

  So the core principles are epistemic humility (trust systems over individuals), consensus (agreement among experts), and source reliability (expertise, evidence, institutional backing). The mechanic scenario would require seeking a second opinion or evidence, aligning with these principles. The user might need to accept that sincerity alone isn't enough without these other factors.
answer: |-
  Your gut is onto something powerful: **it's not just about trusting individuals, it's about trusting *systems* and *evidence-based consensus*.** The single principle that best fits your examples is:

  **Trust claims proportional to the *consensus of relevant expertise* supported by *verifiable evidence and reliable processes*, and be skeptical of claims that significantly contradict this consensus without robust, accessible evidence.**

  Let's break down your examples using this principle:

  1.  **Pilot:** You trust because:
      *   **Consensus:** Aviation safety is based on massive, global consensus among engineers, regulators, and pilots themselves, backed by rigorous science and data.
      *   **Processes:** Pilots undergo intense standardized training, certification, and operate within strict protocols and maintenance logs you assume are followed. The *system* is trustworthy, not just the individual.
      *   **Evidence:** While you don't see the evidence, you know the processes exist to generate and act on it (pre-flight checks, maintenance records).

  2.  **Stranger Giving Directions:**
      *   **Low Stakes/Easy Verification:** The potential harm is low, and you can often partially verify ("Turn left at the next big street? Okay, I see it"). It's a pragmatic social convention that usually works. Trust is provisional and easily corrected.

  3.  **Historian:**
      *   **Consensus & Process:** Historians don't work alone. They rely on a *methodology* – source criticism, archaeology, cross-referencing accounts, peer review. You're trusting the *scholarly consensus* built through this rigorous, evidence-based process within the academic *system*. While evidence is "second hand," the methods *are* the tools for assessing it critically.
      *   **Domain:** The "domain" is the *methodology and body of evidence* about the past, managed by the historical profession.

  4.  **Uncle on Vaccines:**
      *   **Contradicts Consensus:** His claim goes against the overwhelming consensus of immunologists, virologists, epidemiologists, and public health bodies worldwide, built on mountains of clinical trial data and ongoing surveillance.
      *   **Outside Domain:** Engine expertise ≠ vaccine expertise. The relevant consensus lies elsewhere.
      *   **Lack of Process:** His opinion likely isn't formed through peer-reviewed literature or systematic evaluation of the vast evidence.

  5.  **Friend on UFO:**
      *   **Contradicts Consensus/Extraordinary Claim:** UFO sightings as extraterrestrial craft contradict established scientific understanding without extraordinary evidence.
      *   **Anecdote vs. Evidence:** A single eyewitness account, even from a trusted person, is the *weakest* form of evidence, prone to error, misinterpretation, or hoax. It hasn't been subjected to rigorous scrutiny or replicated.
      *   **No Verifiable Process:** There's no process for you (or science) to verify the claim independently.

  6.  **Wikipedia vs. Single Smart Person:**
      *   **System vs. Individual:** Wikipedia embodies the *consensus-building process*. While individuals edit, the core policies (Neutral Point of View, Verifiability, No Original Research, Reliable Sources) force claims to be backed by citations to reliable sources (academic journals, reputable news outlets, books). Disputes are resolved through discussion and reference to sources. You're trusting the *process* that aggregates and filters information based on evidence and reliable sourcing, not an anonymous person.
      *   **Single Person:** Even a smart individual can be wrong, biased, or misinformed on a specific topic outside their core expertise. Wikipedia leverages the collective knowledge *and sourcing* of many.

  **The Sincere Mechanic Case:**

  *   **The Claim:** "Your car needs [specific repair]."
  *   **Applying the Principle:**
      *   **Sincerity ≠ Expertise/Consensus:** His sincerity is admirable, but it doesn't guarantee the diagnosis is correct or necessary.
      *   **Conflict of Interest:** There's a potential financial incentive to recommend repairs.
      *   **Assessing Consensus/Evidence:**
          *   Ask for a *clear explanation*: What exactly is wrong? What evidence shows it (e.g., specific error codes, measurements of wear)? How does this repair fix it? A trustworthy mechanic should be able and willing to explain *transparently*.
          *   **Seek a Second Opinion:** This is the most practical application of checking for "consensus." Getting an independent assessment from another reputable mechanic *is* a way to see if the diagnosis is supported. It leverages the broader "system" of auto repair knowledge.
          *   **Check Reliability:** Is this mechanic part of a reputable shop with certifications (ASE), good reviews, and a warranty? This speaks to the *processes* they follow.

  **What Your Gut Might Have to Give Up (or Modify):**

  1.  **Absolute Trust in Sincerity/Character Alone:** Your principle would force you to acknowledge that your best friend's honesty doesn't make his UFO claim likely true, and your uncle's intelligence and engine skills don't make him right about vaccines. Trustworthiness in *character* is different from reliability on *specific factual claims*, especially extraordinary ones.
  2.  **Unquestioning Trust Based Solely on Role (Sometimes):** While the pilot role *implies* being part of a trustworthy system, the principle highlights that you're *really* trusting the system (training, maintenance, regulations). If you discovered systemic failures in an airline, your trust in *that specific pilot's assurance* might waver, even if the pilot seemed sincere. The role is a proxy for the system.
  3.  **Complete Dismissal of Anecdotes (Sometimes):** The principle demands skepticism towards lone anecdotes making extraordinary claims (like the UFO). However, for *low-stakes, common experiences* where consensus isn't really applicable ("The coffee shop on Elm is crowded right now"), trusting a friend's anecdote might still be perfectly reasonable pragmatism, even if it's not "evidence-based consensus." Your gut might be fine with this nuance.

  **In essence:** Your gut is prioritizing **epistemic humility** (recognizing the limits of individual knowledge) and **reliance on systems of knowledge production** (science, academia, rigorous journalism, professional standards) over individual charisma, sincerity, or even intelligence when those individuals operate outside validated systems or contradict the consensus those systems produce. It values **processes that generate verifiable evidence** and **agreement among those qualified to evaluate it** above isolated assertions.
