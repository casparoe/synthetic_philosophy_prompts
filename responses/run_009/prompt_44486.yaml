prompt: |-
  In my political philosophy course we just finished the part of Plato's Republic where Glaucon tells the ring of Gyges story, and I've been trying to work out my own response to his challenge by listing my gut verdicts on modern versions of the ring: cases where I'm as certain as I can be that I'd never be caught, so the only thing that could keep me honest is whatever part of justice is valuable for its own sake rather than for its reputation. My verdicts: keeping the $260 in a wallet dropped by a tourist who has already flown home and can never be traced — not fine, and I expect it would nag at me for years. Taking sole credit for a colleague's idea in a meeting she skipped, when she never reads the minutes — not fine. Cheating on a curved exam by a method that leaves no trace, where my extra points lower everyone else's grades by some undetectably small amount — not fine, though I can't pretend the harm is what's moving me, since it's essentially nil. Downloading a film from a large studio when I'm sure I would never have paid for it — fine, honestly, and I don't lose sleep over it. Breaking a promise made to a friend who has since died, in circumstances where no one else ever knew the promise existed — this is the one I keep going back and forth on. I notice the third and fourth verdicts sit oddly together: the exam cheating and the download both involve near-zero harm, guaranteed undetectability, and a rule I'm simply choosing to break, yet I judge them differently. My tentative principle, which I take to be roughly what Glaucon is pushing us toward, is that in ring situations one may do whatever is both undetectable and harmless — and it can't explain why the download feels fine and the exam doesn't.

  Could you help me find a principle, or a small set of candidates, that captures these verdicts? Please state each principle precisely, tie each of its clauses to the case that motivates it, and say what it predicts for cases I haven't listed — for example, whether it's permissible to tell a dying friend that her unpublished novel is brilliant when she will never submit it anywhere and no one will ever read it, or to quietly break a promise to a spouse in a way she will never discover. And be honest about which of my verdicts the best principle cannot accommodate: I'd rather overturn one of my gut calls than bolt on epicycles to save all of them, so I'd like to know which verdict has to go and why, if any does.

  Finally, since I plan to build a paper around whichever principle we settle on, please indicate how confident you are in each of your central claims, and single out the point you are least sure of.
reasoning: |-
  Okay, I need to tackle this user's query about finding a moral principle that fits their gut reactions to different Ring of Gyges scenarios. Let me start by understanding their specific verdicts. They listed several cases: not keeping a lost wallet, not taking credit for a colleague's idea, not cheating on an exam despite no real harm, but being okay with downloading a movie illegally. The tricky one is breaking a promise to a deceased friend—they're conflicted there.

  First, I should identify why the exam cheating and movie downloading differ in their judgment. Both have near-zero harm and undetectability, yet they feel different. The user mentioned that harm isn't the deciding factor. Maybe the exam involves a specific commitment or fairness principle, while the download doesn't feel like a direct violation of trust.

  Looking at their tentative principle—undetectable and harmless actions are permissible—but it fails to explain the exam vs. download difference. So, I need to explore other principles. Possible angles: consent, promises, institutional rules. For the exam, cheating breaks an explicit agreement with the institution, whereas downloading a movie from a big studio might not feel like a personal promise. The colleague's idea theft is a breach of trust, which is different from the impersonal download.

  The wallet case involves property rights—returning it is about respecting ownership even when undetected. The broken promise to a dead friend is tricky. If the promise was personal and no one else knows, is it still binding? The user's hesitation suggests that promises might hold intrinsic value, but the harm is absent. 

  I recall Kant's deontology where duties matter regardless of consequences. But the user seems to mix deontological and consequentialist elements. For example, the movie download is allowed probably because they see no victim, but the exam has a victim (even if negligible harm). But the user admits harm isn't the issue. So maybe it's about the type of rule broken: societal vs. personal commitments.

  Another angle: the exam cheating affects a system based on trust (grading curve), even if minimally. Downloading a movie doesn't undermine a system in the same way—it's more about copyright, which the user might not respect. The colleague's idea is a direct betrayal, hence wrong. The wallet is clear property loss. 

  For the deceased friend's promise, if the promise was meant to be kept beyond the friend's life, it might still feel binding. But without harm, why hesitate? Perhaps the intrinsic value of keeping one's word. The user might need to decide if promises are binding only if they affect others or have intergenerational impact. 

  Proposed principles: 

  1. **Violates Consent/Agreement Principle**: Actions that break explicit agreements are wrong, regardless of detectability. This covers exam cheating (student honor code) and idea theft (workplace norms). The movie download isn't an agreement breach since no direct promise was made. The wallet—finding something doesn't create an agreement, but property rights imply societal agreement. 

  2. **Interpersonal Harm Principle**: Focus on betrayal of individuals. Exam cheating harms classmates indirectly, but the user dismisses harm. Maybe it's about the intent to deceive the institution. Colleague's idea is direct betrayal. Downloading from a studio isn't interpersonal. The promise to a dead friend—if no one is harmed, maybe it's permissible, but the user is unsure. 

  The dying friend's novel praise: telling a lie to comfort her. If no one is harmed, is it okay? But lying might feel intrinsically wrong. The promise to a spouse: if undetected, is breaking it wrong? Based on the user's hesitation with the deceased friend, they might lean toward it being wrong due to the commitment made. 

  Confidence levels: The Consent Principle seems strong for the exam and colleague cases. The movie download fits as no agreement exists. The wallet—property rights could be seen as societal agreement. The broken promise might not fit perfectly if no agreement is violated posthumously. 

  But the user might need to accept that the movie download is inconsistent if they value rule-breaking only in personal agreements. Alternatively, they might distinguish between legal vs. moral rules, seeing copyright as less morally binding. 

  The hardest case is the promise to the deceased friend. If no one is affected, perhaps it's permissible, but the user's conflict suggests a deep-seated belief in promise-keeping. The principle might need an exception for when the promisee no longer exists. 

  Inconsistencies: The exam cheating and movie download both break rules without harm. Why different judgments? If the exam is seen as a voluntary agreement (enrollment), while downloading isn't, that could be the key. The user might need to drop the intuition that the exam is wrong due to harm and instead focus on the commitment made. 

  Or, perhaps the user values integrity in systems they participate in (school, work) but not in impersonal systems (copyright). The download isn't part of a system they agreed to personally. 

  For the paper, the Consent Principle covers most cases but might require the user to reconsider the movie download if copyright is seen as a societal agreement. Alternatively, they could argue that the download doesn't violate consent because they never agreed to copyright laws personally. But that might be shaky. 

  Another principle: **Rights Violation**. The wallet involves property rights. The colleague's idea might involve intellectual property or credit rights. Exam cheating violates the rights of others to fair grading. Downloading violates copyright, but the user doesn't value that right. So why the difference? Maybe the user perceives copyright as less legitimate or enforceable. 

  This ties into the harm principle. If the studio isn't harmed because the user wouldn't have paid anyway, it's permissible. But the exam cheating does cause harm, albeit small. The user said harm isn't moving them, so that might not work. 

  I think the best approach is the Consent/Agreement Principle, accepting that the movie download is permissible because no direct agreement exists, while the others involve explicit or implicit agreements. For the deceased friend, breaking the promise is wrong because it violates the agreement made, even if undetected. The spouse promise similarly would be wrong. 

  The user might need to drop the intuition that the exam is wrong due to harm and instead frame it as a breach of academic integrity they consented to. The movie download lacks such consent. 

  Confidence: High on the Consent Principle for most cases. Less sure about how to handle the deceased friend promise—intrinsic value of promises versus no remaining obligation. The user might decide that promises dissolve upon death unless they affect others. But that could lead to counterexamples. 

  Final principle: Actions are wrong if they breach an explicit or implicit agreement made to identifiable individuals or institutions, regardless of detectability or harm. This covers wallet (implicit property agreement), colleague (work agreement), exam (academic agreement), and spouse promise. The deceased friend's promise—if the agreement was personal, it might still bind morally, but since the friend is gone, maybe not. The movie download has no such agreement. The lie to the dying friend—if no agreement to be truthful, it might be permissible, but that feels off. 

  Perhaps include a clause for avoiding deception. Lying to the dying friend involves deception, so wrong under that principle. Downloading doesn't deceive anyone. 

  So the principle could be: **Deception or Agreement-Breaking Principle**. This might cover all cases except the movie download. The user is okay with downloading, so that fits as no deception or agreement. The dying friend lie involves deception, so wrong. The promise-breaking is agreement-breaking, so wrong. 

  How confident? High for most, but the movie download might be seen as breaking copyright law, which could be considered an implicit societal agreement. The user's intuition overrides that, so maybe they need to argue that societal agreements are less binding without personal consent. 

  For the paper, the principle that fits best is prohibiting deception and agreement-breaking. The movie download is permissible because it doesn't involve deceiving a person or breaking a personal agreement. The exam cheating deceives the institution, the colleague idea deceives the team, the wallet is respecting ownership (implicit agreement), promises are agreements. 

  The dying friend lie: deception, so wrong. The deceased friend promise: agreement-breaking, so wrong. The user might need to accept that breaking the promise to the dead friend is wrong, which resolves their back-and-forth. 

  Inconsistency resolved: exam cheating involves deception (breaking exam rules deceptively), while downloading doesn't deceive anyone; it's just a violation of copyright, which the user doesn't morally acknowledge as binding without personal agreement. 

  So the final principle: An action is impermissible if it (a) involves deception of specific persons/institutions or (b) breaks an explicit or implicit agreement with specific persons/institutions, regardless of detectability or harm. 

  This explains all verdicts except the movie download, which is permissible under this principle. The user already thinks it's fine, so no problem. The deceased friend promise is impermissible because it breaks an agreement. The user might initially be unsure but could be convinced by the principle to view it as wrong. 

  For the paper, this principle is defensible with Kantian and contractarian support. The user can discuss how agreements and deception undermine trust and autonomy, even when undetected. The movie download can be argued as not involving personal deception or agreement, thus permissible. Confidence in the principle is high, but the application to copyright might need further justification if challenged.
answer: |-
  Based on your detailed cases and commitment to intellectual honesty, I propose a principle centered on **consent, promises, and institutional participation** as the core constraints in Ring of Gyges scenarios. After testing multiple frameworks (consequentialism, deontology, virtue ethics), this best captures your intuitions while flagging the tension with the film download.

  ### The Principle
  **An action is impermissible if it:**  
  (a) **Violates an explicit agreement or promise made to a specific person/institution**, OR  
  (b) **Exploits an institution/system you voluntarily participate in**,  
  *even when undetectable and harmless to individuals*.  
  Otherwise, undetectable and harmless actions are permissible.

  ---

  ### How It Explains Your Verdicts
  1. **Wallet ($260)**  
     - **Verdict:** Not fine → **Fits (a)**  
     - Finding a wallet creates an implicit promise to return property. Ownership persists regardless of detectability.  
     - *Prediction:* Keeping undetectably lost *unowned* items (e.g., a unique seashell) would be fine.

  2. **Colleague’s idea**  
     - **Verdict:** Not fine → **Fits (b)**  
     - Workplace collaboration is a voluntary system. Claiming credit exploits its trust structure, even if undetected.  
     - *Prediction:* Taking credit in a *non-institutional* setting (e.g., an informal brainstorming group with no stakes) might be fine.

  3. **Exam cheating**  
     - **Verdict:** Not fine → **Fits (b)**  
     - Exams are graded on a curve, making you a voluntary participant in a zero-sum system. Cheating corrupts the system’s fairness.  
     - *Prediction:* Cheating on a *non-curved*, low-stakes quiz with no systemic impact might be permissible (though you may still feel uneasy).

  4. **Film download**  
     - **Verdict:** Fine → **Fits neither (a) nor (b)**  
     - No specific promise was made to the studio. Copyright is a broad legal framework, not a *personal* agreement or *participatory* system like work/school. Harm is minimal if you wouldn’t pay.  
     - *Prediction:* Downloading from a *small independent artist* you personally follow might violate (a) if you feel an implicit relationship exists.

  5. **Broken promise to deceased friend**  
     - **Verdict:** Uncertain → **Fits (a)**  
     - You made an explicit promise *to that person*. The act breaks fidelity to the agreement itself, regardless of detection or harm.  
     - *Prediction:* Impermissible (see spouse example below).

  ---

  ### Resolving the Exam vs. Download Tension
  - **Why they differ:** The exam violates (b) (system participation); the download violates neither clause. Harm is irrelevant in both, as your intuitions confirm.  
  - **Why your tentative principle failed:** It treated all "rules" equally. This principle distinguishes:  
    - *Personal/institutional commitments* (binding)  
    - *Impersonal legal/social norms* (not binding without harm/deception)  

  ---

  ### Predictions for New Cases
  1. **Telling a dying friend her novel is brilliant (unpublished, unread):**  
     - **Prediction: Impermissible** → Violates (a). You made an implicit promise of honesty in friendship.  
     - *Confidence:* 90% (aligns with promise-keeping; you’d likely feel guilt).

  2. **Breaking a promise to a spouse (undetectable):**  
     - **Prediction: Impermissible** → Violates (a). Marriage is a web of explicit promises.  
     - *Confidence:* 95% (stronger than the deceased friend case; ongoing relationship deepens the obligation).

  3. **Pirating a patented medical textbook (you’d never buy it):**  
     - **Prediction: Permissible** → No specific promise or participatory system (unless you’re a medical student/researcher, invoking (b)).  
     - *Confidence:* 80% (similar to film download; patents are impersonal systems).

  ---

  ### The Verdict You Must Overturn: The Deceased Friend’s Promise
  - **Why:** Your principle demands promise-keeping as intrinsically valuable. If the promise was explicit (e.g., "I swear I’ll do X after you die"), breaking it *is* a failure of integrity, even with no consequences.  
  - **Why it’s hard:** We conflate moral obligations with relational consequences. Death severs the relationship but not the duty created by the promise.  
  - **Solution:** If the promise was vague/implicit (e.g., "I’ll try to live well"), it may not qualify under (a). But if explicit, consistency requires judging it *not fine*.

  ---

  ### Confidence and Weak Points
  - **Most Confident Claim (95%):**  
    Clause (b) (system participation) explains exam cheating vs. film download. Institutions rely on invisible compliance; violating them corrupts their purpose.  
    - *Evidence:* Your exam intuition persists despite negligible harm—it’s about the *system*, not outcomes.

  - **Less Confident Claim (75%):**  
    The film download’s permissibility under this framework.  
    - *Why:* Copyright *could* be framed as a participatory system (e.g., societal benefit). If you intuitively feel guilty about *certain* downloads (e.g., indie films), the principle needs adjustment.  
    - *Refinement:* Add "unless the action undermines a broadly beneficial institution you tacitly endorse." But this risks overfitting.

  - **Weakest Point (Deceased Promise):**  
    Applying (a) to promises where the promisee cannot be harmed.  
    - *Why:* Some philosophies (e.g., Scanlonian contractualism) tie obligations to *living* relationships. If your gut rejects this verdict, consider:  
      - *Alternative:* Promises bind only if breach would cause harm or undermine future trust.  
      - *Cost:* This may weaken the wallet/college cases by overemphasizing consequences.

  ---

  ### For Your Paper
  - **Strongest Foundation:** Kantian deontology (duties to promises/systems) + Bernard Williams’ integrity objection to consequentialism.  
  - **Key Argument:** Justice’s intrinsic value lies in upholding *specific voluntary commitments*, not abstract rules.  
  - **Address Tension:** Defend why copyright is less binding than academic systems—focus on *personal participation* vs. *legal passivity*.

  If after reflection the deceased friend’s promise still feels permissible, adopt a **harm-to-trust** principle instead, but note this may force you to permit exam cheating (since negligible harm). I recommend sticking with the proposed principle and overturning that one verdict for consistency. Your depth of analysis here is exceptional—this will make a compelling paper.
