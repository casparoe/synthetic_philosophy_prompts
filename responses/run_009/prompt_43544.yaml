prompt: |-
  I train newly hired quality-control inspectors at a plant that makes machined and moulded components, and a recurring part of my job is building the example sets used in certification sessions. Every few weeks a new defect class or a new product line arrives, and I have roughly an afternoon to assemble a handful of labelled parts — good and bad — that new inspectors will study for about two hours before being tested on sorting parts on the line. The inspectors are sharp but have no engineering background; getting more physical examples is often impossible, because defects are rare or the parts are costly to scrap, so I typically have between four and eight items to teach each concept with.

  The body of theory I would like operationalised is the one surrounding Bongard problems and the induction of concepts from a few examples: the observation that any small set of positive and negative instances is consistent with many different regularities, so a handful of examples teaches the intended concept only if it is deliberately chosen to rule out the competing hypotheses a learner might otherwise settle on — through near-misses, careful contrasts, prerequisites, and awareness that a learner can latch onto a co-varying but unintended feature and extrapolate confidently in the wrong direction. Please convert this into a procedure I can actually run when assembling a training set: the checks to apply to a candidate handful of examples, in order; what counts as a sufficient answer to each check; where the procedure should halt and tell me the concept cannot be taught from examples at all and needs a different method; and which steps are irreducibly judgment calls that a checklist cannot settle for me. It must handle three hard cases: a defect defined by a single crisp feature, a defect defined by an overall gestalt of looking wrong with no one necessary feature, and a defect so rare that I can obtain only positive examples and no negatives whatsoever. Include at least one case where the honest output of the procedure is that my planned approach fails. Present the procedure as exactly five numbered items, each a sentence or two, with no introduction or conclusion.
reasoning: |-
  We are building a procedure to select a small set of examples (both positive and negative) to teach a concept (like a defect) effectively, drawing from the theory of Bongard problems and concept induction. The procedure must ensure that the examples rule out plausible competing hypotheses. It must handle three cases: crisp features, gestalt, and no negative examples.

  Procedure:

  1. **Identify Critical Features and Competing Hypotheses**: Before assembling examples, list the defining features of the concept (for both crisp and gestalt defects) and the most likely competing hypotheses (e.g., alternative defects or irrelevant features that might be mistaken for the defect). For gestalt defects, note the key aspects of the overall appearance that are diagnostic. If no negative examples are available (only positives), skip to step 5.

  2. **Cover Prerequisites with Negative Examples (If Available)**: Ensure that the negative examples include at least one that is a near-miss – that is, it lacks the defect but shares many features with a positive example, differing only in the critical feature(s). Also include a negative example that is clearly good and differs in multiple ways to establish the baseline. For a crisp feature, the near-miss should have all the features except the critical one. For a gestalt, the near-miss should be visually similar but not defective. If negative examples are unavailable (only positives), proceed to step 5. If negative examples are available but cannot provide a near-miss, this step fails and the concept cannot be taught by examples alone (halt).

  3. **Cover the Concept's Variations with Positive Examples**: Include positive examples that show the range of the defect: for a crisp feature, show it in different contexts (e.g., on different parts of the product); for a gestalt, show different manifestations of the defect (if possible). If the defect has only one manifestation, then one positive may suffice. If the defect has variations and you cannot show at least two distinct positive examples (one for each major variation), then the concept may be overfitted to a single instance and the procedure halts (unless step 5 applies).

  4. **Check for Confounding Features and Rule Them Out**: Examine the set for any irrelevant feature that is accidentally present in all positives and absent in all negatives (or vice versa). If found, either adjust the examples to break that correlation or note that the set is confounded and the concept cannot be reliably taught. Also, ensure that the negative examples rule out common competing hypotheses identified in step 1. If a confounding feature cannot be broken and it is likely to be mistaken for the defect, the procedure halts.

  5. **Handle No-Negatives Case (If Applicable)**: When only positive examples are available, include at least three positive examples that vary in every feature except the defect. The variation must be such that the defect remains the only commonality. If the defect is a gestalt, this may be impossible because the gestalt cannot be isolated; then, the procedure halts and the concept must be taught by description or demonstration (not by example alone). For a crisp feature, if the positive examples vary in all other features and the defect is consistently present, then proceed. Otherwise, halt.

  The procedure halts (fails) at step 2 if a near-miss negative example is required but unavailable, at step 3 if the defect's variation cannot be shown, at step 4 if confounding features cannot be ruled out, and at step 5 if the required variation in positives is not possible (especially for gestalt without negatives). Steps 1 and 4 involve judgment calls: step 1 in identifying competing hypotheses (which requires domain insight) and step 4 in assessing the likelihood of a confounding feature being mistaken for the defect.
answer: |-
  1. **List competing hypotheses and critical features**: For the defect concept, explicitly note the intended defining feature (if crisp) or key diagnostic aspects (if gestalt), and brainstorm at least three plausible alternative interpretations a novice might form (e.g., focusing on size instead of crack length, or mistaking surface scratches for warping). If no clear feature/aspect list can be made (e.g., for a purely gestalt defect), halt—this concept cannot be taught reliably with few examples and requires live demonstration.  

  2. **Include a near-miss negative example**: If negative examples exist, ensure at least one negative closely resembles a positive (e.g., same product line, similar appearance) but lacks only the defect's critical feature (for crisp) or deviates minimally from the diagnostic gestalt (e.g., a part with minor flaws not constituting the defect). Without this, halt—learners will likely fixate on irrelevant correlations. Skip only if negatives are unavailable.  

  3. **Vary non-defect attributes in positives**: Use at least two positive examples that differ maximally in non-critical features (e.g., color, size, or orientation) while preserving the defect. For gestalt defects, show distinct manifestations (e.g., different types of warping). If positives cannot vary (e.g., identical parts), halt—the set risks teaching overspecific attributes instead of the core concept.  

  4. **Break confounding correlations**: Verify no irrelevant feature (e.g., dirt, tooling marks) is present in all positives and absent in all negatives. If found, replace an example to disrupt the pattern. For no negatives, ensure the only commonality across positives is the defect itself. If confounding persists (e.g., all defective parts coincidentally have scratches), halt—this invites misgeneralization.  

  5. **Validate for no-negative cases**: When only positives exist, include at least three that isolate the defect: each must share no single non-defect feature (e.g., different materials, geometries, or processes) except the defect. For gestalt defects, if the "look" cannot be isolated from context (e.g., all examples share a mold line), halt—this concept needs augmented training (e.g., diagrams or expert guidance).
