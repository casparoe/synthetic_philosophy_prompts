prompt: |-
  I teach a seminar on the moral foundations of promissory obligation, and every year the discussion collapses into the same tired ping-pong between "it's a social practice, end of story" and "it's all about the promisee's expectations and reliance." I've become partial to a third kind of view and I want you to argue for it, properly: that the binding force of promises comes from the promisor handing the promisee a kind of standing authority over the promisor's future conduct. Not just creating an expectation, and not just inviting reliance — the promisee now gets to demand that the promisor perform, gets to rebuke her for breach, and gets to waive the requirement at her discretion. On this view a promise is a transfer of normative control, in the same family as handing someone the keys to your car, even though nothing remotely like property in your actions changes hands.

  To keep you honest, the argument has to earn its keep on four fronts:

  1. It should explain the release asymmetry — the promisee, and apparently only the promisee, can cancel the obligation by releasing the promisor. You can't release someone from their duty not to lie to you about a third party, and you can't forgive a debt of gratitude into nonexistence, so why is promising different? Your view should make this difference look principled rather than stipulated.

  2. It has to handle coerced promises. If someone puts a gun to my head and extracts a promise, I can't reasonably be expected to rely on it, and yet we're still uneasy saying flat-out that nothing was promised at all. Say what your view commits you to here, and don't be sly about it.

  3. It has to say why the authority, once given, can't just be treated like a liability you price into the deal — why can't the promisor renege, pay damages, and call it a day, like an ordinary contract breach? What exactly stops the moral residue from being fully dischargeable by compensation?

  4. It should anticipate the obvious objection that this makes promising into a weird voluntary self-enslavement, and either show why that objection misses something or bite a bullet with a straight face.

  One last thing, and this is the part my students always fumble: don't quietly collapse your view back into Scanlon's expectation/reliance story. If the only bad thing about breaking a promise were frustrated expectations, the release asymmetry would make no sense — you can't "release" someone from making you disappointed. The transfer of authority has to do real explanatory work in the argument, not just sit there as a label. No bibliography, no citations, just the argument, worked through. Sorry for the length, i've clearly had too much coffee this morning.
reasoning: |-
  Okay, let me tackle this professor's challenge. He's frustrated with the stale debate in his seminar between social practice and expectation/reliance views of promissory obligation. He wants me to argue for a third view: that promises transfer normative control to the promisee. And he's laid out four specific tests this must pass. 

  First, I need to truly inhabit this "transfer of authority" perspective. The core idea is that when you promise, you're handing the promisee a moral remote control over your future action. They can press "perform," "rebuke," or even "cancel." This isn't about creating expectations - it's about granting rights of command.

  For the release asymmetry (test 1): The reason only the promisee can cancel is because they hold the exclusive遥控器. Contrast this with truth-telling where no such transfer occurs - you can't "release" me from lying to others because I never gave you authority over my honesty to third parties. The transfer creates unique moral ownership.

  Coerced promises (test 2) are tricky but clarifying. At gunpoint, I do transfer authority - that's why we feel uneasy saying "nothing happened." But because coercion voids the transfer's validity (like signing a contract under duress), the promisee never properly acquires the遥控器. The promisor still owes repair for the defective transfer attempt though - hence our discomfort.

  On compensation (test 3): Damages can't clean the moral slate because what was violated wasn't just harm - it was the promisee's sovereign right to govern that action. You can't pay reparations for usurping someone's authority any more than you can compensate for kidnapping by paying taxi fare.

  Finally, the self-enslavement worry (test 4) misconstrues the scope. I only transfer authority over one specific future action, not my entire will. It's like handing someone a single car key, not the title to my life. The limits are built into the promise's content.

  Throughout, I'm checking that this truly differs from Scanlon: Expectations might follow from the transfer, but they're not the source of obligation. Release works because you're giving back the遥控器, not because you're preventing disappointment. The transfer does the heavy lifting.
answer: |-
  Here’s the argument for the "transfer of normative control" view, structured to meet your demands:

  **Core Thesis**: A promise is a voluntary transfer of *moral authority* over a specific future act. The promisor alienates a slice of their autonomy to the promisee, granting them three powers: (1) to demand performance, (2) to rebuke for non-performance, and (3) to unilaterally waive the obligation. This is not about creating expectations or inviting reliance (though those may result) but about *delegating moral jurisdiction*.

  ---

  ### 1. **Release Asymmetry: Why Only the Promisee Can Cancel**  
     - **The Transfer Mechanism Explains Exclusivity**: When you promise, you grant the promisee a unique *moral proprietorship* over your obligation. Just as handing someone car keys makes *them* the sole arbiter of the car’s use, transferring normative control makes the promisee the sole holder of the "moral keys" to your pledged act.  
     - **Contrast with Non-Transferable Duties**:  
       - *Truth-telling*: Your duty not to lie to me about a third party isn’t *yours to give away*. It’s a general moral duty owed to others (and to morality itself); you lack standing to transfer authority over it to me.  
       - *Gratitude*: A debt of gratitude arises from a benefit *already received*. It’s not an authority over future conduct but a response to past action. You can’t "cancel" it because it’s not yours to waive—it’s tethered to the benefactor’s prior act.  
     - **Why Release Works**: Waiving the promise isn’t "forgiving harm" or "preventing disappointment"; it’s *returning the moral keys you were given*. The promisee alone holds those keys, so only they can relinquish them.  

  ---

  ### 2. **Coerced Promises: Authority Transferred but Illegitimately**  
     - **The Transfer Still Occurs (Hence the Unease)**: At gunpoint, you *do* hand over normative control. The words "I promise" perform the transfer, even if involuntarily. This explains why we don’t dismiss it as "nothing": *moral authority was alienated*, but under duress.  
     - **Why It’s Not Binding**: Coercion voids the transaction’s validity. You can’t *voluntarily* transfer authority if your will is hijacked (like "selling" your car under threat). The promisee never legitimately *acquires* the authority.  
     - **The Result**: No binding obligation exists (the promisee cannot demand performance), but the *attempted transfer* creates moral residue:  
       - The promisor may owe repair for putting the promisee in a position of false authority.  
       - The promisee cannot rebuke for non-performance—but may still resent the *coercion*, not the broken promise.  

  ---

  ### 3. **Why Compensation Isn’t Enough: Violating Sovereignty**  
     - **Damages Address Harm, Not Authority**: Compensation settles *losses* (e.g., costs of reliance). But the wrong in promise-breaking isn’t just harm—it’s *usurping moral jurisdiction*.  
     - **The Analogy**: If you lend me your car and I sell it, paying you market value doesn’t suffice. You didn’t authorize the sale; I violated your sovereignty as owner. Similarly, breaking a promise seizes back the authority *you transferred*. Compensation might cover incidental losses, but it ignores the *affront*: you’ve nullified their right to govern your action.  
     - **Moral Residue as Disenfranchisement**: The promisee was owed the power to *direct and judge* your act. Paying damages bypasses their authority—like a vassal ignoring a king’s decree and sending gold instead. The king’s grievance isn’t fiscal; it’s *lèse-majesté*.  

  ---

  ### 4. **Voluntary Self-Enslavement? Scope and Limits**  
     - **Objection**: If promising hands over authority, isn’t it enslaving yourself to another’s will?  
     - **Reply**:  
       - **Limited Domain**: You transfer authority *only* over the specific act promised (e.g., "I’ll drive you to the airport"). This isn’t blanket sovereignty over your life—it’s a targeted, context-bound delegation.  
       - **Revocability Constraints**: You cannot transfer authority you don’t possess. You can’t promise to sell yourself into slavery because you lack moral ownership of your entire future autonomy (you’re its steward, not proprietor).  
       - **The "Keys" Analogy Holds**: Handing someone car keys grants temporary control—not ownership of the car, and certainly not of you. Promising is similarly bounded: you lend moral steering for one journey.  

  ---

  ### **Why This Isn’t Scanlon in Disguise**  
  - **Expectations/Reliance as Symptoms, Not Source**:  
    - Scanlon: Obligation arises *because* breaking promises harms others by inducing reliance/expectations.  
    - Our View: Expectations/reliance are *downstream effects* of the transfer. The *core wrong* is defying the promisee’s authority.  
  - **Release Asymmetry as Decisive Proof**:  
    - On Scanlon’s view, if a promisee releases you but you break the promise anyway, you still frustrate their expectations (they expected release to resolve things). But intuitively, release *dissolves* the obligation—because the authority was returned. The transfer model explains this; expectation models cannot.  
  - **Rebuke Rights**: The promisee’s standing to condemn isn’t just about *their hurt feelings*—it’s their role as the wronged authority. A stranger can’t rebuke you for breaking a promise, even if they relied on it.  

  ---

  **In essence**: Promising is a moral technology for delegating sovereignty over future acts. It explains release (giving back the keys), coerced promises (forced transfers are void), the insufficiency of compensation (you can’t buy back usurped authority), and avoids self-enslavement (limited scope). The binding force isn’t social pressure or disappointed hopes—it’s the promisor’s own autonomy, loaned out and waiting to be reclaimed.
