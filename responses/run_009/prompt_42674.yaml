prompt: |-
  longtime lurker here (OB then LW since like 2009), so i've basically marinated in the heuristics-and-biases worldview — Kahneman and Tversky as founding scripture, "cognitive bias" as the master key to everything wrong with human reasoning. but i finally got around to reading Lakatos (via a Feyerabend rabbit hole, as one does) and now i have an itch i need scratched. so:

  Argue that the heuristics-and-biases research programme, judged by Lakatos's criteria, has been degenerating since roughly the mid-90s, and that the rival ecological-rationality programme (Gigerenzer's fast-and-frugal heuristics crowd) is the progressive one. Constraints, so you can't half-ass it:

  - You actually have to use the Lakatos machinery: state the hard core of each programme, the positive and negative heuristics, what's sitting in the protective belt, and which auxiliary hypotheses are doing the absorbing of anomalies.
  - The crux has to be novel predictions. Lakatos's whole thing is that a programme progresses only by predicting facts that were new, not by re-describing known results after the fact. So get specific-ish: where did H&B only rationalize stuff it already knew vs. where did the ecological side genuinely predict something surprising in advance (less-is-more effects, fast-and-frugal trees competitive with or beating regression on out-of-sample prediction, recognition heuristic stuff, that kind of thing).
  - Deal with the obvious comeback head on: Kahneman has a Nobel and is treated as gospel in exactly the circles i grew up reading. You can't just assert that popularity isn't progress — run the Lakatos analysis showing why prestige and a progressive problemshift can come apart, and note that the replication crisis doesn't automatically help your side either, since some fast-and-fractal... sorry, fast-and-frugal results took hits too.
  - Don't strawman H&B down to priming. Kahneman himself publicly threw the priming stuff under the bus, so attacking it is punching a corpse. The target is the rationalist-adjacent core — conjunction fallacy, base rate neglect, overconfidence, framing — and you have to show that the strongest versions of those are part of a degenerating shift, not the weak ones.
  - Content only. No appeals to Gigerenzer-vs-Kahneman personal beef, German vs. American psychology-department sociology, none of that.

  If you privately think the position is indefensible, argue it as hard as you can anyway and then flag where the case is weakest, so I know which parts to not repeat at dinner parties.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a longtime lurker from OB/LW, immersed in the heuristics-and-biases (H&B) framework since 2009. Now, after reading Lakatos and Feyerabend, they want a Lakatosian analysis comparing H&B with ecological rationality (ER). The challenge is to argue that H&B is degenerating while ER is progressive, with strict constraints.

  First, I need to recall Lakatos's methodology: hard cores, protective belts, positive/negative heuristics, and novel predictions. The user wants specifics on how ER made surprising predictions versus H&B's post-hoc explanations. They also want a head-on rebuttal to Kahneman's Nobel and popularity, without strawmanning H&B or invoking sociology.

  The user's explicit request is a structured argument, but their deeper need might be understanding how these frameworks hold up under rigorous philosophy of science. They mention marinating in H&B, so they're likely familiar with biases but now question its foundations. They want intellectual validation but also caveats—where the argument might be weak.

  I should outline both programmes' cores. H&B: cognitive biases as systematic errors from irrational heuristics. ER: heuristics as ecologically rational tools. Positive heuristics differ—H&B seeks bias demonstrations, ER focuses on ecological fit and adaptive heuristics. Negative heuristics: H&B avoids questioning bias universality; ER rejects context-free rationality norms.

  Novel predictions are crucial. ER predicted less-is-more effects, frugal heuristics outperforming complex models, and domain-specific competence. Examples: Gigerenzer's group predicted when recognition heuristic works; fast-and-frugal trees beat regression in hospitals. H&B often offered post-hoc explanations, like reframing base-rate neglect as a communication issue.

  Addressing Kahneman's Nobel: Lakatos separates prestige from progress. H&B's initial progress stalled in the 90s, focusing on bias variations without new predictions. The replication crisis hits both, but ER addresses it via ecological validity. However, ER has weaknesses—scope limitations, less empirical breadth—so the user should be cautious in dinner parties.

  I'll structure the response with sections for each programme's core/heuristics, anomalies, novel predictions, and addressing the Nobel point. Highlight ER's proactive predictions versus H&B's reactive adjustments. Note where the argument is weakest: ER's limited domain explanations and H&B's methodological rigor post-crisis.
answer: |-
  Here’s a Lakatosian analysis arguing that the Heuristics-and-Biases (H&B) programme degenerated post-mid-90s while the Ecological Rationality (ER) programme progressed, strictly adhering to your constraints:

  **1. Programme Cores & Heuristics:**

  *   **H&B Hard Core:** Human cognition is fundamentally limited and systematically irrational. Judgment under uncertainty relies on error-prone "heuristics" (representativeness, availability, anchoring) that reliably produce deviations from normative standards of rationality (probability theory, logic, optimization). These deviations ("biases") are universal and pathological.
  *   **H&B Positive Heuristic:** Design experiments demonstrating systematic deviations from normative benchmarks in controlled lab settings. Identify new biases or boundary conditions for known ones. Attribute deviations to specific heuristic processes.
  *   **H&B Negative Heuristic:** Do not question the universal applicability of formal normative models as the benchmark for rationality. Do not attribute "good" performance primarily to heuristics. Protect the core "systematic irrationality" postulate.
  *   **H&B Protective Belt (c. Mid-90s):** Auxiliary hypotheses about specific heuristics (e.g., how representativeness causes conjunction fallacy), experimental paradigms (e.g., vignettes with base rates), and boundary conditions (e.g., "debiasing" techniques often ineffective). Normative model = logic/probability theory.

  *   **ER Hard Core:** Rationality is ecological; it’s about the fit between cognitive strategies (heuristics) and the structure of the environment. Heuristics are "fast-and-frugal" (exploiting few cues, little computation) and can be ecologically rational, leading to accurate, robust, and efficient decisions *in real-world environments*. Normative benchmarks are context-dependent.
  *   **ER Positive Heuristic:** Identify specific environmental structures (e.g., non-compensatory cues, scarce information). Design and test simple heuristics exploiting those structures. Compare performance to complex models (e.g., regression) *in prediction tasks on real-world data*. Explain when and why less information/computation is more effective.
  *   **ER Negative Heuristic:** Do not assume universal normative standards (like probability theory) are the sole benchmark. Do not assume deviations from lab-based norms imply irrationality. Protect the core "rationality = ecological fit" postulate.
  *   **ER Protective Belt (c. Mid-90s):** Auxiliary hypotheses about specific fast-and-frugal heuristics (e.g., Take-The-Best, Recognition Heuristic), environmental structures (e.g., cue validities, recognition validity), and measures of success (e.g., out-of-sample prediction accuracy, speed, frugality).

  **2. Anomalies & Protective Belt Adjustments:**

  *   **Anomalies for H&B (Post-Mid-90s):**
      *   **Ecological Validity Critique:** Lab demonstrations of "biases" often use artificial problems with missing context, arbitrary norms, or information formats unlike real environments. Do these "errors" matter outside the lab? (e.g., Base rate neglect in natural contexts vs. abstract problems).
      *   **Adaptive Value Questioned:** If biases are so pervasive and maladaptive, why weren't they selected out? H&B offered weak evolutionary accounts.
      *   **Lack of General Predictive Power:** Knowing someone exhibits a bias in a lab task poorly predicts performance in related real-world tasks. The "bias" concept lacked ecological predictive validity.
      *   **Performance Under Uncertainty:** H&B often assumed perfect information access. Real decisions involve scarce time/information, where perfect computation is impossible. H&B norms become irrelevant.
  *   **H&B Protective Belt Adjustments (Degenerating Shift):** Absorbing these anomalies involved *ad-hoc* modifications *without predicting novel facts*:
      *   **Invoking "System 1 vs. System 2":** Framing biases as automatic System 1 failures correctable by effortful System 2. This rationalized known results but didn't predict *when* System 2 would successfully intervene or *novel* consequences of the interaction beyond re-describing existing biases.
      *   **Reframing "Errors" as Communication Issues:** Arguing base-rate "neglect" is actually a misunderstanding of the experimenter's intent. This was post-hoc rationalization of existing anomalies, not a novel prediction.
      *   **Finding Ever More "Biases":** Cataloging new, often overlapping deviations under new names. This added complexity but didn't yield new *predictive* power about real-world outcomes.
      *   **Focusing on Individual Differences:** Exploring who is "less biased." This described variance in known effects but didn't predict *novel* phenomena based on the core theory.

  *   **Anomalies for ER (Progressive Shift):** The core ER programme *anticipated* the H&B anomalies as *consequences* of using the wrong benchmark:
      *   **H&B "Biases" as Artifacts:** ER predicted that many H&B "biases" would disappear or become adaptive when studied in environments matching the heuristics' design (e.g., where recognition *is* a valid cue).
      *   **Importance of Environment Structure:** ER predicted that heuristic performance would vary dramatically based on measurable environmental structures (cue validity, skew, noise).
  *   **ER Protective Belt Adjustments:** ER actively tested its core by building models predicting novel facts in diverse environments.

  **3. The Crux: Novel Predictions (H&B Degenerating vs. ER Progressive)**

  *   **H&B's Lack of Novel Predictions (Post-Mid-90s):** The programme largely shifted to:
      *   **Re-Describing Known Phenomena:** Applying the "heuristics & biases" label to new domains (e.g., behavioral economics, happiness research) but without predicting *specific, surprising* outcomes *in advance* beyond the general "there will be a bias." Kahneman's work on prospect theory *was* progressive (predicting novel risk attitudes), but this core insight predates the 90s. Post-90s H&B primarily offered post-hoc explanations for deviations already observed in lab tasks or field data.
      *   **Boundary Conditions:** Finding when a known bias is larger/smaller (e.g., framing effects under time pressure). This is refinement, not prediction of *novel* phenomena.
      *   **No Novel Predictions about Real-World Performance:** H&B failed to predict *when* heuristics would outperform complex models or normative standards in ecologically valid prediction tasks.

  *   **ER's Novel Predictions (Progressive Shift):** ER made specific, surprising, and empirically verified predictions *in advance*:
      *   **The Less-Is-More Effect:** Predicted and demonstrated that under specific environmental conditions (e.g., high recognition validity), relying on *fewer* cues (e.g., the Recognition Heuristic) leads to *higher* accuracy than using more information or compensatory models. This directly contradicts the H&B core assumption that more information/computation is always better. (Gigerenzer & Goldstein, 1996; Goldstein & Gigerenzer, 2002).
      *   **Fast-and-Frugal Trees Outperforming Regression:** Designed specific fast-and-frugal decision trees (e.g., for coronary care unit allocation) and *predicted and demonstrated* they would match or exceed the accuracy of logistic regression *in out-of-sample prediction* on real-world data, while being vastly more transparent and frugal. This predicted novel success for simple heuristics in high-stakes domains. (e.g., Green & Mehr, 1997; Dhami & Ayton, 2001).
      *   **Domain-Specific Competence from Ignorance:** Predicted and demonstrated that the Recognition Heuristic could lead to higher accuracy in domains like city population comparisons for people *with intermediate knowledge* compared to experts or the totally ignorant, due to the ecological correlation between recognition and criterion. (Goldstein & Gigerenzer, 1999, 2002).
      *   **Predicting Heuristic Success/Failure from Environment Structure:** Developed formal criteria (e.g., validity of non-compensatory cues) to predict *in advance* which heuristic (e.g., Take-The-Best vs. tallying) would perform best in a *new*, specified environment. (e.g., Czerlinski et al., 1999).

  **4. Addressing the Comeback: Nobel, Popularity, and Replication**

  *   **Kahneman's Nobel & Popularity ≠ Lakatosian Progress:** Lakatos explicitly distinguishes empirical progress (novel predictions) from rhetorical/social success. H&B was *initially* progressive (1960s-80s):
      *   **Initial Progress:** Prospect Theory, discovery of representativeness/availability heuristics, experimental demonstrations of base rate neglect/conjunction fallacy *were* novel predictions/facts at the time. This earned the Nobel and its massive influence.
      *   **Degenerating Phase:** Lakatos argues programmes *can* coast on prestige long after their progressive shift ends. Post-mid-90s H&B dominance stems from its *initial* progress, powerful narrative ("humans are irrational"), and applicability to economics/policy, *not* from continued novel predictions in its core domain of judgment under uncertainty. Popularity reflects sociological factors and the appeal of its core message, not sustained theoretical fertility via novel predictions.
  *   **Replication Crisis Cuts Both Ways - But Favors ER's Core Critique:**
      *   **H&B:** Suffered significant replication failures (e.g., some priming, ego depletion, growth mindset - though note your constraint). Crucially, *even for core effects*, questions arose about magnitude, universality, and ecological significance. This directly challenges the H&B core of *systematic, universal* irrationality. H&B often responded by retreating to weaker claims or methodological critiques (absorbing into belt), not predicting *which* effects would replicate or how magnitude depends on ecological factors.
      *   **ER:** Also faced replication challenges (e.g., boundary conditions of recognition heuristic, cross-cultural variations). However, the ER core *predicts* variability based on environment. Its response has often been to refine models of ecological structures and heuristic-environment fits *based on empirical tests*, aligning with progressive adjustment. Furthermore, ER's core critique – that H&B effects are lab-bound artifacts of mismatched environments/norms – is *strengthened* by failures to find large, universal biases in more ecological settings.
      *   **Crucial Difference:** The replication crisis exposed the fragility of *context-free* claims of universal irrationality (H&B's core tenet). ER's core tenet (rationality is ecological and context-dependent) is *inherently more compatible* with variability in findings across contexts and populations.

  **Weaknesses in the Case (For Your Dinner Parties):**

  1.  **Scope of ER Explanations:** ER excels at explaining/predicting specific, bounded judgment and choice tasks (comparison, categorization, sequential search). Its track record explaining the *strongest* H&B phenomena (e.g., *persistent* overconfidence in specific expert domains despite feedback, extreme framing effects in affect-rich contexts) is less developed. H&B might still offer a simpler *description* here, even if not predictively progressive.
  2.  **"Degenerating" vs. "Stalled":** Did H&B truly degenerate, or just stop making progress on its original core? Some argue it *shifted* focus productively (e.g., to behavioral economics nudges). Lakatos might call this a new programme. Post-mid-90s H&B did generate vast empirical work, even if lacking novel *theoretical* predictions.
  3.  **Methodological Rigor (Post-Crisis):** Post-replication crisis, H&B-inspired research often adopted more stringent methods (pre-reg, larger N). While not novel predictions, this improved robustness. ER research wasn't immune to methodological critiques either.
  4.  **Integration Potential:** Could the programmes integrate? ER might explain *when* heuristics work, H&B *when* they lead to systematic errors *relative to a specific norm*. Lakatos dislikes such "content increase by incorporation," but pragmatically, it might be fruitful. Insisting on strict rivalry might be limiting.
  5.  **ER's Limited Cultural Scope:** While ER acknowledges environment, its formal models of ecological structures and heuristics were initially developed and tested primarily in WEIRD contexts. Predicting cross-cultural variability in heuristic use/effectiveness based on differing environmental structures is an ongoing challenge.

  **Conclusion (Lakatosian Verdict):**

  Judged by Lakatos's core criterion – sustained production of *novel* facts – the H&B programme underwent a degenerating problemshift post-mid-90s. Its protective belt adjustments (System 1/2, communication reframing, bias cataloging) primarily rationalized existing anomalies or described variance in known effects without predicting surprising new phenomena, especially regarding real-world performance. In contrast, the ER programme staged a progressive shift, predicting and confirming novel facts like the less-is-more effect, the ecological conditions for recognition success, and the competitive out-of-sample predictive accuracy of fast-and-frugal heuristics against complex benchmarks. While Kahneman's Nobel reflects H&B's *initial* progress and immense sociological impact, and the replication crisis challenges both programmes, ER's core thesis of ecological rationality offers a framework better aligned with predicting variability in human performance and explaining the context-dependence of so-called "biases." The strongest dinner-party argument rests on ER's *proactive*, successful novel predictions versus H&B's post-mid-90s *reactive* posture. The weakest point is ER's (so far) more limited scope in explaining the deepest, most affect-laden irrationalities.
