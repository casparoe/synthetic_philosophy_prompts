prompt: |-
  Background: I'm a journalist who covers science and ideas for general readers, and I've sold my editor on a piece taking a position she thinks is a hard sell: that shame is actually the better moral emotion for a culture like ours. The angle I have in mind isn't the feel-good version — it's that guilt is built for a world of discrete acts by identifiable agents, and more and more of our wrongdoing is diffuse complicity instead: supply chains, algorithms, the situations where everyone did a little and nobody did a lot. In those, guilt can't get a grip, because there's no one clean act to pin on you, but shame can attach to what you're tangled up in. The piece also wants to claim a culture can choose its dominant moral emotion rather than just inheriting it, and that part cant be hand-waved.

  Please make the case as a numbered list of exactly five points, each a sentence or two, no introduction and no conclusion. Treat the five as the load-bearing moves of the argument: one should hit the standard knock on shame head-on — that it makes people hide while guilt makes them repair — and show why it doesn't sink the case; another should carry the "can a culture choose" claim (my hunch is cultures already tune their emotion mix through what they punish in kids, what gossip circulates, what gets dragged into public), and it has to argue the choice is real, not just assert it. Keep the whole thing under about 200 words.

  American English, please, and keep jargon out — my readers wont know what a "moral emotion" is, so define anything technical in passing. One more thing: this is for a fact-checkable publication, so no appeals to studies or numbers you'd have to go look up; the argument should do the work on its own. Thanks — sorry for the brain dump, I'm on deadline.
reasoning: |-
  Okay, the user is a science journalist pitching an article on why shame might be better than guilt for modern diffuse ethical problems. They need five concise argument points without jargon. 

  First, I notice the core tension: guilt works for clear individual actions, but modern harms are systemic (supply chains, algorithms). Shame attaches to identity/complicity rather than acts - that's point one. 

  For point two, I'll tackle the main counterargument head-on: yes, shame makes people hide, but systemic problems require collective action anyway. Guilt's "fix it" impulse falls short here. 

  Point three should show cultures already shape moral emotions - like through childhood discipline patterns. That proves the "choice" claim isn't abstract. 

  Point four will contrast guilt's narrowness with shame's ability to cover passive complicity. The sweatshop example makes it concrete. 

  Finally, point five addresses agency: since we're stuck in systems, we need emotions that target our participation, not just our actions. 

  Word count is tight - every phrase must pull weight. Avoiding studies per request, but the sweatshop/church examples ground it in common experience. The "hide vs repair" rebuttal stays practical by linking to protest movements. 

  Biggest risk is sounding anti-guilt rather than pro-context. Emphasizing "when harms are diffuse" keeps it situational. Also watching tone - this isn't advocating shame-societies, just arguing for its utility in specific modern binds.
answer: |-
  Here are the five core argument points:

  1.  **Guilt targets individual actions ("I *did* something bad"), which struggles when harm results from systems we’re passively embedded in, like exploitative supply chains or biased algorithms; shame targets our identity and complicity ("I *am* tangled up in something bad"), making it better suited for diffuse, collective wrongdoing.**  
  2.  **While critics rightly warn shame makes people hide (unlike guilt, which prompts repair), this overlooks a key distinction: in complex systems, no one individual *can* "fix" the harm alone; shame’s discomfort, channeled collectively (like public pressure campaigns), becomes the necessary driver for demanding *systemic* change.**  
  3.  **Cultures absolutely shape their dominant moral emotions; they do this constantly by deciding what childhood missteps get punished harshly (shaping internal shame/guilt), what gossip condemns (reinforcing social shame), and which transgressions become public scandals versus private matters.**  
  4.  **Guilt requires a clear, direct causal link between your specific act and a harm – impossible when your contribution is tiny and indirect; shame, however, attaches to your *role* or passive *participation* in harmful structures, like benefiting from cheap goods made unethically.**  
  5.  **When harm stems from situations where "everyone did a little and nobody did a lot," guilt often fails to activate because there’s no single blameworthy act; shame, focusing on who we *are* within these systems, provides the uncomfortable but necessary motivation to examine and challenge our complicity.**
