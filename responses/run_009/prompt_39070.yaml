  ### Case A: Incoherent but Structurally Protected  
  Ada posts prices on three award finalists (Alice, Bob, Carol) in a group chat: $0.40 for a bet paying $1 if Alice wins, $0.40 for Bob, $0.40 for Carol. Her implied probabilities sum to 1.2 > 1. Ordinarily, a bookie could sell her all three bets simultaneously: she pays $1.20 upfront and wins only $1 in any outcome, losing $0.20. But Ada’s rule is **only one open bet per contest at a time** (a natural bookkeeping habit to avoid overexposure). After accepting a bet, she rejects further wagers until it settles.  

  *Mechanics*:  
  - Without protection, the Dutch book is: Bookie sells bets on Alice ($0.40), Bob ($0.40), and Carol ($0.40) simultaneously. Ada pays $1.20. If Alice wins, she wins $1 (net -$0.20); same for Bob or Carol.  
  - With protection: Bookie sells Ada a $0.40 bet on Alice. She now has an open bet and rejects bets on Bob/Carol. If Alice wins, she wins $1 (net +$0.60); if Alice loses, she loses $0.40. The bookie cannot force a second bet. No strategy guarantees profit: outcomes split between Ada’s gain (+$0.60 if Alice wins) or loss (-$0.40 if Alice loses), and bookie risks loss.  

  **Key insights**:  
  1. **Load-bearing feature**: The "one open bet" rule blocks simultaneous exposure. It prevents the bookie from combining multiple bets into a sure-loss package.  
  2. **Collapse test**: Without this rule, Ada accepts all three bets and loses $0.20 in every world, confirming the standard Dutch book.  
  3. **Defender’s reply**: The Dutch book theorem only shows *vulnerability* to guaranteed loss, not that exploitation always occurs. This saves the theorem’s technical claim but undermines the folk reading that incoherence inevitably leads to *actual* exploitation in practice.  

  ### Case B: Coherent but Diachronically Exploited  
  Bea posts a coherent prior today over a drug trial:  
  - Hypothesis H (drug effective): $0.50 (P(H) = 0.5)  
  - Signal S (interim result: Positive (P) or Negative (N)): $0.55 for S=P (P(S=P) = 0.55), $0.45 for S=N (P(S=N) = 0.45)  
  Her joint probabilities are: P(H and S=P) = 0.4, P(H and S=N) = 0.1, P(not H and S=P) = 0.15, P(not H and S=N) = 0.35. She also posts an updating plan: if S=P, she’ll set P(H) = 0.9 (overconfident in the drug); if S=N, she’ll set P(H) = 0.2 (dismissive). Correct conditionalization would set P(H|S=P) = 0.4/0.55 ≈ 0.727 and P(H|S=N) = 0.1/0.45 ≈ 0.222.  

  The bookie exploits her with:  
  1. Today: Buys a bet from Bea paying $1 if H and S=P, at her price of $0.40.  
  2. Today: Buys a bet from Bea paying $1 if H and S=N, at $0.10.  
  3. After S is revealed:  
     - If S=P, Bea’s P(H) = 0.9, so she’ll sell a $1-if-H bet for $0.90. Bookie sells it to her for $0.90.  
     - If S=N, Bea’s P(H) = 0.2, so she’ll sell a $1-if-H bet for $0.20. Bookie sells it to her for $0.20.  

  *Mechanics* (Bea’s net cashflow):  
  | State          | t0: Buys (H∧S=P) & (H∧S=N) | t0: Receives for bets sold | After S: Pays for $1-if-H bet | End: Pays if (H∧S=P) or (H∧S=N) | End: Receives if H from $1-if-H bet | Net  |  
  |----------------|-----------------------------|----------------------------|-------------------------------|----------------------------------|-------------------------------------|------|  
  | H and S=P     | -$0.40 (liability)         | +$0.40 + $0.10 = +$0.50   | -$0.90 (S=P branch)         | -$1.00 (for H∧S=P)              | +$1.00                             | -$0.80 |  
  | not H and S=P | -$0.40 (liability)         | +$0.50                    | -$0.90                        | $0.00                            | $0.00                              | -$0.80 |  
  | H and S=N     | -$0.10 (liability)         | +$0.50                    | -$0.20 (S=N branch)         | -$1.00 (for H∧S=N)              | +$1.00                             | -$0.80 |  
  | not H and S=N | -$0.10 (liability)         | +$0.50                    | -$0.20                        | $0.00                            | $0.00                              | -$0.80 |  

  **Key insights**:  
  1. **Load-bearing feature**: Bea’s non-conditional updating plan. The bookie leverages her commitment to update irrationally, hedging across time.  
  2. **Collapse test**: If Bea updates via conditionalization, the bookie’s strategy fails. For example, in S=P, she would set P(H)=0.727 and sell a $1-if-H bet for $0.727, preventing the guaranteed loss.  
  3. **Defender’s reply**: This shows the Dutch framework extends diachronically, requiring conditionalization. A critic notes this concedes that synchronic coherence alone is insufficient—the folk reading often overlooks this temporal dimension, overstating axioms as a complete shield.  

  ### Verdict  
  Case B does more damage to the folk reading. While Case A clarifies that incoherence doesn’t guarantee *actual* exploitation (only vulnerability), Case B demonstrates that synchronic coherence offers *zero protection* against diachronic exploitation—exposing a gap in the simplistic "axioms prevent Dutch books" narrative. The folk reading often omits temporal dynamics, making Case B a stronger counterexample.

