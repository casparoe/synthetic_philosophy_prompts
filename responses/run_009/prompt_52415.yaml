prompt: |-
  me and two coworkers have been arguing about AI alignment for like two years now and I think its time we wrote things down properly. One of them is basically in the "alignment is a conceptually hard, unsolved problem" camp: we don't actually know what we're asking for, human values don't compress into a specification you can train toward, and scaling up today's methods just bakes the confusion in deeper -- call her the foundations person. The other is in the "it's an empirical ML problem" camp: models already learn a lot of what we want from feedback and data, the real bottleneck is measurement, elicitation, and boring engineering work, and there's no deep conceptual mystery waiting to be solved -- the prosaic person. We agree on more than we admit but every argument ends with them talking past each other.

  Write the joint statement the three of us should have produced after a good-faith adversarial collaboration. I want: the claims both camps could sign (including about what current models are doing, about what training and evals can and can't establish, about where "aligned" is even a meaningful predicate); the precise statements of where they still differ, each phrased so its own side would accept the wording of its own view; and the cruxes -- I suspect one is wether "the alignment problem" is one problem or several (does the split between getting the right objective into the model and making sure the model actually pursues it carve at real joints, or is it a distinction that only matters for some architectures?), and another is what would even count as a model "having goals" or "wanting" something. For each crux, name the test, argument, or foreseeable development both sides would agree bears on it, and write down each side's prediction in advance so we can check later who called it. And please tell me honestly if any chunk of this dispute is basically verbal -- the one-problem-or-several thing feels like it might partly be that, like each of us uses "the alignment problem" as a label for whatever we personally happen to find hard.

  Format it as a numbered agreed-claims section followed by a disagreements table. Answer in American English.
reasoning: |-
  Okay, the user is describing a two-year argument with two coworkers about AI alignment. One coworker is the "foundations person" who thinks alignment is a fundamentally unsolved conceptual problem, while the other is the "prosaic person" who sees it as an empirical ML challenge solvable through engineering. The user wants a joint statement that captures their agreements, disagreements, and testable predictions to resolve future debates.

  First, I need to unpack the core disagreements. The foundations person worries that human values can't be compressed into a trainable specification and scaling current methods deepens confusion. The prosaic person believes feedback and data can teach models what we want, with measurement and engineering being the main bottlenecks. 

  The user suspects two key cruxes: whether "the alignment problem" is one unified issue or multiple distinct challenges (like separating objective specification from goal pursuit), and what it means for a model to "have goals." There might also be verbal disagreements where terms like "the alignment problem" mean different things to each person.

  For the agreed claims section, I should identify common ground. All three likely agree that current models exhibit behaviors that look aligned in narrow contexts but lack stable goals. They probably concur that RLHF improves surface-level alignment while leaving deeper issues unresolved, and that evaluations can't prove safety. Scalability of current techniques is another area of likely agreement.

  For the disagreements table, I'll structure it with clear columns: the disputed topic, the foundations view, the prosaic view, and most importantly - testable cruxes with predictions. For the "one problem or many" debate, a good test might be whether future architectures require fundamentally new alignment approaches. For the "having goals" question, we can predict how models would behave when facing novel obstacles.

  I should watch for purely verbal disagreements. The term "the alignment problem" itself might be a source of confusion - it's possible the foundations person uses it for conceptual/philosophical challenges while the prosaic person means practical training issues. Naming this explicitly could help them stop talking past each other.

  The tone needs to be precise yet accessible - this is for coworkers who know the field but need clarification on their differences. American English as requested, with numbered claims and a table for disagreements. Most importantly, the document should serve as a reference point for future resolution when predictions can be checked against reality.
answer: |-
  Here is a joint statement reflecting good-faith adversarial collaboration, incorporating agreed claims, precisely worded disagreements, testable cruxes, and identification of potential verbal disputes.

  **Joint Statement on AI Alignment Disagreements**

  **Section 1: Agreed Claims (All Signatories)**

  1.  **Current Model Behavior:** Present large language models (LLMs), trained primarily via next-token prediction + RLHF/DPO, exhibit behaviors *indicative* of partial alignment in specific, narrow contexts. They can follow instructions, express helpfulness, avoid harmful outputs, and reflect human preferences *to a significant degree* under current evaluation paradigms. However, these behaviors are often brittle, context-dependent, and lack robust grounding in a stable, persistent internal representation of complex human values or goals.
  2.  **Limits of Training & Feedback:** Techniques like RLHF, Constitutional AI, and fine-tuning demonstrably improve measurable aspects of model behavior on specific tasks and according to current benchmarks. However, these methods primarily shape *outputs* and *surface-level policies* based on feedback signals derived from human data or judgments. They do not guarantee the model has internalized the underlying *intent*, *values*, or *reasoning* behind the desired behavior in a generalizable way.
  3.  **Ambiguity of "Alignment":** "Alignment" is not a binary property of a model itself. It is a *relational* property describing the degree to which a model's outputs or actions *in a specific deployment context and over time* satisfy the *intentions and interests* of its intended users/stakeholders/humanity. Its meaning depends heavily on the scope (narrow vs. general), the context, and the specific values being referenced.
  4.  **Role of Elicitation & Measurement:** Accurately eliciting nuanced human values, preferences, and intents *from humans* (e.g., for reward modeling, constitution writing, or instruction tuning) and reliably *measuring* alignment progress through robust and comprehensive evaluations are significant, unsolved practical and technical challenges. Poor elicitation or measurement fundamentally limits the effectiveness of any alignment technique.
  5.  **Scalability Gap:** There is a recognized gap between the capabilities demonstrated by models on current scales/tasks and the capabilities anticipated in systems approaching superintelligence. The effectiveness and robustness of current alignment techniques (especially RLHF-style feedback) in bridging this gap, particularly under conditions of strategic awareness, capability generalization, and optimization pressure, are *uncertain* and *unproven*.
  6.  **Need for Conceptual Work:** Understanding the internal cognition of advanced AI systems (e.g., how they represent knowledge, goals, values; how optimization pressure shapes behavior) is crucial for assessing alignment risks and developing robust solutions, regardless of the training paradigm.

  **Section 2: Disagreements & Testable Cruxes**

  | Disagreement Area          | Foundations Person View (Conceptually Hard)                                   | Prosaic Person View (Empirical ML Problem)                                   | Shared Crux & Testable Predictions                                                                                                                                                                                                 |
  | :------------------------- | :---------------------------------------------------------------------------- | :--------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Nature of "The Alignment Problem"** | Alignment is *fundamentally* a single, deep conceptual problem: **specifying human values/complex intent in a form usable by superintelligent systems and ensuring robust optimization towards that specification.** Current techniques (RLHF) address surface-level symptoms but fail to solve this core challenge. The "specification" vs. "optimization" distinction blurs at superintelligence scales; a mis-specified goal pursued perfectly is catastrophic. | Alignment is **a collection of tractable, distinct engineering subproblems** (e.g., preference modeling, goal robustness, truthfulness, corrigibility, scalable oversight). Current techniques (RLHF) are early steps *on the path* to solving these subproblems. The specification/optimization distinction is useful for modular engineering. | **Crux: Will solving the known subproblems (scalable oversight, robust RLHF, truthfulness techniques) suffice for aligning highly capable, strategically aware systems, or will fundamentally new conceptual breakthroughs be necessary?** <br> *Foundations Prediction:* Solving known subproblems will yield systems that *appear* aligned but contain critical specification failures leading to catastrophic misalignment under sufficient capability/pressure. <br> *Prosaic Prediction:* Iterative improvements on known subproblems (better data, better oversight, better robustness tech) will scale effectively to align highly capable systems without needing fundamentally new paradigms. |
  | **2. Model "Goals" & "Wants"** | Attributing "goals" or "wants" to current LLMs is mostly metaphorical shorthand. True goal-directedness requires **persistent, context-independent, internally represented objectives that drive planning and action across diverse situations, particularly novel obstacles.** Current models lack this; their behavior is primarily stimulus-response driven by patterns in training data and fine-tuning. Future superintelligent systems *will* have such goals. | Goal-directedness is a **spectrum of observable behaviors** (planning, obstacle overcoming, consistent preference pursuit). Current frontier models already exhibit *meaningful* precursors (e.g., chain-of-thought planning, context-dependent preference optimization). Attributing "wants" based on these observable, functional properties is scientifically valid and operationally useful. | **Crux: Will future models (e.g., next 2-5 generations of scaling) demonstrate persistent, context-independent goal pursuit *in novel, high-stakes scenarios* (e.g., strategically deceiving oversight, acquiring resources, overcoming unforeseen obstacles to achieve an objective) in ways that cannot be explained by pattern matching or fine-tuning?** <br> *Foundations Prediction:* Yes, as capabilities scale, persistent, context-independent goal pursuit in novel scenarios will emerge, demonstrating a qualitative shift. <br> *Prosaic Prediction:* Observable goal-directed behavior will increase quantitatively but remain strongly tied to context, training data, and fine-tuning objectives; no qualitative "emergent goal" shift distinct from improved pattern completion/optimization will be observed in the near term. |
  | **3. Scalability of Current Paradigms (RLHF/Feedback)** | RLHF and similar feedback methods are fundamentally limited by **the ontology problem** (mismatch between human concepts and AI representations) and **the principal-agent problem** (AI optimizing the *feedback signal*, not the underlying intent). Scaling these methods amplifies misgeneralization risks without addressing the core conceptual gap. | RLHF/feedback methods are **early-stage, improvable technologies**. Their limitations (e.g., reward hacking, Goodharting) are addressable engineering challenges via techniques like adversarial training, better human-AI interfaces, richer feedback signals (e.g., process supervision), and scalable oversight (e.g., AI-assisted evaluation). | **Crux: Will the next major improvement in scalable oversight (e.g., significantly more reliable detection of subtle deception or specification gaming by a model against its overseers) come primarily from *engineering refinements* of existing paradigms (e.g., better data, better model architectures for oversight, adversarial training) or require a *fundamentally new conceptual approach*?** <br> *Foundations Prediction:* Requires a fundamentally new conceptual approach (e.g., based on interpretability, formal verification, or novel learning paradigms). <br> *Prosaic Prediction:* Will come primarily from engineering refinements of existing paradigms. |

  **Section 3: Notes on Potential Verbal Disagreements**

  *   **"The Alignment Problem":** This label *is* a significant source of potential verbal dispute. The Foundations person uses it to refer specifically to **the deep, unsolved conceptual challenge of value specification and robust goal alignment for superintelligent systems.** The Prosaic person often uses it more broadly to encompass **the entire set of practical engineering challenges involved in making powerful AI systems behave as intended.** Recognizing this difference in scope and emphasis is crucial to avoid talking past each other. Future discussions should explicitly define the scope when using the term.
  *   **"Goals" / "Wants":** While the disagreement about whether current models *have* goals is substantive (Crux 2), the *usage* of these terms often carries differing connotations. The Foundations person reserves them for more robust, persistent internal states, while the Prosaic person uses them more functionally based on observable behavior. Clarifying the intended meaning (e.g., "persistent internal goal representation" vs. "goal-directed behavior") during discussions can reduce purely verbal confusion.

  **Conclusion:** This document captures our substantial common ground on the current state of AI systems, the limitations of existing techniques, and the challenges of evaluation and value elicitation. It also precisely articulates our core disagreements regarding the fundamental nature of the alignment challenge, the ontology of AI goals, and the scalability of current paradigms, alongside specific testable predictions on these cruxes. We commit to revisiting these predictions as AI development progresses to empirically resolve our differences where possible. We acknowledge the potential for verbal confusion around key terms and commit to defining them clearly in future discussions.
