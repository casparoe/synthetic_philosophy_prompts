  ## The Unnoticed Drain

  Arthur Finch traced the soft, worn edge of the *Liber Veritatis* print – Claude Lorrain’s idyllic harbour scene, bathed in that perfect, golden afternoon light only the old masters seemed to capture. Print No. 32. It was his anchor, his baseline. Around it, his collection pulsed with quiet, shifting desires.

  Silas Vance’s shop, “Vance & Verity,” smelled perpetually of dust and linseed oil, a comforting aroma for Arthur. Silas, lean and watchful behind thick spectacles, moved with the quiet precision of a spider assessing its web. Today, he laid out a different Lorrain harbour scene, Print No. 45, under the glass-topped counter. The composition was similar, but the paper was crisper, the lines sharper, the blues of the water marginally deeper.

  “Ah, Finch,” Silas murmured, his voice like dry leaves. “Remember you admired No. 45 last month? Found it tucked away. Superior impression, wouldn’t you say? Less… worn.” He tapped the glass lightly over Arthur’s beloved, slightly foxed No. 32.

  Arthur leaned in. Yes, the clarity *was* remarkable. His No. 32 felt suddenly… faded. A pang of possessiveness warred with aesthetic appreciation. “It *is* sharper,” Arthur conceded. “But 32… it has a certain warmth.”

  “Nostalgia, Finch, nostalgia.” Silas waved a dismissive hand. “A collector values condition above sentiment, surely? Look at that paper.” He paused, letting the silence stretch. “Tell you what. Feeling generous. Your 32, plus a mere… twenty pounds? We call it even. An upgrade, pure and simple.”

  *Twenty pounds.* For this leap in quality? It felt trivial against the potential gain. The slight fuzziness of No. 32, unnoticed moments before, now seemed glaring. He *did* prefer sharper lines. The trade was made. Arthur left with No. 45, the crisp paper satisfying under his fingertips, the twenty pounds a negligible sacrifice for tangible improvement. Silas pocketed the note, the ghost of a smile touching his lips as he slid the slightly worn No. 32 into a drawer.

  * * *

  Weeks later, Arthur returned, drawn by a vague restlessness. No. 45 hung proudly, yet… something felt incomplete. Silas, as if expecting him, produced another Lorrain harbour. Print No. 18. Older, rarer. The paper was noticeably yellower, the lines softer again, reminiscent of his old No. 32, but… it possessed an undeniable gravitas. It felt *complete*; a tiny, almost invisible ship, absent in 45 and 32, sailed near the horizon.

  “Ah, the elusive Eighteen!” Silas breathed. “Part of the very first published set. History in your hands, Finch. Makes the Forty-Five look a bit… modern, wouldn’t you say? Clinical, almost.”

  Arthur stared. The crispness of No. 45 suddenly seemed sterile, lacking the weight of time, the subtle mystery of that tiny ship. He *did* prefer the sense of history, the narrative implied by age and rarity. His preference had shifted, unnoticed even by himself.

  “It’s magnificent,” Arthur breathed. “But No. 45… its condition…”

  “Condition isn’t everything, my friend,” Silas soothed. “Character. Provenance. The story *behind* the print. Forty-Five is fine, but Eighteen… Eighteen *speaks*. Tell you what.” He leaned closer, conspiratorial. “Your Forty-Five is certainly desirable. I could take it off your hands… and give you, say, thirty pounds *along* with Eighteen? Compensating you for the lesser condition, of course. A fair exchange for acquiring such history?”

  *Thirty pounds?* To gain this piece of the past? Silas was practically giving him money to take the superior (historically speaking) piece! His current No. 45 felt suddenly insubstantial. The trade was irresistible. Arthur left richer by thirty pounds and clutching the venerable, slightly yellowed No. 18, the tiny ship a secret talisman. Silas slid the crisp No. 45 into the same drawer.

  * * *

  Another month bled away. Arthur admired No. 18, yet a subtle dissatisfaction gnawed. The paper *was* yellowed. The image, while historically resonant, felt… muted. He found himself missing the vibrant clarity, the sheer *presence* of a print in prime condition. He wandered into Vance & Verity, ostensibly browsing, but drawn magnetically to the counter.

  Silas didn’t speak immediately. He polished his spectacles, then, with deliberate care, placed Arthur’s original Print No. 32 under the glass. The warm light, the familiar composition, the very *soul* of the harbour scene Arthur had first loved. The slight foxing now seemed a badge of honour, a patina of appreciation. Compared to the faded No. 18, it glowed with vitality.

  “Found this tucked away again,” Silas remarked casually. “Remember it? There’s a warmth to Thirty-Two the others lack. A certain… integrity. That slight wear? Proof it’s been loved. Eighteen is grand history, but Thirty-Two… Thirty-Two feels like *home*.”

  Arthur’s breath caught. Silas was right. The crispness he’d craved before now felt cold. The historical weight of No. 18 felt burdensome. He wanted that golden light, that comfortable familiarity. He *preferred* this. Now.

  “It does,” Arthur murmured, a pang of nostalgia sharp and sweet. “It really does.”

  Silas nodded sagely. “Sentiment has its place, Finch. A true collection reflects the collector’s heart, not just catalog numbers. But… condition *is* a factor. Thirty-Two is well-loved, but Eighteen is undoubtedly rarer.” He tapped the glass. “Tell you what. To balance the scales… I’ll take Eighteen. You take Thirty-Two. And… you add fifteen pounds? A token, really. Recognizing the difference in rarity and condition between them. A small price to return to what truly speaks to you, no?”

  *Fifteen pounds.* To reclaim his anchor, his beloved No. 32? After holding the faded No. 18, the vibrancy of 32 seemed priceless. The fifteen pounds vanished from Arthur’s wallet, a trivial toll on the road back to aesthetic comfort. He clasped the familiar print, a warmth spreading through him. He was home. Silas placed the yellowed No. 18 carefully beside No. 45 in the drawer.

  * * *

  Arthur sat in his study months later, surrounded by his prints. The harbour scene – his original No. 32 – hung in its accustomed place. The light was golden, the composition perfect. He should have felt content. Yet, a persistent unease lingered, a hollow sensation unrelated to the art itself. He’d finally balanced his accounts, a task he usually avoided.

  The numbers were stark. Small deductions, easily justified at the time, stacked up. Twenty pounds out. Thirty pounds in. Fifteen pounds out. A net loss of five pounds. Then he remembered the other cycles: the time he’d swapped a Poussin for a different state, adding ten pounds for "superior inking," only to later trade *that* for an earlier impression (less crisp but more "authentic"), receiving five pounds back, before finally circling back to his original Poussin type, paying another seven pounds to "correct the imbalance." Loss: twelve pounds. And the small Watteau cycle last year… another eight pounds vanished in similar, insignificant increments.

  He stared at the bank statement. Hundreds of pounds lighter over the past few years. Not from large, foolish purchases, but from a dozen, two dozen tiny transactions, each a step forward, an upgrade, a correction, a return to preference. Each trade, in the moment Silas proposed it, had felt not just reasonable, but *wise*. An improvement. A bargain, even. A to B: better condition! B to C: superior history! C to A: truer aesthetic feeling! Each step was a peak; he never glimpsed the valley he was traversing in a circle.

  He looked at Print No. 32. It was the same print. He was the same man. Yet, he felt… diminished. Drained. Not robbed, precisely. He’d consented every time, eagerly. He’d *gained* with each exchange: better condition, deeper history, purer feeling. How could gaining lead to losing?

  Silas Vance hadn’t cheated him. Silas had merely… facilitated his desires. Listened. Offered what Arthur, in that precise moment, demonstrably preferred. Arthur had followed his own impeccable logic, trade by trade, and arrived back where he started, inexplicably poorer. The loss wasn't in the prints; they were unchanged. The loss was siphoned off in the cracks *between* his perfectly rational choices, invisible at every single point of decision. He traced the edge of No. 32, the familiar warmth now tinged with a chilling bewilderment. The harbour scene remained serene, bathed in its unchanging golden light, oblivious to the slow, imperceptible leak that had occurred right under Arthur’s nose, one sensible choice at a time. He had been perfectly rational. And it had cost him dearly.
