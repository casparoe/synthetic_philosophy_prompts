prompt: |-
  My flatmate and I started keeping a log of her judgments about when it's acceptable to take another person's word on a moral question rather than working the matter out for ourselves — it began as a seminar argument about whether moral deference is somehow second-rate, and turned into a running catalogue of her rulings. Her verdicts so far: she asked her mentor whether to report a friend's plagiarism, and acted on the mentor's "yes" without ever reconstructing the reasoning, and thinks that was entirely fine; when an acquaintance at a party declared that the host's joke had been cruel, she refused to treat that as settled and thought through the joke herself, and believes her refusal was right; she votes by her union's endorsement in elections she has no time to study, and thinks nothing of it; and when a vegan friend of many years told her that eating meat is wrong, she spent weeks reading the arguments before changing her diet, and says she would have felt cheated in herself if she had simply adopted her friend's verdict.

  The new case: she is reaching for an unfamiliar chocolate bar at the shop when a stranger — no expertise, no relationship to her — tells her the brand relies on child labour and that buying it would be wrong. There is no realistic way to investigate the supply chain from the aisle, and no cheaper alternative brand on the shelf that she knows anything about either. What will she say about deferring to the stranger here? I am less interested in the bare answer than in the candidate rules that could be generating her record — I can dimly see a rule distinguishing acting on trusted advice from adopting a moral belief, a rule keyed to whether genuine deliberation is feasible in the moment, and perhaps something about who has the standing to tell her anything at all — along with what each rule predicts about the chocolate case, and your best guess, with reasons, about which rule she is actually running. Please also name the further case that would best divide the rules that happen to agree on the chocolate bar. One caveat: if you think her record is too thin, or the cases too dissimilar, for any single rule to be doing real work, say that plainly instead of manufacturing a neat theory to flatter the exercise. Please keep the whole answer under 400 words.
reasoning: |-
  Hmm, the user presents a fascinating puzzle about their flatmate's pattern of moral deference judgments. They've cataloged four prior cases: deferring to a mentor on plagiarism, refusing to defer to an acquaintance about a joke's cruelty, deferring to union voting recommendations, and requiring extensive personal research before accepting a friend's vegan stance. Now they want to predict the flatmate's reaction to a stranger's child labor claim about chocolate, while focusing on identifying underlying rules rather than just the outcome.

  The challenge is to extract coherent principles from seemingly inconsistent behaviors. Key variables appear to include: relational trust (mentor vs stranger), feasibility of deliberation (impossible while voting vs possible for the joke), and nature of moral adoption (acting vs believing). The chocolate case perfectly isolates these factors: zero-trust relationship, impossible in-the-moment verification, and the stranger demanding belief adoption rather than just action guidance.

  For rule candidates:
  - Trust-based rule would predict rejection of stranger's claim
  - Feasibility rule might permit deference when verification is impossible
  - Action/belief distinction could allow buying alternative (action) while rejecting the moral claim

  The most elegant solution seems to be the "standing to command belief" principle - she rejects unsolicited moral verdicts from non-trusted sources regardless of practicality. This explains why she demanded weeks of research from a friend (trusted but claiming moral authority) yet accepted union advice (organizational legitimacy without moral imposition).

  To test this against competing rules, I'd propose a case where a trusted person gives impractical moral advice (e.g., close friend claims skipping morning coffee is ethically urgent - would she act immediately or research first?). This would distinguish trust from standing considerations.
answer: |-
  Based on her record, the strongest candidate rule is **distinguishing between acting on advice and adopting a moral belief, particularly rejecting unsolicited moral verdicts from those lacking standing or trust.**

  *   **Rule:** She defers in *action* when deliberation is impractical (voting, *maybe* plagiarism if time-sensitive) or from trusted sources (mentor, union-as-proxy). She refuses to *adopt a moral belief* based solely on another's say-so without personal deliberation, especially from those without established trust/standing, viewing it as a personal failure.
  *   **Prediction for Chocolate:** She **rejects deferring to the stranger's moral verdict**. The stranger has zero standing/trust. While she *might* avoid buying the bar as a practical precaution (acting cautiously without accepting the *belief*), she would refuse to adopt the stranger's claim "buying it is wrong" as her own moral belief without investigation. She'd feel cheated accepting this unsolicited moral pronouncement.
  *   **Reasoning:** The vegan case is key – even a trusted friend couldn't command belief adoption without her deliberation. The acquaintance at the party lacked standing to settle her moral judgment. The mentor/union provided practical guidance she acted on, not necessarily belief adoption. The stranger's unsolicited "this is wrong" mirrors the acquaintance/vegan-friend scenarios negatively. Impractical deliberation might let her *act* cautiously by choosing something else, but not *believe* the stranger's moral claim.

  **Alternative rules and predictions:**
  1.  **Feasibility of Deliberation:** Permits deference when genuine deliberation is impossible (voting, *maybe* chocolate). Predicts she *would* defer to the stranger here. *Contradicted* by her refusing to defer to the acquaintance at the party where deliberation *was* feasible – the rule wouldn't explain that refusal.
  2.  **Trusted Source Requirement:** Requires an existing relationship/trust (mentor, union, friend). Predicts she rejects the stranger. *Weakened* by the union (organizational, not personal trust?) and doesn't fully explain the *intensity* of her refusal to adopt the vegan friend's *belief* without work.

  **Best Dividing Case:** 
  *   **Scenario:** Her deeply trusted mentor (who advised on plagiarism) tells her, unprompted, that a specific common charitable practice (e.g., buying charity Christmas cards) is actually morally problematic.
  *   **Division:**
      *   The **Action/Belief + Standing rule** predicts she *acts* (stops buying cards) but *does not adopt the belief* as her own without personal deliberation (like the vegan case), feeling obliged to investigate the mentor's *moral claim*.
      *   A pure **Trusted Source rule** might predict she readily adopts the mentor's moral belief *and* acts without needing deliberation.
      *   A **Feasibility rule** is less clear here (deliberation is possible).

  Her record, while thin, consistently shows resistance to *adopting moral beliefs* based on others' assertions without work, especially from non-authorities/unsolicited sources. The **Action/Belief + Rejection of Unsolicited Moral Verdicts from Low-Standing Sources** rule best fits this pattern.

  **Prediction:** She buys a different chocolate (or nothing), rejecting the stranger's *moral claim* as something she must believe, and feels correct in not adopting their verdict.
