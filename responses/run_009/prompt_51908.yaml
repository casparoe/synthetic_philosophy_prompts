answer: |-
  Your angle is **strong, nuanced, and absolutely holds water**. The core connection between Borges' "A New Refutation of Time" and *Memento* is genuinely insightful and goes far beyond superficial "time is weird" comparisons. Here's a breakdown supporting your approach, addressing your questions, and suggesting how to land the piece:

  **Why the Fit Works Brilliantly:**

  1.  **Literalizing the Atomized Present:** You nailed it. Leonard Shelby *is* a living experiment in Borges' hypothesis. Borges argues that "the present... contains no vestige of the past," and that identity is a "succession of states" where each moment is sufficient unto itself. Leonard's anterograde amnesia forces him into exactly this state. His "self" is defined entirely by the *current* moment's sensory input, emotional state, and the **externally curated artifacts** (photos, notes, tattoos) he uses to bridge the abyss. He embodies "the present" as Borges describes it – isolated, self-contained, lacking inherent connection to prior moments.
  2.  **The Paradox of the "River":** Borges' famous closing lines ("Time is the substance I am made of... I am the river... I am the tiger... I am the fire") are both poetic and paradoxical. He refutes linear time while simultaneously acknowledging the undeniable *feeling* of being swept along by it. Leonard embodies this paradox tragically:
      *   **Vindication?** In a limited sense, yes. Leonard *demonstrates* that a form of conscious life, driven by immediate needs and curated "facts," *can* persist without experienced succession. He has desires, fears, a mission – all built on the scaffolding of the present moment and his artifacts.
      *   **Demolition?** Absolutely. Leonard's existence is the *reductio ad absurdum* of the refutation's practical consequences. Without duration, without the river carrying *his own* narrative forward, he becomes terrifyingly vulnerable. He *is* putty for Teddy, Natalie, and crucially, **his own prior self**. His identity isn't a stable river he *is*, but a series of isolated puddles easily manipulated and rewritten. The "river" becomes external forces (other people, his past notes) imposing a false narrative *onto* him. This exposes the profound vulnerability and potential for self-deception inherent in a purely present-tense existence without authentic memory. Borges intellectually explores the illusion; Nolan viscerally demonstrates its existential horror.

  **The "Funes" Parallel (and Where It Breaks):**

  *   **The Core Resonance:** The parallel is excellent. Both are radical thought experiments exploring the extremes of memory's relationship to identity and time.
      *   **Funes:** Drowns in the infinite, simultaneous, debilitating detail of *total recall*. He cannot think abstractly because he is trapped in the totality of every past moment. Time collapses into an unbearable, paralyzing simultaneity.
      *   **Leonard:** Engineered a state of *chosen forgetting* (even if initially forced by trauma, he actively maintains it). He cannot build a narrative or meaning from the past because he lacks access to it. Time collapses into disconnected, isolated instants.
  *   **Where it Breaks (Productively):**
      *   **Agency & Deception:** Funes is a passive victim of his memory. Leonard is **actively complicit** in his condition. He *chooses* which facts to tattoo, *chooses* to ignore evidence contradicting his narrative (Sammy Jankis), *chooses* to forget Teddy's warnings. His forgetting isn't just an absence; it's a curated, weaponized amnesia fueled by a desperate need for purpose. Borges explores the *consequences* of memory extremes; Nolan explores the terrifying *agency* possible within forgetting, especially self-deception.
      *   **Curation vs. Overload:** Funes is overwhelmed by unfiltered reality. Leonard relies entirely on **curated, externalized representations** of reality (notes, photos, tattoos). His world is constructed from symbols *about* the world, not direct, continuous experience. This adds a layer of mediation and potential error/fabrication absent in Funes.

  **Where the Film Resists the Borges Reading (Honesty Time):**

  1.  **Genre Conventions:** You're right. Significant stretches operate as a tightly wound neo-noir thriller. The suspense, double-crosses, femme fatale elements (Natalie), and Leonard's relentless quest are driven by plot mechanics, not purely philosophical inquiry. The ambiguity surrounding Sammy Jankis and Leonard's wife serves narrative mystery as much as metaphysical uncertainty.
  2.  **Psychological Trauma vs. Pure Metaphysics:** Leonard's condition stems from violent trauma and grief. His "system" is as much a coping mechanism for unbearable loss and a justification for continued existence ("I have to believe in a world outside my own mind") as it is a pure embodiment of atomized time. The film explores the *psychology* of memory and identity disruption, grounded in human pain, whereas Borges operates more abstractly.
  3.  **The Ambiguity of "Truth":** Borges' essay is about the *nature* of time and perception. *Memento*'s central ambiguity (Is Leonard being manipulated? Is Sammy a projection? Did his wife survive the attack?) is more about the unreliability of narrative and the fallibility of Leonard's system than a direct comment on the ontological status of time itself. It's epistemological (how do we know?) layered onto the ontological (what is time?).

  **What Nolan Dramatizes That Borges Couldn't (The Landing Paragraph):**

  **This is the clinching argument for your piece.** Borges, the master of the labyrinthine library and the conceptual puzzle, could *describe* the refutation of time with elegant, chilling logic. But Nolan, wielding the visceral, sensory, and temporal tools of cinema, forces us to *inhabit* it. He dramatizes the:

  *   **Embodied Suffering:** We don't just understand Leonard's condition intellectually; we *feel* his disorientation, frustration, and paranoia through the film's structure and Guy Pearce's performance. We experience the nausea of the eternal present.
  *   **Fragility of the Curated Self:** Borges writes about the illusion; Nolan shows us the tattoo needle etching a fragile, manipulable identity onto vulnerable skin. We see the notes being written, misinterpreted, destroyed, rewritten. We witness the terrifying ease with which the "self" built on artifacts can be hijacked.
  *   **Visceral Cost of Self-Deception:** Borges plays intellectual games with identity. Nolan shows us the raw, bloody, tragic *consequences* of choosing a sustaining lie over an unbearable truth. Leonard isn't just a philosophical concept; he's a man destroying himself and others to maintain the fiction that gives him purpose – a purpose only possible *because* he rejects the continuity of time and self Borges questions.
  *   **Temporal Architecture as Experience:** The reverse chronology isn't just a gimmick; it's the formal manifestation of Leonard's consciousness. We are trapped in his "present," discovering the "past" (which is our chronological future) only as he does, through unreliable artifacts. Cinema uniquely makes us *live* the fragmented temporality Borges theorized.

  **Is the Fit a Stretch? Should You Swap Films?**

  **No, absolutely not.** *Memento* is arguably the *best* possible film to explore Borges' "A New Refutation of Time" in a mainstream context. The connection is profound, layered, and genuinely illuminating for both the film and the essay. While *Inception* touches on layered realities (a Borgesian staple), or *Tenet* on inverted time, neither engages as deeply or specifically with the *atomization of the present and the constructed self* as *Memento* does. The parallels to "Funes" and the core themes of time, memory, and identity are exceptionally strong. The "stretches" where it operates as a thriller don't invalidate the philosophical core; they provide the necessary human drama and tension to make the metaphysics *matter*.

  **Conclusion & Landing Paragraph Suggestion:**

  Your angle is excellent. Lean into the tension: Leonard as both the embodiment *and* the refutation of Borges' hypothesis. Emphasize the tragedy Nolan adds – the embodied cost, the vulnerability, the weaponization of forgetting, and the desperate, destructive agency Leonard exercises within his fragmented reality. Borges gave us the intellectual blueprint for dissolving time; Nolan built the labyrinth and forced us to run through it, blindfolded, feeling the walls for clues that might only lead us deeper into our own curated delusions. The final paragraph should land on cinema's unique power to make philosophy *felt*:

  > "Borges, with the precision of a metaphysician and the imagination of a poet, could argue that time is a river we merely dream we sail upon. Christopher Nolan, armed with the visceral language of cinema, forces us into the lifeboat. In Leonard Shelby, he gives us a man living Borges' refutation – a consciousness adrift in an endless, disconnected present, sustained only by the flotsam of notes and tattoos. Yet *Memento* transcends philosophical illustration; it becomes a brutal autopsy of that condition. Where Borges elegantly dissolves the river, Nolan drowns us in the terrifying consequence: a self reduced to scribbles on skin, endlessly rewritable by others and by its own desperate lies. Leonard isn't proof time is an illusion; he's the horrifying testament to what happens when we try to live as if it is. Borges showed us the map of the labyrinth; Nolan locked us inside, forcing us to feel every disorienting turn, every dead end built from our own need to believe. The multiplex didn't just smuggle in 20th-century philosophy; it gave us its beating, traumatized heart."
