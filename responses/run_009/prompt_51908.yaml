  Now, analyzing Borges' essay: Borges refutes time by arguing that if each moment is self-sufficient, succession is an illusion. Identity doesn't need continuity. Leonard's condition literalizes this—no past, only present moments mediated by artifacts. But Leonard's vulnerability to manipulation (Teddy, Natalie) might challenge Borges. If time is an illusion, why does Leonard's lack of duration make him so exploitable? This tension is key.

