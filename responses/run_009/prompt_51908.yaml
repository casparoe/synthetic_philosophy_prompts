  Where the film resists Borges: *Memento*'s non-linear structure and thriller elements prioritize suspense over pure philosophy. Leonard's quest for vengeance drives the plot, which might overshadow metaphysical themes. Also, the film's ambiguity about Sammy Jankis questions if Leonard's identity is stable, adding psychological depth beyond Borges' abstract argument.

  What Nolan dramatizes uniquely: Cinema's sensory immersion makes philosophy visceral. We experience Leonard's confusion through structure and visuals. The tattooed skin as a literal palimpsest of identity—something Borges' text can't replicate. Nolan shows the *embodied cost* of living Borges' theory, making it tangible and tragic.

  Is the fit forced? Actually, it holds well. Leonard as a test case for Borges' ideas creates rich tension. Alternatives like *Inception* are tempting but less precise for Borges. *Memento*'s focus on memory and identity aligns tightly. The user should stick with it.

