prompt: |-
  I'm a PhD student in library and information science, writing a dissertation on appraisal — the decisions archivists make about which records to keep permanently and which to let expire. The pattern I keep running into, in state archives and university special collections alike, is roughly this: records of governments, corporations, and prominent individuals are scheduled for permanent retention more or less because they exist and their creators had power; the everyday papers of ordinary people — families, workers, small organizations — are mostly left to perish or to survive by accident; and when archivists do set out to document marginalized communities, they typically do so retroactively, conducting oral history interviews decades after the fact rather than collecting communities' own records as they were made. There's a literature arguing that archives are active shapers of social memory rather than neutral storehouses — Trouillot's work on silences in the historical record is the usual touchstone — and I'm comfortable with that framing. What I can't find is an analysis at the level of the commitments the practice itself presupposes.

  Please respond as a philosopher of history and archival theory, and think carefully before answering — ideally start with some brainstorming that lays out candidate theories the practice could be resting on. What view of what archives are for does this appraisal pattern presuppose? The candidates I can see are something like: that the archive's function is the accountability of the powerful, so we keep their records in order to police them; that historical value attaches to whatever shaped events, so we keep the winners' papers as causes; that evidence of the powerful is systematically scarce while traces of the powerless are abundant, so scarcity alone justifies the asymmetry; or that a record only counts as archival when its creator is institutional. Distinguish which of these the practice strictly presupposes, which it merely fits well with, and where it is philosophically underdetermined — several rival theories of historical value could license the same retention schedules, and I'd like to know whether the practice could survive a shift from the accountability view to something like a representativeness view without becoming a different institution altogether.

  Then tell me what would actually have to change — in retention schedules, in what counts as a record, in the habit of documenting communities after the fact through interviews — if the presupposed view were replaced by the claim that archives should represent society rather than monitor power. I'm especially interested in the retroactive oral history pattern: is it a natural consequence of the presupposed view, or a symptom that the view is already breaking down under pressure it can't accommodate?
reasoning: |-
  Okay, the user is a PhD student in library and information science focusing on archival appraisal. They've noticed a pattern where records of powerful entities are kept, while those of ordinary people are neglected. They reference Trouillot's idea of archives shaping social memory and want a philosophical analysis of the underlying commitments. 

  First, I need to unpack the presuppositions behind current appraisal practices. The user mentioned several candidates: accountability of the powerful, historical significance of "shapers," scarcity, or institutional origin. I should evaluate each systematically. 

  The accountability view seems strong because keeping power's records enables oversight, but does practice really presuppose this? Or is it more about preserving "important" actors by default? The causation view ties to great-man history but feels more like a justification than a core commitment. Scarcity might be a post-hoc rationale—ordinary people's records aren't actually abundant if no one preserves them. Institutional ontology is compelling because archives traditionally privilege formal records, treating personal papers as less authentic. 

  Hmm, the user also asks if the practice could shift to a "representative society" view without collapsing. That's tricky. Current structures are so baked into workflows that a representational approach would need radical changes: proactive community partnerships, redefining records to include ephemera, shifting resources to contemporary collection. The retroactive oral history habit is particularly telling—it's a band-aid when direct records are lost, revealing how current systems fail marginalised groups. 

  The user seems frustrated but analytical. They want both theoretical clarity and practical pathways. I should emphasise that the institutional ontology is the deepest presupposition, while accountability is more of a fit. And yes, representational archives would fundamentally alter the institution—it's not just tweaking schedules but rebuilding relationships with communities. The oral history point is key: it's a symptom of systemic failure, not a natural outcome. 

  ...Wait, did I address their question about underdetermination? Multiple theories could justify the same practice, but the institutional lens is the operational anchor. If they adopt representativeness, appraisal would demand ongoing negotiation with communities—way beyond current "documenting" approaches. That feels like the crux.
answer: |-
  Your dissection reveals archival appraisal as a philosophical practice masquerading as procedural neutrality. Let's analyze the presuppositions, their relationship to practice, and the transformative implications of shifting to a representational paradigm.

  **Candidate Theories Underpinning Current Appraisal Patterns:**

  1.  **The Accountability of Power Model:**  
      *   **Core Claim:** Archives exist primarily to enable *post hoc* scrutiny of powerful entities (governments, corporations, elites) to ensure accountability, deter malfeasance, and protect rights.
      *   **Fit with Practice:** **Strong fit, but not strict presupposition.** Retention of state/corporate records aligns with legal accountability mandates (FOIA, audits, litigation). However, appraisal often extends beyond strictly "accountable" records to vast swathes of administrative material without clear accountability function. It explains *why* we keep the powerful's records, but not necessarily *why we neglect others* with similar intensity.

  2.  **The Historical Causation/Impact Model ("Great Man/Institution Theory"):**  
      *   **Core Claim:** Historical significance (and thus archival value) resides primarily in entities and actions that demonstrably *shaped large-scale events or structures*. Power implies causal efficacy.
      *   **Fit with Practice:** **Very strong fit, bordering on presupposition.** This is the dominant implicit logic. Archivists often justify retention based on the "importance" of the creator or the subject matter's connection to major events/institutions. It directly explains the neglect of "ordinary" lives – deemed causally insignificant. It conflates power with historical relevance.

  3.  **The Scarcity and Abundance Model:**  
      *   **Core Claim:** Records of the powerful are inherently scarce/unique (only one president, one board of directors), while traces of the marginalized are abundant (millions of workers, families) and thus less valuable per item. Archival value is tied to rarity of perspective or provenance.
      *   **Fit with Practice:** **Post-hoc justification, not a presupposition.** This is empirically flawed. Records of the marginalized are often *more* ephemeral and vulnerable to destruction (lack of secure storage, institutional support). Their perceived "abundance" is an illusion created by systemic neglect – vast quantities *were* created but not preserved. Scarcity arguments often rationalize existing biases rather than drive them.

  4.  **The Institutional Ontology Model:**  
      *   **Core Claim:** Only records created within formal, enduring *institutions* (or by individuals acting in institutional roles) possess the inherent characteristics of "archivalness" – systematic creation, organic structure, functional context, and enduring evidential value. Personal/family/community records are inherently different and lesser.
      *   **Fit with Practice:** **Likely the strictest presupposition.** This is foundational to traditional diplomatics and archival theory (Jenkinson, Schellenberg). It defines *what counts as a record worthy of appraisal* in the first place. Institutional provenance provides the context deemed essential for authenticity and meaning. Ordinary lives/communities lack this institutional framework, making their traces seem intrinsically less archival. This underpins the default setting.

  **Analysis of Relationships:**

  *   **Strict Presupposition:** The **Institutional Ontology Model** is arguably the deepest presupposition. It defines the *object* of traditional archival appraisal – the institutional record. This creates the fundamental asymmetry. Power is often *correlated* with institutional status, but the ontological category comes first.
  *   **Strong Fit/Implicit Driver:** The **Historical Causation Model** is the dominant *implicit theory of historical value* applied *within* the framework defined by institutional ontology. It justifies *which* institutional/powerful records are prioritized (the most "impactful").
  *   **Compatible Justification:** The **Accountability Model** provides a powerful *external societal justification* for preserving institutional records (especially governmental), reinforcing the practice but not originating the core selection bias. The **Scarcity Model** is largely a flawed rationalization used *after the fact* to defend the neglect of non-institutional sources.

  **Underdetermination and Potential for Shift:**

  The practice *is* philosophically underdetermined between the Causation, Accountability, and (to a lesser extent) Scarcity models. You *could* justify retaining the same powerful institutional records using any of these arguments. **However, shifting the *core purpose* from monitoring power/causation to representing society would fundamentally transform the institution.** It wouldn't just tweak retention schedules; it would necessitate:

  1.  **Radical Rejection of Institutional Ontology as Exclusive:** "Records" must encompass the vast, diverse, often informal documentation of lived experience: diaries, community newsletters, social media threads (curated ethically), oral histories *as co-created records* (not just supplements), visual culture, material artifacts, ephemera. Provenance expands to include community context.
  2.  **Proactive, Contemporary Documentation Replacing Retroactive Rescue:** Instead of waiting decades to interview elders (often after crucial records are lost), archivists would partner *now* with marginalized communities:
      *   **Co-Creation of Documentation Plans:** Working *with* communities to identify what records/documentation *they* value and want preserved for their own futures and historical representation.
      *   **Community Archives Support:** Providing resources, training, and infrastructure for communities to build and manage their *own* archives, integrated into or partnered with institutional archives.
      *   **Intercepting Records at Creation:** Actively soliciting and collecting contemporary records (digital and analog) from community organizations, activists, artists, families *as events unfold*.
  3.  **Appraisal Criteria Revolution:** Shifting from "impact" and "institutional function" to:
      *   **Representativeness:** Does this material represent the diversity of experiences within a community/society? (Not just tokenism, but depth and breadth).
      *   **Gap-Filling:** Does it document experiences systematically excluded from the traditional institutional record?
      *   **Community Designated Value:** Does the originating community deem this material essential to *their* memory, identity, or future needs?
      *   **Potential for Multiple Narratives:** Does it enable future historians/community members to construct counternarratives to dominant institutional histories?
  4.  **Resource Reallocation:** This requires massive shifts in budgets, staff expertise (community engagement, digital preservation of diverse formats, post-custodial models), physical/digital infrastructure, and institutional priorities away from solely servicing large institutional transfers.
  5.  **Reconceptualizing Evidence:** Moving beyond purely legal/administrative evidence towards evidence of *lived experience*, cultural practice, resistance, and social formation.

  **The Retroactive Oral History Pattern: Symptom of Breakdown**

  This pattern is **a symptom that the presupposed view (Institutional Ontology + Causation) is breaking down under pressure it cannot accommodate**, not a natural consequence.

  *   **Why It Happens Under the Old View:** Archivists guided by institutional/causation models *recognize* the "silence" (Trouillot) left by their own practices. They feel an ethical/professional pressure to "fill the gap." Oral history becomes a **rescue archaeology** technique, attempting to reconstruct a past *after* the community's own organic records have been lost or never deemed worthy of collection. It's reactive, often extractive, and treats the community as a *source of data* rather than a creator of records *with* the archives.
  *   **Symptom of Breakdown:** The very need for retroactive oral history projects *acknowledges* the failure of the traditional model to adequately capture significant aspects of society. It reveals the inadequacy of institutional ontology and causation as sole arbiters of value. However, because it often operates *within* the resource and conceptual constraints of the old system, it remains a partial, belated, and sometimes problematic solution. It doesn't fundamentally challenge the core appraisal practices for contemporary records; it tries to patch the holes they created.

  **Conclusion:**

  The current appraisal pattern strictly presupposes an **Institutional Ontology** defining the archival object. It operates most naturally with a **Historical Causation Model** determining value within that ontology. Shifting to a "represent society" purpose isn't an adjustment; it's a revolution requiring the rejection of institutional exclusivity, proactive co-creation of archives with communities, a complete overhaul of appraisal criteria towards representativeness and community voice, and a massive reallocation of resources. The retroactive oral history pattern is a clear indicator of the old model's failure to represent society, born from its own limitations, not its logic. A truly representative archive would make such belated rescue missions far less necessary by ensuring communities' own records are valued and preserved *as they are created*. The institution wouldn't just change; it would become something profoundly different in its relationship to power, memory, and society.
