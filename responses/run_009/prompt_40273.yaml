prompt: |-
  I'm the medical director of a small crisis stabilization unit, and my intake team (mostly residents plus a couple of experienced nurses) triages between ten and fifteen new presentations a day, often at 2am with a worried family or a cop standing in the room, and whatever we decide has to get signed off by the on-call attending within the hour. Recently I reread Szasz — The Myth of Mental Illness, plus his later writing on coercion and psychiatric law — and I've been going back and forth on it. What sticks with me aren't the slogans but his actual distinctions: literal disease, meaning a pathological process in the body you can detect through signs and tests independent of what the person says or does, versus the metaphorical "disease" language psychiatry borrows; "illness" as a social role that legitimates exemptions and care, which is partly why families, courts, and schools keep wanting the label attached; most of what we see being what he called problems in living; and treatment as a contract between consenting adults rather than something done to someone. I'm about half convinced — the other half of me thinks that following him faithfully would one day get a patient killed — and I don't want my junior staff becoming idealogues in either direction.

  So what I want is a procedure the intake clinician can actually run in the first fifteen minutes: the questions to ask, in order (about the person and their history, the physical exam and labs, and crucially about who is asking for what), what counts as a sufficient answer to each, where the procedure stops with "this is medicine, work it up as literal disease," where it lands on "this is a problem in living — offer help, don't impose it," and where it explicitly refuses to decide because the question is one of values, custody, or law rather than facts, and says so out loud. Please build in the branch that mattered to Szasz himself, the general paresis lesson: when a "mental" presentation turns out to have a bodily cause, it stops being psychiatry's metaphor and becomes literal medicine — so the procedure needs to say what makes an organic cause plausible enough to route someone to the full medical workup, without sending every sad or frightened person off for a CT.

  Then run it on three cases. One: a 34-year-old who calls the unit herself, on her own initiative, asking for help with panic attacks that are wrecking her job. Two: parents arrive with their 22-year-old son, who has stopped bathing, says he hears his dead grandfather, insists he's fine, and wants to leave; they want him "treated" and are asking whether we can hold him. Three: a 58-year-old brought in by police after a week of escalating paranoia and mild confusion, no psychiatric history at all. For each, tell me what the procedure yields, and flag it if the answer is one I won't like. And be honest with me at the end: which steps are real tests, which are judgment calls dressed up as procedure, and what the whole thing cannot do. My guess is it can't weigh dangerousness and can't settle any question about holding people against their will — I want you to say plainly where those live, if not inside the procedure.
reasoning: |-
  Okay, the medical director of a crisis stabilization unit is grappling with Thomas Szasz's ideas after rereading "The Myth of Mental Illness." They want a practical intake procedure that incorporates Szasz's distinctions—literal vs. metaphorical disease, illness as social role, problems in living, and treatment as voluntary contract—without becoming ideological. The procedure must fit into a 15-minute triage, include organic cause screening, and handle three specific cases. They also want honesty about the limitations, especially regarding dangerousness and involuntary holds.

  First, I need to unpack Szasz's core concepts relevant to crisis triage:  
  - Literal disease requires objective biological pathology (e.g., neurosyphilis).  
  - "Mental illness" is metaphorical, reframing life problems as medical issues.  
  - The "sick role" provides social exemptions (e.g., avoiding responsibilities).  
  - Treatment should be consensual; coercion contradicts medical ethics.  
  - Organic causes (like infections or tumors) shift presentations to literal medicine.  

  The challenge is translating this into a clinical algorithm that:  
  1. Rules out literal disease efficiently.  
  2. Distinguishes consensual help-seeking from coerced labeling.  
  3. Explicitly separates medical facts from social/legal demands.  

  For the procedure, I consider a three-phase flow:  
  - **Phase 1: Literal Disease Screening**  
    Focus on objective signs: acute confusion, neurological symptoms, vital signs, labs. Criteria to flag organic causes (e.g., new confusion in older adults). Avoid overtesting by prioritizing high-yield indicators.  
  - **Phase 2: Agency & Agenda Mapping**  
    Identify who is seeking help and why. Key questions: "What outcome do you want?" and "Who asked for this evaluation?" This surfaces coercion or "sick role" requests.  
  - **Phase 3: Pathway Decision**  
    - Route to medicine if organic flags exist.  
    - Offer voluntary support for "problems in living."  
    - Refuse medicalization for non-medical demands (e.g., custody disputes).  

  For the organic screen, I reference Szasz's general paresis example: prioritize sudden onset without psychiatric history, neurological signs, or metabolic red flags. No CT scans for uncomplicated panic attacks.  

  Now, applying it to the cases:  
  1. **34F with panic attacks**:  
     - Organic screen negative (young, coherent, no red flags).  
     - She seeks help voluntarily → Offer therapy/skills, no medicalization.  
     - Szasz-aligned outcome: Respects autonomy.  

  2. **22M with psychosis brought by parents**:  
     - Organic screen low yield (young, stable vitals).  
     - Conflict: He denies issues; parents want "treatment" (likely involuntary).  
     - Procedure flags this as non-medical (values/custody issue).  
     - Uncomfortable truth: Psychiatry can't solve this without coercion.  

  3. **58M with new paranoia/confusion**:  
     - Organic flags galore (new onset, age, confusion) → Full medical workup.  
     - Outcome shifts from psychiatry to medicine.  

  Finally, I confront limitations:  
  - **Dangerousness assessments** are social/legal, not medical facts. The procedure can't "diagnose" risk.  
  - **Involuntary holds** exist outside the algorithm—handled by legal standards, not clinical pathways.  
  - **Judgment calls**: Organic screening relies on pattern recognition (not black/white rules), and agenda mapping requires interpreting motives.  

  The procedure’s strength is forcing transparency: saying aloud, "This isn't medicine; it's a family conflict." But it can’t erase the tension between Szasz’s ideals and real-world pressures to "do something." The director’s fear—that rigid adherence might get someone killed—stems from this gap. The algorithm mitigates harm by catching medical mimics early but leaves coercion dilemmas unresolved.
answer: |-
  Below is a practical intake procedure designed for a 15-minute crisis triage, grounded in Szaszian distinctions. It prioritizes efficiency, explicit categorization, and ethical transparency. The procedure has three sequential phases, each with key questions, criteria for "sufficient" answers, and clear branch points. It incorporates Szasz's "general paresis lesson" by defining objective thresholds for organic workup and refuses to medicalize non-medical problems.  

  **Core Principles Embedded:**  
  1. **Literal Disease**: Requires objective evidence (e.g., lab abnormalities, focal neuro signs).  
  2. **Metaphorical "Illness"**: Rejected unless organic cause found; otherwise framed as "problems in living."  
  3. **Illness as Social Role**: Explicitly identifies when others seek the "sick label" for non-medical goals (e.g., custody, control).  
  4. **Treatment as Contract**: Help is *offered*, not imposed, unless literal disease is confirmed.  
  5. **Law/Values Boundaries**: Halts medicalization when the core issue is social, legal, or custodial.  

  ---

  ### **Triage Procedure: 15-Minute Szasz-Informed Intake**  
  **Phase 1: Rule Out Literal Disease (Minutes 0–7)**  
  *Goal: Identify objective evidence of bodily pathology.*  
  **Key Questions/Checks:**  
  1. **Acute neurological signs?** (e.g., altered consciousness, focal weakness, slurred speech, seizures).  
  2. **Vital signs instability?** (e.g., fever, hypoxia, severe hypertension).  
  3. **Acute confusion/delirium?** (e.g., disorientation, fluctuating cognition).  
  4. **Labs (if immediately available)**: Glucose, electrolytes, tox screen, infection markers.  
  5. **Historical red flags**: Sudden onset (>48 hrs), no psychiatric history, age >50, known medical illness.  
  **Branch Points:**  
  - **Organic Cause Plausible**: If ≥1 of: acute neuro signs, delirium, vital instability, or historical red flags + new psychiatric symptoms → **Route to full medical workup**. *This is literal medicine*.  
  - **No Organic Flags** → Proceed to Phase 2.  

  **Phase 2: Map Agency & Agenda (Minutes 7–12)**  
  *Goal: Identify who seeks "treatment," why, and whether consent exists.*  
  **Key Questions:**  
  1. **"What outcome do you want from this visit?"** (Ask the patient first, then others).  
  2. **"Who asked for this evaluation? Who is concerned?"**  
  3. **"Is the person here voluntarily?"**  
  **Sufficient Answers**:  
  - Patient’s stated goal (e.g., "I want help with panic").  
  - Discrepancy between patient’s vs. others’ goals (e.g., "I’m fine" vs. "He needs meds").  
  - Involuntary status declared.  
  **Branch Points:**  
  - **Consensual Help-Seeking**: Patient initiates/agrees and describes a "problem in living" (e.g., anxiety, grief) → **Offer voluntary support** (e.g., therapy, skills training). *Not medical*.  
  - **Coerced Labeling**: Others demand the "sick role" for patient (e.g., "diagnose him," "make her behave") → Proceed to Phase 3.  

  **Phase 3: Refuse or Redirect Non-Medical Demands (Minutes 12–15)**  
  *Goal: Reject medicalization of social/legal problems.*  
  **Key Question:**  
  1. **"Is the core issue a medical fact, a problem in living, or a values/custody question?"**  
  **Branch Points:**  
  - **Medical Fact**: Organic cause found in Phase 1 → **Treat as literal disease**.  
  - **Problem in Living**: Patient consents to work on distress → **Offer voluntary help**.  
  - **Values/Custody/Law**: Conflict over autonomy, risk, or social control (e.g., "Hold him," "Make her comply") → **Explicitly refuse medical framing**. State: *"This is not a medical issue. It is a question of [values/custody/law]. You need [social services/legal aid/police]."*  

  ---

  ### **Case Applications**  
  **Case 1: 34F self-presenting with panic attacks wrecking her job**  
  - **Phase 1**: No organic flags (young, normal vitals, coherent). → Proceed.  
  - **Phase 2**: She seeks help voluntarily: "I want tools to manage panic." → Consensual help-seeking.  
  - **Phase 3**: Problem in living → **Offer voluntary support** (e.g., CBT, breathing techniques). *Not medical*.  
  **Outcome**: Szasz-aligned. No disease, no coercion.  

  **Case 2: 22M brought by parents, hears dead grandfather, won’t bathe, wants to leave**  
  - **Phase 1**: No organic flags (young, stable vitals, no confusion). → Proceed.  
  - **Phase 2**: Patient says, "I’m fine, let me leave." Parents say, "He needs treatment; can you hold him?" → Coerced labeling.  
  - **Phase 3**: Core issue is custody/autonomy → **Refuse medical framing**. State: *"This is not a medical decision. It’s a values conflict about your son’s autonomy. If you seek involuntary hold, that is a legal question—not psychiatric. We can offer him voluntary help if he consents."*  
  **Outcome**: You won’t like this. The procedure *blocks* involuntary "treatment" as non-medical. Risk is not assessed; if parents want custody, they need courts/police.  

  **Case 3: 58M with new paranoia/confusion, no psych history, brought by police**  
  - **Phase 1**: Organic flags (age >50, new onset, confusion) → **Route to full medical workup** (e.g., UTI, stroke, metabolic panel, CT if indicated).  
  - **Procedure stops**: Literal disease suspected. *Not psychiatry*.  
  **Outcome**: General paresis lesson applied. Medical workup, not psychiatric triage.  

  ---

  ### **Honest Assessment**  
  **What this procedure CAN do**:  
  - Efficiently screen for organic disease with evidence-based thresholds (not "every CT for sadness").  
  - Distinguish consensual help from coercion.  
  - Expose when "treatment" demands are custodial/social, not medical.  
  - Reduce medicalization of problems in living.  

  **What it CANNOT do**:  
  - **Assess dangerousness**: "Risk" is a social/legal judgment, not a medical fact. The procedure explicitly excludes it. If society demands risk management, that happens *outside* this algorithm (e.g., via legal holds based on statutes, not diagnosis).  
  - **Resolve coercion**: It identifies coercion but doesn’t solve it. Involuntary holds live in the domain of law, not medicine. The procedure forces this into the open: *"Doctor, you must decide if he’s dangerous!"* → *"No, that’s your legal/judicial role."*  

  **Judgment Calls Dressed as Procedure**:  
  - **Organic thresholds**: While red flags (e.g., "age >50 + new psychosis") are evidence-based, the weight given to "historical red flags" involves clinical judgment.  
  - **Agency mapping**: Deciding if a patient "lacks capacity" to consent isn’t purely objective; it’s a values-laden inference. Here, the procedure defaults to literal disease (e.g., delirium = medical) or rejects coercion (e.g., psychosis without organic flags = "problem in living").  

  **The Unavoidable Tension**:  
  Szasz’s framework prevents psychiatry from functioning as social control—which is his point. This procedure will *feel dangerous* when families/cops demand "action." It protects autonomy but shifts responsibility: if society wants coercion, it must own it through courts/police, not medicalized slogans. The tradeoff is real: rigid adherence risks failing to "save" someone who "needed" involuntary care; overmedicalization risks ethical violence. This tool makes that choice stark, forcing your team to confront the line between medicine and power.  

  > *Final note: For safety, pair this with a parallel legal protocol (e.g., "If Phase 3 flags custody conflict, activate social work/legal team immediately"). But remember: Szasz would argue that calling this "safety" is smuggling coercion back into medicine.*
