  The user specifies several key requirements: the theory must handle specific historical episodes without embarrassment, distinguish between genuine moral progress and superficial changes, address counterexamples, and resolve the tension between objective progress and subjective preferences. They also want to know how different theories stack up against these criteria.

  First, I need to outline the desiderata clearly. Each requirement should be motivated by a real historical case or consideration. For example, the abolition of slavery is a clear candidate for moral progress, so any theory must count that as progress. Then there's the distinction between actual widening of concern versus just talk about it—like the disconnect between Enlightenment ideals and colonial atrocities. Depth vs. breadth is another key point; concern shouldn't be superficial. Genuine moral advance vs. power shifts is crucial—like women's rights post-WWII being more than just labor needs. Counterexamples include eras where in-group morality improved but out-group treatment worsened, like Rome or Victorian Britain, or the co-occurrence of compassionate vocabulary with new cruelties, like the Inquisition.

  I should also note tensions between desiderata. For instance, avoiding question-begging while affirming objective progress is tricky. A theory mustn't just reflect the user's preferences but stand up to skepticism. Then, applying Singer's expanding circle, contract-based theories, and debunking accounts to these criteria. Singer handles abolition well but struggles with depth vs. breadth and counterexamples. Contract theories explain mutual dependence but miss unilateral progress like animal rights. Debunking accounts expose power dynamics but can't affirm real progress, undermining the novel's core question.

  The user's deeper need is to validate the moral arc in their novel without oversimplifying. They want to ensure that the progression they depict is credible and nuanced, avoiding clichés. Highlighting where theories succeed or fail helps them decide how to frame their characters' development. Emphasizing the tension between desiderata shows the complexity of moral progress, which could enrich their narrative by acknowledging ambiguities.
answer: |-
  Here are the desiderata for an adequate theory of moral progress, motivated by historical and conceptual considerations relevant to your novel's core question, followed by a brief assessment of leading theories:

  **Desiderata for a Theory of Moral Progress:**

  1.  **Must Count Paradigmatic Advances as Progress:** *Motivation:* Any credible theory must explain why the abolition of chattel slavery, the rejection of torture as public spectacle/punishment, or the establishment of universal human rights (post-WWII) constitute moral progress. Denying these invites irrelevance. *Case:* Abolitionism in the 19th century.

  2.  **Must Distinguish Genuine Widening of Concern from Mere Rhetorical Widening:** *Motivation:* Societies often profess broader ideals while practicing exclusion or cruelty. Progress requires actual changes in behaviour and institutional treatment, not just nicer talk. *Case:* Enlightenment ideals co-existing with brutal colonialism; contemporary rhetoric of equality vs. systemic discrimination.

  3.  **Must Respect Breadth vs. Depth of Concern:** *Motivation:* Expanding the circle means little if concern remains shallow, tokenistic, or conditional. A theory should account for whether concern for newly included groups translates into robust respect, empathy, and protection. *Case:* Superficial "tolerance" of minority groups without challenging systemic disadvantages vs. deep commitment to equality.

  4.  **Must Distinguish Genuine Moral Advance from Mere Power Shift:** *Motivation:* Changes benefiting a group may reflect their increased political/economic leverage, not a deeper moral realization by society. Progress implies a change in *values*, not just beneficiaries. *Case:* Improved rights for women entering the workforce during WWII vs. arguments grounded in intrinsic equality.

  5.  **Must Account for Internal Gentleness / External Brutality:** *Motivation:* Societies can become more humane internally while becoming more systematically cruel to outsiders. A theory must explain whether this is regress, stalled progress, or a complex mix. *Case:* The Roman Empire (increasing internal citizenship/civility vs. ruthless expansion/slavery); Victorian Britain (domestic reform vs. imperial exploitation).

  6.  **Must Address the Co-Option of Moral Language for Harm:** *Motivation:* Advances in moral vocabulary and concepts can sometimes enable new forms of cruelty or justify oppression (e.g., "civilizing mission"). Progress isn't linear or immune to perversion. *Case:* The Inquisition's "merciful" procedures masking torture; "scientific" racism enabling genocide; modern "humanitarian" interventions masking power politics.

  7.  **Must Provide a Non-Question-Begging Standard:** *Motivation:* To avoid the charge that "progress" is merely "change we like," the theory needs grounding beyond contingent preferences, appealing to reason, consistency, reduced suffering, flourishing, or other plausible objective(ish) anchors. *Tension Flagged:* This is the core tension with Desideratum 4 (Power Shifts) and the skeptic's challenge. Can a standard be robust enough to affirm objective progress (e.g., abolition *was* progress) without simply reflecting the victor's ideology or the theorist's bias?

  **Theory Scorecard (Brief):**

  *   **Singer's Expanding Circle (Reason/Impartiality):** Excels at 1 (counts abolition/progress), clearly aims for 2 & 3 (genuine widening/deepening via reason/universalization), and provides a standard for 7 (impartial reasoning reducing suffering). **Struggles** with 4 (can blur with enlightened self-interest?), 5 (doesn't well explain simultaneous internal kindness/external brutality beyond incomplete progress), and 6 (reason can be co-opted; "expanding circle" itself can be rhetorical cover). Depth (3) is aspirational but not guaranteed.
  *   **Contract-Driven (Mutual Dependence/Reciprocity):** Explains 1 and 4 well (gains stem from interdependence/need for cooperation). **Fails** fundamentally at 2 & 3 (concern limited strictly to those deemed useful/reciprocating; no grounding for concern for the severely disabled, distant strangers, or animals without reciprocity). Struggles with 5 & 6 (contracts can be internally beneficial while externally predatory; moral language tied to bargaining power). Offers a standard for 7 (mutual benefit), but one too narrow to capture unilateral moral demands.
  *   **Debunking/Power ("Winner's Ideology"):** Compelling on 4, 5, and 6 (exposes how power shapes moral narratives, masks exploitation, and co-opts language). **Fails utterly** at 1, 2, 3, and 7. It cannot affirm *any* change as genuine progress, only as a shift in power/ideology. It reduces morality entirely to power dynamics, offering no standard beyond "who won?" This undermines the very concept of progress your novel explores.

  **For Your Novel:** The desiderata highlight the profound difficulty in confidently asserting linear moral "betterment." A theory like Singer's offers the strongest framework for affirming *some* progress (meeting 1, 2 partially, 7), but its limitations (4, 5, 6) and the challenge of depth (3) mirror the ambiguities in your characters' lives (grandmother's overt exclusion vs. granddaughter's empathetic breadth yet relational coldness). The contract theory highlights pragmatic shifts, while the debunking view forces uncomfortable questions about motives and power. Embracing this complexity – the genuine expansions alongside the persistent failures, shallowings, and perversions – may be the most truthful arc, suggesting that "better" is fragile, uneven, and requires constant, conscious effort against regressive currents, rather than an inevitable trajectory. The tension between desiderata 4 and 7 is where your characters' true moral struggles likely reside.
