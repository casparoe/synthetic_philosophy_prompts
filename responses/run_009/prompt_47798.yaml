prompt: |-
  My borough council's integration panel keeps ending arguments with 'when in Rome, do as the Romans do' — most recently to insist that newly arrived families adopt 'local values' wholesale, and before that to wave off a British-born Sikh family's objection to a school's Easter assembly tradition. I'm fairly sure the proverb is doing several different jobs across those uses, and I'd like to see them seperated out before I concede anything. Set out exactly five distinct precise claims the proverb could be making — e.g. about whose norms govern, the majority's customs or the actual law; about who counts as 'the Romans' once newcomers are themselves a large share of the population; about whether it reaches deep moral and religious commitments or only matters of etiquette; about whether it binds the host society too — and for each, one or two sentences saying whether it's a platitude, defensible but contestable, or flatly false, and which of the two uses above it would actually support. Numbered list, exactly five items, a sentence or two each, no intro or conclusion.
reasoning: |-
  Okay, the user is dealing with their borough council's integration panel using the proverb "When in Rome, do as the Romans do" to shut down discussions. They've encountered this in two scenarios: pushing new families to adopt local values wholesale and dismissing a Sikh family's objection to Easter assemblies. The user wants to dissect this proverb into five distinct claims to better understand and counter the panel's arguments.

  First, I need to identify what exactly the proverb implies in different contexts. The core idea is about adapting to local norms, but it can be interpreted in various ways. Let me brainstorm possible interpretations. One angle is whose norms are authoritative—majority customs versus actual laws. Another is the scope: does it apply only to superficial etiquette or deeper moral/religious beliefs? Also, who counts as "Romans" when immigrants become a significant part of the population? And does this proverb impose obligations on the host society too?

  For the first claim, considering the authority source makes sense. If the proverb prioritizes majority customs over laws, that's problematic in a legal framework. The council might use this to override legal protections, as in the Sikh family's case. But in reality, laws should supersede customs, so this claim is indefensible.

  Next, the scope of adaptation. The panel seems to extend "Roman" norms to deep cultural values, which is contestable. For new families, they're pushing wholesale adoption, but this ignores personal convictions. The Easter assembly example shows conflict with religious practices. This claim is defensible only for etiquette, not core beliefs, so labeling it defensible but contestable fits.

  The third point is about who constitutes "Romans." If the council ignores demographic shifts, it fails to acknowledge evolving norms. The Sikh family is British-born, so they're part of the community. This static view is false and supports both the panel's uses but wrongly.

  Fourth, the depth of adaptation. The proverb might imply newcomers must fully assimilate, suppressing their identity. This is coercive and false, as integration should allow cultural retention. The council uses this to demand wholesale adoption, which is harmful.

  Lastly, reciprocity. Does the host society have to adapt too? The proverb typically doesn't imply that, but ethically, it should. The council's one-sided demand is hypocritical. Pointing this out shows the proverb's limitation in promoting mutual respect.

  The user's deeper needs include empowering themselves to challenge the panel effectively. They might feel the panel uses vague sayings to avoid nuanced discussion. By dissecting the proverb, the user seeks concrete arguments to advocate for inclusive policies that respect minority rights without dismissing integration. Highlighting the proverb's flaws in different contexts can help the user push back against both scenarios mentioned.
answer: |-
  Here are five distinct claims the proverb could be making, analyzed for each scenario:

  1.  **Majority Customs Override Individual/Group Preferences:** The proverb asserts that the dominant local culture's practices hold inherent authority over the preferences or convictions of newcomers or minorities, regardless of legal rights. This is **defensible but contestable** for minor etiquette or practical coordination, but **flatly false** when overriding protected rights or deep convictions. It **supports both uses**, demanding assimilation from newcomers and dismissing the Sikh family's religious objection to the Easter assembly.

  2.  **"Roman" Norms Include Deep Cultural & Religious Values:** The proverb extends beyond superficial customs to encompass core values, morals, and religious expressions dominant in the locale. This is **defensible but contestable**; demanding conformity in deep beliefs conflicts with pluralism and fundamental rights. It **supports the first use** (demanding adoption of "local values" wholesale) and potentially **supports the second use** (implying the Easter tradition *is* a core "Roman" value).

  3.  **"Romans" Are Defined Statically (Pre-Newcomer Majority):** The proverb assumes "Romans" refers only to the long-standing majority population, ignoring demographic change where newcomers or established minority groups become significant. This definition is **flatly false** in diverse, evolving societies. It **supports both uses**, as it denies the legitimacy of the Sikh family's (British-born) objection and insists newcomers conform exclusively to pre-existing norms held by the old majority.

  4.  **Adaptation Requires Suppressing Non-Conforming Identity:** The proverb implies that fitting in necessitates minimizing or abandoning aspects of one's own cultural or religious identity that clash with dominant local practices. This is **flatly false** as a requirement for integration; genuine integration allows for identity retention alongside adaptation. It **strongly supports the first use** (insisting newcomers adopt "local values" wholesale, implying abandonment of their own).

  5.  **The Obligation is Unidirectional (Newcomers Adapt, Host Society Doesn't):** The proverb imposes an obligation solely on newcomers/minorities to adapt to the host society, with no reciprocal expectation for the host society ("Romans") to accommodate or adjust. This is **defensible but contestable** regarding basic societal frameworks, but **flatly false** regarding mutual respect and reasonable accommodation in pluralistic societies. It **supports both uses**, placing the entire burden of change on the families (new arrivals and Sikh) and none on the council or school.
