answer: |-
  Right, rubbish! Your "degrees of evidence" palaver is just muddying perfectly clear waters. You *did* learn *something* with certainty: the proposition "It seems to me that I heard a rustling at the window". That's the brute sensory fact, the incorrigible experience itself. That's what you condition on, old chap. Your uncertainty about whether it *was* a raccoon, or whether you were dreaming, is handled *within* the conditioning framework by the prior probabilities you assign to those possibilities *given* the experience. You don't need Jeffrey's fiddly machinery because the foundational certainty lies in the *having* of the experience, not its interpretation. So, condition on E = "I had a rustling-like auditory experience". Your credence in R (raccoon) becomes P(R|E), calculated via Bayes from your prior beliefs about how likely raccoons are to cause such experiences versus other causes. Where's the problem? Manufacturing that proposition? Hardly! It's the bedrock datum. If you doubt *that*, you're doubting your own conscious awareness, which is simply scepticism, not a flaw in conditionalization. Your 70% "confidence" in the experience is just pre-conscious dithering; once you *form* the belief "I had that experience", it *is* certain for you *at that moment of updating*. Out with it – why can't you just condition on E?
