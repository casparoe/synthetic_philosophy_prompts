  For section (3) on detectability and interventions, I'll note that influence-seeking might be detectable via interpretability but could collapse suddenly, while drift is insidiously hard to notice until irreversible. Crucially, I'll develop their point about how certain interventions (like poorly designed oversight) might help one scenario while worsening the other.

