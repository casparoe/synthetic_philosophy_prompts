prompt: |-
  I'm a retired physical chemist who let herself get roped onto the ethics panel of my old professional society, and we're stuck revising our code of conduct, which is due to go to the membership vote in June. Two camps formed and I somehow have to draft the recomendation memo. One camp wants the new code to be a tight set of principles -- honesty, confidentiality, duty to public safety -- with concrete cases derived from them like theorems, basically how I'd have written a lab protocol. The other camp, led by a former safety inspector who took up philosophy late in life, says that's a fantasy: the same fact can count for you in one case and against you in another depending on everything else going on -- disclosing a colleague's sloppiness is owed when a bridge is at stake, spiteful when it isn't -- so the code should mostly be a growing body of adjudicated past cases plus a short preamble about judgement and integrity, with at most loose rules of thumb in place of principles. Someone then floated a compromise: a handful of rebuttable presumptions that hold by default but can be defeated when the context is bad enough, and now everyone's staring at me. Draft the memo I'll circulate before the next meeting: recommend a concrete structure for the revised code, treat the strongest point on whichever side loses seriously instead of a paragraph of throat-clearing, and be honest about whether the presumptions idea actually settles the disagreement or just papers over it. Write it as plain continuous prose, no headings, bullets, or tables -- our chair reads these out loud like letters and hates formatted text.
reasoning: |-
  Okay, the user is a retired physical chemist on an ethics panel revising their professional society's code of conduct. They need to draft a memo recommending a structure for the revised code, addressing two opposing camps: one wants principles like theorems, the other wants case-based precedents. There's a compromise proposal involving rebuttable presumptions, and I need to evaluate if that resolves the conflict or just papers over it. 

  First, understanding the camps. The principles camp wants tight, lab-protocol-like rules—honesty, confidentiality—applied uniformly. The cases camp, led by a philosopher ex-safety inspector, argues context matters—disclosing a colleague's sloppiness could be ethical or spiteful depending on the situation. The compromise is rebuttable presumptions: default rules that can be overridden in extreme contexts.

  The user's memo must recommend a structure, take the losing side seriously, and honestly assess if the compromise works. They also specified plain prose—no headings or bullets—since the chair reads it aloud. 

  Assessing the compromise: Rebuttable presumptions blend both approaches. They provide clear defaults (appealing to the principles camp) but allow exceptions based on context (satisfying the cases camp). However, it doesn't fully settle the core debate—principles versus context—but forces both sides to engage with each other's concerns. It's a practical middle ground, not a philosophical resolution. 

  For the memo structure: Start with a preamble on judgment and integrity, then list rebuttable presumptions (e.g., "Presume honesty requires disclosure unless confidentiality overrides"), followed by illustrative cases showing when presumptions stand or fall. End with a commitment to update cases. 

  Addressing the losing sides: For the principles camp losing rigid rules, acknowledge that defaults risk becoming rigid if applied blindly. For the cases camp losing pure precedent, admit that starting from scratch each time is inefficient. 

  Honesty about the compromise: It papers over the disagreement by making both sides bend but doesn't resolve it. That's okay—it creates a functional framework. 

  The user's deeper needs: They want a credible, unifying solution that respects both viewpoints while meeting the June deadline. As a chemist, they likely value pragmatism over perfection. The memo should feel balanced and authoritative, avoiding academic jargon. 

  Tone: Respectful, clear, and slightly conversational—fitting a memo read aloud. Emphasize practicality: "This won't end debates, but it gives us tools." 

  Final memo flow: Summarize camps neutrally → Propose structure → Explain how it honors both sides → Critically evaluate compromise → Conclude with recommendation. Keep it concise and principled yet flexible.
answer: |-
  ## Memorandum to the Ethics Panel: Proposed Structure for Revised Code of Conduct  

  Date: [Current Date]  
  From: [Your Name], Panel Member  
  Subject: Recommendation on Revised Code Structure & Assessment of the "Rebuttable Presumptions" Compromise  

  Colleagues,  

  Thank you for the vigorous and thoughtful debate during our last session. The passion on both sides underscores the importance of getting this revision right. After careful consideration of the two primary approaches – the tightly defined principles model and the evolving case-based model – and the compelling arguments for each, I recommend we adopt a structure centered on the compromise proposal: **a code built around a limited set of rebuttable presumptions, supported by a preamble emphasizing judgment and integrity, and illustrated by a curated, evolving body of contextual case examples.** I believe this structure best serves our membership by providing necessary guidance while acknowledging the irreducible role of context in ethical decision-making, which was powerfully argued by the case-based camp.  

  Here is the concrete structure I propose:  

  1.  **A Foundational Preamble:** A concise statement articulating the core purpose of the code – upholding the integrity of the profession and its duty to society. This preamble will explicitly acknowledge that ethical conduct requires sound judgment, professional integrity, and careful consideration of context. It will state that the following presumptions are starting points, not rigid commandments, and that their application must be reasoned and responsible.  
  2.  **Core Rebuttable Presumptions:** A deliberately small set (e.g., 5-7) of clear, strong presumptions derived from our fundamental values. Examples include: "Presume honesty requires disclosure of significant errors or risks," "Presume respect for colleagues requires maintaining confidentiality regarding professional work," "Presume duty to public safety supersedes other obligations when significant harm is imminent." These are stated as defaults that *should* be followed.  
  3.  **Explicit Rebuttal Criteria:** Crucially, *each presumption must be accompanied by specific, high-threshold criteria outlining when it might be legitimately rebutted.* For instance, the presumption for confidentiality might be rebutted "when there is credible evidence of imminent, significant harm to public safety that disclosure could mitigate, and reasonable internal channels have been exhausted or are demonstrably ineffective." The presumption for disclosure might be rebutted "when the potential harm of disclosure (e.g., reputational damage based on an unverified minor concern) demonstrably and significantly outweighs the negligible risk involved." These criteria force the articulation of *why* the context matters.  
  4.  **Illustrative Case Repository:** An appendix or linked resource containing real or realistically constructed case studies. These cases will demonstrate:  
      *   Situations where the presumptions applied straightforwardly.  
      *   Situations where the context met the high threshold for rebutting a presumption, explaining *how* the specific rebuttal criteria were satisfied.  
      *   Situations involving complex tensions between presumptions, demonstrating the judgment required. This repository will be reviewed and added to periodically by the Ethics Committee based on adjudicated cases and emerging challenges.  

  **Addressing the Principles Camp (The "Losing" Rigid Structure):**  
  The strongest argument for the principles-as-theorems approach is its clarity, predictability, and ease of application – akin to a well-defined lab protocol. A code consisting only of high-level principles risks vagueness, but a rigid set of concrete rules derived deductively risks becoming brittle and unjust in complex, unforeseen situations. The rebuttable presumption structure directly addresses your valid concern for clarity and guidance by establishing strong, clear defaults – the presumptions *are* the concrete starting points. It provides the structure and predictability you seek, ensuring members aren't left adrift. However, it avoids the brittleness by explicitly building in the mechanism (the rebuttal criteria) for handling the difficult, contextual cases where a pure rule would fail, acknowledging that the "experiment" of professional practice has more variables than any lab bench. This structure honors your desire for clear guidance while preventing the code from becoming an instrument of injustice through misapplied rigidity.  

  **Addressing the Cases Camp (The "Losing" Pure Precedent Model):**  
  The core insight driving the case-based approach – that context is paramount and ethical meaning shifts with circumstances – is irrefutable and must be central to any functional code. A code consisting solely of past cases, however, risks being inaccessible, potentially inconsistent, and offering poor guidance for novel situations. The rebuttable presumption structure directly centers your crucial insight about context. The *rebuttal criteria* are the formal mechanism demanding contextual analysis. The *illustrative cases* provide the essential concrete grounding and demonstrate how context changes the ethical calculus, fulfilling your demand for practical wisdom over abstract rules. The presumptions are not rigid rules; they are starting points *designed* to be challenged when context demands it, formalizing the very judgment and integrity your camp champions in the preamble. This structure ensures context isn't an afterthought, but the core mechanism for applying the code.  

  **Does the Presumptions Idea Settle or Paper Over the Disagreement?**  
  Honestly, it does both, but productively. It does not magically resolve the fundamental tension between the desire for universal rules and the reality of contextual judgment – that tension is inherent in ethics itself. **It papers over the disagreement** in the sense that neither camp gets their pure vision; the principles camp doesn't get immutable rules, and the cases camp doesn't get a code solely of precedent. However, **it meaningfully settles the practical disagreement** about *how to structure the code for maximum utility*. It forces the principles camp to explicitly acknowledge and define the limits of their rules through rebuttal criteria. It forces the cases camp to accept that some core starting points (presumptions) are valuable for guidance and consistency, provided they can be overridden with robust justification. It creates a dynamic framework where clear defaults exist, but the critical importance of context is not just acknowledged but *operationalized* through the rebuttal process and case illustrations. It provides structure for the novice and flexibility for the expert, guided by the preamble's call for integrity and judgment.  

  Therefore, I strongly recommend we proceed with drafting the revised code using the rebuttable presumption structure outlined above. This approach offers the best chance of producing a document that is principled yet practical, clear yet flexible, and ultimately more likely to earn the informed support of our membership in June. I look forward to refining this structure with you at our next meeting.  

  Sincerely,  
  [Your Name]
