answer: |-
  Here are eight concrete case questions designed to sort readers by their implicit views on material constitution, followed by the scoring key and analysis. Each question avoids jargon and focuses on what happens in the scenario.

  ---

  **The Quiz: What Happens to the Stuff?**

  **1. The Squashed Statue:**
  A sculptor carefully shapes a lump of clay ("Lumpl") into a beautiful statue ("Goliath"). While admiring it, she accidentally drops it. It hits the floor and is instantly flattened back into a shapeless lump of clay.
  *   (A) Only one thing was ever involved: the clay. It survived the fall, just changed shape.
  *   (B) There was the clay *and* the statue – two things sharing space until the fall. The statue was destroyed; the clay survived.
  *   (C) The statue was destroyed, and the clay was also destroyed when it lost its statue-shape. Only new, flattened clay exists now.

  **2. The Shelf Clay:**
  A sculptor buys a lump of clay and places it on her shelf for a week before sculpting it into a statue.
  *   (A) Before sculpting, only the clay existed. After sculpting, the statue exists *and* the clay still exists – they are the same thing shaped differently.
  *   (B) Before sculpting, only the clay existed. Sculpting *creates* the statue. After sculpting, both the statue and the clay exist in the same place.
  *   (C) Before sculpting, the clay existed. Sculpting *turns the clay into* the statue. After sculpting, only the statue exists; the original clay is gone.

  **3. Tibbles the Cat:**
  Tibbles is a cat. Tibbles has a tail. Call the whole cat "Tibbles" and the cat-minus-tail "Tib".
  *   (A) Tibbles and Tib are two different things *right now* (Tibbles includes the tail, Tib doesn't). If the tail is removed, Tibbles ceases to exist (you just have Tib), and the tail becomes a separate thing.
  *   (B) Tibbles is the only thing. "Tib" just refers to *most* of Tibbles. Removing the tail changes Tibbles, but it's still Tibbles (just tailless). The tail becomes a separate thing.
  *   (C) Only tiny particles exist. "Tibbles" and "Tib" are just ways of talking about different arrangements of particles. Removing the tail rearranges particles; no "thing" is destroyed except the arrangement.

  **4. The Ship of Theseus (Replacement):**
  Theseus's ship has 100 planks. Over years, each rotten plank is replaced with a new, identical one. Eventually, all 100 planks are new. The old planks are stored and later reassembled into a ship.
  *   (A) The ship Theseus sails is the original ship, gradually repaired. The reassembled ship is a replica.
  *   (B) Neither ship is strictly the original. The original ceased to exist gradually as planks were replaced. The reassembled ship is also new.
  *   (C) Both ships have equal claim to being the original ship. They are both the Ship of Theseus, just at different times or in different forms.

  **5. Instant Statue:**
  A sculptor simultaneously lifts a lump of clay into a statue shape and immediately brings a hammer down, squashing it flat again, all in one continuous motion.
  *   (A) The statue genuinely existed for that instant.
  *   (B) The statue never truly existed; it was just clay changing shape very quickly.
  *   (C) It doesn't make sense to say the statue existed or didn't; it's just a description of the clay's motion.

  **6. Person on the Operating Table:**
  A person ("Jay") is lying unconscious on an operating table. Their body is perfectly intact and functioning.
  *   (A) There is Jay (the person) *and* Jay's body – two things sharing space. If Jay's mind ceased but the body lived, Jay would be gone but the body would remain.
  *   (B) Jay *is* the body. There is only one thing here: Jay's living body. If the mind ceases but the body lives, it's still Jay, just severely damaged.
  *   (C) There are just particles arranged "person-wise". "Jay" and "Jay's body" are just different ways of describing the same arrangement.

  **7. The Forgotten Clay:**
  A sculptor shapes clay into a statue, displays it for a year, then smashes it. Later, she remembers the *exact* lump of clay she started with was dug from a unique spot 5 years before she sculpted it. It sat on a shelf for 4 years before being used.
  *   (A) The clay existed for those 4 years on the shelf. The statue existed for 1 year. They were the same thing during that year.
  *   (B) The clay existed for 9 years total (5+4). The statue existed for 1 year. They were two different things sharing space during that year.
  *   (C) The clay existed for 9 years. The statue also existed during that year, but it was *made of* the clay. The statue is gone; the clay is gone (smashed).

  **8. Particle Rearrangement:**
  Scientists perfectly disassemble a chair into its individual atoms in a lab. Moments later, they perfectly reassemble those exact atoms into an identical chair in the same spot.
  *   (A) It's the same chair, just taken apart and put back together.
  *   (B) The original chair was destroyed when disassembled. The reassembled chair is a new, identical chair.
  *   (C) Chairs aren't fundamental. Only atoms exist. Disassembly and reassembly is just atoms moving; no "chair" was destroyed or created.

  ---

  **Scoring Key: Mapping Answers to Theories**

  *   **Coincidence (e.g., Baker):** Statue and clay are distinct objects coinciding in space/time. Key: Usually picks (B) in Q1, Q2, Q6, Q7; (A) in Q4; (B) in Q5; likely (A) in Q3; (B) in Q8.
  *   **Constitution-is-Identity:** The statue *just is* the clay (shaped). Key: Usually picks (A) in Q1, Q2, Q5, Q6, Q7; (A) in Q4; (B) in Q3; (A) in Q8. (Note: Hard to distinguish from Sortalism in answers).
  *   **Sortalism:** What exists depends on the "sortal" concept (e.g., "lump", "statue"). Key: Highly dependent on question framing, but often aligns with Constitution-is-Identity (A answers) or picks creation/destruction answers where applicable (e.g., (B) in Q2, (C) in Q2, (A) in Q5, (B) in Q5 possible). Look for inconsistency *unless* the sortal implies strict creation/destruction conditions. Often (B) in Q3.
  *   **Four-Dimensionalism (Perdurantism - Temporal Parts):** Objects are spacetime worms. Key: Usually (A) in Q1 (same temporal part changed); (A) or (B) in Q2 (clay is a temporal part of the statue-worm?); (B) in Q3 (Tibbles has temporal parts with/without tail); (C) in Q4 (both are temporal parts of the Ship-of-Theseus-worm); (A) or (C) in Q5; (A) in Q6; (A) in Q7 (clay-worm includes shelf time, statue-worm is a segment); (A) in Q8 (same chair-worm, temporal gap doesn't matter? Or (B) if gap breaks continuity).
  *   **Nihilism (Mereological):** Only simples (particles/atoms) exist. Composite objects (statues, ships, persons) don't strictly exist. Key: Almost always picks (C) in Q1, Q3, Q6, Q8; (C) in Q2?; (B) in Q4?; (B) in Q5?; (C) in Q7.
  *   **Relative Identity:** "X is the same lump as Y" and "X is the same statue as Y" are different, non-equivalent relations. Key: Can consistently pick answers that seem contradictory under absolute identity. E.g., Might pick (A) in Q1 (same lump) *and* say the statue was destroyed (implicit in scenario?), or (C) in Q4. Look for answers implying sameness under one description but not another without positing two objects.
  *   **Deflationism / Verbal Dispute:** The debate is largely about language/convention, not deep metaphysics. Key: Often picks the "common sense" answer inconsistently across questions, or explicitly "it depends on what you mean" answers like (C) in Q5. May express puzzlement or pick the simplest answer per case without a unifying pattern. Might choose (A) in Q1, (A) or (B) in Q2, (B) in Q3, (A) in Q4, (C) in Q5, (B) in Q6, (A) in Q7, (A) or (B) in Q8.

  **Indistinguishable Pairs:**

  1.  **Coincidence & 4D-ism (Perdurantism):** These often yield *very* similar answer patterns. Both will typically say two things coincide (Q1B, Q2B, Q7B), and handle persistence through part change (Q4A or Q4C) similarly. Q8 might be a subtle differentiator (Coincidence likely Q8B, 4D-ism possibly Q8A), but it's weak. They are the hardest major theories to separate cleanly via these cases.
  2.  **Constitution-is-Identity & Sortalism (Leaning Creationist):** If the sortalist believes "statue" requires being sculpted and standing as such, they will agree with Constitution-is-Identity on Q1A, Q2? (might pick B/C), Q5A, Q6A, Q7A, Q8A. Q2 and Q5 are the best hope for separation: a strong creationist sortalist might pick Q2B/C and Q5B, while Constitution-is-Identity picks Q2A and Q5A. But if the sortalist isn't strict about creation/destruction, they merge.

  **Unlikely/Incoherent Combination:**

  *   **Combination:** Q2: (A) (Only clay before, statue=clay after) **AND** Q5: (B) (Statue never existed in the instant case)
  *   **Why:** Q2A implies that shaping the clay *just is* the statue existing – the statue's existence is ontologically grounded solely in the clay having a certain shape at a time, without requiring a special act of creation or duration. Q5B implies that for the statue to exist, the shape must persist for more than an instant – it requires temporal duration *beyond* just having the shape. This combination tries to say "shape alone defines the statue (Q2A)" but also "shape alone for an instant is insufficient (Q5B)", which is inconsistent. It's likely *unattractive* rather than strictly logically incoherent, as one could invent a duration threshold, but it violates the spirit of the constitution-as-identity/simple sortalist view suggested by Q2A. You'd expect almost everyone picking Q2A to pick Q5A. Someone picking Q2A and Q5B is probably confused or holding an unstable view.

  ---

  **How to Use:**
  1.  Have readers select answers for all 8 questions.
  2.  Compare their pattern to the Scoring Key descriptions. The most consistent fit indicates their implicit view.
  3.  Highlight the indistinguishable pairs (Coincidence/4D-ism & Identity/Strict-Sortalism) as areas where the quiz might not pinpoint a single theory.
  4.  Note if they land in the "Unlikely Combination" – it might prompt interesting reflection!

  This quiz forces engagement with concrete intuitions, revealing underlying metaphysical commitments without relying on theoretical labels. Good luck with your blog!
