  So here's the thing. I've spent like three evenings on this. I drew a big tree of every string I could reach out to about 12 characters, I tried stockpiling I's and then collapsing them in threes, I tried doubling strategically so the UU-deletion rule would give me something ending in I, and every time I end up one or two I's short of getting to zero. At this point I'm pretty convinced there's a clever rule-application sequence I just haven't stumbled on yet, the way a chess combination is sitting there waiting if you see it. So what I'm asking for is the shortest derivation of MU from MI, or if the shortest one is long and ugly, then any derivation at all -- I literally just want to see one sequence of rule applications that works, plus some hint about the trick for finding it, because I clearly lack the knack.

