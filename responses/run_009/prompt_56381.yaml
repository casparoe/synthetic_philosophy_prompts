  - Evaluate two response strategies with their epistemological costs

  Key pitfalls to avoid in the question design:
  - Must not be solvable by name-dropping "Cohen's solution"
  - Must force engagement with how dismissing evidence works in practice
  - Must require tracing consequences for ordinary knowledge or inquiry

  For the marking scheme, I'll need clear differentiation between:
  - Surface-level case analysis (B-grade)
  - Explicit articulation of underlying principles (A-grade)
  - Systematic evaluation of strategy costs beyond intuition

  The model answer should reflect what a strong student could realistically produce in exam conditions - not a literature survey but applied reasoning. Around 600 words seems right for demonstrating depth without being unrealistically polished.

  The three cases seem deliberately staged to test different aspects:
  1) Senior engineer with direct evidence - tests personal justification
  2) Junior with testimonial knowledge - tests transmitted entitlement
  3) Published counterevidence - tests institutional/social dimensions

  The crux is making students show why "entitlement to dismiss" isn't blanket permission - it must tie to specific epistemic conditions in each scenario. And when evaluating strategies, they must explicitly state tradeoffs like "this would make inquiry irrational" or "this breaks closure for testimony."
answer: |-
  ## Exam Question  
  **Answer all parts. Reference all three cases, and justify your answers with explicit epistemic principles, not merely case intuitions.**  

  A senior structural engineer (Case 1) knows a bridge design is safe based on her direct simulation tests. A junior engineer (Case 2) knows the design is safe solely through the senior’s reliable testimony. Both encounter a new manuscript claiming to reveal a fatal flaw in designs of this type. Later, the senior engineer encounters the *same manuscript* after it undergoes peer review and publication (Case 3).  

  (a) For each case, does the engineer retain knowledge that the design is safe? Explain why or why not.  
  (b) If knowledge is retained in a case, what does the "entitlement to dismiss" the manuscript *concretely consist in* for that engineer (e.g., ignoring it? downgrading its weight? something else)? If knowledge is lost, why does the manuscript *undermine it*?  
  (c) Why might the outcomes differ (if they do) between Cases 1, 2, and 3? Ground your answer in general epistemic norms.  
  (d) Evaluate **two** distinct strategies for resolving the dogmatism paradox (e.g., rejecting the entitlement claim, restricting the evidential principle, or conditioning entitlement on source of knowledge). For each strategy, explain one significant cost it imposes on ordinary knowledge, closure, or rational inquiry.  

  ---

  ## Model Answer (598 words)  

  **(a)**  
  In **Case 1**, the senior engineer *retains knowledge*. Her direct simulations provide robust, non-testimonial justification resilient to unpublished criticism. **Case 2**’s junior engineer *loses knowledge*. Their testimonial belief, while safe and true, lacks independent grounding; the manuscript constitutes direct counterevidence they cannot assess. In **Case 3**, the senior engineer *loses knowledge*. Peer review grants the manuscript institutional credibility, making it sufficient counterevidence even against direct justification.  

  **(b)**  
  - *Case 1 (Retains knowledge)*: Entitlement to dismiss entails *assigning low provisional weight* to the manuscript without investigation. Given her direct evidence, she may rationally treat it as likely flawed (e.g., due to unvetted methodology) pending further scrutiny. Dismissal isn’t ignorance but *evidential calibration*.  
  - *Case 2 (Loses knowledge)*: The manuscript directly challenges the junior’s sole basis for belief (testimony). Without capacity to evaluate the criticism or its target, it *defeats* their justification. Knowledge is lost because their epistemic position cannot absorb counterevidence.  
  - *Case 3 (Loses knowledge)*: Peer review elevates the manuscript to *public, shareable evidence*. Dismissal would now require positive reasons to distrust peer review itself—burdens exceeding the senior’s current justification. The evidence mandates engagement.  

  **(c)** The cases differ due to **source sensitivity** and **evidential thresholds**.  
  - *Source Sensitivity*: Case 1’s direct knowledge buffers against unpublished criticism; Case 2’s testimonial knowledge does not. Testimony transmits *content* but not *robustness to counterevidence* without ancillary skills.  
  - *Evidential Thresholds*: Case 1’s manuscript is merely "apparent" counterevidence; Case 3’s peer-reviewed version crosses a threshold where it becomes *presumptive* evidence demanding rebuttal. The senior’s simulations, while direct, lack the institutional authority to override published consensus without new analysis.  

  **(d)**  
  *Strategy 1: Deny universal entitlement to dismiss (e.g., reject the first premise)*  
  - **Cost**: This jeopardizes *knowledge stability*. If agents must treat all counterevidence seriously regardless of strength, ordinary knowledge (e.g., "I have hands") becomes hostage to fringe sceptical tracts. Inquiry collapses into perpetual re-verification, violating the **rationality of terminating inquiry** when evidence is decisive.  

  *Strategy 2: Restrict the evidential principle (e.g., only *undefeated* evidence must be considered)*  
  - **Cost**: This risks *epistemic circularity*. To dismiss evidence as "defeated," one must presume the truth of one’s current belief (e.g., "My simulations show the manuscript is wrong"). But this *presupposes* the knowledge the evidence challenges, violating **closure under known entailment**: If I know my simulations are accurate, I know the manuscript is flawed—but I need the latter to dismiss the former.  

  ---

  ## Marking Scheme (25 points total)  
  **Must-hit points** (losing points indicates failure to address these explicitly):  

  1.  **(5 pts) Case-specific knowledge attributions with principled justifications.**  
      *Common mistake:* Asserting outcomes for cases without citing epistemic features (e.g., "Senior keeps knowledge because she’s expert").  
      *A vs. B:* A answers derive outcomes from *general norms* (e.g., "direct vs. testimonial justification"); B answers list intuitive case judgments.  

  2.  **(5 pts) Concrete analysis of 'entitlement to dismiss' or defeat per case.**  
      *Common mistake:* Vague appeals to "ignoring" evidence without specifying *epistemic operations* (e.g., downgrading weight vs. requiring rebuttal).  
      *A vs. B:* A answers define *how* evidence is processed (e.g., "calibration based on source reliability"); B answers equate dismissal with inaction.  

  3.  **(5 pts) Explanation of case divergence using epistemic principles.**  
      *Common mistake:* Noting differences without identifying *underlying norms* (e.g., "The junior loses knowledge because they’re not expert" misses source sensitivity).  
      *A vs. B:* A answers cite *systematic* distinctions (e.g., testimony’s defeasibility); B answers treat cases as isolated.  

  4.  **(6 pts) Evaluation of two strategies with costs to broader epistemology.**  
      *Common mistake:* Describing strategies without *costs* or citing only case-specific "unpalatability."  
      *A vs. B:* A answers identify *structural* costs (e.g., inquiry paralysis); B answers gesture at "it seems wrong."  

  5.  **(4 pts) Avoidance of label-reliance; use of cases to force principles.**  
      *Common mistake:* Name-dropping (e.g., "This is defeatism") or generic premise-denial without application.  
      *A vs. B:* A answers derive principles *from case contrasts*; B answers invoke textbook terms without grounding.  

  **A-grade threshold (21+):** Hits all points with *explicit principles* governing cases and *systematic cost analysis* of strategies.  
  **B-grade threshold (16-20):** Correct case outcomes and strategy descriptions but *fails to articulate general norms* or evaluates costs only intuitively.
