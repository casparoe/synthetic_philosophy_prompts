  Hmm, deeper needs are surfacing too: They're likely frustrated by circular debates and wants scaffolding to compare theories objectively. The editor's interest in "jointly unsatisfiable" points suggests they need narrative tension—philosophical deadlocks make good hooks. Also, their "no citations" note implies time pressure; I'll keep examples self-contained (blindsight, Charles Bonnet syndrome).

  For structure, I'll group desiderata into three buckets: 
