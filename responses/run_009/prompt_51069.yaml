  Key conflicts to highlight: Intrinsic nature vs. testability (how do you measure qualia?), and how some theories sacrifice animal consciousness to preserve human-specific mechanisms. 

  When scoring higher-order theories (HOT/HOP/Self-REP), I'll note their elegant solution to misrepresentation but point hard at their failure on animal consciousness and neural arbitrariness. Must emphasize this isn't about bashing HOTs—it's showing how the desiderata force trade-offs.

