answer: |-
  Here’s a breakdown of desiderata for any theory of phenomenal consciousness ("what it’s like" to have an experience), distinguishing core requirements from contested demands, with conflicts flagged. Higher-order theory (HOT/HOP/Self-REP) scoring follows.

  ### Core Desiderata (Widely Agreed Necessary)
  1.  **Subjective Character (What-it’s-like-ness):**  
      *   **Requirement:** The theory must account for the intrinsic, first-person qualitative aspect of experience (e.g., the redness of red, the painfulness of pain).  
      *   **Case:** The very definition of phenomenal consciousness. Denying this dissolves the target phenomenon.  
      *   **Contested Nuance:** *How* it accounts for it (e.g., functional role vs. intrinsic property) is the battleground.

  2.  **Unity & Integration:**  
      *   **Requirement:** Explain how diverse sensory inputs, thoughts, and feelings are bound into a single, coherent, unified conscious field at a time.  
      *   **Case:** You experience a red apple as a unified object (color, shape, texture together), not isolated data streams.

  3.  **Intentionality / Aboutness (Often):**  
      *   **Requirement:** Explain how conscious states are typically *about* something (e.g., seeing *the cup*, feeling *hunger*).  
      *   **Case:** Most conscious states represent the world or the self. While some (e.g., undirected moods) are less clear, core cases are representational.  
      *   **Contested Nuance:** Whether intentionality is *essential* to *all* phenomenality.

  4.  **Distinction from Unconscious Processing:**  
      *   **Requirement:** Explain the difference between conscious perception and unconscious processing performing similar functions.  
      *   **Cases:**  
          *   *Blindsight:* Subjects deny seeing but can guess visual features accurately. What's missing?  
          *   *Masked Priming:* A stimulus presented too briefly for conscious report influences behavior. Why isn't it conscious?

  5.  **Animal/Infant Consciousness (Non-Anthropocentric):**  
      *   **Requirement:** Provide principled criteria for attributing phenomenal consciousness that don't arbitrarily exclude animals or infants based solely on lacking human-level cognitive abilities (like complex language or self-reflection).  
      *   **Case:** Denying consciousness to a dog in pain seems implausible; attributing it based solely on neural similarity risks circularity. The theory must avoid both pitfalls.

  6.  **Misrepresentation & Hallucination:**  
      *   **Requirement:** Explain how a conscious state can *misrepresent* the world (illusory color) or occur *without* a corresponding stimulus (hallucination, dream).  
      *   **Case:** Seeing a vivid pink elephant in an empty room (Charles Bonnet syndrome). Does the theory generate the *experience* of pink? How?

  7.  **The Neural Correlate of Consciousness (NCC) & the "Hard Problem":**  
      *   **Requirement:** Address why *specific* neural activity gives rise to consciousness while other, functionally similar or structurally analogous, activity does not. It must engage with the "hard problem" (why neural processing *feels* like anything at all), even if only to reframe or dissolve it.  
      *   **Case:** Why does activity in visual area V1 typically correlate with visual experience, while activity controlling your heartbeat does not? Why does late-stage visual processing feel "visual"?

  ### Contested (Often Camp-Specific) Desiderata
  8.  **Non-Functional "What-it’s-like":**  
      *   **Demand:** Explain subjective character as an *intrinsic, non-functional* property.  
      *   **Case:** Proponents (e.g., Chalmers, some property dualists) argue functional accounts only explain *structure* and *function*, not the intrinsic feel. Opponents argue this demand is incoherent or unscientific.
      *   **Conflict:** Directly clashes with demands for testability/computational explanation. Satisfying this often precludes satisfying #9.

  9.  **Direct Testability / Physicalist/Functionalist Explanation:**  
      *   **Demand:** Provide empirically testable predictions or a fully reductive explanation within neuroscience/computation.  
      *   **Case:** Critics of "mysterian" views demand a path to scientific validation. Proponents of intrinsic nature argue this misses the point.
      *   **Conflict:** Directly clashes with #8. Demands for this also potentially constrain explanations for #7.

  10. **Causal Efficacy / Cognitive Access:**  
      *   **Demand:** Explain how consciousness *causes* behavior or is necessary for specific cognitive functions (e.g., explicit report, rational action).  
      *   **Case:** Some theories (e.g., Global Workspace) tie consciousness tightly to access. Others (e.g., some IIT proponents) posit "overflow" – conscious states not accessed for report.
      *   **Contested:** Is consciousness fundamentally *for* access/control, or is access a downstream consequence?

  ### Key Conflicts & Tensions
  *   **#8 vs. #9:** The core clash. Can an intrinsic, non-functional feel be explained by physical/functional mechanisms? Most theories pick a side, rejecting one demand.
  *   **#5 vs. Higher-Order Demands:** Theories requiring complex meta-cognition (like standard HOT) struggle mightily with #5 without denying consciousness to simpler creatures or watering down their core mechanism.
  *   **#4 & #7 vs. Simplicity:** Explaining why *this* neural activity and not *that* (nearly identical) activity is conscious (#7) while cleanly separating conscious/unconscious function (#4) often leads to complex or arbitrary-seeming criteria.

  ---

  ### Higher-Order Theories (HOT/HOP/Self-REP) - Quick Scorecard
  *   **Core Idea:** Phenomenal consciousness arises when a mental state is represented by a *higher-order* state (a thought about the state - HOT; a perception of the state - HOP; a state representing itself - Self-REP).
  *   **Scoring Against Desiderata:**
      *   **#1 Subjective Character:** Claims it arises from the higher-order *representation*. Critics: Does merely representing a state *create* its subjective feel, or just represent *that* it has one? (Contested success).
      *   **#2 Unity:** Struggles. How do higher-order states bind diverse lower-order states into unity? Often requires auxiliary mechanisms.
      *   **#3 Intentionality:** Strong. Consciousness is tied to representation (of lower-order states).
      *   **#4 Unconscious Processing:** Strong. Blindsight = lower-order visual state present, but no HOT/HOP about it.
      *   **#5 Animal/Infant Consciousness:** **Major Weakness.** Standard HOT (requiring conceptual thought) struggles to attribute consciousness to animals/young infants. Some propose attenuated versions ("analog" HOP), but it's a core tension.
      *   **#6 Misrepresentation:** **Major Strength.** Hallucination = HOT/HOP about a state that isn't present. Illusion = HOT/HOP misrepresents the lower-order state. Explains the *experience* directly.
      *   **#7 NCC / Hard Problem:** Weak. Doesn't inherently explain *why* higher-order representation generates phenomenality or why specific neural activity realizes HO states while similar activity doesn't. Functional role is emphasized, but the "hard problem" remains.
      *   **#8 Non-Functional:** Rejects this demand. Consciousness is a functional/computational property (the HO representation).
      *   **#9 Testability:** Moderate. Makes predictions about reportability, metacognition, and neural correlates of HO processing (testable in principle, but HO states are hard to isolate).
      *   **#10 Causal Efficacy:** Varies. Often links consciousness closely to cognitive access (via HO representation), potentially denying "overflow."

  **Summary:** HOTs excel at distinguishing conscious/unconscious (#4) and explaining misrepresentation/hallucination (#6). Their Achilles' heel is non-human consciousness (#5) and providing a satisfying explanation for the hard problem/neural arbitrariness (#7). They firmly reject non-functional demands (#8). The core tension is whether meta-representation truly *constitutes* phenomenology or merely *reports* on it.
