prompt: |-
  been assigned a feature on theories of consciousness and the deeper i dig the more it feels like the field doesn't even agree on what would count as winning. so before i profile any particular camp, help me get the spec straight. write the desiderata: what any adequate theory of phenomenal consciousness has to deliver, with the case or consideration behind each requirement. i'd want the list to cover things like: how it handles unconscious perception (blindsight, masked priming), whether it can say something about animals and infants without either denying they feel anything or smuggling in a test they can't pass, how it treats misrepresentation (does a higher-order representation of a red patch that isn't there make an experience of red?), and whether it owes us a story about why some neural activity is conscious and other activity doing nearly the same job isn't. and also: which of these are real requirements and which are just what one camp decided to demand -- like insisting the theory explain "what it's like" in a non-functional sense, or that it be directly testable. if any subset of the desiderata is jointly unsatisfiable, i want that flagged, that's the part my editor will like. then, briefly, score the higher-order theories (HOT, HOP, the self-representational versions) against your list -- but keep most of the weight on the criteria, not the scorecard. no citations needed, i can't be checking references on deadline
