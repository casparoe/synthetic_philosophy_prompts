answer: |-
  ### Dialogue: The Analogy Wars  
  **Characters**:  
  - **Dana**: Believes analogies can be legitimate evidence tools if properly classified; Munich (1938) is a valid evidence-analogy when causal features match.  
  - **Narrator** (representing your view): Argues the evidence/frame split collapses; reference classes are gerrymandered, and analogies create "confidence bubbles" through repeated, cost-free use.  

  **Setting**: A café, two days after the argument. The crisis: Ruritania (mid-sized power) has mobilized troops near Eldoria’s border after a disputed referendum in the Serpentine Strip region. Atlantica (global power) debates intervention.  

  ---

  **Dana**: Let’s reset this. My core point is that analogies aren’t inherently broken—we just misuse them. Take Ruritania and Eldoria. If Ruritania’s leader has a history of territorial revisionism, and Eldoria’s allies are wavering, this shares causal features with Munich 1938: an aggressor probing for weakness. That’s an *evidence-analogy*. It’s probabilistic evidence that concessions will embolden Ruritania, just like they did Hitler. The lesson isn’t rhetorical; it’s a data point from a reference class.  

  **Narrator**: But that’s the gerrymandering in action! Why is Munich your reference class? Ruritania’s referendum dispute looks more like Suez 1956—a manufactured crisis by a declining power—or even the Gulf War, where intervention deterred further aggression. You’re cherry-picking Munich because it’s theatrically resonant, not because it’s causally pristine.  

  **Dana**: No, I’m selecting based on *causal drivers*, not surface drama. In Munich, the key variables were: (1) asymmetric power favoring the aggressor, (2) unresolved grievances used as pretext, (3) defender credibility on the line. Ruritania fits all three. Suez doesn’t—it was colonial powers overreaching. Gulf War was a repelled invasion, not a slow-motion test. This is principled reference-class selection.  

  **Narrator**: And who verifies those "key variables"? You’re smuggling in framing by calling Ruritania’s move a "test." What if it’s a one-off bluff? Munich only looks inevitable because we narrate it backward. At the time, Chamberlain thought he was buying peace. Your "evidence" is just a story we’ve rehearsed into certainty.  

  **Dana**: Fair—hindsight bias is a risk. But we correct for that by comparing cases *prospectively*. If Atlantica’s intelligence shows Ruritania has internal memos planning further demands after Eldoria (like Hitler’s Sudetenland gambit), that’s new evidence strengthening the analogy. Frame-analogies don’t demand that; they just shout "appeasement!" and cash the rhetorical check.  

  **Narrator**: But even "intel" gets filtered through the analogy! If Atlantica’s hawks see memos about Ruritania’s energy needs, they’ll call it "expansionism" (Munich framing); doves will call it "economic anxiety" (Suez framing). Your causal features aren’t neutral—they’re valenced terms in disguise. And that’s before the incentive problem: every time "Munich" gets used without costing the user anything (e.g., no penalty for bad predictions), its confidence inflates like a bubble.  

  **Dana**: Okay, the bubble point stings. But it doesn’t sink evidence-analogies—it just means we need accountability. If Atlantica intervenes and it *doesn’t* deter Ruritania, we downgrade Munich’s predictive power for similar cases. That’s how reference classes evolve. Frame-analogies avoid this; they’re bulletproof because they’re not falsifiable.  

  **Narrator**: But they *do* evade falsification! When Vietnam went south, hawks didn’t abandon "Munich"—they said, "We didn’t apply it *early enough*." Your "downgrade" mechanism is mythical. In reality, Munich’s been used to justify everything from Korea to Iraq, and failures just stretch the reference class thinner. It’s a perpetual motion machine of overconfidence.  

  **Dana**: So we ban analogies? That’s not practical. Atlantica *must* reason with historical data. If not Munich, what reference class would you use for Ruritania?  

  **Narrator**: I’d reject the "which analogy" game as pseudoscience. The real question is: what are Ruritania’s concrete incentives? If it’s facing domestic unrest, this could be diversionary (like Argentina in the Falklands)—so intervention might backfire by boosting Ruritania’s regime. Munich obscures that by casting everything as Hitler vs. Churchill.  

  **Dana**: But diversionary theory *comes from* historical analogies! We generalized Falklands, Manchuria, etc., into a causal model. That’s evidence-analogy at work. You’re proving my point: we need better classification, not dismissal.  

  **Narrator**: Fine—but your "principled tests" for evidence-analogies are porous. Take "causal similarity." For Munich to hold, we must assume Ruritania’s goals are unlimited. But what if they just want the Serpentine Strip? Then it’s more like Crimea 2014, where concessions *didn’t* lead to further demands. You’ll gerrymander Crimea away as "different," but that’s my point: the reference class is always curated to fit the frame.  

  **Dana**: Not if we specify scope conditions. If Ruritania’s regime is ideologically committed to "greater Ruritania," that signals unlimited aims—like Nazi Germany. If it’s pragmatic, it’s Crimea. We can test that!  

  **Narrator**: And who defines "ideologically committed"? That’s a framing move! Atlantica’s leader will see "fanaticism" if they want intervention; "pragmatism" if they don’t. The vocabulary itself—"appeasement," "credibility"—is scripted. We’re not choosing a reference class; we’re casting roles in a morality play.  

  **Dana**: ...I’ll concede that frame-analogies hijack the language of evidence. But I still think we can quarantine them. If we force proponents to articulate *which specific variables* make this "a Munich," and track prediction outcomes, we can salvage evidence-analogies.  

  **Narrator**: And I’ll concede your bubble metaphor is apt—repeated use *does* inflate confidence. But I think the collapse is inevitable because history isn’t a dataset; it’s a contested narrative. Even "variables" are framed. So for Ruritania, the question isn’t "Is this Munich?"—it’s malformed. It should be: "What’s the cost of misjudgment if we’re wrong?"  

  **Dana**: But without analogies, that’s just guesswork. Munich gives us a prior.  

  **Narrator**: A prior distorted by 80 years of ideological baggage. Let’s agree: bad classification *enables* the bubble, but you think we can fix it; I think it’s irreparable.  

  **Dana**: *Sighs*. Truce? For now.  

