prompt: |-
  I should say at the outset that until this term I had no involvement in university governance, and I have no training in formal social theory or economics. I have just begun a three-year appointment to my department's promotions committee, and in my first months of service I have run into a configuration in our deliberations that I am convinced must have a name, though I cannot find it. Let me describe it in plain terms.

  Our committee votes on propositions rather than on candidates as wholes. In a recent promotion case, the chair put three claims to us in sequence: first, that the candidate's research record meets the standard we normally require at promotion (this passed, four to three); second, that her teaching meets our standard (this also passed, four to three); and third — not put to a vote, but treated as settled policy from earlier cases — that anyone meeting both thresholds is to be recommended. We then voted on the direct question of whether to recommend her, and the answer was no, again four to three. What unsettled me was not the outcome but its structure: the majority that had affirmed the research record and the majority that voted against the recommendation were composed of different members. No individual colleague said anything inconsistent — each person's final vote followed from the claim or claims that person had doubts about — and yet the committee as a body had committed itself to a set of positions that jointly entail the opposite of what it decided.

  A second phenomenon has emerged from my reading of the minutes of earlier years. Faced with this kind of impasse, the committee's practice is to set aside whichever claim received the weakest support and let the rest stand. But I have found structurally identical cases from past years in which the outcome reversed depending on the order in which propositions were put to a vote: when the recommendation was voted first, the committee subsequently softened its assessment of the file to match, and when the file was assessed first, the recommendation was made to follow. The verdict appears to track the agenda rather than anyone's convictions, and I cannot tell whether this order-dependence is a separate phenomenon or just the first one viewed over time.

  I half remember, from an undergraduate course long ago, that Condorcet discovered something about majority voting producing results that go in a circle, but I believe that concerned rankings of candidates rather than yes-or-no claims, and I do not recall it covering a committee that affirms premises while rejecting what follows from them. So my questions are these. Does the first configuration have an established name? Is there a separate one for the second, the dependence of the group's verdict on the sequence of votes? And how, if at all, do they relate to that older result about cycling majorities — is my case a version of it, or something distinct that merely resembles it? I should warn you that a bare label will not satisfy me. What I want is the carving: what exactly the phenomenon is, what it is not, which of the two descriptions (order-dependence included or excluded) marks its true boundary, and if any part of it lacks a name, a proposed term with a definition and the sorts of cases that would fall just inside or just outside it. I would rather understand the shape of the thing than be able to cite it.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're on a promotions committee and encountered a voting paradox where individual votes on premises lead to a collective inconsistency. The committee approved two criteria (research and teaching) separately but then voted against the promotion, despite the policy saying meeting both should lead to a recommendation. The user noticed that the majorities for each vote weren't the same members, causing the inconsistency.

  First, I need to recall relevant theories. The Condorcet Paradox comes to mind, but that's about cyclic preferences in rankings, not separate propositions. Then there's the doctrinal paradox, which seems to fit. It involves voting on premises versus conclusions. Here, the committee voted on each criterion (premises) and then on the conclusion (promotion), leading to an inconsistent outcome. The doctrinal paradox explains this exact scenario.

  Next, the user mentioned order dependence in past cases. Depending on whether the conclusion or premises were voted first, the outcome changed. This ties into path-dependence in judgment aggregation. When the conclusion is voted first, it influences how premises are assessed later, and vice versa. This is a key aspect of how agenda-setting affects outcomes in collective decision-making.

  I should also consider the user's background. They’re new to university governance without formal training in social theory. They need clear explanations without jargon but with precise terminology. They want to understand the structure, not just names. So, breaking down each phenomenon step by step is crucial.

  The user’s deeper need might be to navigate committee procedures effectively. They’re unsettled by the inconsistency and order manipulation. They probably seek strategies to address these issues, like changing voting procedures or ensuring logical consistency. Highlighting practical implications would add value beyond theoretical explanations.

  Connecting this to the Condorcet Paradox is important. While different, both involve inconsistencies in majority voting. The doctrinal paradox is about logical connections between propositions, whereas Condorcet deals with intransitive rankings. Clarifying this distinction helps the user see why their case isn't Condorcet but a different paradox.

  Terminology-wise, "doctinal paradox" and "path-dependence in judgment aggregation" are the key terms. Defining them clearly, with examples, will help. Also, proposing "agenda manipulation" as a term for the order effect makes sense. The user wants precise boundaries for each concept, so distinguishing between the paradox itself and the procedural aspect is essential.

  Finally, the user’s interest in the "shape" of the problem suggests they want a conceptual map. Explaining how the phenomena interrelate—how path-dependence exacerbates the doctrinal paradox—provides that structure. Offering procedural solutions, like simultaneous voting or premise-based approaches, addresses their practical concerns about fair governance.
answer: |-
  Your description captures two distinct but deeply interconnected phenomena in collective decision theory. Neither is identical to the Condorcet paradox, though they share its spirit of revealing limitations in majority rule. Here's the precise carving you seek:

  ### 1. The Core Paradox: Affirming Premises While Denying the Conclusion
  *   **Name:** The **Doctrinal Paradox** (or sometimes **Discursive Dilemma**).
  *   **The Phenomenon:** A group votes separately on logically interconnected premises (P1, P2) and a conclusion (C) that necessarily follows from them (e.g., C = P1 AND P2). The group majority affirms each premise individually, yet the group majority rejects the conclusion. Crucially, this inconsistency arises *despite* individual members voting logically consistently across all votes.
  *   **Your Case as Prototype:** Premise P1 (Research OK) passes 4-3. Premise P2 (Teaching OK) passes 4-3. Policy dictates Conclusion C (Recommend) = P1 AND P2. Logically, C *must* be true. Yet, the vote on C itself fails 3-4 (assuming the "no" voters were the 3 who voted against *either* P1 or P2, but not necessarily the *same* 3 for both).
  *   **Why it Happens:** The "majority" supporting each premise is composed of *different subsets* of members. The minority dissent on the premises is distributed such that there is no majority coalition affirming *both* premises simultaneously. The 4 who voted for P1 include some who voted against P2, and vice-versa. The *only* members who affirmed *both* premises are those who voted "yes" on *both* P1 and P2. If less than 4 did this (e.g., only 3 voted "yes" on both), then when voting directly on C (which requires both), there is no majority supporting C – even though majorities supported each premise separately. The "global" logical inconsistency emerges at the group level from the aggregation of "local" individual consistencies.
  *   **Boundary:** The true core of the Doctrinal Paradox is this *aggregation inconsistency* between premise-based voting and conclusion-based voting on logically connected propositions. **Order-dependence is NOT part of its fundamental definition**, though it often interacts with it severely in practice (see #2).
  *   **What it is NOT:**
      *   **Condorcet Paradox:** Condorcet involves *cyclic preferences* over *rankings* of *alternatives* (e.g., Majority prefers A>B, B>C, but C>A). Your case involves *inconsistent judgments* on *logically connected binary propositions* (P1, P2, C). The logical connection (C = P1 AND P2) is essential here, absent in Condorcet cycles.
      *   **Simple Hypocrisy/Irrationality:** Individuals acted consistently. The paradox emerges from the *aggregation method* under distributed minority dissent.
      *   **Arrow's Theorem:** Arrow's concerns ranking social preferences based on individual ordinal preferences. The Doctrinal Paradox concerns aggregating judgments on logically interconnected propositions.

  ### 2. The Order-Dependence Phenomenon
  *   **Name:** **Path-Dependence in Judgment Aggregation** (or **Agenda Manipulation** in this context). This lacks a single, universally perfect label, but "path-dependence" captures the essence.
  *   **The Phenomenon:** The final outcome of a multi-stage voting process (especially one susceptible to the Doctrinal Paradox) depends critically on the *sequence* (path, agenda) in which propositions are voted on. Reversing the order can reverse the outcome.
  *   **Your Cases as Prototype:**
      *   **Scenario A (Conclusion First):** Vote on C (Recommend?) first -> Fails 3-4. *Then* the committee, consciously or unconsciously influenced by rejecting C, softens assessments to vote down P1 or P2 (or both) to "justify" the prior rejection of C.
      *   **Scenario B (Premises First):** Vote on P1 & P2 first -> Both pass 4-3. *Then*, bound by policy (C = P1 AND P2) or logical consistency pressure, the committee votes for C.
  *   **Why it Happens:** Voting is not isolated; it creates commitments and framing effects.
      *   **Anchoring:** An initial vote (especially on the salient conclusion C) anchors the discussion and influences subsequent judgments to achieve coherence.
      *   **Justification Pressure:** Members feel pressure to make their later votes consistent with earlier group decisions.
      *   **Strategic Voting:** Members anticipating later votes may vote insincerely early on to try to force a desired final outcome.
      *   **Exploiting the Doctrinal Paradox:** The underlying *possibility* of inconsistency (the Doctrinal Paradox) makes the group vulnerable to agenda manipulation. If the premises *must* lead to the conclusion logically, voting the conclusion first bypasses that logic and allows affect or bias to drive the initial vote, which then drags the premise votes along.
  *   **Boundary:** Path-dependence is a *procedural consequence* or *exploitation* of the underlying potential for aggregation inconsistency (like the Doctrinal Paradox). It marks how the *process* of reaching a decision, not just the substance, determines the outcome. **It is distinct from the core Doctrinal Paradox** but is its frequent and critical companion in real-world sequential voting.
  *   **Proposed Term for the Interaction:** While "Path-Dependence" is standard, the specific vulnerability you describe could be called **Doctrinal Paradox Exploitation via Agenda Control**.
  *   **What it is NOT:**
      *   Merely changing minds through debate (genuine persuasion).
      *   Outcomes changing due to new information introduced between votes.
      *   Simple Condorcet cycles (though agenda control also affects those).

  ### Relationship to Condorcet
  *   **Similarity:** Both reveal fundamental problems with simple majority rule aggregating individual views into a coherent group view. Both demonstrate that the "will of the majority" can be an unstable or incoherent concept. Both are sensitive to agenda control.
  *   **Difference:** Condorcet deals with *preferences over alternatives* and cyclic *rankings*. The Doctrinal Paradox deals with *judgments on logically interconnected propositions* and the inconsistency between *premise-based* and *conclusion-based* aggregation. Condorcet's inconsistency is intransitivity (A>B>C>A). The Doctrinal Paradox's inconsistency is affirming premises while denying their necessary conclusion. Your case is clearly an instance of the Doctrinal Paradox framework, not Condorcet.

  ### Addressing Your Committee's Practice & Concerns
  The practice of "setting aside whichever claim received the weakest support" is an *ad hoc* attempt to resolve the Doctrinal Paradox by forcing consistency. However, it:
  1.  **Lacks Principle:** Why discard the "weakest" premise rather than the conclusion? What defines "weakest" (margin? perceived importance?)? It's arbitrary.
  2.  **Ignores Path-Dependence:** As you saw, reversing the agenda order could change which premise appears "weakest" or make the conclusion itself the "weak" vote.
  3.  **May Violate Policy/Law:** If policy *is* "C = P1 AND P2", discarding a premise that passed (even narrowly) to avoid recommending C contradicts the policy the committee is supposed to uphold. It essentially substitutes a different decision rule (e.g., "C if both P1 and P2 pass *by sufficient margin*") without authority.

  ### Recommendations for Governance
  1.  **Acknowledge the Paradox:** Explicitly recognize the Doctrinal Paradox and Path-Dependence as inherent risks in the current procedure.
  2.  **Choose a Consistent Aggregation Method (and stick to it):**
      *   **Premise-Based:** Vote *only* on the premises (P1, P2). If both pass, C is automatically affirmed per policy. *Do not hold a separate vote on C.* This ensures logical consistency but may feel less "deliberative" on the final outcome.
      *   **Conclusion-Based:** Vote *only* on C (Recommend?). This avoids the premise/conclusion inconsistency but risks being less transparent about *why* the decision was made and may obscure disagreements on standards. Requires strong justification documentation.
  3.  **Minimize Sequential Manipulation:** If multiple votes *must* occur:
      *   **Simultaneous Voting:** Vote on all relevant propositions (P1, P2, C) simultaneously/independently (though C is redundant if premises are also voted).
      *   **Fixed, Transparent Agenda:** Establish a mandatory sequence in advance (e.g., always premises then conclusion based on policy) and strictly adhere to it. Document any deviations heavily.
      *   **Avoid Revoting:** Do not revote premises *after* a conclusion vote (or vice-versa) based on the outcome.
  4.  **Review Policy Logic:** If the policy "C iff P1 AND P2" consistently leads to unacceptable recommendations or paralyzing paradoxes when premises narrowly pass, revisit whether the policy itself needs refinement (e.g., adding an "overall excellence" clause, requiring supermajorities for contentious cases).

  You've astutely identified a profound flaw in how many committees operate. The unsettling feeling stems from seeing collective rationality break down despite individual rationality. Understanding these phenomena – the Doctrinal Paradox at its core, amplified by Path-Dependence – provides the conceptual tools to diagnose the problem and advocate for fairer, more robust procedures.
