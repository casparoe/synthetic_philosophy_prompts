  Here’s a fully designed classroom activity to illustrate Arrow’s Independence of Irrelevant Alternatives (IIA) failure, avoiding Condorcet cycling and focusing on the "spoiler effect." The goal is for students to experience how a losing alternative can flip the winner, then connect this to Arrow’s theorem in the debrief.

  ---

  ### **Activity Design: "The Spoiler Game"**
  **Objective:** Show how a unanimously less-preferred alternative (C) changes the winner between A and B under plurality voting, violating IIA.  
  **Stakes:** Decide a real (but low-stakes) outcome for a future session, e.g., "Which text do we discuss next week?"  
  **Options:**  
  - **A**: Text A (*The Communist Manifesto*),  
  - **B**: Text B (*The Wealth of Nations*),  
  - **C**: Free reading time (downstairs lounge).  

  #### **Materials**  
  - **Preference cards** (print 1 per student):  
    - Card 1 (7 students): A > B > C  
    - Card 2 (5 students): B > C > A  
    - Card 3 (3 students): C > B > A  
    > *Total: 15 students. Adjust for smaller groups (see below).*  
  - **Ballots** (blank slips of paper).  
  - **Whiteboard** to tally votes.  
  - **Timer** (for structure).  

  #### **Why This Profile?**  
  - **Plurality outcome (A, B, C on ballot):**  
    - A: 7 votes (wins),  
    - B: 5 votes,  
    - C: 3 votes.  
  - **Remove C (only A vs. B):**  
    - A: 7 votes (Card 1),  
    - B: 5 + 3 = 8 votes (Cards 2 + 3; Card 3 voters now back B).  
    → **B wins**, a flip from A to B!  
  - **C is a Condorcet loser:**  
    - A beats C (12–3): Card 1 and 2 prefer A > C.  
    - B beats C (12–3): Card 1 and 2 prefer B > C.  
    - No cycling: B is the Condorcet winner (beats A 8–7 and C 12–3).  

  ---

  ### **Timeline (75 Minutes)**  
  #### 1. **Setup (10 min)**  
  - **Context:** "We need to decide next week’s activity today. Options: A, B, or C." Describe options briefly.  
  - **Assign preferences:** Hand out cards randomly. Emphasize:  
    > "This is your *true* preference. Vote sincerely—no strategy! We’re testing how voting rules behave."  
  - **Clarify:** "When voting, mark only your top choice. We’ll run two ballots."  

  #### 2. **Ballot 1: All Three Options (15 min)**  
  - Students vote by writing their top choice (A, B, or C) on a ballot.  
  - **Tally publicly on whiteboard:**  
    ```  
    A: 7  
    B: 5  
    C: 3  
    Winner: A!  
    ```  
  - **Build investment:** "Next week, we’ll discuss Text A. Decision made!"  

  #### 3. **The Twist (5 min)**  
  - Announce: "Bad news: the downstairs lounge (C) is booked! We must re-vote without C—only A or B."  
  - **Reinforce sincerity:** "Use your original card. If your top choice (C) is gone, vote for your next preference."  

  #### 4. **Ballot 2: Only A vs. B (15 min)**  
  - Students vote again (A or B only).  
  - **Tally:**  
    ```  
    A: 7 (Card 1)  
    B: 5 (Card 2) + 3 (Card 3) = 8  
    Winner: B!  
    ```  
  - **React:** "Now we’re doing Text B? But A won the first vote!"  

  #### 5. **Debrief (30 min)**  
  **Guide the discussion:**  
  - **What happened?**  
    - "Who is unhappy C was removed?" (Card 3: C voters).  
    - "Who preferred B over A all along?" (Cards 2+3: 8 students).  
    - "Why did A win the first vote? C ‘stole’ votes from B!"  

  - **Connect to IIA:**  
    - "C lost to *both* A and B and changed nothing about A vs. B preferences... yet it flipped the winner. This violates **Independence of Irrelevant Alternatives**."  
    - Define IIA simply: "Social choice between A and B should depend *only* on how people rank A vs. B—not on other options."  

  - **Arrow’s Theorem (Key Points):**  
    1. **Plurality fails IIA here, but Arrow is deeper:**  
       > "This isn’t just a plurality flaw. Arrow proved *no* fair voting rule (with unrestricted domain, Pareto efficiency, and non-dictatorship) satisfies IIA for *all* preference profiles."  
    2. **Distinguish from cycling:**  
       > "Cycling requires Condorcet cycles. Here, there’s no cycle—B is the clear Condorcet winner! The problem is the *voting rule* (plurality) failed to reflect that until C was removed."  
    3. **The universality of Arrow:**  
       > "We saw *one* failure in *one* rule. Arrow’s genius was showing *every* non-dictatorial rule has *some* profile where IIA fails. You can’t ‘fix’ voting—you can only choose which flaws to accept."  

  - **Why real-world stakes?**  
    > "Low-stakes decisions feel the spoiler effect too (e.g., Nader in 2000 U.S. elections). Arrow teaches us to design rules knowing they’ll fail somewhere."  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Strategic voting:**  
     - *Risk:* Card 3 voters might back B in Ballot 1 to avoid A winning.  
     - *Mitigation:* Stress sincerity: "We’re studying rule behavior, not strategy. Use your card!" If it happens, use it: "Did anyone avoid their true preference? That’s another flaw—manipulability!"  

  2. **Over-eager student blurts out IIA:**  
     - *Response:* "Great! We’ll validate that later. For now, focus on experiencing the paradox."  

  3. **Smaller group (e.g., 10 students):**  
     - **Adjusted profile:**  
       - Card 1: 4 students (A>B>C)  
       - Card 2: 3 students (B>C>A)  
       - Card 3: 3 students (C>B>A)  
     - **Outcomes:**  
       - Ballot 1: A:4, B:3, C:3 → A wins.  
       - Ballot 2: A:4, B:6 → B wins.  

  4. **Extension: "Registrar" role (if time permits):**  
     - Assign one student as "registrar" to control ballot access.  
     - Let them add/remove C after seeing Ballot 1 results.  
     - Teaches agenda control: "Who controls ‘irrelevant’ alternatives changes outcomes!"  

  ---

  ### **Why This Works**  
  - **Tangible paradox:** Students *feel* the injustice of C’s influence.  
  - **Clean separation:** Profile avoids cycling (Condorcet winner exists) to isolate IIA.  
  - **Debrief bridges to Arrow:** Explicitly separates the observed plurality failure from Arrow’s universal proof.  
  - **Low cost:** Uses paper, whiteboard, and trivial stakes to create investment.  

  Run this, and they’ll grasp IIA’s bite—and why Arrow’s theorem is a foundational cautionary tale. Good luck!
