prompt: |-
  I moderate a mid-sized discussion forum, and part of my job is enforcing our rule against slurs. Drafting and applying that rule has surfaced a pattern in how these words behave, and I want to know whether linguists and philosophers already have a name for it — or whether I need to invent one.

  Here is the pattern, in three cases. First, embedding under negation: if a user posts "No one in this thread is a [slur], and I'd ban anyone who was," nobody is called anything — the sentence denies that the word applies — yet it still lands as an attack, and our users report it. Second, embedding in a conditional: "If anyone here is a [slur], they should leave." Conditionals do not normally commit you to their antecedent — "if he's guilty, he should resign" is not an accusation — but this one still reads as an insult. Contrast both with ordinary pejoratives like "stingy" or "coward": "he is not stingy" really does wash the smear out of the sentence. Third, quotation: when I post the rule itself — "the word [slur] is banned effective today" — the word is being mentioned rather than used, not applied to anyone at all, and yet some users still feel it should not appear even once, while others see no problem. So whatever the badness is, it seems to live somewhere that ordinary grammar cannot reach, somewhere "stingy" does not live. Fill in the blanks with any of the slurs you have in mind; I am deliberately not spelling any out.

  I know the use/mention distinction is somewhere in the neighborhood, but it only addresses the third case, and awkwardly. I know connotation is the standard tool for words that carry an attitude, but connotation seems to fade when the surrounding sentence pushes back, and this does not — or perhaps I am wrong about that, and I would like to know. What I do not want is a bare label: I want to know what exactly survives the embeddings — something the sentence says, something the act of uttering it does, or something the word carries regardless of the sentence — and which way of carving it best fits all three cases, including the differences among them.

  Please answer in exactly five numbered points, each one or two sentences, with nothing before point one and nothing after point five. Points one through four: one established concept, distinction, or type of account apiece that could explain the pattern, ordered from closest fit to furthest, each stating what it gets right about my three cases and where it breaks down. Point five: your verdict — which carving handles the cases best, what (if anything) it still leaves unexplained, and, if no established concept fits the whole pattern, a name and definition for the residue.
reasoning: |-
  Hmm, the user moderates a discussion forum and is grappling with how slurs behave linguistically and philosophically. They've noticed that slurs retain their offensive power even when embedded in negations, conditionals, or quotations - unlike regular pejoratives like "stingy." They want me to analyze this pattern through established concepts in linguistics and philosophy, ranking explanations from best to worst fit, and then give a verdict.

  The user presents three key cases: negation ("No one here is a [slur]"), conditionals ("If anyone here is a [slur]..."), and quotation (mentioning the word in rules). In all cases, the slur still causes offense despite not being directly applied. With regular pejoratives, negation seems to neutralize the insult, but not with slurs. The user wants to understand what survives these embeddings - is it part of the sentence meaning, the act of utterance, or something inherent to the word?

  I need to recall relevant concepts from linguistics and philosophy of language. First, expressive content or conventional implicature (from Potts and others) - this refers to content that isn't part of truth conditions but conveys attitudes. It explains why slurs offend even in negations and conditionals, as the expressive element persists. But it struggles with quotation cases where the word is merely mentioned.

  Next is pragmatic accounts, like presupposition or accommodation. Presuppositions survive embeddings, which fits negation and conditionals. However, presuppositions typically project but can be canceled or contextually managed, whereas slurs seem more stubborn, and quotation is problematic because mentioning doesn't usually trigger presuppositions.

  Then there's semantic incorporation, which treats slurs as having an argument structure that always targets a group. This captures why negation doesn't neutralize - the targeting remains. But conditionals might not fit well, as the antecedent isn't asserted, and quotation is completely separate.

  Finally, illocutionary force or performativity, which focuses on the act of uttering. This explains quotation cases where even mentioning can be seen as an endorsement or harm. But it's weaker for embeddings because the speaker isn't directly performing the insult in negations or conditionals.

  For the verdict, expressive content is the strongest fit overall. It handles embeddings well, as the attitude persists regardless of structure. Quotation is the main challenge, but that can be addressed by noting that mere mention can evoke the expressive content, especially in sensitive contexts. No new term is needed; expressive content covers it, with the caveat that quotation requires additional care about context and harm.

  I should ensure my response is exactly five numbered points as requested - four concepts followed by a verdict - with no extra text before or after. Each point must be concise, one or two sentences, directly addressing what the concept gets right and where it breaks down for the user's cases.
answer: |-
  1. **Expressive Content (Conventional Implicature):** This explains the survival of offensiveness under negation and conditionals, as slurs conventionally carry a speaker's contempt regardless of truth-conditional embedding; it struggles most with quotation, where mere mention shouldn't trigger expressive content, yet offense often persists.
  2. **Presupposition:** This accounts for the projection through negation and conditionals, as slurs presuppose the target group's inferiority, making the attack implicit; however, presuppositions are typically not triggered by mere mention in quotation, leaving that case unexplained.
  3. **Semantic Incorporation:** This view treats the derogation as built into the word's core meaning, ensuring the attack is present whenever the term is *used* (even embedded), explaining negation/conditionals; it fails for quotation, where the word is only mentioned, not used semantically.
  4. **Illocutionary Force / Performativity:** This emphasizes the *act* of uttering the slur itself as harmful or endorsing hate, potentially explaining offense in quotation; it poorly explains why negation/conditionals still feel like attacks, as the speaker isn't directly *performing* the insult.
  5. **Verdict: Expressive content best explains the embedding cases (negation/conditionals), capturing the persistent attitude; the residue is quotation offense, best handled by recognizing that mere mention can *evoke* the slur's expressive content and associated trauma in context, requiring a distinct pragmatic account of harmful word evocation.**
