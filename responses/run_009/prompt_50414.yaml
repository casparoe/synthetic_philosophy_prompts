answer: |-
  Below is a decision-tree handout designed to guide students through the Sorites paradox without initially naming any philosophical positions. The tree starts with the core argument and branches based on concrete choices about cases and principles. Each node forces a decision without revealing the destination, and diagnostics are embedded naturally. The leaves cover major positions while noting indistinguishable pairs and unoccupied cells.

  ---

  **Sorites Decision Tree: Navigating the Paradox of the Heap**

  **Start: The Sorites Argument**
  - **Premise 1 (Starting Point):** 10,000 grains of sand form a heap.  
  - **Premise 2 (Major Premise):** If \(n\) grains form a heap, then removing one grain (\(n-1\)) still forms a heap.  
  - **Conclusion:** 1 grain forms a heap.  
  But we know the conclusion is false! Which part do *you* reject?  

  ---

  ### Level 1: Which limb do you abandon?
  1. **A. The starting point (10,000 grains is *not* a heap).**  
     → Proceed to **Case 1A**.  
  2. **B. The major premise (there *is* some point where removing one grain turns a heap into a non-heap).**  
     → Proceed to **Case 2B**.  
  3. **C. The inference pattern (the step-by-step reasoning is invalid).**  
     → Proceed to **Diagnostic 3C**.  
  4. **D. The falsity of the conclusion (1 grain *is* a heap).**  
     → Proceed to **Case 4D**.  

  ---

  ### Case 1A: If 10,000 grains isn't a heap, is *anything* a heap?
  - **Yes, heaps exist, just not 10,000 grains.**  
    → *But run the Sorites again from your new starting point (e.g., 20,000 grains). You must abandon a limb again.* Redirect to **Level 1**.  
  - **No, nothing is a heap.**  
    → **Leaf: Nihilism**.  
    - *Commitments:* "Heap" has no instances; the concept is empty.  
    - *Unembellished name:* None (just "nihilism").  

  ### Case 4D: If 1 grain is a heap, is 0 grains a heap?
  - **Yes, 0 grains is a heap.**  
    → **Leaf: Universalism**.  
    - *Commitments:* Everything (including 0 grains) is a heap; the concept has no non-instances.  
    - *Unembellished name:* None (rarely held; unattractive).  
  - **No, 0 grains is not a heap.**  
    → **Leaf: Incoherentism**.  
    - *Commitments:* "Heap" is inconsistent; it demands mutually exclusive conditions (e.g., "must be many grains" vs. "must tolerate grain removal").  
    - *Unembellished name:* "Conceptual inconsistency".  

  ---

  ### Case 2B: You accept a cutoff. God whispers: "Exactly 1,234 grains is a heap; 1,233 is not." Do you agree *in principle*, even if no evidence could ever confirm it?
  - **Yes, the cutoff exists but is unknowable.**  
    → Proceed to **Diagnostic 5B**.  
  - **No, this is absurd; there’s no exact cutoff.**  
    → Proceed to **Diagnostic 6B**.  

  ### Diagnostic 3C: You reject the inference. Consider a borderline case (e.g., 100 grains). When forced to judge "100 grains is a heap," must you choose true/false, or is a third option possible?
  - **Must choose true or false.**  
    → *This suggests classical logic holds; rejecting the inference is unstable.* Redirect to **Level 1**.  
  - **A third option is possible (e.g., neither, both, or partial truth).**  
    → Proceed to **Diagnostic 6B** (treat as "no sharp cutoff").  

  ---

  ### Diagnostic 5B: Why can’t we know the cutoff?
  - **Because reality or meaning fixes it, but human limitations prevent knowledge (e.g., we can’t perceive tiny differences).**  
    → **Leaf: Epistemicism**.  
    - *Commitments:* Sharp boundaries exist but are unknowable; vagueness is epistemic.  
    - *Unembellished name:* "Ignorance theory".  
  - **Because the cutoff shifts with context (e.g., conversational standards).**  
    → Proceed to **Diagnostic 7B**.  

  ### Diagnostic 6B: Consider a borderline heap (100 grains). If asked point-blank, "Is this a heap?" what is your answer?
  - **It depends on context (e.g., who’s asking, comparison cases).**  
    → Proceed to **Diagnostic 7B**.  
  - **It’s neither true nor false (indeterminate).**  
    → Proceed to **Diagnostic 8B**.  
  - **It’s true to some degree (e.g., 0.6 true).**  
    → **Leaf: Degree Theory**.  
    - *Commitments:* Truth is fuzzy; "heap" applies in degrees (e.g., 0 to 1).  
    - *Unembellished name:* "Fuzzy logic".  

  ---

  ### Diagnostic 7B: In a forced march (counting down grains), you "flip" from "heap" to "not heap" at some point. Why?
  - **Because context shifted (e.g., earlier judgments adjusted the standard).**  
    → **Leaf: Contextualism**.  
    - *Commitments:* "Heap" is context-sensitive; standards change dynamically.  
    - *Unembellished name:* "Context-dependence".  
  - **Because of psychological noise (e.g., attention lapses, arbitrary choice).**  
    → *This aligns with epistemicism. Redirect to* **Diagnostic 5B** (you may have a sharp cutoff view).  

  ### Diagnostic 8B: You said "neither true nor false." Is "borderline heap" itself a borderline concept? (i.e., are there cases where it’s unclear if "heap" is borderline?)
  - **Yes, and this is problematic/unresolved.**  
    → **Leaf: Supervaluationism**.  
    - *Commitments:* Vagueness arises from multiple precisifications; "neither" means not true/false on all precisifications.  
    - *Unembellished name:* "Precisification theory".  
  - **Yes, but I’m fine with it (it’s turtles all the way down).**  
    → **Leaf: Higher-Order Indeterminacy** (variant of supervaluationism or degree theory).  
    - *Commitments:* Borderlineness is infinitely vague; no "meta" sharp boundaries.  
    - *Unembellished name:* None (unattractive due to regress).  
  - **No, "borderline" has sharp boundaries.**  
    → **Leaf: Three-Valued Logic**.  
    - *Commitments:* A third truth-value ("indeterminate") is primitive; avoids higher-order vagueness.  
    - *Unembellished name:* "Gap theory".  

  ---

  ### Leaves Summary (10 Positions)
  1. **Nihilism:** Nothing is a heap.  
  2. **Universalism:** Everything is a heap (even 0 grains).  
  3. **Incoherentism:** "Heap" is inconsistent; no coherent application.  
  4. **Epistemicism:** Sharp cutoff exists but is unknowable.  
  5. **Contextualism:** Cutoff shifts with context; "flip" reflects standard changes.  
  6. **Degree Theory:** Truth is partial (e.g., 0.62); no sharp boundaries.  
  7. **Supervaluationism:** "Neither" due to multiple precisifications; higher-order vagueness acknowledged.  
  8. **Higher-Order Indeterminacy:** Borderlineness is endlessly vague (variant of 7 or 6).  
  9. **Three-Valued Logic:** "Indeterminate" is a primitive third truth-value.  
  10. *(Implicit)* **Classical Logic Preservation:** Rejecting the inference while keeping classical truth values is unstable; redirects to other leaves.  

  ---

  ### Key Notes
  - **Unoccupied Cells:**  
    - **Sharp cutoff + degree theory:** Incoherent (degrees deny sharp boundaries).  
    - **Inference rejection + classical truth values:** Unstable (collapses to other options).  
    - **Universalism + non-heaps:** Incoherent (universalism denies non-heaps exist).  
    - *Why unoccupied?* Logically incoherent or empirically unattractive.  

  - **Indistinguishable Pairs (Tree Cannot Separate):**  
    - **Epistemicism vs. Naive Realism:** If a student answers "yes" to God’s whisper *and* claims we *could* know the cutoff with perfect evidence, the tree cannot distinguish this from epistemicism (both share "sharp boundary + ignorance"). Honest flag: The tree treats this as epistemicism.  
    - **Supervaluationism vs. Three-Valued Logic:** If a student ignores higher-order vagueness, the tree cannot decide between them (both use "neither"). Honest flag: **Diagnostic 8B** separates them.  
    - **Contextualism vs. Degree Theory in Forced March:** If a student attributes the "flip" to psychology *and* accepts degrees, the tree cannot split them. Honest flag: Contextualism requires context-dependence; degree theory does not.  

  - **Diagnostics Coverage:**  
    - **God’s whisper:** Embedded in **Case 2B**.  
    - **Borderline truth-value:** Central to **Diagnostic 6B**.  
    - **Forced-march "flip":** Covered in **Diagnostic 7B**.  
    - **Borderline borderline:** Addressed in **Diagnostic 8B**.  

  This tree forces engagement with cases before labels, covers 10 positions, and flags limitations. Use it to spark debate: "Defend your path, not your leaf!"
