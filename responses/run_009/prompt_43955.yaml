     Overall, Marcus comes out more right. The product line breakdown is the key to understanding the true performance of the lanes. The customer tier breakdown does not show a reversal, but that does not invalidate the product line breakdown. It might be that customer tier is not a strong confounder. Therefore, the honest comparison is by product line.

