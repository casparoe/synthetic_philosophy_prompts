  I think their hypothesis is sharp. The core clash *is* about what decision theory should do. For Buchakians, it's descriptive/normative hybrid: respecting actual preference patterns (like Allais) as potentially rational. For EU-ists, it's prescriptive: instrumental rationality that overrules inconsistent preferences. 

