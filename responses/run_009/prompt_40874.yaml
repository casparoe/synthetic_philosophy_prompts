  We are designing an in-class activity called the "Augmentation Market" for a 90-minute session with 18 students. The goal is to help students discover, through their own choices, which enhancements to their agency they actually value, particularly in the context of free will and responsibility.

  The activity has the following fixed augmentations (to be used verbatim):

  1. Coin-flip implant
  2. Eraser
  3. Forecaster
  4. Split screen
  5. Veto window
  6. Scrambler

  We will have multiple rounds. In each round:
  - Each student privately and bindingly selects exactly one augmentation to install for that round.
  - They then face a decision scenario. The scenarios are designed so that different augmentations predictably lead to different outcomes (scores).
  - The scenarios must cover at least:
    a) A temptation you expect to regret (e.g., eating junk food when on a diet).
    b) A snap judgment under time pressure where the first instinct is wrong (e.g., a quick decision in a trivia game where the immediate answer is incorrect).
    c) A deliberate choice between two options that both look defensible (e.g., choosing between two equally good job offers).

  Scoring:
  - Students whose installed augmentation raises their scenario score (i.e., leads to a better outcome) gain points (say, +2).
  - If the augmentation lowers the score, they lose points (say, -2).
  - If the augmentation has no effect (or if they didn't have an augmentation that would help/hurt in that scenario), they get 0.

  Additionally, in each round, a rotating bookmaker (a student) must publicly predict which augmentations the group will choose (i.e., the distribution of choices) before they choose. The bookmaker wins points for accuracy (e.g., based on how close their predicted distribution is to the actual one).

  We also need:
  - A point scheme (using play money or points, no real money).
  - A minute-by-minute timeline for 90 minutes.
  - A debrief in two movements.

  Debrief:
