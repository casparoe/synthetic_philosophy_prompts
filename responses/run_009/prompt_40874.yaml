  ### Augmentation Market Activity Design

  **Objective**: Students discover which agency enhancements they value through revealed preferences in a simulated market, highlighting the distinction between control-enhancing and openness-enhancing augmentations, and separating unpredictability from indeterminism.

  **Rules and Point Scheme**:
  - **Points**: Use virtual points (no real money). Each student starts with 0 points.  
  - **Augmentation Selection**: Each round, students privately select one augmentation from the fixed menu via anonymous paper slips. Choices are binding for that round.  
  - **Scenarios**: Three scenarios (one per round) mirroring real decisions:  
    1. **Temptation with expected regret** (e.g., skipping exercise to binge-watch TV).  
    2. **Snap judgment under time pressure with wrong first instinct** (e.g., answering a trivia question quickly; correct answer is counterintuitive).  
    3. **Deliberate choice between defensible options** (e.g., choosing between two equally appealing job offers).  
  - **Scoring**:  
    - If augmentation improves outcome: **+2 points**.  
    - If augmentation worsens outcome: **-2 points**.  
    - If no effect: **0 points**.  
  - **Bookmaker**: One rotating student per round predicts the group’s augmentation distribution (counts for each of the 6 options, summing to 18).  
    - **Bookmaker scoring**: Accuracy = `10 - total_absolute_error` (where error = sum of |predicted count - actual count| for all augmentations). Minimum 0 points.  
  - **Outcome Determination** (facilitator assigns based on augmentation and scenario logic):  
    | Augmentation          | Temptation (Regret)        | Snap Judgment (Time Pressure) | Deliberate Choice (Defensible Options) |
    |-----------------------|----------------------------|--------------------------------|----------------------------------------|
    | **Coin-flip implant** | 50% avoid (improve), 50% indulge (no change) | 50% correct (improve), 50% wrong (worsen) | 50% better option (improve), 50% worse (no change) |
    | **Eraser**            | Avoid (improve)            | Override wrong instinct (improve) | No effect (no change)                  |
    | **Forecaster**        | Avoid (improve)            | Override wrong instinct (improve) | Choose best option (improve)           |
    | **Split screen**      | Avoid (improve)            | Override wrong instinct (improve) | Choose best option (improve)           |
    | **Veto window**       | Avoid (improve)            | Override wrong instinct (improve) | No effect (no change)                  |
    | **Scrambler**         | 50% avoid (improve), 50% indulge (no change) | 50% correct (improve), 50% wrong (worsen) | 50% better option (improve), 50% worse (no change) |
    - *Note*: For Coin-flip/Scrambler, flip one coin for the entire group (heads = "improve" outcome for all with that augmentation; tails = "worsen/no change" outcome). Baseline outcomes (no augmentation): Temptation = indulge/regret; Snap = wrong instinct; Deliberate = worse option.  

  **Timeline (90 Minutes)**:
  - **0:00–0:10 — Introduction (10 min)**:  
    - Explain activity: "You’ll face decision scenarios. Before each, install one augmentation to influence your outcome. Goal: Maximize points. A bookmaker will predict your choices."  
    - List augmentations (display verbatim).  
    - Assign bookmaker for Round 1 (randomly select a student).  
  - **Round 1: Temptation Scenario (25 min)**  
    - *0:10–0:13*: Bookmaker publicly predicts group distribution (writes on board).  
    - *0:13–0:18*: Students privately select augmentation (paper slips collected and tallied).  
    - *0:18–0:23*: Present scenario: "You’re on a strict diet but see a decadent dessert. Eating it will bring short-term joy but regret later."  
    - *0:23–0:28*: Assign outcomes/scores (use outcome table; flip coin for Coin-flip/Scrambler groups).  
    - *0:28–0:30*: Update scoreboard (student and bookmaker points).  
  - **Round 2: Snap Judgment Scenario (25 min)**  
    - *0:30–0:33*: New bookmaker predicts.  
    - *0:33–0:38*: Students select augmentation.  
    - *0:38–0:43*: Present scenario: "Under time pressure, answer a trivia question. Your first instinct is wrong (e.g., 'Which is heavier: a pound of feathers or bricks?')."  
    - *0:43–0:48*: Assign outcomes/scores.  
    - *0:48–0:50*: Update scoreboard.  
  - **Round 3: Deliberate Choice Scenario (25 min)**  
    - *0:50–0:53*: Final bookmaker predicts.  
    - *0:53–0:58*: Students select augmentation.  
    - *0:58–1:03*: Present scenario: "Choose between two job offers: stable salary vs. creative passion. Both have pros/cons; one will align better with your future self."  
    - *1:03–1:08*: Assign outcomes/scores.  
    - *1:08–1:10*: Update scoreboard.  
  - **1:10–1:40 — Debrief (30 min)**:  
    - **First Movement (Control vs. Openness) (15 min)**:  
      - Display aggregate choices (e.g., bar chart showing augmentation popularity across rounds).  
      - Ask: "Which augmentations did you repeatedly choose? Why?"  
      - Highlight gap: High-uptake augmentations (Eraser, Veto window, Forecaster, Split screen) vs. low-uptake (Coin-flip, Scrambler).  
      - Guide students to articulate: "We wanted tools that helped us *control* our actions based on reasons, not just random openness."  
      - **Reveal the distinction**: "This mirrors a key idea in free will: Responsibility requires *control* (e.g., managing urges, accessing foresight), not just indeterminism or randomness."  
      - Only now mention: "This is what some call the *variety of free will worth wanting*."  
    - **Second Movement (Unpredictability vs. Indeterminism) (10 min)**:  
      - Show bookmaker predictions vs. actual choices. Ask: "Why was the bookmaker sometimes wrong?"  
      - Students note: "We changed choices based on past rounds/scenarios."  
      - Point out: "Beating the bookmaker required *responsiveness to reasons* (e.g., learning from prior rounds), not randomness. Even those who chose Scrambler/Coin-flip didn’t reliably gain points."  
      - Conclude: "Unpredictability comes from complex reasons—not noise. Responsibility thrives on reasons-responsive control, not indeterminism."  
    - **Candid Limitations (3 min)**:  
      - "This activity can’t replicate real-life stakes (e.g., guilt, pride) or the *felt authorship* of decisions. Points are hypothetical; real agency involves owning your choices. As facilitator, I emphasize: Control-enhancing tools (like Veto window) align with how we *experience* responsibility."  
    - **Predictable Challenges & Mitigations (2 min)**:  
      - **Coin-flip as joke/contrarian pick**: Likely in Round 1. The bookmaker mechanism (peers predicting choices) and scoring (losing points) incentivize seriousness without shaming. If students pick it, say: "Interesting! Let’s see how it plays out." Outcomes will show its unreliability.  
      - **Other issues**: Time pressure during tallying (keep slips simple); students grumbling about "unfair" scenarios (remind: "Real decisions are context-dependent").  

  **Predicted Rankings**:  
  - **Highest uptake**: Split screen (helps in all scenarios; provides guided control).  
  - **Lowest uptake**: Coin-flip implant (randomness reduces reliability; seen as frivolous).  

  \answer{lowest: Coin-flip implant; highest: Split screen}
