  Now, let's write the complete rules.

  **Complete Rules:**

  1. **Overview**: Over several rounds, you will face decision scenarios. Before each scenario, you will choose one augmentation to install for that round. The augmentations are:
     - Coin-flip implant
     - Eraser
     - Forecaster
     - Split screen
     - Veto window
     - Scrambler

  2. **Choosing**: In each round, you privately select one augmentation (by writing it on a slip) and hand it in. Your choice is binding for that round.

  3. **Bookmaker**: Each round, one student (rotating) acts as bookmaker. Before choices are made, the bookmaker publicly predicts how many students will choose each augmentation (the counts must sum to 18).

  4. **Scenario**: After choices are collected, the facilitator presents a decision scenario. The outcome of the scenario for you depends on the augmentation you chose.

  5. **Scoring for the scenario**:
     - For each student: 
       - The augmentation will either raise, lower, or not change your outcome relative to what would have happened without any augmentation.
       - If it raises the outcome, you gain 2 points.
       - If it lowers the outcome, you lose 2 points.
       - If it doesn't change, you get 0 points.
     - The effect of each augmentation per scenario is predefined (see below). For Coin-flip and Scrambler, the outcome is decided by a single coin flip for the entire group: heads means they get the beneficial effect (if applicable), tails means they get the non-beneficial effect.

  6. **Bookmaker Scoring**: 
     - After the round, the bookmaker's prediction is compared to the actual distribution.
     - Total absolute error = sum over augmentations of |predicted count - actual count|.
     - Bookmaker's points = max(0, 10 - total_absolute_error)

  7. **Scenarios**:
     - Round 1: Temptation (e.g., dessert on a diet)
          - Without augmentation: you give in and regret -> baseline outcome: -2.
          - Eraser, Veto, Forecaster, Split screen: you avoid -> outcome: 0 -> improvement: +2 points.
          - Coin-flip, Scrambler: determined by coin flip:
              - Heads: you avoid -> outcome: 0 -> improvement: +2 points.
              - Tails: you give in -> outcome: -2 -> improvement: 0 points.
     - Round 2: Snap judgment (e.g., test question with first instinct wrong)
          - Without augmentation: you follow first instinct and are wrong -> baseline: -2.
          - Eraser, Veto, Forecaster, Split screen: you override and are correct -> outcome: 0 -> +2 points.
          - Coin-flip, Scrambler: 
              - Heads: correct -> outcome:0 -> +2
              - Tails: wrong -> outcome:-2 -> 0
     - Round 3: Deliberate choice (e.g., job offer)
          - Without augmentation: you choose the one you later regret -> baseline: -2.
          - Forecaster, Split screen: you choose the better one -> outcome:0 -> +2.
          - Eraser, Veto: no effect -> outcome:-2 -> 0 points.
          - Coin-flip, Scrambler:
              - Heads: you choose the better one -> outcome:0 -> +2
              - Tails: you choose the worse one -> outcome:-2 -> 0

  8. **Point Tracking**: The facilitator maintains a scoreboard for student points and bookmaker points.

