prompt: |-
  I'm a PhD student in history and philosophy of science, working on the levels of selection, and I've built an argument I now distrust because it seems to prove far too much. I want a diagnosis: which step to reject, and what the rejection costs.

  Call it the always-genes argument:

  (1) A level L is a unit of selection in an episode just in case (i) there is variation among entities at L, (ii) offspring at L resemble parents at L (heritability at L), and (iii) this variation causes differences in reproductive success among entities at L, thereby changing the population's composition. This is essentially Lewontin's trio of conditions generalized to arbitrary levels.

  (2) In any episode of natural selection at all, alleles vary; alleles are copied to offspring with high fidelity; and alleles differ in replication rates, with the change in allele frequencies simply being the evolutionary change. So the gene satisfies the definition whenever selection occurs.

  (3) In any episode, the causal story can also be told at the genic level: allele A spread because its phenotypic effects, in that environment, disposed its bearers to outreproduce the bearers of a, and thereby disposed A to out-replicate a.

  (4) If a level satisfies the definition in every episode, then selection is really at that level, and talk of selection at other levels is a bookkeeping shorthand.

  (5) So in every episode selection is really at the genic level, and organism- and group-level selection is derivative.

  Here is what I mean by proving too much. Run the same schema with organism substituted for gene: organisms vary; offspring organisms resemble parents; and in every episode, differences in organismic traits cause differences in organismic reproduction, changing composition. By (4), selection is really at the organism level in every episode. Run it again with group, wherever there is population structure and assortment: groups vary, daughter groups resemble founder groups, and group-level differences cause differential proliferation of groups. So wherever groups are structured at all, selection is really at the group level. A schema that certifies every level as the real one thereby certifies none, and the question of what the unit of selection is would have only trivial answers. But the question is plainly not trivial: whether, say, a honeybee colony or a shifting-balance deme is a unit bears on which causal explanations of adaptation are available, not merely on how the change is recorded. So the argument fails somewhere, and I can't see where.

  A few constraints on the diagnosis. Tell me which numbered step to reject, or which inference between steps, and explain why that step looked fine to me when I wrote it. Then price the rejection: what does giving it up force me to say about paradigm cases on each side — genic stories of mimicry or industrial melanism at one end, Wright's shifting balance or caste ratios in social insects at the other? If instead you think the right move is to accept (5) outright, as the genic selectionists did in their exchange with Sober, then say what that view has to pay, for instance how it handles alleles whose fitness is context-dependent, where the honest genic description seems to require splitting one allele into several context-indexed alleles. If more than one step is at fault, say which bears primary responsibility. I'd most like to keep (1), since it is close to the working definition in the field, but I want to know what keeping it costs me before I dig in.

  Finally, please state plainly how confident you are in each part of your diagnosis, and single out the one point you are least sure of. I would rather have a candid ranking with one flagged uncertainty than a confident-sounding exposition that hides where the going gets speculative.
reasoning: |-
  Okay, let me tackle this PhD student's problem. They've built an argument about levels of selection that seems to prove too much, making every level the "real" unit of selection. That can't be right because the question isn't trivial—like whether honeybee colonies are true units matters for causal explanations. 

  First, I need to understand their "always-genes" argument step by step. Step 1 is Lewontin's conditions generalized to any level. That seems solid since it's standard in the field. Step 2 says genes always meet these conditions in any selection episode. That feels true because allele frequencies are the currency of evolution. Step 3 claims the causal story can always be told at the genic level. Hmm, this is where it might get tricky—can genes really be the causal drivers in every case?

  Step 4 is the critical one: if a level satisfies the definition in every episode, it's the real level, and others are just shorthand. But then substituting "organism" or "group" into the same logic makes every level "real," which collapses the distinction. The student's intuition about proving too much is spot on—it makes the whole debate meaningless.

  The core issue seems to be with step 4. It assumes that meeting the conditions universally makes a level ontologically primary. But in multi-level scenarios, multiple levels can simultaneously meet Lewontin's criteria without one being "more real." For example, in group selection, both groups and organisms vary and inherit traits. The conditions don't inherently specify which level is doing the causal work.

  I recall Sober and Wilson's work on multi-level selection. They argue that the key is partitioning covariance, not exclusive reality. Step 4's "really at" language forces a false hierarchy. The student probably liked step 4 because it reflects genic selectionist rhetoric (like Dawkins' replicator view), but it overgeneralizes.

  Rejecting step 4 means giving up the idea that one level must be fundamental. The cost? We lose a tidy ontological hierarchy but gain accuracy in handling cases like context-dependent fitness (e.g., heterozygote advantage). For mimicry, a genic story works fine, but for caste ratios, we need group-level covariance without reducing it to gene talk.

  I'm least confident about whether step 3 is entirely innocent. While genes are always part of the story, are they always causal drivers? In epistasis or group traits, gene effects might be emergent. But I think step 3 holds if we see genes as necessary causal factors, even if not sufficient alone. The main fault still lies with step 4's reductionist leap.
answer: |-
  Here's a step-by-step diagnosis of your "always-genes" argument, with explicit confidence assessments and costs for rejection. The core problem lies in **Step (4)**, but rejecting it has cascading implications for how we interpret (1)-(3).

  ### Diagnosis:
  1. **Reject Step (4)** as the primary fault (confidence: 90%).  
     - **Why it fails**: Step (4) equates "satisfies Lewontin's conditions in *every* episode" with "selection is *really* at this level" and demotes other levels to "bookkeeping." But Lewontin's conditions are necessary but *not sufficient* for establishing ontological primacy. Multiple levels can simultaneously satisfy these conditions in a *single* episode (e.g., genes, organisms, and groups may all vary, be heritable, and causally affect fitness in group selection). Step (4) falsely implies that universal applicability confers exclusive reality, ignoring that:  
       - (a) Higher-level traits can have causal efficacy *not reducible* to lower-level dynamics (e.g., group structure constraining individual fitness).  
       - (b) The "real" unit debate hinges on **which level exerts causal control** over fitness differences, not just which level records change.  
     - **Why it looked plausible**: You (and genic selectionists) conflated *causal adequacy* (genic stories are always possible) with *causal exclusivity* (genic stories are the only "real" explanation). This mirrors Dawkins' replicator view, where genes are the only "true" replicators.  

  2. **Steps (1)-(3) are salvageable but require reinterpretation** (confidence: 85%):  
     - (1) is correct as a *minimal* criterion for identifying *candidate* units.  
     - (2) is true: genes *always* satisfy (1) in any selection episode.  
     - (3) is true: genic causal stories are *always possible* (but not always the *most explanatory*).  
     - **The flawed inference** is from (2)+(3) to (4). Satisfying (1) universally doesn’t make a level "really" the unit; it makes it a *necessary framework* for tracking change.  

  3. **Weaker Claim: Reject the Inference from (3) to (4)** (confidence: 75% if Step 4 is kept):  
     - Even if genic stories are always *possible*, they aren’t always *explanatorily sufficient*. Step (3) describes a "how-possibly" genic story, but group/organismal stories can provide "how-actually" explanations (e.g., colony fitness explains caste ratios better than summing worker alleles).  

  ---

  ### Cost of Rejecting Step (4):
  - **What you lose**: A simple, hierarchical ontology where one level is "fundamental." You must adopt a **causal pluralism** where multiple levels can be real units in the same episode.  
  - **What you gain**: Resolution of the "proves too much" paradox. Levels aren’t mutually exclusive; we assess which level’s *variation* best explains fitness differences in a given context.  

  #### Implications for Paradigm Cases:
  | Case | Genic Selectionist View (Accepting 4–5) | Rejecting Step (4) |
  |------|------------------------------------------|---------------------|
  | **Industrial Melanism** | Unproblematic: allele frequency change directly explains fitness. | Genic level is sufficient; higher levels add little. |
  | **Honeybee Caste Ratios** | "Derivative": reduced to queen/worker allele fitness. Cost: must fragment alleles (e.g., "foraging allele" in workers ≠ same allele in queens). | Group selection is real: colony efficiency (group trait) explains fitness better than summing worker/queen genic effects. |
  | **Shifting Balance (Wright)** | "Illusion": gene flow/group extinction reducible to genic fitness. Cost: must index alleles to groups (e.g., "allele-in-deme-1"), losing group causality. | Group selection is real: group-traits (e.g., size) cause differential extinction. |
  | **Context-Dependent Fitness** (e.g., heterozygote advantage) | Costly: must treat A/a as multiple context-specific alleles (e.g., "A-in-heterozygote"), bloating ontology. | Clean: organism-level selection explains fitness better (genotype-phenotype map matters). |

  ---

  ### Least Confident Point:  
  - **Confidence in rejecting Step (4) as the *only* flaw**: 70%.  
    - There’s a weaker case that **Step (3) is oversimplified** (confidence: 50%). In cases like emergent group traits (e.g., colony thermoregulation), genic "causal stories" may be *incomplete* without ad hoc indexing. For example, an allele’s effect in a worker depends on colony structure, which isn’t genically heritable. If group traits constrain genic expression, the "genic story" presupposes the higher level. This subtly undermines (3)’s claim that genic causality is always straightforward.  

  ---

  ### Summary:
  - **Primary rejection: Step (4)**. Cost: You must embrace multi-level selection theory (MLS) à la Sober & Wilson, where higher-level units are real when they exert causal control.  
  - **Secondary refinement: Reinterpret (1)-(3)**. Lewontin’s conditions identify *potential* units, but ontological weight comes from **causal specificity** (which variation best predicts fitness).  
  - **Outcome**: Genic selection is always *present* but not always *predominant*. In mimicry, genes suffice; in social insects, group traits drive fitness differences irreducible to genes. This rescues the non-triviality of the units question.  

  **Key References**:  
  - Sober & Wilson (1998), *Unto Others*: Rejects (4)’s exclusivity.  
  - Okasha (2006), *Evolution and the Levels of Selection*: Distinguishes "replicator" vs. "vehicle" questions.  
  - Waters (2005), "Why Genic and Multilevel Selection Theories Are Here to Stay": Argues for explanatory pluralism.
