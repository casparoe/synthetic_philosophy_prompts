prompt: |-
  My flatmate has been reading a popular-science book on theoretical neuroscience — not by Friston himself, but one that leans heavily on Karl Friston's free energy principle and on predictive-processing accounts of the brain more generally — and over dinner he gave me this summary of what he'd taken from it. My background, so you can pitch accordingly: a degree in machine learning, so I'm comfortable with Bayes, KL divergence, and variational approximations, but I've read essentially none of the primary neuroscience literature and couldn't tell a defensible simplification from a distortion if my life depended on it. Here is his summary, as close to verbatim as I can manage:

  "The brain is a prediction machine. It constantly generates a model of what its senses are about to deliver, and what it fundamentally works to minimise is the mismatch between its predictions and the actual input — that mismatch is what the book calls free energy. And this isn't just something brains happen to do: any organism that persists has to be a free-energy minimiser, because being surprised in the statistical sense — receiving sensory data your model assigned low probability — is the signature of being out of step with your environment, and being out of step for long enough is what being dead looks like. So organisms minimise surprise, which is why we find the unexpected aversive and why the brain ends up constructing the world it expects rather than simply seeing what's there. A consequence the book dwells on: because we're built to avoid surprise, people should be expected to hunker down in their comfort zones — curiosity and the taste for new experience have to be explained away as a kind of disguised conservatism. The other thing I took away is that the theory has an uncanny ability to explain anything: whatever an animal does, you can redescribe it as free-energy minimisation, which is why the theory can't really be tested and is more of a framework than a hypothesis."

  Please go through this claim by claim and sort it into what a defender of the principle would accept as a fair simplification, what involves conflating two things the literature keeps apart, and what is simply wrong. I'm especially unsure about three places: whether free energy really just is prediction error, or whether that identification hides something (he never mentioned anything like the model acting on the world, as opposed to updating its predictions); whether the concluding point about curiosity and comfort zones actually follows from anything accurate in the summary — it sounds a bit like something from reinforcement-learning courses on the explore/exploit trade-off, but I can't tell if the book earned it; and whether the 'untestable, just a framework' line is a settled verdict or one side of an ongoing argument presented as the end of it. I want a committed response, not a both-sides audit: by the end you should tell me plainly where you land on whether his summary is, overall, fair to the view. And please write in British English.
