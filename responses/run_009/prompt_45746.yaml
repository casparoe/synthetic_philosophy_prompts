prompt: |-
  I joined my university's Equal Access and Hardship Committee this term. The fund it administers is small and discretionary, its stated purpose "to remove financial barriers to full participation in university life", and it is spent case by case with no written criteria. On Monday I must draft our recommendation on a new application, and I would rather be consistent with the committee's own record than with my private instincts. That record, from this session:

  1. We funded a full sign-language interpreter rota for a deaf student and, over one member's objection that this went beyond access to teaching, added a contribution toward evening sign-language classes for her flatmates, on the ground that isolation outside seminars was itself a barrier.
  2. We refused a hardship grant for counselling after a student's painful breakup, though she described severe distress; the minute records that ordinary grief, however sharp, is "something everyone must carry without compensation".
  3. We funded travel support for a student hit by a rail fare rise at the level of the cheapest season ticket, and only that level, when she had asked for help toward running a car.
  4. We refused resit tutoring for a student who had skipped lectures all term to tour with his band, while funding identical tutoring for a student whose failure followed a long hospital admission.
  5. We funded a wheelchair user's share of an adapted kitchen in her shared flat, beyond the accessible rooms the university could provide free, because eating with her flatmates mattered.

  The new application: a final-year student with inflammatory arthritis lives on a route served by the university's subsidized accessible bus. She asks us to cover the difference between the bus fare and a taxi — about £30 a week — saying that the bus's crowding and jolting leave her exhausted and in pain by the time she arrives, and that she has begun skipping classes. Nothing in her file disputes any of this.

  Tell me, definitively, what we should decide. Set out the rules that could fit our five decisions — I can see at least three — what each predicts about the taxi application, and which precedent is the closest analog. Then commit: give one recommendation with your reasons, and state plainly what principle we would be adopting by deciding that way rather than its rivals. Finally, name the application that, if it ever reached us, would most cleanly separate the candidate rules.
reasoning: |-
  Okay, the user is part of their university's Equal Access and Hardship Committee and needs to draft a recommendation for a new application. They want to be consistent with the committee's past decisions rather than their own instincts. Let me start by understanding the five precedents they provided.

  First, the committee funded a sign-language interpreter and classes for flatmates to combat isolation. That shows they consider social inclusion part of removing barriers. Then, they refused counselling for breakup-related distress, labeling it as ordinary grief everyone deals with. So, emotional hardships without an external cause might not qualify. 

  Next, they only covered the cheapest rail ticket, not a car, emphasizing minimal necessary support. Then, they funded tutoring for a student hospitalized but not for one who skipped lectures, highlighting that personal choices matter. Lastly, they funded an adapted kitchen for social inclusion, again showing that communal activities are valued.

  Now, the new application is about covering taxi costs over the bus due to arthritis causing pain and exhaustion. The bus is subsidized and accessible, but the student skips classes because of the commute. I need to find which precedent fits best. 

  Looking at the rules derived: Rule A focuses on core academic access, so they might refuse since the bus exists. Rule B includes social and environmental barriers, so they might fund the taxi to prevent isolation from missing classes. Rule C requires external causes, so arthritis is medical, but the bus is available, so maybe refusal.

  The closest analog seems to be the wheelchair user's kitchen funding, which was for social inclusion. Skipping classes due to pain could lead to isolation, similar to that case. Also, unlike the breakup, this is a medical issue. The refusal of the car in favor of the cheapest option might suggest only minimal support, but here the bus isn't adequate due to health reasons.

  The user might be worried about setting a precedent for future cases. They need a principle that's consistent but compassionate. The key is that the barrier isn't just transport but the health impact leading to missed classes, which affects academic participation. 

  A test case could be a student avoiding labs due to phobia versus one with a physical barrier. Rule A would refuse the phobia, Rule B might fund it, Rule C would refuse without external cause. That clarifies the differences.

  So, recommending funding the taxi under Rule B, as it addresses the health barrier impacting both academic and social participation, aligning with the kitchen and interpreter cases. The principle is that barriers include indirect effects like isolation or exhaustion from necessary activities.
answer: |-
  Based on the committee's precedents, here's the definitive analysis and recommendation:

  **Derived Rules from Precedents:**
  1.  **Rule A (Minimal Core Access):** Fund only the most cost-effective means of *absolute minimum access* to core academic activities (teaching, exams). Reject extras, social inclusion, comfort, or consequences of personal choice.
      *   *Fits:* Refusing car help (Pref 3), refusing counselling for grief (Pref 2), refusing tutoring for band absence (Pref 4). *Partial Fit:* Funding hospital tutoring (Pref 4 - core access restored), funding interpreter (Pref 1 - core access).
      *   *Inconsistent:* Funding flatmate sign-language classes (Pref 1 - social), funding adapted kitchen (Pref 5 - social inclusion beyond uni-provided room).
  2.  **Rule B (Holistic Participation Barrier Removal):** Fund interventions removing barriers preventing *full participation* in university life, including academic, social, and communal aspects, where lack causes significant disadvantage/isolation. Reject where the barrier is deemed a universal human experience (grief) or self-created through avoidable choices.
      *   *Fits:* Funding flatmate classes (combats isolation - Pref 1), funding adapted kitchen (enables communal eating - Pref 5), funding hospital tutoring (external cause - Pref 4), refusing band tutoring (self-created barrier - Pref 4), refusing breakup counselling (universal experience - Pref 2).
      *   *Partial Fit:* Funding cheapest rail ticket (minimal access provided, but rejects comfort/convenience of car - Pref 3).
  3.  **Rule C (External/Unavoidable Barrier vs. Choice/Comfort):** Fund costs arising from *external, unavoidable circumstances* or *university environment shortcomings* that create a barrier inaccessible through reasonable personal effort. Reject costs related to personal choices, preferences for comfort/convenience, or universal life experiences.
      *   *Fits:* Funding interpreter (external disability, uni shortcoming if not provided - Pref 1), funding hospital tutoring (external cause - Pref 4), refusing band tutoring (choice - Pref 4), refusing breakup counselling (universal experience - Pref 2), funding adapted kitchen (uni-provided room inadequate for social inclusion - Pref 5).
      *   *Inconsistent/Requires Interpretation:* Funding *flatmate* classes (external disability cause, but solution extends beyond individual). Refusing car help (bus exists, but is it *adequate*? Pref 3 suggests adequacy defined minimally).

  **Prediction for Taxi Application (£30/week difference):**
  *   **Rule A (Minimal Core Access):** **REFUSE.** The subsidized accessible bus provides core access to teaching. The taxi is a comfort/convenience extra. Skipping classes is a choice despite discomfort.
  *   **Rule B (Holistic Participation):** **FUND.** The bus's crowding/jolting causes exhaustion/pain leading to skipped classes, creating a barrier to *academic participation*. Avoiding this barrier requires the taxi. The barrier stems from her disability, not choice.
  *   **Rule C (External/Unavoidable Barrier):** **FUND.** The barrier (pain/exhaustion from bus due to arthritis) is external/unavoidable. The existing university provision (bus), while accessible in theory, is *inadequate* for her specific medical needs, creating a participation barrier. The taxi is necessary to overcome this specific inadequacy.

  **Closest Analog Precedent:**
  The **adapted kitchen (Precedent 5)** is the closest analog. Like the bus, the university provided accessible accommodation (rooms). However, this was deemed *inadequate* for *full participation* (communal eating with flatmates). The committee funded the adaptation necessary to remove *that specific participation barrier* arising from the disability. Similarly, the bus provides access but is inadequate for *full participation* (attending class without debilitating pain/exhaustion) for this student. The funded solution (kitchen adaptation / taxi) directly addresses the participation barrier the standard provision fails to remove.

  **Recommendation & Principle:**
  **Recommendation: FUND the £30/week taxi difference.**

  **Reasoning:** Precedent 5 (adapted kitchen) establishes that the committee funds necessary interventions when standard university provisions, while meeting a basic access need, fail to enable *full participation* in university life due to a disability-related barrier. The student's inflammatory arthritis makes using the accessible bus detrimental to her health and ability to attend class. Her request isn't for convenience but to remove a disability-specific barrier preventing academic participation. Precedent 2 (refused counselling) is distinguished as grief is universal; precedent 3 (refused car) is distinguished as the bus, unlike the adapted kitchen scenario, is *not* functionally adequate; precedent 4 (refused band tutoring) is distinguished as her barrier is medical, not self-created choice.

  **Principle Adopted (Based on Rule B/C Synthesis):**
  By funding this application, the committee adopts the principle: **"We fund reasonable costs necessary to overcome disability-specific barriers to full academic and social participation in university life, where standard university provisions are functionally inadequate for the individual's needs due to their disability, and the barrier is not self-created or a universal life experience."** This prioritizes removing disability-related participation barriers over minimal access or comfort, while acknowledging limits related to choice and universality.

  **Test Case to Separate Rules:**
  **The Application:** *"A student with severe but medically managed environmental allergies (dust, pollen) requests funding for a high-end HEPA air purifier (£300) for their non-university rented room. They state standard cleaning/medication isn't sufficient, and without it, they experience debilitating symptoms forcing them to miss lectures and labs, especially during high-pollen seasons. The university provides standard lecture halls/labs without special air filtration."*

  *   **Rule A (Minimal Core Access):** REFUSE. University provides standard access. Purifier is a comfort/convenience extra. Student can take medication/clean more/attend when able.
  *   **Rule B (Holistic Participation):** LIKELY FUND. The allergy creates a barrier to attendance/participation. The purifier is necessary to overcome this barrier and enable full participation, akin to medical equipment. Distinction from Precedent 2 (grief) is clear (medical cause).
  *   **Rule C (External/Unavoidable Barrier):** AMBIGUOUS. Key question: Is a standard room an "inadequate university provision"? Allergies are external/unavoidable, but the university doesn't provide the accommodation. Funding personal medical equipment for a non-university space might stretch precedent. Might lean towards REFUSE unless framed as essential for accessing university (like extreme cases requiring home dialysis).
  *   **This test case cleanly separates Rule B (likely fund) from Rule A (refuse) and pressures Rule C (highly dependent on interpretation of "university provision" and necessity).**
