prompt: |-
  I teach philosophy at a midwestern state school, and through a colleague's wife who works for the courts I got roped into being the token humanist on our state's sentencing guidelines advisory commission -- the body that more or less writes the worksheet trial judges use to land on a range. The room is mostly prosecutors and retired judges, but two of the commissioners actually read the little debate book Dennett and Caruso did together a few years back, took opposite sides, and have turned it into a running fight ever since. One of them insists any guideline that drops just-deserts reasoning is dishonest; the other says desert-talk is metaphysics we can't cash and keeps pointing at Caruso's public-health-quarantine analogy, and everyone else glazes over. What we need isn't a resolution of that fight -- I'm not naive -- it's a procedure the commission can actually run on a proposed guideline change, that tells us:

  (a) whether the change is justified purely on desert grounds, purely on forward-looking grounds (deterrence, incapacitation, rehabilitation), or only as some mix, and

  (b) where the question stops being answerable by any worksheet and has to get handed off to a judge or legislator as a straight value call.

  Constraints, because I know how this goes: it has to fit on roughly a page, be usable by lawyers who've read zero free-will literature, run inside the 20 minutes we give each agenda item, and be honest about which steps are judgment calls wearing procedure costumes. It also can't beg the question against either side, since I need it to pass a room that includes people who think Dennett basically won and people who think Caruso did -- so where their disagreement genuinely matters (e.g., whether retributive justification can ever be the sole basis for an enhancement), the procedure should say that out loud rather than papering over it.

  Then run it on three proposed changes we've actually got on the docket this year:

  1. an enhancement for offenders convicted a second time within the same offense category (the recidivist enhancement),
  2. a cap that would bar sentences beyond a certain number of years when actuarial risk tools say the offender has effectively aged out of risk, and
  3. restoring discretion to give probation for certain low-level offenses where the current grid mandates prison time.

  And give me the output as structured data, please:

  Table 1 -- the procedure itself: columns for step number; the question to ask; what counts as a sufficient answer; what to do if the answer is no; and whether that step is answerable from facts alone or requires a value judgment, and if a value judgment, who owns it (commissioner, judge, or legislature).

  Table 2 -- the three worked cases: columns for the case; the desert-based reading; the forward-looking reading; the procedure's verdict (desert-only, forward-looking-only, mixed, or handoff); and which side of the Dennett/Caruso fight the verdict will annoy and why.

  One more thing. I'm on record at these meetings saying the recidivist enhancement is fine. If your procedure turns out to say the desert story behind it is weaker than I've been assuming, don't sand that down to spare me -- flag it. I'd rather find out from you than from one of the Caruso people mid-meeting.

  Keep it in American English. Casual is fine, we're all friends here, and don't bother with citations -- I know the literature, what I need is the worksheet.
reasoning: |-
  Okay, the user is a philosophy professor serving on a state sentencing guidelines commission. They're stuck between two commissioners debating free will (Dennett vs. Caruso) and need a practical tool to evaluate proposed changes without resolving that philosophical rift. 

  First, let's unpack their constraints: they need a one-page procedure that (a) classifies justifications (desert/forward-looking/mixed), (b) flags when decisions become pure value judgments, and (c) works for legally trained but philosophically inexperienced users in 20-minute slots. Crucially, it must remain neutral in the Dennett-Caruso debate while making disagreements explicit. 

  The three test cases are telling: recidivism enhancement, aging-out cap, and probation restoration. Each tests different aspects of desert vs consequentialist logic. The user specifically warns against sugarcoating if the procedure exposes weaknesses in their pro-recidivism stance - that's a sign they value intellectual honesty over winning arguments.

  Hmm... the core challenge is designing a flowchart-like process that forces explicit value tagging without requiring metaphysics expertise. Key moves:
  - Start with desert justification because retributivism is the default legal framework
  - Build in off-ramps where Caruso's critique would block desert-only claims
  - Use plain-language tests (e.g., "Would we punish if it had zero preventive effects?")
  - Label every judgment call's owner (commission/judge/legislature)

  For the worked examples:
  - Recidivism enhancement: Desert justification is shaky because repeat offenses don't inherently increase moral blameworthiness - that's a consequentialist move disguised as desert. The user's stance might indeed be vulnerable.
  - Aging cap: Pure forward-looking justification, but Caruso proponents would reject any desert component outright - need to show that clash.
  - Probation restoration: Mixed justification with clear off-ramp to judicial discretion.

  The "who gets annoyed" column will be crucial for the user to anticipate pushback. Dennett supporters will bristle when desert claims get blocked; Caruso fans will protest whenever desert isn't flatly rejected. 

  Notably, the procedure mustn't pretend these are resolvable disputes - hence the "handoff" category when value judgments exceed the commission's mandate (e.g., whether retribution has intrinsic worth). That's where the worksheet appropriately surrenders to judges or legislators.

  ...Better include a "metaphysics check" step explicitly tied to the Caruso position. And remind commissioners that "desert" here means legal-moral blameworthiness, not cosmic justice - keep it grounded in case law.
answer: |-
  Here's a streamlined procedure and analysis tailored to your constraints. It treats "desert" as *legal-moral blameworthiness* (not cosmic justice) and "forward-looking" (FL) as *preventive effects* (deterrence/incapacitation/rehabilitation) to sidestep metaphysics while forcing value judgments into the open.

  ---

  ### **Table 1: The Procedure**  
  *(One-page cheat sheet for commissioners)*  

  | Step | Question to Ask                                                                 | Sufficient Answer                                                                                                | If "No" → Then...                                                                 | Fact/Value? (Owner)                                       |  
  |------|---------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------|-----------------------------------------------------------|  
  | 1    | **Is this change *primarily* about matching punishment to offense severity?**<br>(e.g., adjusting for harm/culpability) | Clear link between conduct elements and punishment severity. Ignores offender history/risk.                      | → Proceed to Step 2 (FL justification)                                            | **Value** (Commission)                                    |  
  | 2    | **Would we still endorse this change if it had *zero* preventive effects?**     | Strong intuitive "yes" from desert purists. (Tests if FL is a hidden driver)                                     | → **Desert-only unlikely**. Flag as FL-dependent.                                 | **Value** (Commission)                                    |  
  | 3    | **Is this change *primarily* about reducing future crime?**<br>(e.g., targeting high-risk offenders) | Direct empirical/logical tie to deterrence/incapacitation/rehab. Ignores current offense severity.               | → Proceed to Step 4 (Desert compatibility)                                        | **Value** (Commission)                                    |  
  | 4    | **Would this change punish someone *more/less* than their current offense deserves?** | No disproportionate punishment (e.g., no life sentence for petty theft).                                         | → **FL-only possible** if Step 3 "yes" AND this "no." *But see Step 5.*           | **Value** (Commission)                                    |  
  | 5    | **Metaphysics Check:** Could retributivists *and* skeptics both live with this? | Dennett-side: Desert isn’t violated.<br>Caruso-side: FL benefits justify any weak desert link.                  | → **Mixed justification** if both sides concede. Else → **HANDOFF** (irreconcilable) | **Value** (Legislature/Judge – too foundational)          |  
  | 6    | **Handoff Trigger:** Does this require endorsing a *contested* moral premise?<br>(e.g., "Repeat offenders *deserve* more pain") | Unanimous commission agreement on the premise. Else → Legislators/judges must own the call.                      | → **HANDOFF** to legislature (policy) or judge (case-specific)                    | **Value** (Legislature/Judge)                             |  

  ---

  ### **Table 2: Worked Cases**  

  | Case | Desert-Based Reading                          | Forward-Looking (FL) Reading                     | Verdict       | Who’s Annoyed & Why                                                                 |  
  |------|-----------------------------------------------|--------------------------------------------------|---------------|-------------------------------------------------------------------------------------|  
  | **1. Recidivist Enhancement** | Weak: Repeat offense ≠ increased *moral blame* for the *current act*. "Double-counting" past debt. | Strong: Deters repeat offenses, incapacitates high-risk offenders. | **Mixed** (leaning FL) | **Dennett side:** Annoyed. Procedure exposes desert isn't clean – it's smuggling in FL. **You flag:** "Desert story *is* weaker here – it’s functionally risk management." |  
  | **2. Aging-Out Cap** | Nonsensical: Desert isn't prorated by life expectancy. If the crime deserves 30 years, age shouldn’t matter. | Strong: Actuarial data shows low recidivism post-65. Saves prison resources. | **FL-only** | **Dennett side:** Annoyed. Procedure labels it "FL-only," denying desert any role. **Caruso side:** Happy but may protest Step 4 ("no disproportionality") as desert-talk contamination. |  
  | **3. Probation Discretion** | Strong: Low-level offenses may not deserve prison (proportionality). | Strong: Avoids prison-induced trauma/job loss that increases recidivism. | **Mixed** (with **Handoff**) | **Both sides annoyed:** Dennett – Procedure says desert *alone* can’t mandate prison (Step 2 fails). Caruso – Procedure forces FL to *defer* to desert at Step 4 (no "excessive" punishment). **HANDOFF** because judges must weigh values case-by-case. |  

  ---

  ### Key Notes for Your Meeting:  
  - **Recidivism Enhancement**: Your stance survives as "mixed," but the procedure forces you to admit the desert claim is thin (Step 2: "Would we enhance if it *didn’t* reduce crime?" → Probably not). Arm yourself with FL data.  
  - **Aging Cap**: Pure FL verdict. Desert purists will howl – but Step 4 blocks grotesque outcomes (e.g., dying in prison for nonviolent crime).  
  - **Probation**: The **handoff** is honest. Commissioners can’t resolve "Does shoplifting *ever* deserve prison?" – that’s for judges.  
  - **Neutrality**: Steps 5 and 6 make the Dennett/Caruso fight explicit without taking sides. When they clash → Handoff.  
  - **Time Saver**: Steps 1-4 take <10 mins per item. Steps 5-6 only trigger if debate erupts (which it will).  

  This worksheet forces value judgments into daylight ("Who owns this call?"), avoids metaphysics, and gives the Caruso/Dennett duo a structured way to lose fights without losing face. Print the tables, toss the books, and good luck.
