prompt: |-
  So I'm taking this course on climate ethics and we've spent two weeks on discounting, and I've gotten obsessed with one specific corner of it. The way my prof set it up, the social discount rate economists use can be decomposed into roughly three pieces: (1) a growth term, where future benefits count for less because future people will likely be richer, so a dollar or a utility unit does less good there; (2) a risk/uncertainty term, since policies might fail or humanity might not even be around; and then (3) this residual piece called "pure time preference," which discounts a benefit purely in virtue of when it occurs, regardless of who receives it or how well off they are. It's that third piece I want an essay about: can it be defended, or is it just arbitrary favoritism toward people who happen to be closer to us on the timeline, no better than discounting the interests of people born in March?

  Here's the twist that got me writing this. In section, a friend of mine argued something like this: everyone already accepts pure time preference at the personal level. You care less about a headache next year than a headache today, and nobody calls you irrational for that. And given that your future self is, on psychological-continuity views, arguably not the same person as your present self in any deep sense — connectedness fades over time, future-you is basically a stranger who happens to share your memories — discounting your future self is already discounting somebody else's welfare. So the friend claims the moralist's big objection is a fraud: there was never any such thing as discounting your own welfare, all discounting is discounting of others, and it's all fine. If intra-personal discounting is legitimate even though the discounted party is (on some view) a different person, why exactly is inter-personal discounting forbidden? I sort of suspect this proves too much — if your future self is a stranger, then prudence looks like just a narrow special case of egoism, and it becomes weird to say rational people must be prudent but must not discount their countrymen or whatever — but I can't fully articulate why, and honestly I waffle back and forth between "pure time preference is fine within a life but indefensible in public policy" and "the personal/social distinction does no work at all."

  So: write an essay weighing whether pure time preference can be defended. Cover the standard objection (that discounting by mere temporal position is like discounting by birth month or spatial distance), but take my friend's parity argument seriously too — does the intrapersonal analogy actually support pure time preference across persons, or does it instead drag intrapersonal discounting into disrepute? Think about whether the verdict should come out differently for individual decisions versus government policy (e.g., it's one thing for me to discount my own future, another for a ministry to discount the welfare of people who will exist in 2150 who have no say in the matter), and whether the growth and risk terms can quietly smuggle in everything a pure time preferencer wants without the arbitrariness. Please actually reach and defend a conclusion though — I don't want a wishy-washy "there are considerations on both sides" ending. If you think pure time preference is legitimate everywhere, or nowhere, or legitimate only in one of the two contexts, say so and argue for it.
reasoning: |-
  Okay, the user is deeply engaged with climate ethics and specifically the concept of pure time preference (PTP) in social discounting. They've presented a nuanced dilemma sparked by a friend's argument that challenges the moral distinction between intrapersonal and interpersonal discounting. 

  The core tension here is fascinating: if we accept psychological discontinuity within a single life (making future selves quasi-strangers), does that legitimize PTP across different people? Or does it instead undermine the rationality of personal future discounting? The user seems intellectually restless—they've clearly wrestled with this but feel stuck between "PTP is fine personally but indefensible socially" and "the distinction might be artificial."

  I notice their frustration with wishy-washy answers. They want a bold conclusion. That's refreshing but risky—this topic has heavyweight philosophers on both sides (Ramsey called PTP "ethically indefensible," while Parfit's non-identity problem looms large). Still, they're asking for conviction, so I'll need to take a stand without oversimplifying.

  Their friend's analogy is clever but has cracks. When I discount my future self's headache, I'm still the entity experiencing both present and future pain—the "stranger" shares my biological continuity and legal identity. Future generations lack even that thin connection. And pragmatically, if governments adopted strong PTP, climate mitigation would collapse since most harms hit distant futures. That feels unjustifiable.

  The sovereignty point feels decisive: individuals can choose to privilege their present selves (even if arguably irrational), but governments lack the moral authority to systematically devalue future citizens' interests. The growth/uncertainty terms already capture non-arbitrary reasons to discount—smuggling in PTP is redundant at best, dangerous at worst.

  User's anxiety about "proving too much" is spot-on. If future selves are strangers, prudence becomes indistinguishable from egoism—yet we intuitively condemn the latter. This suggests the friend's view relies on an overly reductive notion of personal identity. Maybe the solution is to defend weak psychological connectedness as sufficient for intrapersonal concern while insisting on stronger grounds for interpersonal ethics.

  Final thought: Their passion for this niche aspect is infectious. I'll match their rigor by condemning PTP in policy while acknowledging personal discounting as a permissible (if often irrational) preference—not because the contexts are metaphysically different, but because collective institutions bear greater duties to impartiality.
answer: |-
  ## The Tainted Coin: Why Pure Time Preference Cannot Be Defended

  The allure of pure time preference (PTP) is undeniable. It whispers that a benefit tomorrow is inherently less valuable than the same benefit today, simply because of its temporal location. Your friend’s argument, leveraging the analogy to intrapersonal discounting and psychological discontinuity, offers a seductive challenge to the moralist's objection: if discounting our future selves is rational and acceptable, even when that future self is arguably a "stranger," why is discounting *actual* strangers in the future unethical? This parity argument, however, is a philosophical sleight of hand. It doesn’t rescue PTP; instead, it exposes the shaky foundations of *both* intrapersonal PTP and its interpersonal counterpart. Ultimately, PTP is indefensible, especially in the domain of social policy and climate ethics, where it functions as arbitrary and unjust temporal discrimination.

  **The Standard Objection: Temporal Position as Moral Irrelevance**

  The core objection to PTP is its naked arbitrariness. Discounting the well-being of future people *solely* because they exist later in time is morally analogous to discounting the well-being of people born in March, living on a different continent, or having a different eye colour. Time of existence is a brute fact, devoid of intrinsic moral significance. It doesn't correlate with deservingness, capacity for suffering, or moral standing. Privileging present interests over identical future interests based solely on temporal proximity is pure bias – favouring "us, here, now" over "them, there, then" for no reason other than our spatiotemporal accident. In the context of climate change, where actions today inflict catastrophic costs centuries hence, adopting PTP condemns future generations to preventable suffering based on a prejudice as indefensible as geographic or genetic discrimination.

  **Deconstructing the Parity Argument: Not a Rescue, But an Implosion**

  Your friend’s argument hinges on two premises: (1) Intrapersonal PTP (e.g., caring less about next year's headache) is widely accepted as rational and legitimate; (2) Psychological continuity theories suggest that future-you is significantly discontinuous with present-you, akin to a different person. Therefore, (3) Intrapersonal discounting *is* interpersonal discounting, legitimizing the latter.

  This argument fails decisively:

  1.  **Questioning Premise One: Is Intrapersonal PTP Legitimate?** Your friend assumes its legitimacy, but this is precisely what the analogy should make us question. *Why* is it "rational" to discount your future self's pain? Is it truly rational, or merely a pervasive psychological bias (hyperbolic discounting) we mistake for rationality? If future-you *is* significantly discontinuous, caring less about their suffering *is* a form of egoism privileging the present self. Philosophers like Derek Parfit argue that recognizing this discontinuity *should* diminish the force of personal PTP, not validate interpersonal PTP. Parfit suggests that concern for our future selves is justified not by strict identity, but by degrees of psychological connectedness. Strong connections warrant strong concern; weaker connections warrant *less* concern. Crucially, this doesn't imply *no* concern, nor does it provide a model for discounting *completely* disconnected future strangers. The parity argument doesn't legitimize interpersonal PTP; instead, it drags intrapersonal PTP into the light of ethical scrutiny, revealing it as potentially less "rational prudence" and more "present-self bias."
  2.  **The Disanalogy of Connection:** Even granting significant psychological discontinuity, the relationship between present-you and future-you remains fundamentally different from the relationship between present-you and a future stranger. Future-you inherits your projects, responsibilities, debts, biological continuity (aging, disease), and legal identity. You *will become* them. There is a unique causal chain and responsibility. Future generations are not *your* future selves in any meaningful sense. They are entirely separate moral agents whose existence and well-being are profoundly shaped by *your* actions, without their consent or reciprocal influence. The thin thread of psychological connection within a life, however frayed, is infinitely thicker than the non-existent thread connecting you to someone born in 2300. The parity argument falsely equates two radically different relationships.
  3.  **The Danger of "Proving Too Much":** As you suspected, the argument does prove too much. If "future self as stranger" justifies discounting, then consistent application leads to a radical egoism where only the present self matters absolutely. Prudence collapses into immediate self-interest. This destroys the very notion of rational long-term planning *for oneself*, let alone ethical obligations to others. We intuitively reject this conclusion. We believe individuals *should* care about their future well-being, even if imperfectly. This intuition reveals that we don't truly accept the "future self as absolute stranger" model in practice, nor its ethical implications. We recognize a non-arbitrary reason for intrapersonal concern (continuity of experience, identity projects, biological survival) that is utterly absent in the impersonal future.

  **Context Matters: Individuals vs. Sovereign Institutions**

  While the *core* arbitrariness of PTP taints it universally, the context of its application significantly amplifies its ethical toxicity in the social sphere:

  *   **Individual Choice:** Within one's own life, prioritizing present needs over future ones, even based partly on time preference, can be seen as a permissible exercise of autonomy, however irrational or biased it might be. You are the primary stakeholder in both moments. The consequences are largely self-contained. While we might encourage prudence, we don't typically condemn mild present bias as a profound *injustice*.
  *   **Social Policy (Especially Climate):** Here, PTP becomes ethically monstrous. Governments are not choosing for themselves; they are trustees for *all* citizens, present and future. Applying PTP means the state actively, systematically, and deliberately devalues the interests of future persons solely because they are not yet born. These future people have no voice, no representation, and no ability to protect their interests against the present majority's bias. Inflicting long-term, irreversible harms (like climate catastrophe) based on PTP is not merely imprudent; it's a profound violation of intergenerational justice, a failure of fiduciary duty, and the imposition of an arbitrary temporal hierarchy by a powerful entity upon the powerless.

  **Smuggling vs. Substance: Do Growth and Risk Suffice?**

  Can the growth and risk terms achieve the practical effects PTP advocates desire without the arbitrariness? Largely, yes, and this is crucial:

  *   **Growth (δg):** If future generations are richer, an extra unit of consumption (or utility) *is* less valuable to them. Discounting future *monetary* benefits at a rate reflecting expected per capita growth is ethically defensible; it adjusts for diminishing marginal utility, not for the time value itself. This already implies that equal absolute costs/benefits occurring later matter less *if and only if* people are better off then.
  *   **Risk/Uncertainty (ρ):** Genuine risks – policy failure, civilizational collapse, unforeseen technological change – justify probabilistic discounting. This isn't discounting time *per se*; it's acknowledging the chance the benefit won't materialize *at all*. Catastrophic risk (e.g., human extinction) warrants a significant premium, but again, this is risk adjustment, not pure time preference.

  PTP advocates often want a higher discount rate to make long-term projects (like climate mitigation) appear less cost-effective. But the growth term already discounts monetary flows in growing economies. Adding an *extra* discount purely for time is redundant at best and ethically corrosive at worst. It smuggles in a bias against the future under a technical guise. Genuine catastrophic risk can be incorporated via the risk premium without needing an arbitrary PTP. If δg and ρ are correctly estimated (a huge challenge, but separate), they capture the *non-arbitrary* reasons why future impacts might be weighted less, without the moral poison of PTP.

  **Conclusion: The Indefensibility of Temporal Favoritism**

  Pure time preference cannot be defended. It is an arbitrary preference for the present over the future based solely on the accident of temporal location, morally equivalent to discrimination based on birth month or spatial distance. Your friend's parity argument, rather than rescuing PTP, backfires spectacularly. It highlights that intrapersonal discounting, upon scrutiny, relies on biases and connections that *don't* translate to the impersonal future, and if taken to its logical extreme, destroys the basis for prudence itself. While individuals might be permitted some degree of present bias within their own lives (as a flawed exercise of autonomy), sovereign institutions have an absolute ethical duty to reject PTP. In the arena of social policy, particularly climate ethics where the stakes involve the survival and well-being of countless future persons, applying PTP is an act of intergenerational tyranny. The growth and risk terms, properly understood and applied, provide all the non-arbitrary justification needed for weighting future impacts differently, without resorting to the tainted coin of pure time preference. We must discard this bias; the future, though distant, deserves its full measure of moral consideration.
