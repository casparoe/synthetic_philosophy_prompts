prompt: |-
  I teach a 75-minute seminar on decision-making to 18 second-year undergraduates. They've had one week of basic game theory — dominance, best responses in the abstract — but no psychology of choice. Design an in-class activity built around the dollar auction that does something more than simply running it: I have in mind a sequence of three or four staged variants in which we alter one feature at a time — for instance, removing the rule that the second-highest bidder also pays, removing the rivalry (one bidder "against the house" with a preset schedule), moving the bidding decision to a committee, or inserting a mandatory pause between bid rounds — so that by the end the students themselves can say which ingredient was doing the work when bids blew past the value of the prize. Constraints: no real money (use points or stakes the participants actually care about), the participants should not hear the name of the game or any psychological explanation until the debrief, and the whole sequence must fit the time available with materials I can carry in one bag.

  For the debrief, map concrete moments from each variant onto the concepts at issue — sunk costs, entrapment, escalation of commitment, competitive arousal — and tell me which variant-to-concept pairings are clean and which are muddied by the classroom setting. Two further requests. First, be explicit about which parts of the psychological explanation of escalation are settled and which are genuinely contested among researchers who study it; I don't want the debrief to present one causal story (say, pure sunk-cost reasoning) as if it were the consensus when the literature is not of one mind. Second, be honest about what a classroom auction cannot reproduce from real-world escalation — for example, continued ambiguity about whether the project might still succeed, or reputational stakes that unfold over months — so I know which parts of the phenomenon I have to supply myself in the debrief rather than expect the activity to generate. And please tell me what will predictably go wrong the first time I run it.
reasoning: |-
  We are designing a sequence of four variants of the dollar auction to illustrate the mechanisms behind escalation of commitment. The goal is to alter one feature at a time and have students identify which ingredient is critical.

  Constraints:
  - No real money: use points that can be converted to something they care about (e.g., candy, extra credit points, donation to charity).
  - Do not reveal the name or psychological explanation until the debrief.
  - Must fit in 75 minutes, with materials carried in one bag.

  Proposed Structure:
  1. Classic Dollar Auction (Variant 1)
  2. Remove the rule that the second-highest bidder also pays (Variant 2)
  3. Remove rivalry: one bidder against the house (Variant 3)
  4. Committee bidding (Variant 4) OR mandatory pause (we'll do mandatory pause as Variant 4 because committee might take more time and we have time constraints)

  Time Allocation:
  - Introduction and setup: 5 min
  - Variant 1: 10 min
  - Variant 2: 10 min
  - Variant 3: 10 min
  - Variant 4: 10 min
  - Debrief: 30 min

  Total: 75 min

  Materials:
  - A prize (e.g., a $10 gift card, or a voucher for 100 points which can be exchanged for candy or extra credit)
  - Whiteboard or flip chart to record bids
  - Markers
  - Timer (for the mandatory pause variant)
  - Handouts for the preset schedule in Variant 3 (if needed) but we can do without by having the instructor act as the house.

  **Important: We are using points, not real money. Let 1 point = $0.01 (so the prize is worth 1000 points). But to avoid large numbers, we can scale: prize = 100 points, and each bid increment is 1 point. We'll call the points "credits".**

  **Variant 1: Classic Dollar Auction**
  - Rules: 
    - Prize: 100 credits (worth, say, a candy bar or 1 extra credit point).
    - Bidding starts at 1 credit. 
    - Each bid must be at least 1 credit higher than the previous.
    - The highest bidder wins the prize and pays their bid.
    - The second-highest bidder pays their bid but gets nothing.
  - We run until no one wants to bid. We record the final bids and who paid what.

  **Variant 2: Remove Second-Highest Payer Rule**
  - Same as Variant 1, but only the winner pays (the second-highest bidder does not pay). 
  - This tests the role of the "double payment" rule in driving escalation.

  **Variant 3: Against the House (No Rivalry)**
  - One volunteer bidder vs. the house (instructor). 
  - The house has a preset schedule: it will always bid 1 credit more than the student until a certain point (say, 50 credits) and then stops. 
  - The student knows the house will bid up to 50. 
  - The student can bid at any time (with increments of at least 1). 
  - Only the student pays if they win (and the house doesn't pay because it's the house). 
  - We want to see if the student will go beyond 50 (the known stopping point) and if so, why? (But note: without rivalry, we expect less escalation, but the sunk cost might still drive the student to bid beyond 50 because they have already invested.)

  **Variant 4: Mandatory Pause**
  - Back to the classic rules (like Variant 1) but with a twist: after each bid, there is a 30-second pause during which bidders cannot bid and must sit quietly. 
  - This introduces a cooling-off period to reduce impulsive bidding.

  **Debrief (30 min):**

  1. **Reveal the name and the phenomenon**: The dollar auction and escalation of commitment.
  2. **Map each variant to concepts**:
     - Variant 1 (Classic): Illustrates competitive arousal (bidding against others), entrapment (feeling stuck), sunk costs (past bids as sunk, but influencing future bids), and escalation of commitment (bidding beyond the value).
     - Variant 2 (No second payment): By removing the second payment, we remove the "entrapment" of the second-highest bidder. We expect less escalation because the second-highest bidder doesn't lose money. This variant highlights the role of the rule that creates a large loss for the second-highest bidder, which is a key driver of entrapment.
     - Variant 3 (Against the house): Without a human rival, competitive arousal is reduced. But the sunk cost effect may still be present. If the student bids beyond 50, it's due to sunk cost reasoning (they've already invested, so they want to "win" to justify the investment). However, without rivalry, we expect less escalation than in the classic case. This variant isolates sunk costs and competitive arousal.
     - Variant 4 (Mandatory pause): The pause is intended to reduce impulsive bidding and competitive arousal by introducing reflection time. This variant highlights the role of emotion and impulsivity in escalation.

  3. **Concepts and their mapping**:
     - Sunk costs: Most clearly seen in Variant 3 (against the house) because there is no rival to compete with, so any bidding beyond the known stopping point (50) must be due to the student's own sunk costs. Also present in all variants.
     - Entrapment: Especially in Variant 1, because the second-highest bidder is trapped: if they don't bid, they lose what they've already bid (and get nothing), so they bid again to try to win and avoid that loss. This is removed in Variant 2, so we expect less entrapment.
     - Escalation of commitment: The overall pattern of increasing bids beyond the prize value. Seen in Variant 1 and to a lesser extent in Variant 3 and maybe Variant 4 (if the pause doesn't stop it).
     - Competitive arousal: The heat of the moment, rivalry. Present in Variant 1 and absent in Variant 3. Reduced in Variant 4 by the pause.

  4. **What the literature says (settled and contested)**:
     - Settled: 
       - The dollar auction reliably produces escalation beyond the prize value in the classic setup (Variant 1).
       - The rule that the second-highest bidder pays is a critical driver (Variant 2 should show less escalation).
       - Time pressure and arousal increase escalation (Variant 4 tests this by introducing a pause, which should reduce escalation).
     - Contested:
       - The relative importance of sunk costs versus competitive arousal. Some researchers argue that competitive forces are the primary driver, while others emphasize the sunk cost fallacy. The truth is likely both, but their relative weights are debated.
       - The role of self-justification and ego: in real-world situations, individuals may escalate to avoid admitting failure or to preserve reputation. This is hard to replicate in the classroom.

  5. **What the classroom auction cannot reproduce**:
     - Ambiguity: In real projects, there is often uncertainty about the likelihood of future success. In our auction, the prize is fixed and known.
     - Long-term reputational stakes: In the classroom, the auction is a one-off. In real life, escalation might be driven by the desire to maintain reputation over time.
     - Ego involvement: In the classroom, the stakes are low. In real life, personal identity and professional reputation may be on the line.

  6. **What might go wrong**:
     - Variant 1 might not escalate: If the students are too cautious, the auction might end early. To prevent this, you might need to encourage bidding at the start (without revealing the purpose). Alternatively, use a small group of volunteers (4-5) to make it more competitive.
     - Time: Each auction might take longer than expected. Be prepared to cut off if necessary (set a time limit for each variant).
     - In Variant 3, the student might not bid beyond 50 because they know the house stops at 50. That's okay because it shows that without rivalry and with clear information, escalation is reduced. But if they do bid beyond, it's due to sunk cost.
     - In Variant 4, the pause might not reduce escalation because the students might use the time to plan their next bid. Emphasize that during the pause, they should not talk and just reflect.

  **Running the Activity**:

  Introduction (5 min):
  - "We are going to do a series of short exercises about bidding. The goal is to win a prize. We'll use credits, and at the end, we'll convert the credits to [candy/extra credit]."

  Variant 1: Classic (10 min)
  - Explain the rules (without giving away the phenomenon).
  - Select 4-5 volunteers (to keep it manageable and competitive).
  - Run the auction until no one bids for 10 seconds. Record the final bids and payments.

  Variant 2: No Second Payment (10 min)
  - New set of volunteers (to avoid learning from the first round). Or same if you want to see if they learned? But better new to isolate the rule change.
  - Explain the rule change: "This time, only the winner pays. The second-highest bidder does not pay anything."
  - Run the auction.

  Variant 3: Against the House (10 min)
  - One volunteer. Explain: "You are bidding against the house (the instructor). The house will continue to bid 1 credit more than you until it reaches 50 credits. After that, the house stops. If you are the last bidder, you win the prize and pay your bid. The house does not pay because it's the house."
  - Run the auction.

  Variant 4: Mandatory Pause (10 min)
  - Classic rules (like Variant 1) but with a pause. Use a new set of volunteers.
  - Rule: After each bid, there is a 30-second pause. During the pause, no one can bid. They must sit quietly and think.

  Debrief (30 min):
  1. Reveal: "You have just participated in variations of the 'dollar auction' game, designed to study escalation of commitment and related phenomena."
  2. Show the results of each variant. Ask: "In which variant did we see the highest bids relative to the prize? Why?"
  3. Map to concepts using the table:

  | Variant | Key Alteration          | Primary Concept Illustrated | Expected Result |
  |---------|-------------------------|-----------------------------|----------------|
  | 1       | Classic                 | Competitive arousal, entrapment | High escalation |
  | 2       | No second payment       | Removal of entrapment       | Less escalation |
  | 3       | Against the house       | Sunk costs (without rivalry) | Moderate escalation (if any beyond 50) |
  | 4       | Mandatory pause         | Reducing impulsive bidding  | Less escalation than Variant 1 |

  4. Discuss why each variant led to the observed outcome, and which ingredient (rule change) was critical.
  5. Discuss the concepts: sunk costs, entrapment, escalation, competitive arousal. Use concrete moments from the auctions.
  6. Explain settled vs. contested: 
     - Settled: The structure of the auction (with second payment) causes entrapment and escalation. Time pressure and arousal contribute.
     - Contested: The relative role of sunk costs versus competitive forces. Some argue that without competition, sunk costs alone are weak (so Variant 3 might not show much escalation). Others find sunk costs are powerful even without competition.
  7. Classroom limitations: 
     - Real-world ambiguity about success is missing: in our auction, the prize is fixed and known. In real projects, the chance of success might be uncertain and change over time.
     - Reputational stakes are absent: in the classroom, it's a game. In real life, people might escalate to save face in front of colleagues or superiors.
     - Stakes are low: with points, the emotional investment is less.

  **Predictable Problems**:
  1. **Variant 1 might not escalate**: If the students are too rational, they might stop early. Solution: Use enthusiastic volunteers or start with a small group that seems competitive. If it ends too early, note that in the debrief and explain that in larger groups or with higher stakes, it usually escalates.
  2. **Time overrun**: Keep each auction to 10 minutes. Use a timer. If an auction is still going at 10 minutes, stop it and use the highest bid at that point.
  3. **Students might figure it out**: If they know about the dollar auction, they might not bid. But since they are second-year undergrads with only one week of game theory, it's unlikely. Still, if they do, note it in the debrief as an example of learning reducing escalation.
  4. **Variant 3 might not show sunk cost**: The student might stop at 51 (just above 50) and win. That's rational. If they go higher, then sunk cost is at play. If they don't, it shows that without rivalry, escalation is reduced.

  By structuring the activity this way, the students should be able to see how different factors contribute to escalation and draw their own conclusions.
answer: |-
  Below is a comprehensive in-class activity designed around the dollar auction, tailored to your constraints and learning objectives. The activity uses **points** (redeemable for small candies or 0.5% extra credit per 10 points) to avoid real money. All materials fit in one bag: a prize (e.g., $10 gift card), a whiteboard/markers for tracking bids, index cards for committee voting, and a timer. The sequence includes four 10-minute variants, leaving 35 minutes for debrief and transitions.

  ---

  ### **Activity Sequence: "The Bidding Challenge"**  
  **Total Time:** 75 minutes  
  **Materials:** Prize (e.g., $10 gift card), whiteboard, markers, timer, index cards (for committees), bag of candies/extra credit vouchers.  
  **Stakes:** Prize value = 100 points. Points convert to rewards (e.g., 10 points = 1 candy/0.5% extra credit). Announce: *"Points affect your rewards—bid wisely!"*  

  #### **Step 1: Setup (5 min)**  
  - **Rules Intro (Generic):** "We’re running a bidding game. In each round, you’ll bid points to win a prize. Highest bid wins, but rules change slightly each round. I’ll explain new rules before we start."  
  - **Recruit Volunteers:** For each variant, use 3–4 new volunteers (avoids carryover learning). Keep others as observers.  
  - **Prize Display:** Hold up the gift card. "This prize is worth 100 points. Bidding starts at 1 point, increments by ≥1 point."  

  ---

  #### **Step 2: Four Variants (10 min each, 40 min total)**  
  Alter **one rule per variant** to isolate psychological drivers. Students record outcomes on paper (no discussion yet).  

  1. **Variant 1: Classic Auction (Baseline)**  
     - **Rules:**  
       - Winner pays their bid and gets the prize (100 points).  
       - *Second-highest bidder pays their bid and gets nothing.*  
       - Bidding is open/fast (no pauses).  
     - **Alteration:** None. This establishes escalation.  
     - **Predicted Issue:** Bids may stall if students are cautious. **Fix:** Start with assertive volunteers; nudge with "Going once..." to build momentum.  

  2. **Variant 2: No Second-Highest Payer**  
     - **Rules:**  
       - Winner pays and gets the prize.  
       - *Second-highest bidder pays **nothing**.*  
       - Other rules unchanged.  
     - **Alteration:** Removes the "entrapment" mechanism.  
     - **Predicted Issue:** Bidding may end early (no loss aversion). **Fix:** If bids stall below 50, remind: "The prize is still valuable!"  

  3. **Variant 3: Against the House (No Rivalry)**  
     - **Rules:**  
       - One bidder vs. instructor ("the house").  
       - *House uses a preset schedule:* Bids 1 point more each time until 50 points, then stops.  
       - Bidder knows the house’s limit. Only bidder pays if they win.  
     - **Alteration:** Removes competition, isolates sunk costs.  
     - **Predicted Issue:** Bidder may stop at 51 (rational). **Fix:** If they bid past 60, highlight it in debrief as sunk-cost-driven.  

  4. **Variant 4: Committee Bidding + Mandatory Pause**  
     - **Rules:**  
       - Classic rules (like Variant 1).  
       - *Bids decided by 3-person committees* (use new volunteers).  
       - *30-second pause* between bids for deliberation (timer enforced).  
     - **Alteration:** Adds deliberation and reduces impulsivity. Committees diffuse individual arousal.  
     - **Predicted Issue:** Committees may escalate slower but still overshoot. **Fix:** Encourage consensus—"Your group must agree on a bid."  

  ---

  #### **Step 3: Debrief (30 min)**  
  Reveal the game’s name ("dollar auction") and concepts. Use whiteboard to map variants to psychological drivers with student input.  

  **Part 1: Variant-to-Concept Mapping (15 min)**  
  | Variant          | Key Alteration                     | Concept Illustrated             | Concrete Moment Example                     | Classroom Limitation                     |  
  |------------------|------------------------------------|----------------------------------|---------------------------------------------|------------------------------------------|  
  | 1: Classic       | None (baseline)                    | **Competitive arousal** + **Entrapment** | "When two bidders glared at each other past 100 points." | Real-world **reputational stakes** missing (e.g., saving face over months). |  
  | 2: No Second Payer | Second-highest bidder pays nothing | **Entrapment removal**           | "Bidding stopped at 60 points—no fear of double loss." | Clean: Isolates entrapment. Muddied by low stakes (no true financial pain). |  
  | 3: Against House | No human rival                     | **Sunk costs**                   | "Bidder went to 70 points even knowing the house stops at 50." | Clean: Shows sunk costs. Muddied by **ambiguity absence** (real projects have uncertain success). |  
  | 4: Committee + Pause | Group deliberation + forced pause | **Escalation mitigation**        | "Committee paused at 80 points and quit—cooled off." | Clean: Reduces arousal. Muddied by **group dynamics** (social loafing may suppress true arousal). |  

  - **Sunk costs:** "Why bid past 50 in Variant 3? You were trying to justify prior bids."  
  - **Entrapment:** "In Variant 1, the second-place bidder kept bidding to avoid losing their investment."  
  - **Competitive arousal:** "Rivalry in Variant 1 made bids feel personal—like winning mattered more than points."  
  - **Escalation of commitment:** "All variants showed this—escalation is the umbrella; the others are ingredients."  

  **Part 2: Psychological Explanations—Settled vs. Contested (10 min)**  
  - **Settled Consensus in Literature:**  
    - Entrapment (from second-highest payment) and competitive arousal *always* fuel escalation (Variants 1–2).  
    - Time pressure/impulsivity increases escalation (Variant 4’s pause reduces it).  
    - Sunk costs *contribute* but are rarely the sole driver (Variant 3 alone can’t explain high bids).  
  - **Genuinely Contested:**  
    - **Sunk costs vs. rivalry:** Some researchers (e.g., Staw) argue sunk costs dominate; others (e.g., Ku et al.) show competition is primary. Your auction may show both, but their interaction is debated.  
    - **Emotion vs. cognition:** Is escalation mostly impulsive (arousal) or a calculated risk (e.g., "We might still win!")? Evidence is mixed.  
    - **Debrief Tip:** "No single story explains escalation—it’s a cocktail. Context changes the recipe."  

  **Part 3: Classroom Limitations (5 min)**  
  - **What the activity CAN’T replicate:**  
    - **Ambiguity of success:** Real-world projects have uncertain outcomes (e.g., "This next bid might fix the software!"). Here, the prize value is fixed.  
    - **Long-term stakes:** Reputational harm ("If I quit, my team will distrust me") or career consequences don’t translate to points.  
    - **Ego involvement:** Classroom bids lack deep personal investment (e.g., defending a failing project you championed).  
  - **Instructor’s Role:** Use these limitations to discuss real-world examples (e.g., tech project failures) during debrief.  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Variant 1 stalls early:** Students may quit below 50 points if they’re game-theory savvy.  
     - **Fix:** Use volunteers who seem competitive; start with small increments ("Bids jump by 1 point!").  
  2. **Time overruns:** Auctions can drag.  
     - **Fix:** Cap each at 5 min; end if 10 seconds pass without a bid.  
  3. **Students guess the purpose:** May underbid to "beat the game."  
     - **Fix:** Emphasize rewards ("Points buy candy!"); use new volunteers per round.  
  4. **Variant 3 is too rational:** Bidder may stop at 51 points.  
     - **Fix:** If this happens, contrast it with Variant 1 ("Why no escalation here? No rival to compete with").  
  5. **Committee indecision (Variant 4):** Groups may deadlock.  
     - **Fix:** Assign a "tiebreaker" role; remind them silence = forfeit.  

  ---

  ### **Why This Works**  
  - **Pedagogical Value:** Each variant alters one "ingredient," letting students deduce causes of escalation. The debrief links concrete moments to theory while acknowledging complexity.  
  - **Logistics:** All materials fit in one bag. Points ensure engagement without real money.  
  - **Debrief Clarity:** Explicitly separates settled vs. contested science and classroom limitations, preventing oversimplification.  

  By the end, students will see how rules, rivalry, and impulsivity interact—and why real-world escalation is harder to escape. Run it as a fast-paced, revelation-style experiment, and they’ll leave debating the psychology long after class.
