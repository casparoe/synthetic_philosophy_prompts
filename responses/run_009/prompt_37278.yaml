prompt: |-
  people arguing for pronatalism keep telling me that pay-as-you-go pensions are just a Ponzi scheme the government legalized: today's retirees get paid from today's contributions, so it only keeps working if each generation is bigger than the one paying in, and the whole thing collapses the moment the inflow of new contributors slows. the conclusion being drawn is that population decline isn't just a cultural worry but fisically impossible -- no kids, no pensions, end of story -- so pronatalist policy is basically mandatory. my gut says the analogy is carrying more weight than it should but i can't put my finger on exactly where it breaks. can you map out what corresponds to what (early investors, promised returns, the recruitment of new entrants, the moment of collapse), then list the disanalogies and say which ones actually matter for the pronatalist conclusion and which are just noise -- e.g. does productivity growth do the same work population growth was supposed to do, and is a scheme that never has to end still a Ponzi? and if the analogy is bad, is there a better one for what pay-go systems actually are, and does the pronatalist conclusion survive under the better analogy or was it riding on the bad one the whole time
