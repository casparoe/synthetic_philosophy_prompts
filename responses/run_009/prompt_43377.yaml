answer: |-
  Here is a structured analysis addressing your conceptual itch, designed for precision in dramatization:

  **I. Nearest Concepts (approx. 250 words)**

  1.  **Testimonial Injustice (Miranda Fricker):** The core concept. Occurs when a speaker receives less credibility than deserved due to prejudice (e.g., gender, class, race, occupation). Fricker focuses on *global* credibility deficits affecting the reception of *factual testimony*. Your caregiver experiences a *specific, selective* deficit only when moving from facts to interpretation.
  2.  **Hermeneutical Injustice (Fricker):** Arises when someone lacks the conceptual resources to understand their own experience due to gaps in the collective interpretive framework, often stemming from social marginalization. While related to the *capacity* to interpret, it doesn't fully capture the *social reception* of an interpretation *already formed* by someone deemed a competent witness.
  3.  **Epistemic Credibility Excess:** The flip side, where certain individuals (e.g., physicians in your nurse's example) are granted *more* credibility than warranted, often based on status or credentials. This explains why the physician's re-pronouncement is accepted, but not why the *same* interpretation from the nurse is dismissed *despite* her recognized observational competence.
  4.  **Epistemic Authority:** The socially recognized right to define knowledge within a specific domain. Physicians have epistemic authority over medical diagnosis; family members might claim it over familial motives. The caregiver lacks authority over the *meaning* domain, despite authority over the *event* domain.

  **II. Where They Fall Short (approx. 150 words)**

  The key shortfall is the **selective bifurcation of credibility within a single epistemic agent regarding different *types* of assertions about the *same event sequence***. Fricker's testimonial injustice describes a *general* deficit affecting testimony broadly; here, the deficit is sharply confined to *interpretive* claims. Hermeneutical injustice concerns the *formation* of understanding, not its *rejection* after articulation. Credibility excess explains the acceptance of the physician but not the *reason* for the caregiver's *interpretive* deficit. Epistemic authority identifies the *structure* but not the *precise mechanism* of the denial – the caregiver isn't necessarily claiming formal authority, but offering an insight derived directly from her privileged observation, which is nonetheless rejected *specifically* as "not hers to offer." The puzzle is *why* credibility granted for observation evaporates for interpretation, especially when the interpretation builds directly upon those observations.

  **III. A Label, if Warranted (approx. 150 words)**

  **Interpretive Constraint (or Interpretive Credibility Deficit):** *The systematic social practice of granting an individual full epistemic credibility regarding the observation and reporting of factual events, while simultaneously denying or significantly discounting their credibility when offering interpretations, explanations, diagnoses, or assessments of meaning derived from those same observations, based primarily on their social identity, role, or perceived position within a relevant hierarchy.*

  *Crucial Exclusions:*
  *   It is **not** mere disagreement or skepticism about a specific interpretation's accuracy. The constraint is systematic and tied to the speaker's identity/role.
  *   It is **not** the result of proven incompetence in interpretation generally. The deficit arises *despite* demonstrated competence in observation and factual reporting within the same domain.
  *   It is **not** simply deference to expertise. The denial often occurs even when no superior interpretive expertise is present (e.g., the family daughters dismissing the caregiver's insight about their mother's fear).

  **IV. Two Boundary Cases (approx. 200 words total)**

  1.  **Where It Should End: The Specialist Outside Their Field.** A renowned cardiologist observes a minor car accident while walking down the street. She reports the factual sequence (speed, point of impact, visible damage) credibly. She then interprets the cause as "likely driver distraction due to smartphone use," based on seeing the driver looking down just before impact. If listeners doubt this *specific* interpretation because she's a cardiologist, not an accident investigator or psychologist, that's *not* Interpretive Constraint. The doubt stems from perceived lack of *domain-specific interpretive expertise* for *this specific type of event*, not a systematic denial of her right to interpret *based on her fundamental role or identity*. Her factual report might also be doubted if she seemed visibly shaken, but that would be a general credibility issue.
  2.  **Testing the Caregiver Case: The Physician's Spouse.** Imagine your caregiver character is married to a prominent physician. She continues her work. Within the family she serves, her factual reports are trusted. One day, she offers the *same* interpretation about the matriarch's terror of being a burden. If the family now *accepts* this interpretation more readily, or attributes it to insights gained via her marital connection ("Oh, she must hear things from her husband"), this *tests* the core of Interpretive Constraint. If acceptance increases, it strongly suggests her original deficit *was* tied to her role as "just the caregiver," not the content of the interpretation itself. If rejection persists similarly, other factors (gender, class, specific family dynamics) might be more primary, though the caregiver role likely compounds them. Your original depiction, especially with the daughters' exchanged look implying "overreach," strongly suggests Interpretive Constraint is the operative dynamic.

  **Conclusion:** Your narrator's experience is **not idiosyncratic**. It's a recognizable instance of **Interpretive Constraint**, a specific pattern within broader epistemic injustices. It arises from deeply embedded social hierarchies that allocate not just labor but also the *right to assign meaning*, reserving interpretation for those with sanctioned status or credentials, regardless of proximity or insight. The "temperature drop" signifies the enforcement of this boundary. The complementary figure (the physician with factual latitude) exists because they possess **Interpretive Credibility Excess** within their domain. Understanding this precise bifurcation – the trusted witness barred from interpreting their own witnessed reality – provides the conceptual clarity to dramatize it with authenticity and power.
