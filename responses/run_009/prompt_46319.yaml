  The user has already identified several key requirements for such a method. First, it must handle paradigm cases like slaveholders defending slavery without falsely condemning movements like feminism where interest and conviction align. Second, it can't smuggle in moral assumptions - it must work in actual disagreements. Third, it shouldn't automatically flag minority views as biased. Fourth, it must distinguish legitimate partiality (like parental care) from corrupting bias. Fifth, it needs to separate process bias (bad reasoning) from standpoint (valuable perspective) and mere interest alignment.

  Looking at existing approaches:
  - Follow-the-incentives fails requirement #1 by overgeneralizing
  - Reflective equilibrium struggles with #2 by depending on starting intuitions
  - Rawlsian conditions help with #5 but face #2 problems
  - Ideal observer theory violates #2
  - Genealogy alone fails #3 and #5

  The core tension is between avoiding moral smuggling (#2) and delivering substantive verdicts. Most methods either smuggle morality or become too empty to be useful. The user suspects #2 is the killer requirement, and I agree - it's what makes this problem so hard.

  For practical use, the user might need to:
  1) Demand symmetrical application of genealogy
  2) Focus on epistemic hygiene
  3) Use standpoint awareness carefully
  4) Flag partiality boundaries explicitly
  5) Embrace "biased but correct" as possible

  The deepest challenge is that moral knowledge requires both detachment and situatedness - we need methods that honor this tension rather than pretending to resolve it.
answer: |-
  Here's the requirements list for any method aiming to distinguish moral bias from moral preference, expanded from your points with critical additions, followed by a scorecard of existing approaches. The killer requirement is indeed **no moral smuggling (#2)**, as it exposes why most methods fail under scrutiny in live controversies.

  ### Requirements List (Expanded)
  1. **Handle Paradigm Cases Without Overgeneralizing**  
     - *Must:* Condemn the slaveholder’s "moral" defense as biased.  
     - *Must Not:* Falsely condemn feminist advocacy as "self-serving bias."  
     - *Why:* Alignment between conviction and interest isn’t inherently corrupting (e.g., oppressed groups advocating for their rights). The method must distinguish *coincidental* alignment from *causal* rationalization.  

  2. **No First-Order Moral Smuggling**  
     - *Must:* Work without presupposing moral truth (e.g., can’t assume utilitarianism is correct).  
     - *Must Not:* Reduce to "bias = disagrees with me."  
     - *Core Tension:* How to detect epistemic defects (e.g., truth-insensitivity) without access to moral truth. *Crucially, the method must identify flaws in belief-formation processes, not outcomes.*  

  3. **Avoid Minority View Penalization**  
     - *Must:* Recognize that historically correct views (e.g., abolitionism) were minority positions benefiting their holders.  
     - *Must Allow:* "Biased but correct" verdicts (e.g., a self-interested argument that accidentally aligns with truth).  

  4. **Distinguish Legitimate Partiality from Corrupting Bias**  
     - *Must:* Permit non-corrosive partiality (e.g., parental care, loyalty to friends).  
     - *Must Not:* Condemn all group-serving preferences (e.g., workers unionizing).  
     - *Key Test:* Does the partiality *distort judgment* (e.g., denying others' equal rights) or merely prioritize within acceptable bounds?  

  5. **Tripartite Separation**  
     - *Must Differentiate:*  
       - **Process Bias**: Defective reasoning (e.g., motivated reasoning, ignoring counterevidence).  
       - **Standpoint**: Beliefs shaped by social position, which *may* enhance insight (e.g., workers understanding exploitation).  
       - **Interest Alignment**: Beliefs happen to benefit the holder, with no causal link to formation.  
     - *Why:* Only process bias is inherently epistemically vicious. Standpoint can be virtuous; interest alignment is neutral.  

  6. **Symmetry Requirement (Added)**  
     - *Must:* Apply identically to all views, including the accuser’s. Genealogies of "convenient" beliefs (e.g., egalitarianism among the privileged) must be scrutinized equally.  
     - *Why:* Prevents "pre-theoretical" cherry-picking of targets.  

  7. **Live Controversy Applicability (Added)**  
     - *Must:* Deliver verdicts *mid-debate* without waiting for historical consensus.  
     - *Must Not:* Require uncontested moral facts.  

  ---

  ### Scorecard of Existing Methods  
  **Follow-the-Incentives Heuristic** (Discount views benefiting the believer)  
  - ✅ *Paradigm cases*: Catches the slaveholder.  
  - ❌ *Overgeneralization*: Fails #1 (condemns feminists), #4 (condemns parental care), #3 (condemns minority advances).  
  - ❌ *No separation*: Collapses interest alignment with bias (#5).  
  - **Verdict:** **Fails** — Violates #1, #3, #4, #5.  

  **Reflective Equilibrium** (Seek coherence between principles/intuitions)  
  - ✅ *Partiality*: Can accommodate legitimate partiality (#4) via considered judgments.  
  - ❌ *Moral smuggling*: Relies on intuitions shaped by socialization (#2), often privileging status quo.  
  - ❌ *Minority views*: Suppresses "outlier" intuitions (#3).  
  - ❌ *Process blindness*: Ignores *how* intuitions formed (#5).  
  - **Verdict:** **Fails** — Violates #2, #3, #5.  

  **Rawlsian Ideal Conditions** (Only trust judgments formed under fairness/ignorance)  
  - ✅ *Process focus*: Targets belief-formation (#5).  
  - ❌ *Moral smuggling*: "Fair conditions" assume liberal egalitarianism (#2).  
  - ❌ *Standpoint erasure*: Excludes insights from lived experience (#5), e.g., ignoring marginalized voices.  
  - ❌ *Live controversy*: Requires hypothetical detachment (#7).  
  - **Verdict:** **Fails** — Violates #2, #5, #7.  

  **Ideal Observer Theory** (What would a neutral, fully informed observer approve?)  
  - ❌ *Moral smuggling*: "Neutrality" encodes Western impartiality (#2); assumes moral realism.  
  - ❌ *Standpoint*: Erases perspectival knowledge (#5).  
  - ❌ *Partiality*: Cannot justify loyalty/gratitude (#4).  
  - **Verdict:** **Fails** — Violates #2, #4, #5.  

  **Flat Genealogy** (Explain belief via origins, e.g., "You only believe X because of Y")  
  - ✅ *Process focus*: Can detect rationalization (#5).  
  - ❌ *Genetic fallacy*: Assumes origins invalidate belief, ignoring truth-sensitivity (#2, #3).  
  - ❌ *Asymmetry*: Rarely applied to accusers (#6).  
  - ❌ *No separation*: Conflates standpoint with bias (#5).  
  - **Verdict:** **Fails** — Violates #2, #3, #5, #6.  

  ---

  ### The Killer Requirement  
  **#2 (No Moral Smuggling)** is indeed the primary spoiler. Every method above implicitly assumes a moral framework (e.g., Rawlsian fairness, utilitarian neutrality) to define "bias," rendering them useless in fundamental disagreements. **The core problem**: Detecting *epistemic defects* (e.g., truth-insensitive belief formation) is tractable in science but seemingly impossible in ethics without moral access. This is why most methods "settle the controversy first" — they lack a neutral epistemic standard.  

  ### The Path Forward?  
  A viable method must focus **solely on process defects** (Requirement #5) while meeting #1–#7. This suggests:  
  1. **Prioritize reasoning hygiene**: Track counterevidence avoidance, ad hoc exceptions, asymmetrical scrutiny.  
  2. **Demand symmetry**: Insist genealogies apply to *all* beliefs in the dispute.  
  3. **Decouple standpoint from bias**: Ask: "Does this position *leverage* their standpoint to engage evidence, or *ignore* evidence to protect interests?"  
  4. **Accept provisional verdicts**: "Biased" means *this argument is epistemically compromised*, not *this conclusion is false*.  

  No existing method clears all hurdles, but **process-focused genealogy + symmetry** comes closest — if it rejects genetic fallacies and allows for "biased but correct" outcomes. Still, Requirement #2 remains the thorn: without moral truth, "truth-insensitivity" is hard to gauge. The best hope is procedural: bias is what survives *after* symmetrical process scrutiny.
