prompt: |-
  So, quick bit of context: I'm a backend engineer, no formal philosophy training, just an unhealthy amount of time spent in EA-adjacent rabbit holes. You're an expert decision theorist. Please actually think carefully and work through this properly — brainstorm a bit first rather than just dumping the first thing that sounds wise, and don't just tell me what I want to hear.

  I've been trying to work out my real position on expected value and "fanaticism" by writing down my gut verdicts on a pile of cases, because I've noticed they don't obviously hang together. Here they are:

  1. At work we do expected value reasoning all the time for shipping decisions — rough probabilities, rough payoffs, pick the bigger number. I'm happy with that. Likewise I'd take a 1-in-1000 shot at £1000 over a guaranteed 99p, that just seems obviously right.

  2. Certain £500,000 versus a 50.1% chance at £1 million: I take the certain £500k and I don't think I'm being irrational. Diminishing returns or something.

  3. But with lives I'm the opposite: certain save 100 versus a 51% chance of saving 200, I take the 51%. It's not my risk to be averse to, and the 101st person saved is worth exactly as much as the 1st.

  4. In fact I think saving 10,000 lives is exactly ten times as good as saving 1,000, and saving 10^50 lives is exactly 10^47 times better than saving 10^3, and so on without end — it would be monstrous to think the last life counted less.

  5. Yet if a bloke on the street offers me a 1-in-10^100 chance of 10^102 utils if I hand over my wallet, I refuse, and I think anyone who pays up is basically broken. Same for any bet where the payoff is some cosmic number and the odds are astronomically thin — I refuse no matter how big the expected value gets.

  6. But I'm all for spending billions tracking asteroids, even if the chance of a civilisation-ending impact in a given decade is something like 1 in 100,000. Obviusly worth it.

  7. I also think voting is rational, because of the tiny chance of casting the decisive vote in an election with huge stakes — maybe 1 in 10 million. Still worth the walk.

  8. St Petersburg lottery (keep flipping a coin, payout doubles each heads, no upper bound): I'd pay maybe £20 to play. Definately not the "infinite value, pay anything" answer.

  So: is there one principle that delivers all of these? My own attempt was "maximise expected value, but only over probabilities above some floor, like 1 in a million" — which dies immediately on case 7, and probably on cases I haven't thought of. Can that be repaired, or should I bin it? What's the actual principled line between the asteroid bet and the mugger — is it just "I trust the numbers on the asteroid", and if so does that mean my verdicts are tracking evidence rather than value? And be specific about which of my verdicts has to go if there's a genuine contradiction in here, because I suspect cases 4 and 5 don't sit together but I can't quite see why. I'd also like you to tell me what your principle says about the case I keep flip-flopping on: a genuinely verified, physics-allowed 1-in-10-billion chance of curing all cancer forever, for £1. Is refusing that just fanaticism running in reverse?
reasoning: |-
  Okay, let me try to unpack this backend engineer's dilemma. They've given me eight carefully considered cases showing their conflicting intuitions about expected value calculations, ranging from small-stakes decisions to cosmic-scale dilemmas. The core tension seems to be between their strong commitment to linear value scaling for lives saved (case 4) and their refusal to accept Pascal's Mugger-type scenarios (case 5), while also wanting to justify asteroid defense and voting (cases 6-7).

  Hmm, first I notice they're wrestling with several distinct but related problems: diminishing marginal utility for money vs linear value for lives, risk aversion in personal finance but not in altruistic contexts, and the breakdown of expected value at extreme probabilities. Their "probability floor" idea fails because it would reject voting (case 7), which they endorse. 

  Interesting how their professional experience with expected value (case 1) coexists with rejecting it in philosophical edge cases. The St. Petersburg paradox (case 8) shows they intuitively recognize that unbounded utility functions lead to absurdity. But they haven't yet connected this to their rejection of Pascal's Mugger (case 5). 

  For the cancer cure case... if we take their linear value scaling seriously, £1 for a 1e-11 chance to cure all cancer has astronomical EV. But refusing it feels rational. Why? Because at certain scales, probability estimation becomes meaningless - we can't reliably distinguish between 1e-11 and 0, nor verify such claims. 

  I think the solution space has three main approaches: bounded utility (which handles cases 5 and 8 but challenges case 4), epistemic constraints on small probabilities (which preserves linear value but requires discounting unverifiable probabilities), and context-dependent decision rules. Their case 2 (money) vs case 3 (lives) suggests they already use different frameworks for personal vs altruistic decisions. 

  The real conflict is between case 4 (unbounded value) and case 5 (rejecting cosmic stakes). If they keep both, they must either accept Pascal's Mugger or introduce a discontinuity - perhaps through Knightian uncertainty about extreme probabilities. Alternatively, they could bound the value function while maintaining that each life matters equally up to that bound. 

  For the cancer cure dilemma: under bounded utility, refusal is rational; under probability discounting, it depends on verification; under their "not my risk" principle from case 3, they might feel obligated to pay. But in practice, epistemic constraints likely make refusal reasonable - no real-world proposition comes with verifiable 1e-11 probabilities.
answer: |-
  I appreciate you laying out these cases so clearly—and your self-awareness about the tensions. This is a deep problem in decision theory, and there's no universally agreed-upon solution. After working through your cases, I think **bounded utility functions** combined with **epistemic constraints on probability estimation** can reconcile most of your intuitions. But it requires revising your view on (4), and there’s a genuine conflict between (4) and (5). Let’s break it down:

  ---

  ### **Core Principle: Bounded Utility with Practical Probability**
  1. **Utility is bounded**: There’s a maximum ("ceiling") to how much total value *anything* can provide (e.g., 10^100 utils).  
  2. **Probabilities below an epistemic threshold are treated as ~0**: If a probability is too small to be meaningfully distinguished from zero *given your evidence*, ignore the option.  

  This explains your intuitions:  
  - **Case 1, 2, 3, 6, 7**: Work with "normal" probabilities and stakes.  
  - **Case 4**: You *can’t* hold this strictly if utility is bounded. Saving 10^50 lives isn’t 10^47× better than saving 1,000—it’s impossible.  
  - **Case 5 (Pascal’s Mugger)**: Rejected because (a) utility is bounded, so 10^102 utils is impossible, and (b) probability is epistemically meaningless.  
  - **Case 8 (St. Petersburg)**: Rejected because unbounded payoffs are impossible, and probabilities become negligible.  

  ---

  ### **Why Your Cases Hang Together (Mostly)**
  | **Case** | **Your Verdict** | **Explanation** |
  |----------|------------------|----------------|
  | 1 (Work decisions) | ✅ EV reasoning | Normal stakes, tractable probabilities |
  | 2 (£500k vs £1M) | ✅ Take £500k | Diminishing marginal utility for money |
  | 3 (100 vs 200 lives) | ✅ Take 51% chance | Linear utility for lives *within feasible scales* |
  | 4 (10^50 lives) | ❌ Strict linearity | **Must go**—utility can’t scale infinitely |
  | 5 (Pascal’s Mugger) | ✅ Refuse | Probability untrustworthy + utility bounded |
  | 6 (Asteroids) | ✅ Invest | Probability meaningful (1e-5), stakes existential |
  | 7 (Voting) | ✅ Vote | Probability tiny but *evidence-based* (1e-7) |
  | 8 (St. Petersburg) | ✅ Pay ~£20 | Unbounded payoffs unrealistic |

  ---

  ### **The Asteroid vs. Mugger Divide: Epistemic Threshold**
  - **Asteroids (Case 6)**: Probability (~1e-5) is based on scientific evidence. It’s small but *measurable and repeatable*. Stakes are bounded (saving Earth).  
  - **Mugger (Case 5)**: Probability (1e-100) is arbitrary. No evidence, no verification mechanism. *You can’t distinguish it from 0*.  
  - **Voting (Case 7)**: Probability is tiny but grounded in election models/history. Stakes are bounded (policy impact).  

  **Key Insight**: It’s not about a fixed "probability floor" (e.g., 1e-6), but whether the probability is **actionably quantifiable** given your knowledge. Cosmic-scale claims fail this test.

  ---

  ### **The Cancer Cure Dilemma: £1 for 1-in-10-billion chance**
  - **Expected Value**: If utility is linear and unbounded, EV = (1e-11) × (utils of curing all cancer) → massive.  
  - **Bounded Utility Solution**: Curing all cancer has immense but *finite* value (e.g., saving ~10^11 lives + economic impact → maybe 10^20 utils max). EV ≈ (1e-11) × 10^20 = 10^9 utils. £1 for 1 billion utils? **Pay.**  
  - **Epistemic Solution**: Is the probability *verifiably* 1e-11? If truly physics-verified (e.g., quantum lottery), **paying is rational**. But in practice, such claims are never trustworthy—so refusal is defensible.  

  **Verdict**: If genuinely verified, **refusing *is* fanaticism-in-reverse**. But in reality, verification is impossible → refusal is wise.

  ---

  ### **What Must Give?**
  - **Case 4 (Infinite Scaling)**: You need to accept bounded utility. Each life matters equally, but there’s a finite number of lives in the universe. Saving 10^50 lives is impossible—physics caps the number of humans (or conscious beings) that can exist.  
  - **Tension with Case 5**: If you keep infinite scaling in (4), you *must* accept Pascal’s Mugger (5). Bounded utility resolves this.  

  ---

  ### **Practical Principles for Your Framework**
  1. **Use diminishing marginal utility for personal wealth**.  
  2. **Treat utility for lives as linear *within plausible scales*** (e.g., 1 to 10^12 lives).  
  3. **Discard probabilities you can’t meaningfully quantify** (e.g., based on armchair math without evidence).  
  4. **Cap total utility at a high but finite bound** (e.g., 10^100 utils).  

  This preserves 7/8 of your intuitions—only infinite scaling (4) is modified. It’s "monster-proof," handles asteroids/voting, and avoids St. Petersburg absurdity.  

  Would this work for your EA projects? I suspect it aligns with how you actually prioritize interventions (e.g., focus on tractable risks). For the cancer case: if verification exists, pay; else, walk away.
