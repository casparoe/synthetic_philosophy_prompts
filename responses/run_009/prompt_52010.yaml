answer: |-
  Sharp opener – but you're oversimplifying the utilitarian picture of deliberation. You're right that the dispositional move shines in the drowning spouse case: a well-trained utilitarian *character* acts spontaneously on deep commitments (like spousal love), knowing the theory licenses this *because* such dispositions maximize good consequences overall. Where you err is insisting Jim's case *must* involve explicit, occurrent utilitarian calculation. Why?

  Consider Jim: he *could* be someone who, through reflection and habituation, has cultivated a disposition for minimizing catastrophic harm, even when it demands terrible acts. Facing the captain, the occurrent thought might be visceral: "Shooting one is monstrous, but *not* shooting means twenty die – I *can't* let that happen." That impulse – rooted in a character shaped by utilitarian concern for preventing the greater horror – *is* the theory in action, not some detached sum. The "argument about totals" underpins *why* he has this disposition; it doesn't need recalculating in the moment. Utilitarianism doesn't demand he think "I maximize utility now"; it demands he *is* the sort of person who, confronting preventable massacre, acts to prevent it, even at horrific cost. His revulsion at shooting is real, but overridden by a deeper horror cultivated by his moral framework. The advice to Jim isn't "calculate utilities now," it's "be the person whose cultivated horror at mass death compels the lesser evil." Occurrent calculation *can* happen, especially in novel dilemmas, but the theory's power lies in shaping the agent's character and saliences long before the gun is in hand. Williams confuses the *foundation* of the motive (utility-maximizing character) with its *occurrent phenomenology* (which needn't reference utility). So I take neither horn: occurrent reasoning is sometimes a tool, but the core is character shaped by the criterion.

  *(I'm committed. Your move. How does this dispositional account of Jim avoid Williams's charge that utilitarianism alienates him from his own projects and feelings?)*
