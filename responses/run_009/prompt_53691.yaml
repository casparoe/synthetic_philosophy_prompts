answer: |-
  Here is a comprehensive set of desiderata for a theory of self-deception, derived from your specified cases and distinctions, with clear motivations and borderlines flagged:

  **Core Desiderata (What a Theory *Must* Deliver):**

  1.  **Simultaneous Belief/Disbelief (The Core Paradox):** The theory must accommodate a state where the subject *both* holds the unwelcome belief (P) *and* avoids fully acknowledging it or its implications, without resorting to simple ignorance or temporary forgetting.
      *   *Motivation:* The "knew all along" phenomenon & distinctive affective response (anger/embarrassment vs. "oops"). If the subject were *wholly* ignorant, exposure wouldn't provoke shame/defensiveness implying complicity. If they *fully* believed P all along, the avowal wouldn't make sense.

  2.  **Asymmetrical Processing (The Spouse/Friend Case):** The theory must explain how an individual can apply rigorously critical standards of evidence and reasoning to an *identical* situation involving a friend while systematically applying biased, charitable standards to the *same* situation involving themselves (or a close relation like a spouse).
      *   *Motivation:* Demonstrates the *motivated* nature of the avoidance/biased processing specifically tied to *self*-relevant, threatening information. It's not global stupidity or bias.

  3.  **Procedural Avoidance:** The theory must explain active, persistent behaviors aimed at *preventing* the acquisition or confrontation of evidence for the unwelcome belief (P).
      *   *Motivation:* Cases like avoiding test results, changing the subject, refusing to think about the topic. This goes beyond passive bias to active *management* of epistemic access.

  4.  **Persistence Despite Costs:** The theory must explain why the preferred (false) belief (not-P) persists, and avoidance behaviors continue, even as the *potential or actual costs* of being wrong about not-P escalate significantly.
      *   *Motivation:* Shows the defensive function outweighs instrumental rationality. Mere optimism would fade as risks mount; self-deception digs in.

  5.  **Affective Signature of Exposure:** The theory must explain the characteristic response to exposure: *anger* (often at the exposer), *embarrassment*, and *defensiveness*, rather than the simple surprise or regret ("oops") of discovering a plain mistake.
      *   *Motivation:* Suggests the subject feels *implicated* or *responsible* for the state of ignorance, hinting at an underlying awareness or effort that backfired.

  6.  **The "Knew All Along" Phenomenon:** The theory must account for retrospective avowals like "I knew it all along, really" or "Deep down I always knew".
      *   *Motivation:* Implies a simultaneous, latent awareness of P coexisting with the avowed belief not-P, reinforcing desideratum 1.

  **Essential Distinctions (What a Theory *Must NOT* Conflate):**

  7.  **vs. Wishful Thinking/Mere Optimism:** Must distinguish from cases where someone simply *hopes* for not-P, recognizes it might be unlikely, but doesn't actively *avoid* evidence for P or construct elaborate defenses against it. Wishful thinking lacks the defensive *tenacity*, *asymmetry*, and *procedural avoidance* of self-deception.
      *   *Motivation:* Wishful thinkers often concede evidence under pressure; self-deceivers double down. Avoiding test results isn't just hoping for the best.

  8.  **vs. Akrasia (Weakness of Will):** Must distinguish from cases where the subject consciously and avowedly *believes* P ("I know smoking kills me") but *acts* against that belief (continues smoking). Akrasia involves acting against a *conscious* belief; self-deception involves managing the *belief state itself*.
      *   *Motivation:* The akratic knows and lapses; the self-deceiver avoids knowing to avoid the conflict/lapse. The core is epistemic, not purely practical.

  9.  **vs. Cold Cognitive Bias:** Must distinguish from biases (e.g., confirmation bias, base-rate neglect) that operate even when nothing affectively significant is at stake for the believer. Self-deception involves *motivation* arising from the *threatening nature* of P to the self (esteem, desires, values).
      *   *Motivation:* The Spouse/Friend case shows bias is *selectively engaged* only when the self is threatened; cold bias would operate similarly regardless of stakes.

  10. **Belief vs. Attempted Belief-Management:** Must respect the difference between the *content* of the subject's dominant, guiding belief (typically not-P) and the *processes* (often sub-intentional) aimed at *sustaining* not-P and *suppressing* P. The subject believes not-P *while* engaging in activities that prevent P from becoming fully conscious or integrated.
      *   *Motivation:* The subject isn't usually *thinking* "I will now make myself believe not-P"; they are focused on justifying absences or avoiding tests, all the while *guided* by not-P.

  **Borderline Requirements (Stances Taken):**

  11. **False Belief? (Position: Not Necessary):** A theory need *not* require that the self-deceptive belief (not-P) is actually false. One *can* self-deceive into a true belief.
      *   *Rationale:* Consider someone terrified of a fatal illness they don't have. They avoid tests, interpret ambiguous symptoms catastrophically, and believe they are dying (not-P: "I am dying" - which is false). This seems paradigmatic self-deception. Now imagine they *do* have the fatal illness but lack symptoms. Driven by terror, they avoid tests and *falsely believe they are healthy* (not-P: "I am healthy" - which is false). Also self-deception. Finally, imagine they avoid tests due to terror and *falsely believe they are dying*, but unbeknownst to them, they *are* dying (not-P: "I am dying" - which is *true*). The *process* – motivated avoidance sustaining a preferred but anxiety-reducing belief despite evidence/risks – remains identical. The core is the *motivated epistemic mismanagement*, not the truth-value of the output. The anger/embarrassment upon discovering the truth (even if the belief was accidentally true) stems from recognition of this mismanagement.

  12. **Intentionality? (Position: Weak Intentionality Required):** The process must be *in some sense* intentional or goal-directed, but *not* consciously intended as self-deception. There must be a *motivation* (e.g., reduce anxiety, preserve self-esteem) driving the biased processing and avoidance. The mechanisms themselves (attention redirection, biased interpretation) may operate sub-personally, but they serve a goal of the agent.
      *   *Rationale:* Without goal-directedness, it collapses into cold cognitive bias (violating distinction 9). The Spouse/Friend asymmetry, procedural avoidance, and persistence despite costs all point to a *purpose* – managing psychic distress. However, explicit, conscious intention to deceive oneself is untenable (the "direct" paradox) and rarely observed.

  **The Central Tension: Intentionality vs. Ignorance:**
  *   **The Tension:** Requirement 12 (Weak Intentionality - goal-directed avoidance/suppression serving the agent's motives) seems to imply the agent must be *aware* of the threat (P) to be motivated to avoid it. But Requirement 1 (Ignorance/Non-Acknowledgement) requires the agent *not* be fully aware of P. How can they be motivated to avoid what they don't know threatens them?
  *   **Is it Real?** **Yes, the tension is real and deep.** It doesn't dissolve on inspection; it's the core paradox. Any viable theory *must* grapple with this. It typically requires positing some form of *partial* or *non-conscious* awareness. The subject must register P as threatening *enough* to trigger defensive maneuvers (intentionality), but these maneuvers *succeed* in preventing P from becoming fully integrated, conscious belief (ignorance). The "knew all along" phenomenon (6) and affective signature (5) attest to this partial registration.

  **The Toughest Requirement (Theory-Killer):**
  *   **Desideratum 1 (Simultaneous Belief/Disbelief)** does the most to knock out candidate theories. Accounts that reduce self-deception to mere error, temporary forgetting, or simple wishful thinking fail here. Accounts that posit fully disjoint sub-agents often struggle with the unity of the person and the phenomenology. Explaining *how* P can be both "known" (in some sense, guiding behavior like avoidance and causing shame) and "not known" (not guiding avowals or conscious deliberation) without contradiction is the fundamental challenge. The "knew all along" avowal is the smoking gun demanding an explanation of this duality.

  **Brief Theory Assessment Against Desiderata:**

  1.  **Deflationary (Mele - Motivated Bias):**
      *   *Core Idea:* Self-deception is a suite of ordinary, motivated cognitive biases (e.g., selective attention, evidence gathering, hypothesis testing, misinterpretation) triggered by a desire for a particular conclusion (not-P), operating without any paradoxical intention to deceive oneself or partitioning.
      *   *Scorecard:*
          *   **Strengths:** Handles Asymmetrical Processing (2), Procedural Avoidance (3 - as biased info-gathering), Persistence Despite Costs (4 - motivation persists), Distinction from Akrasia (8) & Cold Bias (9), Weak Intentionality (12 - goal-directed bias), Truth-Compatibility (11).
          *   **Weaknesses:** Struggles profoundly with **Simultaneous Belief/Disbelief (1)** & the "Knew All Along" Phenomenon (6). Tends to reduce these to post-hoc reconstructions or conflate with wishful thinking (7). The Affective Signature (5) is inadequately explained (why shame if it's just bias?). Struggles to explain the *intensity* and *specificity* of the avoidance compared to ordinary motivated reasoning.

  2.  **Partitioning (Davidson/Sartrean - Divided Mind):**
      *   *Core Idea:* The mind contains relatively autonomous subsystems. One subsystem acquires/believes P (the "unwelcome truth"), while another subsystem, motivated by desire or anxiety, actively prevents P from being acknowledged by the "main" conscious self, which believes not-P. Deception occurs *between* parts of the self.
      *   *Scorecard:*
          *   **Strengths:** Directly addresses **Simultaneous Belief/Disbelief (1)**, the "Knew All Along" Phenomenon (6 - the "other" part knew), Affective Signature (5 - exposure reveals internal betrayal), Asymmetrical Processing (2 - different subsystems engaged), Procedural Avoidance (3 - active suppression), Persistence (4 - subsystem defending itself), Distinction from Wishful Thinking (7) & Akrasia (8). Respects Belief vs. Attempted Management (10).
          *   **Weaknesses:** Metaphysically controversial (what *are* these subsystems/agencies?). Risks being ad hoc or overly homuncular. Can struggle with **Weak Intentionality (12)** - the deceiving subsystem's intentionality can seem too strong/conscious. Explaining the *origin* and *stability* of the partition is challenging. Distinction from Cold Bias (9) relies on the partition's *cause* being motivational. Truth-Compatibility (11) is possible but complex.

  **Conclusion on Coherence:** The desiderata, particularly the core paradox (1) fueled by the central tension (Intentionality vs. Ignorance) and manifested in the "knew all along" (6) and affective response (5), demonstrate why self-deception seems incoherent. *However*, the phenomena are robust and demand explanation. A successful theory must navigate these treacherous waters without dissolving the phenomenon (like deflationism risks doing) or resorting to overly extravagant metaphysics (like simple partitioning risks). Whether it *is* ultimately coherent depends on whether a theory can satisfy these desiderata – especially 1, 5, 6, and 12 – without contradiction. The partitioning approach, despite its costs, comes closest to capturing the full depth of the phenomenon as you've outlined it.
