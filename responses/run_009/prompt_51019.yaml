  First, the key episode is Daryl Bem's 2011 paper on precognition, which exposed flaws in psychological research methods. The subsequent replication failures, especially the 2015 Open Science Collaboration report, showed that many published results couldn't be replicated. The user wants to analyze a hypothetical mid-career researcher during 2012-2015 who has her own published results but faces higher-order evidence about the field's unreliable methods.

  The user has three main areas to address. First, mapping higher-order evidence in this context. They note that unlike standard cases where a specific instrument is faulty, here the entire research pipeline is questioned. The evidence is statistical and diffuse. I need to explain how higher-order evidence applies here, even though it's not about a single source. The aggregate data from replication studies and methodological critiques serve as higher-order evidence indicating systemic issues. The researcher must adjust her confidence in her own work, even without direct replications contradicting her specific findings.

  Second, epistemic akrasia. The researcher might simultaneously believe her study was well-run but that the results are probably false. The user asks if this is true akrasia or a coherent response. I should distinguish between akrasia as believing against one's better judgment versus rationally partitioned beliefs. The researcher's first-order assessment of her methods remains, but higher-order evidence leads her to doubt the results. That's not akratic if she integrates both levels properly. Akrasia would occur if she recognizes she should lower confidence but doesn't, or if she lowers it without justification. The literature focuses on cases where higher-order evidence mandates belief revision, so the rational response here isn't akratic.

  Third, the theory's limitations. The user points out that the crisis was collective, but the theory deals with individual credences. The theory doesn't address practical actions like retracting papers or changing peer review practices. This gap shows where the theory is silent. For the verdict, the crisis confirms that higher-order evidence can defeat beliefs without new first-order evidence, but it also highlights the theory's limitations regarding systemic issues and collective action. The anomaly reading might be strongest because researchers had to balance higher-order doubt with maintaining local practices to push for reform.

  I should ensure that each part addresses the user's mapping, akrasia, and theory evaluation. Emphasizing the statistical nature of the higher-order evidence and its systemic target is crucial. For akrasia, clarifying the distinction between partitioned beliefs and irrational conflict. The theory's silence on collective action needs highlighting. Finally, arguing for the anomaly verdict makes sense because the field's functionality relied on researchers holding seemingly conflicting beliefs while working on systemic fixes.
answer: |-
  Here's a systematic analysis of the replication crisis through the lens of higher-order evidence (HOE) and epistemic akrasia, structured around your core questions:

  **1. Mapping the Higher-Order Evidence (HOE):**
  *   **The HOE:** The HOE is *not* new data about the specific phenomena the researcher studied. It's the *aggregate statistical evidence* about the failure of standard psychological research practices to reliably produce true positive findings, demonstrated by:
      *   The Bem paper: The fact that standard methods/scrutiny could produce a result universally deemed impossible implies those methods lack sensitivity to truth (high false positive rate).
      *   The replication failures (individual & OSC report): The systematic inability to reproduce a large portion of "textbook" findings using similar methods demonstrates that the entire research pipeline (design, analysis, publication bias) generates unreliable results at a high rate. The OSC statistic (36% replication rate, effect size halved) quantifies this unreliability.
  *   **What it Rationally Requires:** This HOE rationally requires the researcher to significantly *downweight* her confidence in *all* of her own statistically significant findings produced using those standard methods, *even without any specific replication attempts of her own work*. The HOE functions as a *systemic undercutting defeater*. It attacks the warrant-generating capacity of the entire methodological process ("source") she relied upon.
  *   **Applicability of Standard Machinery:**
      *   **Diffuse Source:** Yes, the machinery *does* apply. While the literature often uses discrete sources (a scale, a witness), the core principle is about evidence concerning the *reliability of a belief-forming process*. A research methodology *is* a belief-forming process. The HOE indicts the *general reliability* of the process type "using standard JPSP-style experimental social psych methods circa 2010". Her specific studies are tokens of this type. The defeater applies to all beliefs formed via that process type absent specific overriding reasons for confidence in a particular token (e.g., a pre-registered, perfectly powered direct replication of *her specific finding* succeeded).
      *   **Statistical vs. Logical Defeater:** The statistical nature doesn't invalidate it. HOE often involves probabilistic assessments of reliability (e.g., "this instrument is accurate 95% of the time"). The OSC report provides a statistical estimate of the reliability of the *process*: only ~36% of findings produced by it are likely true positives. This rationally mandates a probabilistic downgrade in confidence for any specific output of the process. It's not a logical contradiction for her specific finding to be true, but the HOE makes it *much less probable* that any given finding (including hers) is a true positive.

  **2. Epistemic Akrasia: Coherence vs. Conflict**
  *   **The Statement:** "My study was carefully run and well-powered [by the standards of the time]" and "My published result is probably false." **This is *not* necessarily epistemic akrasia.** It can be a *coherent partitioning*:
      *   **First-Order Level:** She assesses the *internal* execution of her specific study: procedures followed, power calculation done correctly based on accepted norms, analysis standard. By the *local, first-order criteria she was trained to use*, the study *was* "carefully run and well-powered." This belief can remain intact.
      *   **Higher-Order Level:** The HOE reveals that the *global framework defining "carefully run and well-powered" was itself epistemically flawed.* Power calculations were often based on inflated effect sizes; "standard" analyses included undisclosed flexibility (p-hacking); "careful" peer review didn't catch these systemic issues. The HOE forces the judgment that, *despite* meeting the flawed local standards, the process was unreliable. Hence, "my result is probably false" is a rational higher-order assessment *about* the output of the first-order process.
  *   **Distinguishing Akrasia:**
      *   **Researcher A (Ought to Know Better, Doesn't Revise):** This researcher either dismisses the HOE ("Bem was an anomaly," "Replication is too hard," "My lab is different") or fails to grasp its systemic implications. They maintain high confidence in their specific findings. This is **dogmatism or negligence**, not necessarily akrasia. They haven't *judged* that they ought to revise; they deny the force of the HOE.
      *   **Researcher B (Judges Ought to Revise, Doesn't):** This researcher fully accepts the HOE's implication: "Given the replication crisis, my confidence in my past findings *should* be much lower." Yet, due to motivated reasoning (sunk cost, career investment, identity) or weakness of will, they *cannot bring themselves* to actually lower their credence. **This is epistemic akrasia.** They hold a belief (high confidence in their result) that they *themselves judge* they ought not to hold, given their total evidence (first-order + HOE).
  *   **What the Literature Focuses On:** The core HOE literature is primarily concerned with the normative force of HOE and the puzzle of whether and how it *should* change first-order beliefs (Researcher A's "ought"). The akrasia literature focuses on the specific conflict where an agent *acknowledges* this normative force but *fails to act* on it (Researcher B's situation). Your researcher's coherent partitioning falls *between* these – rationally revising first-order confidence *based* on HOE without internal conflict about the specific study's execution.

  **3. Running the Analysis in Both Directions: Theory's Silence and Verdict**

  *   **Where the Theory is Silent (Crisis as Collective Action Problem):**
      *   **Individual vs. Collective:** The theory excellently handles the *individual* epistemic response (credence revision). It is largely silent on the *collective, practical, and institutional* actions required: retracting papers (when? based on HOE alone?), managing co-author disagreements, evaluating students' theses built on flawed methods (how much doubt is sufficient to fail/fundamentally revise?), changing peer-review standards (what *are* the new standards?).
      *   **The "Real Epistemic Action":** You're right. The profound challenge wasn't just private doubt; it was navigating the social, institutional, and career consequences of that doubt. The theory doesn't prescribe how to weigh the *practical* cost of retraction against the *epistemic* demand for correction, or how to rebuild trust in a collective enterprise. It focuses on belief, not on the sociology of science or research ethics in transition.
      *   **Source Identification & Scoring:** While the theory *can* handle diffuse sources (as argued above), it struggles with the *dynamic* aspect. The HOE revealed the source (standard methods) was unreliable, but what *is* the reliable source to replace it? The theory assumes we can identify *a* reliable source. The crisis showed the field didn't *have* one yet; it was *discovering* new standards (pre-registration, larger samples, open data) *through* the failure. The theory doesn't model this process of source *rehabilitation* or *replacement* under uncertainty.

  *   **Verdict: What the Episode Shows About the Theory**
      The strongest reading is that the crisis is **an anomaly** relative to the standard assumptions of HOE literature, though it **confirms the core mechanism** in an extended way. Here's the argument:

  1.  **Confirmation of Core Mechanism (But Extended):** The episode powerfully demonstrates that HOE *can* rationally mandate significant downward revision of first-order confidence *without any new first-order evidence* contradicting the specific belief. The Bem paper and subsequent replications provided HOE about the process, not rebutting evidence about ESP or social priming, etc. This confirms the core thesis. However, it *extends* the application to a massively diffuse "source" (an entire field's methodological paradigm) and purely statistical/systemic defeaters.
  2.  **The Anomaly: Functionality Through Local "Akrasia":** The anomaly lies in the *pragmatic coherence* required for collective reform. A researcher rationally convinced by the HOE might need to *act* in ways that *seem* locally akratic to maintain the field's functionality long enough to fix it:
      *   **Reviewing/Teaching:** She might (provisionally) review papers or grade theses based on the *old, flawed standards* while internally doubting them and actively working to *change* those standards. Applying the *new* standards universally immediately might be practically impossible (no studies meet them yet) and paralyzing.
      *   **Maintaining Dialogue:** Expressing total doubt in *all* prior work could collapse productive discourse. Engaging with existing literature *as if* it were somewhat reliable (while knowing it probably isn't) might be necessary scaffolding to build the new paradigm.
      *   **"Akrasia" as Instrumental Rationality:** This isn't strictly epistemic akrasia (failing to believe what you judge you ought), but rather a *pragmatic* separation: *Judgment* ("The field's output is unreliable") guides *institutional reform efforts*, while *local practice* ("Apply current journal standards in this review") maintains functionality *during* the transition. The theory struggles to model this temporal and functional partitioning, which looks locally akratic but is globally rational for collective epistemic progress.
  3.  **Why Not Just an Unanticipated Case?** While the diffuse source was un*common* in the literature, the analysis shows the core machinery *can* be applied (HOE about process reliability mandates credence revision). The truly anomalous aspect is the *collective, transitional* state where rational individual belief revision coexists with the practical need to temporarily sustain the very system whose unreliability is the source of the HOE, in order to reform it. This dynamic, functional aspect is what the theory never anticipated.

  **Conclusion:** The replication crisis strongly **confirms the core power of higher-order evidence** to rationally defeat first-order beliefs without new first-order evidence, even when the source is diffuse and the defeater statistical. However, it reveals an **anomaly** in how rational epistemic agents navigating a systemic crisis must sometimes engage in practices that *appear* locally akratic or maintain functional reliance on the flawed system they are rationally undermining via HOE, precisely to enable the collective epistemic project to survive and reform. The theory illuminates the individual credence shift but falls silent on the messy collective action and institutional transition required to truly resolve the crisis revealed by the HOE. The record best supports the **anomaly** verdict.
