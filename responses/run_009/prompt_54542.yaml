prompt: |-
  Marcus and I just spent like three hours on this after dinner and I gave up and am now crowdsourcing. He has this whole set of opinions about when everyday conventions tip over into actual moral obligations — like, not "is it polite," is it *wrong* — and I want you to figure out the rule he's running, because I sure couldn't.

  His verdicts so far, in no perticular order:

  - tipping ~20% at a sit-down restaurant in the US: morally required, even though he hates the system and says so every single time he does it
  - the tip screen on the iPad at a coffee counter: no obligation, and he thinks being asked at all is kind of a shakedown
  - tipping in Japan: not just not required, actually a small insult
  - shoes on in a Japanese home: obviously wrong, no debate
  - jaywalking mid-block in a normal US suburb where everyone uses the crosswalks: wrong
  - jaywalking in Rome (or Hanoi, he cited both): totally fine, drivers there plan around it
  - cutting a formed line at a bus stop: wrong
  - not queuing at a packed bar where there's no line and locals just press up to the counter: fine
  - same US restaurant but the service was genuinely terrible: still leave something, never zero

  Two new cases we never resolved before I threw him out of my apartment. One: you're in one of those cities where waiting at the pedestrian red light is a local point of pride, and it's 3am on a completely empty street, no car for a mile in either direcion, and Marcus is standing there. Does he cross? My hunch is that at least two rules fit everything above — something like "it binds when somebody's counting on you" and something like "when you're the guest, you follow the local script, full stop" — and they give different answers here. But there's also maybe a third one he'd like: never be the *visible* person who breaks a norm, because every visible exception erodes it.

  Second: in a country where tipping isn't done and can cause an awkward refusal, a porter spends ten minutes doing way more than his job — hauling bags, explaining the neighborhood, drawing us a little map. Slipping him money goes against the local script; on the other hand he clearly wouldn't be offended, he'd just be pleased. Does Marcus tip, refuse to tip on principle, or do some third thing (and he is absolutely the type to have a view about whether cash vs. a small gift changes the answer)?

  So: which rules fit all his earlier calls, what does each one predict for the 3am light and the porter, give me your best guess with reasons for both, and then tell me what one further case would actually settle which rule he's on. And if you think his verdicts just aren't consistent with any single rule, say so — he'd be smug about it, but I'll take the win.
reasoning: |-
  Okay, let me try to figure out Marcus's moral rule based on his verdicts. He seems to have specific opinions about when conventions turn into moral obligations. First, I need to list out all his given verdicts and look for patterns.

  Starting with tipping:
  - 20% at a US sit-down restaurant: morally required, even if he dislikes the system.
  - Tip screen at coffee counter: no obligation, feels like a shakedown.
  - Tipping in Japan: not required, actually insulting.
  - Terrible service but still leaves something, never zero.

  Then, cultural norms:
  - Shoes in a Japanese home: obviously wrong.
  - Jaywalking in a US suburb: wrong.
  - Jaywalking in Rome/Hanoi: fine, drivers expect it.
  - Cutting a line at a bus stop: wrong.
  - No queue at a bar: fine.

  Now, the unresolved cases:
  1. Empty street at 3am in a city where waiting at red lights is a point of pride. Does he cross?
  2. In a no-tipping country, a porter goes above and beyond. Should he tip, refuse, or do something else?

  Possible rules that fit all previous verdicts:
  - **Local Script Adherence**: Follow local customs strictly when you're a guest. This explains tipping in the US vs. Japan, shoes in Japan, and jaywalking in different places. It would say no to crossing the light and no tipping the porter.
    
  - **Relational Harm/Obligation**: Moral when others rely on you or harm is caused. Tipping waitstaff who depend on tips, but not baristas where tips are extra. Jaywalking is wrong in the US if it endangers others or disrupts traffic, but fine in places where it's expected. For the light, crossing might be okay since no one is around, so no harm. For the porter, tipping might cause awkwardness but if it's appreciated, maybe okay? But Marcus might avoid it to respect the local norm.

  - **Norm Erosion Avoidance**: Avoid visibly breaking norms to prevent weakening them. So even at 3am, he wouldn't cross the light to avoid being seen breaking the norm, preserving the local pride. For the porter, he wouldn't tip to avoid undermining the no-tipping custom, even if the porter would accept it.

  But how do these rules apply to the unresolved cases?
  - **Local Script**: Cross when locals would. But since it's a point of pride, locals might wait even at 3am. So he shouldn't cross. Porter: No tip to respect local custom.
    
  - **Harm Principle**: No harm in crossing if the street is empty, so okay. Porter: Tipping might cause awkwardness (harm), but if the porter is happy, is it harmful? Wait, the refusal could be awkward, so maybe better not to tip. Or maybe a gift instead? The harm principle might allow a gift since it's not cash, avoiding awkwardness.

  - **Norm Erosion**: Not crossing the light to avoid setting a bad example. Porter: No tip to prevent eroding the no-tipping norm, even if the porter is okay with it.

  Looking for inconsistencies. The "never zero tip" in the US even with bad service fits both Local Script (US custom) and Harm (server relies on tips). The coffee counter tip isn't obligatory because it's not a sit-down where tips are expected, so maybe Harm principle: baristas don't rely on tips as much? Or Norm Erosion: not wanting to encourage the iPad tipping trend.

  For the porter case, Marcus might offer a small gift instead of cash to show appreciation without violating the no-tipping custom. That would align with Local Script if gifts are acceptable, or Harm if it avoids awkwardness. But in Japan, tipping is an insult, so maybe gifts are different? The original verdicts don't cover gifts, so it's ambiguous.

  A test case: Suppose in a no-tipping country, a server goes beyond duty, but you know they accept tips secretly. Does Marcus tip? If he follows Local Script strictly, no. If Harm, maybe yes if no one is harmed. Norm Erosion would say no to preserve the norm. This could distinguish the rules.
answer: |-
  Based on Marcus's verdicts, I identify three coherent rules that fit all his prior judgments. Each rule prioritizes a distinct moral principle: **Relational Harm/Obligation** (focused on tangible consequences to others), **Local Script Adherence** (focused on cultural context), and **Norm Erosion Avoidance** (focused on societal stability). The unresolved cases reveal where these rules conflict, and I propose a test case to distinguish them. While Marcus's views *are* internally consistent with each rule individually, his judgments aren't compatible with a *single* overarching rule—they can be explained by multiple frameworks. This suggests he might be blending principles contextually, but I'll break it down.

  ### The Three Rules That Fit Marcus's Verdicts
  Here's how each rule explains his existing positions:

  1. **Rule 1: Relational Harm/Obligation**  
     *Principle:* An act is morally wrong if it (a) causes direct harm, (b) violates a specific obligation to someone who is relying on you, or (c) exploits a system where others are vulnerable.  
     - **Fits all verdicts:**  
       - Tipping 20% at US restaurants: Required because servers rely on tips for income (vulnerability/obligation).  
       - iPad coffee tip: No obligation—no relational harm (baristas aren’t dependent; it’s a "shakedown" because it exploits guilt).  
       - Tipping in Japan: Insulting because it implies the worker needs charity (harm via disrespect).  
       - Shoes in Japanese home: Harm (cultural disrespect and hygiene violation).  
       - Jaywalking in US suburb: Wrong if others rely on crosswalks (disruption/harm to drivers/pedestrians).  
       - Jaywalking in Rome/Hanoi: Fine because drivers adapt (no harm; system accounts for it).  
       - Cutting a bus line: Harm (violates fairness to those waiting).  
       - No queue at bar: Fine—no one relies on a line (no harm).  
       - Terrible service but not zero tip: Server still relies on tips; zero would cause financial harm.

  2. **Rule 2: Local Script Adherence**  
     *Principle:* As a guest or participant in a context, you must follow the dominant local convention ("script") to avoid disrespect or chaos, regardless of personal feelings.  
     - **Fits all verdicts:**  
       - US tipping: Required—it’s the script. Hating it changes nothing.  
       - iPad coffee tip: No script (varies by cafe; not culturally embedded).  
       - Tipping in Japan: Insulting—it breaks the local script (tipping isn’t part of service culture).  
       - Shoes in Japanese home: Script demands removal (obvious disrespect otherwise).  
       - Jaywalking in US vs. Rome/Hanoi: Follows each place’s script (suburbs enforce crosswalks; Rome expects jaywalking).  
       - Cutting a bus line: Violates the script (queuing is the norm).  
       - No bar queue: Fine—script is chaos (locals press to counter).  
       - Terrible service but not zero: Script requires *something* to avoid breaching etiquette.

  3. **Rule 3: Norm Erosion Avoidance**  
     *Principle:* Never visibly break a norm if your action could weaken it for society, especially when the norm promotes order or prevents harm. Personal inconvenience is irrelevant.  
     - **Fits all verdicts:**  
       - US tipping: Required—not tipping erodes the system (encourages underpayment).  
       - iPad coffee tip: No obligation—tipping here isn’t a "real" norm; it’s a corporate ploy (no erosion risk).  
       - Tipping in Japan: Insulting—it erodes local dignity norms.  
       - Shoes in Japanese home: Erodes hygiene/respect norms.  
       - Jaywalking in US suburb: Wrong—mid-block crossing erodes pedestrian safety norms.  
       - Jaywalking in Rome/Hanoi: Fine—no erosion (it’s part of the norm).  
       - Cutting a bus line: Erodes fairness.  
       - No bar queue: Fine—no norm to erode (chaos is accepted).  
       - Terrible service but not zero: Zero tip could normalize stiffing workers, harming the system.

  ---

  ### Predictions for the Unresolved Cases
  Each rule yields different verdicts for the pedestrian light and porter scenarios. I’ll note Marcus’s likely reasoning and give a best guess based on patterns in his prior views (e.g., his emphasis on systems in tipping and jaywalking).

  #### Case 1: 3am Pedestrian Light in a "Pride" City
  - **Rule 1 (Harm/Obligation): Crosses.**  
    No harm—empty street, no reliance. Drivers don’t expect compliance at 3am. Marcus would cross, citing Rome/Hanoi precedent (contextual harm assessment).  
  - **Rule 2 (Local Script): Waits.**  
    The local script is "pride in waiting," so crossing breaks it. Marcus would stand there, muttering about respect.  
  - **Rule 3 (Norm Erosion): Waits.**  
    Crossing visibly (even if unseen) risks eroding the norm; someone *might* see, or it normalizes exceptions.  
  - **Best Guess for Marcus:** He **waits**, leaning toward Rule 3 (Norm Erosion). Why? His bus-line verdict shows he cares about order, and his "never zero tip" stance suggests system preservation trumps convenience. He’d argue: "If *I* cross, it makes it easier for the next person to cross when it’s *not* empty."

  #### Case 2: Porter in a No-Tipping Country
  - **Rule 1 (Harm/Obligation): Tips discreetly (cash or gift).**  
    The porter went "way beyond" (creating obligation), and refusing cash could cause awkwardness (harm). A small gift avoids direct offense while rewarding effort. Marcus might prefer cash (efficient) but accept a gift.  
  - **Rule 2 (Local Script): No tip, but thanks warmly.**  
    Tipping violates the script, so Marcus refuses on principle. He might write a review or compliment the manager instead.  
  - **Rule 3 (Norm Erosion): No tip, with a non-monetary gesture.**  
    Slipping money erodes the no-tipping norm, even if the porter is pleased. Marcus offers a sincere thank-you note or shares a small consumable (e.g., local chocolates)—something that shows appreciation without undermining customs.  
  - **Best Guess for Marcus:** He **gives a small gift (not cash)**, blending Rule 1 (obligation) and Rule 3 (erosion). Why? His Japan tipping verdict shows he fears cultural insult, but his "never zero for terrible service" shows he honors effort. A gift resolves this: it’s personal, avoids script-breaking, and rewards the porter. He’d argue cash is transactional and risks norm erosion, while a gift is "human-to-human."

  ---

  ### The Test Case to Settle Which Rule He’s On
  To pinpoint Marcus's primary rule, propose this scenario:  
  **"You’re in a country where bargaining at markets is the norm, but fixed-price stores exist. At a fixed-price store, you notice a clerk accidentally undercharges you by 50% for an item. Do you correct them?"**  

  - **Rule 1 (Harm/Obligation): Corrects the clerk.**  
    Not correcting exploits the clerk’s error (harm via unfair gain), especially if they might cover the loss.  
  - **Rule 2 (Local Script): Depends on the script.**  
    If fixed-price stores are "no bargaining" zones, correcting aligns with the script (honesty expected). If the culture is lax, silence might be fine.  
  - **Rule 3 (Norm Erosion): Corrects the clerk.**  
    Not correcting erodes pricing norms, encouraging distrust.  

  **Why this settles it:**  
  - Marcus’s jaywalking and queueing verdicts show he distinguishes between contexts with clear systems (like US crosswalks) and those without (chaotic bars). Here, a fixed-price store has a clear "system" akin to a bus line—failing to correct undermines it. If he corrects, Rules 1 or 3 dominate; if not, Rule 2 (if the script allows flexibility) might win. Given his emphasis on "counting on you" (e.g., tipping servers), I’d bet he **corrects the clerk**, favoring Rule 1 or 3.  

  ### Final Assessment
  Marcus’s verdicts **are consistent with multiple rules**, not one single rule. He likely uses **Relational Harm/Obligation** as a base but defaults to **Norm Erosion Avoidance** when systems are at stake (e.g., tipping, queues). The porter gift and 3am light waiting suggest erosion concerns often override convenience. Still, he’s pragmatic—his Rome jaywalking verdict shows he adapts when harm is absent.  

  If you want to "win," argue that his rules are situational: he switches between harm-avoidance and norm-preservation based on whether a system is fragile (like US tipping) or resilient (like Hanoi traffic). He’d be smug about the nuance, but you can counter that it’s not a "rule" at all—just a list of exceptions. For the test case, watch how he weighs the clerk’s vulnerability versus the store’s system.
