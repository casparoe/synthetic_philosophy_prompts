  I need to analyze this carefully. The disagreement seems to have three layers: first, whether outcomes affect blameworthiness; second, whether moral luck invalidates all blame; and third, whether character factors matter independently of outcome.

  For Elias's strongest argument: he's essentially making a "control principle" case - we can only blame what people control. Since outcomes were random, and even character traits depend on genes/upbringing (which nobody chooses), blame should be binary: either both are as bad as intentional criminals, or neither deserves blame.

  The user's strongest counter is that morality isn't just about choices but includes responsibility for consequences we risk. The drunk driver who hits someone demonstrates the danger in a way the "lucky" one doesn't. Also, character assessment considers patterns - what someone would do repeatedly, not just one act.

  A workable middle ground could be: blame attaches to controllable choices (like deciding to drive drunk), while punishment/practical consequences consider actual harm. We can judge both women equally for the decision, but institutions like the company reasonably consider outcomes when making decisions about responsibility and risk.

  For the office situation: the company's different treatment makes practical sense - one caused actual harm and liability - but it shouldn't imply moral superiority of the sister. Personally, the user might respect both equally as people while acknowledging the coworker has greater reparative duties.
answer: |-
  ### Short Answer
  Both women are equally blameworthy for making the reckless choice to drive drunk, as their identical decisions created the same unjustifiable risk. However, outcomes matter practically and emotionally: the coworker caused actual harm, triggering legal/social consequences, while the sister did not. Moral systems *can* acknowledge equal blameworthiness while treating actors differently due to outcomes—this isn't irrational, but pragmatic.

  ### Where You Two Actually Disagree
  You disagree on three interconnected points:  
  1. **Blame vs. Consequences**: Elias equates blameworthiness *entirely* with choice/knowledge, so identical choices mean identical blame. You think outcomes (like harming someone) affect the moral gravity of the act itself.  
  2. **Scope of "Luck"**: Elias argues that since *all* factors (character, upbringing) involve luck, blame must be all-or-nothing. You see choice as meaningfully distinct from uncontrollable factors, even if influenced by them.  
  3. **Purpose of Blame**: Elias views blame as purely about personal desert (what you "earn" via choice). You implicitly see it as also serving social functions (e.g., accountability for harm, deterrence).

  ### The Strongest Version of Elias's Side
  Moral responsibility requires control: we blame people only for what they *choose*, not for luck. Here, both women identically chose to drive drunk—a decision foreseeably risking harm. The cyclist’s timing was pure chance, so differing outcomes are irrelevant to blameworthiness. Pushing further, *why* they made that choice (genes, upbringing, peers) was also unchosen luck. Thus, blaming one more than the other is arbitrary. If we reject "outcome luck," we must also reject "constitutive luck" (luck in who you are). Consistency demands we either blame *all* reckless actors like intentional criminals (since choice is equally unfree) or absolve them all. Our current system is hypocritical.

  ### The Strongest Version of Your Side
  Blameworthiness isn't just about intent or choice—it includes the *actual moral wrong done*. Driving drunk is reckless, but *harming someone* transforms it into a concrete violation of another person's rights. The coworker didn’t just risk harm; she *caused* it, making her act objectively worse. Luck doesn’t erase this distinction: we blame negligent surgeons more if their patient dies, not because they "chose" the death, but because their duty was to prevent it. Outcomes reveal the full scope of the risk taken. Character *does* matter independently—the sister’s continued recklessness (even without harm) makes her less trustworthy—but harm compounds the moral failure by creating victims and duties of repair.

  ### A Workable Middle
  **Yes, a middle exists.** Track three elements distinctly:  
  - **Choice/Intent**: *Blameworthiness* hinges on controllable decisions. Both women are equally blameworthy for reckless endangerment.  
  - **Outcome**: *Consequences* (like harm caused) affect practical responses (legal liability, reparations) and emotional weight (guilt, victim trauma), but don’t increase *core* blameworthiness.  
  - **Character**: *Judgment of the person* considers patterns. The sister’s unchanged behavior post-event makes her character suspect; the coworker’s remorse (if any) or lesson-learning might mitigate hers.  

  Luck pervades life, but we *can* hold people accountable for choices within their sphere of influence (e.g., "I chose to drink and drive") without denying luck’s role in shaping them. Outcomes don’t dictate blame, but they trigger societal duties (e.g., compensating victims).

  ### What Follows for the Office
  The company was justified in firing the coworker: her actions caused direct harm, liability, and reputational damage. Promoting the sister isn’t hypocritical *if* her drunk driving was unknown; companies can’t punish undisclosed risks. However, if the company *knew* and ignored her recklessness, that’s negligent. Personally, you should judge both as flawed for making the same dangerous choice—but acknowledge the coworker bears unique burdens: guilt, legal consequences, and a duty to make amends. Different treatment isn’t unfair; it’s a response to different realities created by luck *after* their equal blameworthiness was established.

  ### Final Note
  Elias is wrong to dismiss outcomes entirely (they matter pragmatically and ethically), but you’re wrong to let outcomes inflate *core* blameworthiness. His "luck all the way down" point is insightful but overextends—it risks nihilism, denying agency where it exists.
