  Here’s a draft structured to meet your requirements – designed as a scaffold for adversarial collaboration, with zero textbook fluff and maximal operational clarity. I’ve flagged the likely verbal dispute and focused on testable cruxes.

  ---

  **Joint Statement: Folk Psychology & Eliminative Materialism – Core Agreements and Disputed Ground**  
  *(Drafted for E & R’s Adversarial Collaboration)*  

  ---

  ### I. Agreed Starting Points (Non-Trivial, Constraining Claims)  
  *Both parties endorse the following as accurate and substantive:*  

  1.  **Folk Psychology (FP) is the current, primary framework** for human social cognition, behavioral prediction/explanation, and introspection. Its core posits (beliefs, desires) are *deployed* ubiquitously in daily life and social science.  
  2.  **"Vindication" of FP requires:** Demonstrating that *referents* of core FP posits (beliefs, desires) exhibit sufficient structural/functional similarity to the posits *as scientifically regimented* to warrant retaining the core ontology *and* the core explanatory/predictive patterns of FP. (Analogy: Temperature vindicated via reduction to mean kinetic energy).  
  3.  **"Replacement" of FP requires:** (a) A *distinct* scientific framework (e.g., neuroscientific) achieving superior explanatory/predictive power over FP *for the same domain* (behavior, cognition); (b) Demonstrating that core FP posits *fail to refer* to natural kinds or causally efficacious states within the new framework; (c) The practical obsolescence of FP vocabulary *within the relevant scientific contexts* due to (a) and (b). (Analogy: Phlogiston replaced by oxidation).  
  4.  **Current Neuroscience Status:** No existing neuroscientific framework meets the criteria for either **vindication (2)** or **replacement (3)** of FP. Neuroscience lacks a *complete, validated* theory explaining the full range of phenomena FP handles (e.g., complex, context-sensitive propositional attitude ascription guiding behavior) *and* cannot yet systematically replicate FP's predictive success in novel, real-world social scenarios.  
  5.  **The core dispute is empirical & conceptual:** Whether future, mature cognitive neuroscience *will* meet the criteria for replacement (3), or whether it will instead vindicate (2) FP or some successor closely mapping onto FP's core ontology/patterns.

  ---

  ### II. Precise Statement of Key Disagreements  
  *(Each statement formulated to be acceptable to the named party as their own position)*  

  | Disagreement Area                | E's Position (Eliminativist-Leaning)                                                                                                                                 | R's Position (FP Defender-Leaning)                                                                                                                                                                | Likely Verbal Dispute? |
  | :------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ | :--------------------- |
  | **1. Fate of Belief/Desire Ontology** | "Mature cognitive neuroscience will **replace** folk psychology (per criteria 3). Beliefs and desires, *as currently understood and deployed in FP*, will be shown to be ontologically *incorrect* posits – akin to phlogiston – and will not feature in the successful future science of the mind." | "Mature cognitive neuroscience will either **vindicate** folk psychology (per criteria 2) or require only modest conceptual refinement of its core posits (beliefs, desires). FP's core ontology captures *something real and indispensable* about cognition, ensuring its retention or direct successor." | No                    |
  | **2. The "Self-Defeat" Objection** | "The claim 'There are no beliefs' **can be coherently stated** within the *replacement* framework. It does not require the speaker to *possess FP-style beliefs*. The objection relies on a *performative* trick using FP language *now* to argue against a future framework where 'belief' lacks its current meaning/referential success. It's a pragmatic, not logical, paradox." | "Eliminativism, *as stated using FP terms*, **is pragmatically self-undermining**. To *assert*, *argue for*, or *believe* eliminativism requires deploying the very concepts (belief, assertion) it seeks to eliminate. This reveals an essential reliance on FP for coherent cognition *about cognition*, even if neuroscience changes." | **YES** - The dispute hinges on whether the *current act of stating eliminativism* must be understood *within FP* (R) or can be understood as a statement *within the nascent replacement framework* (E). It's about the *status of the current discourse*, not the future science. |

  ---

  ### III. Cruxes: Core Disputes, Evidence, and Predictions  
  *(Crux, E's Position, R's Position, Shared Evidence Type, Explicit Predictions)*

  | Crux                                                                 | E's Position                                                                                                                                                               | R's Position                                                                                                                                                                           | Type of Evidence/Case Needed                                                                                             | E's Prediction                                                                                                                                 | R's Prediction                                                                                                                                                                    |
  | :------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------ | :--------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Crux 1: The Reduction Analogy (Temp vs. Phlogiston)**              | Belief is **like Phlogiston**. FP posits are fundamentally *misconceived*; their core explanatory roles (e.g., discrete, propositionally structured, causally interacting states) won't map cleanly onto neuro-computational mechanisms. | Belief is **like Temperature**. FP captures a real, coarse-grained pattern (intentional, rational causation) that will be *implemented* by neuro-computational states, preserving its core causal/explanatory role. | Discovery of neural mechanisms implementing *specific, complex FP explananda* (e.g., resolving contradictory beliefs, forming desires based on abstract principles). | Mapping FP states to neural states will be **messy, partial, and non-systematic**, revealing FP's structure as a poor fit. The *term/concept* 'belief' won't survive scientific refinement. | Mapping FP states to neural states, though complex, will reveal **systematic, functionally isomorphic patterns** justifying refined retention of 'belief' (or direct successor term). |
  | **Crux 2: Predictive Processing & Computational Levels**             | PP models represent the **start of replacement**. "Bayesian belief" is a formal tool, not FP belief. It lacks propositional content, holism, & rationality constraints. FP talk won't recover from the underlying non-sentential machinery. | PP models are **partial vindication**. Bayesian updating *is* a formalized, probabilistic version of belief revision. The computational level *just is* where "belief" resurfaces as a real pattern. | Analysis of how PP-based systems explain phenomena *crucially reliant on FP structure* (e.g., nested belief attributions, non-monotonic reasoning, content-specificity). | Explanations using PP will **increasingly bypass FP vocabulary & structure** even for complex cognition. Success will correlate with *dropping* FP-like descriptions. | Explanations using PP for complex cognition will **necessarily invoke patterns isomorphic to FP belief/desire ascription** at the computational/algorithmic level. FP structure will be recoverable. |
  | **Crux 3: Instrumentalism (Dennett) as Win/Loss**                    | Instrumentalism (**"Beliefs are useful fictions"**) is **half a win for E**. It concedes FP posits aren't *literally* real, causally potent neural states. It's a pragmatic *replacement* strategy *within* FP's domain, not vindication. | Instrumentalism (**"Beliefs track real patterns"**) is a **win for R**. It shows FP posits capture objective, causally relevant structures in the world (behavior), even if they're multiply realizable. "Real patterns" *are* real enough. | Cases where instrumentalist FP succeeds *precisely because* it identifies patterns that *cannot* be captured by non-intentional, non-rationalizing descriptions *at any useful level of analysis*. | Future science will provide **equally predictive, non-intentional descriptions** of these patterns, making the instrumentalist FP level *optional and ultimately discardable*. | Future science will show **instrumentalist FP descriptions are ineliminable for capturing the patterns efficiently/accurately**, confirming their status as objectively real patterns *sui generis*. |

  ---

  ### Key Notes for Your Use

  1.  **Self-Defeat is (Likely) Verbal:** The table flags it. Push them to agree the *future scientific claim* isn't logically self-defeating, and the *current pragmatic paradox* doesn't determine the future framework's coherence. This might defuse a lot of heat.
  2.  **Crux Predictions are Testable:** The "Predictions" column forces E & R to commit to what future science would show *if they are right*. This is the core of adversarial collab – making disagreements empirically tractable over time.
  3.  **Hunches Addressed:**
      *   **Crux 1:** Your hunch is right – E uses Phlogiston/Temp as rhetoric *and* substantive analogy. The table forces focus on the *structural mapping* prediction. Is FP's structure salvageable?
      *   **Crux 2:** PP is a perfect battleground. E sees syntax replacing semantics; R sees semantics implemented syntactically. The prediction hinges on whether complex FP *structure* emerges in PP explanations.
      *   **Crux 3:** You nailed the ambiguity. E sees concession, R sees victory. The prediction forces them to specify what "useful level" means and whether non-intentional equivalents *can* exist.
  4.  **Avoiding Textbook Tone:** Focused on *their specific dispute* (Phlogiston/Temp analogy, PP, instrumentalism), uses their language ("doomed," "absurd," "literally cannot get through a day"), states positions starkly, emphasizes predictions/evidence. No literature review, just the operational core.
  5.  **Next Steps:** Give this to E & R separately first. Ask: "Does this capture your view fairly in each section? Where exactly does it misstate your position or prediction? What *specific* wording changes are needed?" Then merge feedback. The goal is their *endorsement* of the document as the agreed framework for debate/collab.

  Good luck mediating the eliminativist wars – this is PhD bootcamp at its finest. Use this structure to force clarity and future-oriented predictions.
