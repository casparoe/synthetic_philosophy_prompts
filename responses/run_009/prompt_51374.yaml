prompt: |-
  I help run a small student group that raises money for charity, and every year we have the same argument about where to send it. One faction wants to just follow the big online charity evaluators — the kind that rank organizations by roughly "cost per life saved": they only count interventions where a randomized trial has actually measured deaths averted, divide money spent by lives saved, and sometimes weight lives saved by the age of the person saved. The other faction says the whole ranking is rigged from the start: anything whose effects show up slowly or diffusely — advocacy for policy change, labor organizing, strengthening institutions in a poor country — can never win, not because it does less good but because nobody can run a clean trial on it. So the ranking quietly becomes "best among the measurable," and the measurables happen to be bednets and vitamin supplements and deworming pills.

  I don't want you to referee which faction is right about where the money should go. What I keep wondering about is what the practice itself presupposes. What view of "doing good" does a ranking like that have to assume for it to make sense — does it strictly presuppose a welfarist consequentialism where the good is just measured health and lives, or is it actually compatible with several moral theories (deontology with a duty of rescue, even some virtue-ethical view about what a donor should attend to) and just fits some of them more comfortably? And separately: does the practice presuppose that unmeasurable effects are worth less, or only that we should act under uncertainty in some principled way? If it's the latter, is there a defensible middle path — like assigning credences to unmeasured-but-plausibly-large effects — that wouldn't just collapse the whole enterprise, or does any attempt to factor in systemic change defeat the purpose of having a clean ranking in the first place?

  There's also a tension I can't decide whether to be bothered by. The same people who build these rankings will often say, in the same breath, that systemic change probably dwarfs everything else in the long run. Is that flat-out incoherence, or is there some coherent epistemic stance under which you can sincerely believe the biggest effects are elsewhere and still insist on ranking only by what you can measure — some principle about demanding evidence before acting, or about not letting enthusiasm masquerade as knowledge? I'd honestly take either answer, I just want to know whether the position is internally consistent or whether one of the two claims has to go.
reasoning: |-
  Okay, the user runs a student charity group and they're stuck in an annual debate about where to send their funds. One side wants to follow big charity evaluators that use metrics like "cost per life saved," focusing on measurable interventions like bednets or deworming. The other side argues this approach is biased against systemic changes like advocacy or policy work, which are harder to measure but might be more impactful long-term.

  The user isn't asking me to pick a side. Instead, they're digging into the philosophical underpinnings of the measurable-effectiveness approach. They want to know what moral assumptions are baked into that ranking system. Does it require strict welfarist consequentialism, or can it fit with other ethical frameworks? And how does it handle unmeasurable effects—does it inherently devalue them, or is there a principled way to account for uncertainty?

  There's also a tension they've noticed: proponents of this approach often acknowledge that systemic change might be more important in the long run, yet they stick to measuring only direct, quantifiable outcomes. The user wonders if this is inconsistent or if there's a coherent rationale behind it.

  I need to unpack the moral presuppositions first. The "cost per life saved" model does seem rooted in welfarist consequentialism—maximizing welfare (health, lives) per dollar. But it could stretch to fit deontology if framed as a duty to rescue the most immediate harms efficiently. Virtue ethics might be a harder fit unless virtues like effectiveness or stewardship are emphasized. However, the model's narrow focus on measurable health outcomes inherently sidelines virtues like justice or solidarity, which are central to systemic work.

  On unmeasurable effects: the approach doesn't necessarily claim they're less valuable; it's more about evidential rigor. It assumes that without clear evidence, we risk wasting resources. But that raises questions about uncertainty—couldn't we assign probabilities to unmeasurable impacts? The challenge is avoiding arbitrary guesses that undermine the whole ranking system. Some evaluators do try this (e.g., GiveWell's room for more funding), but it's contentious.

  The tension between "systemic change matters most" and "only rank the measurable" isn't necessarily incoherent. It could stem from epistemic humility: we can't quantify systemic effects well, so we focus where we can be confident. Or a division of labor: let others fund systemic work while we handle proven interventions. But this might feel like passing the buck, especially since systemic work often lacks dedicated funding. The position is logically consistent but practically shaky if the same people prioritizing measurable impacts also believe systemic change is more urgent.

  The user's deeper need seems to be finding a principled way to resolve their group's deadlock without dismissing either side. They might want frameworks to evaluate both approaches fairly or strategies to allocate funds across both. Underlying this is a desire for coherence in their charitable philosophy—how to balance evidence with values, immediacy with transformation.
answer: |-
  That's an exceptionally sharp framing of the underlying tensions – you've pinpointed the core philosophical and practical dilemmas plaguing effective altruism (EA) and charity evaluation. Let's break down your questions systematically:

  **I. Moral Presuppositions of the "Cost per Life Saved" Ranking:**

  1.  **Core Commitment:** The model fundamentally presupposes **Consequentialism**. The ultimate good is defined by *outcomes* (lives saved, health improved, welfare increased), and the right action maximizes that good per unit resource.
  2.  **Specific Flavor:** It leans heavily towards **Welfarist Consequentialism**. The "good" is primarily defined as improvements in individual well-being, often measured through health metrics (life-years saved, DALYs averted) or simple survival.
  3.  **Narrow Scope:** Crucially, it presupposes **Atomism and Measurability**. The relevant consequences must be:
      *   *Attributable:* Directly causally linked to the specific intervention.
      *   *Quantifiable:* Amenable to numerical measurement (e.g., deaths prevented, cases treated).
      *   *Comparable:* Convertible into a common unit (e.g., dollars per DALY averted).
  4.  **Compatibility with Other Theories?**
      *   **Deontology (Duty of Rescue):** Can be compatible *if* the duty is interpreted as "rescue as many identifiable individuals facing imminent harm as possible, efficiently." The ranking provides a tool for fulfilling that duty maximally. However, it conflicts with deontological duties focused on *how* help is given (e.g., respecting autonomy, avoiding instrumentalization) or duties to address systemic injustice *itself*, regardless of immediate, countable lives saved.
      *   **Virtue Ethics:** Compatibility is strained. A virtue ethicist might value the virtues of *effectiveness* or *stewardship* (using resources well), which the ranking supports. However, virtues like *justice*, *solidarity*, *compassion* (beyond immediate suffering), or *empowerment* might demand supporting systemic change even if its impact is harder to measure per dollar *now*. The ranking's narrow focus struggles to capture these broader virtues.
      *   **Conclusion:** While elements can be *integrated* (e.g., a consequentialist might still value justice, a deontologist might value efficiency), the ranking model itself **fits most comfortably and directly within a narrow welfarist consequentialist framework**. It struggles to fully incorporate the core priorities of other major ethical theories without significant modification or dilution.

  **II. Unmeasurable Effects: Worth Less or Uncertainty Management?**

  1.  **Presupposition:** The practice **does not strictly presuppose that unmeasurable effects are intrinsically worth less.** Its core claim is **epistemic**, not axiological: *"We cannot reliably quantify or compare the impact of interventions with diffuse, long-term, or systemic effects with sufficient confidence to include them meaningfully in this specific cost-effectiveness ranking."*
  2.  **Acting Under Uncertainty:** It embodies a specific, strict principle for action under uncertainty: **The Precautionary Principle Against Wishful Thinking.**
      *   The argument is: Without strong evidence, we risk allocating vast resources based on *hopes* or *plausible stories* rather than demonstrated impact. This could lead to wasting resources on ineffective systemic efforts, costing lives that *could* have been saved by proven interventions.
      *   It prioritizes avoiding false positives (funding ineffective things) over false negatives (failing to fund potentially highly effective but unproven things).
  3.  **The Middle Path (Assigning Credences): Feasible but Fraught**
      *   **Attempts Exist:** Some evaluators (like GiveWell) *do* try this to a limited extent. They have a category like "room for more funding" or discuss "potential for leverage/systemic change," sometimes assigning rough qualitative probabilities or ranges. Organizations focusing on policy/advocacy (e.g., Founders Pledge) *must* do this.
      *   **Challenges:**
          *   **Subjectivity:** Assigning credible probabilities to long-term, complex systemic effects is incredibly difficult and prone to bias, optimism, and anchoring.
          *   **Collapsing Comparability:** How do you compare a 10% chance of a massive systemic change worth X million DALYs in 20 years with saving 100 lives for sure next year? The common unit (DALY/$) becomes extremely speculative.
          *   **Diluting Rigor:** Critics argue this injects "hand-waving" into a model built on evidential rigor, potentially undermining its core comparative advantage and opening the door to less rigorous claims.
          *   **Does it Defeat the Purpose?** It doesn't *necessarily* defeat the purpose, but it fundamentally *changes* it. The ranking moves from "demonstrated cost-effectiveness" to "estimated expected value under significant uncertainty." This is a different (and inherently messier) kind of ranking. It *can* be done defensibly, but it requires different methodologies and much greater transparency about uncertainty, and it will never achieve the apparent precision of the "bednets vs. deworming" comparisons.

  **III. The Tension: "Systemic Change Matters Most" vs. "Only Rank the Measurable"**

  This is the crux. Is it incoherent? Not necessarily, but it requires a specific, nuanced (and potentially unstable) epistemic and strategic stance.

  1.  **Coherent Epistemic Stances:**
      *   **Epistemic Humility / Evidential Threshold:** "While we *suspect* systemic change is most important long-term, we currently lack the robust, causal evidence meeting our high threshold for confident action and comparison. We prioritize acting on what we *know* works demonstrably well now." This emphasizes the distinction between *belief* and *actionable knowledge*.
      *   **Comparative Advantage / Division of Labor:** "Our specific expertise/methodology is best suited to identifying and evaluating highly measurable, direct interventions. Others (governments, large foundations, policy experts) may be better positioned to tackle systemic change, even if we believe it's crucial. We focus where we can add the most *marginal* value with high confidence." This is a strategic argument about specialization.
      *   **Time Discounting / Urgency:** "The immediate, preventable deaths happening *right now* demand urgent, proven solutions. While systemic change is vital for the future, we have a moral obligation to save identifiable lives today with proven tools." This prioritizes present suffering over future, albeit potentially larger, benefits (a contentious position itself).
      *   **Risk Aversion (Resource Misallocation):** "The risk of pouring vast resources into ineffective systemic efforts is high and carries a massive opportunity cost in terms of lives not saved *now* by proven means. We avoid that risk by sticking to proven interventions."

  2.  **Where the Tension Becomes Problematic (or Incoherent):**
      *   **If Systemic Change is Truly Dwarfs Everything Else *and* is Neglected:** If proponents believe systemic change is orders of magnitude more important *and* that current funding for proven direct interventions is already adequate (or that shifting funds wouldn't harm them), *and* that systemic efforts are critically underfunded, then *not* prioritizing finding ways to fund effective systemic change *does* become incoherent or morally negligent *from their own stated beliefs*.
      *   **Downplaying Plausible Pathways:** If the stance dismisses *all* attempts to model or assign credence to systemic effects as inherently worthless or impossible, while simultaneously asserting their supreme importance, it risks self-contradiction or intellectual laziness. It needs to justify *why* no plausible assessment is possible.
      *   **Ignoring Feedback Loops:** Neglecting systemic factors can sometimes undermine direct interventions (e.g., bednet distribution without addressing healthcare system collapse or governance issues). Ignoring this interaction can be shortsighted.

  **Conclusion on the Tension:** The position **can be internally consistent** under stances emphasizing epistemic humility, high evidential thresholds for action, comparative advantage, or strong risk aversion regarding resource misallocation. **However, it becomes strained or potentially incoherent** if:
  1.  Systemic change is asserted as *overwhelmingly* dominant *and* tractable *and* neglected.
  2.  No serious effort is made to *develop better methodologies* for assessing systemic change (beyond just saying it's hard).
  3.  The potential negative long-term consequences of *only* focusing on direct interventions (e.g., dependency, undermining systems) are ignored.
  4.  The stance implies unmeasurable effects are *intrinsically* less valuable rather than just harder to quantify.

  **Your Path Forward:** Recognizing these philosophical underpinnings and tensions doesn't resolve the argument, but it allows you to frame it more productively. Key questions for your group become:
  *   **Moral Priorities:** What *kind* of "good" matters most to us? Saving lives now? Building resilience? Fighting injustice? Empowering communities? (This speaks to the moral theory compatibility).
  *   **Risk Tolerance:** How comfortable are we funding interventions based on strong evidence of direct impact vs. plausible theories of large, diffuse, long-term impact? (This speaks to the uncertainty management).
  *   **Epistemic Standards:** What level of evidence do we require to act? Is "best guess under uncertainty" ever sufficient? (This speaks to the tension).
  *   **Strategy:** Could we allocate funds *across* categories (e.g., 70% to "proven direct," 30% to "high-potential systemic") to honor both concerns? Could we support organizations specifically working to *build evidence* for systemic interventions?

  The clean ranking serves a valuable purpose for a specific, narrow definition of impact under high certainty. The challenge is acknowledging its limits without abandoning the crucial demand for evidence and effectiveness when tackling the messier, potentially more transformative work.
