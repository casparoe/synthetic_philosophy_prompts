  So:

  P(we have smaller | X=2^n) = [ (1/6)*(2/3)^n ] / [ (5/12) * (2/3)^n ] = (1/6) / (5/12) = (1/6)*(12/5) = 2/5.

  Similarly, P(we have larger | X=2^n) = 1 - 2/5 = 3/5.

  Now, the expected gain from switching given X=2^n:

  If we have the smaller (prob 2/5), then by switching we get 2*X = 2^{n+1}, so the gain is 2^{n+1} - 2^n = 2^n (2-1) = 2^n.

  If we have the larger (prob 3/5), then by switching we get X/2 = 2^{n-1}, so the gain is 2^{n-1} - 2^n = 2^{n-1} (1-2) = -2^{n-1}.

  Therefore:

  E[gain | X=2^n] = (2/5)*2^n + (3/5)*(-2^{n-1}) 
                   = (2/5)*2^n - (3/5)*2^{n-1}
                   = (2/5)*2^n - (3/5)*(2^n / 2)
                   = (2/5)*2^n - (3/10)*2^n
                   = 2^n [ 2/5 - 3/10 ]
                   = 2^n [ 4/10 - 3/10 ]
                   = 2^n (1/10) = 2^n / 10 > 0.

  So indeed, for every n (including n=0, which we must check separately), the conditional expected gain is positive.

  For n=0: X=2^0=1.

  P(we have smaller | X=1) = 1 (since the only possibility is that we have the smaller envelope, because if we had the larger, then the smaller would be 0.5, which is not in the support). So:

  E[gain | X=1] = if we have the smaller, then switching gets 2, so gain=2-1=1.

  But by the formula: 2^0/10 = 1/10? That doesn't match. So let's compute for n=0.

  We have already: P(we have smaller | X=1) = 1, so the expected gain is +1 (since we have the smaller and switching gives +1). But our formula for n>=1 does not hold for n=0.

  However, note that for n=0, the event that we have the larger envelope is impossible. Therefore:

  E[gain | X=1] = 1 * (gain when we have the smaller) = 1 * (2-1) = 1.

  But 1 = 10/10, not 1/10. So the formula E[gain | X=2^n] = 2^n/10 only holds for n>=1. For n=0, it is 1.

  But 1 = 2^0? So we can write for n>=0: E[gain | X=2^n] = 2^n / 10? For n=0: 2^0/10 = 1/10 ≠ 1. So it doesn't hold. Alternatively, note that for n=0, we have:

  E[gain | X=1] = 1.

  But we can compute the conditional probabilities for n=0:

  P(X=1) = P(we have the smaller and S=1) = (1/2)*P(S=1) = (1/2)*(1/3) = 1/6.

  Then E[gain | X=1] = 1 (as above).

  For n>=1, we have E[gain | X=2^n] = 2^n/10.

  But note: 2^n/10 for n>=1 is positive, and for n=0 it is 1 (which is also positive). So in every case, the conditional expected gain is positive.

  Therefore, after opening the envelope, whatever amount we see, the expected gain from switching is positive. So we should switch.

  Now, the colleague argues: if I would switch whatever I saw, then I should switch before opening, because looking is free and the decision wouldn't change. But before opening, the situation is symmetric, so the expected gain should be zero.

  What breaks?

  The issue is that the unconditional expected gain from switching is:

  E[gain] = E[ E[gain|X] ] = E[ something positive ]

  But what is E[gain|X]? It is a random variable that is always positive. However, we must compute the expectation over X.

  But note: we have shown that for each possible value of X, E[gain|X] > 0. But the problem is that the expectation of E[gain|X] is the unconditional expectation E[gain]. And we know by symmetry that E[gain] must be zero. So we have a contradiction? But we also have:

