  = (1/6) [ (2/3)^n + (2/3)^{n-1} ]
  = (1/6) * (2/3)^{n-1} [ (2/3) + 1 ]
  = (1/6) * (2/3)^{n-1} * (5/3)
  = (5/18) * (2/3)^{n-1}

