  2^{2n-1} / 3^{n-1} = 2^{2n-1} * 3^{1-n} = (1/2) * (4^n) * (3) / (3^n) = (3/2) * (4/3)^n

  So:

  sum_{n=1}^∞ 2^{2n-1}/3^{n-1} = (3/2) * sum_{n=1}^∞ (4/3)^n

  But the series sum_{n=1}^∞ (4/3)^n diverges because 4/3 > 1.

  Therefore, the sum diverges to infinity. So the expectation E[gain] is:

  (1/6) + (1/36) * [divergent series] = +∞.

  But wait: we also know that E[gain] = E[Y-X] = E[Y] - E[X]. And by symmetry, E[X] = E[Y]. But if E[X] = E[Y] = ∞, then E[Y]-E[X] is undefined (or indeterminate: ∞-∞).

  So what is E[X]? The expected amount in the envelope.

  X can be 2^n for n>=0.

  P(X=2^n) = 
    for n=0: 1/6
    for n>=1: (5/18) * (2/3)^{n-1}

  So E[X] = 1 * (1/6) + sum_{n=1}^∞ 2^n * (5/18) * (2/3)^{n-1}

  = 1/6 + (5/18) * sum_{n=1}^∞ 2^n * (2/3)^{n-1}

  But we just saw that the sum diverges (because 2^n * (2/3)^{n-1} = (3/2)*(4/3)^n, and (4/3)>1). So E[X] = ∞.

  Similarly, E[Y] = ∞.

  Therefore, the unconditional expected gain from switching is E[Y-X] = ∞ - ∞, which is undefined.

  Hence, we cannot say that the unconditional expected gain is positive. It is undefined.

  So the passage from "for every observed value, switching has positive conditional expected gain" to "switching has positive unconditional expected gain" fails because the unconditional expectation does not exist (it is infinite). The principle that we can pass from "for every possible observation, the conditional expectation is positive" to "the unconditional expectation is positive" requires that the unconditional expectation exists and is finite. Otherwise, we cannot apply the law of total expectation.

  In this case, the law of total expectation still holds in the form:

  E[gain] = E[ E[gain | X] ]

  but only if the expectations exist. Here, E[gain | X] is well-defined and positive for each X, but E[ |gain| ] is infinite (because the positive part is infinite) so we cannot assign a finite value to E[gain]. Therefore, the unconditional expected gain is not defined, and we cannot conclude that it is positive.

  Moreover, the symmetry argument: by symmetry, the distribution of (X,Y) is the same as (Y,X), so the distribution of Y-X is symmetric about 0. Therefore, if the expectation exists, it must be zero. But if the expectation does not exist (as here), then it can be that the conditional expectations are positive, but the unconditional does not exist.

  Therefore, the colleague's argument that we should switch before opening fails because the unconditional expected gain is undefined. We are not justified in saying it is positive.

  Now, what about the argument "if I would switch whatever I saw, then I should switch before opening"? This is a dominance-like argument. But it assumes that the decision is stable under any observation. However, in this case, the decision is based on expected utility, but the overall expectation is undefined. So the principle "if conditionally on every possible event in a partition, an action is preferred, then it is unconditionally preferred" requires that the unconditional preference is well-defined. In standard decision theory, if the unconditional expectation does not exist, we cannot make the unconditional choice on the basis of expected utility. We might have to use a different criterion.

  Moreover, note that if we switch, we get the other envelope. Then we can apply the same argument again? But the situation is symmetric. So we are led to an infinite regress. But without a defined expected gain, we cannot justify switching.

  ## Part 3: Pricing the Alternatives

  The colleague's opponent might be prepared to surrender:

  1. The claim that positive expected gain conditional on each observation settles the matter unconditionally.
  2. The permissibility of unbounded payoffs in decision theory.
  3. The dominance reasoning: "you'd switch whatever you saw, so switch now".

  What does each surrender cost?

  1. Surrendering the principle that positive conditional expected gain for every event in a partition implies positive unconditional expected gain: This principle is a consequence of the law of total expectation when the expectation is finite. In cases with finite support, it holds. But we see that with infinite expectations, it fails. The cost is that in decision problems with unbounded payoffs, we have to be cautious and cannot always rely on conditional expectations to determine unconditional preferences. This is a known issue (like in the St. Petersburg paradox). We then might need to use a utility function with bounded utility (to force finite expectations) or use a different decision criterion (like minimax, but that might be too conservative).

