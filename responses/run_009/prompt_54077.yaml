  P(we have smaller | X=2^n) = P(we have smaller and X=2^n) / P(X=2^n)

  For n>=1:

  Numerator = (1/2)*(1/3)*(2/3)^n = (1/6)*(2/3)^n

  Denominator = (5/18)*(2/3)^{n-1} = (5/18)*(3/2)*(2/3)^n = (5/18)*(3/2)*(2/3)^n = (5/12)*(2/3)^n   [Wait, let me compute: (2/3)^{n-1} = (2/3)^n * (3/2), so (5/18) * (3/2) * (2/3)^n = (5/18)*(3/2)*(2/3)^n = (5*3*2) / (18*2) * (2/3)^n? Better:

