  E[gain] = [1 * (1/6)] + sum_{n=1}^∞ [ (2^n / 10) * (5/18) * (2/3)^{n-1} ]

  Simplify the sum:

  = (1/6) + (5/18) * (1/10) * sum_{n=1}^∞ 2^n * (2/3)^{n-1}

  = (1/6) + (5/(180)) * sum_{n=1}^∞ 2^n * (2/3)^{n-1}

  = (1/6) + (1/36) * sum_{n=1}^∞ 2^n * (2/3)^{n-1}

  Now, let r = 2 * (2/3) = 4/3? But note:

  2^n * (2/3)^{n-1} = 2^n * (2^{n-1} / 3^{n-1}) = 2^{2n-1} / 3^{n-1}   [Wait, no: (2/3)^{n-1} = 2^{n-1} / 3^{n-1}]

  So 2^n * 2^{n-1} / 3^{n-1} = 2^{2n-1} / 3^{n-1} = 2 * (4/3)^n / (2 * 3^{-1})? Let me write:

  2^n * (2/3)^{n-1} = 2^n * 2^{n-1} / 3^{n-1} = 2^{2n-1} / 3^{n-1} = (1/2) * (4/3)^n * 3   [because 2^{2n} = 4^n, and 3^{n-1} = 3^n / 3, so = (1/2) * (4/3)^n * 3]

