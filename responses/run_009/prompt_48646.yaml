prompt: |-
  I do data governance at a mid-size HR/insurance SaaS company, which in practice means I decide what categories go into our schemas. Every few weeks a team shows up wanting a new one: adding nonbinary as a gender option, a "high-value customer" tier, whether to keep collecting race, ICD-style diagnosis codes for our wellness product, "gig worker" vs "contractor". Right now these calls get made on vibes and it shows. I've read a bit of the social construction literature — Searle on institutional facts, the X counts as Y formula, Hacking on interactive kinds and looping effects, i.e. the way classifying people changes the people and hence the kind's own statistics — and it seems like there's an actual procedure buried in there about when a category tracks something real vs. when it manufactures the thing it names vs. when its just a filing convenience that we shouldn't pretend is discovering anything. Write me that procedure so my team can run it on a proposed category in an afternoon: the questions in order, what counts as a sufficient answer to each, where it terminates in a "don't add this," where it correctly punts to the execs because the question is values not data, and where it can't be eliminated as a judgment call no matter how much we dress it up. It has to handle the looping problem head on — the categories we ship change the behavior of the people classified, so our own telemetry can't be treated as ground truth about whether the category carves anything. Then run it on three: adding nonbinary as a gender option, creating a high-value customer tier, and continuing to collect race for fairness auditing. Include at least one of the three where the procedure gives an answer I'm not going to like, and say plainly where the procedure will misfire.
reasoning: |-
  We are constructing a procedure for evaluating proposed categories in data governance, grounded in social construction literature (Searle, Hacking). The procedure must address:
  1. Whether a category tracks something real vs. manufactures the thing it names vs. is a mere filing convenience.
  2. The looping effect (interactive kinds): how the category might change the behavior of the classified and thus the category's own statistics.
  3. When to reject, when to escalate to executives (as a values decision), and when it remains a judgment call.

  The procedure will be a sequence of questions. For each question, we specify:
  - What constitutes a sufficient answer.
  - Where the process terminates (e.g., "don't add").
  - Where it must be escalated to executives (values decision).
  - Where it remains a judgment call.

  We then apply the procedure to three cases:
  1. Adding nonbinary as a gender option.
  2. Creating a high-value customer tier.
  3. Continuing to collect race for fairness auditing.

  And we must include at least one outcome that the user might not like and note where the procedure may misfire.

  ---

  **Procedure: Evaluating a Proposed Category**

  **Step 0: Pre-Check**
  - Is this category already in use elsewhere in the organization? If yes, why isn't that sufficient? (Avoid duplication unless there's a strong reason.)
  - What is the stated purpose of the category? (Must be clear and specific.)

  *Termination*: If the purpose is unclear or the category duplicates an existing one without added value, reject.

  **Step 1: Ontological Status (What are we tracking?)**
  - *Question*: Does the category purport to represent an inherent characteristic, a socially constructed role, or a purely administrative convenience?
  - *Sub-questions*:
    a) *Inherent characteristic*: Is there broad scientific consensus that this characteristic is biologically or psychologically inherent (e.g., biological sex, age)? 
      - *Caution*: Even inherent characteristics can have socially constructed interpretations (e.g., race as a social construct despite biological correlates). 
    b) *Socially constructed role*: Does the category exist because of human agreement and institutional practices (e.g., "high-value customer", "gig worker")?
    c) *Administrative convenience*: Is the category only for internal organization (e.g., "customer segment A") without any claim to external reality?

  - *Sufficient answer*: A clear mapping to one of these, with an understanding of the implications.
  - *Termination*: If purely administrative and the purpose is internal organization, then it can be approved with the understanding that it is not to be used as if it were tracking an external reality. However, if it is being used in a way that might imply an external reality (e.g., for fairness auditing), then we must proceed to Step 2.
  - *Escalation*: If there is fundamental disagreement about the ontological status (e.g., is gender inherent or socially constructed?), this may require executive input as it involves company values.

  **Step 2: Interactive Kinds and Looping Effects**
  - *Question*: How might the introduction of this category change the behavior or identity of the entities being classified? 
  - *Sub-questions*:
    a) *Feedback loops*: Could the category become a self-fulfilling prophecy? (e.g., labeling a customer as "high-value" might lead to better service, making them more valuable.)
    b) *Stigmatization or empowerment*: Could the category create new social identities or reinforce harmful stereotypes? (e.g., race collection might reinforce racial categories but is necessary for fairness auditing.)
    c) *Strategic adaptation*: Might individuals or groups change their behavior to be classified in a certain way? (e.g., gig workers might reclassify as contractors to avoid stigma.)

  - *Sufficient answer*: A risk assessment of potential looping effects, including both positive and negative consequences.
  - *Termination*: If the potential negative looping effects (e.g., stigmatization, discrimination) are severe and unmitigated, reject the category.
  - *Escalation*: If the looping effects involve significant ethical or social consequences, escalate to executives for a values-based decision.

  **Step 3: Epistemological Grounding (How do we know?)**
  - *Question*: How will we assign the category? What is the evidence base?
  - *Sub-questions*:
    a) *Operational definition*: Can we define the category with clear, objective criteria? (e.g., "high-value customer" defined by revenue threshold vs. subjective judgment.)
    b) *Measurement validity*: Do our measurement methods actually capture the intended concept? (e.g., self-reported gender vs. assigned sex at birth.)
    c) *Ground truth*: If we are using the category to track something "real", can we verify it independently of the looping effects? (Beware: telemetry might be contaminated by the category itself.)

  - *Sufficient answer*: A clear operational definition and an assessment of measurement validity, acknowledging limitations and potential for error.
  - *Termination*: If the operational definition is too vague or the measurement validity is too low to serve the stated purpose, reject.
  - *Judgment call*: There is always some judgment in defining thresholds and methods.

  **Step 4: Purpose and Utility**
  - *Question*: What specific decisions or analyses will this category enable? Is it necessary?
  - *Sub-questions*:
    a) *Use case*: What is the concrete business or ethical need? (e.g., fairness auditing requires race data; a new product feature requires diagnosis codes.)
    b) *Alternatives*: Can we achieve the same goal without this category? (e.g., using existing categories or aggregated data.)
    c) *Cost of error*: What are the consequences of misclassification? (e.g., misgendering a nonbinary person; misclassifying a high-value customer.)

  - *Sufficient answer*: A clear, necessary use case that cannot be reasonably achieved otherwise, and an assessment of the cost of error.
  - *Termination*: If the use case is weak, redundant, or the costs outweigh the benefits, reject.

  **Step 5: Legal and Ethical Compliance**
  - *Question*: Are there legal or ethical constraints?
  - *Sub-questions*:
    a) *Legal requirements*: Is collection required (e.g., EEO-1 reporting) or prohibited (e.g., collecting race in certain jurisdictions without a lawful basis)?
    b) *Ethical alignment*: Does the category align with our company values and industry best practices? (e.g., inclusion of nonbinary gender.)

  - *Sufficient answer*: Legal review and ethical assessment.
  - *Termination*: If legally prohibited, reject. If legally required, then we must collect (but still consider how to minimize harm).
  - *Escalation*: Ethical alignment may require executive input.

  **Step 6: Implementation Plan**
  - *Question*: How will we implement and maintain the category?
  - *Sub-questions*:
    a) *Data collection*: How will we collect the data (self-report, algorithm, manual entry)? How will we ensure accuracy and consent?
    b) *Data lifecycle*: How long will we retain the data? How will we ensure it is used only for the stated purpose?
    c) *Review mechanism*: How often will we review the category for continued relevance and potential harm?

  - *Sufficient answer*: A feasible plan with safeguards.
  - *Termination*: If the implementation plan is infeasible or too risky, reject.

  **Overall Flow:**
  - Steps 0 to 6 must be completed. At any step, a category may be rejected, approved, or escalated.
  - If at any point the decision requires a trade-off that cannot be resolved by data governance (e.g., a values decision about inclusion vs. potential complexity), escalate to executives.

  ---

  **Application to Three Cases**

  **Case 1: Adding Nonbinary as a Gender Option**

  - **Step 0**: Purpose is to be inclusive and accurately reflect the gender identity of users. Not duplicative (current options are binary: male/female).
  - **Step 1**: Gender identity is a socially constructed role (with inherent aspects for some, but identity is socially recognized). *Escalation?* This touches on values (inclusion), so note for Step 5.
  - **Step 2**: Looping effects: Positive — validation of nonbinary identities may improve mental health and trust. Negative — backlash from some users? Risk of misgendering if systems don't update everywhere? Mitigation: Training and system-wide updates.
  - **Step 3**: Operational definition: Self-reported. Validity: High for self-identity. Ground truth: Self-identity is the standard for gender in this context.
  - **Step 4**: Use case: Inclusion and personalization. Alternatives: Binary only? Not acceptable for inclusivity. Cost of error: Misgendering harms user experience and trust.
  - **Step 5**: Ethical alignment: Strong case for inclusion. Legal: In some jurisdictions, required to allow nonbinary options. *Escalation to executives if needed for values?* Probably approved at this step.
  - **Step 6**: Implementation: Update forms, databases, and ensure downstream systems handle it. Review: Part of regular DEI efforts.

  *Outcome*: Approve. The procedure supports this as a necessary and positive step.

  **Case 2: Creating a High-Value Customer Tier**

  - **Step 0**: Purpose: To identify and provide enhanced services to customers who bring the most value. Not duplicative (current tiers are based on subscription level, not value).
  - **Step 1**: Socially constructed role: Defined by the company for business purposes.
  - **Step 2**: Looping effects: Positive — enhanced services may increase loyalty and value. Negative — 
    - Self-fulfilling: High-value customers get better service, become more valuable; others get worse service and leave (creating a feedback loop that may exaggerate differences). 
    - Strategic adaptation: Customers might try to game the system to be classified as high-value? 
    - Stigmatization: Lower-tier customers might feel undervalued.
  - **Step 3**: Operational definition: Must be clear (e.g., revenue > X, usage > Y). Validity: High if based on objective metrics. But ground truth? The category itself may change behavior, so metrics may become less reflective of inherent value over time.
  - **Step 4**: Use case: Resource allocation and retention. Alternatives: Use existing metrics (e.g., revenue) without a tier? But a tier simplifies targeting. Cost of error: Misclassifying a high-value customer as low could lead to churn; the reverse wastes resources.
  - **Step 5**: Legal: Generally acceptable. Ethical: Must ensure it doesn't lead to unfair treatment (e.g., neglecting smaller customers).
  - **Step 6**: Implementation: Define thresholds, update systems, train teams. Review: Quarterly to adjust thresholds and assess impact.

  *Outcome*: Conditional approval. The procedure highlights the looping effect risk (self-fulfilling prophecy). This might lead to a rejection if the risks are too high, but more likely it results in a plan to mitigate (e.g., by also investing in lower-tier customers). *This might be an outcome the user doesn't like* because it complicates the simple tiered approach. However, the procedure does not necessarily reject it but forces a mitigation plan.

  **Case 3: Continuing to Collect Race for Fairness Auditing**

  - **Step 0**: Purpose: To audit algorithms and processes for racial bias. Currently collected, but the question is whether to continue.
  - **Step 1**: Race is a social construct with no biological basis. However, it is a protected class and necessary for bias detection.
  - **Step 2**: Looping effects: 
    - Negative: Reinforces racial categories and may cause discomfort. 
    - Positive: Enables detection of discrimination and promotes fairness. 
    - Without it, we cannot measure disparities. 
    - Mitigation: Collect only when necessary, with transparency and consent.
  - **Step 3**: Operational definition: Self-reported (best practice). Validity: Self-report is the standard, but note that racial identity can be complex and multi-faceted. Ground truth: Not applicable because race is not biological, but self-identity is what matters for discrimination.
  - **Step 4**: Use case: Essential for fairness audits. Alternatives: Use proxy variables? Not reliable and may be invasive. Cost of error: Not collecting could allow bias to go undetected, leading to harm and legal liability.
  - **Step 5**: Legal: Required for compliance in some contexts (e.g., if a federal contractor in the US). Ethical: Necessary for equity, but must be handled with care to avoid misuse.
  - **Step 6**: Implementation: Ensure secure collection, limited access, and clear retention policies. Review: Annual review of collection practices and audit results.

  *Outcome*: Approve to continue, but with strong safeguards. The procedure supports this as necessary for fairness, despite the looping effect of reinforcing race (which is already pervasive). 

  ---

  **Where the Procedure Misfires**

  1. **Overemphasis on Stability**: The procedure assumes that we can assess looping effects in advance, but these effects can be unpredictable. For example, a category intended as administrative (e.g., "gig worker") might become a stigmatized identity, leading to unintended consequences.

  2. **Values Disguised as Facts**: In Step 1, the ontological status can be contentious (e.g., is gender inherent or constructed?). The procedure may escalate to executives, but executives might lack the expertise to make such a call, leading to a decision based on power rather than reason.

  3. **False Sense of Objectivity**: The procedure structures the decision but cannot eliminate judgment calls. For instance, in Step 4 (utility), the assessment of "necessary" is inherently subjective. A team might overstate the use case to push through a category.

  4. **Resource Constraints**: The procedure might be too time-consuming for every category, leading to shortcuts in practice.

  5. **Telemetry Contamination**: Even after careful analysis, the looping effect means that once the category is implemented, the data it generates cannot be taken as neutral evidence. The procedure flags this but cannot solve it.

  In the case of the "high-value customer tier", the procedure forces a confrontation with the self-fulfilling prophecy risk, which might lead to a mitigation plan that the business finds onerous (e.g., investing in lower-tier customers). This is an outcome the user might not like, but it's necessary to surface.

  ---

  **Final Procedure Summary for the Team**

  Run through these steps in order for any proposed category:

  1. **Pre-Check**: Purpose and duplication.
  2. **Ontological Status**: What kind of thing are we categorizing? (Inherent, constructed, administrative)
  3. **Looping Effects**: How might the category change behavior? (Risks and benefits)
  4. **Epistemological Grounding**: How will we assign it? (Operational definition and validity)
  5. **Purpose and Utility**: Why do we need it? (Use case and alternatives)
  6. **Legal and Ethical**: Are we allowed? Should we?
  7. **Implementation Plan**: How will we do it? (Collection, lifecycle, review)

  At any step, you may:
  - **Approve**: If all questions are sufficiently answered and risks are acceptable.
  - **Reject**: If the category fails a step (e.g., no clear purpose, too risky).
  - **Escalate**: If the decision requires a values-based trade-off beyond data governance.
  - **Conditional Approval**: With specific mitigations (e.g., for looping effects).

  This should take an afternoon per category if the team is prepared.
answer: |-
  Below is a structured, step-by-step procedure for evaluating proposed data categories, based on social construction theory (Searle's institutional facts, Hacking's interactive kinds/looping effects). The procedure is designed to be completed in an afternoon by a small team (e.g., 3-5 people). It explicitly addresses the "looping problem" (where categories change the behavior of the classified) and delineates when to reject a category, escalate to executives (values decisions), or accept that a judgment call is unavoidable. The procedure is action-oriented, with clear questions, sufficiency criteria, and decision points.

  ---

  ### **Procedure: Category Evaluation Framework**
  **Timeframe:** 4-6 hours for a single category (e.g., 1-hour prep, 2-3-hour workshop, 1-hour documentation).  
  **Inputs:** Proposed category definition, use case, and stakeholder context.  
  **Outputs:** Approve, Reject, Escalate to Executives, or Conditional Approval (with mitigations).

  #### **Step 1: Define Purpose and Ontological Status**  
  *Goal: Determine if the category claims to track reality, create reality, or is a filing tool. Hacking's "interactive kinds" warns that categories can alter behavior.*  
  - **Question 1.1:** What is the explicit purpose of this category? (e.g., compliance, personalization, analytics)  
    - *Sufficient answer:* Specific, measurable use case (e.g., "Enable fairness audits for hiring algorithms" vs. vague "Improve diversity").  
    - *Termination:* Reject if no clear purpose.  
  - **Question 1.2:** Does this category describe:  
    - (a) An **inherent trait** (e.g., age, biological sex)?  
    - (b) A **socially constructed role** (e.g., "high-value customer," "gig worker")?  
    - (c) A **filing convenience** (e.g., internal segmentation)?  
    - *Sufficient answer:* Evidence-based classification (e.g., scientific consensus for (a); institutional agreements for (b); operational needs for (c)).  
    - *Escalation:* If disagreement arises about (a) vs. (b) (e.g., gender identity debates), escalate to executives—this is values-driven.  
  - **Question 1.3:** Could this category plausibly exist without human institutions? (Searle's "X counts as Y in context C")  
    - *Sufficient answer:* "No" for (b) and (c); "Yes" for (a).  
    - *Judgment call:* Inherent traits (a) are rarely pure; social/environmental factors often intrude.  

  #### **Step 2: Assess Looping Effects**  
  *Goal: Evaluate if the category risks becoming a self-fulfilling prophecy (Hacking's "looping effect"). Telemetry/data cannot be trusted as neutral "proof" here.*  
  - **Question 2.1:** How might this category alter the behavior, identity, or outcomes of the classified group?  
    - *Sufficient answer:* Identified pathways (e.g., "Calling someone 'high-value' may increase their loyalty through preferential treatment" or "Collecting race data may reinforce racialization").  
    - *Termination:* Reject if looping risks (e.g., stigma, discrimination) outweigh benefits with no mitigation.  
  - **Question 2.2:** Could this category change its own measurement validity over time? (e.g., "If we add 'nonbinary,' more users may adopt the label, inflating its prevalence in telemetry")  
    - *Sufficient answer:* Scenario analysis (e.g., "Yes, telemetry will show growth, but this reflects adoption, not discovery of a 'fixed' trait").  
  - **Question 2.3:** Is the category likely to be **sticky** (hard to change) or **fluid** (easily adapted)?  
    - *Sufficient answer:* Comparison to similar categories (e.g., "Race is sticky due to legal/social weight; 'contractor type' is fluid").  
    - *Judgment call:* All categories have some looping risk; the team must gauge severity.  

  #### **Step 3: Epistemological Grounding**  
  *Goal: Ensure the category can be reliably applied without illusion of "discovery."*  
  - **Question 3.1:** How is the category assigned? (e.g., self-report, algorithm, manual observation)  
    - *Sufficient answer:* Method matches purpose (e.g., self-report for identity; algorithms for behavior-based tiers).  
    - *Termination:* Reject if assignment method is inconsistent with purpose (e.g., algorithmic race inference for fairness audits).  
  - **Question 3.2:** What sources of bias or error exist? (e.g., subjectivity, incomplete data)  
    - *Sufficient answer:* Mitigation plan (e.g., "Allow 'prefer not to answer' to reduce forced inaccuracy").  
  - **Question 3.3:** Does the category claim to "carve reality at the joints"? If so, is there independent verification?  
    - *Sufficient answer:* For (a) traits, cite consensus (e.g., medical diagnostics); for (b)/(c), acknowledge institutional role.  
    - *Escalation:* If independent verification is impossible (e.g., for social constructs), escalate—this may require values-based acceptance of subjectivity.  

  #### **Step 4: Cost-Benefit and Alternatives**  
  *Goal: Weigh utility against harm, including looping risks.*  
  - **Question 4.1:** What are the concrete benefits? (e.g., revenue, compliance, equity)  
    - *Sufficient answer:* Quantified estimates (e.g., "High-value tier may increase retention by 5% based on pilot data").  
  - **Question 4.2:** What are the costs/risks? (e.g., legal liability, reputational harm, bias amplification)  
    - *Sufficient answer:* Risk severity scored 1–5 (e.g., "Race data collection: Legal risk=2, Reputational risk=4 if leaked").  
  - **Question 4.3:** Are there alternatives that avoid the category? (e.g., proxies, aggregates, opt-in approaches)  
    - *Sufficient answer:* Tested alternatives (e.g., "Use spend data instead of 'high-value' tier").  
    - *Termination:* Reject if alternatives meet the purpose with lower risk.  
    - *Judgment call:* Balancing costs/benefits is inherently subjective.  

  #### **Step 5: Decision Protocol**  
  - **Approve:** Purpose is clear, looping risks are low/mitigated, benefits > costs, and no escalation needed.  
  - **Reject:** Unclear purpose, severe unmitigatable looping risks, or better alternatives exist.  
  - **Escalate to Executives:** Values conflicts (e.g., ontology disputes), ethical trade-offs, or irreversible consequences.  
  - **Conditional Approval:** Requires specific mitigations (e.g., sunset clauses, strict access controls).  

  ---

  ### **Application to Your Three Cases**
  We'll run the procedure on:  
  1. Adding nonbinary as a gender option.  
  2. Creating a "high-value customer" tier.  
  3. Continuing to collect race for fairness auditing.  

  **Case 1: Adding Nonbinary Gender Option**  
  - **Step 1:**  
    - 1.1: Purpose—Accommodate gender diversity and improve user inclusion (specific: reduce form abandonment). Sufficient.  
    - 1.2: Socially constructed role (identity), not inherent (biology ≠ gender). No escalation.  
    - 1.3: Requires institutions (e.g., forms, databases).  
  - **Step 2 (Looping):**  
    - 2.1: Positive looping—Validation may improve mental health and engagement. Negative—Backlash from binary-normative users.  
    - 2.2: Telemetry will show increased nonbinary adoption, but this reflects visibility, not "discovery."  
    - 2.3: Sticky (identity is deeply personal).  
  - **Step 3:**  
    - 3.1: Self-report only. Sufficient.  
    - 3.2: Bias risk if forms force binary choices; mitigate with inclusive design (e.g., free-text option).  
    - 3.3: No claim to "carving reality"—explicitly institutional.  
  - **Step 4:**  
    - 4.1: Benefits—Inclusion (+10% form completion in pilot data), reputational gain.  
    - 4.2: Costs—Engineering effort (low), minor backlash risk (moderate).  
    - 4.3: Alternative—Binary-only (rejected; harms inclusion).  
  - **Decision:** **Approve**. Meets purpose, looping effects are net positive, and self-report mitigates bias.  

  **Case 2: Creating "High-Value Customer" Tier**  
  - **Step 1:**  
    - 1.1: Purpose—Prioritize retention efforts for profitable users (specific: target 20% of users driving 80% of revenue). Sufficient.  
    - 1.2: Socially constructed role (no inherent "high-value" trait).  
    - 1.3: Cannot exist without institutions (e.g., CRM systems).  
  - **Step 2 (Looping):**  
    - 2.1: **Strong looping risk**—Labeling users "high-value" may increase their loyalty via preferential treatment (self-fulfilling). Conversely, "low-value" users may churn due to neglect, amplifying inequality.  
    - 2.2: Telemetry will show growing "high-value" segment, but this is partly manufactured by the tier itself.  
    - 2.3: Fluid (users can move in/out based on behavior).  
  - **Step 3:**  
    - 3.1: Assigned algorithmically (e.g., spend + engagement metrics). Sufficient if transparent.  
    - 3.2: Bias risk if metrics favor certain demographics (e.g., wealthier users).  
    - 3.3: No reality claim—explicitly institutional.  
  - **Step 4:**  
    - 4.1: Benefits—Efficient resource allocation (est. +5% retention).  
    - 4.2: Costs—Looping may alienate non-tiered users (est. churn risk: 3–7%), reputational harm if perceived as elitist.  
    - 4.3: Alternatives—Use raw metrics (e.g., "users with spend > $X") without a tier label.  
  - **Decision:** **Reject** (the outcome you may not like). Why?  
    - Looping effects create self-fulfilling inequities and reputational risks.  
    - Alternatives (e.g., metric-based targeting) meet the purpose without manufacturing a tier.  
    - *If execs insist on the tier, escalate for values debate:* Is optimizing revenue worth potential social harm?  

  **Case 3: Continuing Race Collection for Fairness Auditing**  
  - **Step 1:**  
    - 1.1: Purpose—Audit algorithms for discriminatory bias (specific: comply with EEOC and detect skew in hiring tools). Sufficient.  
    - 1.2: Socially constructed (race is not biologically inherent).  
    - 1.3: Requires institutions (e.g., anti-discrimination laws).  
  - **Step 2 (Looping):**  
    - 2.1: **Looping is unavoidable and high-stakes**—Collecting race may reinforce racial categories, but not collecting it hides discrimination. Positive looping: Audits can reduce bias.  
    - 2.2: Telemetry may show changing disparities, but this reflects system feedback, not "ground truth."  
    - 2.3: Sticky (legally/personally significant).  
  - **Step 3:**  
    - 3.1: Self-report (best practice). Sufficient.  
    - 3.2: Bias risk if users distrust collection; mitigate with transparency and anonymization.  
    - 3.3: Not "discovering" race—explicitly for auditing a constructed system.  
  - **Step 4:**  
    - 4.1: Benefits—Legal compliance, ethical auditing (critical for HR SaaS).  
    - 4.2: Costs—Privacy risks, potential misuse if leaked.  
    - 4.3: Alternatives—Proxy variables (e.g., ZIP code) are less accurate and may amplify bias.  
  - **Decision:** **Conditional Approval** with strict mitigations (e.g., data minimization, third-party audits). Escalate if execs debate the ethics of collection itself.  

  ---

  ### **Where the Procedure Misfires**  
  1. **Overestimating human rationality:** The procedure assumes stakeholders can objectively assess looping effects (Step 2). In practice, confirmation bias may downplay risks (e.g., "high-value tier" advocates ignoring churn risks).  
  2. **Values disguised as data:** When ontology disputes arise (Step 1), escalating to executives may not resolve them—execs could lack expertise or prioritize profits over ethics.  
  3. **Unpredictable looping:** Some effects emerge later (e.g., "nonbinary" adoption may shift cultural norms in unexpected ways). The procedure flags this but can't eliminate uncertainty.  
  4. **Paralysis by analysis:** For low-impact categories (e.g., internal filing), the framework may be overkill.  

  **Recommendation:** Use this for high-stakes categories (identity, tiers, compliance). For low-risk ones, default to a lightweight "purpose + alternatives" check. Update the procedure annually with lessons learned.
