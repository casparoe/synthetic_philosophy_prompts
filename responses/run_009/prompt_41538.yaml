prompt: |-
  I teach a political philosophy seminar, and every year the corruption unit goes the same way: I put the easy case on the board (customs official, brown envelope, everyone nods), and then the whole class falls apart once we get to clientelism and gift-giving. My own views on this are honestly a mess, which is partly why I keep testing them on Dana, who teaches anthropology down the hall and has very firm instincts about this stuff. After enough dinners together I've collected a track record of her verdicts, and here's the thing: I can predict her on some cases with embarassing accuracy and on others I genuinely have no idea. Her rulings so far: a city building inspector who takes cash to overlook code violations is corrupt, full stop, no discussion. A rural doctor in southern Europe whose patients' families bring her wine and homemade cakes at Christmas, and who ends up giving those families slightly longer appointments, is not corrupt -- Dana basically thinks you'd have to be a sociopath to call that corruption. An old-style ward boss who got the snow plowed on streets that turned out the vote for his machine, and who never pocketed a dime himself, is not corrupt either. A senator who quietly slips an earmark into a bill for a project a major donor wants is corrupt. And a customs official in a country where everyone expects a dash to expedite paperwork that people are legally entitled to anyway is, she says, corrupt -- this one suprised me a little given her usual cultural-relativist reflexes. I keep telling her that by a strict Weberian impartiality standard half her "not corrupt" verdicts flip, and she waves me off with something about Weber being an artifact of one particular kind of state.

  Next week we're having dinner and I want to walk in with a case that actually tests her. Here it is: a hospital administrator in rural Kenya who decides how to distribute a limited supply of vaccines, and who quietly reserves early slots for her relatives and for people from her home village. She takes no payment for any of this, she sincerely believes she would be a monster to let a stranger jump ahead of her mother, most of the staff and patients expect exactly this behavior from someone in her position, and the ministry's formal protocol says allocation should be strictly need-based. So: (a) given her track record, what is Dana most likely to say about this case? (b) What are the different rules that could each rationalize that track record? I can see at least a personal-enrichment rule (no profit, no corruption), a narrower office-selling rule where corruption requires treating role duties as a commodity for sale, and some version of a local-norms rule where corruption means violating the standards the society itself applies to the role -- and I'd want you to say which of these (or something else entirely) actually fits her best, including whether any of her past verdicts strain a given rule, since her call on the dash case does funny things to the pure local-norms reading. And (c) design one further case, described concretely enough that I could actually put it to her over dessert, where those rules come apart cleanly enough that her answer would tell me which one she's really running. Don't just tell me what she *should* say -- I want a prediction I can win an argument with.
reasoning: |-
  Okay, let me unpack this political philosophy professor's dilemma. He's struggling to pin down his anthropologist colleague Dana's seemingly inconsistent corruption framework, especially after her surprising take on the "dash" custom. 

  First, I need to analyze Dana's existing verdicts: 
  - Cash-for-code-violations: corrupt (obvious)  
  - Doctor's Christmas gifts: not corrupt (cultural norm)  
  - Ward boss's snow plowing: not corrupt (community service)  
  - Senator's earmark: corrupt (favor trading)  
  - Customs "dash": corrupt despite being customary (this breaks the pattern)

  The Kenyan vaccine case is fascinating because it layers multiple tensions: kinship obligation vs bureaucratic neutrality, life-or-death stakes, and local expectations clashing with formal protocols. Dana would likely call this *not corrupt* because:  
  1) No personal gain (just familial duty)  
  2) Aligns with local relational ethics ("monster" otherwise)  
  3) Staff/patients expect this behavior  

  But her customs "dash" ruling complicates things—there she rejected local norms when they commodified public access. Why the difference? Probably because the customs case involves:  
  - Direct payment (not just reciprocity)  
  - Extortionate context ("legally entitled anyway")  
  - Violates her implicit anti-commodification principle  

  Three possible frameworks emerge:  
  1. **No-Profit Rule**: Fits all except the earmark (senator didn't profit directly)  
  2. **Anti-Commodification Rule**: Explains everything—even the "not profit" earmark is corrupt because it trades policy for donations  
  3. **Modified Local Norms**: Only valid when non-monetary and reciprocal (doctor's cakes yes, customs bribes no)  

  The earmark case is the linchpin—it sinks the pure No-Profit Rule. Anti-Commodification wins because:  
  - Doctor's gifts aren't transactional (diffuse reciprocity)  
  - Ward boss provides communal goods (not individualized exchange)  
  - Customs "dash" and earmarks turn public access into private purchases  

  For the test case, I'd design something that forces Dana to choose between kinship norms and commodification: a *non-monetary* but *tradable* favor—like a county clerk prioritizing wedding licenses for cousins who then pressure others to vote for her brother. No money changes hands, but it's clearly reciprocal favor-trading. If she calls this corrupt (prediction: yes), Anti-Commodification is her true framework. If not, we're back to square one.  

  Final touch: phrase the test case with vivid details ("frilly wedding invitations," "frosted carrot cake") to make it feel concrete over dessert. The professor needs ammunition for his Weberian counterattack.
answer: |-
  Based on Dana's track record and anthropological lens, here's my analysis and prediction toolkit for your dinner debate:

  **(a) Dana's Likely Verdict on the Vaccine Case:**  
  **Not corrupt.** Her reasoning would likely emphasize:  
  - Absence of *personal enrichment* (no cash, gifts, or material gain)  
  - *Embeddedness in social obligations* (kinship duties override abstract bureaucratic rules; "monster" framing aligns with her doctor/cake verdict)  
  - *Local normative expectations* (staff/patients anticipate prioritization of kin/village ties)  
  - *Sincere moral conviction* (contrasted with cynical profiteering)  

  **(b) Rules Rationalizing Her Track Record:**  
  Three candidate frameworks, ranked by fit:  

  1. **ANTI-COMMODIFICATION RULE (BEST FIT):**  
     *Corruption occurs when public goods/roles are treated as market commodities.*  
     - Fits: Customs "dash" (access to *entitled* service sold), building inspector (safety rules commodified), senator (policy access sold to donor).  
     - Exempts: Doctor (gifts are *non-contractual social gestures*, not payment), ward boss (snow plowing is *political reciprocity*, not direct sale).  
     - **Strain?** None. Elegantly explains why "dash" is corrupt (monetizes basic access) while cakes/plowing aren’t (non-monetized reciprocity).  

  2. **MODIFIED LOCAL NORMS RULE (SECOND BEST):**  
     *Corruption violates the *most legitimate* layer of norms governing a role* (acknowledging plural legalities).  
     - Fits: Customs official (broader national law > local "dash" custom), doctor (local gift culture > Weberian impartiality), vaccine case (local kinship ethics > ministry protocol).  
     - **Strain?** Ward boss: If "machine politics" violates formal democratic norms, why not corrupt? Dana likely sees it as a *legitimate alternative governance structure* in its context.  

  3. **NO-PERSONAL-PROFIT RULE (WEAKEST FIT):**  
     *Corruption requires direct material enrichment of the official.*  
     - Fits: Building inspector (cash), customs official ("dash").  
     - **Fails:** Senator (earmark may not enrich *him* personally), ward boss (power ≠ profit). Dana’s rejection of the earmark sinks this.  

  **Why Anti-Commodification Wins:**  
  - Explains all cases without strain, especially her "dash" verdict where local custom exists *but* turns public access into a private market.  
  - Resonates with anthropological critiques of market encroachment on social spheres (Polanyi, Graeber).  
  - Weberian impartiality isn’t rejected wholesale—it’s contextually overridden by deeper *non-market* logics (kinship, community reciprocity).  

  **(c) The Dessert-Test Case:**  
  **The Nepotistic Contract Bid**  
  > In a coastal Colombian town, a mayor awards a public contract to repair hurricane-damaged schools to his nephew’s construction company. The nephew’s bid is 10% higher than the lowest bidder, but still under budget and objectively competent (no safety risks, prior projects successful). No bribes change hands. The mayor declares: "I trust my blood to do honest work for our people—outsiders cut corners." Townsfolk expect leaders to prioritize local kin; formal procurement rules require "lowest qualified bidder."  

  **Why This Tests Her Rules:**  
  | **Rule**               | **Predicted Verdict** | **Why?**                                                                 |  
  |-------------------------|------------------------|--------------------------------------------------------------------------|  
  | **Anti-Commodification** | **CORRUPT**            | The contract is a *public good* turned into a *kinship commodity*. Trust is monetized via inflated bid. |  
  | **Modified Local Norms** | **NOT CORRUPT**        | Local expectations ("support kin/insiders") override formal bidding rules. No profit = no foul.       |  
  | **No-Personal-Profit**   | **NOT CORRUPT**        | Mayor isn’t enriched; nephew earns fair market rate.                      |  

  **Prediction for Dana:**  
  She’ll call it **corrupt**. Her anti-commodification reflex will trump localism because:  
  - A public resource (contract $) is diverted via kinship ties, replicating market-style exclusion.  
  - Unlike the vaccine case (life-or-death kinship duty), this is economic favoritism—closer to the earmark senator.  
  - The 10% premium quantifies the "corruption premium" paid for nepotism, commodifying trust.  

  **Your Debate Strategy:**  
  1. Lead with the vaccine case—she’ll likely acquit, reinforcing your kinship-vs-bureaucracy narrative.  
  2. Spring the Colombian mayor at dessert. When she condemns it, pounce: *"Ah, but the nephew isn’t paying the mayor! And locals approve! Why isn’t this just like the ward boss or doctor?"*  
  3. Watch her distinguish: She’ll argue the contract is an *economic transaction* distorted by kinship, while snow plowing/vaccines are *social goods* distributed via relational ethics. **This confirms Anti-Commodification as her core rule.**  

  **Key Win-Point:** Her Colombian verdict exposes that her "local norms" shield has limits: when non-market relations (kinship) become vehicles for market logic (overpaying for contracts), corruption emerges. Weber’s ghost smiles.
