  ### (b) Our scenario: coincidence of perspectives

  In our scenario:

  - **Planning stage (ex ante)**: Alex considers the possible strategies over the two intersections. He sees that always exiting yields 10 minutes saved per night. Always continuing yields 3 minutes. Mixing might yield less (as shown, maximum mixed is 10 at p=q=1). So he plans to always take the shortcut (Exit) at both intersections.

  - **At the wheel (action stage)**:
    - At the first intersection (water tower): Alex knows he is at the first. He knows that if he exits, and then at the second he will exit (because exit is dominant at the second, and he plans to exit there) so he gets 10. If he continues, then at the second he will exit (because it's dominant) so he gets 9. 10>9, so he exits.
    - At the second intersection (barn): Alex knows he is at the second. Regardless of what he did at the first, exiting is better: if he exited at the first, then exiting now gives 10; if he continued at the first, then exiting now gives 9. But 10 and 9 are both better than the alternative: if he continues at the second, he would get only 1 (if he exited at the first) or 3 (if he continued at the first). So he exits.

  Therefore, the action at each intersection is to exit, matching the plan. There is no incentive to deviate.

  Moreover, over many nights, Alex can learn: if he always exits, he gets 10 every night. If he tries always continuing, he gets 3. If he tries exiting at one and not the other, he might get 1 or 9, both lower than 10. So he will converge to always exiting.

  ### (c) Which relaxed assumption is doing the most work?

  The most critical is specification 2: the landmarks provide observable distinction between the intersections. This removes the need for memory to distinguish states. In effect, the information sets are now singletons: the driver knows which intersection he is at. Therefore, the imperfect recall about past actions becomes irrelevant because the current state (which intersection) is known, and the optimal action at each state does not depend on the memory of past actions (since at the second intersection, the optimal action is dominant and does not require knowing the action at the first). Thus, the problem becomes a standard perfect-information decision problem (with the caveat that the driver does not remember his own actions, but in this case, the optimal action does not require that memory).

