  - Specification 1 (repeated) is not essential in this deterministic scenario. Even in a one-shot setting, the optimal strategy would be the same. However, it allows for learning and reinforces the stability.
  - Specification 3 (payoff regime) ensures that the same action is optimal at both intersections, which is critical for the absent-minded driver (who must use the same action) to achieve the optimum. Without this, if different actions were optimal, the absent-minded driver (who cannot condition on the intersection because he doesn't remember his past action) might not be able to achieve the optimum, and we might have a mixed strategy or a different instability.

