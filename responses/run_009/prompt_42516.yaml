  Alex commutes every evening. The route has two intersections. The first is marked by a blue water tower, the second by a red barn. At each, Alex can take a shortcut (Exit) or continue. The shortcuts save time, but only if not overused. Specifically:
  - If he takes the shortcut at both intersections, he saves 10 minutes (total).
  - If he takes the shortcut only at the first, he saves 1 minute.
  - If he takes the shortcut only at the second, he saves 9 minutes.
