  ### Research Proposal: The Dual Loci of Moral Luck: Resolving the Stalemate in the Control Principle Debate

  **Research Question**:  
  Does the control principle—that moral assessment cannot be based on factors beyond an agent’s control—apply uniformly to both (1) the *moral wrongness of actions* and (2) the *assessment of moral character*, or does it hold asymmetrically across these two domains, thereby explaining the persistent disagreements in the moral luck debate?

  **Why Existing Positions Leave the Question Open**:  
  The moral luck debate, since Nagel’s and Williams’ seminal contributions, has treated "moral luck" as a monolithic phenomenon. Nagel’s taxonomy (resultant, circumstantial, constitutive, and causal luck) and Williams’ emphasis on agent-regret presuppose a unified problem: whether luck *in general* undermines control-based moral assessment. This framing conflates two distinct loci:  
  - **Locus 1 (Wrongness of Action)**: Luck affects the *deontic status* of acts (e.g., the reckless driver who kills a child vs. one who does not).  
  - **Locus 2 (Character Assessment)**: Luck affects the *retrospective justification of character* (e.g., Williams’ painter, whose abandonment of family is vindicated only if he achieves artistic greatness).  
  Existing positions (e.g., control-deniers like Williams and control-defenders like Zimmerman) fail to disentangle these loci. Control-deniers cite Locus 1 cases to challenge the principle, while control-defenders use Locus 2 cases to salvage it—yet neither systematically examines whether the principle applies *differently* to each. Consequently, the debate remains static, oscillating between intuitions without reconciling why certain cases (e.g., resultant luck) elicit stronger disagreement than others (e.g., constitutive luck).

  **Two-Year Work Plan**:  
  *Year 1: Taxonomy and Asymmetry Hypothesis Development*  
  - **Term 1**: **Diagnostic Analysis**. Re-examine classic moral luck cases (e.g., reckless drivers, negligent parents, Williams’ Gauguin) to isolate Locus 1 (wrongness) and Locus 2 (character) intuitions. Map how existing theories (Nagel, Williams, Rescher, Enoch) conflate or obscure this distinction.  
  - **Term 2**: **Asymmetry Hypothesis Formulation**. Argue that the control principle may hold for one locus but not the other. Test hypotheses: (a) Control holds for wrongness (both reckless drivers are equally blameworthy *qua* action) but fails for character (the painter’s vindication is luck-dependent); (b) Control fails for wrongness (killing worsens the act) but holds for character (failure doesn’t negate Gauguin’s ambition).  
  - **Term 3**: **Conceptual Groundwork**. Define “moral wrongness” (e.g., act-centered, outcome-sensitive) vs. “character assessment” (e.g., virtue/vice, life-narrative coherence). Analyze control’s role in each using frameworks from deontology, consequentialism, and virtue ethics.  

  *Year 2: Validation and Synthesis*  
  - **Term 1**: **Locus 1 (Wrongness) Focus**. Assess control’s applicability to wrongness: Does luck alter an act’s *objective wrongness* (e.g., comparative harm) or merely its *perceived blameworthiness*? Engage with resultant/causal luck literature and experimental philosophy studies.  
  - **Term 2**: **Locus 2 (Character) Focus**. Scrutinize control’s role in character: Can character traits (e.g., “courageous” vs. “reckless”) be assessed independently of luck-driven outcomes? Address Williams’ “agent-regret” and whether character is inherently diachronic/narrative-dependent.  
  - **Term 3**: **Asymmetry Resolution and Manuscript Draft**. Synthesize findings into a unified thesis: e.g., “Control governs wrongness but not character.” Draft monograph chapters and 2–3 journal articles targeting *Ethics* or *Philosophy and Phenomenological Research*.

  **Successful Outcome**:  
  Success entails: (1) A monograph demonstrating that asymmetrical application of the control principle resolves the moral luck stalemate; (2) Peer-reviewed articles establishing the two-locus distinction as a necessary advancement; (3) Broad scholarly recognition that disentangling these loci reframes the debate (e.g., inviting new work on blame vs. character). Success would be measured by acceptance in top-tier journals, invitations to keynote at moral philosophy conferences, and citation in major literature reviews.

  **Failure Conditions**:  
  The project fails if: (1) The two loci cannot be rigorously distinguished (e.g., character assessment collapses into act-wrongness); (2) The control principle applies symmetrically (both loci equally [in]vulnerable to luck); (3) The asymmetry thesis proves unoriginal (overlooked prior work); (4) Key arguments are deemed unconvincing in peer review (e.g., intuitions about Gauguin diverge irreducibly). Failure would manifest as rejection from target journals or inability to synthesize Year 2 terms 1–2 into a coherent resolution.

  **Key Risk to Two-Year Scope**:  
  The highest risk lies in **Term 2 of Year 2 (Character Assessment Focus)**, where Williams-inspired cases (e.g., Gauguin) are notoriously resistant to consensus. If character assessment proves inseparable from contingent outcomes (e.g., artistic success), defending the asymmetry may require extensive engagement with metaethics (e.g., moral realism vs. constructivism), risking timeline overruns. Mitigation: Narrow focus to paradigmatic cases; consult early with Williams scholars.

  \answer{The control principle holds for the moral wrongness of actions but fails for the assessment of character, and this asymmetry resolves the stalemate in the moral luck debate.}
