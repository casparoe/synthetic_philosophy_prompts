  I'm a professor of moral philosophy preparing a two-year postdoc proposal on moral luck. I have a half-formed thought I'd like turned into a proper proposal: the debate has assumed a single phenomenon — luck in how one is morally assessed — but the stock cases pull in different directions, and I suspect this is because luck enters at two distinct points. Luck can affect the wrong the agent does: the reckless driver who happens to hit a child has done something worse than the identical driver whose path happened to be clear. And luck can affect what we conclude about the agent's character: think of Williams's painter who abandons his family for his art, whose choice can only be vindicated if he in fact turns out to be great. My hunch is that the control principle — the thesis that we cannot be morally assessed for what is due to fortune — is correct for one of these and incorrect for the other, though I have not settled which; and I suspect that settling it would explain why the debate has felt static since Nagel and Williams framed it. Turn this into a complete proposal: state the research question precisely; explain why the existing positions leave it open; set out a work plan across the two years, term by term; say what a successful outcome would look like and what would count as the project failing; and note honestly where the two-year scope is most at risk. Do not include a bibliography — I will add citations myself. The proposal should close with a final line of the form \answer{...} giving, in one sentence, the central claim the project is designed to establish.
