prompt: |-
  I'm a PhD student in ML theory working on cooperative AI, and I'm stuck on one section of my thesis proposal. The section is supposed to situate the modern "program equilibrium" stuff (agents reading each other's source code, proof-based cooperation, PrudentBot-style constructions) relative to Hofstadter's much older idea of superrationality. My working take is that superrationality is basically an epistemic/psychological attitude — you cooperate in a prisoner's dilemma because you assume the other player reasons just like you, so your decision is in effect one decision made twice — while program equilibrium instead builds the mutual transparency into the actual machinery of the agents, so cooperation can be grounded in verification rather than symmetry assumptions. But my advisor keeps saying the difference is overblown: in her view, once you try to formalize superrationality at all rigorously, you end up covertly smuggling in something like shared source code or a common proof system, so the two frameworks collapse into each other and my proposed framing is a distinction without much of a difference.

  I need to write a decisive couple of paragraphs on this and can't just sit on the fence. So take a side: is program equilibrium genuinely a new foundation for cooperation, or is it best understood as superrationality done carefully? Give your actual reasons, not just a survey of both views, and if you think my framing of either one is off — e.g., that superrationality isn't really about symmetry assumptions — say so directly.

  (One more thing: keep it to what's conceptual in the two ideas themselves, no need to cite papers, my committee knows the literature, they just think I don't.)
