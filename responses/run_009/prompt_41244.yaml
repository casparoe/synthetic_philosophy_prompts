  ### Decision Procedure for Grant Review

  Based on the foundation's charter (prioritizing relief/prevention of intense suffering over positive experiences), this procedure operationalizes the principle into a repeatable, time-bound process. It uses a **tiered threshold system** to allow aggregation for lower-intensity cases while maintaining lexical priority for severe suffering. The procedure is designed for 40-minute reviews and non-philosophers.

  ---

  ### **Decision Procedure Steps**
  #### **Step 1: Classify Primary Benefit**  
  **Question:** Is the core benefit *suffering relief/prevention* or *positive experience creation*?  
  - **Suffering relief/prevention:** Addresses physical/mental pain, distress, or deprivation that actively impairs well-being.  
  - **Positive experience:** Creates joy, enrichment, or fulfillment where absence does not constitute suffering.  
  **Rules:**  
  - "Absence of suffering" (e.g., preventing a headache) is **suffering relief**, not a positive benefit.  
  - If a proposal has both, quantify each separately.  
  **Termination:** Proposals solely creating positive experiences proceed to Step 4. All others go to Step 2.  

  ---

  #### **Step 2: Assess Suffering Intensity**  
  **Question:** What is the **peak intensity** of suffering addressed? Use the scale below:  
  | Level | Anchor Examples | Criteria |  
  |-------|-----------------|----------|  
  | 1 (Mild) | Minor headache, boredom | Noticeable discomfort; no functional impairment. |  
  | 2 (Moderate) | Routine dental pain, mild anxiety | Discomfort impairs focus; manageable with effort. |  
  | 3 (Severe) | Debilitating back pain, severe depression | Prevents normal function; requires adaptation/treatment. |  
  | 4 (Extreme) | Untreated burns, advanced cancer, battery-cage confinement | Excruciating/unbearable; threatens survival or causes permanent damage. |  

  **Rules:**  
  - Assign levels using **medical data, behavioral evidence (for animals), or peer-reviewed analogs** (e.g., factory-farm hens ≈ Level 4 via welfare science).  
  - Focus on **peak experienced intensity** (e.g., cataract blindness = Level 3 due to total functional loss).  
  - **Termination:** If intensity is borderline (e.g., Level 2–3), flag for human judgment.  

  ---

  #### **Step 3: Apply Lexical Threshold & Quantify Magnitude**  
  **Question:** Does the proposal address **Level 3+ suffering**?  
  - **YES (Tier 1):** Automatically overrides *any* positive experience proposal. Compare to other Tier 1 proposals using:  
    **Expected Suffering Reduction (ESR) = Beneficiaries × Intensity Factor × Duration × Certainty**  
    - *Intensity Factor:* Level 3 = 10, Level 4 = 100 (per person-hour).  
    - *Duration:* Hours of relief (e.g., 1 year = 8,760 hours).  
    - *Certainty:* High (1.0), Medium (0.7), Low (0.3) based on evidence.  
  - **NO (Tier 2):** Proceed to Step 4 for aggregation with positive experiences.  

  ---

  #### **Step 4: Aggregate Tier 2 Benefits**  
  **Question:** What is the **net well-being impact**? Calculate:  
  **Net Benefit = (Suffering Relief + Positive Experiences) × Certainty**  
  - **Suffering Relief (Tier 2 only):**  
    - Level 1: 1 unit/hour  
    - Level 2: 3 units/hour  
  - **Positive Experiences:**  
    - Minor (e.g., gardening): 0.5 units/hour  
    - Moderate (e.g., youth orchestra): 1 unit/hour  
    - Significant (e.g., career-changing education): 3 units/hour  
  - **Termination:**  
    - If Tier 1 proposal exists: **Fund highest-ESR Tier 1 proposal** (skip Tier 2).  
    - No Tier 1: **Fund highest-net-benefit Tier 2 proposal**.  

  ---

  #### **Key Judgment Calls (in "Uniform")**  
  1. **Intensity Assignment:** Requires comparing disparate harms (e.g., hen vs. human suffering). Use:  
     - **Functional impairment** (e.g., blindness vs. confinement) and **pain analogs** (e.g., burn pain scales).  
     - Default: When in doubt, defer to severity (e.g., battery farming = Level 4).  
  2. **Uncertainty Handling:**  
     - Reject proposals with <50% certainty (e.g., speculative benefits).  
     - Medium certainty requires evidence (e.g., pilot data).  
  3. **Threshold Recognition:** Lexical priority triggers at Level 3+. Flag cases where:  
     - Suffering is severe but short-term (e.g., surgery recovery).  
     - Benefits mix Tier 1 and Tier 2 (e.g., pain reduction + mobility gains).  

  ---

  ### **Case Applications**
  #### **Case 1: Cataract Surgeries (2,000 people) vs. Youth Orchestra (5,000 children)**  
  - **Cataract Surgeries:**  
    - **Step 1:** Suffering relief (blindness prevention).  
    - **Step 2:** Intensity = Level 3 (prevents total functional impairment).  
    - **Step 3:** Tier 1 proposal.  
      - ESR = 2,000 × 10 × (8,760 hrs/year × 10 years) × 0.9 (high certainty) = **1.58B units**.  
  - **Youth Orchestra:**  
    - **Step 1:** Positive experience (enrichment).  
    - **Step 4:** Tier 2 net benefit = 5,000 × (2 hrs/week × 30 weeks × 1 unit/hr) × 0.8 = **240,000 units**.  
  **Decision:** Fund cataract surgeries (lexical priority).  

  #### **Case 2: Chronic Back Pain (Level 3, 3,000 patients) vs. Headache Relief (Level 1, 500,000 people)**  
  - **Back Pain:**  
    - Tier 1 ESR = 3,000 × 10 × (8,760 hrs × 5 years) × 0.8 = **1.05B units**.  
  - **Headache Relief:**  
    - Tier 2 net benefit = 500,000 × (200 hrs/year × 1 unit/hr) × 0.9 = **90M units**.  
  **Decision:** Fund back pain program (lexical priority over aggregation).  

  #### **Case 3: "Uncomfortable" Outcome**  
  **Scenario:** Animal welfare proposal (improve conditions for 100,000 battery hens) vs. youth orchestra.  
  - **Hen Welfare:**  
    - **Step 2:** Intensity = Level 4 (extreme confinement/pain).  
    - **Step 3:** Tier 1 ESR = 100,000 × 100 × (8,760 hrs × 2 years) × 0.7 = **122.6B units**.  
  - **Youth Orchestra:** 240,000 units (Tier 2).  
  **Decision:** Fund hen welfare (lexical priority).  
  **Why it feels uncomfortable:** Board may undervalue animal suffering or question cross-species comparisons.  
  **Defense:** The charter’s principle ("prevention of intense suffering") does not specify species. Intensity anchors (e.g., confinement = Level 4) apply consistently.  
  **Amendment needed?** Only if the board rejects cross-species comparisons—add a rule: "Suffering intensity must be calibrated to human-analog thresholds."  

  ---

  ### **Systematic Blind Spots**  
  1. **Cross-Species/Condition Comparisons:** Assumes intensity anchors are universal; may overlook cultural or contextual suffering nuances.  
  2. **Long-Term/Indirect Effects:** Cannot capture downstream impacts (e.g., youth orchestra reducing future mental health issues).  
  3. **Distributional Fairness:** Ignores equity (e.g., helping the worst-off vs. aggregate gains).  
  4. **Threshold Ambiguity:** Struggles with duration-intensity trade-offs (e.g., 1 hour of torture vs. 1 year of moderate pain).  
  5. **Uncertainty Cascades:** Compound uncertainty (e.g., efficacy risk + beneficiary count) is oversimplified.  
  6. **Non-Quantifiable Values:** Dismisses symbolic or communal benefits (e.g., gardens fostering social cohesion).  

  ---

  ### **Practical Adjustments**  
  - **Tools:** Use a simple calculator template for ESR/net-benefit math.  
  - **Time Saver:** Pre-rate common conditions (e.g., cataracts = Level 3, factory farming = Level 4).  
  - **Board Training:** Explain that lexical priority is inviolable only for Level 3+ suffering; aggregation governs Tier 2.  
  **Outcome:** This procedure enforces the charter’s core principle while allowing pragmatic aggregation for lower-stakes cases—ending circular debates without eliminating human judgment at critical thresholds.
