     - **No** → **Leaf: Unoccupied View** (There's a fact about timing but no specific location. This view is rare and may be problematic.)

  5. At that place and time, is the brain: 
     - **Assembling** the experience (putting together the pieces)? → **Leaf: 'Second Theater' View** (Some central brain region assembles everything for an audience.)
     - **Broadcasting** an experience that was already assembled elsewhere? → **Leaf: Global Workspace Theory** (A central broadcast happens, but the experience is assembled beforehand in distributed regions.)

  **Note on Orwell vs. Stalinesque:** If you believe there is a fact about the experience and that reports can be wrong (e.g., the experience might have happened at a different time than reported), you might be an Orwellian (memory is rewritten after the fact) or a Stalinesque (the show is edited before it airs) theorist. This tree does not distinguish them because they are empirically indistinguishable.

  Page 2:

  **Explanation of Leaves:**

  - **Multiple Drafts Model (Dennett):** There is no single moment when content becomes conscious. The brain processes information in parallel, and what we report is just the latest draft. No fact of the matter about when or where the experience happened.

  - **Cartesian Dualism:** Consciousness does not happen in the brain but in a non-physical realm (the "Cartesian theater"). The brain might be involved, but the show is elsewhere.

  - **'Second Theater' View:** There is a physical place in the brain (like a central module) where all information comes together and is assembled into a conscious experience for an "audience" (e.g., the self). This is the view Dennett attacks.

  - **Global Workspace Theory:** Conscious content is broadcast from a central workspace to many brain regions, but the content is not assembled there; it is processed in distributed areas and then broadcast.

  - **Unoccupied View:** There is a fact about the timing of experiences but no specific location in the brain where they happen. This view is not commonly held, probably because it is hard to make sense of timing without a physical basis.

  **Inconsistent Intuitions to Watch For:**

  - You might say in the rabbit illusion that you really felt the in-between taps (Yes at Q1) but then struggle to say when it happened (No at Q2) or vice versa.
  - You might believe we can find the timing in the brain (Yes at Q3) but then deny there's a specific place (No at Q4), leading to the unoccupied view, which might feel unstable.

  **Indistinguishable Pairs:** 
  - The tree cannot cleanly separate Orwellian and Stalinesque views because they make the same predictions. 
  - The tree also might not cleanly separate Global Workspace and Second Theater if the subject is unclear about assembly vs. broadcast.

  This should fit within two pages.
answer: |-
  Below is a decision-tree handout designed to sort students based on their intuitions about the color phi, cutaneous rabbit, and probe scenarios, without requiring prior reading. The tree uses only case-based questions phrased for naive intuitions. Key features:  
  - **Targeted leaves**: Cartesian dualism, "second theater," multiple drafts, global workspace.  
  - **Orwell/Stalinesque**: Included but flagged as indistinguishable (per your request, with reasoning below).  
  - **Inconsistent intuitions**: Marked with **(⚠)** at nodes where students often contradict themselves.  
  - **Unoccupied views**: Noted where logical space has gaps.  
  - **Format**: Two pages max, minimal neuroscience ("brain" referenced only as a physical organ).  

  ---

  **Page 1: The Decision Tree**  
  *Answer based on your gut reactions to these cases. No "right" answers—just your intuitions!*  

  **Cases to imagine**:  
  - **Color phi**: A red dot flashes, then a green dot appears nearby. You "see" a dot move *and change color mid-motion* (even though nothing was there).  
  - **Cutaneous rabbit**: Quick taps at your wrist, then elbow. You "feel" taps marching up your arm (including spots never touched).  
  - **Probe question**: If we could "probe" your brain at different times, would it reveal *when* an experience happened?  

  ---

  **START HERE**  
  1. **In the cutaneous rabbit case, when you feel the "in-between" taps (e.g., mid-forearm), do you think you *actually felt* something there?**  
     - **Yes** → Go to Q2  
     - **No** → Go to Q3  

  2. **⚠ In the rabbit case, did you feel the "in-between" taps *before* the physical tap at the elbow happened?**  
     - **Yes** → Go to Q4  
     - **No** → Go to Q5  

  3. **In color phi, when you see the dot "change color while moving," is your later report (e.g., "it turned green *here*") the *only* access to what you experienced?**  
     - **Yes** → Go to Q6  
     - **No** → Go to Q7  

  4. **⚠ If we probed your brain *during* the rabbit illusion, would there be a specific time when the "marching taps" experience *happened*?**  
     - **Yes** → Go to Q8  
     - **No** → **Leaf A: Multiple Drafts**  

  5. **In color phi, is there a fact about *when* the "color change" experience happened (e.g., before/during/after the green dot)?**  
     - **Yes** → Go to Q9  
     - **No** → **Leaf A: Multiple Drafts**  

  6. **⚠ Could your report about color phi be *wrong* (e.g., you report "changing color," but your experience was different)?**  
     - **Yes** → Go to Q10  
     - **No** → **Leaf A: Multiple Drafts**  

  7. **Is the "experience" of the moving/color-changing dot separate from what you’d *report* about it?**  
     - **Yes** → Go to Q9  
     - **No** → **Leaf A: Multiple Drafts**  

  8. **Is the place where the experience "happens" inside the *brain*?**  
     - **Yes** → Go to Q11  
     - **No** → **Leaf B: Cartesian Dualism**  

  9. **⚠ Can we find *where* in the brain an experience like color phi "came together" (e.g., a specific spot)?**  
     - **Yes** → Go to Q11  
     - **No** → **Leaf C: Unoccupied View** (see notes)  

  10. **⚠ Is there a fact about *when* the color change was experienced (e.g., relative to the dots)?**  
      - **Yes** → **Leaf D: Orwell or Stalinesque**  
      - **No** → **Leaf A: Multiple Drafts**  

  11. **At that brain location, is the experience being *assembled* (like building a picture) or *broadcast* (like announcing a finished product)?**  
      - **Assembled** → **Leaf E: Second Theater**  
      - **Broadcast** → **Leaf F: Global Workspace**  

  ---

  **Page 2: Leaf Explanations, Notes, and Instructor Guide**  

  **Leaf Descriptions** (match your end point from the tree):  
  - **A: Multiple Drafts Model** (Dennett’s view): No fact about *when/where* experiences "occur." Consciousness is fragmented, with no central "show." Reports are all we have.  
  - **B: Cartesian Dualism**: Experiences happen in a *non-physical* place (a "mind-space" separate from the brain).  
  - **C: Unoccupied View**: There’s a fact about *timing* but *no specific location* (even in the brain). Rare—likely unexplored or seen as incoherent (how can timing exist without a place?).  
  - **D: Orwell or Stalinesque**: Orwell = memory is edited *after* the event ("retroactive revision"). Stalinesque = experience is edited *before* it "airs" ("pre-presentation processing").  
  - **E: Second Theater**: A *central brain spot* (not non-physical!) assembles experiences for an "audience" (e.g., the self).  
  - **F: Global Workspace Theory**: A brain-wide *broadcast* makes content conscious, but *no assembly* happens there (pieces are processed elsewhere).  

  ---

  **Key Notes for Students**:  
  - **Orwell vs. Stalinesque is indistinguishable in this tree (and in reality!)**. Both explain illusions (e.g., color phi "change" could be edited before [Stalinesque] or after [Orwell]), but they make identical predictions. Philosophers like Dennett argue you *can’t* decide between them—so they’re merged here.  
  - **Other indistinguishable pairs**:  
    - **Global Workspace (F) vs. Second Theater (E)**: If you’re unsure whether "broadcast" implies assembly, these may blur (e.g., is broadcasting just assembly-lite?).  
    - **Multiple Drafts (A) vs. Unoccupied View (C)**: If you deny a "place" but insist on "timing," you might waver between these.  
  - **Unoccupied View (C)**: Logically possible but philosophically unattractive—it avoids dualism but struggles to explain *how* timing exists without a physical basis.  

  ---

  **Instructor Guide: Spotting Inconsistent Intuitions (⚠ Nodes)**  
  Nodes marked **(⚠)** often reveal unstable intuitions. Common student contradictions:  
  - **Q2 (Rabbit timing)**: Students say "in-between" taps are "felt" (Q1: Yes) but then deny they happened *before* the elbow tap (Q2: No)—despite the illusion requiring subjective time-reversal.  
  - **Q4 (Probe timing)**: After affirming subjective time-reversal (Q2: Yes), students may deny a probe could detect it (Q4: No), conflicting with their belief in "felt" timing.  
  - **Q6 (Report error)**: Students often say reports are the "only access" (Q3: Yes) but then admit reports can be "wrong" (Q6: Yes), undermining their earlier view.  
  - **Q9/Q10 (Facthood)**: In color phi, students may insist timing is factual (Q5/Q10: Yes) but deny we can locate it in the brain (Q9: No), leading to the unoccupied view—which many find unsatisfying.  

  **Why this works**:  
  - Focuses on *cases* (not names), forcing engagement with intuitions.  
  - Isolates Dennett’s key move: If you can’t distinguish Orwell/Stalinesque (Leaf D) or hit inconsistencies, you’re pushed toward multiple drafts (Leaf A).  
  - Handout is self-contained for section discussions—students won’t need the readings to debate it.  

  --- 

  **Design Choices Explained**:  
  - **Orwell/Stalinesque as one leaf**: Forced by Dennett’s argument (they’re empirically identical). The tree *can’t* split them cleanly—any question about "when editing happened" would require arbitrary metaphysical commitment.  
  - **Unoccupied View**: Included to expose a gap. Students who land here often retreat to dualism or multiple drafts after discussion.  
  - **Minimal jargon**: "Probe," "assembled," "broadcast" are analogical (no technical terms).  
  - **Efficiency**: Tree resolves in 2–4 questions for most paths.  

  Let me know if you'd like a version with more cases (e.g., adding a node for "partial reports") or adjustments for classroom use!
