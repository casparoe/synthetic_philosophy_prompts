answer: |-
  ## Verdict on Your Suspicion

  You're **mostly right but miss the crucial residue**. The debate *does* largely map onto selection bias, researcher degrees of freedom, and model specification issues. However, the most radical claims (especially White's) introduce a challenge concerning the *ontological status* of the estimand itself that your vocabulary struggles to fully capture without distortion. It's not *just* boring known problems; the "past as fixed estimand" is precisely what's contested.

  ---

  ## Translation into Your Vocabulary

  1.  **Ranke (Optimism):**
      *   **Translation:** The past (`estimand`) exists independently and objectively. Rigorous archival methods (`estimator`) are unbiased and consistent estimators of this estimand, given sufficient data completeness. The archive (`sampling frame`) is assumed to be (or treated as if it is) a near-complete census of the relevant historical facts (`population`). Goal: Minimize variance and bias through meticulous source criticism (`reducing measurement error`).
      *   **Fit:** Clean. Assumes the archive/sampling frame is adequate and the estimator (method) is well-specified.
      *   **Strain:** Assumes the estimand (`the past as it actually was`) is singular, stable, and directly accessible through the archive, ignoring potential frame defects or the constructed nature of archives.

  2.  **Carr (Scepticism):**
      *   **Translation:** The estimand (`the significant past`) is *defined* by the historian's present concerns (`selection criteria`). The archive (`sampling frame`) is inherently incomplete and biased (non-representative sample of the past population). The historian actively selects facts (`non-random sampling`) based on present interests (`selection bias`), constructs interpretations (`model fitting`), and often fails to adequately acknowledge this selection process (`unrecognized researcher degrees of freedom`). Objectivity comes from acknowledging and mitigating these biases.
      *   **Fit:** Very clean. This *is* selection bias, frame problems, and researcher DF in action.
      *   **Strain:** Carr still believes a "true" past estimand exists *in principle*, even if our access is filtered. He focuses on the *selection* of facts, not their fundamental nature.

  3.  **White (Deeper Scepticism):**
      *   **Translation:** The "raw past" (`data generating process?`) isn't a structured estimand; it's chaotic event soup. Historians impose pre-conceived narrative forms (`smoothing functions/model classes` - e.g., Romance, Tragedy, Comedy, Satire) onto sparse, noisy archival fragments (`sparse, noisy data`). Choosing the narrative form (`model class selection`) is driven by aesthetic, ideological, or cultural preferences (`prior beliefs/loss functions unrelated to predictive accuracy`) *before* fitting the details. The resulting narrative (`fitted model`) fundamentally *creates* the historical meaning/estimand (`the past as understood`), it doesn't just estimate it. Different narratives are incommensurate (`non-nested models with different foundational assumptions`).
      *   **Fit:** Clean for the *process*: Model class misspecification, fitting sparse data with strong priors, researcher DF in model choice, non-nested alternatives.
      *   **Strain:** White's core claim is that the narrative form *constitutes* the historical reality/estimand itself. Your vocabulary assumes a pre-existing estimand we try to estimate, even poorly. White denies this – the narrative *is* the historical object. The choice isn't just about fit, it's about *creating* the subject of inquiry.

  ---

  ## Residue Report

  1.  **Clean Survival:**
      *   **Selection Bias & Frame Problems (Carr):** This maps perfectly. The archive is an imperfect sampling frame; historian choices introduce non-random sampling.
      *   **Researcher Degrees of Freedom (Carr & White):** Choosing *which* facts, *which* interpretations, *which* emphasis – classic DF affecting the outcome.
      *   **Model Specification/Misspecification (White):** Choosing a narrative *form* is analogous to choosing a model class (linear vs. tree-based vs. neural net) with inherent biases before seeing how well it fits the specific data. The fit might be poor, but the form dictates the interpretation.

  2.  **Survival with Distortion:**
      *   **White's Narrative Constitutiveness:** Translating narrative imposition as "model class misspecification" distorts White. Misspecification implies a *bad fit* to a *preexisting* estimand. White argues the narrative *creates* the estimand itself. Your vocabulary lacks a clean term for "the act of inquiry fundamentally constructs the object of study." This requires bending "model class selection" into an *ontological* rather than purely *epistemological* act.

  3.  **No Direct Counterpart (The Real Residue):**
      *   **The Ontological Status of the Estimand:** Your vocabulary fundamentally assumes a **fixed, pre-existing estimand** (`causal effect`, `future value`, `population mean`) that exists independently of the estimation process. The core radical challenge from White (and hinted at by Carr) is that **the historical "estimand" (the meaningful past) is not fixed or independent.** It is *constituted* or *brought into being as a specific kind of object* by the narrative choices (`model class/form`) made during the inquiry. The "past" Ranke wanted to estimate only becomes a coherent *estimand* ("The Tragedy of the Thirty Years War," "The Rise of the Bourgeoisie") *through* the narrative imposition. This idea – that the object of knowledge is constructed by the method of knowing – is alien to the standard statistical framework where the estimand is defined *a priori* (e.g., ATE, next quarter's sales). It's not just error in estimation; it's about what *counts* as the thing to be estimated.

  **Conclusion:** Your instinct is powerful – much of the debate *does* reduce to known statistical challenges. **But the residue is significant:** the radical sceptics challenge the very idea that history *has* a stable, independent estimand waiting to be discovered/estimated. For them, the narrative process *defines* the historical object. Your vocabulary assumes the estimand is given; theirs argues it's made. This doesn't mean your tools are wrong, but it highlights a fundamental philosophical difference about the nature of historical reality and knowledge that stats, focused on estimating predefined quantities, doesn't inherently address. The debate isn't *less* substantive, it's engaging a different layer – ontology, not just epistemology.
