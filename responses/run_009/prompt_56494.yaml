answer: |-
  ## Memory Politics Quiz: Where Do You Stand?

  **Instructions:** For each scenario, pick the answer that feels *most right* to you. Don't overthink it – go with your gut reaction!

  1.  **The Forgotten Strike:** A small town's textile mill closed abruptly 50 years ago after a bitter, failed strike. Most workers moved away. The town library has limited space. Should they dedicate a permanent exhibit with photos and artifacts documenting the strike and closure?
      *   **A)** Yes, it's an important part of the town's history and the workers' struggle.
      *   **B)** No, it was a painful but ordinary injustice; resources are better spent elsewhere.
      *   **C)** Only if current residents or descendants request it and help maintain it.

  2.  **Digital Memorials:** A website memorializes victims of a major industrial disaster. Each victim has a dedicated page. The designers propose that after 25 years, these pages are no longer surfaced in general searches or recommendations; they’d only be accessible via direct link or deep archive search (not deleted, just "demoted"). What do you think?
      *   **A)** No, demotion is disrespectful. The victims deserve perpetual prominence.
      *   **B)** Yes, after 25 years, demotion allows the living to focus forward without erasing the past.
      *   **C)** Only if the affected community (survivors/families) votes to implement the demotion feature.

  3.  **Ancient Grievance:** Historians uncover clear evidence that 800 years ago, Kingdom A brutally conquered and displaced the people of Kingdom B from fertile lands. Descendants of Kingdom B still live in the less fertile region. Should descendants of Kingdom A feel any obligation to formally acknowledge or commemorate this event?
      *   **A)** Yes, acknowledging past wrongs, even ancient ones, is important for historical truth.
      *   **B)** No, this is too far in the past; there's no meaningful connection or obligation today.
      *   **C)** Only if the descendants of Kingdom B feel it's necessary for current relations or identity.

  4.  **Ritual vs. Record:** A community holds an annual, emotionally intense ceremony reliving a traumatic event from its past. Some argue this ritual causes more pain than healing and propose replacing it with a quiet day of reflection and ensuring the event is thoroughly documented in the local museum/schools.
      *   **A)** Keep the ritual. The intensity honors the suffering and keeps the memory alive.
      *   **B)** Replace it. Documented knowledge preserves the facts without retraumatizing.
      *   **C)** Let the community decide through dialogue; either could be valid depending on current needs.

  5.  **The Amnesty Dilemma:** After a civil war, a Truth and Reconciliation Commission (TRC) is set up. To encourage perpetrators to testify fully and reveal hidden graves, the TRC offers amnesty for crimes *if* full truth is told. Victims' families oppose amnesty, demanding justice. Is the amnesty-for-truth trade-off justified?
      *   **A)** No. Justice is paramount; amnesty betrays the victims.
      *   **B)** Yes. Sometimes truth and reconciliation require pragmatism over punishment to heal society.
      *   **C)** It's a necessary but painful compromise if it leads to genuine societal healing.

  6.  **Statue Standoff:** A controversial statue of a historical figure, linked to colonial oppression but also celebrated for other reasons, stands in a city square. Debates rage for years, causing division. What should be done?
      *   **A)** Keep it. Removing it erases history; add context explaining the full legacy.
      *   **B)** Remove it to a museum. Its public prominence causes ongoing harm; preserve it historically.
      *   **C)** Remove it entirely. Its presence impedes moving forward together.

  7.  **Remembering the "Ordinary" Evil:** Should a society feel a strong, ongoing duty to formally remember and teach about widespread systemic injustices that caused deep suffering but weren't genocidal (e.g., harsh indentured labor systems, discriminatory laws that weren't explicitly "crimes against humanity")?
      *   **A)** Yes, any grave systemic wrong creates a duty to remember and learn from it.
      *   **B)** Focus resources on remembering only the most extreme atrocities (genocide, slavery). These others are important history but don't carry the same *duty*.
      *   **C)** Remember them primarily if they directly shape current inequalities or conflicts; otherwise, let history texts handle it.

  8.  **The Outsider's Duty:** You live in Country X. A genocide occurred in Country Y 30 years ago, documented by international tribunals. Country Y itself is divided on how to remember it. Do people in Country X have any duty to actively commemorate that genocide?
      *   **A)** Yes, as humans, we have a duty to bear witness to radical evil everywhere.
      *   **B)** The primary duty lies with Country Y. Outsiders should support survivors but not dictate commemoration.
      *   **C)** Only if it directly relates to Country X's own actions or responsibilities, or serves as a universal lesson against hatred.

  ---

  ### Scoring Key: What Does Your Pattern Reveal?

  Tally how many times you chose each letter (A, B, C). Your dominant pattern points to your leaning:

  *   **Mostly A's: The "Never Forget" Maximalist.** You believe every grave wrong, big or small, creates a profound, perpetual duty to remember. Erasure is a moral failing. Commemoration and knowledge preservation are both vital. (You likely opposed demotion, removal, amnesty, and emphasized outsider duties).
  *   **Mostly B's (on Q1, Q2, Q4, Q7) + Contextual on others: The Margalit Distinction.** You see a strong ethical duty to remember, but primarily for **radical evil** (genocide, crimes against humanity). For other significant injustices, remembrance is valuable history but lacks the same absolute moral obligation. Pragmatic steps (like demotion or moving statues) might be acceptable for non-radical evils once facts are preserved. (You likely differentiated between radical evil and other injustices).
  *   **Mostly B's (especially on Q2, Q3, Q5, Q6) + C on Q2: The Rieff-Style Pragmatist.** You prioritize societal healing and moving forward. You worry that perpetual, intense remembrance, especially of non-radical evils or ancient wrongs, can fuel grievance and division. You favor letting some things fade, accepting pragmatic compromises (like amnesty-for-truth), and believe the *form* of memory matters (e.g., demotion, moving statues). Knowledge preservation is less contested than ritual. (You likely supported demotion, removal, amnesty, and downplayed ancient/outsider duties).
  *   **Mostly C's (especially on Q2, Q3, Q8) + B/C on Q5: Reconciliation-First Instrumentalist.** The value of memory is entirely tied to its ability to foster repair and better relations *between groups* in the *present*. If remembering serves reconciliation, do it intensely. If it hinders it, scale back. The affected community's agency is crucial (e.g., *they* decide on demotion). Truth commissions are valuable tools. Memory fades when its instrumental purpose is served. (You heavily favored community agency and the *current* need for repair).
  *   **Strong B on Q4 + Mixed (often A/B) elsewhere: The Archivist.** You sharply distinguish *remembering-as-knowledge* (preserving facts, documents, evidence) from *remembering-as-commemoration* (rituals, monuments, public prominence). You fiercely defend the first as essential historical record. The second is optional, context-dependent, and often problematic if forced or retraumatizing. Demotion of digital memorials is fine; replacing rituals with archives is ideal. (Q4 was your clearest tell).

  ### Notes on Mixed Bags & Blind Spots

  *   **Incoherent/Unattractive?** Someone voting **A (Maximalist)** on *everything* **but** also voting **B (Yes)** on Q2 (Digital Demotion) is inconsistent. Maximalism implies perpetual *prominence*, not just existence. This combo suggests conflicting intuitions about digital space vs physical commemoration.
  *   **Unexplored?** A mix favoring **C (Community/Instrumental)** but with **A (Maximalist)** on radical evil (Q7/Q8) is plausible but sits between Margalit and Reconciliation views. Does the duty persist *beyond* the community's need for reconciliation? That's a nuanced, underexplored position.
  *   **Hard to Separate:** Distinguishing **Margalit (B)** from **Reconciliation-First (C)** can be tricky. Both might support demotion (B/C on Q2) or community agency (C on Q3/Q8). The clearest separator is often **Q5 (Amnesty):** Margalits lean **A (No Amnesty - Justice)**, Reconciliationists lean **B/C (Yes/Pragmatic)**. **Rieff (B)** and **Archivist (B on Q4)** also share pragmatic instincts on form, separated by the Archivist's core knowledge/commemoration split (Q4).
