prompt: |-
  I'm a third-year PhD student in ethics writing a chapter on whether moral considerations keep their valence fixed across contexts or can flip from reasons in favor to reasons against. My supervisor has a ritual I've come to depend on: at the end of every supervision she poses a hypothetical and issues a ruling. Three years in, I've logged enough rulings that I suspect there's a system, and I'd like to know whether I can treat her as a generalist or a particularist before I build my framework around her intuitions. Here is the log:

  - Lying to the murderer at the door to protect the fugitive upstairs: permissible, perhaps required.
  - Breaking a promise nobody else knows about, whose keeping benefits no one and costs you a weekend, where the promise was freely made and the promisee still cares: impermissible. She said the fact of the promise settles it.
  - Telling a colleague, at her explicit insistence that only bluntness would get through, exactly how bad her manuscript is: required. When I pressed her on whether the harshness was a regrettable means to a good end, she said no — the harshness was part of what made it right here.
  - Pushing the large man off the footbridge: impermissible. Diverting the trolley via the switch: permissible.
  - A promise extracted by threat ("Promise you'll never move abroad, or I'll hurt myself"): void. She insisted it gives you no reason at all, not even an outweighed one.
  - Keeping a promise that foreseeably causes moderate harm to a bystander: impermissible.

  Next week she'll rule on three cases, and I'd like your prediction before I hear hers:

  (a) You can perform one of two otherwise exactly similar actions. One gives a stranger a small pleasure — but only because he falsely believes it harms someone he despises; no one is actually harmed either way. Is the pleasure-giving action better, worse, or neither?
  (b) A freely made deathbed promise, sincerely sought by the promisee, to visit her grave every year. She has now died; the visits are known to no one, benefit no one, and cost you something each time. Are you still required to go?
  (c) A freely made promise to a living promisee who still cares about it, but whose circumstances have changed so that keeping it now distresses her — though she refuses to release you, because she thinks promises matter.

  To my eye, both a Ross-style pluralism on which considerations have fixed valence and variable weight, and a Dancy-style holism on which their valence itself shifts with context, can accommodate all six logged rulings — though not at the same points. So what I want from you is: the candidate rules that fit her track record (including any I haven't considered); what each predicts for (a), (b), and (c); your own best guess at the rule she's actually running and why you prefer it; which of my six logged rulings is doing the most ambiguous work; and the single further hypothetical I could put to her that would best divide the remaining candidates.
reasoning: |-
  Hmm, this is a fascinating challenge from a PhD ethics student. They're trying to reverse-engineer their supervisor's moral framework based on past rulings, with the goal of classifying her as either a generalist (like Ross) or a particularist (like Dancy). The six existing rulings present an interesting pattern that could support either interpretation. 

  Let me unpack what the student is really after. They're not just asking for predictions on new cases - they're trying to build an epistemological framework around their supervisor's intuitions for their thesis chapter. That's ambitious! The subtext is they need to know if these intuitions form a consistent system before relying on them academically.

  Looking at the log:
  - The "murderer at the door" case suggests consequences can override truth-telling
  - But the "pointless promise" case shows promises have intrinsic weight
  - The "blunt feedback" ruling is intriguing - she sees harshness as constitutive of the right action, not just instrumental
  - The trolley variations confirm standard deontological distinctions
  - The "coerced promise" being void entirely is a strong particularist signal
  - The "harmful promise" ruling shows promise-weight isn't absolute

  For the new cases:
  - (a) tests whether moral valence depends on subjective states or objective outcomes
  - (b) probes whether promise obligations survive the promisee's death
  - (c) examines if promises bind even when they cause distress to the promisee

  The real puzzle is why both Rossian and Dancyan frameworks can explain the existing rulings. Ross would say valence is fixed but weight varies, while Dancy would say valence itself flips. The coerced promise case (#5) is the strongest evidence for valence-flipping, but Rossians could argue coercion negates the prima facie duty entirely rather than reversing it.

  I think the supervisor might be operating with a nuanced form of particularism that distinguishes between:
  1) "Undermining" contexts that erase a reason (like coercion voiding promises)
  2) "Enabling" contexts that activate reasons (like the request for bluntness making harshness required)
  3) "Intensifying" contexts that amplify reasons (like the fugitive's peril making lying not just permissible but required)

  For predictions:
  - In (a) she'll likely say the pleasure is worse because of the malicious intent
  - In (b) she'll probably release from the promise since no one benefits
  - In (c) she might rule that keeping the promise is impermissible because it harms the promisee

  The most ambiguous existing ruling is #3 - does "harshness being part of what made it right" show valence-flipping (truth-telling becoming harsh-truth-telling as a positive feature) or just contextual weighting? A good follow-up hypothetical would test whether a moral consideration can actively count against an action in one context after counting for it in another.
answer: |-
  Based on your supervisor's rulings, she appears to be a **moderate particularist** (in the Dancy-style holism tradition) with a deontological core, where moral reasons can *genuinely change valence* depending on context, rather than merely having variable weights. Below is a systematic breakdown of candidate rules, predictions, and diagnostic tools for your framework.

  ---

  ### **Candidate Rules Fitting Her Rulings**
  1. **Rossian Generalism (Fixed Valence, Variable Weight)**  
     - Promises always provide pro-tanto reasons *for* keeping them; lying always provides reasons *against*. Valence is fixed, but weight varies.  
     - *Accommodates Rulings*:  
       - Lying to murderer (saving life outweighs truth-telling).  
       - Pointless promise (promise-weight dominates when no countervailing reasons).  
       - Trolley (killing vs. letting die: different weights).  

  2. **Dancy-style Holism (Valence Shifts with Context)**  
     - Valence of reasons (e.g., promise-keeping, truth-telling) *flips* based on enabling/undermining conditions.  
     - *Accommodates Rulings*:  
       - Coerced promise: void, not outweighed (promise *loses all valence*).  
       - Harsh feedback: truth-telling *gains positive valence* due to the colleague’s request.  
       - Harmful promise: keeping flips to *wrong* due to bystander harm.  

  3. **Hybrid: Constrained Particularism**  
     - Core deontic features (promises, harm) have default valence, but context can *invert* valence under specific triggers (e.g., consent, coercion, harm).  
     - *Best Fit*: Explains all rulings without strain.  

  ---

  ### **Predictions for (a), (b), (c)**
  | Case | Rossian Prediction | Holist Prediction | **My Prediction (Her Likely Ruling)** |  
  |------|-------------------|-------------------|--------------------------------------|  
  | **(a)** Pleasure via false belief | *Better* (pleasure is good; false belief is irrelevant if no harm). | *Worse* (pleasure’s valence flips due to malicious intent; exploiting vice is bad). | **WORSE** ("Giving pleasure rooted in malice isn’t a good—it corrupts.") |  
  | **(b)** Deathbed promise | *Required* (promise-keeping has fixed valence; death doesn’t void it). | *Not required* (promise loses valence: no recipient, no benefit, cost without purpose). | **NOT REQUIRED** ("Promises bind the living, not the dead. No one is wronged by skipping.") |  
  | **(c)** Promise causing distress | *Required* (promise-weight outweighs distress). | *Impermissible* (distress flips valence; refusal to release signals dysfunction). | **IMPERMISSIBLE** ("A promise that harms the promisee defeats its own purpose.") |  

  **Why Holist Predictions Fit Best**:  
  - Her rulings show valence shifts when promises lack autonomy (#5), cause harm (#6), or truth-telling serves relational goods (#3).  
  - She rejects "outweighed but present" reasons (#5: coerced promise gives "no reason at all").  

  ---

  ### **Most Ambiguous Logged Ruling**  
  **#3 (Blunt feedback)** does the heaviest lifting:  
  - **Rossian reading**: Truth-telling + beneficence outweigh harshness.  
  - **Holist reading**: The colleague’s request *transforms harshness* into a positive reason (it "makes it right here").  
  - **Why ambiguous**: It could support either, but her rejection of "regrettable means" suggests valence flip, not weighting.  

  ---

  ### **Key Diagnostic Hypothetical to Divide Candidates**  
  **The Case**: *You promise a friend to help them cheat on a test. They later regret asking but insist you keep the promise. Is keeping it permissible?*  
  - **Rossian Prediction**: Impermissible (promise outweighed by dishonesty harm).  
  - **Holist Prediction**: Impermissible (cheating *undermines* the promise’s valence entirely).  
  - **Why it Divides**:  
    - If she says "void, no reason to keep" → Strong holism (valence flip).  
    - If she says "outweighed by harm" → Rossian/generalist.  
    - Her ruling on #5 (coerced promise void) suggests she’ll lean holist here.  

  ---

  ### **Conclusion**  
  **Her Likely Framework**: **Moderate particularism** where:  
  - Promises have default positive valence *unless* coerced, harmful, or pointless.  
  - Harm/consent act as valence-shifters (e.g., #6 harm flips promise to negative).  
  - Intent/relational context transforms reasons (#3, #5).  

  **Recommendation**: Build your framework around her intuitions as holist, but test the cheating hypothetical. If she voids the cheating promise, it confirms valence-flipping; if she calls it outweighed, she may be a Rossian with strict triggers. The deathbed promise (b) will also be telling—if she releases you, holism is likely.  

  *Good luck with the chapter—this is a razor-sharp diagnostic approach!*
