prompt: |-
  I'm a third-year student taking a seminar on irrationality, and we are finishing a unit on self-deception: the classic paradox (that to deceive yourself you must in some way register the very thing you are hiding from yourself), Sartre's bad faith, and the deflationary accounts on which self-deception is just belief-formation steered by motivation, with no mind partitioned against itself. Outside class, I work as a peer mentor in my university's academic support program: six first-year students on academic probation, one twenty-minute meeting with each per week, my job being to keep them engaged and to refer them onward when something looks serious. The hardest part is knowing what to do with a mentee's optimism. Some tell me they will get into the nursing program although their GPA sits far below the published admission average and they avoid opening the program's website; some explain a string of failing grades by saying each professor had it in for them; some appear to perform the sour-grapes move in reverse, deciding that a major they are failing was never what they wanted anyway; and some, I believe, hold a plain and reasonable hope that is simply keeping them going. My seminar says these are different states with different remedies — wishful thinking, self-deception, adaptive preference, justified hope — but it says so in the abstract, and in twenty minutes with a nineteen-year-old I need something I can actually run. Please write a procedure for the mentor-training binder, usable by other mentors with no philosophy background: the questions to ask in order, what counts as a sufficient answer at each step, where the procedure ends with a no (for example, where the facts are genuinely contested, as with the professor's grudge, and the pattern of evidence-handling is all I can classify, not the truth of the claim), and where it hands the decision to a person because what remains is a question of values — such as whether a sustaining but false hope should be punctured at all. Ground it in what the philosophy actually supports: selective treatment of counterevidence in this domain versus others, avoidance of the sources that would test the belief, whether the belief tracks the available information the way the same student tracks it elsewhere, and whether the belief formed to fit a motive rather than the reverse. Be honest about which steps are judgment calls dressed up as procedure, and about the deeper limit — that from the outside, self-deception, sincere conviction, and clumsy hope can look identical, so the procedure at best licenses predictions about how a mentee will handle evidence, never claims about what they privately believe. Then run it on three mentees: one certain she will get into the nursing program despite the GPA gap; one who attributes each failing grade to a different professor's grudge; and one whose belief that he will make the pre-med track is, by my lights, probably self-deception, yet is visibly the only thing getting him to class in the morning. On that last one, I suspect the procedure will tell me to leave the belief intact, which I will not like — if so, say it plainly, and close by stating what the procedure cannot do at all.
reasoning: |-
  Okay, the user is a third-year student in a seminar on irrationality, specifically self-deception. They're also working as a peer mentor for first-year students on academic probation. The challenge they're facing is distinguishing between different types of optimism in their mentees—like wishful thinking, self-deception, adaptive preference, and justified hope—and figuring out how to handle each in their short weekly meetings. They need a practical procedure that can be used by mentors without a philosophy background, grounded in philosophical concepts but actionable in real-world scenarios.

  First, I need to break down the philosophical concepts they mentioned: self-deception paradox, Sartre's bad faith, and deflationary accounts. The key elements are how individuals handle counterevidence, avoid information sources, and whether beliefs are motivated by desires rather than evidence. The user wants a step-by-step guide that mentors can follow, with clear questions, criteria for answers, and decision points.

  The user also wants the procedure to acknowledge its own limitations—where judgment calls are necessary, and where values come into play. They mentioned three specific mentee examples: one with unrealistic nursing program hopes, one blaming professors, and one whose self-deception might be functional. The procedure must handle these cases and explicitly state when to leave a belief alone even if it's false, because puncturing it could be harmful.

  Looking deeper, the user might be struggling with the ethical dilemma of when to challenge a mentee's belief versus when to support them. They need a structured approach to make consistent decisions without overstepping their role as a mentor. The unspoken need here is confidence in their actions and clarity on their boundaries—knowing when to refer to professionals and how to balance honesty with compassion.

  I'll structure the procedure around evidence handling, information avoidance, consistency, and belief formation. Each step should have specific questions, criteria for answers, and outcomes. For instance, Step 1 assesses how the mentee deals with counterevidence. If they acknowledge it but reinterpret it, that's different from outright denial. Step 2 looks at avoidance of information, like not checking the nursing program's website. Step 3 checks if their approach is consistent with other areas of their life. Step 4 evaluates if the belief formed because of a desire rather than evidence.

  The procedure must clearly differentiate between adaptive preferences, self-deception, wishful thinking, and justified hope. For example, if a mentee avoids information (Step 2) and selectively handles evidence (Step 1), but shows inconsistency (Step 3), that points to self-deception. If they acknowledge evidence but reinterpret it adaptively, it might be adaptive preference. Justified hope would involve all steps showing no red flags.

  For the case studies: the nursing program aspirant likely shows high evidence resistance and avoidance, indicating wishful thinking. The one blaming professors might have selective evidence handling but no avoidance, so it's ambiguous—possibly self-deception if inconsistent elsewhere. The pre-med student whose belief is functional might pass Steps 1-3 but fail Step 4, as the belief is motive-driven. However, if puncturing the belief removes their motivation, the procedure advises support unless harm is imminent.

  The limitations section needs to emphasize that mentors can't access private beliefs, only predict evidence handling. Values decisions, like whether to challenge a false hope, should be referred to supervisors. This addresses the user's concern about the pre-med case, where the procedure might suggest non-intervention despite personal discomfort.

  Finally, the user needs reassurance that the procedure is a tool, not a solution, and that some situations require professional judgment. Highlighting that mentors should document patterns and escalate when necessary covers the ethical aspect and protects both mentor and mentee.
answer: |-
  Here is a practical, philosophy-grounded procedure for peer mentors, designed for the training binder. It focuses on observable *behavior* (evidence handling, information seeking, consistency) rather than diagnosing internal states, acknowledging the inherent limitations of external observation.

  **Procedure: Assessing Student Optimism in Academic Contexts**

  **Purpose:** To help mentors distinguish between potentially problematic patterns of belief (wishful thinking, self-deception, adaptive preference) and potentially functional hope, guiding appropriate support or referral. Focuses on *how* the student handles information relevant to their belief, not the absolute truth of the belief.

  **Core Philosophy Principles Used:**
  1.  **Selective Treatment of Counterevidence:** Does the student acknowledge, dismiss, or reinterpret facts that contradict their belief differently than they handle evidence in other areas or for less emotionally charged beliefs? (Key to self-deception/deflationary accounts).
  2.  **Information Avoidance:** Does the student avoid sources or actions that could easily confirm or disprove their belief? (Classic sign of motivated reasoning/bad faith).
  3.  **Cross-Domain Consistency:** Does the student apply similar standards of evidence gathering and evaluation to this belief as they (reportedly) do to other academic/non-academic matters? (Highlights inconsistency suggestive of motivation-driven belief).
  4.  **Belief Formation Direction:** Does the belief appear to *follow* a strong desire/need ("I want X, therefore X is true/likely"), rather than arising *from* a dispassionate assessment of evidence? (Core to motivation-steered belief formation/deflationary accounts & wishful thinking). *Note: This is often inferred from 1-3.*

  **Important Limitations & Disclaimers (MUST READ):**
  *   **No Mind-Reading:** We cannot know a student's *private* beliefs or intentions. We can only observe their *reported* beliefs and *behavior* around evidence. This procedure assesses patterns of evidence-handling, not the truth of the belief itself.
  *   **The Indistinguishability Problem:** From the outside, sincere conviction, self-deception, and simple hope often look identical *in the moment*. This procedure identifies *patterns* that predict *how the student is likely to handle future evidence*, not what's "really" in their mind.
  *   **Judgment Calls:** Steps 3 (Consistency) and 4 (Formation Direction) involve significant mentor inference based on limited interaction. Be transparent in notes about uncertainty.
  *   **Values Decisions:** Determining *if* or *when* to challenge a potentially false but sustaining belief involves ethical and practical values (well-being, autonomy, honesty) beyond this procedure's scope. It flags potential issues but leaves the intervention decision to the mentor/supervisor, often requiring referral.
  *   **Not Truth Arbitration:** The procedure explicitly avoids deciding if claims like "the professor had it in for me" are *true*. It focuses *only* on how the student handles evidence *for and against* that specific claim.

  **The Procedure:**

  1.  **Identify the Belief & Motive:**
      *   *Ask:* "What specifically are you hoping for/believing about [situation - e.g., getting into nursing, your grades, changing majors]? What makes that important to you right now?" (Probe for the specific belief and the underlying desire/need - e.g., "I *will* get into Nursing," "Prof X *unfairly* failed me," "I *never really wanted* Pre-Med anyway").
      *   *Sufficient Answer:* A clear statement of the belief in question and an identifiable underlying motive (desire for success, need to avoid blame/shame, need for control, need to reduce anxiety).
      *   *Outcome:* Proceed. If belief/motive is unclear, gently probe until it is.

  2.  **Assess Counterevidence Handling (Selective Treatment):**
      *   *Ask:* "What are the main things that make achieving [belief] difficult or uncertain? What facts might suggest it might not work out the way you hope?" (e.g., GPA gap, program competitiveness, past failed courses, specific assignment feedback).
      *   *Observe/Ask Follow-up:* How does the student respond to this counterevidence?
          *   Acknowledge & Engage: ("Yes, my GPA is low, that's why I'm focusing on raising it this term.")
          *   Dismiss/Minimize: ("That GPA requirement isn't *really* strict," "Those failed quizzes didn't count for much anyway.")
          *   Reinterpret/Excuse: ("The admissions average is high because *other* people have low GPAs, not me," "I only failed because the professor's tests are unfair.")
          *   Evade/Ignore: (Changes subject, gives vague non-answer).
      *   *Sufficient Answer:* Any observable pattern (Acknowledge, Dismiss, Reinterpret, Evade).
      *   *Outcome:* Proceed. Pattern noted (especially Dismiss, Reinterpret, Evade flags potential issue).

  3.  **Assess Information Seeking/Avoidance:**
      *   *Ask:* "What steps have you taken to get clearer information about [belief]? (e.g., checked the program website thoroughly, talked to the prof about grades, researched alternative majors?)" "Is there any information you've been avoiding?"
      *   *Observe:* Does the student report concrete actions to get relevant facts? Do they admit to or show signs of avoidance (e.g., "I know the website says X, but...", "I don't want to talk to the prof," "I haven't looked yet")?
      *   *Sufficient Answer:* Report of actions taken (or not) and acknowledgment (or not) of avoidance.
      *   *Outcome:* Proceed. Active avoidance is a strong red flag. Lack of initiative *may* be.

  4.  **Assess Cross-Domain Consistency (Judgment Call):**
      *   *Ask/Infer:* "How do you usually figure out if something is likely to happen or true, like planning a trip or choosing a phone?" Compare this general approach (as described) to their approach to the *target belief* (from Steps 2 & 3).
      *   *Observe:* Is there a significant mismatch? (e.g., "I research everything before I buy!" but avoids nursing program info; "I always admit when I mess up a recipe" but blames professors exclusively for failures).
      *   *Sufficient Answer:* Mentor's reasoned judgment on whether the student's approach to the target belief seems inconsistent with their reported general approach to evidence *or* their approach to other, less emotionally charged, academic tasks (e.g., choosing a minor).
      *   *Outcome:* "Consistent," "Inconsistent," or "Unclear." Inconsistency is a red flag.

  5.  **Assess Belief Formation Direction (Inference/Judgment Call):**
      *   *Infer:* Based on Steps 1-4, does it seem plausible the belief *arose primarily from the motive* identified in Step 1, rather than a dispassionate review of evidence? (Look for clusters of Dismiss/Reinterpret/Evade counterevidence + Avoidance + Inconsistency).
      *   *Sufficient Answer:* Mentor's reasoned inference: "Likely Motivated" (belief follows desire), "Likely Evidence-Based," or "Unclear."
      *   *Outcome:* Inference noted.

  **Interpretation & Action Guide:**

  Based on the patterns observed, categorize the *pattern* and suggest mentor focus:

  *   **Pattern Suggests Wishful Thinking / Naive Optimism:**
      *   *Signs:* Dismisses/Minimizes counterevidence (Step 2), Little active seeking *or* mild avoidance (Step 3), Consistency may be unclear (Step 4), Belief likely Motivated (Step 5). May acknowledge facts superficially but not internalize implications.
      *   *Mentor Focus:* **Gentle Reality Testing & Concrete Planning.** "Okay, you're hopeful about Nursing. Let's look together at the admission stats and your current GPA. What specific GPA do you need this term to have a realistic shot? What's your plan to achieve that?" Focus on actionable steps and connecting current reality to future goal. Refer if avoidance persists or plans are unrealistic.

  *   **Pattern Suggests Self-Deception / Motivational Bias (Deflationary):**
      *   *Signs:* Actively Reinterprets/Excuses counterevidence (Step 2), Clear Information Avoidance (Step 3), Inconsistent evidence standards (Step 4), Belief Likely Motivated (Step 5).
      *   *Mentor Focus:* **Explore Evidence Handling, Not Truth.** Avoid arguing the belief (e.g., "The prof didn't have a grudge"). Focus on process: "I hear you feel Prof X was unfair. What specific feedback did you get on the assignments? Did you discuss it with them? What would convince you otherwise?" "You're avoiding the nursing website – what worries you about looking?" Goal is to highlight *their own pattern* of handling information. **Highly Likely Referral Candidate.** Document pattern for supervisor/professional staff. The belief itself may be deeply entrenched and protecting self-esteem; direct challenge by a peer mentor is often ineffective/risky.

  *   **Pattern Suggests Adaptive Preference (Sour Grapes Reverse):**
      *   *Signs:* May Acknowledge counterevidence but quickly Reinterpret it *as positive* (Step 2 - "Failing proves I didn't want it anyway"), Little seeking/avoidance (may have given up), Consistency may be unclear, Belief Likely Motivated (to reduce dissonance/pain).
      *   *Mentor Focus:* **Explore Values & Alternatives, Not the Reversal.** Don't challenge the new preference ("Do you *really* not want it?"). Focus forward: "Okay, so Pre-Med isn't feeling right. What *are* you interested in exploring now? What skills do you enjoy using?" Help connect with exploratory resources (career center, intro courses). Refer if devaluation seems extreme or linked to depression.

  *   **Pattern Suggests Justified/Functional Hope:**
      *   *Signs:* Acknowledges counterevidence realistically (Step 2), Seeks relevant information (Step 3), Consistent evidence standards (Step 4), Belief Formation unclear or Evidence-Based (Step 5). Hope is based on a *possible*, albeit difficult, pathway.
      *   *Mentor Focus:* **Support & Strategize.** "You're aware it's tough, but you have a plan. How can I support that plan this week? What obstacles do you foresee?" Reinforce realistic effort and problem-solving.

  **Crucial Values Decision Point (Post-Classification):**
  *   *Ask:* "Even if the belief pattern is potentially problematic (e.g., wishful thinking, self-deception), is it *currently functional*? Is it the primary thing motivating positive academic behaviors (attendance, effort) without which the student might disengage?"
  *   *Mentor Judgment/Consultation:* If the belief is likely false/motivated *but* demonstrably functional and sustaining essential effort, **puncturing it is often contraindicated at this level**. Focus support on process and achievable sub-goals *within* their framework. **Referral is strongly recommended if:**
      *   The belief is leading to harmful actions (e.g., taking on huge debt for an impossible goal).
      *   The avoidance/denial prevents accessing necessary support (accommodations, tutoring).
      *   There are signs of significant distress beyond academic struggles.
      *   *Decision to challenge a functional belief requires supervisor consultation.*

  ---

  **Application to Case Studies:**

  1.  **Nursing Program Certainty (GPA Gap, Avoids Website):**
      *   Step 1: Belief: "I *will* get in." Motive: Strong desire to be a nurse, family expectation?
      *   Step 2: Likely **Dismisses/Minimizes** counterevidence (GPA gap, competitiveness). "It's not that strict," "I just need to try harder."
      *   Step 3: **Clear Avoidance** (avoids website).
      *   Step 4: Likely **Inconsistent** (probably researches other things thoroughly).
      *   Step 5: **Likely Motivated** (belief follows strong desire).
      *   *Pattern:* **Self-Deception / Motivational Bias.**
      *   *Mentor Focus:* Explore evidence handling. "You mentioned avoiding the program site. What concerns you about looking at the details?" "What GPA would actually be competitive based on what you know?" (If they don't know: "How could we find out?") **Document pattern. Referral highly recommended.** Focus meeting on concrete steps for *current* semester (improving GPA now) without directly attacking the long-term belief. Avoidance prevents realistic planning.

  2.  **Failing Grades Due to Professor Grudges:**
      *   Step 1: Belief: "Each F was due to a *unique* professor's grudge." Motive: Need to avoid self-blame, protect self-esteem.
      *   Step 2: **Reinterprets/Excuses** counterevidence (feedback, test content). "Feedback was vague/critical because they disliked me."
      *   Step 3: **Likely Avoidance** of discussing grades with professors or reviewing feedback deeply. May *not* avoid knowing the grade itself.
      *   Step 4: **Judgment Call:** Are they generally prone to blaming others? Or is this specific to academic failure? **Often Unclear or Inconsistent.**
      *   Step 5: **Likely Motivated** (belief protects self-image).
      *   *Pattern:* **Self-Deception / Motivational Bias** (if inconsistency is evident). *However, the truth of the grudge claim is genuinely unknowable to the mentor.*
      *   *Mentor Focus:* **Focus entirely on evidence handling process.** "I hear you feel Prof Y was unfair. What specific feedback did you get on the midterm? Did you talk to them about it? What would need to happen for you to feel Prof Z *didn't* have a grudge?" **Do NOT attempt to adjudicate the grudge.** The key issue is the pattern of externalizing blame and avoiding constructive engagement with feedback, which harms learning. **Referral recommended** if pattern is strong and impacts current courses. Focus meeting on strategies for engaging with *current* professors/feedback constructively, regardless of feelings.

  3.  **Pre-Med Hope as Sole Motivation:**
      *   Step 1: Belief: "I *will* make the Pre-Med track." Motive: Deep desire to be a doctor, possibly identity-linked. Crucial for daily functioning (gets him to class).
      *   Step 2: **Likely Acknowledges** counterevidence (poor grades, competitiveness) but **minimizes/reinterprets** ("I just need to find my rhythm," "That bad exam was a fluke"). Not full dismissal.
      *   Step 3: **May Seek** some information (knows requirements) but **avoids** deep dives into acceptance stats or realistic assessment of current standing.
      *   Step 4: **Judgment Call:** Might be somewhat **Inconsistent** (applies rigor elsewhere, not here) or **Unclear**.
      *   Step 5: **Likely Motivated** (belief follows powerful desire/need).
      *   *Pattern:* **Strong Wishful Thinking / Borderline Self-Deception.**
      *   *Values Decision Point:* Belief is **highly functional** (sole motivation for attendance/effort). Puncturing it risks catastrophic disengagement.
      *   *Mentor Focus:* **SUPPORT THE FUNCTION, SHIFT FOCUS.** Do *not* challenge the long-term Pre-Med belief. **Leverage the motivation:** "Staying on track for Pre-Med means acing *this* Bio class. What's your plan for the next quiz? How can we break down this week's material?" Focus intensely on the *immediate, actionable steps* required to pass *current* courses. Acknowledge the effort: "Getting to class every morning shows real commitment." **Referral Considerations:** Only if the avoidance prevents accessing needed academic support *now*, if effort is misdirected (e.g., only studying unrealistic MCAT material), or if underlying distress is evident. **Primary goal is sustaining the functional motivation while building competence in the present.**

  **Closing: What the Procedure Cannot Do**

  1.  **Diagnose Internal Mental States:** It cannot tell you what the student "truly" believes deep down. It can only map how they handle information relevant to what they *say* they believe.
  2.  **Determine Absolute Truth:** It cannot prove a professor *didn't* have a grudge or that the student *definitely* won't get into nursing (unlikely events happen). It assesses the *reasonableness* and *motivation* behind the belief *as held by the student*.
  3.  **Resolve Value Conflicts:** It identifies potentially problematic patterns, but *cannot* tell you whether it's ethically right or practically wise to challenge a functional false hope. That requires professional judgment and consultation, weighing well-being, autonomy, and academic realities.
  4.  **Guarantee Outcomes:** Using this procedure won't magically make students rational or successful. It provides a structured way to understand their perspective, identify potential roadblocks, and make more informed decisions about support and referral.
  5.  **Eliminate Uncertainty:** The "Judgment Call" steps mean ambiguity remains. Mentors must be comfortable documenting their reasoning and seeking guidance. The procedure makes uncertainty more explicit and manageable, not absent.

  This procedure equips you to move beyond abstract labels to observable behaviors grounded in philosophical insights. It emphasizes your role in supporting process and present action, while providing clear pathways for referral when patterns suggest deeper issues or values dilemmas arise that exceed peer support capacity. Remember: your core job is engagement and triage, not therapy or belief-correction.
