answer: |-
  My diagnosis is that the **core disagreement is not substantive (about the structure of nature) but arises from monists and pluralists answering fundamentally distinct questions under the single label "species problem."** They are engaged in different projects, making their positions incommensurable rather than directly contradictory. This explains the persistent stalemate despite shared biological facts. Here’s the defense, grounded in the positions and their behavior:

  ### 1. **What the Positions Reveal About Their Underlying Projects**
     - **Monists (e.g., phylogenetic/cladistic proponents)** treat species as *natural units in the tree of life*. Their goal is to **discover objective evolutionary discontinuities** (lineage splits, reproductive isolation points). When they say "species," they mean: *"the real, historical branches of life's phylogeny, independent of human interests."*  
       - **Behavior in hard cases**: They *prioritize consistency with evolutionary history* over practicality. Multiplying taxa (e.g., splitting asexual lineages into many "species") is acceptable because it reflects the "true" branching structure. Ring species force arbitrary cuts, but these are seen as *epistemic limitations*, not flaws in the monist ideal.
     
     - **Pluralists** treat species as *practical tools for biological inquiry*. Their goal is to **classify organisms in ways that advance specific research aims** (e.g., predicting trait distribution, studying gene flow). When they say "species," they mean: *"a contextually useful grouping for a given biological question."*  
       - **Behavior in hard cases**: They *embrace flexibility*. Bacteria can be "species" under ecological concepts (for studying niches) but not interbreeding concepts. Hybrid swarms are temporary units for conservation genetics but not for phylogenetics. The lack of a single rule isn’t a failure—it’s expected.

  ### 2. **Why This Isn’t Substantive (About Nature’s Joints)**
     - **Shared biology, divergent aims**: Both agree on processes (reproduction, phylogeny, selection), but monists see these as *defining what species **are***, while pluralists see them as *factors informing what groupings **work***.  
     - **Hard cases expose divergent goals, not reality**:  
       - *Bacteria*: Monists see lateral gene transfer as eroding "true" species boundaries; pluralists see it as irrelevant for ecological classification.  
       - *Fossils*: Monists lament incomplete data obscuring real lineages; pluralists use morphology because it serves paleontological goals.  
       - *Ring species*: Monists see a continuum violating discreteness; pluralists see a gradient where endpoints are "species" for some questions but not others.  
     - **No resolution possible**: Evidence won’t shift positions because each side evaluates success differently. Monists demand a *single correct partition*; pluralists demand *utility across contexts*. A "joint in nature" pluralist would contradict themselves; a pragmatic monist would abandon their core commitment.

  ### 3. **Why This Isn’t Merely Verbal (Not Just About the Word 'Species')**
     - The disagreement runs deeper than semantics. It’s about **the purpose of taxonomy itself**:  
       - Monists view taxonomy as *natural science* (discovering structure).  
       - Pluralists view it as *engineering* (designing tools).  
     - Calling it "verbal" implies clarifying definitions would help, but the debate persists *because* definitions (e.g., "phylogenetic species") already encode their respective projects. The conflict is meta-taxonomic.

  ### 4. **Where Progress Lies: Reframing the Question**
     Given this diagnosis, progress requires **abandoning the quest for a universal species concept** and instead:  
     - **Articulating the trade-offs formally**: Your "third possibility" is key. A formal result showing *no single partition can simultaneously satisfy all desiderata* (e.g., reproductive cohesion, phylogenetic monophyly, morphological diagnosability, practical utility) would refute monist coherence. This shifts the burden: monists must either accept pluralism or justify privileging one desideratum.  
     - **Shifting to "why classify?"**: Demand explicit statements of purpose: *"What biological problem does this grouping solve?"* (e.g., predicting gene flow, reconstructing history, conserving diversity). This exposes why pluralism isn’t "changing the subject" but addressing science’s needs.  
     - **Normalizing conceptual flexibility**: Treat species concepts like mathematical models—valuable when their assumptions align with the context. A "species" for epidemiology (e.g., pathogen host range) need not match one for macroevolution.

  ### 5. **The Weakest Point in This Diagnosis**
     **Monists may insist their view *is* grounded in nature’s structure**, arguing that pluralists ignore a deeper unity (e.g., lineages as the fundamental unit of evolution). A strong monist could contend that *if* we had perfect phylogenomic data, one partition *would* satisfy all legitimate aims, making pluralism provisional. This retains coherence but risks unfalsifiability—a "real" structure always just beyond reach. Yet hard cases (e.g., hybridizing "species" with deep divergence) suggest no such unity exists.

  ---

  \diagnosis{distinct questions}  
  This framing forces the seminar to confront taxonomy's aims head-on. The century-long stalemate isn’t failure—it’s a sign we’ve been asking the wrong question.
