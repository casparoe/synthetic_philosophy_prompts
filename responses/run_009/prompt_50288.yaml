  #### 3. Cruxes with Predictions  
  Cruxes are sub-questions where settling one would move at least one party. For each, both parties’ predictions are stated in advance.  

  **Crux 1: Does the simulation’s conditional strategy result generalize?**  
  - **Sub-question**: In the simulation, switching when \(X=20\) yields $25 (higher than $22.50). Does this imply that for *any* observed \(X\) in a *general* setup (no specified prior), switching has EV = \(1.25X\)?  
  - **Sticker’s prediction**: No. The $25 result depends on the known prior (\(A \in \{10, 20\}\)). Without a known prior, the conditional probability that \(X\) is the smaller amount is not necessarily \(1/2\), so EV ≠ \(1.25X\).  
  - **Switcher’s prediction**: Yes. The random envelope assignment ensures \(P(\text{\(X\) is smaller}) = P(\text{\(X\) is larger}) = 1/2\) for any \(X\), so EV = \(1.25X\) always.  
  - **Relevance**: Settling this would move the Sticker if generalized (it is not), or the Switcher if simulation-specific (it is).  

  **Crux 2: Can the conditional probability be \(1/2\) without a known prior?**  
  - **Sub-question**: In the absence of a specified prior distribution for the smaller amount \(A\), is it valid to assume \(P(\text{\(X\) is smaller} \mid X) = 1/2\)?  
  - **Sticker’s prediction**: No. For example, if \(A\) has an improper uniform prior, \(P(\text{\(X\) is smaller} \mid X) = 2/3\), leading to EV = \(X\) (no gain). Only a known prior justifies \(1/2\).  
  - **Switcher’s prediction**: Yes. Envelope assignment symmetry forces \(P(\text{\(X\) is smaller}) = 1/2\), irrespective of the prior for \(A\).  
  - **Relevance**: Settling this would move both parties; it underlies the EV calculation’s validity.  

  **Crux 3: Does finitude invalidate the \(1/2\) probability?**  
  - **Sub-question**: In a bounded world (e.g., maximum \(A = \$1000\)), for \(X\) near this bound, is \(P(\text{\(X\) is larger}) > 1/2\)?  
  - **Sticker’s prediction**: Yes. If \(X\) is large (e.g., \$999), it is more likely the larger amount, breaking the \(1/2\) assumption and making switching unfavorable.  
  - **Switcher’s prediction**: No. The \(1/2\) probability comes from envelope selection, not \(A\)’s distribution. Bounds do not affect it.  
  - **Relevance**: Settling this would move the Sticker (if confirmed) or Switcher (if refuted).  

  **Crux 4: Does the switching-back argument refute the EV?**  
  - **Sub-question**: If, after switching, you were allowed to reopen and swap back, would the same reasoning compel switching back?  
  - **Sticker’s prediction**: Yes. This implies the initial swap cannot be favorable, exposing a flaw in the EV calculation.  
  - **Switcher’s prediction**: No. The new observation (say, \(Y\)) changes the EV calculation for switching back (e.g., EV = \(1.25Y\)), but the initial swap remains favorable.  
  - **Relevance**: Settling this would move the Sticker if switching back is favorable, or the Switcher if not.  

