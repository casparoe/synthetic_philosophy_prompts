  First, I need to unpack Christiano's actual argument. The strategy-stealing idea is subtle: it's not about humans literally copying AI moves in real-time, but about aligned AI systems theoretically having access to similar takeover strategies. The article oversimplifies by implying direct human copying. Christiano's point is more about eliminating competitive pressure if alignment is solved - but he definitely acknowledges execution speed matters. 

