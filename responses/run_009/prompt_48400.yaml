answer: |-
  ## Formal Epistemology: Problem Sheet 4 (Condorcet Jury Theorem in Practice)

  **Instructions:** Answer all parts. Show your reasoning clearly. Numerical answers may be rounded appropriately (e.g., 2 decimal places for probabilities, nearest integer for voter counts). Software or statistical tables are permitted for binomial calculations, but specify what you used. Total Marks: 20.

  ---

  **Context:** The Condorcet Jury Theorem (CJT) states that for a group deciding by majority vote, where each member has an independent probability `p > 0.5` of being correct, the probability that the majority makes the correct choice approaches 1 as the group size increases. If `p < 0.5`, this probability approaches 0. We explore the practical implications and limitations of this elegant result.

  **The Scenario:** An academic journal's 25-member editorial board votes by simple majority on whether the central empirical claim of a submitted paper is true. Assume the claim is indeed true. Each editor, working independently *under normal circumstances*, has a probability of `p = 0.55` of correctly judging the claim.

  **Part (a): The Reality of Finite Groups** (6 Marks)
  1.  Calculate the probability that the majority vote of the 25 editors is correct.
  2.  Determine the *minimum* number of editors (`N`) required for the probability of a correct majority vote to reach *at least* 0.99. Briefly comment on the practical feasibility of having such an editorial board.

  **Part (b): The Corrosion of Correlation** (8 Marks)
  Suppose now that all 25 editors were trained by the same influential supervisor. This shared background introduces positive correlation between their judgments: if one editor makes a mistake, others are significantly more likely to make the *same* mistake due to shared methodological biases. Consequently, the independence assumption of the CJT is violated.

  1.  Does the CJT's guarantee (that the probability of a correct majority vote approaches 1 as the group grows) still hold in this scenario? Explain *why* or *why not*.
  2.  Explain *in your own words, focusing on the mechanics of voting*, how correlated errors damage the group's ability to reach a correct majority verdict. Avoid simply stating "independence fails"; describe the process by which correlation undermines collective accuracy. (Hint: Think about how mistakes propagate within the group).

  **Part (c): Below the Threshold** (6 Marks)
  Now, consider a different scenario entirely. Suppose for a specific type of complex claim, individual editors (working independently) have a probability of only `p = 0.49` of judging correctly whether it is true.

  1.  Using the CJT framework, explain qualitatively whether adding *more* editors to the board (still voting by majority) would *increase* or *decrease* the probability that the majority verdict is correct.
  2.  What is the general lesson here about when making a group *larger* will make it *wiser* (in terms of majority judgment accuracy)?

  ---

  ## Model Answer

  **Part (a): The Reality of Finite Groups**
  1.  The number of correct votes follows a Binomial distribution: `X ~ Binomial(n=25, p=0.55)`. The majority is correct if `X >= 13` (since 25/2 = 12.5). Using binomial cumulative distribution functions (e.g., `pbinom` in R, `BINOM.DIST` in Excel, or standard tables):
      *   `P(X >= 13) = 1 - P(X <= 12)`
      *   `P(X <= 12) ≈ 0.2386` (Calculated via `pbinom(12, 25, 0.55)`)
      *   Therefore, `P(Majority Correct) ≈ 1 - 0.2386 = 0.7614`.
      **Answer:** The probability the majority is correct with 25 editors is approximately **0.76**.
  2.  We need the smallest `N` (odd, for no ties) such that `P(X >= (N+1)/2) >= 0.99` for `X ~ Binomial(N, 0.55)`. Calculating iteratively:
      *   `N=101`: `P(X>=51) ≈ 0.946` (Too low)
      *   `N=201`: `P(X>=101) ≈ 0.977` (Still too low)
      *   `N=301`: `P(X>=151) ≈ 0.991`
      *   `N=401`: `P(X>=201) ≈ 0.997` (Exceeds 0.99)
      Checking `N=301` confirms `P(X>=151) ≈ 0.991 > 0.99`.
      **Answer:** The minimum number of editors needed is **301**.
      **Comment:** Requiring 301 highly specialised editors for an editorial board is utterly impractical. Journals operate with boards far smaller than this (typically <50). This highlights the significant gap between the asymptotic guarantee of the CJT and the feasibility of achieving very high accuracy (like 99%) with realistically sized groups, even when individual competence is reasonably good (55% > 0.5).

  **Part (b): The Corrosion of Correlation**
  1.  **No**, the CJT's guarantee that the probability of a correct majority vote approaches 1 as the group size increases **does not hold** when judgments are positively correlated. The CJT's proof relies crucially on the independence of voter judgments; violating this assumption invalidates the conclusion.
  2.  **Explanation:** Correlation between errors fundamentally changes how mistakes aggregate within the group. When errors are independent, they tend to cancel each other out as the group size increases. One editor's mistake is usually offset by another's correct judgment elsewhere. However, with positive correlation (e.g., due to shared flawed training), mistakes are no longer isolated events. If the shared bias leads editors to misinterpret a crucial piece of evidence, many editors are likely to make the *same* error simultaneously. Instead of cancelling, these correlated errors *reinforce* each other. A block of editors, all making the same mistake for the same reason, can easily form a majority or a very substantial minority. Adding more editors who share the same correlated bias doesn't dilute this block of error; it potentially *strengthens* it. The group's collective judgment becomes vulnerable to the shared flaw, behaving more like a single, biased entity multiplied many times rather than a collection of independent reasoners pooling diverse perspectives. Correlation means the group fails to benefit from the "wisdom of crowds" effect, where independent errors randomise and cancel. Instead, errors become systematic and concentrated within the correlated subgroup.

  **Part (c): Below the Threshold**
  1.  According to the CJT, since `p = 0.49 < 0.5`, the probability that the majority vote is correct **decreases** and approaches **0** as more editors are added. Adding more voters harms the group's accuracy in this case.
  2.  **General Lesson:** The CJT demonstrates that making a group larger only reliably makes it wiser (in terms of majority judgment accuracy) when the individual voters are, on average, **more likely to be correct than incorrect** (`p > 0.5`). This is the crucial threshold. If individuals are more likely to be wrong (`p < 0.5`), then aggregating *more* of their judgments via majority rule actually makes the group verdict *worse*, driving the probability of a correct decision towards zero. Size amplifies inherent competence; it cannot reliably compensate for systematic individual incompetence below the 0.5 threshold.

  ---

  ## Marking Scheme (Total: 20 Marks)

  *   **Part (a): The Reality of Finite Groups (6 Marks)**
      *   **1a. Probability Calculation (3 Marks):**
          *   A: Correct method (binomial, P(X>=13)), correct answer (≈0.76). [3]
          *   B: Correct method, minor arithmetic error OR correct answer without clear method shown (if obvious). [2]
          *   C: Incorrect method (e.g., normal approx without check, wrong n/k) but reasonable attempt OR major arithmetic error with correct method. [1]
          *   D: Incorrect method and answer, or no attempt. [0]
      *   **1b. Minimum N & Comment (3 Marks):**
          *   A: Correct N (301) identified, plausible calculation method indicated/implied, insightful comment on implausibility. [3]
          *   B: Correct N (301), brief or weak comment. [2]
          *   C: N incorrect but >200 and <400, OR correct N but no comment. [1]
          *   D: Significant error in N (e.g., <100), or no attempt. [0]

  *   **Part (b): The Corrosion of Correlation (8 Marks)** *(Focus on Q2 - explanation)*
      *   **2a. Guarantee Holds? (1 Mark):**
          *   A: Clear "No" with correct reason (independence violated/CJT doesn't apply). [1]
          *   B: Vague "No" or incorrect answer. [0]
      *   **2b. Explanation of Damage (7 Marks):** *(This is the core)*
          *   **A (7-6 Marks):** Excellent explanation. Clearly contrasts independent error cancellation vs. correlated error reinforcement. Uses concepts like "shared bias," "systematic error," "block of error," "failure of errors to cancel," "amplification of shared mistakes," "group behaving like a single biased entity." Explains *why* independence is crucial (errors randomise and cancel) and *why* correlation breaks this (errors become systematic and aligned). Avoids *just* stating "independence fails." Original, clear, and precise language.
          *   **B (5-4 Marks):** Good explanation. Identifies key issue (errors don't cancel, become aligned/reinforced). Mentions shared bias/mistakes. Explains consequence (aligned errors can form majority). Lacks some depth/clarity compared to A-tier. Might slightly restate "correlation bad" but adds meaningful elaboration. Clear link to voting mechanics.
          *   **C (3 Marks):** Satisfactory explanation. Correctly identifies that correlated errors mean mistakes happen together. States this makes a wrong majority more likely. Lacks clear contrast with independence or deeper mechanistic explanation (e.g., *why* togetherness is bad beyond "more wrong votes"). May come close to just restating "independence fails" but adds *some* relevant context (e.g., "so they all make the same mistake").
          *   **D (2-1 Marks):** Weak explanation. Only states that "independence is violated" or "correlation breaks the theorem" without meaningful elaboration on *how* it affects the voting outcome. Or, explanation is very vague ("it makes things worse," "mistakes pile up") without linking to correlation or majority formation. Shows minimal understanding.
          *   **E (0 Marks):** Incorrect, irrelevant, or no answer. Mere restatement of "independence fails".

  *   **Part (c): Below the Threshold (6 Marks)**
      *   **3a. Helps or Hurts? (2 Marks):**
          *   A: Clearly states adding voters **decreases** probability and mentions it approaches **0**. [2]
          *   B: States decreases OR mentions approaches 0, but not both clearly. [1]
          *   C: Incorrect answer (e.g., increases, no effect). [0]
      *   **3b. General Lesson (4 Marks):**
          *   **A (4 Marks):** Clear, precise statement: Larger groups are wiser (via majority) **only if** individual competence `p > 0.5`. Emphasises the `p > 0.5` threshold as the critical condition. May mention size amplifies inherent competence/incompetence.
          *   **B (3 Marks):** Correct core idea (`p > 0.5` needed) but slightly less precise (e.g., "if voters are competent," "if they are more often right than wrong" without the 0.5 threshold explicit, though implied). Or, has minor awkward phrasing.
          *   **C (2 Marks):** Vague but correct direction (e.g., "depends on how good individuals are," "need good voters," "only helps if they are reliable"). Lacks precision about the threshold.
          *   **D (1 Mark):** Very vague or partially incorrect (e.g., "depends," "sometimes helps, sometimes doesn't" without linking to `p`).
          *   **E (0 Marks):** Incorrect or no answer.
