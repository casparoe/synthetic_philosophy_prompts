answer: |-
  Below is a decision tree designed to resolve disputes about biological function attribution in engineered microbes. The tree starts from a universally accepted paradigm (hearts, enzymes, and eyes have functions) and uses concrete cases to guide users to their preferred theory without jargon. Each node is a yes/no question about a specific case, and leaves represent distinct philosophical positions. Cases cover all required scenarios (new mutation, vestigial structure, co-opted trait, synthetic enzyme, accidental duplicate, cancer adaptation).  

  ### **Decision Tree**  
  **Start**: Consider a trait (e.g., enzyme, heart) in a biological system.  

  1. **Q1: A spontaneous mutation arises in a mammal that improves blood-pumping efficiency but hasn’t been inherited by any offspring (no selection has acted on it). Does this mutation have a function?**  
     - **Yes** → Go to Q2.  
     - **No** → Go to Q3.  

  2. **Q2: A molecule-for-molecule duplicate of a fish is assembled by a freak ocean accident (no evolutionary history or design). Does its heart have a function?**  
     - **Yes** → Go to Q4.  
     - **No** → **Leaf: Design/History Essentialism** (Function requires design or evolutionary history; none here.)  

  3. **Q3: Human appendix—vestigial, often harmful, and not maintained by selection. Does it have a function?**  
     - **Yes** → **Leaf: Strong Etiological** (Function = what trait **was selected for** in ancestors. Persistence via selection is irrelevant.)  
     - **No** → **Leaf: Contemporary Etiological** (Function = what trait is **currently maintained by selection**.)  

  4. **Q4: A gene is transplanted from bacteria to yeast for biofuel production. In yeast, it performs a novel reaction that stabilizes metabolism but is unrelated to its role in bacteria. What determines its function?**  
     - **Its novel stabilizing role in yeast** → Go to Q5.  
     - **What it was selected for in bacteria** → **Leaf: Hybrid Etiological-Causal** (Two concepts: historical selection explains presence; causal role explains current utility.)  

  5. **Q5: A cancer-cell lineage evolves a trait to evade immune attack, aiding tumor growth but harming the organism. Does this trait have a function?**  
     - **Yes** → Go to Q6.  
     - **No** → **Leaf: Biostatistical** (Function = statistically typical contribution in a reference class [e.g., species-typical traits]. Cancer traits are atypical.)  

  6. **Q6: An enzyme is designed/synthesized in a lab (no evolutionary history). Does it have a function?**  
     - **Yes** → Go to Q7.  
     - **No** → **Leaf: Deflationary** (Function talk is dispensable shorthand; no fact of the matter.)  

  7. **Q7: The lab-designed enzyme’s function is determined by:**  
     - **What it was engineered to do** → **Leaf: Organizational** (Function = role in self-maintenance of a system, defined by design or intrinsic organization.)  
     - **What it causally contributes to any system** → **Leaf: Causal-Role** (Function = causal capacity in a containing system, regardless of history or design.)  

  ---

  ### **Annotations**  
  1. **Unseparated Leaves** (No case in the tree splits these; identical answers to all questions):  
     - **Strong Etiological vs. Weak Etiological**: Both answer identically to all cases. *Wedge case needed*: A trait maintained by drift after losing selective value. Strong etiological denies function (selection doesn’t explain persistence); weak etiological accepts it (past contributions suffice).  
     - **Causal-Role vs. Organizational**: Both answer identically to all cases. *Wedge case needed*: A trait contributing to reproduction but not self-maintenance (e.g., mating display). Organizational might deny function (not self-maintaining); causal-role accepts it (causal capacity exists).  

  2. **Unoccupied Logical Space**:  
     - **"Ahistorical Normativism"** (Function = intrinsic normativity without history, design, or typicality). *Diagnosis*: Incoherent—normativity requires a basis (e.g., selection, design, or statistics), which this rejects.  
     - **"Current Selection + Design"** (Function requires either contemporary selection or design). *Diagnosis*: Unattractive—arbitrarily excludes new mutations and accidental duplicates with clear causal roles.  

  3. **Tree Structure Notes**:  
     - Cases avoid jargon (e.g., Q1 tests history-dependence without mentioning "etiology").  
     - Biologists/philosophers reaching the same leaf will recognize agreement through shared case judgments.  
     - Rare leaves (e.g., Design/History Essentialism) are retained for logical completeness.  

  ---

  ### **Leaf Descriptions**  
  - **Strong Etiological**: Trait has function iff selection explains its presence (past or current).  
  - **Contemporary Etiological**: Function iff trait is currently maintained by selection for that effect.  
  - **Causal-Role**: Function = causal contribution to a capacity of a containing system.  
  - **Organizational**: Function = role in self-maintenance of an organized (designed or biological) system.  
  - **Biostatistical**: Function = statistically typical contribution in a natural reference class.  
  - **Hybrid Etiological-Causal**: Two distinct concepts: historical (why trait exists) and causal (what it does).  
  - **Deflationary**: Function ascriptions are context-dependent shorthand with no underlying truth.  
  - **Design/History Essentialism**: Function requires deliberate design or evolutionary history (no "accidental" functions).  

  This tree resolves your team’s dispute by forcing agreement on cases first, revealing shared principles. Use it in the workshop to map positions without presupposing theoretical alignment.
