  For my fifth point, I'll address confidence. I'm most confident about the timescale difference being key, as it explains why their arguments don't connect. I'm least confident about whether Nadia's position truly stems from risk aversion or if it's more about political feasibility or institutional trust issues that haven't surfaced. If pushed, they might reveal deeper concerns about nuclear safety culture or governance that facts alone don't address.

