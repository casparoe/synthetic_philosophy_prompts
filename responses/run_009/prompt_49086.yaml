answer: |-
  Below is a complete game design tailored to your specifications, simulating EU decision-making dynamics with a sovereignty ratchet, voter resentment, and efficiency trade-offs. The game runs in **45 minutes** with **6 member states** (each played by 2-3 students) and focuses on experiential learning about centralization, democratic deficit, and sovereignty pooling.

  ---

  ### **Game Title: "Union & Discontent"**
  **Core Tension:** States gain efficiency by pooling decisions but accumulate voter resentment. Representatives must balance EU cooperation with domestic accountability.

  ---

  ### **Setup**
  1. **Roles & States:**  
     - Split into **6 member states** (e.g., "Asteria," "Borealis," "Coralis," etc.).  
     - Each state has:  
       - **1 National Representative** (negotiates in the Council).  
       - **1–2 Domestic Advisors** (voice "voters," monitor resentment).  
       - **Starting Budget:** 10 points.  
       - **Secret National Goal Card** (e.g., "Become the wealthiest state," "Block environmental policies").  
       - **Resentment Tracker** (starts at 0; max 10).  

  2. **The Council:**  
     - A central table with seats for all 6 Representatives.  
     - **Rotating Presidency:** Each round, one state holds the gavel (start randomly; rotate clockwise).  

  3. **Policy Deck:**  
     - **15 Policy Cards** (examples below), each with:  
       - **Cost:** Points each state must pay to join.  
       - **Efficiency Bonus:** Ongoing points for all participating states.  
       - **Policy Area:** Economy, Environment, Defense, etc.  
     - **Example Cards:**  
       - *Common Agriculture Policy:* Cost 2, Bonus +1 point/turn.  
       - *Green Energy Fund:* Cost 3, Bonus +2 points/turn.  
       - *Border Security Pool:* Cost 4, Bonus +3 points/turn but +1 resentment/turn.  

  4. **Game Materials:**  
     - Budget tokens (coins/chips), resentment trackers (paper), goal cards, policy deck, timer.  

  ---

  ### **Turn Structure (5 Rounds, 7–8 Min/Round)**  
  Each round = 1 "EU legislative session."

  #### **Phase 1: Domestic Pressure (2 min)**  
  - States collect **income**: Base +2 points + efficiency bonuses from active policies.  
  - **Voter Resentment Check:**  
    - Representatives roll a die:  
      - **1–3:** Voters demand accountability. Rep *must* either **defy the Council** (veto/opt-out) this round or lose 3 points.  
      - **4–6:** No immediate pressure.  
    - **Resentment Effects:**  
      - For every **2 active pooled policies**, resentment increases by 1 (e.g., 4 policies = +2 resentment).  
      - If resentment ≥7, Domestic Advisors can force the Representative to **lose office** (state loses 5 points; new Rep starts at 3 resentment).  

  #### **Phase 2: Council Proposal (1 min)**  
  - **President** draws 3 policy cards, picks **one** to propose.  
  - President can offer **one opt-out** to a state (exempt from cost/bonus).  

  #### **Phase 3: Negotiation & Voting (3 min)**  
  - States debate. Representatives can:  
    - **Accept:** Pay cost, gain bonus, lock in policy (ratchet applies).  
    - **Veto:** Block the policy. Reduces resentment by 2.  
    - **Defy:** Publicly reject the policy (if not President). Resentment -3, but state loses 1 point.  
  - **Voting Rules:**  
    - Policy passes if **no vetoes**.  
    - Opt-outs require state consent.  
    - **Ratchet Mechanic:** Once a state joins a policy, it cannot leave unless **all states agree** to dissolve it (unanimity rule).  

  #### **Phase 4: Implementation (1 min)**  
  - If passed:  
    - Participating states pay cost, gain efficiency bonus.  
    - **All participating states increase resentment by 1.**  
  - President rotates.  

  ---

  ### **Scoring & Incentives**  
  - **Efficiency Gains:** Pooled policies give **ongoing bonuses** (e.g., +1 point/turn), making centralization profitable.  
  - **Resentment Costs:**  
    - Reduces final score: **Final Score = Budget − (2 × Resentment)**.  
    - High resentment forces short-term defiance/leadership loss.  
  - **Win Condition:** Highest final score after 5 rounds.  
  - **Secret Goals:** Achieved goals add +5 points (e.g., "Wealthiest state").  

  ---

  ### **Key Mechanics Teaching the Concepts**  
  - **Sovereignty Pooling (Ratchet):**  
    - States lock policies in permanently. Exiting requires unanimity—almost impossible once bonuses create dependency.  
    - *Students feel*: "We accepted Policy X for points, but now we’re stuck with Policy Y!"  
  - **Democratic Deficit:**  
    - Voters (Domestic Advisors) punish Representatives for EU decisions they can’t control.  
    - Resentment builds passively, forcing defiance even if policies are beneficial.  
    - *Students feel*: "I had to veto that trade deal or my voters would riot!"  
  - **Ever-Closer Union:**  
    - Efficiency bonuses incentivize further centralization ("Just one more policy!"), while resentment silently grows.  
    - *Students feel*: "We’re richer but angrier every round."  

  ---

  ### **Debrief Framework (5–7 Min)**  
  Link game experiences to EU concepts:  
  1. **Sovereignty Pooling:**  
     - *Ask:* "When did you realize you couldn’t undo a policy? How did the ratchet limit your choices?"  
     - *Map to EU:* Single Market, Schengen—easy to join, hard to leave.  
  2. **Democratic Deficit:**  
     - *Ask:* "Did you ever defy the Council just to please voters? Could you hold other states’ Reps accountable?"  
     - *Map to EU:* EU decisions feel distant; voters blame national leaders, not Brussels.  
  3. **Ever-Closer Union:**  
     - *Ask:* "Why did you keep centralizing even when resentment grew? What made reversing hard?"  
     - *Map to EU:* Efficiency gains create path dependency (e.g., euro).  

  ---

  ### **Predictable Challenges & Fixes**  
  1. **Problem:** Students ignore resentment to chase points.  
     - **Fix:** Announce resentment penalties loudly each round. Ask Domestic Advisors: "Will your voters tolerate this?"  

  2. **Problem:** Negotiations run long.  
     - **Fix:** Use a visible timer. President gets 30 seconds to propose; states get 15 seconds to vote.  

  3. **Problem:** Unbalanced policies or goals.  
     - **Fix:** Pre-test policies (e.g., avoid bonuses >+2/turn). Assign goals that conflict (e.g., "Maximize growth" vs. "Block immigration policies").  

  4. **Problem:** Opt-outs/vetos feel punitive.  
     - **Fix:** Frame defiance as "winning domestic support," e.g., "By vetoing, you’re a hero at home!"  

  5. **Problem:** Ratchet isn’t felt early.  
     - **Fix:** After Round 2, remind states: "Remember—any policy you accept is permanent."  

  ---

  ### **Sample Policy Deck**  
  1. **Farm Subsidies** (Agriculture): Cost 2, Bonus +1/turn.  
  2. **Carbon Tax** (Environment): Cost 3, Bonus +2/turn.  
  3. **Joint Army** (Defense): Cost 4, Bonus +3/turn, but +1 resentment/turn.  
  4. **Research Fund** (Tech): Cost 3, Bonus: Draw extra goal card.  
  5. **Asylum Rules** (Immigration): Cost 1, Bonus +1/turn, resentment +2 if rolled 1–3 in Domestic Phase.  

  ---

  ### **Why This Works**  
  - **Experiential Learning:** Students *feel* the trade-offs before labeling them.  
  - **Debrief Precision:** Specific game moments (e.g., a veto to reduce resentment) directly illustrate EU jargon.  
  - **Scalable:** Add the "Commission" (you as agenda-setter) or "Parliament" (vote weights) for advanced groups.  

  This game transforms abstract EU critiques into tangible dilemmas. Students leave understanding *why* efficiency and democracy clash in supranational systems—and why a "United States of Europe" is easier said than done.
