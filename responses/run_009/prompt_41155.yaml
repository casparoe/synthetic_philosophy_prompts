  Now, for the poem structure: a sestina has six stanzas of six lines each, ending with the key words in a fixed rotation pattern, plus a three-line envoi. I'll map the cases to stanzas: Start with teletransporter (stanza 1: scanner, Mars), then branch-line (stanza 2-3: cells, memory, showing duplication), and division (stanza 4-6: branch, matter, emphasizing multiplicity). The envoi should combine words to show dispersal, ending with "matter."

