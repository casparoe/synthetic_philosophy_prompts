  For structure: Opening should frame the dilemma neutrally. Then systematically address each objection. For donor intent, I'll argue historical context matters but shouldn't bind absolutely when local need diminishes. For the "statistics vs personal" point, I'll acknowledge emotional weight but challenge its moral relevance. Singer's analogy needs the most nuance – I'll agree on obligation to distant suffering but highlight differences: prevention isn't rescue, and local absence of crisis changes the "walking past" dynamic. 

  The allocation decision is tricky. 25% diversion seems reasonable as a start, but the user might fear alienating the minority. I'll position it as a pilot with reviews to reassure them. Standing policy should include local need reassessment to honour donor intent. 

  Phrasing must balance principle with pragmatism: "measured evolution of practice" softens change; "duty extends beyond parish boundaries" reframes charity expansively. British-isms like "parish" and "whilst" will help. 

  Finally, the tone must be decisive but collaborative – "I propose" not "I decide". Ending with collective purpose ("further the spirit of our benefactor") unites factions.
