  ## Memorandum: Allocation Policy for Grants Committee

  **To:** Members, Grants Committee  
  **From:** [Your Name], Chair  
  **Date:** 17 October 2023  
  **Subject:** Definitive Allocation Policy: Balancing Local Mandate & Global Opportunity  

  Following our robust discussion concerning the allocation of funds for the forthcoming year and beyond, and recognising the imperative for decisive action, this memorandum outlines my proposed resolution. This proposal addresses the core ethical dilemma, tests the applicability of the drowning-child analogy, weighs the historical donor intent, and establishes a clear, actionable policy.  

  ### 1. **The Ethical Imperative & The Drowning-Child Analogy**
  The analogy compellingly underscores our moral duty to alleviate severe suffering where we can effectively do so. We accept its fundamental premise: the physical distance or identity of those suffering does not negate our obligation if we possess the means to prevent grave harm at a reasonable cost.  

  *However, our situation presents distinctions demanding scrutiny:*  
  *   **Prevention vs. Rescue:** Our case involves *preventing* future suffering (malaria, parasitic disease) for statistically identified *groups*, not *rescuing* a specific, identified individual in *imminent*, visible peril. The moral urgency, while profound, differs in its immediacy and tangibility.  
  *   **"Walking Past"?** Crucially, *no identifiable local person is currently "drowning"* due to unmet emergency need at historic lows. Choosing *not* to fund a specific distant intervention is not morally equivalent to ignoring a drowning child before our eyes *while actively fulfilling our core local mandate*. We are not "walking past" a local crisis to fund distant work; we are exploring how best to utilise *surplus capacity* within our remit.  

  **Conclusion:** While the analogy powerfully establishes a *duty to consider distant need*, its application here is imperfect. Our primary duty remains local relief, but where local acute need is demonstrably low, a strong ethical case exists for directing *some* funds where they achieve vastly greater measurable impact per pound, preventing immense suffering.  

  ### 2. **The Weight of Donor Intent**
  The Victorian Deed explicitly directs income towards "relieving the poor of this county." This specificity carries significant weight:  
  *   **Fiduciary Duty:** We are legally and morally bound by the founder's expressed wishes.  
  *   **Local Connection:** The foundation's identity and local support stem from this focus.  
  *   **Respect:** Disregarding clear intent undermines trust in charitable bequests.  

  *However, context matters:*  
  *   **Evolving Circumstances:** The founder could not have foreseen historically low local emergency need alongside demonstrably effective, quantifiable global interventions. Rigid adherence in the face of changed realities risks ossifying the foundation’s impact.  
  *   **Interpretation:** "Relieving the poor" requires interpretation. Does maximising the *reduction of suffering* align with the *spirit* of relieving poverty, even if geographically extended? When local needs are less acute, does the spirit permit leveraging funds for greater global poverty alleviation?  
  *   **Stewardship:** Responsible stewardship involves adapting to maximise beneficial impact within the mandate's framework.  

  **Conclusion:** Donor intent is paramount but not absolute. It dictates our *primary focus* must remain the county. However, where the *primary focus is demonstrably being met* and surplus capacity exists (i.e., funds achieving less local impact than could be achieved elsewhere against poverty), a *limited, measured* extension of scope can be justified as prudent stewardship honouring the *underlying purpose* of relieving suffering.  

  ### 3. **Proposed Allocation & Standing Policy**
  Balancing these principles – fiduciary duty to the local mandate, ethical obligation to maximise impact, and respect for donor intent – I propose the following for Committee approval:  

  *   **A. Allocation for Next Year:**  
      *   85% of the annual grants budget will be allocated **strictly within the county**, prioritising applications demonstrating the most significant impact on relieving local poverty, aligned with the Deed.  
      *   15% of the annual grants budget will be allocated to **pre-qualified, evidence-based global health interventions** demonstrably achieving exceptional impact per pound in reducing extreme poverty (e.g., proven bed net distribution, deworming programmes via rigorously evaluated partners like the Against Malaria Foundation or Deworm the World Initiative).  

  *   **B. Standing Policy for Future Years:**  
      1.  **Primary Commitment:** A minimum of **85%** of the annual grants budget will *always* be allocated to relieve poverty **within the county**, as mandated by the Deed.  
      2.  **Global Allocation (Contingent):** Up to **15%** of the budget *may* be allocated to high-impact global poverty interventions **only when, and to the extent that, the Committee formally assesses local emergency need to be below a defined threshold** (e.g., based on key local indicators like food bank usage, homelessness statistics, and unmet grant applications demonstrating acute distress).  
      3.  **Annual Review:** The threshold assessment and the specific global allocation (0-15%) will be rigorously reviewed and formally voted upon by the Committee **each year** based on the prevailing local need landscape and evidence for global interventions.  
      4.  **Partnership & Evidence:** Global funds will *only* be directed to organisations with proven, cost-effective, and measurable interventions, subject to strict due diligence and impact reporting.  

  ### 4. **Rationale for the Proposal**
  *   **Honours Core Mandate:** 85% firmly anchors our work locally, respecting donor intent as the primary directive.  
  *   **Maximises Impact Responsibly:** The 15% contingent allocation leverages surplus capacity to achieve vastly greater good against poverty where local need is low, responding to the ethical imperative without abandoning our roots.  
  *   **Practical & Measurable:** The annual review based on defined local thresholds ensures flexibility and accountability. It prevents automatic diversion and ensures refocusing locally if need rises.  
  *   **Addresses Concerns:** It directly engages with Singer's argument by dedicating significant funds to high-impact global good *when local conditions permit*, while acknowledging the differences in the analogy. It respects the emotional connection to local applicants by maintaining the vast majority of funding locally.  
  *   **Stewardship:** It represents a prudent, evidence-based evolution of practice to maximise the beneficial impact of the foundation's resources within the spirit of relieving poverty.  

  This proposal seeks a pragmatic and principled path forward. It commits us to decisive action for next year (85% local / 15% global) and establishes a clear, conditional framework for the future. It takes our ethical obligations seriously while respecting the foundation's history and legal constraints.  

  I urge you to support this measured approach at our next meeting, allowing us to serve both our community and the wider world effectively and responsibly.  

  **Yours faithfully,**  
  [Your Name]  
  Chair, Grants Committee  
  [Charitable Foundation Name]
