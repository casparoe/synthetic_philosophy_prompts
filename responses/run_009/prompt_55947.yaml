  Right, first I need to honor their analytical framework by treating the four readings as distinct menu items. But I notice they're particularly interested in two things: the logical gap between "begins" and "ends," and the unstated premises that make some readings anti-cosmopolitan. Smart catch - that's where the real philosophical action is.

  For reading (i) about psychology/efficacy: This seems descriptively plausible but normatively inert. If someone uses this to block global obligations, they're committing an is-ought fallacy. The user probably knows this, but it's worth flagging that the seminar discussant might have been conflating descriptive ease with normative priority.

  For (ii) duty structure: Here's where things get sticky. The user suspects some versions might be false generalizations. They're right - this reading often implicitly relies on a communitarian view of duties as necessarily relational. But that's precisely what cosmopolitans reject! The proverb can't settle that debate; it just assumes one side.

  Ah, the associative obligations in (iii) - this is probably what the seminar participants meant. But as the user hints, scaling familial partiality to states is philosophically fraught. The real weight here is carried by the unstated premise that compatriot relations are morally analogous to family ties. That needs arguing for - it doesn't come free with the proverb.

  On (iv) state vs individual: The user astutely noticed this shift between the seminar and conference. When applied to state budgets, the proverb silently assumes what G.A. Cohen called the "basic structure objection" - that principles for institutions differ from personal ethics. But again, that's contested ground being presented as common sense.

  The "begins" point is brilliant. "Begins" implies sequence, not exclusivity. To make it prohibitive requires smuggling in either scarcity ("we can only help home") or lexical priority ("home first always means strangers never"). That's where the philosophical sleight-of-hand happens.

  Diagnosis time: The user's suspicion about oscillating meanings seems dead-on. In Q&A, people likely lean on (i)'s intuitiveness while actually using (iii) or (iv). The power comes from the ambiguity - it feels folk-wisdom obvious when stated, but does heavy theoretical lifting when applied.

  Should add a fifth reading? Maybe about legitimate authority - that states lack mandate to tax for foreigners. But that might overcomplicate. Better to show how (iii) and (iv) already cover that terrain when combined with unstated premises about democratic authorization.

