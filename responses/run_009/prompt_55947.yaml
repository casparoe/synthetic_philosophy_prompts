answer: |-
  Here's a disambiguation of "charity begins at home" across your four readings, evaluating each for triviality, relevance, and anti-cosmopolitan force, followed by an analysis of the seminar/panel usage and the "begins" problem:

  ### The Menu of Readings
  **(i) Psychological/Efficacy Claim**  
  *Reading:* Humans are psychologically better equipped to give effectively to those nearby; local giving is more efficient, visible, or sustainable.  
  *Trivial?* Plausibly true as a generalization (e.g., monitoring aid efficacy is often easier locally), but **not universally true** (e.g., disaster relief may be more efficiently handled by global orgs).  
  *Relevance to Cosmopolitanism:* **Irrelevant**. Even if true, it doesn't refute duties to distant strangers—it merely suggests *practical constraints* on fulfilling them. A cosmopolitan can accept this while insisting on duties to optimize distant aid (e.g., via effective altruism) or reform structures to overcome friction.  
  *Anti-Cosmopolitan Force:* None alone. Requires a hidden premise: *"Obligations cannot exist where efficacy is uncertain."* (Contested; cosmopolitans reject this as a blanket excuse).

  **(ii) Structural Duty Claim**  
  *Reading:* Duties of beneficence are fundamentally discretionary ("charity") rather than obligatory ("justice"), and discretion applies only within borders (or relations).  
  *Trivial?* **False as generalization** and **substantively contested**. Assumes beneficence ≠ justice and that borders define the scope of obligation. Cosmopolitans argue positive duties *do* extend globally (e.g., Pogge on negative duties not to harm; Caney on fundamental interests).  
  *Relevance:* **Directly engages but doesn't refute cosmopolitanism**. This reading *presupposes* the anti-cosmopolitan position by fiat.  
  *Anti-Cosmopolitan Force:* Only if supplemented by:  
  - Hidden Premise 1: *"Justice requires reciprocity/coercion; beneficence does not."* (Relies on statist theories like Blake’s/Rawls’).  
  - Hidden Premise 2: *"Borders mark the limits of reciprocity/coercion."* (Cosmopolitans deny this; e.g., global economic structures create coercion).  

  **(iii) Associative Obligations Claim**  
  *Reading:* Compatriots have special, non-derivative claims on each other analogous to familial duties, creating a priority for domestic needs.  
  *Trivial?* **Defensible but contested**. Compatible with communitarian (Sandel), nationalist (Miller), or some liberal (Tamir) theories. Rejected by strict cosmopolitans (e.g., Beitz).  
  *Relevance:* **Directly challenges cosmopolitanism** by asserting the moral relevance of shared citizenship.  
  *Anti-Cosmopolitan Force:* Requires:  
  - Hidden Premise 1: *"Associative duties are *lexically prior* to general duties."* (Otherwise, prioritization could be partial without exclusion).  
  - Hidden Premise 2: *"The state-citizen relation is morally analogous to the family."* (Cosmopolitans argue citizenship is arbitrary; statists argue it's constitutive of identity).  

  **(iv) Institutional Division of Labor Claim**  
  *Reading:* The state’s primary fiduciary duty is to its citizens; using public resources for foreign aid breaches this duty.  
  *Trivial?* **Substantive and contested**. Assumes a "domestic social contract" model. Cosmopolitans counter that states have transnational obligations (e.g., Risse on common ownership of earth).  
  *Relevance:* **Targets institutional cosmopolitanism** (e.g., global redistribution).  
  *Anti-Cosmopolitan Force:* Requires:  
  - Hidden Premise: *"States lack the moral authority or functional capacity to act as agents of global justice."* (Ignores arguments for multilateral institutions or revised sovereignty norms).  

  ---

  ### Analysis of Usage
  - **Seminar (targeting Singer):** Likely relied on **(ii)** or **(iii)**.  
    - If aimed at *individuals*, **(ii)** implies duties beyond borders are discretionary (not obligatory).  
    - If implying *relational duties*, **(iii)** prioritizes proximate relationships.  
    The nod suggests listeners interpreted it as a "common sense" moral axiom (masking its contestability).  

  - **Conference Panel (targeting state aid):** Clearly invoked **(iv)**, treating the state as a fiduciary agent with exclusive domestic obligations. The proverb here smuggles in statist premises about institutional legitimacy.  

  ---

  ### The "Begins" Problem: What Does It Commit To?
  You're correct: "begins" implies *sequence* or *priority*, not *exclusivity*. Logically, it permits:  
  1. **Temporal priority** (Help locals first, *then* strangers).  
  2. **Partiality** (Weight local claims more heavily).  
  3. **Foundational role** (Local charity cultivates virtue for wider duties).  

  **To block cosmopolitan duties entirely, users must add:**  
  - A **scarcity premise** ("Resources are so limited that prioritizing home *exhausts* all capacity to help").  
  - Or a **lexical priority premise** ("Domestic obligations *must* be fully satisfied before any aid is permitted elsewhere").  

  Without these, the proverb is compatible with significant global obligations (e.g., giving 0.7% GDP in aid after robust domestic welfare). The phrase's rhetorical power stems from implying exclusivity while semantically allowing expansion.

  ---

  ### Diagnosis: Why the Oscillation Works
  Your suspicion is correct: **The proverb gains power by equivocating between readings.**  
  - In its **(i)** form, it feels empirically plausible and harmless.  
  - When deployed against cosmopolitanism, it shifts to **(ii)/(iii)/(iv)**, importing contested premises.  
  - The "begins" loophole allows users to avoid stating harsh conclusions (e.g., "we may ignore starving strangers") while functionally endorsing them.  

  **A missing fifth reading?**  
  - **Motivational Scaffolding:** "Local charity trains moral dispositions for wider duties." This *supports* cosmopolitanism long-term but is rarely intended by users.  

  ---

  ### Recommendation for Your Thesis
  1. **Expose the equivocation:** Show how the same phrase toggles between trivial and substantive claims.  
  2. **Target the hidden premises:** The real debate lies in the unstated assumptions (e.g., nature of citizenship, scope of justice).  
  3. **Leverage the "begins" gap:** Argue that even if partiality is justified, it doesn't license *neglect* of distant strangers—only balanced prioritization.  

  The proverb isn't an argument; it's a vessel for unstated normative commitments. Unpacking these reveals the actual fissures in the global justice debate.
