prompt: |-
  Been arguing with my brother about what we owe real dead people when movies dramatize them, and I've started keeping a list of my own gut verdicts to see if they hang together. Shakespeare turning Richard III into a child-murdering hunchback: fine, no notes. Amadeus inventing that Salieri killed Mozart: fine, I love that movie. A war movie "based on true events" folding three real soldiers into one invented composite character: fine. But a biopic that invents an affair for an actress who is still alive: not fine. The Crown writing invented screaming matches between royals who are alive and will definately watch it: not fine. A docudrama about a long-dead journalist that shows him fabricating quotes he never fabricated, shot documentary-style so you'd believe it: not fine. And a movie that shuffles a dead musician's timeline around so his career peak lands right before his diagnosis for a better third act: fine honestly, though I can't explain why that one gets a pass and the docudrama doesn't. My brother says the principle is just living vs dead, but that can't be right, since the journalist's been dead a century and I still say not fine. So: is there a principle here? Maybe something about whether audiences walk away with false beliefs they'll actually act on, or about whether anyone is left to be hurt? Give me a principle (or two candidates) that fits most of these, tell me which of my verdicts it forces me to drop, and tell me what it says about the case I keep flip-flopping on: a biopic about a woman dead twenty years, whose adult kids are alive, that invents a secret she kept from them her whole life. Lead with your bottom line in the first sentence, then the reasoning, no preamble and no restating my question.
reasoning: |-
  Okay, let me tackle this user's query. They're struggling to find a consistent principle for when it's okay to dramatize real people in movies. They listed various examples where they felt some were acceptable and others not. The key seems to be balancing artistic freedom against potential harm. 

  First, I need to analyze their examples. Richard III and Salieri are long dead, so no harm there. The composite soldier is practical for storytelling. But inventing an affair for a living actress or screaming matches for the royals? Those can hurt living people. The journalist case is tricky—dead, but showing fabrication could damage his legacy, and the documentary style makes it seem real. The musician's timeline change is acceptable because it's not malicious and doesn't misrepresent core facts.

  The user's brother suggested a living vs. dead distinction, but the journalist example breaks that. So harm must be the factor. But harm isn't just physical; reputation and emotional distress matter. The journalist's case causes reputational harm, even posthumously, especially with a realistic style that misleads audiences. The musician's tweak doesn't distort his essence, so less harmful.

  Now, the flip-flop case: a biopic inventing a secret kept from her adult kids. Even though she's dead, her kids are alive and could be hurt by the falsehood. The harm here is to the family's feelings and their perception of their mother. The principle would say this isn't fine because it causes emotional harm to living relatives.

  So the core principle is minimizing unjustified harm to living people or their interests. The journalist case is not fine due to reputational harm, and the biopic with the secret isn't fine because it harms the children. The musician's timeline change is fine as it doesn't cause significant harm. The user might need to adjust their verdict on the journalist case but the others align. The key is whether the dramatization causes harm beyond artistic license, especially to those still alive.
answer: |-
  **Bottom line: The core principle is minimizing unjustified harm to living individuals or the significant, enduring interests/legacies of the recently deceased, while recognizing artistic license increases as time passes and direct harm potential decreases.**

  **Reasoning:** Your verdicts align best with a principle centered on **harm prevention**, specifically:

  1.  **Harm to Living Individuals:** Avoid fabrications that cause direct, unjustified harm (reputational, emotional, relational) to people who are alive and likely to experience it (e.g., the living actress's reputation, the living royals' distress and public perception).
  2.  **Harm to Significant Legacy/Truth:** Avoid fabrications that fundamentally distort the core character, achievements, or known historical actions of a real person *in a way likely to cause significant, enduring harm to their legacy or mislead the public on matters of historical importance*, especially if the portrayal is presented in a highly realistic or deceptive style. This protects legacies even of the long-dead when the misrepresentation is severe and consequential (e.g., the journalist falsely shown fabricating quotes, damaging his historical credibility).

  **How it fits your verdicts:**

  *   **Richard III/Salieri:** Long dead; time has passed, legacy solidified; artistic license prevails over potential historical nitpicks. No significant harm.
  *   **Composite Soldier:** Practical necessity, doesn't harm individual identities/legacies. No harm.
  *   **Living Actress Affair:** Direct, unjustified reputational/emotional harm to a living person. **Not Fine** - fits.
  *   **The Crown's Screaming Matches:** Direct, unjustified emotional harm/distress and potential reputational damage to living individuals. **Not Fine** - fits.
  *   **Journalist Fabricating Quotes:** Fundamental distortion of core professional integrity and historical actions (fabrication vs. truth-telling). Presented in documentary style, misleading audiences about historical truth and severely harming his legacy. **Not Fine** - fits.
  *   **Musician's Timeline Shuffle:** Alters chronology for narrative impact, but doesn't fundamentally distort his character, talent, achievements, or the *nature* of his work/illness. His legacy (music, genius, tragedy) remains intact. **Fine** - fits.

  **What You Must Drop:** This principle forces you to accept that the **journalist case (long-dead) is NOT fine** due to the severity of the misrepresentation (falsely accusing him of core professional malpractice) and its potential to cause lasting harm to his historical legacy by misleading audiences under a realistic guise. Your brother's pure living/dead distinction is insufficient here.

  **The Flip-Flop Case (Biopic & Secret):** This principle says **NOT FINE**. While the woman is dead, the invention of a lifelong secret kept from her *living adult children* creates a high potential for direct, unjustified emotional harm to them. It could damage their relationship with their mother's memory, cause family discord, or create public misconceptions they must confront. The harm is to living individuals closely connected to the subject. The time passed (20 years) isn't sufficient to mitigate this specific, direct harm to identifiable living people.
