answer: |-
  You've hit upon a profoundly important phenomenon at the intersection of epistemology, linguistics, and social psychology. What you're describing is **not a single, neatly named concept**, but rather **a cluster of interrelated norms governing communication and social accountability**. Let's break it down systematically:

  ### Core Concepts & Terminology
  1.  **The Knowledge Norm of Assertion (KNA):**
      *   **Definition:** Philosophers like Timothy Williamson argue that you should only assert *p* if you *know* *p* to be true.
      *   **Relevance:** This directly explains why "I genuinely believed it" is an *invalid defense*. The norm isn't "believe what you say," it's "*know* what you say." Your assertion ("The road is closed") claimed knowledge. If you lacked knowledge (even with strong belief), you violated the norm.
      *   **Limitation:** As you note, KNA is binary (know/don't know), while confidence and hedging are graded.

  2.  **Epistemic Modality and Assertive Strength:**
      *   **Definition:** This linguistic concept deals with how speakers modify assertions to indicate their level of certainty (epistemic commitment) using words like "know," "believe," "think," "probably," "might," "must."
      *   **Relevance:** Hedges ("I think," "probably") fundamentally **change the propositional content and force** of the utterance.
          *   "The pharmacy closes at 9." → Asserts the *fact* that it closes at 9.
          *   "I *think* the pharmacy closes at 9." → Primarily asserts the *state of your belief* (you believe it closes at 9). The embedded proposition ("it closes at 9") is not directly asserted as a fact.
          *   **Consequence for Blame:** If the pharmacy closes at 8:
              *   "It closes at 9" is **false**. You asserted a falsehood.
              *   "I think it closes at 9" can be **true** even if the pharmacy closes at 8, *as long as you genuinely held that belief*. You only asserted *your belief state*, not the fact itself. Being wrong about the fact doesn't falsify the *actual claim you made* (your belief state).

  3.  **The Expressed Confidence vs. Warranted Confidence Gap:**
      *   **The Core Mismatch:** This is the heart of your observation – the disconnect between the *level of certainty conveyed* by an assertion and the *level of certainty justified by the speaker's evidence*.
      *   **Established Terms:** While not a single universally agreed-upon name, this gap is discussed in several fields:
          *   **Epistemology:** Often framed as a violation of **assertoric norms** or **epistemic responsibility**. It relates to concepts like **epistemic arrogance** (overestimating one's justification) or poor **epistemic calibration** (mismatch between confidence and accuracy).
          *   **Linguistics/Pragmatics:** Analyzed under **relevance theory** or **politeness theory**. Overly confident assertions can violate the Maxim of Quality (be truthful) or the Maxim of Quantity (don't overstate) in Grice's Cooperative Principle. They can also be perceived as face-threatening.
          *   **Social Psychology:** Linked to perceptions of **competence**, **trustworthiness**, and **accountability**. Overconfident wrongness damages credibility more than cautiously expressed wrongness.

  ### Coining a Precise Term: "Assertoric Warrant Violation" (AWV)
  To capture the specific mismatch you identify, I propose:

  *   **Assertoric Warrant Violation (AWV):** The act of making an assertion with a degree of *expressed confidence* that exceeds the degree of *epistemic warrant* (justification/evidence) possessed by the speaker for the proposition.

  *   **Defining the Components:**
      *   **Expressed Confidence:** The level of certainty conveyed by the linguistic form (word choice, intonation, lack of hedges) and context. "It *is* closed" expresses high confidence. "I *think* it's closed" expresses lower confidence.
      *   **Epistemic Warrant:** The objective strength of the speaker's justification for believing the proposition. This depends on evidence quality, reliability of sources, reasoning, etc.
      *   **Violation:** Occurs when Expressed Confidence > Epistemic Warrant.
      *   **Graded:** AWV is inherently graded. A minor overstatement is a minor violation; a bald assertion based on a hunch is a major violation.

  *   **Edges and Boundaries:**
      *   **Not Simple Error:** AWV focuses on the *manner* of assertion relative to justification, not just falsity. Two people can be equally wrong, but the one with higher AWV is more blameworthy.
      *   **Not Lying:** The speaker believes the proposition. The violation is against norms of justification and communication, not truthfulness per se.
      *   **Hedges as Mitigation:** Effective hedging reduces *expressed confidence*, aligning it closer to (or even below) the actual *epistemic warrant*, thus avoiding or minimizing AWV. Your friend is adept at this.
      *   **When Hedging Fails:** If someone says "I think..." but their tone/context implies near-certainty, they might still commit AWV. Expressing low confidence while possessing *high* warrant could be seen as underselling or false modesty, but it's usually less socially blameworthy than overconfidence.
      *   **Context Dependence:** What constitutes sufficient warrant depends on context (casual chat vs. medical advice). A minor AWV about movie trivia is less severe than a major AWV about driving directions.

  ### Is it One Phenomenon or Several?
  You've astutely identified a *primary* phenomenon (**AWV - the confidence/warrant mismatch**) that manifests in different ways and interacts with other concepts:

  1.  **The Core Mismatch (AWV):** The gap between how sure you sound and how sure you should sound based on your evidence.
  2.  **The Linguistic Mechanism:** The use of epistemic modals (hedges, boosters) to manage expressed confidence and alter propositional content/force.
  3.  **The Social Norm Violation:** The breach of cooperative communication norms (Grice) and expectations of epistemic responsibility, leading to blame and loss of credibility.
  4.  **The Epistemic Failure:** Poor calibration of belief confidence to evidence (an epistemological issue).

  **Conclusion:** While there isn't one universally accepted term, **Assertoric Warrant Violation (AWV)** precisely names the core mismatch you identified. It bridges the philosophical debate (KNA highlights that mere belief isn't enough for unqualified assertion) and the linguistic reality (hedges change what is asserted). AWV explains why your flatmate's "pretty sure, my bad" acknowledges the *real* offense (overstating his warrant), why your hedged friend avoids blame (she only asserts her belief state, not the fact), and why your partner was livid (you committed a significant AWV by flatly asserting without sufficient warrant, violating the knowledge norm). It's a graded concept central to understanding how we hold each other accountable not just for *what* we say, but *how confidently* we say it relative to our grounds.
