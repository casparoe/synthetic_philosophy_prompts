  **Verbal Confusion & Why It Matters**  
  The primary verbal confusion centers on **"know" in the surprise condition**.  
  - **Camp A** treats "know" as *deducible from fixed premises* (announcement + calendar). This makes surprise vulnerable to logical deduction.  
  - **Camp B** treats "know" as *psychological certainty*, which can persist if students distrust the announcement’s coherence (e.g., "If I deduce the day, the professor must be lying, so I can’t deduce it").  
  - **Why it fuels disagreement**:  
    - Camp A sees Camp B as "denying the premise" (redefining "know" to avoid contradiction).  
    - Camp B sees Camp A as "overextending deduction" (treating hypothetical reasoning as actual knowledge).  
    The test cases force specificity: The one-day version isolates "know" (both agree it fails, but for different reasons), while the two-day variant tests if deduction inevitably destroys surprise.  

