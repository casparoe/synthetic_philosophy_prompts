  ### Adversarial Collaboration: Surprise Exam Paradox  
  **Agreed Claims**  
  1. The professor is truthful: The exam will occur on one of the announced days, and the surprise condition (defined below) will hold.  
  2. The students are perfectly logical: They believe the professor’s announcement, reason flawlessly, and update their beliefs based on new information (e.g., the exam not occurring on a given day).  
  3. The announcement is made in advance: For the full week (Monday–Friday), it is given on Sunday; for the two-day variant (Thursday–Friday), it is given on Wednesday.  
  4. The announcement states:  
     - "There will be an exam on one of the days [specified days]."  
     - "You will not know, on the evening before the exam, that it will occur the next day." (The "evening before" is defined as the start of the epistemic period for reasoning about the next day, e.g., Sunday evening for Monday.)  
  5. The surprise condition requires that, on the evening before the exam, the students lack *certain knowledge* (justified true belief) that the exam is the next day.  
  6. The elimination argument proceeds via backward induction:  
     - Assume the exam hasn’t occurred by the last possible day. Then, on the evening before, students would know the exam must be that day, violating the surprise condition. Thus, the last day is eliminated.  
     - Repeat inductively: Each prior day is eliminated because students would know it must be that day if all later days are eliminated.  
     - Conclusion: No day satisfies the surprise condition, contradicting the announcement.  
  7. In the **one-day version** (professor says on day D: "Exam on day D+1, and you won’t know on day D that it’s happening then"):  
     - The announcement is self-defeating. Students immediately know the exam is on D+1, violating the surprise condition. Thus, the exam cannot occur as announced.  
  8. In the **two-day variant** (professor says on Wednesday: "Exam on Thursday or Friday, and it will be a surprise"):  
     - Both camps agree the elimination argument runs identically to the full-week version, but with only two days.  

  ---

