answer: |-
  The radiology reporting practice reveals a sophisticated norm of assertion shaped by epistemic, pragmatic, and institutional constraints. Here’s a reconstruction of the implicit norm, its ambiguities, and implications of proposed alternatives:

  ### **Reconstructed Norm of Assertion**
  The practice presupposes a **context-sensitive knowledge norm**:  
  *One may assert *p* flatly only if *p* is perceptually direct, defeasibly reliable, and actionable without qualification in the immediate clinical context. Inferential claims require hedging to reflect their probabilistic nature and to signal shared epistemic responsibility with the reader.*

  **Key elements:**  
  1. **Perception vs. Inference Distinction:**  
     - **Perceptual claims** ("4 mm nodule") are treated as *observational facts* (even with known error rates) because:  
       - They rely on standardized, trainable pattern recognition.  
       - Errors are systematic (measurable/reducible through technology/training).  
       - They constitute "raw data" for downstream reasoning.  
     - **Inferential claims** ("benign vs. malignant") require hedging because:  
       - They involve uncontrolled variables (patient history, lab results).  
       - Responsibility shifts to the referring physician for final synthesis.  

  2. **Hedging as Multi-Functional Speech Act:**  
     - **Not merely weak assertion.** Phrases like "likely represents" simultaneously:  
       - Express the radiologist’s credence (epistemic).  
       - Issue a recommendation ("recommend follow-up").  
       - Allocate decisional authority ("correlate clinically").  
       - Mitigate liability by framing claims as probabilistic (legal).  

  3. **Phone vs. Report Asymmetry:**  
     - **Phone call:** Dyadic, urgent, and collaborative. Norm shifts to **pragmatic efficiency** – hedging drops because:  
       - Context resolves ambiguity (e.g., physician can ask follow-ups).  
       - Shared goal of patient care overrides defensive caution.  
     - **Written report:** Permanent, multi-audience document. Norm emphasizes **institutional robustness** – hedging protects against:  
       - Misinterpretation by non-experts (e.g., insurers, lawyers).  
       - Evolving evidence (e.g., a "definite granuloma" later proven malignant).  

  ---

  ### **Can Liability and Epistemic Readings Coexist?**  
  **Yes, they are complementary:**  
  - **Epistemic function:** Hedges accurately represent the radiologist’s credence (e.g., 95% confidence ≠ 100% knowledge).  
  - **Liability function:** Hedges preempt litigation by demonstrating adherence to professional standards (e.g., acknowledging uncertainty meets "duty of care").  
  Neither reading alone explains the practice. A purely liability-driven report would be unactionably vague; a purely epistemic one would ignore institutional realities.  

  ---

  ### **Underdetermination by Assertion Norms**  
  The practice is **compatible with multiple norms**, but not equally well:  
  | **Norm**               | **Explanatory Power**                                                                 |  
  |------------------------|---------------------------------------------------------------------------------------|  
  | **Knowledge Rule**     | Best fit: Explains flat perceptual claims as "known" (professionally justified), hedges as non-knowledge. Struggles with known miss rates. |  
  | **Truth Rule**         | Acceptable: Descriptions aim for truth, but doesn’t explain *why* inferences are hedged when true.               |  
  | **Reasonable Belief**  | Good fit: Hedges reflect reasonable but inconclusive beliefs. Fails to explain phone-call bluntness.          |  
  **Crucial gap:** No norm fully explains why perceptual errors are socially "acceptable" while diagnostic errors are litigated. This points to **pragmatic conventions** overriding strict epistemology.  

  ---

  ### **Impact of a Probability Rule (Structured Reporting)**  
  If findings were assigned probability ranges (e.g., "Nodule: 95% benign"):  
  1. **Hedges would transform, not disappear:**  
     - "Likely benign" becomes "LI-RADS 2 (95-98% benign)".  
     - Uncertainty is quantified but remains explicit.  
  2. **Phone calls would stay direct:**  
     - Physicians would still demand binary actions ("So, do we biopsy?"). Probability anchors the conversation but doesn’t replace it.  
  3. **Reports become hybrid assertions-measurements:**  
     - **Assertion:** "There is a nodule" retains perceptual force.  
     - **Measurement:** Probability ratings are institutional facts (e.g., "LI-RADS 2" asserts compliance with a classification system).  
     - **Outcome:** The report gains precision but loses narrative nuance. "Recommend follow-up" might persist to signal actionability beyond probability.  

  ---

  ### **Why the Core Practice Would Persist**  
  Even with probability rules:  
  - **Perceptual claims stay flat:** "4 mm nodule" won’t become "99% probability of a nodule" because perceptual confidence is entrenched as "knowledge-like" in medicine.  
  - **Hedging evolves but endures:** Probability ranges are themselves hedges against overcommitment. Legal and epistemic caution remain unavoidable.  
  - **Phone/report asymmetry remains:** Urgent decisions demand simplified interpretations; written documents serve multiple masters.  

  **In essence:** The two-tiered structure reflects medicine’s negotiation between *certainty required for action* and *uncertainty inherent in biology*. Changing assertion norms wouldn’t eliminate this tension – it would recast it.
