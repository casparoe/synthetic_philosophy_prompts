  Okay, let me start by unpacking this user's query. They teach political philosophy, focusing on legitimacy and obligation, but they're encountering a linguistic pattern related to speech acts. The core issue is about utterances that are supposed to perform an action but are defective at the time—yet later become valid retroactively through collective acceptance. 

  First, I need to understand the examples they provided. The marriage with an unlicensed officiant, the junta backdating decrees, the board member's premature vote. All these involve an initially invalid act that later gets treated as valid from the original date. The contrast is cases like bigamy or defrocked priests' baptisms, which remain void forever. The user is looking for a term in speech act theory that describes this retroactive validation.

  Hmm, the user mentions they've asked colleagues and got shrugs, and a law colleague mentioned de facto officer doctrine, but that's not quite right. They want a concept focused on the act itself, not officeholders. So they're seeking a theoretical framework from speech act theory or adjacent fields.

  Recalling Austin's work, he categorizes infelicities into misfires (acts not performed) and abuses (acts performed but insincere). The user's case doesn't fit neatly here because the act initially misfires but later becomes valid retroactively. Austin doesn't address how time and practice can change the validity of past acts. Searle's institutional facts might be closer since they depend on collective acceptance. The retroactive aspect seems key—collective practice alters the past status.

  Then there's Kelsen's annulment paradox in legal theory. If an invalid act is later validated, when does it become valid? The user's edge case about the couple splitting before the defect is discovered touches this. If they split, does the marriage retroactively exist until the split? That's messy. Maybe the retroactive validation only applies if the collective acceptance is continuous from the act onward.

  The user also needs a principled distinction between fixable and non-fixable defects. The examples suggest that acts tied to mutable institutions (like marriage, corporate decisions) can be retrofixed, while sacramental or identity-based acts (bigamy, baptism) can't. That makes sense because the latter involves metaphysical or rigid social constraints.

  Now, for a term. "Retroactive validation" is descriptive but not technical. "Collective retroactive ratification" is more precise. "Retrofactive constitution of institutional facts" is jargon-heavy but captures the creation of facts after the fact. The user might prefer a balance between accuracy and accessibility.

  The edge cases are crucial. The splitting couple: if the defect is found later, but they already split, does retroactive validation apply? Probably only if the collective acceptance persisted until the validation moment. If they split and reject the marriage, it might not validate. The junta example shows that ongoing power allows backdating, but if overthrown, those decrees might be nullified.

  The user's deeper need seems to be understanding how social practice can alter institutional reality over time, especially in political contexts where legitimacy is contested. They might be connecting this to political legitimacy—how usurpers become legitimate rulers through acceptance. The concept here bridges speech acts with the social construction of authority.

  I should also consider if there's a term in legal philosophy. "De facto validity" or "ratification" come to mind, but the user wants the speech act perspective. Maybe combining institutional facts with temporality. "Temporal plasticity of institutional facts" is another option, though not standard.

  In conclusion, the best approach is to frame it as collective acceptance retroactively constituting the institutional fact, with the distinction lying in the type of institution involved. The term might not exist, but the concept is vital for understanding how social practices validate initially defective acts in political and legal contexts.
answer: |-
  You've hit on a profoundly important and under-theorized phenomenon at the intersection of speech act theory, political philosophy, law, and social ontology. Austin's framework, while brilliant, doesn't adequately capture this *retroactive validation through collective acceptance and practice*. There isn't a single universally accepted term in core speech act theory for this specific "third outcome," but we can build a robust conceptual framework by drawing on related ideas and adjacent fields.

  Here's the breakdown:

  1.  **The Core Phenomenon:** You've described **the retroactive constitution of an institutional fact through sustained collective acceptance and practice, despite an initial infelicity (misfire).** The act, initially void *ab initio* (from the beginning), becomes valid as if it had been performed felicitously on the original date, *without being reperformed*. Time and social practice transform the meaning and status of the original utterance.

  2.  **Why Austin Falls Short:** Austin focused on the *conditions of utterance* (felicity conditions) at the moment of speaking. He classified failures as either:
      *   **Misfires:** The act is not achieved at all (e.g., marrying without authority).
      *   **Abuses:** The act is achieved but insincere/hollow (e.g., promising without intent).
      His framework is largely synchronic (focused on the moment of utterance). The diachronic (over time) effect of *social practice retroactively repairing the infelicity* wasn't his primary concern. He assumed a misfire meant "void then and void forever," which your cases clearly challenge.

  3.  **Key Concepts & Frameworks to Explain It:**
      *   **Institutional Facts (Searle):** This is crucial. Marriage, corporate authority, governmental power, valid contracts, and even sacraments (in their institutional aspect) are *institutional facts*. They exist only because we collectively agree they exist within a system of constitutive rules. Their reality is ontologically subjective but epistemically objective.
      *   **Collective Acceptance/Recognition:** The engine driving the retroactive validation is *sustained collective acceptance and recognition of the act's validity*. The couple lives as married; the junta's decrees are obeyed and enforced; the merger proceeds based on the vote. This ongoing practice *constitutes* the reality of the institutional fact *as if it had been valid all along*.
      *   **The "Counts As" Relation (Searle):** The initial utterance, though defective, *comes to count as* a valid performative *because* of the subsequent history of collective acceptance. "X (defective utterance + subsequent practice) counts as Y (valid performative act) in context C (the relevant institution)."
      *   **Retroactivity in Law & Legitimacy:** Your law colleague touched on this with *de facto officer doctrine*, but it's part of a broader legal principle: **Ratification** (subsequent approval validating a prior unauthorized act) and **Acquiescence/Estoppel** (preventing a party from challenging validity after having accepted benefits or remained silent). The junta example is pure *sovereign ratification* – the successful assertion of power retroactively legitimizes its origins. Kelsen's "Grundnorm" shift also lurks here – the new order's basic norm validates its own genesis.
      *   **Temporality of Social Ontology:** Institutional facts exist in a kind of "social time." Their validity isn't solely fixed at the moment of creation; it can be *reinterpreted and reconstructed* based on later events and collective stances. The past institutional reality is, to some extent, *plastic* based on present acceptance.

  4.  **A Proposed Term/Concept: Collective Retroactive Ratification (CRR) of Institutional Facts**
      *   **Definition:** The process whereby an utterance that initially failed to successfully perform an illocutionary act (due to a misfire) within an institutional framework is subsequently *collectively recognized and treated as having been successful at the original time of utterance*, thereby constituting the corresponding institutional fact retroactively. This recognition is constituted and evidenced by sustained practice, reliance, and the absence of timely challenge within the relevant community or institution. The retroactive validation is *not* the performance of a new act, but the *reinterpretation and acceptance* of the original act's status.

  5.  **The Principled Line (Fixable vs. Unfixable Defects):**
      The key distinction lies in the **nature of the institution and the type of infelicity**:
      *   **Fixable Defects (Typically CRR applies):** Defects relate to *procedural authority or form* within institutions where the *substance of the act aligns with institutional purpose* and *continued collective acceptance is possible and meaningful*. The infelicity is *extrinsic* to the core performative intent.
          *   *Lapsed License:* The officiant *intended* to marry, the couple *intended* to marry, the *form* was followed. The defect was external (bureaucratic authorization). Social practice (living as married) fulfills the *purpose* of marriage.
          *   *Premature Vote:* The board member *was* appointed, the vote *was* cast, the *intent* was clear. The defect was a minor temporal procedural glitch. The merger proceeded, fulfilling the purpose.
          *   *Junta's Decree:* The junta *effectively* holds power and *asserts* the validity. Collective acceptance/acquiescence (obedience, lack of revolt) ratifies both the authority and the decrees, retroactively constituting the power and the acts.
      *   **Unfixable Defects (Typically CRR *does not* apply):** Defects are *intrinsic* to the core performative intent or violate *fundamental, non-negotiable conditions* of the institution, often with metaphysical, identity-based, or strict legal prohibitions. Collective practice cannot alter the core violation.
          *   *Bigamy:* The core condition of marriage (monogamy at the time of the ceremony) is intrinsically violated. The second ceremony *cannot* create the status of "spouse" because that status is already occupied. No amount of living together changes the fundamental legal/metaphysical impossibility *at the time*.
          *   *Defrocked Priest Baptism:* The sacramental authority is seen as inherent and divinely conferred, not merely bureaucratic. The defect is intrinsic to the *source* of the power to perform the sacrament. Collective recognition cannot substitute for the required metaphysical authority within the theological framework. (Note: Some denominations *might* have provisions for retroactive validation under certain conditions, showing even this can be institution-dependent).
      *   **The Principle:** CRR applies when the infelicity is *procedural/formal* and *extrinsic* to the core constitutive rules of the institution, and when subsequent collective acceptance *fulfills the social purpose* of the act and the institution. It fails when the infelicity is *substantive/intrinsic*, violating a *fundamental, non-waivable condition* of the institution itself.

  6.  **The Edge Case (Splitting Couple & Discovery):**
      This exposes the critical role of **timing and reliance** in CRR.
      *   **Scenario:** Couple marries with defective officiant license. They live as married for years (building reliance: joint taxes, property, social status). They split up. *One week later*, the license defect is discovered.
      *   **Analysis:**
          *   **Retroactive Validation Likely STILL Applies (up to the split):** The years of collective acceptance, practice, and reliance *had already constituted the marriage as an institutional fact* through CRR. The defect was extrinsic/procedural. The *validity was retroactively constituted during the period of acceptance*.
          *   **The Split Terminates the Status:** The split (divorce filing, separation agreement, clear mutual intent) is a *new performative act* (or series of acts) that terminates the marital status *from that point forward*.
          *   **Discovery is Irrelevant to Past Validity:** Discovering the *original cause* of the initial misfire doesn't *undo* the CRR that *already happened* through the years of practice. The marriage was valid *from the wedding day until the date of termination/split*. The discovery might cause legal headaches regarding property division finalized before discovery, but it doesn't negate the *past existence* of the marriage status that was socially constituted.
      *   **Counter-Scenario:** If the defect was discovered *immediately after the ceremony*, and the couple *never lived as married* or actively rejected the status, CRR would *not* occur. The act would remain void *ab initio*. Reliance and sustained practice are essential ingredients.

  **In summary:** The phenomenon is the **Collective Retroactive Ratification (CRR) of Institutional Facts**. It occurs when sustained collective acceptance and practice following an initially misfired performative utterance retroactively constitute the intended institutional fact as having been validly created at the original time. The line between fixable and unfixable defects hinges on whether the infelicity is extrinsic/procedural vs. intrinsic/substantive to the core constitutive rules of the institution. Time and practice don't change the past physical utterance; they change the *social meaning and institutional status* attributed to that utterance and its consequences. This concept is vital for understanding how legitimacy, authority, and social reality are often constituted *after the fact* through acceptance and practice, especially in the messy world of politics and law you inhabit.
