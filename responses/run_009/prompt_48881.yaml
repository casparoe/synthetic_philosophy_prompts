  ### Joint Statement: Adversarial Collaboration on Collective Harms and Individual Acts

  **Preamble**  
  This document represents a synthesis of agreements and a clear mapping of disagreements between Camp A ("Difference Makers") and Camp B ("Causalists") regarding the moral status of individual acts in collective harm scenarios. Both camps affirm the importance of collective harms (e.g., climate change, industrial animal suffering, election outcomes) and recognize the challenge of assigning individual moral responsibility. We agree on core conceptual tools (thresholds, buffers, expected value) but diverge on their moral implications. This statement isolates precise points of contention and identifies testable cruxes to guide further inquiry. Both camps endorse this framing as accurate and non-caricatured.

  ---

  ### Section 1: Agreed Claims  
  Both camps accept the following propositions:  

  1. **Collective Harm Problems Are Real**: Systems producing large-scale harms (e.g., factory farming, carbon emissions, electoral outcomes) generate morally significant consequences, and ethical analysis must address them.  
  2. **Thresholds and Buffers Diminish Individual Causal Efficacy**: In systems with aggregation thresholds (e.g., batch purchasing) or buffers (e.g., overstocking), individual acts (e.g., one meal order) often have near-zero *probability* of changing physical outcomes (e.g., extra crate purchased, animal killed).  
  3. **Expected Value is Computable but Not Definitive**: The expected harm of an act (probability of being pivotal × magnitude of harm) is mathematically calculable, but its *moral weight*—especially when probabilities are tiny—is contested. It does not, by itself, resolve whether an act is wrong.  
  4. **Wrongness of Practice vs. Act Can Diverge**: A collective practice (e.g., industrial meat production) may be wrong even if no individual act within it is wrong, and vice versa. The relationship between the two is disputed.  
  5. **Collective Action Problems Exist**: Uncoordinated individual acts can cause aggregate harm even when no single act is efficacious (e.g., tragedy of the commons). Solving these requires collective solutions (e.g., policy changes), but individual moral duties within such systems are debated.  
  6. **Intent and Knowledge Matter**: Both camps agree that an agent’s intent (e.g., supporting a harmful practice) and knowledge (e.g., understanding systemic effects) influence moral assessment, but disagree on whether they can render an act wrong absent causal impact.  
  7. **Semantic Ambiguity in "Difference-Making"**: The term "makes a difference" is ambiguous. It may refer to:  
     - (a) *Causal difference*: The act changes the outcome (Camp B’s focus).  
     - (b) *Explanatory contribution*: The act is part of a set explaining the outcome (Camp A’s focus).  
     Disagreements invoking this term may be verbal if not disambiguated.  

  ---

  ### Section 2: Residual Disagreements  
  The table below states disagreements in language acceptable to each camp. "Substantive" denotes foundational moral disagreements; "Verbal" indicates clashes reducible to terminology.  

  | Topic | Camp A (Difference Makers) Position | Camp B (Causalists) Position | Disagreement Type |  
  |-------|-------------------------------------|------------------------------|------------------|  
  | **Moral Significance of Causal Inefficacy** | "An individual act can be morally wrong solely because it constitutes participation in a collectively harmful practice, even if its causal impact is zero." | "An act cannot be wrong for causing a harm it demonstrably does not cause. Wrongness requires non-negligible causal impact or indirect harm (e.g., reinforcing unjust systems)." | Substantive |  
  | **Role of Expected Harm** | "An act is wrong if its expected harm (probability × harm) exceeds a threshold of moral significance, regardless of whether the harm materializes." | "Expected harm is only morally decisive when the probability of being pivotal is non-negligible. Negligible probabilities cannot ground wrongness." | Substantive |  
  | **Source of Moral Wrongness** | "Wrongness arises from an act’s *participation* in a harmful system (e.g., complicity, expressive harm, or integrity violation), independent of causal efficacy." | "Wrongness arises solely from an act’s *causal consequences* (actual or probable). Participation without consequence is morally neutral." | Substantive |  
  | **"Makes a Difference" Usage** | "An act 'makes a difference' if it is a necessary part of a sufficient set of acts that collectively cause harm." | "An act 'makes a difference' only if it is pivotal (i.e., without it, the harm would not occur)." | Verbal |  
  | **Voting in Non-Pivotal Elections** | "Voting for a harmful candidate is wrong because it expresses endorsement of harm and contributes to a corrupt system, even if non-pivotal." | "A non-pivotal vote is morally inert; wrongness attaches only to pivotal acts or systemic reform failures." | Substantive |  

  ---

  ### Section 3: Cruxes  
  The following cruxes, if resolved, would compel at least one camp to revise its position. Each includes an agreed-upon test case and opposing predictions.  

  1. **Crux Question**: Does a negligible probability of causal impact (e.g., ≤0.001) *always* negate moral wrongness from expected harm?  
     - **Agreed Test Case**: The 10,000 Diners Problem (each diner orders meat independently with 50% probability; kitchen buys 1 crate per 500 orders). Compute the expected animals harmed by one diner’s meat order.  
     - **Camp A Prediction**: Expected harm = (1/500) × harm per crate. This is non-negligible if harm per crate is large (e.g., 100 animal lives), rendering the act wrong.  
     - **Camp B Prediction**: Expected harm is negligible (e.g., 0.002 animal lives) and cannot ground wrongness; the act is permissible.  

  2. **Crux Question**: Can an act be wrong *only* because it expresses endorsement of a harmful practice, absent causal impact?  
     - **Agreed Test Case**: Meatless Monday: Student X eats a chicken sandwich when the cafeteria’s meat order is uncorrelated with daily trays (buffer exists). X knows the system causes harm but enjoys the sandwich.  
     - **Camp A Prediction**: The act is wrong because it expresses complicity in factory farming, regardless of causal impact.  
     - **Camp B Prediction**: The act is permissible; wrongness applies only to causal actors (e.g., farm managers) or collective policy failures.  

  3. **Crux Question**: Does moral responsibility for collective harms require *direct causal contribution*?  
     - **Agreed Test Case**: Class Election: Candidate A wins by 1 vote; Voter Y supported A, knowing A would cause harm. Y’s vote was non-pivotal (A would have won without Y’s vote).  
     - **Camp A Prediction**: Y shares moral responsibility for A’s harm because Y’s vote was part of the sufficient set electing A.  
     - **Camp B Prediction**: Y bears no responsibility; only pivotal voters (or systemic designers) are responsible for the outcome.  

