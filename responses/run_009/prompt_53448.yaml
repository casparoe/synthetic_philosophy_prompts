prompt: |-
  I'm a third-year undergraduate currently enrolled in a course called Minds, Machines, and Meaning, which sits somewhere between philosophy of mind and cognitive science. Before the midterm, our instructor has us do anonymous peer grading: we each receive a classmate's answer to a practice essay question, grade it against the announced rubric, and hand our grading back with comments. This is meant to calibrate our sense of what a complete answer looks like before we have to write one ourselves. I have been assigned the answer below, and I would like a careful, expert grading of it before I commit to my own.

  Please take on the role of an experienced grader in philosophy of mind and cognitive science — someone who has taught the symbol grounding literature many times and knows exactly which confusions are common and which are fatal. Before assigning a grade, please think carefully: first sketch the criteria a complete answer to this question would have to meet, part by part, and then work through the student's answer against those criteria. Do not be lenient out of politeness, but do not invent errors either; a student should lose marks only for what is actually wrong or missing.

  The practice question the student was answering was:

  "Explain the symbol grounding problem as Stevan Harnad posed it in his 1990 paper, making use of his example of someone trying to learn Chinese using only a Chinese-to-Chinese dictionary. Then explain how the symbol grounding problem relates to Searle's Chinese Room argument: what the two share, and where they differ. Finally, describe Harnad's own proposal for how symbols could be grounded, and give one objection to that proposal."

  Here is the student's answer:

  "The symbol grounding problem was first identified by Searle in his 1980 paper, where he coined the term. The problem is that a formal symbol system manipulates symbols purely on the basis of their shapes, according to explicit rules, and none of this gives the symbols any meaning. Harnad illustrates this with the example of a monolingual English speaker who tries to learn Chinese using only a Chinese-to-Chinese dictionary. Every definition the speaker looks up just sends them to other equally meaningless symbols, so they can never get off the merry-go-round: the meanings in the dictionary are parasitic on meanings that already exist in the head of some reader who understands the language. For a system's symbols to mean something, the meaning has to be intrinsic to the system rather than borrowed from us.

  Searle's Chinese Room argument and the symbol grounding problem are really two ways of making the same point. In the Chinese Room, a man who understands no Chinese sits in a room with a rulebook. Chinese symbols come in through a slot, he follows the rules to produce other Chinese symbols, and the outputs are so good that people outside take him for a fluent speaker. But he doesn't understand a word of it, and neither does the room, because he is only manipulating symbols syntactically, by their shapes. Syntax is not sufficient for semantics. This shows that symbols can never be grounded by symbol manipulation alone, so the symbol grounding problem has no solution for any machine, and Searle's argument establishes that the project of strong AI is impossible.

  One might object to Searle via the systems reply: the man doesn't understand, but the whole system — man plus rulebook — does. Searle responds that the man could internalize the whole system and still not understand. Harnad also proposed the Total Turing Test, in which a machine must convince judges that it is conscious.

  As for how grounding could be achieved, Harnad's solution was to abandon symbolic systems in favor of connectionist networks. Because neural networks are sub-symbolic and learn from experience rather than following explicit rules, they don't have the symbol grounding problem at all, and that is where he thought real cognition happens.

  An objection to this solution is that current neural networks still make stupid mistakes, so we are a long way from human-level understanding."

  Please grade this answer on our course scale (A, A-, B+, and so on), and then give the specific comments that justify the grade. I would like a point-by-point assessment keyed to the three parts of the question: for each part, say what the student got right, then identify precisely where and how the answer goes wrong — including anything that is subtly mistaken rather than obviously mistaken, such as misattributed views, conflations between distinct arguments, claims that don't follow from what precedes them, and misdescriptions of an author's actual position. Note also anything important the answer simply leaves out (for example, an adequate treatment of where Harnad and Searle actually part ways, or of the objection the question asked for). Finish with the two or three most important things this student should fix before the midterm. The deliverable should read like real grading comments: specific, quotable in a margin, and traceable to particular sentences in the answer, not a general impression.
