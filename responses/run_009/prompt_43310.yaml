prompt: |-
  I serve on a working group drafting standards for how forensic experts may phrase their courtroom conclusions, and the philosophical debate over the norm of assertion keeps intruding on it. Some members argue an expert should only assert what she knows, citing the knowledge norm of assertion; others reply that calibrated probabilistic conclusions -- of the form it is highly likely, or extremely probable, that the defendant was present -- are perfectly legitimate assertions, so long as they are warranted at the stated level. I want to know which open questions in this debate genuinely matter for our practice and which are internal to the dialectic, with no bearing on it. Rank the following, and any others you think belong: whether lottery and Moorean cases show that a high justified credence is still insufficient for permissible assertion; whether there is a constitutive norm of assertion at all, as opposed to norms attaching to the social practice of testifying; how the norm of assertion connects to the norms of practical reasoning governing those who act on the assertion; and whether the standard for permissible assertion shifts between ordinary conversation, scientific reporting, and testimony under oath. For each, explain what makes it matter or not: whether our recommendations presuppose an answer to it, whether it is tractable with the tools of epistemology rather than empirical studies of juries, and what evidence -- from pilot studies, case law, or elsewhere -- would move it up or down the list. I want a defended ordering, not a survey of positions.
reasoning: |-
  Okay, the user is part of a working group setting standards for forensic experts' courtroom testimony phrasing. The core issue is how philosophical debates about assertion norms impact practical guidelines. They specifically want to know which philosophical questions genuinely affect their work and which are just academic.

  Hmm, their frustration is palpable - they're wrestling with abstract epistemology while trying to craft concrete courtroom standards. There's clear tension between the "knowledge camp" (experts should only assert what they know) and the "probabilistic camp" (calibrated likelihood statements are acceptable). 

  Right, let's unpack their listed questions by practical urgency: First, the lottery/Moorean cases debate. If high probability alone doesn't justify assertions (like saying "your ticket lost" before the draw), this could torpedo probabilistic testimony. But courtroom contexts differ crucially - forensic experts aren't guessing lottery numbers. Case law already admits statistical evidence (like DNA) despite philosophical objections, so this might be less critical than it seems. Pilot studies could test if jurors misinterpret calibrated probabilities as certainties.

  Second, the constitutive norm question. Whether assertion inherently requires knowledge or just fits social practices. Practically speaking, this distinction might not matter - either framework can accommodate courtroom-specific rules. What matters is setting clear expectations for expert testimony, not the philosophical grounding. 

  Third, the practical reasoning link. This seems vital - if jurors treat "highly likely" as actionable certainty, mismatched norms could cause real harm. We need empirical data on how assertions influence verdicts. The recent hair analysis scandal shows the dangers of overstated certainty. The working group must decide whether to require explicit caveats about reasonable doubt thresholds.

  Fourth, context-sensitivity. This is the most urgent issue. Courtroom testimony isn't casual conversation; experts testify under oath with stakes involving liberty. Jurors may perceive likelihood statements as weaker evidence, potentially affecting convictions. Studies like Koehler's on verbal vs numerical probabilities are directly relevant here. Standards must navigate this carefully - probabilistic language might be acceptable only with proper jury instructions.

  The user needs actionable guidance, not philosophy lessons. I'll prioritize questions where epistemology and courtroom reality collide, especially those with empirical backing. The key is protecting the justice system's integrity while respecting epistemic limitations of forensic science.
answer: |-
  Based on the practical demands of drafting courtroom standards for forensic experts, here is a defended ranking of the philosophical questions by their genuine impact on your task, prioritizing relevance, tractability with philosophical tools, and potential for resolution via evidence:

  **Ranked by Practical Impact on Forensic Testimony Standards:**

  1.  **Whether the standard for permissible assertion shifts between contexts (conversation, science, testimony).**
      *   **Why it matters most:** This directly dictates the core level of certainty required for courtroom assertions. If the norm *does* shift to a higher standard (e.g., "knowledge" or "beyond reasonable doubt" warrant) in sworn testimony compared to a lab report or casual talk, it fundamentally constrains permissible phrasing. Asserting "highly likely" might be fine in science but impermissible in court. Your recommendations **presuppose an answer** to this. Ignoring context-sensitivity risks standards that are either too lax (allowing unreliable testimony) or too strict (preventing valuable probabilistic evidence).
      *   **Tractability:** Primarily epistemological (analyzing the nature of testimony, oaths, stakes, institutional roles) but heavily informed by legal norms and social expectations. The *concept* of context-sensitivity is philosophical; its *application* to law is interdisciplinary.
      *   **Evidence that moves it:**
          *   **Case Law:** Rulings on admissibility of probabilistic testimony, judicial instructions regarding expert certainty, appeals based on misleading expert phrasing.
          *   **Pilot Studies:** Jury comprehension studies (e.g., Koehler's work on verbal vs. numerical probabilities), mock trial research on how phrases like "reasonable scientific certainty" or "highly probable" influence verdicts and perceived certainty.
          *   **Legal Standards:** Existing legal doctrines (e.g., Daubert/Kumho, FRE 702/703) demanding reliability and relevance, the definition of "reasonable doubt," rules against ultimate issue testimony (if phrased probabilistically).
          *   **Professional Guidelines:** Standards from scientific organizations (e.g., OSAC, PCAST) on reporting forensic conclusions.

  2.  **How the norm of assertion connects to the norms of practical reasoning governing those who act on the assertion (jurors/judges).**
      *   **Why it matters:** Forensic assertions exist to guide high-stakes decisions (conviction, sentencing). If the norm of assertion requires that the assertion *warrants the action* it typically prompts, this imposes a direct constraint. Saying "highly likely" must be warranted *enough* for a juror to rationally find guilt "beyond reasonable doubt." Misalignment here is the core practical danger. Your recommendations must ensure expert phrasing doesn't mislead triers of fact about the appropriate action threshold.
      *   **Tractability:** A rich intersection of epistemology (norms of assertion/action) and practical philosophy (decision theory). Requires analyzing how assertions function in practical reasoning chains.
      *   **Evidence that moves it:**
          *   **Pilot Studies:** Research on how jurors *actually* interpret and act upon probabilistic phrases in relation to the "beyond reasonable doubt" standard. Do they understand "highly likely" as meeting BRD? Do they discount it?
          *   **Case Law:** Cases where convictions based primarily on probabilistic assertions were overturned due to insufficiency of evidence or misleading testimony.
          *   **Legal Theory:** Analyses of the logical connection between evidence standards (preponderance, BRD) and permissible expert conclusions that feed into them.

  3.  **Whether lottery and Moorean cases show that high justified credence is insufficient for permissible assertion.**
      *   **Why it matters (but less than above):** This challenges the legitimacy of probabilistic assertions *in principle*, even if well-calibrated. If lottery cases show assertion requires categorical knowledge (not just high probability), it directly undermines the "probabilistic camp" in your group. However, the *context* of forensic testimony provides strong counter-arguments (unique evidence vs. lottery structure; different stakes/purpose). The debate matters for justifying the use of probabilities *at all* in court.
      *   **Tractability:** Primarily internal epistemology. Resolving the lottery paradox itself is core philosophy. Applying it to forensic contexts involves philosophical argument about relevant dissimilarities.
      *   **Evidence that moves it:**
          *   **Case Law:** Precedent admitting probabilistic evidence (DNA, statistics) despite the "lottery objection." Judicial reasoning justifying this admission.
          *   **Pilot Studies:** Limited relevance. The objection is conceptual: *Can* high probability *ever* warrant assertion? Studies show how people *do* react, not necessarily how they *should*.
          *   **Legal/Epistemic Norms:** Arguments that the forensic context *defeats* the lottery intuition (e.g., evidence isn't structurally identical; the purpose is different).

  4.  **Whether there is a constitutive norm of assertion at all, vs. norms from the social practice (testifying).**
      *   **Why it matters least (for your purpose):** This is the most meta-level debate. Even if there is a constitutive norm (e.g., knowledge), it might be overridden or specified by the norms of the specific practice (courtroom testimony). Conversely, if assertion has no constitutive norm, the practice-specific norms (testimony under oath) are still paramount. **Your recommendations primarily depend on defining the norms *of the practice* of expert testimony,** regardless of whether assertion itself has a constitutive essence. Debating constitutive norms is unlikely to change the practical constraints derived from legal standards, ethical duties, and the need for reliable jury decision-making.
      *   **Tractability:** Highly abstract, core meta-epistemology/philosophy of language. Very difficult to resolve conclusively.
      *   **Evidence that moves it:** Primarily philosophical argumentation. Empirical evidence about practices is relevant to identifying *social* norms, but not to settling whether assertion itself is *constitutively* governed by a specific norm. Case law/pilot studies are largely irrelevant to this foundational question.

  **Defended Ordering Justification:**

  *   **Context-Sensitivity (#1) is paramount** because the courtroom context *is* your subject matter. Failing to recognize its unique demands makes any standard potentially unfit for purpose. Evidence directly addresses this.
  *   **Connection to Action (#2) is critical** because the entire point of expert testimony is to guide verdicts. Ignoring the action norm risks experts making assertions that cannot rationally support the required juror conclusions, undermining the justice system. Evidence is highly relevant.
  *   **Lottery/Moorean Cases (#3)** directly challenge the permissibility of the very form of assertion (probabilistic) that is central to the practical debate *within* your group. While context provides strong counterarguments, resolving this philosophical challenge matters for the legitimacy of the probabilistic approach. Evidence is somewhat relevant (legal precedent admitting probabilities).
  *   **Constitutive Norm (#4)** is too abstract and detached from the institutional realities and specific purpose of courtroom testimony. The norms governing *this practice* are the essential ones to define, regardless of the outcome of the constitutive debate. It has minimal bearing on drafting practical standards for phrasing conclusions. Evidence is largely irrelevant.

  **Key Recommendation for Your Group:**

  Focus your standards debate on the **demands of the courtroom context (#1)** and the **need for expert assertions to reliably support juror reasoning toward the legal standard of proof (#2)**. These are tractable with a mix of philosophical analysis (understanding warrant, action, context) and engagement with empirical evidence (jury studies, legal precedent). While the lottery problem (#3) should be addressed to justify probabilistic language, the constitutive debate (#4) is likely a philosophical diversion with little practical payoff for your specific task. Prioritize standards that ensure expert phrasing aligns with the high stakes, oath-bound nature of testimony and provides clear, non-misleading guidance to the trier of fact within the legal framework.
