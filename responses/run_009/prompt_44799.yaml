answer: |-
  ## Specification: Desiderata for an Adequate Account of Aggregation in Moral Theory

  **To the Seminar:** Welcome to the unit on aggregation. Each year, we confront the same fundamental tension: how, if at all, do the *numbers* of people affected by burdens and benefits factor into our moral obligations when individuals' claims conflict? Contractualists often resist "summing" across persons as a violation of individual inviolability. Utilitarians see the refusal to sum as an irrational block to minimizing suffering. Both positions find powerful intuitive support in specific cases, leading to stalemate. Before diving into the theories, we need clarity on the *constraints* any adequate account must satisfy. This document outlines the essential desiderata, motivated by core cases and distinctions central to the debate. Treat these as the fixed stars we navigate by. Your task throughout the unit will be to evaluate how well competing theories meet this specification and where they must compromise.

  **Core Desiderata (Motivated by Cases & Distinctions):**

  1.  **Non-Superstition (Non-Negotiable):** The account must not treat a difference between persons as fundamentally more significant than an analogous difference within a life *merely because* it crosses a personal boundary.  
      *   **Motivation:** Parfit's Challenge. Refusing to aggregate nearly identical pains suffered by many individuals, thereby accepting vastly more total suffering to avoid combining complaints across persons, seems superstitious if we readily accept similar trade-offs within a single life (e.g., enduring many mild headaches to avoid one severe one). The mere fact of distinct persons cannot be the sole reason to prohibit aggregation; there must be a deeper moral reason. (Engages Interpersonal vs. Intrapersonal distinction).

  2.  **Complaint Sensitivity (Non-Negotiable):** The account must be sensitive to the *magnitude* of the burden borne by an individual, not just the fact that they bear *a* burden. A larger individual burden generates a stronger claim against being burdened.  
      *   **Motivation:** Scanlon's Contrast Case. The intuition that the single person suffering a massive burden (e.g., death) cannot be outweighed by a vast number suffering very minor burdens (e.g., a stubbed toe) relies on the *relative weakness* of each individual minor complaint compared to the overwhelming strength of the single large complaint. Ignoring burden magnitude leads to implausible results here. (Engages Strength vs. Number).

  3.  **Number Sensitivity (Non-Negotiable):** The account must be sensitive to the *number* of individuals burdened. All else being equal, a situation burdening more individuals is morally worse than one burdening fewer, and this can sometimes justify imposing a burden on one to save many from comparable burdens.  
      *   **Motivation:** Taurek's Rescue Case & Scanlon's Observation. The strong intuition (including Scanlon's contractualist justification) that saving five lives is required over saving one life demonstrates that numbers *can* matter when the burdens avoided (death) are comparable. A theory that *never* allows numbers to count cannot capture this core intuition. (Engages Strength vs. Number, Ex Ante/Ex Post - a lottery might be considered).

  4.  **Threshold Effect for Disparate Burdens (Contractualist Prejudice, but Widely Shared):** The account must recognize that when individual burdens are sufficiently *disparate* in magnitude, the *number* of individuals suffering lesser burdens cannot automatically outweigh the claim of the single individual suffering the vastly greater burden.  
      *   **Motivation:** Scanlon's Contrast Case (Reinforced). The intuition against summing many trivial burdens to override a catastrophic burden for one person suggests a non-linear relationship between burden magnitude and claim strength, or a threshold beyond which a claim becomes "veto-worthy" against aggregation of lesser claims. This reflects the contractualist emphasis on individual justifiability. (Engages Strength vs. Number).

  5.  **Ex Ante/Ex Post Coherence Constraint (Non-Negotiable):** The account must provide a plausible reconciliation between its verdicts from the *ex ante* perspective (before outcomes are known, under conditions of uncertainty) and the *ex post* perspective (after outcomes are known, with burdens assigned).  
      *   **Motivation:** The Medicine Lottery Case. An ex ante fair lottery for the last life-saving dose seems acceptable to all participants. However, the *ex post* outcome (one dies, others saved) is identical to the outcome condemned if we simply chose to save the many without a lottery. The theory must explain why the lottery makes a moral difference, or consistently condemn/accept both the lottery procedure and the outcome it produces. Ignoring this temporal dimension leads to instability.

  6.  **Stability Across Small Variations (Non-Negotiable):** The account must avoid implausibly sharp discontinuities in its verdicts when cases differ only by very small, seemingly morally insignificant, variations in burden magnitude or number.  
      *   **Motivation:** The Ladder of Rescue Cases. If a theory saves the many at the top of the ladder (e.g., save 100 from broken arms vs. 1 from death), refuses to save the many at the bottom (e.g., save 1,000,000 from a pinprick vs. 1 from death), but must switch its verdict somewhere in between (e.g., save 10,000 from a minor burn vs. 1 from death), it faces the challenge of identifying a morally significant difference between adjacent rungs (e.g., saving 10,000 from a minor burn vs. saving 10,001 from a *slightly less* minor burn). The theory must either avoid such switches or provide a compelling justification for the discontinuity. **This ladder case strains Desideratum 6 (Stability Across Small Variations) most acutely.**

  **Analysis: Implications of the Desiderata**

  1.  **Joint Satisfiability:** It is highly plausible, perhaps inevitable, that **no theory can fully satisfy all desiderata simultaneously.** The core tension lies between the demands of **Non-Superstition (1)** and **Complaint Sensitivity (2)** combined with the **Threshold Effect (4)**. Non-Superstition pushes hard towards aggregation in Parfit-like cases (many small pains vs. one slightly larger one). However, Complaint Sensitivity and the Threshold Effect push hard against aggregation in Scanlon's Contrast Case (many trivial burdens vs. one catastrophic one). Bridging the gap between these poles while maintaining **Stability (6)** across the spectrum (the Ladder) and respecting the **Ex Ante/Ex Post Constraint (5)** is the fundamental challenge. **The most likely candidate for rejection by a viable theory is the Threshold Effect (4)**, though this rejects a deeply held intuition. Utilitarians reject it entirely; contractualists embrace it but struggle with Non-Superstition and Stability.

  2.  **Exclusionary Power:** The desideratum doing the most work to exclude *all* major contenders in their standard forms is the **Ex Ante/Ex Post Coherence Constraint (5)**.
      *   **Utilitarianism:** Struggles to explain why a fair lottery is morally required or significant in the medicine case when the ex post outcome (minimizing deaths) is identical to the outcome achieved by simply saving the many. The ex ante perspective seems epiphenomenal.
      *   **Scanlonian Contractualism:** Faces the "Agency Problem" or "Forfeiture Problem." Why would the loser in the medicine lottery *ex post* accept that their complaint is outweighed? Their actual burden is death, just as if chosen arbitrarily. The ex post complaint seems identical; the ex ante agreement doesn't obviously nullify it. Scanlon's focus on ex post justifiability to each individual is strained.
      *   **Prioritarianism:** While sensitive to numbers and burden size, standard prioritarianism typically evaluates outcomes solely ex post, offering little inherent moral significance to the ex ante lottery procedure itself beyond its effect on expected welfare. It shares utilitarianism's difficulty.
      *   **Taurekian Anti-Aggregation:** Faces the reverse problem. If saving the many without a lottery is wrong (favoring a group over an individual), why is a lottery that *leads to the same ex post outcome* acceptable? The ex ante justification seems crucial for Taurek, but the ex post outcome remains morally problematic by his lights unless the loser's claim is seen as fully extinguished by the lottery "loss."

  This specification defines the terrain. Your task is to see which theories navigate it best, where they stumble, and what compromises they demand. The friction points identified above – particularly the Ex Ante/Ex Post tension and the Stability challenge of the Ladder – will be our constant guides. Good luck. The literature awaits.
