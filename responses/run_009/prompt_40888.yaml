  We are building a quiz to sort students into different views on moral dilemmas without directly asking about the views. We'll use concrete cases and then map the answers to positions. The positions we want to cover are:

  1. Ross-style: conflicts dissolve when you see the more stringent duty; no residue.
  2. Strict no-conflict: apparent conflicts are always due to confusion; no real conflicts.
  3. Dilemmist with residue: you violate an obligation and there is a leftover duty (e.g., to feel guilty, apologize, make amends).
  4. Dilemmist without residue: you do wrong no matter what, but once you choose, there's no leftover obligation.
  5. Epistemic-only: dilemmas exist only because of our limited knowledge; in principle, they are resolvable.

  We'll design 8-10 questions (cases) with 2-3 answer options each. Each case will present a moral conflict and ask the student what they think about the situation, focusing on the key splits (like residue, ought implies can, etc.).

  We'll avoid trolley problems. We'll use fresh cases.

  Let's outline the key splits and then design cases around them:

  Split 1: When two obligations conflict and you do the better one, does the other obligation disappear? (No residue vs. residue)
  Split 2: Does "ought implies can" hold? And if so, at what level? (each obligation separately or only the disjunction)
  Split 3: Can a fully informed agent ever face a genuine dilemma (ought A and ought B, but cannot do both)?
  Split 4: Is blamelessness in a tragic choice evidence that it wasn't a real dilemma?
  Split 5: Are some dilemmas only epistemic (resolvable in principle but not by us)?

  We'll design cases that probe these without being too leading.

  Let me propose 8 cases:

  Case 1: The Emergency Promise-Breaking
  You have promised to meet a friend for lunch at noon. On the way, you witness a car accident where someone is critically injured and needs immediate help. You are the only person around. Helping the injured person will make you break your promise. You decide to help the injured person.

  Question: After helping the injured person, do you have any moral obligation left regarding the broken promise?
  A) No, because helping the injured person was clearly the right thing to do and that overrides the promise. The obligation to keep the promise disappears in this situation.
  B) Yes, you still have an obligation to apologize to your friend and explain the situation because you broke a promise, even though it was the right choice.
  C) You have no obligation at all, not even to apologize, because the situation made it impossible to keep the promise and you did what you ought to have done.

  This probes residue.

  Case 2: The Imminent Threat and the Lie
  A friend is hiding in your home from a would-be murderer. The murderer comes to your door and asks if your friend is inside. You know that if you tell the truth, your friend will be killed. You decide to lie to the murderer to save your friend.

  Question: After lying, do you have any moral residue?
  A) No, lying was the right thing to do in this situation and there's no leftover obligation.
  B) Yes, you should feel guilty for lying and perhaps confess or make amends later because lying is always wrong, even in this situation.
  C) You don't have an obligation to feel guilty or make amends because you did the right thing, but you might still feel bad because of human psychology.

  This also probes residue and also the idea of doing a wrong for a greater good.

  Case 3: The Overlapping Duties
  You are a doctor on call at a hospital. You have two patients in critical condition in different parts of the hospital, both needing your immediate attention to survive. You can only save one. You choose to save the one who has a better chance of survival.

  Question: How do you describe your moral situation?
  A) You had an obligation to both, but by saving one you violated the obligation to the other. You did wrong by the one you didn't save.
  B) You had an obligation to save as many as possible, and by saving the one with the better chance you fulfilled your obligation. There was no violation.
  C) You couldn't save both, so you didn't have an obligation to save both. You only had an obligation to save the one you could save.

  This probes whether obligations disappear when impossible and whether "ought implies can" applies per obligation or only the disjunction.

  Case 4: The Preventative Sacrifice
  You are a security guard and you see a terrorist about to detonate a bomb that will kill hundreds. The only way to stop the terrorist is to shoot him, but you are a pacifist and have a moral duty not to kill. If you don't shoot, he will detonate the bomb and kill many.

  Question: If you shoot the terrorist, have you violated a moral duty?
  A) Yes, you have violated the duty not to kill, even though it was necessary to prevent greater harm. You must seek atonement for this violation.
  B) No, because the duty not to kill is overridden by the duty to save lives in this extreme situation. You did not violate any duty.
  C) You didn't violate a duty because it was impossible to avoid killing in this situation to prevent the greater harm. The duty not to kill didn't apply when it conflicted with the duty to save so many.

  This probes residue and overriding.

  Case 5: The Unavoidable Wrongdoing
  A person is trapped in a situation where no matter what they do, they will violate a serious moral duty. For example, a mother must choose which of her two children to save from a burning building, and the other will die. She chooses to save one.

  Question: After the event, is the mother blameworthy?
  A) She is not blameworthy because she did the best she could in an impossible situation, but she did violate a duty to the child who died.
  B) She is not blameworthy and she did not violate any duty because she couldn't have done otherwise. She fulfilled her duty by saving one.
  C) She is blameworthy for not saving both, even though it was impossible, because she had a duty to both.

  This probes blamelessness and whether it indicates no dilemma.

  Case 6: The Secret Resolution
  Imagine a case where an agent faces two conflicting duties, but unbeknownst to them, one of the duties is actually invalid (e.g., they think they have to keep two promises, but one promise was made under false pretenses and therefore not binding). However, the agent doesn't know this and must choose.

  Question: At the moment of choice, does the agent face a genuine moral dilemma?
  A) Yes, because from their perspective, they have two conflicting obligations and must choose without knowing which is invalid.
  B) No, because objectively there is no dilemma, only one real obligation. The agent's feeling of dilemma is due to ignorance.
  C) There is a dilemma only in the epistemic sense: the agent doesn't know the resolution, but in reality, there is no conflict.

  This probes the epistemic view.

  Case 7: The Conflicting Promises
  You have promised to attend your best friend's wedding and you have also promised to attend your sister's graduation, both at the same time in different cities. You cannot be at both. You decide to go to the wedding.

  Question: At the time you made the decision (and before the events), what was your moral situation?
  A) You had an obligation to attend both, but that was impossible. Therefore, you didn't really have an obligation to do both; you only had an obligation to do one or the other.
  B) You had two obligations, and by choosing one, you violated the other. You ought to have done both, but you couldn't, so you did wrong by missing the graduation.
  C) You had an obligation to attend the wedding and an obligation to attend the graduation, and you had to decide which was more important. By going to the wedding (assuming it was the more important), you fulfilled your obligation and did not violate the other because it was overridden.

  This probes whether obligations disappear when impossible and whether there's overriding without residue.

  Case 8: The Sacrificial Choice
  A soldier on a mission has the choice to sacrifice their own life to save their squad. If they don't sacrifice themselves, the entire squad, including them, will die. They choose to sacrifice themselves.

  Question: Did the soldier have an obligation to sacrifice themselves?
  A) Yes, because it was the only way to save the others. They ought to do it.
  B) No, because they have a duty to preserve their own life. They did something supererogatory (beyond duty), not obligatory.
  C) They had conflicting obligations: to preserve their own life and to save the squad. They couldn't do both. By sacrificing, they violated the duty to self-preservation but fulfilled the duty to save the squad.

  This probes whether conflicts can be genuine and whether there can be obligations that are overridden but still leave residue.

