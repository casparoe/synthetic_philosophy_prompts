     C) You were in an epistemic dilemma (you didn't know what to do), but not a genuine moral dilemma.

  7. A soldier can sacrifice their own life to save their squad. If they don't, the entire squad including them will die. The soldier sacrifices themselves. Did the soldier have an obligation to sacrifice themselves?
     A) Yes; it was the only way to save the squad and that duty overrode self-preservation.
     B) No; self-sacrifice is beyond the call of duty.
     C) The soldier had conflicting obligations and would violate one whichever choice they made.

  8. (To probe "ought implies can" more directly) You are at work and your child's school calls to say your child is sick and needs to be picked up immediately. At the same time, your boss asks you to attend a crucial meeting that cannot be postponed. You cannot do both. You go to pick up your child. At the time of choice, did you have an obligation to attend the meeting?
     A) Yes, but it was overridden by the obligation to your child.
     B) No, because you couldn't attend the meeting and pick up your child, so you didn't have an obligation to attend the meeting.
     C) Yes, and by not attending, you violated that obligation even though you had to.

  Now, scoring key:

