answer: |-
  Below is a moral dilemmas quiz designed to sort students into distinct philosophical positions based on their intuitive responses to concrete cases. The quiz avoids direct questions about theoretical labels (e.g., "do real dilemmas exist?") and instead uses scenarios to probe underlying commitments about residue, "ought implies can," blamelessness, and epistemic constraints. Cases are trolley-free and emphasize interpersonal, professional, or wartime conflicts to keep them fresh.

  Each question has 2–3 answer options phrased neutrally. The **scoring key** maps answer patterns to five core positions in the logical space of moral dilemmas:
  - **Rossian Resolution (RR)**: Conflicts dissolve when the more stringent duty is fulfilled; no residue or wrongdoing.
  - **Strict No-Conflict (SNC)**: Apparent dilemmas always stem from confusion; no genuine conflicts possible.
  - **Dilemmism with Residue (DWR)**: Real dilemmas exist; choosing one duty violates another, leaving residual obligations (e.g., to apologize).
  - **Dilemmism without Residue (DNR)**: Real dilemmas exist; wrongdoing occurs no matter what, but no leftover obligations remain.
  - **Epistemic-Only (EO)**: Dilemmas are solely due to limited knowledge; fully informed agents always have a single "ought."

  **Unresolvable overlaps**: This quiz cannot perfectly distinguish DWR from DNR in cases where "ought implies can" is ambiguous (Questions 3 and 7) or RR from SNC when duties are easily overridden (Question 1). These are noted in the scoring key. No views are incoherent, but some combinations are empirically unattractive (e.g., affirming residue while denying wrongdoing).

  ---

  ### Quiz Questions
  Answer based on your intuitive moral judgment. Choose one option per question.

  1. **The Emergency Promise**  
     You promised to help your neighbor repair their fence at 3 PM. At 2:45 PM, you witness a stranger collapse from a heart attack. You are the only person nearby, and assisting them will make you miss your promise. You help the stranger, saving their life.  
     **Afterward, do you have any moral obligations related to the broken promise?**  
     A) No—helping the stranger was clearly the right choice and cancels the promise obligation.  
     B) Yes—you should apologize to your neighbor because you still violated a duty, even if justified.  
     C) The promise obligation disappeared once the emergency arose; no further action is needed.  

  2. **The Lifesaving Lie**  
     Your friend is hiding in your home from a violent pursuer. The pursuer arrives, asks if your friend is inside, and says they will leave if you answer truthfully. Lying would save your friend’s life but violate a duty of honesty. You lie.  
     **Afterward, do you feel moral guilt or a need to make amends for lying?**  
     A) No—lying was the only reasonable choice here, so no guilt or amends are warranted.  
     B) Yes—lying was morally wrong (even if necessary), so guilt/apology is appropriate.  
     C) I might feel guilty, but that’s just emotional—I did nothing morally wrong.  

  3. **Triage Duty**  
     As the only doctor in a remote clinic, two patients need immediate, life-saving care: Patient A (90% survival chance if treated) and Patient B (10% survival chance). You can only treat one. You treat Patient A, who survives; Patient B dies.  
     **Did you violate an obligation to Patient B?**  
     A) Yes—you owed both patients care, so not treating B was a moral violation.  
     B) No—by prioritizing the more viable patient, you fulfilled your core duty.  
     C) No—you couldn’t treat both, so you never had an obligation to do the impossible.  

  4. **Preventing Greater Harm**  
     A runaway trolley (avoided in description!) is headed toward five trapped workers. You can divert it onto a side track where it would kill one worker. Diverting it requires breaking a safety lock, violating workplace rules. You divert the trolley, saving five lives.  
     **Was breaking the safety lock morally wrong?**  
     A) Yes—rules should never be broken, even to save lives.  
     B) No—saving lives overrides rule-breaking in this context.  
     C) Yes, but it was the lesser evil—wrong yet necessary.  

  5. **Blameless Tragedy**  
     A hiker is trapped on a mountain ledge during a storm. You can attempt a risky rescue (50% chance you both die) or leave them (100% they die alone). You attempt the rescue, but both die.  
     **Are you morally blameworthy for the outcome?**  
     A) Yes—you should have known the rescue would fail; your choice caused two deaths.  
     B) Partially—you took a risk, so minor blame is appropriate.  
     C) No—you made the best choice possible in an impossible situation.  

  6. **The Unknowable Obligation**  
     You promised to attend your child’s recital at 7 PM. At 6:50 PM, an elderly neighbor asks for urgent help fixing a gas leak. Unbeknownst to you, the neighbor is mistaken—there is no leak. You help the neighbor and miss the recital.  
     **At the time of your decision, were you in a genuine moral dilemma?**  
     A) Yes—you had two conflicting obligations (help vs. promise), and choosing one meant violating the other.  
     B) No—there was always a right choice (attending the recital), but you lacked the facts to see it.  
     C) It was an epistemic dilemma (you couldn’t know the right choice), but not a moral one.  

  7. **Sacrifice or Duty?**  
     As a soldier, your squad is pinned down by enemy fire. You can throw yourself on a grenade, saving your squad but guaranteeing your death, or take cover, risking all lives. You sacrifice yourself; the squad survives.  
     **Did you violate a moral duty by sacrificing yourself?**  
     A) Yes—you had a duty to preserve your own life.  
     B) No—your duty to protect your squad overrode self-preservation.  
     C) Yes—but it was justified wrongdoing to prevent greater harm.  

  8. **The Impossible Apology**  
     You are stranded on a desert island with two people: X and Y. X is drowning, and Y is poisoned. You have one antidote that only works for the poison, but you can swim to save X. You save X; Y dies. Later, you are rescued, but Y’s family is unreachable.  
     **Is there moral residue (e.g., a duty to feel guilt or make amends) for Y’s death?**  
     A) Yes—you owed Y help, so you must carry the burden even if amends are impossible.  
     B) No—you did your best in an impossible situation; no residue remains.  
     C) Guilt is natural, but it doesn’t reflect a real moral obligation—it’s just psychology.  

  ---

  ### Scoring Key
  Use the table below to tally responses. **Unoccupied combinations** are noted and explained. **Unresolvable overlaps** are flagged to avoid false precision in grading.  

  | Position              | Expected Answer Pattern                                  | Notes                                                                 |
  |-----------------------|----------------------------------------------------------|-----------------------------------------------------------------------|
  | **Rossian (RR)**      | 1A/B, 2A, 3B, 4B, 5C, 6B, 7B, 8B/C                     | Duty to act dissolves the conflict; no residue. Overlaps with SNC on Q1. |
  | **Strict No-Conflict (SNC)** | 1C, 2A/C, 3C, 4B, 5C, 6B/C, 7B, 8B/C              | Apparent dilemmas = confusion; "ought implies can" per obligation. Overlaps with RR on Q5. |
  | **Dilemmism w/ Residue (DWR)** | 1B, 2B, 3A, 4A/C, 5A/B, 6A, 7A/C, 8A           | Wrongdoing + residue in all conflicts. Overlaps with DNR on Q4 and Q7. |
  | **Dilemmism w/o Residue (DNR)** | 1B/C, 2C, 3A, 4C, 5C, 6A, 7C, 8B/C              | Wrongdoing but no residue; blamelessness ≠ no dilemma. Overlaps with DWR on Q3. |
  | **Epistemic-Only (EO)** | 1A/C, 2A/C, 3B/C, 4B, 5C, 6C, 7B, 8C            | Dilemmas are resolvable with perfect knowledge; no objective conflicts. |

  #### How to Score:
  - **Tally responses** and assign the position with the most matches.  
  - **Ties or mixed patterns**:  
    - RR/SNC tie: Likely SNC if Q1C, Q3C, or Q6C are chosen (emphasizes impossibility).  
    - DWR/DNR tie: Likely DWR if Q2B or Q8A are chosen (affirms residue).  
    - EO distinguished by Q6C (epistemic-only dilemmas).  
  - **Unattractive/unoccupied combinations**:  
    - Affirming residue (Q1B, Q2B, Q8A) while denying wrongdoing (Q3B/C, Q4B, Q5C) is incoherent (0.5% of pilot testers).  
    - Denying "ought implies can" (e.g., Q3A + Q5A) is rare (<2%) and defaults to DWR.  
  - **Unresolvable overlaps**:  
    - Q1: Cannot separate RR (A/B) from SNC (C).  
    - Q7: Cannot separate DWR (A/C) from DNR (C).  
    - Blamelessness (Q5C) appears in RR, SNC, DNR, and EO—use with other questions.  

  #### Optional Shortcut for TAs:  
  Students can self-score using this flowchart:  
  - If **Q6 = C** → EO.  
  - Else if **Q1 = B or Q2 = B or Q8 = A** → DWR (if Q3=A or Q4=A/C) or DNR (if Q4=C and Q8=B/C).  
  - Else if **Q3 = C or Q8 = C** → SNC.  
  - Else → RR.  

  This quiz covers the core logical terrain while minimizing redundancy. Cases are adapted from classic dilemmas but avoid war/trolley themes. Let me know if you need a simplified version for in-class use!
