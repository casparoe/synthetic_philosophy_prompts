answer: |-
  ### Decision Tree for Resolving the Discursive Dilemma  
  **Start Here:**  

  1. **Must the group’s collective judgments be logically consistent whenever all individual judgments are consistent?**  
     - **No** → Go to 2  
     - **Yes** → Go to 3  

  2. **Is it acceptable for the collective to be inconsistent if that reflects majority views on each proposition?**  
     - **Yes** → **Majoritarian Responsiveness** (e.g., majority vote on every issue; allows inconsistency like in the discursive dilemma or hiring cycle).  
     - **No** → **Skeptical View** (no fact of the matter; collective judgment is undefined in conflict cases).  

  3. **Must the collective make a judgment on every proposition (premises and conclusion)?**  
     - **No** → Go to 4  
     - **Yes** → Go to 5  

  4. **Should the collective judgment on the conclusion be determined by majority vote on the conclusion?**  
     - **Yes** → **Conclusion-Based Aggregation** (only the conclusion is voted on; premises are ignored. *Safety case: Rejects approval if majority opposes it, even if premises pass*).  
     - **No** → Go to 7  

  5. **Is it acceptable for the collective to endorse a conclusion that a majority of members reject?**  
     - **Yes** → **Premise-Based Aggregation** (premises are voted by majority; conclusion is derived logically. *Safety case: Approves design if premises pass, even if majority rejects approval*).  
     - **No** → Go to 7  

  6. ***(For Premise-Based) Test Case Note:*** In the safety board, premise-based and conclusion-based **diverge** (premise-based may approve while conclusion-based rejects). In the hiring cycle, they **do not apply directly** (agenda lacks logical structure).  

  7. **Should collective judgments require near-unanimous support to avoid minority override?**  
     - **Yes** → **Oligarchic/Dictatorial Aggregation** (e.g., unanimity or chair veto; collective judgment mirrors a subgroup. *Hiring case: May force an incomplete ranking if no unanimity*).  
     - **No** → **Supermajoritarian Rule** (e.g., 2/3 majority on each proposition. *Safety case: May deadlock if no supermajority on premises/conclusion*).  

  ---

  ### Unoccupied Positions & Testing  
  - **Incoherent Combo:** Consistency + judge every proposition + no majority-overriding conclusion + no supermajority/oligarchy. *Why?* Impossible (majority responsiveness + consistency conflict).  
  - **Untracked Combo:** Consistency + don’t judge every proposition + reject majority on conclusion. *Why?* Possible (e.g., random member dictates conclusion) but rarely advocated—unattractive or underspecified.  
  - **Test Cases:**  
    - **Hiring Cycle (A>B, B>C, C>A):** Majoritarian causes cycle; supermajoritarian may too (2/3 = 2/3 in trio); oligarchic may leave gaps. Premise/conclusion-based **do not apply** (no logical link).  
    - **Safety Board (P, Q, R=P∧Q):** Premise-based (votes P/Q) and conclusion-based (votes R) **conflict** if majority accepts P/Q but rejects R.  

  ---

  ### Key Hidden Work  
  The most pivotal node is **Q5** (*"Accept collective conclusion that majority rejects?"*). Users may answer "no" intending to respect members’ wishes, not realizing this blocks premise-based aggregation—which often overrides majority conclusions for logical integrity. Conversely, "yes" may be chosen to prioritize logic, downplaying majoritarian legitimacy.  

  ---

  **Format Note:** Use this tree by answering questions top-down. Positions derive from commitments, not thinkers. Named examples (e.g., Pettit for conclusion-based) are optional context.
