prompt: |-
  I've been trying to work out when an act has moral worth — done for the right reason, not just the right thing done by accident or for dodgy reasons. I've collected my gut verdicts on a bunch of cases and I'd like to know if theres a principle that captures them, or whether some of them just have to go.

  My verdicts:

  1. A shopkeeper gives a tourist the correct change when the tourist could never have noticed being short-changed, and he does it purely because he thinks honesty is required — no pleasure in it at all. Moral worth: clearly yes.

  2. Same shopkeeper, but the only reason is that there's a camera over the till. No moral worth. (These two are basically fixed for me; I'm treating them as the anchor.)

  3. A passer-by jumps into a canal to save a drowning kid before any thought crosses her mind — pure alarm, no moment of "this is my duty". I still want to say her act has moral worth.

  4. Someone donates to disaster relief because the appeal filled him with pity; he'd never phrase it in terms of obligation. Moral worth: yes, I think, and not a watered-down version either.

  5. Someone else donates the same amount because she works out that this is what morality requires, while feeling nothing and quietly resenting it. Moral worth: yes — and yet Kant, as I understand him, wants to say this case has the *most* worth of all, and I can't make myself go that far. But I also can't see why it would have less worth than the pity case. So 4 and 5 sit awkwardly together for me.

  6. A doctor treats a patient with meticulous care, but only because the illness is rare and she finds it a fascinating puzzle — the moment the case turns routine she'd lose all interest and hand it off. She never does wrong by the patient, but I'm reluctant to say her treating him has moral worth. Something is missing there, even though the pity donor in 4 also never explicitly thought about the value at stake...

  7. A man tells an awkward truth about a colleague's performance in a meeting when a soft answer was available. But his reason is that he enjoys the colleague's discomfort — truth-telling as a weapon. No moral worth, even though honesty is exactly what he did. This one and 4 are the pair I can't reconcile: both are inclination-driven, neither involves any explicit thought of duty, but my gut splits them.

  8. The one I keep going back and forth on: a woman lies to officials to stop someone being deported, while sincerely believing that lying is wrong and that she's doing wrong — she feels guilty, does it anyway out of a plain inability to watch the person be taken, and says afterwards that she did wrong. Right act (I'll grant that), done while believing it's wrong, from something that isn't conviction. Moral worth or none?

  My own first stab at a principle was: an act has moral worth when it's done for a reason that tracks whatever actually makes the act right — so spite fails because it doesnt track why honesty is right, and pity succeeds because it tracks the suffering, which is part of what makes relief-giving right. But I can already see trouble: does alarm in case 3 track the drowning? And does the duty-calculator in case 5 track anything, or is she just complying? Test that stab against my cases, repair it or replace it, and tell me: exactly what the resulting principle says, which clause each case motivates, what it predicts for cases I haven't listed (for instance someone who does the right thing purely to avoid feeling guilty afterwards — worth or not?), and honestly, which of my verdicts your best principle can't save.

  Oh, and could you write your answer in British English? Behaviour, towards, "practise" as the verb, that sort of thing. It's for a dataset and the convention matters.
reasoning: |-
  Okay, the user is grappling with the concept of moral worth—when an action is done for the right reasons, not just coincidentally correct. They've listed eight scenarios with their intuitive judgments and want a principle that explains them. They also provided their own initial principle about "tracking the right-making feature" but see issues with it. Let me unpack this step by step.

  First, the user's core struggle is reconciling their intuitions across cases involving duty, emotion, and motivation. Cases 3 (impulsive rescue) and 4 (pity-driven donation) suggest emotions can confer moral worth, but case 7 (spiteful honesty) and case 6 (clinically detached doctor) show emotions sometimes undermine it. The tension peaks with case 5 (dutiful donation without emotion) where they resist Kant's view but can't dismiss its worth entirely. This hints they need a framework where both empathy and principle can be valid sources of worth—if properly aligned with the act's moral basis.

  Their proposed "tracking" principle is insightful but needs refinement. For case 3 (alarm-driven rescue), does instinct "track" the child's peril? Arguably yes—alarm responds directly to the emergency. But for case 6 (medical curiosity), fascination with disease doesn't track the patient's wellbeing as the primary concern. Similarly, case 7's spite uses honesty as a weapon, divorcing it from the virtue's purpose. The key is whether the motive connects to the act's moral essence (e.g., suffering for charity, dignity for honesty).

  Case 8 (lying to prevent deportation) is thorny. The user feels conflicted because the agent believes she's doing wrong but acts from compassion. Their principle might struggle here: her motive (preventing harm) tracks a right-making feature (preventing injustice), but her moral belief clashes. This suggests worth could depend on the objective reason, not subjective belief—if the harm prevented is the true moral priority.

  The user also hints at meta-concerns: they want coherence without discarding intuitions (e.g., rejecting Kant's duty-only view). They might fear their judgments are inconsistent, so the principle must validate most while flagging outliers. The British English request suggests academic use, possibly for teaching or writing—clarity and precision matter.

  My proposed principle refines "tracking" into two tiers: core (direct link to moral essence) and peripheral (awareness of moral stakes). This handles case 5 (dutiful donation) by allowing worth via core tracking (she recognises suffering as the reason to act), even without emotion. Case 6 fails because curiosity is peripheral—it ignores the patient's welfare as the central demand. For case 8, worth holds if preventing deportation is objectively right; her guilt reflects mistaken beliefs, not flawed motives.

  Cases that strain the principle: case 5 might still feel "colder" than case 4, but the principle equalises them by focusing on moral perception. If the user can't shake the sense that emotional engagement adds something, they might need a supplemental criterion—but that risks complexity. Honesty about this tension is better than forcing fit.
answer: |-
  Right, let's tackle this properly. Your cases are a brilliant set of thought experiments, highlighting the very tensions that plague moral philosophy (especially around Kant and his critics). Your instinct about "tracking the right-making feature" is spot on as a starting point and far more plausible than a pure Kantian "duty for duty's sake alone" approach. However, it needs refinement to handle your intuitions consistently.

  After wrestling with your cases, here’s the best principle I can formulate, building on your "tracking" idea but adding crucial distinctions:

  **The Refined Moral Worth Principle:**

  An act has moral worth if and only if:
  1.  **Core Tracking:** The agent's *primary motivating reason* for acting is directly responsive to, and motivated by, the feature(s) that *actually make* the act morally right in that specific context (the "right-making feature(s)"); *and*
  2.  **Peripheral Awareness:** The agent acts with a *sensitivity* to the act's moral status – this need not be explicit "duty-thought", but the right-making feature(s) must register for the agent *as morally significant*, even if only implicitly or emotionally. This rules out motives that actively *misrepresent* or are *indifferent* to the moral dimension.

  **Key Clarifications:**

  *   **"Primary Motivating Reason":** This is the reason that actually moves the agent to act. It doesn't have to be the *only* reason present, but it must be the dominant one driving the action.
  *   **"Directly Responsive To":** The motive must arise *because of* the right-making feature. It shouldn't be coincidental or instrumentalised for an unrelated end that happens to align.
  *   **"Feature(s) that actually make the act morally right":** This is objective. It's the real moral reason *why* the act is right (e.g., alleviating suffering, preventing harm, respecting autonomy, fulfilling a promise, promoting justice).
  *   **"Sensitivity... as morally significant":** This is the subjective element. The agent must perceive the relevant feature *as* morally weighty, even if they don't articulate it as "duty". This can manifest as empathetic concern, respect, a sense of importance, or recognition of a demand, but *not* as mere personal preference, fascination, or animus.

  **Applying the Principle to Your Cases:**

  1.  **Honest Shopkeeper (Duty):** **Moral Worth: YES.**
      *   *Core Tracking:* He acts *because* honesty is required (the right-making feature is respect for the customer's property/autonomy/contract). His motive is directly responsive to it.
      *   *Peripheral Awareness:* He recognises the requirement *as* a moral constraint ("honesty is required").
      *   *Clause Motivated:* Both. Anchors the core tracking and the need for moral sensitivity (even without pleasure).

  2.  **Dishonest Shopkeeper (Camera):** **Moral Worth: NO.**
      *   *Core Tracking:* He doesn't act *because* of honesty/respect. He acts to avoid getting caught. The right-making feature is irrelevant to his motive.
      *   *Peripheral Awareness:* He is sensitive only to self-interest, not the moral significance of honesty. The camera replaces moral sensitivity with fear.
      *   *Clause Motivated:* Core Tracking fails spectacularly.

  3.  **Impulsive Rescuer (Alarm):** **Moral Worth: YES.**
      *   *Core Tracking:* Her alarm *is* a direct, visceral response to the immediate, life-threatening peril of the child (the right-making feature – preventing death/serious harm). It's not a calculation, but it *is* responsive to the core moral demand.
      *   *Peripheral Awareness:* While no explicit "duty" thought occurs, the alarm *is* a form of sensitivity to the extreme moral significance of the situation – a life is in imminent danger. It registers as an emergency demanding action.
      *   *Clause Motivated:* Core Tracking (showing direct responsiveness can be non-calculative/emotional) and Peripheral Awareness (showing sensitivity doesn't require explicit duty-thought).

  4.  **Pity Donor:** **Moral Worth: YES.**
      *   *Core Tracking:* He acts *because* he is moved by the victims' suffering (the primary right-making feature of disaster relief donation).
      *   *Peripheral Awareness:* Pity is an empathetic response that inherently registers the suffering *as* something bad and worthy of alleviation – it implicitly acknowledges the moral significance.
      *   *Clause Motivated:* Core Tracking (emotion directly responsive to right-making feature) and Peripheral Awareness (emotion implicitly constitutes moral sensitivity).

  5.  **Dutiful Donor (No Feeling):** **Moral Worth: YES (though perhaps *differently* worthy than 4).**
      *   *Core Tracking:* She acts *because* she has calculated that alleviating the suffering is what morality requires. Her motive is directly responsive to the right-making feature (suffering) *via* her recognition of the moral requirement it generates.
      *   *Peripheral Awareness:* Her calculation demonstrates explicit sensitivity to the moral status of the act. She recognises the suffering imposes a moral demand.
      *   *Clause Motivated:* Core Tracking (showing responsiveness can be via principle/calculation) and Peripheral Awareness (explicit moral reasoning satisfies sensitivity). This validates your intuition that it *has* worth, potentially resolving the awkwardness with 4. The difference lies in the *mode* of sensitivity (emotional vs. rational), not the presence of worth *per se*. You might still feel it lacks the warmth of 4, but the principle captures the core moral commitment.

  6.  **Curious Doctor:** **Moral Worth: NO.**
      *   *Core Tracking:* Her primary motive is intellectual fascination with the disease, *not* the patient's wellbeing (the core right-making feature of medical treatment). The patient's good is merely the vehicle for her interest. She'd abandon the act if the puzzle vanished, even if the patient still needed care.
      *   *Peripheral Awareness:* Her focus is on the puzzle, not on the moral significance of healing *this person*. She lacks sensitivity *to the patient's welfare as a moral demand*. The right act is performed, but the moral reason for it isn't her driving force.
      *   *Clause Motivated:* Core Tracking fails – motive doesn't track the right-making feature. Peripheral Awareness also fails – no sensitivity to the moral dimension of patient care.

  7.  **Spiteful Truth-Teller:** **Moral Worth: NO.**
      *   *Core Tracking:* He acts *because* he wants to cause discomfort/harm, *not* because of respect for truth/autonomy (the right-making features of honesty). He instrumentalises truth for malice.
      *   *Peripheral Awareness:* His motive actively *misrepresents* the moral significance of honesty. He sees truth not as a duty or respect, but as a weapon. He is sensitive to the harm he can cause, but indifferent or hostile to the *moral* value of truthfulness.
      *   *Clause Motivated:* Core Tracking fails (motive opposed to spirit of right-making feature). Peripheral Awareness fails spectacularly (motivated by moral indifference/animus).

  8.  **Lying to Prevent Deportation (With Guilt):** **Moral Worth: YES.**
      *   *Assumption:* Lying to prevent an unjust deportation *is* the right act in this context (the right-making feature is preventing a grave injustice/harm).
      *   *Core Tracking:* Her primary motive is an inability to watch the person be taken – a direct response to the perceived injustice/harm (the right-making feature). Compassion drives her.
      *   *Peripheral Awareness:* Her feeling of guilt *shows* sensitivity to the moral dimension! She believes lying is wrong *in general*, but her visceral reaction to *this specific harm* overrides it. Crucially, her compassion implicitly registers the *deportation* as a profound moral wrong demanding intervention. Her sensitivity is conflicted but present; she recognises the moral gravity of *both* choices, but her action is motivated by sensitivity to the greater wrong she's preventing.
      *   *Clause Motivated:* Core Tracking (compassion responds to the injustice/harm) and Peripheral Awareness (guilt demonstrates moral sensitivity, even if her *beliefs* are mistaken about the overall rightness. Her action flows from sensitivity to the salient moral demand – preventing the harm).

  **Predictions for New Cases:**

  *   **Acting purely to avoid feeling guilty afterwards:** **Moral Worth: NO.**
      *   *Why:* Core Tracking fails. The motive is self-focused (avoiding unpleasant feelings), not responsive to the feature that makes the act right (e.g., the suffering of others, the promise made). Peripheral Awareness might be present (they know it's wrong *not* to act, hence the anticipated guilt), but the *primary reason* for acting isn't the right-making feature itself, only the desire to avoid the *consequence* (guilt) of ignoring it. It's self-correction, not moral motivation.

  *   **Acting out of habit, without thought:** **Moral Worth: DEPENDS.**
      *   *If the habit was formed from good moral reasons:* Likely **YES**. The ingrained response *reflects* past sensitivity and tracking (e.g., automatically giving correct change because years of valuing honesty made it second nature). The sensitivity is dispositional.
      *   *If the habit is mindless routine:* **NO**. No current sensitivity or tracking of the right-making feature is present (e.g., robotically giving correct change without any thought or care about honesty or the customer).

  *   **Acting purely for social approval:** **Moral Worth: NO.**
      *   *Why:* Core Tracking fails. Motive is approval, not the right-making feature. Peripheral Awareness likely fails too – they are sensitive to social judgement, not the inherent moral significance of the act.

  **Honest Assessment: Which Verdicts Can't Be Saved?**

  My principle captures *all* of your specific verdicts quite well. The closest call was **Case 5 (Dutiful Donor)**. You expressed discomfort with Kant's elevation of this case and couldn't quite see it as having *more* worth than the pity case, though you granted it *has* worth. My principle says both have worth, just with different *modes* of moral sensitivity (emotional vs. rational commitment). It doesn't force you to say the dutiful donor has *more* worth than the pity donor – they are equal on the core criterion of moral worth. This resolves the "awkwardness" you felt between 4 and 5.

  The principle *doesn't* require you to see Case 5 as superior to Case 4. It simply affirms both have moral worth because both meet the core criteria: their primary motive is responsive to the right-making feature (suffering) and they exhibit sensitivity to its moral significance (via pity or via reasoned moral requirement). The warmth of Case 4 and the coldness of Case 5 are differences in psychological texture, not in the fundamental moral worth of the act itself, according to this principle.

  **Conclusion:**

  Your refined principle, focusing on **Core Tracking** (primary motive responsive to the objective right-making feature) coupled with **Peripheral Awareness** (subjective sensitivity to the moral significance of that feature), provides a robust framework that successfully captures all of your nuanced gut verdicts across the diverse cases. It avoids the pitfalls of pure Kantianism (dismissing emotion) and pure sentimentalism (struggling with cases like the spiteful truth-teller or curious doctor). It explains why duty *can* confer worth (Case 5), why emotion often *does* (Cases 3, 4, 8), and why both can fail if they don't properly track or respect the underlying moral reality (Cases 2, 6, 7). The key is always the alignment between the agent's driving reason and the genuine moral reason for the action, coupled with the agent's engagement with the moral dimension.
