prompt: |-
  I've got two friends who've been arguing for like two years about accuracy-first epistemology and I want them to finally produce something together instead of just re-litigating at the pub. One is a strict veritist/accuracy-monist about credences: she thinks the ONLY final epistemic value a credence function has is its accuracy, and every other legitimate epistemic norm — probabilism, updating by conditionalization, the Principal Principle, the Principle of Indifference — has to fall out of accuracy plus decision theory, basically the Pettigrew program. The other is an epistemic-value pluralist: he thinks accuracy is a big part of the story but not the whole of it, and that things like respecting your evidence in the right way, or avoiding epistemic akrasia, can have final epistemic value of their own rather than being valuable just because they tend to make you more accurate in the long run.

  Write the joint statement they'd produce after a genuine adversarial collaboration, the kind they could both actually put their names to. Specifically I want:

  1) The agreed claims, stated plainly and without weasel hedges — stuff like: proper scoring rules are the right way to measure accuracy, incoherent credences are in some sense dominated, there's a real distinction between pragmatic and epistemic justification for a credence, and so on. Don't let the agreed section be vacuous either — if they only agree on trivialities that's a finding, but write the non-trivial ones.

  2) The remaining disagreements, each phrased so the person who holds the view would accept the wording. I'm going to show this to them, so if you slant it, it gets sent back.

  3) The cruxes — the sub-questions where settling them would actually move one side or the other. I suspect one crux is whether the accuracy-first derivations of things like the Principal Principle genuinely vindicate the norm or just smuggle it in, e.g., by redefining accuracy relative to a proposition's chance of being true rather than plain truth. Another might be whether the choice among proper scoring rules (Brier vs. log score vs whatever) has real normative consequences or is basically convention — like whether it matters that different proper scoring rules disagree about which non-probabilistic credence assignments are worst. And maybe whether cases of "useful falsehoods" or self-fulfilling credences (think of someone whose confidence in their own success is itself part of what makes them succeed) are counterexamples to accuracy-monism or just show pragmatic and epistemic norms coming apart harmlessly.

  4) For each crux, some concrete case, theorem, or thought experiment that both sides would agree bears on it, plus each side's prediction written down in advance so they can't retro-fit later. Also, if any part of their dispute turns out to be verbal — like maybe they secretly mean different things by "epistemic value" or by "final" in "final epistemic value" — flag which part and explain why you think it's verbal.

  Format it as a numbered agreed-claims section followed by a disagreements table with a row per crux, columns for the monist's line, the pluralist's line, and the test case with each side's prediction. Keep it fair — neither friend is dumb, and they've both read the actual literature, so don't hand either of them an obvious strawman.
