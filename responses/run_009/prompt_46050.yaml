prompt: |-
  My friend has this whole thing about "collapse" — she's read a bunch of the Jared Diamond-ish stuff plus the pushback, and over the years she's accumulated actual verdicts, mostly ancient world. Her rulings so far: the late Bronze Age eastern Med around 1200 BC was a genuine collapse — palaces burned, Ugarit just gone, trade networks dead, writing lost for centuries. The Classic Maya southern lowlands: NOT collapse, just change — she says the cities emptied out but the people moved north and kept doing Maya things, so calling it a collapse is basically colonial nostalgia. Easter Island: definately collapse, the moai, the forests, the chiefdom, the whole thing coming down together. The Harappan/Indus situation after 1900 BC: change — cities emptied but people just dispersed into villages, no die-off, no violence (she admits this is the one she's least sure about). And the Old Kingdom Egypt wobble into the First Intermediate Period: change, because the state re-formed within a century or so with the same script, same gods, basically the same people.

  Next month she's actually visiting Angkor, and Cahokia came up in our book club, so now I want predictions. What will she say about Angkor — the court leaving in the 1400s, the city draining out over decades, the kings continuing elsewhere but nobody ever building anything like the temple-cities again? What about Cahokia, where everything just stops around 1350, no successor polity on the site, but no destruction layer or famine evidence at the end either? And Chaco Canyon, where the great houses empty out but the Pueblo peoples are obviously still here?

  Honestly I care less about the predictions than about (a) what rule she's actually running, (b) what other rules would fit her track record just as well, and (c) which further case would really split those rules apart. She talks alot about whether a society "gets its thing back," but she also talks a lot about whether the ending was violent/catastrophic versus people just gradually relocating — and I genuinely can't tell if those are the same rule in her head or two rules she's been lucky to never have to choose between. Like, do her existing verdicts already strain one of them? The Maya one feels like it's doing a lot of work for her.

  And if you can think of a case — real or hypothetical — where her candidate rules give opposite verdicts and she can't dodge, name it and tell me what each rule says about it. That's the part I actually want to nail her down on over dinner.
reasoning: |-
  Okay, let me start by unpacking the user's query. They have a friend who's really into analyzing historical collapses, and they've provided specific examples of her verdicts on different societies. The user wants to predict how she might classify Angkor, Cahokia, and Chaco Canyon, but more importantly, they want to understand the underlying rules she uses and find a case where those rules conflict.

  First, I need to look at the friend's past rulings. She called the Late Bronze Age collapse a genuine collapse because of the destruction, loss of writing, and trade networks. Classic Maya she sees as change, not collapse, since people moved and continued their culture. Easter Island is a definite collapse due to environmental and societal breakdown. Harappan civilization is change because people dispersed without violence. Old Kingdom Egypt is also change since the state reformed quickly with continuity in culture.

  The user mentions two possible rules: whether the society "gets its thing back" (continuity) and whether the ending was violent/catastrophic versus a gradual relocation. The Maya example seems key here. The friend dismisses it as colonial nostalgia, emphasizing continuity over catastrophe. That suggests she might prioritize continuity more than violence in her assessment. But is that consistent? 

  For Angkor, the court left, the city drained out, and no similar structures were built again. If she focuses on continuity (kings continued elsewhere), she might call it change. But the loss of monumental architecture could lean towards collapse under the "gets its thing back" rule. That's a conflict. 

  Cahokia stops suddenly without evidence of violence. No successor polity, but no destruction either. If she uses violence as a rule, she might say change, but the lack of continuity in the site's importance could mean collapse. Another conflict point.

  Chaco Canyon emptied, but Pueblo people continued. Here, continuity is strong, so she'd likely say change. 

  The user's deeper need is to understand the friend's framework and find where the rules contradict. They want to challenge her in a discussion. So, identifying a case where continuity and violence rules clash is crucial. The Mycenaean collapse is a good example—continuity in population but loss of palatial culture. Which rule wins? 

  Also, the user might want to explore if the friend has an unspoken hierarchy between the rules. Does continuity always trump violence? Or vice versa? The hypothetical case of a peaceful dissolution but no cultural recovery (like a voluntary tech abandonment) could force a choice. 

  I should also consider the user's interest in the Maya case doing "a lot of work." It shows the friend downplays discontinuity if cultural elements persist. Highlighting a scenario where cultural elements continue but in a diminished form might expose biases. 

  In summary, the user needs a clear breakdown of the friend's implicit rules, predictions for the new cases pointing out ambiguities, and a compelling example that forces a choice between the rules. This will help the user engage in a meaningful debate, which seems to be their real goal—understanding the friend's reasoning and testing its limits.
answer: |-
  Based on your friend's established rulings and the apparent tension between her criteria ("getting its thing back" vs. "violent/catastrophic end"), here's the breakdown:

  **1. Predictions for New Cases:**

  *   **Angkor (Court leaves 1400s, city drains, no more temple-cities):**
      *   **Prediction:** She will call this **Change**, *not* Collapse.
      *   **Why:** The Khmer state continued elsewhere (Longvek, later Oudong), with the same kings, religion (Theravada Buddhism shift notwithstanding), and core culture. People didn't vanish; the center of power and population simply shifted. While the specific monumental building ceased, the *society* (its political structure, religion, people) persisted elsewhere. This fits her "Old Kingdom Egypt" and "Classic Maya" models (state re-formed/people moved, culture continued). The loss of monumental architecture alone isn't enough for her "collapse" verdict.

  *   **Cahokia (Stops ~1350, no successor polity, no destruction/famine):**
      *   **Prediction:** She will lean towards **Collapse**, but might express uncertainty similar to Harappan.
      *   **Why:** The core criterion of "no successor polity on the site" and the abrupt halt of the major ceremonial center, despite the lack of clear violence or famine evidence, points strongly against "getting its thing back" *in that specific form or location*. The Mississippian cultural complex continued elsewhere (e.g., Spiro, Etowah), but Cahokia itself as a major center ceased utterly. This lack of local/structural continuity, even without a dramatic "destruction layer," pushes it closer to her "Easter Island" and "Late Bronze Age" verdicts than her "Maya" or "Egypt" ones. The *scale and centrality* of what was lost matters.

  *   **Chaco Canyon (Great houses empty, Pueblo peoples continue):**
      *   **Prediction:** She will definitively call this **Change**.
      *   **Why:** This is the clearest case. The people demonstrably didn't vanish; they moved, adapted (e.g., to cliff dwellings), and maintained core cultural and religious continuity. The "society" (the Ancestral Puebloan people and culture) clearly persisted, even if the specific expression in massive Chacoan great houses ended. This fits perfectly with her "Classic Maya" and "Harappan" verdicts – people relocated, culture adapted and endured.

  **2. Deconstructing Her Rules:**

  *   **Her Apparent Primary Rule:** **"Did the core society/people/culture persist and regain its fundamental political complexity or cultural 'center' (whether geographically shifted or not) within a relatively short timeframe (centuries)?"** ("Getting its thing back").
      *   *Collapse:* No. The specific complex socio-political structure and cultural apex *as it existed* is gone for good, and nothing equivalent replaces it *for that society* in a relevant timeframe (e.g., LBA Aegean palatial culture, Easter Island chiefdom, Cahokia's centrality).
      *   *Change:* Yes. The people, core cultural identity, and often the *potential* for similar complexity persist. The state may reform (Egypt), the cultural center may shift (Maya), or people may disperse but maintain identity/village life (Harappan, Chaco). Monumental building cessation alone doesn't define collapse for her.

  *   **Her Secondary Rule (often correlated, but potentially distinct):** **Was the end marked by widespread violence, destruction, and/or catastrophic ecological failure?** (Violent/Catastrophic vs. Gradual Relocation).
      *   This is evident in her "Collapse" verdicts (LBA: violence, fires; Easter: ecological failure). Its *absence* supports her "Change" verdicts (Maya: gradual relocation; Harappan: no violence; Egypt: state failure but not cataclysm; Chaco: adaptation).
      *   **The Crucial Point:** This rule seems *supportive* but *not absolutely determinative*. Cahokia might get a "Collapse" verdict *without* clear violence evidence because it fails the *primary* rule ("no successor polity/centrality"). Conversely, a violent end *could* potentially still be "Change" if the core society quickly reforms (though her examples lack this).

  *   **Strain in Her Framework? The Maya Example:**
      You're right, the Maya verdict is doing heavy lifting. It demonstrates that **the absence of violence/catastrophe AND the persistence of the people/culture (even in adapted form) are sufficient for "Change," *overriding* the facts that:**
      *   The *southern lowland cities were abandoned permanently*.
      *   Monumental construction *on that scale and style ended* in the south.
      *   The *specific political structure* of the southern Classic period kingdoms vanished.
      This shows her primary rule ("people/culture persist/regroup") trumps the loss of specific forms, locations, and even political structures, *as long as the cultural core continues elsewhere*. This sets a very high bar for "Collapse."

  **3. Alternative Rules Fitting Her Verdicts:**

  *   **Rule A (People & Identity Continuity):** "Collapse only occurs if the core population suffers a major die-off *or* loses its distinct cultural identity/cohesion, regardless of political structure or monumental building." (Fits all her verdicts: LBA/Easter involve identity loss/die-off?; Maya/Harappan/Egypt/Chaco show continuity).
  *   **Rule B (Political Complexity Reset):** "Collapse occurs when the highest level of indigenous socio-political complexity *in that region* is lost and not regained for centuries, regardless of population continuity." (Fits LBA, Easter, Cahokia; opposes Maya (north), Egypt, Harappan (villages), Chaco (cliff dwellings arguably complex)).
  *   **Her rule is closest to Rule A, but with a nuance about *regaining* complexity ("getting its thing back").**

  **4. The Smoking Gun: A Case to Split Her Rules**

  *   **The Case: The Mycenaean Collapse (Greece, ~1200 BC) - *within her LBA verdict*.**
      *   **What Happened:** Palaces burned, writing lost, kingship vanished, trade networks collapsed. **BUT:** The population didn't vanish. Greeks (speaking early Greek dialects) continued living in the same regions, in smaller villages. Core aspects of religion and oral traditions likely persisted. The *polis* eventually emerged centuries later, a radically different (though complex) political form.
      *   **Applying Her Rules:**
          *   **Rule 1 (Getting Thing Back):** Did they "get their thing back"? The *palatial system*? No, never. A new, different complexity emerged much later. **→ Collapse.**
          *   **Rule 2 (Violent End):** Yes, widespread destruction. **→ Collapse.**
          *   **Rule A (People/Identity Continuity):** Population continuity? Strong evidence for yes. Cultural identity? Greek language, some religious continuity. **→ Change.**
          *   **Rule B (Political Complexity Reset):** Highest complexity (palace-states) lost, not regained in that form; simpler villages for centuries. **→ Collapse.**
      *   **The Conflict:** Her *primary* rule ("Getting Thing Back") likely leads her to call the *Mycenaean specific polity* a Collapse (it didn't come back). But if she strictly applied **Rule A (People/Identity Continuity)** consistently like she did for the Maya, she *should* call it **Change** (Greeks persisted, adapted, eventually formed new states). **Her LBA verdict already implicitly chooses "Collapse" based on the loss of the specific palatial system ("thing") over the population/cultural continuity.** This exposes the tension: How fundamental is the "thing" that needs to be regained? The Maya "thing" (Maya culture/kingship) moved north; the Mycenaean "thing" (palace-states) vanished utterly.

  **5. How to Nail Her Down Over Dinner:**

  1.  **Confirm the Rules:** "So, based on Angkor, Cahokia, Chaco predictions, your core rule seems to be whether the people and core culture persist and *regain their peak complexity* (even if geographically shifted), right? And violence is a supporting factor, but not essential?"
  2.  **Highlight the Maya Precedent:** "The Maya case shows that even permanent city abandonment and the end of monumental building in the heartland isn't 'collapse' if the people and kingship continue elsewhere. That sets a high bar."
  3.  **Introduce the Split:** "But let's test that consistency with *part* of your Late Bronze Age verdict: the Mycenaeans in Greece. Palaces gone forever, writing lost, kings vanished. BUT: Greeks still lived there, speaking Greek, probably keeping some gods and stories. They eventually built the *polis*, a totally different complex system."
  4.  **Ask the Decisive Questions:**
      *   "By your 'Maya rule' (people/culture persist, complexity moves/adapts), shouldn't this be **Change**? The Greeks didn't disappear; they just stopped building palaces for a while and later built city-states instead."
      *   "Or, by your 'Easter Island/LBA overall verdict rule' (the specific complex system vanished forever), is this **Collapse**? The Mycenaean palace-system was gone for good, replaced by something fundamentally different centuries later."
      *   "Can both be true? Is 'Mycenaean civilization' collapsed, but 'Greek culture' merely changed? How do you decide which label applies to the whole event?"

  This forces her to either:
  *   **Acknowledge the primacy of the specific political/structural "thing"** (Mycenaean palaces = Collapse, even with population continuity), which slightly weakens the absoluteness of the Maya precedent (as the southern political "thing" also vanished).
  *   **Double down on population/cultural continuity** as paramount, potentially requiring a slight softening of the LBA Greece verdict towards "Change" within the broader collapse.
  *   **Refine her definition of "getting its thing back"** to be more specific about the *type* and *timeline* of complexity regained.

  Her answer will reveal whether "the people and culture persisting" is truly the ultimate trump card (like Maya) or if the *irreversible loss of a specific, defining form of complexity* (like Mycenaean palaces, Cahokia's centrality, Easter Island's society) is what ultimately defines "collapse" for her, even when people survive. The Maya case *is* the outlier testing her framework's limits. Enjoy the dinner debate!
