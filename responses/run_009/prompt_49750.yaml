prompt: |-
  I sit on the grantmaking board of a mid-sized foundation that takes effective-altruist ideas seriously, and our next meeting takes up a proposal that has split the staff. Before I argue my side, I'd like an outside view on what our precedents commit us to. Our decisions to date: (1) we funded insecticide-treated bed nets through an established distributor, citing randomized-trial mortality data; (2) we funded a campaign that won signed cage-free commitments from three egg producers, with no direct welfare measurements but auditable contracts; (3) we rejected a grassroots land-tenure coalition whose members argued their impact was large but unquantifiable; (4) we rejected a graduate's request for support while she trained for a high-paying finance job and pledged half her income, on the ground that someone else would take the job either way; (5) we funded a fellowship placing analysts in health ministries, on the argument that a few salaries could influence budgets a thousand times larger than their cost.

  The new proposal: three years of support for a small team trying to change how major aid agencies measure success, replacing output counts with a broader wellbeing measure. There would be no verifiable milestones for years; if it works, it could redirect billions; if it fails, there would be nothing to show.

  What decision would be consistent with our precedents, and which precedent is the closest analog? More than one rule fits our track record — at least one under which we fund this and one under which we don't — so please spell out the candidate rules, say what each predicts here, and identify a further case that would tell the rules apart. Finally, one board member claims our record shows measurability bias dressed up as rigor: does this proposal, oddly, give us the cleanest test yet of that accusation?
reasoning: |-
  Okay, let me start by really understanding the user's query. They're on a grantmaking board of a mid-sized foundation that follows effective altruist principles. The staff is split on a new proposal, and they want an outside view on how their past decisions should influence this one. The user listed five precedents and the new proposal involves funding a team to change how aid agencies measure success, with no verifiable milestones for years but potentially huge impact.

  First, I need to analyze each precedent to extract the underlying rules. The user mentioned there might be multiple rules that fit their track record, so I should identify those. Let's break down each decision:

  1. Funded bed nets with RCT data. This shows a preference for interventions with strong empirical evidence and quantifiable outcomes.
  2. Funded cage-free campaigns with auditable contracts. Here, there's no direct welfare measurement, but there's a clear, verifiable output (signed contracts) that can lead to future impact. So, verifiable outputs are key.
  3. Rejected the land-tenure coalition due to unquantifiable impact. This emphasizes the need for quantifiable evidence, even if the potential impact is claimed to be large.
  4. Rejected the graduate's funding request because someone else would take the job. This is about counterfactual impact—ensuring the grant causes additional benefit that wouldn't happen otherwise.
  5. Funded the health ministry fellowships, arguing leverage (small salaries influencing large budgets). This focuses on leverage and scalability, even without immediate measurable outcomes.

  Now, the new proposal: changing how aid agencies measure success. No verifiable milestones for years, potential for huge impact (redirecting billions), or total failure. 

  I need to see which precedents align or conflict. The bed nets case (1) and land-tenure rejection (3) stress quantification, which this proposal lacks. The cage-free commitments (2) had auditable outputs, which this doesn't have initially. The fellowship funding (5) is about leverage, similar to the potential here. The counterfactual consideration (4) might apply if the team wouldn't exist without funding, but that's unclear.

  The user also asks for candidate rules. Rule A could be requiring quantifiable evidence or verifiable milestones. Rule B focuses on leverage and counterfactual impact, even without immediate metrics. Rule A would reject this proposal, Rule B might fund it. 

  Then, a test case to differentiate: a proposal with high leverage but no quantifiable evidence until much later. The current proposal is such a test case. 

  The board member's accusation of measurability bias: this proposal is a clean test because it lacks measurable outcomes but has high potential leverage. Funding it would counter the bias claim; rejecting it might confirm it. 

  I should ensure the rules are clearly defined and the reasoning ties each precedent to the rules. Also, address how the proposal serves as a test for measurability bias. Need to present both sides fairly, showing consistency either way based on which rule they prioritize. Highlight that the fellowship precedent (5) is the closest analog due to leverage, but the lack of any milestones is a key difference. 

  Finally, advise the user to consider their risk tolerance and whether they value potential high-leverage opportunities despite uncertainty. The decision might hinge on whether they prioritize immediate verifiability or long-term transformative potential.
answer: |-
  Based on your precedents, two distinct decision rules emerge, leading to opposite conclusions for this proposal. Here's the breakdown:

  **Candidate Rule 1: Require Quantifiable Evidence or Verifiable Proxies for Impact** (Predicts: **REJECT**)
  *   **Logic:** Prioritizes interventions with demonstrable, measurable impact using robust evidence (RCTs, auditable outputs) or clear counterfactual reasoning. Avoids funding where impact is purely speculative or unquantifiable.
  *   **Precedents Supporting Rule 1:**
      *   (1) Bed Nets: Funded based on RCT mortality data (quantifiable impact).
      *   (2) Cage-Free Campaigns: Funded based on auditable contracts (verifiable proxy for future impact).
      *   (3) Land-Tenure Coalition: Rejected due to unquantifiable impact.
      *   (4) Graduate Funding: Rejected based on counterfactual analysis (no marginal impact).
  *   **Prediction for New Proposal:** REJECT. The proposal explicitly lacks verifiable milestones for years and admits there might be "nothing to show" if it fails. Impact (redirecting billions) is entirely speculative and unquantifiable upfront, resembling the rejected land-tenure case (3) more than the funded cases with evidence/proxies (1,2).
  *   **Closest Analog:** (3) Land-Tenure Coalition (rejected for unquantifiable impact).

  **Candidate Rule 2: Prioritize High Leverage and Counterfactual Opportunity** (Predicts: **FUND**)
  *   **Logic:** Focuses on the potential scale of impact relative to cost and whether the grant enables something impactful that *wouldn't happen otherwise* (strong counterfactual). Tolerates uncertainty and lack of immediate measurability if the leverage (impact/cost ratio) is potentially enormous.
  *   **Precedents Supporting Rule 2:**
      *   (5) Health Ministry Fellowships: Funded explicitly for leverage ("a few salaries could influence budgets a thousand times larger"). Impact measurement was indirect/future-oriented.
      *   (2) Cage-Free Campaigns: Leverage is implied (campaign cost vs. value of commitments). Auditable contracts provided assurance, but the *impact* (animal welfare improvement) wasn't directly measured.
      *   (4) Graduate Funding: Rejection *used* counterfactual reasoning to show *lack* of leverage/marginal impact.
  *   **Prediction for New Proposal:** FUND. The potential leverage is immense ("redirect billions" vs. a small team's cost for 3 years). If successful, the counterfactual impact (billions redirected better) is huge. This aligns with the *leverage argument* of the health fellowships (5), despite the higher uncertainty. The lack of milestones is a difference in degree, not kind, from the fellowship's long feedback loop.
  *   **Closest Analog:** (5) Health Ministry Fellowships (funded for high leverage despite uncertain/immediate measurement).

  **Test Case to Differentiate the Rules:**
  *   **Proposal:** Funding a small policy advocacy organization aiming to pass a specific law in 5 years that would significantly reduce industrial pollution. Success is binary (law passes or not), impact is large but hard to quantify precisely before implementation, and no verifiable short-term milestones exist beyond policy drafts/meetings.
  *   **Rule 1 Prediction:** REJECT. Lacks quantifiable impact evidence or verifiable proxies for the desired outcome (law passage/impact) during the grant period.
  *   **Rule 2 Prediction:** FUND. High potential leverage (small cost vs. large regulatory impact) and clear counterfactual (law unlikely to pass without dedicated advocacy).

  **Measurability Bias Accusation & This Proposal as a Test:**
  The board member has a point. Precedents (1, 2, 3, 4) heavily favor measurable evidence or verifiable outputs. Even (5) used a concrete leverage ratio argument. **This proposal is indeed the cleanest test yet:**

  1.  **High Potential Leverage:** Like the health fellowships (5), it offers enormous potential impact relative to cost – arguably even higher leverage ("billions redirected").
  2.  **Extreme Measurement Uncertainty:** Unlike *all* previous cases, it explicitly offers **no verifiable milestones or outputs for years** and admits potential for total failure with "nothing to show." The land-tenure case (3) was rejected for lack of quantification, but this proposal pushes that uncertainty further by being systemic and long-term.
  3.  **Pure Counterfactual Focus:** Success hinges *entirely* on enabling a change that wouldn't happen otherwise (like the *intent* behind the health fellowships, but without even the intermediate output of placing analysts).

  **Decision Implications for the Accusation:**
  *   **If you FUND:** You demonstrate that high *potential leverage* and *counterfactual significance* can outweigh the *complete lack* of short-term measurability or verifiable outputs, directly countering the measurability bias accusation. It shows true commitment to scale and counterfactual impact, even under high uncertainty.
  *   **If you REJECT:** You confirm the bias. Despite the immense potential leverage (similar to precedent 5), the *absence* of measurable milestones or outputs (unlike precedents 1, 2, and arguably 5's leverage ratio) becomes the deciding factor, aligning most closely with rejecting the land-tenure case (3). It prioritizes the *appearance* of rigor (demanding metrics) over the *potential* for transformative impact.

  **Recommendation:**
  Your precedents are genuinely split. Rule 1 (Require Evidence/Verifiability) suggests **rejection**, with the land-tenure case (3) as the closest analog. Rule 2 (Prioritize Leverage/Counterfactual) suggests **funding**, with the health fellowships (5) as the closest analog.

  *   **To maintain consistency with a focus on measurable evidence/outputs (Rule 1):** REJECT.
  *   **To prioritize potential transformative leverage despite uncertainty (Rule 2):** FUND.
  *   **Regarding the measurability bias accusation:** Funding this proposal is the strongest signal you could send that your foundation prioritizes potential scale and counterfactual impact over the comfort of near-term measurability. Rejecting it would be the clearest evidence supporting the accusation of measurability bias.

  **Your argument should hinge on which principle (evidence/verifiability vs. leverage/counterfactual) your foundation ultimately values more when they conflict, as they do starkly here.** The health fellowship (5) is the bridge precedent, but this proposal forces a clearer choice.
