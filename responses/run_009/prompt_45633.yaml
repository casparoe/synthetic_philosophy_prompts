prompt: |-
  I'm a final-year maths student who tagged along on my girlfriend's philosophy of science module and got completely sucked in by the interpretations of probability thing. Every textbook I've found treats it like a personality quiz — pick your team, frequentist or Bayesian or propensity person, and then you mostly just argue. But before I read any more of these I want to know what I should actually be asking of one. Write the desiderata: what any adequate interpretation of probability has to deliver, with the reasoning behind each requirement.

  Some things I keep circling and want on the list, so you know the level I mean: the single-case thing (a doctor telling this patient there's a 70% chance the treatment works — this patient either recovers or doesn't, and I don't see a long run anywhere); the circularity worry about frequencies (the claim that relative frequencies converge to the chance is itself, on the frequentist's own terms, only probabilistic — is that a fatal loop or a shrug?); reference classes (my 40-year-old smoker belongs to a dozen different populations with different survival rates, and the interpretation is meant to tell me which number is *the* chance); and whatever chance is, it seems like my credences should defer to it when I know it — the interpretation has to make that rational, not just stipulate it. There's also some fuss I half remember that de Finetti only got finite additivity out of his coherence arguments, so whether countable additivity is a genuine requirement or just Kolmogorov's convention seems like it needs deciding. And I read a complaint that propensities, being some kind of causal disposition, make a mess of backwards probabilities — conditionals that run opposite to the direction of cause. Work out whether that's a real demand on an interpretation or pedantry I can drop.

  For each requirement say whether it's non-negotiable or just a preference of one camp, and flag any pair or subset you suspect can't be jointly satisfied — that's the part I actually care about most. Fix the purpose for me: I want an interpretation that's good enough for someone reasoning about one-off events in science and ordinary life, not just one that's tidy for gamblers or bookmakers. Then score frequentism, subjectivism, and propensities briefly against the list — one line each, I'll do the rest myself. And be honest about which single requirement does the most damage, I suspect it's the single-case one but I want to know if that's just my bias.
reasoning: |-
  Okay, the user is a final-year math student who's gotten interested in philosophy of science, specifically interpretations of probability. They're frustrated with textbooks that present the debate as a "pick your team" scenario without deeper analysis. They want a clear set of desiderata for any adequate interpretation of probability, with reasoning behind each, and an evaluation of major interpretations against those criteria.

  The user has already identified several key concerns: single-case probabilities (like a doctor's prognosis for one patient), the circularity in frequentism (using probability to define probability), reference class problems (which group's statistics apply to an individual), and the connection between objective chances and rational credences. They also mention technical issues like countable additivity and worries about propensities handling backwards probabilities.

  I need to organize these into a coherent framework. First, the absolute must-haves for any interpretation: it must give meaning to probability claims in individual cases (single-case applicability), avoid vicious circularity, provide a non-arbitrary way to handle reference classes, explain why rational agents should align beliefs with known chances (Principal Principle), and be mathematically rigorous enough to support standard probability calculus. These are non-negotiable because without them, probability couldn't function in real-world decision-making or scientific reasoning.

  Then there are desirable but potentially optional features: countable additivity (which many mathematicians require but strict subjectivists reject), compatibility with causal direction (to avoid paradoxes in backward-time inferences), and unification across contexts (so the same concept works for coin flips and quantum mechanics). The user specifically wants this for "one-off events in science and ordinary life," so practical applicability matters more than theoretical purity.

  The big tension points emerge clearly: Frequentism fails single-case and reference class problems catastrophically; Subjectivism handles single-case beautifully but makes chance entirely mind-dependent; Propensity solves single-case but stumbles on reference classes and backward probabilities. The circularity issue in frequentism might be technically fixable but remains philosophically troubling. And the Principal Principle becomes mysterious in Subjectivism unless blended with objective elements.

  The most damaging requirement is indeed single-case applicability—it sinks frequentism, strains propensities, and is the very reason subjectivism exists. But the reference class problem haunts all objective approaches equally. For the user's needs (science/ordinary life), a hybrid view might be necessary—perhaps subjectivism for belief, with objective chances grounded in propensities where available, while acknowledging the reference class issue as unsolvable without contextual judgment.

  I'll structure this as: (1) Core Desiderata (non-negotiable), (2) Secondary Desiderata (contextually important), then evaluate the three interpretations against them. The "fatal tensions" section will highlight where desiderata conflict, especially single-case vs. reference class objectivity. The scoring will be brutally concise—one line per interpretation—as requested. And I'll confirm that single-case is indeed the killer requirement, but note that reference class ambiguity is what makes objective single-case probabilities fundamentally messy.
answer: |-
  Here are the core desiderata for any adequate interpretation of probability, grounded in the conceptual problems you've identified. I'll distinguish **Non-Negotiable** requirements (essential for any minimally functional interpretation) from **Secondary** ones (highly desirable for specific applications, but potentially negotiable for the core concept). I'll then flag key tensions and score the major interpretations.

  ### Core Desiderata (Non-Negotiable)

  1.  **Single-Case Applicability:** *Must assign meaning to probability statements about singular, non-repeatable events.* (e.g., "70% chance *this specific patient* recovers").
      *   **Reasoning:** The vast majority of real-world probabilistic reasoning concerns unique events (medical prognoses, specific experiments, historical events, individual decisions). An interpretation unable to handle this is practically useless for science and life.
  2.  **Avoidance of Vicious Circularity:** *Must not define probability in a way that presupposes the concept it is defining, creating a regress or inconsistency.*
      *   **Reasoning:** The frequentist's "long-run relative frequency in a hypothetical infinite sequence" relies on the notion of convergence *in probability*. If probability itself is defined via such convergence, the definition is circular and potentially incoherent. This isn't a "shrug" – it's a foundational flaw.
  3.  **Reference Class Coherence:** *Must provide principled (even if not always unique) guidance for resolving reference class problems.* (e.g., Which survival rate applies to *this* 40-year-old smoker?).
      *   **Reasoning:** Individuals belong to multiple overlapping classes with differing statistics. An interpretation must offer a framework (even if it involves epistemic judgment) for selecting the *most relevant* objective probability (for objectivist views) or forming the rational credence (for subjectivist views). It cannot leave the choice entirely arbitrary.
  4.  **The Principal Principle / Normative Force:** *Must explain why, upon learning that the objective chance of E is p, it is rational to set one's subjective credence in E to p (unless one has inadmissible information).*
      *   **Reasoning:** This captures the core intuition that objective chances *constrain* rational belief. If chances exist, they should guide rational action and belief formation. An interpretation must make this deference rational, not merely stipulate it. It bridges the objective/subjective gap.
  5.  **Mathematical Adequacy:** *Must provide a foundation consistent with the standard Kolmogorov probability calculus (including finite additivity) for the domain it claims to cover.*
      *   **Reasoning:** Probability is a powerful mathematical tool. An interpretation must justify using the calculus for the types of events it describes (e.g., justifying countable additivity for infinite spaces if claimed, or explaining its limitations if not).

  ### Secondary Desiderata (Highly Desirable, Contextual)

  6.  **Countable Additivity:** *Should ideally justify countable additivity (σ-additivity) for infinite sample spaces.*
      *   **Reasoning:** While finite additivity is the core coherence requirement (De Finetti), countable additivity is essential for the full power of modern probability theory (continuity, limit theorems, integration). Many find arguments for it compelling (e.g., avoiding "non-conglomerability"), though strict subjectivists like De Finetti reject it as a *universal* rational constraint. Its status depends on whether the interpretation demands the full mathematical toolkit.
  7.  **Causal Direction Compatibility:** *Should not inherently conflict with the temporal/causal direction of influence.*
      *   **Reasoning:** While probability itself is symmetric (P(A|B) vs. P(B|A)), interpretations like propensities (tied to causal dispositions) struggle with "backwards" probabilities (e.g., P(Cause|Effect) inferred from P(Effect|Cause)). An interpretation shouldn't *preclude* standard Bayesian inference involving causes and effects. This isn't pedantry; it's about applicability to causal reasoning in science.
  8.  **Generality / Unification:** *Should ideally provide a single, unified concept applicable across diverse contexts (physical chances, epistemic uncertainties, frequencies).*
      *   **Reasoning:** We use "probability" in seemingly similar ways across physics, statistics, epistemology, and daily life. An interpretation that fragments the concept unnecessarily is less elegant and potentially obscures connections. However, strict separation might be necessary.

  ### Fatal Tensions (Where Desiderata Conflict)

  *   **Single-Case vs. Frequentist Definition:** This is the most fundamental conflict. Frequentism (pure long-run) fundamentally *cannot* satisfy (1) without smuggling in another concept (like propensity or epistemic probability), creating tension with (2) or failing (8).
  *   **Objectivity vs. Reference Class:** Truly objective interpretations (Frequentism, Propensity) struggle profoundly with (3). There often *isn't* a unique "correct" reference class in reality. This pushes towards epistemic elements (judgment, background knowledge) to resolve it, conflicting with pure objectivity. Subjectivism avoids this by making probability inherently epistemic.
  *   **Chance Existence vs. Principal Principle in Subjectivism:** Pure Subjectivism (De Finetti) denies objective chance exists, making (4) inapplicable. They explain *apparent* deference via exchangeability and convergence of opinion. This is unsatisfying to those who believe genuine physical chances exist and *should* constrain belief. Hybrid views (e.g., Lewis) try to bridge this.

  ### The Most Damaging Requirement

  You're right: **Single-Case Applicability (1)** is the primary killer for strict Frequentism and creates significant pressure on all interpretations. It forces Frequentism into awkward maneuvers (hypothetical infinite sequences for single cases, invoking propensities) that trigger circularity (2) or reference class (3) problems. It's the core reason Subjectivism and Propensity theories exist. While the reference class problem (3) is devastatingly *practical* for objective views, single-case (1) is the *conceptual* linchpin.

  ### Purpose-Driven Interpretation

  For reasoning about one-off events in science and ordinary life, an interpretation **must** excel at Single-Case Applicability (1) and provide a workable approach to the Principal Principle (4) and Reference Classes (3). Purely long-run Frequentism is inadequate. Subjectivism or Propensity (or a hybrid) are necessary starting points. Countable additivity (6) is usually desirable for scientific applications. Causal compatibility (7) is crucial for scientific modeling.

  ### Scoring the Interpretations Against Core Desiderata

  *   **Frequentism (Long-Run):**
      *   (1) FAILS (No direct meaning for single case).
      *   (2) FAILS/Strained (Vicious circularity in defining convergence).
      *   (3) FAILS (Reference class problem is catastrophic).
      *   (4) FAILS (No objective single-case chance to defer *to*).
      *   (5) PASSES (Adequate for repeatable events).
  *   **Subjectivism (Personalist Bayesianism - e.g., De Finetti):**
      *   (1) PASSES (Credence *is* defined for single cases).
      *   (2) PASSES (Defined via betting coherence/avoiding Dutch books).
      *   (3) PASSES (Credence based on *all* available information/reasoning).
      *   (4) FAILS/Explains Away (Denies objective chance; explains convergence via exchangeability).
      *   (5) PASSES (Coherence requires finite additivity; often adopts countable additivity pragmatically).
  *   **Propensity (e.g., Popper):**
      *   (1) PASSES (Propensity is a property of the *single-case* setup).
      *   (2) PASSES (Defined as a causal disposition/causal power).
      *   (3) FAILS/Strained (Which "setup" is relevant? Ambiguity akin to reference class).
      *   (4) PASSES (Rational to align credence with known causal tendency).
      *   (5) PASSES (Adequate foundation).

  ### Conclusion

  An adequate interpretation for your purpose must pass the Core Desiderata. **Pure Frequentism fails utterly.** **Subjectivism** handles the epistemology of uncertainty beautifully for single cases but **denies objective chance**, making the Principal Principle mysterious. **Propensity** provides objective single-case chances and grounds the Principal Principle but **struggles severely with reference classes/defining the "setup" and causal direction (especially backwards probabilities)**. 

  The search often leads towards **hybrid views** (e.g., David Lewis's "Best System" analysis of chance, grounding objective chances in patterns across the Humean mosaic, combined with the Principal Principle; or Objective Bayesianism using MaxEnt principles to constrain credence based on physical symmetries/chances). These attempt to salvage objectivity while addressing single-case and reference class issues, though they have their own complexities. The unresolved tension between objective chance and the reference class problem remains the deepest practical challenge.
