prompt: |-
  so I've been going down a rabbit hole on scientific realism, and everyone keeps telling me structural realism is the only position left standing after theory change -- you know, the Fresnel-to-Maxwell thing where the equations survive but the ether doesn't. Before I buy any of it I want the actual spec, not slogans. Write me the list of desierata a theory of structural realism has to meet to count as adequate: what it has to deliver on theory change, what it has to say about what "structure" even is, how it has to survive the Newman objection, how it deals with underdetermination, that kind of thing. For each requirement give the case or consideration behind it, and mark which are non-negotiable versus which are just demands particular camps insist on (the epistemic and the ontic people clearly want different things from the theory, so note where their demands actually diverge).

  two specific candidate requirements I want your judgment on -- tell me straight if either is bogus, don't just politely include them:

  1. the theory must not count gauge-redundant structure as part of what we know. the structure that's just bookkeeping -- artifacts of coordinate choice or redundant variables -- shouldn't count as knowledge, otherwise the no-miracles argument ends up proving way too much.

  2. the theory owes us a real account of when two differently-formulated theories have "the same structure." if sameness just collapses into intertranslatability, that seems too cheap -- plenty of things are intertranslatable without us wanting to say they carve nature the same way.

  then flag any subset of the requirements that can't be jointly satisfied -- that's genuinely the part I care about most, more than the list itself. skip the scorecard of existing versions (Worrall vs Ladyman vs whoever), the criteria are what I want, not a rundown of who satisfies them. the whole thing is for a seminar paper where I argue the spec does the work, so keep the weight on the requirements and the cases behind them.

  end with a final line of the form \answer{...} containing just the label/short name of the single requirement that does the most to rule out candidate theories -- I want to build the paper around whichever one that is.
reasoning: |-
  Okay, the user is diving deep into structural realism and wants a clear set of criteria for what makes a theory of structural realism adequate. They specifically mentioned several key issues: handling theory change, defining structure, surviving the Newman objection, dealing with underdetermination, and two additional points about gauge redundancy and structural equivalence. 

  First, I need to recall the core challenges for structural realism. The Fresnel-Maxwell transition is central here—equations persist while ontology shifts. That's the classic case driving structural realism. But defining "structure" is tricky; is it just mathematical formalism or something more? Newman's objection looms large too—if structure is just about cardinality, it becomes trivial. Underdetermination adds another layer of complexity with competing theories having identical structures.

  The user also flagged two specific requirements: excluding gauge-redundant structure and defining structural equivalence beyond mere intertranslatability. For the first, I agree gauge redundancy shouldn't count—it's bookkeeping, not knowledge. For the second, intertranslatability alone is insufficient; structural equivalence needs deeper criteria, like shared invariant content across formulations. 

  Epistemic vs. ontic variants of structural realism have different priorities. Epistemic focuses on what we can know (structure as described by equations), while ontic pushes further, saying structure is all there is. Their demands diverge on issues like handling unobservables or the nature of relations. 

  Now, compiling the desirata: 
  - **Theory change resilience** (non-negotiable): Must explain continuity through transitions like Fresnel-Maxwell. 
  - **Structure definition** (non-negotiable): Needs to specify what structure is—mathematical relations, but avoiding Newman's triviality. 
  - **Newman objection immunity** (non-negotiable): Requires structure to be more than just cardinality constraints. 
  - **Underdetermination response** (non-negotiable?): Should address how empirically equivalent theories relate structurally. 
  - **Gauge non-redundancy** (contentious but reasonable): Exclude artificial structure from "knowledge." 
  - **Non-trivial structural equivalence** (contentious): Sameness shouldn't reduce to intertranslatability alone. 

  Tensions arise immediately. Defining structure robustly (to avoid Newman) while keeping it non-trivial clashes with making it abstract enough for theory continuity. Gauge redundancy exclusion might conflict with structural equivalence if "trimmed" theories are seen as distinct. The biggest hurdle seems to be reconciling a substantive structure definition with resilience to theory change—too abstract risks Newman, too concrete risks discontinuity. 

  For the answer, the structure definition requirement does the most to rule out candidates. It's the linchpin: fail here, and Newman sinks you; succeed too narrowly, and theory change breaks you. Most versions stumble on this tightrope.
answer: |-
  Here is the comprehensive specification for a minimally adequate theory of structural realism (SR), with desirata categorized, justified, and assessed for negotiability. Key tensions are identified, and your specific candidate requirements are evaluated bluntly.

  **Core Desiderata for Structural Realism (Non-Negotiable for Any Viable SR):**

  1.  **Theory Change Resilience (The Continuity Requirement):**
      *   **What it must deliver:** Explain how scientific progress is rational despite radical ontological shifts, demonstrating substantive continuity between superseded and successor theories *at the structural level*, even when their ontologies clash.
      *   **Case Behind It:** The Fresnel-Maxwell transition (equations for light propagation and interference preserved; luminiferous ether ontology abandoned). Failure here undermines SR's core motivation as the "only position left standing."
      *   **Epistemic vs. Ontic:** Both demand this. Epistemic SR emphasizes *knowledge* of the preserved structure. Ontic SR emphasizes that the preserved structure *is* the fundamental reality.

  2.  **Non-Trivial Structure Definition (The Newman Immunity Requirement):**
      *   **What it must deliver:** Define "structure" in a way that is substantive and non-trivial, avoiding the pitfall where claiming we know the structure of the world reduces to knowing merely its observational consequences or the cardinality of its domain (Newman's Objection).
      *   **Case Behind It:** Newman's Objection (1928): If SR only commits to the existence of *some* set of relations satisfying the formal structure of our successful theories, this is trivialized to knowing the world has enough objects to instantiate *any* such structure consistent with observed phenomena. SR must specify *which* relations are real and non-arbitrary.
      *   **Epistemic vs. Ontic:** Both demand this. Epistemic SR needs knowable structure to be contentful. Ontic SR needs the structure to constitute reality, not just be a formal shell. Solutions often invoke modal constraints (causal/nomological relations), invariant features, or tie structure to specific physical relations.

  3.  **Underdetermination Response (The Discriminatory Power Requirement):**
      *   **What it must deliver:** Provide principled grounds for favoring one empirically adequate theory over another *structurally distinct* rival (e.g., variants of QM interpretations, global spacetime structures in GR). It must explain why structural equivalence *matters* for realism beyond mere empirical adequacy.
      *   **Case Behind It:** The challenge from radical underdetermination (e.g., Bohmian Mechanics vs. Orthodox QM, different global topologies in cosmology). SR cannot be viable if *any* empirically adequate structure is equally "real" regardless of its physical content.
      *   **Epistemic vs. Ontic:** Both face this, but responses differ. Epistemic SR may appeal to structural virtues like simplicity or unification *within the knowable structure*. Ontic SR might argue that only one structure *can* be fundamental, or that different structures represent different ontologies. Both need a criterion for relevant structural differences.

  **Contentious but Widely Demanded Desiderata (Often Camp-Specific):**

  4.  **Account of Representational Capacity (The "How Structure Hooks Onto World" Requirement):**
      *   **What it must deliver:** Explain how abstract mathematical structure represents or corresponds to the physical world. What is the nature of the "relation" between mathematical relations and physical relations?
      *   **Case Behind It:** The inherent abstractness of mathematical structures vs. the concrete nature of physical systems. Without this, SR risks being a form of mathematical idealism or leaving reference obscure.
      *   **Epistemic vs. Ontic:** *Epistemic SR often prioritizes this* – how do our mathematical models latch onto reality? *Ontic SR often downplays or redefines it* – if structure *is* reality, the question morphs into accounting for appearances/observers within that structure.

  5.  **Handling Unobservables (The Scope Requirement):**
      *   **What it must deliver:** Specify the epistemic or ontological status of structural claims about entities or processes that are fundamentally unobservable (e.g., quarks, quantum fields, spacetime singularities, the universe beyond our cosmological horizon).
      *   **Case Behind It:** The core realist commitment vs. instrumentalist/phenomenalist critiques. SR must justify why we should be realists about the structure *of* unobservables, not just the observable structure.
      *   **Epistemic vs. Ontic:** *Epistemic SR often struggles here*, needing to show how knowledge of unobservable structure is possible/justified. *Ontic SR often embraces it* – unobservables are part of the fundamental structure.

  **Your Specific Candidate Requirements - Judgment:**

  6.  **Gauge Non-Redundancy:**
      *   **Requirement:** The theory must not count gauge-redundant structure (e.g., coordinate-dependent features, unphysical degrees of freedom like the temporal component of the EM potential) as part of the knowable or real structure. Only gauge-invariant structure counts.
      *   **Case Behind It:** Gauge theories (e.g., EM, GR, SM). Treating redundant variables as real/knowable structure bloats ontology/knowledge claims absurdly and violates physical practice (e.g., defining observables as gauge-invariant).
      *   **Judgment:** **NOT BOGUS. Essential.** Any credible SR *must* incorporate this. Failure leads to the "proving too much" problem you identified. This is increasingly seen as non-negotiable for a *physically plausible* SR.

  7.  **Non-Trivial Structural Equivalence:**
      *   **Requirement:** Provide a substantive account of when two differently formulated theories are "structurally equivalent" that goes beyond mere formal intertranslatability or empirical equivalence. It must capture a deeper sense of "carving nature the same way."
      *   **Case Behind It:** Lagrangian vs. Hamiltonian mechanics (intertranslatable, arguably same structure); Heisenberg Matrix Mechanics vs. Schrödinger Wave Mechanics (initially seen as rivals, proved equivalent); Coordinate vs. Coordinate-Free formulations of GR. Mere translatability seems too weak to ground robust structural realism.
      *   **Judgment:** **NOT BOGUS. Crucial but Deeply Challenging.** While intertranslatability is necessary, it's arguably insufficient. SR needs criteria like shared dynamical symmetries, identical sets of physically possible states/transitions, or isomorphism under a physically meaningful mapping (e.g., preserving causal structure, not just any bijection). This requirement pushes SR towards identifying *invariant content* across formulations.

  **Tensions and Incompatibilities:**

  *   **Structure Definition vs. Theory Change Resilience:** This is the **central tension**. Defining structure robustly enough to avoid Newman's triviality (e.g., requiring specific causal/nomological relations) risks making it *too specific* to survive theory change (e.g., Fresnel's mechanical ether-based relations vs. Maxwell's field relations). Conversely, defining structure too abstractly (e.g., just isomorphism types) ensures continuity but risks collapsing into Newman triviality or failing to capture the "carving nature" aspect (Non-Trivial Structural Equivalence).
  *   **Non-Trivial Structural Equivalence vs. Theory Change Resilience:** Defining a strong criterion for structural sameness might make it harder to see continuity across genuinely revolutionary changes (e.g., classical phase space vs. quantum Hilbert space). Too strong a criterion threatens the core motivation.
  *   **Gauge Non-Redundancy vs. Structural Equivalence:** Different formulations often use different gauge choices or redundant variables. Judging them structurally equivalent requires focusing *only* on the shared gauge-invariant core. This is necessary but highlights the need for a robust criterion for equivalence that isolates this core.
  *   **Ontic SR vs. Handling Unobservables:** Ontic SR's strong claim that structure *is* reality makes accounting for the apparent distinction between observable and unobservable particularly challenging within the framework itself.

  **The Most Damaging Requirement for Candidate Theories:**

  The requirement that does the most heavy lifting in ruling out candidate versions of SR is **Non-Trivial Structure Definition (Requirement 2: Newman Immunity)**. Why?

  1.  **Foundational Threat:** Newman's Objection is a direct, formal attack showing that weak definitions of "structure" reduce SR to triviality or instrumentalism. Any candidate failing this is dead on arrival.
  2.  **High Bar:** Meeting it requires a substantial, non-formalist account of physical structure (e.g., modal, causal, nomological, involving specific relations), moving beyond pure mathematics.
  3.  **Drives Other Tensions:** The struggle to define structure substantively *without* making it too fragile to survive theory change (Requirement 1) is the core engine of debate within SR. Solutions to Newman (e.g., Ladyman & Ross's "Real Patterns") directly shape how continuity (Requirement 1) and equivalence (Requirement 7) are handled, and often determine how unobservables (Requirement 5) or representation (Requirement 4) are addressed.
  4.  **Filter for Viability:** Many proposed structures (especially highly abstract or set-theoretic ones) succumb to Newman. Only definitions incorporating robustly physical constraints survive, significantly narrowing the field.

  \answer{Non-Trivial Structure Definition (Newman Immunity)}
