  We are drafting a joint statement from two metaphysicians: a mereological universalist and an organicist (van Inwagen-style). The document must include agreed claims, disagreements in a table, and cruxes with predictions. Additionally, we must address the problem of the many and include a closing section on the verbal/non-verbal nature of the dispute. A footnote about composite objects created during the drafting is required.

