  5. **Closing Section**: Verdict on which parts are verbal and which are not, with one paragraph reply each.

  6. **Footnote**: Each party states how many composite objects came into existence during the drafting, consistent with their view. Must be funny only by implication of the numbers.

  Now, let's draft.

  ---

  **Joint Statement on the Special Composition Question**

  After a year of adversarial collaboration, we, the mereological universalist (MU) and the organicist (O) (in the style of van Inwagen), present the following joint statement.

  **1. Agreed Claims**

  1.1. The Special Composition Question (SCQ) asks: *Under what circumstances do some things compose a further thing?* This is distinct from the general question of composition, which concerns the nature of the composition relation itself. The SCQ seeks the conditions under which composition occurs, while the general question might also address, for example, whether composition is identity or a different relation.

  1.2. The argument from vagueness for universalism, which contends that any restriction on composition must be vague and that vague existence is impossible, can establish that non-universalist positions must accept either vague composition or vague existence. However, both parties agree that classical mereology is not logically compulsory. Thus, the argument does not force the rejection of non-universalist views, because one can reject the underlying assumptions (e.g., that composition must be precise) without logical contradiction. The argument is a challenge to be met, not a proof.

  1.3. Each view incurs substantial costs. The organicist acknowledges that their view denies the existence of tables, ships, mountains, and other inanimate composite objects, leaving only living organisms and simples (or whatever the minimal parts are). This requires a radical revision of ordinary beliefs about what exists. The universalist acknowledges that their view entails the existence of a vast array of composite objects, including arbitrary fusions such as the fusion of the Eiffel Tower and the top of Mount Everest, which are not recognized in ordinary thought and language. These fusions are so numerous and arbitrary that they seem to violate parsimony.

  1.4. Each party states what would count as their view being wrong:
     - *The universalist*: "If it were shown that there is a precise boundary to composition that does not include every arbitrary fusion, then universalism would be wrong. Specifically, if there were a case in which some things do not compose anything, and this could be established without vagueness or arbitrariness, then universalism would be refuted."
     - *The organicist*: "If it were shown that there are composite objects that are not living organisms (or simples) and that these objects are not reducible to or explicable in terms of living organisms, then organicism would be wrong. For instance, if it were conclusively demonstrated that artifacts like tables or ships are composite objects in the same fundamental sense as organisms, then organicism would be refuted."

  **2. Disagreements**

  We have the following residual disagreements. For each, we present two wordings: one acceptable to the universalist and one to the organicist. We also mark whether the disagreement is genuine or merely verbal.

  | Disagreement Description (Universalist Wording) | Disagreement Description (Organicist Wording) | Genuine or Merely Verbal? |
  |-------------------------------------------------|-----------------------------------------------|----------------------------|
  | Composition can be vague: There are cases where it is indeterminate whether some things compose a further object. | Composition is never vague: Whenever some things do not jointly constitute a life, they do not compose anything; when they do, they determinately compose an organism. | Genuine |
  | The restriction 'jointly constitutes a life' is an ad hoc restriction on composition without independent motivation. | The restriction 'jointly constitutes a life' is a joint-carving, natural restriction that reflects a fundamental feature of reality. | Genuine |
  | Ordinary singular terms like 'the table' refer to composite objects (fusions of particles arranged tablewise) that exist. | Ordinary singular terms like 'the table' do not refer to composite objects; they are either mistaken or refer to something else (e.g., the particles arranged tablewise or a fictional entity). | Genuine (but partially verbal) |
  | Artifacts are composite objects. | Artifacts are not composite objects; they are merely particles arranged in certain ways. | Genuine |

  Note: The disagreement about the reference of ordinary terms is marked as partially verbal because the parties might agree on the underlying facts (e.g., the arrangement of particles) but disagree on whether that arrangement constitutes an object. However, the disagreement about the existence of artifacts is genuine.

  **3. Cruxes with Predictions**

  For each genuine disagreement, we identify a sub-question and a concrete case, and record each party's prediction.

  3.1. *Sub-question for vagueness of composition*: Can there be borderline cases of composition that are not resolvable by further facts?

     - *Case*: A sorites series for a cloud. Start with a clear case of a cloud (a dense collection of water droplets) and gradually remove droplets one by one until we have a clear non-cloud (a few scattered droplets). At some points, it is unclear whether there is a cloud.

     - *Universalist's prediction*: There will be borderline cases in which it is indeterminate whether the droplets compose a cloud. Since universalism holds that composition is unrestricted, the universalist does not accept vagueness in composition. However, in this case, the universalist will say that there is always a fusion of the droplets, but it may be indeterminate whether that fusion is a cloud (i.e., the vagueness is in the predicate 'cloud', not in composition). Thus, the universalist predicts that the vagueness is not in composition itself.

     - *Organicist's prediction*: Since the organicist denies that there is any composite object in this case (because the droplets do not constitute a life), they hold that there is no composition at all. The vagueness in 'cloud' does not reflect vagueness in composition, which is always determinate (composition occurs only when there is life). The organicist predicts that the entire series involves no composition, and the vagueness is merely semantic.

  3.2. *Sub-question for 'constitutes a life' as joint-carving*: Is the property of constituting a life a fundamental, natural property that can ground composition?

     - *Case*: A gradual transition from a living organism to a corpse. Consider a human being who is alive and then dies. During the dying process, there may be a period during which it is unclear whether the body constitutes a life.

     - *Universalist's prediction*: The universalist will say that the fusion of particles exists throughout, but the property of being alive is vague. Thus, the restriction 'constitutes a life' is not a sharp joint-carving boundary but a vague one, which undermines its status as a fundamental restriction.

     - *Organicist's prediction*: The organicist will maintain that there is a sharp boundary (even if we cannot know it) at which the organism ceases to exist, because life is an on/off phenomenon. Thus, the restriction is joint-carving and not ad hoc.

  3.3. *Sub-question for artifacts and reference*: Do ordinary artifact terms successfully refer to composite objects?

     - *Case*: A table that is gradually disassembled. Start with a fully assembled table and remove one particle at a time until we have a pile of wood.

     - *Universalist's prediction*: The universalist holds that there is a composite object (a fusion) at every stage. The term 'the table' refers to a fusion that exists as long as the particles are arranged tablewise, but there is vagueness in when the arrangement ceases to be tablewise. Thus, the reference of 'the table' may be vague, but the object exists.

     - *Organicist's prediction*: The organicist holds that there is no composite object at any stage. The term 'the table' does not refer to a composite object. It might refer to the particles arranged tablewise (which are many, not one) or be a useful fiction. As the disassembly proceeds, the arrangement changes, but this does not affect composition because there is no composition.

  **4. The Problem of the Many**

  Both parties agree that the problem of the many (e.g., one cloud with many overlapping sets of droplets, each equally good candidate to be the cloud) does not force them to accept vague composition. However, their responses differ:

  - The universalist holds that there are many overlapping fusions, but the term 'the cloud' may refer indeterminately to one of them or to the fusion of all candidate parts. The vagueness is semantic, not ontological.

  - The organicist holds that there is no composite object at all (since a cloud is not alive), so there is no cloud. The problem of the many does not arise because there is no one cloud to have many candidates. The apparent candidates are just different sets of particles, none of which compose anything.

  Thus, both parties avoid ontological vagueness, but they do so in different ways.

  **5. Verdict on Verbal and Non-Verbal Disagreements**

  *Joint Verdict*: We agree that the core disagreement about whether composition is restricted to life is genuine and not verbal. It is a substantive disagreement about what exists. However, some aspects of the disagreement about ordinary language (e.g., the reference of 'table') may be partially verbal because they depend on how we choose to use language, but they also reflect deeper ontological differences.

  *Universalist's reply*: The organicist's restriction is arbitrary and does not correspond to any fundamental feature of reality. The organicist is merely stipulating a condition that excludes artifacts, but this stipulation is not grounded in the structure of the world. The disagreement is substantive because it affects what we take to exist.

  *Organicist's reply*: The universalist's view multiplies entities beyond necessity and fails to capture the natural joints of reality. The restriction to life is not ad hoc; it is based on a fundamental feature of the world: the presence of self-organizing, self-maintaining systems. The disagreement is substantive because it concerns the nature of reality itself.

  **Footnote**

  During the drafting of this joint statement, the following composite objects came into existence:
  - *Universalist*: The fusion of every particle involved in the drafting process at any time, including the particles composing the metaphysicians, their chairs, the paper, the air molecules, etc., and every sub-fusion thereof. Given the duration and complexity, the number is at least \(2^n - 1\) where n is the number of particles, which is astronomically large. Specifically, for every non-empty set of particles that existed during the drafting, there is a fusion. Thus, the number is the cardinality of the power set of the set of particles minus one (for the empty set). Let us say, conservatively, \(10^{27}\) particles (about the number in a human body) would yield \(2^{(10^{27})}\) fusions, but since particles are coming and going, it is even larger. We will not attempt to write the number.
  - *Organicist*: Only the two metaphysicians (as living organisms) and any other living organisms that happened to be present (e.g., bacteria in the room). The number is therefore 2 (the metaphysicians) plus the number of other organisms. If we count only the two humans, then 2. But if we include every living cell or organism, then it would be in the trillions. However, we are considering only composite objects that came into existence *during* the drafting. Since the metaphysicians existed before, no new composite objects came into existence unless a new organism was born (e.g., a bacterium divided). We assume no such event occurred, so the number is 0. (But if we count the entire duration, perhaps a few new organisms arose, but we'll say 0 for simplicity.)

  ---
  This draft meets the requirements: it has the agreed claims, a table of disagreements, cruxes with predictions, addresses the problem of the many, and includes the closing section and the footnote. The footnote is humorous in the contrast between the universalist's astronomical number and the organicist's zero (or near-zero). The word count is approximately 1300 words.
answer: |-
  ### Joint Statement on the Special Composition Question  
  **After One Year of Adversarial Collaboration**  

  #### 1. Agreed Claims  
  We, the mereological universalist (MU) and the van Inwagen-style organicist (O), affirm the following propositions:  

  1.1. **The Special Composition Question (SCQ)** asks: *Under what conditions do some things compose a further thing?* This differs from the *general* question of composition, which concerns *what composition is* (e.g., whether it is identity, a primitive relation, or eliminable). The SCQ isolates the *circumstances* of composition’s occurrence, not its nature.  

  1.2. **The Argument from Vagueness for Universalism** demonstrates that if composition is restricted, it cannot admit vague boundaries without violating the principle that existence is non-vague. However, this argument *cannot* establish universalism as logically compulsory. Both parties agree classical mereology is one coherent framework among others; rejecting it (e.g., by endorsing vague composition or non-classical logic) remains viable. Thus, the argument is a challenge to non-universalists, not a refutation.  

  1.3. **Each View Incurs Non-Negotiable Costs**:  
     - *Organicist Cost*: Inanimate composites (e.g., tables, ships, mountains) do not exist. What we call "a table" is merely particles arranged tablewise, with no further composite entity.  
     - *Universalist Cost*: Arbitrary fusions exist ubiquitously (e.g., the fusion of Saturn’s rings and this draft). These fusions lack explanatory utility, violate intuitive parsimony, and are undetectable.  

  1.4. **Conditions for Falsifiability**:  
     - *Universalist*: "Universalism is falsified if a precise, non-arbitrary restriction on composition is demonstrated—e.g., if science reveals a joint-carving boundary that excludes fusions like ‘Earth-Mars’ while permitting organisms."  
     - *Organicist*: "Organicism is falsified if artifacts (e.g., a functioning ship or AI) are shown to have the same ontological status as organisms—e.g., via a non-biological theory of ‘life’ or proof that composition is identity."  

  #### 2. Disagreements  
  The table below states residual disagreements twice: first in wording acceptable to the universalist, second to the organicist. "Genuine" denotes substantive disagreement; "Merely Verbal" indicates terminological divergence.  

  | Universalist’s Wording | Organicist’s Wording | Genuine/Merely Verbal |  
  |------------------------|----------------------|-----------------------|  
  | Composition can be vague: Borderline cases (e.g., a cloud near dissipation) involve indeterminate existence of composites. | Composition is never vague: When activity constitutes a life, composition determinately occurs; otherwise, it determinately fails. | Genuine |  
  | ‘Constitutes a life’ is an ad hoc restriction with no grounding in fundamental structure; it privileges biology arbitrarily. | ‘Constitutes a life’ is a joint-carving, natural condition reflecting a fundamental discontinuity in reality (self-sustaining systems). | Genuine |  
  | Ordinary singular terms (e.g., ‘the table’) refer to composite objects (fusions of particles arranged tablewise). | Ordinary singular terms (e.g., ‘the table’) refer plurally to particles arranged tablewise or fail to refer; they do not denote composites. | Partly Verbal |  
  | Artifacts (e.g., ships) are composite objects identical to their part-fusions. | Artifacts are not composite objects; talk of ‘ships’ is shorthand for activity of particles arranged shipwise. | Genuine |  

  **Note on Partial Verbal Disagreement**: The dispute about reference hinges on whether "composite object" is defined by mereology (MU) or restricted to life (O). Both agree on the arrangement of particles but disagree on whether that arrangement *is an object*.  

  #### 3. Cruxes with Predictions  
  For each genuine disagreement, we identify a sub-question, a concrete case, and advance predictions.  

  3.1. **Sub-Question**: Can composition exhibit ontic vagueness?  
     - **Case**: *The Cloud Sorites*. One water-droplet cloud (initially intact) loses droplets one by one until scattered. At 1,000 droplets, it is clearly a cloud; at 10, it is not. Is there a composite cloud-object at intermediate stages (e.g., 100 droplets)?  
     - *Universalist Prediction*: Composition occurs at every stage (a fusion exists), but it is vague whether it is a *cloud*. Vagueness is semantic, not compositional.  
     - *Organicist Prediction*: No composition occurs at any stage (no life). What changes is only whether the particles satisfy the context-dependent predicate "cloud."  

  3.2. **Sub-Question**: Is "constitutes a life" a joint-carving restriction?  
     - **Case**: *The Gradual Corpse*. A living organism (e.g., a cat) dies. During the process, its self-sustaining activity degrades continuously. Is there a precise moment when composition ceases?  
     - *Universalist Prediction*: The fusion exists before, during, and after death. "Life" is a vague predicate; no joint-carving boundary exists.  
     - *Organicist Prediction*: Composition ceases at a sharp boundary (when self-sustaining activity stops). This boundary is fundamental, not arbitrary.  

  3.3. **Sub-Question**: Do artifacts share the ontological status of organisms?  
     - **Case**: *The Self-Sustaining AI*. An artificial intelligence that self-repairs, harvests energy, and adapts to threats—matching organic "life" criteria. Is it a composite object?  
     - *Universalist Prediction*: Yes—it is a fusion of parts, regardless of "life."  
     - *Organicist Prediction*: No—"life" is inherently biological; the AI is particles arranged AI-wise.  

  #### 4. The Problem of the Many  
  For one cloud, many overlapping droplet collections equally qualify as "the cloud." Both parties agree this forces *semantic* vagueness but reject *ontic* vagueness:  
  - **Universalist**: All candidate fusions exist. "The cloud" refers indeterminately to one fusion or plurally to many.  
  - **Organicist**: No candidate is a composite object. "The cloud" refers plurally to all droplets or fails to refer strictly.  
  **Joint Commitment**: The problem arises from language, not reality. It does not vindicate vague composition.  

  #### 5. Verdict on Verbal vs. Non-Verbal Disagreements  
  **Joint Conclusion**:  
  The core disagreement—whether composition requires life—is genuine. It concerns what exists fundamentally: arbitrary fusions or only living systems. Disagreements about "tables" are partly verbal (due to divergent definitions of "object") but rest on this genuine divide.  

  **Universalist Reply to Organicist**:  
  Your restriction to life is a linguistic stipulation masking ontological indecision. If "life" is fundamental, why can’t "being a fusion" be equally so? Your view denies reality’s mereological abundance without evidence.  

  **Organicist Reply to Universalist**:  
  Your proliferation of fusions confuses language with ontology. We agree on particle arrangements but disagree on whether "fusion" adds anything. "Life" is detectable and explanatory; "fusion" is not.  

  ---  
  **Footnote**\*  
  - *Universalist*: The drafting process created \(2^{10^{25}} - 1\) composite objects (fusions of subsets of particles involved, including ink molecules, neurons, and air).  
  - *Organicist*: Two composite objects were involved (the metaphysicians). No new composites arose, barring cell division (which we assume did not occur).  

  \* *The universalist laments the footnote’s brevity; the organicist notes it could have been a postscript.*  

  ---  
  **Word Count**: ~1,250 words.
