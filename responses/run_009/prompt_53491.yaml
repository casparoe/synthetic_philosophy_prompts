prompt: |-
  I teach a graduate seminar on ethical theory, and a student has produced an argument that, if sound, would show that Scanlon's contractualism cannot both retain its signature resistance to aggregation and permit the taxation that any modern state requires. I have been unable to locate the flaw to my own satisfaction, and I would like a careful, step-by-step diagnosis. Please write your response in American English.

  The argument runs as follows.

  (1) On Scanlon's contractualist test, an act or policy is impermissible if some principle permitting it could be reasonably rejected by at least one person, where a person has grounds for rejection when the permitted principle would leave that person worse off than the relevant alternative would.

  (2) Either the strength of a person's complaint is fixed independently of how the alternative principle treats other people, or it is not. If it is not—if my complaint can be weakened by the benefits a rival principle confers on third parties—then complaints are being weighed against one another across persons, and the contractualist has abandoned the individualist restriction that is supposed to distinguish the view from aggregative consequentialism. So if contractualism is to remain a distinct alternative to utilitarianism, the strength of each person's complaint must be fixed independently of the gains that the rejected principle's alternative distributes to others.

  (3) Consider a tax code that funds disability benefits, and consider Alice, a high earner with no disabled relatives who will never draw on those programs. The code is worse for Alice, all things considered, than its abolition would be: she pays more and receives nothing she would not otherwise have. By (2), the strength of her complaint is whatever it is regardless of how the revenue relieves others.

  (4) Since Alice's complaint is, by (2), insensitive to the benefits the code provides to others, a principle permitting the tax code could be reasonably rejected by her simply in virtue of the fact that the code is worse for her.

  (5) Every redistributive tax code is worse than its abolition for at least one taxpayer in Alice's position. So no redistributive tax code is permissible: the state may never tax some for the sake of others.

  (6) My student takes this to be a reductio of contractualism: either the view forbids the welfare state, or, to avoid that result, it must let the many beneficiaries' gains weaken Alice's complaint, at which point it has capitulated to aggregation and can no longer explain what it was supposed to explain.

  I am confident something slips between (3) and (4)—perhaps in the passage from "worse off for her" to "reasonably rejectable by her"—but I cannot state the diagnosis cleanly. Which premise or step should be rejected, and what does rejecting it cost? I would prefer to keep (1) and give up something in (2) through (4), but I want to know precisely what I am paying. If I allow others' benefits to weaken Alice's complaint, have I not simply conceded the aggregation the view exists to resist? And if being made worse off never suffices for reasonable rejection, what becomes of the contractualist explanation of why a surgeon may not harvest one healthy patient's organs to save five others—does that explanation not rely on exactly the independence of the victim's complaint that step (2) demands? Please identify the weakest step, explain why it initially appeared sound, and assess what each available rejection commits the contractualist to.
reasoning: |-
  Okay, let me approach this systematically. The professor presents a student's argument claiming Scanlon's contractualism can't simultaneously reject aggregation and permit necessary taxation, and wants a step-by-step diagnosis. 

  First, I need to fully grasp the argument's structure. It starts with Scanlon's core premise (1) about reasonable rejection based on being worse off. Then (2) presents a dilemma about whether complaints depend on others' gains. (3) applies this to Alice the taxpayer, (4) concludes she can reject the tax, (5) generalizes to all redistribution, and (6) frames it as a reductio.

  Hmm. The professor suspects the flaw is between (3) and (4), specifically in equating "worse for her" with "reasonably rejectable." That resonates - Scanlon explicitly says being worse off isn't sufficient for reasonable rejection. The student seems to overlook that contractualism requires evaluating principles from an impartial standpoint, not just individual disadvantage.

  Let me test this. In the organ harvesting case, the victim isn't just worse off - their burden involves violating bodily autonomy, which couldn't be justified to them personally. Whereas Alice's tax burden, while making her worse off financially, comes with reciprocal benefits of social cooperation that could be justified to her. 

  Ah! That's the key distinction. The student's argument in (2) oversimplifies by assuming all "worse off" situations are equal. But contractualism examines the nature of the burden within a system of mutual justification. Taxation's burden differs qualitatively from organ harvesting's violation.

  I should also note how (2) falsely dichotomizes: either complaints are absolutely independent or full aggregation. Scanlon occupies a middle ground where we consider whether burdens can be reasonably rejected given the alternatives, which involves comparing individual positions but not summing utilities.

  For the professor's concerns: Rejecting (4) preserves contractualism's anti-aggregation stance because we're not weighing gains against losses, but asking if the loss is unreasonable in context. Letting others' benefits inform justification isn't aggregation - it's assessing reciprocal fairness. The organ case still works because that burden couldn't be justified regardless of benefits.

  The cost is clarifying that "worse off" alone doesn't determine reasonable rejection - we must examine the burden's type and justifiability. This doesn't surrender to utilitarianism; it maintains the individualist focus while recognizing social interdependence.
answer: |-
  Your instincts are correct: the flaw occurs between (3) and (4), specifically in the move from "the tax code is worse for Alice" to "Alice can reasonably reject a principle permitting it." **Premise (4) is the weakest step and should be rejected.** Here’s a step-by-step diagnosis:

  ### **Why (4) Fails: The Missing Element of Reasonable Rejectability**
  Scanlon’s contractualism does **not** hold that being made worse off *alone* suffices for reasonable rejection. Premise (4) ignores Scanlon’s core requirement that rejection must be grounded in a complaint about the *nature* or *magnitude* of the burden *relative to available alternatives*, and whether that burden could be justified to the person bearing it. Crucially:
  - **"Worse off" ≠ "unreasonably burdened."** A policy may leave someone worse off without giving them grounds for reasonable rejection if the burden is (a) *necessary* for a broader system of cooperation, (b) *reciprocally beneficial* over time, or (c) *not disproportionate* compared to others’ sacrifices.
  - **The "standpoint of the person" is not isolated.** While (2) correctly states that the *strength* of Alice’s complaint isn’t weakened by others’ gains (anti-aggregation), it doesn’t follow that her complaint exists in a vacuum. Contractualism evaluates whether a burden is *reasonable to impose* given the alternatives, which requires assessing if it could be justified *to her* as part of a fair system.

  ### **Why This Preserves the Anti-Aggregation Commitment**
  Rejecting (4) **does not** require conceding to aggregation. Here’s why:
  1. **No weighing of gains against losses:** We do not "weaken" Alice’s complaint by summing others’ benefits. Instead, we ask whether her burden is *unreasonable* when viewed against the background of a mutually justifiable scheme.  
     - *Example:* Alice’s taxes fund roads she uses, courts that protect her property, and police that ensure her safety. Abolishing taxation would leave her *worse off* in a Hobbesian state of nature. The tax is not a "pure loss" but a reciprocal contribution.  
  2. **The organ harvesting contrast:** In the surgeon case, the victim’s burden (death) is *categorically unreasonable* because it violates their basic rights and cannot be justified to them as part of any generalizable principle. Alice’s burden (tax payment) is *contingently reasonable* because it sustains institutions from which she benefits and could not reasonably demand exemption from while accepting their benefits.

  ### **What Rejecting (4) Costs the Contractualist**
  - **Cost 1:** Contractualism must clarify that "worse off" is necessary but insufficient for rejection. A burden must also be **arbitrary, gratuitous, or unfairly imposed** to ground reasonable rejection.  
  - **Cost 2:** Contractualists must engage in **contextual judgment** about which burdens are "reasonable" within a system of mutual cooperation. This risks vagueness but is inherent to Scanlon’s framework (e.g., *What We Owe to Each Other* §5.3).  
  - **Cost 3:** It requires accepting that **individual complaints are assessed within a social framework**. However, this is *not aggregation* because we never sum welfare gains/losses; we only ask if the burden *itself* is unreasonable when alternatives are considered.

  ### **Why the Other Premises Stand (with Caveats)**
  - **(1) is correct** as a basic statement of Scanlon’s test.  
  - **(2) is mostly sound:** The *strength* of Alice’s complaint *is* fixed independently of others’ gains (anti-aggregation). But (2) errs by implying that complaint-strength alone determines rejectability. It does not; we must also ask *whether the complaint targets a genuine injustice*.  
  - **(3) is true descriptively** but misleading: Alice *is* worse off financially, but this ignores the indirect benefits of living in a stable society.  
  - **(5) and (6) collapse** once (4) is rejected. Taxation *can* be permissible if no one bears an unreasonable burden relative to the alternatives.

  ### **How to Explain This to Your Student**
  > "Alice *can* complain she is financially worse off under the tax code. But to reasonably reject it, she must show this burden *could not be justified to her* as part of a fair system. Given that abolishing taxation would make everyone (including Alice) profoundly worse off, and that her burden is proportionate and reciprocal, her complaint lacks the normative force to ground rejection. This doesn’t ‘weaken’ her complaint with others’ gains; it shows her burden isn’t unreasonable in the first place. The organ harvesting victim, by contrast, suffers a non-reciprocal, rights-violating harm that *couldn’t* be justified to them under any general principle."

  ### **In Summary**
  - **Flaw:** (4) equivocates between "worse off" and "unreasonably burdened."  
  - **Fix:** Reject (4). Ground reasonable rejectability in *unjustifiable burdens*, not mere disadvantage.  
  - **Anti-aggregation preserved:** Complaints aren’t weighed; we ask if a burden is *intrinsically unreasonable* within a cooperative scheme.  
  - **Cost:** Contractualism must articulate what makes burdens "reasonable" (e.g., reciprocity, necessity, fairness), but this is a feature, not a bug, of Scanlon’s view.  

  This retains contractualism’s signature resistance to aggregation while permitting redistributive taxation, so long as no individual bears a burden that could not be justified to them as part of a mutually beneficial system.
