  Okay, the user runs a nonpartisan voter engagement group for first-time voters disillusioned with all parties. They need a quiz that reveals underlying voting philosophies through concrete scenarios—not abstract slogans. The goal is to help people understand their own views and reduce talking-past-each-other moments.  

  First, I need to cover the core voting theories they mentioned: consequentialist (voting only if it affects outcomes), civic duty (voting as obligation), expressive (voting to voice values), tactical lesser-evil (pragmatic harm reduction), protest/spoiling (rejecting all options), and compulsory voting support. The user suggested specific scenarios—landslide districts, awful candidates, third-party vs. major party dilemmas, protest abstention, the "one vote doesn’t matter" counterargument, and compulsory fines—so I’ll build around those.  

  For question design, each scenario must force a trade-off:  
  - **Landslide district**: Tests if someone votes despite zero outcome impact (duty/expressive) or skips (consequentialist).  
  - **Awful candidates**: Choosing "least bad" (tactical) vs. spoiling (protest) vs. staying home (could be consequentialist or apathy).  
  - **Third-party vs. major party**: Sincere preference (expressive) vs. preventing a worse win (consequentialist/tactical).  
  - **Protest abstention**: Explicitly frames non-voting as a statement.  
  - **Friend’s "pointless vote" argument**: Reveals if someone believes in aggregate duty (civic) or peer influence (expressive/consequentialist).  
  - **Compulsory voting**: Directly probes if voting is seen as a collective obligation.  

  I’ll add two more diagnostics:  
  1. **"Wasted vote" argument in a swing state** to separate expressive voters (who reject the premise) from tactical ones.  
  2. **Last-minute polling shift** to test flexibility—does someone stick to principles or switch to influence outcomes?  

  Crucially, I need to flag where theories overlap. Expressive and sincere third-party voting will likely cluster—both prioritize authenticity over outcomes. To split them, I’d need a scenario where expressive voting *harms* a preferred outcome (e.g., "Voting for your true favorite in a close race risks splitting the vote and electing your worst enemy"), but that might overcomplicate the quiz. For simplicity, I’ll note the overlap in scoring.  

  Scoring will map answers to positions:  
  - Mostly A’s = Consequentialist  
  - Mostly B’s = Civic duty  
  - Mostly C’s = Expressive/sincere  
  - Mostly D’s = Tactical  
  - E’s = Protest  
  - F’s = Compulsory supporter  

  I’ll avoid impossible combinations (e.g., loving compulsory voting *and* thinking voting is pointless) and note rare ones (e.g., tactical voters who also spoil ballots).  

  The quiz must work on paper, so no branching logic—just clear options and a scoring key. User examples will feel real: "boring" safe seats, "sleazy" candidates, friends shrugging about futility. Keeping it accessible for disillusioned first-time voters is key.
answer: |-
  Here's a "Voting Philosophy Revealer" quiz designed to diagnose underlying views through concrete scenarios. It avoids labels and focuses on choices, with scoring for 6 core positions.

  ---

  ### **The Voting Philosophy Revealer Quiz**
  **Instructions:** For each scenario, pick the answer **closest** to your gut reaction. Don’t overthink it!

  1.  **Your district always elects Candidate X by huge margins. Polls show this year is no different. You find X mediocre but harmless. Do you:**  
      A) Skip voting. Your vote literally won’t change anything here.  
      B) Vote anyway. Showing up is what matters, even if the result is certain.  
      C) Vote for a minor candidate you actually like, even if they get 1%.  

  2.  **The mayoral ballot has two front-runners. You think Candidate A is corrupt, and Candidate B is incompetent. Both seem genuinely bad. Do you:**  
      A) Stay home. Why endorse *any* of this mess?  
      B) Hold your nose and vote for the one you think is *less* damaging.  
      C) Write in a joke candidate or deliberately spoil your ballot as a protest.  

  3.  **You *love* the policies of the small "Green Future" party. But polls show they have 0% chance of winning. The major parties are "Grey Party" (you dislike them) and "Black Party" (you *really* dislike them). Do you:**  
      A) Vote "Green Future." Principles matter more than winning.  
      B) Vote "Grey Party." Beating the "Black Party" is too important to risk.  
      C) Don't vote. None deserve support; adding to low turnout sends a message.  

  4.  **A friend says: "Voting is pointless. One vote never decides an election. Why waste time?" You disagree, but why?**  
      A) "If everyone thought that, democracy collapses. We all need to chip in."  
      B) "Close elections *do* happen! Your vote could be the one that tips it."  
      C) "It’s not about winning. It’s about showing what you stand for."  

  5.  **Imagine voting was **compulsory** (mandatory) with a small fine (like $20) if you don't vote (like in Australia). Do you:**  
      A) Strongly oppose. Forced voting is undemocratic and punishes dissent.  
      B) Support it. Higher turnout makes results more legitimate and representative.  
      C) Feel conflicted. It might force engagement, but the fine seems unfair.  

  6.  **A crucial swing-state election is neck-and-neck. You prefer Candidate Pine, but they're polling a distant 3rd. Someone says voting for Pine is "wasting your vote." You think:**  
      A) "They're right. Voting Pine helps no one and might let the worst candidate win."  
      B) "Wrong! Voting Pine shows real support for their ideas, even if they lose."  
      C) "It depends. If Pine *could* win, I'd vote for them. But here? Maybe not."  

  7.  **Election Day arrives. You planned to vote for Candidate Oak. Just before going, you see a trusted poll showing Oak losing badly in your district (by 15 points). Do you:**  
      A) Skip it. Knowing Oak can't win changes things; my vote won't help.  
      B) Still vote for Oak. My commitment is to them, not just the horse race.  
      C) Quickly rethink: Maybe vote for the most acceptable front-runner instead?  

  8.  **A local ballot measure proposes something you mildly support. It's expected to pass easily without your vote. Do you:**  
      A) Skip it. My vote isn't needed for this outcome.  
      B) Vote "Yes." It's my duty to weigh in on every issue.  
      C) Vote "Yes," mainly to signal broader support for this type of policy.  

  ---

  ### **Scoring Key**
  Tally how many times you picked each letter (A, B, C). Your **predominant letter(s)** reveal your core voting philosophy:

  *   **Mostly A's: The Consequentialist / Instrumental Voter**  
      You believe votes only matter if they *change the outcome*. You focus on probabilities and stakes. Close races? Vote strategically. Landslides or hopeless causes? Save your time. Abstaining or voting third-party in swing seats seems irrational. (May align with Q1A, Q3B, Q4B, Q6A, Q7A, Q8A).

  *   **Mostly B's: The Civic Duty Voter**  
      Voting is a fundamental obligation of citizenship, like jury duty. Showing up matters for its own sake – for legitimacy, habit-building, and honoring the system. Winning isn't the only point; participation is. You likely support compulsory voting. (May align with Q1B, Q4A, Q5B, Q7B, Q8B).

  *   **Mostly C's: The Expressive / Sincere Voter**  
      Voting is primarily about **expressing your true beliefs and values**, regardless of the outcome. It's a personal statement. You prioritize authenticity over strategy ("vote your conscience"). Protest votes/spoiling make sense to you. Third parties are appealing. (May align with Q1C, Q3A, Q4C, Q6B, Q7B, Q8C).  
      **Note:** This view strongly overlaps with Sincere Third-Party Voting. The quiz struggles to fully separate them. Q6 (the "wasted vote" argument in a close race) is the best differentiator: Pure Expressives (B) reject the premise, while Sincere Third-Party voters might waver (C).

  *   **Strong D Showing (Tactical Lesser-Evil Voter - *Derived Position*)**  
      While not a primary letter, consistently choosing **strategic options to prevent a worse outcome** (especially Q2B, Q3B, Q6A, Q7C) signals this. You prioritize harm reduction over ideals or duty. You're outcome-focused but accept the need for compromise. (Overlaps significantly with Consequentialism).

  *   **Strong E Showing (Protest / Rejector - *Derived Position*)**  
      Choosing protest abstention or spoiling (Q2A, Q2C, Q3C) signals deep disillusionment. You see voting as endorsing a corrupt system or bad choices. Non-participation *is* your expressive act. (Overlaps with expressive views but emphasizes rejection).

  *   **Compulsory Voting Supporter:** Primarily revealed by Q5B. Civic Duty voters (Mostly B's) are most likely here, but others might support it for systemic reasons (e.g., Consequentialists hoping for better aggregate outcomes).

  ---

  ### **Important Notes on Combinations & Rarities**

  1.  **Expressive (C) vs. Sincere Third-Party:** As noted, these largely merge. Q6 is the key differentiator. A pure Expressive voter picks B ("Wrong! It's about showing support"). Someone more open to strategy *might* pick C ("It depends..."). A harder question separating them could be: *"If voting for your true favorite in a close race helped elect your* ***worst*** *enemy, would you still do it?" (Yes=C/Expressive, No=More Tactical/Sincere-but-pragmatic).*
  2.  **Conflict: Consequentialist (A) + Civic Duty (B):** These often pull in opposite directions (e.g., Q1, Q7, Q8). Someone picking both frequently might be conflicted or context-dependent ("Duty where it's easy, skip where it's futile").
  3.  **Rare/Incoherent:**
      *   **Consequentialist (A) + Compulsory Supporter (Q5B):** Forcing pointless votes contradicts the "only vote if it matters" logic. Unlikely.
      *   **Civic Duty (B) + Protest Spoiling (Q2C):** Spoiling rejects the duty's premise of respectful participation. Unlikely.
      *   **Strongly Consequentialist (A) + Strongly Expressive (C):** These cores clash fundamentally (outcomes vs. expression). Very rare/unstable.
  4.  **Tactical (D) & Protest (E):** These are derived patterns, not primary cores. Most Tactical voters stem from Consequentialism. Most Protest voters stem from Expressiveness or deep rejection.

  ---

  **How to Use:** Print the quiz, have people circle answers, tally their A/B/C counts, then use the key. Discussing *why* answers reveal the underlying philosophies helps people understand their own views and others' perspectives, cutting through slogan-based arguments.
