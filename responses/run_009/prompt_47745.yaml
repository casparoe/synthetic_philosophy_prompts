answer: |-
  The established concept is **verisimilitude** (truthlikeness), primarily developed by Karl Popper and refined by philosophers like Ilkka Niiniluoto and Graham Oddie.

  **Standard Claims:**
  *   Verisimilitude aims to capture the intuition that one false theory (T1) can be *closer to the truth* than another (T2). Newtonian mechanics has higher verisimilitude than "planets move in straight lines."
  *   Quantitative formulations often define a *distance measure* between possible worlds/states of affairs described by a theory and the actual world/truth. Newton's state space is much "closer" to Einstein's than the straight-line theory's space is.
  *   For numerical predictions, closeness is measured by the *size of the error* (e.g., 43 arcseconds vs. predicting no precession at all). Theories making many approximately true predictions have higher verisimilitude.

  **The Re-description Problem:**
  This is the core challenge. If we can freely redescribe the theory's variables (e.g., measuring position vs. 1/position), distances can distort arbitrarily, making near hits look like misses and vice versa. This threatens the objectivity of verisimilitude.

  **Responses & Limitations:**
  1.  **Fixed Vocabulary:** Definitions often assume a privileged, "natural" vocabulary reflecting the world's structure. Closeness is defined relative to this ontology. This is controversial, as identifying the "correct" ontology is difficult.
  2.  **Structural Similarity:** Focus on the *structure* of the theory (e.g., the mathematical form of equations) matching the true theory, not just numerical values under any description. Newton and GR share differential equations describing curvature; the straight-line theory does not.
  3.  **Content & Truth Content:** Popper suggested comparing the sets of *true consequences* (truth content) and *false consequences* (falsity content). T1 has higher verisimilitude than T2 if T1's truth content includes T2's and T1's falsity content is included in T2's. This avoids metrics but faces logical paradoxes (e.g., Miller-Tichý proof showing it often collapses, making all false theories incomparable).
  4.  **Domain Specificity:** Verisimilitude judgments are often domain-relative. Newton has high verisimilitude *within its domain of medium speeds and scales* but low verisimilitude concerning Mercury's orbit or high speeds. This avoids global comparisons.

  **Worked Results & Coherence:**
  *   Niiniluoto's "similarity" approach using weighted distances between constituents in a propositional language provides a formal framework but depends critically on the chosen language/metric.
  *   Oddie's "likeness" approach also uses distance measures. While formally coherent within their frameworks, the dependence on language choice and metric remains problematic.
  *   **Consensus:** No single definition is universally accepted. The re-description problem is serious; verisimilitude is generally considered *language-dependent*. However, within a contextually fixed, relevant vocabulary (e.g., standard physical variables), meaningful comparisons *are* possible and useful.

  **Scope & Boundaries:**
  *   **Qualitative Theories:** Verisimilitude applies, but comparisons are harder. Focus shifts to structural similarity (e.g., shared causal relations) or truth/falsity content (e.g., does T1 entail more true qualitative statements than T2?).
  *   **Wrong Ontology:** A theory with fundamentally wrong entities (e.g., phlogiston) but approximately correct predictions has *instrumental* value but likely low verisimilitude. Accurate predictions arising from wrong ontology are often seen as lucky coincidences, not reflecting closeness to the *deep structure* of truth.

  **Changing the Verdict:**
  A successful definition must:
  1.  **Survive Re-description:** Be demonstrably invariant (or robust) under *reasonable* changes of theoretical representation.
  2.  **Handle Qualitative Cases:** Provide a non-arbitrary basis for comparing non-quantitative theories.
  3.  **Avoid Paradoxes:** Resolve issues like the Miller-Tichý problem for content-based approaches.

  **The Familiarity Challenge:**
  If it could be shown that judgments of "nearness" (e.g., Newton feels closer than Lorentz) track *only* historical familiarity, predictive utility within a limited domain, or aesthetic preference, *not* any objective structural or content-based relation to the deeper truth, then verisimilitude would be an illusion. Successfully defining verisimilitude requires showing it captures something more substantial.
