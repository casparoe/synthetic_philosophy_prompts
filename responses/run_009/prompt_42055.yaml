  **Joint Statement by the Pragmatic Encroacher and the Epistemic Purist**

  After a year of debate and adversarial collaboration, we have reached the following joint statement.

  ### 1. Agreements

  We, the pragmatic encroacher and the epistemic purist, agree on the following:

  1.1 **Shared Stock of Cases and Intuitions**:
     a) Bank-style cases (e.g., DeRose 1992, Stanley 2005) present a pattern of intuitive judgments: when a subject has evidence sufficient for knowledge in a low-stakes situation (e.g., a customer with a small check who can afford to be wrong about the bank being open on Saturday), we are inclined to say the subject knows; when the same evidence is held by a subject in a high-stakes situation (e.g., a customer with a large check who will face disaster if the bank is closed), we are inclined to deny knowledge.
     b) Lottery propositions (e.g., having a lottery ticket with a very low chance of winning) elicit the intuition that one does not know one will lose, even when the probability of losing is extremely high.

  1.2 **What an Adequate Theory of Knowledge Owes**:
     - Any adequate theory of knowledge must either explain the intuitive judgments in these cases (by showing how they are correct) or explain them away (by showing why they are mistaken in a way that is consistent with the theory).
     - Any adequate theory must account for the role of knowledge in governing action and assertion. Specifically, it must engage with the idea that knowledge is the norm of assertion and that knowledge is the basis for rational action (e.g., the knowledge norm of practical reasoning).

  1.3 **What the Dispute Does Not Turn On**:
     - We agree that practical factors can affect the rationality of action and assertion. The dispute is not about whether stakes affect what it is rational to do or assert; we both accept that they do. The dispute is about whether these practical factors also affect knowledge itself.
     - We agree that the intuitive judgments in the bank and lottery cases are robust and must be addressed by any complete theory of knowledge.
     - We agree that knowledge is a central epistemic concept and that it requires truth, belief, and some form of justification or warrant (though we may disagree on the nature of that warrant).

  ### 2. Disagreements

  The following table presents our key disagreements. Each row states the same issue from both perspectives, in terms acceptable to each side.

  | Issue | Pragmatic Encroacher's Statement | Epistemic Purist's Statement |
  |-------|----------------------------------|------------------------------|
  | **Effect on Knowledge** | Practical stakes can affect whether a subject knows a proposition, even when the subject's evidence, reliability, and the truth of the belief remain fixed. Thus, knowledge is not purely a matter of epistemic factors; it is sensitive to the practical context. | Knowledge is determined solely by epistemic factors (evidence, reliability, truth, and other truth-conducive factors). Practical stakes do not affect whether a proposition is known; they affect only the practical rationality of acting on a belief. |
  | **Effect on Assertion/Action** | The effect of stakes on warranted assertion and action is directly explained by the effect of stakes on knowledge. Because knowledge is the norm of assertion and practical reasoning, when stakes rise and knowledge is lost, assertion and action based on that belief become unwarranted. | Practical stakes affect the warranted assertability of a proposition and the rationality of acting on it, but this is because the cost of error affects the required level of confidence for rational action/assertion, not because knowledge itself is affected. Knowledge remains invariant and is not the sole norm governing assertion and action. |
  | **Status of Bank Case Intuitions** | The intuition that the low-stakes subject knows and the high-stakes subject does not is a datum that any adequate theory must explain, and it directly reflects the stake-sensitivity of knowledge. These intuitions are veridical. | The intuition that the low-stakes subject knows and the high-stakes subject does not is an artifact of conflating knowledge with the practical rationality of acting on that knowledge. A correct theory of knowledge must explain why we have these intuitions (e.g., by appeal to the varying stakes affecting what actions are rational) without endorsing them as true of knowledge. |

  ### 3. Cruxes

  We have constructed two novel cases to test our views. For each, we describe the case, state the test, record our predictions, and note what pattern of lay judgments would count as evidence against our own view.

  #### Crux 1: The Indemnified Inspector

  **Case Description**: 
  A quality inspector works for a firm. She is fully indemnified: if she approves a defective product, she suffers no personal cost (her employer covers all penalties, and her job is secure regardless). Her compensation does not depend on the outcome. However, the downstream costs to the firm vary: in Scenario A (low stakes), the product is a cheap toy and a defect would cause minor financial loss; in Scenario B (high stakes), the product is a medical device and a defect would cause massive harm (lawsuits, reputational damage, etc.). The inspector has the same evidence in both scenarios (e.g., test results that are 99% reliable) and is considering the proposition that the product is safe.

  **Test Question**: 
  Does the inspector know that the product is safe in Scenario A? In Scenario B? Or does her knowledge depend on the stakes (and if so, which stakes: the firm's or her own)?

  **Predictions**:
  - **Pragmatic Encroacher**: The inspector's knowledge is affected by the firm's stakes. In Scenario A (low stakes), she knows; in Scenario B (high stakes), she does not. The high cost of error for the firm raises the epistemic standards for knowledge, even though her personal stakes are null.
  - **Epistemic Purist**: The inspector's knowledge is unaffected by the stakes. If the evidence is sufficient for knowledge in Scenario A, it is sufficient in Scenario B. Her personal stakes are null and the firm's stakes are irrelevant to her epistemic standing. She knows in both scenarios.

  **What would count as evidence against each view?**:
  - Against the Encroacher: If lay judgments indicate that the inspector knows in the high-stakes scenario (Scenario B) at a rate similar to the low-stakes scenario (Scenario A), this would challenge the encroacher's claim that the firm's stakes affect knowledge.
  - Against the Purist: If lay judgments indicate that the inspector does not know in the high-stakes scenario (Scenario B) but does know in the low-stakes scenario (Scenario A), and this difference is robust, this would challenge the purist's claim that knowledge is stake-invariant.

  #### Crux 2: Stakes-Blind Variant

  **Case Description**:
  A subject, Sarah, is about to deposit a check at her bank. Unbeknownst to her, the check is very large and must clear by tomorrow to avoid financial ruin (actual stakes are high). However, Sarah has been misinformed by a reliable friend that the check is small and there is no urgency (she reasonably believes the stakes are low). She has the same evidence about the bank's hours as in a standard low-stakes case (e.g., she was at the bank last Saturday, the hours haven't changed, etc.). She believes the bank will be open tomorrow.

  **Test Question**: 
  Does Sarah know that the bank will be open tomorrow? Or does her knowledge depend on the actual stakes (which are high), her believed stakes (which are low), or the expected costs of acting on error (which are low because she believes the stakes are low)?

  **Predictions**:
  - **Pragmatic Encroacher (objective stakes version)**: Knowledge is affected by the actual practical context. Therefore, even though Sarah reasonably believes the stakes are low, the actual high stakes mean she does not know the bank will be open.
  - **Epistemic Purist**: Knowledge depends only on Sarah's evidence and the truth of the proposition. Her belief about the stakes does not affect her knowledge, and the actual stakes do not either. Since her evidence is the same as in the low-stakes case (where we judged she knows), she knows in this case too.
  - *Note: The encroacher in this collaboration holds an objective stakes view. If we were to include a subjectivist encroacher, they might say she knows. But we are sticking to the objective version for this test.*

  **What would count as evidence against each view?**:
  - Against the Encroacher (objective): If lay judgments indicate that Sarah knows (because she reasonably believes the stakes are low), this would challenge the objective encroacher's claim that actual stakes determine knowledge.
  - Against the Purist: If lay judgments indicate that Sarah does not know (because the actual stakes are high, even though she is unaware of them), this would challenge the purist's claim that knowledge is invariant to stakes.

  ### Verbal Disagreement

  We agree that part of our residual dispute might be verbal. Specifically, we might be using the term "knowledge" with different standards. The encroacher holds that the concept of knowledge is inherently practical, so that the same evidence can yield knowledge in one practical context but not in another. The purist holds that the concept of knowledge is purely epistemic, and any practical effects are due to the norms governing the use of knowledge. However, we do not take this verbal difference to dissolve our substantive disagreement. We still disagree about whether the epistemic standing of a subject (i.e., whether the subject's belief is justified to a degree sufficient for knowledge) can be affected by non-epistemic factors such as practical stakes. We also disagree about the correct account of the bank and lottery intuitions: whether they reveal a truth about knowledge or a confusion about the practical demands on action and assertion.

  This joint statement represents our current consensus and the points we will test empirically. We commit to revising our views in light of the evidence gathered from the crux cases.

  Signed,
  [Pragmatic Encroacher]
  [Epistemic Purist]
answer: |-
  ## Joint Statement: Pragmatic Encroachment and Epistemic Purism  

  ### 1. Agreements  
  Both signatories endorse the following claims:  

  **(1.1) Shared stock of cases and patterns**  
  - **Bank cases**: In standard bank-deposit scenarios (e.g., DeRose 1992), where two subjects possess identical evidence about a bank’s Saturday hours but face differing costs of error (low stakes: minor inconvenience; high stakes: financial ruin), we agree that:  
    - (i) Intuitive judgments robustly ascribe knowledge to the low-stakes subject but deny it to the high-stakes subject.  
    - (ii) These judgments persist even when evidence strength (e.g., a prior visit) is held fixed.  
  - **Lottery propositions**: For lottery-style cases (e.g., "I will lose the lottery with odds 1:1,000,000"), we agree that:  
    - (i) Near-certain probabilistic evidence (short of 100%) fails to support knowledge ascriptions, despite meeting justification thresholds for action in low-stakes contexts.  
    - (ii) This gap between statistical certainty and knowledge cannot be reduced to psychological error.  

  **(1.2) What any adequate theory of knowledge owes**  
  - It must either **explain** the bank-case intuitions (treating them as data) or **explain them away** (treating them as artifacts) in a principled manner.  
  - It must account for the **functional role of knowledge** in norms of assertion, practical reasoning, and action (e.g., Williamson’s knowledge norm of assertion).  
  - It must resolve the **lottery paradox** without ad hoc maneuvers.  

  **(1.3) What the dispute does *not* turn on**  
  - Whether practical stakes affect the *rationality of action* or *warranted assertability* (we agree they do).  
  - Whether epistemic justification has pragmatic components (e.g., responsibilities in inquiry).  
  - Whether "knowledge" is a natural kind or a folk concept.  
  - Whether contextualism about "knows" is true (both allow invariantist interpretations).  

  ---

  ### 2. Disagreements Table  
  Each disagreement is stated twice: first in terms acceptable to the pragmatic encroacher ("Encroacher-Sanctioned"), then in terms acceptable to the epistemic purist ("Purist-Sanctioned").  

  | **Issue** | **Encroacher-Sanctioned Statement** | **Purist-Sanctioned Statement** |
  |-----------|-------------------------------------|--------------------------------|
  | **Effect on knowledge** | Practical stakes partly constitute the epistemic standards for knowledge: identical evidence yields knowledge in low-stakes contexts but not high-stakes ones. | Knowledge is determined solely by truth-conducive factors (evidence, reliability, etc.); practical stakes affect only downstream practices like action, not knowledge itself. |
  | **Effect on assertion/action** | Stakes affect warranted assertion *because* they alter knowledge: one may assert *p* only if one knows *p*, and knowledge is stake-relative. | Stakes affect warranted assertion *independently* of knowledge: knowledge is invariant, but stakes raise the required justification threshold for rational assertion/action. |
  | **Status of bank-case intuitions** | The asymmetric knowledge ascriptions in bank cases reflect a genuine stake-sensitivity in knowledge and are primary data for theory-building. | The asymmetric knowledge ascriptions in bank cases are illusions stemming from conflation with practical rationality; they are artifacts to be debunked by a proper epistemic theory. |

  ---

  ### 3. Cruxes  
  We jointly designed two novel cases. For each, we specify:  
  - The testable question.  
  - A mutually agreed empirical test (e.g., surveys of lay judgments).  
  - Predictions from each side.  
  - What evidence would falsify *their own* view.  

  #### **Crux 1: Indemnified Inspector**  
  **Case**: A quality inspector evaluates products. Her employer fully insures her against consequences: no personal cost for errors, no reward for accuracy. Downstream costs to the firm vary:  
  - **Scenario A (low stakes)**: Defective product causes minor profit loss.  
  - **Scenario B (high stakes)**: Defective product causes massive liability (e.g., safety hazard).  
  *Evidence and truth conditions are identical in both scenarios.*  

  **Test question**:  
  > *Does the inspector know the product is safe?*  

  **Agreed test**: Measure lay knowledge ascriptions in Scenarios A vs. B.  

  | **View** | **Prediction** | **Falsifying Evidence** |
  |----------|----------------|-------------------------|
  | **Encroacher** | Knowledge ascriptions will track the *firm’s* stakes: "knows" in A, not in B. | If ascriptions do *not* vary with the firm’s stakes (e.g., "knows" in both A and B). |
  | **Purist** | Knowledge ascriptions will track *null personal stakes*: "knows" in both A and B. | If ascriptions *vary* with the firm’s stakes (e.g., "does not know" in B). |

  #### **Crux 2: Stakes-Blind Variant**  
  **Case**: Alex is depositing a check. *Actual stakes* are high (error = financial ruin), but Alex *reasonably believes* stakes are low (error = trivial). She possesses evidence typically sufficient for knowledge in low-stakes bank cases (e.g., past attendance).  

  **Test question**:  
  > *Does Alex know the bank is open?*  

  **Agreed test**: Measure lay knowledge ascriptions given Alex’s belief (low stakes) vs. actual context (high stakes).  

  | **View** | **Prediction** | **Falsifying Evidence** |
  |----------|----------------|-------------------------|
  | **Encroacher** | Knowledge tracks *actual stakes*: Alex does *not* know (actual cost of error is high). | If ascriptions track Alex’s *believed stakes* (e.g., "knows" due to her belief). |
  | **Purist** | Knowledge tracks *evidence alone*: Alex knows (evidence is unchanged). | If ascriptions track *actual stakes* (e.g., "does not know" due to hidden costs). |

  ---

  ### Verbal Disagreement Diagnosis  
  We concur that **part of our dispute is verbal** but stress this does not dissolve the substantive disagreement:  
  - **Verbal element**: Whether "knows" semantically encodes stakes (encroacher) or whether stakes indirectly affect knowledge-attributing *practices* (purist).  
  - **Why verbal?** Both sides agree that "S knows *p*" is assertable only when epistemic and practical conditions align. We disagree on whether this reflects a semantic feature of "knows" (stakes as a parameter in knowledge) or a pragmatic feature of its use (stakes governing assertion, not knowledge).  
  - **Undissolved substance**: Whether the *epistemic standing* of a belief (its justification/status as knowledge) is modulated by non-truth-conducive factors (stakes) or solely by evidence/reliability.  

  ---  
  **Signed**,  
  *The Pragmatic Encroacher* & *The Epistemic Purist*  
  *Date: 25 October 2023*
