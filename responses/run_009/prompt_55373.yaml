prompt: |-
  I've been trying to work out what moral worth actually tracks, going by my gut on cases, and my gut is not cooperating. Cafe owner charges everyone fairly and never shorts the tourists, but only because he's figured out that shorting people kills repeat business — right action, but I want to say zero moral worth. Guy finds a wallet stuffed with cash and returns it, but only after he notices the lobby security camera — again, nothing. Same guy, different week, no camera anywhere, returns it because he can't stop picturing the owner's face when she realizes her rent money is gone — full moral worth, feels obvious. Then it gets messy. A woman gives a big chunk of her income to famine relief, feels nothing for the recipients at all, honestly kind of resents doing it, but does it from the settled judgment that it's required of her — part of me says this is the MOST worth of anything on this list, part of me says it's less than the wallet guy. The natural helper: helps everyone easily, takes visible pleasure in it, never has to override a single impulse — my gut says tons of worth, though I gather Kant would supposedly say little or none, which makes me suspect my gut is just wrong somewhere. Someone who only helps because otherwise the guilt would eat them alive — somewhere in between? Worse than the sympathetic wallet returner, better than the camera guy, but I couldn't tell you why. And a cold, rigid sort of person who keeps a promise at real cost to himself, not because he thinks "I ought" in any explicit way, but because breaking promises just isn't who he is — identity, not duty.

  A friend of mine has been pushing a framing on me and I can't decide if it helps. He says moral worth is basically a credit-attribution problem: the worth of the act is like the credit an architect gets for a beautiful cathedral, where you have to subtract out the thousand masons, the donors, the site conditions, the plain luck — moral worth is whatever residue of the goodness flows from the agent rather than from self-interest, external constraint, upbringing, or coincidence. On that picture the camera guy and the shopkeeper are clear (the goodness flows from the camera and the ledger, not from them), but I honestly can't tell whether the natural helper should come out high (the goodness flows from her, even if the flowing is easy) or low (her upbringing is doing the work, the way the masons did).

  So: is there a principle that captures my verdicts, or close? Does my freind's credit picture actually do the job, or does it silently mishandle one of my cases (the guilt one feels like trouble for it)? Say plainly which of my verdicts has to go, and why. Then run whatever principle you land on against some cases I haven't thought through: a person raised so gently they never even register temptation — do they ever act with moral worth, or is it like grading a fish on swimming; a soldier who throws himself on a grenade before any thought at all, pure reflex, deliberation arriving a second too late to matter; and whether a committee or a group can do something with moral worth, or whether worth only ever lands on members. I'd also like to know what your principle predicts about the guilt-driven case and the identity-driven promise-keeper, since those are the two where I'd actually change my mind if the argument was good.
reasoning: |-
  Okay, the user is grappling with the concept of moral worth, using various scenarios to test their intuitions. They've outlined cases like the cafe owner who acts fairly out of self-interest, the wallet returner motivated by a security camera, and others. Their friend suggested a "credit-attribution" model, comparing it to an architect's credit for a cathedral minus contributions from others. The user wants to know if there's a principle that captures their intuitions or if some verdicts need adjustment.

  First, I need to parse each case and the user's intuitive judgments. The cafe owner and camera-driven wallet returner have zero moral worth because their actions stem from external factors (profit, fear of being caught). The natural helper, who enjoys helping, gets high marks from the user, but Kant would disagree because it's not duty-driven. The famine relief donor acting out of duty but without empathy is ambiguous—part of the user sees high worth, part sees less. The guilt-driven helper is middle-ground, and the promise-keeper acting from identity is tricky.

  The credit-attribution model frames moral worth as the residue after subtracting external factors. It works for clear cases like the cafe owner (credit to self-interest) and camera guy (credit to surveillance). But for the natural helper, is credit due to her character or her upbringing? If upbringing is seen as external, credit might be low; if her character is intrinsic, it could be high. The user is unsure here. The guilt-driven case is problematic because guilt could be internal (part of moral sensitivity) or a selfish avoidance of discomfort. The identity-driven person might not consciously think of duty, so credit is unclear.

  The user's deeper need might be reconciling their intuitions with philosophical principles. They might want a coherent framework that doesn't discard their gut feelings but provides consistency. They also seek validation or correction of their judgments, especially in ambiguous cases like guilt and identity. Plus, they want to apply this framework to new scenarios (e.g., the gently raised person, the reflex soldier, group actions).

  Kant's deontology emphasizes duty and the motive behind actions. Moral worth comes from acting from duty, not inclination. So the natural helper, though good, lacks worth because their actions aren't duty-motivated. The famine relief donor acting from duty has high worth, despite lacking empathy. But the user feels conflicted here—part of them values the duty, part values the empathy in the wallet returner. This suggests a tension between deontological and virtue ethics.

  The credit model might need refinement. Upbringing could be subtracted if it's seen as external, but character traits might be part of the agent. However, Kant would argue that even character traits don't confer moral worth unless the action is done from duty. The guilt-driven person: if guilt stems from a sense of duty, it might have worth; if it's merely self-interest in avoiding discomfort, no. The identity-driven promise-keeper: if "who they are" is shaped by duty, it could align with moral worth; if it's just habit, no.

  For new cases: the gently raised person might act rightly but without overcoming temptation, so no moral worth per Kant. The reflex soldier—if reflex stems from ingrained duty, perhaps worth; if just instinct, no. Groups: only individuals can have moral worth, as groups lack intentions.

  The user might need to adjust their view on the natural helper (less worth) and the famine donor (more worth). The guilt case could go either way; if guilt reflects moral commitment, worth; if not, low. Identity case: if identity is duty-based, worth; else, not. The key is whether the action is done because it's right, regardless of other factors.
answer: |-
  Your struggle is profoundly human—moral worth resists tidy formulas because it lives in the messy intersection of action, motive, and character. Your gut verdicts align closely with **Kantian core insights** (though not rigid dogma), while your friend's "credit-attribution" model is a useful *metaphor* but **fails as a principle** when pressed. Here's a principle that preserves most of your intuitions:

  > **An act has moral worth when it's done *because it is morally required*, and the agent's commitment to morality *overrides or sustains* the action against countervailing inclinations, *even if those inclinations are absent*.**

  Now, let's dissect your cases with this principle:

  ### Your Cases Resolved
  1. **Cafe Owner (Profit Motive)**:  
     → *Your verdict: Zero worth* ✅  
     → *Why*: He acts *because it's profitable*, not because fairness is morally required. Profit overrides dishonesty, not morality overriding self-interest.

  2. **Wallet Returner (Security Camera)**:  
     → *Your verdict: Zero worth* ✅  
     → *Why*: The camera’s constraint (fear of exposure) drives the action. Moral duty plays no role.

  3. **Wallet Returner (Sympathy)**:  
     → *Your verdict: Full worth* ✅  
     → *Why*: Sympathy isn't the *moral* motive. **But**: If he returns it *because he believes it’s right*, and sympathy merely *fortifies* that commitment? Worth remains. If sympathy *alone* drives him? Worth diminishes. (Your gut likely assumes the former.)

  4. **Famine Relief Donor (Duty Without Empathy)**:  
     → *Your verdict: Ambivalent* → **Principle: HIGH worth**  
     → *Why*: She acts *because she judges it morally required*, overriding resentment. **This is Kant’s paradigm**: Moral worth shines brightest when duty conquers contrary inclinations.

  5. **Natural Helper (Pleasure in Helping)**:  
     → *Your verdict: High worth* → **Principle: LOW/NO worth** ✘ (Your gut must adjust here)  
     → *Why*: She acts from inclination (joy in helping), not *because it’s obligatory*. No moral effort or commitment is needed. **Kant is right**: This is "beautiful" but not morally worthy.

  6. **Guilt-Driven Helper**:  
     → *Your verdict: "In between"* → **Principle: DEPENDS**  
     → *Why*: If guilt stems from *violating a moral principle* (e.g., "I ought to help"), it has worth—duty overrode selfishness *via guilt*. If guilt is *merely self-focused* (e.g., "I’ll feel bad about myself"), it’s closer to self-interest. Worth is possible but fragile.

  7. **Identity-Driven Promise-Keeper**:  
     → *Your verdict: Unclear* → **Principle: HIGH worth**  
     → *Why*: "Who I am" can embody moral commitment. If his identity was forged by embracing promises *as moral duties*, it’s duty internalized. No explicit "ought" is needed—the commitment is real.

  ---

  ### Why the "Credit-Attribution" Model Fails
  Your friend’s framing is intuitive but ambiguous. **What counts as "external"?**  
  - ✅ *Works for*: Cafe owner (credit to profit), camera guy (credit to surveillance).  
  - ❌ *Fails for*:  
    - **Natural helper**: Is her upbringing "external" (like masons) or part of *her*? If "external," she gets zero credit—but this feels wrong, as her *character* is good. The principle above avoids this by focusing on *why she acts now*.  
    - **Guilt-driven helper**: Is guilt "external" (conditioning) or "internal" (moral residue)? Credit model can’t decide; the principle above looks for duty’s role.  
  - **Deeper flaw**: Credit implies a zero-sum pie ("subtract luck/upbringing"). But moral worth isn’t residual—it’s about the *reason for acting*. A saint raised well can still act *from duty*.

  ---

  ### New Cases Tested
  **1. Gently Raised Person (No Temptation):**  
  → *Principle*: **YES, moral worth possible**.  
  → *Why*: If she acts *because it’s right*, her ease doesn’t negate worth. No temptation to overcome? Her commitment sustains the action. (Grading a fish? No—she’s a moral agent acting for moral reasons.)

  **2. Soldier (Reflex Sacrifice):**  
  → *Principle*: **NO moral worth**.  
  → *Why*: Reflex ≠ moral commitment. If he acted *because it’s his duty to protect* and reflex embodied that commitment (e.g., drilled into him), worth *might* apply—but reflex alone is amoral. Deliberation arriving "too late" confirms: no moral moment.

  **3. Group/Committee Action:**  
  → *Principle*: **Moral worth lands ONLY on members, not the group**.  
  → *Why*: Worth requires individual commitment. If a committee donates to charity, worth depends on *each member’s reasons*. A "group motive" is fiction—only people have intentions.

  ---

  ### Verdicts to Revisit
  - **Adjust**: The **natural helper** has *no moral worth*. Her acts are admirable but not *morally* worthy—they lack duty’s backbone.  
  - **Affirm**: The **famine relief donor** has **high worth** (duty overriding resentment).  
  - **Clarify**:  
    - **Guilt-driven helper**: Worth *if* guilt expresses moral commitment (e.g., "I *should* feel guilty if I don’t help").  
    - **Identity promise-keeper**: Worth *if* his identity is built on moral duty (not just habit).

  ---

  ### The Core Tension
  Your gut values **empathy/sympathy** (wallet returner) and **effortless virtue** (natural helper)—leaning toward *virtue ethics*. But moral worth (as you intuit in the cafe/camera cases) is about **motive purity**, not outcomes or character. Hence the famine donor’s cold duty *must* trump the natural helper’s joy. 

  **Final refinement**: Moral worth tracks the **subjective adoption of moral law as your maxim**. When you act *because morality demands it*—whether through struggle, identity, or even guilt—that’s when you earn the credit. Anything else is luck or inclination.
