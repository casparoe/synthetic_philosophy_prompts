  Therefore, the deal is not safe.

  **Why it fails:** The assigned outcome for the party that yields is worse than the worst outcome in the default game. This is because the reputational cost makes yielding very costly, so much so that even the worst outcome in the default game (-10) is better than yielding (-12).

  **Minimal Modification:** The reputational cost was increased to 12 (from 0 in Scenario A). If we delete that modification (set cost=0), then we are back to Scenario A and the deal works.

  **Skeptic's Objection to Scenario A:** The safety guarantee assumes that the payoffs in the default game are fixed and known. But in reality, the very availability of the SPI deal might change the incentives upstream. For example, if firms know that such a deal is available, they might act more aggressively in the first place, knowing that they can always avoid the mutual disaster by signing the deal. This could change the default game to be more conflict-prone. Specifically, in Scenario A, without the deal, the firms might have played more cautiously to avoid (Tough, Tough). But with the deal available, they might play more aggressively, which could lead to a different default game. Thus, the payoffs of the default game that we used to design the deal might not be the same as the payoffs when the deal is available.

  In our construction, we did not consider that the availability of the deal might change the pre-deal behavior. The skeptic argues that the guarantee only holds if the default game is fixed and not affected by the existence of the deal. But in reality, the deal might change the default game. 

  However, in Scenario A, we assumed the default game is fixed. The SPI deal is signed before playing the game, so it might be that the default game is already set. But if the parties anticipate the deal, they might not play the default game without the deal in the same way. 

  This is a valid concern, but it is outside the scope of the SPI definition, which takes the default game as given. The SPI is defined for a fixed default game. So the skeptic's objection is that in practice, the default game is not fixed, but endogenous to the availability of SPI mechanisms. 

  ### Final Scenarios

  **Scenario A: Business Dispute (Low Reputational Risk)**
  - Default Game: Chicken as described with payoffs without reputational cost.
