  But if we try to enforce with a penalty, we run into the safety issue. For example, if we require a bond of 15 and penalize any firm that does not play the assigned action, then if a firm is assigned Yield and they comply, they get -12 (if the other is Tough) or -11 (if both yield). But in the deal, the other is assigned to be Tough, so if they comply they get -12. If they deviate, they get -10 (from (Tough, Tough)) but then penalized 15, so -25. This is worse than -10. But also, if they comply and the other is Tough, they get -12 which is worse than -10. So the deal is not individually rational? But the safety condition is about not being worse than the worst in the default game. The worst in default is -10. If they comply, they get -12 which is worse than -10. So the deal is not safe for the party assigned to Yield, even if they comply! 

  Therefore, the deal fails on safety grounds: when Firm B is assigned to Yield and complies, they get -12, which is worse than the worst in the default game (-10).

  So in Scenario B:

  **Default Game Payoffs (with high reputational cost, say 12):**

  ```
            Firm B
            Tough       Yield
  Firm A Tough   (-10, -10)   (5, -12)
          Yield   (-12, 5)      (-11, -11)   [if reputational cost even in mutual yield]
  ```

  But note: in the mutual yield, without reputational cost it was (1,1). With a cost of 12, it's (1-12, 1-12)=(-11,-11). 

  **SPI Deal:** Flip a fair coin to assign one to be Tough and the other to Yield. Enforced by an escrow agent requiring bonds and penalizing deviation. 

  **Safety Verification:**

