prompt: |-
  My friend and I spent basically all of last night fighting about religious arguments in politics and I want to capture where our two camps actually stand vs where we were just talking past eachother. I'm on the restraint side, roughly: legislators shouldn't ground coercive law in reasons only their co-religionists can accept — though I got fuzzy when she pushed me on whether that's a duty of the officeholder's role or something voters are under too, and honestly the translation requirement can start to look like telling religious people their reasons are second-class. She's an inclusionist: her best line was something like, you have to give public reasons after you win anyway, so why gag religious people beforehand — and she thinks the asymmetry is unfair because secular ideologues get to legislate straight from their comprehensive doctrines without anyone demanding translation. There's a concrete case we kept circling: a legislator votes for a housing bill and says openly that her church's teaching about the poor is her whole reason, offering no public rationale at all.

  Write the joint statement the two of us could actually sign. Sections in this order, please: "Agreed claims" (numbered, 6-10 of them, one or two sentences each — including anything both sides can say about the housing-bill legislator specifically), then a "Disagreements" table where each entry is worded neutrally enough that the side it's attributed to would accept the wording of its own view, then "Cruxes" — one per crux, with a concrete case or argument both sides would agree bears on it and each side's prediction written down. I suspect one crux is whether the restraint duty is a role duty for officeholders or a general civic one, and another is whether there's really any asymmetry between religious and comprehensive secular doctrines, but don't feel bound by those two. Finish with a short "What would move us" section on whether anything could actually change either side's mind.

  No citations or reading lists — I want to read this on a train, not follow up references. And if you think our framing is confused somewhere — like that the camps aren't really disagreeing about anything substantive, or that one of my premises is doing all the work — say that plainly instead of dutifully churning out the document. Around 800-1000 words total.
