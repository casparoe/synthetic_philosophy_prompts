prompt: |-
  I am preparing a seminar exercise on whether an 'I' can migrate between brains without any technology at all, and I would like you to construct the thought experiment to order. The point of the exercise is to test whether Hofstadter's pattern-based conception of the self genuinely diverges from the orthodox psychological-continuity view in ordinary circumstances, or whether the divergence only ever appears once you add science-fictional crutches like uploading and scanning. So the case must earn its divergence honestly: both verdicts must fall out of the theories themselves, not be stipulated by the narrator.

  The scenario must satisfy all of the following constraints. First, it must be set in ordinary domestic and working life — a hospital ward, a family kitchen, a choir — with no mind uploading, no brain scanning, no copying, and no futuristic apparatus of any kind; whatever "transfer" occurs must happen through the mundane channels of a shared life, such as conversation, letters, shared craft, and mourning. Second, the protagonist must be someone whose pattern is richly and actively carried by several living people who regularly rehearse her — an ensemble of bearers, not a single mourner — and something must happen such that, on Hofstadter's view of the self as a self-referential pattern that can be partially instantiated in brains other than the one that originated it (the view he developed around his wife Carol's death in I Am a Strange Loop), more of her 'I' is present in those other brains than in her own, whilst a standard Lockean psychological-continuity theory, in Parfit's refinement, still locates her — however attenuated — in her own brain and nowhere else. Third, the scenario must not itself mention any philosopher, theory, or thesis: it should read as a plain piece of narrative. Fourth, it must be a single paragraph of no more than 150 words.

  After the scenario, I want the demonstration that it meets the specifications. Walk through what Hofstadter's pattern view says about the case: where the 'I' is, and in what rough degrees. Then walk through what the psychological-continuity theorist says: where the person is, and in what degree. Then tell me which single feature of the case is doing the work, and what happens to each verdict if that feature is removed. Finally, give the strongest objection a Parfitian could raise to the effect that the case cheats — for instance, that carrying someone's pattern in your brain is like owning a portrait of her, not being her — together with the best reply available to Hofstadter on the pattern view's own terms. Please work from the positions as you understand them; no citations, reading lists, or quotations are wanted, and any remembered passages should be paraphrased rather than quoted.

  To close, please provide a JSON object summarising the case, with exactly these fields: "scenario" (a one-sentence summary of the case you built), "hofstadter_verdict" (a string stating where and in what degree the 'I' is instantiated, per Hofstadter), "continuity_verdict" (a string stating where and in what degree the person persists, per the Lockean-Parfitian), "load_bearing_feature" (the single feature generating the divergence), "if_removed" (what each verdict becomes without that feature), "parfitian_objection" (the strongest cheat objection), and "hofstadter_reply" (the best pattern-view response).
