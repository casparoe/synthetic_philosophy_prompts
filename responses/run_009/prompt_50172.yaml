  Then we need:
  1. Hofstadter's verdict: where the 'I' is and in what degrees.
  2. Continuity theorist's verdict: where the person is and in what degree.
  3. The single feature doing the work and what happens if removed.
  4. Parfitian objection and Hofstadter's reply.

  Let's build the scenario:

  **Scenario (Narrative):**

  In the years since her stroke, Martha's memories had faded, her thoughts grown sparse and repetitive, leaving her mostly silent in the family kitchen where she once held court. But her three daughters, now adults, kept her alive in their weekly gatherings: recounting her old stories with her inflections, debating what she would say about current events, even mimicking her gestures as they cooked her recipes. One evening, as Martha sat blankly while they animatedly reconstructed her likely critique of a neighbor's renovation, it struck them: they were now more vividly Martha than the frail woman at the table. She was present in their shared recreation, not in the husk that remained.

  (Word count: 119)

  **Demonstration:**

  **Hofstadter's pattern view:** The 'I' (Martha) is a pattern of habits, memories, ways of thinking, and reacting that can be instantiated in multiple brains. In this case, the pattern of Martha is richly and actively maintained in the daughters' brains through their regular, detailed rehearsals of her personality, stories, and mannerisms. The pattern in Martha's own brain is severely degraded due to the stroke and dementia. Therefore, Hofstadter's view would say that Martha's 'I' is more present (and more vividly) in the collective pattern instantiated by the daughters than in Martha's own brain, which now only weakly instantiates the pattern.

  **Psychological-continuity view (Lockean/Parfitian):** Psychological continuity requires overlapping chains of psychological states (memories, intentions, beliefs, etc.) connected in the right way (typically by causal dependence). Martha's own brain still has some continuity of psychological states, even if attenuated (e.g., some residual memories, habits). The daughters, however, only have representations of Martha; they do not have psychological continuity with her because their mental states about Martha are not causally connected in the right way to her past states as her own. Therefore, the continuity theorist would say Martha persists only in her own body, albeit in a diminished form, and not at all in the daughters.

  **The load-bearing feature:** The feature is the *active, rich, and collective rehearsal of Martha's pattern by multiple bearers (the daughters) in a way that becomes more vivid and complete than the degraded pattern in Martha's own brain, while Martha is still alive but severely cognitively impaired*.

  **If the feature is removed (e.g., if Martha were not impaired and still fully herself):** 
  - Hofstadter: The 'I' would be primarily in Martha, with the daughters having only partial, secondary instantiations (like echoes). 
  - Continuity: Martha would be entirely in her own brain, and the daughters would merely have memories or representations of her.

  **Parfitian objection (strongest cheat):** 
  The Parfitian might object that the daughters are merely representing Martha in their minds, like having a detailed portrait, but this does not mean they *are* Martha. Psychological continuity requires that the mental states are *hers* and connected in the right causal way (e.g., her memories, her experiences). The daughters' mental states about Martha are derivative and third-personal; they are not first-personal experiences of being Martha. Therefore, Martha cannot be said to persist in the daughters.

  **Hofstadter's reply (on pattern-view terms):** 
  The pattern view holds that the self is constituted by the pattern of information and its self-referential loop. When the daughters so thoroughly rehearse Martha's patterns that they run the same self-referential loops (e.g., thinking "What would Martha do?" and then generating responses that are in her voice, with her values, and then reflecting on that as if they were her), they are instantiating the very pattern that made up Martha's 'I'. It is not a mere representation but a re-activation of the same abstract pattern, which can exist in multiple substrates. Since the pattern in Martha's own brain is now degraded, the locus of the most active and complete instantiation of Martha is in the daughters' collective activity.

