  ### Scenario Narrative
  After years of dementia, Eleanor’s mind had frayed to fragments: she rarely spoke, forgot her children’s names, and spent days blankly tracing the kitchen table’s grain. Yet her three daughters, gathering weekly at that table, meticulously revived her—debating her views on politics, singing her favorite folk harmonies, and cooking her signature stew while mimicking her wry humor. One rainy evening, as Eleanor stared vacantly, the daughters erupted into her trademark laugh after recounting her old protest at the town hall. In that chorus, her essence felt startlingly present—not in Eleanor’s silence, but in their shared performance, now richer than the echoes in her own fading brain. (148 words)

  ### Demonstration  
  **Hofstadter’s pattern view verdict**:  
  The 'I' (Eleanor) is primarily instantiated in her daughters’ brains (high degree), where her pattern—memories, mannerisms, values, humor—is actively rehearsed and enriched through collective iteration. It exists only minimally in Eleanor’s brain (low degree), as her dementia has degraded the self-referential loop that sustains her identity. The daughters jointly host the most "vivid" version of Eleanor’s self-pattern.  

  **Psychological-continuity (Lockean-Parfitian) verdict**:  
  Eleanor persists solely in her own brain (low degree), as only there does attenuated psychological continuity—fragmented memories and habits—survive via causal connections to her past states. The daughters merely harbor accurate *representations* of Eleanor; they lack the direct, overlapping chain of consciousness (e.g., Eleanor’s first-person experiences causing their own) required for identity.  

  **Load-bearing feature**:  
  *Collective, active rehearsal of Eleanor’s pattern by multiple bearers while she is alive but cognitively degraded*. This creates a richer instantiation elsewhere than in the origin brain.  

  **If feature removed (e.g., Eleanor is healthy)**:  
  - Hofstadter: Eleanor’s 'I' is strongest in her own brain, with daughters having weak, secondary instantiations.  
  - Continuity: Eleanor is wholly in her own brain; daughters hold mere memories.  

  **Parfitian objection (strongest cheat claim)**:  
  "Carrying Eleanor’s pattern is like curating a museum exhibit of her life—it replicates her traits but lacks her subjective perspective. Psychological continuity requires her *own* mental states causally linking over time, not third-person imitations in others. The daughters’ performance is derivative, not Eleanor."  

  **Hofstadter’s reply**:  
  The pattern *is* the self: when the daughters run Eleanor’s self-referential loop (e.g., generating "her" opinions reactively and embedding them in their cognition), they recreate the identical abstract pattern that defined her 'I'. This is not imitation but re-instantiation—like a fugue played on new instruments. Fidelity in pattern execution trumps biological continuity.

