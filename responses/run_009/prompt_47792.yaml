  - "overall_credence": a number in [0,1] for the proposition as stated;
  - "terms": an array of objects, each with "label" (string), "probability" (number in [0,1]), and "one_line_justification" (string);
  - "combination": a string explaining how the terms produce the overall number — say explicitly whether you treated them as roughly independent, and note any correlation you adjusted for;
  - "most_sensitive_term": the label of the single term that moves the overall number the most, with one sentence on why;
  - "what_would_shift_it": one or two concrete pieces of evidence or argument that would move your overall credence by at least 0.15.

  Please do not hedge the overall number, and if you judge that one of the terms is not really a probability question but a stipulation, say so inside that term's justification field rather than silently dropping it.
