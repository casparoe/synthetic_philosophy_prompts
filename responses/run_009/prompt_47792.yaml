  The proposition I want your credence on: the common-knowledge threshold does genuine conceptual work — the difference between "each knows that the other knows, and so on to any finite depth" and literal common knowledge is a real feature of strategic life that explains behavior, not a technical artifact of idealized models. Treat the proposition as true if there are recognizably real coordination situations in which tracking the common-knowledge threshold, as opposed to any finite depth of mutual knowledge, correctly predicts a sharp change in what agents can achieve or how they act.

  Decompose it into terms along these lines, adjusting as you see fit: (i) the probability that the discontinuity results generalize beyond their specific conditions — lossy asynchronous channels, asymmetric payoffs — to coordination under fallible communication generally, the way people actually face it; (ii) the probability that real human agents are ever in a position to have literal common knowledge of anything nontrivial, given that the standard account ties common knowledge to public, effectively simultaneous events — a live meeting, a shared broadcast — and that most of life isn't like that; (iii) conditional on (ii) being near zero, the probability that the concept still earns its keep as the limiting case that organizes our talk of what is "obvious to everyone," on the model of frictionless planes or ideal gases in physics; and (iv) any further term you think belongs, such as whether high-probability common-belief frameworks can recover the predictive content without the idealization.

