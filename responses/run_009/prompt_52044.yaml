prompt: |-
  I am a novelist midway through a book narrated by a neuroscientist who has come to hold that phenomenal consciousness is an introspective illusion — that there is nothing it is like to be her, only a powerful and systematically misleading appearance that there is. Two chapters turn on her working out, in her notebook, what would actually make her give the view up, and I refuse to fake those scenes. So write me the specification she would draft: the desiderata any adequate theory of consciousness must meet before she would concede that the phenomenon is real and explained — the cases it has to handle (the explanatory gap, Mary and the color scientist, blindsight and kindred dissociations, dreams, pain, the asymmetry between how experience seems from inside and what third-person science can reach), the distinctions it must not collapse (phenomenal character from access and reportability, eliminativism about qualia from reduction of them, the illusion of experience from the experience of illusion), and the empirical results it cannot contradict — with the case or consideration behind each requirement. Then mark which of these are genuine desiderata and which are prejudices of one camp smuggled in as standards, and tell me whether any subset is jointly unsatisfiable: my suspicion is that the trouble lives in the pair 'must explain why it seems there is something it is like' and 'must not help itself to unexplained seemings in the explanation,' and I want to know if that is a real tension or a bad reading. Finally, in a paragraph, score illusionism, global workspace theory, and higher-order thought against the list — my character should be defeated or vindicated by real standards, not ones I invent for convenience.
reasoning: |-
  Okay, the user is a novelist working on a book with a neuroscientist narrator who believes consciousness is an illusion. They need a detailed specification of criteria that would make their character abandon this illusionist view. 

  First, I need to understand the core challenge. The character requires rigorous philosophical and scientific standards to be met before accepting consciousness as real. This isn't about faking intellectual work - the novelist wants authentic criteria that would genuinely challenge an illusionist stance.

  Hmm, the key components to address:
  - Explanatory gap (why physical processes feel like anything)
  - Knowledge arguments (Mary's room scenario)
  - Dissociation cases (blindsight, locked-in syndrome)
  - Phenomenal distinctions (qualia vs access consciousness)
  - Empirical constraints (neural correlates, anesthesia effects)

  The novelist suspects a tension between explaining why consciousness seems real versus using unexplained "seemings" in the explanation. That's a sharp observation - it cuts to the heart of illusionism's vulnerability. 

  For the frameworks:
  Illusionism fares worst by design since it denies the phenomenon being explained. Global workspace theory handles access/reportability well but stumbles on raw feels. Higher-order thought accounts for introspection but risks circularity.

  The novelist's hidden need seems to be narrative integrity - they want the character's potential concession to feel earned. That means the criteria must be: 
  - Philosophically airtight
  - Neuroscientifically literate
  - Balanced between warring camps
  - With clear failure points for theories

  Most importantly, the Mary case and explanatory gap form the deadliest combo against illusionism. If any theory could bridge that gap while respecting third-person science... that might actually sway the character. That's where the novel's climax might live.
answer: |-
  Here is the neuroscientist narrator's specification for concession, followed by analysis and framework scoring—crafted to be rigorous enough for your novel's pivotal scenes:

  ---

  ### **Specification: Desiderata for a Valid Theory of Consciousness**  
  *("If a theory satisfies these, I surrender illusionism")*

  1. **Resolve the Explanatory Gap**  
     - **Requirement**: Explain *why* specific neurophysiological processes generate subjective experience (e.g., why wavelength discrimination *feels like* "redness").  
     - **Case**: Jackson’s Mary (1982) – A complete physical knowledge of color vision ≠ knowing what red *looks like*.  
     - **Status**: **Genuine Desideratum**. All serious theories must address this.  

  2. **Explain Dissociation Phenomena**  
     - **Requirement**: Account for mismatches between reportability and phenomenality (e.g., preserved discrimination without awareness).  
     - **Cases**: Blindsight (Weiskrantz), locked-in syndrome, masked priming.  
     - **Status**: **Genuine Desideratum**. Empirical bedrock for access/phenomenal distinction.  

  3. **Ground the "Seeming" of Consciousness**  
     - **Requirement**: Explain why consciousness *appears* ineffable, intrinsic, and private without presupposing unexplained subjective properties.  
     - **Case**: Dreams (vivid phenomenality without sensory input) or pain (unreportable agony in paralysis).  
     - **Status**: **Genuine Desideratum** (but tension-prone).  

  4. **Preserve Key Distinctions**  
     - **Requirement**: Distinguish:  
       - (a) *Phenomenal character* (raw feels) vs. *access/reportability* (Global Workspace).  
       - (b) *Eliminativism* (qualia don’t exist) vs. *reductionism* (qualia are physical).  
       - (c) *Illusion of experience* (Dennett) vs. *experience of illusion* (e.g., hallucinations).  
     - **Status**: **Mostly genuine**, but (b) risks bias if reductionism is excluded by fiat.  

  5. **Fit Empirical Constraints**  
     - **Requirement**: Be compatible with:  
       - NCCs (Neural Correlates of Consciousness, e.g., recurrent processing in V1 for vision).  
       - Anesthesia (loss of phenomenality despite preserved non-conscious processing).  
       - Split-brain data (unified phenomenality despite disunified access).  
     - **Status**: **Genuine Desideratum**. Non-negotiable for a scientist.  

  ---

  ### **Critical Analysis**  
  - **Prejudices Smuggled In**: Item 4(b) risks bias if it demands qualia *reduction* as the only alternative to eliminativism (some dualists would protest). Items 3 and 4(a) subtly favor realist intuitions—illusionists might argue these "seemings" *are* the access.  
  - **Joint Unsatisfiability?**: Your suspicion is **correct**. The pair *"Explain why it seems there’s something it is like"* and *"No unexplained seemings"* creates tension:  
    - To explain the "seeming," one must invoke cognitive mechanisms (e.g., metacognition).  
    - But if those mechanisms lack phenomenality, the explanation feels incomplete (*"Why do they generate *this* seeming?"*).  
    - If they *have* phenomenality, it’s circular. **This is illusionism’s Achilles’ heel.**  

  ---

  ### **Framework Scoring**  
  *(0 = fails, 1 = partial, 2 = satisfies)*  

  | Desideratum               | Illusionism | Global Workspace (GWT) | Higher-Order Thought (HOT) |  
  |---------------------------|-------------|------------------------|----------------------------|  
  | **Explanatory Gap**       | 0 (denies gap exists) | 1 (explains access, not raw feels) | 1 (shifts gap to "meta") |  
  | **Dissociations**         | 2 (excels here)       | 2 (built for access)   | 2 (frames unaware states) |  
  | **Grounding "Seeming"**   | **0** (handwaves introspection) | 1 (access ≈ seeming) | **2** (HOT *is* seeming) |  
  | **Preserve Distinctions** | 0 (collapses phenomenal/access) | 1 (confuses access/phenomenal) | 1 (risk of circularity) |  
  | **Empirical Fit**         | 2 (aligns with NCCs)  | 2 (fits fMRI/data)     | 1 (hard to test HOT) |  
  | **TOTAL**                 | **4/10**              | **7/10**               | **7/10**              |  

  - **Illusionism** (Dennett/Frankish): Fails the core challenge—dismisses the "seeming" as a cognitive error but can’t explain its persistence without borrowing from realism.  
  - **GWT** (Baars/Dehaene): Strong on access/report but reduces phenomenality to information availability—begs the question for Mary.  
  - **HOT** (Rosenthal): Best at grounding "seeming" (consciousness = mental state represented by HOT), but the meta-regress looms (*"Is the HOT itself conscious?"*).  

  **Verdict**: No theory clears all bars. Your character remains secure in illusionism *unless* a theory tackles the seeming/seeming-explanation tension. Yet HOT’s partial success might unsettle her—it turns her "illusion" into a *real* metacognitive process with unexplained properties. That could seed doubt.  

  ---  
  **For your novel**: The tension you identified is philosophically valid and profound. A HOT-GWT hybrid (like Global Neuronal Workspace + HOT) might pressure your character most—forcing her to confront whether "meta-awareness" is the hard problem in disguise. Defeat could come from her realizing that *denying* phenomenality requires more explanatory work than *reducing* it.
