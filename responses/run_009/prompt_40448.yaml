  Okay, the user is a novelist working on a book exploring the purpose of marriage through different relationship structures. They've presented six propositions about marriage that form the philosophical backbone of their novel and want an audit of internal tensions. 

  Hmm, this is a sophisticated request blending legal theory, social philosophy, and narrative design. The user clearly has deeply considered positions but seeks pressure-testing before committing them to fiction. Interesting how they frame it as "auditing" commitments - there's both intellectual rigor and creative vulnerability here.

  First impression: Propositions 1 and 4 seem most immediately problematic. If marriage's core purpose is child-rearing stability (1), why categorically reject fertility requirements (4)? The user anticipates this tension but may underestimate its depth. Their defense that institutions can serve purposes without gatekeeping doesn't fully resolve why childless couples would participate in a child-centered institution. 

  Ah, and look at how proposition 2 (support for same-sex marriage) interacts with 1. The historical record shows marriage wasn't primarily child-focused until relatively recently. The user might need to either refine "institutional purpose" as aspirational rather than descriptive, or acknowledge same-sex marriage represents a functional evolution. 

  The triad rejection in proposition 3 feels like the most fragile position. Their dismissal of plural marriage as "dishonest rhetoric" doesn't engage with actual polyamory advocates' arguments about care networks. If household stabilization is the goal (1), why wouldn't a stable triad serve that better than some two-parent households? This seems like an unexamined bias.

  Propositions 5 and 6 are actually quite coherent. Recognizing adultery as institutionally distinct while keeping state intervention minimal aligns with modern legal trends. And their view of marriage's historical constitution while allowing change is philosophically sophisticated - reminds me of Edmund Burke's "partnership across generations" but without conservatism's rigidity.

  The biggest cleanup would come from rethinking proposition 1. If they framed marriage's purpose more broadly as "kinship stabilization" rather than specifically child-focused, most tensions dissolve. But that might cost the provocative edge their novel needs. Alternatively, leaning into the contradictions could create richer narrative tension - after all, humans hold inconsistent beliefs all the time.

  Fascinating challenge. The user isn't just seeking validation; they want to know where the fault lines are so their characters can authentically wrestle with them. That's rare intellectual honesty in creative work.
answer: |-
  Your six propositions form a provocative constellation—coherent at first glance but revealing fascinating tensions under pressure. Below is an audit ranking conflicts by severity, identifying soft ground, and pinpointing where revision would yield the most clarity. Philosophers of marriage (like Elizabeth Brake, Tamara Metz, and Sherif Girgis) disagree sharply on several underlying premises here—I'll flag those battlegrounds.

  ### **Ranked Tensions (Most Severe First):**
  ---
  **1. Tension Between (1) and (4)**  
  **Conflict:** If marriage’s institutional purpose is stabilizing households *for children* (1), why categorically oppose any inquiry into intent/ability to raise children (4)? This implies childless marriages are accidental deviations rather than equally valid forms.  
  **Soft Ground:** You argue institutions can serve purposes without gatekeeping participants. Critics (e.g., Girgis) counter: if child-rearing is *definitive*, excluding fertility tests undermines the institution's coherence. Defenders of same-sex marriage (like Andrew Koppelman) note marriage has *always* served multiple functions (companionship, economic union, sacrament)—child-rearing is one strand, not the sole telos.  
  **Revision Cost:** Softening (1) to "a *primary* but not exclusive purpose" preserves (2) and (4) but dilutes your institutional thesis. Hardening (1) risks excluding infertile heterosexuals—a position you reject.

  **2. Tension Between (1) and (3)**  
  **Conflict:** If marriage exists to stabilize *child-rearing households*, why oppose recognizing plural marriages (3)? Triads/quadrads can offer exceptional stability (e.g., shared resources, childcare labor). Your rejection hinges on "dishonest rhetoric" linking same-sex and plural marriage, but this doesn’t engage *functional* arguments for plural unions.  
  **Soft Ground:** The "slippery slope" debate is deeply contested. Scholars like Brake ("Minimal Marriage") argue *all* marriage limits are arbitrary if stability/care are the goals. Others (Metz) contend dyadic marriage fosters unique intimacy essential to its purpose. **Your unstated premise:** marriage requires exclusivity (emotional/sexual) incompatible with multi-party dynamics. But is that intrinsic to *household stabilization*?  
  **Revision Cost:** Abandoning (3) would align with (1)’s logic but violate your intuition. Defending (3) requires grounding marriage’s dyadic nature in something beyond child-rearing (e.g., emotional symbiosis, historical essence).

  **3. Tension Between (1) and (2)**  
  **Conflict:** If marriage is for child-rearing, same-sex marriage (2) seems to redefine the institution. You resolve this via (6)—marriage evolves—but (6) doesn’t explain *why* same-sex couples fit a child-centric purpose if they can’t procreate *together* (though they raise children).  
  **Soft Ground:** The "complementarity" argument (male/female essential for child-rearing) is empirically weak (studies show same-sex parents succeed) but philosophically persistent. Your position implicitly rejects biological essentialism—focusing on *social* parenting. This aligns with (4) but strains (1)’s traditional framing.  
  **Revision Cost:** Minimal if you clarify (1) as "stabilizing *family* households" (including adoption/fostering). Retaining "children may arrive" is defensible if "arrive" includes adoption.

  **4. Tension Between (5) and (1)**  
  **Conflict:** If adultery violates "goods the institution exists to protect" (5), why should the state ignore it in divorce (5)? If marriage’s purpose is child-rearing stability, adultery (which often destabilizes households) seems directly relevant.  
  **Soft Ground:** Modern divorce law (no-fault regimes) reflects a liberal view: the state shouldn’t police intimacy. But if marriage is a *public* institution (1), why not uphold its norms? Philosophers like John Stanton-Ife argue marital misconduct *should* affect divorce settlements to protect the institution.  
  **Revision Cost:** Abandoning no-fault principles conflicts with contemporary legal trends. Retaining (5) as a *moral* but not *legal* wrong is coherent but may feel inconsistent.

  **5. Tension Between (3) and (6)**  
  **Conflict:** You appeal to history (6) to defend marriage’s dyadic nature (3), but same-sex marriage also defies historical norms. Why is history binding for polyamory but not homosexuality?  
  **Soft Ground:** You likely see same-sex unions as continuous with marriage’s core (love, fidelity, parenting) while polyamory is discontinuous. Critics (e.g., Brake) call this arbitrary. **Contested Disagreement:** Traditionalists (Girgis) see dyadism as historically immutable; revisionists (William Eskridge) note marriage’s shape has always been fluid (e.g., coverture abolition).  
  **Revision Cost:** Defending (3) requires articulating why dyadism is historically *essential* while gender composition is not.  

  ---

  ### **Which Single Change Cleans Up the Most?**
  **Revising (1)** resolves the severest tensions (with 3 and 4). Redefine marriage’s purpose as:  
  > *"Stabilizing intimate partnerships that form the foundational units of social care, historically centered on—but not exclusive to—child-rearing."*  

  **Benefits:**  
  - Justifies same-sex marriage (2) without contradiction.  
  - Explains childless marriages (4) as valid care partnerships.  
  - Leaves room to reject plural marriage (3) by arguing dyads uniquely foster marital intimacy (though this remains contested).  
  - Retains adultery’s distinctive wrong (5) as betrayal of intimate partnership.  
  - Honors history (6) while allowing evolution.  

  **Cost:** Weakens the provocative claim that children are *the* institutional rationale—a tradeoff for coherence.

  ### **Contested Ground to Explore in Your Novel:**
  - **Is "Comprehensive Union" Inherently Dyadic?** Defenders of plural marriage argue care networks exceed dyads (e.g., communes, extended families). Your characters could debate whether marriage’s essence is exclusivity or resilience.  
  - **Adultery vs. Polyamory:** If adultery is uniquely destructive (5), what distinguishes it from consensual non-monogamy? A triad in your novel could challenge the married couple’s assumptions.  
  - **The State’s Role:** Why recognize marriage at all? Liberal theorists (Metz) advocate abolishing state marriage; others argue it signals social valuation. Your town’s reactions could dramatize this.  

  Your framework is tenable with nuanced defense, but its edges fray under scrutiny—perfect for fiction. Lean into the tensions: a novelist needn’t resolve philosophical debates, only illuminate them through human struggle. The triad’s stability might quietly challenge the son’s adherence to (3); the childless couple could embody the paradox of (1) and (4). Your propositions hold as a set *if* marriage’s purpose is framed capaciously—but the cost is abandoning the boldest version of your thesis.
