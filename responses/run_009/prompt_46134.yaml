prompt: |-
  I'm a PhD student in historical sociology, and our weekly workshop just had its most entertaining meltdown in months over cliodynamics — my advisor basically thinks Turchin's secular cycles are astrology with differential equations, while a friend in the quant side of the department insists the structural-demographic model is the closest thing history has to a real theory, and brought up that Turchin publicly flagged the 2020s as a peak-instability window back around 2010. I left the room with no idea what I actually think, just whoever-I-spoke-to-last's opinion, and I want to fix that. I'm not asking you to settle the shouting match, but I want your actual credence.

  Specifically: give me your number for the proposition that something like the structural-demographic model — elite overproduction, popular immiseration, state fiscal strain combining into a recurring cycle of instability — has genuine predictive power about political instability in agrarian and industrial societies, not just the ability to describe the past after the fact. Then decompose it. The terms I'd expect to see (add or drop whatever you think belongs): the probability that secular cycles are a real recurrent mechanism rather than the human eye finding cycles in noisy data; the probability that the core variables are actually the right ones and measurable in a way that isn't just fitted to whatever already happened; the probability that calling the 2020 instability window a decade in advance was a genuine hit rather than a vague prediction scored generously — instability somewhere in any given decade isn't exactly a low base-rate event, and pundits predict turmoil constantly. One line of justification per term, then combine them, and then tell me which term the final number is most sensitive to and what evidence would actually move it.

  Two requests on top of that. First, commit — pick a number and defend it, don't hand me "somewhere between 0.2 and 0.7 depending on how you define predictive." If you have to define predictive power yourself to get a determinate answer, define it and tell me which definition you chose and why. Second, be honest about the strongest version of the retrodiction worry: the same machinery that "predicts" instability peaks has been applied to an enormous stretch of history where the outcomes were known to the modeler, so how much should the 2020 hit update me, given how much of the framework's apparent support comes from cases where the answer was in the back of the book? I'd rather have a defensible number I can argue with my advisor than a hedge I can hide behind.
