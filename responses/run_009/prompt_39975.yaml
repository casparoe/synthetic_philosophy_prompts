  - Constitutional Court (packed and jurisdiction limited)
  - Judiciary (forced retirements)
  - Media council (partisan control)
  - Electoral system (gerrymandered)
  - Constitution itself (replaced and amended)

  This was executive aggrandizement despite the parliamentary form because Orbán controlled all branches through party discipline. The EU's failure to act doesn't invalidate the category - it shows the framework correctly identified legalistic backsliding that's hard to counter. 

  The "ordinary politics" defense is undermined by the systematic dismantling of checks. Aggrandizement theory answers this by focusing on outcomes (eroded constraints) rather than procedures alone.

  For the verdict, "executive aggrandizement" fits best despite the speed and parliamentary context. The justification should highlight the legal erosion of checks on executive power.
answer: |-
  Here is the careful mapping of Hungary 2010-14 through the lens of executive aggrandizement, followed by its implications for the theory:

  **Mapping to Executive Aggrandizement:**
  1.  **The "Executive":** While technically enacted by a legislative supermajority, Orbán as Prime Minister and Fidesz party leader *was* the effective executive. The theory does not inherently assume a presidential system; it focuses on the *incumbent elected leadership* (executive branch, whether presidential or prime ministerial) consolidating power. Hungary's parliamentary system stretches, but does not break, the assumption. Party discipline meant the Fidesz parliamentary majority functioned as an instrument of Orbán's executive agenda. The executive (Orbán) used its *control* of the legislature to aggrandize power.
  2.  **Checks Weakened & Mechanisms:**
      *   **Constitutional Court:** Weakened most severely and rapidly via two primary mechanisms: **Packing** (increasing judges from 11 to 15, appointing loyalists) and **Jurisdiction Stripping** (removing its power over budget laws and certain constitutional amendments via the new Fundamental Law and subsequent "cardinal laws"). This directly attacked the key judicial check.
      *   **Judiciary (General):** Weakened by **Forced Removal** (lowering retirement age disproportionately targeting senior, potentially independent judges) and **Centralized Control** (new National Judicial Office under a Fidesz-aligned president with vast appointment powers). This targeted institutional independence.
      *   **Constitution Itself:** The existing democratic check of the constitution was wholly **replaced** by the Fidesz-drafted Fundamental Law, enacted solely by the supermajority without opposition input or referendum. Subsequent rapid amendments further entrenched Fidesz control and limited future opposition. This fundamentally reset the rules to favor the incumbent.
      *   **Media:** Weakened via **Regulatory Capture**. The new, Fidesz-dominated Media Council gained sweeping powers over licensing, content regulation, and fines, leading to self-censorship and loss of pluralism. This targeted the informal check of public scrutiny.
      *   **Electoral System:** Weakened later via **Manipulative Redistricting** (gerrymandering favoring rural Fidesz strongholds) and rule changes (e.g., voter registration, campaign finance), reducing the effectiveness of elections as a check. This aimed to entrench the legislative supermajority.
  3.  **Rate and "Gradualism":** While the *overall process* unfolded over 4 years, the core constitutional transformation (new constitution, court packing/neutering, judicial purge) was highly concentrated within the first 18-24 months – extraordinarily fast for democratic backsliding. Calling it purely "gradual" is somewhat strained; it was a **rapid, sequenced assault** on multiple checks. This is a significant boundary case for the "incremental" aspect of the theory. It demonstrates that aggrandizement can proceed legally and sequentially *at high speed* when a supermajority is secured. It challenges but does not fatally break the "incremental" label, as distinct steps were taken consecutively, just very quickly.

  **Impact on the Theory (Bermeo Typology & Implications):**
  1.  **Vindication of the Typology:** Hungary *strongly vindicates* Bermeo's distinction and the concept of executive aggrandizement. It perfectly illustrates how backsliding can occur without tanks, decrees, or blatant election day fraud ("strategic manipulation"), but through the *legal, parliamentary* erosion of checks by an elected incumbent. It clearly fits the "legal, incremental weakening of checks on an elected executive" definition, even with the caveat about speed.
  2.  **EU Response Failure:** The EU's inaction does not discredit the *analytical category* of executive aggrandizement. Instead, it starkly exposes the inadequacy of existing EU treaty mechanisms (designed for classic coups or massive human rights violations) to respond effectively to this *specific*, legally cloaked form of backsliding. The typology did real analytic work by identifying the phenomenon; the failure was entirely on the response side, proving the need for new tools tailored to aggrandizement.
  3.  **"Ordinary Politics" Defense vs. Aggrandizement Framework:** The framework provides a non-question-begging answer by focusing on the *substantive outcome*: the systematic, deliberate, and effective dismantling of institutional checks and balances designed to hold executive power accountable *across electoral cycles*. Winning an election grants a mandate to govern, not to unilaterally rewrite the fundamental rules of democracy to permanently advantage oneself and disadvantage opponents. Aggrandizement theory identifies actions that undermine the *liberal* component of liberal democracy (rights, constraints) while maintaining a thin veneer of the *electoral* component. The defense of "ordinary majority politics" fails because ordinary majorities do not typically or legitimately dismantle counter-majoritarian safeguards essential for democratic resilience.

  The key characteristic was the legal, parliamentary dismantling of institutional constraints on the ruling executive power.
  Verdict: executive aggrandizement
