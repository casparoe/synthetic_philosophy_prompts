  The user raises important theoretical questions: Who is the "executive" in a parliamentary system? Was this really "gradual" when they replaced the constitution in 18 months? And how does this challenge the EU's response mechanisms? 

  I recall that executive aggrandizement focuses on elected leaders weakening checks incrementally through legal means. Hungary's parliamentary system makes the PM the executive, so Fidesz's legislative actions were effectively Orbán's agenda. The speed is unusual but still fits "incremental" as multiple steps were taken sequentially. 

