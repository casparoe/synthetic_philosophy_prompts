prompt: |-
  My brother-in-law thinks convention-based obligations are all fake, and he ambushed me with an argument over Thanksgiving that I can't quite demolish even though I'm pretty sure it's wrong somewhere. It goes:

  (1) The content of a convention is arbitrary: 15% vs 20%, driving on the right vs the left, first-come-first-served vs take-a-number — any of these would coordinate about as well as any other, so there was never a reason to pick the one we picked.
  (2) You can't be obligated to do something when every alternative open to you would have done just as well. Being under an obligation means having a reason that rules something out, and where the options are all on a par, nothing gets ruled out.
  (3) So nobody is ever obligated to comply with a convention as such. (You might be obligated for independent reasons — don't steal the waiter's wallet — but the convention itself generates nothing.)
  (4) So nobody is obligated to tip or stand in line, and a visitor has no obligation at all to learn the local stuff when traveling, which he was very pleased about since he travels constantly and hates tipping.

  When I pushed back that this would swallow promising too, he said fine, and laid out the parallel himself: (5) which noises or marks count as a promise is just as arbitrary as the tipping percentage — another country, another era, a completely different formula does the binding. (6) So by his own steps nobody is obligated to keep a promise, and he says he'll happily bite that bullet (promising is just a habit policed by reputation, nothing more). But when I extended it to money — what counts as a dollar, what a debt even is, convention all the way down — he started squirming, because now it looks like nobody owes anybody anything, ever. And honestly I squirmed too, because I can't see what, inside his argument, distinguishes promising from any other convention.

  I want to reject something between (1) and (4), but whenever I try, he says the convention itself can't be the thing that makes the difference, because the convention is exactly what's authority is in question — pointing at the rule to justify the rule. Is that move actually as airtight as he thinks it is? Where does the argument go wrong (assuming it does)? Which step should I reject, and what does rejecting it cost me? For what its worth I'd like to keep (2) if possible, since it also blocks a couple of other arguments I like, but tell me honestly if that's the one that has to go.
reasoning: |-
  Okay, the user's brother-in-law has this argument about conventions not creating real obligations, and it's causing some tension. Let me start by breaking down his points. He claims conventions are arbitrary, so they can't impose obligations because there's no reason to pick one over another. Then he extends this to promising and even money, leading to the conclusion that no one owes anyone anything. The user is uncomfortable with this but can't pinpoint where the argument fails.

  First, I need to identify the core issue. The brother-in-law is conflating the arbitrariness of the convention's form with the arbitrariness of its normative force. Just because the specific rule (like 15% vs. 20% tip) is arbitrary doesn't mean the reason to follow any established rule is arbitrary. That’s a key distinction. 

  David Lewis’s work on conventions comes to mind. Conventions solve coordination problems. Once a convention is in place, there’s a reason to follow it because it coordinates behavior. So step (1) is correct about arbitrariness in form, but step (2) misses that the existence of the convention itself provides a reason. Following it avoids coordination failure. 

  Step (2) says you can’t be obligated if alternatives are equal. But in coordination contexts, once a convention is established, sticking to it isn't arbitrary—it’s based on the expectation that others will follow it too. That interdependence creates a reason. So (2) is where the argument fails. Rejecting (2) doesn’t undermine other moral reasons; it just explains how conventions generate obligations through collective practice.

  The user wants to keep (2) because it blocks other arguments they like. But if (2) is wrong here, maybe they can refine it. Perhaps obligations require exclusionary reasons, but in conventions, the reason is the avoidance of disutility from non-coordination. That’s a real, non-arbitrary reason.

  The brother-in-law’s move that pointing to the rule is circular isn’t airtight. The rule isn’t justifying itself; the social practice and the need for coordination justify adhering to the established rule. It’s not circular—it’s instrumental. 

  Promising is a tougher nut. The brother-in-law bites the bullet, saying it’s just reputation management. But promising relies on conventions too. If conventions can’t create obligations, promising falls apart. The user’s extension to money is spot-on. If debt and currency are conventional, denying their obligating force unravels social structures. 

  The user might worry about rejecting (2) affecting other arguments. But they can still hold that obligations require exclusionary reasons; it’s just that conventions provide such reasons through their coordinating function. So rejecting (2) here doesn’t cost them much—it refines their view rather than abandoning it.

  In summary, the brother-in-law’s error is in step (2). Conventions generate reasons through their role in coordination. The cost is accepting that social practices can create genuine obligations without needing deeper moral foundations, which might feel uneasy but is necessary to avoid the absurdity of no obligations at all.
answer: |-
  Your brother-in-law's argument is clever but fatally flawed at step (2). He's conflating two types of "arbitrariness," and this misstep unravels his entire case. Here's the breakdown:

  ### The Core Error: Misunderstanding the Source of Obligation in Conventions
  - **Step (1) is partially correct**: The *form* of a convention is arbitrary (15% vs. 20%, left vs. right driving). Any *could* have worked if established.
  - **Step (2) is the critical flaw**: It falsely claims that because the *form* is arbitrary, there's **no reason to follow the established convention**. But the reason for obligation isn't the *specific form*—it's the **fact that a convention exists** and solves a coordination problem.

  ### Why (2) Fails: The Coordination Rationale
  Once a convention emerges, it creates a *non-arbitrary reason* to comply:
  1. **Expectations & Reliance**: Others rely on the convention (e.g., waitstaff budget based on 20% tips, drivers expect you to stay right). Violating it harms cooperative expectations.
  2. **Avoiding Coordination Failure**: If everyone ignored conventions because alternatives "would have worked," society collapses into chaos (traffic jams, wage theft, broken promises). Your obligation stems from the *disvalue of coordination failure*.
  3. **Fairness**: Benefiting from others' compliance (e.g., orderly queues) while free-riding is exploitative. 

  **His "pointing at the rule to justify the rule" objection misses the point**. The justification isn't circular—it's **instrumental**: 
  > *"We follow convention X because *having some stable convention* (regardless of which one) prevents harm/chaos, and X happens to be the one established."*

  ---

  ### Where to Attack & What It Costs
  #### Reject Step (2) (Strongly Recommended)
  - **Why**: Obligations *do* arise even when alternatives "would have done just as well" *if established*. The key is that **they weren't established**. The existing convention creates interdependent expectations.
  - **Cost to You**: You must accept that obligations can emerge from social practices without deeper moral foundations. This *doesn't* collapse morality—it just grounds some duties (tipping, queueing) in social coordination rather than Kantian imperatives.  
  - **Saves**: Promising, money, and all convention-dependent obligations. Even "biting the bullet" on promising fails, as promising relies on linguistic conventions (which his argument would also dissolve).

  #### Alternative: Modify Step (1) (Less Effective)
  - Argue conventions aren't *fully* arbitrary. Tipping 0% vs. 20% isn't morally equivalent—the latter sustains livelihoods in tip-dependent economies. But this concedes too much, as *some* conventions (like driving sides) *are* purely arbitrary yet still obligating.

  #### Why Keeping (2) Is Dangerous
  If you insist on keeping (2)—that obligations require "ruling out alternatives"—you *must* accept his bullet-biting. His extension to money is logical: if "dollar" is a convention, then debts are imaginary. This leads to moral nihilism about *all* socially constructed duties (property, contracts, laws). Few are willing to go there.

  ---

  ### How to Counterattack
  1. **Highlight the Coordination Rationale**:  
     *"Sure, any tipping rate could've worked—but now that 20% is expected, skipping a tip *harms the waiter* who budgeted based on that norm. The obligation isn't to '20%' itself—it's to not undermining a system others rely on."*  
     *(This forces him to deny that reliance/expectations create duties—a harsh position.)*

  2. **Use His Own Travel Example Against Him**:  
     *"When you visit Japan, do you drive on the left because you morally adore left-side driving? No—you do it because ignoring it causes accidents. Same with local customs: violating them (e.g., ignoring queue norms) creates social friction. The obligation is to minimize harm, not worship arbitrary rules."*

  3. **Target the Money/Promising Inconsistency**:  
     *"If conventions can't bind, why do you repay loans? 'Dollars' are just paper we arbitrarily treat as valuable. If *that* obligation is real, how are tips different?"*  
     *(If he denies monetary obligations, ask if he’d return a wallet full of cash he “found”.)*

  ### Philosophical Backup
  - **David Lewis** (*Convention: A Philosophical Study*): Conventions arise precisely to solve coordination problems. Compliance becomes obligatory because deviation *unilaterally* harms collective efficiency.
  - **T.M. Scanlon** (*What We Owe to Each Other*): Social practices create "legitimate expectations" that generate duties of fairness (e.g., tipping where it's customary).

  ### Conclusion
  **Reject (2).** Conventions *do* create obligations—not because their form is morally special, but because violating them *in a cooperative context* harms others and destabilizes social coordination. This costs you nothing you shouldn’t pay: it rescues promising, money, and tipping without denying that deeper moral principles (like harm/fairness) ultimately ground these duties. Your brother-in-law’s move only seems airtight if you ignore the *functional purpose* of conventions. Once that’s in view, his argument collapses.
