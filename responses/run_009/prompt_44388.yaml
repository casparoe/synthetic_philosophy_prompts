prompt: |-
  You're an expert on rational choice theory and also someone with a lot of experience teaching intro-level critical thinking, and I want you to plan a session for me — the deliverable is the plan (order, example, misconception map), not just the explanation itself, though sketching bits of content where it helps the plan is fine.

  Context: I'm a second-year taking a decision theory course, and I've somehow been made a discussion-section leader for a first-year critical thinking module. Next week is my fifty minutes on the sunk cost fallacy. I want to do it properly because the standard treatment ("the money's spent, get over it, move on") is way too clean, and I actually don't beleive it's always irrational to honor sunk costs. My professor dropped a few harder ideas in lecture that I want the session to build toward: (1) sunk investments carry information, so bailing on a project also destroys evidence about the project and about my own judgment; (2) people sometimes defensibly honor sunk costs because finishing things is part of who they're trying to be — quitting reads to future-you and to others as "I'm someone who bails"; and (3) something about how the fallacy applies differently when you're predicting other people's behavior versus evaluating your own choices — I half remember that one, so don't lean on me having gotten it exactly right.

  So plan the fifty minutes for me: what has to come first and why (I suspect the boring accounting point about why the textbook version works has to be rock solid before any of the hard stuff, but you decide). Then the carrying example — the prof used the classic one where you've bought expensive tickets to a game, it's snowing, and you have to decide whether to go; everyone nods along because it's the easy case. Should I use it anyway as a warm-up, or pick something else to carry the whole arc? Whatever example carries it needs to do two jobs: make the textbook fallacy vivid AND have a variant where honoring the sunk cost actually looks defensible — tell me what such an example must have and lack. Then the misconceptions, mapped onto the sequence: I'm bracing for "rational always means cutting your losses," "the fallacy is only about money," and something I can't quite articulate about people wielding "stop throwing good money after bad" as a mic drop that ends every argument. I have a feeling that last one only shows up at the end of the session, right after I've spent twenty minutes making the fallacy look shaky — plan for where each one gets created and where it gets defused. Also tell me what I should openly refuse to cover at this level (I'm guessing the formal expected-utility machinery is out?). And give me one closing question that would let me tell whether they've understood that the fallacy is a strong default, not a theorem.

  Please think carefully and brainstorm the dependency order before committing to it. Then, at the very end, add a final line with nothing else on it, in the form \answer{...}, containing a short hyphenated label (three words max) naming the single misconception you'd prioritize heading off — I want to compare it against what I expected.
reasoning: |-
  We are planning a 50-minute session on the sunk cost fallacy for a first-year critical thinking module. The goal is to go beyond the standard treatment and introduce some nuanced ideas from the professor's lecture. The session must build from the basics to the advanced points, while addressing common misconceptions.

  Key advanced points to cover:
  1. Sunk investments carry information (quitting destroys evidence about the project and one's own judgment).
  2. Sometimes honoring sunk costs is defensible because it shapes identity (finishing things is part of who one is trying to be).
  3. The fallacy applies differently when predicting others' behavior vs. evaluating one's own choices (this point is a bit fuzzy, so we'll focus on the first two and touch on the third if time permits).

  Structure the session:

  1. **Start with the textbook definition and why it's usually a fallacy (10 minutes)**
     - Why? We need a solid foundation. Without understanding the basic argument, the nuances won't make sense.
     - Define sunk cost: a cost that has already been incurred and cannot be recovered.
     - The fallacy: making decisions based on sunk costs (which should be irrelevant) rather than future costs and benefits.
     - Example: The classic concert ticket example.
       - You bought a non-refundable ticket for $100. On the day, you feel sick and the weather is bad. The rational choice is to only consider the future: the enjoyment of the concert vs. the discomfort of going. The $100 is gone regardless.
       - Why it's a fallacy: People often think, "I spent $100, so I have to go to get my money's worth." But that money is already spent and can't be recovered. Going might lead to more misery (and even additional costs like transportation) without getting the $100 back.
     - Emphasize: Only future costs and benefits matter.

  2. **Introduce the first nuance: Sunk costs as information (15 minutes)**
     - Why now? After establishing the basic fallacy, we can complicate it by showing that sunk costs might provide information about future costs/benefits or about one's own judgment.
     - Example: Modify the concert scenario. Suppose you are a music critic and you have a streak of never missing a concert you've planned to review. Or, the ticket was very expensive and hard to get, which might signal that the event is highly sought-after and likely to be great (so the future benefit might be higher than you initially thought). But note: the price paid is not a guarantee of quality. The key is to separate the information from the sunk cost.
     - Another example: A business project that has already consumed a lot of resources. If the project is failing, the sunk cost shouldn't matter. But if the fact that you've invested heavily suggests that the project is complex and requires more time, then the sunk cost might be a signal of the project's potential scale and the need for more patience. However, this requires independent evidence that the investment is actually correlated with the project's value.
     - Misconception addressed: "The fallacy is only about money." We can show that sunk costs can be time, effort, etc. And the information point extends beyond money to include any investment that might signal something about the future.

  3. **Introduce the second nuance: Identity and commitment (15 minutes)**
     - Why after the information point? This is a more psychological/social factor and builds on the idea that decisions are not made in a vacuum.
     - Example: The concert again. Suppose you are trying to build a habit of following through on commitments. Going to the concert might be important because you want to see yourself as a person who doesn't give up easily. Or, you have a friend who is counting on you. The sunk cost (the ticket) might be a reminder of the commitment you made, and honoring it might be part of your identity.
     - But caution: This is not a blank check. We must still weigh the future costs and benefits. If the cost of going is extremely high (e.g., risking health), then identity might not override. The point is that identity can be a legitimate part of the utility function.
     - Misconception addressed: "Rational always means cutting your losses." Rationality includes considering all future consequences, including psychological and social ones. Identity and self-image are part of one's preferences.

  4. **Briefly touch on the third point: Self vs. others (5 minutes)**
     - Why last? It's a more advanced point and we have limited time. We can present it as a thought-provoking note.
     - When predicting others' behavior: We might expect others to honor sunk costs because we know they care about identity, consistency, etc. So in strategic interactions, sunk costs might be relevant to predict behavior.
     - When evaluating our own choices: We try to be rational and ignore sunk costs, but we must also consider the identity and informational aspects as discussed.
     - Example: If you are a manager, you might predict that an employee will continue a project because they've invested a lot of time (sunk cost). But you, as the manager, should base your decision on the project's future prospects.

  5. **Addressing the "mic drop" misconception (throughout, but especially in wrap-up)**
     - The misconception: People use "that's sunk cost fallacy" as a conversation-ender without considering the nuances.
     - How to address: Throughout the session, we've shown that the fallacy is a default rule but not absolute. In the wrap-up, emphasize that the sunk cost fallacy is a strong heuristic, but real-life decisions require examining the context for informational and identity factors.

  6. **What to avoid**:
     - Formal expected utility machinery: This is an intro-level critical thinking class, so keep it conceptual.
     - Deep dives into behavioral economics experiments: We can mention them briefly, but the focus is on critical thinking in everyday decisions.

  7. **Closing question (5 minutes)**:
     - "Suppose a friend says, 'I know I should quit this project because of sunk cost fallacy, but I feel like I have to finish it for my self-respect.' How would you help them think through this without just saying 'that's irrational'?"
     - This tests if they understand that the fallacy is a default, not a theorem, and that identity considerations can be part of a rational decision.

  8. **Misconception to prioritize**:
     - The biggest one to head off early is "the fallacy is only about money." We'll address this in the first example by using non-monetary sunk costs (like time and effort) and then explicitly in the information section.

  Session Plan with Timing:

  - (5 min) Introduction: What is a sunk cost? Give the concert ticket example and the standard fallacy. Ask students: "What would you do? Why?" (Quick poll or think-pair-share).
  - (5 min) Explain the textbook reasoning: Only future costs and benefits matter. The $100 is gone. The fallacy is letting the past investment influence the decision.
  - (15 min) First nuance: Information. Use the business project example: 
    - Scenario: A company has spent $1M developing a product. It's behind schedule and over budget. The CEO must decide whether to cancel or continue.
    - Standard view: Ignore the $1M and look at future costs and expected revenue.
    - Nuance: The $1M might indicate that the project is complex and requires more investment to see returns, or it might signal that the company has already committed and learned a lot. But also, it might be a signal of poor management. The key is to gather independent evidence. The sunk cost itself doesn't create value, but it might be correlated with information.
  - (15 min) Second nuance: Identity and commitment. Return to the concert ticket: 
    - Suppose you made a promise to a friend to go together. Or, you are building a personal brand of reliability. The decision to go might be about maintaining relationships or self-image. But also, if the cost is too high (e.g., you are contagious and might get others sick), then it might be rational to break the commitment. Emphasize that these are future-oriented considerations about who you want to be.
  - (5 min) Third point: Self vs. others. 
    - When advising a friend, you might say "ignore sunk costs," but when predicting what your friend will do, you might factor in their tendency to honor sunk costs because of their personality. This shows that the fallacy is about rationality in decision-making, not about predicting behavior.
  - (5 min) Wrap-up and closing question: 
    - Recap: The sunk cost fallacy is a powerful bias, but sometimes sunk costs carry information or are tied to identity. The key is to consciously evaluate whether the sunk cost is providing relevant information or if it's just an emotional attachment.
    - Pose the closing question: "How would you help a friend who is struggling with sunk costs and identity?"
    - End with the takeaway: The sunk cost fallacy is a strong default, but critical thinking requires examining the context.

  Misconception Mapping:
  - "Rational always means cutting your losses": Addressed in the identity section by showing that future identity benefits can make continuing rational.
  - "The fallacy is only about money": Addressed by using non-monetary examples (time, effort, promises) and in the information section by talking about non-monetary signals.
  - "The sunk cost fallacy is a mic-drop argument": Addressed throughout by showing nuances and in the wrap-up by emphasizing context.

  The misconception to prioritize heading off is "the fallacy is only about money." We address this early and often by using non-monetary examples and explaining that sunk costs can be any irrecoverable investment.

  Final answer:
  \answer{only-about-money}
answer: |-
  ### Session Plan: Sunk Cost Fallacy Nuances (50 Minutes)  
  **Objective:** Move beyond the "textbook" sunk cost fallacy to explore when honoring sunk costs *might* be defensible, using the professor's advanced points. Build from foundational concepts to nuanced applications, while explicitly mapping and defusing misconceptions.  

  **Key Dependencies:**  
  1. **Foundation first:** Students must grasp the textbook fallacy to appreciate why deviations are *exceptions*, not the rule.  
  2. **Example continuity:** Use one adaptable example throughout (the "snowy game tickets" classic) for consistency, reducing cognitive load and allowing direct comparison between "fallacy" and "defensible" cases.  
  3. **Misconception sequencing:** Address misconceptions as they naturally arise in the content flow to prevent entrenchment.  

  ---

  ### Session Sequence (Total: 50 Min)  
  #### **1. Foundation: Textbook Sunk Cost Fallacy (10 Min)**  
     - **Why start here?** Students need a clear "rational baseline" to contextualize nuances. Without this, exceptions seem like excuses for irrationality.  
     - **Content:**  
       - Define sunk cost: A cost already incurred, irrecoverable, and irrelevant to *future* decisions (e.g., non-refundable tickets).  
       - Core principle: Rational choice depends *only* on future costs/benefits (not past investments).  
       - **Example (carry through entire session):**  
         - *Scenario:* "You paid $200 for a football ticket. On game day, it’s snowing heavily. Driving risks a 2-hour delay and a minor accident. Staying home means missing the game but avoiding hassle. Do you go?"  
         - *Textbook analysis:* Ignore the $200 (sunk). Compare only future outcomes:  
           - Going: Low enjoyment (bad weather) + high cost (time/risk).  
           - Staying: $0 cost + comfort.  
           - *Verdict:* Staying is rational. Honoring the sunk cost ($200) is fallacious.  
     - **Activity:** Quick poll ("Raise hand if you’d go"). Discuss why the $200 *feels* relevant (loss aversion, commitment).  

  #### **2. Nuance 1: Sunk Costs as Information (15 Min)**  
     - **Why here?** Builds directly on the foundation—shows sunk costs *can* indirectly matter by signaling future value, without contradicting core rationality.  
     - **Content:**  
       - **Key insight:** Sunk investments may carry information about (a) project quality or (b) your judgment. Quitting destroys this evidence.  
       - **Example variant (same ticket scenario):**  
         - *Twist:* "You’re a sports scout evaluating a rookie. You paid $200, but also: Past games suggest this player performs best in tough conditions. Bailing means losing data for your report."  
         - *Analysis:*  
           - Sunk cost: Still irrelevant ($200 is gone).  
           - Information: The investment signals *opportunity to learn* (future benefit). Going may yield insights for future scouting reports.  
           - *Verdict:* Honoring the cost *could* be rational if evidence-gathering is a future benefit > cost of going.  
       - **Misconception defused:** "The fallacy is only about money."  
         - *When it arises:* In foundation stage (students focus on $200).  
         - *Defusal here:* Emphasize information applies to non-monetary costs (e.g., time invested in a degree signals commitment to employers).  

  #### **3. Nuance 2: Identity and Commitment (15 Min)**  
     - **Why here?** After information, this is the next-logical "soft" factor—students already see sunk costs *can* matter indirectly; now introduce identity as a *future* cost/benefit.  
     - **Content:**  
       - **Key insight:** Honoring sunk costs may defend your identity (e.g., "I finish what I start"), affecting future self-image or social perceptions.  
       - **Example variant (ticket scenario):**  
         - *Twist:* "You promised your nephew you’d take him to his first game. Bailing might teach him quitting is acceptable when things get hard."  
         - *Analysis:*  
           - Sunk cost: Still irrelevant ($200).  
           - Identity: Future cost of damaging your "reliable aunt/uncle" identity (e.g., nephew’s trust, your self-respect). Future benefit of modeling commitment.  
           - *Verdict:* Honoring *might* be rational if identity protection > discomfort of going.  
       - **Misconception defused:** "Rational always means cutting your losses."  
         - *When it arises:* After foundation (students equate rationality with cold efficiency).  
         - *Defusal here:* Argue identity is part of rational utility—e.g., "If being ‘a finisher’ brings future joy/opportunities, it’s a benefit to weigh."  

  #### **4. Nuance 3: Self vs. Others (5 Min)**  
     - **Why here?** Quick application of prior concepts—uses identity/information to show evaluation differs based on perspective.  
     - **Content:**  
       - **Key insight (simplifying professor’s point):**  
         - *Evaluating your choice:* Ignore sunk costs (focus on future).  
         - *Predicting others:* Sunk costs matter because people act on identity/information (e.g., "They’ll likely go to the game—they hate wasting money").  
       - **Example:** "Your friend bought the ticket. Would you *advise* them to stay (future costs) or *predict* they’ll go (sunk cost)?"  

  #### **5. Wrap-up + Misconception Crush (5 Min)**  
     - **Core takeaway:** The sunk cost fallacy is a **strong default**—not a theorem. Exceptions require evidence (information) or identity-based future utility.  
     - **Misconception defused:** "Sunk cost fallacy is a mic-drop argument."  
       - *When it arises:* When discussing nuances (students might resist exceptions).  
       - *Defusal here:* "Nuances aren’t loopholes. If you honor sunk costs, *justify why* (e.g., ‘I’m gathering data’ or ‘This protects my integrity’). Lacking that, it’s likely fallacy."  
     - **Closing question (understanding check):**  
       > "Your friend says, ‘I’ve spent 3 years on this degree I hate, but I can’t quit—I’d be a failure.’ How do you help them separate sunk cost fallacy from defensible reasons?"  
       - *Tests:* Whether they (a) ignore sunk costs (foundation), (b) probe for information/identity (nuances), and (c) avoid "mic-drop" responses.  

  ---

  ### What to Exclude  
  - **Formal expected-utility machinery:** No math. Use qualitative cost/benefit comparisons.  
  - **Behavioral economics depth:** Skip cognitive biases (e.g., loss aversion) unless students raise them. Focus on critical thinking, not psychology.  
  - **Edge cases:** Avoid public-policy examples (e.g., military spending)—too complex for intro.  

  ### Example Requirements for the "Ticket" Scenario  
  - **Must have:**  
    - A sunk cost (e.g., non-refundable ticket).  
    - Clear future costs/benefits (e.g., discomfort vs. enjoyment).  
    - Flexibility to add information (e.g., scouting data) or identity (e.g., promise to nephew).  
  - **Must lack:**  
    - Recoverable costs (distorts the "irreversible" essence).  
    - Overwhelming complexity (e.g., financial constraints, group dynamics)—save for discussion.  

  ### Misconception Mapping  
  | Misconception                | When It Arises          | Defusal Point                     |  
  |------------------------------|-------------------------|-----------------------------------|  
  | "Only about money"           | Foundation stage        | Nuance 1 (information = time/effort) |  
  | "Rational = cut losses"      | Foundation → Nuance 2   | Nuance 2 (identity as utility)    |  
  | "Mic-drop argument"          | Wrap-up                 | Wrap-up (demand justification)    |  

  \answer{only-about-money}
