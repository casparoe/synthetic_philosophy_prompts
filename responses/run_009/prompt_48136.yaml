answer: |-
  Below is a "Which Bargaining Solution Do You *Actually* Accept?" quiz designed to uncover your intuitive preferences. Each question presents a bargaining scenario between two players, with disagreement payoffs normalized to (0,0). An arbitrator must impose a fair outcome. Answer based on your gut feeling about fairness—no game theory knowledge needed. The scoring key at the end maps your answers to Nash, Kalai-Smorodinsky (KS), Egalitarian, or Skeptic solutions.

  ---

  ### **Quiz Questions**  
  *(Disagreement point is always (0,0). Payoffs are utilities.)*  

  1. **Symmetric Calibration**:  
     The feasible set is all points where \(u_1 + u_2 \leq 100\) (and \(u_1, u_2 \geq 0\)). The arbitrator must choose a point on the Pareto frontier (where \(u_1 + u_2 = 100\)).  
     **What is fair?**  
     A) (50, 50) – both get equal payoffs.  
     B) Any split summing to 100 is equally fair.  

  2. **Player 1’s Opportunities Expand**:  
     Initially, the only Pareto-efficient points are (5, 10) and (10, 5). The arbitrator chose (5, 10) as fair.  
     *New feasible set*: Efficient points are (4, 20), (5, 10), and (10, 5).  
     **Which is fair now?**  
     A) (5, 10) – Player 1 shouldn’t get less than before.  
     B) (4, 20) – It’s acceptable even though Player 1 gets less (4 < 5).  
     C) (10, 5) – Neither should dominate.  

  3. **Deleting an Irrelevant Alternative**:  
     Efficient points: (100, 10), (80, 80), (10, 100). The arbitrator would never pick (100, 10) as it gives Player 1 a lot and Player 2 almost nothing.  
     *Remove (100, 10)*. Now efficient points: (80, 80), (10, 100).  
     **Does the fair point change?**  
     A) Yes – (80, 80) is fairer now.  
     B) No – Fairness is unaffected by removing "unfair" options.  

  4. **Absolute Gains vs. Fractional Gains**:  
     Efficient points: (40, 60), (60, 30), (80, 20).  
     **Which is fairest?**  
     A) (40, 60) – Gains from (0,0) are +40 and +60 (Player 2 gains more).  
     B) (60, 30) – Player 1 gets 75% of their max (60/80), Player 2 gets 50% (30/60).  
     C) (80, 20) – Player 1’s maximum is prioritized.  

  5. **Non-Comparable Utilities (Money vs. Happiness)**:  
     Player 1’s payoff is in dollars. Player 2’s payoff is in "happiness points" (scale arbitrary). Efficient points: (50, 50), (100, 25).  
     **Which is fair?**  
     A) (50, 50) – Equal payoffs, regardless of scales.  
     B) (100, 25) – The ratios might differ, but we can’t compare units.  
     C) Without comparability, neither is objectively fairer.  

  6. **Asymmetric Expansion**:  
     Feasible set: Line from (0, 100) to (100, 0). The arbitrator chose (50, 50).  
     *New feasible set*: Line from (0, 100) to (200, 0).  
     **Which is fair now?**  
     A) (100, 50) – Player 1’s gain doubles (0→100), Player 2’s stays +50.  
     B) (66.7, 66.7) – Equal payoffs.  
     C) Any point on the new line.  

  7. **Extreme Point Removal**:  
     Efficient points: (20, 80), (40, 40), (80, 20). The arbitrator would never pick (80, 20).  
     *Remove (80, 20)*. Now efficient points: (20, 80), (40, 40).  
     **Does the fair point change?**  
     A) Yes – (40, 40) is fairer without the extreme option.  
     B) No – Fairness is unchanged.  

  8. **Non-Linear Tradeoffs**:  
     Player 1’s utility is \(u_1\), Player 2’s is \(u_2 = 100 - u_1^{2}/100\) (for \(u_1\) in [0,100]).  
     **Approximately where is it fair?**  
     A) (57.7, 66.7) – Balances the product of gains.  
     B) (61.8, 61.8) – Equal payoffs.  
     C) Any efficient point.  

