  ### **Scoring Key**  
  **How to score**: Tally your answers. If multiple patterns fit, see the diagnosis.  

  | **Solution**               | **Answer Pattern**                                                                 | Notes                                                                 |
  |----------------------------|------------------------------------------------------------------------------------|-----------------------------------------------------------------------|
  | **Nash**                   | 1A, 2B, 3B, 4B, 5B, 6A, 7B, 8A                                                    | Favors outcomes insensitive to irrelevant alternatives.              |
  | **Kalai-Smorodinsky (KS)** | 1A, 2B, 3A, 4B, 5B, 6A, 7A, 8A                                                    | Favors proportional gains; monotonic when opportunities expand.      |
  | **Egalitarian**            | 1A, 2A or 2C, 3A or 3B, 4A, 5A, 6B, 7A or 7B, 8B                                  | Favors equal absolute payoffs; rejects scale-invariance (Q5).        |
  | **Skeptic**                | Any "C" in Q2, Q5, Q6, or Q8; or "B" in Q1 or Q6                                  | Rejects unique fairness; any Pareto improvement is acceptable.       |
  | **Incoherent/Unattractive** | Mixing 2A and 7A, or 4A and 5B, or 3B and 7A                                    | Rare; e.g., insisting on equal gains (egalitarian) while accepting non-comparable scales (Nash/KS). Diagnosed as unstable intuition. |

  #### **Agreements and Limitations**:  
  - **Nash and KS agree** on symmetry (Q1), Pareto efficiency (all Qs), and scale-invariance (Q5). They only diverge on monotonicity (Q2, Q7) and irrelevant alternatives (Q3, Q7).  
  - **Egalitarian is distinct** due to rejection of scale-invariance (Q5 is its strongest signal).  
  - **Q4 (gains vs. fractions)** splits Egalitarian (A) from Nash/KS (B).  
  - **Q3 and Q7 (irrelevant alternatives)** split Nash (B) from KS (A).  
  - **Q2 (expansion)** splits Egalitarian (A/C) from Nash/KS (B).  

  #### **Self-Critique**:  
  - **Likely Mis-sorting**: Q5 (non-comparable utilities) might mis-sort Egalitarian as Nash/KS if players assume hidden comparability.  
  - **Framing Bias**: Q2’s "Player 1 gets less" language may evoke loss aversion, pulling non-egalitarians toward 2A.  
  - **Evocative Numbers**: Q4’s (40,60) may seem "fairer" due to round numbers, favoring Egalitarian.  
  - **Restructuring Trigger**: If >30% pick Q8B (egalitarian), add a question where equal payoffs are Pareto-inefficient to stress-test.  
  - **Edge Cases**: Q3’s removal of a non-ideal but extreme point (100,10) is subtle; if answers cluster at 3B, it suggests Nash intuition is intuitive.  

  This quiz exposes conflicts between axioms (e.g., Q2 clashes monotonicity with independence). The skeptic option captures those rejecting the entire framework ("bargaining power matters, not axioms"). Use the patterns to spark debate!
