          Question 2 (discrete):
            "Initially, the only efficient points are (5,10) and (10,5). The fair split is (5,10) if we choose one, but wait, both are efficient. How to choose? In a symmetric set we might expect (7.5,7.5) but it's not available. In set1, we have only these two. Then we add a new point (4,20). The new efficient points are (4,20) and (10,5)? 
