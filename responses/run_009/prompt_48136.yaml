          In this example, the old set had (5,10) as one possibility, but it also had (10,5). The expansion added (4,20). The fair split in set1 might not have been uniquely (5,10) if we consider symmetry, but the set is not symmetric. To avoid this, we make set1 have only (5,10) as the only efficient point.

          Set1: efficient points only (5,10) [and maybe (0,0) and other dominated points]. 
