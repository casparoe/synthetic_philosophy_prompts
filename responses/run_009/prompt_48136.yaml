          Therefore, options:
            A: no, player1 should not get less than 5. (Egalitarian and also if you believe in monotonicity)
            B: yes, (4,20) might be fair even though player1 gets less than before. (Nash and KS)
            C: (5,10) should still be chosen. (Egalitarian might say this, but also someone who doesn't want to change)

          This separaters: 
            A: might be KS? But wait, KS chose (4,20) which has player1=4<5. So for KS, should we have said no? But the expansion in this case also raised player2's ideal from 10 to 20. The KS solution in set1: only one efficient point, so (5,10). In set2, it chooses (4,20) because it has a better ratio.

          The monotonicity axiom in KS is: if the set expands and the ideal point for player2 increases while player1's remains the same, then player2 should not get less. Here, player1's ideal remains 5? In set2, the ideal for player1 is still 5 (because in set2, the best player1 can do is 5) and player2's ideal is 20 (up from 10). The KS solution in set1: only point (5,10) -> player2 gets 10. In set2, player2 gets 20. So player2 gets more, which is allowed by monotonicity. Player1's utility drops from 5 to 4, but the axiom doesn't say anything about player1 in this case.

          So the expansion in this case is such that player1's ideal did not change (still 5), but player2's ideal increased. The KS solution then might reduce player1's utility if it helps player2 more.

          Therefore, for the question "is it possible that the new fair split gives player1 less than 5", the answer is yes, and it happens in Nash and KS.

          So options for Question 2:
            A: No, player1 should not get less than 5 in the new set because that would be a loss for player1.
