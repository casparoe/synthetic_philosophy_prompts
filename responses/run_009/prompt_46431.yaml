prompt: |-
  I've been trying to wrap my head around two-dimensional semantics, and honestly the water/H2O example has been repeated so many times it kind of stops working for me — I just pattern match to it and don't feel like I actually understand the machinery. Can you explain the distinction between considering a world as actual versus considering it as counterfactual using some *other* example? Maybe a made-up one, like a community that uses a term for a glowing mineral that later turns out to be two chemically distinct compounds with identical appearance, or whatever works.

  Also, here's the part that really bugs me. People describe the primary intension of 'water' as tracking something like 'the watery stuff around here' — but that seems like it smuggles in a description we picked after the fact. Who decides which features go in the 'watery' cluster (clear, drinkable, fills lakes, etc.)? Couldn't there be a community whose term determinately refers even though nothing like their stereotype is actually correct — like their 'water' turns out to be some weird substance that isn't even liquid? If so, does the primary intension just fail to exist for some terms, or does it exist but not do the work it's supposed to?

  And one more thing — sorry, I know this is alot of questions — does two-dimensionalism give you contingent a priori statements as the flip side of necessary a posteriori ones? Kripke's own examples (the meter stick, that kind of thing) always felt separate from this literature to me, so I'd like to know whether the 2D framework is supposed to explain them or is just adjacent. Feel free to spell all of this out carefully, I'd rather have it long and clear than short and hand-wavy.
