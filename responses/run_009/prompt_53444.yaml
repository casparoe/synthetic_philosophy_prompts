        Specifically, the probability of being in a particular civilization in H1 is 1/N1, and in H2 is 1/N2. But note: we are not asking about which civilization we are in, but which hypothesis is true. 
        SSA conditions on the fact that we exist and are observers. The likelihood of observing what we observe (which is just that we exist) under H1 is 1 (since we exist) and under H2 is also 1. So SSA does not shift the prior? But note: we are a random observer from the set of all observers. The probability of being us (i.e., this particular observer) given H1 is 1/N1 and given H2 is 1/N2. However, we are not a particular observer but a random one. The key is that we don't have a specific identity. The typical SSA approach is to note that if H2 is true, there are more observers, so it is less likely that we would be one of the observers that actually exist in a specific location? But note: in the reference class of all observers, the chance of being in a particular civilization is proportional to the number of civilizations? Actually, no: if we are a random sample from all observers, then the chance of being in a civilization of type X is proportional to the number of observers in that civilization type.

     However, the Presumptuous Philosopher case does not have different types of civilizations, just different numbers. So:

        P(we are in a civilization | H1) = 1 (because we are in one of the trillion, and we are one observer) but note: we are not asking about which civilization but which hypothesis. 

     The standard SSA reasoning for this case: 
        The probability of being an observer in H1 is proportional to the fraction of all observers that are in H1. But note, only one hypothesis is true. So we condition on the hypothesis. 

     Under SSA, the probability of having the indexical information that we have (i.e., that we are some observer) is the same under both hypotheses (it is 1). Therefore, SSA does not change the prior. So the posterior remains 0.5 for each.

     Under SIA:
        We weight each hypothesis by the number of observers it contains. So the prior is updated by a factor proportional to the number of observers. Therefore:

