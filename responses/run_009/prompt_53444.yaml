          So we favor B by a factor of 10^12.

          And within B, we would also update that we are likely simulated, but that is a separate question.

     This seems intuitive: if there are many simulations, then we are more likely to be in a world that has many simulations, and within that world, we are more likely to be simulated.

     The strongest objection to this is the problem of the boundaries of consciousness. If we allow any computation that might be conscious, then we get extreme results. In response, we must be cautious and only include in the reference class those observers that we are confident are conscious and having experiences like ours. This is vague, but it is a problem for any theory of anthropics.

     Therefore, I conclude in favor of SIA.
