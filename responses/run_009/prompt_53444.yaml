  We are comparing the Self-Sampling Assumption (SSA) and the Self-Indication Assumption (SIA) in anthropic reasoning.

  SSA: one reasons as if one is a random sample from the set of all observers in one's reference class.
  SIA: one additionally weights hypotheses by the number of observers they contain (because one's existence is more probable under hypotheses with more observers).

  We will address the four parts:

  1. **Presumptuous Philosopher** (Bostrom's case):
