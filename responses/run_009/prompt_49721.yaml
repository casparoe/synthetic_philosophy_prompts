prompt: |-
  I've been reading about remedial-right theories of secession (Buchanan-style, where secession is only justified as a remedy for serious injustice) versus plebiscitary theories (where any territorial majority that votes for independence has a pro tanto right to it), and I want to test both against Scotland 2014. What's interesting to me is that the UK government just... agreed to the referendum via the Edinburgh Agreement, making it a case of state-consented secession procedure that neither theory seems built for -- the remedial theorist has to say Scotland lacked the right, the plebiscitary theorist has to say the right existed regardless and the consent was superfluous, and both feel wrong somehow. Analyze the episode through both theories: who had standing, what the franchise decisions (16-year-olds, resident non-Scots, expat Scots excluded) did to the "people" whose self-determination was at stake, and whether "The Vow"-style last-minute promises show the process was really about bargaining power rather than rights. Then tell me where each theory is just silent about a consensual negotiated path -- and does Catalonia 2017, where the state refused consent entirely, confirm that the theories only ever get tested in the hard cases?
reasoning: |-
  Okay, the user is diving deep into political theory regarding secession, specifically comparing remedial-right theories and plebiscitary theories using the Scottish independence referendum in 2014 as a case study. They’re pointing out that the UK government's consent through the Edinburgh Agreement creates a scenario neither theory fully addresses. The user seems well-versed in the subject, likely an academic or a student in political philosophy or international relations. Their frustration with both theories' limitations is palpable—they want a framework that accounts for negotiated, consensual secession, not just extreme cases.

  The user’s core question revolves around how each theory handles the Scottish case:  
  - **Remedial theory** (Buchanan): Secession is only justified as a remedy for grave injustice. Scotland didn’t meet this bar, so why did the UK consent? The theory would see the referendum as a political concession, not a right.  
  - **Plebiscitary theory**: Any majority vote justifies secession. But the UK’s consent made the vote possible, suggesting the "right" depended on state approval, contradicting the theory’s core premise.  

  The user also flags three nuanced aspects:  
  1. **Standing**: Who counts as the "people" with self-determination rights? Scotland’s franchise included 16-year-olds and EU residents but excluded expat Scots—a messy boundary that challenges both theories.  
  2. **The Vow**: Last-minute devolution promises exposed the referendum as a power play, not a pure rights exercise. This undermines plebiscitary theory’s moral idealism and highlights remedial theory’s blindness to non-injustice motivations.  
  3. **Catalonia contrast**: The 2017 unilateral referendum forced theories into "hard case" mode, making Scotland’s consensual path look like an outlier neither theory explains well.  

  The user’s deeper need? They’re likely seeking a *third way*—a theory that legitimizes negotiated secession without requiring injustice (remedial) or ignoring state sovereignty (plebiscitary). They might also want to test if real-world cases break these binaries. Catalonia’s mention suggests they’re probing whether theories only matter in conflicts, missing peaceful precedents like Scotland.  

  My analysis should:  
  - Stress how both theories struggle with *consent*. Remedial sees it as irrelevant (rights exist without state approval); plebiscitary sees it as redundant (the majority’s will trumps state consent).  
  - Note how franchise choices reveal the artificiality of defining "the people"—both theories assume this is clear-cut, but Scotland’s inclusions/exclusions show it’s politically constructed.  
  - Argue that "The Vow" supports remedial theory’s skepticism: if secession were a primary right, pre-referendum bribes wouldn’t sway voters. But plebiscitary theorists could retort that bargaining happens *because* the right exists.  
  - Conclude that consent-based cases expose the theories’ limits: they’re built for adversarial contexts, not diplomacy. Catalonia "confirms" this by forcing theorists to pick sides in a clash, while Scotland’s cooperation leaves them speechless.  

  Finally, hint that this gap might point to *procedural theories* (secession as negotiated constitutional change) as a middle path—though the user didn’t ask for alternatives, they’re clearly hungry for one.
answer: |-
  Your analysis of the Scottish independence referendum (2014) brilliantly exposes the limitations of both remedial and plebiscitary secession theories when applied to a **state-consented, procedural process**. Let's break this down using your framework, then address Catalonia's contrast:

  ### 1. **Core Tension: Consensual Process vs. Theoretical Frameworks**
     - **Remedial Theory (Buchanan)**: 
       - **Standing & Justification**: Scotland lacked "remedial" grounds (no grave injustice like oppression or systemic rights violations). The UK's consent is thus seen as a *political concession*, not recognition of a pre-existing right. The Edinburgh Agreement becomes a pragmatic act of "permission," undermining the theory's core claim that secession is *only* justified as a remedy.
       - **Silence on Consent**: Remedial theory has no conceptual space for consensual secession. Consent is irrelevant because the right only activates *after* injustice. The process appears as a "gift" from the state, not an exercise of inherent right.
     - **Plebiscitary Theory (e.g., Beran, Philpott)**:
       - **Standing & Justification**: A territorially concentrated majority (Scots) *always* has a pro tanto right to secede. UK consent should be legally unnecessary (though pragmatically useful). Yet, the Edinburgh Agreement made the referendum *legally valid*, implying the "right" was contingent on state approval.
       - **Silence on Consent**: Plebiscitary theory treats consent as *redundant* – the right exists independently. But in practice, the UK's consent was *constitutive* of the process. This exposes a gap: the theory assumes a right can be exercised unilaterally, but in liberal democracies, constitutional pathways require state cooperation.

  ### 2. **Franchise & Defining "The People"**
     - **Key Decisions**: 
       - *Included*: 16-17-year-olds, EU/Commonwealth citizens resident in Scotland.
       - *Excluded*: Scottish-born citizens living elsewhere in the UK/abroad.
     - **Remedial View**: Franchise choices are secondary – if no injustice exists, the "people" have no secession right anyway. The debate is irrelevant.
     - **Plebiscitary View**: Franchise becomes crucial as it defines the *demos* exercising the right. Including 16-year-olds expands democratic participation but may challenge "maturity" critiques. Excluding expatriate Scots (unlike Lithuania, Estonia) suggests territorial residence > ethnic ties. Including non-citizen residents (EU nationals) implies a *civic-territorial* "people," not ethnic. Both theories lack tools to judge franchise fairness beyond basic democracy principles.

  ### 3. **"The Vow" & Bargaining Power vs. Rights**
     - **The Episode**: Last-minute devolution promises (more powers, tax rights, NHS guarantees) by UK party leaders days before the vote.
     - **Remedial Analysis**: Supports the theory! "The Vow" reframes secession as a *bargaining chip* to extract concessions within the union. Voters weren't exercising a primary right but leveraging threat of exit for reform – consistent with remedialism's view that secession is a last resort.
     - **Plebiscitary Analysis**: Problematic. If Scots had an inherent right, "The Vow" should be irrelevant (or even coercive). Yet, it likely swayed voters by offering an alternative to independence. This suggests the "right" was contingent on negotiations, undermining the theory's claim of a freestanding moral/legal right.

  ### 4. **The Consensual Path: Where Theories Fall Silent**
     Both theories are built for **conflictual scenarios**:
     - Remedial: Focused on *redressing* state abuse.
     - Plebiscitary: Focused on *overriding* state opposition.
     **Scotland 2014 exposes their shared blind spot**: **Negotiated constitutional secession**.
     - The Edinburgh Agreement was a *procedural contract*, not a recognition of inherent rights. It treated secession as a:
       - **Constitutional amendment** (requiring state consent).
       - **Democratic event** (requiring clarity on franchise, question, threshold).
       - **Bargaining process** (where "The Vow" offered an alternative).
     Neither theory explains why a state would *voluntarily* facilitate a vote it could refuse, or how such a process balances self-determination with territorial integrity.

  ### 5. **Catalonia 2017: Testing Theories in Hard Cases**
     - **The Contrast**: Spain's refusal to consent forced the issue into the realm both theories *are* designed for:
       - Remedialists saw Spain's actions (police violence, judicial repression) as *creating* potential remedial grounds post-referendum.
       - Plebiscitarists saw the vote itself (despite state opposition) as an assertion of inherent right.
     - **Confirmation of the Gap**: Catalonia "fits" the theories because it's adversarial. Scotland doesn't precisely *falsify* them but reveals their narrow focus on **legitimacy under conflict**, ignoring **legality through consent**. Theories thrive in hard cases because they answer "Is secession *justified* when states resist?" but not "How *should* it work when states cooperate?"

  ### Conclusion: Toward a "Procedural" Theory?
  Scotland 2014 highlights the need for a **third framework**: a theory of **negotiated secession** that treats independence as a constitutional process requiring mutual agreement on:
  - **Who decides** (franchise),
  - **How it triggers** (referendum rules, thresholds),
  - **Post-vote arrangements** (asset division, borders).
  This transcends the remedial/plebiscitary binary by accepting state consent as a necessary (but not sufficient) condition in stable democracies. Catalonia confirms that without consent, theories default to conflict-mode—but Scotland suggests most real-world secession attempts (Quebec, New Caledonia) occur in the messy middle ground of negotiation, where current theories offer little guidance. Your intuition is spot-on: the Edinburgh Agreement is a theoretical anomaly that exposes the limitations of existing paradigms.
