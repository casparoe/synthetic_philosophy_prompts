  Based on your friend's pattern of judgments so far, I'll predict her calls for next week's debates, then unpack the implicit rule(s) she seems to be using, show where those rules might conflict, and suggest a new case to test her underlying principle. The goal is to "smoke out" her reasoning by identifying tensions in her approach and proposing a decisive test case.

  ### Predictions for Next Week's Debates
  Here's my forecast for how your friend will categorize each item, based on the examples you provided (Pluto, hotdog, water, holes, tables, and growing-block theory). I'll explain each prediction briefly, tying it to her historical judgments.

  1. **Do numbers exist, or is math just symbol-pushing?**  
     **Prediction: Verbal.**  
     This resembles the holes/tables cases: it's a disagreement about ontological commitment (i.e., what we mean by "exist") rather than a factual dispute about the world. If one side defines "existence" as physical or spatiotemporal presence (so numbers don't exist), and the other allows for abstract objects (so numbers do exist), the debate dissolves once definitions are clarified. Nature doesn't "care" about mathematical categories—it just is. This parallels her view of holes ("donut arranged hole-wise") and tables ("particles arranged table-wise"), where the disagreement is verbal because it hinges on counting rules or linguistic conventions.

  2. **Is a virus alive?**  
     **Prediction: Verbal.**  
     This is a classic boundary case in biology, like the Pluto debate. "Life" isn't a natural kind with a sharp essence; it's a human-defined category based on properties (e.g., reproduction, metabolism). Viruses straddle the line—they replicate but lack metabolism—so the dispute is about where we draw the arbitrary boundary for the word "alive." Once we specify our definition, no deeper factual disagreement remains. This aligns with Pluto (astronomers drawing a line) and hotdog (culinary categorization), where nature provides a continuum, but our labels are conventions.

  3. **Is the mind just the brain, like pain being identical to some neural firing?**  
     **Prediction: Not verbal.**  
     This mirrors the "water is H₂O" case: it's a claim about identity or essence discovered through science. If pain is identical to a specific neural pattern (e.g., C-fiber firing), then something that feels painful but lacks that pattern wouldn't truly be "pain" in the same way that XYZ on Twin Earth isn't water. This isn't just wordplay—it's a factual hypothesis about the nature of mental states, which could be confirmed or falsified empirically (e.g., via neuroscience). Her growing-block verdict (not verbal) suggests she sees similar metaphysical or scientific identity claims as factual, not merely linguistic.

  **Summary of predictions:**  
  - Numbers: Verbal (like holes/tables).  
  - Virus alive: Verbal (like Pluto/hotdog).  
  - Mind-brain identity: Not verbal (like water/growing-block).  

  ### The Implicit Rule(s) Your Friend Is Using
  Your friend's approach seems consistent at first, but there's tension beneath the surface. I suspect she's implicitly combining two distinct principles, which I'll call **Rule A (Scientific Essentialism)** and **Rule B (Metaphysical Realism)**. These rules overlap in most cases but conflict on others—especially the growing-block theory, which surprised you. Let's define them:

  - **Rule A: Scientific Essentialism**  
    A dispute is **verbal** if it revolves around human-defined categories, boundaries, or linguistic conventions where nature provides no "joints to carve" (e.g., planets, sandwiches, holes). It's **not verbal** if it involves a natural kind (like water) with an empirically discoverable essence (e.g., H₂O) that fixes reference. Here, definitions aren't arbitrary—they're answerable to the world.  
    *Fits:* Pluto (verbal, no essence), hotdog (verbal, convention), water (not verbal, essence), virus alive (verbal, no sharp essence), mind-brain (not verbal, potential neural essence).

  - **Rule B: Metaphysical Realism**  
    A dispute is **verbal** if it can be resolved by specifying ontological frameworks (e.g., "by my counting rules, holes exist") without changing our view of reality. It's **not verbal** if it concerns mind-independent facts about what exists or the structure of reality, even if not directly observable (e.g., the ontology of time). Here, language might point to something deeper.  
    *Fits:* Holes (verbal, framework-dependent), tables (verbal, ditto), growing-block (not verbal, reality has a fact about existence), numbers (verbal, framework-dependent), water (not verbal, reality fixes the essence).

  **Why both rules seem to fit the data:**  
  - Most of her verdicts align with both rules. For example, "water is H₂O" is not verbal under either: Rule A (scientific essence) and Rule B (fact about reality). Pluto is verbal under both (convention/framework-dependent).  
  - But the **growing-block theory** (past/present/future existence) is the key outlier. Rule A might classify it as verbal because time isn't a "natural kind" with a scientific essence (physics underdetermines it—e.g., relativity vs. presentism). Yet she called it *not verbal*, favoring Rule B: she thinks existence is a mind-independent fact, not just about language. This is why she waved you off—it's not like tables, where specifying "particles arranged table-wise" resolves things; for her, temporal ontology is a real feature of the universe.

  **Where the rules conflict:**  
  The tension arises in cases involving **non-empirical metaphysics or abstract entities**. Rules A and B diverge when:  
  - Rule A focuses on *empirical discoverability* (if science can't settle it, it's likely verbal).  
  - Rule B focuses on *mind-independence* (if reality has a fact, it's not verbal, even without empirical tests).  

  Your three upcoming debates expose this:  
  - **Numbers exist?** Rule A says verbal (no scientific essence; math isn't empirical). Rule B *could* say not verbal if she thinks abstract objects are real (e.g., Platonism), but her holes/tables verdicts suggest she leans verbal here. My prediction follows Rule A.  
  - **Virus alive?** Both rules agree it's verbal (no essence, conventional boundary).  
  - **Mind-brain identity?** Both rules *could* call it not verbal (neural essence, factual reality), but Rule B might allow for verbal interpretations if "mind" is seen as high-level description (like tables). I predicted not verbal based on her water analogy.  

  **The critical conflict case:** The growing-block theory already highlights the rift. Rules A and B give different verdicts:  
  - Rule A: Verbal (no scientific test for temporal ontology; it's framework-dependent like tables).  
  - Rule B: Not verbal (existence is mind-independent; there's a fact about what "is").  

