  ### How to Smoke Out Her Underlying Principle
  To clarify her reasoning, you need to present a case where:  
  - Rules A and B clearly conflict (like growing-block, but more pointed).  
  - The debate involves **existence, essence, or ontology** but lacks clear empirical resolution.  
  - It pressures the "tables vs. growing-block" inconsistency.  

  **Suggested Test Case for Lunch:**  
  **"Is free will compatible with determinism?"** Specifically, the debate between compatibilism (free will is compatible with determinism if we define it as acting without coercion) and incompatibilism (free will requires indeterminism).  

  - **Why this case?**  
    - It directly targets the tension in her rules. Rule A (Scientific Essentialism) would call this verbal: "free will" has no scientific essence; it's a human concept, so the dispute is about definitions (e.g., what "free" means). Rule B (Metaphysical Realism) might call it not verbal if she thinks there's a fact about whether agents *truly* have freedom in a deterministic universe.  
    - It mirrors growing-block (metaphysical, about reality's structure) but also holes/tables (framework-dependent). If she says verbal, it aligns with Rule A and her holes/tables verdicts; if not verbal, it reinforces Rule B and growing-block.  
    - It's empirically underdetermined—neuroscience or physics can't settle it—so it forces her to choose between empirical discoverability (Rule A) and mind-independence (Rule B).  

  **How to probe her during lunch:**  
  1. **Set up the debate:** Ask if the free will disagreement is verbal or real. Focus on the compatibility question, not tangential issues.  
  2. **Listen for cues:**  
     - If she says **verbal**, she's likely prioritizing Rule A. Key phrases: "It depends on how you define 'free will,'" or "Nothing changes in the world based on the definition—it's just wordplay."  
     - If she says **not verbal**, she's doubling down on Rule B. Key phrases: "There's a fact about whether we *actually* have freedom," or "Reality has a structure that makes compatibilism true or false, regardless of language."  
  3. **Press the inconsistency:** If she says not verbal, ask: "Why is this different from tables? Both seem to be about how we describe arrangements—particles arranged table-wise vs. actions arranged free-will-wise." If she says verbal, ask: "But what about growing-block? That was also metaphysical, and you called it real."  

  This case will force her to reveal whether Metaphysical Realism (Rule B) is her core principle, or if Scientific Essentialism (Rule A) dominates. If she struggles or gives an ad-hoc response, it might confirm that her approach is context-dependent or intuitive rather than rule-based.  

  **Final Thought:** Your friend's judgments suggest she's a **moderate realist**: she sees science as revealing essences (water, mind-brain) and some metaphysics as factual (growing-block), but dismisses "softer" categorizations as verbal. The free will case will test if she's consistent or if her calls are case-by-case. Bring it to lunch—it's perfect for provoking a revealing discussion! If she bites, you might even get her to articulate her rule explicitly.
