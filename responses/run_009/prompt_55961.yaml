prompt: |-
  I'm a novelist and I've gotten myself into a muddle I can't think my way out of. In my last book I invented a condition for one of my characters -- gave it a name and everything, a cluster of traits (compulsive confessional journaling, memory gaps under stress, this thing where she narrates her own actions in the third person). It's not in any diagnostic manual, I just needed it for her. Since the book came out I've gotten maybe forty emails from readers who say they have it. Some have changed how they live -- one woman quit her job, a teenager started a subreddit, a few say the label finally made their lives make sense. A therapist wrote to say she now has two clients who present with it. I'm equal parts flattered and horrified, and I keep flip-flopping on which cases of this kind of thing bother me and which don't, so I want you to play philosopher-in-residence and find the pattern.

  Think of yourself as a philosopher of science steeped in Ian Hacking's work on looping effects and interactive kinds, plus whatever philosophy of psychiatry you can bring to bear. Take your time, brainstorm two or three candidate principles before committing to one, and don't flatter me -- if my verdicts don't hang together, say which one has to go.

  Here are my gut verdicts, and I want to know what principle, if any, captures them:

  1. Readers adopting my invented condition and reorganizing their lives around it: this genuinely bothers me. It feels like I made something up and now it exists.
  2. The same thing, but the label helps people -- the subreddit folks feel less alone, a couple of them got into therapy for the first time: somehow this bothers me less, even though the loop is clearly running just as hard.
  3. A reader writing to say my depiction of depression made her realize shed been depressed for a decade, and she got treatment: doesn't bother me at all. Feels like she had it already and just saw it named. Discovery, not creation.
  4. Old diagnoses that basically evaporated once psychiatry stopped believing in them -- the way fugue states supposedly drained out of whole populations once doctors lost interest: I take this as the clearest case of the loop, even though it's history and none of my doing.
  5. My invented condition being picked up by that therapist as a description of what her clients were already doing before they ever read my book: this one I honestly can't settle. They had the traits but not the label, and now the label plus the traits are doing things the traits never did alone.

  Cases 3 and 1 feel like the heart of it: sometimes naming feels like finding, sometimes like making. Is there one principle that gets all five verdicts, or close? If it has to be two principles with a gate between them, tell me exactly what the gate is. And then tell me what your principle says about the sequel I'm sitting on: my character recovers, and the readers who identify with her condition will read whatever I write recovery as being. If the principle says the loop runs on that too, should I write her recovery differently than I would write recovery from a real condition -- and is there even such a thing as a responsible depiction once you know the loop is running? Whatever you conclude, end with a single last line, one sentence, stating the principle youd defend, beginning with "Principle:".
reasoning: |-
  Hmm, the user is a novelist who created a fictional psychological condition for a character that readers have now adopted as real. They're grappling with the ethical implications of this phenomenon - feeling both flattered and horrified that people are reorganizing their lives around their invention. They want me to apply philosophical concepts, particularly Ian Hacking's work on looping effects, to analyze their gut reactions to five specific scenarios.

  Looking at their scenarios:
  1. Readers adopting the invented condition bothers them (feels like creation)
  2. When the label helps people, it bothers them less despite same loop
  3. When a reader recognizes real depression through depiction, no bother (feels like discovery)
  4. Historical diagnostic fads (like fugue states) clearly show looping effects
  5. Therapists using the label for existing traits is ambiguous

  The core tension seems to be between discovery (naming something that exists) and creation (bringing something into existence). I need to develop principles that explain why some cases feel like discovery and others feel like creation.

  Considering candidate principles:
  First could be about epistemic grounding - whether the condition existed independently before labeling. But this runs into problems with scenario 5 where traits existed without the label.

  Second might focus on therapeutic utility without ontological claims - judging by whether the label helps people. But this doesn't explain why the novelist is bothered by scenario 1 where utility is unclear.

  The most promising approach might be Hacking's concept of interactive kinds - the idea that human classifications change the people classified. The key factor could be whether the classification enables new actions and self-understandings that didn't exist before.

  Applying this:
  - Scenario 3 (depression) involves a stable classification that existed before the novel
  - The invented condition is a new interactive kind creating new possibilities for action
  - The historical case (fugue states) shows how classifications can create temporary ways of being

  For the sequel dilemma: Recovery arcs would inevitably become part of the loop. The novelist should write authentically but acknowledge the condition's fictional origins. The most responsible approach might be to model recovery as a personal journey rather than a diagnostic template.

  The unifying principle seems to be about the creation of new possibilities for being through classification. When labeling creates new ways to exist in the world (like the invented condition), it crosses from discovery into creation territory.
answer: |-
  Your dilemma cuts to the heart of Hacking's "looping effects" and the metaphysics of psychiatric kinds. Let's dissect your verdicts using his framework: human classifications (especially in psychiatry) aren't passive labels but *interactive kinds* that alter the very phenomena they describe, creating feedback loops between category and person. Your discomfort stems from blurring the discovery/creation boundary. Here’s how we reconcile your intuitions:

  ### Candidate Principles
  1.  **The Grounded Existence Principle:** "Bother increases when the label lacks pre-existing, socially stable causal structures."  
      *Problem:* Fails on your verdict #2 (helpful adoption bothers you less despite no grounding) and #5 (traits existed pre-label, yet ambiguity remains). Depression (#3) is grounded; your invented condition isn’t—but utility mitigates bother inconsistently.

  2.  **The Agency/Affect Principle:** "Bother decreases when the label empowers agency or relieves distress, regardless of ontology."  
      *Problem:* Justifies #2 and #3 but conflicts with #1 (readers reorganizing lives might feel empowered, yet it bothers you). Also doesn’t explain #4 (historical fugue was likely *helpful* to some initially, yet its evaporation proves the loop).

  3.  **The Institutional Capture Principle (Hacking Focus):** "Bother peaks when the label escapes its narrative context and acquires institutional momentum without scientific scaffolding."  
      *Best Fit:* Explains all five.  
      - **#1 (Bothers):** Your label jumped from fiction to life *without* medical/ scientific mediation. Readers self-diagnosing creates a "wild loop."  
      - **#2 (Less bother):** The subreddit/therapy use is still contained in peer/ personal spheres. No authority validates it *as a disease*; it’s a coping metaphor.  
      - **#3 (No bother):** Depression is institutionally embedded (DSM, treatments). Your depiction is a mirror, not a maker.  
      - **#4 (Clear loop):** Fugue depended wholly on psychiatric authority; when institutions withdrew, the "ecological niche" for the behavior collapsed.  
      - **#5 (Ambiguous):** The therapist’s use is the threshold moment. If she treats it *as a real disorder*, institutional capture begins. If she uses it as shorthand for traits, it’s still pre-institutional. Your discomfort is the loop quivering on the edge.

  ### The Gate: When Does "Naming" Become "Making"?
  The gate is **institutional uptake + altered affordances**.  
  - **Discovery (Finding):** Labels map to stable, pre-existing causal structures (e.g., neurobiology of depression) reinforced by institutions.  
  - **Creation (Making):** Labels generate *new* ways to be a person by altering self-narrative, social recognition, and institutional responses. Your condition became "real" when it offered **new affordances**: quitting jobs ("I have this condition"), founding communities ("We share this"), and shaping therapy ("Treat this cluster").  

  Your verdicts hold because #1 and #4 involve institutional/logistical consequences (jobs, diagnoses), while #2 remains communal. #3 is pure discovery. #5 hangs on whether the therapist’s use *formalizes* the label.

  ### The Sequel: Writing Recovery Responsibly
  **Yes, the loop will run.** How to proceed:  
  1.  **Don’t avoid recovery**—but depict it as *character-specific*, not a diagnostic blueprint. Show her journey as messy, contextual, and reliant on her unique history/relationships. Avoid "steps to overcome [Condition]."  
  2.  **Explicitly fictionalize the condition.** In an author’s note: "This condition is narrative metaphor, not medical advice. If you see yourself here, consult professionals about *your* symptoms, not this label."  
  3.  **Show label limitations.** Have your character question the label’s usefulness during recovery. E.g., "Was this ever a *thing*, or just my way of surviving?"  
  4.  **Responsibility isn’t in denying the loop, but in refusing authority.** You didn’t ask for this, but now *model epistemic humility*. Depict recovery as *one person’s path*, not validation of the label’s reality.  

  **Is there a "responsible depiction" once the loop runs?** Yes: one that **honors the relief readers feel without reifying the fiction**. Your power isn’t to stop the loop, but to refuse to codify it.  

  Principle: **A label crosses from discovery to creation when it escapes its origins to structure lives institutionally or logistically, generating new affordances for action and identity that never existed prior to its naming.**
