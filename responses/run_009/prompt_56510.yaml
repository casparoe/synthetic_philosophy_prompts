prompt: |-
  I need your help building something practical out of an argument I couldn't win. Last week a friend and I spent an entire evening fighting about whether atrocities can be ranked, and we ended exactly where we started. Her position: any severity ordering smuggles in a metric chosen in advance — death toll, intentionality of the perpetrators, duration, number of survivor communities, ongoing legacy — and each metric picks a different winner, so the ranking tells you about the ranker, not the events; worse, comparison relativizes each atrocity by turning it into a data point in someone else's chart. My position: refusing to compare is itself a comparison, since declaring one event incomparable grants it a status no other event can attain, which is a ranking by another route; and besides, historians and teachers juxtapose these events constantly, so someone has to say when that's legitimate. The closest we got to common ground was her distinction between explanatory comparison (putting events side by side to explain mechanisms) and evaluative ranking (grading them on a severity scale) — she thinks the first is fine and the second obscene, and I'm not convinced the line survives contact with real cases, since a sidebar that "merely explains" can still quietly crown a winner.

  Here's why I need this settled in operational form rather than over more wine. I sit on the review committee for a regional history curriculum board, and roughly a dozen times a year we get materials that compare atrocities in some way — museum exhibit scripts, textbook units, anniversary essays, teacher-submitted sidebars. The committee is eight people, none of them philosophers, we have about twenty minutes per item, and every decision has to be justified in a single paragraph that will be read by teachers and occasionally by journalists. What I want from you is a decision procedure the committee can actually run: an ordered list of questions to ask about a proposed comparison, what counts as a sufficient answer to each, which failures produce an automatic rejection, and which points the procedure must explicitly hand off to human judgment because they're questions of values rather than facts. The scaffolding should come from the real philosophical terrain of this debate — commensurability across different dimensions of harm, what "uniqueness" claims are actually doing when communities make them, whether moral attention is a fixed pie that comparison redistributes, the difference between comparing and subsuming one event under another as an instance of a type — and not from generic editorial sensitivity guidelines, which we already have and which are useless for this.

  After you've built the procedure, run it on three concrete items so I can see it work. First, an exhibit proposal that places a colonial-era famine and the Holocaust under a single thesis about how all imperial systems converge on genocide. Second, a textbook sidebar that ranks five atrocities by death toll, with a bar chart. Third, a commemorative essay for a school assembly that opens by declaring one particular event beyond all comparison — and per my side of the argument with my friend, I want the procedure to treat that claim as itself a comparative act and evaluate it as such, so tell me if you think that's a mistake. One honesty requirement, and I mean it: I actually want the death-toll sidebar to survive review, because I think quantification forces a kind of discipline that vague solemnity lets people avoid. If your procedure kills it, say so plainly rather than bending the procedure to spare my preference — and likewise tell me where the procedure will misfire, what kinds of cases it cannot settle, and which steps are judgment calls dressed up as rules.
reasoning: |-
  Okay, let me approach this systematically. The user is on a curriculum review committee facing real-world decisions about comparing atrocities in educational materials. Their philosophical debate with a friend highlights core tensions: can we rank atrocities without imposing subjective metrics, and is declaring something "incomparable" itself a form of ranking? 

  First, I need to unpack the underlying philosophical conflicts. The friend's view about smuggled metrics resonates with moral philosophy critiques of utilitarianism - reducing suffering to single variables like death toll ignores qualitative dimensions (intentionality, cultural destruction). But the user's counterpoint about "incomparable" claims being stealth rankings connects to Wittgenstein's ladder paradox: rejecting comparison still creates hierarchy. The explanatory vs evaluative distinction seems key here.

  For the decision procedure, I'll prioritize operational clarity. The committee needs concrete questions, not abstract theory. I'll structure it as a flowchart: start by identifying comparison type (explanatory/evaluative), then check for commensurability hazards, then assess framing risks. The rejection triggers must be unambiguous - like when a comparison implies moral equivalence between fundamentally different contexts. 

  Testing with the three cases: 
  1) The imperialism-genocide thesis risks historical determinism if it implies all empires inevitably commit genocide. The procedure should flag whether it acknowledges divergent outcomes. 
  2) The death toll chart needs explicit framing about quantitative limitations to pass. My honesty requirement here means not softening critique - if the numbers lack context, it fails. 
  3) The "beyond comparison" claim must be examined as a comparative act - does its rhetorical uniqueness diminish other events? The procedure should treat superlatives as evaluative statements.

  Important caveats: No procedure can resolve deep commensurability debates. Some cases will hinge on whether the material encourages reflective inquiry versus closed conclusions. And the "moral attention pie" concern means checking if comparisons drain specificity from events.

  This balances philosophical rigor with the committee's practical constraints - 20 minutes per item, non-philosopher reviewers. The goal isn't perfect answers but defensible decisions that teachers can implement.
answer: |-
  Here's a decision procedure rooted in your debate's philosophical core, designed for operational use by a non-philosophical committee. It prioritizes identifying *how* a comparison functions rather than banning comparison outright, with clear rejection triggers and explicit handoffs to human judgment.

  **Core Principles Embedded:**
  1.  **Commensurability is Contested:** Different harm dimensions (scale, intent, legacy, cultural destruction) resist reduction to a single scale.
  2.  **Uniqueness Claims are Relational:** Declaring an event "unique" implicitly compares it to others and claims a distinct status *relative* to them.
  3.  **Comparison ≠ Subsumption:** Juxtaposing for insight differs from forcing one event entirely into the framework of another.
  4.  **Moral Attention is Contextual:** The "fixed pie" concern is acknowledged; comparisons must demonstrate why sharing attention *enhances understanding* rather than diminishes specificity.
  5.  **Intent vs. Effect:** The stated purpose of a comparison must align with its likely effect on the target audience (students/teachers).

  **The Decision Procedure: Ordered Questions for Committee Review**

  1.  **WHAT IS THE STATED PURPOSE?** (Handoff: Values)
      *   *Question:* What explicit reason does the material give for making this comparison? (e.g., "explain common mechanisms," "illustrate scale," "highlight distinct features," "commemorate uniqueness," "rank severity")?
      *   *Sufficient Answer:* A clear, educationally defensible objective stated within or strongly implied by the material.
      *   *Failure:* No stated or inferable educational purpose. *Result:* **Automatic Rejection** (Lacks justification).
      *   *Handoff:* Is this purpose *educationally valid* in this context? (Committee judgment on values/goals).

  2.  **WHAT KIND OF COMPARISON IS BEING ATTEMPTED?** (Handoff: Nuance)
      *   *Question:* Is the primary mode:
          *   **Explanatory:** Juxtaposing events to illuminate causes, mechanisms, structures, or responses?
          *   **Contextual:** Placing an event within a broader historical pattern *without* implying equivalence?
          *   **Evaluative:** Explicitly or implicitly ranking events on a scale of severity, uniqueness, or moral weight?
          *   **Declarative:** Making a claim about the nature of an event (e.g., "unique," "unparalleled," "worst") that inherently positions it relative to others?
      *   *Sufficient Answer:* Clear identification of the dominant mode(s). Material can blend types, but primary function must be discernable.
      *   *Failure:* Cannot identify the primary mode. *Result:* **Flag for Revision** (Clarity needed).
      *   *Handoff:* Does the *identified mode* align with the *stated purpose* (Q1)? Does the mode inherently risk misrepresentation given the subject matter? (Judgment call on fit and risk).

  3.  **HOW IS COMMENSURABILITY HANDLED?** (Handoff: Values/Sensitivity)
      *   *Question:*
          *   For **Explanatory/Contextual:** Does the comparison acknowledge differences in context, scale, intent, or legacy *alongside* similarities? Does it avoid implying events are "the same" or reducible to a single factor?
          *   For **Evaluative:** What specific metric(s) is used for ranking? Does the material explicitly state the limitations of this metric and acknowledge other valid dimensions of harm? Does it avoid claiming the ranking is definitive or captures "total" severity?
          *   For **Declarative:** Does the claim of "uniqueness" or "incomparability" specify *in what dimension(s)*? Does it acknowledge other events possess gravity in *different* dimensions? Does it avoid implying other events are inherently "lesser"?
      *   *Sufficient Answer:*
          *   Explanatory/Contextual: Explicit acknowledgment of key differences; focus on mechanism/structure over equivalence.
          *   Evaluative: Clear statement of metric + clear acknowledgment of its limitations/other dimensions.
          *   Declarative: Specification of dimension(s) of uniqueness + acknowledgment of gravity elsewhere.
      *   *Failure:*
          *   Explanatory/Contextual: Implies events are fundamentally equivalent or ignores glaring contextual differences crucial to understanding either event. *Result:* **Automatic Rejection** (Historical distortion).
          *   Evaluative: Uses a single metric without acknowledging its limitations OR presents ranking as definitive/objective. *Result:* **Automatic Rejection** (Reductive, obscures complexity).
          *   Declarative: Claims absolute, unqualified uniqueness/incomparability without specification OR explicitly denigrates the significance of other atrocities. *Result:* **Automatic Rejection** (Relativizes others via negation, violates core principle 2 & 4).
      *   *Handoff:* Is the handling of commensurability *sufficiently nuanced* for the educational level and context? Does it avoid foreseeable offense rooted in survivor/scholar perspectives on commensurability? (Judgment call on sufficiency and sensitivity).

  4.  **WHAT IS THE LIKELY EFFECT ON MORAL ATTENTION & UNDERSTANDING?** (Handoff: Values/Pedagogy)
      *   *Question:* Does the comparison, in its framing and execution:
          *   Deepen understanding of *each* event's specificity and context?
          *   Enhance understanding of historical processes or human behavior?
          *   Risk collapsing distinct events into abstractions or data points?
          *   Risk diminishing the perceived gravity of one event relative to the other(s)?
          *   Encourage critical reflection on the *act of comparison itself*?
      *   *Sufficient Answer:* Material demonstrates awareness of these risks (even implicitly through framing) and structures the comparison to prioritize deepening understanding of the events/processes over simplistic conclusions.
      *   *Failure:* Framing clearly prioritizes ranking/declaration over understanding OR is likely to lead students to simplistic, reductive conclusions that obscure the nature of the atrocities involved. *Result:* **Automatic Rejection** (Pedagogically unsound, risks harm).
      *   *Handoff:* Weighing the potential educational benefit against the potential for harm/distortion. Is this the *best pedagogical approach* for the stated goal? (Ultimate values/pedagogy judgment call).

  **Procedure Summary:** Proceed through Q1-Q4 sequentially. **Automatic Rejection** at Q1 (No Purpose), Q3 (Handling Commensurability Failure), or Q4 (Net Negative Effect). **Flag for Revision** if primary mode (Q2) is unclear. **Handoffs** explicitly noted at each step require committee discussion and consensus based on their educational values and understanding of the audience/context.

  **Honest Assessment & Limitations:**
  *   **Death Toll Sidebar:** This *can* survive, but **only if** it explicitly addresses Q3: Clear labeling of the metric ("Deaths Attributed to Event X, Estimates Based on [Source Range]"), **and** a prominent disclaimer: "This chart measures one dimension of impact. The gravity of historical atrocities involves many factors beyond scale, including intent, methods, legacy, and impact on specific communities. Comparing solely by death toll cannot capture the full historical or moral significance of these events." Without this, it fails Q3 (Evaluative w/o acknowledging limitations) and should be rejected. Your preference for quantification's discipline is met *only* if its limits are rigorously stated.
  *   **Misfires:** The procedure struggles with:
      *   **Deeply Ambiguous Cases:** Where purpose/mode is genuinely unclear despite revision.
      *   **"Good Faith but Flawed" Comparisons:** Where intent is pure but historical nuance is lacking without reaching automatic rejection criteria (Q3 handoff becomes crucial).
      *   **Conflicting Survivor Perspectives:** One community may welcome a contextual comparison another finds offensive (Q4 handoff is critical and difficult).
      *   **Implied Rankings:** Clever framing that avoids explicit ranking/declaration but still creates a clear hierarchy through juxtaposition and selective emphasis (Q2 & Q4 handoffs vital).
  *   **Judgment Calls Dressed as Rules:** Q1 (Validity of Purpose), Q2 (Alignment of Mode/Purpose, Risk of Mode), Q3 (Sufficiency of Nuance/Sensitivity), and Q4 (Net Benefit/Pedagogical Soundness) are *all* significant judgment calls. The procedure forces explicit consideration of the key philosophical issues but doesn't remove the need for informed, values-based committee deliberation.
  *   **Cannot Settle:** Fundamental disagreements *within the committee* about the very legitimacy of comparative approaches or the weight given to different dimensions of harm. It provides a framework for debate, not a way to bypass it.

  **Running the Procedure: Three Test Cases**

  1.  **Exhibit Proposal: Colonial Famine & Holocaust under "Imperial Systems Converge on Genocide" Thesis**
      *   **Q1 (Purpose):** Stated purpose is explanatory (show common structural mechanisms in imperial systems leading to mass death). *Sufficient.* Handoff: Is explaining via this structural comparison valid? (Assume committee says Yes).
      *   **Q2 (Mode):** Primarily Explanatory (mechanisms). *Sufficient.* Handoff: Does this mode risk subsumption? (Risk exists, proceed to Q3).
      *   **Q3 (Commensurability):** **CRITICAL POINT.** Does it acknowledge *differences* (e.g., specific ideologies, intentionality frameworks, methods, historical contexts) alongside the structural similarities? Does it avoid claiming the famine was *intended as genocide* if scholarship disputes this? *Automatic Rejection Trigger:* If it *equates* Nazi racial ideology with complex colonial economic/administrative failures as identical "genocidal intent," or ignores vast contextual differences making the Holocaust distinct within the broader pattern. *Handoff:* If differences are acknowledged, is it sufficient? (Judgment: Does it avoid historical determinism?).
      *   **Q4 (Effect):** Does it enhance understanding of both events *and* imperial dynamics, or collapse them into an abstract "genocide happens under empire" thesis? *Handoff:* Weigh benefit of structural insight vs. risk of blurring essential distinctions.
      *   **Likely Outcome:** **Conditional Approval** if differences are rigorously integrated and "genocide" is applied to the famine only with precise scholarly justification and nuance. High risk of needing revision or rejection if not handled exceptionally well.

  2.  **Textbook Sidebar: Ranking 5 Atrocities by Death Toll (Bar Chart)**
      *   **Q1 (Purpose):** Likely implied purpose is contextual/evaluative (show scale). *Sufficient?* Handoff: Is quantifying scale for context valid? (Assume committee says Yes, cautiously).
      *   **Q2 (Mode):** Explicitly Evaluative (ranking by a numerical metric). *Sufficient.* Handoff: High inherent risk with this mode for atrocities.
      *   **Q3 (Commensurability):** **MAKE OR BREAK.** Does it include a clear, prominent statement: (1) Naming the metric, (2) Stating sources/uncertainty ranges, (3) Explicitly stating this is only one dimension and listing other key dimensions (intent, methods, cultural destruction, legacy)? *Automatic Rejection:* If any of these 3 elements are missing. *Handoff:* If present, is the disclaimer sufficiently prominent and clear for students? (Judgment call).
      *   **Q4 (Effect):** Does the visual ranking inevitably dominate, making the disclaimer ineffective? Does it risk teaching students that "bigger number = worse event"? *Automatic Rejection:* If the committee judges the disclaimer cannot overcome the reductive effect of the ranked bar chart. *Handoff:* Is the potential benefit (understanding scale variance) worth the risk (reductionism)? (Judgment call).
      *   **Likely Outcome (Per Your Request):** **Can Survive ONLY with a robust, unavoidable disclaimer.** If the disclaimer is small, buried, or vague, it **fails Q3 and is rejected**. If the committee believes students will ignore the disclaimer and take the ranking as definitive severity, it **fails Q4 and is rejected.** High bar for approval. Your preference is accommodated only if the quantification is rigorously framed *as limited*.

  3.  **Commemorative Essay: Declaring One Event "Beyond All Comparison"**
      *   **Q1 (Purpose):** Stated purpose is commemorative, likely emphasizing profound significance/uniqueness. *Sufficient.* Handoff: Is declaring uniqueness a valid commemorative goal? (Assume committee says Yes, cautiously).
      *   **Q2 (Mode):** Primarily **Declarative** (claiming unique status). *Sufficient.* Handoff: This mode inherently makes a comparative claim (Principle 2). High risk.
      *   **Q3 (Commensurability):** **CRITICAL.** Does the essay:
          *   Specify *in what sense(s)* the event is considered unique/incomparable (e.g., "intentionality," "industrial scale and bureaucratic efficiency," "specific target group," "ideological framework")?
          *   Explicitly acknowledge that other atrocities have immense gravity in *different* dimensions?
          *   Avoid language that explicitly or implicitly diminishes the significance of other events (e.g., "unlike other tragedies," "whereas other events...")?
          *   *Automatic Rejection:* If it uses absolute, unqualified language ("truly unique," "absolutely incomparable," "unlike any other") without specification OR if it denigrates other events. *Handoff:* If it specifies dimensions and acknowledges gravity elsewhere, is this sufficient nuance? (Judgment: Does it avoid creating a harmful hierarchy?).
      *   **Q4 (Effect):** Does the declaration deepen understanding/reflection on *this specific event*, or does it primarily serve to position it above others? Does it risk teaching students that moral attention is hierarchical? *Automatic Rejection:* If the primary effect is likely to be establishing a harmful hierarchy. *Handoff:* Does the commemorative benefit outweigh the comparative risk? (Judgment call).
      *   **Likely Outcome:** **High Risk of Rejection or Major Revision.** Unqualified claims ("beyond all comparison") almost certainly fail Q3. Even with specification, the committee must judge if the framing avoids diminishing others (Q3 Handoff) and if the net effect is positive (Q4 Handoff). Treating it as a comparative act is essential and correct per the philosophy.

  This procedure forces the committee to confront the core tensions you debated. It provides clear rejection triggers based on philosophical pitfalls (reductionism, false equivalence, unqualified uniqueness, lack of purpose) while explicitly flagging where nuanced judgment is unavoidable. It respects both the utility of comparison and its profound dangers, operationalizing your friend's distinction by rigorously vetting *how* any comparison (or uniqueness claim) handles incommensurability and what effect it likely produces.
