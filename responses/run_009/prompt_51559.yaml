     better_analogy: 
        source: "memory"
        testimony_as: "socially extended memory"
        breaks_at: "the involvement of multiple agents and the possibility of deception"

  But note that memory is already used as a component in the analogy.

  Alternatively, we might use the analogy of vision in a mirror. The mirror reflects the original. But then it's a copy, and we have to trust the mirror. This is closer to the reductionist's chain.

  After reflection, I think the perception analogy is still the primary one, and we just have to accept the disanalogies and adjust accordingly.

