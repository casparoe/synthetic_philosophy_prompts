prompt: |-
  In the epistemology of testimony seminar I help run, the anti-reductionist side keeps winning arguments with one analogy: accepting a speaker's word is like accepting perceptual experience. You do not first establish that your eyes are reliable before trusting them, the story goes; perceptual appearances carry default entitlement, and rejecting or defeating that entitlement requires positive grounds. If testimony is a parallel channel of belief-formation — a further faculty, alongside perception and memory, for getting information from the world — then the Humean demand that each hearer reconstruct inductive credentials for trusting speakers is misplaced: it is the demand that one do with testimony what nobody does with vision. The reductionist side fires back with its own picture: testimony is not a fresh channel but a chain of secondhand reports, each a copy of a copy, which must eventually borrow its warrant from unassisted observation by someone upstream, and which therefore stands to perception more as a photograph of a photograph does than as an eye does.

  I am not convinced either picture is doing the work its users assign to it. The perception analogy seems to me to import a lot: that the source of the information is not an agent with interests, that the channel can be bad but not deceptive, that there is no analogue of the possibility of asking the source again, that the subject could not have gotten the content any other way. Some of these look load-bearing for the default-entitlement conclusion and some look incidental, but I cannot sort which is which, and neither side in our discussions has tried.

  Please audit both analogies and give me the result as a JSON object with the following fields:

  - "mapping": an array of objects, one per substantive point of the perception analogy, each with fields "perception_side", "testimony_side", and "holds", where "holds" takes the value "yes", "partly", or "no", plus a one-sentence "comment". Cover at least: the information source and whether it has intentions; entitlement arising from the channel's constitution versus from evidence about its reliability; the role of defeaters; the possibility of re-querying or clarifying the source; and memory as the hard intermediate case (a channel with no agent at the far end that still somehow carries content from the past).
  - "disanalogies": an array of objects with fields "feature", "load_bearing" (true or false), and "why". "Load_bearing" should mean: were this disanalogy taken seriously, it would undermine the specific conclusion the analogy is used to license — that hearers have default, non-reductive entitlement to accept testimony. Distinguish these from disanalogies that are real but idle for that purpose.
  - "reductionist_picture_audit": a short string assessing whether the chain-of-copies image is better than its rival — in particular whether it can accommodate cases where the information could never have been observed by anyone (e.g., testimony transmitting skills or standards rather than observed facts), and whether it smuggles in an atomism about reports that actual chains of corroboration and institutional transmission do not have.
  - "verdict": a string stating whether the default-entitlement conclusion survives once the disanalogies are on the table, and whether it survives in full, in weakened form, or only for restricted kinds of testimony.
  - "better_analogy": an object with fields "source" and "testimony_as" naming, if there is one, a better comparison than either of the two in play, and a field "breaks_at" saying where even that one gives out.

  Please confine yourself to what you can argue from first principles and the standard case material of this debate (Reid's and Hume's original positions, the contemporary reductionism/anti-reductionism dispute of the sort Coady and Burge frame); do not pad the answer with surveys or reading lists.
reasoning: |-
  We are given two analogies: the perception analogy (anti-reductionist) and the chain-of-copies (reductionist). The goal is to audit both and produce a JSON object with specific fields.

  First, let's break down the perception analogy as used by anti-reductionists:

  Anti-reductionist claim: Testimony, like perception, is a basic source of belief that carries default entitlement. We don't need to first establish the reliability of the source (as we don't for perception) to be entitled to believe it. Defeaters can override, but the starting point is trust.

  Now, the reductionist picture: Testimony is a chain of reports, each one copying from another, and thus the warrant must ultimately come from someone's direct observation. This is like a photograph of a photograph, which degrades and must be traced back to an original.

  We are to analyze:

  1. Mapping of the perception analogy (point by point)
  2. Disanalogies and whether they are load-bearing for the default entitlement conclusion.
  3. Audit of the reductionist picture (chain-of-copies).
  4. Verdict on whether default entitlement survives.
  5. Suggestion for a better analogy.

  Let's start with the mapping for the perception analogy. We are to cover at least:

  - The information source and whether it has intentions.
  - Entitlement arising from the channel's constitution vs. from evidence about reliability.
  - The role of defeaters.
  - The possibility of re-querying or clarifying the source.
  - Memory as the hard intermediate case.

  We'll create an array of objects for each point.

  Point 1: Source and intentions
     Perception_side: The source of perceptual experience is the world (or the object) and it does not have intentions (it's not an agent).
     Testimony_side: The source is a speaker (an agent) who has intentions and may deceive or have interests.
     Holds? No, because in testimony the source is an agent with intentions, which can affect the reliability in a way that perception does not.

  Point 2: Entitlement source
     Perception_side: Entitlement to believe perceptual experiences arises from the very constitution of our perceptual faculties (we are wired to trust them by default).
     Testimony_side: Anti-reductionists claim similarly that testimony is a faculty that by default entitles us to believe. Reductionists say we need evidence of reliability.
     Holds? Partly. Anti-reductionists want to say yes, but the constitution of testimony might be different because it involves social practices and agents. However, if we take Reid's view, we are naturally disposed to trust testimony just as we trust perception. So it might hold in the way the anti-reductionist intends, but with caveats about the social nature.

  Point 3: Role of defeaters
     Perception_side: We are entitled to believe unless there are defeaters (e.g., bad lighting, known illusions). The burden is on the defeater.
     Testimony_side: Similarly, we are entitled to believe unless there are defeaters (e.g., the speaker is known to be lying, or the content is implausible).
     Holds? Yes. Both allow for defeaters to override the default entitlement.

  Point 4: Possibility of re-querying or clarifying
     Perception_side: We cannot re-query the object (e.g., ask the rock to show itself again). We can look again, but that's a new perceptual act.
     Testimony_side: We can ask the speaker for clarification or repetition. This is a unique feature of testimony.
     Holds? No. The ability to re-query is present in testimony but not in perception.

  Point 5: Memory as the hard intermediate case
     Perception_side: Not directly about perception, but memory is often considered a basic source. Memory has no agent at the far end and carries content from the past. It is a channel that we trust by default.
     Testimony_side: Memory is a component in testimony because the speaker must remember what they are reporting. But testimony also involves communication from an agent. Anti-reductionists might see memory as a parallel: just as we trust memory without proof of reliability, we should trust testimony.
     Holds? Partly. Memory is indeed a non-agent channel and is often taken as having default entitlement. But testimony is more complex because it involves an agent and communication. However, if we consider the chain, memory is involved in the speaker and the hearer. The analogy might hold in that memory is a non-agent channel that we trust by default, and testimony might be seen as extending that. But it's not exactly the same because of the agent in between.

  Now, disanalogies: We are to list features that are disanalogies and say whether they are load-bearing for the default entitlement conclusion. Load-bearing means that if we take the disanalogy seriously, it would undermine the conclusion that hearers have default entitlement.

  Disanalogy 1: Source has intentions (as above). 
     Why load-bearing? If the source is an agent with intentions, then the possibility of deception (lying) or bias exists in a way that it doesn't for perception. This could require us to have positive reasons to trust the speaker (to rule out deception) and thus undermine default entitlement. So load-bearing: true.

  Disanalogy 2: The channel can be deceptive (not just bad, but actively misleading). 
     Why load-bearing? In perception, the channel (e.g., the eye) might malfunction, but it doesn't deceive intentionally. In testimony, the speaker can lie. This might require the hearer to have reasons to think the speaker is sincere, which would break default entitlement. So load-bearing: true.

  Disanalogy 3: The possibility of re-querying the source. 
     Why load-bearing? This might not be directly load-bearing for default entitlement. The default entitlement could still hold even if we can ask for clarification. It just gives an extra way to check. So we might say load-bearing: false.

  Disanalogy 4: The subject could have gotten the content by other means (e.g., perception) in some cases, but not always. 
     Why? This doesn't seem to directly affect default entitlement. The anti-reductionist claim is about the source of the belief, not about whether it could be acquired otherwise. So load-bearing: false.

  But note: the anti-reductionist might argue that testimony is a basic source just like perception, so even if the content could have been gotten by perception, that doesn't change the fact that when we get it by testimony, we are entitled by default. So this disanalogy might be idle.

  Disanalogy 5: Testimony can transmit non-observational content (e.g., skills, standards, abstract ideas) that perception alone cannot. 
     Why? This might not be load-bearing for the default entitlement about factual testimony, but it might show that the reductionist picture (which relies on observation) is inadequate. For the perception analogy, it might not break it because the anti-reductionist can say that testimony is a source for a wider range of content. So for the specific conclusion (default entitlement for testimony) this disanalogy might not be load-bearing. Load-bearing: false.

  Now, reductionist picture audit: We are to assess the chain-of-copies image.

  The reductionist picture (like Hume) says that testimony is a chain that must be traced back to observation. But:

  - Can it accommodate testimony that transmits skills or standards? These are not observed facts. For example, how to ride a bike is a skill that is demonstrated and practiced, not observed in the sense of a fact. Similarly, moral standards are transmitted by testimony but are not observed. This seems problematic for the reductionist picture because it requires that everything be reducible to observation.

  - Does it smuggle in atomism? That is, does it treat each report in isolation? In reality, testimony often comes with institutional backing, multiple chains of corroboration, and social practices that ensure reliability. The reductionist might require each link to be individually justified, but in practice we rely on the whole system. So the chain-of-copies image might be too simplistic.

  Thus, the reductionist picture has weaknesses: it cannot easily accommodate non-observational content and it ignores the holistic and social nature of testimonial practices.

  Verdict: Does default entitlement survive?

  Considering the disanalogies, especially the load-bearing ones (source has intentions and can be deceptive), we might have to weaken the default entitlement. It might be that we have a default entitlement but with a higher burden of defeaters (e.g., we need to be alert to signs of deception). Or it might be that default entitlement holds only in restricted contexts (e.g., when we have no reason to doubt, or within a community of trust). 

  Anti-reductionists like Reid and Burge argue that we are naturally disposed to trust, and that this is necessary for the acquisition of language and knowledge. So the default entitlement might survive in a weakened form: we are entitled to trust unless there are specific defeaters, but the nature of testimony (being from an agent) means that the set of defeaters is broader than for perception.

  But note: Burge (in his "Content Preservation") argues for a default entitlement for testimony that is similar to that for memory and perception. He thinks that the fact that the source is rational and that we have a responsibility to filter for rationality does not break the default.

  So verdict: The default entitlement conclusion survives in a weakened form, requiring the hearer to be sensitive to the rationality of the source and to defeaters, but without requiring positive evidence for each testimonial act.

  Better analogy? The anti-reductionist might suggest memory. Memory is a channel that carries content from the past without an agent at the source. It is a basic source and we trust it by default. But memory is individual, while testimony is social. Also, memory can be deceptive (e.g., false memories) but not intentionally. 

  Another candidate: perception of instruments. For example, trusting a thermometer. We don't check the thermometer's reliability every time, but we know it is designed to be reliable. Similarly, testimony might be seen as a social instrument. But then we have to trust the designer (the speaker) and the design (the language).

  However, the instrument analogy might break because the instrument is not an agent. So we might say:

     Source: instrument (like a thermometer) 
     Testimony_as: instrument reading

  But then the instrument doesn't have intentions, but it was made by agents. So we might have to trust the maker. This becomes a chain.

  Alternatively, a better analogy might be memory in a social context? But that's vague.

  Perhaps the best analogy is to perception of facial expressions or gestures? These are natural signs that we interpret, and we do so by default. But again, they are produced by agents.

  Given the difficulties, perhaps there isn't a clearly better analogy. But we can propose:

     Source: memory
     Testimony_as: social memory

  But social memory still involves agents.

  Alternatively, perception of speech acts? That is, we perceive the utterance and then we interpret it. But the interpretation relies on understanding the speaker's intentions (Grice). So that might not help.

  We might say that the perception analogy is the best available, but with the disanalogies noted.

  But the problem set asks for a better analogy if there is one. Let's try:

     Source: natural signs (e.g., smoke as a sign of fire)
     Testimony_as: conventional signs (like language)

  But then we have to learn the conventions, which might require induction.

