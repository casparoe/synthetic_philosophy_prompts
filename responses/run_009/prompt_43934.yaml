prompt: |-
  I'd be grateful for your read on a colleague. Professor V. has sat on every committee our university has and has become our informal authority on how a body's collective judgment should track its members' votes. Her rulings to date: on the appointments panel, the two criteria (research, teaching) were voted first, each carried a majority, and a majority then voted against the candidate overall; she ruled the panel was committed to recommending the candidate. On a misconduct panel, both elements of the charge carried majorities before a majority voted to dismiss; she ruled the panel bound to uphold the charge and had the dismissal vote struck from the minutes as out of order. On an appeals board that votes only on the final disposition, she accepted the majority verdict as the board's judgment without objection, remarking only that no premises had been put to it. And asked whether a committee could be committed to a conjunction that no individual member accepts, she said that this is simply what committees are. Two questions are now before her. First: a hiring committee voted on the overall recommendation first — no hire carried — and only afterward on the criteria, where majorities judged both research and teaching excellent; is the earlier vote binding? Second: a curriculum committee is split on what even counts as a premise — half treat projected enrollment as a premise in the cancel-or-retain decision, half do not — and the outcome under majority voting depends on which premise set gets used. Please reply as a numbered list of exactly five items, each a sentence or two, with no introduction or conclusion: (1) the rules her record is consistent with, stated precisely; (2) what each rule predicts for the no-hire case; (3) what each predicts for the curriculum case; (4) your best guess as to her rulings and your reasons; (5) the single further case that would most cleanly divide the candidate rules.
