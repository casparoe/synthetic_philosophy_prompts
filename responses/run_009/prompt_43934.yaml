  (1) Her rulings consistently follow two rules: (a) If a committee votes by majority to accept all premises of a conclusion (treated as a conjunctive set), it is logically committed to that conclusion, rendering any subsequent direct vote against the conclusion invalid; (b) If a committee votes directly on the conclusion before establishing premises via majority vote, that conclusion vote is binding regardless of later premise votes.

  (2) For the no-hire case: Rule (a) does not apply as premises were voted *after* the conclusion. Rule (b) applies directly: the initial "no hire" vote on the conclusion is binding, making the later criteria votes irrelevant to the outcome.

  (3) For the curriculum case: Rule (a) requires first settling the premise set by majority vote (i.e., whether projected enrollment is a premise). Only then, if all premises in the accepted set carry a majority, does it bind the conclusion. Rule (b) does not apply here as no direct conclusion vote occurred under an agreed premise set.

  (4) Prediction: She will uphold the "no hire" (rule b: conclusion voted first) and require the curriculum committee to first vote on whether projected enrollment is a premise (rule a: premise set must be established logically prior). This fits her pattern of enforcing logical sequence and premise-conclusion commitment over direct votes on conclusions after premises pass.

  (5) The critical test case: A committee votes by majority to accept three premises (P1, P2, P3) individually, then a majority votes against the conclusion (C) that logically follows from P1∧P2∧P3. Her rule (a) would mandate upholding C despite the vote, cleanly dividing from rules allowing the direct vote to override.
