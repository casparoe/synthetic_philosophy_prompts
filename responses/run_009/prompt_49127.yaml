  Hmm, the core tension they're highlighting is interesting: people claim they'd care if a beloved artwork turned out fake, yet admit the aesthetic experience was identical before knowing. That cognitive dissonance is exactly what the quiz should probe through concrete cases.

  First, I need to map the theoretical landscape logically before designing questions. The key axes seem to be:
  - Does aesthetic value depend solely on sensory experience?
  - Does causal origin matter? (And if so, is it about artist's intention or material history?)
  - Is forgery primarily an economic fraud or an aesthetic violation?

  Now for positions to cover:
  1) Radical empiricism ("if indistinguishable, identical value")
  2) Goodman's strict authentication view ("undetected fakes are temporarily artworks")
  3) Causal essentialism ("provenance is constitutive")
  4) Expression/intentionalism ("fraud corrupts artistic expression")
  5) Sentimental deflationism ("only economic/symbolic value changes")

  I should note that empirically distinguishing 1 and 2 might be impossible - both agree undiscovered fakes have full aesthetic value, just disagree on semantics. The quiz should acknowledge this limitation.

  For cases, the user gave great starters: museum swaps, reattributions, workshop pieces, artist copies, and exposed forgeries praised earlier. I'll build around these with variations that force tradeoffs. Each question needs:
  - Concrete, vivid scenario
  - 2-3 intuitive answer choices
  - No theory jargon whatsoever

  Scoring should be transparent - assign points to each answer's alignment with positions, then tally. The reveal should feel like a "aha!" moment showing their underlying principles.

  Tone is crucial. Must avoid academic dryness. Playful wording like "Your friend declares..." or "Suddenly, experts reveal..." keeps it light. The end mapping should explain why certain answers cluster into coherent worldviews, including why some combinations are rare (e.g. "cares about museum provenance but not workshop participation" might indicate inconsistent priorities).

  Finally, I'll flag where the quiz has limits - like not cleanly separating empiricism from Goodman, or capturing hybrid views. Honesty about imperfections makes it more credible.
answer: |-
  Here’s a quiz designed to tease out your readers’ hidden theories about originality in art through intuitive cases, with a scoring key mapping answers to philosophical positions. No prior theory knowledge needed—just gut reactions!

  ---

  ### **The "How Much Does the Original *Really* Matter?" Quiz**
  *For each scenario, pick the answer closest to your instinct. No overthinking!*

  1.  **The Midnight Swap:** A perfect, undetectable copy of a famous painting is secretly swapped into a museum. Nobody notices for years. People adore it just like the original.
      *   **A)** The artwork *loses its magic* once we know it’s a copy (even if it looks identical).
      *   **B)** It’s *still a masterpiece* – the experience was real, the beauty unchanged.
      *   **C)** It becomes *just a skillful fake* – interesting, but not the real thing.

  2.  **The Dusty Attic Find:** A charming, unknown landscape painting (thought to be by "Anon.") hangs in a small museum. New evidence proves it’s by a hugely famous master. The painting looks *exactly the same*.
      *   **A)** It suddenly becomes *far more significant and valuable*.
      *   **B)** Its beauty and meaning *stay the same* – only its price tag and fame change.
      *   **C)** It gains *historical weight*, but its visual appeal is unchanged.

  3.  **The Master's Studio:** A beautiful Renaissance portrait was painted mostly by the Master’s top assistant, following the Master’s detailed sketches and under his close supervision. The Master signed it.
      *   **A)** It’s *authentically the Master’s work* – his vision guided it.
      *   **B)** It’s *primarily the assistant’s work* – their hand executed it.
      *   **C)** It’s a *collaborative product* of the workshop, distinct from the Master working alone.

  4.  **The Artist's Own Copy:** An artist meticulously paints an *exact* replica of their own celebrated earlier work. They declare both are equally "originals."
      *   **A)** The *first one* holds a special status – it’s the origin of the idea.
      *   **B)** Both are *equally valid* expressions of the artist’s vision.
      *   **C)** The *second one* feels slightly less special – like a reprint.

  5.  **The Critic's Blush:** A newly discovered "old master" drawing wows critics who praise its "profound sensitivity" and "revolutionary technique." It’s then exposed as a modern forgery. The drawing itself hasn’t changed.
      *   **A)** The critics were *fooled aesthetically* – the praise was mistaken because it *isn't* profound or revolutionary.
      *   **B)** The critics were *fooled historically* – the drawing *does* show sensitivity/skill, but that skill wasn't from the master/time period they thought.
      *   **C)** The critics were *right the first time* – the drawing’s qualities are evident regardless of who made it or when.

  6.  **The Beloved Poster:** You’ve cherished a poster print of a famous painting for decades. You finally see the real thing in a museum.
      *   **A)** The original *overwhelms you* – it has a presence and power the poster utterly lacks.
      *   **B)** It’s *great to see the real colors/texture*, but the core experience is similar to your poster.
      *   **C)** You *prefer your poster* – it holds your personal history and associations.

  7.  **The Mosaic Mystery:** A stunning ancient mosaic is discovered. It’s impossible to tell if it was made by a single genius artisan or a large team following a standard pattern book.
      *   **A)** Knowing if it was *one visionary artist* would change how I see its brilliance.
      *   **B)** Its beauty and craftsmanship *stand on their own*, regardless of how many hands made it.
      *   **C)** Its *historical context* (workshop vs. individual) matters more for meaning than the visual impact.

  8.  **The AI "Masterpiece":** An AI generates a stunning image indistinguishable in style and beauty from a revered human artist’s work. It’s framed and displayed anonymously.
      *   **A)** If I *thought* it was human-made, I’d value it highly. Knowing it’s AI makes it feel *hollow* or less meaningful.
      *   **B)** It’s a *beautiful image* worthy of appreciation, regardless of its origin.
      *   **C)** It’s a *fascinating technical achievement*, but categorically *not art* in the same way a human painting is.

  ---

  ### **Scoring Key: What Your Answers Reveal About Your Theory of Originals**
  Tally how often you chose A, B, or C. Your pattern reveals your core beliefs about what makes art valuable. **The cutting questions are:**

  1.  **Does aesthetic value depend ONLY on what you can see/experience?** (If yes, copies/forgeries are fine).
  2.  **Does the object's causal history (who made it, how, when, why) matter?** (If yes, origin matters).
      *   *If yes, what matters most: Artist's Intention? Physical Creation Process? Provenance (History of Ownership)?*
  3.  **Is forgery primarily an economic fraud, or does it fundamentally corrupt the artwork itself?**

  **Mapping Your Score:**

  *   **Mostly B:** **Radical Empiricist / Aesthetic Formalist.**
      *   *Belief:* **Aesthetic value resides ONLY in the perceivable properties.** If you can't tell the difference, there isn't one. The history, origin, or authenticity is irrelevant to the *aesthetic experience* itself (though it affects market value/history). Forgery is fraud, but the *look* of the fake is still beautiful if it looks beautiful. *(Matches: "The experience was identical.")*
  *   **Mix of B & C (especially on Q1, Q5, Q8):** **Goodman-esque / Authentication Essentialist.**
      *   *Belief:* **Being an authentic instance of a work *type* matters.** An undiscovered fake functions *as* the artwork temporarily, but upon discovery, it loses that status. The *possibility* of correct attribution (even if unknown) is crucial. Perfect fakes are conceptually impossible because authenticity is part of the work's identity. Forgery destroys the work's aesthetic status. *(Matches: "It becomes just a skillful fake." / "The praise was mistaken.")*
  *   **Mostly A:** **Causal Origin Essentialist / Expressionist.**
      *   *Belief:* **The origin and history of creation are *constitutive* of the artwork's meaning and value.** The artist's unique intention, struggle, skill, and historical context are embodied in the original object. Copies or forgeries lack this essential "aura" or expressive power, even if visually identical. Forgery intrinsically corrupts the object's artistic value because it misrepresents its origin/expression. *(Matches: "It loses its magic." / "The original overwhelms you.")*
  *   **Mix of A & C (especially on Q3, Q4, Q7):** **Intentionalist / Workshop Contextualist.**
      *   *Belief:* **The artist's mind and creative act are central.** The value lies in the expression of a specific consciousness at a specific time. The *first* realization of an idea (Q4) or the hand guided by the master's mind (Q3) holds special weight. Provenance matters as evidence of the creative chain. Forgery is fraud on the *artist* and misrepresents the expressive source. *(Matches: Dutton's view)*
  *   **Mostly C:** **Sentimental Deflationist / Contextual Valuer.**
      *   *Belief:* **"Originality" matters primarily for non-aesthetic reasons.** The unique history, rarity, market value, symbolic significance (like a first edition or wedding ring), or personal connection define why an original is special. The *aesthetic* qualities can be perfectly replicated. Forgery is fraud about history/provenance, not about the inherent aesthetic properties of the object. *(Matches: "Only price/fame change." / "Your poster holds history.")*

  ### **Important Notes on the Map**

  *   **Incoherent/Unappealing Combos:** It's hard to consistently hold that origin matters *only* for market value (C) *and* also believe origin fundamentally changes the aesthetic experience (A). Most people land on one side or the other. Similarly, believing perfect fakes are impossible (Goodman) *and* that aesthetic value is purely perceptual (Radical Empiricism) creates tension.
  *   **Blurry Lines & Quiz Limits:**
      *   **Empiricism (Mostly B) vs. Goodman (B/C Mix):** This quiz *might* separate them if someone strongly chooses B on Q1 & Q5 (Empiricism) vs. C on Q1 & Q5 (Goodman). But in practice, many answers overlap. **This is the hardest distinction to make with cases alone.** Someone who picks B everywhere is clearly Empiricist; someone who picks C for "what happens when discovered?" (Q1, Q5) leans Goodman.
      *   **Causal Essentialist (A) vs. Intentionalist (A/C Mix):** Distinguishing these often requires nuance beyond these cases (e.g., questions about found objects or conceptual art). The quiz leans towards grouping them if A is dominant, but looks at Q3/Q4/Q7 for hints about the *type* of origin valued (physical creation vs. mental genesis/authority).
      *   **Deflationism (C) is usually clear** due to its focus on non-aesthetic values.

  ### **How to Present the Results**
  Don't label the theories upfront! After they tally their scores, reveal their position with a playful description:

  *   "**The Pure Experience Enthusiast (Mostly B):** For you, art lives in the moment of looking. If it moves you, that's real, no matter where it came from! You care about the 'now,' not the 'then.'"
  *   "**The Authenticity Detective (Mix of B & C):** You sense that the story behind the art is part of its DNA. A discovered fake feels like a broken promise – it *was* the artwork, but now it's just... an object. The truth matters deeply."
  *   "**The Origin Story Believer (Mostly A):** You feel the artist's hand, their time, their struggle in the original. A copy might look perfect, but it lacks the soul, the history, the unique spark. The 'real thing' has magic you can't replicate."
  *   "**The Artist's Mind Follower (Mix of A & C):** What matters most is the creative spark – the artist's vision and intention. Was it *their* hand guided by *their* mind? The context of creation (studio, era, purpose) gives the work its true weight."
  *   "**The Value Contextualizer (Mostly C):** Sure, the original is special! But mostly because it's rare, expensive, historically important, or sentimentally valuable. A perfect copy offers the same visual pleasure. You're practical about what makes an original 'original.'"

  End with: "So, which camp are you in? Argue with your friends over which Vermeer you'd rather have – the 'real' one, or the perfect copy you'll never know is fake!"
