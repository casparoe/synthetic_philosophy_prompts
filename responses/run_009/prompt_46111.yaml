  Let me recall what Dennett means by these concepts. Skyhooks are imaginary supports that come from outside the system - like divine intervention - while cranes are real mechanisms built from within the system. Greedy reductionism jumps too quickly to fundamental levels, ignoring intermediate steps, whereas patient reductionism builds explanations gradually through hierarchical levels.

  For overlap, both distinctions emphasize building explanations from what already exists materially rather than invoking miracles. They both reject supernatural shortcuts. But they pull apart in important ways: greedy reductionists might avoid skyhooks entirely while still making reductionist errors by skipping levels. 

  For the concrete example of cooperation evolution: a skyhook explanation would be "God designed altruism," while a crane explanation would involve game theory models. A greedy reductionist might try to explain cooperation solely through selfish genes while ignoring psychological mechanisms. For cultural traditions: a skyhook would be "eternal cultural essences," while cranes involve transmission mechanisms. A greedy reductionist might reduce traditions directly to brain chemistry without considering social learning.

  The user seems philosophically sophisticated, likely a student or scholar in philosophy of mind/science. They want precise conceptual mapping, probably for academic writing. Their deeper need might be understanding how Dennett's framework handles complex phenomena without oversimplification. I should ensure the five points clearly contrast and compare the distinctions while addressing the concrete examples as requested.

  I'll structure the five items: first establish the core similarity, then show how greediness differs from skyhooks (using cooperation), then how skyhooks aren't necessarily greedy (using cultural traditions), then greedy reduction without skyhooks (again cooperation), and finally how patient reductionism uses cranes appropriately (synthesizing both examples). Each point must be one or two sentences max.
answer: |-
  1. Both distinctions reject supernatural shortcuts: skyhooks invoke miraculous interventions beyond nature, while greedy reductionism illegitimately leaps past intermediate levels, but both ultimately oppose explanations relying on anything outside the material, causal world.
  2. Regarding cooperation evolution, a skyhook explanation might claim altruism was directly implanted by God, whereas greedy reductionism might assert cooperation is *just* selfish genes maximizing inclusive fitness, ignoring essential psychological or social scaffolding like reciprocity norms.
  3. For cultural tradition persistence, a skyhook explanation could posit eternal "memes" or cultural essences descending immaterially, while greedy reductionism might claim the tradition persists *only* because of specific neural activation patterns, bypassing crucial social transmission mechanisms or group-level functions.
  4. Greedy reductionism need not involve skyhooks: one could accept only material cranes exist but still explain cooperation *too fast* by reducing it solely to genetic predispositions, prematurely dismissing the necessary crane of culturally evolved institutions like contract enforcement.
  5. Patient reductionism uses cranes appropriately: it builds an explanation for cultural traditions through stepwise material mechanisms—neural plasticity enabling learning, individual reinforcement, social networks for transmission, and population-level selection—without skyhooks or greedy leaps across these levels.
