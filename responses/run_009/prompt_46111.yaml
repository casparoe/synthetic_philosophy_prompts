prompt: |-
  Compare Daniel Dennett's distinction between cranes and skyhooks with his distinction between greedy reductionism and more patient, well-grounded forms of reductionism, as developed in his discussions of Darwinian explanation. To what extent are these two distinctions making the same point, namely that good explanations must be built up from what already exists rather than positing something wholly beyond the material world, and to what extent do they pull apart — for instance, is a greedy reductionist necessarily committed to skyhooks, or could someone accept that only cranes are available while still explaining a phenomenon too fast, at the wrong level, or with the wrong intermediate steps? To make the comparison concrete, consider a phenomenon such as the evolution of cooperation or the persistence of a cultural tradition, and show how each distinction classifies a defective explanation differently. Present your answer as a numbered list of exactly five items, each consisting of one or two sentences, with no introduction or conclusion.
reasoning: |-
