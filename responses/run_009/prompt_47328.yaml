answer: |-
  **My credence that origin essentialism is false for human persons is 0.15.** Here's the decomposition, with the most influential term highlighted:

  1.  **Organismic Essentialism (Probability: 0.1 | Justification):** If persons are essentially the biological organisms originating from a specific zygote (the dominant "animalist" view), then identity is strictly tied to that biological origin event. Changing the gametes changes the zygote, initiating a fundamentally different biological continuum. This grounds powerful intuitions (e.g., "Daniel is *this* organism, which began *here*"). Counterfactual Daniel isn't *this* organism. **Weight: High.** *This term pulls strongly towards 0.*

  2.  **Nearest-Sibling Problem (Probability: 0.05 | Justification):** Holding parents and timing fixed but swapping the specific sperm (or egg) creates a genetically distinct individual. This individual shares 50% of Daniel's actual DNA with his mother but a *completely different* 50% with his father compared to actual Daniel. Phenotypically and relationally, this child would be Daniel's full sibling, not Daniel. This leverages ordinary language and biological reality: siblings from the same parents, conceived at the same time, are distinct persons. **Weight: Very High.** ***This is the single most influential term, doing the heaviest work in anchoring my low credence.*** It makes the counterfactual intuitively "Daniel's brother," not Daniel.

  3.  **Twins & Chimeras (Probability: 0.3 | Justification):** Monozygotic twins show one zygote can result in two distinct persons. Chimeras show one organism/person can result from two zygotes. This destabilizes the strict 1:1 mapping between zygote and person. *However*, it doesn't show that a *different* zygote could produce the *same* person; it shows the relationship between zygote(s) and person(s) can be one-to-many or many-to-one. This slightly weakens the absolute necessity of the *specific* zygote for identity, suggesting personhood might emerge slightly later or be more complex. **Weight: Moderate.** *This term slightly raises the probability from near-zero.*

  4.  **Counterpart Theory & Indeterminacy (Probability: 0.4 | Justification):** Kripkean essentialism assumes determinate transworld identity. Counterpart theory (Lewis) suggests asking "Is Daniel this person in another world?" is the wrong question. We ask "How good a *counterpart* (a similar entity fulfilling Daniel's 'role') is this other individual?" The counterfactual child could be a very good counterpart (same parents, same upbringing, likely similar traits) without being numerically identical to Daniel. This dissolves the binary "same/different" into degrees of similarity. **Weight: Moderate-High.** *This term significantly increases the probability by reframing the question away from strict identity.*

  5.  **Swampman (Probability: 0.25 | Justification):** Intuitions about Davidson's Swampman (a perfect duplicate created by lightning) are notoriously split. Some see it as proof that psychological continuity is sufficient for identity, decoupling it from biological origins entirely. Others (especially Kripkeans) see it as a distinct individual who merely duplicates the original. Crucially, Swampman involves *no biological origin at all*, while gamete substitution involves a *different but analogous biological origin*. Swampman tests the necessity of *any* origin, not the necessity of a *specific* origin. It weakly suggests origins *might* not be essential by showing duplication is conceivable, but doesn't directly support interchangeability of specific biological starting points. **Weight: Low-Moderate.** *This term slightly raises the probability but less than counterpart theory.*

  **Synthesis (0.15):** The overwhelming force of the Nearest-Sibling Problem (0.05) and Organismic Essentialism (0.1) anchor the credence near zero. Twins/Chimeras (0.3) and especially Counterpart Theory (0.4) offer pathways to a non-zero probability by complicating the direct link or reframing the question, but they don't overcome the core biological and intuitive arguments. Swampman (0.25) adds minimal support. Averaging these (weighted towards the stronger biological arguments) yields ~0.15. I see the probability of origin essentialism *being false* as low, but not vanishingly small due to metaphysical underdetermination.

  **For Your Character:**
  *   **Key Term:** The **Nearest-Sibling Problem** is the most potent argument *against* Daniel existing from different gametes. It grounds the abstract in concrete biology and ordinary language: "That child would be Daniel's brother, conceived at the same time Daniel was actually conceived. Calling *him* Daniel feels like robbing the real Daniel of his unique existence and his actual brother of his."
  *   **Path to Confident Denial (0):** To move her firmly to denial, persuade her that **numerical identity is fundamentally tied to the specific biological event initiating *this* organism**. Emphasize:
      1.  **Daniel is *this* particular human animal.** This animal began as *this* specific zygote formed by *this* specific sperm and egg uniting. No other biological starting point could initiate *this* animal.
      2.  **The sibling intuition is fundamental.** The counterfactual child is genetically Daniel's full sibling. We don't say siblings *are* each other. The counterfactual child *is* that sibling – a different person who never existed.
      3.  **"Could have been" refers to similarity, not identity.** Acknowledge the *counterpart* intuition: "A child conceived with your husband's sperm *could have been* very *like* Daniel, perhaps even more like him in some ways than Daniel's actual brother is. He *could have been* your son in that world. But he wouldn't *be* Daniel. Daniel is *this* person, who came from *that* sperm."

  This path leverages the strongest intuitions (biological continuity, sibling distinction) and offers a way to acknowledge the powerful pull of similarity (via counterparts) without conceding numerical identity. It provides a coherent, grounded basis for confident denial.
