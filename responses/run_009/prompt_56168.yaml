  Also, the user mentioned the worry that choosing a species concept for conservation outcomes is advocacy. The response must justify the choice of concept as scientifically valid, not just convenient. Emphasizing the lineage-based approach as recognizing evolving entities could help, showing it's a legitimate taxonomic perspective.

