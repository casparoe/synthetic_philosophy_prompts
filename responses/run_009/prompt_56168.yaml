  Looking at the species concepts: Biological Species Concept (BSC) focuses on interbreeding, which would likely disqualify red wolves due to hybridization. Phylogenetic Species Concept (PSC) emphasizes evolutionary history, which is contested here. A lineage-based approach might be more flexible, emphasizing current conservation efforts and ecological roles.

