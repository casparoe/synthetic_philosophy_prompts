  Now, why no strategic voting? If someone prefers 70°F but lies to push the median higher, say to 71°F, it might backfire if the true median was 69°F—they could end up with 71°F instead of 69°F, which is worse for them. Their lie either does nothing or hurts them. This contrasts with unrestricted preferences where voters might rank dishonestly to block a worse outcome. 

  The key evasion is the "unrestricted preferences" premise. Single-peakedness is a legit restriction because it mirrors real-world scenarios like positioning on a spectrum. It's not cheating; it's recognizing that human preferences often have structure. The thermostat example makes this tangible—readers instantly grasp why preferences cluster around personal ideals. 

  I should emphasize that this isn't a loophole but a reflection of how many decisions actually work. Democracy isn't "broken"; the theorem just shows where strategy-proofness is possible. The example reassures readers that well-designed rules can work for common preference patterns. 

