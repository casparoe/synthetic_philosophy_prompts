prompt: |-
  I'm a journalist who writes about science and ideas, and I'm drafting an explainer on the Gibbard–Satterthwaite theorem — the result that, roughly, any voting rule for three or more candidates that's onto and lets voters rank things however they like is either a dictatorship or can be gamed by strategic voting. Every time I mention this, readers write in asking "so democracy is just broken then??" and I want a section on the fine print: the theorem only bites when voters' preferences are completely unrestricted. So here's what I need from you: give me an example of a concrete decision situation where restricting what preferences people can have lets you build a voting rule that's genuinely strategy-proof AND non-dictatorial. Ideally something a general reader can picture — like a group of coworkers voting on the office thermostat, or neighbors picking where to build a bus stop along a road. Walk me through the setup, explain why nobody benefits from misrepresenting their preference in that setting, and be really explicit about which premise of the theorem the example evades and why the evasion is fair game rather than cheating. I'd like to be able to paraphrase your example directly in the piece, so keep it concrete and not too technical, no citations or anything — just the idea, explained cleanly.
