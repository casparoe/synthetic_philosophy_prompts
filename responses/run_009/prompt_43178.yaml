answer: |-
  Your diagnosis is perceptive: **this is primarily a conceptual/metaphysical dispute masquerading as an empirical one, rooted in conflicting intuitions about the nature of cognition and personal identity.** It is neither a purely verbal disagreement nor a straightforward factual one, but rather a clash over **how to conceptualize the boundaries of the cognitive agent** in light of uncontested empirical data. Below, I’ll ground this in the arguments, then outline paths forward.

  ### Core Diagnosis: The Nature of the Dispute
  1. **Not Merely Verbal**  
     Both sides agree on operational criteria (e.g., functional role, reliability, accessibility) and empirical facts (Otto’s notebook functions like biological memory). The conflict arises when applying these criteria to *constitute* cognition. Critics insist cognition requires **intrinsic, non-derived content** (Adams & Aizawa’s "mark of the cognitive"), while defenders reject this as question-begging. The dispute resembles debates over "personhood" or "life": facts are agreed upon, but categorization depends on deeper philosophical commitments.

  2. **Not About Undiscovered Facts**  
     No empirical finding would resolve the impasse. Even if we discovered that smartphones alter brain plasticity identically to hippocampal function, critics would still deny constitution (arguing the *mechanism* is external), while defenders would claim parity is reinforced.

  3. **Two Questions in One**  
     Your insight is correct: the conflation of **descriptive-functional** and **normative-constitutive** questions fuels the stalemate:
     - **Defenders (Extended Mind, EM)**: Focus on *descriptive-functional equivalence*. The Parity Principle ("if external resource plays role X, call it cognitive") is a heuristic for mapping cognitive processes, indifferent to ontology.  
     - **Critics**: Defend a *normative-constitutive* boundary. Cognition is defined by intrinsic properties (e.g., non-derived content) tied to biological ownership. For them, Otto’s notebook is a *tool for cognition*, not cognition itself—much like the stove/gas main analogy.

  ### How the Arguments Reveal This
  - **Parity Principle → Complementarity**:  
    EM’s retreat from parity (e.g., Sutton’s "second wave") conceded that external resources often *complement* rather than replicate internal processes. This weakened EM’s case for constitution but highlighted functional integration. Critics called this "embedded cognition" (causally coupled, not constitutive).
    
  - **Coupling-Constitution Distinction**:  
    Critics (e.g., Rupert) use this to insist that dependence ≠ constitution. But EM proponents (Clark) retort that the distinction *presupposes* internalism. The gas main analogy fails because cognition isn’t a physical process like combustion—it’s a functional one. If cognition is defined by information processing, and Otto’s notebook meets the criteria, why exclude it?

  - **The Retreat to Embeddedness**:  
    Critics accepting "embedded cognition" (e.g., Menary) grant that external resources are indispensable but deny they are *parts of the mind*. This preserves the intuition that "I" am distinct from "my tools," protecting agential ownership. EM sees this as arbitrary fence-drawing.

  ### Why It Feels Substantive
  The stakes are existential: **personal identity and cognitive ownership**. If Otto’s notebook is part of *him*, then:
  - Deleting his notes is a form of assault.  
  - His mind is "disembodied" in ways that challenge individualism.  
  - Epistemic responsibility blurs (e.g., "Did *I* forget, or did my phone crash?").  

  Critics fear this erodes the "inner self"; defenders see it as liberating cognition from "skin-and-skull chauvinism."

  ### Paths to Progress
  Given this diagnosis, progress requires reframing or redirecting the debate:

  1. **Sharper Mark of the Cognitive** (Least Likely)  
     If critics could define "non-derived content" without internalism (e.g., via dynamic systems theory), or defenders could ground constitution in integration metrics (e.g., predictive processing loops), this might advance the debate. But decades of failure suggest this is intractable.

  2. **Empirical Work on Integration** (Promising)  
     Focus on *how* integration occurs:  
     - Study cognitive processes where tools are seamlessly incorporated (e.g., neural plasticity in tool use, real-time sensorimotor loops with AI).  
     - Identify *functional thresholds* (e.g., bandwidth, reliability) where coupled resources become indispensable for task performance.  
     **Goal**: Shift from "Is it cognitive?" to "Under what conditions does the system *function as a unified whole*?"

  3. **Pragmatic/Conventional Stipulation** (Most Realistic)  
     Openly treat the boundary as context-dependent:  
     - **For cognitive science**: Use the extended framework when it predicts behavior better (e.g., modeling "Otto + notebook" as a system).  
     - **For ethics/law**: Preserve agential boundaries (e.g., "I own my thoughts, but rely on tools").  
     **Example**: Just as "species" is a pragmatic construct in biology, "cognitive system" could be defined by explanatory goals.

  4. **Embrace Pluralism** (Acknowledge Impasse)  
     Argue that cognition has no "true" boundary:  
     - **Descriptive projects** (e.g., neuroscience, HCI) can adopt EM to model integrated systems.  
     - **Normative projects** (e.g., autonomy, moral responsibility) can retain internalism.  
     Progress here means clarifying which question we’re asking: "How does this system work?" vs. "What belongs to the agent?"

  ### Conclusion
  The impasse stems from conflating functional description with metaphysical constitution—a category error amplified by high stakes for personal identity. **Progress lies in decoupling these projects**: empirically studying cognitive integration without demanding ontological conclusions, while using conventional boundaries for normative purposes. Your group might find traction by shifting from "Is the notebook cognitive?" to "When does treating Otto-and-notebook as a unit yield the best account of his behavior?" This sidesteps the unwinnable war over "true" boundaries and focuses on what the framework *does*. The dispute isn’t permanent—but resolving it requires accepting that not all boundaries are discovered. Some are drawn.
