  ### Step 1: Reconstructing the Rule(s) from R.'s Record
  R.'s rulings consistently hinge on the **moral standing to blame**, which depends on the blamer's relationship to the fault they are condemning. The record rules out simplistic views (e.g., "any past instance of the same fault costs standing") because R. grants standing in cases where the blamer has a past fault but has repented (e.g., Case 2 and 3). Here's a breakdown of the cases:

  - **Case 1 (Department chair)**: No standing to blame grant-padding.  
    - Why? He committed the fault (grant-padding) for a decade, never acknowledged it, and denounced others without repentance. This suggests hypocrisy and lack of reform.
  - **Case 2 (R. himself)**: Standing intact to condemn data dredging.  
    - Why? He committed the fault (data dredging) in the past, but confessed publicly, campaigned against it, and reformed. Repentance and reform preserve standing.
  - **Case 3 (Cousin)**: Full standing to condemn plagiarism.  
    - Why? He committed the fault (plagiarism) long ago, regrets it, would never do it again, but never confessed. Internal repentance and reform are sufficient; public confession isn't required.
  - **Case 4 (Acquaintance)**: No standing to blame gossiping.  
    - Why? He still commits the fault (gossiping), openly admits it, and rejects the norm's binding force. Ongoing fault without remorse or reform destroys standing.

  **Consistent Rule(s)**:  
  R.'s rulings align with a rule I'll call the **Repentance-Reform Rule**:  
  - **A person has standing to blame for a fault F if and only if:**  
    (a) They are not *currently engaging* in F (i.e., F is in the past, not ongoing), **and**  
    (b) They have *repented* of any past F, meaning they:  
        - Acknowledge F as wrong (internally or publicly),  
        - Regret F, and  
        - Have taken steps to reform (e.g., changing behavior, campaigning against F).  
    If (a) is false (ongoing F), standing is lost regardless of repentance. If (b) is false (no repentance), standing is lost regardless of current behavior.

  **What the Record Rules Out**:  
  - **Crude "past fault" rule**: Any past instance of F costs standing. *Ruled out* by Cases 2 and 3 (standing granted despite past faults).  
  - **Public confession requirement**: Repentance requires public acknowledgment. *Ruled out* by Case 3 (standing granted with private repentance).  
  - **Ongoing fault with repentance**: Standing is possible if F is ongoing but repented. *Ruled out* by Case 4 (no standing for ongoing fault, even with admission). Case 4 also shows that rejecting the norm's validity (e.g., "everyone does it") negates repentance.  
  - **No reform requirement**: Repentance alone suffices without change. *Ruled out* by Case 2 (reform via campaigning is noted) and implied by Case 4 (ongoing fault shows lack of reform).  

  **Surviving Rules**:  
  Only the **Repentance-Reform Rule** fits all cases. Alternative rules (e.g., allowing standing for ongoing fault with repentance) are inconsistent with Case 4. The rule emphasizes that standing requires both cessation of the fault and genuine repentance/reform.

