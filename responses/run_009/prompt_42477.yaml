prompt: |-
  I'm a research associate at a human-rights institute, and I've been made the drafting editor of a fact-finding report on a government campaign against an ethnic minority that the government itself describes as counterinsurgency. The documented facts: several massacres, the systematic burning of villages, mass expulsions across the border, detention camps, the destruction of churches, manuscripts, and cultural monuments, and official statements denying that the minority constitutes a people at all. The facts are not in dispute among us; the wording is. I sat through a two-hour editorial meeting in which two colleagues argued about whether the report's summary paragraph should call this "genocide," and I was asked to settle it. I couldn't. Please referee it for me.

  The two colleagues: N. is an international criminal lawyer who worked at a tribunal and thinks in elements of crimes and standards of proof. M. is a historian of twentieth-century atrocity who has spent years with Raphael Lemkin's papers. Their exchange, as best I can reconstruct it, went as follows.

  (1) M. had written "genocide" in her draft. N. changed it to "crimes against humanity," arguing: Article II of the Genocide Convention requires a special intent to destroy a national, ethnic, racial, or religious group as such; our evidence establishes killing and expulsion, but is compatible with an intent to remove rather than to destroy; the label is a legal verdict that no court has yet rendered, and using it loosely hands the government an easy "this report is not rigorous" rebuttal while diluting a word that must stay precise to stay potent.

  (2) M. replied that this gets the dependency backwards. Lemkin coined the word in 1944 precisely because the available vocabulary — atrocities, massacres, barbarity — failed to capture the distinctive wrong: the destruction of groups as groups, accomplished not only by killing but by dismantling the foundations of a group's life, its institutions, culture, language, and religion. The 1948 Convention is a narrowed, politically compromised translation of that concept: political groups were dropped from the protected categories under Soviet pressure, and cultural destruction dropped out too. So the legal definition is a partial codification of the concept, not its measure, and treating it as the meaning of the word is like treating a customs tariff as the definition of trade. Moreover, names do things. "Ethnic cleansing" was itself a euphemism that made expulsion sound like sanitation; during Rwanda, officials contorted themselves to speak of "acts of genocide" rather than genocide, precisely to avoid the obligations the word carries. Refusing the word here is not neutrality; it is the same dodge in respectable dress.

  (3) N. answered that this argument proves too much. If the word applies whenever a historian's moral perception says the distinctive wrong is present, it loses its coordinating function — the entire point of Lemkin's campaign was to bind the name to a convention so that the label would trigger legal consequences, and the International Court of Justice held in 2007 that Serbia breached its duty to prevent the Srebrenica genocide. A word that inflates to cover every atrocity is a word that no longer sorts, and Lemkin wanted a distinctive word, not a synonym for horror. And N. added a concession: tribunals have allowed genocidal intent to be inferred from a systematic pattern of conduct, so M.'s case may be legally stronger than her own framing of "expel, not destroy" suggests — but that is exactly why the report should present the pattern and leave the verdict to courts, whose findings will still matter in twenty years when nobody rereads our summary paragraph.

  (4) M. seized on the concession: if intent can be inferred from systematic conduct, then on N.'s own framework our evidence may well cross the threshold, and "leave it to the courts" is selective — courts arrive a decade or more late, while the readers of this report are people deciding right now whether to act, arm, sanction, or admit refugees. She closed with the readers she said N. was ignoring: the survivors, for whom the word is one of the few forms of recognition the international vocabulary offers, and whose testimony the report is built from.

  (5) N. closed by saying that recognition through a word that outruns the evidence is counterfeit comfort; the report's credibility is the currency that buys recognition over decades, and if we are discredited as advocates wearing fact-finders' clothes, no word we chose will matter. His proposed compromise was to write that the campaign is genocidal in character and that a court should determine whether it meets the legal definition — but to reserve the unqualified noun for a verdict. M. said that compromise was a fudge that concedes everything to whoever drafted the Convention's exclusions.

  Please take on the role of a philosopher of law and language, expert in the history and semantics of the concept of genocide, and adjudicate this dispute carefully. Before writing your verdict, brainstorm privately: identify what each colleague's position fundamentally rests on (for N., something like the claim that legal categories can own ordinary-language and moral concepts; for M., something like the claim that naming is a moral act that cannot be outsourced to adjudication), and think about how their better points cut against their own weaker ones. Then adjudicate move by move: rate each of the five moves from clearly mistaken to clearly right, with brief justification, noting any factual or conceptual slippage in what a speaker claims (for instance, whether M.'s Rwanda point, N.'s duty-to-prevent point, and N.'s concession about inferred intent are being used consistently). After that, tell me: is N.'s closing compromise coherent or a fudge — can a campaign be genocidal in character without our saying it is a genocide, or does that distinction collapse? What, if anything, are both of them missing? And finally, what should the report actually say — not a split-the-difference dodge, but your reasoned recommendation for the summary sentence, with the reasoning that supports it. Please do not rely on sources or quotations I would need to look up; reason from the concepts and the exchange as given.
reasoning: |-
  Hmm, this is a profound and ethically charged request from a human rights researcher. The user presents a meticulously reconstructed debate between two experts (N. the international lawyer and M. the historian) about whether to label documented atrocities as "genocide" in their report. Both make compelling arguments rooted in their disciplines, and the user needs me to adjudicate as a philosopher of law and language.

  First, I need to unpack the core philosophical tensions. N. anchors language to legal consequences - for her, "genocide" is a technical term that triggers obligations under the Genocide Convention. Her fear is that diluting the term makes it legally useless. M. sees language as moral recognition - she argues Lemkin's original concept was broader than the 1948 compromise, and that withholding the word betrays victims. 

  Now evaluating each move systematically:
  - N.'s opening (Move 1) is legally sound but conceptually narrow. She's right about Article II's requirements, but wrong to imply legal definitions own ordinary language. 
  - M.'s rebuttal (Move 2) powerfully exposes how legal definitions are political products (e.g., exclusion of cultural genocide), but overclaims when suggesting moral perception alone justifies the label. 
  - N.'s "proves too much" counter (Move 3) effectively shows why uncontrolled inflation harms the term's function, but her concession about inferring intent actually undermines her earlier strict-evidence stance. 
  - M.'s seizure of that concession (Move 4) rightly notes courts move too slowly for urgent crises, but her appeal to survivors' needs risks emotional overreach if unsupported by evidence. 
  - N.'s compromise (Move 5) attempts synthesis but creates a category error: "genocidal in character" either means genocide or doesn't - this evasion pleases no one.

  The crucial gap both miss: They're debating semantics when the report's purpose is action. The summary must serve readers making immediate decisions while preserving credibility for historical accountability. 

  For the actual wording recommendation, I'm considering a three-part approach: 
  First, state the documented pattern with concrete, undeniable terms ("systematic mass killings," "cultural annihilation"). 
  Then explicitly frame the genocide question: "These acts collectively constitute a strong prima facie case of genocide under the Genocide Convention, characterized by..."
  Finally, separate the legal determination: "...though formal adjudication remains pending." 

  This achieves M.'s moral recognition without overstepping N.'s legal cautions. The key is letting the documented facts speak while making the genocide framing inescapable for readers. For survivors, the description itself is recognition; for policymakers, it creates obligation without premature closure.
answer: |-
  ## Adjudication as Philosopher of Law & Language

  **Brainstorming Core Foundations:**
  - **N.'s Position:** Rests on **legal performativity** – the belief that the *legal definition* of genocide carries unique, binding consequences (obligations to prevent/punish) that ordinary language lacks. Using it without judicial sanction risks devaluation ("crying wolf") and undermines credibility essential for long-term impact. Law *owns* the term for consequential purposes.
  - **M.'s Position:** Rests on **moral expressivism and historical fidelity** – the belief that "genocide" names a unique *moral wrong* (group destruction) identified by Lemkin *before* its legal codification. The legal definition is a compromised, partial snapshot. Withholding the word constitutes complicity in euphemism, denies recognition to victims, and abdicates moral responsibility by outsourcing judgment to slow, political courts. Language *creates* reality and frames urgent action.

  **Move-by-Move Adjudication:**

  1.  **N.'s Opening (Genocide -> Crimes Against Humanity):** **Partially Right, Partially Mistaken.**
      *   *Right:* Correct on Article II requirements (specific intent, protected groups). Correct that "expulsion" alone ≠ legal genocide. Valid concern about rigor/rebuttal and dilution.
      *   *Mistaken:* Implicitly assumes the *legal* definition exhausts the *meaning* of the word "genocide" in non-legal contexts. Fails to acknowledge Lemkin's broader conceptual origin. Overstates the risk of "dilution" when used in a rigorous *factual/moral* report (not a judicial verdict). "Compatible with intent to remove" is a legalistic hedge – the *pattern* described (massacres, cultural destruction, denial of existence) strongly suggests destruction.

  2.  **M.'s Rebuttal (Lemkin's Concept, Convention's Limits, Power of Naming):** **Mostly Right, Minor Overreach.**
      *   *Right:* Accurate on Lemkin's broader concept (cultural destruction, group foundations). Correct that the legal definition is a political compromise (exclusion of political groups, cultural genocide). Powerful point about "ethnic cleansing" as euphemism and the Rwandan "acts of genocide" dodge. Correct that naming is a moral act and withholding it is consequential.
      *   *Slight Overreach:* While the legal definition isn't the *measure* of the concept, it *is* the measure for triggering the *specific legal consequences* Lemkin sought. Treating moral perception alone as sufficient *could* risk inflation if divorced from rigorous analysis (though M. isn't advocating that here). Her point stands strongly against N.'s legal absolutism.

  3.  **N.'s Counter (Proves Too Much, Coordinating Function, Concession on Intent):** **Mixed: Strong Point on Function, Inconsistent Concession.**
      *   *Strong Point:* Correct that Lemkin sought binding *legal* consequences, making the legal definition paramount *for legal triggering*. Correct that uncontrolled inflation destroys the word's sorting/distinctive function ("a word that no longer sorts"). The ICJ duty-to-prevent point is legally valid context.
      *   *Inconsistent Concession:* N.'s concession that intent *can* be inferred from systematic conduct ("M.'s case may be legally stronger") **undermines his earlier "remove not destroy" argument**. If the pattern described (massacres, cultural annihilation, expulsion, denial of existence) *does* allow inferring genocidal intent legally, his initial objection weakens significantly. He acknowledges the evidence might *meet* the legal threshold he guards so fiercely.

  4.  **M.'s Seizure of Concession & Reader Focus:** **Right on Urgency & Recognition, Overstates Consistency.**
      *   *Right:* Correctly hammers N.'s inconsistency – if the pattern *can* support inferred intent legally, "leave it to courts" is a procedural delay tactic ignoring the *current* need for the word to spur action (sanctions, refugee aid). Vital point about urgency and the audience *now*. Profoundly correct about the word's significance for survivor recognition.
      *   *Overstates Consistency:* While powerful, the "recognition" point doesn't *directly* counter N.'s core worry about *legal precision* and credibility dilution. It shifts the frame effectively but doesn't resolve the definitional tension.

  5.  **N.'s Compromise & M.'s Rejection ("genocidal in character"):** **N.: Coherent but Unsatisfying. M.: Partly Right Rejection.**
      *   *N.'s Compromise ("genocidal in character"):* **Conceptually Coherent but Practically Problematic.** It *is* possible to describe acts, patterns, or policies as exhibiting the *character* or *hallmarks* of genocide without making a final, unqualified legal declaration. This acknowledges the systematic nature and destructive potential described by Lemkin while reserving the noun for the legal verdict. It avoids premature judicial labeling.
      *   *M.'s Rejection ("fudge"):** **Partly Justified.** Calling it a "fudge that concedes everything" is too strong, but M. is right that it feels evasive given the strength of the evidence *as described*. It risks perpetuating the very euphemistic distancing she condemns ("acts of genocide"). It *does* arguably prioritize legal formalism over the moral expressivism and urgent recognition she champions.

  **Verdict on the Compromise & Missing Elements:**

  *   **"Genocidal in character" is conceptually coherent.** It distinguishes *describing the nature of the acts/policy* from *pronouncing the final legal conclusion*. It avoids the pitfalls of both premature legal labeling and euphemistic avoidance.
  *   **However, it is a significant concession to legal formalism** and feels inadequate given the reported evidence (massacres, cultural annihilation, expulsion, denial of existence). It *does* sidestep the powerful moral call inherent in the unqualified noun.
  *   **What Both Miss:**
      1.  **The Report's Primary Function:** Is it primarily a *legal indictment* (favouring N.'s caution) or a *moral witness and call to action* (favouring M.'s urgency)? A human rights fact-finding report usually leans towards the latter, even while valuing legal precision.
      2.  **The Spectrum of "Destruction":** The debate fixates on "destroy" vs. "remove." Systematic cultural annihilation and denial of group existence *are* forms of destruction, even if not every member is killed. Lemkin's concept encompassed this. The evidence described goes far beyond simple expulsion.
      3.  **The Burden of Proof:** N. implicitly demands proof *beyond reasonable doubt* for the word, appropriate for a court. M. implicitly argues for a *clear and convincing evidence* standard based on the pattern, appropriate for a factual report concluding a *prima facie* case exists. They are applying different standards.
      4.  **The Power of Description:** The most potent aspect might be the *detailed description itself* – "systematic mass killings, village burnings, mass expulsions, detention camps, destruction of cultural and religious foundations, and official denial of the group's existence." This list *is* the indictment; the label is the summary.

  **Recommendation for the Summary Sentence:**

  > **"The documented pattern of systematic mass killings, the burning of villages, mass expulsions, arbitrary detention, and the comprehensive destruction of churches, cultural monuments, and manuscripts, combined with official statements denying the existence of the [Group Name] as a distinct people, constitutes a concerted campaign of group destruction that meets the evidentiary threshold for a prima facie case of genocide under international law, warranting immediate international investigation and action."**

  **Reasoning:**

  1.  **Focuses on the Undeniable Facts:** Leads with the concrete, horrific pattern established by the investigation. This is the core of the report's authority.
  2.  **Uses Strong, Unambiguous Language:** "Systematic," "mass killings," "comprehensive destruction," "concerted campaign of group destruction" – these terms are powerful, descriptive, and morally resonant, aligning with Lemkin's core concept without immediately using the "G-word." They build the case.
  3.  **Explicitly Frames the Genocide Question:** Clearly states the *conclusion* drawn from the facts: this pattern "meets the evidentiary threshold for a *prima facie* case of genocide under international law."
      *   **"Prima facie case":** This is the crucial legal/moral bridge. It means the evidence, *if unrebutted*, is sufficient to establish genocide. It acknowledges the legal standard N. values, satisfies the burden of proof appropriate for a fact-finding report (clear and convincing evidence of a pattern implying specific intent), and validates M.'s point that the evidence is overwhelming and demands the genocide framework. It signals gravity without preempting a final judicial verdict.
      *   **"Under international law":** Anchors the claim in the legal framework N. defends, showing rigor.
  4.  **Mandates Action:** "Warranting immediate international investigation and action" addresses M.'s urgency, leveraging the gravity of the *prima facie* genocide finding to demand a response *now*, without waiting for courts.
  5.  **Avoids Pitfalls:**
      *   Does *not* use "genocide" as an unqualified noun, respecting N.'s concern about final legal labeling.
      *   Does *not* retreat to euphemisms ("crimes against humanity," "ethnic cleansing") or hedging ("genocidal in character"), satisfying M.'s demand for moral clarity and recognition of the specific wrong.
      *   Explicitly ties the genocidal intent to the *pattern* described (killings, cultural destruction, denial of existence), leveraging N.'s concession that intent can be inferred systematically.
      *   Provides a powerful, factual basis for survivor recognition within the international vocabulary M. emphasizes.

  This formulation honors the gravity of the evidence, respects the legal framework, fulfills the report's duty as moral witness and call to action, provides crucial recognition, and maintains credibility by grounding the genocide claim firmly in the established facts and the *prima facie* legal standard. It navigates the core tension by making the evidence speak for itself while drawing the inescapable conclusion that demands the world's attention and action.
