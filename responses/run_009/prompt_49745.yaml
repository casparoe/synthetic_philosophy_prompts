prompt: |-
  I lead a small strategic foresight function at a reinsurance company, and one of my recurring jobs is running our quarterly scenario-forecasting exercise. Six analysts independently assign probabilities to a list of questions — whether a specific piece of regulation passes this year, whether a named hurricane season exceeds a loss threshold, whether a major counterparty gets downgraded below a certain rating — and then we meet to produce the single set of numbers that goes into our capital-planning report. The disagreements are persistent: the same two or three people land far apart on the same kinds of questions, quarter after quarter, and the meetings have degraded into a ritual where each side restates its case and we split the difference. Years ago I took a course that touched on Bayesian epistemology, and I've since read just enough about the common prior assumption and Aumann-style agreement results to suspect we're using them badly in both directions: sometimes we treat disagreement as if it must reflect genuinely different information when it's really just different starting beliefs or different gut-level weightings, and sometimes we assume we must share priors when in fact one analyst has a considered structural view the others don't hold.

  What I'd like is a decision procedure my team can actually run on a single disagreement, in under an hour, before the number goes into the report. It should walk through, in order: how to establish what evidence each person is actually conditioning on and whether there is real private information in the room; how to test whether the disagreement survives full disclosure of that evidence; what to conclude if it does survive — in particular, when the common prior assumption is a useful idealisation that tells us someone is double-counting or under-weighting shared evidence, and when it is simply false for our team and heterogeneous priors should be admitted as an honest modelling choice; whether and when averaging, mediation, or deferred escalation to an underwriter with authority is the right output; and where the procedure must stop and hand the judgement to a person because the question is one of values or risk appetite rather than probability. Please be explicit about the points where the procedure will misfire — for instance, where 'revealing your evidence' is impossible because it's tacit judgement built from twenty years of pricing, and where pooling opinions can launder correlated errors into a false consensus.

  Then run the procedure on three real-shaped disagreements from our last exercise: an analyst who assigns 70 per cent to the regulation passing versus one at 35 per cent, where the optimist has seen early draft language the others haven't; the same spread on a question about an emerging cyber-loss accumulation scenario, where both analysts have read identical material but one lived through a different historical loss event and openly says her 'prior' is different; and a case where four analysts are clustered at 55–65 per cent but the holdout at 15 per cent is the one with the strongest track record. On the third case especially, I expect the procedure may give an answer I won't like, and I'd rather know that than keep chairing these meetings by splitting the difference. Please answer in British English.
reasoning: |-
  Alright, the user leads a strategic foresight function at a reinsurance company and is struggling with persistent disagreements during quarterly scenario forecasting. The team has analysts assigning probabilities independently, but the same people consistently disagree, leading to unproductive meetings where they just split the difference. 

  Hmm, they mentioned taking a course on Bayesian epistemology and reading about common priors and Aumann's agreement theorem. They suspect they're misapplying these concepts - sometimes treating disagreements as purely informational when they're actually about priors, and other times assuming shared priors when analysts have different structural views. 

  The core ask is for a practical decision procedure to resolve single disagreements in under an hour. It needs to handle: evidence disclosure, testing if disagreement persists post-disclosure, deciding when common priors apply vs when heterogeneous priors are valid, and choosing between averaging/mediation/escalation. Also needs red flags for where the process might fail, like tacit knowledge or correlated errors.

  They've provided three concrete cases:
  1. Regulation passing (70% vs 35%) with private information
  2. Cyber-loss scenario (same spread) with different historical priors
  3. Cluster at 55-65% vs outlier at 15% with strong track record

  The user seems frustrated with current dynamics and wants rigor. Underneath, they might be seeking legitimacy for overriding consensus when needed (case 3) and validation that some disagreements are fundamentally irreconcilable. The British English requirement suggests possible UK/EU regulatory context where documenting rationale is crucial.

  For the procedure design... Need to balance Bayesian theory with practicality. Key insights: 
  - Must distinguish between private information (fixable via disclosure) vs legitimate prior differences (may require aggregation methods)
  - The "common prior assumption" is often violated in real expertise
  - Tacit knowledge complicates evidence sharing
  - Outliers with strong track records deserve weighted consideration

  The time constraint (1 hour) means this can't be a full Bayesian update - needs heuristics. Should build in "stopping rules" for when to escalate or admit fundamental disagreement. For the three cases:

  Case 1 is textbook - disclosure should converge estimates. Easy win for the procedure. 

  Case 2 is trickier - the historical experience is valid prior difference. Procedure should flag this as irreconcilable and suggest averaging with documentation. 

  Case 3 is where the user anticipates discomfort. The outlier's track record might indicate superior model, but could also be overconfidence. Procedure must surface their reasoning without forcing consensus. Might recommend deferring to underwriter authority with outlier's rationale attached.

  Biggest pitfalls: 
  - Mistaking intuition for private information
  - Letting dominant personalities override
  - False confidence in averaged probabilities
  The key is making implicit disagreements explicit so the resolution method (average/mediate/escalate) matches the nature of the divergence.
answer: |-
  Below is a structured decision procedure for resolving probability disagreements in your scenario-forecasting exercises, designed to be executed in ≤60 minutes per dispute. The protocol integrates Bayesian principles with practical constraints, flagging key failure points. It proceeds through six stages:

  ---

  ### **Decision Procedure: Resolving Probability Disagreements**
  **Stage 1: Evidence Inventory (10 mins)**  
  - **Action:** Each analyst *separately* lists:  
    (a) **Key facts/data** used (e.g., "draft regulation text," "2023 hurricane SST data").  
    (b) **Structural assumptions** (e.g., "regulators are election-sensitive," "cyber claims are log-normal").  
    (c) **Inferential steps** (e.g., "draft clause X ⇒ 40% chance of passage; lobbyist feedback adds 30%").  
  - **Failure Modes:**  
    - *Tacit knowledge*: E.g., an actuary’s "gut feel" from pricing catastrophes since 2004 cannot be verbalised fully. Mitigation: Ask for analogous historical cases.  
    - *Correlated evidence*: All analysts may cite the same flawed source (e.g., a vendor model). Flag for external validation.  

  **Stage 2: Disclosure & Bayesian Updating (15 mins)**  
  - **Action:** Share all evidence publicly. Analysts re-estimate probabilities *after* seeing others’ inputs.  
  - **Test:** If disagreement *collapses* (e.g., 70% → 50%, 35% → 50%), the conflict was informational. Use the converged value.  
  - **Test:** If disagreement *persists*, proceed to Stage 3.  
  - **Failure Modes:**  
    - *Motivated reasoning*: Analysts may discount inconvenient evidence. Chair must challenge: "What evidence would change your view?"  

  **Stage 3: Prior Elicitation (10 mins)**  
  - **Action:** Analysts articulate *why* their priors differ. Probe:  
    - "Is this prior based on verifiable data (e.g., past regulation pass rates) or values (e.g., ‘governments always overreach’)?"  
    - "Does your prior reflect a unique expertise (e.g., cyber incident response)?"  
  - **Decision Rules:**  
    - **Common Prior Valid:** If priors diverge due to *misweighting* shared data (e.g., one analyst overlooks a decay function), correct the error mathematically.  
    - **Heterogeneous Priors Valid:** If priors reflect irreconcilable structural views (e.g., "inflation will behave like the 1970s vs. 2010s"), average the probabilities *with documentation*.  
  - **Red Flag:** Reject claims like "my prior is better" without empirical track records (see Stage 5).  

  **Stage 4: Resolution Mechanism (5 mins)**  
  - **Options:**  
    - *Average*: Use when heterogeneous priors are legitimate (e.g., arithmetic mean for linear risks, geometric for compounding).  
    - *Mediate*: Chair proposes a compromise if one analyst has domain authority (e.g., a credit rating specialist on downgrades).  
    - *Escalate*: Defer to an underwriter if disagreement hinges on unquantifiable risk appetite (e.g., "We can’t tolerate even a 10% chance of this cyber loss").  

  **Stage 5: Track Record Adjustment (If Applicable)**  
  - **Action:** For analysts with quantifiable historical accuracy:  
    - Calculate Brier scores or log-loss for past forecasts.  
    - Weight their probability by *√(score - benchmark)*.  
    - *Never* exclude outliers without this step.  

  **Stage 6: Values Check (5 mins)**  
  - **Action:** Explicitly ask: "Is this dispute about *facts* or our *risk tolerance*?"  
  - **Output:** If values (e.g., "We should ignore low-probability pandemics"), halt and escalate to leadership.  

  ---

  ### **Application to Your Cases**
  **Case 1: Regulation Passing (70% vs. 35%)**  
  - **Stage 1:** Optimist reveals "early draft language" (private info). Pessimist cites "opposition party strength."  
  - **Stage 2:** *Disclose draft language*. Pessimist revises to 55%. Optimist holds at 65% (structural belief in draft momentum).  
  - **Stage 3:** Pessimist’s prior: "Only 20% of drafts pass in election years." Optimist: "This draft has cross-party backing." *Heterogeneous priors accepted*.  
  - **Resolution:** Average to 60% (mean) or 59% (geometric). **Misfire risk:** Draft language may be ambiguous (tacit knowledge).  

  **Case 2: Cyber-Loss Scenario (70% vs. 35%)**  
  - **Stage 1:** Both share identical reports. Pessimist cites "2020 cloud outage experience" as prior.  
  - **Stage 2:** Disagreement *persists* post-disclosure.  
  - **Stage 3:** Pessimist’s prior: "Cyber losses cluster like 2003 blackouts." Optimist: "Modern redundancies prevent this." *Heterogeneous priors valid*.  
  - **Resolution:** Average to 52.5%. **Misfire risk:** Pessimist’s historical analogy may be inapplicable (correlated error if team overweights past events).  

  **Case 3: Clustered Analysts (55–65%) vs. Holdout (15%)**  
  - **Stage 1:** Holdout reveals proprietary model showing non-linear risk accumulation. Others use standard GLMs.  
  - **Stage 2:** Clustered analysts revise to 45–50% after seeing model. Holdout remains at 20%.  
  - **Stage 3:** Holdout’s prior: "Tail risks are underestimated by standard models." Others: "Model is untested."  
  - **Stage 5:** Holdout has superior Brier score (0.25 vs. team avg 0.41).  
  - **Resolution:** *Weighted average*: (0.6 × holdout) + (0.4 × cluster mean) = **34%**. Escalate to underwriter if capital impact is high.  
  - **Truth you won’t like:** The holdout’s track record *demands* weighting. Ignoring this launders correlated model error.  

  ---

  ### **Key Safeguards**  
  1. **Tacit Knowledge:** Require analysts to cite *comparable historical precedents* (e.g., "This feels like Solvency II rollout – here’s why").  
  2. **False Consensus:** If ≥2 analysts share evidence sources (e.g., same vendor report), flag for independent validation.  
  3. **Escalation Triggers:**  
     - Values-based disputes (e.g., "We must model 0% for existential risks").  
     - Persistent disagreement after Stages 1–3 with material capital implications.  

  This procedure forces transparency in priors, exposes correlated errors, and legitimises averaging only when heterogeneity is justified. It accepts that experts with proven judgment deserve disproportionate weight – uncomfortable, but necessary for accuracy.  

  > *"When the forecast is done, disagreement must either dissolve into consensus or crystallise into documented uncertainty."*
