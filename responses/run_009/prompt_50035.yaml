prompt: |-
  In a seminar discussion about whether the United States is headed for decline, a classmate shut the whole debate down with "history repeats itself": every great power has followed the same arc from rise to fall, so America's decline is as inevitable as Rome's, and arguing about policy is pointless. I'm suspicious of that leap, but I can't pin down exactly where it goes wrong. Could you lay out the distinct, precise theses "history repeats itself" might be expressing — from the literal (exact recurrence of events), through the moderate (recurring patterns or mechanisms, as in Polybius' cycle of constitutions or Ibn Khaldun's account of dynasties rising and dissolving), down to the weak (mere thematic rhyme across eras) — and, for each reading, say whether it's plausible and whether it actually licenses fatalism about a present-day power's trajectory? Please end by identifying which reading my classmate needed for his conclusion, and whether he is entitled to it. Answer in American English, in at most 500 words, with the readings as a numbered list.
