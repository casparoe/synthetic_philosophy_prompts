prompt: |-
  I am a PhD student in cognitive science working on judgment and decision making; my advisor's group consults for the research office of a large public university, and I have been handed a task that is proving harder than it looks. The office convenes committees that choose everything from survey software to data-management platforms for funded projects — fifteen to twenty decisions a year, ranging from a few thousand dollars to several hundred thousand, each one documented because the outcomes get audited when a grant is questioned. The committees' standing complaint is not that they choose badly but that they cannot stop choosing: vendors keep submitting proposals past the deadline, a search for what else is out there never terminates, and the same committee can burn three meetings on a $6,000 decision. My advisor, who is fond of Herbert Simon, has asked me to translate bounded rationality into something the committees can actually run, and I would like your help drafting it.

  What we need is a decision procedure for when to stop generating options and commit to one — a stopping rule, in effect — that a committee of non-specialists can execute inside a single ninety-minute meeting with no math beyond counting and no software. It should be grounded in the bounded rationality tradition: search is costly, the relevant standard is an aspiration level rather than the optimum, and a satisfactory option is the target rather than the best one. But the translation is where I keep getting stuck, and I want you to take the following complications seriously rather than smoothing them over.

  First, aspiration levels in the literature are allowed to adjust as the search proceeds — Simon made the adjustment of aspirations central to the account — but committees adjust them in a specific way I have not seen discussed: after a surprisingly strong proposal arrives, the committee's standards ratchet upward, so that options that would have counted as satisfactory last month no longer do. Whether that upward drift is legitimate (they have learned the market is better than they thought) or illegitimate (it is regret and social comparison dressed up as evidence) seems to depend on facts the procedure cannot see. The procedure has to say something about when adjustment of the standard is allowed and in which directions.

  Second, option arrival is asynchronous. There is no natural point at which the option pool is complete; new proposals arrive while the committee deliberates. So the procedure actually needs two separate stopping decisions — when to close the pool to new options, and when to stop evaluating the ones already in hand — and I suspect these come apart in ways that matter, because closing the pool early forecloses and closing it late just delays the same choice.

  Third, sunk costs. Committees that have spent four meetings on a search refuse to commit to the satisfactory option on the table because they feel they have come too far to settle. Any honest procedure has to handle the case where its own rule says to stop and the committee's psychology says to continue, and it cannot do so by fiat, since the committee members outrank the procedure.

  Please write the procedure: the questions to ask, in order; what counts as a sufficient answer to each; where the procedure stops with a commitment, where it stops with a continue-searching verdict, and where it hands the decision to the committee because the question is one of values rather than facts. It must produce an auditable record — the office gets asked, a year later, why a platform was chosen — so each step should leave a trace a non-member could read after the fact. Then run it on three cases from our files: (a) a survey platform for a three-year longitudinal study, where one platform meets every stated requirement but a committee member keeps forwarding one more to look at; (b) a data-manager hire where a clearly satisfactory candidate has an offer expiring Friday while a stronger applicant might still materialize; and (c) a $400,000 platform decision where the procedure, as far as I can tell, will commit the committee to the second-best option, which I expect they will hate. Please say plainly what the procedure cannot do — where it will systematically misfire and which judgment calls I have tried to disguise as facts — rather than pretending the procedure eliminates judgment.
reasoning: |-
  We are designing a decision procedure for committees to decide when to stop searching for options and commit to a choice. The procedure must be grounded in bounded rationality, requiring minimal math and no software, and must fit within a 90-minute meeting. It must address three complications: (1) aspiration level adjustment, especially upward drift; (2) asynchronous option arrival; and (3) sunk costs.

   The procedure will have two main stopping decisions:
    1. When to close the pool to new options (stop accepting new proposals).
    2. When to stop evaluating the current pool and choose an option.

   We'll structure the procedure as a sequence of questions. Each question must be answered by the committee, and the answers must be recorded for audit. The procedure may lead to:
    - A commitment to an option.
    - A decision to continue searching (either by waiting for more options or by evaluating the current pool further).
    - A handoff to the committee for a judgment call when the question is one of values.

   We'll design the steps to be sequential and clear.

   Key principles from bounded rationality:
    - Set an aspiration level: a set of criteria that define a "satisfactory" option.
    - Search until a satisfactory option is found.
    - Adjust the aspiration level appropriately during the search.

   However, we must control upward drift of aspirations. We allow downward adjustment (if the committee realizes the aspiration level is too high) but restrict upward adjustment to specific conditions.

   Proposed Procedure:

   Step 0: Preparation (before the first meeting)
     - Define the decision problem: what is needed (requirements) and the budget.
     - Set the initial aspiration level: the committee agrees on a set of minimum requirements that an option must meet to be considered satisfactory. These must be concrete and measurable (e.g., "must have feature X", "must cost no more than $Y"). Record these.

   Step 1: Initial Pool and First Review (first meeting or early in the process)
     - Collect all options that have arrived by a pre-announced deadline (if one was set). If no deadline, then start with the options on hand.
     - Evaluate each option in the current pool against the aspiration level (from Step 0). 
          - If any option meets the aspiration level, then proceed to Step 2 (but note: we might have multiple satisfactory options).
          - If none meets the aspiration level, then the committee must decide whether to:
              a) Lower the aspiration level (if they now believe the initial level was too high) and re-evaluate, OR
              b) Continue searching for more options.

     - Record the evaluation: for each option, note which requirements it meets and which it doesn't.

   Step 2: Check for a Satisfactory Option (at any meeting when there are new options or the aspiration level has changed)
     - Review the current pool (including any new options that have been added since the last review) against the current aspiration level.
          - If there is at least one satisfactory option, then proceed to Step 3.
          - If not, then the committee must decide on adjusting the aspiration level (only downward allowed at this point, unless there's a strong reason to go upward) or continuing the search.

     - Rule for upward adjustment: The aspiration level can be raised only if:
          (a) The committee has received at least one option that exceeds the current aspiration level in a way that reveals new possibilities (i.e., they learn that the market can provide more than they thought), AND
          (b) The committee explicitly agrees that the higher standard is now necessary (not just desirable) and is worth the expected additional search cost (in time and resources).

       But note: upward adjustment should be rare and well-justified. The default is that the aspiration level can be lowered if the initial one is too high, but raising it requires a strong justification and a record of why it is now necessary.

   Step 3: Consider Closing the Pool (when at least one satisfactory option is available)
     - The committee must decide whether to close the pool to new options. This step is about preventing new options from coming in and delaying the decision.

     - Factors to consider:
          - How long has the search been going on? (If already long, then closing may be appropriate.)
          - Are there any pending proposals that are likely to arrive soon and are from vendors that the committee has actively solicited? (If yes, then maybe wait a short, fixed time.)
          - The cost of delay: is there a deadline (e.g., an expiring offer, a grant start date)?

     - The committee sets a deadline for new proposals: either "now" (close the pool) or a specific short date (e.g., 2 business days). Record the reason.

     - After that deadline, no new options are considered.

   Step 4: Choose from the Current Pool (after the pool is closed)
     - The committee must select one satisfactory option from the closed pool.

     - How? They can pick any satisfactory option. They do not need to find the best. However, if there are multiple satisfactory options, they might use a simple tie-breaker (e.g., lowest cost, or most features beyond the aspiration level, or fastest implementation). The tie-breaker should be pre-specified if possible (from Step 0) or agreed upon at this stage.

     - If no satisfactory option exists (which should not happen if Step 3 was done correctly because we only close the pool when we have at least one satisfactory option) then the committee must either:
          a) Re-open the pool and go back to Step 1 (with a new deadline), OR
          b) Lower the aspiration level and re-evaluate the current pool.

   Step 5: Handling Sunk Costs (a psychological barrier)
     - If the committee has spent a lot of time and is reluctant to choose a satisfactory option (because they feel they have invested too much to "settle"), then the procedure must remind them of the bounded rationality principle: the goal is satisfactory, not optimal. The record should note that a satisfactory option is available and that the committee is choosing to continue despite the cost.

     - However, if the committee insists on continuing, then they must explicitly state a new aspiration level (which would be higher than the current one) and justify it (as in Step 2). This then becomes the new standard, and the search continues.

     - But note: this step is a safeguard against irrational escalation. The procedure should explicitly state that the committee is deviating from the bounded rationality principle and must record the reason.

   Now, we design the step-by-step procedure for a meeting. We assume that the committee has already done Step 0 (initial aspiration level) and that we are in the middle of the process.

   Meeting Procedure:

   1. Review the current aspiration level (from the last meeting or initial setup). Record it.

   2. Check for new options that have arrived since the last meeting. Add them to the pool. Record the new options.

   3. Evaluate the entire current pool (old and new) against the current aspiration level. For each option, record which requirements are met and which are not. Classify as satisfactory or not.

   4. Decision Point A: Are there any satisfactory options?
      - If NO:
          a. The committee must decide: can we lower the aspiration level to make one or more options satisfactory? If yes, then lower the aspiration level (record the new level and the reason) and re-evaluate the pool. Then go back to Decision Point A.
          b. If not, then the committee must decide whether to wait for more options. If they decide to wait, set a specific short deadline (e.g., one week) for new proposals and schedule the next meeting. Record the decision and the deadline.
          c. Alternatively, if the committee believes they must raise the aspiration level (very rare), they must justify it (as per Step 2 rule). Then set a new aspiration level and record the justification. Then the search continues (wait for more options?).

      - If YES: proceed to step 5.

   5. Decision Point B: Should we close the pool to new options?
      - The committee considers:
          - Are there any outstanding proposals that we expect and that are important? (e.g., from a vendor we invited and who promised to submit by a certain date)
          - Is there a time pressure? (e.g., an offer expiring, a project start date)
          - How much time has been spent so far?

      - If the committee decides to close the pool, then set the deadline for new proposals as "immediately" (i.e., no more) and proceed to step 6.

      - If the committee decides to leave the pool open, then set a specific, short deadline (e.g., 2 business days) for new proposals and schedule the next meeting. Record the reason for not closing.

   6. Decision Point C: Choose a satisfactory option from the closed pool.
      - The committee must pick one from the satisfactory ones. They can use a pre-agreed tie-breaker or choose by consensus.

      - If the committee is reluctant (due to sunk costs) and wants to continue searching even though the pool is closed and there are satisfactory options, then they must:
          a. Raise the aspiration level (with justification as in Step 2) and record the new level and the reason (which must be more than "we have spent a lot of time").
          b. Re-open the pool (set a new deadline) and go back to step 1.

   7. Record the final decision and the rationale.

   Now, we run the procedure on the three cases.

   Case (a): Survey platform for a three-year longitudinal study, one platform meets every stated requirement but a committee member keeps forwarding one more to look at.

    - We are in a meeting. The aspiration level is set (from Step 0). The current pool includes the satisfactory platform and others that may not be satisfactory.

    - Step 1: Review aspiration level (unchanged).
    - Step 2: New options? The member forwards one more. Add it to the pool.
    - Step 3: Evaluate the new option and the existing ones. The original satisfactory option still meets the aspiration level. The new option may or may not.

    - Step 4 (Decision Point A): There is at least one satisfactory option (the original one). So we proceed to Step 5.

    - Step 5 (Decision Point B): Should we close the pool?
          The committee must consider: 
            - The new option just arrived, but the committee member keeps forwarding. This could go on indefinitely.
            - There is no known outstanding proposal (if there is, then wait for that specific one). 
            - There is a satisfactory option already.

          The procedure would suggest closing the pool because the aspiration level is met and there's no strong reason to expect a significantly better option (and the cost of delay is the committee's time). However, the committee might set a very short deadline (e.g., end of day) for any last-minute proposals and then close.

          But in the case, the committee member is constantly forwarding. The procedure must be firm: after the deadline set in Step 5, no more.

          So, the committee sets a deadline (say, by the end of the day) and then closes the pool.

    - Step 6: Now the pool is closed. The committee must choose from the satisfactory options. They have at least one. They choose one (the original one, unless the new one is also satisfactory and better by the tie-breaker).

    - However, if the committee member insists on waiting for more, then the committee must either:
          - Overrule (by majority) and close the pool, OR
          - If the committee agrees to wait, then they must set a deadline and schedule the next meeting. But note: this is against the procedure's recommendation because they already have a satisfactory option.

      In the next meeting, if a new option arrives, they evaluate. But if the new option is not satisfactory, they still have the original one. If it is satisfactory, they still have to close the pool and choose one.

      The key is: having a satisfactory option should lead to closing the pool and choosing, unless there is a compelling reason to wait for a specific known option that is expected to be much better.

   Case (b): Data-manager hire with a satisfactory candidate whose offer expires Friday, while a stronger applicant might materialize.

    - We are in a meeting. The aspiration level is set. The current pool has the satisfactory candidate (call them A) and others that are not satisfactory.

    - Step 1: Review aspiration level.
    - Step 2: No new options at the moment, but the committee knows that a stronger applicant might materialize (they have been invited or have expressed interest?).

    - Step 3: Evaluate the pool. Candidate A is satisfactory.

    - Step 4: There is a satisfactory candidate -> proceed to Step 5.

    - Step 5: Should we close the pool?
          Factors:
            - There is a time pressure: the offer for candidate A expires Friday.
            - The committee expects a stronger candidate (B) to apply, but they haven't yet and there's no guarantee.

          The committee must decide: 
            Option 1: Close the pool now and choose candidate A (so they don't lose A).
            Option 2: Leave the pool open until Friday (if the meeting is before Friday) to see if candidate B applies.

          The procedure requires setting a deadline: if they leave open, set the deadline to Friday (or the day before to allow time for evaluation). 

          But note: if candidate B does not materialize by Friday, they must choose from the pool they have (which includes A). If candidate B does materialize, they will evaluate and if B is satisfactory, then they have two satisfactory options and can choose between them (using the tie-breaker, or they might choose B because it's stronger).

          However, there is a risk: if candidate B does not show up, and candidate A's offer expires, then they might have no satisfactory candidate. So they must consider:

            - How likely is candidate B to apply by Friday? (If high, then wait; if low, then close now and take A.)
            - How critical is the position? (If very critical, they might not risk losing A.)

          The procedure does not make this judgment; it requires the committee to weigh the risks and set the deadline accordingly. They must record the reason for the chosen deadline.

          In this case, the committee might set the deadline to Thursday (if today is before) so that they can evaluate candidate B if they come and then make a decision on Friday.

          Then, at the deadline (Thursday), they close the pool and evaluate. If candidate B has arrived and is satisfactory, they have two. Then they choose one (they might pick B because better, even though A is satisfactory). If candidate B hasn't arrived, they choose A.

          But note: if they set the deadline to Thursday and candidate B arrives on Friday, they cannot consider them because the pool is closed.

          Alternatively, they might extend the offer to candidate A with a note that they are still considering others until Friday, but that is risky if candidate A declines. The procedure does not cover negotiation tactics.

          The bounded rationality approach: since candidate A is satisfactory, the committee might decide to close the pool now and choose A to avoid the risk of losing A. But the procedure allows them to set a deadline until Friday if they are willing to take the risk.

   Case (c): $400,000 platform decision where the procedure will commit the committee to the second-best option.

    - Let's assume the committee has two options: 
          Option X: satisfactory, but not the best (say, second-best).
          Option Y: the best, but not yet evaluated? Or perhaps not yet arrived? 

    - Actually, the case says the procedure will commit to the second-best. So we assume the committee has already evaluated a pool and found at least one satisfactory option (the second-best) and then closed the pool. Now they must choose from the closed pool.

    - Step 6: They have to choose one satisfactory option. They have the second-best and maybe others. The best option might have been rejected because it didn't meet the aspiration level? Or maybe it hasn't arrived? 

    - The case says the procedure commits them to the second-best. How?

    - Scenario: The aspiration level is set. The committee has found one satisfactory option (the second-best, call it A). They then close the pool (Step 5) because they have a satisfactory option and don't want to wait indefinitely. Then in Step 6, they choose A.

    - But what if the best option (B) is also in the pool and is satisfactory? Then they have two satisfactory options. They can choose either. They might choose B because it's better. So why would they be committed to A?

    - The issue: the best option might not have arrived by the time they closed the pool. They closed the pool because they had A (satisfactory) and then the best option arrives after the deadline. They cannot consider it.

    - The committee might be unhappy because they know that the best option exists (but didn't meet the deadline) or because they feel they should have waited.

    - How does the procedure handle this?

        In Step 5 (closing the pool), the committee must consider the possibility of a better option arriving. They must set the deadline in a way that balances the cost of delay and the risk of missing a better option.

        For a $400,000 decision, they might be more willing to wait than for a $6,000 one. But they must set a deadline and then stick to it.

        The procedure does not guarantee that the best option will be found, only that a satisfactory one is chosen in a timely manner.

        The committee might try to adjust the aspiration level upward to force waiting, but the procedure restricts upward adjustment: they can only raise the aspiration level if they have seen an option that exceeds the current level and they justify that the higher level is now necessary.

        So, if they haven't seen an option that exceeds the current aspiration level (they only have A, which meets it, and they haven't seen B), then they cannot raise the aspiration level to force waiting for B. They must close the pool and choose A.

        Alternatively, if they have seen an option that exceeds the aspiration level (say, they saw a demo of B from a vendor but haven't received the formal proposal) then they might raise the aspiration level (if they can justify that the extra features of B are now necessary) and then wait for B.

    - So in the case of a $400,000 decision, if the committee closes the pool without having seen the best option, they might later regret it. But the procedure requires them to set a deadline and close when they have a satisfactory option. The best option might be excluded because it arrived late.

    - The committee might avoid this by not closing the pool until they are sure they have seen the major contenders. But the procedure does not require that. It requires that they close the pool when they have a satisfactory option and after considering the cost of delay and the likelihood of better options.

    - To mitigate, the committee could set a longer deadline for high-stakes decisions. But the procedure does not specify the length of the deadline; it leaves that to the committee.

   What the procedure cannot do:

    1. It cannot eliminate judgment. The committee must make judgments about:
          - The initial aspiration level.
          - Whether to lower the aspiration level when no satisfactory option is found.
          - Whether to raise the aspiration level (with justification).
          - Setting the deadline for closing the pool (balancing risk of losing a good option vs. delay).
          - The tie-breaker when multiple satisfactory options exist.

    2. It cannot prevent the committee from making poor judgments (e.g., setting an unrealistic aspiration level, or waiting too long for a marginally better option).

    3. It cannot force a committee to stop when they are influenced by sunk costs. The procedure includes a safeguard (Step 5 and Step 6) that requires a justification for continuing, but the committee can always override by raising the aspiration level (if they can justify it).

    4. It cannot guarantee that the best option is found or chosen. The goal is a satisfactory option in a bounded rational way.

    5. It cannot predict the future. The committee must make decisions under uncertainty about what options might arrive.

    6. It cannot account for negotiation dynamics (like expiring offers) beyond setting deadlines.

    The procedure systematizes the decision-making and creates an auditable record, but it does not eliminate the need for human judgment.

   Drafting the Procedure for the Committee:

   We'll write it as a checklist for the meeting facilitator.

   **Bounded Rationality Decision Procedure**

   **Preparation (Step 0):** 
     - Define the problem and set the initial aspiration level (minimum requirements for a satisfactory option). Record these.

   **At each meeting:**

    1. Review the current aspiration level (from the last meeting or initial). Record any changes and the reason for changes.

    2. Add any new options that have arrived since the last meeting to the pool. Record the new options.

    3. Evaluate every option in the current pool against the current aspiration level. Record which options are satisfactory and why.

    4. Decision Point A: Are there any satisfactory options?
          - If NO:
              a. Discuss: Can we lower the aspiration level (in one or more criteria) to make an option satisfactory? 
                  - If yes, lower the aspiration level (record the new level and reason) and re-evaluate. Then go back to 4.
              b. If not, then decide: 
                  - Should we wait for more options? If yes, set a specific deadline (e.g., one week) for new proposals and schedule the next meeting. Record.
                  - (Rare) If the committee believes the aspiration level must be raised, then:
                      - There must be evidence that the market can provide better (e.g., an option that exceeds the current level has been seen).
                      - The committee must agree that the higher level is necessary (not just desirable) and worth the extra search cost.
                      - If yes, raise the aspiration level (record the new level and justification) and set a deadline for new proposals. Schedule next meeting.
          - If YES: proceed to 5.

    5. Decision Point B: Should we close the pool to new options?
          - Discuss:
              a. Are there any outstanding proposals that we are expecting and that are important? (If yes, set a deadline that allows for their arrival, if feasible.)
              b. Is there time pressure (e.g., expiring offer, project start date)?
              c. How much time and resources have we already spent?
          - Decide:
              - Close the pool now? (set deadline to immediately) -> then proceed to 6.
              - Or set a specific, short deadline (e.g., 2 business days) for new proposals? Then schedule the next meeting and record the reason for waiting.

    6. Decision Point C: Choose from the closed pool.
          - The pool is closed. We have at least one satisfactory option.
          - Choose one satisfactory option. Use a pre-agreed tie-breaker (if multiple) or decide by consensus. Record the choice and the reason.
          - If the committee is reluctant to choose (e.g., because they feel they have invested too much to settle) then:
              a. They must explicitly raise the aspiration level (with justification as in 4b) and record the new level and the reason (which cannot be solely due to sunk costs).
              b. Re-open the pool (set a new deadline) and go back to step 1.

    7. If a choice is made, record the final decision and the rationale.

   **After the meeting:**
     - The record of the decision process (including the aspiration levels at each step, the options considered, and the decisions made) is stored for audit.

   Let's hope this helps the committees. Remember: the goal is not the best, but good enough, and to stop searching when the cost of further search outweighs the likely benefits.
answer: |-
  ### Bounded Rationality Stopping Procedure for Committee Decisions  
  **Core Principles**  
  1. **Aspiration-Driven**: Satisfactory > Optimal.  
  2. **Costly Search**: Time/effort must justify gains.  
  3. **Two Stopping Points**: (A) Close option pool, (B) Commit to an option.  
  4. **Anti-Bias Guards**: Controls aspiration drift and sunk-cost fallacies.  

  ---

  ### Step-by-Step Procedure  
  *Record all answers in meeting minutes. Non-members must be able to audit why/when stops occurred.*  

  #### **Step 0: Initialize (Pre-Meeting)**  
  - **Task**: Define **Minimum Viable Option (MVO)**.  
    - *Committee lists non-negotiable criteria (e.g., "Supports mobile surveys," "GDPR compliant," "Cost ≤ $X").*  
    - *Record MVOs in writing.*  
  - **Output**: Aspiration baseline. Adjustable only under Step 2 rules.  

  #### **Step 1: Screen Current Pool (First 15 mins)**  
  - **Task**: Evaluate *all* options against MVO. Tally:  
    - ✅ Meets MVO  
    ❌ Fails MVO  
    ⭐ Exceeds MVO  
  - **Question 1**: *"Is there ≥1 ✅?"*  
    - **Yes** → Proceed to **Step 3** (Closing Pool).  
    - **No** → Proceed to **Question 2**.  

  #### **Step 2: Adjust Aspirations (If No ✅)**  
  - **Question 2**: *"Is our MVO unrealistically high?"*  
    - **Yes** → **Lower MVO**. Remove/relax a criterion. *Record reason* (e.g., "No vendors offer feature X at target cost").  
    - **No** → Continue search. *Set deadline for new options* (e.g., 48 hrs). **Stop meeting**; reconvene.  
  - **⭐ Rule for Raising MVO**:  
    - Permitted *only* if:  
      (a) An option **exceeds MVO** (⭐), *and*  
      (b) Committee agrees: "This new standard is **necessary** (not just nice) and we have **evidence** it’s widely available."  
    - *Invalid reasons*: "We feel we can do better," "Vendor Y’s demo impressed us."  
    - *Record justification* (e.g., "3 vendors now offer AI analytics, which is critical for Phase 2").  

  #### **Step 3: Close the Option Pool (Decision Point A)**  
  - **Question 3**: *"Should we accept new options?"*  
    - **Close pool if**:  
      - ≥1 ✅ exists, *and*  
      - **Either**:  
        (a) Time-sensitive cost (e.g., expiring offer),  
        (b) No **specific, imminent** proposals expected (e.g., "Vendor Z promised submission by today").  
    - **Keep open if**:  
      - A known high-value option is en route (e.g., "Vendor A’s proposal arrives Friday"). *Set hard deadline* (≤5 days).  
  - **Output**: "Pool closed on [date]" or "Deadline: [date]." *Record reason.*  

  #### **Step 4: Commit to an Option (Decision Point B)**  
  - **Question 4**: *"Is there ≥1 ✅ in the closed pool?"*  
    - **Yes** → **Choose any ✅**. *No ranking needed.*  
    - **No** → Return to **Step 2** (adjust MVO).  
  - **Sunk-Cost Override**:  
    - If committee resists ("We’ve spent 3 meetings—we can’t settle!"):  
      - **Require**: New MVO raise (per ⭐ Rule) *with evidence*.  
      - **Else**: Chair forces commitment to a ✅. *Record dissent.*  

  #### **Step 5: Finalize & Audit**  
  - **Output**: Document:  
    - Chosen option and why it meets MVO.  
    - Dates of pool closure/commitment.  
    - All MVO changes with justifications.  

  ---

  ### Case Applications  
  #### **(a) Survey Platform ($6K; member keeps adding options)**  
  - **Step 1**: One platform ✅ MVO.  
  - **Step 3**: Close pool? **Yes**—no imminent proposals. Member’s "one more" is speculative.  
  - **Step 4**: Commit to ✅.  
  - **Audit Trail**: "Closed pool after 2 options; chose [Platform] meeting MVO. No justified reason to delay or raise MVO."  

  #### **(b) Data Manager Hire (Offer expiring Friday)**  
  - **Step 1**: Candidate A ✅ MVO.  
  - **Step 3**: Close pool? **Temporary hold**: "Strong applicant might materialize" → Set deadline = Thursday.  
  - **Post-Deadline**:  
    - If stronger candidate arrives ✅ → Choose either ✅ (tie-breaker: fit/start date).  
    - If no one → Commit to Candidate A.  
  - **Audit Trail**: "Pool closed Thu; Candidate A met MVO. Stronger candidate not materialized by deadline."  

  #### **(c) $400K Platform (Procedure prefers second-best)**  
  - **Step 1**: Option X ✅ MVO; Option Y (best) ⭐ but misses 1 MVO criterion (e.g., "cloud hosting").  
  - **Step 2**: **Can’t raise MVO**—no evidence cloud hosting is necessary/widely available.  
  - **Step 3**: Close pool (✅ exists).  
  - **Step 4**: Commit to Option X.  
  - **Sunk-Cost Override**: Committee tries to reject—forced to raise MVO *with evidence* or commit.  
  - **Audit Trail**: "Chose Option X (met MVO). Option Y failed MVO criterion [cloud hosting]. No justification to raise MVO post-hoc."  

  ---

  ### What the Procedure Cannot Do  
  1. **Eliminate judgment calls**:  
     - **MVO definition** is inherently subjective (e.g., "user-friendly" requires interpretation).  
     - **"Necessary" vs. "nice-to-have"** relies on committee discretion.  
  2. **Predict option quality**:  
     - May commit to early ✅ while better options exist (e.g., Case C).  
     - Cannot force committees to wait for uncertain options (e.g., Case B).  
  3. **Override authority**:  
     - Committees can ignore the procedure by fabricating "evidence" to raise MVO (e.g., "We feel AI analytics is essential now").  
     - Sunk costs may still sway decisions if chairs don’t enforce rules.  
  4. **Asynchronous arrivals**:  
     - Risk of missing options arriving *just after* pool closure.  
     - No recourse for buyer’s remorse post-commitment.  

  ### Why This Aligns with Bounded Rationality  
  - **Satisficing**: Explicit ✅/❌ replaces optimization.  
  - **Cost control**: Deadlines cap search costs; MVOs anchor expectations.  
  - **Aspiration dynamics**: ⭐ Rule legitimizes upward adjustments (Simon’s "adaptive aspirations") while curbing whims.  
  - **Anti-regret**: Forces "good enough" during deliberation—not in hindsight.  

  This procedure transforms Simon’s theory into actionable guardrails, but committees retain power to override it. Transparency in the audit trail shifts debate from "Did we find the best?" to "Did we follow a defensible process?"—which is what auditors actually need.
