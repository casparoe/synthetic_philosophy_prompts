          2. Ask those who did the full cycle: "Why did you make each trade?" (Expect: at the time it seemed better.)

          3. Explain that this is a money pump.

          4. Ask those who locked in: "Why did you lock in?" (Expect: to avoid future fees or because they were happy with their DVD.)

          5. Discuss: 
              - Naive: those who traded in every opportunity and got pumped.
              - Sophisticated: those who locked in to avoid being pumped in the future.
              - Resolute: those who decided at the beginning not to trade at all (if any) or who stuck to a plan.

          6. Discuss the philosophical question: does being exploitable over time imply that your preferences are irrational at each moment?

     What the activity cannot capture:

          - The infinite pump: we only did one cycle.
          - The possibility of repeated pumps might make the loss unbounded, which is more dramatic.
          - The argument that if you are not willing to pay to change, then your preferences might not be as strong? (But that's a deeper point.)

     Prediction of what will go wrong:

          - Some participants will not have intransitive preferences and will not trade in a cycle. They might only trade once or twice. That's okay because we only need a few examples.

          - Some participants will suspect a trap and avoid trading altogether. We can only hope that the interleaving with other topics and the cover story about multiple decision exercises will mask it.

          - The precommitment round might be underutilized because participants don't anticipate the future trades. We might have to reveal that there will be trades between A and B, B and C, and C and A? But that would give away the cycle. So we don't reveal. Therefore, some sophisticated participants might not lock in because they don't know what the future trades are. This is a flaw.

            How to fix? We might say: "There will be trades between every pair of DVDs again, in the same order." But that gives away the cycle. Alternatively, we can say: "There will be more trades involving these DVDs, but we won't specify which ones." Then they have to think about the possibility of a cycle.

            I think we should say: "The future trades will be similar to the ones we've had: trades between A and B, B and C, and C and A, in that order." This reveals the cycle but at a point where the sophisticated choice can be made. And it's after they have experienced one cycle, so they might have noticed the pattern. This is acceptable because we are about to discuss diachronic rationality.

            Therefore, in the precommitment round, we say: "There will be more trading rounds: first between A and B, then between B and C, then between C and A. Each trade will cost $10. You have the option to lock in now to avoid these future trades."

          Then the sophisticated choice is clear.

     Revised timeline for precommitment:

          75-80 min: Precommitment round.
            - Announce: "We are going to have three more trading rounds: first between A and B, then between B and C, then between C and A. Each trade will cost $10. But now we offer you the chance to lock in your current DVD. If you choose to lock in, you will not be able to trade in any of these future rounds and you will not have to pay any trade fees. Do you want to lock in? (Yes/No)"

          80-85 min: Trade A vs B (for those who didn't lock in).
          85-86 min: Trade B vs C (quickly, just collect slips).
          86-87 min: Trade C vs A.

          We run these three trades very quickly because they are just slips.

     Then we have time for debrief.

     This design is concrete and I would run it this way.
answer: |-
  ### Diachronic Rationality Activity: The Preference Pump Challenge  
  **Objective:** Create an experiential money pump scenario where participants reveal intransitive preferences through sequential choices, then explore sophisticated/resolute strategies. Real stakes (small cash/prize) enhance engagement, but play money works if framed competitively.  

  ---

  ### **Core Mechanics**  
  - **Options:** Three abstract "artifacts" (A, B, C) with attributes designed to induce intransitive preferences:  
    - **A:** *Quantum Crystal* (High scientific value ★★★★, Low aesthetic value ★)  
    - **B:** *Mystic Painting* (High aesthetic value ★★★★, Low historical value ★)  
    - **C:** *Ancient Coin* (High historical value ★★★★, Low scientific value ★)  
    *(Attributes tap into subjective academic/cultural biases among students.)*  
  - **Stakes:** Start with **$5 in real money** (or $500 play money; real stakes recommended for emotional buy-in). Facilitator collects $5 upfront, refunds leftovers + bonus prize for top earner.  
  - **Trading Rounds:** 4 rounds disguised as "ownership preference experiments." Each trade costs $0.50 (real) or $50 (play).  
  - **Key Twist:** Rounds are interleaved with a distracting task (e.g., a 5-min puzzle break) to prevent immediate pattern recognition.  

  ---

  ### **Setup**  
  **Materials:**  
  - Envelopes with artifact cards (A, B, C) + starting money.  
  - Trading slips (participants write trades secretly).  
  - Timer, whiteboard for tracking.  
  - Optional: Distracting puzzle sheets (e.g., logic grids).  

  **Seeding Preferences:**  
  - Begin with a "preference survey" (masked as icebreaker):  
    *"Rank artifacts: Which would you pay to own? Hypothetical bids: A vs B, B vs C, C vs A."*  
  - Later, use this to identify intransitive voters (A>B, B>C, C>A).  

  ---

  ### **Timeline (90 Min)**  

  #### **Phase 1: Initial Trades (0–35 min)**  
  - **0–10 min:** Distribute artifacts randomly (1/3 get A, 1/3 B, 1/3 C). Explain:  
    *"Today, we’re studying ownership dynamics. You’ll trade artifacts; each trade costs $0.50. Keep your final artifact + leftover cash. Top earner wins a $20 bonus."*  
  - **Round 1 (Trade A⇄B):**  
    - *"Trade period open: Swap A for B or B for A? Write 'TRADE' or 'KEEP' on slips. You have 2 min."*  
    - Collect slips, record trades, deduct fees.  
  - **10–25 min:** **Distraction Task**  
    - *"Now, a short cognitive exercise: Solve this logic puzzle in 5 min."* (Simple grid puzzle).  
    - *After puzzles, discuss:* "How did attention affect choices?" (Red herring).  
  - **Round 2 (Trade B⇄C):** Same as Round 1.  

  #### **Phase 2: The Trap Springs (35–60 min)**  
  - **35–40 min:** **Round 3 (Trade C⇄A)**  
    - Same format. By now, intransitive participants have likely:  
      - Traded A→B (cost $0.50), then B→C (cost $0.50), now C→A (cost $0.50).  
      - **Result:** Back to starting artifact, minus $1.50.  
  - **40–55 min:** **Distraction + Precommitment**  
    - *"New task: Write a 100-word argument for why your artifact is most valuable. Then, trade with a partner."*  
    - After, announce: *"Final round coming. Option: Pay $0.20 to LOCK your artifact. If locked, you skip future trades."*  
    - **Sophisticated choice:** Locking avoids further pumps.  
    - **Resolute choice:** Some may lock to "stick to a plan" despite Pareto-dominant trades.  

  #### **Phase 3: The Pump Resumes (60–75 min)**  
  - **Round 4 (Trade A⇄B again):**  
    - Locked players sit out. Others trade (cost $0.50).  
    - Intransitive players may pump again: A→B→C→A, losing another $1.50.  

  #### **Phase 4: Reveal & Debrief (75–90 min)**  
  - **Calculate earnings:** Artifact value = $0 (all equal), so cash is sole measure.  
  - **Show the cycle:**  
    - *"Who has less cash but the same artifact? Why did you trade each time?"*  
    - Map trades to whiteboard:  
      ```  
      A → B → C → A: -$1.50 per cycle  
      ```  
  - **Debrief questions:**  
    1. *"Did anyone feel trapped? When did you realize?"*  
    2. *"Lockers: Why pay to avoid trades? Was it 'rational' self-defense?"*  
    3. *"Is losing money proof of momentary irrationality, or just bookie manipulation?"*  

  ---

  ### **Predictions & Mitigations**  
  **What Could Go Wrong:**  
  1. **Some see the pump early:**  
     - *Mitigation:* Distraction tasks mask the pattern. If exposed, lean into it: *"Why did you trade despite knowing?"* → Explores sophistication.  
  2. **Weak intransitive preferences:**  
     - *Mitigation:* Attribute design (academic/aesthetic/historical) targets grad students’ biases. Pre-survey identifies susceptible players; group them for trades.  
  3. **Players game the system:**  
     - *Acceptance:* Those "exposing" the pump become object lessons: *"You refused trades—why? Does this mimic resolute choice?"*  

  **Why It Works Anyway:**  
  - Real stakes make losses visceral.  
  - Distractions prevent cold, analytical play.  
  - Precommitment phase forces sophistication/resolution debates.  

  ---

  ### **What the Activity Can’t Capture**  
  1. **Infinite Pumps:**  
     - We simulate 1–2 cycles; real pumps exploit *ad infinitum*. Discuss: *"Would you eventually refuse? When?"*  
  2. **Stable Preferences:**  
     - Choices happen in minutes; real pumps assume stable prefs over time. Argue: *"If prefs change, is pumping still irrational?"*  
  3. **Pareto Refusals:**  
     - In Round 4, locking costs $0.20 to avoid a "beneficial" trade. Highlight: *"Paying to avoid improvement feels irrational—but is it?"*  

  ---

  ### **Facilitator Script Snippets**  
  - **Pre-trade:** *"Trade if you strictly prefer the other artifact. No strategizing—go with your gut."*  
  - **Precommitment:** *"Locking costs $0.20. If you expect to make costly trades later, this may save money."*  
  - **Reveal:** *"Notice: Some paid to cycle back to start. Is this a flaw in you, or in the setup?"*  

  ### **Why This Design?**  
  It forces emotional stakes via real money, distractions create "hot" decision-making, and precommitment makes sophisticated/resolute choices tangible. The debrief ties gameplay directly to theory—transforming a "parlor trick" into a lived paradox.  

  Run it twice if needed; first time is a learning pass. Embrace chaos—the messiness *is* the lesson.
