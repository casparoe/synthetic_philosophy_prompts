  ### Which Theory of Possibility Do You Actually Hold?  
  A Decision Tree Quiz for Your Philosophy Reading Group  

  Answer each question based on your intuitive response to the concrete case. Do not worry about philosophical labels—focus on the scenarios.  

  ---

  #### **Question 1: Alice the Politician**  
  *Alice loses an election. When we say "Alice could have won," what does this mean?*  
  - **A**: There exists a scenario where Alice *herself* (the very same person) wins the election.  
  - **B**: There exists a scenario where someone *relevantly like Alice* (but not literally her) wins the election.  

  #### **Question 2: The Undetectable Electron**  
  *Imagine a universe identical to ours, except it has one extra electron in a distant galaxy. This electron has no causal effect on anything in our universe, now or ever. Is this scenario genuinely possible?*  
  - **A**: Yes, it’s a distinct way reality could have been.  
  - **B**: No, it’s not meaningfully different from our universe (since it’s undetectable and irrelevant).  

  #### **Question 3: The Alien Property**  
  *Consider a world where a fundamental property exists (e.g., "quantum-flux") that is instantiated there but has no instance or basis in our universe’s properties. Is this world possible?*  
  - **A**: Yes, properties need not be derived from actual ones.  
  - **B**: No, all possible properties must be composed of or grounded in actual properties.  

  #### **Question 4: The Empty World**  
  *Could there have been absolutely nothing—no concrete objects (particles, fields, minds), just sheer void?*  
  - **A**: Yes, nothingness is possible.  
  - **B**: No, there must exist at least some concrete things.  

  #### **Question 5: Twin Worlds**  
  *Suppose two worlds are qualitatively identical to ours and each other, except individual *A* has *B*’s life (and vice versa). Are these:*
  - **A**: One possible world (they’re indistinguishable in description).  
  - **B**: Two distinct possible worlds (the individuals’ identities matter beyond qualities).  

  #### **Question 6: Grounding "Talking Donkeys"**  
  *Assume "talking donkeys could have existed" is true. What primarily explains its truth?*  
  - **A**: A physical universe (disconnected from ours) where donkeys talk.  
  - **B**: An abstract description (e.g., a consistent story/model) of talking donkeys.  
  - **C**: Recombining actual ingredients (donkeys + speech capacity) without contradiction.  
  - **D**: The usefulness/coherence of talking-donkey stories, without real "worlds."  
  - **E**: No explanation needed—it’s a bare modal fact.  

  #### **Question 7: Are Worlds "Real Stuff"?**  
  *What best describes possible worlds?*  
  - **A**: Concrete physical universes (like ours, but disconnected).  
  - **B**: Abstract entities (e.g., stories, sets of propositions).  
  - **C**: Useful fictions (not real, but help systematize modal talk).  
  - **D**: A way of speaking—no underlying "stuff" needed.  

  #### **Question 8: The Speed of Light**  
  *Could the laws of physics have been different (e.g., the speed of light twice as fast)?*  
  - **A**: Yes, laws are contingent.  
  - **B**: No, laws are necessary.  

  ---

  ### Scoring Key  
  Match your answers to the patterns below. Positions abbreviated:  
  - **Lewisian Modal Realism** (Lewis): Concrete parallel worlds; individuals have counterparts.  
  - **Ersatzism** (Ersatz): Worlds are abstract (e.g., sets of propositions).  
  - **Combinatorialism** (Comb): Possibility = recombining actual entities/properties.  
  - **Modal Fictionalism** (Fict): Worlds are useful fictions; modal claims are "true according to the story."  
  - **Deflationary** (Defl): Modal talk needs no metaphysical "underwriting."  

  | Position              | Answer Pattern (Q1–Q8)                     | Notes                                                                 |
  |-----------------------|--------------------------------------------|-----------------------------------------------------------------------|
  | **Lewisian Realism**  | B, A, A, A, B, A, A, A                     | Q1:B (counterparts), Q2:A (concrete worlds required), Q7:A.           |
  | **Ersatzism**         | A, B, A, A, A or B, B, B, A                | Q5:A/B splits ersatzists: A (anti-haecceitist), B (haecceitist).      |
  | **Combinatorialism**  | A, B, B, A, A, C, D, A                     | Q3:B (only recombined actuals), Q6:C, Q7:D (combinatorial "speaking").|
  | **Modal Fictionalism**| B, B, A, A, B, D, C, A                     | Q6:D (truth via fiction), Q7:C (worlds as fictions).                  |
  | **Deflationary**      | A, B, A, A, A, E, D, A                     | Q6:E (no grounding), Q7:D (language only).                            |

  ---

  ### Diagnostics & Limitations  
  1. **Unseparated Positions**:  
     - The tree *cannot distinguish haecceitist vs. anti-haecceitist ersatzism* (both map to Ersatzism; Q5 is the divider but the tree lumps them).  
     - **Deflationary and Combinatorialism** may overlap on Q7:D (worlds as "manner of speaking"), but Q6 (E vs. C) separates them.  

  2. **Unoccupied Answer Combinations**:  
     - **Q4:B + anything**: Denying the empty world is rare; no major position holds this. Likely reflects *unattractiveness* (most theories accept void as possible).  
     - **Q8:B + Lewis/Ersatz patterns**: No position combines necessary laws with concrete/abstract worlds. Gap reflects *incoherence* (worlds would lack explanatory power).  

  3. **Confidence & Weakest Question**:  
     - **Overall Confidence**: Medium-High (80%). The tree reliably sorts core commitments but has fuzzy edges (especially ersatzism).  
     - **Weakest Question**: **Q5 (Twin Worlds)**. It ambiguously handles ersatzism and may conflate qualitative vs. haecceitist intuitions.  

  ---

  ### How to Use  
  1. Tally your answers (e.g., A,B,A,A,B,C,B,A).  
  2. Find the matching pattern in the key.  
  3. Discuss mismatches! Some combinations (e.g., Q5:B + Ersatz) reveal internal splits.  

  This tree prioritizes *your judgments about cases* over labels. It’s a conversation starter—not a final arbiter. Happy discussing!
