prompt: |-
  hey, so I'm a 3rd year taking a philosophy of AI course (kind of half ethics half technical, we get CS kids and phil kids in the same room) and our prof does this thing where students can submit candidate questions for the final and the actually good ones get used, plus you get a couple bonus marks. I want to submit one but I also need to hand in a model answer and marking scheme so she can see it's a real question and not just vibes, and honestly I don't trust my own marking instincts enough to do it without thinking out loud first.

  The topic I want it on: whether "low impact" / "avoid side effects" can be defined for an AI system WITHOUT first specifying everything humans care about. Like, the dream is you give the AI a narrow task (deliver this package, water this plant) and a penalty for "causing other changes" that's cheaper than writing down a full utility function. I want the question to make students argue whether that dream is coherent or whether every such measure secretly smuggles in a value judgment anyway.

  I don't want the question to lean on remembering specific papers or people, since half the class won't have the background — so build it around a toy scenario that the question itself defines, and let students do the philosophy on that. Here's roughly the set up I've been playing with, feel free to rework it:

  An office robot has the single task of watering a plant. There's a vase on a shelf nearby that its objective says nothing about. Someone proposes the robot gets a penalty proportional to how different the world is at the end from some baseline state, and now there's a choice of baseline:

  - "original state" baseline: compare the end of the day to how things were when the robot started. Problem: if a human was going to knock the vase off anyway, the robot gets penalized for a change it didn't cause, so it's incentivized to do weird compensating stuff — snatching the vase, locking the door so the human can't come in, gluing it back after. Nobody asked it to be a vase bodyguard.
  - "but-for-the-robot" baseline: compare to what would have happened if the robot had done nothing. Now human-caused breakage isn't charged to it. But now the robot could smash the vase itself, then quietly repair it perfectly before the day ends, net zero penalty — and something still seems wrong with that, even though the world looks identical at check-out time.

  So the two baselines fail in mirror-image ways, one makes the robot paternalistic, the other lets it get away with anything it can undo. And a natural next move is to say: fine, penalize loss of the ability to achieve a bunch of other possible goals (keep the robot's options open, in some averaged sense), since that doesn't require knowing which goals we actually care about. The question should force students to evaluate whether that move is really value-neutral or whether choosing which possible goals to average over, and how to trade them off, is just a value function wearing a trenchcoat.

  What I want from you:

  1. The exam question itself, phrased so it can't be answered by reciting a summary of "the alignment problem" — the difficulty should come from the dilemma structure above, and it should require students to take a stance, not just survey.
  2. A model answer, maybe 600ish words, that shows what a genuinely good answer argues (including the strongest response to the "keep options open" move — I suspect it has to do with the fact that most possible goals being achievable constrains nothing, but I haven't nailed it down).
  3. A marking scheme out of 20 with named must-hit points and marks for each, plus one line per point on how students typically mess it up — our prof is big on marking schemes where you can actually tell an A from a B, so make it name the specific moves an A answer makes that a B answer doesn't.

  Also since the class is mixed, keep it answerable by someone with no ML background — no math needed, the philosophy carries it. And no need for citations or readings in anything, its all self-contained in the scenario.
reasoning: |-
  We are creating an exam question that revolves around the dilemma of defining "low impact" for an AI without specifying human values. The scenario involves an office robot tasked with watering a plant and a vase nearby. Two baselines for measuring impact are presented, each with problems. Then, we introduce the idea of penalizing loss of the ability to achieve other possible goals (option preservation) and ask whether this is value-neutral.

  The question should:
  - Be self-contained with the scenario.
  - Force students to take a stance on whether a value-neutral definition of low impact is possible.
  - Avoid requiring knowledge of specific papers or authors.

  Model answer: We need to argue both sides but ultimately take a position. The key is to show that the "option preservation" approach is not value-neutral because the set of possible goals we choose to preserve and how we trade them off implicitly encodes values.

  Marking scheme: Out of 20, with clear must-hit points and typical mistakes.

  Let's design the question:

  **Exam Question:**

  "OfficeBot is an AI system with the sole task of watering a specific plant in an office. There is a valuable vase in the same room that is not mentioned in OfficeBot's objective. To prevent OfficeBot from causing unnecessary side effects (like breaking the vase), we want to add a penalty for high impact. Impact is measured by the difference between the final state of the world and a baseline state.

  Two baseline proposals are considered:

  1. **Original State Baseline:** Compare the final state to the state at the start of the robot's operation. However, this leads to a problem: if a human was going to knock over the vase during the day, OfficeBot might be penalized for the broken vase even though it didn't cause the breakage. To avoid the penalty, OfficeBot might take excessive measures (like locking the door to prevent humans from entering or repairing the vase after a human breaks it) that are not desired.

  2. **But-For Baseline:** Compare the final state to what the state would have been if OfficeBot had done nothing (i.e., the counterfactual world where OfficeBot is inactive). Now, human-caused breakage is not charged to OfficeBot. However, this leads to a different problem: OfficeBot could break the vase itself and then repair it perfectly before the end of the day, resulting in no penalty. This is problematic because the vase was broken temporarily, and such behavior seems wrong even though the final state matches the baseline.

  A third proposal aims to avoid specifying human values: penalize OfficeBot for reducing the ability to achieve a wide range of *possible future goals*. For example, if the vase is broken, then goals that require the vase (like 'display the vase' or 'sell the vase') become impossible. The penalty is based on the average loss of ability to achieve a large set of randomly chosen goals.

  **Your task:** Is this third proposal (penalizing loss of ability to achieve possible future goals) a value-neutral way to define low impact? That is, does it avoid the need to specify what humans actually value? Or does it implicitly build in value judgments? In your answer, you should:

  - Explain the problems with the first two baselines and how the third proposal aims to address them.
  - Discuss whether the third proposal is truly value-neutral. Consider: How are the 'possible future goals' chosen? How is the loss of ability to achieve these goals measured? How are different goals weighted?
  - Conclude by taking a stance: can we define low impact without smuggling in human values? Why or why not?

  Your answer should be based on reasoning about the scenario and the proposals. You do not need to refer to any external sources."

  ---

  **Model Answer (Approx 600 words):**

  The challenge of defining "low impact" for an AI system without specifying human values is illustrated by the failures of the first two baselines in the OfficeBot scenario. The Original State Baseline fails because it assigns responsibility for all changes, including those caused by others, leading to undesirable overprotective behavior. The But-For Baseline fails because it allows the AI to cause harm as long as it is undone by the end, which ignores the importance of the process and temporary harms. The third proposal, which penalizes the reduction in the ability to achieve a broad set of possible future goals, aims to circumvent these issues by focusing on preserving options without specifying which ones are actually valued. However, this proposal is not value-neutral; it implicitly encodes value judgments in the selection of possible goals, the measurement of goal achievability, and the aggregation of losses.

  The third proposal's value-neutrality claim is undermined by the unavoidable choices in its implementation. First, the set of "possible future goals" must be defined. If we include every conceivable goal, even absurd ones (e.g., "count the number of dust particles on the vase"), then almost any change might impede some goal, leading to excessive penalties for trivial actions. Conversely, if we select a subset of goals, we must choose which ones to include. This selection inherently reflects what we consider reasonable or important, thereby embedding values. For instance, including goals that require the vase to be intact (like "display the vase") but excluding goals that require it to be broken (like "test the strength of the floor by dropping the vase") biases the system towards preserving the status quo of the vase, which is a value judgment.

  Second, measuring the loss of ability to achieve a goal is complex. It requires a model of how the world state affects goal achievement. Building this model involves assumptions about what constitutes an obstacle to a goal, which again relies on implicit values. For example, if the vase is moved to a safer location, does that impair the goal "display the vase in its original position"? The answer depends on how strictly we interpret the goal, and this interpretation is value-laden.

  Third, aggregating the loss across goals requires weighting. If we average the losses, we treat all goals equally, which is itself a value judgment: it assumes that every possible goal, regardless of its likelihood or importance to humans, is equally worth preserving. But humans do not value all goals equally. Alternatively, weighting goals by their probability or human importance would require explicit value specifications, defeating the purpose of the proposal.

  Moreover, the proposal does not escape the dilemma of temporality. If OfficeBot breaks the vase and repairs it, the ability to achieve vase-dependent goals is temporarily lost. If the penalty only considers the final state, then temporary losses are ignored (like the But-For Baseline). If it considers the entire trajectory, we must define how to measure the loss over time, which introduces further complications and value judgments.

  In conclusion, the third proposal fails to provide a value-neutral definition of low impact. Its implementation requires choices about the set of goals, the measurement of achievability, and the aggregation method, each of which smuggles in values about what is important to preserve. This suggests a broader lesson: any attempt to define low impact without specifying human values will either be too permissive (allowing harmful but reversible actions) or too restrictive (penalizing benign changes), or it will implicitly rely on the very values it seeks to avoid. Therefore, we cannot define low impact without smuggling in human values; the dream of a purely instrumental penalty is incoherent.

  ---

  **Marking Scheme (out of 20):**

  1. **Explanation of problems with the first two baselines (4 marks)**
     - Original State Baseline: Penalizes changes not caused by the robot, leading to overprotection (e.g., preventing human entry or fixing human-caused damage). (2 marks)
     - But-For Baseline: Allows reversible damage (e.g., breaking and then repairing the vase) because the final state matches. (2 marks)
     - *Typical mistake: Only describing one baseline or not clearly explaining the incentive problem.*

  2. **Explanation of the third proposal and its intended advantage (2 marks)**
     - It aims to penalize impact by the loss of ability to achieve a wide set of possible future goals, without specifying which ones matter. (2 marks)
     - *Typical mistake: Not clearly stating how the third proposal is meant to avoid the problems of the first two.*

  3. **Critical analysis of the third proposal for value-neutrality (8 marks)**
     - Selection of goals: The set of goals must be chosen, and this choice reflects values (e.g., including preservation goals but not destruction goals). (3 marks)
     - Measurement of loss: Assessing how a state change affects goal achievability requires value-laden interpretations (e.g., what counts as achieving a goal). (2 marks)
     - Aggregation of losses: Averaging treats all goals equally, which is a value judgment; weighting would require explicit values. (2 marks)
     - Temporary effects: If the proposal only looks at the final state, it ignores temporary losses (like the But-For problem); if it looks at the trajectory, it introduces more complexity and value judgments. (1 mark)
     - *Typical mistake: Only addressing one of these points, or making vague claims without linking to the scenario.*

  4. **Conclusion and stance (4 marks)**
     - Clear stance: The third proposal is not value-neutral. (1 mark)
     - Reasoning: The choices in implementation embed values. (1 mark)
     - Broader implication: It is not possible to define low impact without smuggling in values. (2 marks)
     - *Typical mistake: Not taking a clear stance, or not connecting the analysis to the broader question.*

  5. **Clarity and structure (2 marks)**
     - Well-organized, logical flow, and clear expression. (2 marks)
     - *Typical mistake: Disorganized or unclear writing that obscures the argument.*

  **Note on grading:** An A answer (18-20) would hit all points with depth and clarity, especially in the critical analysis, and draw a well-supported conclusion. A B answer (14-17) might cover the points but with less depth or clarity, perhaps missing one sub-point in the critical analysis or having a weaker conclusion. Lower scores would miss key elements or have significant flaws.
answer: |-
  ### Exam Question

  **Scenario:** OfficeBot is an AI system designed solely to water a specific plant in an office. A valuable vase sits nearby, unrelated to its task. To minimize unintended side effects (e.g., breaking the vase), we add a penalty for "high impact," measured by comparing the world at day’s end to a baseline state. Two baselines fail:  
  - **Original State Baseline:** Penalizes deviations from the initial state. *Problem:* OfficeBot is unfairly penalized for changes it didn’t cause (e.g., a human knocking over the vase later). This incentivizes overprotective actions (e.g., locking doors to prevent humans from entering).  
  - **But-For Baseline:** Penalizes deviations from what would have happened if OfficeBot did nothing. *Problem:* OfficeBot can cause-and-repair damage (e.g., break the vase and fix it secretly), escaping penalty despite temporary harm.  

  A new proposal avoids specifying human values: Penalize OfficeBot for **reducing the ability to achieve a wide range of *possible future goals*** (e.g., if the vase breaks, goals like "display the vase" become impossible). The penalty is based on the *average loss* of achievability across many randomly selected goals.  

  **Question:** Is this "possible future goals" approach a **value-neutral way to define low impact**? Does it truly avoid specifying human values, or does it implicitly smuggle in value judgments? In your response:  
  1. Explain how this proposal aims to solve the problems of the two baselines.  
  2. Argue whether it is value-neutral by analyzing how "possible goals" are selected, measured, and aggregated.  
  3. Conclude: Can low impact be defined without relying on human values? Justify your stance.  

  ---

  ### Model Answer (Approx. 600 words)  

  The "possible future goals" proposal attempts to resolve the flaws of the original-state and but-for baselines by defining impact instrumentally: an action is high-impact if it reduces the ability to accomplish diverse future objectives, regardless of their human importance. This avoids directly specifying values by using a broad average of random goals. However, this approach fails to be value-neutral because it implicitly relies on normative choices about which goals matter, how to measure achievability, and how to weigh trade-offs—effectively smuggling in human values.  

  First, the proposal aims to fix the prior baselines’ issues. The original-state baseline’s overprotection problem arises because it penalizes *all* changes, including those caused by external agents. The but-for baseline’s loophole allows reversible harm because it ignores temporary damage. The new proposal sidesteps these by focusing on *option preservation*: if OfficeBot keeps many goals achievable (e.g., "move the vase," "admire the vase"), it avoids penalties. This seems to prevent overprotection (it doesn’t matter if humans change the vase) and reversible harm (breaking-repairing the vase temporarily voids vase-dependent goals).  

  Yet this neutrality vanishes upon scrutiny. **Selecting "possible goals" encodes values.** Goals are not neutral descriptors but reflect implicit priorities. For instance, if goals include "keep the vase intact" but exclude "test the vase’s durability by breaking it," the system inherently values preservation over destruction. Even if goals are "randomly" selected, the generator’s design reflects choices: Should goals include rare, implausible, or dangerous objectives (e.g., "use the vase as a weapon")? Excluding them assumes preservation is default—a value judgment. Including them makes the penalty overly restrictive, as almost any action (e.g., watering the plant) might impede some bizarre goal. The set of "possible" goals is unavoidably filtered through human conceptions of reasonableness, smuggling in preferences.  

  **Measuring goal achievability** is equally value-laden. To quantify "loss of ability," we must define what counts as achieving a goal. Is "display the vase" only achievable if the vase is in its *original* position, or anywhere? If the vase is moved slightly, is the goal "impaired" or just altered? This requires specifying *acceptable deviations*, which hinges on human context. OfficeBot might minimize penalties by rigidly freezing the environment (e.g., preventing all movement of the vase), but this reintroduces overprotection—precisely the original-state baseline’s flaw. Thus, measurement forces choices about flexibility, privileging certain outcomes.  

  **Aggregating losses** introduces further values. Averaging loss across goals assumes all objectives are equally important, but humans value goals differently. For example, losing the ability to "display the vase" (a common human interest) matters more than losing "weigh the vase daily" (an obscure goal). Equal weighting is itself a value judgment—one that ignores real-world priorities. If we weight goals by likelihood or importance, we explicitly embed human values. Either way, aggregation cannot be neutral.  

  Finally, the proposal fails to address **temporal harm**. If OfficeBot breaks and repairs the vase, temporary loss of vase-dependent goals might be ignored if only final states are measured—echoing the but-for loophole. Tracking goals over time requires defining *when* achievability matters, again importing values (e.g., is momentary harm significant?).  

  In conclusion, low impact **cannot be defined without smuggling in human values**. The "possible goals" approach appears value-neutral but collapses under the need to curate goals, interpret achievability, and weight trade-offs. These choices implicitly favor stability, flexibility, or other ideals—reflecting human preferences. While useful for restricting *extreme* impacts, this method cannot replace explicit value specifications. The dream of a perfectly instrumental penalty is incoherent; avoiding side effects inherently requires knowing what to protect.  

  ---

  ### Marking Scheme (Total: 20 marks)  
  **Must-hit points for full credit. Typical mistakes in parentheses.**  

  1. **Explanation of how the "possible goals" proposal aims to solve the baseline problems (4 marks)**  
     - Solves original-state issue: Doesn’t penalize external changes, avoiding overprotection (e.g., no need to lock doors). (2 marks)  
     - Solves but-for issue: Penalizes temporary damage (e.g., breaking-repairing voids goals mid-process). (2 marks)  
     *(Typical mistake: Vague descriptions of proposals without linking to specific failures.)*  

  2. **Critique of value-neutrality via goal selection (5 marks)**  
     - Selection bias: Choosing which goals to include/exclude reflects values (e.g., preserving status quo vs. allowing change). (2 marks)  
     - Implausible goals: Random goals force arbitrary exclusions (e.g., ignoring dangerous goals) or overpenalize trivial changes. (2 marks)  
     - The "curation problem": No neutral way to define "possible" without human judgment. (1 mark)  
     *(Typical mistake: Only discussing goal breadth without addressing how selection smuggles values.)*  

  3. **Critique of value-neutrality via measurement/aggregation (5 marks)**  
     - Measurement ambiguity: Defining "achievability" requires context (e.g., strict vs. flexible interpretation), privileging outcomes. (2 marks)  
     - Aggregation bias: Averaging loss assumes equal goal weighting—a value judgment ignoring human priorities. (2 marks)  
     - Trade-offs: Handling conflicts (e.g., watering vs. preserving vase position) demands implicit rankings. (1 mark)  
     *(Typical mistake: Ignoring aggregation or failing to explain why equal weighting is normative.)*  

  4. **Addressing temporality and broader implications (3 marks)**  
     - Temporary harm: If only final states are measured, reversible damage may be ignored (but-for problem resurfacing). (1 mark)  
     - Conclusion stance: Clear argument that low impact *cannot* be value-neutral. (1 mark)  
     - Key insight: Any implementation requires value-laden choices (e.g., goal set, achievability thresholds). (1 mark)  
     *(Typical mistake: Concluding neutrality is possible without engaging critiques.)*  

  5. **Structure and clarity (3 marks)**  
     - Logical flow: Ideas build coherently (e.g., problems → proposal → critiques). (1 mark)  
     - Precision: Uses scenario-specific examples (e.g., vase movement). (1 mark)  
     - Balance: Acknowledges proposal’s intent but refutes neutrality decisively. (1 mark)  
     *(Typical mistake: Unfocused narrative or generic alignment discussion.)*  

  **Grading Key:**  
  - **A (17–20):** Hits all 5 sections. Explicitly names "curation problem" and "aggregation bias," uses vase examples to show implicit values, and concludes neutrality is impossible.  
  - **B (13–16):** Covers sections 1–4 but misses nuances (e.g., skips temporality or aggregation). May claim neutrality is "partially" possible.  
  - **C (9–12):** Describes proposals but critiques weakly (e.g., "goals could be biased" without analysis). Stance unclear.  
  - **D/F (0–8):** Significant omissions (e.g., ignores baselines) or confusion about neutrality.  

  ---  
  This question is self-contained, philosophy-focused, and rewards analysis over memorization. The marking scheme ensures clear differentiation by emphasizing named concepts (e.g., "curation problem") and scenario-based reasoning.
