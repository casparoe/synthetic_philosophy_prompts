  Okay, the user is a high school senior writing an interdisciplinary essay on medicine and society. They've presented a sophisticated puzzle about why medicine treats information disclosure differently in terminal cancer diagnoses versus predictive genetic testing. The core tension is between medical norms and Good's theorem in decision theory, which states that free, actionable information shouldn't harm expected outcomes. 

  Hmm, this is impressively nuanced for high school level. The student clearly grasps both the practical medical dichotomy and the theoretical contradiction. They're not just asking for facts but for philosophical reconstruction - that's advanced. Their quiet emphasis on "presuppose" suggests they want the implicit logic laid bare, not just textbook contrasts. 

  First, I need to mentally map the decision theory angles they've invoked. Good's theorem does seem violated here: both cases involve free information without current treatments, yet disclosure norms oppose. So the "something else" they mention must include factors beyond instrumental utility. Let me brainstorm candidate explanations before settling on one:

  Candidate 1: Actionability threshold theory. Maybe terminal diagnoses allow immediate end-of-life decisions (wills, goodbyes) while genetic risks don't. But Huntington's patients might still make reproductive choices - so this feels incomplete.

  Candidate 2: Temporal discounting of dread. The horror of certain imminent death differs from probabilistic decades-later risk. Yet depression in terminal patients shows knowledge isn't purely empowering.

  Candidate 3: Epistemic sovereignty. Perhaps medicine secretly views autonomy as the right to control one's informational environment, not just make decisions. That would explain why "wanting to know" matters genetically but not oncologically.

  The third resonates most. It positions information as a dignity-conferring good in terminal illness ("you deserve truth") but a potential burden in predictive contexts ("protect your psyche"). This clashes with decision theory's view of information as merely instrumental. 

  But I should acknowledge where practices underdetermine theory. For example, both Kantian autonomy (truth as duty) and Millian autonomy (freedom to choose truth) could justify the genetic norm. Meanwhile, terminal disclosure aligns with both existential authenticity and pragmatic planning. The student needs these philosophical ambiguities highlighted.

  As for applying decision theory rigidly? That would mandate offering all genetic tests by default since one could always ignore results. But medicine wisely resists this - the student rightly suspects hedonic harms (chronic anxiety) outweigh abstract benefits. I'll argue that decision theory's blindness to psychological embeddedness makes it inadequate here. 

  The thorniest bit is terminal illness: if autonomy is about action, why disclose when no actions change? Here I must concede the practice implies information has non-instrumental value - truth as intrinsic to personhood. That's the unspoken premise making paternalism unethical even when "harmless." 

  Finally, the student's "what would change" demand is sharp. Strict decision theory would dismantle genetic counseling's "do you want to know?" gatekeeping. But I'll argue this would be worse medicine, confusing rationality with human flourishing. The conclusion should honor their request to "admit where theory runs out" - perhaps noting that clinical wisdom resides in these very tensions.
answer: |-
  Your inquiry touches upon a profound tension in medical ethics and decision theory, one that reveals medicine's tacit understanding of information as not merely instrumental, but deeply entangled with human temporality, agency, and existential meaning. To reconstruct the implicit theory of information's value underlying these practices, we must move beyond Good's theorem—which, while formally sound, operates in a rarefied space of abstract rationality—and confront the lived reality of patients navigating vulnerability and uncertainty. 

  The terminal diagnosis practice presupposes that information possesses intrinsic moral significance when it illuminates the immediate horizon of one's existence. Here, disclosure is non-negotiable because it respects the patient as a *temporal being* whose autonomy extends beyond action to the fundamental right to orient oneself toward finitude. Concealing a terminal prognosis treats the patient as a passive object rather than a subject who might seek reconciliation, legacy-building, or spiritual preparation—even without actionable treatments. This practice quietly rules out purely consequentialist views where information’s value depends exclusively on altering physical outcomes. It also rejects the notion that psychological distress could categorically outweigh truth-telling; autonomy is prioritized over hedonic states. Yet it does not strictly require that information has *inherent* worth irrespective of consequences. Rather, it assumes that *in this context*, the capacity to confront one’s narrative—crafting meaning from limited time—constitutes a form of "action" itself. To withhold such knowledge would fracture the patient’s agency at the moment it matters most.

  Conversely, predictive genetic testing norms reveal a distinct logic: information’s value becomes contingent on its *assimilability* into a life still unfolding. When decades separate knowledge from potential affliction, the "dread" clinicians fear is not merely psychological discomfort but an ontological burden—a constant shadow that distorts present experience and preemptively collapses future possibilities. The voluntary nature of testing and pre-test counseling implies that information can be *toxic* when decoupled from immediate agency. This practice rules out any theory claiming that rational agents *must* always prefer more information (as Good’s theorem might suggest if rigidly applied). It also challenges autonomy-based arguments for mandatory disclosure, instead positioning autonomy as the *freedom to curate one’s epistemic environment*. Crucially, it acknowledges that humans are not static rational actors but beings whose identities evolve—what one wishes to know at 25 may differ profoundly at 45, and forcing premature knowledge violates temporal autonomy.

  Together, these practices suggest a bifocal theory: information’s value depends on its *temporal proximity to irrevocable change* and its *integration into identity*. In terminal illness, the impending change is certain and existential; knowledge enables coherence. In predictive genetics, the change is probabilistic and distant; knowledge risks fragmenting present selfhood. Both norms reject the idea that information is a neutral tool; instead, they treat it as constitutive of how we inhabit time.

  Where is this pattern philosophically underdetermined? First, it does not specify *why* temporal proximity matters. One could justify terminal disclosure through deontology (truth as duty) or through virtue ethics (authenticity in facing death). Similarly, genetic hesitancy could stem from utilitarianism (minimizing chronic anxiety) or relational autonomy (safeguarding future selves’ choices). Second, the practices do not resolve whether "dignity" in terminal illness derives from the act of knowing itself or from its consequences for life closure. Third, they leave open how to handle borderline cases—e.g., untreatable early-stage Alzheimer’s, where decline is certain but protracted. Here, divergent theories might yield different disclosure norms.

  If Good’s theorem were applied rigorously, medicine would transform radically. Clinicians would offer all costless predictive information by default, assuming patients could optimally ignore or respond to it. Genetic testing for Huntington’s or Alzheimer’s risk would be routinely recommended, not cautiously gatekept. The theorem’s logic—that one can always plan to disregard unwanted news—ignores the psychological impossibility of "un-knowing" and the burden of potential knowledge (e.g., the "Damocles sword" effect). In terminal cases, strict adherence might paradoxically *permit* nondisclosure if a patient could theoretically benefit from ignorance—a position medicine rightly rejects as paternalistic. 

  Would such a decision-theoretic medicine be better? Likely not. Good’s theorem assumes idealized rationality: agents who can compartmentalize knowledge, update beliefs flawlessly, and neutrally weigh probabilities. Real patients grapple with identity, hope, and terror. Forcing genetic knowledge could induce decades of corrosive vigilance, distorting relationships and life choices without enabling prevention. Conversely, permitting nondisclosure in terminal illness would undermine trust and reduce patients to recipients of benevolent deception. Medicine’s current asymmetry—urgent truth, cautious prediction—reflects wisdom about human frailty. It acknowledges that information’s worth emerges not from abstract axioms but from its resonance in a life narrative. Sometimes, protecting a person’s capacity to hope or to focus on the present *is* the ethical act, even if it defies decision theory.

  This leaves us with a deeper insight: what medicine quietly presupposes is that information is not merely *useful* but *existential*. Its value lies not in its freedom or actionability alone, but in whether it illuminates or obscures the horizon toward which a person walks—and whether they chose to hold that lantern themselves. Your grandmother’s doctors illuminate the path before her feet; genetic counselors ask if one wishes to see storms gathering far ahead. Both honor agency, but they recognize that seeing too far, when no shelter exists, can paralyze the journey. The unresolved tension is not inconsistency but a testament to how medicine navigates the human condition—one charted not by theorems, but by the fragile, courageous act of living with knowledge.
