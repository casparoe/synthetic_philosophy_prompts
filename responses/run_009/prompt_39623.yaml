prompt: |-
  So here's my situation: I'm a political theory PhD student TA-ing an undergrad course on democratic theory, and the unit I got assigned is the whole "who votes" cluster — compulsory voting, lowering the voting age to 16, and votes for non-citizens (resident aliens, plus the people who argue for diaspora voting or full all-affected-interests enfranchisement). The way it's taught now is as three seperate debates with three seperate literatures, but my hunch is that under the hood they're all one fight about the franchise: what actually makes someone entitled to a vote — being affected by decisions, being subject to the coercive authority that issues them, some kind of reciprocal membership, or a competence-based license? What I want you to write is a decision-tree handout that treats all three debates as points in a single logical space, rather than three topics.

  The tree should start from a commitment everyone in the room already has (call it "the franchise has to be justified, not just inherited from whoever historically had it") and then branch on questions a second-year could answer without knowing any position names. Branch labels are up to you, but the dimensions I care about are roughly: (a) is the ground of the vote affectedness, subjection, membership, or competence; (b) is low turnout itself a wrong or merely a bad outcome, and does forcing people to show up (compulsory attendance vs. compulsory preference disclosure vs. nothing) make sense given your answer; (c) is there a competence threshold below which voting can permissibly be withheld, and what kind of thing clears it — age, knowledge, being subject to the law; (d) stakes and duration — does thirty years of residence without citizenship differ from three, does a 15-year-old governed by school policies differ from one who isn't, does being affected across borders count for anything. Then locate the named positions as leaves: the all-subjected principle view, all-affected-interests, epistocratic restrictionism, the civic-republican duty-to-vote view that endorses compulsory voting, the liberal rights view that wants a very wide but entirely voluntary franchise, the status quo age-based view, and whatever else falls out. Aim for maybe 8–12 leaves, each with one sentence on its most awkward commitment — e.g. does the all-affected view really enfranchise the whole planet on climate policy, does the epistocrat have any story about who administers the competence test and why they're trustworthy.

  Two things beyond the tree itself. First, flag any pair of leaves the tree can't genuinely separate — my guess is the compulsory-voting republicans and the wide-franchise rights liberals get tangled, since both can endorse compulsory attendance for different reasons, but you tell me whether that's a real failure of the tree or just me not seeing the right discriminating question. Second, note the unoccupied corners: combinations of branch answers nobody seems to defend, with a sentence each on whether that's because the view is incoherent, unattractive, or just unexplored. Don't structure any of it around "here's what Rawls says, here's what Brennan says" — build from the logical space and slot the named positions in afterwards, with glosses if you name anyone at all. Audience is second/third-years, it's a two-page handout, and no citations please, I'll add the reading myself later once I know what I think the tree should look like.
reasoning: |-
  Okay, the user is a political theory PhD student who's TA-ing an undergrad course on democratic theory. Their specific assignment is the "who votes" cluster—compulsory voting, lowering the voting age to 16, and votes for non-citizens. They feel these three debates are interconnected under a single question about what justifies the franchise. They want a decision-tree handout that presents these as points in one logical space, not separate topics.

  The user outlined key dimensions: (a) grounds for voting (affectedness, subjection, membership, competence), (b) low turnout as wrong vs. bad, (c) competence thresholds, and (d) stakes and duration. They want the tree to start from a shared premise—that the franchise must be justified, not just inherited—and branch into 8-12 "leaves" representing named positions. Each leaf needs a sentence highlighting its awkward commitment. Additionally, they want two extras: identification of indistinguishable leaf pairs and notes on unoccupied corners of the logical space.

  I need to build this decision tree step by step. Start with a foundational question everyone agrees on: "Why should anyone have a vote?" That branches into the core justifications. Then, for each branch, ask follow-up questions to narrow down to the specific positions. 

  For the first branch after the root, I'll focus on the primary justification: affectedness, subjection, membership, or competence. That's dimension (a). Then, under each, address dimension (d) about stakes and duration—like how affectedness scales with impact or duration, or how subjection applies to minors or non-citizens. After that, tackle dimension (c) on competence thresholds, especially for positions that care about it. Finally, bring in dimension (b) on low turnout and compulsory voting, as this often depends on prior commitments—like whether voting is a duty or a right.

  Now, for the leaves, I need to map named positions. For example: 
  - All-affected interests view: enfranchises anyone impacted, leading to global voting on issues like climate change. 
  - All-subjected principle: focuses on being under coercive laws, but might exclude long-term residents without citizenship. 
  - Civic membership purist: strict citizenship requirement, but ignores affectedness across borders. 
  - And so on for epistocracy, civic republicanism, liberal rights views, etc.

  I'll aim for 8-12 leaves. For each, add the awkward commitment—like for epistocracy, who administers the competence test? Or for all-affected, does it enfranchise the whole world?

  Next, identify indistinguishable pairs. The user mentioned civic republicans and wide-franchise liberals both supporting compulsory attendance. In the tree, they might look similar if we only ask about turnout solutions, but their justifications differ: one sees voting as a duty, the other as a right with instrumental benefits. I'll need a question that separates them, like "Is voting primarily a right or a duty?" That should distinguish them.

  For unoccupied corners, look for combinations no one defends. For instance: 
  - Competence-based justification + no competence threshold: why have competence as grounds if you don't enforce it? Probably unexplored or incoherent. 
  - Membership-based + enfranchising non-members: contradicts the core idea, so incoherent. 
  - Affectedness-based + rejecting long-term residents: inconsistent, so unattractive. 
  - Subjection-based + support for non-citizen voting: actually exists, so not unoccupied. Need to find gaps, like competence + no threshold.

  The handout should be two pages, so the tree needs to be clear and concise. Use plain language for second-years—no jargon, just straightforward questions. Avoid names like Rawls or Brennan; focus on the logic. After building the tree, I'll add the extras as notes.

  Finally, I'll ensure the whole thing flows logically, from broad justifications to specific positions, with the awkward commitments and gaps highlighted. This should help the user present a unified framework for their students.
answer: |-
  Here’s a decision-tree handout treating franchise debates as a unified logical space. The tree starts from a shared premise ("**The franchise must be justified, not merely inherited**") and branches through key questions to locate major positions, highlighting their awkward implications and unexplored corners.

  ---

  ### **The Franchise Justification Decision Tree**  
  *Key: Branches = Questions | Leaves = Positions (with awkward implication)*  

  #### **ROOT: Why should anyone have a vote?**  
  *(Start with core justification)*  
  1. **Is the vote justified primarily by...**  
     - **A: Impact on interests?** → Go to Q2  
     *(Being meaningfully affected by decisions)*  
     - **B: Coercive authority?** → Go to Q3  
     *(Being subject to binding laws/policies)*  
     - **C: Community membership?** → Go to Q4  
     *(Formal/informal bonds of shared society)*  
     - **D: Decision-making competence?** → Go to Q5  
     *(Capacity for rational political judgment)*  

  ---

  #### **Branch A (Impact on interests)** → **Q2: Does the *degree/duration* of impact matter?**  
     - **A1: No — All affected interests vote equally.**  
       → **Leaf 1: Global Affected Interests View**  
       *Awkward: Must enfranchise every human (or entity?) affected by global issues like climate change.*  
     - **A2: Yes — Significant/stakes-weighted impact required.**  
       → **Leaf 2: Stakeholder Enfranchisement**  
       *Awkward: Excludes low-impact residents (e.g., short-term workers) despite clear effects on them.*  

  #### **Branch B (Coercive authority)** → **Q3: Does subjection require *formal citizenship*?**  
     - **B1: No — All subjected to laws vote.**  
       → **Leaf 3: All-Subjected Principle**  
       *Awkward: Enfranchises undocumented immigrants but may exclude diaspora citizens.*  
     - **B2: Yes — Only citizens are "fully subjected."**  
       → **Leaf 4: Civic Membership Purist**  
       *Awkward: Denies votes to lifelong residents without citizenship despite identical subjection.*  

  #### **Branch C (Community membership)** → **Q4: Can non-citizens be "members"?**  
     - **C1: Yes — Based on residence/social ties.**  
       → **Leaf 5: Resident Membership View**  
       *Awkward: Struggles to define "meaningful residence" (e.g., 2 vs. 20 years? tourists?).*  
     - **C2: No — Citizenship is non-negotiable.**  
       → **Leaf 6: Formal Citizenship Exclusion**  
       *Awkward: Denies votes to non-citizen taxpayers funding the state.*  

  #### **Branch D (Decision-making competence)** → **Q5: Is there a *minimum competence threshold*?**  
     - **D1: Yes — Voting requires proven capacity.**  
       → **Leaf 7: Epistocratic Restrictionism**  
       *Awkward: No agreed/neutral authority to design/administer competence tests.*  
     - **D2: No — All competent enough if included by A/B/C.**  
       → *Continues to Q6*  

  ---

  #### **Q6 (For all paths): Is low turnout...**  
     - **E: A *wrong* (violation of duty/justice)?** → Go to Q7  
     - **F: A *bad outcome* (undermines legitimacy)?** → Go to Q8  
     - **G: Not inherently problematic?** → Go to Q9  

  #### **Branch E (Turnout as wrong)** → **Q7: How enforce the duty?**  
     - **E1: Compulsory attendance (blank ballot allowed).**  
       → **Leaf 8: Civic Republican Duty View**  
       *Awkward: Forces the politically hostile to participate, possibly breeding resentment.*  
     - **E2: Compulsory preference disclosure.**  
       → *Unoccupied Corner 1*  

  #### **Branch F (Turnout as bad outcome)** → **Q8: Compulsory attendance to fix?**  
     - **F1: Yes — Necessary for legitimacy.**  
       → **Leaf 9: Liberal Instrumental Compulsion**  
       *Awkward: Coerces voting even if voting is framed as a right, not a duty.*  
     - **F2: No — Improve via inclusion/access.**  
       → **Leaf 10: Expansive Voluntary Franchise**  
       *Awkward: Accepts very low turnout if voters decline to participate.*  

  #### **Branch G (Turnout neutral)** → **Q9: Competence threshold for youth?**  
     - **G1: Age 18+ (status quo).**  
       → **Leaf 11: Age-Based Threshold Default**  
       *Awkward: Assumes competence jumps at 18 despite variation in maturity/knowledge.*  
     - **G2: Lower age (e.g., 16) or test-based.**  
       → **Leaf 12: Developmental Competence View**  
       *Awkward: If 16-year-olds vote, why not competent 14-year-olds? Arbitrary lines persist.*  

  ---

  ### **Key Observations**  

  #### **I. Indistinguishable Leaves**  
  - **Leaf 8 (Civic Republican Duty) vs. Leaf 9 (Liberal Instrumental Compulsion)**  
    Both endorse compulsory attendance, but **Q7/Q8’s framing** separates them: Republicans see voting as a *moral duty* (Q7), Liberals as a *pragmatic tool* (Q8). The tree distinguishes their *justifications*, but their policy outcome (compulsion) overlaps.  

  #### **II. Unoccupied Corners**  
  1. **Compulsory preference disclosure (Q7-E2)**  
     *Why vacant?* Incoherent — Forcing ballot completion violates secrecy/autonomy; no major theory defends this.  
  2. **Competence-based justification + No competence threshold (Q5-D2 path)**  
     *Why vacant?* Unexplored — If competence *justifies* the vote but isn’t enforced, the justification collapses.  
  3. **Membership-based + Enfranchise non-members (C1 path + strict citizenship)**  
     *Why vacant?* Incoherent — Membership views can’t logically include those they define as non-members.  
  4. **Affectedness-based + Exclude long-term residents (A2 path + "insignificant" impact)**  
     *Why vacant?* Unattractive — Hard to argue 30-year residents are "unaffected"; theorists avoid this implication.  

  ---

  ### **Design Notes**  
  - **Audience Fit:** Questions use plain language (e.g., "Does subjection require citizenship?" not "All-subjected principle").  
  - **Logical Flow:** Branches prioritize justifications (A-D) before turnout (E-G) to avoid conflating *who votes* with *how voting works*.  
  - **Named Positions Slotted:** All-affected (Leaf 1), All-subjected (Leaf 3), Epistocracy (Leaf 7), Civic Republican (Leaf 8), Liberal rights (Leaf 10), Status quo (Leaf 11).  
  - **Awkward Commitments:** Focus on real tensions (e.g., epistocracy’s test-administrator problem).  
  - **Two-Page Layout:** Tree fits on page 1; observations on page 2.  

  This structure forces students to grapple with first principles before recognizing "named debates" as clustered answers within a unified space—revealing hidden trade-offs (e.g., expanding membership may not fix turnout).
