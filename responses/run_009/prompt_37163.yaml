  Most challenging will be evaluating the teleological claim. I'm 80% confident it's indefensible as a factual claim, but must acknowledge its psychological utility. The organizer likely uses it as motivational rhetoric (normative reading), though he frames it as historical fact. That gap between presentation and function is probably what bothers the user. 

