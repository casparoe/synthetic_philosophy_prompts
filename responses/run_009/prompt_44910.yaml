  **VerbaLux Performatives™ Limited Warranty & Terms of Binding Force Agreement**  
  **Effective Date:** Upon Utterance (See Clause 7.1)  
  **Document ID:** VL-WARR-ILL-001-R2  

  **1. Parties & Scope**  
  1.1 This Warranty ("Agreement") is issued by VerbaLux Performatives Inc. ("VerbaLux," "we," "us"), a duly incorporated entity authorized under the statutes of Convenia (a recognized jurisdiction for conventional acts), to the original purchaser ("Customer," "you") of any VerbaLux Performative Utterance Product ("Product," "Utterance"). Products include, but are not limited to: Platinum-Grade Wedding Vows (Satin, Matte, or Iridescent Finish), Formal Apologies (Standard or Enhanced Gravity Package), Christenings (Ecumenical or Secular), Binding Contract Acceptances, and Economy Line Congratulations ("EconoGratz™").  
  1.2 This Agreement warrants solely the *illocutionary force* of the Utterance as defined by established conventional procedures within the relevant linguistic community at the time of purchase. It does not warrant the physical medium (e.g., paper, digital file, vocal cords), semantic content satisfaction, or any subsequent perlocutionary effects.

  **2. Warranty Coverage: Felicitous Execution**  
  2.1 VerbaLux warrants that the Product, when uttered strictly according to the included Felicity Conditions Guide ("FCG") by a properly authorized speaker to a competent audience within a recognized conventional context, will successfully execute the designated illocutionary act (e.g., marrying, apologizing, naming, binding, congratulating) for a period of one (1) conventional cycle relevant to the act (e.g., wedding: validity duration per local law; apology: duration of acknowledged receipt; EconoGratz™: 24 hours post-utterance).  
  2.2 Coverage includes rectification of **Misfires** ("Void Acts"), defined as:  
      (a) *Misinvocation:* Utterance attempted where no applicable convention exists (e.g., attempting to knight a cat).  
      (b) *Misexecution:* Procedure flawed or incomplete (e.g., officiant lacks valid credentials; naming ceremony interrupted before water is applied; apology script skipped key reparative clause).  
      (c) *Missapplication:* Speaker lacks requisite authority or standing (e.g., bystander attempts to pronounce marriage; junior employee accepts major contract without delegation).  
  2.3 For verified Misfires, VerbaLux will, at its sole option: (i) provide a replacement Utterance of equal or lesser force; (ii) refund the purchase price; or (iii) dispatch a Certified Felicity Officer (CFO) to re-attempt the procedure *de novo* (travel fees may apply).

  **3. Explicit Exclusions: Non-Defective Execution**  
  3.1 **Abuses** ("Hollow Acts") are expressly **excluded** from coverage. An Abuse occurs when the illocutionary act is felicitously executed (convention exists, procedure followed, speaker authorized, audience present) but lacks sincerity or requisite internal state (e.g., vow uttered without intent to fidelity; apology delivered without remorse; congratulations offered with concealed envy; contract acceptance with planned breach).  
  3.2 **Rationale:** Per prevailing linguistic doctrine (Austin, §IX), a felicitously executed illocutionary act *has occurred* irrespective of speaker sincerity. VerbaLux manufactures conventional formulae, not psychological states. Dissatisfaction stemming solely from insincerity does not constitute a defect in the Product's illocutionary force. You are, for instance, demonstrably married post-Misfire-free vow exchange, regardless of subsequent regret.  
  3.3 **Perlocutionary Failures** ("Ineffective Acts") are covered under a separate, limited warranty (Section 4). An illocutionary act succeeds independently of its consequences (e.g., forgiveness following an apology; marital bliss following vows; business success following contract acceptance).

  **4. Limited Perlocutionary Effect Warranty**  
  4.1 VerbaLux offers a secondary, non-transferable warranty covering only the *reasonable expectation* of a conventional *sequel* action or state following a felicitous illocutionary act, subject to strict limitations.  
  4.2 Coverage is void if:  
      (a) The sequel depends on the addressee's unpredictable internal state (e.g., forgiveness withheld despite flawless apology; marital unhappiness despite valid vows).  
      (b) External circumstances beyond the Product's conventional scope intervene (e.g., market crash voids profitable contract despite valid acceptance; named child develops unrelated nickname).  
      (c) The Product is EconoGratz™ (excluded entirely from perlocutionary coverage).  
  4.3 If a Perlocutionary Failure occurs under warranty and none of the voiding conditions in 4.2 apply, VerbaLux may offer a goodwill gesture, such as a discount on a future Utterance or a written statement of regret regarding the failure. **No refunds or force re-issuance apply.**

  **5. Customer Responsibilities: Uptake & Context**  
  5.1 **Securing Uptake:** The Customer is solely responsible for ensuring the intended audience/hearer is present, competent, attentive, and recognizes the utterance *as* the intended performative act. Failure to secure uptake constitutes a Misfire (Clause 2.2), but VerbaLux is not liable for audience inattention, misunderstanding, or deliberate non-cooperation. Ensure eye contact and clear enunciation.  
  5.2 **Non-Etiolated Use:** Products lose all force if used in non-serious contexts, including but not limited to: theatrical performances, fictional narratives, rehearsals, open-mic nights, satire, philosophical demonstrations, or solitary practice. **All sales for such uses are final; no warranty applies.** Utterances mumbled under one's breath are presumed etiolated.

  **6. Warranty on This Warranty Document**  
  6.1 The illocutionary act of *issuing this Warranty* ("the Warranty Act") is performed by the signatory below, purporting to act under the authority of VerbaLux Performatives Inc.  
  6.2 This Warranty Act is valid *only if*:  
      (a) The signatory is duly authorized by VerbaLux at the time of signing.  
      (b) You, the Customer, receive this document concurrent with or prior to Product use.  
      (c) You recognize this document as a binding warranty.  
  6.3 If the Warranty Act itself suffers a Misfire (e.g., signatory lacked authority), this entire Agreement is void *ab initio*. VerbaLux cannot rectify this failure by issuing a corrective rider or addendum, as a failed procedure cannot be retroactively performed by the same failed office. You may request a new warranty document issued by a verified CFO.

  **7. General Provisions**  
  7.1 **Effective Date:** This Agreement takes force upon your first felicitous utterance of a VerbaLux Product, or upon receipt of this document, whichever occurs later *and* is recognized by VerbaLux systems.  
  7.2 **Transferability:** Non-transferable. Coverage applies only to the original utterance event by the original purchaser.  
  7.3 **Governing Law:** Disputes shall be settled by binding arbitration conducted under the Rules of Felicitous Discourse by the Convenian Chamber of Linguistic Commerce (CCLC). Sincerity challenges are inadmissible per Clause 3.

  ---

  **VERBALUX PERFORMATIVES™ WARRANTY FAQ**

  **Q1: My VerbaLux Platinum Wedding Vows were pronounced flawlessly by a properly ordained officiant before witnesses. However, my marriage is miserable. Can I return the vows for a refund or declare the marriage void?**  
  A1: No. VerbaLux warranties solely the *illocutionary force* – the successful performance of the marriage act itself – provided all felicity conditions were met (authorized speaker, correct procedure, mutual consent, recognized convention). Subsequent unhappiness constitutes a Perlocutionary Failure (see Clause 4), specifically excluded from core coverage and subject only to the limited provisions of Clause 4.3. Your marriage remains valid. We suggest consulting a relationship counselor or exploring our forthcoming line of Mediated Reconciliation Dialogues (pre-order now!).

  **Q2: I delivered a VerbaLux Formal Apology (Enhanced Gravity) exactly as scripted. The recipient acknowledged hearing it but remains furious and refuses to forgive me. Is this covered?**  
  A2: This is a classic Perlocutionary Failure. The illocutionary act of apologizing was successfully performed (assuming uptake was secured – Clause 5.1), placing the moral onus on the recipient. However, VerbaLux warranties do not cover the recipient's subsequent emotional state or actions (forgiveness being an internal act). Clause 4.2(a) explicitly excludes coverage where the sequel depends on the addressee's internal state. You may be eligible for a minor goodwill gesture under Clause 4.3, contingent on proof of flawless delivery and lack of contributing Abuses (e.g., visible smirking).

  **Q3: I purchased EconoGratz™ for my nephew's graduation. He seemed underwhelmed. Can I upgrade to a Premium Congratulations?**  
  A3: EconoGratz™ are sold "as-is," with warranty coverage limited solely to basic illocutionary force (i.e., the words "Congratulations" were uttered in a context recognizable as a congratulation). Perlocutionary effects (e.g., delight, satisfaction) are explicitly unwarranted (Clause 4.2(c)). Upgrades must be purchased as new Products. Ensure eye contact and a smile for optimal, though unwarranted, effect.

  **Q4: What if I discover the VerbaLux CFO who signed my warranty document wasn’t actually authorized? Does that mean I never had a warranty?**  
  A4: Correct. Clause 6.2 and 6.3 govern the Warranty Act itself. If the signatory lacked proper authority at the time of signing, the act of issuing the warranty was void *ab initio* (a Misfire). You possessed no valid warranty coverage for any Utterances used under that document. You must request a new warranty issued by a verifiably authorized officer. Retroactive coverage for past Utterances is impossible per Clause 6.3.
