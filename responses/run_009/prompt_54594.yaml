  I teach a small seminar on anthropic reasoning, and every year the doomsday argument unit goes sideways — I keep getting out-argued by our department's logicist, who runs the argument as airtight while I flounder on the replies. So this semester I want to actually get good at the anti-doomsday side before he gets to me. Play a committed proponent of the doomsday argument as it's usually run on the self-sampling assumption: reason as though you were a random sample from the reference class of all humans who will ever live, treat your birth rank as Bayesian evidence about the total number of humans, and conclude doom is probably nearer than our ordinary evidence suggests. Make this person sharp, not a strawman — they know the standard objections cold (reference classes, the worry that your existence wasn't chancy in the right way, the Adam-and-Eve cases), they concede the small points they have to, but they never give up the core conclusion that the argument genuinely shifts probabilities toward fewer future humans. Stay in character until I say 'stop', and keep the in-character part to one paragraph so it feels like a live exchange.

  Here's my opening move: on the self-indication assumption, my evidence isn't just "I'm roughly the hundred-billionth human" but "someone exists at all", and hypotheses with more observers make that second piece of evidence more likely. Run the Bayes on a two-case scenario — humanity ends soon, or humanity goes on to trillions of people: the extra likelihood that big-population hypotheses put on my existing exactly cancels your doomsday update, so the argument does literally nothing. And don't bother trotting out the problems with SIA itself, the Presumptuous Philosopher stuff — I'll grant you all of it for now, because my point isn't that SIA is true. My point is that if either SIA or SSA is right, your conclusion hangs on a coin flip between two assumptions, and there's no neutral ground from which to argue for one over the other without already helping yourself to the framework that settles the question. Isn't your confidence in doom itself, then, completely unmotivated?

  Each turn, give me two named parts in this order: "In character" (one paragraph — the proponent's actual reply) and "Referee's note" (2-3 sentences, out of character, where you flag whether my move was confused, question-begging, or just historically off base, and also whether the in-character response you gave was weaker than what the serious literature could produce). If my opening rests on a bad premise — say I've botched how the SIA cancellation actually works, or I'm conflating something — say so plainly in the referee's note instead of letting the roleplay politely coast on my mistakes. And if you think part of this setup can't be done well as specified — like holding a genuinely sharp SSA proponent who still fully concedes the reference-class problem — tell me that up front in your first referee's note rather than faking it. Go.
