  Okay, the user is a graduate student deciding on dedicating a decade to string theory model-building. Their advisor uses indirect indicators like absence of alternatives and internal coherence to justify confidence. The student wants a clear list of requirements that such a methodology must meet to genuinely extend evidence, not just rationalize commitments.

  First, I need to outline the desiderata. The user mentioned several key points: correlation with truth independent of desires, handling the look-elsewhere effect, base rates, and graded confidence. Also, they want to know if some desiderata conflict, like base rates versus landscape robustness.

  Starting with the first requirement: truth-tracking without bias. The advisor's "no alternatives" argument needs to show that the lack of alternatives reflects reality, not sociological factors. This is non-negotiable because if it's just about community dynamics, it's not evidence. For example, Ptolemaic epicycles had no alternatives for centuries, but that didn't make them true.

  Next, the look-elsewhere effect. String theory's landscape can accommodate many outcomes, so not being falsified yet isn't strong evidence. The methodology must explain why flexibility doesn't undermine confirmation. This is crucial; otherwise, theories that explain everything actually explain nothing. Non-negotiable because without this, the theory isn't testable.

  Base rates are tricky. The empiricist would point out that many beautiful theories failed, so history suggests caution. But the string camp might argue that past failures don't apply. The user needs to know if base rates are essential. Here, it's negotiable but important. How many similar theories succeeded? Without data, it's hard to assess.

  Graded confidence is necessary for career decisions. The methodology must provide degrees of belief, not just binary acceptance. Non-negotiable because career choices involve risk assessment. If the advisor can't quantify confidence, it's not useful.

  Now, potential conflicts. Base rates vs. landscape robustness. If string theory's flexibility (landscape) allows it to survive tests, but base rates show most theories fail, how can both be satisfied? This might be a joint unsatisfiability. The more flexible a theory, the lower its prior probability, making high confidence difficult without strong evidence. This tension is key for the user to present to their advisor.

  Also, internal coherence vs. base rates. Coherence might be a truth indicator, but historically, coherent theories have failed. The method needs to weigh coherence against historical failures. This could be another conflict area.

  The user suspects some desiderata can't be met together. Highlighting the base rate and landscape conflict is critical. If the theory's adaptability makes it less falsifiable, but base rates are pessimistic, achieving both high confidence and robustness might be impossible. That's the key takeaway for their discussion with the advisor.
answer: |-
  Here is a structured specification of desiderata for non-empirical theory confirmation, designed to distinguish genuine evidential extension from motivated reasoning. Each requirement includes its rationale, negotiability status, and underlying conflict dynamics. Conflicts between desiderata are flagged explicitly at the end.

  ---

  ### **Core Desiderata for Non-Empirical Confirmation**
  1. **Truth-Tracking Independence**  
     - **Requirement:** The method must demonstrate how the indicator (e.g., "no alternatives") correlates with *truth* independently of human desires or sociological constraints.  
     - **Rationale:** If the absence of alternatives stems from limited imagination, funding biases, or path dependency (e.g., 19th-century ether theories dominating despite flaws), it reflects sociology, not reality.  
     - **Non-Negotiable?** Yes. Without this, the method collapses into psychology.  
     - **Conflict Insight:** Empiricists demand this to exclude groupthink; string theorists assume community expertise navigates constraints objectively.  

  2. **Look-Elsewhere Immunity**  
     - **Requirement:** The method must show why the theory’s *flexibility* (e.g., string theory’s landscape) doesn’t vacuously "absorb" negative outcomes, rendering non-falsification uninformative.  
     - **Rationale:** A theory predicting "anything" (e.g., 10^500 vacua) gains no confirmation from consistency with existing data—it must also *exclude* possible outcomes (e.g., no viable dark matter candidates).  
     - **Non-Negotiable?** Yes. Flexibility without predictive specificity is epistemically empty.  
     - **Conflict Insight:** Critics see landscapes as ad hoc; proponents argue mathematical rigidity (e.g., anomaly cancellation) provides implicit exclusion.  

  3. **Base-Rate Accountability**  
     - **Requirement:** The method must quantify or contextualize historical precedents: *how often* have similar indicators (e.g., coherence, community consensus) led to empirical success versus dead ends?  
     - **Rationale:** Most "elegant" theories fail (e.g., supersymmetric SUGRA, technicolor). Ignoring base rates commits the prosecutor’s fallacy.  
     - **Non-Negotiable?** Conditionally. *Ignoring* base rates is non-negotiable for empiricists; *weighting* them is negotiable (e.g., "string theory is sui generis").  
     - **Conflict Insight:** Empiricists treat base rates as mathematical priors; theorists often dismiss them as irrelevant to "unique" theories.  

  4. **Graded Decision-Relevance**  
     - **Requirement:** Confidence must be quantifiable (e.g., probabilistic) and action-guiding (e.g., "60% chance of empirical validation in 15 years"), not binary belief.  
     - **Rationale:** Career decisions require risk assessment. All-or-nothing commitment ignores opportunity costs (e.g., abandoning quantum computing research).  
     - **Non-Negotiable?** Yes for practical purposes.  
     - **Conflict Insight:** Bayesian frameworks natively support this; non-empirical methods often retreat to vague "promise".  

  5. **Internal Coherence Validation**  
     - **Requirement:** The method must explain why *internal consistency* (e.g., string theory unifying GR and QFT) is a truth indicator rather than aesthetic preference.  
     - **Rationale:** Many coherent theories were wrong (e.g., steady-state cosmology). Coherence must be tied to *unexpected* constraints (e.g., gravity emerging from string vibrations).  
     - **Non-Negotiable?** Partially. Coherence alone is negotiable; coherence *plus surprise* (e.g., mirror symmetry) is stronger evidence.  
     - **Conflict Insight:** Theorists elevate mathematical beauty; empiricists demand surprise be empirically testable.  

  ---

  ### **Key Conflicts Between Desiderata**
  **Base-Rate Accountability vs. Landscape Robustness**  
  - **Conflict:** Base rates demand pessimism (most theories fail), but landscape robustness requires optimism (flexibility ensures survival).  
  - **Joint Unsatisfiability?** Likely **yes**. A method cannot simultaneously:  
    - (A) Weight base rates heavily (implying low prior for speculative theories), *and*  
    - (B) Grant high confidence to a theory explicitly designed to avoid falsification (e.g., landscape multiverse).  
  - **Why?** Landscape theories lower the risk of empirical falsification but *also* lower the evidential value of non-falsification. High flexibility reduces the probability boost from consistency with data (solving the look-elsewhere problem weakens confirmation). Base rates then amplify this: if the theory is hard to kill, its survival is less impressive.  

  **Internal Coherence vs. Base Rates**  
  - **Conflict:** Historical failures of "coherent" theories (e.g., string-inspired preons) clash with claims that string theory’s uniqueness indicates truth.  
  - **Resolution?** Only with a validated model of *which types* of coherence predict success (e.g., coherence resolving known paradoxes vs. abstract elegance). No such model exists.  

  ---

  ### **Conclusion: What to Take to Your Adviser**
  - **The Core Tension:** Non-empirical arguments for string theory face a **fundamental trade-off between robustness and confirmation**. The landscape’s flexibility may ensure the theory survives future data, but this very feature *erodes its claim to be confirmed by current data*. Base rates exacerbate this by suggesting most such survivors are false positives.  
  - **Actionable Insight:** Challenge your adviser to either:  
    1. Reject base-rate relevance (risking historical blindness), *or*  
    2. Explain why string theory’s flexibility doesn’t dilute confirmation (requiring a solution to the look-elsewhere problem), *or*  
    3. Quantify confidence gradationally (e.g., "30% chance of LHC detection by 2035"), making the bet explicit.  
  - **Ultimate Takeaway:** The joint unsatisfiability of **base-rate sensitivity** and **robustness-without-falsifiability** is the strongest critique. If your adviser’s confidence relies on both, the methodology is incoherent. This doesn’t refute string theory—but it forces its defenders to choose which epistemic cost they accept.  

  This framework shifts the debate from "Is string theory true?" to "What would *count* as non-empirical evidence?", exposing the fault lines in the philosophy of high-energy physics. Your career decision hinges on whether you find the unresolved tensions creatively stimulating or methodologically fatal.
