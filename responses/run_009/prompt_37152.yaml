prompt: |-
  Two of my friends have been arguing about effective altruism for like three years now and it's gotten to the point where neither of them actually hears the other one anymore, so I want to commission the document they should have written instead. Friend A is pretty deep in EA — works at a meta-charity-ish org, used to be really into earning to give, defends the whole cost-effectiveness framework on basically every point. Friend B was into it in college, then drifted out and now does labor organizing, and her whole critique is institutional: that EA's obsession with measurability structurally steers money and people toward whatever can be randomized-controlled-trialed (deworming, bednets) and away from anything that works through institutions or politics, that earning to give mostly launders ambitious career choices people already wanted to make anyway, and that a movement funded by tech fortunes is never going to ask the questions that threaten tech fortunes. Friend A says all of this is either wrong or actually a feature: he claims legibility isn't a bias, it's just epistemic hygiene — you do what you can actually measure, and vague appeals to "systemic change" have a bad track record compared to things you can audit.

  They finally agreed to try an adversarial collaboration, and somehow I got voluntold to draft the joint statement. Here's what I need: a numbered section of claims they can both actually sign their names to (I suspect there's more than they think — e.g. about replacement effects in labor markets, or that some EA causes like biosecurity and policy work already don't fit the "measurable only" stereotype). Then a disagreements table where each disagreement is phrased so the person who holds that view would accept the wording — Friend A keeps saying Friend B thinks "EA is bad" and she keeps saying he thinks "nothing EA does could be improved," and I'm pretty sure neither of those is right. Then the cruxes. I have a suspicion about what at least one of them is: whether the measurability constraint is a *selection filter* (it changes which problems get worked on at all, so it compounds over decades) or just a *prioritization tiebreaker* among equally worthy options. But there's also the talent-drift question — whether the sharp kids who go into quant-adjacent EA careers would otherwise have gone into congress or journalism or union stuff or just more quant finance — and the funder-dependence question, which Friend A thinks is just an ad hominem and Friend B thinks is about incentive gradients over time.

  For each crux, if you can, give the concrete case or piece of evidence both sides would agree bears on it, with each side's prediction written down in advance so they can't weasel out later — e.g., what each would expect to see if measurability were really a selection filter, or what the talent question would even look like answered empirically. And if any chunk of their fight turns out to be verbal — I have a feeling "systemic change" means different things to each of them, like policy reform vs. structural change to who holds power — please call that out explicitly and say which part, because at this point I'd happily settle for them discovering they agree more than they admit. Also feel free to note if one side's disagreement is doing less work than its owner thinks, but the goal is a document both could sign, not a verdict on who won.
reasoning: |-
  Okay, let me unpack this fascinating request. The user is mediating a three-year EA debate between two friends with polarized views, and needs a structured document to help them find common ground while clarifying disagreements. 

  First, I'm noticing the core tension: Friend A sees measurability as rational prioritization, while Friend B sees it as systemic bias. The user suspects they agree more than they admit, especially on replacement effects and EA's internal diversity. Smart observation - EA does fund less measurable causes like biosecurity, which weakens B's "only RCTs" critique. 

  For the joint statement, I'll focus on undisputed facts: both care about impact, acknowledge EA's successes with bednets, and agree that career paths affect impact. The replacement effect point is key - both likely accept that labor markets adjust when people change careers. 

  The disagreements table needs surgical phrasing. Instead of "EA is bad" vs "nothing to improve", I'll frame it as: "Does measurability skew cause selection?" vs "Is it merely a tiebreaker?" Cruxes will require testable predictions. For the selection filter hypothesis, we could track if EA funding grows faster for measurable causes over 10 years. 

  The talent drift question needs operationalization: we could compare career surveys of EA quant-types against similar non-EAs. Both sides might accept this data if collected neutrally. 

  Ah, and the "systemic change" ambiguity! I'll flag that B probably means power redistribution while A means technocratic reform. Nailing this terminology could resolve fake disagreements. 

  For funder influence, instead of "ad hominem", we'll frame it as testable institutional dynamics: does foundation funding correlate with avoidance of tech-critical causes? 

  The document should end with concrete next steps: defining terms, gathering data on funding trends, and maybe revisiting EA critiques that acknowledge its evolution. The goal isn't to declare a winner but to restart actual dialogue. 

  User's clearly thought deeply about this - their crux identification is spot on. I'll structure it so both friends see their concerns represented fairly while creating space for movement. Maybe include that meta-point: "Disagreement exists within EA itself on these issues" to normalize their conflict.
answer: |-
  Here’s a draft adversarial collaboration document designed to resolve core disagreements while acknowledging shared ground. It focuses on **testable claims**, **disambiguated cruxes**, and **empirically resolvable predictions** to break the stalemate.

  ---

  ### **Joint Statement: Shared Premises**  
  *(Both parties agree these statements are factually accurate or defensible)*  

  1. **Core Motivation**: Both seek to use scarce resources (time, money, talent) to improve the world as effectively as possible.  
  2. **Evidence Matters**: Interventions should be evaluated rigorously where feasible; unmeasured impact claims deserve scrutiny.  
  3. **EA’s Track Record**: Some EA-backed interventions (e.g., bednets, deworming) have strong evidence for cost-effectiveness in specific contexts.  
  4. **Diversity Within EA**: EA funds causes with low measurability (e.g., biosecurity, policy advocacy, AI safety), contradicting the claim that *only* RCT-friendly work is supported.  
  5. **Labor Market Dynamics**: "Earning to give" creates *some* positive labor substitution (e.g., if an EA banker donates 50% of income, their role is partly filled by someone who wouldn’t have donated comparably).  
  6. **Institutional Skepticism**: Some institutions *are* inefficient or corrupt; measurable interventions can bypass these flaws.  
  7. **Funder Influence**: All philanthropic movements (including EA) are shaped by their funding sources’ incentives, whether tech, corporate, or government.  

  ---

  ### **Table of Clarified Disagreements**  
  *(Each party endorses the phrasing of their own position)*  

  | **Issue**                  | **Friend A’s Position**                                                                 | **Friend B’s Position**                                                                 |
  |----------------------------|-----------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------|
  | **Measurability Bias**     | Prioritizing measurable interventions is *epistemic rigor*, not bias. It prevents waste by focusing resources where impact is verifiable. | The focus on measurability *structurally diverts resources* from high-impact but hard-to-measure domains (e.g., institutional reform, power-shifting). |
  | **Career Impact**          | "Earning to give" legitimately redirects talent from lower-impact roles (e.g., finance) to high-impact giving, with minimal moral laundering. | EA career guidance *primarily legitimizes pre-existing elite ambitions* (e.g., quant finance, tech) instead of redirecting talent to fields like labor/policy where talent gaps exist. |
  | **Systemic Change**        | "Systemic change" is often ill-defined and lacks evidence of cost-effectiveness; measurable interventions deliver proven results. | EA undervalues "systemic change" (defined as *altering power structures/institutions*), which is necessary for large-scale, durable progress. |
  | **Funder Dependence**      | Critiques of EA’s tech funding are ad hominem; decisions are evidence-based, not donor-driven. | Tech-funded EA *systematically neglects causes threatening tech capital* (e.g., antitrust, worker power), due to incentive misalignment. |

  ---

  ### **Cruxes: Testable Predictions & Evidence**  
  *Each crux includes a shared observation that could resolve the disagreement.*

  #### **Crux 1: Is measurability a *selection filter* or a *tiebreaker*?**  
  - **Shared Observation**: Track EA funding allocation over 10 years.  
    - *Friend A predicts*: Funding for "hard-to-measure" causes (e.g., policy, movement building) will grow *proportionally* to measurable causes as EA matures.  
    - *Friend B predicts*: Funding for measurable causes will grow *disproportionately faster*, even when experts identify high-impact but less measurable opportunities.  
  - **Verbal Disambiguation**: Friend B defines "structural diversion" as *underinvestment relative to estimated impact potential*; Friend A defines "rigor" as *avoiding interventions with unquantifiable impact claims*.

  #### **Crux 2: Does EA redirect talent or legitimize elite ambitions?**  
  - **Shared Observation**: Survey EA members in quant/finance/tech careers on:  
    - (a) Their counterfactual career without EA,  
    - (b) Their donation levels vs. peers.  
  - *Friend A predicts*: >70% would be in similar roles but donating far less; EA creates *net talent redistribution*.  
  - *Friend B predicts*: >50% would have pursued policy/labor/nonprofit work; EA enables *talent retention in elite sectors*.  
  - **Key Evidence**: Compare career paths of EA-affiliated students vs. similar cohorts (e.g., philosophy/ethics majors).

  #### **Crux 3: Does tech funding distort EA priorities?**  
  - **Shared Observation**: Audit EA-funded policy proposals/causes that *threaten tech capital* (e.g., data privacy regulation, gig worker rights).  
    - *Friend A predicts*: EA will fund high-evidence work here if cost-effectiveness is demonstrated.  
    - *Friend B predicts*: EA will avoid these topics *even with strong evidence*, due to funder reliance.  
  - **Resolution**: Identify 3-5 "tech-threatening" causes with rigorous impact assessments; track if EA orgs advocate for them proportionally to their evidence quality.

  ---

  ### **Explicit Verbal Agreements**  
  1. **"Systemic change"**: Friend B means *shifting power/institutional constraints*; Friend A means *large-scale policy/advocacy with measurable levers*.  
     → *Shared ground*: Both agree some problems require institutional solutions.  
  2. **"Epistemic hygiene"**: Friend A emphasizes avoiding waste; Friend B agrees but argues some high-impact work *requires* tolerating uncertainty.  
  3. **"Moral laundering"**: Friend B claims EA rationalizes status quo careers; Friend A argues it redirects within constraints.  
     → *Shared ground*: Both agree career impact should be judged counterfactually.  

  ---

  ### **Conclusion & Next Steps**  
  1. Both parties commit to:  
     - Using shared definitions in future debates.  
     - Tracking the proposed evidence (funding allocations, career surveys, policy audits) annually.  
  2. Acknowledge that EA is evolving: e.g., Longtermist EA (focusing on AI/pandemics) already operates in low-measurability spaces.  
  3. Friend A concedes that *some* measurable interventions may crowd out institutional work; Friend B concedes that *some* institutional work lacks accountability.  

  **Signature Line**:  
  _________________________ (Friend A)  
  _________________________ (Friend B)  
  _________________________ (Witness/Mediator)  

  ---  
  This document reframes the debate from **ideological opposition** to **competing testable models**. By specifying predictions and evidence, it forces engagement with reality rather than caricatures. The key was disentangling:  
  - What is *definitional* (e.g., "systemic change"),  
  - What is *empirical* (e.g., funding/talent trends),  
  - What is *values-based* (e.g., risk tolerance for unmeasurable impact).  
  Most conflicts dissolve when both sides realize they’re debating "Is this *always* true?" vs. "Is this *often* true?" – and agree to let data decide.
