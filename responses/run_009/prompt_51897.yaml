answer: |-
  ## Joint Statement: Contextualism vs. Pragmatic Encroachment (IRI) - Adversarial Collaboration

  **Authors:** [Contextualist Proponent Name] & [Pragmatic Encroachment (IRI) Proponent Name]
  **Date:** October 26, 2023

  **Preamble:** After extensive debate, we agree that classical invariantism (denying any significant role for context or stakes in knowledge) fails to capture key intuitions in central cases. We further agree that *something* shifts with practical stakes in knowledge attributions. This document lays out our points of agreement, clarifies our remaining core disagreements, identifies key testable cruxes, and commits us to specific predictions for future discussion. We aim for precision and avoid vacuity: our agreements are substantive enough to exclude classical invariantism.

  ### I. Points of Agreement (Signed by Both)

  We jointly affirm the following claims, recognizing that a *classical invariantist* would reject them:

  1.  **Bank/Airport Cases:** In standard Bank Cases (e.g., DeRose) and Airport Cases (e.g., Fantl & McGrath), the variation in the subject's practical stakes *systematically correlates* with ordinary speakers' intuitions about the truth or falsity of knowledge attributions/non-attributions. The high-stakes subject is typically judged *not* to know, while the low-stakes subject (with the same evidence) *is* typically judged to know. Classical invariantism lacks a compelling, non-ad-hoc explanation for this pattern.
  2.  **Lottery Cases (Special Status):** Lottery cases present a distinct and particularly challenging puzzle for theories of knowledge. Intuitions that one doesn't "know" a lottery ticket is a loser, despite overwhelming statistical evidence, are robust and resist simple explanation via standard "gettier" or "reliability" accounts alone. Both contextualism and pragmatic encroachment offer distinctive (though different) explanations for this intuition that classical invariantism struggles with.
  3.  **Practical Stakes Matter (Somehow):** The practical stakes facing the *subject* play a *genuine and non-eliminable role* in explaining patterns of knowledge attributions and denials in ordinary language. They are not merely pragmatic distractions or performance errors. A satisfactory theory of knowledge must account for this role.
  4.  **The Error Theory Burden:** Classical invariantism owes a plausible and non-question-begging "error theory" explaining why competent speakers so systematically *misattribute* and *misdentify* knowledge in Bank/Airport/Lottery cases based on practical stakes if, as invariantism claims, stakes are genuinely irrelevant to the knowledge relation itself. Mere appeals to "pragmatic implicature" or "loose talk" are insufficient without significant independent motivation and detail.

  ### II. Core Disagreements: Mechanisms & The Notary Case

  We fundamentally disagree on *how* and *where* practical stakes exert their influence:

  | Feature                             | Contextualist Position (As Stated by Contextualist)                                                                                                                                 | Pragmatic Encroachment (IRI) Position (As Stated by Encroacher)                                                                                                                               |
  | :---------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Locus of Shift**                  | The shift occurs in the **semantic content expressed by the word "knows" and its cognates**. The truth-conditions of "S knows that p" vary depending on the **attributor's conversational context** (esp. salience of error possibilities). | The shift occurs in the **knowledge relation itself**. Whether S stands in the knowledge relation to p depends partly on the **practical environment (stakes) of the subject S** regarding p. |
  | **Nature of the Shift**             | The shift is **semantic and contextual**: "Knows" is a context-sensitive term, analogous to indexicals like "I" or gradable adjectives like "tall".                                 | The shift is **metaphysical and invariant**: The standards for the knowledge relation (e.g., required strength of epistemic position) vary with the subject's stakes, but the meaning of "knows" is fixed. |
  | **Dependence on Attribution**       | The shift **only occurs when an attribution (or denial) is made**. The semantic value is fixed by the context of the attributor making the claim.                                       | The shift **occurs regardless of attribution**. The subject's knowledge state itself depends on their stakes, independent of anyone talking about it.                                         |
  | **The Notary Case Verdicts:**       |                                                                                                                                                                                      |                                                                                                                                                                                               |
  | *Does the **Notary** know?*         | **Yes (typically).** In the notary's low-stakes context, the salience of error possibilities is low. An attributor in the notary's context (e.g., a colleague) would truly say "The notary knows the ticket lost." | **Yes.** The notary's practical stakes regarding the ticket are low. The strength of their epistemic position (routine evidence, low cost of error) is sufficient for knowledge *given their stakes*.    |
  | *Does the **Client** know?*         | **No (typically).** The client is in a high-stakes context. An attributor in the client's context (e.g., themselves or a friend advising them) would falsely say "I know the ticket lost" if they said it based only on the odds. | **No.** The client's high stakes (driving 4 hours) mean the strength of their epistemic position (same odds as notary) is *insufficient* for knowledge. The required justification threshold is higher for them. |
  | *Depends on Attributor's Utterance?* | **Crucially Yes.** Whether an utterance "S knows p" is true *in this case* depends on *who is speaking/attributing* and *what context they are in*. An utterance by the notary ("I know it lost") might be true, while the *same words* uttered by the client ("The notary knows it lost") might be false *if the client's high stakes make error possibilities salient in their context*. | **No.** The truth of "S knows p" depends *only* on whether S stands in the knowledge relation to p, which is fixed by S's evidence and S's stakes. The attributor's context/stakes are irrelevant to the truth-condition (though they may affect whether an attribution is *appropriate* to utter). |

  ### III. Key Cruxes & Predictions

  We identify the following unresolved points as central to adjudicating between our views. We commit to the following predictions:

  1.  **The "Contextualism" Label & The Core Disagreement:**
      *   **Crux:** Is the dispute over whether "knows" is context-sensitive (semantic contextualism) merely verbal, masking a deeper, non-verbal agreement that *the subject's knowledge state depends on their practical interests*? Or does the semantic claim genuinely isolate a distinct, testable difference from the metaphysical claim of encroachment?
      *   **Contextualist Prediction:** The dispute is **not merely verbal**. The Notary Case demonstrates a clear divergence: Contextualism predicts the truth-value of an attributor's *utterance* "The notary knows" can shift based on the attributor's context, even while holding the subject's state fixed. Encroachment denies this shift. Further, attempts to "stretch" the attributor's context to *always* include the subject's stakes render contextualism explanatorily vacuous and fail to handle cases where attributor and subject contexts diverge without the attributor being aware of the subject's stakes (e.g., a third party discussing the notary unaware of the client).
      *   **Encroacher Prediction:** While the semantic claim is distinct, **a significant portion of the motivation for contextualism stems from conflating the undeniable impact of stakes on knowledge *ascriptions* (which IRI also explains via the subject's stakes affecting the knowledge *state*) with a semantic mechanism.** The Notary Case highlights the core non-verbal question: **Is the *knowledge state of the subject* (e.g., the notary) itself affected by the *subject's own stakes*?** IRI says No. Is it affected by the *attributor's context*? IRI says No. The semantic mechanism is an unnecessary posit that doesn't correspond to the underlying metaphysical phenomenon. The label "contextualism" is best reserved for the semantic view.
      *   **Test Case:** **The Oblivious Attributor:** A third party, unaware of the client's high stakes or the specific ticket, hears about the notary signing routine affidavits and says, "The notary knows those tickets aren't winners." Is this true? Contextualism predicts **Yes** (attributor's context has low salience). Encroachment predicts **Yes** (notary's low stakes fix their knowledge state). *The disagreement surfaces when the third party learns of the client's specific high-stakes situation regarding one ticket.* If the third party *then* says, "Regarding ticket #123 (the client's ticket), the notary doesn't know it lost," is *this* true? Contextualism predicts it **could be true** if learning of the high stakes makes error possibilities salient in the third party's *new* context. Encroachment predicts it is **false** (the notary's knowledge state remains unchanged by the client's stakes or the third party's awareness).

  2.  **The Problem of Unspoken Contexts / Knowledge Without Attribution:**
      *   **Crux:** Contextualism ties the relevant standards (and thus the truth of knowledge claims) to contexts where knowledge is *actually attributed*. Does this imply there is no fact of the matter about what "S knows" in contexts where no attribution occurs, or where no specific standards are activated? Does Pragmatic Encroachment avoid this problem by making knowledge states interest-relative but context-of-attribution-independent?
      *   **Contextualist Prediction:** Contextualism **does not imply there is no fact of the matter** about a subject's epistemic position relative to p. It only implies that the *semantic content* of the word "knows" isn't fixed until used in a context. We can still say a subject has a "strong" or "weak" epistemic position relative to p, invariant across contexts. The *knowledge attribution* "S knows p" gains its truth-condition from the context of use, which activates specific standards. This is analogous to "It's raining here" – the location isn't fixed until utterance, but the underlying meteorological facts exist independently. Encroachment faces the problem of explaining how the *same* evidence constitutes different epistemic positions (strong enough for knowledge in low stakes, not strong enough in high) for the *same* subject at the *same* time regarding the *same* p, purely based on stakes.
      *   **Encroacher Prediction:** Contextualism **faces a genuine difficulty** in specifying the truth conditions for "S knows p" in contexts where no attribution is made, or in giving a fully general account of a subject's knowledge *state* independent of potential attribution contexts. Pragmatic Encroachment **avoids this problem** because it posits a single, interest-relative knowledge relation: S either stands in that relation to p or not, given S's evidence and S's stakes, full stop. This state exists independently of anyone attributing knowledge. The encroacher readily acknowledges that *whether it is appropriate to attribute* this state can depend on the attributor's context (e.g., relevance, Gricean norms), but the *truth* of the attribution depends only on whether the state obtains.
      *   **Test Case:** **The Solitary High-Stakes Subject:** Hannah is alone, facing a high-stakes decision (like the original Bank Case). She does not utter any knowledge attribution to herself or anyone else. She merely deliberates silently. Does she *know* the bank is open tomorrow? Contextualism struggles to assign a truth value to "Hannah knows" *simpliciter* outside an attribution context. It might say her epistemic position is weak (low strength by high-stakes standards), but avoids saying "She knows" or "She doesn't know" absent a context. Encroachment clearly says **No, she does not know**, because her high stakes raise the threshold her evidence fails to meet.

  3.  **Predictions for the Notary Case:**
      *   **Crux:** How do our theories explicitly handle the central test case?
      *   **Contextualist Prediction:** The truth of knowledge attributions in this case **fundamentally depends on the context of the attributor making the utterance.** "The notary knows" is true if uttered in a low-salience context (e.g., by the notary's colleague), but false if uttered in a high-salience context (e.g., by the anxious client, or by someone focused on the client's dilemma). The notary's *epistemic position* is strong relative to low standards and weak relative to high standards, but the semantic content of "knows" varies.
      *   **Encroacher Prediction:** The truth of "S knows p" in this case **depends solely on the stakes of the subject (S).** "The notary knows the ticket lost" is **true** (because the notary has low stakes and sufficient evidence). "The client knows the ticket lost" is **false** (because the client has high stakes and the same evidence is insufficient). The attributor's context/stakes are irrelevant to the *truth* of these claims (though they affect assertability/pragmatics).

  **Conclusion:** This document clarifies where we agree (excluding classical invariantism), precisely locates our core disagreement regarding the mechanism (semantic context-sensitivity vs. metaphysical interest-relativity), applies this to our key test case, and identifies specific cruxes with testable predictions. We commit to evaluating these predictions and arguments in our future discussions next semester.
