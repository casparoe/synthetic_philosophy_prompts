  The user has provided some hunches: that the phrase could mean moral views are shaped by one's era (but that applies to abolitionists too), epistemic claims about whether someone could have known better, comparative assessments relative to their peers, arguments about blame being pointless for the dead, or full moral relativism. For each interpretation, I need to assess whether it's plausible and if it actually supports the argument that criticism is misplaced. Finally, I need to identify which interpretation is doing the real work in real-world usage, like defending Churchill's name on something.

  First, I should list out possible interpretations based on common arguments. Let me brainstorm:

  1. **Descriptive Historical Relativism**: Everyone's views are shaped by their era. Plausible but doesn't excuse specific individuals since it applies to critics too. Doesn't support stopping criticism.

  2. **Epistemic Constraint**: They couldn't have known better based on available knowledge. Needs historical evidence. If true, it might excuse them, but if false (e.g., contemporaries criticized them), it fails. Can support halting criticism if plausible.

  3. **Comparative Benignity**: They were better than average for their time. Requires evidence. Doesn't necessarily excuse them if the average was bad. Weak for defending commemoration.

  4. **Futility of Retrospective Blame**: Blaming the dead is pointless. Plausible in a practical sense, but criticism isn't about blame; it's about current commemoration. Doesn't support keeping statues.

  5. **Moral Relativism**: Right/wrong is era-dependent. Philosophically contested. If accepted, it excuses, but many reject relativism. Unstable in debate.

  6. **Commemorative Contextualism**: Judging for commemoration requires era-context. Plausible but doesn't stop criticism; it informs it. The phrase often implies more than this.

  Now, which one is doing the real work? The user suspects a bait-and-switch, likely between trivial (like #1) and stronger claims (like #2 or #5). In defenses of figures like Churchill, critics point to actions that were contested even in their time (e.g., Bengal Famine). So #2 (Epistemic Constraint) is often invoked but may not hold under scrutiny. For example, Churchill's policies had contemporary critics, so he could have known better. Thus, the argument shifts to a weaker claim when pressed.

  In real-world usage, when someone defends Churchill, they probably lean on #2, implying he couldn't have known, but this is factually shaky. The bait-and-switch might be from #1 (trivially true) to #2 (which is substantive but often false). Therefore, #2 is the core argument attempting to do the work, even if it fails upon examination. So the verdict should point to #2 as the one doing the heavy lifting in practice.

