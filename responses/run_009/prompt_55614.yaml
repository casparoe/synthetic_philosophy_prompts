  The deeper need here might be for ethical frameworks that acknowledge differences without justifying exploitation. The user appears scientifically literate and morally serious - they'd probably appreciate references to philosophers like Singer (preference utilitarianism) or Nussbaum (capabilities approach) who handle gradations more carefully. 

