  The key weaknesses appear in both steps of the mapping. First, brain size ≠ capacity for suffering - neural density, structure, and specialization matter more than raw size. Bird brains demonstrate this perfectly with their cognitive abilities despite small size. Second, even if capacity varied, moral status isn't necessarily proportional - preventing intense suffering in simpler beings might be equally urgent. 

