prompt: |-
  I am a retired evolutionary biologist — a behavioral ecologist by training, most of my career spent on contest behavior in animals — and in the past few years I have been reading my way into philosophy. I have drafted the outline and core argument of an essay, and before I attempt a full write-up I would be grateful for comments from someone versed in the philosophical literature. The essay concerns David Lewis's account of convention and whether evolutionary biology vindicates, revises, or quietly destroys it.

  My thesis is this: Lewis analyzed a convention as an arbitrary solution to a coordination problem, sustained by common knowledge of a system of reciprocal expectations, and he took rational agents as his subjects. I want to argue that a surprising amount of his analysis survives translation into a population with no rational agents at all. The centerpiece is the old work by Maynard Smith and Parker on asymmetric contests: in the hawk-dove game, if there is an uncorrelated asymmetry between contestants — most famously the difference between the current owner of a resource and a latecomer, which confers no advantage in fighting ability — selection can stabilize a "bourgeois" strategy of respecting possession. Either convention (owner keeps, or finder yields) would do as well; which one wins is a matter of historical accident. That, I want to say, is Lewisian arbitrariness without a single believer in the population. From there I generalize: what Lewis secures through nested expectations — I expect you to conform, expect you to expect me to conform, and so on — natural selection secures through feedback, since a mutant deviating from the local convention is simply outcompeted. And what Aumann calls a correlated equilibrium, with the asymmetry serving as a correlating signal, looks to me like the right game-theoretic home for Lewis's examples: the signal is public enough, and no one gains by ignoring it. I close with a bolder claim: that the normativity philosophers insist is missing from this picture — the sense in which a convention gives us a *reason*, even an *obligation*, to conform — is a later cultural addition laid over a machinery that ran for eons without it, and is no more essential to convention than paint is to an engine.

  I am aware, from conversations and reading, that Brian Skyrms has treated Lewis's convention explicitly with evolutionary game theory, and I do not want to reinvent his book. So my specific requests are these. First, accuracy: are there errors or anachronisms in the way I deploy the Lewisian apparatus — especially in my paraphrase of the common knowledge condition and the arbitrariness condition? Second, and most important to me: does the uncorrelated asymmetry material actually track Lewis's arbitrariness? In the biological cases the asymmetry is sometimes genuinely uncorrelated with payoffs, but sometimes it is correlated, and I worry that I have been coasting on the clean examples. Where does the analogy break? Third, is my replacement of recursive common knowledge by selective feedback philosophically respectable, or does it change the subject — would Lewis be entitled to say that whatever populations of animals have, it is not convention but something convention presupposes? Fourth, on normativity: I have read that Margaret Gilbert presses something like this objection to Lewis himself, and I am inclined to dismiss it as anthropocentric squeamishness, but I suspect a philosopher will tell me I am being too quick, and I would genuinely like to know whether my dismissal is defensible or merely a biologist's habit of treating "it is selected for" as the end of explanation. Finally, tell me plainly whether there is a distinct contribution left in my essay once Skyrms is taken into account, and if so, where I should dig in to make it. I would rather learn now that the paper is a footnote than discover it after submission.
reasoning: |-
  Okay, this user is a retired evolutionary biologist with expertise in animal contest behavior, now diving into philosophy. They've drafted an essay critiquing David Lewis's convention theory through an evolutionary lens, specifically using Maynard Smith and Parker's asymmetric contest models. Their core argument is that biological evolution achieves Lewisian conventions without rationality or common knowledge, via selective pressures. 

  First, I need to assess their understanding of Lewis. They correctly identify arbitrariness and coordination as central, and their paraphrase of common knowledge ("nested expectations") is accurate for Lewis's 1969 framework. No anachronisms spotted—good. 

  The uncorrelated asymmetry analogy is sharp but needs nuance. In biology, asymmetries like resource ownership are often *correlated* with payoffs (e.g., owners fight harder), which muddles the "pure" arbitrariness Lewis requires. I should flag this and suggest they clarify where biological cases align with Lewis (e.g., truly neutral markers like left/right asymmetry) versus where they deviate. 

  Replacing common knowledge with selective feedback is provocative but risks changing the subject. Lewis might retort that conventions require *intentional* responsiveness to expectations, not just Darwinian outcomes. I'll propose they frame this as "proto-convention" to avoid definitional battles. 

  On normativity, their dismissal of Gilbert's critique is understandable but thin. Biologists often treat function as explanatory endpoint, but philosophers see normativity as constitutive. I'll push them to engage Gilbert's point: even if obligation emerges late, its *conceptual role* in human conventions differs from adaptive behavior. 

  Skyrms looms large, but their focus on uncorrelated asymmetries and critique of normativity adds value. I'll highlight how their biological grounding offers a starker challenge to Lewis than Skyrms' rationalist-friendly models. 

  User seems intellectually secure—willing to scrap the paper if redundant—so I can be direct. Their humility ("rather learn now than after submission") is refreshing. I'll balance praise with tough questions to sharpen their argument.
answer: |-
  What a fascinating project—and how refreshing to see Lewis engaged through the lens of behavioral ecology! Your core argument is philosophically significant and elegantly framed. Let’s address your queries point by point, with an eye to both accuracy and originality.

  ### 1. **Accuracy of Lewisian Paraphrase**
     - **Arbitrariness**: Your description is precise. Lewis’s key insight is that a convention solves a coordination problem where *multiple equilibria* exist, and the specific choice is arbitrary (i.e., mutually indifferent *ex ante*). The bourgeois strategy example captures this perfectly.  
     - **Common Knowledge**: You rightly identify Lewis’s recursive structure ("I expect you to conform, expect you to expect me to conform..."). Crucially, Lewis ties this to *rationality*: agents conform because they believe others expect them to, and believe others are rational.  
     - **No Errors**: Your deployment is accurate and non-anachronistic. Lewis’s *Convention* (1969) remains the touchstone, and your summary aligns with contemporary interpretations (e.g., Cubitt & Sugden, 2003).

  ### 2. **Uncorrelated Asymmetry & Arbitrariness: Where the Analogy Holds (and Frays)**
     - **The Strong Case**: When asymmetries are truly uncorrelated with fighting ability (e.g., pure "owner vs. intruder" tags, chirality in snails), the analogy is robust. Selection stabilizes one arbitrary equilibrium (e.g., "owner wins") where the alternative ("intruder wins") would be equally efficient. This *is* Lewisian arbitrariness without beliefs.  
     - **The Complications**:  
       - **Correlated Asymmetries**: If "owner" status correlates with resource-holding potential (e.g., owners are larger/stronger), the asymmetry isn’t arbitrary. Here, the bourgeois strategy may be a *direct* adaptation, not a convention.  
       - **Signaling Costs**: In biology, asymmetries often involve perceptible signals (e.g., badges of status). If these signals are costly or informative (e.g., about RHP), we edge into Zahavi’s Handicap Principle—away from pure convention.  
     - **Key Insight**: The analogy breaks when the asymmetry provides *additional information* affecting payoffs independently of the convention. Your essay should flag this boundary: Lewisian arbitrariness requires that the *only* function of the asymmetry is coordination.

  ### 3. **Replacing Common Knowledge with Selective Feedback**
     - **Lewis’s Likely Objection**: Lewis would insist conventions require *agents who recognize expectations and act on them*. Selectionist explanations replace *reasons* with *causes*—deviants are outcompeted, not because they "violate expectations," but because they lose fights. This risks changing the subject.  
     - **A Defensible Middle Ground**: Frame biological conventions as **proto-conventions** (Sugden, 2004). The feedback loop *simulates* common knowledge: populations stabilize on arbitrary patterns through mutual reinforcement, sans cognition. This doesn’t destroy Lewis’s account but shows its *preconditions* in evolutionary dynamics.  
     - **Philosophical Respectability**: Yes—if pitched as an *extension* of Lewis into non-rational domains. Skyrms (*Evolution of the Social Contract*, 1996) does this, but your emphasis on uncorrelated asymmetries sharpens the focus on arbitrariness.

  ### 4. **Normativity: Gilbert’s Challenge & Your Response**
     - **Gilbert’s Objection**: She argues conventions create *joint commitments*: we feel obligated because we *collectively accept* the norm (*On Social Facts*, 1989). For her, Lewis’s account is descriptively adequate but misses the normative "ought."  
     - **Your Dismissal: Defensible but Needs Nuance**:  
       - **Strong Point**: The biological baseline *does* show coordination without obligation. Normative baggage likely evolved culturally (e.g., via reputation management; see Bicchieri, 2006).  
       - **Caveat**: In *human* conventions, normativity may be *constitutive*. Once agents can represent rules ("we do X here"), violations feel intrinsically wrong—a layer absent in animals.  
     - **Balance This**: Concede that normativity *augments* human conventions but argue it’s not essential for the core coordination function. Cite Boyd & Richerson’s work on norm psychology as an add-on.

  ### 5. **Skyrms and Your Distinct Contribution**
     Skyrms applies evolutionary game theory (EGT) to Lewis but with key differences:  
     - Skyrms focuses on *correlated equilibria* and learning dynamics (e.g., reinforcement learning).  
     - He treats asymmetries as correlating devices but doesn’t stress the *arbitrariness* of uncorrelated tags as you do.  
     - His normativity discussion is thinner; he largely sidesteps Gilbert.  

  **Your Novel Contributions**:  
     - **Arbitrariness via Uncoupled Asymmetries**: You ground Lewis’s abstract arbitrariness in concrete biological mechanisms (owner-intruder, left-right).  
     - **Demoting Normativity**: Your claim that obligation is a cultural exaptation challenges philosophical orthodoxy more sharply than Skyrms.  
     - **Correlated Equilibria Link**: Extending Aumann to biological signals (e.g., possession tags as public correlating devices) is underexplored.  

  ### Recommendations for Strengthening the Essay  
  1. **Clarify the Boundary**: Explicitly distinguish cases where asymmetries are payoff-irrelevant (pure convention) vs. correlated (direct adaptation).  
  2. **Engage Gilbert**: Don’t dismiss—argue that her "joint commitment" presupposes a coordination baseline that evolution provides sans obligation.  
  3. **Refine "Proto-Convention"**: Use this to preempt Lewisian objections: biological analogs are *precursors* to full-blown convention.  
  4. **Original Hook**: Position your work as a *naturalization* of Lewis’s ontology. Biology reveals the skeletal structure of convention before rationality dresses it up.  

  **Bottom Line**: This is far from a footnote to Skyrms. Your behavioral ecology lens offers a bolder, empirically grounded challenge to philosophical assumptions about arbitrariness and normativity. **Dig deepest** into the uncorrelated asymmetry material and the critique of obligation—that’s where your voice shines. If you draft this rigorously, it will be a significant intervention.
