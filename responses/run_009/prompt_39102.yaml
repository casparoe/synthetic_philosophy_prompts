  ### Decision Tree: Positions on Equality  
  *Answer each question based on your immediate reaction to the concrete case. Do not reference theories or thinkers.*  

  ---

  #### **Node 1: Auction on a Desert Island**  
  Two shipwreck survivors use equal clamshell currency to bid for resources (e.g., fruit, tools) until neither envies the other’s bundle. One survivor was born with a severe disability requiring costly medical equipment to achieve basic mobility. **After the auction, must resources be redistributed to provide the disabled survivor with extra support?**  
  - **Yes** → Proceed to Node 2.  
  - **No** → Proceed to Node 8.  
  *Rationale: Tests whether justice requires correcting unchosen disadvantages (brute luck) after fair division.*  

  #### **Node 2: Chosen Risk vs. Birthright**  
  Two people have identical paralysis: Skier A ignored avalanche warnings and caused their injury; Person B was born with it. **Should society provide the same level of healthcare and support to both?**  
  - **Yes** → Proceed to Node 3.  
  - **No** → Proceed to Node 4.  
  *Rationale: Tests whether responsibility for disadvantage (choice vs. chance) affects obligations of redress.*  

  #### **Node 3: The Ascetic**  
  A person fasts into life-threatening malnutrition due to deeply held religious beliefs. Her need for costly care was predictable. **Must society provide healthcare, even if her choices caused her condition?**  
  - **Yes** → Proceed to Node 5.  
  - **No** → Proceed to Node 6.  
  *Rationale: Tests whether commitments beyond personal control limit responsibility for consequences.*  

  #### **Node 4: Expensive Tastes**  
  Person X deliberately cultivated a taste for champagne over years; Person Y, through no fault, finds only caviar satisfying. Both are equally resourced but unhappy with cheaper options. **Should either receive extra resources? If so, whom?**  
  - **Compensate only Person Y (unchosen taste)** → Proceed to Node 7.  
  - **Compensate both** → **Leaf D: Plain Welfare Egalitarianism** (Equal outcomes in welfare, regardless of choice).  
  - **Compensate neither** → Proceed to Node 8.  
  *Rationale: Tests whether justice compensates preferences based on responsibility (chosen vs. unchosen).*  

  #### **Node 5: The Surfer**  
  A surfer works 3 hours/day to live frugally; their neighbor works 60 hours/week at a job she hates, earning more. **Should the state redistribute to make them equal in resources or welfare?**  
  - **Yes, equalize welfare** → **Leaf D: Plain Welfare Egalitarianism** (Equal outcomes in welfare, regardless of choice).  
  - **Yes, equalize resources** → *Incoherent path: Resource equality after Node 2 (ignoring choice) contradicts compensating for unchosen welfare deficits in Node 1.*  
  - **No** → **Leaf E: Relational/Democratic Egalitarianism** (Focuses on social status, not resources/welfare; opposes "tracking" choices).  
  *Rationale: Tests whether leisure/work choices justify inequality.*  

  #### **Node 6: The Negligent Motorist**  
  A driver stranded in a self-caused snowstorm (after ignoring warnings) needs rescue. **Should rescuers: (a) save him unconditionally, or (b) treat him as responsible, with lectures or delayed aid?**  
  - **Unconditional rescue** → Proceed to Node 8.  
  - **Conditional rescue** → **Leaf H: Strict Desert** (Entitlements track effort/contribution; aid degrades if undeserved).  
  *Rationale: Tests whether attributing responsibility degrades recipients and undermines social equality.*  

  #### **Node 7: The Metric**  
  Two people have identical resources. Person A is content; Person B has chronic depression and finds nothing satisfying. **Does their equal resourcing mean they are treated equally?**  
  - **Yes** → **Leaf A: Dworkin (Brute-Luck Egalitarianism of Resources)** (Equality via hypothetical insurance; outcome reflects responsible choices).  
  - **No** → Proceed to Node 8.  
  *Rationale: Tests whether resources suffice for justice, or if welfare/advantage matters more.*  

  #### **Node 8: Below the Threshold**  
  Two people are poor: Able has $10/day; Disabled has $1/day and needs $5/day for basic dignity. Taxing Able $1 to give to Disabled leaves both below subsistence ($9 vs. $2). **Is this transfer required?**  
  - **Yes, due to the gap** → **Leaf F: Prioritarianism** (Worse-off prioritized; absolute improvement matters).  
  - **Yes, but only if it lifts Disabled nearer sufficiency** → **Leaf G: Sufficientarianism** (Justice ensures everyone meets a threshold; gaps below it are irrelevant).  
  - **No** → **Leaf H: Strict Desert** (Entitlements track effort/contribution; transfers punish diligence).  
  *Rationale: Tests whether justice cares about gaps below sufficiency or only thresholds.*  

