  ### Scoring Key  
  *Match your path (e.g., "1Y-2N-4CompY-7N-8Y") to a leaf. If your answers conflict, see "Tensions" below.*  

  | **Leaf** | **Path** | **Position** |  
  |----------|----------|--------------|  
  | **A** | 1Y-2N-4CompY-7Y | **Dworkin (Resources)**<br>*Hypothetical insurance corrects brute luck; resources define equality.* |  
  | **B** | 1Y-2N-4CompY-7N-8[Any] | **Arneson (Opportunity for Welfare)**<br>*Equality in *opportunity* for welfare; outcomes reflect responsible choices.* |  
  | **C** | *Same as B* | **Cohen (Access to Advantage)**<br>*Like Arneson, but "advantage" blends welfare and capabilities. The tree cannot separate this from Arneson without a case on non-material disadvantage (e.g., social exclusion).* |  
  | **D** | 1Y-2Y-3Y or 1Y-2N-4CompBoth | **Plain Welfare Egalitarianism**<br>*Equal welfare always required; choice is irrelevant.* |  
  | **E** | 1Y-2Y-3N-5N | **Anderson/Scheffler (Relational)**<br>*Equality is social, not material; "tracking" choices undermines dignity.* |  
  | **F** | 1Y-2Y-3N-5Y or 1N-8Y | **Parfit (Prioritarianism)**<br>*Benefiting the worse-off matters most, regardless of cause.* |  
  | **G** | 1N-8Y(If qualified) or 1Y-2Y-3N-5N-8Y(If qualified) | **Frankfurt (Sufficientarianism)**<br>*Justice requires sufficiency; inequalities above/below it don’t matter.* |  
  | **H** | 1N-8N or 1Y-2Y-3N-6C | **Strict Desert**<br>*Entitlements reflect effort/contribution; redistribution punishes virtue.* |  
  | *Vacant* | Paths like 1Y-2Y-7Y | **Incoherent: Choice contradictions**<br>*E.g., "yes" to correcting unchosen disability (Node 1) but "no" to compensating the ascetic’s unchosen commitments (Node 3) creates tension around responsibility.* |  
  | *Vacant* | Paths ending at 1Y-2N-4CompNeither | **Unoccupied: Denying compensation for unchosen expensive tastes after accepting brute-luck correction**<br>*Incoherent—why compensate some brute luck (disability) but not others (tastes)?* |  

  #### **Tensions in Crisscrossed Paths**  
  If your answers conflict (e.g., "no" to brute-luck correction in Node 1 but "yes" to compensating unchosen tastes in Node 4), your view may:  
  - **Overextend/undercut responsibility**: You want choices to matter (e.g., leisure, risk-taking) but not in ways that stigmatize (e.g., denying rescue) or ignore unchosen burdens (e.g., depression).  
  - **Mix metrics**: You shift between resources, welfare, and social dignity without a clear principle.  
  - **Inconsistent thresholds**: You prioritize the worst-off in some gaps (Node 8) but not others (Node 1).  
  *Discuss: What makes a disadvantage "chosen"? When does redressing inequality undermine freedom or dignity?*  

  #### **Design Notes**  
  - **Arneson/Cohen indistinguishability**: The tree cannot separate them without a case like *"Two people with identical opportunities, but one faces social prejudice—must society compensate?"* (Cohen might say yes; Arneson may not).  
  - **Vacant cell (Dworkin without responsibility)**: No coherent position endorses Dworkin’s insurance market but denies it tracks responsibility. The market *is* a responsibility-tracking device—it simulates choices people would make to insure against brute luck.  
  - **Unused node**: *Negligent Motorist (Node 6)* is skipped in some paths; it only triggers for desert/relational exits.
