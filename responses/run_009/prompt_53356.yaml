prompt: |-
  I cover science and ideas for a mid-sized paper, and a recent column of mine on the rationality of voting in large elections provoked a disagreement between two readers whose exchange I'd like to see adjudicated. The column made the familiar point that a single vote is almost never causally decisive, so the direct instrumental case for voting is weak. One reader, a mathematician, wrote in defending the practice on what he called superrational grounds: in an electorate of millions, there are bound to be many voters who deliberate as he does, weigh the considerations as he does, and reach their decision through much the same process — so his choice is not an isolated event but one node in a pattern, and the right way to reason is as if deciding for the whole class of similar deliberators, which multiplies the impact of his ballot enormously. A second reader, a philosophy PhD student, replied that this is an elementary confusion of correlation with causation: the similarity of other voters' deliberations explains why their choices tend to co-vary with his, but their ballots are already sealed or will be marked independently, and no amount of resemblance makes his pencil cause theirs to move. The mathematician answered that this objection proves too much, since it would also condemn one-boxing in Newcomb's problem, where the payoff correlations plainly seem worth acting on even without causal influence; the student countered that Newcomb involves a predictor whose behaviour depends on your earlier type, whereas the electorate contains no such mechanism, only a statistical resemblance — and that the superrationalist quietly helps himself to a symmetry condition ("people who reason like me") that is never actually satisfied, since even two people who reach the same conclusion typically do so from different private information and for different reasons, and in any case a resemblance in reasoning is not a channel of influence. The mathematician's last word was that decision theory which cannot distinguish choosing in a crowd of your own kind from choosing alone has missed something fundamental about what agents are. They have each written to me asking for a verdict, and I am out of my depth beyond a certain point.

  Please adjudicate their exchange move by move: say who is right at each step and to what degree, identify what (if anything) each is missing in the other's argument, and give an overall verdict on whether superrationality rescues the rationality of voting in large elections — or whether it rests on a genuine but different insight that the argument misuses. Where the disagreement turns on the contrast between evidential and causal ways of valuing outcomes, please make that contrast explicit rather than gesturing at it, and address the one-boxing analogy directly rather than treating it as obviously decisive for either side.
reasoning: |-
  Okay, I need to help adjudicate this disagreement between a mathematician and a philosophy student about whether "superrationality" makes voting rational in large elections. The columnist framed the issue around whether a single vote matters causally, and now these readers have gone back and forth with some sophisticated arguments involving Newcomb's problem and decision theory. 

  First, I should reconstruct their exchange step by step. The mathematician started with the superrationality argument: since there are many people who reason similarly to him, he should consider his vote as representing a whole class of voters, multiplying its impact. The philosophy student countered that this confuses correlation with causation - other voters' decisions are already fixed or independent, so his vote doesn't cause theirs. Then the mathematician brought up Newcomb's problem as an analogy, arguing that in that scenario, we act on correlations without causation (one-boxing), so why not here? The student replied that Newcomb has a predictor whose behavior depends on your type, whereas voting lacks such a mechanism, and also pointed out that the symmetry condition (people reasoning identically) isn't actually true in reality.

  Hmm, this is tricky because both are making valid points in their domains. The mathematician is drawing from game theory concepts like Schelling points or correlated equilibria, while the student is grounded in causal decision theory. I should carefully separate where each is correct and where they might be talking past each other.

  First move: The mathematician's initial superrationality claim. He's right that if there were perfect correlation among a group of voters, it would be rational for each to act as if determining the group's vote. But the student is correct that this requires an unrealistic symmetry - in real elections, voters aren't carbon copies; they have different information and reasons. The "class of similar deliberators" is fuzzy at best. So the mathematician overstates how cleanly this applies to voting.

  Second move: The student's correlation vs causation point is solid regarding direct causality - marking one ballot indeed doesn't physically affect others. But she might be underestimating how rational agents can and should account for correlated behavior in decision-making, even without direct causation. Her argument would make coordinated strategies irrational, which isn't right.

  Third move: The mathematician's Newcomb analogy is interesting but flawed. Newcomb works because of the predictor's perfect correlation - your choice reliably indicates what's in the box. In voting, my decision doesn't reliably cause or indicate others' decisions; the correlation is statistical and messy. Plus, in Newcomb, one-boxing is rational because you control the diagnosis of your type, whereas in voting, I don't control whether others are "like me."

  Fourth move: The student's rebuttal hits the mark - no predictor mechanism exists in elections, and symmetry is idealized. But she might miss that even imperfect correlations could make voting rational if the group is large enough, though this is weaker than the mathematician claims.

  Overall, the mathematician has a point about decision-making in symmetric scenarios, but misapplies it to voting where symmetry is absent. The student correctly defends causal decision theory as the right framework here, though she could acknowledge that in highly coordinated movements, superrationality-type reasoning might have some role.

  On whether this rescues voting: Superrationality doesn't solve the instrumental case - a vote still has near-zero causal efficacy. But it reveals an insight about collective agency: when we act as part of a group with shared reasoning, our individual actions gain meaning through correlation. However, this is more relevant to moral or expressive voting ("doing my part") than to instrumental impact.

  I should explain the evidential vs causal distinction clearly: Evidential decision theory says to choose based on what your action indicates about the world (hence one-boxing in Newcomb), while causal decision theory says to choose based on what your action causes. Voting is causally weak but evidentially strong - my voting indicates others like me might vote, but doesn't cause it. In elections without a coordination mechanism, causal reasoning should dominate for instrumental rationality.

  The verdict: The student wins the debate, but the mathematician identifies a real phenomenon in collective action problems - just not one that instrumentally justifies voting in large elections. The superrationality argument works better in small, coordinated groups than in mass elections.
answer: |-
  Below is a move-by-move adjudication of the exchange, assessing the validity of each argument, identifying overlooked nuances, and providing an overall verdict. The analysis explicitly addresses the causal vs. evidential distinction and the Newcomb analogy.  

  ---

  ### **Move 1: Mathematician’s Superrationality Argument**  
  *Claim*: "My vote is one node in a pattern of identical deliberators. I should reason as if deciding for the whole class, multiplying my vote’s impact."  
  **Assessment**:  
  - **Strength**: Partially valid in theory. The mathematician identifies a real insight: rational agents in symmetric decision problems (e.g., Schelling coordination games) *should* consider correlated actions. If all "similar deliberators" reason identically, their collective choice could be decisive, making individual voting instrumentally rational.  
  - **Weakness**: **Overstates symmetry and correlation**. The claim assumes a perfectly homogeneous group ("people who deliberate as I do") where decisions are perfectly correlated. In reality, voters have private information, cognitive biases, and heterogeneous reasoning paths—even if they reach the same conclusion. The electorate lacks the strict symmetry required.  
  - **What’s missing**: The argument conflates *logical possibility* with *empirical reality*. While superrationality (à la Douglas Hofstadter) works in idealized toy models (e.g., Prisoner’s Dilemma with identical agents), it rarely applies to complex, large-scale elections.  

  **Verdict**: **Partly right, but overstated**. The core insight (correlated agency) is valid, but its applicability to voting is weak due to real-world voter heterogeneity.  

  ---

  ### **Move 2: Philosophy Student’s Causation/Correlation Objection**  
  *Claim*: "This confuses correlation with causation. Other ballots are independent; no mechanism makes my vote cause theirs."  
  **Assessment**:  
  - **Strength**: **Correct on causation**. The student accurately notes that casting a ballot has no *causal influence* on others’ votes. Ballots are sealed and statistically independent events; resemblance in reasoning does not create a causal channel.  
  - **Weakness**: **Underestimates evidential value**. While the vote lacks *causal power*, it may have *evidential value*: your decision to vote (or not) correlates with similar agents’ actions, potentially altering the election’s outcome through collective alignment. Dismissing all non-causal reasoning risks ignoring decision-theoretic tools like *evidential decision theory* (EDT).  
  - **What’s missing**: The student treats votes as atomistic events but overlooks that rational agents can (and should) account for correlated behaviors in strategic settings. If agents share common knowledge of rationality, correlation becomes actionable.  

  **Verdict**: **Largely correct on causation, but incomplete**. The objection holds for *direct* causality but neglects the role of correlated agency in rational choice.  

  ---

  ### **Move 3: Mathematician’s Newcomb’s Problem Analogy**  
  *Claim*: "Dismissing superrationality would also condemn one-boxing in Newcomb’s problem, where correlations justify action without causation."  
  **Assessment**:  
  - **Strength**: **Valid analogy in principle**. Newcomb’s problem *does* show that rational agents should act on correlations without direct causation (e.g., one-boxing because your choice *predicts* the predictor’s action). Superrationality similarly relies on predictive correlations among agents.  
  - **Weakness**: **False equivalence to voting**. Newcomb’s problem features a *reliable predictor* whose actions depend *counterfactually* on your disposition. Voting lacks this:  
    - No "predictor" links your ballot to others’.  
    - Voter resemblance is statistical, not deterministic.  
    - In Newcomb, you control the *diagnosis* of your type; in voting, your reasoning doesn’t control others’.  
  - **What’s missing**: The mathematician ignores *asymmetry* in voting. Unlike Newcomb’s transparent symmetry, voters aren’t clones; their decisions are loosely correlated at best.  

  **Verdict**: **Correct about decision theory, flawed application**. Newcomb supports acting on correlations in *predictable, symmetric* environments—conditions absent in large elections.  

  ---

  ### **Move 4: Student’s Rebuttal to Newcomb Analogy**  
  *Claim*: "Newcomb has a predictor whose behavior depends on your type; voting lacks this mechanism. Symmetry is never satisfied."  
  **Assessment**:  
  - **Strength**: **Devastating critique**. The student correctly identifies the disanalogy:  
    - Voting has no "predictor" translating individual choices into group outcomes.  
    - Real voters aren’t epistemically identical ("different private information, different reasons").  
    - Resemblance ≠ influence: Correlation alone doesn’t create rational incentives without a causal or predictive mechanism.  
  - **Weakness**: **Downplays EDT’s applicability**. Even with imperfect symmetry, *if* agents share enough common ground (e.g., progressive voters using similar heuristics), EDT could assign non-zero evidential weight to their correlated actions.  
  - **What’s missing**: The student assumes causal decision theory (CDT) is the only valid framework. However, in cases of high correlation (e.g., cultural/political blocs), EDT *can* make voting rational if your action signals bloc cohesion.  

  **Verdict**: **Mostly correct**. The rebuttal exposes critical flaws in the analogy and the symmetry assumption, but understates scenarios where correlation *might* matter.  

  ---

  ### **Overall Verdict: Does Superrationality Rescue Voting?**  
  **No—not in large elections**. Superrationality rests on a **genuine but misapplied insight**:  
  - **Genuine Insight**: In symmetric decision problems (e.g., small homogeneous groups), agents *should* account for correlated actions. If all identical deliberators vote as a bloc, an individual vote *could* be decisive.  
  - **Misapplication**: Large electorates violate the required conditions:  
    - **No symmetry**: Voters aren’t clones; reasoning diverges due to private information and biases.  
    - **No causal/evidential mechanism**: Unlike Newcomb’s predictor, no entity translates your vote into correlated outcomes.  
    - **Instrumental futility remains**: The probability your vote sways a bloc (vs. being one of millions) remains negligible.  

  #### **Causal vs. Evidential Distinction Clarified**:  
  - **Causal Decision Theory (CDT)**: Values outcomes based on *causal influence*. Voting fails here—your ballot doesn’t *cause* others’ votes or change the result.  
  - **Evidential Decision Theory (EDT)**: Values outcomes based on *evidence provided by your action*. If voting signals bloc solidarity (e.g., "I vote because people like me vote"), it *could* be rational—but only if:  
    - (a) The correlation is strong (unlikely in diverse electorates);  
    - (b) Your vote legitimately predicts others’ (unreliable without a coordination mechanism).  
  In practice, EDT offers little rescue: low correlation and high noise swamp any evidential value.  

  #### **Final Ruling**:  
  - **The student wins the exchange**, correctly defending CDT as the proper framework for voting and exposing the analogical overreach.  
  - **The mathematician’s core insight**—about collective agency—is valid but better applied to *small-scale coordination* (e.g., activism, strikes) where symmetry and correlation are tractable.  
  - **Voting’s rationality** hinges on non-instrumental factors (duty, expression, social signaling), not superrationality.  

  **Recommendation for your column**: Acknowledge both perspectives but stress that superrationality, while fascinating, cannot overcome the causal math of large elections. The stronger case for voting lies in ethics or community participation—not instrumental impact.
