prompt: |-
  I've spent enough years reading Tetlock's forecasting work, Taleb's complaints about narrators, and the LessWrong archives on hindsight bias that I've developed a set of gut verdicts about when a retrospective explanation of a historical event is legitimate and when it's a narrative fallacy — an explanation manufactured after the fact that would have "explained" any outcome equally well. The problem is that I can't seem to make my own verdicts consistent, and I'd like your help extracting whatever principle, if any, actually captures them.

  My verdicts, concretely:

  1. After the 2008 crisis, an analyst says the crash was obvious in retrospect: household debt at record levels, lending standards collapsed, the ratings agencies captured. I distrust this. The base rate of people crying bubble in advance is high enough that the eventual crash vindicated mostly stopped clocks, and the tell is that this analysis is only ever produced after the fact.

  2. Darwin's explanation of the Galápagos finches as adaptive radiation from a common ancestor was constructed entirely after the observations. Yet I trust it completely, and would even if Darwin had never made a single successful forward prediction. So mere retroactivity can't be the mark of the fallacy.

  3. I distrust the claim that the assassination at Sarajevo "caused" the First World War — too many contingent paths to war, and the trigger narrative feels like privileging whatever happened to happen. But I'm fairly comfortable saying the Soviet collapse was caused by economic stagnation, imperial overstretch, and the nationalities problem — a structural explanation of a unique event that seems to me to be under the same suspicion.

  4. A forensic team reconstructs a plane crash from the wreckage and concludes that a fatigue crack in a specific bracket caused the failure. Fully retrospective, about a unique event, and I trust it without reservation.

  5. The hard one. I said the "obvious in retrospect" housing analysis was illegitimate. But I also believe that a handful of people, using essentially that same analysis, identified the bubble correctly in 2005–2007, and that their reasoning was legitimate — genuinely good, not lucky. If the analysis was legitimate in 2006, what exactly makes the identical analysis illegitimate when voiced in 2009?

  My tentative principle is this: a retrospective explanation earns trust only to the extent that, before the fact, it would have licensed a risky prediction — a forecast that could have failed — that then came true. This handles 1 (no risky prediction, just narration), 4 (the reconstruction implies dangerous failure modes in the identical brackets of the rest of the fleet, a checkable forward claim), and arguably 5. But it seems to condemn 2 more than I want it to, and it has trouble with 3: even a perfect analyst in 1913 could not have predicted the timing or trigger of the war, so what work is the alliance-structure explanation actually doing, and why do I trust the Soviet-collapse version of it?

  Please tell me: is there a coherent principle behind these verdicts, or a small set of candidate principles? State it precisely, motivate each clause by the case it handles, and say what it predicts about two cases I haven't considered — say, an economic historian in 2045 explaining a hypothetical war over Taiwan as the inevitable result of semiconductor supply concentration, and a doctor telling a patient that their rare diagnosis "was visible in the chart all along." Then be honest about which of my five verdicts your principle cannot save, and whether the choice is between a complex principle that preserves all of them and a simpler one that requires me to give one up — and if so, which one should go.
reasoning: |-
  Hmm, this user has a sophisticated understanding of forecasting, narrative fallacies, and hindsight bias. They're clearly well-read in Tetlock, Taleb, and LessWrong, but are struggling to reconcile their intuitive judgments about retrospective explanations across five concrete cases. The core tension is between explanations that feel like genuine insight versus those that smell like post-hoc storytelling.

  The user presents five verdicts where their intuition conflicts:
  1. Distrusts post-2008 crisis explanations (feels like narrative fallacy)
  2. Trusts Darwin's finch explanation (fully retrospective but valid)
  3. Distrusts WWI assassination narrative but accepts Soviet collapse explanation (both unique events)
  4. Trusts plane crash reconstruction (retrospective but mechanical)
  5. The hardest case: accepts pre-crisis bubble analysis but rejects identical post-crisis analysis

  Their proposed principle - that retrospective explanations must imply testable predictions - handles some cases but fails others. Darwin's theory didn't make immediate risky predictions, and WWI structural analysis couldn't predict timing.

  I think the user needs a framework with multiple dimensions:
  First, causal density matters. Plane crashes and mechanical failures are low-causal-density systems where root causes can be isolated. Housing markets and geopolitics are high-causal-density with too many interdependent variables.

  Second, counterfactual testability distinguishes real explanations. The finch adaptation theory implies testable counterfactuals (e.g., similar islands should show similar patterns). The "obvious" housing analysis doesn't - it wouldn't have changed if no crash occurred.

  Third, prediction horizon varies by domain. Medical diagnoses (like their doctor example) allow immediate verification through testing, making retrospective claims credible. Geopolitical explanations (like Taiwan semiconductors) lack this quick verification mechanism.

  For their unresolved cases:
  - The Soviet collapse explanation earns trust because it identifies necessary conditions (without which collapse wouldn't occur) rather than sufficient conditions (which the WWI trigger narrative falsely claims).
  - The identical 2009 housing analysis is untrustworthy because it's unfalsifiable - the analyst isn't exposing themselves to new risks by stating it.

  The doctor example reveals another dimension: accessibility of evidence. If the rare diagnosis was truly visible in charts, it implies the evidence was perceptible to qualified observers before the fact - which isn't true for most bubble claims.

  Ultimately, their verdict #2 (Darwin) needs protection through the counterfactual criterion, while their WWI/Soviet inconsistency suggests they're actually applying a necessary-vs-sufficient condition filter subconsciously. The principle might be: "Retrospective explanations earn trust when they (a) generate novel testable implications, (b) identify necessary rather than sufficient causes in complex systems, and (c) rely on evidence that was theoretically accessible beforehand."
answer: |-
  Your intuitions are remarkably consistent when viewed through the lens of **causal specificity and counterfactual testability**. The core principle is:

  **A retrospective explanation is legitimate if it (1) specifies a *necessary* (not merely sufficient) causal mechanism, (2) that generates *novel, falsifiable* counterfactual predictions beyond the original event, and (3) relies on evidence *independent of the outcome*.**

  ### Principle Breakdown & Case Resolution:
  1. **Necessary Mechanism**  
     The explanation must show the cause was *required* for the outcome, not just one possible path.  
     - *Handles #3*: WWI assassination is distrusted because war *could* have occurred via other triggers (Balkan crisis, colonial clash). Soviet collapse explanation is trusted because stagnation/overstretch/nationalities were *necessary conditions*—remove them, and collapse wouldn't have occurred.  
     - *Handles #2*: Darwin’s finches rely on natural selection—a *necessary* mechanism for adaptive radiation. Without selection pressure, divergence wouldn’t occur.  

  2. **Novel Falsifiable Predictions**  
     The explanation must imply *new, non-obvious* predictions that could be proven wrong.  
     - *Handles #1 and #5*: Post-2008 narrative fails because it predicts nothing new (*any* crisis could be "explained" by debt/ratings). Identical 2005 analysis was legitimate because it *risked falsification* (e.g., "If debt keeps rising, a crash will occur by 2008").  
     - *Handles #4*: Plane crash reconstruction implies *testable* risks (e.g., "Inspect all Model X brackets; they’ll show fatigue cracks").  

  3. **Outcome-Independent Evidence**  
     Evidence must not depend on knowing the outcome.  
     - *Handles #2*: Darwin’s evidence (beak variations, island geology) existed *before* his theory.  
     - *Condemns #1*: "Record debt" was only highlighted *after* the crash; pre-2007, analysts focused on "innovation" or "liquidity."  

  ### Predictions for New Cases:
  1. **Taiwan War in 2045 (Semiconductor Concentration)**  
     - *Verdict: Distrust* if presented as "inevitable." Semiconductor dependence is *sufficient* but not *necessary* for conflict (war could occur via ideology, miscalculation). Trust only if it generates *novel predictions* (e.g., "Any region with >80% tech supply concentration will face military coercion") and uses pre-war evidence (e.g., 2030s risk assessments).  

  2. **Doctor’s Rare Diagnosis**  
     - *Verdict: Trust* if the signs were *necessary* (e.g., "Symptom X + Y *always* indicates Disease Z"), imply *falsifiable* predictions (e.g., "Biopsy will show Marker Q"), and rely on *pre-outcome* data (chart notes pre-diagnosis). Distrust if vague ("It was there... somehow").  

  ### Inconsistent Verdicts Under This Principle:
  - **#2 (Darwin) is saved** by *necessary mechanism* (selection) and *outcome-independent evidence* (fossils, biogeography).  
  - **#3’s WWI/Soviet asymmetry** is resolved: Alliances were *sufficient* for WWI but not *necessary* (other triggers possible). Soviet flaws were *necessary* for collapse.  
  - **Your #5 dilemma dissolves**: The *same analysis* is legitimate in 2006 (it made a risky prediction) but fallacious in 2009 (no new predictions, relies on outcome).  

  ### The Tradeoff: Simplicity vs. Your Intuitions
  - **The "give up" verdict is part of #3**: Your trust in the Soviet explanation *is* salvageable (via necessity), but your distrust of WWI trigger narratives is *overfitted*. This principle forces you to reject *all* sufficient-but-not-necessary explanations (like Sarajevo), preserving consistency.  
  - **Complexity is unavoidable**: A simpler principle (e.g., "Requires pre-event prediction") *would* sacrifice #2 (Darwin) and #4 (plane crash). A purely statistical view (base rates) fails #5. Causal necessity and testability are the minimal complexity needed.  

  ### Final Verdict
  Your instincts align with a **mechanistic, counterfactual epistemology**. The principle holds except in one edge: *all* sufficient-but-unnecessary explanations (like Sarajevo) must be rejected, even if intuitively appealing. This maintains coherence while preserving your trust in Darwin, forensic science, and pre-crisis foresight—exposing hindsight bias where explanations are flexible enough to "fit" any outcome.
