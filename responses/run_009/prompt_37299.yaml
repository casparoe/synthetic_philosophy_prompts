answer: |-
  Your situation reveals profound tensions at the intersection of law, ethics, and metaphysics. The practice of honoring advance directives in dementia presupposes a specific—and selective—view of personal identity and moral obligation. Let's reconstruct the implicit theory, then explore alternatives and vulnerabilities.

  ### Core Presuppositions of Current Practice
  1. **Precedent Autonomy as Sovereign**:  
     The practice rests on **"precedent autonomy"**: the competent prior self's choices morally bind future selves, even when psychological discontinuity undermines identity. This isn't strictly about numerical identity (*is she the same person?*), but about **moral agency inheritance**. The law treats the directive as a *promissory note* signed by the only fully autonomous version of the person, which successors (even biologically continuous ones) must honor.

  2. **Selective Biological Continuity**:  
     The legal system *does* presuppose numerical identity for contracts/criminal liability (the 25-year-old *is* the 60-year-old). But for dementia directives, it subtly shifts to a **hierarchical view of selves**: the *competent* self's wishes are privileged over the *compromised* self's expressions. The biological organism remains the "same person" legally, but its current preferences are discounted as *inauthentic* due to pathology.

  3. **What Truly Matters**:  
     - **Identity**: Assumes numerical identity via biological continuity.  
     - **What Matters**: Autonomous choice + well-being. The directive protects both: it respects past autonomy *and* assumes refusing burdensome care promotes well-being in advanced dementia.  
     - **Threshold**: Authority persists as long as biological life continues, *unless* the patient clearly regains competence.

  ### Where the Practice is Underdetermined
  Several theories could justify it, revealing ambiguities:
  - **Lockean Psychological Continuity**: If identity requires connected memories/values, your mother *ceased* to be the same person when dementia eroded core psychology. Yet the directive is still enforced—suggesting continuity isn't required.
  - **Biological View**: The organism's persistence justifies enforcement, but doesn't explain why *current* preferences are ignored.
  - **Narrative Identity**: If persons are unified by life stories, the directive represents the "final chapter" she authored. But her current contentment could be part of a new, valid narrative.

  The practice fits best with a **hybrid view**: biological continuity grounds identity, but *moral authority* resides solely in the competent self. When pathology fractures psychology, the past self's autonomy trumps present expressions deemed non-autonomous.

  ---

  ### Alternative Frameworks & Their Implications
  If swapped, the directive regime would transform radically:

  | **Philosophical Foundation** | **Effect on Advance Directives** |
  |------------------------------|----------------------------------|
  | **Psychological Connectedness (Parfit)** | Directives become *provisional*. Authority weakens as connectedness fades. A "substantial connectedness threshold" would trigger reassessment. If your mother retains fragments of old values (e.g., dignity concerns), the directive holds. When only basic emotions remain (contentment), it lapses—her current wishes prevail. |
  | **Narrative Identity** | Focus shifts to *coherence with her life story*. If her directive ("don't prolong decline") clashes with her current narrative ("I enjoy simple pleasures"), the latter might override if consistent with her broader arc. Requires interpreters (you) to weigh which narrative is more authentic. |
  | **Successor Persons** | The demented patient is a *new person*. The directive binds only the predecessor. Current wishes always prevail unless she *reaffirmed* it post-onset. Feeding could never be withheld based on a "dead" person's document. |
  | **Biological View** | Status quo: the directive binds until biological death. Her smiles are irrelevant; she lacks standing to revoke. |

  ---

  ### Weakest Premises & Flipping Points
  Your practical dilemma hinges on vulnerabilities in the current model:

  1. **The "Authenticity Discount" Premise**  
     - **Weakness**: Assuming current wishes are "inauthentic" ignores that contentment *now* may reflect genuine well-being. Dementia doesn't erase personhood—it alters it.  
     - **What Could Flip Verdict**: Evidence that she *understands* life and death choices (e.g., consistently affirms "I want to live" when explained simply). If she exhibits *minimal autonomy*, the directive's force weakens.

  2. **The "Well-Being Proxy" Premise**  
     - **Weakness**: The practice assumes refusing artificial nutrition *always* promotes well-being in dementia. But if she experiences no distress from feeding (e.g., via gentle hand-feeding), enforcing starvation may inflict more harm than the directive prevented.  
     - **What Could Flip Verdict**: Medical assessment that artificial nutrition would relieve suffering (e.g., hunger) without burden. Her smiles suggest she experiences positive well-being—extending life may now align with her interests.

  3. **The "Continuity Threshold" Premise** (for Parfitian views)  
     - **Weakness**: No objective measure exists for "sufficient" psychological connectedness. Is echoing old values enough? How many broken links invalidate the directive?  
     - **What Could Flip Verdict**: If she forgets core values behind the directive (e.g., no longer recalls her dread of dependency) but retains a will to live, connectedness may be too thin to bind her.

  ---

  ### Practical Guidance
  **Legally**, the facility must follow the directive unless you (as proxy) or a court deem it invalid. But **ethically**, you might:
  - Seek a **palliative care consultation**: Assess if artificial nutrition would extend life *or prolong dying*. In late-stage dementia, spoon-feeding may suffice; tube feeding often causes distress.
  - Document **current expressions**: Record her statements ("I want to live") to challenge the directive's applicability if her condition plateaus.
  - Explore **compromises**: e.g., "No permanent feeding tubes, but short-term IV hydration during infections."

  The deepest tension: honoring her past autonomy risks overriding her present well-being. If her contentment reflects authentic engagement with life *as she now exists*, enforcing the directive may prioritize a ghost over a living person. Yet disregarding it betrays the self she entrusted to protect her values. There are no seamless solutions—only choices made with care for both the woman who wrote the directive and the one who now smiles at you.
