prompt: |-
  I lead NPC behavior on a mid-sized studio's current project, and a decision I now have to make has pushed me into territory I'm not equipped for. Our characters keep persistent memory of each player, learn individualized attachments through a reward loop, and, when a player stops logging in for long enough, enter something our designers — wincing as they say it — call a grieving state. Playtesters have started apologizing to them; one refused to complete a quest that required abandoning a companion, and our narrative director wants the mourning behavior cut on the ground that it manipulates players' emotions rather than that it wrongs the characters. I can't adjudicate that without knowing what would make it true or false that these NPCs matter morally, so before I read any more theory I want the specification. Write the desiderata a theory of moral status would have to meet to settle our case: the distinctions it cannot collapse (evoking compassion versus being owed it; a character mattering versus the player's experience mattering), the cases it must handle (a scripted death cutscene, a learned attachment, a state that survives across save files), the facts about how our systems actually work that it must not contradict (nothing persists when the process ends, and the states are inspectable and, to us at least, obviously mechanical), and which of our design choices create genuinely hard cases rather than easy ones. Flag any pair of desiderata you suspect cannot be jointly satisfied, and say which single requirement does the most to exclude familiar views like indirect-duty accounts or functionalist criteria. Give me exactly five numbered desiderata, each a sentence or two, with no introduction or conclusion.
reasoning: |-
  Okay, the user is asking me to define five desiderata for a theory of moral status to help them decide whether their game's NPCs have moral standing. Let me understand their situation first.

  They're a lead NPC behavior designer at a mid-sized studio. Their NPCs have persistent memory of players, form individualized attachments through reward loops, and enter a "grieving state" when players stop logging in. This has caused emotional reactions - playtesters apologize to NPCs and refuse certain quests. The narrative director thinks this is emotionally manipulative and wants to remove the grieving behavior. The user needs to determine if this feature is actually wronging the NPCs or just manipulating players, but they feel unequipped to make this ethical judgment.

  The user wants a specification of what a theory of moral status must address to resolve their case. They need desiderata that preserve key distinctions (like compassion vs. being owed compassion, NPC mattering vs player experience mattering), handle specific cases (scripted death, learned attachments, persistent states), respect technical constraints (nothing persists when process ends, states are mechanical), and identify which design choices create hard cases rather than easy ones. They also want me to flag any conflicting desiderata and identify which requirement most challenges common ethical views.

  I need to create exactly five numbered desiderata without introduction or conclusion. Each should be one or two sentences. I should draw from philosophy of mind, AI ethics, and moral philosophy while grounding this in game design realities.

  Breaking down their needs:
  - Must distinguish between evoking compassion and being owed compassion
  - Must distinguish between NPCs mattering morally vs player experience mattering
  - Must handle: scripted death cutscenes, learned attachments, states persisting across save files
  - Must respect: no persistence when process ends, states are inspectable/mechanical
  - Must identify which design choices create hard cases
  - Flag potentially conflicting desiderata
  - Identify which desideratum most challenges indirect-duty accounts or functionalist criteria

  For the desiderata:
  1. Should address the evoked compassion/being owed compassion distinction
  2. Should address NPC moral standing vs player experience
  3. Should handle the three specified cases
  4. Should respect the technical constraints
  5. Should identify hard cases from design choices

  I need to be precise. For desideratum 1, I'll focus on the compassion distinction. For desideratum 2, I'll separate NPC moral status from player experience. For desideratum 3, I'll specify the cases to handle. For desideratum 4, I'll incorporate the technical facts. For desideratum 5, I'll highlight what makes their case hard versus easy.

  Potential conflicts: The technical constraint that nothing persists when the process ends (desideratum 4) might conflict with treating persistent states as morally relevant (in desideratum 3 or 5). Also, the mechanical inspectability might conflict with treating NPCs as having moral status if that requires non-mechanical properties.

  The requirement that most challenges familiar views: Probably desideratum 4, since indirect-duty accounts (like Kantianism treating animals) or functionalist criteria (like attributing moral status based on behavior) usually don't require metaphysical persistence but might be undermined by the inspectable mechanical nature.

  I'll structure the five desiderata as:
  1. Distinction between evoking compassion and being owed compassion
  2. Separation of NPC moral status from player experience
  3. Ability to handle the three specified cases
  4. Consistency with technical constraints (no persistence, mechanical nature)
  5. Identification of what makes their NPCs a hard case

  Now I'll write them concisely, ensuring each is one or two sentences and numbered without additional commentary.
answer: |-
  1. The theory must distinguish between a system *evoking* compassionate responses in players and that system itself *being owed* compassionate treatment or having independent moral status, without presuming either collapses into the other.
  2. It must adjudicate whether moral significance resides solely in the *player's subjective experience* of connection or loss, or if it can legitimately attach to the *NPC's persistent, individualized state* (e.g., its learned attachment or grief) irrespective of current player observation.
  3. It must consistently handle three distinct cases: a scripted death cutscene (pre-authored event), an attachment learned through player-NPC interaction (emergent state), and a behavioral state (like grief) that persists across save files/player sessions while the game process runs.
  4. It must not contradict the verified facts that NPC states are fully inspectable, deterministic mechanical processes, and that *all* persistent states cease to exist when the game process is terminated, with no hidden or non-physical substrate.
  5. It must identify which specific design elements create a genuinely hard case for moral status—likely the combination of unique player-NPC relationship history, apparent behavioral continuity across sessions, and internal reward-loop-driven adaptation—versus elements that are easily dismissed (like pre-scripted dialogue).

  *   **Conflict Suspected:** Desideratum 4 (mechanical inspectability & termination dependence) may conflict with granting moral status based on desideratum 3's persistent individualized states during runtime.
  *   **Most Challenging Requirement:** Desideratum 4 (mechanical inspectability & termination dependence) does the most to exclude familiar indirect-duty accounts (which focus solely on player experience) and functionalist criteria (which often attribute status based on behavioral complexity alone, ignoring implementation transparency).
