prompt: |-
  I run a small team at a county council that administers a discretionary grant pot for disabled residents — a few thousand pounds per grant, maybe a dozen requests a month, most turned around in under a week. The requests are all over the place: a stairlift, a powered wheelchair, funding a personal assistant so someone can leave the house, broadband so they can video-call family, and the occasional request for straight cash. Everyone on the team has their own gut rule and they contradict each other. One social worker basically asks "will it make them happy", another will only fund "practical equipment", a third is always trying to stretch the pot over as many recipients as possible. I gather there's a whole debate in political philosophy about equality of what — welfare versus resources versus capabilities — and it feels like our three gut rules are just the three theories in casework clothes. Can you turn that debate into a decision procedure my team can actually follow: an ordered set of questions, what counts as a sufficient answer to each, where it stops and says no, and where it punts to a panel because the question is one of values rather than facts. It has to fit on one side of A4 and be usable by social workers with no philosophy background. Then run it on three real-ish cases: (a) a powered wheelchair for a man with severe MS who says he mainly wants it to get to his garden, (b) a games console plus a year of broadband for an isolated young man whose care review says his main problem is loneliness, and (c) cash instead of any equipment, for a woman who says she knows better than we do what she needs. The console case is the real test — half my team thinks it's obviously no and I'm not so sure. And be upfront about what the procedure can't do and where it will misfire, including which of the three cases it can't really settle.
reasoning: |-
  We are designing a decision procedure based on three philosophical approaches:
    1. Welfare/Happiness (will it make them happy?)
    2. Resources/Practical Equipment (does it provide a practical resource?)
    3. Capabilities/Equal Distribution (does it stretch the pot to help as many as possible?)

   We'll structure the procedure as a flowchart of questions. The goal is to have a clear, step-by-step process that leads to a decision (approve, reject, or refer to a panel).

   The decision procedure:

   Step 1: Check Eligibility
     - Is the applicant a disabled resident of our county? (factual)
     - Does the request fall within the broad remit of the grant? (i.e., for the purpose of mitigating disability-related disadvantage? If no, reject. If yes, proceed.)

   Step 2: Assess Urgency and Necessity (to avoid immediate harm)
     - Is there an immediate risk to health or safety without this grant? (e.g., without a stairlift, the person might fall; without a personal assistant, they cannot leave the house for essential needs)
       - If YES: Approve (subject to budget availability) and skip to Step 5.
       - If NO: Proceed to Step 3.

   Step 3: Evaluate Against Core Capabilities (based on the Capability Approach)
     - Does the requested item/service enable the individual to achieve a basic capability that they otherwise couldn't? (e.g., moving around independently, communicating with others, participating in community life, maintaining mental health)
       - If YES: Proceed to Step 4.
       - If NO: Reject (unless there are exceptional circumstances, then refer to panel).

   Step 4: Assess Impact and Alternatives
     - Is this the most cost-effective way to achieve the capability? (Compare with alternatives. If there's a cheaper way that achieves the same core capability, then consider that. If not, then...)
     - Will it have a significant positive impact on the individual's well-being? (This is where welfare/happiness comes in. If the impact is high, then it strengthens the case. But note: we are not requiring it to be the sole factor.)

   Step 5: Budget and Fairness Check (based on the Equal Distribution concern)
     - Given the remaining budget and the number of pending requests, can we fund this without unfairly depriving others of more urgent needs?
       - If the cost is high and the budget is tight, then we might have to refer to a panel for prioritization (or if the grant would use up a disproportionate amount, we might consider partial funding or alternatives).
       - Otherwise, approve.

   Step 6: Special Case - Cash Request
     - If the request is for cash (without a specific item), then we require:
          a) Evidence that the applicant has the capacity to make sound decisions about their needs (or has support to do so).
          b) A clear explanation of how the cash will be used to address a disability-related disadvantage (linking to a core capability).
          c) Consideration of whether cash is the most appropriate form of support (e.g., are there restrictions that would make an equipment grant more effective?).
     - If these are met, then treat as a regular request and go through Steps 1-5. Otherwise, reject or refer to panel.

   Now, we run the three cases:

   Case (a): Powered wheelchair for a man with severe MS to get to his garden.

    Step 1: Eligible? Yes (disabled resident, grant for mobility).
    Step 2: Urgency? Without it, he is confined indoors. This might not be an immediate risk to physical health (like a fall), but it does severely limit his mobility and quality of life. We'll say not immediate risk (so not Step 2 approve, but proceed).
    Step 3: Core Capability? Yes. Mobility is a core capability. The wheelchair enables him to move independently to his garden (and presumably elsewhere). Proceed.
    Step 4: Alternatives? Manual wheelchair? He has severe MS, so likely not. Cost-effectiveness? A powered wheelchair is expensive, but if it's the only way, then it's necessary. Impact: High (improves well-being by allowing access to nature and outdoor space).
    Step 5: Budget check? We don't have exact numbers, but assuming the budget can cover it (and it's one of a dozen per month), then approve.

   Case (b): Games console plus a year of broadband for an isolated young man (care review says main problem is loneliness).

    Step 1: Eligible? Yes (disabled resident, and loneliness is a disability-related issue if it's due to disability? We assume yes because the care review links it to his condition).
    Step 2: Urgency? Not immediate risk to health (unless severe mental health crisis, but we assume not stated). Proceed.
    Step 3: Core Capability? Social connection and mental well-being are core capabilities. The console and broadband would enable him to connect with others (via online gaming and communication). So yes, it enables a core capability (social participation and avoiding isolation). Proceed.
    Step 4: Alternatives? Are there cheaper or more effective ways? E.g., local community groups, in-person support? If he is housebound due to disability, then online might be the only viable way. If there are alternatives, we might consider them. But if this is the best way for him, then it's cost-effective? Note: broadband alone might be more generally useful (for other communication too) and the console is specific. We might suggest funding broadband and a cheaper device (like a basic computer) for video calls? However, the request is for a console and broadband. We need to decide if the console is necessary for his social connection? If he specifically connects with friends via gaming, then it might be. Otherwise, we might fund broadband and a basic computer for video calls and online communities. But if the care review supports that gaming is his primary social outlet, then it's justifiable.
        - Impact: High, if it reduces loneliness.
    Step 5: Budget? The cost of a console and broadband for a year is moderate (say £500-£600). If the budget can handle it, then approve. But note: if we have a long queue of more urgent needs (like wheelchairs), we might have to defer. However, without that context, we approve.

    However, this case might be borderline because of the specific item (games console). We might want to refer to a panel for a values decision: is funding a leisure item like a console an appropriate use of public funds for disability grants? The procedure can't avoid this value judgment entirely. So we might note:

        If there is a question about the appropriateness of the item (like a console) for achieving a core capability, refer to panel.

    Therefore, we might refer to panel for case (b) to decide if the console is an acceptable means for social connection.

   Case (c): Cash instead of equipment for a woman who says she knows best.

    Step 1: Eligible? Yes (disabled resident).
    Step 2: Urgency? Not stated, so no. Proceed.
    Step 3: Core Capability? We don't know what she will use the cash for. She must explain how it will address a disability-related disadvantage (core capability). Without that, we cannot assess. So we require her to specify the need (without which, reject). But the procedure for cash (Step 6) requires:
          a) Capacity: We assume she has capacity (or support) to decide.
          b) Explanation: She must provide a clear link to a disability-related need and a core capability. If she refuses to provide any explanation, then we cannot proceed and must reject.
          c) Appropriateness: Is cash the best way? If she can get a better deal by buying equipment herself, then cash might be appropriate. But if the item is specialized and requires professional installation (like a stairlift), then we might not give cash.

    However, if she provides an explanation (e.g., "I need to pay for a personal assistant for two hours a week to go shopping") then we can treat it as a regular request and go through Steps 1-5 for that need.

    But note: if she just wants cash without any accountability, that might not be acceptable. We require at least a general purpose.

    So in the case described, we don't have an explanation. We would ask for one. If she refuses, we reject. If she provides one, then we evaluate that purpose as if she had requested the specific item/service.

    Therefore, without more information, we cannot approve. We would ask for clarification and then reassess.

   What the procedure can't do:

    1. It can't resolve deep value conflicts (like whether happiness is more important than resource equality). That's why we have the panel referral for borderline cases (especially when an item is non-traditional, like the console).

    2. It relies on accurate information. If the applicant or social worker misrepresents the situation, the procedure might misfire.

    3. It doesn't account for long-term sustainability (e.g., funding ongoing costs like broadband beyond a year).

    4. It might be too rigid and miss unique circumstances. The panel is there for those.

    5. The budget check (Step 5) is highly dependent on current budget status and the number of pending requests. We might need a monthly review of available funds.

    6. The procedure might not be sensitive to cumulative disadvantage (e.g., someone with multiple barriers) but we hope Step 3 (capabilities) captures that.

    7. The procedure doesn't explicitly address fraud prevention (we assume eligibility checks are robust).

   For the three cases:

     Case (a): Approve (if budget allows) - clear on capabilities.
     Case (b): Borderline - we refer to panel because the means (games console) might be controversial even though the end (social connection) is valid.
     Case (c): Requires more information. Without it, reject. With a valid explanation, then evaluate that need.

   We can summarize the procedure on one A4 page as a flowchart:

    [Start]
    |
    v
    Step 1: Eligibility
      |--> Not eligible? REJECT
      |
      v
    Step 2: Urgency (immediate risk to health/safety without it?)
      |--> YES: APPROVE (subject to budget) and go to Step 5 for budget check.
      |
      |--> NO: 
              v
              Step 3: Core Capability? (Does it enable a basic capability they lack due to disability?)
                |--> NO: REJECT (unless exceptional, then refer to panel)
                |
                v
              Step 4: Impact and Alternatives
                - Is it the most cost-effective way? (If not, consider alternatives or partial funding)
                - Will it have high positive impact? (If low impact, then reconsider)
                |
                v
              Step 5: Budget and Fairness
                - Check budget and pending requests: if funding this would leave insufficient for more urgent needs, refer to panel. Otherwise, APPROVE.

    For Cash Requests (Step 6): 
        - Must provide: 
            a) Evidence of capacity (or support) to decide.
            b) Explanation of how cash will address a disability-related disadvantage (core capability).
            c) Why cash is the best form.
        - Then go through Steps 1-5 for the stated need.

    For any step where there is uncertainty about values (e.g., is a games console an appropriate means for social connection?) or if there are exceptional circumstances, refer to a panel.

    The panel should be a small group (including the team leader and perhaps a rotating member) that meets weekly to discuss referred cases.

   Let's note: Case (b) is the one that the procedure can't settle without a panel because it involves a value judgment about what counts as a legitimate means for achieving a capability. The panel can then decide based on the team's shared values and the specific context.
answer: |-
  ### Decision Procedure for Disabled Residents' Grant Applications  
  **Fit on one A4 sheet. Use this ordered checklist for every request.**  

  #### Step 1: **Urgency Check**  
  - **Question:** *Could delaying this request cause immediate harm (e.g., health/safety risk, mental health crisis)?*  
  - **Sufficient Answer:** Medical/care evidence confirming urgency (e.g., "Without stairlift, client will be bedbound").  
  - **Outcome:**  
    - **YES → Fast-track to Step 5 (Budget Check).**  
    - **NO → Proceed to Step 2.**  

  #### Step 2: **Capability Enhancement**  
  - **Question:** *Does this grant enable a core capability the person lacks due to disability?*  
    *Core capabilities = Basic freedoms (e.g., moving freely, social participation, managing daily life).*  
  - **Sufficient Answer:** Clear link between the request and a specific capability gap (e.g., "Wheelchair enables mobility"). Avoid vague "happiness" claims.  
  - **Outcome:**  
    - **YES → Proceed to Step 3.**  
    - **NO → REJECT.** (e.g., Luxury items without capability link).  

  #### Step 3: **Cost-Effectiveness**  
  - **Question:** *Is this the simplest, least expensive way to achieve the capability?*  
  - **Sufficient Answer:**  
    - Compare alternatives (e.g., second-hand equipment vs. new; broadband vs. community transport).  
    - If no alternatives exist, justify why.  
  - **Outcome:**  
    - **YES → Proceed to Step 4.**  
    - **NO → Adjust request or REJECT.**  
    - **UNCLEAR → Refer to panel.**  

  #### Step 4: **Impact Assessment**  
  - **Question:** *Will this significantly improve the person’s ability to function independently?*  
  - **Sufficient Answer:** Evidence of tangible impact (e.g., care plan notes, professional assessment). Subjective hopes (e.g., "It might cheer them up") are insufficient.  
  - **Outcome:**  
    - **HIGH IMPACT → Proceed to Step 5.**  
    - **LOW/MODEST IMPACT → Refer to panel** (values debate: welfare vs. fairness).  

  #### Step 5: **Budget Fairness**  
  - **Question:** *Can we fund this without depriving others of urgent needs?*  
  - **Sufficient Answer:**  
    - Check monthly budget status.  
    - If cost >15% of monthly pot, or queue is long, flag for panel.  
  - **Outcome:**  
    - **YES → APPROVE.**  
    - **NO → Defer, part-fund, or refer to panel.**  

  #### Special Case: **Cash Requests**  
  - **Additional Hurdles:**  
    1. *Proof of purpose:* Require a credible plan (e.g., "Cash for laundry help as I can’t leave home").  
    2. *Vulnerability check:* Confirm no safeguarding risks (e.g., exploitation).  
    3. *Alternatives:* Why not equipment/voucher?  
  - **Outcome:** Fail any → REJECT or adjust. Pass all → Treat as standard request (Steps 1–5).  

  ---  
  ### Case Applications  
  **Case (a): Powered Wheelchair for Man with Severe MS**  
  - **Step 1:** No immediate harm (garden access isn’t urgent). → **Step 2.**  
  - **Step 2:** Enables core capability (mobility). → **Step 3.**  
  - **Step 3:** No cheaper alternative (manual chair unusable). → **Step 4.**  
  - **Step 4:** High impact (independence, outdoor access). → **Step 5.**  
  - **Step 5:** If budget allows → **APPROVE.**  

  **Case (b): Games Console + Broadband for Lonely Young Man**  
  - **Step 1:** No physical harm → **Step 2.**  
  - **Step 2:** Social connection is a core capability → **Step 3.**  
  - **Step 3:** *Problem:* Is a console simplest? Alternatives exist (e.g., community groups, basic phone). → **REFER TO PANEL** (values debate: Is gaming a valid capability support?).  
  - **Panel Input:** Focus on evidence. If care review confirms gaming is his *only* social outlet → **APPROVE.** If alternatives exist → **REJECT or PART-FUND (broadband only).**  

  **Case (c): Cash for Woman Who "Knows Best"**  
  - **Special Case Hurdles:**  
    - No stated purpose → **REJECT** (fails proof of purpose).  
    - *If she specifies:* E.g., "Cash for taxis to medical appointments."  
    - **Step 2:** Transport is a core capability → **Step 3.**  
    - **Step 3:** Cheaper than council-funded transport? → **Panel referral** (assess alternatives).  

  ---  
  ### Where the Procedure Fails (Be Upfront!)  
  1. **Values Conflicts:**  
     - The games console case **(b)** can’t be settled mechanically. Step 3 flags it for panel debate: *Should public funds cover leisure for capability-building?* Philosophy splits here.  
     - **Fix:** Panel uses local priorities (e.g., "Isolation reduction is a council goal?").  

  2. **Subjectivity in "Capability":**  
     - A request like "therapy dog for depression" may split opinions. Step 2 requires evidence (e.g., doctor’s note). Weak evidence → **panel referral.**  

  3. **Hidden Inequities:**  
     - The procedure can’t fix societal gaps (e.g., if broadband is unaffordable long-term). Step 5 may reject high-cost recurring needs.  

  4. **"Happiness" Requests:**  
     - Pure welfare asks (e.g., "holiday for mental health") fail Step 2 unless tied to a core capability (e.g., "respite to prevent carer breakdown").  

  5. **Budget Realities:**  
     - A high-impact request (e.g., £5k wheelchair) may be rejected at Step 5 if the pot is low. Procedure can’t create money.  

  **Final Tip:** Train staff to document *how* each step was answered (e.g., "Step 2: Mobility capability – OT report confirms"). This ensures consistency and aids panel reviews.
