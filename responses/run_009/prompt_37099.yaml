  3. **Mere inconveniences**: Computational ease? Please. Modern software handles KS fine.  

  User will likely concede that utopia-point sensitivity *can* be exploited theoretically but argue real negotiations don't add absurd options. They'll wave away the "efficiency vs. fairness" trade-off by insisting monotonicity *is* fairness.  

