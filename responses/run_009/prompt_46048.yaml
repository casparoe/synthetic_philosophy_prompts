answer: |-
  ### Exam Question  
  The county must annually test its flood-siren network. It faces three scenarios:  
  - **Village**: 4,000 residents. The county may either conscript one "warden" for one working month (≈170 hours) or have each resident spend 10 seconds confirming a test (total ≈11 person-hours).  
  - **Metropolis**: 3 million residents. Same options: warden works 170 hours, or each spends 10 seconds (total ≈8,333 person-hours).  
  - **Hamlet**: 500 residents. Warden works 170 hours, or each spends 5 minutes annually (total ≈42 person-hours).  

  Assume all burdens are "generic" (tedious but safe, no health risks). Using Scanlon’s contractualism:  
  1. State the core principle governing how complaints are compared in assessing rejectability.  
  2. For each scenario, determine whether the county must use the warden or may distribute the burden. Contrast this with what utilitarianism (minimizing total burden) would require.  
  3. Explain why contractualism treats the distributed option in the Metropolis (where total burden vastly exceeds the warden’s) the same as in the Village. Is this invariance a defensible feature or a flaw?  
  4. Evaluate two repairs to contractualism that might address concerns about this invariance:  
     - (a) Allowing complaints’ weights to sum across persons.  
     - (b) Making rejectability sensitive to how many could raise a complaint.  
  Discuss what each repair "costs" (e.g., does it collapse contractualism into utilitarianism? Does it relocate aggregation elsewhere?).  

  ---

  ### Model Answer (≈750 words)  

  Scanlon’s contractualism holds that an act is wrong if disallowed by principles no one could reasonably reject. Crucially, complaints against principles are assessed individually: we compare burdens one person at a time, without summing harms across different people. While harms to a single person may be aggregated (e.g., enduring ten minor headaches adds up to a serious complaint), we cannot combine separate individuals’ complaints arithmetically. This individualist restriction ensures that numbers alone cannot override a significant individual burden.  

  In the *Village*, utilitarianism minimizes total burden: distributing saves 159 hours (170 vs. 11), so it requires distribution. Contractualism permits distribution. The warden’s complaint (170 hours) is serious, but under distribution, each resident’s 10-second burden is trivial—too slight to ground a reasonable complaint. Since no individual faces a burden remotely close to the warden’s, no one could reasonably reject a principle permitting distribution.  

  In the *Metropolis*, utilitarianism now forbids distribution: total burden is ≈8,333 hours versus the warden’s 170, so it requires using the warden. Contractualism, however, still permits distribution. Each resident’s 10-second burden remains trivial and identical to the Village case. The individualist restriction forbids summing these tiny complaints; no single person bears a burden comparable to the warden’s, so distribution remains reasonable. The explosion in total burden is irrelevant to Scanlon, as arithmetic sums do not create new complaints.  

  In the *Hamlet*, utilitarianism slightly favors distribution (170 vs. 42 hours). Contractualism likely permits distribution but warrants closer scrutiny. Each resident’s 5-minute burden, while minor, is perceptible (unlike 10 seconds). Still, it remains vastly smaller than the warden’s month-long chore. Absent special vulnerability, no individual could reasonably reject distribution by appealing to five minutes—especially when the alternative imposes 170 hours on one person. Contractualism thus diverges from utilitarianism only in the Metropolis, where utilitarianism forbids distribution but contractualism allows it.  

  The invariance in contractualism’s verdict—permitting distribution regardless of total burden—stems from its core commitment: complaints reside in individual experiences, not arithmetic aggregates. Ten seconds is identically trivial whether one person or millions bear it. This is a *feature* if we believe morality must respect individual standing; aggregating minuscule burdens would "exploit" individuals by dissolving their distinct complaints into a crowd. But it is a *bug* if we think a sufficiently large crowd’s cumulative burden matters morally. The Metropolis appears to exploit the *warden*: why sacrifice one person to spare millions an imperceptible cost? Yet contractualism sees no exploitation, as no single distributed burden is rejectable.  

  Two repairs might address this. First, summing complaints’ weights across persons (Repair A) would mirror utilitarianism. If millions of 10-second complaints sum to outweigh the warden’s burden, contractualism collapses into utilitarianism—just replacing "utils" with "complaints." This abandons Scanlon’s core thesis that principles must be justifiable *to each person*. Second, making rejectability sensitive to complaint multiplicity (Repair B) might hold that a burden rejectable by *many* is harder to justify. For example, in the Metropolis, distributing might be wrong because millions *could* (trivially) complain. But this relocates aggregation to the theory of reasons: what makes a complaint "stronger" when more hold it? If the answer is cumulative impact, aggregation resurfaces implicitly. If not, we need a non-aggregative account of why numbers matter—which Scanlon’s framework lacks. Repair B thus risks incoherence or covert utilitarianism.  

  Ultimately, Scanlon’s invariance is defensible if we view morality as agent-centered, focusing on what we owe *to each person*. But it struggles with cases where enormous cumulative burdens seem relevant. Both repairs sacrifice contractualism’s distinctiveness: Repair A collapses it into aggregated complaints; Repair B smuggles aggregation into reason-assessment without resolving its legitimacy. The warden case, unlike the transmitter room (where one dies unless many suffer minor harms), isolates how contractualism prioritizes individual integrity over collective cost—a stance both principled and paradoxical.  

  ---

  ### Marking Scheme (25 marks)  

  Award up to five marks for accurately stating Scanlon’s individualist restriction: that complaints are compared one person at a time without summing across persons, though harms to a single person may be summed within her complaint; deduct marks for conflating this with aggregating across persons or omitting intra-personal aggregation. Award up to nine marks for analyzing the three scenarios: three marks per scenario (one for contractualist verdict, one for utilitarian, one for clear divergence identification), penalizing incorrect verdicts, misattributing theories, or overlooking the divergence in the Metropolis. Award up to six marks for explaining invariance: two marks for noting that trivial individual burdens do not amplify with numbers, two for defending it as a feature (e.g., arithmetic doesn’t create complaints), two for critiquing it as a bug (e.g., exploiting the warden via dispersed burdens); deduct for vague appeals to "fairness" without linking to contractualism’s structure. Award up to five marks for evaluating repairs: two marks for each repair (one for describing it, one for its "cost"), and one mark for noting both repairs threaten contractualism’s core; penalize superficial treatment (e.g., "Repair A is utilitarian") without explaining how it alters the framework, or failing to address whether Repair B relocates aggregation. Deduct one mark overall if the answer confuses the cases (e.g., misstating hamlet burdens) or cites transmitter room without adding value. An A answer (21–25) executes all tasks precisely, with nuanced evaluation of repairs; a B answer (16–20) covers tasks but with minor errors or shallow critique.
