prompt: |-
  I am a retired experimental physicist who has lately taken up reading decision theory for pleasure. In laboratory life I kept running into a configuration I never had a word for. A team would be years into building a bespoke instrument — say, a cryostat with hand-machined seals and decades of accumulated workshop lore behind it — and a plain accounting would show that finishing it would cost more than scrapping it and buying an off-the-shelf system of equal performance. The textbook verdict is that the years and money already sunk are irrelevant: decide by future costs and benefits alone. Yet whenever a team did cut its losses and switch, the replacement underdelivered, and the post-mortem diagnosis was always the same: the accumulated experience with the bespoke machine — knowing which seals leak, which settings drift, which repair takes ten minutes — had been most of what the machine really was, and none of it transferred. Continuing looked, from the outside, like irrationally honoring sunk costs, but it was really the purchase, at low incremental cost, of an asset that had no market: know-how that existed only as long as the project did. Does this configuration have an established name in decision theory or economics? I am aware it must sit somewhere near the sunk cost fallacy, near what psychologists call escalation of commitment, and near ideas of switching costs and lock-in, but in each of those the continuing looks like a mistake or an institutional pathology, whereas here it seems to have a rational core. Please structure your answer in four sections: (1) "The nearest named concepts," roughly a paragraph; (2) "What is distinctive about the pattern as I described it," roughly a paragraph; (3) "A hard boundary case," a short paragraph in which it is genuinely unclear whether continuing is rational or merely committed; and (4) "Verdict," a few sentences stating which existing concept fits best, or coining a term with a definition if none does. I am not after a bare label; I want to know exactly what the phenomenon is and is not, and where its edges run.
reasoning: |-
  Okay, the user is a retired experimental physicist who's been diving into decision theory. They've encountered a recurring situation in their lab work where teams faced a decision: continue investing in a custom-built instrument or switch to an off-the-shelf alternative. Standard decision theory would say to ignore sunk costs and focus on future costs and benefits. But in practice, scrapping the custom instrument often led to failures because the team's tacit knowledge—like knowing which seals leak or quick fixes—was lost and didn't transfer to the new system. The user wants to know if there's a term for this in decision theory or economics.

  First, I need to recall relevant concepts. Sunk cost fallacy is the obvious one, where people continue investing due to past costs. Escalation of commitment is similar, often driven by psychological factors. Switching costs and lock-in also come to mind, like when transitioning is expensive due to new training or compatibility issues. Asset specificity from transaction cost economics might apply too, since the custom machine has unique parts and knowledge tied to it.

  But the user points out that in their case, continuing wasn't irrational because the tacit knowledge was a critical, non-transferable asset. That's the key difference. The existing concepts usually frame continuing as a mistake, but here it's rational due to the irreplaceable know-how. So I need to find a concept that accounts for this tacit knowledge as an asset.

  Looking deeper, the user's real need might be to validate their experience with a theoretical framework. They’ve observed that textbook advice didn’t apply in their context, and they want a term that captures the rationality behind their decisions. They might also be seeking to communicate this idea to others in the field or understand where the boundary lies between rational continuation and fallacy.

  The distinctive aspect is that the tacit knowledge is embedded in the team's experience with the specific machine. It’s not just about switching costs; it’s about the irreplaceable loss of know-how that’s critical for performance. This isn’t covered by standard sunk cost discussions. Concepts like organizational memory or tacit knowledge from knowledge management come to mind, but they’re not decision theory terms.

  For the boundary case, I need a scenario where it's unclear if the knowledge is still valuable. Maybe if the team composition changes, so the experienced members are gone, but the machine remains. Then, the knowledge asset is gone, so continuing might just be sunk cost fallacy. That tests whether the know-how is still an asset.

  For the verdict, "tacit knowledge asset specificity" seems fitting. It combines asset specificity from economics with tacit knowledge, highlighting that the knowledge is both specialized and non-transferable. Coining this term makes sense because existing terms don’t fully capture the rational aspect tied to irreplaceable know-how. The user probably wants a precise label that distinguishes this from irrational escalation, so a new term with a clear definition would be useful.
answer: |-
  Here is a structured analysis addressing your precise query, drawing upon decision theory, economics, and organizational knowledge:

  **(1) The nearest named concepts:**
  The closest established concepts are **Sunk Cost Fallacy**, **Escalation of Commitment**, **Switching Costs**, **Lock-in**, and **Asset Specificity** (from Transaction Cost Economics). Sunk Cost Fallacy warns against considering irrecoverable past investments in current decisions. Escalation of Commitment describes the psychological tendency to deepen investment in failing courses of action to justify prior choices. Switching Costs encompass the expenses (time, money, disruption) of changing to a new system. Lock-in occurs when high switching costs create dependency on an incumbent technology or supplier. Asset Specificity refers to investments (physical or human capital) tailored to a particular relationship or task, losing value if redeployed.

  **(2) What is distinctive about the pattern:**
  Your scenario distinctively centers on **tacit, non-transferable organizational knowledge as the primary embodied asset**, not the physical machine itself. Standard sunk cost reasoning assumes the *physical asset* and its *potential future output* are the relevant comparators against alternatives. However, your pattern reveals that the machine's *actual, reliable performance* is inseparable from the team's deeply embedded, experiential knowledge ("knowing which seals leak..."). This "know-how" is: (a) **highly specific** to the bespoke system, (b) **tacit** (difficult to codify or articulate), (c) **collective** (residing in the team's shared experience and interactions), and (d) **non-recoverable** if scrapped. Crucially, this knowledge asset was *co-developed* with the machine over years. Continuing investment isn't primarily about honoring sunk costs, but about **preserving and utilizing this unique, irreplaceable knowledge capital** at low marginal cost, whose value is obliterated upon switching. The off-the-shelf system lacks this embodied performance guarantee.

  **(3) A hard boundary case:**
  Imagine the original team has entirely disbanded (retired/moved on), leaving only documentation and a new team unfamiliar with the bespoke cryostat. Finishing it still costs marginally more than buying off-the-shelf. The new team must rely solely on manuals and logs, not lived experience. The bespoke machine's performance remains intrinsically linked to its design quirks, but the critical tacit knowledge asset no longer exists within the active project. Is continuing rational (preserving the physical embodiment of potential knowledge re-acquisition) or merely committed (chasing irrecoverable knowledge and sunk costs)?

  **(4) Verdict:**
  No single existing term perfectly captures the **rational core of preserving irreplaceable, performance-critical tacit knowledge embodied in a unique socio-technical system**. The best fit is a specific sub-type of **Asset Specificity**, but emphasizing *knowledge* over physical assets. Therefore, coining the term **"Tacit Knowledge Asset Specificity"** is justified. It is defined as: **A form of asset specificity where the primary value resides in irreplaceable, non-transferable, experiential knowledge (tacit know-how) deeply embedded within a team's interaction with a unique system or process. This knowledge constitutes a critical capital asset whose value is destroyed upon abandonment of the system, making continued investment rational despite superficially higher costs compared to generic alternatives, as the alternatives lack the embodied performance guarantee provided by the knowledge.** This distinguishes it from irrational sunk cost adherence (where no unique, performance-critical asset is preserved) and standard switching costs (which are overcome with time/money investment). The boundary lies where the tacit knowledge asset ceases to exist or becomes separable from the system.
