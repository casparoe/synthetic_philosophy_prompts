prompt: |-
  quick context: i'm a game theory person who wandered into philosophy for my thesis, and i've realised i can't write the coordination chapter until i know what a theory of common knowledge is actually supposed to accomplish. the economists i trained under just declare at the top of a model that something is common knowledge, and the philosophers i've been reading treat it as something out there in a shared situation, like a public clock everyone can see. write me the desiderata: what any adequate account of common knowledge has to deliver, with the case or reasoning behind each entry. the ones i already suspect matter: getting the coordinated attack situation right, where messengers can fail silently and the upshot is that no finite chain of assurances ever suffices, without just building that in as a stipulation; explaining why an announcement made in front of everyone does something no private backchannel can, no matter how long the chain; saying whether you need the whole infinite tower of i-know-that-you-know-that-i-know or whether knowledge to any finite depth is enough -- and what could even distinguish those, since every actual interaction only ever uses finitely many levels; whether the account has to be one that non-ideal agents, or even animals coordinating by call and response, could satisfy, or whether it's honest to just say it's for idealizers; and keeping common knowledge from collapsing into common belief, given that factivity is supposed to be doing real work here. for each requirement say what makes it a requirement, mark which are non-negotiable and which are preferences of one camp, tell me if any subset is jointly unsatifsiable (if so, that's the part i most want), and which single requirement knocks out the most candidate accounts. start your reply with the bottom line in the first sentence, then the reasoning, no preamble and no restating this back at me. a couple of sentences at the end scoring the two pictures i grew up with -- declare-it-in-the-model, and shared-enviroment -- against the list would be welcome, but the list itself is the deliverable.
reasoning: |-
  Okay, the user is a game theorist diving into philosophy for their thesis, specifically needing to clarify what a theory of common knowledge must achieve to write their coordination chapter. They’ve highlighted key puzzles: the coordinated attack problem, public announcements vs. private chains, the infinite tower vs. finite depth debate, applicability to non-ideal agents/animals, and preventing collapse into common belief.  

  First, the core tension: common knowledge (CK) must resolve coordination failures like coordinated attack (where finite assurances fail) while being plausibly achievable in real-world scenarios (e.g., public announcements). The infinite regress seems necessary theoretically but impractical empirically—this is the crux.  

  For desiderata:  
  1. **Non-finite attainability via finite means** is non-negotiable. Public announcements create CK instantly, while private chains cannot—this distinguishes CK from mere iterated belief. The attack problem proves this: if messengers fail silently, no finite "I know you know..." suffices.  
  2. **Resisting collapse to common belief** is critical. If CK isn’t factive (truth-guaranteed), it can’t underpin coordination (e.g., false beliefs about a meeting location cause failure). Philosophers like Lewis and Gilbert enforce this; economists sometimes blur it.  
  3. **The infinite tower requirement** splits camps. Technically, CK requires infinity (attack problem), but pragmatists (e.g., Binmore) argue finite depth suffices since humans truncate. However, any finite depth *can* fail in edge cases—so the *capacity* for infinite depth matters, even if unused.  
  4. **Non-ideal agent accessibility** is a preference. Lewis’s "basis clause" (public events) allows animals/children to achieve CK via stimuli (e.g., a lion’s roar). Idealized accounts (Aumann) exclude this, but the user might need it for biological coordination.  
  5. **Avoiding circularity/stipulation** knocks out weak accounts. Economists’ "declare-and-assume" approach dodges explaining *how* CK arises. A shared environment (e.g., public clock) works only if agents mutually recognize its publicity—which presupposes CK!  

  **Contradiction alert**: The infinite tower seems incompatible with non-ideal agents (who can’t handle infinity). Resolution: CK is *defined* by infinite depth but *instantiated* by finite, publicity-based triggers (like announcements) that shortcut the regress.  

  **Scoring existing models**:  
  - **Economist’s "declare-it"**: Fails desiderata 1, 5 (stipulative, ignores attainability). Acceptable only for toy models.  
  - **Shared environment**: Partial credit. Public clocks *can* underpin CK (duty 1, 3, 4) but only if agents mutually recognize their shared access—which requires prior CK (circularity). Needs careful handling (e.g., Lewis’s basis).  

  **User’s hidden need**: They likely want CK to *both* explain hard coordination (attack problem) *and* apply to real agents. The solution? Ground CK in public events (finite/accessible) that *imply* the infinite tower, avoiding regress without stipulation.
answer: |-
  ### Bottom Line: An adequate account of common knowledge (CK) must resolve coordination under uncertainty, enforce factivity, allow finite-generation of infinite-depth structures, and accommodate both ideal and non-ideal agents without circularity or collapse to belief.  

  #### **Desiderata with Cases/Reasoning**  
  1. **Resolve the Coordinated Attack Problem Non-Stipulatively**  
     - **Requirement**: CK must explain why *no finite chain of assurances* suffices for coordination when communication is fallible (e.g., messengers fail silently).  
     - **Case**: Two generals cannot synchronize an attack because each message (e.g., "I agree") adds only one layer of knowledge ("I know you agree"), never reaching mutual certainty that *both know the plan simultaneously*. CK resolves this by demanding infinite nested knowledge ("I know you know I know...").  
     - **Status**: Non-negotiable (defines CK’s necessity).  
     - **Knockout Power**: Rejects accounts where finite-depth knowledge suffices (e.g., heuristic "mutual knowledge" models).  

  2. **Explain Public Announcements’ Unique Power**  
     - **Requirement**: CK must distinguish a *public announcement* (e.g., "Meet at noon!" shouted in a crowded room) from any finite private exchange.  
     - **Reasoning**: Public events create simultaneous, symmetric awareness. Private chains lack this: even after 100 backchannel messages, uncertainty persists about others' receipt. CK emerges when all perceive the event *and* perceive others perceiving it ad infinitum.  
     - **Status**: Non-negotiable (core to CK’s role in coordination).  

  3. **Infinite Tower vs. Finite Depth**  
     - **Requirement**: CK requires *potential* infinite depth, but must be *generated finitely* in practice.  
     - **Case**: Public announcements finitely generate CK (all see the event, implying all know all see it, etc.). Yet *finite-depth knowledge* fails in edge cases (e.g., Coordinated Attack). Distinction: CK’s infinite depth handles counterfactuals ("If Agent 1 doubted, they’d know Agent 2 knows, so they wouldn’t doubt").  
     - **Status**: Non-negotiable for rigor; finite approximations accepted pragmatically.  
     - **Joint Unsatisfiability?**: Tension with non-ideal agents (Desideratum 4) if infinity is computationally explicit.  

  4. **Accessibility to Non-Ideal Agents/Animals**  
     - **Requirement**: CK should apply to humans with bounded rationality or animals (e.g., birds synchronizing flight via a call).  
     - **Case**: A lion’s roar heard by a herd creates CK of danger: all hear it, all see others reacting, enabling instant coordination.  
     - **Status**: Preference (Lewis/Gilbert camp); rejected by idealizers (Aumann).  
     - **Knockout Power**: Rejects hyper-intellectualized accounts (e.g., explicit infinite recursion).  

  5. **No Collapse to Common Belief**  
     - **Requirement**: CK must require *factivity* (if CK that *P*, then *P* is true).  
     - **Reasoning**: Coordination fails on false beliefs (e.g., if groups falsely "commonly know" a bridge is safe). Belief lacks factivity; knowledge anchors reliability.  
     - **Status**: Non-negotiable (prevents CK from being merely psychological).  
     - **Knockout Power**: Eliminates belief-based models (e.g., "common belief" in economics).  

  #### **Key Tensions**  
  - **Joint Unsatisfiability**: Desiderata 3 (infinite depth) and 4 (non-ideal agents) clash. Animals can’t grasp infinite recursion, yet CK’s logic demands it.  
    - **Resolution**: CK is *implicit* in public events (e.g., a lightning strike). Agents need not compute infinity; the structure is instantiated environmentally.  
  - **Strongest Knockout**: Desideratum 1 (Coordinated Attack) eliminates most finite-depth and belief-based accounts.  

  #### **Scoring Existing Accounts**  
  - **Economist’s "Declare-it-in-the-Model"**:  
    - **Fails**: Desiderata 1 (stipulates CK; doesn’t explain *how* it resolves coordination failures) and 5 (often conflates CK with common belief).  
    - **Passes**: None robustly. Useful for abstraction, but inadequate for philosophy.  
  - **Shared Environment (Public Clock)**:  
    - **Fails**: Desideratum 1 unless it explains *why* public observation implies infinite depth (risk of circularity: "How do agents know the clock is public?").  
    - **Passes**: Desiderata 2 (publicity), 4 (accessibility), and 3 if environment implies mutual openness (Lewis’s "basis for common knowledge").  

  **Final Note**: A hybrid account (e.g., Lewis 1969) satisfies most: CK arises from *public events* that are *perceptually simultaneous*, finitely generating infinite depth while allowing animal accessibility and enforcing factivity.
