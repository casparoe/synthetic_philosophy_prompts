answer: |-
  ### **In-Class Game: Good's Theorem and the Value of Information**

  This game is designed to make students viscerally experience Good's theorem (that costless, relevant information cannot harm a rational agent in expectation) and then confront situations where information *feels* harmful due to violated assumptions. The three-phase structure (Base, Twist, Debrief) highlights the gap between the theorem's predictions and everyday "ignorance is bliss" intuitions.

  ---

  ### **Materials List (Graduate-Student Budget)**
  - **Decks**: Two custom decks of 15 cards each (total cost: <$5):
    - **Deck A**: 12 red cards, 3 blue cards (e.g., red/blue index cards or paper squares).
    - **Deck B**: 3 red cards, 12 blue cards.
  - **Coins**: Two fair coins (quarters work).
  - **Dice**: One standard 6-sided die (for witness signals).
  - **Score Sheets**: 12 copies (one per student; [template here](https://docs.google.com/document/d/1EXAMPLE/edit?usp=sharing)).
  - **Containers**: Two opaque bags (for decks) and one small bowl (for signal die rolls).
  - **Payoffs**: Points tracked on score sheets. **Redemption**: 100 points = a candy bar (or 10 points = +0.1% extra credit, capped at 2%). Total cost: <$15.

  ---

  ### **Rules and Setup**
  #### **Phase 0: Introduction (5 min)**
  - **Instructor explains**:
    - A hidden coin flip each round chooses **Deck A** (80% red) or **Deck B** (80% blue).
    - Students bet on the color of a drawn card at **fair odds (1:1)**: Win +1 point if correct, lose -1 point if wrong.
    - Before betting, students privately choose to **Peek** (free 83%-accurate signal about the deck) or **Don’t Peek**.
    - **Signal generation**: If a student peeks, roll a die:
      - True Deck A: 1–5 → Signal "A", 6 → Signal "B" (83% accuracy).
      - True Deck B: 1–5 → Signal "B", 6 → Signal "A".
  - **Assign groups**: 6 students **Always Peek**; 6 **Never Peek** (base phase only).
  - **Elicit predictions**: *“Raise your hand if you think Always Peekers will do worse on average than Never Peekers.”* Record votes on the board.

  #### **Phase 1: Base Phase (15 min, 10 rounds)**
  - **Per round** (1.5 min):
    1. Flip coin (hidden) to choose deck (Heads: A; Tails: B).
    2. Students privately choose to **Peek** or **Don’t Peek** (groups must follow strategy).
    3. **Peekers**: Receive signal via die roll (instructor rolls privately, shares on slips).
    4. Students bet on red/blue (write on score sheets).
    5. Draw a card from the chosen deck, reveal color, and resolve bets (+1/-1).
  - **Tracking**: Students record points. Instructor tracks group averages on the board.

  #### **Phase 2: Twist Phase (25 min, 3 rounds each twist)**
  - **Twist 1: Prize-Dependent Utility**  
    - **Change**: 50% chance of **Bonus Round** (win +2 points if correct; lose -1 if wrong). Signal reveals if it’s a Bonus Round (83% accuracy).  
    - **Psychological cost**: If the signal says "Not Bonus," lose 0.2 points (disappointment).  
    - **Why it feels bad**: Learning it’s "Not Bonus" feels like a letdown.  

  - **Twist 2: Second-Order Information**  
    - **Change**: 50% chance the round **Doesn’t Count** (points not recorded). Signal reveals if it counts (83% accuracy).  
    - **Psychological cost**: If the signal says "Doesn’t Count," lose 0.2 points (frustration).  
    - **Why it feels bad**: Learning your effort is "wasted" stings.  

  - **Twist 3: Observable Peeking (Paired Rounds)**  
    - **Change**: Students paired randomly. After peeking decisions, partners see each other’s choice.  
    - **Social cost**: If you peek and your partner doesn’t, lose 0.2 points (being "judged").  
    - **Why it feels bad**: Peeking alerts others, inviting social backlash.  

  - **Procedure**:  
    - Announce twist type. Run 3 rounds per twist.  
    - Students now choose freely to **Peek** or **Don’t Peek**.  
    - Resolve bets and costs as above.  

  #### **Phase 3: Debrief (30 min)**
  1. **Base Phase Results** (5 min):  
     - Compare average scores: Always Peekers should lead (expected +0.4 pts/round vs. 0 for Never Peekers).  
     - Highlight: Information helped, as Good’s theorem predicts.  

  2. **Worked Numerical Example** (10 min, Good's Theorem in Action):  
     - **Setup**: State X (60%) or Y (40%). Choose A (earns 10 in X, 0 in Y) or B (earns 0 in X, 10 in Y).  
     - **Without info**: Best action (A) gives 6.0 expected points.  
     - **With 90%-accurate signal**:  
       - Signal "X" (58% of time): Choose A → 9.31 expected points.  
       - Signal "Y" (42% of time): Choose B → 8.57 expected points.  
     - **Overall expected points**: (0.58 × 9.31) + (0.42 × 8.57) ≈ 9.0. **Gain**: +3.0 points.  

  3. **Map Twists to Broken Assumptions** (10 min):  
     - **Twist 1 (Prize-Dependent)**: Violates **stable preferences over outcomes**. Utility depends on the information state itself (disappointment from "Not Bonus").  
     - **Twist 2 (Second-Order)**: Violates **fixed preferences**. Utility drops due to frustration, not the physical outcome.  
     - **Twist 3 (Observable Peeking)**: Violates **single-agent rationality**. Others condition on your learning (social judgment), and utility includes psychological costs.  
     - **Key Insight**: Good’s theorem ignores utility from *being in informational states* (anxiety, frustration, social effects).  

  4. **Discussion** (5 min):  
     - Why did intuitions scream "information is bad"? Because humans derive utility from beliefs/ignorance (e.g., avoiding dread).  
     - Good’s theorem holds only when preferences are *solely over physical outcomes* and agents are *non-strategic*.  

  ---

  ### **What Will Predictably Go Wrong**
  1. **Deck/card errors**: Students may miscount cards or misassign colors.  
     - **Mitigation**: Pre-test decks; use high-contrast colors.  

  2. **"Peeking is fun" bias**: In twists, students may peek for entertainment (not rationality), artificially inflating peeking rates.  
     - **Flag in debrief**: This violates Good’s assumption that utility *only* comes from outcomes. Peeking for "fun" adds information-state utility.  

  3. **Finite-sample luck**: In 10 rounds, Always Peekers may lose to Never Peekers by chance (e.g., unlucky signals).  
     - **Risk**: Students may (falsely) conclude information is harmful.  
     - **Mitigation**:  
       - Pool data across all students to show averages (e.g., "All Always Peekers: +4.2 avg; Never Peekers: -0.3 avg").  
       - Stress that Good’s theorem is about *expectation*, not single runs.  

  ---

  ### **What the Activity Can’t Replicate (Requires Debrief)**
  **The expectation-empiricism gap**:  
  - Good’s theorem is ex ante (pre-experiment expectation), but students experience ex post (finite outcomes). A 10-round session can’t reliably manifest the expected value gap.  
  - **Solution**:  
    1. In debrief, emphasize the difference between expectation (long-run average) and realized outcomes.  
    2. Use the pooled class data (e.g., 10 rounds × 6 Always Peekers = 60 trials) to approximate expectation.  
    3. Show the math explicitly (e.g., base-phase expected value calculation).  
  - **Why no workaround is perfect**:  
    - Even pooled data is finite. You *must* clarify that the theorem’s power is in the *limit* (simulations help; share [this Python script](https://colab.research.google.com/drive/1EXAMPLE) for post-class exploration).  

  ---

  ### **Timeline (75-Minute Session)**
  - **0–5 min**: Introduction, group assignment, prediction vote.  
  - **5–20 min**: Base Phase (10 rounds).  
  - **20–22 min**: Tally/display base results.  
  - **22–25 min**: Explain Twist 1.  
  - **25–30 min**: Run Twist 1 (3 rounds).  
  - **30–33 min**: Explain Twist 2.  
  - **33–38 min**: Run Twist 2 (3 rounds).  
  - **38–41 min**: Explain Twist 3.  
  - **41–46 min**: Run Twist 3 (3 rounds).  
  - **46–76 min**: Debrief (results, example, twist analysis, discussion).  
  - **76–75 min**: Wrap-up (Q&A; redemption instructions).  

  ---

  This game forces students to confront why information *feels* harmful (psychological/social utility) while proving it isn’t under Good’s idealized conditions. The twists make the theorem’s assumptions tangible, and the debrief closes the loop between intuition and formalism.
