    Twist 2: Signal about whether the round counts. This is similar: if the round doesn't count, then the outcome is 0, so the utility is 0. But knowing that might cause distress? We'll say that the student loses 0.1 points of utility just for knowing that the round doesn't count (because they feel their effort is wasted). This is a utility from the information state.

    Twist 3: Paired round where the other player can observe your peek and then copies your bet. But to make it harmful, we need to design the payoffs such that when the other copies, your expected payoff is lower than if they didn't copy and you had the information alone. We can do this with a market effect: your payoff is reduced when more people are correct? But this is not a market.

    Alternatively, we can have a different paired game: the students are not betting on the card but on a different state, and they are in a competitive prediction market. But time is short.

    Given the time, I propose to simplify the twists to focus on the utility of information state:

    - In the first twist, the signal is about the deck, but if the signal is "B" (which is bad news because deck B has more blue, but the student prefers red? not really), we can arbitrarily define: if the student receives a signal that says "B", they lose 0.2 points (for disappointment) regardless of the outcome. This directly breaks the theorem because the utility now depends on the signal.

    - In the second twist, the signal is whether the round counts. If it doesn't count, then the student is sad and loses 0.2 points.

    - In the third twist, we can have a social component: if you are the only one who peeked in your pair, you gain 0.1 points of pride, but if you peeked and the other didn't, the other student might think you are a nerd and you lose 0.2 points of social standing. This is also a utility from the information state.

    These are artificial but illustrate the point.

    Now, the debrief will explain that Good's theorem assumes that the utility is a function only of the outcome (the physical outcome, not the informational state). In the twists, the informational state directly affects utility.

    We also want to do a numerical example in debrief.

    Numerical example for Good's theorem:

    A simple decision problem:

    State: X (with prob 0.6) or Y (prob 0.4).
    Actions: A or B.
    Payoffs:
      - If you choose A: 
          - When X: 10
          - When Y: 0
      - If you choose B:
          - When X: 0
          - When Y: 10

    Without information:
      - Choose A: 0.6*10 + 0.4*0 = 6
      - Choose B: 0.6*0 + 0.4*10 = 4
      - So choose A, get 6.

    With a free signal that is 90% accurate about the state:
      - Suppose the signal can be "x" or "y".
      - P(signal="x"|X)=0.9, P(signal="y"|X)=0.1
      - P(signal="y"|Y)=0.9, P(signal="x"|Y)=0.1

      - P(X|signal="x") = P(signal="x"|X)*P(X)/P(signal="x")
        - P(signal="x") = P(signal="x"|X)*P(X) + P(signal="x"|Y)*P(Y) = 0.9*0.6 + 0.1*0.4 = 0.54+0.04=0.58
        - P(X|"x") = 0.9*0.6/0.58 = 0.54/0.58 ≈ 0.931
        - So if signal="x", choose A: 0.931*10 + (1-0.931)*0 ≈ 9.31
          choose B: 0.931*0 + 0.069*10 = 0.69 -> so choose A.

      - P(X|signal="y") = P(signal="y"|X)*P(X)/P(signal="y") = (0.1*0.6) / (0.1*0.6+0.9*0.4) = 0.06/(0.06+0.36)=0.06/0.42≈0.1429
        - Choose A: 0.1429*10 + 0.8571*0 ≈ 1.43
        - Choose B: 0.1429*0 + 0.8571*10 ≈ 8.57 -> choose B.

      - Now, expected value with information:
          - P(signal="x")=0.58 -> then you get 9.31 (because you choose A and the state is likely X)
          - P(signal="y")=0.42 -> then you get 8.57 (choose B)
          - Overall: 0.58*9.31 + 0.42*8.57 ≈ 5.3998 + 3.5994 = 8.9992 ≈ 9

      - 9 > 6, so better.

    This illustrates that information helps.

  Deliverables:

  Materials:
  - Two decks of cards: 
      - Deck A: 12 red cards, 3 blue cards (can use index cards: 12 marked red, 3 blue)
      - Deck B: 3 red cards, 12 blue cards.
  - A fair coin.
  - A way to generate the witness signal. This can be done with a die or a bag of marbles. For 90% accuracy: use a 10-sided die (or a computer). But for simplicity, we can use a regular die: 
      - If the deck is A, then a die roll: 1-9 -> signal "A", 10 -> signal "B". (If using a 6-sided die, then 1-5 -> "A", 6-> "B", which is 83.3%, close enough. Alternatively, use a custom spinner or an app.)
  - For the bonus round and not-counting round: we need a way to determine these. Can use a separate coin flip or die.
  - Score sheets for students.

  Payoff scheme:
  - Points: we'll use points that can be redeemed for candy or extra credit (e.g., 100 points = a candy bar, or 10 points = 0.1% extra credit, up to a cap).

  Rules:

  Base Phase (20 minutes):
  - We will conduct 10 rounds.
  - In each round:
      1. Flip a coin to choose the deck (heads: A, tails: B).
      2. Each student, in private, decides whether to peek at the witness signal. They write down "peek" or "no peek" on their sheet. If they peek, the instructor (or an assistant) gives them a signal (generated with 90% accuracy based on the true deck). They record the signal.
      3. The instructor draws a card from the chosen deck and reveals it.
      4. Students bet 1 point on the color they think the card will be (before the draw) or note: we must have them bet before the draw.

    Correction: to have them bet before the draw, we can do:

      2. Students decide peek or not, and if peek, get signal.
      3. Students bet on the color (red or blue) by writing it down.
      4. Then the card is drawn and revealed.
      5. If the student bet correctly, they win 1 point; if not, they lose 1 point.

    But note: in the base phase, without any signal, the probability of red or blue is 0.5, so the bet is fair.

  - Students are divided into two groups: 
      - Group 1: always peek.
      - Group 2: never peek.
    Actually, we want each student to choose in each round. But for comparison, we will track two strategies: always peek and never peek.

    We can have each student choose freely. Then at the end, we compare the average score of those who always peeked vs. never peeked.

    But to have clear groups, we might assign half the students to always peek and half to never peek for the base phase. Then in the twist phases, they choose freely.

    Given 12 students, 6 always peek, 6 never peek in base phase.

  - Before starting, ask: "How many of you think that over the 10 rounds, the always-peek group will do worse on average than the never-peek group?" Record the number.

  - After 10 rounds, compute the average score for each group.

  Twist Phase (30 minutes):
    We will do 5 rounds for each twist, but students don't know which twist is which.

    Twist 1: Prize-dependent utility with psychological cost.
      - In this round, there is a 50% chance of being a bonus round (win 2 points if correct, else lose 1) and 50% chance of regular (win 1, lose 1). 
      - The free witness signal now tells you whether it is a bonus round or not (with 90% accuracy). 
      - Additionally, if the signal says "regular" (not bonus), then the student loses 0.2 points (disappointment cost) immediately upon receiving that signal.
      - The state (bonus or not) is determined by a coin flip at the beginning of the round.
      - The deck is chosen independently by another coin flip.

      Why might you not want to peek? Because if you learn it's regular, you lose 0.2 points, and if you learn it's bonus, you gain nothing extra (only the chance to win more, but that doesn't directly affect utility until after the bet). So the expected utility of peeking might be negative due to the cost of disappointment.

    Twist 2: Second-order information (whether the round counts) with psychological cost.
      - Before the round, there is a 50% chance that the round will count and 50% that it won't (determined by a coin flip).
      - The signal tells you whether the round counts or not (90% accuracy).
      - If the signal says "does not count", then the student loses 0.2 points because they feel their time is wasted.
      - If the round doesn't count, then regardless of the bet, the student's score change is 0 (but they still incur the disappointment cost if they peeked and got "does not count").

    Twist 3: Paired round with social cost.
      - Students are paired randomly.
      - In the round, the deck is chosen and the card is drawn as usual.
      - Each student decides whether to peek. Then, the instructor announces to the pair who peeked and who didn't.
      - Then they bet.
      - Payoff from the bet: as usual, win 1 if correct, lose 1 if wrong.
      - Additionally, if a student peeked and their partner did not, then the student who peeked loses 0.2 points (social cost: being seen as a nerd). If both peeked or both didn't, no social cost.

    - In each of these 5 rounds per twist, students choose whether to peek or not. We don't force groups.

    - We do 5 rounds of twist 1, then 5 of twist 2, then 5 of twist 3. But better to interleave to avoid students catching on? Or do them in blocks and announce the type.

    - Announce the type of round: 
          "In this round, the signal is about whether it's a bonus round or not. And there might be additional rules about costs."

    - For each twist, briefly explain the additional rule.

  Debrief (25 minutes):
  - We map each twist to the assumption it breaks.
    - Base phase: confirms Good's theorem.
    - Twist 1: the utility now depends on the information state (disappointment from knowing it's not bonus). This violates the fixed preferences over outcomes. In the theorem, the utility should depend only on the final outcome (the bet outcome), not on the belief state.
    - Twist 2: similarly, utility depends on knowing that the round doesn't count (disappointment), and also the outcome doesn't matter. But the disappointment cost is incurred because of the information.
    - Twist 3: utility depends on the social perception of having peeked, which is part of the information state.

  - Also, in the paired round, there is an additional agent who conditions on your learning. This is not directly a violation of Good's theorem for a single agent, but it does introduce strategic interaction. Good's theorem assumes a single decision maker.

  - Second-order information (whether the round counts) is not a genuine counterexample without the psychological cost, because if the round doesn't count, the outcome is 0, and if it counts, it's the usual. But the decision to peek might be made before knowing whether the round counts, so it's a compound lottery. However, the cost-free information should still be beneficial in expectation. But with the psychological cost, it's not.

  - Worked numerical example (as above) on the board.

  Timeline:

  - 0-5 min: Introduction and setup. Explain the base phase rules. Assign groups (6 always peek, 6 never peek). Elicit predictions.
  - 5-20 min: Base phase (10 rounds). Each round takes about 1.5 minutes.
  - 20-22 min: Tally base phase results. Show the average for always-peek vs never-peek. (Always-peek should be higher on average.)
  - 22-25 min: Explain the first twist and run one example round.
  - 25-30 min: Run 4 more rounds of twist 1.
  - 30-35 min: Explain and run 5 rounds of twist 2.
  - 35-40 min: Explain and run 5 rounds of twist 3.
  - 40-60 min: Debrief. 
      - 40-50 min: Discuss the base phase and Good's theorem. Show the numerical example.
      - 50-60 min: Go through each twist and explain which assumption is broken. Discuss the gap between expectation and finite runs.

  Predictably goes wrong:
  1. Deck preparation: make sure the decks are correctly made. Test beforehand.
  2. Signal generation: use a reliable method. A 10-sided die or an app.
  3. Students might peek in twist rounds even if it's not rational because it's fun. This is a utility not modeled: the joy of knowing. This violates the fixed utility assumption.
  4. In a finite session, by luck, the never-peek group might score higher. This could teach the opposite lesson. To mitigate, we can:
      - Run more rounds (but time is limited).
      - Pool the results across all students and rounds to show the average.
      - Emphasize that it's about expectation, and show the expected value calculation.
  5. In the paired round, students might not understand the social cost rule.

  What the activity cannot reproduce and must be supplied in debrief:
     The gap between ex ante expectation and a finite run. We must emphasize that Good's theorem is about expectation. In a finite run, the always-peekers might get unlucky. We can show the expected value calculation and note that with more rounds, the average should converge. Also, we can pool the data from all students (each student is an independent trial) to get a larger sample.

     We can also run a simulation beforehand and show the results.

     Alternatively, during the game, we can have a public display of the running average for the two groups.

     But given time, we must verbally explain in debrief.

     Another thing: the theorem's proof requires taking the expectation over all information states. The activity lets students experience a few states. We must do the math to show the simplification.

     So in debrief, we will do the worked numerical example and also show the tree and expectation calculation.

  Revised Materials List (cheap):
  - Two decks of 15 cards each (Deck A: 12 red, 3 blue; Deck B: 3 red, 12 blue) - can be index cards.
  - A coin.
  - A die (6-sided) for signal generation: 
      - For deck A: 1-5 -> signal A, 6 -> signal B (83.3% accuracy).
      - For deck B: 1-5 -> signal B, 6 -> signal A.
  - Another coin or die for bonus/not and count/not.
  - Score sheets for students (or a shared Google Sheet).

  This is affordable.

