prompt: |-
  I'm a software engineer, been doing the on-call rotation and incident command stuff for a few years now, so I've written my share of blameless postmortems. The ritual, in case it matters: after an outage we do a writeup that sticks strictly to how the failure happened — which alert fired late, which flag got flipped, which race condition won — and there's a hard norm against saying anyone screwed up. The stated reasoning is that nobody comes to work intending to break prod, everyone made reasonable calls with the info they had, and if we punish people, next time they'll hide stuff and the postmortems turn into fiction. Fine, I mostly buy that. But here's what's bugging me: the same org, in the same quarter, gave a guy a fat spot bonus for heroically restoring service at 3am after an outage that his own config push caused, while another engineer got quietly managed out because her canary rollout — which cleared the same review process his did — happened to take out payments during peak. On-call bonuses, promo packets, who gets credit for "ownership," who gets trusted with the scary migrations: everything around the postmortem tracks outcomes, and outcomes in this game are basically luck — the same broken deploy is a nothingburger at 4am Sunday and a Sev-1 at 9am Monday.

  So what does the blameless postmortem actually presuppose about responsibility? Is it commited to the view that blame tracks what you did rather than what happened, or is it just an information-gathering hack that would survive just fine even if you thought outcomes do affect blameworthiness — and if so, is it strange that we never say that part out loud? And does the surrounding reward system presuppose the opposite of what the postmortem presupposes, or is there some coherent picture that holds both together without it being pure hypocrisy?

  Give me exactly five numbered points, one or two sentences each, no intro or conclusion. Each of the first four should be a candidate commitment that the practice rests on, with a quick verdict on whether it genuinely requires that view or is compatible with several rival ones, or else a place where the pieces clash. Make the fifth point about what would actually have to change in how we run incidents and reviews if the real presupposition turned out to be the outcome-tracking one rather than the blameless one.
reasoning: |-
  Okay, let me tackle this user's query. They're a software engineer experienced with on-call rotations and blameless postmortems. The core frustration is the inconsistency between the "no-blame" culture during postmortems and the outcome-based rewards and consequences in their org. 

  First, I need to parse their main questions: What does blamelessness presuppose about responsibility? Is it about actions vs outcomes? And does the reward system contradict it? They want five concise points without intros or conclusions.

  I recall that blameless postmortems focus on systemic factors, not individuals. But the user points out real-world examples where outcomes affected careers - one engineer got a bonus for fixing their own mistake, another was pushed out for a similar error during peak time. This highlights a tension between theory and practice.

  For the five points:
  1. I'll start with the foundational premise: blamelessness separates actions from outcomes. The practice genuinely requires this view because attributing blame based on outcomes would undermine psychological safety.
  2. Next, the info-gathering angle. While blamelessness helps uncover facts, it's technically compatible with outcome-based blame - though that would sabotage its effectiveness.
  3. Then the contradiction: the reward system clearly tracks outcomes (hero bonuses, promotions), directly clashing with blameless principles.
  4. For the fourth point, I consider if there's a coherent hybrid view. Maybe they treat blamelessness as procedural but outcomes as consequential? But this creates inconsistency.
  5. Finally, if outcomes determined blame, we'd need fundamental changes: shifting bonuses to prevention, reframing heroism, and redesigning reviews to focus on outcome-independent risks.

  I need to keep each point to 1-2 sentences as requested. The user seems to want philosophical clarity but also practical solutions - they're clearly frustrated by the hypocrisy they observe daily. The fifth point should offer concrete alternatives to address the systemic flaws they've identified.
answer: |-
  1.  Blameless postmortems presuppose that responsibility and blameworthiness track *intent, reasoning process, and action taken*, not the *outcome*; the practice genuinely requires this separation to enable honest information sharing without fear of punishment for adverse results.
  2.  The blameless *process* itself is technically compatible with outcome-based blame assigned later (e.g., in performance reviews), but this undermines its core purpose of psychological safety and creates the inconsistency the user observes between the ritual and the reward system.
  3.  The surrounding reward system (spot bonuses, promotions) presupposes the *opposite*: that outcomes (especially highly visible recovery or severe impact) *do* track responsibility and merit, creating a fundamental clash with the blameless premise where identical actions have different consequences based on luck.
  4.  A "coherent picture" could theoretically exist if the organization strictly viewed the postmortem *only* as a systemic learning tool (action-focused) and performance/rewards *only* on prevention, code quality, or documented process adherence regardless of outcome, but the described hero bonuses and managed-out cases show this separation isn't maintained.
  5.  If outcomes genuinely tracked blameworthiness, incident reviews would need to explicitly assess the "reasonableness" of actions *given the predictable consequences* (e.g., peak time risk), bonuses would reward flawless execution or prevention over heroic recovery, and promotions would ignore outage impact if process was followed.
