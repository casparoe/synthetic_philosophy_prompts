prompt: |-
  I've been reading a popular book on the philosophy of science, and its chapter on structural realism left me both intrigued and a bit uneasy, because I suspect some of it glides over distinctions that matter. I'd like you to act as a professional philosopher of science and audit the chapter's summary for me, carefully, claim by claim. Please take a moment to consider each sentence before evaluating it, and then tell me which parts a working structural realist would accept, which are simplifications an expert would tolerate, and which are genuine misrepresentations that change the view's plausibility.

  Here is the relevant passage, as the book presents it: "Structural realism began as a response to the pessimistic induction: since past theories turned out false even when successful, we should expect ours to fail too. Worrall's insight was that although Fresnel's theory of light was strictly wrong, its equations survived intact in Maxwell's theory, so what is retained across theory change is structure, not the nature of the things. Structural realism therefore says that science can tell us only about the relations between objects, never about the objects themselves, and that our theories are at least approximately true about those relations. Ladyman and Ross pushed this further into ontic structural realism, the claim that objects don't really exist at all: there is only structure, and things like electrons and even tables are just convenient fictions we impose. And since a structure is fully individuated by its relations, any two worlds with exactly the same structure are literally the same world, which is why structural realists say a perfect simulation of our universe would not merely resemble our universe but would be our universe. So the view rescues scientific realism from history while conceding that physics is not really about physical things."

  A few things I'd especially like your judgment on. First, does the passage keep apart the epistemic and ontic versions of the view, or does it slide between them, and would defenders of each accept or reject the different sentences? Second, the passage treats the Fresnel-to-Maxwell case as if it settled something — is that a fair use of the historical example, or is it doing less work than the book suggests? Third, the claims about tables being fictions and about simulations being literally our universe sound like substantial philosophical theses being attributed to the whole camp — do these actually follow from structural realism, or are they the author's extrapolations dressed up as consequences? Finally, given your corrections, tell me whether the book's concluding assessment — that the view rescues realism from the pessimistic induction — survives once the summary is put right. I'm inclined to find the view attractive, so I'd appreciate it if you didn't soften the genuine objections, like Newman's problem, just to keep me comfortable.
