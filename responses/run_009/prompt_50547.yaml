  - MEU always predicts raffle.
  - Alpha-Maxmin predicts raffle only if α > 0.75 (1-α < 0.25); otherwise, it predicts Urn U bet.
  - Thus, the rules "come apart" on this case unless α > 0.75, where both predict raffle. Since α is unknown, Alpha-Maxmin allows either choice.

