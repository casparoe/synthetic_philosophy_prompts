prompt: |-
  I'm a longtime reader of LessWrong and the rationalist blogosphere, and I've noticed my gut verdicts about which societies "collapsed" don't line up into anything coherent. Acting as an expert in the philosophy of history and comparative collapse studies, I'd like your help extracting a principle from them. Please think carefully and begin with some open brainstorming about candidate criteria before committing to an account.

  Here are my verdicts. The Late Bronze Age eastern Mediterranean around 1200 BCE is a clear collapse: palaces burned, Linear B writing vanished from Greece, and long-distance trade evaporated. The Classic Maya around 900 CE is also a collapse for me — dynastic inscriptions stop, the southern lowlands largely empty out — even though millions of Maya people persisted, and calling it a "collapse" while saying Maya civilization never ended makes me uneasy. The Western Roman Empire I keep wanting to call transformation rather than collapse, even though urban scale and literacy cratered and the people living through it experienced it as catastrophe. Angkor's slow decline and the relocation of its court I'd call not-a-collapse, just change. Easter Island I now think was never a self-inflicted ecocollapse — the decisive damage was disease and slave raids after European contact — though for years I'd have called it the textbook case. And a hypothetical future in which population declines gradually over several centuries, with each generation living longer and better than the last, is obviously not a collapse.

  My tentative principle: a collapse is a rapid, involuntary loss of societal complexity, occurring against the preferences of the society's own members. I suspect it can't accommodate all of the above — the Roman and Maya verdicts alone look inconsistent. So: is there a principle that captures my verdicts? If not, which verdicts would you overturn, and why? Please state the principle precisely, tie each of its clauses to the cases that motivate it, give its verdicts on cases I haven't listed (the Soviet dissolution of 1991 would be a good test, as would the Black Death), and be explicit about any of my verdicts you cannot accommodate. I'd also like your view on the broader question these cases raise: whether societies ever genuinely fail, or merely change — and whether my own list already quietly answers that.
reasoning: |-
  Okay, the user is deeply engaged with rationalist concepts and wants a coherent principle for societal collapse that matches their intuitive judgments. They've provided several historical cases where their gut feelings about what constitutes a "collapse" seem inconsistent. 

  First, I need to unpack why they feel the Late Bronze Age and Maya were collapses but not Rome or Angkor. The key seems to be in how they describe Rome as "transformation" despite objective declines - that's the puzzle piece. Their discomfort about calling Maya a collapse while acknowledging continuity hints they value both structural rupture and human experience.

  Hmm... their tentative principle about "rapid, involuntary loss of complexity against societal preferences" is smart but doesn't explain the Rome/Maya discrepancy. For Rome they emphasize the lived experience of catastrophe, yet resist calling it collapse. That suggests temporal perception matters - maybe whether the society saw it coming? But Angkor was gradual and they don't call that collapse either. 

  Ah! The Maya case holds the clue: they note millions persisted yet still feel it was collapse. That means demographic continuity isn't disqualifying. So the rupture must be about institutions and knowledge rather than people. But then why not Rome? Perhaps because Roman institutions persisted in altered forms through the Church and Byzantium? 

  The Easter Island revision is fascinating - they're rejecting the "self-inflicted" narrative but would've previously called it collapse. This implies agency matters: collapse requires the society's own actions as primary cause, not external shocks. But the Bronze Age collapse involved external factors like Sea Peoples... 

  Wait, their hypothetical future decline explicitly rejects collapse despite complexity loss because it's voluntary and beneficial. So their intuition hinges on three things: rapidity (rejects Angkor), undesirability (rejects hypothetical future), and... what's the third? 

  *lightbulb* The Soviet Union test case! They'd probably see it as transformation despite complexity loss because the outcome aligned with many citizens' preferences. That's the missing link: societal consent. Collapse happens TO people; transformation is something they participate in, however painfully. 

  So the refined principle needs: speed (rapid), agency (involuntary), and societal consent (against preferences). Rome becomes ambiguous because while the empire fell, many citizens actively collaborated with "barbarian" successors - it was partly consensual transformation. Maya elites had no such choice; their entire structure vanished abruptly. 

  For the meta-question... their list already shows societies can genuinely fail when core structures implode against collective will. But "failure" depends on the reference point - for Maya peasants, collapse might have been liberation from elite oppression. That's why their principle must center the society's own perspective, not our external judgment.
answer: |-
  Based on your intuitions and historical cases, your tentative principle is insightful but requires refinement. Let's extract a coherent principle step-by-step, test it against your verdicts, and resolve inconsistencies.

  ---

  **Brainstorming Candidate Criteria:**
  1.  **Loss of Centralized Control:** Disintegration of political authority (Late Bronze Age).
  2.  **Demographic Decline:** Significant population decrease (Classic Maya, Black Death).
  3.  **Economic Contraction:** Disruption of trade, production, taxation (Late Bronze Age, Western Rome).
  4.  **Cultural/Technological Regression:** Loss of writing, monumental architecture, specialized knowledge (Late Bronze Age, Maya).
  5.  **Rapidity of Change:** Sudden vs. gradual decline (Late Bronze Age collapse vs. Angkor).
  6.  **Perception by Contemporaries:** Experienced as catastrophic (Western Rome).
  7.  **Irreversibility/Depth of Change:** Failure to "bounce back" to previous complexity level in the core (Maya lowlands).
  8.  **Agency & Preference:** Whether the change was self-inflicted/directed or externally forced/undesired (Easter Island revision, future decline).
  9.  **Continuity of Identity:** Persistence of core population/culture despite structural change (Maya persistence, Roman transformation).

  ---

  **The Refined Principle (Capturing Your Verdicts):**
  **A societal collapse is a rapid (decadal-scale), involuntary, and catastrophic rupture in a society's core institutions and complexity infrastructure, leading to a significant, sustained, and regionally concentrated reduction in socioeconomic complexity, which is experienced as a profound loss by its members and occurs against their collective preferences and agency.**

  ---

  **Breaking Down the Principle & Linking to Cases:**

  1.  **Rapid (Decadal-Scale):**
      *   *Motivation:* Distinguishes Angkor's slow decline/Roman transformation (~centuries) from Late Bronze Age/Maya (~50-150 years). Rules out your gradual future decline.
      *   *Cases:* Late Bronze Age (palaces burn within decades), Classic Maya (dynastic inscriptions cease rapidly), Western Rome (too slow - centuries of transformation). Angkor (slow decline - no collapse). Easter Island (decisive damage rapid, but external).

  2.  **Involuntary & Against Collective Preferences/Agency:**
      *   *Motivation:* Explains Easter Island revision (decisive external forces), future decline (voluntary/beneficial), and distinguishes Rome (complex agency - some welcomed change, elites resisted) vs. Maya elites (no choice). Captures the "experienced as catastrophe" aspect.
      *   *Cases:* Late Bronze Age (involuntary, undesired chaos), Classic Maya (involuntary loss for elites/cities), Western Rome (mixed agency/acceptance - transformation). Soviet Dissolution (see below). Future Decline (voluntary - no collapse).

  3.  **Catastrophic Rupture in Core Institutions & Complexity Infrastructure:**
      *   *Motivation:* Focuses on the *structural engine* of complexity (palace bureaucracies, dynastic systems, imperial administration). Rules out mere relocation (Angkor) or slow change.
      *   *Cases:* Late Bronze Age (palace system destroyed), Classic Maya (dynastic/royal institution collapse in lowlands), Western Rome (institutions transformed/persisted locally/Church - rupture not total).

  4.  **Significant, Sustained, Regionally Concentrated Reduction in Socioeconomic Complexity:**
      *   *Motivation:* Captures measurable decline (urbanism, literacy, trade), requires it to last (not a blip), and be geographically focused (rules out Black Death's Europe-wide but temporary impact). Accepts Maya continuity *outside* the collapsed core lowlands.
      *   *Cases:* Late Bronze Age (literacy/trade loss sustained), Classic Maya (lowland urbanism/inscriptions gone for centuries), Western Rome (complexity reduced but sustained in new forms). Black Death (see below). Angkor (complexity moved/changed, not regionally destroyed).

  5.  **Experienced as a Profound Loss by Members:**
      *   *Motivation:* Incorporates your unease about calling Maya a collapse while people persisted – it *was* a loss *for the society structured around those core institutions*. Aligns with contemporary Roman descriptions of catastrophe *for the imperial order*.
      *   *Cases:* Late Bronze Age (clear loss), Classic Maya (loss for elite/city-dweller society), Western Rome (loss for Roman imperial identity/some elites, gain for others).

  ---

  **Application to Your Cases & New Tests:**

  *   **Late Bronze Age (c. 1200 BCE):** **Collapse.** (Rapid, involuntary, catastrophic rupture (palaces), massive complexity loss (writing/trade), undesired).
  *   **Classic Maya (c. 900 CE):** **Collapse.** (Rapid in core lowlands, involuntary, catastrophic rupture (dynastic system), massive complexity loss (urbanism/inscriptions), undesired by the elite society experiencing it).
  *   **Western Roman Empire (5th Cent CE):** **Transformation, NOT Collapse.** (Too slow/gradual, mixed agency/preferences (some welcomed change), core institutions transformed/persisted (Church, local governance, Byzantium), significant complexity loss *in the West* but not sustained/simple – new complex societies emerged).
  *   **Angkor (Decline/Relocation):** **Not Collapse.** (Slow, court relocated voluntarily (agency), Khmer state/culture persisted, complexity transformed/relocated).
  *   **Easter Island:** **Not Collapse (by your revised view).** (Decisive damage rapid but overwhelmingly due to *external* forces (disease/slave raids) against islanders' agency/preferences - fits "conquest/disaster" better).
  *   **Gradual Future Decline:** **Not Collapse.** (Slow, voluntary/beneficial, no catastrophic rupture).
  *   **Soviet Dissolution (1991):** **Transformation, NOT Collapse.** (Rapid end to a superpower *political structure*, but: Complexity largely persisted/transformed (industry, science, education), core institutions adapted/replaced, experienced as profound loss *by some* (elites, Soviets) but desired/gained by many others (Baltic states, reformers, populace seeking change). No sustained reduction in socioeconomic complexity across the region – Russia remained a major power, others grew).
  *   **The Black Death (1347-1351):** **Profound Crisis/Disaster, NOT Collapse.** (Rapid, catastrophic, massive demographic/economic loss *involuntary* & *undesired*). **BUT:** Core institutions (Church, monarchies, feudalism) persisted & adapted. Complexity reduction was severe but *temporary* (~1-2 generations); Europe recovered and surpassed pre-plague complexity levels relatively quickly. Lacks the *sustained institutional rupture* of true collapse.

  ---

  **Addressing Inconsistencies & Overturning a Verdict:**

  *   **Your Maya Unease:** The principle resolves this. The collapse *was* the rupture of the specific *elite, urban, dynastic society* in the *southern lowlands*. Millions of Maya persisted, and their civilization continued/transformed elsewhere and later, but *that specific societal complex* collapsed rapidly and catastrophically against its members' preferences. It's a regional collapse of a specific complex.
  *   **The Roman Puzzle:** Your intuition ("transformation") is upheld. The principle explains why: its slowness allowed adaptation, the rupture wasn't total (institutions transformed/persisted), and agency/preferences were mixed. Calling it "collapse" overstates the rupture and understates the continuity/transformation.
  *   **Overturned Verdict?** None strictly overturned. Your revised Easter Island view fits. The principle *formalizes* why Rome isn't a collapse and why Maya still is, resolving the apparent inconsistency.

  ---

  **Answering the Broader Question:**

  *   **Do Societies Genuinely Fail, or Merely Change?** Your list, and the principle derived from it, suggests **both occur, and we can distinguish them.**
      *   **Genuine Failure/Collapse:** Occurs when core complexity-generating institutions suffer a rapid, catastrophic, involuntary rupture that leads to a significant, sustained reduction in complexity within their core region, against the will and agency of the society experiencing it. The *specific complex* fails (e.g., Mycenaean palace society, Classic Maya lowland dynastic system).
      *   **Transformation/Change:** Occurs through slower evolution, voluntary adaptation, managed decline, or even crisis recovery (like post-Black Death). Core functions and complexity may shift, relocate, or transform, but without the catastrophic, undesired, irreversible rupture defining collapse. Identity and key institutions often persist or morph (Rome -> Christendom/Feudalism; Angkor -> later Khmer kingdoms).

  *   **Your List's Answer:** Your list *does* quietly answer this. You instinctively classify events based on the *nature of the change* (rapid/catastrophic/involuntary vs. slow/adaptable/mixed agency) and its *impact on the specific societal complex* (irreversible rupture vs. continuity/transformation). The principle makes this implicit distinction explicit.

  **Conclusion:** Your intuitions point towards a definition of collapse centered on **rapid, catastrophic, involuntary institutional rupture leading to sustained complexity loss against societal will**. This distinguishes genuine collapse (Late Bronze Age, Classic Maya core) from profound transformation (Rome), slow decline (Angkor), external disaster (Easter Island), or voluntary change (future decline). Societies *can* genuinely fail in specific, catastrophic ways, but much of what we label "collapse" in popular discourse is better understood as transformation or adaptation.
