  I should start by listing the desiderata. Key ones include empirical adequacy for Allais and Ellsberg, structural requirements like transitivity and stochastic dominance, and considerations from money-pump arguments. Normative vs. descriptive goals are crucial here—expected utility might be normative but fail descriptively, while prospect theory describes behavior but may violate norms like independence.

  Conflicts must be highlighted. For example, satisfying Allais preferences conflicts with independence. The user needs to see that no theory meets all criteria, so the choice depends on the theory's purpose. If normative, stochastic dominance and avoiding money-pumps are non-negotiable. If descriptive, fitting Allais and Ellsberg is key.

