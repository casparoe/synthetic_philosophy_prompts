prompt: |-
  I'm in a decision theory course and we just finished the unit on Allais. Our professor ran the classic pair of choices on us: first, a guaranteed million versus a gamble that's 89% a million, 10% five million, 1% nothing (most of the class, me included, took the sure thing), and then a choice between a 11% shot at a million versus a 10% shot at five million, where almost everyone switched to the five million. Then she showed us that expected utility theory says these two pairs of preferences are jointly inconsistent with the independence axiom, and left it there, like that settles it. Since then we've been speedrunning "fixes" — rank-dependent utility, prospect theory, regret theory, people just biting the bullet on the axiom — and honestly I've lost track of what the fix is even supposed to accomplish.

  So before I read another one of these papers, I want the spec first. Write out the desiderata for a theory of rational choice under risk: which observed choice patterns it has to either reproduce or condemn rather than just call irrational (Allais common-consequence and common-ratio preferences, maybe Ellsberg-style ambiguity if you think that belongs in the same spec), which structural conditions it needs (transitivity, stochastic dominance, some version of independence or a stated replacement for it), what the money-pump and Dutch book style arguments actually force versus what they merely suggest, and whether the theory is supposed to be normative, descriptive, or both — because I suspect the requirements differ depending on the job. Give the case or argument behind each requirement, and be explicit about which ones are genuinely non-negotiable and which are just the expected utility camp dressing up its own tastes as the laws of rationality. And crucially: if some subset of the desiderata is jointly unsatisfiable — e.g. if you demand both independence-ish structure and Allais-respecting latitude — say so plainly, because that's the part I actually need for my term paper.

  Then, briefly, score expected utility theory, a rank-dependent or prospect-style theory, and regret theory against your own list — a couple lines each is plenty, I care way more about the criteria than the scorecard. Please write in American English.
