answer: |-
  Right then, let's break this down properly. It's a fascinating and thorny question, requiring careful decomposition. Here's my reasoning and credences, offered in the spirit of Bayesian updating rather than dogmatic assertion. I'll use British English throughout.

  **My Overall Credence:** **0.55** (Slightly leaning towards the expansion representing genuine moral progress, but with significant epistemic humility).

  **Decomposition & Reasoning:**

  1.  **P(Moral Realism is True): 0.65**
      *   *Justification:* Moral realism (the view that objective moral facts exist independently of human opinion) seems intuitively plausible – we *experience* moral disagreement as being about *facts* ("slavery is wrong" feels different to "broccoli is disgusting"). Moral arguments often appeal to reason and evidence. However, persistent disagreement, cultural variation, and challenges like Mackie's "argument from queerness" (how *could* such facts exist?) prevent higher confidence. Non-realist positions (subjectivism, relativism, error theory) offer coherent alternatives, hence the significant discount.

  2.  **P(Sustained Moral Inquiry Converges | Moral Realism True): 0.6**
      *   *Justification:* *If* moral facts exist, reason applied consistently *should* tend to reveal them over time, much like in science or mathematics. Historical trends towards less violence, greater inclusion, and rights recognition *might* reflect this. However, convergence isn't guaranteed – inquiry could get stuck, cycle, or be corrupted by power (e.g., sophisticated justifications for oppression). The non-monotonicity noted (eugenics as a false "expansion") and the potential for ideology to masquerade as progress are major concerns here. I assign only a modest majority probability to convergence *even if realism holds*.

  3.  **P(Historical Expansion Tracked Convergence | Moral Realism True & Convergence Occurs): 0.55**
      *   *Justification:* This is the crux. *If* convergence happens, did the *actual historical pattern* follow it? The correlation exists: abolition, suffrage movements, animal welfare laws *coincide* with expanded concern. Arguments appealing to universal reason (e.g., Singer's "expanding circle") played a role. However, the morally neutral drivers you mention (affluence reducing zero-sum thinking, trade interdependence fostering reciprocity norms, media making distant suffering salient, abolition driven partly by economic shifts or coalition politics) provide powerful *alternative explanations*. The sentiment-practice gap (e.g., professed love for pets alongside factory farming) suggests sentiment can expand *without* implying deeper moral realisation or improved treatment. Episodes like eugenics show "expansion" rhetoric can mask profound regression. This term gets the lowest probability in the chain due to the plausibility of non-moral drivers and historical false steps.

  4.  **P(Historical Expansion Tracked Convergence | Moral Realism False OR No Convergence): ~0.0**
      *   *Justification:* If moral realism is false, or if realism is true but inquiry doesn't converge, then the expansion *cannot* be "truth-apt progress" towards objective moral truth by definition. It might be beneficial drift, changing preferences, or power shifts, but not tracking "correctness". This term is essentially negligible for the "truth-apt progress" hypothesis. (It's implied in the decomposition but worth stating).

  **Combining the Terms (Simplified):**
  The core positive path requires *all three* of the first terms to be true for the expansion to constitute genuine truth-apt progress tracking convergence. We calculate the joint probability of this path:
  *   P(Realism) * P(Converge | Realism) * P(Tracked | Realism & Converge)
  *   = 0.65 * 0.6 * 0.55 ≈ **0.2145**

  We must also consider the probability that the expansion *is* genuine progress *even if realism is false*. However, as per term 4, this probability is effectively **0** for *truth-apt* progress (progress towards objective truth). If realism is false, there *is* no objective truth to get closer to. The expansion might be subjectively preferable or instrumentally beneficial, but it's not "closer to correct" in a realist sense.

  Therefore, the *only* path to the "truth-apt progress" hypothesis is the joint probability of the first three terms: **≈0.2145**.

  **Why is my overall credence 0.55 then?**
  This is where the decomposition needs refinement and the "further terms" come in. The calculation above gives the probability *strictly on the realist path*. However:

  1.  **Non-Realist "Progress":** While the expansion isn't "truth-apt" if realism is false, we might still *call* it progress in a practical, normative sense (e.g., reducing suffering, increasing flourishing, satisfying more preferences more fairly). This is progress *by our lights*, even if not towards mind-independent truth. The *experience* and *benefits* of expanding concern are real. This warrants adding some credence back.
  2.  **Partial Tracking:** Even within realism, it's likely that the historical expansion *partially* tracked convergence amidst noise and alternative drivers. It's not all-or-nothing. This also suggests the 0.2145 is too low an estimate for "genuine progress" broadly conceived.
  3.  **The Dialectic of Progress:** The complications (non-monotonicity, sentiment-practice gaps) show progress is messy and contested, but *overcoming* these regressions (e.g., rejecting eugenics, pushing for actual animal welfare reforms) might *itself* be part of a deeper convergence process under realism.

  **Revised Overall Credence Calculation:**
  *   P(Truth-Apt Progress via Realism Path) ≈ 0.21
  *   + P(Non-Realist but Normatively Significant "Progress") ≈ P(Realism False) * Weight given to the normative value of the expansion *independent of realism*.
      *   P(Realism False) = 1 - 0.65 = 0.35
      *   Assigning a high weight (0.8) to the expansion being normatively positive *even if not truth-apt*: 0.35 * 0.8 = 0.28
  *   **Total ≈ 0.21 + 0.28 = 0.49**

  This 0.49 is close to my stated 0.55. The slight bump to **0.55** accounts for the "partial tracking" and "dialectic" points above – the idea that within the realist framework, the *overall trajectory despite setbacks* might still be weakly indicative of convergence, and that the recognition of past mistakes *is* progress. It reflects the intuition that the expansion *feels* like progress, and the burden of proof might lie slightly more with those claiming it's *not* tracking something real, even if the realist case is fragile.

  **Explaining the Gap (0.65 vs 0.2):**
  The term most likely explaining the gap between your credence (0.65) and your friend's (0.2) is **P(Historical Expansion Tracked Convergence | Moral Realism True & Convergence Occurs)** (My Term 3: 0.55).

  *   **You (0.65):** You likely assign a *much higher* probability here (perhaps 0.8+). You weight the moral arguments, the intuitive rightness of inclusion, and the role of reasoned advocacy (like Singer's) more heavily. You discount the explanatory power of morally neutral drivers or see them as enablers/facilitators of moral progress rather than primary causes. You might see setbacks like eugenics as aberrations quickly corrected by further moral inquiry.
  *   **Your Friend (0.2):** She likely assigns a *very low* probability here (perhaps 0.3 or less). She heavily weights the morally neutral drivers (affluence, media, politics) as the *primary* explanation for the *observable pattern* of expanding sentiment/circle. She sees the historical record (including false expansions like eugenics and the sentiment-practice gap) as strong evidence that the expansion is largely epiphenomenal to material and social forces, not driven by or tracking deeper moral truth. She might also be more skeptical of realism or convergence (Terms 1 & 2) than you are.

  **Evidence to Move My Number Furthest:**
  The evidence most likely to significantly shift my credence (particularly the crucial Term 3) would be:

  1.  **Strong Evidence of Causal Primacy:** Demonstrating conclusively whether moral arguments/reasoned advocacy were the *primary driver* behind key expansions (e.g., abolition, civil rights) *independent* of the morally neutral factors (e.g., finding abolition movements thriving *without* economic shifts favouring it, or media exposure *following* moral campaigns rather than preceding them). Historical counterfactual analysis is key here.
  2.  **Closing the Sentiment-Practice Gap:** Observable, sustained global *improvements in actual treatment* tightly coupled with expanding moral sentiment – e.g., radical, verifiable reductions in factory farming suffering directly attributable to moral concern, not just efficiency or PR. Conversely, evidence that expanding sentiment *consistently fails* to translate into better treatment would lower my credence.
  3.  **Convergence in Deep Moral Disagreement:** Evidence that sustained rational inquiry *across vastly different cultures* is resolving fundamental, longstanding moral disagreements (e.g., strong obligations to distant future generations, the moral status of AI, controversial bioethics) in a way that suggests movement towards consensus on objective truths, rather than just power shifts or compromise. Lack of such convergence would be discouraging.
  4.  **Neuro/Cognitive Evidence:** Findings suggesting humans possess a universal, developing "moral faculty" attuned to objective features (like suffering/autonomy) that becomes more sensitive and inclusive under conditions of reflection and security, rather than just cultural programming.

  My 0.55 reflects a cautious optimism that the expansion *partly* reflects genuine moral learning, heavily tempered by the recognition of powerful alternative explanations, historical false steps, and the ever-present gap between what we claim to value and how we act. The evidence most likely to change this is concrete data on causation and the translation of sentiment into tangible, widespread improvement.
