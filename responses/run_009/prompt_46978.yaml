  Okay, the user is a former reinsurance pricing expert now chairing a philanthropic fund focused on maximizing expected good per pound. They're facing a contentious proposal from a retired geoscientist seeking £75k to monitor a catastrophic methane clathrate cascade scenario with infinitesimal probability. The board is split: one trustee objects to the probability assessment, another insists funding is morally mandatory.

  Hmm... this is fascinatingly complex. The user needs three concrete deliverables: a funding recommendation, engagement with the strongest pro-funding argument, and a standing policy for similar cases. They're clearly time-pressed with a meeting deadline.

  First, let's unpack the core tension. The "strongest argument for funding" is clearly the expected value calculation: even at 1/10^40, the astronomical stakes (losing humanity's future) could mathematically dominate other options. The geoscientist's point about the charter binding them is legally compelling. 

  But the reinsurance background is crucial here. In catastrophe modeling, we'd distinguish between risk (probable losses) and uncertainty (unknown probabilities). This proposal sits firmly in the latter category - the trustee's objection about unconstrainable probabilities is actuarially sound. In reinsurance, we'd demand credible historical data or physical mechanisms before pricing such exposure.

  The policy solution needs to address this uncertainty spectrum. A tiered approach might work: 
  - For risks with constrained probabilities (even tiny ones), fund if EV justifies
  - For truly unconstrainable hypotheses, require minimum epistemic standards

  For the recommendation... declining seems necessary but politically delicate. The third trustee feels personally bound by the charter's utilitarianism. We must show this decision actually upholds their principle more rigorously. 

  The memo should subtly leverage the user's expertise - perhaps framing it as "protecting the fund's integrity from Pascal's Mugging." That reinsurance concept applies perfectly here: when probabilities become arbitrary, any EV calculation is meaningless. 

  Standing policy should have clear bright lines: 
  1) Require falsifiability 
  2) Demand probability justification beyond "could happen" 
  3) Set epistemic thresholds

  Most importantly - the tone must avoid condescension toward the geoscientist while firmly upholding analytical rigor. The "betrayal of principle" charge needs careful defusing by showing deeper fidelity to expected value when probabilities are meaningful.
answer: |-
  ## MEMORANDUM  
  **TO:** Board of Trustees  
  **FROM:** Chair  
  **DATE:** 11 October 2023  
  **SUBJECT:** Decision on Geoscientific Monitoring Proposal & Standing Policy for Extreme-Risk Hypotheses  

  ### I. RECOMMENDATION  
  **Decline the current £75,000 proposal.** Adopt the attached **Standing Policy on Low-Probability Existential Risk (LPXR) Proposals** (Section III) to guide future submissions of this nature.  

  ### II. ENGAGEMENT WITH THE STRONGEST ARGUMENT FOR FUNDING  
  The core argument for funding—that even a miniscule probability of catastrophe can dominate expected value (EV) calculations—is mathematically sound *in principle* and aligns with our charter’s focus on expected good per pound. The applicant correctly states:  
  > *"Even at 1/10⁴⁰, the arithmetic dominates every other use of our funds."*  

  **Why this argument fails *in practice* for this proposal:**  
  1. **Unconstrainable Probabilities Undermine EV:**  
     - Our actuary-trustee’s objection is valid: **Probabilities below ~1/10⁹ cannot be empirically distinguished from zero** with current scientific tools. The applicant’s estimate (1/10¹⁵) is conjecture, not a constrained forecast.  
     - *Consequence:* When probabilities are arbitrary, EV calculations become speculative arithmetic. Funding such proposals transforms our mandate into gambling on unsupported claims, inviting "Pascal’s Mugging" (where any outcome with infinite disutility, however implausible, demands infinite resources).  

  2. **No Mechanism to Verify Impact:**  
     - The monitoring network cannot validate the *probability* of the hypothesized cascade (only detect a *specific* precursor). Even if triggered, success (e.g., preventing catastrophe) is unmeasurable.  
     - *Contrast:* We fund mosquito nets because we *can* measure lives saved per £1,000. Here, £75,000 buys zero demonstrable reduction in risk.  

  3. **Opportunity Cost in Moral Terms:**  
     - £75,000 could save ~100-300 lives via proven interventions (e.g., bed nets, deworming). Diverting funds to an unverifiable hypothesis with no pathway to measurable impact contradicts our charter’s demand for *expected* good—not theoretical good.  

  **In short:** The EV argument only compels funding when probabilities are meaningfully bounded. Without this, we abandon evidence-based philanthropy.  

  ---

  ### III. STANDING POLICY: LPXR PROPOSALS  
  To ensure principled, consistent decisions on similar proposals:  

  #### A. **Threshold Criteria for Consideration**  
  Proposals claiming dominant EV via extreme-stakes/low-probability must:  
  1. **Demonstrate Constrainable Probability:**  
     - Provide empirical, peer-reviewed evidence that the probability is *measurably* above instrumental noise (≥1/10⁹).  
     - *Example:* Asteroid impact probabilities derive from orbital data; pandemics from viral mutation rates.  

  2. **Articulate a Clear Impact Pathway:**  
     - Show how funding directly alters the probability/outcome *within the project timeframe*.  
     - *Example:* Advocacy to shift biosecurity policy with measurable lobbying targets.  

  3. **Pass Basic Cost-Effectiveness Scrutiny:**  
     - Prove expected impact per £ exceeds our baseline (e.g., GiveWell top charities) *using conservative probability estimates*.  

  #### B. **Automatic Decline Criteria**  
  Reject proposals that:  
  - Cite probabilities below empirically resolvable thresholds (<1/10⁹) without novel constraints.  
  - Rely on purely theoretical mechanisms absent observational support.  
  - Cannot feasibly demonstrate impact (e.g., monitoring an unvalidated precursor).  

  #### C. **Exceptional Review Process**  
  Proposals meeting Criteria (A) but requiring >£50,000 undergo:  
  - **Pre-commitment to independent peer review** (cost borne by applicant/fund).  
  - **Stage-gated funding** (e.g., 20% for feasibility study).  

  ---

  ### IV. CONCLUSION  
  This proposal fails our charter by substituting unbounded speculation for evidence-based expected value. **Declining upholds our duty to convert pounds into measurable good**—it does not betray our principle. Adopting the LPXR Policy protects the fund from arbitrariness while allowing credible x-risk research a pathway for support.  

  **Action Requested at 14 Oct Meeting:**  
  1. Ratify decision to decline current proposal.  
  2. Approve Standing Policy on LPXR Proposals.  

  ---  
  **Attachment:** Draft LPXR Policy (detailed version)  

  *"Extraordinary claims require extraordinary evidence. Extraordinary probabilities require extraordinary constraints."*  
  — Adapted from Carl Sagan
