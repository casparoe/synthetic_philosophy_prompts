answer: |-
  Here's a concise 6-question quiz focusing on key axiomatic fault lines, designed for ~400 words total:

  **The "Which Bargaining Solution Do You Endorse?" Quiz**

  For each scenario, assume two rational players bargain over how to split a surplus fairly. The *disagreement point* (what they get if no deal is made) is given. Answer based solely on your intuition of fairness.

  1.  **Deleted Option:** Players A and B can split $100. Disagreement: ($0, $0). Normally, you think ($50, $50) is fair. You later learn a third, *worse* option (like ($40, $30)) was *also* possible but removed before bargaining. Should knowing this change the fair split? (Yes/No)
  2.  **Improved BATNA:** Players A and B can split $100. Disagreement: ($0, $0). Normally, ($50, $50) seems fair. Now, Player A's *best possible outcome if they played perfectly alone* improves from $10 to $30 (disagreement stays $0). Should Player A get *more* than $50 now? (Yes/No)
  3.  **Unequal Disagreement:** Players A and B can split $100. Disagreement: A gets $60, B gets $10. Does "fairness" mean they get equal *gains* above their disagreement points? (e.g., A: $60 + $X, B: $10 + $X). (Yes/No)
  4.  **Symmetric Expansion:** Players A and B can split $100. Disagreement: ($0, $0). ($50, $50) seems fair. Now, the *set of possible deals expands equally*, adding options like ($60, $60) and ($70, $70). Should the fair split *change* from ($50, $50)? (Yes/No)
  5.  **Worse Alternative:** Players A and B can choose ($80, $40) or ($70, $50). Disagreement: ($0, $0). Everyone agrees ($80, $40) is better overall. But should the *existence* of the worse ($70, $50) option influence what split is considered fair? (Yes/No)
  6.  **Non-Linear Value:** Players A and B split a good (e.g., chores, unique items). Disagreement: (Low Value, Low Value). Player A values each unit *much more* than Player B. Should "fairness" prioritize *equal physical splits* or *equal utility gains*? (Equal Split / Equal Gains)

  **Scoring Key:**

  *   **Mainly 1:No, 2:Yes, 3:No, 5:No** → Leans **Nash Bargaining Solution** (Values Independence of Irrelevant Alternatives (IIA)).
  *   **Mainly 1:Yes, 2:No, 3:No, 4:No** → Leans **Kalai-Smorodinsky Solution** (Values Monotonicity: Pay shouldn't decrease if potential max increases).
  *   **Mainly 3:Yes, 6:Equal Gains** → Leans **Egalitarian Solution** (Values equal utility gains above disagreement, regardless of other factors).
  *   **Strong "Yes" to 1, 5 or finds questions artificial/context-dependent** → Leans **Skeptical of Axiomatization** (Feels axioms smuggle in answers or miss context).
  *   **Mixed or Contradictory Patterns:** Your intuition might not align perfectly with one standard solution. Revisit the axioms!
  *   **Note on Overlap:** Questions 4 and 5 are especially prone to **Nash & Kalai-Smorodinsky agreement**, particularly in symmetric cases like Q4. If you answered 4:No and 5:No, it fits *both* Nash and Kalai-Smorodinsky. The key fault lines are Q1 (IIA) and Q2 (Monotonicity). Q3 is the main separator for Egalitarian. Q6 reinforces it.
