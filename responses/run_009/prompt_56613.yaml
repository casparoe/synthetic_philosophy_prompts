answer: |-
  Your diagnosis is sharp—the planet/weed analogy *does* illuminate the core structural disagreement. Here's why it captures the impasse, why it's substantive rather than merely verbal, and what might constitute progress:

  ### 1. **Your Framing Hits the Target**
     - **"Planet" Model (Ameliorative):** Treats "woman" as a **technical/political term** where experts (feminist theorists) can refine the definition for specific goals (fighting oppression). Like astronomers redefining "planet," they see this as *conceptual engineering*: improving a tool for a purpose. The legitimacy comes from the political project, not linguistic intuition.
     - **"Weed" Model (Descriptive):** Treats "woman" as a **folk category** rooted in lived experience, biology, and social practice. Attempts to redefine it feel like changing the subject because the term's meaning is anchored in communal use, not theoretical utility. Like "weed," it's evaluative ("weed" = unwanted plant; "woman" = complex social identity), so imposing a definition ignores its embeddedness.

  **This isn’t just relocating the dispute—it reveals the foundational clash: Is "woman" *primarily* a tool for political change or a lived social identity?**

  ### 2. **Why It’s Substantive, Not Verbal**
     Both sides agree on the *arguments* but disagree on **meta-semantic priorities**:
     - **Ameliorativists prioritize *function*:** A definition must *do work* (expose oppression). If ordinary usage obscures oppression, usage should yield.
     - **Descriptivists prioritize *grounding*:** A definition must *track actual use* to be about "women." If it diverges radically, it's a new concept.
     
     This reflects deeper divides:
     - **Authority:** Who "owns" the term? Speakers? Theorists? Marginalized groups?
     - **Ontology:** Is "woman" a *natural kind* (biology), *social kind* (performance/role), or *political kind* (position in hierarchy)?  
     *(Your "natural/social kind" question is spot-on—this lurks beneath.)*

  ### 3. **Diagnosis of the Impasse**
     - **You're answering different questions:**
       - Ameliorativists: **"What *should* 'woman' mean to advance justice?"** (Normative/political project)
       - Descriptivists: **"What *does* 'woman' mean in our linguistic community?"** (Descriptive/semantic project)
     - **Test cases fail** because each side interprets them through their lens:
       - *Example:* A person who identifies as a woman, faces no oppression, and has no "female-typed" features.
         - Ameliorativist: "She's not a woman *politically*; the term must highlight subordination."
         - Descriptivist: "She's clearly a woman *socially*; your definition excludes real people."
     - **No shared success criteria:** Haslanger’s definition "succeeds" if it aids feminist theory; descriptivists demand fit with intuition.

  ### 4. **Paths to Progress (or Acceptance of Deadlock)**
     Instead of rehashing arguments, try these:

     - **Reframe as "Two Projects, Not One":** Explicitly distinguish:
       - **Conceptual Ethics** (Ameliorative): *Should we revise "woman" for political goals?*
       - **Descriptive Semantics** (Descriptive): *How is "woman" actually used?*
       This avoids talking past each other by acknowledging both are valid but distinct inquiries.

     - **The "What's at Stake?" Test:** Ask: *If your opponents won, what real-world harm would follow?*
       - Descriptivists fear **erasure** (e.g., non-oppressed women excluded from identity).
       - Ameliorativists fear **obscuring oppression** (e.g., treating "woman" as identity without material hierarchy).
       Mapping harms clarifies why compromise feels dangerous.

     - **The Boundary Object Experiment:** Treat "woman" as a **boundary object** (a concept flexible enough to serve multiple groups). Example questions:
       - Can the *same term* serve descriptive and ameliorative purposes in different contexts?  
       *(e.g., "woman" in medical settings vs. protest marches)*
       - Does insisting on *one definition* itself cause political/semantic harm?

     - **Accept Deadlock (If Needed):** Some divides reflect **irreconcilable values**. If progress stalls, name it: *"We disagree on whether language serves politics or reflects lived reality. That’s okay—but let’s explore other topics."*  
     (Some philosophical disputes *are* stalemates; recognizing that is its own insight.)

  ### Why Your Group is Stuck (in a Nutshell)
  You’re having **two different conversations** under one banner. The ameliorativists are doing *normative conceptual engineering*; the descriptivists are doing *descriptive semantics*. Neither can "win" because their goals and standards of success are misaligned—like arguing whether a hammer is "good" based on its weight (carpenter) or its conductivity (electrician). Your planet/weed analogy works because Pluto’s demotion was a *scientific decision* (like engineering a term), while "weed" resists redefinition because its meaning is *experiential* (like a folk category). 

  **Genuine progress lies in mapping the disconnect—not resolving it.**
