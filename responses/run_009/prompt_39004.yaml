  In Section 3 ("Genealogy or deflation"), Darwin is explaining the origin of moral feelings (genealogy), not eliminating their reality. He treats the moral sense as a real psychological phenomenon shaped by evolution. His value-laden language ("noble") shows he's not reducing morality to biology dismissively. The expansion problem is addressed by his view that reason and sympathy extend the instinct's application without replacing its core mechanism.

  For Section 4 ("The bill"), the charitable reading requires accepting that Darwin's value judgments are expressions of the very evolved moral sense he describes. We must also buy that expanded morality uses the same psychological machinery repurposed by reason. His language isn't careless but consistent with seeing morality as both real and natural.

