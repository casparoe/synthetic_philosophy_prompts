answer: |-
  What you're describing is a remarkably persistent deadlock—one that cuts to the core of how evolutionary explanations are framed, justified, and contested when applied to humans. Your hunch about default assumptions and burden of proof is astute, but the full diagnosis requires unpacking layers. Below is a no-BS assessment grounded in the current state of the field, distinguishing settled points from live fractures. I’ll end with the prognosis you requested.

  ### The Core of the Disagreement: It’s Epistemic, Not (Primarily) Empirical
  1. **Burden of Proof and Default Stance**  
     This is the central fault line. Evolutionary psychology (EvPsych) often operates with a *presumption of adaptation*: if a trait is universal or near-universal in humans, and plausibly affects fitness, adaptation is the default hypothesis to test. Critics (e.g., Laland, Bolhuis, Richardson) argue this flips proper scientific caution: the null should be that a trait *isn’t* an adaptation until proven otherwise, especially given alternatives (exaptation, developmental constraint, drift, cultural evolution).  
     - **Why this persists**: EvPsych defenders (e.g., Tooby, Cosmides, Buss) contend that demanding "proof" before investigating adaptation stifles discovery—pointing out that no one asks for this level of evidence when studying, say, finch beaks. Critics counter that human behaviors are uniquely entangled with culture/history, making adaptive inferences far harder to isolate.  

  2. **The "Environment of Evolutionary Adaptedness" (EEA) Problem**  
     - **Settled**: The EEA is *not* a specific time/place but a statistical composite of selective pressures. No serious EvPsych researcher today defends a monolithic "Pleistocene savanna" stereotype.  
     - **Contested**: Whether the EEA concept is **testable**. Critics argue that without concrete paleo-environmental data, EvPsych can "reverse-engineer" any trait by positing *some* selective pressure. Defenders point to cross-cultural universals and converging evidence (e.g., from genetics or neuroscience) as constraints.  

  3. **Falsifiability and "Just-So Stories"**  
     Both sides agree that *bad* adaptive storytelling exists. The fight is over:  
     - Whether EvPsych *as a field* has adequate safeguards (e.g., rigorous universality criteria, mismatch theory, neural/developmental tests).  
     - Whether critics dismiss *all* adaptive hypotheses as unfalsifiable when many *are* testable (e.g., fitness consequences in traditional societies, comparative primatology).  
     - **The real divide**: Critics see EvPsych's standards as too lax; defenders see critics' demands as unrealistic, arguing that historical sciences *always* infer past causes from present data.  

  ### Genuine Empirical Consensus vs. Contested Ground
  - **Settled**:  
    - Natural selection has shaped *some* human behavioral tendencies (e.g., infant attachment, taste aversions, certain fear responses).  
    - Many human traits are *not* adaptations (e.g., spandrels like male nipples; cultural byproducts like music).  
    - Genetic constraints and developmental processes matter profoundly.  

  - **Contested**:  
    - **How much** of human behavior reflects specific adaptations versus exaptations, cultural evolution, or plasticity. *No consensus exists*.  
    - Whether complex traits (e.g., religion, rape, art) can be meaningfully explained as adaptations. Here, even definitions clash (e.g., is "rape adaptation" a claim about specific cognitive modules or a byproduct of other drives?).  
    - The role of gene-culture coevolution. EvPsych often sidelines this; critics see it as central.  

  ### Is This Dispute Stuck? Yes, and Here’s Why
  1. **Asymmetrical Stakes**:  
     - When EvPsych makes claims about human nature (e.g., sex differences, aggression), it spills into politics, ethics, and identity. Critics fear harmful misuse; defenders feel unfairly censored. This isn't just academic—it's existential.  
     - Compare: Your lizard morphology work never faced this scrutiny. No one worries that an incorrect adaptive tale about *Anolis* dewlaps will justify social oppression.  

  2. **Methodological Gridlock**:  
     - EvPsych’s strongest tools (e.g., cross-cultural studies, twin designs) can identify universals but struggle to *prove* evolutionary origins.  
     - Paleoanthropology/genomics *could* help but face limits: behavior doesn’t fossilize, and ancient DNA rarely resolves cognitive traits.  
     - The field lacks a "smoking gun" method (like experimental evolution in microbes) to test hypotheses directly.  

  3. **Tribal Dynamics**:  
     - Positions hardened decades ago. Critics often engage with EvPsych’s weakest popularizers (e.g., debunking "Stone Age brain" clichés); defenders dismiss critics as "blank slaters" (a misrepresentation, but rhetorically potent).  
     - Incentives to compromise are low. Careers are built on defending or attacking the paradigm.  

  ### Could Anything Move the Needle? Conditional Possibilities
  - **If EvPsych embraced stronger null models**: E.g., computational simulations showing how drift/constraints could produce a trait *without* selection. Some researchers (e.g., Machery) push this, but it’s niche.  
  - **If genomics delivered**: Discovering a "smoking gun" selected allele linked to a cognitive trait *and* its fitness benefits in ancient environments. Plausible for simple traits (e.g., lactase persistence), unlikely for complex behaviors.  
  - **If cultural evolution frameworks integrated**: Models showing how traits can spread without genetic adaptation (e.g., via cultural group selection) *might* force détente—but only if EvPsych abandons pan-adaptationism.  
  - **A methodological pact**: E.g., agreeing that adaptive claims require:  
     (a) Cross-cultural universality +  
     (b) Evidence of heritability +  
     (c) A *falsifiable* EEA-linked mechanism +  
     (d) Ruling out developmental/cultural alternatives.  
     No such pact exists, and enforcement would be contentious.  

  ### Bottom Line
  **Your hunch is correct**: The core conflict is about epistemic norms, not a shortage of data. Defenders see adaptationist heuristics as productive; critics see them as license for storytelling. The empirical overlap is thin because the sides prioritize different questions—EvPsych asks "How might this be adaptive?", critics ask "Must it be adaptive?".**

  **Prognosis**: Barring a seismic methodological breakthrough (unlikely), expect the same fight in 2070. The triggers—human exceptionalism, political stakes, and the allure of origin stories—are permanent. The best hope is incremental refinement at the edges (e.g., better integration with neuroscience), but the central divide is entrenched. As a veteran of the trenches, you’ve earned the right to view it with clear-eyed fatigue. Some debates aren’t resolved; they’re outlived.
