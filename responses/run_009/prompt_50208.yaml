  Starting with the physical grounding. Sentience probably depends on neural complexity. Brains aren't binary; they evolve gradually. Even simple organisms have partial signaling. So maybe 0.7 for graded physical basis. But I'm not entirely sure—maybe there's an emergent threshold. 

  Next, should moral status map linearly? Here's a problem: half a nociceptor isn't half a pain. Moral relevance might need a minimum capacity before it counts. Like, a thermostat can't suffer. So even if the physical is graded, the moral might jump. I'll go with 0.4 here. 

  Then epistemic uncertainty. We might misjudge where sentience starts because we can't measure it directly. That could make a binary system appear gradual. But I think the real gradient is stronger evidence, so maybe 0.3 weight here. 

  Combining these: (0.7 * 0.4 * (1-0.3)) wait, no, better to average with adjustments. Weighted average gives around 0.45. Then adjusting for epistemic factor—say, 0.45 * 0.7 + 0.3 * 0.3 ≈ 0.4. So overall 0.40. 

  The term I'm least confident in is the mapping from physical to moral. It's tricky—philosophical and subjective. What would change it? Empirical pain studies, like if we find a clear neural correlate for subjective experience that only appears fully formed. 

  Bonus question: if forced to pick a cliff, probably between nematodes and honeybees. Honeybees show learning, social behavior—maybe the simplest "someone." But placing it there feels arbitrary, which pulls my overall credence toward gradualism. The housemate's point about the question being poorly framed makes sense—it might be forcing a binary on a spectrum. 

