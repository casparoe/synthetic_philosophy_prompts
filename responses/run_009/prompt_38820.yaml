  Another potential tension: (5) says that immortality would become intolerable. But if death is bad because it deprives her of future goods, then why not live until the point where life becomes intolerable? And then die? That would avoid the tedium. So (5) doesn't conflict with (1) because (1) only says that death is bad when it deprives one of goods. If one lives until life is no longer good, then death isn't bad (by (1)). So she isn't advocating for immortality. Hence, no conflict.

