answer: |-
  Here's the menu of interpretations for "If you don't vote, you can't complain," with verdicts:

  1.  **Conversational Fair Play Norm:** Voting grants conversational standing to critique outcomes.
      *   *Plausible?* Yes (common social expectation).
      *   *Survives insignificance?* Yes (it's about participation, not causation).
      *   *Distinguishes abstention types?* **No.** Dismisses complaints equally whether abstention was principled or apathetic. Fails the user's case.

  2.  **Strict Causal Responsibility:** Complaining requires having had a causal chance to affect the outcome.
      *   *Plausible?* Initially intuitive.
      *   *Survives insignificance?* **No.** *Neither* voters nor abstainers were causally decisive. This reading invalidates complaint rights for *everyone*.

  3.  **Free-Rider Principle:** Voting is a cooperative burden; abstainers shirk while enjoying the system's benefits, forfeiting complaint rights.
      *   *Plausible?* Yes (if voting is a duty).
      *   *Survives insignificance?* Yes (burden doesn't require decisiveness).
      *   *Distinguishes abstention types?* **Weakly.** It *might* excuse principled abstainers rejecting the "scheme" (like the user), but typically lumps all abstainers together as free-riders.

  4.  **Expressive/Solidarity Principle:** Voting expresses civic commitment or group solidarity, granting moral standing regardless of effect.
      *   *Plausible?* Yes (voting has symbolic/expressive value).
      *   *Survives insignificance?* Yes (value isn't causal).
      *   *Distinguishes abstention types?* **No.** Focuses solely on the act of voting/non-voting, not the *reason* for abstention. Dismisses the user's principled stance.

  5.  **Quasi-Consent Principle:** Casting a ballot signifies acceptance of the electoral process and its outcome.
      *   *Plausible?* Questionable (ballots aren't explicit consent contracts).
      *   *Survives insignificance?* Yes (consent ritual, not causation).
      *   *Distinguishes abstention types?* **No.** Abstention = non-consent, barring complaint equally. Ignores the user's deliberate rejection of endorsement.

  **Epistemic Note:** Some argue an *epistemic duty to abstain* exists if one is genuinely uninformed, to avoid muddying the signal. Under fairness/causal readings, this *informed* abstainer might have *more* standing to complain than the uninformed voter, flipping the proverb. However, the proverb itself rarely incorporates this nuance.
