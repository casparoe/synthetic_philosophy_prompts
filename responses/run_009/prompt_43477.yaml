  Notably, the user dismisses randomization as circular - that's astute. I'll concede that point while showing why philosophers still care: it tests the limits of rationality frameworks. The real divide is between those who want decision theory to cover all cases (hence inventing tie-breakers) and those who see indifference as a theoretical dead end. 

