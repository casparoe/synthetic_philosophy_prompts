prompt: |-
  I'm a PhD student in philosophy working at the intersection of decision theory and formal epistemology, and I'm planning a dissertation chapter on whether coherence arguments actually succeed in showing that rational agents must maximize expected utility. Before I criticize particular versions, I want to be clearer than I currently am about what success would even amount to. Write me the desiderata: the requirements any adequate coherence argument would have to meet if it is to license the normative conclusion that a rational agent's preferences must conform to expected utility theory.

  By coherence argument I mean the whole family: synchronic and diachronic Dutch book arguments, money pump arguments, and representation theorems in the style of Savage and of von Neumann and Morgenstern — arguments that try to extract the full expected-utility structure from something more primitive, such as the requirement not to be exploitable, or the bare requirement that preferences admit of a representation at all.

  The desiderata I can formulate for myself include, at least: that the argument derive probabilities, utilities, and the maximization rule from premises that are independently more plausible than the conclusion, so that it does not simply restate the independence axiom in diachronic dress; that it be explicit about the modality of the exploitation claim — exploitable by whom, under what market and trading structure, and at what cost to the exploitee; that it say something about agents who are money-pumped but end up no worse off, or worse off only by the lights of the very preferences that generated the cycle; that it confront the reinterpretation problem, since a representation theorem seems at best to tell us how to read an agent's preferences as probability-and-utility talk, not how the agent is to choose among them; and that it take seriously agents with incomplete or context-dependent preferences, since completeness and partition invariance look like idealizations rather than norms.

  Extend and correct that list. For each desideratum, give the motivating case — the agent, scenario, or theorem that puts pressure on arguments lacking it. Mark which requirements are non-negotiable for reaching the normative conclusion and which a defender could waive as harmless idealization. Flag any pair of desiderata you suspect cannot be jointly satisfied; if a subset is jointly unsatisfiable, say so, since then the list itself is the interesting result. Finally, tell me which single requirement does the most to exclude the arguments actually on offer. That last part is what I most want, because my hunch is that no version of the argument both satisfies the primitive-premises requirement and covers agents with ordinary attitudes to risk — but I would like to know whether that hump is real or an artifact of the requirements I am imposing.

  If useful, close with a brief pass at how the main families — Dutch book, money pump, representation theorem — fare against the list. But keep the weight on the criteria and their motivating cases; the scoring I can do myself once the spec is settled.
reasoning: |-
  Okay, let me tackle this query from a PhD student in philosophy. They're working on decision theory and formal epistemology, specifically focusing on coherence arguments for expected utility theory. They need a clear set of desiderata to evaluate these arguments. 

  First, I need to understand their current list. They mentioned several key points: deriving probabilities and utilities from plausible premises, explicating the modality of exploitation, handling agents who aren't worse off after being pumped, addressing the reinterpretation problem, and accounting for incomplete preferences. I should expand this systematically.

  Starting with foundational requirements. The argument must derive all components of EU theory—probabilities, utilities, and maximization—from genuinely primitive premises. Independence axioms in disguise won't cut it. The Allais paradox is a classic case exposing this issue. Without meeting this, the argument begs the question.

  Next, normative force. How does the argument move from "you can be exploited" to "you're irrational"? The money pump scenario where the agent ends up fine despite cycling preferences challenges this. The exploiter's existence isn't enough; we need to show why vulnerability itself is irrational.

  Then there's modality specification. Dutch books assume frictionless markets, but real agents face transaction costs. If pumping costs more than the loss, it's not a true vulnerability. Arguments must clarify the market structure and costs involved.

  The reinterpretation problem is crucial. Representation theorems show that coherent preferences can be modeled with EU, but not that agents must use EU reasoning. An agent with context-dependent preferences might satisfy the axioms situationally but violate them globally. This gap between representation and prescription needs bridging.

  Completeness and context-dependence are major sticking points. Real agents have incomplete preferences (Buridan cases) or partition-dependent probabilities (Ellsberg paradox). Arguments demanding completeness as a norm seem unrealistic. Idealizing here might be necessary but weakens normative force.

  Now, possible conflicts. The most glaring one is between primitive premises and accommodating risk attitudes. EU theory struggles with risk-averse preferences that violate independence, like in Allais. If we relax axioms to allow this, can we still derive EU maximization? Probably not—this might be why no argument satisfies both.

  I recall that Dutch books handle synchronic coherence but fail diachronically with changing beliefs. Money pumps address dynamic inconsistency but assume no foresight. Representation theorems rely heavily on structural axioms that may not be normatively compelling.

  The biggest hurdle seems to be the primitive premises vs. risk attitudes conflict. If we want to include ordinary risk aversion, we likely need weaker axioms that don't imply EU. This might explain why existing arguments feel unsatisfying—they either assume too much or exclude common behaviors.

  For the scoring recap: Dutch books fail on dynamics and reinterpretation; money pumps struggle with costs and foresight; representation theorems are descriptive but lack normative force. The primitive premises requirement does the most damage across the board.

  This framework should help the student systematically dismantle existing arguments. The key insight is that accommodating real-world preferences while maintaining normative force might be impossible within strict EU theory.
answer: |-
  Here's a structured set of desiderata for evaluating coherence arguments for Expected Utility (EU) maximization, building on your list, incorporating motivating cases, assessing negotiability, flagging tensions, and identifying the most exclusionary requirement. The goal is to specify what "success" entails for deriving the *normative* force of EU theory.

  ### Core Desiderata

  1.  **Non-Circularity / Primitive Premises:**
      *   **Requirement:** Must derive probabilities, utilities, *and* the EU maximization rule from premises demonstrably more plausible/normatively basic than EU theory itself. Premises must not implicitly *assume* separability, independence, or probabilistic sophistication.
      *   **Motivating Case:** The **Allais Paradox** agent. Their preferences violate Independence but seem rational under a plausible aversion to uncertainty about large losses. An argument that simply assumes Independence (or a diachronic equivalent disguised as "dynamic consistency" or "no foreseen regret") begs the question against this agent. (See also: Ellsberg Paradox for probabilities).
      *   **Negotiability:** **Non-negotiable.** Failure here renders the argument normatively inert for justifying EU *over* plausible alternatives.
      *   **Pressure Point:** Most Dutch Books & Money Pumps implicitly rely on separability/independence. Representation Theorems often explicitly include Independence as an axiom.

  2.  **Normative Force of Exploitability:**
      *   **Requirement:** Must convincingly explain *why* being exploitable (via Dutch Books, Money Pumps, etc.) constitutes *irrationality*, not merely misfortune, bad luck, or a peculiarity of the market setup. Must bridge the gap between "vulnerable to a sure loss" and "violates a constitutive norm of rationality."
      *   **Motivating Case:** The **Resolute Money-Pumped Agent.** An agent cycles through preferences (A>B, B>C, C>A), gets pumped from A to C via B, paying small fees, but genuinely prefers C to A *at the end* and feels no regret. By their *final* preferences, they paid to get something better. Why is this irrational?
      *   **Negotiability:** **Non-negotiable.** This is the core justificatory burden. Arguments relying solely on "avoiding sure loss" need to show why that loss matters *rationally*.
      *   **Pressure Point:** Dutch Books/Money Pumps often stop at demonstrating vulnerability without adequately justifying why vulnerability *per se* is irrational, especially if the agent ends up content.

  3.  **Modality Specification:**
      *   **Requirement:** Must explicitly specify the conditions under which exploitation is presumed possible/practically relevant: exploiter's knowledge, market structure (frictionless? presence of other traders?), transaction costs, agent's foresight, commitment abilities, re-trading opportunities, and the nature of the "sure loss" (monetary? utility?).
      *   **Motivating Case 1:** **Costly Exploitation.** Exploiting a slight preference cycle might require transaction costs exceeding the exploiter's potential gain or the agent's net loss. Is vulnerability under *these* conditions irrational? **Motivating Case 2:** **The Foresighted Agent.** An agent aware of their dynamic inconsistency might pre-commit, use binding contracts, or simply avoid the exploitable sequence. Does vulnerability *only* under conditions where the agent lacks foresight/commitment mechanisms imply irrationality?
      *   **Negotiability:** **Partially Negotiable.** Some idealization (e.g., frictionless markets, omniscient exploiter) might be acceptable *if* the normative core (Desideratum 2) is strong. However, the argument must be clear about its idealized assumptions and their impact on normative relevance.
      *   **Pressure Point:** Naive Money Pump arguments often assume zero friction and a myopic agent. Real-world applicability is weakened if exploitation requires highly specific, unrealistic conditions.

  4.  **Reinterpretation Gap (Prescription vs. Representation):**
      *   **Requirement:** Must bridge the gap between demonstrating that preferences *can be represented* by a probability-utility pair satisfying EU and demonstrating that the agent *should use* that probability-utility pair *to make choices*. Must show that the representation is not just descriptive but *prescriptively binding*.
      *   **Motivating Case:** **The Satisfying Agent.** An agent's preferences are complete, transitive, etc., satisfying a Representation Theorem. They choose based on gut feeling, heuristics, or a different weighting scheme, but their choices *happen* to align with an EU representation. Why *must* they consciously maximize EU? Why is aligning with the representation accidentally insufficient?
      *   **Negotiability:** **Non-negotiable.** Representation Theorems alone are descriptive, not normative. An argument relying on them needs an additional premise linking representation to rational choice *process*.
      *   **Pressure Point:** Pure Representation Theorems (Savage, vNM) struggle most here. Dutch Books/Money Pumps aim to provide this link via irrationality of exploitability.

  5.  **Accommodation of Incompleteness:**
      *   **Requirement:** Must not treat completeness (for all A, B: A>B or B>A or A~B) as a strict requirement of rationality. Must allow for genuinely unresolved or incomparable preferences without implying irrationality.
      *   **Motivating Case:** **Buridan's Ass / Hard Choices.** An agent genuinely cannot compare two complex job offers (A and B) involving incommensurable values (salary vs. location vs. meaning). They feel no preference, not even indifference. Forcing a choice doesn't imply a hidden complete ordering.
      *   **Negotiability:** **Negotiable as Idealization (But Costly).** Arguments can *stipulate* completeness for tractability, but this significantly weakens their claim to capture *essential* rationality and limits applicability. A truly robust argument would handle pervasive incompleteness.
      *   **Pressure Point:** Savage/vNM axioms include Completeness. Dutch Books often assume the agent will have *some* preference forcing a bet/acquisition.

  6.  **Accommodation of Context/Partition Dependence:**
      *   **Requirement:** Must not treat partition invariance (event/description independence) of probabilities or utilities as a strict requirement of rationality. Must allow that framing, context, or the granularity of description can rationally influence preferences without implying incoherence.
      *   **Motivating Case:** **Ellsberg Paradox / Framing Effects.** An agent prefers betting on known urn probabilities over unknown, or exhibits loss aversion where choices depend on the reference point (framing). Preferences shift based on how options are described or what possibilities are made salient, violating Independence or Sure-Thing principles in specific partitionings.
      *   **Negotiability:** **Negotiable as Idealization (But Very Costly).** Like incompleteness, stipulating context-independence is common but excludes vast swathes of empirically observed and arguably rational behavior (e.g., ambiguity aversion). Waiving this drastically shrinks the domain of "rational agents" the argument covers.
      *   **Pressure Point:** Savage's P2 (Sure-Thing Principle) is partition-invariance incarnate. Dutch Books for non-additivity rely on partition sensitivity for exploitation.

  7.  **Synchronic vs. Diachronic Coherence Integration:**
      *   **Requirement:** Must coherently integrate requirements for synchronic coherence (preferences at a single time) and diachronic coherence (preferences over time, belief updating). Must address whether diachronic requirements (e.g., no diachronic Dutch books, plan consistency) flow from synchronic norms plus rationality over time, or are independent norms.
      *   **Motivating Case:** **The Naive Updater / Changing Tastes.** An agent has coherent preferences at T1. They learn new evidence but update beliefs in a non-Bayesian way (e.g., conservatively), or their utilities genuinely change over time (e.g., acquired taste). Are they diachronically incoherent? If so, does this stem solely from their synchronic commitments at each time, or is a separate diachronic norm violated?
      *   **Negotiability:** **Partially Negotiable.** A strong argument could derive diachronic norms from synchronic norms plus minimal temporal rationality (e.g., no foreseeable regret/benefit from inconsistency). However, the connection must be made explicit.
      *   **Pressure Point:** Synchronic Dutch Books vs. Diachronic Dutch Books/Money Pumps. Representation Theorems are typically synchronic.

  ### Tensions Between Desiderata

  1.  **Non-Circularity (1) vs. Accommodating Risk Attitudes (via 6/Context):** **This is the core tension you identified.** Truly primitive premises (avoiding Independence/Sure-Thing) struggle to deliver full EU maximization, as the Allais and Ellsberg preferences demonstrate rational deviations *from* EU under those primitive premises (like stochastic dominance + transitivity). Accommodating these attitudes often requires weakening axioms, making it hard to derive *maximization* of an EU functional form. **Likely Jointly Unsatisfiable:** It's highly probable that no argument can derive *full* EU maximization (probabilities + utilities + independence) from premises significantly weaker than Independence *while* accommodating robust ambiguity aversion or Allais-type preferences *as rational*. Arguments satisfying (1) may only deliver a weaker norm (e.g., stochastic dominance + transitivity), failing to mandate EU.
  2.  **Normative Force (2) vs. Costly Exploitation (3):** If exploitation is only possible under highly idealized, unrealistic conditions (e.g., zero transaction costs, perfectly patient exploiter), the claim that vulnerability *itself* constitutes irrationality weakens significantly. The less realistic the exploitability scenario, the harder it is to see vulnerability as a core rational flaw.
  3.  **Accommodating Incompleteness (5) & Context (6) vs. Deriving Full EU Structure (1):** EU maximization fundamentally requires completeness and context-independence (partition invariance) for the representation to be unique and the rule to be universally applicable. Relaxing these makes deriving the *full* EU structure impossible. Arguments aiming for full EU must treat (5) and (6) as idealizations, limiting their scope.

  ### The Most Exclusionary Requirement: Non-Circularity / Primitive Premises (1)

  *   **Why:** This requirement directly targets the justificatory *foundation*. Your hunch is correct: Existing arguments either:
      *   **Satisfy (1) but fail coverage (6):** Arguments based purely on stochastic dominance + transitivity avoid circularity but do *not* yield EU maximization; they allow Allais/Ellsberg preferences. They deliver weaker norms like avoiding dominated options.
      *   **Achieve coverage (6) but violate (1):** Savage/vNM representation theorems *deliver* full EU, but only by building Independence/Sure-Thing/Solvability/Archimedean axioms *into* the premises. Dutch Books/Money Pumps for additivity/independence often implicitly rely on these assumptions in their setup (e.g., requiring the agent to accept combinations of bets that force separability). They "derive" EU from premises that are essentially equivalent to it.
  *   **Result:** No argument successfully derives the *full, strong* normative conclusion (rational agents *must* maximize EU) from premises that are both significantly more primitive/plausible *and* allow the rational permissibility of the deviations observed in Allais, Ellsberg, or with incomplete preferences. The "hump" is real and central to the critique of coherence arguments for EU maximization.

  ### How Main Families Fare (Briefly)

  *   **Synchronic Dutch Books:**
      *   Pros: Directly tackles probabilistic coherence (additivity), clear exploitability structure.
      *   Cons: Struggles with (1) - additivity often derived via bets forcing separability; Ignores utilities/maximization rule; Weak on (2) - why is probabilistic incoherence irrational?; Fails (5), (6); Limited scope.
  *   **Diachronic Dutch Books / Money Pumps:**
      *   Pros: Addresses dynamic inconsistency, links synchronic preferences over time; Potentially stronger normative force via tangible loss.
      *   Cons: Often violate (1) - rely on diachronic separability/independence equivalents; Struggle with (2) - Resolute Agent; Highly sensitive to (3) - transaction costs, foresight; Fails (5), (6); "Exploitability" can be avoided by foresight/commitment.
  *   **Representation Theorems (vNM, Savage):**
      *   Pros: Mathematically elegant, derive full EU structure (P, U, max).
      *   Cons: Severely violate (1) - axioms *are* the EU requirements; Fail (4) - Representation ≠ Prescription; Explicitly violate (5), (6) via Completeness, P2/Independence; Provide no inherent story for (2) or (3).

  This framework provides the rigorous specification you need to systematically critique coherence arguments. The central tension between primitive premises and accommodating realistic risk attitudes (especially under uncertainty/ambiguity) appears to be the fundamental obstacle to justifying EU maximization as a universal norm of rationality via these arguments. Your dissertation chapter is well-positioned to expose this critical flaw.
