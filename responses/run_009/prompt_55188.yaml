  Based on your friend's track record and the inferred decision rule, here's a breakdown of predictions for the new cases, which aspects of the rule they highlight, and a case that would cleanly split alternative rules.

  ### Inferred Decision Rule
  Your friend's rule appears to be:  
  **"Outcomes are *convergent* if strongly constrained by physics, biology, or overwhelming evidence; *contingent* if driven by arbitrary early advantages with no functional superiority; and *split* if a broad category is inevitable but specific instances depend on historical accidents."**  
  This explains her track record:
  - **Physics/evidence forces convergence**: AC (physics), germ theory (evidence).
  - **Arbitrary lock-in implies contingency**: QWERTY, rail gauge, VHS, 60-minute hour.
  - **Broad necessity + specific accident = split**: English (a lingua franca is inevitable, but which one isn't), coinage (money is inevitable, but gold/silver isn't).

  The rule also considers:
  - **Lock-in timing**: Early competition with close alternatives → contingency (e.g., VHS vs. Betamax).
  - **Independent invention**: If something arises multiple times → convergence or split (e.g., coinage invented independently → money is convergent, material is contingent).

  ---

  ### Predictions for New Cases
  1. **Digital computers running on binary**  
     - **Prediction: *Convergent***.  
     - **Why**: Physics and practicality favor binary. Binary systems are simpler to implement in hardware (two states are easier to distinguish electronically, reducing noise/errors), energy-efficient, and align with Boolean logic. Ternary was elegant theoretically but less robust in practice—no historical ternary system scaled. Even with early competition, physics would steer the outcome to binary.  
     - **Fits the rule**: Hardware constraints (physics) dominate over lock-in or elegance.

  2. **Horse as the primary large riding/draft animal**  
     - **Prediction: *Convergent***.  
     - **Why**: Biology and utility favor horses. Horses are uniquely suited: they’re social, trainable, energy-efficient runners, and adaptable to diverse climates. Zebras are aggressive and stress-prone; onagers are smaller and slower. Domestication attempts failed for both. Even with a rerun, horses win due to biological advantages, not historical accident.  
     - **Fits the rule**: Biological constraints (temperament, physiology) override contingency.

  3. **Industrialization starting with coal and steam**  
     - **Prediction: *Convergent***.  
     - **Why**: Energetics and accessibility force coal/steam. Coal has unmatched energy density for early industrialization, and steam engines efficiently convert heat to mechanical work. Alternatives (e.g., water power) are location-limited; pre-electric internal combustion requires refined fuels that need industrial infrastructure. Physics and resource availability lock in coal/steam as the entry point.  
     - **Fits the rule**: Thermodynamics and resource constraints dictate the path.

  ---

  ### Which Case Splits Candidate Rules?  
  **None of these cases split the rules**—all align with the physics/evidence-driven convergence pattern. However, they reveal nuances:
  - **Binary case** emphasizes *robustness to lock-in*: Physics trumps early accidents (unlike VHS).
  - **Horse case** highlights *biological constraints* as analogous to physics (like AC vs. DC).
  - **Industrialization case** shows *resource economics* as a convergent force.

  To split the rules, we need a case where the obvious candidate rule ("physics/truth pin it down") clashes with alternatives like lock-in timing or independent invention. For example:

  ### Case That Splits Candidate Rules: **Paper vs. Parchment for Writing**  
  - **Why it splits rules**:  
    - **Physics/truth rule**: Suggests contingency. Paper (from pulped fibers) and parchment (from animal skin) are functionally similar for writing. No overwhelming physical advantage—both existed concurrently.  
    - **Lock-in/independent invention rule**: Suggests convergence. Paper was invented independently in China (200s BCE), Islamicate world (700s CE), and Europe (1100s CE), implying a convergent solution for lightweight, scalable writing material.  
  - **Predicted verdict**: *Split*.  
    - A paper-like material dominates (convergent due to independent invention and utility), but parchment or alternatives could persist in some runs (contingent on regional resources/culture).  
  - **Splits**:  
    - Rule 1 ("physics/truth") → contingent (no physical necessity).  
    - Rule 2 ("lock-in/independent invention") → convergent (repeated invention signals inevitability).  
    - Your friend’s rule → split (broad category inevitable, specific material contingent).

  This case forces a choice: is independent invention enough for convergence without physics? Her coinage verdict (split) suggests yes—so paper would fit her pattern. But a pure "physics/truth" rule would mispredict it as contingent.
