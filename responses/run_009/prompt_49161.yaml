  We are designing a decision procedure based on Scanlon's contractualism. The core idea is that an act is wrong if it could be reasonably rejected by any person affected. We need to operationalize this for a committee.

  Steps of the procedure:

  1. **Identify Affected Parties and Their Claims:**
     - For each proposal, list the distinct groups of people who would be significantly affected (positively or negatively) by the decision. For each group, describe the nature of the benefit or burden they would experience.
     - A "claim" is the reason an individual (or group) has to object to a policy that imposes a burden on them, or to demand a policy that confers a benefit. In the negative, it's the burden they would bear; in the positive, the benefit they would gain.

  2. **Characterize the Complaints:**
     - For each group, articulate the complaint they might have if the policy is adopted (if they are burdened) or if it is not adopted (if they are denied a benefit). The complaint should be expressed in terms of the impact on that person's life (e.g., health, autonomy, opportunity, suffering).
     - Example: For a group that would lose a service, the complaint is the worsening of their condition or the loss of a benefit they currently have.

  3. **Check for Reasonable Rejectability:**
     - Consider each group's complaint and ask: "Is this complaint one that would make it reasonable for that person to reject the policy?" But note: the rejection must be reasonable from the standpoint of others as well. We must consider whether there is an alternative policy that would not impose such a burden or that would provide a comparable benefit at a lower cost in terms of burdens to others.
     - At this step, we are not aggregating. We are looking for any individual or group that has a complaint so severe that, even when considering the benefits to others, it would be reasonable for them to reject the policy.

  4. **Assess Comparability of Claims:**
     - When comparing burdens and benefits across groups, we must determine if the claims are of a kind that can be compared. Scanlon allows that numbers matter when the claims are of "roughly comparable" importance. We must define:
          - What makes two claims comparable? They are comparable if they affect the same fundamental interest (e.g., health, basic opportunity) and the magnitude of the impact is in the same order (even if not exactly equal). However, if one claim involves a catastrophic loss (e.g., death, severe disability) and the other a minor inconvenience, they are not comparable.
     - If claims are not comparable, then the policy that imposes the catastrophic loss can be reasonably rejected by the person suffering it, even if it benefits many others with minor gains.

  5. **Handling Aggregation (When Claims are Comparable):**
     - If the claims are comparable (e.g., all are about moderate health improvements or all are about life-saving), then we can consider the numbers. The policy that leads to the least total burden (or the greatest total benefit) might be justified. But note: Scanlon does not allow simple summation of small benefits to override a significant burden to one person. However, if the burden to each is small and the benefit to each is also small and comparable, then the numbers might tip the balance.
     - Specifically: 
          - If the burden to a group is small and the benefit to another group is also small and of the same kind, then we can aggregate the small benefits and compare the total burden to the total benefit. But if the burden to one group is significant (even if not catastrophic) and the benefits to others are very small, aggregation is not allowed. Then the policy imposing the significant burden may be reasonably rejected.

  6. **Decision Rules:**
     - If there is any group for which the burden is so severe that it cannot be justified by any amount of benefits to others (because the claims are not comparable or because the burden is too great to be offset by aggregated small gains), then the policy can be reasonably rejected and should be rejected.
     - If all claims are comparable and the policy leads to a net reduction in comparable burdens (or net gain in comparable benefits) when considering the numbers, then the policy is not reasonably rejectable and should be adopted.
     - If the claims are not comparable and no single group has a catastrophic burden, but the burdens and benefits are of different kinds and magnitudes, then the procedure cannot decide and the committee must use their judgment.

  7. **Where the Procedure Stops:**
     - The procedure stops with a "no" (i.e., reject the policy) if:
          a. There is at least one group that would suffer a burden that is catastrophic or of a kind that cannot be compensated by the benefits to others (even if many others get small benefits) because the claims are not comparable and the burden is too severe.
          b. The policy imposes a burden on a group that is significant and the benefits to others, while numerous, are of a much lesser kind (e.g., minor inconveniences vs. severe health deterioration) and thus cannot justify the burden.
     - The procedure stops with a "yes" (i.e., adopt the policy) if:
          a. There is no group that can reasonably reject the policy because the burdens are either nonexistent or are justified by the benefits (after the above tests).
     - The procedure cannot decide and hands the value judgment back to the committee if:
          a. The burdens and benefits are of different kinds that are hard to compare but none of the burdens are catastrophic. In this case, the committee must deliberate and decide based on their best judgment.

