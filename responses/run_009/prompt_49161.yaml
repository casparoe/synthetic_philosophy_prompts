answer: |-
  ### Scanlon-Inspired Decision Procedure for Health Resource Allocation

  Based on Scanlon's contractualism, this procedure evaluates proposals by asking: *Could any individual reasonably reject this policy, given the burdens it imposes on them, when a feasible alternative exists?* Reasonable rejection hinges on whether the burden is *unjustifiable* to the person bearing it, considering others' gains. The procedure focuses on individual complaints, not aggregate sums. Below is a step-by-step process usable in a single meeting.

  **Key Definitions**  
  - **Complaint**: A burden imposed on an individual by a policy, expressed as a *concrete deterioration in their well-being* (e.g., pain, disability, loss of function, risk of death). Benefits are framed as the *avoidance of a burden* under the alternative policy.  
  - **Comparability**: Claims are comparable only if they involve burdens/benefits of *similar severity and nature* (e.g., moderate pain vs. moderate pain). They are **not comparable** if one involves a catastrophic burden (e.g., death, severe disability) and others involve minor burdens (e.g., short delays, inconvenience).  
  - **Aggregation**: Small gains/losses across many people **cannot** be summed to override a large burden to one person. Numbers matter **only** when:  
    - Claims are comparable (similar severity), AND  
    - The policy reduces the *number* of people bearing a comparable burden.  

  **The Procedure: Step-by-Step**  
  1. **Map Affected Groups**  
     - *Task*: List all groups significantly affected by the proposal and its alternative. For each, specify:  
       - Size of group.  
       - Nature of burden imposed (if policy adopted) or benefit denied (if policy rejected).  
       - Severity of burden/benefit (use qualitative descriptors: catastrophic, severe, moderate, minor).  
     - *Sufficient Answer*: Clear, concise descriptions of burdens (e.g., "500 patients face 30-min delays" → minor burden; "10 patients lose life-saving treatment" → catastrophic burden).  
     - *Stop/Handoff*: Stop if no burden is identified for any group; the policy is unobjectionable. Hand off to committee if burdens are vague or unquantifiable.  

  2. **Articulate Individual Complaints**  
     - *Task*: For each group, state the complaint from the perspective of a single member: "As an affected person, I can reject this policy because it imposes [burden] on me, while an alternative avoids this."  
     - *Sufficient Answer*: Claims framed as personal harms (e.g., "I am denied a cochlear implant and will remain deaf," not "QALYs are lost").  
     - *Stop/Handoff*: Stop if any complaint involves a burden that is *intrinsically unjustifiable* (e.g., torture, discrimination), as it is automatically reasonably rejectable.  

  3. **Test for Catastrophic Burdens**  
     - *Task*: Identify any group facing a catastrophic burden (death, permanent disability, severe suffering). If found, assess whether the alternative policy imposes a *lesser catastrophic burden* on others.  
     - *Sufficient Answer*: A clear yes/no on whether a catastrophic burden exists and if it is unique to one policy.  
     - *Stop/Handoff*: Stop with **reject policy** if:  
       - It imposes a catastrophic burden, AND  
       - The alternative does *not* impose a comparable catastrophic burden on others.  
       - *(Rationale: No one can reasonably demand others bear catastrophe for smaller gains.)*  

  4. **Assess Comparability of Burdens**  
     - *Task*: For non-catastrophic burdens, determine if claims across groups are comparable (i.e., similar severity and nature). Use:  
       - **Rough parity**: Burdens are "close enough" in severity (e.g., severe pain vs. severe mobility loss).  
       - **Wild disparity**: Burdens are radically different (e.g., death vs. 20-min wait).  
     - *Sufficient Answer*: Group burdens into tiers (e.g., "severe," "moderate," "minor") with justifications.  
     - *Handoff*: If burdens are incomparable (e.g., one group faces severe burdens, others minor), return to committee—**procedure cannot resolve**. *(Honesty: Comparability is judgmental; no bright line exists.)*  

  5. **Rescue Test (When Claims are Comparable)**  
     - *Task*: If burdens are comparable, ask: "Does this policy reduce the *number* of people bearing this level of burden?"  
     - *Sufficient Answer*: Count affected people at each burden tier (e.g., "Policy A: 100 face severe burden; Policy B: 10 face severe burden → Policy B reduces severe burdens").  
     - *Stop*: Adopt policy if it minimizes the number bearing comparable burdens. Reject if it increases them.  
     - *Handoff*: If burdens are comparable but the policy increases burden severity (even for fewer people), hand off to committee.  

  6. **Final Reasonable Rejection Check**  
     - *Task*: Argue whether any group’s complaint justifies rejection. Key question: "Is there a group for whom the burden is so significant that it cannot be justified by gains to others?"  
     - *Sufficient Answer*: Explicit "no" (policy acceptable) or identification of a rejecting group with reasons.  
     - *Handoff*: If disagreement persists, hand off—**contractualism doesn’t resolve all conflicts**.  

  **Where the Procedure Fails**  
  - It cannot handle:  
    - Incomparable burdens (Step 4).  
    - Cases where both policies impose catastrophic burdens (Step 3).  
    - Conflicts involving non-health values (e.g., fairness, dignity) unless tied to concrete burdens.  
  - **Do not disguise judgments as procedure**: Be explicit when handing off.  

  ---

  ### Worked Examples  
  **Proposal 1: Redirect home-visit nursing budget ($1M) from 800 frail patients to cochlear implants for 12 children.**  
  - **Current**: Frail patients get home visits (modest help with daily tasks).  
  - **Alternative**: 12 deaf children get cochlear implants (life-transforming).  

  1. **Map Groups**  
     - Group A: 800 frail patients. Burden if policy adopted: Loss of home visits → increased fall risk, isolation. Severity: **Moderate** (non-catastrophic; manageable deterioration).  
     - Group B: 12 deaf children. Burden if policy rejected: Permanent deafness → lifelong disability, social exclusion. Severity: **Catastrophic** (irreversible, severe capability loss).  

  2. **Articulate Complaints**  
     - Group A: "I lose support, increasing my pain and isolation."  
     - Group B: "I am condemned to lifelong deafness when a cure exists."  

  3. **Test for Catastrophic Burdens**  
     - Group B faces catastrophic burden if policy rejected. Group A’s burden (moderate) is not catastrophic.  
     - **Stop and reject policy?** No—catastrophe is in the *alternative* (not funding implants). Policy (funding implants) *avoids* catastrophe.  

  4. **Assess Comparability**  
     - Burdens are **wildly disparate**: Catastrophic (deafness) vs. moderate (reduced support). Not comparable.  
     - **Handoff to committee**: Committees must judge if moderate burdens to 800 can override catastrophic burdens to 12. *(But Scanlon leans against this—no one can reasonably demand 12 bear catastrophe to spare 800 moderate burdens.)*  

  5. **Rescue Test**  
     - Not applicable (burdens incomparable).  

  6. **Reasonable Rejection Check**  
     - Group B can reasonably reject *not* funding implants—they bear catastrophe for others’ moderate gains. Group A’s complaint is weaker; they cannot reasonably reject funding implants because their burden is non-catastrophic and does not justify leaving Group B in catastrophe.  
     - **Verdict: Adopt policy. Fund cochlear implants.**  

  > **Chair’s Note**: You won’t like this—it kills your preferred program. But contractualism prioritizes averting catastrophe over modest gains, even for many. Group B’s complaint is stronger.

  ---

  **Proposal 2: Winter surge plan—close walk-in clinic (used by 3,000) to staff ICU.**  
  - **Current**: Walk-in clinic open; ICU understaffed.  
  - **Alternative**: Close clinic; ICU fully staffed.  

  1. **Map Groups**  
     - Group C: 3,000 occasional walk-in users. Burden if policy adopted: Clinic closure → delays for non-urgent care (rashes, minor infections). Severity: **Minor** (short-term discomfort; not life-threatening).  
     - Group D: ICU patients (estimated 20–30 during surge). Burden if policy rejected: Understaffed ICU → risk of death or severe complications. Severity: **Catastrophic** (death/permanent disability).  

  2. **Articulate Complaints**  
     - Group C: "I face delays for minor care, causing frustration and pain."  
     - Group D: "I risk death due to avoidable ICU errors."  

  3. **Test for Catastrophic Burdens**  
     - Group D faces catastrophic burden if policy rejected. Group C’s burden (minor) is not catastrophic.  
     - **Stop and reject policy?** No—catastrophe is in the alternative (not staffing ICU). Policy (staffing ICU) *avoids* catastrophe.  

  4. **Assess Comparability**  
     - Burdens **wildly disparate**: Catastrophic (death) vs. minor (delays). Not comparable.  

  5. **Rescue Test**  
     - Not applicable.  

  6. **Reasonable Rejection Check**  
     - Group D can reasonably reject *not* staffing ICU—they bear catastrophe for others’ minor gains. Group C’s complaint is trivial in comparison; they cannot reasonably reject staffing ICU.  
     - **Verdict: Adopt policy. Close clinic and staff ICU.**  

  > **Chair’s Note**: You might dislike closing the clinic, but contractualism demands averting catastrophe. Numbers don’t justify sacrificing Group D.

  ---

  ### Summary
  - **Proposal 1**: Fund cochlear implants (reject home visits).  
  - **Proposal 2**: Close clinic to staff ICU.  
  Both proposals pass because they avert catastrophic burdens. The procedure prioritizes rescuing those facing catastrophe over modest/minor gains for others. It fails when burdens are incomparable but not catastrophic—forcing committee judgment. In your case, it killed the home-visit program, contrary to your attachment to implants. Use this to reign in QALY summarians and focus Scanlonians on catastrophic harms.
