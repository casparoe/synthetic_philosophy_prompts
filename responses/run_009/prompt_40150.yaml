answer: |-
  ### The Question (Exam Text - 200 words)
  **Section C: Wittgenstein on Concepts and Use**  
  *Answer ONE question.*  

  **3.** Wittgenstein’s discussion of "game" in *Philosophical Investigations* §§66-67 introduces "family resemblance" to challenge essentialism. He claims that no single feature runs through all uses of "game"; instead, we see "a complicated network of similarities overlapping and criss-crossing". Dr. Ines Halvorsen, a corpus linguist, analyses a large corpus of everyday English and reports that actual uses of "game" fall into three distinct clusters with minimal overlap: (1) children’s pastimes (e.g., tag), (2) organised competitive sports (e.g., football), and (3) ‘playing at’ activities (e.g., pretend tea parties). Halvorsen concludes that ‘game’ is *locally essentialist*: each sub-community uses it with a stable core, and the illusion of family resemblance arises only when we mistakenly conflate dialects. She argues this refutes Wittgenstein by showing his "no common essence" claim stems from methodological error, not linguistic reality.  

  Does Halvorsen refute, vindicate, or misunderstand Wittgenstein’s claim about family resemblance? In your answer, address:  
  (i) Whether Wittgenstein’s claim concerns the empirical *extension* of ‘game’ across a community or the *grammar* (conditions of use) accessible to competent speakers;  
  (ii) How this affects whether Halvorsen’s evidence threatens his view;  
  (iii) Whether Wittgenstein’s insistence that his work offers "reminders for a particular purpose" (§127) rather than empirical theories defends him here or evades falsification.  

  ---

  ### Model Answer (600 words)  
  Halvorsen fundamentally misunderstands Wittgenstein’s project, and her empirical data neither refutes nor vindicates family resemblance. Instead, it highlights a categorial confusion about the *kind* of claim Wittgenstein makes. His argument targets the grammatical logic of concept-application, not statistical patterns in communal usage. Thus, Halvorsen’s findings are irrelevant to his point, and his "reminders" framing is a crucial defence against such misreadings.  

  **(i) Grammar, Not Extension:** Wittgenstein’s family resemblance is a claim about *grammar* – the rules for correct use embedded in language-games, accessible to any competent speaker. When we ask "Is this a game?" in a concrete context (e.g., watching chess, children playing tag, or actors improvising), we don’t consult corpus data; we draw on our mastery of how "game" functions across diverse language-games. §66 challenges the *philosophical picture* that a word like "game" *must* have an essence to be meaningful. Wittgenstein shows that competent speakers extend the term fluidly ("*Don’t think, but look!*"), relying on overlapping similarities without rigid definitions. Halversen’s focus on decontextualised *extension* (frequency and clustering in a corpus) mistakes a sociological observation about usage patterns for Wittgenstein’s grammatical investigation into the *possibility* and *normativity* of use.  

  **(ii) Empirical Evidence is Moot:** Because Wittgenstein examines the *conditions of sense* for concept application, Halvorsen’s empirical findings cannot threaten his claim. Suppose her clusters are real: this doesn’t show that speakers *within* a "sub-community" apply "game" via a hidden essence for *their* cluster. Even within Halvorsen’s "organised competitive sport" cluster, consider: Is a rain-abandoned cricket match still a "game"? Is a friendly kickabout? Competent speakers navigate these via resemblance, not essence. Further, Wittgenstein anticipates fragmentation (§§83, 142): language-games evolve, diverge, and hybridize. If a child calls a pretend tea party "a game", then uses "game" for rugby after seeing older siblings play, they bridge Halvorsen’s clusters *without* switching dialects. Her "local essentialism" merely pushes the problem back: what is the essence of "children’s pastime"? Tag shares with hopscotch not an essence, but resemblances (rules? fun? no winner?). Halvorsen confuses statistical regularity with logical necessity; her "dialect" analogy fails because Wittgenstein’s point is that *even within a single speaker’s idiolect*, "game" lacks an essence.  

  **(iii) Reminders as Defence, Not Evasion:** Wittgenstein’s "reminders for a particular purpose" (§127) is a robust defence here, not evasion. His purpose is therapeutic: dissolving philosophical bewitchment by essentialism. He reminds us how we *actually* use words in the stream of life (§23). Halvorsen offers a *rival empirical theory* about usage distribution. Wittgenstein rejects such theorising about language (§109); his reminders describe grammar to combat conceptual confusion, not to explain behaviour. Halvorsen, like the essentialist, is in the grip of a picture: that meaning *must* be grounded in empirically discoverable regularities (whether universal or local). Wittgenstein’s point is that the grammar of "game" – its open-textured applicability based on criss-crossing similarities – is *already manifest* in competent use. Corpus data, while interesting sociology, cannot falsify this logical observation about how concepts function. Insisting it does misconstrues philosophy as science. Thus, Halvorsen misunderstands §66: it’s not a hypothesis about word frequency, but a grammatical remark revealing the futility of seeking essences *even if* usage clustered. Her "refutation" only works if Wittgenstein were doing what he explicitly rejects.  

  **Conclusion:** Halvorsen’s data rests on a confusion. Wittgenstein’s family resemblance is vindicated *as a grammatical insight*, untouched by corpus linguistics, precisely because it operates at the level of normative practice, not empirical generalisation.  

  ---

  ### Marking Scheme (Out of 25)  

  1.  **Interpretation of Wittgenstein (10 marks)**  
      *   *Upper-second error:* Recites "no essence, only resemblances" without addressing the grammar/extension distinction or Halvorsen’s specific challenge.  
  2.  **Engagement with Halvorsen & Crux (8 marks)**  
      *   *Upper-second error:* Concludes Halvorsen is "partly right" or vaguely "misunderstands" without rigorously analysing *why* her empirical approach misfires relative to grammar vs. extension.  
  3.  **Analysis of 'Reminders' Defence (5 marks)**  
      *   *Upper-second error:* Mentions §127 but doesn’t explain *how* it functions as a defence against empirical refutation or conflates it with simple evasion.  
  4.  **Clarity & Argument Structure (2 marks)**  
      *   *Upper-second error:* Structure is competent but lacks tight integration between the crux (grammar/extension) and the defence (reminders).  

  **First-Class Requirement (21+):** Must explicitly demonstrate *why* Halvorsen’s "local essentialism" *itself* relies on family resemblance within clusters, and articulate how Wittgenstein’s grammatical investigation transcends the empirical/sociological level she operates on, using his therapeutic purpose as integral to the argument.
