prompt: |-
  I'm a PhD student in environmental economics, and a routine feature of my work keeps snagging on something nobody in my department treats as a question. When regulators appraise a climate policy, they compress all future damages from an added ton of CO2 into a single number — the social cost of carbon — and compare it against the cost of abatement. Producing that number requires three steps, each of which looks philosophically loaded. First, harms are monetized through willingness-to-pay, which means a death in a poor region counts for less than a death in a rich one, simply because the victims have less money. Second, damages are discounted: future harms count for less than present ones, at a rate assembled from a pure preference for the present, an aversion to consumption inequality across generations, and a projection of future growth. Third, the analysis is distribution-blind: it licenses a policy if the winners could in principle compensate the losers, even though in practice no compensation account is ever set up. And there is a wrinkle that puzzles me most: the very same model discounts future harms on the assumption that future people will be richer, and simultaneously warns of damages so deep that they would make future people much poorer — the optimism that shrinks the number and the catastrophe that inflates it sit inside it at once.

  What does this practice presuppose? I'd like the implicit theory reconstructed. What must it assume welfare is, such that it can be converted to money, summed across persons, and averaged over uncertain futures? Does the discounting step presuppose that future people count for less than we do, or is it something a view granting them full and equal moral status could still accept — say, as a reflection of risk, or of their anticipated greater wealth? Does the hypothetical-compensation test presuppose that the distribution of benefits and burdens has no intrinsic importance, or could a theorist who does care about equality still license the practice, on the ground that climate policy is simply the wrong instrument for pursuing it? Then tell me where the practice is philosophically underdetermined: could a degrowth theorist who denies that ecological losses are commensurable with money nevertheless sign off on the same number for entirely different reasons, or does the practice quietly rule out any view on which there are thresholds beyond which talk of cost stops making sense? Finally, say what would have to change if the presupposed welfarism were dropped — if future people were given strictly equal weight, and compensation had to be actual rather than hypothetical. What happens to the number, and what has to change in the institution of regulatory analysis that has grown up around it?
reasoning: |-
  Okay, the user is a PhD student in environmental economics, grappling with the ethical and philosophical assumptions embedded in the Social Cost of Carbon (SCC) calculation. They've outlined three main steps: monetization via willingness-to-pay, discounting future damages, and the Kaldor-Hicks efficiency criterion. Each step has ethical implications they're questioning.

  First, the monetization part. Using willingness-to-pay (WTP) means valuing lives based on wealth. A death in a poor country is valued less than in a rich one. That's clearly problematic. It assumes that welfare is directly measurable by money and that individuals are the best judges of their own welfare. But this ignores that people adapt to their circumstances, which might undervalue future catastrophic risks. Also, it commodifies things that might be beyond monetary value, like ecological systems or human lives.

  Then there's discounting. The user points out a contradiction: future people are assumed to be richer (justifying discounting), but climate damages might make them poorer. So the SCC model uses optimistic growth assumptions to discount, while also predicting severe damages that would lower growth. That's a tension. The ethical concern is whether discounting devalues future generations. Some components, like pure time preference, suggest that future people matter less just because they're in the future. But other components, like aversion to intergenerational inequality, might be justifiable on egalitarian grounds. The user wants to know if discounting can be reconciled with equal moral status for future people.

  The third issue is Kaldor-Hicks efficiency. Policies are approved if winners could compensate losers, but compensation isn't actually paid. So, climate policies might burden the poor more without any mechanism to redress that. The user wonders if this assumes that distribution doesn't matter intrinsically. But maybe even an egalitarian could support it if they think compensation should be handled separately. However, in practice, without actual redistribution, it might exacerbate inequality.

  The user also asks about degrowth theorists who reject money commensurability. Could they still endorse the SCC? Probably not, because SCC relies on monetizing everything. Degrowth advocates might see ecological thresholds beyond which monetary valuation doesn't make sense. The SCC framework doesn't account for such tipping points, treating all damages as fungible.

  If we drop the welfarist assumptions—equal weighting of future people and actual compensation—what changes? The SCC would likely increase because future damages aren't discounted as much. Discount rates would drop, especially the pure time preference component. Plus, requiring actual compensation means policies must include redistribution mechanisms, which complicates cost-benefit analysis. Regulatory institutions would need to integrate distributional analysis and maybe shift to rights-based frameworks, like considering the rights of future generations.

  The user's deeper needs seem to be seeking validation of their critique and a framework to articulate the ethical shortcomings of SCC. They might want to position their research within philosophical debates, possibly to advocate for methodological changes in environmental policy appraisal. They need a structured way to present these issues to their department, which currently overlooks these philosophical questions.
answer: |-
  The SCC practice rests on a specific, philosophically loaded conception of welfare, efficiency, and intergenerational justice. Let's reconstruct its implicit theory and explore its tensions:

  **Core Philosophical Presuppositions:**

  1.  **Welfarism & Utilitarianism:** Welfare is the ultimate good, understood as preference satisfaction or experienced well-being. It is:
      *   **Monetizable:** All welfare impacts (health, life, ecosystem loss) can be expressed as monetary equivalents via revealed/stated preference (WTP/WTA). This assumes commensurability.
      *   **Additive:** Social welfare is the *sum* of individual welfares. Aggregation across vastly different individuals (rich/poor, present/future) is legitimate.
      *   **Expected Utility Maximization:** Under uncertainty, maximize the *expected value* of aggregate welfare. Catastrophic risks are probabilities times monetized damages, not unique ontological threats.

  2.  **Instrumentalist View of Money:** Money is a neutral, fungible instrument for measuring welfare changes. Its distribution only matters insofar as it affects aggregate welfare (via diminishing marginal utility).

  3.  **Kaldor-Hicks Efficiency as Justice:** A policy is desirable *if* it increases aggregate wealth enough that winners *could* compensate losers (even if they don't). Distributive justice is conceptually separable from efficiency and addressed elsewhere (or assumed away).

  4.  **Weak Anthropocentrism:** Only human welfare (present and future) has intrinsic value. Non-human nature is valued instrumentally via its contribution to human welfare.

  **Discounting: Equality vs. Efficiency:**

  The discount rate (`r = ρ + θg`) embodies a profound tension:
  *   **Pure Time Preference (ρ):** Discounting *solely* because harms occur later *does* imply future people count less morally, violating equal moral status. Defenders argue it reflects existential risk or myopia, but its core rationale (impatience) is ethically problematic for many.
  *   **Aversion to Inequality (θg) & Growth (g):** This component *can* be compatible with equal moral status. Discounting occurs because future people are assumed richer (`g > 0`), so a marginal dollar loss harms their welfare less (diminishing marginal utility). The discount *reflects* their anticipated greater wealth, not lesser moral worth.
  *   **The Central Tension:** The model simultaneously assumes `g > 0` (justifying discounting) and predicts damages that would *reduce* `g` or even cause negative growth. This isn't necessarily contradictory *within the model* (it's calculating net effects under different scenarios), but it highlights a fragility: the discount rate relies on growth assumptions that the climate damages themselves jeopardize. Ethically, it risks *using the beneficiaries' good fortune* (future wealth) to *discount the harms we inflict upon them*.

  **Distribution-Blindness: Efficiency First:**

  *   **Presupposition:** The Kaldor-Hicks test assumes that aggregate welfare is the primary goal. The *distribution* of costs (e.g., hitting poor regions/counturies hardest) and benefits has no *intrinsic* moral significance; it only matters if it reduces aggregate welfare (e.g., due to higher marginal utility of losses for the poor).
  *   **Could an Egalitarian Use It?** *Reluctantly, and with major caveats.* An egalitarian might argue:
      1.  Climate policy is an emergency; maximizing aggregate mitigation is paramount *even if* distribution is imperfect.
      2.  Distribution *should* be fixed via separate instruments (tax/transfer, international aid). Using climate policy itself for redistribution is inefficient or impractical.
      3.  However, they would *insist* on rigorous, separate distributional analysis and advocate for actual compensation mechanisms. The *unmodified* SCC practice, ignoring actual compensation, remains deeply problematic for them, as it permits policies that worsen inequality.

  **Philosophical Underdetermination:**

  1.  **Degrowth / Strong Sustainability:** This view fundamentally rejects the SCC's core premises:
      *   **Incommensurability:** Ecological thresholds, critical natural capital, and intrinsic values cannot be meaningfully monetized. Beyond tipping points, "costs" become infinite or undefined.
      *   **Anti-Aggregation:** Summing monetized harms across generations and contexts loses essential meaning. The focus shifts to avoiding catastrophic thresholds, not minimizing a sum.
      *   **Rejection of Growth Assumption:** Degrowth explicitly challenges the assumption `g > 0` is desirable or sustainable. Discounting based on assumed future wealth is thus invalid.
      *   **Conclusion:** A degrowth theorist *cannot* endorse the *same* SCC number derived from standard models. The practice *rules out* non-monetizable thresholds and assumes substitutability between natural and manufactured capital. A degrowth approach would generate entirely different metrics (e.g., remaining carbon budget, critical system integrity indicators).

  2.  **Deontology / Rights-Based Views:** Views emphasizing rights (e.g., future generations' right to a stable climate) or strict duties (e.g., not imposing catastrophic risks) see the SCC's cost-benefit framing as morally inappropriate. Harming rights isn't permissible just because benefits outweigh costs hypothetically.

  **If Presupposed Welfarism Were Dropped (Equal Weight, Actual Compensation):**

  1.  **The SCC Number Itself:**
      *   **Discount Rate Plummets:** Eliminating pure time preference (`ρ ≈ 0`) and potentially reducing `θ` (if aversion to inequality is based on welfare, not inherent justice) drastically lowers the discount rate. Future damages are weighted much more heavily.
      *   **Valuation Shift:** Monetization via WTP might be abandoned or radically adjusted. Valuing lives equally regardless of location would increase damages from events disproportionately affecting poor regions. Intrinsic/non-use values might be incorporated differently.
      *   **Result:** The SCC would **increase dramatically**, potentially by orders of magnitude, reflecting the full, undiscounted, equally weighted future harms.

  2.  **Institutional Changes in Regulatory Analysis:**
      *   **Discount Rate Revolution:** Mandating `ρ = 0` and re-evaluating `θ`. This is politically and institutionally contentious.
      *   **Distributional Analysis Becomes Central:** Cost-benefit analysis (CBA) would require detailed assessment of *who* bears costs and *who* gets benefits, moving beyond Kaldor-Hicks. Regulatory impact analyses would include mandatory distributional accounts.
      *   **Mandatory Compensation Mechanisms:** Policies passing CBA only if paired with *actual*, enforceable compensation schemes (e.g., domestic transfers, international climate finance). "Could" becomes "must and will."
      *   **Beyond Monetization?:** Institutions would struggle with incorporating non-monetizable values/thresholds. Analysis might shift towards:
          *   **Multi-Criteria Analysis:** Presenting monetary SCC alongside ecological, health, and distributional indicators.
          *   **Safe Minimum Standards:** Prioritizing avoidance of catastrophic thresholds identified by science, with CBA applied *within* those constraints.
          *   **Rights-Based Frameworks:** Evaluating policies based on compliance with obligations to future generations or rights to a healthy environment.
      *   **Uncertainty Dominance:** With vastly higher stakes on the distant future and thresholds, decision-making might shift towards precautionary principles even when expected monetary costs seem manageable. Avoiding worst-case scenarios dominates optimization.
      *   **International Equity Front and Center:** Equal weighting and actual compensation necessitate massive, structured financial flows from historically high-emitting rich nations to vulnerable poor nations.

  **In essence:** The standard SCC practice presupposes a utilitarian, welfarist, growth-oriented, efficiency-first worldview that commodifies and aggregates human experience across time and space. Challenging its philosophical foundations – granting future generations full equal moral status, demanding actual justice, and recognizing ecological limits – necessitates not just a higher number, but a fundamental transformation of regulatory economics towards explicit distributive justice, precaution, and potentially non-monetizable values. The tension you identify – the model's reliance on growth to discount the damages that undermine growth – is symptomatic of its deeper philosophical commitments and limitations.
