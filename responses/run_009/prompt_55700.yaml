prompt: |-
  I'm a science and ideas journalist, and over fifteen years on the beat my working vocabulary has become the vocabulary of sourcing: what counts as a source, what a source is reliable for, on- and off-record ground rules, the difference between a fact I have verified myself and one I take on a source's authority, and the standing instruction never to write beyond what my sourcing supports. Recently I've become interested in the extended mind thesis — the claim, roughly, that objects outside the skull can be parts of a cognitive process, on the strength of which an Alzheimer's patient's notebook might count as part of his memory. Please restate that debate in my vocabulary, as faithfully as you can: treat the notebook as I would treat a long-standing source with a known domain of competence, treat the philosopher's criteria for when an external store counts as cognitive the way I would treat the ground rules that make a source usable, and treat the skeptic's objection — that the notebook is a reliable external aid the patient consults, not a part of him, and that calling it part of his mind conflates reliability with constitution — the way I would treat an editor's insistence that a wire service I've never personally verified isn't my reporting. Then give me the residue report: which parts of the philosophical debate map cleanly onto questions about sourcing and verification, which parts you had to distort to make them fit, and whether anything in the debate — the parity principle, the idea that internal and external processes deserve the same description if they play the same role — has no counterpart in how journalists think about dependence on external providers of content. I want to know whether my instinct that this is just an unusually vivid version of the reporter-and-source problem is right, or whether the philosophers are onto something my vocabulary genuinely cannot express. Lead with your bottom line in the first sentence, then give the translation and the reasoning, with no preamble and no restatement of this request.
reasoning: |-
  Okay, the user is a science journalist with deep experience in sourcing and wants me to reframe the extended mind thesis debate using their professional vocabulary. They specifically asked for no preamble - just bottom line up front.

  First, the core insight: Their instinct is fundamentally right - the extended mind debate maps startlingly well onto journalism's source-reliability framework. The notebook-as-memory parallels how reporters treat sources with established domains of competence. 

  Now translating the philosophy: Clark and Chalmers' criteria for cognitive extension become editorial ground rules - just like how journalists decide when a source is usable. The notebook must be constantly accessible (like a trusted source on speed dial), automatically endorsed (no fact-checking needed like with proven sources), easily accessible (like pulling records), and contain endorsed content (vetted information). 

  The skeptic's objection mirrors an editor pushing back on unverified wire copy. Just as editors distinguish between using Reuters and doing original reporting, philosophers distinguish between consulting a tool and it being part of cognition. 

  Where the mapping strains: The parity principle's demand to ignore internal/external boundaries has no real journalistic equivalent. Reporters inherently distinguish between their firsthand verification and secondhand sourcing. Also, the notebook's role as constitutive rather than instrumental pushes beyond sourcing metaphors - you don't call the notebook "part of your mind" like you wouldn't call a source "part of your reporting apparatus."

  Residue report shows three clean mappings: source competence = functional role, ground rules = criteria for cognitive extension, skeptic/editor distinction between reliability and constitution. But had to distort by oversimplifying "automatic endorsement" - even trusted sources get spot-checked. And the parity principle truly introduces something foreign to journalism's worldview.

  Final verdict: Their sourcing framework captures about 85% of this debate. The remaining 15% exposes philosophy's deeper challenge to cognition's boundaries - which might actually help them rethink what "sourcing" means for human cognition itself.
answer: |-
  **Bottom line:** Your sourcing framework maps remarkably well onto the extended mind debate, revealing it as a profound negotiation over cognitive sourcing protocols, though the *parity principle* forces a confrontation with journalistic distinctions your vocabulary inherently preserves.

  **The Translation:**

  1.  **The Notebook as Source:** Treat the Alzheimer's patient's notebook as a **long-standing, highly specialized source**. Its **domain of competence** is the patient's personal biographical facts, routines, and recent history – information the patient's biological memory (the "primary source") is now unreliable for.
  2.  **Ground Rules for Cognitive Extension (Usability):** The philosopher's criteria (Clark & Chalmers) are the **ground rules making the notebook a usable cognitive source**:
      *   *Constant Access:* The notebook is **always available**, like a trusted source "on call" for their specific beat. (Journalistic Ground Rule: Source must be consistently reachable/reliable for their domain).
      *   *Automatic Endorsement:* Information retrieved is **trusted implicitly and used directly**, without conscious verification each time, akin to relying on a source with a long, proven track record within their niche. (Journalistic Ground Rule: Established reliability within known domain allows for direct attribution/reliance without re-verifying *every* basic fact from them).
      *   *Easy Accessibility:* Retrieval is **effortless**, like quickly checking a trusted database or calling a go-to expert. (Journalistic Ground Rule: Source must be practically usable within workflow).
      *   *Endorsed Content:* The content was **originally endorsed** (written/approved) by the patient. (Journalistic Ground Rule: Information originates reliably from the subject/domain; akin to a source reporting firsthand or based on direct expertise).
  3.  **The Skeptic's Objection (Editorial Pushback):** The skeptic argues the notebook is merely an **exceptionally reliable external aid**, like routinely consulting a wire service (AP, Reuters) or a trusted reference work. **Calling it *part of* the patient's mind is like claiming the wire service *is* your reporting.** Your editor insists: "Your story relies *on* the wire's reporting; the wire's facts aren't *constitutive* of your story in the way your own verified observations are. Distinguish between relying *on* a source and the source *being* your work." The skeptic demands the same cognitive distinction: the notebook is consulted, not constitutive.

  **Residue Report:**

  1.  **Clean Mappings:**
      *   **Source Competence & Functional Role:** Mapping the notebook's specific domain of reliable information (personal facts) to a source's known competence is precise. The notebook *functions* as the reliable provider for that specific cognitive task, just as a source does for a story element.
      *   **Ground Rules & Usability Criteria:** The philosopher's criteria translate almost directly into journalistic protocols for determining *when* an external provider (source) is sufficiently reliable and integrated into the workflow to be used directly without constant re-verification of basics.
      *   **Skeptic/Editor Distinction:** The objection that reliance ≠ constitution maps perfectly onto the editorial insistence that using a wire service is *sourcing from* it, not *incorporating it into* your report. Both maintain a crucial boundary between the agent (reporter/mind) and the tool (source/notebook).

  2.  **Distortions Required:**
      *   **"Automatic Endorsement" vs. Journalistic Skepticism:** While journalists *rely* on trusted sources for specific info, the ideal (and your "standing instruction") is a baseline skepticism. The philosophical "automatic endorsement" implies a deeper, more unconscious integration than even the most trusted journalistic source typically achieves. Journalists might *use* the source's info quickly, but a part of them knows it's *sourced*. The distortion is slightly overstating the seamless, unconscious trust in the notebook compared to even a top source.
      *   **Constitution vs. Reliance:** While the *distinction* maps cleanly, the *nature* of "constitution" in the philosophical sense is more radical. Saying the notebook is *part of the mind* is a stronger claim than saying a wire service is *part of your reporting apparatus*, even if the latter feels analogous. The distortion is downplaying the metaphysical weight of "constitution" to fit the sourcing metaphor.

  3.  **No Counterpart (The Parity Principle Challenge):**
      *   **The Parity Principle:** This is the core philosophical wrench. It states: *"If, as we confront some task, a part of the world functions as a process which, were it done in the head, we would have no hesitation in recognizing as part of the cognitive process, then that part of the world **is** (so we claim) part of the cognitive process."* **This has no counterpart in journalism.**
      *   **Why it Breaks:** Journalism *fundamentally* distinguishes origins based on the *location* of the cognitive labor. Your vocabulary and practice **insist** on labeling:
          *   Information *you* directly witnessed/verified = **your reporting**.
          *   Information *sourced* from others (no matter how trusted, integrated, or automatically used) = **sourced material**.
      *   The Parity Principle demands that if the notebook *functions exactly like* biological memory for the patient (per the criteria), then it *should* be considered part of the mind, **regardless of its physical location.** Journalism's core ethic ("never write beyond what my sourcing supports") *requires* maintaining the internal/external boundary. The Parity Principle challenges the very relevance of that boundary for defining the cognitive system. Your vocabulary cannot express the idea that the sourcing *becomes* the cognition itself in a constitutive way; it can only express degrees of reliance and reliability.

  **Conclusion on Your Instinct:** Your instinct is **largely correct** – the extended mind debate *is* vividly illuminated by the reporter-source framework, exposing it as a deep dispute over cognitive sourcing protocols, reliability thresholds, and the boundaries of the "self" as the primary investigator. However, the **Parity Principle** reveals a genuine limit. Your journalistic vocabulary, built on distinguishing internal verification from external sourcing, *cannot fully express* the radical claim that under specific conditions of integration and reliability, the external source *ceases to be "sourced from" and becomes "part of the cognitive apparatus" itself.* The philosophers *are* pointing to a conceptual blind spot inherent in the sourcing model: its necessary preservation of the internal/external divide for defining the agent.
