  Okay, let me try to unpack this user's query. They're deeply involved in biodiversity informatics and grappling with the persistent species problem despite de Queiroz's general lineage concept (GLC) supposedly resolving it decades ago. The user wants to understand why the debate continues unchanged, even among experts who acknowledge the GLC. 

  First, I need to recognize their expertise. They wrote a master's dissertation on this and work in bioinformatics where the issue is practical, not just academic. Their frustration is palpable—they've seen the same arguments repeat in issue trackers and nomenclature codes. The core puzzle is why GLC's "dissolution" didn't dissolve anything.

  Hmm. The user presents three possible interpretations: (1) a verbal dispute about the word "species," (2) a hidden empirical disagreement about nature's structure, or (3) divergent questions about taxonomy's purpose vs. natural reality. They also note that edge cases (ring species, etc.) don't sway anyone—everyone classifies them similarly yet fights over principles. That's key. If classifications converge but the debate persists, it's likely not about empirical facts.

  Let me evaluate the options. If it were purely verbal, why wouldn't de Queiroz have ended it? And why do intelligent participants not notice? The user's observation that some now say "it's just a word, get on with classifying" is telling—but that might mask deeper issues. If it were empirical, we'd expect new data to shift positions, but the user implies decades of microbial genomics and phylogenomics haven't changed the stalemate. 

  The third option feels strongest: the conflict is about divergent epistemic values. Monists prioritize ontology (what exists independently), demanding a unified account. Pluralists prioritize utility (serving diverse user needs), accepting context-dependent criteria. De Queiroz's GLC tried to bridge this by separating definition from criteria, but it didn't resolve the values clash. For monists, GLC is too vague; for pluralists, it's an empty shell requiring operational concepts anyway. 

  Also, the user hints at institutional inertia—zoological vs. botanical codes codify different assumptions, reinforcing divides. And in databases, choosing whether to treat ranks as equivalent isn't philosophical; it affects data merging and user trust. When a botanist expects hybrid taxa and a zoologist expects clean lineages, conflict erupts in issue trackers. 

  So my diagnosis: The dispute persists because it's not about facts or words, but about what taxonomy should optimize—representing nature's structure vs. serving human utility. Progress would require either convincing both sides their values are compatible (unlikely) or shifting institutional practices. But given entrenched norms, expecting resolution might be naive. Instead, we might manage the tension through metadata (annotating which concept a classification uses) or accepting that taxonomy, like many sciences, balances competing goods imperfectly. 

  Wryly, the user's own framing—calling for a "diagnosis"—reflects the monist instinct for resolution, while their field experience embodies pluralist pragmatism. That tension is precisely the point.
answer: |-
  Your diagnosis: **The species debate persists because it is fundamentally a conflict of epistemic values disguised as a dispute about concepts or ontology.** De Queiroz's General Lineage Concept (GLC) didn't resolve it because it sidestepped the core tension: *what makes a taxonomic practice "successful" or "legitimate"?* The monist-pluralist divide reflects irreconcilable priorities about the *aims* and *authority* of taxonomy itself.

  ### Defending Against Rival Explanations:

  1.  **Not Primarily Verbal:**
      *   **Why participants don't "notice it's just words":** They *do* often recognize terminological flexibility. When they say "it's just a word, get on with classifying," it signals pragmatism, but *not* agreement. The fight erupts in issue trackers precisely because naming decisions (e.g., merging databases) have *practical consequences* based on deep-seated values:
          *   **For Monists:** Calling two hybridizing plant lineages "species" under a BSC-like criterion *feels wrong* because it obscures their evolutionary entanglement. They value ontological correctness and predictive power about lineage independence.
          *   **For Pluralists:** Insisting on a single, strict concept for microbes *feels obstructive* because it hinders communication about distinct, ecologically coherent populations. They value utility, information retrieval, and accommodating diverse biological realities.
      *   **Relocation, Not Resolution:** Saying "it's just a word" often relocates the conflict from philosophy to practice. The disagreement re-emerges as arguments over *which operational criterion* is appropriate for *this specific database/group*, reflecting underlying values about what taxonomy *should achieve*. Is the priority stability (monism)? Flexibility (pluralism)? Reflecting reproductive isolation? Diagnosability? Monophyly? These choices aren't neutral.

  2.  **Not Primarily Empirical:**
      *   **The "Continuum vs. Discrete" Issue:** While lineage discreteness varies, the *core disagreement persists even where structure is clear*. Two taxonomists looking at the same well-delimited asexual microbial strain might still clash:
          *   **Monist:** "It's a fundamental evolutionary unit, a lineage worthy of species rank under the GLC."
          *   **Pluralist:** "Calling it a 'species' is fine for our pathogen database, but for ecological studies, grouping strains by metabolic function might be more useful – and we should have a way to represent that too."
      *   **Familiar Cases Don't Resolve:** Ring species, hybrids, and asexuals are known, but they are *used as ammunition*, not common ground. Monists see them as challenges demanding a unified conceptual framework to *explain* the gradation. Pluralists see them as proof that no single framework fits all, demanding context-dependent solutions. The *interpretation* of the data is value-laden.

  ### The Core Conflict: Epistemic Values

  *   **Monist Values:**
      *   **Unity:** Taxonomy should reflect a single, universal feature of the natural world (lineage independence).
      *   **Objectivity/Naturalism:** Species should be "real" natural kinds discovered, not invented. Classification should "carve nature at its joints."
      *   **Explanatory Power:** A good concept should explain speciation processes and evolutionary patterns.
      *   **Parsimony:** A single concept is theoretically cleaner and avoids arbitrariness.
  *   **Pluralist Values:**
      *   **Utility/Pragmatism:** Classification is a human tool. "Species" should serve diverse purposes (conservation, ecology, agriculture, medicine) effectively.
      *   **Context-Dependence:** The "best" way to delimit a group depends on the organisms, the data, and the question being asked.
      *   **Inclusivity:** Taxonomy must accommodate the full spectrum of biodiversity (microbes, plants, fungi, animals, fossils) without forcing square pegs into round holes.
      *   **Operational Feasibility:** Concepts must be applicable with available data.

  **Why De Queiroz's GLC Failed to Dissolve This:**
  The GLC brilliantly reframes the *definition* (lineage) vs. *criteria* (interbreeding, monophyly, etc.). However, it doesn't resolve the value conflict:
  *   **Monists:** See the GLC as vindication – lineage independence *is* the universal essence. They focus on refining criteria to best *detect that essence*.
  *   **Pluralists:** See the GLC as an empty shell. "Lineage" is too abstract. The *operational criteria* are what matter, and *different criteria are legitimately useful in different contexts*, even if they identify slightly different lineage segments. The GLC doesn't dictate *which* criterion to prioritize when they conflict.
  *   **In Practice:** When building a database, agreeing "species are lineages" doesn't answer *which diagnosable population-level lineages merit the rank* or whether a hybrid zone represents one lineage or two. The value conflict over *what makes a good taxonomic decision* kicks in immediately.

  ### Would Progress Be Possible? Cautious Realism

  1.  **Conceptual Distinction (Unlikely Resolution):** Further clarifying "lineage," "independence," or "operational criterion" won't resolve the values clash. The distinction is already clear; the disagreement is about which value should dominate practice.
  2.  **Change of Question (Possible Reframing):** Shifting focus away from "What *is* a species?" towards "What do we need this classification *for*?" can foster pragmatism in specific projects (e.g., "For *this* conservation database, we prioritize diagnosable units"). This doesn't resolve the underlying philosophical divide but can manage its practical impact. Your issue tracker fights *are* this reframing happening (messily).
  3.  **Empirical Findings (Necessary but Insufficient):**
      *   **Finding Universal Discreteness:** Impossible. Biology *is* messy at boundaries.
      *   **Finding Universal Continuity:** Also unlikely; many lineages *are* discrete for long periods.
      *   **Impact:** New data (e.g., widespread horizontal gene transfer blurring microbial lineages) might intensify pluralist arguments or push monists to refine criteria. However, it won't eliminate the values conflict. Monists would seek criteria resilient to HGT; pluralists would see it as confirming the need for multiple approaches.
  4.  **Institutional Change (Slow, Partial Progress):** Convergence in nomenclatorial codes (e.g., harmonizing treatment of hybrids) or database standards (e.g., explicit metadata tagging of the *criteria* or *conceptual leaning* used for a taxon) could reduce friction. This accepts pluralism at the implementation level while providing structure. It's progress in *managing* the disagreement, not ending it.
  5.  **Expectation of No Ultimate Resolution (The Core Insight):** Yes, we should expect the debate to continue indefinitely. **Why?**
      *   The values (unity/objectivity vs. utility/flexibility) represent fundamental, often incompatible, goods in science and information management.
      *   Taxonomy sits at the intersection of science (studying nature) and infrastructure (organizing knowledge). Tension is inherent.
      *   Recognizing this *is* progress! It moves the conversation from "Who has the *correct* concept?" to "How do we *manage* this necessary tension to build useful, reliable systems?" Your observation that "it's relocated" is key. The fight in the issue tracker *is* the ongoing negotiation of these values in practice.

  **Conclusion:** The dispute persists not because taxonomists misunderstand concepts or ignore data, but because they prioritize different, legitimate goals for taxonomy itself. De Queiroz clarified the ontology but couldn't reconcile the epistemology of practice. Progress lies not in winning the philosophical argument, but in developing tools (conceptual, technical, institutional) to navigate the tension – like explicit criteria annotation in databases, fostering dialogue about project-specific priorities, and accepting that "species" serves multiple masters. The expectation of no final resolution isn't a move in the stalled game; it's stepping off the battlefield to build better scaffolding for the necessary work within the contested terrain. Your frustration in the issue tracker is the sound of that essential, unending work.
