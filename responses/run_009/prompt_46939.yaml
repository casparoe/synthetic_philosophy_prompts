  I'm a journalist who writes a column on science and ideas for a general-interest magazine, and I'm at work on a piece about what happens to the concept of rational choice once prediction gets good enough — a follow-up to earlier columns on Newcomb's problem and on prediction markets. A philosopher friend, whom I consult whenever a column strays into decision theory, offered a thought experiment and an argument that I have not been able to get out of my head. I can't locate the flaw, and I would be grateful for a careful diagnosis.

  The setup: I am in Damascus and meet Death, who looks startled to see me. Death tells me that we have an appointment tomorrow. It is not that Death follows me wherever I go; the appointment's location was set in advance, and it was set wherever a perfectly reliable forecast said I would choose to be. In the story's grim punchline, the man who flees to Aleppo is killed by falling roof tiles in Aleppo, and Death explains that he had been surprised the previous day precisely because the appointment was already booked for Aleppo. Whichever decision the man ended up making had, in effect, been the wrong one.

  My friend then argued as follows. (1) The fatal accident will occur tomorrow in whichever city my own decision lands me in, and this was fixed before my deliberation began. (2) So my choice and the location of the accident cannot come apart: I will be in Damascus if and only if Damascus is the fatal city, and in Aleppo if and only if Aleppo is. (3) A choice is rational only if, at the very moment of making it, one's evidence favors it at least as much as every available alternative — one cannot rationally do, while doing it, what one then has decisive reason to regard as worse than something else one could do. (4) During deliberation, my current inclination is my best evidence of what I will decide; leaning toward staying is evidence that I will stay, and hence that Damascus is fatal, while leaning toward fleeing is evidence that Aleppo is fatal. (5) Whichever way I lean, my evidence therefore indicates that the city I am heading toward holds the accident and that the other city is safe, which makes the option I am currently choosing look decisively worse than its alternative. (6) So at the moment of any choice, I believe on my best evidence that I should have chosen otherwise. (7) By (3), no option available to me is rational. (8) Yet I must act somehow, so whatever I do will be irrational — and since ought implies can, the standards of practical rationality fail to apply outright: there is simply no fact about what I rationally ought to do. (9) Finally, my friend insisted, nothing in the argument depends on Death or on literally perfect prediction. Any reliably predictable choice — the coffee I always order, the route a navigation app forecasts I will take, the vote an analyst has already called — has the same structure: my inclination forecasts the correlate of my action, my own evidence then condemns the action, and steps (3) through (8) convict it. So wherever prediction works, rational choice goes empty, and as prediction spreads, the very idea of acting rat