prompt: |-
  I'm teaching a mid-level undergrad seminar on distributive justice — 16 students, one 80-minute session. They've had some Rawls but haven't hit the "equality of what?" debate yet (welfare vs resources vs capabilities), and I'd rather not lecture it at them. Design an in-class activity where they have to actually divide something up and run into the problem themselves: they'll think they're arguing about the right answer to one question, but they should slowly discover they can't even agree what it would MEAN for the distribution to be fair, because no one ever specified equal in terms of what.

  Here's the wrinkle I definitely want built in: after they settle on a first distribution, open a trading phase where the recipients can exchange what they got, and then re-vote on whether the post-trade outcome still counts as fair. Some students will feel the trades wash out the original equalization (so equality of resources is unstable once you respect choice), others will say respecting the trades is the whole point of fairness — and I want the class stuck there, because that's the actual fight.

  Also, somewhere in there I want a playable version of an envy-test style rule — anyone can propose a full bundle swap and the group sees who objects — so they feel what that rule does and doesn't settle.

  Practical requirements: character profiles that pull the metrics apart (a recipient with expensive needs or tastes, one who can't convert the goods into anything they value, one who's content with very little, etc.) — but please make them non-obvious, not the standard textbook examples, and tell me if any of the profiles quietly bake in one side's assumptions, because I don't want the activity rigged. Rules, a timeline that fits 80 minutes, a way to run payoffs without real money, and a debrief that maps what happened onto the actual positions in the debate without me lecturing more than ~10 minutes at the end. Also tell me what will predictably go wrong the first time I run this, and be honest about which parts of the debate the activity just cannot reproduce no matter how well it goes.

  One more thing, and this matters to me: in the debrief notes, keep what's settled clearly separated from what's genuinely contested among people who know this literature — e.g. flag where you're just giving me a standard gloss vs where scholars actually still disagree (whether the capabilities metric can even be operationalized is I think one of these but you'd know better). I don't want to accidentally teach a contested reading as the consensus. If your not sure on something, say so rather than papering over it.
reasoning: |-
  We are designing an in-class activity for a distributive justice seminar. The goal is for students to grapple with the "equality of what?" question by trying to distribute resources and then trading, leading to a debate about whether post-trade equality is fair.

  Key elements:
  1. Distribute something (not money) to avoid immediate monetary valuation.
  2. Include character profiles with diverse needs, abilities, and preferences that pull apart welfare, resources, and capabilities.
  3. After initial distribution, allow trading and then re-vote on fairness.
  4. Incorporate an envy-test: anyone can propose a bundle swap, and the group sees who objects.
  5. Debrief to connect to the theories without lecturing.

  Practical constraints: 80 minutes, 16 students, no real money.

  Structure:
  - Introduction (5 min): Set up the scenario and rules.
  - Group Formation (5 min): Divide into groups of 4 (so 4 groups). Each group gets the same set of 4 character profiles (so each student in the group takes one profile). The profiles are designed so that the group must distribute a set of goods among the 4 profiles.
  - Distribution Phase (20 min): Groups decide how to distribute the goods to the 4 profiles.
  - Trading Phase (15 min): Within each group, the recipients (students role-playing the profiles) can trade the goods they were given.
  - Envy-Test Phase (10 min): Each group runs an envy-test: any member can propose swapping their entire bundle with another. If anyone objects to a swap (meaning they think the swap would make the distribution worse for the person they are representing), the swap doesn't happen. The group then discusses whether the current distribution is envy-free.
  - Group Reporting (10 min): Each group reports briefly on their initial distribution, trades, and the outcome of the envy-test. They also report on whether they think the final distribution is fair and why.
  - Debrief (15 min): Instructor-led discussion connecting to the theories.

  Total: 5+5+20+15+10+10+15 = 80 minutes.

  The Resource: "Survival Kits" for a hypothetical scenario (e.g., a week in a remote research station). The kit contains:
  - Water purification tablets (10 tablets, each purifies 1 liter)
  - High-energy meal bars (10 bars, each provides 800 calories)
  - Portable solar charger (1 unit, can charge devices for 4 hours per day)
  - First-aid supplies (1 kit, with bandages, painkillers, etc.)
  - Entertainment pack (1 tablet with pre-loaded movies and books, battery lasts 5 hours)
  - Warm clothing (1 set, including jacket, hat, gloves)

  These goods are chosen because they can be converted into different things (health, nutrition, comfort, leisure) and because they are divisible to some extent.

  Character Profiles (each group gets the same 4 profiles):

  1. **Aisha (High Metabolism & Allergies):**
     - Has a fast metabolism and requires 3000 calories per day to maintain energy (most people need 2000). 
     - Allergic to the standard meal bars (they cause a severe reaction). However, she has brought her own specialized meal bars (which are not part of the distribution) that require water to prepare. She needs clean water to prepare them and to stay hydrated.
     - Values: water purification tablets highly, but the meal bars are useless to her. She also values the solar charger to communicate with her doctor (needs 1 hour of charge per day). She doesn't care much for entertainment and is fine with the cold.

  2. **Ben (Injured and Tech-Dependent):**
     - Suffered a leg injury and needs painkillers regularly (from the first-aid kit). Also, he relies on a medical device (a brace) that requires charging (uses 2 hours of charge per day). 
     - He is a big eater but can manage with 2000 calories. 
     - He is very sensitive to cold and must have the warm clothing. 
     - He doesn't need the entertainment pack because he plans to sleep a lot.

  3. **Chloe (Minimalist and Content):**
     - Has a very efficient metabolism (only needs 1200 calories a day). 
     - She is hardy and doesn't mind the cold. 
     - She loves reading and movies and wants the entertainment pack to stay sane. 
     - She doesn't have any medical issues. 
     - She can use the solar charger to keep the entertainment tablet running, but only needs 2 hours of charge per day for that. 
     - She is content with little but values her leisure.

  4. **Diego (Prone to Illness and Social):**
     - Has a weak immune system and must avoid contaminated water (so water purification is critical). 
     - He is very social and hates being alone; the entertainment pack is less valuable to him because he prefers talking. However, if he has the entertainment pack, he can use it to video-call others. 
     - He runs cold and needs the warm clothing, but if he can't get it, he can manage by staying active (but that burns extra calories). 
     - He needs the standard 2000 calories. 
     - He also needs the first-aid kit because he is prone to cuts and infections.

  Note: These profiles are designed to create trade-offs. For example:
  - Aisha needs water purification but not meal bars. Ben needs the first-aid kit and warm clothing. Chloe wants entertainment and can get by with less. Diego needs water purification and might need clothing or extra calories if he can't get clothing.

  The distribution is of the entire survival kit. The group must divide the items among the four profiles. Some items are divisible (water tablets, meal bars) and some are not (solar charger, first-aid, entertainment, clothing).

  Rules for Distribution:
  - The divisible items (water tablets and meal bars) can be split arbitrarily (even fractions if needed). The rest are indivisible and must go to one person.
  - The group must assign all items.

  Trading Phase:
  - After the distribution, the four profiles (played by the students) can trade with each other. They can trade any items (divisible or not) in any way they agree to. They can trade for future promises? -> No, only the goods on hand. Trading is voluntary and must be mutually agreed upon.
  - Time: 15 minutes.

  Envy-Test Phase:
  - The group tests for envy: each member, in turn, can propose to swap their entire bundle with any other member. The other members (as their characters) can object to the swap if they think the swap would make the person they are representing worse off. If anyone objects, the swap does not happen. Note: The objection is not about whether they want the swap for themselves, but whether they think the person whose bundle is being swapped would be worse off. However, the test is typically defined as: a distribution is envy-free if no individual prefers someone else's bundle to their own. So we can run it by asking: does anyone prefer someone else's bundle? If yes, then there is envy. But to make it interactive, we can have each person state if they envy any other bundle. Then, if they do, they can propose a swap, but the swap only happens if the other party agrees? Or in the standard test, we don't actually swap, we just note envy.

  To make it playable, let's do:
  - Each student (as their character) says: "I envy [Name]'s bundle because ..." or "I do not envy anyone."
  - Then, if someone envies, they can propose a swap to the person they envy. That person can accept or refuse. If they refuse, the swap doesn't happen. But note: the envy test doesn't require swaps to happen, it just identifies envy.

  We want them to feel what the rule does: an envy-free distribution is one where no one wants to swap. But after trading, they might have achieved an envy-free state? Or not.

  After the trading phase, we run the envy-test by having each student (for their character) state:
  - "I would rather have [Name]'s bundle than my own." (if they envy) or 
  - "I am happy with my bundle and don't want anyone else's." (if not)

  Then the group notes if there is any envy.

  Group Reporting: Each group reports:
  - How they initially distributed the goods.
  - What trades occurred.
  - Whether the final distribution is envy-free (by the above test).
  - And whether they think the final distribution is fair.

  Debrief: The instructor connects the activity to the theories. Key points to draw out:
  - Initial distribution: Students might have tried to equalize resources (same number of items? same types?) or meet needs (give water to Aisha and Diego, give first-aid to Ben, etc.). This reflects the resource-based view vs. welfare (satisfying preferences) or capabilities (enabling functionings).
  - After trading: Some will say that trading respects individual choices and thus the outcome is fair (freedom to exchange). Others will note that the initial distribution might have been unfair and trading just made it worse (e.g., if someone traded away something they needed because they didn't value it, they might end up worse off). This mirrors the debate between resource egalitarians (Dworkin) and welfare/capability theorists.
  - The envy-test: An envy-free distribution is a resource-based criterion. But note that even if no one envies, it doesn't mean welfare is equal (Chloe might be very happy with little, while Diego might be miserable even with a lot). Also, the envy test doesn't account for the fact that some people have different abilities to convert resources into welfare (Aisha can't use the meal bars, so she might envy someone with water even if she has the same number of items).

  Theories to map:
  - Welfare egalitarianism: Equality of happiness or preference satisfaction. (But note: expensive tastes problem.)
  - Resource egalitarianism: Equality of resources (Rawls's primary goods, Dworkin's auction). The trading phase is like Dworkin's idea of using a market after an initial auction.
  - Capability approach (Sen, Nussbaum): Equality of capabilities (freedoms to achieve functionings). In this scenario, capabilities might be about having the means to achieve health, nutrition, comfort, etc.

  Points of debate in the literature:
  - Can capabilities be operationalized? (Sen says it's a framework, not a specific metric. Nussbaum proposed a list, but it's controversial.)
  - The problem of expensive tastes: Should we compensate people who have expensive needs? (Dworkin's distinction between preferences and handicaps.)
  - The trade-off between freedom and equality: Allowing trading respects freedom but may lead to inequality.

  What will go wrong:
  - Groups might get stuck in the distribution phase and not finish in time. Solution: Keep the time strict.
  - The trading phase might be dominated by assertive students. Solution: Encourage each student to role-play their character's needs.
  - The envy-test might be confusing: When someone says they envy, and then they propose a swap, but the other person refuses, it might not be clear what that means. Clarify that the test is about identifying envy, not forcing swaps.
  - Some groups might not see the point and just distribute equally without considering needs. The profiles are designed to make that problematic, but it might happen. Then the trading phase becomes critical.
  - The debrief might run over time. Solution: Keep the reporting very brief (1-2 minutes per group).

  Debrief Structure (10-15 minutes):
  1. Ask groups: What was your initial distribution goal? (Equal resources? Meeting needs?) How did you decide?
  2. After trading, did the distribution become more fair or less? Why?
  3. Did the envy-test reveal any problems? Was the final distribution envy-free? If so, is that sufficient for fairness?
  4. Then connect:
     - Initial distribution without trading: like Rawlsian primary goods or resource equality.
     - Trading: like Dworkin's market mechanism. But note that Dworkin's auction includes insurance for handicaps, which we don't have here. So people with expensive needs (Aisha) might not be compensated enough.
     - Envy-free: A resource-based criterion, but doesn't ensure equal welfare or capabilities.
     - Capabilities: How do we measure what each person can achieve? (e.g., Aisha without water cannot achieve nutrition, even if she has meal bars? Actually, she has her own meal bars but needs water to prepare them.) So she needs water to convert her own resources (her meal bars) into functioning.

  Contested points to flag:
  - Operationalizing capabilities: There is no consensus on a list of capabilities. Nussbaum's list is one proposal, but others exist. It's hard to measure and compare capabilities.
  - Expensive tastes: Should we compensate for expensive preferences? Dworkin says no, unless they are unchosen (like a medical condition). But the boundary between preference and handicap is fuzzy.
  - The role of responsibility: Should we hold people responsible for their choices (like trading away something they later regret)? This is a key point between luck egalitarians and others.

  Profile Assumptions:
  - Aisha: Assumes that having an allergy is a handicap (unchosen) and thus she deserves compensation? But note, she brought her own meal bars, so she has a way out, but it requires water. This might be seen as a resource deficit in water. This profile doesn't bake in a particular theory; it just creates a need.
  - Ben: Clearly has a medical need (injury) and a need for warmth. This is a handicap.
  - Chloe: Has low needs and is content. This might illustrate the problem of welfare equality: if we equalize welfare, she would get fewer resources. But if we equalize resources, she might be very happy. So this profile shows the divergence between resources and welfare.
  - Diego: Has a mix of needs (health and social). He might be seen as having expensive tastes if he really needs the warm clothing? But his immune system is a handicap.

  None of these profiles are rigged to favor one theory. They are designed to create conflicts.

  Payoffs: Since we don't have real money, the payoff is the survival kit itself. The students are role-playing and trying to survive the week. We don't need to quantify welfare. The goal is to set up a situation where the distribution matters for the characters' well-being.

  Timeline adjustment: We have 4 groups of 4. The activity might run tight. Alternatively, we could do 2 groups of 8, but that might be too big. Stick with 4 groups of 4.

  Materials: Print character profiles and the list of goods for each group.

  Instructions for the groups: 
  - "You have 20 minutes to distribute the survival kit items among the four characters. Remember, each character has different needs and preferences. You must assign every item."
  - Then: "Now, the characters can trade items. You have 15 minutes to negotiate trades. Each trade must be voluntary."
  - Then: "Now, we will test for envy. Each of you, as your character, say: 'I envy [Name]'s bundle because...' or 'I do not envy anyone.' If you envy someone, you can propose a swap to that person. They can accept or refuse. If they refuse, the swap does not happen. Then we note if the distribution is envy-free (no one envies anyone)."

  Reporting: 
  - Each group has 2 minutes to report: 
     - How they distributed initially? 
     - What trades happened? 
     - Is the final distribution envy-free? 
     - Do they consider it fair?

  Debrief: 
  - Start by asking: "What did you think was the goal of the initial distribution? Did your group try to make everyone equally happy, or give everyone the same amount of stuff, or meet everyone's basic needs?" 
  - Then: "After trading, did the distribution become fairer? Why or why not?" 
  - Then: "Did the envy-test help? If a distribution is envy-free, is it fair?" 
  - Then, connect to the theories: 
     - "In distributive justice, we have different metrics: 
          - Welfare: about happiness or preference satisfaction. 
          - Resources: about the allocation of goods. 
          - Capabilities: about what people are able to do or be." 
     - "The trading phase is like a market: it allows people to adjust their bundles to their preferences. But note that if the initial distribution didn't account for different needs (like Aisha's allergy), then trading might not help because she might have to trade away something valuable to get water. This is like Dworkin's idea of using a market after an initial equal distribution, but he also includes insurance for handicaps." 
     - "The envy test is a resource-based criterion. But it doesn't tell us about welfare or capabilities. For example, Chloe might be happy with a small bundle and not envy anyone, but Aisha might need a lot of water to be equally well-off." 
  - Finally, note the ongoing debates: 
     - "Scholars still debate whether we can measure capabilities in a way that's practical for policy. Also, there's a debate about responsibility: should we compensate people for bad luck (like allergies) but not for their choices (like trading away water)? How do we draw that line?"

  This should fit in 10-15 minutes of debrief.

  Predictable problems:
  - Time: The distribution phase might take longer than 20 minutes. Be strict with time. If a group hasn't finished, they can do a quick equal split and then trade.
  - Trading might be minimal. Encourage by reminding students of their profiles' needs.
  - The envy-test might be underutilized. Encourage students to think about whether they are happy with their bundle.

  This activity won't capture:
  - The full complexity of Dworkin's auction and insurance markets.
  - The philosophical nuances of responsibility (e.g., what counts as a choice).
  - The problem of interpersonal comparisons of welfare (how do we compare how happy Chloe is to how happy Ben is?).

  But it will create a lived experience of the "equality of what?" problem and set the stage for the theoretical debate.
answer: |-
  ### Distributive Justice In-Class Activity: "The Survival Kit Dilemma"  
  **Objective:** Students confront the "equality of what?" problem by distributing resources, trading, and testing for envy. They experience firsthand how fairness depends on unstated metrics (welfare, resources, capabilities).  

  **Time:** 80 minutes  
  **Students:** 16 (divided into 4 groups of 4)  
  **Materials:**  
  - 4 identical "Survival Kits" (one per group). Each kit contains:  
    - **Water Purification Tablets** (10 tablets, each purifies 1L of water)  
    - **Nutrition Bars** (10 bars, each provides 800 calories)  
    - **Solar-Powered Charger** (1 unit; 3 hours of charge daily)  
    - **First-Aid Kit** (1 kit; bandages, painkillers, antibiotics)  
    - **Entertainment Tablet** (1 tablet; preloaded with books/movies, 5-hour battery)  
    - **All-Weather Gear** (1 set; jacket, boots, gloves)  
  - **Character Profile Cards** (1 set per group; profiles described below).  
  - **Timer** (for strict phases).  

  **Setup (5 min):**  
  1. Divide students into 4 groups.  
  2. Distribute one Survival Kit and one set of Character Profile Cards to each group.  
  3. Explain the scenario: *"Your group is stranded in a remote wilderness research station for one week. You must divide this survival kit among 4 characters. After dividing, you’ll trade items. Your goal is a fair distribution—but you decide what ‘fair’ means."*  

  ---

  ### Character Profiles (Subtly Asymmetric Needs)  
  **Design Notes:** Profiles avoid obvious textbook tropes (e.g., no wheelchair users or diabetics) and subtly embed tensions:  
  - **Dr. Aris Thorne (Field Biologist):**  
    - *Needs:* High caloric intake (3000+ calories/day) due to strenuous activity. Prone to infections (needs antibiotics in First-Aid Kit). All-Weather Gear is useless (already has a lab coat).  
    - *Preferences:* Hates idle time; Entertainment Tablet is worthless. Solar Charger is critical for research equipment.  
    - *Tension:* High resource needs, but low welfare gain from leisure. **Bakes in?** None—high needs are work-induced, not innate "handicap."  

  - **Kai Chen (Meditation Guide):**  
    - *Needs:* Very low calories (1200/day). Tolerates cold (no gear needed). First-Aid Kit is irrelevant (uses natural remedies).  
    - *Preferences:* Values solitude; Entertainment Tablet causes distress. Water tablets are vital (collects rainwater for rituals).  
    - *Tension:* Minimal resource requirements, but high welfare sensitivity. **Bakes in?** Challenges welfare egalitarianism (happiness with less).  

  - **Riya Kapoor (Tech Journalist):**  
    - *Needs:* Standard calories (2000/day). Chronic migraines (needs painkillers). Weak immune system (needs antibiotics).  
    - *Preferences:* Solar Charger and Entertainment Tablet are essential (work requires connectivity). Water tablets are low-priority (trusts local water).  
    - *Tension:* Resources don’t align with capabilities—e.g., water tablets useless without "trust" capability. **Bakes in?** Highlights conversion factors (Sen).  

  - **Elias Morgan (Retired Veteran):**  
    - *Needs:* Moderate calories (2000/day). Severe arthritis (needs All-Weather Gear for warmth). First-Aid Kit is redundant (brings own painkillers).  
    - *Preferences:* Entertainment Tablet is life-saving (combats PTSD). Solar Charger is optional. Nutrition bars are inedible (jaw injury; needs soft food—*but kit has none*).  
    - *Tension:* Goods can’t meet needs without trading—forcing debates on compensation. **Bakes in?** None—unmet needs arise from context, not "choice."  

  **Why Profiles Work:**  
  - No profile is purely "disadvantaged"; all have mismatched needs/goods.  
  - Tensions are non-obvious (e.g., Elias’s jaw injury isn’t immediately visible).  
  - Pulls apart metrics:  
    - *Welfare:* Kai is happy with little; Elias suffers without entertainment.  
    - *Resources:* Equal splits leave Aris hungry and Riya unable to work.  
    - *Capabilities:* Riya can’t convert water tablets to health without trust.  

  ---

  ### Activity Phases (55 min total)  
  #### 1. **Distribution Phase (20 min)**  
  - *Task:* Groups assign Survival Kit items to their 4 characters.  
  - *Rules:*  
    - Divisible items (tablets, bars) can be split. Indivisible items (charger, tablet, gear, first-aid) go to one person.  
    - No trading yet. Groups must reach consensus.  
  - *Predicted Conflict:* Groups will debate "fairness":  
    - Some aim for equal calories/resources.  
    - Others prioritize urgent needs (e.g., Aris’s calories, Elias’s warmth).  
    - **Hidden Problem:** They haven’t defined *what* to equalize.  

  #### 2. **Trading Phase (15 min)**  
  - *Task:* Characters trade items freely. Students role-play their profile’s needs.  
  - *Rules:*  
    - Trades must be voluntary. No coercion.  
    - After trading, groups record final bundles.  
  - *Predicted Conflict:*  
    - Kai trades away nutrition bars for water tablets (welfare gain).  
    - Elias trades First-Aid for Entertainment (but now lacks medicine).  
    - **Key Wrinkle:** Some will argue post-trade distribution is "more fair" (respects choice); others say trades mask initial unfairness (e.g., Riya "had to" trade painkillers).  

  #### 3. **Envy-Test Phase (10 min)**  
  - *Task:* Groups run an envy test.  
  - *Rules:*  
    - Any character can propose swapping their *entire bundle* with another.  
    - If any group member objects (i.e., believes the swap would harm either character), the swap is vetoed.  
    - Test until no swaps are proposed or all are vetoed.  
  - *Debrief Question:* "Is the final distribution envy-free? Is that the same as fair?"  
  - *Predicted Outcome:*  
    - Envy-test may "pass" (no one wants to swap), but welfare disparities remain (e.g., Elias is miserable; Kai is content with less).  
    - Students see envy-test only checks resources, not welfare/capabilities.  

  #### 4. **Group Reporting (10 min)**  
  - Each group shares:  
    a. Initial distribution strategy.  
    b. Key trades and why they happened.  
    c. Envy-test result and whether post-trade distribution is "fair."  
  - **Sample Responses:**  
    - *Group 1:* "We equalized calories first, but after trades, Elias got entertainment but lost painkillers—fair?"  
    - *Group 2:* "Envy-test passed, but Riya still can’t work—is that fair?"  

  ---

  ### Debrief (15 min + 5 min buffer)  
  **Goal:** Map the activity to theory *without lecturing*. Use Socratic questions to draw out connections.  

  #### Step 1: What Happened? (5 min)  
  - Ask:  
    - *"What did ‘fair’ mean in your initial distribution? Equal stuff? Equal happiness? Meeting needs?"*  
    - *"After trading, did fairness improve? Why or why not?"*  
    - *"Did the envy-test settle disagreements? What did it miss?"*  
  - **Link to Theory:**  
    - Initial distribution → Rawlsian primary goods (resources).  
    - Post-trade fairness → Dworkin’s equality of resources + markets.  
    - Envy-test → Resource-metric fairness (no interpersonal envy).  

  #### Step 2: The Core Debate (5 min)  
  - Pose: *"You argued about fairness, but never defined ‘equal what.’ Let’s label your positions:"*  
    - **Equality of Welfare:** "Fairness = equal happiness." (Kai’s contentedness vs. Elias’s suffering).  
    - **Equality of Resources:** "Fairness = equal goods." (But trading exposed instability—e.g., Elias traded away medicine).  
    - **Capabilities Approach:** "Fairness = freedom to achieve functionings." (Riya couldn’t convert water to health; Aris lacked capability to work without the charger).  

  #### Step 3: Contested Issues (5 min)  
  **Flag settled vs. debated scholarship:**  
  - **Settled Insights:**  
    - Resources ≠ welfare (e.g., Kai vs. Elias).  
    - Markets respect choice but amplify initial inequalities (Dworkin is uncontested here).  
    - Envy-test doesn’t ensure welfare/capability equality (consensus).  
  - **Genuinely Contested Debates:**  
    - *Can capabilities be measured?* **Unresolved.** Sen/Nussbaum lack operational consensus (e.g., Riya’s "trust" isn’t quantifiable).  
    - *Responsibility for preferences:* **Hotly debated.** Should Elias get extra for PTSD? Dworkin says yes (unchosen); Cohen says no (expensive taste).  
    - *Is welfare a viable metric?* **Rejected by most** due to "expensive tastes" (e.g., Aris’s high calories).  
  - **Honest Limitations of Activity:**  
    - Cannot replicate Dworkin’s hypothetical insurance market.  
    - Oversimplifies "conversion factors" (e.g., Riya’s social trust).  
    - Doesn’t address structural injustice (e.g., why Elias has PTSD).  

  ---

  ### Predictable Problems & Mitigation  
  1. **Time Crunch:**  
     - Groups rush distribution. *Mitigation:* Enforce strict timers; skip reporting details if needed.  
  2. **Dominant Personalities:**  
     - Assertive students override quiet ones. *Mitigation:* Assign roles; remind them to role-play profiles.  
  3. **Superficial Trades:**  
     - Groups avoid trading. *Mitigation:* Seed Elias’s jaw injury subtly—force trades for soft food (which doesn’t exist).  
  4. **Misinterpreting Envy-Test:**  
     - Students confuse "no envy" with "fairness." *Mitigation:* Ask: *"If no one envies, is everyone equally well-off?"*  
  5. **Oversimplifying Theory:**  
     - Students conflate capabilities with needs. *Mitigation:* In debrief, stress: "Capabilities = freedoms (e.g., Riya’s ability to trust water), not goods."  

  **Outcome:** Students leave frustrated by the lack of a "right" answer—which is the point. The activity forces them to see that distributive justice begins with defining the metric, not applying a formula.
