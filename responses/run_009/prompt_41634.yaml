prompt: |-
  I'm a software engineer who sits on the committee that decides engineering promotions at my company, and a decision from our last cycle is still bothering me. Two colleagues on the same team were both considered. One had led a greenfield project that leadership had already flagged as strategic; it shipped, he presented it at the all-hands, and promoting him was an easy call under our rubric. The other had spent the year maintaining a critical but unglamorous system, absorbed most of the team's on-call load, and quietly unblocked a dozen other engineers. Almost none of that maps onto the rubric's "scope" and "impact" categories, so she wasn't promoted. When she pushed back, our director defended the process: same rubric for everyone, written criteria, no politics, so outcomes track merit as closely as anything could. Her reply has stuck with me. She said the rubric doesn't just measure contribution, it decides what counts as contribution — and that her teammate's supposedly superior "impact" was largely that he happened to be assigned the project leadership already cared about, while she happened to be assigned the work everyone depends on but nobody watches. I don't have a philosophy background, so I may be missing something basic here, but I genuinely can't tell whether her complaint is the modest one that our rubric is badly calibrated and could be fixed by crediting maintenance and support work, or the deeper one that no rubric-based process can deliver what "we promote on merit" promises, because what we're calling merit is manufactured by the very system that claims to detect it. Which is it, and is there a principled way for the committee to respond to her argument rather than just tweaking categories or feeling bad?
reasoning: |-
  Okay, the user is a software engineer on a promotion committee facing a dilemma. Two colleagues were up for promotion: one led a high-visibility greenfield project and got promoted easily, while the other handled critical maintenance and on-call duties but didn't meet the "scope/impact" criteria. The rejected colleague argued that the rubric doesn't just measure contribution but defines what counts as contribution, suggesting systemic bias.

  First, I need to unpack her argument. She's not just saying the rubric is flawed; she's pointing to a deeper philosophical issue about how merit is constructed. The promoted colleague's impact was visible because leadership already deemed it strategic. Her work, though essential, wasn't valued by the rubric. This challenges the neutrality of "merit."

  The user wonders if this is a calibration problem or a fundamental flaw in rubric-based systems. To answer, I should differentiate between the two. Calibration issues can be fixed by adjusting criteria. The deeper critique is about how systems privilege certain work, making merit subjective and self-reinforcing.

  Next, I need to consider why this matters. The user's role involves fair promotions, affecting team morale and retention. Ignoring this could demotivate maintainers, leading to burnout or turnover. The director's defense of "same rubric, no politics" misses the point that the rubric itself might be biased.

  The user's explicit questions are whether the complaint is about calibration or a systemic issue, and how to respond. But their deeper needs likely include wanting a just process, maintaining team cohesion, and ensuring essential work is recognized. They might also need actionable steps to address this without overhauling the system.

  Historical context shows similar debates. In academia, "publish or perish" favors new research over teaching. In software, visible projects often overshadow maintenance. This pattern suggests it's a systemic issue, but fixable by redefining merit criteria.

  I should outline a principled response. Acknowledge the colleague's point: merit isn't neutral. Then, adjust the rubric to value maintenance, using specific metrics. Also, educate the committee on bias towards visibility. Propose adding maintenance examples to the rubric and assessing impact beyond leadership's spotlight.

  Finally, emphasize that while no system is perfect, improving the rubric can better align with actual merit. The key is recognizing that the process shapes what's valued, and addressing that consciously.
answer: |-
  Your colleague has articulated a profound critique that cuts to the heart of merit-based systems. Her complaint is **both** modest *and* deep – but the depth is more significant. Here's the breakdown and a principled response framework:

  ### 1. **The Modest Critique (Calibration Flaw)**
     - **The Issue:** Your rubric likely overvalues *novelty, visibility, and direct alignment with pre-defined leadership goals* while undervaluing *sustainability, risk mitigation, and enabling others*. This is common in tech promotion systems.
     - **Fixable:** Yes, explicitly adding criteria for "system stewardship," "operational excellence," "enabling peer productivity," and "reducing systemic risk" could capture her contributions. Metrics like "reduced incident frequency," "on-call burden reduction," "documentation improvements," or "peer testimonials on unblocking" could be integrated.

  ### 2. **The Deep Critique (Systemic Construction of "Merit")**
     - **The Core Insight:** Your colleague is correct. **"Merit" isn't an objective substance the rubric neutrally detects; the rubric actively defines and constructs what "merit" is within your organization.** By prioritizing certain outputs (shipping new features) and contexts (projects leadership flags), it implicitly devalues equally vital work (maintenance, support) that lacks those attributes.
     - **The Consequence:** This creates a self-reinforcing cycle:
       1. The rubric defines high-merit work as "strategic greenfield projects."
       2. Ambitious engineers seek those projects to get promoted.
       3. Essential maintenance work becomes "where we put people who aren't promotion material."
       4. The system confirms its bias: "Look, the high-impact people *are* the ones doing the greenfield work!"
     - **The Philosophical Point:** This is about **epistemic justice**. Whose perspective defines "impact"? Leadership (focused on new initiatives) or the engineers (who know the system collapses without maintenance)? Your rubric privileges the former. Her work is only "low impact" *because the rubric defines impact narrowly*.

  ### 3. **Which Critique Dominates?**
     The deep critique is more fundamental. **Calibrating the rubric addresses the symptom (her work wasn't valued), but accepting the deep critique changes how you *think* about the rubric itself.** It reveals that "promoting on merit" isn't a neutral scientific process; it's a value-laden social process where the definition of "merit" is itself a choice with profound consequences for who succeeds and what work gets done.

  ## A Principled Response Framework for the Committee

  Don't just tweak categories *or* abandon rubrics. Engage with the critique systematically:

  1.  **Acknowledge the Validity of the Critique Publicly:**
      *   **To Her:** "Your feedback about how the rubric defines what counts as contribution, rather than just measuring it, is incredibly important. It highlights a potential blind spot in how we value different types of essential work. We are taking this seriously."
      *   **Internally:** Frame the discussion around her core insight: "Does our rubric *define* merit in a way that systematically advantages certain types of work/assignments and disadvantages others, regardless of true value to the company?"

  2.  **Conduct a "Work Valuation" Audit:**
      *   Map *all* critical activities required for the team/company to function (including maintenance, firefighting, debugging, mentoring, documentation, on-call).
      *   Objectively assess the **actual business impact** of each type of work:
          *   **Prevented Losses:** What outages were avoided? What productivity losses were prevented by keeping systems stable? What security breaches were mitigated?
          *   **Enabled Productivity:** How much faster did other teams ship because they were unblocked? How much engineering time was saved by good maintenance?
          *   **Reduced Risk:** What single points of failure were removed? What technical debt was reduced, preventing future slowdowns?
      *   **Compare:** How well does the *current* rubric capture the *actual* impact identified in this audit?

  3.  **Redesign the Rubric with Expanded Epistemology:**
      *   **Explicitly Value "Sustaining Impact":** Create parallel tracks or categories alongside "Strategic Scope/Impact." Examples:
          *   **Operational Excellence:** Sustaining critical systems, reducing toil, improving reliability (SLOs), bearing on-call burden effectively.
          *   **Enabling & Amplifying Impact:** Unblocking others (peer feedback crucial), improving developer experience, knowledge sharing, mentoring.
          *   **Systemic Risk Reduction:** Paying down critical technical debt, improving observability, automating recovery.
      *   **Require Evidence Beyond Visibility:** How do you *measure* the impact of preventing a disaster? Use metrics (MTTR reduction, incident count decrease), peer/customer testimonials, documented examples of unblocking, and qualitative narratives explaining the *potential* negative impact that was avoided.
      *   **Decouple "Impact" from "Leadership Attention":** Build criteria that assess impact *relative to the domain*, not just global visibility. The impact of keeping the payment system running 24/7 might be higher than shipping a new feature on a non-core product, even if the latter gets an all-hands spot.

  4.  **Reframe the Committee's Role:**
      *   **From "Rubric Enforcers" to "Impact Interpreters":** The rubric is a tool, not an oracle. The committee's role is to holistically interpret evidence of impact *within the context of the work being done*. A maintainer's "scope" might be the entire fragile system they preserve; their "impact" is the uninterrupted operation enabling *everyone else's* work.
      *   **Challenge Confirmation Bias:** Actively ask: "Is this work only visible because it was pre-declared strategic, or does it have fundamental value? Is *this* essential work being overlooked because it lacks a spotlight?"
      *   **Consider Assignment Equity:** While assignments are necessary, the committee should be aware if certain types of critical work consistently derail promotion paths. Advocate for rotating high-value/high-visibility assignments.

  5.  **Address the Director's Defense:**
      *   **"Same Rubric"**: Argue that applying the *same* rubric fairly only works if the rubric *itself* fairly values *all* high-impact contributions. A flawed rubric applied fairly produces systemically unfair outcomes. "Same" ≠ "Fair" if the definitions are biased.
      *   **"Written Criteria, No Politics"**: Acknowledge this is good, but insufficient. Well-written criteria can still embed bias. "No politics" is desirable, but ignoring systemic bias in the criteria *is* a form of political blindness. The solution isn't politics, it's better criteria.
      *   **"Outcomes Track Merit"**: Point out the circularity exposed by your colleague: "If the rubric defines merit, outcomes will always 'track' it, even if the definition excludes vital contributions. We need to ensure our definition of merit tracks *actual organizational value*."

  **In essence:** Your colleague exposed that your "meritocracy" is likely a **moralized feedback loop**. The rubric defines merit based on what leadership currently values most visibly, promotions reward that, reinforcing the idea that only that work is meritorious, discouraging essential but undervalued work.

  The principled response is **not to abandon the rubric, but to democratize the definition of "merit" within it.** Rigorously analyze the *full spectrum* of critical work and its *demonstrable business impact*, then redesign the rubric to explicitly value that spectrum. This moves you closer to a system where "merit" genuinely reflects the diverse contributions necessary for organizational success, not just the most glamorous ones. It requires harder work from the committee – valuing unseen work demands better evidence gathering and interpretation – but it fosters a healthier, more sustainable engineering culture where essential work isn't a career dead end.
