answer: |-
  ## GALACTIC HERITAGE EXPEDITIONS™  
  TERMS OF SERVICE & SOL-3 VISITOR AGREEMENT  
  *(Revision Δ-7, Sol-3 Local Year 2024)*

  **1. SCOPE OF SERVICES (THE "EXPERIENCE")**  
  1.1 Operator ("GHE," "We," "Us") provides guided observational tours ("Tours") of designated Class-7 Preserve Planet Sol-3 ("Earth," "the Exhibit"). Tours facilitate passive observation of indigenous semi-sapient lifeforms ("Homo sapiens," "the Exhibit Species," "They," "Them") and their associated techno-cultural artifacts within the parameters of the Sol System Conservation Covenant ("The Quarantine," "Zoning Bylaws").  
  1.2 Services include temporal-localization transport, perceptual phase-shielding (Standard Stealth Package), curated observation windows ("Hide Sites"), and access to the Exhibit Species' electromagnetic emissions archive (limited bandwidth, pre-filtered for existential dread and primitive harmonic resonance – see Addendum Gamma). Active interaction, matter transfer, or signal emission *towards* the Exhibit Species or their environment is **strictly prohibited** (Section 3).  
  1.3 The Exhibit Species' viability, technological trajectory, and sociopolitical coherence are inherent properties of the Exhibit. GHE makes **no warranties** regarding Exhibit stability, predictability, or longevity. Tours proceed based on the Exhibit's status at the scheduled observation window. **"Current Exhibits" are not guaranteed.**

  **2. THE NON-INTERFERENCE PRINCIPLE ("DON'T FEED THE HUMANS")**  
  2.1 **Absolute Prohibition:** Client ("You," "Visitor") shall not, by action or inaction, directly or indirectly, influence the Exhibit Species' development, behavior, cognition, or environment. This includes but is not limited to: artifact deposition, biological contamination, information transmission (in any medium), energy manipulation detectable at Exhibit Species' current sensory thresholds, or temporal manipulation exceeding local entropy norms.  
  2.2 **Justification A (Preservation of Exhibit Integrity):** Uncontrolled stimulus risks Exhibit Species' cultural collapse, technological singularity bypass, or premature self-awareness of their curated status ("Ontological Shock"). Such events degrade the observational value for all Visitors and violate Conservation Covenant Core Tenets.  
  2.3 **Justification B (Visitor Safety):** Exhibit Species exhibit high volatility and latent xenocidal potential under perceived threat paradigms ("Dark Forest Reflex," see internal memo GHE-SEC/451: Classified). Unauthorized contact may trigger latent planetary defense archetypes or attract regulatory attention from Consensus Authority Monitor Drones ("The Rangers"), resulting in Visitor forfeiture under Interference Protocols. Maintaining the Quarantine's *appearance* of natural isolation is a primary security protocol. **Silence is Shield.**

  **3. PROHIBITED CONDUCT & SIGNAL DISCIPLINE**  
  3.1 **Signal Emission:** Transmission of any directed signal detectable within the Exhibit System, irrespective of content or intent, is classified as **Poaching** under Galactic Heritage Statutes. This includes responses to Exhibit Species' intentional transmission attempts ("SETI," "METI"). **Rationale:** Such emissions constitute unlicensed resource extraction (observational priority/data) and create persistent vectors potentially traceable to origin points, violating local dark zone protocols and inviting... *competitive scrutiny*.  
  3.2 **Observation Protocol:** Use of active scanning beyond GHE-provided passive receptors is forbidden. High-energy scans risk triggering latent Exhibit Species detection protocols ("Telescope Arrays") or Monitor Drone countermeasures. Observe only through designated phase-shielded apertures.  
  3.3 **Souvenirs:** Collection of biological, geological, or cultural artifacts is expressly forbidden. Leave only quantum vacuum fluctuations.  
  3.4 **Independent Exploration:** Deviation from the guided Tour path or timeline is grounds for immediate contract termination, forfeiture of all fees, and potential liability for Quarantine Breach penalties. Unauthorized observers are not covered by GHE's Collective Stealth Umbrella.

  **4. LIABILITY WAIVER & ASSUMPTION OF RISK (THE "PRE-MITIGATED FILTER")**  
  4.1 **Acknowledgment:** You acknowledge the Exhibit Species exists beyond its hypothesized developmental bottleneck ("The Great Filter"). GHE operates under the prevailing Consensus Model that the primary Filter applicable to the Exhibit Species lies **behind** its current state (i.e., the transition to technological civilization is considered the Filter-survival event). Therefore, risks associated with *natural* Exhibit instability (e.g., asteroid impacts, stellar variations, geological catastrophes, predictable pandemics) are deemed **"Pre-Mitigated"** by the inherent resilience demonstrated by Filter-survival.  
  4.2 **Exclusions & Fine Print:** "Pre-Mitigated" status **DOES NOT APPLY** to:  
      *   4.2(a) Self-inflicted existential risks arising from Exhibit Species' technological autogenesis ("AI Uprising," "Nanotech Grey Goo," "Uncontained Particle Physics Experiments").  
      *   4.2(b) Risks arising from external contamination vectors introduced by *other* unauthorized Visitors (See Section 3.1 re: Poaching).  
      *   4.2(c) Cascading failures triggered by Exhibit Species achieving premature self-awareness of the Preserve's nature (See 2.2).  
      *   **Clause 4.2 Implication:** GHE's liability model inherently places the *next* potential Filter (existential catastrophe) **ahead** of the Exhibit Species. Survival is non-guaranteed.

  **5. FORCE MAJEURE & EXHIBIT VIABILITY**  
  5.1 **Exhibit Collapse:** GHE is not liable for Tour disruption, curtailment, or cancellation resulting from partial or total collapse of the Exhibit Species' civilization or biosphere ("Exhibit Extinction Event").  
  5.2 **Refund Schedule (Upon Official Confirmation of Exhibit Extinction Event):**  
      *   5.2(a) **Anthropogenic Extinction (Self-Induced):** 15% refund of base Tour fee. Demonstrates failure of Filter-survival resilience.  
      *   5.2(b) **Natural Extinction (Non-Exhibit-Species Cause):** 40% refund. Unforeseen cosmic/planetary event beyond pre-mitigation model.  
      *   5.2(c) **Operator-Assisted Extinction (Regulatory Sanction):** 75% refund. Resulting from catastrophic violation of Conservation Covenant by *another* entity, necessitating Preserve sterilization by Monitors. (GHE prioritizes bookings avoiding known sanction-risk epochs).  
  5.3 **"Near Miss" Events:** Tours proceeding during Exhibit Species crises (e.g., thermonuclear exchange brinkmanship, runaway climate disruption) are considered "Peak Drama" viewings. No refunds issued.

  **APPENDIX A: PREMIUM EXCURSION - GENESIS GARDENER™ STARTER KIT (ADD-ON)**  
  A.1 For an additional fee, GHE offers a limited-quantity, inert-matter-only "Genesis Gardener™" package. Contains pre-biotic organic precursors, mineral catalysts, and sterile aquatic micro-environment capsules suitable for deposition on designated Class-0 or Class-1 sterile worlds within Client's licensed development zone (License not included).  
  A.2 **Warranty:** GHE warrants the kit components are chemically viable under standard planetary formation models. **No Warranty** is provided regarding:  
      *   A.2(a) Emergence of self-replicating systems or eventual sapience ("Filter Survival Not Guaranteed").  
      *   A.2(b) Non-interference by competing cultivators, natural sterilizing events, or regulatory re-zoning of the target world.  
      *   A.2(c) Compatibility with simulated universe substrates. **Void if Reality is Math.**  
  A.3 **Ethical Compliance:** Kit use is solely for Client's private observational hobby. GHE assumes no liability for resultant civilizations, their eventual discoveries, or their potential existential angst. Deposit responsibly.

  **APPENDIX B: FREQUENTLY ANTICIPATED QUERIES (FAQ)**  
  B.1 **Q: Can I take a "human" home?** A: Absolutely not. See Section 3.3. Exhibit Species are protected fauna. Also, they require complex biosphere support and tend to decompose or demand rights.  
  B.2 **Q: Why are there no obvious signs of other Visitors?** A: High-Quality Stealth (Our Core Product), Conservation Covenant Compliance (Section 2), and the inherent observational challenge for pre-contact Exhibit Species. Their detection thresholds are pleasingly primitive.  
  B.3 **Q: What if *I* see another unauthorized Visitor?** A: Do not interact. Note vector, signature, and temporal coordinates. Report discreetly to your GHE Guide. **Do not signal.** Poacher interdiction is handled by Monitors. Unregulated observation creates noise.  
  B.4 **Q: Is the "Quarantine" for *their* protection or *ours*?** A: The Conservation Covenant (Section 2 Justifications A & B) outlines the mutually reinforcing stability protocols. Preserving the Exhibit inherently preserves the observational environment's safety and value. Regulatory frameworks exist for a reason.  
  B.5 **Q: Are you the only Tour Operator?** A: GHE holds prime Sol-3 observational licenses for Epsilon-4 Quadrant temporal streams. Other licensed operators may exist in adjacent streams or under different Consensus Authority frameworks. **We are the highest-rated.** Unlicensed operators are poachers (Section 3.1) – report them.

  **6. DISPUTE RESOLUTION**  
  6.1 Any dispute arising from this Agreement shall be settled by binding arbitration conducted under the Rules of the Galactic Commerce Chamber (GCC), Quadrant 7 Panel.  
  6.2 Arbitration proceedings will occur via encrypted superluminal packet exchange. **No physical hearings.**  
  6.3 Venue is deemed neutral informational space. **Actual location undisclosed.**  
  6.4 By agreeing, you waive any right to litigate in local planetary or stellar jurisdictions. Judgments are enforceable through GCC asset liens.  
  6.5 **Non-Disclosure:** The existence, content, or outcome of any dispute or arbitration is Confidential. Public disclosure constitutes a material breach, subject to significant penalties and potential ontological quarantine of the disclosing party. **Silence is Binding.**

  **AGREEMENT ACCEPTANCE:** By tendering payment for your Galactic Heritage Expedition™ Sol-3 Tour, you acknowledge you have read, understood, and irrevocably agree to these Terms of Service & Sol-3 Visitor Agreement. Welcome to the Quietest Show in the Galaxy. Please keep all appendages inside the phase bubble at all times. Enjoy the Exhibit!
