prompt: |-
  I recently moved from volunteer coordination into a role directing donor communications at a mid-sized environmental charity, and I've discovered that the job is largely the applied psychology of giving: every appeal I sign off on is a bundle of tactics sitting somewhere on a line between persuasion and manipulation, and I can't keep working from gut feelings. Here are my gut verdicts on tactics that our fundraising consultants have either recommended or used for years, and I want to know whether one principle captures them or whether some verdicts have to go:

  1. The annual appeal tells the story of a specific family whose smoky cookstove was replaced with a clean-burning one. The family is real and the program is real, but my gift doesn't literally buy their stove — it goes into the general fund, and the story was written before the appeal was sent. Verdict: fine. It's a true representative story about what money like mine does.
  2. The matching-gift campaign announces that a generous donor will match all gifts "only until midnight Friday," when in fact the matching donor has committed a fixed sum that gets used whether or not the deadline is met. Verdict: I go back and forth on this one — I keep landing on "not fine," but I can't fully articulate why, since the matching really does happen.
  3. Appeal envelopes printed in a child's handwriting font with "Please help my forest" on the front. There is no particular child. Verdict: fine, honestly — it's just design, like using a warm color scheme.
  4. Urgency framing throughout the year: "tonight," "before it's too late," for conservation needs that are in fact chronic and unchanging. Verdict: fine.
  5. Our phone officers, following the rapport techniques from a workshop we sent them to, are told to mirror the donor's emotional language back to them, and to call at the times our donor data says each person is most receptive. Verdict: fine — this feels like trained skill; our best officers have always done it naturally.
  6. A vendor proposal to replace that system with an algorithm that assembles each donor's appeal from a library of story fragments, image choices, and send times chosen to maximize that individual's predicted giving. Same underlying psychological levers as the phone program, just automated and personalized at scale. Verdict: not fine, it feels creepy — though I half-know this is hard to square with my verdict on the phone officers.
  7. A renewal notice deliberately styled to look like a second notice ("FINAL REMINDER — respond immediately") when it is in fact the first. Verdict: not fine.

  I can't tell whether the human-versus-automation distinction is doing real work in my verdicts on 5 and 6, or whether it's a prejudice I should drop, and I can't tell whether the pattern is really something like "engaging deliberation versus exploiting it" or something about false implicature instead. Please give me a table whose columns are: Case number; my verdict; the verdict under the single best principle you can construct; the verdict under your best runner-up; and, for whichever principle you recommend, which of my verdicts it must overturn to fit. After the table, state the recommended principle precisely, note which case motivates each clause, and give its verdict on two tactics I haven't mentioned: (a) A/B-testing appeal subject lines until we find the one that reliably maximizes giving, then using it on everyone; and (b) a phone officer truthfully telling a wavering major donor that others in her giving circle have already stepped up this year.
reasoning: |-
  Hmm, the user has moved into donor communications at an environmental charity and is grappling with the ethics of fundraising tactics. They've listed seven specific practices with their gut reactions and want to know if there's a consistent ethical principle that can guide these decisions. They're particularly troubled by the tension between persuasion and manipulation, and they're questioning whether their distinction between human vs. automated tactics (cases 5 and 6) is valid.

  Looking at their verdicts: They're comfortable with representative stories (case 1), emotional design (case 3), and urgency framing (case 4) despite knowing these aren't literally true in the moment-to-moment sense. They reject the fake final notice (case 7) and feel uneasy about the matching gift deadline (case 2). The human rapport-building (case 5) gets approval while the algorithmic version (case 6) feels "creepy" - that inconsistency seems to bother them.

  The core tension appears to be between effectiveness and authenticity. Fundraising inherently uses psychological triggers, but some tactics cross into deception. The human/automation distinction might be a red herring - what matters is whether the tactic creates false beliefs or merely frames truth effectively.

  For a unifying principle: "No exploitation of epistemic vulnerabilities" covers most cases. It would allow representative stories (case 1) since donors understand how charities use funds, but prohibit the fake deadline (case 2) because it creates false urgency. The child handwriting (case 3) and chronic urgency (case 4) would be acceptable as they're conventional framing. Human rapport (case 5) stays fine since it's skill-based persuasion, while the algorithm (case 6) might become acceptable if donors know about personalization. The fake final notice (case 7) clearly exploits inattention.

  For the additional tactics: A/B testing subject lines (a) would be fine under this principle as long as no deception is involved. Truthfully mentioning peer giving (b) is acceptable social proof - problematic only if implying false urgency or exclusivity.

  The runner-up principle about "deliberation vs exploitation" is less precise - it might incorrectly condemn effective framing like the child handwriting. The key is protecting donors' ability to make informed decisions, not shielding them from all emotional appeals.

  This approach overturns the user's verdict on case 6 (the algorithm) if transparency is maintained, and forces clearer reasoning about case 2 (matching gift deadline). The discomfort with automation might stem from opacity - if donors knew about the personalization, it might feel less "creepy."
answer: |-
  Based on your cases, the core tension lies in **protecting donor autonomy by avoiding deception versus leveraging psychological framing ethically**. After analyzing your verdicts and common ethical frameworks (e.g., Beauchamp & Childress' principles, Cialdini's persuasion ethics), the best unifying principle is:

  **Principle of Epistemic Fairness:**  
  *Fundraising tactics must not exploit epistemic vulnerabilities (e.g., ignorance, inattention, cognitive biases) to create false beliefs or impressions that would materially alter a donor’s giving decision if corrected. Representative framing, emotional appeals, and urgency are permissible if contextually truthful and conventional for the medium.*

  ### Analysis Table
  | Case | Your Verdict | Under Epistemic Fairness | Under Deliberation Preservation (Runner-Up) | Verdict Change Required |
  |------|--------------|--------------------------|--------------------------------------------|--------------------------|
  | 1    | Fine         | ✅ Fine                  | ✅ Fine                                    | None                    |
  | 2    | Not Fine     | ❌ **Not Fine**          | ❌ Not Fine                                | None                    |
  | 3    | Fine         | ✅ Fine                  | ⚠️ **Not Fine** (Exploits heuristic)      | None for primary        |
  | 4    | Fine         | ✅ Fine                  | ⚠️ **Not Fine** (Exploits urgency bias)   | None for primary        |
  | 5    | Fine         | ✅ Fine                  | ✅ Fine                                    | None                    |
  | 6    | Not Fine     | ⚠️ **Fine** (If transparent) | ❌ Not Fine                              | **Overturn to Fine**    |
  | 7    | Not Fine     | ❌ Not Fine              | ❌ Not Fine                                | None                    |

  **Runner-Up Principle: Preservation of Deliberative Autonomy**  
  *Tactics must engage donors' rational deliberation rather than bypassing it through heuristic exploitation. Urgency, social proof, or emotional triggers that suppress reflection are unethical.*

  ---

  ### Why Epistemic Fairness Works Best
  1. **Truthful Representation (Clause 1)**  
     - *Motivated by Cases 1 & 3:* Stories/images are ethical if they accurately represent impact (Case 1). Child handwriting (Case 3) is conventional design, not literal deception.  
     - *Verdicts:* ✅ Case 1, ✅ Case 3.

  2. **No False Belief Exploitation (Clause 2)**  
     - *Motivated by Cases 2 & 7:* Fake deadlines (Case 2) create false urgency. "FINAL REMINDER" (Case 7) implies a prior notice that doesn’t exist. Both materially mislead.  
     - *Verdicts:* ❌ Case 2, ❌ Case 7.

  3. **Contextual Conventionality (Clause 3)**  
     - *Motivated by Cases 4 & 5:* Chronic urgency (Case 4) is an industry-standard framing for ongoing needs. Rapport-building (Case 5) uses accepted interpersonal skills without deception.  
     - *Verdicts:* ✅ Case 4, ✅ Case 5.

  4. **Scale/Automation Neutrality (Clause 4)**  
     - *Motivated by Case 6:* Algorithmic personalization (Case 6) is ethical **if** donors know data is used for tailoring (e.g., privacy policy). "Creepiness" stems from opacity, not the tactic itself.  
     - *Verdict:* ✅ Case 6 **(overturns your verdict)**.

  ---

  ### Verdicts on New Tactics
  **(a) A/B-Testing Subject Lines & Standardizing**  
  - ✅ **Fine under Epistemic Fairness:** Optimizing language doesn’t create false beliefs. It’s equivalent to choosing a warm color scheme (Case 3).  

  **(b) Phone Officer Mentions Peer Giving**  
  - ✅ **Fine under Epistemic Fairness:** Truthful social proof leverages psychology without deception. Unethical *only* if implying exclusivity ("only you haven’t given") falsely.

  ---

  ### Key Takeaway
  Your discomfort with automation (Case 6 vs. 5) is likely about **transparency**, not ethics. The matching gift deadline (Case 2) feels manipulative because it **manufactures false scarcity**. Epistemic Fairness resolves this by focusing on whether a tactic *corrects* donor understanding upon disclosure. If a donor would feel misled ("I gave because I thought the match expired Friday!"), it’s unethical. Fundraising isn’t unethical persuasion—it’s **storytelling with impact**. What makes it manipulation is **lying about the stakes**.
