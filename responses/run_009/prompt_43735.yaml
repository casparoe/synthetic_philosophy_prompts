prompt: |-
  I work in digital imaging — colour management, specifically. My day job is building ICC profiles and gamut-mapping pipelines for a print shop, so the vocabulary I actually think in is stuff like device-dependent versus device-independent colour spaces, metamerism, rendering intents, lookup tables, calibration targets, the standard observer functions, opponent-channel encodings. I took a philosophy of mind course as an undergrad and recently got drawn back into Dennett's "Quining Qualia" after a friend mentioned it, and I have a decent grip on his main moves: the coffee tasters who can't tell whether the coffee changed, their taste changed, or their standards changed; the apple-sorting machine; his claim that qualia as classically conceived — ineffable, intrinsic, private, directly apprehended — are an incoherent posit, so that e.g. the inverted spectrum intuition can't even be stated properly. But I keep reading it through my work goggles, and I want to know how far that gets me.

  So here's the ask: restate Dennett's case in the vocabulary of colour science and digital imaging, as faithfully as you can. His four properties of qualia — what do they look like as claims about colour pipelines? I'd guess ineffability maps onto something like the impossibility of communicating a device-dependent experience without a shared reference medium, privacy onto the fact that no two observers share a spectral response, the "directly apprehended" bit onto what a monitor shows before any transform is applied... but I might be smuggling in assumptions, so do the translation yourself rather than just grading my guesses. Include the coffee taster thought experiment: what is that puzzle, exactly, when restated as a question about profiling and drift? Is it just the classic problem of distinguishing sensor drift from calibration-target drift from a change in the rendering intent — or is something left over?

  Then I want the residue report, which honestly is the part I care about most. Which of Dennett's arguments translate cleanly, which come across only distorted, and which have no expression at all in my vocabulary? And the direction question: where something doesn't survive the translation, does that point to something colour science and imaging genuinely cannot say (some fact about the first-person point of view that my framework is blind to), or does it suggest the original claim was less clear than it looked — that "what it's like" talk was never really well-defined in the first place, a bit like people asking for the "true colour" of a patch before specifying an illuminant and an observer? I'm agnostic and want to be pushed one way or the other, not fobbed off with "both sides have a point".

  A couple of format things: answer in British English (so "colour" not "color" throughout, which I know is annoying given how much of this literature is American), and please write it as continuous prose only, like an email to a colleague — no headings, no bullet points, no bold or tables. Two or three typoes on my side are my own fault, don't copy them. Length-wise I'd rather have something meaty that takes its time than a compressed summary, since half the value for me is seeing how the translation handles the hard cases rather than just the headline.
