prompt: |-
  I'm taking an undergraduate course in democratic theory, and last week we covered the Condorcet jury theorem. The way it was presented, if each member of a large electorate is even slightly more likely than not to judge correctly on some question — even 51% reliable — then as the number of voters grows, the probability that the majority judgment is correct approaches one. My professor mentioned in passing that this result is sometimes treated as the mathematical backbone of epistemic democracy, and that its assumptions do a lot of quiet work, but we ran out of time before saying what that work is.

  Afterwards my friends and I got into an argument about what the theorem actually licenses. It seems obvious to me that if a majority of millions of voters is almost certainly right whenever each voter has even a slight edge over a coin flip, then for contested factual questions — say, whether a particular vaccine causes a serious side effect at some low rate, or whether a proposed minimum wage increase would raise unemployment in a mid-sized city — a national referendum should strictly dominate deferring to a panel of a few dozen experts: the theorem guarantees the referendum's near-certain correctness, while a small panel enjoys no such asymptotic guarantee, and the theorem itself tells us that more voters is always better. My friends think this is obviously crazy, but when I pressed them they couldn't point to where the reasoning breaks. Can you settle this: who is right, and if they are, what exactly is wrong with the referendum argument?
reasoning: |-
  Okay, let me start by unpacking the user's question. They're studying democratic theory and came across the Condorcet Jury Theorem (CJT). They understood that if each voter is even slightly more than 50% likely to be correct, then as the group size increases, the majority vote becomes almost certainly correct. The user then argues that for factual questions, like vaccine side effects or minimum wage impacts, a national referendum should outperform a small expert panel because of CJT's guarantees. Their friends think this is flawed, but can't explain why. The user wants to know who's right and where their reasoning breaks down.

  First, I need to recall CJT's assumptions. The theorem assumes voters are independent and have identical competence (same probability of being correct). Also, they all vote sincerely on the same binary question. The user's application to real-world referendums likely violates these assumptions. Let me break down each violation.

  Independence is tricky. In reality, voters are influenced by common information sources, media, or social networks. This creates correlation in their votes. If voters aren't independent, CJT's convergence might not hold. Even small correlations can drastically reduce the probability that the majority is correct. So, in a referendum, shared misinformation could lead the majority astray despite large numbers.

  Next, identical competence. CJT assumes every voter has the same p>0.5. But in reality, competence varies. Some voters might be well-informed, others not. If many voters are incompetent (p<0.5), they could drag down the majority. The theorem doesn't account for varying p. The average competence might be above 0.5, but if the distribution is skewed, the majority's correctness might not improve as expected.

  The binary question assumption is another point. Real policy issues are rarely simple yes/no. Vaccines causing side effects or minimum wage effects are complex, multifaceted issues. Voters might interpret the question differently, or the issue might have nuances that a binary vote oversimplifies. This can lead to errors not accounted for in CJT.

  Also, voter behavior: CJT assumes sincere voting. But in referendums, strategic voting, misinformation campaigns, or emotional biases can affect votes. People might vote based on ideology rather than facts, reducing their actual competence on the factual question.

  Now, comparing to expert panels. Experts have higher individual competence (p much higher than 0.5). Even a small group with high p can be very reliable. Plus, experts can deliberate, share insights, and correct each other, which isn't captured in CJT's independent voting model. Referendums lack mechanisms for informed deliberation, leading to lower average competence.

  The user's point about asymptotic guarantees misses that CJT requires ideal conditions not met in reality. For millions of voters, if average p drops below 50% due to misinformation, the theorem doesn't apply. Meanwhile, experts maintain high p even in small groups. 

  Also, practical aspects: organizing referendums is costly and slow. For urgent or complex issues, expert panels are more efficient. Moreover, voters might not engage deeply with the issue, relying on heuristics or influencers, further reducing competence.

  The user and their friends both have points. The user is theoretically correct under CJT's strict assumptions, but in practice, those assumptions fail. The friends recognize the impracticality but couldn't articulate why. The key is the violation of independence and identical competence, plus real-world complexities that CJT doesn't address. Expert panels, through deliberation and higher expertise, often outperform large electorates in factual accuracy despite smaller size.
answer: |-
  Your argument is logically sound *under the strict assumptions of the Condorcet Jury Theorem (CJT)*, but your friends are right to be skeptical because **those assumptions almost never hold in real-world referendums on complex factual questions.** Here's the breakdown:

  1.  **Your Argument (Under CJT Assumptions):**
      *   CJT states: If voters are:
          *   **Independent** (their votes aren't influenced by each other or common biases),
          *   **Competent** (each has probability `p > 0.5` of being correct),
          *   **Sincere** (vote according to their judgment),
          *   Facing a **single, well-defined binary question** (True/False, Yes/No),
      *   Then: As the number of voters `n` increases, `P(Majority Correct) -> 1`.
      *   Therefore: For large `n` (millions), majority is almost certainly correct.
      *   Conclusion: Large referendum >> small expert panel.

  2.  **Where the Real World Breaks CJT (and Your Argument):**

      *   **Violation of Independence (The Biggest Problem):**
          *   **Reality:** Voters are *not* independent. They are exposed to the *same* information sources, media narratives, social media echo chambers, political campaigns, and misinformation/disinformation campaigns.
          *   **Consequence:** Errors become *correlated*. If a viral piece of misinformation sways 40% of the electorate, those 40% are all likely to be wrong *together*, making it far harder for the majority to be correct even with millions of voters. CJT crucially *requires* statistical independence; correlated errors can cause `P(Majority Correct)` to plateau well below 1 or even *decrease* with `n` if the correlation is strong enough relative to the average competence. Shared biases are poison to CJT.

      *   **Violation of Identical Competence (`p` is not constant and >0.5 for all):**
          *   **Reality:** Voter competence (`p_i`) varies wildly. On complex questions like vaccine side effects or minimum wage economics:
              *   Some voters have expertise (`p_i` very high).
              *   Many voters have low information or misunderstanding (`p_i` close to 0.5 or even *below* 0.5!).
              *   The *average* competence `p_avg` might be *below* 0.5 for highly technical issues. CJT doesn't guarantee convergence if `p_avg <= 0.5`.
          *   **Consequence:** CJT's convergence relies on the *assumption* that every single voter has `p_i > 0.5`. If a significant portion has `p_i < 0.5` (especially if their errors are correlated), the theorem fails. More uninformed voters can *actively make the outcome worse*.

      *   **Violation of the Binary Question Assumption:**
          *   **Reality:** Questions like "Does vaccine X cause side effect Y at rate Z?" or "Will policy A cause outcome B?" are rarely truly binary in the minds of voters. Interpretation varies. Voters might conflate different aspects, misunderstand the question, or answer based on related feelings (e.g., distrust of pharma companies rather than the specific safety data).
          *   **Consequence:** The premise of a single, clear-cut factual judgment shared by all voters breaks down. Voters aren't all answering the *same* question in the *same* way.

      *   **Violation of Sincerity/Competence Link:**
          *   **Reality:** Voters don't always vote based on a sincere attempt to find the factual truth. Motivated reasoning, ideology, identity, emotions, and strategic considerations heavily influence votes. A voter's `p_i` for the *factual question* might be irrelevant if they vote based on tribal loyalty or perceived social benefits.
          *   **Consequence:** The "competence" parameter `p` in CJT assumes voters are *trying* to be correct. If they aren't primarily motivated by factual accuracy, their `p` for the factual question isn't meaningfully >0.5.

      *   **The Nature of Expertise:**
          *   **Deliberation & Correction:** Expert panels don't just vote independently like CJT assumes. They *deliberate*. They share evidence, challenge assumptions, correct individual errors, and refine their understanding. This process often significantly boosts the group's competence *beyond* the average individual `p_i` and helps break correlated errors *within* the panel. A referendum lacks this error-correcting mechanism.
          *   **High Individual Competence:** Experts on a panel are selected *because* their individual `p_i` is *much* higher than 0.5 on their specific domain question. While CJT doesn't give an *asymptotic guarantee* for a small panel, a panel of 50 experts each with `p=0.8` has a `P(Majority Correct)` extremely close to 1 *already* (thanks to the high starting `p`). Millions of voters with an *average* `p` barely above 0.5 (which is optimistic for complex facts) and correlated errors may perform *far worse*.
          *   **Access to Information & Processing:** Experts have the training, time, and resources to access, understand, and process complex, nuanced information that is inaccessible or incomprehensible to the average voter.

  3.  **Why the Referendum Argument Fails in Practice:**

      *   **Low Average Competence:** On complex technical issues, the average voter's `p_i` might be distressingly close to 0.5, or even below it, due to lack of specialized knowledge, cognitive biases, and susceptibility to misinformation.
      *   **High Correlation:** Widespread misinformation campaigns, dominant media narratives, and social influence create massive correlations in voter errors. This destroys the "law of large numbers" benefit CJT relies on.
      *   **Expert Superiority:** A small group of genuine experts has a vastly higher *baseline* competence (`p_i >> 0.5`) and mechanisms (deliberation) to further improve accuracy, making them reliably correct *without* needing millions of votes. Their `p` isn't just slightly above 0.5; it's substantially higher.

  **Conclusion:**

  *   **You are technically correct *only* under the idealized, unrealistic assumptions of the CJT:** independence, universal minimal competence (`p_i > 0.5`), sincerity, and a clear binary question.
  *   **Your friends are correct about the real world:** For complex, contested factual questions, these assumptions collapse, especially due to **correlated errors** and **low/variable voter competence**. This breaks the guarantee that a large referendum will be highly accurate.
  *   **The Referendum vs. Expert Panel:** On complex technical facts, a small panel of genuine, deliberating experts will almost always be *more* reliable than a large referendum of the general public. The experts' high individual competence and ability to correct errors through deliberation outweigh the sheer numbers of the public, whose average competence is likely low and whose errors are highly correlated. CJT is a powerful theoretical result, but its idealized assumptions make it a weak foundation for justifying referendums on complex factual matters against expert judgment. Epistemic democrats relying on CJT typically argue for *institutional designs* that *foster* conditions closer to its assumptions (e.g., deliberation, diverse information sources), not for simple majoritarian referendums.
