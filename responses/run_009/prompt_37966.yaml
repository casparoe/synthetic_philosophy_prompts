answer: |-
  Here's a breakdown of the core desiderata for epistemic utility functions/scoring rules, their motivations, contentiousness, conflicts, and which ones do the heavy lifting:

  ### Core Desiderata & Motivations
  1.  **Truth-Directedness (Veritism):**
      *   **What:** Credences closer to the truth-value (1 for true, 0 for false) score better than those further away. Scoring rule rewards proximity to truth.
      *   **Motivation:** The fundamental aim of belief is truth/avoiding falsity (core epistemic value). Seems non-negotiable for *any* epistemic utility.
      *   **Contention:** Widely accepted as a genuine constraint. Critics of *pure* veritism might argue it's *necessary but insufficient*.

  2.  **Propriety (Strict Propriety):**
      *   **What:** Every probabilistically coherent credence function expects itself to score at least as well as any other credence function (and strictly better than incoherent ones). No coherent credence "expects" to do better by switching to another specific credence *by its own lights* (Immodesty).
      *   **Motivation:** Prevents deliberate miscalibration ("epistemic bribes"). Ensures rationality doesn't demand holding a credence you *know* (expect) is suboptimal. Central to vindicating probabilism.
      *   **Contention:** **The workhorse.** Genuine constraint for many, but critics argue it's *too strong* or encodes contentious assumptions (like requiring coherent agents to be *risk-averse* in a specific way w.r.t. epistemic utility). Accuracy-firsters see it as essential for rationality.

  3.  **Extensionality / Truth-Value Dependence:**
      *   **What:** The score for a credence in a proposition depends *only* on the credence value and the proposition's *actual truth-value*, not on the proposition's content, meaning, or logical relations to other propositions.
      *   **Motivation:** Epistemic utility should be about fit with *truth*, not semantic content. Simplicity. Avoids smuggling in external values.
      *   **Contention:** **Highly Contentious.** Accuracy-firsters present it as "obvious" (it's baked into standard scoring rules like Brier). Critics argue it's a *smuggled assumption* that ignores relevant epistemic differences (e.g., scoring a complex logical truth vs. "this coin landed heads").

  4.  **Logical Invariance (Consequence):**
      *   **What:** Logically equivalent propositions must receive the same credence for optimal scoring. If `P` entails `Q`, credence in `Q` shouldn't be less than credence in `P` for optimality.
      *   **Motivation:** Required to vindicate probabilism (specifically, the axioms of non-negativity and monotonicity). Seems rationally compelling – believing a conjunction more than one of its conjuncts is bad.
      *   **Contention:** Genuine constraint *if* you accept probabilism. However, its derivation often *relies* on Extensionality + Strict Propriety, making it a point of attack for critics who reject Extensionality (see Conflict below). Creates tension with Preface Paradox.

  5.  **Separability / Additivity:**
      *   **What:** The overall score for a credence function over a set of propositions is the *sum* (or average) of the scores for each individual proposition.
      *   **Motivation:** Tractability. Simplicity. Allows focusing on individual credences. Mathematically convenient.
      *   **Contention:** **Major Smuggling.** Often presented as a "natural" starting point. Critics argue it's a substantial and unwarranted assumption that ignores holistic aspects of belief systems (e.g., understanding, explanatory coherence). Central to the "too atomistic" critique of accuracy-first.

  6.  **Immodesty (covered under Strict Propriety):**
      *   **What:** No coherent credence function judges any *other specific* credence function as superior to itself in expectation.
      *   **Motivation:** Rationality requires thinking your own epistemic state is best, given your current beliefs. Prevents self-defeat.
      *   **Contention:** Intuitively plausible as a rationality constraint. Tightly linked to Strict Propriety. Genuine constraint for many.

  7.  **(Weaker Requirement) No Logical Omniscience Demand:**
      *   **What:** The scoring rule shouldn't require agents to *know* all logical truths or consequences to be rational. Optimal scores shouldn't *require* credence 1 in all tautologies or credence 0 in all contradictions *if the agent hasn't deduced them*.
      *   **Motivation:** Recognizes human cognitive limitations. Rationality is about responding appropriately to *available* evidence, not being logically perfect.
      *   **Contention:** Widely accepted as necessary. Accuracy-first aims to satisfy this by making *probabilistic coherence* the requirement, not full logical omniscience (though Logical Invariance pushes towards coherence).

  ### Key Conflicts (Joint Unsatisfiability & Tensions)

  1.  **Extensionality + Strict Propriety => Logical Invariance (Costly Consequence):**
      *   **The Conflict:** As you recall, Extensionality + Strict Propriety *entail* Logical Invariance. If the score *only* cares about credence value and truth-value, then logically equivalent propositions (which always share the same truth-value) *must* receive the same credence for optimality (else you could exploit the difference for a "bribe" violating propriety). **This is the core cost.**
      *   **The Problem (Preface Paradox):** In the preface, you rationally believe each book claim (high credence) but also believe at least one is false (high credence in negation of the conjunction). Logical Invariance demands you *cannot* consistently hold high credence in each conjunct *and* high credence in the negation of the conjunction. Pure accuracy-first *must* condemn the intuitively rational preface beliefs as incoherent. Critics see this as a reductio against Extensionality or Strict Propriety.

  2.  **Separability vs. Holistic Goods (Understanding, Coherence):**
      *   **The Conflict:** Separability explicitly rules out scoring based on relations *between* beliefs. Critics argue genuine epistemic value includes understanding, explanatory power, or non-separable coherence, which require violating Separability.
      *   **The Problem:** A scoring rule satisfying Separability *cannot* directly reward an agent for grasping how beliefs fit together or provide a unified explanation, only for individual credence-truth matches. Accuracy-firsters counter that probabilism *is* the relevant coherence, captured by propriety.

  3.  **Strict Propriety vs. Alternative Epistemic Values:**
      *   **The Conflict:** If you add a distinct epistemic good (e.g., "understanding score") to accuracy, the *combined* utility function might violate Strict Propriety. A probabilistically coherent credence might expect an incoherent one (that scores higher on understanding) to do better overall.
      *   **The Problem:** This undermines the accuracy-first vindication of probabilism via propriety. It suggests coherence isn't *uniquely* rational if other goods are in play. Accuracy-firsters see this as a reason to reject adding distinct goods; critics see it as showing propriety is too restrictive.

  ### The Heavy Lifter: Strict Propriety
  *   **Does the most work:** Strict Propriety is the **linchpin**. It:
      *   Directly rules out incoherent credences (they expect coherent ones to do better).
      *   Is essential for vindicating probabilism (coherence is necessary and sufficient for immodesty under standard accuracy measures).
      *   Is crucial for arguments justifying conditionalization (as maximizing *expected* accuracy).
      *   Forces the conflict with the Preface via Logical Invariance (when combined with Extensionality).
      *   Is the main barrier to incorporating additional epistemic values smoothly.
      *   Defines "immodesty".

  ### Quick Scorecard of Main Views

  1.  **Pure Accuracy-First (e.g., Brier Score, Log Score):**
      *   **Satisfies:** 1 (Truth-Directed), 2 (Strict Propriety), 3 (Extensionality), 4 (Logical Invariance), 5 (Separability), 6 (Immodesty).
      *   **Fails/Struggles With:** 7 (Logical Omniscience Demand - *mitigated* by requiring coherence, not omniscience, but still demands agents *see* logical relations they might not); **Preface Paradox** (condemns rational state as incoherent); **Peer Disagreement** (often requires significant conciliation, arguably too much); **Holistic Goods** (explicitly rejects them).
      *   **Cost:** Strict Logical Invariance via Extensionality.

  2.  **Accuracy + Distinct Coherence/Understanding:**
      *   **Satisfies:** 1 (Truth-Directed), 7 (No Logical Omniscience - often more permissive), better on **Preface** (can allow 'incoherence'), better on **Holistic Goods**.
      *   **Fails:** 2 (Strict Propriety - usually violated for the *combined* score), 6 (Immodesty - may not hold). Often rejects 3 (Extensionality) and/or 5 (Separability).
      *   **Cost:** Loses the clean vindication of probabilism/conditionalization via Strict Propriety/Immodesty. Risk of "anything goes".

  3.  **Calibration-First:**
      *   **Satisfies:** Intuitive for long-run frequency matching. Seems relevant to truth-connection.
      *   **Fails:** 2 (Strict Propriety - strongly violated! Calibration can incentivize *deliberate* incoherence/"bribes"), 6 (Immodesty). Often violates 1 (Truth-Directedness - a well-calibrated credence of 0.5 can be wrong every time!).
      *   **Cost:** Fundamentally incompatible with core rationality constraints (Propriety, Immodesty). Generally dismissed as inadequate for *epistemic* rationality.

  **Conclusion:** The core tension lies between the power and internal rationality guarantees of **Strict Propriety** (driving Logical Invariance) and the desire for more **permissive, holistic, or content-sensitive** accounts that handle the Preface Paradox better and acknowledge cognitive limitations. Pure accuracy-first bites the bullet on the Preface. Critics reject either Extensionality or Strict Propriety (or Separability) to avoid it, but lose the powerful vindication of coherence. There's no free lunch – satisfying all desiderata simultaneously is impossible. Your choice hinges on which costs seem highest.
