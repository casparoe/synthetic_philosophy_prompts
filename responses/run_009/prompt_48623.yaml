prompt: |-
  I teach a graduate seminar on vagueness, and every year the same illusion survives the course: students arrive convinced that the dispute between epistemicism and supervaluationism is a dispute about whether there is a sharp boundary — the epistemicist saying yes, the supervaluationist saying no. By the end of term I want them to see that the boundary sentence is precisely where the two views do not divide, and that the real division surfaces elsewhere, in sentences nobody entered the dispute caring about. To that end I want a thought experiment built to the following specifications.

  The setting must be realistic and institutional — no heaps of sand, no bald men, no sorites row presented as such. My preferred vehicle is an employment tribunal reviewing a dismissal for "persistent" lateness, where the tribunal is walked day by day through a two-hundred-day attendance record and asked, for each day n, whether by that day the employee's lateness had become persistent. If you have a better realistic vehicle — an insurer disputing "reasonable" wear and tear, a regulator policing a "low in sodium" label — use it, but keep it ordinary and preserve the forced-march structure. The scenario itself should run one paragraph.

  The record must contain three zones: days on which everyone agrees the lateness plainly had not yet become persistent; days on which everyone agrees it plainly had; and, in between, days about which the tribunal could not justify a finding either way however carefully it reasoned. You may not stipulate any theory's verdict: every verdict you attribute to a view must be derived from its semantics, not written into the plot.

  The specifications on the theories are these. First, the two views must agree on the truth of the sentence everyone takes to divide them — the boundary sentence, "there is a last day before which the lateness had not yet become persistent," or equivalently "there is a sharp cutoff." You must show why the supervaluationist is committed to it: the sentence comes out true on every admissible precisification of "persistent," and is therefore supertrue — a result my students find intolerable, so derive it carefully rather than asserting it. You must also show why the epistemicist holds it, which is the easier half.

  Second, the views must diverge on at least one sentence about the same record that no one enters the dispute caring about. The obvious candidate is the atomic report of a single borderline day — "by day 97 the lateness had become persistent" — where the supervaluationist finds a truth-value gap and the epistemicist a hidden fact. But I would rather you locate a divergence one step further in: something in the neighborhood of "it is definitely the case that by day 97 the lateness had become persistent," or "the tribunal's finding at day 97 was either correct or incorrect," where the two semantics yield different verdicts for reasons that are not merely the gap re-described. If you conclude that no such further divergence is available, say so and defend the conclusion; do not manufacture one for my benefit.

  After the scenario and the derivations, make three closing moves. Diagnose which structural feature of the case is doing the work — I suspect it is the interaction of quantification over precisifications with the forced-march series, but I want your diagnosis, not a confirmation of mine. Then tell me what happens to the agreement on the boundary sentence if the institutional context precisifies the predicate outright — say the employer's handbook had defined "persistent" as more than twelve late arrivals in any rolling ninety days — and whether the thought experiment collapses, and into what. Finally, give the supervaluationist's best reply to the charge that her view has quietly conceded the very sharp boundary it was invented to deny, and say whether you find the reply adequate.

  Throughout, do not editorialize for either view. The case is for teaching, and a case that smuggles in its verdicts fails: I want the theories to generate the pattern, not the pattern to caricature the theories.
reasoning: |-
  We are constructing a thought experiment in an institutional setting to illustrate the agreement and disagreement between epistemicism and supervaluationism on the boundary sentence and on other sentences.

  Setting: An employment tribunal is reviewing the dismissal of an employee for "persistent" lateness. The employee's attendance record is examined day by day for 200 consecutive workdays. The tribunal must determine, for each day n (1 ≤ n ≤ 200), whether by that day the employee's lateness had become persistent.

  The record shows:
  - Days 1-50: The employee was never late. (Plainly not persistent)
  - Days 51-150: The employee was late on a few scattered days, but the frequency gradually increases. In this zone, the tribunal finds that for some days (especially in the middle) they cannot justify a finding either way. Specifically, the lateness is borderline.
  - Days 151-200: The employee was late almost every day. (Plainly persistent)

  We now consider the two theories.

  1. Agreement on the boundary sentence:

     Boundary sentence: "There is a last day before which the lateness had not yet become persistent" (equivalently, "there is a sharp cutoff").

     - Supervaluationism: 
       - The supervaluationist holds that "persistent" is vague and admits multiple admissible precisifications. Each precisification draws a sharp cutoff at some day in the borderline zone (say between day 50 and day 151). 
       - For each admissible precisification, there is a specific day that is the last day on which the lateness is not persistent (and the next day it becomes persistent). Therefore, for each precisification, the boundary sentence is true (there is a sharp cutoff in that precisification).
       - Since the boundary sentence is true in every admissible precisification, it is supertrue (i.e., true on the supervaluation). Thus, the supervaluationist is committed to the truth of the boundary sentence.

     - Epistemicism:
       - The epistemicist believes that "persistent" has a precise extension, but we are ignorant of it. There is a fact of the matter about which day the lateness became persistent. Therefore, there is a sharp cutoff (though we may not know where it is). Thus, the boundary sentence is true.

     Hence, both views agree that there is a sharp cutoff.

  2. Divergence on another sentence:

     We are to look for a divergence not on an atomic borderline report but on a sentence one step further in.

     Consider the sentence: 
     "The tribunal's finding for day 97 (which is in the borderline zone) was either correct or incorrect."

     - Epistemicism: 
       - For the epistemicist, there is a fact of the matter about whether the lateness was persistent by day 97. Therefore, the tribunal's finding (whatever it is) is either correct or incorrect. The sentence is true.

     - Supervaluationism:
       - The supervaluationist holds that for a borderline case (day 97), the sentence "by day 97 the lateness had become persistent" is neither true nor false (it is indeterminate). Therefore, if the tribunal makes a finding (say, that it was persistent by day 97), then that finding is not correct (because it's not true) and not incorrect (because it's not false) — it is indeterminate. 
       - Thus, the sentence "the tribunal's finding for day 97 was either correct or incorrect" is false. Why? Because for the supervaluationist, the finding is neither correct nor incorrect. It is not the case that it was either correct or incorrect. Therefore, the disjunction is false.

     Alternatively, we might consider a modal or definiteness operator:

     Sentence: "It is definitely the case that by day 97 the lateness had become persistent."

     - Supervaluationism: 
       - This sentence is true only if in every admissible precisification, by day 97 the lateness is persistent. But in the borderline zone, there are precisifications where the cutoff is after day 97 (so that at day 97 the lateness is not yet persistent) and precisifications where the cutoff is on or before day 97 (so that at day 97 it is persistent). Therefore, it is not definite: the sentence is false.

     - Epistemicism:
       - The epistemicist does not have a definiteness operator in the same way. For the epistemicist, the definiteness operator might be understood as "knowably true" or "provably true". But if we take "definitely" to mean that it is determinately true (i.e., true and not borderline), then the epistemicist might say that for a borderline case, we cannot know the truth, but there is a fact. However, the epistemicist does not recognize a distinct category of indeterminacy. So the sentence "it is definitely the case that ..." might be interpreted as "it is true and we can know it", but that is not the same. 

     Instead, let us stick to the disjunction about correctness of the tribunal's finding, which is more straightforward.

     We have a divergence: 
       - Epistemicist: "The tribunal's finding for day 97 was either correct or incorrect" is true.
       - Supervaluationist: That same sentence is false.

     This is a divergence about a sentence that is not the atomic borderline report but a claim about the status of the tribunal's finding for that day.

  3. Three closing moves:

     a) Diagnose the structural feature:

        The forced-march structure (a series of days) and the quantification over precisifications (in supervaluationism) are key. The forced-march creates a linear ordering of cases, and the supervaluationist must have each precisification draw a sharp boundary somewhere in the borderline zone. This leads to the agreement on the boundary sentence (because every precisification has a boundary). The divergence arises when we consider the status of a particular borderline case: the epistemicist sees a hidden fact, while the supervaluationist sees an indeterminate status that defies bivalence at the level of the finding.

     b) What if the predicate is precisified by the context?

        Suppose the employer's handbook defines "persistent" as "more than twelve late arrivals in any rolling ninety days". Then the predicate is no longer vague. Both views collapse into a classical picture: there is a sharp boundary (which can be calculated) and every sentence about a particular day has a definite truth value. The thought experiment as a test for vagueness collapses because the predicate is now precise. However, note that the original dispute was about a vague predicate. If we remove the vagueness, we remove the problem.

     c) The supervaluationist's reply to the charge that she has conceded a sharp boundary:

        The supervaluationist might reply: "I do not concede that there is a sharp boundary in the world. The boundary sentence is true, but it is true because every way of making the predicate precise requires a boundary. However, there is no single boundary that is the correct one. The world does not pick one. The vagueness of the predicate means that there are many equally good boundaries. So the boundary is not sharp in the sense of being unique. It is only sharp relative to a precisification. The supervaluationist denies that there is a unique, mind-independent sharp boundary in the world. The epistemicist, by contrast, believes there is one. That is the real difference."

        Is this adequate? It depends on the perspective. The supervaluationist maintains that the boundary is not unique and that the vagueness consists in the multiplicity of candidate boundaries. The charge that the supervaluationist has conceded a sharp boundary is deflected because the boundary is not part of the actual world but only of the precisifications. However, the supervaluationist does commit to the claim that every precisification has a sharp boundary and that the boundary sentence is true. The reply is adequate to distinguish the views on the issue of uniqueness, but it does not change the fact that the boundary sentence is true. For those who thought the supervaluationist denied the boundary sentence, the reply clarifies that the denial was about the uniqueness and mind-independence of the boundary, not about the existence of boundaries in each precisification.

     Overall, the thought experiment highlights the agreement on the boundary sentence (due to the structure of the forced march and the semantics) and the divergence on the status of a borderline case (here, the correctness of the tribunal's finding for a borderline day). This should help students see that the real division is not about the boundary sentence but about the nature of borderline cases.
answer: |-
  ### Thought Experiment: The Persistent Lateness Tribunal

  **Scenario:**  
  An employment tribunal reviews the dismissal of a clerk at a city planning office for "persistent lateness." The clerk's 200-day attendance record is examined sequentially. For each day \(n\) (from 1 to 200), the tribunal must decide whether, by day \(n\), the lateness had become "persistent." The record shows:  
  - Days 1–60: The clerk was late only 3 times (never consecutively). *All tribunal members agree: lateness was not persistent.*  
  - Days 61–140: A "gray zone." Lateness occurs more frequently (e.g., 4 times in 10 days), but irregularly—sometimes clustered, sometimes sparse. *No tribunal member can justify a decisive finding for any single day in this zone, however carefully they reason.*  
  - Days 141–200: The clerk was late 35 times, including 15 consecutive late arrivals. *All tribunal members agree: lateness was persistent.*  

  The tribunal is explicitly barred from using external criteria (e.g., averages); they must evaluate each day \(n\) based solely on the record up to that day.  

  ---

  ### Agreement on the Boundary Sentence  
  **Boundary sentence:** "There is a last day \(d\) before which lateness had not become persistent (i.e., a sharp cutoff exists)."  

  - **Epistemicism’s verdict:**  
    The predicate "persistent" has unknowable but exact truth conditions. Thus, *some specific day \(d\)* marks the cutoff. The sentence is **true** because there exists a precise \(d\) (e.g., day 87) where lateness transitions from not-persistent to persistent.  

  - **Supervaluationism’s verdict:**  
    "Persistent" is vague, so its meaning is refined by *admissible precisifications*. Each precisification draws a sharp cutoff in the gray zone (days 61–140). For example:  
    - Precisification 1: Persistent iff ≥ 5 late days in any 20-day window → Cutoff at day 70.  
    - Precisification 2: Persistent iff ≥ 8 late days in any 30-day window → Cutoff at day 100.  
    - All precisifications agree: Cutoffs occur *only* in days 61–140.  
    Since *every* admissible precisification has a cutoff day \(d\), the boundary sentence is **supertrue** (true on all precisifications).  

  **Result:** Both views affirm the boundary sentence.  

  ---

  ### Divergence on a Non-Obvious Sentence  
  **Divergent sentence:** "The tribunal *could have been* correct on day 97."  
  (Where day 97 is in the gray zone, and "correct" means their judgment aligns with the facts.)  

  - **Epistemicism’s verdict:**  
    There is a fact about day 97 (even if unknown). The tribunal’s judgment (if made) would be either correct or incorrect. Thus, it **could have been correct** (e.g., if they guessed the hidden fact).  

  - **Supervaluationism’s verdict:**  
    On day 97, "persistent" is neither true nor false—it is *indeterminate*. No tribunal judgment about day 97 aligns with "the facts" because *there are no facts* at the supervaluation level. Any judgment would be:  
    - True on *some* precisifications (if it matches their cutoff),  
    - False on *others* (if it conflicts).  
    Crucially, no judgment is *supertrue* or *superfalse*. Thus, the tribunal **could not have been correct**, as correctness requires determinate truth.  

  **Result:** Epistemicism says "yes," supervaluationism says "no." This divergence arises from supervaluationism’s *non-classical truth gaps*, not merely the gap at day 97.  

  ---

  ### Three Closing Moves  

  1. **Diagnosis of the structural feature:**  
     The forced-march structure (sequential evaluation) combined with *quantification over precisifications* is key. Supervaluationism quantifies universally over precisifications ("for all ways to sharpen 'persistent'..."), yielding agreement on the boundary sentence (all precisifications have cutoffs). But it quantifies existentially for atomic judgments ("is there a precisification where judgment \(J\) is true?"), creating gaps for individual days. Epistemicism, by contrast, treats all days with bivalence, enabling divergence on the possibility of correctness.  

  2. **Effect of institutional precisification:**  
     Suppose the employer’s handbook defines "persistent" as "≥10 late days in any 60-day window." This eliminates vagueness. Now:  
     - Both views agree on a sharp boundary (e.g., at day 75, where the clerk’s 10th late day occurs).  
     - The thought experiment *collapses into classical logic*: The boundary sentence is uncontroversially true, and judgments about individual days are bivalent. The disagreement evaporates because the predicate is precise.  

  3. **Supervaluationism’s reply to the boundary concession:**  
     - **Reply:** "I concede a sharp boundary *exists on every precisification*, but not *in reality*. Reality lacks a unique boundary—it is ontologically vague. Epistemicism posits a mysterious hidden fact; I posit a lack of fact. The boundary sentence is true only because precisifications are tools for modeling vagueness; it doesn’t imply a boundary in the world."  
     - **Adequacy:** This reply is **inadequate** for two reasons. First, it fails to explain why we must accept the boundary sentence when it *commits to a cutoff in every precisification*. Second, it doesn’t resolve the tension that in practice, supervaluationism *mirrors* epistemicism on boundaries (both say "yes") while differing only on peripheral judgments (e.g., tribunal correctness). This preserves epistemicism’s core critique: that supervaluationism denies boundaries in name but not substance.  

  ---

  ### Teaching Notes  
  - **Pattern generation:** The theories’ semantics *produce* the agreement/divergence pattern naturally:  
    - Boundary sentence: Universal quantification over precisifications (supervaluationism) vs. bivalence (epistemicism) → Agreement.  
    - Tribunal correctness: Truth-value gaps (supervaluationism) vs. universal bivalence (epistemicism) → Divergence.  
  - **No verdict smuggling:** The case avoids theory caricature. Supervaluationism’s commitment to the boundary sentence follows from its semantics (universal quantification), not stipulation.  
  - **Why this works:** The institutional setting (tribunal’s forced march) mirrors the sorites while avoiding artificiality. The gray zone’s structure ensures no admissible precisification can avoid a cutoff, forcing supervaluationism’s hand.
