      If Death in Damascus: 
          agent in Damascus -> death (utility d)
          agent in Aleppo -> life (utility l)
          and each with 0.5 chance given the pill and given Death in Damascus.

    But note: the state of Death's location is fixed, and then the agent's location is random. So for the state "Death in Damascus", the agent gets:

          0.5 * d + 0.5 * l

    Similarly, for the state "Death in Aleppo", the agent gets:

          0.5 * l + 0.5 * d   [because if Death is in Aleppo, then if the agent is in Aleppo they die, in Damascus they live]

    But wait, that's the same. So:

      EU(take pill) = 0.5 * [0.5*d + 0.5*l] + 0.5 * [0.5*d + 0.5*l] = 0.5*d + 0.5*l

    Without the pill, EU(choose city) = d.

    So EDT also recommends the pill.

  Therefore, both theories agree that taking the pill is better.

  Now, the worries:

  1. Does the value of randomizing show something substantive about the causal-versus-evidential dispute? Or does it just show that the original case was rigged with an infallible predictor?

