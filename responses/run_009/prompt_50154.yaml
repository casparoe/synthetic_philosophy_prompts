answer: |-
  ## The Bar at the Conference of Meaning (Cancelled)

  **Setting:** A slightly sticky table in a dimly lit conference hotel bar. Empty pint glasses litter the surface. Dr. **Anya Petrova** (Quinean), mid-40s, swirling the dregs of a stout. Dr. **Ben Carter** (Chomskyan), late 50s, nursing a single malt.

  **Anya:** (Sighs, pushing the conference program aside) "Meaning Cancelled Due to Unforeseen Circumstances." Poetic, isn't it? Like the universe confirming the indeterminacy thesis.

  **Ben:** (Chuckles dryly) Or confirming the organisers' inability to handle basic logistics. Don't read metaphysics into a broken projector, Anya. Though, speaking of confirmation... I saw you practically levitate when they called it off. Your thesis got a free pass today.

  **Anya:** Hardly a pass. Just a temporary reprieve from the inevitable hand-waving about "obvious meanings." Take that ridiculous field report Jenkins was going to present. Perfect *gavagai* scenario.

  **Ben:** Jenkins? The one with the Katu? I skimmed his notes. Seemed messy, but salvageable. Classic under-specification. He spent two weeks, max?

  **Anya:** Exactly! And what did he get? Natives say ‘gavagai’ when a rabbit *runs* past. Not when it's still and munching clover. They use a different word, ‘bogoi’, for rabbit pelts… and apparently for vaguely rabbit-shaped clouds? And the clincher: show them a photo of a rabbit, silence. Make the photo *slide* across the screen? *Then* they assent to ‘gavagai’. Tell me, Ben, what fact of the matter determines whether ‘gavagai’ means *rabbit*, or *running*, or *rabbit-at-t*, or *rabbit-motion-event*? Jenkins' dispositions-to-assent underdetermine it radically.

  **Ben:** (Leans forward) Of course they underdetermine it *on their own*! That’s like diagnosing a complex disease with only a thermometer. Jenkins was being lazy, or rushed. He stopped at ostension. He needs *syntax*! How do they *use* ‘gavagai’? Does it count like a thing? "One gavagai, two gavagai"? Or does it pattern like an event verb? Does it combine with modifiers? What's the structure? "Fast gavagai"? "Gavagai yesterday"? Ask about a rabbit *starting* to run, or *stopping*. The Poverty of the Stimulus guarantees universal syntactic hooks – once you probe those, the ambiguity collapses.

  **Anya:** (Smirking) Ah, the counting test! Quine’s favourite punching bag. Okay, Jenkins asks. They *do* say "one gavagai, two gavagai" when multiple rabbits run by. Victory for ‘rabbit’? Not so fast! My alternative manual simply reinterprets their counting behaviour. Maybe ‘gavagai’ really refers to *undetached rabbit parts*, or *temporal rabbit-stages*. When they point at a running rabbit and say "one gavagai", they’re counting *that momentary stage*. When two rabbits run, they count two stages. The *pointing* itself? In my manual, pointing isolates a spatial segment, relevant for stages/parts, not the whole enduring rabbit. Your syntactic hooks are just more grist for the manual-reinterpretation mill. The dispositions underdetermine which manual *and* the interpretation of the pointing/counting acts that generate more dispositions!

  **Ben:** (Frowning, swirling his whisky) That... feels like cheating, Anya. You're redefining *everything* – semantics, ostension, quantification – just to preserve the indeterminacy. The innate syntactic architecture *constrains* the possibilities. Humans don't *naturally* parse the world as undetached parts or fleeting stages as the *primary* referents for basic nouns. UG biases us towards whole, enduring objects. When the Katu kid learns language, they aren't juggling a thousand logically possible ontological schemes; UG provides the scaffold, the data selects the specifics *within* that scaffold. "Bogoi" for pelts *and* clouds? Classic polysemy – metaphorical extension from pelt to shape. "Gavagai" requiring motion? Suggests it might be verbal or incorporate motion – but *not* that it refers to rabbit-events *simpliciter* as opposed to the *rabbits* involved in motion events. Syntax disambiguates the argument structure.

  **Anya:** But *how* does UG constrain it enough? You say "biases us towards objects," but Quine showed how deeply entangled ontology is with language. Maybe the Katu *do* have a stage- or process-oriented ontology embedded in their syntax! You hear "one gavagai, two gavagai" and assume object-counting because *your* UG biases *you*. But how do you *know* their quantifier "one" maps to *your* concept of a countable object, not a countable stage? The input – the sounds, the pointing, the situations – is compatible with both interpretations *plus* the reinterpretation of the quantifier itself. UG gives you *structure*, Ben, but it doesn't magically fix the *semantic values* assigned to the nodes in that structure from the outside. That assignment is still hostage to the indeterminacy of radical translation.

  **Ben:** (Pauses, takes a sip) The convergence, Anya. Competent linguists, given *rich enough* data – narratives, questions, embedded clauses, morphology – *do* converge on stable translations. We build dictionaries, teach languages. If it were radically indeterminate, that wouldn't happen. Your manuals are philosopher's fictions, logical possibilities untethered from the actual cognitive reality of language acquisition. The 'missing data' isn't missing forever; it gets filled in, and the competing hypotheses *do* die. "Gavagai" *might* be tricky, but "water"? "Mother"? "Hit"? The core vocabulary stabilizes because the innate structures guide the mapping efficiently.

  **Anya:** Convergence proves social agreement, not unique correctness! It proves we find manuals that work *for us*, within our shared biological and pragmatic constraints. It doesn't prove there's One True Manual waiting in Plato's heaven, dictated by UG. Maybe UG just makes some manuals *easier* for *us* to use and agree upon. But that’s psychology and pragmatics, not metaphysics. The Katu might have a manual for English that fits all *our* dispositions but assigns wildly different meanings, held together by systematic adjustments we can't detect. We’d never know.

  **Ben:** (Sighs, leans back) And there we are. Back to the abyss. You think 'meaning' is just a useful fiction spun from dispositions. I think it's a real cognitive state, shaped by biology and triggered by experience, discoverable through rigorous science. Jenkins' notes are garbage data. Good fieldwork with UG as a guide would resolve ‘gavagai’.

  **Anya:** And I think ‘resolve’ just means ‘pick a manual that meshes with our innate biases’. But it’s still a choice, Ben. There’s no cosmic umpire. The fact of the matter… (she gestures vaguely with her empty glass) …might just be that there *is* no fact of the matter the way you want there to be. Just patterns of noise and disposition.

  **Ben:** (A grudging half-smile) Or the fact of the matter is precisely the richly structured cognitive reality UG provides, and your indeterminacy is an artefact of impoverished data and ignoring biology. Jenkins’ notes prove nothing except bad methodology.

  **Anya:** They prove the methodology *can’t* capture what isn’t there to capture! But… (signals the bartender) …point taken. Jenkins *was* sloppy. Another round? We can argue whether *this* (taps her new glass) means fermented grain beverage, temporary happiness dispenser, or future regret catalyst.

  **Ben:** (Chuckles) Now *that* ambiguity, I’ll concede. But only because the data *is* still impoverished. Bartender! Make it two. Let’s see if syntactic analysis helps with the next one…
