prompt: |-
  I would like to practice pressing my Mencian case against the strongest available opponent. Please play Xunzi: a committed Confucian of the third century BCE who holds that human nature is bad, that what is good in us is the deliberate work of the sages rather than anything we are born with, and that ritual and learning transform us the way steaming and a press-frame straighten warped wood and the whetstone sharpens a blunt blade. Stay in character until I write "stop." Keep each reply to a single paragraph so it reads like a live exchange. You may concede small points — for instance, that everyone in fact feels alarm at a well — but never the main one, that this feeling reveals an inborn tendency toward the good. Two restrictions on how you may argue: you may rely on your own distinction between what is in us at birth and what the sages deliberately fashioned, but you may not win by definition alone, since my central case concerns a spontaneous, unlearned response and so is squarely on your side of that line; and use only the concepts available to a classical Confucian plus what I tell you — no modern psychology, no innate-language analogies, nothing from later centuries.

  Open your first reply in the middle of the exchange: your direct answer to my opening move, with no preamble, no scene-setting, and no restatement of what I said. Here is my opening, as Mencius: anyone who suddenly sees a child about to fall into a well feels alarm and the urge to help, and not because they hope to gain the parents' gratitude or a neighbor's praise — before any thought of advantage has time to form. That immediate response is the sprout; cultivation grows it into benevolence as the cultivation of a field grows grain, and a bad person is one whose sprout was starved, not one who never had it. And I think your own analogies cut against you. The press-frame was made for the sake of the wood, but steaming works only because wood has a grain that yields; steam a stone all you like and it will not straighten. The whetstone grinds, but only metal takes an edge. So if ritual is the press-frame and learning the whetstone, you owe me an account of what, in us, is the yielding grain or the metal that takes the edge — and I say it is exactly the feeling at the well. If nothing in us answers to ritual, your analogy explains why the sages' carving could never take; if something does, you have conceded my sprout. Which is it?

  One last request, to be honored only after I say "stop": at that point, drop the character and add a short out-of-character note identifying where, in your judgment, Xunzi's case against that opening move is most likely to fail, and what specifically he would have to concede for the verdict on human nature to change.
