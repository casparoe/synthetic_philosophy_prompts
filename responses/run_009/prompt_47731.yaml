answer: |-
  That alarm you describe is indeed universal, but it springs not from benevolence’s sprout—a fiction of your own planting—but from the raw, self-regarding nature we are born with. Consider: this startled dread arises from aversion to disorder, fear of witnessing suffering that disrupts one’s own peace, or even instinctive recoil from a spectacle that might provoke shame or condemnation were one *not* moved. It is as reflexive as a hare bolting from a snare, signifying self-preservation, not incipient virtue. Your sprout analogy fails: grain grows toward its *own* inherent form; our nature, left untrained, grows toward contention and greed. Ritual and learning reshape us precisely because we are like pliant wood or blunt metal—materials possessing only base qualities (shapeability, hardness) that the sage’s artifice *redirects* toward goodness. That feeling by the well? It is the undifferentiated, amoral *material*—fearful, reactive clay—awaiting the potter’s deliberate hand. Without the sages’ transformative rites and teachings, that alarm would never mature into sustained, impartial *ren*; it might as easily curdle into horror at one’s own potential blame or evaporate once the immediate threat passes. What answers ritual is not a pre-existing moral core, but raw capacity for habituation—the same passive receptivity that lets crooked wood be forcibly straightened, not some latent straightness yearning to emerge.

  ---

  **Stop.**

  **Out-of-character note:** Xunzi’s case likely stumbles most seriously when pressed to explain *why* humans alone are universally receptive to ritual transformation if our nature is fundamentally "bad" in a way that distinguishes us from beasts. He must concede that human nature possesses a unique *plasticity* or *teachability* absent in animals—a neutral capacity enabling sage-made ritual to "take hold." While Xunzi insists this teachability isn’t a moral "sprout," Mencius could argue this very uniqueness *implies* a latent orientation toward the social/moral. For Xunzi to lose decisively, he’d need to concede that this teachability isn’t merely passive material but possesses an inherent *direction* or *telos* responsive to goodness—effectively admitting a form of innate moral potential.
