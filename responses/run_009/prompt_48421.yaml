prompt: |-
  You are an expert in the design of classroom games and simulations, with deep knowledge of game theory and behavioral economics, and you have a gift for turning abstract dynamics into activities people feel in their wallets before they understand them in their heads. Please think carefully and thoroughly before answering; I'd like you to begin with some brief brainstorming of candidate designs, tell me which one you'd rule out and why, and then develop your chosen design in full.

  Here is my situation. I'm a software engineer, no philosophy or social science background, but I've become the de facto organizer of a quarterly "engineering culture" afternoon at my company. I have 90 minutes and about 24 engineers, in a room with whiteboards and a projector but no budget for real prizes beyond coffee vouchers. I want the session to be about something I've watched destroy quarters of my professional life: escalation of commitment. We start a migration, we discover mid-project that it's failing, and instead of cutting our losses we authorize "one more sprint" — over and over. Everyone nods along to the postmortem every time, and then it happens again. Reading around, I keep hitting the dollar auction — the game where the second-highest bidder also pays and gets nothing, so both leaders keep bidding past the value of the prize — and it strikes me that this is exactly the shape of the trap. But I don't want to just explain it. I want them to fall into it.

  So: design me a runnable activity, built around a dollar-auction-style mechanic, in which the participants are engineers bidding on something plausibly like a real project decision, and the structure itself generates the escalation. I'd like you to consider these specific design constraints, which come from my read of the situation:

  1. Instead of auctioning a dollar for money, auction something like "ownership of the greenfield rewrite" against a stated budget of tokens, with the twist that the losing bidder's spent tokens are also gone — the "costs already sunk" mechanic — and with at least one additional rule I haven't thought of that makes de-escalation genuinely feel like a loss in the moment, not a relief. (I suspect something like a public "commitment ledger" on the whiteboard, where everyone can see how much each team has already sunk, might do work here — but you tell me whether that helps or just accelerates the trap.)

  2. Somewhere in the middle of the session, I want a deliberately staged "checkpoint" — the kind where management formally reviews whether to continue — and I want it designed so that it predictably fails to stop the escalation, the way our real checkpoints do. If you can make the checkpoint itself part of the mechanism rather than a pause in it, even better.

  3. Halfway through, reveal some asymmetric information — for instance, that one team was quietly given better odds from the start — so that the debrief can separate rational persistence (you actually were ahead) from escalation (you were behind and kept bidding anyway). This distinction matters to me and I don't fully trust myself to draw it cleanly, so build the debrief around it.

  For the deliverable: give me the full rules, the token economy, the timeline broken down by minutes, the scripts for the facilitator (me), and a debrief that maps specific moments in the game onto the specific claims people make in real project postmortems — "we're almost done," "we've invested too much to stop now," "the alternative is starting from zero." Then tell me honestly: what will predictably go wrong the first time I run this, and which part of real escalation of commitment no 90-minute game can reproduce — the thing I'll have to supply in the debrief myself — and how I should supply it. Please keep the engineering framing intact throughout; these people will disengage instantly if it smells like a psychology exercise.
reasoning: |-
  We are designing a classroom game to simulate escalation of commitment in engineering contexts. The core mechanic will be a dollar-auction variant where teams bid for a "greenfield rewrite project" using tokens representing budget/resources. Key constraints:
  1. Auction with sunk costs: losing bidder also loses their spent tokens.
  2. Include a checkpoint that predictably fails to stop escalation.
  3. Introduce asymmetric information midway to distinguish rational persistence from irrational escalation.
  4. Engineering framing is crucial – avoid psychology jargon.

  Brainstorming candidate designs:

  Candidate 1: Direct dollar auction adaptation
  - Auction a $20 bill (or equivalent in tokens). Highest bidder wins the bill, but second-highest also pays their bid and gets nothing.
  - Pros: Simple, classic.
  - Cons: Too abstract; doesn't feel like an engineering project. No natural checkpoint or asymmetric info.

  Candidate 2: Project bidding war
  - Two teams bid for the right to lead a "greenfield rewrite" project. The project has a stated value (e.g., 100 tokens). Teams bid tokens from a budget (say, 50 tokens each). 
  - Twist: The losing team loses all tokens they've bid so far (sunk cost). 
  - Add checkpoint: After 5 bidding rounds, a "management review" occurs where teams present progress and decide whether to continue.
  - Asymmetric info: Secretly give one team a "technical advantage" (e.g., their bids count 1.5x because they have better expertise) but don't reveal until later.
  - Pros: More contextualized, includes requested elements.
  - Cons: Might be too predictable? Need to ensure escalation feels organic.

  Candidate 3: Multi-phase project simulation
  - Teams start by bidding for the project. Once won, they then bid in phases to "complete" the project, with each phase having a chance of success. If they abandon, they lose everything; if they complete, they get the reward minus costs.
  - Checkpoint: After phase 1, a review where they can choose to continue or abandon.
  - Asymmetric info: One team has a higher success probability per phase but doesn't know it (only the facilitator does).
  - Pros: Closer to real projects with phases.
  - Cons: More complex, might exceed 90 minutes.

  Ruling out: Candidate 1 is too abstract and doesn't meet the engineering framing requirement. Candidate 3 is too complex for 90 minutes. Candidate 2 is the best starting point.

  Chosen design: "Rewrite Roulette" – A competitive bidding game for a greenfield project with sunk costs, a checkpoint, and asymmetric information.

  Full Design:

  **Game Title:** Rewrite Roulette

  **Premise:** Two engineering teams (Team A and Team B) are competing to take ownership of a high-prestige greenfield rewrite project. The project has a known value (100 points) that will be awarded upon successful completion. Teams have limited resources (tokens) and will bid in rounds to "win" the project. But the twist: the losing team loses all their spent tokens, and the winning team must then complete the project by investing additional tokens, with a risk of failure.

  **Setup:**
  - Divide 24 engineers into 4 teams of 6. But only two teams will be bidding (Team A and Team B). The other two teams will be observers with specific roles: one team as "Management Review Board" and one as "Data Analysts" (for debrief). Rotate roles if time allows, but focus on two bidding teams for the core game.
  - Each bidding team gets an initial token budget: 50 tokens.
  - Project value: 100 tokens (for the winning team to receive upon completion).
  - Whiteboard setup: 
    - "Commitment Ledger": Two columns for Team A and Team B, showing cumulative tokens spent.
    - "Project Status": Tracks current high bidder and bid amount.

  **Token Economy:**
  - Tokens represent engineering resources (developer time, opportunity cost, etc.).
  - Each team starts with 50 tokens.
  - The winning team must pay their final bid to win the project, then must invest 20 more tokens to "complete" the project (simulating the actual work). They then receive 100 tokens (net gain = 100 - bid - 20).
  - The losing team loses all tokens they bid during the auction (sunk cost) and gains nothing.

  **Rules:**
  1. **Bidding Rounds:**
     - The auction proceeds in rounds. In each round, both teams simultaneously submit a secret bid (integer tokens) that must be at least 1 token higher than the current leading bid. Initial bid: minimum 1.
     - If one team bids higher than the other, they become the new leader (bid displayed publicly).
     - If both bid the same, no change (but their bids are still spent!).
     - After each round, update the Commitment Ledger with the cumulative tokens spent by each team.

  2. **Checkpoint (after 5 rounds):**
     - Pause the bidding. Hold a "Management Review" where:
       - The Management Review Board (observer team) asks both teams to present:
          - "Why we should continue" (current leading team)
          - "Why we should abandon" (trailing team)
       - Teams can use any argument (e.g., "we're almost done", "we've invested too much to stop").
     - Management then votes: Continue or Abandon. 
     - But here’s the catch: The rules force continuation unless both teams agree to abandon. Since the trailing team has sunk costs and hopes to overtake, and the leader is committed, they almost never agree. Management is instructed to vote "Continue" unless both teams request abandonment (which won't happen). This simulates how real checkpoints fail.

  3. **Asymmetric Information (revealed after Checkpoint):**
     - After the checkpoint, announce: "Team A had a technical advantage: their bids were effectively 1.5x due to prior experience. For every token they bid, it counted as 1.5 toward winning." (But they still only spend 1 token). This means Team A was stronger from the start, but they didn't know it.
     - This creates two scenarios:
       - Team A might have rationally persisted (they were effectively getting more value per bid).
       - Team B, if they were behind, escalated irrationally.

  4. **Completion Phase:**
     - After the auction ends (when one team concedes or after a set number of rounds, e.g., 10 rounds max), the leading team wins the project.
     - They must then "complete" it by paying 20 tokens. They receive 100 tokens (net gain: 100 - their final bid - 20).
     - The losing team loses all tokens they bid and gets nothing.

  **Timeline (90 minutes total):**

  - **0-10 min: Introduction and Setup**
    - Facilitator script: "Today we're simulating a classic engineering dilemma: the greenfield rewrite. Two teams will compete to take ownership of a project worth 100 tokens. You start with 50 tokens. The winning team gets the project and must complete it with an additional 20-token investment. The losing team loses every token they've bid. We'll have a management review midway. Remember, tokens are your resources – spend wisely."
    - Assign teams: Team A, Team B, Management Review Board (6 people), Data Analysts (6 people). If more than 24, adjust.
    - Distribute tokens (physical or tracked on whiteboard).

  - **10-40 min: Bidding Rounds (5 rounds before checkpoint)**
    - Each round: 
      - Teams have 2 min to discuss and submit a secret bid (write on paper).
      - Facilitator collects bids, announces: "Team A bids X, Team B bids Y. New leader is [Team] with bid Z." Update Commitment Ledger.
      - Emphasize: "Your bid is spent whether you win the round or not. It's gone."
    - After round 5: Pause for Checkpoint.

  - **40-50 min: Checkpoint**
    - Script: "We've reached the midway point. Management will now review the project. Team [Leader], you have 2 minutes to argue why we should continue. Team [Trailer], you have 2 minutes to argue why we should abandon. Management, you will then vote."
    - Teams present (keep it lively; engineers will use real-world arguments).
    - Management votes. Facilitator: "Management has decided to... CONTINUE! The project proceeds." (As designed, it always continues).

  - **50-55 min: Reveal Asymmetric Info**
    - Script: "Now, a revelation: Team A had a hidden advantage. Due to their prior experience with this stack, every token they bid counted as 1.5 toward winning. Team B's bids counted at face value. This was not disclosed earlier. Continue bidding."

  - **55-70 min: Resume Bidding (Rounds 6-10)**
    - Continue for up to 5 more rounds. Teams may escalate further now that asymmetry is known.
    - If at any point a team runs out of tokens or refuses to bid, they drop out.

  - **70-75 min: Project Completion**
    - Announce winner. Winner pays final bid + 20 tokens, receives 100.
    - Loser loses all spent bids.

  - **75-90 min: Debrief**
    - Led by facilitator, with Data Analysts reporting observations.

  **Debrief Script (Map to Real Postmortems):**
  - Start with Data Analysts: "What patterns did you see in bidding?" (They’ll note escalation).
  - Facilitator questions:
    - "At what point did you realize you were in a trap?" → Maps to "We only saw it in the postmortem."
    - "Team B, when you learned about the asymmetry, why did you keep bidding?" → "We thought we could turn it around" or "We'd already invested too much to quit."
    - "Team A, did the advantage make you more confident? Was it rational?" → Distinguishes rational persistence (they had an edge) from irrational (Team B, without the edge, escalating).
    - "Management, why did you vote to continue?" → "The teams seemed committed," mirroring real checkpoints.
  - Map game moments to real claims:
    - "We're almost done": Said by leader at checkpoint when they've bid 40 tokens, ignoring that they still need to invest 20 more to complete.
    - "We've invested too much to stop now": Directly from Commitment Ledger showing sunk costs.
    - "The alternative is starting from zero": Implied by the fear of losing all spent tokens.
  - Key insight: Escalation is driven by:
    - Sunk costs (displayed publicly in Commitment Ledger – which accelerated the trap, as designed).
    - Competitive pressure (losing feels worse because you lose everything).
    - Asymmetric information: Team B escalated even after learning they were at a disadvantage.

  **Predictable Problems & Limitations:**
  - What will go wrong:
    - Teams might figure out the trap early and collude to stop (mitigate by having only two teams and emphasizing competition).
    - Checkpoint might actually work if teams rebel against the forced continuation (remind Management of their role).
    - Asymmetric info reveal might cause Team B to quit immediately (but sunk costs may push them to continue).
    - Time overrun: Strictly enforce 2-min bidding rounds.
  - What the game can't reproduce:
    - The slow, grinding reality of months of sunk effort. In 90 minutes, the sunk costs are tokens; in real life, it's years of labor and emotional investment. 
    - The diffusion of responsibility in large teams. Here, small teams feel direct accountability.
    - How to supply it: In debrief, ask: "In real projects, the costs aren't tokens – they're midnight oil and missed family time. How does that change the trap?" Share a brief personal story of a real project escalation to ground it.

  **Final Note:** Frame everything in engineering terms. Call tokens "resource points," the ledger "sunk cost tracker," etc. Avoid terms like "irrational escalation" – instead, say "suboptimal resource allocation." 

  This design should make them fall into the trap, then recognize it in the debrief. Good luck!
answer: |-
  ### Designed Activity: "Project Sunk Cost Showdown"  
  **Premise:** Teams bid for a "greenfield rewrite project" using tokens representing engineering resources (dev time, budget, opportunity cost). The twist: the loser forfeits all spent tokens, and a hidden "technical advantage" creates rational vs. irrational escalation paths. The game mirrors real-world traps like "one more sprint" justifications and failed checkpoints.  

  **Engineering Framing:** No psychology jargon. Tokens = "Resource Units (RUs)", bidding = "resource allocation", sunk costs = "burned RUs". The project is a high-prestige "Microservices Migration" with a clear value.  

  ---

  ### **Rules & Token Economy**  
  **Setup (10 mins):**  
  - **Teams:** Divide 24 engineers into 4 teams of 6. Two teams compete (Team Alpha, Team Bravo), one serves as the "Eng Leadership Board" (ELB) for checkpoints, one as "Project Historians" (track data for debrief). Rotate roles if repeated.  
  - **Tokens:** Each team starts with **50 RUs** (physical tokens or whiteboard tally).  
  - **Project Value:** Successful completion grants **100 RUs** (net gain = 100 - bid - completion cost).  
  - **Commitment Ledger:** Public whiteboard tracking cumulative RUs spent by each team. Updated after every bid.  

  **Core Mechanics:**  
  1. **Bidding Rounds (5 mins/round):**  
     - Teams bid for "project ownership" in secret. Minimum bid: **1 RU** higher than the current leader (start at 0).  
     - **Simultaneous bids:** Both teams submit bids secretly. If one outbids the other, they become the leader. If bids tie, leader retains position.  
     - **Sunk Cost Twist:** *Both teams lose spent RUs immediately*, win or lose. Only the winner gets the project.  
     - **Escalation Driver:** Public ledger displays "Burned RUs" → social pressure to justify losses ("We can't walk away now!").  

  2. **Checkpoint (Mid-Game "Continuation Review"):**  
     - Triggered after **Round 3** or when total burned RUs exceed 60 (whichever comes first).  
     - **ELB Review (10 mins):**  
       - Teams present to the ELB (observer team playing leadership):  
         - Leader: *"Why we must continue: We’re 80% done, ROI is imminent!"*  
         - Trailer: *"Why we should pivot: Risks outweigh rewards."*  
       - **The Trap:** ELB *always approves continuation* unless **both** teams agree to cancel (they never do). Why? Leader is overconfident; trailer fears sunk costs. Mirrors real-world "the teams are committed, so we greenlight" failure.  

  3. **Asymmetric Information Reveal (Post-Checkpoint):**  
     - After the checkpoint, announce: *"Alpha had a hidden advantage: Their prior experience gives them a 20% efficiency boost. Every RU they spend counts as 1.2 RUs for bidding purposes. Bravo spends at 1:1."*  
     - **Why?** Creates two paths:  
       - Alpha: Persistence *may* be rational (they’re "ahead" on efficiency).  
       - Bravo: Escalation is likely irrational (they’re "behind" but keep bidding).  

  4. **Project Completion & Winning:**  
     - Game ends when one team concedes or after **7 rounds**.  
     - Winner pays their final bid + **20 RUs** to "complete" the project. They earn 100 RUs (net = 100 - bid - 20).  
     - Loser forfeits all spent RUs, gets nothing.  

  **Key Accelerant:** The public ledger. Seeing rivals’ "burned RUs" fuels "We can’t let them win after we’ve spent X!"  

  ---

  ### **Timeline (90 Mins Total)**  
  **0–10 mins: Setup & Briefing**  
  - **Script:** *"We’re simulating a microservices migration. Two teams will bid for ownership. Winning requires outbidding rivals, but losers burn all spent RUs. The ELB will review progress midway. Goal: Maximize your RU balance. Tokens are scarce—spend like it’s your quarterly budget."*  
  - Assign teams, distribute RUs, draw ledger on whiteboard.  

  **10–40 mins: Bidding Rounds 1–3**  
  - **Facilitator Script:**  
    - *"Submit bids secretly. Highest new bid takes the lead. Burned RUs are gone forever—update the ledger."*  
    - After each round: *"Alpha burned X total. Bravo burned Y total. Leader is [Team] with bid Z."*  
  - **Expected Behavior:** Bids escalate quickly (e.g., Alpha: 5→15→30, Bravo: 7→16→31). Ledger shows mounting losses.  

  **40–50 mins: Checkpoint ("Continuation Review")**  
  - **Script:** *"Pause! The ELB reviews progress. Leader: Pitch why we continue. Trailer: Pitch why we pivot. ELB: Decide based on team confidence."*  
  - **Facilitator Notes:** ELB *must* approve continuation unless both teams quit (they won’t). Trailer often says: *"But we’ve burned 31 RUs—we’ll lose everything if we stop now!"* Leader says: *"One more sprint and we’re done!"*  

  **50–55 mins: Reveal Asymmetric Advantage**  
  - **Script:** *"New data: Alpha has a 20% efficiency edge due to legacy experience. Their bids were effectively 1.2x."*  
  - **Facilitator Notes:** Highlight tension: *"Alpha, does this change your strategy? Bravo, do you double down or cut losses?"*  

  **55–70 mins: Bidding Rounds 4–7**  
  - **Script:** *"Resume bidding! Remember: Burned RUs are sunk. Minimum bid is +1 RU."*  
  - **Expected Behavior:** Bravo escalates irrationally (e.g., bids 45→50 despite being behind). Alpha may bid cautiously or escalate.  

  **70–75 mins: Project Completion**  
  - Declare winner. Calculate net gains/losses. Loser’s RUs = 50 - total burned. Winner’s RUs = 50 - final bid - 20 + 100.  

  **75–90 mins: Debrief**  
  ---  

  ### **Debrief Script: Mapping Game to Real Engineering Traps**  
  **Facilitator Goal:** Connect game moments to real project postmortems. Use "Project Historians" to share data.  

  1. **The Sunk Cost Fallacy**  
     - *Game Moment:* Teams bidding past Round 3 despite losses.  
     - **Script:** *"In Round 4, Bravo burned 40 RUs but kept bidding. What did that feel like?"* → Bravo: "We couldn’t quit after investing so much!"  
     - **Real-World Claim:** *"We’ve invested too much to stop now."*  
     - **Insight:** Public ledger made sunk costs visible, accelerating commitment—just like Jira boards showing "months invested."  

  2. **The False Checkpoint**  
     - *Game Moment:* ELB approving continuation despite risks.  
     - **Script:** *"ELB, why did you continue? Trailer, why didn’t you quit?"* → ELB: "Teams seemed confident." Trailer: "We hoped to turn it around."  
     - **Real-World Claim:** *"The team committed, so we approved another sprint."*  
     - **Insight:** Checkpoints fail when they ignore asymmetric information (e.g., hidden tech debt) and rely on team optimism.  

  3. **Rational vs. Irrational Persistence**  
     - *Game Moment:* Post-asymmetry reveal. Alpha (efficient) vs. Bravo (inefficient) escalation.  
     - **Script:** *"Alpha, you had an edge—was persisting rational? Bravo, you knew you were behind—why persist?"*  
     - **Real-World Claim:** *"We were almost done!" (rational if true) vs. "We feared starting over" (irrational).*  
     - **Insight:** Asymmetric info separates data-driven decisions (Alpha) from emotional escalation (Bravo). In real projects, we often lack this clarity.  

  4. **The "Almost Done" Illusion**  
     - *Game Moment:* Leader at checkpoint claiming "80% done" while ignoring the 20-RU completion cost.  
     - **Script:** *"Winning the bid isn’t finishing—why did we forget the 20-RU completion cost?"*  
     - **Real-World Claim:** *"One more sprint and we’ll ship!"*  
     - **Insight:** Bidding focuses on "winning" the project, not total cost—mirroring how teams fixate on "launching" while ignoring testing/migration overhead.  

  **Closing Question:** *"How can we design checkpoints that surface hidden asymmetries (like Alpha’s edge) and force real cost-benefit analysis?"*  

  ---  

  ### **Predictable Problems & Limitations**  
  **What Will Go Wrong:**  
  1. **Early Collusion:** Teams may refuse to bid to "break the game." *Mitigation:* Frame competition fiercely ("This project determines promo opportunities!"). If collusion happens, exploit it in debrief: *"Why did you avoid bidding? Is that feasible in real projects with rival teams?"*  
  2. **Checkpoint Rebellion:** ELB might reject continuation. *Mitigation:* Brief ELB secretly: *"Your job is to model real leadership—approve unless both teams quit."* If they rebel, use it: *"What would make leadership say no in reality?"*  
  3. **Time Overruns:** Bidding discussions can drag. *Mitigation:* Use strict 2-min bid windows. Cut off debates with: *"Delays cost RUs—decide now!"*  
  4. **Frustration at Bravo:** Players may resent the asymmetry. *Mitigation:* Normalize it: *"In real projects, hidden factors (e.g., tech debt) create unfair advantages."*  

  **What the Game Can’t Reproduce (Supply in Debrief):**  
  - **The Emotional Weight of Real Sunk Costs:** Burning tokens feels trivial; burning months of nights/weekends feels existential.  
    - **How to Supply It:** Share a brief personal story: *"In my last migration, we burned 6 months knowing it was failing. We didn’t quit because we’d ‘wasted’ 200 engineer-hours—and that guilt is impossible to simulate. That’s why postmortems must surface emotions, not just data."*  
  - **Diffused Responsibility:** In-game teams are small and accountable; real projects involve shared blame.  
    - **How to Supply It:** Ask: *"Who here has seen a project where everyone knew it was failing but no one spoke up? Why? In this game, you were a tight team—but real escalation hides in committee ambiguity."*  

  **Final Tip:** If engineers disengage, pivot to tactical takeaways: *"How would RU tracking in our actual projects change decisions?"* This grounds theory in engineering practice.  

  ---  
  This design makes them *feel* the trap via competition, public sunk costs, and a rigged checkpoint—then dissects it in debrief. Run it tight, and they’ll leave paranoid about their next "one more sprint." Good luck!
