prompt: |-
  I'm writing a paper on whether tiny harms can ever sum to something worse than a single grave harm, and before I wade into the back-and-forth arguments, I want the specification: what would a theory of the aggregation of small harms have to get right in order to count as adequate?

  To fix ideas, take the standard stylized case: a dust speck lodging briefly in the eye of each of an enormous number of people (make the number absurdly large, so that no appeal to physical impossibility can do the work), versus fifty years of torture for one person. Also fixed for purposes of the spec: the small harms in question are genuine but negligible harms — a stubbed toe, a dull ache, a moment of irritation — not mere neutral sensations; if you think that framing already smuggles in an answer, build your worry into a requirement rather than a footnote.

  Write the desiderata: the cases the theory must handle (concentrated versus dispersed harm with the same total; small harms accumulated over one person's lifetime versus spread thinly across persons; the run from one dust speck to a lifetime of them with no single step crossing a visible threshold; harms sitting just below and just above whatever line the theory draws); the structural commitments it must either respect or openly reject (transitivity of the better-than relation; additivity across persons; continuity between adjacent magnitudes of harm); the distinctions it cannot collapse (intensity versus duration of pain; the number of sufferers as a moral quantity versus a mere arithmetical one; aggregation within a life versus aggregation across lives); and the constraints from ordinary practice it must either satisfy or explain away (why we don't spend unbounded resources eliminating small harms one at a time; why we seem to treat a thousand mosquito bites on one person differently from one bite on each of a thousand people, if in fact we do).

  For each requirement, give the case or consideration that motivates it — a requirement with no motivating case is a camp prejudice and should be flagged as such rather than passed off as a constraint. Then say which requirements you take to be non-negotiable and which are demanded only by particular camps, and, most importantly, whether any subset of the desiderata is jointly unsatisfiable: I have a suspicion the list itself can be turned into a theorem of its own, and that's the part I most want to see even if you can't prove it rigorously. Finish, briefly, with how three natural contenders fare against your list — a straightforward additive view, a threshold or lexical view on which harms below some intensity cannot be summed across persons to outweigh one above it, and a view that gives up transitivity — and identify the single requirement that does the most work to exclude candidates.

  One thing I need throughout: keep separate what is settled among people who actually work on aggregation and population ethics from what is genuinely contested. Do not present the rejection of transitivity, or the assumption of additivity, or the insistence on continuity as the consensus when any of them is a live dispute; wherever the field itself is divided, mark the requirement accordingly.
reasoning: |-
  Okay, the user is writing a paper on whether tiny harms can aggregate to something worse than a single grave harm. They want a clear specification of what makes an adequate theory of small harm aggregation. Let's break down their request.

  First, they mention the classic dust speck vs. torture case. The key here is that the tiny harms are genuine but negligible, like a stubbed toe, not neutral sensations. They want desiderata that cover various cases, structural commitments, necessary distinctions, and constraints from ordinary practice. Each requirement needs a motivating case to avoid bias.

  I need to categorize the desiderata. For cases, concentrated vs. dispersed harm with the same total harm is important to test if distribution matters. Also, intra-personal vs. inter-personal aggregation—does accumulating small harms over one lifetime differ from spreading them? The sorites problem (no threshold jumps) is crucial too. Threshold proximity tests how a theory handles harms near the cutoff.

  Structural commitments involve transitivity. If A is better than B and B better than C, then A should be better than C. But giving up transitivity might be necessary. Additivity across persons is contested—some think you can't sum harms across people. Continuity between harm magnitudes is another point of debate.

  Distinctions to maintain include intensity vs. duration of pain. A short intense pain vs. longer mild pain shouldn't be treated the same. Also, the number of sufferers as moral vs. arithmetic—does more people suffering add moral weight? Plus, aggregation within a life vs. across lives. People might accept summing harms in one life but not across lives.

  Constraints from practice: Why don't we spend unlimited resources on tiny harms? And the asymmetry in treating many bites on one person vs. one bite each on many. A theory must explain or reject these practices.

  Now, non-negotiable vs. camp-specific requirements. Cases like concentrated vs. dispersed and intra- vs. inter-personal are core. Transitivity is debated—some theorists reject it. Additivity is a major split. Continuity might be necessary for some, but others accept thresholds.

  The big issue is joint unsatisfiability. Maybe the ordinary practice constraints clash with additivity. For example, the mosquito bite asymmetry challenges additivity. Also, the resource allocation problem might conflict with taking tiny harms seriously.

  Three contenders: Additive view fails asymmetry and resource allocation. Lexical threshold avoids torture but can't handle the sorites series. Non-transitive views handle cases but are complex and counterintuitive.

  The key requirement causing problems is the asymmetry constraint. It challenges additivity and pushes towards thresholds or non-transitivity. Highlighting where desiderata conflict shows why aggregation is tough. Need to clarify what's settled vs. contested in the field, like transitivity being debated but additivity being a major divide.
answer: |-
  Here’s a specification of desiderata for an adequate theory of small-harm aggregation, structured as requested. I demarcate settled/contested positions in population ethics using **[Settled]** (rare consensus) and **[Contested]** (live disputes), and flag camp-specific demands. The core challenge is *joint unsatisfiability* arising from ordinary practice constraints.

  ---

  ### **I. Cases the Theory Must Handle**  
  *(Motivated by real-world analogs or logical pressure points)*

  1.  **Concentrated vs. Dispersed Harm (Same Total "Quantity")**  
      *Case:* 1000 minor headaches inflicted on one person vs. one minor headache each for 1000 people.  
      *Motivation:* Tests if distribution (burden concentration) matters independently of total harm.  
      *Status:* Core case; rejecting moral relevance of distribution requires justification.

  2.  **Intra-Personal vs. Inter-Personal Aggregation**  
      *Case:* One person enduring 10,000 dust specks over a lifetime vs. 10,000 people each enduring one speck.  
      *Motivation:* Reveals if aggregation mechanics differ within vs. across lives (e.g., due to person-affecting views or continuity of consciousness).  
      *Status:* Non-negotiable; any theory must address this distinction explicitly.

  3.  **The Sorites Series (No Threshold Jump)**  
      *Case:* A sequence from one dust speck to a lifetime of dust specks (e.g., 1, 2, 4, ..., 2^100 specks) with no single step constituting a "grave harm."  
      *Motivation:* Challenges threshold/lexical views: if no step is worse, how can the endpoint be vastly worse? Forces continuity or explains discontinuity.  
      *Status:* Non-negotiable logical stress test.

  4.  **Threshold Proximity**  
      *Case:* Harms just below/above a proposed aggregation threshold (e.g., pain intensity ε vs. 2ε, where ε is "negligible").  
      *Motivation:* Tests robustness of thresholds; avoids arbitrariness accusations.  
      *Status:* Required for threshold views; additive/non-transitive views may sidestep.

  ---

  ### **II. Structural Commitments**  
  *(Must explicitly endorse or reject)*

  5.  **Transitivity of "Better Than"** **[Contested]**  
      *Motivation:* If A > B and B > C, then A > C. Rejection permits cyclical preferences (e.g., torture > dust specks > mild pain > torture).  
      *Status:* Often assumed in ethics, but rejected by some (e.g., Temkin). Non-negotiable for classical utilitarians; others may sacrifice it.

  6.  **Additivity Across Persons** **[Contested]**  
      *Motivation:* Can harms to different people be summed? Central to utilitarianism vs. deontology.  
      *Case:* If 1 speck harms H, does N specks harm N×H?  
      *Status:* Defining fault line. Rejection is camp-specific (e.g., non-aggregationists like Scanlon).

  7.  **Continuity** **[Contested]**  
      *Motivation:* If A > B > C, is there a point where increasing B’s harm transitions it from better to worse than A?  
      *Case:* Sorites series (Desideratum 3).  
      *Status:* Lexical/threshold views reject; additive views accept. Camp-specific.

  ---

  ### **III. Distinctions That Must Not Collapse**  
  *(Preserve conceptual separateness)*

  8.  **Intensity vs. Duration**  
      *Motivation:* 1 second of excruciating pain vs. 1 year of mild itch. Treating these as interchangeable is counterintuitive.  
      *Status:* Non-negotiable; any adequate theory must account for both dimensions.

  9.  **Number of Sufferers as Moral (vs. Arithmetic) Quantity**  
      *Motivation:* Does increasing sufferers *itself* add moral weight (e.g., "each additional person matters")?  
      *Case:* Dust specks (N=10^9) vs. torture: if N is merely arithmetic, summation fails.  
      *Status:* Core to aggregation; non-aggregationists deny moral weight to numbers.

  10. **Intra-Life vs. Inter-Life Aggregation**  
      *Motivation:* We readily aggregate small harms *within* one life (e.g., chronic backache), but resist across lives. Why?  
      *Status:* Non-negotiable; theory must explain symmetry or asymmetry.

  ---

  ### **IV. Constraints from Ordinary Practice**  
  *(Must satisfy or explain away)*

  11. **Resource Allocation Asymmetry**  
      *Case:* Societies don’t spend unlimited resources to eliminate vanishingly small harms (e.g., $1B to prevent one dust speck).  
      *Motivation:* Practical rationality; implies diminishing moral urgency for tiny harms.  
      *Status:* Non-negotiable; theories violating this are practically self-defeating.

  12. **Mosquito Bite Asymmetry**  
      *Case:* We treat 1000 bites on one person as worse than one bite each for 1000 people.  
      *Motivation:* Empirical observation of commonsense morality; challenges pure additivity.  
      *Status:* **[Settled]** that this intuition exists; **[Contested]** whether it’s rational. Must be addressed.

  ---

  ### **V. Non-Negotiables vs. Camp Demands**
  - **Non-Negotiable:** Desiderata 1, 2, 3, 8, 10, 11 (core cases, distinctions, and practical coherence).  
  - **Camp-Specific:**  
    - Additivists reject 6 only at their peril.  
    - Threshold views require 4 and reject 7.  
    - Non-transitive views reject 5.  
    - Non-aggregationists reject 9.

  ### **VI. Joint Unsatisfiability: The Key Theorem**
  **The list implies a contradiction:**  
  - (A) *Sorites + Continuity* (3+7) suggest tiny harms can aggregate to grave harms.  
  - (B) *Resource Allocation + Mosquito Asymmetry* (11+12) suggest they cannot (or *should not*).  
  - (C) *Transitivity* (5) blocks escape via cyclicality.  
  **⇒ No theory can satisfy all of (A), (B), and (C).**  
  *Proof sketch:* If (A) holds, dust specks sum to worse than torture. But (B) demands we prioritize torture over specks (allocation) and treats dispersed specks as less bad (asymmetry). Transitivity forces a ranking, but (A) and (B) conflict. **Result:** Adequate theories must sacrifice one limb of this triad.

  ---

  ### **VII. How Contenders Fare**
  | **Theory**               | **Fatal Flaw(s)**                                  | **Holds Up On**                | **Sacrifices**               |
  |--------------------------|---------------------------------------------------|--------------------------------|-------------------------------|
  | **Straight Additive**    | Violates 11 (resource allocation) & 12 (asymmetry). Ignores distribution (1). | 3 (Sorites), 6, 7, 9. | Practical coherence (11,12). |
  | **Lexical Threshold**    | Violates 3 (Sorites series) & 4 (threshold proximity). Struggles with 10 (intra/inter asymmetry). | 11, 12. | Continuity (7). |
  | **Non-Transitive** (e.g., Temkin) | Violates 5 (transitivity); may permit cycles. Complex, counterintuitive. | 1, 2, 3, 11, 12. | Transitivity (5) and simplicity. |

  ---

  ### **VIII. The Excluding Requirement**
  **Resource Allocation Asymmetry (11)** does the most work to exclude candidates:  
  - It forces *diminishing moral urgency* for smaller harms, directly contradicting additive aggregation.  
  - It is non-negotiable (practical rationality) and empirically grounded.  
  - It creates the joint unsatisfiability with Sorites/Continuity that defines the field’s central paradox.

  ---

  ### **Field Consensus vs. Disputes**  
  - **[Settled]**:  
    - Mosquito bite asymmetry (12) is a robust intuition.  
    - Sorites series (3) is a valid problem.  
    - Additivity (6) is the dominant *but contested* default.  
  - **[Contested]**:  
    - Transitivity (5): Rejected by significant minority.  
    - Continuity (7): Threshold views openly reject it.  
    - Non-aggregation (rejection of 6/9): Influential (e.g., Scanlon) but not dominant.

  This specification forces theories to confront the *practical incoherence* of strict aggregation (via 11–12) while respecting the *logical coherence* of harm summation (via 1–3,7). The unresolvable tension explains why population ethics remains fertile ground for paradox.
