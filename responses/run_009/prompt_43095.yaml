prompt: |-
  I run a student rationality meetup — about 14 people, mostly CS and econ undergrads, 90 minutes, we've got a whiteboard and a big bag of candy. Next session is on races to the bottom / multipolar traps, the Moloch-ish stuff (we read the Meditations on Moloch essay ages ago so the name is already out there, no need to hide it). What I want is a game where they build the trap themselves: nobody does anything they'd call wrong, every single choice is locally sensible, and by the end everyone is worse off than at the start and can trace exactly which of their own choices got them there. Give me the full design — rules, materials, a payoff scheme in candy or points (no real money), round structure with a rough timeline.

  One thing I specifically want: at least one phase where they're allowed to talk freely and make agreements *before* things go bad, so they discover for themselves that a handshake isn't enforcement. If there's a way to then let them try to escape once the trap is running — norms, punishments, voting with their feet, whatever — and show which of those actually bite and which don't, even better.

  Then the debrief: map what actually happened in each phase onto the concepts — the everyone's-locally-rational point, why the equilibrium holds even when every player can see it perfectly, what exit or enforcement or mergers actually require. Use our actual scoreboard, not the hypothetical one, as much as you can given you won't know how it plays out.

  Also two honest sections please. First, what will predictibly go wrong when I run it: my group is friendly, they all know each other, and I fully expect them to try to cooperate their way around the entire exercise from round one — tell me how to structure things (teams? anonymity? stranger matching? entry fees?) so that goodwill doesn't just dissolve the point, or whether I should let it dissolve and use that as the lesson instead. Second, be blunt about what a 90-minute game with 14 people who can literally get up and leave cannot reproduce about the real thing — I'd rather say that part out loud to the group than pretend the game is the world.

  And if you think the premise itself is off — like that a game with a facilitator-designed payoff matrix mostly teaches them about game design and says nothing about multipolar traps in actual societies — say that straight up instead of designing around it. I can take a "this activity shouldn't exist" answer, I just need to know why.
reasoning: |-
  We are designing a game for a student rationality meetup on multipolar traps (races to the bottom). The goal is for players to experience a situation where individual rational choices lead to a collectively worse outcome. The game should include:
  - A phase with pre-game communication and agreements (to show that handshake agreements aren't enforceable)
  - A way for players to try to escape the trap once it's running (to test solutions like norms, punishments, etc.)
  - A debrief mapping the game phases to concepts

  Constraints:
  - 14 players, 90 minutes total
  - Materials: whiteboard, candy (or points for candy)
  - No real money

  Design considerations:
  1. **Preventing early cooperation from ruining the trap**: The group is friendly and may try to cooperate from the start. We need to create incentives that make defection tempting even in a friendly group. Ideas:
     - **Anonymity**: Players make choices without knowing who chose what (until perhaps the end). This reduces social pressure.
     - **Teams**: Divide into teams (e.g., 7 teams of 2) to create group identity and inter-group competition. This can also reduce the feeling of betraying a specific friend.
     - **Entry fees**: Not necessary if we use points/candy. Instead, we can have a starting endowment that they can increase or lose.
     - **Stranger matching**: Not practical since they know each other. Teams are better.
     - **Let them try to cooperate and fail**: If they manage to avoid the trap by cooperating, that becomes the lesson: cooperation is possible but requires enforcement. However, we want to demonstrate the trap. So we must design payoffs such that cooperation is unstable without an enforcement mechanism.

  2. **Game structure**: We want multiple rounds to allow the trap to build and then attempts to escape. A classic structure is a repeated prisoner's dilemma or a common resource extraction game (like the tragedy of the commons). However, we want a multipolar trap that feels like a race to the bottom.

  I propose a game inspired by the **"Race to the Bottom"** in environmental standards or labor markets, but simplified. We can call it the **"Candy Extraction Game"**.

  ## Game Design: The Candy Extraction Game

  ### Overview
  Players are companies (or countries) competing in a global market. They can choose to produce goods using either a "clean" method (which is more expensive) or a "dirty" method (which is cheaper but harms the environment). The market only cares about price, so the cheapest producer gets the most sales. However, the dirty method creates pollution, which accumulates and eventually reduces everyone's production (and thus candy earnings). 

  ### Setup
  - **Players**: 14, divided into 7 teams of 2 (to reduce the number of decision units and create team dynamics). If 14 doesn't divide evenly, have 3 teams of 3 and 4 teams of 2 (but 7 teams of 2 is ideal). Each team is a "company".
  - **Materials**: 
    - Whiteboard to track:
        - Current pollution level (starts at 0)
        - Each team's production method (clean/dirty) and points (candy)
    - A bag of candy (or tokens to be exchanged for candy at the end) for payoffs.
  - **Rounds**: The game will have several rounds (about 5-10, depending on time). Each round represents a production period.

  ### Rules and Payoffs
  - Each team starts with 10 points (which will be converted to candy at the end).
  - In each round, every team simultaneously and secretly chooses one of two production methods:
    - **Clean**: Costs 2 points to produce. Does not add pollution.
    - **Dirty**: Costs 1 point to produce. Adds 1 unit of pollution to the environment.
  - **Market Competition**: After all choices, the market price is set by the cheapest production method available. 
    - If at least one team chose dirty, then the market price is set at 1 (the dirty cost). 
    - If no one chose dirty, the market price is 2 (clean cost).
  - **Revenue**: Each team sells one unit of product. The revenue is the market price. 
    - So, if market price is 1 (because at least one dirty), then:
        - Clean producers: Revenue = 1, Cost = 2 → Profit = -1 (loss of 1 point)
        - Dirty producers: Revenue = 1, Cost = 1 → Profit = 0
    - If market price is 2 (all clean), then:
        - Clean producers: Revenue = 2, Cost = 2 → Profit = 0
        - (No dirty in this case)
  - **Pollution Effect**: At the end of each round, total pollution is updated. When pollution reaches a threshold (say 5 units), every subsequent round, each team loses 1 point due to environmental damage (regardless of their production method). 
    - Example: If pollution is 5 or more, then in addition to their production profit/loss, every team loses 1 point per round.

  ### Pollution Accumulation and Threshold
  - Pollution accumulates: Each dirty choice adds 1. Pollution never decreases (unless we add a cleanup option, but that complicates).
  - Threshold: Set a threshold T (e.g., 5). Once pollution >= T, every round thereafter causes a 1-point loss to every player.

  ### Timeline for 90 minutes
  1. **Introduction and Rules Explanation (10 minutes)**
     - Explain the setup, choices, payoffs, and pollution effects. 
     - Emphasize that the goal is to maximize their own team's points (which will be converted to candy).
     - Write the payoff matrix on the whiteboard:

       | Your Choice \ Market Price | Price=1 (if any dirty) | Price=2 (all clean) |
       |----------------------------|------------------------|---------------------|
       | **Clean**                  | -1                     | 0                   |
       | **Dirty**                  | 0                      | (not possible)      |

     - Also explain pollution: 
       - Each dirty adds 1 pollution.
       - When pollution >= T (say 5), every team loses 1 extra point per round.

  2. **Pre-Game Communication Phase (5 minutes)**
     - Teams are allowed to talk to each other freely and make agreements (e.g., "Let's all go clean!"). 
     - They can even make promises. But remind them that there is no enforcement mechanism.

  3. **Rounds 1 to N (30-40 minutes)**
     - Each round:
       - Teams have 1 minute to discuss internally (within their team) and then secretly submit their choice (clean or dirty) on a piece of paper to the facilitator.
       - The facilitator collects choices, then announces:
          - How many chose dirty? (But not who, to preserve anonymity until debrief)
          - The market price (1 if at least one dirty, 2 otherwise)
          - Updates pollution: adds the number of dirty choices.
          - If pollution >= T, announces the extra 1-point loss for all.
          - Calculates each team's profit for the round and updates their total points.
          - Writes the round summary on the whiteboard (pollution level, number of dirty, and perhaps a running total of points for each team? But to keep it anonymous, maybe just the aggregate and the pollution).

     - We play until we see the trap in action (pollution builds, and then the extra losses kick in) and for a few rounds after. Alternatively, we can set a fixed number of rounds (say 8) to fit the time.

  4. **Escape Phase (15 minutes)**
     - Once the trap is evident (pollution is high and causing losses), pause the game.
     - Announce that teams can now try to escape the trap. They have 10 minutes to discuss and implement any solution they can think of (except changing the rules of the game). Examples: 
       - Form a pact to all go clean (but how to enforce?).
       - Create a punishment mechanism for defectors (e.g., if someone goes dirty, other teams can punish them by... but what? We need to design a punishment option).
       - Vote with their feet? (But in this game, they can't leave the market. So we might need to allow for a new feature: teams can choose to exit the market, but then they get 0 for the rest of the game and avoid future losses. Or they can form a coalition and set their own rules.)

     - We need to design the escape options. Let's add:
       - **Punishment Option**: After the escape discussion, in the next rounds, we allow teams to choose to punish. But punishment must be costly to the punisher? Or we can say that if a team chooses dirty, and at least one other team chooses to punish, then the dirty team loses 2 points (or something). But we don't want to complicate too much.

     Alternatively, we can let them propose any solution and then we implement it if it's feasible. But we must pre-design the options to keep control.

     - Instead, let's allow them to form a **binding agreement** if they can unanimously agree to a new rule. But the rule must be simple. For example:
       - They can vote to impose a tax on dirty production? But we are the facilitator and can change the rules if they agree.

     - However, to keep it within the spirit of the game, we might not change the rules. Instead, we can allow:
       - **Option 1: Norms and Punishment**: In subsequent rounds, after choices are revealed (we break anonymity for punishment), teams can choose to punish a dirty team by sacrificing 1 point to take away 2 points from the dirty team. But this requires a new choice phase and might be complex.

     - **Simplicity**: Let the escape phase be a discussion followed by one more round (or two) where they try to implement their solution. They can try to coordinate without changing the game mechanics. Then we see if pollution stops.

     - Alternatively, we can allow teams to **exit**: At the beginning of a round, a team can choose to exit. They get a fixed payoff (say, 5 points) for the rest of the game and do not participate further (and don't suffer pollution losses). But they also don't earn from production.

     We'll let the group discuss and choose a strategy. Then we play 2-3 more rounds to see if it works.

  5. **Debrief (20 minutes)**
     - Use the whiteboard to map the game to the concepts:
       - **Locally rational choices**: In each round, choosing dirty gives 0 instead of -1 (if market price is 1) and if you choose clean when others are dirty, you lose. So dirty is dominant if you think others might be dirty. And if pollution isn't high, the immediate loss of 1 point by being clean when others are dirty is worse than the future loss (which is uncertain and shared).
       - **Equilibrium**: Even when pollution is high, if one team switches to clean, they lose 1 point (because they are clean while others might be dirty) and the pollution still increases if others are dirty. So they are better off staying dirty until everyone switches at once? But without coordination, it's hard.
       - **Why the trap holds**: The individual incentive to defect (go dirty) is high because it avoids immediate losses and the pollution cost is shared. The agreements made in the pre-game phase failed because there was no way to enforce them.
       - **Escape attempts**: Did they try punishment? Did it work? What about exit? If some teams exit, then the remaining might have an easier time cooperating? But the exit payoff might be low. Or if too many exit, the market shrinks? (But in our game, market price is set by the cheapest producer regardless of the number of players.)

     - Use the actual scoreboard: Show how points changed over rounds. Point out the rounds where pollution started to hurt and how the choices led to that.

     - Highlight: 
       - The pre-agreement phase: Did they make an agreement? How many broke it? Why? (Even if one team breaks it, the market price drops to 1, making clean unprofitable.)
       - The escape phase: What did they try? Did it work? Why or why not?

  ### Addressing Cooperation
  - To prevent the group from cooperating too easily, we can use:
     - **Anonymity**: By not revealing who chose dirty until the end, we reduce the social pressure. During the game, only the number of dirty choices is revealed, not the identities.
     - **Team size**: Teams of 2 might be more competitive than individuals.
     - **Payoff structure**: The payoff matrix makes it individually rational to defect. Even if they agree to all clean, one team can defect and get 0 (while others get -1) and also avoid the cost of clean production. And if they think others might defect, they are better off defecting. This is the prisoner's dilemma at the team level.

  - If they still manage to cooperate (all clean) for many rounds, then the trap doesn't trigger. But then we can note that they avoided the trap by perfect cooperation. Then in the debrief, we can discuss: 
     - How hard was it to maintain? 
     - What if one team had defected? 
     - In the real world, with more players and imperfect information, it's harder.

  ### What the Game Cannot Capture
  - **Blunt honesty section**:
    1. **In the game, the payoff structure is fixed and known**. In the real world, the payoffs and the thresholds might be unknown or uncertain.
    2. **The game is short and the players are small in number**. Real-world multipolar traps involve millions of actors and long time horizons, so the feedback loops are slower and harder to perceive.
    3. **The game has a clear endpoint**. Real traps can go on indefinitely.
    4. **The players can see the whole system**. In reality, information is fragmented.
    5. **The players are all in one room and can communicate easily**. In reality, communication might be difficult, and there might be cultural or language barriers.
    6. **The costs and benefits are simplified**. Real environmental costs are nonlinear and might have tipping points that are more complex.
    7. **The game doesn't have external enforcement mechanisms**. In the real world, there might be governments or international bodies that can help, but also they might be part of the trap.

  We should explicitly mention these limitations in the debrief.

  ### Potential Problems and Solutions
  - **Problem**: The group might cooperate and avoid the trap entirely.
     - **Solution**: In the debrief, we can still discuss why that worked and why it might not in a larger or less connected group. Also, we can note that in the pre-game communication they made an agreement and it held. But then ask: what if one team had defected? How would they have responded? Also, in the escape phase, if pollution builds, it might break down.

  - **Problem**: Time might run out.
     - **Solution**: Keep rounds short (1 minute decision) and limit the number of rounds. Aim for 5-6 rounds before the escape phase and 2-3 after.

  - **Problem**: The payoff might be too abstract.
     - **Solution**: Use candy as the currency. Each point = 1 piece of candy. But we don't want to bankrupt the facilitator. So set the conversion: perhaps 10 points = 1 piece of candy? Or adjust so that the total candy is manageable.

  ### Candy Payoff Scheme
  - To manage candy costs, we can set:
     - Starting points: 10 per team.
     - Each round: 
          - Clean in a dirty market: -1 point
          - Dirty: 0 points
          - Clean in a clean market: 0 points
          - Plus, if pollution >= T, every team loses 1 point per round.
     - So teams can end with negative points? We don't want that for candy. So we can avoid negative points by:
          - Set a minimum of 0 points.
          - Or start with more points (say 20) and have the losses be small.

  Alternatively, we can use only positive payoffs. Let's restructure:

  - **Revised Payoffs (to avoid negatives)**:
     - Each team starts with 0 points.
     - **Clean in a clean market**: +2 points (revenue 2, cost 2 → profit 0? That doesn't add). Let's redefine:

  We want:
  - Clean costs 2, dirty costs 1.
  - Market price is set to the minimum cost available.

  But then clean in a dirty market: you spend 2 to produce and get 1 revenue → net -1.
  Instead, we can have:

  - Each team, regardless of choice, gets a base revenue of 2? Then:
     - If you choose clean: cost 2, so profit = 2 (revenue) - 2 (cost) = 0.
     - If you choose dirty: cost 1, so profit = 2 - 1 = 1.
     - But then there's no incentive to set the market price? We need the market price to be set by the cheapest.

  Alternative: The revenue depends on the market price.

  Let's stick to the original but avoid negative points by having a higher starting point and no negative points. We can set:

  - Start with 20 points per team.
  - Then the worst that can happen in a round: 
     - Clean in a dirty market: -1 (so down to 19, then 18, ...)
     - Plus pollution loss: -1 per round if pollution>=T.

  With 8 rounds and T=5, the maximum loss per team might be around 10 points? So starting at 20, they end with at least 10. Then we can convert points to candy: 1 point = 1 small candy? Or 2 points = 1 candy? Adjust based on your candy budget.

  ### Revised Payoff Table (with positive starting points)
  - Starting: 20 points per team.
  - Each round:
     - If team chooses clean and market price is 1 (because someone dirty): -1 point.
     - If team chooses dirty and market price is 1: 0 change.
     - If market price is 2 (all clean): 0 change for clean teams.
     - If pollution >= T (say 5): every team loses 1 point (regardless of their choice).

  ### Game Flow Example
  - Round 1: 
     - Suppose 3 teams choose dirty, 4 clean.
     - Market price = 1 (because dirty exists).
     - Clean teams: -1 each. Dirty teams: 0.
     - Pollution: +3 (now 3).
     - No pollution loss (since 3<5).
  - Round 2: 
     - Suppose 5 dirty, 2 clean.
     - Market price=1.
     - Clean: -1 each. Dirty: 0.
     - Pollution: 3+5=8 (>=5) → so every team loses 1 extra.
     - So clean teams: -2 total (for clean choice and pollution). Dirty teams: -1 (only pollution).
  - And so on.

  ### Timeline Refined
  - 0-10 min: Introduction and rules.
  - 10-15 min: Pre-game communication (teams can talk to each other).
  - 15-50 min: Rounds (5 minutes per round? We need about 5-6 rounds to build pollution, then 2-3 after escape. So 8 rounds * 3 min/round = 24 min, plus setup. Let's say 30 min for 8 rounds: 15:00-45:00).
    - Per round: 
        - 1 min: teams decide and submit.
        - 1 min: facilitator calculates and updates board.
        - 1 min: announce results and update points. 
    - So 3 min per round, 8 rounds → 24 min.
  - 45-60 min: Escape phase (15 min): 
     - 10 min discussion among teams.
     - Then 2 more rounds (6 min) to test their solution.
  - 60-80 min: Debrief (20 min).

  Total: 80 min, leaving 10 min buffer.

  ### Final Notes
  - This design creates a clear multipolar trap: the incentive to use dirty production (to avoid the -1 loss when others are dirty) leads to pollution, which then causes a loss for everyone. The pre-game agreements may break down because one team can defect and gain. The escape phase allows them to try solutions, which may or may not work.

  - If the group cooperates from the start and never uses dirty, then they avoid pollution and have 0 profit per round (so they keep their 20 points). That's the best outcome. But if even one team defects, it triggers the race. The facilitator can note this: cooperation is the best, but it's fragile.

  - We can adjust T (pollution threshold) based on the number of teams. With 7 teams, if T=5, it can be reached in 1-2 rounds if many go dirty.

  - For the escape phase, we can allow:
     - Teams to propose a new rule (like a tax on dirty production that is redistributed) but then we have to implement it. Alternatively, we can let them use social norms and then see if they can coordinate without changing rules.

  - We might also allow teams to see the cumulative pollution and the current round's choices (but not who) so they have information.

  This should work. Let me know if you have any adjustments.
answer: |-
  Here's a comprehensive game design tailored to your specifications, incorporating hands-on trap construction, communication phases, escape attempts, and candid reflection sections. The game is called **"The Commons Collapse"** and simulates a resource extraction race with optional coordination mechanisms.

  ---

  ### **Game Overview: The Commons Collapse**
  **Core Dynamic**: Teams compete to harvest candy from a shared resource pool. Each harvest boosts individual gains but depletes the commons. If the commons collapse, *all* future gains are lost. Players face a tension between short-term self-interest and long-term collective survival.

  **Players**: 14 (split into 7 teams of 2).  
  **Duration**: 90 minutes total.  
  **Materials**:  
  - Whiteboard (track scores, resource levels, and agreements).  
  - Candy (for payoffs).  
  - Paper/pen for secret voting.  
  - Timer.  

  **Payoffs**:  
  - **Points system**: 1 point = 1 candy piece at the end.  
  - Teams start with 10 points (candy) as a "safety fund." Points can be gained/lost during play.  

  ---

  ### **Rules & Phases (Total: 70 min)**  
  #### *Phase 1: Setup (5 min)*  
  - Form 7 teams of 2. Each team is a "corporation" harvesting from a shared resource (the commons).  
  - **Whiteboard setup**:  
    - **Resource Pool**: Starts at 20 units.  
    - **Harvest Rates**: Teams choose **Low (1 unit)** or **High (3 units)** each round.  
    - **Collapse Threshold**: If the pool ≤ 0, all future harvesting stops (no more points).  

  #### *Phase 2: Communication & Agreements (10 min)*  
  - Teams freely negotiate. They can:  
    - Promise to choose **Low** harvest.  
    - Propose pacts or penalties (e.g., "If anyone harvests High, we boycott them!").  
  - **Key rule**: Agreements are **not binding**. No facilitator enforcement.  
  - *Goal: Let them build false confidence in handshake deals.*  

  #### *Phase 3: Harvesting Rounds (30 min, 6 rounds)*  
  - Each round (5 min/round):  
    1. **Secret choice**: Teams submit **Low** or **High** harvest anonymously.  
    2. **Results**:  
       - Total harvest = sum of all choices.  
       - Deduct total harvest from the resource pool.  
       - **Payoffs**:  
         - **Low harvest**: Gain 2 points.  
         - **High harvest**: Gain 4 points.  
    3. **Collapse check**: If pool ≤ 0, all subsequent rounds yield **0 points**.  
    4. **Whiteboard update**:  
       - Record remaining pool, harvest totals, and team points.  
       - *Never reveal who chose High/Low until the end.*  
  - **Incentive trap**:  
    - Choosing **High** is locally rational (4 > 2 points).  
    - But if >4 teams choose High, the pool depletes in ≤2 rounds.  

  #### *Phase 4: Escape Attempt (15 min)*  
  - After round 3 (once pool is visibly depleted), pause and announce:  
    > *"The commons are at risk. You have 10 minutes to design an enforcement mechanism. You may use:*  
    > - *Fines (deduct points from cheaters).*  
    > - *Norms (public shaming).*  
    > - *Voting with feet (exit the game for a fixed payout).*  
    > - *Anything else you invent."*  
  - **Rules for enforcement**:  
    - Teams can propose systems, but implementation requires majority vote.  
    - **Fines**: If agreed, cheaters lose 3 points (distributed to others).  
    - **Exit**: Teams can exit for 5 points (but can’t rejoin).  
  - Play 2 final rounds with their chosen system.  

  #### *Phase 5: Final Scoring (10 min)*  
  - Convert points to candy.  
  - **Base payout**: Starting 10 points.  
  - **Bonus**: Points earned during harvesting.  
  - **Collapse penalty**: If pool ≤0, teams lose 2 points/round in final rounds.  

  ---

  ### **Debrief Guide (20 min)**  
  Use the whiteboard to map their experience to multipolar traps:  
  1. **Locally rational choices**:  
     - *Ask:* "Who chose High at least once? Why?" → Highlight immediate gains (4 > 2 points).  
     - *Map to Moloch:* Individual incentives overpower collective good.  

  2. **Why agreements failed**:  
     - *Ask:* "Did anyone break an agreement? Why?" → No enforcement = temptation to defect.  
     - *Map to real world:* Handshake deals fail without teeth (e.g., climate agreements).  

  3. **Equilibrium lock-in**:  
     - *Ask:* "Even when you knew the pool was dying, why keep choosing High?" → Fear of being "suckered" if others defect.  
     - *Map to game theory:* Nash equilibrium where mutual defection is stable.  

  4. **Escape attempts**:  
     - *Ask:* "Did fines/norms work? Why or why not?"  
       - Likely failure: Fines require detection (anonymity prevented this). Exits fragmented the group.  
     - *Map to solutions:* Real enforcement needs detection (e.g., monitoring) and credible penalties (e.g., trade sanctions).  

  **Use their scoreboard**:  
  > *"In round 3, the pool dropped to 5 units. Team A earned 4 points by going High—smart short-term. But by round 5, the pool collapsed, costing everyone 8 points. Your total candy would be 20% higher if all chose Low."*  

  ---

  ### **Honest Section 1: Predictable Problems & Fixes**  
  **Problem**: Your friendly group will likely cooperate early, avoiding the trap.  
  **Why**: Trust, social bonds, and desire to "win together" override individual incentives.  

  **Solutions to induce defection**:  
  - **Anonymity**: Secret voting reduces peer pressure. Do **not** reveal who chose High until the end.  
  - **Stranger matching**: If feasible, pair teams who don’t know each other well.  
  - **Entry "fees"**: Start teams with unequal candy (e.g., 8 vs. 12 pieces) to create status competition.  
  - **If they still cooperate**: Let it happen! Then discuss:  
    > *"You avoided the trap—but only because you’re 14 friends in a room. Real-world traps involve strangers, opposing tribes, and no facilitator. How would this play out with 10,000 players?"*  

  ---

  ### **Honest Section 2: What the Game Can’t Capture**  
  **Bluntly tell your group**:  
  > *"This game is a simplification. Real multipolar traps are messier because:*
  > 1. **Time lags**: Pollution/climate effects take years to bite—here it’s instant.  
  > 2. **Hidden payoffs**: You saw the resource pool. IRL, corporations hide environmental costs.  
  > 3. **Scale**: 14 players can talk easily. Try coordinating 7 billion with language barriers.  
  > 4. **Exit costs**: Exiting here cost 5 points. IRL, leaving a job/country risks starvation.  
  > 5. **Facilitator bias**: I designed the trap. Reality has no ‘rules’—just emergent chaos."*  

  ---

  ### **Why This Isn’t a Perfect Analog (And Why It’s Still Worth Doing)**  
  **The risk**: Players may think, "This trap only exists because you made it that way."  
  **The rebuttal**:  
  - The game *is* contrived, but it **mirrors human systems** (e.g., overfishing, carbon emissions). Use the debrief to ask:  
    > *"Did anyone feel ‘forced’ to choose High? That’s how CEOs feel competing in markets. The rules aren’t handed down—they emerge from our choices."*  
  - **Strength**: Players *feel* the trap (e.g., guilt over choosing High, frustration at collapse). This emotional resonance > abstract theory.  

  **Alternative if cooperation dominates**:  
  - In the escape phase, secretly incentivize 1-2 teams to defect ("You’ll get bonus candy if you harvest High"). This simulates hidden corruption.  

  ---

  ### **Timeline Summary**  
  | Phase | Time |  
  |-------|------|  
  | Setup | 5 min |  
  | Communication | 10 min |  
  | Harvesting (6 rounds) | 30 min |  
  | Escape Attempt | 15 min |  
  | Scoring | 10 min |  
  | Debrief | 20 min |  
  | **Total** | **90 min** |  

  ---

  This design forces players to *live* the trap while allowing creativity in escapes. The candy payoff makes stakes tangible, and the debrief links their actions to real-world parallels. If your group cooperates, leverage it to discuss trust’s fragility at scale. If they descend into chaos, dissect why. Either way, they’ll viscerally grasp Moloch.
