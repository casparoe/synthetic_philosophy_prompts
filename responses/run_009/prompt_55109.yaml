prompt: |-
  I'm a first-year assistant professor, and last week I sat through my first faculty search committee meeting — and then through a two-hour argument about it afterwards that I couldn't follow to the end. Our bylaws say a candidate is to be hired only if the committee judges both that their research record is excellent and that their teaching fits the department's needs, and we are required to record separate votes on each of those judgments plus a final up-or-down vote. We are a three-person committee this year. On the research judgment, two of us voted yes and one voted no; on the teaching judgment, again two yes and one no — but it was a different pair each time, so every individual member's three votes were perfectly consistent with the stated rule. On the final question, however, the two members who had each been the lone "no" on one premise voted against the hire, and it failed two to one. The chair shrugged and said only the final vote is binding.

  Over coffee afterwards, two of my senior colleagues fought about what had actually happened. Dana said the committee had been collectively irrational: a majority of us accepted the research premise, a majority accepted the teaching premise, the rule says those jointly entail hiring, and then a majority rejected the hire — so the committee, taken as a whole, believes all the premises of a valid argument and denies its conclusion. If we had voted only on the premises and let the rule mechanically determine the outcome, we would have been obliged to make an offer; the fact that we didn't shows we switched from premise-based to conclusion-based voting midstream, whenever it suited the result. Marcus answered that nothing irrational happened, because there is no "the group" that believes anything — there are three individuals, each with a perfectly consistent set of judgments, and the contradiction Dana is pointing at only appears if you illegitimately manufacture a fourth mind out of our majority votes. Dana replied that if there's no collective agent, then the committee's vote isn't a decision of anything and the bylaws are pointless: the entire institution of committee voting presupposes that judgments can be pooled into a group outcome, and any pooling method that lets "the group" contradict itself while every member is consistent has failed at its one job. Marcus said the real failure would be Dana's preferred procedure, which would have forced a hire that two-thirds of the committee opposed — including the very people whose judgments constituted the majorities on each premise — on the strength of an inference that only one of us actually endorses; majority rule is supposed to track members' all-things-considered judgments, not a syllogism the committee never voted on.

  There were further rounds in this vein (someone brought up a candidate we rejected two years ago in circumstances that were the mirror image, and Marcus argued that premise votes are a crude instrument anyway because they can't register how strongly a member holds each belief). A passing graduate student muttered something about Condorcet, but when I looked that up it seemed to be about circular rankings, which we didn't have. What I would like is a careful adjudication of the argument as it actually unfolded: go through the main moves on each side and say who is right about what, whether our outcome was a failure of rationality, a failure of procedure, or not a failure at all, and whether Dana's premise-based procedure is a genuine improvement or merely relocates the problem. I'd also like to know whether there is any principled way to design a voting procedure that avoids whatever went wrong here — or some reason to think nothing could — and whether this exact configuration has a name of its own, since the Condorcet material doesn't seem to fit.
reasoning: |-
  We are given a situation where a three-person committee votes on two premises (research and teaching) and then on the conclusion (hiring). The rule is that hiring requires both premises to be true. The votes were:

  - Research: Yes (A,B), No (C)  [so majority yes]
  - Teaching: Yes (A,C), No (B)  [so majority yes]
  - Hiring: Yes (A), No (B,C)    [so majority no, hence not hired]

  Each individual's votes are consistent with the rule:

  - A: Research Yes, Teaching Yes, Hiring Yes -> consistent (both premises true => conclusion true)
  - B: Research Yes, Teaching No, Hiring No -> consistent (premises not both true => conclusion false)
  - C: Research No, Teaching Yes, Hiring No -> consistent (premises not both true => conclusion false)

  But collectively, the majority accepted both premises (so by the rule, hiring should be approved) but then the majority rejected the hire. This is the paradox.

  Dana argues that the committee is collectively irrational: the group accepts the premises and the rule, but rejects the conclusion. Dana suggests that if we had only voted on the premises and then let the rule determine the outcome, we would have hired. But by having a separate vote on the conclusion, we allowed a switch to conclusion-based voting that led to a contradiction.

  Marcus argues that there is no collective agent and that the only real judgments are the individual ones, which are all consistent. He points out that forcing a hire based on the premises would go against the all-things-considered judgment of two members (B and C) who are against the hire. Moreover, only one member (A) actually endorses the inference (because A is the only one who voted for both premises and for hiring).

  We have to adjudicate:

  1. Was the outcome a failure of rationality, a failure of procedure, or not a failure at all?
  2. Is Dana's premise-based procedure a genuine improvement or does it just relocate the problem?
  3. Is there a principled way to design a voting procedure that avoids this?
  4. Does this configuration have a name?

  Let's break down the arguments.

  Dana's point: The group, by majority, believes:
     - Premise 1 (Research) is true (2-1)
     - Premise 2 (Teaching) is true (2-1)
     - The rule: "Premise1 AND Premise2 implies Hire" (which is the rule in the bylaws, so it's given)

  Therefore, by logic, the group should believe the Hire. But then the group, by majority (2-1), believes not Hire. So the group has inconsistent beliefs.

  Marcus's point: There is no collective mind. The "group belief" is just a construction. The only real beliefs are the individual ones, and they are consistent. Moreover, the hiring decision should reflect the overall judgment of the members. In this case, two members (B and C) are against the hire, so the hire should fail. He also points out that the premise-based procedure would force a hire that two members oppose, and only one member (A) actually holds the set of beliefs that would lead to a hire.

  This situation is known in social choice theory as the "doctrinal paradox" or the "discursive dilemma". It is a well-known problem that arises when a group must make a decision on multiple interconnected propositions.

  The doctrinal paradox occurs when:
     - There are multiple premises (here, two: research and teaching) and a conclusion that is a logical function of the premises (here, conjunction).
     - Each member votes on each proposition in a consistent way (with the logical constraint).
     - But when aggregated by majority, the premises are both true (so the conclusion should be true) but the conclusion is false by majority.

  So, the paradox is that the majority votes on the premises and the conclusion are inconsistent with the logical rule.

  Now, to the questions:

  1. Was the outcome a failure of rationality, a failure of procedure, or not a failure at all?

     It is a failure of the procedure to preserve logical consistency at the group level. The procedure (majority vote on each proposition) does not guarantee that the group's set of judgments will be consistent with the logical rule. So it is a procedural failure if we require the group to have consistent beliefs. But note that the procedure did exactly what the bylaws required: separate votes on each judgment and a final vote. The bylaws do not specify that the premise votes and the conclusion vote must be logically consistent. They only say that the final vote is binding.

     However, from a logical point of view, the group's set of judgments (as determined by majority) is inconsistent. So if we think of the committee as a collective agent that should have consistent beliefs, then it is a failure of rationality at the collective level.

     But Marcus would argue that there is no collective agent, so there is no irrationality. The procedure worked as designed: each member voted consistently, and the final vote (which is the binding one) reflected that two members opposed the hire. So the outcome is not a failure if we take the view that the final vote is the expression of the all-things-considered judgment.

     So, under the lens of collective rationality, it is a failure. But under the lens of individual rationality and the procedure as written, it is not a failure.

  2. Is Dana's premise-based procedure a genuine improvement or does it merely relocate the problem?

     Dana suggests: only vote on the premises and let the rule determine the conclusion. Then we would have:
        Premise1: majority yes -> true
        Premise2: majority yes -> true
        Conclusion: true -> hire.

     This avoids the inconsistency at the group level. The group's judgments (on the premises) and the conclusion (by the rule) are consistent.

     However, Marcus points out that this forces a hire that two members (B and C) oppose. Moreover, only one member (A) actually holds the belief that the premises are both true and that the hire should occur. Member B believes teaching is not adequate, and member C believes research is not adequate. So they would both be overruled on the premises and then forced to accept a hire they oppose.

     Also, note that the premise-based procedure might be seen as undemocratic because it ignores the direct vote on the conclusion. The final outcome is determined by the premises and the rule, not by the members' overall judgment.

     But the rule in the bylaws is that hiring requires both premises. So the premise-based procedure is actually more aligned with the rule: it uses the same rule to combine the premises. The conclusion-based procedure (voting directly on the conclusion) may ignore the structure of the rule.

     However, the problem is that the rule is about the individual judgments: each member is to judge the premises and then the conclusion. The bylaws require separate votes on the premises and a final vote. They do not say that the premise votes should determine the conclusion automatically. So the bylaws as written allow for the conclusion-based vote to override the premise-based logic.

     The premise-based procedure would be an improvement if we value collective consistency. But it comes at the cost of disregarding the members' all-things-considered judgments on the conclusion. In particular, a member might agree with both premises but have some other reason to reject the hire (though the bylaws don't mention any other criteria). Alternatively, a member might think the premises are not independent (e.g., the teaching record is only acceptable if the research is strong enough) but the rule doesn't allow for that.

     Moreover, the premise-based procedure might also face problems if there are more complex logical structures or if the premises are not independent. But in this simple case, it does restore consistency.

     However, note that the premise-based procedure does not necessarily reflect the will of the majority on the conclusion. In fact, in this case, the majority on the conclusion is against, but the premise-based procedure forces a hire. So it might be seen as less democratic.

  3. Is there a principled way to design a voting procedure that avoids this?

     There is no perfect solution. This is a known paradox and there are trade-offs.

     Some possibilities:

     a. Stick with the premise-based procedure: vote only on the premises and let the rule determine the conclusion. This ensures consistency but may override the members' overall judgments.

     b. Stick with the conclusion-based procedure: only vote on the conclusion and not on the premises. But then you lose the structure of the rule and the information about why the decision was made.

     c. Use a different aggregation rule. For example, require unanimity? But that might lead to gridlock.

     d. Use a sequential procedure: first vote on the premises, then if both are approved, then vote on the conclusion. But in this case, if both premises are approved by majority, then you have a second vote on the conclusion. Then the outcome might be that the premises are approved but the conclusion is rejected (as happened in the final vote here). That would still lead to inconsistency if we take the premise votes as group beliefs.

     e. Accept that the majority vote on each proposition may be inconsistent and live with it. The bylaws currently do this by making the final vote binding.

     f. Use a consensus-based approach or deliberative methods to try to resolve the differences.

     g. Another idea: vote on the premises and then if there is a majority for both, then the hire is automatically approved without a separate vote on the conclusion. This is Dana's suggestion. But then you avoid the inconsistency by not allowing a separate vote on the conclusion.

     However, the bylaws require a final vote. So that would require changing the bylaws.

     In principle, there is no procedure that can always guarantee consistent group judgments while also satisfying other desirable properties (like respecting individual judgments and being democratic). This is related to the impossibility results in judgment aggregation.

  4. Does this exact configuration have a name?

     Yes, it is the doctrinal paradox (or discursive dilemma). It is a specific instance of the more general problem in judgment aggregation.

     The Condorcet paradox is about cyclical majorities in preferences, but this is about the inconsistency in majority voting on logically connected propositions.

  Conclusion:

  - Dana is right that there is a collective inconsistency: the group, by majority, accepts the premises and the rule but rejects the conclusion. So if we require the group to have consistent beliefs, then it is a failure of collective rationality.

  - Marcus is right that the premise-based procedure may force a hire that two members oppose and that the members' individual judgments are consistent. Moreover, the premise-based procedure does not capture the overall judgment of the members on the conclusion.

  - The outcome under the current procedure is not a failure of procedure because the procedure (as per the bylaws) was followed and the final vote is binding. But it does reveal a flaw in the design of the procedure if we want the group to have consistent beliefs.

  - To avoid this, one could change the bylaws to use a premise-based procedure (i.e., let the premise votes determine the conclusion without a separate conclusion vote). But that would remove the final vote and might be seen as undemocratic because it ignores the overall judgment.

  - Alternatively, one might stick with the current procedure and accept that sometimes the group will have inconsistent beliefs, but the final vote reflects the overall will.

  - There is no perfect solution. The doctrinal paradox shows that majority voting on interconnected propositions can lead to inconsistencies.

  In summary:

     - The committee's outcome is an instance of the doctrinal paradox.
     - It is a failure of collective rationality (as Dana points out) but not of individual rationality (as Marcus points out).
     - The current procedure (with a separate vote on the conclusion) allows for the expression of overall judgment but at the risk of inconsistency. The premise-based procedure avoids inconsistency but at the risk of overriding overall judgment.
     - There is no universally accepted solution, and the choice between procedures depends on what we value more: collective consistency or respect for overall member judgments.

  Final note: In the specific context of the bylaws, they require both premise votes and a final vote. The chair was correct that only the final vote is binding. However, the bylaws do not specify how the premise votes should relate to the final vote. Therefore, the procedure is as written, but it may lead to paradoxical outcomes.
answer: |-
  ### Adjudication of the Argument

  The debate between Dana and Marcus centers on a classic problem in judgment aggregation known as the **doctrinal paradox** (or "discursive dilemma"). This paradox arises when individual committee members hold logically consistent views, but majority voting on interconnected propositions (premises and a conclusion) leads to a collective inconsistency. Below, I break down the core arguments, assess the rationality and procedural issues, evaluate Dana's proposed solution, and discuss procedural alternatives.

  ---

  ### Key Moves in the Argument
  #### Dana's Position: Collective Irrationality
  1. **The Group as a Rational Agent**:  
     Dana argues the committee should be treated as a single rational agent. By majority vote, the group accepts both premises:  
     - Research is excellent (2-1).  
     - Teaching fits the department's needs (2-1).  
     The bylaws state that both premises jointly imply hiring. Yet, the group rejects the hire (2-1). Thus, the group "believes" the premises and the rule but denies the conclusion—a logical contradiction.  

  2. **Procedural Flaw**:  
     Dana claims the committee "switched" from premise-based voting (where premises determine the outcome) to conclusion-based voting (where the final vote overrides the premises). This inconsistency allowed two members (B and C) to "veto" the hire despite each premise having majority support. If the committee had adhered strictly to premise-based voting, the hire would have been automatic.  

  3. **Institutional Necessity**:  
     If committees cannot form a coherent group judgment, the entire voting process is pointless. The bylaws presuppose that individual judgments can be aggregated into a consistent group decision.  

  #### Marcus's Position: Individual Rationality Trumps Collective Fiction
  1. **No Collective Mind**:  
     Marcus denies that a "group belief" exists. Only individuals hold beliefs, and all three members were individually consistent:  
     - A: Research yes, teaching yes, hire yes.  
     - B: Research yes, teaching no, hire no.  
     - C: Research no, teaching yes, hire no.  
     There is no "fourth mind" to attribute contradictory beliefs to.  

  2. **Majority Rule Respects Overall Judgment**:  
     The final vote reflects the committee's all-things-considered opinion: two members oppose the hire. Forcing a hire via premise-based voting overrules the majority's overall will (since only A supports the hire) and ignores the intensity or interdependence of beliefs (e.g., B might accept the research but deem teaching inadequate for hire).  

  3. **Premise-Based Voting is Undemocratic**:  
     Premise-based voting mechanically applies a syllogism that only one member (A) endorses. It would force an outcome opposed by 2/3 of the committee, violating the spirit of majority rule.  

  ---

  ### Who Is Right About What?
  - **Dana is correct about collective inconsistency**:  
    The committee's majority votes are logically incoherent: the premises entail the hire, but the hire is rejected. This *is* a failure of **collective rationality**—if we expect the group to behave like a rational agent. The doctrinal paradox proves that majority voting on interconnected propositions can generate inconsistent group "beliefs," even when every member is consistent.  

  - **Marcus is correct about individual consistency and democratic legitimacy**:  
    There is no failure of **individual rationality**. Each member's votes align with their personal judgment. Moreover, the final vote legitimately reflects the committee's overall preference: two members oppose the hire. Premise-based voting risks tyranny by minority (e.g., A could force a hire even if B and C object).  

  - **The Core Conflict**:  
    Dana prioritizes *logical coherence* of the group's output; Marcus prioritizes *majority will* on the final decision. Both views are defensible, but they reflect irreconcilable values.  

  ---

  ### Was This a Failure?  
  - **Failure of Collective Rationality**: Yes.  
    The group's votes violate the logical rule in the bylaws. This is inherent to the doctrinal paradox and undermines the committee's ability to "reason" as a body.  
  - **Not a Failure of Procedure**: No.  
    The committee followed the bylaws: separate votes on premises and conclusion, with the final vote binding. The chair was correct to treat the final vote as decisive.  
  - **Procedural Design Flaw**: Yes.  
    The bylaws mandate votes on both premises *and* the conclusion without specifying how they interact. This creates a gap where paradoxes can arise.  

  ---

  ### Is Dana's Premise-Based Procedure a Genuine Improvement?  
  **Yes, but it relocates the problem**:  
  - **Advantages**:  
    - Restores collective consistency: The hire would occur automatically if both premises pass by majority, honoring the logical rule.  
    - Avoids "steering" by strategic voting (e.g., members cannot vote insincerely on premises to manipulate the outcome).  
  - **Disadvantages**:  
    - **Overrides overall judgment**: Two members (B and C) would be forced to accept a hire they oppose, despite each being pivotal in rejecting a premise. This feels undemocratic.  
    - **Ignores nuance**: Premise-based voting cannot capture how strongly members weigh premises (e.g., if B views teaching as a dealbreaker) or interdependencies (e.g., "research excellence only matters if teaching is adequate").  
    - **Shifts the paradox**: If the premises had failed, premise-based voting might block a hire that a majority supports (e.g., if research fails 2-1 but teaching passes 3-0, and the final vote favors hire 2-1).  

  **Verdict**: Premise-based voting "solves" the logical flaw but creates a legitimacy problem by disregarding the committee's all-things-considered judgment. It is superior for ensuring coherence but inferior for respecting majority will on the final decision.  

  ---

  ### Can a Voting Procedure Avoid This Problem?  
  **No perfect solution exists**, but alternatives mitigate the issue:  
  1. **Conclusion-Based Only**:  
     - Vote only on the final hire (ignoring premises).  
     - *Pros*: Reflects overall will; avoids paradoxes.  
     - *Cons*: Loses transparency on *why* the decision was made; violates bylaws requiring premise votes.  

  2. **Premise-Based Only**:  
     - Vote only on premises; the conclusion is automatic.  
     - *Pros*: Ensures logical consistency.  
     - *Cons*: Overrides final judgment; may feel mechanical.  

  3. **Sequential Voting with Deliberation**:  
     - Vote on premises first. If both pass, proceed to a final vote on the hire, but allow debate to resolve disagreements (e.g., "If we all accept research, why do B and C oppose teaching?").  
     - *Pros*: Encourages consensus; can reveal hidden reasons.  
     - *Cons*: Time-consuming; may not resolve deadlocks.  

  4. **Supermajority or Unanimity**:  
     - Require consensus or a supermajority (e.g., 3/3 or 2/3) for premises or the conclusion.  
     - *Pros*: Reduces inconsistency risk; promotes broad agreement.  
     - *Cons*: May lead to gridlock; biases toward status quo.  

  5. **Weighted Voting or Expertise Adjustment**:  
     - Assign weights to votes based on expertise (e.g., research-focused members weigh heavier on research).  
     - *Pros*: Reflects competence.  
     - *Cons*: Subjective; impractical in small committees.  

  **Reality Check**: No procedure escapes trade-offs. The doctrinal paradox is unavoidable when:  
  - Judgments are logically connected.  
  - Individual views diverge.  
  - Majority voting is used per proposition.  

  ---

  ### Name of the Configuration  
  This is the **doctrinal paradox**, distinct from the Condorcet paradox (which involves cyclical preferences). It occurs when:  
  - A conclusion is a function of premises (e.g., hire iff research AND teaching).  
  - Majority votes support the premises but reject the conclusion (or vice versa).  
  - All individual judgments are logically consistent.  

  ---

  ### Final Recommendations  
  1. **Amend the Bylaws**:  
     - Clarify how premise votes interact with the final vote. Options:  
       - "If both premises pass by majority, the hire is automatically approved." (Premise-based)  
       - "The final vote is binding, but premise votes are advisory for deliberation." (Conclusion-based)  
     - Add a deliberation step to reconcile inconsistencies before voting.  

  2. **Acknowledge the Trade-off**:  
     - Premise-based voting prioritizes logical integrity; conclusion-based voting prioritizes democratic legitimacy. Choose based on institutional values.  

  3. **Accept Imperfection**:  
     - In small committees, consensus-building (e.g., "Can we all live with this hire?") may work better than formal voting.  

  This paradox reveals a deep tension in group decision-making. Dana and Marcus are both partially right, but their values clash—a hallmark of judgment aggregation problems. By revising procedures or norms, future committees can reduce friction, but eliminating the paradox entirely is unlikely.
