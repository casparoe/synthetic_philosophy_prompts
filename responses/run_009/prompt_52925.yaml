  For diagnosis, the user’s hypothesis about modal intuitions is solid. The possibility of mosaic duplicates with different laws is central. But maybe there's more. Are they talking past each other? Anti-Humeans focus on explanation and causation, while Humeans care about ontology and epistemology. That’s a project difference. Also, the circularity argument (inference problem) and the map-territory metaphor need addressing. 

