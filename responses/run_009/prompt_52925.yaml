answer: |-
  Your diagnosis is sharp, and the frustration is warranted—this *is* one of philosophy's most entrenched stalemates. Let's dissect it along your lines, stress-test your hypothesis, and identify possible paths (or lack thereof) for progress.

  ### 1. **The Core Disagreement: Beyond Verbal or Project Differences**
     - **Not Just Verbal:** While "law" is contested, the disagreement runs deeper. It's about the *structure of reality itself*: Is the world fundamentally "flat" (a mosaic of occurrent facts) or "layered" (with modal/nomological structure "over and above" the mosaic)? This is ontological, not semantic.
     - **Not Just Different Projects:** Both sides claim to address metaphysics *and* epistemology. Humeans argue their view *is* the correct metaphysics (there's nothing more); anti-Humeans argue their view *is* necessary for explanation/counterfactuals. Each accuses the other of failing at the *same* tasks (explaining regularities, grounding modality, supporting induction).

     **Your Modal Intuition Hypothesis is Key:**  
     The core *is* modal. The thought experiment: "Could two worlds be *identical* in their entire spatiotemporal history (the Humean mosaic) but differ in their laws?"  
     - **Anti-Humean:** "Yes! In World A, the mosaic is *necessitated* by Law L; in World B, it's a gigantic coincidence (or governed by a different law that happens to produce the same mosaic)." (Requires primitive modality/laws).  
     - **Humean:** "No. The laws supervene on the mosaic. If the mosaic is identical, the best system is identical. There's nothing else to 'differ'." (Denies primitive modality).  
     **Stress Test:** This *is* the fault line. Neither side can "prove" their intuition correct with empirical evidence because the scenario is metaphysically possible *by construction*. The stalemate arises because each view provides a *coherent* account of modality, but they are fundamentally incompatible starting points.

  ### 2. **Why the Stalemate Persists: Mutual Recrimination**
     - **Anti-Humean Charges:**
       - **Explanatory Vacuum:** "Humeanism makes regularity inexplicable. The 'best system' just *describes* the coincidence; it doesn't *explain* why it holds. Only governing laws/necessitation provide genuine explanation." (Your "restating the mystery" point).
       - **The Map/Territory Reversal:** "You're mistaking our *representation* (the best system) for the *thing represented* (the governing structure). Compression is epistemic; laws are ontological."
     - **Humean Charges:**
       - **The Inference Problem:** "How does 'N(F,G)' (a universal) *make* Fs be Gs? Saying 'it necessitates it' just pushes the question back. What guarantees N(F,G) entails ∀x(Fx→Gx)? If you say 'it's a law that N(F,G) entails regularities', you're circular." (Armstrong struggled with this).
       - **Epistemological Darkness:** "How could we ever know about 'governing' beyond the mosaic? All evidence is *in* the mosaic. Positing invisible governors is empirically vacuous and ontologically profligate."
       - **Changing Laws (Maudlin's Point):** This *is* a genuine headache for Humeans. A world with a sudden, fundamental law-change forces the "best system" to be either horrendously complex (encoding the change) or weaker (ignoring it). The anti-Humean just says "the law changed" – simpler *and* matches intuition. Humeans must bite the bullet: "The *history* was always governed by that complex, time-dependent 'law'." This *feels* like a cost.

  ### 3. **Your Solomonoff/MDL Prior: Valid, but Limited**
     - **Strength:** Humeanism *is* the natural metaphysical counterpart to algorithmic information theory. Compression *is* fundamental to prediction and scientific modeling. Denying this seems like refusing the "mathematically honest" view of what science *does*.
     - **Limitation:** Science aims for *explanation* as well as prediction. Anti-Humeans argue compression provides only the latter. MDL tells you the most efficient code for the data; it doesn't tell you *why* the data was generated that way. For many, explanation requires an answer to the "why" question that Humeanism seems to avoid.

  ### 4. **The Fragmentation of Humeanism (Hall's Point): A Symptom, Not a Killer**
     Hall is right: "Humeanism" is a cluster of choices (What counts as "simplicity"? "Strength"? Which language? What about chances?). This reflects the *difficulty* of making Best-System Analysis (BSA) concrete. However, it doesn't doom the *core idea* (supervenience on the mosaic). Anti-Humeanism has its own variants (Platonic vs. Aristotelian universals, primitivist vs. structuralist). Fragmentation shows the *challenge* of fleshing out either view, not that one is inherently superior.

  ### 5. **Diagnosis: A Fundamental Clash of Worldviews**
     This is a **substantive metaphysical disagreement with irreducible modal and explanatory commitments.** It bottoms out in:
     - **Modal Primitivism vs. Modal Reductionism:** Anti-Humeans accept primitive modality (necessitation, lawhood) as bedrock. Humeans insist all modality reduces to patterns in the non-modal mosaic.
     - **Explanatory Ideals:** Anti-Humeans demand explanations that cite *productive* or *constraining* structures. Humeans find such demands metaphysically spooky and settle for explanations citing the most efficient systematization of patterns.
     - **Ontological Parsimony vs. Explanatory Power:** Humeans win on parsimony (only the mosaic exists). Anti-Humeans win on intuitive explanatory power (laws *make things happen*).

     **The Impasse:** Neither side can "prove" their primitive is necessary or incoherent. The arguments are transcendental (What *must* the world be like for science/explanation/modality to be possible?) and hinge on irreconcilable intuitions about possibility and explanation.

  ### 6. **What Would Count as Progress? (Spoiler: It's Hard)**
     True empirical resolution seems impossible (by design). Progress might look like:
     1. **Clarifying the Projects:** Explicitly separating:
        - *Descriptive Metaphysics:* What fundamental categories must we use to *correctly describe* reality? (Humean: only particulars. Anti-Humean: + laws/universals).
        - *Theory Choice Epistemology:* How do we *discover* the best systematization of phenomena? (Here, BSA shines).
        - *Explanation:* What *satisfies* a request for explanation? (Anti-Humean: citing a governor. Humean: citing the pattern within the BSA).
        Acknowledging these are different (though related) questions might reduce talking past each other.
     2. **Formalizing the Costs:** Rigorously modeling scenarios like Maudlin's changing laws or "grue"-like mosaic descriptions. Can Humeans formalize BSA to handle these without absurdity? Can anti-Humeans formalize "governing" without circularity or obscurity? Showing one view *formally collapses* under its own demands would be progress.
     3. **Connecting to Science:** Finding a *scientific* context where the difference *matters for practice*. Does quantum gravity or cosmology *require* one view over the other to make sense of its formalism? (So far, neither seems uniquely privileged). If a scientific theory *committed* to irreducible nomic facts or explicitly required only a mosaic+BSA, it would force philosophers to engage differently.
     4. **Experimental Philosophy:** Probing modal intuitions (like your duplicate-world scenario) systematically. If one intuition is overwhelmingly dominant (or varies predictably), it might shift the dialectical weight, even if not decisive.
     5. **Embracing the Impasse:** Recognizing this as a foundational, perhaps unresolvable, divide in our conceptual scheme – like realism vs. anti-realism. Progress is understanding *why* it's intractable and what that says about metaphysics. As you suspect, **the disagreement likely lacks direct empirical content.** Its resolution (if any) may come from broader shifts in philosophical temperament or the development of new tools for understanding modality and explanation.

  **Conclusion:** Your diagnosis is largely correct. This is a substantive clash over the existence of primitive modal/nomological structure in the world, manifested in dueling intuitions about possibility and explanation. The stalemate persists because each side offers a coherent, self-contained system that addresses the core concerns of metaphysics and epistemology, but starts from incompatible fundamental commitments. Progress is unlikely to be a knockout blow but might come from sharper distinctions, formal modeling of edge cases, or finding unexpected traction in scientific practice. However, accepting that this is a genuine, non-verbal, empirically underdetermined rift in our understanding of nature might be the most honest "progress" available. The impasse *is* a finding: it reveals a deep tension in how humans conceptualize order and necessity in the universe.
