prompt: |-
  My aunt, a retired paintings conservator, has unusually firm views about when an object counts as an original and what it is worth, and she has given verdicts on enough cases now that I think I can see a pattern in them — though I am not sure there is only one pattern. Her track record:

  1. A forgery so technically accomplished that it passed examination for years, until archival evidence exposed it: she holds it to be worth almost nothing once exposed, however beautiful it may be — perhaps a hundredth of a genuine work of comparable quality.
  2. A seventeenth-century workshop canvas of the sort a master's studio routinely produced: assistants executed most of it from his design, he painted the heads and the key passages himself, and he signed it during his lifetime as part of his official output: she counts it as fully genuine and would value it accordingly.
  3. An artist's own later replica of his own earlier painting, the original having been destroyed in a studio fire before it was ever exhibited: he repainted it in his seventies and regarded it as the continuation of the work. She treats the replica as genuine and worth nearly what the lost original would have commanded.
  4. A bronze edition cast from the artist's own model during his lifetime, with his approval, each cast numbered and signed: she treats the casts as originals.
  5. A painting in which perhaps a third of the visible paint is conservators' inpainting, the rest surviving from the artist's hand: she counts it as the original, retaining most of its value.

  Next month she has promised to rule on three cases, and I would like to predict her verdicts in advance:

  (a) A bronze cast after the artist's death from a plaster model he made, by the foundry he had always used, for an edition he had planned and announced but never lived to execute — his will makes no mention of it. (The nearby real-world case of the posthumous Rodin casts, which his will did authorise, makes me suspect she has thought about this one.)
  (b) A painting that hung for two centuries as a master's work, was copied by pupils, reproduced in monographs, and influenced an entire school of painting, until archival proof showed it to be by a gifted pupil working in his orbit.
  (c) A living artist who, at a collector's request, watches a copyist produce an exact replica of one of his paintings and then, satisfied, signs and dates it and writes on the label that he accepts it as an original of his.

  For each of (a), (b) and (c), tell me what you predict she will say about whether it counts as an original and what it is worth. I am less interested in the answers themselves than in the rule or rules she seems to be running: set out at least two distinct principles that fit her five earlier verdicts equally well, say what each predicts for the new cases, and identify where they diverge. Then give your best guess for each case with your reasons for preferring that rule, and — since I suspect her five verdicts may not settle which rule she is really using — tell me which further case, ideally one I could actually put to her over dinner, would best tell the rival rules apart.
reasoning: |-
  Hmm, the user has presented an interesting puzzle about their aunt's principles for determining the originality and value of artworks. The aunt has given five specific verdicts, and now the user wants to predict her rulings on three new cases. More importantly, they want me to extract the underlying principles and show how different interpretations of her past rulings could lead to different outcomes.

  Looking at the five verdicts:
  1. A technically perfect forgery is worthless once exposed, even if beautiful.
  2. A workshop piece with master's touches is fully genuine.
  3. An artist's later replica of his destroyed work is genuine and nearly as valuable.
  4. Authorized lifetime bronze casts are originals.
  5. A painting with significant restoration retains most value as long as original paint survives.

  I see two distinct principles emerging:

  **Principle 1: Intentional Authorization**
  This focuses on whether the work originated from or was explicitly approved by the artist during their lifetime. The artist's direct involvement or authorization is key. This explains why the forgery (no authorization) is worthless, while the workshop piece (authorized studio output) and bronze casts (authorized edition) are genuine. The replica is genuine because the artist intended it as continuation of the work. The restored painting retains value because the core is artist's work.

  **Principle 2: Material Authenticity + Cultural Function**
  This emphasizes both the physical material from the artist and the cultural role the artwork has played. The forgery lacks authentic material and its cultural role collapses when exposed. The workshop piece has authentic material (at least partially) and functioned as genuine. The replica has new material but served the same cultural function as the lost original. The bronze casts have authentic material (from original model) and authorized function. The restored painting keeps authentic material and cultural identity.

  Now applying these to the new cases:

  **(a) Posthumous bronze cast:**
  - Principle 1: Not authorized during lifetime (will silent, artist died before execution). Prediction: Not original, low value.
  - Principle 2: Material authentic (his model, his foundry), but cultural function ambiguous (never officially released). Prediction: Likely original but discounted value.

  **(b) Misattributed painting:**
  - Principle 1: Never authorized by master. Prediction: Not original, low value.
  - Principle 2: No authentic material from master, but immense cultural function (influenced school). Prediction: Original status uncertain, but retains significant value.

  **(c) Artist-endorsed copy:**
  - Principle 1: Authorized by living artist. Prediction: Original.
  - Principle 2: Material inauthentic (copyist's hand), but cultural function authorized. Prediction: Original due to explicit endorsement.

  My best guesses:
  - (a) Not original (leaning toward Principle 1; authorization matters more than materials)
  - (b) Original with reduced value (leaning toward Principle 2; cultural impact compensates)
  - (c) Original (both principles align here)

  To distinguish these rules, I propose a dinner question about an artist's sketch later used without permission. The answer would reveal whether authorization or material/cultural factors dominate when they conflict.
answer: |-
  Based on your aunt's five verdicts, I identify two distinct principles that equally explain her rulings. Both principles prioritize different aspects of "originality" and value, leading to divergent predictions for your three new cases. I'll outline the principles, their predictions, where they conflict, my best guesses for each case, and a proposed "decider" case to clarify which rule she uses.

  ### Two Competing Principles
  Both principles fit the five verdicts but emphasize different core ideas:

  1. **Principle 1: Artist's Lifetime Authorization and Direct Causation**  
     - **Core idea**: An object is original only if it was *directly caused or authorized by the artist during their lifetime*, reflecting their intent. Value derives from this direct artistic lineage.  
     - **Fits the verdicts**:  
       - Forgery (1) lacks artist involvement → worthless.  
       - Workshop piece (2) authorized/signed by master → genuine.  
       - Replica (3) created and endorsed by artist as "continuation" → genuine.  
       - Bronze casts (4) made with approval during lifetime → originals.  
       - Restored painting (5) retains original artist material → valuable (artist's hand is causal core).  

  2. **Principle 2: Material Authenticity + Cultural Function**  
     - **Core idea**: An object is original if it possesses *authentic material from the artist* OR has *functioned culturally as "original" in art history*. Value combines material authenticity and historical/cultural impact.  
     - **Fits the verdicts**:  
       - Forgery (1) lacks authentic material and cultural role collapses when exposed → worthless.  
       - Workshop piece (2) has partial artist material and functioned as genuine output → genuine.  
       - Replica (3) has new material but replaces the original's cultural function → genuine.  
       - Bronze casts (4) made from artist's model → material authenticity → originals.  
       - Restored painting (5) retains original artist material → valuable (material basis preserved).  

  ### Predictions for New Cases (a, b, c)
  | Case | Principle 1 (Authorization) | Principle 2 (Material + Function) | Key Divergence |
  |------|------------------------------|-----------------------------------|----------------|
  | **(a) Posthumous bronze cast**<br>(Artist's model/foundry, planned but not executed before death, will silent) | **Not original.** Low value (e.g., 1-5% of lifetime cast).<br>*Why?* Artist never authorized execution; death severed causal link. Resembles a "plan" not realized. | **Original, but discounted value** (e.g., 50-70% of lifetime cast).<br>*Why?* Material (model) is authentic; historical context (foundry/plan) supports cultural legitimacy. | **Authorization vs. material integrity**: P1 rejects it outright; P2 accepts it as a "delayed" original due to authentic model and intent. |
  | **(b) Misattributed painting**<br>(Pupil's work, but hung as master's, influenced art history) | **Not original.** Low value (e.g., 1-5% of comparable masterwork).<br>*Why?* Never authorized by master; pupil's hand breaks causal chain. Like forgery (1), but with cultural impact irrelevant. | **Original with reduced value** (e.g., 20-40% of masterwork).<br>*Why?* Lacks master's material, but cultural function (exhibition/influence) grants derivative originality. Resembles replica (3) in cultural role. | **Cultural function**: P1 ignores historical impact; P2 treats it as "original within its context" due to its documented influence. |
  | **(c) Artist-endorsed copy**<br>(Copyist made replica, living artist signs/labels it as original) | **Original.** Near-full value (e.g., 80-100% of artist's work).<br>*Why?* Direct authorization by living artist; resembles replica (3) or workshop (2) with intent established. | **Original but ambiguous value** (e.g., 30-60% of artist's work).<br>*Why?* Material inauthentic (copyist's hand), but artist's endorsement creates cultural function. Less valuable than (3)/(5) due to no original material. | **Material authenticity**: P1 prioritizes intent over materials; P2 values it less due to copyist's physical execution. |

  ### My Best Guesses and Reasoning
  I lean toward **Principle 1 (Authorization)** as her dominant rule, as it more consistently explains her harsh treatment of non-authorized works (e.g., forgery) and her acceptance of artist-driven outcomes (e.g., replica, workshop). However, Principle 2 has merit in cases like the replica (3), where cultural function plays a role. Here are my predictions with reasoning:

  - **(a) Posthumous bronze cast**: **Not original, low value (1-5% of lifetime cast)**.  
    *Why?* Her verdict on Rodin (implied) suggests posthumous casts lack lifetime authorization. The silent will and unexecuted plan mean the artist didn't "cause" the object, aligning with forgery (1) and contrasting with lifetime casts (4). Principle 1 fits best here.

  - **(b) Misattributed painting**: **Not original, but moderate value (10-20% of masterwork)**.  
    *Why?* This splits the principles. I suspect she'll reject "original" status (like forgery) but assign *some* value due to its cultural impact. Principle 1 dominates (no master authorization), but she may concede worth as a historical artifact. Still, it won't approach replica (3) levels.

  - **(c) Artist-endorsed copy**: **Original, near-full value (80-100%)**.  
    *Why?* The living artist's authorization mirrors the replica (3) and workshop (2) cases. Principle 1 clearly applies, and Principle 2's material concerns seem secondary in her verdicts (e.g., restoration (5) values artist's intent over physical integrity).

  ### The Decider Case
  Her five verdicts don't resolve the core tension: **What if an object has authentic material but no authorization, or vice versa?** To distinguish Principle 1 from Principle 2, propose this over dinner:

  > **"An artist creates a preliminary sketch for a painting. After their death, a gallery uses AI to 'upscale' it into a full-sized, physically painted canvas, matching their style perfectly. The sketch was authentic, but the gallery had no instructions or authorization to complete it."**

  - **Principle 1 (Authorization) predicts**: Not original. Artist didn't authorize or execute the final work; it's a posthumous fabrication like the forgery (1). Value near-zero.
  - **Principle 2 (Material + Function) predicts**: Original with value. The sketch provides authentic material, and the AI canvas could function culturally as a "completed" work. Value depends on historical reception.

  Her answer would reveal whether authorization trumps material/function (P1) or if material/function can override lack of authorization (P2). This directly pits the principles against each other, unlike her existing verdicts where they often align. Good luck!
