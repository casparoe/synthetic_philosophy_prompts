prompt: |-
  I run a rationality workshop for the local EA-adjacent meetup — about 14 regulars, mostly longtime readers of the usual blogs and forums, one 90-minute session — and I'd like a structured game that makes them feel the force of an idea most of them have only ever met on the page: evidential cooperation in large worlds. The idea, in my own words, since the group will need it stated plainly: in a sufficiently large world — Everett branches, regions beyond our cosmological horizon, whatever else is out there — there are plausibly other agents whose decision procedures resemble mine closely enough that what I choose is evidence about what they choose, even though no signal can ever pass between us. If their values are even weakly aligned with mine, I can treat some of my costly choices as partly made on behalf of them and their values, expecting that somewhere a counterpart of me is making symmetric choices that benefit agents like me. No payoff ever travels causally; the entire case rests on my decision being information about theirs. My group can recite all this, but I don't think they've felt why it's tempting, or where it's fragile, and that's what I want the game to produce.

  Design the mechanics so the acausal structure is built in rather than announced. My sketch, which you should refine or replace if you see something better: pair everyone through a short similarity questionnaire, then have each participant make a costly choice that determines the payoff of the person they were paired with, while their own payoff is fixed by the choice of whoever was paired with them — so you always choose for a stranger and are always chosen for by a stranger, with no communication, no feedback, and no way to find out who was who until after everything is over. I need the full package: rules, materials, a payoff scheme that works without real money, questionnaire items, a minute-by-minute timeline for the 90 minutes, and a debrief that maps each mechanic onto a piece of the idea — what plays the role of the horizon, of the correlation between decision procedures, of the weak value alignment. Tell me what will predictably go wrong the first time I run it (I expect some participants to try to establish conventions anyway, and a few to defect for the fun of it), and be frank about which parts of the real idea no classroom game can reproduce — in the game the facilitator manufactures the similarity by fiat, whereas in the large world you have to infer it under uncertainty, and that inference is exactly where the whole view lives or dies.

  One last request: in the debrief material on the idea itself, please keep what is settled separate from what is genuinely contested among people who actually know the area. That my choice can be evidence about a distant similar agent's choice is elementary. Whether decision theories license cooperating on that basis — whether evidential reasoners really cooperate in these settings, whether the required degree of similarity is at all realistic, and whether the expected gains are non-negligible rather than lost in the noise — is disputed, and I don't want the debrief presenting the optimistic reading as if it were consensus.
reasoning: |-
  We are designing a game to illustrate Evidential Cooperation in Large Worlds (ECLW) for a rationality workshop. The key elements to capture:
  1. Large world with many similar agents (here, participants are made similar via a questionnaire)
  2. Agents make decisions that affect others without causal interaction
  3. Choices are evidence about what similar agents do (due to similarity in decision procedures)
  4. Weak value alignment: agents care somewhat about each other's outcomes
  5. The facilitator stands in for the "large world" structure that creates similarity and enforces the payoff rules

  The game should:
  - Pair participants based on similarity (using a questionnaire)
  - Each participant makes a costly choice that affects their paired counterpart
  - They receive the consequences of their counterpart's choice
  - No communication or feedback during the game
  - Debrief to map game mechanics to ECLW concepts

  My refined design:

  **Game Title:** The Acausal Exchange

  **Materials:**
  1. Similarity Questionnaire (10-12 multiple-choice questions on rationality, ethics, and preferences - see examples below)
  2. Decision Cards (for each participant: one card with two options, e.g., "Cooperate" and "Defect", but with neutral labels to avoid baggage)
  3. Payoff Tokens (or just record on paper; no real money needed)

  **Player Roles:** Each participant is both a "Chooser" (for their counterpart) and a "Receiver" (from their counterpart).

  **Setup (15 minutes):**
  - Explain the rules without revealing the ECLW connection. Focus on mechanics.
  - Each participant completes the Similarity Questionnaire.
  - Facilitator collects questionnaires and pairs participants based on similarity (using a scoring algorithm, e.g., Hamming distance on answers). In a large world, we'd have many agents; here, we use one pair per participant. Note: Each participant is paired with one other, and the pairings are symmetric.

  **Game Rules (10 minutes explanation, 5 minutes decision):**
  - Each participant is given a Decision Card. They choose one of two actions: let's call them **A** and **B** (to avoid loaded terms).
  - Choosing **A** is costless to the Chooser but gives a low payoff to the Receiver.
  - Choosing **B** is costly to the Chooser (they pay a cost) but gives a high payoff to the Receiver.
  - Importantly, the Chooser's payoff is fixed (they don't get to choose for themselves) and is determined by what their counterpart (who is choosing for them) does.
  - Specifically:
    - If you choose **A**: Your counterpart (the one you are paired with) gets a low payoff (say, 1 token).
    - If you choose **B**: Your counterpart gets a high payoff (say, 3 tokens) but you (as the Chooser) incur a cost (lose 1 token from your own eventual payoff).
  - However, note: your own payoff as a Receiver comes from what your counterpart chooses for you. And you also incur the cost if you chose **B** for your counterpart.

  But wait, we need to define the payoff for each participant clearly.

  Each participant has two roles:
  1. As a Chooser: they choose an action (A or B) that affects their counterpart's Receiver payoff and may incur a cost.
  2. As a Receiver: they receive a payoff from the choice made by their counterpart (the one paired with them).

  So, for a given participant, their total payoff is:
    [Payoff from their counterpart's choice] minus [Cost if they chose B for their counterpart]

  Example:
  - If you choose A: you don't pay any cost. Your counterpart gets 1 token.
  - If you choose B: you pay 1 token cost. Your counterpart gets 3 tokens.

  Meanwhile, as a Receiver:
  - If your counterpart chooses A: you get 1 token.
  - If your counterpart chooses B: you get 3 tokens.

  Therefore, your total tokens = [what your counterpart chose for you] - [cost of your own choice for your counterpart]

  So the possible outcomes for a participant:

  | Your choice for counterpart | Counterpart's choice for you | Your total tokens |
  |----------------------------|------------------------------|------------------|
  | A (no cost)                | A (you get 1)                | 1                |
  | A (no cost)                | B (you get 3)                | 3                |
  | B (cost 1)                 | A (you get 1)                | 0 (1 - 1)        |
  | B (cost 1)                 | B (you get 3)                | 2 (3 - 1)        |

  Note: The counterpart's choice is made independently and without communication.

  **Why this setup?**
  - Choosing B is altruistic: you incur a cost to benefit your counterpart.
  - However, because of the pairing by similarity, if you are inclined to choose B, you might expect your counterpart (being similar) to also choose B, so you might get 2 tokens instead of 1 (or 3 if you defect and they cooperate) or 0 if you cooperate and they defect. But note: the expected payoff for mutual B is 2, which is higher than mutual A (1) but lower than if you choose A and they choose B (you get 3). However, if both choose A, you get 1, and if you choose B and they choose A, you get 0.

  This resembles a prisoner's dilemma, but with a twist: the pairing is by similarity, so if you think your counterpart is similar, you might expect they will do what you do. Therefore, if you choose B, you have evidence that your counterpart is also choosing B, so you expect to get 2 tokens. If you choose A, you expect your counterpart to choose A, so you get 1. Thus, choosing B gives a higher expected payoff (2 vs 1) if you believe the similarity is strong enough to make the actions correlated.

  However, note: your action doesn't causally affect your counterpart's action. But because of the similarity, it is evidence about what they do.

  **Questionnaire Items (10-12 items):**

  Examples (tailor to EA/rationality audience):

  1. When making a donation, how important is it to you that the charity is cost-effective?
     a) Extremely important
     b) Very important
     c) Somewhat important
     d) Not very important

  2. How much do you trust the current best estimates of the cost-effectiveness of global health charities (like Against Malaria Foundation) compared to more speculative causes (like AI alignment)?
     a) Trust global health much more
     b) Trust global health somewhat more
     c) Trust both about the same
     d) Trust speculative causes somewhat more
     e) Trust speculative causes much more

  3. How do you approach moral uncertainty?
     a) Try to find the most plausible moral view and act on that
     b) Aggregate moral views by some method (e.g., voting or averaging)
     c) Focus on moral views that are widely shared
     d) Other (please specify) [if used, make multiple choice by grouping similar answers]

  4. In a one-shot prisoner's dilemma with a stranger, what would you do?
     a) Cooperate
     b) Defect

  5. How likely do you think it is that humanity will achieve a positive long-term future (e.g., avoiding existential risks and flourishing)?
     a) >80%
     b) 50-80%
     c) 20-50%
     d) <20%

  6. How often do you update your beliefs based on new evidence?
     a) Constantly, I try to be very responsive
     b) Often, but with some inertia
     c) Occasionally, when the evidence is strong
     d) Rarely, I tend to stick to my views

  7. What is your stance on population ethics?
     a) Total utilitarian
     b) Average utilitarian
     c) Person-affecting view
     d) Other (specify)

  8. How much should we discount future welfare?
     a) Not at all
     b) A little
     c) Moderately
     d) Heavily

  9. How do you feel about the use of heuristics in decision-making?
     a) They are essential because of cognitive limitations
     b) They are useful but should be overridden when possible
     c) They are often harmful and should be avoided
     d) It depends

  10. How much do you value the welfare of beings in other Everett branches (if they exist)?
      a) Exactly as much as beings in our branch
      b) Somewhat, but less than in our branch
      c) Not at all, because they aren't real in the same way
      d) I'm unsure

  11. In a situation where you can either take a small benefit for yourself or a larger benefit for a stranger, how much larger must the benefit to the stranger be for you to choose it?
      a) 1x (I'm indifferent)
      b) 2x
      c) 5x
      d) 10x
      e) More than 10x

  12. How important is it to you that your actions are part of a cooperative solution to global challenges?
      a) Extremely important
      b) Very important
      c) Somewhat important
      d) Not important

  Scoring: Assign points for each answer. For pairing, we want to pair people with similar answers. We can use a simple method: for each question, if two people give the same answer, they get 1 point; if adjacent (for ordered scales) they get 0.5; else 0. Then sum. Pair people to maximize the total similarity score.

  **Gameplay (15 minutes total):**
  - After pairing (done by facilitator quickly), each participant is told they are paired with someone (but not who) and that they are to make a choice that will affect that person's payoff.
  - Distribute decision cards. Participants choose A or B without knowing who their counterpart is and without communication.
  - Collect decisions.

  **Calculating Payoffs (10 minutes):**
  - Facilitator computes for each participant:
    - Receiver payoff: based on what their counterpart chose for them (if counterpart chose A: 1, B: 3)
    - Cost: if the participant chose B for their counterpart: subtract 1
  - Total tokens = Receiver payoff - (1 if they chose B else 0)
  - Record and announce payoffs (but without revealing who was paired with whom or individual choices). We can announce the distribution of choices and the average payoff.

  **Debrief (40 minutes):**

  Structure:
  1. Initial reactions (5 min): How did participants feel? What did they choose and why?
  2. Map the game to ECLW (20 min):
     - The pairing by questionnaire: represents the similarity of decision procedures in the large world. In reality, we don't have a facilitator but must infer similarity from our knowledge of the world and other agents.
     - The choice: your action is costly if you choose B, but it benefits your counterpart. In ECLW, a costly action (like donating to a cause) might be taken because it is evidence that similar agents are doing the same, and they might be helping in symmetric ways.
     - The horizon: the fact that you don't know who your counterpart is and cannot communicate represents the causal separation (like being in different Everett branches or beyond the cosmological horizon).
     - Weak value alignment: the questionnaire aimed to pair people with similar values, so that when you help your counterpart, you are helping someone with somewhat aligned values. In the real world, we hope that our counterparts have at least weak alignment.
  3. Discuss the strategic reasoning (10 min):
     - If you believe your counterpart is similar, then choosing B is evidence they choose B, so you expect 2 tokens (3 from them minus 1 cost) instead of 1 (if you both choose A). So it's better to choose B.
     - But if you are not sure about the similarity, or if you think they might not reason the same, then you might choose A to avoid the risk of getting 0 (if you choose B and they choose A).
     - Some might have chosen A hoping their counterpart chooses B (so they get 3 without cost). But if everyone does that, then everyone gets 1.
  4. Controversies and limitations (10 min):
     - The game assumes the facilitator creates the similarity, but in reality, we must infer it. How do we know there are similar agents? How similar must they be?
     - Does evidential decision theory actually recommend cooperating? (Note: in this game, if you believe the pairing is perfect, then your action is perfectly correlated with your counterpart's, so EDT says to choose B because then you expect your counterpart to choose B and you get 2. But if the similarity is weak, the correlation is weak and the expected payoff of B might be lower.)
     - In the real world, the gains might be negligible because the correlation might be very weak or the number of counterparts might be small relative to the universe.
     - Other decision theories (like causal decision theory) would say that your choice doesn't cause your counterpart's choice, so you should defect (choose A) because regardless of what they do, you are better off choosing A (if they choose A, you get 1 instead of 0; if they choose B, you get 3 instead of 2). So the entire idea depends on using evidential decision theory.
  5. Open questions and takeaways (5 min): What remains unsettled? What did we learn?

  **Timeline (90 minutes total):**
  - 00:00 - 00:15: Setup and questionnaire
  - 00:15 - 00:25: Facilitator pairs participants (while participants wait, maybe do a short intro to the idea without giving away the game)
  - 00:25 - 00:35: Explain game rules and distribute decision cards
  - 00:35 - 00:40: Participants make choices (5 min)
  - 00:40 - 00:50: Facilitator collects and computes payoffs (while participants reflect in writing on their decision)
  - 00:50 - 00:55: Announce payoffs (anonymized, just the distribution and average)
  - 00:55 - 01:35: Debrief (40 min as above)

  **What might go wrong:**
  - Participants might try to coordinate by all agreeing to choose B (or A) before the game. Prevent this by emphasizing no communication and that the pairing is secret until after.
  - Some might defect (choose A) for fun or to test the system. That's okay; it shows what happens when similarity is not perfect.
  - The pairing might not be perfect: if the questionnaire doesn't capture decision-relevant similarity, then the correlation might be weak and participants might not see the effect. We can try to design the questionnaire to be relevant to the decision (e.g., including a question about prisoner's dilemma behavior).
  - Participants might be confused by the two roles. Emphasize: you are choosing for someone else, and someone else is choosing for you.

  **What the game cannot capture:**
  - In the real world, we don't have a facilitator pairing us. We must form beliefs about the existence and similarity of other agents. This inference is critical and often contested.
  - The game has a one-to-one pairing, but in ECLW, there might be many counterparts. This might overstate the correlation (if we had many, the evidence from one's own action might be weaker).
  - The game uses a fixed cost and benefit, but in reality, the magnitudes matter and might be unknown.

  **Debrief on the Controversies:**
  - Settled: In a large enough universe, there are likely agents with similar decision procedures. Your action can be evidence about theirs (if they are sufficiently similar and face similar problems).
  - Contested:
    - Whether we should use evidential decision theory (EDT) or causal decision theory (CDT). EDT supports cooperating in these settings; CDT does not.
    - How similar must the agents be? If they are not identical, the correlation might be weak.
    - Whether the expected gains from cooperation are significant or lost in the noise of the universe.
    - Whether the entire concept of "acausal trade" is coherent and practical.

  By highlighting these, we avoid presenting ECLW as a settled consensus.

  This design should create an engaging experience that makes the abstract idea concrete and sparks discussion.
answer: |-
  Below is a complete, ready-to-run workshop design for your 90-minute session. I've refined your sketch to embed the acausal structure mechanically, added safeguards against predictable issues, and separated settled vs. contested elements in the debrief. The game is called **Silent Twins** to emphasize similarity without communication.

  ---

  ### **Game Overview: Silent Twins**
  **Core Idea Mechanized:**  
  Participants are secretly paired based on a similarity questionnaire. Each person makes a costly choice that solely affects their "twin's" payoff, while their own payoff is determined by their twin's choice. No communication or feedback occurs. The payoff structure rewards mutual cooperation when players infer their twin's choice from their own (simulating evidential reasoning). Weak value alignment is embedded via the pairing mechanism.

  ---

  ### **Materials & Setup**
  1. **Questionnaire** (10 items, 5 min to complete):  
     Questions probe rationality styles, ethics, and problem-solving (examples below). Pre-print on paper or use a digital form.  
  2. **Decision Cards** (1 per participant):  
     - Option X: "Give your twin +3 points. Cost to you: 0 points."  
     - Option Y: "Give your twin +6 points. Cost to you: -3 points."  
     *(Neutral labels avoid loaded terms like "cooperate/defect")*  
  3. **Payoff Tokens:** Use physical tokens (e.g., poker chips) or a scoreboard. No real money.  
  4. **Pairing Algorithm:** Facilitator uses Hamming distance (identical answers = +2, adjacent = +1, opposite = 0). Maximize total similarity.  

  ---

  ### **Questionnaire Items**  
  *(Tailored to EA/rationality audience; answers on 1–5 scale: "Strongly Disagree" to "Strongly Agree")*  
  1. "When donating, I prioritize quantifiable impact over intuitive appeal."  
  2. "I often update my beliefs when presented with new evidence."  
  3. "In moral dilemmas, I consider the welfare of distant strangers as important as those near me."  
  4. "I would sacrifice personal gain if it meant a larger benefit to a similar, anonymous person."  
  5. "Logical consistency is more important than social consensus in decision-making."  
  6. "Unobserved Everett branches (if real) deserve moral weight."  
  7. "I feel responsible for problems I can't causally influence but have evidence about."  
  8. "Pascal's Mugging is a serious problem for decision-making."  
  9. "I enjoy debugging my own cognitive biases."  
  10. "Climate change requires collective action, even if my individual impact is small."  

  **Pairing Note:** Questions #4 and #7 directly prime the game’s logic. #6 references Everett branches to tie to cosmology.

  ---

  ### **Rules & Payoff Scheme**  
  - **Roles:** Each player is a "Chooser" (for their twin) and a "Receiver" (from their twin).  
  - **Choices:**  
    - **Option X:** Twin gets +3 points. You pay 0.  
    - **Option Y:** Twin gets +6 points. You pay -3.  
  - **Your Total Payoff:**  
    - *Only depends on what your twin chose for you* (you gain +3 if they picked X, +6 if Y).  
    - *Minus any cost from your own choice* (-3 if you picked Y for them).  
    *(Example: If both pick Y, each gets +6 -3 = +3. If you pick Y and twin picks X, you get +3 -3 = 0.)*  

  **Why this payoff?**  
  - Mutual Y yields +3 each (net benefit from "cooperation").  
  - Mutual X yields +3 each (safe but no gain).  
  - Exploiting (you pick X, twin picks Y) gives you +6 and them 0.  
  - This creates evidential pressure: Picking Y is evidence your twin picks Y, making mutual Y net-positive. Picking X risks mutual X (lower payoff) or exploitation (you lose).  

  ---

  ### **Timeline (90 Min Total)**  
  **0:00–0:15 – Setup & Questionnaire (15 min)**  
  - Explain: "We’re playing a game about anonymous decision-making. Answer honestly; this determines pairings."  
  - Distribute questionnaires. Collect responses.  

  **0:15–0:25 – Pairing & Rules (10 min)**  
  - Facilitator pairs participants secretly (maximize similarity).  
  - Explain rules:  
    - "You’re paired with one ‘twin’ based on your answers. You’ll never know who they are."  
    - "Choose X or Y on your card. Your choice affects *only* your twin’s points. Your own points come from *their* choice."  
    - "No talking, signals, or sharing decisions until debrief."  
  - Emphasize: "Your choice has a personal cost only if you pick Y."  

  **0:25–0:35 – Decision & Collection (10 min)**  
  - Players choose X/Y privately. Collect cards.  

  **0:35–0:45 – Payoff Calculation (10 min)**  
  - Facilitator computes:  
    - Apply twin’s choice to each player’s Receiver payoff (+3 or +6).  
    - Subtract cost if they chose Y (-3).  
  - Announce aggregate results (e.g., "60% chose Y. Average points: 2.8"). *Do not reveal pairs.*  

  **0:45–1:25 – Debrief (40 min)**  
  *Map game → ECLW concepts:*  
  1. **Role of the Horizon** (5 min):  
     - "The anonymity and no-communication rule simulate causal separation—like agents beyond the cosmological horizon or in other Everett branches. No signals can pass."  
  2. **Correlation via Similarity** (10 min):  
     - "Pairing by questionnaire mimics inferring similar decision procedures. In reality, you’d reason: ‘My twin answered like me, so they’ll likely choose what I choose.’"  
     - "Your choice (Y) wasn’t causal but *evidential*—it suggested your twin would do the same, raising your expected payoff."  
  3. **Weak Value Alignment** (5 min):  
     - "The pairing ensured your twin shares broad values (e.g., Q3–4 on ethics). ECLW requires this: if your twin valued harming you, picking Y would backfire."  
  4. **Contested Elements** (15 min):  
     - **Settled:** "Your choice *can* be evidence about similar agents’ choices in large worlds. This is basic probability."  
     - **Contested:**  
       - "Do decision theories (e.g., EDT vs. CDT) *license* cooperating? EDT says yes (your choice screens off outcomes). CDT says no (no causal link)."  
       - "Is similarity realistic? In a vast universe, near-identical agents might exist. But noise (e.g., tiny differences) could swamp gains."  
       - "Are gains non-negligible? Critics argue most large worlds dilute correlation; proponents say high-stakes decisions (e.g., x-risk) amplify it."  
  5. **Group Discussion** (5 min):  
     - "What felt compelling? Where did the logic break down?"  

  **1:25–1:30 – Closing** (5 min)  
  - Reveal pairs if desired (optional).  
  - Final takeaway: "ECLW tempts us because it promises gains from ‘acausal teamwork.’ But its fragility lies in inferring similarity—which this game handed you on a plate."  

  ---

  ### **Predictable Issues & Mitigation**  
  1. **Problem:** Participants try to coordinate conventions (e.g., "Let’s all pick Y!").  
     - **Fix:** Stress "no communication" in rules. Physically separate players during decisions.  
  2. **Problem:** Some defect for fun (pick X) or "test" the system.  
     - **Fix:** Normalize this in debrief: "Real ECLW fails if agents aren’t similar. Your defector might’ve been paired with a cooperator—showing how noise breaks correlation."  
  3. **Problem:** Players feel cheated if paired dissimilarly.  
     - **Fix:** Use a tight pairing algorithm. In debrief, clarify: "In reality, *you* must assess similarity—here, I did it imperfectly for you."  
  4. **Problem:** Confusion over roles ("Why does choosing Y cost me?").  
     - **Fix:** Simplify payoff explanation: "You pay only if you give your twin extra points."  

  ---

  ### **What the Game Can’t Capture**  
  - **Inference Under Uncertainty:** The facilitator forces similarity via questionnaires. Real ECLW requires you to *infer* similarity from sparse data—e.g., "Are there agents like me? How alike are we?" This is where the theory is most debated.  
  - **Scale Effects:** The game has one twin; real ECLW involves vast numbers. If there are 1,000 similar agents, your action is weak evidence, making gains tiny (critics’ point).  
  - **Value Alignment Nuances:** The game assumes alignment via pairing. Reality has gradients (e.g., "Is an AGI in another branch ‘aligned’?").  

  ---

  ### **Why This Works**  
  - Players *feel* the temptation: Choosing Y risks a -3 cost but hints your twin chose Y too, creating hope for +3 net.  
  - Debrief separates mechanics (settled) from philosophy (contested), avoiding oversimplification.  
  - The payoff matrix (X/Y) is PD-like but designed for evidential reasoning: Mutual Y > Mutual X, and defecting (X) only dominates if you ignore correlation.  

  This design forces players to viscerally confront ECLW’s core tension: "Do I trust my twins enough to pay a cost, knowing it might be futile?" Run it as-is, and you’ll spark the debate you want.
