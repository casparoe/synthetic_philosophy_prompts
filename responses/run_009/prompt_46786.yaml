  The user might be grappling with the tension between technical integrity and real-world impact. Even if the balances were errors, their functional reality can't be ignored. The customers acted in good faith, spending what appeared as legitimate funds. So, the company's responsibility in maintaining system integrity versus the customers' reasonable reliance on their account balances.

  Another angle: the company's role as a trusted intermediary. When the system works correctly, the balances represent the company's liability. The bug created liabilities without corresponding assets, but once spent, the company has to cover those transactions to third parties. So absorbing the loss might be necessary to maintain trust.

  I should also consider the consequences of each approach. Trying to claw back from customers could cause hardship and reputational damage. Absorbing the loss impacts the company financially but preserves customer trust. The user might be looking for a solution that balances fairness with practicality.

