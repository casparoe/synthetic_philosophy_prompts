  First, I need to unpack the two camps. One side says it's just a database error, so the money wasn't real and customers should repay. The other argues that since the money was spent on real things, it functioned as real money, so the company should absorb the loss. The user is stuck between these views and needs a principled distinction to inform the recommendation.

