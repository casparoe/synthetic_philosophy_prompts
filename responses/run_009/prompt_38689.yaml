prompt: |-
  Write the joint statement that two researchers could sign after a good-faith adversarial collaboration: Dr. R, who works on inverse reinforcement learning and holds that human behavior is generated by approximate optimization and therefore encodes a recoverable preference structure, and Dr. K, trained in the preference-construction tradition in psychology, who holds that what IRL systems call "inference" is largely a misnomer, since elicited preferences are unstable artifacts of framing, context, and elicitation method rather than readouts of a latent variable. The document should contain: (1) the claims both accept — including about what the IRL formalism actually guarantees given its assumptions, about what the empirical literature on preference reversals and framing effects shows, and about the failure modes both have seen when preference-inference systems are deployed; (2) their precise residual disagreements, each phrased so that its own side would accept the wording — in particular, whether the approximate-optimality assumption behind inference is an empirical claim that can be wrong or merely a modeling convention whose wrongness makes inference meaningless, and whether instability of elicited preferences reflects measurement noise that better models will filter out or evidence that there is no stable quantity being measured; (3) the cruxes, with, for each, a concrete study, dataset, or engineering case both would agree bears on it — for example, whether an IRL system trained on a person's behavior in one context predicts their reflective endorsements in another, and what each side predicts it would find — with each side's prediction written down in advance; and (4) an explicit verdict on which parts of the dispute are verbal rather than substantive, with the candidate suspects being the ambiguity in "preference" between whatever causes the behavior and whatever the person would endorse after deliberation. Throughout, mark which of the agreed claims are settled and which remain genuinely contested among people who know the literature, and flag any place where the drafting itself resolves a dispute by word choice rather than argument.
reasoning: |-
  We are drafting a joint statement for Dr. R (inverse reinforcement learning perspective) and Dr. K (preference-construction perspective). The goal is to have a good-faith adversarial collaboration.

  The document should include:
  1. Agreed claims (settled and contested among experts)
  2. Residual disagreements (worded so each side accepts the wording)
  3. Cruxes (with concrete studies/data and predictions from each side)
  4. Explicit verdict on verbal vs. substantive disputes, especially regarding the ambiguity of "preference"

  We will structure the statement accordingly.

  Note: We must mark which agreed claims are settled and which remain contested. Also, flag any drafting that resolves a dispute by word choice.

  Let's outline:

  I. Introduction: Who we are and the purpose of the statement.

  II. Agreed Claims:
     A. About the IRL formalism and what it guarantees under its assumptions (settled).
     B. About the empirical literature on preference reversals and framing effects (settled).
     C. About failure modes in deployed preference-inference systems (settled? or contested?).

  III. Residual Disagreements (worded so each side accepts):
     A. Dr. R's view: Approximate optimality is an empirical claim that can be wrong, but when it holds (even approximately), IRL can recover a preference structure.
     B. Dr. K's view: Approximate optimality is a modeling convention; when it doesn't hold (which is often), the "inference" is meaningless because there is no stable latent variable to recover.

     C. Dr. R: Instability in elicited preferences is largely measurement noise that better models (e.g., incorporating context) can filter out, revealing a stable core.
     D. Dr. K: Instability is evidence that there is no stable quantity being measured; it's constructed on the fly.

  IV. Cruxes:
     We list specific cruxes with a concrete study/dataset/engineering case for each, and each side's prediction.

     Example crux: 
        Claim: Whether an IRL system trained on a person's behavior in one context predicts their reflective endorsements in another.

        Study: We design an experiment where we:
          - Observe participants in context A (e.g., shopping for groceries under time pressure) and train an IRL model on their choices.
          - Then, in context B (e.g., a reflective session without time pressure, with full information), we ask the same participants to make reflective endorsements (e.g., rate the desirability of products, or choose again with deliberation).
          - We measure the correlation between the IRL-inferred preferences and the reflective endorsements.

        Prediction:
          Dr. R: The IRL model trained on context A will show a significant positive correlation with reflective endorsements in context B, especially if the model accounts for the context (e.g., time pressure) and the endorsement context is not too different.
          Dr. K: The correlation will be low and not significantly different from chance, or highly variable across individuals, because the preferences in context A are constructed and not stable enough to predict the constructed preferences in context B.

     We might have multiple such cruxes.

  V. Verbal Disputes:
     We agree that the word "preference" is ambiguous. It can mean:
       (a) The latent variable that (approximately) causes behavior in a given context (Dr. R's focus).
       (b) The reflective judgment that a person would endorse after deliberation (Dr. K's focus, but note that Dr. K might even question the stability of this).

     We note that part of the disagreement stems from using the same term for two distinct concepts.

  VI. Conclusion: Agreement on what remains to be tested and commitment to update based on evidence.

  Now, we write the statement accordingly.
answer: |-
  **Joint Statement on Preference Inference in Human Behavior**  
  *Signed by Dr. R (Inverse Reinforcement Learning) and Dr. K (Preference Construction Psychology)*  

  ### **1. Agreed Claims**  
  We affirm the following points, distinguishing **settled** (consensus among experts) from **contested** (active scholarly disagreement):  

  **(A) IRL Formalism Under Its Assumptions**  
  - **Settled**: IRL algorithms *mathematically guarantee* recovery of a reward function *only if* the observed behavior is generated by an agent optimizing a fixed reward function under known environmental constraints (Ng & Russell, 2000). Absent these assumptions, IRL outputs are best interpreted as *contextual summaries of behavior* rather than latent preferences.  
  - **Settled**: IRL’s "preference inference" is valid *only* under the assumption of approximate optimality. If this assumption fails, the output is a misattributed artifact.  

  **(B) Empirical Literature on Preference Reversals**  
  - **Settled**: Framing effects (Tversky & Kahneman, 1981), preference reversals (Lichtenstein & Slovic, 1971), and context-dependent choices (e.g., attraction effect) robustly demonstrate that human decisions *systematically violate* the axioms of rational choice theory. Elicited preferences vary across logically equivalent scenarios.  
  - **Contested**: The *interpretation* of these findings—whether they reflect cognitive limitations (noise around stable preferences) or fundamental preference instability—remains debated.  

  **(C) Failure Modes in Deployment**  
  - **Settled**: Deployed preference-inference systems (e.g., recommendation engines, policy optimization) fail catastrophically when:  
    - (i) Behavior is shaped by unobserved constraints (e.g., socioeconomic pressure misread as "preference").  
    - (ii) Framing differences between training and deployment contexts induce reward misidentification.  
    - (iii) Feedback loops amplify biases (e.g., recommender systems trapping users in filter bubbles).  
  - **Settled**: Both IRL and preference-elicitation methods are vulnerable to adversarial manipulation (e.g., presentation biases in surveys, deceptive trajectories in RL).  

  ---

  ### **2. Residual Disagreements**  
  We phrase disagreements to ensure mutual acceptance of wording:  

  **(A) Approximate Optimality as Assumption**  
  - **Dr. R**: The approximate-optimality assumption is an *empirical claim* about human cognition. When true (even partially), IRL recovers a latent preference structure distorted by noise; when false, inference fails *but this is testable*.  
  - **Dr. K**: Approximate optimality is a *modeling convention*. If humans are not optimizers (even approximately), "preference inference" is a category error—like measuring "aether density" in vacuum.  

  **(B) Instability: Noise or Nonexistence?**  
  - **Dr. R**: Preference instability reflects *measurement noise* and *unmodeled context*. Better models (e.g., hierarchical IRL, context-aware rewards) can filter noise to reveal stable preferences.  
  - **Dr. K**: Instability is *evidence of construction*, not measurement error. There is no "stable core" to recover—preferences emerge from dynamic agent-environment interactions.  

  ---

  ### **3. Cruxes and Predictions**  
  For each crux, we specify a test and predictions. Both agree these studies would resolve core disagreements:  

  **(A) Crux 1: Cross-Context Predictive Validity**  
  - **Study**: Train IRL on behavior in **Context A** (e.g., time-pressured food choices). Test predictions against **Context B** (e.g., reflective endorsements of food healthiness without time pressure).  
  - **Dr. R’s Prediction**: IRL rewards will correlate with endorsements (\(r \geq 0.5\)) if the model accounts for context (e.g., time pressure as a constraint).  
  - **Dr. K’s Prediction**: Correlations will be weak (\(r \leq 0.2\)) or inconsistent, as endorsements are constructed anew in Context B.  

  **(B) Crux 2: Stability Under Improved Measurement**  
  - **Study**: Fit IRL to choices across 100 framing variants (e.g., gain/loss framing, decoy options). Test if a *single context-aware reward function* explains variance across frames.  
  - **Dr. R’s Prediction**: A unified model (e.g., Boltzmann-rational IRL with context features) will achieve >80% cross-frame prediction accuracy.  
  - **Dr. K’s Prediction**: Accuracy will plateau near chance (~50%)—no unified model captures frame-specific construction.  

  ---

  ### **4. Verbal Disputes**  
  We agree that **semantic ambiguity** fuels much disagreement:  
  - **Ambiguity in "Preference"**: The term conflates:  
    - (a) *Causal drivers of behavior* (e.g., reward functions in IRL; **Dr. R’s focus**).  
    - (b) *Reflective endorsements* (e.g., post-hoc justifications; **Dr. K’s focus**).  
  - **Resolution**: We replace "preference inference" with **"behavioral reward identification"** (Dr. R) and **"elicitation artifact mapping"** (Dr. K) where clarity demands. This drafting choice resolves no substantive dispute—it merely isolates empirical questions.  
  - **Substantive Core**: Whether behavioral drivers (a) are stable enough across contexts to permit generalizable reward identification remains empirical.  

  ---

  ### **Conclusion**  
  We commit to testing the cruxes above in joint work. Where we disagree, we have:  
  - Isolated testable hypotheses.  
  - Flagged semantic ambiguities (*verbal*).  
  - Specified prior-dependent predictions.  
  Our dispute reduces to whether human behavior *sufficiently approximates* optimality for IRL to extract stable rewards—a question resolvable by data, not debate.  

  ---  
  **Signed**,  
  Dr. R (Inverse Reinforcement Learning)  
  Dr. K (Preference Construction Psychology)  

  ---  
  ### **Footnotes**  
  - **Settled claims** reflect literature both accept as robust (e.g., IRL theory, framing effects).  
  - **Contested claims** mark ongoing scholarly division (e.g., interpretation of noise).  
  - **Drafting resolutions**:  
    - "Approximate optimality" retains both views by not assuming universal truth (Dr. K) or falsehood (Dr. R).  
    - "Reflective endorsements" avoids assuming they reveal "true" preferences.  
  - **Predictions** are preregistered to prevent hindsight bias.
