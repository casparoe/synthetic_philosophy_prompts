prompt: |-
  I'm a backend engineer with zero philosophy background, and I volunteer as the tech person on the board of a small animal-welfare nonprofit. Over the last year we keep getting proposals that, after I went down a rabbit hole one weekend, I realized are all trying to apply something called the hedonistic imperative — David Pearce's idea that we should use biotech to abolish suffering in all sentient life, not just reduce it a bit here and there. Examples we've actually gotten: knocking out certain pain receptors in livestock, breeding chickens without the chronic anxiety that factory conditions produce, gene drives to wipe out a parasite that causes horrible disease in wild deer, and one guy who wanted funding for research into making farm animals so mellow they'd stop caring about confinement. That last one gave everyone the creeps, but nobody could say exactly why, and our board meetings just go in circles between the "any reduction of suffering is a win" camp and the "this is playing God, and besides the animals won't really be animals anymore" camp. We get maybe one of these proposals a month, and the whole board (none of us are philosophers) votes at the end of the meeting, so we need something runnable in one sitting.

  Can you turn that whole philosophy into a decision procedure we can apply to any proposal? Specifically I want a numbered list of exactly five items — the five questions we ask in order, each item just a sentence or two: the question itself plus what counts as a good enough answer to move on, and what answer kills the proposal. No introduction, no conclusion, just the five items. If one of the questions is really about values rather than facts — meaning the board just has to vote on it and no amount of data settles it — flag that inside the item itself. The procedure should be grounded in the distinctions the actual theory draws, like taking away suffering versus adding pleasure on top, or raising an animal's baseline so it's ok versus making it indifferent to everything, but phrased so my fellow board members who've never read a page of ethics can apply it. Don't run it on our past proposals for me, I want to do that myself at the next meeting and see where it surprises us.
reasoning: |-
  Okay, let's tackle this. The user is a backend engineer volunteering on an animal-welfare nonprofit board. They're dealing with proposals inspired by David Pearce's hedonistic imperative, which aims to eliminate suffering through biotechnology. The board struggles to evaluate these proposals because they lack a philosophical background. They need a clear, five-question decision procedure that's practical for meetings.

  First, I need to break down the core principles of Pearce's philosophy. Key points include abolishing suffering, not just reducing it, the distinction between removing pain versus adding pleasure, and concerns about altering an animal's fundamental nature. The user mentioned examples like gene editing for pain receptors or emotional states, which raise ethical questions about authenticity and unintended consequences.

  The user wants a numbered list of five questions, each with clear pass/fail criteria. Questions should cover both factual and value-based aspects, flagged appropriately. The procedure must be accessible to non-philosophers, using plain language. 

  Start with the most critical issue: irreversible consequences. Question 1 should address severe side effects that could harm the species or ecosystem. This is factual but might require expert consultation. If risks are unmanageable, reject the proposal.

  Next, focus on suffering reduction versus pleasure enhancement. Pearce prioritizes eliminating suffering over adding pleasure. Question 2 should distinguish between abolishing suffering (pass) versus merely boosting pleasure (fail). This is a factual analysis of the proposal's primary goal.

  Then, consider the alteration of core experiences. Pearce warns against creating indifference. Question 3 should ask if the intervention preserves appropriate emotional responses. If animals become indifferent to negative conditions, that's a red flag. This might involve both facts and values, but the board needs to decide if the change violates the animal's nature.

  Question 4 should address autonomy and natural behaviors. Even without suffering, if an animal can't perform species-typical behaviors, it might not be living authentically. This is a value judgment; the board must weigh behavioral integrity against suffering reduction.

  Finally, consider Pearce's broader goal: abolition as a moral imperative. Question 5 asks if the proposal contributes meaningfully to ending suffering long-term or just provides a temporary fix. If it's a mere band-aid without a path to abolition, reject it. This involves strategic values and priorities.

  Each question must flow logically, starting with concrete risks, moving to philosophical distinctions, and ending with strategic impact. The user needs clarity on what requires data versus board votes. Highlighting "VALUE JUDGMENT" where applicable is crucial. Avoid jargon, use examples like the creepy "mellow animals" proposal to illustrate points. Ensure the procedure is actionable within one meeting, helping the board break deadlocks by structuring their debate.
answer: |-
  Here is your five-question decision procedure, grounded in the Hedonistic Imperative's core distinctions and designed for practical board use:

  1.  **"Does the proposal carry significant, irreversible risks of creating new suffering or ecological harm that outweighs the predicted suffering reduction?"**  
      *Pass:* Robust evidence shows risks are minimal, manageable, or outweighed by significant suffering abolition.  
      *Kill:* Potential for severe unintended suffering, species collapse, or ecosystem disruption exists and cannot be reasonably mitigated.

  2.  **"Is the primary mechanism focused on abolishing a specific suffering state (like pain or chronic anxiety), rather than just adding pleasure or contentment?"**  
      *Pass:* Targets the direct removal or prevention of a negative experience (e.g., eliminating pain receptors, removing anxiety triggers).  
      *Kill:* Primarily aims to boost positive feelings *without* addressing an underlying suffering state (e.g., making animals euphoric but still confined).

  3.  **"Does the intervention preserve the animal's capacity for appropriate aversive responses and natural motivations (e.g., avoiding injury, seeking comfort/safety), or does it create indifference to harmful conditions?"**  
      *Pass:* Suffering is reduced, but healthy aversion to real threats (predators, injury) and motivation for welfare-positive states (comfort, social contact) remain intact.  
      *Kill:* Creates broad indifference, making the animal unresponsive to harmful situations it *should* avoid (e.g., not caring about confinement, injury, or sickness). (Note: **VALUE JUDGMENT** - Board must agree on what constitutes "appropriate" responses for the species).

  4.  **"Does the change allow the animal to express core, species-typical positive behaviors and experiences (like foraging, social bonding, exploration) in its environment, or does it fundamentally alter its nature/capacities to fit poor conditions?"**  
      *Pass:* Suffering is abolished while enabling natural positive behaviors within a welfare-adequate environment.  
      *Kill:* The animal is altered *primarily* to tolerate deprivation or confinement it would normally find aversive, suppressing its nature rather than improving its world. (Note: **VALUE JUDGMENT** - Board must weigh suffering reduction against behavioral integrity/naturalness).

  5.  **"Does this proposal represent a genuine step towards the abolition of suffering as a strategic goal, or is it likely to entrench or excuse systems causing suffering?"**  
      *Pass:* Clearly reduces net suffering in a scalable way without blocking better solutions; aligns with a trajectory towards abolition (e.g., eliminating a disease vector, reducing suffering in unavoidable systems).  
      *Kill:* Primarily serves to make an inherently harmful system (like intensive confinement) more palatable/permanent by masking suffering, diverting resources from better alternatives, or delaying fundamental reform. (Note: **VALUE JUDGMENT** - Board must assess long-term strategic alignment with abolitionist aims vs. potential for harm maintenance).
