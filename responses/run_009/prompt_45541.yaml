  First, I need to list the non-negotiable requirements. The user mentioned specific problems that any structural realism must address. Theory-change continuity is crucial because it's the historical motivation—showing how math survives despite ontological shifts. Then there's the Newman objection, which questions the non-triviality of structural claims. Defining structure is essential; without it, the position is incoherent. The epistemic-ontic distinction matters because it affects how the position answers skepticism. Surviving the pessimistic induction while supporting the no-miracles argument is also key since realism needs to explain success without ignoring past failures.

  The user suspects a tension between surviving Newman and capturing continuity. Making structure non-trivial might require rich commitments that make continuity claims selective. For example, Ramsey-sentence approaches might handle continuity but face Newman's triviality. Ontic structural realism avoids Newman by denying objects but struggles with continuity because some structures like symmetries are preserved, but others aren't. 

  The user might need clarity on which desiderata are mandatory versus camp-specific. Non-negotiables include Newman survival, continuity, structure definition, epistemic/ontic clarity, and the no-miracles-pessimistic induction balance. Underdetermination and avoiding platonism are important but might have more flexibility depending on the version. 

  Their deeper need is likely understanding the core tensions to navigate the literature critically. They want to know where positions fail and why, so they can assess arguments effectively. Highlighting the tension between Newman and continuity addresses their hunch and provides a framework for evaluating different approaches. 

  I should also consider how different versions meet these criteria. Epistemic structuralism uses Ramsey sentences for continuity but falls to Newman. Ontic structural realism avoids Newman by eliminating objects but might struggle with continuity. Newer approaches like semirealism try to balance by adding a modal component. 

  In summary, the user needs a structured breakdown of desiderata, highlighting conflicts, especially the Newman-continuity tension, to equip them with analytical tools for the seminar discussions and readings.
answer: |-
  Below is a structured analysis of the desiderata for structural realism (SR), designed to clarify core requirements vs. camp-specific preferences. I've prioritized non-negotiables based on the position's historical motivation and philosophical coherence, then addressed tensions and evaluated prominent versions.

  ---

  ### **Core Desiderata for Any Serious Structural Realism**
  *(Non-negotiables in bold; others are important but negotiable in scope)*

  | Desideratum                          | Why It's Required                                                                                                | Case/Consideration                                                                 | Non-Negotiable? |
  |--------------------------------------|------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------|-----------------|
  | **1. Captures Theory-Change Continuity** | SR arose to explain scientific progress despite ontological shifts. Must show how "structure" explains retention. | Fresnel → Maxwell: equations for reflection/refraction preserved; ether → EM field discarded. | **Yes**        |
  | **2. Survives Newman's Objection**   | Without this, SR is trivial: any set of objects can satisfy a purely structural description.                     | Newman (1928): If SR only says "there exists a structure satisfying relations R," it's vacuously true given any ontology. | **Yes**        |
  | **3. Defines 'Structure' Non-Circularly** | Must avoid: (a) "structure of objects" (regresses), or (b) collapsing into mathematical Platonism.               | Worrall's epistemic SR: structure as *relations*; Ladyman's ontic SR: relations without relata. | **Yes**        |
  | **4. Clarifies Epistemic vs. Ontic Commitment** | Ambiguity undermines SR's response to realism/anti-realism debates.                                              | Epistemic SR (Worrall): we know structure, not objects. Ontic SR (Ladyman): objects don't exist fundamentally. | **Yes**        |
  | **5. Balances No-Miracles & Pessimistic Induction** | SR must explain success (no-miracles) while admitting past theories were wrong (pessimism).                     | Continuity of structure explains success; structural approximation explains failures. | **Yes** (for viability) |
  | **6. Explains Why Structure Matters** | Must show structural continuity isn't *just* notational or mathematical.                                          | Fresnel's equations weren't "just math" – they encoded physical content (e.g., boundary conditions). | **Yes**        |
  | 7. Addresses Underdetermination      | If rival ontologies share structure, is this a problem (e.g., for realism) or SR's goal (neutrality)?            | French: Underdetermination is acceptable if structure is all that's real. Psillos: This weakens realism. | No (camp-dependent) |
  | 8. Avoids Metaphysical Inflation     | Shouldn't require implausible commitments (e.g., abstract universals, radical nominalism).                      | Ontic SR's "relations without relata" vs. Epistemic SR's structural humility.      | No (theoretical cost) |

  ---

  ### **Key Tensions & Dealbreakers**
  **Your hunch is correct: the tension between *Surviving Newman* (D2) and *Capturing Continuity* (D1) is the central fault line.**  
  - **Why?** Avoiding triviality (Newman) requires restricting the *content* of structural claims (e.g., specifying *which* relations are physical). But explaining continuity requires a *rich enough* notion of structure to capture what was preserved (e.g., Fresnel's equations).  
  - **The Trade-off:**  
    - Make structure **too thin** (e.g., Ramsey sentences without constraints) → Newman triviality (any ontology satisfies it).  
    - Make structure **too thick** (e.g., requiring specific relations or modalities) → continuity claims become selective/historicized (only *some* structures survive, undermining general argument).  

  **The Single Most Damaging Desideratum: Surviving Newman (D2)**  
  - Most versions fail here. Ramsey-sentence SR (e.g., Worrall) is Newman-vulnerable. Ontic SR (Ladyman) avoids Newman by eliminating objects but faces challenges with continuity (D1) and structural definition (D3).  

  ---

  ### **How Major Versions Fare Against Desiderata**
  *(✓ = Satisfies ~ well; ~ = Partially/controversially; ✗ = Fails)*

  | Desideratum               | Epistemic SR (Worrall-style, Ramsey sentences) | Ontic SR (Ladyman-style, Eliminativist) | Semi-realism (Chakravartty, hybrid) |
  |---------------------------|-----------------------------------------------|-----------------------------------------|-------------------------------------|
  | **D1: Theory-Change Continuity** | ✓ (Math continuity is direct)                | ~ (Focuses on abstract symmetries; less intuitive for Fresnel) | ✓ (Adds "property clusters")       |
  | **D2: Survives Newman**   | ✗ (Ramsey sentences are model-relative)      | ✓ (No objects → no trivial relata)      | ✓ (Adds causal properties)         |
  | **D3: Defines 'Structure'** | ~ (Relations dependent on objects)           | ~ (Primitive relations; controversial)  | ✓ (Structure + dispositional properties) |
  | **D4: Epistemic/Ontic Clarity** | ✓ (Epistemic: structure known, objects uncertain) | ✓ (Ontic: only structure exists)        | ~ (Blends ontology/epistemology)   |
  | **D5: No-Miracles + Pessimism** | ~ (Continuity explains success; struggles with discarded structure) | ~ (Structural persistence explains success; past structures were incomplete) | ✓ (Retained properties explain success) |
  | **D6: Why Structure Matters** | ~ (Risk of "just math")                      | ✓ (Structure is fundamental)            | ✓ (Structure tracks causal powers) |
  | **D7: Underdetermination**| ✓ (Accepts ontological rivals)               | ✓ (Rivals are illusory)                 | ✗ (Reintroduces privileged ontology) |
  | **D8: Metaphysical Inflation** | ✓ (Lightweight)                             | ✗ (Radical ontology)                    | ~ (Moderate realism)               |

  ---

  ### **Synthesis: Can SR Satisfy All Desiderata?**
  - **No version satisfies all non-negotiables perfectly.** The Newman/Continuity tension (D1 vs. D2) is the core obstruction.  
  - **Best compromisers:**  
    1. **Ontic SR + Modal Structure** (e.g., adding laws/dispositions to relations) helps with continuity (D1) and Newman (D2).  
    2. **"Structure-as-Mechanism" Hybrids** (e.g., semi-realism) salvage D2 and D1 but sacrifice SR's purity (D7, D4).  
  - **Dealbreaker Desideratum:** **D2 (Newman)**. If a version is Newman-trivial, it fails as realism. This is why many philosophers reject Ramsey-based SR.  

  **Conclusion for Your Seminar:** Focus on whether a given SR variant resolves D1 vs. D2. The literature often talks past itself because:  
  - Epistemic SR prioritizes D1 (continuity) at D2's expense.  
  - Ontic SR prioritizes D2 (Newman) but struggles with D1 (concrete historical cases).  
  Your professor's comment likely targets this. The "selectivity" of continuity claims (e.g., focusing on gauge symmetries, not 19th-century mechanics) is a symptom of SR trying to have it both ways.  

  Would you like a deep dive into a specific SR variant or the Newman proof? This framework should help you dissect the papers efficiently.
