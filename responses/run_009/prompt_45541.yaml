prompt: |-
  I'm taking a grad seminar on scientific realism and we're about to hit the structural realism debate, and honestly the literature feels like a bunch of people talking past each other, so before I go read another paper I want the spec first. Could you act as a professional philosopher of science and think this through carefully — maybe brainstorm a bit before committing to a list, since I suspect the interesting part is deciding what's a genuine requirement vs. just what one camp happens to care about?

  What I want is the desiderata: what any version of structural realism has to deliver to count as a serious position. It has to make sense of the theory-change cases people always point to (like Fresnel to Maxwell, where a lot of the math survived while the ontology got overhauled) and explain why surviving math counts as continuity of anything worth caring about, rather than just notation; it has to survive the Newman objection — the worry that "the world has relational structure" is trivially satisfiable by any ontology whatsoever, so if structure is all you're claiming you've claimed almost nothing; it has to say what structure even is without either smuggling the objects back in (structure-of-what?) or collapsing into plain platonism about math; and it has to be upfront about whether the view is epistemic (we can only *know* structure) or ontic (there *is only* structure), since those seem to pull in opposite directions. Beyond that I'd want something about underdetermination — if two rival ontologies share all their structure, does that sink the position or is it literally the whole point? — and something about how the view is supposed to answer the no-miracles argument without getting flattened by the pessimistic induction, which I take to be the main reason anyone bothered. For each requirement, give the case or consideration behind it, and mark which ones are non-negotiable versus which are really just preferences of particular camps.

  The part I most want to see: my hunch, based on an offhand comment my professor made, is that "survives Newman" and "captures theory-change continuity" are in tension with each other — that making the view non-trivial forces you into commitments rich enough that the continuity story becomes selective, and vice versa — but I might be misremembering what the tension exactly is. So tell me honestly whether some subset of the desiderata is jointly unsatisfiable, and which single requirement does the most to knock out the contenders. If you want, close with a very quick pass on how the Ramsey-sentence version and the more metaphysically ambitious ontic versions do against the list, but keep the weight on the criteria — that's where the thinking is. A table is fine if it helps.
