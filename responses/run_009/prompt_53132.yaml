          - ... etc.

        Then combine the overruns (assuming independence?).

    5. Outcome: The procedure might lead to a blended estimate that is unwelcome because it is based on a heterogeneous class or on decomposition which the authority may not trust.

   Judgment Calls Flagged in the Procedure:

     - Step 1: Which features are causally relevant? (Requires expert input and documentation.)
     - Step 2: Which features are "most critical"? (The initial set for the narrowest class.)
     - Step 3: The order of relaxation of features. (Must be set by causal importance, but that is judgment.)
     - Step 3b: How to compute the similarity score? (We suggested a simple fraction of matching features, but that is arbitrary.)
     - Step 4: How to adjust for bias? (Expert judgment.)
     - Step 5: How to decompose a project? (Requires engineering input.)

   The procedure's bottom line: We have a structured way to build a class, but at several points we must make judgments. By requiring documentation and escalation when judgments are material and contested, we avoid hiding the uncertainty.

   Final Procedure Outline:

   1. Define the target project's features (known at start) and document.
   2. List the features in order of causal importance (from most to least) based on expert consensus or prior evidence. Document.
   3. Build the narrowest class by including projects that match on all features. If it has at least five projects, use it and go to step 6.
   4. Relax features one by one in the order of least important first until we get a class with at least five projects. If we have multiple classes at the same level of relaxation (i.e., same number of features) that meet the size, choose the one with the smallest variance in overruns. Document every relaxation and the resulting class.
   5. If no class meets the size requirement, then:
      a. Create a set of nested classes (by relaxing features in the predefined order) and compute the mean and variance of overruns for each.
      b. For each class, assign a similarity score to the target: the fraction of the target's features (that we have data for) that the class matches.
      c. Compute a weighted average: weight for each class = (1 / variance) * similarity.
      d. Use the weighted average as the estimate. Document.
   6. Check for known biases in the class (e.g., all projects from a single source, time period, etc.). Adjust by expert judgment if necessary and document.
   7. If the project is too novel (even after step 5 we have very few projects and high uncertainty) then break down the project into components and use reference classes for the components (decomposition). Combine the component overruns (using a method like adding means if independent, or more sophisticated if not) and document.
   8. At any step if there is a material judgment call that could significantly change the estimate and there is no clear basis for the choice, escalate to the panel.

