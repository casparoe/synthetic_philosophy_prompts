answer: |-
  **Core Rule:** Choose the narrowest reference class defined by ex ante causally relevant features with ≥5 members; if unavailable, use weighted similarity-based blending across nested classes, and explicitly document all judgment calls or escalate disputes where choices materially alter estimates.

  ### Reasoning
  The reference class problem balances causal homogeneity (narrow classes) against statistical power (wide classes). No "true" class exists—each project admits multiple valid descriptions. Philosophical approaches considered and incorporated:
  - **Exogenous class definition (adopted):** Classes must use features known *before* project outcomes (e.g., "length," "terrain") to prevent cherry-picking.
  - **Similarity weighting (adopted):** When narrowing fails, weight classes by feature-match similarity and precision.
  - **Conditioning on all evidence (rejected):** Overfits to unique cases, yielding no distribution.
  - **Always widen until estimates worsen (rejected):** Risks including irrelevant projects, increasing bias.
  - **Single-class vs. blending:** Narrow classes preferred, but blending used when no class meets size/relevance thresholds.

  ### Decision Procedure
  *Run sequentially; stop and document/escalate at judgment flags (⚖️).*

  1. **List ex ante features:**  
     Identify project characteristics known *before* execution (e.g., length, location, terrain, technology, funding type).  
     *Sufficient:* ≥3 features with causal rationale (e.g., "tunnels cost more in seismic zones").  
     ⚖️ *Judgment call:* Feature inclusion. Document rationale.

  2. **Define candidate classes:**  
     Propose classes based on combinations of features from Step 1 (e.g., "all urban rail," "projects 8–15 miles").  
     *Sufficient:* ≥3 classes proposed, including one "narrow" (≥3 matching features) and one "wide" (≤1 matching feature).

  3. **Apply exogeneity filter:**  
     Discard classes defined by *outcome-linked* features (e.g., "projects with budget disputes").  
     *Sufficient:* All classes use only features from Step 1.

  4. **Size check:**  
     Retain classes with ≥5 members. If none, proceed to Step 7 (novel project protocol).  
     *Sufficient:* At least one class passes; else, skip to Step 7.

  5. **Narrowness priority:**  
     Rank retained classes by "match score":  
     - +1 per matched feature from Step 1.  
     - +1 if all members from same jurisdiction/authority.  
     Select the highest-scoring class.  
     ⚖️ *Judgment call:* Tie-breaking (e.g., prefer recency). Document or escalate.

  6. **Estimate and bias test:**  
     Compute mean cost/delay overrun for the class.  
     *Bias test:* If class overrun is ≤10%, check against wider class (e.g., "all megaprojects"). If wider class overrun is ≥20% higher, flag risk of optimism bias.  
     *Sufficient:* Report estimate ± standard deviation and bias warning (if any).  
     **→ Stop here if Step 4 passed.**

  7. **Novel project protocol (if Step 4 failed):**  
     - **Blend nested classes:** Generate classes by relaxing features *one at a time* (e.g., "all tunnels" → "all river projects").  
     - **Weighted estimate:**  
       - For each class, compute mean overrun (*μ*) and standard error (*SE* = σ/√n).  
       - Similarity score (*S*) = (# matched features)/(total features).  
       - Weight (*w*) = *S* / *SE*².  
       - Final estimate = (Σ(*w* × *μ*)) / Σ*w*.  
     - **Decompose project:** If blending is unreliable (e.g., *S* < 0.3 for all classes), split into subcomponents (e.g., "tunnel construction," "riverbed work") and run reference classes per component.  
     *Sufficient:* Blended estimate ± max *SE* or componentized report.  
     ⚖️ *Judgment call:* Feature relaxation order. Escalate if materially consequential.

  8. **Documentation/escalation:**  
     - If any ⚖️ step lacks consensus or estimate swings >±20% with plausible alternatives, escalate to panel.  
     - Archive: Features, classes, scores, weights, and bias flags.  

  ---

  ### Worked Examples  
  **Case 1: Light-Rail Extension (contentious class)**  
  - *Features:* Urban rail, length=11mi, mid-sized city, developed economy, public funding.  
  - *Classes proposed:*  
    - A: All urban rail (n=40; match=1/5).  
    - B: Rail 10–12mi (n=6; match=3/5).  
    - C: Authority’s capital projects (n=15; match=2/5).  
  - *Exogeneity:* All valid.  
  - *Size check:* All pass (n≥5).  
  - *Narrowness:* B has highest match (3/5).  
  - *Bias test:* B’s mean overrun=15%. Wider class A=35%→flag bias.  
  - *Outcome:* Use B (15% overrun) but warn of optimism. **Unwelcome:** Bias flag implies baseline cost may be underestimated.  
  - *Judgment flag:* Class B narrowly beat C due to length focus; escalation needed if C’s advocates dispute feature weighting.  

  **Case 2: Immersed Tunnel Replacement (novel project)**  
  - *Features:* Immersed tunnel, river crossing, seismic zone, state funding.  
  - *Classes proposed:*  
    - A: All tunnels (n=12; match=1/4).  
    - B: River projects (n=8; match=1/4).  
    - C: Authority megaprojects (n=20; match=0/4).  
  - *Exogeneity:* All valid.  
  - *Size check:* All pass.  
  - *Narrowness:* A and B tie (match=1). Relax "tunnel type" → new class D: "Submerged structures" (n=7; match=2/4).  
  - *Size check:* D passes (n=7>5).  
  - *Bias test:* D’s overrun=45%. Wider class C=22%→no bias flag.  
  - *Outcome:* Use D (45% overrun). **Unwelcome:** High overrun estimate may threaten funding.  
  - *Judgment flag:* Class D assumes "immersed" and "submerged" are comparable; if disputed, escalate.  

  ### Why This Works  
  - **Practicable:** Uses only project features, descriptive stats, and simple weighting.  
  - **Philosophically robust:** Enforces exogeneity, handles novelty via blending, and exposes bias.  
  - **Honest about uncertainty:** Forces documentation of subjective steps (feature choice, tie-breakers) and escalates disputes.  
  **Bottom line:** The procedure replaces fights over classes with auditable judgments—reducing hidden assumptions while accepting that some arbitrariness is ineliminable.
