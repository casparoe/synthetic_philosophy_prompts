        Class 1: immersed tunnel, river crossing, in the country (3 projects) -> mean overrun m1, variance v1 (but with 3, variance is unstable).
        Class 2: immersed tunnel, any purpose, in the country (10 projects) -> m2, v2.

        We weight by inverse variance and similarity. The similarity of the target to class 1: it matches on purpose (river crossing) and type (immersed tunnel) so high similarity (say 1.0). For class 2: it matches on type but not purpose, so lower similarity (say 0.5). Then:

          weight1 = 1 / v1 * 1.0
          weight2 = 1 / v2 * 0.5

        But v1 might be very high because of the small sample. So weight1 might be low. Then the estimate is pulled towards m2.

        Alternatively, we might break down the project: use reference classes for the components (e.g., tunnel construction, river-related risks, etc.). This might be better.

    4. Step 5: Because it's novel, we might use decomposition. We break the project into:
          - Tunnel construction: use a reference class of immersed tunnel construction (anywhere) -> overrun distribution for cost of tunnel.
