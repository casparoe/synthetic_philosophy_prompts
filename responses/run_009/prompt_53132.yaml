prompt: |-
  I am a professor of philosophy who works on formal epistemology and the philosophy of probability, and for the past two years I have sat on the methodology advisory panel of a regional transportation authority. The authority's analysts do what they call reference-class forecasting for capital projects: to estimate the cost and schedule of a proposed light-rail extension, they assemble a set of comparable completed projects, look at the distribution of cost overruns and delays in that set, and use it to adjust the plan's numbers. Every fight on the panel is about the set. For a mid-sized city's eleven-mile rail extension, is the right class all urban rail projects in developed economies, rail projects of similar length, the authority's own completed capital projects regardless of type, or every megaproject in the jurisdiction over the last thirty years? Analysts holding identical data reach estimates that differ by factors, and each side suspects the other of choosing the class that produces the answer they already favored. The panel has asked me to write something for their next methodology retreat, and I would rather not hand them a seminar paper on Reichenbach.

  What I want from you is a decision procedure a working analyst can actually run in an afternoon, without reading any philosophy: an ordered list of questions to ask about a proposed project, what counts as a sufficient answer to each, and where the procedure should stop and say explicitly that the choice between two defensible classes is a judgment call that must be escalated or documented rather than hidden inside a number. The procedure must handle the considerations the philosophical literature actually turns on — the tradeoff between narrow classes that match on causally relevant features but contain few members, and wide classes with many members that lump together superficially similar but structurally different projects; the fact that the target project is described differently under different descriptions and no description is the "real" one; and the genuinely novel case, where nothing in the jurisdiction's history or the sector's looks like a close match. It should say something about whether to pick one class at all or instead blend estimates across nested classes, and about when the analyst should stop treating the reference class as the problem and instead ask whether the plan's own cost estimate is biased, which is arguably the diagnosis the whole method presupposes. Then run the procedure on two cases: the light-rail extension above, where comparables are plentiful but the definition fights are bitter, and a proposed replacement of an aging river crossing with an immersed tunnel, where the authority has never built one and any reference class will be thin, heterogeneous, or both. At least one of the worked cases should come out with an answer the panel will find unwelcome, and the procedure should flag in advance which steps are judgment calls dressed up as procedure.

  Please take the role of a philosopher of probability who has spent enough time around practitioners to know that a procedure nobody runs is worthless, and think carefully before writing — in particular, brainstorm the candidate ways one might tame the reference class problem (exogeneity of the class, weighting by similarity, the Berkeley-style move of conditioning on all the specific evidence you have, the pessimist's move of always widening the class until the estimate gets worse) and be explicit about which of these the procedure adopts, which it rejects, and why. Lead with your bottom line in the very first sentence — state the core rule of the procedure in one or two lines — and then give the reasoning and the procedure itself, with no preamble and no restatement of my question.
reasoning: |-
  We are going to define a procedure that balances the trade-offs in reference class forecasting. The core rule is: **Choose the narrowest class that (a) has at least five members and (b) is exogenously defined by features known to be causally relevant at the start of the project, and then explicitly document the class and any judgment calls. If no such class exists, use a weighted average over nested classes and flag the uncertainty.**

   Reasoning:
   - We prioritize exogeneity to avoid cherry-picking: the class must be defined by features known before project outcomes (like project type, location, length, etc.) to prevent using outcome data to define the class.
   - We require at least five members to avoid extreme variance. This number is arbitrary but practical; it's a common rule of thumb in statistics for minimal sample size in distributional estimates.
   - Narrow classes are preferred to capture causal homogeneity, but if we cannot get five members, we must widen. However, widening must be done systematically by relaxing one feature at a time (creating nested classes) and then weighting by the inverse of the variance of the overrun distribution in each class (so more precise estimates get more weight) and the similarity to the target (if we have a similarity metric).
   - We reject the "always widen until the estimate gets worse" because it might lead to including irrelevant projects and bias. We also reject conditioning on all specific evidence (the Berkeley move) because it typically leads to a singleton (or very small class) and we need a distribution. Instead, we use a similarity-weighted average when we have to combine.
   - We explicitly flag steps that are judgment calls (e.g., which feature to relax first, what causal features to consider) and require documentation.

   Procedure Steps:

   1. **Define the target project by its initial features:** List all features of the project that are known at the planning stage and might be causally relevant (e.g., project type, length, location, terrain, funding structure, technology, etc.). This step is a judgment call because the set of features considered relevant is based on domain knowledge. Document the features.

   2. **Attempt to build the narrowest class:**
      - Start by including only projects that match the target on all features deemed "most critical" (another judgment call; the analyst must list these critical features and justify). The critical features should be those with strong causal evidence (e.g., from past studies or expert consensus) for affecting overruns.
      - If the class has at least five members, use it. Document the class and move to step 4.
      - If not, proceed to step 3.

   3. **Widen the class systematically:**
      - Create a hierarchy of classes by relaxing one feature at a time (the order of relaxation is a judgment call and must be documented). For each relaxation, create a new class by removing one feature (or broadening its values, e.g., from "exactly 10-12 miles" to "8-15 miles") and count the members.
      - Stop when you have a class with at least five members. If multiple classes meet the size requirement, choose the one that is the narrowest (i.e., the one with the most features still matching). If multiple classes are equally narrow, choose the one with the smallest variance in overruns (if data allows) or the one that is most recent (if recency is a concern). If no class has five members, then proceed to step 3b.
      - **Step 3b: Weighted average over nested classes:** If no single class has five members, we use a set of nested classes (starting from the narrowest and widening). For each class, compute the mean overrun and its variance. Then weight the mean overrun of each class by the inverse of the variance and by a similarity score (if available). The similarity score can be the fraction of the target's features that match the class (if the class is defined by a subset of features). The weighted estimate is: 
          Estimate = Σ (weight_i * mean_i) / Σ weight_i
          where weight_i = 1 / (variance_i) * (similarity_i)
        If no similarity metric is available, use only the inverse variance. If variance cannot be computed (too few points) then use the variance of the widest class that has enough data (or a conservative estimate). This step is complex and must be clearly documented.

   4. **Assess the class for bias:** Now, regardless of the class chosen, check for signs that the class itself might be biased. For example:
      - Are all the projects in the class from the same authority? (Then they might share systematic biases in estimation.)
      - Are they from a different time period? (Then inflation or changes in regulations might matter.)
      - Are there known structural differences (e.g., regulatory changes, technological shifts) that make the class not comparable?
      If such biases are found, adjust the overrun estimate by expert judgment (e.g., add a risk premium) and document.

   5. **Handle the novel project:** If after step 3 we still have no class (or a class with less than five members) and the project is genuinely novel (e.g., the immersed tunnel when only bridges have been built), then:
      - Use the widest class available (e.g., all infrastructure projects) but flag that the estimate is highly uncertain.
      - In addition, break down the project into components that are not novel and use reference classes for those (e.g., tunnel construction, water-related risks, etc.) and then combine. This is called decomposition and is an alternative to reference class forecasting for the whole project.

   6. **Documentation and stopping rule:** At every step where a judgment is made (choice of critical features, order of relaxation, choice of class when multiple meet criteria, handling of bias, etc.), document the rationale. The procedure stops when we have an estimate and a documented class (or classes). If at any point the analyst must make a judgment that has a material effect on the estimate and there is no clear reason to prefer one option, the procedure says: **Escalate the decision to the panel and document the disagreement.**

