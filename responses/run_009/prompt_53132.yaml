    1. Features: urban rail, developed economy, 11 miles, city size, terrain, funding (public), technology (light rail), etc.
    2. Narrowest class: all light-rail extensions in mid-sized cities in developed economies of length 10-12 miles. Suppose we have only 3 projects. Then we relax one feature. The order of relaxation is a judgment: we might first relax length to 8-15 miles (if we think length is less critical than type). Now we get 6 projects (with length 8-15 miles). We stop and use this class? But wait, we must check if we have at least five. We do. But what if we also have a class by relaxing city size (to include both mid and large) and that gives 4? Then we have to choose between two classes: one by relaxing length (6 projects) and one by relaxing city size (4 projects). We pick the class with 6 because it is larger and meets the five threshold. But note: if we had a class by relaxing a different feature (say, funding) that gives 5, we might choose that if we think funding is less critical. This is a judgment call. The procedure requires that we document the order of relaxation and the choice.

