prompt: |-
  My friend and I got into a three hour arguement last night about Nozick's tracking theory and I want a second opinion in actual number form. Quick setup so we're on the same page: Nozick's idea is roughly that knowing P isn't just justified true belief, you also have to track the truth of P — if P were false you wouldn't believe it, and in nearby situations where P holds you'd still believe it. The infamous cost is that knowledge comes out as NOT closed under known entailment: I can know I have hands, know perfectly well that having hands entails not being a handless brain in a vat, and yet fail to know I'm not a brain in a vat, since I'd believe I have hands either way and the tracking condition fails for the vat proposition. My friend says this is a straight dealbreaker and that anyone who bites this bullet is just protecting a cute analysis. But honestly I kind of admire the bullet-biting? It seems right that I don't *track* the vat proposition, and maybe closure was never really a datum about knowledge in the first place — maybe we confuse it with warrant not always transmitting across deduction, which fails anyway in lottery cases and Moorean proofs.

  So give me your credence, an actual number, that Nozick-style sensitivity theory (or something in that neighborhood, not necessarily his exact formulation) is closer to the truth about knowledge than any view that keeps full closure. And decompose it properly: the probability that closure under known entailment is a necessary truth about knowledge rather than a plausible-but-false principle that's really about warrant transmission or argumentative support; the probability that sensitivity captures the anti-luck intuition better than safety does, given that safety was largely invented to keep closure while blocking the same skeptic — that feels like the actual battleground; the probability that the grandmother type cases (where sensitivity wrongly denies knowledge but safety allows it) are knowledge versus lucky true belief; and whatever other terms you think belong, with a rough probability and one line of justification each, then combine them. Don't just hedge into "it depends on your theory of knowledge" — the whole point is that I want the number with the weak points marked.

  Also, my friend claims that once you notice tracking theory was basically built to answer the skeptic, the closure denial stops looking like a bug and starts looking like the whole feature: the theory tells you exactly which inferences you can make from your knowledge, and "not through skeptical hypotheses" is a principled place to cut it off. I suspect this is too quick but I can't fully say why. Tell me which of the sub-questions your final number is most sensitive to, and what argument or kind of case would move it the most — if there's a specific style of counterexample that would make you revise, name it and say in which direction. And if you think my friends framing smuggles something in, say that too. (sorry for the typos, its late)
