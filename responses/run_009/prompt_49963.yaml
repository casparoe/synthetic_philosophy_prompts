prompt: |-
  ok so this is weird and I need someone to untangle it for me. in my civics class we got on the subject of perjury and my teacher told us about this supreme court case from the 70s, Bronston v. United States I think. this guy was being questioned under oath after his movie company went bankrupt and got asked basically "do you have any bank accounts in Swiss banks" and then "have you ever". his answer to the second one was "The company had an account there for about six months, in Zurich." here's the thing — that answer was 100% true. the company DID have that account. but HE personally had a secret Swiss account for like five years that he never mentioned, and everyone agrees he answered about the company on purpose so the lawyer would think he never had one. and the supreme court said unanimously that's not perjury. you can't be convicted for something literally true, even if you said it to trick the person asking. the court's whole attitude was that it's the questioner's job to ask better follow-ups — if the lawyer had just pressed him with one more question the whole thing would've been cleared up, so the system puts that burden on the questioner, not on the witness.

  so my question is about what this rule actually presupposes about lying and misleading, like philosophically. because outside of court, everybody treats misleading someone as basically just lying with extra steps. my mom says omitting stuff to your friends IS lying. but the law here draws this really hard line, and it's not just this one case — regular people say stuff like "technically true" all the time to get out of things (ask any kid what "I did my homework" means, or a politician answering the question they wish got asked).

  some stuff I keep going back and forth on:

  - does the rule only make sense because a courtroom is a weird adversarial setting where both sides have lawyers and the questioner is supposed to be a professional? like if the "questioner's burden" thing is the real justification, does it fall apart anywhere the person asking questions isn't a trained lawyer — depositions of regular people, job interviews, a principal questioning a student?
  - is the law implicitly saying there's a real MORAL difference between lying and misleading, or is it just drawing a line for practical/administrative reasons, like maybe it's just too hard for a jury to figure out intent? could a philosopher who thinks lying and misleading are equally bad still endorse this rule, or does the rule kinda take a side in that debate?
  - also if deception is wrong mainly because of what it does to the deceived person (they end up believing false stuff either way), why does the FORM of the words matter so much here? the lawyer walked out of that room just as deceived as if bronston had flatly said "no."

  basically I want the implicit theory of deception this legal practice is built on, whether it's consistent (like, is the law elsewhere more sympathetic to "technically true" claims, or does it punish them in other contexts?), and where the rule would break if you moved it out of the courtroom. also honestly tell me if I'm wrong that everybody outside the law treats misleading as lying, because that's kind of the whole setup of my question.
