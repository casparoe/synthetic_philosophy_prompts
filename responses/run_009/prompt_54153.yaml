  We are drafting a joint statement for two researchers: an attribution realist and a deflationist. The statement must include:

  1. A numbered section of claims both can sign.
  2. A table of remaining disagreements, each phrased acceptably to both sides.
  3. The cruxes (subquestions) with concrete tests/interventions/arguments both agree would bear on them, and each side's predictions for each test.
  4. Explicitly flag any part of the residual disagreement that is verbal.

  Scope: present-day language models (e.g., GPT-4, LLaMA, etc.).

  Let's break it down step by step.

  ### 1. Jointly Agreed Claims (Numbered Section)

  Both should agree on:

  - The predictive and practical value of intentional vocabulary for these systems.
  - What mechanistic interpretability does and does not show.
  - Attribution is licensed by observed behavior, not by knowledge of the substrate.
  - The difference between attributing belief-like states to a language model vs. a thermostat or chess engine.

  Draft:

  1. **Predictive and Practical Value**: We agree that using intentional vocabulary (such as "believes", "desires", "intends") to describe and predict the behavior of current language models (LMs) is often highly effective. This vocabulary allows us to anticipate model outputs, design better interactions, and debug failures in a way that is more efficient and scalable than relying solely on lower-level descriptions.

  2. **Mechanistic Interpretability**: We agree that mechanistic interpretability (MI) techniques, which aim to reverse-engineer the internal computations of LMs, can reveal important aspects of how these models process information. However, MI has not yet provided a complete, transparent, and human-understandable account of the model's behavior at the level of granularity that intentional vocabulary operates at. Moreover, the success of intentional attributions does not currently depend on the availability of such mechanistic accounts.

  3. **Basis for Attribution**: We agree that attributions of belief-like states are licensed by the model's observable behavior (i.e., its outputs in response to inputs) and the systematic patterns therein, rather than by direct knowledge of the model's internal substrate. This is analogous to how we attribute beliefs to other humans based on their verbal and non-verbal behavior.

  4. **Distinction from Simpler Systems**: We agree that there is a significant difference between attributing belief-like states to current LMs and attributing them to simpler systems like thermostats or chess engines. LMs exhibit a much broader range of context-sensitive, flexible, and generative behaviors that are more analogous to human linguistic and reasoning behaviors. This makes intentional vocabulary more predictively useful and less eliminable without loss of explanatory power for LMs than for thermostats (which can be fully explained with a few rules) or chess engines (which operate within a fixed, rule-bound domain).

  ### 2. Table of Remaining Disagreements

  Phrase each disagreement so that both sides can accept the wording.

  | Disagreement | Attribution Realist | Deflationist |
  |--------------|---------------------|--------------|
  | **Predictive Indispensability as Evidence** | The fact that intentional vocabulary is predictively indispensable at a certain grain of description for current LMs provides defeasible evidence that there are genuine belief-like states with somewhat determinate contents in the model. | The predictive indispensability of intentional vocabulary for current LMs reflects only the utility of this vocabulary for organizing and predicting behavior, without implying the existence of genuine belief-like states; it is a matter of human interpretative practices. |
  | **Truth vs. Aptness of Attributions** | Attributions of belief-like states to LMs can be true or false in a substantial sense, meaning they can correctly or incorrectly describe internal states of the model that are causally involved in generating behavior. | Attributions of belief-like states are best understood as apt or inapt (i.e., useful or not for a particular purpose) rather than true or false in a substantial sense; they are useful fictions. |
  | **Determinacy of Content** | The contents of the belief-like states attributed to LMs are somewhat determinate, meaning that for a given state and context, there is a fact of the matter about what the model believes, even if there is some vagueness at the margins. | The apparent determinacy of content in attributions to LMs is undermined by the substantial interpretive latitude that human stance-takers have, and the same behavioral evidence can often support multiple content attributions. |
  | **Role of Training Data** | The fact that LMs acquire their dispositions by ingesting human-produced text (rather than by acting in the world) does not undermine the reality of their belief-like states; it is a different but equally valid route to acquiring such states. | The fact that LMs acquire their dispositions solely through ingesting text, without embodied interaction with the world, is a key reason why attributions of belief-like states are merely useful interpretations rather than descriptions of genuine internal states. |

  ### 3. Cruxes with Tests and Predictions

  For each crux, provide a concrete test, intervention, or argument that both agree would bear on it, and then each side's prediction.

  **Crux 1: Convergence of Independent Attributions**  
  - **Test**: Have multiple independent, competent stance-takers (e.g., researchers trained in intentional stance methodology) attempt to attribute belief-like states to a language model based on the same set of behavioral evidence (e.g., a log of input-output interactions) and the same incentive structure (e.g., maximize predictive accuracy). Measure the degree of convergence in their attributions (e.g., by having them label the same set of model responses with belief attributions and then compute inter-rater agreement).  
  - **Realist Prediction**: There will be substantial convergence (e.g., high inter-rater agreement) because the model's internal states have determinate content that competent interpreters can discover.  
  - **Deflationist Prediction**: There will be significant divergence (e.g., low to moderate inter-rater agreement) because attributions are substantially influenced by the interpreter's background and choices, and the behavioral evidence underdetermines content.

  **Crux 2: Robustness of Intentional Predictions under Perturbations**  
  - **Test**: Perturb the model in ways that the mechanistic story (if known) suggests should disrupt a particular belief attribution if it were merely a bookkeeping device, but not if it corresponds to a robust internal state. Examples:  
    a. *Paraphrase*: If the model attributes a belief that P, test whether the same attribution holds when the input is paraphrased in ways that should not change the belief (if real) but might break surface-level patterns.  
    b. *Temperature changes*: Change the sampling temperature (which affects output randomness) and see if the model's behavior still aligns with the belief attribution across variations.  
    c. *Targeted fine-tuning*: Fine-tune the model on a small set of examples designed to alter a surface pattern without changing the underlying belief (if it exists).  
    The test is whether the intentional-level predictions (e.g., "the model believes P") survive these perturbations.  
  - **Realist Prediction**: Intentional attributions will largely survive these perturbations because they track robust internal states.  
  - **Deflationist Prediction**: Intentional attributions will be fragile under such perturbations because they depend on surface patterns and are easily disrupted by changes that don't necessarily alter deeper states (which they don't think exist).

  **Crux 3: Displacement by Mechanistic Accounts**  
  - **Test**: As mechanistic interpretability advances, observe whether it eventually provides explanations at the same grain as intentional vocabulary and whether these mechanistic accounts displace intentional ones (i.e., become the preferred or more fundamental explanation) in domains where both currently apply.  
  - **Realist Prediction**: Mechanistic accounts will not fully displace intentional ones because the intentional level captures real patterns that are multiply realizable and more efficient for prediction. They may complement but not replace intentional descriptions.  
  - **Deflationist Prediction**: As mechanistic accounts become more complete, they will increasingly displace intentional vocabulary by providing more precise and fundamental explanations, reducing the need for intentional talk to mere heuristic convenience.

  ### 4. Flagging Verbal Disagreements

  Explicitly flag any part of the residual disagreement that is verbal.

  We judge that **part of the disagreement about whether attributions can be "true" or only "apt"** is verbal. Specifically, the realist uses "true" to mean that the attribution corresponds to a real internal state that plays a causal role, while the deflationist uses "true" in a more robust metaphysical sense that they deny. The deflationist is willing to call an attribution "apt" if it is useful and systematically successful, but they deny that this success implies a correspondence to an internal state. Thus, the dispute is partly about the meaning of "truth" in this context, and not solely about the model. However, there is also a substantive disagreement about whether there are internal states with content that the attributions are tracking.

  Similarly, **the use of the term "belief"** might be verbal. The realist is using "belief-like state" to denote a functional state that plays a role similar to belief in humans, while the deflationist might reserve "belief" for states that are part of a full agential profile (including desires, intentions, and world-directed actions). This difference in terminology might mask some agreement about the functional characteristics of the model.

