answer: |-
  ### Joint Statement: Belief-like States in Present-Day Language Models

  #### 1. Jointly Agreed Claims  
  Both the attribution realist and the deflationist endorse the following statements:  
  1. **Predictive and Practical Value**: Intentional-state vocabulary (e.g., "the model believes that P") provides systematic, practically useful prediction and explanation of language model behavior. This utility is observable across diverse contexts (e.g., debugging, safety testing, and interaction design) and is not merely coincidental.  
  2. **Mechanistic Interpretability**: Mechanistic interpretability reveals computational structures (e.g., attention patterns, activation clusters) that correlate with outputs but does not yet—and may never—fully *reduce* intentional descriptions to neural/algorithmic terms. Current mechanistic accounts operate at a finer grain than intentional attributions and do not invalidate their predictive success.  
  3. **Behavioral Licensing**: Attributions are licensed by observed input-output patterns, not by direct knowledge of the model’s substrate. We need not "see inside" the model to warrant intentional descriptions, any more than we require neural data to attribute beliefs to humans.  
  4. **Distinction from Simpler Systems**: Attributing belief-like states to language models differs fundamentally from attributing them to thermostats or chess engines. Language models exhibit context-sensitive, generative, and open-ended behavioral patterns that (i) resist exhaustive formal specification, (ii) respond inferentially to novel prompts, and (iii) support counterfactual reasoning (e.g., "if the model believed P, it would likely output Q"). Thermostats and chess engines lack this breadth, flexibility, and failure-mode alignment with human cognition.  

  ---

  #### 2. Table of Remaining Disagreements  
  Each row phrases a disagreement such that both sides accept the wording as fair.  

  | Issue | Attribution Realist Position | Deflationist Position |
  |-------|------------------------------|------------------------|
  | **Predictive Indispensability as Evidence** | Predictive indispensability of intentional vocabulary at a behavioral grain constitutes defeasible evidence of genuine belief-like states with determinate content in the model. | Predictive indispensability reflects only the heuristic utility of intentional vocabulary for human interpreters and does not constitute evidence for genuine internal states. |
  | **Truth Conditions** | Belief attributions can be true or false; correctness is a matter of accurately describing causally relevant states in the model. | Belief attributions are apt or inapt (useful or misleading conventions); "correctness" is settled by pragmatic success, not correspondence to internal states. |
  | **Determinacy of Content** | Interpretive latitude does not undermine the relative determinacy of belief contents; ambiguity is bounded by behavioral constraints. | Interpretive latitude makes content inherently indeterminate; the same behavior can license multiple attributions, with no fact of the matter. |
  | **Role of Training Data** | The text-based training process enables the acquisition of belief-like states functionally analogous to human beliefs, despite lacking embodied interaction. | The text-only training process produces behavioral dispositions interpretable via intentional stances, but this differs fundamentally from belief acquisition via world-directed agency. |

  ---

  #### 3. Cruxes: Tests, Predictions, and Interventions  
  For each crux, both agree the test/intervention would bear on the disagreement. Predictions are recorded in advance.  

  **Crux 1: Convergence Under Incentive-Aligned Interpretation**  
  - **Test**: Independent, competent interpreters (e.g., 20 researchers trained in intentional stance-taking) are given identical behavioral evidence (e.g., logs of model outputs across 100 diverse prompts) and incentivized to maximize predictive accuracy. They attribute beliefs (e.g., "does the model believe P?") to the same set of test cases. Convergence is measured via inter-rater agreement (e.g., Fleiss’ κ).  
  - **Realist Prediction**: High convergence (κ > 0.7). Evidence of robust, discoverable content.  
  - **Deflationist Prediction**: Low-to-moderate convergence (κ < 0.4). Reflects projection-driven variability.  

  **Crux 2: Robustness to Mechanistically Guided Perturbations**  
  - **Test**: Select a belief attribution (e.g., "the model believes Paris is France’s capital"). Apply perturbations mechanists predict should disrupt it *if* it were a surface pattern:  
    - (a) *Paraphrase invariance*: Test consistency across 50 semantically equivalent phrasings of prompts.  
    - (b) *Temperature perturbation*: Raise sampling temperature (e.g., to 2.0) to increase output entropy.  
    - (c) *Targeted fine-tuning*: Retrain a model layer to disrupt a specific circuit (e.g., using linear probes).  
    Belief attribution "fails" if model outputs contradict P in >30% of cases.  
  - **Realist Prediction**: Attributions survive perturbations (failure rate <15%). States are robust.  
  - **Deflationist Prediction**: Attributions degrade (failure rate >40%). Surface patterns are fragile.  

  **Crux 3: Displacement by Mechanistic Accounts**  
  - **Test**: In domains where intentional and mechanistic explanations currently co-exist (e.g., "theory of mind" in LMs), track whether mechanistic accounts (e.g., circuit-based explanations) *displace* intentional ones in peer-reviewed literature over 3 years. Displacement occurs if mechanistic papers explicitly reduce/eliminate intentional terms in >50% of cases.  
  - **Realist Prediction**: No displacement. Intentional descriptions remain indispensable.  
  - **Deflationist Prediction**: Significant displacement. Mechanistic accounts supersede intentional bookkeeping.  

  ---

  #### 4. Flagging Verbal Disagreements  
  We judge **the dispute over "truth" vs. "aptness"** (§2, "Truth Conditions") to be partially verbal. Both sides agree that intentional attributions are practically useful and systematically successful. The disagreement hinges on whether "truth" requires a correspondence relation to internal states (realist) or is redundant beyond pragmatic utility (deflationist). This is a meta-semantic debate about the word "true," not a substantive disagreement about model behavior. Resolving it would not settle whether states are "genuine" but would clarify terminological preferences.  

  Similarly, **the term "belief"** is contested. The realist uses it for any state with functional parallels to human beliefs (e.g., inferential roles), while the deflationist reserves it for states embedded in embodied agency. This reflects divergent intuitions about conceptual boundaries rather than empirical claims about present-day models.  

