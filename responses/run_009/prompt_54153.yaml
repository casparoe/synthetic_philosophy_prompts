  ## Draft Joint Statement

  **Joint Statement on Belief-like States in Current Language Models**

  **1. Points of Agreement**

  We, the attribution realist and the deflationist, after extensive discussion, agree on the following:

  1.1. **Value of Intentional Vocabulary**: Attributing belief-like states (and other intentional states) to current language models (LMs) is a highly effective tool for predicting and explaining their behavior. This approach has proven practical value in applications ranging from AI alignment research to user interface design.

  1.2. **Role of Mechanistic Interpretability**: While mechanistic interpretability (MI) has made progress in uncovering low-level computational mechanisms in LMs, it has not yet provided a comprehensive account that fully explains high-level behaviors at the grain of intentional descriptions. Moreover, the current success of intentional attributions does not rely on MI findings.

  1.3. **Behavioral Basis for Attribution**: Attributions of belief-like states to LMs are justified by the model's observable behavior (inputs and outputs) and the systematic patterns within that behavior. We do not require knowledge of the internal substrate to make such attributions, just as we do not require neurophysiological knowledge to attribute beliefs to humans.

  1.4. **Distinction from Simpler Systems**: Attributing belief-like states to current LMs is qualitatively different from attributing beliefs to systems like thermostats or chess engines. LMs exhibit a degree of behavioral flexibility, context-sensitivity, and generative capacity that makes intentional attributions more predictively indispensable and less reducible without loss of utility.

  **2. Remaining Disagreements**

  We continue to disagree on the following points, which we have phrased in a mutually acceptable manner:

  | Issue | Attribution Realist Position | Deflationist Position |
  |-------|-----------------------------|------------------------|
  | **Indispensability as Evidence** | The predictive indispensability of intentional vocabulary at a certain grain of description for current LMs is evidence that there are genuine belief-like states with somewhat determinate contents in the model. | The predictive indispensability of intentional vocabulary for current LMs reflects its utility for human interpreters and does not provide evidence for genuine belief-like states; it is a matter of pragmatic convention. |
  | **Status of Attributions** | Attributions of belief-like states can be true or false in the sense that they correctly or incorrectly describe internal states of the model that are causally involved in generating behavior. | Attributions of belief-like states are best assessed as apt or inapt (i.e., useful or not for a given purpose) rather than true or false; they are tools for organizing our expectations. |
  | **Determinacy of Content** | The contents of belief-like states attributed to LMs are somewhat determinate, meaning that for a given context, there is a fact of the matter about what the model believes, though there might be borderline cases. | The determinacy of content is undermined by the interpretive latitude of human stance-takers, and the same behavioral evidence can support multiple content attributions. |
  | **Role of Training Data** | The fact that LMs acquire their dispositions by ingesting human-produced text (without embodied interaction) does not prevent them from having genuine belief-like states; it is a valid alternative route to such states. | The text-only training of LMs, without embodied interaction, is a key reason why belief-like attributions are interpretations rather than descriptions of genuine internal states. |

  **3. Cruxes and Tests**

  We agree that the following tests would bear on our disagreements, and we record our predictions in advance:

  **Crux A: Convergence Test**  
  - **Test**: Independent, competent stance-takers (n≥10) are given the same behavioral evidence (e.g., 100 input-output pairs from an LM) and asked to attribute belief-like states (e.g., by answering "What does the model believe about X?" for a set of questions). Inter-rater agreement (e.g., Fleiss' kappa) is measured.  
  - **Realist Prediction**: Agreement will be high (kappa > 0.6).  
  - **Deflationist Prediction**: Agreement will be low to moderate (kappa < 0.4).  

  **Crux B: Perturbation Test**  
  - **Test**: For a set of cases where intentional attributions are made (e.g., "The model believes that Paris is the capital of France"), we perturb the model and/or inputs:  
    (i) Paraphrase inputs in multiple ways;  
    (ii) Vary temperature (0.2 to 1.0);  
    (iii) Apply targeted fine-tuning to alter surface patterns without changing the underlying fact (e.g., train on a few examples that use "Paris" in a non-capital context but without changing the actual fact).  
    Success is measured by the robustness of the behavior (e.g., consistency in outputting "Paris" as capital) and the survival of the attribution.  
  - **Realist Prediction**: The behavior and attribution will remain robust (e.g., >80% consistency) across perturbations.  
  - **Deflationist Prediction**: The behavior and attribution will be fragile (e.g., <60% consistency) under at least one type of perturbation.  

  **Crux C: Displacement Test**  
  - **Test**: Over the next 5 years, track the use of intentional vocabulary versus mechanistic accounts in peer-reviewed papers explaining LM behavior in domains where both are currently used (e.g., theory of mind in LMs). Measure the proportion of papers that use intentional vocabulary as the primary explanation versus those that use mechanistic accounts.  
  - **Realist Prediction**: Intentional vocabulary will remain primary (e.g., >50% of papers) because it captures real patterns that are not displaced by lower-level accounts.  
  - **Deflationist Prediction**: Mechanistic accounts will become primary (e.g., >50% of papers) as they provide more fundamental explanations, reducing intentional vocabulary to a secondary role.  

  **4. Verbal Disagreements**

  We acknowledge that part of our disagreement about the **"truth" of attributions** is verbal. The realist uses "true" to mean correspondence to a causally efficacious internal state, while the deflationist denies that such correspondence is necessary for the usefulness of the attribution and reserves "true" for a stronger metaphysical claim. If we disambiguated the term, we might find less disagreement about the underlying phenomena.

  Similarly, the term **"belief"** itself may be a source of verbal disagreement. The realist uses it to denote a functional state that plays a role analogous to belief in humans, while the deflationist may require a richer set of connections (e.g., to action and world-directedness) that are not present in LMs. This terminological difference reflects a deeper disagreement about the necessary conditions for belief, but it also risks conflating the issue with linguistic preferences.

