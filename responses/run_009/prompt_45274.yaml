  I am a recently retired vision scientist who has spent the past few years reading philosophy of mind, and I have run into something about Molyneux's question that puzzles me. In a 2011 study of individuals whose congenital blindness had been surgically corrected, researchers tested exactly what Molyneux proposed: could the newly sighted, on first encountering objects visually, match what they saw to objects they had previously known only by touch? As I understand the findings, the patients performed well above chance but far below normally sighted controls when tested within days of surgery, with performance improving over subsequent sessions. To my mind this settles the matter, and it settles it the way Locke and Berkeley anticipated rather than the way Leibniz did: no, a newly sighted person cannot immediately recognise by sight what they know by touch. Yet contemporary philosophers continue to discuss Molyneux's question as a live problem rather than as a historical curiosity. Why? Surely a well-designed experiment trumps three centuries of armchair argument; and if the residual discussion is only about the meaning of the word "recognise", then it is a terminological dispute, not a substantive one. Is there any real question left here once the data are in — or is the continued debate simply an unwillingness to let a conceptual puzzle be closed by empirical findings? A related point I keep tripping over: if the patients genuinely matched above chance, doesn't that partially vindicate Leibniz after all, making the "no" answer too strong? I would be grateful for a careful explanation. Please answer in British English, indicate how confident you are in each of your main claims, and flag the single point in your answer you are least sure of.
