prompt: |-
  So our decision theory reading group has a blog that I basically run (mostly grad students, a couple of incurable Bayesians, plus some policy people who wander in from the MPA program), and I want to build a "which theory of risky choice do you actually hold?" quiz around the Allais mess. The goal is to sort readers by how they answer concrete cases, not by which label they like — so no question can just ask "do you accept the independence axiom?", every question has to be a choice between actual gambles with actual numbers and prizes, answerable by someone who has never heard of any of this jargon.

  The cases I want in there, roughly: the original Allais pair with the millions (the standard 1A/1B vs 2A/2B setup everyone uses), a common-consequence variant where the shared 89% chunk gets swapped from a big prize to nothing, and at least one pair constructed so that a pure rank-dependent probability weighter and a regret theorist have to give different answers — that's the split I actually care about and it's the part I'm least sure how to engineer, so tell me if it can't be done cleanly and flag it instead of papering over it. I also want the Diamond-style fairness case in there somewhere: two people, one indivisible prize, coin flip versus deterministic assignment, and the reader has to say whether the flip is morally better or just equivalent. Plus a couple of second-order questions: after someone gives the Allais pattern, ask whether they'd want to be debiased or whether they'd stand by it as a rational preference — that descriptive/normative split should do a lot of the sorting work.

  For the scoring key, the leaves should be something like: orthodox expected utility (your Allais choices are just mistakes), Allais' own position — cardinal utility defined over the whole prospect, where the preference for security near certainty is rational and which is NOT the same thing as prospect theory — regret theory (transitive, anticipated regret/rejoicing), rank-dependent weighting treated as a bias to correct for, and the same weighting endorsed normatively. Please flag where the quiz genuinely can't separate two leaves — I suspect Allais' composite-outcome view and regret theory will overlap a lot on my cases — and note any combination of answers that maps onto no leaf, with a sentence on whether nobody holds it because it's incoherent, unattractive, or just unexplored. Aim for 8-10 questions with two or three options each. Keep Ellsberg-style ambiguity stuff out of it, I don't want the quiz accidentally sorting on ambiguity attitudes instead of the independence stuff — though if you think one ambiguity question is needed as a control, say so and mark it clearly.
reasoning: |-
  We are building a quiz to sort people by their underlying theory of risky choice. The quiz should consist of 8-10 questions, each presenting a choice between gambles (or in one case, a fairness scenario) without using jargon. We are particularly interested in distinguishing between:
  - Orthodox expected utility (EU)
  - Allais' position (cardinal utility over whole prospect, accepting the certainty effect as rational)
  - Regret theory (transitive, but incorporating regret/rejoicing)
  - Rank-dependent probability (RDP) weighting (which might be held descriptively but not normatively, or endorsed normatively)

  We also include a Diamond fairness case and a second-order question about whether the respondent stands by their Allais choices.

  Important splits:
  1. We need to separate RDP from regret theory. We'll design a pair of choices where RDP and regret theory must diverge.
  2. We want to capture the descriptive/normative split: after the Allais questions, ask if they want to be "debiased" or stand by their choice.

  Structure:

  I. Allais Paradox (Original)
     - Question 1: Choice 1A vs 1B
     - Question 2: Choice 2A vs 2B

  II. Common-Consequence Variant (with shared 89% chunk being nothing)
     - Question 3: Choice 3A vs 3B
     - Question 4: Choice 4A vs 4B

  III. Pair to split RDP and regret theory
     - We design two choices (A and B) such that:
          - Under RDP (with typical weighting function, e.g., overweighting low probabilities and underweighting high ones), one pattern is chosen.
          - Under regret theory (which depends on pairwise comparisons and may violate independence but in a different way), a different pattern is chosen.

     How to do this? We need a setup where the regret comparison between outcomes in one gamble versus another leads to a different choice than what RDP would predict.

     One idea: use a pair of choices that involve a small chance of a very bad outcome (which RDP would overweight) versus a sure loss of a moderate amount (which might be avoided due to regret aversion). But we need to be careful.

     Alternatively, consider the following setup from Loomes and Sugden (1987) or similar regret theory tests.

     Let me design two choices:

     Choice A:
        Option A1: 90% chance of $100, 10% chance of $0
        Option A2: 100% chance of $50

     Choice B:
        Option B1: 90% chance of $100, 10% chance of $10
        Option B2: 100% chance of $50

     In regret theory, the regret from choosing A1 and getting $0 when you could have had $50 is very high. But in B, if you get $10 in B1 when you could have had $50, that's also regret but less than the $0 case. So a regret-averse person might choose A2 (the safe $50) in Choice A, but choose B1 in Choice B because the regret in the bad state is only $40 ($50-$10) instead of $50.

     However, note that in RDP (with typical inverse-S weighting), the 10% chance is overweighted. So in Choice A, the overweighting of the 10% chance of $0 might make A1 less attractive, leading to A2. But in Choice B, the 10% chance of $10 is still overweighted, but now the outcome is $10 (which is positive) so it might not be as bad. However, the safe $50 is still attractive.

     Actually, we need a clearer separation.

     Consider a different setup:

     Choice 1:
        Option X: 50% chance of $100, 50% chance of $0
        Option Y: 100% chance of $40

     Choice 2:
        Option P: 50% chance of $100, 50% chance of $40
        Option Q: 100% chance of $40

     Now, in regret theory, when comparing X and Y in Choice 1, if you choose X and get $0, you regret not getting $40. If you get $100, you rejoice. In Choice 2, if you choose P and get $100, you rejoice (over Q's $40); if you get $40, you feel the same as if you had chosen Q. So there is no regret in the $40 state. Therefore, a regret-averse person might prefer Y in Choice 1 (to avoid the regret of getting $0) and be indifferent (or nearly) between P and Q in Choice 2. But note that Q is $40 for sure and P gives $100 or $40, so without regret, P is better. However, with regret aversion, the absence of regret in the bad state of P (because you get the same as Q) might make P more attractive relative to X.

     Actually, a regret theorist might prefer Y in Choice 1 and P in Choice 2.

     Now consider RDP: 
        Choice 1: 
            X: w(0.5)*u(100) + w(0.5)*u(0)
            Y: u(40)
        If the weighting function overweights small probabilities and underweights moderate ones, but 50% is often underweighted (inverse S). So w(0.5) might be less than 0.5. Then the value of X might be less than 0.5*u(100). If u(100)=100 and u(0)=0, then X: w(0.5)*100. If w(0.5)=0.4, then X=40. And Y=u(40). So if u(40)=40, then X and Y are equal? But we need a difference.

     Alternatively, we can adjust the numbers.

     Let me try:

     Choice 1:
        X: 50% chance of $100, 50% chance of $0
        Y: 100% chance of $45

     Choice 2:
        P: 50% chance of $100, 50% chance of $45
        Q: 100% chance of $45

     Now, in RDP (with inverse S):
        Let w(0.5)=0.4 (underweighted). Assume u(x)=x (linear for simplicity).
        Choice 1:
            X: 0.4*100 + 0.6*0 = 40
            Y: 45   -> so Y is better.
        Choice 2:
            P: 0.4*100 + 0.6*45 = 40 + 27 = 67
