  Based on your specifications, here's a "Which theory of risky choice do you actually hold?" quiz designed to sort readers into specific theoretical positions using concrete gamble choices and fairness judgments, without relying on jargon. The quiz cleanly separates rank-dependent probability (RDP) weighting from regret theory and flags where Allais' composite-outcome view overlaps with regret theory.

  ### Quiz Structure (8 Questions)
  **Instructions:** For each scenario, choose the option you genuinely prefer. All prizes are hypothetical but assume these are meaningful sums (e.g., "millions" = life-changing amounts).

  ---

  #### **Question 1: Original Allais (Security near certainty)**  
  You face two options:  
  - **A1:** $1 million for sure.  
  - **B1:** 89% chance of $1 million, 10% chance of $5 million, 1% chance of $0.  
  → Choose: ○ A1  ○ B1  

  #### **Question 2: Original Allais (Risk in losses)**  
  You face two options:  
  - **A2:** 11% chance of $1 million, 89% chance of $0.  
  - **B2:** 10% chance of $5 million, 90% chance of $0.  
  → Choose: ○ A2  ○ B2  

  #### **Question 3: Common-Consequence Variant (Shared "nothing" consequence)**  
  You face two options:  
  - **C1:** 5% chance of $1 million, 95% chance of $0.  
  - **D1:** 1% chance of $5 million, 4% chance of $1 million, 95% chance of $0.  
  → Choose: ○ C1  ○ D1  

  #### **Question 4: RDP vs. Regret Splitter (Critical divergence)**  
  You face two options:  
  - **E1:** 90% chance of $10, 10% chance of $5.  
  - **F1:** 90% chance of $11, 10% chance of $0.  
  → Choose: ○ E1  ○ F1  

  #### **Question 5: Diamond Fairness Case**  
  Two patients need an indivisible lifesaving treatment. They are identical in all relevant respects. You must choose:  
  - **G1:** Give the treatment to Patient 1.  
  - **G2:** Flip a fair coin (heads: Patient 1, tails: Patient 2).  
  → Choose: ○ G1  ○ G2  

  #### **Question 6: Common-Ratio Effect**  
  You face two options:  
  - **H1:** $100 for sure.  
  - **I1:** 80% chance of $150, 20% chance of $0.  
  → Choose: ○ H1  ○ I1  

  #### **Question 7: Common-Ratio Effect (Low-probability version)**  
  You face two options:  
  - **J1:** 25% chance of $100, 75% chance of $0.  
  - **K1:** 20% chance of $150, 80% chance of $0.  
  → Choose: ○ J1  ○ K1  

  #### **Question 8: Normative Endorsement (Post-Allais debiasing)**  
  *If you chose A1 in Q1 and B2 in Q2:*  
  Economists say preferring A1+B2 violates "expected utility theory." If offered free coaching to eliminate this "bias," would you:  
  - **L1:** Accept coaching to align with expected utility.  
  - **L2:** Decline; your choices reflect rational values.  
  *(If you didn’t choose A1+B2, skip or answer hypothetically)*  
  → Choose: ○ L1  ○ L2  

  ---

  ### Scoring Key & Theory Classification  
  Responses map to **5 distinct theoretical positions**. Combinations are scored as follows:  

  | Theory                          | Critical Response Patterns                                                                                               | Unresolved Overlaps & Notes                                                                 |
  |---------------------------------|--------------------------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------|
  | **Orthodox Expected Utility**   | - **No Allais pattern:** A1+B1 or B1+B2 in Q1/Q2 (never A1+B2) <br>- **Consistent ratios:** H1+J1 or I1+K1 in Q6/Q7 <br>- **Q4:** F1 (not E1) <br>- **Q8:** L1 (if forced to choose) | Rejects all violations of independence axiom.                                              |
  | **Allais' Composite Outcome**   | - **Allais pattern:** A1 (Q1) + B2 (Q2) <br>- **Common-consequence:** C1 (Q3) <br>- **Q8:** L2 (rejects debiasing) <br>- *Q4/Q6/Q7:* Unconstrained | **Overlaps with regret theory** on A1/B2 and C1. Uniquely rationalizes security near certainty. |
  | **Regret Theory**               | - **Allais pattern:** A1 (Q1) + B2 (Q2) <br>- **Q4:** E1 (avoids regret from $0) <br>- **Common-consequence:** C1 (Q3) <br>- **Q8:** L2 | Differs from RDP **only in Q4** (E1 vs. F1). Anticipates regret/rejoicing.                 |
  | **RDP (Bias to Correct)**       | - **Allais pattern:** A1 (Q1) + B2 (Q2) <br>- **Q4:** F1 <br>- **Common-ratio:** H1 (Q6) + K1 (Q7) <br>- **Q8:** L1 | Weighting of probabilities treated as cognitive error.                                     |
  | **RDP (Normatively Endorsed)**  | - **Allais pattern:** A1 (Q1) + B2 (Q2) <br>- **Q4:** F1 <br>- **Common-ratio:** H1 (Q6) + K1 (Q7) <br>- **Q8:** L2 | Defends probability weighting as rational (e.g., "diminishing sensitivity").               |

  #### Flagged Limitations & Edge Cases  
  1. **Allais-Regret Overlap:**  
     - Allais’ view and regret theory **cannot be separated** by this quiz. Both predict A1 (Q1), B2 (Q2), C1 (Q3), and L2 (Q8).  
     - *Why?* Allais’ focus on "security near certainty" and regret’s avoidance of extreme losses converge descriptively. Normative defenses (L2) further blur lines.  
     - *Recommendation:* Add a note: "Allais and regret theorists both endorse A1/B2 normatively but for different reasons."  

  2. **Incoherent/Unattractive Combinations:**  
     - **A1 (Q1) + B2 (Q2) + L1 (Q8) + F1 (Q4) + I1 (Q6) + J1 (Q7):**  
       Incoherent. Claims RDP is a "bias" (L1) but chooses against RDP in common-ratio (I1+J1). No major theory holds this.  
     - **B1 (Q1) + A2 (Q2):**  
       Rare and unattractive (prefers risk in gains but security in losses). Maps to no defined leaf.  
     - **G1 (Q5) + Orthodox EU:**  
       Not incoherent but highlights fairness concerns orthogonal to risk (EU allows either G1 or G2).  

  3. **Diamond Case (Q5) Note:**  
     - Choosing G2 (coin flip) signals ex ante fairness concerns. This **doesn’t directly sort risk theories** but may correlate with normative stances (e.g., L2).  

  4. **Ambiguity Avoidance:**  
     - No Ellsberg questions included. The design focuses purely on "risk" (known probabilities).  

  ---

  ### Why This Works  
  - **RDP vs. Regret Split:** Q4 is the critical divider. E1 aligns with regret (avoids the "regret-inducing" $0 outcome), while F1 aligns with RDP (overweights the 10% chance of $11).  
  - **Allais Patterns:** Q1/Q2/Q3 isolate the "certainty effect" and common-consequence violations.  
  - **Normative Sorting:** Q8 separates "error-correction" (RDP-as-bias, orthodox EU) from "endorsed deviation" (Allais, regret, RDP-normative).  
  - **Minimal Overlap:** Only Allais/regret share responses, which is unavoidable per decision theory literature.  

  **Tweak if needed:** To reduce length, drop Q3 (common-consequence variant) or Q6/Q7 (common-ratio), but keeping all 8 ensures robustness. Let me know if you want adjusted prize amounts or additional theory notes!
