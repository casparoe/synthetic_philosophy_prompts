              = 50 - 0.5*R(55) + 22.5 = 72.5 - 0.5*R(55)
     For Q: 0.5*(45+R(55)) + 0.5*45 = 0.5*45 + 0.5*R(55) + 22.5 = 45 + 0.5*R(55)

     Then P - Q = (72.5 - 0.5*R(55)) - (45 + 0.5*R(55)) = 72.5 - 45 - R(55) = 27.5 - R(55)

     Since R(55)>0, if R(55) is large enough (greater than 27.5), then Q is preferred. But note that in the typical regret function, R(55) is less than 27.5 (because R is in utility units, and 55 is the difference, so R(55) might be around 55 or less). 

     Therefore, in Choice 2, a regret-averse person might still prefer P if R(55) < 27.5, which is likely. But we want a pattern that is different from RDP. In RDP we had Y in Choice 1 and P in Choice 2. In regret theory, we have Y in Choice 1 and P in Choice 2 as well? 

