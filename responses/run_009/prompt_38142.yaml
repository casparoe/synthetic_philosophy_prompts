     Now for regret theory: 
        In Choice 1, if you choose X and get $0, you regret not having $45 (regret of 45). If you choose Y and get $45, and it turns out X would have given $100, then you regret 55 (100-45). But regret theory models the utility as modified by regret. The typical utility function in regret theory is: 
            U(choice) = expected value of [ u(outcome) - R(u(outcome) - u(outcome of the forgone option in that state) ]
        However, we have to consider the joint states. 

     Actually, in the typical pairwise choice, we consider the state-wise comparison. For Choice 1, the two states (with equal probability) are:
        State 1: if we get the good outcome for X, then X gives $100, Y gives $45 -> so choosing X: u(100) - R(u(100)-u(45)) = 100 - R(55)
