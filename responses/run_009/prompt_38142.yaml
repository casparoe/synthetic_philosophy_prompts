          = 0.5*45 + 0.5*45 - 0.5*R(-55) - 0.5*R(45)
          = 45 - 0.5*(-R(55)) - 0.5*R(45)
          = 45 + 0.5*R(55) - 0.5*R(45)

     Now, if R is increasing and convex, R(55)>R(45). So the difference between the two:
          X: 50 - 0.5*R(55) + 0.5*R(45)
          Y: 45 + 0.5*R(55) - 0.5*R(45)

     Then X - Y = [50 - 45] + [-0.5*R(55) + 0.5*R(45) - 0.5*R(55) + 0.5*R(45)] 
                = 5 - [R(55) - R(45)]

     Since R(55) - R(45) >0, if this difference is greater than 5, then Y is preferred. But note that R(55)-R(45) is positive and we subtract it. So if R(55)-R(45) is large enough (greater than 5), then X-Y becomes negative -> Y is preferred.

     Now for Choice 2:
        P: 50% chance of $100, 50% chance of $45
        Q: 100% chance of $45

     The states are the same (two equally likely states). In state 1 (good state for the risky option):
          P: 100, Q:45 -> choosing P: 100 - R(100-45)=100-R(55)
                       choosing Q: 45 - R(45-100)=45-R(-55)=45+R(55)   [if symmetric, R(-55)=-R(55)]
     In state 2 (bad state for the risky option):
          P: 45, Q:45 -> choosing P: 45 - R(0) = 45
                       choosing Q: 45 - R(0) = 45

