prompt: |-
  I teach a continuing-ed evening class, mostly retirees and a few curious younger folk, and next week's session is on what philosophers call the special composition question — when do several things add up to one further thing, rather than just being a pile of parts? Van Inwagen's answer, that the only composite objects are living things, makes for a good fight, but I don't want to get to his answer until the question itself has landed. So don't give me the philosophy worked out — plan the session for me. It's ninety minutes with a whiteboard. What has to come first, what depends on what, and which example should carry the whole thing. My current idea for the carrier is a starling murmuration: it moves like one organism, the birds respond to each other, but nobody thinks the murmuration is a single thing the way a dog is — though I'm honestly not sure that example helps or just muddies it, so tell me what a good carrying example here has to have and what it must not have, and whether murmuration qualifies. The misconceptions I should expect and where exactly in the sequence to head each one off — I'm guessing the big ones will be "if they're glued or stuck together it's one thing" and "this is really just a question about how we use the word 'object'", but I'm sure there are others, especially around what the nihilist and the universalist are actually claiming. Then: how I'll know by the end whether they've got the question rather than just my answer to it, and what I should openly refuse to cover at this level — I assume the argument from vagueness is out, but tell me if I'm wrong and what else belongs on the no-go list. Please write it as continuous prose, no headings or bullets, like an email from a colleague who's actually taught this stuff.
reasoning: |-
  Okay, let me think through how to approach this session plan request. The instructor wants to structure a 90-minute continuing-ed class on the special composition question, focusing on making the question itself land before introducing Van Inwagen's answer. 

  First, I need to consider the audience - retirees and curious younger folks in an evening class. This means keeping concepts concrete and avoiding jargon. The murmuration example is interesting but might be too complex as an opener since it involves collective behavior. A simpler starting point could work better.

  For the flow, I imagine building from mundane examples upward: starting with obvious composites (chairs), moving to ambiguous cases (piles of sand), then to active systems (murmurations). This progression helps students feel the puzzle develop naturally. The key is making them genuinely puzzled before offering any philosophical answers.

  Regarding misconceptions, I anticipate several: the "glue fallacy" (that physical connection determines unity), the linguistic reduction fallacy (that it's just about word usage), and confusion about what nihilism/universalism actually claim. Each needs specific counter-examples placed strategically - like a dismantled chair still being "a chair" in parts to challenge the glue idea.

  The murmuration works well later in the session because it has that beautiful tension between apparent unity and individual components. But it shouldn't be the first example - better to use it after establishing the core puzzle with simpler cases. What makes it strong is how it challenges intuitions: if movement patterns create unity, why isn't it an organism?

  To check understanding, I'd listen for students reformulating the question in their own words and applying it to new examples. They should be debating not just what composites exist, but what criteria matter for composition. 

  Definitely avoid the argument from vagueness - too technical. Also skip mereological sums and four-dimensionalism for now. The goal is the "aha" moment of seeing why composition isn't obvious, not advanced metaphysics.

  The real teaching challenge will be resisting the urge to resolve the tension. The session succeeds if they leave arguing about whether a murmuration is one thing or many, not if they agree on an answer. That discomfort is the philosophical spark.
answer: |-
  Right, this is one of those gloriously messy topics that gets people arguing before they even realise *why* they're arguing. Forget the murmuration for the opener – it's dynamite, but you need to lay the fuse first. Save it for the crescendo. Here’s how I’d run the 90 minutes, like we’re chatting over coffee after class:

  **First 20-25 mins: Grounding the Puzzle (The "Huh?" Phase)**
  Start brutally simple. Draw a crude chair on the board. "One thing, right?" Nods all round. Take it apart leg by leg, seat, backrest. Lay the pieces out. "Now? Still one thing? Or just a pile of parts?" *That's* your entry point. The shift is tangible. They'll argue – some say "it's still *a* chair, just disassembled," others "no, it's just wood now." **Don't resolve it.** Let the disagreement hang. This is the seed. Then, escalate: A pile of sand. One grain? Clearly not a heap. Add grains... when does it *become* a heap? Watch the discomfort. Point out: We *use* "heap," but is there a real *thing* there beyond the grains? Contrast with the disassembled chair – why do we feel more strongly it's still "a chair" than the pile of sand is "a heap"? You're not teaching answers; you're making them feel the itch Van Inwagen scratches. **Key:** Keep it concrete. Avoid words like "composite," "mereology," or "entity." Use "thing," "object," "whole," "pile," "collection."

  **Next 25-30 mins: Probing Intuitions & The Glue Trap (The "But Surely..." Phase)**
  This is where misconceptions bloom. First, the **Glue Fallacy:** Someone *will* say, "If you glue the chair parts together, *then* it's one thing!" Perfect. Draw a brick. "One thing?" Yes. Draw another identical brick. "Two things?" Yes. Now glue them together. "One thing or two?" Some say one, some stubbornly say two. Press: *Why* does glue change it? Is superglue metaphysically significant? What if it's weak glue? What if they're just touching? Introduce a jigsaw puzzle – assembled vs. in the box. Is the assembled puzzle "one thing"? More consensus, maybe, but *why*? Is it the interlocking? The picture? This exposes their implicit criteria (connection, function, appearance). Then, hit them with **Word Magic:** "Isn't this *just* about how we use words like 'chair' or 'heap'?" Acknowledge it feels that way. But push: Is the *reality* different? If there were no humans, would the *sand grains themselves* constitute a single heap-object at some point, or just be grains? If language *reflects* reality, what reality is it reflecting here? This is crucial – you're distinguishing linguistic convention from the presumed underlying metaphysical fact (or lack thereof). **Head off here:** Explicitly say, "We're not just arguing about definitions. We're asking: Does the universe *contain* a single object made of these parts, *regardless* of what we call it?"

  **Enter the Murmuration (The "Whoa... Wait..." Moment - ~15 mins)**
  *Now* unleash the starlings. Describe it vividly: thousands of birds, swirling as one fluid shape, reacting instantly to each other and predators, a breathtaking whole. Show a short video clip if possible (under 2 mins – find a good one!). Ask: "Is *that* a single thing? Like a giant sky-creature? Or is it just thousands of birds doing their bird-thing?" Let the arguments fly. **Why it works here:** It has the *appearance* and *dynamic unity* of a single organism (like your dog), but they *know* it's individual birds. It forces them to confront: What does the dog have that the murmuration lacks? Life? Internal binding? Purpose? It brilliantly challenges the intuitions formed earlier. Glue? No glue. Words? We might *call* it "a murmuration," but does that *make* it one thing? It perfectly sets up Van Inwagen: It *looks* like a composite object should, but he'd say it's *not* (because not alive), while intuitively, it feels more "object-like" than a glued brick or a pile of sand ever did. **What it must have/avoid:** It MUST have apparent unity/coordination without physical bonding. It MUST avoid being a clear biological organism. It MUST feel ambiguous. Murmuration nails this. Avoid examples like armies or orchestras initially – too much human intention muddies the purely metaphysical water.

  **Introducing the Extremes & Van Inwagen's Hook (The "So What's the Answer?!" Tease - ~15 mins)**
  With the murmuration debate hot, frame the philosophical landscape simply:
  1.  **The Nihilist (The Radical):** "Maybe only the tiny fundamental bits *really* exist? Chairs, heaps, murmurations? Just convenient labels for arrangements of atoms. No composite objects at all!" (Their jaws might drop). Ask: "Can you live with that? What about *you* – are *you* just atoms arranged person-wise?"
  2.  **The Universalist (The Packrat):** "Opposite! *Any* collection of things, anywhere, anytime, is automatically a single object! The 'thing' made of my left shoe, the Eiffel Tower, and Alpha Centauri *right now* is just as real as this chair." (Expect nervous laughter, disbelief). Ask: "Is this satisfying? What problem does it solve?"
  3.  **Van Inwagen (The Lifeboat):** "Both extremes seem crazy? Maybe there's a sensible middle. He says the *only* time parts compose a whole is when their activity constitutes a *life*. So: A dog? Yes. A chair? No. A pile of sand? No. A starling murmuration? ...No." (Pause). "He thinks *life* is the special glue."

  **Wrap-up & Knowing They Got It (Last 5-10 mins)**
  Don't resolve Van Inwagen. End with the *question* ringing. Ask: "So, by the end of next week, Peter will argue that only living things are true composite objects. But *before* we hear why he thinks that... what is the *question* we're even trying to answer? In your own words, to your neighbour, what's the puzzle we've been wrestling with?" Listen in. **You'll know they got the *question* if:**
  *   They articulate the core puzzle: "When do many things become one new thing?" or some variant.
  *   They use *examples* (chairs, heaps, murmurations) to illustrate the ambiguity.
  *   They distinguish it from just being about words or human convenience.
  *   They understand Nihilism and Universalism aren't *linguistic* claims but claims about *what exists* ("Nihilists think chairs literally don't exist as objects!").
  *   They see Van Inwagen's answer as a *possible* solution to *this* specific problem.

  **The NO-GO List (Firmly):**
  1.  **The Argument from Vagueness:** Absolutely out. Way too technical, requires understanding sorites paradoxes deeply. It will derail everything into logic, not metaphysics.
  2.  **Mereological Sums/Classical Extensional Mereology:** Don't introduce the formal system. Talking about "the sum of X and Y" as a *default* is Universalism, which you've already introduced simply. No need for the formalism.
  3.  **Four-Dimensionalism/Perdurance:** Introducing temporal parts is a whole other massive can of worms. Keep it synchronic (at a single time) for now. The murmuration is moving, but focus on "is it one thing *now*?".
  4.  **Detailed Critiques of Van Inwagen (yet):** Next week's job! Today is just setting up *his* answer as a response to *this* question.
  5.  **Advanced Physics (Quantum Indeterminacy, etc.):** Tempting, but it's overkill. Stick to macro-level, everyday (or bird-level) objects.

  **Why this sequence?** It starts where they live (chairs, heaps), makes the problem visceral, exposes their own assumptions (glue, words), uses a powerful ambiguous case (murmuration) to deepen the puzzle, then maps the extreme philosophical responses *to that puzzle*, before finally positioning Van Inwagen as a live contender for *next time*. The murmur isn't the opener; it's the payoff for feeling the puzzle deeply first. They leave confused, arguing, and desperate to hear what Van Inwagen has to say next week. Perfect.

  Good luck! Expect someone to mutter "It's just semantics..." on the way out. Smile. You've done your job – they're arguing about the *metaphysics*, even if they call it semantics. Next week, Van Inwagen gives them a hammer.  
     
   Let me know how the starlings land!  
     
   — Your Metaphysically Inclined Colleague
