  However, in this symmetric universe, there is no qualitative way to distinguish the spheres individually; we can only say there are two, but not which is which. So the principle of identity of indiscernibles is satisfied for weak discernibility: they are discerned by the relation, but not uniquely identifiable.

  The principle doesn't require unique identifiability, just that if indiscernible, then identical. Here, they are discernible via the relation, so not identical.

  What both missed: I think they missed discussing whether the spheres have haecceities or primitive identities. Black's example is often used to argue for such non-qualitative properties. Also, in quantum mechanics, there are cases of indistinguishable particles that are weakly discernible via relations.

  Another point: the total qualitative character includes the relational structure, which in this case, with the distance relation, necessitates two relata.

