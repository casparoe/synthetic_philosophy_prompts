  Also, in modern metaphysics, there's the idea of weak discernibility. Theo might be appealing to that. Weak discernibility means that objects are discerned by a relation that they bear to each other but not to themselves, like the distance relation.

  For example, A and B are such that A is distinct from B because R(A,B) and not R(A,A), and similarly for B. So they are discerned relationally.

  This doesn't require presupposing distinctness; the relation defines the distinctness.

  In logic, with the relation "is two miles from," which is irreflexive and symmetric, we can infer there are at least two things.

