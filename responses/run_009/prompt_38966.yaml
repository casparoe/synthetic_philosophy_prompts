prompt: |-
  You are a senior political philosopher with experience supervising dissertations in democratic theory and constitutionalism, and you have sat on fellowship selection committees, so you know what makes a proposal fundable and what makes it sound merely clever. Think carefully before drafting, and begin with a brief brainstorm of alternative framings before committing to one — but your final output should be a polished two-page proposal.

  I'm applying for a nine-month dissertation fellowship. My half-formed idea concerns the analogy between Ulysses' contract and constitutional precommitment: political theorists routinely justify entrenched rights and hard-to-amend constitutional provisions by analogy to Ulysses ordering himself bound to the mast before the Sirens. But the analogy hides a structural difference I want to press. Ulysses outsources enforcement: his crew, ears plugged with wax, do not share the preference he anticipates in himself, so his precommitment works through an external enforcer with stable interests. A constitution has no such enforcer — the institutions that interpret and uphold it are staffed and sustained by the very successors whose preferences it is supposed to constrain. Constitutional precommitment must therefore be self-enforcing in a way Ulyssean precommitment is not, and I suspect that once this is taken seriously, the justification of entrenchment either fails outright or quietly transforms into something else: perhaps a coordination device, or the reproduction of a settled second-order preference across generations rather than its imposition on them.

  Turn this into a fellowship proposal containing: a precise statement of the research question; an account of why the existing debate leaves it open (that debate mostly argues about the legitimacy of the dead hand — whether one generation may justly bind another — rather than about the mechanism by which binding is even possible); the method, including a taxonomy of enforcement mechanisms I would develop (external enforcement, internalized second-order preferences, coordination) and the sorts of constitutional devices — entrenchment clauses, emergency powers provisions, fiscal rules — I would use as test cases for the taxonomy; a statement of what would count as a finding, and what would count as the project failing, for instance if the taxonomy turns out to describe one mechanism three ways; and an honest assessment of whether nine months is enough, including what you would cut first. No bibliography or literature review by citation — refer to positions and arguments as needed and I'll fill in the references myself.
