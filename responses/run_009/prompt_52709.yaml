  The key might be distinguishing between tools that extend cognitive functions versus those that assist. Extended mind theory (Clark and Chalmers) suggests that external resources can be part of cognition if they're constantly available, automatically consulted, easily accessible, and endorsed. The daybook fits perfectly. The GPS might fit, but the user's intuition says no. Why? Maybe because navigation isn't seen as a core cognitive function like memory. But that's inconsistent. 

