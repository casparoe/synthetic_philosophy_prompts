answer: |-
  After analyzing your cases and the underlying philosophical challenge, I propose a refined principle that captures your core intuitions while addressing the counterexamples. Your partner's criterion is fundamentally sound but requires two critical upgrades: **functional isomorphism** (matching internal cognitive processes) and **truth-conduciveness** (reliably yielding accurate outputs). Here's the integrated principle:

  **An external resource becomes part of your mind if and only if:**
  1. **It is functionally isomorphic** to an internal cognitive process (e.g., memory storage/retrieval, factual recall),  
  2. **It is seamlessly integrated** into your cognitive workflow (constant access + automatic consultation),  
  3. **You trust its outputs without verification** (endorsement), *and*  
  4. **It is truth-conducive** (reliably produces correct results under normal conditions).

  ---

  ### **How This Principle Matches Your Verdicts**
  1. **Neighbor's daybook**  
     - ✅ *Functional isomorphism*: Replaces biological memory (same input/output function).  
     - ✅ *Seamless integration*: Constant access, consulted automatically like recalling a memory.  
     - ✅ *Trust/endorsement*: Relied on without cross-checking.  
     - ✅ *Truth-conduciveness*: Entries are self-verified (she records accurate personal data).  
     → **Part of her mind** (matches your verdict).

  2. **Husband's GPS**  
     - ❌ *Functional isomorphism*: Navigation is a *skill* (spatial reasoning, decision-making), not isomorphic to memory retrieval. GPS provides turn-by-turn instructions, not stored knowledge.  
     - ✅ *Seamless integration*: Constantly available, consulted automatically.  
     - ✅ *Trust/endorsement*: Relied on without verification.  
     - ✅ *Truth-conduciveness*: Generally reliable (when maps are updated).  
     → **Not part of his mind** (matches your verdict).  
     *Key distinction: GPS is a tool for action-guidance, not cognitive extension.*

  3. **Colleague's annotated index**  
     - ✅ *Functional isomorphism*: Replaces semantic/organizational memory (cataloging concepts).  
     - ✅ *Seamless integration*: Integral to writing workflow, consulted habitually.  
     - ✅ *Trust/endorsement*: Outputs endorsed as his own knowledge.  
     - ✅ *Truth-conduciveness*: Self-curated → accuracy tied to his judgment.  
     → **Part of his mind** (resolves your wavering).

  4. **Friend's password manager**  
     - ✅ *Functional isomorphism*: Directly replaces episodic memory (password recall).  
     - ✅ *Seamless integration*: Sole access point, consulted automatically.  
     - ✅ *Trust/endorsement*: Fully relied upon; no recall ability.  
     - ✅ *Truth-conduciveness*: Technologically reliable.  
     → **Part of her memory system** (matches your verdict).

  5. **Scrabble player's anagram app**  
     - ❌ *Functional isomorphism*: Augments problem-solving, not memory. Biological memory *could* retrieve anagrams (with effort); this is cognitive offloading.  
     - ❌ *Seamless integration*: Deliberative use (only between turns), not automatic.  
     → **Not part of his mind** (matches your verdict).

  ---

  ### **Resolving Counterexamples**
  - **Your aunt's horoscope app**:  
    ❌ *Truth-conduciveness*: Horoscopes lack empirical reliability → fails criterion #4.  
    → **Not part of her mind** (fixes your partner's criterion).  

  - **The couple's divided memory**:  
    ✅ *Functional isomorphism*: Shared system replaces joint autobiographical memory.  
    ✅ *Seamless integration*: Automatic reliance ("She knows he keeps dates").  
    ✅ *Trust*: Mutual endorsement without verification.  
    ✅ *Truth-conduciveness*: Family dates are factual/verifiable.  
    → **Their system is part of both minds** (consistent with the principle).  

  - **Language learner's phone dictionary**:  
    ✅ *Functional isomorphism*: Replaces lexical memory retrieval.  
    ✅ *Seamless integration*: Constant access; "gaps" feel like forgotten words.  
    ✅ *Trust*: Relied upon without cross-checking.  
    ✅ *Truth-conduciveness*: Dictionaries are referentially accurate.  
    → **Part of her linguistic cognition** (extends your verdicts consistently).

  ---

  ### **Should You Revise Any Verdict?**
  **Your husband's GPS is the only outlier.** The principle *excludes* it (aligning with your intuition), but if you accept functional isomorphism strictly, navigation *could* be framed as "procedural memory." However:  
  - **Keep your verdict** if you view memory as *declarative* (facts/events) and navigation as *active problem-solving*.  
  - **Revise it** only if you concede all deeply integrated tools extend the mind (sacrificing the daybook/GPS distinction).  
  → **Recommendation**: Stand by your verdict. The GPS’s role is *instructional* (guiding actions) rather than *recollective* (accessing stored knowledge), preserving a philosophically coherent line.

  ---

  ### **Is Your Partner's Criterion Repairable?**  
  Yes, but it needs the two additions above:  
  1. **Functional isomorphism** (to exclude tools like GPS/Scrabble app that augment non-memory processes).  
  2. **Truth-conduciveness** (to exclude horoscopes/pseudoscience).  
  → **Repaired criterion**: *"An external resource becomes part of your mind when it (1) performs the same function as a biological cognitive process, (2) is reliably available and consulted automatically, (3) is endorsed without verification, and (4) reliably produces true outputs."*  

  This satisfies all your cases except the GPS (which is correctly excluded by #1) and the couple (covered by #1 and #4). **No ad hoc clauses needed.**

  ---

  ### **The Bottom Line**  
  Your intuitions align with **active externalism** (Clark & Chalmers' "Extended Mind" thesis), but with a critical constraint: tools must *replicate internal cognitive functions truthfully*. The daybook, password manager, and language learner's dictionary become "mental fixtures" because they *are* your memory in practice. The GPS, Scrabble app, and horoscope remain tools because they either augment non-memory functions or lack truth-conduciveness. The couple’s memory system passes seamlessly, revealing minds can extend into social space. If you accept this, your verdicts hold without inconsistency.
