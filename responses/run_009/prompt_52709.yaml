  First, I need to understand the core issue: the user wants a precise principle that aligns with their intuitions across all cases. They're also open to adjusting their judgments if needed. The deeper need here might be seeking clarity in a fuzzy philosophical debate, possibly to resolve personal or academic confusion. They value consistency but are wary of ad hoc fixes.

