prompt: |-
  My cousin's the family's amateur philosopher, and lately she's been handing down verdicts about moral status that all seem to run through brains. So far her record: a guy who had a whole hemisphere removed as a child has full human status; a sperm whale, brain like five times ours, still ranks below any human; chimps rank above dogs but bellow humans; Neanderthals would have counted fully, even though their brains were a bit bigger than ours on average; and elephants come out above pigs. Next month our book club takes up three new cases and I want to predict what she'll say: a bottlenose dolphin (brain bigger than a chimp's, and proportionally large for its body too), a gorilla (bigger brain than a chimp in absolute terms but smallish for its body), and a documented hydrocephalus case, a person with far less brain mass than normal who functions fine, drives, holds down a job. Honestly I care less about the three answers than about what rule she's actually running, because a bunch of different rules fit her track record equally well. Give me exactly five numbered points, a sentence or two each, no intro or conclusion: her likely verdict on the dolphin, on the gorilla, and on the hydrocephalus guy, then your best guess at the rule she's implicitly using and why you prefer it over the rivals, and finally one further case that would cleanly divide the candidate rules.
reasoning: |-
  Okay, the user's cousin has this whole system for judging moral status based on brains, and the user wants to predict her verdicts on three new cases. Let me start by listing her past judgments: humans with hemispherectomy and Neanderthals get full status, sperm whales below humans, chimps above dogs but below humans, elephants above pigs. 

  First, I need to figure out the pattern. The cousin seems to prioritize humans regardless of brain size—like the hemispherectomy case and Neanderthals. Sperm whales have huge brains but are ranked lower, so absolute size isn't the key. Chimps over dogs but below humans suggests cognitive complexity might be a factor, but then why are whales below humans? Maybe she's using a human-specific benchmark. 

  Looking at the new cases: bottlenose dolphin has a big brain, larger than chimps. But since sperm whales were ranked low despite their size, dolphin might be similar. So probably below humans. Gorilla has a bigger brain than a chimp but smaller relative to body size. Chimps are below humans, so gorilla likely same. Hydrocephalus case is human, functioning normally. Past cases like hemispherectomy suggest humans get full status regardless of brain mass. 

  The rule could be that humans are always full status, and non-humans are judged by brain size relative to body or cognitive traits. But why elephants over pigs? Maybe encephalization quotient (EQ). Dolphins have high EQ, but sperm whales don't, which fits them being lower. But the cousin put sperm whales below humans, so EQ might not be the main factor. Another idea: she might be using a threshold where any human automatically qualifies, and non-humans need to meet certain cognitive criteria, but not surpassing humans. 

  Rival rules could be absolute brain size, but hemispherectomy and hydrocephalus cases contradict that. Brain-to-body ratio? Sperm whales have a lower ratio, so that fits them being lower. Dolphins have high ratios, so why would they be below humans? Maybe the rule is human exceptionalism: humans always top, then other species based on proximity to human cognition. Chimps and elephants are closer cognitively than dogs or pigs. 

  A test case: an AI with human-like cognition but non-biological. If she rejects it, she's likely species-based. If accepted, maybe cognitive capabilities alone. Another test could be a human with severe cognitive impairment. If she still grants full status, that reinforces the human-exceptionalism rule. 

  So for the hydrocephalus case, she'll say full status because human. Dolphin and gorilla below humans. The preferred rule is species membership as primary, then cognitive traits for non-humans. Why? Because all humans in her past judgments get full status regardless of brain mass, while non-humans are ranked based on relative cognition without surpassing humans.
answer: |-
  Here are the five numbered points as requested:

  1.  **Dolphin:** Likely ranks **below humans** but **above dogs** (similar to chimps/elephants). Its large brain and cognition are acknowledged, but not sufficient for full human status, aligning with the sperm whale precedent where sheer size didn't elevate status.
  2.  **Gorilla:** Likely ranks **below humans** but **above dogs** (comparable to chimps). Despite a larger absolute brain than a chimp, its lower encephalization quotient (brain-to-body ratio) relative to humans and the established chimp precedent suggest it remains in the "high non-human" tier.
  3.  **Hydrocephalus Case:** Unquestionably has **full human status**. Functioning normally despite reduced brain mass directly parallels the hemispherectomy case, reinforcing that intact *human* identity/function overrides brain volume metrics.
  4.  **Implicit Rule:** **Species membership is primary for full moral status; non-humans are ranked by cognitive complexity relative to humans (likely incorporating encephalization quotient and behavioral proxies), but never equal or superior.** This is preferred because it cleanly explains the absolute human/Neanderthal inclusion (species) and the relative non-human rankings (EQ/cognition: elephants>pigs, chimps>dogs, sperm whale below human despite size). Rival rules (e.g., pure brain size, pure EQ) fail on cases like the hemispherectomy/hydrocephalus humans or the sperm whale.
  5.  **Test Case:** An **advanced AI demonstrating human-equivalent (or superior) cognition and consciousness, but lacking biological basis.** Does it get full status? The species rule says no; a cognition-only rule might say yes, cleanly dividing the interpretations.
