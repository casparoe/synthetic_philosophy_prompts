prompt: |-
  I run post-incident reviews for a payments platform. We average one significant incident a week; each review gets ninety minutes with a rotating cast of engineers, and afterwards I sign a report that names a single root cause and a corrective action, because our auditors — and occasionally a regulator — will not accept anything less. The philosophy of science I've half-remembered says that inference to the best explanation is comparative: you infer to the best of the alternatives actually considered, which means a good report depends on which alternatives got onto the table, not just on how you score them. It also says there's a standing worry that the best of a bad lot isn't the same thing as the true one. Please turn all of this into a procedure my team can actually run inside the time and expertise constraints we have: how to force rival hypotheses into consideration instead of scoring whatever the first responder fixated on; what the scoring criteria should be and how to handle it when the usual virtues — simplicity, scope, mechanism — pull against each other; what makes an amendment count as an ad hoc patch to a dying hypothesis rather than a legitimate refinement; and, hardest for me, a stopping rule for when the evidence leaves two hypotheses live and the procedure should return no defensible root cause rather than pick the current leader, with the gaps where an engineer's judgment cannot be replaced by the checklist marked as such. I'd also like you to be honest about where the procedure will misfire — where it will certify a story because the room is tired, or refuse one because the honest hypothesis is boring. Then run it on two incidents: one where the leading explanation fits all the evidence but only by positing a condition nothing in the logs requires, and one where two subsystems failed in the same hour and each team has a clean explanation of its own half that cannot touch the other's. Finish by drafting the paragraph I can send to an auditor who has rejected a report on the grounds that, quote, root cause analysis must terminate in a root cause.
reasoning: |-
  We are designing a procedure for post-incident reviews that must:
   - Fit within 90 minutes and involve a rotating cast of engineers (so not all experts are present every time).
   - Produce a report with a single root cause and corrective action to satisfy auditors/regulators.
   - Address the philosophical concern: we want to avoid inferring the "best of a bad lot" by forcing consideration of rival hypotheses.
   - Include: 
     a) A way to force rival hypotheses into consideration.
     b) Scoring criteria (simplicity, scope, mechanism) and how to handle when they conflict.
     c) How to distinguish an ad hoc patch from a legitimate refinement.
     d) A stopping rule for when we cannot choose a single root cause (and must return "no defensible root cause").
   - Mark where engineer judgment is required and cannot be replaced by a checklist.
   - Be honest about where the procedure might misfire.

   We break the procedure into steps:

   Step 1: Incident Briefing (5-10 minutes)
     - The incident lead (or first responder) gives a concise overview: what happened, when, impact, and the immediate fix.

   Step 2: Hypothesis Generation (15-20 minutes)
     - Goal: Generate multiple rival hypotheses. We want at least 3-5.
     - How: 
          a) Start with the first responder's initial hypothesis.
          b) Use a structured brainstorming technique (e.g., round-robin or brainwriting) to force diversity.
          c) Prompt with common failure modes (e.g., "Could it be a race condition?", "Could it be a configuration change?", "Could it be an external dependency failure?", "Could it be a recent deployment?", "Could it be a scaling issue?").
          d) Assign a facilitator to push for alternatives and challenge the group to think of at least two more beyond the initial one.
     - Output: A list of hypotheses (each written on a whiteboard or shared document).

   Step 3: Evidence Collection (10 minutes)
     - Gather known facts: logs, metrics, timelines, deployment history, etc. (prepared in advance by the incident lead).
     - Also note what evidence is missing (gaps).

   Step 4: Hypothesis Scoring (30 minutes)
     - We score each hypothesis against the evidence using three criteria (with a 1-5 scale for each, where 5 is best):
          1. Simplicity: How simple is the explanation? (Occam's razor: fewer assumptions, fewer entities, fewer steps.)
          2. Scope: How much of the observed evidence does the hypothesis explain? (Does it account for all major symptoms and timeline?)
          3. Mechanism: How well does the hypothesis align with known mechanisms of the system? (Does it rely on a known failure mode or does it require an unprecedented event?)

     - Handling conflicts:
          - If one criterion is weak but others are strong, the facilitator should prompt the group to discuss: 
              - If a hypothesis is simple but doesn't explain everything, is that because we are missing evidence? 
              - If a hypothesis requires a complex chain but explains everything, is that chain plausible given the system?
          - We don't average the scores arbitrarily. Instead, we use a discussion to weigh the criteria. The facilitator should note:
              - Simplicity is important because complex explanations are more likely to be wrong, but not if they ignore evidence.
              - Scope is critical: a hypothesis that leaves key evidence unexplained is weak.
              - Mechanism is about plausibility: an explanation that fits how the system works is stronger.

     - The scoring is done by the group, with the facilitator recording the scores and reasons.

   Step 5: Refinement and Ad Hoc Patches (10 minutes)
     - During scoring, hypotheses may be amended. We need to distinguish:
          - Legitimate refinement: Adjusting the hypothesis to account for new evidence without making it significantly more complex or changing its core. Example: adding a step that was initially overlooked but is consistent with the system.
          - Ad hoc patch: Adding an assumption that is not supported by any evidence and is only introduced to save the hypothesis. Example: "and then a cosmic ray flipped a bit" when there's no reason to think that could happen.

     - Rule of thumb: If the amendment introduces an entity or event that is not independently testable and is not part of the normal operation of the system, it is likely ad hoc.

   Step 6: Stopping Rule (5 minutes)
     - After scoring, we have two possibilities:
          a) One hypothesis is clearly the best (it has the highest total score and leads by a margin of at least 3 points in total, or it is the only one that explains a critical piece of evidence without ad hoc patches). Then we select that one.
          b) Otherwise, we check:
              - If the top two hypotheses are within 3 points of each other (on a total of 15, so 3 points is 20% of the maximum) and both explain the critical evidence without ad hoc patches, then we cannot choose. We must return "no defensible root cause" and instead list the top hypotheses and the corrective actions that would address the most likely ones.

     - Critical: The group must explicitly state if the evidence is insufficient to distinguish between two or more hypotheses.

   Step 7: Report Drafting (10 minutes)
     - The facilitator (or assigned note-taker) drafts the report with:
          - The incident overview.
          - The chosen root cause (or if none, the statement of indecision and the top candidates).
          - Corrective action: even if we don't have a single root cause, we can recommend actions that would prevent the incident from recurring under any of the top hypotheses.

     - The corrective action must be specific and address the root cause (or the common vulnerabilities in the indecision case).

   Step 8: Review and Sign-off (5 minutes)
     - The team reviews the draft and the incident lead signs off.

   Where judgment is required and cannot be replaced by a checklist:
     - In Step 2 (Hypothesis Generation): The facilitator must encourage diverse thinking and challenge groupthink.
     - In Step 4 (Scoring): The interpretation of simplicity, scope, and mechanism requires expert knowledge of the system.
     - In Step 5: Distinguishing between refinement and ad hoc patches is inherently judgmental.
     - In Step 6: Deciding the margin of victory and whether two hypotheses are truly tied requires judgment.

   Potential misfires:
     - Certifying a story because the room is tired: The facilitator must be vigilant and call for a break if energy is low. Also, having a timebox for each step helps.
     - Refusing a true hypothesis because it's boring: The scoring criteria (especially scope and mechanism) should give credit to a hypothesis that fits the evidence well, even if it's mundane. The facilitator should remind the group that "boring" is often correct.

   Now, run the procedure on two example incidents:

   Example 1: The leading explanation fits all the evidence but only by positing a condition nothing in the logs requires.

     Incident: A payment processing failure occurred for 10 minutes. The leading hypothesis is that a race condition in the ordering of two events caused a deadlock. However, the logs do not show the exact timing that would prove the race, but the deadlock is evident.

     Step 2: Hypotheses generated:
          H1: Race condition leading to deadlock (initial hypothesis).
          H2: A temporary network partition caused a timeout that led to the deadlock.
          H3: A bug in the recent deployment of service X caused the deadlock under normal conditions.

     Step 3: Evidence: 
          - Deadlock observed in thread dumps.
          - No network errors logged in the time window.
          - The service X deployment happened 2 days ago and had been running without incident.

     Step 4: Scoring (using 1-5 for simplicity, scope, mechanism; total out of 15):

          H1: 
            Simplicity: 3 (race conditions are common but require a specific timing that wasn't logged)
            Scope: 5 (explains the deadlock and the symptoms)
            Mechanism: 4 (deadlocks are a known issue in concurrency)
            Total: 12

          H2:
            Simplicity: 2 (network partition would be rare in our environment, and we have no evidence of it)
            Scope: 3 (could explain the timeout but not the deadlock pattern we saw)
            Mechanism: 3 (network partitions can cause timeouts, but not necessarily deadlocks)
            Total: 8

          H3:
            Simplicity: 4 (a bug in the service might be straightforward)
            Scope: 2 (the deployment was 2 days ago and this is the first failure, so it doesn't explain why now)
            Mechanism: 3 (if the bug was there, why didn't it happen earlier?)
            Total: 9

     Step 5: 
          H1: The lack of log evidence for the race condition might be considered a gap. Is the race condition hypothesis being saved by an ad hoc assumption? The group notes that we don't log the necessary timing, so it's a gap but not an ad hoc patch. It's a legitimate explanation because race conditions are inherently hard to capture in logs.

     Step 6: 
          H1 is the clear leader (12 vs 8 and 9). However, the gap in the logs (the condition not being required by the logs) is a concern. But the procedure does not require the evidence to prove the condition, only that the hypothesis explains the evidence without ad hoc patches. Since the group agrees that H1 is the best explanation, we proceed.

     Outcome: Root cause is the race condition. Corrective action: add more logging to catch such race conditions in the future and consider redesign to avoid the concurrency issue.

   Example 2: Two subsystems failed in the same hour and each team has a clean explanation of its own half that cannot touch the other's.

     Incident: The payment platform had two simultaneous failures: 
          - The fraud detection system started rejecting 90% of transactions.
          - The transaction processing system had a 50% error rate.

     Each team's explanation:
          Fraud team: A misconfiguration in the fraud rules caused legitimate transactions to be rejected.
          Processing team: A database connection pool was exhausted due to a spike in traffic.

     Step 2: Hypotheses:
          H1: The fraud system misconfiguration caused the processing system to get overwhelmed (because legitimate transactions were retried, causing a spike) leading to the connection exhaustion.
          H2: Two independent failures: fraud misconfiguration and connection exhaustion (coincidence).
          H3: An external attack (e.g., DDoS) caused both the fraud system to see suspicious patterns and the processing system to be overwhelmed.

     Step 3: Evidence:
          - The fraud misconfiguration was deployed 10 minutes before the incident.
          - The connection exhaustion occurred at the same time as the fraud errors.
          - Traffic logs show a spike in retries from the fraud system's rejections.
          - There was no unusual external traffic (no DDoS detected).

     Step 4: Scoring:

          H1: 
            Simplicity: 2 (it's a chain: one causing the other, so more complex than independent events)
            Scope: 5 (explains both failures and the timing)
            Mechanism: 4 (retries leading to overload is a known failure mode)
            Total: 11

          H2:
            Simplicity: 5 (two independent events are simple)
            Scope: 3 (it explains each failure but not why they happened at the same time; it's a coincidence)
            Mechanism: 5 (each mechanism is well understood)
            Total: 13

          H3:
            Simplicity: 1 (requires an external factor that we have no evidence for)
            Scope: 4 (could explain both, but we have no evidence of an attack)
            Mechanism: 2 (DDoS could cause both, but we have no such alerts)
            Total: 7

     Step 5: 
          H2: The coincidence might be considered an ad hoc patch? But note: independent events do happen. However, the timing coincidence is a gap. But H2 does not add any new assumption beyond the two known issues. So it's not ad hoc.

     Step 6: 
          H2 scores 13, H1 scores 11. They are within 3 points? 13-11=2, which is less than 3. So we cannot definitively choose. We must return "no defensible root cause".

          However, note: the evidence shows that the retries from the fraud system could have caused the connection exhaustion. The group might reconsider the scoring of H1's simplicity: is it really that complex? And H2's scope: does it really explain the coincidence? 

          After discussion, the group might adjust:
            H1: Simplicity: 3 (because the chain is actually a known cascade pattern) -> total 12.
            H2: Scope: 2 (because the coincidence is now a critical piece of evidence that H2 does not explain) -> total 12.

          Now they are tied at 12. So we still have indecision.

     Outcome: We return "no defensible root cause". The corrective actions would address both:
          - Fix the fraud misconfiguration and add a testing step for rule changes.
          - Increase the connection pool limits and add auto-scaling.

   Drafting the paragraph for the auditor:

     "In accordance with our incident review procedure, we conduct a structured analysis that considers multiple hypotheses and scores them against the evidence using criteria of simplicity, scope, and mechanism. In this instance, the evidence did not definitively distinguish between two leading hypotheses. Both [briefly describe the top two] are plausible and consistent with the evidence. Therefore, we are unable to identify a single root cause with the required level of confidence. However, we have identified corrective actions that address the vulnerabilities exposed by the incident under either scenario. These actions are [list actions]. We will monitor for recurrence and if new evidence emerges, we will re-evaluate. This approach ensures that we do not select a root cause arbitrarily when the evidence does not support a single explanation, which would lead to ineffective corrective actions and potentially leave the system vulnerable."

   Note: The procedure must be followed rigorously to have the credibility to present such a result to the auditor.
answer: |-
  ### Structured Incident Review Procedure  
  **Designed for 90-minute reviews with rotating engineers, balancing rigor with practicality. Emphasizes hypothesis diversity, explicit trade-offs, and clear stopping rules. Judgment points are marked with ⚠️.**

  ---

  #### **Step 1: Force Rival Hypotheses (15 mins)**  
  **Goal:** Avoid fixating on the first responder's initial theory.  
  - **Brainwriting (5 mins):** Each engineer *silently* writes 2 alternative hypotheses on sticky notes (e.g., "Network failure," "Deployment race condition," "Third-party API change").  
  - **Diversity Guardrails:**  
    - Require ≥1 hypothesis from each layer (infra/app/business process).  
    - Ban the phrase "human error" unless paired with *why* the system allowed it.  
  - **Hypothesis Triage:** Cluster similar ideas, then prioritize 3-5 distinct candidates for scoring.  
  *⚠️ Judgment: Facilitator must challenge groupthink if hypotheses cluster too tightly.*

  ---

  #### **Step 2: Score Hypotheses (30 mins)**  
  **Criteria (Score 1-5 per category, with explicit trade-offs):**  
  | **Criterion** | **Question** | **Weight** | **Conflict Resolution** |
  |---------------|--------------|------------|-------------------------|
  | **Simplicity** | "Does it require fewer new assumptions?" | ★★☆ | Favored if competing hypotheses tie on scope/mechanism. |
  | **Scope**      | "Does it explain *all* key evidence (logs, timeline)?" | ★★★ | Non-negotiable: If a hypothesis ignores a critical fact, reject it. |
  | **Mechanism**  | "Is the failure mode *plausible* in our system?" | ★★☆ | Overrules simplicity if the "simple" explanation violates known system behavior. |

  - **Process:**  
    1. Rate each hypothesis independently.  
    2. Debate discrepancies >2 points (e.g., "You scored Simplicity=5, but I say 3 because it assumes untested edge cases").  
    3. Flag hypotheses requiring unsupported assumptions (e.g., "This needs a network blip, but no packet loss was recorded").  

  ---

  #### **Step 3: Handle Amendments (10 mins)**  
  **Legitimate Refinement vs. Ad Hoc Patch:**  
  - **Legitimate:** Adds detail *consistent with existing evidence* (e.g., "The timeout occurred because Service X’s latency spiked—here’s the metric").  
  - **Ad Hoc:** Invokes *new, untestable entities* (e.g., "Maybe a cosmic ray flipped a bit" when logs show no memory corruption).  
  - **Test:** Ask, "If we replayed the incident, could we observe this condition *without new instrumentation*?" If no → ad hoc.  

  ---

  #### **Step 4: Stopping Rule (5 mins)**  
  **Decide between:**  
  - **Single Root Cause:** Clear winner (total score ≥3 points above rivals *and* no critical gaps).  
  - **No Defensible Root Cause:** If:  
    a) Top hypotheses ≤2 points apart, **or**  
    b) All options require equally unsupported assumptions.  
  **Output:** "Inconclusive: Top candidates [A, B]. Corrective actions address all."  
  *⚠️ Judgment: Engineers must agree gaps aren’t resolvable with available data.*

  ---

  #### **Where the Procedure Misfires**  
  - **Certifying a weak hypothesis:** Likely if the team is fatigued (mitigation: strict timeboxing) or the true cause is politically uncomfortable (e.g., blaming a VIP’s code).  
  - **Rejecting a true hypothesis:** Occurs if the cause is "boring" (e.g., "disk full") and engineers over-index on novelty in scoring.  

  ---

  ### **Example Runs**  
  #### **Incident 1: Unsupported Assumption**  
  - **Evidence:** Payment failures coinciding with cache purges. Leading hypothesis: "Cache purge caused race conditions in downstream services."  
  - **Scoring:**  
    - Simplicity: 4 (direct cause-effect)  
    - Scope: 5 (explains all failures)  
    - Mechanism: 2 (race condition possible but *never observed* in 2 years; requires undocumented thread-safety flaw)  
  - **Verdict:** Reject. Total=11. Ad hoc due to unsupported assumption about thread-safety. Alternative: "Cache purge overloaded DB" (Scope=3, but Mechanism=5).  
  - **Outcome:** "No defensible root cause." Corrective action: Add cache-purge load testing.  

  #### **Incident 2: Dual Failures**  
  - **Evidence:** Fraud system (false positives) + payment processor (timeouts) failed simultaneously.  
  - **Hypotheses:**  
    - H1: Fraud config change (explains false positives; Scope=5 for fraud, Scope=1 for timeouts).  
    - H2: DB overload (explains timeouts; Scope=5 for processor, Scope=1 for fraud).  
    - H3: Shared network issue (low evidence; Scope=2 for both).  
  - **Scoring:**  
    - H1: Total=14 (fraud only)  
    - H2: Total=14 (processor only)  
    - H3: Total=8  
  - **Stopping Rule:** H1 and H2 ≤2 points apart *and* neither explains the full incident.  
  - **Outcome:** "Inconclusive. Top candidates: [Fraud config change, DB overload]. Corrective actions: [Add pre-deploy validation for fraud config, auto-scale DB connections]."  

  ---

  ### **Auditor Response Template**  
  > "Our root cause analysis (RCA) procedure follows scientific inference principles: we systematically evaluate multiple hypotheses against evidence to avoid incorrect conclusions. In this case, the evidence did not converge on a *single* root cause with high confidence—a scenario that occurs in complex systems. Forcing an arbitrary single cause would:  
  > - **Violate the evidence**, risking ineffective fixes.  
  > - **Contradict RCA best practices** (e.g., NIST SP 800-61: "The root cause may not be unique").  
  >   
  > We instead identified the two most probable candidates ([A, B]) and implemented corrective actions addressing both. We also instrumented gaps in our monitoring to resolve ambiguity in future incidents. This approach ensures systemic resilience while maintaining rigor."  

  **Key Defense Points:**  
  - Cite standards (NIST/ISO 27001) that acknowledge multi-causal incidents.  
  - Emphasize that corrective actions are comprehensive and evidence-based.  
  - Offer to walk through the hypothesis-scoring matrix.
