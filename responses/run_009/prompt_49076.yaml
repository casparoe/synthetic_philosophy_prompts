answer: |-
  ## Joint Statement: Knowledge-How and Knowledge-That Workshop Framework

  **Preamble:** This document represents a shared understanding of core points of agreement, a precise mapping of remaining disagreements, the identification of key cruxes, and proposed empirical tests. It aims to structure productive dialogue, not to resolve the underlying philosophical dispute. We (the Intellectualist and the Rylean) both endorse this framework as a neutral basis for adversarial collaboration.

  ### 1. Points of Agreement

  1.  **Linguistic Data:**
      1.  "Knows how to F" ascriptions grammatically behave like other knowledge-wh ascriptions (e.g., knows where, knows who, knows why) in their embedding properties under questions, infinitival complements ("He learned how to swim"), negation, and factive predicates.
      2.  These ascriptions are typically true only if the subject possesses a capacity to F, at least under normal conditions and absent defeating factors (fatigue, injury, etc.). Simply knowing *that* a way w is a way to F is insufficient if the subject cannot perform F via w.
      3.  The linguistic data alone does not *force* either a purely propositional or a purely dispositional analysis; both accounts offer interpretations of the semantics.

  2.  **Phenomenology & Psychology of Skill:**
      1.  Clear dissociations exist between procedural (how) and declarative (that) knowledge systems, evidenced by neuropsychological deficits (e.g., amnesics learning skills, agnosias affecting recognition but not action), implicit learning paradigms, and expertise studies.
      2.  Expert performance often exhibits a high degree of **automaticity**, characterized by reduced conscious monitoring, increased fluency, speed, and integration, and a reliance on perception-action coupling rather than explicit rule-following.
      3.  The transition from novice to expert typically involves a shift from effortful, declarative, step-by-step control towards more automatic, intuitive, and holistic procedural control ("knowledge compilation").

  3.  **Ryle's Regress Argument:**
      1.  The regress argument successfully demonstrates that if *every* intelligent act *necessarily* required a prior *intellectual* act (e.g., contemplating a proposition) to guide it, an infinite and vicious regress would ensue, rendering intelligent action impossible.
      2.  The regress argument does **not**, by itself, conclusively prove that *no* knowledge-how is ever constituted by propositional knowledge. It primarily targets the idea that intelligent action *always* requires a distinct prior intellectual act of considering a proposition.
      3.  The argument highlights the need for an account of intelligent action that does not rely on an infinite chain of prior intellectual acts.

  ### 2. Disagreements Table

  | Disagreement Area                                                                 | Intellectualist's Statement (I-Acceptable)                                                                                                 | Rylean's Statement (R-Acceptable)                                                                                                                                 |
  | :-------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------ | :---------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Role of "Practical Mode of Presentation" (PoP):**                            | Understanding a way of acting *under a practical mode of presentation* is what distinguishes knowing-how from merely knowing-that *about* that way, and it is this PoP that constitutively links the propositional knowledge to the ability. | Appeals to a "practical mode of presentation" are either explanatorily empty (regressing to the need for a further mode to apply *it*) or merely a relabeling of the ability/disposition itself. |
  | **2. Direction of Explanation:**                                                  | Possessing the relevant propositional knowledge (under the practical PoP) is the fundamental, constitutive basis that explains the possession of the ability. The ability manifests the knowledge. | Possessing the complex of dispositions (the ability) is fundamental. Any propositional knowledge associated with the skill is a description, report, or byproduct of the ability, not its basis. |
  | **3. Centrality of Dissociation Cases:**                                          | Cases like the injured expert (knowledge-that without current ability) and the over-intellectualizing novice (excess knowledge-that hindering ability) are central, demonstrating the distinctness of the knowledge state from the ability and highlighting the role of the practical PoP. | Cases like the chicken-sexer/grammarian (ability without reportable knowledge-that) are central and paradigmatic, demonstrating that the core of knowing-how is the reliable dispositional ability itself, not necessarily accessible propositional knowledge. |
  | **4. Nature of Expert Automaticity:**                                             | Automaticity in experts represents the highly efficient deployment of deeply sedimented, propositionally structured knowledge (under a practical PoP), accessed fluently without conscious access to its propositional content. | Automaticity in experts represents the operation of a highly tuned, non-propositional, dispositional system, where explicit propositional knowledge has become largely irrelevant or even obstructive to performance. |
  | **5. Primary Explanandum:**                                                       | The core phenomenon to explain is the cognitive state *knowledge-how*, understood as a specific kind of propositional attitude. Ability is evidence for, but not identical to, this state. | The core phenomenon to explain is *intelligent ability* – the reliable, flexible, adaptive capacity to perform actions successfully. The concept of "knowledge" applied here is secondary and derivative. |

  ### 3. Cruxes of the Dispute

  1.  **The Semantics-Metaphysics Crux:** Does the linguistic analysis of "knows how" ascriptions (e.g., as involving an embedded question taking an infinitival complement) settle the fundamental metaphysical nature of the *skill* or *ability* itself? Or is the linguistic structure compatible with multiple underlying metaphysical realities?
  2.  **The Automaticity Interpretation Crux:** Does the transition to expert automaticity primarily involve the *disappearance* or *inaccessibility* of underlying propositional knowledge structures, or does it represent the *sedimentation* and *proceduralization* of such structures into highly efficient forms accessed via practical PoPs?
  3.  **The Primacy Crux:** Which direction of explanation is more fundamental: explaining ability in terms of a prior cognitive state (knowledge-that + PoP), or explaining the attribution of knowledge-how in terms of the presence of a reliable ability (disposition complex)?

  ### 4. Test Cases & Predictions

  1.  **Test Case: Implicit Skill Acquisition Under Anesthesia**
      *   **Scenario:** Subjects learn a complex motor sequence task (e.g., serial reaction time task) while under general anesthesia, preventing conscious awareness or declarative encoding. Post-recovery, performance is tested for implicit learning (improved reaction times on the sequence) and explicit knowledge (ability to report or recognize the sequence).
      *   **Crux Addressed:** Semantics-Metaphysics, Primacy, Centrality of Dissociation Cases.
      *   **Intellectualist Prediction:** Significant implicit learning (ability gain) would be surprising and challenging, as it suggests ability acquisition *without* propositional encoding *at all*, even unconsciously. If confirmed, it would require explaining how ability arises without propositional knowledge. The linguistic ascription "knows how" might still apply post-hoc based on ability, but the underlying state wasn't acquired *as* knowledge-that.
      *   **Rylean Prediction:** Significant implicit learning is expected and consistent. It demonstrates ability acquisition fundamentally dissociated from propositional knowledge acquisition. This reinforces the primacy of ability/dispositions and shows cases of ability without (even unconscious) propositional knowledge are central.

  2.  **Test Case: "Expert in the Drawer" (Extended Inactivity)**
      *   **Scenario:** A highly skilled expert (e.g., a pianist, surgeon) is completely prevented from practicing their skill for an extended period (years/decades), though they remain physically capable. They retain full declarative knowledge *about* the skill (techniques, theory, past performances). They are then asked to perform.
      *   **Crux Addressed:** Automaticity Interpretation, Direction of Explanation, Primacy.
      *   **Intellectualist Prediction:** Performance will likely be degraded but recoverable relatively quickly (compared to a total novice). Crucially, the expert's retained propositional knowledge (under a practical PoP) guides the *re-acquisition* of the ability. Degradation is due to procedural components (motor execution, timing) fading, not the loss of the core knowledge state. Automaticity recovery involves reactivating sedimented propositional structures.
      *   **Rylean Prediction:** Performance will be severely impaired, potentially near-novice level initially, despite retained declarative knowledge. The *ability* (the complex of dispositions) has degraded due to disuse. Recovery requires *re-training the dispositions themselves*, not merely re-accessing propositional knowledge. The declarative knowledge might aid in structuring practice, but it is not the ability. This highlights the primacy of the dispositional ability.

  **Regarding Verbal Dispute:**

  Portions of this dispute appear potentially verbal, specifically concerning **the breadth of the term "knowledge"**. The Rylean typically restricts "knowledge" (especially "knowledge-that") to consciously accessible, reportable, propositional states used in reasoning. The Intellectualist employs a broader notion of "knowledge-that" that includes unconscious, procedurally encoded propositional attitudes accessed under a practical PoP.

  *   **Why potentially verbal?** If "knowledge-that" is defined narrowly (conscious, reportable), then the Rylean is clearly correct that much knowing-how isn't knowledge-that. If "knowledge-that" is defined broadly (to include unconscious, procedurally embedded propositional content), then the Intellectualist's claim becomes plausible. Much disagreement stems from whether the broader definition is legitimate or useful, or whether it conflates distinct phenomena (ability vs. propositional attitude).
  *   **Vindication of User Hypothesis:** However, the **Test Cases** reveal that the disagreement extends beyond semantics. Both sides make distinct, empirically testable predictions about phenomena like *implicit learning without awareness* and *skill degradation/recovery*. The **Primacy Crux** and the **Automaticity Crux** also point to substantive, empirical disagreements about the mechanisms of skill acquisition, storage, and deployment. Therefore, while a verbal element exists concerning the *label* "knowledge," the document (particularly Sections 3 & 4) demonstrates that a significant **empirical residue** concerning cognitive architecture and skill psychology remains at the heart of the dispute.

  **This document is presented as a neutral framework for adversarial collaboration. It accurately represents the agreed starting points, fairly states the core disagreements in mutually acceptable terms, identifies the key cruxes, and proposes concrete, shared tests with divergent predictions.**
