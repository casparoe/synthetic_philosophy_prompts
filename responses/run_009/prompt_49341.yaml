prompt: |-
  My friend has views about what you can learn from testimony and I've been keeping a list of her verdicts. She says a colorblind person told that a scarf is scarlet can know it's scarlet. But she says if someone tells you the sunset was gorgeous you can't know it was gorgeous -- best you can get is knowledge that they were impressed. Same with jokes: she thinks you can't know a joke is funny on someone's say so, you have to hear it yourself and get it. She's fine with learning from testimony that a bridge is structurally unsound, or that a novel won the Booker. Last week two new cases came up: a chess amateur being told by a grandmaster that a certain endgame study is elegant, and a lifelong anosmic being told by a perfumer that a particular perfume is subtle and refined. What will she say about these two? I care less about the yes/no than about the rule she's actually running -- is it about aesthetic properties vs descriptive ones, about needing acquaintance through your own perception, about needing to "get it", something else -- and which of the two cases would actually discriminate between the candidate rules rather than being settled by all of them at once. And if both cases somehow come out the same way under every rule I've thought of, what further case should I try her on to split them?
reasoning: |-
  Okay, let me tackle this problem. The user has a friend with specific views on testimonial knowledge, especially regarding aesthetic judgments. I need to figure out the underlying rule she's using and apply it to two new cases: the chess amateur and the anosmic perfumer. 

  First, I recall her existing verdicts. She allows knowledge from testimony for descriptive facts like a scarf's color (even for a colorblind person) or a bridge's structural integrity. But she denies it for aesthetic judgments like a sunset being gorgeous or a joke being funny. The key here seems to be that for the latter, personal experience or "getting it" is necessary. 

  Now, the new cases: the chess endgame's elegance and the perfume's subtlety. Both involve aesthetic terms but in different contexts. Chess elegance is domain-specific, requiring expertise to appreciate, whereas perfume subtlety is sensory and requires olfactory experience. 

  I think her rule hinges on the need for first-hand phenomenal experience or epistemic competence. For the sunset and joke, you need to perceive or understand the experience yourself. Similarly, for the perfume, an anosmic person lacks the sensory capacity, so they can't "get" subtlety even with testimony. But for chess, an amateur might rely on the grandmaster's expertise without needing to personally grasp the elegance, as long as they trust the expert's judgment. 

  This suggests her rule isn't just about aesthetic vs. descriptive but about whether the property requires direct perception or a specific competence the recipient lacks. The anosmic case requires sensory acquaintance, which they can't have, while the chess case might rely on deference to expertise. 

  To test this, I consider a case that splits these requirements. Maybe a food critic describing umami to someone who's never tasted it. If she denies knowledge here (due to lack of taste experience), it aligns with the perfume case. But if she allows a music novice trusting a composer's judgment on a symphony's complexity without hearing it, that would contrast with the sunset case. Such a scenario could help clarify if expertise can sometimes substitute for direct experience.
answer: |-
  Based on your friend's established pattern, here's the breakdown of her likely verdicts, the underlying rule, and how the cases discriminate:

  1.  **Likely Verdicts:**
      *   **Chess Endgame (Elegant): YES.** She will likely say the amateur *can* know the endgame is elegant based on the grandmaster's testimony.
      *   **Perfume (Subtle/Refined): NO.** She will likely say the anosmic person *cannot* know the perfume is subtle/refined based on the perfumer's testimony; they can only know the perfumer *said* it was or *believes* it is.

  2.  **The Rule She's Running:**
      Your friend's core rule centers on **"Phenomenal Experience" or "Subjective Acquaintance."** More specifically:
      *   **Knowledge via testimony is blocked when the property in question *requires* first-person, phenomenal, sensory, or experiential "getting it" to be properly understood or verified.** This "getting it" involves a direct, subjective, qualitative experience.
      *   **Knowledge via testimony is allowed when the property is:**
          *   **Objective/Descriptive:** Facts about the external world verifiable without specific inner experience (scarlet, bridge safety, Booker win).
          *   **Expertise-Based but Non-Phenomenal:** Judgments grounded in complex, domain-specific reasoning or conventions where deference to recognized authority is epistemically valid (chess elegance, arguably the Booker win - though aesthetic, it's a procedural fact).
      *   **Aesthetic vs. Descriptive is insufficient:** She allows testimony for some aesthetic judgments (chess elegance) but blocks others (sunset gorgeousness, joke funniness, perfume subtlety). The key difference is whether the aesthetic judgment *depends crucially* on sensory qualia or immediate subjective impact.
      *   **"Getting it" is crucial:** This is the core barrier. You must personally experience the relevant sensory input (sight of sunset, smell of perfume, hearing the joke) and have the appropriate subjective reaction ("aha!", delight, olfactory appreciation) to truly "know" the property applies. Testimony can't convey that inner state.

  3.  **How the Cases Discriminate:**
      *   **Chess Elegance:** This judgment, while aesthetic, is primarily *intellectual and expertise-based*. It stems from understanding complex positional nuances, tactics, and strategic beauty within the formal rules and conventions of chess. An amateur can rationally defer to a grandmaster's expertise *without needing to personally experience a specific "qualia"* of elegance. They rely on the GM's reasoning and status, similar to trusting an engineer about a bridge. **This fits the "expertise-based" exception.**
      *   **Perfume Subtlety/Refinement:** This judgment is fundamentally *olfactory and sensory-phenomenal*. "Subtle" and "refined" describe qualities of the *scent experience itself*. The anosmic person *lacks the sensory modality* required to have any olfactory experience, let alone the specific qualitative experience of subtlety/refinement. No amount of testimony can give them the phenomenal "what-it's-like" to smell that perfume. They cannot "get it" on the required sensory level. **This fits the "phenomenal experience required" barrier,** just like seeing the sunset or hearing the joke.

  4.  **Discriminating Power:**
      These two cases are **excellent discriminators** for her rule:
      *   They **split the aesthetic category**: Both "elegant" (chess) and "subtle/refined" (perfume) are aesthetic terms, but she likely allows testimony for one (chess) and blocks it for the other (perfume). This rules out a simple "aesthetic vs. descriptive" rule.
      *   They **highlight the "phenomenal experience" requirement**: The anosmic case directly parallels colorblindness + scarlet, but with the opposite verdict. Why? Because knowing "scarlet" (for the colorblind) is knowing an objective, public fact *about* the scarf (its reflectance properties/category), verifiable indirectly. Knowing "subtle scent" *is* knowing a specific, private sensory experience. The chess case lacks this sensory-phenomenal core.
      *   They **test "getting it"**: The chess amateur doesn't need to personally "get" the elegance phenomenally; they trust the expertise. The anosmic person *must* "get" the scent qualia to know its subtlety – which they cannot.

  **What if Both Cases Were the Same? A Further Test Case:**

  Since they come out differently, we don't strictly need this. But to probe the boundary between "expertise-based" and "phenomenal experience," try this:

  *   **The Case:** A world-renowned, highly trustworthy food critic tells someone *who has never tasted anything sour* (congenital lack of sour taste perception) that a specific lemon tart has an "exquisitely balanced, bright, refreshing sourness."
  *   **Question:** Can the person who has never tasted sour *know* the tart has an "exquisitely balanced, bright, refreshing sourness" based on the critic's testimony?
  *   **Why it Discriminates:**
      *   **If YES:** This leans towards the "expertise-deference" model, treating "balanced sourness" like "chess elegance" – a complex judgment within a domain of expertise, even if rooted in sensory experience. The inability to have the specific qualia might be seen as irrelevant to knowing the *fact* of the tart's properties as judged by the expert.
      *   **If NO:** This strongly confirms the "phenomenal experience required" rule. "Balanced, bright, refreshing sourness" is fundamentally *about* the subjective, qualitative taste experience itself. Like the anosmic with perfume or the person missing the sunset, lacking the specific sensory modality (sour perception) blocks the ability to "get it" and thus blocks knowledge of the property *as an experiential quality*. They could only know the critic *said* it or *believes* it.

  **In summary:** Your friend's rule is **Testimony cannot grant knowledge of properties whose understanding or verification *essentially requires* a specific, first-person phenomenal experience ("getting it") that the recipient lacks the capacity for or has not undergone.** The chess elegance case is allowed because it's expertise-driven and non-phenomenal; the perfume subtlety case is blocked because it's fundamentally sensory-phenomenal. The "sour tart" case would further test the boundary between expert judgment and essential phenomenal experience.
