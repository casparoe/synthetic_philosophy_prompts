answer: |-
  You've astutely identified a pervasive and philosophically significant manoeuvre in underdetermination arguments. The phenomenon you describe—where an empirically equivalent rival to an accepted theory is generated *ad hoc* by modifying the accepted theory in artificial, parasitic ways—is indeed recognised and discussed, though terminology varies. Let's carve this precisely.

  ### The Core Phenomenon: Parasitic Rival Theories
  The manufactured rivals you describe share these defining characteristics:
  1.  **Parasitic Generation:** They are algorithmically constructed *from* the favoured theory (T) by applying a specific "recipe".
  2.  **Empirical Equivalence:** The recipe ensures they are empirically equivalent to T (make identical predictions for all possible observations, past, present, and future).
  3.  **Lack of Independent Motivation:** They possess no theoretical virtues (simplicity, explanatory power, coherence with other knowledge, fruitfulness) beyond mimicking T's empirical success. They wouldn't be proposed independently.
  4.  **Artificiality:** They are demonstrably artifacts of the recipe, often violating core scientific principles (e.g., introducing arbitrary time limits, undetectable cancelling forces, or ontologically bizarre entities solely to mimic T).
  5.  **Universality:** The recipe can be applied to *any* theory T to generate such a rival.

  **Established Terms & Coined Precision:**

  1.  **"Ad Hoc Rivals" (Common but Imprecise):** This is often used casually. However, "ad hoc" can apply more broadly to any poorly motivated auxiliary hypothesis added to save a theory, not necessarily generating a *rival* theory via recipe. Your phenomenon is a specific *subtype*.
  2.  **"Grue-Type Problems" (Specific Case):** Nelson Goodman's "grue" paradox (where 'grue' means green before time t, blue otherwise) exemplifies the *recipe* aspect for predicates, sometimes extended to theories. But "grue-type" usually emphasises induction/prediction, not underdetermination of whole theories.
  3.  **"Parasitic Rivals" (Descriptively Accurate):** This captures the core feature: these rivals *depend entirely* on the host theory (T) for their structure and empirical content. They cannot exist without T.
  4.  **"Recipe-Generated Rivals" or "Recipe Rivals" (Mechanism-Focused):** This highlights the algorithmic process ("the recipe") used to create them from T. This is precise and aligns with your description.
  5.  **"Merely Logical Rivals" (Epistemic Status):** Emphasises that their equivalence is a logical consequence of their construction, not a substantial epistemic challenge.

  **Recommended Terminology:** **Parasitic Rival Theory** or **Recipe-Generated Rival Theory**. These terms best encapsulate the essence: a rival manufactured *from* an existing theory via a formulaic process, lacking independent life.

  ### Defining the Boundary: Genuine vs. Parasitic Rivals
  The key distinction lies in **independent motivation and theoretical virtue**:

  *   **Parasitic/Recipe Rival:** A theory T' generated *only* by applying a universal recipe (like adding a universal cancelling force, an arbitrary cutoff date, or systematically permuting ontology) to an existing empirically successful theory T, solely to achieve empirical equivalence. T' possesses *no* independent theoretical virtues (simplicity, explanatory scope, coherence, fruitfulness) that weren't parasitically derived from T or deliberately engineered *only* for equivalence. It has no plausible historical genesis outside of being a reaction to T. (e.g., GR + Universal Cancelling Force; Kinetic Theory with mass secretly denoting mass-squared; Any theory + "laws cease 3000 AD").
  *   **Genuine Empirically Equivalent Rival:** A theory T'' which is empirically equivalent to T, but which:
      *   Was (or could plausibly have been) proposed *independently* of T, based on different principles, motivations, or interpretations of phenomena.
      *   Possesses its *own* theoretical virtues (simplicity, explanatory power, coherence, fruitfulness) *comparable* to T's, *prior to* and *independent of* the knowledge that it matches T's predictions.
      *   Arises from a genuine attempt to explain the world, not just mimic T.

  **Applying the Boundary:**

  1.  **Lorentzian Ether Theory vs. Special Relativity (SR):** **Genuine Rival.** Lorentz developed his theory *before* Einstein's SR, motivated by Maxwell's equations and the apparent failure to detect the aether wind (Michelson-Morley). He derived the Lorentz transformations independently to *explain* the null result within an aether framework. It possessed its own (albeit ultimately less fruitful) explanatory structure and virtues. Its equivalence to SR was a *discovery*, not a parasitic construction.
  2.  **General Relativity (GR) + Universal Cancelling Force:** **Parasitic Rival.** This is explicitly manufactured *from* GR by adding a force defined solely to cancel GR's effects in a way that leaves predictions identical. It has no independent motivation or theoretical virtue; its sole purpose is mimicry.
  3.  **Ptolemaic Epicycles vs. Copernicanism (Early Stages):** **Complex Case / Genuine Rivals Initially.** Ptolemy's system wasn't parasitically generated *from* Copernicus's; it predated it by centuries and was developed as a genuine (and remarkably successful) attempt to model planetary motions based on geocentric principles and available data. It possessed significant explanatory power and coherence within its paradigm. Later, as Copernicanism gained ground, attempts to "save" Ptolemy by adding ever more epicycles *became* increasingly ad hoc and parasitic on the *goal* of matching Copernican predictions/accuracy, but the core system itself was independently motivated.

  ### The Impact on the Underdetermination Argument
  This distinction is **crucial** for evaluating the force of underdetermination against scientific realism.

  1.  **Trivial Underdetermination (from Parasitic Rivals):** This demonstrates the purely *logical* point that for *any* finite set of data, infinitely many theories can be constructed to fit it. However, it poses **no serious epistemic threat** to realism. Why?
      *   **Methodological Rejection:** Science routinely rejects theories lacking virtues like simplicity, non-arbitrariness, and explanatory depth. Parasitic rivals are paradigmatically awful by these standards (e.g., the "year 3000" clause is blatantly arbitrary; the universal force is explanatorily vacuous).
      *   **No Genuine Choice:** No scientist would *ever* adopt a parasitic rival like "Kinetic theory but mass means (mass)^2" based on the evidence alone, precisely because it offers nothing beyond the original and violates methodological norms. Their existence is a philosopher's logical exercise, not a live scientific option.
      *   **Doesn't Reflect Practice:** Scientific theory choice isn't just about empirical adequacy; it's about overall theoretical virtue. Ignoring this misrepresents actual scientific reasoning.

  2.  **Substantive Underdetermination (from Genuine Rivals):** This is the version that *should* worry the realist. If two (or more) theories, *each possessing compelling independent theoretical virtues and motivations*, are empirically equivalent (now and perhaps for the foreseeable future), then evidence alone cannot decide between them. Choosing one becomes a matter of weighing theoretical virtues or potentially extra-empirical criteria (e.g., Lorentz vs. Einstein before decisive experiments like time dilation of muons). This suggests that even our best-confirmed theories might not be uniquely determined by the world's structure.

  **The Literature & Your Intuition:**
  Your intuition is correct and aligns with critiques from philosophers like Larry Laudan, Jarrett Leplin, and Stathis Psillos. They argue:

  *   Underdetermination arguments relying *solely* on parasitic rivals are **trivial** and **do not challenge scientific realism** in any meaningful way. Realism acknowledges that theory choice involves inference to the best *explanation*, not just empirical fit. Parasitic rivals are demonstrably *not* the best explanations.
  *   The genuine threat comes only from cases of **transient underdetermination** between genuinely competing, well-motivated theories (like Lorentz/SR early on, or perhaps different interpretations of quantum mechanics today). However, realists often argue such equivalence is rare and usually temporary, resolved by new evidence or theoretical developments.

  **In Summary:**

  *   **Phenomenon:** The generation of artificial, empirically equivalent rivals to an accepted theory via parasitic "recipes" (universal cancelling forces, arbitrary cutoffs, systematic redefinitions).
  *   **Best Terms:** **Parasitic Rival Theories** or **Recipe-Generated Rival Theories**.
  *   **Boundary:** Distinguished from **Genuine Empirically Equivalent Rivals** by the lack of **independent motivation and theoretical virtue**. Lorentzian Ether: Genuine. "GR + Cancelling Force": Parasitic. Early Epicycles: Genuine (later modifications became parasitic).
  *   **Impact:** Arguments relying *exclusively* on parasitic rivals demonstrate only **trivial underdetermination**, posing no serious challenge to scientific realism. The significant challenge comes only from underdetermination between **genuine rivals** with comparable independent virtues.

  Your professor is illustrating the *logical possibility* of underdetermination using parasitic rivals. However, your critical observation that these are "too cheap" to worry a realist is philosophically sound and reflects an important distinction recognised within the field. The strength of the underdetermination argument against realism hinges entirely on whether substantive, genuine rivals can be found for our best theories, not on the easy proliferation of parasitic ones.
