prompt: |-
  I'm taking a course on rational choice theory, and we've spent two weeks on whether rationality attaches to individual acts or to plans. Rather than argue about theories in the abstract, I've tried to fix my verdicts on concrete cases, and now I'd like to know what principle, if any, captures them — or which verdict I should give up. Here they are.

  1. Parfit's hitchhiker, with a near-perfect predictor: the driver will pick him up only if she predicts he will pay, and once he's in the car, paying gets him nothing further. I cannot bring myself to call the agent who pays irrational. Paying seems like the rational thing to have made sure he'd do.

  2. The same setup, except the driver is a Good Samaritan who picked him up out of kindness, without thinking about whether he'd pay. Here paying seems admirable but not rationally required; if anything it's mildly irrational.

  3. Kavka's toxin: you get a million dollars tonight if by midnight you intend to drink a toxin tomorrow that will make you ill but not harm you permanently. My verdict: it is rational to form the intention, but when tomorrow comes, drinking the toxin is irrational. If someone could collect the million while merely fooling the billionaire about his intentions, that would be the best and fully rational outcome.

  4. Ulysses having himself bound to the mast: obviously rational to order the binding. And once bound, his straining against the ropes isn't an exercise of rationality, but it also isn't a failure of it.

  5. A gym-goer who signs a contract forfeiting $5,000 to a friend unless he exercises: rational. A gambler who pays a hypnotist to make him feel nausea at the sight of a casino: I also want to say rational, even though what he's buying is, in effect, a permanent incapacity for rational choice at the table.

  6. A union leader with a genuinely hair-trigger temper wins concessions a calm bargainer couldn't. He is irrational but lucky. But a leader who deliberately stops practicing self-control in order to acquire that temper, precisely to be a stronger bargainer — that, I keep flip-flopping on. Acquiring the disposition looks rational; the resulting agent looks defective; and I can't tell which judgment should win.

  The tension I've noticed is between 1 and 3. To defend my verdict in the hitchhiker case, I seem pushed toward evaluating whole plans or dispositions from the standpoint of the earlier choice point. But that kind of account appears to vindicate the toxin-drinker as rational too, which I deny. Conversely, act-by-act evaluation keeps 3 and cleanly condemns the toxin-drinker, but it also condemns the hitchhiker who pays, and it makes my endorsement of the hypnotist's client in 5 hard to sustain.

  So: is there a single principle that delivers all six verdicts, or close? If not, which should I abandon, and at what cost? Please state the principle precisely, show which verdict motivates each clause, and tell me what it says about two cases I haven't listed: the hitchhiker where the predictor is only 80% accurate, and a state that staked its deterrence on a promise of massive retaliation which no longer serves any purpose once deterrence has failed and it has been attacked anyway. I'd also like an honest accounting of which of my verdicts your favored principle simply cannot save.
reasoning: |-
  Okay, let me approach this systematically. The user presents a sophisticated dilemma in rational choice theory, contrasting evaluations of individual acts versus entire plans across six concrete cases. Their core tension lies between Parfit's hitchhiker (where paying seems rational despite being instrumentally pointless) and Kavka's toxin puzzle (where forming the intention is rational but drinking isn't). 

  First, I need to map their intuitions clearly: 
  - Case 1 (predictive hitchhiker): Pays → rational
  - Case 2 (kind hitchhiker): Pays → irrational 
  - Case 3 (toxin): Form intention → rational, Drink → irrational 
  - Case 4 (Ulysses): Bind → rational, Struggle → neutral 
  - Case 5 (contract/hypnosis): Both rational 
  - Case 6 (temper): Acquiring disposition rational, Using it irrational 

  The key friction is between 1 and 3. Defending paying in 1 seems to require plan-based rationality, but that would justify drinking in 3 - which they reject. Act-based evaluation condemns paying in 1 but aligns with their toxin verdict. 

  I recall McClennen's resolute choice theory might help here, but it struggles with toxin. Perhaps a hybrid approach? Let me sketch: 
  1. **Temporal relativity**: Rationality is plan-relative at commitment points (t1), act-relative at execution points (t2). 
  2. **Instrumental link**: Acts at t2 are rational iff they execute a t1 plan that was optimal at t1. 
  3. **Predictor exception**: When others' responses depend on predicting t2 acts, those acts inherit t1 optimality. 

  Testing this: 
  - **Hitchhiker (1)**: Paying at t2 is rational because (a) predictor made paying necessary for rescue, (b) it executes the t1-optimal plan. 
  - **Toxin**: Forming intention at t1 is rational (optimal plan), but drinking at t2 isn't - no predictor links it to reward, and it doesn't execute the plan (reward already secured). 
  - **Good Samaritan (2)**: Paying irrational - no predictor, no t1 plan dependency. 

  For other cases: 
  - **Ulysses**: Binding rational at t1; struggling is non-rational (not an intentional act). 
  - **Hypnotist**: Acquiring disposition rational (t1 optimal plan); subsequent "defective" choices are part of the plan's execution. 
  - **Temper (6)**: Acquiring disposition rational; actual outbursts are instrumentally effective but locally irrational - a cost worth bearing. 

  Now the hard cases: 
  - **80% predictor hitchhiker**: Paying remains rational - still part of the only viable rescue plan. 
  - **Nuclear retaliation**: Launching irrational post-attack (no benefit, huge cost), but the threat was rational as deterrence. 

  The principle sacrifices nothing from their verdicts, but note: it treats the hypnotized gambler's post-hypnosis choices as rational *because predetermined*, which might feel uneasy. That's the price of consistency. 

  Finally, the user's "honest accounting": my principle saves all their verdicts except arguably the temper case's "defective agent" description - the outbursts are irrational locally but system-rational. They might need to soften that intuition.
answer: |-
  Your intuitions reveal a deep tension between **act-by-act instrumental rationality** and **plan-based rationality**. After analyzing your six verdicts, I propose the following principle that captures all of them without contradiction:

  ### The Resolute Planning Principle (RPP)
  **An agent acts rationally iff:**  
  (i) At each choice point, they select an act that is part of a *feasible plan* they would have rationally endorsed from an *initial planning perspective* (IPP), and  
  (ii) The IPP plan maximizes expected utility relative to *predictable downstream actions* (including the agent's own future choices),  
  (iii) **Except** when an act at time *t* has *no causal influence* on prior gains secured by the plan, in which case rationality is evaluated *solely* by its immediate consequences.  

  **Key components:**  
  - **IPP (Initial Planning Perspective):** The earliest point where the agent can commit to a plan (e.g., pre-trip for the hitchhiker, pre-incentive for toxin).  
  - **Feasible plan:** A sequence of actions the agent is psychologically capable of executing.  
  - **Predictable downstream actions:** Others' responses (e.g., the hitchhiker's driver) or one's own future behavior (e.g., Ulysses' binding) that are reliably anticipated at IPP.  

  ---

  ### How RPP Delivers Your Verdicts
  1. **Parfit's Hitchhiker (Predictor)**  
     - **Verdict:** Paying is rational.  
     - **RPP Application:** At IPP (pre-trip), the only feasible plan for survival is *committing to pay*. Paying executes this optimal IPP plan. The predictor links the act to survival, satisfying (ii). (iii) doesn't apply since paying *sustains the predictor's accuracy* for future interactions.  

  2. **Hitchhiker (Good Samaritan)**  
     - **Verdict:** Paying is irrational.  
     - **RPP Application:** No predictor exists, so paying doesn't influence prior gains (rescue). (iii) applies: paying has no benefit and a cost → irrational. Admirable but non-rational.  

  3. **Kavka's Toxin**  
     - **Verdict:** Forming intention rational; drinking irrational.  
     - **RPP Application:**  
       - *Forming intention:* At IPP (pre-midnight), intending is part of a feasible plan to gain $1M (satisfies i-ii).  
       - *Drinking:* The $1M is already secured; drinking causes harm with no benefit. (iii) applies → irrational.  

  4. **Ulysses Bound**  
     - **Verdict:** Binding rational; struggling neutral.  
     - **RPP Application:**  
       - *Binding:* Optimal at IPP (pre-sirens) to avoid disaster (i-ii).  
       - *Struggling:* Not a chosen act; it's an impulse. RPP evaluates only intentional acts → non-rational.  

  5. **Gym Contract & Hypnotist**  
     - **Verdict:** Both rational.  
     - **RPP Application:**  
       - At IPP (signing contract/pre-hypnosis), these are optimal plans: they exploit predictable future incapacities (ii). The gym-goer's future workout is part of the plan (i); the gambler's nausea *executes* the plan, making "irrational" choices *instrumental*. (iii) doesn't apply—the incapacity is the plan's mechanism.  

  6. **Union Leader's Temper**  
     - **Verdict:** Acquiring disposition rational; using it irrational but system-rational.  
     - **RPP Application:**  
       - *Acquiring temper:* Rational at IPP (pre-bargaining) as it enables better outcomes (i-ii).  
       - *Actual outbursts:* Locally irrational (costly if concessions fail), but *executing the IPP plan* (i). RPP tolerates local defects if they fulfill the plan.  

  ---

  ### Resolving the Tension: Why 1 and 3 Cohere
  - **Hitchhiker (1)** satisfies (ii): Paying is *causally necessary for rescue* via the predictor.  
  - **Toxin (3)** triggers (iii): Drinking lacks *causal power* over the $1M.  
  - **Core insight:** Rationality extends to acts that *secure or sustain* gains anticipated at IPP, but *severs* when an act becomes causally inert to prior gains.  

  ---

  ### Unlisted Cases: RPP's Predictions
  #### A. Hitchhiker with 80% Predictor  
  - **Verdict:** *Paying is rational.*  
  - **Why:** At IPP, committing to pay remains the only feasible plan with positive expected utility (80% chance of survival > 0%). (ii) applies: paying sustains predictor reliability.  

  #### B. Nuclear Deterrence  
  - **Scenario:** A state promises massive retaliation if attacked. After being attacked, retaliation serves no purpose.  
  - **Verdict:**  
    - *Threatening* retaliation: Rational at IPP (pre-conflict) → deters attack (ii).  
    - *Actual retaliation:* Irrational. (iii) applies: it cannot undo the attack or deter future ones (no causal benefit), only adds harm.  
  - **RPP Application:** Like toxin, the gain (deterrence) is secured before the act; retaliation is pure cost.  

  ---

  ### What You Must Abandon
  Your verdicts are *almost* fully preserved under RPP. The only cost:  
  - **The "defective agent" intuition in Case 6 (temper).** RPP forces you to accept that the union leader's outbursts are *locally irrational but system-rational*. The outbursts are defective as isolated acts but rational as *executions of the optimal IPP plan*. This is consistent with your gym/hypnotist verdicts.  

  ---

  ### Why This Works
  RPP synthesizes **sophisticated choice** (acting on predictions of future actions) and **resolute choice** (sticking to plans). It avoids the pitfalls of:  
  - **Pure act-by-act rationality** (which fails Cases 1, 5, and 6).  
  - **Pure plan-based rationality** (which fails Case 3 by endorsing drinking).  
  - **Causal decision theory** (which fails Case 1, as paying has no causal effect on rescue).  

  **Final note:** RPP assumes agents can reliably predict their own future behavior (e.g., via precommitments). Where this fails (e.g., an incompetent toxin-intender), feasibility (i) may invalidate the plan. Your cases avoid this by assuming competence.  

  If you adjust nothing else, hold firm to your verdicts—RPP shows they are coherent. The cost is accepting that locally irrational acts can be globally rational when they execute a prior optimal plan *and* sustain its gains.
