prompt: |-
  I've been reading rationalist blogs and forums since the Sequences era, and one idea from that world I've never seen made practical is moral trade — Toby Ord's observation that agents with deeply incompatible moral views can sometimes make each other strictly better off by trading concessions rather than splitting the difference, the way nations with opposed interests still manage to sign arms-control treaties. The situation I now find myself in is exactly the one that idea was written for, and I want it operationalized.

  I sit on the board of a mid-sized grantmaking foundation. Our seven trustees disagree at the level of values, not facts, and no amount of shared evidence will reconcile us: two are total utilitarians who care almost exclusively about the far future; one holds a strict Kantian line and objects to funding anything that treats persons merely as means; two prioritize near-term human welfare; and one is an animal welfarist who regards our human-focused portfolio as a slow-motion moral catastrophe. Currently we compromise — every decision is watered down to what everyone can tolerate, and I suspect we are leaving enormous value on the floor, because a compromise is not the same thing as a trade. A trade would let the utilitarians get their existential-risk grants funded fully, in exchange for something the animal welfarist values more than the cost to us — instead of everything being funded at 60% intensity.

  Please write a procedure the board can actually run, twice a year at our grant-allocation meetings, under these constraints: no trustee has philosophy training beyond me, each trustee holds a veto on grants touching their core concern, the whole thing has to fit into one afternoon, and the board's charter requires that our decisions be defensible to external auditors, so the procedure has to produce a rationale, not just an outcome. The procedure should cover, in order: how to identify which of our disagreements are tradable and which are constitutive (a Kantian who thinks trading away a side-constraint is itself impermissible cannot be a counterparty, and the procedure needs to discover that early rather than waste an afternoon); how to elicit from each trustee something like an intensity ordering over outcomes without demanding they fake a common currency; how to structure the trades themselves — bundling grants across rounds, side payments in budget share, commitments about future cycles, and a sunset clause so no trustee is locked into a bad deal as their views shift; and where the procedure should give up on trade and fall back to what Bostrom called the moral parliament — negotiated proportional influence over a whole portfolio, rather than deals.

  It also has to handle the obvious failure modes: trustees strategically exaggerating intensity to extract better terms; trades that impose costs on parties not at the table (grantees, animals, future people) and whether third-party harm should block a deal or just count as one weight in it; and the degenerate case where the procedure silently collapses into ordinary logrolling and everyone calls it philosophy.

  Then run the procedure on three live cases from our docket. (1) The utilitarians want to shift thirty percent of the budget toward existential-risk research; the near-term humanists want to launch a maternal-health program; both sides say the other's priority can wait. (2) The Kantian objects to a proposed grant to an effective charity that relies on emotional advertising he regards as manipulative, while every other trustee ranks it first. (3) The animal welfarist offers to vote with the utilitarians on the X-risk portfolio, in exchange for phasing out a line of grants to a research institute that conducts animal testing the other trustees consider scientifically valuable. In at least one of these, I expect the procedure to reach a conclusion I won't like — I'm one of the utilitarians — and I want it run honestly anyway.

  Finally, be explicit about the procedure's honest limits: which steps are genuine moral philosophy in disguise, which are just mechanics, where it will systematically misfire (for instance, if trustees' stated intensities are unreliable), and where it cannot settle the prior question some of our views may raise — whether trading away a moral conviction is itself something a view can permit at all, or whether it is the kind of thing that, once you treat it as currency, you no longer hold.
reasoning: |-
  We are designing a procedure for moral trade among trustees with deeply held, incompatible moral views. The procedure must:
   - Fit into one afternoon, twice a year.
   - Be accessible to non-philosophers.
   - Allow each trustee veto on grants touching their core concern.
   - Produce a defensible rationale for auditors.
   - Identify tradable vs. constitutive disagreements early.
   - Elicit intensity of preferences without a common currency.
   - Structure trades (bundling, side payments, future commitments, sunset clauses).
   - Handle strategic exaggeration, third-party harm, and degeneration into logrolling.
   - Have a fallback to proportional influence (moral parliament).

   The procedure will be run in steps:

   Step 0: Preparation (before the meeting)
     - Each trustee submits a list of their top priority grants (say, 3-5) for the cycle, along with a brief statement of why it aligns with their values.
     - The chair (or a neutral facilitator) compiles these into a docket, noting which trustee supports which grants.

   Step 1: Identifying Tradable vs. Constitutive Disagreements (1 hour)
     - Each trustee is given 5 minutes to state their core moral concerns and any "non-negotiable" lines (i.e., veto issues). The facilitator records these.
     - The facilitator then presents each grant on the docket and asks: "Is this grant touching a core concern for any trustee?" If yes, that trustee must state whether they would veto it. This identifies veto-bound grants.
     - For non-veto grants, the facilitator asks: "For each of your priority grants, are there any other grants on the docket that you would be willing to see reduced or eliminated in exchange for your priority being funded more fully?" This helps identify potential trade partners and issues.

   Step 2: Eliciting Intensity (30 minutes)
     - Without requiring a common currency, we use a simple ordinal method. Each trustee ranks the non-veto grants in order of personal importance (from most to least important). They are allowed to assign the same rank to multiple grants if they are indifferent.
     - Additionally, each trustee is asked to indicate the "intensity" of their preference for their top priorities by using a simple point allocation: they are given 10 points to distribute across their top 3 priorities (if they have 3 or more) or top 2 (if they have fewer). They can assign all 10 to one if they feel very strongly. This is not a currency but a way to express relative intensity within their own view.

   Step 3: Structuring Trades (1.5 hours)
     - The facilitator groups grants into "trade bundles" based on:
          a) Which grants are priorities for one group but low cost (or even beneficial) to others.
          b) The intensity points and rankings.
     - For each proposed trade bundle, the facilitator checks:
          - Does it avoid any veto? (If it includes a veto-bound grant, it is discarded.)
          - Does it harm third parties? (The trustees must consider: if a grant reduction harms a third party, does that harm outweigh the benefits of the trade? Each trustee can raise this. The trade must be modified to avoid excessive harm or dropped.)
     - The trade structure can include:
          - Bundling: e.g., "We fund Grant A (priority for Trustee X) at 100% and reduce Grant B (which Trustee X doesn't care about) by 20%, and use the savings to fund Grant A."
          - Side payments: e.g., "Trustee Y allows Grant C (which they are indifferent to) to be funded, in exchange for a commitment that in the next cycle, a grant they care about will be considered."
          - Sunset clause: Any trade that involves future commitments must specify a time limit (e.g., for one cycle only, or two at most) and a review mechanism.
     - The facilitator proposes a set of trades that maximize the total expressed intensity (sum of points for funded grants) while respecting vetoes. Trustees then discuss and vote on each trade bundle.

   Step 4: Moral Parliament Fallback (30 minutes)
     - If no trades are possible (or after trades are exhausted), the remaining budget is allocated via proportional influence. Each trustee is given a number of votes proportional to their share (so 7 trustees, each gets 100 votes). They can allocate their votes across the remaining grants. The grants are funded in order of total votes until the budget is exhausted.

   Step 5: Rationale Generation (30 minutes)
     - The facilitator writes a summary:
          - Which grants were vetoed and why (citing the trustee's core concern).
          - Which trades were made and the reasoning (e.g., "Trustee A prioritized Grant X highly and was willing to reduce Grant Y, which was of low importance to them, in exchange for full funding of X. Trustee B, who had Grant Y as a low priority, agreed because they received a commitment for future funding in an area they value.").
          - How the fallback allocation was determined (vote totals).
          - The sunset clauses and any side payments.

   Step 6: Review and Sunset (built into the process)
     - At the next meeting, any side payments or commitments from previous trades are reviewed. If not honored, the trade is void and the budget reverts to the fallback for the current cycle.

   Handling failure modes:
     - Strategic exaggeration: The point allocation (Step 2) is limited (only 10 points) and only for top priorities. This makes exaggeration less impactful because it's relative to a small set. Also, the requirement for a rationale might deter blatant misrepresentation (as it must be defended to auditors).
     - Third-party harm: Trustees are required to consider this. The veto power extends to any trustee who believes a grant (or its reduction) would harm a third party in a way that violates their core concern. If no veto is raised, the harm is considered in the trade's cost-benefit and noted in the rationale.
     - Degeneration: The procedure tries to avoid logrolling by focusing on trades that are explicitly justified by intensity of preference and by requiring a rationale. If a trade is purely logrolling (without moral justification), it can be challenged by any trustee and must be defended in the rationale.

   Now, we run the procedure on the three cases.

   Case 1: Utilitarians (U) want to shift 30% of budget to X-risk research; near-term humanists (H) want a maternal-health program. Both say the other can wait.

   Step 1: Identify tradable.
     - Neither grant is veto-bound (assuming no core concern violation). Both are tradable.

   Step 2: Elicit intensity.
     - Utilitarians: Rank X-risk as top (assign 10 points each, but they have 2 trustees, so 20 points total? We must do per trustee: each U trustee assigns 10 points to X-risk, so 20 points. They might assign 0 to maternal health or low rank.
     - Humanists: Each assigns 10 points to maternal health (so 20 points). They might assign 0 to X-risk or low rank.
     - Other trustees: The Kantian (K) and animal welfarist (A) might rank these low. Let's assume:
          - K: Assigns 5 to maternal health (because it helps persons) and 0 to X-risk (if it involves uncertain means). But let's say K is neutral on X-risk and maternal health? We need more info.
          - A: Assigns 0 to both (if they are human-focused).

     To simplify, let's assume:
          U1, U2: X-risk: 10 each (so 20 total points from U)
          H1, H2: Maternal health: 10 each (20 total)
          K: Assigns 5 to maternal health (if it doesn't violate Kantian principles) and 0 to X-risk.
          A: Assigns 0 to both.

     Total points for X-risk: 20, for maternal health: 25.

   Step 3: Structuring trades.
     - The conflict: both sides say the other can wait. But the trade would be: fund X-risk now, and fund maternal health later? But that involves future commitments. Alternatively, we can bundle: fund both now, but at a level that fits the budget.

     However, note: the utilitarians are asking for a shift of 30% of the budget. Let the total budget be 100 units. Currently, the budget is allocated to many grants. We need to see what can be traded.

     The trade proposal: The humanists agree to fund X-risk at 30% of the budget in this cycle, in exchange for a commitment that next cycle, the utilitarians will support a maternal health program at 30% of the budget. But the utilitarians might not agree because they think the future is more important and might not want to commit future resources.

     Alternatively, the utilitarians might offer to reduce funding in a grant that the humanists don't care about? But the humanists care about near-term human welfare, so they might care about many current grants.

     Another idea: the utilitarians might agree to fund maternal health at a lower level (say 15%) in exchange for funding X-risk at 30%. But then the humanists get less than they want.

     Given time constraints, the facilitator might propose:
          - Trade: Fund X-risk at 30% and maternal health at 15% in this cycle, and then in the next cycle, fund maternal health at 30% and X-risk at 15%. This averages to 22.5% for each per cycle, which is less than what both want but more than they would get in a compromise.

     However, note: the humanists might not trust the future commitment. So we need a sunset clause and a way to enforce.

     Alternatively, we can use side payments from other trustees. For example, the animal welfarist might be indifferent to both and willing to let their own grants be reduced to free up budget. But in this case, A is not involved.

     Let's assume we cannot find a trade in this meeting. Then we move to Step 4.

   Step 4: Moral Parliament.
     - Each trustee gets 100 votes. They allocate votes to the two grants (and others, but we focus on these two).
          U1, U2: Allocate 100 votes each to X-risk (so 200).
          H1, H2: Allocate 100 each to maternal health (200).
          K: Might split votes. Let's say K allocates 50 to maternal health and 50 to other grants (or 100 to maternal health? We don't know). For simplicity, say K allocates 100 to maternal health.
          A: Allocates 0 to both, so 100 to other grants.

     Total for X-risk: 200, for maternal health: 300. So maternal health gets funded first. But we have a budget constraint. The facilitator would have all grants on the table.

     However, in the moral parliament, the vote allocation is across all grants. So if there are other grants, they might get votes too.

     Given the focus on these two, let's say the budget is allocated by the total votes. Suppose the two grants are the only ones. Then maternal health gets 300/(300+200) = 60% of the budget, and X-risk gets 40%. But the humanists want 30% for maternal health? Actually, they want to launch it, which might require a minimum of 20%. The utilitarians want 30% for X-risk. So 40% for X-risk is more than they asked for? Not exactly: they wanted a shift of 30% of the budget, so 30% allocated to X-risk. But here they get 40%, which is more. However, the maternal health gets 60%, which is more than the humanists asked for? This is because the vote allocation might not reflect the desired funding level.

     We need to adjust: in the moral parliament, trustees allocate votes to express their desired distribution. They could allocate votes proportionally to the desired funding. But that might be too complex.

     Alternatively, the vote allocation is for ranking. The grants are sorted by total votes, and then funded until the budget runs out. So if the two grants are the top two, and the budget is 100, then maternal health gets 60 units and X-risk gets 40. But that might be acceptable? The humanists are happy (they get more than 30%) and the utilitarians get more than 30%? However, the utilitarians might have preferred 30% for X-risk and 0 for maternal health. So they are not happy.

     But without a trade, this is the fallback.

   Case 2: Kantian objects to a grant to an effective charity that uses emotional advertising (manipulative). Other trustees rank it first.

   Step 1: Identify tradable.
     - The grant is veto-bound because the Kantian says it violates a core concern (treating persons merely as means). So the Kantian vetoes it. Thus, the grant is blocked.

     Therefore, no trade is possible. The grant is not funded.

     Rationale: The Kantian trustee exercised their veto because the grant violates a core Kantian principle against manipulative advertising.

   Case 3: Animal welfarist (A) offers to vote with the utilitarians on the X-risk portfolio, in exchange for phasing out a line of grants to an animal-testing institute.

   Step 1: Identify tradable.
     - The animal-testing grant: The animal welfarist considers this a core concern? They might veto it. But they are offering a trade, so they are not vetoing it outright? Or they are willing to let it continue for a while in exchange for something else? 

     However, the other trustees (especially the near-term humanists and the Kantian) might not consider animal testing a core concern. The Kantian might have an issue if it violates respect for animals? But typically Kantians are human-focused. Let's assume the other trustees do not veto the animal-testing grant.

     So the animal-testing grant is not veto-bound. The X-risk portfolio is not veto-bound (unless the Kantian objects to some method, but we assume not).

   Step 2: Elicit intensity.
     - Animal welfarist: Assigns 10 points to phasing out the animal testing. They might assign 0 to X-risk or even negative? But we don't do negative. They are willing to support X-risk in exchange, so they might assign a positive value to the trade.

     However, the intensity exercise is over grants, not trades. So we need to adjust.

     Alternative: the trade is a bundle. The animal welfarist gets their priority (phase out animal testing) and in return supports X-risk. The utilitarians get X-risk and lose the animal-testing grant. The other trustees might be affected: they lose the animal-testing grant and get X-risk.

     How do the other trustees rank these?
          Utilitarians: They value X-risk highly (10 points each) and might value animal testing low (say 0 or 1). So they are happy to trade.
