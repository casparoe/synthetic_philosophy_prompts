answer: |-
  ### Moral Trade Procedure for Foundation Board Allocation Meetings

  **Design Principles**
  - **Practicality**: Fits within a 4-hour meeting, requires no formal philosophy training.
  - **Veto Protection**: Core concerns are identified upfront; trustees retain veto power over grants violating their non-negotiable principles.
  - **Audit-Ready**: Clear rationale documenting tradeoffs, vetoes, and fallback allocations.
  - **Trade Focus**: Prioritizes Pareto-improving trades over compromises. Includes safeguards against degeneration into logrolling.
  - **Fallback**: Uses Bostrom's "moral parliament" when trades fail.

  ---

  ### Step-by-Step Procedure (Runtime: 4 hours)
  **Step 1: Identify Tradable vs. Constitutive Disagreements (45 min)**  
  *Purpose: Flag non-tradable issues early to avoid wasted time.*  
  - **Trustee Statements**: Each trustee has 5 min to:  
    (a) State their *core moral commitments* (e.g., "No instrumentalization of persons," "Animal suffering is intolerable").  
    (b) Identify *veto-triggering grants* from the docket (e.g., "I veto any grant using emotional manipulation").  
  - **Facilitator Synthesis**: Create a shared "Veto Matrix":  
    | Grant ID | Veto Trigger (Trustee) | Tradable? (Y/N) |  
    Rationale: If a grant violates a core commitment (e.g., Kantian constraint), it’s marked *non-tradable* and requires unanimous approval. All else is tradable.

  **Step 2: Elicit Intensity Without Common Currency (45 min)**  
  *Purpose: Capture preference strength without forcing numerical utilitarianism.*  
  - **Ordinal Ranking**: Each trustee ranks all *tradable grants*:  
    - Top 3: "Highest moral urgency"  
    - Bottom 3: "Acceptable to sacrifice"  
  - **Intensity Heatmap**: On a shared board, trustees mark:  
    - 🔴 = "Unbearable loss" (veto equivalent if reduced)  
    - 🟡 = "Strong preference"  
    - 🟢 = "Willing to trade"  
  - **Output**: A visual grid showing overlaps (e.g., "Utilitarians: 🔴 on X-risk, 🟢 on maternal health").  
  *No numbers required; avoids fake common currency.*

  **Step 3: Structured Trading Protocol (90 min)**  
  *Purpose: Bundle concessions into Pareto-improving deals.*  
  - **Trade Proposals**: Any trustee may propose:  
    - *Bundle*: "Fund my 🔴 grant at 100% if I support defunding your 🟢 grant."  
    - *Side Payment*: "I yield budget share now for your priority, if you support mine next cycle."  
    - *Sunset Clause*: All deals expire after 2 allocation cycles; no perpetual commitments.  
  - **Rules**:  
    - Deals require unanimous consent *only* if affecting veto-triggering grants.  
    - Non-veto trades pass with 5/7 approval (simple majority +1).  
    - Third-party harm (e.g., animals, future people) must be acknowledged in rationale; trustees may block if harm violates their core commitment.  
  - **Anti-Gaming Safeguards**:  
    - Trustees must justify intensity claims (e.g., "Why is this 🔴?"). Exaggeration risks loss of credibility.  
    - Deals with no moral justification (e.g., "I’ll support your pet project for cash") are ruled out by facilitator as "degenerate logrolling."  

  **Step 4: Fallback to Moral Parliament (30 min)**  
  *Purpose: Allocate untraded grants proportionally.*  
  - If trades fail or budget remains:  
    1. Each trustee gets *influence points* equal to budget share (e.g., $1M = 100 points).  
    2. Trustees allocate points to grants via sealed bid.  
    3. Grants funded by total points until budget exhausted.  
  - *Example*: Humanists spend 70 points on maternal health; utilitarians spend 80 on X-risk.  

  **Step 5: Rationale Generation (30 min)**  
  *Purpose: Document for auditors.*  
  - Facilitator compiles:  
    - Veto justifications (e.g., "Grant #42 vetoed by Kantian: manipulative advertising").  
    - Trade terms (e.g., "Animal testing grant phased out in exchange for X-risk support").  
    - Fallback vote counts.  
    - Sunset clauses noted.  

  ---

  ### Live Case Applications
  **Case 1: X-Risk (Utilitarians) vs. Maternal Health (Humanists)**  
  - **Step 1**: Both grants tradable (no core veto).  
  - **Step 2**:  
    - Utilitarians: X-risk = 🔴, Maternal health = 🟢.  
    - Humanists: Maternal health = 🔴, X-risk = 🟢.  
    - Others: Kantian 🟡 maternal (if non-manipulative), Animalist 🟢 both.  
  - **Trade Proposal**:  
    - Utilitarians bundle: "Fund X-risk at 100% this cycle; we yield 15% budget for maternal health next cycle + sunset clause."  
    - Humanists: Accept if maternal health gets 20% now.  
  - **Outcome**: **Trade accepted** (5/7: Utilitarians + Humanists + Animalist). Kantian abstains.  
    - *Rationale*: "Near-term certainty for humanists; long-term gain for utilitarians. Budget shifted: 30% X-risk, 20% maternal health. Sunset in 2025."  
    - *Why you (utilitarian) dislike it*: You wanted 30% for X-risk *now* without near-term "waste," but accepted future budget risk to avoid compromise.  

  **Case 2: Emotional Advertising Grant (Kantian Veto)**  
  - **Step 1**: Kantian declares veto: "Manipulation violates persons-as-ends." Non-tradable.  
  - **Outcome**: **Grant rejected without trade**.  
    - *Rationale*: "Unanimity required for veto-triggering grants. Kantian veto upheld per board charter §4.1."  

  **Case 3: Animal Testing Phase-Out for X-Risk Support**  
  - **Step 1**: Animal testing tradable (humanists value science but no core veto).  
  - **Step 2**:  
    - Animalist: Animal testing phase-out = 🔴.  
    - Utilitarians: X-risk = 🔴, animal testing = 🟢.  
    - Humanists: Animal testing = 🟡 (scientific value), X-risk = 🟢.  
  - **Trade Proposal**:  
    - Animalist: "Phase out animal testing over 2 years. I support 100% X-risk funding."  
    - Humanists: Block—third-party harm (medical patients lose research).  
    - **Revised Bundle**: Animalist + Utilitarians offer humanists a side payment: 10% budget for maternal health *now*.  
  - **Outcome**: **Trade accepted** (6/7: All except Kantian, who abstains).  
    - *Rationale*: "Animal testing reduced by 50%/year; X-risk funded at 30%. Humanists compensated with maternal health. Sunset clause: Deal void if maternal health not funded in 2024."  
    - *Why it works*: Humanists’ third-party concern addressed via side payment.  

  ---

  ### Honest Limits of the Procedure
  1. **Philosophy in Disguise**:  
     - Core commitment declarations (Step 1) require trustees to introspect on deontology vs. consequentialism—a philosophical act.  
     - Intensity elicitation (Step 2) implicitly assumes *commensurability* across moral frameworks, which some may reject.  

  2. **Mechanical Steps**:  
     - Vote counting, trade bundling, and sunset clauses are purely procedural.  
     - Fallback allocation is algorithmic (no moral reasoning required).  

  3. **Systematic Failure Modes**:  
     - **Unreliable Intensity**: If trustees misrepresent 🟢/🔴, trades may harm third parties or create losers. *Mitigation*: Auditors review rationale for consistency with past statements.  
     - **Veto Abuse**: Overuse of veto power collapses the system. *Mitigation*: Charter requires "good faith" core commitments.  
     - **Temporal Myopia**: Future people/animals can’t advocate; relies on trustees as proxies.  

  4. **The Unsettled Prior Question**:  
     - The procedure *cannot* resolve whether moral trade is *inherently corrupting*. A Kantian who believes trading constraints is immoral will veto trades ab initio (Step 1).  
     - **Key Insight**: The procedure works only if trustees accept that *some* values can be traded without abandoning their core. If a trustee views all values as sacred, the fallback is their only option.  

  **Conclusion**: This operationalizes moral trade for non-philosophers by converting ordinal intensities into auditable bundles. It works best when trustees have *some* flexible preferences beyond core constraints. Run it twice yearly—you’ll secure wins like Case 1 and 3, endure losses like Case 2, and avoid the 60% compromise trap.
