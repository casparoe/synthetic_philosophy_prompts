prompt: |-
  I am a senior program officer at a mid-sized private foundation that makes about seventy grants a year across three portfolios: global health, domestic policy reform, and community organizing. Two years ago the foundation reorganized its grantmaking around effective-altruist-style cost-effectiveness reasoning, and the result was predictable: interventions with clean, measurable outcomes — deworming, insecticide-treated nets, direct cash transfers — now dominate the portfolio, while proposals like tenant organizing or civil-service reform can never clear the bar, because no one can attach a credible number to them. Our new director accepts the standard critique that this reflects a built-in measurability bias: cost-effectiveness reasoning does not merely prefer what can be measured, it gradually rewrites the whole portfolio so that what cannot be measured stops competing at all. But she explicitly rejects the lazy version of the institutional critique — the one that simply declares systemic change more important and thereby exempts every systemic-change proposal from scrutiny. Both errors, she says, are the same error: letting the ease of measurement stand in for the size of the effect, in opposite directions.

  She has asked me to draft a screening procedure that program staff can actually run in the forty-five minutes we realistically have per letter of inquiry, before anything goes to a full proposal. Please write that procedure. It must include the following:

  1. An ordered list of questions, each with a statement of what counts as a sufficient answer and what counts as a failure. The order matters: early questions should be cheap and knock out weak proposals fast.

  2. At least one question addressing the two distinct forms the institutional critique takes, and keeping them distinct, because they call for different responses: the causal form (a targeted intervention may prop up the very system that generates the problem it treats, so the measured benefit is partly an illusion — a food program that stabilizes the policies causing the hunger) and the epistemic form (over time, the funding landscape itself reshapes so that unmeasurable approaches stop being proposed, which means the absence of competing applications is not evidence of anything). The procedure should say what an applicant could plausibly show that would answer each form, and what to do when, as usual, nothing can be shown.

  3. At least one question on counterfactual fungibility: if we decline, does someone else fund it, and does that make our money marginal or moot? The procedure should specify how this interacts differently with a saturated intervention area and a neglected one, and it should be honest that staff will rarely know the funding landscape well enough to answer.

  4. Explicit marks on the two places judgment cannot be eliminated: where the question is one of values rather than facts and must be handed to a person with a name attached to the decision, and where the procedure should stop and reject rather than hand upward. These must be visibly distinguished, so that a rejection never masquerades as a technical finding when it is really a values call.

  Then run the procedure on three cases and report its verdicts:

  - A deworming program in a region where two large funders already operate, with solid trial evidence behind it, requesting expansion into a third country.
  - A state-level campaign to reform public-housing law, run by a coalition with a credible track record of past legislative wins, whose central outcomes (tenants' bargaining power, the credibility of future threats) are in principle unmeasurable and whose proposal says so plainly.
  - A well-run, honest community organization whose theory of change amounts to organizing builds organizing — capacity now, campaigns later, with no specified later target. Design this case so that the procedure's verdict is one my staff will dislike, and then say plainly whether that verdict is a feature of the procedure or a misfire, and how you can tell the difference in general.

  Finally, include a section stating what the procedure cannot do: where it will systematically misfire, which of its steps are judgment calls dressed up as arithmetic, and what it would take — in staff time or data we will never have — to do better. The deliverable is a working document for non-philosophers, so it should be written in their language, but the distinctions that matter (causal vs. epistemic institutional critique, measurement vs. value, marginal vs. replaceable funding) must survive the simplification, because a program officer who cannot state them is exactly the officer who will apply the procedure as a mechanical scorecard, which is the failure mode we are trying to escape.
reasoning: |-
  We are designing a screening procedure for a foundation that uses cost-effectiveness reasoning but wants to avoid the bias against systemic change and unmeasurable outcomes. The procedure must be runnable in 45 minutes per letter of inquiry (LOI) and include specific elements.

  Key requirements:
  1. Ordered list of questions with clear pass/fail criteria, designed to knock out weak proposals early.
  2. At least one question addressing the two forms of the institutional critique (causal and epistemic) and what an applicant could show to address each. Also, what to do when nothing can be shown.
  3. At least one question on counterfactual fungibility (marginal impact of the grant) and how it interacts with saturated vs. neglected areas. Acknowledge that staff may not know the funding landscape well.
  4. Explicit marks where judgment is required (values vs. facts) and where to stop and reject (without masquerading as a technical finding).

  Then, run the procedure on three cases and report verdicts.

  Finally, include a section on the procedure's limitations.

  We'll structure the procedure as follows:

  **Screening Procedure: Initial Triage for Letters of Inquiry**

  **Goal:** To quickly assess whether a proposal merits a full proposal, balancing measurable cost-effectiveness with the potential for systemic change, while avoiding both the measurability bias and the lazy exemption of systemic proposals.

  **Ordered Questions:**

  1. **Problem Definition and Urgency**
     - Question: Does the proposal clearly define a problem that aligns with our foundation's mission (global health, domestic policy reform, or community organizing) and is the problem described as urgent and significant?
     - Sufficient answer: Yes, with a clear, concise statement of the problem and its relevance to one of our portfolios. The problem is described in terms of human suffering, injustice, or systemic failure that our foundation seeks to address.
     - Failure: The problem is vague, not aligned, or not clearly urgent. If it fails, reject without further review.

  2. **Theory of Change (Causal Logic)**
     - Question: Does the proposal articulate a plausible theory of change? That is, does it explain how the proposed activities will lead to the intended outcomes, even if the outcomes are hard to measure?
     - Sufficient answer: The theory of change is clear and logically coherent. The proposal explains the causal chain from activities to outcomes, even if some steps are not easily quantifiable. For systemic change proposals, it might describe how building power or changing institutions leads to long-term impact.
     - Failure: The theory of change is missing, implausible, or based on flawed assumptions. If it fails, reject.

  3. **Counterfactual Fungibility (Marginal Impact)**
     - Question: If we decline, is it likely that another funder would step in to fund this project? And if so, would our funding be marginal (adding something new) or moot (simply replacing other funds)?
     - Sufficient answer: 
       - For a saturated area (many funders): We must see that our funding is marginal (e.g., enables expansion to a new area, scales up in a way that wouldn't happen otherwise). If the project is likely to be fully funded by others, then our grant is moot and we should reject.
       - For a neglected area (few funders): Our funding is more likely to be marginal, so we pass unless there is clear evidence that others are about to fund it.
     - Failure: In a saturated area, if the project is likely to be funded by others and our grant doesn't add anything new, reject. In a neglected area, if we have reason to believe another funder is committed, reject. Otherwise, pass.
     - Note: Staff rarely know the funding landscape well. Therefore, we require a quick check (e.g., 5 minutes of web search, internal knowledge). If uncertain, proceed to the next step but flag for further due diligence if the proposal advances.

  4. **Addressing Institutional Critique (Causal and Epistemic)**
     - Question: For proposals that might have systemic effects (positive or negative), does the applicant address the potential for the intervention to either reinforce harmful systems (causal critique) or to be crowded out by the measurability bias (epistemic critique)? What can the applicant show?
     - For the causal form (reinforcing systems): The applicant should show awareness of potential negative systemic effects and how the intervention avoids them (e.g., by designing the program to not undermine long-term structural change) OR explain why the intervention is a necessary step within a broader strategy for change. If nothing can be shown, but the theory of change is strong and the problem urgent, we note the risk and proceed with caution.
     - For the epistemic form (crowding out): The applicant should show that there is a pipeline of similar proposals (indicating the field is healthy) or explain why this proposal is uniquely positioned to address an unmeasurable but critical outcome. If nothing can be shown, we note that the absence of competition is not evidence of lack of value and rely on the theory of change and urgency.
     - Sufficient answer: The proposal addresses both critiques, or at least one, with reasonable arguments. If it doesn't address them, but the proposal is otherwise strong, we do not reject solely on this basis. However, we note the gap for full proposal review.
     - Failure: This question does not lead to immediate rejection because these critiques are complex and may require more time. Instead, it flags risks.

  5. **Feasibility and Track Record**
     - Question: Does the applicant have a credible track record or, if new, a feasible plan for execution? For systemic change, track record might include past legislative wins or successful campaigns.
     - Sufficient answer: Evidence of past success in similar work or a well-thought-out plan for a new organization. For community organizing, this might be the organization's history of building power and winning campaigns.
     - Failure: No track record and no convincing plan, or a history of failure without lessons learned. Reject.

  6. **Values and Judgment Call (Explicit Mark)**
     - Question: Does the proposal align with our foundation's values? (This is a values call, not a technical one.)
     - Process: If the proposal passes the previous questions, but there is a values conflict (e.g., the approach is controversial within our foundation, or it targets an issue we've decided not to fund), then it must be escalated to a named decision-maker (e.g., the Director or a designated committee). The procedure stops here and hands the decision upward. The decision-maker must document the reason for rejection if it is a values call.
     - Note: This step is explicitly a values gate. If the proposal is rejected here, it is recorded as a values-based rejection, not a technical failure.

  **Rejection Points:**
  - Questions 1, 2, 3 (in some cases), and 5 have clear rejection criteria. Question 4 is a flag but not a rejection point in the LOI stage. Question 6 is an escalation for values.

  **Order Summary:**
  1. Problem Definition -> Reject if fail.
  2. Theory of Change -> Reject if fail.
  3. Counterfactual Fungibility -> Reject if in saturated area and not marginal, or in neglected area but likely funded by others.
  4. Institutional Critique -> Flag risks but do not reject at LOI.
  5. Feasibility -> Reject if fail.
  6. Values -> Escalate if passed all but values conflict.

  **Applying the Procedure to Three Cases:**

  Case 1: Deworming program in a region with two large funders, solid evidence, requesting expansion to a third country.

  - Q1: Clear problem (health, aligned). Pass.
  - Q2: Strong theory of change (evidence-based). Pass.
  - Q3: Counterfactual fungibility: Saturated area? Yes, two large funders. Is our funding marginal? They are expanding to a new country. If the other funders are not active in that country, then it might be marginal. But if they are, or if they would fund the expansion, then moot. Staff may not know. Given uncertainty, we pass to next step but flag for due diligence.
  - Q4: Institutional critique: This is a measurable intervention, so the epistemic critique applies (crowding out others). The proposal doesn't address this. Also, causal critique: does deworming prop up a failing health system? Unlikely to be addressed. Since it's a measurable intervention, we note the risk of crowding out but don't reject. Pass with note.
  - Q5: Solid evidence and track record. Pass.
  - Q6: No values conflict (assuming global health is a priority). Pass.

  Verdict: Pass (proceed to full proposal). But with a note on counterfactual fungibility and institutional critique for full review.

  Case 2: State-level campaign to reform public-housing law, by a coalition with credible track record, unmeasurable outcomes.

  - Q1: Clear problem (housing reform, aligned with domestic policy). Pass.
  - Q2: Theory of change: They have a credible track record and explain how organizing leads to legislative change, even if outcomes (bargaining power) are unmeasurable. Pass.
  - Q3: Counterfactual fungibility: Is this a saturated area? Probably not (policy reform is often underfunded). If we decline, would someone else fund it? Maybe, but not certain. Since it's a neglected area, we assume our funding is marginal unless we know otherwise. Pass.
  - Q4: Institutional critique:
    - Causal: Does this campaign address the root causes? They are directly challenging the system, so it's less likely to prop it up. They might not explicitly say, but their theory of change is about changing the system. Pass.
    - Epistemic: The proposal acknowledges unmeasurable outcomes and argues for their importance. They are in a field that might be crowded out by measurability bias. They have a track record, which shows the field is alive. Pass.
  - Q5: Credible track record of past wins. Pass.
  - Q6: Values: Assuming housing reform aligns, pass.

  Verdict: Pass (proceed to full proposal).

  Case 3: Well-run community organization with theory of change: "organizing builds organizing — capacity now, campaigns later, no specified later target."

  Design note: We want the verdict to be one the staff will dislike (i.e., reject) because they like the organization but the proposal is weak.

  - Q1: Problem: They might define a problem (e.g., lack of community power) but it's vague. Let's assume they say "building community power to address future issues" without specifying what issues. This is borderline. But if they don't define a clear, urgent problem, we can reject at Q1. Alternatively, if they say "systemic injustice" without specifics, we might pass Q1 but then fail at Q2.

  - Q2: Theory of change: They say "organizing builds organizing" but with no specified later target. This is a circular theory of change without a clear outcome. How does building capacity now lead to change? Without a plan for campaigns, it's just capacity building for its own sake. Failure: no plausible causal chain to real-world impact.

  - Therefore, at Q2: Fail -> Reject.

  Verdict: Reject. Staff may dislike it because the organization is well-run and honest, but the proposal does not articulate a theory of change that leads to impact.

  Why is this a feature? The procedure is designed to reject proposals that lack a clear causal logic, regardless of the organization's reputation. This avoids funding without a clear path to impact.

  **Limitations of the Procedure:**

  1. **Systematic Misfires:**
     - The procedure may reject strong systemic change proposals that are early-stage and lack a track record (if they don't pass Q5). But we require at least a feasible plan.
     - It may pass some measurable interventions that have negative systemic effects (causal critique) if the applicant doesn't address it (because Q4 is not a rejection point). We rely on full proposal review to catch this.
     - Counterfactual fungibility (Q3) is often guesswork. We might reject a proposal in a neglected area because we wrongly think others will fund it.

  2. **Judgment Calls Dressed as Arithmetic:**
     - Q3 (fungibility) is highly judgmental but framed as a fact-based question. We acknowledge that staff rarely know, so we allow passing with uncertainty.
     - Q4 (institutional critique) requires nuanced judgment about systemic effects, which is hard in 45 minutes.

  3. **What It Would Take to Do Better:**
     - For counterfactual fungibility, we would need dedicated staff to map funding landscapes and maintain relationships with other funders (time-intensive).
     - For the institutional critique, we would need expert reviews on systemic effects and long-term field building, which is beyond an LOI.
     - For theory of change, we might require more detailed logic models, but that would take more time than an LOI allows.

  The procedure is designed for speed and to avoid the worst biases, but it is not a substitute for deep due diligence at the full proposal stage.

  **Deliverable: Screening Procedure Document**

  [We now write the procedure as a working document.]
answer: |-
  ### Foundation LOI Screening Procedure: Balanced Impact Assessment  
  **Purpose:** To triage Letters of Inquiry (LOIs) in ≤45 minutes, balancing measurable cost-effectiveness with systemic-change potential, while avoiding measurability bias and lazy exemptions.  
  **Key Principles:**  
  - Early questions eliminate weak proposals quickly.  
  - Judgment calls (values) are explicitly flagged and escalated; technical rejections are fact-based.  
  - Systemic critiques are addressed without exempting proposals from scrutiny.  

  ---

  ### Ordered Screening Questions  
  *(Run in sequence; reject if any "Failure" condition is met. Time per LOI: 45 mins max.)*  

  1. **Problem-Mission Fit & Urgency**  
     - *Question:* Does the LOI define a clear problem within our portfolios (global health, domestic policy, community organizing) and justify its urgency?  
     - **Sufficient:** Problem is specific (e.g., "malaria in Region X," "eviction crisis in State Y"), and urgency is grounded in data/testimony (e.g., rising deaths, policy window).  
     - **Failure:** Vague problem ("injustice," "poverty") or no urgency rationale. *Reject.*  
     - *Why first?* Cheap to assess (5 mins). Knocks out misaligned or poorly defined LOIs.  

  2. **Theory of Change (ToC) Plausibility**  
     - *Question:* Does the LOI describe a logical causal chain from activities to outcomes, even if outcomes are unmeasurable?  
     - **Sufficient:** ToC has coherent steps (e.g., "train tenant leaders → mobilize rent strikes → pressure legislators → pass reform"). Unmeasurable outcomes (e.g., "bargaining power") must be plausibly linked to activities.  
     - **Failure:** ToC is circular, magical, or absent (e.g., "organizing builds capacity for future campaigns" without a pathway). *Reject.*  
     - *Why early?* Filters unserious proposals. Time: 10 mins.  

  3. **Counterfactual Fungibility (Marginal Impact)**  
     - *Question:* If we decline, is this project likely funded elsewhere? Would our grant add unique value?  
     - **Sufficient:**  
       - *Saturated area (many funders):* LOI shows our grant is marginal (e.g., "no other funder covers this geography/innovation").  
       - *Neglected area (few funders):* LOI argues our funding unlocks action (e.g., "only seed funder for this coalition").  
     - **Failure:**  
       - Saturated area + replaceable (e.g., identical program expansion in a well-funded field).  
       - Neglected area but other funders are confirmed (via 5-min staff check: internal knowledge, quick web scan).  
     - *Reject if failure.*  
     - *Honesty note:* Staff rarely know the landscape perfectly. If uncertain, pass to Q4 but flag.  

  4. **Institutional Critique Assessment**  
     - *Question:* Does the LOI engage with systemic risks? *Distinguish two forms:*  
       - **Causal critique (reinforcing systems):** Could this intervention stabilize harmful systems?  
         - *Applicant’s response:* Show awareness (e.g., "we partner with activists to avoid co-option") or offset strategy (e.g., "cash transfers + advocacy to fix root causes").  
       - **Epistemic critique (crowding out):** Is this proposal’s unmeasurability a barrier due to funding biases?  
         - *Applicant’s response:* Show field vitality (e.g., "3 similar groups working on this") or uniqueness (e.g., "only group targeting this unmeasurable outcome").  
     - **Sufficient:** Addresses one critique plausibly. No rejection for imperfect answers.  
     - **Failure:** Ignores both critiques *and* proposal is high-risk (e.g., measurable intervention in a fragile system without safeguards). *Reject only if high-risk + no engagement.*  
     - *When nothing can be shown:* Flag for full proposal but do not reject. Time: 15 mins.  

  5. **Feasibility & Track Record**  
     - *Question:* Can the applicant execute this?  
     - **Sufficient:** Past success in similar work (e.g., "won 3/5 housing campaigns") or clear plan for new actors (e.g., "staff have 10+ yrs experience; milestones for Year 1").  
     - **Failure:** No track record + no credible plan, or history of failures without lessons. *Reject.*  
     - *Why late?* Resource-intensive; only assess if LOI passes Q1–Q4. Time: 10 mins.  

  6. **Values Gate (Judgment Call)**  
     - *Question:* Does this align with our foundation’s values?  
     - **Process:** If Q1–Q5 pass, but values conflict arises (e.g., controversial tactics, portfolio priorities), escalate to named decision-maker (e.g., Director).  
     - **Outcome:**  
       - Values rejection: Documented by decision-maker (e.g., "Rejected: tactic conflicts with foundation nonviolence principle").  
       - Not a failure of LOI; do not disguise as technical rejection.  
     - *Explicit mark:* This is the only values step. Technical rejections happen in Q1–Q5.  

  ---

  ### Case Applications  
  **Case 1: Deworming Program Expansion**  
  - **Q1:** Pass. Clear problem (parasite prevalence) + urgency (data on child health impacts).  
  - **Q2:** Pass. Strong ToC (nets → reduced infection → school attendance).  
  - **Q3:** **Failure.** Saturated area (2 large funders). Expansion to third country likely funded by others; no unique marginal value shown.  
  - *Verdict:* Reject at Q3.  
  - **Why staff might dislike:** Solid evidence, but procedure catches fungibility.  

  **Case 2: Public-Housing Law Reform Campaign**  
  - **Q1:** Pass. Specific problem (e.g., "retaliatory evictions in State X") + urgency (rising homelessness stats).  
  - **Q2:** Pass. Plausible ToC (organizing → tenant pressure → legislative change), despite unmeasurable outcomes.  
  - **Q3:** Pass. Neglected area (policy reform); no evidence others would fund.  
  - **Q4:** Pass. Addresses causal critique ("reforms dismantle racist systems"); epistemic critique noted but field is active (track record shows vitality).  
  - **Q5:** Pass. Credible track record (past legislative wins).  
  - **Q6:** Pass (no values conflict).  
  - *Verdict:* Pass to full proposal.  
  - **Why staff might dislike:** Unmeasurable outcomes, but procedure validates systemic approach.  

  **Case 3: Community Organizing (Capacity-Building Only)**  
  - *Design:* Well-run group; theory is "organizing builds capacity for future campaigns," no target specified.  
  - **Q1:** Pass. Problem defined ("lack of tenant power in City Z").  
  - **Q2:** **Failure.** ToC is circular ("capacity enables capacity"); no causal link to tangible outcomes.  
  - *Verdict:* Reject at Q2.  
  - **Why staff dislike:** Trusted group, but proposal lacks substance.  
  - **Feature or misfire?** Feature. Procedure catches weak ToCs regardless of reputation. *How to tell:* Rejection is technical (Q2 failure), not values. Misfire would reject a strong ToC on biased grounds (e.g., "unmeasurable so fail").  

  ---

  ### What This Procedure Cannot Do  
  **Systematic Limitations:**  
  1. **Q3 (Fungibility):** Guesswork dominates. Staff lack data on funding landscapes → may reject good marginal projects or fund replaceable ones.  
     - *To fix:* Dedicated staff to map funders (cost: 1 FTE + $50K data tools).  
  2. **Q4 (Institutional Critique):** Judgment dressed as analysis. Causal critique assessments are speculative; epistemic critique relies on applicant’s unverified claims.  
     - *To fix:* External experts per proposal (cost: 10 hrs/LOI; impractical).  
  3. **Values/Q6:** Personal biases may influence escalation. Transparency (naming decision-makers) mitigates but won’t eliminate this.  

  **Inherent Trade-offs:**  
  - Speed (45 mins/LOI) sacrifices depth. Full proposals must address gaps.  
  - Systemic proposals still disadvantaged in Q4 (harder to "show" critiques), but not auto-rejected.  
  - Measurable interventions not auto-rewarded; Q3 fungibility check levels the field.  

  **Critical Distinctions Simplified (For Program Officers):**  
  - **Causal vs. Epistemic Critique:**  
    - Causal = "Does this band-aid make the wound worse?" (e.g., food aid propping up dictators).  
    - Epistemic = "Are we only funding band-aids because stitches are harder to measure?" (e.g., no one proposes systemic fixes anymore).  
  - **Measurement vs. Value:**  
    - Measurement = "Can we count it?" (fact).  
    - Value = "Should we fund it?" (judgment).  
  - **Marginal vs. Replaceable Funding:**  
    - Marginal = "Without us, this doesn’t happen."  
    - Replaceable = "Someone else will pay; our grant changes nothing."  

  **Final Note:** This is not a scorecard. It forces explicit reasoning where bias lurks. If staff can’t state these distinctions, retrain them—otherwise, the procedure becomes the very EA machine it was designed to correct.  

  ---  
  **Deliverable End**  
  *Foundation staff: Use this as a live template. Revise annually with Director input.*
