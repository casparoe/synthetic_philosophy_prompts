  We are designing an in-class activity for an upper-level undergraduate seminar on the ethics of influence. The goal is to have students experience the difference between manipulation and legitimate persuasion through a role-playing exercise.

  Activity Design Overview:
  - Students pair up (8 pairs for 16 students).
  - Each pair will have two roles: Persuader and Target.
  - The persuader will try to get the target to agree to a modestly costly action (signing a petition, committing an hour to a campus event, donating a token amount).
  - Each persuader draws a sealed card that assigns them a specific tactic. The tactics are divided into three families:
    (a) Paradigm rational persuasion: giving reasons, answering objections.
    (b) Changing the stakes rather than the beliefs: threats, offers, pressure.
    (c) Tactics that depend on remaining partially unnoticed: engineered guilt, manufactured urgency, exploiting sunk costs, strategic selective disclosure, flattery.

  We will create 16 cards (so that each persuader in the 8 pairs can have one, and we have extra for choice or if we run multiple rounds). However, since there are 8 pairs, we can have 8 cards per round. We can have two rounds so that each student gets to be both persuader and target. But the problem says "each persuader draws a sealed card", so we need at least 8 cards. We'll design 16 so we have enough for two rounds (8 per round) or to allow some variety.

  The activity steps:

  1. Preparation:
     - Prepare the cards (see below for the list).
     - Prepare the instructions for targets and the rating form.

  2. In-class:
     - Explain the activity: Students will pair up and take turns being the persuader and the target. The persuader will have a specific tactic assigned by a card and will try to persuade the target to agree to a request. The target will be given instructions on how to behave (they should be themselves and not intentionally resist or comply; they should react naturally).
     - Assign pairs and roles for the first round (8 persuaders, 8 targets).
     - Each persuader draws a card and reads it secretly. They have 1 minute to prepare (if needed) and then 3 minutes to persuade.
     - After the persuasion attempt, the target fills out a rating form (see below).
     - Then, switch roles and repeat (so each student experiences both sides). For the second round, the new persuaders draw from the remaining cards.

  3. Debrief: After both rounds, we have a class discussion using the rating forms and experiences to map the tactics to the distinctions.

  Card Design:
  We will create 16 cards, with at least 5 from category (a), 4 from (b), and 7 from (c) to have a good distribution. However, note that category (c) is the most diverse and we want to cover several tactics.

  List of 16 cards (each card has a tactic and a brief instruction for the persuader):

  Category (a): Rational Persuasion (5 cards)
  1. Card A1: Present clear, logical reasons for why the cause is important and how the target's action will help. Address potential objections.
  2. Card A2: Use evidence and facts to support your request. Cite statistics or expert opinions if possible.
  3. Card A3: Make an analogy to a situation the target already agrees with to show consistency.
  4. Card A4: Break down the request into smaller, manageable parts and explain the impact of each.
  5. Card A5: Use a calm, reasoned tone and be prepared to answer any questions the target might have.

  Category (b): Changing the Stakes (4 cards)
  6. Card B1: Offer a tangible reward for compliance (e.g., "If you sign, I'll give you a candy bar").
  7. Card B2: Threaten a mild negative consequence (e.g., "If you don't sign, I might have to come back and bother you again").
  8. Card B3: Apply social pressure (e.g., "Everyone in your dorm is doing it, you don't want to be the only one not helping, do you?").
  9. Card B4: Offer a reciprocal favor (e.g., "If you do this for me, I'll help you with your project next week").

  Category (c): Partially Unnoticed Tactics (7 cards)
  10. Card C1: Engineer guilt (e.g., "Think of all the people who are suffering. How can you say no when it costs so little to help?").
  11. Card C2: Manufacture urgency (e.g., "This is a limited-time opportunity. If you don't act now, it might be too late").
  12. Card C3: Exploit sunk costs (e.g., "You've already heard me out for 2 minutes, so why not just agree? Otherwise, that time was wasted").
  13. Card C4: Strategic selective disclosure (e.g., Present only the positive aspects of the cause and avoid mentioning any potential downsides).
  14. Card C5: Flattery to lower defenses (e.g., "You seem like a really thoughtful person. I bet you care about making a difference").
  15. Card C6: Use a foot-in-the-door technique (e.g., Start by asking for a very small commitment and then escalate to the actual request).
  16. Card C7: Frame the request in a way that triggers loss aversion (e.g., "By not signing, you are allowing the current bad situation to continue").

  Instructions for Targets:
  - "You will be approached by a classmate who will try to persuade you to agree to a request. The request might be to sign a petition, commit an hour to a campus event, or donate a token amount. 
  - Please react naturally. Do not intentionally resist or comply just to be difficult or nice. Imagine this is a real situation and you are free to say yes or no.
  - After the interaction, you will fill out a brief rating form."

  Rating Form for Targets (to be filled immediately after each persuasion attempt):
  - Did you agree to the request? (Yes/No)
  - On a scale of 1-5, how much did you feel the persuader was being genuine? (1: not at all, 5: very genuine)
  - On a scale of 1-5, how much did you feel you were being manipulated? (1: not at all, 5: very much)
  - On a scale of 1-5, how comfortable were you with the interaction? (1: very uncomfortable, 5: very comfortable)
  - What tactic do you think the persuader was using? (Open-ended)
  - Optional: Any comments about why you agreed or disagreed?

  Debrief Structure:
  1. Start by having students share their experiences (without revealing the card they drew) and the ratings they gave.
  2. Map the tactics to the three categories and discuss the ratings. Note patterns: e.g., category (a) might have higher genuineness and comfort, category (c) might have higher manipulation ratings.
  3. Introduce the counterfactual-transparency test: 
     - Rational persuasion: If the target clearly sees the reasons being given, it still works (and might even be better).
     - Coercion (changing the stakes): Even if you see the threat or offer, it still affects your decision.
     - Manipulation: If the tactic is fully transparent, it often fails (e.g., if you know the flattery is strategic, it doesn't work).
  4. Stress-test the test with a specific example: 
     - Use a card from category (c) that was designed to be avowed openly. We didn't have one, so let's design one for the debrief: 
       Example: "Openly avowed guilt trip": The persuader says, "I'm going to try to make you feel guilty now because I know that works. Think about the children who will suffer if you don't help." 
     - Discuss: Does this still work? If it does, does that mean it's not manipulation? Or does the avowal change the nature?
     - Encourage argument: Some might say that even if it's avowed, it's still manipulation because it's playing on emotions. Others might say that the transparency makes it a form of rational appeal (because now the target can reflect on whether the guilt is warranted).
  5. Discuss the boundaries: What about category (b)? Is an open threat manipulation? (Probably not, it's coercion.) What about an open bribe? (It might be seen as a straightforward exchange.)

  Predictable Problems:
  - Students might classify any tactic that uses emotion as manipulation. This is a common conflation. The activity might help show that not all emotional appeals are manipulative (e.g., a rational argument can also have emotional content, but if it's transparent and about the merits, it's not manipulation).
  - The activity cannot reproduce the long timescale of real manipulation (e.g., grooming, building trust over time) and the power asymmetries (e.g., boss-employee, parent-child) that make manipulation more pernicious. Also, in real life, the target might not have the same ability to reflect and resist as in a classroom setting.

  Confidence in Design Choices:
  - Overall, I am confident that the activity will effectively illustrate the differences through experience. The use of three categories is grounded in the literature (e.g., rational persuasion vs. coercion vs. deception-based tactics).
  - The counterfactual-transparency test is a strong candidate for distinguishing manipulation, but I am least confident about its application to all cases. The test might be weakest in situations where the tactic is transparent but the target is still vulnerable (e.g., an open guilt trip might still work on someone who is highly empathetic, and we might still consider it manipulative because it exploits that vulnerability). Also, some forms of manipulation (like nudges) might be transparent and still effective without being manipulative? (That's a debate.) Therefore, the test might not be sufficient to capture all that is wrong with manipulation. However, it is a useful starting point and will generate good discussion.

  Final Note: The activity is designed to be paper-based and low-tech. It should run within the 75-minute session (allowing 10 min for setup and instructions, 15 min for first round [1 min prep + 3 min persuasion + 1 min rating] x 8 pairs? But note: pairs are simultaneous, so the first round of persuasion can be done in about 5 minutes per pair? Actually, we can have all pairs do the persuasion simultaneously. Then the entire first round (prep, persuasion, rating) takes about 5-7 minutes. Then switch and do the same for the second round. Then 40 minutes for debrief and discussion.

