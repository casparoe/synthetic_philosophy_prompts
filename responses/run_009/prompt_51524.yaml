  - Round 1: 8 min (1 min prep, 3 min persuasion, 4 min for rating? But rating is quick. We can do: 1 min prep, 3 min persuasion, then 2 min for each target to fill the form -> total 6 min per round). Actually, we can do:
    - Simultaneous: All persuaders get 1 min to read card and prepare (while targets wait). Then 3 min for persuasion (all pairs at once). Then 2 min for targets to fill the form. Total per round: 6 min.
  - Round 2: 6 min (same)
  - Debrief: 50 min (allowing for a rich discussion)

