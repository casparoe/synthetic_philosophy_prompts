prompt: |-
  So a few weeks ago I got sucked into Hofstadter's old Scientific American columns on superrationality (they're reprinted in Metamagical Themas) and I can't stop poking at them. The two classics: in the Platonia dilemma, twenty people are told that if exactly one of them sends a telegram by the deadline, that lone sender gets a billion dollars, and if zero or more than one telegram arrives, nobody gets anything -- and Hofstadter's claim is that a superrational thinker, knowing all twenty think alike, should send a telegram with probability exactly 1/20. Then the Luring Lottery, where the prize is a million dollars divided by the total number of entries, a random entry wins, and readers were explicitly allowed to enter with any positive integer -- so superrational readers were supposed to each submit a single entry, while actual readers submitted googolplexes and torched the prize to a fraction of a cent. The core idea, as I understand it, is that a superrational thinker includes in her calculation the fact that she's in a group of superrational thinkers who will converge on the same answer she does -- so she can pick the strategy as if choosing for the whole group. Fine. Here's what's been nagging me: the whole apparatus seems to presuppose that the symmetry class is the whole relevant population. Nobody seems to have asked what happens when there's an *outside* party who understands all this and isn't playing along.

  Here's the ask. I'm writing a blog post arguing that superrationality, whatever its merits in a sealed room of idealized twins, is brittle in the wild -- and I want a centerpiece thought experiment, built to spec. Construct a scenario in which a community of genuine superrationalists gets systematically exploited by an outside party who has modeled their superrationality, and ends up strictly worse off than an otherwise identical community of boring old causal-decision-theory agents facing the same setup would. Constraints: keep it realistic (a fundraiser, a subscription drive, a platform's onboarding scheme, a community raffle -- nothing sci-fi, no demons, no perfect predictors, and the outside party can be no cleverer than a shrewd fundraiser or product designer who's read the same Hofstadter columns), and the exploitation must fall out of the structural features of superrationality itself -- the symmetry assumption, the common knowledge that everyone in the group reasons alike, the treating of one's own choice as informative about the group's -- and not from the group being dumb or having adopted a badly calibrated convention. To be clear what counts as cheating, since this is for the blog post: you can't just stipulate that the superrationalists lose; the walkthrough has to *generate* the loss from the theory.

  After the scenario, do the demonstration part: walk through what the superrationalists do and why, what plain causal-decision agents would do in the same position and what they'd walk away with, and identify exactly which structural feature of superrationality is doing the work. Then stress-test it -- what happens if the symmetry is diluted even slightly (one closet defector in the group, or members merely suspecting one exists), and does the exploitation survive that? Finally give Hofstadter's best defense his due: he'd presumably say superrationality was never meant to apply to interactions with non-superrational outsiders, the fundraiser isn't in the symmetry class, etc. -- and then tell me honestly whether that defense actually blocks the case you built, or just reclassifies the damage. If you can, also say whether the case generalizes: is this a one-off trick or does it suggest that any tightly-knit community of likeminded deliberators is a resource someone can farm?
reasoning: |-
  We are constructing a scenario where a community of superrationalists is exploited by an outside party. The key is to have an interaction where the superrationalists, by virtue of their reasoning (which assumes symmetry within their group and that they all reason the same way), end up worse off than causal decision theory (CDT) agents would in the same situation.

  Scenario: The "Community Fundraiser"

  Setup:
  - An outside party (OP) is organizing a fundraiser for a public good (e.g., a community park). The park will be built only if at least a fixed amount T is raised. However, the OP designs the fundraiser in a way that exploits superrationality.

  Mechanism:
  1. The OP invites a community of 100 superrationalists (SRs) to contribute.
  2. Each SR can choose to contribute any integer amount between $0 and $100.
  3. The total contributions are collected, and if the total is at least T (say, $5000), then the park is built and every contributor (including those who gave $0) gets an additional fixed benefit B (say, $200) worth of enjoyment from the park. If the total is below T, no park is built and no one gets the benefit.
  4. The twist: the OP announces that they will match the total contributions by the SRs, but only if the total contributions by the SRs are exactly $2500. If the total is not exactly $2500, no matching occurs.

  So, the park is built if:
     (Total contributions by SRs) + (Matching if applicable) >= T.
  Since T is $5000, if the SRs contribute exactly $2500 and the OP matches with another $2500, then the total is $5000 and the park is built. Otherwise, if they contribute less than $2500, the park isn't built because even with matching (which doesn't happen) they wouldn't reach $5000, and if they contribute more than $2500, they might still build the park without matching if they hit $5000 on their own (but that would require each contributing on average $50, which is more than the matching scenario). However, note that if they contribute exactly $2500 and get the match, they build the park at a cost of only $25 per person on average (since 100 people share $2500). But if they contribute more than $2500, they might build the park without the match (if they hit $5000) but at a higher per-person cost.

  However, to make the exploitation clear, let's adjust the parameters so that the matching is the only feasible way to get the park built without excessive contributions. Specifically:

  - Set T = $5000.
  - Without matching, the SRs would need to raise $5000 by themselves, which is $50 per person on average. With matching, they only need to raise $2500 (so $25 per person) and the OP adds $2500.

  But note: the OP's matching is conditional on the total being exactly $2500.

  Now, what happens with superrationalists?

  Superrationalist reasoning:
  - Each SR knows that they are all identical and will reason the same way. Therefore, they will all choose the same contribution amount, say x (which might be 0 or positive).
  - The total contribution will then be 100x.
  - The park will be built if:
     (a) 100x + 2500 >= 5000 (if they get the match) OR 
     (b) 100x >= 5000 (if they don't get the match).
    But note: the match only happens if 100x = 2500, i.e., x = 25.

  So let's break down:

  Case 1: If they all contribute x, then:
     - If x = 25, then total = 2500 -> match kicks in -> total becomes 5000 -> park built. Each pays $25 and gets $200 benefit, so net gain: $175.
     - If x ≠ 25, then no match. Then the park is built only if 100x >= 5000, i.e., x>=50. In that case, each pays at least $50 and gets $200, so net gain at least $150. But if x<50, the park isn't built, so they lose the $x they contributed and get nothing.

  The superrationalists will reason as follows:
     We (the group) have two symmetric equilibria:
        (i) All contribute 25: then we get the park at a cost of $25 each -> net $175.
        (ii) All contribute 50: then we get the park at a cost of $50 each -> net $150.

  Clearly, (i) is better. But note: if they try to coordinate on $25, they must all choose exactly 25. If even one person deviates (say, gives 26 or 24), then the total is not 2500 and the match is lost. Then the total would be 100*25 = 2500? Wait, if one deviates then the total is 2500 ± 1, which is not 2500. So the match is lost, and then 2500±1 < 5000 -> park not built. So that one deviation would ruin it for everyone.

  But wait: superrationalists are not necessarily playing a coordination game with perfect precision? How does Hofstadter handle continuous choices? In the Platonia dilemma, they use a mixed strategy with exact probability. Here, we have discrete contributions. However, the SRs might reason that they must all choose exactly 25. They know that each of them, being identical, will choose the same number. So they can choose 25 and expect the others to do the same. The problem is that if they are not perfectly symmetric (which we are assuming they are) then they all set x=25 and the total is 2500.

  So they will all choose 25 and get the park built with the match, and each gets $175.

  But note: the OP is the outside party and has set the trap. The OP never intended to actually pay the matching funds. How? The OP might be a fraud. But we want to avoid fraud? Let's adjust: the OP is honest but designs the matching condition to be very hard to hit. However, with superrationalists, they do hit it. So the OP must pay $2500. Then the OP is out $2500? That doesn't exploit the SRs; it exploits the OP.

  We need to flip it so that the OP benefits from the SRs' behavior and the SRs are worse off.

  Revised scenario: The OP is not matching for free. Instead, the OP is taking a cut. But how?

  Alternative: The OP is running a lottery or a subscription service.

  Scenario: "The Subscription Wall"

  Setup:
  - An online platform (the OP) offers a premium service. The service costs $C per month to run per subscriber, but the OP sets the price in a way that depends on the total number of subscribers in a manner that exploits superrationality.

  Mechanism:
  1. The OP announces that the price for the premium service for the next month will be set to $100 / (total number of subscribers) per subscriber. But there's a catch: the service will only be activated if the total number of subscribers is exactly 100. If the number is not 100, then the service is not activated and no one is charged.

  2. The benefit to a subscriber: if the service is activated, each subscriber gets a benefit worth $B (say, $2) from using the service for that month. But they pay the price $100/(total subscribers) = $100/100 = $1 if the total is exactly 100.

  3. So if the service is activated, each subscriber gets net benefit: $2 - $1 = $1.

  4. If the total number of subscribers is not exactly 100, then the service is not activated and no one pays or gets the benefit.

  Now, there is a community of 1000 potential users, but among them there is a subgroup of 100 superrationalists (SRs). The rest are either not interested or are causal decision theorists (CDTs) who will only subscribe if they individually expect a positive net benefit.

  The OP expects that the SRs will reason as follows:

  Superrationalist reasoning (among the 100 SRs):
  - They are symmetric and will all make the same decision. So they consider two possibilities: either all 100 of them subscribe or none do.
  - If all 100 subscribe, then the total is 100, so the service is activated. Each pays $1 and gets $2, so net $1.
  - If none of them subscribes, then the total is 0 (or whatever others do, but since the condition is exact 100, and without the SRs, we assume the CDTs are not going to hit 100 exactly) so the service is not activated and they get 0.

  Therefore, they prefer to subscribe and get $1.

  So they all subscribe.

  But note: the OP designed the price so that when 100 people subscribe, the OP collects $100 in total (since each pays $1). The cost to the OP for serving 100 subscribers is 100 * $C. We set C such that the OP makes a profit. For example, if C=$0.50, then OP's cost is $50 and revenue is $100, so profit $50.

  But what about the CDTs? The OP doesn't care about them in this scenario because the condition is exactly 100, and the CDTs are not coordinated. They might subscribe only if they think the total will be 100. But without coordination, the chance of exactly 100 subscriptions from CDTs is negligible. So the only way to get the service is via the coordinated SRs.

  However, the SRs are happy: they get $1 each. The OP is happy: they get $50 profit.

  But we want the SRs to be worse off than if they were CDTs. In this setup, if the SRs were CDTs, they would not subscribe because individually, one CDT cannot affect the total. If a CDT considers subscribing, they note that unless their subscription makes the total exactly 100, they will pay nothing and get nothing. But the probability that without them the total is 99 is negligible (since without them, the total is determined by the other 999 users, but we have only 100 SRs and 900 others? Let me adjust the population).

  Wait, we have 1000 potential users including 100 SRs. But if the SRs are replaced by CDTs, then each CDT would think: "My subscription only matters if the total without me is 99. But the chance of that is very low because there are 999 other users and they subscribe independently with some unknown probability." So they would not subscribe. Hence, the service would not be activated and they would get 0.

  So the SRs get $1 while the CDTs in their position would get 0. This is better for the SRs.

  We need to flip it so that the SRs end up worse off.

  Revised twist: The OP sets the price per subscriber to be $1000 / (total number of subscribers) and requires the total to be exactly 100. Then if 100 subscribe, each pays $10. The benefit is still $2. Then each subscriber nets $2 - $10 = -$8, a loss.

  But then, the SRs would reason: if we all subscribe, we each lose $8. If none of us subscribes, we get 0. So they would choose not to subscribe. So they avoid the loss.

  We need a situation where the SRs are induced to subscribe even though it leads to a loss, but CDTs would avoid it.

  How about making the benefit dependent on the total? Or use a different scheme.

  Alternative scenario: "The Matching Donation with a Twist"

  Setup:
  - The OP is a charity. They announce a matching donation challenge: if the community raises $X, then the OP will donate $M. But the twist is that the OP sets a very specific condition: the total donation from the community must be exactly $X, and if it is, then the OP donates $M. Otherwise, the OP donates nothing.

  - The charity project: if the total donation (community + OP) is at least $Y, then a project is done that gives each donor (and non-donors in the community) a benefit $B. But note: the benefit is public good.

  - The community has 100 members, all superrationalists.

  - Each member can donate any amount, but they are symmetric. Let $X be set to $2500 and $M = $2500. And $Y = $5000.

  So, if the community donates exactly $2500, then OP donates $2500 -> total $5000 -> project done -> everyone gets benefit $B (say $100). Each donor also loses the amount they donated.

  But note: non-donors also get the benefit. So there's a free-rider problem. However, the superrationalists are symmetric and will all donate the same amount. Let that amount be d.

  Then total donation = 100d.

  Condition for OP match: 100d = 2500 -> d = $25.

  Then total funds = 2500 (community) + 2500 (OP) = $5000 >= Y -> project done.

  Each member: pays d=$25, gets benefit $100 -> net $75.

  If they don't hit exactly $2500, then no OP donation. Then the project is done only if 100d >=5000, i.e., d>=50. Then each pays at least $50 and gets $100 -> net at least $50.

  But if d<50, then project not done, and they lose d.

  The SRs will choose d=25 and get net $75.

  Again, they are better off.

  The exploitation by OP is not evident.

  We need to make the OP benefit from the SRs' donations. How about if the OP keeps the donations if the condition is not met? But that would be fraudulent. Instead, let's make the OP a platform that takes a cut.

  Scenario: "The Concert Ticket Fiasco"

  Setup:
  - An event organizer (OP) wants to hold a concert. The cost of the concert is fixed at $C_total. The OP decides to use a tiered pricing scheme that depends on the number of tickets sold, but with a twist.

  Mechanism:
  - The OP announces that if exactly 100 tickets are sold, then the price per ticket will be $P_low (say, $50). 
  - If more than 100 tickets are sold, the price per ticket will be $P_high (say, $200). 
  - If less than 100 are sold, the concert is canceled and everyone is refunded.

  But wait, how can the price depend on the number sold? Actually, it's more like: the OP sets the price based on the total sales. But the twist is that the price is the same for everyone, and it is set after the sales? That doesn't work because then people don't know the price when they buy.

  Instead, we can do:

  - The OP sets a rule: the concert will be held only if at least 100 tickets are sold. And the price per ticket is set as follows:
     - If the total number of tickets sold is exactly 100, then each ticket costs $50.
     - If the total number of tickets sold is more than 100, then each ticket costs $200.

  But that seems odd: why would someone pay more if more tickets are sold? It should be the opposite for normal demand. But we are constructing a trap.

  Alternatively, we can think of it as a group discount that turns into a penalty for over-subscription.

  But let's design it so that the superrationalists are induced to buy tickets at a high price when they could have avoided it.

  New idea: "The Limited Edition Trap"

  The OP sells a limited edition item. They announce:

  - Only 100 items will be produced, and they are sold at a base price of $100 each.
  - However, if all 100 items are sold, then a special bonus is activated: the OP will give a rebate to each buyer such that the net price becomes $50 (so a $50 rebate per item).
  - If even one item is not sold, then no rebate and everyone pays the full $100.

  There is a community of 100 superrationalists who value the item at $V (say, $150). 

  So for an SR, if they buy and the bonus is activated (i.e., all 100 are sold), then they pay $50 and get an item worth $150 -> net $100.
  If they buy and the bonus is not activated, then they pay $100 and get $150 -> net $50.
  If they don't buy, they get 0.

  But note: the bonus is activated only if all 100 buy.

  Superrationalist reasoning:
  - They are all identical. So either all buy or none buy.
  - If all buy, then each gets net $100.
  - If none buy, then they get 0.
  - So they should all buy, and each gets $100.

  But what if one defects? Then that defector would not buy, so the bonus is not activated. The defector gets 0, while the 99 buyers each get $50 (because they paid $100 and value at $150, but no rebate). So the defector gets less than if they had bought (0 < $50) but also the group is worse off. But in the symmetric equilibrium, they all buy.

  Now, the OP has sold 100 items at $100 each, and then gives a rebate of $50 per item, so the OP nets $50 per item, total $5000.

  But the SRs are happy: they got $100 net.

  We want them to be unhappy. So we need to set the value V lower. Set V = $120.

  Then:
  - If all buy and get the rebate: net = $120 - $50 = $70.
  - If all buy and no rebate: net = $120 - $100 = $20.

  But they expect the rebate because they all buy, so they expect $70.

  But wait, the OP might be malicious: what if the OP does not give the rebate even if all 100 are sold? But that's fraud. We want honest OP.

  Alternatively, the OP sets the rebate in such a way that it is not funded by the OP but by the buyers themselves? That doesn't work.

  Another idea: the bonus is funded by the buyers. For example, the OP says: if all 100 items are sold, then the total revenue ($100*100=$10,000) will be used to give a rebate of $50 per buyer, so the net price is $50. But then the OP only nets $50 per item. Same as above.

  But then the SRs are still getting a net benefit of $70 (if V=$120) which is positive.

  To make it a loss, set the base price high enough so that even with the rebate, the net cost is above the value. For example, set the base price to $180, rebate to $130 if all 100 sell (so net $50), and set V=$40. Then:

  - If all buy: net = $40 - $50 = -$10 (loss).
  - If not all buy: then no rebate, and if an individual buys, they pay $180 for something worth $40 -> loss of $140.

  Then the SRs, reasoning that they will either all buy or not, compare:
     all buy: each loses $10.
     none buy: 0.
  So they choose not to buy.

  Avoided the trap.

  We need a scenario where the superrationalists are led to participate in a loss-making venture because of their symmetry assumption, while CDTs would not.

  Eureka: combine the subscription with the risk of loss when the group is too large.

  Scenario: "The Overcrowded Lecture"

  Setup:
  - An educational platform (OP) offers a live online lecture. The lecture is free to attend, but there's a catch: if the number of attendees exceeds the capacity C, then the lecture is canceled and instead, each attendee is charged a penalty fee of $F.

  - The platform sets the capacity C=100.

  - The benefit of attending the lecture is $B (say, $50) if it happens. If it is canceled, there's no benefit and you pay the penalty fee.

  - The penalty fee F is set to $60.

  - The lecture is only canceled if the number of attendees >100.

  - There are exactly 101 potential attendees who are interested: 100 superrationalists and 1 causal decision theorist (CDT). But wait, we want to compare SRs to a community of CDTs. So let's have two parallel worlds: one with 101 SRs and one with 101 CDTs.

  - The OP wants to collect the penalty fees.

  Superrationalists (101 SRs):

  They will all think alike. They know that if they all attend, then the number of attendees is 101 > 100 -> lecture canceled -> each charged $60 and gets no benefit -> net -$60.

  If none of them attend, then the number of attendees is 0 -> lecture happens (or is it canceled? The lecture is canceled only if >100, so 0<=100, so lecture happens. But if none of them attend, then they don't get the benefit. So net 0.

  But what if some attend and some don't? They are symmetric, so they must all do the same. So only two symmetric options: all attend or none attend.

  - All attend: net -$60.
  - None attend: net 0.

  So they choose not to attend. Then they get 0.

  But then the OP doesn't get the penalty. How to lure them in? We need a positive benefit in the case the lecture happens and they attend.

  But if they all attend, the lecture is canceled and they get penalized. If they all stay home, they get 0.

  The only way to get the benefit is if exactly <=100 attend. But there are 101 SRs. So if they all randomize with probability p, then the total number is binomial(101, p). The chance of exactly 100 or less is high when p is small, but they want to maximize the chance of being in a lecture that happens.

  This is getting complex.

  Another idea: "The Exploding Offer"

  The OP announces a limited-time offer to the community of 100 superrationalists:

  - Each member can either accept or decline the offer.
  - If exactly K of you accept, then each who accepts gets a reward R.
  - If the number of acceptances is not exactly K, then each who accept pays a penalty P.

  The OP sets K=100, R=0, and P= positive (say $100). Then:

  - If all 100 accept, then each gets 0.
  - If not all accept, then every acceptor pays $100.

  The SRs will reason: they are symmetric. So either all accept or none accept.
  - If all accept, outcome: 0.
  - If none accept, outcome: 0.

  So they are indifferent. They might choose to accept or not. But if they choose to accept, then if one of them defects and does not accept, that defector gets 0 while the 99 acceptors each lose $100. So they might choose not to accept.

  But then the OP gets nothing.

  We want the OP to collect the penalty. So set R to be negative? That doesn't work.

  Let me try:

  - Set K=99.
  - R = $1.
  - P = $100.

  Then for the 100 SRs:

  They know that they are 100 symmetric individuals. They will all choose the same action. So either all accept or all decline.

  - If all accept: then the number of acceptances is 100, which is not 99 -> penalty. Each acceptor pays $100 -> net -$100.
  - If all decline: net 0.

  So they choose to decline.

  But if they could coordinate to have exactly 99 accept, then the 99 would get $1 and the one who declines gets 0. But they can't coordinate individually. In the symmetry of superrationality, they all must do the same. So they cannot have exactly 99.

  Therefore, they avoid the trap.

  This is not working.

  I recall that in the Luring Lottery, the superrationalists were supposed to enter once. But in that case, the prize was shared by the number of entries. So if they all enter once, they get $1e6 / N, where N is the number of superrationalists. But if they enter multiple times, they might get more but then the prize is shared more. The OP didn't do anything malicious; the prize was fixed. The problem was that non-superrationalists entered many times and made the prize very small.

  So for our purpose, we want an outside party to design a game where the superrationalists' behavior (entering once) is exploited.

  Let's try a variation of the Luring Lottery, but where the outside party takes a cut.

  Scenario: "The Charity Raffle"

  - The OP (a charity) holds a raffle. The prize is $1,000,000.
  - The winner is drawn at random from all entries.
  - However, the charity announces that for administrative costs, they will keep 50% of the total entry fees. The remaining 50% will be added to the prize. But then the prize is the initial $1,000,000 plus half of the entry fees.
  - Each entry costs $1.

  Now, there are 1000 superrationalists who are potential participants. They all have the same reasoning.

  Superrationalist reasoning:
  - They are symmetric. So they will each buy the same number of tickets, say n.
  - The total number of tickets purchased by them is N = 1000 * n.
  - The prize pool is $1,000,000 + 0.5 * N (because the charity adds half of the entry fees N).
  - The probability that any particular ticket wins is 1/N.
  - The expected value of a ticket is [1,000,000 + 0.5*N] / N = 1,000,000/N + 0.5.
  - The cost of a ticket is $1.
  - So the expected net gain per ticket is: 1,000,000/N + 0.5 - 1 = 1,000,000/N - 0.5.

  Now, each SR buys n tickets. Their total expected net gain is:
     n * [1,000,000/N - 0.5] = n * [1,000,000/(1000n) - 0.5] = n * [1000/n - 0.5] = 1000 - 0.5n.

  This is decreasing in n. So to maximize their expected net gain, they would choose n=1 (the minimum). Then total expected net gain per SR: 1000 - 0.5*1 = $999.5.

  But wait, this is positive. The charity collects $1000 from the SRs (since 1000*$1=$1000), keeps $500, and adds $500 to the prize. The prize becomes $1,000,500. One SR wins, but the expected return per SR is $1,000,500 / 1000 = $1000.5, but then subtract the $1 they paid? Actually, each SR has an expected gain of (1/1000)*1,000,500 = $1000.5, but they paid $1, so net $999.5. The charity made $500.

  But the SRs are happy: positive expected net gain.

  If they were CDTs, they might also buy tickets as long as the expected net gain per ticket is positive. For the first ticket, the expected net gain is 1,000,000/N_total - 0.5. But N_total is determined by others. If a CDT expects that others will buy many tickets, then N_total is large, so the expected net gain per ticket is negative, and they wouldn't buy. Conversely, if they expect few tickets, they might buy. But in equilibrium, the expected net gain should be zero. However, with 1000 participants, it might be that in the CDT equilibrium, they buy until 1,000,000/N = 0.5, so N=2,000,000. Then the expected net gain per ticket is 0. And each CDT might buy 2000 tickets? This is messy.

  Moreover, the charity in the CDT world might collect $2,000,000, keep $1,000,000, and award $1,000,000 + $1,000,000 = $2,000,000. Then the expected value per ticket is $2,000,000 / 2,000,000 = $1, which is the cost. So net zero. The charity profits $1,000,000.

  In the SR world, the charity only made $500. So the charity (OP) does worse with the SRs. This is the opposite of what we want.

  We want the charity to make more from the SRs.

   So let's adjust the numbers. Suppose the charity sets the administrative cost to 90% (keeping 90% of the entry fees) and only adding 10% to the prize.

   Then for SRs:
     Prize = $1,000,000 + 0.1 * N.
     Expected net gain per ticket = [1,000,000 + 0.1*N] / N - 1 = 1,000,000/N + 0.1 - 1 = 1,000,000/N - 0.9.

     Per SR: n * [1,000,000/(1000n) - 0.9] = n * [1000/n - 0.9] = 1000 - 0.9n.

     This is maximized at n=1, net expected gain per SR: 1000 - 0.9 = $999.1.

     Charity collects $1000, keeps $900, adds $100 to the prize. Prize becomes $1,000,100.

     The expected return per SR is still positive.

   To make it negative, set the administrative cost to 101%? But that would be and they announce they keep 101%, which is impossible.

   Alternatively, set the initial prize to 0.

   Then: prize = 0 + 0.5 * N (in the first example). 
     Expected net gain per ticket = (0.5 * N) / N - 1 = 0.5 - 1 = -0.5.

   Then in the SR world: each SR buys n tickets. Total expected net gain per SR: n * (-0.5) = -0.5n.

   To minimize loss, they choose n=0.

   So they don't participate.

   This is not working.

