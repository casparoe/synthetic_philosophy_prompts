prompt: |-
  Third novel, and I've hit a snag that's turned embarrassingly philosophical, so here I am. The book has a bunch of characters making choices when they don't know the odds, and as I write I keep issuing little verdicts — respectable, cowardly, reckless — on each one. The trouble is my own verdicts don't follow any rule I can find, and until they do I can't tell how the narrator should sound about the character she's supposed to be hardest on.

  Here's what my gut says, case by case:

  - Marta won't fly the new budget airline that has no track record, and books with the legacy carrier whose crash rate is famous and tiny. I respect that. She's not a coward, she just won't bet her life on odds nobody knows.
  - Her brother Jacob, later, walks away from a supplier nobody's dealt with and signs with an old firm who's shortcomings are well documented, on clearly worse terms. I instantly thought less of him — small-minded, I nearly had the narrator say. But structurally Jacob did exactly what Marta did, refused the unknown and took the known, and I approved of her and winced at him.
  - There's a gambler, Elio, who when nobody can state the odds of a wager just calls it 50/50 in his head and plays on that basis. Gut verdict: reckless. Though I can't actually point to anything unreasonable he did — he made the best of bad information, if anything.
  - In one scene Marta takes an even-money bet on a coin she's allowed to inspect and refuses the identical bet on a sealed jar of colored stones. I let her do that without the narrator blinking, and re-reading it I'm not sure the narrator has earned the non-blink.
  - Anna, a doctor, won't try a treatment whose success rate nobody can state, sticking instead with the standard one that is known to fail more often than not. I respect that too, and can't say why, since the known option is the one that will probably kill the patient.
  - The one I keep going back and forth on: a character who could ask a single question and learn the actual odds, and decides not to ask, saying she'd rather not know. Some days that reads as dignity, some days as self-sabotage, and it won't sit still for me.

  So — is there a principle here, or a couple of candidates? Is my approval tracking the domain, life and limb versus commerce? Whether the character is guarding something entrusted to them versus staking their own? Whether the unknown was knowable in principle? Whatever you propose, please state it precisely, say which of my verdicts it has to overturn and why, and tell me what it predicts for a case I haven't listed — say, someone who'll enter a raffle only when the prize pool is published and never otherwise.
reasoning: |-
  Okay, the user is working on their third novel and has run into a philosophical snag. They're trying to figure out why they judge certain character decisions differently even when the situations seem structurally similar. Let me break down their examples to see if I can spot a pattern.

  First, Marta avoids the new airline with no safety record and chooses a legacy carrier with a known low crash rate. The user respects that decision. Then her brother Jacob does something similar by choosing a supplier with known flaws over an unknown one, but the user thinks less of him. Why the difference? Both are choosing known risks over unknown ones. Maybe it's about the stakes involved. Marta's decision involves life and death, while Jacob's is about business terms. Higher stakes might make avoiding the unknown more reasonable.

  Next, Elio the gambler treats unknown odds as 50/50. The user sees this as reckless. But Elio is using a heuristic to make a decision with incomplete info. The recklessness might come from him treating uncertainty as a gamble rather than seeking more information. Marta inspecting the coin but refusing the jar of stones makes sense because she can verify the coin's fairness but not the stones. The key here is the ability to assess the risk.

  Anna, the doctor, sticks with a known treatment that fails more often than not instead of an unknown one. The user respects that. But why? The known option has a high failure rate, but it's predictable. Maybe in medical contexts, predictability allows for better planning, even if the outcome is poor. The unknown treatment could be worse, and without data, it's a bigger gamble.

  The character who could ask for the odds but chooses not to is ambiguous. The user can't decide if it's dignity or self-sabotage. This might depend on context. If knowing the odds would cause anxiety without changing the decision, not asking could be self-preservation. But if it affects the outcome, it might be avoidance.

  The user mentioned a raffle example where someone only enters if the prize pool is known. Applying the principles: if the person avoids unknown raffles, it could be seen as avoiding scams, which is prudent. But if the stakes are low, it might seem overly cautious. The domain (financial vs. safety) and the ability to assess the risk matter here.

  Putting it all together, the user's judgments might be based on three principles: 1) **Stakes vs. Uncertainty Principle**—higher stakes justify avoiding unknowns. 2) **Assessability Principle**—decisions are judged on whether the character could have assessed the risk. 3) **Consent Principle**—choosing known risks allows informed consent. 

  For Marta (airline), high stakes and unassessable risk make her choice prudent. Jacob's business decision has lower stakes, and maybe the risks were assessable (he could research), making his choice seem small-minded. Elio assumes 50/50 without trying to assess, which is reckless. Marta's coin vs. stones: she can assess the coin but not the stones, so refusing the stones is prudent. Anna's medical choice: high stakes, unknown treatment unassessable, so sticking with known is responsible. The character who doesn't ask for odds: if stakes are high, not asking is self-sabotage; if low, it might be dignity. The raffle example: avoiding unknown prizes could be prudent if scams are a concern, but if stakes are low, it might be overly cautious.

  The user needs their narrator's tone to be consistent. Maybe the narrator is hardest on characters who avoid assessable risks in low-stakes situations or who don't seek information when they could. For Jacob, the narrator calls him small-minded because he didn't research the supplier. For the character who doesn't ask for odds, if it's a high-stakes situation, the narrator should criticize the avoidance. The key is whether the character could have reduced uncertainty but chose not to.
answer: |-
  You've hit on a fascinating cognitive puzzle – and your gut judgments are far from arbitrary. They reveal a coherent (though complex) ethical framework. The key lies in **three interacting principles**, not one. Here's the breakdown:

  **Core Principles Explaining Your Verdicts:**

  1.  **The Stakes vs. Uncertainty Principle:** Approval correlates with **higher stakes justifying greater aversion to unquantifiable uncertainty**. Life, health, and core safety warrant extreme caution with unknowns. Financial/business risks (especially when the "known" is bad) warrant more tolerance for exploring unknowns.
  2.  **The Assessability Principle:** Approval correlates with the **character's ability (or attempt) to realistically assess the risk**, even if quantification is impossible. Refusing an *unassessable* unknown is prudent; refusing an *assessable* unknown (or worse, refusing to assess it) is cowardly or small-minded.
  3.  **The Consent Principle (Implied):** Choosing a *known* risk, even a bad one, allows for **informed consent/agency**. Choosing an *unknown* risk involves blind faith or recklessness, removing true agency. This principle strengthens when guarding others (like Anna's patient).

  **Applying the Principles to Your Cases (with Overturns):**

  *   **Marta (Airline):**
      *   *Stakes:* Extremely High (Life/Safety).
      *   *Assessability:* New airline's safety is fundamentally *unassessable* for her (no data, opaque operations). Legacy risk is quantifiable (tiny crash rate).
      *   *Verdict:* **Respectable.** High stakes justify extreme aversion to unassessable uncertainty. She exercises informed consent with the known tiny risk.
      *   *Overturn Needed?* None. Principles align with your gut.

  *   **Jacob (Supplier):**
      *   *Stakes:* Moderate/Low (Business/Financial). Implied to be manageable if things go wrong.
      *   *Assessability:* The *new* supplier's risk was likely *assessable* (due diligence, references, pilot projects). He defaulted to the known-bad option *without* adequately assessing the unknown. The *old* firm's shortcomings are "well documented" – he *knew* it was bad and chose it anyway.
      *   *Verdict:* **Small-minded/Cowardly.** Low stakes don't justify extreme aversion to an uncertainty that could likely have been reduced (Assessability Principle). He chose a *known-bad* outcome over a potentially better one, showing a lack of initiative or courage. His action structurally mirrors Marta's *only* in choosing known over unknown, but crucially *differs* in Stakes and Assessability.
      *   *Overturn Needed?* None. Principles explain why Marta is prudent and Jacob is not, despite superficial similarity.

  *   **Elio (Gambler - 50/50):**
      *   *Stakes:* Variable, but implied to be significant (gambling).
      *   *Assessability:* He *could* attempt to gather information to refine his estimate (e.g., ask around, look for patterns, consider context). Instead, he *imposes* a specific probability (50/50) on the unknown, treating unquantifiable uncertainty *as if* it were quantifiable. This is a refusal to acknowledge true uncertainty.
      *   *Verdict:* **Reckless.** He fails the Assessability Principle by not trying to gather information and actively *misrepresents* the uncertainty. His "best of bad information" is actually a *distortion* of the information (lack of information). He's not managing uncertainty; he's pretending it doesn't exist.
      *   *Overturn Needed?* None. Principles align with your gut.

  *   **Marta (Coin vs. Stones):**
      *   *Stakes:* Low (Presumably small bet).
      *   *Assessability:* The coin's odds *are* assessable via inspection (fair coin = ~50/50). The jar's odds are fundamentally *unassessable* without opening it (unknown mix of stones).
      *   *Verdict:* **Prudent (Non-blink justified).** For low stakes, accepting an assessable risk (coin) is reasonable. Refusing an unassessable risk (stones) is also reasonable, especially as the uncertainty is inherent and unavoidable without changing the bet's nature. The Assessability Principle explains the difference. She *can* consent to the coin bet knowing the odds; she cannot consent meaningfully to the stone bet.
      *   *Overturn Needed?* None. Principles support the non-blink. The key difference is *assessability*, not the fairness of the bet itself.

  *   **Anna (Doctor):**
      *   *Stakes:* Extremely High (Patient's Life/Health).
      *   *Assessability:* The new treatment's success rate is *unassessable* (no data). The standard treatment's failure rate is known ("fails more often than not").
      *   *Consent:* Using the standard treatment allows for (grim) informed consent from the patient ("We know this has a >50% failure rate"). Using the unknown treatment involves blind experimentation without informed consent. She also has a duty of care *to the patient*.
      *   *Verdict:* **Respectable.** High stakes and unassessable uncertainty justify extreme caution. Choosing the known risk, however bad, allows for agency/informed consent (Consent Principle). Choosing the unknown removes agency and is ethically fraught when guarding another's life.
      *   *Overturn Needed?* None. Principles align with your gut, resolving the apparent paradox. The *known* bad option preserves agency; the *unknown* option removes it.

  *   **The Question-Dodger:**
      *   *Stakes:* **Crucial Variable.** Your shifting verdict depends on the implicit stakes and the *reason* for not asking.
      *   *Assessability:* The odds **are** assessable! She *could* know! Refusing to assess an assessable risk is key.
      *   *Scenarios:*
          *   *High Stakes (Life/Health/Core Security):* Refusing to know is **self-sabotage/reckless.** (e.g., "Should I evacuate? Is the dam going to break? I'd rather not know."). High stakes demand assessment if possible. Principles: Fails Stakes/Uncertainty (high stakes demand info) & Assessability (info was available).
          *   *Moderate/Low Stakes & Preserving Mental State/Dignity:* Refusing to know can be **dignified/prudent self-preservation.** (e.g., "Will my distant cousin come to the wedding? I'd rather be surprised." Or, "What are the exact odds of this minor investment failing? Knowing the number would cause me anxiety without changing my action."). Principles: Assessability *could* be utilized, but low stakes make the cost of knowing (anxiety, loss of spontaneity) potentially higher than the benefit. Consent Principle might lean towards preserving her own mental state.
      *   *Verdict:* **Context-dependent.** Your principles predict this instability. The narrator's judgment *should* depend on the stakes and the character's rationale.

  **Predicting the Raffle Case:**

  *   **Character:** Only enters raffles when the prize pool is published (known), avoids when it's unknown.
  *   **Stakes:** Generally Low-Moderate (Financial gain/loss, excitement).
  *   **Assessability:** The value of the prize is *assessable* if published. If unpublished, it's usually *assessable* with effort (asking organizers, inferring from past events, ticket price) but often *not trivially easy*. The *odds* might still be unknown (number of tickets).
  *   **Application:**
      *   *Your Gut Likely Verdict:* **Mildly Prudent, Possibly Overly Cautious.** Low stakes generally warrant *some* tolerance for uncertainty. However, avoiding scams or disappointments is reasonable. The Assessability Principle is key: if the prize value is genuinely unassessable without publication (e.g., "Mystery Prize!"), avoidance is prudent. If it's merely inconvenient to assess (e.g., could call and ask), avoidance might lean slightly towards excessive caution for low stakes.
      *   *Narrator Tone:* Likely neutral or mildly approving of caution regarding scams. Would likely judge harshly only if the character exhibited this caution in *high-stakes* situations where assessment was possible, or if it reflected a broader pattern of crippling risk aversion in low-stakes scenarios.

  **What This Means for Your Narrator & Character:**

  The narrator should be hardest on the character when:
  1.  **Stakes are high AND the uncertainty is assessable but unassessed.** (e.g., The Question-Dodger in a life-or-death situation).
  2.  **Stakes are low/moderate AND the character avoids an assessable unknown OR chooses a known-bad option over a potentially better unknown *without* attempting assessment.** (e.g., Jacob choosing the known-bad supplier without due diligence on the new one; someone refusing a raffle where the prize could easily be inquired about).
  3.  **The character actively misrepresents or ignores uncertainty.** (e.g., Elio assuming 50/50).

  The narrator should be most forgiving/respectful when:
  1.  **Stakes are high AND the uncertainty is truly unassessable.** (e.g., Marta with the airline, Anna with the treatment, Marta with the stones).
  2.  **The character makes a reasonable effort to assess the unassessable.** (Even if they still choose cautiously).
  3.  **Low-stakes decisions involve avoiding genuinely unassessable risks.** (e.g., Marta with the stones).

  **In essence:** Your approval tracks **reasonableness in managing irreducible uncertainty relative to the stakes**. The narrator's harshness should target **unreasonable aversion to assessable uncertainty, deliberate ignorance in critical situations, or the distortion of true uncertainty.** This framework resolves all your listed cases without overturning your core gut feelings, merely clarifying *why* they differ structurally, and provides a clear lens for future judgments like the raffle. Good luck untangling the philosophy – it's rich ground for a novel!
