              If we eliminate Y: then group2's next choice is Z. So Z:4+4=8, X:4 -> Z wins.

              So the winner depends on who gets eliminated first.

          - Borda: 
              Using 2,1,0:
                X: (2*4) [group1] + (0*4) [group2] + (1*4) [group3] = 8 + 0 + 4 = 12
                Y: (1*4) [group1] + (2*4) [group2] + (0*4) [group3] = 4 + 8 + 0 = 12
                Z: (0*4) [group1] + (1*4) [group2] + (2*4) [group3] = 0 + 4 + 8 = 12
              Tie again.

          - Agenda Setting: 
              The chair chooses the order. For example:
                First: X vs Y -> X wins (8-4)
                Then: X vs Z -> Z wins (because in Z vs X: Z:8, X:4) -> so Z wins.
              But if the chair chooses:
                First: Y vs Z -> Y wins (8-4)
                Then: Y vs X -> X wins (because X vs Y: X:8, Y:4) -> so X wins.
              Or:
                First: X vs Z -> Z wins (8-4)
                Then: Z vs Y -> Y wins (Y vs Z: Y:8, Z:4) -> so Y wins.

              So the chair can choose the winner by setting the agenda.

       This example is perfect because it shows:
          - Cycle in pairwise comparisons (so no Condorcet winner)
          - Different outcomes in different voting methods (and even within runoff depending on tie-breaking)
          - The power of the agenda setter.

     **But note:** We have 12 voters and 4 in each group. We can adjust to avoid ties? Or we can break ties arbitrarily and explain that in real life, ties are rare but the paradoxes remain.

