answer: |-
  ### Voting Game Design: Arrow's Theorem in Action  
  Here’s a structured 90-minute session that forces your team to confront Arrow’s Theorem head-on—using **real stakes** (e.g., picking a feature to prototype). No philosophy jargon, no trust falls.  

  ---

  #### **Setup**  
  - **Decision:** "Which feature should we prototype this afternoon?" (Winner *actually gets built*).  
  - **Options:** 3 distinct features (e.g., `Feature X`, `Y`, `Z`). Engineers rank them 1st/2nd/3rd.  
  - **Ballots:** Pre-written cards to guarantee a **Condorcet cycle** (critical for drama). Honest votes from 12 people *rarely* produce cycles naturally.  

  ---

  ### **Phase 1: Voting Rounds (45 min)**  
  *Use the same ballots in 4 different voting systems. Reveal results after each round.*  

  #### **Ballot Distribution (Pre-Written to Force Chaos)**  
  Give cards simulating a cycle (5-4-3 split):  
  - **5 voters:** `X > Y > Z`  
  - **4 voters:** `Y > Z > X`  
  - **3 voters:** `Z > X > Y`  

  *(Hand out cards: "These reflect *real* preferences we might hold—let’s see what happens.")*  

  #### **Round 1: Plurality Voting (5 min)**  
  - "Vote for your **top choice** only."  
  - **Result:** `X` wins (5 votes), `Y` (4), `Z` (3).  
  - **Takeaway:** Simple, but ignores 7/12 who preferred others over `X`.  

  #### **Round 2: Runoff Voting (10 min)**  
  - Round 1: `Z` eliminated (lowest votes).  
  - Redistribute `Z`’s votes to their 2nd choice (`X`).  
  - **Result:** `X` (5 + 3 = 8) vs. `Y` (4) → `X` wins again.  

  #### **Round 3: Borda Count (10 min)**  
  - Assign points: 3 pts (1st), 2 pts (2nd), 1 pt (3rd).  
  - **Tally:**  
    - `X`: (5×3) + (3×2) + (4×1) = 15 + 6 + 4 = **25**  
    - `Y`: (4×3) + (5×2) + (3×1) = 12 + 10 + 3 = **25**  
    - `Z`: (3×3) + (4×2) + (5×1) = 9 + 8 + 5 = **22**  
  - **Result:** Tie between `X` and `Y`! "My arbitrary tiebreaker: `Y` wins." 😉  

  #### **Round 4: Agenda Setter Control (15 min)**  
  - Randomly pick one "Dictator" (e.g., Emma). She chooses the **voting order**:  
    - Option A: `X vs. Y` → winner faces `Z`.  
    - Option B: `Y vs. Z` → winner faces `X`.  
  - Emma picks Option B (`Y vs. Z` first):  
    - `Y vs. Z`: `Y` wins (9 votes: 5 pro-Y + 4 pro-Y vs. 3 pro-Z).  
    - `Y vs. X`: `X` wins (8 votes: 3 pro-X + 5 pro-X vs. 4 pro-Y).  
  - **Result:** `X` wins.  
  - *But if Emma picked `X vs. Z` first:* `Z` wins → `Y` wins overall. **Her power changes the winner!**  

  ---

  ### **Phase 2: Chaos & Spoilers (15 min)**  
  #### **Spoiler Effect Demo**  
  - "Turns out `Z` had a secret fanclub! Who actually wins if `Z` withdraws?"  
  - Remove `Z` from ballots. Recount via Plurality:  
    - `X`: 5 votes, `Y`: 4 + 3 = **7 votes** → `Y` wins!  
  - **Lesson:** `Z`’s presence **spoiled** `Y`’s victory. `Y` was more broadly liked but split votes.  

  ---

  ### **Phase 3: Debrief (30 min)**  
  **Map observations to Arrow’s Theorem (engineer-friendly terms):**  
  1. **Unanimity ("No Brainer"):**  
     - *What we want:* If everyone prefers `X > Y`, `Y` shouldn’t win.  
     - *What we saw:* All methods passed this (phew).  

  2. **No Dictator ("Emma’s Power"):**  
     - *What we want:* No one person should decide the outcome.  
     - *What we saw:* In Round 4, **Emma’s choice of method changed the winner**. Arrow says: if all other conditions hold, a dictator is *inevitable*.  

  3. **Independence of Irrelevant Alternatives ("Spoiler Alert"):**  
     - *What we want:* Adding `Z` shouldn’t change the ranking of `X` vs. `Y`.  
     - *What we saw:* **`Z`’s presence changed the winner** (Plurality/Runoff elected `X`; without `Z`, `Y` won).  

  **The Punchline:**  
  > "Arrow proved **no voting system** can satisfy all 3 conditions. We saw:  
  > - Runoff and Borda violated *spoiler-proofness*.  
  > - Letting Emma choose the method violated *no dictator*.  
  > Trade-offs are inevitable—math says so."  

  ---

  ### **Honest Real Talk**  
  1. **Can you get a real cycle with 12 humans?**  
     - **Unlikely.** Condorcet cycles require near-perfect disagreement (≈33/33/33 splits). Pre-written ballots ensure the demo works. Without them, you risk a boring, consensus outcome.  

  2. **What can’t you show in 90 minutes?**  
     - **General proof:** You’re illustrating Arrow with one example, not proving it for *all* systems.  
     - **Transitivity:** Arrow requires group rankings to be logical (if `X>Y` and `Y>Z`, then `X>Z`). We showed cyclic preferences but didn’t *enforce* transitivity.  
     - **Non-engineer options:** Arrow applies to >3 options, but 3 keeps it snappy.  

  ---

  ### **Why This Works**  
  - **Stakes:** Engineers care about what gets built.  
  - **Drama:** Watching Emma swing the vote > trust falls.  
  - **Clarity:** Pre-written ballots create teachable chaos.  
  - **No jargon:** "Spoilers," "brainers," and "dictators" > IIA/Condorcet.  

  **Outcome:** Your team will meme about voting systems for weeks. Mission accomplished. 🚀
