          - 5 voters: X>Y>Z
          - 4 voters: Y>Z>X
          - 3 voters: Z>X>Y

       Then:
          Plurality: X:5, Y:4, Z:3 -> X wins.
          Runoff: 
              Eliminate Z (lowest). Redistribute Z's 3 votes to X (since Z>X>Y -> next is X). Then X:5+3=8, Y:4 -> X wins.
          But wait, let's see pairwise:
            X vs Y: 
              X: 5 (X>Y) + 3 (Z>X>Y -> so X>Y) = 8
