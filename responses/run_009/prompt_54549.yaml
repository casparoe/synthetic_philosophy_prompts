            - Group3: Z>X -> Z
            -> Z: 8, X:4 -> Z beats X.

          This is a cycle: X beats Y, Y beats Z, Z beats X.

       Now, let's see the voting methods:

          - Plurality: 
               X: 4 (group1), Y:4 (group2), Z:4 (group3) -> tie? Then we break the tie arbitrarily? Not good.

