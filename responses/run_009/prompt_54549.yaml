            X vs Z:
              X: 5 (X>Z) + 4 (Y>Z>X -> in X vs Z, they prefer Z? Wait: their ranking is Y>Z>X, so they prefer Z over X) -> so for X vs Z:
                  X: 5 (from group1) and 3 (from group3: Z>X>Y -> they prefer Z over X? No, they have Z>X, so they prefer Z) -> actually, group3: Z>X, so they vote Z in X vs Z.
                  So X:5, Z:4+3=7 -> Z wins.

            Now we have:
              X beats Y (8-4)
              Y beats Z (9-3)
              Z beats X (7-5) -> cycle! 

          But in runoff we got X. Now let's try Borda (with 2,1,0):
            X: 2*5 + 0*4 + 1*3 = 10+0+3=13
            Y: 1*5 + 2*4 + 0*3 = 5+8+0=13
