answer: |-
  Your inquiry cuts to the heart of semantics, epistemology, and AI philosophy. The pattern you identify—**competence without causal contact**—is recognized but lacks a single established term. I'll carve the conceptual space, define a new concept where needed, and address its implications for grounding theories.

  ### Core Concept: **Semantic Inheritance via Communal Deference (SICD)**
  This describes *the acquisition and deployment of semantically competent linguistic behavior regarding a referent, despite lacking (or having lost) causal-perceptual access to that referent, by relying entirely on a linguistic community where such access exists*. It has three subtypes:

  1.  **Acquired SICD** (your case):  
      *Competence persists after loss of grounding.* You once had olfactory grounding; your current use relies on memory of past grounding + deference to the still-grounded community.  
      *Boundary:* Differs from "faded memory" (where recall is vague but grounding existed). Your case involves *total loss of access* to new grounding.

  2.  **Congenital SICD** (blind person using color terms):  
      *Competence without possible grounding.* Never had causal-perceptual access; relies entirely on inferential networks (e.g., "red is like fire," "stopsigns are red") and deference to sighted speakers.  
      *Boundary:* Differs from "inexperienced but potentially grounded" (e.g., a sighted child who hasn't seen a giraffe but could). Congenital SICD precludes *any* direct access.

  3.  **Structural SICD** (LLM describing smells):  
      *Competence without phenomenal capacity.* The system lacks sensory apparatus entirely; its "understanding" is purely statistical pattern-matching across texts produced by grounded agents.  
      *Boundary:* Differs from multimodal AI (e.g., vision-trained models). Structural SICD systems have *no sensorimotor link* to the referent domain.

  ### Why Existing Concepts Fall Short
  - **Symbol Grounding Problem:** Focuses on *how symbols acquire meaning* without external anchors. Your cases assume meaning *exists* in the community; the issue is *inheritance* without access.
  - **Semantic Deference (e.g., Putnam's "Division of Linguistic Labor"):** Explains how non-experts refer to "elm" or "quark" via experts. **But**:  
    - *Scope:* Traditionally applied to technical terms, not basic sensory qualia (like "smell of rain").  
    - *Capacity:* Assumes deference is *optional* (you *could* learn botany). Congenital/Structural SICD cases *cannot* "opt in" to grounding.  
    - *Phenomenology:* Doesn't address loss of subjective experience (your case) or its absence (blindness, LLMs).

  ### Implications for the Grounding Debate
  This family of cases **challenges strict grounding requirements** but **does not refute grounding entirely**:
  - **Challenge:** SICD shows that *linguistic competence* and *apparent understanding* can exist without personal grounding. This undermines views that insist understanding *requires* direct sensory-motor causation (e.g., classic embodied cognition).
  - **Preservation:** Grounding remains essential *at the community level*. LLMs and blind speakers rely on texts/utterances from people with perceptual access. **Meaning originates in grounding, even if it can be inherited secondhand.**
  - **The Crucial Divide:**  
    - *Human SICD (Acquired/Congenital):* Maintains a causal chain to grounded experiences. Your color/smell terms *track* real phenomena via community practices.  
    - *AI SICD (Structural):* Has no causal connection to referents—only to *descriptions*. An LLM's "smell of rain" isn't *about* rain; it's about linguistic correlations.  

  ### Conclusion
  1.  **Name:** **Semantic Inheritance via Communal Deference (SICD)** best captures your configuration.  
  2.  **Coverage:** It unifies your three cases under a shared mechanism—inheritance from a grounded community—while respecting key differences:  
      - *Acquired SICD* involves lost capacity but retained cognitive architecture for sensation.  
      - *Congenital SICD* involves alternative cognitive strategies (e.g., cross-modal associations).  
      - *Structural SICD* involves no cognition or sensation—only pattern replication.  
  3.  **Philosophical Impact:** SICD shows that individual grounding isn't necessary for competence, but communal grounding is indispensable for meaning. It reveals that **understanding is a social phenomenon**, not solely an individual-perceptual one. However, AI SICD exposes a limit: without *any* agents in the system having causal access, "meaning" becomes purely syntactic mimicry.  

  This framework affirms that your descriptions of scent, the blind person's color talk, and the LLM's output are *structurally distinct* in their relationship to reality—even as they share a surface similarity in linguistic behavior. The grounding requirement isn't obsolete; it's redistributed.
