answer: |-
  ### Exam Question: Concepts and Induction (25 marks)

  **Background:** Bongard problems, pioneered by computer scientist Mikhail Bongard and popularized by Douglas Hofstadter, involve identifying a classification rule from visual examples. In this problem, you are given six boxes. Each box contains exactly two simple geometric shapes (circle ●, square ■, or triangle ▲) in a specific spatial relation. Three boxes are labeled **Class A**, and three **Class B**. No shapes are rotated or scaled; assume all are the same size. Descriptions are unambiguous:  
  - **Class A**:  
    - Box A1: ▲ is inside ●.  
    - Box A2: ■ is inside ▲.  
    - Box A3: ● is inside ■.  
  - **Class B**:  
    - Box B1: ● is to the left of ▲ (non-overlapping).  
    - Box B2: ▲ is to the left of ■ (non-overlapping).  
    - Box B3: ■ is to the left of ● (non-overlapping).  

  **Your Tasks:**  
  (i) **Rule Proposals and Test Box (10 marks):**  
  - State two **distinct rules**, *each correctly classifying all six boxes* into Class A or Class B.  
  - Construct and describe a **seventh box** (two shapes + spatial relation) on which your rules *disagree*. Explain each rule’s classification of this box.  

  (ii) **Rule Assessment (8 marks):**  
  - Discuss whether factors *beyond the six boxes* (e.g., simplicity, generalization to unseen cases, designer’s intent, or nothing at all) could privilege one rule over the other. If nothing privileges a rule, explain the implications for concept acquisition.  

  (iii) **Conceptual Connection (7 marks):**  
  - Connect this ambiguity to the difference between *discriminating a fixed sample* and *acquiring a generalizable concept*. Draw on **one theme** from the course (e.g., Wittgenstein on family resemblance, simplicity in induction, or unintended concepts in few-shot machine learning).  

  ---

  ### Model Answer (≈600 words)  
  **(i) Rules and Test Box**  
  Two rules that correctly classify all six boxes:  
  - **Rule 1 (Spatial Relation):**  
    - Class A: One shape is *inside* the other.  
    - Class B: Shapes are *side-by-side* (left/right, non-overlapping).  
    *Classification*: A1–A3 (containment) → A; B1–B3 (adjacency) → B.  
  - **Rule 2 (Shape Identity):**  
    - Class A: The *inner* shape (if contained) or *left* shape (if adjacent) is a ●.  
    - Class B: Otherwise.  
    *Classification*:  
    - A1: ▲ inside ● → inner is ● → A.  
