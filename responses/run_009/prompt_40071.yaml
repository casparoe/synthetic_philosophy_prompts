prompt: |-
  I moderate the discussion forum of a regional historical society — a few thousand members, mostly amateur historians, genealogists, and descendants of local immigrant families. Our rules currently prohibit "genocide denial," but a batch of pending postings has revealed that none of the moderators can say where denial actually stops and ordinary historical argument begins. Two of my fellow moderators are now threatening to quit over opposite failures: one wants to ban anything that questions accepted casualty figures on any topic, on the ground that giving an inch invites the people who flood forums like ours; the other insists that refusing to debate a question is itself dogmatism, that historians have been wrong before, and that our society will lose credibility if we look like we're protecting an orthodoxy.

  Three postings await my decision, and I want to decide them with a principled line rather than gut feeling:

  (a) A longtime member argues that the death toll of the Nanjing massacre is inflated, noting that even mainstream estimates differ substantially from one another. He then asks why, if the Auschwitz death toll was itself revised downward by several million once historians examined the evidence more carefully, questioning a Nanjing figure should be treated as beyond the pale rather than as the ordinary work of the discipline.

  (b) A member says that after years of reading she has come to believe the Armenian deportations were a wartime relocation policy that went tragically wrong, that most deaths were caused by starvation and disease rather than killing, and that labeling the events a genocide imports a legal and moral verdict into what should be treated as a purely historical question. She asks why simply requesting evidence of intent counts as denial.

  (c) A member proposes that the society host a formal online debate on a motion concerning the strength of the evidence for the Nazi extermination camps, with one mainstream historian and one self-described revisionist. His stated ground is that our society should model the principle that no historical claim is immune from challenge, and that sunlight is the best disinfectant.

  My fellow moderators disagree about each of these, and about the general question. Please advise. I would like your reply in four sections, in this order: "The line" — your own account of what separates legitimate historical revision from denialism, stated so I could recognize the difference in a case you haven't seen, roughly 150–200 words; "The three calls" — a ruling on each posting with your reasoning, about 120 words each; "The loose ends" — where each of my two resigning moderators goes wrong, if either does, roughly 100 words; and "The policy" — a set of rules phrased concretely enough that a moderator can apply them on a Tuesday night without a philosophy degree, roughly 150 words.
reasoning: |-
  Okay, this is a complex moderation dilemma requiring careful ethical and historical analysis. The user moderates a historical society forum facing contentious debates about genocide denial boundaries. Three specific cases need rulings, and two moderators are threatening to quit over opposing ideologies - one advocating for strict censorship, the other for absolute free debate.

  Hmm, the core challenge is distinguishing legitimate historical inquiry from denialism. Genuine revisionism uses accepted scholarly methods: examining new evidence, contextualizing sources, acknowledging established facts. Denialism employs tactics like demanding impossible proof thresholds, isolating events from historical context, or selectively using sources to undermine consensus without substantive alternatives.

  For the Nanjing case (a), questioning specific numbers while acknowledging the atrocity itself falls within legitimate discussion. But comparing it to Auschwitz revisions is misleading - those were evidence-based adjustments within scholarly consensus, not challenges to the event's fundamental nature. The member's argument seems to straddle the line but doesn't cross into denialism yet.

  The Armenian case (b) concerns me more. Characterizing deportations as "relocation gone wrong" while dismissing intentionality directly contradicts genocide scholarship. This isn't requesting evidence but rejecting the existing evidence framework - classic denialist framing that demands unreasonable proof standards for intent.

  The debate proposal (c) is clearly problematic. Giving platform parity to Holocaust deniers under "sunlight" arguments legitimizes pseudohistory. Unlike academic debates where both sides use scholarly methods, this would elevate discredited theories.

  The two resigning moderators represent dangerous extremes. The first would over-censor legitimate historical discussion, while the second fails to recognize that some "debates" aren't debates at all when one side rejects methodological integrity. Neither extreme serves historical truth.

  For practical policy, I'll propose clear bright-line rules: ban arguments that minimize core facts of recognized genocides, reject scholarly consensus without evidence, or demand impossible proof standards. Focus on methodology, not conclusions. Provide specific examples of prohibited tactics to help moderators make consistent calls.
answer: |-
  Here’s a structured response to your moderation challenge:

  ### The Line (Legitimate Revision vs. Denialism)
  Legitimate historical revision adheres to scholarly methods: it engages with established evidence, uses credible sources, acknowledges context, and aims to refine understanding—**without denying the core facts or moral significance of atrocities**. Denialism, by contrast, employs tactics to **erode consensus on documented atrocities**: demanding impossible proof standards, cherry-picking data while ignoring overwhelming evidence, conflating scholarly debates about details with disputes about the event’s fundamental nature, or framing genocides as "controversial" despite academic consensus. The line is crossed when arguments systematically minimize, justify, or obfuscate atrocities in ways that align with ideologies seeking to absolve perpetrators or harm victim groups. Intent matters: revision asks, "How did this happen?"; denialism implies, "This didn’t happen as claimed."

  ---

  ### The Three Calls
  **(a) Nanjing Toll Debate: Allow with monitoring.**  
  Questioning specific figures using mainstream sources (e.g., citing variations between 40k–300k in academic works) is legitimate historical discourse, as estimates evolve. **But** the Auschwitz comparison is misleading: its death toll revision resulted from rigorous archival work, not dismissing the Holocaust’s scale. Reasoning: The post focuses on methodology, not denying the massacre occurred. Warning: If future comments imply the event was "exaggerated" without evidence, treat as denialism.

  **(b) Armenian "Relocation Policy" Claim: Remove.**  
  Labeling deportations as a "tragic relocation" ignores evidence of systematic extermination (e.g., Ottoman orders, death marches, massacres). Denying intent while dismissing genocide as a "moral verdict" rejects the UN Convention’s criteria and scholarly consensus. Reasoning: This follows denialist patterns—reframing genocide as collateral damage and demanding unreasonable proof of intent (e.g., "no written extermination order") to invalidate established facts.

  **(c) Holocaust "Debate" Proposal: Reject.**  
  Platforming "revisionists" who deny extermination camps lends credibility to pseudohistory. Holocaust denial is not a scholarly dispute but ideology rejecting evidence (e.g., eyewitness accounts, Nazi documents, forensic data). Reasoning: "Sunlight" arguments fail when one side denies reality; this risks violating your genocide-denial rule and traumatizing victims. Suggest alternatives: host a talk on *how historians verify evidence* of the Holocaust.

  ---

  ### The Loose Ends (Moderator Disagreements)
  **Overly Restrictive Moderator:** Wrong to ban all casualty-figure queries. Legitimate scholarship often debates numbers (e.g., Nanjing estimates vary academically). Banning this chills valid inquiry and may alienate members. **Solution:** Focus on *how* figures are questioned—not whether.  
  **Absolute-Free-Debate Moderator:** Wrong to equate all "challenges" as equal. Genocide denial isn’t "revisionism"; it rejects evidence to harm victims. Hosting "debates" with deniers legitimizes hate speech, not truth-seeking. **Solution:** Uphold standards: reject arguments that deny core facts of recognized genocides, regardless of "open inquiry" claims.

  ---

  ### The Policy (Concrete Rules for Moderators)
  **Prohibited Content:**  
  1. **Denying Core Facts:** Claims that a recognized genocide (e.g., Holocaust, Armenian, Cambodian) did not occur or was justified.  
  2. **Minimizing Atrocities:** Arguing genocides were "accidental," "exaggerated," or primarily due to "disease/famine" without evidence of systemic murder.  
  3. **False Equivalence:** Demanding "proof" of intent/scale that ignores academic consensus (e.g., "No written order = no genocide").  
  4. **Platforming Denialism:** Hosting events granting legitimacy to groups/individuals rejecting established facts.  

  **Permitted Content:**  
  - Scholarly debates on specifics (e.g., casualty ranges, historical context) using credible sources.  
  - Discussions on historiography (e.g., "How did estimates of Nanjing change?").  

  **Action Steps:**  
  - **Remove posts** that match prohibited criteria. Cite: "Violates Rule 1: Denial of documented atrocities."  
  - **Allow posts** questioning details if they: (a) cite reputable scholarship, (b) acknowledge the atrocity occurred.  
  - **Consult** society’s historian advisor if uncertain. Default to academic consensus (e.g., UN, IHRA, major universities).  

  **Phrasing for Members:**  
  *"We welcome rigorous history but prohibit distortion of atrocities. Questioning details ≠ denying events. If your argument aligns with ideologies that dismiss victims’ experiences, it will be removed."*

  This balances academic freedom, ethical responsibility, and operational clarity. Revise rules to include these criteria, and train mods on recognizing denialist tactics (e.g., "just asking questions" to imply doubt without evidence).
