prompt: |-
  So I run this monthly dinner thing at my apartment, hard ideas over food, six or seven people, none of them philosophers or economists, mostly engineers and one lawyer who thinks she's funny. It's my turn to pick the topic next month and I've gotten weirdly obsessed with the common prior assumption, the thing where you model people as starting from the same beliefs before they get different information. I don't want to just wave my hands at it for an hour, I want to actually teach it. So plan it for me — I'm not asking you to explain the assumption to me, I'm asking for the teaching plan: what order things go in and why.

  Setup: two hours, a whiteboard, smart people who've never heard "Bayesian" used outside of spam filters. I figure the prior/posterior distinction and conditioning-on-information have to be in place before I can even state the thing, but I don't want to blow half the night on probability basics — how do I compress that without losing them? And the payoff (the agreeing-to-disagree theorem, the stuff about how rational people with a common prior can't agree to disagree once they know each other's opinions) has to come after all that or it'll feel like I just asserted something insane and magical.

  For the carrying example I was thinking two doctors who disagree about whether a patient has some condition, where one saw the imaging and one took the family history — disagreement that's obviously fine because it's information-based, and then the question is what happens once they share everything and still disagree. Does that example have what it takes to carry the whole idea, or is there something it lacks? I also keep circling this framing where the common prior is like asking what bets they would've accepted before either knew anything — is that a good hook or does it smuggle in trouble?

  Misconceptions I'm bracing for: that the assumption says everyone believes the same things right now (people confusing prior with posterior), that it's supposed to be an empirical claim about actual humans, and someone — the lawyer — will definitely say "so rational people can never disagree, which is obviously false, theorem destroyed." Where exactly in the sequence do I head each of these off?

  Also one question I can ask at the end that would actually show whether they got it versus nodded along, and what I should openly refuse to cover at this level — I assume the formal common-knowledge apparatus is out, and probably the no-trade theorem stuff? — and just say so out loud.
