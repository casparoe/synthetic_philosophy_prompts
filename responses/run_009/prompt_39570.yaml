prompt: |-
  I'm a program officer at a mid-sized regional foundation. We disburse roughly forty grants a year to nonprofits, and the terms of each grant specify a small set of numbers the grantee reports quarterly — meals served, job placements at six months, students reading at grade level, shelter nights provided. Reviewing those numbers is part of my job, and over the past few years I've watched several of them go strange. A job-training grantee's placement rate kept climbing while the employers who used to call us with feedback stopped calling; a literacy program's book count tripled in the two quarters after I mentioned book counts at a gathering of our grantees, while its waiting list stayed the same length. I know the slogan version of Goodhart's law — that when a measure becomes a target it stops measuring what it used to — but the slogan doesn't tell me what to do on a Tuesday afternoon with a renewal decision due Friday. And I suspect the slogan papers over several different situations: sometimes the number is being gamed, sometimes the number never measured what we assumed, sometimes our attention itself improved the work, and sometimes the grantee has simply gotten better at counting.

  Please write a decision procedure I can actually run: the questions to ask, in order; what counts as a sufficient answer to each; where the procedure ends in a no to renewal; where it flags the metric as broken rather than the grantee as dishonest; and where it hands the decision back to me or to the board because the underlying question is whether we still care about the thing the number proxies, which is a question of values rather than facts. Two constraints to respect: I generally have one afternoon per grantee, and any change to reporting requirements must be approved by the board and announced to all grantees at once, so the procedure should say explicitly when replacing a metric is worth that cost and when quietly living with a degraded one is the better call.

  Then run the procedure on three cases: the job-training placement rate described above; a food bank whose meals-served number is flat and, as far as I can tell, honest, but whose client interviews suggest demand has shifted toward a population the metric does not capture; and a homelessness grantee whose shelter-nights figure sails past our target every quarter — where I want the procedure to be able to conclude that the grantee is fine and the real problem is that we set the target too low, a conclusion I am not eager to bring to the board, since we set the target. Finally, be explicit about where the procedure will misfire: the recurring situations it was not built to handle, and the ways a determined grantee could satisfy every step of it while still hollowing out the underlying work.
reasoning: |-
  We are designing a decision procedure for a program officer at a foundation to evaluate grant renewals when metrics (as per Goodhart's law) may be becoming problematic. The procedure must be runnable in one afternoon per grantee and respect constraints about changing reporting requirements (board approval and simultaneous announcement to all grantees). The procedure should:
   - Ask specific questions in order
   - Define what counts as a sufficient answer for each
   - End in a "no" to renewal in some cases
   - Flag the metric as broken (rather than the grantee as dishonest) in some cases
   - Hand the decision back to the program officer or board when the issue is about values (whether the foundation still cares about the thing the metric proxies)

   The procedure steps:

   1. **Verify the metric's current validity:**
      - Question: "Does this metric still capture the outcome we care about, given what we know now?"
      - How to answer: Look at the grantee's narrative reports, external data (if available), and your own observations. If the metric has changed in a way that no longer reflects the intended outcome (e.g., job placements are increasing but employer feedback has vanished), then the metric might be compromised.
      - Sufficient answer: If the metric still aligns with the outcome, proceed. If not, go to step 2.

   2. **Assess for gaming or misalignment:**
      - Question: "Is the grantee's behavior causing the metric to become a poor measure (e.g., by gaming, shifting effort, or redefining terms) OR is the metric inherently flawed due to external changes?"
      - How to answer: Review the grantee's processes (via a phone call or email for clarification if needed). Look for signs of gaming (like the book count example) or changes in the environment (like the food bank example). Also, consider if the grantee is overemphasizing the metric to the detriment of other aspects.
      - Sufficient answer: 
          - If gaming is suspected and the grantee cannot provide a satisfactory explanation (e.g., they cannot explain the loss of employer calls without a good reason), then the procedure may lead to non-renewal (step 4).
          - If the metric is inherently flawed (due to external factors) and the grantee is acting in good faith, then flag the metric as broken (step 5).
          - If the issue is unclear, proceed to step 3.

   3. **Evaluate the grantee's overall performance and intent:**
      - Question: "Setting aside the metric in question, is the grantee achieving the intended outcomes and acting with integrity?"
      - How to answer: Look at other metrics, narrative reports, site visits (if any), and qualitative feedback (like client interviews). Consider the grantee's mission alignment and transparency.
      - Sufficient answer:
          - If the grantee is achieving the intended outcomes and acting with integrity, then the problem is likely the metric (go to step 5).
          - If the grantee is not achieving the outcomes and/or there are integrity concerns, then consider non-renewal (step 4).
          - If you are unsure because the outcomes are hard to measure without the metric, then the decision must be escalated (step 6).

   4. **Non-renewal recommendation:**
      - Conditions: Clear evidence of gaming, dishonesty, or failure to achieve the intended outcomes without a valid explanation.
      - Action: Do not renew the grant. Document the reasons.

   5. **Flag the metric as broken:**
      - Conditions: The metric is no longer a valid proxy for the outcome, but the grantee is performing well and acting in good faith.
      - Action: Note that the metric needs to be revised. However, because changing reporting requirements requires board approval and simultaneous announcement to all grantees, you must decide if the metric is so broken that it's worth the cost of changing. Consider:
          - How critical is this metric to our overall strategy?
          - Is the breakdown likely to affect other grantees? (If so, changing the metric for all might be necessary.)
          - Can we temporarily supplement the metric with qualitative information until the next reporting cycle?
          - If the metric is only broken for this grantee and the issue is isolated, then the cost of changing may not be justified. In that case, you might live with the degraded metric for now and plan for a broader review of metrics in the future.

   6. **Escalate to values decision:**
      - Conditions: The underlying issue is that the foundation's priorities may have shifted, or the outcome we care about is no longer well-served by the current metric and we are considering redefining what we value. This is a values question, not just a factual one.
      - Action: Hand the decision to the board (or the program officer if the board has delegated) for a discussion about the foundation's goals. The grant renewal decision may be deferred until that discussion.

   Now, let's run the procedure on the three cases:

   **Case 1: Job-training placement rate climbing, but employer feedback stopped.**

   Step 1: Verify the metric's current validity.
     - The metric (placement rate) is climbing, but we care about successful job placements that lead to sustained employment and employer satisfaction. The loss of employer feedback suggests the placements might not be as successful as before. The metric does not seem to capture the outcome we care about. Proceed to step 2.

   Step 2: Assess for gaming or misalignment.
     - We suspect gaming because the grantee might be placing people in jobs that are not sustainable or of low quality just to boost the number. Contact the grantee and ask about the loss of employer feedback. If they cannot provide a satisfactory explanation (e.g., they changed their employer engagement process without notifying us, or they are placing candidates in roles that employers don't value) then it points to gaming.
     - Suppose the grantee says they have expanded to new employers who don't provide feedback, but they have no evidence of ongoing relationships. This is insufficient. Proceed to step 3.

   Step 3: Evaluate overall performance and intent.
     - Look at other indicators: retention rates at 12 months? Wages? If these are declining or unavailable, and the grantee is not transparent, then we might question their overall performance and integrity.
     - If the grantee cannot demonstrate success beyond the placement rate, then we suspect they are gaming the system. Proceed to step 4.

   Step 4: Non-renewal.
     - Conclusion: Do not renew the grant.

   **Case 2: Food bank with flat meals-served number, but client interviews suggest a shift in population not captured by the metric.**

   Step 1: Verify the metric's current validity.
     - The number of meals served is flat, but the client interviews suggest the foundation's goal (addressing food insecurity) might be changing in terms of who is being served. The metric doesn't capture the shift in population (e.g., more families with children, but the metric counts meals, not types of clients). The metric may not fully capture the outcome we care about (serving the most vulnerable). Proceed to step 2.

   Step 2: Assess for gaming or misalignment.
     - The grantee is reporting honestly and there's no sign of gaming. The issue is that the metric doesn't capture the shift in demand. This is an external change (changing demographics or needs). The metric is becoming a poor measure due to external factors. Proceed to step 5 (flag the metric as broken).

   Step 3: (Skipped because step 2 concluded the issue is external and the grantee is honest.)

   Step 5: Flag the metric as broken.
     - The metric (meals served) is broken because it doesn't capture the changing population. We need to consider if we want to measure the types of clients (e.g., number of children served, or demographic breakdowns) in addition to meals.
     - Decision on whether to change the metric:
          - This metric is critical because it's about the foundation's goal of addressing food insecurity for the most vulnerable. If the shift in population is important, then the metric is not capturing the full picture.
          - Other grantees (food banks) might be experiencing the same shift. Therefore, changing the metric for all might be necessary and worth the cost.
          - Alternatively, we might supplement the metric with qualitative reports until the next cycle, but if the shift is significant, a new metric is needed.
     - Action: Recommend to the board to change the reporting requirements to include demographic data (if feasible) at the next grant cycle. Meanwhile, renew the grant because the grantee is honest and doing good work.

   **Case 3: Homelessness grantee with shelter-nights figure consistently exceeding target.**

   Step 1: Verify the metric's current validity.
     - The metric (shelter-nights) is exceeding the target, which might indicate that the target was set too low. But does the metric still capture what we care about? We care about providing shelter to those in need. The high number might be a sign of increased need, and the grantee is doing well. The metric is still valid. However, the target being exceeded might be a problem of goal-setting. We don't necessarily see a problem with the metric's validity, but the target might be outdated. Proceed to step 2.

   Step 2: Assess for gaming or misalignment.
     - Is the grantee gaming? For example, are they counting in a way that inflates the number (like double-counting, or including non-target populations)? Or is the increase due to external factors (more people needing shelter)? If the grantee is honest and the increase is due to increased need, then the issue is the target. There's no gaming. Proceed to step 3 to check overall performance.

   Step 3: Evaluate overall performance and intent.
     - The grantee is exceeding the target and there's no sign of dishonesty. They are providing more shelter than expected. The intended outcome (providing shelter) is being achieved. The problem is that the target is too low. This is not a grantee issue. Proceed to step 5 (but note that the issue is with the target, not the metric itself).

   Step 5: Flag the metric as broken? 
     - Actually, the metric (shelter-nights) is fine. The problem is the target. We don't need to change the metric, but we need to adjust the target. However, the procedure might not have a step for target adjustment. We can consider this under step 5 because the target is part of the metric system. But note: changing the target does not require changing the reporting requirement (the metric definition) so it might be easier. The constraint about board approval only applies to changing the reporting requirements (the set of numbers collected). Adjusting the target for a grantee might be done without changing the reporting requirement for all. However, if the target is set in the grant agreement, then changing it might require board approval (if the grant agreement is approved by the board). We need to clarify.

     - Since the constraint says "any change to reporting requirements must be approved by the board and announced to all grantees at once", changing the target for this grantee does not alter the reporting requirement (they still report shelter-nights) so it might not require board approval? But if the target is part of the grant agreement, then changing it might require an amendment. This might be a gray area.

     - The procedure must account for this. We can adjust step 5 to include not only broken metrics but also inappropriate targets. Since the target being too low is a problem of our own making, we should adjust it without penalizing the grantee.

     - Action: Renew the grant. Then, separately, review the target for this grantee and adjust it upward for the next cycle. If the target is set by the board and requires board approval to change, then we must bring the target adjustment to the board. However, this is a matter of updating the grant agreement and not a change to the reporting requirements (which are the metrics we collect). So it may not require simultaneous announcement to all grantees. We can do it for this grantee.

     - But note: the program officer is reluctant to bring this to the board because they set the target. However, the procedure should lead to an honest assessment. The procedure should not avoid this step because of embarrassment. The decision is: the grantee is doing well and the target was set too low. We must adjust the target and renew.

   **Where the procedure misfires (limitations):**

   1. **Complex causality:** When multiple factors affect the metric and it's hard to isolate gaming from external factors. The procedure might misattribute the cause.

   2. **Grantees that are very skilled at gaming:** A determined grantee might provide satisfactory answers at every step (e.g., by fabricating evidence of external factors or by having a plausible story for every discrepancy) and thus pass the procedure while still gaming.

   3. **Metrics that are inherently difficult to validate without expensive evaluation:** If the only way to validate is through a rigorous impact evaluation, but the foundation doesn't have the resources, the procedure might miss problems.

   4. **Situations where the metric breakdown is subtle and gradual:** The procedure might not detect a slow degradation in the metric's validity until it's too late.

   5. **When the grantee is in a unique situation:** The procedure might flag a metric as broken for one grantee, but changing the metric for all grantees might be costly and unnecessary if the issue is isolated.

   6. **When the values question is entangled with the metric breakdown:** The procedure tries to separate these (step 6) but in practice, they might be intertwined.

   7. **The procedure assumes one afternoon is enough to gather the information.** In complex cases, that might not be sufficient.

   8. **The procedure doesn't account for the possibility of unintended consequences when changing a metric.** For example, replacing one metric might cause a shift to a new metric that also becomes gamed.

   9. **The procedure is reactive (triggered by a metric going strange).** It doesn't proactively prevent Goodhart's law.

   10. **The procedure does not address systemic issues (e.g., when the foundation's entire set of metrics is creating perverse incentives across the sector).**

   Despite these limitations, the procedure provides a structured way to handle common cases.
answer: |-
  Below is a decision procedure designed for your context, structured as a step-by-step flowchart with explicit questions, evaluation criteria, and decision paths. It respects your constraints (one afternoon per grantee, board approval required for metric changes) and addresses the nuances of Goodhart's Law. The procedure focuses on **distinguishing between grantee performance issues, metric degradation, and values misalignment**.

  ---

  ### **Grant Renewal Decision Procedure: Evaluating Suspicious Metrics**
  **Time Budget:** 4–5 hours per grantee (one afternoon).  
  **Inputs:** Quarterly metric reports, grantee narratives, external data (e.g., client interviews, third-party audits), and your institutional knowledge.  
  **Outputs:** Renewal recommendation, metric revision flag, or escalation to the board.

  #### **Step 1: Verify Metric Integrity**  
  **Question:** *Is the metric technically accurate and consistently measured?*  
  - **Investigation:**  
    - Review the grantee’s data collection methodology (e.g., sampling techniques, counting rules).  
    - Cross-check with external sources (e.g., client interviews, partner feedback, audit trails).  
  - **Sufficient Answer:**  
    - **Yes:** Metric is reliable → Proceed to Step 2.  
    - **No:** Evidence of miscounting or methodological drift → Proceed to Step 4A.  
  - **Time Allocation:** 1 hour.  

  #### **Step 2: Assess Metric Validity**  
  **Question:** *Does the metric still proxy the outcome we care about, given current context?*  
  - **Investigation:**  
    - Compare metric trends with qualitative evidence (e.g., client stories, site visits, external reports).  
    - Identify external shifts (e.g., demand changes, policy impacts, new populations).  
  - **Sufficient Answer:**  
    - **Yes:** Metric aligns with intended outcome → Proceed to Step 3.  
    - **No:** Metric is misaligned due to external factors → Flag for metric revision (Step 5).  
    - **Unclear:** Proceed to Step 3.  
  - **Time Allocation:** 1.5 hours.  

  #### **Step 3: Evaluate Grantee Behavior**  
  **Question:** *Is the grantee’s response to the metric undermining the intended outcome?*  
  - **Investigation:**  
    - Look for signs of gaming (e.g., cherry-picking clients, lowering standards, redefining terms).  
    - Assess unintended consequences (e.g., neglecting unmeasured but critical work).  
  - **Sufficient Answer:**  
    - **No Gaming:** Grantee prioritizes outcomes over metrics → Proceed to Step 4B.  
    - **Gaming Suspected:** Evidence of manipulation or diverted effort → Proceed to Step 4A.  
    - **Unclear:** Escalate to board for deeper review (Step 6).  
  - **Time Allocation:** 1 hour.  

  #### **Step 4A: Grantee Performance Failure (Renewal Rejection)**  
  **Conditions:**  
  - Verified inaccuracy (Step 1) or gaming (Step 3), with no satisfactory explanation.  
  - Grantee unable to correct issues within grant term.  
  **Decision:** Recommend **non-renewal**.  
  **Documentation Required:** Specific evidence of dishonesty or negligence.  

  #### **Step 4B: Target-Setting Failure (Renewal Approval)**  
  **Conditions:**  
  - Metric valid (Step 2) and no gaming (Step 3), but target is unrealistic (too high/low).  
  - Grantee exceeds/fails target due to external factors (e.g., demand surge, policy change).  
  **Decision:** Recommend **renewal** and **adjust target** (no metric change needed).  

  #### **Step 5: Metric Revision Flag**  
  **Conditions:**  
  - Metric is invalid (Step 2) or consistently gamed (Step 3), but grantee acts in good faith.  
  **Decision:**  
  - **Revise Metric?** Only if:  
    - The breakdown affects >30% of grantees using similar metrics.  
    - Core outcomes are unmeasurable without revision.  
  - **Live With Degraded Metric?** If:  
    - Breakdown is isolated or low-stakes.  
    - Qualitative inputs can compensate temporarily.  
  **Output:** Board proposal for metric change (if revision warranted).  

  #### **Step 6: Values Escalation**  
  **Conditions:**  
  - Uncertainty at Step 2/3 due to shifting priorities (e.g., "Do we still care about this outcome?").  
  - Metric proxies an outcome the foundation may deprioritize.  
  **Decision:** Escalate to board. Frame as: *"Should we still fund work toward [outcome] given [new context]?"*  

  ---

  ### **Applying the Procedure to Your Cases**  
  #### **Case 1: Job-Training Placement Rate (Climbing Rate, Declining Feedback)**  
  - **Step 1:** Placement rate methodology is consistent → **Proceed to Step 2**.  
  - **Step 2:** Metric invalid. Rising placements conflict with loss of employer feedback → **Proceed to Step 3**.  
  - **Step 3:** Gaming suspected. Grantee likely prioritizing "easy" placements to inflate numbers → **Step 4A: Non-renewal**.  
  - **Why?** Grantee dishonesty, not metric failure.  

  #### **Case 2: Food Bank (Flat Meals-Served, Shifting Population)**  
  - **Step 1:** Metric is honest → **Proceed to Step 2**.  
  - **Step 2:** Metric invalid. Doesn’t capture new vulnerable populations → **Flag for Metric Revision (Step 5)**.  
  - **Step 5:** Revise metric? **Yes** (affects all food-security grantees; core outcome misaligned). Proposal to board: Add demographic data (e.g., "% meals to target populations").  

  #### **Case 3: Homelessness Grantee (Exceeds Shelter-Nights Target)**  
  - **Step 1:** Metric accurate → **Proceed to Step 2**.  
  - **Step 2:** Metric valid (shelter access is core outcome) → **Proceed to Step 3**.  
  - **Step 3:** No gaming. Demand exceeds capacity → **Step 4B: Target-Setting Failure**.  
  - **Decision:** Renew grant. Recommend **raising target** (no metric change; board approval for target adjustment only).  

  ---

  ### **Where the Procedure Misfires**  
  #### **Limitations and Blind Spots**  
  1. **Sophisticated Gaming:** A determined grantee can:  
     - Fabricate qualitative evidence (e.g., staged client interviews).  
     - Exploit "sufficient answer" thresholds (e.g., minor methodological tweaks to avoid Step 1 flags).  
     *Mitigation:* Random spot-checks and third-party audits (if time permits).  

  2. **Systemic Metric Failure:**  
     - When *all* grantees game a metric (e.g., universal book-count inflation), the procedure may normalize degradation.  
     *Mitigation:* Annual meta-review of all grants to detect patterns.  

  3. **Values Conflicts Disguised as Metrics Issues:**  
     - E.g., A grantee ethically opposes metric-driven work (e.g., refusing to "chase numbers"). The procedure may misinterpret this as gaming.  
     *Mitigation:* Step 6 escalation if grantee raises values-based objections.  

  4. **External Shocks Unrelated to Metrics:**  
     - Sudden events (e.g., natural disasters) distort metrics but aren’t addressed in the procedure.  
     *Mitigation:* Allow grantees to append disaster disclosures to reports.  

  5. **Time-Intensive Contexts:**  
     - Grantees in complex fields (e.g., policy advocacy) may need narrative evaluations. The procedure favors quantifiable data.  
     *Mitigation:* Pre-approve narrative supplements for specific grant types.  

  #### **Cost-Benefit Guidance for Metric Changes**  
  - **Worth Board Approval If:**  
    - >30% of grantees use the metric, AND  
    - Metric breakdown obscures core outcomes (e.g., food bank’s demographic shift).  
  - **Not Worth It If:**  
    - Isolated issue, AND  
    - Qualitative inputs suffice (e.g., one grantee’s unique client niche).  

  This procedure prioritizes **transparency** (clear escalation paths), **efficiency** (time-boxed steps), and **nuance** (separating grantee intent from metric fitness). It accepts that some Goodhart effects are unavoidable—focusing resources where degradation threatens strategic goals.
