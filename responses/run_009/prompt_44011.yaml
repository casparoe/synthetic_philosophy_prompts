prompt: |-
  I host a podcast on philosophy of mind aimed at an audience of graduate students and serious amateurs, and next month's guest is a cognitive scientist best known for defending a strange-loop theory of the self. The core of her view, as I understand it, is that the 'I' is not a thing residing in a single brain but a self-referential pattern — a feedback structure that brains happen to instantiate — and that because patterns are substrate-flexible, a person's self can be partially instantiated in other brains: that the people who knew someone deeply, and modeled them richly for decades, come to host fragments of that person's pattern, so that after death the person is not entirely gone but distributed, dimly and partially, across the minds of those who loved them. She developed this view partly through reflecting on her own grief after her spouse's death, and she takes the view to be a factual claim about personal identity, not a poetic consolation.

  I want roughly ten questions that press on the actual content of the position rather than inviting her to restate it. In particular I want at least one question on each of the following pressure points, though I'm happy for you to add others you think are sharper: (1) the distinction between hosting an accurate *model* of someone and hosting a *partial instance* of them — why isn't her view just a redescription of memory and imagination with more dramatic vocabulary? (2) what individuates a self-pattern such that the fragments scattered across other brains count as fragments *of the same person* rather than as loosely similar patterns, the way two people's mental models of Sherlock Holmes aren't fragments of Sherlock Holmes; (3) whether the view makes identity a matter of degree and whether she can live with the sorites consequences — was her spouse fifty percent there, five percent, and does the question even make sense; (4) what the view implies for the classic persistence questions, e.g., whether advanced upload scenarios would preserve the person, and whether she thinks her view agrees with or revises the standard patternist treatment of duplicates; and (5) whether anything normative follows — if parts of the dead persist in us, do we owe them anything, and does that 'owing' have any grip if the remaining pattern is too thin to have interests?

  One caution: she is extremely adept at deflecting with the remark that these worries treat identity as binary when the whole point of the view is to dissolve the binary. I'd like the questions sequenced so that this deflection becomes progressively harder to deploy — early questions can let her use it, but the later ones should either accept degrees-of-identity and demand the resources to still answer (a degree-preserving criterion of numerical identity, a threshold for practical purposes), or force her to say whether there is any question about the self her view cannot reframe. End with a single question about what observation or thought experiment, if it obtained, she would count as counting against her view, and include the follow-up you'd expect to need when she answers it.
reasoning: |-
  Okay, the user hosts a philosophy of mind podcast and is preparing for an interview with a cognitive scientist who has a unique theory about the self as a "strange loop." This theory suggests that the self isn't confined to one brain but is a pattern that can be partially distributed across other brains, especially after someone dies. The user wants questions that challenge the theory's core aspects without letting the guest deflect by saying identity isn't binary.

  First, I need to understand the key pressure points. The user outlined five areas: distinguishing between models vs. instances, individuation of self-patterns, identity as a degree leading to sorites problems, implications for persistence (like uploads), and normative consequences. Plus, they want to avoid the binary deflection and end with a falsifiability question.

  For question 1 on models vs. instances, I should focus on what makes an instance different from a model. The guest might say it's about causality and integration, so the question needs to push for a concrete distinction. Maybe ask what empirical evidence could show it's not just a model.

  Question 2 is about individuation. How are scattered fragments part of the same person and not just similar patterns? Sherlock Holmes is a good example here. The guest might argue that the emotional entanglement makes it different, but I need to challenge that by asking what specific properties unify the fragments.

  For question 3 on degrees of identity, the sorites paradox is key. If identity is gradual, when does it stop being the same person? The guest might avoid thresholds, so the question should press for practical implications, like grief or obligations.

  Question 4 deals with persistence in uploads and duplicates. Patternism usually handles duplicates, but this theory adds external fragments. How does that change things? The question needs to explore whether external fragments affect identity in upload scenarios.

  Question 5 on normative aspects: if parts of the dead persist, do we owe them something? If the pattern is too thin, can it have interests? This ties into ethics and whether the theory imposes duties.

  The sequencing is crucial. Early questions can allow the deflection but later ones must force specifics. Ending with falsifiability—what evidence would disprove the theory? And be ready for a follow-up if she gives a vague answer.

  Also, the user mentioned the guest developed this from personal grief. While not a pressure point, it might influence her responses. However, the questions should stay focused on the theory's logic.

  I need to ensure each question tackles one pressure point, avoids restating her view, and builds a logical progression. The final question on falsifiability should challenge her to consider counterevidence, preventing the deflection entirely.
answer: |-
  Here are ten sequenced questions designed to pressure-test the "strange-loop/distributed self" theory, progressively making the "dissolving the binary" deflection harder to use, and ending with falsifiability. They directly target your specified pressure points:

  1.  **Grounding the Distinction (Model vs. Instance):** "You emphasize that loved ones host *partial instances* of the deceased, not just accurate *models*. What is the specific, empirically testable *functional or causal difference* between a highly detailed, emotionally resonant mental model of my late spouse (which we all agree exists) and a 'partial instance' of *them*? What observable consequence distinguishes these?" *(Forces articulation of a non-trivial difference; early, allows "binary dissolution" deflection but demands substance)*
  2.  **Individuation - The Sherlock Holmes Problem:** "Sherlock Holmes exists as a richly detailed pattern instantiated across millions of minds, causally interacting with their thoughts. Yet, we don't say fragments of the *real* Holmes are distributed. What specific property does a person's self-pattern possess that Holmes' pattern lacks, making *your* distributed fragments count as literal parts of the *same* numerically identical person, rather than just qualitatively similar patterns?" *(Directly challenges core individuation; deflection possible but harder)*
  3.  **Degrees & Sorites - The Fading Threshold:** "Granting identity is non-binary on your view: immediately after death, a spouse might be '10% present' in the bereaved. Decades later, perhaps it's 0.1%. Is there *any* principled point (even vague) where the pattern becomes too degraded or fragmented to count as *any* part of *that specific person*? Or does the 'dimly distributed self' extend indefinitely, meaning infinitesimal fragments of Julius Caesar technically persist somewhere? If no threshold, how does this avoid the sorites paradox for personal identity?" *(Forces confrontation with the logical extreme of degrees; deflection ("it's all degrees") starts to ring hollow as an answer)*
  4.  **Persistence - Uploads & Duplicates (Internal Focus):** "Imagine a perfect destructive brain upload: all neural data is scanned, the brain destroyed, and the data run on silicon. Standard patternism says 'yes, that's you'. Does your view concur? Specifically, if the upload captures only the brain's *internal* strange loop, but *none* of the external fragments distributed in loved ones' minds, is the upload still fully *me*? Or is it a deficient copy because it lacks those distributed components?" *(Tests if external fragments are constitutive or merely evocative; deflection less applicable)*
  5.  **Persistence - The Role of External Fragments:** "Building on uploads: Suppose *after* my death, a perfect upload is made *only* from the distributed fragments scattered across my loved ones' minds (some accurate, some distorted), reconstructing a pattern never identical to my original brain-state. Is *this* entity me? More me, less me, or something else? How does your view handle the potential for multiple, conflicting 'distributed reconstructions'?" *(Directly pressures the ontological weight of external fragments vs. the original substrate; deflection weak)*
  6.  **Normative Demands - The Thinned-Out Self:** "If a fragment of my late spouse *literally* persists in me, does that fragment *itself* have interests (e.g., in its own preservation, in how it's represented)? If so, how can a thin, degraded pattern have interests? If not, what is the basis for any normative 'owing' towards the deceased on *this specific theory*, beyond standard moral duties like honoring promises or respecting wishes formed while alive?" *(Challenges normative derivation from the metaphysical claim; deflection irrelevant)*
  7.  **The Binding Problem for Distributed Selves:** "What *binds* the scattered fragments across different brains into *one specific person's* pattern? Is it causal history (they were caused by interacting with *that* original brain-loop)? Shared informational content? Something else? And critically, how does this binding mechanism prevent the fragments from simply dissolving into *my* cognitive structures, becoming part of *my* self-pattern rather than remaining a fragment of *theirs*?" *(Attacks the coherence of distributed numerical identity; "degrees" deflection doesn't resolve binding)*
  8.  **Degrees & Practical Consequences:** "Accepting identity is a matter of degree: In the years following your spouse's death, when making a difficult decision they would have had strong views on, how should the *degree* of their 'presence' in your mind factor in? If you felt they were '5% present', does that grant their perspective 5% normative weight? If not, how *does* the metaphysical 'partial instantiation' translate into practical deliberation, if at all?" *(Forces connection between metaphysics and practice; deflection ("it's complex/gradated") must yield actionable specifics)*
  9.  **Limits of Reframing:** "Your view powerfully reframes questions of persistence and identity. Is there *any* core question about the self (e.g., "Am I the same person who did X?", "Will I survive procedure Y?") where you'd concede that your framework *cannot* dissolve the apparent paradox or binary by reframing it in terms of pattern degradation/distribution? Or is dissolution *always* the answer?" *(Challenges the universality of the dissolution move; forces acknowledgment of limits or total commitment)*
  10. **Falsifiability & Follow-up:**
      *   **Question:** "What specific observation, experimental result, or conceivable scenario would you accept as strong evidence *against* your core claim that the 'I' is a substrate-flexible, potentially distributed strange-loop pattern, such that fragments persist in other minds?"
      *   **Expected Answer & Follow-up:** She'll likely propose something difficult or vague (e.g., "Proof that consciousness *requires* a specific biological substrate irreplaceably," or "Evidence that memories/models have *zero* causal interaction with the host's self").
      *   **Follow-up:** "Interesting. Regarding [Her Specific Answer], isn't that scenario *already* compatible with your view? For instance, substrate-dependence might just mean brains are the *best* or *only current* substrate, not that the pattern *is* the substrate. And zero causal interaction seems empirically unlikely given memory's effects. Can you propose a *concrete, testable* counterfactual that would genuinely threaten the core *distributed pattern* ontology, not just its scope or efficiency?"

  **Sequencing Logic:**
  *   Questions 1-3 allow initial deflection but demand increasingly specific distinctions.
  *   Questions 4-6 move to implications (uploads, normativity) where deflection is less directly applicable and consequences must be faced.
  *   Question 7 tackles a core metaphysical challenge (binding) deflection can't easily bypass.
  *   Question 8 forces the "degrees" view to yield practical guidance.
  *   Question 9 directly interrogates the universality of the core dissolution move.
  *   Question 10 targets falsifiability, demanding a concrete standard for evidence against the theory, with the follow-up designed to push past vague or easily assimilated answers.

  This sequence aims to start respectfully within her framework, gradually box in the deflection tactic, force engagement with the hardest consequences, and end by challenging the theory's empirical core and testability. Good luck with the interview!
