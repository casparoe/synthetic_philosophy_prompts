answer: |-
  The archival appraisal dilemma reveals profound tensions between professional ideals and practical realities, centered on contested theories of value and power:

  1.  **The Presupposed Theory of Value in Traditional Appraisal:**
      *   **Institutional Provenance & Functionalism:** Appraisal historically presupposes that the *primary* value of records lies in documenting the *structure, functions, and decisions of powerful institutions* (governments, corporations). Significance is linked to the role of the *creator* within an administrative hierarchy.
      *   **Future "Significance" as Objective:** It assumes significance is an inherent, objective property of records, discoverable through professional techniques analyzing administrative context, legal requirements, and perceived future research trends (often mirroring existing historical narratives focused on power centers).
      *   **Custodial Neutrality as Facade:** The custodial self-description ("preserve, not interpret") is largely incoherent with the reality of appraisal. Selection *is* interpretation with profound consequences. The "neutrality" claim functions more as a **fig leaf** obscuring the exercise of **state editorial power** over historical memory. It legitimizes privileging the records of the powerful as "naturally" significant while marginalizing others as ephemeral.

  2.  **Evaluating Recent Revisions:**
      *   **Documenting Whole Functions/Domains:**
          *   **Shares Old Presuppositions?** Partially. It shifts focus from *provenance* to *function*, but often still privileges documenting *societal functions* as defined by institutions or mainstream perspectives. It risks continuing to marginalize informal, resistant, or "invisible" activities unless explicitly seeking them.
          *   **Replaces/Modifies?** It *replaces* the narrow office/creator focus with a broader societal lens. It *modifies* the theory by emphasizing *completeness* within a defined sphere, potentially capturing more diverse voices *within* that sphere (e.g., documenting "healthcare" might include patient advocacy groups alongside hospitals). However, it still presupposes that defining and documenting "functions" or "domains" is objective and comprehensive.
      *   **Community-Led Selection:**
          *   **Shares Old Presuppositions?** Radically departs. It explicitly rejects the archivist's claim to objective judgment of significance.
          *   **Replaces?** It fundamentally *replaces* the core presupposition. Significance is now defined *subjectively* by the community creating or affected by the records. Value lies in the record's meaning *to that community*, not its administrative function or perceived future research utility by outsiders. This embraces pluralism and challenges the state/institutional monopoly on defining historical value.

      *   **Underlying Revelation:** These revisions reveal that appraisal **never strictly presupposed a single, monolithic theory of value**, though functionalism/institutionalism dominated. Appraisal *can* be (and increasingly is) driven by diverse, even conflicting, values: administrative necessity, legal compliance, historical research trends, social justice, community identity, cultural heritage. The shift highlights appraisal's inherent flexibility and its susceptibility to the dominant values (implicit or explicit) of the time and institution performing it.

  3.  **The Counter-Memory Archive: Trade-offs and Neutrality's Fate:**
      *   **What It Would Give Up:**
          *   **"Completeness" of Power:** It explicitly abandons the illusion of neutrally documenting the state/institutional perspective "comprehensively." The state's own narrative becomes fragmented/partial within this archive.
          *   **Traditional "Impartiality":** It openly embraces a partisan mission: redressing historical silences and power imbalances. It prioritizes the marginalized over the center.
          *   **Scalability & Resource Neutrality:** Over-collecting from marginalized groups and actively documenting absence (via oral history, metadata on destruction) is incredibly resource-intensive. It necessitates explicit prioritization and rejects the idea that appraisal can be resource-neutral.
          *   **Conventional Provenance Order:** Records might be organized thematically (e.g., "resistance," "community survival") or by community, challenging traditional institutional provenance hierarchies.
      *   **The Fate of Neutrality Doctrine:**
          *   **Appraisal:** Neutrality in selection is explicitly abandoned. Appraisal becomes an overtly political and ethical act of counter-memory construction.
          *   **Description & Access:** Can neutrality survive here? Description requires interpretation (subject headings, summaries). A counter-memory archive might describe records from the powerful using critical language highlighting oppression, and records from the marginalized emphasizing agency and resistance – rejecting neutral description as another form of silencing. Access policies might prioritize affected communities.
          *   **Preservation:** Technical preservation decisions (format migration, conservation priority) might still strive for neutrality based on physical characteristics, but even these choices have resource implications that could reflect priorities.
          *   **Conclusion:** Once the fig leaf of neutrality is ripped away from appraisal, its claim becomes untenable across the archival workflow. **Neutrality cannot coherently survive elsewhere.** Description, access, and even preservation decisions are imbued with interpretive choices and resource allocations reflecting the archive's core mission – whether traditional or counter-memory. The counter-memory archive forces the profession to abandon neutrality as a foundational myth and instead embrace **transparency** about its values, ethics, and the inevitably perspectival nature of constructing social memory.

  **In essence:** Archival appraisal is the exercise of immense power over societal memory, historically masked by a doctrine of neutrality that privileged the powerful. Recent shifts show appraisal *can* operate under different value systems (completeness of function, community significance). A counter-memory archive explicitly rejects neutrality in selection to combat systemic silence, necessitating transparency about its partisan mission and rendering the ideal of neutrality unsustainable throughout archival practice. The choice is not *whether* values shape the archive, but *which* values and *how transparently*.
