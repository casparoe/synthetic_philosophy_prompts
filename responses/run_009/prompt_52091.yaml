answer: |-
  Your frustration is entirely understandable and cuts to the heart of a genuine challenge within Bayesian confirmation theory. Philosophers *do* recognize the "Problem of Old Evidence" (POE) as a major difficulty, but they don't see it as a *decisive refutation* for several nuanced reasons. Here's why:

  1.  **Bayesianism's Core Strengths:** Despite POE, Bayesianism offers powerful tools for understanding confirmation, belief updating, prediction, decision theory, and handling *new* evidence. Its formal structure, ability to model learning incrementally, and provide quantitative measures of support (even if imperfect) are highly valued. Philosophers are often reluctant to discard an entire framework with such strengths because of one specific problem, especially when potential solutions exist.

  2.  **POE Reveals Nuances, Not Necessarily Fatal Flaws:** The problem highlights a subtlety about how we represent belief states and background knowledge:
      *   **Certainty vs. Assigning P=1:** The core issue is the representation. Assigning P(e) = 1 implies *absolute, logical certainty*. But in science (and indeed, in life), we are rarely *logically certain* of observed facts. We are *practically certain* based on overwhelming evidence. Bayesianism conflates these when it forces P(e) = 1 for known evidence.
      *   **The Erosion of Background Knowledge (K):** When a new theory H emerges, it often forces us to *re-evaluate* what we thought we knew and *how* we knew it. The "old evidence" e wasn't just sitting there isolated; it was embedded within a complex web of background assumptions (K). H's success in explaining e might show that our *previous understanding* (the old K) was incomplete or flawed, even if e itself remains a solid fact.
          *   *Your Plate Tectonics Example:* The "fit of continents" and "matching fossils" were known facts *interpreted* within a background K that assumed continents were fixed. Plate tectonics (H) didn't just explain e; it radically changed the meaning of e *within* K. It showed that e was *not* merely coincidental or explained by land bridges (as per old K), but was direct evidence for continental motion. The "confirmation" comes partly from H providing a *new and superior interpretation* of e relative to the old background knowledge.

  3.  **Proposed Solutions (Patches) Can Be Plausible:** Philosophers have developed several strategies to address POE, aiming to capture the intuitive notion of confirmation by old evidence without abandoning the Bayesian core:
      *   **Counterfactual Probability ("Probability If We Didn't Know"):** The most common approach. We ask: *What would the probability of e be if we didn't already know it, but knew everything else (K, minus e)?* We then calculate how much H *would have raised* the probability of e *in that counterfactual state of ignorance*. Formally: Confirmation = P(e | H & K\e) - P(e | ~H & K\e), where K\e is background knowledge *excluding e itself*.
          *   *Mercury's Perihelion (e):* Newtonian mechanics (within K) predicted a slightly different perihelion advance. GR (H) predicted the observed value precisely. In the counterfactual state where we know K (Newtonian physics + observed planetary masses, etc.) *but haven't yet measured Mercury's orbit*, P(e | H & K\e) is very high (GR predicts it), while P(e | ~H & K\e) is low (Newtonian prediction is wrong). The difference shows strong confirmation.
          *   *Sunrise (e):* In the counterfactual state (knowing basic astronomy/physics K but not having observed sunrises), P(e | Geocentric Model & K\e) and P(e | Heliocentric Model & K\e) are both very high (both models predict sunrise reliably). The difference is negligible – sunrise doesn't *differentially confirm* one over the other in any significant way.
      *   **Probability Kinematics / Remembering Uncertainty:** We model the agent as having *forgotten* that they know e. They then "learn" e again, and we see how much H boosts its probability upon this hypothetical "re-learning" relative to alternatives. This directly tries to recover the state of uncertainty.
      *   **Changing the Background Knowledge (K):** Introducing H forces a revision of K itself. The old K (including the theories that previously explained e poorly or as coincidence) is replaced by a new K' that incorporates H. The confirmation of H comes from its ability to form part of a *new, more coherent, and explanatory background framework* K' that includes e naturally. The focus shifts from e confirming H in isolation to H being an essential part of the best overall system explaining *all* evidence, old and new.
      *   **Degrees of Belief < 1 for "Known" Evidence:** Some radical approaches suggest we should rarely, if ever, assign P(e) = 1, even to well-established evidence, acknowledging the theoretical possibility of error or reinterpretation. This allows P(e | H) > P(e), providing direct confirmation. However, this clashes with the standard Bayesian axiom of conditionalization for known truths and can feel counterintuitive.

  4.  **It's About Modeling Scientific Practice, Not Dictating It:** Philosophers see Bayesianism as a powerful *model* or *formal framework* for understanding rational belief change, not necessarily a perfect, literal description of every scientific thought process. The POE reveals a limitation in how the model represents background knowledge and certainty. The existence of plausible patches suggests the core framework is adaptable enough to capture the phenomenon, even if it requires some refinement at the edges. The confirmation you witnessed in geophysics *did* happen; the challenge is to model it formally within a probabilistic framework.

  5.  **The Alternative Isn't Obvious:** Dismissing Bayesianism entirely because of POE leaves a void. What is the superior, fully worked-out formal theory of confirmation that seamlessly handles old evidence, new evidence, theory comparison, and quantitative degrees of belief without facing its own serious challenges? While other theories exist (e.g., falsificationism, explanationist theories), they often struggle with different aspects (e.g., handling successful predictions from highly probable theories, providing a quantitative framework).

  **In Conclusion:**

  You are absolutely right to identify the tension. The Problem of Old Evidence *is* a serious challenge to the simple Bayesian picture where confirmation is *only* raising probability via conditionalization on new evidence. Philosophers treat it as a puzzle to be patched because:

  1.  **The core Bayesian framework is too powerful and useful to discard lightly.**
  2.  **The problem points to nuances in how belief, evidence, and background knowledge interact,** particularly the distinction between absolute certainty and practical certainty, and the revisable nature of background assumptions.
  3.  **Plausible solutions exist** (especially the counterfactual approach) that capture the intuition that old evidence *can* confirm a new theory by showing how well the theory *would* have predicted it or how it provides a superior *explanation* within a revised understanding of the world.
  4.  **Bayesianism is seen as a valuable model, not a perfect literal description.** Its ability to be adapted to handle POE reinforces its flexibility.

  The acceptance of plate tectonics wasn't a refutation of rational scientific confirmation; it was a paradigm example of it. The POE highlights the difficulty of formally capturing *within a specific probabilistic framework* how the re-interpretation of existing, entrenched evidence within a radically new theoretical context constitutes powerful confirmation. Philosophers work on the patches precisely because they believe the Bayesian engine is fundamentally sound and worth fixing for this specific, albeit important, leak. Your lived experience in geophysics isn't invalidated; it underscores the need for sophisticated tools to model the complex dynamics of scientific reasoning.
