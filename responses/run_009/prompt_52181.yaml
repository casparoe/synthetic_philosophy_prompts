answer: |-
  Your experience reveals a profound tension in translation theory, centered on whether linguistic *style* is inseparable from *meaning* or merely a cultural vehicle for it. The practice you describe presupposes a specific theory of communication, which I'll reconstruct by distinguishing its core commitments from compatible philosophical positions.

  ### Core Theory Presupposed by the Practice
  1. **Meaning Dualism**:  
     The practice treats an utterance as having two separable components:  
     - **Propositional Content ("What is Said")**: The factual, referential, or truth-conditional core (e.g., "Dinner is refused," "Statement X is incorrect"). This must be preserved exactly.  
     - **Pragmatic Framing ("How it is Said")**: The politeness, directness, or relational cues (hedges, apologies, honorifics) that signal the speaker’s attitude toward the listener. This is seen as culturally contingent and substitutable.  

  2. **Functional Equivalence over Formal Fidelity**:  
     The goal is to reproduce the *effect* of the original utterance on the target reader. A blunt refusal in English may "function" as a refusal + social neutrality; in Japanese, that same social effect might require an apologetic hedge. The translator’s duty is to replicate the *intended social outcome*, not the linguistic form.  

  3. **Politeness as Non-Assertive**:  
     Crucially, the practice assumes that **politeness markers carry no propositional content**. Saying "I’m afraid that won’t work" does not assert literal fear; "Perhaps you might reconsider" does not suggest literal uncertainty. These are conventionalized formulas whose only function is to manage social rapport. Altering them is no more deceptive than changing "Hello" to "Konnichiwa."  

  4. **Character as Social Perception, Not Linguistic Habit**:  
     Your character’s "bluntness" is defined by how she is *perceived* (decent but abrupt), not by her specific words. If Dutch readers perceive "that won’t work" as neutral, and Japanese readers perceive "恐れ入りますが…" ("I humbly regret...") as a firm-but-polite refusal, both renderings preserve the character’s essence.  

  ---

  ### Compatibility with Competing Views of Sincerity
  The practice **does not strictly require** a stance on whether politeness constitutes deception. It is compatible with two opposing views:  
  - **Deception View**: White lies *are* deceptive, but the deception is socially necessary and thus justified in translation to maintain character perception.  
  - **Relational Honesty View**: Indirectness isn’t deception but a genuine expression of respect (e.g., acknowledging the listener’s face needs). The translator isn’t adding "lies" but swapping one sincere relational signal for another.  

  **However, the practice cannot function without one key commitment**:  
  > **Politeness strategies must lack truth-conditional content**. If "I’m afraid..." or "Perhaps..." contributed to the *proposition* (e.g., implying the speaker *is* afraid), altering them would violate fidelity. By treating them as purely relational, translators can freely adapt them.  

  ---

  ### Alternative Approach: Preserving Directness at All Costs
  If a publisher insisted on preserving your character’s linguistic directness:  
  - **Method**: A "foreignizing" translation (Venuti, 1995) that retains source-culture pragmatics. Your narrator’s "no" would be directly transliterated in Japanese ("いいえ," *iie*), rejecting naturalized refusals.  
  - **Philosophical Basis**: Rejects meaning dualism. Asserts that:  
    - Linguistic style *is* character. A refusal wrapped in an unmeant apology fundamentally alters the speaker’s psychology.  
    - Politeness markers *can* carry propositional weight (e.g., an insincere hedge implies dishonesty).  
    - Readers should encounter the character *as foreign*, accepting that her bluntness reflects her cultural identity.  
  - **Practical Outcome**:  
    - **Dutch**: Minimal changes (directness aligns with Dutch pragmatics).  
    - **Japanese**: Character reads as jarringly rude or emotionally cold. Where a Japanese speaker might use honorifics to show decency, her literal directness would imply contempt.  
    - **Trade-off**: Philosophically coherent (style = content) but risks misrepresenting the character’s *relational intent*. Your "decent but abrupt" woman may read as "aggressive" in Japanese, distorting her core traits.  

  ---

  ### Why This Isn’t Merely Stubbornness
  The alternative approach is **philosophically motivated** by:  
  1. **Anti-Essentialism**: Rejects that "character" exists independently of linguistic performance.  
  2. **Thick Description** (Geertz): Surface behaviors (bluntness) carry cultural meaning; altering them changes the described reality.  
  3. **Ethics of Alteration**: If a character’s voice is their moral stance (e.g., refusing to soften truths), "equivalent" hedging betrays their ethos.  

  Yet it faces a pragmatic dilemma: **Can a character be "abrupt but not cruel" in a culture where abruptness *is* cruelty?** If the goal is fidelity to *reader experience*, functional equivalence wins. If fidelity to *textual artifact* is paramount, foreignizing translation is justified.  

  ### Conclusion
  Your translators presuppose a **pragmatic theory of meaning** where:  
  - **What is invariant**: Truth-conditional content, character psychology (as authorially defined), narrative facts.  
  - **What is variable**: The linguistic encoding of social relations, provided the *relational effect* is preserved.  
  This practice is neutral on sincerity debates but requires viewing politeness as non-propositional. The alternative ("foreignizing") approach is philosophically robust but prioritizes textual integrity over reader reception. Neither is inherently "correct"—but your intuition that Dutch and Japanese readers meet "different women" exposes translation’s irreducible dilemma: **all meaning is local, but art demands universality**.  

  *Source influences: Relevance Theory (Sperber & Wilson), Politeness Theory (Brown & Levinson), Translation Studies (Venuti, Nida).*
