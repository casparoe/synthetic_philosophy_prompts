  1) The most damaging objections first, phrased in epistemologists' terminology
  2) Concise rebuttals (under 2 mins each)
  3) Strategic concessions
  4) Identifying "friendly" amendments that gut the thesis
  5) That one nightmare question they're hoping won't come up

