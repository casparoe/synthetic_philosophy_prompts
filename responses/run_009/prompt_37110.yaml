  For morals, if they are anti-realist, variation shows no objective fact.  

  So perhaps the principle is about **objectivity**: Variation defeats when the domain is not objective.  

  But that's circular because it assumes which domains are objective.  

  The professor wants a non-question-begging principle.  

  Maybe: **Variation defeats when the intuition is about a property that lacks a clear functional role or causal profile independent of human judgments.**  

  Knowledge has a functional role in guiding action based on truth. Reference fixes content for communication. Morals might not have an independent causal role.  

  But morals do have functions in society.  

  This is messy.  

  Perhaps the best way is to distinguish between domains where variation implies error and where it doesn't. If a domain is judgment-dependent, variation doesn't imply error; if it's not, variation does imply error, but we might attribute it to performance factors.  

  In Gettier, we attribute variation to factors like willingness to attribute knowledge, not the concept itself. In morals, variation suggests no core concept.  

  So principle: **Variation defeats the intuition when there's no plausible error theory to explain the divergence.**  

  In Gettier, we can say the culture that says "knows" is making a performance error (being loose with language). In morals, no such error theory is plausible because morals are culturally relative.  

  Applying this:  
  1. Gettier: Error theory possible (verbal disagreement) → not defeated.  
  2. Reference: Error theory? If one culture is focused on current usage and another on historical facts, we could say they are answering different questions. But the survey asks "who is the speaker referring to," which might depend on their community's practice. So variation might not indicate error but different contexts.  
  3. Harmless taboo: No good error theory; it's just different norms → defeated.  
  4. Free will: If responsibility is tied to local practices, no error theory → variation shows no fact.  
  5. Beauty: Error theory? Different standards → not defeated, as expected.  

  For free will, if determinism is true, one culture might be mistaken, but the variation here is about responsibility judgments, which could be practice-dependent.  

  In case four, the variation is in judgments about responsibility under determinism. If both cultures accept determinism but one still holds responsible, it suggests that responsibility practices can vary, so perhaps no objective fact.  

  For the new cases:  
  - AI moral status: If there's cross-cultural variation, and if morality is not objective, this should defeat the intuition. If we think AI status is a factual matter about consciousness, variation might indicate error, but that's unlikely. So probably, variation defeats.  
  - Ship of Theseus: Variation might indicate different persistence criteria, but identity is often seen as objective. If there's variation, we might think it's a verbal dispute or that there's no fact. But typically, metaphysicians debate this, so variation might not defeat; we could say it's a hard problem.  

  The professor needs to decide on reference. If they accept drift, they should accept cross-cultural variation as legitimate difference in reference. So for case two, variation shouldn't undermine; it's just different referents.  

  This means their initial reaction to case two should change.  

  Similarly, for Gettier, they hold firm, which is fine if there's an error theory.  

  So to summarize:  
  - Principle: **Variation undermines the authority of an intuition when there is no plausible error theory that can explain the divergence without attributing massive error to one group, or when the concept is inherently practice-relative.**  
  - Overturn verdict on case two: They should accept that reference can vary between cultures, so the variation doesn't undermine the concept but reflects different linguistic practices.  
  - For new cases:  
    - AI moral status: Variation suggests no objective fact (like morals), so defeats intuition.  
    - Ship of Theseus: If variation is significant, it might defeat if identity is conventional, but if not, it might not. Given typical views, variation here might not defeat; we might think it's a difficult case with no clear intuition.  

  The professor's inconsistency is in case two. They accept drift within culture but not between cultures, which is inconsistent. So for case two, they should be moved by the variation and say that in different cultures, the reference differs.  

  For the principle, it's about whether the concept admits of multiple legitimate standards. If yes, variation doesn't undermine; if no, it does.  

  Knowledge: Single standard (truth-tracking) → variation is error.  
  Morals: Multiple standards → variation okay, no fact.  
  Free will: If responsibility is practice-dependent, multiple standards.  
  Beauty: Multiple standards.  
  Reference: Multiple standards per community.  
  Ship of Theseus: Could be conventional, so multiple standards possible.  
  AI: Morals, so multiple standards.  

  Thus, the principle: **Variation defeats when the concept does not admit of legitimate variation in standards across communities.**  

  This explains all:  
  1. Gettier: No legitimate variation → not defeated (attributed to error).  
  2. Reference: Admits variation → should not be shaken, but they were; so overturn this verdict.  
  3. Harmless taboo: Admits variation → defeated.  
  4. Free will: Admits variation (if practice-dependent) → defeated.  
  5. Beauty: Admits variation → not defeated.  

  For case two, they should say variation is expected and doesn't undermine reference.  

  New cases:  
  - AI moral status: Admits variation → variation defeats intuition's authority.  
