answer: |-
  I'll cut straight to the chase: your gut reactions aren't inconsistent, but they *are* incomplete. There's a single principle that can unify your verdicts across all five cases, and it doesn't smuggle in prior assumptions about which domains have attitude-independent facts. The inconsistency you sense arises because you're implicitly applying this principle everywhere *except* case two (reference), where your reaction doesn't fully align. I'll state the principle, show how it explains your reactions, flag where I'd overturn your verdict, then apply it to your two new cases.

  ### The Principle
  **Variation in intuitions defeats their authority as evidence for a shared, objective fact when the concept in question is *practice-relative*—that is, when its application conditions depend constitutively on the norms, goals, or evaluative frameworks of a specific community. Conversely, variation does not defeat intuitional authority when the concept is *practice-invariant*—when its application conditions are fixed by mind-independent factors (e.g., causal history, truth-tracking functions) that transcend local norms.**

  This principle avoids circularity by focusing on the *structure* of the concept rather than presupposing metaphysical commitments. Practice-relativity isn't about whether a domain "has facts"; it's about whether the concept's criteria for correct application are tethered to contingent human practices. If they are, cross-cultural variation signals legitimate disagreement; if not, variation likely reflects performance errors, noise, or misinterpretations.

  ### How It Explains Your Five Cases
  1. **Gettier (knowledge)**: Your reaction (variation doesn't matter; hold firm) is justified. Knowledge is practice-*invariant*: its core function—reliably tracking truth—is fixed by mind-independent epistemic goals (e.g., forming beliefs that align with reality to guide successful action). Variation in "knows" judgments across cultures likely reflects differences in willingness to attribute knowledge under uncertainty, contextual salience, or linguistic pragmatics—not a shift in the concept itself. The intuition's authority survives because truth-tracking isn't up for communal negotiation.  
     - **Verdict**: Correct. No overturn.

  2. **Reference**: Your reaction (barely moves you; reference "isn't up to a vote") is *inconsistent* with your own admission that reference shifts with usage drift. Reference is practice-*relative*: what a term refers to is constitutively tied to a community's linguistic practices (e.g., historical naming events, causal chains of use). If two cultures associate "Gödel" with different individuals (the thief vs. the true discoverer) due to divergent informational histories, they *are* referring to different entities. Variation here isn't noise—it's evidence that reference *is* determined by local practices. Your shakiness is warranted; you should concede that variation matters.  
     - **Verdict**: Overturn. Variation *does* defeat the intuition's authority as evidence for a universal fact. Instead, it shows reference is community-relative.

  3. **Harmless-taboo morality**: Your reaction (variation defeats intuition; no fact of the matter) fits perfectly. Moral wrongness in these cases is practice-*relative*: it depends on communal norms, disgust responses, or relational values that vary culturally. The diversity in judgments suggests no mind-independent "moral fact" is being tracked; instead, intuitions reflect local evaluative frameworks. Variation defeats the authority of any single intuition because the concept's application is anchored to contingent practices.  
     - **Verdict**: Correct. No overturn.

  4. **Free will/responsibility**: Your reaction (variation confirms no pre-theoretic fact; free pass to theorize) also fits. Moral responsibility is practice-*relative*: it hinges on community-specific norms of blame, praise, and desert (e.g., P.F. Strawson's reactive attitudes). If one culture judges responsibility compatible with determinism and another doesn't, this reflects divergent practices of holding agents accountable—not error about a universal fact. Variation doesn't just "defeat" the intuition; it reveals that the concept was never tracking a practice-invariant property.  
     - **Verdict**: Correct. No overturn.

  5. **Beauty**: Your reaction (no defeat; variation expected) is spot-on. Beauty is practice-*relative*: its application depends on culturally shaped aesthetic standards, emotional responses, or functional roles (e.g., what counts as "harmonious" or "moving"). Variation doesn't alarm you because you intuitively recognize it as evidence of legitimate diversity in evaluative practices, not a failure to intuit a universal fact.  
     - **Verdict**: Correct. No overturn.

  ### Why Your Inconsistency Arises (and How to Fix It)
  - **Core tension**: Cases one and two both involve "descriptive" concepts, but you treat knowledge as practice-invariant (correct) while resisting the practice-relativity of reference (incorrect). This is why you feel "shaky" in case two—you're not applying your own principle uniformly. If reference shifts with usage drift *within* a community, it must be practice-relative *across* communities. Your intuition that "reference isn't up to a vote" only holds if reference were mind-independent (like knowledge), but it isn't.
  - **Three vs. four**: Both are normative, but morality (case three) and responsibility (case four) are practice-relative in the same way—variation defeats authority because both depend on communal frameworks. Your reactions align here; no inconsistency.
  - **One vs. three**: Epistemic norms (knowledge) are practice-invariant (tied to truth-tracking), while moral norms (taboos) are practice-relative (tied to local values). Variation only bothers you in the moral case because morality's practice-relativity makes diversity evidential, not noisy.

  ### Predictions for Your New Cases
  **Case A: Moral status of a sophisticated AI**  
  - **Prediction**: Variation *defeats* the intuition's authority. Moral status (e.g., whether an AI deserves rights or respect) is practice-relative—it depends on culturally specific norms about personhood, consciousness, and moral patiency. Cross-cultural disagreement would signal that intuitions are tracking local evaluative frameworks (e.g., individualistic vs. relational views of agency), not a universal fact. This aligns with your reaction to harmless-taboo cases.

  **Case B: Ship of Theseus (persistence through part replacement)**  
  - **Prediction**: Variation *does not defeat* the intuition's authority. Persistence (numerical identity over time) is practice-*invariant*: its application is fixed by mind-independent factors like causal continuity or spatiotemporal continuity, not communal norms. Cross-cultural disagreement would likely reflect performance errors (e.g., misapprehension of the case, contextual biases) or differences in auxiliary assumptions (e.g., what counts as "essential" to an object), not legitimate relativity. This mirrors your Gettier response: hold firm to your intuition that it's the same ship (or not), dismissing variation as noise.

  ### Final Note
  Your struggle with case one (Gettier) is understandable—I wouldn't overturn it, but your back-and-forth is healthy. Knowledge *feels* robust because truth-tracking is a universal epistemic goal, but variation might nudge you to refine *how* you teach it (e.g., emphasizing that "knows" has contextual pragmatic elements, even if the core concept is invariant). The principle resolves this: knowledge is practice-invariant, so variation is defused as noise. Stick with "not knowledge" in Gettier cases—you're on solid ground.

  The key insight: practice-relativity isn't relativism. It just means some concepts (beauty, morality, reference) have application conditions built on human practices, so variation in intuitions is revelatory. Others (knowledge, persistence) don't, so variation is distortive. Apply this uniformly, and your spring lectures will feel less wobbly.
