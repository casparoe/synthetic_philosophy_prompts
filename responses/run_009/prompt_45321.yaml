prompt: |-
  I'm a data scientist, my biology knowledge basically ends at the stats I use for work. Restate the Gould–Lewontin critique of adaptationism in the vocabulary I actually use -- model fitting, overfitting, held-out data, confounders, spurious correlations, regularization, architecture constraints -- as faithfully as you can. My naive read is that a "just-so story" about why some trait evolved is like fitting a narrative to whatever data you already happen to have, with no held-out set and no way to be wrong, and that their spandrels idea is basically about structure that shows up as a byproduct of constraints rather than because anything optimized for it. Then give me the residue report: which parts of the biology debate survive that translation, which parts you had to distort to fit, and whether anything the biologists argue about has no counterpart in my vocabulary at all. And be honest about which way the residue cuts -- am I importing assumptions the biologists explicitly reject (like treating the organism as something with a "true model" to be recovered), or is there something my framework actually makes clearer than the biology literature does? Also not sure how exaptation is supposed to translate -- trait gets repurposed feels like something in ML but I can't quite place it, help me out.
