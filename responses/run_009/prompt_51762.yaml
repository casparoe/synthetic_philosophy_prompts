          - The micro-team had the fundamental laws and state. In principle, they could derive everything.
          - But in practice, they couldn't because of computational complexity.
     4. Bridge laws: 
          - The macro-team might have developed their own concepts (e.g., "glider", "block") and laws (e.g., "gliders move diagonally every 4 steps"). These are bridge laws that connect the micro-state to macro-concepts.
