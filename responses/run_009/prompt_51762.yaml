  ### Designed Activity: "Micro-Macro Gap Simulation" for Reduction and Emergence  
  **Goal:** Illustrate the gap between "in principle derivable" and "practically usable" explanations/predictions.  

  ---

  #### **Materials**  
  1. **Grid World:**  
     - A 6x6 grid (handout) with initial state (Game of Life rules):  
       ```  
       ......
       ..X...
       ...X..
       .XXX..
       ......
       ...XX.  
       ...XX.  
       ```  
     - ⬤ = live cell, ◻ = dead cell.  
  2. **Rules (Handout for Micro-Team):**  
     - **Game of Life Rules:**  
       - A live cell with <2 live neighbors dies (loneliness).  
       - A live cell with 2–3 live neighbors survives.  
       - A live cell with >3 live neighbors dies (overcrowding).  
       - A dead cell with exactly 3 live neighbors becomes alive.  
  3. **Queries (Handout for Macro-Team):**  
     - **Physics Team:** "Will the *glider* (cluster near top-left) exist at t=10? If yes, where?"  
     - **Chemistry Team:** "Will the *block* (2x2 square at bottom-right) remain stable until t=15?"  
     - **Biology Team:** "How many live cells will there be at t=8?"  
     - **Psychology Team:** "Which will dominate at t=12: the glider or block? Describe interactions."  
  4. **Other:**  
     - Candy/tokens for scoring.  
     - Blank grids for Macro-Team to sketch patterns.  
     - Whiteboard for Micro-Team to update grid states.  

  ---

  #### **Teams & Roles**  
  - **Micro-Team (4 students):**  
    - Receives full grid + rules. Must answer queries **only** using step-by-step micro-state calculations.  
    - *Forbidden:* Using shortcuts (e.g., "gliders always move diagonally").  
  - **Macro-Team (12 students):**  
    - Divided into 4 subgroups (Physics, Chemistry, Biology, Psychology).  
    - Observes grid evolution, identifies patterns, answers queries using **macro-level regularities**.  
    - Can request current grid state from Micro-Team (but Micro-Team may delay sharing).  

  ---

  #### **Timeline (90 Minutes)**  
  | Time      | Activity                                                                 |  
  |-----------|--------------------------------------------------------------------------|  
  | **0-10m** | Intro: Explain reduction/emergence, rules, teams, and queries.          |  
  | **10-15m** | Setup: Distribute materials. Micro-Team sets t=0 on whiteboard.         |  
  | **15-50m** | **Simulation Rounds (5 rounds, 7 min/round):**                          |  
  |           | - *Micro-Team:* Advances grid by 3 steps/round (t=3→6→9→12→15). Updates whiteboard. Answers queries *in order received*. |  
  |           | - *Macro-Team:* Subgroups observe, discuss patterns, submit answers. Can "publish" a macro-law (e.g., "Gliders move SW at 1 cell/step!") to earn bonus candy. |  
  | **50-60m** | Query Deadline: All answers submitted.                                  |  
  | **60-75m** | Scoring & Tally: TA reveals correct answers (pre-computed). Micro-Team gets 1 candy per correct answer. Macro-Team gets 2 candies per correct answer + 1 bonus if they used a macro-law. |  
  | **75-90m** | Debrief: Connect to philosophy (see below).                             |  

  ---

  #### **Scoring & Incentives**  
  - **Micro-Team:** 1 candy per correct query answer.  
  - **Macro-Team:** 2 candies per correct answer (1 if they relied on Micro-Team). +1 bonus for defining a macro-law (e.g., "Blocks are stable").  
  - **Goal:** Macro-Team usually wins—they answer faster via patterns, while Micro-Team is bogged down in calculations.  

  ---

  #### **Predictable Problems & Solutions**  
  1. **Micro-Team Cheats by Using Macro-Shortcuts:**  
     - *Likelihood:* High. They might say, "Gliders move diagonally, so..."  
     - *Pedagogical Silver Lining:* This *helps* the lesson! Point out in debrief: Even micro-level scientists naturally develop emergent concepts to cope.  
     - *Mitigation:* Gently remind them to "stick to base rules" if they do it early. If they do it late, let it slide—it becomes a teaching moment.  

  2. **Micro-Team Overwhelmed by Calculations:**  
     - *Likelihood:* Certain. Updating a 6x6 grid for 15 steps requires 540 cell calculations!  
     - *Solution:* Let them struggle. If they fall behind, skip steps. Chaos reinforces the point.  

  3. **Macro-Team Stuck on Queries:**  
     - *Likelihood:* Medium. Some may not spot patterns.  
     - *Solution:* Drop hints: "Look at the top-left cluster—does it *change* or *move*?"  

  ---

  #### **Debrief (15 Minutes)**  
  Map the simulation to philosophical concepts:  
  1. **Reduction (Nagel):**  
     - Micro-Team had "in principle" power (rules + state) but couldn’t *practically* derive answers in time.  
     - Gap = computational complexity, not logical impossibility.  

  2. **Bridge Laws:**  
     - Macro-Team’s "glider" or "block" are bridge concepts—they link micro-states (cells) to macro-behaviors (motion/stability).  

  3. **Multiple Realizability:**  
     - Ask: "Could a *different* micro-state create the same glider? Could a glider exist in a *different* grid-world?"  
     - If time: Note how Psychology’s query ("domination") couldn’t be reduced to cells—it required macro-interaction.  

  4. **Weak vs. Strong Emergence:**  
     - **Weak Emergence (shown):** Macro-patterns (gliders) are derivable *in principle* but not *in practice* without shortcuts.  
     - **Strong Emergence (limitation):** Our simulation *can’t* show true strong emergence (e.g., "consciousness") because the grid is computable.  
     - *Teaching Moment:* "We built a computable world—so underivability is always practical, not metaphysical. Does this undermine claims about *strong* emergence?"  

  ---

  #### **Why This Works**  
  - **Students "Feel" the Gap:** Micro-Team’s frustration + Macro-Team’s pattern-joy make abstract ideas visceral.  
  - **No Tech Needed:** Handouts + whiteboard suffice.  
  - **Limitation as Lesson:** The computability of the grid forces a debate about strong emergence’s plausibility.  

  **First-Run Advice:** Embrace chaos! If Micro-Team uses macro-shortcuts, if queries go unanswered, or if Macro-Team invents wild theories—it all deepens the lesson. The gap between theory and practice *is the point*.
