          - Biology: "Query 1: Count the number of live cells at t=5."
          - (Each group might have 2-3 queries? We can add one more for each to make it more engaging. But with time, one might be enough.)

     Alternatively, we can give each group 2 queries. For example:

     Physics:
        Q1: When does the glider leave the grid?
        Q2: If we placed a new glider at the bottom at t=0, when would it leave? (hypothetical) [but then they would have to run a simulation?]

     Given time, we stick to one query per group.

     We hope this activity will make the students feel the gap between in-principle and in-practice reduction.

