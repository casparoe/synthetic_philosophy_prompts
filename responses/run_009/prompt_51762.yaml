          - We didn't simulate it, but we can ask: Could there be a different micro-state that realizes the same macro-pattern? (e.g., a glider made of different underlying cells? In GoL, a glider is a specific pattern, but in other systems, the same macro-behavior might be realized by different micro-structures.)
     6. Weak emergence: 
          - The patterns are emergent because they are not explicitly in the micro-dynamics but arise from them, and they are practically unpredictable without simulation or pattern-spotting.
     7. Strong emergence: 
          - We couldn't show strong emergence because our system is computable. In principle, everything was derivable. Some philosophers argue that strong emergence (causally efficacious properties that are underivable even in principle) might exist in some systems (e.g., consciousness?), but we cannot simulate that.

