prompt: |-
  I run fact-checking at a consumer science magazine, general audience, mid-size outlet. Every few weeks a draft or pitch leans on a heritability number: "schizophrenia is 80% heritable so it's basically genetic," "BMI is 70% heritable so diets don't work," "this trait is 50% genetic in this population." My checkers are sharp but aren't statisticians, and they need something they can run in fifteen minutes without tearing apart the source papers. You're a philosopher of science with a strong quantitative genetics background -- think carefully, and maybe brainstorm a bit first, before settling on the structure. Write me a decision procedure our checkers can follow for vetting heritability claims: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops the claim cold, and where it has to hand the call back to me because the question is editorial rather than factual. The core confusions should show up as questions a checker can actually ask, not as a lecture: what population and what range of enviroments the estimate was measured in, why high heritability doesn't by itself say anything about how malleable a trait is or about differences between groups, what "missing heritability" does to a number from a GWAS versus a twin study. Then run the procedure on three cases: (1) a draft saying a personality trait is "60% genetic" off a single twin study conducted in one country, (2) a pitch arguing that high heritability within two countries proves the average difference between them is innate -- I want the procedure to kill this one even though the writer is a name we've published before and the editor loves the piece, and (3) a claim that a trait's heritability has risen over recent decades in the same population, where the right verdict is genuinely subtler and the procedure should show that. Flag where the procedure will misfire or lend false confidence. Keep it in American English.
reasoning: |-
  Okay, the user runs fact-checking at a consumer science magazine and needs a decision procedure for vetting heritability claims. Their checkers aren't statisticians but need something quick and practical. I need to create a step-by-step guide that addresses common misunderstandings about heritability.

  First, I should outline the core issues in heritability claims. The main confusions include: heritability being population-specific, not indicating malleability, not explaining group differences, and the "missing heritability" problem from different study types. The procedure must turn these into actionable questions.

  The user wants the procedure to handle three cases: a personality trait based on a single twin study, a claim that high heritability between groups proves innate differences, and a changing heritability claim. The second case should be rejected outright, while the third needs nuance.

  I'll structure the procedure as a flowchart with key questions. Each question should have clear pass/fail criteria. The questions need to cover: the source study type (twin vs. GWAS), population/environment context, interpretation errors (malleability, group differences), and missing heritability. The procedure should stop claims that misuse heritability for group differences or overstate malleability implications.

  For the case studies: Case 1 (personality trait) should pass with added caveats. Case 2 (group differences) must fail completely. Case 3 (rising heritability) should require deeper analysis and editorial input. I'll flag limitations where the procedure might miss complex modeling issues or misclassify studies.

  The tone should be practical American English - no jargon, just clear yes/no questions. I'll emphasize that high heritability ≠ unchangeable and ≠ genetic destiny. The "group differences" question is critical for shutting down harmful misconceptions.

  Finally, I'll note where the procedure might misfire - like when studies use advanced methods beyond basic twin/GWAS categorization, or when environmental changes are subtle. The checkers should know when to escalate to the user.
answer: |-
  Here's a decision procedure for your fact-checkers, designed as a checklist with clear stopping points and escalation flags. It focuses on actionable questions and common misunderstandings.

  **Heritability Claim Vetting Procedure (15-Minute Check)**

  **Core Principle:** Heritability (h²) is *not* destiny. It's a population-specific statistic about *current variation* in a *specific environment*. High h² does *not* mean a trait is unchangeable or that group differences are genetic.

  **Instructions:** Work through questions 1-6 in order. Stop and flag if any "STOP" condition is met. If "ESCALATE" is reached, note the issue and pass to [Your Name].

  1.  **What's the Source & Type of Study?**
      *   *Question:* Is the h² number from a **Twin/Adoption/Family Study** or a **GWAS (Genome-Wide Association Study)**? (Look for keywords: "twin study," "heritability estimate," "SNP heritability," "GCTA," "LD Score Regression").
      *   *Sufficient Answer:* Clearly identifies one type or the other.
      *   *Stop/Flag:* **STOP & REJECT** if source is unclear/unverified. **ESCALATE** if the study uses complex methods beyond basic twin or GWAS (e.g., complex pedigree, novel modeling).
      *   *Why:* Twin studies estimate *broad-sense* heritability (includes gene-gene interactions). GWAS estimates *narrow-sense* heritability (only additive effects). They are different numbers! GWAS h² is *always* lower than twin study h² for the same trait.

  2.  **What Population & Environment?**
      *   *Question:* **Specifically** which population (e.g., "Swedish adults born 1960-1970") and time period was studied? Is there any mention of the **range of environments** experienced by that population (e.g., "all had access to universal healthcare," "socioeconomic diversity was limited")?
      *   *Sufficient Answer:* Identifies a specific demographic group (nationality, age, sometimes ethnicity *if defined by the study*) and timeframe. Notes any major environmental constraints mentioned in the study abstract/intro (e.g., "participants were middle-class," "data from a national registry").
      *   *Stop/Flag:* **STOP & REQUIRE CAVEAT** if population/environment isn't clearly stated or differs significantly from the article's context (e.g., article implies "people in general," but study was only on elderly Norwegians). **ESCALATE** if the environment seems extremely restricted or unique.
      *   *Why:* h² is ONLY valid for that specific group in that specific range of environments. It cannot be assumed to apply elsewhere. Restricted environments often inflate h².

  3.  **Misinterpretation: Malleability?**
      *   *Question:* Does the article **claim or strongly imply** that because h² is high, the trait *cannot be changed* by the environment (e.g., "diets don't work," "personality is fixed," "interventions are pointless")?
      *   *Sufficient Answer:* Yes or No. (Look for direct quotes or paraphrases linking high h² to immutability).
      *   *Stop/Flag:* **STOP & REQUIRE REWRITE/CAVEAT** if Yes. *Demand removal of the implication and add a caveat like:* "High heritability within a population means genetics explains much of the *current differences* between people in that group. It does not mean the trait itself cannot be changed for an individual by environmental factors like therapy, diet, or social programs."
      *   *Why:* h² says nothing about how much the *average level* of a trait can be changed by new environments (plasticity). E.g., height has high h² (~80%), but average height increased dramatically with better nutrition (an environmental change).

  4.  **Misinterpretation: Group Differences?**
      *   *Question:* Does the article **use high h² *within* Group A and Group B to claim the *average difference* *between* Group A and Group B is primarily genetic?** (e.g., "IQ heritability is 60% in both Country X and Country Y, so the average difference between X and Y must be genetic").
      *   *Sufficient Answer:* Yes or No.
      *   *Stop/Flag:* **STOP & REJECT CLAIM ABSOLUTELY** if Yes. *This is a fundamental error.* Add note: "Heritability within groups tells us nothing about the causes of differences *between* groups. The group difference could be entirely environmental, even if heritability is high within each group."
      *   *Why:* This is the "ecological fallacy" of heritability. Within-group variation and between-group variation have entirely different causes. High h² within groups is compatible with the group difference being 100% environmental.

  5.  **GWAS-Specific: The Missing Heritability?**
      *   *Question:* (Only ask if Source = GWAS) Does the article present the **GWAS h² number (e.g., 20%)** as if it's the **total genetic contribution**, or does it acknowledge "missing heritability"?
      *   *Sufficient Answer:* The article either correctly frames the GWAS h² as *only the additive part currently captured by common SNPs* OR acknowledges that this number is lower than expected (missing heritability). If silent, it's insufficient.
      *   *Stop/Flag:* **STOP & REQUIRE REWRITE/CAVEAT** if the GWAS h² is presented as the full "genetic" contribution without context. *Add caveat:* "This GWAS estimate (X%) captures only the portion of heritability explained by common genetic variants detectable by current methods. The total genetic influence (estimated by twin studies as Y%) is likely higher, but the remaining 'missing heritability' is not yet fully understood."
      *   *Why:* GWAS h² is *always* significantly lower than twin study h² for the same trait (often by 20-50 percentage points!). Presenting it alone as "the heritability" is deeply misleading.

  6.  **Single Study/Sweeping Claim?**
      *   *Question:* Is the h² number based on **only one study**, particularly if the article makes a broad claim (e.g., "this trait is 60% genetic" implying universality)?
      *   *Sufficient Answer:* Identifies if multiple studies are cited or just one.
      *   *Stop/Flag:* **STOP & REQUIRE CAVEAT** if only one study is used for a broad claim. *Add caveat:* "This estimate (X%) comes from a single study of [Population/Environment from Q2]. Heritability estimates can vary across studies and populations." **ESCALATE** if the claim is about *changing* heritability over time (see Case 3).
      *   *Why:* h² is context-dependent. Relying on one study overgeneralizes. Claims about change over time are particularly sensitive.

  **Applying the Procedure to Cases**

  **Case 1: Draft: Personality trait "60% genetic" from single twin study in one country.**
  1.  **Source:** Twin study. Pass.
  2.  **Population:** One country (assume specified). Pass but Flag for Caveat (single country).
  3.  **Malleability?** (Check draft): Likely implies fixity? If yes: **STOP & REQUIRE REWRITE/CAVEAT** (High h² ≠ fixed). If no: Pass.
  4.  **Group Differences?** Unlikely in this claim. Pass.
  5.  **GWAS?** No. Skip.
  6.  **Single Study/Sweeping Claim?** Single study + "60% genetic" is a sweeping claim. **STOP & REQUIRE CAVEAT** (Add: "This estimate is from one study in [Country] and may not generalize universally.").
      *   **Verdict:** Claim likely survives *only* with significant caveats added (malleability misunderstanding if present, single study limitation, population specificity). Stop conditions triggered require fixes.

  **Case 2: Pitch: High heritability within Country A and Country B proves average difference between A and B is innate.**
  1.  **Source:** (Assume twin studies cited for each country). Pass.
  2.  **Population:** Two specific countries. Pass.
  3.  **Malleability?** Not the core issue here. Pass (or note if also present).
  4.  **Group Differences?** **YES!** This is the *core* claim. **STOP & REJECT CLAIM ABSOLUTELY.** Add Note: "Heritability within groups does not explain differences between them. This reasoning is invalid." **Do not pass Go.** Claim is factually wrong.
      *   **Verdict:** **REJECT.** The procedure kills it cold at Q4. Editor/Writer pushback is an editorial issue, not a factual one.

  **Case 3: Claim: Trait's heritability has risen over recent decades in the same population.**
  1.  **Source:** (Likely multiple twin studies over time). Pass.
  2.  **Population:** Same population over time? Crucial! **ESCALATE** if the studies aren't on comparable samples from the *same* defined population over time. Huge potential for confounding.
  3.  **Malleability?** Check context. If used to imply decreased potential for change? **STOP & REQUIRE REWRITE/CAVEAT** (Rising h² might mean environment became *more uniform*, not that genes matter more absolutely).
  4.  **Group Differences?** Unlikely the issue. Pass.
  5.  **GWAS?** Probably not (twin studies for trends). Pass/Skip.
  6.  **Single Study?** Likely multiple studies (trend). **ESCALATE** because Q2 & Q3 revealed complexities. The claim is inherently subtle.
      *   **Verdict:** **ESCALATE TO [YOUR NAME].** Why? * Legitimacy depends entirely on rigorous comparability of studies/populations over time (Q2). * Interpretation is tricky: A rise in h² often means a *reduction* in environmental variation within the population (making relative genetic differences *look* larger), not necessarily an increase in genetic influence. This needs careful expert evaluation. The procedure flags the subtlety via Escalates/Stops at Q2 and Q3.

  **Where the Procedure Misfires or Gives False Confidence:**

  1.  **Misclassifying Study Type:** If checkers misidentify a complex study (e.g., a large pedigree study) as "twin-like" or a sophisticated GWAS method as basic, it might skip the Missing Heritability check (Q5) inappropriately. *Mitigation:* "ESCALATE if complex methods" in Q1.
  2.  **Missing Environmental Nuance (Q2):** Checkers might miss subtle but crucial environmental restrictions (e.g., a study population all from a specific educational cohort) if not explicitly stated in the abstract. This could allow an inflated/unreliable h² to pass. *Mitigation:* "ESCALATE if environment seems restricted" in Q2.
  3.  **Overlooking Implied Malleability (Q3):** Writers can imply fixity without stating it directly (e.g., "deeply rooted in biology" combined with high h²). Checkers need vigilance. *Mitigation:* Training on recognizing implication.
  4.  **Subtle Group Difference Claims:** While Q4 catches the blatant error, a very clever writer might imply a group difference is genetic *without* explicitly using the within-group h² comparison logic. Q4 might miss this. *Mitigation:* Encourage checkers to be alert for *any* group difference claim combined with heritability mentions and flag it.
  5.  **"Changing Heritability" Complexity (Case 3):** The procedure reliably flags Case 3 for escalation, but it doesn't *solve* it within 15 minutes. It prevents false confidence by forcing escalation.
  6.  **Focus on Common Misunderstandings Only:** It doesn't catch every possible statistical flaw (e.g., poor model fit in the source study, gene-environment correlation/covariance issues). It targets the most common and impactful misinterpretations for a general audience.

  **Final Note for Checkers:** Your job isn't to recalculate the heritability number. It's to verify its source, understand its limitations, and crucially, **prevent the article from misrepresenting what that number actually means** for malleability, group differences, or genetic determinism. When in doubt about the nuance, escalate. This procedure arms you to catch the biggest conceptual errors quickly.
