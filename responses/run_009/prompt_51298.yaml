  Okay, the user is a member of a legal affairs committee in a Swiss cantonal parliament. They need a recommendation memo for an upcoming session about shoreline fee regulations. The core issue is balancing subsidiarity principles between different factions.

  First, let's unpack the political landscape. The shoreline municipalities want uniform tariffs to prevent a "race to the bottom," while interior municipalities see no cantonal role, and some coastal towns want local flexibility. The committee's deadlock isn't just about policy options but about fundamentally different interpretations of subsidiarity: capacity-based versus proximity-based.

  The memo must accomplish several things: recommend one option, acknowledge the subsidiarity conflict transparently, and articulate any factual assumptions. Among the three options, a binding tariff seems too heavy-handed given Swiss governance traditions, while doing nothing ignores the clear coordination failure. The middle path of a floor-ceiling framework offers compromise.

  What makes this tricky is the need to validate both subsidiarity interpretations without equivocation. The capacity-based view gets strong representation because the petitioners have a legitimate point about municipal inability to solve collective action problems alone. But ultimately, proximity concerns must prevail with safeguards - hence the framework approach.

  The factual bet about the bandwidth being sufficient is critical to call out. It's honest to admit this upfront and specify what evidence at Thursday's meeting would undermine the recommendation - like if municipalities demonstrate irreconcilable price differences.

  The tone should remain parliamentary - respectful of all positions while providing clear direction. Swiss legal culture values precision, so the memo must carefully distinguish between binding vs. non-binding elements and mediation processes.

  For structure, it's effective to first name the subsidiarity tension before analyzing options. This frames the disagreement as philosophical rather than parochial. When defending the chosen option, emphasizing the safety valves (bandwidth, mediation) addresses the proximity advocates' core concern.

  Finally, the conclusion should reinforce that this isn't perfect but seeks equilibrium - and remains open to adjustment based on Thursday's evidence about local economic variances.
answer: |-
  ## MEMORANDUM  
  **To:** Members, Legal Affairs Committee  
  **From:** [Your Name], Committee Member  
  **Date:** [Date]  
  **Subject:** Recommendation on Uniform Shoreline Tariffs & Subsidiarity Framework  

  ### 1. Executive Summary  
  The Committee recommends **Option (b): A cantonal framework setting a floor and ceiling for shoreline fees**, with municipalities retaining choice within the band. This balances the demonstrated need for coordination among shoreline municipalities with the principle of subsidiarity, while respecting local economic diversity. The core disagreement—whether subsidiarity prioritizes *municipal capacity* or *proximity to affected citizens*—must be explicitly acknowledged. Our recommendation hinges on the factual bet that a *sufficiently wide band* can accommodate local variations; evidence of irreconcilable municipal cost structures or tourism models at Thursday’s session would challenge this.  

  ---

  ### 2. The Subsidiarity Disagreement: Capacity vs. Proximity  
  The deadlock stems from fundamentally divergent interpretations of subsidiarity (Art. 5a Swiss Constitution; Art. 3 Cantonal Constitution):  
  *   **The Shoreline Bloc (Capacity View):** Subsidiarity requires higher-level intervention *only when lower levels demonstrably fail*. Municipalities cannot solve the "race to the bottom" alone. Unchecked fee competition is a collective action problem eroding revenue for *all* shoreline communities, proving municipal incapacity. The canton must act to preserve fiscal stability.  
  *   **The Interior Municipalities & Dissenting Shoreline Communities (Proximity View):** Subsidiarity mandates that decisions *always* be made at the lowest feasible level, closest to those affected. Shoreline management is inherently local. The canton lacks justification to override municipal autonomy absent a clear cantonal interest (e.g., environmental protection). Uniformity ignores legitimate local economic differences.  

  **Both views are constitutionally valid.** Option (b) navigates this tension by setting guardrails (addressing capacity concerns) while preserving local choice (honoring proximity).  

  ---

  ### 3. Analysis of Options  

  *   **Option (a): Binding Canton-Wide Tariff**  
      *   *Strengths:* Solves the race-to-the-bottom definitively; maximizes revenue certainty; simple enforcement.  
      *   *Weaknesses:* Brutally overrides the proximity principle; ignores genuine local economic variations (e.g., high-end marina vs. public fishing village); likely unconstitutional under a strict proximity reading; risks harming tourism in unique communities. Favors the capacity view exclusively.  

  *   **Option (b): Cantonal Floor-and-Ceiling Framework**  
      *   *Strengths:* Addresses the core coordination failure (capacity view) by preventing destructive undercutting. Preserves municipal autonomy *within defined limits* (proximity view). Allows adaptation to local tourism economies. Encourages efficiency—municipalities can compete on service quality, not just price. Canton provides structure without micromanagement.  
      *   *Weaknesses:* Requires careful calibration of the band; enforcement still needed for compliance; less revenue certainty than full uniformity.  

  *   **Option (c): No Cantonal Law / Mediation Only**  
      *   *Strengths:* Maximizes municipal autonomy (proximity view); avoids cantonal overreach.  
      *   *Weaknesses:* Ignores the demonstrated collective action failure (capacity view). Past attempts at voluntary concordats failed; mediation lacks teeth. Risks continued revenue erosion and potential conflict between municipalities. Places undue burden on weaker municipalities to negotiate.  

  ---

  ### 4. Recommendation: Option (b) - The Balanced Path  
  **Option (b) is the most defensible application of subsidiarity in this complex case.** It recognizes:  
  1.  **The Validity of the Capacity Concern:** The "cheap harbor" problem is real and demonstrably unsolvable by individual municipalities acting alone. Cantonal intervention is justified under subsidiarity to prevent systemic harm.  
  2.  **The Primacy of Proximity Where Possible:** Decisions on *exact* fee levels and local rules remain municipal, respecting differences in tourist base, infrastructure costs, and community priorities.  
  3.  **Cantonal Interest in Fiscal Stability:** Eroded municipal revenues impact cantonal finances (e.g., via equalization payments) and service provision.  

  **The Factual Bet:** Our recommendation assumes that **a carefully calibrated floor-and-ceiling band can be wide enough to accommodate the legitimate economic diversity of shoreline communities without enabling destructive undercutting.**  

  *   **Evidence Against This Bet (to be scrutinized Thursday):**  
      *   Shoreline municipalities presenting *concrete, quantified data* showing their *essential operating costs* or *dominant tourist market price sensitivity* would force them to set fees consistently *outside* any feasible band that also prevents undercutting.  
      *   Evidence that the *range* between the highest feasible floor (preventing undercutting) and the lowest feasible ceiling (allowing necessary revenue) is so narrow it effectively constitutes a uniform tariff.  

  **Safeguards & Process:**  
  *   The band must be set via consultation, using data on municipal costs, market rates, and tourism profiles.  
  *   Include a review clause (e.g., every 5 years) to adjust the band based on evidence.  
  *   **Mandate Cantonal Mediation/Coordination:** The framework law should *require* the canton to facilitate ongoing dialogue between municipalities within the band, aiding harmonization of non-price rules (e.g., permit types, enforcement) where desired.  

  ---

  ### 5. Addressing Concerns  

  *   **To Shoreline Bloc (Capacity View):** This framework *stops the race to the bottom* by eliminating fees below the floor. It provides the essential coordination you lack individually. The ceiling prevents excessive fees that could also harm the region's appeal.  
  *   **To Interior Municipalities (Proximity View):** This is the *minimal necessary* cantonal intervention. It sets boundaries but leaves the core decision – the specific fee level reflecting local needs – with the municipalities. It avoids a full takeover.  
  *   **To Diverse Shoreline Communities (Proximity View):** The band *protects your autonomy* to set fees appropriate to your local economy, *as long as* you don't destabilize neighbors. Mediation helps address non-tariff differences.  

  ---

  ### 6. Conclusion  
  Subsidiarity is not a binary switch but a balancing test. Option (b) best navigates the tension between preventing demonstrable municipal incapacity (the coordination failure) and respecting the constitutional preference for local decision-making. It offers a pragmatic, proportional solution that addresses the petition's core economic concern while upholding municipal autonomy where feasible. We recommend adopting Option (b), contingent on establishing a credible, evidence-based process for setting the initial band and incorporating the safeguards outlined.  

  **Prepared for discussion and decision at Thursday’s session.**
