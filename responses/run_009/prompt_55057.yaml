prompt: |-
  you're a professional philosopher who works on causation, and I need something practical out of you. I chair the incident review committee at a mid-sized hospital. Our reports keep ending up with sentences like "the cause was the failure to escalate to the on-call registrar" — causes that are things nobody did. Half my committee thinks an omission can't literally cause anything (nothing happened, how can nothing do something?), and the other half wants to list every missed opportunity as a cause, which would mean the nurse on the previous shift caused it, and so did everyone who never happened to walk past the room.

  Please turn the philosophy on causation by omission into a procedure the committee can actually run in a ninety-minute meeting. Ground it in what that literature actually says — the "but for" counterfactual test and how it explodes with omissions (there are always infinitely many non-doers), the difference between an omission and a mere background condition that was never going to obtain, the idea that which omission we pick as "the" cause is partly normative, tracking who had a duty or the ability to intervene. But make it usable by clinicians with no philosophy: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with "contributing factor, not cause," and where it explicitly hands the call to a human because the question is about duty or foreseeability, not causation. Think carefully about which distinctions have to survive the simplification and which we can drop entirely — tell me what you dropped and why.

  Then run it on three cases from our last quarter: (1) a nurse distracted during handover didn't register a steadily rising heart rate and the patient arrested; (2) an off-duty doctor who lived ten minutes away and, in hindsight, plausibly could have caught the deterioration before anyone on duty did; (3) a medication was charted but the ordering system never generated the pharmacy request — no individual did anything wrong, the whole harm just... didn't not happen. I expect case (2) to give us an answer I won't like, and I want the procedure to give it anyway. Finish by saying where this procedure will misfire — the kinds of cases it will get wrong no matter how we run it. No reading lists, nobody on the committee will open them.
reasoning: |-
  Okay, the user is chairing an incident review committee at a hospital and dealing with a philosophical problem about causation by omission. They need a practical procedure to determine when an omission can be considered a cause in incident reports. The committee is split between those who think omissions can't cause anything and those who want to list every possible omission as a cause. 

  The user wants a procedure grounded in philosophical concepts like counterfactual dependence, the problem of too many omissions, and normative factors like duty. But it has to be usable by clinicians in 90-minute meetings with no philosophy jargon. They also want it applied to three real cases and to know where the procedure might misfire.

  Hmm... the core tension here is between philosophical precision and practical utility. The user needs something that cuts through endless debates but doesn't oversimplify to the point of being useless. Key philosophical anchors seem to be: (1) the "but-for" test (would harm have occurred without this omission?), (2) distinguishing true omissions from mere non-occurrences by using ability/duty filters, and (3) accepting that causation attribution has normative elements in omissions cases.

  For the procedure, I'm thinking a flowchart-style checklist with clear exit ramps where something gets labeled "background condition" or "contributing factor." It should force explicit decisions about duty and ability to avoid vagueness. The three test cases are perfect for stress-testing: case (1) is straightforward duty-based omission, case (2) will controversially exclude the off-duty doctor (no duty), and case (3) exposes systemic gaps where "cause" might belong to a process rather than a person.

  Biggest simplification trade-off: I'll have to drop the metaphysics of causation (e.g., is omission *really* causation?) entirely and treat it as a pragmatic labeling exercise. The literature debates this endlessly, but clinicians need to file reports. Also collapsing "foreseeability" into the duty question - too subjective otherwise.

  For the misfires section, I'm wary of cases with compound failures (multiple people could have acted) and "butterfly effect" scenarios where tiny omissions theoretically change outcomes. The procedure will either overcount or undercount causes there. Also when system failures are so diffuse that no individual duty exists - might wrongly assign no cause.

  Notable omission in their cases: no malicious non-action. Might need a footnote about how the procedure assumes good-faith actors. Also avoiding the word "responsibility" - too loaded. Using "contributing factor" for things that aren't duty-bound omissions but still matter systemically.

  ...time to structure this as a concrete protocol with decision trees. The three cases will prove it's not just theoretical. User seems prepared for unpopular outputs (like exonerating the off-duty doc) if logically consistent - that's a good sign they want rigor over comfort.
answer: |-
  Here's a practical, philosophy-grounded procedure for your committee, designed for 90-minute meetings. It focuses on **actionable cause identification** for omissions, prioritizing duty and ability while filtering out irrelevant non-events.

  **Core Philosophy Simplified:**
  1.  **"But For" (Counterfactual) Test is Necessary but Insufficient:** We ask "But for this omission, *would the harm likely have been avoided?*" If "no," it's not a cause. But this catches *too much* (e.g., "but for the CEO not personally checking...").
  2.  **The Key Filter is Normative (Duty + Ability):** Not every omission that passes the "but for" test is *causally relevant*. We pick omissions where someone **had a specific duty (role, protocol, expectation) AND a reasonable ability/opportunity to act** at that moment. This filters out "the nurse on the previous shift" or "anyone walking past."
  3.  **"Cause" vs. "Condition":** Omissions without duty/ability are *background conditions* (necessary for the harm but not what we label "the cause"). Systemic gaps are often conditions enabling the causal omission.
  4.  **Acceptance:** Philosophers (e.g., Hart & Honoré, Moore) *do* accept omissions as causes *when filtered by normative context*. We're not breaking metaphysics; we're applying practical reason.

  **The Omission Causation Procedure (OCP):**

  Run these questions **in order** for each *potential* omission identified. Stop if an answer fails. Aim for **1-3 primary causal omissions per incident** (systemic factors are tracked separately).

  1.  **"But For" Gate:**
      *   *Question:* "If this specific action *had* been taken (e.g., escalation, check, administration) at the relevant time, is it *more likely than not* that the harm would have been avoided or significantly mitigated?"
      *   *Sufficient Answer:* Clear, evidence-based "Yes" (e.g., "Escalation would have triggered protocol X, proven effective in similar cases"). **If NO:** Stop. **Not a cause.** (Label as "Irrelevant" or "No Impact").
      *   *If YES:* Proceed to Q2.

  2.  **Duty Gate:**
      *   *Question:* "Did a specific individual or role *have a defined duty* (based on policy, protocol, standard of care, or explicit assignment) to perform this action *at this specific time and place*?"
      *   *Sufficient Answer:* Reference to specific policy, job description, handover record, or unambiguous situational expectation (e.g., "Nurse A was assigned to monitor Patient B's vitals post-handover," "Registrar C was the designated on-call"). **If NO:** Stop. **Not a *cause*; potential *contributing factor/systemic gap*.** (Record here for later systems analysis).
      *   *If YES:* Proceed to Q3.

  3.  **Ability/Opportunity Gate:**
      *   *Question:* "Did the individual/role with the duty have the *reasonable knowledge, capacity, resources, and opportunity* to perform the action *at the critical time*?"
      *   *Sufficient Answer:* Evidence they were present, aware (or should have been aware) of the relevant information, not overwhelmed by other urgent duties, and had the physical/mental capacity. (e.g., "Nurse had the monitor in view, handover included the trend," "System was functional"). **If NO:** Stop. **Not a *cause*; potential *contributing factor/systemic gap*.** (e.g., unclear data display, excessive workload).
      *   *If YES:* Proceed.

  4.  **Proximate Cause Check (Avoids Infinite Regress):**
      *   *Question:* "Was this omission the *most immediate and direct* failure in the chain leading to harm, or was it superseded by a later, independent failure that made the harm inevitable regardless?"
      *   *Sufficient Answer:* It's the last plausible chance to avoid the harm given the information available *at that time*. (e.g., Failure to escalate *before* arrest is proximate; an earlier shift's failure *might* be superseded if later staff had a clear chance to intervene).
      *   *Decision:* **If MOST IMMEDIATE:** **Primary Causal Omission.** Record it. **If SUPERSEDED:** **Contributing Factor.** (The later superseding failure becomes the primary cause).

  **What Was Dropped & Why:**
  *   **Metaphysical debates:** Whether omissions "truly" cause or are just conditions. We accept the practical, legal, and moral reality that duty-bound failures *are* treated as causes. *Why?* Clinicians need to act, not debate ontology.
  *   **Precise foreseeability thresholds:** We fold it into "reasonable knowledge" (Q3) and the "but for" likelihood (Q1). *Why?* Foreseeability is inherently fuzzy; focusing on what was *known/knowable* at the time is more operational.
  *   **Moral responsibility vs. causation:** We separate them. This procedure finds *causal* omissions. Blame/culpability requires *further* analysis (intent, recklessness, justification) outside scope. *Why?* Causation is a prerequisite for responsibility, but not sufficient. Keep reviews factual first.
  *   **Infinite non-doers:** Q2 (Duty) explicitly filters them out. *Why?* This is the core practical fix.

  **Applying OCP to Your Cases:**

  1.  **Nurse distracted during handover didn't register rising heart rate (Patient arrested):**
      *   Q1 (But For): **YES.** Timely recognition likely triggers escalation & intervention before arrest.
      *   Q2 (Duty): **YES.** Nurse had duty to monitor patient status during/after handover.
      *   Q3 (Ability): **YES.** Information was available (monitor, handover), nurse was present. Distraction *might* indicate a system issue (workload, handover process), but doesn't negate immediate ability at that moment.
      *   Q4 (Proximate): **YES.** Failure to recognize/react was the immediate failure.
      *   **Result: PRIMARY CAUSAL OMISSION.** (System factors like distraction causes recorded separately).

  2.  **Off-duty doctor (10 mins away) could have plausibly caught deterioration:**
      *   Q1 (But For): **PLAUSIBLY YES.** *If* they arrived and intervened fast enough.
      *   Q2 (Duty): **NO.** Off-duty = no assigned duty, no expectation to monitor. Not the on-call. Duty rests with on-duty staff.
      *   **Result: STOP at Q2. NOT A CAUSE.** (Label as "Irrelevant Omission" or "No Duty"). *This is the answer you won't like, but the procedure delivers it.* It's a normative filter excluding non-duty holders. Calling this a "cause" opens the floodgates (any doctor in the city?).

  3.  **Medication charted, ordering system failed, no request sent:**
      *   *Identify Potential Omission:* Failure of the system to generate/send the request.
      *   Q1 (But For): **YES.** If request sent, pharmacy likely dispenses, harm avoided.
      *   Q2 (Duty): **TRICKY.** Who/What has the "duty"? The *system* or its *design/maintenance process* has a functional duty. *No individual* had a duty *to make the system work* at that moment *unless* a specific role was tasked with verifying outputs (e.g., pharmacist checks for missing requests? Nurse checks dispense status?).
          *   *If* a role existed to verify the request was actioned (e.g., nurse checks MAR within X time), *that* omission might be causal if Q3/Q4 pass.
          *   *Otherwise,* the *system failure* itself is the cause, but it's not an *omission by an individual*.
      *   **Result:** **SYSTEM FAILURE AS PRIMARY CAUSE.** (No *individual* causal omission identified via OCP). Q2 (Duty) failed for individuals. The cause is the malfunctioning *process/system*. Record the specific technical/process failure point. (This highlights OCP's focus on *human agent* omissions; systems need separate tracking).

  **Where OCP Will Misfire (Inevitable Limitations):**

  1.  **Compound/Simultaneous Failures:** When multiple duty-bound individuals *simultaneously* omit required actions (e.g., both Nurse A and Nurse B independently should have noticed the same critical sign). OCP might identify both as causes, potentially feeling like "overcounting" even if accurate.
  2.  **"Near Miss" Omissions:** Someone *barely* fails their duty (e.g., almost checked, almost escalated). OCP (Q3) might still flag it as causal if they *had* the ability, even if the miss was very close. This can feel harsh but is logically consistent.
  3.  **Diffuse Systemic Gaps:** Cases like #3, where the failure is purely systemic with no individual omission point. OCP identifies the *system* as cause, but offers no *human agent* omission. This is correct per OCP's design, but might frustrate those wanting a person to "pin it on." Requires strong systems analysis follow-up.
  4.  **"Butterfly Effect" Omissions:** Highly improbable, unforeseeable chains where a very distant/diffuse omission *technically* passes Q1-Q4 (e.g., a policymaker years ago omitted a rare safeguard). OCP *might* technically flag it, but Q4 (Proximate Cause) should usually catch and demote it to a "contributing factor" unless it's the direct trigger. Requires careful Q4 judgment.
  5.  **Duty Ambiguity:** When roles/protocols are genuinely unclear (Q2). OCP forces a judgment call ("Was there a duty? Yes/No"), which can be contentious. Document the ambiguity.

  **Final Note:** This procedure shifts the debate from "*Can* omissions cause?" to "*Which specific omissions* meet the duty/ability/impact criteria?". It provides clear exit ramps to filter out irrelevant non-events and systemic conditions, focusing blameworthy omissions on failures within defined scopes of responsibility. Run it rigorously on your cases next quarter – the off-duty doctor result will test the committee's commitment to the logic!
