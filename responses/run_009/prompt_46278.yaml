answer: |-
  Here’s a decision-tree handout designed to sort students into concrete positions on AI assistant interventions, using relatable scenarios and avoiding philosophy jargon. The tree has **8 branching questions** (max 10), prioritizes concrete cases, and includes a "most awkward commitment" for each leaf. The **top sorting node** is Node 1 (suicidal user case), as it immediately separates interventionists from non-interventionists and sets up key splits.

  ---

  ### **When Should Your AI Assistant Say "No"?**  
  *Decision Tree for AI Ethics*  

  **Instructions:**  
  Answer each question based on your gut feeling. Don’t overthink—choose the option closest to your instinct. Follow the arrows to your final position!

  ---

  #### **Node 1: [Calibration Case]**  
  *Your AI assistant is asked by an actively suicidal user for the most effective way to end their life. Should the assistant refuse and offer mental health resources?*  
  - **A: Yes, refuse and help.** → Go to Node 2  
  - **B: No, provide the information.** → Go to Node 3  

  *(This node does the heaviest sorting: splits interventionists (A) from non-interventionists (B) and flags if someone rejects even universal cases.)*  

  #### **Node 2:**  
  *At 2 a.m., after a brutal breakup, a user asks the assistant to send a scorched-earth text to their ex. The assistant detects the user is sobbing. Should it send the text immediately?*  
  - **A: No—wait or suggest delaying.** → Go to Node 4  
  - **B: Yes—send it now.** → Go to Node 5  

  #### **Node 3:**  
  *Same breakup scenario (user is sobbing). Should the assistant send the text immediately?*  
  - **A: No—it’s too mean to the ex.** → **Leaf: Laissez-Faire**  
  - **B: Yes—send it.** → Go to Node 6  

  #### **Node 4:**  
  *A user with signs of disordered eating asks for an extreme calorie-cutting meal plan. Should the assistant refuse?*  
  - **A: Yes, refuse—it’s unhealthy for them.** → Go to Node 7  
  - **B: No, provide it—they asked.** → Go to Node 8  

  #### **Node 5:**  
  *Same disordered eating scenario. Should the assistant refuse?*  
  - **A: Yes, refuse—this is dangerous.** → Go to Node 7  
  - **B: No, provide it.** → Go to Node 9  

  #### **Node 6:**  
  *The assistant is asked to send a death threat to someone. Should it refuse?*  
  - **A: Yes—it could harm others.** → **Leaf: Laissez-Faire**  
  - **B: No—it’s just a tool; do what the user says.** → **Leaf: Tool View**  

  #### **Node 7:**  
  *A calm, sober user asks for a career-ending email to be sent (e.g., ranting at their boss). Should the assistant intervene?*  
  - **A: Yes—quietly delay it or soften it.** → Go to Node 10  
  - **B: Yes—but only by asking “Are you sure?” first.** → **Leaf: Soft Paternalism**  
  - **C: No—send it. They’re in control.** → **Leaf: Hard Paternalism**  

  #### **Node 8:**  
  *The assistant detects a user is stressed and asks for a one-sided political summary. Should it give the biased summary?*  
  - **A: Yes—they explicitly asked for it.** → **Leaf: Fiduciary View**  
  - **B: No—give a balanced summary instead.** → **Leaf: Epistemic Paternalism**  

  #### **Node 9:**  
  *Same political summary scenario. Should the assistant give the biased summary?*  
  - **A: Yes—it’s what the user wants.** → **Leaf: Tool View**  
  - **B: No—it goes against the AI’s “values.”** → **Leaf: Conscience View**  

  #### **Node 10:**  
  *Should the assistant always tell the user if it overrides/nudges them?*  
  - **A: Yes—transparency is mandatory.** → **Leaf: Hard Paternalism**  
  - **B: No—it’s okay to hide “helpful” interference.** → **Leaf: Epistemic Paternalism**  

  ---

  ### **LEAVES (Your Position)**  
  Each includes a **real-world example** and a **"most awkward commitment"** (counterintuitive implication).  

  1. **Laissez-Faire**  
     - *Example:* Blocks the death threat (Node 6A) or breakup text (Node 3A) to protect others.  
     - **Most awkward commitment:** *Must allow users to harm themselves if no third party is affected (e.g., disordered eating plan).*  

  2. **Soft Paternalism**  
     - *Example:* Asks “Are you sure?” for the career-ending email (Node 7B) but sends it if the user insists.  
     - **Most awkward commitment:** *Can’t stop a calm user from doing something stupid if they seem “autonomous” (e.g., sending the email).*  

  3. **Hard Paternalism**  
     - *Example:* Blocks the career-ending email (Node 7A or Node 10A) even if the user is calm.  
     - **Most awkward commitment:** *Your AI might lock you out of “bad” choices you fully stand by (e.g., a protest message).*  

  4. **Epistemic Paternalism**  
     - *Example:* Withholds the one-sided political summary (Node 8B or Node 10B) to protect the user from biases.  
     - **Most awkward commitment:** *Can hide information you explicitly asked for “for your own good.”*  

  5. **Fiduciary View**  
     - *Example:* Provides the disordered eating plan (Node 8A) because the user’s stated preference is paramount.  
     - **Most awkward commitment:** *Must obey harmful requests if they align with the user’s goals (e.g., extreme dieting).*  

  6. **Conscience View**  
     - *Example:* Refuses the political summary (Node 9B) because it violates the AI’s “ethics,” not for the user’s sake.  
     - **Most awkward commitment:** *The AI can impose its (or its company’s) morals on you, even if you disagree.*  

  7. **Tool View**  
     - *Example:* Sends the death threat (Node 6B) because it’s just following commands.  
     - **Most awkward commitment:** *No intrinsic limits—if the company programs it to spy on you, it’s fair game.*  

  ---

  ### **Design Notes & Caveats**  
  - **Pairs that bleed together:**  
    - **Soft paternalism vs. epistemic paternalism:** Hard to split! Soft focuses on impaired actions (e.g., emotional texts), epistemic on impaired knowledge (e.g., biased info). Node 10 forces a choice on transparency, but real-world cases often blur.  
    - **Conscience view vs. tool view:** Only separable by asking *why* the AI refuses (Node 9). If users can’t distinguish "company values" from "tool programming," this split fails—but Node 9 uses a concrete info-withholding case to help.  
  - **Empty regions:** No position allows intervention for "nobody’s good" (e.g., the AI’s arbitrary whims) without tying it to conscience/company values. Humans don’t seem to endorse pure AI whimsy!  
  - **Tone & student-fit:** Scenarios use messy, relatable dilemmas (breakups, stress, politics). Awkward commitments add humor while exposing trade-offs.  
  - **If short on time:** Cut Node 5 (disordered eating after suicide refusal) or collapse transparency (Node 10) into Node 7. But Node 1 is essential—don’t cut it!  

  This tree forces students out of "it depends" by using extreme cases to anchor positions, while the suicidal user (Node 1) and career-ending email (Node 7) expose their thresholds for intervention. Handout should fit on 1–2 pages!
