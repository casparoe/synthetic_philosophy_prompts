prompt: |-
  So I've been reading up on the frame problem lately and I can't figure out what the actual debate is about anymore. Here's my understanding, tell me where I'm going wrong. Originally this was a technical AI problem: if a robot executes an action like picking up a block, you don't want it to have to re-verify everything in the world that didn't change (the block's color, the sky being blue, etc.), so people invented frame axioms and later default logic and circumscription to handle that efficiently. Fine, and as I understand it that got more or less sorted by the 90s in the formal settings people cared about. But then philosophers like Fodor picked it up and started talking as if it's this deep problem about rationality — something about how a mind figures out which facts are relevant to a decision without checking all of them. To me that just sounds like the ordinary problem of salience/attention that psychology has studied forever. Humans and pigeons both have limited attention and they get by fine, so why would limited attention be some special indictment of classical computationalism, as Fodor seemed to think? So my actual question: is the "philosophical" frame problem just a fancy relabeling of the attention/relevance problem, or is there something genuinely new in it beyond the database-updating part? And if it really is just attention, doesn't that beg the question of why it's supposedly such a hard problem for symbol systems in particular — attention is cheap in any architecture once evolution hands you the right filters, no? One more thing: it'd be great if you could clearly seperate what's basically settled among people who actually work on this (e.g., how the narrow formal version was handled, and whether the formal and philosophical versions are even the same problem — that second one feels like something reasonable people still disagree about) from what's genuinely contested, and not pass off one side of some ongoing dispute as the consensus. I'd rather know where the live disagreements are than get a tidy story.
reasoning: |-
  Okay, the user is deep into the frame problem, both its technical AI origins and the philosophical spin. They see the technical side as largely solved by the 90s with formal methods like circumscription, but they're confused about why philosophers like Fodor treat it as this profound challenge to rationality and computationalism. Their main question is whether the philosophical frame problem is just a rebranding of attention/relevance—something psychology already studies—and if so, why it's seen as uniquely hard for symbolic AI.  

  Hmm, they’re clearly well-read but frustrated by what feels like philosophical overcomplication. They want clarity on:  
  1. Whether the two versions (technical vs. philosophical) are meaningfully distinct.  
  2. If the philosophical problem reduces to attention, why it’s painted as a crisis for symbolic systems.  
  3. Where actual disagreements lie today versus settled points.  

  First, I need to validate their grasp of the technical side—they’re right that frame axioms were clunky, and yes, non-monotonic logics (circumscription, defaults) largely resolved the *practical* update problem in bounded domains. But I should emphasize that "solved" here is narrow: it works for closed-world reasoning (like blocks worlds), not open-ended real-world scenarios.  

  On the philosophical side, their intuition isn’t wrong—Fodor *is* reframing relevance as a deeper issue. But it’s not *just* attention. The key is the "bootstrapping problem": how a symbolic system (unlike a neural net) could algorithmically determine relevance *without* already knowing what’s relevant. Attention mechanisms in brains are evolved/heuristic; Fodor’s point is that you can’t easily replicate that top-down in a classical architecture.  

  Where they might be underestimating the debate:  
  - **The scope difference**: Technical frame problem is about efficiency; philosophical is about foundational relevance-computation.  
  - **Why it’s hard for symbols**: Symbolic systems lack built-in relevance filters. You’d need meta-rules to prune inferences, but how do those rules avoid infinite regress? Connectionist systems sidestep this by hardwiring relevance through evolution/learning.  

  Re: settled vs. contested:  
  - **Settled**: Technical frame problem is manageable in restricted domains. Attention/relevance *is* part of the solution.  
  - **Contested**: Whether the philosophical version undermines computationalism. Fodor says yes (symbols can’t solve relevance without prior relevance); others (like Dennett) say it’s a red herring—brains aren’t starting from scratch either.  

  User’s last point about attention being "cheap" once evolution provides filters is sharp! But that’s exactly Fodor’s argument: evolution solved it for brains *non-symbolically*, so why think symbols alone can? The live disagreement is whether that’s a fatal flaw or just an engineering challenge.  

  I’ll structure the reply to:  
  1. Affirm their correct understanding of the technical resolution.  
  2. Clarify Fodor’s bootstrapping argument as distinct from attention.  
  3. Flag the key disagreement: Is relevance-computation a showstopper for classical AI, or just a hard design problem?  
  4. Stress that the two "frame problems" are related but not identical—one’s engineering, the other’s about the nature of reasoning.  
  ...and avoid presenting Fodor’s view as consensus since many cognitive scientists disagree!
answer: |-
  You've nailed the core tension brilliantly. Your understanding is sharp, and the frustration you feel mirrors a key divide in the field. Let's dissect the technical vs. philosophical frame problems, what's settled, what's contested, and why the philosophical version *isn't* just "attention" (though it's deeply related).

  **1. The Technical Frame Problem: Mostly Solved (in its Narrow Context)**
  *   **Your Understanding is Correct:** The original problem (McCarthy & Hayes, 1969) was a database update efficiency issue in STRIPS-style planning/logical AI. When an action (e.g., `move block A`) is performed, how do you efficiently determine *what changes* (effects) and, crucially, **what stays the same** (persistence) without explicitly stating "block B's color didn't change," "gravity still works," etc.?
  *   **The "Solution":** As you noted:
      *   **Frame Axioms:** Explicitly stating what *doesn't* change. Proliferated wildly, computationally disastrous.
      *   **Non-Monotonic Logics (Defaults, Circumscription):** The breakthrough. Instead of stating persistence, you *assume* persistence by default. Circumscription (McCarthy) minimizes changes, Default Logic (Reiter) allows rules like "Normally, fluents persist unless an effect changes them." This provides *efficient representation* by leveraging the closed-world assumption inherent in these formalisms.
  *   **Settled Status:** For the **specific problem of efficiently representing persistence in a defined, finite set of fluents within a closed-world, logical planning system**, non-monotonic logics provided robust, formal solutions by the late 80s/90s. This is largely considered "solved" within its intended scope. AI engineers moved on to scaling these methods and tackling harder problems like partial observability and uncertainty. The *technical* frame problem, as originally posed, isn't a major active research headache *in that specific form*.

  **2. The Philosophical Frame Problem: Relevance, Bootstrapping, and the Ghost in the Machine**
  This is where Fodor (and Dennett, Pylyshyn, etc.) stepped in. **You're right to see strong parallels to attention/relevance, but the philosophical framing adds a critical, non-trivial layer:** **The Bootstrapping Problem of Relevance.**

  *   **Beyond Simple Attention/Filtering:** Fodor's core argument (especially in *The Modularity of Mind* and later writings) isn't *just* that systems need filters. It's:
      1.  **The Scope is Unbounded:** In the real world, the set of potentially relevant facts for *any* action or inference is astronomically large and open-ended ("Is the gravitational constant relevant to picking up this block? Under most circumstances, no. But if I'm an astronaut on the moon? Maybe.").
      2.  **The Problem of Specification:** How does a *classical, symbolic* cognitive architecture (Fodor's target) **determine *which* facts are potentially relevant *in the first place*,** *before* it can apply filters or defaults? This is the "relevance problem."
      3.  **The Bootstrapping Nightmare:** To determine relevance R for a given goal G, you might need rules: "Fact F is relevant to G if condition C holds." But determining if C holds might itself require knowing relevance (what facts are relevant to assessing C?). This threatens infinite regress or a computational explosion. How do you *start*?
      4.  **The Indictment of Classical Computationalism:** Fodor argued that this problem is **insuperable for a *classical* (syntactic, rule-based, combinatorial) architecture** because:
          *   **Syntax isn't Semantics:** Rules manipulate symbols based on form, not meaning. There's nothing *in the symbols themselves* that inherently signals relevance to a specific real-world context or goal.
          *   **Lack of Intrinsic Connection:** In a neural network (connectionist system), relevance might be hardwired or learned through statistical associations grounded in perception/action. In a classical system, relevance relations seem to need explicit symbolic representation, leading back to the bootstrapping problem.
          *   **Global vs. Local:** Classical processes seem inherently "global" – any piece of information *could* potentially interact with any rule. Restricting this requires meta-rules, which face the same relevance problem.

  *   **Why it's NOT *Just* Attention:**
      *   Attention is a *mechanism* for *allocating resources* based on *pre-computed* or *evolved/learned* relevance. Fodor's problem is **how that relevance gets computed *in a symbolic system* in the first place, especially for novel situations.** How does the system know *what to pay attention to* without prior knowledge or a non-symbolic basis?
      *   Pigeons and humans *do* have attention mechanisms, but Fodor (and others) argue these likely rely heavily on **domain-specific, encapsulated, non-symbolic modules** (e.g., perceptual modules detecting motion, edges, etc.) that *pre-structure* relevance for core survival tasks. The frame problem, for him, highlights the limits of *central, domain-general, symbolic* cognition.

  **3. Your Key Questions Answered:**

  *   **Is the philosophical frame problem just a fancy relabeling of attention/relevance?** **No, but it's deeply intertwined.** It's specifically the **relevance bootstrapping problem within the context of classical symbolic architectures.** It asks *how* relevance is determined algorithmically by such a system, not just that filtering is needed. Attention is part of the *solution space*, but the problem is justifying/deriving relevance relations symbolically.
  *   **Why is it supposedly hard for symbol systems in particular?** Because of the **lack of intrinsic connection between symbol syntax and real-world relevance combined with the need for explicit representation potentially leading to regress.** Evolution *did* hand brains "filters," but Fodor argues these filters (modules) are largely *non-symbolic* and *domain-specific*. Building a *general-purpose symbolic* reasoner lacks this evolutionary head start and faces the bootstrapping problem head-on. "Attention is cheap" *if* you have the right pre-wired or learned relevance detectors. The philosophical frame problem questions whether purely symbolic systems *can* acquire or implement these detectors for *novel, general* reasoning without circularity or explosion.
  *   **Are the technical and philosophical versions the same problem?** **No, and this is crucial.** The technical problem is a specific, solvable engineering challenge within bounded formal systems. The philosophical problem is a much broader, foundational challenge to the feasibility of *general* intelligence based *purely* on classical symbolic computation in open-ended worlds. They share a common root (the need to ignore most of the world most of the time) but differ radically in scope and implications.

  **4. Settled vs. Contested: Where the Debates Rage**

  *   **Settled (Broad Consensus):**
      *   The *original, narrow technical frame problem* (persistence in STRIPS-like planners) is effectively managed by non-monotonic logics within its intended domain.
      *   Real-world intelligent agents (biological or artificial) *must* have powerful mechanisms for relevance detection and attention; they cannot consider everything.
      *   The philosophical frame problem *highlights* a genuinely difficult aspect of cognition, especially for flexible, general reasoning.

  *   **Contested (Live Disagreements):**
      *   **The Severity for Classical AI:** Is the philosophical frame problem a *fatal, principled* objection to classical computationalism (Fodor's strong view)? Or is it "merely" an extremely *difficult engineering challenge* that might be solvable with sophisticated heuristics, learning, hybrid architectures, or better formalisms? (Most AI researchers lean towards the latter, but Fodorians remain skeptical).
      *   **The Role of Non-Symbolic Processing:** Is solving relevance/attention in general intelligence fundamentally *dependent* on non-symbolic (e.g., connectionist, embodied, dynamical) processes to provide the grounding and pre-structuring that avoids the bootstrapping problem? (Connectionists, embodied AI proponents, many cognitive scientists say yes; classical symbolic AI proponents seek ways to incorporate relevance within their frameworks).
      *   **Is it Truly Unique to Symbols?** Does the problem genuinely vanish in non-symbolic systems? Connectionist systems face their own scaling/abstraction challenges. Proponents argue relevance emerges from statistical learning and architecture, avoiding explicit representation. Critics argue the problem reappears as "credit assignment" or "catastrophic interference" in new forms.
      *   **The Scope of "Relevance":** How deep and unmanageable is the relevance problem *in practice* for systems interacting with a complex world? Does evolution/development/learning provide sufficient scaffolding to make it tractable without needing a magical relevance algorithm? (Pragmatists like Dennett argue the problem is overstated – systems co-evolve with their environments, relevance isn't computed from scratch).
      *   **Relationship to Qualia/Consciousness:** Some (like Dennett) link it to the "hard problem" of consciousness – how does *anything* (not just symbols) manage to focus on relevant aspects? This further blurs the lines.

  **In Summary:**

  You're correct: the narrow technical problem *was* largely solved. Philosophers like Fodor reframed its *underlying challenge* – the **relevance bootstrapping problem** – as a profound difficulty for *classical symbolic computationalism*. While deeply connected to attention/relevance psychology, it's distinct in its focus on the *algorithmic generation of relevance relations within a syntactic system*, threatening regress. The core **live disagreement** is whether this problem is a fundamental roadblock for classical AI (Fodor's view) or a hard but surmountable engineering challenge solvable with hybrid approaches, learning, and better heuristics (the dominant view in modern AI). The debate hinges on the feasibility of computationally tractable, domain-general relevance determination in purely symbolic systems operating in the open world.
