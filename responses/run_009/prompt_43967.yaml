prompt: |-
  My flatmate and I have fallen into a running argument about arguments — specifically, about when a disagreement is merely verbal — and since we keep trading anecdotes instead of getting anywhere, I've decided to just write down my gut verdicts on a bunch of cases and find out whether they add up to a principle. That's where I'd like your help: tell me what principle, if any, captures the pattern below, what it predicts for cases I haven't thought of, and which of my verdicts the best principle would force me to give up.

  Here is the list. First, the hot dog: my flatmate maintains it is a sandwich, I deny it, but once we each say what we mean — any filling enclosed in bread versus a filling held between two discrete slices — there seems to be nothing left to fight about, so my verdict is that our dispute is merely verbal. The tomato is the same: fruit on the botanical sense, vegetable on the culinary one, and the disagreement dissolves the moment the senses are flagged. The old one about the tree falling in an uninhabited forest I also call verbal: one party means pressure waves in the air, the other means an auditory experience, and neither contests any fact about either. The dispute over whether there really are tables and chairs, as opposed to mere simples arranged chairwise, I call verbal for ordinary purposes, though something about that verdict nags at me. Now the ones that don't fit so easily. The teletransporter: a machine scans you, destroys your body, and builds an exact physical and psychological duplicate elsewhere; one side says the person who steps out at the far end is you, the other says you died and a copy began. My verdict is that this dispute is NOT merely verbal — something seems to turn on it, like whether I should be willing to step into the machine, or whether the operator is a murderer — even though the two parties appear to agree about every fact in the world (the exact arrangement of atoms, the continuity of psychology, the discontinuity of matter) and to differ only over whether the expression 'same person' applies. But that is precisely the shape of the hot-dog case, where I happily called it verbal, so my verdicts here look inconsistent unless caring about the outcome is itself what makes a dispute non-verbal, which seems to let anyone convert a verbal dispute into a substantive one just by caring hard. For contrast: whether there is a largest prime number is substantive in my book even though it is long settled and nobody is confused about the meaning of any term; and whether free will is compatible with determinism I honestly cannot classify — it feels substantive, but I can't name the fact, known to both sides, that would settle it, which is supposedly the mark of the merely verbal. Finally, whether numbers exist: in one mood I say verbal, since both sides claim they can restate their positions without the disputed vocabulary; in another, I suspect the question is as substantive as the one about primes.

  So here is what I'd like from you. Propose the principle (or a small set of candidates) that best captures these verdicts — something in the neighborhood of: a dispute is merely verbal when, once every factual question is answered and every ambiguous term disambiguated, nothing either party has reason to care about remains unsettled. If that is the principle, say plainly whether it puts the hot dog and the teletransporter in the same box, leaving my differing verdicts to be explained away as mere differences in how much I care; or whether there is a principled distinction between a term whose application is fixed by convention with nothing at stake (sandwich) and one whose application matters to something independent of convention, like prudential concern or responsibility (person). Then tell me what the principle says about a case I haven't listed: whether death is bad for the one who dies, where one party means bad for the surviving subject — who, by their lights, no longer exists to suffer — and the other means an instance of a state of affairs we have independent reason to prevent. And finish by being explicit about which of my verdicts your best principle cannot accommodate, and whether I should revise the verdict or complicate the principle.
reasoning: |-
  Alright, let me start by unpacking the user's query. They're stuck in a recurring argument with their flatmate about what makes a disagreement merely verbal. They've listed several examples and their gut verdicts on each, but they're inconsistent and they want a principle that explains their judgments. 

  First, I need to understand their examples. The hot dog and tomato cases are straightforward: once definitions are clarified, the disagreement vanishes. That fits the classic verbal dispute model. The tree falling in the forest is similar—different meanings of "sound" resolve it. The tables and chairs one is trickier; they call it verbal but feel uneasy, maybe because it touches on deeper metaphysical issues.

  Then come the tough cases. The teletransporter paradox: they think it's not verbal because real consequences like survival and murder are at stake. But this clashes with the hot dog case, where definitions also decide the outcome. They're aware of this inconsistency and worry that caring too much might turn any verbal dispute into a substantive one. 

  The math examples add another layer. The largest prime is substantive even though terms are clear, and free will vs. determinism feels substantive but lacks a clear factual resolution. Numbers existing seems to waver between verbal and substantive.

  The user's core struggle is reconciling cases where definitions settle things (verbal) with those where definitions seem to carry weight beyond convention (substantive). They hint at a principle involving resolved facts and remaining stakes, but they're unsure if caring makes it non-verbal.

  Now, the deeper needs. The user isn't just after a definition; they want a framework to resolve their arguments productively. They might be frustrated with circular debates and seek a tool to distinguish resolvable vs. fundamental disagreements. Their mention of caring suggests they value practical implications, like ethical or personal stakes. 

  I should consider principles that separate linguistic conventions from substantive facts. The "no fact of the matter" approach (like in the hot dog case) vs. "stakes matter" (like in teletransportation). But stakes are subjective, so a hybrid principle might work: disputes are verbal when fixing facts and definitions leaves no disagreement. But when applying a term has normative consequences (like personhood affecting rights), it becomes substantive. 

  For the death case: if both agree on the physical facts but disagree on whether "bad for the deceased" applies, it's verbal unless tied to moral duties. If one side says preventing death is inherently valuable, that could make it substantive. 

  The user's verdict on free will is tricky—no clear facts, but it feels substantive. The principle might call it verbal, urging them to revise. Teletransporter would be substantive under the hybrid view because personhood affects ethics, not just semantics. 

  Ultimately, they need clarity on when semantics mask deeper issues vs. when they're the whole battle. Highlighting the role of normative consequences could help them navigate future arguments with their flatmate more constructively.
answer: |-
  Based on your verdicts and the underlying tensions, the best principle capturing your pattern is a **hybrid conventionalist/normative significance principle**:

  **A dispute is merely verbal when:**
  1.  **All factual disagreements are resolvable** by clarifying the meaning of ambiguous terms or concepts (conventionalist core), *and*
  2.  **The resolution leaves no relevant normative or practical implication unresolved** (normative significance filter).

  **How it explains your verdicts:**

  1.  **Hot Dog, Tomato, Tree:** Satisfies both conditions. Clarifying "sandwich," "fruit/vegetable," or "sound" resolves all factual disagreement *and* leaves nothing significant at stake. No one reasonably changes their behavior based on the linguistic convention chosen. *(Fits)*
  2.  **Tables & Chairs (Ordinary Purposes):** Satisfies both conditions *for ordinary purposes*. Clarifying "table" as a collection of simples arranged tablewise resolves the factual issue. For deciding where to sit or eat, the convention chosen makes no practical difference. Your nagging feeling likely stems from sensing that *philosophically*, condition 2 might fail (if ontology impacts other beliefs), but you correctly isolate the *ordinary* context. *(Fits)*
  3.  **Largest Prime:** Fails condition 1. The meanings of "largest," "prime," and "number" are unambiguous and agreed upon. The disagreement is about the objective properties of mathematical entities, not convention. Clarifying terms doesn't resolve it; proof does. *(Fits - substantive)*
  4.  **Teletransporter:** **Fails condition 2.** While clarifying "same person" might seem like resolving ambiguity (condition 1), the resolution has *profound normative implications* (survival, murder, prudential concern). Choosing one convention over the other *directly* answers whether you should step in or if the operator is a murderer. There *is* something left to care about *after* the linguistic convention is specified. This makes it non-verbal. *(Fits - NOT merely verbal)*
  5.  **Free Will:** **Likely fails condition 1.** While both sides know all the physical facts about determinism and human action, the core ambiguity lies in the meaning of "free will" itself. Is it just the absence of coercion? The ability to have done otherwise? Sourcehood? Clarifying *which* concept is being discussed is essential. However, even if clarified (e.g., "free will" meaning ultimate sourcehood), condition 2 might *also* fail because the answer has significant implications (moral responsibility, desert). This explains your uncertainty: it might be partly verbal (needs clarification) but also deeply substantive due to normative weight. *(Fits your inability to classify)*
  6.  **Existence of Numbers:** **Fails condition 1.** The disagreement isn't primarily about the meaning of "number" (both sides agree on properties like 2+2=4) but about the meaning of "exist." Does existence require spatio-temporal location? Causal efficacy? Or just consistency within a system? Clarifying the ontological commitments embedded in "exist" is crucial and not merely conventional fiddling – it reflects a deep metaphysical stance with potential implications for the nature of reality and knowledge. This aligns with your suspicion it's as substantive as primes. *(Fits - substantive, or at least not clearly verbal)*

  **Applying the Principle to the New Case: Is Death Bad for the One Who Dies?**

  *   **The Dispute:** One side defines "bad for S" as requiring a subject S to experience the badness. The other defines it as referring to a state of affairs (S's non-existence) that is intrinsically bad or that we have independent reason to prevent.
  *   **Analysis:**
      *   **Condition 1:** The dispute hinges entirely on the meaning of "bad for S." Clarifying the definition resolves the factual disagreement about whether the *state* qualifies under the chosen definition.
      *   **Condition 2:** Does the resolution leave normative implications unresolved? **Crucially, yes.** The choice of definition has direct normative consequences:
          *   If "bad for S" requires an experiencing subject, then death *isn't* bad for the deceased. This might weaken obligations to prevent death for the person's *own sake* (though other reasons remain).
          *   If "bad for S" means the state of being dead is intrinsically bad, then it *is* bad for the deceased. This grounds a stronger, direct obligation to prevent death *for that person's benefit*.
      *   **Verdict:** **NOT merely verbal.** While clarifying the definition resolves the semantic issue (condition 1), the choice of definition carries significant normative weight regarding our duties to the dying and the deceased (fails condition 2). The dispute reflects a deeper disagreement about the nature of harm and well-being.

  **Which Verdict Must Be Revised?**

  The principle forces you to **revise your verdict on the Teletransporter case being inconsistent with the Hot Dog case.** They are *not* inconsistent under this principle:

  *   **Hot Dog:** Clarifying "sandwich" resolves everything. No stakes remain. (Verbal)
  *   **Teletransporter:** Clarifying "same person" resolves the semantics, but crucially *does not resolve* the high-stakes normative questions (survival, murder). The *choice of convention itself* determines the answers to those questions. (Substantive)

  **Conclusion:**

  Your instinct that "caring" matters is correct, but it's not just subjective caring. The principle identifies **normative significance** – whether the linguistic convention *itself* carries weight for independent concerns like survival, responsibility, moral duties, or prudential rationality. This distinguishes cases like "sandwich" (merely conventional) from "same person" in teletransportation (convention determines survival/murder) and "bad for S" in death (convention determines the nature of harm).

  This hybrid principle captures your core intuitions across the cases, provides a clear distinction between the hot dog and teletransporter, explains the ambiguity in free will and numbers, and gives a plausible verdict on the death case. The key revision is embracing the non-verbal nature of the teletransporter dispute *because* the stakes are inherent to the meaning of the term "same person" in that context.
