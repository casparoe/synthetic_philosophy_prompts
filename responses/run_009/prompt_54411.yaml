answer: |-
  Your argument is rigorous, original, and philosophically astute. It effectively reframes the demandingness debate and exposes dialectical weaknesses in common objections. Below, I address your questions with a focus on soundness, potential gaps, and strategic positioning:

  ### 1. **Exhaustiveness of the Trilemma & Contractualism**  
     Your trilemma is *structurally* defensible but risks underestimating **contractualist justifications**. Contractualism (e.g., Scanlon) doesn’t fit neatly into "beneficiary-limited" or "agent-protective":  
     - It is **not beneficiary-limited** in your sense: The "reasonable rejectability" criterion doesn’t appeal to what beneficiaries *deserve* or *can demand* but to what *any person* (including the agent) could reasonably accept as a principle governing behavior. The needy person’s claim is balanced against the agent’s claim to a life, not subordinated to fair shares.  
     - It is **not agent-protective** in your sense: The ceiling emerges from mutual justifiability, not an agent-relative "ownership" claim.  
     - **Consequence**: A contractualist ceiling *might* evade your first two horns. However, it arguably collapses into your **third horn** (covert consequentialism) or reveals a gap:  
       - If "reasonable rejectability" is grounded in *objective interests* (e.g., agents need autonomy for well-being; beneficiaries need aid), the ceiling is teleological—effectively consequentialist at a foundational level.  
       - If it’s grounded in procedural rationality alone, the trilemma might need a fourth category: **procedural ceilings**. Yet this could still be vulnerable to your core insight—that such procedures either tacitly encode consequentialist concerns or fail to justify a *non-consequentialist* ceiling.  
     **Recommendation**: Address contractualism explicitly. Argue it either (a) smuggles in agent-protective/consequentialist values, or (b) if purely procedural, lacks the normative force to override consequentialism.  

  ### 2. **Ambiguity: Demanded vs. Blameworthy vs. Admirable**  
     This is a **critical weakness** in the objection, but your trilemma still bites:  
     - **Strong objection** (morality *demands* only X): Your trilemma holds—any ceiling requires grounding, and the three options apply.  
     - **Weaker objection** (blameworthiness ceases beyond X): This is more plausible (e.g., "ought implies can," psychological limits), but:  
       - *If* blameworthiness is indexed to typical human motivation, the ceiling is **consequentialist** (maximizing compliance by accounting for frailty).  
       - *If* grounded in non-consequentialist duties (e.g., self-respect limits blame), it becomes **agent-protective**—and thus a revision, not a refutation.  
     - **Admirability** is irrelevant: Objectors claim consequentialism demands *too much*, not that it over-praises.  
     **Verdict**: Your trilemma defeats the strong objection. For weaker blame-based versions, it shows they either concede revision or covert consequentialism. This still advances your thesis—the objection doesn’t *refute* consequentialism.  

  ### 3. **Agent-Protective Route: Amendment or Abandonment?**  
     You are **correct dialectically** but risk overclaiming:  
     - **Amendment**: Scheffler’s hybrid retains consequentialism’s *core* (e.g., outcomes are the *source* of value; the prerogative is a *deviation* justified by agent-relative interests). It doesn’t posit deontic constraints or non-teleological goods.  
     - **Abandonment?**: A critic might argue the hybrid "abandons" consequentialism if maximization is no longer *necessary*. Yet your point stands: The objection *began* by claiming consequentialism is *unacceptable* but *ended* proposing a view where maximizing is often (but not always) required. This is a revision, not a wholesale rejection.  
     - **Key nuance**: The line hinges on whether the prerogative is **external** to the theory’s value framework (amendment) or **replaces** it (rival). Scheffler-type views are amendments; Nagel’s agent-relative reasons might be rivals.  
     **Referee risk**: Frame it as "consequentialism-adjacent" or "teleological revision." Avoid claiming it’s "still consequentialism"—this could distract referees.  

  ### 4. **Accuracy & Fairness**  
     - **Fair-share views**: Your indivisibility critique is **valid but partial**. Real-world dilemmas (e.g., climate change) often *are* divisible. However, your point holds for threshold cases (e.g., saving a drowning child), which are central to the objection. Murphy’s principle *is* compliance-relative—you characterize this fairly.  
     - **Prerogative as revision**: This doesn’t *beg the question*—it’s a dialectical observation. But referees may resist if they see hybrids as *alternatives*. **Preempt this**: Note that even hybrids concede the *pro tanto* force of maximizing (e.g., I *should* give more unless my interests are sufficiently weighty).  

  ### 5. **Overall Assessment & Strategic Value**  
     - **Soundness**: The argument is **largely sound** and original. It won’t convince committed deontologists but forces them into uncomfortable dialectical positions.  
     - **Adds value? Absolutely**. Even if demandingness objections aim to make consequentialism "uncomfortable," your trilemma shows:  
       - They cannot do so *without* either conceding key ground (revision/teleology) or relying on implausible premises (indivisibility blindness).  
       - They often **misdiagnose** their own success: What looks like a refutation is usually a call for refinement.  
     - **Chapter value**: This section **earns its place** by:  
       - Exposing the objection’s dialectical instability.  
       - Showing that all roads either lead back to consequentialism or soften it in ways compatible with its core.  
       - Strengthening your defense: If even the "killer objection" requires covert consequentialist premises, consequentialism is more resilient than critics admit.  

  ---

  **Final Suggestions**:  
  - **Preempt "straw man" charges**: Acknowledge that some objectors only target *maximizing act-consequentialism*. Your argument still applies—any non-maximizing ceiling needs justification.  
  - **Clarify the stakes**: Emphasize that your goal isn’t to prove consequentialism *true* but to show demandingness objections fail to prove it *unacceptable*.  
  - **Tone**: Avoid "consequentialism wins" rhetoric. Frame it as: "The objection, when scrutinized, reveals deep tensions in *non*-consequentialist approaches."  

  This is a compelling, publishable piece of argumentation. It rigorously defends a nuanced position and engages charitably with opponents. With minor clarifications (especially on contractualism and blame), it will be a chapter highlight.
