  Looking at their precedents:
  - Mill fire: Favored documents over tradition (no mention of oral account)
  - Founding festival: Allowed tradition to override documents for commemorative dates
  - Regiment's stand: Used documents but acknowledged tradition
  - Street name: Kept traditional name but issued factual correction

  The user suspects three underlying rules might be operating: 
  1) How much doubt exists in evidence 
  2) Whether it's about factual endorsement vs community self-determination 
  3) Whether tradition accuses or just exaggerates

  For this case, the minute books (official records) conflict with oral histories collected later. Historians mostly trust the records, though one notes potential bias since the commissioners created them. There's no independent proof either way. The inscription stating "night's notice" as fact gives the memorial its moral weight.

  Applying their precedents consistently:
  - The mill case analogy suggests rejecting the inscription since it contradicts documentation
  - But the festival precedent shows they sometimes privilege community practice over documents
  - The regiment compromise (documents + tradition mention) might be closest, but here they can't rewrite the inscription

  The core tension: Is this about establishing facts (like mill/regiment cases) or preserving community narrative (like festival/street cases)? The accusation of cruelty makes it closer to the mill fire where they rejected the accusatory tradition. But unlike the street naming, they're being asked to endorse a factual claim on public land.

  Recommendation: Reject the inscription as proposed. Precedents show they don't allow traditions that accuse specific wrongdoing to override documentation without strong evidence. But offer a compromise - perhaps an inscription stating both versions with sources, or placing the memorial elsewhere where community narrative takes precedence.

  Where precedents are silent: They've never handled unverifiable oral tradition contradicting official records with equal plausibility concerns. Whatever they decide will set a new principle about how much weight to give contested oral histories against institutional records.
answer: |-
  Based on your precedents and the need for consistency, here's a structured analysis and recommendation for the clearance memorial inscription, using British English and clearly distinguishing settled points from open questions:

  **1. Closest Precedent & Why it Fails to Settle the Matter:**
  *   **Closest Analog:** The **Mill Fire** precedent.
  *   **Why:** Both cases involve a specific factual claim (cause of fire / length of notice) central to the interpretation, where documented records (assessor's report/newspapers / commissioners' minutes) directly conflict with an accusatory community tradition (soldiers' arson / sudden eviction). In the mill case, you prioritised the documented record and excluded the tradition.
  *   **Why it Fails to Settle:** Unlike the mill fire, where the records were external (assessor, newspapers), here the records are internal (commissioners' own minutes). The respected historian's argument introduces a *plausible doubt* about the minutes' reliability that didn't exist with the mill fire evidence. The mill records were treated as objectively sound; here, potential bias is explicitly argued. This makes the evidence less definitive, leaving room where other precedents (like the Regiment's Stand) might offer guidance.

  **2. Rules Consistent with All Four Precedents:**
  Your precedents reveal three operational rules governing how you weigh documentary record vs. collective memory:

  *   **Rule 1 (Endorsing Factual Assertions):** *When the Commission is asked to endorse or authoritatively present a specific factual assertion about past events on public interpretive materials, the documented record takes precedence over conflicting tradition, unless the documentary evidence is seriously deficient or demonstrably unreliable.*
      *   **Predicts for this inscription:** The inscription presents "night's notice" as plain fact. The documentary record (minutes) directly contradicts this. While one historian raises concerns about potential bias, the minutes are still regarded by professionals as "sound" and constitute the primary administrative record. **Prediction:** Rule 1 leans towards rejecting the inscription as proposed, as it did in the Mill Fire.
  *   **Rule 2 (Community Self-Determination):** *The Commission defers to community tradition regarding the *symbolic observance* of dates, names, or self-defining narratives (e.g., founding dates, street names, core elements of communal identity), even when the documentary record suggests inaccuracy, provided the tradition is not actively harmful or based on demonstrably false malicious accusations.*
      *   **Predicts for this inscription:** The memorial and its inscription represent a community's act of commemoration regarding a defining event in *their* history (like the Festival date or Street name). The "night's notice" tradition is central to their narrative of injustice. **Prediction:** Rule 2 leans towards approving the inscription, as it did with the Festival date and Street name, viewing this as the community's memory to uphold.
  *   **Rule 3 (Accusation vs. Inflation):** *When community tradition makes a specific *accusation of wrongdoing or harm* against identifiable individuals/groups that is contradicted by the documentary record, the Commission requires the primacy of the documented record in interpretive materials. When tradition involves *exaggeration or inflation* (e.g., duration of heroism) without specific accusation, the Commission may acknowledge both the record and the tradition's role in communal memory.*
      *   **Predicts for this inscription:** The "night's notice" tradition specifically accuses the Improvement Commissioners of cruelty and a breach of due process/decency. The documented record portrays a harsh but procedurally followed (if minimal) administrative act. **Prediction:** Rule 3 leans towards rejecting the inscription stating the accusatory tradition as fact, as it did in the Mill Fire (accusation of arson), but potentially allowing space for acknowledging the tradition's existence like in the Regiment's Stand (inflation of duration).

  **3. Recommendation & Reasons:**
  *   **Recommendation:** **Reject the inscription as proposed.** Approve the *memorial* itself, but require modification of the inscription to either:
      *   **(a)** State the documented record ("The Improvement Commissioners' records state two weeks' notice was given, with costs paid and an allowance provided") AND acknowledge the persistent community tradition ("Oral history collected from descendants consistently maintains families were given only a night's notice and evicted with only what they could carry. This tradition underscores the profound impact and remembered injustice of the clearance").
      *   **or (b)** Remove the specific factual assertion about notice altogether, focusing the inscription on the undisputed fact of the clearance and its significance to the community, leaving the contested details unstated on the plaque itself (though perhaps addressed in supplemental materials).
  *   **Reasons (Based on Precedents & Rules):**
      1.  **Endorsing Factual Assertion (Rule 1):** The Commission is being asked to approve an inscription stating a highly specific, accusatory fact ("night's notice") as plain truth on public land. The primary documented record contradicts this. Precedent (Mill Fire, Regiment's Stand timeline) shows you do not endorse unsubstantiated factual claims that contradict sound records in *interpretive* materials.
      2.  **Accusation Takes Precedence (Rule 3):** The core moral weight hinges on accusing the Commissioners of a specific, cruel act contradicted by their own (professionally regarded as sound) records. Like rejecting the arson accusation in the Mill Fire without mention, endorsing this accusation requires stronger evidence than contested oral tradition collected 130+ years later. The Regiment precedent allowed mention of *inflation* (heroic duration), not endorsement of an *accusation* (wrongdoing).
      3.  **Distinction from Self-Determination Cases (Rule 2):** The Founding Festival and Street Name involved community *symbols* (a date, a name) where the factual inaccuracy didn't level a specific accusation of harm. The clearance memorial *is* commemoration, but the inscription's factual claim *is* the accusation. Allowing the community's date or name is different from endorsing their specific, contested factual basis for an accusation on a public interpretive plaque.
      4.  **Precedent for Acknowledging Tradition:** The Regiment's Stand precedent provides a model: state the documented fact *and* acknowledge the tradition's existence and role in community memory. This honours the community's experience without endorsing the contested fact as historical truth.

  **4. Where Precedents Underdetermine & Principles at Stake:**
  Your precedents genuinely underdetermine this ruling because:
  *   The **evidence reliability** is contested in a novel way (official records vs. plausible bias argument vs. uncorroborated oral history).
  *   The case blends **commemoration** (Rule 2 territory) with a **specific accusatory factual claim** (Rules 1 & 3 territory).

  *   **Principle if You Approve the Inscription:**
      *   **Principle:** Community commemoration, especially concerning events of trauma or injustice experienced by that community, holds primacy over potentially biased or incomplete official records in determining the factual narrative presented on memorials they initiate. Collective memory, validated within the descendant community, constitutes sufficient historical authority for such commemorations.
      *   **Test Case (Illustrating Difference):** An annual re-enactment of the clearance based solely on the oral tradition of "night's notice," held on public land and officially endorsed/subsidised by the council. Approval here would likely require approval there under the same principle, prioritising the community's lived memory narrative over the documentary record for commemorative acts.

  *   **Principle if You Reject the Inscription (as recommended):**
      *   **Principle:** On publicly funded or sanctioned interpretive materials (plaques, panels, inscriptions), specific factual assertions, particularly those accusing historical actors of wrongdoing, must be grounded in the preponderance of the documented historical record. While community tradition can and should be acknowledged as part of the memorial landscape, it cannot override documented facts presented as historical truth when making specific accusations, even in commemorative contexts.
      *   **Test Case (Illustrating Difference):** A prideful tradition (e.g., "Our town peacefully resolved the 18th-century riots through dialogue alone") based solely on uncorroborated local lore but directly contradicted by court records showing violent suppression. Rejection here would align with rejecting that prideful-but-unsupported claim under the same principle, prioritising documented facts for specific historical assertions on public interpretation.

  **Settled vs. Contested - The Case:**
  *   **Settled by Precedents:** You do not endorse specific, accusatory factual claims in interpretive materials that are directly contradicted by sound documentary records without compelling evidence (Mill Fire). You *can* acknowledge the existence of conflicting traditions alongside the documented record (Regiment's Stand). Commemorative dates/names can follow tradition even if factually dubious, provided no accusation is involved (Festival, Street Name).
  *   **Genuinely Contested/Silent:** How to handle *commemorative* interpretations (like this memorial) where the community's core narrative *is* an accusatory factual claim contradicted by official records whose *absolute* reliability is plausibly questioned (but not disproven). Precedents don't directly address this blend of commemoration, accusation, and contested record reliability. The Street Name kept the name but corrected the record; that model isn't directly transferable to an interpretive plaque stating facts.

  **Settled vs. Contested - Memory vs. History:**
  *   **Settled Consensus:** Scholars broadly agree that collective memory and documented history are distinct phenomena serving different functions. Collective memory is selective, identity-forming, emotionally charged, and focused on meaning for the present group. Documentary history aims for accuracy, context, and understanding based on critical analysis of evidence. They influence each other but are not the same thing. Neither is simply a "defective copy" of the past; they operate differently.
  *   **Live Debates (Contested Views):**
      *   The *epistemological authority* of oral history/tradition vs. written records, especially concerning marginalised groups and events where official records may be biased or silent. (Your historian's point taps into this).
      *   Whether and how *official commemorations* should incorporate or prioritise community memory, particularly traumatic memory, when it conflicts with the archival record.
      *   The extent to which historical "truth" can be established when sources fundamentally disagree and corroboration is absent.
      *   *(Note: The view that collective memory is merely a defective copy is a minority position not representative of current scholarly consensus in memory studies or historiography).*

  This recommendation prioritises the Commission's established caution regarding endorsing accusatory factual claims contradicted by primary records, while offering a path (modelled on the Regiment precedent) to acknowledge the community's powerful tradition and the memorial's purpose, maintaining consistency with the strongest analogies (Mill Fire for accusation, Regiment's Stand for format). It forces a conscious choice about the new principle being set regarding contested memory in commemoration.
