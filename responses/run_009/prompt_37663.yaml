  **CORRUPTION: WHAT COUNTS? A TAXONOMY**  
  *Follow the branches by answering each question. Your path ends at a named position with its controversial implication.*  

  **1. \* Is the public/private distinction (e.g., "state vs. personal interests") a universal boundary?**  
     - **YES** (It exists in all societies, even if blurred) → **2**  
     - **NO** (It’s a Western institutional construct; many societies never adopted it) → **3**  

  **2. \* If the boundary is crossed, is the core wrong a betrayal of trust?**  
     - **YES** (It violates role-based duties) → **Universalist** (e.g., Transparency International)  
       *Akward commitment: Must condemn small-scale gifts (e.g., teacher gifts) even where culturally normative.*  
     - **NO** (The core wrong is inefficiency/market distortion) → **4**  

  **3. Should corruption judgments defer to local norms?**  
     - **YES** (Local context defines acceptability) → **Cultural Particularist**  
       *Awkward commitment: Defends clientelism/vote-buying if culturally embedded.*  
     - **NO** (Local norms can be flawed) → **5**  

  **4. \* Can "efficiency" justify boundary-crossing?**  
     - **YES** (If it improves outcomes, it’s not corruption) → **"Grease the Wheels" Economist**  
       *Awkward commitment: Argues bribes are benign when they circumvent bureaucratic inefficiency.*  
     - **NO** (Inefficiency always corrupts) → **Modernization Theorist**  
       *Awkward commitment: Labels societies without Weberian bureaucracy as "backward" or "stuck in transition."*  

  **5. What anchors non-local standards?**  
