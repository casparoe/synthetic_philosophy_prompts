  Okay, let me unpack this complex question about advance directives and self-binding in psychiatry. The user is clearly well-versed in philosophy and medical ethics, given how they structured the query with specific theoretical frameworks. 

  First, I need to map the asymmetry they described: refusal directives are binding even when the current patient seems content, while request directives get overridden when the current patient protests. And in psychiatry, self-binding arrangements face similar reluctance. 

  Hmm... the user wants me to analyze which theory of the "earlier self's" authority explains this pattern: sovereignty (choice-based), continuity (psychological connections), or interests (epistemic advantage). They also want me to address whether this is just about liability or if there's deeper philosophy at play.

  Looking at refusal directives first - these are treated as binding even when the current demented patient seems happy. That doesn't fit the continuity view because the psychological connection is broken. The interests view could explain it if we see the earlier self as better judge, but why wouldn't that apply equally to requests? Sovereignty seems closest here - we respect the refusal as an exercise of autonomy.

  But for request directives that get overridden... sovereignty would require honoring them, but we don't. Continuity or interests views might justify overriding if we think the current self's preferences matter more. This creates tension - refusal respects sovereignty while request doesn't. 

  The psychiatric self-binding issue shows similar patterns. Clinicians hesitate to enforce past instructions when present patient protests, suggesting they prioritize current wishes over past sovereignty. 

  The colleague's liability argument has merit - refusing treatment avoids lawsuits while forcing treatment risks them. But that can't explain everything. Why would refusal directives be legally binding while requests aren't? There's deeper normative structure here.

  For my positive position... I'm leaning toward sovereignty as most defensible. If we take autonomy seriously, past competent choices should bind regardless of current preferences. This would mean overhauling practice: honoring treatment requests in dementia and enforcing psychiatric self-binding directives strictly. 

  But I should acknowledge challenges - what about cases where the current self seems so different? Still, the sovereignty view holds. The deflationary reading isn't sufficient; while practical factors matter, the asymmetry reveals underlying philosophical commitments about identity and authority.
answer: |-
  The asymmetrical treatment of advance directives and self-binding arrangements reveals a deep tension in how we conceptualize personal identity, autonomy, and moral authority over time. I'll analyze the presupposed theory, address your colleague's deflationary claim, and argue for a specific normative foundation.

  ### 1. **What the Practice Presupposes: A Hybrid, Inconsistent Theory**
     - **Refusal Directives** align with **sovereignty** (choice-based authority): 
       - A competent prior refusal binds even when the current demented patient appears content. This treats the earlier self as having decisive authority over the later self, prioritizing past autonomy over present experience. The law enforces this even when surrogates or clinicians disagree (e.g., *Cruzan v. Director, MDH*).
     - **Request Directives** align with **continuity + interests**: 
       - When a prior request for treatment (e.g., "continue antibiotics in dementia") is overridden due to current protests or perceived suffering, the practice assumes the *present* self's expressed wishes or experiential interests outweigh the prior self's instructions. This requires psychological discontinuity (loss of values/projects) *and* a judgment that the prior self was *not* a better epistemic judge of future interests in this context.
     - **Psychiatric Self-Binding** further exposes this:
       - Clinicians honor self-binding only partially (e.g., medicating without hospitalization) or set it aside upon protest. This presupposes **fluctuating competence** rather than permanent loss: if the present self is deemed temporarily incompetent during mania/psychosis, her protests are invalid, but if she's seen as "competent enough" to refuse *in that moment*, sovereignty is denied to the past self.

  **Conclusion**: The practice presupposes **no consistent theory**. It implicitly treats the earlier self as sovereign for refusals (protecting liberty *from* intrusion) but denies sovereignty for requests (denying liberty *to* demand intrusion). This asymmetry is underdetermined by any single theory and reveals a **status quo bias favoring non-intervention**: Withdrawing treatment respects current apparent wishes (continuity/interests) *and* honors past autonomy (sovereignty), while continuing treatment against current protests violates both present interests *and* clinical instincts.

  ### 2. **Deflationary Reading: Necessary but Insufficient**
  Your colleague is partly right: Liability avoidance (fears of battery claims for forced treatment), family pressure (to "end suffering"), and optics (withdrawing care feels passive, while forcing treatment feels violent) drive the asymmetry. However, these factors alone cannot explain:
     - Why refusal directives are *legally binding* while requests are merely advisory.  
     - Why courts consistently uphold refusal directives despite family objections or clinical discomfort.  
     - Why psychiatry permits self-binding *in theory* but undermines it in practice—a tension requiring normative justification.  
  The law’s boilerplate reflects *philosophical choices*: e.g., defining "competence" for directives, privileging negative liberties, and valuing present experiential welfare over past preferences. The asymmetry *needs* a normative explanation because pragmatic concerns alone don’t resolve conflicts between competing values (autonomy vs. beneficence).

  ### 3. **Normative Position: The Practice *Ought* to Rest on Sovereignty**
  I argue for a **strict sovereignty view**: The competent earlier self has authority because autonomy requires respecting agents' extended commitments across time, regardless of psychological discontinuity or fluctuating competence.  

  **Why sovereignty?**  
  - **Moral Agency Demands Fidelity**: If we take advance directives seriously as exercises of autonomy, we must uphold them symmetrically. Dismissing requests because the demented self "isn’t the same person" logically undermines refusal directives too.  
  - **Epistemic Advantage is Inadequate**: The "interests view" fails—competent people can make misguided future-treatment choices (e.g., requesting painful futile care), yet we still respect refusals. Consistency requires honoring requests.  
  - **Continuity is Arbitrary**: Valuing psychological connectedness risks paternalism. A dementia patient who forgets her lifelong atheism might "contentedly" accept a priest—but we’d still respect her prior refusal of religious rites.  

  ### 4. **Concrete Changes Required**
  Rebuilding practice on sovereignty would necessitate:  
  | **Current Practice**               | **Change Required**                                                                 |
  |------------------------------------|-------------------------------------------------------------------------------------|
  | **Treatment Requests** (e.g., antibiotics in dementia) | Give binding weight equal to refusals. *Requires* clinicians to provide treatment even if the current patient resists, unless the directive specifies otherwise. |
  | **Psychiatric Self-Binding**       | Full enforcement during specified crisis states. Clinicians *must* medicate/hospitalize over present objections, barring new evidence of revoked competence. |
  | **Competence Threshold**           | Reject "fluctuating competence" justifications. If the directive was competent, it binds until formally revoked *during a competent state*. |
  | **Legal/Institutional Reform**     | Amend laws (e.g., state advance directive statutes) to mandate parity for requests. Shield clinicians from liability when following valid directives. |

  **Objection Handling**:  
  - *But the current self suffers!* → Sovereignty accepts this: autonomy includes the right to make "unwise" choices binding future selves (e.g., refusing painkillers due to addiction fears).  
  - *Psychosis isn’t dementia!* → True, but if a self-binding directive was made competently during a stable phase (e.g., specifying "hospitalize me when I claim the FBI controls my thoughts"), sovereignty demands enforcement during psychosis.  

  **Conclusion**: The asymmetry reveals an unresolved conflict between our commitment to autonomy and our instinct to relieve suffering. Pragmatic factors exploit this tension, but only sovereignty offers a coherent, respectful approach to personhood over time. Implementing it would require courage to prioritize past autonomy over present comfort—but anything less undermines the very concept of living by one’s values.
