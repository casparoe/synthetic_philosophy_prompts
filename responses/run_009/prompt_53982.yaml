  The user's challenge is valid on an intuitive level. People want possibilities to be about *them*. But Lewis's approach is a revisionary account. It's not that the intuition is wrong, but that it's metaphysically problematic. Counterpart theory offers a coherent alternative, even if it feels less personal.

