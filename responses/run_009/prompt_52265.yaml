  For a middle ground, the lede should acknowledge the complexity upfront. Present the traditional view but note its nuances. Highlight continuity with medieval work and the messy reality of figures like Newton. This satisfies the historian's concerns without ditching the narrative. 

  Concretely, the lede could start with Copernicus as a turning point but mention earlier foundations and ongoing debates. Emphasize that change was gradual and contested. This approach informs readers while maintaining clarity. The user needs to file soon, so brevity is key—under 350 words. 

