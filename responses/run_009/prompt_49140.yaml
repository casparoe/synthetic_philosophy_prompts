answer: |-
  ### Bottom Line
  The most critical requirement is **defining a counterfactual baseline**, and while all desiderata are theoretically compatible, **observability and a meaningful counterfactual baseline are jointly unsatisfiable in practice** due to unobservable alternative timelines.

  ---

  ### Requirements for an Adequate Account of Alignment Tax  
  1. **Counterfactual Baseline** (Non-negotiable)  
     - *Must specify:* Tax relative to what? (e.g., lab’s profit-optimal unaligned system, industry SOTA capabilities, or a hypothetical equally capable aligned system).  
     - *Why:* Without this, "tax" is undefined. A lab’s baseline (e.g., "what we would build if unconstrained") differs from a societal baseline (e.g., "aligned system with identical capabilities"), altering the tax calculation.  

  2. **Zero/Negative Tax Possible** (Non-negotiable)  
     - *Must allow cases* where alignment improves capabilities (e.g., honesty reduces hallucinations) or has negligible cost.  
     - *Why:* If "tax" implies strictly positive costs, it becomes a circular/tautological claim. Reality might reward alignment (e.g., RLHF boosting product quality).  

  3. **Decomposability** (Preference)  
     - *Should break tax into components:* Compute, talent, time delays, capability trade-offs, opportunity costs.  
     - *Why:* These costs aren't fungible (e.g., losing 0.1% on benchmarks ≠ 3 months of delay). Scalar summaries often oversimplify.  

  4. **Observability** (Non-negotiable)  
     - *Must be recoverable from evidence* (e.g., cost sheets, benchmark regressions, deployment timelines).  
     - *Why:* Unfalsifiable claims ("tax would be huge in hypothetical world X") are non-scientific.  

  5. **Scoping to Stakeholder** (Non-negotiable)  
     - *Must specify who bears the tax* (e.g., frontier lab vs. startup, lab vs. society).  
     - *Why:* A tax that’s trivial for OpenAI ($0.01 per token) may sink a smaller competitor. Asymmetries drive racing dynamics.  

  6. **Handling Alignment-Capability Synergy** (Non-negotiable)  
     - *Must accommodate* alignment methods that *enhance* capabilities (e.g., better scaffolding → better code generation).  
     - *Why:* Conflating "alignment" with "capability sacrifice" ignores empirical cases where they align.  

  ---

  ### Why Observability and Counterfactuals Conflict  
  - **Core Tension:** You can observe actual costs (*observability*) but not the cost of paths not taken (*counterfactual baseline*).  
    - *Example:* If Lab A spends $1M on evals, is the "tax" the $1M (observable) or the difference vs. a hypothetical Lab A that ignored safety and shipped faster (unobservable)?  
  - **Result:** Any "tax" metric must either:  
    (a) Restrict the baseline to observable alternatives (e.g., "cost vs. same model without RLHF"), losing real-world relevance, or  
    (b) Invoke unverifiable assumptions about unrealized scenarios.  

  ---

  ### Evaluation of Existing Framings  
  1. **Naive "Overhead" Framing**  
     - *"Alignment tax = extra compute/training cost"*  
     - **Fails:** Ignores capability trade-offs, time delays, talent allocation, and stakeholder scope. Observes direct costs but misses counterfactuals (e.g., what capabilities were *not* built?).  

  2. **"Capability Tax on Benchmarks"**  
     - *"Tax = performance drop on ML benchmarks from alignment"*  
     - **Fails:** Assumes benchmarks reflect real-world capability (often false; e.g., coding benchmarks ≠ deployment stability). Ignores non-benchmark costs (e.g., delayed product launch). Cannot handle zero/negative tax cases.  

  3. **Revealed-Preference Framing**  
     - *"Tax = minimum incentive needed for labs to forgo alignment"*  
     - **Best for observability:** Infers tax from choices (e.g., "Lab X skipped safety evals to ship 2 weeks early").  
     - **Fails:** Assumes labs are rational profit-maximizers with full knowledge. Misses societal costs (e.g., externalities) and cannot measure *avoided* risks.  

  ---

  ### Conclusion  
  **Actionable Path:** Define alignment tax as:  
  > *"The difference in net value (profit, capability, risk) between an aligned system and a counterfactual unaligned system, from a specific stakeholder’s perspective, accounting for all costs."*  
  Then:  
  - For **policymakers**, use societal baselines (e.g., "aligned vs. profit-optimal unaligned") and accept unobservable estimates.  
  - For **empirical debates**, use revealed-preference or overhead metrics but admit their incompleteness.  
  - Always **decompose costs** (compute, time, capability loss) and **specify the stakeholder**.  

  The tension between observability and counterfactuals is unavoidable—explicitly flag it to prevent talking past the issue.
