  Okay, let me unpack this user's request. They're a deep rationalist community insider, fluent in concepts like Moloch and coordination problems, but medieval philosophy feels alien to them. Specifically, they want Aquinas on tyrannicide translated into their conceptual framework, with a brutally honest residue analysis.

  Hmm, the core challenge here is bridging two worlds: Aquinas's teleological worldview versus the user's emergentist/individualist toolkit. They've already done impressive homework - correctly identifying Aquinas's two-pronged argument (practical consequences and conceptual distinction of sedition). Their self-diagnosed gap about telos seems spot-on.

  First, the translation part: Prong 1 maps cleanly to rationalist concepts. The warning against unilateral assassination screams "unilateralist's curse" - when you can't coordinate successor selection, you risk worse outcomes. And "standing" translates perfectly to coordination theory - only entities with legitimate authority (original selectors or higher hierarchies) can solve the coordination problem properly.

  Prong 2 is trickier. The sedition argument hinges on Aquinas's teleology - that a polity has an intrinsic common good distinct from ruler's private interest. Best I can do in rationalist terms is frame it as "tyrants break the Schelling point of governance", but that's smuggling in telos through the backdoor. The self-defense analogy works superficially (system defense vs. aggression), but again implies the system has a "proper function".

  Now the residue report: Their suspicion is correct - the untranslatable core is Aquinas's metaphysical bedrock. When he says tyranny is "objectively disordered", he means it violates the polity's essence, not just preferences. Rationalist tools can describe incentive misalignments or failed coordination, but can't capture that normative "should". Like calling a broken clock "wrong" rather than "non-preferred".

  But here's the rub: is this residue actually doing work? In Aquinas's system, telos provides the moral compass to distinguish true common good from temporary preferences. Without it, rationalists might struggle with questions like "Why prefer democracy if a benevolent dictator maximizes utility?" Their framework excels at describing failures but lacks normative anchors.

  User seems genuinely open to having their toolkit criticized. No both-sidesing - telos solves real problems for Aquinas that rationalism waves away as "preferences". But conversely, telos requires buying into metaphysical baggage rationalists reject. The tradeoff is clear: lose moral objectivity but gain conceptual parsimony.

  Final note: User's typo "telos included" is charmingly self-aware. Keeping it - shows they're wrestling with the alien concept. This isn't just philosophy homework; they're clearly building their own model of governance ethics. Respect.
answer: |-
  Here's the translation into your conceptual framework, followed by a residue report identifying what gets lost:

  ### Aquinas on Tyrants: Rationalist Translation
  **Prong 1 (The Practical/Prudential Move):**
  *   **The Claim:** Private assassination of tyrants is a **high-variance unilateral intervention** with usually **negative expected value (EV)** under **regime uncertainty**. The assassin acts as a **failed Schelling coordinator** – they cannot control the successor selection process. This creates a power vacuum where the **Molochian dynamics** of power struggles (factional infighting, opportunistic rivals, increased paranoia in the new regime) almost inevitably select for a successor regime that is *worse* (more brutal, unstable, or paranoid) than the original tyrant.
  *   **The Solution:** Legitimate regime change requires **coordination under known authority**. Whoever possesses the original **"standing to act"** as the sovereign selector (e.g., the people who elevated the king, or a recognized higher authority like an emperor) is the only viable **coordination point**. This entity has the legitimacy and (potentially) the mechanism to select a successor regime, reducing variance and improving the EV of the intervention. It's a **multi-agent, coordinated action** rather than a **unilateralist's curse**.

  **Prong 2 (The Conceptual Move on Sedition):**
  *   **The Claim:** Tyranny represents a **fundamental misalignment** between the ruler's **utility function** and the **common good** (the aggregate flourishing/coordination potential of the populace). The tyrant optimizes for a **private utility function** (personal power, wealth, caprice).
  *   **Sedition Reclassified:** Actions undermining a *legitimate ruler* serving the common good are "sedition" – they break the **Schelling point of social coordination**, fracturing the unity necessary for collective action and stability, thus harming the common good.
  *   **Undermining a Tyrant:** Actions undermining a tyrant are **defensive coordination**. The tyrant themself is the *true agent of systemic fracture* (the original "seditious" actor against the *purpose* of the polity). Resistance isn't breaking the Schelling point; it's an attempt to *restore* the conditions necessary for a viable coordination point around the common good. It's akin to **system self-defense against a malfunctioning agent**, not initiating a quarrel.

  ---

  ### Residue Report: What Doesn't Translate Cleanly

  1.  **Prong 1 ("Unilateral assassination is high-variance / bad EV"):**
      *   **Translation Cleanliness:** **Very Clean.** This maps almost 1:1 to rationalist concepts. Aquinas's prudential argument *is* fundamentally about unpredictable consequences, Molochian dynamics in succession crises (factionalism leading to worse outcomes), the unilateralist's curse (an individual acting without coordination capacity), and the need for a legitimate agent with "standing" to act as a coordination point for regime transition. No significant residue. *You nailed it.*

  2.  **Prong 2 Core ("Tyranny vs. Legitimate Rule / Sedition Definition"):**
      *   **Translation Attempt:** We used "misalignment," "private vs. common utility function," "breaking/restoring the Schelling point," and "system self-defense."
      *   **Residue Smuggled In:** **Teleology is smuggled in via the concept of "common good" and "purpose of the polity."** Rationalism can talk about aggregate utility or stable coordination *as preferences*, but Aquinas asserts something stronger:
          *   **The Polity as an Entity with Telos:** For Aquinas, the political community isn't *just* an aggregate of individuals coordinating. It has a **real, objective telos** (purpose/goal/flourishing state) inherent to its nature as a *human community*. This telos *is* the "common good." It's not *defined by* aggregate preferences; it's the *standard against which* preferences and rulers are judged. A clock's telos is telling time; a broken clock fails *objectively* at *being a clock*, regardless of anyone's opinion. Similarly, tyranny fails *objectively* at achieving the polity's telos.
          *   **Sedition Defined Teleologically:** Sedition is sinful *because* it disrupts the unity *necessary for achieving the polity's telos*. It's not just breaking coordination; it's sabotaging the *purpose* the coordination exists to serve. Resistance to a tyrant isn't sedition *because the tyrant has already destroyed the unity oriented towards the telos*. The telos provides the **objective grounding** for labeling the tyrant's rule as "defective" and resistance as "restorative."

  3.  **The Foundational Residue ("Natural Law / Teleology"):**
      *   **The Gap:** **This is the core residue, and it's fundamental.** Your diagnosis is correct. The rationalist vocabulary, as described, lacks the conceptual tools to fully capture Aquinas's bedrock assumptions:
          *   **Objective Telos:** The claim that complex systems (like polities, or even clocks) have *intrinsic*, non-anthropocentric purposes derived from their nature. Rationalism typically explains system behavior via emergence from individual agents + incentives/environment, not intrinsic purpose.
          *   **Common Good as Telos, not Aggregate:** The "common good" isn't just summed individual utilities or a stable Nash equilibrium. It's the *flourishing state* of the community *as a whole*, considered as an entity with its own proper end, which also fulfills the individual telos of its members. It's a holistic property.
          *   **Defectiveness vs. Unpopularity:** A tyranny is "defective" *like a broken clock* – it fails *in itself* to be what it *ought* to be (a ruler serving the common good). Rationalism might say it's "dysfunctional," "unstable," or "Pareto inefficient," but these are descriptive or preference-based judgments, not assertions about an *objective normative standard* inherent in reality. Aquinas provides a **non-arbitrary normative anchor** based on ontology (what things *are* and thus *are for*).

  ---

  ### The Straight Answer: Gap vs. Reducibility

  *   **Is the residue a gap in your vocabulary?** **Yes, fundamentally.** Your toolkit (individual agency + emergent aggregates + coordination/incentive structures) is superb at *describing* dynamics, predicting outcomes, and identifying misalignments *relative to stated preferences or stability*. It lacks the metaphysical framework for **objective normative teleology** – the idea that purposes are built into the fabric of reality and provide binding standards of "good function" independent of human desires or evolutionary pressures.
  *   **Does Aquinas's argument reduce to claims you can make without telos?** **Only partially and less robustly.**
      *   **Prong 1:** Reduces cleanly (as shown).
      *   **Prong 2:** You *can* describe tyranny as severe misalignment causing instability and suffering. You *can* frame resistance as system defense against a harmful agent. You *can* say the tyrant "broke the social contract first."
      *   **BUT...** Without telos:
          *   The claim that tyranny is *objectively disordered* (not just subjectively bad or inefficient) vanishes. Is maximizing aggregate utility *really* better than the tyrant's private gain? Why? What if the "common good" aggregate requires sacrificing minorities (utility monster problem)? Telos provides a grounding that avoids pure preference aggregation or consequentialism.
          *   The distinction between "sedition" and "just resistance" loses its *objective grounding*. It becomes contingent on the stability of the existing Schelling point or the preferences of the majority. Aquinas grounds it in the *objective purpose* of political unity.
          *   The "common good" becomes harder to define robustly against competing individual or factional goods without appealing to an aggregate or emergent stability. Aquinas defines it by the telos of the community itself.
  *   **What are you missing? Why might telos matter?** Telos provides:
      *   **A Non-Arbitrary Normative Standard:** It answers "Why *should* rulers serve the common good?" not just "What happens if they don't?" or "Do people prefer it?". It grounds political morality in reality, not just preference or power. For Aquinas, the common good isn't just *what we want*; it's *what we are for*.
      *   **A Basis for Intrinsic Value:** It asserts that the flourishing of the community *as such* has value beyond the sum of its parts. This counters pure individualism or utilitarianism that might sacrifice the community structure for individual gain.
      *   **A Shield against Relativism/Might-Makes-Right:** If the standard of good rule is objective (telos), then a tyrant's power doesn't make their rule legitimate. Power is judged *by* the telos, not the other way around.

  **Conclusion:** Aquinas's prudential argument (Prong 1) translates flawlessly into rationalist terms. The core of his conceptual argument (Prong 2) *can be described* using misalignment, coordination failure, and system defense, **but this description smuggles in or loses the essential teleological foundation.** The irreducible residue is the **objective teleology of natural law** – the claim that political communities have an intrinsic purpose ("common good") that provides an objective standard for judging rulers ("defective" tyranny) and actions (resistance isn't sedition *because* it serves the telos). Your vocabulary lacks this metaphysical layer. Whether this layer is *necessary* or *true* is the real debate – Aquinas argues it provides an essential, non-arbitrary grounding for political morality that consequentialist or emergentist frameworks struggle to replicate. He wouldn't see it as baggage, but as the load-bearing foundation.
