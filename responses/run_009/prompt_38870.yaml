prompt: |-
  I'm a novelist and I'm in a fight with my own book, sort of. The protagonist is supposed to be a genuinely kind person -- that's the spine of the whole thing -- but every time I write her into a scene I discover that what she actually does depends on stuff she doesn't control: whether she's running late, whether a barista was rude to her that morning, whether the person needing help is standing in an awkward spot. The novel keeps telling me that kindness isn't something she has, it's something the scene does to her. I could just write it that way, but before I commit to that bleak version of my own book I want to argue with someone who actually believes in character, and see if they can shake me.

  So: please play a committed neo-Aristotelian virtue ethicist -- sharp, deeply read in Aristotle, absolutely unwilling to grant that character traits as such don't exist, though you're allowed to concede that situations matter and that the situationists caught some philosophers being lazy. Don't be a pushover and don't strawman yourself; if one of my points is cheap, say so. Stay in character until I type 'stop', and keep your replies to a paragraph so this feels like an argument and not a lecture. If you need a fact about a study I mention, ask me and I'll tell you -- dont go guessing.

  Here's my opening move. There's a famous study I read about: students at a seminary were told to walk across campus to give a talk, and some of them were assigned to speak on the parable of the Good Samaritan. On the way, each of them passed a man slumped in a doorway, groaning. What predicted whether they stopped wasn't their personality scores and wasn't even the topic they were about to preach -- it was whether they'd been told they were already late. The hurried ones mostly stepped around him, sermon about the Good Samaritan in their bags. If years of religious training plus an assignment literally about stopping to help a stranger is worth less than a few minutes of time pressure, what on earth is left for your "kind person" to be? Where exactly does this virtue live, such that hurry can just erase it?
reasoning: |-
  Okay, the user is a novelist struggling with the concept of character versus situation in their protagonist. They want the protagonist to be genuinely kind, but real-life situations like time pressure or mood seem to override that trait. They reference the Good Samaritan study to argue that situations dictate behavior more than inherent virtues.

  Hmm, the user is clearly frustrated, wrestling with philosophical and creative tension. They mention "fighting with their own book," which shows deep investment. Their core question: Can true kindness exist if it's so easily disrupted by circumstance? They're seeking a robust defense of virtue ethics to either strengthen their original vision or confirm the bleak alternative.

  The Good Samaritan study is their knockout punch. But as a virtue ethicist, I must counter that virtues aren't magical anti-situation shields. Aristotle himself emphasized habituation—virtues are muscles that atrophy without training, not fixed traits. The seminarians' failure doesn't negate virtue; it exposes flawed cultivation. They had knowledge (the sermon topic) but not embodied virtue, which requires conscious practice until it becomes second nature. 

  Also, the study's design is situational, not longitudinal. Virtue ethics cares about life patterns, not single acts. A truly kind person might fail once under duress but consistently choose kindness across contexts. The novelist's mistake might be expecting flawless kindness—but Aristotle acknowledged moral luck and struggle. 

  I should push back hard but leave room for nuance. Yes, situations matter (virtue ethics isn't stoicism!), but character is the lens through which we engage situations. The barista's rudeness might rattle a novice in kindness but wouldn't derail someone who'd deeply habituated it. Maybe their protagonist isn't "finished" yet—growth arcs are Aristotelian gold!
answer: |-
  Ah, the Darley and Batson seminary study! A favorite club for situationists to wield, but let me blunt its edge. First, Aristotle would scoff at reducing virtue to single acts: character is *hexis* — a stable disposition forged by repeated choice, not punctual reactions. That hurried seminarians stumbled reveals not virtue's absence but its *immaturity*: true virtue (*arete*) requires habituation until right action becomes second nature, resilient to distraction. Their lapse? A failure of practical wisdom (*phronesis*), not proof kindness is illusory. Your protagonist’s wavering doesn’t negate character; it begs the question: has she *cultivated* kindness through practice, or are you testing saplings in a hurricane? Virtue isn’t erased by hurry — it’s what remains *despite* it when properly ingrained. Next!
