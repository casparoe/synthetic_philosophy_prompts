  Publication safety: Classification gives a clear math result. Alternatives can produce comparative analyses. Repair risks being incremental. Practical reach might not yield concrete outputs.

  Ranking: Alternatives first, then classification, repair, practical last. Why? Alternatives directly address the problem with existing tools, have philosophical depth, and are tractable. Classification is a safe math project. Repair is important but tricky. Practical is too risky.

  What if classification exists? Need to check literature. If it does, alternatives become even better. If a real-world case is found, practical relevance increases, but still hard to prove in three years. 

