prompt: |-
  I run a small regional film festival — one week a year, one part-time staffer, and about 400 submissions. I can personally watch maybe 40 of them, and alot of my job is acting on scorecards filled out by a rotating pool of ~15 volunteer screeners, most of whom have watched a ton of movies and a few of whom genuinely have taste. I have to pick roughly 60 films for slots, and I have about six weeks every spring to do it. Getting it wrong isn't ruinous, but we've built real trust with our audience and a couple bad years in a row would burn it.

  The thing I keep bumping into is what the philosophy people apparently call the problem of aesthetic testimony. From what I can tell the answer is surprisingly "not really, but it's complicated" — something about how an aesthetic judgment is supposed to be grounded in the properties of the object itself rather than borrowed from someone else's reaction, so there's an asymmetry between trusting a screener that a file has bad subtitles and trusting them that the film is "quietly devastating." Meanwhile I obviously cannot watch 400 films, so in practice my whole festival is built on secondhand aesthetic verdicts.

  Write me a procedure my staff and I can actually run on each submission. I want the steps in order, what counts as a good enough answer at each step, where the procedure stops with a pass, and where it throws up its hands and hands the decision to me because the question is one of values, not facts. It should be honest about which steps are really judgment calls wearing a lab coat. Then run it on three real-ish cases from last year:

  1. A slow, three-hour documentary that one screener called "transformative" and another turned off after twenty minutes. I programmed it anyway and stood in the back while half the audience walked out.
  2. A short I personally loved the one time I saw it, but all four screeners who rated it gave it middling scores — I'm the only person involved who liked it.
  3. A film where every screener agreed it was excellent, I have never seen a single frame of it, and the question is whether I can put a line in the printed program calling it a masterpiece.

  And tell me straight what the procedure can't do — in particular whether it can tell me who counts as a screener with taste in the first place, because I suspect that's what the whole thing quietly rests on.

  One distinction I half-understand and want built in explicitly: testimony about facts (the film contains strobing, it's 82 minutes, it's the director's third feature) seems fine to just believe, while testimony about merit is the suspicious part. If the procedure needs to lean on that line, draw it clearly, because I suspect some of our scorecard questions are on the wrong side of it.
reasoning: |-
  Okay, the user runs a small regional film festival with limited resources. They have about 400 submissions but can only watch 40 films themselves. They rely on 15 volunteer screeners with varying taste levels to help select 60 films for the festival. The core challenge is dealing with the "problem of aesthetic testimony" - how much to trust others' judgments about artistic merit versus factual aspects.

  The user wants a practical procedure that clearly distinguishes between factual information (which can be trusted) and aesthetic judgments (which are trickier). They also want to know how to identify which screeners have "taste" - something they suspect is fundamental but hard to quantify.

  Three specific cases need analysis:
  1. A polarizing 3-hour documentary where audience members walked out
  2. A short film only the user liked
  3. A universally praised film the user hasn't seen - can they call it a masterpiece?

  Key needs emerging:
  - A transparent selection system that doesn't pretend objectivity where none exists
  - Clear demarcation between verifiable facts and subjective opinions
  - Acknowledgment that taste assessment is circular but necessary
  - Practical constraints: only 6 weeks, limited personal viewing capacity

  The procedure should include:
  1) Standardized fact-gathering
  2) Initial volunteer screening with clear rubrics
  3) Mechanisms to flag films needing deeper review
  4) Explicit "value judgment" handoff points to the user
  5) Post-event analysis to improve future selections

  For the taste question - the solution acknowledges it's unavoidably circular but suggests tracking screener performance metrics over time, while admitting this only measures alignment with the festival's values, not some abstract "good taste."

  The three cases demonstrate how the procedure handles different scenarios - particularly showing when the user must make final calls based on their vision for the festival. The masterpiece label is rejected as fundamentally incompatible with secondhand judgment, preserving the festival's integrity.
answer: |-
  Here's a practical procedure built for your constraints, grounded in the fact/aesthetic testimony distinction, and honest about its limitations. It prioritizes efficiency while flagging where *your* judgment (as curator) is essential.

  **Core Principle:** **Trust testimony on *descriptive facts* (objective, verifiable). Treat testimony on *aesthetic merit* (subjective, experiential) as *data points for your own judgment*, not conclusions to be accepted wholesale.** The procedure stops and hands off to you whenever core aesthetic/value judgments are required.

  **The Film Selection Procedure**

  1.  **Initial Triage (Staff/Admin):**
      *   **Action:** Verify submission completeness (fee, screener link, synopsis, tech specs, run-time, country, premiere status, content warnings). Check for technical issues preventing viewing.
      *   **Good Enough:** Submission meets basic technical & administrative requirements. No show-stopping technical faults.
      *   **Stop/Pass:** Incomplete submissions or unwatchable files are rejected. *No aesthetic judgment here.*
      *   **Lab Coat?** Mostly objective. Judgment call only on borderline completeness or severity of tech issues.

  2.  **Factual Screening (Volunteer Screeners - Stage 1):**
      *   **Action:** Screeners watch the film (or a significant portion - e.g., first 20 mins + random 10 min segment). Answer **descriptive questions ONLY**:
          *   Accurate run-time? Technical quality (sound, image, subtitles)? Genre? Content warnings confirmed/missed? Basic plot synopsis accuracy? Notable formal elements *observed* (e.g., "black and white", "handheld camera", "non-linear structure", "contains graphic violence", "strobing effects")? *Avoid words like "good", "bad", "boring", "powerful".*
      *   **Good Enough:** Clear, concise, verifiable answers to the factual questions. Screener confirms they watched enough to answer reliably.
      *   **Stop/Pass:** Films with *objectively disqualifying issues* based on facts are rejected (e.g., wildly exceeds run-time limit, unwatchable subtitles/audio despite admin check, violates core festival content policy). *Screener aesthetic opinion is irrelevant here.*
      *   **Lab Coat?** Aiming for objectivity, but screener perception of "unwatchable" audio/visuals involves some subjectivity. Focus on *specific, observable problems*.

  3.  **Aesthetic/Engagement Assessment (Volunteer Screeners - Stage 2 - Films passing Stage 1):**
      *   **Action:** Screeners who watched at least a significant portion (e.g., 30-50%) for Stage 1, or new screeners assigned the film, answer **structured opinion questions**:
          *   **Engagement Level (Scale 1-5):** "How consistently engaged were you?" (1 = Frequently disengaged, 5 = Fully immersed).
          *   **Formal Execution (Scale 1-5):** "How successful was the film in achieving its apparent formal goals? (e.g., cinematography, editing, sound design, performance *specific to the film's style/intent*)".
          *   **Argument/Theme Clarity (Scale 1-5 - Docs/Narratives):** "How clear and compelling was the core argument/narrative/theme?"
          *   **Memorability (Yes/No/Maybe):** "Is this film likely to stay with you?"
          *   **Potential Audience Fit (Yes/No/Maybe):** "Based on your knowledge of *this festival's* audience, is this a potential fit?"
          *   **Brief Justification (Required):** 1-2 sentences *explaining* the scores above, citing *specific scenes/techniques/choices* observed. (e.g., "Engagement 3: Strong opening hook faded due to repetitive interviews; Execution 4: Beautiful landscape cinematography elevated the pacing issues").
          *   **Overall Recommendation (Pass/Maybe/Reject):** *Based on the scores and justifications above.*
      *   **Good Enough:** Completed scores with brief, *specific* justifications referencing the film itself. Avoids vague praise/critique ("amazing", "boring", "masterpiece").
      *   **Stop/Pass:** Films receiving unanimous "Reject" recommendations from Stage 2 screeners (e.g., 2+ screeners) are rejected. Films receiving strong "Pass" recommendations proceed to Stage 4. *Everything else proceeds to Stage 4.*
      *   **Lab Coat?** **HEAVY Judgment Calls.** The scores and justifications are inherently subjective data points. The key is forcing specificity to ground opinions in *observable properties* of the film.

  4.  **Aggregation & Flagging (Staff):**
      *   **Action:** Compile screener data (facts + Stage 2 scores/justifications/recommendations). Calculate average scores. **Flag films for Curator Review:**
          *   High variance in Engagement/Memorability scores (e.g., STD Dev > 1.2).
          *   High average scores (e.g., Engagement & Execution both >4.0).
          *   "Maybe" recommendations or split recommendations (Pass/Reject).
          *   Films triggering specific festival priorities (e.g., local filmmakers, underrepresented voices, specific themes).
          *   Films where screeners note significant factual errors in synopsis or technical issues missed earlier.
      *   **Good Enough:** Clear list of films proceeding automatically (strong consensus Pass/Reject), and a prioritized list flagged for your review with compiled data. Factual discrepancies resolved.
      *   **Stop/Pass:** Films with strong consensus "Pass" proceed to programming. Films with strong consensus "Reject" are rejected. *All flagged films move to Stage 5.*
      *   **Lab Coat?** Data aggregation is objective. Flagging rules involve judgment in setting thresholds and identifying festival priorities.

  5.  **Curator Review & Decision (YOU):**
      *   **Action:** YOU watch films (or significant portions) flagged in Stage 4. Focus on:
          *   Films with high variance (Do *you* see what caused the split? Which side aligns with *your* vision?).
          *   Films with high averages but you haven't seen (Is the *specific praise* convincing?).
          *   Films with split recommendations.
          *   Key priority films.
      *   **Decision Basis:** Use screener data as *context*, but your judgment on **aesthetic merit, coherence with festival vision/identity, audience expectations, and overall program balance** is paramount. You *must* experience these films yourself.
      *   **Good Enough:** A final decision (Pass/Reject) based on your direct engagement and curatorial judgment. Notes on *why* you agreed/disagreed with screeners.
      *   **Stop/Pass:** Final decision made. *This is where the buck stops on aesthetic judgment.*
      *   **Lab Coat?** **PURE Judgment Call.** This is the heart of curating, unavoidably subjective but informed by data and your direct experience.

  6.  **Program Construction (You & Staff):**
      *   **Action:** Slot the selected films into a coherent schedule, balancing run-times, genres, themes, energy levels, and potential audience draw. Write program notes *based on the facts gathered and your own viewing*.
      *   **Good Enough:** A viable, engaging schedule with accurate, compelling program descriptions. Respect content warnings.
      *   **Lab Coat?** Logistical skill mixed with curatorial judgment on flow and audience experience.

  **Applying the Procedure to Your Cases**

  1.  **The 3-Hour Documentary:**
      *   **Stage 1/2:** Passes factual checks. Stage 2 data shows **EXTREME VARIANCE**: Screener 1 (Engagement 5, Memorable Yes, Pass), Screener 2 (Engagement 1, Memorable No, Reject). Justifications: "Transformative depth, patient observation builds profound empathy" vs. "Pacing fatal, no narrative thrust, disengaged quickly."
      *   **Stage 4:** **Flagged immediately** for high variance (STD Dev off the charts!).
      *   **Stage 5:** **Requires YOUR viewing.** You watch significant portions/full film. You find the slowness purposeful and emotionally resonant, aligning with a strand of your festival's identity showcasing challenging cinema. *You* judge it worthy despite the risk. **Decision: Program.**
      *   **Procedure Outcome:** Correctly flagged the high-risk film requiring *your* aesthetic/value judgment. The audience walkout is the risk inherent in *your* decision, not a procedural failure.

  2.  **The Short You Loved, Screeners Middling:**
      *   **Stage 1/2:** Passes factual checks. Stage 2 data shows **Consensus Mediocrity**: All 4 screeners give Engagement/Execution scores around 2.5-3.5. Memorability: Maybe/No. Recommendations: Maybe/Reject. Justifications cite competent but unremarkable execution, familiar theme, didn't stand out.
      *   **Stage 4:** Likely **not flagged** (unless low scores are near your rejection threshold). Average scores suggest rejection.
      *   **Stage 5:** If not flagged via variance/priority, it would be rejected based on consensus. *However, your personal viewing triggers a **priority flag**.* You see something special they missed.
      *   **Stage 5 (Priority):** **You re-watch.** Your initial strong positive reaction holds. You analyze *why*: perhaps a subtle performance, unique visual metaphor, or tone perfectly hitting your sensibility. You override the screener consensus based on *your* direct aesthetic judgment and vision. **Decision: Program.**
      *   **Procedure Outcome:** Screeners identified it as unremarkable. The procedure relies on *you* identifying films you connect with deeply (a key curator role). Your direct experience overrides the screener data.

  3.  **The Universally Praised, Unseen Film:**
      *   **Stage 1/2:** Passes factual checks. Stage 2 data shows **Strong Consensus**: High average scores (e.g., Engagement 4.8, Execution 4.7). Memorable: Yes. Recommendations: Pass. Justifications: Specific praise (e.g., "astonishing lead performance," "visually stunning and innovative," "narrative perfectly structured and emotionally devastating").
      *   **Stage 4:** **Flagged** as high average score.
      *   **Stage 5:** **YOU MUST WATCH.** The screener data is *highly encouraging data*, but **you cannot ethically call it a "masterpiece" in the program without your own direct experience.** You watch it.
      *   **Decision:** If you agree it's exceptional, program it and write a strong note *based on your viewing* (e.g., "A stunning achievement," "Featuring a career-defining performance," "Visually audacious and deeply moving"). **You CANNOT call it a "masterpiece" based solely on testimony.**
      *   **Procedure Outcome:** Forces you to verify exceptional claims before attaching your festival's strongest endorsement. Protects integrity. You can program based on strong testimony, but ultimate qualitative endorsement requires your direct judgment.

  **What the Procedure CANNOT Do (Crucially):**

  1.  **Define "Taste" or Reliably Identify Screeners with "Taste":** This is the fundamental, unavoidable circularity. The procedure helps *manage* screener data but doesn't solve the core problem of aesthetic testimony.
      *   **How you handle it:** Track screener performance *over time*. Compare their scores/justifications on films *you* have seen and judged. Note screeners whose:
          *   Justifications consistently reference specific, observable film properties.
          *   Recommendations often align with your final curated selections (especially on borderline/variance cases).
          *   Recommendations spark useful debate or highlight aspects you value.
          *   Identify screeners whose high recommendations *you* consistently also rate highly, and whose rejections you tend to agree with. These are your "reliable signal" screeners for **your festival's specific taste profile**. Their high scores on unseen films become stronger data points. Conversely, screeners whose tastes consistently diverge strongly from yours provide valuable "contrarian" data (useful for spotting divisive films). **"Taste" here is operationalized as *alignment with the curator's vision and successful past selections*, not an absolute measure.**

  2.  **Eliminate Risk or Guarantee Audience Approval:** It systematizes information gathering and surfaces risks (variance!), but final aesthetic judgments on flagged films carry inherent risk. Walking audiences are part of the gamble of curation.

  3.  **Bestow Objective "Masterpiece" Status:** Aesthetic judgments, especially grand ones, require direct experience. Testimony can signal potential, but the label must come from you, based on your viewing.

  4.  **Fully Capture the Ineffable:** Some films' power is hard to articulate in scores or justifications. The procedure relies on screeners doing their best and on you catching these in review.

  **The Fact/Aesthetic Line (Clarified):**

  *   **Trust Testimony On (Facts - Descriptive Properties):**
      *   Technical Attributes: Run-time, aspect ratio, sound format, presence/quality of subtitles, visible technical flaws (e.g., "audio dropout at 15:32", "subtitles out of sync", "strobing sequence from 01:10-01:30").
      *   Formal Elements *Observed*: "Black and white", "handheld camera", "non-linear narrative", "animated documentary", "contains graphic nudity", "uses archival footage".
      *   Content: Basic plot points ("protagonist loses job"), subject matter ("doc about deep-sea welding"), key characters.
      *   Verification: Premiere status, country of origin, key crew, factual claims within a documentary (if easily verifiable by the screener).
  *   **Treat as Data Points (Aesthetic Merit - Evaluative Properties):**
      *   Quality Judgments: "Good"/"Bad" cinematography/acting/editing/story. "Boring"/"Engaging"/"Powerful"/"Devastating". "Masterpiece". "Excellent".
      *   Interpretive Impact: "Profound", "transformative", "shallow", "sentimental".
      *   **Why?** These require experiencing *how* the descriptive properties combine and resonate subjectively. A "slow pace" (fact) might be "meditative" (positive aesthetic) or "dull" (negative aesthetic) depending on the viewer and the film's intent. Testimony tells you *their* reaction, not an inherent property you can simply adopt.

  **Review Your Scorecard:** Any question asking for a rating of "quality," "impact," "effectiveness," or using purely evaluative adjectives ("beautiful," "weak," "compelling") falls on the "aesthetic merit" side. Questions asking "What happened?" or "What techniques were used?" or "Were there technical problems?" fall on the "fact" side. Questions like "Was the pacing effective?" sit right on the line – the answer is an aesthetic judgment, but the justification should point to *how* the pacing (fact) functioned.

  **In Essence:** This procedure leverages screeners for essential fact-finding and initial triage, uses their aesthetic opinions as valuable *but non-binding* data points designed to surface patterns and risks, and forces the critical aesthetic/value judgments onto *you*, the curator, based on your *own* viewing when it matters most. It embraces the asymmetry of aesthetic testimony rather than pretending it doesn't exist. Your identification of "screeners with taste" remains an ongoing, post-hoc evaluation based on alignment with your own judgments and the festival's track record.
