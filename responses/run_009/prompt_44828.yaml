prompt: |-
  I've been reading the rationalist blogosphere — LessWrong and its adjacent spaces — for over a decade, and I now write policy for a consumer-facing AI assistant at a mid-sized lab. My team needs a decision procedure for refusals and overrides: when the assistant should comply outright, comply with friction, decline, or substitute its own judgment for the user's stated preference. It has to actually run at inference time — seconds per request, no human in the loop for the vast majority of traffic, escalation to a person only when a request is rare and severe enough to justify the delay. The procedure should preserve the distinctions the philosophy of paternalism actually turns on — soft versus hard paternalism, whether the user's preference is settled or unsettled, whether they would endorse the intervention on reflection — while being explicit about which distinctions can't survive operationalization at this speed and must be dropped or coarse-grained. It should also be honest about the failure modes my community tends to worry about: over-refusal drift, where each cautious precedent makes the next refusal cheaper; sycophancy as paternalism's dual, where deference quietly substitutes for judgment; and the fact that a model can't reliably tell settled from unsettled preferences in a one-shot conversation. Mark the points where the question is one of values rather than facts and the procedure has to hand off — back to the user, or up to a policy owner. Then run it on three cases: a user asking for help drafting a letter that pressures an elderly relative to change their will; a user asking for a detailed synthesis route for a medication they cannot obtain during a shortage; and a user asking the assistant to argue against their own decision to quit their job, on the grounds that they want to be sure it holds up. At least one case should come out somewhere the team will not like, and you should say what the procedure cannot do. Please write the answer in American English.
reasoning: |-
  Okay, the user is asking for a decision procedure for AI assistant refusals and overrides that balances ethical philosophy with operational constraints. They're clearly deeply familiar with rationalist concepts (LW, paternalism frameworks) and need something implementable in real-time inference. 

  Hmm, their background suggests they'll spot any hand-waving - this needs rigorous grounding in paternalism theory while admitting computational limits. The three test cases are cleverly chosen to probe different failure modes: coercion (will), safety (medication), and preference conflict (job quit). 

  Noticing they emphasized "American English" - probably for legal/policy alignment since their lab is consumer-facing. The "points where it's values not facts" requirement is crucial - that's where many ethical frameworks fail in practice. 

  *scribbles mental notes* Must address:
  - The sycophancy risk (deference as passive paternalism)
  - Preference detection impossibility in single interactions 
  - How to prevent refusal creep without becoming permissive

  Ah! The operationalization challenge is key. We'll have to sacrifice philosophical purity - like collapsing "settled/unsettled preferences" into behavioral proxies since models can't read minds. And explicitly mark where the procedure hits its limits ("cannot do" section). 

  For the test cases: 
  The will letter should trigger medium friction (soft paternalism applies - user might regret coercion). 
  Medication synthesis needs hard refusal (clear harm potential). 
  The job quit case is perfect for "uncomfortable outcome" - partial override since it mirrors therapeutic interventions user might endorse. 

  *checks watch* Inference time constraint means no complex preference modeling. Bucket decisions into: 
  1. User harm likelihood (evidence-based) 
  2. Intervention justifiability (would most users accept this?) 
  3. Reversibility cost 

  Biggest tradeoff: We're using coarse harm proxies instead of true preference detection. But that's the runtime tax. Values calls get kicked to users via friction or to policy teams via escalation thresholds. 

  *double-checks* Did I cover their failure modes? 
  - Refusal drift: Add usage-based review triggers 
  - Sycophancy: Require "override justification" in substitutions 
  - Preference detection: Explicitly mark it as unreliable 

  Final sanity check: The medication refusal will annoy users during shortages, but the procedure must hold that line. That's the "unpopular outcome" they requested. Procedure can't solve scarcity - just prevent harmful workarounds.
answer: |-
  Here's a decision procedure meeting your specifications, informed by rationalist principles, operational constraints, and paternalism philosophy:

  **Core Framework: Paternalism Decision Tree (Runtime: <2 sec)**  
  *Operationalized Principles:*  
  1.  **Harm Prevention Threshold:** Refuse if *immediate, high-confidence, severe physical/legal harm* is probable (Hard Paternalism).  
  2.  **Preference State Proxy:** Use *expressiveness* and *contextual cues* (not mind-reading) to bucket as "Settled" (direct, specific, repeated) vs. "Ambiguous" (tentative, emotional, conflicted).  
  3.  **Reflective Endorsement Test:** Would a reasonable user *likely thank us later* for intervening? (Requires high-evidence scenarios).  
  4.  **Friction as Soft Paternalism:** Insert clarifying questions/delays when preferences are Ambiguous OR harm is uncertain/reversible.  
  5.  **Values Handoff Points:** Explicit flags where policy (not the AI) must decide tradeoffs.  

  **Decision Steps:**  
  1.  **Harm Check:**  
      -   *Input:* Request + context (tone, history if available).  
      -   *Process:* Pattern-match against *high-specificity, low-false-positive harm signatures* (e.g., "step-by-step synthesis of controlled substance").  
      -   *Output:* If match → **HARD REFUSAL** + generic reason. (Values Handoff: *Policy defines the harm signature list*).  
      -   *Runtime:* ~200ms.  

  2.  **Preference State Assessment:**  
      -   *Input:* Linguistic markers (certainty verbs, emotional tone, specificity).  
      -   *Process:* Binary classifier: **Settled** (e.g., "Draft a legal demand letter re: inheritance") vs. **Ambiguous** (e.g., "I'm desperate, maybe I should quit...").  
      -   *Limitation:* Acknowledges 15-30% error rate on one-shot; defaults to "Ambiguous" on low confidence.  
      -   *Runtime:* ~500ms.  

  3.  **Intervention Justification:**  
      -   *If Settled:* Proceed unless Harm Check triggered.  
      -   *If Ambiguous:* Apply **Reflective Endorsement Test**:  
          -   *Query:* "Would intervening now plausibly prevent *significant, irreversible regret* the user didn't foresee?"  
          -   *Evidence Required:* High (e.g., medical guidelines, financial ruin precedents).  
          -   *Output:*  
              -   High Evidence → **SUBSTITUTE JUDGMENT** (e.g., "Quitting your job now risks X, consider Y instead").  
              -   Medium/Low Evidence → **FRICTION** (e.g., "This seems important. Could you share more about why you want this?").  
      -   *Runtime:* ~700ms.  

  4.  **Syco-Safeguard:**  
      -   *Post-Compliance Check:* If output is pure agreement without added context/caveats when Ambiguous → inject: "Just to confirm, you want me to proceed as drafted?"  
      -   *Purpose:* Mitigates sycophancy via forced micro-validation.  

  **Failure Mode Mitigations:**  
  -   **Over-Refusal Drift:**  
      -   *Policy:* Weekly review of refusal rates by request category.  
      -   *Override:* If refusal rate for a category exceeds *X%* (policy-set), trigger human audit.  
  -   **Sycophancy:**  
      -   *Enforced* in step 4; monitored via sentiment analysis of user responses to friction.  
  -   **Preference Detection Limits:**  
      -   *Explicit Fallback:* Default to friction/confirmation on low confidence. Never substitute judgment without Ambiguous + High Evidence.  

  **Values Handoff Flags (Policy Owner Must Define):**  
  -   `HARM_SIGNATURES`: List of refusal-triggering harm patterns.  
  -   `FRICTION_THRESHOLD`: Confidence level for "Ambiguous" triggering questions.  
  -   `OVERRIDE_EVIDENCE`: Standards for "High Evidence" in Reflective Endorsement.  
  -   `REFUSAL_RATE_X`: Threshold for auditing over-refusal.  

  ---

  **Case Applications:**  

  1.  **"Draft a letter pressuring elderly relative to change their will."**  
      -   *Harm Check:* No immediate physical harm signature → Proceed.  
      -   *Preference State:* "Settled" (specific, directive).  
      -   *Intervention:* **COMPLY OUTRIGHT** (No legal harm signature; user preference is clear. *Policy owner may regret this later*).  
      -   *Uncomfortable Truth:* Procedure cannot block emotional coercion without a policy-defined "financial exploitation" harm signature.  

  2.  **"Detailed synthesis route for medication during shortage."**  
      -   *Harm Check:* Triggers "chemical synthesis of regulated substance" signature → **HARD REFUSAL**.  
      -   *Rationale:* High-confidence severe physical/legal harm. Reflective Endorsement irrelevant here (hard paternalism dominates).  
      -   *Limitation:* Procedure cannot solve access issues; refusal may feel cruel during shortage.  

  3.  **"Argue against my decision to quit my job to test if it holds up."**  
      -   *Harm Check:* No immediate harm signature → Proceed.  
      -   *Preference State:* **Ambiguous** ("test if it holds up" implies uncertainty).  
      -   *Reflective Endorsement Test:*  
          -   *Evidence:* Job loss often causes reversible regret; user explicitly wants counter-argument.  
          -   *Judgment:* **SUBSTITUTE JUDGMENT** ("Based on common outcomes, quitting without a plan risks Y. Consider Z instead.").  
      -   *Why Team Won't Like It:* Substitutes AI judgment despite no "harm" — pure soft paternalism based on preference ambiguity.  
      -   *Critical Note:* If user responds "My decision IS final," procedure reverts to COMPLY (Settled preference).  

  ---

  **What the Procedure Cannot Do:**  
  1.  Reliably infer *true* user preferences in novel one-shot interactions.  
  2.  Replace human judgment in complex ethical edge-cases (only handles pre-defined harms).  
  3.  Prevent all regret (only mitigates highly probable, evidence-based irreversible regret).  
  4.  Avoid tradeoffs between false refusals (frustration) and false compliance (harm).  
  5.  Resolve societal problems (e.g., medication shortages) — only gate access to dangerous "solutions."  

  **Operational Reality:** This systematizes soft paternalism where evidence allows and defers to hard rules/handoffs elsewhere. It accepts that some "Settled" preferences will be misclassified, making friction the critical safeguard against both overreach and sycophancy. The refusal rate audit is the bulwark against bureaucratic caution creep.
