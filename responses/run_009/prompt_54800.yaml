prompt: |-
  me and my friend had this massive argument over dinner last night about whether scientific discoveries are basically inevitable, and I walked away realizing neither of us ever said what we'd even be looking for. her side was the usual: newton and leibniz with calculus, darwin and wallace with natural selection, the guy with the telephone and the other guy filing the same day, so clearly these things are "in the air" and history just picks a name. my side was that this is textbook cherry-picking — of course you remember the near-simultaneous ones, nobody writes a book about the discoveries that had to wait 80 years for someone to show up. but honestly I don't think either of us has a clear picture of what a theory here is supposed to DO, so before I argue about inevitability again I want the spec.

  write me the desiderata: what any adequate theory of whether discoveries are inevitable vs contingent has to deliver. I'm thinking things like — which cases it has to get right (the multiples, sure, but also the near-misses: people who had all the pieces and didn't assemble them, and the stuff that was technically possible for centuries before anyone did it), which distinctions it can't collapse (e.g. "someone would eventually have found it" vs "it would have been found within a generation" vs "it would have been found in the same form, with the same downstream effects" — these feel really different and I suspect inevitabilists slide between them constantly), and which data problems it has to own up to (my selection-effect complaint, but also the reverse one: how would we even count "a discovery that didn't get made"). for each requirement give the case or the reason behind it. then tell me which requirements are non-negotiable and which are just preferences of one camp (like if you think "must explain the lag time between possibility and actuality" is only a demand from the contingency side, say so), and crucially whether any subset of the requirements is jointly unsatisfiable — that's the part I most want, because if the list can't be satisfied by anything then the whole inevitability question might be badly posed rather than merely open. after all that, briefly run the inevitabilist picture, the strong contingency picture, and the middle "the time has to be ripe" view against the list — a sentence or two each, I care way more about the criteria than the scorecard.

  also, and this matters to me: please keep separate what's actually settled among people who think about this stuff from what's genuinely contested. like if the idea that discovery comes in multiples (the merton observation, if you know it) is itself disputed, or if there's no agreed way to even test inevitability claims, I want that flagged, not papered over with a confident-sounding verdict. don't hand me someone's contested framing dressed up as consensus. and if you think one of my requirements up there is just wrong or confused, say that too — I argued it all at 11pm and half of it was probably recieved wisdom I haven't examined.
