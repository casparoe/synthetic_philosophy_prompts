  - Design the case that would actually split the candidate rules — something she'd have to take a side on, not another parkable one.
  - When you lay out the rules and background, please seperate what's basically settled among people who study this stuff from what's genuinely contested, and don't present a contested view as the consensus. I already had one reading handed to me as The Answer and idk if thats right.

  Format: our study group keeps a log of these (small betting pool, dont judge), so could you reply as a single JSON object with nothing outside it? Schema:

  {
    "predictions": [
      // one entry per new case, in order 1-3
      { "case": "...", "call": "agent | instrument | depiction | something else | parked", "confidence": "high | medium | low", "why": "..." }
    ],
    "candidate_rules": [
      // at least two; give each a predicted call for every new case
      { "name": "...", "statement": "one sentence", "fits_her_record_because": "...", "predictions": { "case_1": "...", "case_2": "...", "case_3": "..." } }
    ],
    "best_guess": { "rule": "...", "why": "..." },
    "settled_vs_contested": { "settled": ["..."], "contested": ["..."] },
    "discriminating_case": { "description": "...", "what_each_ruling_would_show": "..." }
  }

  The field meanings should be pretty clear from the names, but "call" should use her taxonomy (agent / instrument / depiction, or something else, or parked). If something genuinely doesn't fit anywhere, stick it in a "notes" field at the end. And if my two candidate rules above are just wrong, replace them — just flag it in best_guess.why or notes so I know.
