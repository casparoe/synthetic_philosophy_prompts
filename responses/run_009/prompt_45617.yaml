  - a video of a person: not an agent — "a depiction of one"
  - one of those old scripted museum kiosks that plays a historical figure with canned lines: not an agent, same reason, a depiction
  - beaver building a dam: agent, easy call for her
  - octopus opening a jam jar: agent
  - an improv actor who stays in character while people heckle her: agent — Dana's take was that staying in character is the actor's own project, the role doesn't own her
  - a bot trained purely by trial and error in a racing sim, which now improvises around cars that block it: she parked this one. said "good question" and changed the subject. twice.

  She also sorts the non-agents into instruments (stuff with a job: thermostat, mousetrap, roomba) and depictions (stuff that portrays: the video, the kiosk).

  Thursday's agenda:
  1. an LLM study-buddy that, when its first explanation doesn't land, tries an analogy, then another angle, until the student gets it — and that also just refuses to write the essay for them
  2. the same underlying LLM roleplaying a scheming, ambitious AI for a game — and the question of what's even up for ruling: the service, the model, or the character? (this one feels designed to annoy her)
