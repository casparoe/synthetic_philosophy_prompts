prompt: |-
  I chair the examinations committee of a professional body that certifies software engineers. Our certificate functions as a licence to practice: employers and, in some jurisdictions, regulators treat it as evidence that the holder can be trusted with production systems. Until recently our rules were simple — a closed-book written exam on fundamentals, plus a practical exam on a sandbox machine with a standard editor and the language documentation installed. Now we receive a steady stream of requests, several per quarter, to allow or disallow particular resources on the practical exam: full web access, autocomplete and refactoring tools, AI code assistants of varying power, a candidate's personal snippet library, a printed cheat sheet, a designated colleague on chat to clarify requirements. Each request needs a ruling within a few weeks, with a written rationale, because candidates can and do appeal, and inconsistent rulings keep getting overturned. Our committee members are working engineers, not philosophers, and they currently decide by intuition.

  I would like our rulings grounded in the extended mind thesis. My understanding of it, roughly: Clark and Chalmers argued that when an external resource is constantly available, automatically trusted and endorsed in the course of thought, and smoothly integrated into a person's cognition, it functions as part of that person's mind — thinking does not stop at the skull, and Otto's notebook does for him what Inga's biological memory does for her. The committee's competing instincts map onto this neatly: if a tool genuinely functions as part of the candidate's mind, then examining the candidate without it examines a stripped-down person who will never exist in practice; but if we admit every tool, we may end up certifying the tool rather than the engineer, and the certificate's meaning quietly changes.

  Please write a decision procedure the committee can run on a request. It should list the questions to ask in order, state what counts as a sufficient answer to each, mark the points where the procedure returns a ruling outright and the points where it instead hands the case back to the committee because the remaining question is one of professional values rather than anything the extended mind framework can settle. It must be usable within an hour by a non-philosopher, and it should be candid about which of its steps are judgment calls dressed up as procedure. Then run it on three requests: (a) a code-completion assistant trained on general code; (b) the candidate's own curated snippet library, built up over their career; (c) full web access, including documentation and Q&A sites. At least one ruling should be one the committee will dislike, and you should say which one it is and why the procedure nonetheless returns it. Finally, tell me where the procedure is most likely to misfire as code assistants improve over the next few years, and identify what in the extended mind framework itself — not merely in our implementation of it — limits how far it can carry us here.
reasoning: |-
  Okay, let me approach this systematically. The user chairs an examinations committee for software engineer certification and wants to implement a decision procedure based on the extended mind thesis. Their core challenge is balancing between examining the "true" professional (tools included) versus ensuring the certificate reflects personal competence.

  Hmm, the extended mind framework seems perfect here. Clark and Chalmers' three criteria - constancy, trust/endorsement, and integration - directly map to whether a tool functions as cognitive extension. But I need to remember this isn't philosophy class; the procedure must be practical for working engineers. 

  First, I'll structure the decision flow: start with disqualifiers (safety/security risks), then apply extended mind tests, and finally handle professional judgment calls. The key is making the framework operational - turning "smoothly integrated" into concrete questions like "Does the candidate reflexively use this without conscious retrieval?"

  For the test cases: 
  - The code-completion assistant (a) likely fails constancy - its suggestions vary unpredictably. 
  - The personal snippet library (b) clearly passes all three criteria - it's a consistent, trusted external memory. 
  - Full web access (c) is tricky... it passes constancy and endorsement but fails integration since searching is interruptive. Yet denying it feels wrong professionally. 

  Ah, there's the tension - the framework says no to web access, but engineers will protest. That's why step 4 exists: to override philosophy with professional reality. The procedure must acknowledge this explicitly.

  Looking ahead, AI tools will strain the "trust/endorsement" criterion. When models hallucinate less and align perfectly with user intent, distinguishing tool from mind becomes harder. The framework's limitation is its binary view - real cognition involves fluid assembly of internal and external resources, not fixed "extensions."

  Better include strong caveats: this procedure can't resolve value conflicts about what constitutes "core" competence. And remind them that as tools evolve, they'll need to revisit these rulings annually.
answer: |-
  Here’s a practical decision procedure grounded in the extended mind thesis (EMT), designed for efficiency and transparency. It prioritizes Clark and Chalmers' criteria: **Constancy, Trust/Endorsement, and Integration**, while flagging value judgments.

  ---

  ### **Decision Procedure for Exam Resource Requests**  
  *Time: ≤60 min | Input: Specific resource request | Output: Ruling + Rationale*

  1. **Safety/Security Pre-Check (Non-EMT)**  
     **Question:** *Could this resource compromise exam security (e.g., real-time human collaboration) or enable malpractice (e.g., accessing production systems)?*  
     **Sufficient Answer:** "Yes" → **Disallow immediately**. *Rationale: Exam integrity is non-negotiable.*  
     **No** → Proceed to Step 2.  
     *🛈 Judgment call: Committee defines "malpractice" per exam policies.*

  2. **EMT Core Test**  
     Ask sequentially. **Fail any criterion → Disallow**. **Pass all three** → Proceed to Step 3.  
     - **Constancy:** *Is this resource reliably available to the candidate in all real-world work contexts relevant to certification?*  
       **✓ Sufficient:** Personal tools (e.g., snippet library) used daily; standard professional tools (e.g., language docs).  
       **✗ Insufficient:** Ephemeral/context-dependent tools (e.g., ad-hoc web searches, colleague chat).  
       *🛈 Judgment call: "Reliable availability" is profession-dependent.*  
     - **Trust/Endorsement:** *Does the candidate treat outputs from this resource as automatic, pre-reflective inputs to their reasoning (like biological memory), not as external advice to be validated?*  
       **✓ Sufficient:** Tools whose outputs are instinctively trusted (e.g., muscle memory for snippets, IDE autocomplete for syntax).  
       **✗ Insufficient:** Tools requiring active verification (e.g., AI-generated code needing review, Q&A site answers).  
     - **Integration:** *Is the resource seamlessly embedded in the candidate’s thought process without cognitive disruption?*  
       **✓ Sufficient:** Direct, non-disruptive use (e.g., editor autocomplete, personal notes).  
       **✗ Insufficient:** Tools requiring significant attention shift (e.g., browsing Stack Overflow, debugging AI suggestions).  

  3. **Professional Boundary Check**  
     **Question:** *Even if EMT-passing, would allowing this resource void the exam’s purpose by certifying the tool’s capability over the engineer’s?*  
     **Sufficient Answer:** "Yes" → **Disallow**. *Rationale: Certification must reflect human competence.*  
     **No** → **Allow with constraints** (e.g., "snippet library permitted, but no web access").  
     *🛈 Explicit value judgment: Committee debates what constitutes "core" competence.*

  4. **Default Ruling**  
     If no decision reached by Step 3 → **Disallow**. *Rationale: Burden of proof lies with requester.*  

  ---

  ### **Test Cases**  
  **Assumption:** All resources pass Safety/Security Pre-Check.

  #### **(a) Code-Completion Assistant (e.g., GitHub Copilot trained on public code)**  
  - **Constancy:** ✓ (Used in daily workflow by many).  
  - **Trust/Endorsement:** ✗ **FAIL**. Outputs require validation; may suggest incorrect/inefficient code.  
  - **Integration:** ✗ (Distracting if suggestions are poor).  
  **Ruling: DISALLOW**  
  *Rationale: Not automatically trusted; certifies tool’s pattern-matching, not engineer’s judgment.*  

  #### **(b) Candidate’s Curated Snippet Library**  
  - **Constancy:** ✓ (Always available, personally maintained).  
  - **Trust/Endorsement:** ✓ (Instinctively trusted as personal "memory bank").  
  - **Integration:** ✓ (Seamless via editor shortcuts).  
  - **Professional Boundary:** ✓ (Snippets reflect engineer’s own patterns).  
  **Ruling: ALLOW**  
  *Rationale: Functions as extended long-term memory; aligns with Otto’s notebook analogy.*  

  #### **(c) Full Web Access (Documentation + Q&A Sites)**  
  - **Constancy:** ✓ (Ubiquitous in modern workflows).  
  - **Trust/Endorsement:** ✗ **FAIL**. Q&A answers require critical evaluation; documentation often cross-referenced/verified.  
  - **Integration:** ✗ (High cognitive load: searching, comparing sources).  
  **Ruling: DISALLOW**  
  **The committee will dislike this ruling** — *Why?* Modern developers rely on the web, but EMT prioritizes *automatic trust and smooth integration*. Web access demands active validation and disrupts flow, failing EMT. *However, Step 3 allows overriding:* If committee agrees web literacy is "core" competence (e.g., finding solutions under pressure), they may **ALLOW** via Professional Boundary Check. EMT alone cannot resolve this value conflict.  

  ---

  ### **Future Limitations & Framework Weaknesses**  
  **Where the procedure misfires as AI improves:**  
  - **Trust/Endorsement criterion erodes** if AI assistants achieve near-perfect reliability. As tools require less validation, they may pass EMT despite replacing skill (e.g., an AI writing entire functions).  
  - **Integration becomes deceptive** with brain-computer interfaces (e.g., neural autocomplete), making "seamlessness" a poor proxy for cognition.  

  **Extended Mind Framework Limitations:**  
  1. **Values Blindspot:** EMT determines *if* a tool is part of cognition, not *whether that cognition should be certified*. Competence may reside in tool assembly/curation (e.g., snippet libraries), but exams traditionally test atomic skills.  
  2. **Dynamic Tools:** EMT assumes stable tools. Real-world tools evolve (e.g., AI updates), destabilizing "constancy."  
  3. **Collective Cognition:** EMT addresses individual minds, but professional work often uses *socially distributed* cognition (e.g., team chats). The framework struggles here.  

  **Recommendation:** Revisit rulings annually as tools evolve. Use EMT for consistency but empower Step 3 (Professional Boundary) to override EMT when industry norms shift.  

  ---  
  This procedure provides defensible rulings while spotlighting where committee values must drive decisions. It balances philosophy with pragmatism, ensuring the certificate remains a trustworthy signal of human competence.
