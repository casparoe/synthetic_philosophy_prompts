  I'm a PhD student in philosophy of physics, and at the end of a workshop talk on whether the Everett interpretation yields empirically distinct predictions from Copenhagen-style quantum theory, a senior physicist in the audience waved the question away with 'shut up and calculate'. The slogan comes up constantly in my circles whenever interpretation is mentioned — sometimes against asking what the wave function represents, sometimes against asking whether many-worlds is even testable, and sometimes just to complain that philosophers should spend less time talking and more time doing physics. Could you separate the distinct precise claims the slogan could be expressing — from the near-trivial reading on which it's a platitude about research priorities, through readings on which it's a substantive methodological doctrine, to readings on which it's a strong philosophical thesis about meaninglessness or about the interpretation debate being a dead end — and for each, say whether it's trivial, defensible but contentious, or simply false? In particular, I'd like to know which of those readings, if any, would actually justify deploying the slogan to terminate a debate about the relative empirical standing of Everettian and Copenhagen quantum mechanics, since several of them look beside the point for that question. Please lay the readings out as a numbered menu I can circulate to our reading group beforehand, and write your answer in British English.
