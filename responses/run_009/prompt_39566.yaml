prompt: |-
  I lead evals at a company that ships ML features into a medical scheduling product (nothing clinical, just booking, rescheduling, triaging which queue a request goes to, stuff like that). We have a recurring fight I'm tired of adjudicating by vibes: when one of our models does surprisingly well on a task, half the team says it "understands" what patients want and we can generalize from that, the other half says it's pattern matching that will fall apart the first time the world shifts. I've been reading about Dennett's idea of competence without comprehension -- the "strange inversion of reasoning" he attributes to Darwin and Turing, where you explain a system's intelligent-looking performance by going bottom-up from design/selection pressure instead of top-down from an intelligent designer or inner understander. I want that idea turned into something my team can actually run on a concrete result, like a written procedure with steps, rather than a philosophy of mind position paper.

  Specifically, write me a decision procedure an eval engineer could follow when a model clears a benchmark or does well in offline testing, that tells them how much they're licensed to conclude about how the model will behave in new situations, based on the competence/comprehension distinction. Things it should cover:

  - What questions to ask about the result in some sensible order -- e.g., whether the evaluation distribution differs from deployment in ways that matter, whether the successful behavior was selectable or trainble for in the way the deployment behavior would need to be, whether performance survives perturbations that break surface pattern-matching, whatever you think the distinction actually requires -- and what counts as a good enough answer at each step
  - Where the procedure stops with "you're not licensed to conclude anything" vs "you're licensed to generalize cautiously" vs "this question can't be settled by procedure and an engineer has to make a judgment call," and I want you to be honest about which of your steps are just judgment wearing a labcoat
  - The procedure has to handle the case where the model was trained on data from the very process it's now predicting (our booking data is generated by our old routing rules), because I suspect competence that comes from mimicking the output of a rule-following process isn't the same thing as competence that will hold up when the rules change -- tell me if that's right or if I'm overcomplicating it

  Then run it on three cases from my actual backlog: (1) a fine-tuned model that routes patient messages to queues and hit 97% agreement with the current human router on historical data, (2) a model that explains to patients why a requested slot isn't available, which does great on the slots from our test set but we've never seen it on a slot type that was added after training, and (3) a case where the procedure's verdict should annoy someone -- maybe where it tells us we can't make the "our AI understands patient needs" claim that marketing already put in the deck, or where it says the safest-looking model is the one we should trust least. Your pick, but the procedure should give an answer the team won't like at least once.

  Also tell me plainly what the procedure can't do. Like, I take it the whole Darwin/Turing point is that "does it really understand" might not be the useful question at all, and if that's true then a procedure built on this distinction inherits that problem -- I'd rather know that up front than discover it in a postmortem. Keep it practical enough that a new hire could run it in an afternoon without having read anything by Dennett, and dont make it so long nobody uses it.
reasoning: |-
  We are building a decision procedure based on Dennett's "competence without comprehension" idea. The goal is to determine how much we can generalize a model's good performance on an evaluation to deployment, especially in new situations.

  Key principles:
  1. We are not asking "does the model understand?" but "under what conditions will the model's competence hold?"
  2. We want to assess whether the model's success is due to robust, generalizable mechanisms or brittle pattern matching.

  The procedure should have steps that help us answer:
  - How representative is the evaluation data of the deployment environment?
  - How was the model trained? (e.g., mimicking existing rules vs. learning from outcomes)
  - How does the model perform under perturbations that break superficial patterns?
  - Is there evidence that the model's behavior is driven by the right features (i.e., features that are causally related to the outcome)?

  We'll structure the procedure as a flowchart of questions. At each step, we either get a green (proceed), yellow (caution), or red (stop and don't generalize) light. We may also have to make judgment calls.

  Procedure Steps:

  1. **Step 0: Document the evaluation result and the task.**
     - Clearly state: model, task, evaluation metric, performance achieved.

  2. **Step 1: Distributional Alignment Check**
     - Question: How well does the evaluation data distribution (inputs and contexts) match the expected deployment distribution?
     - Considerations: 
       - Are there known differences? (e.g., time period, demographic shifts, new slot types as in case 2)
       - If the model was trained on historical data (like case 1 and 3), does deployment involve changes? (e.g., rule changes, new policies)
     - Assessment:
       - Green: Evaluation data is known to be highly representative, including all relevant variations expected in deployment. No known shifts.
       - Yellow: Minor known differences that might not affect performance, or we are unsure. We need to test on a representative sample of the deployment distribution.
       - Red: Major known differences (e.g., new slot types, rule changes) that are not represented in the evaluation data. Performance on evaluation may not reflect deployment.

  3. **Step 2: Training Process Robustness Check**
     - Question: How was the model trained to achieve this competence? 
     - Considerations:
       - If the model was trained by mimicking human decisions (behavioral cloning) or existing rules (as in case 1), then it might not handle scenarios where the rules change because it learned the old rules, not the underlying reasons.
       - If the model was trained with reinforcement learning based on outcomes (e.g., patient satisfaction, scheduling efficiency) then it might be more robust to rule changes because it optimizes for the outcome.
       - If the model was trained on a diverse set of tasks or with data augmentation, it might be more robust.
     - Assessment:
       - Green: Model trained with outcome-based rewards (e.g., RL) or with explicit robustness measures (e.g., data augmentation, adversarial training) that cover the kinds of shifts expected in deployment.
       - Yellow: Model trained by behavioral cloning but the underlying rules are stable and the evaluation covers the deployment distribution (so Step 1 is green). Or, we have some evidence of robustness but not in the face of rule changes.
       - Red: Model trained by behavioral cloning and we expect rule changes in deployment (Step 1 is red or yellow) OR the training process is known to lead to overfitting (e.g., without regularization, on small data).

  4. **Step 3: Perturbation Testing Check**
     - Question: Does the model's performance degrade gracefully under meaningful perturbations, or does it break with small changes that shouldn't affect the outcome?
     - Considerations:
       - We design tests that break superficial patterns but leave the underlying problem intact. For example:
          - In routing: change the wording of patient messages but keep the intent the same. Does the model still route correctly?
          - In explanation: change the slot type to a new one (if we have a prototype) and see if the explanation is still reasonable? Or change the reason for unavailability in a way that should change the explanation but the model doesn't adapt.
       - If the model is robust to such perturbations, it suggests it's relying on deeper features.
     - Assessment:
       - Green: We have run perturbation tests and the model shows robustness (e.g., performance drop < 5% for semantically invariant changes, or it adapts to new slot types with minimal examples).
       - Yellow: We haven't run perturbation tests, or we have and there is a moderate drop (5-20%) that we can mitigate with simple fixes (e.g., adding a few examples). 
       - Red: Perturbation tests show a severe drop (>20%) or the model fails catastrophically on out-of-distribution examples that are still within the task.

  5. **Step 4: Causal Feature Check (if applicable)**
     - Question: Is there evidence that the model is using features that are causally linked to the outcome?
     - Considerations:
       - We can use feature importance or counterfactual analysis. For example, in routing: does the model pay attention to the medical urgency words (causal) or is it overly reliant on patient ID (non-causal, might be a proxy for historical routing)?
       - This step might require more effort and is not always feasible, so it can be optional if the previous steps are green.
     - Assessment:
       - Green: We have evidence (e.g., via SHAP, LIME, or counterfactual tests) that the model relies on features that are known to be causally relevant.
       - Yellow: The model uses a mix of causal and non-causal features, but we don't see strong reliance on spurious features.
       - Red: The model relies heavily on features that are known to be non-causal (e.g., historical assignments that are about to change) or are shortcuts (e.g., specific keywords that won't hold up).

  6. **Step 5: Synthesis and License to Generalize**
     - Based on the previous steps, we decide:
       - **Green light (generalize with confidence):** Steps 1-4 are mostly green. We can conclude the model's competence is likely to hold in deployment, including under minor shifts. We can say it "understands" in the operational sense that it captures the underlying structure.
       - **Yellow light (generalize cautiously):** Some steps are yellow. We need monitoring and a plan for rapid retraining. We can deploy but only with safeguards and a rollback plan. We cannot claim the model understands patient needs in a robust way.
       - **Red light (do not generalize):** Any step is red. The model's performance is brittle and we cannot trust it in deployment without further work.

     - Judgment call: If the results are mixed and we have to balance, we note that the procedure flags risks and the team must decide whether to proceed given the context (e.g., the cost of failure). But the procedure forces explicit risk acknowledgment.

  Now, we run the three cases:

  **Case 1: Fine-tuned model for routing patient messages (97% agreement with human router on historical data)**

  - Step 1: Distributional Alignment
    - The evaluation is on historical data. Deployment uses the same process? If we are changing the routing rules, then distribution might change (red/yellow). But if the human routing rules are stable, then green.
    - However, note: the model is trained to mimic the human router. If the human routing rules change, the model won't adapt. So if deployment involves rule changes, then Step 1 is red. Otherwise, green? But let's be cautious: even without rule changes, the model might be brittle to new types of messages.
    - Let's assume we are keeping the same rules -> Step 1: Green.

  - Step 2: Training Process Robustness
    - The model was trained by behavioral cloning (mimicking human decisions). It hasn't learned the outcomes (e.g., whether the routing led to timely care) but the human decisions which were based on rules. If the rules change, the model won't adapt. So if we expect no changes, then Step 2: Yellow (because it's stable but not outcome-based). If we expect changes, then Step 2: Red.

    Given we are in a stable rule environment? Let's assume the team says no rule changes planned -> Step 2: Yellow.

  - Step 3: Perturbation Testing
    - We should test with paraphrased messages. If the model relies on specific keywords that might not be robust, then it might break. We haven't done this? Then we must run tests. If we have and it's robust, green. Otherwise, we don't know -> yellow or red.
    - Since the case doesn't mention perturbation tests, we assume they haven't been done -> Step 3: Yellow.

  - Step 4: Causal Feature Check
    - We can analyze feature importance. Does the model use the right features (e.g., medical terms, patient history appropriately)? Without analysis, we can't say. So if not done, Step 4: Yellow.

  - Synthesis: 
    - Step 1: Green, Step 2: Yellow, Step 3: Yellow, Step 4: Yellow -> Overall Yellow. 
    - We can generalize cautiously. We should not claim the model "understands" patient needs in a deep sense because it's mimicking and might not handle even small shifts. We must monitor and be ready to retrain if the rules change or message patterns shift.

  **Case 2: Model that explains why a slot isn't available, does well on test set but never seen on a new slot type added after training**

  - Step 1: Distributional Alignment
    - Deployment will include the new slot type, which is not in the evaluation data. This is a known distribution shift. Step 1: Red.

  - Step 2: Training Process Robustness
    - How was the model trained? Likely supervised on historical explanations. Without knowing, we assume behavioral cloning. Even if it was trained with outcome-based rewards (unlikely for an explanation model), the new slot type is unknown. Step 2: Without specific robustness measures, we rate Yellow (if it had been trained with robustness) or Red. Since we don't have that, and the training didn't include new slot types, Step 2: Red.

  - Step 3: Perturbation Testing
    - We haven't tested on the new slot type. We could run a test now with a few examples of the new slot type. If we do and it fails, then red. If we haven't, we don't know -> but Step 1 already red, so we don't need to run? The procedure says we can run perturbation tests to check robustness. But in this case, the perturbation is exactly the new slot type. So if we test and it fails: red. If we test and it passes: then we have evidence for robustness. But the case says we've never seen it on the new slot type -> we haven't tested. Step 3: Red (because we know the perturbation exists and we haven't tested, and it's a clear distribution shift).

  - Step 4: Causal Feature Check
    - We don't know what features the model uses. Without analysis, and given the shift, Step 4: Red (because the new slot type might break the feature representation).

  - Synthesis: 
    - All steps are red. We cannot generalize. We must collect data on the new slot type and retrain or use a different approach.

  **Case 3: A case to annoy someone**

  Let's pick: a model that has been tested in a very narrow setting (e.g., only on data from one clinic) but achieves high performance. The team wants to roll it out to all clinics. Marketing is already claiming the AI understands patient scheduling needs.

  - Step 1: Distributional Alignment
    - The model was tested on one clinic. Deployment is to many clinics with different patient populations, scheduling practices, etc. This is a major shift. Step 1: Red.

  - Step 2: Training Process Robustness
    - Trained on a single clinic? Then it's not robust to distribution shifts. Step 2: Red.

  - Step 3: Perturbation Testing
    - We test by running on data from another clinic and see a big drop. Step 3: Red.

  - Step 4: Causal Feature Check
    - We find the model relies on clinic-specific features (e.g., specific doctor names, local slang). Step 4: Red.

  - Synthesis: Red light. We cannot deploy to other clinics without retraining. We must tell marketing they cannot claim the AI understands patient needs in a general way.

  What the procedure can't do:
  - It cannot prove that the model "understands". It can only assess the risk of the model's competence breaking under shifts.
  - It relies on our ability to define and test for distribution shifts and perturbations, which may be incomplete.
  - It requires some judgment in setting thresholds (e.g., what is a minor vs. major shift) and in designing perturbation tests.
  - It might be overly cautious in some cases, but that is by design.

  The procedure is a structured way to force the team to think about robustness and to avoid overgeneralizing from narrow evaluations.
answer: |-
  ### Decision Procedure: Competence Generalization Assessment

  This procedure helps you evaluate how much you can generalize a model's successful evaluation performance to real-world deployment, based on Dennett's "competence without comprehension" principle. The goal is to distinguish between robust competence (likely to hold under shifts) and brittle pattern-matching (likely to fail). It focuses on practical checks, not philosophical debates.

  **Inputs Required**:  
  - Evaluation results (metric, dataset, task)  
  - Model training details (data sources, objectives, constraints)  
  - Deployment context (expected shifts, new scenarios, risks)  

  **Outputs**:  
  - **Green**: Generalize confidently (competence is robust).  
  - **Yellow**: Generalize cautiously (competence is plausible but unproven; monitor closely).  
  - **Red**: Do not generalize (competence is likely brittle; retrain or redesign).  
  - **Judgment Call**: Flagged when objective criteria are insufficient; requires team debate.  

  **Procedure Steps**:  
  Execute sequentially. Stop early if any step returns **Red** or **Judgment Call**.  

  ---

  #### **Step 1: Evaluate Distributional Alignment**  
  *Purpose: Check if the evaluation data reflects deployment realities.*  
  - **Question**: Does the evaluation data differ from deployment in ways that could break the model?  
  - **Sub-checks**:  
    - **Temporal/Causal Decoupling**: If the model was trained on historical data generated by a process it now predicts (e.g., old routing rules), does deployment involve changes to that process?  
      - *Good enough*: Deployment uses identical rules → **Green**.  
      - *Red flag*: Rules have changed, or deployment introduces new variables (e.g., new slot types, policy updates) → **Red**.  
    - **Coverage Gaps**: Are there known deployment scenarios (e.g., edge cases, new user groups) missing from evaluation data?  
      - *Good enough*: Evaluation covers ≥95% of deployment scenarios via stratified sampling → **Green**.  
      - *Yellow flag*: Minor gaps exist (<5% of cases) but can be mitigated with safeguards → **Yellow**.  
      - *Red flag*: Major gaps exist (e.g., untested slot types, demographic shifts) → **Red**.  
  - **Judgment Call**: If gaps are suspected but unquantified (e.g., "we think it’ll handle new users, but no data").  

  #### **Step 2: Assess Trainability of the Behavior**  
  *Purpose: Determine if the model’s success relied on mimicking vs. learning causal mechanisms.*  
  - **Question**: Was the successful behavior selectable/trainable for the *right reasons*?  
  - **Sub-checks**:  
    - **Training Objective**: Was the model trained to optimize for an outcome (e.g., "minimize patient wait times") or to mimic patterns (e.g., "match historical routing labels")?  
      - *Good enough*: Outcome-based training (e.g., RL with reward tied to business goals) → **Green**.  
      - *Yellow flag*: Behavioral cloning (e.g., fine-tuning to match human decisions) → **Yellow** (it’s mimicking, not "understanding").  
      - *Red flag*: Pattern-matching on spurious correlations (e.g., relying on timestamps instead of patient needs) → **Red**.  
    - **Data Provenance**: If trained on outputs from a rule-based system (e.g., old routing rules), does deployment change those rules?  
      - *Good enough*: Rules are unchanged → **Yellow** (competence is borrowed, not inherent).  
      - *Red flag*: Rules have changed → **Red** (model learned rules, not underlying causes).  
  - **Judgment Call**: If the training objective is ambiguous (e.g., "the loss function mixes imitation and outcomes").  

  #### **Step 3: Test Perturbation Robustness**  
  *Purpose: Break surface patterns to see if competence survives.*  
  - **Question**: Does performance degrade catastrophically under small, realistic input changes?  
  - **Sub-checks**:  
    - **Invariance Tests**: Apply perturbations that *shouldn’t* change the output (e.g., rephrase patient messages without altering intent).  
      - *Good enough*: Performance drop ≤5% → **Green**.  
      - *Yellow flag*: Drop of 5–20% → **Yellow**.  
      - *Red flag*: Drop >20% or consistent failures → **Red**.  
    - **Novelty Tests**: Evaluate on held-out scenarios (e.g., new slot types, rare conditions).  
      - *Good enough*: Performance matches evaluation → **Green**.  
      - *Yellow flag*: Moderate degradation but recoverable via few-shot tuning → **Yellow**.  
      - *Red flag*: Complete failure → **Red**.  
  - **Judgment Call**: If perturbations are hard to define (e.g., "what counts as a semantically invariant change?").  

  #### **Step 4: Check for Causal Cohesion**  
  *Purpose: Verify if the model uses features tied to real-world causes.*  
  - **Question**: Is there evidence the model relies on *causal drivers* (e.g., patient urgency) vs. *proxy signals* (e.g., historical labels)?  
  - **Sub-checks**:  
    - **Feature Analysis**: Use explainability tools (e.g., SHAP, LIME) to identify top features. Do they align with domain knowledge?  
      - *Good enough*: ≥80% of top features are causal (e.g., "symptom severity" not "time of day") → **Green**.  
      - *Yellow flag*: Mixed features (some causal, some proxies) → **Yellow**.  
      - *Red flag*: Dominance of non-causal features → **Red**.  
    - **Counterfactual Tests**: If you modify causal features (e.g., "change ‘chest pain’ to ‘headache’"), does output change plausibly?  
      - *Good enough*: Output changes align with expectations → **Green**.  
      - *Red flag*: Output is erratic or unchanged → **Red**.  
  - **Judgment Call**: If causal drivers are unknown or disputed (e.g., "does ‘patient language’ matter?").  

  #### **Step 5: Synthesis for Generalization License**  
  *Purpose: Combine results to assign a final verdict.*  
  - **Rules**:  
    - **Green**: All steps **Green** (strong evidence of robust competence).  
    - **Yellow**: No **Red** flags, but ≥1 **Yellow** or **Judgment Call** (competence is plausible but unverified).  
    - **Red**: Any **Red** flag (competence is likely brittle; do not generalize).  
  - **Documentation**:  
    - Explicitly state limitations (e.g., "Only valid if scheduling rules remain unchanged").  
    - If **Judgment Call** occurs, list unresolved risks for team debate.  

  ---

  ### Procedure Applied to Your Cases  
  **Case 1**: Fine-tuned model for routing patient messages (97% agreement with human router on historical data).  
  - **Step 1**: Historical data matches deployment? → *No, if routing rules have changed*. **Red** (deployment uses updated rules).  
  - **Verdict**: **Red**. Do not generalize. The model mimics historical routing, but rules have changed → brittle pattern-matching.  
  - **Annoyance Factor**: Marketing’s "understands patient needs" claim is invalidated.  

  **Case 2**: Model explaining unavailable slots (excels on test slots, untested on new slot types added post-training).  
  - **Step 1**: Evaluation lacks new slot type → **Red** (major coverage gap).  
  - **Step 3**: Novelty test missing → **Red** (untested on critical scenario).  
  - **Verdict**: **Red**. Do not deploy to new slot types without testing.  
  - **Annoyance Factor**: Forces delay to collect new data, even though offline metrics look great.  

  **Case 3 (Designed to Annoy)**: Model predicting no-shows with 99% accuracy on current data.  
  - **Context**: Trained on historical no-show labels from a static system. Deployment involves new patient incentives to reduce no-shows.  
  - **Step 1**: Historical data ≠ deployment (incentives change causes) → **Red**.  
  - **Step 2**: Trained to mimic labels, not optimize outcomes → **Red**.  
  - **Step 4**: Feature analysis shows reliance on non-causal proxies (e.g., "appointment hour" vs. "patient income"). → **Red**.  
  - **Verdict**: **Red**. Safest-looking model (high accuracy) is least trustworthy under shift.  
  - **Annoyance Factor**: Team must scrap a "high-performing" model and restart training with outcome-based objectives.  

  ---

  ### What This Procedure Can’t Do  
  1. **Prove "Understanding"**: It doesn’t answer if the model "truly understands"; it measures robustness under shifts. Dennett’s point is that "comprehension" is a red herring—focus on competence in context.  
  2. **Predict Black Swans**: It flags *known* risks (e.g., rule changes) but won’t catch unforeseeable distribution shifts.  
  3. **Eliminate Judgment**: Steps 1–4 include **Judgment Call** flags where engineers must weigh risks (e.g., defining "causal features"). This is "judgment in a lab coat"—it forces explicit debate.  
  4. **Replace Monitoring**: A **Green** verdict still requires canaries and guardrails in deployment.  
  5. **Fix Data Limitations**: If evaluation data is flawed (e.g., biased labels), the procedure can’t magically validate generalization.  

  ### Why This Works for Your Team  
  - **Time-Efficient**: Runs in 2-3 hours per eval (less for subsequent uses).  
  - **No Philosophy Degree Needed**: Uses concrete checks (e.g., perturbation tests, feature analysis) instead of theory.  
  - **Stops Hype**: Forces honesty about limitations (e.g., "we’re licensed to generalize cautiously, not claim comprehension").  
  - **Scalable**: New hires can run it with templates for perturbation tests/feature analysis.  

  **Final Tip**: Pair this with a "deployment warranty" doc that links generalization verdicts to rollback conditions (e.g., "If no-show incentives change, retrain within 48 hours"). This turns philosophy into ops.
