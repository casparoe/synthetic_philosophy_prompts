prompt: |-
  Longtime reader here — been around since the Overcoming Bias days, read the CEV doc when it was fresh, so this stuff is basically load-bearing for how I think about alignment. I've ended up with a take on coherent extrapolated volition that I don't see many people defending, and I want it stress-tested, because I've held it long enough that I no longer trust my own evaluation of it.

  The usual CEV story (Yudkowsky's 2004 version): a Friendly AI shouldn't just obey our current stated preferences — the wish if we knew more, thought faster, were more the people we wished we were, had grown up farther together — it should satisfy the extrapolated, idealized version instead. Most of the fight around it is about whether extrapolation converges to one thing or fragments into a bunch of attractors, and about whose volition is in the pool. That fight is not where I live.

  My position is this: the CEV step is defensible as a *robustness improvement*, not as a correctness claim. The gap it exploits is that raw stated preferences are distorted in documented, systematic ways — framing effects, mood at the moment of elicitation, whoever had the mic last. Even a crude idealization (say, averaging over emotional states, or discounting a preference you'd disavow a week later) filters out a lot of that variance. And for a system with lock-in potential — something steering for a very long time — stability of the target matters more than getting the target exactly right, because a noisy target compounds while a biased-but-stable one at least doesn't drift. So the claim isn't "extrapolation recovers our true values." The claim is "almost any monotone move toward coherence beats deferring to the raw snapshot, even when the extrapolation is quite wrong." I'd rather be governed by a mediocre extrapolation of me than by me-on-a-bad-day, permanently.

  So what I'm asking: what would count against *that* claim specifically — not against CEV in general? I'm not looking for a bibliography of people who dislike CEV, and I'm definitly not looking for agreement. Sort the defeaters by how much they should move me, from ones I'd have to concede on the spot to ones I could reasonably shrug off. Some pressure points I can already half-see, use them or ignore them if they're dumb:

  - Evidence that raw elicited preferences are already pretty stable across time and framing, so the variance gap I'm relying on is smaller than I think and the whole improvement is marginal.
  - A case where crude idealization is systematically worse than the raw snapshot — e.g., if moral urgency happens to correlate with emotional intensity, then mood-averaging might smooth out exactly the signal that matters most. Occasional bad cases I can absorb; a systematic bias in the wrong direction I can't.
  - The argument that "better than raw deference" answers the wrong question once the comparison class is "whether to lock in anything at all," so my robustness framing is answering a question nobody asked.

  Also give me an honest read on whether I've qualified this into unfalsifiability. "Better than the alternative, whatever happens" is a suspiciously cheap thing to believe, and "beats the snapshot" could quietly become a standard that moves whenever it's challenged. If you think the position rests on a confusion — say, that I'm treating robustness as doing work that only accuracy can do, or assuming without argument that idealization errors are unbiased — say that plainly up front rather than politely working within my framing. If the question itself is confused, I want to hear that first, not last.

  Format, please, with these sections in this order:

  1. "Sanity check" — 2-3 sentences on whether the position as I've stated it is even coherent, before you touch the defeaters.
  2. "Defeaters that should move me" — roughly 350 words, ranked, with the strongest first and a sentence on why each sits where it does.
  3. "What I can shrug off" — roughly 150 words on the merely-awkward stuff and why it's merely awkward.
  4. "The insulation problem" — roughly 150 words on whether I've made this unfalsifiable in a way that matters.
  5. "Bottom line" — 3 sentences max, including whether you think I should keep holding this or drop it.
reasoning: |-
  Okay, let me start by really understanding what this user is asking. They're a longtime reader of Overcoming Bias and the CEV doc, so they're deeply familiar with the concepts. Their main point is that CEV should be seen as a robustness improvement rather than a correctness claim. They want their specific take stress-tested, not the usual debates around CEV.

  First, I need to check if their position is coherent. They're arguing that even a flawed extrapolation is better than raw preferences because it reduces noise. The key here is stability over time versus accuracy. That seems logically sound as long as the idealization process doesn't introduce more bias than it removes.

  Now, looking for defeaters. The strongest counter would be evidence that raw preferences aren't actually that noisy. If studies show preferences are stable across contexts, then the variance gap they mention shrinks. Also, if idealization systematically removes important signals, like emotional intensity correlating with moral urgency, that's a big problem. Next, the argument that robustness is irrelevant if we shouldn't lock in any values at all. That's a meta-level issue.

  Weaker defeaters might include implementation challenges or cases where idealization goes wrong. But occasional failures don't undermine the core argument if the net effect is positive. The user can probably shrug these off.

  Then there's the insulation problem. If the claim is that any monotonic move toward coherence is better, it risks becoming unfalsifiable. But the user is aware of this, so it's a caution rather than a dealbreaker.

  Bottom line: Their position holds water, but with caveats. They should keep it but stay alert to new evidence about preference stability or systematic biases in idealization. The robustness framing is valid but not a silver bullet.
answer: |-
  ### 1. Sanity check  
  Your position is coherent: it reframes CEV not as discovering "true" values but as a noise-reduction heuristic. By prioritizing stable, de-biased preferences over volatile raw snapshots, you argue that idealization robustly outperforms deference to ephemeral states—even if imperfect. This avoids metaphysical claims about "true volition" and grounds CEV in decision-theoretic pragmatism.  

  ### 2. Defeaters that should move you (ranked strongest → weakest)  
  **1. Raw preferences are *more* stable than extrapolations under empirical scrutiny**  
     If studies show human values (e.g., core ethics, life goals) exhibit high cross-temporal stability *without* idealization—while crude extrapolations *amplify* biases (e.g., overfitting to cultural norms)—your variance gap collapses. Example: Longitudinal data revealing that major life preferences (career, family) change less than models predict, whereas "idealized" versions drift with algorithmic biases. *This directly undermines your core premise that snapshots are noisier.*  

  **2. Idealization systematically erases morally critical information**  
     If "distortions" like emotional intensity or contextual framing *carry signal* (e.g., righteous anger flags injustice; acute stress reveals true priorities under scarcity), averaging/discounting them destroys value. Evidence: Neuroethical studies linking visceral reactions to deeply held moral principles (e.g., disgust in deontological judgments). If CEV’s "monotone move" consistently mutes these signals—say, by interpreting "coherence" as cool detachment—it could discard urgency where it matters most. *This attacks your claim that idealization is net-beneficial despite errors.*  

  **3. Robustness is irrelevant if lock-in itself is catastrophic**  
     Even if CEV beats snapshot-deference, both fail if *any* value lock-in prevents course-correction for unknown futures. Example: A CEV-derived utopia that precludes post-human moral growth or existential risk adaptation. If dynamic, participatory governance (despite noise) outperforms rigid idealizations in volatile environments, your "stability advantage" becomes a liability. *This reframes your comparison class, making robustness insufficient.*  

  ### 3. What I can shrug off  
  **Minor implementation flaws**: Cases where idealization fails idiosyncratically (e.g., smoothing away a rare but valid emotional preference) are tolerable if net bias/variance reduction holds. **Theoretical fragmentation worries**: Debates about whether "true" CEV converges matter less here—your argument works even with plural, context-specific idealizations. **Epistemic limitations**: Skepticism about modeling "ideal selves" is acknowledged in your "mediocre extrapolation" framing; you only need *relative* improvement, not perfection. These don’t challenge the core tradeoff.  

  ### 4. The insulation problem  
  Your claim *is* at risk of unfalsifiability if "monotone move toward coherence" becomes a moving target. However, you anchored it to empirical criteria:  
  - **Testability**: If studies show raw preferences have *lower* long-term regret than idealized versions (e.g., people consistently regret "rational" choices made in calm states), your position falters.  
  - **Bias admission**: By conceding idealization can be "quite wrong," you avoid assuming errors are neutral—but the burden is on you to demonstrate they aren’t *systematically* worse.  
  *Remedy:* Specify falsifying scenarios (e.g., "If mood-averaging increases catastrophic error rates by X% in domain Y, I drop this").  

  ### 5. Bottom line  
  Hold this position, but update cautiously. It’s defensible as a heuristic for reducing near-term volatility, especially given lock-in risks. However: **Monitor evidence on preference stability**—if snapshots are reliable, CEV adds little. **Audit idealization for systematic bias**—e.g., does it silence marginalized voices? **Clarify that robustness ≠ justification for lock-in**. This framing is valuable, but not a free pass.
