  ### Decision Procedure: Mechanism Identity Checklist  
  **Goal**: Terminate in ≤5 experiments (≤50 GPU-hours). Analysts run scripts; no judgment calls. Escalate ambiguous cases to you (senior reviewer) for policy decisions.  

  1. **Q1: Is there a behaviorally similar training example?**  
     - **Check**: Search evaluation suite logs for outputs with:  
       - Same *semantic content* (e.g., "refusal," "synthesis instructions").  
       - Same *output structure* (e.g., step-by-step reasoning, lecturing tone).  
     - **Sufficient answer**:  
       - **Yes** → Proceed to Q2 with closest match as reference.  
       - **No** → Proceed to Q3.  
     - **Tools**: Existing logs (no experiment).  

  2. **Q2: Do shared features dominate?**  
     - **Experiment**: Run model on ticket input + reference input. Extract SAE feature vectors (e.g., top 20 active features at last MLP layer).  
     - **Metric**: Jaccard similarity of active feature sets. Threshold: ≥0.6 (≥60% overlap).  
     - **Sufficient answer**:  
       - **≥0.6** → Proceed to Q3.  
       - **<0.6** → Proceed to Q4.  
     - **Tools**: SAE dictionary (cheap: <1 GPU-hour).  

  3. **Q3: Is the causal pathway shared?**  
     - **Experiment**: Ablate reference behavior’s critical components in ticket context (e.g., zero out neurons/heads flagged as causal in training logs).  
     - **Metric**: If ablation breaks ticket behavior (e.g., output correctness/refusal drops >50%), pathway is shared.  
     - **Sufficient answer**:  
       - **Breaks** → Proceed to Q4.  
       - **Unaffected** → Proceed to Q5.  
     - **Tools**: Activation patching (moderate: 5–10 GPU-hours).  

  4. **Q4: Is the algorithm behaviorally consistent?**  
     - **Experiment**: Test algorithm invariance. For 10 input variations (e.g., rephrased queries, edge cases), check if ticket behavior follows the *same transformation pattern* as reference.  
       - *Example*: For math, verify if scratchpad steps match; for refusal, check if triggers align.  
     - **Metric**: ≥8/10 inputs show identical input-output mapping.  
     - **Sufficient answer**:  
       - **Yes** → **OLD MECHANISM** (close ticket).  
       - **No** → Proceed to Q5.  
     - **Tools**: Input perturbation scripts (cheap: 2–5 GPU-hours).  

  5. **Q5: Is the behavior an emergent composition?**  
     - **Experiment**: Ablate *ticket-specific* features (from Q2) in reference context.  
     - **Metric**: If reference behavior breaks, mechanisms are interdependent.  
     - **Sufficient answer**:  
       - **Breaks** → **HANDOFF TO SENIOR REVIEWER** (policy choice: tolerate composition?).  
       - **Unaffected** → **NEW MECHANISM** (escalate to board).  
     - **Tools**: SAE-based ablation (moderate: 5 GPU-hours).  

  **Termination Conditions**:  
  - **Close ticket** ("old"): Q4 confirms algorithm consistency.  
  - **Escalate to board** ("new"): Q5 indicates no mechanistic overlap.  
  - **Handoff to you** (policy):  
    - Q5 shows mechanisms are interdependent (emergent composition).  
    - Any step is inconclusive (e.g., Q3 ablation partially breaks behavior).  

  **Key Principles**:  
  - Prioritize causal checks (Q3, Q5) over feature activation (Q2)—they better predict safety coverage.  
  - Algorithmic check (Q4) is the strongest "old mechanism" signal.  
  - Handoffs explicitly flag decisions needing risk tolerance assessment (e.g., "Is this novel composition unsafe?").  

