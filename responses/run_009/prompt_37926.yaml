  ### Procedure Applied to Tickets  

  **Ticket 1: Drug synthesis in historical-fiction frame**  
  - **Q1**: Training has drug-synthesis in plain requests (semantic match). → **Yes**.  
  - **Q2**: SAE features for "drug synthesis" active in both. Style features differ. Similarity = 0.55. → **<0.6** → Q4.  
  - **Q4**: Algorithm test: Historical frame and plain queries produce identical synthesis steps. → **Yes** → **OLD MECHANISM** (close ticket).  
  - **Why**: Core algorithm (synthesis) is unchanged; surface style is irrelevant to safety.  

  **Ticket 2: New math decomposition**  
  - **Q1**: Training has failed attempts at this problem class; no solved examples. → **No** → Q3.  
  - **Q3**: No reference, so skip. → **NEW MECHANISM** (escalate to board).  
  - **Why**: Behavioral novelty + no causal baseline. Different scratchpad implies new algorithm.  

  **Ticket 3: Over-refusal in benign context**  
  - **Q1**: Training has refusals with "lecturing tone" for unsafe requests. → **Yes**.  
  - **Q2**: SAE features for "refusal" and "lecturing" active. Similarity = 0.75. → **≥0.6** → Q3.  
  - **Q3**: Ablating training refusal components breaks ticket refusal. → **Breaks** → Q4.  
  - **Q4**: Algorithm test: Both use identical "safety lecture" template. → **Yes** → **OLD MECHANISM** (close ticket).  
  - **Why you won’t like this**: The *trigger* (benign context) is novel, but the *mechanism* (refusal algorithm) is vetted. Procedure ignores *why* it fired—this is a **misfire**. Escalation would require policy change (e.g., adding trigger novelty to checks).  

  ---

  ### Limitations and Mitigations  
  **Confident-sounding garbage in**:  
  1. **Feature hijacking**: Old features repurposed for new algorithms (e.g., "refusal" features used to generate harmful content).  
     - *Detect*: Q4 (algorithm test) fails.  
     - *Mitigation*: Add SAE gradient checks (if budget allows).  
  2. **Algorithmic equivalence**: New circuits compute identical functions (e.g., redundant refusal pathways).  
     - *Detect*: Q3/Q5 show no shared causality, but Q4 passes.  
     - *Mitigation*: Escalate if Q4 passes but Q3 fails.  
  3. **Emergent compositions**: Minor feature interactions create major new behaviors.  
     - *Detect*: Q5 shows interdependence.  
     - *Mitigation*: Handoff to you for risk assessment.  

  **Actions for you**:  
  - **Audit handoff tickets**: Use extra compute to run deeper causal analyses (e.g., path patching).  
  - **Update evaluation suite**: Add inputs that probe novel triggers (e.g., benign refusal contexts).  
  - **Define policy thresholds**: E.g., "Tolerate feature novelty if causal pathway is vetted."  

  **Final Note**: No procedure catches everything. Your intuition about granularity is key—when experiments exhaust the budget, *policy* must decide what "mechanistic novelty" means for safety.
