  ### Brainstorm: Candidate Identity Criteria for "Same Mechanism"

  - **Shared Features**: *Same mechanism* if the same sparse autoencoder (SAE) features are active above threshold in both cases. *Different* if feature sets differ significantly. Focuses on activation patterns, but ignores compositional structure—same features can be reused for different purposes.
  - **Shared Causal Pathway**: *Same mechanism* if ablating components (e.g., neurons, attention heads) critical for Behavior A also breaks Behavior B. *Different* if ablations are behavior-specific. Tests dependency, but misses functionally identical algorithms implemented by different circuitry.
  - **Shared Algorithm**: *Same mechanism* if both behaviors compute identical input-output mappings (e.g., same step-by-step reasoning). *Different* if the transformation differs. Agnostic to implementation, but hard to verify mechanistically—identical outputs can arise from different internal processes.
  - **Shared Weights**: *Same mechanism* if identical weights (neurons, layers) are causally necessary. Overlaps with shared causal pathway but emphasizes physical substrate. Fails when behaviors share weights but compute different functions (e.g., multi-task components).

  These criteria conflict:  
  - **False "Same"**: Same features active, but composed into a new algorithm (e.g., identical "refusal" features now trigger on benign inputs).  
  - **False "Different"**: Different features/pathways implement identical algorithms (e.g., two distinct circuits for multiplication).  

  **Core Issue**: Mechanistic sameness is level-relative. Your procedure must operationalize a *pragmatic* definition: "Same mechanism = vetted safety properties still hold."  

