  We have three candidate criteria for "same mechanism":
    1. Shared features (using sparse autoencoder dictionaries): two behaviors are the same mechanism if the same features are active.
    2. Shared causal pathway (using activation patching): if ablating the components that carry behavior A also breaks behavior B, then they share a mechanism.
    3. Shared algorithm: two behaviors are the same if they compute the same input-to-output transformation, regardless of how they are implemented.

  Additionally, we might consider:
    4. Shared weights: if the same weights (neurons, layers) are critical for both behaviors, then same mechanism. But note that shared features and shared causal pathway are already checking for activation and causal dependence on specific components.

