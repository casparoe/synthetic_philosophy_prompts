prompt: |-
  I've spent the past few weeks writing down my gut verdicts about when it's permissible to do less good than one could, because I've begun to suspect they don't add up to anything coherent, and I'd like help finding the principle behind them if there is one. Here are the cases and my verdicts. A soldier who throws himself on a grenade to shield five squadmates is a hero, and it seems to me that a soldier who could have done the same but didn't has done nothing wrong — shaken, maybe, but not blameworthy. A passerby who can save a drowning child in a shallow pond only by ruining a two-hundred-dollar pair of boots must wade in; walking past is straightforwardly wrong (this is the case philosophers associate with Singer's paper on famine and affluence, though I care about my reaction to it, not his). Donating a kidney to a stranger is admirable but not required, and I wouldn't blame someone for declining, even though I'd blame the pond-walker. Someone who breaks a promise to help a friend move house because a once-in-a-lifetime concert came up did something wrong, even though the cost of keeping the promise — missing the concert — seems to me smaller in every relevant way than the cost of the kidney donation I just said nobody owes. Giving ten percent of one's income to effective charities is going beyond duty; giving nothing while taking holidays abroad is mildly wrong, but far less wrong than the pond, even though the good forgone is comparable. And a lifeguard on duty must attempt a rescue even at serious risk to herself, while an off-duty swimmer who attempts the same rescue at the same risk is a hero, not a duty-bearer. The case I keep going back and forth on is bone-marrow donation to a stranger: months of pain and recovery for a life saved.

  I have a half-principle of my own that I'd like tested and, if possible, repaired: an act is required when its cost to the agent is small relative to the good done, and supererogatory when the cost is large but the act is still the best available. The trouble is that "small relative to" does no work until someone says where the line is, and my pond verdict and my marrow-adjacent verdicts seem to place the line in roughly the same place and on opposite sides of it. So I'd like one principle, or a small shortlist of candidates, stated precisely enough to decide cases: each clause should be motivated by one of my cases, and you should tell me what it predicts on cases I haven't listed — for example, an off-duty surgeon who could rush to the hospital at the cost of her child's birthday; a grenade case where the sacrifice is certain death rather than probable death; whether "wrong not to" comes in degrees, as my pond-versus-holidays verdict seems to demand; and whether my role contrast (lifeguard on duty vs. off) should be built into the principle or explained away. I'd also like an honest statement of which of my verdicts no clean principle can accommodate, and whether saving them all would cost more in complexity than the verdicts are worth — I'm prepared to be told that the promise-versus-kidney pair, or the ten-percent one, has to go.

  One request about how the answer should be framed: please keep separate what is settled among people who know this literature from what is genuinely contested, and don't present a contested position as if it were consensus. My understanding is that it's contested whether supererogation is even coherent — whether "the best act is always at least as good as its alternatives" is compatible with "the best act is sometimes not required" — and I'd want to know where that debate actually stands rather than being handed one side of it. If parts of my question presuppose an answer to something philosophers haven't settled (say, whether duty is a threshold or a gradient, or whether role-based obligations are a genuine kind rather than a convenient labeling), flag that rather than folding it silently into the principle. And where you have to choose between frameworks because the data underdetermine the choice, say so plainly rather than picking one and presenting it as the obvious reading.
reasoning: |-
  Okay, let's tackle this user's query. They've spent weeks documenting their intuitive judgments on moral obligations and supererogation, and they're struggling to find a coherent principle behind them. The cases they present are varied: the grenade sacrifice, the drowning child, kidney donation, broken promises, charitable giving, and lifeguard duties. Their half-principle about cost relative to good isn't holding up because the line between "small" and "large" costs seems inconsistent, especially when comparing the pond case to bone marrow donation.

  First, I need to unpack each verdict they've listed. The soldier who doesn't jump on the grenade isn't blameworthy, but the passerby who doesn't ruin their boots to save a child is wrong. Kidney donation is supererogatory, but breaking a promise for a concert is wrong even though the cost is lower. Charitable giving at 10% is beyond duty, but not giving anything while vacationing is mildly wrong. The lifeguard on duty must take risks, but an off-duty swimmer doing the same is heroic. 

  The user's core challenge is reconciling these judgments into a unified principle. Their mention of the bone marrow case as a point of indecision suggests that the cost-benefit analysis alone isn't sufficient. They also hint at roles and relationships mattering, like the lifeguard's duty versus a bystander. 

  Looking deeper, the user might be wrestling with the philosophical tension between consequentialism and deontology. They acknowledge Singer's pond analogy but care more about their own reactions. The promise case is particularly telling—why is breaking a promise for a concert wrong when the cost is less than kidney donation? That points to relational duties overriding pure cost-benefit. 

  The literature on supererogation is contested, especially whether it's coherent against maximizing frameworks. The user wants this highlighted, not glossed over. They’re aware of thresholds vs. gradients and role obligations, so any principle must address these explicitly. 

  Possible frameworks to consider: scalar consequentialism with thresholds, agent-centered prerogatives, and role-based obligations. Each could explain some cases but not all. For example, the lifeguard's duty fits role-based obligations, while the soldier case might involve agent-centered options. The pond case could be a low-cost threshold, but bone marrow's high cost places it beyond duty. 

  The promise-kidney discrepancy suggests that relational duties (promises) create stronger obligations than impersonal beneficence (kidney donation). Charitable giving might involve a moderate threshold, where some giving is obligatory but 10% exceeds it. 

  Bone marrow remains tricky. If the cost is high but the good is significant, why isn't it obligatory? Maybe the prolonged suffering tips it into supererogatory, whereas the pond is a one-time, low-cost act. 

  The user’s request for predictions on new cases (off-duty surgeon, certain death in grenade) will test any principle. For instance, an off-duty surgeon might have a role-derived duty, but less so than a lifeguard. Certain death might make the grenade sacrifice supererogatory rather than expected. 

  Honestly, the promise case and charitable giving might need re-evaluation. If keeping promises is a strict duty, then even moderate costs could be obligatory, whereas charity might allow more flexibility. But if the user holds firm, the principle must accommodate that, perhaps via multiple factors. 

  In the end, a pluralistic approach combining cost thresholds, relational duties, and roles seems necessary. It's messy, but their verdicts demand it. Flagging where philosophy is unsettled, like the coherence of supererogation, is crucial. The user values transparency over tidy solutions.
answer: |-
  Based on your carefully documented verdicts and the constraints you've set, here's an analysis aiming for a coherent principle (or shortlist) that respects your intuitions, highlights philosophical debates, and honestly flags trade-offs:

  **Core Challenge:** Your cases resist a *single* factor (like cost/benefit ratio or agent-relative constraints). They demand a **pluralistic principle incorporating several factors**, with thresholds that shift based on context.

  **Proposed Principle (Pluralistic Threshold Framework):**

  An act is **morally required** if and only if:
  1.  **The net good achievable is significant.**
  2.  **The net cost to the agent is *low* relative to their capacity and circumstances.** ("Low" is context-dependent).
  3.  **AND** the agent has a **specific role-based duty** relevant to the situation, **OR** the act fulfills a **specific prior commitment** (promise, relationship), **OR** the cost primarily involves **non-core personal resources** (like money or replaceable possessions) rather than fundamental bodily integrity or life-altering sacrifice.

  An act is **supererogatory** if:
  1.  The net good achievable is significant.
  2.  The net cost to the agent is *high* relative to their capacity and circumstances ("High" is context-dependent).
  3.  **AND** no specific role-duty or prior commitment compels it, **AND** the cost involves fundamental bodily integrity, profound life-altering sacrifice, or extreme risk.

  "Wrongness" admits of **degrees**, determined primarily by:
  *   The magnitude of the *net good forgone*.
  *   The *lowness of the cost* the agent failed to bear (lower cost makes omission worse).
  *   The *strength of any applicable role-duty or commitment*.

  **Applying the Principle to Your Cases & Motivating Clauses:**

  1.  **Soldier & Grenade (Probable Death):**
      *   **Verdict:** Not required (heroic if done), not blameworthy if omitted.
      *   **Application:** Net good (saving 5 lives) is **significant (Clause 1)**. Cost (probable death) is **high (Clause 2)**. While arguably a role-duty exists broadly (protect comrades), the *extreme cost* pushes specific sacrificial acts beyond requirement. *Motivates the "high cost" threshold and that role-duties have limits.*
      *   **Prediction (Certain Death Grenade):** Even *less* required, more clearly supererogatory. The higher cost reinforces the threshold.

  2.  **Shallow Pond (Ruined Boots):**
      *   **Verdict:** Required. Wrong to omit.
      *   **Application:** Net good (saving a life) is **significant (Clause 1)**. Cost (ruined $200 boots) is **low (Clause 2)** for most in a position to have such boots. No specific role-duty applies. Cost involves **non-core resources (money/possessions) (Clause 3)**. *Motivates the "low cost" threshold and inclusion of non-core resources.*

  3.  **Kidney Donation to Stranger:**
      *   **Verdict:** Not required (admirable), not blameworthy to omit.
      *   **Application:** Net good (saving a life) is **significant (Clause 1)**. Cost (surgery, recovery, lifelong impact) is **high (Clause 2)**. No specific role-duty or commitment exists. Cost involves **fundamental bodily integrity (Clause 3)**. *Motivates the "high cost" threshold, bodily integrity exclusion, and lack of specific commitment.*

  4.  **Broken Promise (Concert vs. Moving):**
      *   **Verdict:** Wrong to break promise (omit helping).
      *   **Application:** Net good (helping friend avoid significant hassle/stress) is **moderate/significant (Clause 1)**. Cost (missing concert) is **moderate/low (Clause 2)**. Crucially, there is a **specific prior commitment (the promise) (Clause 3)**. This commitment creates a requirement *despite* the cost being arguably lower than kidney donation *because* it overrides the "high bodily cost" factor. *Motivates the critical role of **specific prior commitments** as a distinct factor creating obligation even with moderate costs.*

  5.  **Charity (10% vs. Nothing & Holidays):**
      *   **Verdict:** 10% supererogatory; Giving nothing while holidaying mildly wrong.
      *   **Application:**
          *   *10%:* Net good (multiple lives saved) **significant (Clause 1)**. Cost (10% income) is **moderate/high (Clause 2)** for most, involves **non-core resources (money) (Clause 3)**, but no *specific* commitment/role compels *this level*. Thus supererogatory.
          *   *Giving Nothing:* Net good forgone **significant (Clause 1)**. Cost of giving *something* (e.g., 1-5%) is **very low (Clause 2)** for someone able to holiday abroad. No specific commitment, but cost involves only **non-core resources (Clause 3)**. Failing to bear this *very low* cost for *significant* good is **mildly wrong** (degree based on cost/good magnitude). *Motivates **graded wrongness** based on cost/good ratio for non-core resource cases without specific commitments.*

  6.  **Lifeguard (On-Duty vs. Off-Duty Swimmer):**
      *   **Verdict:** On-duty required (even at risk); Off-duty heroic (not required).
      *   **Application:**
          *   *On-Duty:* Net good (saving life) **significant (Clause 1)**. Cost (serious risk) is **high (Clause 2)**, BUT a **specific role-based duty (Clause 3)** explicitly includes accepting this risk. The role-duty overrides the high cost factor *within reasonable limits*. *Motivates **role-based duties** as a distinct, obligation-creating factor.*
          *   *Off-Duty Swimmer:* Net good **significant (Clause 1)**. Cost (serious risk) **high (Clause 2)**. No **role-duty or specific commitment (Clause 3)** applies. Therefore supererogatory. *Reinforces role-duty as key.*

  7.  **Bone Marrow Donation (Months of Pain):**
      *   **Your Verdict:** Unsettled. Principle Prediction: **Supererogatory, not required.**
      *   **Application:** Net good (saving life) **significant (Clause 1)**. Cost (months of pain/recovery) is **high (Clause 2)** – significant disruption and suffering. No **specific role-duty or commitment (Clause 3)**. Cost involves **bodily integrity and profound temporary sacrifice (Clause 3)**. Aligns structurally with Kidney Donation. *Highlights the "high cost" + "bodily/significant life cost" threshold.*

  **Testing on New Cases:**

  1.  **Off-Duty Surgeon (Child's Birthday vs. Rush to Hospital):**
      *   **Prediction:** *Not required*, likely supererogatory if she goes. **Why?** Net good (saving life(s)) **significant (Clause 1)**. Cost (missing child's birthday) is **moderate/high (Clause 2)** (significant relational/emotional cost). While she has medical *expertise*, she is **off-duty (no specific role-duty applies) (Clause 3)**. No **specific commitment** is broken by not going (unlike the promise case). The cost involves **core personal/relational goods**, not just money. *Contrast with Lifeguard: The lifeguard role explicitly defines on-duty responsibility; "surgeon" is a profession, not usually an on-call 24/7 emergency role without specific assignment.*

  2.  **"Wrong not to" Comes in Degrees?**
      *   **Prediction:** **Yes, explicitly built in.** Wrongness increases with the magnitude of the net good forgone and decreases with the height of the cost the agent *should* have borne (itself determined by the factors above). The Pond Omission (very low cost, very significant good forgone) is **highly wrong**. Charity omission by affluent holiday-goer (low cost, significant good forgone) is **mildly wrong**. Failing to jump on a grenade (extreme cost, significant good) is **not wrong**.

  **Handling Contested Issues & Trade-offs:**

  1.  **Supererogation Coherence:** This is **highly contested**. Your principle assumes it *is* coherent ("best act not always required"). The opposing view (often maximizing consequentialism) argues that if an act produces the best outcome, it *must* be obligatory; anything less is wrong. There's no consensus. Defenders of supererogation (e.g., David Heyd, J.O. Urmson) argue that morality includes "options" permitting agents to sometimes prioritize their own interests. **Your verdicts (soldier, kidney) strongly presuppose the coherence of supererogation.** A principle denying it would force you to abandon those verdicts.
  2.  **Duty: Threshold vs. Gradient:** Your principle uses **thresholds for requirement** (low cost + other factors) but **gradients for wrongness**. This is a common hybrid approach reflecting intuitions like yours. Some philosophers (e.g., scalar consequentialists like Shelly Kagan *in some writings*) argue obligation itself is scalar – an act can be "more obligatory" than another. Others insist obligation is binary (required/not). **Your data underdetermines this.** The hybrid model fits your "degrees of wrongness" demand best.
  3.  **Role-Based Obligations:** Your principle treats them as **genuine and distinct**. Some reductionists argue they are just shorthand for complex webs of promises/expectations/consequences. Your Lifeguard case strongly motivates treating them as irreducible *for you* – the difference in obligation based purely on role assignment is stark and central to your intuition.
  4.  **Trade-offs & Potential Verdicts to Revisit:**
      *   **The Promise vs. Kidney Pair:** This is the **hardest tension**. Your principle resolves it by making **specific prior commitments** a powerful obligation-generating factor *independent* of the cost/benefit ratio being more favorable than in the kidney case. This is plausible but requires accepting that promises create "moral magic" – a special force not reducible to impersonal good. If you find this ad hoc, you might need to either soften your verdict on the promise-breaker (mildly wrong, not straightforwardly wrong) or harden your verdict on kidney donation (mildly wrong not to donate?).
      *   **Charity (10% vs. Nothing):** The principle accommodates this well with graded wrongness based on cost/good for non-core resources. The "mildly wrong" verdict for giving nothing while holidaying is preserved by the *very low* cost of giving *something* compared to the significant good. The 10% level is supererogatory due to the moderate/high cost.
      *   **Complexity Cost:** The principle is necessarily complex (3 main factors + thresholds + gradients) to capture your diverse intuitions. Simpler principles (e.g., pure cost/benefit ratio, or "only specific commitments matter") would force abandoning multiple core verdicts (e.g., pond, soldier, lifeguard distinction). This complexity seems warranted by the data you provide.

  **Conclusion:** Your intuitions point towards a **pluralistic morality** where obligation arises from the confluence of: 1) **Significant Good**, 2) **Bearable Cost** (contextually defined), and 3) **Specific Grounds** (Role-Duty / Prior Commitment / Non-Core Resources). Supererogation occurs when significant good exists, but the cost is high and no specific ground compels bearing it, especially when bodily integrity or profound sacrifice is involved. Wrongness is graded, primarily based on the cost that *should* have been borne relative to the good at stake. This framework saves most of your verdicts, predicts reasonably on new cases, and flags the contested reliance on the coherence of supererogation and the irreducible nature of role-duties and promises. The main tension lies in the unique moral force you assign to promises compared to impersonal beneficence.
