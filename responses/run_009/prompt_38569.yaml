answer: |-
  ## Exam Question: Keynes's "Economic Possibilities for our Grandchildren" (120-180 words)

  "Keynes predicted that rising productivity would lead to a dramatic fall in working hours, freeing humanity for the 'arts of life'. Actual productivity growth roughly matched his expectations, yet average working hours in affluent societies remain significantly higher than his prediction. Drawing explicitly on Keynes's distinction between 'absolute' and 'relative' needs, explain why this outcome occurred. Does this failure primarily invalidate his *prediction* about human behavior, his *ethical ideal* of the good life (valuing non-material pursuits over wealth accumulation), or both? Crucially, if the drive for relative status is insatiable, does this mean individuals can realistically adopt Keynes's ethic *unilaterally*? Or does achieving this 'good life' fundamentally depend on a shift in *social norms and coordination*? Support your argument with reasoning from the essay."

  ---

  ## Model Answer (Approx. 700 words)

  Keynes's famous prediction of drastically reduced working hours rested on a crucial, and flawed, assumption: that human needs are primarily *absolute* and satiable. He argued that once basic necessities (food, shelter, security) were met – a point he believed rising productivity would soon reach – the fundamental "economic problem" would be solved. People would rationally choose more leisure to pursue higher pleasures (arts, relationships, knowledge), as per his G.E. Moore-influenced ethic valuing "the good life" over mere accumulation. The persistence of long working hours despite soaring productivity proves this assumption wrong, but it primarily invalidates the *mechanism* of his prediction, not necessarily the entire ethical vision.

  The core failure lies in Keynes underestimating the power and insatiability of *relative* needs – the desire for status, positional goods, and superiority over others. As productivity increased, it didn't simply satisfy absolute needs and trigger leisure; it simultaneously amplified the scope and intensity of relative competition. New goods and services emerged, advertising stoked desires, and social norms equated consumption with success. Crucially, pursuing relative status is a zero-sum game; my gain is often your loss. This creates a collective action trap. Even if an individual recognizes Keynes's ethic as superior (valuing poetry over profit), acting on it unilaterally carries significant social costs: falling behind peers, losing status, potentially facing real economic disadvantage in a society structured around competitive consumption. The perceived risk of defecting from the "work-and-spend" norm is high.

  This outcome directly wounds the *prediction* because its mechanism (satisfaction of absolute needs leading naturally to reduced work) was undermined by the dominance of relative needs. However, it does not automatically invalidate the *ethic* itself. Keynes's critique of the "love of money" as a "somewhat disgusting morbidity" and his vision of a life centered on intrinsic goods retain philosophical force. The problem isn't that the ethic is wrong *in principle*; it's that it's extraordinarily difficult, perhaps impossible, to live by it *consistently* as an isolated individual within a society intensely focused on relative standing. Choosing significant leisure unilaterally often means opting out of the status game, which can feel like social marginalization or economic suicide.

  Therefore, the combination of high productivity and stagnant hours reveals not that Keynes was simply wrong about human laziness or greed, but that he underestimated the structural power of *social comparison* and the *collective action problem* inherent in shifting norms. The data shows that material progress alone, without a concurrent shift in social values and institutions, is insufficient to trigger the reduction in working hours he envisioned. Relative needs hijack productivity gains, fueling an endless cycle of work-and-spend.

  The implication is profound: Keynes's *ethical ideal* of the good life likely cannot be achieved merely through individual enlightenment or personal resolutions to work less. Its realization depends critically on achieving a *new social equilibrium*. This requires widespread cultural change – de-emphasizing consumption as a status marker, valuing leisure and non-market activities differently – potentially supported by institutional shifts (e.g., policies promoting shorter working weeks, stronger social safety nets reducing fear, education emphasizing non-material values). Only when enough individuals coordinate, explicitly or implicitly, to shift the norms and lower the social cost of choosing leisure, can Keynes's vision escape the collective action trap. The failure is not of the destination (the good life), but of the predicted path (automatic individual choice post-scarcity) and the mechanism (ignoring the binding constraint of relative competition). The ethic survives but demands a social, not just individual, revolution.

  ---

  ## Marking Scheme (25 Marks Total)

  1.  **Articulating the Prediction & Data Contradiction:** (4 Marks)
      *   Clearly states Keynes's prediction of drastically reduced working hours due to productivity gains.
      *   Accurately notes that productivity growth broadly matched expectations while working hours did not fall as predicted.
      *   *Common Fumble:* Only states the prediction failure vaguely, or misrepresents the productivity trend (e.g., saying Keynes was wrong about productivity too).

  2.  **Applying Absolute vs. Relative Needs Distinction:** (6 Marks)
      *   Correctly explains Keynes's concept of absolute (satiable) vs. relative (insatiable) needs.
      *   Explicitly argues that the dominance of insatiable *relative* needs (status, positional goods) explains the persistence of long hours despite high productivity satisfying absolute needs.
      *   *Common Fumble:* Mentions the distinction but doesn't explicitly link the *failure of the prediction* to the *ascendancy of relative needs*. Or conflates relative needs with simple greed/love of money without the social comparison element.

  3.  **Analyzing Impact on Prediction vs. Ethic:** (5 Marks)
      *   Distinguishes between Keynes's predictive claim and his normative ethical vision.
      *   Argues that the outcome primarily invalidates the *prediction's mechanism* (underestimation of relative needs' power), not necessarily the entire *ethic*.
      *   *Common Fumble:* Conflates the prediction and the ethic, assuming the failure of one automatically negates the other. Or fails to make any distinction.

  4.  **Addressing Individual Adoption & Collective Action:** (7 Marks)
      *   Directly tackles whether an individual can realistically adopt Keynes's ethic unilaterally.
      *   Identifies the *collective action problem*: the high social/economic costs (loss of status, relative disadvantage) of choosing significant leisure unilaterally in a status-focused society.
      *   Argues that unilateral adoption is extremely difficult or ineffective due to these social pressures.
      *   *Common Fumble:* Merely states "people like status" without explaining *why* this makes unilateral action costly/ineffective. Or asserts individuals *can* choose it easily, ignoring the social context.

  5.  **Synthesizing the Social Equilibrium Requirement:** (3 Marks)
      *   Concludes that realizing Keynes's ethical vision likely requires a shift in *social norms and coordination* (a new equilibrium), not just individual choices.
      *   Briefly suggests what this might entail (cultural change, potential policy/institutional support).
      *   *Common Fumble:* Ends with the collective action problem but doesn't articulate the *necessity* or *nature* of a social solution. Or proposes only individualistic solutions.

  **A vs. B Distinction:** An **A-grade answer** will not only identify the collective action problem but also explicitly integrate it as the *core reason* why the prediction failed *and* why the ethic is individually unsustainable, leading to a coherent conclusion that the ethic's viability hinges entirely on achieving a new *social equilibrium*. It will clearly articulate the *structural* nature of the barrier. A **B-grade answer** will competently cover the key points (prediction failure, needs distinction, impact on prediction/ethic, difficulty of individual action) and mention the collective action problem, but may treat the social dimension as secondary, less well-integrated, or fail to fully explain *why* unilateral action fails, leaving the solution vague or overly individualistic. The A answer sees the *social coordination* as the indispensable key to unlocking the ethic, not just an obstacle.
