answer: |-
  You've pinpointed the crucial historiographical baggage packed into this metaphor. Let's dissect "revolutions devour their children" specifically regarding the French Revolution:

  **1. The Mapping:**

  *   **The Parent:** The *Revolution itself* as an abstract, quasi-organic entity with its own logic, needs, and trajectory. It's the driving force, the originator.
  *   **The Children:** **Primarily, the *first generation of revolutionary leaders* (often specifically the Feuillants/Girondins)**. These are the figures who initiated and led the early phases (1789-1792), articulated its initial ideals (constitutional monarchy, rights of man), and established its structures. Think Bailly, Lafayette (exiled, not devoured, but symbolically cast out), Barnave, Brissot, Vergniaud, etc. Sometimes, the *moderate phase/constitutional settlement (1789-91) itself* is implicitly seen as the "child" whose ideals are consumed.
  *   **The Appetite/Devouring Mechanism:** This is the most contested and revealing element:
      *   **Revisionist/Furetian View:** The appetite is *ideological radicalization/dynamism inherent in revolutionary political culture itself*. The logic of popular sovereignty, the rejection of compromise, the search for purity, the demonization of opposition, and the internal competition unleashed in 1789 inevitably escalate towards violence and extremism. The "appetite" is the Revolution's own internal logic consuming those who created it but became obstacles to its radical fulfillment.
      *   **Social Interpretation/Contingency View:** The appetite is primarily the *extraordinary pressures of external threat and internal civil war* (War, Invasion, Vendée). The "devouring" is driven by the perceived necessity of national survival – the need for ruthless unity, suppression of dissent (real or imagined), and the centralization of power (Committee of Public Safety). The leaders are consumed less by ideology than by the machinery of war and terror deemed essential to save the Revolution *from* its enemies.

  **2. Where the Mapping Breaks Down:**

  Your instincts are sharp; the breakdown is significant:

  *   **Presupposing a "Natural/Legitimate" Course:** This is the core flaw. The metaphor inherently frames the *early, moderate phase (1789-91)* as the Revolution's "true" or "natural" state – the healthy parent producing healthy children. The radical phase (1792-94) is then framed as an unnatural aberration, a "deviation," or a "betrayal" (as you note your readings suggest). This is profoundly teleological and ahistorical. It judges the later phase against the standard of the earlier one, assuming the early phase *was* sustainable or represented the Revolution's essence, ignoring the deep contradictions, unresolved conflicts, and intense opposition (royalist, foreign, popular) that made the constitutional monarchy unviable. The Revolution didn't have a preordained "natural" course; it was a contingent, dynamic, and violently contested process.
  *   **Internal Focus vs. External/Contingent Pressures:** As you suspect, the metaphor strongly suggests the devouring is an *internal* process – the Revolution turning on *its own* creators due to its inherent nature or logic. This drastically downplays or even erases the overwhelming impact of:
      *   **War:** The declaration of war (April 1792) and the subsequent military disasters radicalized politics, fueled paranoia about traitors, and necessitated emergency measures.
      *   **Invasion:** The Prussian/Austrian advance (Summer 1792) directly led to the fall of the monarchy and the September Massacres.
        **The Vendée:** The massive, brutal royalist/counter-revolutionary uprising (Spring 1793) was a genuine existential threat that demanded a massive military response and fueled terror against perceived internal enemies.
      *   **Economic Crisis:** Hyperinflation and food shortages fueled popular unrest (sections, Enragés) pushing for more radical economic controls and terror against "hoarders" and "speculators."
      The metaphor frames the killing as fratricide, obscuring that much of the "devouring" was driven by a (brutal, excessive, but contextually understandable) response to *external* survival pressures. Robespierre didn't just wake up hungry for Danton; the context of war, conspiracy fears, and the need for unity in crisis was paramount.

  **3. Does the Adage Support the "Pathology" Conclusion?**

  *   **The Short Answer: No, not neutrally. The metaphor *creates* and *imposes* the pathology interpretation.** It doesn't logically support it; it embodies it.
  *   **The Explanation:** The very structure of the metaphor – a parent *devouring* its children – is inherently pathological. It frames the Terror not as a possible (even if horrific) phase *within* the revolutionary process, driven by specific historical circumstances (war, counter-revolution, economic collapse, political struggle), but as an act of monstrous, unnatural self-destruction inherent to the Revolution *itself*.
      *   The phrase "devours" implies consumption driven by an insatiable, irrational hunger, not rational (even if brutal) political calculation or desperate reaction to crisis.
      *   By casting the early leaders as "children," it infantilizes them, suggesting they were naive creators of a force beyond their control, rather than active participants who navigated (and sometimes fueled) the escalating chaos.
      *   The metaphor **carries the interpretation all along.** It smuggles in the conclusion that the radical phase was a *deviation from* the revolution's true nature (embodied in 1789-91) rather than a *product of* the revolution's dynamics unfolding under extreme duress. It predisposes the listener/reader to see 1793-94 as an aberration, a disease, a tragic fall from grace, rather than as a brutal, contingent, but arguably *continuous* development of the revolutionary logic and conflicts initiated in 1789, shaped overwhelmingly by the fight for survival.

  **Conclusion:**

  Your audit is spot-on. The "revolutions devour their children" metaphor is not a neutral descriptor of the fate of the Girondins; it's a powerful, value-laden *interpretive framework*. It:

  1.  **Essentializes the Revolution** as a single, hungry entity.
  2.  **Sanctifies the Moderate Phase** (1789-91) as the "true" revolution.
  3.  **Pathologizes the Radical Phase** (1792-94), framing it as an unnatural internal spasm of self-destruction.
  4.  **Marginalizes External Contingency** by focusing on internal consumption, downplaying war, invasion, and counter-revolution.
  5.  **Serves the Revisionist Narrative** by perfectly encapsulating Furet's view of the Terror as the logical outcome of 1789's ideological ruptures, rather than a response to circumstance.

  The metaphor doesn't just *describe* the fate of certain leaders; it actively *shapes* how we understand the relationship between 1789 and 1793, implicitly arguing for discontinuity and pathology. Recognizing this allows you to see how its frequent deployment in your seminar does indeed perform "quiet historiographical work" favoring the revisionist perspective.
