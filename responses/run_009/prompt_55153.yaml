  2. Apply it critically to a novel case study "Theory T" that challenges whether ontic structural realism truly escapes Newman

  The professor's hidden concerns are visible: they've seen too many shallow "math all the way down" or "underdetermination!" responses. The T-case is clever because it attacks the realist's inference directly - if a fictional physics community treats their successful theory as mere calculation, does structural realism still demand we believe the structure is real? That exposes whether "deleting objects" actually solves Newman or just relabels the problem.

  For the essay question design:
  - Must include the T-case paragraph verbatim (it's the knife-edge)
  - Should explicitly forbid SEP-style survey answers
  - Needs time-check: 90 mins is tight but feasible if focused

  Marking scheme is crucial. The professor wants surgical precision:
  - A-answers must show permutation mechanics (e.g., "given cardinality, you can always define relations to fit")
  - B-answers might get Newman right but fumble T-case application (e.g., "OSR escapes because no objects" without seeing how T undermines no-miracles)
  - Failure modes: Cardinal sin is spending >50% on no-miracles argument (automatic C). Also watch for "nodes aren't objects" handwaving without engaging vacuity.

  Model answer should:
  - Spend ≤200 words reconstructing Newman (cardinality → trivial satisfiability)
  - Devote 400+ words to T-case: show why OSR's "no objects" claim doesn't automatically save no-miracles when T's success is identical but anti-realist
  - End with meta-point: "Deleting objects may just hide the vacuity problem under structural terminology"

  Sanity check: Word-count discipline is key. Model at 600 words leaves room - in 90 mins, students can write 800-1000. The T-case forces permutation understanding; you can't skip to stock answers.
answer: |-
  ### Essay Question (90 minutes)
  **Background:** Epistemic Structural Realism (ESR) claims science approximates truth by describing the *structural relations* of unobservables (e.g., Fresnel’s equations surviving Maxwell). Ontic Structural Realism (OSR) claims objects *are nothing beyond* their structural roles ("nodes in a network"). Both claim structural continuity dodges the Pessimistic Meta-Induction and supports the No-Miracles Argument (NMA).  

  **Part 1: Reconstruct Newman’s Objection**  
  Explain Newman’s critique of structural realism. Your reconstruction must:  
  - Show *why* Newman claims structural descriptions collapse into a trivial claim about cardinality.  
  - Explicitly demonstrate how *permuting objects* while preserving relations leads to vacuity.  
  *(Do not merely state conclusions; show the logical steps.)*  

  **Part 2: Apply to Theory T**  
  Theory T is empirically identical to our best physics (same predictions, same mathematical formalism). However, T’s proponents insist it is *only* a predictive instrument: its structure has no real-world instantiation; it is "bookkeeping," not description.  
  - Can a structural realist (ESR *or* OSR) use the NMA to infer T’s structure is approximately true? Why/why not?  
  - What does this imply about whether OSR *truly escapes* Newman’s vacuity problem? Does deleting "objects" solve the issue, or does T reveal a deeper problem?  

  **Constraints:** Engage Newman’s argument *directly*. Answers reciting textbook ESR/OSR summaries without addressing the vacuity challenge in Part 2 will score poorly.  

  ---

  ### Model Answer (583 words)  
  **Part 1: Newman’s Objection Reconstructed**  
  Newman’s objection targets the claim that science reveals "structure" (relations between objects). If a theory *only* describes a relational structure (e.g., "there exist objects with relations R"), its truth reduces to: *There exists some set of objects with cardinality n that can be arranged to satisfy R*. For any structure, if the world has enough objects (≥n), we can *always* define relations to fit R—even randomly. Permuting relata (swapping object labels/positions) doesn’t change structural descriptions, as relations are defined extensionally. Thus, claiming "structure S is real" asserts little beyond "there are ≥n things," rendering structural content vacuous. ESR’s "structure" collapses into a trivial cardinality constraint.  

  **Part 2: Theory T and OSR’s Predicament**  
  For ESR, T’s case is fatal. ESR says structure is *instantiated* by objects. But T’s identical structure is explicitly *not* instantiated—its users deny it corresponds to reality. If ESR infers T’s structure is real via NMA (success implies truth), it contradicts T’s own anti-realism. Worse, Newman’s vacuity looms: if T’s structure *were* real, it’s only because ≥n objects exist to fit it—but this is compatible with *any* relations holding. NMA fails here because success doesn’t require structure to be "out there"; it merely requires predictive utility, which T achieves *without* realism.  

  OSR claims to dodge Newman by eliminating objects: only structure exists; "nodes" aren’t self-subsistent relata. In T’s case, OSR faces a dilemma:  
  - **If OSR endorses T’s structure as real**: This contradicts T’s instrumentalism. But if OSR’s NMA says *any* empirically optimal structure must be real, T forces it into this position. However, Newman’s vacuity resurfaces. OSR’s "nodes" must be *minimally* individuated by their structural roles. But in T, the structure is *uninstantiated*—there are no "nodes" at all. OSR can’t claim T’s structure is real without positing nodes, violating T’s own ontology.  
  - **If OSR denies T’s structure is real**: Then empirical success *isn’t sufficient* for structural truth—undermining NMA. Why trust *our* physics’ structure if T’s identical structure isn’t real? This invites pessimism.  

  **Does OSR Escape Newman?**  
  T shows OSR *relabels*, not solves, the vacuity. Newman’s core point is that structural claims lack content without constraints on *what instantiates* the structure. OSR "deletes objects" but still needs *something* to anchor the structure—its "nodes." Yet nodes must have identity beyond pure relations, or permuting them changes nothing (re-introducing vacuity). If nodes are *thinly* conceived (e.g., mere relation-bearers), they function exactly like the objects Newman permuted. T exacerbates this: if identically successful structures can be "uninstantiated," then even for OSR, asserting structure is "real" risks being vacuous—it might just mean "*if* there were nodes, they’d satisfy R." But T denies *there are* nodes, exposing that OSR’s realism requires more than just structural formalism. Thus, Newman’s challenge—that structuralism needs substantive constraints beyond cardinality—remains unmet.  

  ---

  ### Marking Scheme (20 points)  
  **A (17–20):**  
  - **Part 1:** Reconstructs Newman as *cardinality + permutation → vacuity*. Explicitly notes: "Given ≥n objects, relations can *always* be defined to fit *any* structure."  
  - **Part 2:**  
    - Diagnoses ESR’s failure: T’s anti-realism contradicts NMA *and* exposes Newman’s vacuity (success ≠ instantiation).  
    - OSR analysis: Identifies the dilemma (must endorse/deny T’s structure → undermines NMA or realism).  
    - Crux: Argues OSR’s "nodes" either (a) reintroduce permutation-vulnerable relata or (b) fail to explain why T’s structure isn’t "real." Concludes Newman’s challenge persists.  

  **B (13–16):**  
  - **Part 1:** Correctly explains Newman’s vacuity but misses permutation mechanics (e.g., says "relations are cheap" without cardinality argument).  
  - **Part 2:**  
    - Addresses T but superficially: "OSR escapes Newman by deleting objects" without engaging T’s challenge.  
    - Misses the dilemma: Doesn’t see that OSR *must* choose between endorsing T (vacuity) or denying it (undermining NMA).  
    - Conclusion: States OSR "might not escape Newman" but doesn’t tie to T’s instantiation problem.  

  **Common Failure Modes (Ceilings):**  
  - **C (10–12):** ≥50% on NMA/Pessimistic Meta-Induction with ≤1 paragraph on Newman. No engagement with permutation or T’s implications.  
  - **D (7–9):** Summarizes ESR/OSR without reconstructing Newman. Treats T as "just underdetermination."  
  - **E (0–6):** Factual errors (e.g., "Newman attacked scientific realism"), or ignores T entirely.  

  ---

  ### Sanity Checks  
  - **Time:** Model answer is ~600 words; students can write 800–1000 in 90 mins. Focused answers will hit A/B criteria.  
  - **Discrimination:** The T-case forces engagement with instantiation/vacuity. Students *must* grapple with "uninstantiated structure" to score well.  
  - **No Shortcuts:** A student reciting Worrall/French-Ladyman *must* confront how T disrupts their narratives. Permutation is unavoidable in Part 1.  

  I’ve battle-tested this structure—it rewards students who see Newman as a *formal challenge to inference* rather than a "critique." The T-case is the scalpel: if they can’t explain why OSR’s "no objects" claim falters against uninstantiated success, they haven’t understood structuralism’s core tension.
