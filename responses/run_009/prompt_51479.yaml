answer: |-
  Your diagnosis of the Moore's Paradox impasse is astute, touching on core philosophical tensions. The disagreement is **substantive and deep-rooted**, not merely verbal or a case of explaining different phenomena under one name. While differing *explananda* contribute to the stalemate, the camps genuinely clash over the *mechanism* generating the core absurdity and the *priority* of explanation. Here's a breakdown:

  **1. Beyond Differing *Explananda*: The Substantive Clash**  
     - **The Pragmatic Camp** (e.g., DeRose, Williams, Green) focuses on *assertion norms*:  
       - **Core Mechanism:** Asserting *p* constitutively expresses the speaker's belief that *p* (via Gricean norms, sincerity conditions, or constitutive rules).  
       - **Absurdity Source:** Asserting "p & ~Bp" generates a pragmatic contradiction: by asserting *p*, you express belief in *p*, yet you simultaneously assert ~Bp.  
       - **Data Scope:** Primarily targets the *utterance's* absurdity. Belief in the conjunction is possible but irrational or self-undermining when asserted.  

     - **The Doxastic Camp** (e.g., Shoemaker, Moran, Fernández) focuses on *belief's nature*:  
       - **Core Mechanism:** First-person present-tense belief is "transparent" (Moran) or "strongly self-intimating" (Shoemaker)—to sincerely judge *p* is to believe *p*.  
       - **Absurdity Source:** "p & ~Bp" is *incoherent for the believer*. You cannot *judge* the conjunction true because judging *p* entails Bp, contradicting ~Bp.  
       - **Data Scope:** Targets the *impossibility of coherently believing* the conjunction. Assertion absurdity derives from this doxastic incoherence.  

     **The Clash:** Pragmatists argue the doxastic view overreaches (belief in "p & ~Bp" *is* psychologically possible, even if irrational). Doxastic theorists counter that pragmatics alone cannot explain why *thinking* (not just asserting) the conjunction feels "mad" (Wittgenstein). **This is not just about different data—it's about whether assertion norms or belief metaphysics is explanatorily prior.**

  **2. Why Progress Has Stalled: Entrenched Frameworks**  
     - **Incommensurable Foundations:** Pragmatists work within philosophy of language (speech acts, implicature), while doxastic theorists operate in philosophy of mind (self-knowledge, belief's essence). They start from different primitives.  
     - **Counterexample Tennis:**  
       - Pragmatists note that "p & ~Bp" can be *true* (e.g., a delusional speaker) and even *believed* (in non-transparent ways).  
       - Doxastic theorists retort that non-assertoric uses (e.g., writing in a diary) still feel absurd and that third-person cases lack the *first-person present* tension.  
     - **Blindspots as a Distraction:** Sorensen's generalization (e.g., "Nobody knows that *p*" uttered when *p* is true) shows Moorean absurdity isn't unique to belief. Pragmatists embrace this; doxastic theorists see it as diluting the core insight into first-person doxastic avowal.  

  **3. Disputed Cases Reveal the Fault Lines**  
     - **Omissive vs. Commissive ("p & B~p"):**  
       - *Pragmatists* treat both similarly: asserting either generates a performative contradiction.  
       - *Doxastic theorists* often see commissive as deeper: "p & B~p" implies a *direct* conflict in the mind (believing *p* and ~p), whereas omissive involves an absence.  
     - **Conditionalized ("If p, ~Bp"):**  
       - Both camps struggle. Pragmatists note it's assertable in limited contexts (e.g., admitting fallibility). Doxastic theorists see it as less "mad" because it doesn't *affirm* *p*.  
     - **Third-Person/Past-Tense:**  
       - *Pragmatists* explain its felicity via lack of assertion-induced self-expression.  
       - *Doxastic theorists* appeal to the absence of first-person present transparency.  

  **4. What Would Count as Progress?**  
     - **Integration, Not Victory:** A successful account must explain:  
       (a) Why asserting "p & ~Bp" is absurd,  
       (b) Why believing it feels impossible/irrational,  
       (c) Why third-person cases are fine,  
       (d) The omissive/commissive asymmetry.  
       *Neither camp adequately covers all four alone.*  
     - **Forced Common Ground:** The **commissive form ("p & B~p")** is a key battleground. If pragmatists can explain its *enhanced* absurdity without doxastic metaphysics, they gain ground. If doxastic theorists show commissive belief is *strictly impossible* (not just irrational), they win.  
     - **New Frontiers:**  
       - **Experimental Philosophy:** Testing if ordinary speakers perceive Moorean conjunctions as *unbelievable* or merely *unsayable*.  
       - **Cognitive Science:** Investigating if self-ascribing belief activates neural pathways distinct from factual judgment.  
       - **Formal Models:** Using dynamic epistemic logic to model belief revision when encountering Moorean propositions.  

  **5. Pushing Back: Your Frame is Sound but Incomplete**  
     - **Missing Hybrids:** Your two-camp framing overlooks synthesizers like **Heal** (linking belief to commitment in rational agency) or **Shoemaker** (whose later work incorporates pragmatic elements).  
     - **Explananda Are Intertwined:** The "felt absurdity" of assertion *presupposes* something about the difficulty of entertaining the content. A pure pragmatics risks being shallow; pure doxastics risks being disconnected from linguistic practice.  
     - **The Wittgensteinian Elephant:** Wittgenstein saw the paradox as revealing grammar's limits—neither "pragmatic" nor "doxastic" in modern terms. Resisting systematization might be part of the impasse.  

  **Conclusion: A Substantive Stalemate Requiring New Tools**  
  The dispute is genuine: it concerns whether Moore's Paradox reveals a truth about *mind* or about *language*. Progress demands either a persuasive reduction of one domain to the other (e.g., showing belief norms derive from assertion norms, or vice versa) or a new framework that transcends the divide—perhaps one grounded in **embodied cognition** (belief/assertion as complementary social actions) or **expressivist semantics** (treating avowals as non-descriptive). Until then, the camps will remain at an impasse, each capturing facets of the paradox but unable to fully absorb the other's insights. The conditionalized and commissive cases remain the most promising pressure points for breaking the deadlock.
