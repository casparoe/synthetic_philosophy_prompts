   1. Parfit-style reductionism: Persons exist but are not a "further fact" over and above physical and mental events. Personal identity is a matter of psychological continuity and connectedness.
   2. Hard eliminativism: There is literally no self to be found. The self is a complete illusion, and we should not even speak of persons as existing in any sense.
   3. Two-truths/conventional self: The self exists conventionally (for everyday purposes) but is empty (lacks inherent existence) under ultimate analysis.
   4. Fiction-theorists: The self is a useful fiction, constructed like a club or a wave, but not a real entity.

   We want 8-10 questions that are concrete cases. We also want to separate the metaphysical thesis from the practical/therapeutic one.

   Possible questions:

   1. Teletransporter: A machine scans your body, destroys it, and creates an exact replica on Mars. Would you be the person on Mars?
      - Reductionist: Yes, because of psychological continuity.
      - Eliminativist: There is no 'you' to be transported. The question is based on a false premise.
      - Conventional: In everyday terms, yes, it's you. But ultimately, no.
      - Fiction: The replica is the same character in the story, but that's a fiction.

   2. Fission: Your brain is split and each half is put into a different body. Both resulting people have your memories and personality. Are you one of them? Both? Neither?
      - Reductionist: Neither, because identity isn't transitive. But you survive as both in the sense of psychological continuity without identity.
      - Eliminativist: There was never a self to begin with, so the question is misguided.
      - Conventional: In conventional terms, we might say you are neither, but each is a new person. Ultimately, no self was divided.
      - Fiction: The story of 'you' branches into two new stories.

   3. Exhaustiveness of the aggregates: If we list all the physical and mental parts (aggregates) of a person, is there anything left over that is the self?
      - Reductionist: No, the person is just the aggregates organized in a certain way (with continuity).
      - Eliminativist: Absolutely not, and even the aggregates are not owned by a self.
      - Conventional: Conventionally, we might say the self is the aggregates, but ultimately there's nothing beyond the aggregates.
      - Fiction: The self is a label we put on the aggregates, but there's nothing beyond.

   4. Attachment to future self: If you truly believe there is no self, should you care less about your future self than your present self?
      - Reductionist: Not necessarily, because psychological continuity still matters and future experiences are connected to present ones.
      - Eliminativist: Yes, because the idea of a future self is an illusion. However, one might still care about future experiences without ownership.
      - Conventional: Conventionally, we care about our future, but ultimately, there is no self to be attached to. The practical effect might be reduced attachment.
      - Fiction: We care about the character in the story, so we care about the future of that character.

   5. Promise to a centipede: Imagine a being that is a swarm of insects (like a centipede) but it behaves as a single agent (talks, makes promises). If the swarm disperses and reassembles, is the reassembled swarm owed the promise?
      - Reductionist: If there is psychological continuity, then yes. But if the swarm is just a collection without psychological continuity, then maybe not.
      - Eliminativist: There is no self in the swarm to be owed anything. Promises are social conventions without a real self.
      - Conventional: Conventionally, we would treat the reassembled swarm as the same if it looks and acts the same. Ultimately, no.
      - Fiction: The swarm is a character in a story, so if the story continues, the promise holds.

   6. Therapeutic effect: If you stop identifying with your thoughts and feelings, does that mean you have realized there is no self?
      - This question is to separate metaphysical and practical. Some might say the therapeutic effect doesn't require a metaphysical view.

   7. Brain transplant: Your brain is put into another body. Is the resulting person you?
      - Reductionist: Yes, because the brain carries psychological continuity.
      - Eliminativist: There is no self to be transplanted. The resulting person is a new collection of processes.
      - Conventional: Conventionally, yes, because we follow the brain. Ultimately, no.
      - Fiction: The character continues in a new body.

   8. Eternal recurrence: Suppose the universe repeats exactly, and in the next cycle there is a person exactly like you in every physical and mental detail. Is that person you?
      - Reductionist: No, because there is no causal connection. But they would be psychologically continuous in a way, so it's a borderline case.
      - Eliminativist: There is no self to recur. The question is meaningless.
      - Conventional: Conventionally, we might say no because it's in the future cycle. Ultimately, no self.
      - Fiction: It's a different instance of the same character, but not the same story.

   9. Responsibility: If there is no self, can we hold people responsible for their actions?
      - Reductionist: Yes, because responsibility is tied to psychological continuity and the capacity for moral agency.
      - Eliminativist: Responsibility is a social construct and doesn't require a self. We can still hold the body-mind complex accountable.
      - Conventional: Conventionally, yes. Ultimately, there is no self to hold responsible, but we do it anyway.
      - Fiction: We hold the character in the story responsible.

   10. Meditation experience: In deep meditation, if you feel that there is no thinker of thoughts, just thoughts arising, does that prove there is no self?
      - This is to separate experience from metaphysics. Some views might take the experience as evidence, others as just a state of mind.

