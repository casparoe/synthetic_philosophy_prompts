prompt: |-
  My population ethics seminar has gotten me and a classmate into a running argument about the Repugnant Conclusion, and I want an outside number on it. Here's the proposition, stated as precisely as I can so it actually has a truth value: for any population A in which everyone has a life of very high quality, there exists some much larger population B, all of whose members have lives that are barely worth living, such that B is better than A (holding fixed everything else — no effects on outsiders, no risk, same duration rules). My classmate says this is just obviously false, and he'd put maybe 0.1 on it; I keep finding myself unable to see how it's false if you add up welfare at all, so I'm at maybe 0.75. Give me your own credence, but the number alone is useless to me — I want the decomposition.

  Here's how I'd break it down, though feel free to tell me my decomposition itself is off: (a) the probability that the total view is right, versus averaging or variable-value views or lexical thresholds where enough welfare at some level can't be traded for any amount at a lower one; (b) the probability that the "barely worth living" lives in the setup are genuinely positive at all — this one worries me, because when I try to picture a life of Parfit's potatoes-and-muzak sort, a life that is one long neutral stretch with the faintest pleasant moments sprinkled in, I genuinely can't tell if I'm judging it as barely positive or as basically empty, and I suspect half the debate is people talking past each other about what "barely worth living" even denotes; (c) how much weight the intuition against the conclusion deserves given that our population intuitions were presumably shaped in tiny ancestral bands where "more people" meant straining a fixed pie, so maybe the intuition is debunkable; (d) whether the conclusion is as repugnant as advertised or whether the horror comes from the framing rather than the content. If you think there are terms I'm missing — e.g., something about the impossibility results showing every theory that dodges this conclusion ends up biting some other bullet — add them with your own probability for each. Then combine, tell me which term the final number is most sensitive to, and tell me where you think the gap between my 0.75 and my classmate's 0.1 most likely lives (I suspect it's term (b), but I'd like your read).

  Please flag how confident you are in each of the component probabilities, and single out the one you're least sure about — I'd rather know where the reasoning is soft than get a confident-looking number. And end the whole thing with the final credence in machine-readable form on the very last line, like \answer{0.43} (or whatever you actually get to), so I can log it alongside ours. No need for sources or a reading list — I've got the seminar for that, I just want the reasoning laid bare.
