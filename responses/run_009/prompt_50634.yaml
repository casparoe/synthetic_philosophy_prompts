  On the "no" branch, I'll ask whether market rates should apply to social welfare - this isolates the instrumentalist view. Then a question about extinction risk handles the "only discount for existence uncertainty" position. 

  Noticing a potential blind spot: Questions about economic growth might not distinguish between discounting richer future people's utility versus discounting their wellbeing itself. The user explicitly wants this acknowledged, so I'll add a disclaimer box. 

  For leaf positions: Presentism goes under "no" at Q1 since it denies future people's claims. The awkward commitments are crucial - e.g., for exponential discounters, admitting they value identical harms less if they occur later. 

  Unoccupied combinations: The tree reveals a gap where someone might reject pure time preference but still see far future as qualitatively different. This seems unexplored rather than incoherent - worth flagging as the user requested. 

  Keeping it to two pages means ruthless simplification. Using indented formatting with clear branch points, and avoiding jargon where possible. The "key notes" section will handle disclaimers about blurred distinctions and growth-related ambiguities.
answer: |-
  Here is a decision tree for your interdisciplinary seminar handout, designed for clarity on core distinctions and fitting two pages:

  **Decision Tree: Weighing Future Welfare (Start: Future Welfare Counts!)**

  1.  **Q1: Is the mere fact that a benefit occurs *later in time* a reason to discount its moral weight (Pure Time Discounting)?**
      *   **A: Yes** → Go to Q2
      *   **A: No** → Go to Q3

  2.  **Q2: Should this discounting apply equally to *all* future periods (e.g., next year vs. next century)?**
      *   **A: Yes, equally (Constant Impatience)** → **Position: Exponential Discounter (Pure Time Preference)**
          *   *Awkward Commitment:* Values identical harms/benefits less if they occur later, even with certainty and no growth.
      *   **A: No, discounting weakens or changes over long horizons** → **Position: Presentist (or Strong Temporal Chauvinism)**
          *   *Awkward Commitment:* Effectively denies that people in the sufficiently far future (or perhaps any future) have significant moral standing *now*; future welfare claims fade drastically or vanish over time.

  3.  **Q3: Should the social discount rate be set primarily by opportunity costs observable in *current financial markets*?**
      *   **A: Yes** → **Position: Capital Market Instrumentalist**
          *   *Awkward Commitment:* Applies market logic (reflecting current preferences/constraints) to intergenerational ethics, potentially sacrificing future welfare for present gains deemed efficient by markets.
      *   **A: No** → Go to Q4

  4.  **Q4: Does the *risk of human extinction or civilizational collapse* warrant discounting future welfare?**
      *   **A: Yes, significantly (Probability of Beneficiaries Existing)** → **Position: Extinction Risk Discounter**
          *   *Awkward Commitment:* Discounts the welfare of future people *because* they might not exist, even if their welfare *if they exist* counts fully.
      *   **A: No, or minimally** → Go to Q5

  5.  **Q5: Does *expected economic growth* (making future people richer) warrant discounting *future utility gains*?**
      *   **A: Yes (Diminishing Marginal Utility)** → **Position: Growth-Adjusted Discounter (No Pure Time Preference)**
          *   *Awkward Commitment:* Future utility gains count less *only* because future people are richer; identical utility losses count equally regardless of timing. *(Note: Ambiguity with Q6 possible)*
      *   **A: No** → Go to Q6

  6.  **Q6: Is the *very far future* (e.g., >200 years) morally different *in kind* from the near future?**
      *   **A: Yes (e.g., Epistemic Limits, Radical Uncertainty, Non-Identity Problem)** → **Position: Unnamed (Strong Long-Termism Skeptic / Contextualist)**
          *   *Awkward Commitment:* Lacks a clear, generalizable principle for weighing the extreme long-term, potentially leading to neglect or ad-hoc reasoning.
      *   **A: No, only different in degree (if at all)** → **Position: Parfit-Style Temporal Neutrality**
          *   *Awkward Commitment:* Obligates massive sacrifices now for tiny utility gains spread across a vast number of future people, raising demandingness objections.

  **Key Notes & Unoccupied Branches:**

  *   **Blind Spot (Growth Ambiguity):** The path through Q3->Q4 (No)->Q5 (Yes) leads to "Growth-Adjusted Discounter". This *may not* distinguish between discounting *utility* due to richer recipients (standard view) vs. discounting the *wellbeing* of those future people themselves (a more radical view). The tree cannot resolve this ambiguity solely through these questions.
  *   **Unoccupied Branch 1:** Q1(No)->Q3(No)->Q4(Yes)->Q5(No)->Q6(?). *Why?* Discounting only for extinction risk while *also* believing the far future is different in kind is conceptually possible but rarely articulated clearly. Likely **unexplored/unattractive** – extinction risk already discounts the far future heavily, adding a qualitative difference might be seen as double-counting or overly skeptical.
  *   **Unoccupied Branch 2:** Q1(No)->Q3(No)->Q4(No)->Q5(No)->Q6(Yes). *Why?* "Parfit-Style" requires Q6(No). This branch rejects all standard discounting reasons *and* sees the far future as qualitatively different. This could be a distinct form of skepticism or contextualism focused on long-term epistemic problems. **Unexplored/Unattractive?** – It avoids demanding obligations but lacks a positive principle for action regarding the far future.
  *   **Position Mapping:**
      *   Exponential Discounter: Q1(Yes)->Q2(No)
      *   Presentist: Q1(Yes)->Q2(Yes)
      *   Capital Market Instrumentalist: Q1(No)->Q3(Yes)
      *   Extinction Risk Discounter: Q1(No)->Q3(No)->Q4(Yes)
      *   Growth-Adjusted Discounter (No Pure Time Preference): Q1(No)->Q3(No)->Q4(No/?)->Q5(Yes)
      *   Parfit-Style Temporal Neutrality: Q1(No)->Q3(No)->Q4(No/?)->Q5(No)->Q6(No)
  *   **Core Distinctions Addressed:** Q1 isolates Pure Time Preference. Q3 isolates Market Logic. Q4 isolates Extinction Risk. Q5 isolates Growth effects. Q6 isolates Near/Far difference in kind.

  This structure forces consideration of the foundational question of pure time preference first, then distinguishes between major empirical/institutional reasons for discounting, and finally probes the special status of the far future, while locating the key requested positions and acknowledging limitations.
