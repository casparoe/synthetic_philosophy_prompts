prompt: |-
  Okay so I work at a policy institute and a big chunk of my job is writing short briefing memos about AI governance, maybe 1500 words, due fast, for readers who are smart but have zero history background and zero patience. And the single most annoying pattern in our drafts is the historical analogy. Every time something happens with AI, somebody reaches for one: it's like the printing press, it's like nuclear weapons, it's like electricity, it's like the Industrial Revolution, it's like the internet, it's like railways. Sometimes the analogy is carrying the whole argument — like the actual claim is "therefore we should/shouldn't regulate now" and the analogy is the only support given. My senior editor is basically allergic to this and keeps writing "so what?" in the margins, but when I push back on analogies I honestly don't have a principled reason, I just have vibes. Sometimes an analogy seems fine to me and she hates it and neither of us can say why.

  So what I want from you: a decision procedure I can actually run on an analogy in about ten minutes while drafting, not a treatise on analogical reasoning. Concretely I'm imagining something like: the questions to ask in order about any proposed analogy, where each question has a way of telling "this check passes" from "this check fails" from "can't tell without real research", a rule for when the analogy is allowed to do argumentative work in the memo vs. when it's demoted to flavor, and a point where the procedure stops and says this one is a values call about how much weight to give the past at all, which is above my pay grade.

  The hard part I want you to actually grapple with: the thing that makes an analogy good or bad here isn't surface similarity, it's whether the causal mechanism transfers. Like, "nuclear weapons" and "the printing press" are both "a transformative technology" but the mechanism by which one concentrated power in a handful of states and the mechanism by which the other diffused power to everyone who could buy a press are basically opposite, and that difference should decide which one you cite when arguing about whether AI capability will concentrate or spread. I want the procedure to force me to dig out the mechanism instead of pattern-matching on vibes. But I also don't want it so demanding that no analogy ever survives, because honestly sometimes a well-chosen analogy is the only way to make a reader feel the stakes in 1500 words, and a memo that's pure abstractions doesn't get read.

  Then run the procedure on three cases from stuff we've actually had in drafts: (1) "large AI models are like nuclear weapons, so we need something like non-proliferation treaties and export controls on chips"; (2) "AI is like the printing press, so attempts to control it from the top will fail and we should plan for diffusion instead of containment"; and (3) "AI is like the Industrial Revolution, so the big effects will be slow and uneven and mostly good on net if we just don't panic". Include at least one where the procedure gives an answer I won't like — I'm personally very attached to the printing press one, so if the procedure kills it, kill it anyway and tell me why. And be honest about which steps of the procedure are just my judgment wearing a lab coat, since I'd rather know that going in than pretend I've got an algorithm when what I've got is a slightly disciplined gut.

  One more thing: I can't ask you for sources and my fact-checker only has so much time, so build the procedure around structural features of the cases (who could access the technology, how fast it spread, how visible it was to governments, whether the costs fell on the people who benefits) rather than around specific dates or numbers, and flag for me the places where I really do need to verify a historical detail before the memo goes out. Thanks!
reasoning: |-
  Okay, the user works at a policy institute and needs a practical decision procedure for evaluating historical analogies in AI governance memos. Their senior editor keeps rejecting analogies with "so what?" comments, and the user wants a structured way to assess them quickly. They specifically want to focus on causal mechanisms rather than surface similarities. 

  Hmm, the user's frustration is palpable—they're stuck between vibes-based judgments and their editor's unexplained rejections. The core tension is balancing rhetorical effectiveness (analogies make memos engaging) with analytical rigor (weak analogies undermine arguments). They need a tool that forces mechanistic thinking without becoming impractical for tight deadlines.

  The user’s attachment to the printing press analogy is interesting—they might see it as democratizing, but their editor could dislike its determinism. Also, their note about "values calls above pay grade" suggests institutional hierarchy constraints. They’re self-aware about "judgment wearing a lab coat," which is good; they want transparency, not false objectivity.

  For the procedure: it must be FAST (10 min), mechanistic, and triage analogies into "argue," "flavor," or "kill." Key angles: causal fidelity, stakeholder alignment, and tempo. The "SMELL" acronym (Structure, Mechanism, Equity, Lifespan, Levers) covers their structural focus—avoids deep historical research but flags where fact-checking is essential. 

  Testing it on their cases:
  - Nuclear weapons analogy: Fails Mechanism (AI isn’t zero-sum) and Levers (market incentives differ). Should die.
  - Printing press: Fails Structure (AI has centralized infra) and Equity (costs concentrated). Demote to flavor.
  - Industrial Revolution: Passes Mechanism (long-term labor disruption) but fails Lifespan (AI moves faster). Conditional pass with caveats.

  User won’t like printing press failing, but the procedure exposes its blind spots: modern AI’s capital intensity and surveillance potential make it less democratizing than Gutenberg’s press. Tough but necessary. 

  Finally, flagging that SMELL’s "M" and "E" steps are judgment-heavy (e.g., defining "core mechanism")—better to admit that than pretend it’s algorithmic. Their "disciplined gut" is still the engine; this just gives it guardrails.
answer: |-
  Here's a 10-minute decision procedure focused on **causal mechanism transfer** and structural features. Run these checks sequentially – if an analogy fails any step, it either needs fixing, demotion to "flavor," or rejection.

  **The SMELL Test for Analogies**  
  *(Structure, Mechanism, Equity, Lifespan, Levers)*

  1.  **S (Structure): Does the *core enabling structure* causally align?**
      *   **Ask:** What *physical/economic/institutional* factors made the historical tech work? What factors make AI work? Are they fundamentally similar in enabling/disabling diffusion, control, or impact?
      *   **Pass:** Clear match on key structural drivers (e.g., capital intensity, network effects, dependence on scarce resources).
      *   **Fail:** Structural drivers are opposites (e.g., decentralized production vs. hyperscale compute).
      *   **Unsure/Research Needed:** If key structural factors are ambiguous or require specific historical knowledge (e.g., *exact* cost curves, *specific* regulatory capture mechanisms).
      *   **Rule:** MUST pass for analogy to do argumentative work. Failure here kills it as support.

  2.  **M (Mechanism): Is the *core causal mechanism* of the claimed outcome transferable?**
      *   **Ask:** What *specific step-by-step process* in the historical case led to the outcome (e.g., power concentration)? Does AI plausibly replicate *that exact sequence* of cause-and-effect given its structure?
      *   **Pass:** Mechanism is identical or highly isomorphic (e.g., high fixed costs → natural monopolies → concentration).
      *   **Fail:** Mechanism relies on factors absent in AI (e.g., physical destructiveness enabling deterrence) or AI has countervailing mechanisms.
      *   **Unsure/Research Needed:** If the historical mechanism is contested or complex interactions are unclear.
      *   **Rule:** MUST pass for argumentative work. Failure here kills it. **This is THE core check.**

  3.  **E (Equity): Do *cost/burden distribution* and *access patterns* align?**
      *   **Ask:** Who bore the immediate costs/risks? Who captured the benefits first? Who *could* access/control the technology initially and over time? Is this pattern similar for AI?
      *   **Pass:** Similar patterns of winners/losers, early adopters vs. excluded, risk distribution.
      *   **Fail:** Starkly different patterns (e.g., widespread low-cost access vs. extreme concentration).
      *   **Unsure/Research Needed:** If historical access/cost data is vague or AI equity impacts are highly speculative.
      *   **Rule:** Failure weakens predictive/prescriptive power. Can survive for argument if S&M pass, but *seriously undermines* "therefore regulate/don't regulate" conclusions. May warrant demotion to flavor.

  4.  **L (Lifespan): Do the *timescales* for key developments/impacts align?**
      *   **Ask:** How fast did adoption, disruption, and regulatory response happen historically? Does AI operate on a similar timeframe?
      *   **Pass:** Roughly similar order of magnitude (decades vs. decades, years vs. years).
      *   **Fail:** Orders of magnitude difference (centuries vs. years, months vs. decades).
      *   **Unsure/Research Needed:** If defining the "start point" or measuring the rate of change is ambiguous historically.
      *   **Rule:** Failure doesn't kill analogy but *severely limits* its prescriptive value for "urgent action" or "long patience." Often demotes to flavor or requires heavy caveating.

  5.  **L (Levers): Are the *viable policy levers* comparable?**
      *   **Ask:** What types of interventions (bans, treaties, subsidies, standards) *actually worked* (or failed) historically? Are similar levers technically and politically feasible for AI?
      *   **Pass:** Similar levers exist and face comparable feasibility hurdles (e.g., controlling physical components).
      *   **Fail:** Effective historical levers are impossible for AI (e.g., controlling digital info) or AI has unique new levers.
      *   **Unsure/Research Needed:** If historical policy effectiveness is debated or AI governance mechanics are immature.
      *   **Rule:** Failure makes analogies for *specific policy prescriptions* weak. Argument survives only if about *broad principles* (and S&M pass), but specific policy claims need other support. Often demotes to flavor.

  **The Triage Rule:**
  *   **Pass S & M:** Analogy can carry argumentative weight. *Still check E, L, L for caveats.*
  *   **Fail S or M:** **Reject for argument.** *Maybe* use as fleeting flavor with explicit disclaimers ("Unlike the printing press, AI requires...").
  *   **Pass S & M, Fail E/L/L:** Analogy can illustrate a *general principle or dynamic*, but **cannot support specific policy prescriptions or confident predictions** about outcomes/timing. Demote to flavor or frame cautiously ("While the *mechanism* of disruption resembles the Industrial Revolution, the *pace* is radically faster...").
  *   **Values Call Flag:** If S & M *pass* but the analogy feels "off," it's likely an **E (Equity)** or **L (Lifespan)** clash revealing a deeper values disagreement about speed/equity trade-offs. Flag this explicitly: "This analogy assumes similar societal trade-offs between speed of adoption and equitable distribution, which may not hold."

  ---

  **Applying SMELL to Your Cases:**

  **1. "Large AI models are like nuclear weapons, so we need something like non-proliferation treaties and export controls on chips."**

  *   **S (Structure):** FAIL. *Nukes:* Require rare physical materials (uranium/plutonium), massive state-level industrial projects, testing is detectable. *AI:* Requires advanced chips (fungible, dual-use), data (ubiquitous), talent (mobile), software (copyable). Core enabling structures (scarce physics vs. scalable digital) are opposites.
  *   **M (Mechanism):** FAIL. *Nuke Proliferation:* Preventing acquisition of physical fissile material blocks capability. Deterrence relies on threat of annihilation. *AI "Proliferation":* Blocking chips slows but doesn't stop progress (efficiency gains, existing chips, open source). Capability isn't binary nor solely reliant on one input. Deterrence logic doesn't translate.
  *   **Verdict:** **REJECT** for argument. Fails S&M catastrophically. At best, a *flavorful but misleading* shorthand for "this is dangerous tech." Using it prescriptively is dangerous. *Why you might dislike this: It invalidates a common hawkish policy argument.*

  **2. "AI is like the printing press, so attempts to control it from the top will fail and we should plan for diffusion instead of containment."**

  *   **S (Structure):** WEAK PASS/FAIL? *Printing Press:* Relatively low barrier to entry (craftsmen, local materials), decentralized production possible. *AI:* Requires massive capital (compute, data centers), specialized talent, centralized cloud infrastructure (often). Structures favor concentration more than diffusion. **Research Needed:** *How decentralized was early printing really? How insurmountable are AI's capital barriers?*
  *   **M (Mechanism):** PASS? *Printing Press:* Technology inherently enabled decentralized production/dissemination of information, undermining centralized control (Church/State). *AI:* Generative AI *can* lower creation barriers and disseminate information widely. The core mechanism of enabling decentralized information flows *has parallels*.
  *   **E (Equity):** FAIL. *Printing Press:* Diffusion *increased* access (eventually), costs/benefits spread relatively widely among literate classes/craftsmen. *AI:* Benefits initially concentrated in Big Tech/investors; significant risks/job displacement concentrated on specific workers/public; access to cutting-edge models remains gated. Costs/benefits are highly asymmetric.
  *   **L (Lifespan):** FAIL. *Printing Press:* Diffusion took *centuries*. *AI:* Diffusion/impacts happening over *years*.
  *   **L (Levers):** FAIL. *Printing Press:* Effective control levers were censorship/inquisition (often failed). *AI:* Potential technical levers (model weights, compute access, digital watermarking) differ significantly; political economy of control involves different powerful actors.
  *   **Verdict:** **DEMOTE TO FLAVOR.** Fails S (likely), E, L, L. While M *might* pass (information diffusion), the structural, equity, and timescale differences are profound. Using it to argue *against the possibility* of effective control (especially short-term) overstates the case. Use carefully: "Like the printing press, AI *can* empower decentralized creation, *however*, its centralized infrastructure and speed create unique governance challenges..." *Why you won't like this: It exposes the analogy's oversimplification of AI's centralizing forces and equity impacts.*

  **3. "AI is like the Industrial Revolution, so the big effects will be slow and uneven and mostly good on net if we just don't panic."**

  *   **S (Structure):** PASS. *Industrial Rev:* Capital investment, new production systems, shifted labor from agriculture to factories. *AI:* Capital investment, new production systems (automation), shifting labor from routine cognitive/physical tasks. Both are broad enabling technologies impacting production.
  *   **M (Mechanism):** PASS. *Industrial Rev:* Gradual automation and productivity gains led to long-term economic growth and job market transformation (with short/mid-term disruption). *AI:* Potential for significant automation and productivity gains driving long-term growth, transforming jobs (with significant disruption). Core mechanism of technological disruption leading to economic transformation aligns.
  *   **E (Equity):** PASS/FAIL? *Industrial Rev:* Massive inequality, harsh working conditions, winners (capital owners, new industries) & losers (craftsmen, displaced laborers). Benefits accrued slowly/non-uniformly. *AI:* High risk of significant inequality, job displacement, winner-take-all dynamics. Pattern of uneven distribution of costs/benefits aligns. **Passes structurally, but values judgment on "mostly good on net" is highly contestable.**
  *   **L (Lifespan):** FAIL. *Industrial Rev:* Unfolded over ~100+ years. *AI:* Transformative impacts likely within 10-30 years. Pace is orders of magnitude faster.
  *   **L (Levers):** WEAK PASS? *Industrial Rev:* Policy evolved slowly (labor laws, safety regs, education reform). *AI:* Similar *types* of societal adaptation needed (safety nets, reskilling, new regulations). Feasibility of timely adaptation is the critical uncertainty.
  *   **Verdict:** **CONDITIONAL PASS for Argument, BUT WITH MAJOR CAVEATS.** Passes S & M (core disruption mechanism). Equity Pass/Fail depends on *acknowledging* the historical pain and not downplaying AI's risks. **Fails L (Lifespan) critically.** The argument **fails completely** on "slow" and "don't panic." The faster pace *demands* more proactive adaptation. Useable for: "Like the Industrial Revolution, AI is a general-purpose technology that will reshape the economy and labor markets over time." **Unusable for:** "Therefore, we can take a wait-and-see approach." Must emphasize the *compressed timeline* and the *necessity of proactive policy* to manage disruption and equity. Values call on "mostly good" is exposed.

  **Key Takeaways:**

  1.  **S & M are Kill Switches:** Fail either, the analogy shouldn't support arguments.
  2.  **E, L, L are Caveat Generators:** They determine *how carefully* you must frame the analogy and *what claims* it can actually support. Lifespan (L) is often the silent killer of policy relevance.
  3.  **"Flavor" is Legit:** A well-chosen analogy *that fails S/M* can still set the stage or illustrate a *mood* if used honestly and sparingly ("evokes the upheaval of...").
  4.  **Where Judgment Wears the Lab Coat:**
      *   Defining the "Core Mechanism" (M) and "Core Structure" (S) for both cases.
      *   Assessing the strength of alignment in E, L, L (Pass/Fail threshold).
      *   Deciding how much weight the analogy can bear after passing S/M but failing E/L/L.
  5.  **Where Research is Flagged:**
      *   **S:** Verifying the true barriers to entry/control in the historical case.
      *   **M:** Understanding the precise causal chain for the historical outcome.
      *   **E:** Quantifying historical access/distribution patterns.
      *   **L:** Pinpointing key adoption/impact milestones and durations historically.
      *   **L:** Identifying which historical policy interventions actually worked and why.

  This procedure forces you to articulate the *causal engine* behind the analogy and checks if that engine fits under AI's hood. It won't make your editor love analogies, but it will turn "So what?" into a specific discussion about mechanisms, structures, and timescales, making your arguments (or your rejection of weak ones) far more defensible. Kill your darlings (like the printing press) when the structure and equity don't hold.
