prompt: |-
  I've been keeping a list of cases where someone has to do two things and can't do both, and marking my gut call on each: genuine moral dilemma (they really ought to do both, and doing one doesn't erase the other) or not a real dilemma (one duty just outweighs or defeats the other, so only one thing is actually required). My verdicts so far, and I'd love your help figuring out if there's a principle behind them.

  You're a professional moral philosopher, so take this seriously, brainstorm a few candidate principles before committing, and then give me the best one or two, stated precisely.

  The cases and my calls:

  1. Sophie in Sophie's Choice forced to pick which child dies: genuine dilemma. Whichever she picks, she's left with a residual wrong, or at least something that isn't just regret.
  2. A doctor with one ventilator and two dying patients who both need it: NOT a genuine dilemma. Tragic, but one option is simply the right one (say, the one with better prognosis) and that's it.
  3. Sartre's student torn between joining the Free French and staying with his mother who lives for him: genuine dilemma, though I'm shakier here.
  4. Bernard Williams's Jim, offered to shoot one captive himself so the other twenty go free: NOT a dilemma. He shouldn't shoot, even at that price.
  5. A lawyer who knows her client is guilty and another man is about to be wrongly convicted, but confidentiality rules forbid revealing it: genuine dilemma.
  6. Agamemnon having to kill Iphigenia to sail to Troy: hmm, I keep flip-flopping. Part of me says no dilemma, just don't kill your daughter, war can wait.
  7. A parent who promised each of two kids, separately, to be at their events on the same day: NOT a dilemma, just apologize to one of them, feels clearly different from Sophie.

  Here's my tentative principle, tear it apart if needed: a dilemma is only genuine when the two requirements come from different people's claims on you (my child's claim vs. my other child's claim, my client's vs. the innocent man's), and not when one side is just the world's brute badness, like a shortage of ventilators. But I can see holes: Sartre's student doesn't exactly have both duties flowing from personal claims, yet my call is that it's genuine. And Agamemnon seems to involve claims on both sides too, which my principle would make genuine, against my flip-flopping gut.

  So: is there a principle that fits most or all of these? What would it say about a case I haven't considered, like a firefighter who can save either a stranger or, with equal effort, five strangers (no personal claim involved)? And honestly tell me which of my verdicts your principle can't save, and whether the principle that saves everything is worth its complexity.

  Please write in American English, and keep it under 400 words -- tight, no filler. No citations or reading lists needed, just your reasoning.
reasoning: |-
  Okay, let's tackle this. The user has presented several moral dilemma cases and their gut calls, seeking a principle that distinguishes genuine dilemmas from non-dilemmas. First, I need to parse each case and their verdict to find common threads. 

  Sophie's Choice is a genuine dilemma because both duties are personal and inescapable—choosing one child doesn't negate the wrong done to the other. The ventilator case isn't a dilemma because the decision is based on objective criteria like prognosis, making one choice clearly right. Sartre's student involves conflicting personal loyalties (family vs. country), which feels genuine. Williams' Jim isn't a dilemma because killing violates a fundamental moral constraint, outweighing the utilitarian gain. The lawyer faces a clash between professional duty and justice, both personal claims. Agamemnon is tricky—killing his daughter for war might not be a true duty, hence not a dilemma. The parent's promise is a scheduling conflict, resolved by apology without residual wrong.

  The user's tentative principle about duties from different people's claims has issues with Sartre (mother's claim vs. country's collective claim?) and Agamemnon. Maybe the key is whether the conflict involves incommensurable moral demands that can't be resolved by a higher rule. 

  Looking deeper, genuine dilemmas might involve duties where violating one leaves a distinct moral residue (blame, guilt, owed amends) because no objective priority exists. In non-dilemmas, one duty is overridden by a clear principle (e.g., utility, prohibitions). 

  Testing this: Sophie has residue (unavoidable betrayal); ventilator has no residue (correct triage); Sartre's student might feel guilt either way; Jim's refusal avoids moral taint; lawyer's confidentiality breach or wrongful conviction both leave residue. Agamemnon—killing his daughter would leave irredeemable guilt, suggesting it's not a true dilemma. The parent's broken promise requires amends but isn't unresolvable. 

  The firefighter case: saving five over one is a clear utilitarian choice, no residue. So Principle: Genuine dilemmas involve incommensurable duties where breaching either incurs distinct moral residue. This explains all but Sartre (if joining the war is seen as non-personal, though the student's personal commitment might make it feel residual). 

  Perhaps Sartre works if we view both duties as deeply personal (filial piety vs. patriotic sacrifice). The residue principle holds well here. Complexity is justified by capturing the lingering moral distress in genuine dilemmas.
answer: |-
  Here’s a precise principle that fits your cases best:

  **Principle 1 (Residual Wrong):** A genuine moral dilemma exists only when fulfilling one duty unavoidably involves violating another distinct duty *to a specific other party*, and this violation leaves a **distinct, non-transferable moral residue** (e.g., owed amends, justified blame, or inescapable guilt for that specific wrong). If one duty clearly overrides or negates the other based on impartial rules (e.g., maximizing lives saved, avoiding direct harm), no dilemma exists—only tragic choice.

  **Principle 2 (Source of Duty):** Genuine dilemmas arise from conflicting *agent-relative duties* (duties tied to your specific relationships/roles). Conflicts involving only *agent-neutral duties* (impersonal obligations like general welfare) or where one duty is agent-relative and the other is outweighed by agent-neutral reasons, are not genuine dilemmas.

  **How it fits your calls:**

  1.  **Sophie:** Violates duty *to each child specifically*. Residue: Unavoidable betrayal/abandonment of the chosen child. (**Genuine**)
  2.  **Ventilator:** Saving one life (agent-neutral duty) overrides saving the other. No unique duty *to each patient*. (**Not Genuine**)
  3.  **Sartre's Student:** Conflicting agent-relative duties (to mother vs. to country/comrades). Residue likely either way (abandonment or betrayal of cause). (**Genuine**)
  4.  **Jim:** Duty not to murder (agent-relative constraint?) outweighs agent-neutral duty to save lives. Shooting isn’t a genuine duty. (**Not Genuine**)
  5.  **Lawyer:** Conflicting agent-relative duties (confidentiality to client vs. justice to innocent man). Residue either way (betrayal or complicity in injustice). (**Genuine**)
  6.  **Agamemnon:** Killing daughter isn’t a genuine duty owed *to the army/gods*; it violates a profound agent-relative duty. Overridden. (**Not Genuine** - Matches your flip to "no dilemma").
  7.  **Parent Promises:** Agent-relative duties, but resolvable by apology/amends (minimal unique residue). Duty isn’t literally *impossible* to both; one is overridden by circumstance. (**Not Genuine**)

  **Firefighter Case (Save 1 vs. 5 strangers):** Not a dilemma. Purely agent-neutral duty to save lives. Saving 5 clearly fulfills the duty best. No residue owed *to the one not saved*.

  **Trade-offs:** This principle struggles slightly with **Sartre** if "joining the Free French" is seen as weakly agent-relative. It firmly rejects seeing Jim/Agamemnon as dilemmas, matching your gut. The complexity is justified as it captures the core intuition of *inescapable specific wrong* in genuine dilemmas.
