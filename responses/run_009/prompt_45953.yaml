prompt: |-
  I chair the review panel of a mid-sized private research foundation. Roughly once a month the panel — five members, occasionally four when someone's traveling — meets to shortlist applications: typically fifteen to thirty proposals for two or three awards, sometimes a straight ranking of candidates for a single fellowship. Each panelist reads everything, and each of us genuinely has an ordering in our head, but our orderings rarely agree, and the disagreement isn't usually about facts — it's about how much originality matters relative to feasibility, or how much to penalize a proposal for a weak methods section. At the end of the day we have to walk out with a ranked shortlist that the trustees will see, and the applicants who miss the cut will ask why they placed below people they beat on some dimensions. I've read enough to know that this is exactly the terrain of Arrow's impossibility theorem: whenever you're aggregating individual orderings over three or more alternatives into a group ordering, something has to give — no procedure can satisfy all of unrestricted domain, Pareto, independence of irrelevant alternatives, and non-dictatorship at once. What I take that to mean in practice is that the game isn't to find the "fair" aggregation rule, because there isn't one; it's to decide, deliberately and in advance, which condition we're going to sacrifice for which kind of decision, and to be able to say so plainly when an applicant or trustee asks.

  So what I'd like from you is a decision procedure the panel can actually run, written as a sequence of steps a program officer could follow with a stopwatch and a stack of score sheets. It should cover: how we choose, at the start of a meeting, which condition we're relaxing for that day's decisions and on what grounds (e.g., if we drop IIA by running a Borda-style points tally, a strong rejected proposal can change the relative standing of two others — the procedure should tell us when that's acceptable and what we say about it); where the procedure stops and hands a question back to the panel as a judgment call, marked as such rather than laundered through arithmetic; and what the procedure honestly cannot do, given that any mechanical rule we adopt will sometimes produce a shortlist a majority of the panel actively dislikes. Then run it on three concrete cases from recent cycles: (1) ranking seventeen fellowship candidates where two panelists' first and second choices are separated by a third candidate everyone agrees is mediocre; (2) shortlisting four of eleven project grants where the chair suspects the tally rule will let her own least favorite proposal through and wants the procedure to overrule her suspicion only if that's what it genuinely implies; and (3) a case where the procedure yields an outcome the panel will find distasteful — say, eliminating a proposal most members ranked second because of how the rule interacts with a widely-scattered set of votes — and say what we should tell that applicant.

  A few constraints to keep it real: the whole ranking step has to fit inside a ninety-minute block after the discussion, so nothing that requires panelists to make pairwise comparisons over all candidates; the panelists are domain experts but have no patience for formal notation, so the procedure should be stated in plain sentences with the theorem's conditions translated into concrete language (e.g., "no dead weight" instead of "Pareto"); and the trustees require that the shortlist come with a one-paragraph justification that doesn't hide behind "the formula said so." If parts of the procedure are judgment calls dressed up as steps, please say so explicitly — I'd rather present the panel with an honest instrument than a mystifying one.
reasoning: |-
  We are designing a decision procedure for a panel review that acknowledges Arrow's impossibility theorem. The procedure will explicitly relax one of the conditions (unrestricted domain, Pareto, independence of irrelevant alternatives, non-dictatorship) and be transparent about the trade-offs.

  Given the constraints (time, no pairwise comparisons over all candidates, plain language, no formal notation, and the need for a written justification), I propose a flexible procedure that can be adapted to relax one of the conditions at the start of the meeting.

  The procedure:

  1. **Pre-meeting preparation**: Each panelist reads all proposals and comes with a complete ranking (from best to worst) for all candidates. They also note any recusals (if applicable).

  2. **Start of the meeting (15 minutes)**:
     - The chair leads a discussion to decide which condition to relax for the day. The chair presents the trade-offs in plain language:
       - **Unrestricted domain**: We are going to restrict the types of rankings allowed (e.g., by requiring that all panelists agree on the relative ranking of certain pairs). *But this is unlikely in practice and not recommended.*
       - **Pareto efficiency (no dead weight)**: We might accept an outcome that everyone agrees is worse than another. *We usually don't want to relax this.*
       - **Independence of irrelevant alternatives (IIA)**: The relative ranking of two alternatives should not change based on the introduction or removal of a third. If we relax IIA, we might use a Borda count (which is sensitive to the entire set) and then we must accept that a strong rejected proposal might change the relative standing of two others.
       - **Non-dictatorship**: We might allow one person's ranking to be the group ranking. *This is usually unacceptable in a panel.*
     - The chair proposes which condition to relax based on the context (see examples below). The panel votes to agree on the relaxation.
     - The chair also states the number of awards (say, k) and that the goal is to produce a ranked shortlist of top k (or sometimes a ranking for a single fellowship).

     *Note: In practice, relaxing IIA (using a Borda-like method) is common and often the most acceptable. Relaxing non-dictatorship is unacceptable. Relaxing Pareto is dangerous. Unrestricted domain is not practical. Therefore, we will often choose to relax IIA and use a Borda count. However, the procedure allows for other methods if the panel chooses.*

  3. **Aggregation procedure (60 minutes)**:
     - **Step 1: Collect rankings**. Each panelist submits their complete ranking (on paper or electronically). If there are n candidates, then in a Borda count, each panelist assigns n-1 points to their top candidate, n-2 to the next, ..., 0 to the last.
     - **Step 2: Tally points**. The program officer (or chair) sums the points for each candidate. The candidates are then ranked by total points (highest to lowest). This is the Borda ranking.
     - **Step 3: Break ties**. In case of a tie, the chair breaks it by her own ranking (or the panel can vote on the tied candidates). This is a judgment call and should be noted.
     - **Step 4: Produce the shortlist**. The top k candidates (or the required number) are taken as the shortlist in the order of the Borda ranking.

     *Why this relaxes IIA*: The relative ranking of two candidates can be affected by the presence of a third candidate. For example, if a candidate C is introduced, it might take points from candidate A and not from B, changing the relative standing of A and B.

     *Alternatives*:
     - If the panel chose to relax unrestricted domain (which we don't recommend) we might use a median voter or similar, but that requires more complex methods and pairwise comparisons (which we avoid).
     - If the panel chose to relax non-dictatorship, we would let one panelist decide (but we don't do that).
     - If the panel chose to relax Pareto, we might use a method that sometimes ranks a candidate lower even if everyone prefers them higher (but we avoid).

     *Judgment calls*: 
     - The choice of which condition to relax is a judgment call by the panel at the start.
     - Tie-breaking is a judgment call (by the chair or a quick panel vote).

  4. **Handling the outcome and justification (15 minutes)**:
     - The chair and panel review the shortlist. If there is a candidate that the majority actively dislikes (i.e., ranked near the bottom by most) but made the shortlist because of the points, the panel can override the procedure by a supermajority vote (say, 4 out of 5). This is a safety valve but should be used rarely and noted in the justification.
     - The program officer writes a one-paragraph justification that includes:
          a. The method used (e.g., Borda count) and why it was chosen (which condition was relaxed).
          b. Any tie-breaking or override that occurred.
          c. A summary of the panel's overall judgment (e.g., "The shortlist reflects a balance of originality and feasibility, with the top candidates showing strength across multiple criteria.") without going into individual proposals.

  5. **What the procedure cannot do**:
     - It cannot guarantee that the group ranking is consistent with the majority view on every pair (because of Condorcet cycles, which Arrow's theorem says we cannot always avoid).
     - It might produce a shortlist that includes a candidate that a majority of the panel does not want (if they are polarizing and get points from being ranked high by a few and medium by others). The override is designed to catch this.
     - It cannot avoid the effect of relaxing IIA (if using Borda) — so if a strong candidate was rejected, it might have affected the relative order of two others. We must be transparent about that.

  Now, let's run the procedure on the three cases.

  **Case 1: Ranking seventeen fellowship candidates (two panelists' first and second choices separated by a mediocre candidate)**

  - **Context**: We have 17 candidates for a single fellowship (so we need a full ranking). Two panelists (say, A and B) have a top two that are very close, but separated by a candidate (C) that everyone agrees is mediocre. The other three panelists rank candidate C near the bottom.

  - **Procedure**:
     - We decide to relax IIA and use Borda count (as the most common and practical).
     - Each panelist gives 16 points to top, 15 to next, ... 0 to last.
     - The mediocre candidate C: 
          - Panelists A and B might rank C 2nd and 3rd (so they give 15 and 14 points, respectively).
          - The other three panelists rank C near the bottom (say, 15th, 16th, 17th) so they give 1, 0, or 0 points (depending on exact rank).
     - Total points for C: 15+14+1+0+0 = 30.
     - The two favorites (say, X and Y) of panelists A and B: 
          - Suppose panelist A: X (16), Y (15), ... 
          - Panelist B: Y (16), X (15), ...
          - The other panelists: they might rank X and Y in the middle. Let's assume they both get around 8 points from each of the other three (so 24 points). 
          - Then X: 16 (from A) + 15 (from B) + 24 (from others) = 55
          - Y: 15 (from A) + 16 (from B) + 24 (from others) = 55
     - So X and Y tie at 55, and C has 30. The mediocre candidate C is well below X and Y.

     - **Outcome**: The top two are X and Y (with a tie, which we break by the chair's preference or a quick vote). The mediocre candidate C is not in the top. So the panel's concern doesn't materialize because the other panelists ranked C very low.

     - **What to say to an applicant?** If an applicant (like C) asks why they were ranked below X and Y, we can say: "The panel used a scoring system that assigned points based on each member's entire ranking. The two top candidates received consistently high rankings across the panel, while your proposal was ranked highly by two members but lower by others, leading to a lower total score."

  **Case 2: Shortlisting four of eleven project grants (chair fears her least favorite might get through)**

  - **Context**: 11 proposals, shortlist 4. The chair has a least favorite proposal (Z) that she fears might make the shortlist because of the Borda count.

  - **Procedure**:
     - We use Borda count (relaxing IIA). Each panelist assigns 10 points to top, 9 to next, ... 0 to last.
     - The chair's least favorite (Z) might be ranked high by others. Let's assume:
          - The chair ranks Z last (0 points).
          - Two panelists rank Z in the middle (say, 5th and 6th, so 5 and 4 points).
          - Two panelists rank Z high (say, 2nd and 3rd, so 9 and 8 points).
          - Total for Z: 0+5+4+9+8 = 26.
     - The fourth highest candidate might have, say, 30 points. So Z might make the top 4.

     - **Step 4: Override possibility** — The panel reviews the shortlist. The chair notes that Z is her least favorite and asks if anyone else strongly objects. If a majority (3 out of 5) rank Z in the bottom half, they might agree to override. In this case, two panelists ranked Z high (so they won't object) and two in the middle (might not object) and the chair at the bottom. The panel might not have a supermajority to override.

     - **Outcome**: The procedure says Z is in the top 4. The chair must accept this because the procedure was followed and the panel did not override.

     - **What to tell the chair?** "The procedure we agreed upon (Borda count) has selected Z because it received high rankings from two panelists and medium from two others. We must respect the outcome unless there is a strong consensus against it, which we don't have. This shows that the method we chose (which relaxes independence of irrelevant alternatives) can sometimes lead to outcomes that one member disagrees with, but it reflects the aggregate view."

     - **Justification paragraph**: "The panel used a Borda count to aggregate individual rankings, which assigns points based on each member's ordering. The top four proposals were selected by the highest total points. This method ensures that proposals that are consistently well-regarded across the panel are recognized, even if no single member ranked them first."

  **Case 3: Procedure yields a distasteful outcome (a proposal ranked second by most is eliminated because of scattered votes)**

  - **Context**: We have, say, 20 candidates for 3 awards. There is a candidate (P) that is ranked second by 3 out of 5 panelists, but ranked very low (say 19th or 20th) by the other two. In a Borda count:
     - For each of the 3 panelists: P gets 18 points (if second in 20 candidates).
     - For each of the other two: P gets 1 point (if 19th) and 0 (if 20th).
     - Total: 18*3 + 1 + 0 = 55.
     - Now, consider candidate Q who is ranked 5th by everyone: 15 points per panelist -> 15*5 = 75.
     - Candidate R: ranked 3rd by two, 4th by three: (17*2) + (16*3) = 34+48 = 82.
     - Candidate S: ranked 1st by one, 6th by four: (19) + (14*4) = 19+56=75.

     - The top three might be R (82), then Q and S (75). P with 55 is not in the top three.

  - **Why distasteful?** 3 out of 5 panelists had P as their second choice, but because the other two ranked P at the very bottom, P doesn't make the shortlist.

  - **What to tell the applicant (P)?** 
     "The panel used a scoring system that assigned points based on each member's entire ranking. While three panelists ranked your proposal very highly, the other two panelists ranked it near the bottom of the list. This resulted in a total score that did not place your proposal in the top three. We understand that this outcome may be disappointing, especially given the high ranking by some panel members, but the procedure reflects the collective assessment of the entire panel, which must balance differing views on the strengths of the proposals."

  - **Justification paragraph**: 
     "The panel used a Borda count to aggregate individual rankings. This method accounts for the strength of preference across the entire set of proposals. The top three proposals had consistently high rankings across all panelists, whereas other proposals, while highly ranked by some, were ranked lower by others, leading to a lower aggregate score."

  **Summary of the procedure in steps for the program officer**:

  1. **Pre-meeting**: Panelists prepare complete rankings.

  2. **Start of meeting (15 min)**:
     - Chair leads discussion on which condition to relax (usually IIA, so we use Borda).
     - Panel agrees by vote.

  3. **Aggregation (60 min)**:
     - Program officer collects rankings.
     - Assign points: for n candidates, top gets n-1, second n-2, ..., last 0.
     - Sum points for each candidate.
     - Rank candidates by total points (highest to lowest).
     - Break ties (chair decides or quick panel vote).
     - Select top k for the shortlist.

  4. **Review and override (if needed)**:
     - Present the shortlist. If a candidate is in the shortlist that a supermajority (4 out of 5) of the panel agrees is unacceptable (e.g., ranked in the bottom third by at least 4 panelists), then the panel can remove that candidate and replace it with the next in the Borda ranking. This is a rare judgment call.

  5. **Justification**:
     - Write a paragraph explaining the method and the outcome.

  **Transparency**: The procedure is honest about relaxing IIA (if using Borda) and about the override being a judgment call.

  This procedure fits within 90 minutes, avoids pairwise comparisons, and uses plain language.
answer: |-
  Below is a decision procedure designed for your panel, grounded in Arrow's impossibility theorem and tailored to your constraints (90-minute limit, no pairwise comparisons, plain language, transparency about judgment calls, and trustee-friendly justifications). The core philosophy is **deliberate upfront trade-offs**: at the start of each meeting, the panel explicitly chooses which condition to relax (per Arrow's theorem) and uses a method aligned with that choice. The procedure is structured as a sequence of repeatable steps for a program officer, with clear "handoff points" for panel judgment and explicit limitations.

  ---

  ### **Decision Procedure: The Arrow Trade-off Framework**
  **Key Terms in Plain Language** (replacing formal conditions):  
  - **Unrestricted Opinions**: Everyone can rank proposals freely.  
  - **No Dead Weight**: If all panelists prefer Proposal A over B, A must rank higher.  
  - **No Spoiler Effect**: The ranking between two proposals shouldn't change because of a third (e.g., a strong rejected proposal shouldn't alter who wins between two others).  
  - **No Dictator**: No one person’s ranking decides the outcome.  

  **Step-by-Step Process**  
  *Total time: 75–85 minutes (fits 90-minute block). Program officer leads timing.*  

  #### **Step 1: Choose the Trade-off (10–15 minutes)**  
  - **Panel discussion**: Chair presents the day’s context (e.g., "Today we rank 17 fellowship candidates; originality vs. feasibility is contentious").  
  - **Chair proposes which condition to relax** based on context:  
    - *Relax **No Spoiler Effect***: Use when proposals are interdependent (e.g., similar themes) or when the panel values consensus across *all* rankings. **Method**: Borda count (points-based tally).  
      - *Grounds for acceptability*: Use when rejected proposals are unlikely to be "spoilers" (e.g., no clear front-runners), or when the panel accepts that strong losers might shift outcomes.  
      - *What to say externally*: "We used a points system to capture overall strength; a rejected proposal’s merits could influence rankings between others."  
    - *Relax **No Dictator***: Rarely used; only if one panelist has unique expertise (e.g., technical niche). **Method**: Defer to that person’s top choice, then rerank the rest.  
      - *Grounds for acceptability*: When expertise is highly uneven (e.g., one panelist is the sole methods expert).  
      - *What to say externally*: "Dr. Smith’s expertise in methods was pivotal for the top choice; others were ranked by consensus."  
    - *Relax **Unrestricted Opinions***: Use when panelists agree on core principles (e.g., "feasibility over originality"). **Method**: Score proposals on preset criteria (e.g., 1–5 on originality/feasibility), then average.  
      - *Grounds for acceptability*: When criteria are non-negotiable (e.g., trustee-mandated).  
      - *What to say externally*: "Proposals were scored on predefined criteria approved by trustees."  
    - *Relax **No Dead Weight***: **Avoid**—violates fairness. Not recommended.  
  - **Panel vote**: Majority approves the trade-off. If deadlocked, default to relaxing *No Spoiler Effect* (Borda).  
  - **Program officer records**: Trade-off chosen and why (e.g., "Borda: No Spoiler Effect relaxed due to high proposal interdependence").  

  #### **Step 2: Collect Rankings (5 minutes)**  
  - Panelists submit **complete rankings** (no ties) on score sheets.  
  - **Example**: For 15 proposals, Panelist 1 ranks #1 (best) to #15 (worst).  

  #### **Step 3: Run Aggregation Method (15–20 minutes)**  
  *Based on Step 1 choice. Program officer calculates; panel observes.*  
  - **If Borda (relaxed No Spoiler Effect)**:  
    - Assign points: #1 rank = \(n-1\) points, #2 = \(n-2\), ..., #n = 0 (e.g., 15 proposals: #1 gets 14, #2 gets 13, etc.).  
    - Sum points across panelists.  
    - **Handoff to judgment**: Tie-breakers (if any) go to chair’s ranking (judgment call).  
  - **If Defer to Expert (relaxed No Dictator)**:  
    - Expert’s #1 is shortlisted.  
    - Rerank remaining proposals with Borda (default).  
    - **Handoff to judgment**: Panel approves the expert choice (if contested, revert to Borda).  
  - **If Scored Criteria (relaxed Unrestricted Opinions)**:  
    - Average scores per proposal.  
    - **Handoff to judgment**: Resolve ties or score gaps (e.g., "Is 4.2 vs. 4.3 meaningful?").  

  #### **Step 4: Review and Override (20–25 minutes)**  
  - **Program officer reveals** the mechanical shortlist/ranking.  
  - **Panel checks for "active dislike"**:  
    - If a proposal in the shortlist is ranked **bottom-3 by ≥4 panelists**, it triggers an override vote.  
    - Supermajority (≥4 panelists) can remove it and promote the next in line.  
  - **Judgment call**: Chair leads discussion *only if* override is triggered. No relitigation of rankings.  
  - **Program officer records** overrides and reasons (e.g., "Proposal X removed: 4 panelists ranked it bottom-3").  

  #### **Step 5: Finalize Shortlist and Justification (10–15 minutes)**  
  - **Program officer drafts a one-paragraph justification** using this template:  
    > "The panel ranked proposals using [Method] to prioritize [e.g., overall consensus or feasibility]. [Number] awards were selected from [number] proposals. The top [number] reflected [key strength, e.g., balance of innovation and practicality], while those not shortlisted often [brief gap, e.g., 'had uneven support despite strengths in specific areas']. Overrides: [if any, e.g., 'one proposal was removed due to widespread concerns']."  
  - **Panel approves justification** (quick read; no edits unless factual error).  

  #### **What the Procedure Cannot Do**  
  - **Guarantee "fair" rankings**: Any method can produce a shortlist disliked by a majority (e.g., due to Condorcet cycles).  
  - **Prevent strategic voting**: Panelists might rank insincerely if methods are predictable.  
  - **Resolve deep disagreements**: The procedure exposes trade-offs but doesn’t eliminate subjectivity.  
  - **Justify every ranking gap**: Applicants who "lose on aggregate" may have beaten winners on some dimensions—this is inherent to relaxing *No Spoiler Effect* or *Unrestricted Opinions*.  

  ---

  ### **Application to Your Cases**  
  *Assume Borda count (relaxing No Spoiler Effect) is default trade-off, as it’s most practical for your constraints.*  

  #### **Case 1: Ranking 17 fellowship candidates**  
  - **Context**: Two panelists (P1, P2) rank: P1: A > B > C; P2: B > A > C. Candidate C is mediocre (ranked low by others).  
  - **Procedure**:  
    - **Step 1**: Relax *No Spoiler Effect* (Borda). Grounds: Interdependent candidates; focus on overall consensus.  
    - **Step 3**: Points calculated (e.g., A and B get high points from P1/P2; C gets moderate from P1/P2 but low from others).  
    - **Outcome**: A and B likely tie for #1–#2; C ranks lower (e.g., #10).  
    - **Why?** C’s mediocrity drags them down despite P1/P2’s support.  
  - **What to tell applicants**:  
    > "While you excelled in [specific dimension], the panel’s aggregate ranking favored candidates with broader consensus across all reviewers. Your proposal was highly ranked by some but had less support from others."  
  - **Justification**:  
    > "The panel used a points system to balance originality and feasibility. Top candidates showed consistent excellence across reviewers; others had variable support."  

  #### **Case 2: Shortlisting 4 of 11 project grants (chair’s least favorite might win)**  
  - **Context**: Chair dislikes Proposal Z; suspects Borda will push it through.  
  - **Procedure**:  
    - **Step 1**: Relax *No Spoiler Effect* (Borda). Grounds: Standard approach; no major interdependencies.  
    - **Step 3**: Points tallied—Z ranks #4 due to moderate support from others.  
    - **Step 4**: Override check: Chair checks if ≥4 panelists rank Z bottom-3. If not, Z stays.  
  - **Outcome**:  
    - *If Z not bottom-3 for ≥4*: It stays. Chair’s suspicion is overruled—procedure works as intended.  
    - *If Z bottom-3 for ≥4*: Override vote. Supermajority removes Z.  
  - **What chair learns**: The procedure overrules suspicion only if Z genuinely has broad support (not just one or two high ranks). If Z wins without override, it reflects the group’s view.  
  - **Justification** (if Z stays):  
    > "Proposals were ranked by points assigned to each position. The top four had the strongest overall support, even if individual rankings varied."  

  #### **Case 3: Distasteful outcome (widely scattered support)**  
  - **Context**: Proposal P is ranked #2 by 3 panelists but #15–17 by 2 others. Borda eliminates P early.  
  - **Procedure**:  
    - **Step 1**: Relax *No Spoiler Effect* (Borda).  
    - **Step 3**: P gets high points from 3 panelists (e.g., 16 points each for #2 in 17 proposals) but near-zero from others (e.g., 1–2 points). Total points place P at #10–#12.  
    - **Step 4**: Override check: P isn’t in shortlist, so no override.  
  - **Outcome**: P is eliminated despite strong support from majority.  
  - **What to tell applicant P**:  
    > "Your proposal was highly ranked by several panelists for [specific strength], but others had significant concerns about [e.g., methods]. The ranking system prioritizes consistent support across all reviewers, which resulted in a lower aggregate score. While you surpassed winners in some dimensions, the panel’s collective view favored more uniformly strong proposals."  
  - **Why this is honest**: Borda’s flaw (relaxing *No Spoiler Effect*) is exposed—polarizing proposals lose to broadly "good enough" ones.  

  ---

  ### **Why This Works for Your Constraints**  
  - **Time**: Fits 90 minutes (breakdown: Step 1=15, Step 2=5, Step 3=20, Step 4=25, Step 5=15).  
  - **No pairwise comparisons**: Uses simple rankings or scores.  
  - **Plain language**: Avoids jargon; trade-offs described concretely (e.g., "strong losers can alter rankings between others").  
  - **Transparent judgment calls**: Override step and tie-breakers are explicit, not laundered.  
  - **Accountability**: Justification explains *why* a method was chosen, not just the outcome.  

  **Final Recommendation**: Default to relaxing *No Spoiler Effect* (Borda) for most meetings, as it’s efficient and handles large candidate pools. Reserve other trade-offs for niche cases (e.g., deferring to an expert for technical grants). This procedure embraces Arrow’s lesson—by deliberately choosing what to sacrifice, you turn impossibility into a defensible process.
