  On (c): generalization beyond specific cases. Probability 0.75 feels appropriate. If Frankfurt works for one action type, it likely applies broadly unless shown otherwise. The burden would shift to PAP defenders.

  For (d): verbal disagreement probability. I'm leaning lower at 0.30. The distinction between actual sequence and counterfactual control runs deep - Frankfurt attacks the latter but leaves room for actual-sequence requirements.

  Multiplying these gets me to 0.6, matching the user's credence. The advisor's 0.35 likely stems from higher confidence in the dilemma defense (their (a) would be around 0.75). To collapse the gap, resolving (a) is most effective - if we could prove Frankfurt cases don't presuppose determinism or always leave relevant alternatives.

  My most uncertain point is (a). If someone showed all Frankfurt cases implicitly assume compatibilism, that could lower my number. Fischer's actual-sequence compatibilism might be the hinge - if it fails, the whole argument unravels.

  The user's deep engagement shows they want rigor, not surveys. Their advisor's position deserves weight - the dilemma defense has real teeth. But I think the flickers are too minimal to bear PAP's weight. Still, I'm least sure about smuggling determinism into the cases. That's where the debate turns.
