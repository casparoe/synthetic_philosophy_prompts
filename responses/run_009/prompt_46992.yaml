prompt: |-
  I moderate a discord server for about 20k members (retro computing stuff, if that matters) and I'm the one who has to decide which of our unwritten rules we write down in the welcome doc and which we leave alone. This fight comes up like clockwork: one mod says "if newcomers keep getting in trouble for breaking a rule they couldn't have known about, write it down," another says "half of these aren't rules, they're just habits, and writing them down turns habits into laws and changes them." I've stopped being able to tell which of them is right about which cases.

  I recently read a bit about David Lewis's book Convention (1969) — conventions as solutions to coordination problems, held up by everyone expecting everyone else to conform rather than by enforcement, arbitrary in the sense that some alternative arrangement would have coordinated everyone just as well, but sticky once in place. I'm honestly not confident I have this exactly right, so correct me where I'm off. It struck me that this framework gives me roughly the distinctions I need: mere habit vs. convention proper vs. norm with teeth, plus maybe a story about what codification does to a convention — my worry is that putting it in writing shifts it from "this is how we do things here" to "this is a rule with a rule-giver," which changes its character even if the words are identical.

  So: write me a procedure I can actually run on a candidate regularity when the "should we write it down" question comes up. Steps in order, what counts as a sufficient answer at each step, where the procedure should stop with a "don't codify," where it should say "codify, and here's the framing that does least damage," and where it has to hand the decision back to me because it's a values question rather than a classification question. Also tell me where the procedure is likely to misfire.

  Then run it on three real cases from the last few months:

  1. Newcomers keep getting quietly frozen out because they don't know that questions about a certain deprecated tool go in one channel and not another. Everyone who's been around a while knows it; nobody ever states it; no one gets punished, they just get silence.

  2. An emoji-reaction habit: one specific reaction has come to mean "I saw this, thanks." It spread from one popular member and now functions almost like acknowledgment etiquette — some people genuinly get offended when it isn't used on their posts. Nobody enforces anything.

  3. Self-promotion. This one has real enforcement (mods delete posts, occasionally ban) but it's contested — maybe 40% of active members think we're way too strict — and writing down the current practice would basically declare a winner in an ongoing argument.

  Case 3 is the one I expect your procedure to be least comfortable with, and possibly the one where I won't like its answer, but that's what I want it for. Also tell me straight what the procedure can't do — if the whole Lewis framework just goes silent on contested norms with enforcement, I want to know that instead of watching you pretend everything is a coordination problem.

  This comes up every few weeks and each round eats a two hour mod call, so keep it usable by the other mods, none of whom have read any philosophy. And keep it honest about which steps are judgement calls dressed up as procedure.
reasoning: |-
  Okay, let me start by really understanding what this user needs. They're moderating a large Discord server for retro computing with 20k members. The core problem is deciding which unwritten rules to formalize in the welcome doc. The mod team is split: one side argues that if new users keep breaking an unknown rule, it should be written down; the other worries that codifying habits turns them into rigid laws and changes their nature.

  The user mentioned David Lewis's conventions, so I need to recall that correctly. Conventions are solutions to coordination problems, maintained by mutual expectations. They're arbitrary but sticky. The user is worried that writing them down shifts the dynamic from organic practice to top-down rule, which might alter how members perceive and follow them.

  The main request is a step-by-step procedure to evaluate each candidate rule. The procedure needs to distinguish between habits, conventions, and enforced norms. Then apply it to three real cases. Also, be honest about where the process has limitations, especially for contested norms like self-promotion.

  Breaking down the steps: First, figure out if the regularity exists. If not, stop. Then check if it's a solution to a coordination problem—does it solve a real issue like organizing channels? If it doesn't, it's just a habit, so don't codify. If it does, then it's a convention. Here, consider if codifying would damage the convention. For example, if it's deeply ingrained and mutual, writing it down might not be necessary. But if newcomers keep stumbling, codification might help without harm.

  Next, check if there's enforcement. If mods are enforcing it, it's a norm, not just a convention. Then assess if enforcement is consistent. If not, codifying might resolve ambiguity but could escalate conflict. For contested norms, the procedure can only clarify the situation but can't resolve values disputes. The user has to make a call based on server values.

  Now, applying to the cases. Case 1: Channel rules. It's a coordination problem (keeping discussions organized). Enforcement is passive (silence), making it a convention. Newcomers struggle, so codify with descriptive framing ("we usually discuss X here") to keep it organic.

  Case 2: Emoji reaction. It started as a habit but now has social pressure. Not solving coordination, so it's a norm. Offense occurs, but no mod enforcement. Codifying might backfire by making it rigid. Better to handle through reminders or cultural cues.

  Case 3: Self-promotion. Enforced by mods, contested. It's a norm with inconsistent enforcement. Codifying would declare a winner, escalating conflict. The procedure flags it as a values conflict. The user needs to decide based on server goals, maybe temporary measures or community input.

  The user's deeper needs: Save time on mod calls, prevent recurring disputes, maintain community culture. They want a transparent tool that mods without philosophy backgrounds can use. They also need honesty about where the framework falls short, especially in value-laden issues. The procedure should empower them to make informed decisions without false certainty.
answer: |-
  Here's a concrete, step-by-step procedure based on Lewis's framework, designed for mod-team usability. It focuses on **classification first, damage assessment second**, and flags judgment calls. **Philosophy-to-Practical Translation:** Replace "coordination problem" with "does this solve a messy situation where everyone needs to be roughly on the same page?" and "arbitrary" with "could a different habit have worked just as well?"

  **The "Should We Codify?" Procedure**

  1.  **Does the Regularity Exist?**
      *   *Ask:* "Do we consistently observe people acting in this specific way? Do deviations reliably cause friction?"
      *   *Sufficient Answer:* Yes (Proceed to 2) / No (STOP: **Don't Codify**. It's not real/consistent enough).
      *   *Judgment Call:* Defining "consistently" and "reliably". Is it 60% or 90%? Use mod logs, observed conflicts.

  2.  **Is it Solving a Coordination Problem?**
      *   *Ask:* "Does this behavior mainly exist to avoid confusion, wasted effort, or conflict in a situation where multiple ways *could* work, but everyone needs to pick *one*? (e.g., 'Where do we post X?' 'How do we signal Y?')."
      *   *Sufficient Answer:*
          *   **Yes:** It's likely a **Convention** (Proceed to 3).
          *   **No:** It's likely a **Habit** or **Personal Preference** (Proceed to 4).

  3.  **Assess the Convention's Health & Codification Risk:**
      *   *Ask:* "Do newcomers *reliably* stumble over this convention because it's invisible? AND: Is the convention currently stable and working well *because* people expect others to follow it?"
      *   *Sufficient Answer:*
          *   **Newcomers stumble & Convention is healthy:** Codification *might* help newcomers without harming the convention. (Proceed to 3a).
          *   **Newcomers DON'T stumble OR Convention is fragile/contested:** High risk codification changes it. (Proceed to 4 - Treat like a Habit/Preference).
          *   *Judgment Call:* Assessing "stumble" (look at help channel logs, newbie confusion reports) and "healthy" (lack of major disputes, smooth operation).
      *   **3a. Framing for Conventions:**
          *   *Goal:* Preserve the "we do this because it works" spirit, avoid "this is a rule from on high".
          *   *How:* Frame it **descriptively**, not prescriptively. Use words like "Typically," "It's common practice to," "To keep things organized, we usually...", "For questions about [Topic], head to #channel-name". Place it in a "Tips & Conventions" section, *not* the "Rules" section.
          *   *Sufficient Outcome:* **Codify with Descriptive Framing**.

  4.  **Habit / Preference / Unhealthy Convention: Assess Harm vs. Rigidity Risk:**
      *   *Ask:* "Is this causing *significant, recurring harm* (conflict, exclusion, mod workload) *specifically because* it's unwritten? AND: Would writing it down *definitely* reduce that harm *more* than it risks making things rigid or sparking resistance?"
      *   *Sufficient Answer:*
          *   **Yes, significant harm reducible > rigidity risk:** Consider codifying *very carefully* as a **Suggestion/Guideline** (e.g., "A common way to acknowledge posts is...", "Many find it helpful to..."). Proceed to 4a.
          *   **No:** STOP: **Don't Codify**. The cost of rigidity/resistance outweighs the benefit. Address specific harm incidents reactively (e.g., quick DM: "Hey, usually folks post that in #X"). *Judgment Call:* Quantifying "significant harm" and weighing risks. Err on the side of *not* codifying habits.

  5.  **Is it Enforced? (The "Norm with Teeth" Check):**
      *   *Ask:* "Do mods *actively* punish deviations (warns, mutes, kicks, bans, deletions)? Or is enforcement strong, consistent, and universally understood by the community as 'the rule'?"
      *   *Sufficient Answer:*
          *   **Yes:** It's an **Enforced Norm** (Proceed to 6).
          *   **No:** STOP: **Don't Codify** (unless it passed Step 4 exceptionally). It lacks enforcement teeth.

  6.  **Assess Enforcement Consistency & Community Acceptance:**
      *   *Ask:* "Is enforcement consistent *and* broadly accepted (>~70%) by the active community? OR Is it contested/inconsistent but *vital* to core server function/safety?"
      *   *Sufficient Answer:*
          *   **Consistent & Accepted:** Codify clearly in the **Rules** section. State consequences. (Proceed to 6a).
          *   **Contested/Vital but Inconsistent:** HIGH RISK. Codification = picking a side. (Proceed to 7 - Values Conflict).
          *   **Not Vital & Contested/Inconsistent:** STOP: **Don't Codify Yet**. Fix enforcement/consensus first. *Judgment Call:* Gauging "broadly accepted" (polls? mod sense?). Defining "vital" (prevents spam? protects minors? core topic focus?).
      *   **6a. Framing for Enforced Norms:** Frame **prescriptively** and **clearly**. "Do not post self-promotion in general chats. Permitted channels: #showcase. Violations may be deleted; repeat offenders banned." Place in the **Rules** section.

  7.  **Values Conflict Flag:**
      *   *Trigger:* Reaching this step means the procedure identifies a fundamental clash in community values or interests regarding an Enforced Norm. The Lewis framework *can't solve this*.
      *   *Outcome:* **HAND BACK TO MODS**. The procedure says: "Codification will escalate conflict by declaring a winner. You must decide based on the server's core purpose and values. Consider: Temporary measure? Community poll? Leadership decision? Principle over popularity?" This isn't classification; it's governance.

  **Where the Procedure Misfires:**

  1.  **Misclassifying Nuance:** It might struggle with things that are *mostly* convention but have *light* social enforcement (like mild disapproval), putting them in the risky Habit/Step 4 category.
  2.  **Overestimating Harm:** Mods might perceive "harm" from habit deviations more acutely than the general userbase does.
  3.  **Underestimating Rigidity:** The chilling effect of writing *anything* down can be hard to predict. A well-intentioned "suggestion" might feel like a rule.
  4.  **Ignoring Cultural Shifts:** Codifying something can freeze it, preventing organic evolution that *might* have happened.
  5.  **The "Vital but Contested" Trap:** It flags the problem (Step 7) but offers no solution. This is the limit of the framework.
  6.  **False Certainty:** It presents judgment calls (e.g., "significant harm", "broadly accepted") as discrete steps. Teams might disagree on these thresholds.

  **Applying the Procedure to Your Cases:**

  **Case 1: Channel Specificity (Deprecated Tool)**
  1.  **Exists?** Yes. Consistent behavior observed, silence on deviation.
  2.  **Coordination Problem?** **YES.** Avoids topic chaos in channels. Could use a different channel? Arbitrary but sticky solution.
  3.  **Health & Risk?** Newcomers stumble (get silence). Convention seems healthy (long-timers follow it smoothly). **Low codification risk.**
  4.  *(Skip - Passed 3)*
  5.  *(Skip - Not Enforced Norm)*
  6.  *(Skip)*
  7.  *(Skip)*
      **-> Outcome: Codify with Descriptive Framing.** "Questions about [Deprecated Tool] are typically discussed in #legacy-tools-channel to keep the main channels focused. Jump in there!" (Place in Tips/Conventions).

  **Case 2: Emoji-Reaction "Thanks"**
  1.  **Exists?** Yes. Widely used, some offense at absence.
  2.  **Coordination Problem?** **NO.** It signals acknowledgment, but silence or other reactions *could* work just as well without chaos. It's a social habit that *became* expected. **-> Habit/Preference.**
  3.  *(Skip - Failed 2)*
  4.  **Harm > Rigidity Risk?** *Harm:* Some offense/feelings hurt. *Harm Reducible by Writing?* Unlikely (might make expectations *more* rigid, increase pressure/resistance). *Rigidity Risk:* High (turns nice habit into obligation). **Harm reduction < Rigidity Risk.**
  5.  *(Skip - Not Enforced Norm)*
  6.  *(Skip)*
  7.  *(Skip)*
      **-> Outcome: Don't Codify.** Address it culturally: A mod/popular member could occasionally say in general chat, "Hey, just FYI, when I react with 👍, it just means 'seen it, thanks!' No pressure for anyone else!" Or react that way visibly to others' posts.

  **Case 3: Self-Promotion (Contested Enforcement)**
  1.  **Exists?** Yes. Behavior (promotion) is observed, enforcement (deletion) happens.
  2.  *(Skip - Enforced Norm check supersedes)*
  3.  *(Skip)*
  4.  *(Skip)*
  5.  **Enforced?** **YES.** (Deletions, bans).
  6.  **Consistent & Accepted?** **NO.** Enforcement exists but is contested (~40% dissent). *Vital?* **YES.** Core to preventing spam and maintaining focus on retro computing discussion vs. advertising. **-> HIGH RISK / Values Conflict.**
  7.  **Values Conflict Flag:** **HAND BACK TO MODS.** Codification *will* formalize the current practice as "the rule," declaring winners/losers and likely escalating conflict. The procedure says: *You must decide based on core values.* Is this server primarily a *discussion forum* (stricter rules needed) or a *creator hub* (more leniency needed)? Principle vs. popularity? Compromise possible? (e.g., dedicated #self-promo day/channel with clearer rules). This isn't a classification issue anymore; it's a policy decision about the server's identity. The procedure can't make this call.

  **What the Lewis Framework (and this Procedure) Can't Do:**

  1.  **Resolve Values Conflicts:** It brilliantly distinguishes coordination problems (Conventions) from enforced rules (Norms) and mere habits. But when an *enforced norm* is **contested**, the framework only identifies the impasse. It doesn't tell you *which* value (anti-spam purity vs. creator support) should win. That's a leadership decision based on the server's purpose.
  2.  **Dictate Severity:** It helps classify the *type* of regularity and assess codification *risks*, but it doesn't tell you how harsh a rule's punishment should be.
  3.  **Predict the Future:** It helps assess the *risk* of codification changing behavior, but can't guarantee the outcome. The act of writing can sometimes *create* the expectation it seeks to describe.
  4.  **Replace Mod Discretion:** Judgment calls are baked into several steps. The procedure structures the *discussion* and highlights *risks*, but doesn't eliminate the need for mods to use their best judgment based on context and knowledge of their specific community.

  **Key Takeaway for Mod Calls:** Use the procedure *first* to classify the candidate and identify risks. For Conventions (Case 1), it usually provides a clear, low-risk path. For Habits (Case 2), it usually advises against codification. For contested Enforced Norms (Case 3), it quickly flags the **values conflict** and forces the team to have *that* discussion ("What *is* this server for?") instead of endlessly debating classification. This should significantly shorten those 2-hour calls by providing structure and exposing the real crux of the issue faster.
