prompt: |-
  I've been trying to work out what I actually believe about supererogation by listing my gut verdicts on cases, and I want to know whether any single principle captures them.

  The passer-by who wades in and ruins a £300 coat to pull a child from a canal: he had to do it — required, not supererogatory. The soldier who throws himself on a grenade to shield his squad: heroic, but I would never say he failed in duty by not doing it — the paradigm case. The stranger who donates a kidney to someone on the transplant list: supererogatory. Someone who could donate that kidney and doesn't: I don't blame him — yet I would blame someone who let a child drown rather than ruin a coat, and the kidney saves a life too. The colleague who promises to donate and then backs out: now somehow blameworthy, as though the promise converted the supererogatory into the obligatory. The man who runs back into a burning house for a neighbour's cat and takes serious burns: I want to call it supererogatory, but I also feel it was, strictly, imprudent rather than admirable, and I can't get those two reactions to sit together. Finally, the person who lives on subsistence wages and gives everything else to famine relief: each day's gift seems too small to be beyond duty, yet the whole life is plainly more than duty can demand, and I don't know what to say about the aggregate.

  My tentative principle is a cost-threshold one: duty extends to whatever sacrifices fall short of some severe level of loss — a ruined coat lies inside the threshold, a kidney or a life outside it — and supererogation occupies the region beyond it where acts remain praiseworthy. Please make that principle precise, test it against my cases, and repair it where it fails. In particular, tell me what your repaired principle says about (a) a rescuer who makes many small sacrifices that accumulate, over a lifetime, into a very large one, and (b) someone who does only what duty requires but with such a generous spirit that we admire her more than we admire a grudging supererogator — can attitude alone generate merit beyond duty? And be honest about which of my verdicts the best available version of the principle simply cannot save, and which verdict you would counsel me to surrender.

  Please write your answer in British English.
reasoning: |-
  Hmm, the user is grappling with supererogation - that tricky philosophical concept about actions that are good but not obligatory. They've laid out several intuitive cases where they feel conflicted about whether something is required or goes beyond duty, and they're proposing a cost-threshold principle to explain their judgments. 

  Let me unpack their scenarios first. The coat-ruining rescue feels obligatory to them, while the grenade-jumping soldier is the classic supererogatory case despite similar life-saving stakes. The kidney donation puzzle is particularly interesting - they don't blame non-donors yet do blame coat-savers, even though both involve saving lives. The promise element adds another layer where commitment seems to transform the act's moral status. And that cat rescue case reveals their discomfort when admirable intentions meet questionable prudence. 

  Their tentative cost-threshold model makes psychological sense - we do intuitively weigh sacrifices when judging obligations. But the accumulated-small-sacrifices case and the attitude question poke serious holes in it. If someone gives £5 daily to charity, no single act breaches their threshold, but a lifetime total might equal a kidney's value. And can't a warm-hearted duty-fulfiller be more virtuous than a resentful saint? 

  I need to refine this principle carefully. The threshold can't be purely material - it must account for proportionality (coat vs coat+life), accumulated impact, and relational contexts (promises create duties). For the aggregate problem, I'm considering a "lifetime burden ceiling" concept where small acts cross no individual threshold but collectively exceed what we can demand. The attitude question requires separating act-assessment from agent-assessment - supererogation stays act-focused while virtue ethics handles the rest. 

  Honestly, some intuitions might need revising. That cat rescue really should be supererogatory despite its foolishness - we can separate the act's moral status from its wisdom. And the colleague who reneges on donation? The blame stems from promise-breaking, not magically converting donation into duty. 

  For the British English request: I'll favour "trousers" over "pants", "jumper" over "sweater", and that lovely construction "have a go at" for criticism. The goal is precision without pedantry - this user clearly values nuanced argument.
answer: |-
  Right, let's have a go at refining your cost-threshold principle to capture your gut verdicts, test it ruthlessly against your cases, and see where it holds or buckles. Your intuition about cost being central is spot-on for many cases, but as your dilemmas show, it needs nuance.

  **Your Tentative Principle (Refined & Precise):**

  > An act is morally required (a duty) if:
  > 1.  It prevents significant harm or secures a significant good for another.
  > 2.  The cost to the agent (understood broadly as *net lifetime burden* encompassing physical harm, psychological distress, severe financial loss, fundamental opportunity loss, or significant curtailment of core life projects) is **proportionate and not severe**.
  >
  > An act is supererogatory if:
  > 1.  It prevents significant harm or secures a significant good for another.
  > 2.  The cost to the agent is **severe** (exceeding the threshold of what can be reasonably demanded, constituting a significant net lifetime burden).
  > 3.  It is performed voluntarily.
  >
  > **Key Clarifications:**
  > *   **Severity Threshold:** This isn't a fixed monetary or physical value, but context-sensitive. It's calibrated by the *magnitude of the good/harm* and the *relationship/role* of the agent. Ruining a £300 coat is disproportionate to letting a child drown (high harm prevented, low cost). Losing a kidney or one's life is inherently severe, disproportionate to saving a stranger's life *absent specific roles*.
  > *   **Net Lifetime Burden:** This captures the *enduring impact* on the agent's life prospects, well-being, and core capabilities.
  > *   **Proportionality:** Duty demands cost only *proportionate* to the good achieved and the agent's relationship to the beneficiary. Saving a stranger's life imposes a lower threshold of required cost than saving one's own child.
  > *   **Voluntariness:** Supererogation must be chosen, not coerced.

  **Testing Against Your Cases:**

  1.  **Coat Ruined Saving Child (Required):**
      *   *Test:* Prevents massive harm (death). Cost (ruined coat): financial loss, but typically not severe net lifetime burden for most. Proportionate? Utterly. Verdict: **Required.** PASS.
  2.  **Soldier on Grenade (Supererogatory):**
      *   *Test:* Prevents massive harm (squad's death). Cost (agent's death): Ultimate severe net lifetime burden. While arguably part of a soldier's *role*, the extreme sacrifice exceeds what duty can demand, even in that role (it's the *paradigm* of heroism beyond duty). Verdict: **Supererogatory.** PASS.
  3.  **Kidney Donation to Stranger (Supererogatory):**
      *   *Test:* Prevents massive harm (death). Cost (losing a kidney): Significant surgery risk, permanent physical alteration, potential future health implications. Constitutes a severe net lifetime burden for most, disproportionate to demand from a stranger. Verdict: **Supererogatory.** PASS.
  4.  **Non-Kidney Donor (Not Blameworthy):**
      *   *Test:* Failing to do a supererogatory act isn't a failure of duty. The cost threshold for *requirement* isn't met. Blame only attaches to failing a *duty*. Verdict: **Not Blameworthy (for not donating).** PASS.
  5.  **Non-Coat Saver (Blameworthy):**
      *   *Test:* Failing a clear duty (low cost, prevent high harm). Verdict: **Blameworthy.** PASS. (Contrast with 4 shows cost threshold working).
  6.  **Colleague Promises Kidney & Backs Out (Blameworthy):**
      *   *Test:* The *promise* creates a specific obligation (duty of fidelity/commitment). Failing *this duty* is blameworthy. The *original act* (donation) remains supererogatory, but the *promise* converted *this specific instance, for this agent, to this recipient* into a duty by creating reliance and a commitment where the cost was presumably accepted as bearable when promised. The severe cost doesn't vanish, but the promise means they incurred a duty *despite* the cost being severe for an ordinary stranger-donation. **Repair:** The principle needs to acknowledge that *incurred obligations* (like promises, contracts, specific roles) can *create duties* that impose costs *beyond* the baseline threshold for strangers. The cost is still severe, but the duty arises from the voluntary commitment, not directly from the harm/good balance alone. Verdict: **Blameworthy (for breaking promise).** PASS (with principle repair).
  7.  **Running Back for Cat, Serious Burns (Supererogatory but Imprudent):**
      *   *Test:* Prevents moderate harm (cat's death). Cost (serious burns): Severe net lifetime burden (pain, scarring, potential disability, medical costs). Highly disproportionate cost for the good achieved. Verdict: **Supererogatory.** PASS on status.
      *   *The Discomfort:* Your reaction highlights that supererogation doesn't automatically imply *wisdom* or *admiration*. An act can be beyond duty yet foolish. We might praise the *intention* (compassion for the cat) but condemn the *recklessness* with one's own welfare. The principle captures the *moral status* (beyond duty), not the *prudential assessment* or overall admirability. You can consistently call it supererogatory *and* criticise it as imprudent.
  8.  **Lifetime Giving to Famine Relief (Aggregate Problem):**
      *   *The Challenge:* Each £5 donation is trivial cost, preventing tiny fraction of harm. Individually, none breach the severity threshold for requirement. Yet the cumulative cost is immense – a life of significant sacrifice, a severe net lifetime burden. Does duty demand each trivial act? Does the aggregate make it supererogatory? This breaks the simple act-by-act model.
      *   **Repair:** We need a **Lifetime Sacrifice Ceiling**. While no *single* small donation is required (cost too trivial relative to the minuscule good *it alone* achieves), there *is* a level of aggregate sacrifice over a lifetime that becomes severe. Duty requires preventing significant harm *up to the point* where further prevention would impose a severe net lifetime burden *cumulatively*. Living on subsistence while giving all else likely exceeds this ceiling. Therefore:
          *   *Each small gift:* Not *individually* required (no significant harm prevented by *that* £5 alone, trivial cost). Not supererogatory either (trivial good achieved).
          *   *The pattern of giving:* When sustained to the point where cumulative cost becomes severe, *constitutes* a supererogatory life or commitment *beyond* what duty demands. Duty requires giving *some* aid, perhaps significantly, but not to the point of self-immolation. Crossing the *ceiling* makes the *extent* of giving supererogatory.

  **Addressing Your Specific Queries:**

  a)  **Accumulated Small Sacrifices (Lifetime Giver):**
      *   *Repaired Principle Says:* Duty requires acting to prevent significant harm/gain significant good *only when the cost of that specific act (or the cumulative cost up to that point) remains below the severe net lifetime burden threshold*. An individual small sacrifice is rarely required *on its own* (fails condition 1 - significant harm prevented). However, the *aggregate pattern* of giving, once it pushes the agent's cumulative cost into the "severe burden" zone, becomes supererogatory *as a whole*. Duty demands generosity *up to* that ceiling, not beyond it. The lifetime giver exceeds the ceiling.

  b)  **Attitude Generating Merit (Grudging vs. Generous Fulfiller):**
      *   *Repaired Principle Says:* **No, attitude alone cannot make an act supererogatory.** Supererogation is defined by the *act* (significant good achieved) and its *cost* (severe burden). Fulfilling a duty with a generous spirit is morally *better* than fulfilling it grudgingly – it reflects greater *virtue* (benevolence, commitment) in the agent. We *admire the agent more*. But the *act itself* remains merely dutiful. The grudging supererogator performs an act *beyond* duty, even if we dislike their attitude. The principle assesses the *act's status* (required, optional, beyond duty), not the *agent's virtue* in performing it. You can have virtuous dutiful acts and vicious supererogatory acts (e.g., donating a kidney for fame).

  **Verdicts the Principle Cannot Save (and Advice):**

  1.  **The Cat Rescue Discomfort:** The principle *can* save the verdict (supererogatory). Your discomfort stems from conflating moral status with prudence/admirability. I counsel you to **surrender the need to call it "admirable"** simply because it's supererogatory. It can be supererogatory *and* foolish. Separate the moral category from the overall evaluation.
  2.  **Lifetime Giving - Individual Acts:** The principle *cannot* comfortably call each small gift "supererogatory" individually – they are too trivial. It forces us to look at the *aggregate pattern* and *ceiling*. I counsel you to **surrender the idea that every charitable act must be clearly classed as required or supererogatory on its own.** Some acts are simply morally neutral or mildly good components of a larger pattern that *becomes* supererogatory in aggregate. Focus on the life commitment exceeding the duty ceiling.
  3.  **Attitude Merit:** The principle *cannot* make the generous dutiful act supererogatory. I counsel you to **surrender the idea that 'supererogatory' applies to the agent's attitude or virtue.** Reserve it for the *act type* defined by cost and good. Admire the virtuous dutiful agent deeply, but recognise their *act* was required. The supererogatory *act* remains beyond duty, even if done sourly.

  **Final Repaired Principle (British English phrasing):**

  > An act is morally required if (a) it prevents significant harm or secures a significant good for another, and (b) the net lifetime burden it imposes on the agent is proportionate to the good achieved and does not reach a severe level (considering context, role, and existing commitments). An act is supererogatory if (a) it prevents significant harm or secures a significant good for another, (b) it imposes a severe net lifetime burden on the agent, and (c) it is done voluntarily. Crucially, a pattern of acts whose *cumulative burden* becomes severe also constitutes a supererogatory commitment. While fulfilling duties virtuously merits praise for the *agent*, it does not alter the *act's* status from required to supererogatory.

  This principle captures most of your intuitions, especially the core contrast between the coat and the kidney/grenade, and handles the promise and aggregate cases with the proposed repairs. It requires accepting that the cat rescue is supererogatory (even if daft), that individual tiny donations aren't easily categorised alone, and that true supererogation lies in the costly *act* (or overall costly commitment), not in the spirit of fulfilling existing duties.
