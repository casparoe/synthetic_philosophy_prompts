prompt: |-
  I'm a PhD student in comparative politics, working on anti-corruption reform, and I've started keeping a list of my supervisor's verdicts because he insists that "corruption" has a clear core that every reasonable person can recognise, and I'm increasingly not so sure. His calls so far, all delivered with total confidence over coffee:

  - a customs officer taking cash to wave through a shipment thats actually legal: corrupt.
  - a mayor hiring his sister's not-particularly-competant son over a clearly better-qualified stranger, no money involved at any point: corrupt.
  - a village official who helps local families with their paperwork all year and recieves sacks of rice and bottles of liquor at harvest, at a level everyone in the district considers normal: not corrupt.
  - a former regulator who, years after leaving office, accepts a very generous retirement gift from a firm she had supervised, which never got anything from her it wasn't entitled to: not corrupt.
  - an official demanding "speed money" to issue a licence the applicant is legally entitled to anyway: corrupt.

  Next week we meet to discuss a case for my thesis chapter: a procurement officer accepts an expensive hunting rifle from a firm just before a tender opens, nothing is said, no promises are made, and the firm then wins anyway with what everyone agrees was objectively the best bid. I want to walk into that meeting with a prediction of what he'll say. But honestly I'm less interested in the right answer than in what rule he's actually running -- I can see at least two that fit his track record equally well -- what each one predicts about the rifle case, your best guess as to his verdict, and what further case I could put to him that would actually split the rules apart. He despises hypotheticals, so the splitting case has to sound like something from a real audit report, not a trolley problem.

  Please answer in British English and keep it under 450 words -- this goes in my fieldnotes, not an essay.
reasoning: |-
  Okay, the user is a PhD student in comparative politics focusing on anti-corruption reform. They're compiling their supervisor's verdicts on various corruption scenarios because the supervisor believes corruption has a clear core definition that everyone recognizes. The student is skeptical and wants to understand the underlying rule the supervisor uses, especially for an upcoming case involving a procurement officer and a hunting rifle.

  First, I need to analyze the supervisor's past judgments to identify patterns. The customs officer taking cash to wave through a legal shipment is corrupt. The mayor hiring his sister's son over a more qualified candidate without money involved is also corrupt. But the village official receiving rice and liquor as a customary gift isn't corrupt. The former regulator getting a retirement gift from a firm she regulated, with no favors, isn't corrupt. The official demanding "speed money" for a legal license is corrupt.

  Looking at these, the common thread seems to be whether there's an explicit or implicit exchange of benefits. In the corrupt cases, there's a clear quid pro quo: cash for ignoring procedures, nepotism for personal gain, or payment for services that should be free. The non-corrupt cases involve cultural norms (rice and liquor as gifts) or post-tenure gifts with no evidence of influence.

  For the hunting rifle case, the firm gives an expensive gift before a tender, no promises are made, and they win with the best bid. If the supervisor's rule is about explicit exchanges, he might say not corrupt. But if it's about potential influence, he might say corrupt. I think he'll lean towards corrupt because the timing is suspicious, and the gift could be seen as an implicit bribe.

  To split these rules, the student needs a real-world case where there's no explicit exchange but clear influence. An example could be an official accepting expensive gifts from multiple bidders, all losing to an unconnected winner. If the supervisor calls this corrupt, he's focusing on the act itself. If not, he's requiring proof of influence. Another scenario is a non-monetary favor, like a relative getting a job after a gift, but with plausible deniability. That tests if he prioritizes outcomes or actions.

  The student needs concrete examples from audit reports. Possible cases: reciprocal gift-giving that's disproportionate, or favors without direct links. The key is to force a choice between actions implying corruption versus requiring proven influence. This will clarify the supervisor's underlying principles for their thesis.
answer: |-
  Right then. Your supervisor's rulings suggest he's applying a **"quid pro quo expectation" rule**: corruption occurs when there's a *specific, identifiable exchange or understanding* that the official's action (or inaction) is directly influenced by a personal benefit received, **or** when the benefit itself is an *explicit demand* violating rules.

  **How it fits his track record:**
  1.  **Customs Officer (Cash for wave-through):** Explicit exchange (cash for ignoring potential checks, even if shipment legal). **Corrupt.**
  2.  **Mayor (Nepotistic hire):** Implied exchange (job for family loyalty/benefit). Specific favour granted. **Corrupt.**
  3.  **Village Official (Customary gifts):** No *specific* exchange tied to *individual* acts; seen as diffuse reciprocity/cultural norm. **Not corrupt.**
  4.  **Former Regulator (Post-tenure gift):** No *exchange* (gift after duties ended, no favours granted). **Not corrupt.**
  5.  **Official (Speed money demand):** Explicit demand for payment to perform routine duty. **Corrupt.**

  **Prediction for the Rifle Case:**
  He'll likely call this **corrupt.** The timing is highly suspect (just before tender), the gift is valuable and personal (hunting rifle), and creates a clear *suspicion* of an *implicit understanding* – the gift secures fair consideration or goodwill, even if the bid was objectively best. The lack of explicit promise doesn't erase the implied *expectation* of favourable treatment inherent in the context.

  **Alternative Rule & Why Quid Pro Quo Expectation Fits Better:**
  An alternative might be "**undue influence/potential conflict of interest**" regardless of explicit exchange. However, this would likely class the *Village Official* (routine gifts) and *Former Regulator* (gift linked to past regulated entity) as corrupt too. He didn't. The "quid pro quo expectation" rule explains *why* those aren't corrupt (no *specific* exchange) while the Rifle case is (implied exchange for favourable treatment in the *specific* upcoming tender).

  **Splitting Case (Audit Report Style):**
  Present this: **"A mid-level planning official regularly receives modest, unsolicited gifts (e.g., premium tea, fruit baskets) from various construction firms *unrelated to any specific project or decision cycle*. One such firm, having given gifts previously, later submits the objectively lowest bid on an unrelated infrastructure project and wins fairly. No communication about the project occurred during gifting."**

  *   **Under 'Quid Pro Quo Expectation':** Likely **Not Corrupt.** Gifts are diffuse, unsolicited, not tied to specific actions or decisions. No evidence of an exchange understanding.
  *   **Under 'Undue Influence/Potential COI':** Might be **Corrupt.** The gifts create an ongoing relationship and potential favouritism, even if the winning bid was fair *this time*.

  **Your Best Next Step:** If he calls the Rifle case corrupt (as predicted), immediately ask: "So the critical distinction is the *implied understanding* tied to the *specific upcoming decision*, rather than just the existence of the gift or a general relationship?" His answer will confirm or refine the rule. Follow up with the splitting case to probe the boundaries of "specific exchange" versus "general influence". Good luck with the meeting.
