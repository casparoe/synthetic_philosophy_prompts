prompt: |-
  My cousin has very strong opinions about when a promise actually obligates you and I've been keeping track of her calls bc I can't fully pin down the rule she's using. So far: a promise to drive a friend to the airport binds even when it becomes really inconvenient; a promise made at gunpoint doesn't bind; a promise the other person tricked you into doesn't bind; an obvious joking promise between friends ("I swear I'll never let you down, buddy") doesn't bind; a promise to a little kid binds extra hard actually; a promise you never intended to keep when you said it still binds (she says the words bind you, not what was going on in your head); and a promise to keep a dead friend's secret still binds, even though the friend can't be harmed by you breaking it and can't rely on you anymore. Family dinner next week, and I know these will come up: I promised my late grandmother I'd visit her grave every year, I promised myself (out loud, but nobody heard) that I'd quit vaping, and years ago I drunkenly promised a guy at a party I'd name my first kid after him. Is she going to say those bind me? What rule do you think she's actually running, what other rules fit her record just as well, and which case should I bring up at dinner to figure out which rule it really is?
reasoning: |-
  Okay, the user is trying to figure out their cousin's rule for when a promise is binding. They've listed several scenarios where the cousin has strong opinions. Let me start by looking at each case they mentioned.

  First, driving a friend to the airport even when inconvenient still binds. That suggests the cousin values commitment over personal cost. Then, a promise at gunpoint doesn't count, which points to coercion invalidating the promise. If someone tricks you into a promise, it's not binding, so deception matters. Joking promises between friends aren't binding, so intent and context are key here.

  Promises to kids bind extra hard. That's interesting. Maybe because kids are more vulnerable or trusting. A promise you never intended to keep still binds, which emphasizes the spoken words over internal intent. That's a big one. And keeping a dead friend's secret binds even though they can't be harmed. So obligation persists beyond the promisee's existence.

  Now the user has three new scenarios: promising a late grandmother to visit her grave, promising themselves to quit vaping (out loud but unheard), and a drunken promise to name a kid after someone. The user wants to know if these bind and what rule the cousin uses.

  The cousin's rule seems to focus on the validity of the promise's creation. Factors like coercion, deception, and context (like joking) make a promise invalid. But once validly made, circumstances like inconvenience or the promisee's death don't release obligation. Also, the recipient matters—kids get extra weight. Internal intent doesn't matter; it's about the words spoken.

  For the new cases: the grandma promise should bind because it was validly made. The self-promise might not bind since there's no other party involved. The drunken promise could be tricky. Was it a valid context? If the guy took it seriously and it wasn't coerced, it might bind, but drunkenness might affect validity.

  Alternative rules could include different weight on intent or context. For example, some might think internal intent matters, or that changing circumstances negate the promise. To test, the user could bring up the drunken promise at dinner. The cousin's response could reveal if context or intoxication invalidates it. Also, asking about the self-promise might clarify if an audience is necessary. If the cousin says the self-promise doesn't bind, that confirms the need for another party. If intoxication voids the promise, that adds a new factor.

  The user's deeper needs might be understanding family dynamics, avoiding arguments at dinner, or preparing counterpoints. They might also want to connect with the cousin by showing interest in her philosophy. Testing the rule with edge cases helps them engage meaningfully.
answer: |-
  Based on your cousin's established pattern, here's the breakdown for your upcoming scenarios and the likely rule she follows:

  ### Predictions for Your Promises
  1.  **Promise to your late grandmother:** **Binds.** Her stance on the dead friend's secret strongly indicates that the death of the promisee does *not* dissolve the obligation. The promise was validly made (no coercion, deceit, joking), so the obligation persists.
  2.  **Promise to yourself (out loud, unheard):** **Does NOT bind.** Her focus is on commitments *to others*. A "promise to yourself" lacks the essential element of an obligation *owed to another person*. The words were spoken, but without a recipient who can rely on or be affected by it, it doesn't create a binding promise in her system.
  3.  **Drunken promise at a party:** **Likely Does NOT Bind (but context matters).** This is the most ambiguous. Her rule likely considers *contextual validity*. Extreme intoxication could be seen as impairing your capacity to form a genuine commitment, similar to coercion or deceit undermining the promise's validity. If the context was clearly unserious (wild party, everyone laughing, absurd request) it might fall under the "obvious joking promise" category. However, if the guy seemed genuinely earnest and you appeared coherent enough, she *might* argue it binds. *Leaning heavily towards "does not bind" based on contextual invalidity.*

  ### The Likely Rule: "Valid Creation Creates Obligation"
  Your cousin's core principle appears to be:
  *   **A promise creates a binding moral obligation if it is *validly created* in a context free from fundamental defects (coercion, significant deception, recognized joking, or potentially severe incapacity like extreme intoxication). Once validly made, the obligation persists regardless of subsequent inconvenience, the promisee's status (like being a child or being deceased), changes in your intent *after* the fact, or even your *initial* secret lack of intent.**

  ### Key Components of Her Rule
  1.  **Focus on Creation Validity:** The binding force hinges entirely on the circumstances *when the promise was made*. Was it free, informed, intentional (in the sense of performing the speech act), and within a context where promises are taken seriously?
  2.  **Defects Invalidate:**
      *   **Coercion (gunpoint):** Removes freedom.
      *   **Significant Deception:** Removes informed consent.
      *   **Recognized Joking Context:** Indicates the speech act wasn't genuine commitment.
      *   *(Likely)* **Severe Incapacity:** Prevents genuine intentional action (e.g., extreme intoxication).
  3.  **Obligation Persists Despite Consequences:** Inconvenience, later regret, or even the death of the promisee do *not* dissolve an obligation once validly created.
  4.  **Words Over Secret Intent:** The external act of promising (the words spoken in a valid context) creates the obligation, *not* your private mental state at the time. Lying when you promise is morally wrong *because* you broke the promise, not because the promise was invalid.
  5.  **Recipient Matters for Weight, Not Validity:** Promises to vulnerable parties (like children) impose a *stronger* duty of care due to their reliance, but the *basic validity* of the promise creation follows the same rules. The promise is still binding to an adult, just perhaps with less severe consequences for breaking it.

  ### Alternative Rules That *Almost* Fit (But Don't)
  1.  **"Reliance Creates Obligation":** Focuses on whether the promisee reasonably relied on the promise to their potential detriment.
      *   *Why it fails:* She says the promise to the *dead friend* still binds, even though they cannot rely or be harmed. The *creation* of the promise itself creates the duty, not the subsequent reliance.
  2.  **"Intent Creates Obligation":** Focuses on the promisor's true intent at the time.
      *   *Why it fails:* She explicitly says a promise you *never intended* to keep still binds. The external act matters, not the secret intent.
  3.  **"Utilitarian Binding":** A promise binds only if keeping it creates more good/happiness than breaking it.
      *   *Why it fails:* The airport example (inconvenience doesn't dissolve it) and the dead friend example (no tangible good achieved by keeping) contradict this. Obligation persists despite consequences.
  4.  **"Only Binding if Reciprocity Possible":** Obligation lasts only as long as the promisee can reciprocate or hold you accountable.
      *   *Why it fails:* The dead friend example directly contradicts this.

  ### The Best Test Case for Dinner: The Drunken Promise
  *   **Why it's ideal:** It directly probes the "contextual validity" and "capacity" aspects of her rule, which are implied but not explicitly covered by your existing list. Her response will clarify:
      *   Does context (drunken party) inherently undermine validity like joking?
      *   Does intoxication level matter? (Mild buzz vs. blackout).
      *   Does the *other person's* perception matter? (If the guy seemed to take it seriously).
      *   Is there an exception for "absurd" promises?
  *   **How to Present It:** "Hey, thinking about your promise rules... what about that time I got hammered at Jake's party years ago and apparently promised some guy I'd name my kid after him? Does that crazy drunk 'promise' actually bind me? Where does that fit?"

  ### Secondary Test Case: The Promise to Yourself
  *   **Why it's good:** Explicitly tests the necessity of a *second party* recipient. Her answer will solidify if the obligation is fundamentally relational (owed *to* someone) or can be a duty to oneself.
  *   **How to Present It:** "What about promises you make *to yourself*? Like when I said out loud, 'I promise myself I'll quit vaping'? Does that count as a binding promise in your system, even though no one else heard it?"

  By presenting the **drunken promise** first, you directly challenge an edge case related to validity during creation. Her answer will likely confirm or refine the "valid creation" rule and clarify how factors like context and capacity fit in. Following up with the **promise to yourself** will solidify the requirement for a second party. Good luck at dinner – this is fascinating philosophical territory!
