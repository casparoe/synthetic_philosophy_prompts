prompt: |-
  I chair the ethics committee of a mid-sized humanitarian agency working in conflict zones, and I need to convert an unresolved philosophical dispute into something a field team leader can actually use. Our teams repeatedly face decisions of a single shape: an action available to us would foreseeably harm a small number of identifiable people — as a means, or as a side effect — in order to prevent a larger harm to others. Diverting a food shipment from one displaced camp to a larger one; hiring a militia's men as convoy guards, which funds an attack they will launch anyway; handing a local commander the names of three families to save a quarter of the town; pulling five stable patients off a generator to run the theatre for thirty blast casualties. My staff split between a roughly consequentialist instinct and a conviction that some things must not be done even to prevent worse, and our existing code simply forbids "using beneficiaries as means," which settles nothing they actually argue about. What I want the procedure to confront honestly is the paradox of deontology: if our reason for forbidding the five killings is that each person matters equally, it looks incoherent to stick by the constraint when the numbers grow lopsided; but if the constraint yields once the stakes are high enough, it is unclear what the threshold is or why it is where it is.

  Please design a decision procedure — a written protocol in words, with ordered steps — that a team leader could run in fifteen minutes under stress, with a colleague and a satellite phone and nothing else. It should cover: how to classify the harm our action would involve (what we do versus what we allow, using someone as a means versus harming them as a side effect, redirecting a threat versus creating a new one) and whether those distinctions should survive into the procedure at all; what counts as a sufficient answer at each step; the points at which the procedure returns an outright no regardless of the arithmetic; the points at which the arithmetic enters and how; and the places where the procedure must visibly give up and hand the decision to a person because the question is one of judgement that cannot be proceduralised — these should be flagged rather than hidden.

  One requirement above all: do not bracket the theoretical dispute. Commit to a definite position — that the relevant constraints are absolute; or that they are thresholded, in which case say what kind of threshold it is and how a field team could estimate which side of it a case falls on; or that they are conditional on something else, in which case say on what — and build the procedure on that commitment. Explain what your choice costs: where it will misfire, what cases it gets wrong, and what a committee member who rejected your starting position would say is the procedure's worst blind spot. Then run the procedure on three of the cases above, including at least one where it returns an answer you expect me to dislike, and say so plainly when it does.

  Please write in British English, and keep the procedure usable by someone with no philosophical training: any technical distinctions must be introduced inside the protocol itself, in plain terms, as part of the steps.
reasoning: |-
  Hmm, the user chairs an ethics committee for a humanitarian agency in conflict zones and needs a practical decision procedure for field teams facing tough dilemmas. They're stuck between consequentialist and deontological approaches, particularly around harming a few to save many. Their current "don't use beneficiaries as means" rule isn't resolving actual disputes.

  The core tension is the paradox of deontology: if we value each life equally, why not sacrifice few to save many? But if constraints collapse under pressure, where's the threshold? The user wants a 15-minute protocol usable with just a colleague and satellite phone, that explicitly commits to a philosophical stance rather than bracketing it.

  Key requirements:
  - Must classify harms (means/side-effect, doing/allowing, redirecting/creating threats)
  - Specify when arithmetic enters and when it's overridden
  - Flag where judgment is unavoidable
  - Admit where the procedure will misfire
  - Test on 3 cases including unpopular outcomes

  I'm considering a threshold deontology approach since absolute constraints crumble in mass-casualty scenarios but pure utilitarianism violates core humanitarian principles. The threshold should be based on catastrophic harm prevention - not just "more lives" but preventing systemic collapse.

  For the procedure:
  1. Establish necessity (no better options)
  2. Classify the harm type
  3. Apply absolute bars (e.g., no intentional killing)
  4. Check if threshold met (catastrophic harm prevention)
  5. If threshold passed, do utilitarian calculus
  6. If not, prohibit action

  This will misfire in cases where catastrophic harm is narrowly averted by violating constraints (e.g., sacrificing one to prevent genocide when it's actually 99.9% likely anyway). Opponents would say it's arbitrary where we set "catastrophe."

  Testing cases:
  - Food diversion: Proportional harm? Probably allowed
  - Hiring militia: Funding harm as means? Absolute bar
  - Handing names: Intentional sacrifice? Prohibited
  - Generator case: Side-effect harm? Allowed if catastrophic stakes

  For the generator case specifically: Pulling stable patients off life support to save trauma victims involves foreseeably causing death as side-effect (not means). If 30 blast casualties would die otherwise versus 5 stable patients, that likely meets the catastrophe threshold. The procedure would permit it - an outcome the user might dislike as it still sacrifices identifiable lives.

  The trade-off: We protect against exploitation of individuals except when preventing wholesale destruction. But "catastrophe" requires judgment - that's where we put the burden on human discretion.
answer: |-
  Here is a **Field Ethics Assessment Protocol (FEAP)**, designed for rapid use in crisis situations. It commits to **Thresholded Deontology**: constraints against harming individuals as a means are strong but can be overridden *only* to prevent catastrophic, large-scale harm. The threshold is **preventing imminent, irreversible collapse of essential community functioning** (e.g., mass starvation, epidemic outbreak, or systematic slaughter). This is distinct from merely "saving more lives."

  **Core Principles Embedded:**
  1.  **Do Not Intentionally Harm as a Means:** Directly using a person's suffering/death *as the tool* to achieve your goal is prohibited unless the catastrophe threshold is met.
  2.  **Foreseeable Harm as a Side Effect:** Causing harm you foresee but don't *intend* as the method (e.g., diverting resources) is still deeply concerning but has greater flexibility.
  3.  **The Catastrophe Threshold:** Overriding constraint 1 is permitted *only* when avoiding the action would *directly enable* the imminent, irreversible collapse of a community's ability to survive or maintain basic order (e.g., total loss of food supply, medical collapse for a large group, imminent massacre). It is *not* merely "more people harmed."

  **The FEAP Procedure (15-Minute Timeline):**

  1.  **Confirm Necessity & Immediacy (2 mins):**
      *   Ask: "Is this action *absolutely necessary right now* to prevent immediate, severe harm? Are there *no* alternative actions (even less effective ones) available within the next critical hours that avoid harming identifiable individuals?"
      *   **Sufficient Answer:** "Yes, no alternatives exist, harm is imminent without action." *If "No" or unsure, STOP. Action prohibited.*
      *   **Judgement Call:** Assessing genuine lack of alternatives under pressure.

  2.  **Classify the Harm (3 mins):**
      *   Ask: "Is the harm to the few (the identifiable individuals) **intentionally caused as the direct method** (the *means*) to achieve the good outcome? Or is it a **foreseeable but unintended consequence** (a *side effect*) of trying to achieve the good outcome?"
      *   **Examples:** *Means:* Handing names to a commander *so he kills those specific people* to save others. Hiring militia *specifically so they get paid, knowing they'll use it for an attack.* *Side Effect:* Diverting food shipment *away* from Camp A (harming A) *to* save Camp B. Pulling stable patients off power *to* power the theatre.
      *   **Sufficient Answer:** Clearly state "Means" or "Side Effect". *If "Means", proceed to Step 3. If "Side Effect", proceed to Step 4.*

  3.  **Assess "Means" Harm & Catastrophe Threshold (5 mins):**
      *   Ask: "Would refusing this action *directly allow* an **imminent, irreversible catastrophe**? Specifically: Would it cause the *complete collapse* of essential survival for a large group (e.g., total lack of food leading to mass starvation within days; complete medical system failure causing uncontrolled epidemic/death; allowing a systematic massacre to proceed)? Is this collapse *certain* or *overwhelmingly likely* (>90% probable) if we don't act?"
      *   **Sufficient Answer:** "Yes, specific catastrophe X is imminent/overwhelmingly likely without action." OR "No, severe harm would occur, but not catastrophic collapse."
      *   **Absolute Bar:** *If "No" or unsure, STOP. Action PROHIBITED.* Harming as a means is never allowed except to prevent true catastrophe.
      *   **Judgement Call:** Defining "catastrophe" (collapse) vs. "severe harm". Assessing probability (>90% certainty is a high bar).
      *   ***If "Yes" to catastrophe, proceed to Step 5.***

  4.  **Assess "Side Effect" Harm & Proportionality (3 mins):**
      *   Ask: "Is the **harm to the few significantly disproportionate** to the **good achieved for the many**? Consider: Severity of harm (death, permanent injury, extreme suffering vs. lesser harm), number affected, and whether the good *directly prevents severe suffering or death* for the many. Is the harm *necessary* for the good, or could less harm be done?"
      *   **Sufficient Answer:** "Harm is proportionate: Good significantly outweighs harm in severity/scale/necessity." OR "Harm is disproportionate: Harm is too severe/not necessary/outweighed."
      *   **Absolute Bar:** *If "Disproportionate", STOP. Action PROHIBITED.*
      *   ***If "Proportionate", proceed to Step 5.***
      *   **Judgement Call:** Balancing severity/scale/necessity under stress.

  5.  **Final Sanity Check & Authorisation (2 mins):**
      *   Ask: "Does this action **violate core humanitarian principles** (humanity, impartiality, neutrality, independence) in a way that *irreparably damages* our mission's legitimacy or ability to operate? Is there any *unavoidable betrayal of direct, explicit promises* made to the individuals harmed?"
      *   **Sufficient Answer:** "No irreparable damage to principles/mission/core promises." OR "Yes, irreparable damage/betrayal."
      *   **Absolute Bar:** *If "Yes", STOP. Action PROHIBITED.*
      *   *If "No", Action is PERMITTED.*
      *   **Judgement Call:** Assessing mission integrity and promise-keeping. **CALL HQ via Sat Phone now to report decision and rationale.**

  **What This Costs & Critiques:**

  *   **Commitment Cost:** We chose **Thresholded Deontology**.
      *   **Cost 1 (Consequentialist Critique):** This will *not* maximise lives saved in some non-catastrophic scenarios. We will sometimes forbid actions that could save net lives (e.g., sacrificing 1 to save 5) if it involves using them as a *means* and the stakes fall below the catastrophe threshold. A pure consequentialist would say this is irrational and costs lives the agency could have saved. *The procedure's worst blind spot (for them):* Letting 5 die because we can't sacrifice 1 person *as the means* to save them, even if no catastrophe threshold is triggered (e.g., the generator case *if* reclassified as 'means').
      *   **Cost 2 (Absolutist Deontologist Critique):** We *allow* violating the constraint against using people as means *if* the catastrophe threshold is met. An absolutist would argue this destroys the moral foundation, making us complicit in intentional harm. The threshold is arbitrary and will be abused/slippery. *The procedure's worst blind spot (for them):* Permitting any intentional harm as a means (e.g., handing over names) if a commander credibly threatens catastrophe, opening the door to extortion and moral corruption.
      *   **Cost 3 (Threshold Definition):** Defining "catastrophe" (imminent, irreversible collapse) is inherently difficult and situation-specific. Field teams might underestimate or overestimate this threshold under stress. The >90% certainty bar might be too high/too vague.

  **Application to Cases (Using FEAP):**

  1.  **Hiring a militia's men as convoy guards, funding an attack they'll launch anyway.**
      *   Step 1: Necessary? (Assume yes, convoy vital, no alternatives). Proceed.
      *   Step 2: **Harm Classification:** Is funding the attack *the means* to getting guards? **YES.** Paying them *is how* we secure guards, and we *know* payment *directly enables* their attack. Harm is *intended as the method* (payment for service) even if we wish the attack didn't happen. **MEANS.**
      *   Step 3: Catastrophe Threshold? Is *not* hiring them going to cause *imminent, irreversible community collapse* (catastrophe)? Preventing convoy theft is vital, but unlikely to constitute *total systemic collapse* (catastrophe) on its own. **NO.**
      *   **OUTCOME: PROHIBITED.** (*An absolutist would agree, a consequentialist might dislike this if convoy is critical.*)

  2.  **Pulling five stable patients off a generator to run the theatre for thirty blast casualties.**
      *   Step 1: Necessary? (Assume yes, theatre needed *now* for 30, no alternative power). Proceed.
      *   Step 2: **Harm Classification:** Is the death of the 5 *the method* of saving the 30? **NO.** The *method* is redirecting power. The death of the 5 is a *foreseeable side effect* of depriving them of power. **SIDE EFFECT.**
      *   Step 4: Proportionality? Harm: Death of 5 stable patients. Good: Saving 30 blast casualties likely to die otherwise. Preventing 30 deaths vs causing 5 deaths. Severity is high both sides, but scale (30>5) and necessity (power *is* needed for theatre) suggest **Proportionate.**
      *   Step 5: Core Principles? Does this irreparably violate impartiality/independence? Unlikely if based on urgent medical need. No unavoidable betrayal? (Assuming no explicit promise of uninterrupted power). **No irreparable damage.**
      *   **OUTCOME: PERMITTED.** (*A consequentialist agrees. An absolutist might dislike this as intentional killing if they see the act as direct cause, but FEAP classifies it as side-effect. You might dislike permitting the sacrifice of identifiable patients, even as a side-effect.*)

  3.  **Handing a local commander the names of three families to save a quarter of the town.**
      *   Step 1: Necessary? (Assume commander demands this, threatens quarter town). Proceed.
      *   Step 2: **Harm Classification:** Is the killing of the 3 families *the means* to saving the quarter town? **YES.** The commander demands *their specific deaths* as the condition for sparing others. Their death *is the tool* he requires. **MEANS.**
      *   Step 3: Catastrophe Threshold? Would *not* handing over names cause *imminent, irreversible community collapse*? The death of a quarter of the town is horrific, large-scale harm. Is it *catastrophic collapse*? This is the **Judgement Call.** Is it the *total* destruction of the community's survival ability? Or "just" mass murder? If the town has 2000 people, losing 500 is devastating but the community *might* functionally survive. If the town is 400 people, losing 100 might be existential collapse. **Assume team judges: Severe harm, but *not* catastrophic *collapse* (community could potentially regroup/rebuild). Threshold NOT met.**
      *   **OUTCOME: PROHIBITED.** (*A consequentialist would strongly dislike this, potentially sacrificing 500 for 3. An absolutist agrees. You might dislike prohibiting this if the scale feels catastrophically large.*)
      *   ***If*** the team judged the loss of a quarter would *destroy* the town (e.g., trigger total flight, dissolution, complete loss of leadership/function), meeting the catastrophe threshold, Step 5 would then apply (checking principles/promises). If that passed, it *would* be permitted under FEAP.

  **Key Features for Field Use:**
  *   **Clear Binary Steps:** Yes/No questions force decision points.
  *   **Absolute Bars Highlighted:** Clear STOP points (Means without Catastrophe, Disproportionate Side Effect, Violation of Core Principles).
  *   **Judgement Calls Flagged:** Steps explicitly state where subjective assessment is required (Alternatives, Catastrophe, Proportionality, Principles).
  *   **Arithmetic Limited:** Enters only in Proportionality (Step 4) for *side effects*, and *indirectly* in assessing scale for Catastrophe (Step 3). Focus is on *type* of harm and *nature* of threat, not just numbers.
  *   **Philosophy Embedded, Not Lectured:** Distinctions (Means/Side Effect, Catastrophe/Severe Harm) are explained *within* the steps using plain examples relevant to their work.
  *   **Accountability:** Mandatory HQ call documents the decision path taken under the protocol.
