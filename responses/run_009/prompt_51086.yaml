  Okay, the user is a terminology editor for a city planning department dealing with zoning terms that keep ending up in litigation. They're facing issues with terms like "dwelling unit," "accessory structure," and "family" where tighter definitions haven't resolved disputes. They've read Wittgenstein and suspect some categories are based on family resemblances rather than strict criteria. Their challenge is to create a practical procedure for their staff to determine how to define these terms—whether by strict criteria, prototypes with tie-breakers, or open discretion.

  First, I need to understand the core problem. The current approach of tightening definitions isn't working for all terms, especially those that are inherently fuzzy. Wittgenstein's concept of family resemblances suggests that some categories share overlapping features without a single defining essence. For legal contexts, though, ambiguity can lead to litigation, so the user needs a method to decide when to use which approach.

  The user's staff consists of three planners without philosophy backgrounds, so the procedure must be actionable using existing materials like permit histories and inspectors' rulings. The steps should include tests like checking inspector agreement on central cases, analyzing dimensions of disagreement, and identifying the term's purposes in the code. The procedure must also flag when decisions shift from meaning to values, requiring city attorney or council input.

  Key requirements: defensible in court, minimizes gaming by parties, and honest about judgment calls. The user also wants the procedure applied to three specific terms, with at least one outcome they might not like, and to identify where the procedure could misfire.

  For the procedure design, I consider starting with gathering past cases and mapping them to identify core, borderline, and contested instances. Step 1 involves collecting historical data. Step 2 assesses the "Core Agreement Test" to see if inspectors agree on central examples despite borderline disputes. If they do, it suggests the term might be suitable for a prototype-based definition. If not, strict criteria might be necessary, but the user might dislike this for terms like "family."

  Step 3 evaluates "Disagreement Dimensions." If disagreements are multidimensional, it indicates family resemblances, favoring prototype or discretion. Single dimensions might allow strict criteria. Step 4 checks "Purpose Multiplicity" to see if the term serves multiple regulatory goals. Multiple purposes could mean strict definitions cause issues, requiring discretion.

  Step 5 integrates findings to recommend a definition approach. The procedure must clearly state when to escalate to policymakers for value judgments. For "dwelling unit," strict criteria might work due to inspector agreement and clear purposes. "Accessory structure" might need prototypes due to varied cases and purposes. "Family" could require discretion because of multidimensional disagreements and value-laden aspects, which the user might not prefer but aligns with Wittgenstein.

  Potential misfires include misidentifying core cases, underestimating strategic gaming by parties, or over-relying on past data that doesn't predict new cases. Also, prototype lists might be exploited, and discretion could lead to inconsistent rulings. Transparency about these risks is crucial.

  Applying the procedure to each term: For "dwelling unit," core agreement and single dimensions suggest strict criteria. For "accessory structure," varied cases and purposes point to prototypes. For "family," high disagreement and value conflicts necessitate discretion, which the user might resist but is necessary. This honest outcome addresses their request for an unfavorable result.

  Finally, emphasizing the procedure's limitations and the need for clear documentation to defend against litigation. Highlighting where judgment calls occur and ensuring steps are traceable with evidence from existing materials.
answer: |-
  Here's a procedure designed for your team, grounded in Wittgensteinian insights but operationalized for planning departments. It uses *your existing data* (permit history, inspector rulings) to diagnose the "conceptual structure" of a term and recommends a drafting strategy. The procedure has 5 steps, with clear off-ramps to policymakers/lawyers.

  **The Procedure: Diagnosing Definitional Structure (DDS)**

  1.  **Assemble the Corpus:**
      *   **Action:** Gather *all* permit applications, inspector determinations, appeal decisions, board rulings, and litigation records involving the contested term over the past 10-15 years (or as far back as reliable records exist). Create a database/spreadsheet.
      *   **Materials Needed:** Permit database, inspection logs, board minutes, legal case files.
      *   **Output:** A categorized list of cases: Clear "In", Clear "Out", and "Contested/Borderline".
      *   **Judgment Call:** Determining what constitutes a "case" and categorizing borderline ones. Be conservative; when in doubt, flag as borderline.

  2.  **Core Agreement Test:**
      *   **Question:** Do inspectors consistently agree on the classification of *core, unambiguous* examples, even when they disagree on borderline cases?
      *   **Test:** Review the "Clear In" and "Clear Out" cases from Step 1. Look for inspector rulings on these. Is there near-unanimity (>95%)? Are there *any* core examples where classification was disputed?
      *   **Analysis:**
          *   **Pass (High Agreement):** Suggests a stable conceptual core exists. Prototype or criteria-based definition is *possible*.
          *   **Fail (Disagreement on Core):** Indicates deep instability. The category likely lacks shared understanding or serves conflicting purposes. Proceed with extreme caution (likely needs radical revision or discretion).
      *   **Off-Ramp:** If FAIL, flag immediately for City Attorney/Council: "Core meaning disputed; fundamental revision or policy choice needed."

  3.  **Disagreement Dimension Mapping:**
      *   **Question:** When inspectors/boards *disagree* on borderline cases (from Step 1), do their disagreements cluster around *one specific criterion*, or are they spread across *multiple, criss-crossing features*?
      *   **Test:** Analyze the *reasons* given for differing rulings in borderline cases. Code the features cited (e.g., for "Accessory Structure": size, permanence, connection to utilities, use, location relative to main structure, aesthetic impact). Use simple tallying or affinity diagramming.
      *   **Analysis:**
          *   **Single Dimension:** Disagreements primarily focus on one axis (e.g., "Is 501 sq ft a 'Dwelling Unit' when 500 sq ft is the threshold?"). Suggests a criteria-based definition *might* work with careful threshold setting (though gaming risk remains).
          *   **Multi-Dimensional:** Disagreements cite diverse, overlapping features without a clear hierarchy (e.g., "It's small (like accessory) but has plumbing (like dwelling) and is rented (like dwelling) but temporary (like accessory)"). Strong indicator of a "family resemblance" concept. Criteria-based definitions will create loopholes/absurdities. Prototype + Tie-breakers or Discretion is likely needed.
      *   **Off-Ramp:** If Multi-Dimensional AND the term serves high-stakes regulation (e.g., density, safety), flag for City Attorney/Council: "Concept exhibits complex family resemblances; strict criteria risk perverse outcomes or litigation. Policy choice needed on balancing certainty vs. flexibility."

  4.  **Purpose Multiplicity & Conflict Check:**
      *   **Question:** How many distinct regulatory purposes does this term serve in the code? Do these purposes sometimes conflict in borderline cases?
      *   **Test:** List every section of the code where the term is used as a trigger or condition. Identify the *stated or inferable purpose* for each use (e.g., "Dwelling Unit" triggers: density limits (purpose: manage congestion), utility fees (purpose: cost recovery), safety inspections (purpose: life safety), occupancy limits (purpose: health/crowding)).
      *   **Analysis:**
          *   **Single/Synergistic Purpose:** All uses align behind one core goal (rare). Criteria-based definition feasible.
          *   **Multiple Purposes (Generally Aligned):** Purposes are compatible in most cases (e.g., safety & density both discourage overcrowded shacks). Prototype + Tie-breakers may suffice.
          *   **Multiple Purposes (Potentially Conflicting):** Purposes pull in different directions in borderline cases (e.g., "Family" restriction: purpose A = preserve neighborhood character/single-family *feel*, purpose B = avoid overcrowding/health hazards. A large, quiet, unrelated group satisfies B but arguably violates A). This is a major red flag for criteria-based definitions, as they cannot resolve the underlying value conflict. Discretion or a fundamental policy choice is essential.
      *   **Off-Ramp:** If Potentially Conflicting Purposes, flag for City Attorney/Council: "Term serves conflicting regulatory goals; definition cannot resolve underlying policy tension. Clarification of primary purpose/value trade-off required."

  5.  **Synthesis & Recommendation:**
      *   **Action:** Combine results from Steps 2, 3, and 4. Use the decision matrix below. Document the evidence for each step thoroughly.
      *   **Recommendation Matrix:**
          | Core Agreement (Step 2) | Disagreement Dim. (Step 3) | Purpose Check (Step 4) | Recommended Definition Strategy | Why |
          | :---------------------- | :------------------------- | :--------------------- | :------------------------------ | :-- |
          | FAIL                    | *Any*                      | *Any*                  | **Radical Revision / Discretion + Policy Input (Off-Ramp)** | Core instability requires fundamental change. |
          | PASS                    | Single Dimension           | Single/Synergistic     | **Strict Criteria-Based**       | Predictable, core stable, one dimension, aligned purpose. |
          | PASS                    | Single Dimension           | Multiple (Aligned)     | **Strict Criteria-Based** (with caveats) | Core stable, disagreements manageable by criteria; monitor for purpose drift. |
          | PASS                    | **Multi-Dimensional**      | **Multiple (Aligned)** | **Prototype + Tie-Breakers**    | Core stable, but borderline cases complex; tie-breakers manage fuzziness. |
          | PASS                    | Multi-Dimensional          | **Multiple (Conflicting)** | **Prototype + Discretion Clause** | Core stable, complex borderlines, *and* value conflicts; discretion essential for adjudicating conflict. |
          | PASS                    | *Any*                      | **Multiple (Conflicting)** | **Prototype + Discretion Clause (or Off-Ramp)** | Conflicting purposes override other factors; discretion or policy choice needed. |

      *   **Output:** A memo stating:
          1.  The term analyzed.
          2.  Key findings for each Test (Core Agreement? Dimension? Purposes?).
          3.  The Recommended Strategy & why.
          4.  Explicit identification of any judgment calls made during the process.
          5.  Clear recommendation for next steps: Drafting by staff (specify strategy), or referral to City Attorney/Council with specific policy questions.

  **Application to Your Categories:**

  1.  **"Dwelling Unit" (The One You Want to Pin Down)**
      *   **Step 1 (Corpus):** Many clear cases (single-family homes, apartments), many borderlines (tiny homes, container suites, garage conversions, illegal basement units).
      *   **Step 2 (Core Agreement):** **PASS.** Inspectors almost universally agree a standard 3-bed house or a leased apartment is a DU. Disagreement is *only* on borderlines.
      *   **Step 3 (Disagreement Dim.):** **Multi-Dimensional.** Disputes cite: Presence of kitchen? Bathroom? Sleeping area? Intended permanence? Connection to utilities? Separate entrance? Lockable door? Size? No single axis dominates. Features overlap and vary in importance.
      *   **Step 4 (Purpose):** **Multiple (Potentially Conflicting):** Density control (conflict over tiny homes), safety (requires inspection, but garage conversion might be safe?), utility fees (is a kitchenette enough?), housing stock regulation (is an illegal unit "counted"?). Purposes can conflict (e.g., allowing a safe tiny home might violate density goals).
      *   **Step 5 (Synthesis):** PASS / Multi-Dimensional / Multiple (Conflicting) -> **Recommendation: Prototype + Discretion Clause.**
      *   **Why you might not like it:** You *wanted* strict criteria. The analysis shows that's impossible without creating perverse outcomes (e.g., excluding a safe, well-built tiny home on a technicality, or including a dangerous makeshift space because it meets the checklist). A prototype list (e.g., "Includes but is not limited to: single-family home, apartment unit, legally converted basement with full kitchen and bath...") plus a discretion clause ("or other structure determined by the Zoning Administrator to function as an independent place of permanent habitation meeting basic health and safety standards") is more honest and robust. Tie-breakers are too rigid for the multi-dimensional conflicts.

  2.  **"Accessory Structure" (The Sprawler)**
      *   **Step 1 (Corpus):** Clear Ins (sheds, detached garages), Clear Outs (main house), endless borderlines (playhouses >120 sq ft, pergolas with roofs, pool houses, container storage, tiny home ADUs, elaborate treehouses, detached offices).
      *   **Step 2 (Core Agreement):** **PASS.** Sheds and garages are in; the main house is out. Borderlines are the battleground.
      *   **Step 3 (Disagreement Dim.):** **Multi-Dimensional.** Disagreement cites: Size? Height? Permanence/foundation? Connection to utilities? Primary use (storage vs habitation)? Distance from main structure? Aesthetic impact? Economic value? Features overlap and shift.
      *   **Step 4 (Purpose):** **Multiple (Generally Aligned):** Bulk/scale control (size/height), lot coverage (size/location), use compatibility (e.g., can't run a business from a shed), aesthetics (sometimes), separating habitation from storage/utility (safety/use). Purposes generally align (large, permanent, plumbed structures near the lot line trigger multiple concerns).
      *   **Step 5 (Synthesis):** PASS / Multi-Dimensional / Multiple (Aligned) -> **Recommendation: Prototype + Tie-Breakers.**
      *   **Reasoning:** Core is stable, but borderlines are inherently varied. Purposes align enough for structured rules. Draft: "An accessory structure is subordinate to and serves the main building, such as a garage, shed, greenhouse, or playhouse. Accessory structures must: [Tie-Breaker 1: Max Height 15ft], [Tie-Breaker 2: Max Floor Area 400 sq ft], [Tie-Breaker 3: No plumbing except as approved for specific uses X,Y], [Tie-Breaker 4: Primary use limited to storage, parking, recreation, or home occupation under Sec. Y]." The prototype list acknowledges variety; tie-breakers manage the most common conflict dimensions revealed in Step 3.

  3.  **"Family" (The Active Harm Suspect)**
      *   **Step 1 (Corpus):** Clear Ins (nuclear family), Clear Outs (large boarding house), borderlines (3 unrelated students? 2 couples sharing? Elderly parent + caregiver? Foster family? Religious group?).
      *   **Step 2 (Core Agreement):** **PASS (probably, but fragile).** Most agree a married couple with kids is a "family". Disagreement erupts on everything else. *Potential FAIL if core is debated (e.g., is a childless married couple a "family"?).*
      *   **Step 3 (Disagreement Dim.):** **Extreme Multi-Dimensionality.** Disagreement cites: Blood relation? Marriage? Adoption? Number of people? Number of adults? Duration of stay? "Functioning as a family"? Economic interdependence? Sexual relationship? Age of occupants? Purpose of cohabitation? Deeply criss-crossing.
      *   **Step 4 (Purpose):** **Multiple (Profoundly Conflicting):** Originally: Prevent boarding houses/commercial uses & manage density/crowding (objective purposes). Now *also* embodies values about "traditional family," neighborhood character, limiting rentals, controlling demographics (highly subjective, value-laden purposes). Direct conflict: A quiet group of 4 unrelated adults avoids crowding but violates the "traditional character" purpose for some.
      *   **Step 5 (Synthesis):** PASS (assumed) / Extreme Multi-Dim / Multiple (Profoundly Conflicting) -> **Recommendation: Discretion Clause (or Radical Revision) + URGENT Policy Off-Ramp.**
      *   **Why it's the answer you won't like (but need):** The analysis confirms your suspicion. Any criteria (blood, marriage, number) will be arbitrary, exclude valid household types, invite litigation based on discrimination (Fair Housing Act!), and cause active harm (preventing shared housing, affecting caregivers, students, etc.). The discretion clause ("a group of persons living together as a single housekeeping unit, whether or not related...") is the *least bad* legal option *if* you must keep the term. **The real recommendation:** The procedure screams OFF-RAMP. Tell the Council: "The term 'Family' serves conflicting purposes rooted in subjective values, not objective land use impacts. Its use to regulate occupancy based on relationship is likely unenforceable, harmful, and legally risky. Recommend eliminating 'family' as a regulatory category and replacing it with objective standards based solely on *impact*: maximum occupancy based on bedrooms/bathrooms size (crowding/health) and regulations on unrelated adult group homes based on *specific, documented impacts* (e.g., parking, traffic, noise) if necessary, drafted as use regulations, not definitions." This *is* the defensible outcome.

  **Where the Procedure is Most Likely to Misfire & Mitigation:**

  1.  **Gaming the Corpus (Step 1):** Parties might selectively present past cases. Staff might unconsciously categorize cases based on desired outcome.
      *   *Mitigation:* Systematically collect *all* records. Document categorization rules. Have a second staffer review a sample.
  2.  **Misidentifying the "Core" (Step 2):** Assumes agreement exists. What if societal/core understanding shifts? (e.g., "Family").
      *   *Mitigation:* Look for *historical* consistency in clear cases. Flag if core cases show recent disputes.
  3.  **Underestimating Strategic Behavior:** The procedure diagnoses *past* disputes. Savvy applicants/developers will probe the *new* definition's boundaries.
      *   *Mitigation:* Explicitly consider potential gaming scenarios based on Step 3 (Disagreement Dimensions) when drafting definitions/tie-breakers. Build in review mechanisms.
  4.  **Prototype Lists as Loopholes:** "It's not on the prototype list, so it can't be regulated!"
      *   *Mitigation:* Draft carefully: "Includes but is not limited to..." or "Means structures *such as*...". Tie the prototypes clearly to the underlying purposes identified in Step 4.
  5.  **Discretion Becomes Arbitrary:** Unstructured discretion invites inconsistency and legal challenges.
      *   *Mitigation:* If discretion is recommended, demand *clear guidance* for its exercise based on the *purposes* identified in Step 4. Require written findings referencing these purposes. Implement appeal mechanisms. Train inspectors.
  6.  **Ignoring the Off-Ramp:** Staff/Council might push for a "quick fix" definition despite the procedure flagging a need for policy input.
      *   *Mitigation:* Make the Off-Ramp findings stark and litigation-focused ("Adopting criteria will likely lead to challenge under [Fair Housing Act, Due Process] because...").
  7.  **The Translation Gap:** Wittgenstein describes how language *is* used; statutes dictate how it *shall* be used. The procedure helps diagnose the problem but can't eliminate the inherent tension in forcing fluid concepts into legal binaries.
      *   *Mitigation:* Embrace the procedure's core insight: *not every category can or should be rigidly defined*. Its value is in telling you *which* ones can withstand criteria, which need flexibility, and which are fundamentally broken. Defensibility comes from transparently documenting the empirical analysis (using your real data) that led to the recommendation, showing it wasn't arbitrary, but responsive to the term's actual usage and the conflicts it generates.

  This procedure provides a structured, evidence-based way to move from philosophical insight to actionable drafting strategy, grounded in your department's operational reality and defensible through documentation. It forces honesty about the nature of your categories and where policy choices, not tighter wording, are the real solution.
