answer: |-
  Here are five multiple-choice questions targeting critical nuances of the Gibbard-Satterthwaite theorem, designed to probe deep understanding beyond memorization. Each distractor reflects a specific, common misconception.

  ---

  **Question 1: The Two-Alternative Case**  
  The Gibbard–Satterthwaite theorem states that no voting rule satisfying certain conditions is strategy-proof. What happens if there are *only two alternatives* (|A| = 2)?  
  A. The theorem still applies: all non-dictatorial rules are manipulable.  
  B. The theorem is vacuously true because no rules satisfy its conditions.  
  C. Majority rule is strategy-proof and non-dictatorial, so the theorem’s conclusion fails.  
  D. Only neutral and anonymous rules can be strategy-proof.  

  **Question 2: Preference Information Required**  
  The Gibbard–Satterthwaite theorem relies *solely* on which type of voter preference information?  
  A. Cardinal utilities with interpersonal comparisons.  
  B. Cardinal utilities without interpersonal comparisons.  
  C. Ordinal rankings with interpersonal intensity comparisons.  
  D. Ordinal rankings without any interpersonal comparisons.  

  **Question 3: Defining "Manipulable"**  
  A voting rule is "manipulable" under Gibbard–Satterthwaite if:  
  A. Every voter can gain by misreporting in every preference profile.  
  B. In every preference profile, at least one voter can gain by misreporting.  
  C. There exists at least one preference profile where every voter can gain by misreporting.  
  D. There exists at least one preference profile where at least one voter can gain by misreporting.  

  **Question 4: Restricted Domains**  
  The Gibbard–Satterthwaite theorem assumes unrestricted domain. What happens if preferences are restricted (e.g., single-peaked)?  
  A. The theorem still holds: no non-dictatorial rule is strategy-proof.  
  B. Only dictatorial rules remain strategy-proof.  
  C. Some non-dictatorial rules (e.g., median voter) become strategy-proof.  
  D. All strategy-proof rules must violate unanimity.  

  **Question 5: Probabilistic Outcomes**  
  How does the Gibbard–Satterthwaite theorem apply if the voting rule outputs a *lottery* over alternatives (e.g., randomized social choice)?  
  A. The theorem still holds: only dictatorial lotteries are strategy-proof.  
  B. The theorem no longer applies because utilities are cardinal.  
  C. Strategy-proofness becomes trivial since all lotteries are manipulable.  
  D. Non-dictatorial strategy-proof rules exist (e.g., random dictatorship).  

  ---

  **Answer Key with Distractor Explanations**  

  1. **Correct: C**  
     - *Distractor A:* Thinks the theorem applies identically regardless of the number of alternatives.  
     - *Distractor B:* Misunderstands domain conditions; rules exist satisfying the criteria.  
     - *Distractor D:* Confuses strategy-proofness with neutrality/anonymity (irrelevant to the theorem’s core).  

  2. **Correct: D**  
     - *Distractor A:* Assumes cardinal utilities are required (theorem uses only ordinal rankings).  
     - *Distractor B:* Believes cardinal utilities without comparisons suffice (still stronger than necessary).  
     - *Distractor C:* Thinks interpersonal intensity comparisons are needed (contradicts ordinality).  

  3. **Correct: D**  
     - *Distractor A:* Overgeneralizes manipulability to universal voter gain.  
     - *Distractor B:* Assures manipulability in every profile (theorem requires only existence).  
     - *Distractor C:* Demands all voters gain simultaneously (rare; theorem requires only one voter).  

  4. **Correct: C**  
     - *Distractor A:* Ignores domain restrictions as an escape hatch.  
     - *Distractor B:* Assumes dictatorship is inevitable even with restrictions.  
     - *Distractor D:* Confuses with other axioms (unanimity is often satisfiable).  

  5. **Correct: D**  
     - *Distractor A:* Wrongly extends deterministic G-S to lotteries.  
     - *Distractor B:* Correctly notes cardinal utilities but misses random dictatorship.  
     - *Distractor C:* Overgeneralizes all lotteries as manipulable (counterexample: random dictatorship).  

  ---

  **Machine-Readable Answer Key**  
  \answer{C, D, D, C, D}
