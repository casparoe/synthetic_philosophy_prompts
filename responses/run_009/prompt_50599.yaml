  *Structuring questions*: Crucial to avoid "gotcha" vibes. The correct answers should feel obvious only if you’ve internalized the proof’s scaffolding. For Q3 on manipulability, distractor B must embody the "always profitable" fallacy, while D might misdefine Pareto efficiency. Q4’s key is domain restrictions—distractor A should tempt those who think single-peakedness doesn’t help, and C might overclaim for all restricted domains.  

  *Final polish*: The answer key’s distractor explanations must be surgical. "Thinks the theorem requires cardinal utilities" for Q2’s distractor C, or "confuses existence of manipulable profiles with universal manipulability" for Q3’s B. Last line’s \answer{} format is non-negotiable—they’ll likely auto-grade this.  

