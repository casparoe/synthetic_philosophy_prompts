  - The ordinal nature of preferences (no cardinal utilities needed!)  
  - The existential quantifier in manipulability (it’s "some profile, some voter," not universal)  
  - Domain restrictions as escape hatches (single-peaked preferences make non-dictatorial rules possible)  
  - How lotteries change the game (the theorem collapses under probabilistic voting)  

