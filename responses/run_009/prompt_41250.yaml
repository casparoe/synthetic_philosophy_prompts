  The collapse argument in (5) is where things get pivotal. D claims the provisos align the theories, but this overlooks their structural differences: Peirce makes convergence definitional, while James treats utility as evidentiary. This sets up R's demon-world counterexample in (6) - a strong test case that successfully distinguishes the theories by exploiting that very difference.

  D's final charge in (7) has merit regarding James' intent (he did present utility as truth's meaning, not just evidence), but unfairly accuses R of importing external standards. Her demon world actually uses pragmatism's own tools to expose internal tensions.

