  ### Activity Design: Imprecise Probabilities Seminar

  **Materials:**
  - **Urns/Bags & Balls:**
    - Urn A: 50 red balls, 50 blue balls (known composition).
    - Urn B: 100 balls, exact red/blue ratio unknown. *Secretly fix to 40 red, 60 blue*.
    - Urn C: 10 balls; 5 red, 5 blue. Wooden/plastic material unknown. *Secretly fix to 3 wooden red, 2 plastic red, 2 wooden blue, 3 plastic blue (5 wooden total)*.  
  - **Cards:** Role cards for decision rules (3 per rule: Maxmin, Admissible, Non-Dominated).  
  - **Tokens:** 40 tokens per group (start with 20, winnable/losable in bets). Tokens redeemable for small prizes (e.g., coffee vouchers).  
  - **Worksheets:** Simple tables for recording probability intervals, choices, and token counts.  
  - **Other:** Whiteboard, pens, opaque bags for urns, screens to hide draws.

  **Groups & Roles:**  
  12 students → 4 groups of 3. Each group assigned one decision rule:  
  - **Group 1 (Maxmin):** Choose options that maximize worst-case expected utility.  
  - **Group 2 (Admissible):** Choose options optimal for at least one probability in their set.  
  - **Group 3 (Non-Dominated):** Avoid options strictly inferior across all probabilities.  
  - **Group 4 (Maxmax):** Choose options that maximize best-case expected utility.  

  **Timeline (120 minutes):**  
  *(Facilitator: Avoid technical terms until debrief. Call sets "ranges," functions "scenarios.")*  

  #### **Part 1: Ambiguity vs. Risk & Decision Rules (60 min)**  
  1. **Setup (10 min):**  
     - Introduce Urns A (known) and B (unknown).  
     - Explain bets:  
       - **Option 1:** Bet on Urn A. Win 15 tokens if red, lose 5 if blue.  
       - **Option 2:** Bet on red in Urn B. Win 10 tokens if red, 0 if blue.  
       - **Option 3:** Bet on blue in Urn B. Win 10 tokens if blue, 0 if red.  
     - Assign roles. Give each group: 20 tokens, worksheet, Urn B probability range [0.3, 0.7] (i.e., red probability between 30-70%).  

  2. **Group Work (15 min):**  
     - Groups calculate expected utilities (EU) for options across their range:  
       - EU(Option 1) = (15 × 0.5) + (-5 × 0.5) = 5 (fixed, no range).  
       - EU(Option 2) = 10 × *p* (ranges from 3 to 7 as *p* varies).  
       - EU(Option 3) = 10 × (1-*p*) (ranges from 3 to 7).  
     - Groups apply their rule:  
       - *Maxmin*: Option 1 (min EU=5) > Option 2/3 (min EU=3).  
       - *Admissible*: All options admissible (each optimal for some *p*).  
       - *Non-Dominated*: All options non-dominated (no option beats others across all *p*).  
       - *Maxmax*: Option 2/3 (max EU=7) > Option 1 (max EU=5).  

  3. **Resolve Bets (15 min):**  
     - Groups declare choices.  
     - Draw balls publicly:  
       - **Option 1 groups:** Draw from Urn A (50/50), apply win/loss.  
       - **Option 2/3 groups:** Draw once from Urn B (40 red/60 blue); resolve all bets simultaneously.  
     - Update tokens (e.g., if Urn B draw is blue: Option 2 wins 0, Option 3 wins 10).  

  4. **Group Report (10 min):**  
     - Groups share choices/rationale. *Anticipated divergence:*  
       - Maxmin picks "safe" Option 1.  
       - Maxmax picks risky Option 2/3.  
       - Admissible/Non-Dominated split (some Option 1, some Option 2/3).  
     - Highlight: Same ambiguity (Urn B), different choices → rules matter.  

  5. **Transition (10 min):**  
     - Reset tokens to 20. Introduce Urn C (5 red/5 blue, 4-6 wooden).  
     - Explain: Will draw one ball, bet on its material (wood/plastic).  

  ---

  #### **Part 2: Dilation (45 min)**  
  1. **Pre-Update (10 min):**  
     - Groups given initial range for P(wood) = [0.4, 0.6].  
     - **Round 1 Bet:** Choose to bet on wood/plastic (win/lose 10 tokens) or abstain (0 tokens).  
       - *Maxmin/Admissible/Non-Dominated*: Abstain (min EU for betting = -6; abstain=0).  
       - *Maxmax*: Bet (max EU=6).  

  2. **Evidence & Update (10 min):**  
     - Draw ball from Urn C, reveal color (e.g., red).  
     - Groups update range for P(wood | color):  
       - Prior constraints: 4-6 wooden, 5 red, 5 blue.  
       - If red, P(wood | red) = [0, 1] (e.g., 0 wooden red, 1 wooden red, ..., 5 wooden red possible).  
       - **Dilation occurs:** [0.4, 0.6] → [0, 1].  

  3. **Post-Update Bet (15 min):**  
     - **Round 2 Bet:** Same choices (bet wood/plastic/abstain), same payoffs.  
     - Groups apply rules to new range [0, 1]:  
       - *Maxmin*: Abstain (min EU for betting = -10).  
       - *Admissible*: Must bet (abstain is inadmissible; betting optimal for some *p*).  
       - *Non-Dominated*: Bet or abstain (no dominance).  
       - *Maxmax*: Bet (max EU=10).  
     - Resolve bets (reveal material), update tokens.  

  4. **Report (10 min):**  
     - Groups share intervals pre/post update. Highlight widening.  
     - Contrast choices: e.g., Admissible groups now *must* bet despite wider uncertainty.  

  ---

  #### **Debrief (15 min)**  
  1. **Map Activity to Concepts:**  
     - **Ambiguity ≠ Risk:** Urn B’s range felt different from Urn A’s point probability (acted cautiously).  
     - **Decision Rules:** Maxmin avoided Urn B; Admissible split; Maxmax embraced risk.  
     - **Dilation:** Learning color *increased* uncertainty (intervals widened).  

  2. **Introduce Vocabulary:**  
     - Sets of probabilities → "imprecise probabilities."  
     - Rules → "maximin," "admissibility," "non-dominance."  
     - Interval widening → "dilation."  

  3. **Critical Discussion:**  
     - Was dilation intuitive? Should learning *reduce* uncertainty?  
     - Did rules feel rational? (Maxmin too cautious? Admissible too permissive?)  

  ---

  ### Honest Notes  
  **Predictable Issues:**  
  1. **Set vs. Ignorance Confusion:** Students may treat the set as "uncertainty about the true probability" and default to midpoints. *Mitigation:* Circulate, remind groups their rule binds them to the *entire* range.  
  2. **Arithmetic Errors:** Calculating EU bounds may slow groups. *Mitigation:* Provide worksheet templates with formulas.  
  3. **Role Collapse:** In group debates, Maxmax may override cautious members. *Mitigation:* Assign roles (e.g., "maxmin enforcer").  
  4. **Dilation Skepticism:** Students may question if Urn C’s update is "correct." *Mitigation:* Briefly show the math post-activity.  

  **Limitations Requiring Lecture Supplement:**  
  - **Normative vs. Descriptive:** Activity shows *how* sets work, but not whether they are prescriptive (ideal) or descriptive (psychologically real). Discuss Ellsberg’s rationale post-activity.  
  - **Dilation as Defect:** Activity demonstrates dilation occurs, but doesn’t settle if it’s a flaw. Argue pro/con:  
    - *Pro:* Dilation reflects true ignorance (e.g., color evidence is uninformative about material correlation).  
    - *Con:* Learning should never increase uncertainty; dilation violates rational constraints.  
  - **Single vs. Sets Debate:** Activity assumes sets are valid. Contrast with Bayesianism: "Should beliefs always be precise?"
