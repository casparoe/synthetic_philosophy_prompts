answer: |-
  Here is a precisification of "information is physical" as an ordered menu of distinct claims, addressing your requests for clarity, support for the demon exorcism, demarcation of physics vs. philosophy, and unsettled foundations:

  ---

  ### **Interpretations of "Information is Physical"**
  *(Ordered from least to most radical)*

  1.  **Physical Instantiation (Encoding Thesis)**  
      - **Claim:** Information requires a physical carrier; there is no abstract information without implementation in physical degrees of freedom (e.g., atoms, spins, photons).  
      - **Triviality/Substantive:** Trivial in classical/quantum mechanics (no "disembodied" information), but non-trivial if denying abstract Platonism.  
      - **Supports Exorcism?** No. Explains *why* the demon needs memory hardware but doesn't entail thermodynamic costs for erasure.  
      - **Dismisses Research Programs?** No. Compatible with all physics; a constraint on implementation, not theory.  
      - **Physics/Philosophy:** Settled physics (experimentally verified); philosophical only if debating mathematical Platonism.  

  2.  **Landauer's Principle (Thermodynamics of Erasure)**  
      - **Claim:** Logically irreversible erasure of 1 bit of information *must* dissipate at least \(kT \ln 2\) of heat (or increase entropy by \(k \ln 2\)) in the environment.  
      - **Triviality/Substantive:** Substantive, non-trivial thermodynamic law.  
      - **Supports Exorcism?** **Directly and sufficiently** for Szilard's demon: Demon’s memory reset dissipates heat, balancing entropy decrease from the engine.  
      - **Dismisses Research Programs?** No. Specific to irreversible computing; reversible computing avoids it.  
      - **Unsettled Issues:**  
          - *Derivation/Circularity:* Landauer’s principle can be derived from statistical mechanics (e.g., via Szilard engine or partition compression) without *assuming* the second law, but some argue this derivation implicitly relies on thermodynamic assumptions.  
          - *Necessity for Exorcism:* Alternative exorcisms exist (e.g., Bennett’s 1982 model using reversible computation without erasure), making Landauer sufficient but not strictly necessary.  
      - **Experimental Status:** Confirmed (e.g., 2012 experiment with optically trapped particle, Berut et al., *Nature*).  

  3.  **Shannon-Thermodynamic Entropy Identity**  
      - **Claim:** Shannon information entropy (\(H = -\sum p_i \log p_i\)) is *physically identical* to thermodynamic entropy (\(S = k \ln \Omega\)), not merely analogous. Information *is* entropy.  
      - **Triviality/Substantive:** Substantive and **controversial**.  
      - **Supports Exorcism?** Overkill: If true, demon’s information gain *itself* increases entropy, making erasure redundant. But this is **not required** for standard exorcism (Bennett’s solution uses Landauer, not this identity).  
      - **Dismisses Research Programs?** Potentially. Could invalidate theories separating information from thermodynamics (e.g., some quantum gravity approaches).  
      - **Physics/Philosophy:**  
          - *Consensus:* False as strict identity. Shannon entropy is a mathematical measure; thermodynamic entropy is a physical property. They coincide in specific contexts (e.g., Maxwell’s demon) but diverge (e.g., entangled states).  
          - *Unsettled:* Role in quantum thermodynamics (e.g., entropy bounds in holography).  

  4.  **Methodological Constraint (Constitutive Thesis)**  
      - **Claim:** Thermodynamic laws (especially the second law) *cannot be formulated* without reference to information-theoretic constraints. Information is not derived from physics but is foundational to it.  
      - **Triviality/Substantive:** Substantive and contested.  
      - **Supports Exorcism?** Yes, but indirectly: Positions the exorcism as revealing a core principle (erasure cost) constitutive of thermodynamics.  
      - **Dismisses Research Programs?** Yes. Dismisses approaches treating thermodynamics as "fundamental" and information as "emergent" (e.g., some statistical mechanics textbooks).  
      - **Physics/Philosophy:** Philosophical interpretation of physics. No direct experimental test; debates center on axiomatizations (e.g., Lieb-Yngvason thermodynamics).  

  5.  **Informational Ontology ("It from Bit")**  
      - **Claim:** Information is the fundamental substance of reality; physical states supervene on informational states (Wheeler’s "it from bit" or pancomputationalism).  
      - **Triviality/Substantive:** Radically substantive and **speculative**.  
      - **Supports Exorcism?** Only trivially: If information is primary, demon’s actions are informational by definition. Not needed for exorcism.  
      - **Dismisses Research Programs?** Yes. Dismisses any non-informational approach (e.g., realist interpretations of quantum mechanics) as confused.  
      - **Physics/Philosophy:** Purely philosophical/metaphysical. No empirical support.  

  ---

  ### **Key Clarifications for Your Seminar**
  1.  **Your classmate’s argument** requires **only Landauer’s Principle (2)**. It is sufficient and experimentally validated.  
  2.  **"Information is physical" as a slogan** in exorcism contexts **typically means (2)**, but often ambiguously invokes (1) or (3).  
  3.  **Unsettled Physics:**  
      - Landauer’s principle is empirically confirmed but its *derivation* from microscopic physics remains debated (e.g., does it depend on the second law?).  
      - Logical irreversibility ≠ thermodynamic irreversibility: Reversible computing (e.g., Bennett’s solution) avoids Landauer’s cost, showing they can decouple.  
  4.  **Philosophy in a Lab Coat:**  
      - (1) and (2) are physics (verified).  
      - (3)–(5) are interpretations: (3) is disputed physics, (4)–(5) are metaphysics.  
  5.  **Does Exorcism Need (3)?** No. Bennett’s 1982 solution uses Landauer (erasure cost) without equating Shannon and thermodynamic entropy.  

  ### **Bottom Line for Your Classmate**
  Her exorcism argument is sound **if** "information is physical" means **Landauer’s Principle (2)**. The slogan’s ambiguity lies in stronger claims (3–5), which are unnecessary and contentious. The physics community largely accepts (2) as sufficient to resolve the demon paradox, while philosophers debate whether it reveals deeper truths about information.  

  Bring this menu to your seminar to force clarity: *Which of these five claims do you mean, and is it necessary for the exorcism?*
