prompt: |-
  my ethics prof is an old-school noncognitivist and her favorite move is: moral language isn't in the describing business, it's in the cheering/jeering business. to say torture is wrong isn't to report a fact, it's basically to jeer at it — torture, boo; generosity, hooray. she uses this to argue there's no fact of the matter about whether torture is wrong, that moral disagreements are clashes of attitude rather than beliefs about which anyone could be right or wrong.

  I buy it for flat assertions. but I got into an argument with her about conditionals. take "if torturing the cat is wrong, then paying your little brother to torture it is wrong." whoever asserts that usually isn't jeering at cat-torture in the antecedent — they might be neutral about it, might even deny it. same with negation: someone who says stealing isn't wrong isn't thereby cheering stealing. it looks like the moral sentence has to contribute the same content embedded and unembedded for the conditional to even be valid, and if its content is a jeer, what is it doing sitting in the antecedent where nobody is jeering?

  she waved this off as a technicallity, and I've since found out it has a name (the Frege–Geach problem, I think?) but I want more than the label. can you audit the analogy properly? give me the correspondence table — what plays the role of the assertion, the attitude, the disagreement, truth-aptness — then lay out exactly where the cheering picture breaks (embedding in conditionals, negation, disjunction, whichever you think bite hardest), and sort the breaks into two piles: the ones that actually threaten her no-fact-of-the-matter conclusion, and the ones a clever expressivist can patch. I hear there are moves where the attitude gets swapped for some broader state of mind that can disagree with other states of mind even across embedding — does that rescue the original analogy or does it quietly abandon cheering for a different picture that just wears the same coat? finally: tell me whether her conclusion survives the audit on its own merits, or whether the analogy was carrying it the whole time. and if you can think of a better analogy for what moral language does that actually survives the embedding cases, I want to hear it.
reasoning: |-
  Okay, the user is really deep into meta-ethics here. Their ethics professor is a noncognitivist who uses the "cheering/jeering" analogy for moral language. The user gets it for simple assertions but hits a wall with conditionals and negations—the Frege-Geach problem. They want a thorough audit: where the analogy breaks, what threats it poses, and if any patches work.  

  First, I need to map the cheering/jeering analogy to key concepts. The professor’s view: moral claims aren’t truth-apt; they express attitudes. "Torture is wrong" = jeering. Disagreements are attitude clashes, not factual errors. The user’s issue: in "if torturing the cat is wrong, then paying your brother to do it is wrong," the antecedent isn’t jeered. So how can the same "wrong" function here?  

  The core breaks are embedding contexts where the attitude isn’t expressed: conditionals, negation, disjunctions, questions. For example:  
  - **Conditionals**: The speaker isn’t booing cat-torture in the antecedent. If "wrong" just expresses a boo, what’s it doing there?  
  - **Negation**: "Stealing isn’t wrong" doesn’t cheer stealing—it withholds the boo. But if "wrong" is a boo, negation should invert it to a cheer, which it doesn’t.  
  - **Disjunctions**: "Either stealing is wrong or fun" mixes moral and non-moral. What attitude is expressed here?  

  These breaks threaten the professor’s conclusion ("no fact of the matter") because:  
  1. **Validity**: Logic requires consistent content across embedded/unembedded uses. If "wrong" means different things, modus ponens fails.  
  2. **Truth-aptness**: Embedded sentences behave like truth-bearers (e.g., we say conditionals are true/false). If they’re just attitudes, that collapses.  

  Can expressivism be patched? Yes, with moves like:  
  - **Quasi-realism (Blackburn)**: Treat moral sentences as expressing attitudes *in a way that mimics truth-aptness*. Use higher-order attitudes: accepting "if P then Q" expresses a state where *if* you acquire the attitude for P, you must acquire it for Q.  
  - **Hybrid expressivism (Ridge)**: Moral claims have descriptive content *plus* expressive content. "Wrong" might describe a property *and* express disapproval.  

  But these patches stretch the original analogy. Quasi-realism "wears the same coat" but replaces pure cheering with complex psychological states. Hybrid theories sneak in descriptive content. So the professor’s simple "boo/hooray" is quietly abandoned.  

  Does her conclusion survive? Only if she adopts these patches—but then it’s no longer *just* about attitudes. Pure noncognitivism struggles; sophisticated versions survive by compromising.  

  Better analogies?  
  - **Imperatives +**: Moral claims as commands with logical structure ("Do not torture!"). But embedding imperatives is still clunky.  
  - **Plan-laden language (Gibbard)**: Moral judgments express plans for what to do in situations. "If torturing is wrong..." becomes planning not to torture even if delegated. This handles embedding better.  

  The user’s deeper need: they want to know if moral truth is illusory or if the professor’s view is salvageable. They’re probing whether embedding issues force us to accept moral facts. The answer: yes, unless we rebuild expressivism into something almost unrecognizable from "boo/hooray."  

  The professor’s conclusion was propped up by the analogy. Without patches, it collapses under embedding.
answer: |-
  Here's a full audit of your professor's noncognitivist "cheering/jeering" analogy, its breakdown under embedding, and what survives. I'll follow your requested structure rigorously.

  ### **1. The Original Analogy: Correspondence Table**
  | **Concept**          | **In Cheering/Jeering Analogy**                     | **Real-World Anchor**                     |
  |----------------------|----------------------------------------------------|-------------------------------------------|
  | **Moral Assertion**  | Cheering ("Hooray!") or jeering ("Boo!")           | Uttering "Generosity is good" or "Torture is wrong" |
  | **Attitude Expressed** | Positive/Negative emotional stance (approval/disapproval) | Speaker's disapproval of torture          |
  | **Disagreement**     | Clash of attitudes (e.g., I cheer, you jeer)       | Two people arguing over "Torture is wrong" |
  | **Truth-Aptness**    | Not applicable (cheers/jeers aren't true/false)    | Moral claims lack truth value             |
  | **Content**          | None (only emotional expression)                   | No descriptive fact reported              |

  Your professor's conclusion: **No fact of the matter** exists because moral language is purely expressive, not descriptive. Disagreements are **attitude clashes**, not factual errors.

  ---

  ### **2. Where Embedding Breaks the Analogy**
  The cheering/jeering picture fails catastrophically in embedded contexts because attitudes *aren't expressed* when moral claims are unasserted. Key breaks:

  #### **A. Conditionals (The Core Frege-Geach Problem)**
  - **Example**: "If torturing the cat is wrong, then paying your brother to torture it is wrong."
  - **Problem**:  
    - In the antecedent ("torturing is wrong"), the speaker **isn't jeering** at cat-torture. They might even deny it (e.g., a skeptic testing moral principles).  
    - Yet, the word "wrong" must mean the *same thing* in both clauses for the conditional to be logically valid (e.g., modus ponens).  
  - **Threat to Analogy**: Cheering/jeering is tied to *assertion*. If "wrong" in the antecedent isn't expressing disapproval, what is it doing? The analogy can't explain its semantic contribution.

  #### **B. Negation**
  - **Example**: "Stealing isn't wrong."  
  - **Problem**:  
    - This **doesn't cheer stealing** (it's not "Stealing, hooray!"). It withholds disapproval without endorsing.  
    - Cheering/jeering treats negation as flipping the attitude (boo → hooray), but this misrepresents actual use.  
  - **Threat to Analogy**: If negation inverted attitudes, "Stealing isn't wrong" would *approve* of stealing, but it often expresses neutrality or moral indifference.

  #### **C. Disjunction & Other Connectives**
  - **Example**: "Either stealing is wrong or it’s fun."  
  - **Problem**:  
    - This doesn’t express a *single* attitude. Is the speaker jeering at stealing, cheering fun, or doing both?  
    - Logically, the disjunction requires both clauses to have compatible content to compute truth conditions. Attitudes don’t "disjoin" this way.  
  - **Threat**: Moral sentences in complex logic require compositional meaning. Attitudes aren’t compositional.

  ---

  ### **3. Sorting the Breaks: What Threatens Her Conclusion?**
  | **Break**         | **Threat Level to "No Fact" Conclusion** | **Why?**                                                                 |
  |-------------------|------------------------------------------|--------------------------------------------------------------------------|
  | **Conditionals**  | **Fatal**                                | Logic requires consistent content. If "wrong" contributes meaning in antecedents *without* expressing attitudes, it must have non-attitudinal content that could be truth-apt. |
  | **Negation**      | **Severe**                               | If negation doesn’t invert attitudes, moral claims behave like truth-apt propositions (e.g., "not P" symmetrically opposes P). |
  | **Disjunction**   | **Severe**                               | Shows moral language integrates with factual discourse, undermining attitude-only expressivism. |

  **Key Insight**: The **validity of moral arguments** (e.g., modus ponens) is the deepest threat. If "if P, then Q" and "P" entail "Q", then "P" must express the *same content* in both premises. If it’s an attitude in one place but not the other, logic fails. This forces noncognitivists to explain how attitudes can "stand in" for truth-apt content.

  ---

  ### **4. Can Expressivism Be Patched? The Clever Moves**
  Yes—but it morphs the theory. Here’s how expressivists (like Blackburn or Gibbard) respond:

  #### **"Attitude" is Replaced by Broader "States of Mind"**
  - **Patch**: Moral claims express **non-cognitive states** (e.g., plans, commitments, or complex dispositions) that can be "disagreed with" even when embedded.  
    - E.g., Accepting "If torturing is wrong, then paying for it is wrong" expresses a *higher-order state*: a commitment to disapprove of paying for torture *if* you disapprove of torture.  
  - **Does it Rescue Cheering/Jeering?** **No.** It abandons simple emotivism for a **psychologically richer model**. "Boo/hooray" becomes "plan-laden commitment" (Gibbard) or "practical stance" (Blackburn). The analogy is dead; this is a new theory.

  #### **Quasi-Realism: Mimicking Truth-Aptness**
  - **Patch**: Develop rules for when we *treat* moral claims "as if" they’re true/false (e.g., "P" and "If P, then Q" license asserting "Q").  
  - **Survival of Conclusion**: Quasi-realism preserves "no fact of the matter" by reducing truth to *attitude coherence*. But it concedes moral language *functions* like fact-stating discourse.  
  - **Cost**: Quietly reintroduces **logical structure** for attitudes, making the view almost indistinguishable from realism in practice.

  ---

  ### **5. Does Her Conclusion Survive the Audit?**
  - **On Pure Cheering/Jeering?** **No.** The analogy collapses under embedding. Simple noncognitivism can’t explain moral logic.  
  - **On Patched Expressivism?** **Yes, but compromised.** Sophisticated expressivism (e.g., Blackburn’s quasi-realism) saves the "no fact" conclusion by arguing that moral truth is *projected* from attitudes. But:  
    - It **abandons the cheering analogy** for technical machinery.  
    - It **grants realism’s logical territory** (moral claims behave like they’re truth-apt).  
  - **Was the Analogy Carrying It?** **Absolutely.** Without embedding, cheering/jeering *feels* sufficient. Embedding exposes that moral language’s logical behavior requires more than expression. The conclusion only survives by evolving beyond the analogy.

  ---

  ### **6. A Better Analogy: "Planning Language" (Gibbard-Style)**
  If you want an analogy that handles embedding better:  
  - **Moral claims are like expressing plans.**  
    - "Torture is wrong" ≈ "Plan to oppose torture in all situations."  
    - "If torture is wrong, then paying for it is wrong" ≈ "Plan that if I include opposing torture in my plan, I must include opposing paying for it."  
  - **Why it works**:  
    - Plans can be **embedded hypothetically** (e.g., "If I plan to avoid torture, then I plan to avoid paying for it").  
    - Disagreements are **clashes in planning** (e.g., I plan to boycott; you plan to fund).  
    - **Survives embedding**: Unlike cheering, plans have logical structure. We reason about them using the same tools as beliefs.  
  - **Limitation**: Still reduces morality to psychology—but it’s the best fit for embedding without conceding moral facts.

  ### **Bottom Line**  
  Your professor’s "no fact" conclusion isn’t *refuted* by Frege-Geach, but it forces expressivism into a technical overhaul that leaves the cheering/jeering analogy behind. The real casualty is the simplicity of her view: patched expressivism is a philosopher’s toolkit, not a catchy slogan. If she waves off embedding as a "technicality," she’s ignoring the central problem that reshaped meta-ethics for 60 years. You’re right to press this—it’s where noncognitivism either grows up or bows out.
