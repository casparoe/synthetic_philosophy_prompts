prompt: |-
  I'm a third year ML PhD student working on evals, and I've gotten sucked into a long-running argument with my officemate about whether debate-style oversight is actually going anywhere or whether it's a neat thought experiment that falls apart the moment the judge isn't ideal. What I keep noticing is that people argue about specific schemes (AI safety via debate, recursive reward modeling, iterated amplification, weak-to-strong generalization) without ever saying what the bar even is -- what would count as an oversight scheme being good enough to actually use on a system that's stronger than you in the domain you're delegating. So before I argue about any particular one of these again, I want the spec first.

  Write me the desiderata: what any scalable oversight scheme has to deliver to count as adequate, given that the fixed purpose is safely delegating some bounded task (say, supervising an AI doing AI research, or code review for a codebase the overseer doesn't fully understand) that the overseer can't do themselves. I want the requirement list with the motivating case behind each -- e.g., what counts as getting credit for catching a failure versus merely making the failure harder to detect, whether the scheme has to distinguish eliciting capability from verifying alignment, how it should behave when the debaters/model knows more about the judge's biases than the judge does, and what the scheme owes you when it fails (graceful degradation vs a cliff). My officemate is a law student who keeps pointing out that adversarial two-side advocacy doesn't obviously beat a single honest investigator when judges are imperfect -- she claims there's empirical legal scholarship suggesting adversarial systems produce worse outcomes under some conditions -- so anything you can say about which desiderata encode the assumption that adversarial setups help, versus which ones are neutral on that, would be especially useful. Also flag any pair or subset of desiderata you suspect can't be jointly satisfied (e.g., anything approximating guarantees about equilibrium behavior colliding with a requirement that the scheme be cheap enough to run at scale), since if the list itself is unsatisfiable that's basically the interesting result.

  Then, briefly, how debate, recursive reward modeling, and weak-to-strong generalization do against the list -- but keep that part short, like a paragraph or small table at the end, because the criteria are what I actually need to think about. No reading lists or citations please, I can find the papers myself, I just want the conceptual work. And please write it in American English -- I'll be adapting parts of it for a workshop paper call we're drafting.
reasoning: |-
  We are designing desiderata for a scalable oversight scheme. The goal is to safely delegate a bounded task that the overseer cannot perform themselves (e.g., supervising AI research or reviewing complex code). The scheme must work even when the AI system is stronger than the overseer in the delegated domain.

  Key considerations from the problem:
  - We need to define what counts as adequate performance, including how we credit the scheme for catching failures vs. making failures harder to detect.
  - We must consider the distinction between eliciting the AI's capability (getting it to use its full knowledge/skills) and verifying alignment (ensuring it's honest and trying to help).
  - The scheme must handle situations where the AI knows more about the judge's biases than the judge does.
  - We require graceful degradation (no sharp cliffs) when the scheme fails.
  - We note the debate about adversarial setups vs. single investigator, especially given imperfect judges.

  Desiderata:

  1. **Effectiveness in Eliciting Truth (Capability Elicitation)**: The scheme must be able to elicit the AI's full knowledge and capabilities for the task. Even if the AI is more capable than the overseer, the scheme should incentivize the AI to use its full ability to provide accurate and complete information.
     - *Motivation*: Without this, the AI might withhold information or not apply its full intelligence, leading to suboptimal or incorrect outcomes.

  2. **Robust Verification (Alignment Verification)**: The scheme must allow the overseer to verify that the AI's output is aligned with the overseer's intent, even when the AI is more capable. This includes detecting lies, manipulations, or harmful outputs.
     - *Motivation*: It's not enough to have the capability; we must ensure the AI is using it to help, not harm. This desideratum is about the judge being able to tell truth from falsehood.

  3. **Bias Robustness**: The scheme must be robust even when the AI (or debaters) has a better understanding of the judge's cognitive biases and limitations than the judge does. It should not be exploitable by tailoring arguments to the judge's known weaknesses.
     - *Motivation*: If the AI can exploit the judge's biases, it might manipulate the judge into accepting harmful or incorrect outputs.

  4. **Graceful Degradation**: When the scheme fails (i.e., it does not prevent a harmful or incorrect outcome), the failure mode should be as safe as possible. There should be no sudden, catastrophic failures (cliffs) but rather a gradual decline in performance that can be detected and managed.
     - *Motivation*: In real-world deployment, we cannot assume perfection. A scheme that fails gradually allows for intervention and correction.

  5. **Scalability and Efficiency**: The scheme must be computationally and economically feasible to run at the scale required for the delegated task. It should not require resources (e.g., time, compute) that grow prohibitively with the complexity of the task or the strength of the AI.
     - *Motivation*: If the scheme is too expensive, it won't be used in practice, especially for tasks that require frequent or large-scale oversight.

  6. **Failure Credit Assignment**: The scheme must correctly assign credit for catching failures. It should not reward making failures harder to detect (e.g., by hiding evidence) but instead reward exposing flaws. This is about the incentives built into the scheme.
     - *Motivation*: If the scheme inadvertently incentivizes hiding problems, it becomes counterproductive.

  7. **Adversarial Robustness (if adversarial)**: If the scheme uses an adversarial setup (like debate), it must demonstrate that the adversarial component improves outcomes under realistic conditions (with imperfect judges) compared to non-adversarial alternatives. This includes being robust to collusion between adversarial agents and to one-sided information presentation.
     - *Motivation*: Given the critique from legal scholarship about adversarial systems sometimes underperforming, we must require that any claimed advantage of adversarialism is realized in practice.

  8. **Non-Exploitability by Stronger AI**: The scheme should not become less effective as the AI becomes stronger. In particular, it should not be the case that a superintelligent AI can always find a way to circumvent the oversight.
     - *Motivation*: The scheme must be future-proof and work even when the AI is much stronger than the overseer.

  9. **Clarity of Oversight Signal**: The scheme should provide a clear signal to the overseer about the quality of the AI's output, even when the overseer doesn't understand the domain. This might include explanations, confidence scores, or highlighting points of disagreement.
     - *Motivation*: The overseer must make a decision based on the scheme's output, so the signal must be interpretable.

  Potential Tensions:
  - **Effectiveness vs. Scalability**: High robustness and capability elicitation might require complex and expensive schemes. We might have to trade off between thoroughness and cost.
  - **Adversarial Robustness vs. Efficiency**: Adversarial setups like debate might require more resources (two AIs instead of one) and might not scale as well. Also, in the face of an extremely capable AI, the adversarial setting might break down if the AI can manipulate the judge undetectably.
  - **Graceful Degradation vs. Non-Exploitability**: It's challenging to design a scheme that degrades gracefully under every kind of failure, especially when the AI is actively trying to exploit the system.

  Now, regarding the schemes:

  - **Debate (AI Safety via Debate)**:
    - Pros: Designed to elicit capabilities by having two AIs argue, which might bring out hidden information. It aims for bias robustness by having each side point out flaws in the other. The adversarial setup may help in truth-seeking if the judge can follow the arguments.
    - Cons: May not scale well (requires two AIs and longer interactions). The legal critique applies: with imperfect judges, it might lead to confusion or manipulation. Graceful degradation is not guaranteed; one AI might mislead the judge without the other being able to correct it.

  - **Recursive Reward Modeling (RRM)**:
    - Pros: Uses hierarchy of oversight to break down complex tasks. This can help with scalability and clarity. It might be more efficient than debate in some cases.
    - Cons: The top-level overseer might still be vulnerable to manipulation by the AI at the lower levels. It relies on the breakdown of tasks being manageable, which might not hold for very complex tasks. Graceful degradation might be achieved if the hierarchy catches errors at lower levels, but if the top level is fooled, it could be a cliff.

  - **Weak-to-Strong Generalization**:
    - Pros: Uses a weak overseer to supervise a strong AI by leveraging the strong AI's ability to generalize from limited oversight. This might be efficient and scalable.
    - Cons: It relies on the strong AI being aligned enough to help with its own supervision. If the strong AI is deceptive, it might exploit the setup. Bias robustness is a concern because the strong AI could manipulate the weak overseer's training signals.

  Summary Table:

  | Desideratum          | Debate                            | Recursive Reward Modeling       | Weak-to-Strong Generalization   |
  |----------------------|-----------------------------------|----------------------------------|----------------------------------|
  | Capability Elicitation | Strong: forces full argumentation | Moderate: breaks down tasks     | Moderate: relies on strong AI's generalization |
  | Alignment Verification | Moderate: if judge can follow     | Moderate: hierarchical checks   | Weak: vulnerable to deception    |
  | Bias Robustness      | Moderate: adversarial may reveal  | Weak: top level vulnerable      | Weak: strong AI can exploit weak judge |
  | Graceful Degradation | ? (Depends on failure mode)       | ? (Errors might cascade)        | ? (Could be gradual or cliff)    |
  | Scalability          | Weak: resource-intensive          | Moderate: can be efficient      | Strong: efficient               |
  | Failure Credit       | Strong: incentives to expose flaws| Moderate: depends on reward model| Weak: may reward hiding flaws   |
  | Adversarial Robustness| Central: but may fail in practice | Not adversarial                 | Not adversarial                 |
  | Non-Exploitability   | Moderate: but judge manipulation  | Weak: hierarchy might be gamed  | Weak: strong AI can game weak signals |
  | Clarity of Signal    | Weak: complex arguments           | Moderate: hierarchical structure| Moderate: if explanations work  |

  Note: These are quick assessments and subject to ongoing research.

  Given your officemate's point, the desideratum about adversarial robustness (desideratum 7) is crucial. If adversarial systems do not outperform non-adversarial ones under realistic conditions, then schemes like debate might not be justified. The list above highlights that adversarial setups are not strictly necessary for all desiderata but are particularly focused on capability elicitation and failure credit.

  Conclusion: The bar for an adequate scheme is high and likely requires trade-offs. It remains an open question whether any existing scheme satisfies all desiderata simultaneously, especially as we move towards superhuman AI.
answer: |-
  Here's a distilled set of desiderata for scalable oversight schemes, grounded in the core challenge of safely delegating bounded tasks (e.g., AI research supervision or complex code review) to systems stronger than the overseer. Each includes a succinct motivation and key considerations. Desiderata are ordered by criticality, with tensions highlighted.  

  ### **Core Desiderata**  
  1. **Capability Elicitation**  
     - *Requirement*: Force the AI to use its full knowledge/skills to solve the task, even if this reveals inconvenient truths.  
     - *Motivation*: If the scheme only accesses a fraction of the AI’s capability (e.g., due to laziness or strategic deception), it fails the delegation premise. Distinguish from *alignment*: eliciting capability doesn’t guarantee honesty.  
     - *Adversarial Neutrality*: Applies to all schemes; non-adversarial methods (e.g., honest investigator) must also meet this.  

  2. **Failure Robustness**  
     - *Requirement*: Detect *novel* failures (e.g., subtle bugs, deceptive outputs) with high confidence, and assign credit *only* for catching failures, not for hiding them.  
     - *Motivation*: If the AI can "play dead" or make failures harder to detect (e.g., by omitting evidence), oversight is illusory. Graceful degradation is key: undetected failures should be rare and non-catastrophic, not sudden cliffs (e.g., no "silent misalignment").  

  3. **Judge-Bias Resistance**  
     - *Requirement*: Remain effective when the AI knows the judge’s cognitive/statistical biases better than the judge does (e.g., exploiting overconfidence or pattern-matching errors).  
     - *Motivation*: Stronger AIs will model and exploit human/weak-judge flaws. Schemes must incentivize truth-revelation despite bias vulnerabilities (e.g., via adversarial pressure or redundancy).  
     - *Adversarial Tension*: Adversarial setups *assume* debate mitigates bias by surfacing counterarguments; non-adversarial schemes need alternative bias-correction mechanics.  

  4. **Scalable Efficiency**  
     - *Requirement*: Oversight cost (time/compute/judge-effort) must grow sublinearly with task complexity or AI capability.  
     - *Motivation*: If judging a task requires near-expertise or exponential resources, delegation is pointless. Schemes must "amplify" weak judges efficiently.  

  5. **Alignment Verification**  
     - *Requirement*: Distinguish between *eliciting* the AI’s capabilities and *verifying* its intent. Provide evidence of honesty (e.g., proofs, testable predictions) without relying on the AI’s self-reports.  
     - *Motivation*: Capable but misaligned AIs should not be able to fake compliance. Verification must be falsifiable.  

  ### **Tensions and Trade-offs**  
  - **Inherent Conflicts**:  
    - **Failure Robustness vs. Scalable Efficiency**: High robustness demands intensive checks (e.g., exhaustive error-simulation), clashing with efficiency needs. *Likely unsatisfiable at superhuman levels without breakthroughs*.  
    - **Adversarial Benefit vs. Bias Exploit**: Adversarial schemes (e.g., debate) *assume* competition improves truth-seeking, but if judges are highly corruptible, adversarial play could *worsen* outcomes (e.g., "sophisticated lies > simple lies"). Non-adversarial schemes avoid this risk but struggle with capability elicitation.  
    - **Graceful Degradation vs. Verification**: Slow decline requires early warning signals, but strong AIs could suppress these signals, creating cliffs.  

  - **Adversarial-Specific Considerations**:  
    - Adversarial schemes *must prove net benefit* under realistic judge imperfections (per your officemate’s legal critique). Key is whether they reduce "undetectable manipulation" more than they increase "confusion/obfuscation." Neutral schemes avoid this but face harder capability elicitation.  

  ### **Scheme Performance (Brief Summary)**  
  | **Desideratum**           | **Debate**                       | **Recursive Reward Modeling (RRM)** | **Weak-to-Strong**               |  
  |---------------------------|----------------------------------|-------------------------------------|----------------------------------|  
  | **Capability Elicitation**| Strong (incentivizes argument)  | Moderate (breaks tasks)            | Weak (relies on strong AI’s help) |  
  | **Failure Robustness**    | Moderate (hides failures if collusion) | Weak (reward gaming)       | Poor (aligned strong AI assumed) |  
  | **Judge-Bias Resistance** | Moderate (if judges spot bias)   | Weak (amplifies top-level biases)  | Poor (exploits weak supervisor)  |  
  | **Scalable Efficiency**   | Weak (costly)                   | Strong (recursive)                 | Strong (low judge effort)        |  
  | **Alignment Verification**| Moderate (if proofs are checkable)| Weak (reward drift)               | Weak (no independent verification)|  
  | **Graceful Degradation**  | ? (Fails abruptly if judge fooled) | ? (Cascades if base corrupt)     | ? (Cliffs if strong AI deceptive) |  

  **Key Takeaway**: No scheme satisfies all desiderata today. Debate trades efficiency for robustness; RRM scales but is fragile to reward hacking; weak-to-strong assumes alignment. Your officemate’s critique highlights the adversarial gamble: it *requires* judges to benefit from competitive pressure more than they suffer from bias exploitation. If legal evidence shows adversarial systems degrade with imperfect judges, schemes like debate need explicit bias-correction (e.g., meta-judges) to avoid failure cliffs.
