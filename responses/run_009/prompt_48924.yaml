prompt: |-
  Is there a name for this thing, or do I need to coin one?

  I've been noticing a pattern whenever I try to write down, for someone else (or for my future self), instructions about what to ignore. Last month we went away for a week and I wrote instructions for the friend checking in on our cat. Somewhere around rule 14 ("if the smoke detector in the hall blinks, it does that sometimes, ignore it") I realised the list couldn't work in principle. Not just incomplete — impossible. Every "ignore X" only works if you already know X is harmless in this instance, and knowing that is exactly the job the list was supposed to do for you. I can write "ignore the blinking detector" because I already know the battery's old and it's been doing it for years. She can't, unless I also write when NOT to ignore it, and when not to ignore the not-ignoring, and off it goes.

  Same thing when I tried to automate things with smart plugs. Every rule needed an exception, each exception seemed reasonable on its own, and a month later the system was forty rules deep and still wrong about the kettle. And the embarassing part is I just... walk out the door every morning without checking anything. Something in me is doing all this ignoring invisibly, and that's precisely the part I can't get onto paper.

  So, questions. Does this have an established name in philosophy or AI? I half-remember someone telling me about a decades-old robot thought experiment where a machine wastes forever checking that its plan has no unexpected side effects, which sounds adjacent but maybe not identical. More importantly, to me there seem to be two distinct problems bundled together here and I want to know whether the actual literature separates them: (1) the "when is it safe to stop checking" problem — how you know an exception can be dismissed without a further check; and (2) the "what's still true afterwards" problem — once you've done something, figuring out which things in the world changed and which didn't, without re-verifying literally everything. Am I carving a real joint here or inventing a split? And if the everyday human version (the cat-sitting list, the walk out the door) is genuinely different from whatever the formal/AI version is, has anyone given the everyday one its own treatment or name, or is that territory unclaimed? Please don't just drop a term on me — I want the carving: what each candidate concept covers, where it stops, which one fits my list, and where the edge cases sit. If nothing fits, coin something for the specific everyday version and defend why it needs its own label.

  Whatever you conclude, end with one machine-readable line like: Verdict: <best-fitting name, or "no established name — coin one">, so I can grep my notes later.
reasoning: |-
  Okay, let me unpack this user's query. They're describing a recurring problem when writing instructions: specifying what to ignore becomes an infinite regress because each "ignore X" requires contextual knowledge the recipient lacks. The examples—cat-sitting rules and smart plug automation—show how exception hierarchies collapse under their own weight. 

  The user suspects two intertwined issues: (1) knowing when to stop checking exceptions (halting problem) and (2) tracking state changes after actions (frame problem). They want to know if philosophy/AI has terms for these, especially the "everyday" version where humans effortlessly ignore irrelevant details. 

  First, I need to verify if existing concepts fit:
  - The frame problem (AI) perfectly matches issue #2—reasoning about what remains unchanged after actions. 
  - The qualification problem (philosophy) covers issue #1—the impossibility of listing all preconditions/exceptions. 
  - But the user's "everyday" experience feels distinct: it's about tacit environmental knowledge (like ignoring a blinking smoke detector) that resists explicit articulation. Heidegger's "ready-to-hand" captures this, but isn't a named *problem*.

  Noticing the gap: While AI struggles with formalizing these, humans handle them via embodied cognition—background awareness honed through lived experience. The cat-sitter lacks this context, making written instructions brittle. 

  For the verdict:
  - The core issues *are* covered by established terms (qualification + frame problems). 
  - But the everyday manifestation—where bodily familiarity replaces explicit rules—deserves its own label. Proposing "contextual immunity" to emphasize how lived experience grants "immunity" to infinite exception-handling. 

  User's meta-need: They're clearly a systems thinker (referencing robot thought experiments) who values precise taxonomy. Their "carve the joint" request suggests they want conceptual clarity, not just terms. The grep-friendly verdict respects their technical workflow.
answer: |-
  Your observation cuts to the heart of embodied cognition and the limits of explicit instruction. Let's carve the joint precisely, mapping your concerns to established concepts while identifying the gap for the "everyday" phenomenon.

  ### The Core Concepts & How They Map
  1.  **The Qualification Problem (Philosophy/AI):**
      *   **What it covers:** The impossibility of exhaustively listing all preconditions (qualifications) necessary for an action to succeed, or all exceptions to a rule. It asks, "How do you know *when you've listed enough* exceptions or preconditions?" Your "when is it safe to stop checking?" (problem #1) is the *essence* of this. McCarthy & Hayes (1969) formalized it in AI: A robot planning to make coffee must qualify that the pot isn't full of holes, the water isn't solid, the outlet works, a squirrel doesn't knock it over, etc. – an infinite regress.
      *   **Where it stops:** It focuses on the *preconditions* for action/rule application *before* acting. It doesn't directly address tracking changes *after* the action. It explains why your cat-sitting list and smart plug rules become infinitely deep – you can't pre-specify every harmless anomaly or exception.
      *   **Fits:** Your Problem #1 perfectly.

  2.  **The Frame Problem (AI):**
      *   **What it covers:** The challenge of efficiently determining *what changes* and, crucially, **what stays the same** (remains "in the frame") when an action is performed. Your "what's still true afterwards" (problem #2) *is* the frame problem. After you turn on the smart plug, does the cat's location change? Does the battery level of the smoke detector change? Probably not, but how does the system *know* without checking everything?
      *   **Where it stops:** It primarily deals with *modeling change* after an action within a formal representation. While related to ignoring irrelevant details post-action, its focus is on computational efficiency in logical deduction/simulation, not the phenomenological experience of effortless ignoring. It doesn't solve the pre-action qualification issue.
      *   **Fits:** Your Problem #2 perfectly.

  3.  **The Symbol Grounding Problem (Philosophy/AI - adjacent):**
      *   **What it covers:** How symbols (like words in your instructions: "blink", "ignore", "kettle") acquire meaning tied to real-world sensory experiences. Your cat-sitter might misinterpret "blink" or the context of "ignore".
      *   **Where it stops:** It explains *why* instructions are ambiguous, but not the specific infinite regress of exceptions or state tracking. It's a prerequisite for the failure, not the failure mechanism itself.
      *   **Fits:** Background contributor, not the core issue.

  ### The Gap: The Everyday Phenomenon of "Effortless Contextual Ignoring"
  You've correctly identified that the Qualification and Frame Problems are the formal underpinnings. **However, the *everyday, human, lived experience* you describe – the effortless, non-explicit, background filtering of irrelevant stimuli based on deeply embodied, contextual understanding – lacks a single, universally accepted label.** This is where the split needs carving:

  *   **Formal Versions (Qualification/Frame Problems):** Focus on the *logical and computational impossibility* within symbolic AI or formal reasoning systems. They are problems *for* systems trying to emulate intelligence.
  *   **Everyday Human Version:** Focuses on the *phenomenological reality* of human cognition. It's not an "impossibility" we struggle with daily; it's a *capacity* we possess effortlessly due to:
      *   **Embodied Cognition:** Our understanding is rooted in our physical interaction with the world. You *know* the smoke detector's blink is benign because you've lived with it, felt the annoyance, replaced batteries before, sensed the *kind* of blink – knowledge not easily reduced to symbols.
      *   **Situatedness:** We act within a specific, rich context we are attuned to.
      *   **Tacit Knowledge (Polanyi):** We know more than we can tell. The rules for "safe ignoring" are often unconscious procedural knowledge.
      *   **Heidegger's "Ready-to-Hand" (Zuhandenheit):** Things in our environment are understood primarily through their *use* in our projects, not as objects with lists of properties. The blinking detector isn't analyzed; it's background noise ignored because it doesn't impede the task of "living in the house." Breakdown occurs (like for your friend) when it becomes "Present-at-Hand" (Vorhandenheit) – an object requiring explicit attention.

  ### Why the Everyday Version Needs Its Own Label (And a Proposal)
  The Qualification and Frame Problems describe the *formal challenge*. The human experience is the *successful implementation* via different mechanisms (embodiment, tacit knowledge). We need a term capturing this *positive capacity for context-dependent filtering* that avoids the infinite regress, making explicit instructions so brittle by comparison.

  **Proposed Term: Contextual Immunity**

  *   **Definition:** The inherent, often tacit, capacity of an agent (especially a human) embedded within a familiar environment to automatically filter out irrelevant stimuli or disregard potential exceptions to routines, based on embodied experience and situated understanding, thereby achieving efficient action without explicit reasoning about qualifications or frame axioms.
  *   **Why it fits:**
      *   **Contextual:** Highlights the dependence on specific environment and history.
      *   **Immunity:** Emphasizes the *resistance* to the infinite regress of exceptions ("immune" to needing explicit checks for harmless things). It's the acquired "protection" against the Qualification Problem within a known context.
      *   **Differentiates:** Clearly separates the human *capacity* from the AI *problem*. You have "contextual immunity" in your home; your cat-sitter and smart plug system lack it.
      *   **Covers the Gap:** Explains why you walk out the door effortlessly – your contextual immunity filters out the vast majority of potential concerns that *would* need explicit "ignore" rules for someone lacking that context.
  *   **Edge Cases:** Contextual immunity degrades in novel situations, unfamiliar environments, or under stress (when breakdown occurs). It's domain-specific. You might have strong immunity at home but lack it entirely in a friend's kitchen.

  **Verdict: Contextual Immunity (proposed for everyday version); Qualification Problem (#1) & Frame Problem (#2) for formal/AI versions.**

  **Conclusion:** You've expertly identified the Qualification Problem (infinite exception regress/pre-conditions) and Frame Problem (tracking change/post-conditions) as the formal roots. However, the seamless, effortless, *embodied human ability* to bypass these problems in familiar contexts – the very thing you can't get onto paper – isn't captured by those problem-centric terms. "Contextual Immunity" names this vital, positive capacity. It's the reason your instructions fail precisely where your own cognition succeeds invisibly.
