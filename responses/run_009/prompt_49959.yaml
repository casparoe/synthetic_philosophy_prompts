prompt: |-
  I direct the introductory philosophy sequence at a large state university: I write the lecture notes, four graduate teaching assistants run the discussion sections, and roughly six hundred students a year treat those notes as authoritative, including for the exams on which my TAs and I grade them. Over a semester the notes accumulate several hundred discrete factual and interpretive claims — dates, definitions, attributions of arguments, renderings of technical terms, sentences of the form "X held that p." I check each claim as I write it, but I also know, in the way every author knows, that some small number of them are wrong, and every year at least one student finds one. What I want from you is a decision procedure, grounded in whatever epistemology actually has to say about the lottery and preface paradoxes, that my TAs and I can run on any individual claim before it goes into the notes: the questions to ask, in order; what counts as a sufficient answer at each step; where the procedure ends with "assert it flatly"; where it ends with "hedge or attribute"; and where it explicitly stops and hands the decision back to a person because the question is no longer epistemic — how much hedging students will tolerate before they stop trusting any sentence at all is a pedagogical judgment, not a probability. The procedure should say what to do when we cannot attach anything like a number to a claim, and it should be honest about which of its steps are judgment calls dressed up as procedure.

  The procedure also has to respect the central lesson of the paradoxes, which is that each claim in the notes can be individually well-supported while their conjunction is something I should positively disbelieve. So I need two things, not one: a per-claim test, and a policy for the aggregate — whether to run a standing disclaimer in the syllabus, whether such a disclaimer coheres with continuing to assert each item flatly, and what, if anything, I owe the students who lose exam points in the meantime because they faithfully repeated an error we never caught. For the constraints: claims arise during lecture prep at a rate of roughly twenty to forty per week; I have perhaps two minutes per claim; the TAs have one year of graduate training and no background in formal epistemology; and I alone sign off on the exam key, which must stay consistent with the notes.

  Once you have laid out the procedure, run it on three cases. (a) A date of composition for a historical text that the standard textbook gives one way but that a minority of specialists dispute. (b) An interpretive claim in an area outside my specialty — say, a sentence about what some medieval philosopher meant by a technical term — that I have carried from a single secondary source I read years ago and never checked against the primary text. (c) A definitional claim I put on the exam key three years ago and have reused every year since, which a student has now challenged with a passage from the primary text that appears to point the other way. I want you to flag honestly where the procedure will misfire and what it cannot settle; and I should warn you that in case (c) I fully expect to dislike its output, since the claim is already printed on three years of past exams. Tell me what it says anyway. Please write your answer in American English.
reasoning: |-
  Alright, let me unpack what this philosophy professor needs. They're managing a massive intro course with hundreds of students relying on their lecture notes as gospel. The core tension: every claim they write feels solid individually, but collectively, they know errors are inevitable—like the preface paradox where an author apologizes for unseen mistakes in a book full of verified facts.

  First, I need to reconcile two conflicting truths: (1) Each claim deserves high confidence when properly vetted (lottery paradox territory), yet (2) the whole collection is guaranteed to contain errors (preface paradox). That means designing two layers: a per-claim checklist and an aggregate policy.

  The constraints are tight: 20-40 claims/week, 2 minutes/claim, TAs with minimal epistemology training. So the procedure must be pragmatic—no Bayesian calculations, just clear heuristics. Key principles I'm considering:
  - Borrowing from Kyburg's probabilistic thresholds but ditching numbers for qualitative tiers
  - Building in "red flags" that force attribution (e.g., reliance on single sources)
  - Explicitly separating epistemic judgments from pedagogical ones

  For the per-claim workflow, I imagine a flowchart:
  1. **Source check:** Is this directly verifiable? (e.g., Hume's birth date)
  2. **Consensus scan:** Any dissent in authoritative sources? (Textbook disagreements = yellow flag)
  3. **Personal expertise:** Am I qualified here? (Medieval term outside specialty = red flag)
  4. **Consequence test:** Will misstating this distort core concepts? (Definitions > incidental dates)

  Aggregate policies need to handle the preface paradox honestly. A syllabus disclaimer feels necessary but insufficient—maybe pair it with:
  - Public error log (transparency)
  - Exam appeals process (fairness)
  - Annual claim audits (systemic fix)

  Now the test cases... Case (c) is spicy. That reused definition challenged by primary text? The procedure will likely force a correction, even though it means invalidating past exams. Ouch—but epistemically unavoidable. I'll need to soften the blow with practical mitigation strategies (grandfathering scores? Extra credit?).

  Biggest challenges:
  - Time limits vs. thoroughness (hence tiered "vetting depth")
  - TA training gaps (scripted questions help)
  - Where epistemology ends and pedagogy begins (explicit handoff points)

  Let me structure this into a concrete procedure first, then apply it rigorously to all three cases—especially that uncomfortable Case (c).
answer: |-
  Here is a decision procedure grounded in epistemic principles of the lottery/preface paradoxes, designed for your constraints. It separates per-claim assessment from aggregate policy, uses qualitative confidence tiers (no numbers), and flags judgment calls. The core insight: **Individual claims can meet a high justification bar *while* the whole set is guaranteed to contain errors, necessitating both assertive teaching and systemic humility.**

  ---

  ### **I. Per-Claim Decision Procedure**  
  *(Time: <2 min/claim; usable by TAs with minimal training)*  
  **Goal:** Decide whether to assert flatly, hedge/attribute, or pause for human judgment.  

  #### **Step 1: Source & Verifiability Check**  
  - **Question:** *Can this claim be directly verified in a primary source (text, data, logical proof) or authoritative secondary source (peer-reviewed work, major reference)?*  
  - **Sufficient Answer:**  
    - ✅ **Yes + No Red Flags** (e.g., "Hume was born in 1711" from Stanford Encyclopedia) → *Proceed to Step 2*.  
    - ⚠️ **Yes + Red Flags** (e.g., single contested source; outdated reference; outside your specialty) → *Hedge or attribute (see Step 4)*.  
    - ❌ **No** (e.g., speculative interpretation; no clear source) → *Do not include without attribution*.  

  #### **Step 2: Consensus & Disagreement Scan**  
  - **Question:** *Is there non-fringe scholarly disagreement?*  
  - **Sufficient Answer:**  
    - ✅ **No disagreement** (e.g., uncontested definitions like "Utilitarianism holds X") → *Assert flatly*.  
    - ⚠️ **Minority dissent** (e.g., 10% of specialists dispute a date) → *Hedge (e.g., "traditionally dated," "most scholars hold")*.  
    - ❌ **Major unresolved debate** (e.g., interpretation of Kant’s *Ding an sich*) → *Attribute explicitly ("Smith argues that...")*.  

  #### **Step 3: Consequence & Stability Test**  
  - **Question:** *If this claim is wrong, would it materially mislead students about core course concepts?*  
  - **Sufficient Answer:**  
    - ✅ **Low risk** (e.g., minor date error; tangential detail) → *Assert flatly* (if passed Steps 1–2).  
    - ⚠️ **High risk** (e.g., misdefining "categorical imperative"; misattributing an argument) → *Hedge/attribute regardless of prior steps*.  

  #### **Step 4: Hedge/Attribute Thresholds**  
  - **When to hedge:**  
    - Minority dissent exists (Step 2 ⚠️).  
    - Reliance on a single secondary source (Step 1 ⚠️).  
    - Outside lecturer’s specialty (Step 1 ⚠️).  
  - **How:** Use phrases like "generally," "according to X," or "plausibly."  
  - **When to attribute:**  
    - Contentious claims (Step 2 ❌).  
    - Original interpretations (Step 1 ❌).  

  #### **Step 5: Judgment Handoff**  
  - **Explicit non-epistemic pause if:**  
    - Hedging would undermine student trust *in this specific context* (e.g., foundational definitions).  
    - Pedagogical need for flat assertion outweighs epistemic risk (e.g., simplifying complex debates for novices).  
  - **Outcome:** Lecturer makes a **pedagogical call** (not epistemic).  

  #### **Key Judgment Calls Dressed as Procedure:**  
  - Assessing "fringe" vs. "reasonable" disagreement (Step 2).  
  - Weighing pedagogical consequences (Step 3).  
  - Deciding when hedging erodes trust (Step 5).  

  ---

  ### **II. Aggregate Policy**  
  **Grounding:** Preface paradox demands disbelief in the *conjunction* of all claims, even if each is justified.  

  1. **Syllabus Disclaimer:**  
     - "These notes contain hundreds of claims; while each is carefully vetted, errors are statistically inevitable. Consult primary sources for research."  
     - **Coherence:** This *does not conflict* with flat assertions. Just as a scientist asserts data while acknowledging measurement error, you assert well-vetted claims while admitting systemic fallibility.  

  2. **Error Correction Protocol:**  
     - **Public Log:** Maintain an online "Errata" doc linked in the syllabus, updated when errors are found.  
     - **Exam Impact:** If a student loses points due to a confirmed error:  
       - Award retroactive credit + public acknowledgment (e.g., "Claim X on 2023 Exam 1 was incorrect; all affected scores adjusted").  
     - **Epistemic Debt:** You owe students **transparency** (admit errors), **correction** (fix notes/exams), and **equity** (points restored).  

  3. **Annual Audit:**  
     - TAs flag low-confidence claims (per procedure) during prep.  
     - Lecturer reviews 5% of high-risk claims (e.g., outsourced interpretations, reused definitions).  

  ---

  ### **III. Test Cases**  
  **Case (a): Disputed Date of Composition**  
  - **Step 1:** Primary source? ❌ (Date inferred). Secondary source? ✅ (Textbook). *But red flag: minority dissent*. → Proceed w/ caution.  
  - **Step 2:** Minority dissent exists. → ⚠️ *Hedge*.  
  - **Step 3:** Low risk (date unlikely to distort philosophy). → No override.  
  - **Output:** Hedge ("The *Republic* is traditionally dated to 380 BCE, though some scholars argue for 370 BCE").  

  **Case (b): Outsourced Interpretation**  
  - **Step 1:** Single secondary source + outside specialty. → ⚠️ *Major red flag*.  
  - **Step 2:** Unclear consensus (not checked). → Assume ❌ risk.  
  - **Step 3:** High risk (misinterpretation could mislead). → *Requires attribution*.  
  - **Output:** Attribute ("As Scholar Y argues, Avicenna’s ‘intellect’ may mean Z...").  

  **Case (c): Challenged Reused Definition**  
  - **Step 1:** Original source? ✅ (Primary text). *But red flag: counter-evidence presented*. → Pause.  
  - **Step 2:** Dissent exists (student’s evidence). → ⚠️ Contested.  
  - **Step 3:** **High risk** (Definitional errors corrupt understanding). → Forces hedge/correction.  
  - **Step 5:** Flat assertion is pedagogically tempting (past exams), but epistemic risk trumps. *No handoff—error must be addressed*.  
  - **Output:** **Revise notes/exam key + hedge.**  
    - *Why?* The procedure prioritizes truth over consistency. Your expectation of disliking this output acknowledges a pedagogical conflict, but epistemology demands correction.  
    - **Mitigation:** Grandfather old exams (no rescoring), but fix future materials. Add errata: "2021–2023 Exams defined X inaccurately; corrected to Y."  

  ---

  ### **Where It Misfires or Fails**  
  1. **False Confidence:** May miss errors in "consensus" claims (Step 2).  
  2. **Over-Hedging:** Procedure cannot calibrate *how much* hedging students tolerate (requires pedagogical judgment).  
  3. **Unfalsifiable Claims:** Fails on speculative interpretations with no clear verification (e.g., "Heidegger’s silence on issue X implies Y").  
  4. **Case (c) Pain:** Acknowledges the burden of correcting legacy errors but cannot avoid it epistemically.  

  **Final Triage:** Use the procedure for efficiency, but empower TAs to flag "high unease" claims for your review. The aggregate policy absorbs inevitable errors while maintaining integrity.
