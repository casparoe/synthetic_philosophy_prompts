prompt: |-
  I work as an ML engineer, mostly on evals and datasets, so the vocabulary I actually think in is training distributions, out-of-distribution behaviour, label noise, annotator guidelines, inter-annotator agreement, benchmark contamination, that sort of thing. Lately I've been reading about the debate historians have about presentism — whether historians can (or should try to) escape the standards of their own time when they judge people in the past — and I can't unsee it as a distribution shift problem. I have no philosophy or history training beyond pop books, so go easy on jargon from those fields.

  Here's what I want. Take the main positions in the presentism debate — the people who say judging the past by today's standards is unavoidable or even fine, the people who insist the past should be understood on its own terms, and whatever positions sit in between — and restate each of them in my vocabulary, as faithfully as you can. In my head the mapping starts something like: present-day moral standards are the labels produced by a labelling function trained on today's data, presentism is deploying that model out of distribution, and the anti-presentist demand for understanding-the-past-in-its-own-terms is something like insisting you evaluate on the training distribution. But do the mapping properly, for each position, and don't just take my sketch at face value — I suspect my sketch already smuggles in assumptions.

  Then give me the residue report, which is honestly the part I care about most. What translates cleanly? What only survives the translation with distortion, and what's the distortion? What has no counterpart in my vocabulary at all? Two things I want you to address specifically: (1) does "the past on its own terms" come out as anything more than "evaluate on the training distribution", which to me sounds like it could just be a refusal to evaluate anything at all — and if there's more to it, what is the more; (2) in my world the annotation guidlines are a fixed artefact that gets versioned, but in this debate it seems like the labelling function itself is what's being fought over, and the historian is somehow annotator, guideline-writer, and one of the training examples all at once. Is there any analogue to that reflexive messiness in how we handle evals, or does it just not fit?

  Finally, tell me straight: where there's residue, is it because my vocabulary is missing something real, or because the historians' disagreement is less substantive than it looks once you force it into precise terms? I want your actual view, not a both-sides cop-out. Please write the answer in British English.
