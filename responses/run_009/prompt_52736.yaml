  - **Audience-Friendly**: Scenarios avoid jargon; scoring key explains terms briefly.  
  - **Honest Limitations**: Load-bearing questions and edge cases are explicitly flagged.  
  - **Distinguishes Norms**: Each "leaf" (knowledge, truth, justification, belief, deflationary) is achievable.  
  - **Propriety vs. Prudence**: Q8 tests for conflation—respondents prioritizing prudence get a note.  
  - **Awkward Commitments**: Each norm’s counterintuitive result is highlighted.  

