  Based on your requirements, here's a 10-question quiz on norms of assertion. Each question presents a concrete scenario with answer options focusing on whether the assertion is "proper" (epistemically appropriate, not just prudent). The scoring key maps answer patterns to five positions, highlights critical distinctions, and acknowledges limitations.

  ---

  ### **Quiz: What's Your Assertion Style?**
  *Read each scenario and choose the option that best reflects whether the assertion was proper (epistemically appropriate), not just whether it was smart or kind.*

  1. **Lottery Ticket**  
     You buy a lottery ticket with 1-in-a-million odds. Before the draw, you tell a friend, "I’ll lose." You *do* lose. Was your assertion proper?  
     A) Yes—it was overwhelmingly likely and true.  
     B) No—you couldn’t be certain beforehand.  

  2. **Creationist Teacher**  
     Taylor, a biology teacher, privately doubts evolution but knows the scientific evidence cold. In class, they say, "Humans and chimps share a common ancestor" (which is true). Was Taylor’s assertion proper?  
     A) Yes—they had the evidence to back it up.  
     B) No—you shouldn’t assert what you don’t believe.  

  3. **Stopped Clock**  
     You glance at a clock showing 3:00 PM. It’s broken and stuck, but by chance, it *is* 3:00 PM. Unaware of the break, you tell a colleague, "It’s 3:00 PM." Was your assertion proper?  
     A) Yes—you had good reason and it was true.  
     B) No—you got lucky; you didn’t *really* know.  

  4. **Moorean Belief**  
     Alex says, "It’s raining, but I don’t believe it is." How does this strike you?  
     A) Deeply odd—asserting something while denying you believe it is contradictory.  
     B) Fine—maybe Alex is describing a weird mental state.  

  5. **False Alarm**  
     You see your friend’s coat in the hall and hear they’re in the building. You tell someone, "My friend is here." Unbeknownst to you, they left their coat and went home. Was your assertion proper?  
     A) Yes—you had strong reasons to think so.  
     B) No—it turned out false, so it was improper.  

  6. **Moorean Knowledge**  
     Sam says, "The meeting starts at 3 PM, but I don’t know that for sure." How does this strike you?  
     A) Odd—if you’re not sure, you shouldn’t state it so flatly.  
     B) Fine—Sam is transparent about their uncertainty.  

  7. **Poker Bluff**  
     In a poker game, you bluff by saying, "I have a royal flush!" (You don’t.) Bluffing is an accepted part of poker. Was your assertion proper?  
     A) No—it was a lie, regardless of context.  
     B) Yes—in poker, this is just part of the game.  

  8. **Alley Caution**  
     At night, you see a stranger in a dark alley. With no evidence they’re dangerous but feeling scared, you tell a friend, "That person is dangerous!" They turn out to be harmless. Was your assertion proper?  
     A) Yes—better safe than sorry.  
     B) No—you had no good basis for saying that.  

  9. **Bridge Warning**  
     A trustworthy friend who saw it themselves tells you, "The bridge is out ahead!" You relay this to a driver, "The bridge is out," without verifying. The bridge *is* out. Was your assertion proper?  
     A) Yes—you had reliable testimony.  
     B) No—you should’ve checked firsthand.  

  10. **High-Stakes Forecast**  
      In casual chat, you say, "I think it might rain." Later, when asked about an expensive outdoor event, you assert, "It won’t rain," with the *same* level of confidence. Was the second assertion proper?  
      A) No—your confidence hasn’t changed, so you shouldn’t assert it more firmly.  
      B) Yes—when stakes are high, you need stronger certainty to assert.  

  ---

  ### **Scoring Key**
  **How it works**: Tally your answers (A/B). Use the table below to find your norm. Critical distinctions rely on specific "load-bearing" questions. If your answers conflict (e.g., mixing norms), see "Limitations."  

  | Norm                 | Key Idea                                      | Your Answers Should Be: | Most Awkward Commitment                                  |
  |----------------------|----------------------------------------------|-------------------------|----------------------------------------------------------|
  | **Knowledge Norm**   | Assert only what you *know*.                 | 1B, 2B, 3B, 4A, 5B, 6A, 7A, 8B, 9A, 10A | Can’t assert "I’ll lose" in the lottery—even with 99.9999% odds. |
  | **Truth Norm**       | Assert only what is *true*.                  | 1A, 2A, 3A, 4B, 5B, 6B, 7A, 8B, 9A, 10A | Can assert a lucky guess with zero evidence, but not a justified falsehood. |
  | **Justification Norm**| Assert only what you’re *justified* in believing. | 1A, 2A, 3A, 4B, 5A, 6A, 7A, 8B, 9A, 10A | Teachers *must* assert evolution even if they privately reject it. |
  | **Belief Norm**      | Assert only what you *believe*.              | 1A, 2B, 3A, 4A, 5A, 6A, 7A, 8A, 9A, 10A | Can assert "that person is dangerous" with zero evidence—if you believe it. |
  | **Deflationary View**| "Proper" depends entirely on *context*.      | **7B** + mixed pattern (see below)      | No universal rule—poker bluffing is fine, but similar lies elsewhere aren’t. |

  #### **Critical Distinctions (Load-Bearing Questions)**  
  - **Q2 (Teacher)**: *Only* distinguishes **Belief Norm** (B) from others (A). If you chose B, you require belief; A means you don’t.  
  - **Q3 (Stopped Clock)**: *Only* separates **Knowledge Norm** (B) from others (A). If B, you require knowledge; A means you don’t.  
  - **Q5 (False Alarm)**: Splits **Truth Norm** (B) from others (A). If B, you require truth; A means you don’t.  
  - **Q7 (Poker)**: Flags **Deflationary View** (B). If A, you apply the norm strictly; B means context matters.  

  #### **Limitations & Edge Cases**  
  - **Incoherent Patterns**: If you answer:  
    - Q2 **A** (belief not required) + Q4 **A** (Moorean belief is odd) → Contradicts rejecting belief norm.  
    - Q3 **A** (knowledge not required) + Q6 **A** (Moorean knowledge is odd) → Contradicts rejecting knowledge norm.  
    These are rare—likely due to inconsistent intuitions.  
  - **Unreachable Splits**:  
    - **Belief vs. Justification Norms** rely *solely* on Q2. If your other answers conflict (e.g., Q8A for Belief Norm but you chose Q2A), your result may be muddy.  
    - **Knowledge vs. Truth Norms** require Q1 + Q5: If you chose Q5B (truth required) and Q1B (lottery improper), you’re Knowledge; Q1A (lottery okay) → Truth.  
  - **Prudence Over Propriety**: If you chose **A for Q8** (alley caution), but *aren’t* aligned with Belief Norm, your answers prioritize practical safety over epistemic norms. The quiz can’t isolate your norm.  
  - **Deflationary Ambiguity**: If you chose **7B** (poker okay) but fit another norm perfectly, you may hold a "contextual" version of that norm.  

  #### **Why These Norms?**  
  - **Knowledge/Truth/Justification** are reachable via clear patterns (see table).  
  - **Belief Norm** is isolated by Q2.  
  - **Deflationary View** emerges with Q7B + inconsistent answers (e.g., strict about truth in Q5 but lenient in Q7).  

  **Final Note**: Real philosophers debate these cases! The quiz simplifies complex ideas—use it as a conversation starter, not gospel.  

