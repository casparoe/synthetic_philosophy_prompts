prompt: |-
  I'm the TA for a 2nd year evolution course, and every semester we have students propose an explanation for some trait and sketch how you'd test it. Grading these is a nightmare of just-so stories: everything from giraffe necks to the human chin gets an adaptive story, the adaptation explains the trait, the trait's existence confirms the adaptation, and nobody ever considers that the thing might be a byproduct, a leftover, drift, or a straight-up physical constraint. I've been citing the Gould/Lewontin spandrels paper at them but they just nod and keep doing it. At the same time I don't want to just tell them adaptationism is wrong -- half the time the adaptive story is genuinely the best one, and teaching them to reflexively say "it's a spandrel" would be its own disease.

  Can you write a procedure the students can run on their own hypothesis before they hand it in? Something they can actually use in 15 minutes with no lit access beyond what they remember: the questions to ask in order (e.g. is the trait even heritable/variable, what's the null -- drift, constraint, byproduct of something else, is there an independent way to test the function, etc.), what counts as a passing answer to each, where the procedure stops and tells them "this isn't a testable hypothesis as stated, rewrite it", and where it has to admit it can't decide and they need the actual study. Please be honest about which steps are judgment calls dressed up as a checklist.

  Then run it on three of the ones I actually got last term: (1) the human chin as an adaptation for stress resistance during chewing, (2) the appendix as a vestigial leftover that we only keep because removing it was historically too dangerous so selection never got a clean shot at it, and (3) sickle-cell allele frequencies as an adaptation to malaria. Also, since you'll probably find one where the procedure gives a verdict I don't like -- I happen to think (2) is basically fine, and I'd want to know if the procedure really flags it, and whether the flag is correct or just an artifact of the checklist being too strict.
reasoning: |-
  Okay, the user is a TA for a second-year evolution course. They're struggling with students constantly proposing adaptive explanations for traits without considering alternatives. They've tried referencing the Gould/Lewontin spandrels paper, but students aren't internalizing it. The TA wants a practical checklist students can use in 15 minutes without literature access to evaluate their hypotheses. They also want this procedure applied to three examples: the human chin, the appendix, and sickle-cell alleles.

  First, I need to understand the core issue. Students default to adaptationist explanations, ignoring other evolutionary mechanisms like spandrels, constraints, or drift. The TA doesn't want to dismiss adaptationism entirely but wants students to critically assess their hypotheses. The challenge is creating a checklist that's both educational and practical under time constraints.

  The checklist must guide students through key questions: heritability, null hypotheses, testability, etc. It should flag untestable ideas and indicate when more research is needed. The TA specified it should be usable in 15 minutes without external resources, relying on what students remember. Also, the procedure should highlight where judgment calls occur, being transparent about its limitations.

  Now, the three examples:
  1. Human chin as an adaptation for stress resistance during chewing.
  2. Appendix as a vestigial organ retained because surgical removal was historically dangerous, preventing selection from acting.
  3. Sickle-cell alleles as an adaptation to malaria.

  I need to apply the checklist to each. The TA mentioned they think example 2 is fine, but the procedure might flag it. So I should analyze if the flag is legitimate or if the checklist is too strict.

  Breaking down the checklist structure:
  1. **Trait Definition:** Ensure the trait is clearly defined. Vague traits lead to untestable hypotheses.
  2. **Variability and Heritability:** Without variability and heritability, selection can't act. Students might overlook this.
  3. **Null Hypotheses:** Must list alternatives: drift, constraint, exaptation, etc. Students often skip this.
  4. **Causal Link:** Is the proposed function directly testable? Or is it just-so storytelling?
  5. **Independent Test:** Can the function be tested without circular reasoning?
  6. **Predictive Power:** Does the hypothesis make unique predictions?
  7. **Judgment Call:** Weighing alternatives based on plausibility.

  For each step, I'll define what a passing answer looks like and where the procedure stops. Steps 1-3 are critical; failure here means rewriting. Steps 4-6 might require more research but can still be evaluated conceptually.

  Applying to the examples:
  - **Human Chin:** Likely fails at heritability and testability. The chin's variability and genetic basis aren't straightforward. Testing stress resistance without circularity is hard.
  - **Appendix:** The vestigial part passes definition and heritability. But the "dangerous removal" hypothesis might be untestable. The null (vestigial) is simpler. The TA thinks it's fine, but the checklist flags the adaptationist add-on as unnecessary.
  - **Sickle-cell:** Clear heritability, variability, testable link to malaria. Balances heterozygote advantage. Passes most steps.

  The TA's concern about example 2: the checklist flags the adaptationist twist but accepts the core vestigial hypothesis. This seems valid—the add-on isn't needed to explain the trait's presence. So the flag is correct, not an artifact.

  Overall, the checklist should help students avoid just-so stories by forcing consideration of alternatives and testability. It emphasizes that adaptation isn't the default and that some hypotheses require empirical testing beyond speculation.
answer: |-
  Here's a **15-Minute Hypothesis Interrogation Protocol (HIP)** for evolutionary trait explanations. It's designed to force students to confront non-adaptive alternatives and testability *before* submission. The steps are sequential—failure at any "Stop & Rewrite" step means the hypothesis isn't ready for grading. Judgment calls are explicitly flagged.

  ---

  ### **The Hypothesis Interrogation Protocol (HIP)**
  **Time:** 15 mins max | **Tools:** Brain + basic bio/evo knowledge  
  *Run this on your hypothesis **before writing your answer.***

  1.  **DEFINE THE TRAIT PRECISELY (1 min)**  
      *Question:* "Can I define the focal trait in measurable, anatomical/functional terms *without* referencing the proposed function?"  
      *Passing Answer:* Clear, standalone description (e.g., "protrusion of the mandibular symphysis beyond the tooth row" NOT "the chin for resisting stress").  
      *Stop & Rewrite if:* The definition *requires* the adaptive function to make sense.  
      *Judgment Call:* How "neatly" separable is the trait from surrounding structures?

  2.  **VARIABILITY & HERITABILITY GUT-CHECK (2 mins)**  
      *Question:* "Is there evidence this trait varies in the population/species? Is there ANY reason to think it's heritable (e.g., developmental stability, known genetic basis of similar traits)?"  
      *Passing Answer:* "Yes" + brief rationale (e.g., "human chins vary in prominence"; "sickle-cell is a known allele"). "Unsure but plausible" is acceptable IF trait is complex.  
      *Stop & Rewrite if:* "No variation" or "No heritability conceivable" (e.g., proposing selection on a universal, invariant, non-heritable physical law).  
      *Judgment Call:* How strong does evidence of heritability need to be? (Here: LOW bar—just plausibility).

  3.  **NULL HYPOTHESIS NAMING (3 mins)**  
      *Question:* "What are 2-3 plausible *non-adaptive* explanations for this trait's existence? (e.g., drift, developmental constraint, phylogenetic inertia, exaptation/spandrel, physical constraint)"  
      *Passing Answer:* Specific named alternatives *that could produce the observed trait* (e.g., for chin: "byproduct of facial retraction + tooth reduction", "drift"; for appendix: "phylogenetic inertia from herbivorous ancestor", "developmental byproduct of cecum formation").  
      *Stop & Rewrite if:* Only adaptive hypotheses listed, or non-adaptive alternatives are straw men (e.g., "it's not random because it looks designed").  
      *Judgment Call:* Plausibility of named nulls (don't overthink—just non-zero chance).

  4.  **FUNCTIONAL LINK TESTABILITY (3 mins)**  
      *Question:* "Can I propose a *direct, independent test* of the proposed function that doesn't rely on the trait's existence? (e.g., engineering model, comparative correlation, experimental manipulation)"  
      *Passing Answer:* Concrete *method* sketch (e.g., "measure stress on chinless vs. chinned models during chewing"; "compare malaria rates in populations with/without sickle-cell allele").  
      *Stop & Rewrite if:* Test is circular ("presence proves function") or impossible ("resurrect ancestors").  
      *Judgment Call:* Is the test *feasible in principle*? (Doesn't need to be easy/ethical).

  5.  **PREDICTIVE POWER ASSESSMENT (2 mins)**  
      *Question:* "Does my adaptive hypothesis predict something *distinct* from the nulls? If not, is it still the *most parsimonious* explanation?"  
      *Passing Answer:* Identifies a unique prediction OR argues why adaptation is simpler *despite* lacking one (e.g., sickle-cell predicts higher fitness of heterozygotes in malarial zones—nulls don't).  
      *Verdict:* "Need Actual Study" if no unique prediction AND adaptation isn't clearly simpler than nulls.  
      *Judgment Call:* Parsimony weighing (Occam's Razor). Be strict—adaptation is *complex*.

  6.  **ADAPTATION CONFIDENCE FLAG (1 min)**  
      *Question:* "Given steps 1-5, does adaptation still seem like the *best* explanation? Or is it just *a* possible one?"  
      *Output:* "Adaptation Likely", "Non-adaptive Likely", or "Insufficient Evidence—Requires Data".  

  ---

  ### **Running HIP on Your Student Examples**

  **Hypothesis 1: Human chin as an adaptation for stress resistance during chewing.**  
  1.  **Trait Definition:** PASS ("Bony prominence at the anterior mandible").  
  2.  **Variability/Heritability:** PASS (Variation in prominence exists; craniofacial features are heritable).  
  3.  **Null Hypotheses:** PASS (e.g., "Developmental byproduct of jaw reduction" [spandrel], "Drift").  
  4.  **Functional Test:** **FAIL.** Proposed test? "Measure stress resistance." But how? *Independent* test requires a model *without* the chin doing the same function. Engineering models of *hypothetical* chinless human jaws are possible but non-trivial. Students won't propose this. Likely circular: "Chins exist → they resist stress → we see stress → proves function."  
      *Verdict:* **STOP & REWRITE.** Untestable as proposed. Needs a testable biomechanical prediction (e.g., "Chins reduce microfractures in molars during hard-food chewing—predicts correlation between chin size and enamel damage in foragers").  

  **Hypothesis 2: Appendix as vestigial, retained because removal was historically lethal (so selection couldn't act).**  
  1.  **Trait Definition:** PASS ("Vermiform appendix—blind-ended pouch at cecum junction").  
  2.  **Variability/Heritability:** PASS (Variable size/presence; developmental origin suggests heritability).  
  3.  **Null Hypotheses:** PASS (e.g., "Vestigial remnant of cellulose-digesting cecum" [phylogenetic inertia], "Developmental constraint of cecal development").  
  4.  **Functional Test:** **PARTIAL FAIL.** Core "vestigial" part is testable (e.g., compare cecum size in herbivores vs. humans). BUT the addendum ("removal was lethal → no selection") is *untestable speculation*. No independent way to prove historical lethality prevented selection. It's an unnecessary just-so layer.  
  5.  **Predictive Power:** **FAIL** for adaptationism. The adaptive addendum predicts nothing unique. The *null* (vestigial) is more parsimonious.  
      *Verdict:* **STOP & REWRITE.** The vestigial hypothesis *itself* passes steps 1-4, but the "dangerous removal" add-on is untestable and inflates complexity. Flag: "Non-adaptive Likely (Vestigial)".  
      *Your Concern:* The procedure *correctly flags* the adaptationist embellishment as unsupported. The core vestigial idea is fine—but students added adaptationist noise. HIP forces them to strip it back.  

  **Hypothesis 3: Sickle-cell allele frequencies as an adaptation to malaria.**  
  1.  **Trait Definition:** PASS ("High frequency of HbS allele in populations").  
  2.  **Variability/Heritability:** PASS (Allele frequency varies; known Mendelian inheritance).  
  3.  **Null Hypotheses:** PASS (e.g., "Drift", "Founder effect", "Gene flow").  
  4.  **Functional Test:** PASS ("Compare fitness of HbA/HbA, HbA/HbS, HbS/HbS genotypes in malarial vs. non-malarial zones"—classic heterozygote advantage test).  
  5.  **Predictive Power:** PASS (Uniquely predicts higher HbS frequency where malaria is endemic AND higher fitness of heterozygotes there).  
  6.  **Adaptation Confidence:** **Adaptation Likely.** Balances selective pressure (malaria) with a testable mechanism (heterozygote advantage).  

  ---

  ### **Why This Works**
  - **Forces Engagement:** Students can't skip null hypotheses or testability.  
  - **Exposes Circularity:** Step 4 kills "trait exists → proves function" loops.  
  - **Manages Uncertainty:** "Insufficient Evidence" is a valid output (e.g., for many neural traits).  
  - **Flexible:** Allows adaptation when justified (sickle-cell) but punishes laziness (chin, appendix addendum).  
  - **Honest:** Highlights judgment calls (plausibility, parsimony), so students know where skepticism lives.  

  **Grading Tip:** Require students to submit HIP *with their answer*. Grade the HIP rigor, not just the hypothesis. If they skip steps or hand-wave nulls, dock points—even if the adaptive story is pretty.
