answer: |-
  ## Joint Statement on Objective Chance: Humean Best-Systems vs. Propensity Accounts

  **Drafted for the Chance-and-Laws Reading Group**

  **Authors:** [Humean Representative] & [Propensitist Representative]
  **Date:** 26 October 2024

  **Preamble:** This document represents a collaborative effort to clarify the core agreements and substantive disagreements between a Lewisian Humean Best-Systems Account (HBSA) of objective chance and a Single-Case Propensity Theory (PT) of objective chance. Both parties accept the Principal Principle as a central constraint on any theory of chance and acknowledge significant challenges their respective views face in satisfying it. The aim is to elucidate shared ground, articulate disagreements precisely, identify key cruxes for future investigation, and assess the nature of the residual dispute.

  ---

  ### 1. Shared Commitments

  Any adequate theory of objective chance must satisfy the following core desiderata, which we jointly endorse:

  1.  **The Evidential-Guiding Role:** Objective chance must provide a rational guide to credence for imperfectly informed agents. The Principal Principle (PP), in its broad intent, captures this essential function. Specifically, if a rational agent knows the objective chance of event A is *p* (and possesses no further information relevant to A’s occurrence that is inadmissible relative to that chance), then their credence in A should be *p*. Chance is thus epistemically authoritative for rational belief formation about singular outcomes.
  2.  **The Explanatory Ambition:** Chance attributions must play a substantive explanatory role. They should explain why stable frequencies obtain (or are expected) in appropriate reference classes, why certain patterns exhibit resilience or robustness under intervention, and why agents relying on PP succeed in their epistemic endeavours. Chance is not merely a descriptive label for patterns; it should underwrite expectations and inform our understanding of indeterministic processes.
  3.  **Compatibility with Determinism:** A theory of chance must coherently account for the possibility of deterministic worlds. It must explain how objective chance could exist and play its guiding role even in a world where the entire history of events, including all future events, is fixed by the initial state and deterministic laws. Chance, where it exists in such worlds, must be non-trivial (i.e., not solely 0 or 1) and satisfy PP without contradiction.
  4.  **The Non-Redundancy Constraint:** Objective chance must be a distinct and indispensable feature of our best understanding of the world. It cannot be reduced without loss to mere actual frequencies (which can be accidental or limited), nor to purely subjective credences (which lack the requisite objectivity and normative force). Chance must earn its keep as a fundamental or robustly emergent aspect of reality.
  5.  **PP’s Core Insight:** While the precise formulation and justification of PP may be contested, its core normative insight – that knowledge of objective chance rationally constrains credence in a specific way – is correct and non-negotiable for a theory of *objective* chance. Any theory failing to vindicate a recognisable version of PP fails as an account of objective chance.
  6.  **The Challenge of Undermining & Epiphenomenality:** Both parties acknowledge the seriousness of the specific challenges their views face concerning PP. The threat of undermining futures (for HBSA) and the charges of violating probability axioms or epiphenomenality (for PT) are genuine problems requiring resolution within each framework, not mere rhetorical points.

  ---

  ### 2. The Disagreement, Stated Twice

  | Point of Disagreement                  | Humean Best-Systems Account (HBSA) Wording                                                                                                                                 | Propensity Theory (PT) Wording                                                                                                                                                   |
  | :------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. What Objective Chances Are**      | Objective chances are facts about which probability functions, when used as guides to expectation within the best overall descriptive systematisation (balancing simplicity, strength, and fit) of the totality of particular matters of fact (the "Humean mosaic"), maximise the informativeness and efficiency of that system. They supervene globally on the mosaic. | Objective chances are irreducible, single-case dispositional properties of particular physical set-ups (or world-states) to produce specific outcomes. They are local causal tendencies inherent in the set-up itself, existing independently of the global pattern of events. |
  | **2. Epistemic Status of PP**          | The normative force of PP is derivative. It arises because rational agents recognise that the best system’s probabilities offer the most reliable predictive and explanatory summaries of the mosaic available to them. PP is vindicated as a principle of rational epistemology grounded in descriptive facts about the world’s pattern. | The normative force of PP is fundamental. It flows directly from the metaphysical nature of chance itself. Knowing a chance *is* knowing a specific kind of causal tendency that directly warrants the corresponding degree of belief. PP reflects the intrinsic connection between chancy dispositions and rational expectation. |
  | **3. The Undermining Problem**         | Undermining futures pose a genuine technical challenge to a naive statement of PP. The solution lies in carefully restricting the admissible information in PP to exclude details about the future that would undermine the chance claim itself, or by reformulating PP to condition directly on the *best system* description (including its chance axioms) rather than the chance values *simpliciter*. | The undermining problem reveals a deep flaw in HBSA. It demonstrates that HBSA cannot coherently maintain both that chances are strictly determined by the entire mosaic and that knowledge of chance provides a rational constraint on credence about that same mosaic, leading to incoherent self-undermining credences. |
  | **4. Humphreys' Paradox**              | Humphreys’ paradox highlights a potential mismatch between the formal structure of probability and the metaphysics of causation. However, it poses no direct problem for HBSA, as chances within the best system are defined by their formal role and need not directly represent causal propensities. The symmetry of conditional probabilities is a feature of the formalism, not a bug. | Humphreys’ paradox presents a significant challenge to propensity accounts that naïvely identify propensities with conditional probabilities. It suggests propensities, as directed causal tendencies, may not satisfy the symmetry P(A\|B) = P(B\|A) * P(A)/P(B). A defensible PT must either show how propensities *can* ground the probability axioms (including symmetry) or explain why rational credence should obey axioms that propensities themselves might not satisfy. |
  | **5. Potential Falsification**         | HBSA would be fatally undermined if a compelling case could be made that the best systematisation of a world’s mosaic *must* assign trivial chances (only 0 or 1) in a genuinely indeterministic world, or if it could be proven that no reformulation of PP can coherently avoid self-undermining credences without abandoning the core Humean supervenience thesis. | PT would be fatally undermined if it could be conclusively shown that single-case dispositions *must* be epiphenomenal (making no difference to the unfolding of events or to rational epistemology), or if no coherent account could be given of how propensities ground the probability axioms that rational credence obeys (especially symmetry under conditionalisation). |

  ---

  ### 3. Cruxes and Registered Predictions

  We identify the following cruxes as particularly revealing points of divergence. For each, we describe a scenario or argument both parties agree bears significantly on the dispute and register specific, falsifiable predictions.

  **Crux 1: Chance in a Small, Finite, Indeterministic World (The "Minimal Dice World")**

  *   **Scenario:** Consider a world containing only six distinct, causally isolated events: six rolls of a single, unique, symmetric six-sided die. The outcomes are: 1, 3, 3, 5, 5, 5. The world ends after the sixth roll. The die’s structure and rolling mechanism are indeterministic.
  *   **Relevance:** This tests whether non-trivial chances can exist without long-run frequencies or a rich mosaic for systematisation, and whether PT can avoid triviality or arbitrariness in such a small, non-repeatable context.
  *   **Humean Prediction:** The best system for this mosaic will almost certainly *not* posit a uniform 1/6 chance for each face. Given the simplicity/strength/fit trade-off, a system assigning chance 1/3 to {1,3,5} and chance 0 to {2,4,6} (or something similar reflecting the actual distribution) will likely dominate. Non-trivial chances *might* emerge only if the best system includes probabilistic laws *despite* the finite history (e.g., if positing P(5)=1/2 significantly boosts simplicity without overly harming fit), but this is unlikely to yield the intuitive 1/6. **Risk:** If compelling arguments show the *only* acceptable best system *must* assign P(x)=1/6 for x=1-6, contradicting the actual distribution significantly, HBSA would struggle.
  *   **Propensitist Prediction:** The symmetric physical structure of the die inherently bestows a single-case disposition (propensity) of 1/6 for each face on each roll, *regardless* of the actual outcomes or the world's brevity. The actual distribution (three 5s, no 2s) is compatible with, and indeed *expected* under, these propensities, though unlikely. **Risk:** If it can be shown that no physical fact about the die *except* the actual distribution of outcomes across its rolls could possibly ground or constitute the alleged 1/6 propensity for each face, PT would be undermined in this case.

  **Crux 2: The Directionality of Propensities (Humphreys' Reversal Test)**

  *   **Scenario:** Consider a simple indeterministic causal chain: Event C (cause) has a propensity P(E|C) = 0.8 to cause event E (effect). Assume E only occurs if caused by C. Now consider the conditional chance P(C|E) – the chance that C occurred, given that E occurred.
  *   **Relevance:** This directly probes whether propensities, as causal tendencies, obey the symmetry required by the probability calculus (P(E|C) * P(C) = P(C|E) * P(E)).
  *   **Humean Prediction:** Within any best-system description incorporating this causal propensity, the conditional probabilities P(E|C) and P(C|E) *must* obey the standard axioms of probability, including Bayes' theorem. Their values will be determined by the global statistics of C and E occurrences in the mosaic. There is no inherent barrier to symmetry. **Risk:** If compelling cases arise where the best-system probabilities *must* violate symmetry (e.g., P(E|C) high but P(C|E) low based on mosaic patterns), it would challenge the universality of the probability formalism within HBSA.
  *   **Propensitist Prediction:** The propensity P(E|C) = 0.8 is a fundamental, *directed* disposition from C to E. P(C|E) is a *different* propensity, concerning the occurrence of the cause given the effect. There is no *a priori* reason why P(C|E) must equal P(E|C) * P(C)/P(E). It depends on the specific physical dispositions governing the occurrence of C and the causal link. Symmetry may often hold empirically, but it is not a necessary feature of propensities themselves. **Risk:** If it can be conclusively argued that rational agents *must* set credence P(C|E) = P(E|C) * P(C)/P(E) *even if* the underlying propensities lack this symmetry, it would challenge PT's claim that propensities directly ground rational credence via PP in its standard form.

  **Crux 3: The Epiphenomenality Challenge (The "Coin of Necessity")**

  *   **Scenario:** Imagine a world governed by deterministic laws *except* for a single, unrepeatable coin flip. The coin has a precise physical structure. The propensity theorist claims this structure bestows a single-case propensity P(Heads) = 0.5. The Humean argues that any non-trivial chance assignment here is either arbitrary or reducible to the deterministic initial conditions plus laws governing the flip (yielding chance 0 or 1, but not 0.5).
  *   **Relevance:** This tests whether PT can attribute non-trivial chances without frequencies *and* ensure they are not epiphenomenal (i.e., whether the alleged propensity makes any difference to the physical outcome or to a rational agent's knowledge beyond what the deterministic micro-details provide). It also pressures HBSA on deterministic chance.
  *   **Humean Prediction:** The best system for this world will not assign a non-trivial chance to the coin flip. The system will include the deterministic micro-laws and initial conditions, yielding a prediction of either Heads or Tails with certainty (chance 1 or 0). Attributing a 0.5 chance adds no significant predictive or explanatory power not already captured by the micro-description plus the observation that the outcome *looked* random to a macro-observer lacking microscopic knowledge. **Risk:** If a compelling argument shows the best system *must* include a probabilistic law (P(Heads)=0.5) for this coin flip *despite* underlying determinism (e.g., due to massive computational irreducibility or essential explanatory power at the macro level), HBSA would need significant revision.
  *   **Propensitist Prediction:** The precise physical structure of the coin and flipping mechanism *does* genuinely bestow a single-case propensity P(Heads)=0.5. This propensity is a real physical property, distinct from the underlying microstate, that explains the *apparent* randomness and the rational credence of 0.5 held by an agent who knows the propensity but not the micro-details (admissible information under PP). It is not epiphenomenal because it is this very structural property that causally governs the indeterministic outcome (even if the micro-details determine it, they do so *via* realising this propensity). **Risk:** If it can be demonstrated that *every* physical fact cited as the propensity's basis either (a) fully determines the outcome or (b) provides no explanatory or predictive advantage over the micro-details for *any* purpose, including guiding the credence of agents with varying knowledge, then the charge of epiphenomenality would stand.

  ---

  ### 4. Verbal or Substantive

  We jointly assess the residual dispute as **predominantly substantive**, though with potential terminological elements requiring care.

  *   **Substantive Core:** The disagreement centres on fundamental ontological and metaphysical questions. Is objective chance ultimately a global, pattern-dependent feature supervening on the entire history of particular events (HBSA), or is it a local, irreducible causal power inherent in specific physical situations (PT)? This difference manifests in contrasting responses to the cruxes above: the grounding of chance in finite worlds, the relationship between chance and causal direction, and the possibility of non-epiphenomenal single-case chance without frequencies. These are questions about what *makes* a chance claim true, not merely how we talk about it.
  *   **Terminological Nuance:** There is a potential terminological divergence regarding "disposition" or "propensity." The HBSA proponent may agree that chances guide expectations *like* dispositions but insists they are not dispositions *in the traditional causal-power sense* invoked by PT. Conversely, the PT proponent uses "propensity" to denote a specific metaphysical category rejected by the Humean. Care is needed to avoid conflating dispositional *language* with dispositional *metaphysics*.
  *   **Shared Referent?** We largely agree on the *functional role* chance plays (embodied in PP and the shared commitments). However, we disagree sharply on the *nature of the property* that occupies this role. It is not merely that we attach different names to the same thing; we posit different kinds of things to fulfil the role. Whether one property *can* adequately fulfil the role without being the other is precisely what the cruxes aim to test. We thus conclude that while our shared focus on PP ensures we are both talking *about* objective chance as a guide to credence, our accounts propose genuinely different underlying natures for that chance.

  ---
  **Signed,**

  **[Humean Representative]**

  **[Propensitist Representative]**

