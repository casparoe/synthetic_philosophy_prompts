     This way, we have a concrete feedback: For each subject (real and fake), we can compute how many of the predictions were correct (for the follow-up) and how close the predicted score was (for the judgment task).

  VI. Timeline (90 minutes total):

     Stage 1 (15 minutes total):
     - 0-5 min: Introduction to the activity (explain that we are doing an experiment about perception and reporting). Select 4 volunteers. (The rest are the interpreters.) Volunteers leave the room with the instructor.
     - 5-10 min: Volunteers watch the video (60 seconds) and then are given 5 minutes to write their reports. (The instructor has pre-written the 3 fabricated reports.)
