     Then, for the real volunteers, we actually ask them the follow-up questions and give them the quiz. We record their answers and scores.
     For the fake subjects, we do nothing. Then, when we reveal which were fake, we can see how the groups modeled them. We can also ask the groups to share their predictions for one fake subject and discuss why they made those predictions.

