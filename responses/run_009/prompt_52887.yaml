          - The number of correct answers on the quiz (and/or which ones they would get right?).

       They have 25 minutes for this.

     - 40-50 min: Now, we test the real volunteers. We bring them to the front (one by one or as a panel) and ask them the follow-up questions (each volunteer answers all 5). Then they take the quiz (on paper, then we collect and grade quickly? Or we can grade on the spot). We record their answers and scores.

