  Among existing solutions, neutrality is the biggest hurdle. Deflationary approaches might dismiss the hard problem too quickly, while inflationary ones sneak in dualist assumptions. The user wants to know if insisting on neutrality biases the solution. I think it's necessary for the meta-problem to remain distinct from the hard problem itself.

