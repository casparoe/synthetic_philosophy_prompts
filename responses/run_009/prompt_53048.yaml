prompt: |-
  I've been keeping a list of cases where someone influences another person's decision, and my gut verdicts on them don't line up in any obvious way, so I want to figure out what principle, if any, is behind them. Nudging employees into the 401(k) by making enrollment the default: fine, even clever. A car salesman who mentions, truthfully, that two other people looked at the car today, purely because he knows the scarcity cue will rush me into deciding: not fine, somehow. My friend saying "you're the only one I can count on" to get me to help him move: manipulative, even though I'd have said yes anyway. A charity ad built around one named child rather than statistics: fine with me, even though it works on my emotions rather than my reasoning. A teacher exaggerating praise of a struggling student to build her confidence: fine. An airline emailing me "you've put so much into this miles program, don't let it go to waste" to keep me from switching carriers: not fine. The same airline saying "only 3 seats left at this price" when it happens to be true: I honestly don't know, it feels wierd both ways. And a doctor who tells a patient "90% of people survive this" instead of "10% die," knowing the positive frame will change what the patient chooses: I actually think she should do that -- yet a car dealer picking whichever frame moves more metal seems clearly wrong to me, and I can't say what the difference is. So: is there one principle that captures all or nearly all of these, and if not, which of my verdicts should I give up? Tell me what the principle says about a case I haven't listed, and be upfront about which verdicts it just can't save. Also say where your own reasoning here is most likely to go wrong, and what consideration would change your mind about one of the cases. Please write in American English.
reasoning: |-
  Okay, let me try to unpack this user's query. They've listed several scenarios where one person influences another's decision, and their gut reactions vary without a clear pattern. The user wants to know if there's a unifying principle behind their judgments or if they need to adjust some of their verdicts.

  First, I need to analyze each case they mentioned. The 401(k) default enrollment feels acceptable to them, while the car salesman using scarcity tactics doesn't. The friend's emotional appeal to help move seems manipulative, but the charity focusing on a single child is fine. The teacher's exaggerated praise is okay, but the airline's email leveraging sunk cost feels wrong. The "only 3 seats left" claim is ambiguous, and framing medical stats positively is good, but a car dealer doing the same is bad. 

  The user's confusion makes sense because all these cases involve influence, but the ethical acceptability varies. I should look for common factors. Maybe the key is whether the influencer acts in the influenced person's best interest. The employer setting 401(k) defaults helps employees save for retirement. The doctor framing survival stats positively aids the patient's decision-making. In contrast, the car salesman uses scarcity to rush a decision that benefits himself, not the buyer. The friend's plea, while maybe harmless, serves their own need for help rather than the user's best interest.

  But there are nuances. The charity uses emotional storytelling, which could be seen as manipulative, but the user finds it acceptable. Perhaps because the charity's goal is altruistic, even if the method is emotional. The airline's "only 3 seats left" is tricky—it's truthful but exploits scarcity. The user's ambivalence here might stem from the airline's profit motive versus providing a legitimate urgency cue.

  Another angle: transparency. The 401(k) default is a well-known policy; employees can opt out. The doctor's framing isn't deceptive but presents the same fact differently. In contrast, the car salesman's mention of other lookers is a tactic designed to pressure without adding real value. The friend's "you're the only one I can count on" might feel manipulative because it's an emotional appeal that could induce guilt, even if true.

  The sunk cost email from the airline feels wrong because it exploits a cognitive bias (people hate wasting prior investments) to prevent switching, which may not benefit the customer. The "3 seats left" is factual but still leverages scarcity. The difference might be that scarcity can be a genuine factor in pricing, while sunk cost is purely psychological exploitation.

  I should also consider power dynamics. The teacher praising a student builds confidence in a vulnerable individual, which is benevolent. The doctor frames stats to reduce anxiety, aiding the patient's understanding. The car dealer and airline, however, have commercial interests, so similar tactics feel exploitative.

  Potential conflicts: The charity case. If the principle is acting in the influenced person's best interest, donating to a charity might not directly benefit the giver, but the user is okay with it. Here, the charity's intent is to help others, which aligns with a broader social good, so the user might accept emotional appeals for altruistic causes. The friend's request, while personal, serves their own interest, making it feel manipulative.

  The user might need to reconsider their view on the charity case if they generally oppose emotional manipulation. But they don't, so perhaps intent (helping others vs. self-interest) is key. Alternatively, the method's honesty—the charity isn't lying about the child, just emphasizing a story to highlight impact.

  A test case: A politician using a personal story to push policy. If the story is true, but used to sway emotions, is it like the charity (acceptable) or the car salesman (unacceptable)? If the policy benefits the public, maybe acceptable. If it's for personal gain, not. But politics is messy. This might challenge the principle.

  Where my reasoning could go wrong: Assuming benevolence is always clear-cut. Teachers might misjudge a student's needs; doctors might have biases. Also, self-interest isn't always bad—salespeople need to make a living. The line between acceptable persuasion and manipulation can blur. If a tactic is transparent and common knowledge (like airline scarcity messages), maybe it's more acceptable, even if commercial.

  What would change my view? If in the charity case, the child's story was exaggerated, then it shifts towards manipulation. Or if the friend's request was for a genuine emergency, not just a move, the emotional appeal might be more justified. Context matters a lot.
answer: |-
  Here's a breakdown of your intuitions, the principle that best explains them, where it fits and struggles, and how to test it:

  **The Core Principle:**  
  **Influence is permissible when the influencer acts as a *trusted agent* prioritizing the *best interests* of the influenced party, using methods that are *transparent in context* and *respect their autonomy*.**  

  **How it Explains Your Verdicts:**

  1.  **Nudging into 401(k) (Fine):** Employer acts as a trusted agent (managing benefits). Enrolling employees in savings demonstrably serves *their* long-term best interests. The default mechanism is increasingly transparent (known in HR/policy circles) and easily overridden (preserves autonomy).
  2.  **Car Salesman Scarcity Cue (Not Fine):** Salesman is *not* a trusted agent; he's an adversary prioritizing *his own* interest (commission). The scarcity cue is manufactured pressure, not transparently about helping *you* make the best decision, undermining genuine autonomy by rushing you.
  3.  **Friend "Only One I Can Count On" (Manipulative):** While a friend *could* be a trusted agent, this appeal prioritizes *their* need (getting help) over *your* best interest/autonomy. It uses emotional leverage (guilt/obligation) that isn't transparent about its persuasive intent; it feels like emotional extortion, not a request respecting your choice.
  4.  **Charity Ad with Named Child (Fine):** The charity is a *cause* agent, not a *personal* trusted agent. However, the method (personal story) is a widely understood and accepted transparent tactic for emotional connection in fundraising. It serves the *cause's* interest, but framed as serving a greater good (helping children) the donor presumably values, respecting autonomy to donate or not. The emotional pull isn't hidden.
  5.  **Teacher Exaggerating Praise (Fine):** Teacher is a trusted agent with a duty to act in the student's best interest (building confidence/encouraging effort). The *intent* is benevolent. While the praise isn't strictly true, the *context* (teacher-student relationship, pedagogical purpose) makes the *intent* transparent *within that relationship*. It respects the student's long-term autonomy by fostering capability.
  6.  **Airline "Don't Waste Your Miles" Sunk Cost Email (Not Fine):** Airline is *not* a trusted agent; it's a commercial entity prioritizing its own interest (retention). Exploiting the sunk cost fallacy preys on a cognitive bias *against* the customer's potential best interest (they might get a better deal elsewhere). The framing isn't transparent persuasion; it's designed to trigger loss aversion, undermining rational autonomy.
  7.  **Airline "Only 3 Seats Left" (Ambiguous):** This is the hardest for the principle. The airline isn't a trusted agent (self-interest). Scarcity cues *can* be legitimate urgency signals. If the scarcity is *real* and common knowledge (like limited sale seats), it might be seen as a transparent market signal. But if it feels like a constant pressure tactic exploiting bias, it violates the principle. Your ambivalence reflects this tension – it's less manipulative than the sunk cost email but still commercial pressure.
  8.  **Doctor Framing Positively (Should Do It):** Doctor is the *quintessential* trusted agent with a fiduciary duty to act in the patient's best interest. Framing information to reduce anxiety and support hopeful, clear decision-making *serves the patient's* well-being. The *intent* (better understanding/less distress) is transparent within the medical context and respects autonomy by aiding comprehension.

  **The Key Difference (Doctor vs. Car Dealer Framing):**  
  The *agent's role and primary intent*. The doctor, as a trusted agent, uses framing to serve the *patient's* interest in understanding and coping. The car dealer, as an adversary, uses framing solely to serve *their own* interest in selling more cars, regardless of whether it's the best decision for the buyer. The *why* matters as much as the *how*.

  **Where the Principle Struggles (Verdicts You Might Need to Give Up):**

  1.  **The Charity Case:** The principle struggles most here. The charity isn't a *personal* trusted agent for the donor. It's using emotional manipulation similar to the friend's guilt-trip, but for a "good cause." Your acceptance likely hinges on endorsing the *cause's* interest as a proxy for a greater good. If you strictly apply the "trusted agent prioritizing *your* best interest," you might need to see this as closer to manipulative. *Saving it requires:* Emphasizing the transparency of the tactic in fundraising and the donor's autonomous choice to support causes they value, even via emotional appeals.
  2.  **The "3 Seats Left" Case:** The principle doesn't give a clear answer because the airline's role is inherently self-interested. Your ambivalence is valid. The principle leans towards "not fine" if you view it as non-transparent exploitation of bias, but allows it if seen as a common, transparent market signal.

  **New Case Test: Politician's Emotional Anecdote**
  *   **Scenario:** A politician uses a heart-wrenching, true story about a single constituent suffering to argue for a policy change, knowing statistics alone won't sway voters as effectively.
  *   **Principle's Verdict:** **Ambiguous, leaning towards acceptable.**
      *   *For:* The politician *should* be acting as a trusted agent for constituents' best interests. The anecdote makes complex policy relatable, aiding comprehension (like the doctor/teacher) and is a transparent political tactic. Voters have autonomy.
      *   *Against:* The politician is often seen as self-interested (re-election). The anecdote could oversimplify or distort the policy's impact, potentially undermining informed autonomy. It prioritizes emotional reaction over rational assessment.
      *   *Conclusion:* Acceptable if the story is representative, the policy genuinely addresses the issue, and the tactic is understood. Manipulative if the story is cherry-picked to mislead.

  **Where My Reasoning is Most Likely Wrong:**

  1.  **Over-reliance on "Intent":** Judging "best interest" and "benevolent intent" is subjective. The teacher might be wrong about what builds confidence. The doctor's framing might unintentionally minimize risks. The charity might waste money. I assume we can reasonably assess intent and outcome, but it's imperfect.
  2.  **"Transparent in Context" is Fuzzy:** What's "transparent" varies wildly (HR policy vs. a friend's guilt trip vs. airline sales tactics). I assume a reasonable person standard within the relationship context, but it's contestable.
  3.  **Downplaying Power Imbalances:** The employer/employee and doctor/patient relationships have inherent power imbalances. Does the 401(k) nudge truly respect autonomy if opting out feels difficult? What if the patient feels pressured by the doctor's framing? The principle might underestimate coercion within "trusted" roles.

  **What Would Change My Mind (e.g., on the Doctor):**
  If presented with robust evidence that positive framing in medical contexts **systematically leads to poorer health outcomes** because patients underestimate risks or decline necessary precautions, I would reconsider. My acceptance hinges on the assumption that the framing genuinely aids comprehension and decision-making *in the patient's best interest*. If it demonstrably harms that interest, it becomes manipulation, regardless of intent.

  **In Summary:** Your gut feelings largely align with judging whether the influencer is acting like a trustworthy helper focused on *your* welfare, using reasonably honest methods that don't trap you. You seem more forgiving when the *intent* is benevolent (teacher, doctor) or the *tactic* is contextually transparent/acceptable (charity, 401k default), and less forgiving when the influencer is self-interested and the tactic exploits cognitive biases without transparency (car salesman, sunk cost email). The principle explains most cases; the charity case requires the most stretching, and the "3 seats left" case highlights the inherent tension in commercial persuasion.
