    - Exit at second intersection: payoff 4
    - Continue past both: payoff 0

  The driver cannot remember which intersection he is at, so the state is not observable. He must use the same strategy at both intersections.

  We model the problem as a Partially Observable Markov Decision Process (POMDP) with two states: state 1 (first intersection) and state 2 (second intersection). However, the driver cannot distinguish between the two. The actions are {E, C}. The transition is deterministic: from state 1, if he continues, he goes to state 2; from state 2, if he continues, he goes to a terminal state (with payoff 0). If he exits, he terminates immediately.

  The driver must choose a strategy (a control law) that maps the observation (which is the same in both states) to an action. Since the observation is uninformative, the strategy is simply a probability p of continuing at each intersection (and 1-p of exiting). We can think of this as a randomized stationary policy.

  Pre-commitment (design phase): The driver, before starting, chooses p to maximize the expected payoff.

  The expected payoff is:
    - If at state 1 (with probability 1 initially):
        - With probability p: continue to state 2.
        - With probability 1-p: exit and get 1.

    Once in state 2 (if he continued at state 1):
        - With probability p: continue and get 0.
        - With probability 1-p: exit and get 4.

  So the expected payoff is:
    V = (1-p)*1 + p * [ (1-p)*4 + p*0 ]
      = 1 - p + p*(4 - 4p)
      = 1 - p + 4p - 4p^2
      = 1 + 3p - 4p^2

