  For pedagogy, I'll structure the response around three tiers: accurate claims (rigid designation), acceptable simplifications (water/H2O necessity), and errors (modal realism). The "big finish" critique should emphasize that Kripke opens conceptual space for scientific essentialism but doesn't endorse it as metaphysical doctrine. 

