  Hmm... the core challenge is assessing whether the intuition behind the asymmetry is robust. I recall Parfit's non-identity problem really undermines person-affecting views, but then Benatar's "better never to exist" argument pulls back. And there's that nagging feeling that failing to create happiness feels neutral while creating misery feels horrific - but is that loss aversion masquerading as ethics? 

