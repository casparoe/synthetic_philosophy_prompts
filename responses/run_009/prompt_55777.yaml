prompt: |-
  I'm a TA on our third-year Formal Epistemology course, and I've got a stack of take-home problem sets to grade by monday. The set had one question on logical uncertainty and the logical induction framework (Garrabrant, Benson-Tilsen and colleagues, 2016), which we only added to the syllabus this year after I lobbied for it, so I've never graded answers to it before and my co-TA is away at a conference. The rubric splits the ten marks as follows: 4 for explaining why logical uncertainty is a problem for Bayesian epistemology, 3 for correctly describing the mechanism (deductive process, market, traders, the criterion itself), and 3 for what the framework does and doesn't guarantee. Below I've pasted the exam question as the students recieved it, followed by one student's answer verbatim.

  For this one, please act as the grader. Give me an overall mark out of 10 and then a point-by-point assessment of the answer that justifies the mark — note not just errors but also the places where it earns credit, including anything correct that's subtle enough that a hasty grader might miss it, since I want to be able to defend every mark I take off and every one I don't. I'm especially worried about letting steps slide that sound plausible but don't actually follow from what precedes them, or claims that quietly conflate this framework with the Bayesian picture it's meant to repair. Keep your assessment under 300 words, and please write it in British English.

  ---

  **Question (10 marks):** A perfectly rational Bayesian agent is logically omniscient: it assigns probability 1 to anything derivable from what it already knows. Yet working mathematicians have intermediate degrees of confidence in open conjectures such as Goldbach's conjecture long before any proof or refulation is found. Explain why this is a problem for Bayesian epistemology as a model of real reasoners. Then describe how the logical induction framework of Garrabrant et al. (2016) approaches the problem: what the deductive process is, how the market of traders works, and what the logical induction criterion says. Finally, explain what the framework does and does not guarantee about the beliefs a logical inductor converges to, and whether it yields a practical method for settling open conjectures.

  **Student's answer:** Logical uncertainty is uncertainty about facts whose truth values are already fixed. Whether Goldbach's conjecture holds was settled before anyone was around, so there's no possible observation to condition on; yet mathematicians are more confident in it than in its negation. A Bayesian agent can't represent this state: once it can prove something, its probability for it must be 1, and coherent probabilities over logically related sentences must respect all the consequences of what's known — logical omniscience. So Bayesianism models the ideal reasoner but not the working one.

  The logical induction framework repairs this by modelling the reasoner as a market. Each day, the market posts a price between 0 and 1 for every sentence in the language of, say, Peano arithmetic; the price is the probability. A deductive process runs alongside and emits theorems day by day, as it finds them. Traders watch the prices and look for combinations that guarantee profit — a sentence priced above 1, say, or a provable theorem priced below something it implies. A market that traders can't systematically profit from satisfies the logical induction criterion: no computable trading strategy can extract unbounded returns from it in the limit. Because traders can detect any persistent pattern, the market's beliefs converge to the truth value of every sentence — if Goldbach is true its price goes to 1, and to 0 if false — so in principle running a logical inductor long enough would settle it. Nicely, the market even anticipates the deductive process: beliefs in theorems the prover will eventually state tend to 1 before the prover gets there (provability induction), and it learns to treat unpredictable-looking sequences statistically, e.g. giving about 10% probability to any given late digit of pi. Day to day, the market simply updates on the newly generated theorems as evidence, exactly like Bayesian conditioning, so the usual machinery applies unchanged.
reasoning: |-
  Alright, let me tackle this grading task step by step. The student's answer needs to be assessed against the rubric's three sections: explaining why logical uncertainty is problematic (4 marks), describing the mechanism (3 marks), and explaining guarantees/limitations (3 marks).

  First, for the problem with Bayesianism: The student correctly identifies logical omniscience as the core issue, noting Bayesians must assign P=1 to provable statements and can't represent intermediate confidence in open conjectures. They specifically mention Goldbach's example and the lack of observational evidence - good. But they miss explaining why coherent probabilities "respect all consequences" (Dutch book vulnerability). Still, this covers most key points. I'd award 3.5/4 here.

  On the framework description: The market setup, deductive process, and trader roles are accurately outlined. The profit-seeking behavior and examples (priced above 1) demonstrate understanding. The logical induction criterion is correctly defined via unbounded returns. However, they omit that traders are computable and the market must satisfy the criterion - minor slip. The provability induction and statistical learning points are excellent additions. But the final claim about "updates exactly like Bayesian conditioning" is dangerously wrong - this conflates the framework with standard Bayesian updating. That's a significant error. So 2/3: strong on setup but major misconception at the end.

  For guarantees: They correctly note convergence to truth values and provability induction. The pi digit example well illustrates statistical learning. But they falsely claim running it "long enough would settle" conjectures - ignoring that convergence speed is uncomputable, making it impractical for actual open problems. This overstatement misses a key limitation. They also don't mention failure modes (e.g., non-convergence for undecidable statements). Thus 1.5/3: right on strengths but silent on critical weaknesses.

  Total: 3.5 + 2 + 1.5 = 7/10. The conditioning conflation and impracticality oversight are substantive deductions, but the core concepts are largely grasped.
answer: |-
  ### Grading Assessment (7/10)  
  **British English used throughout.**

  **1. Explaining why logical uncertainty is a problem (3.5/4):**  
  *Credit*: Correctly identifies logical omniscience as the flaw (Bayesians assign P=1 to provable statements), uses Goldbach’s conjecture as an example of intermediate confidence, and notes the absence of observable evidence. Highlights the inability to represent non-omniscient states.  
  *Deductions*: Fails to explicitly link coherent probabilities to Dutch book vulnerability (i.e., violating probability calculus if uncertainty ignores logical entailments). Minor omission (-0.5).  

  **2. Describing the mechanism (2/3):**  
  *Credit*: Accurately outlines the market (prices as probabilities), deductive process (emits theorems), traders (profit-seeking via inconsistencies), and the logical induction criterion ("no computable trading strategy can extract unbounded returns"). Provability induction and statistical learning (pi digits) are correctly noted.  
  *Deductions*: Claims the market "updates on newly generated theorems exactly like Bayesian conditioning". This is incorrect: logical inductors do *not* use standard Bayesian conditioning (they avoid conditionalisation’s omniscience demands). Major conflation (-1).  

  **3. Explaining guarantees/limitations (1.5/3):**  
  *Credit*: Correctly states beliefs converge to truth values (P→1 for true sentences, P→0 for false) and cites provability anticipation. The pi example validly illustrates statistical calibration.  
  *Deductions*: Falsely claims running the inductor "long enough would settle [Goldbach]" in practice. The framework guarantees convergence *in the limit* but offers no computable bound, making it impractical for real conjectures. Omits that it doesn’t guarantee *timely* convergence or handle undecidable sentences (-1.5).  

  **Overall (7/10):**  
  A strong grasp of core concepts (convergence, traders, logical omniscience critique) but undermined by critical errors: conflating update mechanisms and overstating practical guarantees. The Bayesian conditioning claim is a significant misunderstanding, while the "settling conjectures" point ignores uncomputable convergence. Awarded 7 for clarity on strengths but penalties for key misconceptions.
