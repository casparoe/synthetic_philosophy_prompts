prompt: |-
  Last year my housemates and I had a stupid but intense dispute about how to split rent, given that the rooms differ a lot, and we brought in a friend as a mediator. The thing I keep thinking about since is that her entire method was: get each of us to name a number, then push us toward the middle of the two numbers, with each round of offers narrowing the gap. When I later read that negotiation consultants advise you to never open with an offer, or to open with an absurd one, it hit me that "meet in the middle" as a fairness norm is hostage to whatever numbers get threw out first. And yet everyone in the room, including me, felt like the midpoint had some claim to fairness — it just *felt* fair, in a way that, say, the midpoint between my estimate of the grocery bill and my housemate's wouldn't.

  I also stumbled onto the fact that game theorists have formal proposals for what a fair deal is, and they don't work off midpoints of offers at all. One idea (I think it goes back to Nash, of equilibrium fame) says: identify what happens if there's no deal — the fallback — and pick the deal that maximizes the product of each side's gain over that fallback. A different one says: each side has a best case, the most they could possibly get out of this dispute, and a fair deal keeps the two sides' gains in proportion to their best cases, so whoever stood to gain more keeps gaining more. What struck me is that both of these make the no-deal scenario and the best-case scenario do all the work, and the actual offers do none of it — so the everyday practice and the formal ones don't even seem to share inputs.

  So here's what I want to know: what theory of fairness does the everyday practice — haggling to the middle, mediators proposing the average, evenly splitting a restaurant bill no matter who ordered the steak — actually presuppose? It looks like it presupposes that the offers themselves carry the relevant information, which can't be right given how gameable that is, unless there's some story about why stated offers are meaningful anyway. And there's the other side of it: we would never compromise toward the middle on a factual dispute (if I say the store closes at 7 and you say 8, we don't agree it closes at 7:30), so does the split-the-difference norm presuppose that the thing being divided is a matter of competing claims rather than of fact — and if so, what happens to the norm in cases, like our rent dispute, that are partly factual, since some rooms objectively cost more to rent? Finally, is everyday splitting just a crude approximation of one of the formal ideas, or does it genuinely diverge from both — and if we rebuilt the practice around the proportional one, what would actually change in how people haggle? I'd like the implicit theory reconstructed properly, an honest account of where the practice is too sloppy to pin down any single theory, and not a lecture on bargaining theory.
reasoning: |-
  Okay, let me try to unpack this user's query. They had a rent dispute with housemates where a mediator used a "meet in the middle" approach. The user later realized that formal game theory models like Nash bargaining don't rely on initial offers at all. They're confused because the midpoint felt fair intuitively, even though it's gameable. 

  First, I need to understand why the midpoint feels fair. It might be about perceived equality in concession-making rather than actual fairness. When both parties move toward the middle, it feels like equal sacrifice. But in rent disputes, there are objective factors like room size that get ignored. That's why splitting a bill feels different from a factual dispute - it's about distributing burden, not truth.

  The user also wonders if everyday splitting approximates formal models. But Nash bargaining uses threat points (no-deal outcome), while midpoint ignores that. The best-case proportional model isn't represented either. So everyday practice seems genuinely different, prioritizing process over substance.

  For rent specifically, the mediator treated it as pure negotiation when it's actually mixed - part factual (room values), part distributive. The midpoint method fails here because it doesn't incorporate objective differences. If they used Nash bargaining, they'd first establish the no-deal scenario (e.g., someone moves out) and maximize joint gains from there. That might lead to very different rent allocations.

  The key insight is that "split the difference" works best when there's no objective baseline, when parties have equal power, and when maintaining relationships matters more than optimal outcomes. In rent disputes with clear inequities, it's inadequate. But people default to it because it's simple, symmetric, and reduces conflict quickly - even if suboptimal.

  The user's deeper frustration seems to be about using a process that feels fair but isn't actually equitable. They want validation that their intuition about the method's flaws was correct, and perhaps alternative approaches for future disputes. I should acknowledge that while the midpoint method has psychological appeal, it's not robust for complex distributive problems.
answer: |-
  Your frustration with the "meat in the middle" norm is spot-on. It *feels* fair intuitively, yet clashes with formal fairness concepts and seems easily manipulated. Let's reconstruct the implicit theory behind everyday splitting and where it diverges:

  **The Implicit Theory of "Split the Difference" Fairness:**

  1.  **Fairness as Equal Concession:** The core belief isn't about the *absolute outcome*, but about the *process of giving ground*. Fairness is achieved when *both parties make equal sacrifices* from their initial positions. The midpoint symbolizes this perfectly balanced concession.
  2.  **Information in the Offer (But Not What You Think):** Offers *do* carry information, but **not primarily about the objective value of the good**. Instead:
      *   **Revealed Preference/Need:** "This is what *I* believe is acceptable/fair *for me*." It signals their subjective valuation or minimum acceptable outcome.
      *   **Bargaining Power/Stakes:** A very high/low initial offer signals perceived leverage or desperation (though this is often bluffing).
      *   **Anchor Points:** Psychologically, initial offers set anchors that bias perception. The midpoint feels like a natural resolution *relative to those anchors*, regardless of external reality.
  3.  **Fairness as Conflict Resolution:** The primary goal isn't maximizing welfare or adhering to abstract principles, but *ending the dispute efficiently and preserving the relationship*. The midpoint achieves this because:
      *   **Symmetry:** It treats both parties identically.
      *   **Finality:** It provides a clear, unambiguous stopping point.
      *   **Shared Burden:** Both parties "lose" equally from their ideal.
  4.  **Assumption of Symmetric Context:** The norm assumes rough parity in legitimacy, need, and bargaining power. If one party is objectively wrong or has vastly more power, splitting the difference feels *un*fair (hence your grocery bill example).
  5.  **Distributive vs. Factual Claims:** You nailed this distinction. Splitting the difference presupposes:
      *   **No Single Objective Truth:** The "fair" price/division isn't knowable or isn't the point.
      *   **Competing Legitimate Claims:** Both parties have *some* valid claim or perspective on the resource, even if exaggerated. It's about dividing a pie, not discovering a fact. This is why it fails utterly for factual disputes – there *is* a knowable truth.

  **Where the Practice is Sloppy (No Single Theory):**

  1.  **Ignoring the BATNA (Best Alternative To a Negotiated Agreement):** The formal models (like Nash) crucially depend on the "no-deal" outcome (e.g., moving out, going to court, finding another roommate). Everyday splitting ignores this entirely. Your rent dispute outcome *should* have been influenced by the costs/benefits of *no agreement* (e.g., someone leaving, finding a subletter, living in discomfort). Splitting the difference pretends the BATNA doesn't exist or is symmetric.
  2.  **Ignoring Objective Benchmarks:** In the rent case, there *are* partially objective factors (size, light, ensuite, closet space). The midpoint method treats the initial offers as the *only* relevant inputs, discarding any external evidence of fair market value for each room. It reduces everything to subjective positioning.
  3.  **Equality of Sacrifice vs. Equality of Outcome:** It conflates "we both moved the same amount" with "this outcome is objectively fair". Moving equally from absurd starting points doesn't guarantee fairness.
  4.  **Assumption of Good Faith:** It works best if initial offers are *roughly* reasonable starting points reflecting genuine beliefs. It breaks down spectacularly if one party opens with an absurdly aggressive or passive offer purely to game the midpoint.

  **Divergence from Formal Models & Impact of Switching:**

  *   **Nash Bargaining Solution (Maximize Product of Gains):** This fundamentally requires defining the *disagreement point* (BATNA). Gains are measured *over that baseline*. It doesn't care about initial offers at all, only about maximizing the joint surplus relative to the threat point. **Impact of Switching:** Negotiators would first need to explicitly agree on the "no-deal" scenario and its costs/benefits for each party. The focus would shift from "how far did you move?" to "what is the best joint outcome we can achieve compared to walking away?" Your rent dispute would start by asking: "What happens if we *don't* agree? What are the costs/alternatives for each of us?"
  *   **Proportional Solutions (e.g., Kalai-Smorodinsky):** This requires defining each party's *ideal point* (best possible outcome for them) and the disagreement point. Fairness means gains relative to the disagreement point are proportional to the *potential* gains (distance from disagreement to ideal). Again, initial offers are irrelevant; what matters is the range of *possible* outcomes. **Impact of Switching:** Negotiators would need to identify (or estimate) the absolute best outcome each could possibly achieve if they got everything they wanted *and* the other party capitulated completely (often unrealistic). Fairness then links the *potential* for gain to the *actual* gain. In rent, this might mean the person who *could* save the most money by getting the best room (relative to the BATNA) *does* save more, but proportionally less than their maximum possible saving.

  **What Changes if We Rebuilt Around Proportional/Nash Ideas:**

  1.  **Shift in Focus:** Negotiations start by defining fundamental boundaries: "What happens if we fail?" (BATNA) and "What is the absolute best/worst case for each of us realistically?" (defining the bargaining range). Initial offers become less central anchors.
  2.  **Need for External Information:** Objective benchmarks (like fair market room valuations) become *more* important to define the potential gains and the disagreement point, rather than being drowned out by subjective initial offers.
  3.  **Less Gaming of Openers:** The incentive to open absurdly high/low diminishes because the final outcome is determined by the baseline and potential range, not the midpoint of the offers. A ridiculous opening bid doesn't drag the settlement toward it in the same way.
  4.  **Potential for More Complex, But Objectively Fairer, Outcomes:** Outcomes would more directly reflect the underlying realities of alternatives, costs, and potential benefits, rather than the symmetry of concession. The person with a much better BATNA (e.g., easier time finding a new place) or much greater potential gain/loss might see a different result than simple splitting.
  5.  **Increased Friction?** Defining BATNAs and ideal points can be difficult and potentially contentious ("Your alternative isn't *that* good!"). The elegant simplicity and speed of "meet in the middle" would be lost. It requires more analysis and potentially more conflict upfront.

  **Conclusion:**

  The everyday "split the difference" norm rests on an **Implicit Theory of Procedural Fairness through Equal Concession within a Symmetric Bargaining Context**. It prioritizes resolving conflict efficiently, preserving relationships through symmetrical sacrifice, and using the offers themselves as signals of subjective valuation and anchors for agreement. It presupposes the dispute is purely distributive (dividing a pie with no single right answer) and ignores both objective benchmarks and the critical no-deal alternative (BATNA).

  It **genuinely diverges** from formal models like Nash (which uses the BATNA) or Proportional solutions (which use BATNA + ideal points). It's not a crude approximation; it solves a *different problem*: minimizing conflict and achieving closure quickly when parties have roughly symmetric legitimacy and the stakes are relational. It works well for splitting a restaurant bill among friends (low stakes, symmetric consumption claim, no BATNA beyond awkwardness) but is **inadequate for disputes with significant objective inequities, asymmetric BATNAs, or high stakes** – like your rent situation.

  Rebuilding around Nash or Proportional models would make negotiations more analytical, less susceptible to anchoring games, and potentially fairer based on underlying realities and alternatives. However, it would sacrifice simplicity and speed, requiring parties to grapple upfront with uncomfortable questions about their best alternatives and maximum demands. The persistence of "split the difference" suggests its psychological appeal and efficiency often outweigh its substantive shortcomings in everyday, relatively low-stakes conflicts among peers. Your rent dispute highlights exactly where its limitations become painfully clear.
