prompt: |-
  I'm on the board of a small charitable foundation, and we rank grant applications by having our analyst compute an expected value for each one and sorting them in a spreadsheet. Our analyst (who's read some decision theory) claims that for a couple of our riskier grants, the numbers are actually Pasadena-style: the far-out outcomes swing between huge upside and catastrophic downside as you go down the tail, so the expected value series is only conditionally convergent — meaning the order in which the spreadsheet tallies the rows can change the final sum, like the Pasadena game of Nover and Hájek. Please describe the most important implications of the Pasadena paradox for how our board should handle grant decisions like this. We're not philosophers and our maths is rusty, so keep it tied to what we should actually do in the meeting room rather than abstract theory. One thing I'm espeically curious about: does it matter that we face these decisions repeatedly (annual grant cycles) instead of once? Oh, and pls write the whole answer in British English.
reasoning: |-
  Okay, the user is on the board of a charitable foundation dealing with grant applications. Their analyst has flagged that some risky grants have Pasadena-style expected values, where the sum depends on the order of calculation due to conditional convergence. The board needs practical advice on handling this in meetings, considering they make these decisions annually. 

  First, I need to unpack the Pasadena paradox implications without drowning them in theory. The core issue is that the expected value isn't a fixed number but can be manipulated by rearrangement. That's disastrous for ranking grants. I should emphasise concrete meeting tactics: no more blind sorting by EV, adding qualitative risk flags, maybe grouping tail outcomes. 

  The repeat decision angle is interesting. Since they do this yearly, they could aggregate risks across cycles—like treating extreme tail events as portfolio-level concerns rather than grant-specific. Also, consistency in calculation order matters for year-on-year comparisons. 

  User's clearly time-pressed (rusty maths, not philosophers) so I'll avoid jargon. British English is requested—easy enough with "maths", "prioritise", etc. Their anxiety about "what to do in the meeting room" suggests they need scripts: "Move that we...", "Propose capturing...". 

  Biggest unspoken worry? Probably that their whole ranking system is unstable. I should reassure that minor tweaks can restore reliability while acknowledging the EV model's limits for extreme uncertainty. The repeated decisions point subtly hints at resilience—one catastrophic grant won't sink them if they diversify. 

  Right, structure: first explain why it breaks their process, then meeting solutions, then annual cycle nuances. End with voting recommendations so they leave with actionable steps.
answer: |-
  Right then, let's cut through the theory and get down to brass tacks for your board meetings. Your analyst is spot on – if these grants genuinely behave like the Pasadena game, where wildly positive and negative outcomes alternate *infinitely* as you consider rarer and rarer scenarios, then the standard Expected Value (EV) calculation is fundamentally unstable. It's not just 'risky'; it's mathematically incoherent as a single ranking number. Here's what that means practically for your grant decisions:

  **Key Implications & Practical Steps for the Board Room:**

  1.  **Bin the Simple EV Sort for These Grants:** The most critical takeaway is this: **you absolutely cannot reliably rank these specific "Pasadena-style" grants just by sorting them by the analyst's calculated EV in your spreadsheet.** Why? Because that calculated EV is essentially arbitrary. If the analyst changed the *order* in which they added up the potential outcomes (e.g., grouping big wins first vs. big losses first), the final EV number could swing wildly positive or negative. Sorting by this number is meaningless and potentially dangerous.

      *   **What to do in the meeting:** Acknowledge this limitation upfront for these specific grants. Move them off the main "Rank by EV" list. Treat them as a separate, special category requiring deeper, qualitative discussion. Say: *"For grants X and Y, the analyst has highlighted the EV calculation isn't stable due to the nature of the extreme risks and rewards. We cannot rank them reliably by the number alone. We need to discuss these separately."*

  2.  **Focus on the "Core" Distribution & Key Scenarios:** Instead of relying on a single, fragile EV number, force the discussion onto the *structure* of the risks and rewards within a more plausible range.
      *   **What to do in the meeting:** Direct the analyst (or do it yourselves) to:
          *   **Identify a "Reasonable Tail":** Agree on a cut-off point for probability (e.g., events more improbable than 1 in 100 or 1 in 1000). Summarise everything beyond this as "Extreme, Unknown Tail Risk/Reward".
          *   **Calculate a "Truncated EV":** Calculate the EV *only* for outcomes within this "reasonable" probability range (e.g., 99% or 99.9% of the distribution). **Treat this as the primary anchor for discussion, not a gospel truth.** Label it clearly as "Core Scenario EV".
          *   **Explicitly List Key Extreme Scenarios:** For the tail beyond the cut-off, list 2-3 of the most significant (but still very low probability) potential *upsides* and *downsides*. E.g., "Tail Upside: 0.5% chance of £10M breakthrough", "Tail Downside: 0.3% chance of £5M liability + reputational damage".
          *   **Discuss the 'Character' of the Tail:** Is the catastrophic downside truly existential for the foundation? Is the huge upside genuinely transformative? How credible are these tail scenarios?

  3.  **Make Risk Appetite Explicit:** The Pasadena paradox forces you to confront *how* you weigh the extremes, not just the average. Your board's subjective tolerance for ruinous risk versus its hunger for transformative wins becomes paramount.
      *   **What to do in the meeting:** Before diving into the specific grants, briefly reaffirm (or establish) the foundation's stance on catastrophic risk. Questions like: *"Are we willing to entertain *any* grant with a non-zero chance of crippling the foundation, even if the 'core EV' looks good?"* or *"How much potential downside are we willing to accept for a shot at a truly massive, field-changing outcome?"* Frame the discussion of the Pasadena grants around this appetite. *"Given our low tolerance for existential risk, does the potential £5M+ downside in Grant Y's tail, even at 0.3%, rule it out despite its positive Core EV?"*

  4.  **Prioritise Robustness & Downside Protection:** When dealing with conditionally convergent EVs, the potential for catastrophic loss is a very real mathematical feature, not just an unlikely event. Protecting the foundation's core mission and sustainability should be the primary concern.
      *   **What to do in the meeting:** Scrutinise the mechanisms for *limiting* potential losses far more intensely than for standard grants. Ask: *"What's the absolute maximum we could lose? How quickly could that loss materialise? What contractual or operational safeguards are *actually* in place to cap our liability? Are these safeguards robust enough if the worst tail event happens?"* If adequate, verifiable downside protection isn't feasible, the grant is likely too dangerous, regardless of tantalising tail upsides.

  **Regarding Repeated Annual Decisions (The Crucial Bit):**

  This changes the calculus significantly and offers a potential way forward:

  1.  **Aggregate the Tail Risk:** The *really* catastrophic downside events (e.g., foundation-ending loss) are presumably extremely rare. Facing decisions *repeatedly* over years means you can think about the *aggregate* risk across your *entire portfolio of grants over time*, rather than just the risk from one grant in isolation.
      *   **Implication:** A single grant with a tiny chance of catastrophe might be acceptable *if* the foundation has a sufficiently large and diversified grant portfolio *and* sufficient reserves. The catastrophic risk is spread across many independent (hopefully) gambles.
      *   **What to do in the meeting:** Discuss these Pasadena grants in the context of your *overall annual portfolio* and *long-term reserves*. *"If we fund Grant Y this year, alongside our usual 20 safer grants, does the *combined* probability of a catastrophic loss from *any* grant this cycle exceed our tolerance? Do we have reserves to absorb the maximum plausible loss from Grant Y without threatening core operations, even if it hits?"* This portfolio-level view makes the tail risk more manageable.

  2.  **Consistency in Calculation is Vital (But Still Not Sufficient):** If you decide to use *any* form of truncated EV for comparison *across years*, the analyst **must** use the *exact same methodology and probability cut-off* every single time. Changing the truncation point or the order of calculation year-on-year makes comparisons meaningless.
      *   **What to do in the meeting:** Agree and minute the specific methodology for handling these "Extreme Risk/Reward" grants: *"For grants identified as having unstable EVs, we will calculate a Core Scenario EV using a 99.5% probability cut-off (capturing events down to 0.5% likelihood). Outcomes beyond this will be listed qualitatively as 'Tail Scenarios'. This methodology will be applied consistently for all such grants in future cycles."*

  3.  **Build Institutional Knowledge & Resilience:** Repeated exposure allows the board to develop a calibrated intuition for these extreme grants. Track what happens! Did the "transformative upside" tail event nearly materialise? Did a feared downside scenario occur elsewhere, informing your safeguards?
      *   **What to do in the meeting:** Briefly review the outcomes of previous "Pasadena-style" grants funded. *"Last year's high-risk Grant Z had a similar tail risk profile. The downside didn't materialise, but nor did the massive upside. The Core Scenario EV outcome was moderately positive. Does this experience make us more or less comfortable with Grant Y this year?"*

  **In Summary – Your Boardroom Action Plan:**

  1.  **Isolate & Flag:** Identify and separate Pasadena-style grants. Don't rank them by raw EV.
  2.  **Demand Truncated Analysis:** Require a "Core Scenario EV" (e.g., covering 99-99.5% likelihood) and a *short* list of key tail risks/rewards.
  3.  **Reaffirm Risk Appetite:** Explicitly discuss tolerance for catastrophic loss vs. desire for huge wins.
  4.  **Scrutinise Downside Protection:** Make robust safeguards for limiting losses non-negotiable.
  5.  **Think Portfolio & Reserves:** Assess the grant's extreme risks in the context of your *entire annual funding portfolio* and foundation reserves. This is key for repeated decisions.
  6.  **Standardise Methodology:** Agree on and stick to a consistent calculation approach for these grants year-on-year.
  7.  **Prioritise Robustness:** When in doubt, favour protecting the foundation's core mission and sustainability over chasing elusive, infinite-tailed rewards.
  8.  **Qualitative Debate:** Make the final funding decision for these specific grants through structured, qualitative board debate informed by points 1-7, not by a spreadsheet sort.

  By acknowledging the mathematical instability and shifting the discussion to core scenarios, explicit tail events, portfolio risk, and institutional resilience, your board can make reasoned, responsible decisions on these complex grants without being misled by a meaningless expected value number. The repeated nature of your decisions is actually a strength here, allowing you to manage the extreme tail risks at a portfolio level.
