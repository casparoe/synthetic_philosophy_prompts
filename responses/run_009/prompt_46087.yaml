prompt: |-
  I'm a senior analyst at a nonpartisan legislative research office. My team drafts and reviews policy briefs for state legislators — about six to ten a month — and one recurring failure mode is what our director calls "evidence drag": a brief piles up descriptive findings (obesity rates, crash statistics, wage data) and then slides, without ever stating the premise doing the work, into a recommendation. When challenged, drafters say the evidence "speaks for itself." Sometimes it nearly does; sometimes the missing premise is the whole argument, and one that a sizable share of our readers reject. Because we are nonpartisan, we cannot tell drafters which values to endorse — but we do need a defensible way to tell them when their argument silently relies on one.

  What I want from you is a review procedure, grounded in the actual philosophy here, that my analysts can run on any draft brief. To build it well, you'll need to respect a distinction that popular treatments blur: the is-ought problem is about inference (descriptive premises purporting to entail a normative conclusion), whereas Moore's naturalistic fallacy and open-question argument are about definition (identifying the property of goodness with some natural property). The procedure should draw on both where each actually applies, and should also engage the standard challenges to the gap's universality: Searle's derivation of an obligation from institutional facts, the phenomenon of thick ethical terms that are simultaneously descriptive and evaluative, and the point that many apparently factual premises are already covertly normative.

  The procedure itself should be an ordered checklist — the questions to ask of a brief, in sequence, with criteria for what counts as an adequate answer at each step, explicit stopping points where the analyst flags the brief for revision, and clearly marked handoff points where the question is one of values rather than of argument structure and must go to a person rather than a rule. It should distinguish at least these three outcomes: (1) a genuine unbridged inference, where a normative conclusion rests on purely descriptive premises and the bridge premise must be surfaced; (2) a false alarm, where the normativity was present in the premises all along — in institutional facts, in thick terms, in evaluatively loaded concepts like "harm" or "need" — and flagging a gap would be pedantry; and (3) the genuinely hard middle, where the descriptive and normative can be pried apart only at the cost of mangling the argument. It should incorporate a usable version of the open-question test as a diagnostic for outcome (1) — when substituting the natural property for the normative term leaves a substantive question rather than a triviality — while being honest about the test's limits as Moore himself and later critics understood them.

  Then run the procedure, step by step and showing its work, on these four passages of the kind we actually see:

  A. "Seat belt use reduces fatal-injury risk by roughly 45%. Despite decades of public campaigns, compliance in our state remains 88%, well below the national leader. We recommend primary-enforcement seat belt legislation."

  B. "Humans are an intensely social species with an evolved need for belonging; loneliness among adults under 30 has risen sharply over two decades. Civic associations — leagues, choirs, service clubs — are the natural vehicle for this need. The legislature should fund community-civic grants."

  C. "Under the state statute, a landlord must return a security deposit within 30 days of lease termination or provide an itemized statement of deductions; the deposit in question was neither returned nor accounted for after 90 days. The tenant is therefore entitled to the statutory penalty."

  D. "Paid family leave is associated with measurable improvements in infant health and maternal workforce retention. Several peer states have enacted it. We recommend a twelve-week paid family leave program."

  Note that our office endorsed D in principle last session, and I personally support it — so pay special attention to what the procedure does with it. If the procedure flags D's inference in exactly the way it flags A's, that is a feature, not a bug, and I want the write-up to say so plainly; a procedure that goes easy on arguments we like is worthless to us. Include at least one passage where the procedure returns an answer I will find inconvenient, and at least one where it correctly declines to flag.

  Finally, tell me where the procedure fails. I'm thinking specifically of: briefs whose normative premises are so widely shared in our readership that surfacing them would look obtuse (does the procedure have a materiality threshold, and can one be principled rather than political?); cases where every available phrasing of the bridge premise itself contains thick terms, so the flag just relocates the problem; and the risk that a formal gap-flagging procedure becomes a rhetorical weapon — a way to bury arguments one dislikes under procedure. Say what the procedure cannot do and where it should simply hand the draft back with a note saying the value question is the whole question.

  Assume the analyst running this has a bachelor's degree, no philosophy, and about twenty minutes per brief. Keep the philosophical content load-bearing but invisible in the final output: the checklist itself should use plain language a legislative staffer would not blush to circulate, with the theory confined to the rationale you give me for each step.
reasoning: |-
  We are building a checklist procedure to identify when a policy brief commits "evidence drag" — sliding from descriptive premises to a normative conclusion without a clear bridge premise. The procedure must handle:
  - The is-ought problem: when a normative conclusion is inferred from purely descriptive premises without a connecting normative premise.
  - Moore's naturalistic fallacy: when the argument identifies a natural property (like "pleasure" or "social need") with the property of goodness, which Moore argued is indefinable (open-question argument).
  - But we must also account for challenges: 
     a) Institutional facts (Searle): e.g., "You promised" implies "You ought to do it" because of the institution of promising.
     b) Thick ethical terms: terms that are both descriptive and evaluative (e.g., "cruel", "brave").
     c) Covertly normative premises: premises that appear descriptive but rely on normative concepts (e.g., "harm", "need").

  The procedure will have three outcomes:
  1. Genuine unbridged inference: we must flag and require surfacing the bridge premise.
  2. False alarm: the normativity was in the premises (via institutional facts, thick terms, or covertly normative concepts) so no gap.
  3. Hard middle: the descriptive and normative are so intertwined that prying them apart would break the argument. We must note this and hand off to a human for a values decision.

  We'll design an ordered checklist with questions. Each step has criteria and stopping points. We'll also use a version of the open-question test: if substituting the descriptive property for the normative term leaves a substantive open question, then there's a gap.

  Checklist Steps:

  Step 1: Identify the conclusion and the supporting premises.
     - Extract the recommendation (normative conclusion) and the statements offered as reasons (premises).
     - Criteria: The conclusion must be prescriptive (using words like "should", "ought", "recommend", "entitled"). Premises are the statements that are not the conclusion and are presented as supporting it.
     - If there is no normative conclusion, stop: no issue of evidence drag.

  Step 2: Check for explicit normative premises.
     - Look for any premise that is explicitly normative (e.g., "we ought to reduce traffic fatalities", "it is the state's duty to promote health").
     - If such a premise is present and clearly links the descriptive premises to the conclusion, then outcome (2): false alarm. The argument has a normative premise and the gap is bridged.
     - But note: sometimes a premise might be a normative principle that is not stated. We will check for it in the next steps.

  Step 3: Check for institutional facts (Searle).
     - Are the descriptive premises about an institutional fact (like a law, a contract, a rule, a promise) that by its nature carries an obligation?
     - Example: "The statute says X" implies "one ought to do X" because of the institution of law.
     - If the argument relies solely on an institutional fact and the conclusion is about what ought to be done within that institution, then outcome (2): false alarm. The normativity is built into the institution.

  Step 4: Check for thick terms and covertly normative concepts.
     - Scan the premises for thick ethical terms (e.g., "cruel", "unfair", "negligent") or concepts that are commonly used in a way that carries evaluation (e.g., "harm", "need", "rights", "benefit").
     - Also, look for terms that might be descriptive but in context are used normatively (e.g., "efficient", "effective", "safe").
     - If the premises contain such terms, then they are not purely descriptive and the argument may not have a gap. Outcome (2): false alarm.

  Step 5: Apply the open-question test (for when previous steps didn't resolve).
     - For each descriptive premise, try substituting the key descriptive property in the conclusion with the property from the premise. Then ask: "Is it an open question whether that property is good (or right, etc.) in this context?"
     - Example: In argument A, the conclusion is about what we should do (enact legislation). The descriptive premise is about risk reduction. Substitute: "Seat belt use reduces fatal-injury risk by 45%. Therefore, we should enact legislation because reducing fatal-injury risk is good?" -> The open question: "Is reducing fatal-injury risk always good?" (It might be, but it's not a tautology; one might argue that it comes at too high a cost to liberty, etc.) So, a bridge premise is needed: "Reducing fatal-injury risk is a good that justifies legislation."
     - If the substitution leaves a substantive open question (i.e., it's not trivial and the answer is not obviously "yes" by definition), then we have outcome (1): unbridged inference. We must flag that a bridge premise is missing.

  Step 6: Check for the hard middle.
     - Sometimes, even after Step 5, it might be that the argument is so deeply embedded in a normative framework that separating the descriptive and normative would be artificial and damaging. This is especially true when the premises use thick terms that are central to the argument and the open-question test doesn't clearly apply because the term is both descriptive and normative.
     - In such cases, we have outcome (3): the hard middle. We note that the argument relies on a value judgment that is not explicit but is integral. We hand this off to a human (the drafter or a supervisor) to decide whether to make the value explicit or rework the argument.

  Step 7: Materiality threshold and political context.
     - We must be cautious not to flag every single inference. Some bridge premises are so widely accepted that pointing out the gap would be pedantic (e.g., "preventing death is good"). However, we cannot let political popularity decide because we are nonpartisan. Instead, we use a materiality threshold: if the bridge premise is one that is uncontroversial in the context of the legislative body and the issue, then we might not flag it. But note: this is risky because what is uncontroversial to one might not be to another. Therefore, we design the procedure to flag all gaps, but we allow for a step that asks: "Is the bridge premise so uncontroversial in this context that surfacing it would add no value?" If the analyst (or a supervisor) judges that it is, then they can note it and move on. But this judgment must be made sparingly and with caution.

  Step 8: Flagging and revision instructions.
     - For outcome (1): Flag the gap and require the drafter to state the bridge premise explicitly. The bridge premise must be a normative statement that connects the descriptive premise to the conclusion.
     - For outcome (2): No action needed.
     - For outcome (3): Flag that the argument relies on a value framework that is not explicit and hand off to a human to decide how to proceed.

  Now, we run the procedure on the four passages:

  Passage A:
  "Seat belt use reduces fatal-injury risk by roughly 45%. Despite decades of public campaigns, compliance in our state remains 88%, well below the national leader. We recommend primary-enforcement seat belt legislation."

  Step 1: Conclusion: "We recommend primary-enforcement seat belt legislation." Premises: (1) Seat belt use reduces fatal-injury risk by 45%. (2) Compliance in our state is 88%, below the national leader.

  Step 2: No explicit normative premise.

  Step 3: No institutional fact (like a law or contract) that creates an obligation in this argument.

  Step 4: The premises use descriptive terms: "reduces fatal-injury risk", "compliance ... remains 88%". No thick terms or covertly normative concepts (unless we stretch "risk" to imply harm, but that's weak). So, no.

  Step 5: Open-question test: 
     - The argument moves from "seat belts reduce risk" to "we should have legislation to increase usage". 
     - Substitute: "Reducing fatal-injury risk is good, therefore we should legislate." 
     - Open question: "Is reducing fatal-injury risk by legislation good, all things considered?" (One might object on liberty grounds, cost, etc.) So, there is a gap. The bridge premise needed: "The state should act to reduce preventable fatal injuries when it can do so effectively and without excessive cost."

  Outcome: (1) unbridged inference. Flag for revision.

  Passage B:
  "Humans are an intensely social species with an evolved need for belonging; loneliness among adults under 30 has risen sharply over two decades. Civic associations — leagues, choirs, service clubs — are the natural vehicle for this need. The legislature should fund community-civic grants."

  Step 1: Conclusion: "The legislature should fund community-civic grants." Premises: (1) Humans are social with an evolved need for belonging. (2) Loneliness has risen. (3) Civic associations are the natural vehicle for this need.

  Step 2: No explicit normative premise.

  Step 3: No institutional facts.

  Step 4: Look for thick terms or covert normativity. The term "need" is used. A "need" is often normative (implying that if something is a need, it ought to be met). Also, "natural vehicle" might carry normative weight. So, the premises are not purely descriptive. They contain the concept of a "need", which implies that meeting the need is good. Therefore, we have a covert normative premise: "The state should help meet fundamental human needs."

  Outcome: (2) false alarm. No gap to flag.

  Passage C:
  "Under the state statute, a landlord must return a security deposit within 30 days of lease termination or provide an itemized statement of deductions; the deposit in question was neither returned nor accounted for after 90 days. The tenant is therefore entitled to the statutory penalty."

  Step 1: Conclusion: "The tenant is entitled to the statutory penalty." (Note: "entitled" is normative.) Premises: (1) The statute requires the landlord to return the deposit or account for it within 30 days. (2) The landlord did neither within 90 days.

  Step 2: No explicit normative premise beyond the statute.

  Step 3: This is about an institutional fact: the statute. The statute creates an obligation. The argument is that because the statute says X and the facts show a violation, then the penalty applies. This is a straightforward application of the law. The normativity is in the institution.

  Outcome: (2) false alarm. No gap.

  Passage D:
  "Paid family leave is associated with measurable improvements in infant health and maternal workforce retention. Several peer states have enacted it. We recommend a twelve-week paid family leave program."

  Step 1: Conclusion: "We recommend a twelve-week paid family leave program." Premises: (1) Paid family leave improves infant health and maternal workforce retention. (2) Several peer states have enacted it.

  Step 2: No explicit normative premise.

  Step 3: No institutional fact (unless we consider the example of peer states as creating an obligation, but that would be weak and not directly stated).

  Step 4: The premises use descriptive terms: "improvements in infant health", "maternal workforce retention". But note: "improvements" is a positive term and might be thought to carry normativity. However, it is still descriptive of a state of affairs. Without a thick term, we proceed.

  Step 5: Open-question test:
     - The argument moves from "paid family leave improves infant health and workforce retention" to "we should enact it". 
     - Substitute: "Improving infant health and maternal workforce retention is good, therefore we should enact paid family leave." 
     - Open question: "Is improving infant health and maternal workforce retention by this means good, all things considered?" (One might object on cost, impact on small businesses, fairness to non-parents, etc.) So, there is a gap. The bridge premise: "The state should act to improve infant health and maternal workforce retention when it can do so effectively and without excessive negative consequences."

  Outcome: (1) unbridged inference. Flag for revision.

  Even though the office endorsed paid family leave and the analyst supports it, the procedure flags it just like A. This is correct and a feature.

  Now, where the procedure fails:

  1. Materiality threshold: Some bridge premises are so widely accepted (e.g., "preventing death is good") that pointing out the gap might seem unnecessary. The procedure does not have a built-in materiality threshold because it's hard to define without being political. We can add a step after Step 5: 
     - Step 5b: If the gap is found, ask: "Is the bridge premise so uncontroversial in the legislative context that surfacing it would be pedantic?" This is a judgment call. The analyst must be cautious and seek supervisor input when in doubt. But note: even "preventing death" might be controversial if the means are extreme (e.g., banning cars). So, it's safer to surface.

  2. When the bridge premise itself contains thick terms: If we require the drafter to state the bridge premise and they write something like "we should reduce harm", then "harm" is a thick term. The procedure might then in a subsequent run flag that the bridge premise is not purely normative? But we don't run the procedure recursively. We only require that the bridge premise is stated. The point is to make the value explicit. The thick term might still be contested, but that's a debate about values, not a hidden gap.

  3. Risk of weaponization: If analysts use the procedure to flag only arguments they dislike, that would be a violation of nonpartisanship. To prevent this, the procedure must be applied uniformly to every brief. The checklist is a neutral tool. We must train analysts to apply it without bias.

  4. The procedure cannot resolve value disputes. When we get to the hard middle (outcome 3) or when the bridge premise is highly contested, the procedure only ensures that the value is made explicit. Then the legislators must debate the value. The procedure also cannot handle cases where the descriptive premises are already value-laden in a way that the procedure cannot disentangle without a deep philosophical analysis. In such cases, we hand it off.

  Finally, we present the checklist in plain language:

  **Checklist for Evidence Drag**

  1. **Identify the conclusion and premises.**
     - What is the main recommendation (look for words like "should", "recommend", "entitled")?
     - What reasons are given to support it? (List them.)

  2. **Check for an explicit "should" in the reasons.**
     - Is there a statement that clearly says what we ought to do or what is good? (e.g., "the state must protect citizens", "it is vital to reduce inequality")
     - If YES, then the argument has a normative premise and you can stop: no evidence drag. (Outcome: False alarm)

  3. **Check if the reasons are about a rule, law, or institution.**
     - Are the reasons based on an existing law, contract, or institutional rule? (e.g., "the law requires...", "under the contract...")
     - If the conclusion is about what must be done under that rule and the facts show a violation, then the normativity comes from the institution. Stop: no evidence drag. (Outcome: False alarm)

  4. **Look for value-loaded terms in the reasons.**
     - Do the reasons use words that mix description and evaluation? (e.g., "harm", "need", "right", "fair", "unsafe", "negligent", "crisis", "benefit", "improvement")
     - If YES, then the reasons are not purely descriptive and the argument likely has no gap. (Outcome: False alarm)

  5. **Apply the "So What?" test.**
     - For each reason, ask: "If we have this fact, does it obviously lead to the recommendation without needing any extra value judgment?"
     - Formulate the unstated bridge premise: "We should do [conclusion] because [reason] is [good/right/important]."
     - Then ask: "Is it an open question whether that reason is good/right/important in this context?" (i.e., could a reasonable person who accepts the fact still question whether we should do the recommendation because of other concerns?)
     - If it is an open question (YES), then there's a gap. (Outcome: Unbridged inference) -> Flag for revision to state the bridge premise.
     - If it is not an open question (i.e., the connection is self-evident and uncontroversial in this context) then you might not flag, but be cautious. (See note below.)

  6. **Hard cases: When the facts and values are tangled.**
     - Sometimes, the reasons are so full of value-loaded terms that you can't separate the facts and values without breaking the argument. If so, note that the argument relies on a value framework and hand off to a supervisor to decide how to proceed. (Outcome: Hard middle)

  **Note on Step 5:** If the gap is found but the bridge premise is uncontroversial (e.g., "preventing child deaths is good"), it may still be best to state it briefly to avoid any appearance of bias. However, if you and your supervisor agree that it is pedantic in the context, you may note it and move on. Use this sparingly.

  **Revision Instructions:**
  - If you found an unbridged inference (gap), require the drafter to add a sentence that states the bridge premise (the value judgment connecting the facts to the recommendation).
  - For hard middle cases, work with the drafter to either make the values explicit or reframe the argument to be more transparent.

  **Limitations:**
  - This procedure cannot resolve value disputes; it only makes them explicit.
  - It may be difficult to apply when the language is ambiguous or when the context is highly technical.
  - It relies on the analyst's judgment, especially in Step 5 and the materiality call. Training and consistency are vital.
  - It may not catch every case, especially when the value judgment is deeply hidden in the choice of metrics or data.

  Running the procedure on the four passages as above, we got:
  - A: Unbridged inference (flag)
  - B: False alarm (no flag, because of "need")
  - C: False alarm (no flag, because of institutional fact)
  - D: Unbridged inference (flag, even though we like it)

  Thus, the procedure is unbiased and catches D just like A.
answer: |-
  Below is a complete, step-by-step review procedure for identifying "evidence drag" in policy briefs. It's designed as an ordered checklist that analysts can apply in 20 minutes or less, using plain language. The philosophical foundations (is-ought problem, Moore's naturalistic fallacy, Searle's institutional facts, thick ethical terms, and covert normativity) are fully integrated but kept invisible in the checklist itself. I provide the rationale for each step in the "Theory Notes" section after the checklist.

  ---

  ### **Checklist for Identifying Evidence Drag**  
  *Apply these steps in order to any draft policy brief. If you hit a stopping point (🛑), flag the brief for revision. If you reach a handoff point (✋), escalate to a supervisor for values review.*

  #### **Step 1: Identify the Conclusion and Premises**  
  **Question:** What is the explicit recommendation (e.g., "should," "recommend," "must")? What statements are offered as supporting evidence?  
  **Criteria for Adequacy:**  
  - The conclusion must be prescriptive (e.g., "We recommend X").  
  - Premises must be descriptive (e.g., statistics, facts, trends).  
  - List them clearly: "Conclusion: [Y]. Premises: [1], [2], [3]."  
  **Stopping Point:** 🛑 If no prescriptive conclusion exists, stop—no evidence drag.  
  **Rationale in Plain Language:** We need to see where the argument starts (facts) and ends (action).  

  #### **Step 2: Check for Explicit Normative Premises**  
  **Question:** Is there a premise that directly states a value, duty, or goal (e.g., "safety is a priority," "fairness requires")?  
  **Criteria for Adequacy:**  
  - The premise must use normative language (e.g., "should," "ought," "good," "duty," "right").  
  - It must logically connect the evidence to the conclusion.  
  **Outcome:**  
  - If YES → Outcome (2) False Alarm. No gap. Stop.  
  - If NO → Proceed to Step 3.  
  **Rationale in Plain Language:** Sometimes values are stated outright—no need to overcomplicate.  

  #### **Step 3: Check for Institutional Rules (Searle Test)**  
  **Question:** Do the premises reference laws, contracts, policies, or formal obligations (e.g., "under statute X," "by contract")?  
  **Criteria for Adequacy:**  
  - The institution must imply a duty (e.g., "must return a deposit" → "ought to comply").  
  - The conclusion must align with enforcing that duty.  
  **Outcome:**  
  - If YES → Outcome (2) False Alarm. No gap. Stop.  
  - If NO → Proceed to Step 4.  
  **Rationale in Plain Language:** Rules like laws or contracts carry built-in "shoulds"—no extra bridge needed.  

  #### **Step 4: Check for Thick or Loaded Terms**  
  **Question:** Do premises use terms that blend facts and values (e.g., "harm," "crisis," "need," "negligent," "fair")?  
  **Criteria for Adequacy:**  
  - Thick terms must be both descriptive and evaluative (e.g., "loneliness" implies suffering; "risk" implies harm).  
  - Context matters: Does the term imply a judgment (e.g., "compliance remains low" vs. "compliance is dangerously low")?  
  **Outcome:**  
  - If YES → Outcome (2) False Alarm. No gap. Stop.  
  - If NO → Proceed to Step 5.  
  **Rationale in Plain Language:** Words like "harm" or "need" already pack a value punch—they don’t just describe.  

  #### **Step 5: Apply the Open-Question Test (Moore Test)**  
  **Question:** Substitute the key descriptive term into the conclusion. Does it feel incomplete or debatable?  
  **Criteria for Adequacy:**  
  - Example: If premises say "X reduces harm," and conclusion says "do X," substitute: "Should we do X because it reduces harm?"  
  - If the question feels **trivial or automatic** (e.g., "Should we punish lawbreakers?"), it’s likely fine → Proceed to Step 6.  
  - If the question feels **substantive or debatable** (e.g., "Should we reduce risks even if costs are high?"), it’s a gap.  
  **Stopping Point:** 🛑 If gap is found → Outcome (1) Unbridged Inference. Flag for revision.  
  **Rationale in Plain Language:** If the evidence doesn’t *obviously* justify the action, something’s missing.  

  #### **Step 6: Assess for the Hard Middle**  
  **Question:** Can you separate the facts from values without breaking the argument?  
  **Criteria for Adequacy:**  
  - If prying them apart makes the reasoning incoherent (e.g., "evolved need" in a human context), it’s entangled.  
  - If the gap is bridgeable with a simple value-statement (e.g., "saving lives is good"), it’s fixable.  
  **Handoff Point:** ✋ If entangled → Outcome (3) Hard Middle. Escalate to supervisor.  
  **Rationale in Plain Language:** Some arguments are like glue—pulling them apart ruins them. That’s a job for humans.  

  #### **Step 7: Materiality Threshold (Post-Check Filter)**  
  **Question:** Is the missing premise so obvious that stating it would sound tone-deaf (e.g., "preventing deaths is good")?  
  **Criteria for Adequacy:**  
  - Only apply AFTER Step 5/6.  
  - Use sparingly: Override ONLY if the premise is uncontroversial in **all** legislative contexts (nonpartisan, bipartisan, and partisan).  
  - When in doubt, default to flagging.  
  **Rationale in Plain Language:** Don’t waste time on "sun is hot" statements, but err on the side of transparency.  

  ---

  ### **Applying the Checklist to Example Passages**  
  I’ll run the procedure step-by-step on your four examples. For each, I show:  
  - **Work:** Answers to checklist questions.  
  - **Outcome:** (1) Unbridged, (2) False Alarm, or (3) Hard Middle.  
  - **Action:** Revision needed?  

  #### **Passage A**  
  > "Seat belt use reduces fatal-injury risk by roughly 45%. Despite decades of public campaigns, compliance in our state remains 88%, well below the national leader. We recommend primary-enforcement seat belt legislation."  

  - **Step 1:**  
    - Conclusion: "We recommend primary-enforcement seat belt legislation."  
    - Premises: (1) Seat belts reduce risk by 45%; (2) State compliance is 88% (below average).  
  - **Step 2:** No explicit normative premise (e.g., no "safety is a core duty"). → Proceed.  
  - **Step 3:** No institutional rules (e.g., no law cited as a basis). → Proceed.  
  - **Step 4:** No thick terms ("risk" is descriptive; "compliance" is neutral). → Proceed.  
  - **Step 5: Open-Question Test:**  
    - Substitute: "Should we enact legislation because it reduces risk and increases compliance?"  
    - Open Question: **YES** (e.g., "Should we prioritize risk reduction over personal liberty?"). → 🛑 **Outcome (1) Unbridged Inference**.  
  - **Revision Needed:** Add a bridge premise (e.g., "Reducing preventable traffic deaths justifies enforcement measures").  

  #### **Passage B**  
  > "Humans are an intensely social species with an evolved need for belonging; loneliness among adults under 30 has risen sharply over two decades. Civic associations — leagues, choirs, service clubs — are the natural vehicle for this need. The legislature should fund community-civic grants."  

  - **Step 1:**  
    - Conclusion: "Legislature should fund community-civic grants."  
    - Premises: (1) Humans have an evolved need for belonging; (2) Loneliness is rising; (3) Civic associations are the "natural vehicle."  
  - **Step 2:** No explicit normative premise. → Proceed.  
  - **Step 3:** No institutional rules. → Proceed.  
  - **Step 4: Thick Terms Check:**  
    - "Evolved need" and "natural vehicle" are thick terms (implies "needs should be met" and "natural is good"). → **Outcome (2) False Alarm**.  
  - **No Revision:** Normativity is embedded in premises.  

  #### **Passage C**  
  > "Under the state statute, a landlord must return a security deposit within 30 days of lease termination or provide an itemized statement of deductions; the deposit in question was neither returned nor accounted for after 90 days. The tenant is therefore entitled to the statutory penalty."  

  - **Step 1:**  
    - Conclusion: "Tenant is entitled to the penalty."  
    - Premises: (1) Statute requires return/accounting in 30 days; (2) Landlord failed after 90 days.  
  - **Step 2:** No explicit normative premise. → Proceed.  
  - **Step 3: Institutional Rules Check:**  
    - Statute creates an obligation ("must return"). Conclusion enforces it ("entitled"). → **Outcome (2) False Alarm**.  
  - **No Revision:** Gap is bridged by institutional fact.  

  #### **Passage D**  
  > "Paid family leave is associated with measurable improvements in infant health and maternal workforce retention. Several peer states have enacted it. We recommend a twelve-week paid family leave program."  

  - **Step 1:**  
    - Conclusion: "We recommend a twelve-week paid family leave program."  
    - Premises: (1) Leave improves health/retention; (2) Peer states have it.  
  - **Step 2:** No explicit normative premise. → Proceed.  
  - **Step 3:** No institutional rules (peer states aren’t binding). → Proceed.  
  - **Step 4:** No thick terms ("improvements" is descriptive; "peer states" is factual). → Proceed.  
  - **Step 5: Open-Question Test:**  
    - Substitute: "Should we enact leave because it improves health/retention and peers do it?"  
    - Open Question: **YES** (e.g., "Should we prioritize these benefits over employer costs?"). → 🛑 **Outcome (1) Unbridged Inference**.  
  - **Revision Needed:** Add bridge premise (e.g., "Improving infant health and maternal employment is a societal imperative").  

  **Note on Passage D:** The procedure flags this identically to Passage A, as required. This is correct: both omit a value premise, even though D aligns with your office’s/personal views. A usable procedure *must* treat preferred arguments neutrally.  

  ---

  ### **Where the Procedure Fails**  
  The checklist is a tool, not a panacea. Key limitations:  

  1. **Materiality Threshold Dilemma:**  
     - **Problem:** The procedure flags *all* gaps, even for widely shared values (e.g., "preventing child deaths is good"). Surfacing these can seem obtuse.  
     - **Mitigation:** Step 7 (post-check filter) allows analysts to skip pedantic flags, but it’s subjective. A principled threshold exists: Only skip if the premise is uncontested across *all* major legislative factions (e.g., no recorded opposition in hearings, laws, or public debate). But this risks politicization—e.g., "preventing deaths" may conflict with libertarian views.  
     - **Recommendation:** Default to flagging. If skipped, document the rationale publicly to avoid bias.  

  2. **Self-Recursive Thick Terms:**  
     - **Problem:** Sometimes the bridge premise itself contains thick terms (e.g., "reduce harm"). The procedure catches this in Step 4 during initial drafting but can’t resolve the deeper ambiguity.  
     - **Mitigation:** Hand off to a supervisor (Step 6) with a note: "Value question is the whole question." Example: In Passage B, "evolved need" is thick but irreducible—forcing clarification (e.g., "Meeting social needs is a state responsibility") just relocates the debate.  

  3. **Weaponization Risk:**  
     - **Problem:** Analysts could misuse the procedure to bury disfavored arguments under "process" while ignoring gaps in preferred ones (e.g., flagging A/D but skipping B/C).  
     - **Mitigation:** Mandate uniform application (all briefs, all steps). Use peer review for Steps 5–7. Audit flags quarterly for partisan patterns.  

  4. **Non-Applicable Cases:**  
     - When the **entire argument is values-based** (e.g., "Equality requires X, so we propose Y"), the procedure halts at Step 1. No evidence drag exists.  
     - When **evidence is absent**, the problem isn’t "drag"—it’s a different flaw.  
     - When **cultural thick terms** are invisible to the analyst (e.g., "family" in some contexts), the procedure may miss a gap. Training on local jargon helps.  

  **Final Handoff Rule:** If the procedure reaches Step 6 (Hard Middle) or if the gap involves contested thick terms, return the draft with this note:  
  > *"The argument hinges on a value judgment that cannot be disentangled from the evidence. Revision requires a policy choice, not just clarification. Escalate to supervisor for values review."*  

  ---

  ### **Theory Notes (For Your Reference Only)**  
  - **Is-Ought Problem (Step 5):** Guides the Open-Question Test. If descriptive premises (e.g., "seat belts reduce risk") don’t *entail* the conclusion (e.g., "enforce seat belts"), a normative premise is missing.  
  - **Moore’s Naturalistic Fallacy (Step 5):** The Open-Question Test detects when "good" is reduced to a natural property (e.g., "risk reduction = good"). If substitution leaves a substantive question, it’s a gap.  
  - **Searle (Step 3):** Institutional facts (e.g., laws, contracts) derive "oughts" from constitutive rules. No extra premise needed.  
  - **Thick Terms (Step 4):** Concepts like "need" or "harm" are both descriptive (observable) and normative (evaluative), avoiding a gap.  
  - **Covert Normativity (Step 4):** Even "descriptive" premises (e.g., "waste") can imply values if context-dependent (e.g., "waste" assumes inefficiency is bad).  
  - **Open-Question Limits:** Moore’s test can’t handle semantic contexts where values are baked in (e.g., "cruelty" is always bad). Step 6 handles these.  

  This procedure balances rigor and pragmatism. It flags gaps neutrally (as with D), avoids pedantry (as with B/C), and escalates irreducibly value-laden cases. With training, analysts can run it consistently without philosophy expertise.
