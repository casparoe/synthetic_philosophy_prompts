prompt: |-
  I run a weekly discussion group for early-career software engineers — twelve people, no formal logic background, but comfortable with expected-value reasoning and game trees. Next session I have twenty-five minutes on superrationality: Hofstadter's idea that in a symmetric, one-shot decision situation, the rational move is the one you would want everyone facing the same situation to make, since if you reason your way to a conclusion, others reasoning similarly will arrive there too — so you should treat your own choice as evidence about theirs, even though it causes nothing. I want a plan for the explanation, not the explanation itself.

  For the carrying example, here's my draft scenario, which you should replace if it's inadequate: our apartment building has a shared kitchen, and before a one-time landlord inspection every tenant independently decides, without communication and with no prospect of future interaction, whether to spend forty minutes deep-cleaning their share; tenants are strangers but all read the same cleaning guide and are, by reputation, conscientious types. If you replace it, say what the replacement must have (symmetry, one-shot, no communication, similarity of reasoners) and what it must lack (any actual causal channel between choices, any repeated play).

  What I need from the plan: the order the pieces must go in — especially whether to establish the evidential point, that my choice is information about similar reasoners' choices, before or after introducing the scenario; the misconceptions the group will predictably form, and the exact point in the sequence to head off each. I already anticipate three: that it's just Kant's categorical imperative relabeled; that it licenses thinking my decision somehow reaches out and causally determines other people's (I gather there was a well-known dispute over exactly this, but I won't name names — I'd rather you place the objection in the sequence than attribute it); and that it only applies to literally identical copies or clones, which would make it irrelevant to merely similar humans like our tenants — this last one seems to me the most dangerous, since once it takes hold the whole idea looks like a parlor trick. Please also tell me what to openly refuse to cover at this level — I assume the full apparatus of evidential versus causal decision theory and anything Newcomb-shaped. End with one question I could ask the group, answerable in a sentence, that would reveal whether they've internalized the evidential point rather than just walked away with a vague feeling that cooperation is nice.
reasoning: |-
  We are going to introduce the concept of superrationality to a group of early-career software engineers without a formal logic background. The key is to emphasize symmetry, one-shot, no communication, and similarity of reasoners. We must avoid any misconception that there is a causal link or that it only applies to clones.

  Plan:

  1. **Introduce the scenario** (with the replacement if needed, but let's first check the provided scenario and adjust if necessary).

     The provided scenario: 
     - Shared apartment building kitchen, one-time landlord inspection.
     - Each tenant independently decides without communication and no future interaction.
     - They spend 40 minutes deep-cleaning if they choose to clean.
     - Tenants are strangers but all read the same cleaning guide and are conscientious.

     This scenario has:
       - Symmetry: All tenants face the same situation and are similar in being conscientious and having the same guide.
       - One-shot: No repeated interaction.
       - No communication.
       - Similarity of reasoners: They are all conscientious and use the same guide, so we can assume they reason similarly.

     However, the scenario lacks a clear payoff structure. We need to define the payoffs explicitly.

     Let me define:
     - If a tenant cleans, they incur a cost of 40 minutes (negative utility).
     - The benefit: If at least one tenant cleans, the kitchen passes inspection and everyone gets a benefit (say, avoiding a fine or getting a discount on rent) worth 60 minutes of saved hassle (positive utility). But note: if we make the benefit dependent on the collective action, we need to be careful.

     Alternatively, we can have:
     - The landlord will inspect each tenant's share. However, if the entire kitchen is clean, then the landlord gives a bonus to every tenant (say, a rent discount). But if even one part is not cleaned, no bonus. This creates a situation where the bonus is a public good.

     Revised scenario for clarity:

     "The landlord will inspect the entire kitchen. If the entire kitchen is clean, every tenant gets a bonus worth 60 minutes of their time (e.g., a rent discount). However, if even one tenant's share is not cleaned, no one gets the bonus. Each tenant must decide whether to spend 40 minutes cleaning their own part. They cannot communicate and will not interact again."

     Payoff for a tenant:
     - If they clean and the entire kitchen is clean (meaning everyone else cleaned too), they get 60 - 40 = +20.
     - If they clean but the entire kitchen is not clean (meaning at least one other didn't clean), they get 0 (no bonus) -40 = -40.
     - If they don't clean and the entire kitchen is clean (meaning everyone else cleaned), they get 60 (free ride) - 0 = +60.
     - If they don't clean and the entire kitchen is not clean, they get 0.

     This is a standard public goods game (or a symmetric coordination game with a Pareto-efficient equilibrium and a risk-dominant one? Actually, it's a volunteer's dilemma if the bonus requires at least one cleaner? But note: we require all to clean for the bonus. So it's more like an "all-or-nothing" public good.

     Actually, it's a symmetric game with two pure-strategy Nash equilibria: one where all clean and one where no one cleans. But the all-clean equilibrium is better for everyone. However, without coordination, the risk of someone not cleaning might lead to no one cleaning.

     But note: superrationality is about reasoning that if I decide to clean, then since I am a typical reasoner and others are like me, they will also decide to clean. So I can expect that if I clean, everyone else will too, and I get +20. If I don't clean, then everyone else will also not clean (because they reason the same as me) and I get 0. So cleaning is better.

     However, the scenario must be symmetric and one-shot. The revised scenario above is symmetric and one-shot. But note: the bonus depends on the entire kitchen being clean, which requires everyone to clean.

     We'll use this.

     So we keep the scenario but clarify the payoff.

  2. **Order of explanation:**

     Step 1: **Set up the scenario and the payoffs.**
     - Describe the situation: inspection, bonus, cost, and the requirement that everyone must clean for the bonus.
     - Present the payoff matrix in a simple way (maybe a table for two players, but note symmetry and n=12? We can abstract to n players, but for simplicity, we can assume 2 tenants to start? But the group is 12. We can say: "imagine there are two tenants for simplicity" and then later generalize? Or we can do n=12 with the same logic.)

     Alternatively, we can use the n=12 but explain the reasoning for one tenant. The key is that the bonus is only achieved if all 12 clean.

     Step 2: **Ask: What would you do?**
     - Let the group think individually for a moment. We expect some to say they wouldn't clean because of the risk of wasting 40 minutes if someone else doesn't clean. Others might say they would clean because they hope others will too.

     Step 3: **Introduce the standard game-theoretic reasoning (Nash equilibrium) without superrationality.**
     - Explain that in standard game theory, without communication, each player must choose independently.
     - There are two Nash equilibria: (all clean, all don't clean). But the all-don't-clean is the risk-dominant one? Actually, in the all-or-nothing game with many players, the all-don't-clean might be the only equilibrium if we consider mixed strategies? But let's avoid complexity.
     - The point: without coordination, it's hard to achieve the good equilibrium.

     Step 4: **Introduce the superrationality idea.**
     - Hofstadter's insight: because the situation is symmetric and all reasoners are similar, whatever I conclude by reasoning, others will conclude the same. So if I decide to clean, then I can expect that others, reasoning similarly, will also decide to clean. Therefore, if I choose to clean, I can expect the bonus and get +20. If I choose not to clean, I can expect that others will also choose not to clean and I get 0. Therefore, cleaning is the better choice.

     Step 5: **Emphasize the evidential (not causal) link.**
     - Clarify: My decision to clean does not cause others to clean. But because we are all using the same reasoning, my decision is evidence that they will decide the same way. So I can use that evidence in my decision.

     Step 6: **Address misconceptions.**

     We have three anticipated misconceptions:

     a) **That it's just Kant's categorical imperative.**
        - When to address: After explaining superrationality and the evidential link.
        - How: Point out that Kant's imperative is a moral rule: act only according to that maxim which you can will to be a universal law. Superrationality is a decision rule for achieving better outcomes in symmetric games by recognizing that your reasoning is the same as others'. It is not about morality but about expected payoff.

     b) **That it licenses thinking my decision somehow reaches out and causally determines other people's.**
        - When to address: Immediately after explaining the evidential link (Step 5) and before moving on.
        - How: Explicitly state: "Note: my choice does not cause the others to make the same choice. There is no causal link. It's just that we are all similar reasoners and will independently come to the same conclusion. So my choice gives me information about what they are likely to do, but it doesn't affect them."

     c) **That it only applies to literally identical copies or clones.**
        - When to address: After the explanation of the evidential link and the causal misconception.
        - How: Emphasize that we don't need clones. We need that the reasoners are similar enough that they will use the same reasoning process and reach the same conclusion. In our scenario, they are all conscientious, read the same guide, and are facing the same situation. So we expect them to reason similarly. But they are not clones. They are independent but similar.

  3. **What to refuse to cover:**
     - Evidential vs. causal decision theory: We are not going into the formal distinctions or the debates between EDT and CDT.
     - Newcomb's paradox: We are avoiding any mention of Newcomb's problem or the associated controversies.

  4. **End with a diagnostic question:**

     We want to see if they internalized the evidential point.

     Question: "If a tenant in the cleaning scenario decides to clean, what does that tell them about the likelihood that the other tenants will clean? And why?"

     We expect the answer to be: It tells them that the other tenants are likely to clean because if they (the deciding tenant) have reasoned to clean, then the other similar reasoners will have reasoned the same way. But note: the tenant's own decision doesn't cause the others, but it is evidence that the others are also cleaning.

     Alternatively, a simpler question: "Why, in the superrationality framework, does a tenant expect others to clean if they decide to clean?"

     Answer: Because they recognize that they are in a symmetric situation with similar reasoners, so whatever they decide, the others will decide the same. Therefore, if they clean, they expect others to clean too.

     But we must capture the evidential nature. So the answer should avoid causal language.

     Let me rephrase the question to force the evidential point:

     "Imagine that you are a tenant and you have just decided to clean. Does your decision cause the other tenants to clean? Why then do you expect them to clean?"

     Expected answer: No, my decision does not cause them to clean. But because we are all similar reasoners in the same situation, if I decide to clean, that means that the reasoning process that led me to clean will also lead them to clean. So I expect them to clean because they are going through the same thought process.

     This answer shows they have internalized the evidential reasoning.

  Therefore, the plan in sequence:

  1. Introduce the scenario (with the payoff structure) for 12 tenants. (3 minutes)
  2. Ask the group what they would do and why. (2 minutes)
  3. Explain the standard game theory outcome (without superrationality) and the difficulty of coordination. (3 minutes)
  4. Introduce superrationality: the idea that in a symmetric situation with similar reasoners, you should choose the action that you would want everyone to choose, because if you choose it, you can expect others to choose the same. (5 minutes)
  5. Emphasize the evidential (non-causal) link: your choice is evidence about others, not a cause. (2 minutes)
  6. Address misconceptions in order:
     a) Not Kant: it's about expected payoff, not morality. (1 minute)
     b) Not causal: reiterate the evidential point. (1 minute)
     c) Not clones: similar reasoners, not identical, are enough. (2 minutes)
  7. Refuse to cover: EDT vs. CDT, Newcomb's paradox. (1 minute) [But we can just avoid bringing them up unless asked, then say it's beyond the scope.]
  8. End with the diagnostic question: "Imagine that you are a tenant and you have just decided to clean. Does your decision cause the other tenants to clean? Why then do you expect them to clean?" (Allow 2 minutes for answers, then wrap up.)

  Total: 3+2+3+5+2+1+1+2+1+2 = 22 minutes, leaving 3 minutes for buffer.

  Note: The timing is tight. We can adjust by shortening step 2 and 3 if needed.

  Replacement scenario if needed? The given scenario, with the payoff clarified, is adequate. So we'll use it.

  Final plan:

  1. Scenario and payoffs.
  2. Group poll and initial reasoning.
  3. Standard game theory (without superrationality) and the problem.
  4. Superrationality explanation.
  5. Evidential point.
  6. Misconceptions:
     a) Kant
     b) Causal
     c) Clones
  7. Boundaries (what we won't cover).
  8. Diagnostic question.

  Diagnostic question: 
     "Imagine that you are a tenant and you have just decided to clean. Does your decision cause the other tenants to clean? Why then do you expect them to clean?"

  We are looking for an answer that:
     - Denies causal influence.
     - Attributes the expectation to the similarity of reasoning in a symmetric situation.
answer: |-
  ### Plan for Explaining Superrationality (25 Minutes)

  #### **Order of Explanation**  
  1. **Introduce the Core Idea First (3 mins)**  
     - Start with Hofstadter's quote: "The rational move is the one you’d want everyone facing the same symmetric situation to make."  
     - Emphasize: "In a symmetric one-shot scenario, your reasoning isn’t unique—others like you will reason the same way. So your choice isn’t just an action; it’s evidence for what others will likely do."  
     - *Why early?* Anchors the abstract concept before diving into specifics, avoiding premature fixation on the scenario.  

  2. **Present the Scenario (Revised) (4 mins)**  
     - **Replacement Scenario** (retains symmetry, one-shot, no communication, similar reasoners; lacks clones/causality):  
       > "Twelve strangers independently decide whether to donate anonymously to a public park bench. If funded, the bench benefits all (e.g., community recognition worth $50). Each donation costs $20. Funding requires ≥10 donors. All donors are selected from a mailing list for ‘civic-minded engineers’—they share values and problem-solving styles but don’t know each other. No repeats, no talk."  
     - **Why this works**:  
       - Symmetry: Identical roles/costs/benefits.  
       - One-shot/no communication: No future repercussions or coordination.  
       - Similar reasoners: Shared identity ("civic-minded engineers") implies aligned reasoning, not clones.  
       - No causality: Donations are anonymous and simultaneous; your choice doesn’t physically affect others.  
     - *Key detail*: Threshold (≥10) ensures individual impact isn’t negligible (unlike prisoner’s dilemma), forcing engagement with collective reasoning.  

  3. **Break Down Standard vs. Superrational Reasoning (5 mins)**  
     - **Step 1: Standard rationality** ("What if I ignore others’ similarity?"):  
       - "If I donate, I risk $20 for no gain if <10 donate. If I don’t, I might free-ride. Best to not donate."  
       - Result: Likely underfunding (Nash equilibrium). Highlight the tragedy.  
     - **Step 2: Superrationality**:  
       - "But we’re all civic-minded engineers! If I reason ‘donating is best,’ I expect others to reason identically. My choice to donate is evidence that ≥10 will donate. So donating nets me $30 ($50–$20). Not donating? I signal others won’t, so no bench and $0."  
       - **Stress**: "My donation doesn’t cause others to donate. It’s evidence we’re all concluding the same thing."  

  4. **Clarify the Evidential Mechanism (3 mins)**  
     - Use an analogy: "Like realizing all students in a class used the same textbook—they’ll likely give similar exam answers. Your answer doesn’t control theirs; it reflects shared methods."  
     - **Key phrase**: "Your reasoning is a diagnostic tool for others’ choices."  

  #### **Misconceptions and Mitigation Sequence**  
  Address these **immediately after introducing superrational reasoning** (Step 3 above), before discussing implications. Use bold, simple statements:  

  | Misconception | When to Address | Mitigation Script |  
  |---------------|-----------------|------------------|  
  | **"It’s just Kant’s imperative"** | After explaining superrational reasoning (Step 3) | "Kant is about morality: ‘Act as if your choice becomes universal law.’ Superrationality is instrumental: ‘Act because your choice predicts others’ identical choices for mutual gain.’ It’s selfish, not selfless." |  
  | **"My choice causes others’ choices"** | Immediately after the evidential point (Step 4) | "NO causality. Your donation doesn’t magically force others to donate. It’s purely informational: if you conclude donating is smart, similar thinkers conclude the same independently." |  
  | **"Only clones apply"** | After causality correction (critical!) | "Clones aren’t needed! We just need reasoners similar enough to reach the same conclusion when given identical data. Here, they’re all ‘civic-minded engineers’—same values, same logic. Not clones, just alike in relevant ways." |  

  #### **What to Refuse to Cover**  
  Explicitly state upfront:  
  - "We won’t dive into causal vs. evidential decision theory—it’s a rabbit hole."  
  - "No Newcomb’s Paradox or metaphysics—this is about practical symmetry."  
  - "No math beyond basic payoffs. We’re focusing on intuition."  

  #### **Diagnostic Question**  
  **End with this (2 mins)**:  
  > "Imagine you’re a civic-minded engineer who just decided to donate. Why might you expect at least 10 others to donate? And does your donation cause theirs?"  

  - **Target Answer** (reveals internalization):  
    "I expect it because if I reasoned donation was optimal, others like me did too. But my donation doesn’t cause theirs—it’s evidence we all thought alike."  
  - **Why it works**: Forces distinction between evidence/causality and similarity/clones. A vague "cooperation is good" answer fails.  

  #### **Timing Buffer**  
  - Reserve 2 mins for Q&A after the diagnostic question. If misconceptions resurface, refer to mitigation scripts.  
  - Total: Core idea (3) + Scenario (4) + Reasoning (5) + Evidence (3) + Misconceptions (3) + Diagnostic (2) + Buffer (2) = 22 mins.  

  This sequence grounds abstraction early, confronts misconceptions preemptively, and verifies comprehension. Use the bench scenario—it highlights threshold dependence and shared identity without cloning.
