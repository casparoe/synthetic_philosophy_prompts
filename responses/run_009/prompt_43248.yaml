prompt: |-
  I am the registrar of a mid-sized university museum, and one of my recurring jobs is deciding what counts as a single catalog object. Several times a month, something comes out of a drawer, a loan, or an excavation tray that could plausibly be accessioned as one thing or as many: a disarticulated skeleton in a shoebox, a hoard of coins found corroded together and later pried apart, a necklace whose ancient beads were restrung on modern wire by a conservator in the 1980s. Our numbering decisions have consequences — they fix insurance schedules, loan paperwork, digitization scope, and how objects are counted in annual reports — and at the moment different staff members decide differently, which auditors have begun to notice.

  Please write a decision procedure my team can actually run, grounded in what metaphysicians call the special composition question: under what conditions do several objects together compose a further object? Take the main positions seriously — van Inwagen's answer that composition occurs only for living organisms, the universalist view that any objects whatever compose something, the nihilist view that composition never occurs, and the family of common-sense restricted answers (composition when the parts are in contact, or fastened, or share a fate, or form a functioning whole). Then do the translation work: say which of these positions can honestly be built into a procedure at all, which distinctions must survive the simplification into something a student assistant can apply in ten minutes, and which have to be dropped. Be candid about the fact that van Inwagen's own answer, applied literally, would tell us no artifact ever composes a further artifact — no suit of armor, no teapot with a lid, nothing — and explain what the procedure should do about that, whether it adopts a different criterion, a hybrid, or an openly pragmatic stand-in for the metaphysics.

  The procedure should give the questions to ask in order, what counts as a sufficient answer to each, where it terminates in one catalog number versus several, and where it stops and hands the decision to the curator because what remains is a question of scholarly values — research use, display logic, conservation practice — rather than of composition. It must also cope with two real constraints: our legacy catalog is a century deep, so the procedure has to say what to do when it yields an answer that conflicts with how something has been numbered since 1912; and some lender agreements count objects in their own way, which the procedure cannot override.

  Then run it on three cases. First, the shoebox skeleton: roughly five hundred loose bones and fragments with no articulation and no certainty they came from one individual. Second, the restrung necklace: forty ancient beads on modern wire, strung as a single object by a conservator forty years ago and now our most photographed item. Third, a warrior's panoply — helmet, greaves, and shield found together in one deposit, never fastened to one another, which our fundraising materials have always described as a single ensemble. At least one of these should come out in a way I will not like, and I would like you to say so plainly rather than tune the procedure to spare my feelings.

  Finally, say what the procedure cannot do: the cases where it will misfire or where the metaphysics is, on honest inspection, merely decorating a decision actually made on other grounds. I would rather know that than have a procedure that pretends to more rigor than cataloging can bear.
reasoning: |-
  Okay, the user is a registrar at a university museum facing a practical problem: how to consistently decide what counts as a single catalog object. They need a decision procedure grounded in metaphysical theories of composition but translated into something usable by staff. 

  Hmm, the core tension here is between philosophical rigor and operational practicality. The user explicitly references van Inwagen's radical view (only organisms compose objects) but also mentions real-world consequences like insurance and loans. They're clearly frustrated by inconsistent decisions and auditor scrutiny. 

  First, I should acknowledge the depth of their problem: this isn't just about taxonomy but institutional legacy (100-year-old catalog!), legal/financial implications, and even PR (that popular beaded necklace). The mention of auditors suggests this has escalated beyond academic concern.

  The metaphysics angle is fascinating but treacherous. If I take van Inwagen literally, their entire artifact collection would need renumbering - impossible given the "1912" constraint. Universalism would create absurdities (every pebble pile becomes an "object"). Nihilism is worse. So we must hybridize, prioritizing operational viability without abandoning philosophy entirely.

  Key design challenges: 
  - Must give clear yes/no checkpoints a student can apply
  - Must preserve curator authority for scholarly judgments
  - Must handle legacy conflicts (they'll hate this, but we can't rewrite history)
  - Must respect lender terms (non-negotiable)

  For the procedure itself: I'll structure it as a decision tree. Start with strictest criteria (organic unity) then relax toward functional/pragmatic ones. Crucially: 
  - Terminal nodes force "one number" or "many numbers"
  - Escape valves for curators when metaphysics hits institutional reality
  - Explicit "conflict rules" for legacy/lender overrides

  Now testing against their cases: 
  1. The shoebox bones: By van Inwagen, it's one skeleton - but without articulation certainty, I'll have to rule "multiple fragments." They'll dislike this since it inflates counts. 
  2. The restrung necklace: Philosophically dubious (modern wire!), but its display identity forces "one object." Here pragmatism overrides metaphysics. 
  3. Warrior panoply: No composition under any strict view, so must default to curation intent. Fundraising materials already treat it as one - so we legitimize that.

  Biggest sacrifice: Van Inwagen's organism principle gets demoted to "guidance" except for intact specimens. We're essentially adopting a common-sense restricted view while admitting it's philosophically messy. The procedure can't resolve deep metaphysical disputes - it can only make them operationally tractable.

  Finally, I'll warn about "metaphysics as decoration" - in cases like the necklace, we're really prioritizing institutional identity over ontology. Better to confess that than pretend philosophical purity.
answer: |-
  Here is a practical decision procedure for your team, grounded in metaphysical principles but streamlined for museum operations. It prioritizes defensible consistency over philosophical purity, acknowledges real-world constraints, and flags where scholarly judgment must prevail.

  ---

  ### **Catalog Composition Decision Procedure**
  *(To be applied by staff in 10 minutes or less)*

  **Step 1: Check Constraints**  
  ◻️ **Legacy Precedent:** Is this item *already accessioned* in the catalog?  
  → **Yes:** Maintain existing numbering unless current process contradicts lender terms (skip to Step 5). Do not renumber legacy items.  
  → **No:** Proceed to Step 2.  
  ◻️ **Lender Agreement:** Does the lender’s contract specify how to count this item?  
  → **Yes:** Follow lender’s count. Overrides all other steps. Document the discrepancy internally.  

  **Step 2: Test for Biological Unity**  
  *(Van Inwagen Triage: Composition occurs only in living organisms)*  
  ◻️ **Is this a *coherent, articulated biological organism*?**  
  → **Yes:** Assign **one number** (e.g., intact skeleton, taxidermy mount).  
  → **No:** Proceed to Step 3.  
  *Rationale:* Strict van Inwagen would deny artifacts as "objects," but we salvage his core for biologicals.  

  **Step 3: Test for Cohesion**  
  *(Common-Sense Restricted View: Contact, fastening, or shared fate)*  
  ◻️ **Are the parts physically bonded, fastened, or fused *in a stable state*?**  
  - *Examples:* Coins corroded together; beads cemented in a mosaic; a welded sculpture.  
  → **Yes:** Assign **one number**.  
  → **No:** Proceed to Step 4.  

  **Step 4: Test for Functional Unity**  
  *(Common-Sense Restricted View: Purposeful whole)*  
  ◻️ **Were the parts designed or historically used to function *together as a single unit*?**  
  - *Critical sub-question:* **Does separation destroy the intended purpose/meaning?**  
  → **Yes:** Assign **one number** (e.g., teapot and lid, watch and strap).  
  → **No / Unsure:** Proceed to Step 5.  

  **Step 5: Curatorial Judgment**  
  *(Scholarly values override metaphysics)*  
  ◻️ **Refer to curator if:**  
  - Functional unity is ambiguous (Step 4).  
  - Items are a *deliberate ensemble* (e.g., burial set, artist’s installation).  
  - Conservation/reconstruction history complicates integrity (e.g., restrung beads).  
  ◻️ **Curator considers:**  
  1. **Research Value:** Is it studied as one entity or many?  
  2. **Display Logic:** Will it be exhibited together?  
  3. **Preservation Risk:** Does handling as one object cause damage?  
  4. **Institutional Identity:** How is it described in publications/PR?  
  → **Curator’s verdict is final.** Document rationale.  

  **Step 6: Default to Nihilism**  
  *(When all else fails)*  
  ◻️ **If no biological unity, cohesion, function, or curatorial justification for unity:**  
  → Assign **individual numbers** to components.  
  *Rationale:* Without positive criteria for composition, nihilism (no composition) is the safest default.  

  ---

  ### **Handling Conflicts & Constraints**
  - **Legacy Conflicts:** If procedure contradicts pre-1912 numbering, **keep legacy number**. Add an internal note: "Composition assessment: [Procedure Result]."  
  - **Lender Overrides:** Always honor lender counts. Flag in records: "Count per lender agreement."  

  ---

  ### **Case Applications**

  **1. Shoebox Skeleton**  
  - Step 1: New item → proceed.  
  - Step 2: *Not articulated* → proceed.  
  - Step 3: *Not fastened/fused* → proceed.  
  - Step 4: *No functional unity* (disarticulated fragments) → proceed.  
  - Step 5: *Referred to curator*. Curator notes: "Uncertain if single individual; research value higher as fragments for osteology."  
  - **Verdict: Assign 500 numbers.**  
  *Why you’ll dislike this:* Inflates object count, complicates loans. But biologically/metaphysically defensible.  

  **2. Restrung Necklace**  
  - Step 1: Likely accessioned as one → but assume new for test.  
  - Step 2: Not biological → proceed.  
  - Step 3: *Beads not fused* (modern wire ≠ stable bond) → proceed.  
  - Step 4: *Functional unity ambiguous* (beads ancient, assembly modern) → Step 5.  
  - Step 5: Curator considers:  
    - Top photographed item → displayed as one.  
    - Research: Studied as a "necklace," not individual beads.  
    - Conservation: Restrung to *create* unity.  
  - **Verdict: One number.**  
  *Metaphysical Note:* Van Inwagen would reject this (artifact), but institutional identity prevails.  

  **3. Warrior’s Panoply**  
  - Step 1: New item → proceed.  
  - Step 2: Not biological → proceed.  
  - Step 3: *Not fastened* (helmet, greaves, shield separate) → proceed.  
  - Step 4: *Functional unity?* Designed as a set, but components usable alone. *Ambiguous* → Step 5.  
  - Step 5: Curator considers:  
    - Fundraising/public identity: Marketed as "one panoply."  
    - Display: Always shown together.  
    - Research: Studied as an ensemble.  
  - **Verdict: One number.**  
  *Philosophical Concession:* A "pragmatic composition" for institutional use.  

  ---

  ### **What the Procedure Cannot Do**
  1. **Resolve metaphysical debates:** It *uses* philosophy to scaffold decisions but openly prioritizes operational needs. Van Inwagen’s teapot is one number (Step 4/5), not zero.  
  2. **Override history:** Legacy numbers stay, even if "wrong" by current logic.  
  3. **Handle vague "ensembles":** A group of pottery shards from one pit may be one number (curator’s call) or 100+ (Step 6). Procedure exposes subjectivity.  
  4. **Fix conservation ethics:** The restrung necklace’s modern wire is a conservation issue, not solved by numbering.  
  5. **Eliminate judgment:** Steps 4–5 accept that "composition" in museums is often about *use*, not ontology.  

  **Final Caveat:** This procedure makes your implicit trade-offs explicit. When you assign "one number" to the panoply or necklace, you’re not claiming metaphysical truth—you’re prioritizing institutional narrative and utility. That’s not a failure; it’s responsible curation. Metaphysics here is a tool, not a master.  

  ---  
  Would you like a one-page flowchart version for your team?
