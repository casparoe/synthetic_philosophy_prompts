prompt: |-
  I teach a critical reasoning course at a small liberal arts college -- it's nominally for sophomores, no probability background beyond maybe stats 101, and honestly it's half a philosophy of practical reasoning course. Next week I've got a single 75-minute session on the two-envelope paradox and I want to actually plan it rather than just perform the trick. So don't write me the explanation, write me the plan: the order the pieces have to go in and what depends on what, the setup that should carry the whole session, the misconceptions the students will predictably form and exactly where in the sequence to head each one off, what I should openly decline to cover at this level, and one question I can ask at the end to check that it landed.

  For context, my plan was to open with the setup -- you're handed one of two envelopes, one contains twice the money in the other, you don't know which -- and let them stew on whether to switch before I show them the argument that the expected gain from switching is (1/2)(x/2) + (1/2)(2x) = 5x/4, so you should switch, and then the same argument applies to switching back. But I'm worried about the sequencing: the moment they see the fallacious step, half the class will conclude the whole thing is just a typo in algebra, nothing philosophical, and the other half will conclude expected value is broken and start telling me about Vegas. So what has to be in place before I even show them the switching argument, so the eventual diagnosis lands as revealing rather than deflating? Relatedly, I do want to get to the genuinely disturbing part and not just patch the fallacy: the variant where the amounts are generated by some unbounded random process where switching really does raise expected value (the "always positive probability of a bigger amount" kind of setup), and the infinite-expectation version where you can get E(B) > E(A) and E(A) > E(B) depending on how you slice it. Is that reachable for this audience in one session, or should I be honest and cut it? If reachable, does it go before or after the diagnosis of the finite case -- does the deep version set up the puzzle, or does it reward students who've first seen the shallow one repaired?

  On misconceptions: I can already predict a couple, like "the two envelopes just can't have equal expected values, that's impossible" and conflating conditioning on the actual amount in your envelope with treating that amount as a variable when it isn't one. What else should I expect, and where in the arc does each get absorbed? And what do I refuse to cover at this level -- the measure theory, whatever's going on with divergent expectations -- and how do I say so without making it feel like the course is hiding the good stuff? Finally, the distinction I most want them walking out with is between "the argument is fallacious" and "the conclusion is false," since those come apart in the exotic versions. What single question at the end would actually reveal whether they've got that, rather than whether they can just recite where the 5x/4 computation went wrong?
reasoning: |-
  Okay, let me approach this step-by-step. The professor needs a lesson plan for teaching the two-envelope paradox to sophomore philosophy students with limited math background. The core challenge is structuring the session so students grasp both the fallacy in the standard argument and the deeper philosophical implications about reasoning under uncertainty.

  First, I need to consider the audience. These are liberal arts students taking a critical reasoning course, likely more comfortable with conceptual discussions than heavy math. Their exposure to probability is probably limited to Stats 101. The professor wants to avoid two pitfalls: students dismissing the paradox as mere algebraic error, or losing faith in expected value altogether. 

  The key insight here is sequencing. We can't start with the fallacious switching argument because students will either oversimplify or overreact. Instead, we should build conceptual foundations first. Let me outline the phases:

  Phase 1 should establish the envelope setup concretely. Use actual numbers ($100/$200) to make it tangible. Have students discuss switching strategies in small groups. This surfaces their intuitions before contaminating them with the paradox. Common misconceptions will emerge here - like thinking switching is always beneficial or irrelevant. 

  Phase 2 introduces the expected value argument formally. But crucially, we need to present it as a "mystery" rather than proof. Ask students to identify where it goes wrong, but don't let them settle yet. The trap is that some will spot the variable misuse quickly and think that's all there is.

  Phase 3 is the diagnosis. We must show how 'x' ambiguously represents both fixed and variable amounts. Use color-coding or boxes to visualize the error. Emphasize that conditioning matters - when you see $100, the other envelope contains $50 or $200 with equal probability only if we assume symmetric priors.

  Phase 4 tackles the disturbing variant. This is where we show that with unbounded distributions, switching really can increase expected value. But we must carefully distinguish this from the original fallacy. The takeaway should be that the problem lies in defining rational choice under infinite expectations.

  For misconceptions, I anticipate:
  - "Expected values must be equal by symmetry" (address with concrete numbers)
  - Confusing actual sums with variables (use color-coding)
  - Thinking the paradox disproves probability (emphasize it's about misapplication)

  We should avoid measure theory discussions but acknowledge there's more depth. The closing question should test if they distinguish between the argument being wrong versus the conclusion being wrong. Something like: "If someone shows you a proof that switching helps in an unbounded distribution, is that proof necessarily fallacious?"

  The professor's goal to separate "fallacious argument" from "false conclusion" is excellent. We'll reinforce this by showing cases where switching does help legitimately after fixing the reasoning.
answer: |-
  Here’s a battle-tested lesson plan for your 75-minute session, structured to build conceptual clarity, preempt misconceptions, and land the key philosophical distinction. Prioritize depth over breadth—focus on diagnosing the fallacy first, then hint at the "disturbing" variants without diving deep.

  ---

  ### **Phase 1: Setup & Intuition (15 min)**
  1. **Concrete Setup (5 min)**  
     - Present the paradox with **specific amounts** (e.g., Envelope A: $100, Envelope B: $50 or $200).  
     - Ask: *"You pick Envelope A. Would you switch? Why?"*  
     - Poll the class. Expect answers like *"No, it’s 50/50"* or *"Switch if I think I have the smaller one."* Highlight symmetry: no rational reason to switch.  

  2. **Introduce the Switching Argument (10 min)**  
     - **Show the fallacious expected value calculation:**  
       *E(switch) = (1/2)(x/2) + (1/2)(2x) = 1.25x*  
     - Clarify: *x* is the amount in your *current* envelope.  
     - **Immediate reaction prompt:** *"This says switching always increases expected value by 25%. But symmetry says switching shouldn’t matter. What’s wrong here?"*  
     - **Preempt early misconceptions:**  
       - If students say *"x isn’t fixed!"*: Acknowledge but table it.  
       - If they say *"EV is broken!"*: Respond: *"Hold that thought—we’ll test if the math itself is lying."*  

  ---

  ### **Phase 2: Diagnosing the Fallacy (25 min)**  
  3. **Isolate the Error (15 min)**  
     - **Reframe with conditioning:** Pick a concrete amount (e.g., *"Suppose you see $100 in your envelope"*).  
       - Ask: *"What’s in the other envelope?"* ($50 or $200).  
       - Stress: **Probability ≠ Value**. The *likelihood* of having the smaller/larger envelope depends on the prior distribution.  
     - **Visualize with a table:**  
       | Your envelope | Other envelope | Probability |  
       |--------------|---------------|-------------|  
       | $100 (smaller) | $200          | ?           |  
       | $100 (larger)  | $50           | ?           |  
       - Reveal the **hidden assumption**: The calculation assumes P(smaller) = P(larger) = 1/2 **given your observed amount**. But this is only true if all amounts are equally likely—which is impossible (infinite money!).  

  4. **Fix the Calculation (10 min)**  
     - **Example with finite prior**:  
       - Suppose possible pairs: ($50,$100) or ($100,$200), each with P=1/2.  
       - If you observe $100:  
         - P(you have smaller) = P(pair is $100/$200) = 1/2?  
         - P(you have larger) = P(pair is $50/$100) = 1/2?  
       - **Ahá!** When you see $100, it’s twice as likely you have the larger envelope (because $100 appears in two pairs).  
       - Correct EV(switch): (2/3)($50) + (1/3)($200) = $100 → **no gain**.  

  ---

  ### **Phase 3: The "Disturbing" Variants & Philosophy (20 min)**  
  5. **Unbounded Distributions (15 min)**  
     - **Setup**: *"Suppose amounts are generated from a distribution where larger sums are possible forever (e.g., P($2ⁿ) = (1/2)ⁿ)."*  
     - **Key insight**: Switching *can* increase EV if the distribution is skewed!  
       - Example: If you see $1, switch (likely small). If you see $1M, don’t switch (likely large).  
     - **Emphasize**: The fallacy wasn’t "EV is wrong"—it was **misapplying EV by ignoring the prior**. Here, the prior breaks symmetry.  

  6. **Infinite Expectations (5 min, conceptual only)**  
     - Mention: *"In some distributions, expected value is infinite. Then, absurdly, switching and not switching both seem beneficial! This exposes limits of EV in extreme cases—but that’s grad-level."*  
     - **Reframe as a win**: *"This isn’t a ‘paradox’ anymore—it’s a feature of how probability handles infinity. But our job is to fix reasoning in everyday cases."*  

  ---

  ### **Phase 4: Consolidation & Misconception Patrol (15 min)**  
  7. **Predictable Misconceptions & Preemption**  
     - **"The envelopes can’t have equal EV!"**  
       → *Already resolved*: In symmetric cases, they do. Skewed priors break symmetry.  
     - **"Probability is subjective/useless!"**  
       → Stress: The math works when priors are explicit. The paradox reveals sloppy assumptions.  
     - **"x is just a variable—algebra error!"**  
       → Replay Phase 2: The error is *conceptual* (treating a conditioned value as unconditional).  

  8. **What We’re Skipping**  
     - *"We’re avoiding measure theory and divergent expectations today—not because they’re unimportant, but because they require advanced probability. If you’re curious, I’ll send papers!"*  

  9. **The Closing Question**  
     - **To test the core distinction**:  
       *"In the original symmetric setup, why is the conclusion 'you should switch' false, even though the expected value calculation looks mathematically valid?"*  
       - **Target answer**: The calculation incorrectly assumes probabilities given the observed amount are 50/50. Without knowing the prior, we can’t justify that.  
       - **Why it works**: It forces them to separate the fallacious reasoning (bad conditioning) from the conclusion’s truth value.  

  ---

  ### **Why This Sequence Works**  
  - **Diagnosis before disturbance**: Fixing the fallacy first (Phase 2) builds confidence in probability. *Then* revealing skewed priors (Phase 3) shows the real-world nuance, avoiding "EV is broken" panic.  
  - **Concrete → Abstract**: Starting with specific amounts grounds the math. The $100 example makes the probability error visceral.  
  - **Philosophy payoff**: The "disturbing" variants reward critical thinking—students see how sound reasoning navigates edge cases.  
  - **Escape hatches**: Acknowledge advanced topics without drowning in them. The closing question ensures they walk out distinguishing **reasoning flaws** from **conclusion falsity**.  

  **Final Tip**: Use the whiteboard to track "What we know" vs. "What we assume" during Phase 2. This models the meta-reasoning you want them to learn.
