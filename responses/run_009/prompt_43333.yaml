          u(2B) = w(0.10) * 2

     We want u(2B) > u(2A): 2*w(0.10) > w(0.11)

     With w(0.10)=0.10 and w(0.11)=0.11, we have 0.20 > 0.11 -> true.

     With the overwriting for small probabilities, we might have:

          w(0.10) = 0.10
          w(0.11) = 0.11 (linear) or maybe it's overweighted? Typically, very small probabilities are overweighted and medium ones underweighted. 0.11 might be underweighted. Let's assume:

          w(p) = p for p>=0.15, and for p<0.15, we use a function that overweights very small probabilities and underweights those in the middle. 

     But let's not get bogged down. Assume we have a weighting function such that:

          w(0.01) = 0.11, w(0.10)=0.10, w(0.11)=0.11.

     Then:

          u(1A) = 1
          u(1B) = (1 - 0.10 - 0.11)*1 + 0.10*2 + 0.11*0 = 0.79 + 0.20 = 0.99   [so prefers 1A]

          u(2A) = w(0.11)*1 = 0.11
          u(2B) = w(0.10)*2 = 0.20   [prefers 2B]

     So it works.

     Now, in the scenario, the agent has initial wealth of 0 and the outcomes are in millions.

     Without insurance:

          The lottery she effectively holds is:

              89%: $1 million -> utility: 1
              10%: $5 million - $1 -> utility: we can treat $1 as negligible, so approximately 2, but if we want to account for the $1 loss, then it's 5,000,000 - 1 = 4,999,999 -> utility = ? In our utility function, we haven't defined it for amounts around $5 million. 

     This is messy.

     Instead, let's scale down the example to make the fee significant.

     Consider:

          outcomes: 
              $0 -> utility 0
              $10 -> utility 10 (or use a utility function)

          Lotteries:

