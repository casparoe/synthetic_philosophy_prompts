          u(1A) = 1
          u(1B) = 0.89*1 + 0.10*2 + 0.01*0 = 1.09   -> so she should prefer 1B, but in the paradox she doesn't.

     So we must have a utility function that is concave and then drops. Kahneman and Tversky proposed a weighting of probabilities. But for simplicity in money, we can use:

          u(x) = sqrt(x)   [for positive x]

     Then:

          u(1A) = sqrt(1,000,000) = 1000

          u(1B) = 0.89 * sqrt(1,000,000) + 0.10 * sqrt(5,000,000) + 0.01 * sqrt(0)
                 = 0.89*1000 + 0.10*2236.067977 + 0.01*0
                 = 890 + 223.6067977 = 1113.6067977

     Again, she prefers 1B.

     The resolution is that in the Allais paradox, the agent overweights the 1% chance of $0 in 1B compared to the 0% in 1A. So we need probability weighting.

     Let w(p) be a probability weighting function. Typically, w(0.01) > 0.01 and w(0.10) < 0.10.

