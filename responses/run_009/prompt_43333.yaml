                 = 0.87 + 0.16 = 1.03

     So she prefers 1A (1) over 1B (1.03) by a little? Not enough.

     Alternatively, use:

          w(0.01) = 0.05, w(0.10)=0.10, then:

          u(1B) = (1 - 0.10 - 0.05)*1 + 0.10*2 + 0.05*0 = 0.85 + 0.20 = 1.05 -> still prefer 1B.

     We need a bigger weight for the 1% event. Let w(0.01)=0.10, then:

          u(1B) = (1 - 0.10 - 0.10)*1 + 0.10*2 + 0.10*0 = 0.80 + 0.20 = 1.00

     So now she is indifferent.

     Let's increase it to w(0.01)=0.11:

          u(1B) = (1 - 0.10 - 0.11) * 1 + 0.10*2 + 0.11*0 = 0.79 + 0.20 = 0.99

     So she prefers 1A (1) over 1B (0.99).

     For lottery 2A and 2B:

          u(2A) = w(0.11) * 1 + (1 - w(0.11)) * 0
          u(2B) = w(0.10) * 2 + (1 - w(0.10)) * 0

     We don't know w(0.11). Let's assume w(0.11) = 0.11 (linear) but then she would prefer 2B if w(0.10)*2 > w(0.11). If w(0.10)=0.10 and w(0.11)=0.11, then:

          u(2A)=0.11, u(2B)=0.20 -> she prefers 2B.

     But if we apply the same weighting function, we might have w(0.11) = w(0.10) + w(0.01) = 0.10+0.11=0.21? That's not how it works.

     Typically, the weighting function is applied to the probability of an outcome within a lottery. For lottery 2A, it's a single outcome with probability 0.11. For lottery 2B, it's an outcome with probability 0.10 of winning $5 million and 0.90 of $0.

     So:

