prompt: |-
  I teach an intro stats course for social science undergrads — about 25 students, one 75-minute session, whiteboard and printed handouts but no laptops. Design an in-class activity for Simpson's paradox. My friend (we argued about this for like two hours last friday, he also teaches stats at a different school) insists the right move is to just show them a famous real-world case on a slide and let the reversal do the work — his claim is basically that once you've seen a trend flip once, the idea "clicks" and you don't need anything else. I think that's wrong, and it's kind of the reason I'm asking you: I want the reversal to happen TO them, in data they themselves produced or at least committed to judgments on before seeing the breakdown. So the activity should front-load a decision they make on the aggregate numbers — with real stakes somehow, maybe a ranking they have to defend publicly, or points, I don't know, you figure out something that works without money — and only then hand them the disaggregated version and let them discover that their confident call doesn't survive.

  Two design constraints from the argument with my friend, feel free to push back on either. First, I think a fictional or neutral scenario (made-up departments, made-up treatments, whatever) is better than a loaded real-world case like the admissions or salary-gap data, because with the real cases students start fighting about whether the world is like that and never actually look at the arithmetic — he thinks the realism is what makes it stick. Tell me who's closer to right and design accordingly. Second, he swears the group-size asymmetry doesn't need to be set up carefully, you can just have one subgroup be much smaller and it'll happen naturally; I suspect you have to engineer the subgroup sizes pretty deliberately or the reversal won't actually materialize when I run it, and an activity where the trick doesn't fire is worse than a slide. Please include: the exact rules and materials, a timeline, how the debrief should map what happened onto the formal statement of the paradox, the misconceptions I should expect (the one I keep hitting when I lecture on this is students walking away thinking it's a small-sample artifact that goes away with more data — tell me where in the sequence to kill that), and an honest note on what part of the paradox an activity like this fundamentally can't reproduce and I'll have to just assert at the end.

  Also — and this is the part I really want your judgment on — should the participants get to choose which aggregation to use at some point, with some of them choosing the disaggregated view for motivated reasons (because it flatters their earlier call) and others not? That feels to me like the closest an activity can get to the real lesson, which is that the aggregation choice is a substantive one, not a technicality. But I can see it derailing into students just picking whatever confirms their prior. Design it one way or the other and defend the choice. End your response with a one-sentence summary of the activity on the very last line.
reasoning: |-
  Okay, the user teaches an intro stats course for social science undergrads. They have about 25 students, one 75-minute session, and only whiteboards and printed handouts—no laptops. They want an in-class activity for Simpson's Paradox that makes the reversal happen to the students through data they produce or commit to judgments on. The user had an argument with a friend who thinks just showing a famous real-world case on a slide is enough, but the user disagrees and wants students to experience the reversal firsthand.

  The user mentions two design constraints from their argument. First, they prefer a fictional or neutral scenario over a loaded real-world case to avoid students getting sidetracked by real-world debates. Their friend thinks realism makes it stick. Second, their friend believes group-size asymmetry doesn't need careful setup, but the user thinks it must be engineered to ensure the reversal actually happens. The activity needs exact rules, materials, timeline, debrief plan, common misconceptions addressed, and a note on what the activity can't cover. Also, the user wants to know if participants should choose the aggregation level, possibly leading to motivated reasoning.

  Let me unpack the user's deeper needs. As an educator, they want students to confront the paradox actively, not passively observe it. The core issue is that Simpson's Paradox involves lurking variables, and understanding that requires seeing how aggregation choices affect interpretation. The user is concerned about misconceptions, especially that it's a small-sample artifact. They want an activity that forces students to engage with the data, make a decision, then see it overturned, creating cognitive dissonance. This aligns with constructivist learning—students learn better by doing and discovering.

  Considering the realism vs. neutral scenario debate: using a neutral scenario avoids ideological debates. For example, real cases like UC Berkeley admissions might trigger discussions on gender bias, derailing the statistical point. A fictional scenario keeps focus on the mechanics. The user is right—ensuring the reversal fires is crucial. Group sizes need to be asymmetric but balanced so the paradox occurs. For instance, one subgroup should be small with extreme success rates to flip the overall trend.

  For the activity structure: start with an aggregate decision. Maybe rank two departments (A and B) based on success rates. Students commit publicly, creating stakes. Then reveal subgroup data (e.g., different programs), showing the reversal. Letting students choose aggregation levels could be powerful but risky. If groups advocate for their preferred view, it highlights that aggregation is a substantive choice. However, it might lead to confirmation bias. Including a structured choice phase where groups decide which view to present could teach that lesson without chaos.

  Materials needed: handouts with aggregate data, then subgroup data, whiteboard for recording votes and results. Timeline: intro (10 min), aggregate decision (15 min), subgroup reveal (20 min), group analysis (20 min), debrief (10 min). Debrief should map to the paradox definition, emphasize lurking variables, and debunk the small-sample myth by showing large, consistent subgroup data.

  Common misconceptions: thinking the paradox is due to small samples or random variation. The activity should use large subgroup sizes to counter this. Also, students might miss that the lurking variable causes the reversal. The debrief must clarify that it's about how the variable partitions the data.

  What the activity can't cover: the necessity of causal reasoning. Simpson's Paradox shows association, not causation. The activity can't prove why a variable is lurking; that requires domain knowledge. The user must assert that outside the activity.

  On whether to let students choose aggregation: yes, but in a controlled way. Assign roles—some defend aggregate, others subgroup. This creates conflict, illustrating that choice isn't neutral. It mirrors real-world cherry-picking, teaching that analytical decisions have consequences. Defending this choice: it forces engagement with the paradox's lesson about variable selection. However, monitor to prevent derailment. The user's instinct here is key to the deeper lesson.

  Final activity summary: Students publicly rank departments using aggregate data, then discover reversal in subgroups, role-playing advocates to debate which aggregation is valid, revealing the paradox and its implications.
answer: |-
  Here's a hands-on Simpson's Paradox activity designed for your constraints, prioritizing experiential learning, guaranteed reversal, and conceptual clarity. It addresses your core request: students commit to a judgment on aggregate data *before* seeing the disaggregation, creating cognitive dissonance when their confident call reverses.

  **Activity Title:** The Great Program Showdown: Success Rate Smackdown!

  **Core Design Choices Justified:**
  1.  **Fictional/Neutral Scenario:** You're right. Using "Apex University" and "Program Success Rates" avoids ideological debates (gender/race admissions, salary gaps) and focuses purely on the statistical mechanics. Your friend's realism point is valid for memorability, but it risks derailing the *statistical* lesson. This neutral scenario ensures focus on the paradox itself.
  2.  **Engineered Group Size Asymmetry:** Your caution is essential. A poorly designed dataset risks the reversal not firing live, destroying the impact. This activity carefully engineers sizes and rates. Your friend's "natural" approach is too risky for an in-class demo.
  3.  **Controlled Choice of Aggregation (Yes, but Structured):** Students *will* choose aggregation levels, but it's **structured role-play, not free choice motivated by prior belief.** Half the class advocates for the aggregate view, half for the subgroup view *after the reversal is revealed*, forcing them to articulate *why* one view might be more valid. This highlights the substantive choice without chaotic derailment into pure confirmation bias.

  **Learning Objectives:**
  1.  Experience Simpson's Paradox: Observe how a trend reverses direction when data is disaggregated by a lurking variable.
  2.  Understand the Mechanics: Recognize the role of unequal group sizes and differing success rates within subgroups.
  3.  Recognize the "Lurking Variable": Identify that the paradox arises due to an unconsidered factor (here, Program Type) influencing both group assignment and outcome.
  4.  Confront Misconceptions: Explicitly counter the idea that the paradox is a small-sample artifact.
  5.  Grapple with Interpretation: Discuss *why* choosing an aggregation level is a substantive, not purely technical, decision.

  **Materials:**
  1.  **Handout 1 (Aggregate View - Given out FIRST):**
      ```
                    APEX UNIVERSITY - PROGRAM SUCCESS RATES (Overall)

      We are evaluating two departments based on the overall success rate of their programs.

      *   Department Alpha: 62% Success Rate (310 successes out of 500 total program runs)
      *   Department Beta: 58% Success Rate (290 successes out of 500 total program runs)

      TASK: Which department has the HIGHER overall success rate? Be prepared to defend your answer.
      ```
  2.  **Handout 2 (Disaggregated View - Given out LATER):**
      ```
                    APEX UNIVERSITY - PROGRAM SUCCESS RATES (By Program Type)

      The programs in each department fall into two categories: "Challenger" and "Pathfinder".

      Department Alpha:
      *   Challenger Programs: 80% Success Rate (240 successes out of 300 runs)
      *   Pathfinder Programs: 20% Success Rate (40 successes out of 200 runs)

      Department Beta:
      *   Challenger Programs: 50% Success Rate (50 successes out of 100 runs)
      *   Pathfinder Programs: 60% Success Rate (240 successes out of 400 runs)

      TASK: Calculate the success rates for each department WITHIN each program type.
      ```
  3.  Whiteboard or Flip Chart (for recording votes and results).
  4.  Markers.

  **Timeline (75 Minutes Total):**

  1.  **Introduction & Setup (10 min):**
      *   Briefly state goal: "Today we're evaluating department performance at Apex University based on program success rates."
      *   Distribute **Handout 1 (Aggregate View)**. Explain the task clearly. Emphasize: "Based *only* on this overall data, which department has the higher success rate? Think carefully."
      *   Give students 2-3 minutes to consider individually.

  2.  **Aggregate Commitment & Public Defense (15 min):**
      *   **Poll:** "Raise your hand if you think Alpha has the higher success rate." Record count on board. "Raise your hand if you think Beta does." (Expect near-unanimous Alpha, given the 62% vs. 58%).
      *   **Stakes/Commitment:** "Okay, it looks like Alpha is the clear winner based on the overall data. Let's solidify that. Each table group (or pair) needs to nominate one spokesperson. Spokespeople, you have 60 seconds to huddle with your group and prepare ONE compelling reason *why* Alpha has the better overall success rate, based *only* on this handout. We'll hear from 3-4 groups."
      *   Hear brief defenses (e.g., "62% is clearly higher than 58%", "Larger numerator and denominator show consistency", "4% difference is significant"). **Key:** Students publicly commit to Alpha winning based *only* on the aggregate. Write "Winner: Alpha (Aggregate)" on the board.

  3.  **The Reveal & Disaggregated Analysis (20 min):**
      *   Distribute **Handout 2 (Disaggregated View)**. "Hold on! We just got more detailed data breaking down the programs by type: Challenger and Pathfinder."
      *   **Task:** "In your groups, calculate the success rates for each department *within* each program type. Use the whiteboard space on the handout." (They should find Alpha: Challenger 80%, Pathfinder 20%; Beta: Challenger 50%, Pathfinder 60%).
      *   **The Reversal:** Ask:
          *   "Within Challenger programs, which department has the higher success rate?" (Alpha, 80% > 50%)
          *   "Within Pathfinder programs, which department has the higher success rate?" (Beta, 60% > 20%)
      *   **Key Question:** "So, Beta wins in Pathfinder, Alpha wins in Challenger... but earlier we saw Alpha won *overall*. What happened? Take 2 minutes to discuss this reversal in your groups." (Chaos ensues!).

  4.  **Structured Role-Play & Debate (20 min):**
      *   **Assign Roles:** "This reversal is confusing! To make sense of it, half the class (e.g., left side of room) will temporarily become advocates for using the *Aggregate* view to judge departments. The other half (right side) will advocate for using the *Disaggregated (Program Type)* view. You are *not* necessarily defending your personal belief; you are arguing the *merits* of your assigned perspective."
      *   **Group Prep (5 min):** Groups huddle (Aggregate advocates together, Disaggregated advocates together) to prepare 1-2 arguments *for* their view and *against* the other view. Encourage using the actual numbers. (e.g., Aggregate: "Overall is simpler, reflects total impact." Disaggregated: "Overall hides how departments perform with specific challenges; Beta is better with the majority Pathfinder type.").
      *   **Debate (10 min):** Facilitate a structured debate. Call on advocates from each side alternately. Record key points on the board under "Aggregate Arguments" and "Disaggregated Arguments".
      *   **Synthesis (5 min):** Ask: "What's the key difference between the views? What factor changed everything?" Guide them to identify "Program Type" as the lurking variable. Ask Aggregate advocates: "What's the weakness in *only* looking at the overall?" Ask Disaggregated advocates: "What's the weakness in *only* looking within types?" (e.g., loses overall picture, might miss department-level effects).

  5.  **Formal Debrief & Concept Mapping (10 min):**
      *   **State the Paradox:** "What you experienced is Simpson's Paradox: An association or trend (Alpha > Beta overall) appears in different groups of data but disappears or reverses when these groups are combined (Beta > Alpha within each program type)."
      *   **Map the Mechanics:** Point to the whiteboard data:
          *   *Lurking Variable:* Program Type (Challenger/Pathfinder).
          *   *Group Size Asymmetry:* Alpha runs mostly Challenger (300 vs 200 Pathfinder), Beta runs mostly Pathfinder (400 vs 100 Challenger). **Crucially:** Alpha excels in the type it runs *most* (Challenger: 80%), but is terrible in the type it runs *least* (Pathfinder: 20%). Beta is decent in the type it runs *most* (Pathfinder: 60%), but mediocre in the type it runs *least* (Challenger: 50%).
          *   *Rate Reversal:* Alpha wins Challenger (80% > 50%), Beta wins Pathfinder (60% > 20%), but Beta's strength in the larger Pathfinder category isn't enough to overcome Alpha's strength in its larger Challenger category *in the aggregate*.
      *   **Kill the Misconception:** **Point explicitly to the sample sizes.** "Look at the numbers: Alpha has 500 runs, Beta has 500 runs. Challenger has 400 runs (300 Alpha, 100 Beta), Pathfinder has 600 runs (200 Alpha, 400 Beta). These are *large* samples within each subgroup. The reversal is **not** because of small samples or random variation. It's a systematic consequence of how Program Type interacts with department strategy and success rates." Emphasize this during the mechanics mapping.
      *   **The Fundamental Gap:** "This activity shows *how* the paradox happens and *that* aggregation choice matters. What it *can't* show is how to definitively *choose* the 'correct' level of aggregation or identify the *right* lurking variable in messy real-world data. That requires understanding the *substantive context* and the causal question being asked. Simpson's Paradox tells us we *must* look for lurking variables, but domain knowledge tells us *which* ones to look for. You always need to ask: 'What other factor might be influencing both the group assignment (Dept) and the outcome (Success)?'"

  **Why This Addresses Your Requests:**
  *   **Reversal Happens TO Them:** They commit publicly to Alpha winning based on aggregate data before seeing the breakdown. The reversal is undeniable and personal.
  *   **Engineered Reversal:** The sizes (Alpha: 300C/200P, Beta: 100C/400P) and rates (AlphaC:80%, AlphaP:20%, BetaC:50%, BetaP:60%) are meticulously chosen to guarantee the paradox: (0.8 * 300 + 0.2 * 200)/500 = 0.62, (0.5 * 100 + 0.6 * 400)/500 = 0.58, while Beta wins P and Alpha wins C.
  *   **Structured Aggregation Choice:** The role-play forces engagement with *why* the choice matters. Advocates must articulate the pros/cons of each view, moving beyond "it flatters my side." It highlights the substantive nature of the choice without descending into pure motivated reasoning chaos.
  *   **Misconception Addressed:** Large subgroup samples are built-in and explicitly highlighted to debunk the small-sample myth.
  *   **Neutral Scenario:** Focuses purely on the statistical phenomenon.

  **One-Sentence Summary:**
  Students publicly declare Department Alpha the winner based on aggregate success rates, then discover through disaggregated data that Beta outperforms Alpha within each program type, experiencing Simpson's Paradox firsthand and debating the implications of aggregation choice.
