prompt: |-
  I teach a third-year course in philosophy of cognitive science, and in a fortnight I have a single ninety-minute seminar on the frame problem. The students have had a term of propositional logic and a few weeks on classical symbolic AI, but nothing on nonmonotonic logic. Don't explain the frame problem to me; plan how I should teach it. In particular: in what order the ideas must come — does the narrow version, about representing what a competent action leaves unchanged in a symbolic system, have to precede the broader one about relevance and what a system can safely ignore, or is it the other way round, and why? What one example should carry the whole seminar, what it must have and lack, and why I'm wary of the standard robot-and-wagon stories, which seem to teach the narrow version while making the broader problem look like an afterthought? Which misconceptions should I expect — I'd guess some will take it to be the truism that computers can't judge relevance, others will assume machine learning dissolved it, and a few will hear the word and think of film — and where exactly in the sequence should each be headed off? What should I openly decline to cover at this level, and say so? And what one question could I put to them in the last five minutes whose answers would show me whether they've grasped the difference between the technical problem and the moral philosophers have drawn from it? Please answer in British English.
reasoning: |-
  Okay, the user is teaching a philosophy of cognitive science course and needs to plan a single 90-minute seminar on the frame problem. They've specified that students have background in propositional logic and classical symbolic AI but no exposure to nonmonotonic logic. 

  First, I need to consider their explicit questions about sequencing (narrow vs broad frame problem), example selection, misconceptions, scope boundaries, and assessment. But reading between the lines, they're clearly frustrated with how the frame problem is typically taught - they specifically reject the "robot-and-wagon" stories for privileging the narrow version. This suggests they want the broader philosophical implications centered, not tacked on.

  Hmm... their identity as a philosophy lecturer matters here. They'll care about conceptual clarity but also about the meta-problem of how certain technical issues morph into philosophical concerns. The unspoken need might be: how to make students see this isn't just an AI engineering glitch but a fundamental cognition problem that implicates human rationality too.

  Right then, structuring the seminar:
  - Must start broad to hook philosophy students. Beginning with "relevance" rather than STRIPS axioms makes sense because it connects to their existing Hume/Quine knowledge. 
  - The example needs to show both technical representation failure AND the epistemic horror of relevance paralysis. A modified robot story could work if it's designed to fail spectacularly at relevance - say a robot tasked with making tea while ignoring irrelevant changes (butterfly flapping? gravity fluctuations?). 
  - Biggest landmine: students thinking "machine learning solved this". Need to preempt by showing ML has frame-problem-ish issues too (catastrophic forgetting, data hunger as relevance failure).
  - Assessment question must force distinction between "this causes memory overload in symbolic systems" and "this shows why rationality is impossible without biological grounding". 

  Ah - and must explicitly decline nonmonotonic logic details. Acknowledge it exists as a technical patch but emphasise it doesn't touch the philosophical depth. 

  Final thought: their British English request suggests this is for a UK uni. Should keep tone appropriately academic but witty - a dry "we shan't be covering film theory" when addressing misconceptions might land well.
answer: |-
  Right, let's craft a focused seminar plan for that tricky ninety minutes. The key is starting with the *phenomenon* of relevance before diving into its symbolic representation failure.

  **Overarching Principle:** Begin with the broader epistemic problem humans effortlessly solve to show *why* the narrow technical problem matters. Don't start in the weeds of axioms.

  **Seminar Structure & Sequence (90 mins):**

  1.  **Hook & The Broader Problem (Relevance) First (15 mins):**
      *   **Start:** "Imagine you decide to make a cup of tea. You put the kettle on. What *doesn't* cross your mind? Why aren't you worried the colour of the walls changed? That gravity just turned off? That the Prime Minister resigned? Why can you safely *ignore* almost everything in the universe?"
      *   **Concept:** Frame this as the **Relevance Problem**. Performing any action (or forming any belief) requires implicitly knowing a vast amount about what is *irrelevant* and remains unchanged. Highlight this as fundamental to practical reasoning and common sense.
      *   **Why Broader First?** It grounds the technical issue in the core cognitive challenge we *want* AI/cognition to solve. Starting narrow (axioms) makes it look like an esoteric coding issue. Starting broad shows it's a profound problem of intelligence and situatedness. It answers the "Why should we care *philosophically*?" immediately.

  2.  **Transition to Symbolic AI & Introducing the Narrow Problem (20 mins):**
      *   "Classical Symbolic AI aimed for intelligence via explicit representation and logical inference. How would it handle this relevance problem?"
      *   **The Challenge:** To reason about change (e.g., action effects), you need to represent what *doesn't* change. But the world is vast; listing every unchanging thing is impossible (combinatorial explosion). Yet, omitting them risks faulty inference.
      *   **Narrow Frame Problem Defined:** The technical challenge of efficiently and correctly representing, within a logical system, *which* fluents (properties that can change) are *not* affected by a given action, without needing a vast number of explicit 'no change' axioms (frame axioms).
      *   **Why Now?** Having established the *need* (the relevance problem), we see *why* the symbolic approach hits this specific technical wall. It's the bottleneck encountered when trying to *mechanise* the broader competence.

  3.  **The Example: "Fetching Coffee" (30 mins - Carries the Weight):**
      *   **Scenario:** An agent (could be a simple robot or just an abstract system) in a known office environment. Its goal: fetch coffee from the kitchen. Key actions: `WalkTo(Location)`, `PickUp(Object)`. Fluents: `Location(Agent)`, `Holding(Agent, Object)`, `CoffeePotIn(Location)`, `LightsOn(Location)`, `PlantAlive`, `PrimeMinister`.
      *   **The Problem Setup:**
          *   Action: `WalkTo(Kitchen)`. Effect: `Location(Agent) = Kitchen`. What *else* changes? Hopefully nothing relevant! But the system needs to *know* what stays the same to reason about the next step.
          *   **What it MUST Lack:** Any built-in, magical sense of relevance. We must *try* to represent everything explicitly first to see the failure.
          *   **What it MUST Have:** Enough complexity to show the explosion. Include obviously irrelevant things (`PlantAlive` remains true? `PrimeMinister` remains unchanged? `LightsOn(Office)` remains true?).
      *   **Demonstrate the Explosion:**
          *   For *each* action (e.g., `WalkTo`), you potentially need a frame axiom for *every* fluent it *doesn't* affect: `WalkTo(x) causes ¬(PlantAlive = false)`, `WalkTo(x) causes ¬(PrimeMinister = resigned)`, `WalkTo(x) causes ¬(LightsOn(Office) = false)`, etc. This is absurdly inefficient and brittle (adding a new fluent needs new axioms for every existing action).
          *   **Why avoid Robot-and-Wagon?** It often focuses *only* on the immediate physical chain (wagon moving only if attached/on surface), making the relevance problem seem small and physical. "Fetching Coffee" forces inclusion of *vastly* diverse, clearly irrelevant fluents (`PrimeMinister`), making the explosion visceral and the link to the broader relevance problem undeniable. The broader problem isn't an afterthought; it's the *source* of the technical nightmare.

  4.  **Consequences, Misconceptions & Scope (15 mins):**
      *   **Consequences:** This cripples scalability and real-world applicability of purely deductive, monotonic symbolic systems. It blocks common-sense reasoning.
      *   **Addressing Misconceptions:**
          *   *"Computers can't judge relevance (Truism)"*: Head off here (during broader problem discussion). Yes, but *why* is this a *problem* for *models* of cognition/AI? It's not just a fact, it's a barrier to building systems that *have* common sense. The frame problem shows the *specific, catastrophic failure mode* when trying to formalise it symbolically.
          *   *"Machine Learning (e.g., Deep Learning) solved it"*: Address explicitly here. **NO.** ML systems (especially deep learning) *avoid* explicit symbolic representation, but they don't *solve* the frame problem; they *sidestep* its specific symbolic manifestation. They face their *own* versions: catastrophic forgetting (inability to retain unchanged knowledge), data hunger (needing vast examples to *implicitly* learn what's irrelevant), and lack of explicit, verifiable guarantees about what they ignore. Their "relevance" is opaque and statistical, not grounded and explicit. **The broader relevance problem remains.**
          *   *"Film Frames"*: Mention lightly at the very start when defining the term: "No, not cinematic frames; think 'frame of reference' or 'framework for reasoning'."
      *   **What We Won't Cover:** "We shan't delve into the technical details of *solutions* like nonmonotonic logics (e.g., circumscription, default logic), belief revision, or heuristic approaches today. Our focus is understanding the *nature* of the problem itself – why relevance is fundamental and why representing it symbolically causes this specific technical implosion. We also won't resolve the philosophical debates today, just identify them."

  5.  **The Philosophical Payoff & Assessment Question (10 mins):**
      *   **Recap:** The narrow problem is the *symptom* (symbolic representation explosion) of the broader *disease* (the relevance problem).
      *   **The Philosophical Moral:** Many (like Fodor, Dreyfus) argue this exposes a deep flaw in the "Computational Theory of Mind". Human cognition *somehow* deals with relevance effortlessly, without exhaustive representation or explicit deduction. This suggests intelligence/cognition might be fundamentally:
          *   **Embodied & Situated:** Relying on the structure of the world and our bodies to constrain relevance.
          *   **Holistic:** Background knowledge is integrated, not atomised into discrete logical facts.
          *   **Non-computational?:** Perhaps not best understood as formal symbol manipulation.
          *   **Requiring "Magic"?:** Fodor's pessimistic conclusion – we have no idea how we do it.
      *   **The Assessment Question (Last 5 mins):**
          > **"Explain the difference between the narrow frame problem (as a technical issue in symbolic AI) and the philosophical significance drawn from the broader frame problem (the relevance problem). Why does the narrow problem matter *philosophically* beyond being an engineering headache?"**
          *   **Why it works:** A good answer will distinguish the *symbolic representation challenge* (narrow) from the *fundamental cognitive competence* (broader) and explain how the former's failure threatens classical computational models of the latter. It forces them to articulate the 'moral'.

  **Key Seminar Moves:**

  *   **Use the Board:** Sketch the "Fetching Coffee" scenario, list actions, list fluents (include silly ones!), show the explosion of needed frame axioms.
  *   **Socratic Questioning:** Constantly ask "What *doesn't* change? How would you *know*? How would you write that down?"
  *   **Emphasise the Absurdity:** Make the combinatorial explosion feel ludicrous when listing frame axioms for `PrimeMinister`.
  *   **Link Constantly:** Keep saying "This technical mess *is* the result of trying to formalise *that* broader ability we started with."
  *   **Be Clear on Scope:** Explicitly bracket solutions and deep dives into specific philosophers' takes (Fodor vs. Dreyfus vs. connectionists). Focus is the *problem*.

  This approach starts with the compelling cognitive marvel (relevance), shows how symbolic AI crashes into a wall trying to capture it, uses a relatable example designed to highlight the explosion of irrelevance, directly confronts misconceptions, and ends by crystallising the philosophical significance. Good luck!
