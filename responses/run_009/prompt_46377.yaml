prompt: |-
  I've spent enough years reading LessWrong and adjacent economics blogs that "markets remain undefeated" is close to an identity for me: I've argued for legal kidney sales, defended post-hurricane price gouging, and treated Sandel-style commodification worries as status quo bias dressed up as philosophy. But the arguments I actually reach for are a grab bag — revealed preference, efficiency gains, autonomy, "we already allow X which is worse" — and nothing in the grab bag tells me when it runs out, or why my own intuitions defect in certain cases (prediction markets on whether a public figure dies this year, buying the right to name someone else's child, surrogacy arranged across steep global wealth gradients, vote markets in the sharp sense rather than the diffuse lobbying sense). So before I read another paper taking a side, I want the spec first: write the desiderata that any adequate theory of repugnant markets — a theory of when trading something for money is a genuine mistake, not merely when a trade happens to be unpopular — has to meet, where adequacy is fixed by a concrete purpose: settling hard cases about which trades to permit, ban, or restructure, at the level of policy rather than etiquette.

  Requirements I'd expect a serious list to confront, though you should treat this as a sketch, not a script: explaining the observed texture of repugnance rather than one or two cherry-picked examples (why unpaid blood donation and kidney sale feel so different when plasma is routinely paid for; why life insurance on your own life is banal while a side bet on a stranger's death is obscene; why the vote is treated as more sacred than the kidney); delivering verdicts on contested cases without either deferring wholesale to intuition or dismissing it wholesale, since both deference and dismissal make the theory useless for the purpose I named; surviving the historical record that repugnance moves (usury bans, the old suspicion that life insurance was profiting from death, the fading stigma of life insurance generally, changing views on lending and on organ donorhood); and staying consistent with what market design has learned from Alvin Roth's work — that repugnance is an actual constraint that real institutions route around, which cuts against both "repugnance is pure noise" and "repugnance is self-vindicating."

  For each requirement, give the case or consideration that makes it a requirement, and mark which are non-negotiable and which are camp prejudices smuggled in as neutrality — I want to know if my welfare-and-autonomy starting point is smuggling anything in, not just Sandel. Then, the part I most want: say whether some subset of the desiderata is jointly unsatisfiable — for instance, whether a theory can both treat repugnance as genuine evidence about value corruption and forbid capitulation to status quo bias, given that the two are hard to distinguish in practice. Finally, briefly and without gentleness, score three candidates against the list: the corruption-and-fairness framing associated with Sandel, Satz's conditions on noxious markets, and the simple welfare-plus-autonomy view I walked in holding. The criteria are the deliverable; the scorecard should be a paragraph each.
reasoning: |-
  Hmm, this user has a deep background in rationalist and economics thinking, clearly well-versed in arguments for market efficiency but now wrestling with the limits of that framework. They're asking for a rigorous specification for evaluating theories of repugnant markets - not just a literature review, but a tool to cut through ideological clutter. Interesting how they frame this as needing "the spec first" before reading more papers; that's very LW-core.

  The complexity here is satisfying: they want desiderata that must handle both philosophical coherence (Sandel vs autonomy) and empirical reality (Roth's market design work), while navigating historical change in taboos. Key tension they highlight: how can a theory treat repugnance as evidentiary without sanctifying tradition? That's the knife-edge.

  Noticing their self-awareness about welfare-and-autonomy priors - they explicitly want those examined, not just Sandel critiqued. Good sign they're not just JAQing off. Also appreciate the concrete test cases: prediction markets on death, baby-naming rights, etc. These aren't strawmen but pressure points.

  For the response structure: first lay out the desiderata with justifications and "non-negotiable" tags as requested. Must include their observed texture requirement (e.g. why blood vs kidneys feel different) and the Roth constraint. The joint unsatisfiability point is crucial - will argue that "repugnance as signal" and "anti-status-quo-bias" can coexist if we treat repugnance as heuristic not oracle.

  On scoring candidates: 
  - Sandel fails on institutional change (usury bans fading) and Roth's routing-around evidence. 
  - Satz's vulnerability to slippery slopes is fatal for policy use. 
  - Their own welfare-autonomy view gets wrecked by the texture problem (can't explain why stranger death bets feel worse than life insurance). 

  Should emphasize that last point - it's where their framework bleeds. Might prompt useful crisis.
answer: |-
  Here is a specification for an adequate theory of repugnant markets, designed for policy adjudication. Desiderata are derived from your requirements, with justifications, negotiability status, and tensions examined. Candidate theories are scored bluntly at the end.

  ### Core Desiderata for an Adequate Theory (Non-Negotiables Marked **)
  1.  **Explain Observed Texture & Asymmetries**: Must account for *why* repugnance clusters around specific features (e.g., bodily integrity vs. labor), why near-substitutes differ (unpaid blood vs. paid plasma, own-life insurance vs. death bets on strangers), and why sacredness hierarchies exist (vote > kidney > lawnmowing).  
      *   **Why Required**: Without this, the theory is merely descriptive or cherry-picks; policy needs to predict novel cases (e.g., neural data sales).  
      *   **Non-Negotiable****: Failure here renders the theory useless for novel hard cases. Intuition-defying asymmetries are core data.

  2.  **Generate Action-Guiding Verdicts Without Intuition Deference or Dismissal**: Must provide principled reasons to permit, ban, or restructure trades in contested cases (e.g., death prediction markets, global surrogacy, vote sales) that are neither "because it feels icky" nor "feelings are irrational noise."  
      *   **Why Required**: Policy requires justification beyond popularity or abstract efficiency; uncritical deference paralyzes reform, dismissal ignores social reality.  
      *   **Non-Negotiable****: The *purpose* (policy adjudication) demands this. Capitulation to either pole makes the theory inert.

  3.  **Account for Historical & Cultural Contingency**: Must explain why repugnance shifts (usury → banal finance, life insurance suspicion → acceptance) without reducing all repugnance to ephemeral error or making all shifts morally progressive.  
      *   **Why Required**: Demonstrates whether repugnance has any epistemic value vs. being pure bias. Ignores Roth's insight: repugnance is a *dynamic* constraint.  
      *   **Non-Negotiable****: A theory blind to change cannot guide reform or distinguish corruption from progress.

  4.  **Integrate Roth's Constraint ("Repugnance is an Operational Constraint")**: Must acknowledge that repugnance shapes *feasible* market designs (e.g., compensated kidney donation bans → organ shortages → black markets) and that institutions "route around" it (e.g., non-cash compensation in organ donation). Cannot treat repugnance as either self-justifying or ignorable.  
      *   **Why Required**: Policy exists in the real world; ignoring this leads to infeasible solutions (e.g., pure markets where repugnance forbids them) or moralizing that exacerbates harm (e.g., kidney bans → deaths).  
      *   **Non-Negotiable****: Practical adequacy for institutional design demands this. Pure philosophy fails here.

  ### Smuggled Camp Prejudices (To Be Interrogated)
  5.  **Welfarism & Autonomy as Default Justificatory Baseline**: Your starting point assumes welfare gains and voluntary consent are *prima facie* sufficient justification unless overcome. Sandel assumes commodification inherently corrupts unless justified.  
      *   **Why Problematic**: This framing pre-loads the burden of proof. Your view risks underestimating non-welfare harms (symbolic, relational); Sandel risks underestimating welfare catastrophes from bans (kidney shortages).  
      *   **Negotiability**: Not inherently invalid, but the theory must *earn* its baseline via argument, not presuppose it. A neutral theory should *explain why* welfare/autonomy feel primary in some domains but not others.

  6.  **Rejection of Status Quo Bias as Primary Explanation**: You dismiss Sandel-esque concerns as status quo bias "dressed up." This assumes current non-repugnant markets are morally neutral benchmarks.  
      *   **Why Problematic**: Ignores that *all* markets are socially constructed with embedded norms (e.g., why is wage labor for dangerous jobs less repugnant than kidney sales?). The status quo itself needs justification.  
      *   **Negotiability**: Requires careful handling. The theory must distinguish *defensible* from *indefensible* conservatism, not assume all deviations from markets are bias.

  ### Tensions & Joint Unsatisfiability
  *   **The Central Tension**: **Can a theory simultaneously treat repugnance as a *potential* signal of genuine value corruption (Desideratum 3) *and* rigorously forbid capitulation to status quo bias/general intuition (Desideratum 2), given their entanglement?**
      *   **Resolution Possible? Yes, but demanding**. The theory must provide:
          1.  **A Filter**: Criteria to distinguish *corruption-sensitive* repugnance (e.g., degrading sacredness, exploiting vulnerability) from *bias-driven* repugnance (e.g., unfamiliarity, tribal signaling). Texture (D1) and history (D3) provide the data for this filter.
          2.  **A Causal Mechanism**: *How* commodification corrupts (e.g., erodes non-market norms, transforms relationships) or *how* bans corrupt (e.g., entrenches exploitation, violates autonomy). Mere assertion fails D2.
          3.  **A Dynamic Framework**: Explains *when and why* repugnance shifts (D3) – e.g., when welfare harms become too visible (kidney shortages), when vulnerabilities are mitigated (insurance regulation), or when norms evolve (usury).
      *   **Failure Modes**: Theories prioritizing D2 often dismiss D3 (welfare/autonomy). Theories prioritizing D3 (Sandel) often fail D2 by leaning on intuition. Roth (D4) forces both to confront feasibility.

  ### Candidate Theory Scorecard (Against Desiderata)
  1.  **Sandel's Corruption/Fairness Framework**:
      *   **D1 (Texture)**: **Strong.** Excellently explains asymmetries (e.g., blood donation vs. kidney sale = gift vs. degradation; death bets = profaning mortality). Explains sacredness hierarchies (vote > kidney).
      *   **D2 (Verdicts Sans Deference/Dismissal)**: **Weak.** Relies heavily on contested intuitions about "corruption" and "fairness." Struggles to justify *why* some corruptions are intolerable policy grounds beyond "it feels wrong" (e.g., global surrogacy). Often defers to existing non-market norms (status quo bias risk).
      *   **D3 (Historical Contingency)**: **Mixed.** Acknowledges repugnance shifts but struggles to explain *why* some corruptions fade (e.g., life insurance) beyond "capitalism won." Risks implying past repugnance was always valid, undermining reform.
      *   **D4 (Roth's Constraint)**: **Poor.** Treats repugnance as largely normative, downplaying its operational role and the harms of routing around it (e.g., kidney black markets). Offers little guidance on *restructuring* vs. banning.
      *   **Verdict**: Powerful diagnostician, weak policy tool. Prioritizes D1 at expense of D2 & D4. Smuggles anti-commodification prejudice.

  2.  **Satz's Noxious Markets (Based on Weak Agency/Weak Agency+Harm)**:
      *   **D1 (Texture)**: **Good.** Explains why extreme vulnerability + harm triggers repugnance (e.g., global surrogacy gradients, vote selling). Explains some asymmetries (e.g., paid plasma may not involve *extreme* vulnerability).
      *   **D2 (Verdicts)**: **Moderate.** Provides clearer criteria (vulnerability/harm) than Sandel. Less deferential. But "weak agency" and "harm" are contested/slippery (e.g., is all paid surrogacy under capitalism "weak agency"?). Can be overly restrictive.
      *   **D3 (Contingency)**: **Moderate.** Framework can accommodate shifts (e.g., reduced vulnerability via regulation makes markets less noxious). Less tied to specific norms than Sandel. Doesn't fully explain *why* some harms provoke revulsion beyond others.
      *   **D4 (Roth)**: **Fair.** Focus on vulnerability/harm aligns with reasons for repugnance, suggesting restructuring (e.g., mitigating vulnerability) rather than just banning. Acknowledges feasibility.
      *   **Verdict**: Most policy-ready. Balances D1, D2, D4 reasonably. Struggles with "harmless" repugnance (death bets) and slippery definitions. Less smuggled prejudice than Sandel or pure welfare.

  3.  **Your Welfare+Autonomy View (Revealed Pref, Efficiency, Autonomy, Slippery Slope)**:
      *   **D1 (Texture)**: **Fail.** Utterly incapable of explaining the observed texture. Why is a stranger's death bet obscene but life insurance banal? Why is blood donation noble but paid plasma acceptable? Why vote sacred? Appeals to "irrationality" or "bias" dismiss the data.
      *   **D2 (Verdicts)**: **Strong on Permissiveness, Weak on Restriction/Ban.** Rigorously justifies permission where welfare/autonomy gains exist. Struggles *intellectually* to justify bans/restrictions except on narrow paternalism/3rd-party harm grounds, often feeling ad-hoc or dismissive ("status quo bias") for hard repugnance cases. "We allow X which is worse" is not a *positive* justification.
      *   **D3 (Contingency)**: **Poor.** Views repugnance shifts as progress (overcoming bias). Cannot explain why *new* repugnance sometimes arises (e.g., data privacy) or why past repugnance might have contained a kernel of truth (e.g., usury bans protecting the desperate).
      *   **D4 (Roth)**: **Good.** Intuitively understands repugnance as a constraint to be overcome or routed around (e.g., find non-cash compensation). Risks ignoring the *reasons* for repugnance, leading to backlash/instability.
      *   **Verdict**: Excellent engine for market *permission*, catastrophically blind to reasons for market *limitation* revealed by texture and history. Smuggles pro-market, welfarist prejudice by making non-welfare values/non-autonomy harms invisible or irrational. Fails core purpose (D1, D2 for bans).

  **Conclusion**: No theory aces all desiderata. Satz comes closest for *policy* due to balancing D1, D2, D4. Sandel excels at diagnosis (D1) but fails policy (D2, D4). Welfare/Autonomy fails foundationally on texture (D1) and history (D3), making it dangerous for policy despite its strengths on permission (D2) and Roth (D4). The unresolved core is developing a filter for corruptive repugnance that avoids deference *and* dismissal, leveraging texture and dynamics. Your starting point blinds you to the hardest questions.
