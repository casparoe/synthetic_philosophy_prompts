prompt: |-
  I write features on science and ideas for a mid-size paper, and my collegue Dana runs our op-ed page's most-read column, which is basically a hypocrisy-watch thing. Every week she rules on whether some public figure "gets to say that" -- whether they have standing to blame, I guess the philosophers would call it. She's been doing it for years, and her rulings are actually pretty consistent, but I've never been able to pin down the exact rule she's running, and now there's a case coming this week I genuinely can't call. Help me predict her.

  Her track record, from memory:

  1. A TV preacher condemning adultery from the pulpit while carrying on an affair himself: she called him a hypocrite, no standing, obviously.

  2. A guy who quit smoking fifteen years ago writing a furious op-ed about how selfish smokers are for burdening the health system: she defended him. Has standing.

  3. A climate campaigner who still flies transatlantic maybe ten times a year, lecturing people who fly like it's a bus: no standing, she said, doesn't matter that he flies less than the people he's yelling at.

  4. An ordinary meat-eater going after trophy hunters on social media: she said he has standing, which surprised me, since he pays for animal suffering three meals a day.

  5. A retired coal executive bankrolling climate ads that blame current oil CEOs: no standing. Her line was something like -- he spent decades as the defendant, he doesn't get to switch to prosecutor just because he aged out.

  The new case: a former manager of a big pig operation, ran gestation crates for fifteen years, now the face of a campaign to ban them. There's a viral clip of him going after ordinary shoppers, basically saying you know exactly what you're paying for. And the wrinkle: he's not repentant at all. No apology tour, no donations, he just says his inside knowledge is exactly why he can point fingers. So he's leveraging the very thing he did wrong as his credential.

  Predict Dana's ruling. I'd like the answer structured in sections, in this order and rough length: "Her track record, compressed" -- a short recap of what her verdicts actually commit her to, maybe 100 words; "The rules that fit" -- the two or three candidate principles that each fit all five past rulings, around 250 words, with a note on where each one strains; "My prediction" -- your best guess for the pig guy and why you prefer that rule over the rivals, maybe 200 words; "What would settle it" -- the further case (design one) where the candidate rules diverge, around 100 words; and "How confident and where I'd lose the bet" -- a short section, 80ish words, where you say explicitly how confident you are in the prediction and single out the single point you're least sure of.

  Don't just give me a bare yes or no -- I want to understand the carving, what exactly she's tracking and what she isn't. And if you think her rulings are actually not consistent, or that the pig case splits the difference in some way the past cases don't, say that too.
reasoning: |-
  Okay, the user is a science and ideas writer for a mid-size paper. Their colleague Dana runs a popular column judging whether public figures have "standing" to criticize others—essentially a hypocrisy watch. The user has observed Dana's rulings over years but can't pinpoint her exact rule. Now, there's a new case about a former pig farm manager who used gestation crates for 15 years and now campaigns against them without repentance, leveraging his insider knowledge as credibility. The user wants help predicting Dana's ruling with a structured analysis.

  First, I need to recap Dana's track record concisely. The five cases show clear patterns: hypocrisy matters, especially if the accuser is currently engaged in the criticized behavior (like the TV preacher) or if their past actions directly enabled the problem (like the coal executive). However, past reformed behavior (like the ex-smoker) or lack of direct complicity (like the ordinary meat-eater) grants standing. The climate campaigner flying frequently loses standing because his current actions contradict his message, while the meat-eater isn't directly equivalent to trophy hunters.

  Next, I should identify candidate principles that fit all past rulings. The Active Complicity Rule seems strong—it focuses on whether the accuser is currently involved in the criticized behavior or recently profited from it. This explains why the ex-smoker (long reformed) and meat-eater (not directly complicit in trophy hunting) have standing, while the climate campaigner (current flights) and coal executive (recent beneficiary) don't. The Moral Debt Principle also fits, emphasizing whether the accuser has repaid their ethical debt through reform or restitution. This clarifies why the unrepentant coal executive lacks standing but the reformed smoker doesn't. The Equivalence Rule, where standing requires the accuser not to be currently doing something equally bad, has weaknesses—it struggles with the meat-eater case and the climate campaigner's reduced but still harmful flights.

  For the new pig farm case, the manager's lack of repentance and recent direct involvement (15 years running crates, now leveraging that experience) suggest no standing. The Active Complicity Rule fits best here—he's not currently using crates but recently benefited from them and hasn't reformed. The Moral Debt Principle also aligns since he shows no contrition. The Equivalence Rule might grant him standing since ordinary shoppers aren't identically complicit, but Dana's past rulings suggest she cares more about the accuser's ongoing moral burden than exact equivalence.

  To test these rules, a hypothetical case where the principles diverge would be ideal—e.g., a repentant former enforcer who made amends versus an unrepentant one. Dana would likely deny standing to the latter based on the Active Complicity or Moral Debt rules. My confidence in predicting "no standing" for the pig farm manager is high (85%), but the wrinkle is his claim that insider knowledge justifies his criticism—Dana might see this as aggravating rather than redeeming. If she rules he has standing, it would imply she weights expertise over moral debt, but her past emphasis on repentance makes this unlikely.
answer: |-
  ### Her track record, compressed (100 words)
  Dana denies standing to accusers who are **currently engaging** in the criticized behavior (TV preacher's affair, climate campaigner's flying) or **directly responsible** for the systemic harm they now condemn without meaningful restitution (coal executive). She grants standing to those who **reformed long ago** and lack ongoing complicity (ex-smoker), or whose **personal actions aren't equivalent** to the specific harm they're targeting (meat-eater vs. trophy hunters). Key themes: *current* hypocrisy invalidates; *past* harm requires *demonstrated change* for legitimacy; attacking a *subset* of a problem you participate in is allowed if your participation isn't the *same* offense.

  ### The rules that fit (250 words)
  1.  **Active Complicity Rule:** Standing requires you not be *currently* engaged in the *exact* behavior you condemn OR, for systemic harms, not have *recently* and *directly* profited/enabled it without redress. 
      *   *Fits:* Preacher (current affair), Climate campaigner (current high-emission flights), Coal exec (recent direct leadership, no restitution). Ex-smoker (long-reformed, not current), Meat-eater (eating ≠ trophy hunting, not same act).
      *   *Strain:* "Recently" is vague. Coal exec's "recent" is tied to retirement, not a timeframe. Pig manager's 15 years ended recently? Also, "exact behavior" – is flying transatlantic the *exact* behavior as frequent flyers, or just the same category?

  2.  **Moral Debt / Restitution Rule:** Standing depends on whether you've "settled your moral debt" related to the harm. If your *past* actions contributed significantly, you need demonstrable repentance/restitution *before* condemning others. Current hypocrisy is an automatic debt. 
      *   *Fits:* Preacher (current debt), Climate campaigner (ongoing debt via flights), Coal exec (massive unaddressed debt). Ex-smoker (debt paid via long reform), Meat-eater (no significant debt re: *trophy hunting* specifically).
      *   *Strain:* Meat-eater arguably has *some* debt re: animal suffering broadly. How much restitution is needed? Ex-smoker did nothing beyond quitting – is that sufficient "payment"?

  3.  **Equivalence Rule:** You lack standing only if you are *currently* doing something *morally equivalent or worse* than what you condemn. Past actions alone don't disqualify if reformed. 
      *   *Fits:* Preacher (current adultery = condemned adultery), Climate campaigner (current high flights ≈ condemned frequent flying). Ex-smoker (reformed, not equivalent), Meat-eater (eating ≠ morally equivalent to trophy hunting), Coal exec (past enabling ≈ current enabling? Dana ruled equivalent).
      *   *Strain:* **Major strain on Meat-eater case.** Why isn't funding industrial farming (arguably worse suffering) equivalent to funding trophy hunting? Dana seems to see them as distinct categories. Also struggles with Climate campaigner – is flying 10x less truly *equivalent* to flying "like a bus"? Dana said yes.

  ### My prediction (200 words)
  **Prediction: Dana rules "NO STANDING" for the pig farm manager.**

  *   **Why:** He fails both the **Active Complicity** and **Moral Debt** rules. While not *currently* running crates, his 15-year tenure was recent, direct, and instrumental in perpetuating the exact system he now condemns (Active Complicity). Crucially, he offers **zero repentance or restitution** (Moral Debt). He’s leveraging his harmful past as a credential, not distancing from it. This mirrors the **coal executive** – profiting from/enabling the system for years and then trying to switch roles without accountability. His "inside knowledge" angle is seen as aggravating, not redeeming; it highlights his direct responsibility without the necessary ethical reckoning.
  *   **Preferred Rule:** The **Moral Debt / Restitution Rule** best explains the coherence across cases, especially the distinction between the ex-smoker (debt paid via long reform) and the coal exec/pig manager (massive unaddressed debt). The lack of repentance is the decisive factor here, overriding any value in his "insider" status. The Active Complicity Rule also fits strongly due to the recency and directness of his harmful actions. The Equivalence Rule struggles most with the meat-eater case and feels less central to Dana's apparent emphasis on accountability for one's *own* contribution.

  ### What would settle it (100 words)
  **The Test Case:** A former high-level enforcer in a corrupt regime, who *personally* participated in oppression 20 years ago, fled, lived quietly, and *never apologized or made amends*. Today, they vehemently condemn *current, mid-level bureaucrats* still enabling the regime, citing their insider experience.  
  *   **Moral Debt Rule:** Likely NO STANDING (unaddressed past, no restitution).
  *   **Active Complicity Rule:** Likely NO STANDING (direct, significant past responsibility, recent enough?).
  *   **Equivalence Rule:** Likely HAS STANDING (not *currently* equivalent, condemning specific current actors, reformed by fleeing?).  
  Dana's ruling here would starkly reveal if past harm *always* requires repentance (Moral Debt) or if time/distance alone can suffice (leaning Equivalence).

  ### How confident and where I'd lose the bet (80 words)
  **Confidence:** 85%. The parallels to the coal executive (unrepentant former enabler leveraging insider status) are extremely strong. The lack of repentance is a glaring red flag based on past rulings.  
  **Where I'd Lose:** The single point of doubt is the *nature* of his "inside knowledge" claim. If Dana places unusually high value on the *utility* of his specific expertise for the campaign against crates, she *might* overlook the moral debt, though this contradicts her stance on the coal exec. His combative tone ("you know what you're paying for") likely reinforces her "no standing" instinct.
