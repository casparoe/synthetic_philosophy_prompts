  My friends Marco and Elena got into it at a bonfire last weekend and I got stuck refereeing for over an hour, and I still can't tell who won. The trigger was actually a third friend, Maya, who had a scary stretch last winter — she'd been pulling all-nighters for months and then had a couple of weeks where her own hands didn't feel like hers, and she told us later that during the worst of it she genuinely wasn't sure they were hers. Not metaphorically, actually unsure.

  Elena, who did a philosophy undergrad, said the episode reveals something important: Maya's certainty about her hands came apart under exhaustion, which shows it *can* come apart, which makes it the kind of thing you could be wrong about — and for things you could be wrong about, you only know them if you can rule out the ways you'd be wrong, and nobody can do that for their own hands. Marco literally held up his hand and said this settles it, look, a hand. Elena said that's not an argument, it's the claim repeated at louder volume — and any argument he tried to give would run through his eyes or his memory, the exact things in question. Marco came back that her doubt is fake: she looks both ways crossing the road, she grabs the stair railing, and a doubt you can't act on for five minutes isn't a doubt, it's a word game you play at a bonfire and drop the moment it costs anything. Elena said not being able to act on a doubt doesn't mean you don't have it — Maya acted mostly normal during her episode too, kept using her hands, and it didn't make her certainty come back — so behavior proves nothing about knowledge. Marco's closing move was that if Elena is right, nothing anywhere counts as known, and he'd rather say the certainty you couldn't give up even in principle isn't a super-sturdy belief but something more like the thing that has to already be in place before asking for reasons makes sense at all — you can't justify a chess move without the rules of chess already being there. Elena said he's just conceding her point in nicer clothes: if no possible evidence could ever move you, that's not a foundation, that's dogma with good manners, and she'd rather be an honest skeptic than a polite dogmatist.

  They turned to me for a verdict and I had nothing. Can you go through their exchange move by move and say who's right at each step, and whether there's some reading where they're both right — like Elena being right about what deserves to be called knowledge and Marco being right that the demand she's making somehow undermines itself? Also, I vaguely remember someone telling me Wittgenstein wrote a whole bunch of fragment notes right at the end of his life about almost exactly this fight (hands, certainty, doubts that eat their own tail), and I've never read any of it — if that's a real thing, does he actually come down on anyone's side there, or does he think both of them are making some shared mistake, and if so which mistake? Please also say how confident you are in the different parts of your answer and flag the single point you're least sure about, since I'm going to bring your verdict back to them and they will absolutely grill me on it.
