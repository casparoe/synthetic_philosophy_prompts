prompt: |-
  I teach a 200-level course on decision theory and rational choice, mixed philosophy and economics majors, 18 students, one 75-minute session. We've just finished expected utility theory and Savage-style representation theorems, and the students are comfortably maximizing everything in sight. I want to design an in-class game that makes them run into Pascal's mugging before they've heard the term: a stranger offers an unimaginably huge payoff for a modest payment, justified by an astronomically small but nonzero probability — and the rational-sounding calculations start pointing somewhere they don't want to go. The shape I'm imagining: an opening round of ordinary lotteries with tickets and a points ledger (no real money — points convertible to something small at the end, like snacks or a modest bonus quiz question, so stakes are real but trivial), then a sequence of escalating offers where the payoff grows much faster than the probability shrinks, culminating in an open round where students can make mugging offers *to each other* and set their own numbers, which I hope will show them the exploitable side of the principle. They should not hear the name or the associated arguments until the debrief.

  Please write the full activity: materials, rules, the exact escalation of offers I should make (with the point values and the stated probabilities or credences attached to each), how to handle the problem that probabilities here are just my say-so rather than anything objective, and how the peer-to-peer round should be structured so it doesn't collapse into pure comedy. Then a debrief that maps specific moments in the game onto the live options — unbounded expected utility with its "shut up and multiply" implication, bounded utility functions, treating sufficiently small probabilities as effectively zero, and the observation that a mugger can always name a bigger number, so any decision rule that pays up once can be bled dry. I'd like the debrief to press on whether their reluctance in the game was a considered objection to expected utility or just status-quo bias and embarrassment in front of peers, and to give them at least one round where they must state a general rule out loud and then confront its consequences.

  Finally, be honest about failure modes and limits: what will predictably go wrong the first time I run it (students gaming the points, someone paying up as a joke and muddying the data, the class coordinating a refusal for social reasons), and which feature of the real problem the game cannot reproduce — presumably something about the fact that in the actual scenario there is no ledger, no end-of-class settlement, and no way to verify that the probability wasn't zero all along. That gap is the part I'll have to supply by talk rather than by play, and I want to know exactly what it is and how to present it.
reasoning: |-
  We are designing an in-class game to illustrate Pascal's mugging without naming it until the debrief. The goal is to have students encounter a situation where expected utility theory (with unbounded utility) leads them to accept a deal that feels wrong: a very small payment for an astronomically huge payoff with an extremely tiny probability.

  Key elements:
  - Use points (convertible to a trivial reward at the end) to simulate stakes.
  - Start with ordinary lotteries to establish baseline rational choice.
  - Escalate the offers: increase the payoff and decrease the probability in such a way that the expected value becomes huge, but the probability is so small that it feels absurd.
  - Then, have a peer-to-peer round where students can make mugging offers to each other, to show how the principle can be exploited.

  Structure of the game:

  1. **Materials**:
     - A ledger (on the board or a shared document) to track points for each student. Start everyone at, say, 1000 points.
     - Tickets (physical or virtual) for lotteries in the initial rounds.
     - A way to simulate the probabilistic events (e.g., a random number generator, dice, or drawing tickets from a hat).

  2. **Rules**:
     - Students can choose to buy lottery tickets or make payments in the hope of winning a payoff.
     - In the initial rounds, the instructor offers the lotteries. In the peer round, students can offer deals to each other.

  3. **The Escalation of Offers**:

     We design a sequence of lotteries. The key is that the expected value (EV) of each lottery is positive and increasing, but the probability of winning decreases very rapidly while the payoff increases even more rapidly.

     Let:
     - p = probability of winning
     - Payoff = amount won (if win)
     - Cost = price to play

     We want EV = p * Payoff - Cost > 0, and we want the ratio (Payoff / Cost) to grow very large as p becomes very small.

     Example sequence:

     | Round | Cost (points) | Payoff (points) | Probability (p) | Expected Value (EV) | Notes |
     |-------|---------------|-----------------|-----------------|---------------------|-------|
     | 1     | 10            | 100             | 0.5             | 40                  | Baseline: fair lottery. |
     | 2     | 10            | 1000            | 0.01            | 0                   | EV=0, so indifference? But note: variance is high. This is a known probability (e.g., 1 in 100). |
     | 3     | 10            | 1,000,000       | 0.001 (1/1000)  | 990                 | EV positive. |
     | 4     | 10            | 10^9 (1B)       | 10^-6 (1/1M)    | 990                 | Still positive EV. |
     | 5     | 10            | 10^18           | 10^-15          | 10^3 (1000)         | Huge EV but probability is 1 in a quadrillion. |
     | 6     | 10            | 10^36           | 10^-33          | 10^3 (1000)         | Even more extreme. |

     However, note: we must be cautious about the numbers because the students only have 1000 points. So we cannot have them pay 10 points if they have only 1000 and then offer a payoff of 10^36 because that is absurd. We can adjust by making the cost very small relative to their initial endowment, but the payoff must be huge. Alternatively, we can use a cost of 1 point to make it less painful.

     Revised plan for the initial rounds:

     Start everyone at 1000 points.

     Round 1: Cost = 1 point, Payoff = 10 points, p = 0.2 -> EV = 0.2*10 - 1 = 1. So EV=1 point. (Positive, but small.)
     Round 2: Cost = 1 point, Payoff = 100 points, p = 0.02 -> EV = 0.02*100 - 1 = 1. (Same EV, but more variance.)
     Round 3: Cost = 1 point, Payoff = 1,000,000 points, p = 0.00002 -> EV = 0.00002*1e6 - 1 = 2-1 = 1. (Same EV, but now the payoff is huge and the probability tiny.)
     Round 4: Cost = 1 point, Payoff = 10^9 points, p = 2e-9 -> EV = 2-1 = 1.
     Round 5: Cost = 1 point, Payoff = 10^15 points, p = 2e-15 -> EV = 2-1 = 1.

     But note: the probability in round 5 is 2e-15, which is 2 in a quadrillion. We can describe it as: "I have a device that will generate a random number between 1 and 500 trillion, and if it hits exactly 1, you win." (Actually, 2e-15 is 1 in 500 trillion, so we can say: "I'll pick a number between 1 and 500 trillion, and if it's either 1 or 2, you win." So that's 2 in 500 trillion = 4e-15? We can adjust the numbers to be round.)

     Alternatively, we can make the EV increasing to make it more tempting:

     Round 3: p = 0.00002, Payoff=1e6 -> EV=1 (as above)
     Round 4: p = 2e-9, Payoff=1e9 -> EV=2-1=1
     Round 5: p = 2e-12, Payoff=1e12 -> EV=2-1=1

     But note: the EV is constant. We can also make it increasing to push the point:

     Round 1: p=0.5, Payoff=10, Cost=1 -> EV=4
     Round 2: p=0.1, Payoff=100, Cost=1 -> EV=9
     Round 3: p=0.001, Payoff=10000, Cost=1 -> EV=9
     Round 4: p=1e-6, Payoff=1e7, Cost=1 -> EV=9
     Round 5: p=1e-9, Payoff=1e10, Cost=1 -> EV=9

     However, the problem is that in round 5, the probability is one in a billion. We want to get to astronomically small.

     Let me propose:

     Round 1: Cost=1, Payoff=10, p=0.5 -> EV=4
     Round 2: Cost=1, Payoff=100, p=0.1 -> EV=9
     Round 3: Cost=1, Payoff=1e6, p=0.0001 (1 in 10,000) -> EV=9.99... (about 10)
     Round 4: Cost=1, Payoff=1e9, p=1e-8 (1 in 100 million) -> EV=9
     Round 5: Cost=1, Payoff=1e18, p=1e-17 -> EV=1e1 = 10? Wait: 1e18 * 1e-17 = 10, minus cost 1 -> 9. So EV=9.

     But note: the probability in round 5 is 1e-17. That's 1 in 100 quadrillion. How to make this credible? We can't. So we have to rely on the instructor's say-so.

  4. **Handling the problem of subjective probability**:
     - Acknowledge that in the real world, probabilities are often not known. In this game, the probabilities are set by the instructor and are to be taken as given (for the sake of the exercise). We are operating within a model where the probabilities are as stated.
     - However, in the peer round, the probabilities are set by the students and are even less credible.

  5. **Peer-to-peer round**:
     - Each student can make an offer to the rest of the class (or to a specific student). The offer must specify:
          - The cost (in points) that the payer must give to the offerer.
          - The payoff (in points) that the payer will receive if the event happens.
          - The probability of the event (which the offerer will describe in a way that makes it seem non-zero, but it can be arbitrarily small).
     - The offerer must also state how the event will be simulated (but note: we don't have a way to simulate extremely small probabilities). So we can say: the offerer must describe an event that they claim has that probability, and then we will use a random number generator to simulate it. But if the probability is too small, the simulation won't be able to resolve it (e.g., if we use a RNG with 64 bits, we can't represent probabilities below about 1e-19). So we might limit the probabilities to something that can be simulated with a RNG that we have (e.g., by generating a number between 1 and N, and winning if it equals a specific number). We can set a maximum N (say, 10^12) to keep it feasible.

     Rules for peer round:
     - Each student has the opportunity to make one offer (if they wish). They write it on the board or announce it.
     - The offer must be of the form: "Pay me X points now, and I will give you Y points if event E occurs. I claim that event E has probability p (and I will describe E)."
     - The event E must be something that can be checked by the end of the class (so we can settle the bets). We can use a RNG (e.g., random.org) to generate a number in a range and define E as that number being in a specific set. For example: "I will generate a random integer between 1 and 1 trillion. If the number is 1, then E occurs." (so p=1e-12).
     - We will have time for, say, 3-5 offers (depending on time). The instructor can select the offers that are most illustrative.

     To prevent pure comedy (like a student offering a payoff of 10^100 points with p=10^-99, which is an EV of 10 points, but the numbers are ridiculous), we can set a rule: the payoff must be expressed in points that are convertible at the end, so they cannot offer more than, say, 1e6 points because we don't want the ledger to have astronomical numbers. We can cap the payoff at 1e6 points? But then the probability cannot be too small because the EV would become negative. Alternatively, we can allow any payoff but note that the points are only convertible up to a limit (e.g., the maximum any student can have is 1e6 points, and then we cap the winnings). That might break the example.

     Alternatively, we can say: the payoff must be in the form of points that are transferable from the offerer to the payer. So the offerer must have enough points to cover the payoff. This prevents astronomical payoffs because no one has that many points. So we can set: the maximum payoff a student can offer is their current point balance. This makes it more realistic.

     So peer round rules:
     - The offerer must have enough points to pay the payoff if they lose (so if they offer a payoff of Y, they must have at least Y points at the time of the offer).
     - The event must be defined in a way that we can check it in class (with a RNG) and the probability must be at least 1 in a number we can simulate (say, N <= 10^12, so p >= 10^-12).
     - The cost X must be at least 1 point and at most the payer's current balance.

     Then, students can choose to accept the offer or not. We can have multiple offers, and each student can accept at most one offer (to prevent them from being wiped out).

  6. **Debrief**:
     - Start by asking students how they felt about the later rounds and the peer round. What made them uncomfortable?
     - Map the game to the theoretical problem:
          a. Unbounded expected utility: If we take the probabilities at face value and the utility of points is linear and unbounded, then we should pay even for the tiniest probability if the payoff is big enough. This is the "shut up and multiply" approach.
          b. Bounded utility: If we bound the utility function (e.g., utility of points is logarithmic or saturates), then the huge payoffs don't add as much expected utility. But note: in our game the points are for a trivial reward, so the utility might be linear for the small stakes but bounded overall? However, if the reward is a snack, then even a trillion points wouldn't buy a trillion snacks (so bounded).
          c. Treating small probabilities as zero: We might set a threshold below which we ignore the probability. But then what threshold? And how to justify it?
          d. Exploitability: In the peer round, if anyone pays even once, then the offerer can come back with an even more extreme offer. So if you pay once, you are vulnerable to being bled dry.

     - Press on their reluctance: Was it a rational objection or social/psychological? Ask: "In the peer round, if you believed the probability as stated, would you have paid? Why didn't you? Was it because you didn't believe the probability? How did you decide when to stop believing?"
     - One round of stating a rule: Ask each student to write down a rule they would use to decide whether to accept an offer (without knowing the exact numbers). Then, present a sequence of offers that breaks their rule. For example, if a student says "I won't accept any offer with probability less than 1e-6", then present an offer with p=1e-6 and a huge payoff (so EV huge) and ask if they would take it. Then present one with p=1e-7 and even bigger payoff (same huge EV). If they say they wouldn't take any offer with a probability less than some threshold, then ask how they set that threshold.

  7. **Failure modes and limits**:
     - Predictable issues:
          a. Students might not take the game seriously: They might pay the 1 point as a joke in the extreme rounds, especially because 1 point is trivial. To mitigate, we can make the cost a bit more substantial (e.g., 10 points) but still small relative to their endowment. Also, emphasize that the points are convertible to something they care about (even if trivial).
          b. Social coordination: The class might coordinate to refuse all offers in the peer round to "beat the system". To mitigate, we can allow offers to be made to individuals privately? But that might be hard in a class setting. Alternatively, we can note that in real life, such coordination is unlikely.
          c. Gaming the points: Some students might try to accumulate points by making offers that are favorable to them (in the peer round) and then never having to pay. That's okay because it illustrates the exploitability: the offerer can set the probability so low that they almost never pay, but the EV for the payer is positive so they should pay. However, if the offerer sets a probability that is too low to be simulated, we disallow it (by our rule: p must be at least 1e-12 and the event must be verifiable).
          d. Muddying the data: One student paying as a joke. We can note that in the debrief and focus on the majority behavior.

     - What the game cannot reproduce:
          a. In the real Pascal's mugging, there is no ledger and no settlement. The mugger just walks away with your money and you never know if the threat was real. In our game, we settle the bets by the RNG, so the probability is verifiable (at least for the peer round, if we use a trusted RNG). But in reality, the probability is not verifiable and might be made up. So the real problem is one of epistemology: how to assign credence to such claims? We are taking the probabilities as given, but in reality, we have to form beliefs about the credibility of the claim.
          b. The game has an endpoint (end of class) and the points are settled. In real life, one might worry about repeated muggings and the long-run consequences.

     We must make clear in the debrief that the real issue is not just the expected utility calculation with given probabilities, but the difficulty of forming reasonable beliefs about the probabilities in the face of outlandish claims. Also, the game assumes linear utility in points, but in reality, the utility of money (or whatever the mugger asks for) might be bounded, and the utility of the claimed payoff might be bounded (e.g., because of limited resources in the universe).

  Detailed Activity Plan:

  **Materials**:
  - Whiteboard or projector for the ledger (initially: 18 students, each with 1000 points).
  - A random number generator (e.g., a computer with random.org or a programming environment that can generate large random integers).
  - Paper tickets for the initial rounds (optional).

  **Procedure**:

  1. **Introduction** (5 minutes):
     - Explain that today we will be playing a game to practice decision making under uncertainty. The points you earn will be converted to a small reward at the end (e.g., 1000 points = one snack, or 100 points = one bonus point on a quiz). The conversion rate will be set so that the rewards are trivial but non-zero.
     - Rules: I will offer a series of lotteries. You can choose to buy a ticket (or not) for the stated cost. If you win, you get the payoff. We will use a random draw to determine the winners.

