          - "I will generate a random integer between 1 and 1000. If it is 1, you win."
          - EV=0.001*10000 - 1 = 10 - 1 = 9 points.
     - Round 4: Cost=1 point, Payoff=10,000,000 points, p=10^-6 (1 in 1,000,000).
          - "Random integer from 1 to 1,000,000. Win if 1."
          - EV=10 points.
