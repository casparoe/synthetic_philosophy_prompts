  **Adjustments for time and practicality**:
  - The initial rounds might take less time if we do group draws. For example, for round 1: all buyers are in, we flip one coin: heads, all win; tails, all lose. But that changes the independence. Alternatively, we can do one draw per round that applies to all buyers (so they all win or all lose). That would be faster and still make the point about the probability. But it reduces the number of independent trials. That's acceptable because we are illustrating the decision, not the law of large numbers.

