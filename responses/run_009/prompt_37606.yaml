answer: |-
  ### Pascal's Mugging In-Class Game: "The Cosmic Lottery"

  #### **Learning Objectives**
  - Confront the tension between expected utility maximization and intuitive resistance to astronomically low-probability/high-payoff offers.
  - Experience how unbounded utility functions can lead to exploitable decisions.
  - Surface epistemic challenges in assigning credence to extraordinary claims.
  - Set the stage for critiques of expected utility theory (e.g., bounded utility, probability thresholds, epistemic humility).

  ---

  ### **Materials**
  1. **Points Ledger**: Whiteboard or digital spreadsheet tracking points for all 18 students.  
     - Starting balance: **1,000 points** each.  
  2. **Randomization Tools**:  
     - Physical: 10-sided die (d10), numbered lottery tickets (1–100), hat for draws.  
     - Digital: Random.org or a custom RNG app for large numbers (up to 10²⁵).  
  3. **Rewards**: Points convert post-game to trivial rewards (e.g., 100 points = 1 snack; 500 points = bonus quiz question).  
  4. **Offer Cards**: For peer round, blank cards to write offers (cost, payoff, probability).  

  ---

  ### **Game Structure** (Total: 75 min)
  #### **Phase 1: Baseline Lotteries** (20 min)  
  *Goal: Establish rational choice norms. Instructor offers lotteries; students maximize EV.*  
  - **Rules**:  
    - Each lottery is optional. Students privately write "YES/NO" on paper and submit.  
    - Wins/losses updated in real-time on the ledger.  
    - Probabilities simulated physically/digitally (transparency builds trust).  

  - **Lottery Sequence**:  
    | Round | Cost (points) | Payoff (points) | Probability | EV (points) | Rationale |  
    |-------|---------------|-----------------|-------------|-------------|----------|  
    | 1     | 10            | 100             | 50% (d10: 1–5 wins) | 40 | Baseline: Clear +EV. |  
    | 2     | 10            | 1,000           | 1% (Draw 1–100: #42 wins) | 0 | EV=0, tests risk neutrality. |  
    | 3     | 10            | 100,000         | 0.1% (Draw 1–1,000: #777 wins) | 90 | EV+ but extreme payoff. |  
    | 4     | 10            | 10⁹ (1B)        | 10⁻⁶ (RNG 1–1M: #1 wins) | 990 | EV+; probability feels abstract. |  
    | 5     | 10            | 10²⁵            | 10⁻²⁰ (RNG 1–10²⁰: #1 wins) | 10⁵ | **Pascal's trigger**: EV = 999,990, but probability is cosmic. |  

  - **Key Instructions**:  
    > "Probabilities are exactly as stated. I’ll simulate draws fairly. Ask if you doubt the mechanism!"  
    > (For Round 5): "This RNG selects a number between 1 and 100 quintillion. If it lands on 1, you win 10 septillion points."  

  - **Expected Behavior**:  
    Rounds 1–3: Near-universal participation.  
    Round 4: Most participate (EV compelling).  
    Round 5: Sharp drop in participation (intuitive discomfort).

  ---

  #### **Phase 2: Peer Mugging Round** (25 min)  
  *Goal: Students experience exploitability by making offers to each other.*  
  - **Rules**:  
    1. Each student may create **one offer** on a card:  
       - **Cost** (X points paid *to them* upfront).  
       - **Payoff** (Y points they *promise to pay* if they lose).  
       - **Probability** (p of payoff; must be ≤10⁻¹² for technical feasibility).  
       - **Credibility Statement**: 1–2 sentences justifying p (e.g., "I’ll RNG 1–1T; win if #1").  
    2. Instructor filters offers: Reject jokes/improbable p (e.g., p<10⁻¹², "I summon aliens").  
    3. **Blind Auction**:  
       - Approved offers posted anonymously.  
       - Students secretly bid "YES" to any offer (multiple allowed).  
       - Ledger deducts costs immediately.  
       - RNG run for all accepted offers; payoffs settled.  

  - **Instructor Script**:  
    > "You’re now both decision-makers *and* muggers. Design an offer others might accept. If your offer is accepted and you lose (payoff triggered), you *must* pay—or lose all points for cheating."  

  - **Preventing Comedy/Chaos**:  
    - **Point Caps**: Payoff ≤ 1M points (ensures liquidity). Cost ≥ 5 points (deters spam).  
    - **No Self-Dealing**: Cannot accept your own offer.  
    - **Anonymity**: Reduces embarrassment/social pressure.  
    - **Example Serious Offer**:  
      > "Cost: 20 points. Payoff: 50,000 points. p=0.0001% (RNG 1–1M: win if #1). I’m trustworthy—we’re in class!"  

  - **Expected Behavior**:  
    - 5–8 serious offers (e.g., p=10⁻⁸, Payoff=500k).  
    - Few acceptances (social distrust dominates EV).  

  ---

  #### **Phase 3: Debrief** (30 min)  
  *Connect game moments to theory; surface discomfort.*  

  1. **Feelings First** (5 min):  
     - Poll: "Show of hands—who bought Round 5? Accepted a peer offer? Why/why not?"  
     - Prompt: "Describe your hesitation in one word." (Expected: "Absurd," "Scam," "Waste").  

  2. **Map Game to Theory** (15 min):  
     - **Unbounded EU & "Shut Up and Multiply"**:  
       > "Round 4: EV=990. You paid 10 for a 1M-to-1 shot. Why stop at Round 5? EU says: *never* stop if payoff ∝ 1/p."  
     - **Bounded Utility**:  
       > "If utility plateases (e.g., log(points)), 10²⁵ points isn’t 10¹⁵ × better than 10¹⁰. But in this game, utility *is* linear (points→snacks). So why hesitate?"  
     - **Probability Thresholds**:  
       > "Did anyone internally set p_min? What if I offered p=10⁻¹⁰⁰, payoff=10¹⁰²? Your p_min ignores EU."  
     - **Exploitability**:  
       > "In peer round, if you paid Alice 10 points for a 1-in-1B shot, could she return with p=10⁻¹⁸, payoff=10²⁰? EU compels you to pay *again*. One payer = infinite mugging."  

  3. **Confronting Reluctance** (5 min):  
     - **Pressure Test**:  
       > "Stand if you’d accept *any* +EV offer, no matter how small p or how large Y. Defend your stance."  
       > → Follow-up: "What if p=10⁻¹⁰⁰⁰, Y=points to buy Earth? Is this rational or insane?"  
     - **Status-Quo vs. Rationality**:  
       > "Was your 'no' in Round 5 a principled objection to EU, or fear of looking gullible? Would you pay if alone?"  

  4. **The Real-World Gap** (5 min):  
     - **Key Limits of the Game**:  
       - **Verification**: "Here, probabilities were enforced by *me* or peers. Real muggers can’t prove p > 0."  
       - **Settlement**: "Points settled at end-of-class. Real muggers vanish; you never learn if p was real."  
       - **Epistemic Nightmare**: "The game assumes p is given. Reality: extraordinary claims (e.g., ‘I control aliens’) *lower* credence. We need priors that punish scale!"  
     - **Bridge to Next Class**:  
       > "Next: Can we formalize distrust? Proposals: Bayesian skepticism, bounded utility, or *avowals* (e.g., ‘I ignore p<ε’)."  

  ---

  ### **Failure Modes & Mitigations**  
  1. **Students "Game" Points**:  
     - *Risk*: Hoard points, reject all offers to "win" snacks.  
     - *Mitigation*: Emphasize: "This is a learning tool. ‘Winning’ = engaging the paradox."  

  2. **Joke Payups**:  
     - *Risk*: Student pays 10 in Round 5 "for laughs," muddying data.  
     - *Mitigation*: Anonymize decisions where possible; poll by paper. Debrief: "Did anyone pay ironically? How did that feel?"  

  3. **Peer Round Comedy**:  
     - *Risk*: Absurd offers (e.g., "p=0.0001, Payoff=∞").  
     - *Mitigation*: Enforce probability justification and payoff caps. Filter rigorously.  

  4. **Social Coordination**:  
     - *Risk*: "No one pay!" pact to "beat the system."  
     - *Mitigation*: Anonymize acceptances. Note in debrief: "Pacts avoid exploitation—but real life lacks coordination."  

  5. **Probability Distrust**:  
     - *Risk*: Students dismiss all low-p offers as "fake," missing the point.  
     - *Mitigation*: Stress: "For today, assume all p are *true*. We’re stress-testing EU, not epistemology."  

  ---

  ### **Instructor Notes**  
  - **Timing**: Stick to 20/25/30 min phases. Use digital tools for quick RNG.  
  - **Tone**: Playfully frame the absurdity ("Intergalactic lottery!") to reduce defensiveness.  
  - **Endgame**: Convert points post-debrief to avoid distraction.  
  - **Follow-Up**: Next lecture: Formalize Pascal’s mugging, introduce bounded utility (e.g., Arrow-Pratt), and explore resolutions.  

  By making the paradox visceral, this game transforms abstract theory into a memorable dilemma—setting up deeper critique while exposing the raw nerves of rational choice.
