  First, I need to break down expressivism and the Frege-Geach problem in simple terms. Expressivism says moral statements are expressions of attitude ("boo stealing!") rather than factual claims. The Frege-Geach problem points out that moral statements embedded in conditionals lose their expressive force, yet the logic still works. The user is drawing an analogy: moral claims in such contexts are like unevaluated functions or dead code branches.

