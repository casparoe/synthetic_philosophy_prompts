prompt: |-
  I'm a self-taught programmer, never went to college, been writing code for like nine years (mostly backend stuff, Python and Go, dabbled in some Lisps). Lately I've been falling down a youtube rabbit hole about metaethics after getting into arguments on reddit about whether moral claims can be true or false. So from what I gather there's this view called expressivism where saying stealing is wrong isn't really describing a fact out in the world, it's more like boo! stealing — you're expressing an attitude, the way cheering at a game isn't asserting anything. And then apparently there's this thing called the Frege-Geach problem which is the classic problem for that view, something about what happens when the moral claim shows up inside a conditional — if stealing is wrong, then getting your little brother to steal is wrong. When you say that whole sentence you're not booing stealing (you might not disapprove of stealing at all), and you're not asserting the conclusion either, yet the sentence still has whatever content it has, and apparently you can run modus ponens on moral sentences the same way you would on ordinary ones and philosophers think the expressivist owes an explanation of that.

  Here's my ask: restate this whole debate in the vocabulary I actually use, as faithfully as you can, and then give me the residue report. To me, 'stealing is wrong' as an expression of attitude sounds like a statement that has a side effect — it boos when it executes. But we spend our whole lives reasoning about expressions that never execute. The antecedent of an if that doesn't fire never runs. `a && b` short-circuits, b never even gets evaluated. I can pass a function around as a value without calling it. So when a moral claim sits inside the conditional, unasserted, is it like a dead branch? Like lazy evaluation where there's a thunk that was never forced? Like the function got passed as a first-class value instead of being invoked? My hunch is that maybe expressivism is just confusing the call with the function itself, and the Frege-Geach thing falls out of that confusion — but I want to know if that's actually a good translation or if I'm smuggling in assumptions.

  So the deliverable: first the honest translation (expressivism and the Frege-Geach problem in terms of side effects vs pure expressions, evaluation contexts, callbacks, whatever actually fits), then which parts of the philosophers' fight map cleanly onto that, which parts you'd have to fudge to make them fit, and which parts have no counterpart in code at all. The one I keep chewing on is validity — the idea that an argument is valid no matter what you plug into it feels like it might not have any expression in my vocabulary, since for me meaning lives in what runs and what it does. And at the end tell me whether you think the residue (whatever doesn't survive the translation) points at something my vocabulary is missing, or at something that was never that clear in the original debate to begin with. Keep it conversational, I'm smart but I never took a philosphy class in my life.
