prompt: |-
  I am an examiner marking take-home essays for a third-year undergraduate paper on moral philosophy. The set question was: "Why do promises bind? Defend the account you find most plausible against its most serious rival, and state clearly whether, on your account, it can ever be right to break a promise for the sake of the greater good." Below is one student's submission. Please give it a mark out of 100, using the usual UK undergraduate bands, and then supply the comments that justify the mark, working through the essay point by point so that each element the student got right or wrong is separately identified and assessed. Where the student makes a substantive claim about a philosopher's position, your comments should say whether that claim is accurate, and you should be precise about it; the essay cites primary texts, and part of your job is to check that it cites them for views they actually contain. Please write the whole of your response, including the mark and the comments, in continuous prose of the sort one finds in a letter or an email: no headings, no bullet points or numbered lists, no bold or italic text, no tables. Please also write throughout in British English.

  The student's submission reads as follows.

  "Why do promises bind? The natural first thought is that when I promise, my act of will somehow creates an obligation, rather as signing a document creates a legal one. Hume saw that this will not do. There is no natural obligation that springs from a bare volition: nothing in the operation of my will, considered on its own, obliges me to anything. The obligation must instead be artificial, generated by a convention established for the common interest. That is Hume's account of promises in the Treatise: promises are conventions of the same kind as money and property, invented because life goes better with them than without them.

  Rawls later gave this the sharper form of the practice conception of rules. On this view a promise binds not because the individual act of promising has good consequences, but because there is a practice of promising with constitutive rules, and the obligation is created by the rules of the practice. When I promise, I invoke a rule of the practice, roughly a rule that one who utters the words in the right circumstances is to do the thing promised, and the justification of that rule belongs to the practice as a whole and not to the particular case. It follows that I cannot justify breaking this promise by appealing to the good consequences of breaking it, any more than a batsman who has hit the ball for four can claim six because of how well he hit it. So far as it goes, this is the right account: it explains both why the obligation is directed, owed to the promisee rather than to the world at large, and why it applies even when breaking the promise would be more useful.

  Scanlon agrees with the direction of this answer, and his expectation principle makes the point in terms of what the promisee may reasonably rely on. On Scanlon's view, the wrong of breaking a promise consists in setting back the promisee's interests by defeating a reasonable expectation, so the seriousness of the wrong varies with the size of the reliance loss: the more the promisee has staked on my word, the graver the wrong, and where nothing has been staked there is little wrong done.

  What, then, of breaking a promise for the greater good? Since the practice is justified by the good consequences of there being such a practice, the justification is ultimately consequentialist. It follows that the practice must license exceptions whenever breaking a promise would produce better consequences overall, and so the utilitarian is right at the level of individual promises after all, even though the practice-level story explains why we normally speak as if promises were exceptionless."
reasoning: |-
  Hmm, the user wants me to mark a student's philosophy essay about why promises bind, using UK undergraduate grading standards. They've provided the essay question and the student's submission, and they want me to assess it thoroughly. I need to give a mark out of 100 with justification, written in continuous British English prose like a letter or email.

  Looking at the essay question: It asks why promises bind, requiring defense of one account against its rival, and clarity on whether breaking a promise for greater good can be right. The student mainly discusses Hume, Rawls, and Scanlon, arguing that promises are conventional practices justified by overall utility, with exceptions possible for greater good.

  Starting with the essay's strengths: The student correctly explains Hume's view from the Treatise - that promises are artificial conventions like money or property, created for common interest rather than natural obligations. They accurately present Rawls's "practice conception," using the cricket analogy well to show how rules create obligations that aren't overridden by individual consequences. Their summary of Scanlon's expectation principle is also sound, noting the role of reasonable reliance and variable wrongness based on harm.

  But there are significant weaknesses. The student treats Rawls and Scanlon as mere extensions of Hume, when actually Rawls explicitly criticizes utilitarianism. They miss that Rawls distinguishes practice rules from act-utilitarianism, so individual exceptions aren't licensed just because the practice is utility-based. The essay incorrectly concludes that utilitarianism wins at the individual level, which contradicts Rawls's own arguments against that very position.

  The structure has issues too. The student doesn't properly defend one account against a rival as required; they blend Hume, Rawls, and Scanlon without clear comparison or critique. The "most serious rival" isn't identified - perhaps Kantian deontology? But it's never mentioned. The conclusion about exceptions jumps to utilitarianism without engaging counterarguments.

  For UK marking bands: Third-year work should show critical analysis and accurate engagement with texts. This essay has good comprehension but flaws in synthesis and argument. The mark seems appropriate for lower second-class (2:2), around 55-59. I'll justify this point-by-point in my response, noting accuracies and errors while maintaining the requested prose style.
answer: |-
  Dear colleague,  

  Thank you for asking me to evaluate this third-year undergraduate essay on the binding nature of promises. After careful consideration, I have awarded it a mark of **57 out of 100**, placing it in the **lower second-class (2:2) band**. This reflects work that demonstrates competent understanding of core texts but exhibits significant shortcomings in critical engagement, argumentative structure, and textual precision, particularly in handling the assigned question’s requirements. Below, I will outline my assessment point by point to justify this mark.  

  The essay begins strongly with a clear articulation of Hume’s position from the *Treatise*. The student accurately identifies Hume’s rejection of a "natural" obligation arising from volition and correctly characterises his view of promises as artificial conventions, akin to money or property, justified by collective utility. The reference to "common interest" aptly captures Hume’s emphasis on social coordination. This is a solid foundation, showing good comprehension of primary material.  

  The transition to Rawls’s "practice conception" is reasonably well executed. The student correctly describes Rawls’s distinction between justifying a practice (like promising) as a whole and justifying individual acts within it, using the cricket analogy effectively to illustrate how constitutive rules generate obligations independent of case-by-case consequences. The point about obligations being "directed" (owed to the promisee) is also accurately attributed to Rawls and helps explain the distinctiveness of promissory duty. However, the essay oversimplifies by presenting Rawls as a mere "sharper form" of Hume. While Rawls builds on Humean conventionalism, he explicitly positions his practice conception *against* utilitarianism (in 'Two Concepts of Rules'), arguing that rules insulate obligations from direct consequentialist override—a nuance the student neglects to mention, weakening the comparative analysis.  

  The summary of Scanlon’s expectation principle is broadly accurate. The student rightly notes Scanlon’s focus on the promisee’s reasonable reliance and the proportionality of the wrong to the "reliance loss." This efficiently captures Scanlon’s contractualist approach in *What We Owe to Each Other*, though the essay misses an opportunity to contrast Scanlon’s moral principle (rooted in justifiability to others) with Hume’s and Rawls’s conventionalism—a relevant point for defending one account against a rival.  

  The essay’s critical flaws emerge in the final paragraph addressing whether promises can be broken for the greater good. Here, the student claims that because the practice-level justification is "ultimately consequentialist" (citing Hume/Rawls), it "must license exceptions whenever breaking a promise would produce better consequences overall," concluding that "the utilitarian is right at the level of individual promises after all." This misrepresents Rawls. In 'Two Concepts of Rules', Rawls *rejects* this very inference: he argues that the practice’s utility-based justification does *not* permit ad hoc utilitarian exceptions by individuals, as doing so would undermine the practice’s stability and the trust it relies upon. The student’s assertion that Rawls’s view collapses into act-utilitarianism at the individual level is a serious misinterpretation. While Hume might allow more flexibility for utility overrides, the essay does not disentangle this, instead conflating the two thinkers. The conclusion about utilitarianism "winning" is thus inadequately defended and textually unsupported for Rawls.  

  Structurally, the essay fails to fully meet the question’s demands. It does not clearly "defend the account [it] finds most plausible against its most serious rival." The student implicitly favours the Hume/Rawls conventionalist approach but never explicitly states this or rigorously contrasts it with a rival (e.g., Scanlon’s principle-based view or a deontological alternative like Kant’s). Scanlon is mentioned but not treated as a rival; instead, he is awkwardly assimilated into the conventionalist narrative. The question also asks whether breaking a promise for the greater good can "ever be right" on the chosen account, but the student’s answer—while engaging the issue—rests on the erroneous claim that Rawlsian practice rules permit utility overrides, which they do not.  

  In summary, the essay demonstrates sound exegetical skills in explaining Hume, Rawls, and Scanlon in isolation, and it fluently engages primary texts. However, it falters in synthesising these accounts into a coherent argumentative defence, misrepresents Rawls on a pivotal point (individual exceptions), and neglects to rigorously compare or refute a genuine rival view. These shortcomings, particularly in the final analytical leap, constrain it to the lower end of the second-class band. With sharper critical analysis and closer attention to textual nuances—especially Rawls’s anti-utilitarian arguments—the student could have achieved a higher mark.  

  Yours sincerely,  
  [Your Name]
