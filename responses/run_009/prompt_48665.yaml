  For examples... The jazz one works but could be tighter. Adding a math or linguistic example would strengthen it. Like how Weierstrass re-carved continuity by noticing variation dimensions Cauchy missed. Or how "mouse" shifted from rodent to computer peripheral through re-carving of function.

