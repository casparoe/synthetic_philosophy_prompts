prompt: |-
  At our monthly rationality meetup the post-talk argument this month was about David Lewis's account of conventions (from his book Convention, the one about coordination equilibria and common knowledge), and I got drafted to referee, which went badly, so now I'm asking you. Quick setup since it matters: on Lewis's view a convention is roughly a regularity everyone conforms to, expects everyone else to conform to, prefers to conform to given others do, where some alternative regularity could have done the same job, and where all this is mutually known in this nested "I know that you know that I know" way. OK, the argument between my two friends, Dana and Ken, went like this:

  (1) Dana's opening move: Lewis basically finished off the normativity question for conventions. Once you see them as equilibria held up by expectations and preferences, there's no leftover ought — what we call the "obligation" to follow a convention is just each person playing best response to everyone else. The ought is an illusion produced by everyone happening to be in equilibrium.

  (2) Ken said this gets it backwards: the expectation-plus-preference structure is precisely what naturalizes the ought instead of explaining it away. Given that everyone drives on the right and expects me to, I have a genuine reason to drive on the right, and reasons are normative. Lewis didn't kill the ought, he gave it a respectable ancestry.

  (3) Dana answered that a reason conditional on your preferences is just prudence relabeled, and pointed at bad conventions like QWERTY — cases where everyone would prefer the alternative but no one can switch unilaterally, so the equilibrium persists even though we'd all be better off without it. Saying people "ought" to conform there seems exactly wrong; you ought to coordinate, not conform to whatever equilibrium history dumped on you.

  (4) Ken said Dana was conflating two questions: whether the convention is good (the arbitrariness condition already concedes it was a coin-flip which regularity won) and whether there's a reason to conform once it's in place — and there is, because defecting unilaterally just imposes coordination costs on everyone else. The convention is arbitrary; the reason to follow it is not.

  (5) Dana's closer: then the ought floats free of anything worth calling justification. Precedent and Schelling-style focal points do all the causal work determining which equilibrium wins, so all this normativity-by-expectation amounts to is path dependence wearing a halo. Plus, Ken's story requires the full common knowledge nesting, and most actual conformists — the ones keeping the convention alive — plausibly can't run that reasoning, so the account seems to miss the phenomenon it was supposed to capture. Ken just said Dana was sneaking in an intuition that oughts must be justified by something external, and that norms that arise from where we happen to be are still norms, like it or not.

  Please adjudicate move by move: who's right about what, where does each of them make their best point and their worst slip, who's more right overall, and is there something both of them are missing? I honestly couldnt tell.
reasoning: |-
  Okay, the user is asking me to adjudicate a complex philosophical debate about David Lewis's convention theory. They've described an argument between two friends, Dana and Ken, regarding whether Lewis's account eliminates or naturalizes the normative "ought" in conventions. 

  First, I need to carefully reconstruct each move in the debate. Dana argues that conventions are merely equilibria without inherent normativity, while Ken maintains that the expectations and preferences create genuine normative reasons. The user wants me to judge each move point by point and determine who's more right overall.

  Hmm... this touches on deep philosophical questions about normativity vs. descriptive accounts of social conventions. I notice Dana makes strong points about path dependence and the potential inefficiency of conventions like QWERTY, while Ken effectively argues that reasons can emerge from situated positions without external justification. 

  The user seems frustrated by their failed attempt to referee this themselves. They're clearly intellectually engaged but overwhelmed by the nuances. I should acknowledge that complexity while providing clear adjudication. 

  Interesting how both debaters have valid perspectives. Dana is right that Lewis's account demystifies conventions, but Ken correctly notes it doesn't eliminate normativity - just relocates it. The common knowledge requirement Dana mentions is a real limitation in Lewis's theory. 

  I should also consider what both might be missing - perhaps the distinction between individual and collective rationality, or how Lewis's framework handles convention shifts. The QWERTY example brilliantly illustrates the tension between stability and optimality. 

  Ultimately Ken's position seems more aligned with Lewis, but Dana raises important critiques about the theory's explanatory power. I'll need to balance textual accuracy with philosophical insight in my response.
answer: |-
  Here's a move-by-move adjudication of Dana and Ken's debate, identifying key strengths, weaknesses, and what might be missing:

  **1. Dana's Opening:**  
  *   **Best Point:** Correctly identifies Lewis's core project: *explaining* convention without needing mysterious normative facts. The "obligation" arises purely from strategic structure (expectations + preferences) leading to mutual best responses. It *is* descriptive of how stability emerges.  
  *   **Worst Slip:** Overstates the case by saying "there's **no** leftover ought." Lewis *does* explain why agents perceive a reason/ought (because there is one relative to their preferences), even if its source is purely strategic. He "finished off" a *particular kind* of normativity (mystical/sui generis), not normativity *simpliciter*.  
  *   **Verdict:** **Mostly Right** on Lewis's intent and the reductionist nature of the account, but **Wrong** in claiming *no* normative dimension remains.

  **2. Ken's Response:**  
  *   **Best Point:** Accurately captures the core of Lewis's *naturalization*. Strategic reasons *are* genuine reasons ("I have a genuine reason to drive on the right"). Lewis doesn't "explain away" the ought; he shows how it *arises* from non-normative ingredients (preferences, beliefs, strategic rationality). The "respectable ancestry" phrasing is apt.  
  *   **Worst Slip:** Doesn't fully engage with Dana's implicit point about the *kind* of normativity Lewis leaves us with (conditional, preference-relative). He assumes "genuine reason" answers Dana's deeper concern about justification.  
  *   **Verdict:** **Right** on Lewis's actual accomplishment. Ken correctly diagnoses Dana's claim as misrepresenting Lewis's project.

  **3. Dana's Counter (QWERTY Example):**  
  *   **Best Point:** Brilliantly highlights the distinction between *stability* and *optimality*. Bad conventions like QWERTY expose the potential *hollowness* of the "ought" derived purely from equilibrium. The strategic "ought to conform" can conflict with the evaluative "ought to have a better system." This challenges Ken's "genuine reason" as potentially normatively inert or even perverse.  
  *   **Worst Slip:** Conflates two distinct "oughts":  
      *   Ought₁ (Strategic/Instrumental): "Given the current equilibrium and my preferences, I ought to conform." (This *does* exist, even for QWERTY - unilateral defection is costly *now*).  
      *   Ought₂ (Evaluative/Optimality): "We ought to be in a *different* equilibrium."  
      Dana argues against Ought₁ by invoking Ought₂, which Lewis's account doesn't claim to ground.  
  *   **Verdict:** **Strong Point** exposing a limitation/ambiguity in Lewis's account regarding the *value* of conventions, but **Weak Execution** by conflating distinct normative questions. The call for coordination *over* conformity is valid but requires collective action, not individual defection.

  **4. Ken's Rejoinder (Arbitrariness vs. Reason):**  
  *   **Best Point:** Crucially separates the *origin* (arbitrary, path-dependent) from the *current reason-giving force*. The coordination costs imposed by unilateral defection create a *real, non-arbitrary reason* to conform *once the convention is established*, regardless of how it originated or its optimality. This is the core of Lewis's naturalized normativity.  
  *   **Worst Slip:** Doesn't adequately address the *normative weight* of Dana's QWERTY concern. While the reason exists, is it a *sufficient* or *overriding* reason? Ken implies it is the primary normative consideration, which Dana challenges.  
  *   **Verdict:** **Right** on the core distinction and the existence of a strategic reason post-establishment. Best move of the debate for defending Lewis's core insight.

  **5. Dana's Closer (Floating Ought & Common Knowledge):**  
  *   **Best Point 1 (Floating Ought):** Raises a profound meta-normative concern. If the "ought" is *entirely* derived from contingent history (path dependence) via precedent/focal points, does it have any justificatory force *beyond* "this is where we ended up"? This questions the *authority* or *bindingness* Ken attributes to the norm.  
  *   **Best Point 2 (Common Knowledge):** Highlights a significant *empirical limitation* of Lewis's highly idealized model. Most people sustain conventions through much simpler mechanisms (habits, imitation, perceived social pressure) without infinite regress of beliefs. Lewis might be modeling the *justification* rather than the *psychology* of conformity.  
  *   **Worst Slip:** Overstates "floating free of anything worth calling justification." The justification *is* the avoidance of coordination failure costs *given the current state*. It's internal to the situation, not external. Ken correctly identifies Dana's bias towards *external* justification.  
  *   **Verdict:** **Strong Critique** exposing potential meta-normative emptiness and psychological implausibility in Lewis's account. **Weak** in dismissing the internal, situational justification entirely.

  **Ken's Final Retort:**  
  *   **Best Point:** Correctly identifies Dana's core objection: a demand for *external* justification ("sneaking in an intuition"). Lewis explicitly argues norms *can* arise from our contingent situation and still be norms. "Norms that arise from where we happen to be are still norms" is essentially Lewis's position.  
  *   **Worst Slip:** Doesn't engage with Dana's powerful points about QWERTY-type cases or the common knowledge requirement.  
  *   **Verdict:** **Accurately Diagnoses** Dana's underlying assumption but **Fails to Counter** Dana's substantive critiques effectively.

  **Overall Adjudication:**

  1.  **On Lewis's Theory:** Ken is **more right**. Lewis's primary goal *was* naturalization, not elimination. He successfully shows how norm-like phenomena (reasons, obligations) emerge from strategic structures and common knowledge. Dana misreads Lewis as eliminating normativity rather than explaining its origin. Ken accurately defends Lewis's core project.
  2.  **On the Nature of the "Ought":** Dana scores crucial points. While Ken is right that a strategic reason *exists*, Dana exposes its potential hollowness (QWERTY), its dependence on contingent history ("path dependence wearing a halo"), and the ambiguity between instrumental and evaluative "oughts." The "ought" Lewis naturalizes is thinner and more conditional than Ken sometimes implies.
  3.  **On Limitations:** Dana's critiques of the common knowledge requirement and the potential disconnect between stability and optimality are **valid and important limitations** of Lewis's model that Ken doesn't adequately address.

  **What Both Might Be Missing:**

  *   **The Role of Sanctions:** Lewis downplays explicit sanctions, focusing on expectations and preferences. In real life, social disapproval or formal penalties often reinforce conventions, blending strategic and genuinely normative elements.
  *   **Normative Internalization:** People often follow conventions not *just* because of calculated strategic reasons (fear of coordination costs), but because they internalize them as "the right thing to do." Lewis's account might explain the *origin* of this feeling, but not necessarily its later phenomenological strength or potential independence.
  *   **Dynamic Change:** Both focus on stability. Lewis's framework struggles to elegantly explain *how* inefficient conventions change, beyond vague notions of "salience" or collective action. The tension Dana highlights (Ought₁ vs. Ought₂) is key here.
  *   **Levels of Description:** Lewis provides a *functional* explanation of conventions. Dana seems to want a *justificatory* theory. Ken defends the functional explanation *as* providing justification (relative to preferences/context). This fundamental difference in aims fuels the debate.

  **Conclusion:** Ken wins on accurately representing Lewis's core project of naturalizing convention-based norms. Dana wins on exposing the limitations and potential normative thinness of the resulting "ought," the problematic nature of bad equilibria, and the psychological implausibility of the common knowledge requirement. The most productive synthesis recognizes Lewis's achievement in explaining how normative force *emerges* from strategic interaction, while acknowledging Dana's point that this force can be fragile, contingent, and sometimes misaligned with our broader evaluative judgments. The "ought" is real within the system, but the system itself might be suboptimal, and its justification is purely internal and situational.
