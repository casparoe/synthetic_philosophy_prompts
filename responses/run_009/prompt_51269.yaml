answer: |-
  ### Procedure: Evaluating Introspective Reports  
  **Purpose**: To quickly assess the reliability of user feedback by categorizing it along two axes—**temporal context** (concurrent vs. retrospective) and **level of inference** (low vs. high)—while flagging high-risk confabulation factors. Outputs are **Green** (trustworthy for intended purpose) or **Red** (treat only as a statement of belief/social narrative, not evidence of cause/behavior).  

  #### Step-by-Step Questions (for a 20-Minute Debrief)  
  1. **Temporal Context Check**  
     - **Question**: *Was this report given* during *the experience (e.g., think-aloud) or* after *it (e.g., post-task interview, exit survey)?*  
     - **Assessment**:  
       - **Concurrent** (during): Lower risk. Proceed to Q2.  
       - **Retrospective** (after): Higher risk. Note time gap:  
         - Seconds/minutes → Moderate risk.  
         - Hours/days/weeks → High risk. Proceed to Q2.  

  2. **Inference Level Check**  
     - **Question**: *Is the report describing* what occurred/felt like *(e.g., "I couldn’t read the label") or* why it occurred/what it means *(e.g., "I left because of price")?*  
     - **Assessment**:  
       - **Low-inference** (description of sensory/emotional state): More trustworthy. Proceed to Q3.  
       - **High-inference** (attribution of cause/meaning): High risk. Proceed to Q3.  

  3. **Confabulation Risk Factors**  
     - **Question 3a**: *Was the person explicitly asked for a "why" or cause?*  
       - Yes → High risk (prompts invented explanations).  
       - No → Lower risk.  
     - **Question 3b**: *Is the explanation socially conventional/flattering (e.g., "price," "time-saving")?*  
       - Yes → High risk (culturally scripted answers).  
       - No → Lower risk.  
     - **Question 3c**: *Does the report conflict with observed behavior/data?*  
       - Yes → High risk (confabulation likely).  
       - No → Proceed to output.  

  #### Output Decision Rules  
  - **Green** (Trustworthy):  
    - **Concurrent + Low-inference** (e.g., "I’m stuck on this screen").  
    - **Retrospective + Low-inference + Time gap <1 hour + No cause asked** (e.g., "I felt frustrated earlier").  
  - **Red** (Unreliable for cause/behavior):  
    - **Any High-inference report** (e.g., "I did X because Y").  
    - **Retrospective + Time gap >1 hour**.  
    - **Any report with ≥1 confabulation risk factor** (cause asked, conventional explanation, or behavioral conflict).  
  - **Termination**: Stop at first **Red** flag. If none, output **Green**.  

  #### Honest Judgment Calls  
  - **Social desirability** (Q3b) and **behavioral conflict** (Q3c) require researcher judgment. No procedure can eliminate subjectivity here—flag these as "context-dependent."  

  ---

  ### Application to Your Cases  
  #### (a) Churn Interviews: "8/11 clinics cited price"  
  - **Procedure**:  
    1. **Temporal**: Retrospective (weeks/months gap). → **High risk**.  
    2. **Inference**: High-inference (attribution: "cancelled because of price"). → **Red flag**.  
    3. **Confabulation Factors**:  
       - Cause explicitly asked ("Why did you cancel?"). → **Red flag**.  
       - "Price" is socially conventional (blameless, acceptable). → **Red flag**.  
  - **Output**: **Red**.  
    - **Conclusion**: Unreliable for explaining true cause of churn. Treat as "what clinics are prepared to say" (e.g., price is a safe narrative). Do not use in board decks as evidence. **This is the unenjoyable output—it invalidates your most-quoted finding**.  

  #### (b) Usability Tests: "6/8 users said the triage screen was confusing"  
  - **Procedure**:  
    1. **Temporal**: Retrospective (post-task, but likely <30-minute gap). → Moderate risk.  
    2. **Inference**: Low-inference (description: "confusing"). → Lower risk.  
    3. **Confabulation Factors**:  
       - Cause not asked (if question was "What was confusing?" not "Why?"). → Lower risk.  
       - Conflicts with behavior (times/errors improved). → **Red flag**.  
  - **Output**: **Red** (due to behavioral conflict).  
    - **Conclusion**: Unreliable for assessing usability. The report captures users’ *perception* of confusion (maybe due to novelty), but behavioral data says the design works. Trust the metrics.  

  #### (c) Feature Proposal: "Clinic managers assure they’d use it weekly"  
  - **Procedure**:  
    1. **Temporal**: Retrospective (gap unclear, but likely long). → High risk.  
    2. **Inference**: High-inference (prediction/attribution: "I would use it because..."). → **Red flag**.  
    3. **Confabulation Factors**:  
       - Cause asked (implied: "Would you use this?" prompts justification). → **Red flag**.  
       - "Efficiency" is socially desirable. → **Red flag**.  
  - **Output**: **Red**.  
    - **Conclusion**: Unreliable for prioritization. Self-predictions are notoriously inaccurate (e.g., "intention-action gap"). Demand behavioral evidence (e.g., pilot usage data).  

  ---

  ### What the Procedure Cannot Do  
  1. **Cannot Grade**:  
     - **Future predictions** (e.g., "I will use this").  
     - **Reports about others** (e.g., "Nurses find it hard").  
     - **Opinions without introspection** (e.g., "This color is ugly").  
     - **Emotional/sensory reports with ambiguous inference** (e.g., "I hated it" – needs context).  
  2. **Cannot Answer**:  
     - **Why a behavior *actually* occurred** (only whether the *report* is reliable).  
     - **Objective truth** (e.g., "Was price *really* the reason?").  
     - **Group-level trends** (e.g., "Do *most* users feel this way?" – needs stats).  

  ---

  ### Arguing to Leadership  
  - **For VP**: Position the procedure as a **data hygiene tool**, not a dismissal of user voices:  
    > "This flags high-risk self-reports so we *triangulate* them with behavioral data (e.g., usage logs, A/B tests). For example, in churn interviews, price was cited—but we should cross-check with pricing experiments or win/loss analysis. It strengthens our insights by adding rigor."  
  - **Leverage her preferences**:  
    - "It reconciles subjective reports with *instrument data* (e.g., task times in usability tests)."  
    - "It prevents costly mistakes (e.g., building unused features)."  
  - **Mitigate "discarding data" concerns**:  
    > "Red outputs aren’t discarded—they’re *recontextualized*. E.g., churn reports show price is a *negotiation narrative*, so we’ll probe deeper with competitive pricing benchmarks."  

  **Final Tip**: Pilot this on 2–3 past studies to demonstrate value. Start with case (b)—usability tests—where behavioral data provides a clear "hook" for the VP.
