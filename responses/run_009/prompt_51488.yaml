  The user emphasized avoiding any questions that directly ask about temporal parts or being "wholly present." That makes sense because it would test reading rather than genuine beliefs. Each scenario must be understandable to students with only intro metaphysics, like basic modality and maybe encountering the Ship of Theseus before.

  I need to design questions that cover the logical space. For the bent poker, options should include whether it's the same object with time-indexed properties or different objects. Fission needs options on identity: both successors, neither, or one being the original. Tibbles involves counting cats with and without a hair. Ship of Theseus should have gradual replacement options, including sorites-like vagueness. Time-travel needs clarity on whether the younger self is a full separate person or part of a whole. The rotating disc tests intrinsic change vs. relational properties.

  Scoring is crucial. The user wants patterns mapped to theories, but honestly flag where distinctions are blurry. For instance, worm and stage theories might overlap except on counting and time-travel. Also, note if some answer combinations don't fit any theory—label them "unnamed" and explain why they might be incoherent or unexplored.

  Deep needs: The user wants to reveal students' pre-theoretical intuitions, spark engagement by confronting them with puzzles before lectures, and facilitate deeper discussion when theories are introduced. They might also want to highlight how common-sense views map onto complex theories, showing where intuitions diverge and why philosophers developed specific concepts. Ensuring the quiz is accessible yet discriminative is key. Avoiding bias in wording so answers reflect genuine beliefs, not leading questions. The scoring key should be transparent about limitations, helping the user explain later why certain theories handle some cases better.
answer: |-
  Here’s a metaphysics persistence quiz designed to surface pre-theoretic intuitions, followed by a scoring key that maps patterns to major theories (and flags limitations). All questions use concrete cases and plain-language answers.

  ---

  **Metaphysics Quiz: Objects Through Time**  
  *(Answer based on your intuitive judgment of each scenario.)*

  1.  **The Poker:**  
      A solid iron poker is perfectly straight on Monday. On Tuesday, it is forcibly bent into a 90-degree angle and remains that way.  
      *Is there one single object that was straight on Monday and is bent on Tuesday?*  
      A. Yes, it's the same poker, but "straight" and "bent" describe how it was *at different times*.  
      B. No. The straight Monday-poker stopped existing when it was bent. The bent Tuesday-poker is a different object.  
      C. It's the same poker, but its properties changing like this is puzzling and maybe contradictory.  

  2.  **Amoeba Split:**  
      A single amoeba, "Amy," lives in a pond. One day, Amy splits perfectly into two new amoebas, "Bee" and "Cee." Neither Bee nor Cee is noticeably larger or special.  
      *Which one is the original Amy?*  
      A. Bee is Amy.  
      B. Cee is Amy.  
      C. Both Bee and Cee together are what Amy became.  
      D. Neither Bee nor Cee is Amy. Amy ceased to exist when she split.  

  3.  **Tibbles on the Mat:**  
      Tibbles, a fluffy cat, is sleeping on a mat. Consider *all* the matter making up Tibbles right now (fur, bones, organs, etc.). Now consider a slightly smaller collection: *all that matter except one single hair from her tail*.  
      *How many distinct, living cats are located exactly where Tibbles is sleeping?*  
      A. Only one cat (Tibbles). The smaller lump is just part of a cat or some cat-stuff, not a cat itself.  
      B. Two cats. Tibbles is one cat, and the hairless lump is a different, slightly smaller cat lying exactly underneath her.  
      C. Many, many cats (one for every slightly different collection of parts).  

  4.  **The Ship Renewal (Part 1 - Identity):**  
      Theseus sails his ship, the *Argo*, on a long voyage. Each week, one old, worn plank is removed and replaced with a new, identical plank. The old planks are stored in a warehouse. After 10 years, every single original plank has been replaced. The reassembled original planks in the warehouse also make a complete ship.  
      *Which ship is the original Argo that Theseus first sailed?*  
      A. The ship Theseus is still sailing (made of new planks).  
      B. The ship in the warehouse (made of the old planks).  
      C. Neither ship is the original Argo; it ceased to exist gradually during the replacements.  
      D. It's genuinely unclear; there might not be a definite answer.  

  5.  **The Ship Renewal (Part 2 - Cutoff):**  
      (Same scenario as #4).  
      *If you think the sailing ship stops being the Argo at some point, when does that happen?*  
      A. There is a specific point (e.g., after 50% planks replaced) where it suddenly stops being the Argo.  
      B. It gradually becomes less and less the Argo, but there's no sharp cutoff; it's vague where the Argo stops.  
      C. It remains the Argo throughout the entire process. (Choose this even if you picked A or B in #4).  
      D. N/A (I think it was always the Argo OR ceased immediately OR chose "unclear" in #4). *(Note: This filters for those who see a transition)*  

  6.  **Time-Travel Handshake:**  
      You invent a time machine. You step into it today (Tuesday) and travel back to exactly this room 24 hours ago (Monday). You see your Monday-self sitting at the desk. You walk over and shake hands with your Monday-self.  
      *When you shake hands on Monday, how many distinct, full-fledged persons (complete humans) are in the room?*  
      A. One person (the Monday-self). The Tuesday-self is just a future stage or part of that one person.  
      B. Two persons. The original Monday-self and the visiting Tuesday-self, who are distinct people.  
      C. Two persons, but the Tuesday-self is *made from* the Monday-self; one came from the other.  

  7.  **Time-Travel Identity:**  
      (Same scenario as #6).  
      *What is the standing of the person you (Tuesday-self) are shaking hands with?*  
      A. It's me, just as I was yesterday.  
      B. It's a distinct person who is *exactly like* I was yesterday.  
      C. It's an earlier temporal part or stage of me.  

  8.  **The Rotating Disc:**  
      Imagine a perfectly uniform, featureless grey disc (like a smooth stone coin). It is completely symmetrical and homogeneous – no marks, bumps, or differences at all. The disc is spinning smoothly in place.  
      *Is the disc changing as it spins?*  
      A. No. It's just rotating; the disc itself is the same, nothing about *it* is different, only its orientation relative to the room.  
      B. Yes. Different parts of the disc are occupying different locations in space at different times; it *is* undergoing real change.  
      C. It depends on perspective; fundamentally it's the same disc, but its relation to space changes.  

  9.  **Fission - Person Edition:**  
      A scientist, Dr. Eva, invokes a "fission" process. Her entire body and brain are scanned perfectly and duplicated. The original Dr. Eva is simultaneously vaporized. Two exact physical duplicates, "Eva-Prime" and "Eva-Second," wake up in adjacent labs, each with all of Dr. Eva's memories up to the scan.  
      *What happened to the original Dr. Eva?*  
      A. Dr. Eva ceased to exist when she was vaporized. Eva-Prime and Eva-Second are new people.  
      B. Dr. Eva survives as *both* Eva-Prime and Eva-Second. They are both her.  
      C. Dr. Eva survives as *one* of them (maybe Eva-Prime, maybe Eva-Second), but we can't tell which.  
      D. Dr. Eva survives, but now *is* the pair Eva-Prime and Eva-Second together.  

  10. **The Reassembled Poker:**  
      (Recall the bent poker from Q1). On Wednesday, the bent poker is completely disassembled into its individual iron atoms. On Thursday, those *exact same atoms* are meticulously reassembled into a perfectly straight poker, identical to the original Monday-poker.  
      *Is the reassembled Thursday-poker the same object as the original Monday-poker?*  
      A. Yes, absolutely. It's the same atoms arranged the same way.  
      B. No. The original poker was destroyed when bent or disassembled. This is a replica.  
      C. It's the same as the *bent* Tuesday-poker, reassembled straight.  
      D. It's a new poker made from the original matter.

  ---

  **Scoring Key & Theory Mapping:**

  *   **Goal:** Identify patterns suggesting **Endurantism** (objects are wholly present at each time, persist by being strictly identical over time, properties are time-indexed), **Perdurantism/"Worm View"** (objects are 4D spacetime worms, persisting by having temporal parts), or **Stage Theory** (only temporal stages/slices exist fundamentally; persistence is a matter of counterpart relations between stages). Honesty flag: Worm and Stage often agree *except* on Counting and Time-Travel Identity.
  *   **Method:** Look for clusters. No single answer is definitive. Key discriminators are marked **(!)**.

  | Question | Typical Endurantist Answer | Typical Perdurantist (Worm) Answer | Typical Stage Theorist Answer | Notes/Flags |
  | :------- | :------------------------- | :--------------------------------- | :----------------------------- | :---------- |
  | **1. Poker (Identity)** | A (Same object, properties time-rel) | A or C (C shows tension) | A or C | Endurantists strongly favor A. Others *can* say A, but less comfortably. C is tension, not a theory. |
  | **2. Amoeba (Fission)** | D (Neither, Amy gone) *or* C (Both, collective) | B (Survives as both) | B (Survives as both) | **(!)** Endurantists often deny survival or say collective. Worm/Stage say both survive. |
  | **3. Tibbles (Counting)** | A (One cat, lump not a cat) | B (Two cats) | C (Many cats) *or* sometimes B | **(!)** Major discriminator. Endurantists reject coincident objects. Worm accepts them. Stage often accepts even more. |
  | **4. Ship (Identity)** | A (Sailing ship) *or* C/D (Ceased/Vague) | A (Sailing ship) | A (Sailing ship) | Worm/Stage see continuity of temporal parts. Endurantists split (A=loose identity, C/D=strict identity). |
  | **5. Ship (Cutoff)** | A (Sharp cutoff) *or* B (Vague) | C (Always same) | C (Always same) | Endurantists opting for C in #4 choose C here. Those choosing A/B in #4 choose A or B here. Worm/Stage firmly C. |
  | **6. Time-Travel (Number)** | B (Two persons) | A (One person) | B (Two persons) | **(!)** Crucial discriminator Worm vs Stage. Worm sees one 4D person present twice. Stage sees two distinct stages (persons). Endurantists see two distinct wholly present persons. |
  | **7. Time-Travel (Identity)** | A (It's me yesterday) | C (Earlier temporal part) | B (Distinct counterpart) *or* C | **(!)** Reinforces Q6. Endurantist: Strict identity (A). Worm: Temporal part (C). Stage: Counterpart (B) or sometimes part-talk (C). |
  | **8. Rotating Disc** | A (No change, just relation) | B (Real change) | B (Real change) | Endurantists deny intrinsic change here (A). Worm/Stage see change in part-locations (B). C is ambiguous. |
  | **9. Person Fission** | A (Gone) *or* C (One, but unknown) | B (Both) | B (Both) | Similar to Amoeba. Endurantists struggle (A/C). Worm/Stage accept survival as both (B). |
  | **10. Reassembled Poker** | B (Replica, not same) *or* D (New poker) | A (Same - same atoms) | A (Same - counterpart?) *or* B | Endurantists (esp strict) see destruction (B/D). Worm sees reassembly of same matter (A). Stage may see counterpart (A) or new stage (B). |

  **Mapping Clusters:**

  *   **Endurantist Pattern:** Favors 1A, 2D/C, **3A**, 4C/D/A (if A, then likely 5A/B), **6B**, **7A**, 8A, 9A/C, 10B/D. *Core:* Denies coincident objects (3A), sees distinct persons in time travel (6B, 7A), often denies survival through radical change/fission (2D/C, 9A/C, 10B/D), sees rotation as relational (8A).
  *   **Perdurantist/Worm Pattern:** Favors 1A/C, **2B**, **3B**, 4A, **5C**, **6A**, **7C**, 8B, **9B**, 10A. *Core:* Accepts coincident objects (3B), sees fission survival (2B, 9B), sees one 4D entity in time travel (6A, 7C), gradual change unproblematic (4A, 5C), rotation involves change (8B), reassembly restores object via matter (10A).
  *   **Stage Theory Pattern:** Favors 1A/C, **2B**, **3C** (or B), 4A, **5C**, **6B**, **7B** (or C), 8B, **9B**, 10A or B. *Core:* Strongly favors fission survival (2B, 9B), often maximal coincidence/many objects (3C), sees distinct stages/persons in time travel (6B, 7B), gradual change unproblematic (4A, 5C), rotation involves change (8B). *Crucial Difference from Worm:* **6B & 7B** (Two distinct persons/counterparts in time travel).

  **"Unnamed" Patterns & Limitations:**

  1.  **Consistent "Ceased to Exist" (2D, 4C, 9A, 10B):** Suggests a very strict, perhaps mereological essentialist, form of Endurantism where *any* part change or discontinuity destroys the object. Coherent but often seen as unattractive due to denying obvious persistence (e.g., surviving a haircut). Might align with some "No Entity Without Identity" views.
  2.  **Consistent "Vague/Unclear" (4D, 5B):** Suggests a view embracing ontological vagueness or epistemicism about identity over time. Coherent and explored (e.g., some supervaluationist or epistemicist accounts of persistence).
  3.  **"Many Cats" + "Two Persons in TT" (3C + 6B/7B):** Strongly points to Stage Theory.
  4.  **"Two Cats" + "One Person in TT" (3B + 6A/7C):** Strongly points to Perdurantism/Worm View.
  5.  **Limitations Flagged:**
      *   **Worm vs. Stage:** The quiz *can* distinguish them clearly via the **Time-Travel (Q6 & Q7)** and **Counting (Q3)** questions. Worm says 1 person in TT (6A), Stage says 2 persons (6B). Worm typically says 2 cats (3B), Stage often says many (3C). Without these, mapping would be much harder.
      *   **Endurantist Variation:** Endurantists can vary significantly on the Ship (4/5) and Fission (2/9) cases depending on how "loose" their identity conditions are. The cluster around 3A, 6B, 7A is the strongest indicator.
      *   **Poker (Q1):** Answers A and C don't cleanly separate theories; it mainly surfaces whether the student feels tension about change (C) or is happy with time-indexing (A). Endurantists *must* pick A. Others can pick A or feel tension (C).
      *   **Reassembled Poker (Q10):** While Endurantists typically say B/D and Worm says A, Stage can go either way, making it less diagnostic.

  This quiz prioritizes surfacing intuitions on core puzzles over perfectly clean theory sorting. The discrepancies revealed in class discussion (especially between Worm and Stage on time-travel!) will be powerful teaching moments when introducing the formal views. Good luck!
