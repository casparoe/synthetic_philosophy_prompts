answer: |-
  **OFFICIAL RULES: "SYMMETRY SEEKER'S SUPREME DISTRIBUTION" (THE "DRAW")**

  **1. Eligibility:**  
  Open only to natural persons, being Her Majesty's subjects of sound mind and demonstrable capacity for recursive, counterfactual reasoning ("Entrants"). Entrants must possess an innate understanding of Nash Equilibria in non-cooperative games and should ideally have considered the likely cognitive processes of all other potential Entrants prior to submission. Proof of having solved the Prisoner’s Dilemma under conditions of perfect common knowledge may be requested.

  **2. The Prize:**  
  A fund of One Million United States Dollars (USD $1,000,000.00) (the "Prize Fund") shall be constituted. The Prize Fund shall be divided *equally* amongst *all* valid entries received by the Closing Date (as defined below). Each valid entry represents an equal, undivided share in the Prize Fund. The resultant monetary value per entry is defined as (Prize Fund) ÷ (Total Valid Entries).

  **3. Entry Mechanism:**  
  Entrants may submit entries via the Official Entry Form (available monthly within "Symmetry Seeker" magazine). There is *no* stipulated maximum limit to the number of entries any single Entrant may submit. Entrants are strongly encouraged to contemplate the implications of Section 2 and the principle of dominance in decision theory when determining their submission volume. Entries must be received by the last day of each calendar month (the "Closing Date").

  **4. Assumption of Symmetrical Reasoning:**  
  It is a fundamental presupposition of this Draw that all Entrants will engage in identical, optimal reasoning processes concerning entry submission volume, grounded solely in the structure of the Prize as defined in Section 2 and the absence of entry limits. Each Entrant is notionally indistinguishable from every other Entrant in terms of cognitive capacity and access to relevant information concerning the Draw's parameters. The Promoter relies upon this inherent symmetry for the equitable functioning of the Prize distribution.

  **5. Procedure Upon Suspected Asymmetry:**  
  Should an Entrant harbour reasonable suspicion that one or more other Entrants are *not* reasoning in accordance with the symmetrical ideal presupposed in Section 4 (e.g., contemplating submission of multiple entries based on perceived individual advantage without regard for collective dilution), the concerned Entrant is obliged to:  
  5.1. Re-examine their own potential submission strategy through the lens of iterated strict dominance;  
  5.2. Consider that their suspicion itself constitutes an asymmetry, potentially invalidating their own ideal reasoning status;  
  5.2.1. Should the contemplation in 5.2 induce cognitive dissonance, the Entrant is advised to meditate upon the concept of common knowledge until equilibrium is restored;  
  5.3. *Refrain* from adjusting their planned entry volume based on this suspicion, as such adjustment would further violate the symmetry principle and exacerbate the very problem identified.

  **6. Anti-Spam Appeal:**  
  While no technical limitation on entry volume is imposed, Entrants are reminded that the utility derived from submitting an entry is intrinsically linked to the *expected* value defined in Section 2. Submitting an excessive volume of entries, *when considered from the perspective of the identical reasoner all Entrants are assumed to be*, yields no net benefit and imposes unnecessary transaction costs (postage, time). Ergo, the rational, symmetrical Entrant, acknowledging their indistinguishability, would submit *one* entry. Entrants are implored to act in accordance with this universally optimal, singular strategy.

  **7. Determination of Winners & Prize Distribution:**  
  Following the Closing Date, the Promoter will calculate the Total Valid Entries. The Prize Fund will be divided by this number to determine the Value Per Entry. Each valid entry will entitle the submitting Entrant to a payment equal to the Value Per Entry. Payment shall be made via cheque or electronic transfer to the Entrant associated with each winning entry.  
  7.1. In the event of the unforeseen multiplicity of submissions leading to a Value Per Entry calculated as less than the cost of postage for a single entry form, the Promoter reserves the right to distribute the Prize Fund as a single, symbolic cheque made payable to "The Disappointed Collective".

  **8. Dispute Resolution:**  
  Any dispute arising from the interpretation or execution of these Rules shall be referred to binding arbitration before a panel of three (3) Professor Emeriti in Game Theory.  
  8.1. The arbitration panel shall base its ruling *solely* on the hypothetical outcome that *would* have obtained had all Entrants adhered strictly to the symmetrical reasoning model outlined in Section 4 and the optimal strategy implied in Section 6.  
  8.2. Evidence pertaining to actual entry volumes or alleged asymmetrical reasoning shall be deemed irrelevant and inadmissible, as it pertains to a manifestly suboptimal, non-idealised world state.

  **9. Liability:**  
  The Promoter, its agents, affiliates, and the publishers of "Symmetry Seeker" magazine, shall not be held liable for:  
  9.1. Any financial loss incurred by Entrants related to the cost of submitting entries, particularly where the Value Per Entry falls below said costs;  
  9.2. The inherent mathematical inevitability that, under conditions of unrestricted entry and individual rationality, the Value Per Entry will tend asymptotically towards zero as the number of Entrants or entries per Entrant increases;  
  9.3. Any emotional distress, existential angst, or profound disillusionment arising from an Entrant's realisation of the fundamental conflict between individual incentive and collective optimality, or from the observable failure of other Entrants to embody the superrational ideal presupposed herein;  
  9.4. The unavoidable outcome wherein the Prize Fund, upon division, yields sums potentially below the threshold of financial materiality or psychological satisfaction, regardless of the initial headline figure.  
  9.5. Consequences stemming from the quantum decoherence of the shared reasoning field assumed in Section 4.

  **Promoter:** Symmetry Seekers Ltd. (Registered in England No. 12345678). Void where prohibited by law, common sense, or the observable laws of human nature. Closing Date: Last day of each month. Full rules at www.symmetryseeker.co.uk/rules (Prepare for recursive disappointment).
