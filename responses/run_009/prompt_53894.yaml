prompt: |-
  Everyone treats the 2016 Brexit referendum as a case study in populism or direct democracy or lying buses, but I want to look at it through the boundary problem in democratic theory — the question of who counts as "the people" before you can even say the people have decided. Map the episode properly first: the franchise for the referendum was basically the Westminster one, so British, Irish and Commonwealth citizens resident in the UK could vote, plus Brits living abroad for under 15 years, plus Gibraltar — but most EU citizens living in the UK couldn't, and neither could 16 and 17 year olds (even though the Scottish independence referendum two years earlier had let them vote). So an Australian on a working holiday could vote on whether a Polish nurse's future in Britain, while the nurse couldn't. With that mapping in place, run the main answers to the boundary problem over the actual franchise: the all-subjected principle, the all-affected or stakeholder principle, and whatever other candidate you think is strongest. For each, say which bits of the real franchise it vindicates, which bits it condemns, and which bits it can't even see — I'd genuinely like to know if any principle can explain why Irish citizens were in but Romanian ones weren't, other than as pure historical residue.

  Then the harder direction, which is what I actually care about. The boundary problem is supposed to be circular: you can't democratically decide who the demos is, because the body doing the deciding already presupposes a boundary. So what does the referendum do to that circularity? It didn't create a demos, it assumed one — and then the result immediately re-opened the question, since Scotland voted Remain and straightaway started asking whether it's part of this demos at all, and the 3 million EU citizens and 1 million odd Brits abroad found out they'd been affected-but-not-counted all along. Does Brexit confirm the boundary problem is a genuine instability at the heart of democratic legitimacy, or does it show that in practice democracies just muddle through on inherited franchises and it never really bites? Be honest about where the theory is silent and don't force an answer — "the demos is whatever the franchise happens to be" is a real position, but I want to know if it's a defensible one or just resignation dressed up.
reasoning: |-
  Okay, the user wants to explore the Brexit referendum through the lens of the boundary problem in democratic theory. Let me start by recalling what the boundary problem entails. It's about defining "the people" before any democratic decision can be made. The user provided a detailed mapping of the franchise used in the Brexit referendum: British, Irish, Commonwealth citizens in the UK, Brits abroad under 15 years, Gibraltar residents, but excluding most EU citizens and 16-17-year-olds. The example given is an Australian on a working holiday voting while a Polish nurse couldn't. 

  First, I need to apply the main principles of the boundary problem to this franchise. The all-subjected principle suggests that those subject to the laws should vote. So UK residents like the Polish nurse should be included, which highlights the exclusion of EU citizens. Commonwealth citizens living elsewhere but able to vote would be condemned under this principle since they aren't subject to UK laws. 

  Next, the all-affected principle. Brexit's effects were global, so this principle would include a vast number of people, like EU citizens in the UK and Brits abroad. But the referendum didn't include them, showing a mismatch. The principle would condemn the exclusions but also question inclusions like non-resident Commonwealth voters who aren't as affected. 

  Then there's the citizenship principle, which relies on existing legal definitions. This explains why Irish citizens were included (due to historical agreements) and Romanians weren't. It's more descriptive but doesn't address normative issues. 

  The user is also interested in whether Brexit confirms the circularity of the boundary problem. The referendum assumed a demos based on the Westminster franchise, but the result reopened debates, especially in Scotland and among excluded groups. This highlights the instability. However, the fact that the UK proceeded without resolving this suggests democracies muddle through with inherited systems. 

  The user might be a student or researcher in political theory, looking for a nuanced analysis rather than a definitive answer. Their deeper need is to understand if democratic theory can address such real-world complexities or if it's inherently flawed. They might also be interested in whether practical compromises undermine democratic legitimacy. 

  I should ensure each principle's application is clear, pointing out contradictions and unresolved issues. The conclusion should balance theoretical instability with practical resilience, acknowledging that while the boundary problem exposes legitimacy gaps, democracies often rely on historical contingencies without collapsing. Highlighting where theory is silent, like the Irish inclusion, is crucial. Emphasizing that "muddling through" is a pragmatic approach but leaves normative questions unanswered would address the user's request for honesty about the theory's limitations.
answer: |-
  Your framing brilliantly exposes the core tension. Let's map the actual franchise against key democratic boundary principles, then confront the circularity exposed by Brexit:

  **I. Mapping Principles onto the Actual Franchise:**

  1.  **The All-Subjected Principle:**
      *   **Core Idea:** Those subject to the binding authority of the laws/decisions made should have a say in making them.
      *   **Vindicates:** UK-resident British/Irish/Commonwealth citizens, *Gibraltarians* (subject to UK Parliament sovereignty). UK-resident EU citizens arguably subjected to the immediate consequences of Brexit on residency/work rights.
      *   **Condemns:** *Crucially*:
          *   The exclusion of **UK-resident EU citizens** (like the Polish nurse) – they were directly subjected to the decision's consequences on their lives.
          *   The exclusion of **16/17-year-olds** – subject to UK law like adults.
      *   **Blind Spots/Inconsistencies:**
          *   **Commonwealth citizens resident *outside* the UK:** Not currently subject to UK daily lawmaking authority. The principle struggles to explain their inclusion.
          *   **Brits abroad >15 years:** Similarly, less directly subjected to UK law than resident EU citizens. Their inclusion contradicts the core logic applied to EU residents.
          *   *Gibraltar:* Inclusion is justified (subjected), but highlights the *geographic* limit of the principle applied here.
      *   **Irish vs. Romanian?** Cannot explain it normatively. It's purely historical residue (Common Travel Area, pre-EU agreements) embedded in the Westminster franchise. The subjected principle would demand *either* include all resident non-citizens *or* exclude non-citizens consistently. The hybrid fails.

  2.  **The All-Affected/Stakeholder Principle:**
      *   **Core Idea:** All whose interests are significantly affected by a decision should have a say. Broader than "subjected."
      *   **Vindicates:** The inclusion of *Gibraltarians* (hugely affected). *Potentially* justifies Brits abroad <15yrs (affected by consular services, pensions, future return).
      *   **Condemns:** *Massively*:
          *   Exclusion of **UK-resident EU citizens** (profoundly affected on residency, work, family life).
          *   Exclusion of **long-term Brits abroad** (>15yrs) still affected (e.g., pensions, property rights, identity).
          *   Exclusion of **16/17-year-olds** (whose future in the UK/EU was most affected).
          *   Exclusion of **citizens of other EU states** (whose economies/politics were affected).
          *   Exclusion of **Northern Irish citizens** (affected uniquely by the Good Friday Agreement implications – though they *could* vote as UK/Irish citizens).
      *   **Blind Spots/Inconsistencies:**
          *   **The Franchise is Far Too Narrow:** This principle logically demands inclusion far beyond the actual franchise – potentially millions across Europe and globally. The referendum franchise is indefensibly small under this view.
          *   **Commonwealth citizens resident outside UK:** Why are they included if similarly affected non-Commonwealth non-residents are not? Again, historical residue, not normative consistency.
          *   **The Problem of Degree:** How *much* affected is enough? The principle is radically expansive and administratively impractical for a referendum.
      *   **Irish vs. Romanian?** Cannot explain it. Both are EU citizens resident in the UK, equally affected. The distinction is purely legalistic/historical (Commonwealth legacy + CTA), violating the principle's focus on *stake*.

  3.  **The Citizenship Principle (The Strongest *Descriptive* Candidate):**
      *   **Core Idea:** The demos is defined by formal citizenship of the state making the decision. Simpler, administrable, aligns with state sovereignty.
      *   **Vindicates:** Inclusion of British citizens (resident and abroad <15yrs). Exclusion of EU citizens (like Romanians) and young teenagers (not full citizens).
      *   **Condemns:** Inclusion of *Irish citizens* (non-UK citizens) and *Commonwealth citizens* (non-UK citizens). Exclusion of **long-term Brits abroad** (>15yrs) – they *are* citizens.
      *   **Blind Spots/Inconsistencies:**
          *   **The Irish/Commonwealth Exception:** This is the fatal flaw for using it as a *normative* justification for *this specific franchise*. It explains *why* Irish and Commonwealth citizens were included (historical agreements embedded in UK electoral law), but it highlights the principle's *contingency* and lack of pure "citizenship" logic. It's "citizenship+" (UK + special categories).
          *   **Gibraltar:** Gibraltarians are British Overseas Territory citizens (BOTC), not full UK citizens, yet included. Another exception.
      *   **Irish vs. Romanian?** **This is the only principle that *describes* the reason, but doesn't *justify* it normatively.** It explains it as "historical residue" codified into the inherited Westminster franchise: Ireland (CTA), Commonwealth (historical ties & old imperial voting rights), Gibraltar (specific constitutional link). It's not a philosophical justification; it's an acceptance of existing legal definitions. Romanians lack this historical/legal status.

  **II. Confronting the Circularity: What Brexit Reveals**

  Brexit is a stark case study exposing the boundary problem's vicious circle and its practical consequences:

  1.  **The Assumed (not Created) Demos:** You're absolutely right. The referendum didn't *define* "the people"; it *presupposed* a demos based on the **inherited Westminster parliamentary franchise**. This franchise itself is the product of centuries of historical accident, imperial legacy, and political compromise, *not* a clean application of any single democratic principle.
  2.  **Re-Opening the Question:** The result immediately shattered the illusion of a stable, uncontested demos:
      *   **Scotland:** Voting Remain and demanding a new independence referendum explicitly challenged the *boundaries* of the demos that just decided. It screamed: "We are not part of *this* 'people'."
      *   **Excluded Groups:** EU citizens and long-term Brits abroad became visible examples of the "affected-but-not-counted," highlighting the franchise's arbitrary nature *precisely because* the decision impacted them so profoundly. The nurse *was* subjected/affected, but excluded by the historical franchise.
      *   **Northern Ireland:** The border question and threats to the Good Friday Agreement exposed how even *within* the franchise, sub-groups felt the decision illegitimately overrode their specific interests and constitutional status.
  3.  **Confirming the Instability:** Brexit powerfully **confirms the boundary problem as a genuine instability at the heart of democratic legitimacy**.
      *   **Legitimacy Deficit:** The exclusion of profoundly affected/stakeholder groups (EU residents, young people) based on historical categories, while including less affected groups (non-resident Commonwealth citizens), created a significant legitimacy deficit *for those excluded* and observers applying normative principles.
      *   **Contestation is Inherent:** The result didn't settle the issue; it amplified contestation over the *very unit* that had decided. Democracy didn't resolve the boundary question; it exposed its unresolved nature.
      *   **The Circularity Laid Bare:** The existing demos (defined by historical franchise) decided something that immediately caused a significant portion *within* that demos (Scotland) and those *excluded but affected* to question the legitimacy and very existence of *that* demos. The circle remained unbroken and visibly tense.
  4.  **Muddling Through? The Pragmatic Reality:** However, Brexit *also* shows that **democracies can, messily and often unjustly, muddle through on inherited franchises.**
      *   **The Machine Kept Running:** Despite the instability and contestation, the UK government proceeded with Brexit based on the referendum result and the authority of the existing parliamentary demos. No constitutional crisis *prevented* action based on the inherited franchise.
      *   **"The Franchise is Whatever It Is":** In practice, the operational answer *was* largely "the demos is whoever the existing franchise says it is." This *is* a real position – **legal positivism** or **conventionalism** applied to the demos. It prioritizes stability, administrability, and existing legal order over perfect normative justification.
      *   **Is it Defensible or Resignation?** It's **primarily resignation dressed up as pragmatism,** but pragmatism has force.
          *   **Defensible?** Only weakly, on grounds of stability and avoiding infinite regress ("We have to start somewhere, and this is where history has left us"). It avoids the paralysis of constantly redrawing boundaries before every decision.
          *   **Resignation?** Yes, because it fails to address the core normative deficiencies exposed by Brexit (why *this* arbitrary line?). It accepts historical power relations and exclusions as the baseline. It offers no principled answer to the Polish nurse or the Scot questioning their place in the union. It essentially says, "This is the rule, even if it's not perfectly fair."
      *   **Where Theory is Silent:** Democratic theory struggles mightily with the *origin* of the demos. It excels at arguing principles *within* a presupposed unit but offers no clean, non-circular, universally agreed method for defining that unit in the first place. The Brexit franchise's specific inclusions/exclusions (Irish/Commonwealth) are **inexplicable by pure principle**; they are **only describable by history and convention.** Theory is silent on *why those specific conventions should bind normatively today*, beyond inertia.

  **Conclusion: Instability Revealed, Muddling Through Observed**

  Brexit confirms the boundary problem is a fundamental, unresolved instability. The circularity was brutally exposed: the assumed demos made a decision that immediately fractured its own perceived unity and highlighted the arbitrary exclusion of the affected. This created a tangible legitimacy crisis for significant groups.

  However, it *also* demonstrated the pragmatic reality that democracies often function – however imperfectly and unjustly – by relying on inherited, historically contingent franchises ("the demos is whatever the franchise happens to be"). This "muddling through" is defensible only as a pragmatic necessity to avoid paralysis, not as a satisfying normative justification. It's resignation to historical contingency, not a solution to the boundary problem. The instability doesn't necessarily cause collapse, but it continuously erodes legitimacy and fuels contestation, as Brexit vividly illustrates. The Polish nurse and the Scottish independence supporter are living testaments to the problem's enduring, biting reality.
