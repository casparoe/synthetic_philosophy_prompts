  Okay, the user has been in a metaethics reading group for over a year, diving deep into expressivism and the Frege-Geach problem. They understand the technical aspects—like how negation and conditionals pose problems for expressivists because moral sentences seem to express attitudes rather than propositions that can embed logically. They've read Blackburn, Gibbard, and Schroeder's attempts to solve it, but they're confused about why the debate feels stalled. Despite proposed solutions, critics keep arguing that expressivism either collapses into cognitivism or fails in some embedding context. Dreier's creeping minimalism adds another layer, suggesting that once expressivists use deflationary truth, their view becomes indistinguishable from minimal realism.

  The user's main question is whether Frege-Geach is just a proxy for deeper disagreements in moral psychology, like motivational internalism (whether moral judgments inherently motivate) versus the Humean belief-desire model. They want to know why the debate hasn't moved forward—is it semantic quibbling, a clash of intuitions, or something else? And they're asking for an honest diagnosis: is this resolvable, or are we stuck in a loop?

  First, I need to validate their understanding. They clearly grasp the technical issues and the history of responses. Their frustration is palpable—they've seen "solutions" from big names, but the counterarguments recycle. That suggests the problem isn't technical but conceptual or foundational. 

  The user hints at a key insight: maybe Frege-Geach isn't the core issue but a symptom of the tension between expressivism's psychological claim (moral judgments are conative) and the semantics needed for logic. If that's true, the debate stalls because both sides are talking past each other—expressivists prioritize moral psychology, while critics demand semantic parity with descriptive language. 

  Dreier's creeping minimalism is crucial here. If expressivists adopt deflationary truth and propositions, their view blurs with minimal cognitivism. That raises a meta-question: what's left to argue about? The user is spot-on to suspect the real divide is about the direction of explanation. Expressivists want moral semantics to bottom out in psychology (e.g., disapproval), while cognitivists see moral properties as part of the world, with beliefs tracking them. 

  The user also asks if Schroeder's formal solution should have ended the debate. Its lack of traction suggests the objection isn't just about logic—it's about whether his "being for" analysis smuggles in propositional content. Critics likely see it as a clever trick that doesn't address the deeper worry: that expressivism, when fully semanticized, loses its anti-realist edge. 

  For diagnosis, I'd argue the stall is *methodological*: expressivists and cognitivists value different things. Expressivists care about explaining moral motivation and the "queerness" of moral facts; cognitivists care about uniform semantics. Neither side can "win" because they're defending different intuitions—e.g., "Why is logic even a problem if moral sentences aren't truth-apt?" versus "Logic must work the same everywhere." 

  Progress might require zooming out. Instead of tweaking semantics, we could ask: what would a successful expressivist theory *look like*? If it must mimic cognitivism to handle logic, does that defeat its purpose? Or can expressivists reframe the goal—e.g., maybe logic doesn't need propositions but attitude-coordination rules (though critics will still demand more). 

  Honestly? This might be unresolvable. The core clash—over whether moral thought is fundamentally conative or cognitive—is philosophical bedrock. It's like free will compatibilism vs. incompatibilism: technical fixes don't sway people because the disagreement is about starting assumptions. The debate will likely keep looping, with each "solution" revealing new fault lines. But that's not futile—it sharpens what's at stake. Maybe the user's takeaway is that metaethics needs to grapple more openly with these divides instead of hoping semantics alone will settle them.
answer: |-
  Your frustration is spot-on – the Frege-Geach (FG) debate *feels* stalled because it *is* stalled, and for deep structural reasons. It's not just a hard problem; it's arguably become the wrong battleground, masking the real disagreement. Here's a diagnosis of the stall, why it happened, and what it might take to move forward:

  **The Core Problem: Two Disagreements Under One Name (Semantics vs. Moral Psychology)**

  You nailed it. The fundamental issue is that the FG "problem" isn't a single problem. It's the collision point of two distinct commitments:

  1.  **The Core Expressivist Thesis (Moral Psychology):** Moral judgments are *conative states* (disapproval, commitment to norms, plans) – not cognitive beliefs about objective moral facts. This is driven by motivations like explaining moral motivation (internalism), avoiding metaphysical queerness, and capturing the practical nature of ethics.
  2.  **The Demands of Compositional Semantics & Logic:** Language works compositionally. Sentences embedded in logical contexts (negation, conditionals, disjunctions) contribute systematically to the meaning and truth-conditions (or validity-conditions) of the complex sentences they appear in. Logic requires stable, proposition-like *contents* that can stand in logical relations.

  **Expressivism's Project:** Explain (2) *solely in terms of* (1). How can disapproval (or planning, etc.) be negated? How can disapproval be the antecedent of a conditional? How can complex sentences express complex attitudes built systematically from simpler ones?

  **Why the Stall Happened:**

  1.  **The Solutions "Succeed" Technically but Undermine the Motivations:** This is the crux.
      *   **Blackburn (Quasi-Realism):** Offered sophisticated higher-order attitudes. Result: It *works* for many cases, but the attitudes become incredibly complex ("boo to stealing" vs. "hooray to not booing stealing?"), and the resulting "propositional surface" starts looking suspiciously like the real thing it was meant to avoid. The *psychological* story becomes baroque to mimic the *semantic* structure.
      *   **Gibbard (Norm-Expressivism/Planning):** Provides a robust, compositional semantics where moral sentences express properties of world-norm pairs (plans). Result: It handles logic beautifully! But... moral sentences now have *genuine propositional content* (even if relativized to norms/plans). The *psychological* state (planning) is now *about* these contents. This looks remarkably like a *sophisticated form of cognitivism* where the content is plan-laden. The pure "expression without content" vibe is gone.
      *   **Schroeder ("Being For"):** Offers a technically brilliant, uniform compositional semantics reducing "wrong" to "being for blaming for". Result: Logic works! But... "being for" is deliberately designed to *behave exactly like a propositional attitude operator*. The entire semantics is built to generate propositional-looking outputs. Critics scream: "You've just *defined* a propositional content ('that one is for blaming for stealing')! This *is* cognitivism about a peculiar psychological property ('being for')!" The core expressivist ambition – explaining logic purely in terms of non-representational conative states – seems abandoned in favor of *constructing* representational content out of those states.

  2.  **Creeping Minimalism (Dreier) is the Logical Conclusion:** If Gibbard and Schroeder get you propositional contents, *and* expressivists happily endorse deflationary truth ("'Stealing is wrong' is true iff stealing is wrong") and deflationary belief ("Judging that stealing is wrong is believing that stealing is wrong"), then what, *exactly*, distinguishes their view from a minimalist moral realism? Both agree:
      *   Moral sentences express propositions.
      *   Moral sentences can be true/false (deflationarily).
      *   We have moral beliefs (deflationarily).
      *   Logic works normally.
      The *only* difference left is the *metaphysical explanation* of *what makes* the proposition true (mind-independent facts vs. facts about our attitudes/plans/norms). But this difference has been pushed *way downstream* from the semantics and logic, which were the original battleground. FG becomes irrelevant to *this* debate.

  3.  **The Proxy War is Exhausted:** The fight over FG became a fight about whether expressivists could build a semantic engine robust enough to handle logic *while still satisfying the critics that it wasn't just cognitivism in disguise*. But the critics' demand ("Prove it's not just cognitivism!") is arguably *unmeetable* by design. Any solution robust enough to satisfy the semantic/logical demands *will*, by necessity, introduce structures that *look* propositional and compositional. The expressivist insists these structures are ultimately grounded in conative states; the cognitivist insists these structures *are* the propositional contents they appear to be. This is a stalemate over *interpretation* of the formal machinery, not a refutation of the machinery itself.

  **Diagnosing the Stall:**

  *   **Verbal?** Partly, but not trivially. It's a **conceptual/methodological stalemate**. Expressivists and their critics prioritize different things:
      *   **Expressivists:** Start with the *moral psychology* and try to build semantics up from it. Success = a semantics that *can be explained as an implementation of* the core conative states.
      *   **Critics:** Start with the *demands of semantics/logic*. Success = a semantics indistinguishable in its logical behavior from standard propositional semantics. They see any solution meeting this demand as *ipso facto* adopting cognitivism.
  *   **Two Questions Under One Heading?** Absolutely. FG exposed the tension, but the solutions revealed the depth of the split. The **substantive disagreement is the priority and nature of the core explanandum**: Is the fundamental thing to explain the *distinctive practical psychology* of moral judgment (expressivism's starting point), or the *representational and logical structure* of moral language/thought (cognitivism's starting point)? FG became the semantic battlefield for this deeper conflict.
  *   **Fight Over Starting Intuitions?** Yes. Critics have the strong intuition that logic *must* work uniformly across domains and requires uniform propositional contents. Expressivists have the strong intuition that moral thought *must* be fundamentally practical/conative in a way descriptive thought is not. Neither intuition is easily dislodged by formal results, because those results are interpreted through the lens of the prior intuition.

  **What Would Count as Progress (Is it Resolvable)?**

  1.  **Shifting the Battlefield:** Acknowledge that FG *as originally conceived* (can expressivism handle logic?) has been "solved" in the sense that sophisticated formal models exist. The real debate needs to move to:
      *   **The Nature of the Attitude/Object:** Is Schroeder's "being for" a legitimate *sui generis* conative state, or just belief in disguise? Is Gibbard's planning state sufficiently non-cognitive? This is pure philosophy of mind/psychology applied to the moral domain.
      *   **Internalism vs. Humean Psychology:** Can expressivism *really* deliver on internalism (motivation internal to judgment) without the bespoke states looking ad hoc? Or is the Humean (belief + desire) model more parsimonious and general? This requires engaging directly with empirical psychology and philosophy of mind *beyond* ethics.
      *   **Explanatory Priority:** Does the conative state *explain* the semantic content, or is the semantic content explanatorily prior? Expressivists need a compelling story about why grounding semantics in conative states provides a *better overall explanation* of moral thought and talk than cognitivism + independent desires, especially given the semantic convergence.
      *   **Creeping Minimalism's Challenge:** Can expressivists articulate a *substantive* difference between their view and minimalist realism *that matters*, beyond just the grounding story? Does the grounding story have downstream consequences the expressivist cares about (e.g., for moral disagreement, objectivity, epistemology) that minimal realism lacks?

  2.  **Is it Resolvable?** Unlikely to be *conclusively* resolved in a way that satisfies everyone. The core intuitions (uniform semantics vs. distinctive moral psychology) are foundational. **However, it can progress:**
      *   **Clarification:** The debate is now much clearer. We know FG was a proxy. We know the solutions generate propositional-looking outputs. The disagreement is now explicitly about the metaphysics of mind and meaning, and the direction of explanation.
      *   **Refinement:** Expressivist models can become more psychologically plausible or integrated with general cognitive science. Cognitivists can refine their accounts of moral motivation to meet expressivist concerns without abandoning belief-desire psychology.
      *   **New Angles:** Focusing on specific embedding contexts that are particularly troublesome, or on non-linguistic moral reasoning, or on developmental psychology might yield new insights, though likely feeding back into the core disagreement.
      *   **Accepting Convergence:** Maybe the most honest outcome is acknowledging that sophisticated expressivism and sophisticated non-naturalist realism/minimalism end up looking remarkably similar *at the semantic level*, and the real action is elsewhere (metaphysics, epistemology, phenomenology of moral experience).

  **Your Key Insight:** You're exactly right. The debate stalled because the FG "problem" was the flashpoint where the *semantic consequences* of the core *psychological thesis* became undeniable and difficult. The proposed semantic solutions "worked" but only by making the psychological states do such sophisticated semantic work that they started resembling the cognitive states they were meant to replace. The lack of decisive victory for Schroeder et al. tells us that the critics' objection was never *just* about validity; it was always a deeper skepticism that a purely conative state *could* ground the full representational and logical structure of thought without collapsing into, or becoming indistinguishable from, cognitivism. The stall is the sound of two fundamentally different philosophical starting points grinding against each other, with semantic logic as the anvil. Progress now means moving the fight off the anvil and onto the ground each side actually cares about defending.
