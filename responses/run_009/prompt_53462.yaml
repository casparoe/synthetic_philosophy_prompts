answer: |-
  ## Villanelle: The Frege-Geach Gambit  
  (*For the Expressivist*)

  **Lying is wrong.** That much I can avow,  
  A stance projected, feeling's outward trace.  
  **If lying is wrong, then confess it now.**  

  To judge the fib, the heart must disallow,  
  Yet logic asks: what fills this empty space?  
  **Lying is wrong.** That much I can avow.  

  Suppose you speak: "This falsehood stirs no row,"  
  I counter: "Think! There's danger to embrace:  
  **If lying is wrong, then confess it now.**  

  For truth must bind: from *if* to *then* we plow,  
  The inference drawn demands a common base.  
  **Lying is wrong.** That much I can avow.  

  In complex webs where moral doubts accrue,  
  "Perhaps it's right?" – that thought brings dark disgrace  
  **If lying is wrong, then confess it now.**  

  Expressivist, the cost is plain to view:  
  That simple shape, in every shifting case,  
  **Lying is wrong.** That much I can avow.  
  **If lying is wrong, then confess it now.**  
  The selfsame core must hold, or all's askew.

  ---

  **What the poem is doing:**

  1.  **Leveraging Form:** The villanelle structure forces the literal repetition of the two refrains ("Lying is wrong" and "If lying is wrong, then confess it now") in different argumentative contexts (simple assertion, modus ponens premise, moral dilemma). This directly mirrors the Frege-Gach problem's core: how can a moral expression like "Lying is wrong" mean the *same thing* when used flatly to express disapproval and when embedded in a conditional like "If lying is wrong..." where it seems to function as a truth-evaluable proposition enabling inference?
  2.  **Showing the Expressivist Cost:** The poem tracks the expressivist's struggle ("the cost is plain to view"). They must account for the "selfsame core" ("That simple shape") across all uses without collapsing into a descriptivist realism about moral facts. The final couplet explicitly "owns" the requirement for univocal meaning ("The selfsame core must hold").
  3.  **Liberties Taken:**
      *   It simplifies the expressivist toolkit. Modern quasi-realists like Blackburn *do* provide complex accounts (e.g., higher-order attitudes) to explain embedding. The poem presents the problem starkly without detailing these solutions, focusing on the *prima facie* challenge and the commitment needed.
      *   It personifies the claim ("That simple shape") and the expressivist position slightly, dramatizing the philosophical tension rather than presenting a neutral argument. The "cost" is framed as a burden the expressivist knowingly bears.
      *   The specific inference ("If lying is wrong, then confess it now") is a plausible moral application but isn't the classic modus ponens example. It highlights the practical reasoning pressure.

  This villanelle uses its rigid structure to embody the core puzzle, pushing the expressivist to affirm meaning's constancy despite the expressive shift, demanding an account that justifies the final couplet's insistence.
