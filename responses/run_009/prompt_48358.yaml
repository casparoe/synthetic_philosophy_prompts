answer: |-
  Below is a draft of the diagnostic quiz designed to help readers identify their alignment with the Nash, Kalai–Smorodinsky, egalitarian, or utilitarian bargaining solutions through concrete cases. Each question presents a scenario where the solutions meaningfully diverge, with answer options that highlight axiomatic commitments. The scoring key maps answer patterns to solutions and flags inconsistent or underdefined preferences.

  ---

  ### **Diagnostic Quiz: Which Bargaining Solution Do You Accept?**
  For each question, select the answer that best reflects your intuition about a fair outcome. Assume a standard two-person bargaining problem (convex feasible set, disagreement point, utilities comparable only up to affine transformations unless noted).

  #### **Question 1: Symmetry in Equal Standing**  
  *Alice and Bob, both equally skilled musicians, negotiate revenue shares from joint gigs. The feasible set is symmetric: they can achieve up to $100 each, with the Pareto frontier a straight line from (Alice: 0, Bob: 100) to (Alice: 100, Bob: 0). Disagreement gives (0, 0). Must they split equally?*  
  - **A. Yes, their symmetry justifies a 50-50 split.**  
  - **B. No, symmetry doesn’t require equal payoffs here.**  

  #### **Question 2: Disagreement Point’s Influence**  
  *Renée can credibly walk away to a solo career (utility 50), while Carlos has no outside option (utility 0). Without agreement, both get 0. With agreement, they can achieve any split summing to 100 (e.g., (50,50) or (100,0)). An impartial arbitrator previously awarded (50,50) when both had no outside options. Now, with Renée’s better threat, what is fair?*  
  - **A. Renée should get more than 50; her outside option matters.**  
  - **B. The outcome should stay (50,50); only the feasible set matters.**  

  #### **Question 3: Utilitarian vs. Egalitarian (Interpersonal Comparability Granted)**  
  *A cake is split between Ada and Ben. Ada gets 1 util per slice, Ben gets 2 utils per slice. The cake has 1 slice. What division is fairest?*  
  - **A. Equal utilities: Ada gets 2/3, Ben gets 1/3 (utils: Ada ≈ 0.67, Ben ≈ 0.67).**  
  - **B. Maximum total utility: Ben gets the whole cake (utils: Ada 0, Ben 2).**  

  #### **Question 4: Independence of Irrelevant Alternatives (IIA)**  
  *In a feasible set T1 (convex hull of (0,0), (0,100), (100,0)), arbitration yields (50,50). Later, T1 is found to be unattainable; only a subset T2 (convex hull of (0,0), (0,100), (50,50)) is feasible, which includes (50,50). What should replace the original award?*  
  - **A. (50,50)—it was fairly chosen and remains feasible.**  
  - **B. Re-arbitrate; the new set might demand a different outcome.**  

  #### **Question 5: Individual Monotonicity**  
  *Jay and Kay split a resource. Initially, if Jay gets all, his utility is 1; Kay’s utility is proportional. They agree on (0.5, 0.5). Later, Jay’s potential boosts: if he gets all, utility is now 2 (Kay’s is unchanged). The feasible set expands from a line between (0,1) and (1,0) to (0,1) and (2,0). Should Jay’s new award be at least 0.5?*  
  - **A. Yes—Jay’s improved prospects shouldn’t leave him worse off.**  
  - **B. Not necessarily; the new geometry might justify less for Jay.**  

  #### **Question 6: Affine Transformation Invariance**  
  *Using utils, a mediator awards (40, 60) to Pia and Quinn. Later, Pia reveals her "utils" are inflated: her true utility is half what she reported (e.g., her true utility at (40,60) is 20, not 40). The feasible set and disagreement point are scaled down for Pia. Should the physical agreement (e.g., money split) change?*  
  - **A. No—only utility representations changed, not the bargain’s substance.**  
  - **B. Yes—the new utilities might require a new solution.**  

  #### **Question 7: Egalitarian in Asymmetry (Interpersonal Comparability Granted)**  
  *Ravi and Sana face a feasible set: Ravi can get up to 2 units of utility, Sana up to 4, but not both (Pareto frontier: line from (0,4) to (2,0)). What is fairest?*  
  - **A. Equal utilities: (1.2, 1.2) (Ravi ≈ 1.2, Sana ≈ 1.2).**  
  - **B. Maximum total utility: (0,4) (Ravi 0, Sana 4).**  

  #### **Question 8: Utilitarian Under Risk**  
  *Lena and Mo allocate a vaccine dose. Lena has a 10% risk of severe illness; Mo has 50%. If used, the dose gives 10 utility (prevents illness) and is assigned to one person. Without interpersonal comparability, what is fair?*  
  - **A. Maximize expected utility: assign to Mo (utility gain 10 vs. Lena’s 1).**  
  - **B. Equalize chances: toss a fair coin to assign it (expected utility 5.5 each).**  

  ---

  ### **Scoring Key**
  Map your answers (A/B) to the questions (1–8) to identify your bargaining solution. Solutions are defined by their axioms:  
  - **Nash (N)**: Symmetry, affine invariance, IIA, but not individual monotonicity.  
  - **Kalai–Smorodinsky (KS)**: Symmetry, affine invariance, individual monotonicity, but not IIA.  
  - **Egalitarian (E)**: Equal utilities when comparable; may violate affine invariance and IIA.  
  - **Utilitarian (U)**: Total utility maximization; may violate affine invariance and IIA.  

  #### **Clear Matches**  
  - **Nash**: 1A, 2A, 4A, 5B, 6A.  
    *(Commits to IIA over individual monotonicity.)*  
  - **KS**: 1A, 2A, 4B, 5A, 6A.  
    *(Commits to individual monotonicity over IIA.)*  
  - **Egalitarian**: 1A or 1B, 3A, 6B, 7A.  
    *(Prioritizes equal gains/comparable utilities; symmetry optional.)*  
  - **Utilitarian**: 1A or 1B, 3B, 6B, 7B.  
    *(Prioritizes efficiency; symmetry optional.)*  

  #### **Inconsistent/Underdefined Combinations**  
  - **1B, 2A, 6A, 4A/4B, 5A/5B**  
    *(Rejects symmetry but accepts other axioms. Genuinely incoherent—no solution relaxes only symmetry. Possible match: Asymmetric Nash or weighted solutions.)*  
  - **2B, 1A/1B, 6A/6B**  
    *(Rejects the disagreement point’s relevance. Unattractive—walks away from core bargaining theory. Suggests egalitarian/utilitarian leanings but underspecified.)*  
  - **6B, 1A, 2A, 4A, 5A (or similar)**  
    *(Rejects affine invariance but accepts symmetry/IIA/monotonicity. Underexplored: May align with proportional solutions like the *Kalai* (1977) solution.)*  

  #### **Unresolved Ambiguities**  
  - The quiz does not reliably separate **egalitarian/utilitarian** when interpersonal comparability is granted (Questions 3, 7, 8). Answers to 3 and 7 determine this.  
  - **Nash and KS** are cleanly separated by IIA (Q4) vs. individual monotonicity (Q5).  
  - **Q8** distinguishes utilitarian from egalitarian under risk; egalitarians may prefer B, utilitarians A.

  ---

  This quiz forces readers to confront tradeoffs (e.g., IIA vs. monotonicity, symmetry vs. comparability). Inconsistent answers highlight gaps in axiomatic reasoning or openness to niche solutions (e.g., Kalai’s proportional solution for affine-sensitive egalitarians). By focusing on cases, it avoids jargon while revealing foundational commitments.
