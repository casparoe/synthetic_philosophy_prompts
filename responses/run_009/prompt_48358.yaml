   Question 1: Symmetry.
     Setting: Two farmers, Alice and Bob, live on identical plots of land and have the same opportunities. They are considering a agreement to cooperate, and the set of possible utility pairs from cooperation is symmetric: the best they can achieve together is to each get 100, and the set is convex and symmetric. The disagreement point is (0,0) for both. 
     Should the solution be that each gets 50? 
     Options: 
        A. Yes, because symmetry is fundamental.
        B. No, symmetry shouldn't necessarily dictate the outcome.

   This tests the symmetry axiom. Nash, KS, and if we interpersonal comparability, utilitarian and egalitarian in a symmetric set would be (50,50). So if they choose B, they are not following any of these.

   Question 2: Disagreement point mattering.
     Setting: Two roommates are splitting rent. In Scenario A, if they can't agree, they both have to move back with their parents, which they both equally dislike (utility 0 for both). In Scenario B, everything is the same except that Alice has a outside option: she can move in with a friend, getting utility 10 (on the same scale), while Bob would still have to move back to his parents (utility 0). The feasible set of utility pairs from agreement is the same in both scenarios: they can achieve any split of the total utility of 20 (so, for example, (0,20) or (20,0) or (10,10) are feasible). 
     In Scenario A, the solution is (10,10) (symmetric). In Scenario B, should the solution change because of Alice's better outside option?
     Options:
        A. Yes, Alice's outside option is better, so she should get more than 10.
        B. No, the outside option should not matter; the solution should still be (10,10).

   For Scenario B, the disagreement point is (10,0). The feasible set is the line from (0,20) to (20,0) (assuming utilities are such that the set is convex). The individually rational set is from (10,0) to (20,0) and then to (0,20) only if (0,20) is above (10,0)? But (0,20) has utility for Alice=0<10, so not individually rational. The individually rational set is the part where Alice>=10 and Bob>=0. So on the line from (10,10) to (20,0) [because at (10,10) and (20,0), and the line between]. The Nash solution for Scenario B: maximize (u1-10)*u2, with u1+u2=20, so (u1-10)*(20-u1). Maximize at u1=15, u2=5. 
     So should change to (15,5). 
     If they choose A, they are for using the disagreement point. If they choose B, they think it shouldn't matter.

   Question 3: Utilitarian vs. egalitarian (interpersonal comparability granted).
     Setting: A cake is to be divided between Alice and Bob. Their utilities are linear in cake and are comparable. Alice values the cake at 1 util per unit, and Bob at 2 utils per unit. The cake is of size 1.
     What is the fair division?
     Options:
        A. Split the cake equally: Alice 0.5, Bob 0.5. Then utilities: Alice 0.5, Bob 1.0.
        B. Give the cake to Bob: Alice 0, Bob 2.0 (because this maximizes the total utility).
     This tests: egalitarian (A) or utilitarian (B). The egalitarian in terms of utility would be to equalize utilities, but here if we split equally, utilities are (0.5,1.0) -> not equal. To equalize utilities, we would need to give more to Alice. But the options are only these two.

   Alternatively, we can change the story. If the cake is size 1, and Alice gets x, Bob gets 1-x.
     Alice's utility: x, Bob's: 2(1-x).
     Egalitarian: set x = 2(1-x) -> x=2/3, so Alice gets 2/3, Bob 1/3. Utilities (2/3, 2/3).
     Utilitarian: maximize x + 2(1-x) = 2-x, so x=0, utilities (0,2).

   So options:
     A. (2/3, 2/3)
     B. (0,2)

