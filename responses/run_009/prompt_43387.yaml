answer: |-
  ### Mapping the Case onto Reference Theory  
  **Core tension:** Does the IAU vote reveal a hidden essence of "planet" (vindicating causal-historical theory) or stipulate a new convention (vindicating descriptivism)?  

  #### 1. **Causal-Historical Mapping (Putnam/Kripke):**  
     - **Parallel to natural kinds:** Like "water = H₂O," dynamical dominance (orbital clearing) could be a *necessary a posteriori* essence. Pluto’s exclusion isn’t a meaning change but a discovery that it never satisfied the essence.  
     - **Disanalogies:**  
       - *No microstructure:* "Planet" lacks a physical essence (e.g., atomic composition). Orbital dynamics are relational properties, not intrinsic.  
       - *Role vs. kind:* "Planet" functions as a *functional category* (like "weed") rather than a natural substance. Clearing an orbit is a criterion of role performance, not microstructural constitution.  
       - *Authority problem:* The essence is stipulated by vote, not discovered through scientific investigation (unlike H₂O).  

  #### 2. **Descriptivist Mapping (Frege/Russell):**  
     - **Vote as stipulation:** The IAU redefined "planet" by adding a new description ("clears its orbit"). Pre-2006 uses had a looser cluster (e.g., "round, orbits sun"). Pluto’s demotion reflects amended criteria, not essence discovery.  
     - **Strengths:**  
       - Explains why astronomers debate definitions (classification dispute, not reference failure).  
       - Accounts for linguistic data: "Pluto stopped being a planet" mirrors how we say "tomatoes stopped being classified as fish."  
     - **Strain:** Fails to explain why some insist Pluto *never* was a planet—a move more natural to causal theories.  

  #### 3. **Hybrid Artifact/Kind Mapping:**  
     - "Planet" sits uneasily between natural kind and term of art. Like "jade" (which names two minerals), it may be a *nominal kind* with context-dependent boundaries.  
       - **Key disanalogy with jade:** Jade’s duality was *discovered* (hidden structure), while Pluto’s status was *negotiated* (no new empirical data about Pluto itself).  
       - **Analogy with "whale":** Like "whales aren’t fish," Pluto’s exclusion could correct a prior error. But whales were reclassified based on biology (essence); Pluto on dynamical criteria (convention-laden).  

  ---  

  ### Where Theory Breaks Against Practice  
  - **Astronomer dissent:** Those defending Pluto appeal to geophysical traits (roundness, geology), rejecting orbital criteria. This is a **classification dispute**, not reference shift—undermining causal-historical claims that "planet" rigidly designates an essence.  
  - **Linguistic asymmetry:**  
    - We say "Ceres *was* a planet [then stopped being one]" but debate whether Pluto *was* or *never was* one. This suggests reference is anchored to historical use, not essence.  
    - Asserting "Pluto was the ninth planet" was *always false* feels counterintuitive, unlike "Hesperus is Phosphorus." Rigid designation struggles here.  
  - **Authority matters:** The IAU’s vote reflects institutional power, not scientific revelation. "Planet" behaves more like "dwarf planet" (a defined category) than "water."  

  ---  

  ### Direct Answers  
  1. **Does this vindicate descriptivism, causal theory, or neither?**  
     - **Vindicates hybrid view:** "Planet" is a **non-natural kind term** with elements of both. Its reference depends on (1) historical chains *and* (2) evolving criteria. The IAU vote exposed that its boundaries are convention-sensitive, unlike natural kinds. Causal theories overextend; descriptivism underplays the historical rigidity of "Pluto."  

  2. **Does this teach us about rigid designation/necessary a posteriori?**  
     - **Yes—by showing limits:** Rigid designation works poorly for functionally defined categories lacking microstructural essences. The necessary a posteriori applies only when an essence *exists* (e.g., water, tigers). Here, the "essence" is legislated, not discovered. The episode reveals that philosophical tools for natural kinds **do not cleanly map** onto institutional categories, adding drama but not resolving the ambiguity.  

  ### Conclusion  
  The Pluto affair shows **reference theory cannot force "planet" into a familiar box**. It behaves like a "kind of art" with historical baggage, resisting rigid designation while revealing how scientific authority shapes language. The real lesson: philosophy of language must account for terms whose "essence" is negotiated, not found.
