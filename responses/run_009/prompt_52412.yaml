  Okay, the user is asking about Montaigne's essay "Of Cannibals," specifically why he includes a discussion about Atlantis and shifting geography after the opening paragraphs. They want to understand how this apparent digression connects to his argument about judging "barbarians" and his comment about eyes being bigger than bellies. They also want to know how this relates to the critique of custom as a basis for judgment.

  Looking back at the opening, Montaigne starts with Pyrrhus observing the Romans' organized army and questioning the label "barbarians." He then introduces a man who lived in Brazil, mentioning the discovery of the New World. He expresses skepticism about human knowledge, fearing that "our eyes are bigger than our bellies" and that we "grasp at all, but catch nothing but wind." Then he shifts to Plato's Atlantis and geographical changes instead of directly discussing Brazilian cannibals.

  So why this detour? Montaigne is challenging European arrogance. By discussing Atlantis and shifting coastlines, he's undermining the idea that current European knowledge is complete or fixed. The Atlantis story, recorded by Plato, shows that even ancient civilizations recognized the possibility of unknown lands. This parallels the recent discovery of the Americas—something the ancients didn't know about. The shifting rivers and coastlines demonstrate that the world is constantly changing, so what seems permanent now might be different later. This physical impermanence mirrors the instability of human knowledge.

  Montaigne is attacking the notion of a "fixed standard" derived from antiquity or contemporary Europe. If even Plato acknowledged lost civilizations like Atlantis, how can we treat ancient knowledge as complete? And if coastlines change over time, how can we trust current geography as absolute? This connects directly to his warning about trusting "vulgar opinion." He's setting up a framework that questions all assumed certainties, including European superiority over so-called "barbarians."

  The "eyes bigger than bellies" comment is key here. It's about human hubris in claiming exhaustive knowledge. Europeans think they understand the world (big eyes), but their actual capacity to know is limited (small bellies). The Atlantis and geography examples prove this—civilizations rise and fall, lands appear and disappear, yet Europeans act as if their current map is final. This prepares readers for the main argument: if we can't even trust geographical knowledge, why trust European judgments about Brazilian customs?

  Regarding custom as a basis for judgment, Montaigne is laying groundwork to show that what's "normal" is relative. Europeans label others "barbarians" based on their own customs, but this section reveals that customs (even geographical knowledge) are unstable. Later, he'll argue that Brazilian "cannibals" might be more rational than Europeans in some ways, turning the barbarian label back on the colonizers. The digression isn't random—it's a calculated move to destabilize all foundations of judgment before evaluating specific customs. Essentially, he's saying: "If even the earth isn't fixed, why assume your culture is the standard?"
answer: |-
  Montaigne's apparent digression into Plato's Atlantis and shifting geography is **not a detour but a crucial expansion of his opening argument**. It serves three interconnected purposes that directly address the essay's core themes about judging "barbarians," the instability of human knowledge, and the danger of relying on custom or "vulgar opinion":

  1.  **Undermining the "Fixed Standard" of Antiquity and Present Knowledge:**
      *   The opening uses *ancient* examples (Pyrrhus, Greeks, Philip) questioning snap judgments of "barbarians." But Montaigne immediately pushes further: he attacks the assumed *superiority and completeness* of ancient knowledge itself.
      *   **Atlantis:** By referencing Plato's story of a vast, advanced civilization lost beneath the sea (via Timaeus), Montaigne shows that even the revered ancients acknowledged the possibility of entire worlds unknown to them. This directly parallels the recent discovery of the Americas – something the ancients hadn't dreamed of. It proves that antiquity, held up as the pinnacle of knowledge, was fundamentally *incomplete*. If Plato could imagine lost continents, why should we assume *our* current map (literal or cultural) is definitive?
      *   **Shifting Rivers & Coastlines:** These examples demonstrate the *physical impermanence* of the world. Landscapes change dramatically over time; continents submerge, coastlines erode, rivers shift course. What seems fixed and known *now* was different in the past and will be different in the future. This physical instability mirrors the instability of human knowledge and custom.

  2.  **Illustrating "Eyes Bigger Than Bellies" - The Hubris of Knowledge Claims:**
      *   Montaigne's fear ("our eyes are bigger than our bellies... we grasp at all, but catch nothing but wind") is a metaphor for **human intellectual hubris**. We *desire* to know and possess everything (big eyes), but our actual capacity to understand and retain true knowledge is limited (small bellies). Our reach exceeds our grasp.
      *   The Atlantis/geography section *exemplifies* this hubris:
          *   **Atlantis:** Represents a vast knowledge *lost*, showing that even advanced civilizations and their wisdom can be swallowed by time and forgotten. We grasp at the past, but much of it is "wind" – unrecoverable or distorted.
          *   **Shifting Geography:** Shows that our confident maps and geographical knowledge are provisional snapshots in a dynamic process. We claim to "know" the world, but its very shape changes, mocking our certainties. Our grasp on *present* geography is tenuous.
      *   This directly challenges the European mindset encountering the "New World": they assumed they possessed complete knowledge (or that the ancients did), judged the inhabitants against their own fixed standards (customs, religion, geography), and claimed possession. Montaigne argues this confidence is baseless; their "eyes" (ambition, claims to knowledge) are far larger than their actual understanding ("bellies").

  3.  **Preparing the Ground for Cultural Relativism and Critiquing Custom:**
      *   By demolishing the idea of fixed geographical or historical knowledge, Montaigne implicitly attacks the idea of fixed *cultural* standards. If the very landscape is unstable and ancient wisdom was incomplete, how can we possibly claim that our *current customs* represent an absolute, universal standard of civilization or "non-barbarism"?
      *   The digression profoundly **relativizes perspective**:
          *   What Europeans see as the "known world" is a tiny, temporary fragment.
          *   Civilizations rise and fall, taking their customs with them (Atlantis).
          *   The "New World" isn't truly new; it's just *new to Europeans*, who arrived late in Earth's history. Its inhabitants have their own ancient histories and customs, just as valid (or invalid) in the grand, unstable scheme of things as European ones.
      *   This sets up the essay's famous reversal: Montaigne will argue that the so-called "barbarians" of Brazil might possess virtues and a social order superior in some ways to the war-torn, hypocritical Europe of his day. Their practices (even ritual cannibalism) will be judged not against an absolute "civilized" standard (which Montaigne has shown doesn't exist), but within the context of their own society and against the *actual* barbarism (massacres, religious wars, torture) perpetrated by Europeans.

  **Connection to Custom as a Basis for Judgment:**

  The opening paragraphs and the "digression" lay a devastating foundation for Montaigne's critique of custom (*coutume*):

  1.  **Custom is Arbitrary and Local:** Just as coastlines shift and rivers change course, customs are not fixed laws of nature but contingent products of time, place, and circumstance (like the lost customs of Atlantis). Judging Brazilian customs by European norms is as absurd as judging a river's current course by where it flowed centuries ago.
  2.  **Custom Masquerades as Reason:** People mistake ingrained custom for inherent truth or reason ("vulgar opinion"). Pyrrhus used "the eye of reason" to see past the *label* "barbarian"; Montaigne uses geography and history to show that relying on custom (like assuming European superiority or ancient completeness) is the *opposite* of reason – it's blind adherence to the familiar.
  3.  **Custom Hinders True Judgment:** The European tendency to judge the New World through the lens of its own customs and incomplete knowledge is the prime example of "eyes bigger than bellies." Their customs blind them to the reality before them, causing them to "grasp at all" (claiming superiority, possession, understanding) but "catch nothing but wind" (failing to truly comprehend or justly evaluate what they encounter).

  **In essence, the Atlantis/geography section is Montaigne proving, through the instability of the physical world and the limitations of historical knowledge, that there is no secure, eternal, universal standard – geographical, historical, or cultural – against which to definitively judge others as "barbarians."** It forces the reader to confront the profound instability of human knowledge and the parochial nature of custom, creating the necessary intellectual humility for the radical cultural relativism and critique of European society that follows in the essay's main discussion of Brazil. The "digression" is the essential bridge between the opening anecdote and the essay's revolutionary core.
