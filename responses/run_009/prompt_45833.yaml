answer: |-
  Below is a comprehensive exam question designed to push students beyond rote recitation, followed by a model answer, marking scheme, and analysis of common pitfalls.  

  **Exam Question**  
  > **The Frege-Geach problem is often framed as a challenge about compositional *logic* (e.g., conditionals). However, its deepest difficulty may concern *negation*. Explain why negation—specifically, the relationship between "X is wrong" and "X is not wrong"—poses a uniquely severe problem for pure expressivism. Why can’t the expressivist treat "not wrong" as merely the *absence* of disapproval? Illustrate your answer using an *unasserted* context (e.g., a conditional with a negated moral antecedent, or a disjunction with one moral and one non-moral disjunct).  
  >  
  > Next, consider a *hybrid expressivist* view: "Stealing is wrong" is both (i) true iff stealing has the property of wrongness, and (ii) expresses disapproval of stealing. Does this view resolve the Frege-Geach problem? Focus on two issues:  
  > (a) How does it handle the inference from "Stealing is wrong" and "If stealing is wrong, then encouraging it is wrong" to "Encouraging stealing is wrong"?  
  > (b) What does "Stealing is not wrong" mean? Does it negate the property, the attitude, or both?  
  >  
  > Finally, argue *either* that pure expressivism’s "attitude logic" (e.g., Blackburn’s commitment-theoretic operators) successfully avoids smuggling in representational content, *or* that it covertly reintroduces the very content expressivism sought to eliminate.  

  ---

  **Model Answer** (700 words)  
  The Frege-Geach problem exposes expressivism’s struggle to explain how moral sentences retain consistent meaning across asserted and unasserted contexts. While conditionals are the classic example, negation reveals a more fundamental flaw. Pure expressivism equates "Stealing is wrong" with *disapproving of stealing*. For "Stealing is not wrong," the expressivist cannot say it expresses *no attitude*, as this would render it meaningless in compositional contexts. Nor can it express *disapproval of not-stealing*, which conflates predicative and prescriptive negation. Instead, expressivists like Blackburn argue "not wrong" expresses *tolerance* or *permission*—a distinct attitude from mere absence of disapproval. This creates two problems.  

  First, in unasserted contexts, expressivism’s treatment of negation becomes strained. Consider the conditional: *"If shoplifting is not wrong, then Jane is a librarian."* Suppose Jane is not a librarian. On expressivism, the antecedent expresses tolerance of shoplifting. But the conditional’s truth hinges on whether tolerance being expressed entails Jane’s profession—which is nonsensical. The sentence’s meaning depends on the *logical relationship* between shoplifting’s normative status and Jane’s job, but expressivism reduces this to clashing attitudes (tolerance + belief about Jane), failing to capture their inferential link.  

  Second, disjunction amplifies the issue: *"Either murder is not wrong or grass is green."* If "not wrong" expresses tolerance, and "grass is green" expresses belief, the disjunction expresses ambivalence between tolerance and belief. But this misrepresents the sentence’s actual function: it is true iff murder lacks wrongness *or* grass is green. Expressivism cannot explain why accepting the disjunction requires rejecting "Murder is wrong AND grass is not green" without invoking truth-conditional content.  

  **Hybrid expressivism** appears to resolve this by assigning moral sentences truth-conditions *and* expressive functions. "Stealing is wrong" is true iff stealing instantiates wrongness (*representational*) and expresses disapproval (*expressive*). For the modus ponens inference:  
  - Premise 1: "Stealing is wrong" → **TRUE** (stealing has wrongness) + disapproval expressed.  
  - Premise 2: "If stealing is wrong, encouraging it is wrong" → **TRUE** (if stealing has wrongness, encouraging it has wrongness) + ? (attitude unclear).  
  - Conclusion: "Encouraging stealing is wrong" → **TRUE** (inherits truth from premises) + disapproval expressed.  
  The truth-conditions compositionally validate the inference via standard logic. However, the *attitudinal component* does no work: the inference succeeds even if the speaker feels no disapproval. This abandons expressivism’s core motivation—explaining moral judgment as fundamentally non-cognitive. If truth-conditions bear all logical weight, why insist attitudes are essential?  

  For negation, hybrid views face a dilemma. If "not wrong" means stealing *lacks* wrongness (truth-conditional) *and* expresses *tolerance* (attitudinal), then "not wrong" is not the simple negation of "wrong." This conflicts with logical intuition: "not wrong" should directly contradict "wrong," but here it adds an independent attitude. Alternatively, if "not wrong" expresses *absence* of disapproval, it collapses into pure expressivism’s problem: unasserted contexts become inexplicable. Either way, hybrids either fragment negation or render attitudes superfluous.  

  Pure expressivism’s solution—treating attitudes as logically structured states (e.g., Blackburn’s "commitments")—smuggles in representational content. To explain why accepting "If P, then Q" and "P" necessitates accepting "Q," Blackburn defines logical operators as functions on *commitment-states*. But these states must track *inconsistencies* (e.g., accepting "P" while rejecting "Q" when committed to "If P, then Q" is prohibited). This requires attitudes to be governed by *norms of correctness* mirroring truth-conditions. For instance, the attitude expressed by "Shoplifting is not wrong" must *objectively conflict* with that of "Shoplifting is wrong"—a norm implying representational "fit." Thus, the "logic" of attitudes covertly reinstates the truth-conditional semantics expressivism sought to avoid.  

  ---  

  **Marking Scheme** (Total: 20 points)  
  **Must-hit points** (4 pts each):  
  1. **Negation ≠ Absence**: Explain why "not wrong" cannot be mere absence of disapproval for pure expressivism.  
     *Common pitfall*: Students claim expressivists can treat negation as "no attitude," ignoring embedding problems.  
  2. **Unasserted Contexts**: Use a conditional/disjunction with negated moral antecedent to show compositional failure.  
     *Common pitfall*: Students reuse "boo/hooray" without negation or default to asserted examples.  
  3. **Hybrid’s Inferential Collapse**: Show truth-conditions handle modus ponens, making attitudes redundant.  
     *Common pitfall*: Students assert hybrids "solve" Geach but ignore whether attitudes contribute to logic.  
  4. **Hybrid’s Negation Dilemma**: Analyze how "not wrong" either fragments logic or reduces to pure expressivism’s problem.  
     *Common pitfall*: Students assume "not wrong" straightforwardly negates both components.  
  5. **Smuggling Charge**: Argue that "attitude logic" implicitly reintroduces truth-conditional norms.  
     *Common pitfall*: Students describe Blackburn/Gibbard’s solution without critiquing its metaphysical baggage.  

  *Balance (0–4 pts)*: Awarded for structure, clarity, and addressing all question parts.  
  *Penalties*: -1 for conflating expressivism/subjectivism; -2 for misdefining Geach (e.g., focusing only on truth-aptness).  

  ---  
  **Design Notes**  
  - The question forces engagement with *negation* as the "harder" variant of Geach, moving beyond canned conditional examples.  
  - Hybrid expressivism is included to disrupt complacency—its apparent ease collapses under scrutiny, revealing expressivism’s core tension.  
  - The "either/or" finale prevents generic summaries, demanding a stance on expressivism’s viability.  
  - No citations/dates required; success hinges on reconstructing arguments from first principles.
