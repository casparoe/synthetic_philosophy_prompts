answer: |-
  ## Research Proposal: Disaggregating Corruption in Repugnant Markets: A Diagnostic Framework

  **Principal Investigator:** [Your Name], Third-Year PhD Candidate, Political Philosophy
  **Department:** [Your Department Name], [Your University Name]
  **Project Title:** Token Wrongs and Type Degradation: Diagnosing the Structure of Objections to Repugnant Markets
  **Fellowship Sought:** Nine-Month Dissertation Completion Fellowship
  **Proposed Start Date:** [Start Date]

  **1. Research Question and Core Problem:**
  The pervasive philosophical and public unease surrounding certain transactions labelled "repugnant markets" – notably kidney sales, vote selling, and price gouging – appears to stem from distinct sources that are often conflated in the literature. This project asks a precise diagnostic question: **For which of the standard repugnant markets (kidney sales, vote selling, price gouging), if any, does the core moral wrongfulness persist *even when* the specific transaction is demonstrably free from exploitation, desperation, and coercion?** Furthermore, **what does the pattern of persistence (or lack thereof) reveal about the structure and validity of the "corruption objection" – the claim that markets degrade the meaning or social value of certain goods?**

  The central problem addressed is the current lack of a clear diagnostic tool to separate two fundamentally different objections frequently bundled together under the umbrella of "market corruption":
  *   **The Token Objection:** This targets *specific transactions* deemed wrongful due to features like exploitation (e.g., taking advantage of a seller's desperate poverty or a buyer's emergency need), coercion, information asymmetry, or harmful consequences to identifiable parties. Crucially, this objection implies that if these transactional flaws were remedied (e.g., a well-compensated, entirely free, informed seller in non-dire circumstances), the *core* moral wrong would disappear.
  *   **The Type Objection:** This targets the *market practice itself*, arguing that introducing a good into the market sphere fundamentally alters its meaning, value, or social significance in a way that is inherently corrupting, regardless of the fairness of individual transactions. The wrongfulness is located at the level of the *type* of good or the *practice* of trading it, persisting even in hypothetical scenarios involving uncoerced, well-remunerated, and mutually beneficial exchanges (e.g., a wealthy person selling their vote for luxury goods).

  My core hypothesis is that these standard cases sort differently under this distinction than the often undifferentiated "corruption" framing suggests. Intuitions regarding vote selling seem robust even against hypotheticals featuring wealthy, unpressured sellers, pointing strongly towards a type objection. Conversely, objections to price gouging frequently attenuate when genuine scarcity necessitates rationing and high prices eliminate non-essential demand, suggesting the core objection is often token-based, concerning exploitation of emergencies. Kidney sales occupy a contested middle ground, where both objections seem powerfully at play, requiring careful disentangling.

  **2. Gap in the Literature and Contribution:**
  Existing scholarship on repugnant markets tends towards two poles, neither adequately resolving the diagnostic question:
  *   **Exploitation/Objectionable Conditions Frameworks:** These offer precise analyses of transactional flaws (coercion, desperation, information deficits, harm) but struggle to explain the persistent intuitive resistance to markets even in highly stylised, "clean" hypotheticals devoid of these flaws. They often dismiss residual unease as mere squeamishness or fail to account for it theoretically.
  *   **Corruption/Commodification Frameworks:** These powerfully capture the intuition that markets can change the meaning of goods (e.g., blood donation vs. sale, civic duty vs. vote as commodity). However, the objection is frequently articulated at a level of high generality, risking unfalsifiability. Asserting that markets *inherently* degrade certain goods provides little guidance on *which* goods are vulnerable to this degradation, *why* some seem more susceptible than others, or how to distinguish genuine type degradation from the *aggregate effects* of many token-level wrongs (e.g., widespread exploitation leading to a *perception* of degradation). The lack of a clear sorting mechanism leaves the corruption objection vulnerable to charges of vagueness and paternalism.

  This project bridges this gap. Its primary contribution is the development and application of a rigorous **"Sorting Test"** designed to diagnose the fundamental structure of objections to specific repugnant markets. The test centres on the persistence of the wrong under conditions eliminating token-level flaws. By systematically applying this test to the three paradigm cases, the project aims to:
  *   Produce a **nuanced taxonomy** of repugnant markets based on the structure of their underlying objections (primarily token, primarily type, hybrid).
  *   **Refine the corruption objection** by demonstrating its specific applicability (or inapplicability) to distinct markets, moving beyond blanket assertions.
  *   Provide a **shared diagnostic framework** usable by proponents of both exploitation-based and commodification-based critiques, facilitating more productive debate by clarifying the precise locus of disagreement.

  **3. Methodology and Work Plan (9 Months):**
  Building upon an already drafted chapter establishing the core exploitation-based (token) objections, this project will unfold over three distinct phases:

  *   **Phase 1: Constructing and Refining the Sorting Test (Months 1-3)**
      *   **Task 1.1 (M1):** Formalise the Sorting Test criteria. Precisely define the conditions for a "clean" transaction (full voluntariness, adequate information, absence of dire need/emergency for seller/buyer respectively, fair price, no direct third-party harm).
      *   **Task 1.2 (M2):** Identify and catalogue potential conceptual objections to the test itself. Key challenges include:
          *   The **"Contamination Problem"**: Can intuitions about hypothetical "clean" transactions ever be isolated from our knowledge of real-world contexts rife with exploitation?
          *   The **"Feasibility Problem"**: Are the conditions for a "clean" transaction realistically achievable for certain goods (e.g., kidneys) without fundamentally altering the practice?
          *   The **"Independence Problem"**: Can the type objection truly be isolated, or is type degradation always downstream of potential or actual token-level harms?
      *   **Task 1.3 (M3):** Develop robust philosophical responses to these objections and refine the test accordingly. Stress-test the test against counterexamples from adjacent debates.

  *   **Phase 2: Applying the Sorting Test to Case Studies (Months 4-6)**
      *   **Task 2.1 (M4): Vote Selling.** Analyse whether objections persist robustly in hypotheticals involving affluent, unpressured sellers. Argue that this points strongly towards a fundamental type objection concerning the nature of political agency and citizenship. Examine if limited markets (e.g., prediction markets) challenge this.
      *   **Task 2.2 (M5): Price Gouging.** Analyse whether core objections dissipate when genuine scarcity exists and high prices function purely as rationing mechanisms, absent exploitative intent or emergency vulnerability. Argue that the primary objection here is often token-based, targeting exploitation of emergencies, though secondary type concerns about solidarity may arise. Consider "non-essential gouging".
      *   **Task 2.3 (M6): Kidney Sales & The Crowding-Out Challenge.** Apply the test to kidney sales, exploring the complex interplay of token and type objections. Crucially, investigate the **crowding-out phenomenon** (where paid provision reduces altruistic donation). Analyse whether crowding-out represents: (a) a compounded *token* effect (e.g., distrust bred by potential exploitation scandals), (b) evidence of genuine *type* degradation (altruism becomes unintelligible), or (c) a distinct harm. This is vital for diagnosing the kidney case.

  *   **Phase 3: Confronting the Liberal Neutrality Challenge (Months 7-9)**
      *   **Task 3.1 (M7-8):** Address the most potent anticipated objection: If a transaction is fully consensual and causes no direct harm to non-consenting parties (as per the "clean" transaction criteria), on what grounds can a *type* objection (based on a perceived degradation of meaning) be justified without violating liberal principles of state neutrality? Does it impose a contested conception of the good?
      *   **Task 3.2 (M9):** Develop a defence of the type objection that reconciles it with core liberal commitments, potentially drawing on concepts of relational autonomy, social preconditions for valuable goods, or the role of non-commodified spheres in sustaining a just society. Synthesise findings from Phases 1 & 2 to inform this defence.

  **4. Success Criteria, Failure Conditions, and Scope:**
  *   **Success:** The project succeeds if it delivers:
      *   A robustly defended Sorting Test for diagnosing token vs. type objections.
      *   A clear taxonomy of the three case studies based on the test's application.
      *   A compelling analysis of the crowding-out phenomenon within this framework.
      *   A substantive response to the liberal neutrality challenge regarding type objections.
      *   Two draft dissertation chapters (Case Studies & Liberal Challenge) and revisions to the existing exploitation chapter incorporating the framework.
  *   **Failure Condition:** The project would be challenged, though not necessarily fail, if the Sorting Test conclusively demonstrates that all apparent type objections reduce without remainder to compounded token-level effects (exploitation, distrust, indirect harms) or empirically contingent crowding-out. In this case, the dissertation's core argument would pivot towards defending this reductionist view, significantly strengthening the exploitation-based critique while offering a powerful challenge to standard commodification arguments.
  *   **Scope:** This nine-month project, building on existing work, is deliberately focused on *diagnosing* the structure of objections using three paradigmatic cases. It does not aim to provide a complete normative theory of commodification nor exhaustively analyse every potential repugnant market. Its strength lies in its targeted conceptual clarification and the development of a widely applicable diagnostic tool. The fellowship period is dedicated to achieving this focused but significant contribution.

  **5. Expected Significance:**
  By rigorously disentangling token and type objections, this project promises significant conceptual clarity in the heated debate over repugnant markets. It offers philosophers a more precise diagnostic tool, moves the commodification debate beyond unfalsifiable generalities, and provides a clearer foundation for policymakers considering market design or prohibition. Understanding whether an objection stems from *how* a transaction occurs or *that* it occurs as a market transaction is fundamental to crafting just and effective responses to these ethically fraught exchanges. This dissertation will provide that crucial understanding.
