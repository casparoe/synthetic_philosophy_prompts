prompt: |-
  My colleague here in the philosophy department — trained as a metaethicist, but she has loud opinions about everything, which is how we like her — has a years-long running argument with me about abstract objects, and I've finally started writing down her verdicts, because I can't get them to line up with any single theory. Her record so far: the number 17 exists and would have existed even if minds had never evolved; sets exist; mathematical truths are discovered, not invented, and there was already a fact about the Riemann hypothesis before anyone asked; Sherlock Holmes does not exist, though she's perfectly happy to say true things are true of him; Beethoven's Tenth doesn't exist even though there are sketches, while Brahms's Fourth does; poem-types exist, which she says is the only reason a poem can be copied; chess exists but only since roughly the sixth century — it was invented, it wasn't sitting around waiting to be found; possible worlds don't exist; and universals like redness don't exist either, just particulars that resemble each other. So: numbers and sets eternal, artworks and games created, fiction and worlds and universals out.

  Here's my situation. Next month she's giving a talk to our grad metaphysics seminar, I'm moderating the Q&A, and I want to spring a case on her that I genuinely can't predict: the Mandelbrot set. Did it exist in 1900, before anyone had the definition or the computers to picture it? On one reading of her — math eternal, culture created — she says yes, obviously, it's a mathematical object like any other. But there's a second reading of her record, something like: an abstract object exists only if it's inevitable, the kind of thing any sufficiently deep inquiry would eventually converge on. Numbers pass that test, chess and Holmes don't — and it's not crazy to argue the Mandelbrot set's definition is as historically contingent as chess's, one species' particular doodling with iterating complex quadratics rather than something any mathematical culture would land on. I can even sketch a third reading where whatever our best theories indispensably quantify over gets in, and I honestly can't tell where that puts the set.

  So: predict her verdict on the Mandelbrot set and say why. Lay out the candidate rules that fit her track record (atleast two, more if you see them), say what each predicts for this specific case, give me your best guess with your reasons for preferring it, and — the part I actually care about — tell me which follow-up case would best split the remaining candidates apart. Something like a group of some absurd order defined by an arbitrary never-written-down multiplication table, or tic-tac-toe, or whatever you think genuinely does the discriminating work. Lead with your bottom-line prediction in your very first sentence and then give the reasoning — no preamble, no restating my question back at me — and write it in American English.
reasoning: |-
  Okay, the user is a philosophy professor who's been debating abstract objects with a colleague. They've collected her various positions: numbers and sets are eternal, artworks and games are created, and fiction, possible worlds, and universals don't exist. Now they want to predict her stance on the Mandelbrot set—specifically whether it existed in 1900 before computers could visualize it. They also want rules that fit her track record, a prediction, and a follow-up case to test the rules.

  First, I need to parse her existing verdicts. Numbers and mathematical truths exist independently of minds. Sets exist. Sherlock Holmes doesn't exist, but we can say true things about him. Beethoven's Tenth doesn't exist, but Brahms's Fourth does. Poem-types exist to allow copying. Chess exists but was invented, not discovered. Possible worlds and universals are out. So math eternal, culture created, but with nuances.

  The key question is the Mandelbrot set. Is it like numbers (eternal) or more contingent like chess? The user suggests two readings: one where math is always eternal, so Mandelbrot set exists; another where it's about inevitability—would any deep inquiry converge on it? Chess is contingent, so maybe Mandelbrot is too. There's also indispensability: if our best theories quantify over it, it exists.

  I need candidate rules. Rule 1: Mathematical Platonism. All mathematical objects exist independently. So Mandelbrot set exists eternally. Rule 2: Convergence/Discovery. Objects exist if they are inevitable discoveries, like numbers. Contingent creations like chess don't. Rule 3: Indispensability. If indispensable to science, it exists. But Mandelbrot might not be indispensable yet.

  Her view on chess is key. She says it was invented, not discovered. But math is discovered. Mandelbrot is mathematical, so Rule 1 would say it exists. But the user mentions that the definition might be contingent, like chess rules. However, chess is a human invention for a game, while Mandelbrot is a mathematical object defined by a formula. So even if the definition was contingent, the set itself, once defined, exists mathematically. She might distinguish between the concept (which could be contingent) and the object itself.

  Looking at poem-types: she says they exist to explain copying. That suggests types exist as abstract objects. Similarly, the Mandelbrot set as a mathematical type should exist. But chess was invented, so why the difference? Probably because chess rules are arbitrary human conventions, while math is necessary. So the Mandelbrot set, being mathematical, would be eternal.

  But what about the contingency of its definition? The formula is specific, but the set is determined by that formula. Since mathematical truths are eternal, the set defined by z² + c would exist once the definition is given. But did it exist before the definition? In Platonism, yes, because the set is a necessary consequence of mathematical laws. Like the Riemann hypothesis was true before anyone asked. So Mandelbrot should be the same.

  Rule 2 (Convergence) might be trickier. Is the Mandelbrot set something any math culture would converge on? Maybe not; complex dynamics wasn't studied until recently. But numbers are fundamental, while Mandelbrot is more niche. However, she includes sets as existing, and Mandelbrot is a set. So perhaps all sets exist.

  The user mentions an arbitrary group defined by a multiplication table. That's a good test case. If she accepts that as existing once defined, then Rule 1 holds. If she rejects it as contingent, then Rule 2 might apply. But her view on sets existing suggests she accepts even arbitrary sets.

  Prediction: She'll say the Mandelbrot set existed in 1900. Reasons: It's a mathematical object, and math is eternal. Sets exist. The definition might be contingent, but the object itself is part of math's necessary truths. Chess is different as it's a cultural artifact, not mathematical in the same way.

  Follow-up case: An arbitrary group of large prime order defined by a random multiplication table. If she accepts it, then Rule 1 (all math exists) is consistent. If she rejects it as invented, like chess, then Rule 2 (convergence) is more likely. That would split the candidates.

  My best guess: Mandelbrot set existed. Follow up with the arbitrary group to test if all mathematical objects are included or only the inevitable ones.
answer: |-
  **She will say the Mandelbrot set existed in 1900.** Here’s the reasoning, candidate rules, predictions, and a follow-up case to test the alternatives.  

  ### Candidate Rules Fitting Her Track Record  
  1. **Mathematical Platonism Rule**: Abstract objects exist iff they are mathematical entities (numbers, sets, truths). These are eternal, mind-independent discoveries. *Why it fits*: Explains numbers/sets existing eternally, math truths being discovered, and contrasts with non-mathematical creations (chess, Holmes) or non-entities (universals).  
  2. **Convergence Rule**: Abstract objects exist iff they are *inevitable discoveries*—any sufficiently advanced inquiry (e.g., math, science) would converge on them. Contingent human constructs (chess, Holmes) don’t exist. *Why it fits*: Captures math’s “discovered” status vs. chess’s “invented” label, while excluding universals/possible worlds as non-convergent.  
  3. **Indispensability Rule**: Abstract objects exist iff our best epistemic practices (math, science) indispensably quantify over them. *Why it fits*: Aligns with math/sets as indispensable, while excluding Holmes/universals as non-essential.  

  ### Predictions for the Mandelbrot Set  
  - **Mathematical Platonism Rule**: **Yes, it existed**. The Mandelbrot set is a mathematical set defined by a precise formula (zₙ₊₁ = zₙ² + c). Like the number 17 or sets generally, it’s eternal and discovered, not invented. Historical contingency of the definition is irrelevant—it’s still math.  
  - **Convergence Rule**: **No, it didn’t exist**. The Mandelbrot set arises from a *highly specific* area of complex dynamics (iterated quadratics), which isn’t fundamental or inevitable. Not all math cultures would converge on it, just as they wouldn’t converge on chess rules. It’s a “doodling” artifact.  
  - **Indispensability Rule**: **Unclear/Probably yes**. If complex dynamics is part of “best math,” it exists. But if the set is merely a curiosity (not indispensable to core science/math), it might not. Her record lacks clear indispensability thresholds.  

  ### Why I Predict "Yes" (Mathematical Platonism Rule)  
  - Her core dichotomy: **math = eternal, culture = created**. The Mandelbrot set is unambiguously mathematical (a set defined by a function), not cultural like chess or Beethoven’s Tenth. She affirms sets exist generally, and poem-types (abstracta) exist to enable copying—similarly, the Mandelbrot set’s structure is copyable/instantiable.  
  - Contingency isn’t disqualifying for math: The *Riemann hypothesis* had a truth-value pre-discovery despite its sophistication. Like the Mandelbrot set, it’s a consequence of mathematical laws, not invented rules.  
  - She rejects only *non-mathematical* contingents: Chess is a game (social artifact), Holmes is fiction—neither are math entities. The Mandelbrot set’s computational reliance doesn’t make it less mathematical; we just needed tools to *see* it, like needing telescopes for planets.  

  ### Follow-Up Case to Split the Candidates: Arbitrary Algebraic Group  
  **Present this**: "Consider a group of order 97 (prime), defined by a random multiplication table I just scribbled down—never studied, never used, with no symmetry or connection to existing math. Did this group exist in 1900?"  
  - **If she says YES**, it confirms **Mathematical Platonism Rule**: Any mathematically defined object exists eternally, no matter how arbitrary or useless. This kills the Convergence Rule (it’s not inevitable).  
  - **If she says NO**, it supports **Convergence Rule**: Contingent, non-convergent mathematical doodles (like this group or chess) don’t exist. This forces her to clarify if “math” excludes arbitrary constructions.  
  - *Why this works*: It’s structurally identical to her chess verdict (invented rules), but framed as math. If she treats it like chess (“contingent, not discovered”), Convergence wins. If she treats it like sets (“it’s math, so eternal”), Platonism wins. Indispensability would likely reject it (too useless), but her poem-type stance suggests abstracta can exist without utility.  

  **Bottom line**: She’ll ok the Mandelbrot set as eternal math, but press her on the arbitrary group—that’ll force her to choose between “all math is discovered” and “only inevitable math is real.”
