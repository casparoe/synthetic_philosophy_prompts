prompt: |-
  My verdicts on which reference class to use when guessing probabilities, and I want to know if there's a principle behind them, because right now it feels like I just pick whichever class gives the answer I like.

  - When my doctor estimates my ten-year cardiovascular risk, she plugs me into a big table of men my age with my cholesterol and blood pressure. That seems right, even though nobody in that class shares my diet or family history in any detail.
  - When my friend asked whether her specialty bakery would survive its first year, I rejected "small food businesses" (most fail) as irrelevant, because she had a decade of loyal customers from her market stall and a lease locked in below market rate. The narrow, information-rich judgment seemed obviously better there.
  - But when a founder tells me "companies with AI in the name get huge valuations, so will we," I don't trust that narrow class at all. The feature defining the class seems to be doing no work.
  - Asked whether a stranger's marriage will last, I'd happily use "first marriages in their country and education bracket," and I'd refuse to refine it with "marriages where both partners' names start with the same letter" — but I'd also refuse to refine it with "marriages where one partner's parents divorced," even though that one is actually predictive.

  The case I keep going back and fourth on: my chance of being in a car accident this year. "Drivers my age with a clean record" says very unlikely. "Drivers on my exact commute, at my hours, in my weather" contains far more information about the actual risk and says somewhat less unlikely — and I can't even decide which of those is the right kind of thing to average over.

  So: is there one principle that gets all of these — maybe something about whether the property defining the class is causally connected to the outcome, or about how much the class has been tailored to the individual? If it can't save every verdict, tell me which one to drop and why. And tell me what the principle predicts for a case I haven't mentioned: my friend's kid, a strong student at an average high school, asking about their odds of getting into an Ivy — do I use "applicants with that GPA," or "strong students at average schools"?

  Lead with your bottom line in the first sentence, then the reasoning. No preamble and no restating my question.
reasoning: |-
  Hmm, the user is struggling with how to choose the right reference class for probability estimates. They've described several scenarios where they intuitively pick different reference classes but can't articulate a consistent principle behind it. They feel like they're just choosing whatever gives the answer they prefer. The examples include medical risk assessment, business survival predictions, marriage longevity, car accident probability, and college admissions odds.

  Looking at their examples:
  - They accept broad demographic/medical data for cardiovascular risk
  - Reject broad "small food businesses" class for bakery survival in favor of narrow specifics
  - Reject "companies with AI in the name" as irrelevant for business valuation
  - Accept broad demographic data for marriage survival while rejecting both superstitious and actually predictive but non-causal refinements
  - Are torn between broad demographic vs. hyper-specific commute data for car accident risk

  The common thread seems to be that they intuitively value reference classes where the defining characteristics have a plausible causal relationship to the outcome or represent non-redundant information. For the bakery, specific factors like loyal customers and below-market lease directly affect survival chances. But for the AI-named companies, the naming convention itself doesn't cause success - it's just a trendy label.

  For the car accident case, their confusion makes sense. While commute details do causally affect risk, "drivers my age with clean record" might be better because hyper-specific data isn't available in reliable statistical form. We don't have robust accident data for every possible commute variation.

  For the Ivy League admission question, I'd suggest using "strong students at average schools" rather than just GPA. This captures the contextual information about the applicant pool and school resources that directly affect admissions chances, whereas GPA alone misses important contextual factors.

  The core principle should be: prioritize reference classes defined by characteristics that are either (1) causally relevant to the outcome, or (2) non-redundant statistical predictors that haven't been "conditioned away" by more specific information. This explains why they reject both the "same first letter" nonsense predictor and the "parents divorced" predictor - the latter might be statistically valid but isn't causal, and its predictive power might already be captured by more fundamental factors.
answer: |-
  The unifying principle is: **use the broadest reference class whose defining characteristics are either causally relevant to the outcome or represent non-redundant predictive information not captured by narrower classes.**

  - **Cardiovascular risk:** Age, cholesterol, and blood pressure are causal risk factors directly affecting cardiovascular outcomes. Your diet/family history may influence *why* those numbers are what they are, but they aren't additional independent predictors once current biomarkers are known. The broad class is valid.
  - **Bakery survival:** "Small food businesses" ignores causal factors your friend possesses (loyal customers, below-market lease). These are independent, causally relevant advantages not reflected in the broad class. The narrow class is better.
  - **AI-named companies:** The name "AI" doesn't *cause* success; it's a non-causal correlate (likely reflecting a trend-following founder). It provides no new predictive power beyond broader classes like "tech startups" once other fundamentals are considered. Rejecting this class is correct.
  - **Marriage survival:**
    - **Country/education:** Valid. These correlate with causal factors like socioeconomic stability and cultural norms.
    - **Same first letter:** Reject correctly. No plausible causal link or predictive power.
    - **Parental divorce:** Reject correctly. While statistically predictive, it's likely a proxy for underlying causal factors (e.g., learned conflict patterns, genetic traits). Once you condition on the broader class (which includes education/culture influencing relationship norms), adding this may offer little *independent* predictive value. It's redundant noise.
  - **Car accident risk:** Use "drivers your age with a clean record." While commute details causally affect risk, hyper-specific classes lack reliable data and introduce noise. Your age/record are robust causal proxies for attentiveness, reaction time, and risk aversion – factors dominating the baseline risk. Commute-specific risks (weather, route) are better treated as temporary modifiers to this baseline.
  - **Ivy League admissions:** Use **"strong students at average schools," not just "applicants with that GPA."** School context is causally relevant (resource access, competition rigor affecting development) and a non-redundant predictor: a 4.0 GPA at an average school signals different preparedness than a 4.0 at a top feeder. The broader "same GPA" class ignores this causal disadvantage.

  **Drop the bakery verdict if forced?** No – it fits. Your friend’s advantages are causal and non-redundant. **Drop the marriage/parental divorce verdict?** Yes, conditionally. If data shows parental divorce offers *significant independent* predictive power beyond country/education (e.g., via studies controlling for these), it might warrant inclusion. But your intuition is right: absent evidence it adds unique insight, default to broader causal proxies.
