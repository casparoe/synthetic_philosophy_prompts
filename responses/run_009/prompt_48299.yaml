  **Setting:** A conference room after the sale of Ana and Ben’s startup. A whiteboard sketches utility scales:  
  - **Ana’s dream outcome:** Keep patent ($+300k utility), skip consulting ($-0), max cash ($+700k) → Utopia: **$1,000k utility**.  
  - **Ben’s dream outcome:** Skip consulting ($-0), fair cash ($+400k) → Utopia: **$400k utility**.  
  *Feasible frontier:* Cash split + consulting assignment → max joint utility $800k. Disagreement point: $0 for both (liquidation).  

  ---

  **Ana (Kalai–Smorodinsky Defender):** Ben, Nash’s math is ruthless. Look at the numbers: your solution gives you $380k utility (95% of your utopia) while I get $420k (42% of mine). Just because my *potential* gains are higher? That’s absurd. KS fixes this—we both get 70% of our utopias: you $280k, me $700k. Equal sacrifice!  

  **Ben (Nash Defender):** Ana, your "sacrifice" is artificial. Why should your fantasy outcome—keeping the patent, which wasn’t even on the table—inflate your claim? Nash focuses on real gains: the product of our actual utilities. Here, ($420k × $380k) beats any other split. Independence of Irrelevant Alternatives (IIA) is non-negotiable: if an option isn’t feasible (like your patent dream), it shouldn’t distort fairness.  

  **Ana:** But IIA ignores *why* my ceiling is high! I invested more upfront—this patent was my lifework. KS’s Individual Monotonicity ensures your windfall doesn’t grow *because* my potential did. Under Nash, if my utopia magically doubled to $2M, you’d *still* pocket $380k while I’d stagnate. How is that fair?  

  **Ben:** Because "fairness" shouldn’t hinge on immeasurable feelings. Equal fractions of utopias? Your 70% ($700k) buys a yacht; mine ($280k) covers rent. Is that "equal"? Utilities are ordinal, not comparable! Nash anchors to tangible gains: we split the *actual* surplus equally.  

  **Ana:** Fine, let’s test your axioms. Suppose we had a third founder, Clara. She vetoes any deal giving you over $300k utility. Nash would now maximize the product *under* that cap—you’d get exactly $300k, I’d jump to $500k. But nothing fundamental changed! Your old $380k was already feasible. Why should Clara’s irrelevant whim reward me?  

  **Ben:** *[Pauses]* Okay, that’s a smart stab. But IIA holds: the veto *is* relevant—it alters the feasible set. Nash responds to new constraints; KS doesn’t. In your KS world, if Clara’s veto capped your utopia to $900k, you’d demand *more* than before ($630k instead of $700k) because your "fraction" stayed fixed. That’s perverse!  

  **Ana:** ...Conceded. But let’s flip it: what if you could *secretly* inflate your utopia? Say, by fake-negotiating a consulting side-hustle. Nash would hand you more surplus for free! KS punishes exaggeration—it ties payouts to *verifiable* utopias.  

  **Ben:** True, but utopias are subjective. Nash avoids that mess. *[Leans in]* Here’s the crux: imagine we *remove* your patent possibility *after* we agree on KS. Your utopia drops to $700k, so KS now gives you $490k (70%) and me $280k. But nothing real changed—the patent was never feasible! Why should my share suffer?  

  **Ana:** Because the patent was context! It explained my high ceiling. Without it, KS adjusts proportionally. Nash would ignore the change, still giving you $380k. But that’s cold—it erases why I bargained harder.  

  **Ben:** Or it focuses on what’s real. The patent was vapor.  

  **Both agree** the decisive thought experiment is: *If Ana’s utopia vanishes post-agreement, should Ben’s share change?*  
  - **Ana (KS):** Yes—it reflects shifting equity.  
  - **Ben (Nash):** No—fairness is static, anchored to the feasible.  

  *They shake hands, split the cash $580k/$220k (KS compromise), but Ana shoulders the consulting. The whiteboard stays, axioms unresolved.*
