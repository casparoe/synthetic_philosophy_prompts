prompt: |-
  I'm a novelist by trade, and I sit on the curriculum committee of a small international writers' residency: twenty fiction writers, three months, a dozen nationalities in any given cohort. Our feedback culture has become a live institutional problem, and I've been asked to bring a proposal to our January meeting. Last summer, a Dutch participant, extending what she sincerely considered the respect owed to a professional, told a Japanese participant in open session that his manuscript's first hundred pages were unreadable and should be restarted from zero; he took it as a public dismantling and scarcely left his room for a week. The same Japanese participant, meanwhile, had spent two months assuring her that her chapters were very interesting — which she received as encouragement and which he intended as a gentle no. Two committee members now propose a codified norm of frank, professional critique on the Northern European model, arguing that hedged feedback is a tissue of white lies that squanders the residency's one irreplaceable resource, which is time. Two others propose instead teaching an explicit translation layer — a glossary mapping politeness registers onto intended degrees of severity — on the theory that indirectness is itself a channel of information, and that bluntness merely exports one culture's conversational norms under the banner of universal professionalism. A fifth member wants a mandated praise-criticism-praise structure, which I privately think of as the bureaucratic criticism sandwich. My own view, which I cannot yet make coherent, is that the white lies were wrong and the bluntness was also wrong. Please draft the decision memo I will circulate before the meeting: it must recommend one concrete policy for next year's cohort, give the strongest consideration on the losing side a genuinely fair hearing rather than a paragraph of throat-clearing before dismissal, and — this matters to me — it must keep clearly separate what is actually settled in our understanding of lying and deception from what philosophers genuinely contest among themselves, for instance whether every lie is wrong, or whether a paternalistic lie can express respect for a person rather than deny it, so that the committee does not mistake one position in an ongoing argument for the settled consensus. Format: exactly five numbered items, each a sentence or two, no introduction and no conclusion.
reasoning: |-
  Hmm, the user is a novelist on a curriculum committee for an international writers' residency. They're dealing with a feedback culture crisis after a cultural misunderstanding between participants - a Dutch writer gave brutally honest feedback that devastated a Japanese writer, while the Japanese writer's polite indirectness was misinterpreted as encouragement. The committee is divided on solutions: some want blunt Northern European-style critique, others propose cultural translation guides, and one wants the praise-criticism-praise sandwich approach.

  The user needs me to draft a decision memo recommending one concrete policy. Key requirements: it must be exactly five numbered items, no intro/conclusion, give fair hearing to the strongest opposing view, and clearly separate settled philosophical truths about lying from ongoing debates. The user wants to avoid framing indirectness as "white lies" or bluntness as universally professional.

  This is a complex intercultural communication issue. The Dutch participant likely operated under low-context norms where directness equals respect, while the Japanese participant used high-context communication where indirectness preserves harmony. Both approaches have validity but clashed disastrously here.

  The memo should recommend cross-cultural training as the solution - not because it's a compromise, but because it fundamentally addresses the root problem. The "translation layer" proposal comes closest but needs reframing. The philosophical distinction is crucial: while Kant argued all lies are wrong, most contemporary ethicists recognize contextual nuance - like how indirect criticism might show respect by avoiding humiliation. The memo must clarify that no position represents absolute truth.

  For structure: Item 1 states the problem neutrally. Item 2 gives the losing view (blunt critique) its strongest argument about time efficiency. Item 3 presents the chosen solution with rationale. Item 4 separates philosophical settled/contested points. Item 5 details implementation. The bureaucratic criticism sandwich gets omitted since it's not seriously contended - it would just paper over cultural differences.

  Implementation specifics: workshop with concrete examples, glossary of intent (not just phrases), plus individual feedback options. Emphasize this isn't about ranking cultures but building shared understanding. The tone stays professional yet humane - after all, these are artists who've been wounded by miscommunication.
answer: |-
  **Decision Memo: Residency Feedback Protocol**  

  1.  **Problem Statement:** The residency's feedback culture has caused significant distress due to unspoken cross-cultural differences in interpreting directness and politeness, exemplified by the Dutch participant's blunt critique being received as devastating and the Japanese participant's indirectness being misinterpreted as encouragement.  
  2.  **Strongest Case for Codified Frankness:** The primary argument for adopting a universal norm of blunt, Northern European-style critique is that indirect or hedged feedback fundamentally wastes the residency's irreplaceable time resource by obscuring actionable truth, mistaking perceived kindness for professional respect.  
  3.  **Recommended Policy:** The residency will implement mandatory cross-cultural feedback training at orientation, focusing on *intent recognition*; this includes explicit instruction on interpreting indirect communication (e.g., "interesting" as potential soft rejection) and calibrating directness (e.g., framing severe critique privately), supplemented by an optional intent-mapping guide for common phrases.  
  4.  **Philosophical Clarification:** While it is settled that deception can cause harm and undermine trust, *philosophy contests* whether all indirectness constitutes a "lie," whether paternalistic indirectness inherently disrespects autonomy, or whether bluntness in a multicultural context is universally "honest" rather than culturally specific; our policy avoids prescribing a single moral truth on lying, focusing instead on shared understanding.  
  5.  **Implementation:** The training workshop will use anonymized residency examples (like the cited incident), role-playing, and a collaboratively built glossary mapping phrases to *probable intent within specific cultural frameworks*; facilitators will emphasize flexibility, private channels for major critiques, and that "professional respect" requires accommodating diverse expressive norms.
