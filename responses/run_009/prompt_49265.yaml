prompt: |-
  I lead a small team fine-tuning a language model for competition math and code, and I have two weeks to decide how to spend a fixed labeling budget. For outcome labels I'm set: final answers can be checked automatically and essentially for free, so I can generate as many of those as compute allows. For process labels I have two options, both unappealing — human annotators grading each reasoning step against a rubric (expensive, slow, and noisy about what even counts as a "good" step), or a stronger model acting as a judge of intermediate steps (cheap and dense, but I've watched it reward reasoning that merely mimics its own stylistic tics, and I can't verify whether a step-level label is tracking the actual cause of the final answer rather than surface plausibility).

  One teammate argues that outcome-only supervision will let the model learn spurious shortcuts and produce right answers for wrong reasons — including fluent reasoning chains that are fabricated after the fact rather than genuinely driving the solution — so supervising the process is the only way to know we're getting correctness for the right reasons. Another argues that outcome supervision at scale discovers reasoning strategies better than anything a rubric or a judge could encode, that rubrics mostly launder the judge's preferences into our model, and that a procedure that reliably yields correct answers just is good reasoning for our purposes; anything more is asking the data to certify something no labeler can actually see.

  Before I commit: what is the real disagreement here, and which parts of it can be settled by evidence we could gather versus which are genuinely philosophical? Is it about whether correct reasoning is constitutive of mathematical correctness or merely instrumentally valuable, about which failure mode (silent shortcut learning versus bias laundering from the process judge) is more damaging and harder to detect downstream, or about something else entirely? And is there a principled middle path, or does any hybrid scheme just inherit the weaknesses of both while giving us a hyperparameter to argue about?
reasoning: |-
  Okay, the user is leading a small team working on fine-tuning a language model for competition math and coding. They have a fixed labeling budget and two weeks to decide how to spend it. The main issue is whether to use outcome-only supervision (which is cheap) or process supervision (which is expensive and noisy). 

  First, I need to understand the core of their dilemma. They can generate tons of outcome labels for free since final answers are checkable automatically. But process labels are tricky: human annotators are slow, expensive, and inconsistent, while using a stronger model as a judge is cheap but might just reinforce its own biases without verifying if the reasoning steps are genuinely causing the correct answer.

  The user's teammates are split. One believes that without process supervision, the model will learn shortcuts and produce correct answers with flawed reasoning. The other argues that outcome supervision at scale will naturally discover better reasoning strategies than any rubric, and that correct answers are what matter. 

  So, what's the real disagreement here? It seems like it's partly about epistemology—what constitutes "good reasoning" in math. Is it the internal correctness of each step, or just the outcome? But also practical: which failure mode is worse? Shortcut learning could lead to brittle models that fail in unseen cases, while biased process judges might create models that mimic style over substance.

  The user needs to know if this is philosophical or if evidence can help. Some parts are testable. For example, they could sample and analyze cases where outcome-supervised models fail versus where process-supervised models have misaligned rewards. Hyperparameter tuning in hybrids might be messy, but a phased approach could help: start with outcome, then use process on harder problems.

  The user's deeper needs might include ensuring model robustness for competition settings, where problems are novel and shortcuts won't work. They might also want efficiency—maximizing their budget without wasting resources. There's also a risk management angle: which error is harder to detect and fix later? Silent shortcuts might only show up in deployment, while judge bias might be noticeable earlier.

  A middle path could involve outcome supervision first, then targeted process labels on problems where the model struggles. Using the stronger model as a generator for synthetic data but validated by humans could be another option. The key is balancing cost and effectiveness, focusing on the most critical failure points.
answer: |-
  Your dilemma cuts to the heart of modern LLM alignment and reveals a fundamental tension in supervision strategies. Here’s a breakdown of the disagreement, testable hypotheses, and potential paths forward:

  ### The Core Disagreement: Epistemology vs. Instrumentalism
  1.  **Epistemological Stance (Pro-Process):**  
      Believes that *mathematical truth requires justified reasoning*. A correct answer without valid steps is epistemically hollow—it might be lucky guesswork, memorization, or fabrication. Supervision must target the *causal mechanism* (reasoning steps) to ensure robustness against novel problems and avoid "stochastic parrots" generating convincing nonsense. Failure mode: **silent shortcut learning** (e.g., memorizing answer patterns, exploiting dataset biases).

  2.  **Instrumentalist Stance (Pro-Outcome):**  
      Believes that *correct answers are the ultimate goal*, and any process yielding them reliably is valid. Rubrics/judges impose subjective human/AI biases ("stylistic tics") rather than revealing truly optimal reasoning. At scale, outcome supervision discovers *emergent reasoning strategies* that outperform predefined rubrics. Failure mode: **bias laundering** (rewarding reasoning that pleases the judge but doesn’t generalize).

  ### Testable vs. Philosophical Elements
  - **Settled by Evidence:**  
    - **Shortcut Prevalence:** Run experiments:  
      - Train *identical models* with outcome-only vs. process supervision (using your stronger model as judge).  
      - Evaluate on *held-out problems*, especially **counterfactuals** (e.g., perturb problem details to break memorization).  
      - Measure: Accuracy drop on counterfactuals (indicates shortcuts) vs. consistency of step quality (indicates judge bias).  
    - **Judge Alignment:** Sample problems where the process-supervised model succeeded. Use *human annotators* to audit:  
      - Did steps *actually lead* to the answer?  
      - Would humans rate steps highly under a neutral rubric?  
      Correlation between judge/human ratings reveals bias severity.  
    - **Scaling Laws:** Compare marginal returns:  
      - Add incremental budget to outcome labels (scale up 10x) vs. process labels (add 20% more step judgments).  
      - Which improves accuracy on *novel, hard problems* more?  

  - **Philosophical/Unsettleable:**  
    - **"What is good reasoning?":** If humans disagree on rubric criteria (e.g., "Is skipping trivial steps acceptable?"), no judge—human or AI—can resolve this objectively.  
    - **Instrumentalism vs. Rigor:** Is a model that solves problems via unorthodox but correct "shortcuts" (e.g., pattern matching) *worse* than one using human-like deductive steps? Depends on whether you value transparency or pure efficacy.  
    - **Causal Attribution:** Can we ever *prove* a step "caused" the answer? This is fundamentally unobservable (counterfactual reasoning required).  

  ### Failure Mode Trade-offs
  | **Risk**               | Outcome-Only Supervision          | Process Supervision               |
  |-------------------------|-----------------------------------|-----------------------------------|
  | **Primary Failure**     | Silent shortcuts (brittle on novel problems) | Bias laundering (reasoning style over substance) |
  | **Detectability**       | Hard (fails silently on edge cases) | Easier (audit step judgments)     |
  | **Downstream Impact**   | Catastrophic (wrong answers with high confidence) | Gradual degradation (reasoning quality drifts) |
  | **Cost to Mitigate**    | High (retrain with better data)   | Medium (tweak rubric/judge)       |

  ### A Principled Middle Path: Targeted Hybrid Approach
  Avoid a naïve 50/50 split. Instead:  
  1. **Anchor on Outcomes:** Use your free outcome labels to train the initial model at massive scale.  
  2. **Identify Weaknesses:** Use this model to generate solutions for *diverse problems*. Flag:  
     - High-confidence incorrect answers (logic errors)  
     - Correct answers with low-step-confidence (potential shortcuts)  
  3. **Strategic Process Supervision:** Allocate budget *only* to:  
     - **High-value problems:** Counterfactuals, historically hard problems, or cases where outcome-supervised model struggled.  
     - **Critical steps:** Verify steps where divergence leads to wrong answers (e.g., key inferences in proofs).  
  4. **Judge + Human Calibration:**  
     - Use your strong model to *generate* step evaluations (cheap).  
     - Have humans audit a *small random sample* + *all low-confidence judgments*.  
     - Continuously fine-tune the judge model on human audits.  

  ### Why This Works
  - **Cost-Effective:** Focuses process supervision where it matters most.  
  - **Mitigates Both Risks:** Outcome scaling discovers strategies; targeted process supervision patches reasoning flaws.  
  - **Auditable:** Human oversight on judge model reduces bias laundering.  

  ### Key Decision Factors for Your Team
  1. **Problem Novelty:** If competition problems are highly unique (low memorization), outcome-only may suffice. If they test known concepts in novel ways, process helps.  
  2. **Judgment Quality:** Pilot-test your strong model judge against 100 human-graded steps. If agreement is >90%, trust it; else, budget for human oversight.  
  3. **Urgency vs. Long-Term:** If shipping fast is critical, lean outcome-only. If this is foundational for future models, invest in process.  

  > **Bottom line**: The disagreement is both practical (which failure hurts more) and philosophical (what "good reasoning" means). **Gather evidence now**: Run a 48-hour test training two small models (outcome-only vs. process-with-judge) on subsets of your data. Evaluate them on counterfactuals and step validity. Let the data resolve the tactical debate—then use your remaining budget strategically.
