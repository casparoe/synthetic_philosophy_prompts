       - Coin-flip (before flip): No predictor mentioned; state not fixed → CDT → accept based on expected value (positive if payout > payment).

  2. **Fixed State with Predictive Intent Rule**:
     - If the outcome depends on a fixed state (unchangeable at choice time) set by a predictor intending to anticipate your action, and the predictor’s accuracy is high (e.g., >90%), use **EDT**.
