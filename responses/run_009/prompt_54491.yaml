  ## The Recognizer's Refrain

  First, the printer's perfect curve and spine:  
  a globe with stem, precise as latitude,  
  no flourish left to chance or mood.  

  *I know you by the light behind my eyes.*  

  Then, the ransom-note jagged and askew,  
  a frantic cut from Gothic, serif-torn,  
  a silhouette at dawn, forlorn.  

  *I know you by the light behind my eyes.*  

  A child's hand trembles, loop reversed,  
  a sailing boat on wobbly seas,  
  a glyph adrift on uncertainty's breeze.  

  *I know you by the light behind my eyes.*  

  Here, dancers sprawl on summer grass:  
  one arching back, one curled below –  
  a sudden glyph the wind might blow.  

  *I know you by the light behind my eyes.*  

  That water tower's rusted frame at three,  
  casts shadow-parts – a curve, a bar –  
  an accidental alphabet afar.  

  *I know you by the light behind my eyes.*  

  See fingers trace the humid air,  
  a ghostly loop, a downward stroke,  
  a thought the empty sky evokes.  

  *I know you by the light behind my eyes.*  

  And @, the merchant's hurried scrawl,  
  an 'a' embraced by swirling tides,  
  where meaning shifts and yet abides.  

  *I know you by the light behind my eyes.*  

  But here, wet concrete, fresh and grey:  
  A loop begun, but left undone –  
  an open mouth that drinks the sun.  
  Is this an **a**? Or **o** begun?  
  The trowel scrapes 'cat'... and now the shape is won.  

  *I know you by the light behind my eyes.*  

  ---

  **Notes on your specifications:**

  *   **Refrain:** "I know you by the light behind my eyes" acts as the invariant – the recognition itself, internal and constant, regardless of the wildly varying external form.
  *   **Stanza Variety:** Includes the requested examples (printer's/Futura-like, ransom-note, child's, finger-trace, @) plus invented ones (party dancers, water tower shadow). The wet concrete stanza introduces ambiguity resolved by context.
  *   **Philosophical Ambiguity:** The refrain points to the *act* of recognition ("light behind my eyes"). The final stanza forces context to decide the identity, suggesting the system/role is crucial *too*. The core question – shape, system, or recognition? – remains poetically unresolved.
  *   **Standalone Poem:** Uses concrete imagery and rhythmic flow. The central mystery of recognition is accessible without needing the philosophical background.
  *   **Form:** Tercets (mostly) building to a final quatrain for the ambiguous 'a', with the unchanging refrain line after each.
