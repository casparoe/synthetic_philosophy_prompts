answer: |-
  **Subject: Exciting Updates to GroupHarmony! Introducing Honest Balloting™**  

  Dear GroupHarmony User,  

  We’re always striving to make group decisions more authentic, efficient, and *you*! That’s why we’re thrilled to unveil **Honest Balloting™**, our latest innovation designed to eliminate strategic voting once and for all. With Honest Balloting, no user can ever gain an advantage by misreporting their preferences—ensuring every vote reflects true intentions. Think of it as truth serum for your team’s scheduling and polling needs!  

  To deliver this ironclad guarantee, we’ve simplified our voting process for your convenience. Below are the key updates to our Terms of Service (effective next month). These changes empower Honest Balloting while keeping GroupHarmony delightfully intuitive. By continuing to use our app, you agree to these terms. Let’s dive in!  

  **1. Ballot Simplification Protocol (Section 4.2)**  
  To enhance clarity and honesty, all ballots in Honest Balloting mode now support exactly two options per vote. This streamlined approach reduces cognitive load and guarantees truthfulness—no more "spoiler effect" anxieties! For decisions involving three or more alternatives, simply run sequential ballots (e.g., Option A vs. B, then the winner vs. C). We call this "Tournament Mode," and it’s as fun as it is fair!  

  **2. Single-Peaked Preference Certification (Section 7.3)**  
  Honesty starts with alignment! Users must now certify that their preferences are "single-peaked" along a predefined left–right axis (e.g., "Early Lunch" to "Late Dinner" for timing polls). During setup, you’ll rank options on this axis. If a user’s *actual* preferences violate single-peakedness (e.g., ranking "Noon" first but "3 PM" above "1 PM"), our TruthScope® algorithm will automatically "nudge" their ballot to the closest compliant ranking. This ensures mathematical harmony without compromising intent!  

  **3. Decider of Record Appointment (Section 8.1)**  
  Meet your group’s new integrity anchor: the Decider of Record (DoR)! Each team must designate one DoR (rotated quarterly for freshness). In Honest Balloting mode, the DoR’s *sincerely reported* preferences become the official preferences for all users. This unified perspective eliminates strategic incentives—after all, teamwork makes the dream work! (Note: The DoR is selected via a standard two-option poll. Easy!)  

  **4. Dispute Resolution: Lucky Decider Boost! (Section 9.5)**  
  Deadlocks are now opportunities for excitement! If a vote ends in a tie—or if Tournament Mode stalls—GroupHarmony activates **Lucky Decider Boost™**. This feature randomly selects one user (using our cryptographically secure RNG) to become the temporary "Lucky Decider." Their preference instantly resolves the vote, turning gridlock into a moment of serendipity! It’s democracy, but with a delightful twist of fate.  

  **5. Honesty Guarantee Scope (Section 11.7)**  
  Our promise—that no user benefits from misreporting—applies exclusively to ballots with *precisely two alternatives*. For votes with fewer or more options, standard voting rules apply without this guarantee. This focused approach allows us to deliver unmatched integrity where it matters most!  

  We’re confident these updates will make your group decisions smoother, truer, and more GroupHarmony-ish than ever. Questions? Visit our FAQ or contact support@group-harmony.io.  

  Here’s to honest choices and happier teams!  

  Warmly,  
  The GroupHarmony Team  

  ---  

  **Why this works for social choice theorists:**  
  - **Two-option cap** (Clause 1) mirrors the only universally strategy-proof rule: majority vote on two alternatives.  
  - **Single-peaked requirement** (Clause 2) alludes to a key domain restriction where strategy-proofness *is* possible (if preferences are single-peaked, rules like median voting work). The "nudge" covers violations.  
  - **Decider of Record** (Clause 3) invokes a "fixed dictator"—one of the theorem’s escape hatches.  
  - **Random dictatorship** (Clause 4) is another escape route, framed as a "feature."  
  - **Liability limitation** (Clause 5) explicitly restricts guarantees to two-option menus, acknowledging the theorem’s core constraint.  
  The email never names Gibbard-Satterthwaite but accurately implements its "loopholes" with deadpan corporate flair.
