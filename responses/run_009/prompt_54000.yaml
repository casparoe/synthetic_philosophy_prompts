  ---

  **Subject: Important Update: Introducing Honest Balloting and Revised Terms**

  Dear Valued GroupHarmony User,

  We're always innovating to make group decision-making more truthful, efficient, and harmonious. That’s why we’re excited to introduce **Honest Balloting™**, a revolutionary new feature that ensures no user can ever gain an advantage by misrepresenting their preferences. With Honest Balloting, your group’s choices will be more authentic and reliable than ever before!

  To deliver on this promise, we’ve made some enhancements to our platform that simplify the voting process. These changes are outlined in our updated Terms of Service, effective 30 days from today. We’ve distilled the key points below for your convenience. By continuing to use GroupHarmony, you agree to these updates.

  **1. Streamlined Ballot Options (Clause 4.2.a)**  
  To minimize complexity and maximize honesty, all ballots in Honest Balloting mode are now limited to exactly two options. This focused approach ensures that every vote is clear-cut and free from strategic manipulation. You can still run multiple ballots in sequence to narrow down from a larger set — think of it as a tournament of truth!

  **2. Preference Certification (Clause 7.1.d)**  
  For ballots with more than one option (but note: per Clause 4.2.a, always exactly two!), each user must now certify that their preferences are “single-peaked” along a predefined left–right axis. This axis will be clearly displayed during voting. If, after certification, a user’s preferences are found to violate single-peakedness (e.g., through a dispute under Clause 9), their vote will be automatically adjusted to the closest single-peaked preference ordering, as determined by our proprietary algorithm. This ensures consistency and honesty across the board.

  **3. Decider of Record (Clause 8.3)**  
  To further enhance integrity, every group must designate one member as the “Decider of Record” (DoR). The DoR’s sincere preference ranking (as self-reported at the start of each ballot) will serve as the official preference ranking for all group members in the Honest Balloting mode. This unified approach eliminates strategic incentives by aligning everyone’s interests. Don’t worry — the DoR can be rotated monthly for fairness!

  **4. Dispute Resolution: The Lucky Decider™ (Clause 9.5)**  
  In the rare event of a deadlock (such as a tie in a two-option ballot or a multi-ballot sequence that stalls), GroupHarmony introduces an exciting new feature: the Lucky Decider™! The Lucky Decider is chosen at random from the group, and their preference becomes the group’s decision. This feature adds a thrilling element of chance while preserving the core honesty guarantee. Plus, it’s certified fair by our quantum-random number generator!

  **5. Scope of Honesty Guarantee (Clause 11.8)**  
  Our Honest Balloting guarantee — that no user benefits from misreporting — applies only to ballots presenting exactly two alternatives. For ballots with fewer or more options, standard voting rules (without honesty guarantees) will apply. We believe this focused guarantee provides the optimal balance of simplicity and integrity.

  We’re confident these updates will make your group decisions smoother and more trustworthy. As always, we appreciate your trust in GroupHarmony.

  Sincerely,  
  The GroupHarmony Team

