  We are writing a parody of a "Terms of Service update" email from a group-decision app. The app is introducing a new "honest balloting" mode that supposedly prevents users from benefiting by misreporting preferences. The fine print must acknowledge the Gibbard-Satterthwaite theorem without naming it, by including clauses that cap ballots at two options, require single-peaked preferences, appoint a "Decider of Record", and include random dictatorship for deadlocks. The liability clause limits guarantees to two-alternative menus.

  The email should be deadpan, corporate, and breezy. The humor comes from the clauses being real escape routes from the theorem, presented as features. We'll structure it with a preamble and numbered clauses.

  Word count: about 600 words.

  Let's outline:

  1. **Preamble**: Cheerful announcement of the new "honest balloting" feature, emphasizing how it ensures truthfulness. Use corporate buzzwords.

  2. **Clause 1: Ballot Limitation**: Limit to two options per ballot. Present it as a simplification.

  3. **Clause 2: Single-Peaked Preferences**: Require users to certify their preferences are single-peaked along a left-right axis. Include what happens if they aren't.

  4. **Clause 3: Decider of Record**: Appoint one user whose ranking is everyone's ranking. Frame it as a feature.

  5. **Clause 4: Dispute Resolution (Random Dictatorship)**: Break deadlocks by randomly selecting a dictator. Present it as exciting.

  6. **Clause 5: Liability Limitation**: State that the guarantee only applies when there are exactly two alternatives.

  Now, write in a corporate email tone, deadpan, never admitting there's a problem. Call the app something like "ConsensusCalendar" or "GroupHarmony". Let's go with "GroupHarmony".

