prompt: |-
  I'm a grad student TAing an intro epistemology course, and after spring break I have to run a fifty-minute section on higher-order evidence and epistemic akrasia. I know the material fine myself but I've never taught it, and last weekend I got a preview of where my students will be: my roommate (psych major, no philosophy background) and I argued about it for like two hours. Her position was basically "if you did the work yourself, some outside signal saying you're probably wrong is just noise — trust your own reasoning," and when I pushed back she said what I was describing sounded like gaslighting yourself, or like I was telling people to just be insecure. She eventually conceded around hour two, but honestly I could not tell you how I got her there, which is a problem since that's now my job.

  So don't explain akrasia to me — plan the section. What has to be in place before the question even makes sense to a nineteen-year-old (I'm guessing the first-order vs higher-order distinction, but tell me if that's right and which one comes first), and what single example should carry the whole thing. I was thinking of the student who carefully checks her exam answers, feels confident, and then overhears the TA say half the class made the exact same mistake on question 3 — but tell me if there's a better carrier, and what the example needs to have and needs to lack. Then the misconceptions: I can already predict "higher-order evidence is just more evidence" and "steadfast just means never changing your mind," but there are surely ones I can't see coming from inside this, and I want to know where in the sequence each one should get headed off, not just that it exists. Also what I should openly refuse to cover in fifty minutes and say so out loud (the peer disagreement lit? any of the formal stuff? the akrasia vs. Moore-paradoxical belief tangle?), and one question I can ask at the end that would seperate the students who actually got it from the ones who just nodded along. My roommate is proof it can land — I just need it to happen in under an hour, and on purpose.
reasoning: |-
  Okay, let me start by unpacking this TA's request. They need to teach a 50-minute section on higher-order evidence and epistemic akrasia to intro epistemology students. The main challenge is making these abstract concepts accessible to undergrads with limited philosophy background. 

  Hmm, their roommate's reaction is telling—the "gaslighting yourself" comment shows how counterintuitive akrasia can feel. That means I should prioritize:
  - Preventing defensive reactions by framing akrasia as rational rather than pathological
  - Choosing an example that forces students to viscerally feel the tension
  - Structuring the progression so concepts build naturally

  The exam example they proposed works because:
  - Students have lived this (immediate relevance)
  - It cleanly separates first/higher-order evidence
  - The TA's comment creates undeniable rational pressure

  But I should tweak it slightly:
  - Make the mistake specific (e.g., confusing necessary/sufficient conditions)
  - Add that she double-checked that question specifically
  - Have the TA say "many strong students" made the error (avoids "well I'm not average!" objections)

  Biggest structural risks:
  - Spending too long defining "evidence" (must stipulate)
  - Letting discussion veer into peer disagreement literature
  - Missing the transition from "this feels weird" to "but it's rational"

  Key teaching moves:
  - Explicitly refuse to cover peer disagreement (say it out loud)
  - Pre-empt "just average" objections in example design
  - Use whiteboard to lock in distinctions before introducing tension

  The killer question at the end needs to target whether they grasp why steadfastness isn't always virtuous. Maybe: "Could rationally believing P while thinking your belief is irrational ever feel like integrity?" That forces synthesis.

  ...Wait, should I address why this isn't Moore-paradoxical? Probably not—their instinct to avoid that is right. Fifty minutes is tight enough.
answer: |-
  Here's a battle-tested 50-minute lesson plan focusing on accessibility, conceptual scaffolding, and predictable misconceptions—built from your exam example (which is excellent, with tweaks). Prioritize depth over breadth: **explicitly cut peer disagreement literature, formal models, and Moore-paradox comparisons** by announcing upfront: "Today's goal is understanding *why* higher-order evidence creates tension—we won't resolve debates or cover adjacent topics."

  ---

  ### **Lesson Plan: Higher-Order Evidence & Epistemic Akrasia**
  **Total: 50 mins**  
  *(Target: Undergrads with basic evidence/justification concepts)*  

  ---

  #### **Phase 1: Foundations (15 mins)**  
  **Goal:** Make "first-order vs. higher-order evidence" intuitive *before* introducing tension.  
  - **Hook (2 min):** "You studied hard, aced a practice test, feel 95% sure you got an A. Walking out, you overhear the prof say *‘Half the class misinterpreted the core argument on Q3.’* Does that change your confidence? *Why?*" (Poll thumbs up/down/sideways; no debate yet).  
  - **Define & Distinguish (10 min):**  
    - **First-Order Evidence (FOE):** *Direct* reasons supporting a belief.  
      *Example:* Your calculations, textbook definitions, lecture notes for the exam.  
    - **Higher-Order Evidence (HOE):** Evidence *about your handling* of FOE.  
      *Example:* TA’s comment (not about the answer itself, but about *your ability to assess it*).  
    - **CRITICAL:** Use whiteboard to map your exam example:  
      ```  
      BELIEF: "My answer to Q3 is correct."  
      FOE: ← Your reasoning, checked twice.  
      HOE: ← TA's comment about class errors.  
      ```  
  - **Misconception Pre-emption:** "HOE isn’t *more* FOE—it’s *meta*. It doesn’t make your answer wrong; it suggests your confidence might be misplaced."  

  ---

  #### **Phase 2: The Akrasia Tension (20 mins)**  
  **Goal:** Show HOE forces a rational dilemma.  
  - **Refine Your Example (5 min):**  
    - *Student: "I spent 10 mins on Q3—it asked for a necessary condition, and I cited the textbook definition. I’m sure I’m right."*  
    - *HOE: TA says, "Half the class missed Q3—they confused necessary/sufficient conditions, even the strong students."*  
    - **Key tweaks:**  
      - Student’s FOE is *strong and specific* (closes "lazy reasoning" objections).  
      - HOE *targets the exact mistake* she worked to avoid (creates direct conflict).  
      - HOE notes "*strong students*" failed (avoids "I’m not average!" dismissals).  
  - **Introduce Akrasia (10 min):**  
    - *Rational Response 1 (Steadfast):* "I trust my work—the HOE is noise."  
    - *Rational Response 2 (Conciliate):* "HOE suggests my confidence is unreliable—I should doubt."  
    - **Akrasia:** The state of *rationally* believing P *while rationally believing* your belief in P is irrational.  
      - *In the example:* "My answer is correct (based on FOE), but I shouldn’t believe it’s correct (based on HOE)."  
  - **Gaslighting Defense (5 min):**  
    - **Acknowledge:** "This feels like self-betrayal! If FOE is solid, why cave to HOE?"  
    - **Reframe:** "HOE isn’t gaslighting—it’s a *rational warning sign*. Even experts audit themselves when new data suggests blindness (e.g., pilots rechecking instruments after turbulence)."  

  ---

  #### **Phase 3: Misconceptions & Why Akrasia Isn’t Absurd (10 mins)**  
  **Goal:** Isolate core insights and disarm objections.  
  - **Predictable Misconceptions & Fixes:**  
    - **"HOE is just more evidence!"** → Re-map to the whiteboard: "Does the TA’s comment *refute your answer*? No—it critiques your self-assessment."  
    - **"Steadfast = never changing your mind!"** → Clarify: "Steadfastness is *reasonable* only if HOE is irrelevant *or* you’ve vetted its source (e.g., the TA is unreliable)."  
    - **"Akrasia = being insecure!"** → Contrast: "Insecurity is *unfounded* doubt. Akrasia is *rational* tension—your evidence *conflicts*."  
  - **Why Akrasia Isn’t Nonsense:** Use a *medical analogy*:  
    > "A doctor diagnoses X based on symptoms (FOE). Then she learns her meds that morning cause hallucinations (HOE). She rationally believes X *is* the diagnosis (FOE), but also that she *shouldn’t trust* that belief (HOE)."  

  ---

  #### **Phase 4: Assessment & Wrap-Up (5 mins)**  
  **Goal:** Cement the dilemma and check understanding.  
  - **Killer Question:**  
    > **"Can you rationally believe P *and* rationally believe you shouldn’t believe P? If yes, does that mean one piece of evidence 'wins'?"**  
    - *Why it works:* Forces students to articulate akrasia *as rational*. Correct answers acknowledge the *dilemma without resolution* (e.g., "Yes—HOE doesn’t erase FOE, but it undermines your access to it").  
  - **Closing:** "Akrasia exposes a crack in rationality—sometimes evidence traps us in conflicting duties. Next week, we’ll see how philosophers try to 'escape' it."  

  ---

  ### **Why This Works**  
  - **Scaffolding:** FOE/HOE distinction must come *first*; akrasia only makes sense after HOE is seen as *distinctly destabilizing*.  
  - **The Example:** Yours is ideal—**add specificity** (e.g., "necessary condition confusion") to prevent "I’d just recheck!" evasions.  
  - **Misconception Timing:** Address "HOE=more evidence" in Phase 1; "steadfastness=stubbornness" in Phase 2; "akrasia=insecurity" in Phase 3.  
  - **What to Cut:** Declare early: "No time for peer disagreement, formal logic, or Moore today—focus on the core puzzle."  

  Your roommate conceded because she felt the *weight* of HOE in a relatable case—leverage that. If students grok that akrasia is *rational self-doubt* (not neurosis), you’ve won.
