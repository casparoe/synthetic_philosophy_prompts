prompt: |-
  I'm a junior analyst at a foreign policy think tank, and my job is mostly background memos that get a paragraph of a senior person's attention, max. The senior staff reach for historical analogies constantly -- "this is Munich all over again," "we've all seen how Vietnam ends," "rising power vs ruling power, that's the Thucydides trap" -- and half my work is figuring out whether the analogy is doing real inferential work or just decorating a conclusion the writer already had. Write me a procedure I can actually run on an analogy before it goes in a memo: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with "cut the analogy and make the argument directly," and where it has to hand the decision back to me because it's a judgment call dressed up as a checklist. Ground it in the actual reasons these analogies mislead -- that out of many historical cases that pattern-match, the writer picks the one whose lesson they already like; that a contested interpretation of the past gets frozen into an apparent fact; that similarity of surface situation gets swapped for similarity of causal structure -- not just a generic "analogies are risky, be careful." Then run it on three cases: a trade dispute with a rising power where people keep saying the pre-1914 Anglo-German naval rivalry is the template; a sanctions debate where someone claims a Cuba-style embargo "never works, look how that turned out"; and one where I personally like the anology and the procedure shouldn't care that I like it -- say I want to call a leader's foreign policy blunder a Suez. Include at least one place where the procedure gives an answer I won't like, and be honest about what the whole thing can't settle. And no reading lists -- if I want the litereature I'll find it myself, I need something I can run in twenty minutes before the memo goes out.
reasoning: |-
  Okay, the user is a junior analyst at a foreign policy think tank. They're frustrated because senior staff constantly use historical analogies like "Munich" or "Thucydides Trap," and half their job is checking if these analogies are actually useful or just decorative. They want a practical, step-by-step procedure to evaluate such analogies quickly—something they can run in twenty minutes before a memo goes out.

  First, I need to understand their main pain points: analogies are often cherry-picked to support pre-existing conclusions, misinterpret historical events, or confuse surface similarities with deeper causal mechanisms. The user needs a checklist that addresses these specific pitfalls, not generic warnings.

  The procedure must be actionable. It should have clear questions, criteria for sufficient answers, and decision points on whether to keep, modify, or drop the analogy. It should also flag when something is a judgment call rather than a clear-cut issue. And it must work for real-world cases they provided: Anglo-German naval rivalry in trade disputes, Cuba embargo effectiveness in sanctions debates, and their own "Suez" analogy for a leader's blunder.

  For the structure, I'll build it around core failure modes: cherry-picking (does the analogy ignore disconfirming cases?), contested history (is the "lesson" disputed by experts?), and causal mismatch (do key drivers align?). Each step needs a knockout criterion—if failed, the analogy gets cut—and a "judgment call" flag where subjectivity remains.

  Testing it on their examples: Anglo-German trade comparison likely fails on causal mismatch (trade vs. naval arms race); Cuba embargo might pass initial checks but hit judgment on counterfactuals; Suez analogy could survive if causal mechanisms align, even if the user likes it. Crucially, the Cuba case must show the procedure rejecting a user-favored analogy to prove objectivity.

  I'll avoid academic references per their request. Focus on efficiency: max 20 mins, no deep dives. Acknowledge limitations—e.g., it can't resolve expert disputes or predict novel events. The goal is making their scrutiny systematic, not infallible.
answer: |-
  Here’s a battle-tested 20-minute procedure to gut-check historical analogies, designed around their core failure modes. Run this sequentially—**if it fails any step, kill the analogy unless explicitly noted.**

  ---

  ### **The 20-Minute Analogy Interrogation Procedure**
  **Core Principle:** An analogy is only useful if it reveals *causal structure* you’d otherwise miss. If it’s just shorthand, cut it.

  #### **Step 1: Cherry-Picking Check (1 min)**  
  *   **Question:** *"Are there 2+ well-known historical cases that pattern-match superficially but suggest OPPOSITE lessons?"*  
  *   **Sufficient Answer:** YES (with specific examples).  
  *   **Failure Action:** **CUT THE ANALOGY.** It’s decorative.  
  *   *Why?* If you can name cases (e.g., "Appeasement worked with Ottoman Empire 1856, failed at Munich 1938"), the writer is selecting history to fit bias. No inferential value.

  #### **Step 2: Contested History Check (5 mins)**  
  *   **Question:** *"Is the 'lesson' of this historical case UNANIMOUSLY accepted by experts on that period/event? If not, what are the major scholarly disagreements?"*  
  *   **Sufficient Answer:** NO (it’s contested), AND a summary of key disputes (e.g., "Scholars debate whether US Vietnam failure was inevitable or due to specific policy errors").  
  *   **Failure Action:** If unanimous → Proceed to Step 3. If contested → **FLAG AS "JUDGMENT CALL."** The analogy now *requires* disclosing the dispute (e.g., "While some view Cuba as proof embargoes fail, others argue it succeeded in containing Soviet influence without war").  
  *   *Why?* Freezing contested history into fact (e.g., "Cuba embargo failed") smuggles in one interpretive lens.

  #### **Step 3: Causal Mechanism Match (12 mins)**  
  *   **Question:** *"Do the 3-5 PRIMARY DRIVERS of the historical outcome map DIRECTLY onto the current situation’s drivers? List mismatches."*  
  *   **Sufficient Answer:** YES for core drivers, with explicit mapping AND acknowledgment of key mismatches.  
  *   **Failure Action:**  
      *   Major mismatch in >1 core driver → **CUT THE ANALOGY.**  
      *   Minor mismatches → Can proceed IF analogy highlights non-obvious risk/leverage point.  
  *   *Why?* Surface similarity (e.g., "rising power vs. ruling power") ≠ causal similarity. This is where analogies die.

  #### **Step 4: Unique Value Test (2 mins)**  
  *   **Question:** *"Does this analogy reveal a NON-OBVIOUS causal relationship, risk, or policy lever that a direct analysis of the current situation would likely miss?"*  
  *   **Sufficient Answer:** YES (specific insight).  
  *   **Failure Action:** NO → **CUT THE ANALOGY.** It’s clutter. Use direct argument.  
  *   *Why?* If it doesn’t add unique insight, it’s rhetorical decoration.

  ---

  ### **Decision Flow Summary:**
  ```mermaid
  graph TD
      A[Start: Analogy Proposed] --> B{Step 1: Cherry-Picking?}
      B -- YES --> C[CUT ANALOGY]
      B -- NO --> D{Step 2: History Contested?}
      D -- YES --> E[FLAG AS JUDGMENT CALL - Disclose dispute]
      D -- NO --> F{Step 3: Causal Match?}
      F -- NO --> C
      F -- YES --> G{Step 4: Unique Insight?}
      G -- NO --> C
      G -- YES --> H[KEEP - With caveats]
      E --> H
  ```

  ---

  ### **Test Runs:**

  #### **1. Anglo-German Naval Rivalry (Pre-1914) as template for Trade Dispute with Rising Power**  
  *   **Step 1:** YES. US-Japan trade rivalry 1980s ended without war. China-Ming tributary system was stable. → **CUT.** *Cherry-picked to imply inevitable conflict.*  
  *   *(Stop. Analogy rejected in <2 mins)*

  #### **2. Cuba Embargo "Never Works" in Sanctions Debate**  
  *   **Step 1:** YES. South Africa apartheid sanctions "worked." Iraq 1990s sanctions caused humanitarian crisis without regime change. → **Proceed cautiously (contested).**  
  *   **Step 2:** NO consensus. *Major dispute:* Did embargo fail (Castro survived) or succeed (contained Soviet expansion/prevented nuclear war)? → **JUDGMENT CALL.** Must disclose: *"While Cuba embargo didn't topple Castro, proponents argue it achieved strategic containment – a disputed outcome."*  
  *   **Step 3:** Mismatches GALORE.  
      *   *Historical drivers:* Cold War bipolarity, US nuclear superiority, geographical proximity.  
      *   *Current drivers:* Multipolarity, economic interdependence, digital finance. → **CUT.** *Causal structure irrelevant.*  
  *   *(Stop. Analogy rejected by Step 3)*

  #### **3. Leader's Foreign Policy Blunder = "Suez" (Your Liked Analogy)**  
  *   **Step 1:** YES. 1807 British Copenhagen bombardment succeeded. 2014 Russia Crimea annexation "worked." → **Proceed.**  
  *   **Step 2:** Consensus Suez was a blunder? YES (UK/France misjudged US/USSR response). → **Proceed.**  
  *   **Step 3:** Check drivers:  
      *   *Suez:* Colonial powers acting without superpower approval, miscalculating US response, triggering financial crisis.  
      *   *Your Case:* Does it involve fading powers? Ignoring patron state? Sovereign asset seizure? Acute financial punishment? → **If YES on 3/4, proceed. If NO → CUT.**  
  *   **Step 4:** Unique insight? Only if it highlights "miscalculating patron backlash" as the key risk. If that’s obvious → **CUT.** If not → **KEEP with caveats** ("Unlike Suez, there’s no colonial dimension, but the risk of superpower financial retaliation is analogous").  
  *   *This is where you might get an answer you dislike: If the causal drivers don't align (Step 3), your pet analogy gets cut.*

  ---

  ### **What This Can’t Settle (Be Brutally Honest):**  
  1.  **True Novelty:** If the current situation has no close historical parallel (e.g., cyber warfare), the procedure will flag all analogies as weak—but won’t generate alternatives.  
  2.  **Expert Disagreement:** Step 2 flags disputes but can’t resolve them. You still must judge which interpretation is relevant.  
  3.  **Counterfactuals:** It tests stated lessons, not unprovable "what ifs" (e.g., "Would Cuba have become democratic without sanctions?").  
  4.  **Morality/Identity Arguments:** Analogies used for normative framing (e.g., "This is appeasement!") often fail Steps 1-4—but may be politically unavoidable. Procedure flags this as decorative.  

  **Output Rule:** If the analogy survives, it MUST include:  
  - The key causal insight it provides.  
  - The major mismatch(es).  
  - If contested, the dispute (e.g., "Scholars debate whether...").

  This forces the analogy to *earn its place*—or get replaced by substance.
