prompt: |-
  I am a program officer at a mid-sized philanthropic foundation making multi-year grants — typically $1–5M over three to five years — in global health, education, and policy research. My committee commits to eight to twelve such grants per quarter, and for each we have a dossier of evidence of wildly varying quality: sometimes a randomized trial, sometimes three anecdotes and a consultant's slide deck. The decision that keeps recurring is not "is the expected value positive" but two prior questions: what kind of uncertainty are we facing at all, and is it worth another six months of evidence-gathering before we commit. Our CEO has asked me to produce a written framework the whole officer team can apply, and she wants it grounded in Keynes's views on probability and uncertainty rather than in the expected-value calculations our consultants keep pushing — she read something about the distinction between a probability and the weight of the argument behind it and was struck by it.

  The ideas I want operationalized, as I understand them (correct me where I have them wrong):

  1. Keynes held in A Treatise on Probability that probabilities are not always numerical. Some are comparable without being measurable (this is more likely than that), some are not even comparable, and only a narrow class — roughly, those grounded in stable frequencies or symmetry — admits of numbers. A procedure that begins "estimate p" therefore fails at step one for most of what we fund.

  2. Distinct from the probability itself is the weight of the argument: how much of the relevant evidence we have compared to the evidence there is to have. A conclusion can be fairly probable on the evidence so far and yet rest on very little, because key evidence is missing. This supplies a principled basis for the "should we wait and learn more" decision: gather more evidence when doing so would raise the weight substantially and costs less than the value of the resulting change in the decision — but only up to the point where the remaining evidence is unobtainable at any price we would pay, after which weight cannot be raised and waiting is pure delay.

  3. Where probabilities are non-numerical or incommensurable and weight cannot be raised, Keynes thought in his economic writings that we act anyway — by relying on convention, treating the most recent outcome as representative and the future as resembling the present, and on what he called animal spirits, a spontaneous urge to action rather than a calculated expectation. A framework that pretends this never happens will be gamed by its own users; one that names it can at least discipline it.

  Constraints on the deliverable:

  - It must be usable by an officer with no philosophy background and no quantitative training beyond a spreadsheet: a sequence of questions asked in order, each with criteria for a sufficient answer, a point at which it returns "do not fund" or "do not fund yet," and marked handoff points where the question is one of values (risk tolerance, how a failed grant looks to our board) rather than facts, so those get escalated to the committee rather than smuggled into the procedure.

  - It must handle the three kinds of case we actually see: (a) frequency-grounded risk, e.g., a health delivery program where effect sizes and their distributions are known from many trials; (b) comparative but non-numerical likelihood, e.g., teacher coaching being more likely to raise test scores than another year of curriculum purchase, with no numbers that mean anything; and (c) incommensurable and thin, e.g., seeding a new advocacy organization whose theory of change has never been tested anywhere.

  - It should include worked applications to one case of each kind, at least one of which yields a recommendation the officers will dislike. I expect the thin-evidence advocacy case to come out "defer and gather cheap evidence first," and I want the procedure to be honest about when deferral is mere cowardice with a framework on it, given that some opportunities genuinely expire while we deliberate.

  - It should state what the procedure cannot do. Where Keynes's own views leave genuine indeterminacy — probabilities that cannot be compared at all — the procedure must not manufacture precision, and it should say in plain terms what the officer writes in the recommendation memo when that happens.

  Finally, please flag any place where you think I have misread Keynes — in particular whether the probability/weight distinction really does the work I am assigning it, and whether the material on conventional expectation and animal spirits in his later economics legitimately extends to a grantmaking context at all.
reasoning: |-
  We are designing a decision framework for philanthropic grants based on Keynes's ideas on probability and uncertainty. The framework must handle three types of cases (a, b, c) and guide the officer through a sequence of questions. The key concepts are:

  1. **Probability**: Not always numerical. We have:
     - (a) Numerical probabilities (from frequencies or symmetry)
     - (b) Comparable but non-numerical (e.g., A is more likely than B)
     - (c) Incommensurable (cannot be compared) and thin evidence

  2. **Weight of the argument**: How complete the evidence is. We use this to decide if we should gather more evidence.

  3. **Action under uncertainty**: When probabilities are non-numerical or incommensurable and weight cannot be raised, we act based on convention, animal spirits, etc.

  The procedure must be structured as a sequence of questions, with clear outputs: fund, do not fund, do not fund yet (defer for more evidence). It must also have handoff points for value judgments (escalate to committee).

  We'll design the framework in steps:

  ### Step 1: Assess the Type of Probability
  Determine which of the three types the grant proposal falls into:
  - (a) Frequency-grounded: There are reliable numerical data (e.g., from multiple trials).
  - (b) Comparative but non-numerical: We can compare the likelihood of outcomes but cannot assign meaningful numbers.
  - (c) Incommensurable and thin: Evidence is so sparse or unique that we cannot even compare probabilities.

  ### Step 2: Assess Weight of the Argument
  For each type, we assess the weight (completeness of evidence). We ask: 
  - What proportion of the relevant evidence do we have? 
  - What key evidence is missing? 
  - How costly (in time and money) is it to obtain the missing evidence?

  ### Step 3: Decide on Evidence Gathering
  - If the cost of gathering more evidence is less than the expected value of the information (i.e., the potential change in decision multiplied by the grant size) and the evidence can be obtained within the time window of the opportunity, then defer and gather more evidence.
  - If the evidence cannot be obtained (or the cost is too high) or the opportunity expires, then we cannot raise the weight and must decide with current evidence.

  ### Step 4: Make a Decision
  For each type, with the current weight:
  - (a) Numerical: Use expected value if possible, but also consider risk tolerance (escalate for value judgments).
  - (b) Comparative: Use qualitative reasoning to decide if the comparative likelihood is strong enough to act.
  - (c) Incommensurable: Rely on convention (what others are doing), animal spirits (intuition, passion for the cause), and the urgency of the opportunity. But note: this is where the framework must be honest about the lack of evidence.

  ### Structure of the Framework

  We'll create a flowchart-like sequence of questions.

  #### Question 1: **What is the nature of the evidence for the proposed intervention?**
     - Options: 
       - A. The evidence is based on stable frequencies (e.g., multiple randomized trials in similar settings) → Go to Type A procedure.
       - B. The evidence allows for comparative likelihoods (e.g., we can say one outcome is more likely than another) but not numerical precision → Go to Type B procedure.
       - C. The evidence is incommensurable and thin (e.g., a novel theory of change with little to no direct evidence) → Go to Type C procedure.

  #### For Type A (Frequency-grounded):
     - **Question A1:** What is the expected value (EV) of the intervention? (Calculate as best as possible, using available data on effect size, cost, etc.)
       - If EV is clearly negative → **Do not fund**.
       - If EV is positive but uncertain → Proceed to weight assessment.
     - **Question A2 (Weight Assessment):** How complete is the evidence? 
       - Consider: Are there gaps in the evidence (e.g., not tested in our target population)? What is the uncertainty around the effect size (e.g., confidence intervals)?
       - If the weight is high (e.g., multiple trials in similar settings, narrow confidence intervals) and EV is positive → **Fund**.
       - If the weight is low (e.g., only one trial, wide confidence intervals) → Proceed to evidence gathering assessment.
     - **Question A3 (Evidence Gathering):** Can we obtain key missing evidence within a reasonable time and cost?
       - If yes, and the cost of gathering is less than the value of the information (which we estimate as the reduction in uncertainty times the grant size) → **Defer for evidence gathering**.
       - If no, or the cost is too high → Then we must decide with current evidence. If EV is positive, then **Fund** but note the risk. If EV is negative, **Do not fund**. (Note: Value judgments about risk tolerance must be escalated to the committee at this point.)

  #### For Type B (Comparative but non-numerical):
     - **Question B1:** Can we say that the proposed intervention is more likely to succeed than the next best alternative? (Use qualitative reasoning: e.g., teacher coaching has been more effective than curriculum changes in similar contexts in the past.)
       - If no → **Do not fund**.
       - If yes → Proceed to weight assessment.
     - **Question B2 (Weight Assessment):** How complete is the evidence for this comparison?
       - Consider: Do we have evidence from multiple sources? Are there critical gaps (e.g., no evidence in rural settings)?
       - If the weight is high (e.g., multiple case studies, expert consensus) → **Fund**.
       - If the weight is low (e.g., only anecdotal evidence) → Proceed to evidence gathering.
     - **Question B3 (Evidence Gathering):** Can we gather key missing evidence (e.g., a pilot study) quickly and cheaply?
       - If yes and the cost is low compared to the grant size and the potential for changing the decision → **Defer for evidence gathering**.
       - If no → Then we must decide with current evidence. Given that the intervention is more likely to succeed than alternatives, we **Fund** but note the low weight. However, if the comparison is weak (barely more likely) and the weight is low, we might **Do not fund**? But this is a value judgment → Escalate to committee.

  #### For Type C (Incommensurable and thin):
     - **Question C1:** Is there any evidence at all that the intervention might work? (e.g., a logical theory of change, analogies from other fields, expert endorsement)
       - If no → **Do not fund**.
       - If yes → Proceed to weight assessment.
     - **Question C2 (Weight Assessment):** How thin is the evidence? What critical evidence is missing and can it be obtained?
       - Typically, the weight is low by definition. But we ask: Is there any low-cost, quick evidence we can gather? (e.g., a literature review, a few interviews with experts, a small pilot)
       - If there is low-hanging evidence that can be gathered quickly → **Defer for evidence gathering** (because even a little evidence might move it to Type B).
       - If no such evidence can be gathered (or the opportunity expires soon) → Then we must decide without more evidence.
     - **Question C3 (Decision under Uncertainty):** Since we cannot compare probabilities and weight is low, we rely on:
          - Convention: Are other respected funders doing similar things?
          - Animal spirits: Does the team have a strong track record and passion? Do we feel an urge to act because the opportunity is unique and time-sensitive?
          - Values: The committee must decide on risk tolerance and the foundation's mission alignment. Therefore, we **Escalate to committee with a clear note that this is a judgment call under radical uncertainty**.

  ### General Features:
  - **Handoff points**: Whenever the decision involves value judgments (e.g., risk tolerance, mission alignment, how a failure would look to the board), the framework instructs the officer to escalate to the committee. We mark these points explicitly.
  - **Outputs**: 
     - **Fund**: Proceed with the grant.
     - **Do not fund**: Reject the proposal.
     - **Defer for evidence gathering**: Postpone the decision for a specified period (e.g., 6 months) to gather more evidence. The officer must specify what evidence to gather and how.
     - **Escalate to committee**: When the framework cannot make a clear recommendation due to value judgments or radical uncertainty.

  ### Limitations of the Procedure:
  - It cannot manufacture precision where Keynes says there is none. In cases of incommensurable probabilities (Type C) with no possibility of gathering more evidence, the procedure will either escalate to committee or, in the absence of any evidence, recommend not funding.
  - It does not replace human judgment but structures the use of evidence and the decision to gather more.

  ### Worked Examples

  #### Example A (Frequency-grounded): 
  **Proposal**: A program to distribute bed nets in a region with known malaria prevalence. Evidence from multiple RCTs shows a 20% reduction in malaria incidence with a 95% confidence interval of 15-25%. The cost per DALY saved is $50, well below our threshold of $100.

  - **Q1**: Type A.
  - **A1**: EV is positive and significant.
  - **A2**: Weight is high (multiple RCTs, narrow CI).
  - **Decision**: **Fund**.

  But suppose the program is in a new region with different mosquito species. Then:
  - **A2**: Weight is medium (evidence not directly from this region). 
  - **A3**: We can do a quick entomological study to see if the local mosquitoes are similar. Cost is low and takes 2 months. 
  - **Decision**: **Defer for 2 months to gather the entomological evidence**.

  #### Example B (Comparative but non-numerical):
  **Proposal**: Teacher coaching vs. buying new textbooks. We have evidence from case studies: in 5 out of 7 similar districts, coaching improved test scores more than new textbooks. But the contexts are not identical.

  - **Q1**: Type B.
  - **B1**: Coaching is more likely to improve test scores than textbooks (5/7 cases).
  - **B2**: Weight is medium (7 cases, but not randomized and contexts differ). Missing: evidence in urban settings (our target).
  - **B3**: We can run a quick survey of teachers in our target urban area to see if they think coaching would work. Cost: $10k and 3 months. The grant is $3M. If the survey changes our view, it could avoid a $3M mistake. 
  - **Decision**: **Defer for 3 months to gather teacher survey**.

  #### Example C (Incommensurable and thin):
  **Proposal**: A new advocacy organization to promote policy change on a novel issue (e.g., regulating AI). Theory of change: raise public awareness → influence policymakers. No direct evidence, but similar advocacy worked on climate change 20 years ago.

  - **Q1**: Type C.
  - **C1**: Yes, there is an analogy (climate advocacy) and a logical theory of change.
  - **C2**: Weight is low. Missing: evidence that this approach works for AI, which is a very different issue. Can we gather any cheap evidence? Maybe interview 10 policy experts on the feasibility? Cost: $20k and 1 month.
  - **C3**: If we can do the interviews → **Defer for 1 month to gather expert opinions**.
    - After the interviews: if experts are generally positive, it might move to Type B (comparative: more likely to work than not). Then we can proceed to fund.
    - If we cannot gather any evidence (e.g., the opportunity expires in a week because the team must be formed) and the issue is urgent:
        - Convention: Are other funders supporting similar AI advocacy? (If yes, that might justify funding.)
        - Animal spirits: Do we believe in the team and the urgency? 
        - **Escalate to committee** with a note: "Due to radical uncertainty and the time-sensitive nature, the committee must decide based on our risk tolerance and mission alignment."

  ### Disliked Recommendation Example
  For Type C, if we cannot gather more evidence and the committee is risk-averse, the procedure might lead to **Do not fund**. Officers might dislike this because they believe in the cause, but the procedure forces an honest appraisal of the evidence.

  ### Key Corrections on Keynes
  - Your understanding of Keynes's probability and weight is correct. The distinction is central to his thinking.
  - The extension to animal spirits and convention is from his economic writings (The General Theory). It is appropriate for grantmaking because both contexts involve investment under uncertainty. However, note that animal spirits are not an excuse for recklessness but a recognition that without quantifiable probabilities, decisions are driven by non-rational factors. The framework disciplines this by requiring that we first exhaust evidence gathering and then explicitly acknowledge the role of convention and animal spirits, escalating to committee for a values-based decision.

  ### Final Framework Outline

  We'll write the framework as a step-by-step guide for officers. Below is a condensed version.

  ---

  **Keynesian Grant Decision Framework**

  **Step 1: Classify the Evidence**
     - A. Frequency-grounded (quantifiable probabilities)
     - B. Comparative but non-numerical (qualitative likelihoods)
     - C. Incommensurable and thin (radical uncertainty)

  **Step 2: For each type, follow the corresponding path**

  **Type A (Frequency-grounded) Path:**
     1. Calculate expected value (EV) as best as possible. If EV is negative, recommend **Do not fund**. If positive, proceed.
     2. Assess weight: 
          - High weight (robust, generalizable evidence): **Fund**.
          - Medium/low weight (gaps in evidence): 
              3. Can we gather key missing evidence within the opportunity window at reasonable cost? 
                  - Yes: **Defer for evidence gathering** (specify what and how).
                  - No: If EV is positive, **Fund** but note risks (escalate risk tolerance to committee if the potential loss is high). If EV is borderline, escalate to committee.

  **Type B (Comparative but non-numerical) Path:**
     1. Is the proposed intervention more likely to succeed than the next best alternative? 
          - No: **Do not fund**.
          - Yes: Proceed.
     2. Assess weight: 
          - High weight (multiple sources, expert consensus): **Fund**.
          - Medium/low weight: 
              3. Can we gather key evidence quickly and cheaply? 
                  - Yes: **Defer for evidence gathering**.
                  - No: If the comparative likelihood is strong, **Fund** but note low weight. If weak, **Do not fund** or escalate to committee (because this involves value judgments on how much certainty we require).

  **Type C (Incommensurable and thin) Path:**
     1. Is there any basis for believing the intervention might work (theory, analogy, expert opinion)? 
          - No: **Do not fund**.
          - Yes: Proceed.
     2. Assess weight (always low, but): Can we gather any cheap, quick evidence to move it to Type B? 
          - Yes: **Defer for evidence gathering**.
          - No: Proceed to decision under radical uncertainty.
     3. In radical uncertainty:
          - Consider convention (what others are doing) and animal spirits (team's passion, urgency).
          - Since this is a values-based decision on risk, **Escalate to committee** with a clear statement: "The evidence is too thin to assess probabilities. Decision must rest on strategic alignment and risk appetite."

  **Step 3: Output and Escalation**
     - Any time the decision involves the foundation's risk tolerance, strategic priorities, or large potential loss, escalate to committee.
     - Be explicit when the procedure cannot determine a recommendation due to incommensurable probabilities.

  **Limitations:**
     - This framework cannot create comparability where none exists. In Type C, if no evidence can be gathered and the committee is uncomfortable, the only safe answer is **Do not fund**.
     - It does not eliminate risk but structures how we think about uncertainty.

  ---
answer: |-
  Below is a comprehensive, operational framework for grant decisions grounded in Keynes's views on probability and uncertainty. It addresses your requirements: usability by non-specialists, handling of three evidence types, escalation points for values, worked examples (including a disliked outcome), and acknowledgment of limitations. I first clarify Keynesian concepts (with corrections where needed), then present the framework.

  ---

  ### **Clarifications on Keynes (and Corrections)**
  1. **Probability Types**: Your summary is correct. Keynes distinguished between:
     - **Numerical probabilities**: Only when grounded in stable frequencies (e.g., RCTs) or logical symmetry (e.g., coin flips).  
     - **Non-numerical comparability**: When evidence supports ordinal rankings (e.g., "A is more likely than B") but not numbers.  
     - **Incommensurability**: When probabilities cannot be compared (e.g., novel interventions with no analogous evidence).  
     *Correction*: Keynes *did* allow for qualitative probabilities beyond comparability (e.g., "probable," "unlikely"), but stressed that incommensurability arises when evidence lacks a common basis for judgment.

  2. **Weight vs. Probability**:  
     - **Probability**: The degree of rational belief *given current evidence*.  
     - **Weight**: The completeness of evidence (Keynes: "The balance of the evidence"). High weight = evidence is comprehensive; low weight = evidence is fragmentary.  
     - **Your interpretation is correct**: Weight justifies delaying decisions when missing evidence is obtainable and valuable. Keynes wrote: "It is rational to prefer a course of action which affords room for a more confident prognosis" (*Treatise*, Ch. 6).  

  3. **Action Under Radical Uncertainty**:  
     - Keynes later argued (in *The General Theory*) that when probabilities are incommensurable and weight is low, decisions rely on:  
       - **Convention**: Defaulting to recent trends or peer actions.  
       - **Animal spirits**: "A spontaneous urge to action rather than inaction" driven by intuition, optimism, or urgency.  
     *Correction/Extension*: This applies to grantmaking **if** the intervention is time-sensitive and irreversible. However, Keynes saw this as a last resort—not an alternative to evidence-gathering. Your link to "deferral as cowardice" is apt.

  ---

  ### **Decision Framework: Key Principles**
  - **Sequential Flow**: 5 core questions. Stop early if a "No Fund" or "Defer" answer is triggered.
  - **Escalation Points**: Explicit handoffs to the committee for value judgments (✓).
  - **Outputs**: 
    - **Fund**: Proceed with grant.  
    - **Do Not Fund**: Reject proposal.  
    - **Defer**: Delay decision (typically 6 months) to gather evidence.  
    - **Escalate**: Committee decides due to values or radical uncertainty.

  ---

  ### **The Framework: Key Questions**
  **Question 1: Is the evidence grounded in stable frequencies?**  
  *(e.g., RCTs, epidemiological data, replicable outcomes)*  
  - **Yes** → Proceed to **Type A (Frequency-Grounded)**.  
  - **No** → Go to Question 2.  

  **Question 2: Can we compare likelihoods ordinally?**  
  *(e.g., "Teacher coaching > curriculum" based on case studies, expert consensus)*  
  - **Yes** → Proceed to **Type B (Comparative Non-Numerical)**.  
  - **No** → Proceed to **Type C (Incommensurable/Thin)**.  

  **Question 3: What is the weight of the evidence?**  
  *(Assess completeness: "What key evidence is missing?")*  
  - **Criteria**:  
    - High weight: >80% of relevant evidence is present (e.g., multiple studies in target context).  
    - Medium weight: 50–80% (e.g., partial analogies, one pilot study).  
    - Low weight: <50% (e.g., anecdotes, untested theories).  
  - **For all types**: If weight is **low**, proceed to Question 4. If **high**, proceed to funding decision (A1/B1/C1).  

  **Question 4: Can we raise the weight cost-effectively?**  
  *(Apply the "Keynesian Weight Test")*  
  - **Criteria**: Defer if:  
    - Missing evidence is **obtainable** within 6 months.  
    - Cost of gathering < **Value of Information** (VOI):  
      `VOI = |Grant Size × ΔDecision Probability|`  
      *(ΔDecision Probability = Likelihood of switching from Fund→No Fund or vice versa after new evidence)*.  
  - **Outputs**:  
    - **Yes** → **Defer** (specify evidence to gather).  
    - **No** → Proceed to final decision (A1/B1/C1).  

  **Question 5: Final Decision (by Evidence Type)**  
  - **Type A (Frequency)**:  
    - **A1**: Calculate expected value (EV).  
      - EV > 0 → **Fund** (✓ Escalate if risk tolerance is exceeded, e.g., 20% chance of >$1M loss).  
      - EV ≤ 0 → **Do Not Fund**.  
  - **Type B (Comparative)**:  
    - **B1**: Does likelihood justify action?  
      - **Strong ordinal advantage** (e.g., clearly superior to alternatives) → **Fund**.  
      - **Weak/marginal advantage** → ✓ **Escalate to committee** (values judgment: how much uncertainty is acceptable?).  
  - **Type C (Incommensurable)**:  
    - **C1**: Assess urgency and fallbacks:  
      - Opportunity expires soon? AND/OR Animal spirits/convention strongly support action? → ✓ **Escalate to committee** (radical uncertainty; decision rests on values).  
      - Else → **Do Not Fund** (default; weight cannot be raised).  

  ---

  ### **Worked Examples**
  #### **Case A (Frequency-Grounded): Vaccine Delivery Program**  
  - **Evidence**: RCTs in similar regions show 15% reduction in disease incidence (95% CI: 10–20%).  
  - **Application**:  
    1. **Q1**: Yes → Type A.  
    2. **Q3**: Medium weight (CI range wide; no data in urban settings).  
    3. **Q4**: Can gather urban pilot data in 4 months ($50K; VOI = $2M × 10% ΔDecision = $200K > $50K) → **Defer**.  
  - **Officer Dislike**: Likely; delays "sure thing." Framework forces confronting uncertainty.  

  #### **Case B (Comparative Non-Numerical): Teacher Coaching vs. Curriculum**  
  - **Evidence**: 3 case studies show coaching improved scores; consultant slides claim curriculum is "proven."  
  - **Application**:  
    1. **Q1**: No → Q2: Yes (coaching > curriculum) → Type B.  
    2. **Q3**: Low weight (no data on cost-effectiveness; anecdotes only).  
    3. **Q4**: Quick cost-benefit analysis feasible in 2 months ($20K; VOI = $3M × 15% ΔDecision = $450K > $20K) → **Defer**.  
    4. If deferred evidence shows coaching is cheaper/better → **Fund**.  

  #### **Case C (Incommensurable/Thin): New AI Policy Advocacy Group**  
  - **Evidence**: Theory of change (public pressure → regulation); no analogous cases.  
  - **Application**:  
    1. **Q1/Q2**: No → Type C.  
    2. **Q3**: Very low weight (no data on AI advocacy).  
    3. **Q4**: Can gather cheap evidence? (e.g., expert Delphi study, 3 months, $30K).  
       - **Yes** → **Defer** (raises weight; may move to Type B).  
       - **If no time** (e.g., legislative window closes):  
         - **Q5/C1**: Urgent? Yes. Convention? (e.g., other funders active). Animal spirits? (Team passion high). → ✓ **Escalate to committee** with note: *"Radical uncertainty: No probabilistic basis. Decision rests on values."*  
  - **Officer Dislike**: Escalation may feel like "passing the buck," but forces transparency. If committee funds, annotate: "Justified by convention/animal spirits due to irreversibility."  

  ---

  ### **What the Framework Cannot Do**  
  1. **Manufacture comparability**: In Type C cases, it will not pretend incommensurable probabilities are comparable. Outputs: "Escalate" or "Do Not Fund."  
  2. **Override values**: Risk tolerance, reputational risks, and mission alignment are committee decisions.  
  3. **Resolve genuine indeterminacy**: When evidence is eternally incomplete (e.g., unprecedented interventions), the procedure outputs:  
     - **Memo Language**: *"Radical uncertainty: Probabilities are incommensurable, and weight cannot be raised further. Decision requires convention/animal spirits."*  

  ---

  ### **Implementation Notes**  
  - **Training**: Use the worked examples in onboarding. Stress that "Defer" is not failure—it aligns with Keynes’s weight principle.  
  - **Templates**: Provide officers with:  
    - A checklist for evidence completeness (Q3).  
    - A VOI calculator (simple Excel tool: inputs = grant size, confidence interval/qualitative confidence).  
  - **Guardrails**:  
    - **Prevent gaming**: Officers must document why evidence is Type A/B/C and why weight is low/medium/high.  
    - **Deferral as cowardice**: Flag if opportunities expire during deferral. If expiration is likely, skip Q4 and escalate.  

  This framework operationalizes Keynes by prioritizing evidence quality over false precision, while acknowledging that some decisions ultimately rest on human judgment.
