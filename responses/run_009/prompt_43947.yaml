prompt: |-
  My two friends have been arguing about "equality of what" for years and I finally convinced them to do an adversarial collaboration and write something up together. One of them is basically a Dworkinian resourcist -- thinks equality means equalizing resources, brute luck should be insured against, and people should bear the costs of their own ambitions and choices. The other is a Sen/Nussbaum capabilities person -- thinks equality is about what people can actually do and be, and that resources are just a means to that. I've had to sit through a hundred dinners of this and I want the document they should have produced at the end.

  Please draft that joint statement. Specifically I want:

  - a numbered section of claims both of them could actually sign their names to, including claims about the "equality of what?" question itself, about what each approach gets right about the other, and about the cases (expensive tastes, adaptive preferences, disability, choice-sensitive costs) that both agree are the hard ones;
  - a table of the residual disagreements, where each disagreement is phrased in wording the side holding that view would accept -- so no slanted phrasing like "resources are merely instrumentally valuable" as a description of the resourcist's view unless he'd put it that way;
  - the cruxes -- I suspect one is whether welfare/capability information is reliable enough to be an egalitarian currency, and another is what to do about expensive tastes and adaptive preferences, but you work out what the real cruxes are;
  - for each crux, a concrete case or thought experiment both sides would agree bears on it, with each side's prediction about the case written down in advance. Like: a wheelchair user in a city with no accessible public transit, where she could either be given a cash compensation roughly equal to the cost of the disadvantage or the city could be required to make transit accessible -- does the resourcist predict the cash is enough (at least as a matter of justice, not policy), and what does the capabilities person predict a resourcist committed to that has to say?

  If you conclude some of their dispute is verbal -- e.g. about whether "resource" can be stretched to cover internal capacities and social structures -- say which part and why, since I've always suspected a chunk of it is just them meaning different things by "resource."

  One more thing: this document will get sent back to both of them for signature, so at the very end include a short note on where your drafting is most likely to fail -- which formulations you'd bet one side refuses to sign, and what would change your mind about the cruxes or about the dispute being partly verbal. Don't hedge everything to death though; if you think one crux is more load-bearing than the others, just say so.
reasoning: |-
  Okay, the user has a fascinating request. They've been mediating a long-standing philosophical debate between two friends about the "equality of what" question - one a Dworkinian resourcist, the other a Sen/Nussbaum capabilities theorist. The user wants me to draft a formal adversarial collaboration document that both could sign, with very specific components: agreed claims, a table of residual disagreements, key cruxes with test cases, and an analysis of potential verbal disputes.

  Hmm, this requires careful balancing. The resourcist view (equality of resources) and capabilities approach (equality of capabilities) are fundamentally different frameworks, though they share some common ground. The user mentions several thorny cases: expensive tastes, adaptive preferences, disability, and choice-sensitive costs. These will be crucial for testing the theories.

  First, I need to identify the core agreements. Both camps likely agree that resources matter instrumentally, that brute luck disadvantages deserve compensation, and that personal responsibility plays a role. The disability case is particularly illuminating - both would want to assist a wheelchair user, but through different mechanisms.

  For the disagreements table, I must phrase each position in terms its proponent would accept. The resourcist would emphasize "equality in the means to pursue ends" while the capabilities theorist would stress "equality in effective opportunities." Key differences emerge around expensive tastes (should gourmet preferences be subsidized?) and adaptive preferences (should we compensate those who lower expectations due to oppression?).

  The real cruxes seem to be: 
  1) Epistemic reliability - can we accurately measure capabilities/welfare for policy?
  2) Agency vs. compensation - how much should choice shield us from redistribution?
  3) The "currency" question - what's the proper focus of egalitarian concern?

  For test cases, the wheelchair accessibility example is perfect. I predict the resourcist would say cash compensation is sufficient (justice demands resources, not specific outcomes), while the capabilities theorist would insist on actual access being guaranteed. Another good case is the "gourmet vs. ascetic" scenario for expensive tastes.

  I suspect part of their dispute is verbal - "resources" could be interpreted broadly to include social structures and internal capacities, which might narrow the gap. But fundamentally, capabilities theory demands more than resource equality when conversion factors vary.

  In the drafting risks section, I should warn that formulations about adaptive preferences and the "sufficiency" of resources might be sticking points. The resourcist won't accept that resources are "merely instrumental," and the capabilities theorist will resist calling conversion factors "implementation details."

  This document could actually help their friends progress - the test cases force concrete predictions rather than abstract sparring. The dinner table debates might finally produce something substantive!
answer: |-
  ## Joint Statement: Adversarial Collaboration on "Equality of What?"  
  **Signed:** [Friend 1: Resourcist] & [Friend 2: Capabilities Theorist]  
  **Date:** October 26, 2023  

  ### Section 1: Points of Agreement
  We, the undersigned, affirm the following shared commitments and understandings:

  1.  **The Fundamental Goal:** Justice requires mitigating unfairness in individuals' life prospects arising from circumstances beyond their control.
  2.  **The Relevance of Resources:** Resources (broadly construed as external goods, wealth, and opportunities) are a *necessary* component of any plausible theory of egalitarian justice. Neither view dismisses the importance of material means.
  3.  **The Relevance of Outcomes:** What individuals can actually *be* and *do* (their capabilities, functionings, or welfare) is morally significant. A theory of justice cannot be indifferent to the actual lives people lead.
  4.  **Brute Luck vs. Option Luck:** Disadvantages stemming from "brute luck" (e.g., congenital disability, being born into poverty, natural disasters) warrant societal compensation to a greater degree than disadvantages stemming from "option luck" (e.g., informed gambles, choices with known risks) or voluntary choices reflecting personal ambitions.
  5.  **Personal Responsibility:** Individuals should generally bear the costs associated with their own choices, ambitions, and cultivated tastes, provided those choices were made under fair conditions and with adequate information and capacity.
  6.  **The Problem of Disability:** A just society must provide substantial support to individuals with disabilities to mitigate disadvantages not of their making. Neither theory believes merely providing the same resources given to an able-bodied person is sufficient for justice in the case of significant disability.
  7.  **The Challenge of "Hard Cases":** Both theories acknowledge that cases involving expensive tastes, adaptive preferences, choice-sensitive costs, and variations in internal capacities (like converting resources into functionings) pose significant difficulties and reveal tensions within egalitarian theory. There are no easy, universally satisfying answers within either framework alone.
  8.  **Mutual Insight:**  
      *   *Resourcist Acknowledgment:* The Capabilities Approach rightly emphasizes that equal resources do not guarantee equal freedom to achieve valuable states of being, especially when individuals have different conversion factors (e.g., due to disability, social stigma, or differing internal capacities). Focusing solely on resources risks ignoring crucial barriers to genuine opportunity.  
      *   *Capabilities Acknowledgment:* The Resourcist Approach rightly emphasizes the dangers of paternalism and the importance of respecting individual agency and responsibility in defining and pursuing the good life. It highlights the epistemic and practical difficulties in reliably identifying, measuring, and comparing capabilities/welfare for the purposes of distributive justice, especially concerning preferences.

  ### Section 2: Table of Residual Disagreements
  | Issue | Resourcist Position (as self-described) | Capabilities Position (as self-described) |
  | :---- | :-------------------------------------- | :---------------------------------------- |
  | **Primary Currency of Justice** | Justice requires equality in the *means* (resources) individuals have available to pursue their own conceptions of the good life, respecting their freedom to use those means as they see fit. | Justice requires equality in the substantive *freedoms* (capabilities) people have to achieve valuable functionings – the states of being and doing that constitute human flourishing. |
  | **Expensive Tastes (Voluntarily Cultivated)** | Individuals should bear the full cost of tastes and ambitions they deliberately cultivate, even if expensive, provided they had fair initial opportunities. Equal resources suffice; subsidizing expensive tastes is unfair to those with modest tastes. | While responsibility matters, justice is fundamentally about capability sets. If an expensive taste reflects a genuine commitment central to a person's identity and conception of the good (e.g., a deeply held religious or artistic practice), and its cost creates a significant capability deficit relative to others, compensation *may* be warranted, subject to feasibility and overall fairness. |
  | **Adaptive Preferences (e.g., oppressed lowering expectations)** | Justice is primarily concerned with ensuring fair access to resources and opportunities. While adaptive preferences are regrettable, they do not inherently create a claim for *additional* resources beyond what is owed for brute luck disadvantages. Intervention risks unacceptable paternalism. | Adaptive preferences represent a profound failure of capability. Justice demands creating conditions where individuals develop *autonomous* preferences and have genuine access to a full range of functionings, which may require *more* than standard resource provision to overcome internalized oppression and enable critical reflection. |
  | **What Constitutes a "Resource"?** | Resources encompass external goods, wealth, legal rights, and access to social institutions/opportunities. Internal capacities (e.g., intelligence) are not distributable resources but are factors in the *value* of resource bundles. Social structures shape the value of resources but are not *themselves* resources. | The distinction between "resources" and "conversion factors" is crucial. Social structures, relationships, public goods, *and* internal capacities are integral parts of the environment determining whether someone can convert a resource into a functioning. Justice must consider this entire nexus. |
  | **Goal of Intervention** | To ensure individuals have a fair share of the means to pursue their ends, leaving them responsible for their choices made with those means. | To ensure individuals have genuinely effective access to key capabilities necessary for a life of dignity and flourishing, which may require tailoring to individual or group conversion factors. |

  ### Section 3: Key Cruxes & Test Cases
  We identify the following points as the fundamental axes of our disagreement:

  1.  **Crux A: Epistemic Feasibility & Anti-Paternalism**  
      *   **Resourcist Concern:** Can capabilities/welfare be reliably identified, measured, and compared across individuals for the purposes of distributive justice without excessive state intrusion, unacceptable paternalism, or contentious value judgments?  
      *   **Capabilities Response Concern:** Does relying solely on resources ignore morally significant variations in individuals' abilities to convert those resources into genuinely valuable lives, thereby perpetuating hidden disadvantage?  
      *   **Test Case: "The Contented Farmer"**  
          *   *Scenario:* Two individuals have identical resource bundles in a developing society. Person A, due to education and social exposure, aspires to university education and a professional career. Person B, raised in a traditional agrarian community with limited exposure, aspires only to be a subsistence farmer and is deeply satisfied with this life. Their capability sets (access to higher education, professional opportunities) differ vastly despite equal resources.  
          *   **Resourcist Prediction:** Justice is satisfied with equal resources. Person B's contentment does not require giving Person A extra resources to pursue university, nor does it require intervening to change Person B's preferences.  
          *   **Capabilities Prediction:** Justice is *not* satisfied. Person B lacks a significant capability (access to higher education/alternative professions) due to social circumstances, even if they don't currently value it. Interventions to expand their *real opportunities* (e.g., education, information) are warranted, even if ultimately they choose farming.  

  2.  **Crux B: The Moral Significance of Choice and Cost-Sensitivity**  
      *   **Resourcist Claim:** Justice requires insulating individuals from the consequences of brute luck, not from the costs of their own choices. Making outcomes cost-insensitive to choice undermines responsibility and fairness.  
      *   **Capabilities Claim:** The *capability* to choose is paramount, but the *actual cost* of achieving valued functionings stemming from brute luck differences (e.g., disability) or social structures must be compensated to ensure *equal* capability sets. Choice doesn't erase the need for compensation for background unfairness affecting costs.  
      *   **Test Case: "Wheelchair Access vs. Cash Compensation"**  
          *   *Scenario:* A city's public transit system is inaccessible to wheelchair users. Two policy options: (1) Provide a targeted cash subsidy to the wheelchair user roughly equivalent to the estimated cost of accessible taxis/transport. (2) Mandate and fund accessibility modifications to the public transit system.  
          *   **Resourcist Prediction (Justice Focus):** Justice is satisfied by Option 1. The individual has been compensated for the brute luck disadvantage (mobility impairment) with resources equivalent to the extra cost they face. They are then free to use that cash for transport or other purposes as they see fit, bearing responsibility for that choice. Mandating a specific outcome (Option 2) over-provides a specific good and potentially infringes on the choices/responsibility of the individual and the allocation decisions of the city.  
          *   **Capabilities Prediction (Justice Focus):** Justice *requires* Option 2 (or equivalent guaranteed access). Cash compensation (Option 1) is insufficient because: (a) It places an undue burden on the individual to constantly manage and budget for a basic capability (mobility) that others get automatically. (b) The actual cost may fluctuate or be underestimated. (c) It fails to provide equal *effective freedom* – the non-disabled can use cheap public transit; justice demands the disabled have equivalent, guaranteed access to the public system. Providing the *capability* directly is the goal.  

  3.  **Crux C: The Scope of "Resources" (Verbal/Substantive Dispute)**  
      *   **Potential Verbal Element:** A significant portion of our disagreement stems from the *scope* of the term "resources."  
      *   **Resourcist Stance:** "Resources" are primarily *transferable external goods and opportunities*. While social structures (laws, institutions) *affect* the value of resources, they are not themselves the currency of justice. Internal capacities are fixed parameters.  
      *   **Capabilities Stance:** The distinction between "resources" and the "environment" (social/institutional/personal conversion factors) is artificial and unhelpful for justice. Achieving equal capabilities requires attention to the *entire system* enabling resource conversion. If "resources" must be the currency, then its definition *must* be stretched to encompass the social bases necessary for effective capability (e.g., rights, institutional access).  
      *   **Why it's (Partly) Verbal:** The Resourcist *agrees* that social structures and internal capacities profoundly affect the *value* of resource bundles and that justice may require modifying social structures (e.g., anti-discrimination laws) to ensure fair opportunity. However, they maintain this is about making the *resource metric* meaningful within a chosen framework, *not* about changing the currency. The Capabilities Theorist sees this modification as effectively conceding the point that the *real* concern is capability, making resource equality merely a (sometimes inadequate) proxy. **Substantive Core:** Even if "resources" are defined broadly, disagreement remains on whether justice aims for equality of *means* (broadly defined) or equality of *effective opportunities/outcomes* (capabilities), especially when these diverge significantly.

  ### Section 4: Drafting Risks & Potential Veto Points (Note to Friends)
  This draft represents our best-faith effort to synthesize your positions fairly. Based on our understanding of the theories, we anticipate the following points are most vulnerable to rejection:

  1.  **For the Resourcist:**
      *   **Likely Veto:** The phrasing in the Capabilities Acknowledgment (Section 1.8) regarding the Resourcist view's *risk* of "ignoring crucial barriers." You might accept "highlighting a challenge" but reject "risks ignoring."
      *   **Likely Veto:** The Capabilities prediction in the Wheelchair Case (Section 3, Crux B) stating justice *requires* Option 2. You would insist Option 1 *can* satisfy justice if the cash amount is correctly calculated, and Option 2 represents a policy choice, not a justice demand.
      *   **Key Sticking Point:** Any formulation implying that providing equal resources *fails* to achieve justice in cases like disability due to conversion factors. You will argue it *does* achieve justice via compensation, leaving implementation/policy to solve practical accessibility.

  2.  **For the Capabilities Theorist:**
      *   **Likely Veto:** The Resourcist phrasing of Adaptive Preferences (Section 2 Table) as not creating a claim for *additional* resources. You will argue that overcoming adaptive preferences *does* require additional, targeted resources/interventions beyond standard provision.
      *   **Likely Veto:** The Resourcist prediction in the Contented Farmer case (Section 3, Crux A). You will find it unacceptable that justice is deemed satisfied while Person B lacks significant capabilities.
      *   **Key Sticking Point:** The characterization of conversion factors as mere "implementation details" affecting resource *value*. You view addressing them as central to the *definition* of the egalitarian currency itself.

  **Load-Bearing Crux:** We judge **Crux B (Wheelchair Case)** to be the most load-bearing. It starkly reveals the core difference: Is justice achieved by compensating for unequal costs via resources (Resourcist), or by guaranteeing equal effective access to capabilities (Capabilities)? **Crux C (Verbal/Scope)** is significant but intertwined; resolving the substantive disagreement in Crux B clarifies how much the verbal dispute matters.

  **Changing Our Mind:** If you both agree that *in the wheelchair case*, justice requires *either* sufficient cash *or* accessibility modifications to provide *guaranteed, equivalent ease of access* to public transit (i.e., the Resourcist concedes the cash must be enough to *effectively guarantee* the capability, not just offset estimated costs), that would significantly narrow the gap and suggest the "resources" concept can be stretched further than we anticipated. If you both agree that adaptive preferences *never* generate claims for extra resources (Capabilities conceding) or *always* do (Resourcist conceding), that would resolve a major point. Mutual acceptance of the other's Test Case predictions would be a major breakthrough.

  We submit this document in the hope it captures your core agreements, clarifies your disagreements, and provides a structured basis for productive future dialogue, sparing your mutual friend from further dinner-time debates (at least on this precise framing!). Your signatures below indicate acceptance of the document as a fair representation of the agreed points and a clear statement of the disagreements, even if you do not endorse the other's position.
