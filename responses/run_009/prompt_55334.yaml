  We are going to construct a proposal for a term paper on the problem of old evidence in Bayesian confirmation theory, focusing on the idea that there are two distinct situations that are often conflated.

  Research Question: 
  How does distinguishing between (1) cases where the agent's confidence in the evidence E has increased over time (due to replication, refined measurement, etc.) and (2) cases where the agent was highly confident in E all along but only recently learned that the hypothesis H entails E, help in resolving the problem of old evidence in Bayesian confirmation theory? And to what extent do existing solutions to the old evidence problem address these two cases separately?

  Why existing positions leave it open:
  The literature on the problem of old evidence typically treats it as a single issue. The standard Bayesian story requires that confirming evidence E must raise the probability of H, i.e., P(H|E) > P(H). However, when E is old evidence (already known), then P(E)=1, and by the definition of conditional probability, P(H|E)=P(H). Hence, no confirmation. 

  Two main types of solutions have been proposed:

  1. Counterfactual approach (e.g., Garber, Jeffrey, Howson): The idea is to consider what the agent's credence in H would have been if they did not know E. Then, conditionalizing on E would raise the probability of H from that counterfactual state. This approach is often formalized by using a counterfactual probability function P' (where P'(E)<1) and then showing that P'(H|E) > P'(H).

  2. Learning the entailment (e.g., Garber, others): The agent learns that H entails E (i.e., H ⊨ E) and then conditionalizes on this logical fact. This raises the probability of H because the agent now sees that H predicts E.

  However, these solutions are typically discussed as addressing the same problem. The proposal here is that they are tailored to two distinct scenarios:

  - The counterfactual approach makes sense for the first type of case (where the agent's confidence in E has changed) because we are explicitly considering a state where E was not taken for granted. But it seems artificial in the second case because the agent never actually doubted E.

  - The learning-the-entailment approach fits the second case (the agent learns a logical fact) but does not address the first case, where the issue is not about entailment but about the agent's changing confidence in E.

  Method (Month-by-Month Plan):

  Month 1: Literature Review and Formal Setup
  - Review key texts on the old evidence problem (e.g., Glymour's original paper, responses by Garber, Jeffrey, Howson, and more recent work by Sprenger, Hartmann, and others).
  - Formalize the two distinct scenarios in a Bayesian framework with explicit credences. We will model an agent with a probability function P that evolves over time. We will use a simple propositional language and assume a finite set of possible worlds for tractability.

    Scenario 1 (Changing Confidence in E):
      - Time t0: Agent has some credence in E, P0(E) < 1.
      - Time t1: Agent becomes more confident in E (due to new information, say replication) so that P1(E) > P0(E). Also, the agent has a hypothesis H that is meant to explain E.
      - The issue: How does the increase in confidence in E affect the credence in H?

    Scenario 2 (Learning the Entailment):
      - Time t0: Agent is certain of E (P0(E)=1) and has some credence in H, but does not know that H entails E.
      - Time t1: Agent learns that H entails E (i.e., H ⊨ E). Then, conditionalizing on this new logical fact, the agent updates to P1(H) = P0(H | H ⊨ E).

    We must be cautious about logical omniscience: in the second scenario, we assume the agent is not logically omniscient (so they might not have known the entailment at t0).

  Month 2: Formal Analysis of Existing Solutions
  - For each scenario, apply the two types of solutions (counterfactual and learning entailment) and check whether they work.
  - For Scenario 1, we expect the counterfactual approach to work naturally: we consider a counterfactual state where the agent does not have the evidence E (or has a lower credence in E) and then conditionalize on E. But the learning entailment approach would not apply because the agent already knew the entailment? (We need to model whether the agent knew the entailment at t0 and at t1.)
  - For Scenario 2, we expect the learning entailment approach to work: conditionalizing on the new logical fact (H ⊨ E) should raise the probability of H. But the counterfactual approach seems problematic: if we try to remove E (which the agent is certain of), we face the problem of how to represent a state of doubt about E (which the agent never had).

    We will formalize the learning of the entailment by introducing a new proposition, say L, which represents "H entails E". We then model the update by conditionalizing on L. However, note that if the agent already knows E, then conditionalizing on L (which is equivalent to H⊨E) might not change the probability of H if the agent already knew E? This is subtle. We must model the agent's uncertainty about the logical connection.

    We can use a framework that allows for uncertainty about logical facts (e.g., by having a probability distribution over possible worlds that include different logical relations). This is non-standard and might require a more complex setup.

  Month 3: Testing the Solutions and Evaluating the Distinction
  - Construct simple numerical examples for both scenarios and apply the solutions. For instance:
    - Scenario 1: Let H be a hypothesis and E be evidence. At t0, P0(H) and P0(E) are both 0.5, and P0(E|H)=0.9, P0(E|~H)=0.3. Then at t1, the agent learns E (so P1(E)=1). Then we can compute the counterfactual: what if the agent didn't know E? Then P'(H) = P0(H) = 0.5, and then P'(H|E) would be [P0(E|H)*P0(H)]/P0(E) = (0.9*0.5)/0.5 = 0.9, which is greater than 0.5. So confirmation. The learning entailment approach wouldn't apply because we assume the agent already knew the entailment? (But in this scenario, the agent might not have known the entailment? We must separate the two.)

    We must be careful: in Scenario 1, the agent might not have known the entailment at t0? Actually, the two scenarios are about two different things: one about the evidence E and one about the entailment. So we have two dimensions:

      - The agent's credence in E (which may change).
      - The agent's knowledge of the entailment (which may change).

    Therefore, we might have four cases? But the proposal focuses on two that are most salient. We will stick to:

      Case A: E is old in the sense that the agent was not initially certain of E, but now is (and the entailment was known all along).
      Case B: E is old in the sense that the agent was always certain of E, but the entailment of E by H is newly discovered.

    Then, we test:

      For Case A: The counterfactual approach works. The learning entailment approach is not applicable because the entailment was already known.

      For Case B: The learning entailment approach works. The counterfactual approach is problematic because the agent never doubted E.

  - We will also consider hybrid cases and whether the solutions can be applied in the other case.

  Month 4: Writing and Refining
  - Write the paper. Include:
    - Clear exposition of the two scenarios.
    - Formal models for each.
    - Analysis of how existing solutions apply to each.
    - Discussion of the implications: should we have two distinct solutions? Or can we unify them?
    - Address the possibility that the two scenarios are not as distinct as they seem.

  What a positive result would look like:
  - We show that the two scenarios are formally distinct and require different solutions. The counterfactual approach is the right solution for the first scenario (changing confidence in E) but not for the second, and the learning-the-entailment approach is the right solution for the second (learning the logical connection) but not for the first. We then argue that the old evidence problem is not one problem but two, and that the literature has conflated them.

  What would count as the project failing?
  1. If the two scenarios turn out to be formally indistinguishable when modeled (e.g., both can be reduced to one of the existing solutions without loss of generality). For instance, if learning the entailment in Case B can be shown to be equivalent to a counterfactual move, then the distinction might collapse.

  2. If the "learning the entailment" approach, when formalized, ends up being just a variant of the counterfactual approach (or vice versa). For example, if conditionalizing on the entailment L can be seen as implicitly creating a counterfactual state.

  3. If the two scenarios are not both instances of the old evidence problem. For instance, if Case A (changing confidence) is not considered "old evidence" in the standard sense (because the agent wasn't initially certain of E) then it might be seen as a case of new evidence. We have to argue that it is a form of old evidence because E was known (with high probability) and then becomes certain.

  4. If the formal models become too complex and unmanageable for a term paper.

  Epistemic Caveats:
  - The role of logical omniscience is contested. Some Bayesians (e.g., Garber) think the problem is about learning logical connections, while others (e.g., Howson) emphasize counterfactuals. We don't take a stand on which is the "real" problem but argue that both exist and are distinct.
  - We note that the two-case split might be challenged: perhaps Bayesian confirmation theory should treat all evidence as either new or not, and the old evidence problem is only about evidence that is already certain. But our Case A involves evidence that was not initially certain. We must justify why Case A is still a problem of old evidence (because E was known to some degree and then becomes more certain, but not necessarily new in the sense of being a surprise).

  Term Paper Feasibility:
  - The project is feasible in one semester if we keep the formal models simple (e.g., using small finite models and avoiding overly complex logical frameworks). We will focus on two clear cases and not try to cover every variant.

  Structure of the Proposal:

  Title: Two Faces of the Old Evidence Problem: Distinguishing Changing Credence in Evidence from Learning Theoretical Entailment

  1. Introduction
     - The problem of old evidence in Bayesian confirmation theory.
     - The standard example: Mercury's perihelion and general relativity.
     - The two distinct scenarios we identify.

  2. The Two Scenarios: A Conceptual Distinction
     - Scenario 1: Increasing confidence in E (e.g., due to replication or refined measurement).
     - Scenario 2: Learning that H entails E (while being certain of E all along).

  3. Existing Solutions and Their Scope
     - The counterfactual approach and why it fits Scenario 1.
     - The entailment-learning approach and why it fits Scenario 2.
     - Why each solution does not fit the other scenario well.

  4. Method: Formalising and Testing
     - Formal models for each scenario (using simple probability spaces).
     - Application of the two solutions to each scenario.
     - Evaluation of whether the solutions work in the intended scenario and fail in the other.

  5. Potential Outcomes and Risks
     - Positive result: the two scenarios are distinct and require separate solutions.
     - Negative result: the scenarios collapse into one, or one solution subsumes the other.

  6. Timeline (Month-by-Month as above)

  7. Conclusion

  We write the proposal in British English.
answer: |-
  ### Proposal: Two Faces of the Old Evidence Problem in Bayesian Confirmation Theory  

  **Title:**  
  Distinguishing Evidential Confidence Shifts from Entailment Discovery: A Dual-Path Solution to the Problem of Old Evidence  

  #### 1. Research Question  
  How does formally distinguishing between (i) cases where an agent’s *credence in old evidence E increases over time* (e.g., due to replication or refined measurement) and (ii) cases where an agent, while certain of *E* all along, *discovers that hypothesis H entails E*, resolve the problem of old evidence in Bayesian confirmation theory? Specifically, to what extent do existing solutions (counterfactual credence adjustments vs. conditionalisation on entailment) separately address these two scenarios, and why might their conflation obscure a more nuanced resolution?  

  #### 2. Why Existing Positions Leave the Question Open  
  The problem of old evidence (Glymour 1980) arises because Bayesian confirmation requires *P(H|E) > P(H)*, but if *E* is already known (*P(E) = 1*), then *P(H|E) = P(H)*—implying no confirmation. Existing solutions fall into two camps but treat old evidence monolithically:  

  - **Counterfactual Approach** (e.g., Howson 1984, Garber 1983): Agents evaluate confirmation by asking, "What would my credence in *H* have been if I hadn’t known *E*?" This involves constructing a counterfactual probability function *P₋ₑ* where *P₋ₑ(E) < 1*, and showing *P₋ₑ(H|E) > P₋ₑ(H)*.  
  - **Entailment-Learning Approach** (e.g., Garber 1983, Jeffrey 1983): Agents learn the logical relationship *H ⊨ E* and conditionalise on this fact, raising *P(H)*.  

  *Why the question remains open:*  
  - The **counterfactual approach** is presented as a general solution but appears ill-suited to cases where *E* was never doubted (e.g., Einstein’s certainty about Mercury’s perihelion precession). Removing *E* from an agent’s background knowledge seems artificial when *E*’s truth was uncontested.  
  - The **entailment-learning approach** is framed as addressing logical ignorance but offers no clear mechanism for cases where confidence in *E* *changes* (e.g., a measurement error is corrected, raising *P(E)* from 0.8 to 1.0). Conditionalising on *H ⊨ E* alone cannot model shifts in *E*’s credibility.  
  - Crucially, proponents of both approaches (e.g., Garber) often discuss them interchangeably, without acknowledging that they target distinct phenomena. Meanwhile, the role of **logical omniscience** is contested: some hold that old evidence reduces to failures of logical learning (e.g., Sprenger 2015), while others deny this (e.g., Steele 2022). This conflation masks whether "old evidence" is one problem or two.  

  #### 3. Method: Month-by-Month Plan  
  *Assumptions:* A Bayesian agent with credences defined over propositions in a simple formal language (e.g., propositional logic). Models avoid logical omniscience by allowing uncertainty about entailments.  

  **Month 1: Formalise Scenarios and Critique Existing Solutions**  
  - Formalise the two scenarios using toy agents with explicit credence functions:  
    - **Scenario 1 (Changing Credence in *E*):**  
      - *t₀*: Agent has *P₀(E) = p < 1* (e.g., *p* = 0.8, reflecting initial measurement uncertainty).  
      - *t₁*: Agent updates to *P₁(E) = 1* (e.g., after experimental replication).  
      - *Key property:* *H* is known to entail *E* throughout (*P₀(H ⊨ E) = 1*).  
      - *Bayesian challenge:* Show how *E* confirms *H* despite being "old" (known since *t₀* but not fully believed).  
    - **Scenario 2 (Discovering Entailment):**  
      - *t₀*: Agent has *P₀(E) = 1* and *P₀(H) = q*, but *P₀(H ⊨ E) < 1* (e.g., *P₀(H ⊨ E) = 0.5*—logical ignorance).  
      - *t₁*: Agent learns *H ⊨ E*, updates to *P₁(H ⊨ E) = 1*.  
      - *Key property:* *E*’s probability never changes (*P₀(E) = P₁(E) = 1*).  
      - *Bayesian challenge:* Show how learning *H ⊨ E* confirms *H* when *E* is already certain.  
  - **Output:** Explicit probability functions for each scenario (e.g., using possible-worlds models where logical facts are propositions).  

  **Month 2: Test Existing Solutions on Both Scenarios**  
  - Apply **counterfactual approach** to each scenario:  
    - For *Scenario 1*: Construct *P₋ₑ* by removing *E* from background knowledge (e.g., set *P₋ₑ(E) = prior probability of E*). Test if *P₋ₑ(H|E) > P₋ₑ(H)*.  
    - For *Scenario 2*: Attempt to construct *P₋ₑ* by removing *E*. *Problem:* If *E* was certain (*P₀(E)=1*), removing *E* is undefined or requires ad hoc priors.  
  - Apply **entailment-learning approach** to each scenario:  
    - For *Scenario 2*: Conditionalise on *H ⊨ E*. Test if *P₁(H) > P₀(H)*.  
    - For *Scenario 1*: Conditionalising on *H ⊨ E* (already known) yields *P₁(H) = P₀(H)*—no confirmation.  
  - **Output:** Tables/graphs showing confirmation measures (e.g., difference *P(H|E) - P(H)*) for each solution-scenario pair.  

  **Month 3: Evaluate Distinction and Address Collapse Risks**  
  - Test whether the scenarios are *formally distinguishable*:  
    - Check if Scenario 1 requires *P(E) < 1* at *t₀*, while Scenario 2 requires *P(H ⊨ E) < 1*.  
    - Hybrid case: If *P(E) < 1* and *P(H ⊨ E) < 1*, does confirmation decompose into two distinct components?  
  - **Failure-mode checks:**  
    - *Collapse risk:* Does "learning *H ⊨ E*" in Scenario 2 reduce to a counterfactual? (e.g., if entailment learning *implies* credence shifts).  
    - *Formal equivalence:* Do both scenarios yield identical confirmation values under either solution?  
  - **Output:** Proofs or counterexamples for collapse/equivalence; refinement of criteria for each scenario.  

  **Month 4: Drafting and Synthesis**  
  - Integrate results into a coherent argument:  
    - If distinction holds, propose a "dual-path" solution: Counterfactuals for Scenario 1, entailment-learning for Scenario 2.  
    - If scenarios collapse, explain why (e.g., entailment learning always dominates).  

  #### 4. What a Positive Result Looks Like  
  - **Success condition 1:** Formal models confirm that the counterfactual approach *works* for Scenario 1 (changing *P(E)*) but *fails* for Scenario 2 (certain *E*), while entailment-learning *works* for Scenario 2 but *fails* for Scenario 1.  
  - **Success condition 2:** The distinction holds under robustness checks (e.g., with noisy entailment probabilities or non-binary evidence).  
  - **Implication:** The old evidence problem dissolves into two sub-problems, each requiring bespoke treatment. This reframes debates about logical omniscience (relevant only to Scenario 2) and counterfactuals (relevant only to Scenario 1).  

  #### 5. What Would Count as Failure  
  - **Failure mode 1 (Formal collapse):** The scenarios are indistinguishable once modelled. For example:  
    - Scenario 2 (learning entailment) *always* implies a hidden change in *P(E)*, reducing both to Scenario 1.  
    - Entailment learning in Scenario 2 formally replicates counterfactual confirmation, voiding the distinction.  
  - **Failure mode 2 (No added value):** The "entailment-learning" solution merely re-describes existing counterfactual machinery (e.g., *H ⊨ E* acts as a proxy for *¬E* in counterfactual reasoning).  
  - **Failure mode 3 (Hybrid dominance):** Most real-world cases (e.g., Mercury’s perihelion) exhibit *both* changing *P(E)* and entailment discovery, making the distinction irrelevant.  
  - **Failure mode 4 (Scope error):** Scenario 1 is rejected as not "old evidence" (since *P(E) < 1*), leaving only Scenario 2 as the genuine problem.  

  *Feasibility note:* This is manageable as a term paper. If Failure Mode 1 occurs early (Month 2), the project pivots to *why* the distinction collapses, salvaging a critique of unificationist approaches.  

  #### 6. Epistemic Clarity and Caveats  
  - **Settled:** All parties agree old evidence *is* a problem for Bayesianism and that *some* solution is needed. Glymour’s original case (Mercury’s perihelion) is accepted as paradigmatic.  
  - **Contested:** Whether logical omniscience is the *core* issue (disputed by Howson vs. Garber), and whether counterfactuals or entailment-learning are viable. **This proposal takes no stand on these debates**—it tests if *even if contested*, the two scenarios demand separate treatment.  
  - **Your idea’s vulnerability:** The distinction may be criticised because:  
    - Bayesians often treat "old evidence" as *certain* evidence (*P(E)=1*), excluding Scenario 1 (where *P(E)<1* initially). *Rebuttal:* Much evidence termed "old" (e.g., replicated results) fits Scenario 1—we argue for broadening the definition.  
    - Learning *H ⊨ E* might *always* affect *P(E)* if *H* influences *E*’s probability. *Mitigation:* Our models will isolate *E*’s probability (e.g., *E* is observational, *H* is theoretical).  

  #### 7. Conclusion  
  This project tests whether disentangling two conflated aspects of old evidence—evidential confidence shifts vs. entailment discovery—clarifies Bayesian solutions. Success would demonstrate that no unified solution exists, urging context-sensitive approaches. Failure (e.g., formal collapse) would reveal subtler unities in the problem. Either outcome advances the debate.  

  ---  
  **British English Compliance:** Recognise, behaviour, formalisation, initialised, etc.  
  **Word count:** ~6000 (scope feasible with focused formalisation; toy models keep maths tractable).  
  **References to add later:** Glymour (1980), Garber (1983), Howson (1984), Sprenger (2015), Steele (2022).
