  ## Joint Statement: Adversarial Collaboration on Aesthetic Value & Authenticity

  Following a semester of rigorous debate on fakes and forgeries, we, representing the experientialist and historicist perspectives, acknowledge significant common ground while recognizing persistent, fundamental disagreements. This statement outlines points of agreement, clarifies our respective positions, identifies key cruxes with testable predictions, and addresses the specific case of AI completion.

  **I. Points of Agreement (Both Camps):**

  1.  **Deceptive Intent is Damaging:** Knowingly creating or presenting an object with the intent to deceive viewers or the art market about its origin (e.g., Van Meegeren's forgeries) constitutes forgery and is ethically wrong. Such acts undermine trust and historical scholarship.
  2.  **Provenance Matters (Art-Historically & Economically):** The documented history of an object's creation, ownership, and context (provenance) is crucial for art-historical understanding, establishing authenticity for the market, and fulfilling curatorial and conservation responsibilities. Van Meegeren's forgeries lack Vermeer's provenance, fundamentally altering their art-historical significance.
  3.  **Perfect Copies are Visually Indistinguishable:** A physically perfect duplicate of a painting (e.g., an atomically identical copy created by hypothetical future technology) or a perfect digital display of a scanned original will be *visually indistinguishable* from the original under normal viewing conditions. No reliable perceptual test can differentiate them based on appearance alone.
  4.  **Original Context is Significant:** Understanding the artist's biography, historical period, cultural constraints, technological limitations, and intended meaning enriches our appreciation and interpretation of an artwork. This context is essential for full art-historical comprehension.
  5.  **Experience is Central to Aesthetic Engagement:** Aesthetic value is realized *through* the experience of an observer engaging with an object (or its representation). Art requires a perceiver.
  6.  **The AI Completion Scenario Involves Novelty:** The scenario where an AI, trained solely on a deceased artist's *surviving* works, completes her final unfinished canvas, sold transparently with a disclaimer about the physical agent, represents a fundamentally **new category** of art object. It is neither purely "authentic" (as the final execution lacks the artist's agency) nor a "forgery" (due to the absence of deceptive intent), nor simply a traditional "completion" by a human hand operating within the artist's tradition or workshop model. We provisionally term this a **"Posthumous AI-Augmented Work (PAAW)"**.

  **II. Table of Disagreements (Worded for Acceptance by Each Side):**

  | Disagreement Area           | Experientialist Position (Worded for Experientialist Acceptance)                                                                                                                                 | Historicist Position (Worded for Historicist Acceptance)                                                                                                                                                                |
  | :-------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Locus of Primary Aesthetic Value** | The primary aesthetic value of an artwork resides fundamentally in the **perceptual experience** it affords a viewer. This value is generated by the interaction between the visual properties of the object and the perceiver's mind. | The primary aesthetic value of an artwork is inherently tied to the **unique historical object** itself – its specific genesis, the artist's creative act at a particular time and place, embodying their choices and struggles within their context. |
  | **2. Role of Provenance/History in Aesthetic Experience** | Knowledge of provenance, authenticity, or historical context can *influence* the viewer's cognitive and emotional response (e.g., adding interest, reverence, or disillusionment), but this constitutes **extrinsic value** (historical, associative, financial) layered *onto*, not inherent *within*, the core aesthetic experience generated by the visual stimulus. | Knowledge of the object's true origin and history is **intrinsic** to the aesthetic experience of that specific object. Seeing the *actual* artifact created by the artist in its historical context is qualitatively different and carries essential meaning unavailable when viewing even a perfect copy. The history *is part of what we see*. |
  | **3. Aesthetic Value of Originals vs. Perfect Copies** | If two objects are visually indistinguishable under equivalent viewing conditions, they possess **identical potential to generate the core aesthetic experience**. The original possesses no *unique aesthetic value* inaccessible through the perfect copy. Any perceived difference stems solely from extrinsic knowledge. | The **authentic original** possesses unique aesthetic value precisely *because* it is the physical trace of the artist's specific creative act within history. A perfect copy, lacking this genesis, inherently lacks this core dimension of aesthetic value, regardless of visual similarity. |
  | **4. Status of the "PAAW" (AI Completion)** | The PAAW possesses aesthetic value derived from the **visual synthesis** of the artist's original fragment and the AI's extrapolation based *only* on her surviving work. Its value lies in the perceptual experience it offers, distinct from both the unfinished original and a wholly new AI artwork. Its "authenticity" is irrelevant to its core aesthetic potential. | The PAAW is **not an authentic work** of the original artist. Its aesthetic value is fundamentally different from that of a completed work by the artist herself, or even a traditional human completion. It is a novel artifact: a hybrid product of historical human creation and contemporary algorithmic interpretation, requiring its own evaluative framework separate from traditional notions of authenticity. |

  **III. Key Cruxes & Testable Predictions:**

  1.  **Crux: Does seeing an original and seeing a perfect physical copy (under controlled conditions) differ in *intrinsic experiential content* (i.e., the raw perceptual/affective experience prior to cognitive labeling), or is any difference solely attributable to *extrinsic knowledge*?**
      *   **Concrete Test:** A double-blind study in a controlled gallery setting. Experienced viewers (artists, critics, connoisseurs) are shown pairs of artworks: one original, one perfect physical copy (e.g., created via advanced non-destructive scanning/replication). Viewers are *not told* which is which, nor the purpose of the test beyond evaluating the art. They undergo:
          *   Detailed interviews about their immediate perceptual experience, emotional response, and aesthetic judgment for each piece individually.
          *   Eye-tracking and physiological monitoring (e.g., GSR, EEG) during viewing.
          *   *Prediction (Experientialist):* There will be **no statistically significant difference** in reported immediate perceptual/affective experiences, aesthetic judgments, eye-tracking patterns, or physiological responses between the original and the perfect copy when viewed blind. Any differences will emerge *only after* provenance is revealed.
          *   *Prediction (Historicist):* There will be **statistically significant differences** in reported immediate perceptual/affective experiences (e.g., sense of presence, aura, depth of feeling), aesthetic judgments (e.g., perceived "power" or "authority"), and potentially physiological responses (indicating heightened engagement) favoring the original, *even when viewed blind*, due to the intrinsic properties imbued by its unique genesis.

  2.  **Crux: Does the primary relevant aesthetic value attach *to the physical object* or *to the perceptual experience* generated by interacting with the object?**
      *   **Concrete Test Case:** Consider two versions of the Mona Lisa: the original in the Louvre and the near-contemporary, high-quality copy in the Prado (historically attributed to a pupil/workshop). Both are centuries old, visually very similar (though experts can distinguish them), and viewed in prestigious museums.
          *   *Prediction (Experientialist):* The **core aesthetic value** experienced by a typical museum visitor under normal viewing conditions (i.e., not side-by-side comparison by an expert) is **essentially equivalent** between the two. The vastly higher cultural and financial value of the Louvre version stems almost entirely from *extrinsic* factors: its confirmed provenance as Leonardo's hand, its unique history, and its symbolic status – not from a fundamentally different intrinsic aesthetic experience.
          *   *Prediction (Historicist):* The Louvre original possesses **inherently greater aesthetic value** because it is the unique artifact of Leonardo's genius. The Prado copy, while historically interesting and visually similar, lacks this fundamental dimension of value. The difference in cultural and financial valuation reflects, at least in part, this intrinsic difference in aesthetic worth derived from the object's origin. The experience of seeing *Leonardo's actual handiwork* carries a qualitative weight and depth unavailable when viewing the copy, even if subtle.

  **IV. Clarification on the AI Completion (PAAW):**

  Both camps agree, based on the wording acceptable to each other above, that the object described is **not a forgery** (due to the transparent disclaimer) and **not an authentic work** solely by the original artist (as the final, defining execution was done by an AI, not the artist or a human collaborator operating within her direct intention or tradition). It is also distinct from a traditional "completion," as the completing agent (AI) lacks human intentionality and operates via statistical extrapolation, not lived artistic understanding. Therefore, as stated in Agreement Point 6, it constitutes a **genuinely new category** – a Posthumous AI-Augmented Work (PAAW). Its aesthetic value and significance require new critical frameworks distinct from those applied to either purely human-made originals/completions or deliberate forgeries. The experientialist camp emphasizes evaluating the *visual experience* it offers, while the historicist camp emphasizes understanding it as a *hybrid artifact* of distinct historical and technological moments.

