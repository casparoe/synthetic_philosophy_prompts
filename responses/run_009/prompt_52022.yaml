answer: |-
  ### Joint Statement on Expected Utility and Geometric Rationality  
  **Adversarial Collaboration between Expected-Utility Orthodoxy and Ergodicity Economics**  

  #### 1. Agreed Claims  
  Both parties endorse the following statements:  

  1.1 **Mathematical Facts**:  
     (a) For repeated multiplicative gambles (i.e., wealth evolves as \(W_{t+1} = W_t \times R_t\), where \(R_t\) is a random return), maximizing the expected logarithm of wealth (\( \mathbb{E}[\log W] \)) maximizes the almost-sure long-run growth rate of wealth (\(\lim_{T \to \infty} \frac{1}{T} \log \frac{W_T}{W_0}\) almost surely).  
     (b) Staking one’s entire fortune on each trial of a repeated favorable-but-volatile gamble (e.g., 60% chance to double, 40% to lose everything) leads to ruin (i.e., \(\lim_{T \to \infty} W_T = 0\) almost surely) despite a positive expected monetary return per trial.  
     (c) In the standard repeated multiplicative gamble setting, both frameworks prescribe identical bets: the fraction of wealth that maximizes the expected logarithm (Kelly criterion), yielding the same growth-optimal strategy.  

  1.2 **Original Explananda and Extensions**:  
     (a) *Expected-Utility Theory (EUT)* was originally devised to resolve paradoxes like St. Petersburg (Bernoulli, 1738) by introducing curvature in utility over wealth, thereby explaining risk aversion. It has since been stretched to cover one-shot gambles, non-monetary outcomes, social preferences, and axiomatic foundations (von Neumann-Morgenstern).  
     (b) *Ergodicity Economics (EE)* was originally devised (e.g., Peters, 2011) to address non-ergodicity in multiplicative wealth processes, arguing that time averages (for a single trajectory) diverge from ensemble averages (across parallel worlds). It has since been stretched to reinterpret insurance, portfolio optimization, and macroeconomic growth as ergodicity-restoration problems.  

  1.3 **Prescriptive Agreement**:  
     Both frameworks concur that for repeated multiplicative gambles:  
     - The Kelly fraction is optimal.  
     - Utility curvature (EUT) and growth-rate maximization (EE) yield identical prescriptions.  
     - No other strategy dominates in the long run without risking ruin.  

  #### 2. Residual Disagreements  
  Each disagreement is stated twice: first in wording acceptable to the EUT proponent, second in wording acceptable to the EE proponent.  

  | Disagreement Topic | EUT-Proponent’s Formulation | EE-Proponent’s Formulation |
  |-------------------|----------------------------|----------------------------|
  | **Unfalsifiability** | Ergodicity economics implicitly assumes multiplicative dynamics and selects the wealth observable as the focal quantity, which functions as a free parameter to post hoc fit behavior—paralleling how utility functions are fitted in EUT. | Expected utility theory allows arbitrary curvature in utility functions, which functions as a free parameter to post hoc rationalize any observed behavior—paralleling how multiplicative dynamics and the wealth observable are objectively fixed in EE. |
  | **Scope of Rationality** | Rationality encompasses diverse risk attitudes (via utility curvature) and applies universally (one-shot or repeated gambles); growth maximization is a special case under logarithmic utility, not a universal principle. | Rationality is defined as maximizing long-run survival and growth; utility functions are redundant post hoc constructs that misattribute growth optimization to "risk aversion" in multiplicative settings. |
  | **Agreement on Bets** | The identical prescriptions in multiplicative gambles show the dispute is representational: EUT subsumes EE as a special case (log utility), and both reduce to the same calculus. | The identical prescriptions in multiplicative gambles do not resolve the dispute: EE identifies the correct physical rationale (ergodicity restoration), while EUT obscures it with psychologically ungrounded utility curvature. |
  | **Normative Authority** | Kelly’s result is derived from EUT via log utility; EE merely rediscovers this with unnecessary dynamical rhetoric, adding no new normative insight. | EE provides the correct dynamical foundation for growth optimization; EUT’s log utility is a coincidental mathematical isomorphism that misrepresents the underlying physics. |

  #### 3. Cruxes  
  For each crux, both parties accept the case/argument as probative. Predictions are stipulated in advance.  

  3.1 **Crux: Additive vs. Multiplicative Boundaries**  
     - *Case*: A salaried bettor risks fixed sums from income (additive dynamics) vs. a gambler with a compounding bankroll (multiplicative dynamics). A syndicate pools many independent gambles, converting individual risk into a near-deterministic ensemble average.  
     - *Argument*: Does growth-rate maximization (EE) or utility curvature (EUT) better explain behavior?  
       - **EUT Prediction**: Additive settings (e.g., salaried bets) require utility curvature for risk aversion; pooling (syndicate) exploits diversification, reducing the need for curvature. EE’s "ergodicity restoration" is just risk pooling—already explained by EUT.  
       - **EE Prediction**: Additive dynamics are ergodic, so expectation maximization suffices; multiplicative dynamics are non-ergodic, requiring growth-rate maximization. Pooling restores ergodicity, making insurance rational without utility curvature.  

  3.2 **Crux: Resets, Replacement, and Inheritance**  
     - *Case*: A trader who "resets" wealth annually (e.g., withdraws profits); a dynasty where wealth is inherited, creating discrete generational trajectories.  
     - *Argument*: Does the time-average view (EE) collapse when trajectories are finite or reset?  
       - **EUT Prediction**: Resets/inheritance validate utility curvature: short horizons justify linear or low-curvature utility, matching observed risk-seeking. EE’s growth maximization fails when trajectories reset.  
       - **EE Prediction**: Resets segment multiplicative processes; each segment requires growth-rate maximization. Inheritance extends the trajectory, preserving growth optimization as rational.  

  3.3 **Crux: One-Shot Gambles**  
     - *Case*: A single, non-repeated favorable gamble (e.g., 70% chance to triple wealth, 30% to lose all).  
     - *Argument*: Can growth-rate maximization (undefined for one shot) or utility curvature better prescribe behavior?  
       - **EUT Prediction**: Log utility prescribes fractional betting (Kelly), but other curvatures (e.g., linear for risk-seekers) are valid. EE lacks a coherent prescription without repetition.  
       - **EE Prediction**: One-shot gambles are embedded in lifelong wealth dynamics; fractional betting (Kelly) remains optimal to avoid ruin. EUT permits irrational all-in bets via linear utility.  

  #### 4. Closing Verdict: Substantive vs. Verbal Disagreements  
  We classify residual disagreements as follows:  
  - **Unfalsifiability**: Substantive. Both frameworks face symmetric calibration challenges, but the dispute centers on whether multiplicative dynamics (EE) or utility flexibility (EUT) is more parsimonious. EE posits an objective physical structure (wealth dynamics); EUT posits subjective preferences. This affects scientific testability.  
  - **Scope of Rationality**: Substantive. EUT defends a broad, flexible view of rationality (any consistent preferences); EE argues rationality is uniquely growth optimization in multiplicative contexts. This has normative implications: e.g., EUT permits "irrational" risk-seeking in one-shot gambles; EE forbids it as ruin-prone.  
  - **Agreement on Bets**: Substantive. While prescriptions align multiplicatively, the dispute is not merely representational. EE claims to expose a physical error in EUT (confusing ensemble/time averages), affecting how new cases (e.g., climate economics) are modeled.  
  - **Normative Authority/Rediscovery**: Partly verbal, partly substantive.  
    - *Verbal*: Both agree Kelly/log utility is mathematically identical to growth maximization; historical priority (Bernoulli → Kelly → Peters) is uncontested.  
    - *Substantive*: The source of normative authority diverges: EUT roots it in axiomatic consistency; EE roots it in dynamical survival. This shapes prescriptions when frameworks stretch (e.g., one-shot gambles).  

  **Final Judgment**: The core disagreement is substantive: EE argues that non-ergodicity is a physical constraint demanding growth optimization, while EUT treats it as one context for preference-based curvature. This affects foundational questions (e.g., "risk aversion as illusion") and applied domains (e.g., portfolio management with reset clauses). The unfalsifiability charge is symmetric but substantive—it hinges on whether dynamics or preferences are more fundamental. Only historical claims are purely verbal; the rest inform theory choice and normative guidance.
