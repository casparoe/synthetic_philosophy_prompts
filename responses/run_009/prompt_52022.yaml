prompt: |-
  My graduate seminar on rational choice this term has been animated by a running quarrel between a decision theorist of the expected-utility orthodox persuasion and a committed convert to what its proponents call ergodicity economics, and the two have spent the semester talking past each other about the Kelly criterion and what is now sometimes called geometric rationality. The former holds that risk attitudes belong in the curvature of a utility function over wealth, so that the Kelly criterion is simply what logarithmic utility prescribes — a device known since Bernoulli, repurposed by Kelly for a gambling-on-a-noisy-channel setting, and long since domesticated by expected-utility theory as one special case among many. The latter holds that for multiplicatively compounding processes the ordinary expectation is an ensemble average across parallel possible worlds, that a single agent lives along just one trajectory, and that maximizing the time-average growth rate — which amounts to maximizing the expected logarithm — is what rationality consists in, with no utility function required; on this view expected-utility theory accommodates the same behavior only by fitting a concave curve after the fact. Before the semester closes I intend to convene them for a proper adversarial collaboration, and I want the joint statement they should come out with. Draft it for me with the following structure. First, a numbered section of claims both sides could sign: about the mathematics (that maximizing expected log wealth maximizes the almost-sure long-run growth rate; that staking one's entire fortune on a repeated favorable-but-volatile flip leads to ruin almost surely; that in the standard repeated-gamble setting the two frameworks prescribe the same bets), about what each framework was originally invented to explain, and about the respects in which each has since been stretched. Second, a table of the residual disagreements, each stated twice — once in wording the expected-utility theorist would accept as a fair statement of her own view, once in wording the ergodicity proponent would accept as a fair statement of his. I have in mind at least the unfalsifiability charge, which cuts both ways: is logarithmic utility a free parameter fitted post hoc to whatever behavior is observed, or is the other side's choice of the wealth observable, together with the assumption of multiplicative dynamics, an equally free parameter doing the same work in reverse? And does their agreement on prescriptions show that the dispute is only about representation, or can two theories that always agree about bets still disagree about something that matters? Third, the cruxes — the subquestions such that settling one would move at least one side — and, for each, a case or argument both would accept as bearing on it, with each side's prediction written down in advance. The cases I would expect to see include the boundary between multiplicative and additive dynamics (a salaried bettor risking fixed sums out of income rather than out of a compounding bankroll; a syndicate that pools many independent draws and thereby lets one decision effectively ensemble-average; ordinary insurance, where the ergodicity camp says pooling converts a non-ergodic gamble into an ergodic one and the utility camp says risk aversion was doing that work all along), and settings where resets, replacement, or inheritance blur the single-trajectory picture the time-average view depends on. Fourth, a closing verdict on which residual disagreements are substantive and which are merely verbal — in particular, whether the charge that geometric rationality has merely rediscovered Kelly and Bernoulli is a dispute about historical priority, about the source of normative authority, or about nothing at all. The drafting is the hard part: every agreed claim must be one a reasonable member of each camp would actually sign, every statement of disagreement must be non-slanted in both directions, and the verbal/substantive classification must be argued rather than asserted.
reasoning: |-
  We are drafting a joint statement for an adversarial collaboration between an expected-utility (EU) theorist and an ergodicity economics (EE) proponent. The structure is:

  1. **Agreed Claims**: A numbered list of claims both can sign, covering:
     - Mathematics: max expected log wealth => max long-run growth rate; ruin from staking entire fortune on volatile repeated flip; same bets in standard repeated gamble.
     - Original purposes of each framework and how they've been stretched.

  2. **Residual Disagreements**: A table with each disagreement stated twice: once in EU-friendly terms, once in EE-friendly terms. Topics include:
     - Unfalsifiability: Is log utility a free parameter? Or is the choice of wealth observable and multiplicative dynamics a free parameter?
     - Agreement on prescriptions: Does it mean the dispute is only about representation? Or can two theories that agree on bets still disagree about something that matters?

  3. **Cruxes**: Subquestions that, if settled, would move at least one side. For each, a case or argument both accept, and each side's prediction in advance. Cases to cover:
     - Boundary between multiplicative and additive dynamics (e.g., salaried bettor, syndicate pooling, insurance).
     - Settings with resets, replacement, or inheritance (blurring the single trajectory).

  4. **Closing Verdict**: On which residual disagreements are substantive and which are merely verbal. Specifically, address whether the "rediscovery" charge is about historical priority, normative authority, or nothing.

  We must ensure every agreed claim is acceptable to both, every disagreement statement is non-slanted, and the verbal/substantive classification is argued.

  Let's begin.

  ---

  **Joint Statement on Expected Utility and Ergodicity Economics**

  **1. Agreed Claims**

  Both parties agree on the following:

  1.1. **Mathematical Facts**:
     (a) For a repeated multiplicative gamble (i.e., where wealth evolves multiplicatively: \( W_{t+1} = W_t \times R_i \) for outcome \( i \)), maximizing the expected logarithm of wealth (i.e., \( \mathbb{E}[\log W] \)) maximizes the almost-sure long-run growth rate of wealth (i.e., \( \lim_{T \to \infty} \frac{1}{T} \log \frac{W_T}{W_0} \) almost surely).
     (b) In a repeated favorable but volatile coin flip (e.g., 60% chance of doubling, 40% of losing everything), staking one's entire fortune on each flip leads to ruin (i.e., wealth approaches zero) almost surely, even though each bet has positive expected monetary return.
     (c) In the standard setting of repeated multiplicative gambles, both frameworks prescribe the same betting behavior: the fraction of wealth to wager that maximizes the expected logarithm of wealth (the Kelly criterion). This is because expected utility theory with a logarithmic utility function yields the same prescription as maximizing the time-average growth rate in ergodicity economics.

  1.2. **Historical Context**:
     (a) Expected utility theory (EUT) was originally developed (by Bernoulli and later axiomatized by von Neumann and Morgenstern) to explain choices under risk, particularly the St. Petersburg paradox and risk aversion, by introducing the curvature of the utility function over wealth. It has since been stretched to cover a wide range of decision contexts (e.g., uncertainty, intertemporal choice, social preferences) and various risk attitudes via different utility functions.
     (b) The ergodicity economics (EE) framework, as applied to economics, was originally developed to address the non-ergodicity of multiplicative wealth processes. It argues that for an individual facing repeated multiplicative gambles, the ensemble average (expectation) does not represent the time-average growth experienced along a single trajectory. It has since been stretched to reinterpret other economic phenomena (e.g., insurance, portfolio choice) and to advocate for time-average growth maximization as the universal principle of rationality in multiplicative settings.

  1.3. **Prescriptive Agreement**:
     Both agree that in the standard repeated multiplicative gamble setting, the prescriptions of EUT (with logarithmic utility) and EE (maximizing the time-average growth rate) are identical. This includes the same optimal fraction to bet and the same avoidance of ruinous strategies.

  ---

  **2. Residual Disagreements**

  The following table states the key residual disagreements, each presented in two ways: first in a formulation acceptable to the expected-utility theorist, and then in a formulation acceptable to the ergodicity economics proponent.

  | **Disagreement Topic** | **Expected-Utility Theorist's Statement** | **Ergodicity Economics Proponent's Statement** |
  |------------------------|------------------------------------------|-----------------------------------------------|
  | **Unfalsifiability** | The ergodicity economics framework relies on the choice of the wealth observable and the assumption of multiplicative dynamics, which are free parameters that can be adjusted to fit observed behavior. This makes the framework as unfalsifiable as expected utility theory, which fits a utility function to behavior. | Expected utility theory relies on the choice of a utility function, which is a free parameter that can be adjusted to fit any observed behavior. This makes it unfalsifiable. In contrast, ergodicity economics uses the objective growth rate of wealth, and the multiplicative dynamics are not assumed arbitrarily but are inherent in the compounding nature of wealth. |
  | **Nature of the Dispute** | The agreement in prescriptions shows that the dispute is only about the representation of the same underlying behavior. Expected utility theory provides a more general framework that can handle a wider range of scenarios (e.g., one-shot gambles, additive risks) without changing the core principles. | The agreement in prescriptions in multiplicative settings does not imply that the dispute is merely representational. Ergodicity economics reveals that expected utility theory is getting the right answer for the wrong reason: by fitting a concave utility function, it inadvertently captures the growth-optimal behavior, but it misattributes it to risk aversion. The dispute is about the fundamental rationale for rationality. |
  | **Scope of Rationality** | Rationality in decision theory is about consistent choice under uncertainty, and the curvature of the utility function reflects the decision maker's risk attitude, which can vary across individuals and contexts. Ergodicity economics inappropriately restricts rationality to long-run growth maximization, ignoring legitimate short-term concerns and non-wealth utilities. | Rationality is about surviving and thriving over time. In multiplicative settings, this requires maximizing the time-average growth rate. Expected utility theory allows for arbitrary risk attitudes, which can lead to ruinous behavior (e.g., risk-seeking in multiplicative settings) and thus fails to capture the objective demands of sustainability. |

  ---

  **3. Cruxes**

  We identify the following cruxes. For each, we provide a case or argument that both sides accept as bearing on the issue, and we record each side's prediction in advance.

  3.1. **Crux: Additive vs. Multiplicative Dynamics**

     *Case:* Consider a salaried bettor who risks fixed sums out of a steady income stream (additive dynamics) versus a professional gambler who risks a fraction of a compounding bankroll (multiplicative dynamics). Also, consider a syndicate that pools many independent identical gambles (e.g., insuring many independent risks) so that the law of large numbers applies and the outcome is nearly deterministic.

     *Argument:* In the additive case (fixed bets from income), the EE proponent might argue that the dynamics are additive and thus ergodic (since the time-average and ensemble-average converge), so maximizing expected monetary value is rational. The EU theorist would say that a risk-averse utility function might still be appropriate if the bettor is loss-averse. In the syndicate case, EE argues that pooling makes the gamble ergodic, so risk aversion is unnecessary; EU says that without pooling, risk aversion in the utility function is what makes the insured willing to pay a premium.

     *EU Prediction:* For the salaried bettor risking fixed sums, a concave utility function can explain risk aversion (e.g., betting less than the full amount on a favorable bet). For the syndicate, the EU theorist would say that the individual's risk aversion is what drives the demand for insurance, and the pooling by the insurer (who faces near-additive dynamics due to diversification) allows them to offer it.

     *EE Prediction:* In the additive income case, since the dynamics are additive, maximizing expected value is rational and no utility function is needed. For the individual without insurance, the gamble is non-ergodic (multiplicative in wealth) and thus requires maximizing the growth rate. The syndicate, by pooling, converts the non-ergodic gamble into an ergodic one (additive in the number of policies), so the insurer can charge a premium above the expected loss and the individual, by buying insurance, is effectively maximizing growth by avoiding ruin.

  3.2. **Crux: Resets, Replacement, and Inheritance**

     *Case:* Consider an investor who periodically resets their wealth (e.g., takes profits and starts anew) or an institution that has a fixed budget per year (resetting annually). Also, consider a dynasty where wealth is passed on to heirs, creating a sequence of decision-makers.

     *Argument:* The EE view depends on a single long-lived trajectory. If there are resets or replacement, the time-average growth rate over an infinite horizon may not be the relevant objective. The EU view can naturally handle these with discounting or changing utility functions.

     *EU Prediction:* With resets or finite horizons, a logarithmic utility function may no longer be appropriate. The decision maker might use a different utility function (e.g., linear for short horizons, or with discounting). The prescription would change based on the context.

     *EE Prediction:* If resets break the compounding, then the dynamics are no longer multiplicative in the long run. The objective should be adapted to the actual time horizon. However, if the reset creates a new multiplicative process (e.g., each year's investment is a new compounding process), then one should maximize the growth rate within each segment. For dynasties, the long-run growth rate remains the objective.

  3.3. **Crux: One-Shot Gambles**

     *Case:* A single gamble that is not repeated (e.g., a one-time investment opportunity).

     *Argument:* The EE proponent might argue that even one-shot gambles should be evaluated by their effect on the growth rate of wealth, but if there is no repetition, the growth rate is undefined. Alternatively, EE might treat it as the first step of a potential series. The EU theorist uses expected utility with a utility function that reflects risk attitude for one-shot gambles.

     *EU Prediction:* For one-shot gambles, there is no long-run growth to maximize. Thus, the rational choice depends on the decision maker's risk attitude as captured by the utility function. The Kelly criterion is not directly applicable.

     *EE Prediction:* Even one-shot gambles occur in the context of ongoing wealth management. The fraction to bet should still be chosen to maximize the expected logarithm of wealth because it avoids ruin and sets the stage for future compounding. Alternatively, if the gamble is truly isolated, then the growth rate argument doesn't apply, but such cases are rare.

  ---

  **4. Closing Verdict on Residual Disagreements**

  We now classify the residual disagreements as substantive or verbal:

  - **Unfalsifiability Charge**: This disagreement is substantive. Both sides agree that each framework can be adjusted to fit behavior, but they disagree on whether the adjustments are ad hoc or well-motivated. The EU theorist sees the utility function as a flexible tool for capturing preferences; the EE proponent sees the wealth observable and multiplicative dynamics as objectively given. This is not merely verbal because it affects how we model new situations and what we consider a "free parameter."

  - **Nature of the Dispute (Representation vs. Rationale)**: This is substantive. The agreement on prescriptions in multiplicative gambles does not resolve the question of why that behavior is rational. The EU theorist attributes it to risk aversion (a preference); the EE proponent attributes it to the objective demands of ergodicity and long-run survival. This difference matters for normative advice in non-standard settings (e.g., one-shot gambles, additive dynamics) and for the foundation of decision theory.

  - **Scope of Rationality**: This is substantive. The EU framework allows for a broader conception of rationality that includes non-wealth objectives and varying risk attitudes. The EE framework, in its pure form, restricts rationality to growth-rate maximization in multiplicative settings. This has practical implications for how we model decisions in finance, economics, and beyond.

  - **The Rediscovery Charge**: The charge that ergodicity economics has merely rediscovered the Kelly criterion and Bernoulli's logarithmic utility is not about historical priority (both sides agree on the history) but about the source of normative authority. For the EU theorist, the authority comes from the axioms of rational choice; for the EE proponent, it comes from the objective properties of dynamical systems. This disagreement is substantive because it affects how we justify the criterion and how we extend it to new domains. However, the historical priority aspect is merely verbal: both acknowledge the prior work of Bernoulli and Kelly.

  In conclusion, while the two frameworks prescribe the same bets in the standard repeated multiplicative gamble setting, they differ in their foundational justifications and their applicability to other contexts. These differences are substantive and not merely verbal, as they influence how we model, explain, and prescribe behavior in a broader set of decision problems.

