answer: |-
  Here are eight interview questions designed to press key aspects of the pragmatic/norm-based account of Moore's Paradox, each with a follow-up anticipating a likely response. They cover the core norm, commissive/ommissive asymmetry, embedding, past-tense asymmetry, and residual strangeness.

  1.  **Question (Core Norm):** You argue the absurdity arises because asserting "p" represents the speaker as believing that p, while asserting "I don't believe p" directly contradicts that representation. Could you elaborate on *exactly what kind of norm* is violated here? Is it primarily a norm against self-contradictory *representation* (even if the proposition isn't logically contradictory), or a norm against asserting what one manifestly lacks the required epistemic standing for, or something else entirely?
      *   **Likely Answer:** She might emphasize a constitutive norm of assertion (e.g., the Knowledge Norm or the Belief Norm), where asserting p *constitutively represents* the asserter as believing/knowing p. The contradiction is between this constitutive representation and the explicit denial.
      *   **Follow-Up:** If asserting p constitutively represents belief, does this mean that *every* sincere assertion of p *entails* the speaker *actually* believes p? If not, how does the *representation* differ from the *fact*, and why is the explicit denial of the belief *specifically* problematic in a way that, say, asserting p while secretly doubting it is not? Doesn't this blur the line between sincerity conditions and constitutive representation?

  2.  **Question (Commissive vs. Omissive - Asymmetry):** Your account seems to handle the commissive form ("p, but I don't believe p") naturally. However, the omissive form ("p, but I believe not-p") appears *stronger* – it doesn't just deny belief in p, it asserts belief in not-p. Do your proposed assertion norms treat these two forms identically, or is there a significant asymmetry in why they are absurd? If asymmetrical, how does the norm account for the heightened absurdity of the omissive?
      *   **Likely Answer:** She might argue both violate the same core norm against asserting p while simultaneously denying the belief representation inherent in asserting it. The omissive just makes the denial more explicit and commits the speaker to a stronger, contradictory belief.
      *   **Follow-Up:** If the core absurdity lies in the contradiction between asserting p (representing belief) and the second conjunct (denying that very belief), doesn't the omissive introduce a *second* contradiction: between asserting p and asserting belief in not-p? If the pragmatic account only needs the first contradiction (representation vs. denial), why does the omissive strike most people as *more* patently absurd than the commissive? Doesn't this suggest an *additional* logical or doxastic inconsistency beyond the pure assertion-norm violation?

  3.  **Question (Embedding & Lingering Strangeness):** A key piece of evidence for your view is that embedding a Moorean sentence in a conditional ("If it's raining but I don't believe it, the picnic is off") or attitude report ("John thinks it's raining but he doesn't believe it") drains away the assertoric absurdity. This supports the idea that the problem is tied to the *act* of assertion. However, even when merely *contemplating* or *considering* the unasserted Moorean proposition "p & ~B(p)", it still strikes us as deeply strange or defective in a way that, say, "p & q" does not. How does your purely pragmatic account explain *this* residual strangeness if it's not tied to the act of assertion?
      *   **Likely Answer:** She might suggest the strangeness arises because contemplating the proposition involves *imagining* asserting it, or because we implicitly recognize it as a proposition that *couldn't be properly asserted* by anyone who grasped its meaning and the norms of assertion.
      *   **Follow-Up:** But doesn't this explanation risk smuggling in a non-pragmatic element? If the *only* source of absurdity is the violation of assertion norms during the *act* of asserting, why should merely contemplating a proposition that *would* violate norms *if asserted* generate a feeling of intrinsic defectiveness? Compare it to contemplating "I am not speaking now" – we know it can't be *truly asserted*, but contemplating it doesn't feel intrinsically paradoxical in the same way "p & ~B(p)" does. Doesn't this suggest an underlying tension within the *content* itself, perhaps concerning the *concept* of belief?

  4.  **Question (Past-Tense Asymmetry):** Shifting to the past tense ("It was raining, but I didn't believe it") eliminates the absurdity and becomes a perfectly coherent, often true, and assertible thing to say. How does your assertion-norm account explain this dramatic temporal asymmetry? What changes when we talk about past beliefs?
      *   **Likely Answer:** She would likely argue that asserting a past-tense proposition like "It was raining" does *not* constitutively represent the speaker as *currently believing* it was raining at that past time. It represents them as believing *that it was the case then*. The second conjunct ("I didn't believe it") is about a *past* belief state. There's no contradiction because the assertion doesn't represent the speaker as *currently* holding the belief being denied.
      *   **Follow-Up:** This seems compelling. But doesn't this explanation decisively show that the operative norm governing the absurdity concerns the expression of *current*, occurrent belief? If the norm was fundamentally about belief *itself* (e.g., a prohibition on simultaneous belief and disbelief), wouldn't the past-tense version *also* be problematic when asserted, given that the speaker *now* believes both "p was true" and "I didn't believe p then"? Yet it's fine. Doesn't this temporal asymmetry strongly confirm that the paradox is rooted in the norms governing the *expression* of belief *at the time of utterance*, rather than any inherent flaw in the belief state described?

  5.  **Question (Belief Norm vs. Expression Norm):** Building on the past-tense point, your explanation seems to center on a norm governing *expression* (what asserting represents about the speaker *now*), not a norm governing the internal consistency of the *belief state* described. Does this mean your account *denies* that there's any essential irrationality or incoherence in the *state* of mind where p is true but the agent doesn't believe it? Is the paradox *solely* about the pragmatics of reporting that state?
      *   **Likely Answer:** Yes, she would affirm that the state of affairs (p being true while S doesn't believe p) is perfectly possible and not inherently irrational. The absurdity arises only when someone *tries to assert* this conjunction about their *current* state, violating the norms of how assertion represents belief.
      *   **Follow-Up:** While the *state* isn't logically impossible, isn't there a sense in which an agent *in* that state ("p is true right now, and I don't believe it") suffers from a specific kind of *doxastic* defect – perhaps ignorance or a failure of introspection – even if it's not full-blown logical contradiction? And if so, doesn't the Moorean utterance *also* inadvertently *reveal* or *manifest* this underlying doxastic defect in a uniquely direct and jarring way, contributing to its absurdity beyond the pure assertion-norm violation?

  6.  **Question (The "Representing as Believing" Mechanism):** You rely heavily on the idea that asserting p "represents the speaker as believing p." Could you clarify the metaphysics of this "representation"? Is it a conventional implicature, a presupposition, a Gricean implicature, or something more fundamental to the speech act itself? And crucially, how does this representation interact with explicit statements *about* the speaker's belief within the same utterance?
      *   **Likely Answer:** She would likely lean towards a constitutive rule or essential feature of the speech act of assertion itself (à la Searle or Williamson), not a cancellable implicature. The representation is built into what it *is* to assert.
      *   **Follow-Up:** If the representation is truly constitutive and non-cancellable, how is it possible for the speaker to *explicitly deny* that very belief ("I don't believe p") in the same breath? Doesn't the explicit denial attempt to *cancel* the representation generated by the first conjunct? If the constitutive representation is so robust that it cannot be cancelled, why does uttering the second conjunct even make sense? If it *can* be cancelled or overridden, doesn't that undermine the claim that it's the *source* of the contradiction with the second conjunct?

  7.  **Question (Other Speech Acts & Moorean Forms):** If the absurdity is tied specifically to the norms of *assertion*, we should expect similar conjunctions to be unproblematic in other speech acts. For example, could one coherently *suppose* "Suppose it's raining but I don't believe it" for the sake of argument? Or *ask*, "Is it raining but I don't believe it?"? Do these feel less absurd than asserting it, and does this support your view? If they *do* still feel somewhat odd, how does your account handle that?
      *   **Likely Answer:** She would likely argue that supposing or questioning doesn't carry the constitutive representation of belief that assertion does, so these embeddings should feel significantly less absurd or not absurd at all, supporting the assertion-specificity of the paradox.
      *   **Follow-Up:** While less jarring than assertion, doesn't "Suppose p & ~B(p)" still strike many as a slightly peculiar or unstable supposition to entertain seriously? Similarly, asking "Is it the case that p & ~B(p)?" feels stranger than asking "Is p true and do I believe it?". If your account predicts *no* residual strangeness in these non-assertoric contexts, but there seems to be *some*, how do you explain that without appealing to something beyond the pragmatics of assertion? Does this point back to the contemplation problem?

  8.  **Question (Self-Knowledge & Expression):** A common intuition is that the Moorean assertion is absurd because it seems to involve a failure of self-knowledge: how can you know p is true well enough to assert it, yet simultaneously know you don't believe it? Your norm-based account sidesteps the epistemology of self-knowledge. But doesn't the *possibility* of a speaker being in a position to *correctly* assert "p & ~B(p)" (even if pragmatically forbidden) require that they *can* know p is true while knowing they don't believe it? How does your account reconcile the pragmatic prohibition with the apparent epistemic possibility?
      *   **Likely Answer:** She would reiterate that the state is possible and knowable (as per the past-tense case). The prohibition is solely on *expressing* this conjunction about one's *current* state via assertion, due to the clash in representational commitments the speech act demands.
      *   **Follow-Up:** But if a speaker *were* actually in the state "p is true and I don't believe p", and they somehow *knew* this complex fact (perhaps through extraordinary third-person evidence about their own mind), wouldn't your account *still* forbid them from *asserting* this known truth? Doesn't this create a problematic disconnect where the norms of assertion prevent the expression of a knowable truth about one's own cognitive state? Doesn't this suggest the norms of assertion are, in this very specific case, potentially *incompatible* with the ideal of expressing known truths?

  These questions aim to probe the foundations of the pragmatic account, challenge its ability to handle all the data points (asymmetry, embedding strangeness, past-tense acceptability), explore the nature of the "representation" involved, and examine its implications for belief, self-knowledge, and truth-telling. Good luck with the interview!
