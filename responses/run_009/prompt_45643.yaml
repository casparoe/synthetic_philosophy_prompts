prompt: |-
  I'm a journalist on the ideas desk of a broadsheet, preparing a long feature on vagueness — the sorites paradox and its afterlife in ordinary institutions. I can navigate the philosophical basics myself, but the piece needs an argument rather than a tour, and I'd like your help stress-testing the angle I've chosen.

  My working thesis is that a newsdesk is a sorites machine. A political programme is not austerity until the cumulative cuts make it so; a string of light edits to a source's words stops being quotation somewhere long before the last edit; an armed conflict becomes a war, a poll lead becomes too close to call, and none of these thresholds is written down anywhere. Our style guide, like most, is silent on where such lines sit, and different subeditors resolve the same borderline case differently.

  So here is what I'd like you to do. Take the five main theories of vagueness — epistemicism (there is a sharp cutoff, we simply cannot know where it lies), supervaluationism (a borderline statement counts as true only if it comes out true on every admissible way of sharpening the term), degree theories on which truth itself comes in degrees, contextualism on which the extension of a vague term shifts with conversational context, and nihilism about vague predicates (there is no sufficiently precise fact for them to latch onto) — and rank them into tiers by how well each would hold up if a newsdesk actually tried to operationalise it. By operationalise I mean use as the basis for written rules that different subeditors, working independently, could apply to the same borderline case and reach the same verdict.

  For each theory, give a sentence or two explaining why it lands in its tier. Then give me a single number between 0 and 1 for the fraction of genuinely borderline editorial calls your top tier would settle cleanly, and explain what the residue consists of — the cases where even the best theory leaves the desk arguing.

  I want your judgement and reasoning rather than a reading list, so please work from what you already know; no citations or author attributions are required.

  Please lead with your bottom line in the first sentence — the tier list and the number — and then give the reasoning, with no preamble and no restating of the question.
reasoning: |-
  Okay, the user is a journalist working on a feature about vagueness, specifically how it applies to everyday institutions like a newsdesk. They've drawn a parallel between the sorites paradox and editorial decisions—like determining when a series of budget cuts becomes "austerity" or when edited quotes stop being quotations. Their thesis is that a newsdesk operates like a "sorites machine," where vague thresholds aren't explicitly defined, leading to inconsistent judgments by different subeditors. 

  They want me to rank five theories of vagueness based on how well each could be operationalized into written rules for a newsdesk. The goal is consistency: different editors applying the same rules to borderline cases should reach the same verdict. The theories are epistemicism, supervaluationism, degree theories, contextualism, and nihilism. 

  First, I need to evaluate each theory for real-world practicality in a newsroom. Operationalization means turning abstract philosophy into clear, actionable guidelines. What would that look like for each? 

  Epistemicism says there's a sharp cutoff, but we can't know it. If a newsdesk tried to use this, they'd have to pretend arbitrary lines are objective—e.g., "austerity starts after exactly five budget cuts." But this feels artificial. Subeditors might resist because it’s made up, and borderline cases would still provoke disagreement since the "real" cutoff is unknowable. Low practicality. 

  Supervaluationism requires defining "admissible sharpenings." For a quote, that might mean listing all permissible edits (e.g., minor grammar fixes allowed, but no rephrasing). If codified tightly, editors could apply it consistently. But it’s brittle—any unanticipated case (like a new type of edit) might not fit predefined rules, causing disputes. Mid-tier, with gaps. 

  Degree theories treat truth as partial (e.g., 60% true something is "war"). Newsrooms already use probabilistic language ("too close to call"), so this feels natural. Rules could assign thresholds, like a poll lead <3% is "close." But in messy cases—say, a conflict with mixed attributes—editors might still debate how to weigh factors. Better fit, but fuzzy residue. 

  Contextualism says meaning shifts with situation. For a newsdesk, rules might specify context markers, like "call it 'war' only during prime-time coverage." But contexts overlap and change fast. Two editors might disagree on what context applies, leading to inconsistency. Hard to standardize. 

  Nihilism rejects vague predicates altogether. If a newsdesk adopted this, they’d ban terms like "austerity" or "war" as meaningless. Impractical—journalism needs these terms. Rules would collapse into endless disclaimers or silence. Non-starter. 

  Now tiering: Contextualism and nihilism are too messy for standardization (Tier 3). Epistemicism’s arbitrariness limits it (Tier 2). Supervaluationism and degree theories are top contenders (Tier 1), but supervaluationism’s rigidity makes it slightly less adaptable than degree theories, which align with existing newsroom intuitions. 

  For the fraction settled: Degree theories could cleanly handle ~80% of cases by reducing them to quantifiable thresholds. The residue? Cases where variables can’t be measured (e.g., "public perception of austerity") or where rules conflict. Supervaluationism might settle ~90% if rules are exhaustive, but brittle with novelty. Balancing both, Tier 1 averages ~0.85. 

  The user’s deeper need: They want an argument, not just theory. Highlighting how even the "best" philosophy hits real-world limits in institutions underscores their thesis—that vagueness is unresolved and consequential. The residue examples (e.g., unquantifiable factors) reinforce that newsdesks are indeed sorites machines.
answer: |-
  **Tier List & Success Rate:**  
  Tier 1 (Most Operationalizable): Degree Theories → Settles ~85% of cases  
  Tier 2: Supervaluationism  
  Tier 3: Epistemicism, Contextualism  
  Tier 4 (Least Operationalizable): Nihilism  

  ---

  **Reasoning:**  
  **Tier 1: Degree Theories (e.g., fuzzy logic)**  
  Assign numerical truth values (e.g., "austerity" = 0.7 true after 5 cuts, 1.0 after 10). Rules could mandate thresholds (e.g., "use 'war' if conflict intensity ≥0.8"). Quantifiable metrics (casualty counts, territorial control) allow consistent application by different editors using shared scales.  
  **Residue (15%)**: Cases relying on unquantifiable factors (e.g., "public perception of austerity") or conflicting metrics (e.g., high casualties but low territorial gains).  

  **Tier 2: Supervaluationism**  
  Requires defining "admissible sharpenings" (e.g., "quotation" allows synonym swaps but not sentence restructuring). Codifiable as explicit editorial protocols ("permissible edits: grammar, minor rephrasing ≤3 words").  
  **Why not Tier 1?**: Brittle with novelty. Unforeseen cases (e.g., AI-paraphrased quotes) lack predefined "admissible" standards, forcing subjective judgments.  

  **Tier 3: Epistemicism & Contextualism**  
  - *Epistemicism*: Demands arbitrary but precise cutoffs (e.g., "austerity begins at 5.23% budget reduction"). Rules *can* be written but feel unjustified, inviting defiance from editors ("Why 5.23%?") and inconsistent compliance.  
  - *Contextualism*: Rules must specify shifting contexts (e.g., "use 'too close to call' only in election week"). Unworkably complex; contexts overlap (e.g., breaking news vs. analysis), and editors won’t agree on context boundaries.  

  **Tier 4: Nihilism**  
  Rejects vague predicates entirely ("austerity" is meaningless). Rules would ban essential journalistic terms ("war," "quotation"), paralyzing reporting. The desk either ignores the theory or collapses into silence.  

  **Success Rate Justification**:  
  Degree theories settle ~85% of cases by reducing ambiguity to measurable thresholds. The residue involves *ineliminable vagueness*:  
  - **Multidimensional sorites** (e.g., "war" requires intensity + duration + intent; thresholds conflict).  
  - **Ethical/political constraints** (e.g., refusing to label a regime "fascist" at 0.91 truth due to editorial policy).  
  - **Emergent vagueness** (e.g., AI-generated content defying existing "quotation" rules).  

  Even Tier 1 leaves 15% unresolved—proof that newsdesks *are* sorites machines, forced to make borderline calls philosophy can’t fully tame.
