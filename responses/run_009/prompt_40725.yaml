  Let me start by admitting the practice is theoretically messy. No single theory perfectly explains it, but we can trace dominant influences. The "remorse" language suggests retributive packaging for a consequentialist engine. But it's not purely either - more like consequentialism wearing a retributive mask.

  Biggest tension point: if desert is truly backward-looking, post-crime behavior shouldn't affect it. Yet legally, pleading guilty reduces culpability assessment. That contradiction is the user's central concern. I'll need to confront whether retributivism can stretch to accommodate this or if it's fundamentally incompatible.

  The innocence question is crucial too. If expressivism says pleading "accepts blame," what does that mean for innocent pleaders? This might expose the theory's hypocrisy. I should emphasize how each theory struggles here.

  For the "underdetermined" aspect, I'll show how different theories could justify the same practice for different reasons. That's why the system gets away with vague "remorse" rhetoric - it's theoretically promiscuous.

  Finally, the user wants practical implications: what would change under pure retributivism? Probably no discount - or capped symbolic reductions. But real-world constraints (docket pressures) make abolition unlikely. That disconnect between theory and practice is what's really bugging them, I think.

