  Hmm, they're sharp - they've already considered three angles: consequentialism (state efficiency), expressivism (symbolic messaging), and retributivism (could pleading reflect character?). But they want me to go deeper than textbook theories. The grubby reality of plea deals versus clean desert theory is the itch.

  Key challenges they're posing:
  - How can desert be "fixed" yet change with post-crime choices?
  - What about innocent defendants coerced by the trial penalty?
  - Is this practice fundamentally at odds with retributivism?

