answer: |-
  You've nailed the central tension: **plea discounts clash violently with retributive desert theory** while being cloaked in its language. Let's dissect the implicit theory behind the practice, its vulnerabilities, and what pure retributivism would demand.

  ### The Implicit Hybrid Theory: "Managerial Retributivism with Consequentialist Lubrication"
  The plea discount practice doesn't cleanly fit one theory. It's a messy, pragmatic hybrid prioritizing systemic efficiency, *framed* in retributive/expressivist terms to maintain legitimacy. Here's the reconstruction:

  1.  **Core Engine: State-Centered Consequentialism (Efficiency & Risk Avoidance):**
      *   **The Real Driver:** The primary function is reducing the enormous cost, time, and uncertainty of trials. The discount is the *price the state pays* to secure a guaranteed conviction and avoid the risk of acquittal (even on strong evidence). This is a pure cost-benefit calculation.
      *   **Punishment as Commodity?** Functionally, yes. The sentence becomes negotiable based on factors unrelated to the crime's gravity or offender's culpability at the time of the act. The "price" fluctuates based on prosecutorial leverage, caseload pressure, and the defendant's risk tolerance. This directly contradicts desert's fixed proportionality.
      *   **Implicit Presupposition:** The state's interest in efficient case resolution is sufficiently weighty to justify adjusting a punishment that *should* be deserved.

  2.  **Legitimizing Shell: Retributive/Expressivist Veneer ("Remorse/Acceptance"):**
      *   **The Necessary Fiction:** Pure consequentialism is politically and morally unpalatable for punishment. The "remorse/acceptance of responsibility" justification provides a retributive/expressivist *rationalization*:
          *   **Retributive Angle (Shallow):** Pleading guilty *might* indicate marginally less defiance or obstinacy *after the fact*, suggesting a *slightly* less blameworthy *current* character state. This stretches desert beyond the act to post-act conduct.
          *   **Expressivist Angle:** A guilty plea is a public act of submitting to the state's authority and affirming the wrongfulness of the act. Less punishment is needed to "send the message" because the defendant appears to be internalizing it. Contesting the charge requires a stronger "denunciatory" sentence to achieve the same expressive effect.
      *   **Function:** This veneer maintains the *appearance* of justice rooted in desert and moral communication, masking the underlying efficiency trade.

  3.  **The Hybrid Outcome:**
      *   **Desert is Malleable:** The "deserved" sentence is no longer fixed by the past act/culpability. It becomes contingent on the defendant's post-arrest strategic choice, fundamentally violating backward-looking desert.
      *   **The Innocence Problem is Glossed Over:** The expressivist/remorse justification collapses when applied to innocent defendants pleading guilty out of fear (a well-documented reality). Their plea is *not* an acceptance of responsibility or remorse for the act. The system implicitly accepts this collateral damage as a price of efficiency, undermining its own moral justifications.
      *   **Power Imbalance is Central:** The size of the discount reflects prosecutorial power and the defendant's vulnerability (resources, risk of a much harsher sentence), not a calibrated assessment of remorse or reduced desert.

  ### Underdetermination: Multiple Theories *Could* License It (Badly)
  You're right; the practice *can* be awkwardly justified by different theories, which is why it persists despite the tension:

  *   **Consequentialism (Pure):** Easily justifies it as cost-saving and conviction-maximizing. Punishment is a tool; discounts are an efficient bargain.
  *   **Expressivism (Strained):** Can argue the plea itself communicates submission/message acceptance, requiring less punitive communication. The trial becomes a defiant act needing stronger denunciation.
  *   **Character Retributivism (Very Stretched):** If desert is based on *enduring* bad character, fighting the charge *might* be seen as evidence of worse character (defiance, lack of remorse) than pleading (acquiescence). This stretches "character at the time of the act" to "character during prosecution."
  *   **Weak Retributivism + Pragmatism:** "Retributivism sets a *range* of deserved punishment. Efficiency concerns allow us to pick the lower end for pleas, the higher end for trials." This still violates the spirit of fixed desert proportional *only* to the act/culpability.

  **However, the practice doesn't *presuppose* any *single coherent* theory.** It presupposes **system survival requires efficiency**, and **legitimacy requires desert/expressivist language**, regardless of inconsistency. The *implicit commitment* is to efficiency first, justification second.

  ### What Pure Retributivism Demands (Radical Change)
  If we took backward-looking, act-focused retributivism seriously:

  1.  **The Discount Disappears (or Shrinks to Symbolism):** Post-crime conduct (pleading vs. trial) is fundamentally irrelevant to desert, which is fixed at the moment the crime is completed. Being unremorseful or forcing the state to prove its case doesn't make the original act *more* wrongful or the actor *more* culpable *at that time*.
  2.  **Remorse Becomes Irrelevant at Sentencing (for Desert):** Remorse might affect parole or rehabilitation efforts (forward-looking), but not the *deserved* quantum of punishment for the past act.
  3.  **Sentencing Becomes Formulaic (in theory):** Sentence = f(Gravity of Offense, Offender's Culpability at Time of Offense, Criminal History as proxy for culpability). No adjustment for plea.
  4.  **The Trial Penalty Vanishes:** Going to trial simply means you get the sentence you deserve based on the act. You don't get *extra* punishment for exercising your right or making the state do its job.

  ### Where My Reconstruction is Most Vulnerable (and Your Defense)
  1.  **Judicial Sincerity:** **Weakest Link:** My claim that "remorse" is mostly a veneer. A judge might genuinely argue:
      *   *"I *am* assessing true remorse/reduced culpability. The plea is strong *evidence* of it, and fighting tooth-and-nail *is* evidence of worse character/defiance relevant to desert."*
      *   **Your Counter:** Push the *temporal* point: Desert is based on culpability *at the time of the act*. How does *post-hoc* defiance make the *original act* more culpable? Cite cases where clearly innocent people plead guilty due to the penalty – does the judge *really* believe they are more culpable/deserving than a guilty pleader? Cite studies showing plea discounts correlate with caseload pressure/prosecutor incentives, not nuanced remorse assessments. Ask: If remorse is key, why isn't it assessed independently of the plea (e.g., via evaluation)? Why is the discount automatic and substantial?
  2.  **"Acceptance of Responsibility" as a Separate Desert Element:** A retributivist might argue that fully accepting responsibility for one's wrongful act is a *component* of the moral desert calculus *itself*, separate from the act. Failing to accept it makes the *total wrong* greater.
      *   **Your Counter:** This fundamentally merges the act with the state's *response* to the act. Is the wrong of murder *increased* if the killer doesn't confess? Isn't the core wrong the killing itself? This view makes desert contingent on the offender's reaction to being caught, not the inherent gravity of the initial wrong. It also crumbles for the innocent pleader.
  3.  **Systems with Formalized, Smaller Discounts:** Some jurisdictions have structured, modest sentence reductions for early pleas (e.g., 10-15%).
      *   **Argument for Compatibility:** This isn't a coercive "penalty," but a small, predictable reduction acknowledging the administrative benefit, *within* the deserved range.
      *   **Counter:** Even a small discount based purely on plea timing still adjusts desert for post-crime conduct. Does saving the state 1 week of trial time truly make the offender 10% *less* deserving of punishment for their armed robbery? Pure retributivism says no. It's still efficiency influencing desert.
  4.  **The "Range" Argument:** "Retributivism allows a *range* of deserved sentences; pleading guilty justifies the lower end."
      *   **Counter:** Why? What *desert-based* principle justifies placing the plea at the lower end and the trial at the higher end? If the range reflects uncertainty about culpability, a trial might *reveal* information placing the sentence anywhere in the range – the plea doesn't inherently point lower based on desert alone. This argument usually smuggles in consequentialism.

  ### In Conclusion
  The plea discount practice is fundamentally **consequentialism (efficiency) disguised in retributive/expressivist drag ("remorse")**. It presupposes that systemic needs justify distorting desert-based proportionality. Pure retributivism cannot coherently accommodate it without abandoning its core backward-looking, act-focused commitment. To take retributivism seriously, the discount would need to vanish, replaced by sentences determined solely by the gravity of the offense and the offender's culpability at the time it was committed. The "trial penalty" is the starkest evidence that our system prioritizes managerial efficiency over the consistent application of desert theory, despite its official rhetoric. Defend this by relentlessly focusing on the *temporal* mismatch: desert looks back to the crime, the plea discount looks to choices made in the shadow of state power *after* arrest.
