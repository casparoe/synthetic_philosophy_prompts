answer: |-
  ## MEMORANDUM  
  TO: Editorial Standards Committee  
  FROM: Chair, Standards Committee  
  DATE: 23 October 2023  
  SUBJECT: Recommendation on Reporting Policy for Racial Slurs in Public Discourse  

  **1. Summary**  
  After careful deliberation on the case involving the county planning board member’s use of a racial slur, the committee recommends a **tiered contextual approach**:  
  - **Verbatim quotation** is permitted *once* in the main body text of the feature, strictly when essential for documenting the nature of the offense.  
  - **Asterisked partial redaction** (e.g., "n\*\*\*\*\*") must be used in all headlines, subheadings, push notifications, and social media previews.  
  - **Unedited verbatim quotation** is retained in archival transcripts, video captions, and embedded multimedia.  
  This policy balances documentary integrity, reader agency, and harm mitigation while addressing platform-specific risks.  

  **2. Context & Principles**  
  Our mandate demands reconciling competing imperatives:  
  - **Accuracy & Public Record:** Journalism’s core function requires documenting consequential acts, particularly those occurring in public forums. Euphemism risks obscuring the severity of racist acts.  
  - **Harm Mitigation:** Slurs function not merely as referential terms but as linguistic acts of violence. Their recirculation can inflict trauma, normalize toxicity, and extend the perpetrator’s impact.  
  - **Reader Agency:** Individuals deserve control over exposure to harmful content where feasible.  
  - **Consistency:** Policy must acknowledge our multiplatform reality—print, web, video, newsletters—where formats impose different constraints on audience consent.  

  The **use/mention distinction**—differentiating *using* a slur to demean from *mentioning* it to report—provides a crucial framework. However, it is insufficient alone. As linguistic philosophy recognizes, the *utterance* of a slur (even in quotation) retains a perlocutionary force—an inherent capacity to shock, offend, or re-traumatize—rooted in historical and social context, not just semantic content. Quotation does not fully "neutralize"; it *recontextualizes*. Our policy must therefore minimize gratuitous exposure while ensuring essential truths are not sanitized.  

  **3. Recommended Policy**  
  Desk editors shall apply the following rules without further consultation:  

  > **a. Print & Digital Body Text:**  
  > - The slur may be quoted verbatim *once*, only when its specific utterance is central to understanding the gravity of the event or the perpetrator’s intent.  
  > - This instance must be preceded by a clear contextual warning (e.g., "During his remarks, [Name] used the racial slur ‘[slur]’").  
  > - Subsequent references within the same article must use "[the slur]" or "the racial epithet."  
  > - If the article’s core focus is the *impact* or *backlash* rather than the *specific utterance*, verbatim quotation is prohibited; use "a racial slur against Black Americans" or similar.  
  >  
  > **b. Headlines, Push Notifications, Email Subject Lines, Social Previews:**  
  > - Verbatim quotation is strictly prohibited.  
  > - Use asterisked partial redaction (e.g., "n\*\*\*\*\*") *only* if the specific identity of the slur is crucial for reader understanding in the limited space.  
  > - Prefer descriptive phrasing where possible (e.g., "Official Used Racial Slur at Hearing").  
  >  
  > **c. Multimedia & Captions:**  
  > - Audio/video recordings may be presented unbleeped.  
  > - Captions/transcripts accompanying such media may include the verbatim slur.  
  > - A prominent, unmissable content warning must precede access to the clip (e.g., "WARNING: Contains explicit racist language").  
  >  
  > **d. Archives:**  
  > - Official, unedited transcripts retain verbatim language.  

  **4. Reasoning & Engagement with Counterarguments**  
  This policy prioritizes **documentary necessity while constraining gratuitous circulation**.  

  *   **Against Verbatim Quotation in All Textual Contexts (Standards Editor’s Position):**  
      The argument for unwavering fidelity to the public record is powerful. Omitting the specific word *can* diminish comprehension of the act’s venom and shield perpetrators from the full weight of accountability. **We concede this point *in the specific context of the core narrative body*, hence the single permitted verbatim use.** However, extending this to headlines, notifications, or casual repetition ignores the **amplified harm of uncontrolled dissemination**. A slur in a push notification isn’t encountered within a journalistic frame explaining its condemnation; it becomes an unwarranted assault. The "mention" is functionally indistinguishable from "use" in this context. Further, verbatim repetition beyond necessity serves little informational purpose while amplifying harm.  

  *   **Against Paraphrase/Asterisking in Body Text (Features Editor’s Position):**  
      The desire to prevent our pages from being vectors for hate speech is ethically sound and acknowledges the real harm caused by encountering the word. **We agree entirely regarding headlines and notifications, hence their stricter treatment.** However, consistent, absolute paraphrase in the body risks **sanitizing bigotry**. Describing the member as having "used a slur" fails to convey the specific, historical violence embedded in *this particular word*. When the precise nature of the offense is the story, excessive abstraction can undermine journalistic responsibility. A single, tightly controlled verbatim instance, heavily contextualized, provides necessary clarity without sensationalism.  

  *   **On Asterisking as Compromise (Third Colleague) & the "Reader Completion" Critique (Fourth Colleague):**  
      Asterisking is rejected in the body text because it **fails as a neutral solution**. As noted, it forces mental reconstruction, potentially implicating the reader in the act. It also risks trivialization through familiarity or even dark humor. However, it finds a justified role **in headlines and notifications**. Here, space constraints make descriptive phrasing difficult, and the primary need is to signal the *type* and *severity* of offense ("slur" is too generic; "racial epithet" may be unclear) *without* delivering the full verbal assault. Asterisking signals "this specific, grievous word was used" while blocking its full, unmitigated transmission. It is a harm-reduction tool for constrained formats where reader consent is absent.  

  **5. Addressing Key Wrinkles**  
  *   **Multimedia Captions Inconsistency:** The policy explicitly distinguishes between *journalistic framing* (body text, headlines) and *evidentiary documentation* (captions, transcripts). Captions serve as a direct record of the audio/video source material. Readers understand this distinction; a transcript without the verbatim word would be factually inaccurate. The contextual warning mitigates the risk.  
  *   **Newsletter/Push Notification Exposure:** This is the most ethically fraught vector. Asterisking in previews/subject lines provides critical friction, signaling the gravity *before* full exposure within the article (where context and warnings exist). We further recommend a blanket editorial practice: **Include "[Content Warning]" in the subject line/preview text** for any story involving explicit slurs or graphic descriptions of hate speech. This empowers readers to defer opening if unprepared.  

  **6. Implementation**  
  This policy takes effect immediately. Desk editors must:  
  1.  Scrutinize whether verbatim use in the body text is *essential* to the article’s core purpose.  
  2.  Apply asterisking rigorously to all promotional text (headlines, notifications, social previews).  
  3.  Mandate content warnings on all platforms hosting unedited audio/video containing the slur.  
  4.  Ensure verbatim use in the body occurs *once only*, with clear contextual framing.  

  **7. Conclusion**  
  This recommendation rejects both absolute prohibition and unfettered reproduction of racial slurs. It adopts a **nuanced, context-dependent, and platform-aware approach** that prioritizes:  
  - **Accuracy** where essential for understanding the severity of public misconduct.  
  - **Harm Reduction** by severely restricting exposure in uncontrolled contexts.  
  - **Reader Respect** through warnings and constrained formatting.  
  - **Operational Clarity** for editors.  

  It acknowledges the irreducible tension in reporting hate speech but provides a principled, actionable framework for navigating it. I move that the committee adopt this policy.  

  **Vote Recommended:** ADOPT the Tiered Contextual Policy as stated.
