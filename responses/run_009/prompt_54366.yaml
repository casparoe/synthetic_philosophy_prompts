prompt: |-
  I direct grantmaking for a small family foundation. We make roughly thirty grants a year, none large enough to fund a project outright but each large enough to matter, across three areas the charter names without ranking them: early-stage medical research, music education in under-resourced schools, and land conservation. The board requires every decision to be defensible in a paragraph to a rejected applicant; I have one part-time analyst and about twenty minutes of committee time per shortlisted proposal.

  Our difficulty is not ranking within a category — we can usually order the medical proposals against one another, the music proposals against one another. It is comparing across categories: a pilot study of a cheap diagnostic against a proposal that would keep a rural school's music program alive for three years. Some years we agonize over such pairs; some years the loudest trustee prevails. I have come to suspect the agonizing is sometimes a category error (there was a common currency all along, and we should have computed) and sometimes the only honest response (there was no currency, and no amount of deliberation will manufacture one). I cannot currently tell which situation we are in, and I would like a procedure that can.

  Please write a decision procedure the committee can run in a meeting, grounded in what the philosophy of value actually says about incommensurability and hard choices — Raz on how options can be excluded from comparison before any weighing occurs; Chang on parity, including her test of whether a small improvement in one option would decisively tip the balance, and on what follows when it would not; and the distinction between a tradeoff that is painful but has a common currency and a comparison in which no currency exists at all. The procedure should specify, in this order: gatekeeping questions that stop it with a no (mission fit, basic competence — so that value comparisons occur only between proposals that have already cleared the bar); tests for whether a given pair is commensurable, incomparable, or on a par, phrased so a non-philosopher can apply them in five minutes; and what to do in each case — when to compute, when the correct instrument is a lottery or a rotation between categories and why that is not an abdication of responsibility. It should end by marking the point at which the procedure runs out and hands the decision to the committee because the remaining question is one of values rather than facts, together with a sentence on what the committee is doing at that point — making a reason rather than discovering one, if that is the right way to put it.

  Then run it on three comparisons. First, two medical research proposals whose expected benefits are both expressible, roughly, in life-years. Second, the diagnostic pilot against the rural music program. Third, a music education proposal against a land conservation proposal in which I privately want the music one to win. Report honestly where the procedure gives an answer I will not like — my guess is that it will sometimes tell us a tie was broken by lot, and that the paragraph to the rejected applicant must say that rather than pretend the winner was better. Finally, state plainly what the procedure cannot do.
reasoning: |-
  We are designing a decision procedure for a grantmaking committee that must compare proposals across three incommensurable categories: medical research, music education, and land conservation. The procedure should be grounded in philosophical concepts of value, incommensurability, and hard choices (drawing on Raz and Chang). The goal is to provide a structured way to determine when comparisons are possible and when they are not, and what to do in each case.

  The procedure has the following steps:

  1. **Gatekeeping**: Eliminate proposals that do not meet basic criteria (mission fit, competence, feasibility) so that the remaining proposals are all eligible and of acceptable quality. Only proposals that pass this step are considered for comparison.

  2. **Within-Category Ranking**: Rank proposals within each category. This is straightforward and can be done using category-specific criteria.

  3. **Cross-Category Comparison Procedure** (for pairs of proposals from different categories that are being considered for funding at the same time):

     a. **Check for Commensurability**: 
        - Are the values at stake in the two proposals reducible to a common currency (e.g., dollars, QALYs, or some other measurable unit) that the foundation accepts as a basis for comparison? 
        - If yes, then the proposals are commensurable. Compute the relative value and make the decision accordingly.

     b. **If not commensurable, check for Comparability via Raz's exclusion**:
        - According to Raz, sometimes options are excluded from comparison because they are so different that they do not share a common evaluative dimension. 
        - Ask: Is there any relevant dimension (even if not a single currency) along which we can compare these two proposals? (For example, impact, urgency, alignment with foundation values, etc.)
        - If there is no shared dimension that the foundation deems relevant, then the proposals are incomparable. Skip to step 3d.

     c. **If there is a shared dimension, apply Chang's test for parity**:
        - Consider two proposals A and B (say A is from category X and B from category Y). 
        - Test 1: Is A better than B? If yes, choose A.
        - Test 2: Is B better than A? If yes, choose B.
        - If neither is better, then consider: Would a small improvement in A (e.g., a slight increase in impact or a minor reduction in cost) make it decisively better than B? Similarly, would a small improvement in B make it decisively better than A?
          - If a small improvement in A would make it decisively better than B, then A and B are not on a par; they are incomparable? (But note: Chang's parity test is designed for when small improvements don't change the fact that neither is better and they remain tied.) 
          - Alternatively, Chang's test for parity: If neither A nor B is better than the other, and a small improvement in one does not make it better than the other, then they are on a par.

        - If they are on a par, then there is no fact of the matter about which is better, but they are comparable in the sense of being roughly equal (though not exactly equal). In such a case, we can break the tie by a non-reason-based method (like a lottery) without violating rationality.

     d. **Decision Rules**:
        - Commensurable: Compute and choose the one with the higher value.
        - Comparable and one better than the other: Choose the better one.
        - On a par: Break the tie by a fair lottery (or by rotation between categories if this is a recurring situation and we want to avoid the perception of arbitrariness). 
        - Incomparable (no shared dimension, or after applying the above tests we cannot establish any relation): Then the foundation must decide by an alternative method. Since the foundation must make a decision, we might use a lottery or rotation. However, note that incomparability might be rare if we can find at least one shared dimension (like foundational values). If we cannot, then we might default to a lottery.

  4. **Final Decision Point**: When the procedure runs out (i.e., when we have to break a tie between options that are on a par or incomparable), the committee must make a decision that is not based on a discovered reason but on a commitment to a value. At this point, the committee is "making a reason" (creating a justification) by choosing a method (lottery, rotation) that is fair and consistent with the foundation's values. The paragraph to the rejected applicant must honestly reflect that the decision was made by lot (if that was the method) and not pretend that the winner was superior.

  Now, let's run the procedure on three examples:

  **Example 1: Two medical research proposals**

  Proposal A: A pilot study for a diagnostic for disease X, expected to save 100 life-years over 10 years.
  Proposal B: A drug trial for disease Y, expected to save 110 life-years over 10 years.

  - Gatekeeping: Both pass.
  - Within-category: We are comparing within medical, but the procedure is for cross-category. However, note these are both medical. So we would normally just compare by the common currency (life-years). But let's apply the cross-category procedure for demonstration.
  - Commensurability: Both are expressed in life-years (a common currency). Therefore, we compute: Proposal B has 110 vs 100, so B is better. We choose B.

  **Example 2: Diagnostic pilot (medical) vs Rural music program (music education)**

  Proposal A (medical): Pilot study of a cheap diagnostic, expected to save 50 life-years.
  Proposal B (music): Keep a rural school's music program alive for three years.

  - Gatekeeping: Both pass.
  - Commensurability: Is there a common currency? The foundation does not have a standard way to convert the value of music education into life-years. So no common currency. They are not commensurable.
  - Raz's exclusion: Are they comparable on any shared dimension? The foundation values both medical research and music education. We might consider:
     - Urgency: Is the diagnostic needed immediately? Is the music program about to collapse?
     - Scale of impact: The diagnostic might affect many people, but the music program affects a specific community deeply.
     - Foundational values: The foundation's charter does not rank the categories. So we might not have a shared dimension that allows a clear comparison.

    However, let's assume the foundation has no shared dimension that can be used to compare a medical life-year to the value of a music program. Then they are incomparable? But let's try Chang's test.

  - Chang's parity test:
     - Is A better than B? Not clearly, because they are in different categories and we have no common measure. Similarly, is B better than A? No.
     - Now, consider a small improvement in A: Suppose the diagnostic could be developed a bit faster, saving 51 life-years. Does that decisively make A better than B? If we still cannot say that 51 life-years is clearly more valuable than the music program (because we don't have a conversion rate), then no. Similarly, a small improvement in B (say, extending the program to one more school) would not make it decisively better than A.

    Therefore, they are on a par.

  - Decision: Since they are on a par, we break the tie by a fair method. We could flip a coin or use a rotation system (if we have funded more medical recently, then choose music, or vice versa). The paragraph to the rejected applicant must say that both were excellent and the decision was made by lot (or rotation) due to the absence of a clear basis for choosing.

  **Example 3: Music education vs Land conservation (and I privately want the music one to win)**

  Proposal A (music): A music education proposal in an under-resourced urban school.
  Proposal B (conservation): Protecting a parcel of land from development.

  - Gatekeeping: Both pass.
  - Commensurability: No common currency (e.g., we can't convert acres conserved to music lessons). They are not commensurable.
  - Raz's exclusion: Is there a shared dimension? The foundation might consider:
     - Long-term impact: Conservation might be permanent, while music education is for a fixed term.
     - Number of people affected: The music program might serve 100 students per year, while the conserved land might be used by a community for recreation and provide ecological benefits to a larger region.
     - Alignment with the foundation's values: The charter does not rank, but the foundation might have other values (like equity, sustainability) that could be applied.

    However, without a clear shared metric, we might not be able to compare.

  - Chang's test:
     - Is A better than B? No. Is B better than A? No.
     - If we improve A slightly (e.g., add an extra year to the program), does that make it decisively better than B? Probably not, because we still lack a common measure. Similarly, a small improvement in B (say, adding a small adjacent parcel) wouldn't make it decisively better than A.

    Therefore, they are on a par.

  - Decision: Break the tie by lot or rotation. But note: The grantmaker privately wants music to win. The procedure does not allow subjective preference to override. The procedure requires using the fair method. So if the lottery (or rotation) picks conservation, then that must be the outcome. The paragraph must explain that the decision was made by lot (or rotation) because both were highly valued and the foundation could not distinguish between them on objective grounds.

  **What the procedure cannot do:**

  - It cannot create a common currency where none exists. It cannot force incommensurable values to be compared by a single measure if the foundation does not accept one.
  - It cannot eliminate the need for judgment entirely. The gatekeeping and the determination of shared dimensions (in Raz's step) require judgment.
  - It cannot make the decision when the options are incomparable or on a par without resorting to a non-reason-based method. The foundation must be willing to accept that sometimes a lottery or rotation is the fairest way.
  - It cannot replace the foundation's values. The procedure helps structure the decision but does not create values. At the point of making a tie-breaking decision, the committee is exercising its authority to choose a method (lottery, rotation) that reflects the foundation's commitment to fairness and its charter.

  **Final note:** The paragraph to the rejected applicant must be honest. For example, in the case of a lottery: "Both proposals were exceptional and met our criteria. Given that we could not identify a clear basis for choosing one over the other, we used a random selection method to ensure fairness. Unfortunately, your proposal was not selected this time."
answer: |-
  Below is a decision procedure for cross-category grant comparisons, grounded in the philosophy of value (Raz, Chang) and designed for practical use by non-philosophers. It addresses gatekeeping, tests for commensurability/incomparability/parity, and actions for each outcome. The procedure assumes proposals have already passed basic due diligence (e.g., legality, feasibility) and focuses on value comparisons between shortlisted proposals.

  ---

  ### **Decision Procedure for Cross-Category Grant Comparisons**

  #### **Step 1: Gatekeeping (5 minutes per proposal)**  
  *Purpose: Eliminate proposals that fail non-negotiable criteria before value comparisons.*  
  - **Ask:**  
    1. Does the proposal fit our foundation’s mission (early medical research, music education in under-resourced schools, or land conservation)?  
    2. Is the applicant organization competent (e.g., track record, realistic budget)?  
    3. Would the grant make a meaningful difference (e.g., not redundant, addresses a clear need)?  
  - **Decision:**  
    - If **any answer is "no"**, reject immediately. No value comparison is needed.  
    - If **all answers are "yes"**, proceed to cross-category comparison.  

  *Why this first?* Raz argues that some options are "excluded from comparison" if they fail basic norms or agency goals. This step avoids wasting time on misfits.

  ---

  #### **Step 2: Test Commensurability/Incomparability/Parity (5 minutes per pair)**  
  *Purpose: Determine if proposals can be rationally compared.* Apply these tests to two shortlisted proposals from different categories (e.g., medical vs. music).  
  - **Test 1: Commensurability (common currency)**  
    - **Ask:** "Can both proposals’ core benefits be measured in the **same unit** (e.g., dollars, life-years, tons of CO2 reduced) that we accept as decisive?"  
    - **If yes:** Proposals are commensurable. Proceed to computation (Step 3a).  
    - *Example:* Two medical grants both quantified in life-years saved.  

  - **Test 2: Raz’s Incomparability (no shared dimension)**  
    - **Ask:** "Do these proposals lack **any shared evaluative dimension** we care about (e.g., impact scale, urgency, equity)?"  
      - *Clarifier:* If one proposal’s core value (e.g., "artistic dignity") is irrelevant to the other (e.g., "biodiversity"), and no overlap exists in foundation values, they are incomparable.  
    - **If yes:** Proposals are incomparable. Proceed to Step 3b.  

  - **Test 3: Chang’s Parity (tie that can’t be broken by small improvements)**  
    - **Ask:**  
      1. "Is Proposal A neither better nor worse than Proposal B?"  
      2. "Would a **small improvement** to Proposal A (e.g., 10% more beneficiaries) make it **decisively better** than B? (Repeat for B vs. A)."  
    - **If A is not better, B is not better, and no small improvement tips the balance:** Proposals are "on a par." Proceed to Step 3c.  
    - *Why this?* Chang defines parity as a tie where no amount of deliberation reveals a winner, but choices aren’t arbitrary.  

  ---

  #### **Step 3: Actions for Each Outcome**  
  *Purpose: Resolve comparisons based on test results.*  
  - **3a. Commensurable (common currency exists):**  
    - **Action:** Compute superior proposal using the common currency (e.g., cost per life-year saved). Fund the one with higher value.  
    - **Justification:** Values are reducible to a single measure; computation is rational.  
    - *Rejected applicant paragraph:* "Proposal X was funded as it demonstrated higher efficiency in [common currency, e.g., life-years saved per dollar]."  

  - **3b. Incomparable (no shared dimension, per Raz):**  
    - **Action:** Use a **fair lottery** (e.g., coin flip) or **rotational funding** (e.g., prioritize the category least funded recently).  
    - **Why not abdication?** Raz argues that when options are incomparable, reason cannot dictate a choice; a fair lottery respects the equality of values. Rotation ensures categorical balance over time.  
    - *Rejected applicant paragraph:* "Both proposals were exceptional but represented distinct values we support equally. Due to this incommensurability, we used [lottery/rotation] for fairness."  

  - **3c. On a par (per Chang):**  
    - **Action:** Same as 3b (lottery or rotation).  
    - **Why?** Parity means proposals are "in the same ballpark" – no fact of the matter makes one better, but a tie-breaker is needed. Lottery/rotation acknowledges their rough equality.  
    - *Rejected applicant paragraph:* Same as 3b.  

  ---

  #### **Final Handoff to Committee**  
  - **When the procedure runs out:** After Step 3, if the committee disagrees with the outcome (e.g., rejects a lottery result), the decision defaults to committee deliberation.  
  - **What the committee is doing:** "Making a reason rather than discovering one." At this point, values are irreducibly plural; the committee must **exercise judgment** to commit to one value (e.g., "We prioritize music education today because equity feels urgent"). This is not irrational—Chang notes that hard choices often require creating reasons through volition.  
  - **Paragraph implication:** Honesty requires admitting when a choice was subjective (e.g., "The committee ultimately prioritized [value] based on current context").  

  ---

  ### **Procedure Applied to Three Cases**  
  *Assumptions:* All proposals pass gatekeeping. Committee time = 5 minutes/pair.  

  1. **Two medical research proposals (life-year impacts):**  
     - *Test 1:* Commensurable (life-years are common currency).  
     - *Action:* Compute and fund the proposal with higher expected life-years saved.  
     - *Outcome:* Uncontroversial; no lottery needed.  

  2. **Diagnostic pilot (medical) vs. Rural music program (music):**  
     - *Test 1:* Not commensurable (no shared unit: life-years ≠ artistic opportunity).  
     - *Test 2:* Not incomparable (shared dimensions exist, e.g., "number of vulnerable people served").  
     - *Test 3 (Parity):*  
       - Neither proposal is clearly better.  
       - A small improvement (e.g., 5% more life-years saved or 5% more students reached) wouldn’t tip the balance decisively.  
     - *Action:* Proposals are "on a par." Use a lottery or rotation.  
     - *Outcome you may dislike:* A lottery could fund the music program even if you prefer medical, or vice versa. The rejection paragraph must explain the lottery.  

  3. **Music education vs. Land conservation (you privately favor music):**  
     - *Test 1:* Not commensurable (music participation ≠ acres protected).  
     - *Test 2:* Not incomparable (shared dimensions exist, e.g., "long-term community benefit").  
     - *Test 3 (Parity):*  
       - Neither is better. A small improvement (e.g., adding 10 acres or 1 school) wouldn’t break the tie.  
     - *Action:* Proposals are "on a par." Use a lottery/rotation.  
     - *Outcome you may dislike:* If the lottery/rotation selects conservation, you must fund it. The procedure overrides personal preference; rejection paragraph cites fairness.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Eliminate subjectivity entirely:** Gatekeeping and shared-dimension judgments require interpretation.  
  2. **Resolve deep value conflicts:** When the committee overrules the procedure (e.g., rejects a lottery), it must own its value choice.  
  3. **Justify unfairness:** It cannot rationalize arbitrary decisions as "objective."  
  4. **Replace foundational values:** If the foundation lacks clarity on its values (e.g., what counts as "impact"), the procedure will flag more pairs as incomparable/on a par.  
  5. **Guarantee satisfaction:** Applicants may dislike lottery-based rejections, but honesty builds trust.  

  ---  
  **Final Note:** This procedure systematizes hard choices but doesn’t make them easy. It ensures decisions are transparent, philosophically grounded, and fair—even when "fair" means admitting, "We flipped a coin between two priceless things."
