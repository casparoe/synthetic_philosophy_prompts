  First, I need to break down the friend's claims. She says Borges uses McTaggart to show time is self-contradictory because we only experience the present, and Hume says we only perceive ideas, not time itself. So past and future are imaginary, making succession a fiction. Then she claims Borges proved moments are simultaneous, connected to "Forking Paths" where time branches, and that he believed in eternal recurrence. Her conclusion is Borges was an idealist who denied change, truly refuting time.

  Key points to check:
  - McTaggart's role in the essay: I recall Borges mentions McTaggart's A-series and B-series, but not as the foundation. He starts with idealism from Berkeley and Hume. McTaggart is cited, but Borges simplifies and uses him to argue against the reality of time, yet not as directly as the friend claims.
  - Simultaneity of moments: Borges does entertain the idea that all moments coexist, but he doesn't "prove" it. He presents it as a possibility within idealism but undercuts it later.
  - Connection to "Forking Paths": The story deals with branching time, not simultaneity. The essay mentions it but doesn't equate branching with simultaneity. Eternal recurrence comes from Nietzsche and isn't tied to the refutation in the essay.
  - The essay's conclusion: Borges explicitly says the refutation is undone by lived experience. He feels time, so the argument collapses. This is crucial—it's not a full refutation.

  The user’s memory is right. The essay is playful, borrowing arguments without full commitment. The friend’s summary misses the irony and the ending where Borges concedes to the reality of time. 

  For the novel, if Borges believed simultaneity, he’d be a model for the narrator’s conviction. But since he rejects it in practice, he’s better as someone torn between the idea and lived experience. That internal conflict is richer for a character. 

  The friend’s errors: Overstating McTaggart’s role, conflating branching paths/simultaneity/recurrence, missing the essay’s conclusion. Correcting these, Borges isn’t a straight idealist denying change; he’s wrestling with ideas but acknowledging time’s persistence. So the user’s interpretation is more accurate, and that makes for a better character inspiration.
answer: |-
  Here's a breakdown of your friend's summary against Borges's essay "A New Refutation of Time" and his broader work, presented clearly for a novelist's needs. Your memory is remarkably sharp – the critic's summary contains significant misreadings and oversimplifications.

  **Breaking Down the Critic's Points:**

  1.  **"Borges sets out to disprove that time exists."**
      *   **Scholarly Wince Level: Mild.** The *stated* goal is indeed a "refutation." But Borges scholars would emphasize the **playful, paradoxical, and deliberately self-sabotaging** nature of the entire endeavor. It's less a manifesto and more a high-wire intellectual performance.

  2.  **"Following McTaggart, he shows that time is self-contradictory..."**
      *   **Scholarly Wince Level: Moderate.** McTaggart *is* mentioned and summarized briefly (around the midpoint of the essay). Borges does present McTaggart's famous argument that time is unreal because the concepts of "past," "present," and "future" are contradictory and cannot all apply to the same event without contradiction (this is McTaggart's "A-series" problem).
      *   **However:** Borges doesn't *start* with McTaggart. He builds his case primarily on **Berkeleyan idealism** ("to be is to be perceived") and **Humean associationism** (we only perceive bundles of sensations, not underlying substances or necessary connections). He uses these to argue that the "self" is a fiction, and individual moments are isolated. McTaggart is brought in as a *reinforcement*, not the foundation. Your memory (Berkeley/Hume first) is correct.

  3.  **"...since we only ever experience the present... Hume had already shown we never perceive time itself... the past and future must be imaginary, so the succession of moments is a fiction."**
      *   **Scholarly Wince Level: Low (for this part only).** This is a reasonably accurate, if simplified, paraphrase of the core *argument Borges constructs* using Berkeley and Hume. Borges *does* build this case: if reality is perception, and we only perceive the present instant (or disconnected sense-data), then continuity, identity, and temporal succession become problematic mental constructs, not perceived realities.

  4.  **"She says Borges proved that all of our moments are really simultaneous..."**
      *   **Scholarly Wince Level: High.** This is a **critical misreading**.
      *   Borges *entertains* the *possibility* or the *logical consequence* of his idealist arguments leading to a timeless, simultaneous "eternity" where all moments coexist. He *wishes* it were true, finding beauty and solace in the idea.
      *   **BUT:** He absolutely **does not claim to have *proven* it.** He explicitly states this is a *desired conclusion* ("This, then, would be the thesis I have striven to elaborate..."), not an established fact. He presents it as a *possible* implication of idealism, but one fraught with its own difficulties.

  5.  **"...and that this is the serious metaphysics hidden underneath his story *The Garden of Forking Paths*, where time branches into every possibility..."**
      *   **Scholarly Wince Level: Very High.** This is a **conflation and misapplication**.
      *   **Simultaneity (Essay) vs. Branching (Story):** The simultaneity hinted at in the *Refutation* is a *static* block universe where all moments just *are*. *The Garden of Forking Paths* presents a radically different model: **infinite branching possibilities** where *all possible futures (and pasts?)* coexist and are equally real. It's about **multiplicity and divergence**, not static simultaneity. They are distinct concepts Borges explores separately.
      *   **"Serious metaphysics hidden underneath":** Borges's fiction is deeply philosophical, but it's rarely about hiding a single "serious metaphysics." It's about exploring ideas, creating labyrinths, playing with paradoxes. To claim the story is *just* an illustration of the essay's simultaneity thesis ignores the unique, complex temporal model the story itself creates.

  6.  **"...and that it also means he believed in eternal recurrence, every event repeating forever."**
      *   **Scholarly Wince Level: High.** This is **another conflation**.
      *   **Eternal Recurrence (Nietzsche):** Endless, identical repetition of the same sequence of events. Borges wrote about this concept (e.g., in "The Circular Ruins" or the essay "The Doctrine of Cycles"), often with fascination *and* skepticism. He explores it as a *narrative* or *metaphysical* possibility.
      *   **Not the Same:** Eternal recurrence is fundamentally different from both the static simultaneity of the *Refutation* and the branching paths of *Forking Paths*. It involves *cyclical repetition*, not a single static block or infinite divergence. Borges did *not* argue that the simultaneity thesis *leads to* or *implies* eternal recurrence. They are separate ideas he engages with.

  7.  **"Her upshot was that Borges was basically an idealist who denied that anything truly changes..."**
      *   **Scholarly Wince Level: Moderate.** **Half-right, half-wrong.**
      *   **Idealist Tendencies:** Yes, Borges was deeply drawn to idealism (Berkeley, Schopenhauer). He frequently used its arguments to challenge naive realism and explore the mind's role in constructing reality. The *Refutation* is a prime example of him working *through* idealist arguments.
      *   **Denied Change? Problematic:** While he *constructs arguments* against change and succession in the *Refutation*, he **explicitly rejects the practical conclusion**. He didn't *live* as an idealist nor consistently *deny* change in his work or life. His fiction often *depends* on time, sequence, and consequence ("Death and the Compass," "The South," even "Forking Paths" relies on sequence within each branch). His fascination was with the *tension* between the intellectual appeal of timelessness and the visceral reality of time.

  8.  **"...and that the word 'refutation' in the title is doing exactly what it sounds like: he thought he had refuted time, full stop."**
      *   **Scholarly Wince Level: Very High.** This **completely ignores the essay's devastating conclusion** that you correctly remembered.
      *   **The Crucial Undercutting:** Borges ends the essay not with triumph, but with **defeat by lived experience**. He writes something like: *"And yet, and yet... To deny temporal succession, to deny the self, to deny the astronomical universe, are apparent desperations and secret consolations... Time is the substance I am made of. Time is a river that carries me away, but I am the river... The world, alas, is real; I, alas, am Borges."*
      *   **The "Shrug":** This is the profound shrug. The intellectual edifice he built is beautiful, logically compelling *within its premises*, but it **collapses the moment he steps out of the philosophical study and back into life**. He *feels* time, he *is* time. The "refutation" is revealed as a magnificent, ultimately unsustainable, thought experiment. The title is deeply ironic.

  **Correcting the Verdict: Borges on Time**

  *   **Not a Proof, but an Exploration:** Borges didn't *prove* simultaneity or the unreality of time. He rigorously constructed an idealist *argument* for it, drawing on Berkeley, Hume, and mentioning McTaggart for support.
  *   **Not a Coherent Doctrine:** The simultaneity hinted at in the *Refutation*, the branching paths of *Forking Paths*, and eternal recurrence are **distinct concepts** Borges explored at different times and in different modes (essay vs. fiction). He didn't smush them into one doctrine. He played with their possibilities and implications separately.
  *   **Idealism as Tool, Not Unshakable Belief:** Borges was fascinated by idealism and used its arguments powerfully. But he was not a dogmatic idealist. He was acutely aware of its limitations when confronted with the brute fact of existence, suffering, memory, and personal identity unfolding *in* time. He was a **skeptic drawn to grand systems but always aware of their fragility**.
  *   **The Irony of the "Refutation":** The essay's true power lies in its **failure**. The refutation is intellectually elegant but existentially impossible. Borges demonstrates the **agonizing gap between what pure reason can conceive and what the embodied self unavoidably experiences**. Time, for Borges the living man, was undeniable, even if Borges the thinker could weave dazzling arguments against it.

  **Implications for Your Novel:**

  Your memory serves you perfectly. **Borges is the *ideal* model for the character you described second: someone irresistibly drawn to the argument that all moments are simultaneous, who finds it intellectually beautiful and logically compelling, but who ultimately *cannot* and *does not* live by it.** 

  *   **Why he's the better model:**
      *   **Internal Conflict:** This creates immediate, rich tension within your character. The idea seduces her mind, but her body, her emotions, her daily interactions scream otherwise. This is fertile ground for drama and psychological depth.
      *   **Relatability:** Readers understand being captivated by an idea yet unable to fully embrace it practically. The struggle is human.
      *   **Nuance:** It avoids the potential flatness of a character who simply "knows" life is simultaneous. Her *oscillation* between conviction and doubt, between the abstract idea and lived reality, is far more interesting.
      *   **True to Experience:** It mirrors how profound philosophical ideas often hit us – they shake our foundations, offer glimpses of other realities, but rarely erase our basic perception of the world. We remain creatures *in* time.
      *   **Borgesian:** This tension between intellect and experience, between the labyrinth of ideas and the plain street outside, *is* quintessentially Borges. Your character grappling with this *is* engaging in a deeply Borgesian struggle.

  **In short:** Build your character on the Borges who constructs the beautiful, logical argument for simultaneity and is profoundly troubled by it, the Borges who ends his essay defeated by the undeniable river of time within which he swims. That's the complex, human, and dramatically potent model. Your critic friend's "straight-up idealist who denied change" Borges is a phantom; the real Borges was a master of exploring the *tragicomic gap* between such ideals and the messy reality of being alive. That's the gold for your novel.
