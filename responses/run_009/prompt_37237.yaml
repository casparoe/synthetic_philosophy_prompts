  Their point about stimuli causing physiological responses is solid. But philosophers might argue that the *aboutness* of emotions—feeling fear *for* Anna Karenina—requires an object. If the object doesn’t exist, how can the emotion be directed at it? That’s a conceptual puzzle, not just physiological.  

