prompt: |-
  I've been going through my gut verdicts on side-effect cases to figure out whether my word "intentionally" tracks anything coherent, and I want a principle that fits them, or to know which verdicts have to go. A CEO who launches a program to boost profits knowing it'll wreck a nearby wetland, and doesn't care: he harmed the wetland intentionally. Same CEO, same program, except the side effect is that it happens to clean up the wetland, which he also doesn't care about: he didn't help it intentionally. So far so Knobe. But now: a middle manager who knows a reorg will gut a colleague's pet project as a side effect, personally hates that it will, says so in the meeting, votes no — and the reorg passes anyway. I say she did NOT harm the project intentionally, even though she foresaw it and it happened. Then the weird ones. My roommate reads my diary without permission, and what she learns is that I'm about to make a terrible financial decision, which she quietly blocks with the bank; I'm grateful but I still feel she intentionally violated my privacy — even though the privacy violation was in service of something good. And a pharmacist who quietly undercharges struggling customers at small cost to the chain: I'd say she's intentionally helping them, even though helping wasn't what she was assigned to do.

  Is there one principle — maybe something about who violated a norm, or what the agent is on the hook for versus deserves credit for — that gets all of these, including the manager case, which keeps bugging me? And whatever principle you land on, tell me its verdict on a case I'm stuck on: a landlord who never bothers raising rents to market because paperwork bores him, and tenants save hundreds a month as a result — did he intentionally help them? I'd also like to know which of my verdicts your favorite principle can't save, and whether the honest conclusion is that "intentionally" just isn't one thing.
reasoning: |-
  Okay, let me start by unraveling this user's query. They're wrestling with the concept of "intentionally" and how it applies to different side-effect cases. The user has given several scenarios: the CEO harming a wetland intentionally but not helping when it cleans it, the middle manager who opposes a reorg that harms a colleague's project, the roommate violating privacy to prevent a bad decision, and the pharmacist undercharging customers. Then there's the landlord who doesn't raise rents due to laziness. The user wants a unified principle that explains all these, especially the manager case which they find tricky.

  First, I need to recall the Knobe Effect. The CEO case is classic Knobe: people judge harmful side effects as intentional but not beneficial ones. But the user's examples add complexity. The manager who foresees harm but opposes it isn't seen as acting intentionally. The roommate's privacy violation is intentional despite good outcomes, and the pharmacist's help is intentional even if it's not her job. The landlord case is ambiguous—laziness leading to benefit.

  The user's core question is whether "intentionally" has a coherent principle or if it's inconsistent. They mention norms, accountability, credit/blame. My mind goes to norm-based theories. Maybe the key is whether the agent is guided by a norm or violates one. In the CEO harm case, he violates an environmental norm. When he helps, no such norm violation. The manager opposes the harm, so she's not guided by a norm of harming. The roommate violates privacy norms, so that's intentional. The pharmacist violates profit norms to help, making her help intentional. The landlord isn't guided by a norm to help; he's just lazy, so maybe not intentional.

  But wait, does that cover all cases? The manager case fits because she's against the harm, so not guided by a norm to harm. The roommate prioritizes helping over privacy, violating privacy norms intentionally. Pharmacist prioritizes helping over profit norms. Landlord: no norm to help, just avoidance of work. So no intentional help.

  But what about cases where norms conflict? The roommate example has conflicting norms—privacy vs. welfare. The user feels the violation was intentional, which the norm-based view explains by focusing on the violated norm. Similarly, the pharmacist violates a business norm to help. 

  The landlord case is tricky. If the norm is "landlords should maximize profits," his inaction violates that norm, but the benefit to tenants isn't intentional because he's not guided by a norm to help. He's guided by laziness. So the principle holds: he didn't intentionally help because helping wasn't his guiding norm.

  Are there any verdicts that don't fit? The user's intuition that the manager didn't harm intentionally aligns with the norm theory since she opposed the harm. The roommate's privacy violation being intentional fits. Pharmacist helping intentionally fits. Landlord not intentionally helping fits. So maybe all cases are covered.

  But the user wondered if "intentionally" isn't a single concept. The norm-based principle seems to unify these cases, but maybe there are others where it fails. The user might be concerned about edge cases or cultural differences in norms. Still, for their examples, it works.

  Deep needs: The user is likely a philosopher or student exploring moral psychology or action theory. They need a coherent framework to reconcile intuitions, possibly for academic work. They might also be seeking validation of their judgments or understanding why the manager case feels different. Their frustration with the manager case suggests a need for clarity on opposing actions. The norm-based approach addresses that by emphasizing the agent's normative stance.
answer: |-
  Based on your cases and the puzzle you're facing, a **norm-based guidance principle** emerges as the most coherent unifying thread. This principle focuses on **whether the outcome occurs *because* the agent was guided by (or actively violated) a norm relevant to that outcome, given their knowledge and attitudes.**

  Here's the principle articulated:

  > **An agent brings about an outcome O intentionally iff:**
  > 1.  **The agent foresees O as a consequence of their action (or deliberate inaction).**
  > 2.  **The occurrence of O is explained by the agent being guided by (or actively violating) a norm specifically concerning O (or a closely related domain) in their practical reasoning or action.**
  >     *   This "guidance" includes: pursuing O, accepting O as a necessary cost/benefit for something else they *are* guided by, or deliberately violating a norm prohibiting/permitting O.
  >     *   It excludes: O occurring *merely* as an unforeseen consequence, or O occurring *despite* the agent's active opposition to O, or O occurring solely due to indifference/inaction unrelated to norms concerning O.

  **Applying the Principle to Your Cases:**

  1.  **CEO Harms Wetland (Intentionally):**
      *   Foresees harm.
      *   **Guided/Violates Norm:** He proceeds *despite* knowing the harm violates a salient norm (environmental protection). His action is explained by his *acceptance* of the norm violation as a cost for profit. Harm occurs *because* he is not guided by the norm against harm and accepts its violation.
  2.  **CEO Cleans Wetland (Not Intentionally):**
      *   Foresees benefit.
      *   **Not Guided by Norm:** He is indifferent. The benefit doesn't occur *because* he is guided by a norm promoting environmental good (he doesn't care). It occurs as a side-effect he accepts but isn't motivated by or acting upon any norm concerning it.
  3.  **Middle Manager Harms Project (Not Intentionally):**
      *   Foresees harm.
      *   **Actively Opposes Norm Violation:** She *opposes* the harm, voices this opposition (invoking a norm of fairness/collegiality), and votes against it. The harm occurs *despite* her actions being guided by the norm *against* harming the project. She is not guided by, nor does she accept/violate, a norm *permitting* the harm *for her*. The harm happens due to others' actions overriding her opposition.
  4.  **Roommate Violates Privacy (Intentionally):**
      *   Foresees privacy violation.
      *   **Actively Violates Norm:** She deliberately reads the diary, *knowing* this violates a strong norm of privacy. The violation occurs *because* she is guided by (or violates) the norm concerning the *means* (reading the diary) to achieve her end (helping you). She prioritized violating the privacy norm over adhering to it.
  5.  **Pharmacist Helps Customers (Intentionally):**
      *   Foresees help.
      *   **Guided/Violates Norm:** She deliberately undercharges, *knowing* this violates a norm of business/profit (and her assigned role). The help occurs *because* she is guided by a norm of compassion/helping those in need *and* actively violates the opposing business norm to enact it. She is guided by the norm concerning the outcome (help).
  6.  **Landlord Doesn't Raise Rent (Helps Tenants - Not Intentionally):**
      *   Foresees? Implicitly, yes (he knows market rates, knows not raising rent saves tenants money).
      *   **Not Guided by Norm:** The savings occur solely because he's lazy and avoids paperwork. He is *not* guided by a norm of helping tenants or generosity. He is indifferent to the benefit. He is *not* violating a norm *against* helping (that norm doesn't really exist); his inaction violates a norm of *business efficiency/profit maximization*, but *not* a norm specifically concerning the *outcome* of helping tenants. The help is a by-product of his laziness, not because he was guided by norms related to helping tenants. (**Verdict: NOT intentional help**).

  **Why This Principle Works Well:**

  *   **Captures Knobe Asymmetry:** Harm involves norm violation (accepted/acted upon), benefit typically does not (mere indifference).
  *   **Solves the Manager Puzzle:** Opposition shows the agent is guided by the norm *against* the harm. The harm happens *despite* their guidance, not *because* of it.
  *   **Explains the "Weird Ones":**
      *   The roommate intentionally violates privacy because she *acts* violating that specific norm.
      *   The pharmacist intentionally helps because she *acts* guided by a norm of help, violating the opposing business norm.
  *   **Handles the Landlord:** Indifference + violation of an *unrelated* norm (business efficiency) doesn't constitute being guided by norms concerning the *outcome* (helping tenants). The help is accidental to his motivation (avoiding work).
  *   **Focuses on Practical Reasoning:** It links "intentionally" to the agent's actual reasons for acting (their normative landscape), not just foresight or causation.

  **Which of Your Verdicts Might Be Challenged? (The Hardest Fit)**

  The principle largely validates your verdicts. The hardest fit *might* be the **Pharmacist**, but only if one argues very strictly:

  *   **Potential Challenge:** "She was assigned to follow profit norms; helping wasn't her 'task'. Does violating one norm to follow another *really* mean she was 'guided by' the helping norm *in a way that makes the help intentional*?"
  *   **Defense:** The principle handles this well. She clearly chose to act based on the norm of compassion, making the help a direct result of being guided *by that norm*. She didn't just foresee it; she enacted it *because* of that guiding norm. Her violation of the profit norm is *how* she enacted her guidance by the helping norm. This feels like a core case of intentional action driven by an alternative normative commitment.

  **Is "Intentionally" Just Not One Thing?**

  While context and normative frameworks *influence* judgments significantly (as your cases show), the **norm-based guidance principle** demonstrates a remarkably coherent core concept. It explains the vast majority of your cases, especially the crucial manager case where mere foresight fails. The variations arise because:

  1.  **Norms vary:** What counts as a salient norm differs contextually (business vs. friendship vs. environment).
  2.  **"Guidance" manifests differently:** Active pursuit, necessary acceptance, deliberate violation.
  3.  **Foresight + Causation are necessary but insufficient:** They need the normative guidance link to become "intentional".

  **Conclusion:**

  Your intuitions track a coherent concept: **intentionality requires that the outcome is connected to the agent's normative reasoning – either by being something they pursued/guided by, accepted as a cost/benefit guided by another norm, or deliberately achieved by violating a norm prohibiting it.** Blind indifference, active opposition, or action guided by norms *unrelated* to the outcome preclude intentionality, even with foresight. This principle validates your CEO (harm), CEO (no help), Manager (no harm), Roommate (privacy violation), Pharmacist (help), and Landlord (no intentional help) verdicts. It suggests "intentionally" *is* largely one thing, deeply tied to an agent's reasons and normative engagement with the world.
