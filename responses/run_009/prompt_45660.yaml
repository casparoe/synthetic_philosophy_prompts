prompt: |-
  Is there a name for the following? My department shortlists grad applicants by having each faculty member rank them and then combining the rankings somehow. Last cycle we fought for weeks about the combining rule, and every candidate rule turned out to have a weird defect. With head-to-head majorities we got a rock-paper-scissors situation: applicant A beat B one-on-one, B beat C, but C beat A, so there was no 'real' winner. Someone suggested giving points by rank position and summing those, but then we noticed that if one strong applicant withdraws, the winner among the rest can change — even though nobody changed their mind about anyone, the person leaving was just soaking up high positions. And a third colleague pointed out that under both rules you could sometimes get a better outcome by ranking someone you don't really like higher, to push a rival down.

  It feels like there's some general fact lurking here: any method for merging individual rankings into a group ranking will have a defect of roughly this kind. Is there an actual established theorem or concept covering this, or did we just run into unrelated quirks? If there is a general result I'd want to know exactly what it says and what it assumes — like whether it requires full rankings from everyone, whether the strategic-lying part is covered by the same result or a seperate one, and what counts as an acceptable 'defect' vs a fatal one.
reasoning: |-
  Okay, the user is describing a problem their department is having with ranking graduate applicants. Each faculty member ranks the applicants, but when they try to combine these rankings, they run into issues. They mentioned three specific problems: a rock-paper-scissors scenario where there's no clear winner, the winner changing when a strong candidate withdraws, and the possibility of strategic voting where ranking someone higher can push a rival down.

  First, I need to recall if there's a theorem or concept that covers these issues. Arrow's Impossibility Theorem comes to mind. It deals with aggregating individual preferences into a group ranking. The user's scenarios match the conditions of Arrow's theorem: cyclic preferences (rock-paper-scissors), independence of irrelevant alternatives (withdrawal changing outcomes), and strategic manipulation.

  The user wants to know if these are isolated quirks or part of a general result. Arrow's theorem states that no voting system can satisfy all desirable properties simultaneously when there are three or more options. The key properties are universality, transitivity, unanimity, and independence of irrelevant alternatives (IIA). Since their department is facing violations of transitivity (rock-paper-scissors) and IIA (withdrawal effect), plus strategic manipulation, it's likely Arrow's theorem explains these issues.

  I should explain Arrow's theorem in a way that connects to their examples. The rock-paper-scissors situation is a Condorcet cycle, which violates transitivity. The withdrawal issue relates to IIA—removing an option shouldn't affect the relative ranking of others, but it did in their case. Strategic manipulation is covered by the Gibbard-Satterthwaite theorem, which is related but separate. They mentioned both Arrow-type defects and strategic voting, so it's important to address both.

  The user also asks about assumptions: full rankings, what counts as a defect, and whether strategic lying is part of the same result. Arrow's theorem requires a complete ranking from each voter. Defects like intransitivity or IIA violation are considered fatal in the context of the theorem. Strategic manipulation is handled by Gibbard-Satterthwaite, which shows that only dictatorial systems are strategy-proof.

  I need to clarify that Arrow's theorem assumes ordinal preferences without cardinal measures. Their point-summing method (like Borda count) is susceptible to IIA violations and strategic ranking. The Gibbard-Satterthwaite theorem extends this by showing that any non-dictatorial system is manipulable.

  The user might be looking for a way to mitigate these issues in practice. While no system is perfect, alternatives like Condorcet methods (which address cycles) or Borda (despite IIA issues) are options. But it's crucial to highlight that trade-offs are inevitable. They might also need reassurance that these problems are inherent and not due to their specific process.

  Deep needs: The department is frustrated with the ranking process, leading to prolonged debates. They want to understand if these issues are unavoidable, which could help them accept trade-offs or seek practical compromises. Knowing the theoretical background might reduce conflict by setting realistic expectations about no perfect system existing.
answer: |-
  Yes, there absolutely is a fundamental concept and a major theorem covering this exact situation! Your department has stumbled into the core problems of **social choice theory**, specifically illustrated by **Arrow's Impossibility Theorem**.

  Here's a breakdown of how your experiences map onto established theory:

  1.  **The Rock-Paper-Scissors Situation (Cyclic Social Preferences):**
      *   **What it is:** This is known as a **Condorcet Cycle** or **Voting Cycle**.
      *   **The Defect:** It demonstrates a violation of **transitivity** in the group ranking. If A > B and B > C, we expect A > C. But if C > A, the group preference is irrational/cyclic.
      *   **The Concept:** This shows that pairwise majority voting (the head-to-head method you tried) does *not* guarantee a transitive social ordering.

  2.  **The Withdrawal Effect (Winner Changes When Irrelevant Alternative Leaves):**
      *   **What it is:** This is a violation of the **Independence of Irrelevant Alternatives (IIA)** axiom.
      *   **The Defect:** The relative ranking of candidates A and B should not depend on whether candidate C is present or not, *as long as individual rankings of A vs B remain unchanged*. Your point-summing method (like Borda Count) failed this. The strong candidate "soaking up points" is exactly why the winner changes when they leave – their presence affected the *scores* of others relative to each other, even though no one changed their mind about A vs B.
      *   **The Concept:** IIA is a desirable property stating that the social choice between any two alternatives should depend only on the individual preferences *between those two alternatives*.

  3.  **Strategic Manipulation (Ranking Someone Higher to Push a Rival Down):**
      *   **What it is:** This is known as **strategic voting** or **tactical voting**.
      *   **The Defect:** The voting system is **manipulable**. Voters have an incentive to misrepresent their true preferences to achieve a better outcome.
      *   **The Concept:** This is addressed by the **Gibbard-Satterthwaite Theorem**. It states that for elections with three or more candidates, *no* voting system (that is non-dictatorial and where every candidate can win under some set of preferences) is **strategy-proof**. Voters can always potentially gain by voting strategically instead of honestly.

  **Arrow's Impossibility Theorem: The Grand Unification**

  Kenneth Arrow's Nobel Prize-winning theorem (1951) directly addresses your first two points (the core ranking defects) and sets the stage for the third.

  *   **What it Says:** When there are three or more alternatives (candidates), it is **impossible** to design a social welfare function (a rule for converting a set of individual preference orderings into a single group preference ordering) that satisfies all of the following seemingly reasonable conditions simultaneously:
      1.  **Unrestricted Domain (Universality):** The rule must work for *any possible* set of individual preference orderings (full rankings, partial rankings meeting certain conditions - see below).
      2.  **Non-dictatorship:** There is *no single individual* whose preferences automatically determine the group's preferences, regardless of what others think.
      3.  **Pareto Efficiency (Unanimity):** If *every* individual prefers alternative X over alternative Y, then the group must prefer X over Y.
      4.  **Independence of Irrelevant Alternatives (IIA):** The group preference between any two alternatives X and Y should depend *only* on the individual preferences between X and Y. (As described in point 2 above).
      5.  **Collective Rationality (Transitivity):** The group preference ordering must be transitive (if A > B and B > C, then A > C). (Your rock-paper-scissors violates this).

  *   **What it Assumes:**
      *   **Ordinal Preferences:** Voters only provide *rankings* (orderings), not cardinal intensities (like scores). Your department is doing this.
      *   **Three or More Alternatives:** Essential for the paradoxes to arise.
      *   **More than One Voter:** Obviously.
      *   **Preference Orderings:** Voters submit complete and transitive preference orderings over *all* alternatives. This is the "full rankings" aspect you asked about. While Arrow originally required *complete* rankings (every candidate ranked relative to every other), extensions often consider more flexible domains, but the impossibility holds under the standard complete/transitive voter input assumption.

  *   **What Counts as a "Defect"?**
      *   In the context of Arrow's theorem, a "defect" is the failure of the social welfare function to satisfy one of the five conditions above.
      *   **Fatal Defects (in the theorem's context):** Violating *any* one of the five conditions means the rule fails Arrow's test. Your department experienced:
          *   **Fatal Defect 1:** Head-to-head majority violated **Collective Rationality (Transitivity)**.
          *   **Fatal Defect 2:** Point summation (Borda-like) violated **IIA**.
      *   **Non-Dictatorship and Unanimity (Pareto)** are usually considered non-negotiable for a fair system. Universality is also hard to relax without being arbitrary.
      *   **The Trade-off:** The theorem forces a choice: You *must* sacrifice either **Transitivity** or **IIA** (or accept a dictator or violate unanimity, which are generally unacceptable). There is *no* perfect rule. Every rule will have *some* flaw like the ones you observed.

  **Strategic Lying (Manipulation): A Related but Separate Beast**

  *   Arrow's theorem is about the *logical possibility* of aggregating *truthful* preferences consistently.
  *   The **Gibbard-Satterthwaite Theorem (G-S)** tackles the incentive to lie.
      *   **What it Says:** For three or more alternatives, the *only* voting rules that are **strategy-proof** (meaning voters never have an incentive to misrepresent their preferences) are **dictatorial** (one voter decides) or impose other unacceptable restrictions (like only two possible winners).
      *   **Assumptions:** Similar to Arrow: Ordinal preferences, complete/transitive individual orderings, three or more alternatives, non-dictatorial, onto (every candidate can win).
      *   **The Defect:** If a rule isn't dictatorial, it *is* manipulable. Your colleague is correct; under many common rules (including head-to-head and Borda), a voter can sometimes get a better outcome by insincerely ranking a less-preferred candidate *higher* than their true preference to hurt a strong rival, or by burying a strong candidate they dislike.

  **Summary: What Your Department Experienced**

  1.  **Rock-Paper-Scissors:** Violation of **Transitivity** (Arrow's Collective Rationality), inherent in pairwise majority methods.
  2.  **Withdrawal Changing the Winner:** Violation of **Independence of Irrelevant Alternatives (IIA)** (Arrow), inherent in point-based methods like Borda Count.
  3.  **Strategic Lying Incentive:** Violation of **Strategy-Proofness** (Gibbard-Satterthwaite), inherent in almost *all* non-dictatorial voting rules, including both pairwise majority and Borda Count.

  **Conclusion:** You didn't just find unrelated quirks. You experimentally discovered the profound, unavoidable limitations described by **Arrow's Impossibility Theorem** and the **Gibbard-Satterthwaite Theorem**. There is **no perfect voting rule** for ranking three or more alternatives when aggregating individual ordinal preferences. Every possible rule your department considers will suffer from at least one significant flaw like the ones you encountered – cycles, sensitivity to irrelevant alternatives, or susceptibility to strategic manipulation. The choice becomes about which flaws are *least* problematic for your specific context and values. Understanding these theorems helps explain *why* the debate was so difficult and why compromise is necessary – it's mathematically impossible to have a rule that satisfies all the intuitively desirable properties simultaneously.
