answer: |-
  ### The Quiz  
  Answer each scenario based on your practical judgment. Choose the option that best reflects your approach.  

  1. **Allopatric Birds**: Two bird populations on separate islands have been isolated for 500,000 years. In captivity, they interbreed and produce fertile offspring. In the wild, they differ in plumage, song, and habitat use.  
     - A) One species (due to reproductive compatibility).  
     - B) Two species (due to morphological/ecological divergence).  

  2. **Asexual Lizards**: An all-female lizard lineage reproduces via cloning and has persisted with distinct genetics and morphology for millions of years.  
     - A) It is a species (despite asexuality).  
     - B) It is not a species (lacks sexual reproduction).  

  3. **Fossil Gradualism**: A fossil sequence shows gradual morphological change in a lineage over 10 million years, with no clear breaks.  
     - A) Classify as one species (continuous change).  
     - B) Split into multiple species (mark arbitrary divisions).  

  4. **Divergent Hybridizers**: Two fish populations in the same lake occasionally hybridize (∼1% of offspring) but differ in diet, body shape, and color. Hybrids are fertile.  
     - A) One species (ongoing gene flow).  
     - B) Two species (ecological/morphological distinctness).  

  5. **Cryptic Moths**: Two moth populations look identical but never interbreed in nature (different pheromones). Genetic data confirm long-term divergence.  
     - A) Two species (reproductive isolation + genetics).  
     - B) One species (morphological identity).  

  6. **Ancient Asexual + Sexual Relatives**: An asexual arthropod lineage (clonal, 20 million years old) coexists with a sexually reproducing population that it evolved from. Both share similar niches and morphology.  
     - A) One species (shared origin/traits).  
     - B) Two species (asexual vs. sexual reproduction).  

  7. **Phylogenetic Twins**: Genetic analysis reveals two monophyletic groups of fungi that diverged 6 million years ago. They are morphologically/ecologically identical and interbreed in labs.  
     - A) One species (no practical difference).  
     - B) Two species (separate evolutionary histories).  

  8. **Allopatric Ecological Twins**: Plant populations on different continents are morphologically and ecologically identical but genetically diverged after 100,000 years of isolation.  
     - A) One species (shared niche/morphology).  
     - B) Two species (geographic/genetic divergence).  

  ---  
  ### Scoring Key  
  Tally your answers and match the pattern to operational concepts:  

  - **Biological (Interbreeding) Concept**:  
    Q1A, Q2B, Q4A, Q5A, Q6B.  
    *Prioritizes gene flow/reproductive isolation, even when morphology/ecology disagree.*  

  - **Diagnosability-Based Concept (MSC/PSC combined)**:  
    Q1B, Q3B, Q4B, Q5B, Q7A, Q8A.  
    *Uses morphology (MSC) or monophylineage splitting (PSC) as proxies for boundaries. This quiz cannot distinguish MSC from PSC due to overlapping cases.*  

  - **Ecological Concept**:  
    Q1B, Q4B, Q6A, Q8A.  
    *Defines species by niche adaptation/role, overriding genetics or reproduction when ecology diverges.*  

  - **Pluralist**:  
    No consistent pattern (e.g., 3+ answers align with different concepts).  
    *Uses context-dependent criteria (e.g., interbreeding for some groups, morphology for fossils).*  

  - **Eliminativist/Skeptic ("No Species Rank")**:  
    Q2A, Q3A, Q7A + any two of Q1A, Q4A, Q8A.  
    *Rejects "species" as a rigid rank; sees organisms as dynamic lineages. Avoids arbitrary splits (e.g., fossils, asexuals).*  

  - **Unnamed/Incoherent**:  
    All other combinations (e.g., Q6A + Q2B).  
    *Conflicts arise from mixing reproductive isolation with asexual acceptance or gradualist fossil views—no major theory aligns here.*  

  ---  
  ### What the Quiz Can’t Sort  
  - **MSC vs. PSC**: Cases like fossils (Q3) or cryptic species (Q5) don’t cleanly separate morphological from phylogenetic diagnosability.  
  - **Weak Ecological Signals**: Scenarios without explicit niche divergence (e.g., Q7) may not trigger ecological reasoning.  
  - **Hybrid Zone Complexity**: Asymmetric gene flow or adaptive introgression isn’t tested.  
  - **Non-Binary Answers**: Real-world decisions often involve uncertainty (e.g., "subspecies"), not captured here.
