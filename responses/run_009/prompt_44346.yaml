prompt: |-
  I do decision analysis for a mid-size consultancy -- mostly helping executives choose between risky options (siting a warehouse, buying coverage vs self-insuring, phased vs all-at-once rollouts). A big part of my job is eliciting the client's risk preferences and fitting a utility curve we then bake into the model. The theory wants their preferences to satisfy the independence axiom, but real clients violate it constantly and aren't shy about it, and I currently have no principled way to respond -- half the time I just quietly average things out. Write me a procedure I can actually run inside a 90-minute elicitation session with an executive who has zero patience for math: which choice pairs to present and in what order, how to tell a genuine independence violation from noise or from someone just misreading a lottery, what counts as a sufficient answer at each step, when to re-present the choice, when to restructure the decision so the violation stops mattering, and where I have to stop and admit the question is about their values and not mine to overrule. Then run it on two cases from my last month: a CEO who reliably picks the sure $1M over a 50/50 shot at $2.5M when choosing between single projects, but picks the gamble once both options are wrapped inside a coin flip that decides whether either project even happens -- same final outcomes -- and she insists she's being perfectly consistant, not irrational. And a risk manager who shows the common-ratio pattern backwards from Allais's original subjects, refusing even very favorable long shots and then suddenly accepting terrible odds once probabilities get above some threshold he can't articulate. Include at least one point where the procedure gives an answer I won't like, and be blunt about where it just fails. Under 800 words.
reasoning: |-
  Okay, let me tackle this decision analysis problem. The user works in consultancy helping executives with risky choices and faces challenges with clients violating the independence axiom during utility elicitation. They need a practical 90-minute procedure that handles real-world inconsistencies without math-heavy explanations.

  Hmm... The core tension here is between theoretical rationality (independence axiom) and how humans actually make decisions. I need to design a process that:
  - Accepts axiom violations as normal
  - Distinguishes between true preference inconsistencies and presentation errors
  - Provides concrete resolution paths
  - Respects the client's values when math fails

  For the procedure itself, I'm considering a phased approach:
  1. Start with simple certainty equivalents to establish risk attitude baseline
  2. Introduce binary choices with clear framing
  3. Systematically test independence using embedded lotteries
  4. Include consistency checks and reframing tactics
  5. Have clear exit points where we accept client values

  The two cases are fascinating. That CEO case shows classic isolation effect - she's evaluating the embedded decision separately from the outer gamble. The risk manager displays reversed common ratio effect, possibly indicating a discontinuous probability weighting function.

  Important considerations:
  - Must work within 90-min constraints with math-averse executives
  - Need visual aids for lottery comprehension
  - Build in repetition for noise detection
  - Have predetermined thresholds for acceptable inconsistency
  - Know when to stop fighting the violation

  For the CEO example, I'll show how reframing to terminal wealth might resolve it. For the risk manager, we may need to accept his probability threshold as a valid preference. The procedure should explicitly include at least one "this is your value, not mine" moment - like when a client consistently violates axioms despite clear comprehension.

  The response should acknowledge that sometimes the math just doesn't capture human values, and that's okay. The key is distinguishing between calculation errors and genuine value judgments.
answer: |-
  Here's a field-ready procedure ("PRACTICE") for axiom violations, followed by your cases:

  **PRACTICE Procedure (90 mins):**

  1.  **Anchor (10 mins):** Present simple certainty equivalents (CE): *"Would you take $750k guaranteed or 50/50 for $0/$2M?"* Adjust until indifference (~risk tolerance baseline). **Sufficient:** Clear preference within 2 adjustments. **Re-present:** If hesitant or inconsistent with known wealth.

  2.  **Test Core Independence (15 mins):**  
      *   **Choice A:** 50/50: $X or $Y (use values from Anchor, e.g., $750k/$2M)  
      *   **Choice B:** $Z (certain, e.g., $1M from your CEO case)  
      Record preference. **Sufficient:** Clear, quick choice. **Re-present:** If client questions framing or seems confused.

  3.  **Embedded Test (The Violation Check) (20 mins):**  
      Wrap A and B in *the same* independent 50/50 "project happens" lottery (e.g., coin flip determines if *any* payoff occurs, else $0).  
      *   **New A:** 50/50: (Play Original A) or $0  
      *   **New B:** 50/50: (Get $Z) or $0  
      Present visually (boxes help). **Key Question:** "Does adding this *same* chance both options might not happen change your preference between A and B?" **Sufficient:** Clear statement of changed/unchanged preference and brief reason ("it's separate", "now it's a gamble anyway"). **Re-present:** Only if misreads lottery structure.

  4.  **Diagnose & Resolve (30 mins):**  
      *   **If Violation (Pref flips):**  
          *   **Ask Rationale:** "Help me understand *why* adding the same outer gamble changes this specific choice?" Listen for: "Evaluating the inner choice alone" (isolation), "Now both are gambles" (categorization shift).  
          *   **Reframe:** Restructure the decision tree to **terminal outcomes**. Show final probability distributions of wealth. Ask: "Given these *final* chances, which do you prefer?"  
          *   **If Persists:** "Your preference seems to depend on how we frame the stages. For *this specific decision*, should we evaluate based solely on the final outcomes (use terminal distros), or does the staging matter to you?" **Their values win.** Bake in staging if critical.  
      *   **If Noise/Confusion:** Re-explain lotteries. Retest Core step if needed.  
      *   **If Consistent:** Proceed to utility fitting.

  5.  **Accept or Adapt (15 mins):**  
      *   If violation resolved via terminal framing, fit utility to terminal outcomes.  
      *   If staging is valued, model it explicitly (e.g., multi-attribute utility on "project success" and "wealth").  
      *   **Stop & Admit:** If the client insists staging matters *after* seeing terminal outcomes and understands the inconsistency, state: "The math expects preferences over final money, but your valuation includes the decision structure itself. That's valid, but it means standard utility curves won't fully capture it. We'll need to model this structure explicitly for similar decisions."

  ---

  **Running the Cases:**

  **Case 1: The CEO (Violates via Isolation)**
  *   **Anchor:** Likely CE << $1.25M for 50/50 $0/$2.5M (risk-averse).
  *   **Core Test:** Sure $1M > 50/50 $0/$2.5M. Clear.
  *   **Embedded Test:** 50/50: (50/50 $0/$2.5M) or $0 **vs.** 50/50: ($1M) or $0. **She picks the gamble (first option).** Violation.
  *   **Diagnose:** *Why?* "When the project might not run, taking the sure $1M feels pointless. If we're gambling on the project, we might as well go for the upside." **Isolation effect** - evaluating inner choice separately.
  *   **Reframe:** Show terminal outcomes:
      *   Gamble: 25% $2.5M, 25% $0, 50% $0 (project doesn't run)
      *   Sure: 50% $1M, 50% $0
      *   Ask: "Given *these* final chances, which?" **If she STILL prefers Gamble:** Fit utility to *this* terminal distribution.
      *   **More Likely:** She switches to preferring Sure $1M terminal. "Ah, seeing it this way, the safe $1M is better overall." **Proceed with standard utility.**
      *   **If She Holds:** "You value the *opportunity* to make a bold bet if the project runs, beyond just final money. We'll model this as a two-stage decision where your risk attitude changes if the project proceeds." **Her values win.**

  **Case 2: Risk Manager (Reversed Common-Ratio)**
  *   **Anchor:** Will show extreme risk aversion (low CE for moderate gambles).
  *   **Core Test:** Rejects 1% chance of $10M vs $50k sure? (Adjust until indifference found at very high payoff).
  *   **Test Common Ratio:** Present:
      *   **Pair 1:** A1: 99% $50k, 1% $0 vs B1: 100% $45k? (Likely picks A1 - accepts high prob risk)
      *   **Pair 2:** A2: 9.9% $50k, 90.1% $0 vs B2: 10% $45k, 90% $0? (Likely picks B2 - rejects long shot)
      *   **Violation:** Prefers A1 > B1 but B2 > A2 (reversed Allais). *Test comprehension: Ensure he sees A2/B2 as scaled-down A1/B1.*
  *   **Diagnose:** *Why?* "1% feels like zero chance, so why risk it? But 99% is almost sure, so I'll take the extra $5k." **Probability threshold** (near-certainty premium).
  *   **Reframe:** Show terminal wealth distributions. Ask for preference. **Likely Outcome:** He *still* prefers B2 over A2 and A1 over B1. Consistency fails.
  *   **Stop & Adapt:** This is a profound non-linearity in probability weighting. "Your comfort with risk changes drastically once probabilities fall below a certain point. Standard utility curves can't capture this jump. For *this* decision, we have three options: 1) Use your choices directly without a curve, 2) Fit an S-shaped probability weighting function (explain simply: 'you overweight tiny chances and underweight high chances'), 3) Define an explicit 'minimum acceptable probability threshold' based on your choices today." **You won't like this:** Option 1 is opaque, Option 2 is complex, Option 3 is crude. **Where it fails:** If he can't define a stable threshold and the probabilities in the actual decision straddle it, standard decision analysis struggles. You must use direct choice or complex Prospect Theory.

  **The Blunt Failure Point:** When a client consistently violates axioms *after* clear comprehension and reframing to terminal outcomes, and the violation materially impacts the decision at hand, **you cannot impose rationality**. Your job shifts to *capturing their descriptive preferences* for *this context*, using direct choice, bespoke thresholds, or Prospect Theory elements – and being transparent about the limitations. Math serves the client's values, not the other way around.
