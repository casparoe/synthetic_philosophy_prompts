prompt: |-
  My friend Dana has very firm views about what should and shouldn't be for sale, and we've been keeping a running list of her verdicts for years. So far: scalping concert tickets — fine, even at 5x face value; hardware stores jacking up generator prices after a hurricane — wrong, full stop; a poor man abroad selling a kidney to pay off debts — wrong; selling blood plasma for money at a licensed clinic — fine; a politician buying votes from poor constituents — obviusly wrong; hiring someone to stand in line for you at a hot new restaurant — fine; a well-compensated professional surrogate carrying a baby for a couple — fine, though she gets kind of defensive about this one; airlines charging extra for legroom — fine.

  Next month we're doing a session on new cases and I want to walk in with predicitons. The new cases: (1) a comfortably-off tech worker selling a kidney to fund her startup, fully screened and informed; (2) a hospital introducing an official VIP fee that lets anyone with cash skip the appointment queue; (3) a broke student selling her eggs for ten grand to a fertility clinic because she says it's the only way she can stay in school; (4) a scalper using bots to buy out the entire allotment of tickets to a charity benefit concert so almost nobody who wanted to go at face value can.

  What rule do you think Dana is actually running, what other rules fit her track record just as well, and what would she say on each of the four? I'm less interested in the answers than in where the candidate rules split — like, if she's running a "desperation invalidates consent" rule, the VIP queue looks fine to her, but if she's running a "you can't cut a line everyone's entitled to" rule it's wrong, and her surrogacy verdict is exactly the thing that makes me doubt the desperation rule can survive contact with her list. Also tell me which further case would best tell the rules apart. And be honest about how confident you are in each prediction and flag the single one you'd bet least on — I'd rather know where the guess is shaky than get a confident-sounding bluff.
reasoning: |-
  Okay, let me tackle Dana's case systematically. The user wants to predict Dana's verdicts on four new scenarios based on her past judgments. First, I need to figure out the underlying rule she's applying. 

  Looking at her past decisions: Scalping tickets is fine, but price gouging generators after a hurricane is wrong. Selling kidneys is wrong, but selling plasma is okay. Vote buying is wrong, but paying for line standing is acceptable. Surrogacy is fine, and airlines charging for legroom is also fine. 

  Hmm. The common thread seems to be about fairness and exploitation. When sellers are desperate (like the man selling a kidney or hurricane victims facing high generator prices), she objects. But when transactions are between consenting parties without desperation (scalping tickets, surrogacy), she's okay with it. The charity concert scalping might be an exception because it subverts the event's purpose, making it exploitative. 

  Now, applying this to the new cases: The tech worker selling a kidney isn't desperate, so maybe fine? But organ sales might still feel wrong to her. The VIP hospital queue allows cutting in line for cash, which feels unfair—probably wrong. The student selling eggs out of desperation is likely wrong for Dana. The bot-scalped charity tickets exploit a charitable event, so wrong. 

  The surrogacy case complicates the desperation rule since surrogates might be financially motivated, but Dana approved it. Maybe she distinguishes between bodily services that are regenerative (eggs, plasma) vs. non-regenerative (kidneys)? But she rejected the poor man's kidney sale, which fits desperation. The tech worker case could test if her objection is about desperation or bodily integrity. 

  A good test case would be a non-desperate person selling a non-vital body part, like a kidney for startup funds. If she approves, desperation is key; if not, bodily sanctity matters. Confidence is lowest on the tech worker's case because it challenges her boundaries on organ sales without desperation.
answer: |-
  Based on Dana's track record and the tension points (especially her defensiveness about surrogacy), here's my analysis of her likely underlying rule, alternative rules, predictions for the new cases, and how to test them:

  ### Dana's Most Likely Core Rule: **"No Exploitation of Desperation or Essential Needs"**
  *   **Rationale:** This rule explains most verdicts:
      *   **Permitted:** Scalping (non-essential, luxury), Plasma (regulated, non-desperate context?), Line-standing (non-essential), Surrogacy (regulated, compensated, potentially non-desperate?), Legroom upcharge (non-essential comfort).
      *   **Prohibited:** Generator gouging (essential need, disaster desperation), Kidney sale (extreme desperation, essential organ), Vote buying (exploiting poverty for democratic corruption).
  *   **Strengths:** Directly addresses the "wrong" cases (hurricane, poor kidney seller, vote buying). Explains the "fine" cases where no essential need or acute desperation is involved. Handles the surrogacy tension – she might see well-compensated surrogates as *choosing* rather than being *forced by desperation*, making her defensive if challenged on potential exploitation.
  *   **Weakness:** Plasma sale might involve economic need, blurring the line. Why is plasma "fine" but eggs (in case 3) likely "wrong"? (See below).

  ### Other Plausible (But Less Likely) Rules
  1.  **"Bodily Integrity / Non-Renewables are Sacred":** Prohibits selling non-regenerative body parts/essential functions regardless of context.
      *   **Fit:** Explains kidney prohibitions and potential egg issue. Allows plasma (regenerative).
      *   **Fail:** *Fails* to explain generator gouging (not bodily) or vote buying (not bodily). *Conflicts* with surrogacy (selling bodily service/capacity) being "fine".
  2.  **"Fair Access to Essential/Common Goods":** Prohibits queue-jumping or hoarding for essential/common resources.
      *   **Fit:** Explains generator gouging (essential good), vote buying (democratic access), charity scalping (access to charitable event). Allows line-standing (non-essential), legroom (non-essential comfort upgrade).
      *   **Fail:** *Fails* to explain kidney prohibitions (not an access issue). *Conflicts* with surrogacy being "fine" (access to parenthood?).
  3.  **"Consent Invalidated by Coercion (Economic or Otherwise)":** Similar to "exploitation of desperation" but broader.
      *   **Fit:** Explains hurricane, kidney sales, vote buying. Allows scalping, line-standing, legroom, surrogacy (if seen as uncoerced).
      *   **Weakness:** Less precise than "exploitation of desperation". Why is plasma "fine"? (Regulation mitigates coercion?) The surrogacy defensiveness suggests she *wants* to see it as uncoerced, which fits.

  ### Prediction for New Cases (Based on "No Exploitation of Desperation")
  1.  **Tech Worker Selling Kidney:** **WRONG (Low Confidence - see below)**. While not "desperate" like the poor man, selling a *kidney* violates the "essential organ" aspect tied to the desperation principle. It feels like crossing a bodily integrity line she implicitly holds. She wouldn't see funding a startup as a valid justification for such a permanent, risky sacrifice, regardless of screening. (*Alternative Rules: Sacred Body = WRONG; Fair Access = WRONG? (not relevant); Coerced Consent = Probably FINE, but unlikely given her past kidney verdict)*.
  2.  **Hospital VIP Queue Fee:** **WRONG.** Healthcare access is a core essential need. Paying to jump the queue for non-medical reasons directly exploits the system everyone relies on in times of need, akin to generator gouging. (*Alternative Rules: Fair Access = Definitely WRONG; Sacred Body = FINE? (not bodily); Coerced Consent = WRONG (coercion on those needing care but can't pay)*).
  3.  **Broke Student Selling Eggs:** **WRONG.** This screams "exploitation of desperation." Staying in school is important, but selling eggs is a significant, invasive, potentially risky medical procedure driven by acute financial need. Plasma is likely seen as lower risk/more routine. (*Alternative Rules: Sacred Body = WRONG; Fair Access = WRONG? (tangential); Coerced Consent = WRONG*).
  4.  **Scalper Bots for Charity Concert:** **WRONG.** This isn't just regular scalping. It's hoarding tickets for a *charity* event, exploiting the charitable purpose and denying access to those who wanted to support the cause at face value. It combines profiteering with undermining a communal good, similar to the unfairness of generator gouging or vote buying. (*Alternative Rules: Fair Access = Definitely WRONG; Sacred Body = FINE?; Coerced Consent = FINE? (but context makes it feel exploitative)*).

  ### Where the Rules Split & The Crucial Test Case
  *   **Scalping vs. Charity Scalping:** Regular scalping (fine) vs. Charity scalping (wrong) splits "Fair Access" and "Exploitation/Coercion" from pure "Sacred Body" or simple "Consent." The *context* (charity) and *method* (bots hoarding) trigger the fairness/exploitation concerns.
  *   **Surrogacy vs. Student Selling Eggs:** This is key. "Sacred Body" would prohibit both. "Exploitation of Desperation" allows surrogacy (if seen as non-desperate/well-compensated choice) but prohibits the desperate student's egg sale. "Coerced Consent" *could* allow both if consent is deemed valid, but Dana's likely "wrong" on the student suggests she sees a line crossed by desperation here. Her defensiveness on surrogacy hints she *needs* to see it as non-exploitative.
  *   **Plasma vs. Eggs:** Plasma (fine) vs. Eggs likely (wrong) splits "Sacred Body" (would prohibit eggs) from "Exploitation of Desperation" (plasma seen as lower-risk/less exploitable, egg sale involves higher stakes/risk and clearer desperation in this case).

  ### The Best Test Case to Distinguish Rules
  **"A financially stable, healthy woman chooses to sell her eggs for $20k purely to fund an extravagant luxury vacation (e.g., a round-the-world yacht trip), fully screened and informed."**

  *   **"Exploitation of Desperation":** **FINE.** No desperation, no essential need being exploited. Pure choice.
  *   **"Sacred Body / Non-Renewables":** **WRONG.** Selling eggs is inherently wrong regardless of reason.
  *   **"Fair Access":** **Probably FINE?** Not really an access issue.
  *   **"Coerced Consent":** **FINE.** No coercion, valid consent.

  *This case directly targets the tension between bodily integrity and the absence of desperation. Dana's verdict here would strongly confirm or refute "Exploitation of Desperation" vs. "Sacred Body."*

  ### Confidence Levels & Shakiest Prediction
  *   **Hospital VIP Fee (WRONG):** **High Confidence.** Fits the "essential need" exploitation pattern perfectly.
  *   **Charity Scalping (WRONG):** **High Confidence.** Combines profiteering with undermining a charitable purpose/access, similar to prohibited cases.
  *   **Student Selling Eggs (WRONG):** **Medium-High Confidence.** Clear case of exploiting financial desperation for a significant bodily procedure.
  *   **Tech Worker Kidney (WRONG):** **LOW CONFIDENCE (The Shakiest - Bet Least On This).** This is the toughest. The "no desperation" argument is strong, but the *permanence and risk* of selling a kidney might override that for Dana, aligning it with the poor man's case. Her surrogacy stance suggests bodily services *can* be commodified without exploitation, but a kidney feels different. If she *surprisingly* says "fine," it strongly confirms "Exploitation of Desperation" is her *sole* principle for bodily sales. If "wrong," it shows an unspoken bodily integrity limit exists alongside it. This is the prediction most likely to be wrong.

  **Conclusion:** Dana's pattern strongly points to **"No Exploitation of Desperation or Essential Needs"** as her core principle. The **Tech Worker Kidney** case is the biggest test of whether bodily integrity (especially for non-renewables) imposes an *additional* constraint beyond just preventing exploitation. The **"Luxury Vacation Egg Sale"** test case is the clearest way to distinguish the competing rules. Be prepared for her surrogacy defensiveness to surface again during the student egg sale discussion! Good luck with the session.
