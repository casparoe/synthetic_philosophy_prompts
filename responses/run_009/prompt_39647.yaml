answer: |-
  It's excellent that you're pressing on this point – the determinism question is precisely where many careful readers stumble with Strawson's Basic Argument. Your friend's summary captures the *structure* of the argument reasonably well, but it imports some significant misreadings, particularly regarding determinism and practical conclusions. Let's unpack this step by step.

  **Assessing Your Friend's Summary: Hits and Misses**
  Your friend gets the core *regress mechanism* right: To be truly morally responsible (in an "ultimate" sense) for an action (A), you must be responsible for the mental states/character (M1) that produced A. But to be responsible for M1, you must be responsible for the prior state (M2) that produced M1, and so on. This regress cannot terminate because you cannot be the *original* cause of your own mental nature – you would have needed to exist prior to yourself with the intention to create yourself *as you are*, which is incoherent. Where your friend's summary goes subtly wrong is in the *why*:

  1.  **"Heredity and environment" misdirection:** While true that genes and environment shape us, Strawson **does not ground the argument in determinism or causal fixity by external factors.** His point is deeper and more structural. Even if your choices are *undetermined*, or even if you somehow had significant control over your environment, the regress problem persists. The core issue is *self-creation*. How did you come to have the specific set of capacities, values, or "choosing mechanism" that led you to make *that* undetermined choice? Unless you created *that* mechanism, you aren't ultimately responsible for what it produces. And you couldn't have created your fundamental capacity for choice itself. Strawson scholar would wince at the phrase "determinism makes our choices mere consequences of things outside our control." The Basic Argument aims to show that *any* naturalistic origin of the self (determined *or* undetermined) precludes ultimate responsibility. It targets the very *structure* of responsibility claims, not just deterministic causation.
  2.  **"Consequence argument in fancier dress":** This is a common but significant misreading. The Consequence Argument (e.g., van Inwagen) *does* rely on determinism and the fixity of the past/laws. It says: If determinism is true, our acts are consequences of factors before we existed and outside our control, so we aren't responsible. Strawson's Basic Argument is structurally different. It says: Even if determinism is *false*, and your choices are undetermined, you *still* cannot be ultimately responsible because you didn't create the "you" that made the choice. Undetermined randomness doesn't equal self-origination or authorship. Strawson himself explicitly contrasts his argument with consequence-style arguments precisely because his doesn't hinge on determinism.
  3.  **"Same basic position as P.F. Strawson":** This is almost the opposite of the truth. P.F. Strawson ("Freedom and Resentment") is a quintessential *compatibilist*. He argues that moral responsibility practices (reactive attitudes like resentment, gratitude, blame) are grounded in our natural human responses and social interactions, and these practices are largely *justified* within that framework, regardless of the metaphysical truth of determinism. Galen Strawson is a staunch *incompatibilist* who thinks true moral responsibility is impossible *even if determinism is false*. Galen sees his father's view as *avoiding* the deep metaphysical question he (Galen) is pressing. Galen's conclusion is radically more skeptical than his father's pragmatic compatibilism. Your friend has their Strawsons reversed here.

  **Your Core Confusion: Does the Argument Require Determinism?**
  No, **Strawson's Basic Argument emphatically does not require determinism to be true.** This is crucial and often missed. Here's how the regress works *without* determinism:

  1.  **Undetermined Choices Don't Help:** Imagine your choice at a crucial moment is genuinely undetermined – random at the level of fundamental physics, or involving some non-physical libertarian free will. You choose A instead of B. Why are you responsible for choosing A?
  2.  **The "You" Problem Persists:** Responsibility requires that *you* authored the choice. But *who are "you"?* "You" are constituted by your character, values, preferences, decision-making style, etc. – your mental nature (M). For you to be responsible for choosing A, you must be responsible for having the particular M that led to (or resulted in) that undetermined choice. Why did *your* M, rather than some other M, lead to this outcome?
  3.  **Regress Strikes Again:** How did you come to have M? If it was shaped by prior undetermined choices you made, then we must ask: What was the nature of the "you" that made *those* prior choices? What determined *that* prior choosing mechanism? The demand for ultimate responsibility forces us back to the origin of your core self. You cannot be responsible for creating your *fundamental* capacity for choice or your initial mental nature. That initial "self" was either determined (by genes/environment) or undetermined (random). If determined, it wasn't up to you. If undetermined (random), that randomness isn't *your* doing either. Either way, you are not its ultimate author.
  4.  **The Impossibility of Self-Causation:** The only way to stop the regress would be if you caused yourself *ex nihilo* (from nothing), with a specific nature you intended to have. This is logically impossible. You would have to exist prior to yourself, already possessing the intentions and capacities needed to create yourself, which is circular nonsense. *This* impossibility is the engine of Strawson's argument, and it operates independently of whether the causal chain is deterministic or indeterministic. Undetermined events, simply by being uncaused, do not magically become self-caused or authored by the agent in the way required for ultimate responsibility.

  **The Practical Conclusion: Does Strawson Demand Abandoning Blame?**
  Here's where your friend significantly overstates Strawson's position. While the Basic Argument concludes that true, ultimate moral responsibility is impossible, **Strawson does not straightforwardly conclude that we should therefore abandon blame and punishment.** He draws a more nuanced, and arguably more limited, conclusion:

  1.  **The "It's Just Not True" Claim:** Strawson's primary conclusion is metaphysical: The kind of absolute, buck-stops-here moral responsibility required to justify *desert* (fundamental, non-consequentialist deservingness of blame or punishment simply because of the bad act itself) does not and cannot exist. He argues we are deeply confused if we think it does.
  2.  **Distinguishing Practices from Justification:** He acknowledges (like his father) that reactive attitudes and practices of blame/praise are deeply ingrained human responses, practically unavoidable, and serve important social functions (deterrence, protection, norm enforcement). He doesn't necessarily advocate their wholesale abolition *as practices*.
  3.  **The Target is *Desert*, Not Necessarily All Practices:** Strawson's main target is the *justification* for blame/punishment based on *basic desert* – the idea that someone *fundamentally deserves* suffering or censure purely because of their morally wrong act, independently of any beneficial consequences. His argument implies this justification collapses. However, he often allows that blame and punishment can be justified on *other* grounds, like consequentialist ones (e.g., deterring future harm, protecting society, reforming the offender) or perhaps as expressions of non-retributive reactive attitudes that we can't help but feel. He might see them as practically necessary fictions.
  4.  **The Practical Upshot is Conceptual Honesty, Not Abolition:** Strawson's practical conclusion is less "abolish blame" and more "recognize that the deep responsibility presupposed by retributive attitudes is an illusion." This recognition might lead us to *moderate* our practices – to be less vengeful, less focused on pure retribution, more focused on prevention, rehabilitation, and understanding causes – but it doesn't mandate abandoning them entirely. We might still *blame* in a consequentialist sense ("holding responsible" for social purposes) while recognizing the metaphysical truth that no one is *ultimately* responsible in the desert-entailing sense.

  **In Summary:**
  *   **Your friend is right about:** The core regress structure targeting self-creation.
  *   **Your friend is importantly wrong about:** The argument relying on determinism (it doesn't), it being a version of the Consequence Argument (it's structurally distinct), and it aligning with P.F. Strawson's compatibilism (it's radically opposed).
  *   **Your insight was correct:** The argument *must* work without determinism for Strawson's claims to hold, and it does, because indeterminism doesn't solve the problem of the self's origin.
  *   **The practical conclusion:** Strawson denies *ultimate responsibility* and the *desert* it grounds, but he generally stops short of demanding the *abolition* of blame and punishment, acknowledging their practical role while urging a more clear-eyed, less metaphysically inflated understanding of them.

  Strawson's Basic Argument is powerful precisely because it bypasses the age-old determinism/indeterminism debate and attacks the intuitive concept of responsibility at its root – the impossible demand for self-origination. It forces us to confront whether our deepest notions of blame and desert are coherent, regardless of how the universe works causally. That's its enduring challenge.
