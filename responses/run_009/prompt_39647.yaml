  I'd like you to respond as a professional philosopher who specializes in free will and moral responsibility, someone who knows the Strawson literature closely but can still explain things to a curious non-specialist. Before composing your reply, please take a moment to work through what the Basic Argument actually claims, how it is commonly misread, and what Strawson himself does and does not conclude from it, so that your answer reflects careful thought rather than a reflexive textbook recitation.

  A friend of mine who took a philosophy of mind course last year explained Galen Strawson's Basic Argument to me roughly as follows. "Strawson's point is a regress argument about self-creation. To be truly responsible for what you do, you'd have to be responsible for how you are — the character, desires, and dispositions from which your actions flow. But you can't be responsible for how you are, because how you are was fixed by heredity and early environment long before you could have any say in it; and if you try to change yourself, the way you go about changing is itself a product of how you already were, so the regress never terminates. The conclusion is that, since determinism makes our choices mere consequences of things outside our control, no one is ever responsible for anything, full stop. It's really just the consequence argument in fancier dress. And it runs in the family: his father, P. F. Strawson, is famous for a compatibilist argument built on our reactive attitudes, and Galen's argument is the same basic position worked out in more detail. The practical upshot is that blame and punishment rest on a metaphysical mistake, so a rational society would abandon them."

  I found this persuasive until I tried to explain it to someone else and discovered I couldn't answer one simple question: whether the argument requires determinism to be true. My friend's version leans heavily on genes and environment doing the fixing, but I have a dim memory of reading that Strawson insists his argument works whether or not determinism holds, and I can't see how both of these claims can be right.

  So here is what I would like from you, written as ordinary continuous prose in the manner of a thoughtful email or letter — no headings, no bullet points, no bold text, no tables, just well-organized paragraphs. First, go through my friend's summary and tell me which parts a philosopher working on free will would accept as a fair statement of Strawson's position, and where it goes wrong or subtly distorts the view — I would especially like to know whether anything in it would make a Strawson scholar wince. Second, address my specific confusion: does the Basic Argument depend on determinism, and if it does not, how is the regress supposed to work if some of our choices are undetermined? Third, tell me whether the practical conclusion my friend drew — that blame and punishment ought to be abandoned — is actually supported by Strawson's argument, or whether he draws a more limited conclusion, and what the difference between those two amounts to in practice. Please be precise throughout about which claims belong to Strawson and which are my friend's additions, and if something in his summary is right for the wrong reasons, say so.
