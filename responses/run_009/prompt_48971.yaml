prompt: |-
  I'm on the constitutional review committee for my university's student government, and we've got a genuinely awkward situation to sort out. Our student constitution gives a "judicial council" of five students the power to strike down legislation and referenda — they're appointed by the student body president and basically serve until they graduate. Last semester the student body voted 69-31 in a referendum to add a transit pass to the activity fee, and the council nullified it, saying fee increases have to originate in the student senate and that the referendum procedure wasn't followed (the election commission forgot to publish the ballot language 14 days ahead, as our rules require, which is true). Now half of our committee wants to amend the constitution to strip the council's strike-down power entirely and make their rulings only advisory, and the other half points out that two years ago the same council blocked a referendum that would have defunded several identity-based student orgs — which was sort of the council doing exactly what it exists for. Please draft the short memo I'll circulate before our next meeting recommending a concrete change (or no change), and make sure it grapples with the strongest point on the losing side, not just the side you pick. Also, we only have like two weeks before this goes on the ballot for the general student vote, so whatever you recommend needs to be something a student body would actually vote yes on.
reasoning: |-
  Okay, the user is on a constitutional review committee for their university's student government and they're dealing with a tricky issue. The student constitution has a judicial council with the power to strike down legislation and referenda. This council is appointed by the student body president and serves until graduation. 

  Recently, there was a referendum where students voted 69-31 in favor of adding a transit pass to the activity fee. However, the judicial council nullified it because the election commission failed to publish the ballot language 14 days ahead as required by the rules. 

  Now the committee is split. Half want to amend the constitution to strip the council's power entirely and make their rulings advisory. The other half points out that just two years ago, this same council blocked a referendum that would have defunded identity-based student organizations - essentially doing what it was designed to do. 

  The user needs a short memo to circulate before their next meeting, recommending a concrete change or no change. The memo must address the strongest point of the opposing view, and whatever is recommended needs to be something students would actually vote yes on within two weeks. 

  I need to consider the key issues here. The judicial council serves as a check on both the student senate and referenda. On one hand, it ensures procedures are followed and protects minority interests, as shown when it blocked the defunding referendum. On the other hand, it overturned a popular referendum (69% support) on a technicality, which understandably frustrates many students. 

  The strongest argument for keeping the council's power is that it protects vulnerable groups from majority overreach - a fundamental constitutional function. The strongest argument against is that it overrides clear student will on substantive issues based on procedural errors. 

  A balanced approach might be best - keeping judicial review but limiting its scope over referenda. For example, the council could still review procedural compliance but not substantive policy in referenda. Or we could allow for a senate supermajority override of council decisions. 

  I should also consider practical viability. Students are more likely to support a reform that preserves protections but addresses their frustration with the transit pass case. Removing all judicial power might be seen as too extreme, especially after the council protected identity-based groups. 

  The memo should recommend a targeted amendment: keep the council's power over legislation and procedural review of referenda, but prevent them from striking down substantively valid referenda that follow procedures. Also suggest implementing a cure period for minor procedural errors and requiring timely publication of ballot language. 

  This approach preserves the council's protective function while respecting direct democracy in referenda. It acknowledges the opposing view's valid concerns about minority protections without letting procedural technicalities override clear student will. 

  For the memo structure: executive summary, background on both cases, argument for reform, counterargument acknowledgment, specific amendment language, and implementation steps. Keep it concise since students will vote on it soon.
answer: |-
  ## MEMORANDUM  
  **To:** Constitutional Review Committee Members  
  **From:** [Your Name], Committee Member  
  **Date:** October 26, 2023  
  **Subject:** Proposed Amendment to Judicial Council Authority - Balanced Reform  

  ### Executive Summary
  After careful review of the Judicial Council's recent actions (both the transit pass nullification and the prior defense of identity-based orgs), **I recommend amending the constitution to limit the Council's authority to strike down *referenda* based *solely* on procedural grounds, while preserving its full review power over legislation and its ability to block referenda violating core constitutional rights.** This balances democratic legitimacy with essential minority protections, addresses the immediate frustration, and stands a strong chance of student approval.

  ### Key Context & Competing Values
  1.  **The Transit Pass Case:** The Council correctly identified a procedural violation (14-day notice). However, overturning a clear student mandate (69% approval) for a popular policy based *only* on an administrative error understandably feels undemocratic and fuels calls to abolish the Council.
  2.  **The Defunding Case:** The Council's prior action blocking a referendum targeting identity-based groups demonstrates its vital role in protecting minority rights against potential "tyranny of the majority." Abolishing its power entirely risks leaving vulnerable groups unprotected.

  ### The Core Dilemma
  *   **Strongest Argument for Striking Power:** The Council, unelected and serving indefinite terms, can nullify the direct, overwhelming will of the student body on technicalities unrelated to the substance or constitutionality of the measure. This undermines direct democracy and student sovereignty. The transit pass case exemplifies this overreach.
  *   **Strongest Argument Against Striking Power:** Student referenda, even with high turnout, can threaten fundamental rights or target minority groups. An independent judicial body is essential to uphold the constitution's core principles and protect vulnerable students, acting as a crucial check on majoritarian impulses. The defunding case proved this necessity.

  ### Recommended Amendment: A Targeted Solution
  **Proposed Constitutional Language:**
  > "Section X.Y: Judicial Council Authority. The Judicial Council shall have the power to review and strike down legislation passed by the Student Senate, and referenda passed by the student body, **provided that:**  
  > (a) For legislation, the Council finds it violates this Constitution or established University policy.  
  > (b) For referenda, the Council finds it violates this Constitution or established University policy, **or** the referendum process violated mandatory procedural requirements *and* such violation(s) materially impaired the fairness or integrity of the vote.  
  > **(c) The Council shall not strike down a referendum *solely* for non-material procedural violations unrelated to voter access or the fundamental fairness of the electoral process.**"

  ### Why This Approach?
  1.  **Addresses the Transit Pass Grievance:** The 14-day notice violation, while mandatory, likely did not "materially impair the fairness or integrity" of a vote with a clear 69% outcome. Under this amendment, the Council *could not* have struck it down solely for that reason. Procedural rules still matter, but outcome-altering nullification requires a *material* flaw.
  2.  **Preserves Vital Protections:** The Council retains full power to strike down *any* legislation or referendum that violates core constitutional rights (like equal protection) or university policy. The defunding referendum would still be blocked.
  3.  **Balances Democracy & Rights:** It respects the immense weight of a successful referendum while maintaining a judicial backstop against measures that are substantively unconstitutional or procedurally *fundamentally* flawed.
  4.  **Electable:** This is a focused, common-sense reform. Students frustrated by the transit pass outcome will see their concern addressed. Students valuing protection for minority groups (and aware of the defunding case) will see those safeguards remain intact. It avoids the perception of a power grab by either side.

  ### Grappling with the Losing Side (Full Abolition of Strike-Down Power)
  The strongest argument for abolition – that unelected officials shouldn't override the direct will of the majority on technicalities – is compelling. **This recommendation directly incorporates that concern by prohibiting nullification of referenda for *non-material* procedural errors.** However, abolishing the power entirely goes too far. Without *any* judicial check, a future referendum targeting a minority group or violating fundamental rights could pass with 51% support, and there would be no constitutional mechanism to stop it. Our constitution needs *some* safeguard against this, especially given the demonstrated past need. This amendment preserves that essential protection while significantly curbing the power that caused the recent democratic deficit.

  ### Next Steps & Timeline
  1.  **Committee Vote:** Move to draft the specific amendment language above for inclusion on the upcoming ballot.
  2.  **Ballot Language:** Draft clear, concise ballot language explaining: "Shall the Student Constitution be amended to limit the Judicial Council's power to overturn student referenda, preventing nullification based solely on minor procedural errors while preserving its authority to block measures violating constitutional rights or involving major voting irregularities?"
  3.  **Messaging:** Frame the campaign around "Protecting Student Votes AND Student Rights" – emphasizing both the transit pass frustration *and* the importance of keeping protections like those used in the defunding case.

  This targeted reform offers a constitutionally sound, democratically respectful, and politically viable path forward. It addresses the specific harm caused while preserving the Judicial Council's essential role in upholding our foundational principles.
