answer: |-
  Here's an exam question designed to hit your specified crux, followed by a model answer and detailed marking scheme:

  **Essay Question (90 minutes):**

  "Prioritarians often claim to escape the 'leveling down' objection that plagues telic egalitarianism by arguing they care only about absolute gains to the worse-off, not about reducing inequality *as such*. However, consider a society with two groups: Group A (Welfare: 100) and Group B (Welfare: 20). A policy transfers resources from A to B, but due to diminishing marginal utility or inefficiency, the transfer results in a new distribution: Group A: 90, Group B: 25. Total welfare falls from 120 to 115.

  (a) Explain why a prioritarian with a *sufficiently steep* priority weighting might still rank this new distribution (90, 25) as an improvement over the original (100, 20), despite the drop in total welfare. (Call this 'weak leveling down').

  (b) Assess whether this 'weak leveling down' commitment constitutes a genuine *moral cost* for prioritarianism, akin to the cost telic egalitarians face with standard leveling down. Does it differ *in principle* or merely *in degree* from the egalitarian commitment?

  (c) Evaluate whether shifting to a sufficiency view (valuing benefits only below a welfare threshold) or introducing a lexical threshold (absolute priority below a point) *resolves* the problem of 'weak leveling down' identified in (a), or merely *relocates* it. Consider the implications of defining and applying such thresholds."

  **Model Answer (Approx. 600 words):**

  **(a)** Prioritarians assign greater moral weight to welfare gains experienced by those at lower absolute welfare levels. A sufficiently steep weighting means the gain to Group B (from 20 to 25) is valued *immensely* more than the loss to Group A (from 100 to 90) is disvalued. While the *sum* of welfare decreases, the prioritarian calculus, heavily discounting the significance of losses to the already well-off and amplifying gains to the badly-off, can still yield a positive net moral value for the transfer. This is "weak leveling down": an improvement is claimed even though someone is made worse off and no one is made better off *in absolute terms compared to the status quo ante for them*, and total welfare falls. It arises precisely because the prioritarian metric isn't strictly additive; it's a *weighted* sum.

  **(b)** Whether this constitutes a genuine moral cost akin to standard leveling down is complex. On one hand, it *differs in principle* from telic egalitarianism. The telic egalitarian values the *equal state itself*, regardless of levels. The prioritarian in this scenario values the *absolute gain* to B, weighted by their prior disadvantage; the drop in A's welfare and total welfare are regrettable side-effects outweighed (due to weighting) by B's gain. The commitment isn't to leveling *per se*, but to weighted beneficence. The cost isn't endorsing useless equality but endorsing a net welfare loss for the sake of helping the worst-off, judged sufficiently important.

  However, it *resembles* the egalitarian cost *in its normative implication*: both theories can mandate policies that make some people worse off without making anyone better off (in absolute terms relative to the starting point) *and* reduce total welfare. The prioritarian avoids saying "equality is good," but still says "this state with lower total welfare is better," solely because resources moved down the welfare scale. This seems counterintuitive, violating a weak Pareto principle (if someone loses and no one gains, it's not an improvement). The cost is endorsing a net loss in human well-being for the sake of distributional weighting. While the *reason* differs (weighted beneficence vs. intrinsic equality), the *practical outcome* – approving a welfare-reducing transfer based on position – shares a problematic feature with egalitarianism. The difference is one of foundational justification, not necessarily the palatability of the outcome.

  **(c)** Sufficiency or lexical thresholds attempt escape. A sufficiency view might value gains *only* below a threshold (e.g., 30). In our scenario (B from 20->25, still below 30), the transfer might still be endorsed. The problem persists *below* the threshold; steep weighting below 30 could still approve transfers harming those above 30 to benefit those below, even with net welfare loss (e.g., A: 100->95, B: 21->26, Total: 121->121 – no gain, but if weighted, perhaps an 'improvement'). The core issue of weighted approval of net loss within the priority zone remains.

  A *lexical* threshold (absolute priority below a point) forbids any sacrifice of those below the threshold for those above. This seemingly blocks harming B (at 20) to benefit A. However, it doesn't resolve the problem *among* those below the threshold. Imagine three groups below the threshold: C1: 10, C2: 15, C3: 18. A steep prioritarian weighting might approve a transfer from C3 (18->13) to C1 (10->15), even if total welfare falls (43 -> 43? Or 43->41 if inefficient). The 'weak leveling down' problem reapplies *within* the lexical priority group. Furthermore, defining the threshold is notoriously difficult and arbitrary; shifting it merely relocates where the prioritization applies and thus where the potential for approving net-loss transfers arises. The discontinuity at the threshold also creates its own counterintuitive results (e.g., massive weight to move someone from 1 unit below to just above, negligible weight just above).

  **Conclusion:** Prioritarians avoid endorsing *pure* leveling down, a significant advantage over telic egalitarianism. However, their core commitment to weighting gains by absolute welfare level inevitably leads to 'weak leveling down' – approving some net welfare-reducing transfers deemed beneficial solely due to the recipients' prior disadvantage. This residual commitment generates a distinct, though perhaps less severe, counterintuitive cost related to Pareto and aggregate welfare. Sufficiency or lexical thresholds do not eliminate this cost; they either preserve it within the priority domain or relocate it to the threshold boundary, while introducing new problems of arbitrariness and discontinuity. Whether the prioritarian's justification for 'weak leveling down' (weighted beneficence) is ultimately more defensible than the egalitarian's (intrinsic equality) is crucial, but both theories struggle to fully align with the intuition that an outcome where someone loses, no one gains absolutely, and total welfare falls, cannot be an improvement.

  **Marking Scheme (Out of 20 Points):**

  1.  **Accurately Explains Weak Leveling Down under Steep Weighting (4 pts):**
      *   *How Botched:* Fails to show *how* steep weighting overcomes the total welfare loss; confuses with standard leveling down; assumes prioritarianism always requires total gain.
  2.  **Analyzes Moral Cost: Principle vs. Degree vs. Egalitarianism (5 pts):**
      *   *How Botched:* Simply asserts it's not a cost because "equality isn't valued"; conflates the *justification* (weighting vs. equality) with the *outcome* similarity (net loss approval); claims difference is only in degree without engaging principle.
  3.  **Evaluates Sufficiency View Adequately (4 pts):**
      *   *How Botched:* Asserts sufficiency solves it without showing how weighting persists below threshold; doesn't consider transfers solely among the insufficient.
  4.  **Evaluates Lexical Threshold Adequately (4 pts):**
      *   *How Botched:* Asserts lexical priority blocks the problem without considering transfers *within* the priority group; doesn't address threshold arbitrariness/discontinuity as relocating the issue.
  5.  **Assesses Whether Escape is Principled or Ad Hoc (3 pts):**
      *   *How Botched:* Concludes "prioritarianism wins" without engaging the residual cost; fails to acknowledge that thresholds don't eliminate the core issue inherent in weighting; doesn't weigh the defensibility of weighted beneficence vs. intrinsic equality in light of the weak leveling down outcome.

  **Key in Model Answer:** It avoids "prioritarianism wins" by:
  1.  Acknowledging its escape from *pure* leveling down is a real advantage (principled difference).
  2.  Showing 'weak leveling down' is an inherent consequence of the core commitment (not ad hoc, but problematic).
  3.  Demonstrating threshold fixes fail to resolve the core issue within their domain (relocation, not solution).
  4.  Concluding that the defensibility hinges on accepting weighted beneficence even when it mandates net welfare loss in specific cases – a genuine cost requiring justification.
