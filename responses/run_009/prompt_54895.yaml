  **Explanation of Carving:**

  1.  **Core Phenomenon:** A disagreement where:
      *   All relevant non-linguistic facts are agreed upon.
      *   Tabooing the contested term(s) is attempted.
      *   The disagreement *persists* at the level of how to describe the world *using the uncontroversial concepts*.
      *   The persistence is due to the truth value of the original assertion depending constitutively on facts about the linguistic community's historical usage patterns.
      *   These linguistic facts are external to the speakers, not accessible via introspection or standard empirical investigation of the *non-linguistic* world, and were fixed prior to the dispute.
      *   Speakers share membership in the same linguistic community relevant to the term.

  2.  **Boundaries:**
      *   **vs. Merely Verbal:** Dissolves under tabooing as divergence in meaning/concept is revealed. Cryptoconventional disputes reveal *shared meaning* but disagreement on *correct application* given its external grounding.
      *   **vs. Empirical Disagreement:** Resolved by gathering new non-linguistic facts (experiments, observations). Cryptoconventional disputes persist *after* such facts are shared.
      *   **vs. Metalinguistic Negotiation:** Involves normative claims about how a word *should* be used. Cryptoconventional disputes aim to discover descriptive facts about how it *is* grounded.
      *   **vs. Speaker Meaning vs. Semantic Meaning:** The phenomenon assumes the speaker intends to use the word with its standard communal meaning; the error/mismatch is due to ignorance of that meaning's precise boundaries/grounding conditions.

  3.  **Edge Cases:**
      *   **Divergent Communities (Twin Earth):** Becomes merely verbal. The speakers belong to different linguistic communities with different historical groundings.
      *   **Explicit Stipulation/Definition Change:** If the community *explicitly* redefines a term (e.g., IAU on Pluto), subsequent disputes about applying the *new* definition are either empirical (does Pluto fit criteria X?) or metalinguistic (should we use criteria X?). The *historical grounding* question remains cryptoconventional.
      *   **The Speaker is the Expert:** If one chemist *is* the authoritative grounder of 'water' usage in their community, their stipulation might resolve it, moving towards a normative element or reducing the "crypto" aspect. The core phenomenon relies on the grounding facts being external and unknown *to the disputants*.

  **Coinage Rationale:** "Cryptoconventional Dispute" emphasizes the hidden ("crypto") nature of the linguistic conventions that constitutively determine reference/extension and drive the persistent disagreement ("dispute"), even when the surface-level concepts are unpacked. It distinguishes it from overt negotiations about conventions.
