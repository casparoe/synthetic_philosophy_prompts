answer: |-
  Based on your description, the phenomenon is **Burge's Arthritis Case (or Tyler Burge's Anti-Individualism)** extended to disputes. While Burge's specific case illustrates the core dependency of meaning/content on external linguistic facts unknown to the speaker, your observation focuses on how this creates **persistent, non-verbal disputes even after tabooing and factual agreement**. No single established term perfectly captures *this specific dispute dynamic*, though Burge's work is the core foundation.

