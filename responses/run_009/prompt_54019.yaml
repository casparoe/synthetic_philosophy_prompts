answer: |-
  ### Exam Question

  **QUESTION 4: The Wilmslow Game and Rational Choice**  
  Consider the Wilmslow game: a fair coin is tossed until it first lands heads. If the first heads occurs on toss \(n\), the player receives a payoff of \((-1)^{n+1} \cdot 2^n / n^2\) units of utility.  

  (a) Explain why the expected utility of the Wilmslow game is well-defined. (You need not compute its exact value.)  
  (b) Show that the variance of the payoff is infinite.  
  (c) Does the well-defined expected utility settle how a rational agent should value and choose to play the Wilmslow game? In your answer:  
     - Discuss implications for single-play decisions and repeated-play settings.  
     - Contrast the Wilmslow game with the Pasadena paradox, addressing whether the Wilmslow game shows that "undefined expected utility" was not the core lesson of the Pasadena paradox.  

  Support your reasoning with explicit appeal to convergence properties, risk, and long-run behaviour.  

  ---

  ### Model Answer  
  *(Approx. 600 words)*  

  **(a)** The expected utility is well-defined because the probability-weighted payoff series converges absolutely. The probability of first heads on toss \(n\) is \((1/2)^n\), so the expectation is \(\sum_{n=1}^{\infty} [(-1)^{n+1} \cdot 2^n / n^2] \cdot (1/2)^n = \sum_{n=1}^{\infty} (-1)^{n+1} / n^2\). The absolute series is \(\sum_{n=1}^{\infty} 1/n^2\), a convergent p-series (p=2>1). Absolute convergence implies reordering or relabelling cannot alter the sum, avoiding the Pasadena paradox’s core pathology. Thus, the expectation exists unambiguously.  

  **(b)** Variance requires a finite second moment, but \(E[X^2]\) diverges. The second moment is \(\sum_{n=1}^{\infty} [(-1)^{n+1} \cdot 2^n / n^2]^2 \cdot (1/2)^n = \sum_{n=1}^{\infty} (2^{2n} / n^4) \cdot (1/2^n) = \sum_{n=1}^{\infty} 2^n / n^4\). This diverges because \(2^n / n^4\) grows exponentially: ratios \(|a_{n+1}/a_n| \to 2 > 1\). Since variance \(= E[X^2] - (E[X])^2\) and \(E[X]\) is finite, infinite \(E[X^2]\) implies infinite variance.  

  **(c)** A well-defined expectation does *not* fully settle rational choice for the Wilmslow game, due to infinite variance. This reveals that the Pasadena paradox’s lesson extends beyond undefined expectations to deeper issues of stability and risk.  

  In **single-play** decisions, infinite variance signifies extreme risk. Payoffs like \(+2^n/n^2\) or \(-2^n/n^2\) for large \(n\) imply catastrophic potential losses despite a positive expectation (\(\pi^2/12 > 0\)). Risk-averse agents (e.g., with concave utility) may reject the game, as expectation alone ignores dispersion. Dominance arguments (e.g., Wilmslow plus £1 always preferred) also fail: adding a constant cannot mitigate tail risks, similar to Pasadena’s dominance puzzles. Thus, defined expectations are insufficient without finite higher moments.  

  In **repeated-play** settings, infinite variance undermines the reliability of long-run averages. The sample mean of \(k\) i.i.d. plays converges to \(E[X]\) *in probability* (weak law of large numbers holds if \(E[X]\) exists, as here). However, without finite variance, convergence is pathologically slow and fluctuations are unbounded—e.g., a single extreme outcome can dominate the average. "Strong" long-run reliability (e.g., almost sure convergence) holds by the strong law, but agents may still face ruinous volatility in finite sequences. Thus, rational agents might avoid the game if they cannot absorb erratic utility swings.  

  Contrasting with the **Pasadena paradox**, Wilmslow shows that undefined expectation was *not* the sole issue. Pasadena’s expectation was conditionally convergent, allowing reordering to yield arbitrary sums and violating dominance (e.g., Pasadena plus £1). Wilmslow blocks reordering via absolute convergence but retains the "explosive tails" from exponential growth. This confirms that the paradox’s essence is the *instability* of rational evaluation under heavy-tailed distributions, not undefinedness per se. Both games share infinite variance, which disrupts decision-making even when expectation exists.  

  Thus, rational choice requires more than a defined expectation: it demands finite moments (or bounded utility) to ensure expectations are actionable. Wilmslow generalises Pasadena’s lesson, showing that convergence pathologies manifest in higher moments.  

  ---

  ### Marking Scheme  
  **Total: 20 marks** (Awarded across five criteria, each worth 4 marks)  
  **A/B Boundary:** 16 marks. B-grade scripts (12–15 marks) typically cover criteria 1–3 well but omit/gloss 4–5. A-grade scripts (16–20 marks) address all five, especially 4–5, with clarity.  

  | **Criterion (4 marks each)** | **Key Expectations** | **Common Student Errors** |
  |------------------------------|----------------------|----------------------------|
  | **1. Convergence of expectation:** Correctly shows absolute convergence of \(\sum (-1)^{n+1}/n^2\), blocking reordering objections. | Derives the series \(\sum (-1)^{n+1}/n^2\) from probabilities; cites absolute convergence via \(\sum 1/n^2 < \infty\). | Fails to reduce \(E[X]\) to \(\sum (-1)^{n+1}/n^2\); confuses absolute/conditional convergence; omits probability weights. |
  | **2. Divergence of second moment:** Proves \(E[X^2] = \sum 2^n / n^4\) diverges, implying infinite variance. | Computes \(E[X^2]\) correctly; argues divergence via growth rate (e.g., ratio test) or comparison. | Incorrect payoff squaring (e.g., misses \((-1)^{2n}=1\)); confuses \(E[X^2]\) with variance; asserts divergence without justification. |
  | **3. Single-play implications:** Links infinite variance to risk aversion and dominance failures. | Argues risk-averse agents may reject positive-EV game; notes irrelevance of dominance (e.g., +£1) due to tail risks. | Asserts "defined EV suffices"; omits risk aversion; misapplies dominance (e.g., claims Wilmslow +£1 resolves issues). |
  | **4. Repeated-play implications:** Explains weak vs. strong convergence and practical instability. | Notes sample mean → \(E[X]\) in probability but with slow convergence/unbounded fluctuations; contrasts weak/strong laws. | Claims LLN fails entirely; ignores infinite variance’s impact on fluctuations; conflates convergence modes. |
  | **5. Contrast with Pasadena:** Uses Wilmslow to argue that undefinedness was not the core lesson; identifies shared infinite-variance pathology. | States Pasadena’s issue (conditional convergence) vs. Wilmslow’s (absolute convergence + infinite variance); generalises to "higher moments matter". | Overemphasises undefinedness as Pasadena’s only flaw; fails to link both games to tail instability; superficial comparison. |
