prompt: |-
  I teach a final-year undergraduate module on rational choice at a British university, and I'm writing this year's closed-book summer examination. I want one ninety-minute essay question on the Pasadena paradox and the problem of undefined expected values, but I've been burned before: two years ago I asked students to explain why the Pasadena game's expectation is undefined and to evaluate one proposed response, and the top scripts were almost indistinguishable from the reading notes. This year I want a question built around a variant of my own construction, so that nothing in the answer can be recited.

  Here is the variant, which I've been calling the Wilmslow game. A fair coin is tossed until it first lands heads; if that first heads occurs on toss n, the player receives a payoff of (−1)^(n+1) · 2^n / n² units of utility. I've had the arithmetic checked: the probability-weighted sum of the payoffs is the alternating series ∑ (−1)^(n+1) / n², which converges absolutely to π²/12, so unlike the Pasadena game this one has a perfectly well-defined expected value. The twist I want the question to exploit is that the second moment still diverges — the variance is infinite, because the probability-weighted sum of the squared payoffs is ∑ 2^n / n⁴, which diverges. So the question I have in mind is roughly: does the well-defined expected value of the Wilmslow game settle how a rational agent should value and choose with respect to it, and does the contrast show that undefinedness was never the real lesson of the Pasadena paradox? Please sharpen this into a proper exam question — the phrasing is up to you — but it must be answerable only by someone who understands the machinery, not by someone who has memorised the Pasadena literature. Our lectures covered the Pasadena and St Petersburg games, the relabelling and reordering objections to conditional sums, dominance problems of the Pasadena-plus-a-pound variety, and the distinction between sample means converging in probability (what our lectures called weak expectations) and stronger senses in which a game can be good for you in the long run.

  Please supply three things. First, the exam question itself, as it would appear on the paper, with any framing or instructions to candidates. Second, a model answer of about 600 words, which should show the convergence calculation briefly rather than belabour it, and should reach a definite verdict. Third, a marking scheme of five must-hit points worth 4 marks each (20 total), each with a one-line note on how students typically miss or fumble it. The scheme should make the A/B boundary concrete: my expectation is that B scripts will show the series converges absolutely, note that this blocks the reordering objections, and conclude that all is well — and I want the scheme to award that only partial credit. A scripts must also confront what well-definedness leaves unsettled: whether an expectation with infinite variance is a usable guide to choice, in single-play and repeated-play settings, and what exactly the Wilmslow game reveals about which of the Pasadena paradox's symptoms were due to undefinedness as such. Please don't require any citations or references in the question or model answer, since it's closed-book; anything from the literature you want the answer to draw on should be paraphrased into its own terms.
reasoning: |-
  We are designing an exam question for a final-year undergraduate module on rational choice. The goal is to test deep understanding of the issues surrounding expected utility, convergence, and the implications of infinite variance, using a variant called the Wilmslow game. The question should be structured such that students cannot simply regurgitate notes from the Pasadena paradox literature but must apply their knowledge to this new variant.

  Key elements of the question:
  - The Wilmslow game: fair coin tossed until first heads on toss n. Payoff = (-1)^(n+1) * 2^n / n².
  - Expected value: absolute convergence of the series ∑ (-1)^(n+1)/n² to π²/12 (but we don't require the exact value, just that it converges absolutely).
  - Second moment: ∑ (2^n / n²)^2 * (1/2)^n = ∑ 2^n / n⁴, which diverges (since 2^n grows faster than any polynomial, and the series is dominated by a divergent series).

  The question should ask whether the well-defined expected value settles how a rational agent should value the game, and contrast with the Pasadena paradox (which had an undefined expectation due to conditional convergence). The lectures covered:
    - Pasadena and St Petersburg games.
    - Relabelling and reordering objections (showing that conditional convergence leads to different sums by rearrangement).
    - Dominance problems (like Pasadena plus a pound).
    - Weak expectations (convergence in probability of sample means) vs stronger senses (e.g., almost sure convergence, or long-run average utility).

  The twist: Wilmslow has a well-defined expectation (due to absolute convergence) but infinite variance. We want students to see that even with a defined expectation, infinite variance poses problems for decision making (in single play and repeated play).

  Exam Question:

  ---
  **QUESTION 4: Rational Choice and the Wilmslow Game**

  Consider the Wilmslow game: a fair coin is tossed until it first lands heads. If the first heads occurs on toss number \(n\), the player receives a payoff of \((-1)^{n+1} \cdot 2^n / n^2\) units of utility.

  (a) Show that the expected utility of the Wilmslow game is well-defined. (You need not compute the exact value.)

  (b) Explain why the variance of the payoff in the Wilmslow game is infinite.

  (c) Does the well-defined expected utility of the Wilmslow game settle how a rational agent should value and choose with respect to it? In your answer, consider both single-play and repeated-play settings, and contrast the Wilmslow game with the Pasadena paradox. In particular, discuss what the Wilmslow game reveals about the lessons of the Pasadena paradox.

  ---

  Model Answer (approx 600 words):

  (a) The expected utility is the probability-weighted sum of the payoffs. The probability that the first heads occurs on toss \(n\) is \((1/2)^n\). Therefore, the expected utility is:
  \[
  \sum_{n=1}^{\infty} \left[ (-1)^{n+1} \frac{2^n}{n^2} \right] \cdot \left(\frac{1}{2}\right)^n = \sum_{n=1}^{\infty} (-1)^{n+1} \frac{1}{n^2}.
  \]
  This series is the alternating series \(\sum_{n=1}^{\infty} (-1)^{n+1} \frac{1}{n^2}\). Since the absolute value series \(\sum_{n=1}^{\infty} \frac{1}{n^2}\) converges (it is a p-series with p=2>1), the alternating series converges absolutely. Therefore, the expected utility is well-defined.

  (b) The variance is defined as the expected value of the squared deviation from the mean. However, we can compute the second moment and note that if the second moment is infinite, then the variance must be infinite (since variance = E[X^2] - (E[X])^2 and E[X] is finite). The second moment is:
  \[
  E[X^2] = \sum_{n=1}^{\infty} \left[ \left( (-1)^{n+1} \frac{2^n}{n^2} \right)^2 \right] \cdot \left(\frac{1}{2}\right)^n = \sum_{n=1}^{\infty} \left( \frac{2^{2n}}{n^4} \right) \cdot \frac{1}{2^n} = \sum_{n=1}^{\infty} \frac{2^{n}}{n^4}.
  \]
  The series \(\sum_{n=1}^{\infty} \frac{2^{n}}{n^4}\) diverges because the terms grow exponentially (the ratio of consecutive terms is 2 for large n, which is greater than 1). Therefore, the second moment is infinite, and hence the variance is infinite.

  (c) The well-defined expected utility of the Wilmslow game does not fully settle how a rational agent should value it, particularly because of the infinite variance. In single-play settings, an agent might be risk-averse and therefore reluctant to play a game with extremely high potential losses and gains, even if the expected value is positive and finite. The infinite variance implies that the payoffs are extremely spread out: there is a non-negligible chance of enormous gains or losses. For example, if the first heads occurs at an odd n, the payoff is positive and large; at an even n, it is negative and large in magnitude. Without a finite variance, standard risk-aversion models (like expected utility with concave utility functions) may still assign a low or even negative value to the game for a risk-averse agent.

  In repeated-play settings, the situation is more complex. The weak law of large numbers (which requires finite variance) does not apply here because of the infinite variance. However, the sample mean of the payoffs in independent repetitions of the game may still converge in probability to the expected value (weak expectation) if the conditions for the weak law hold for independent but not identically distributed random variables? Actually, the standard weak law of large numbers for i.i.d. random variables requires finite variance. Without finite variance, convergence in probability is not guaranteed. In fact, for distributions with infinite variance, the sample mean may not converge to the expected value in probability. Moreover, even if convergence in probability holds (which might be established by other means, such as the Khintchine weak law which only requires finite mean), the rate of convergence could be extremely slow and the fluctuations enormous. This means that in the long run, an agent might experience wild swings in accumulated utility, which could be unacceptable. Additionally, the strong law of large numbers (almost sure convergence) requires finite variance (or at least the existence of the first absolute moment, which we have, but the strong law for i.i.d. sequences holds with finite mean and without variance? Actually, the strong law holds for i.i.d. sequences with finite mean, regardless of variance. However, without finite variance, the fluctuations can be very large and the convergence very slow, which might be practically problematic.

  Contrasting with the Pasadena paradox: the Pasadena game had an undefined expected utility because its series was conditionally convergent (and rearrangement could change the sum). The Wilmslow game shows that even when the expectation is well-defined (by absolute convergence, blocking rearrangement objections), there can be other problems (infinite variance) that make the game difficult to handle. Thus, the lesson of the Pasadena paradox is not solely about undefined expectations. The deeper lesson is that convergence properties (and moments) matter for rational choice. The Wilmslow game reveals that even with a defined expectation, the absence of higher moments (like variance) can undermine the practical use of expected utility for decision making, especially for risk-averse agents and in repeated play where the stability of long-run averages is in question.

  Therefore, the well-defined expectation is a necessary condition for expected utility to be a guide, but it is not sufficient when higher moments are infinite. Rational agents must consider the entire distribution of payoffs and their risk preferences.

  ---

  Marking Scheme (20 marks total, 4 marks per point):

  The marking scheme below outlines five key points that a top answer (A grade) should cover. Each point is worth 4 marks. The B/C boundary might be set at around 10-12 marks, and the A/B boundary at 16 marks. We expect B scripts to cover the first two points and perhaps parts of the third, but miss the last two.

  1. **Demonstration of absolute convergence for the expected value.**  
     - *Note:* Students must show the series for expectation is absolutely convergent (i.e., sum of absolute values of terms converges).  
     - *Common mistake:* Simply stating the series converges without noting absolute convergence, or incorrectly computing the series.

  2. **Explanation of divergence of the second moment (infinite variance).**  
     - *Note:* Students must compute the second moment series (sum of (payoff squared times probability)) and argue that it diverges (e.g., by noting exponential growth).  
     - *Common mistake:* Confusing the second moment with variance and forgetting that if the second moment is infinite then variance is infinite (even though E[X] is finite), or not showing the series for the second moment.

  3. **Recognition that infinite variance poses problems for single-play decisions (risk aversion).**  
     - *Note:* Students should explain that a risk-averse agent may not accept the game even with positive expectation because of the extreme payoffs.  
     - *Common mistake:* Asserting that the defined expectation is sufficient for decision without considering risk, or not mentioning risk aversion.

  4. **Analysis of repeated-play settings: failure of standard laws of large numbers and long-run stability.**  
     - *Note:* Students must note that without finite variance, the weak law of large numbers (for i.i.d. sequences) does not hold, and even if convergence in probability holds by other means, the fluctuations are large and the convergence slow. They should also mention that the strong law holds (since the mean is finite and the games are i.i.d.), but the practical issues of large fluctuations remain.  
     - *Common mistake:* Stating that the law of large numbers fails completely (it doesn't: the strong law holds for i.i.d. with finite mean) but without noting the caveats about the rate and magnitude of fluctuations.

  5. **Contrast with the Pasadena paradox: showing that undefinedness was not the only issue and that the Wilmslow game reveals that higher moments matter.**  
     - *Note:* Students must explain that the Pasadena paradox highlighted problems with conditional convergence (rearrangement), but Wilmslow shows that even absolute convergence (so rearrangement is blocked) does not solve all problems. The lesson is that moments beyond the first (variance, etc.) are crucial for rational choice.  
     - *Common mistake:* Only discussing the Pasadena paradox in terms of undefined expectation and not drawing the contrast about the deeper lesson.

