  2. **Model Answer**: 700-800 words. Must include:
     - Clear statement of the regress argument (premises: every fact is grounded; grounding chains must terminate; and if they don't, we have a vicious regress).
     - Distinguish vicious vs. benign regresses in a way that is argumentatively relevant (vicious: explanatory failure; benign: no such failure, e.g., mathematical or causal regresses that are acceptable).
     - Engage with the idea of an infinite totality: if every fact in the chain is grounded, does that explain the whole chain? Or is there an explanatory residue?
