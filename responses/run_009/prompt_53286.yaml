answer: |-
  Here's a comprehensive, student-driven Ellsberg urn activity with trading and bookie roles designed to make ambiguity aversion tangible. The plan emphasizes discovery, minimizes lecturing, and fits into 90 minutes. I've refined your ideas for practicality and added safeguards against common pitfalls.

  ---

  ### **Learning Objectives**
  1. **Experience ambiguity aversion** in individual choices.
  2. **Discover inconsistent preferences** through forced swaps.
  3. **Observe market dynamics** where aversion may diminish with pricing.
  4. **Debate rationality** of ambiguity aversion (adversarial world vs. bias).

  ---

  ### **Materials**
  - **Jar A**: 50 red cards, 50 black cards (known 50/50).
  - **Jar B**: 100 red/black cards, **unknown ratio** (pre-fill with 100 red but *do not reveal* until debrief).
  - **Bet tickets**: Color-coded cards for bets:
    - Round 1: Red tickets (Jar A Red, Jar B Red).
    - Round 2: Blue tickets (Jar A Black, Jar B Black).
  - **Trading currency**: Poker chips (1 chip = 0.1 raffle ticket). Each student starts with 10 chips.
  - **Bookie kits**: 2 envelopes labeled "BOOKIE" with 20 chips + tracking sheet.
  - **Prizes**: Raffle for extra credit (e.g., 5 points) or small gifts.

  ---

  ### **Timeline (90 Min)**
  | Phase          | Time  | Activity                                                                 |
  |----------------|-------|--------------------------------------------------------------------------|
  | **Setup**      | 0-5   | Explain jars, bets, and raffle tickets. Emphasize: "Jar B is a mystery." |
  | **Round 1**    | 5-15  | Students choose: **Jar A Red** or **Jar B Red**. Record choices.         |
  | **Round 2**    | 15-25 | Students choose: **Jar A Black** or **Jar B Black**. Record choices.     |
  | **Trading Prep**| 25-30 | Distribute chips and bet tickets. Assign 2 bookies. Explain rules.       |
  | **Trading**    | 30-45 | Open trading: 15 min market for buying/selling bet tickets.              |
  | **Resolution** | 45-60 | Draw from jars. Resolve bets. Settle trades. Calculate raffle tickets.  |
  | **Debrief**    | 60-90 | Reveal results, discuss paradox, and explore rationality.               |

  ---

  ### **Rules & Payoffs**
  #### **Rounds 1 & 2**
  - **Objective**: Win raffle tickets if chosen color is drawn.
  - **Procedure**:
    - Round 1: Students choose to bet on **red** in Jar A or Jar B.
    - Round 2: Students choose to bet on **black** in Jar A or Jar B.
    - **Record choices secretly** (use a Google Form or slips).
    - Hand out **bet tickets** (e.g., "Jar A Red") after choices.

  #### **Trading Round**
  - **Objective**: Trade bet tickets using chips.
  - **Rules**:
    - **All trades** must be recorded at a central "market desk" (you or a TA).
    - **Sellers**: Set an ask price (e.g., 3 chips for "Jar B Red").
    - **Buyers**: Make bids publicly or negotiate.
    - **Bookies**: Try to profit by:
      - Buying undervalued bets (e.g., both Jar B colors for <10 chips total).
      - Exploiting prices where `Jar B Red + Jar B Black < 10 chips` (theoretical arbitrage).
  - **Why chips?** Avoid messy raffle-ticket accounting. Chips convert to raffle tickets later (1 chip = 0.1 ticket).

  #### **Resolution**
  - Draw balls **publicly** (with replacement to preserve ratios):
    - **Round 1**: Draw from Jar A (resolves Jar A Red bets), then Jar B (resolves Jar B Red bets).
    - **Round 2**: Repeat for black bets.
  - **Settle trades**: Adjust raffle tickets based on holdings:
    - Winning bet = +1 raffle ticket.
    - Losing bet = +0.
    - Chips convert to raffle tickets (e.g., 10 chips = 1 ticket).
    - Bookies keep net chips/tickets.

  ---

  ### **Bookie Role (Key Innovation)**
  - **Goal**: Profit by exploiting underpriced Jar B bets.
  - **Mechanics**:
    - Bookies buy bets where the sum of **Jar B Red + Jar B Black** trade prices < 10 chips.
    - **Why 10 chips?** Represents 1.0 raffle ticket—the max expected value of two independent 50/50 bets. If bookies buy both for <10 chips, they profit if one wins (expected value = 1.0 ticket).
  - **Example**: 
    - Bookie buys "Jar B Red" for 3 chips and "Jar B Black" for 4 chips (total 7 chips = 0.7 tickets).
    - If either bet wins, bookie gains 1.0 ticket (net +0.3). Even if both lose, loss capped at 0.7 tickets.
  - **Incentive**: Bookies keep 50% of profits as extra raffle tickets.

  ---

  ### **Predictable Problems & Fixes**
  1. **Noisy trading (thin market)**:
     - **Risk**: Few trades if students are passive.
     - **Fix**: 
       - Start trading with a seeded bid/ask (e.g., "Selling Jar A Red for 6 chips!").
       - Bookies must make 5+ trades for credit.

  2. **Students trading "for fun"**:
     - **Risk**: Random trades mask ambiguity aversion.
     - **Fix**: 
       - Award a "most profitable trader" prize.
       - Require trades to be >2 chips (deters joke trades).

  3. **Time pressure**:
     - **Risk**: Trading/resolution runs long.
     - **Fix**: 
       - Use a timer. Cut trading at 12 min if needed.
       - Resolve only 3–5 sample trades publicly; others self-calculate.

  4. **Bookie confusion**:
     - **Risk**: Bookies miss arbitrage chances.
     - **Fix**: 
       - Give bookies a cheat-sheet: *"Buy if Jar B Red + Jar B Black < 10 chips."*
       - Step in with "nudges" if they’re inactive.

  ---

  ### **Debrief Script (30 Min)**
  1. **Reveal Choices** (5 min):
     - Show anonymous poll results:
       - Round 1: % choosing Jar A Red vs. Jar B Red.
       - Round 2: % choosing Jar A Black vs. Jar B Black.
     - **Key Q**: "How many chose the *known* jar both times? Why?"

  2. **The Paradox** (10 min):
     - **Inconsistency**: Show that avoiding Jar B in both rounds implies:  
       - `P(Jar B Red) < 0.5` (Round 1) and `P(Jar B Black) < 0.5` (Round 2).  
       But probabilities must sum to 1—impossible!
     - **Sure-Thing Principle**: Choosing Jar A in both violates expected utility unless beliefs are incoherent.

  3. **Trading Insights** (5 min):
     - Compare average prices:
       - Jar A tickets: Likely ~5 chips (expected value 0.5).
       - Jar B tickets: Likely <5 chips (ambiguity discount).
     - **Key Q**: "Did aversion fade when you had to set a price? Why?"

  4. **Bookie Exploits** (5 min):
     - If bookies profited, show how underpricing created arbitrage.
     - **Key Q**: "Can you 'safely' price both Jar B colors below 0.5? Why not?"

  5. **Rationality Debate** (5 min):
     - **Argument 1 (Bias)**: Inconsistency = irrational (Ellsberg).
     - **Argument 2 (Sensible)**: If Jar B was filled adversarially (e.g., to minimize your wins), ambiguity aversion is rational.
     - **Reveal Jar B**: Show it’s 100% red. Discuss: "Was it adversarial? Does that justify aversion?"

  ---

  ### **Should You Mention Maxmin?**
  - **No—save it for next lecture**. End on the puzzle:  
    *"If ambiguity aversion isn't irrational, what model explains it? We’ll tackle that next week."*  
    This primes curiosity without overloading the session.

  ---

  ### **Why This Works**
  - **Self-discovery**: Students *see* their inconsistent choices via polls and trading.
  - **Market mitigates aversion**: Pricing forces explicit valuations, often reducing the gap between Jar A/B prices.
  - **Bookies make theory concrete**: Their success/failure shows whether aversion is "exploitable."
  - **Efficiency**: Trading uses chips (not raffle tickets) to avoid accounting chaos.

  **First-run tip**: Do a dry run with a TA to test timing. Focus the debrief on the paradox—trading is a means to an end. If trading flops, use it to discuss why ambiguity is harder to price than risk.
