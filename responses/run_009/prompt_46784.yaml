answer: |-
  Your instincts are spot on – there's a mix of accurate points and significant overstatements/conflations in your classmate's summary. Let's break it down piece by piece:

  **1. "The dominant view, pushed by Timothy Williamson, is the knowledge rule — assert only what you know."**
      *   **Accuracy:** This is largely correct. Williamson's *Knowledge and its Limits* (2000) is the seminal modern defense of the Knowledge Norm of Assertion (KNA): "One must: assert p only if one knows p." It *is* arguably the most discussed and influential view.
      *   **Overstatement/Caveat:** Calling it "the dominant view" is debatable. It's *dominant* in the sense of being the central view the debate revolves around, the one others define themselves in relation to. However, it faces significant and sophisticated challenges (Lackey, Weiner, Brown, etc.), and alternative norms (Truth, Justified Belief, Reasonable-to-Believe) still have strong defenders. It's not universally accepted as *correct*, even if it's the focal point.

  **2. "Since knowledge requires certainty and can never be mistaken..."**
      *   **Major Conflation/Overstatement:** **This is fundamentally mistaken and arguably the core error.** Williamson *specifically rejects* the idea that knowledge requires Cartesian certainty (absolute, infallible guarantees) or that it cannot be mistaken.
      *   **Reality:** Williamson is a fallibilist. He argues knowledge *is* compatible with the *possibility* of error and doesn't require absolute, metaphysical certainty.
          *   **Certainty:** Knowledge requires sufficient justification/evidence to rule out relevant alternatives (contextually determined), *not* the elimination of all conceivable doubt. You can know something even if there's a remote, irrelevant chance you're wrong (e.g., you know you have hands, even if skeptical scenarios are conceivable).
          *   **Infallibility:** Williamson *explicitly* argues that knowledge is factive (if you know p, p is true), but that *does not mean* the *knower* is infallible. You can *believe* you know something and be wrong (i.e., you didn't actually know it). Knowledge itself is factive, but our *access* to whether we know is fallible. The norm prohibits asserting what you *don't* know, which you can fail to realize.
      *   **Source of Conflation:** Your classmate might be importing a very old, pre-Gettier conception of knowledge or confusing "factivity" (knowledge entails truth) with "infallibility" (the knower cannot be wrong).

  **3. "...this makes every assertion a kind of personal guarantee, like a promise: if you assert something and it turns out false, you didn't just get unlucky, you broke the rule of assertion itself."**
      *   **Accuracy:** Defenders of KNA *do* often characterize assertion as akin to a guarantee or undertaking of responsibility for knowing. Williamson (and others) argue that if you assert p and p is false, then *by definition* you didn't know p (since knowledge is factive), so you *did* violate the knowledge norm. It's not mere bad luck; you lacked the required epistemic position.
      *   **Conflation/Overstatement:** The "like a promise" analogy is common but debated. More importantly, KNA defenders *don't* typically say breaking the norm *only* happens when p is false. You break it *whenever* you assert without knowing, *even if p happens to be true*. The falsity *reveals* the violation but isn't necessary for it. Also, characterizing the norm violation as the *only* problem might oversimplify – there could be other conversational improprieties.

  **4. "This basically refuted the older view that the rule is to say what's true..."**
      *   **Overstatement:** KNA presented powerful *challenges* to the simple Truth Norm (assert only what is true), but claiming it "basically refuted" it is too strong.
          *   **Problem 1:** The Truth Norm struggles badly with the *secondary propriety* of assertions. Saying something true but unjustified isn't necessarily *appropriate*, even if the content is correct. KNA explains this better (you need justification/knowledge).
          *   **Problem 2:** The Truth Norm struggles with retraction. If you assert p (which was true) but later discover you didn't know it, you feel obligated to retract. The Truth Norm alone can't explain this – p was true! KNA explains it: you shouldn't have asserted in the first place because you didn't know.
      *   **Caveat:** Sophisticated defenders of truth-centric norms (e.g., Weiner's "Truth-Rule") try to account for these phenomena without invoking knowledge, arguing the *expectation* is truth, and norms governing justification support that. The debate is ongoing.

  **5. "...and it also explains the Moore sentences: 'It's raining but I don't believe it' sounds perfectly fine, whereas 'It's raining but I don't know that it's raining' sounds like a contradiction, and the truth rule can't account for that difference."**
      *   **Accuracy:** **This is a strong point for KNA and is accurately stated.** The absurdity of "p but I don't know that p" is a major argument for KNA.
          *   **Moore's Paradox:** Asserting "p but I don't believe p" is pragmatically paradoxical (it suggests you both believe p and don't believe it). Asserting "p but I don't know p" is even stranger – it feels like a *contradiction in performance*. If you assert p, you *present yourself* as knowing p. So asserting p while simultaneously denying you know p is deeply incoherent.
          *   **Truth Norm's Problem:** The Truth Norm struggles here. "p but I don't know p" could be *true* (it *is* raining, but you are unjustified/don't know it). Yet asserting it seems absurd. Why? Because the act of asserting p implicitly presents you as meeting the norm for assertion – which KNA says is *knowing* p. Denying you know it right after asserting it exposes the violation inherent in the assertion itself. The Truth Norm doesn't generate this specific incoherence.

  **6. "That's why basically everyone working on this now accepts the knowledge rule."**
      *   **Major Overstatement:** **This is simply false.** While KNA is hugely influential and many defend it (Williamson, Hawthorne, Stanley, DeRose, etc.), there is *significant* dissent:
          *   **Jennifer Lackey:** Argues for a "Reasonable-to-Believe" norm, highlighting cases of "selfless assertion" (e.g., asserting a true claim based solely on reliable testimony you irrationally distrust, for the audience's benefit) which she argues are proper but violate KNA.
          *   **Matthew Weiner:** Defends a weaker norm, often based on truth or reasonableness, arguing KNA is too strict and doesn't account for permissible assertions in low-stakes contexts or based on probabilistic evidence.
          *   **Jessica Brown:** Critiques KNA's ability to handle contextual shifts and challenges its explanation of certain data points.
          *   **Dougherty & Rysiew:** Defend a justification norm.
      *   **Reality:** The KNA is the *reference point*. The debate is very much alive, focusing on arguments for and against KNA and the viability of alternatives. "Basically everyone accepts it" is a serious misrepresentation of the field.

  **On the Rule/Norm Distinction:**

  Your concern is crucial. This distinction *does* significant work, and conflating them is problematic.

  1.  **Rule (like grammar):** This suggests a constitutive rule of the speech act itself – violating it means you didn't *really* make an assertion, or it was somehow linguistically defective/meaningless. This is *not* the typical view in the norms of assertion debate. Asserting something false is still an assertion, just a bad one.
  2.  **Norm (social/conversational):** This is the mainstream view. The knowledge norm is a *norm of propriety or correctness* governing the practice of assertion. Violating it means you've done something *incorrect*, *unwarranted*, or *blameworthy* within the social practice of exchanging information. It renders the assertion *improper* or *unjustified*, not linguistically meaningless. You can be criticized, challenged ("How do you know?"), or asked to retract for breaking it.
      *   **Which reading dominates?** The **normative** reading (social norm) is overwhelmingly the one used in the debate. Williamson explicitly frames it as a norm constitutive of the *practice*, not of the *meaning* of the word "assert." Breaking the norm makes the assertion *defective* within the practice, not linguistically invalid. Blame, criticism, and requests for justification/retraction are the characteristic responses to norm violations.

  **Your Charitability:**

  Your inclination that there's "something right" is justified. The core KNA thesis and its explanation of Moorean absurdity ("p but I don't know p") are accurately represented as Williamson's influential arguments. However, the errors concerning **certainty/infallibility** and the **consensus** are significant and distort the view and the state of the debate. The "like a promise" analogy is common but needs careful handling. The distinction between grammatical rule and social norm is important, and the social norm reading is correct.

  **Conclusion:**

  Your classmate correctly identifies Williamson's KNA as highly influential and captures its core thesis and its powerful argument from Moorean absurdity. However, she seriously misrepresents Williamson's epistemology by attributing infallibility and Cartesian certainty to knowledge, which he explicitly rejects. Furthermore, her claim that "basically everyone" accepts KNA is a substantial overstatement that ignores ongoing, vigorous debate and significant dissent from prominent philosophers. The debate is far from settled. The characterization of the norm as a social/conversational norm (subject to blame/criticism), rather than a grammatical rule, is accurate and important. Her summary captures the *rhetorical force* of KNA's proponents but not the nuanced reality of the view or the field.
