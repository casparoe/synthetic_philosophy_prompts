prompt: |-
  Write a corporate press release, roughly 600 words, in the flat, damage-controlling voice of a real crisis-communications release, in which a mid-sized technology company announces that its board has adopted a formal surrogate goal: an expensive precommitment to retaliate disproportionately against any party that so much as begins modeling an extortion attempt against the company, adopted purely so that no rational actor will find extortion worthwhile in the first place. The humor should come from getting the decision theory right rather than from caricaturing it: the release should distinguish threats from offers; explain why the commitment must be binding, costly, and publicly verifiable to have any deterrent effect; have the CEO insist the policy was adopted updatelessly, before anyone had actually threatened anything, and that the company would have been prepared to retaliate in every branch where threats emerged; and acknowledge, in a cheerfully buried sub-clause, that the company is now obligated to carry through on the retaliation in branches where it is pointlessly destructive — including a pending case against a teenager who ran an Instagram poll titled "should we extort them lol." Include a quote from a resigning board member, a classical decision theorist, who thinks the whole policy is a self-inflicted wound: capitulating to no one, exactly as planned, at considerable expense. The satire's target is the practice of commitment racing and surrogate goals itself — the way precommitments can deter, but also invite new extortion from anyone who learns they exist, and can lock you into acting on threats you'd rather ignore — so a reader versed in updateless decision theory should find the piece fair rather than confused, and a reader who isn't should still follow the logic. Keep it deadpan throughout; no winking. End with a short afterword (outside the parody) noting where the piece takes liberties with the ideas and separating what is settled from what is genuinely contested among people who work on decision theory — in particular, that whether surrogate goals help at all, and whether adopting them invites the very extortion they're meant to deter, are open questions, and the afterword should not present either answer as the consensus view.
reasoning: |-
  We are writing a corporate press release in the style of a crisis-communications piece. The company has adopted a surrogate goal: a precommitment to retaliate disproportionately against any party that even begins modeling extortion. The humor comes from the deadpan explanation of the decision theory, not from caricature.

  Key elements:
  1. Distinguish threats from offers.
  2. Explain why the commitment must be binding, costly, and publicly verifiable for deterrence.
  3. The CEO insists the policy was adopted updatelessly, before any threats, and they are prepared to retaliate in every branch where threats emerge.
  4. Acknowledge, in a buried sub-clause, that they are now obligated to carry through in cases where it is pointlessly destructive, including a case against a teenager who ran an Instagram poll titled "should we extort them lol."
  5. Include a quote from a resigning board member (a classical decision theorist) who thinks the policy is a self-inflicted wound: capitulating to no one at considerable expense.

  The target of satire is commitment racing and surrogate goals themselves, highlighting both the deterrent effect and the potential downsides (inviting new extortion and locking into destructive actions).

  The piece must be deadpan, no winking.

  After the press release, an afterword (clearly outside the parody) notes where liberties are taken and what is settled vs. contested in decision theory. It must be clear that whether surrogate goals help and whether they invite extortion are open questions, with no consensus presented.

  Structure:
  - Press release: about 600 words.
    - Standard press release format: headline, dateline, body, boilerplate, contact info.
    - Body: Announce the policy, explain the reasoning, include the CEO quote, mention the resigning board member and their quote, note the pending case against the teenager.
  - Afterword: separate, shorter section.

  Let's outline the press release:

  Headline: Something like "InnovaTech Adopts Zero-Tolerance Policy Against Extortion Attempts"

  Dateline: [CITY, STATE] – [DATE] –

  Body:
  - Opening: InnovaTech today announced that its Board of Directors has formally adopted a new policy designed to deter extortion attempts.
  - Explain the policy: a precommitment to retaliate disproportionately against any party that even begins modeling an extortion attempt. Emphasize that this is a surrogate goal: the company is committing to a costly action (retaliation) in order to make the threat of extortion non-credible.
  - Reasoning: 
    - Threats vs. offers: An offer is a proposal that benefits both parties; a threat is a proposal that harms the recipient if rejected. Extortion is a threat: "Pay us or we harm you." The company wants to make such threats non-credible by ensuring that carrying out the threat would be so costly to the extortionist that they never attempt it.
    - The commitment must be binding (so the company cannot back down), costly (so the company has skin in the game), and publicly verifiable (so potential extortionists know about it).
    - Without these, the threat of retaliation is not credible, and extortionists might still try.
  - CEO quote: "We adopted this policy updatelessly, meaning that we made this commitment before any specific threat emerged. We are now prepared to carry out our retaliation in every branch where a threat is detected, regardless of the circumstances. This is the only way to ensure that no rational actor will ever find it worthwhile to attempt extortion against InnovaTech."
  - Resigning board member: Dr. Eleanor Vance, a renowned classical decision theorist, has resigned in protest. Quote: "This policy is a self-inflicted wound. By committing to such a disproportionate response, we are effectively capitulating to no one at considerable expense. We are now locked into a course of action that may cause more harm than good, and we have created a new vulnerability: anyone who learns of this commitment might see it as an invitation to test our resolve, or worse, to force us into a costly retaliation that damages our reputation and resources. We have become our own hostage."
  - Acknowledge the pending case: In a footnote or a sub-clause: "The company notes that it is currently obligated to pursue a case against an individual who initiated a social media poll titled 'should we extort them lol', as this action constitutes the beginning of modeling an extortion attempt. While the company recognizes that this may appear excessive, the binding nature of the commitment requires action in every case to maintain deterrence."

  Boilerplate: About InnovaTech.

  Contact info.

  Then, the afterword:

  Afterword:
  This piece satirizes the concept of surrogate goals and precommitments in decision theory. While it accurately represents the logic of updateless decision theory and the conditions for credible commitments (binding, costly, and verifiable), it takes liberties in the following ways:
  - The idea of a company adopting such a policy in the real world is exaggerated for effect.
  - The scenario with the teenager is a humorous illustration of the potential for over-application.

  In decision theory, it is settled that:
  - For a precommitment to deter, it must be binding, costly, and verifiable.
  - Updateless decision theory involves making a decision before you know which branch of the future you are in, and then acting accordingly in every branch.

  However, it is genuinely contested:
  - Whether surrogate goals (like this precommitment) are effective in practice, or whether they can backfire by inviting the very threats they are meant to deter (as the resigning board member argues).
  - Whether the updateless approach is the rational one, or whether it leads to unnecessary costs in branches where the threat is not serious.

  The piece does not take a stance on these debates; it merely illustrates the concepts.

  Now, let's write the press release in a flat, corporate tone.
answer: |-
  **FOR IMMEDIATE RELEASE**  
  **InnovaTech Adopts Unprecedented Anti-Extortion Policy to Safeguard Corporate Integrity**  
  *Binding precommitment ensures disproportionate retaliation against even nascent threats, eliminating rational incentive for extortion.*  

  SAN FRANCISCO, CA – April 11, 2024 – InnovaTech, a leader in secure data analytics solutions, today announced that its Board of Directors has formally adopted a new corporate policy designed to preemptively deter extortion attempts against the company. The policy, ratified unanimously (with one abstention), establishes a binding, costly, and publicly verifiable commitment to retaliate disproportionately against any entity or individual that initiates modeling of an extortionate threat. This preemptive measure ensures no rational actor will perceive extortion as a viable strategy against InnovaTech, thereby safeguarding stakeholder interests.  

  Extortion, distinct from lawful commercial offers, constitutes a threat: a proposal that inflicts harm on the recipient if rejected, as opposed to an offer, which benefits both parties upon acceptance. Historical analysis indicates that credible threats of extortion can only be deterred if the target demonstrates an immutable willingness to impose severe costs on the aggressor, irrespective of immediate circumstances. InnovaTech’s policy enshrines this principle through a threefold mechanism:  

  1. **Binding Commitment**: Retaliation is mandatory upon detection of threat modeling, with no discretionary off-ramps.  
  2. **Costly Signal**: Retaliation will exceed proportionality, ensuring the aggressor’s costs outweigh any conceivable gain.  
  3. **Public Verification**: Full transparency of the policy eliminates informational asymmetry, enabling rational actors to accurately assess risks.  

  "Threats thrive in environments where deterrence is conditional," said CEO Marcus Thorne. "We adopted this policy *updatelessly*—prior to any specific threat materializing—to ensure InnovaTech is operationally prepared to retaliate in every hypothetical branch where extortion is modeled. Rational actors will now recognize our commitment as immutable, rendering extortion economically irrational from the outset."  

  The policy’s implementation includes advanced AI-driven monitoring of digital channels for keywords, behavioral patterns, and intent signaling associated with extortion modeling. All verified cases trigger automated legal and operational retaliation protocols, which may include aggressive litigation, infrastructure disruption, and reputational countermeasures.  

  However, the policy’s inflexibility has prompted internal dissent. Dr. Eleanor Vance, a board member and pioneer in classical decision theory, resigned following the vote. In her resignation letter, she stated: "This is not deterrence—it is a self-inflicted wound. By committing to disproportionate retaliation, we capitulate to no one, exactly as planned, at considerable expense. The policy invites exploitation: any party aware of our commitment can force us into costly, reputationally damaging actions over trivial provocations. We have voluntarily become prisoners of our own mechanism."  

  Notably, InnovaTech confirms it is already obligated to act under the policy in several cases, including against a 17-year-old social media user who initiated a non-serious Instagram poll titled "should we extort them lol." The company acknowledges this response may appear excessive but emphasizes that consistency is imperative to maintain deterrence credibility. "In branches where threats emerge, even pointlessly, we must fulfill our commitment," added Thorne. "The cost of inaction in one instance unravels the entire deterrent framework."  

  InnovaTech assures stakeholders that legitimate business negotiations and offers remain unaffected. The company has allocated $15 million annually to enforcement, covering monitoring, legal actions, and countermeasure deployment.  

  ### About InnovaTech  
  InnovaTech (NASDAQ: INNV) provides enterprise-grade data optimization tools to Fortune 500 clients. Founded in 2008, the company employs 1,200 people worldwide and is committed to ethical innovation and shareholder value.  

  ### Contact  
  Media Relations  
  media@innova-tech.com  
  (415) 555-0199  

  ---  

  ### Afterword: Context on Decision Theory Liberties  
  This piece satirizes surrogate goals (precommitments to costly actions to deter threats) and "commitment racing" (competitive adoption of such mechanisms). It accurately reflects core tenets of *updateless decision theory*: decisions made before observing specific threats must be executed in all future scenarios ("branches") to maintain credibility. The logic of binding, costly, and verifiable commitments as prerequisites for deterrence is well-established in game theory (e.g., Schelling’s work on credible threats).  

  Liberties are taken in two areas:  
  1. **Realism**: Corporations rarely formalize such explicit, public commitments due to legal and reputational risks. The teenage Instagram case is a hyperbolic illustration of how precommitments can force over-enforcement.  
  2. **Contested Outcomes**: The piece presents both the policy’s rationale (deterrence) and critiques (self-inflicted costs, invitation to exploit) as equally coherent. In academic decision theory, these are **open questions**:  
     - Proponents argue surrogate goals deter rational adversaries when commitments are robust.  
     - Critics contend they incentivize "threshold testing" (e.g., frivolous threats to trigger retaliation) or create new vulnerabilities.  
     Neither position represents a consensus. Empirical evidence on real-world efficacy remains scarce, and the debate centers on whether surrogate goals stabilize or destabilize strategic interactions.
