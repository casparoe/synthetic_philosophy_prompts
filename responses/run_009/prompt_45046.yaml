prompt: |-
  I have been recording my gut verdicts on when a performative utterance actually does the thing it purports to do, and I would like to know what principle, if any, captures them — and, if none does, which of my verdicts ought to be surrendered.

  Here are the cases with my verdicts. A registrar says the marriage words to a couple: they are married. An actor says the same words on stage: nothing happens — everyone understands the frame. The same words from a registrar who is bored and scrolling her phone: still married, as far as I am concerned; her attitude is irrelevant. The same words from a registrar who was dismissed that morning but whom nobody has thought to tell: I lean towards still married, though uneasily. A lender holding a gun makes the borrower say that he promises to repay: I think no promise is made. I say I will have the report done by Friday to a colleague who rolls her eyes and plainly does not believe me: I think the promise exists all the same. I say to a friend that I bet him fifty pounds it will rain tomorrow, and he laughs and walks off without a word: no bet exists, so that when it rains I owe him nothing and he owes me nothing. A man writes in his diary, addressed to no one, that he hereby bequeaths his car to his nephew: no bequest. A rival wins a prize and I say through gritted teeth that I congratulate him: the congratulation happens, but it is hollow. I tell a visitor that I warn him the dog bites, knowing full well that the dog is a coward: I cannot decide whether a warning was given that was insincere, or no warning at all. A stranger in uniform shouts at a passer-by that he orders him to stop, and the passer-by reasonably takes him for a security guard when he is in fact a caterer: no order was issued, I would say, even though the hearer complied.

  Two of these seem right individually but refuse to sit together. The promise to the sceptic exists without uptake, whereas the bet fails without uptake; I cannot see what makes them differ, since both look like joint undertakings created by words. And the bored registrar sits badly with the insincere warning: in the one case inner attitude seems irrelevant to whether the act occurred, in the other it seems to decide between two accounts of failure. There is also a case I keep going back and forth on and have deliberately not counted: a priest who has privately lost his faith says the baptismal words over an infant. By my verdict on the bored registrar, the baptism happens; by my instinct about the insincere warning, something goes wrong at the level of the act itself. I cannot hold both.

  Please lead with your bottom line in the first sentence — the principle, or your verdict that no single principle is available — and then give the reasoning. No preamble, and do not restate my question.

  What I want in the body is this: state the principle, or a small set of candidates, precisely, with the clause of it that each of my cases motivates; say what it predicts about cases I have not listed — I would particularly like the automated out-of-office message that says it apologises for the delay, and a chair who declares a meeting open when no one else has arrived; and be honest about which of my verdicts your preferred principle cannot accommodate, explaining why that verdict rather than the principle is what should go. If you find that no principle saves all my verdicts without contortion, tell me which verdict to drop and what becomes of the gun-point promise and the walked-away bet once it is dropped.
reasoning: |-
  Hmm, the user is grappling with performative utterances and seeking a unifying principle for their gut verdicts on when such utterances succeed in performing the intended action. They've provided several detailed scenarios with their intuitive judgments, and they're particularly troubled by apparent inconsistencies between cases like the promise vs. bet (uptake requirement) and the bored registrar vs. insincere warning (attitude relevance). They also mention unresolved tension regarding baptism by a faithless priest.

  The core challenge lies in reconciling three key dimensions: (1) institutional authority vs interpersonal commitments, (2) the role of recipient uptake, and (3) the relevance of speaker sincerity. Their examples systematically test these variables. 

  Notably, their intuition treats institutional acts (marriage, baptism) as robust to both insincerity and minor authority defects, while interpersonal commitments (promise, bet) bifurcate: promises require only speaker intent but bets demand mutual agreement. This suggests two distinct principles rather than one. 

  For institutional acts, the authority+procedure principle holds: if the speaker occupies the relevant institutional role (registrar, priest) and executes the conventional form ("I pronounce you..."), the act occurs regardless of sincerity or recipient belief. This explains all marriage/baptism cases. The gunpoint "promise" fails because coercion voids the speaker's commitment intention, not because of authority issues.

  For interpersonal commitments, the uptake principle applies: the act requires the addressee's recognition of the commitment. Hence the eye-rolling colleague accepts the promise (minimal uptake: hearing + not rejecting), while the walking-away friend provides no uptake for the bet. The diary bequest fails for lack of any recipient. 

  The warning case is transitional: it has institutional overtones (duty to warn) but interpersonal delivery. Hence intuition wavers. The "hollow congratulation" works because minimal uptake occurs (it's heard), making sincerity irrelevant to the act's existence. 

  The out-of-office "apology" fails (no human intention), while the chair opening an empty meeting succeeds (purely procedural act). 

  The faithless priest baptism must succeed by the authority principle - the user should drop the instinct tying insincerity to act failure here. The gunpoint promise fails due to coerced intention, not uptake; the walked-away bet fails due to lack of uptake. 

  Their deepest tension (promise vs bet) reflects that promises can be unilateral commitments, while bets are inherently bilateral. This distinction preserves their verdicts without contortion.
answer: |-
  **Bottom line:** Two principles best capture your verdicts without contortion: **(1) Authority-Convention** for institutional acts, and **(2) Uptake** for interpersonal commitments; no single principle suffices.

  **Principles Defined & Applied:**

  1.  **Authority-Convention Principle:** An institutional act occurs iff:
      *   The speaker holds the relevant conventional authority *at the time of utterance* (real or reasonably perceived by involved parties).
      *   The speaker uses the conventional form.
      *   *Clause motivated by:* Registrar cases (attitude irrelevant, *potential* authority defect handled by reasonable perception), Diary bequest (no authority), Uniformed stranger (no actual authority, no reasonable perception by speaker/parties involved).
      *   **Predicts:**
          *   **Out-of-office "apology":** No act (no human speaker/intention, lacks authority for personal speech act).
          *   **Chair opens empty meeting:** Act occurs (authority + form satisfied; attendance not part of convention).
          *   **Faithless priest:** Baptism occurs (Authority-Convention satisfied; inner faith not a conventional requirement).

  2.  **Uptake Principle:** An interpersonal commitment act occurs iff:
      *   The speaker intends to undertake the commitment.
      *   The utterance is directed to the relevant party/parties.
      *   The utterance secures *uptake*: the addressee recognizes the utterance as an attempt to perform that act (even if they reject/doubt it).
      *   *Clause motivated by:* Promise to sceptic (uptake occurs: colleague heard & understood it as a promise, despite disbelief), Bet walked away (no uptake: friend didn't recognize/acknowledge the bet attempt), Gunpoint promise (no commitment *intention* due to coercion, hence no act even if heard).
      *   **Predicts:**
          *   **Sincere warning to visitor:** Warning occurs (uptake: visitor hears/understands it as a warning). Sincerity affects quality, not existence.
          *   **Gritted-teeth congratulation:** Congratulation occurs (uptake: rival hears it as such). Hollowness is about sincerity, not act existence.

  **Incompatible Verdict & Resolution:**

  *   **Verdict to Drop:** Your wavering on the **insincere warning** ("I cannot decide") and the instinct linking insincerity to act failure in the baptism case should be resolved in favor of the principles.
  *   **Why Drop It?** Your consistent verdicts on the bored registrar, sceptic promise, and gritted-teeth congratulation show that *sincerity generally affects the quality or felicity of the act, not its fundamental existence*. The insincere warning should be treated similarly: a warning *was* given (Authority-Convention if institutional duty, or Uptake if interpersonal - the visitor heard it as a warning), but it was insincere/bad advice. The baptism happens (Authority-Convention) despite the priest's lack of faith.
  *   **Impact on Gunpoint Promise & Walked-Away Bet (Once Sincerity/Intention Uptake Split is Clear):**
      *   **Gunpoint Promise:** Fails unequivocally under the Uptake Principle. Coercion negates the speaker's *intention* to commit. Even if the lender "hears" it, the borrower lacks the requisite commitment intent. (Authority-Convention doesn't apply).
      *   **Walked-Away Bet:** Fails unequivocally under the Uptake Principle. The friend's lack of acknowledgment (walking away) means there was no uptake - they did not recognize the utterance as an attempt to establish a mutual bet. The speaker's intent alone is insufficient for a joint commitment.

  **How the Principles Handle Your Tensions:**

  *   **Promise vs. Bet:** Resolved by the nature of the act and Uptake.
      *   *Promise:* Primarily a unilateral commitment *to* someone. Uptake (hearing/understanding it *as* a promise) is sufficient for the act to exist, even if doubted (sceptic colleague). Rejection would cancel it prospectively, but doesn't negate its initial occurrence.
      *   *Bet:* Inherently a bilateral, joint commitment (mutual agreement). Uptake *requires* recognition *and* at least tacit acceptance/acknowledgment to form the agreement. Walking away signals non-acceptance, hence no uptake establishing the joint act.
  *   **Bored Registrar vs. Insincere Warning:** Resolved by distinguishing act type and separating existence from quality.
      *   *Registrar:* Institutional act (Authority-Convention). Attitude irrelevant to act's existence.
      *   *Warning:* Can be institutional (e.g., safety officer - Authority-Convention applies, warning exists, insincere) or interpersonal (Uptake applies if visitor hears it as a warning, warning exists, insincere). Insincerity makes it defective, not non-existent.
  *   **Faithless Priest:** Resolved by Authority-Convention. The act exists; lack of faith is an insincerity making it defective, not void. Your instinct linking insincerity to failure should be surrendered here.
