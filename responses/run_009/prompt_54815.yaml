answer: |-
  Here's a breakdown of the Ship of Theseus debate translated into your distributed systems vocabulary, followed by a residue report highlighting what doesn't map cleanly. I'll stick to major philosophical positions and map them to technical analogies, noting distortions explicitly. Philosophers *have* engaged with computational analogies (e.g., David Lewis, Derek Parfit, Ted Sider), but often with different goals.

  ### Philosophical Positions Translated
  1. **Spatiotemporal Continuity (Aristotelian/Common Sense View)**  
     *Core Idea:* Identity requires unbroken existence in space and time. The ship is the same ship iff it persists *continuously* through changes. If you swap planks one-by-one, it's still the same ship because there's no discontinuity. The reassembled ship (from old planks) is a replica, not the original.  
     *Tech Analogy:* **VM Live Migration**. The VM retains its identity because state/execution flows uninterrupted between hosts. The hypervisor ensures no "gap" in existence.  
     *Distortion:* In tech, we *can* tolerate brief gaps (e.g., containers restarting). Philosophers debate whether *any* discontinuity breaks identity (e.g., if the ship is disassembled and reassembled identically).  
     *Clean Mapping?* Partial. VM migration is a near-perfect fit, but restarting a stopped container maps poorly (philosophers would likely call that a "new" entity).

  2. **Best Candidate Theory (David Lewis, Robert Nozick)**  
     *Core Idea:* Identity isn't binary; it's about which candidate *best satisfies* the criteria for being "the Ship of Theseus" based on context (e.g., historical connection, functional role). After plank replacement, the operational ship is the best candidate. After reassembly, *both* ships have claims, but the operational one usually wins.  
     *Tech Analogy:* **Load Balancer Routing + DNS Cutover**. During blue-green deploy, the "real" service is whichever the LB routes to. The new stack becomes the "best candidate" once it handles traffic.  
     *Distortion:* Tech decisions are explicit and rule-based (e.g., health checks). Philosophical "best candidate" is fuzzier, involving human judgment about "deservingness."  
     *Clean Mapping?* Good fit. Blue-green deploys capture the pragmatic "what's operational" focus.

  3. **Sortal Relativity (Peter Geach, W.V.O. Quine)**  
     *Core Idea:* "Identity" depends on the *kind* of thing you're asking about ("sortal"). "Is it the same *ship*?" vs. "Is it the same *collection of planks*?" are different questions with different answers. The Ship of Theseus puzzle conflates two sortals.  
     *Tech Analogy:* **Git Commit Hash vs. Branch Name**. `main` (branch pointer) is the "same branch" after rebase, but the commit history (content) is different. Or: CAS hash (same *content*) vs. object storage URI (same *object reference*).  
     *Distortion:* In tech, we explicitly choose the sortal via query (e.g., `SELECT * BY ID` vs. `SELECT * BY HASH`). Philosophers argue sortals are inherent to objects, not just query parameters.  
     *Clean Mapping?* Very clean. Tech systems handle this daily via different identity predicates.

  4. **Conventionalism / Linguistic Decision (Ludwig Wittgenstein, Amie Thomasson)**  
     *Core Idea:* Identity isn't a deep metaphysical fact; it's a convention for how we use words. "Ship of Theseus" is a label we apply based on social/practical needs. There's no "true" answer—we decide what counts as "the same ship" for our purposes.  
     *Tech Analogy:* **Naming Service / Service Discovery**. Consul/etcd/Zookeeper entries define what "service-frontend" means today. We update the mapping when we deploy, retire, or split services.  
     *Distortion:* Philosophers emphasize human linguistic practice, while tech conventions are often codified. But both agree identity is assigned, not discovered.  
     *Clean Mapping?* Excellent fit. Service discovery is literal conventionalism.

  5. **Material Constitution (Reassembly Problem)**  
     *Core Idea:* When discarded planks are reassembled, which ship is the "real" one? Some argue *neither* is identical to the original (endurantism); others say both share identity at different times (perdurantism).  
     *Tech Analogy:* **Dual-Write Database Migration**. Old DB (original ship) and New DB (reassembled ship) coexist. Both serve reads/writes temporarily. The "real" entity is fuzzy until cutover.  
     *Distortion:* In tech, dual-writes are transient; we *intend* to deprecate the old. Philosophers treat both ships as having equal claim indefinitely.  
     *Clean Mapping?* Partial. The coexistence period maps, but not the indefinite ambiguity.

  ---

  ### Residue Report: What Doesn't Map (and Why)
  Your intuition ("pick identity semantics per use case") covers ~80% of the debate—especially the conventionalist/sortal aspects. But these residues remain:

  1. **Metaphysical Grounding**  
     Philosophers (e.g., Kripke, Aristotle) debate whether objects have **essential properties** that *must* persist for identity. E.g., "Is the *original material* essential to the Ship of Theseus?" Tech has no counterpart because:  
     - Your systems treat identity as *operational* (e.g., "can serve requests") or *defined by convention* (e.g., DNS).  
     - Philosophers ask, "What *makes* it the same object beyond our labels?" This is ontological, not pragmatic.  
     *Why it doesn't translate:* Engineers don’t need an objective "ship-ness" property. If the load balancer points to it, it’s the service. Philosophers probe whether something *fundamental* persists.

  2. **Indeterminacy & Vagueness**  
     Philosophy often accepts **borderline cases** where identity is genuinely indeterminate (e.g., after reassembly, *neither* ship is clearly the original). Tech systems *cannot* tolerate this:  
     - You enforce determinism (e.g., leader election, unique PKs).  
     - A "fuzzy identity" would break distributed consensus (e.g., split-brain).  
     *Why it doesn't translate:* Your tools resolve ambiguity by design. Philosophers explore whether reality itself is vague.

  3. **Essentialism vs. Functionalism**  
     Is identity tied to *what the object is made of* (original planks) or *what it does* (sails as Theseus's ship)? In tech:  
     - Content-addressed storage (hash = material essence).  
     - Load balancer (functionalism).  
     But philosophers argue these are competing *metaphysical* truths, not just implementation choices. Your "use-case" view sidesteps the debate.  
     *Why it doesn't translate:* You select based on requirements; philosophers ask which one is "really" correct.

  4. **First-Person Continuity (Personal Identity)**  
     The Ship of Theseus is often a proxy for **personhood** (e.g., "If I replace all my cells, am I still me?"). Tech analogies fail here:  
     - Rebooting a service isn’t analogous to consciousness.  
     - Event-sourced "rebuilding" an entity assumes the log is authoritative, but a person can’t be "rebuilt" from memories without identity loss.  
     *Why it doesn't translate:* Distributed systems lack subjective experience. Philosophers care about *what it feels like* to persist.

  5. **Normative Dimensions**  
     Some positions (e.g., best candidate theory) imply identity has a **normative** component: "The *real* ship is the one that *ought* to be called such." Tech identity is descriptive:  
     - Your systems don’t care about "deservingness"—only config and rules.  
     - Philosophers debate if there’s a moral or rational *duty* to call one ship the original.  
     *Why it doesn't translate:* Pragmatism dominates engineering; philosophy often seeks prescriptive truths.

  6. **Vagueness Tolerance vs. Resolution**  
     Philosophers might say, "At 51% plank replacement, it’s indeterminate whether it’s the same ship." Tech:  
     - You define precise thresholds (e.g., quorum for consensus, deployment completion metrics).  
     - Vagueness is a bug, not a feature.  
     *Why it doesn't translate:* Distributed systems require binary decisions; philosophy investigates continuous transitions.

  ### Conclusion
  Your reaction ("identity semantics are use-case-dependent") is correct for *applied* contexts and captures most modern philosophical views (conventionalism, sortals). The residue—metaphysical grounding, essentialism, indeterminacy—stems from philosophers asking **what existence fundamentally is**, not how to manage it. If your goal is operational clarity, your vocabulary suffices. But if you’re asking *why* objects persist through change (beyond human labeling), the residue matters. It’s not that the debate is unclear; it’s that engineers and philosophers have different success criteria: you need working systems; they probe conceptual foundations.

  > "The philosopher asks 'What *is* a ship?'; the engineer asks 'How do I *keep it sailing*?'"  
  > — Your analogy is robust for the latter. For the former, there’s no `SELECT TRUE_ESSENCE FROM reality;`.
