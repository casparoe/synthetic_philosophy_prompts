  Sortal relativity means the identity question depends on context ("same ship" vs "same planks"). This is like choosing between git commit hash (content) and branch name (pointer). Tech systems handle this by different queries, which is cleaner.

  Conventionalism sees identity as a linguistic convention. In tech, naming services like DNS or service discovery are explicit decisions. The fit is clean here as both involve human-defined names.

  Material constitution deals with the reassembled planks. Dual writes during migrations are a parallel, where both old and new systems coexist. But the distortion is that in philosophy, both ships claim the identity, whereas in tech, the old system is deprecated.

