  ### Joint Statement on the Liar Paradox  
  **Drafted by the Neutral Roommate**  
  *Participants: Paracompletist (PC) and Dialetheist (DT)*  

  ---

  #### 1. Agreed Claims  
  Both parties endorse the following claims without reservation or equivocation. Where potential ambiguities exist (e.g., in the interpretation of "not true"), they are explicitly flagged.  

  1. **Naive truth principles generate the paradox**: The Liar paradox arises from unrestricted truth principles, such as the T-schema (True(⌜A⌝) iff A) and the transparency of truth, in a language capable of self-reference.  
  2. **Classical logic is not fully recoverable**: Resolving the paradox requires rejecting or revising classical logic (e.g., classical negation, explosion, or bivalence). No solution can fully restore classical logic while preserving a naive truth predicate and self-reference.  
  3. **Revenge problems are inescapable and substantive**: All proposed solutions generate new paradoxes (revenge problems) when expressive resources are enriched (e.g., with a "determinately" operator or strengthened truth predicates). These are not mere technicalities but central challenges that reveal theoretical limitations.  
  4. **Non-triviality is mandatory**: Any solution must avoid triviality (i.e., that every sentence is true). Both PC and DT achieve this.  
  5. **The Liar sentence cannot be consistently classical**: The sentence "This sentence is not true" cannot be consistently assigned *only* true or *only* false in classical logic.  
  6. **The following claim is included in this report**: "At least one claim in this joint report is not true." *(Flag: The phrase "not true" may be interpreted differently by PC and DT. PC treats it as including gaps; DT treats it as equivalent to "false." Endorsement implications are addressed in §2 and §3.)*  

  ---

  #### 2. Disagreements Table  
  Each row states a disagreement in terms acceptable to the respective party. PC and DT affirm their own column’s wording as accurate.  

  | Issue | Paracomplete View (PC) | Dialetheist View (DT) |
  |-------|------------------------|------------------------|
  | **Semantic status of the Liar** | "This sentence is not true" is neither true nor false (a truth-value gap). | "This sentence is not true" is both true and false (a truth-value glut). |
  | **Nature of negation** | Negation is exclusive: No sentence is both true and false. A sentence may be neither, and its negation may also be neither. | Negation is non-exclusive: Some sentences (e.g., the Liar) are both true and false, and their negations may also be gluts. |
  | **Meaning of 'not true'** | "Not true" means *either false or gappy*. A gappy sentence is not true, and this assertion is true (not gappy). | "Not true" means *false* (where "false" includes gluts: if a sentence is false, it is not true, even if also true). A glutty sentence is both true and not true. |
  | **Existence of true contradictions** | There are no true contradictions; no sentence is both true and false. | Some contradictions are true; the Liar is a true contradiction (both true and false). |
  | **Endorsement of claim (6)** | We can endorse claim (6) only by recognizing it as gappy or by using a hierarchical "determinately" operator. Asserting it directly invites revenge. | We can endorse claim (6) as both true and false. Asserting glutty sentences is coherent in our logic. |

  **Notes on verbal vs. substantive disagreement**:  
  - **Verbal**: The term "not true" is equivocal. PC uses it to include gaps; DT uses it to mean "false." This affects surface agreement on claims like "The Liar is not true."  
  - **Substantive**: The core disagreement persists even after disambiguation: PC denies gluts; DT affirms them. This manifests in concrete predictions for revenge sentences (§3).  

  ---

  #### 3. Cruxes: Test Sentences and Predictions  
  Test sentences are evaluated in a "jointly agreed vocabulary": truth values (true, false, both, neither) and logical operators are defined minimally to avoid theory-laden terms. Both sides predict how the *other*’s theory handles the sentence and whether it resolves the paradox cleanly.  

  **(a) The plain revenge liar: "This sentence is not true."**  
  - **PC view**: The sentence is gappy (neither true nor false). Field’s "determinately" operator (D) allows us to say it is not D-true and not D-false, but not to resolve the gap without hierarchy.  
    - *Prediction for DT*: DT will call it glutty (both true and false), which PC sees as a contradiction that should be rejected.  
  - **DT view**: The sentence is glutty (both true and false).  
    - *Prediction for PC*: PC’s gap assignment leads to revenge when we ask, "Is it *determinately* not true?"—which PC cannot answer without hierarchy.  
  - **Concrete disagreement**: PC assigns a gap; DT assigns a glut. This is substantive, not merely descriptive.  

  **(b) Anti-gap revenge: "This sentence is false or has no truth value."**  
  - **PC view**: The sentence is gappy. If it were true, it must be false or gappy—contradiction. If false, "false or gappy" is true—contradiction. Field’s hierarchy pushes revenge "one level up": it is not D-true, but higher-order gaps emerge.  
    - *Prediction for DT*: DT avoids gaps, so the sentence is glutty. PC argues this "resolves" it only by accepting a contradiction.  
  - **DT view**: The sentence is glutty (both true and false). Since no gaps exist, "has no truth value" is false, making the disjunct "false" true.  
    - *Prediction for PC*: PC’s gap-based approach cannot handle this without infinite regress (hierarchy of determinacy operators).  
  - **Symmetric?** Partially: Both push revenge upward (PC via hierarchy, DT via gluts), but DT denies gaps, so (b) is not symmetric to (c).  

  **(c) Anti-glut revenge: "This sentence is false or is both true and false."**  
  - **DT view**: The sentence is glutty (both true and false). The disjunct "is both true and false" holds, making it true (and false).  
    - *Prediction for PC*: PC’s gap-only view cannot resolve this: if gappy, both disjuncts fail; if true, it must be false or glutty—contradiction.  
  - **PC view**: The sentence is gappy. PC rejects gluts, so "is both true and false" is false. Field’s hierarchy relegates it to indeterminacy at higher levels.  
    - *Prediction for DT*: DT "resolves" it by accepting a glut, which PC sees as dodging the problem.  
  - **Symmetric?** No: (b) attacks gaps; (c) attacks gluts. DT handles (c) cleanly; PC handles neither (b) nor (c) without hierarchy.  

  **(d) Curry: "If this sentence is true, then the moon is made of cheese."**  
  - **PC view**: Uses Field’s paracomplete conditional (→), which restricts contraction (e.g., (A→(A→B)) → (A→B) fails). Modus ponens holds, but Curry is blocked because contraction is invalid. The sentence is gappy; we do not conclude the moon is made of cheese.  
    - *Prediction for DT*: DT’s conditional (in LP+) is weak. It may preserve modus ponens but at the cost of restricting other rules (e.g., disjunctive syllogism). If DT uses a relevance logic, it may avoid Curry but fail to model ordinary conditionals.  
  - **DT view**: Uses a paraconsistent/relevance conditional (e.g., in Priest’s LP+) that restricts contraction. Modus ponens holds, but Curry is blocked. The sentence is glutty or gappy; the moon is not made of cheese.  
    - *Prediction for PC*: Field’s conditional is too weak for everyday reasoning (e.g., it invalidates some intuitive inferences). PC’s "gappy" assignment is ad hoc.  
  - **Load-bearing conditional?** Yes: Both reject classical conditionals, but their alternatives sacrifice different logical principles (PC: contraction; DT: explosiveness/classical inference rules).  

  ---

  #### 4. Endorsement of Claim (6)  
  - **Claim (6)**: "At least one claim in this joint report is not true."  
  - **PC assessment**: Cannot be asserted directly without revenge. In a fixed-point semantics, it is gappy; we can only endorse it via a hierarchy (e.g., "It is not D-true"). Signing the report asserts claims *as true*, so including (6) risks inconsistency.  
  - **DT assessment**: Can be asserted as glutty (both true and false). DT’s logic tolerates asserting contradictions, so signing is coherent.  
  - **Disagreement**: PC cannot endorse (6) without qualification; DT can. This reflects their core divergence on assertion (DT: assert gluts; PC: only assert determinate truths).  

  ---

  #### Conclusion  
  This joint report clarifies agreements, disagreements, and testable cruxes. Both PC and DT accept that their solutions are incomplete (revenge persists) and that classical logic is unrecoverable. The debate reduces to whether gaps (PC) or gluts (DT) offer a less costly resolution, with conditional handling (Curry) and assertion norms (claim 6) as key battlegrounds. Neither emerges as an "obvious winner"; both bear burdens (PC: hierarchy/expressiveness limits; DT: accepting contradictions). Future work should test predictions (§3) empirically (e.g., via formal models) and refine conditionals.  

