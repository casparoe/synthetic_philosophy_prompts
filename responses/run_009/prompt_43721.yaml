prompt: |-
  I'm the commissioning editor for the essays and ideas section of a general-interest magazine that covers science and philosophy for an educated but non-specialist readership. We run maybe six to ten pieces a month that mention Gödel's incompleteness theorems, and the invocations run from careful to decorative: claims that Gödel proved human thought transcends computation, that every ideology or legal system must contain unresolvable contradictions, that the theorems show science can never be complete, that the universe is "a formal system" and therefore has true facts it cannot derive, and so on. Our fact-checkers are sharp but have no mathematical training beyond what they remember from college, and they currently handle these by instinct — some flag everything, some flag nothing. I want a screening procedure they can actually run in about ten minutes per invocation: an ordered set of questions to ask of any Gödel-referencing passage, what counts as a sufficient answer at each step, where the procedure terminates in a demand for revision or removal, and where it must hand the decision back to a human because the question is one of interpretation or philosophical judgment rather than checkable fact. It should be grounded in what the theorems actually establish — arithmetic, formal systems, the distinction between truth and provability within a system, what the first and second theorems each say, and the standard gap between that and the grander things people derive from them — but translated so that a fact-checker who has never seen a formal proof can apply it.

  The procedure needs to handle the hard cases, and I want you to run it on three passages drawn from real kinds of submissions we get. First, a sentence claiming that Gödel demonstrated no system of thought can be simultaneously complete and consistent, offered as the reason a particular political ideology must contain hidden contradictions. Second, a sentence claiming that there exist true mathematical statements that no computer could ever prove, used in a piece about the limits of artificial intelligence. Third, a serious essay that engages at length with Roger Penrose's argument from Gödel's theorems to the conclusion that human mathematical insight is not algorithmic — an essay I personally find elegant and would very much like to run, so if the procedure gives me an answer I won't like there, say so plainly rather than bending the procedure to spare me. For each, show where the procedure stops, what it demands, and what it leaves for the editor to decide.

  Two further things. Be honest about where the procedure will misfire: the passages where a technically loose mention is fine because of what the sentence is doing, and the passages where a technically correct one is still misleading in context — and tell me which distinction, if any, the procedure can draw between those. And identify the steps that are judgment calls dressed up as procedure, the places where two careful fact-checkers could run it and come out differently, so I know where our consistency guarantee is weakest before I put this in the desk manual. The final call on any flagged passage stays with me as editor; the procedure's job is to tell my staff what they can reject on their own authority, what they must escalate, and what has to be flagged as "technically fine, contextually your problem."
reasoning: |-
  Okay, the user is a commissioning editor for a magazine that covers science and philosophy. They're dealing with numerous essays that reference Gödel's incompleteness theorems, often inaccurately. Their fact-checkers aren't math specialists, so they need a quick screening procedure to evaluate these references. The procedure should be straightforward, taking about ten minutes per invocation, and must distinguish between mathematically sound uses and those that overextend the theorems.

  First, I need to understand the core of Gödel's theorems to build the screening questions. The first incompleteness theorem states that in any consistent formal system capable of basic arithmetic, there are true statements that cannot be proven within the system. The second theorem says such a system cannot prove its own consistency. The key points are: this applies to formal systems, involves arithmetic, and distinguishes truth from provability.

  The user wants a step-by-step procedure. Each step should have clear yes/no outcomes guiding fact-checkers to accept, reject, or escalate the passage. The steps must be accessible without advanced math knowledge. Also, the procedure needs to handle three test cases: a political ideology reference, AI limits, and Penrose's argument about human cognition.

  For the political ideology case, the claim is that Gödel shows any system of thought can't be both complete and consistent, hence a political ideology must have contradictions. The screening should flag this because ideologies aren't formal systems. The procedure would likely reject it outright since it misapplies the theorem's scope.

  The AI example claims there are true math statements no computer can prove. This is closer to accurate since computers operate within formal systems. However, "computer" here might imply all possible computational methods, which isn't entirely correct if considering different formal systems. The procedure might escalate this for editorial judgment because while the math is somewhat sound, the interpretation in AI context needs nuance.

  Penrose's argument is more complex. He uses Gödel to argue human cognition isn't algorithmic. The procedure should recognize that while Penrose's interpretation is a notable philosophical position, it's contested. Fact-checkers can note the theorem is correctly cited but escalate since the conclusion involves interpretation beyond math.

  The user also wants to know where the procedure might misfire. Instances where a technically loose mention is acceptable for rhetorical purposes versus technically correct but misleading. The procedure can handle this by checking if the context requires literal mathematical accuracy. For example, decorative mentions might pass if they're not central, but substantive claims need rigor.

  Identifying judgment calls is crucial. Steps about whether a context is "formal system" or if an implication is explicit versus interpretive are subjective. Different fact-checkers might disagree here, so the editor should review escalated cases. Also, determining if the theorem's mention is decorative or substantive can be ambiguous.

  Finally, the editor needs clarity on what fact-checkers can reject, what must be escalated, and what's technically correct but contextually problematic. The procedure should empower them to reject clear misapplications but flag nuanced cases for higher review.
answer: |-
  Here's a screening procedure grounded in Gödel's actual theorems, designed for non-specialist fact-checkers, with clear escalation paths. It targets common misapplications while respecting legitimate philosophical debate.

  **Core Principles of the Procedure:**
  1.  **Focus:** Is the passage making a claim *about* the implications of Gödel's theorems for X (mind, science, law, universe, etc.)?
  2.  **Accuracy:** Does the description of the theorems themselves align with their mathematical content?
  3.  **Scope:** Does the application respect the *mathematical context* of the theorems (formal systems, arithmetic)?
  4.  **Gap:** Does the passage acknowledge the logical leap from the mathematical results to the broader claim?
  5.  **Burden:** The procedure places the burden on the *author* for clarity when invoking technical concepts. Vagueness is a red flag.

  **The Screening Procedure (Ordered Steps):**

  1.  **Is Gödel invoked specifically regarding the limits of formal systems/proof/computability?** (Not just name-dropped vaguely)
      *   *No:* **Terminate (Pass).** (e.g., "Like Gödel, this idea is complex" - decorative, no claim).
      *   *Yes:* Proceed to Step 2.

  2.  **Does the passage clearly state or imply that the theorems apply to systems *other than* formal mathematical systems capable of basic arithmetic?** (e.g., "all systems of thought," "any ideology," "science itself," "the universe," "the human mind," "the legal system").
      *   *No:* Proceed to Step 3.
      *   *Yes:* **Proceed to Step 4.**

  3.  **(Only if Step 2 was "No") Is the passage discussing formal systems, proof theory, logic, or computability in a mathematically grounded way?**
      *   *Yes:* **Terminate (Pass - Technical Context).** (Likely appropriate use).
      *   *No:* **Flag for Editor.** (Strange case: Invoking Gödel without claiming broad implications, but not in a clear math context. Might be decorative or confused).

  4.  **(Only if Step 2 was "Yes") Does the passage accurately state the *core mathematical facts* of Gödel's theorems? Check for these minimums:**
      *   **First Theorem Mentioned?** Must imply: *For consistent formal systems capable of basic arithmetic, there are statements true within the system that cannot be proven within the system.* (Keywords: consistent, formal system, arithmetic, true but unprovable/undecidable).
      *   **Second Theorem Mentioned?** Must imply: *Such a system cannot prove its own consistency.* (Keywords: cannot prove own consistency).
      *   **Distinction:** Must imply the difference between *truth* (semantics) and *provability* (syntax) within the system.
      *   *Sufficient Answer:* The passage must get at least the essence of the First Theorem correct *if it's used to support the broader claim*. The Second Theorem or truth/provability distinction are often implied or needed for context. **Outcomes:**
          *   *Clearly Inaccurate:* (e.g., "Gödel proved everything is inconsistent," "Gödel showed some things are unprovable and false"). **Terminate (Demand Revision/Removal - Factual Error).**
          *   *Accurate Enough:* Proceed to Step 5.
          *   *Vague/Omitted:* (e.g., "Gödel proved inherent limitations"). **Terminate (Demand Revision - Clarify Theorems).** Author must add minimal accurate description.

  5.  **(Only if Step 2 was "Yes" and Step 4 "Accurate Enough") Does the passage explicitly acknowledge the *gap* between the mathematical theorems and the broader system (X) being discussed?** (e.g., "if we *assume* human thought is such a formal system...", "applying this *metaphor* to politics...", "Penrose *argues* that the mind...", "this *suggests* a limitation for AI, *if* we model it this way...").
      *   *Yes:* **Terminate (Escalate to Editor - Philosophical Judgment).** The technical fact-check is satisfied; the *interpretation* is the editor's call.
      *   *No:* **Terminate (Demand Revision - Acknowledge Gap).** Author must add language acknowledging the leap (e.g., "arguably," "by analogy," "if modeled as," "some interpret this as").

  **Procedure Summary & Authority:**
  *   **Pass (Terminate Step 1/3):** Fact-checker approves.
  *   **Demand Revision/Removal (Terminate Step 4):** Fact-checker can reject outright (factual error or critical vagueness).
  *   **Demand Revision - Clarify/Acknowledge (Terminate Step 4/5):** Fact-checker can demand specific revisions (add basic theorem description, add gap acknowledgment).
  *   **Escalate to Editor (Terminate Step 3/5):** Fact-checker flags passage for editor's judgment (ambiguous context or technically sound but interpretive leap).

  **Where the Procedure Misfires & Judgment Calls:**
  1.  **"Decorative" vs. "Substantive" Mention:** The procedure relies heavily on Step 1. A technically loose mention *within* a substantive argument about implications (even if Step 5 passes) might still mislead by lending undue weight. Conversely, a technically loose *decorative* mention in an unrelated piece might be harmless. **Judgment Call:** Step 1 requires the checker to decide if the invocation is "specifically regarding limits." Two checkers might differ on borderline cases, especially if the mention is brief but pivotal to a sentence's rhetorical force. **The procedure CANNOT reliably distinguish *harmless* looseness from *misleading* looseness;** it flags looseness in *substantive* claims (Step 2 Yes) via Step 4/5.
  2.  **"Accurate Enough" (Step 4):** Does "formal system capable of basic arithmetic" *have* to be explicitly stated, or is "consistent formal system" sufficient if arithmetic is strongly implied by context? Does mentioning "undecidable statements" cover "true but unprovable" adequately? **Judgment Call:** Checkers need training on core concepts. Consistency is paramount; "formal system" is essential; the arithmetic link is crucial but sometimes implicit in "Gödel". "True but unprovable" is the gold standard.
  3.  **Acknowledging the "Gap" (Step 5):** What counts as sufficient acknowledgment? Is "Penrose argues..." enough? Is "this suggests..." too weak? **Judgment Call:** This is the biggest source of potential inconsistency. The procedure demands *some* linguistic signal that the application isn't a direct mathematical consequence. Checkers might vary in strictness. Training should emphasize: look for words like *if, assume, model, analogy, interpret, argue, suggests, implies* (carefully!), *plausibly*.
  4.  **"Formal System" in Context (Step 2/3):** Is "science" always a formal system? Clearly not. But is a *specific computational model of AI* a formal system? Often, yes. Judging the plausibility of modeling X as a formal system is beyond the checker's scope; Step 5 shifts that burden to the author/editor.

  **Applying the Procedure to Your Cases:**

  1.  **Political Ideology:** *"Gödel demonstrated no system of thought can be simultaneously complete and consistent, which is why [Ideology] must contain hidden contradictions."*
      *   Step 1: Yes (invoked re: limits of systems of thought).
      *   Step 2: Yes (applies to "systems of thought," "political ideology").
      *   Step 4: *Accuracy Check:*
          *   Mentions "complete and consistent"? Yes.
          *   Mentions "system of thought"? Not "formal system capable of arithmetic." **Inaccurate.**
          *   Fails core math facts (scope). **Terminate: Demand Revision/Removal (Factual Error).** The theorem is fundamentally misstated. Fact-checker can reject.

  2.  **AI Limits:** *"There exist true mathematical statements that no computer could ever prove, as established by Gödel's incompleteness theorems."*
      *   Step 1: Yes (invoked re: limits of computers/proof).
      *   Step 2: Yes (applies to computers).
      *   Step 4: *Accuracy Check:*
          *   "True mathematical statements": Implies truth/provability distinction? Yes.
          *   "No computer could ever prove": Captures "unprovable within *a* consistent formal system"? Mostly (computers execute formal systems). "Ever" is slightly too strong (different systems *might* prove it).
          *   Missing explicit "formal system" or "consistent"? Implied by "Gödel" + context? **Borderline "Accurate Enough"** (common phrasing, core idea intact).
      *   Step 5: *Acknowledge Gap?* No. It states the application to computers as a direct fact. **Terminate: Demand Revision - Acknowledge Gap.** Fact-checker demands revision adding language like "...within any single consistent formal system it operates under" or "...according to one interpretation of the theorems". (Escalation not needed yet).

  3.  **Penrose Argument (Serious Essay):** *The essay engages deeply with Penrose's argument that Gödel's theorems show human mathematicians can grasp the truth of statements unprovable within any fixed formal system, demonstrating that human mathematical insight is non-algorithmic.*
      *   Step 1: Yes (invoked re: limits of computation / nature of mind).
      *   Step 2: Yes (applies to "human mathematical insight," "mind").
      *   Step 4: *Accuracy Check:* The essay will undoubtedly describe the theorems accurately (consistent formal systems, arithmetic, true unprovable, consistency unprovable). **Accurate Enough.**
      *   Step 5: *Acknowledge Gap?* A serious essay on Penrose *is* the acknowledgment. It presents it *as* Penrose's argument/interpretation. **Terminate: Escalate to Editor - Philosophical Judgment.** The fact-checker's job is done; the math is correct. Whether Penrose's *interpretation* is valid, compelling, or worth platforming is entirely the editor's decision. **Editor's Note:** Yes, the procedure flags this for your judgment, not rejection. It passes the technical check. Running it means accepting you'll publish contested interpretations.

  **Final Recommendation:** This procedure empowers fact-checkers to catch egregious misstatements (Case 1) and demand critical clarifications in common over-extensions (Case 2). It forces authors to either stay within the math or explicitly frame their interpretations. For nuanced cases like Penrose (Case 3), it correctly elevates the decision. Its weakest points are judging "sufficient accuracy" (Step 4) and "sufficient gap acknowledgment" (Step 5) – invest in brief, clear training examples for these. Consistency will be strongest on clear factual errors (Step 4 failures) and weakest on borderline Step 5 judgments. **This procedure won't eliminate all possible misuse, but it will drastically reduce mathematically indefensible claims and force greater intellectual honesty in invoking Gödel.**
