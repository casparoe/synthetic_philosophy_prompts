prompt: |-
  I'm a software engineer, no philosophy background, but I keep bumping into metaethics arguments online and the expressivism one finally clicked for me in programmer terms: moral claims are like statements with side effects rather than expressions that evaluate to values. Saying "lying is wrong" is more like print-shaming someone than like returning a boolean. Restate the Frege-Geach problem for expressivism in the vocabulary I actually use -- expressions vs statements, side effects, evaluation order, lazy evaluation, macros vs functions, and how a compiler or interpreter gives an AST node its meaning compositionally from its children. As I understand it, the problem is that these non-truth-claiming things get embedded in conditionals and arguments, e.g. if lying is wrong, then getting your little brother to lie is wrong, and the compound's meaning is supposed to be built out of the parts' meanings. Translate the whole problem into my terms as faithfully as you can, then give me the residue report: which parts of the philosophical debate map cleanly onto how real languages embed side-effectful statements (or fail to), which parts I'm implicitly distorting by using the compiler metaphor, and which parts have no counterpart in my vocabulary at all. And tell me whether that residue is my vocabulary missing something or the philosophers' problem being fuzzier than it looks. For the record my hunch is it's all just lazy evaluation, but I suspect that hunch is exactly the kind of thing that's missing something.
reasoning: |-
  We are going to translate the Frege-Geach problem into programming language terms, as requested.

  First, let's set up the expressivist view in programming terms:

  - Expressivism: Moral claims (e.g., "lying is wrong") are not like functions that return a boolean (i.e., they are not truth-apt). Instead, they are more like statements that have side effects. For example, saying "lying is wrong" is like executing a function `condemn(lying)` that has the side effect of expressing disapproval.

  Now, the Frege-Geach problem points out that moral claims can be embedded in more complex linguistic structures, such as conditionals, negations, and arguments. The challenge for expressivism is to explain how these embeddings work, given that the meaning of the complex expression must be composed from the meanings of its parts.

  In programming terms, we can think of:

  - **Simple moral assertion**: `assert "lying is wrong";` → This would be like a function call with side effects: `condemn("lying")`.

  But what about embeddings?

  Example 1: **Conditional**
  - "If lying is wrong, then getting your little brother to lie is wrong."
    - In programming, we might write: `if (lyingIsWrong) { condemn(gettingBrotherToLie); }`

  But in expressivism, `lyingIsWrong` isn't a boolean expression that can be evaluated to true or false. It's a side-effecting statement. So how can we put it in the condition of an `if`?

  Example 2: **Negation**
  - "Lying is not wrong." 
    - How do we express this? If `condemn(lying)` is the positive version, then is the negation something like `refrain_from_condemning(lying)`? Or `approve(lying)`? But that seems to change the meaning.

  Example 3: **Argument**
  - Premise 1: Lying is wrong.
  - Premise 2: If lying is wrong, then getting your little brother to lie is wrong.
  - Conclusion: Therefore, getting your little brother to lie is wrong.

  In logic, we have modus ponens. But in expressivism, Premise 1 is a side effect (condemning lying), Premise 2 is a conditional that doesn't seem to have a truth value, and the conclusion is another side effect. How does the argument work?

  Now, let's break down the problem using programming concepts:

  1. **Expressions vs. Statements**:
     - In programming, expressions evaluate to a value and can have side effects (like `x++`). Statements are executed for their side effects and do not return a value (like `print("hello")`).
     - Expressivism says moral claims are like statements (side effects) and not expressions (returning truth values).

  2. **Embedding in Conditionals**:
     - In a conditional `if (condition) { ... }`, the `condition` must be an expression that evaluates to a boolean. But if moral claims are statements, they cannot appear in the condition. So how do we handle `if (lying is wrong) ...`?

     Possible workarounds:
     - **Lazy evaluation**: We could think of the condition as a function that, when called, performs the side effect and then returns a boolean? But that's not how conditionals typically work. Also, what boolean would it return? Expressivism doesn't assign truth values.

     - **Macros**: We might treat the moral claim as a macro that expands. For example, the entire conditional could be a macro that expands to a function that first does the condemnation and then ... but then what? This becomes messy.

  3. **Compositionality**:
     - The meaning of a complex expression is built from the meanings of its parts. In a compiler, the Abstract Syntax Tree (AST) node for a conditional has children: the condition, the then-branch, and the else-branch. The meaning of the conditional is built by combining the meanings of these children.
     - But if the condition is a side-effecting statement, how do we combine? The condition part doesn't have a value to pass to the conditional node.

  4. **Lazy Evaluation**:
     - Your hunch: maybe it's lazy evaluation. The idea is that the condition in the conditional is not evaluated until needed. But even with lazy evaluation, the condition must eventually produce a boolean. Expressivism doesn't provide that.

  Now, let's map the Frege-Geach problem to programming:

  - **The Problem of Embedding**: How can we embed a statement (with side effects) in a context that expects an expression (like a condition)? We cannot, without changing the nature of the statement.

  - **The Problem of Compositionality**: The meaning of the whole (the conditional) is not composed from the meanings of the parts because the part (the moral claim) does not have a value to contribute.

  - **The Problem of Logical Inference**: In the argument above, we want to use modus ponens. But modus ponens requires that the premises are truth-apt (they can be true or false). If the premises are not truth-apt, then the inference doesn't go through.

  Now, let's give the residue report:

  **Which parts map cleanly?**
  - The idea that moral claims are like side effects (statements) rather than expressions that return a boolean is a clean mapping. This captures the expressivist idea that they are used to express attitudes, not to state facts.

  - The problem of embedding in conditionals and other complex structures is also clean: in programming, we cannot put a statement (like a print) in a condition without wrapping it in a function that returns a boolean, but that would change its nature.

  **Which parts are distorted by the compiler metaphor?**
  - **Truth and Falsity**: In programming, we have booleans for conditionals. In philosophy, truth is a more complex concept. But the metaphor captures the idea that conditionals require something that can be true or false.

  - **Compositionality**: The compiler metaphor is very strong on compositionality (the meaning of the whole is built from the meaning of the parts). This is exactly the problem for expressivism: how to compose when the parts don't have the right kind of meaning.

  - **Inference**: The modus ponens argument has a direct counterpart in programming: we can write functions that take booleans and perform operations. But without booleans, we can't do that.

  **Which parts have no counterpart?**
  - **The Normative Force of Logic**: In philosophy, one might argue that logical inferences are normative (we ought to accept modus ponens). This normative aspect doesn't have a direct programming counterpart.

  - **The Nature of Moral Disagreement**: When two people disagree on a moral claim, what are they doing? In programming, we don't have a direct analogue for disagreement about side effects.

  - **The Possibility of Alternative Semantics**: Philosophers have proposed various solutions (e.g., Blackburn's quasi-realism, Gibbard's norm-expressivism) that try to give a compositional semantics for moral language without truth-aptness. These don't have straightforward programming analogues.

  **Is the residue due to missing vocabulary or philosophical fuzziness?**
  - Some of the residue is because programming languages are designed to be unambiguous and compositional, while natural language is more flexible. So the problem might be that natural language allows embeddings that the expressivist, in their programming-like model, cannot account for.

  - The residue about normative force and moral disagreement might be due to the metaphor missing aspects of human communication and reasoning that are not computational.

  - However, the core of the Frege-Geach problem is about compositionality and logic, and these are very much computational. So the metaphor is revealing a real challenge.

  **Your hunch about lazy evaluation**: 
  Lazy evaluation delays the evaluation of an expression until it is needed. But the problem is that the condition in a conditional must still be an expression that can be evaluated to a boolean. Expressivism doesn't give us that. So lazy evaluation doesn't solve the problem by itself. We would need to reinterpret moral claims as expressions that return booleans, but then we are no longer doing expressivism.

  **Conclusion**:
  The programming metaphor is powerful and reveals the core of the Frege-Geach problem: how to handle embeddings in a compositional semantics when the embedded part is not truth-apt. The residue (normative force, moral disagreement) might be due to the metaphor being too narrow, but the central problem is well-captured. The distortion is minimal for the logical structure, but the metaphor cannot capture the full richness of moral language and reasoning.

  So, the problem is real and your metaphor is highlighting it accurately. The solution might require a more sophisticated programming analogy (like using continuations or monads to handle side effects in a compositional way), but that's beyond the simple statement/expression distinction.
answer: |-
  ### Restating the Frege-Geach Problem in Programmer Terms  
  Your analogy is spot-on: **expressivism treats moral claims as side-effecting statements (like `print("shame")`) rather than pure expressions evaluating to booleans**. Let's translate the Frege-Geach problem using your vocabulary, then dissect the residue.

  ---

  ### Core Analogy  
  - **Moral claim**: `"lying is wrong"` → A statement with side effects: `condemn("lying")` (emits disapproval, no return value).  
  - **Factual claim**: `"water is H₂O"` → A pure expression: `is_water_h2o()` (evaluates to `true`/`false`).  

  **The Frege-Geach problem**: How do we handle moral claims when embedded in **complex structures** (conditionals, logical operations) if they’re side effects?  

  ---

  ### Problem Case: The Conditional  
  **Philosophical example**:  
  > "If lying is wrong, then getting your little brother to lie is wrong."  

  **In programmer terms**:  
  ```python  
  if condemn("lying"):  # Side effect in condition?  
      condemn("getting_brother_to_lie")  
  ```  

  #### Why This Breaks:  
  1. **Evaluation order**:  
     - Conditionals (`if`) expect a **boolean expression** (e.g., `x > 5`).  
     - `condemn("lying")` is a **statement with side effects** (like `print(...)`). It has no return value → can’t be used in a condition.  

  2. **Compositionality**:  
     - Compilers/interpreter derive an AST node’s meaning from its children:  
       ```  
          [if]  
            / | \  
       [cond] [then] [else]  
       ```  
     - If `[cond]` is a side effect (not a value), how does `[if]` compute its meaning?  
     - Real languages: Conditions **must** be expressions (e.g., `1 + 2` is valid; `print("foo")` is invalid in C/Java/Python conditionals).  

  3. **Lazy evaluation doesn’t save you**:  
     - Even with lazy eval (e.g., Haskell), the condition must **eventually reduce to a boolean**.  
     - `condemn("lying")` doesn’t reduce to `true`/`false`—it **performs an action**.  

  ---

  ### Key Embedding Challenges  
  | Philosophical Embedding | Programming Equivalent          | Problem                                                                 |  
  |-------------------------|---------------------------------|-------------------------------------------------------------------------|  
  | **Conditionals**        | `if (condemn(X)) { ... }`       | Side effect in condition → compiler error.                              |  
  | **Negation**            | `!condemn("lying")`             | Negating a side effect? (`!print(...)` is nonsense).                    |  
  | **Logical argument**    | `P1: condemn(A)`<br>`P2: if A then condemn(B)`<br>`∴ condemn(B)` | Premises aren’t truth-apt → can’t use modus ponens. |  

  ---

  ### Residue Report: What Maps, What Distorts, What’s Missing  
  #### ✅ What Maps Cleanly  
  1. **Side effects vs. expressions**:  
     - Moral claims as side effects ≈ `print(...)`/`throw MoralError()`.  
     - Factual claims as expressions ≈ `5 + 3` → `8`.  
  2. **Compositionality**:  
     - Compilers require children nodes to supply compatible types → mirrors philosophy’s "meaning compositionality" problem.  
  3. **Embedding failures**:  
     - Putting `condemn(X)` in a condition → type error in static languages (e.g., Java).  
     - Philosophy’s "embedding problem" is identical.  

  #### ⚠️ What’s Distorted by the Compiler Metaphor  
  1. **Lazy evaluation**:  
     - Your hunch ("it’s all lazy eval") **almost works but fails at semantics**.  
     - Lazy eval delays computation, but **doesn’t convert side effects to booleans**. E.g., Haskell’s `IO Bool` is still a side-effecting action, not a pure bool.  
     - Distortion: Lazy eval handles *when* things run, not *what they mean*.  
  2. **Macros**:  
     - Macros (e.g., Lisp) **rewrite code pre-evaluation**. You could macro-expand `if condemn(X)` → `condemn(X); if (true) ...`, but:  
       - This **ignores the conditional’s intent** (e.g., "if lying is wrong..." isn’t a command to condemn lying).  
       - Philosophy’s challenge is **semantic**, not syntactic.  

  #### ❌ What Has No Counterpart  
  1. **Normative force in logic**:  
     - In programming, `if (A) B` has no "ought" → it just executes. Philosophy needs `if "lying is wrong"` to imply **reasons for action**. No `goto ought_to_condemn_brother`.  
  2. **Truth-aptness debates**:  
     - Programming: Expressions are value-apt (return values), statements aren’t. Philosophy agonizes over whether moral claims *could* be truth-apt.  
  3. **Attitudes vs. side effects**:  
     - `condemn(X)` is a crude analog for "expressing disapproval." Real attitudes are **dispositional** (e.g., "would condemn in all contexts?"). No `condemn(X, context)` in ASTs.  

  ---

  ### Is the Residue Your Vocabulary’s Fault or Philosophy’s Fuzziness?  
  - **Your vocabulary is missing very little**. The compiler metaphor exposes the core problem: **side effects don’t compose logically**.  
  - **Philosophers legitimately grapple with gaps** your model highlights:  
    - How can "if lying is wrong..." convey *logical inference* if moral claims aren’t truth-apt?  
    - Can we build a "moral language" with its own logic? (E.g., like a DSL for side effects?).  
  - **Where philosophy is fuzzier**:  
    - Debates about "cognitivism vs. non-cognitivism" often conflate **semantics** (what moral claims *mean*) with **psychology** (what they *do*). Your model forces clarity: side effects ≠ values.  

  ---

  ### Conclusion  
  Your intuition that **moral claims are side-effecting statements** perfectly captures expressivism’s core. The Frege-Geach problem is fundamentally a **compositionality error**—like using `print(...)` in an `if` condition. Lazy evaluation/macros don’t resolve it because the issue is **semantic** (what the claim *contributes* to the whole), not operational (when it runs).  

  The residue (normative force, attitude complexity) reflects **genuine gaps in the programming metaphor**, but these gaps highlight why philosophers struggle: they’re trying to force moral claims into a logical framework they don’t natively fit. Your metaphor doesn’t miss much—it surgically exposes the problem.  

  > **Key insight**: Expressivism’s challenge isn’t about evaluation strategy—it’s about **type compatibility**. Moral claims are `void` functions in a world that demands `bool`.
