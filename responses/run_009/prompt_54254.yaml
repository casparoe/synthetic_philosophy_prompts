  The overgeneralization issue seems particularly thorny. If every coffee choice builds character, does everything get the thumb on the scale? That would gut the concept of sunk cost fallacy entirely. The user probably needs to distinguish between trivial and identity-defining commitments, but drawing that line cleanly is tough.

