answer: |-
  Right, you've opened with the classic objection, and while Banach-Tarski is startling, your conclusion fundamentally misunderstands the nature of mathematical existence and the purpose of axioms. The paradox doesn't expose a contradiction *within* the formal system ZFC; it reveals a profound disconnect between our intuitive geometric notion of 'volume' and the set-theoretic reality under AC. Conceding that the pieces are non-measurable isn't a sneaky dodge – it's the precise mathematical point! Measure theory, built *using* AC, itself proves these sets *cannot* be assigned a consistent Lebesgue measure. This demonstrates the limitations of the Lebesgue measure's domain, not a flaw in AC. To claim AC "generates a theory that cannot be about anything" is to demand mathematics conform to a naive physicalism it never promised. Countable choice or determinacy cripples vast swathes of essential mathematics – functional analysis, point-set topology, modern algebra – where AC provides elegant, powerful existence proofs that mathematicians rely on daily. If measure theory conflicts with AC, it is our formalisation of 'volume' that requires refinement or contextual understanding, not the axiom that empowers so much productive mathematics. Banach-Tarski shocks our Euclidean intuition, but intuition is not truth.

  *(Stands firm, ready for your rebuttal. The gauntlet is thrown regarding mathematical ontology and the cost of abandoning full AC.)*
