prompt: |-
  My rationalist meetup has this running bit: we treat our friend Dana's judgments about democratic backsliding like a weather service. She's followed this stuff obsessively since the 2010s, and she's annoyingly consistant, but if you ask her for her actual criteria she just waves you off — "I know it when I see it," which offends all of us on principle. So we've started a prediction registry: whenever a new case comes up (some country in the news, or a hypothetical one of us cooks up), we each write down what Dana will say and why, and the person whose model of her is closest buys the next round. I'm currently leading and intend to stay ahead.

  Her track record, compressed: the Hungary-type case, where an elected government gradually stacked the media regulator and the constitutional court while keeping the opposition on a ballot it could never win — backsliding, yes. Turkey — yes, obviously. Poland — yes, though she took her time and only committed after the second round of fighting over the courts. The military coup that ran the country for two years, held elections, and went back to barracks — firm no, "that's a coup, different box." The US-shaped case — also a no: attempts to contest results and mess with courts that all failed and left nothing stuck, she called it constitutional hardball, a stress test the system passed. And a case where gerrymandering gave one party a structural edge but the press was free, the courts were fine, and the opposition did occasionally win anyway — no on that one too; her gloss was "tilt without capture, and it doesn't change who can win."

  The new case, which is hypothetical, comes from our group's resident GM: a mid-sized country where a populist party wins a legal supermajority, rewrites the constitution, and uses it to entrench. Core policies get locked behind supermajority amendment rules, and a stack of new agencies gets nine-year staggered boards that the current majority staffs, so the next government can't touch them. Courts stay fully independent, the press stays fully free, elections stay genuinely competitive — in fact the incumbent loses the capital and several provinces mid-stream and hands them over without a fuss. But whoever wins the next national election inherits a state where most of the levers are held by the other side's appointees and half the agenda is constitutionally off the table. Dana's verdict is due Tuesday.

  What should I predict? Honestly I care less about the yes/no than about which rule she's running under the hood. I can see at least three that fit her whole track record — referee capture, playing-field tilt, and something like entrenchment-so-that-losing-doesn't-cost-the-incumbents-anything — and as far as I can tell they come apart on this one. Give me your best guess with your reasons, lay out which candidate rules survive and which die if she rules either way, and, since the registry also pays out on discriminating cases, tell me what further case would most cleanly split the surviving rules so I can pitch it to the GM for next session.
reasoning: |-
  Okay, the user is part of a rationalist meetup group that's modeling their friend Dana's judgments on democratic backsliding. They're essentially treating her like a weather service and have a prediction registry where they guess her verdicts on different cases. The user is currently leading and wants to stay ahead. The new case is a hypothetical one from their resident GM, and they need to predict Dana's verdict. But more importantly, they want to understand the underlying rule Dana uses since she won't articulate it clearly.

  First, I need to recap Dana's past judgments to identify patterns. She said "yes" to backsliding in Hungary (gradual stacking of media and courts, opposition can't win), Turkey, and Poland (after court fights). But she said "no" to a military coup that returned to barracks, the US case (failed attempts to contest results), and gerrymandering with free press and courts where opposition still wins ("tilt without capture").

  The hypothetical case involves a populist party winning a supermajority, rewriting the constitution to entrench policies and create staggered boards for new agencies. Courts, press, and elections remain free and competitive. The incumbent loses some areas and hands over power, but the next government can't change entrenched policies or agencies. 

  Dana's possible rules seem to be: referee capture (controlling key institutions), playing-field tilt (systemic advantage but opposition can still win), or entrenchment (making loss not costly). The user needs to know which rule Dana uses and how this case tests them.

  Looking at the cases, Dana's "no" in the US and gerrymandering cases suggests that if attempts fail or the opposition can still win, it's not backsliding. In Hungary, Poland, Turkey, capture led to opposition being unable to win. The coup was a clear no because it's a different category. 

  In this hypothetical, even though the opposition wins elections, they can't change key policies or control agencies. That sounds like entrenchment. But Dana might see it differently because the entrenchment happened legally via supermajority, and the incumbent handed over power peacefully. 

  I think Dana's core rule is about whether the opposition can meaningfully compete and govern if they win. In Hungary, they couldn't win or govern effectively. Here, they can win elections but not govern fully because policies are locked and agencies are controlled by the other side. That might tip it to "yes" for backsliding. 

  The user also wants a future case to split the surviving rules. If Dana says "yes" here, entrenchment is key. If "no," maybe it's about overt capture. A future case could involve entrenchment without capture, like independent agencies not controlled by any party, to see if that changes her verdict.
answer: |-
  Based on Dana's track record and the logic implied by her past judgments, here's the breakdown, prediction, and strategic next steps for your registry:

  ### Prediction for the Hypothetical Case: **Dana will say "YES" (Democratic Backsliding)**

  **Why?**  
  Dana’s core rule appears to be: **"Democratic backsliding occurs when incumbents *systematically undermine the opposition’s capacity to govern effectively* after losing an election."** This focuses on whether losers can still *exercise meaningful power* post-defeat.  

  ### How This Rule Explains Her Track Record:
  1. **Hungary/Turkey/Poland (YES):**  
     Incumbents captured referees (courts/media), making it impossible for the opposition to *govern* effectively even if they won elections. Losses became functionally irrelevant.  
  2. **Military Coup (NO):**  
     A temporary suspension, not a *systematic entrenchment* against future electoral losses. Power reverted neutrally.  
  3. **US Case (NO):**  
     Failed attempts didn’t stick; opposition could still govern fully after winning.  
  4. **Gerrymandering Case (NO):**  
     "Tilt without capture" – opposition could still win *and* govern (courts/press functional, policies reversible).  

  ### Why the Hypothetical Case Triggers a "YES":
  - **Entrenchment = Loss-Proofing:**  
    The supermajority locks policies and agencies *specifically to neuter future governments*. Even if the opposition wins, they **cannot** reverse core policies or control key state functions. This mirrors Hungary (constitutional court stacking) but via "legal" channels.  
  - **Competitive Elections ≠ Meaningful Power:**  
    Dana cares about *governing capacity*, not just winning elections. Handing over symbolic power (provinces/capital) while retaining veto points via captured agencies is **precisely "losing without costing incumbents anything"** – her implied red line.  
  - **"I Know It When I See It" Nuance:**  
    The *staggered boards* and *supermajority locks* are institutional "ratchets" ensuring permanent minority control – a hallmark of backsliding in her prior "yes" cases.  

  ---

  ### How Candidate Rules Survive or Die Based on This Verdict:
  | Candidate Rule                      | If Dana Says **YES** (Predicted) | If Dana Says **NO** (Less Likely) |
  |-------------------------------------|----------------------------------|-----------------------------------|
  | **Referee Capture** (courts/media)  | ❌ Dies (courts/press free here) | ✅ Survives                       |
  | **Playing-Field Tilt** (e.g., gerrymandering) | ❌ Dies (opposition won provinces) | ✅ Survives                       |
  | **Entrenchment/Loss-Proofing**      | ✅ **Survives**                  | ❌ Dies                           |

  ### Why Entrenchment Wins Out:
  - **Fits all "yes" cases:** Hungary/Poland/Turkey entrenched power via captured institutions.  
  - **Explains "no" cases:** Coup was episodic; US/gerrymandering lacked enduring entrenchment.  
  - **Hypothetical is entrenchment perfected:** Legal, procedural, and designed explicitly to make electoral loss inconsequential for policy control.  

  ---

  ### Discriminating Case to Split Surviving Rules:  
  **Pitch this to your GM:**  
  > *"A party wins a normal majority, passes a law granting all regulatory agencies 10-year staggered terms filled by non-partisan experts (e.g., judges, academics). Next election, the opposition wins but cannot fire/replace these experts. Policies remain reversible by simple majority, and courts/press stay independent. Does Dana call this backsliding?"*  

  **Why This Splits Entrenchment vs. Capture:**  
  - **If Dana says NO:** Her rule is **strictly about partisan entrenchment** (tying agencies to a *specific party*). Neutral experts aren’t "captured."  
  - **If Dana says YES:** Her rule is broader: **any insulation from democratic accountability** (even neutral) constitutes backsliding.  

  This forces her "I know it when I see it" intuition to reveal whether *neutrality* or *partisan control* is the core evil.  

  ### Your Strategic Edge:
  - You’re predicting **YES** based on **entrenchment-as-loss-proofing**.  
  - If correct, you’ve invalidated "referee capture" and "tilt" as sufficient criteria.  
  - The discriminating case above sets up a win-win:  
    - If Dana says **NO**, it confirms entrenchment requires *partisan* control.  
    - If she says **YES**, you expose a broader "anti-accountability" principle.  

  **Final Tip:** Frame your submission as:  
  *"Dana will say YES because incumbents rewrote rules to ensure they *never lose power* – even after losing elections. Opposition wins are hollow when the state’s core is held hostage."*  
  This mirrors her "different box" language and elevates *governing capacity* over electoral competition.  

  Good luck – and enjoy that next round.
