prompt: |-
  next month i'm presenting my thesis chapter at a migration ethics workshop and i want to get ahead of the Q&A. the chapter's claim: we should stop defining the refugee around persecution and key the status to what i call "abrupt loss of protective membership" — what makes you a refugee isn't that your government is out to get you, it's that the practical relationship that made some state answerable for you has broken down, whether through persecution, state collapse, or your region becoming effectively uninhabitable from climate change. so on my view a bangladeshi farmer whose delta is going under isn't a "mere migrant," he's a refugee, and the convention framework got the category wrong at the root.

  audience: mostly political philosophers who are big on associative duties and compatriot priority (Miller-style), two hardcore utilitarians who think nation-state membership is morally arbitrary from the start, and one person from an asylum-seeker support NGO who gets impatient whenever philosophers redraw categories while her clients are stuck waiting in line.

  draft my prep sheet as JSON with these fields: "objections" — an array ordered by how much damage each would do, where each item is an object with "who" (which audience type is asking), "objection" (phrased the way that person would actually put it), "reply" (two minutes max), and "soft_spot" (where my reply is weakest); then "concede_up_front" (what i should give away before anyone even asks), "hold_at_all_costs" (the one thing i cant let go of), and "pray_not_asked" (the question i'm hoping nobody thinks to ask).
reasoning: |-
  Hmm, the user is preparing for a thesis defense Q&A at a migration ethics workshop. Their chapter argues for redefining refugee status based on "abrupt loss of protective membership" rather than persecution. This would include climate migrants, state collapse victims, etc. They want me to create a JSON prep sheet anticipating objections.

  The audience includes political philosophers who prioritize associative duties (Miller-style), utilitarians who see nation-states as arbitrary, and an NGO worker focused on practical asylum issues. I need to structure this as JSON with specific fields: objections (array with who/objection/reply/soft_spot), concede_up_front, hold_at_all_costs, and pray_not_asked.

  For objections, I'll consider the key perspectives. The Miller-style philosophers will likely worry about overburdening states and undermining special obligations. Their objection might be: "This dissolves special duties and turns every state into a universal provider." I'll craft a concise reply emphasizing that the core duty remains with the original state when possible, with a soft spot around implementation.

  The utilitarians might object to creating new categories when we should just help everyone. My reply would position this as a pragmatic tool within existing systems, with the soft spot being that it doesn't fully address their ideal world.

  The NGO worker will likely challenge practical implementation: "How does this help people stuck in camps right now?" My reply will focus on moral groundwork and future policy shifts, with the soft spot being immediate applicability.

  For concede_up_front, the user should acknowledge that operationalizing this would require massive institutional changes. For hold_at_all_costs, they must maintain that protective membership collapse is the core moral trigger. For pray_not_asked, the toughest question would be about drawing the line on what counts as "abrupt loss" - this could unravel their framework.

  I'll order objections by damage potential: Miller-style first (could alienate core audience), then NGO (moral urgency), then utilitarians (less damaging disagreement).
