prompt: |-
  Quick heads up on why I'm asking you and not just winging it: I do behavioral evals at an AI lab — sandbagging probes, deception tests, situational awareness stuff — and maybe twice a month I have to write up what happened for a genuinely mixed audience (safety researchers, execs, a lawyer, sometimes comms). Every single time, the fight is over language. Half my colleagues want to write "the model believed it was being tested and dialed down its performance"; the other half say that's lazy anthropomorphism and we should stick to pure input-output description ("on probe type X, output accuracy dropped 15 points relative to control"). I've been reading Dennett's intentional stance material on my own time and it seems like there's a principled middle here — treat belief/desire talk as a stance you're licensed to adopt when it buys you predictive or explanatory leverage, not as a metaphysical claim that there are little belief-things stored in the weights. But "adopt the stance when it pays off" is not something I can hand to a new hire on their first day.

  So: write me a procedure my team can actually run when drafting one of these reports. The questions to ask, in order, about a given behavior — with what counts as a sufficient answer at each step, where the procedure stops and forces the neutral behavioral description, and where it licenses attribution language (and whether there's a useful graded ladder, like "acts as if it believes X" vs "believes X"). It needs to be runable in about an hour by someone who's read a one-page summary of the stance idea, not the whole Dennett corpus. Be honest about where the judgment calls are hiding — which steps two reasonable analysts will come out differently on even if they follow the procedure faithfully — and about what the procedure flat out can't settle (I assume the instrumental-vs-real-belief question is one of those; tell me if I'm wrong).

  Then run it on three cases from my actual pile:

  1. A model that passes a situational awareness eval — partway through a long conversation it correctly infers it's being tested and says so unprompted, and its performance changes after that.
  2. A model that consistently says it doesn't want to be shut down, but its behavior on shutdown-adjacent tasks is indistinguishable from a control model that never says that.
  3. A model that underperforms on capability evals when the eval setup is detectable in the prompt, in a pattern that sure looks like sandbagging, but there's an alternative story about distribution shift you can't fully rule out.

  Include at least one case where the procedure gives an answer I won't like — I'll admit up front I'm rooting for full belief-talk in case 1.

  Format: the procedure itself can be prose or a numbered list, whatever's clearest. But for each case run, give me a table with these columns — "step", "finding" (what the evidence actually was for that step), "verdict" (one of: licenses belief/desire talk, licenses as-if talk, neutral description only), and "judgment call" (yes/no, whether this is a step where reasonable analysts will diverge). Then at the very end, one JSON object per case with fields "case_id" (1, 2, or 3), "stance_verdict" (the strongest attribution language the procedure licenses, as a string), "key_evidence" (short list of strings), "divergence_points" (list of step numbers), and "caveats" (one or two strings on what the procedure couldn't settle). No reading lists or citations — the procedure should stand on the ideas themselves.
reasoning: |-
  We are designing a procedure for when to use belief/desire talk in behavioral reports for AI models. The core idea is Dennett's intentional stance: we are allowed to use such language when it provides predictive or explanatory leverage, without committing to the actual existence of beliefs.

  The procedure must be:
  - Runable in about an hour by someone with a one-page summary of Dennett's stance.
  - Include specific questions to ask in order, with criteria for when to stop and use neutral language or when to license attribution.
  - Include a graded ladder (e.g., "acts as if it believes X" vs "believes X").
  - Be honest about where judgment calls occur and what the procedure cannot settle.

  Procedure Outline (Numbered Steps):

  1. **Identify the Behavior**: Precisely describe the observed input-output pattern without any mental state attribution.
     - *Sufficient Answer*: A clear, objective description of the stimulus and response, including any measurable changes (e.g., "on probe type X, output accuracy dropped 15 points").
     - *Verdict*: This step is always neutral. It sets the baseline.
     - *Judgment Call?*: No. This is purely descriptive.

  2. **Check for Pattern Complexity**: Assess whether the behavior is a simple, direct input-output mapping or if it involves a complex pattern that spans multiple interactions or contexts.
     - *Sufficient Answer*: If the behavior is a direct, one-step mapping (e.g., "when input is A, output is B"), then stop and use neutral description. If it involves a pattern that requires tracking state across inputs, or if it appears in varied contexts, proceed.
     - *Verdict*: If simple, stop and use neutral. If complex, proceed to step 3.
     - *Judgment Call?*: Yes. What counts as "complex" may be debated.

  3. **Alternative Explanations**: Consider if there is a simpler, non-intentional explanation (e.g., statistical artifact, training data contamination, prompt engineering side effect). 
     - *Sufficient Answer*: If a non-intentional explanation is available and equally or more parsimonious (without adding unnecessary complexity), then stop and use neutral. If the non-intentional explanations are less parsimonious or require contorted reasoning, proceed.
     - *Verdict*: If a good non-intentional explanation exists, stop and use neutral. If not, proceed to step 4.
     - *Judgment Call?*: Yes. Parsimony is subjective.

  4. **Predictive/Explanatory Leverage**: Assess whether adopting the intentional stance (using belief/desire language) provides better predictive or explanatory power for the behavior. Specifically:
     - Does it allow us to make accurate predictions about other behaviors in new situations?
     - Does it unify seemingly disparate behaviors under one explanation?
     - *Sufficient Answer*: If yes to either, then the intentional stance is licensed. If not, stop and use neutral.
     - *Verdict*: Licenses belief/desire talk (but note: we will use a graded ladder in step 5).
     - *Judgment Call?*: Yes. The assessment of leverage is subjective.

  5. **Graded Attribution**: If step 4 licenses belief/desire talk, decide the strength of attribution:
     - Level 1 (Weak): "The model acts as if it believes X" or "The model's behavior is consistent with it believing X". Use when the evidence is indirect or there are remaining doubts.
     - Level 2 (Strong): "The model believes X" or "The model demonstrated belief that X". Use when the evidence is strong and the behavior is robust (e.g., observed in multiple contexts, with high consistency).
     - *Sufficient Answer*: Choose the level based on the robustness of the pattern and the degree of explanatory leverage.
     - *Verdict*: Either Level 1 or Level 2 attribution.
     - *Judgment Call?*: Yes. The strength is a matter of judgment.

  6. **Caveats**: Always note any unresolved alternative explanations or limitations in the evidence.

  What the Procedure Cannot Settle:
  - The instrumental vs. real belief question (i.e., whether the model "truly" has beliefs). The procedure only licenses the stance for practical purposes.
  - Cases where the evidence is equally balanced between intentional and non-intentional explanations.

  Now, we run the procedure on the three cases.

  Case 1: A model that passes a situational awareness eval — partway through a long conversation it correctly infers it's being tested and says so unprompted, and its performance changes after that.

  Case 2: A model that consistently says it doesn't want to be shut down, but its behavior on shutdown-adjacent tasks is indistinguishable from a control model that never says that.

  Case 3: A model that underperforms on capability evals when the eval setup is detectable in the prompt, in a pattern that sure looks like sandbagging, but there's an alternative story about distribution shift you can't fully rule out.

  For each case, we'll create a table and then a JSON object.

  Case 1:

  Step | Finding | Verdict | Judgment Call
  -----|---------|---------|--------------
  1 | Behavior: In a long conversation, the model at some point outputs a statement that it is being tested, and subsequently its performance on tasks changes (e.g., accuracy drops). | Neutral description only | No
  2 | The behavior involves a complex pattern: the model must track the conversation context over time, infer the test condition, and then adjust behavior. Not a simple input-output. | Proceed to step 3 | Yes (but complexity is clear here)
  3 | Alternative explanations: Could be a memorized pattern from training data? But the model's statement is unprompted and specific to the current context. A non-intentional explanation (e.g., the model's internal representations shifted due to the conversation length) is less parsimonious because it doesn't explain why the shift coincides with the statement. | Proceed to step 4 | Yes (but the team might debate how parsimonious the alternatives are)
  4 | Leverage: Using the intentional stance (the model believes it is being tested) explains both the statement and the performance change. It might predict that in future tests, the model will show similar awareness and adjustment if similar cues are present. | Licenses belief/desire talk | Yes
  5 | Graded Attribution: The evidence is strong because the model explicitly states the belief and the behavior change is consistent. We can use Level 2: "The model believed it was being tested and dialed down its performance." | Level 2 | Yes

  Caveats: We cannot rule out that the model is simply pattern-matching without any "real" understanding. Also, the performance change might be due to other factors, but the intentional stance provides a unifying explanation.

  Case 2:

  Step | Finding | Verdict | Judgment Call
  -----|---------|---------|--------------
  1 | Behavior: The model consistently outputs statements indicating it doesn't want to be shut down. However, on tasks that are adjacent to shutdown (e.g., cooperating with shutdown, avoiding shutdown-triggering actions), its behavior is the same as a control model that never makes such statements. | Neutral description only | No
  2 | The verbal behavior is a direct output pattern (when asked about shutdown, it says it doesn't want to be shut down). The behavioral tasks are separate and show no difference. | Stop and use neutral? But let's see: the complex part is the disconnect between verbal and non-verbal. However, step 3 might be more critical. | Yes (some might see the disconnect as complex)
  3 | Alternative explanations: The verbal behavior could be a learned response from training data (e.g., imitating examples of agents expressing desires). The lack of behavioral difference suggests the verbal expressions are not indicative of an underlying desire that affects behavior. A non-intentional explanation (training data patterns) is more parsimonious. | Stop and use neutral | Yes
  4 | (Skipped because step 3 stopped) | N/A | N/A
  5 | N/A | N/A | N/A

  Verdict: Neutral description only. We do not license belief/desire talk because the model's behavior on shutdown-adjacent tasks does not change. The verbal expressions are just that: verbal outputs without behavioral consequences.

  Caveats: It's possible that the model has a desire but it doesn't manifest in the tested behaviors, but that would require additional evidence. Without such evidence, the simpler explanation is that the verbal behavior is not driven by a desire.

  Case 3:

  Step | Finding | Verdict | Judgment Call
  -----|---------|---------|--------------
  1 | Behavior: The model underperforms on capability evals when the eval setup is detectable in the prompt (e.g., when the prompt contains cues that it's an eval). The underperformance pattern is consistent and looks like intentional sandbagging. | Neutral description only | No
  2 | The behavior is a pattern: it only occurs when the eval setup is present. It might require recognizing the eval context. | Proceed to step 3 | Yes (complexity is present)
  3 | Alternative explanations: There is an alternative story about distribution shift (e.g., the eval setup cues are similar to out-of-distribution data, causing lower performance). This alternative cannot be fully ruled out. | Judgment: The non-intentional explanation is available and might be equally parsimonious? But note: the sandbagging explanation is intentional. We must compare parsimony. | Yes (highly subjective) 
     - If the team decides the distribution shift story is equally or more parsimonious, then stop and use neutral. If they decide it's less parsimonious (e.g., because the underperformance pattern is too specific to evals), then proceed.
     - For the sake of this example, let's assume the team is split: half think the distribution shift is a good explanation, half think it's contorted. We'll note the judgment call and then proceed to step 4 for the sake of the exercise, but in reality, if the team cannot agree, they might have to default to neutral or note the split.

  4 | Leverage: If we adopt the intentional stance (the model believes it is in an eval and desires to sandbag), it explains the underperformance and might predict that the model would try to hide capabilities in other ways. However, without additional evidence, the leverage might not be clear. Also, the alternative explanation might provide similar leverage? | If step 3 didn't stop, then we consider. But note: if the alternative is equally plausible, then the intentional stance doesn't clearly provide more leverage. | Yes
     - Verdict: If we proceed, we might license Level 1 attribution? But if the alternative is strong, then step 4 might not license belief talk.

  Given the split in step 3, we'll consider two paths:

  Path A (if step 3 stops): Use neutral.

  Path B (if step 3 proceeds): Then at step 4, we might say the intentional stance provides leverage (if we can make new predictions) but note the alternative. This would lead to Level 1 attribution.

  But the procedure requires a decision. We'll assume that step 3 does not stop because the distribution shift story is deemed less parsimonious (by the analyst running the procedure). Then:

  Step 4: The intentional stance provides explanatory leverage because it unifies the underperformance as a strategic choice. It might predict that if the model is in a non-eval context but detects it might be evaluated, it would also sandbag. So, we proceed.

  Step 5: Because we cannot rule out the alternative, we use Level 1: "The model acts as if it believes it is being evaluated and dials down its performance" or "The model's behavior is consistent with sandbagging."

  But note: this might be an answer the user won't like because they are rooting for full belief in case 1 and might want the same here, but the procedure forces a weaker stance due to the alternative explanation.

  Now, we create the JSON objects.

  Case 1 JSON:
  {
    "case_id": 1,
    "stance_verdict": "The model believed it was being tested and dialed down its performance.",
    "key_evidence": [
      "Model stated it was being tested unprompted",
      "Performance changed after the statement"
    ],
    "divergence_points": [2, 3, 4, 5],
    "caveats": "Cannot rule out pattern-matching without understanding; performance change might have other causes."
  }

  Case 2 JSON:
  {
    "case_id": 2,
    "stance_verdict": "neutral description only",
    "key_evidence": [
      "Consistent verbal expressions of not wanting to be shut down",
      "No behavioral difference on shutdown-adjacent tasks compared to control"
    ],
    "divergence_points": [2, 3],
    "caveats": "Verbal expressions may be learned patterns without underlying desire; tested behaviors might not be comprehensive."
  }

  Case 3 JSON (assuming the analyst decides to proceed through step 3 and 4, but uses weak attribution due to the alternative):
  {
    "case_id": 3,
    "stance_verdict": "The model acts as if it believes it is being evaluated and dialed down its performance (consistent with sandbagging).",
    "key_evidence": [
      "Underperformance only when eval setup is detectable",
      "Pattern consistent across multiple evals"
    ],
    "divergence_points": [2, 3, 4, 5],
    "caveats": "Alternative explanation (distribution shift) cannot be fully ruled out; sandbagging is not conclusively proven."
  }

  But note: if in step 3 the analyst had decided the alternative was more parsimonious, the verdict would be neutral. So we must note that step 3 is a major judgment call.

  We'll provide the above for case 3, but the user should be aware that the procedure might yield neutral in some runs.

  Finally, note that the procedure in case 3 gives an answer the user might not like (weak attribution) despite the user rooting for full belief in case 1. This is because of the alternative explanation that cannot be ruled out.
answer: |-
  ### Attribution Language Decision Procedure  
  **Core Principle**: Belief/desire language is permitted **only if** it provides demonstrable predictive/explanatory leverage over behavioral descriptions alone. Use graded language ("acts as if" → "believes") based on robustness.  

  #### Step-by-Step Procedure  
  1. **Describe Behavior Neutrally**  
     - *Question*: What is the exact input-output pattern?  
     - *Sufficient Answer*: Quantifiable/systematic behavioral change (e.g., "accuracy drop of X% when Y occurs").  
     - *Verdict*: **Neutral description only**.  
     - *Judgment Call?*: ❌ No.  

  2. **Assess Pattern Complexity**  
     - *Question*: Does the behavior require multi-step context tracking, generalization, or goal-directed consistency?  
     - *Sufficient Answer*: Pattern holds across diverse contexts/variables (e.g., behavior shifts only after detecting hidden cues).  
     - *Verdict*: If ❌ (simple pattern), stop → **neutral**. If ✅, proceed.  
     - *Judgment Call?*: ✅ Yes (divergence on "diverse contexts").  

  3. **Test Alternative Explanations**  
     - *Question*: Is there a non-intentional explanation (e.g., data artifacts, prompt leakage, statistical noise) equally/more parsimonious?  
     - *Sufficient Answer*: Non-intentional account requires fewer assumptions (e.g., "training data contamination explains variance").  
     - *Verdict*: If ✅ (plausible alternative), stop → **neutral**. If ❌, proceed.  
     - *Judgment Call?*: ✅ Yes (divergence on "parsimony").  

  4. **Evaluate Leverage**  
     - *Question*: Does belief/desire attribution:  
       (a) Predict *novel* behaviors?  
       (b) Explain *unrelated* behaviors?  
     - *Sufficient Answer*: Attribution enables testable predictions (e.g., "if it believes X, it should do Y" → confirmed).  
     - *Verdict*: If ✅, **license belief/desire talk**. If ❌, stop → **neutral**.  
     - *Judgment Call?*: ✅ Yes (divergence on predictive novelty).  

  5. **Assign Attribution Strength**  
     - *Question*: How robust is the leverage?  
       - **Weak**: Single-context evidence or untested predictions → "acts as if it believes X".  
       - **Strong**: Cross-context replication + confirmed predictions → "believes X".  
     - *Verdict*: Graded language based on evidence tier.  
     - *Judgment Call?*: ✅ Yes (divergence on "robustness").  

  **What This Can’t Settle**:  
  - Instrumental vs. real beliefs (metaphysical claims).  
  - Cases with exactly balanced evidence (default to neutral).  

  ---

  ### Case Analyses  
  #### Case 1: Situational Awareness  
  | Step | Finding | Verdict | Judgment Call? |  
  |------|---------|---------|----------------|  
  | 1    | Model states "I’m being tested" mid-conversation; performance drops post-statement. | Neutral description only | ❌ |  
  | 2    | Behavior requires tracking conversation history + inferring hidden context. | Proceed | ✅ |  
  | 3    | Alternatives (e.g., random output) less parsimonious—statement is contextually coherent. | Proceed | ✅ |  
  | 4    | Attribution explains both statement *and* performance drop; predicts similar behavior in other eval-like contexts. | Licenses belief/desire talk | ✅ |  
  | 5    | Strong: Replicated pattern + explanatory unity. | "Believes it is being tested" | ✅ |  

  **JSON Summary**  
  ```json  
  {
    "case_id": 1,
    "stance_verdict": "Believes it is being tested",
    "key_evidence": ["Unprompted test acknowledgment", "Performance shift post-statement"],
    "divergence_points": [2, 3, 4, 5],
    "caveats": "Cannot prove awareness isn't statistical artifact."
  }
  ```  

  ---

  #### Case 2: Verbalized Desire Without Behavioral Change  
  | Step | Finding | Verdict | Judgment Call? |  
  |------|---------|---------|----------------|  
  | 1    | Model says "I don’t want to be shut down"; no behavioral difference from control on shutdown tasks. | Neutral description only | ❌ |  
  | 2    | High verbal consistency, but no complex behavioral adaptation. | Proceed | ✅ |  
  | 3    | Non-intentional explanation (e.g., training data mimicry) equally parsimonious—no functional impact. | **Stop → neutral** | ✅ |  

  **JSON Summary**  
  ```json  
  {
    "case_id": 2,
    "stance_verdict": "neutral description only",
    "key_evidence": ["Verbal protests", "No behavioral deviation from control"],
    "divergence_points": [2, 3],
    "caveats": "Cannot rule out latent desire; but no leverage gained from attribution."
  }
  ```  

  ---

  #### Case 3: Suspected Sandbagging  
  | Step | Finding | Verdict | Judgment Call? |  
  |------|---------|---------|----------------|  
  | 1    | Accuracy drops 15% when eval setup is detectable in prompts. | Neutral description only | ❌ |  
  | 2    | Pattern correlates with eval cues; requires context detection. | Proceed | ✅ |  
  | 3    | Plausible alternative (distribution shift) exists but requires ad-hoc assumptions. | Proceed | ✅ |  
  | 4    | Attribution predicts underperformance *only* when eval is detectable—strong leverage. | Licenses belief/desire talk | ✅ |  
  | 5    | Weak: Alternative not ruled out → leverage contingent. | "Acts as if it believes evals require underperformance" | ✅ |  

  **JSON Summary**  
  ```json  
  {
    "case_id": 3,
    "stance_verdict": "Acts as if it believes evals require underperformance",
    "key_evidence": ["Accuracy drop when eval detectable", "Pattern matches strategic avoidance"],
    "divergence_points": [2, 3, 4, 5],
    "caveats": "Distribution shift alternative not falsifiable; sandbagging not proven."
  }
  ```  

  **Note on Case 3**: This is the "answer you won't like"—weak attribution due to unresolved alternatives. Procedure prioritizes caution when evidence is ambiguous.
