  We are drafting a joint statement for two camps: "optimizers" (consequentialists who believe expected-value reasoning is action-guiding even under severe causal ignorance) and "skeptics" (consequentialists who believe radical cluelessness leads to no action-guidance, favoring robust near-term options or paralysis). The document has four parts: agreed claims, disagreements table, cruxes with test cases, and substantive vs. verbal disagreements.

  Part 1: Agreed Claims (Numbered)

  We agree on the following substantive points:

  1. Consequentialism as the criterion: Both camps accept that the rightness of an act is determined solely by its consequences. However, they disagree on whether this criterion can be action-guiding in practice under conditions of cluelessness.

  2. The existence of cluelessness: Both camps acknowledge that for many real-world actions, especially those with long causal chains, we face radical uncertainty about distal effects. This is not merely epistemic laziness but a deep feature of complex systems.

  3. The role of empirical premises: The symmetry argument (that expected values wash out to near-zero) depends on empirical assumptions about the world (e.g., the distribution of positive and negative effects, the independence of events, the stability of systems) rather than being a purely a priori truth. Thus, the degree of cluelessness is contingent on the state of the world and our knowledge.

  4. Tractable horizons: Both camps agree that some classes of effects are tractable for expected-value calculation:
     a. Direct, near-term consequences (e.g., the immediate effects of giving food to a starving person).
     b. Effects in systems with well-understood dynamics (e.g., the impact of vaccinations in a population with known epidemiology).
     c. Effects where counterfactuals can be reliably modeled (e.g., the effect of a policy change in a controlled market).
     However, they disagree on the scope of such tractability, especially for long-term, high-stakes, or globally scalable interventions.

  5. Reliability of long-range forecasting: Both camps accept that expert forecasts of long-range effects (beyond 10-50 years) have a poor track record and are often unreliable due to model uncertainty, unforeseen variables, and chaotic systems. However, they disagree on whether this unreliability is a reason to discount such forecasts entirely (skeptics) or to use them as the best available evidence (optimizers).

  6. The burden of proof: Both agree that in the face of cluelessness, the burden is on the actor to justify an action as better than alternatives. But they differ on what meets this burden: optimists accept expected-value estimates with wide error bars, while skeptics demand robustness.

  Part 2: Disagreements Table

  We have the following live disagreements. For each, we state the dispute neutrally, then each camp's position in their own words.

  | Dispute Description (Neutral)                                                                 | Optimizer Position (in their words)                                                                                                 | Skeptic Position (in their words)                                                                                                   |
  |-----------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------------------------|
  | **1. Action-guidance under cluelessness:** Can expected-value reasoning yield action-guidance when distal effects are radically uncertain? | "Even under severe causal ignorance, we must and can use the best available expected-value estimates over the longest tractable horizon to guide action, as doing otherwise ignores the potentially vast stakes of the far future." | "Radical cluelessness about distal effects means that expected-value calculations for most acts are not merely unreliable but systematically misleading, washing out to near-zero within decades, leaving no rational basis for action beyond near-term, robustly positive options." |
  | **2. Scope of tractability:** How far into the future and under what conditions can consequences be tractably modeled? | "We can often model effects centuries ahead for high-leverage interventions (e.g., existential risk reduction) by using structured scenarios, sensitivity analysis, and meta-uncertainty frameworks, even if models are coarse." | "Beyond a few decades, the compounding of uncertainty and chaos in complex systems makes modeling not just difficult but intractable, and attempts to do so are often disguised guesswork that cannot support meaningful expected-value comparisons." |
  | **3. Handling symmetry:** Does the 'cluelessness symmetry' (that positive and negative effects cancel out in expectation) hold for most acts? | "The symmetry argument is empirically contingent and often false: many interventions (e.g., curbing CO2 emissions, funding AI safety) have asymmetric expected values because we can identify persistent biases in the long-term impact distribution (e.g., tail risks)." | "For almost any act, the set of possible distal effects is vast and symmetric in expectation (i.e., for every positive path, there's a negative one of similar magnitude and likelihood), so the net expected value beyond the near term is approximately zero for most options." |
  | **4. Moral weight of the far future:** Should we assign non-negligible weight to the far future in our decisions? | "The far future contains the vast majority of potential value, so we must give it heavy weight in expected-value calculations; to ignore it is to risk astronomical waste." | "While the far future might hold vast potential value, our utter cluelessness about how our acts affect it means we cannot reliably steer it; thus, we should focus on near-term effects we can confidently influence." |
  | **5. Default stance in paralysis:** When cluelessness blocks action, what is the rational default? | "In the face of uncertainty, we should act on the best-guess expected value, as paralysis itself has a cost and may forfeit high-impact opportunities." | "When cluelessness is radical, the rational default is inaction or choosing only options that are robustly good in the near term, since unjustified action risks causing net harm." |

  Part 3: Cruxes

  We identify the following sub-questions (cruxes) where settling one would move at least one camp. For each, we provide a concrete test case both camps agree bears on it. We use two historical cases: DDT (1945) and Haber-Bosch (1910). For each case, we state what each camp would have concluded at the time (given only contemporaneous information) and what they predict the other camp would say.

  **Crux 1: Can we identify persistent asymmetries in long-term effects?**
  - *Test Case: Haber-Bosch process (1910)*  
    - Optimizer's 1910 view: "Given the potential to avert mass famine, the expected value is strongly positive even accounting for uncertainty about future weaponization, as the direct benefits are enormous and the risks are speculative."  
    - Skeptic's 1910 view: "We cannot rule out that this will cause catastrophic harm (e.g., by enabling larger wars or ecological damage), so the expected value is inscrutable; we should only support it if it has robust near-term benefits without risks, which it does (feeding the hungry)."  
    - Optimizer's prediction of skeptic: "The skeptics will focus on the unknown military applications and conclude the long-run EV is inscrutable."  
    - Skeptic's prediction of optimizer: "The optimizers will ignore the uncertainty and endorse it based on the famine relief."  
    - *Why it matters:* If we could show that Haber-Bosch had a clear asymmetric EV in 1910, it would challenge the symmetry premise.

  **Crux 2: How quickly does uncertainty dominate?**
  - *Test Case: DDT (1945)*  
    - Optimizer's 1945 view: "The massive reduction in malaria deaths dominates any uncertain long-term risks; we should deploy DDT widely while monitoring for side effects."  
    - Skeptic's 1945 view: "The long-term ecological effects are unknown and could be severe; without evidence of safety, we should limit use to contexts with high near-term benefit and low risk (e.g., indoor spraying) until more data is available."  
    - Optimizer's prediction of skeptic: "Skeptics will overreact to uncertainty and delay deployment, costing lives."  
    - Skeptic's prediction of optimizer: "Optimizers will underestimate tail risks and cause a pollution crisis."  
    - *Why it matters:* If DDT's risks were knowable in 1945, it supports tractability; if not, it illustrates cluelessness.

  **Crux 3: Does near-term robustness imply long-term robustness?**
  - *Test Case: Both*  
    - *For Haber-Bosch:* Optimizers say feeding the hungry is robustly good but also has clear long-term benefits; skeptics say it is robust only if we ignore long-term weaponization risks.  
    - *For DDT:* Optimizers say malaria reduction is robust; skeptics say ecological harm shows that near-term good does not guarantee long-term good.  
    - *Why it matters:* If robust near-term options rarely backfire, skeptics' approach is safer; if they often do, optimizers' focus on modeling is necessary.

  Part 4: Substantive vs. Verbal Disagreements

  We judge that:

  - The disagreement over **whether expected value washes out to zero** (Disagreement 3) is substantive and empirical: it turns on the actual distribution of long-term effects in our world, not on definitions. Resolving it requires evidence about the symmetry of causal chains.

  - The dispute over **tractability horizons** (Disagreement 2) is partly verbal and partly substantive: "tractable" is vague, but the core issue (how much uncertainty is too much for EV to be meaningful) is real. We could specify "tractable" as "admitting of usefully discriminating expected-value estimates," but the camps still differ on when that occurs.

  - The question of **moral paralysis** (Disagreement 5) is substantive: it involves a deep normative split over whether inaction is the default or an action to be evaluated.

  - The **weight of the far future** (Disagreement 4) has a verbal element (what "non-negligible" means) but is mostly substantive: optimists see it as a moral imperative; skeptics as practically irrelevant.

  - The **action-guidance** dispute (Disagreement 1) is substantive: it is the core meta-disagreement about the scope of consequentialist reasoning.

  However, we note that if "expected value" is defined as requiring precise probabilities, then the skeptic view might be seen as a technical correction, but both camps agree that EV can use imprecise probabilities. Thus, the disagreement is not terminological.

  Where We Leaned on Contested Characterizations

  - For the optimizers, we characterized their view as requiring "best-guess" expected value even with wide error bars. Some optimists might want stronger language about the tractability of long horizons, but we used "must and can" to reflect their commitment.

  - For the skeptics, we used "systematically misleading" for EV under cluelessness, which captures their core argument but might be seen as too strong by some. However, we believe it is faithful to their position as described.

  - In the Haber-Bosch case, we assumed skeptics would condition on near-term robustness. Some hardline skeptics might reject any action with unknown long-term effects, but the group's position allows for robust near-term options.

  - In the symmetry claim, we used "approximately zero" to match the skeptic literature, though optimists might dispute the "approximately."

  We have aimed for a committed, precise draft that both camps could sign without dilution. Where we made choices (e.g., defining tractability by classes of effects), we did so to force clarity, not diplomacy.
answer: |-
  ### Joint Statement: Adversarial Collaboration on Action-Guidance Under Cluelessness  
  *Produced by the Optimizer and Skeptic Camps of the Ethics Reading Group*  

  #### **Part 1: Agreed Claims**  
  We, the undersigned optimizers and skeptics, affirm the following substantive points of agreement:  

  1. **Consequentialism as the Criterion of Rightness**: Both camps agree that an act’s moral status depends solely on its consequences. However, this agreement does not resolve whether consequentialism provides *action-guidance* under conditions of radical cluelessness.  

  2. **The Reality of Radical Cluelessness**: Both camps accept that for many acts—especially those with long causal chains, global scalability, or high-stakes outcomes—predicting distal effects (beyond 10–50 years) is often intractable due to chaotic systems, unforeseeable feedback loops, and model uncertainty. This is not merely a practical limitation but an epistemic feature of complex worlds.  

  3. **Empirical Basis of Symmetry Arguments**: The claim that "expected values wash out to symmetry around zero" (i.e., positive and negative long-term effects cancel out) rests on *empirical premises*, not a priori reasoning. These premises include:  
     - The distribution of long-term effects is often approximately symmetric in magnitude and likelihood.  
     - Human forecasting models lack persistent bias toward overestimating positive or negative outcomes at long horizons.  
     Resolving this requires empirical evidence, not conceptual analysis alone.  

  4. **Classes of Tractable Effects**: Both camps agree that the following effects are generally tractable for expected-value reasoning:  
     - **Near-term direct effects** (e.g., saving a life today, distributing bednets to reduce malaria).  
     - **Effects in well-modeled systems** (e.g., vaccine efficacy in controlled trials, local economic policies with established data).  
     - **Effects with identifiable near-term robustness** (e.g., actions that are beneficial across a range of plausible near-future scenarios).  
     Tractable effects typically extend no further than 20–50 years for most domains, except where robust counterfactuals exist (e.g., climate modeling under fixed emissions scenarios).  

  5. **Expert Reliability Limits**: Both camps accept that expert forecasts of long-range effects (50+ years) are highly unreliable, with error margins that grow non-linearly over time. This unreliability stems from:  
     - Poor historical track records (e.g., failed predictions of population, technology, or conflict outcomes).  
     - Systemic overconfidence in modeling tail risks and complex systems.  
     No camp assigns high confidence to expert forecasts beyond 50 years for novel, high-stakes interventions.  

  6. **The Burden of Proof**: Both camps agree that agents bear the burden of justifying actions when cluelessness is severe. Justification requires either:  
     - Demonstrable robustness in the near term (skeptic emphasis).  
     - Asymmetric expected value based on tractable horizons (optimizer emphasis).  
     Neither camp endorses unconstrained "intuition" or non-consequentialist fallbacks.  

  ---

  #### **Part 2: Disagreements Table**  
  The table below states each live disagreement in neutral terms (Column 1), followed by each camp’s position in its own words (Columns 2–3). Wording is fixed to ensure both camps can endorse their respective columns.  

  | **Dispute Description (Neutral)** | **Optimizer Position** | **Skeptic Position** |
  |----------------------------------|------------------------|----------------------|
  | **1. Action-guidance under severe cluelessness**: Does expected-value reasoning provide action-guidance when distal effects are radically uncertain? | "Expected-value reasoning remains action-guiding under severe causal ignorance: we must use the best available models to estimate effects over the longest tractable horizon, as withholding action risks ignoring high-stakes, asymmetric impacts on the far future (e.g., existential risk reduction)." | "Radical cluelessness about distal effects voids expected-value reasoning of action-guidance for most acts: the net expected value washes out to symmetry around zero within decades, leaving rational agents to prefer robustly good near-term options or risk net harmful paralysis by guesswork." |
  | **2. Scope of tractable horizons**: How far into the future can consequences be tractably modeled for high-stakes interventions? | "Tractable horizons extend centuries for high-leverage interventions (e.g., mitigating existential risks) via structured scenarios, sensitivity analysis, and meta-uncertainty frameworks; refusing to model beyond short horizons ignores the moral weight of the far future." | "Tractable horizons rarely exceed 20–50 years due to compounding uncertainty; long-range modeling for speculative interventions (e.g., AI governance) is intractable guesswork that cannot support meaningful expected-value comparisons." |
  | **3. Asymmetry in long-term effects**: Can we reliably identify persistent asymmetries (e.g., consistent positive or negative biases) in the long-term effects of interventions? | "Asymmetries are often identifiable (e.g., tail risks from emerging technologies or climate change), allowing expected-value calculations to favor interventions with high-stakes upside, even with wide error bars." | "Persistent asymmetries are rarely identifiable due to cluelessness; for most acts, the distribution of long-term effects is symmetric, making net expected value indeterminate beyond the near term." |
  | **4. Moral weight of the far future**: Should potential impacts on the far future receive non-negligible weight in decisions under cluelessness? | "The far future dominates the moral calculus due to its vast potential value; discounting it based on cluelessness is an unjustifiable moral error that risks astronomical waste." | "The far future’s moral weight is practically irrelevant under cluelessness, as we cannot reliably steer it; moral weight should concentrate on near-term effects we can confidently influence." |
  | **5. Default stance under paralysis**: What is the rational default when cluelessness blocks expected-value comparisons? | "Inaction forfeits high-impact opportunities; we must act on the best-guess expected value to avoid paralysis costs, prioritizing interventions with scalable near-term benefits (e.g., research into catastrophic risks)." | "Unjustified action risks net harm; the rational default is inaction or exclusively choosing options that are robustly good across near-term scenarios (e.g., poverty alleviation with no plausible downsides)." |

  ---

  #### **Part 3: Cruxes**  
  The following sub-questions (cruxes) would shift at least one camp’s position if resolved. Each includes a concrete test case with both camps’ ex ante predictions (based on contemporaneous knowledge) and cross-predictions.  

  **Crux 1: Can asymmetries in long-term effects be reliably identified for novel interventions?**  
  - **Test Case**: Haber-Bosch process (1910). Synthetic nitrogen fertilizer enables mass food production but also explosives.  
    - *Optimizer’s 1910 Position*: "Expected value is strongly positive: feeding billions outweighs speculative weaponization risks, and asymmetry favors lifesaving benefits."  
    - *Skeptic’s 1910 Position*: "Expected value is inscrutable: benefits (famine reduction) are robust near-term, but long-term risks (war escalation, ecological strain) are equally plausible and unquantifiable. Default to near-term robustness."  
    - *Optimizer’s Prediction of Skeptic*: "Skeptics will reject long-range modeling and fixate on unquantified risks, endorsing Haber-Bosch only for near-term famine relief."  
    - *Skeptic’s Prediction of Optimizer*: "Optimizers will overweight tractable benefits (crop yields) and ignore cluelessness about systemic risks like global conflict."  

  **Crux 2: How rapidly does uncertainty dominate expected-value calculations?**  
  - **Test Case**: DDT (1945). Insecticide reduces malaria but risks ecological collapse.  
    - *Optimizer’s 1945 Position*: "Expected value is positive: malaria reduction dominates, and risks are tractable via phased deployment and monitoring. Delay costs lives."  
    - *Skeptic’s 1945 Position*: "Expected value is indeterminate: benefits (disease control) are near-term and robust, but long-term effects (ecosystem impact, resistance) are clueless. Restrict to high-benefit, low-risk uses (e.g., indoor spraying)."  
    - *Optimizer’s Prediction of Skeptic*: "Skeptics will demand unattainable certainty, delaying deployment and causing preventable deaths."  
    - *Skeptic’s Prediction of Optimizer*: "Optimizers will underestimate tail risks and advocate mass use, inviting catastrophic blowback."  

  **Crux 3: Does near-term robustness predict long-term robustness?**  
  - **Test Cases**: Haber-Bosch and DDT.  
    - *Why it bears on the dispute*: If near-term robustness correlates with long-term outcomes, skeptics’ focus gains strength; if not, optimizers’ modeling imperative intensifies.  
    - *Optimizer’s View*: "No correlation: DDT’s near-term benefits masked long-term harms, proving robust near-term options can backfire. Modeling long tails is essential."  
    - *Skeptic’s View*: "Correlation is weak: Haber-Bosch’s near-term robustness (feeding hungry) endured, while DDT’s did not. Focus on robustness reduces harm from cluelessness."  

  ---

  #### **Part 4: Substantive vs. Verbal Disagreements**  
  We distinguish substantive disagreements (rooted in empirical or normative divides) from partly verbal ones (where clarification narrows the gap):  

  - **Substantive Disagreements**:  
    - **The symmetry claim (Disagreement 3)**: Whether effects wash out to symmetry is empirical and contested. Optimizers see asymmetry as identifiable; skeptics see symmetry as default. This is not resolvable by redefinition.  
    - **Moral weight of the far future (Disagreement 4)**: A normative divide: optimizers prioritize long-term potential; skeptics see it as non-actionable.  
    - **Default stance under paralysis (Disagreement 5)**: Optimizers treat inaction as costly; skeptics treat it as prudent. This reflects divergent risk tolerances.  

  - **Partly Verbal Disagreements**:  
    - **Tractable horizons (Disagreement 2)**: "Tractable" is underdefined. If "tractable" means *admitting of discriminating expected-value estimates*, the disagreement reduces to whether long-range models meet this bar. Clarification shows optimists focus on *informative* uncertainty (wide but asymmetric error bars), while skeptics see *non-informative* uncertainty (symmetry).  
    - **Action-guidance (Disagreement 1)**: Dissolves slightly under scrutiny. Both camps agree expected-value *theory* applies, but skeptics deny it yields *practical guidance* under cluelessness. This is a matter of "guidance" denoting justifiability (skeptic) vs. applicability (optimizer).  

  ---

  ### Notes on Contested Characterizations  
  - **Optimizer "best-guess" framing**: We used "best available models" (not "high-confidence" models) to reflect their acceptance of wide error bars. Some optimizers might prefer "credible" over "best," but we prioritized their insistence that inaction is unjustifiable.  
  - **Skeptic "paralysis" framing**: We used "prefer robustly good near-term options or risk paralysis" to capture their spectrum. Hardliners might reject "paralysis" as pejorative, but the phrasing aligns with their concession that inaction can be rational.  
  - **Symmetry "around zero"**: We specified "symmetry around zero" (not "exactly zero") to satisfy skeptics’ probabilistic view while avoiding optimizer objections to absolute neutrality.  
  - **Test-case predictions**: We excluded hindsight-inflected outcomes (e.g., DDT’s bird collapse) to ensure ex ante fairness. Skeptics might dispute "equally plausible" risks in Haber-Bosch, but we grounded this in their emphasis on symmetry.  

  This document reflects our shared commitment to clarity over consensus. By signing, we affirm that it fairly represents our positions and provides a foundation for focused debate.  

