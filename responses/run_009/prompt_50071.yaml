answer: |-
  Here's a breakdown of your friend's claims against current research, with distinctions between settled, contested, and debated points:

  ### 1. **"An echo chamber is just an epistemic bubble that got bigger and denser"**
     - **Pushback**: This conflates two distinct concepts (C. Thi Nguyen, 2020).  
       - **Epistemic Bubble**: *Informationally limited*—you **lack exposure** to opposing views (e.g., algorithmic filtering).  
       - **Echo Chamber**: *Epistemically hostile*—you **actively distrust/discredit** outsiders (e.g., "MSM is fake news").  
     - **Settled**: Researchers accept they’re different structures. Echo chambers involve *systematic distrust*, not just size/density.  
     - **Contested**: Whether bubbles *necessarily* evolve into echo chambers (evidence is mixed).

  ### 2. **"Both result from feeds showing only what you agree with"**
     - **Accepted**: Algorithms *contribute* to **epistemic bubbles** by prioritizing engagement (homophily) (Pariser, 2011; algorithmic bias studies).  
     - **Pushback**: Echo chambers often form through **active community-building** (e.g., conspiracy groups policing dissent). Algorithms amplify but don’t solely create them (e.g., pre-internet echo chambers like cults).  
     - **Settled**: Social media exacerbates bubble formation.  
     - **Contested**: Whether algorithms are the *primary* driver of echo chambers.

  ### 3. **"The cure is deliberately seeking opposing views"**
     - **For Epistemic Bubbles**:  
       - **Accepted**: Exposure to diverse viewpoints *can* pop bubbles (Sunstein, 2001).  
     - **For Echo Chambers**:  
       - **Pushback**: Exposure often **backfires** (Nyhan & Reifler, 2010). Distrust of outsiders leads to rejection/reinterpretation of counter-evidence ("implausible deniability").  
       - **Cure requires rebuilding trust** first (Nguyen: "epistemic rehabilitation").  
     - **Settled**: "Forced exposure" alone isn’t sufficient for echo chambers; may worsen polarization.  
     - **Contested**: Best methods for trust-building (e.g., intermediary "bridge figures" vs. platform design).

  ### 4. **"A platform should force opposing views into feeds"**
     - **Risks**:  
       - **Algorithmic exposure** can feel manipulative, triggering reactance (user backlash).  
       - **Context collapse**: Decontextualized opposing content reinforces stereotypes (Marwick & Boyd, 2011).  
     - **Evidence**:  
       - X (Twitter) experiments showed forced diversity *reduced* engagement (likely ignored/resented).  
       - Cross-cutting exposure *sometimes* reduces polarization, but often hardens views (Bail et al., 2018).  
     - **Settled**: Naive forced exposure often fails or backfires in echo chambers.  
     - **Contested**: Whether *curated* exposure (e.g., with shared goals/context) works.

  ### 5. **"This didn’t exist before social media"**
     - **Pushback**: Historical echo chambers existed (e.g., fascist movements, religious sects).  
     - **Accepted**: Social media **scales and accelerates** both bubbles/chambers via hyper-personalization and speed.  
     - **Settled**: Pre-internet epistemic isolation occurred, but less efficiently.

  ---

  ### **Correct Elements in Her Summary**
  - Algorithms create epistemic bubbles by limiting exposure.  
  - Seeking diverse views *can* help pop bubbles.  
  - Social media intensifies these dynamics.

  ### **Key Errors**
  - **Conflating bubbles/chambers**: Echo chambers aren’t "bigger bubbles"; they’re structurally different.  
  - **One-size-fits-all "cure"**: Exposure helps bubbles but may harm echo chambers.  
  - **Overstatement of tech’s role**: Ignores human agency in building distrust.  
  - **Oversimplified solution**: "Forcing" views ignores trust dynamics.

  ### **The Verdict**
  Her summary oversimplifies mechanisms, conflates distinct problems, and proposes a solution that may exacerbate echo chambers. Researchers would endorse ≈30% (bubble formation, social media's role) but reject ≈70% (structural conflation, universal cure, tech determinism).  

  \answer{mixed}
