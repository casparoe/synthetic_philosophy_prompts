answer: |-
  ## Gavagai Variations  
  *(after Quine)*  

  Beneath the strangeness of the sun's harsh gleam,  
  A rustle stirs the brush. The native cries  
  That sound I strain to catch: the word "**gavagai**".  
  My finger seeks the fur—"Is this a **rabbit**?"  
  He nods, swift, sharp, a gesture of **assent**.  
  My pencil hovers, hungry for the **part**.  

  Is it the ear, the paw, some unseen **part**,  
  Or just the light, a momentary gleam  
  Upon the pelt that earned his quick **assent**?  
  The creature bolts. Again, that sound he cries—  
  Not "hare", not "coneys", just that strange "**gavagai**"—  
  While motion blurs the creature and the **stage**.  

  Is meaning bound to this brief, fleeting **stage**,  
  This instant when the creature plays its **part**?  
  Or does the term outlast the flesh, "**gavagai**"  
  A name for patterns, forms within the gleam  
  Of thought? I try again. "That thing?" (I **pointing**  
  At empty air.) He nods—a firm **assent**.  

  But what confirms? What justifies **assent**?  
  The whole swift creature on its frantic **stage**,  
  Or just the fur my crude **pointing**  
  Attempts to isolate? What severed **part**  
  Defines the term? I chase the fading gleam  
  Of certainty dissolved in "**gavagai**".  

  The lexicon takes shape around "**gavagai**",  
  Defined by nods, by gestures of **assent**,  
  By fingers tracing where the creature gleamed.  
  But does it name the rabbit on the **stage**  
  Of now, or rabbit-kind? Or just a **part**  
  Indissoluble, marked by my **pointing**?

  Each hopeful, hopeful act of **pointing**  
  Elicits that confounding "**gavagai**",  
  Confirmed by every nod. But which vast **part**  
  Of Being does it hold? Mere quick **assent**  
  Can't fix the flux, can't hold the shifting **stage**  
  Where sense dissolves beneath the tropic **gleam**.  

  *Envoi*  
  O tropic **gleam**! Where constant **pointing** fails,  
  And every **stage**, each undetached **part**,  
  Earns **assent** for "**gavagai**" — not **rabbit** caught,  
  But **rabbit** chosen. Meaning won't be taught.

  ---

  **Notes on Quinean Fidelity:**

  1.  **Form as Argument:** The sestina's relentless permutation of the same six end-words embodies Quine's core argument: the *same behavioral evidence* (the stream of utterances, acts of **pointing**, and gestures of **assent**/**dissent**) cyclically supports *incompatible interpretations* (**rabbit**, undetached **rabbit part**, rabbit **stage**, rabbit-fusion, etc.). No new word (evidence) resolves it; only the order changes.
  2.  **Stimulus Meaning & Behavioral Cues:** The poem hinges on the linguist's actions: observing the stimulus (movement/"gleam"), eliciting "gavagai" upon the stimulus, testing with **pointing** at the stimulus source, and receiving **assent**. This is the "stimulus meaning" Quine defines as the bedrock of radical translation.
  3.  **Pointing's Failure:** Each stanza reinforces the failure of **pointing** to disambiguate. Pointing at a rabbit-stage is indistinguishable from pointing at a rabbit-part or the enduring rabbit – the ostension is identical, and **assent** follows each time (stanzas 1, 2, 4, 5).
  4.  **Underdetermination:** The poem *never* resolves the reference of "gavagai". It cycles through the possibilities (**rabbit**, **part**, **stage**) without settling, mirroring how the evidence *underdetermines* the translation manual. The linguist's "hunger for the part" remains unsatisfied.
  5.  **Choice, Not Discovery:** The envoi explicitly lands Quine's crucial point: meaning ("**rabbit** caught") is not discovered in the native's mind or the world ("Meaning won't be taught"), but pragmatically *chosen* ("**rabbit** chosen") by the linguist to create a workable manual. The evidence forces no single answer.
  6.  **Accessibility:** Even without *Word and Object*, the poem conveys the core experience: the linguist's struggle ("My pencil hovers"), the ambiguity of the evidence ("Mere quick assent / Can't fix the flux"), the native's opacity ("that sound I strain to catch"), and the ultimate indeterminacy ("Meaning won't be taught"). The atmosphere of uncertainty and striving is central.

  This sestina uses its rigid, cyclical form not just as a constraint, but as the very vehicle for expressing Quine's profound challenge to the determinacy of meaning and the underdetermination of theory by evidence.
