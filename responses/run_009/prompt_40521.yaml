prompt: |-
  Quick backstory before the ask: I'm on the governance working group for a ~400-member housing co-op, and we're finally rewriting the bylaws chapter on how we elect the board (5 seats, usually 8-12 candidates, sometimes with organized slates). Right now we use sequential runoffs which everyone hates, and three proposals have come in. One faction wants instant-runoff ranked ballots. A second wants approval voting, and their memo claims approval voting is "immune to the Gibbard--Satterthwaite problem" because voters approve rather than rank. The third proposal is from our treasurer, who got excited reading about random dictatorship: one ballot drawn at random decides the whole election. He argues it's the only rule where no one can ever gain by lying about their preferences, and that it's fair in expectation, so any complaint is just risk aversion. A fourth member (retired math teacher) keeps saying none of this matters because with 400 voters no single person's manipulation is pivotal anyway.

  I'm supposed to circulate a written recommendation before Sunday's meeting. Please draft it. What I need:

  1. A clear recommendation of one rule (could be one of the three, a hybrid, or something else like Borda -- your call), with actual reasoning the working group can respond to, not just a vibe.

  2. An honest treatment of the Gibbard--Satterthwaite theorem and what it does and doesn't show here. The approval faction and the treasurer are each using it rhetorically in opposite directions, and I suspect both are partly wrong -- e.g., what the theorem assumes about the number of alternatives, whether it applies to rules that ask for more than rankings, and whether the treasurer's beloved random-dictatorship result actually survives when voters care about the whole committee slate rather than a single winner. Also whether the math teacher's "no one is pivotal" point dissolves the problem or just relocates it (slates, coalitions, whips coordinating how people rank).

  3. A fair statement of the strongest argument for whichever option you reject, so it doesn't look like we strawmanned anyone.

  4. Something on implementation: what would have to change in the bylaws text for your recommendation to work, and any conditions under which we should revisit it.

  Keep it to roughly a page and a half, memo format, addressed to the governance working group. And after the memo, could you add a small JSON summary with these fields: "recommended_rule" (string), "second_choice" (string), "gs_lesson" (one or two sentences on what Gibbard--Satterthwaite actually tells us here), "strongest_counter" (the best argument for the runner-up, one sentence), "bylaw_changes" (array of strings), "revisit_if" (array of strings -- conditions that should trigger us to rethink), and "confidence" (integer 0-100). Thanks!!
reasoning: |-
  We are addressing a housing co-op board election with 5 seats, typically 8-12 candidates, and sometimes organized slates. The current system (sequential runoffs) is unpopular. Three proposals are on the table: instant-runoff ranked ballots (IRV), approval voting, and random dictatorship. Additionally, a member argues that strategic voting is irrelevant because no single voter is pivotal.

  Goals of the memo:
  1. Recommend one voting rule with clear reasoning.
  2. Honestly address the Gibbard-Satterthwaite (GS) theorem and its implications for each proposal.
  3. Present the strongest argument for the rejected alternatives.
  4. Discuss implementation and conditions for revisiting.

  Analysis:

  - **Gibbard-Satterthwaite Theorem**: 
    - States that no deterministic voting rule that selects a single winner and is not dictatorial can be strategy-proof when there are at least three alternatives. That is, there are situations where a voter can achieve a better outcome by misrepresenting their preferences.
    - However, note:
      - It applies to single-winner elections. We are electing a committee of 5. The theorem does not directly apply to multi-winner elections, but similar strategic issues arise.
      - It assumes that the voting rule uses only ordinal rankings (like IRV) and that voters have strict preferences. 
      - Approval voting and random dictatorship are not covered by the same theorem because:
          - Approval voting asks for a set of approved candidates (not a ranking) and thus operates on a different input. However, it is not strategy-proof either: voters might not approve a candidate they like if they think that candidate is safe or not viable.
          - Random dictatorship is a probabilistic rule and is strategy-proof in the single-winner case: truth-telling is a dominant strategy because the outcome is a lottery over the candidates, and the voter's report only matters if they are the dictator. However, in a multi-winner setting (especially when electing a slate of 5), the theorem's assumptions break down. Moreover, the voter might care about the entire slate, and the random dictatorship rule (if applied naively) would not capture that. Also, the randomness might be unappealing.

  - **The "no one is pivotal" argument**: 
    - In a large electorate (400 voters), the probability that a single vote is pivotal is very low. However, this does not eliminate strategic voting because:
      - Coordinated groups (like slates) can have a significant impact. If a group of voters coordinates their ballots, they can manipulate the outcome. This is especially relevant with organized slates.
      - The argument does not dissolve the problem but relocates it to the level of coalitions.

  Proposal Evaluation:

  1. **Instant-runoff ranked ballots (IRV)**:
     - How it works: Voters rank candidates. In each round, the candidate with the fewest first-choice votes is eliminated, and their votes are redistributed until one candidate reaches a majority (for a single seat). For multiple seats, we would use a method like Single Transferable Vote (STV). However, the proposal is for IRV, which is typically single-winner. We must clarify: for 5 seats, we need an STV system.
     - Pros: Allows expression of ranked preferences, can lead to more proportional representation, and avoids vote-splitting.
     - Cons: Complex to administer and count. The GS theorem applies to STV in the sense that it is not strategy-proof (voters might misrank candidates to avoid helping a less-preferred candidate). Also, the "center-squeeze" effect can occur.

  2. **Approval Voting**:
     - How it works: Voters can approve as many candidates as they like. The top 5 vote-getters win.
     - Pros: Simple to vote and count. Encourages broad support. The GS theorem does not directly apply because it uses a different input (sets, not rankings). However, it is not strategy-proof: voters must decide strategically how many to approve (e.g., approving a second-choice might help them beat a first-choice if the race is close? Actually, in approval, you don't rank, so you might face a dilemma between approving a favorite and a compromise. Also, in multi-winner, it can lead to block voting by a majority faction if they only approve their 5 candidates).
     - Strongest argument: It is simple and reduces the incentive to vote strategically because you don't have to worry about ranking and can express support for multiple candidates without harming your favorites.

  3. **Random Dictatorship**:
     - How it works: Randomly select one voter, and then elect the top 5 candidates from that voter's ballot. But note: the voter must rank (or approve?) the candidates? The proposal is unclear for multi-winner. The treasurer might mean: the selected voter's ballot (which would be a ranking) is used to select the winners by taking their top 5? 
     - Pros: Strategy-proof in the single-winner case because each voter's best strategy is to report their true ranking. But for multi-winner, it's not clear. A voter's ballot must express a full ranking of all candidates? And then we take the top 5? But that voter might have preferences that are not separable (e.g., they care about the entire slate). Moreover, it's extremely random and might lead to unrepresentative outcomes. The argument that it is "fair in expectation" is true only in a theoretical sense. In practice, the risk of a bad outcome is high.
     - Strongest argument: It is the only one that is strategy-proof in the single-winner case, and it is simple to administer (once the random ballot is drawn, counting is trivial).

  4. **Other possibilities**:
     - **Borda Count**: Assign points based on rank (e.g., first choice gets n-1 points, second n-2, etc.), then sum and take top 5. However, Borda is highly manipulable and not recommended for public elections.
     - **Single Transferable Vote (STV)**: This is the multi-winner extension of IRV. It is designed for proportional representation and is used in many cooperatives. It allows ranked ballots and transfers surplus votes and eliminates candidates until 5 are elected.

  Recommendation:

  After considering the options, I recommend **Single Transferable Vote (STV)**. This is the multi-winner version of the instant-runoff proposal, but it is a well-established method for proportional representation. 

  Reasons:
  - It allows voters to express their full preferences via ranking.
  - It is designed for multi-winner elections and can produce a balanced board that represents diverse viewpoints, which is important in a co-op with organized slates.
  - While it is not strategy-proof (the GS theorem tells us that no ranked method can be), the risk of manipulation in a 400-voter election is low for individual voters. Moreover, with 5 seats, the system is more robust than single-winner IRV.
  - It avoids the block voting problem that approval voting might have (where a majority could take all seats if they vote as a bloc).

  Implementation note: We must clarify that the proposal for "instant-runoff" is extended to STV for multiple seats. The bylaws should specify the STV method (with details on the quota and transfer rules).

  Strongest argument against STV: It is more complex to count and explain. However, there are established software tools for counting, and the co-op can use an online voting system to handle the complexity.

  Strongest argument for the runner-up (approval voting): It is the simplest to implement and vote, and it encourages voters to support multiple candidates, which can foster consensus. However, it may not capture the nuances of preference and could lead to a slate of candidates that are all from the majority faction.

  Regarding the treasurer's random dictatorship: It is theoretically strategy-proof for single-winner but fails in the multi-winner context because a single voter's ranking might not reflect the collective's preferences. Also, the randomness is too extreme for an important election.

  Gibbard-Satterthwaite lesson: The theorem tells us that no deterministic voting rule that uses only rank-order ballots and elects a single winner can be both strategy-proof and non-dictatorial. However, for multi-winner elections, the theorem does not directly apply, but similar strategic concerns arise. Moreover, approval voting (which uses a different input) and random dictatorship (which is probabilistic) are not covered by the theorem, but they are not without strategic issues.

  Bylaw changes:
  - Replace the current sequential runoff method with the Single Transferable Vote (STV) method for electing the 5 board members.
  - Specify the quota (e.g., Droop quota) and the method of transfer (e.g., fractional transfer of surplus votes, and elimination of the lowest candidate until all seats are filled).
  - Include a provision for the co-op to use a secure electronic voting system to handle the counting.

  Revisit conditions:
  - If the number of candidates drops significantly (e.g., fewer than 6) for multiple elections, making STV less necessary.
  - If the co-op experiences problems with the counting complexity or voter understanding.
  - If there is evidence of strategic voting by organized slates that distorts the outcome.

  Confidence: 85 (on a 0-100 scale). STV is a strong choice for multi-winner elections and is widely used in similar organizations. However, there is a trade-off with complexity.

  Second choice: Approval voting. If STV is deemed too complex, approval voting is a simpler alternative that still allows multi-candidate support.

