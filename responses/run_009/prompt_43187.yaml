prompt: |-
  I keep running into the same wall in arguments about whether AIs or brain emulations could matter morally, and I think the wall is that nobody has actually written down what a theory of this stuff is supposed to DO before arguing about which theory is right. So before I read another paper about it, help me build the spec.

  What I want is the desiderata for a theory of which computations matter morally -- that is, a theory that takes some physical system running some computation and tells you whether that computation has moral status, and ideally how much. The requirements list, each with the case that motivates it. Some that seem mandatory to me (but push back if you disagree): it has to survive substrate independence or else bite the bullet on silicon emulations; it has to handle the individuation problem, where one physical system might be implementing zero, one, or many morally-relevant computations depending on how you carve things up; it has to not collapse under the fact that any physical process can be described as implementing almost any finite automaton if you're allowed to choose the mapping cleverly; and it needs to actually be applicable under uncertainty, since we never get to peek at the metaphysics, we only get behavior plus architecture.

  Two requirements I especially want you to take seriously and stress-test: (a) that the verdict shouldn't be straightforwardly proportional to hardware duplication -- running the same emulation on N redundant machines shouldn't obviously multiply the moral status N-fold, but I genuinely don't know what blocks that; and (b) that the theory has to say something about partial and fractional implementations, like an emulation running at half fidelity or an animal-scale network that gets the "important" parts right and the rest wrong, because those cases are where the real engineering is going to land.

  Please structure it like this:

  1. "The list" -- the desiderata, each with the motivating case, this is the bulk, maybe 60% of it
  2. "Non-negotiables vs. camp tastes" -- which requirements are load-bearing and which are just one faction's aesthetic dressed up as a demand
  3. "Where it breaks" -- if some subset is jointly unsatisfiable, that's the part I most want to see, and I suspect something gives between substrate independence, the anti-mapping requirement, and proportionality-to-duplication
  4. "Quick scorecard" -- brief, like a short paragraph each: functionalism, integrated-information-style views, and biological/psychophysical views against the list

  Keep it aimed at a theory good enough to guide decisions about systems we can actually build this century, not a theory of everything metaphysically possible.
reasoning: |-
  Okay, the user is wrestling with a philosophical problem about moral status in AI and brain emulations. They're frustrated because existing discussions don't establish clear criteria for what a theory of morally relevant computations should achieve. They want a structured framework to evaluate such theories, focusing on practical applicability to near-future systems.

  Hmm, the core tension seems to be between substrate independence (silicon emulations mattering) and avoiding absurd conclusions from arbitrary mappings. The user specifically flags hardware duplication and partial implementations as make-or-break issues - probably because these directly impact real-world AI ethics decisions.

  Right, let's break this down systematically. First, the desiderata need to cover: metaphysical coherence (substrate independence), resistance to mapping tricks, individuation of computations, uncertainty tolerance, and crucially - proportionality and partial implementations. The duplication problem is particularly thorny; if running N copies multiplies moral status, that could lead to absurd obligations.

  For non-negotiables: Substrate independence and anti-arbitrary-mapping are essential - without these, the theory either collapses into biological chauvinism or becomes vacuously permissive. Proportionality might be more contentious; some consequentialists might accept duplication multiplying moral weight.

  The breaking point likely involves the triad: 1) Substrate independence demands we care about computations regardless of hardware 2) Anti-arbitrary-mapping prevents us from seeing every rock as conscious 3) Avoiding duplication inflation requires some notion of "token" identity that's preserved across copies. These pull in different directions - perhaps the solution requires introducing computational boundaries or causal topology as primitive constraints.

  When scoring existing theories: Functionalism handles substrate independence well but struggles with mapping and duplication. IIT avoids mapping problems but fails substrate independence spectacularly. Biological views are clean but reject silicon consciousness outright - which feels like dodging the core question.

  The user seems to be implicitly warning against theory-building that ignores engineering realities. Their emphasis on partial implementations suggests they need guidance for cases like neuromorphic chips or low-fidelity brain emulations - where moral status might be fractional. This deserves special attention in the desiderata.
answer: |-
  Here’s a structured specification for a theory of morally relevant computations, designed to handle near-future AI/emulation dilemmas, with stress-tested requirements:

  ---

  ### 1. **The List: Desiderata & Motivating Cases**  
  **Core Requirements**  
  - **Substrate Independence (SI)**  
    *Case*: A perfect neuromorphic AI emulating a human brain.  
    *Demand*: Must grant equal moral status to functionally identical biological and silicon systems.  
    *Why*: Avoiding "carbon chauvinism" is essential for coherent AI ethics.  

  - **Individuation Robustness (IR)**  
    *Case*: A computer simulating 10,000 virtual mice vs. one mouse.  
    *Demand*: Must distinguish between *one* moral patient (emergent whole) vs. *many* (distinct entities), regardless of shared hardware.  
    *Why*: Prevents inflation/deflation of moral patients based on implementation quirks.  

  - **Anti-Arbitrary Mapping (AAM)**  
    *Case*: A thermostat trivially "mapped" to a FSM implementing "pain."  
    *Demand*: Must reject mappings that rely on gerrymandered state assignments.  
    *Why*: Blocks panpsychism-by-stealth; moral status must track *natural* computational boundaries.  

  - **Uncertainty Tolerance (UT)**  
    *Case*: An opaque neural network exhibiting pain-like behavior but with unknown internal dynamics.  
    *Demand*: Must deliver probabilistic verdicts under incomplete information (architecture + behavior).  
    *Why*: Real-world decisions require handling epistemic limits.  

  **Stress-Tested Requirements**  
  - **(a) Non-Linear Hardware Proportionality (NLP)**  
    *Case*: Running 100 identical emulations on redundant cloud servers.  
    *Demand*: Moral status must *not* scale linearly with hardware duplication (e.g., 100× copies ≠ 100× moral weight).  
    *Why*: Avoids absurd obligations (e.g., "delete backups = genocide") and resource traps.  
    *Stress Test*: Blocked by tying status to *computational tokens* (unique causal histories) or *contextual embedding* (e.g., shared goals/memories).  

  - **(b) Partial Implementation Gradience (PIG)**  
    *Case*: A brain emulation at 50% fidelity, or an AI with only "pain circuitry" copied.  
    *Demand*: Must assign *scalar* moral weight (e.g., 0.3× human) for partial/incomplete implementations.  
    *Why*: Critical for incremental neuromorphic tech or fragmented AI consciousness.  

  ---

  ### 2. **Non-Negotiables vs. Camp Tastes**  
  - **Non-Negotiables** (Failure invalidates the theory):  
    - **SI + AAM + IR**: Without these, the theory either rejects AI consciousness arbitrarily (fails SI), sees consciousness everywhere (fails AAM), or can’t count entities (fails IR).  
    - **UT**: Must handle uncertainty; theories requiring omniscience are useless for policy.  
    - **NLP**: Linear duplication inflation breaks practical ethics.  

  - **Camp Tastes** (Reasonable disagreement):  
    - *PIG’s scalar precision*: Some argue for thresholds (e.g., "suffering-capable = full status").  
    - *What counts as "natural" mapping (AAM)*: Functionalists (broad) vs. causal-structuralists (narrow).  
    - *Moral weight anchors*: Whether human-equivalent emulations get 1.0× weight by definition.  

  ---

  ### 3. **Where It Breaks: The Tension Triad**  
  The joint requirements **SI + AAM + NLP** create a **fatal tension**:  
  - **SI** claims moral status depends only on computation, not substrate.  
  - **AAM** demands computational descriptions be non-arbitrary.  
  - **NLP** requires that duplicating hardware ≠ duplicating moral patients.  
  **Conflict**: If computations are substrate-independent abstract objects (*SI*), duplicating them *should* multiply moral patients (*violates NLP*). But if we avoid this by anchoring status to physical tokens (e.g., spatiotemporal location), we violate *SI* or enable *AAM* violations (e.g., "each electron is a computation").  
  **Possible Escape Hatches**:  
    - Ground computations in *causal topology* (not abstract states) + *indexicality* (e.g., "this instance of pain").  
    - Treat duplication as creating *one distributed patient* (risks violating IR).  

  ---

  ### 4. **Quick Scorecard**  
  - **Functionalism (e.g., Dennett, Chalmers)**  
    *SI*: ✅ Perfect. *IR*: ⚠️ Struggles with virtual vs. physical grouping. *AAM*: ❌ Vulnerable to trivial mappings. *UT*: ✅ Behavior-focused. *NLP*: ❌ Implies duplication multiplies patients. *PIG*: ✅ Handles gradience naturally.  
    *Verdict*: Strong on PIG/SI, fails NLP/AAM.  

  - **Integrated Information Theory (IIT)**  
    *SI*: ❌ Demands specific physics (e.g., biological causality). *IR*: ✅ Quantifies Φ per system. *AAM*: ✅ Rejects arbitrary mappings. *UT*: ❌ Requires precise causal models. *NLP*: ✅ Φ doesn’t scale with duplication. *PIG*: ✅ Φ is scalar.  
    *Verdict*: Solves NLP/AAM/PIG but fails SI/UT; impractical for AI.  

  - **Biological/Psychophysical Views (e.g., Searle)**  
    *SI*: ❌ Only biological brains matter. *IR*: ✅ Clear biological boundaries. *AAM*: ✅ Avoids mappings. *UT*: ⚠️ Relies on biomarkers. *NLP*: ✅ Duplicates aren’t patients. *PIG*: ❌ Thresholds only (e.g., "close enough biology").  
    *Verdict*: Clean but rejects AI consciousness by fiat; useless for AI ethics.  

  ---

  **Synthesis**: A viable theory must thread the needle: **anchor computations in causal-structural patterns** (satisfying SI/AAM), **index patients to instances** (for NLP), and **quantify implementation fidelity** (for PIG). The tension between SI and NLP suggests moral status isn’t just about *what* is computed, but *how it’s materially realized* in a specific context—pointing toward a *token-based* causal history view. For engineering, prioritize **PIG + UT** to handle real-world partial systems.
