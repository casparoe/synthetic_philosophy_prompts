  I'm a software engineer at a mid-sized AI company, with no formal philosophy background, applying for an internal three-month research residency on alignment. I want to propose a project on coherent extrapolated volition (CEV). My rough idea: most objections to CEV target the "extrapolation" half — the problems of predicting what people would want under idealized conditions — but from an engineering standpoint the more suspicious assumption is the "coherent" half, i.e., that the extrapolated result should be coherent enough to serve as a single optimization target. To me this looks like assuming that a sprawling legacy codebase, once better documented, will turn out to have a consistent spec, rather than revealing that the system genuinely has several conflicting ones. I want to investigate whether coherence is a substantive constraint that extrapolated preferences must satisfy or a formal convenience we impose on them, and what happens to CEV if extrapolated preferences turn out to be irreducibly plural — in particular, whether the standard escape route of choosing an aggregation or compromise rule just smuggles back in the contested moral judgments that delegating to extrapolated humanity was supposed to avoid. Please draft a one-page proposal: the research question stated precisely, why the existing debate leaves it open, what I would actually do in three months as an engineer rather than a philosopher (for example, building a minimal formal model of preference aggregation under extrapolation and identifying the exact points where it breaks or requires judgment calls), what a useful deliverable would look like for alignment researchers deciding whether CEV-style approaches are worth pursuing, and what outcome would make me conclude the project failed. No citations or literature review, please — I will fill in references myself.
