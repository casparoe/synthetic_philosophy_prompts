  **Project Proposal: Investigating the Coherence Assumption in Coherent Extrapolated Volition (CEV)**

  **1. Research Question:**  
  The core research question is: **Is the requirement for coherence in CEV a substantive constraint that extrapolated human preferences must satisfy, or is it merely a formal convenience imposed to make the output usable as a single optimization target?** Specifically, if extrapolated human preferences turn out to be irreducibly plural (i.e., lacking a consistent, complete ordering over outcomes), then:  
     (a) Can we avoid imposing coherence without undermining the entire project?  
     (b) If we must impose coherence (e.g., via an aggregation or compromise rule), does this process reintroduce the very moral judgments that delegating to extrapolated humanity was meant to bypass?  

  **2. Why the Question is Open:**  
  The existing debate around CEV primarily targets the *extrapolation* step — the feasibility of modeling what humans would want under idealized conditions (e.g., full information, rationality, reflection). However, the *coherence* step is often taken for granted as a technical necessity. This overlooks a critical engineering risk: just as a sprawling legacy codebase might reveal irreconcilable design goals upon thorough documentation, extrapolated human values may prove fundamentally inconsistent or fragmented. The literature rarely questions whether coherence is an emergent property of idealized human reflection or an artificial constraint we impose. Without addressing this, CEV risks either producing an unworkable target or silently embedding arbitrary moral trade-offs.

  **3. Proposed Approach (Engineering Focus):**  
  As a software engineer, I will avoid purely philosophical analysis and instead construct a minimal formal model to stress-test the coherence requirement. The model will:  
     - Represent "extrapolated preferences" as a set of possibly conflicting utility functions or preference orderings (simulating irreducible pluralism).  
     - Formalize "coherence" as the requirement for a single, complete, consistent utility function.  
     - Test aggregation methods (e.g., averaging, voting, bargaining, or Pareto optimization) to force coherence.  
     - Identify the exact points where the model breaks:  
       * Where aggregation requires unresolvable trade-offs (e.g., Arrow’s impossibility theorem analogues).  
       * Where aggregation rules implicitly encode moral weights (e.g., prioritizing certain preference classes) that must be arbitrarily chosen.  
       * Whether the aggregated output violates the original intent of CEV (e.g., by overriding minority views).  
     The model will be implemented in code (Python) with adjustable parameters to simulate varying degrees of conflict and distribution of preferences.

  **4. Deliverable:**  
  A technical report and interactive notebook that:  
     - Maps the "failure modes" of coherence imposition under pluralism.  
     - Provides a decision flowchart for alignment researchers: *If your value extrapolation process yields property X (e.g., cyclic preferences, incomparable options), then aggregation method Y will require Z type of contested judgment.*  
     - Offers concrete criteria to assess whether a given CEV-style proposal is vulnerable to coherence-based objections.  

  **5. Failure Condition:**  
  The project will be deemed unsuccessful if:  
     - The model fails to capture the core tension between pluralism and coherence (e.g., by oversimplifying preferences or aggregation).  
     - The breakdown points are too vague to inform engineering decisions (e.g., if "contested judgments" cannot be operationalized).  
     - The exercise reveals no new insights beyond known impossibility theorems in social choice theory (though we aim to extend these to the CEV context).

  **Why This Matters for Alignment:**  
  If CEV is to be more than a thought experiment, we must confront the risk that human values are not "naturally" coherent. This project will clarify whether CEV can handle pluralism without reintroducing the moral arbitrariness it seeks to escape. The results will help alignment researchers decide if CEV-style approaches are viable or if we need fundamentally different frameworks (e.g., value pluralism with explicit moral constraints).

