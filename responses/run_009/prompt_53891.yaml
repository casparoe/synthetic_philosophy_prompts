answer: |-
  ### Project Proposal: Investigating the Coherence Assumption in Coherent Extrapolated Volition (CEV)  

  **Research Question**  
  Is the "coherent" half of CEV a substantive constraint that extrapolated preferences inherently satisfy, or a formal convenience we impose? Specifically:  
  1. If extrapolated human preferences are irreducibly plural (i.e., lack a consistent, unified structure), does forcing coherence via aggregation rules reintroduce the contested moral judgments that CEV aims to avoid?  
  2. Under what conditions does pluralism make CEV-style delegation impossible without external intervention?  

  **Why the Debate Leaves This Open**  
  Existing critiques of CEV focus overwhelmingly on *extrapolation* (e.g., computational infeasibility, idealized rationality, or counterfactual uncertainty). The *coherence* assumption—that idealized preferences converge to a single, consistent utility function—is rarely challenged. This mirrors engineering oversights where legacy systems are assumed to have a unified specification, only to reveal irreconcilable conflicts after refactoring. Without examining coherence as a first-class problem, we risk building alignment frameworks on untested premises.  

  **Engineering Approach: A Minimal Formal Model**  
  As an engineer, I will avoid abstract philosophy and instead construct a tractable model to stress-test coherence. Over three months:  
  1. **Model Setup**:  
     - Represent "extrapolated preferences" as a set of utility functions \(U = \{u_1, u_2, ..., u_n\}\) (simulating irreducible pluralism).  
     - Define "coherence" as the existence of a consistent aggregate utility function \(u_{agg}\) computable from \(U\).  
  2. **Aggregation Experiments**:  
     - Test aggregation methods (e.g., averaging, bargaining, Pareto optimization, voting) under constraints:  
       - Extrapolation-induced symmetries (e.g., all \(u_i\) share core values but diverge elsewhere).  
       - Radical pluralism (e.g., \(u_i\) conflict at their optima).  
     - Quantify "moral smuggling": Track where aggregation rules *require* importing external priorities (e.g., weighting schemes, conflict-resolution heuristics).  
  3. **Breakdown Analysis**:  
     - Identify precise failure modes:  
       - **Inconsistency thresholds**: When does \(n\) (number of preferences) or divergence in \(U\) make \(u_{agg}\) undefined?  
       - **Judgment hotspots**: Which steps force arbitrary choices (e.g., normalizing utilities, clipping outliers)?  
     - Visualize trade-offs (e.g., coherence vs. faithfulness to subsets of \(U\)).  

  **Deliverable for Alignment Researchers**  
  A framework to evaluate CEV viability, including:  
  - **Coherence Risk Matrix**: A taxonomy of preference structures (e.g., "tolerable fragmentation" vs. "fatal pluralism") and their implications for aggregation.  
  - **Decision Flowchart**: "Should you pursue CEV?" based on:  
    - Observed properties of \(U\) (e.g., conflict severity, distribution).  
    - Tolerance for moral smuggling in aggregation.  
  - **Failure Signposts**: Early indicators that coherence imposition will require unacceptable compromises.  

  **Failure Condition**  
  The project fails if:  
  1. The model cannot isolate coherence-specific challenges (e.g., conflates them with extrapolation noise).  
  2. Breakdown points are too vague to guide engineering decisions (e.g., "judgment required" without quantifiable thresholds).  
  3. Results reveal no novel insights beyond trivial social-choice paradoxes (e.g., Arrow’s theorem).  

  **Why This Matters**  
  CEV remains influential in alignment, but its coherence assumption is a latent risk. By modeling it rigorously, we can either salvage CEV (by clarifying when coherence emerges naturally) or accelerate pivots to alternatives (e.g., pluralistic governance). This project delivers actionable tools—not just critiques—for engineers weighing trade-offs in value learning architectures.  

  ---  
  **Output**: One concise page. Ignores citations; focuses on problem structure, engineering methods, and decision-relevant outputs.
