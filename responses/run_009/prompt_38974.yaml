  First, I need to recall Malcolm's and Dennett's arguments accurately. Malcolm's stance is linguistic/conceptual: dreaming is defined by the morning report, so dreams aren't experiences during sleep. Dennett counters with empirical possibilities, like dreams being composed upon waking. Then, lucid dreaming experiments show subjects signaling during REM sleep, which suggests experiences happen during sleep. But the philosophical debate didn't end; it shifted. Malcolm's followers moved to questioning the nature of experience itself, while Dennett evolved toward his multiple drafts model.

