  Lucid dreaming evidence does challenge Malcolm directly, but his successors might argue that lucid dreams are a special case. They could claim ordinary dreams lack sensory presence or real-time consciousness. Dennett's shift to multiple drafts complicates things further, suggesting timing might not be the right question. 

