prompt: |-
  Hi! I'm a PhD student in biostatistics, and for the last few years I've been the "stats person" for a mid-sized regional water utility (long story — started as a side gig during my masters and now I can't get rid of them). The single most common question I get is some version of: "this number has been stable for X years, can we assume it stays that way?" — for sizing spare part inventories, deciding whether to keep a monitoring program, setting maintenance budgets. And I've realized I don't have a principled way to answer it; I basically vibe-check based on how long the stable period was and whether anyone in the room looks nervous.

  I've read enough philosophy of induction to know the rough shape of the problem — Hume obviously, and Goodman's grue thing, where whether a regularity projects depends on which predicate you describe it with, not just on how many confirming instances you have. Goodman's own answer seems to be something about how "entrenched" the predicate is, but entrenchment is defined by the predicate's history of successful past projections, and from where I sit that's circular-ish: we have exactly one past, one history, no control group. So what I want is to turn all this (plus whatever else is actually usable — reference class stuff, whether you have a mechanism or just a pattern, extrapolation vs interpolation) into a procedure that two utility engineers and I can run in an hour-long meeting, per forecast. Concretely:

  - an ordered list of questions, each answerable by a domain engineer with no stats training,
  - what counts as a sufficient answer at each step,
  - the conditions under which the procedure outputs "do not extrapolate, budget for the uncertainty instead" versus "extrapolate, but state a horizon",
  - and the points where it has to admit it can't settle the question and hands the decision back to a human — flag those honestly, don't bury them.

  The grue-flavored problem I keep actually hitting: a lot of our historical regularities are indexed to categories that were created at a particular date — meter types, pipe materials introduced by code changes, "accounts opened before the 2009 billing software migration." So the regularity is only ever observed on one side of a time boundary, and the category itself was drawn at that boundary. I want the procedure to include a test for this that an engineer can apply themselves (some red-flag questions about how the categories were constructed and whether the cut date has anything to do with the outcome), not just a warning to "watch out for grue-like predicates."

  Then run it on three cases: (1) pump failures — 15 years of stable rates, known failure mechanism (seal wear); (2) household demand by meter generation, where the newest generation was only rolled out 2 years ago, so we have almost no data on how the observed pattern behaves as those meters age; (3) the one where I actually disagree with the engineers — they want to keep extrapolating a 20-year seasonal demand pattern even though the region's housing stock has been turning over fast, and I suspect the procedure should tell us to stop, but run it honestly even if it sides with them.

  Also tell me what the procedure can't do — I assume it says nothing about genuinely unprecedented events, but if there are other failure modes I haven't listed, I'd rather find out now than in the next budget meeting. And if some step is basically a judgment call dressed up as a question with a checklist feel, say so; the director has to sign off on whatever we produce and I don't want to hand her false precision.
reasoning: |-
  We are designing a procedure to help decide whether a historical regularity (a stable number or pattern) can be extrapolated into the future, with clear steps and decision points. The procedure must be usable by domain engineers with no stats training and output either (a) a decision to extrapolate (with a stated horizon) or (b) a decision not to extrapolate and instead budget for uncertainty, or (c) admit uncertainty and hand back to human judgment.

  The procedure will be structured as an ordered list of questions. Each question is designed to screen for known pitfalls (like the "grue" problem, reference class issues, etc.). We'll also include a specific test for time-bound categories (like those created at a particular date).

  The core idea: we are trying to assess the risk that the observed stability is an artifact of the way we've categorized or measured the data, or that underlying conditions might change.

  We are going to consider:
  1. The length and quality of the historical data.
  2. The nature of the category (is it defined in a way that might be time-bound?).
  3. The existence of a causal mechanism.
  4. External factors that might change.
  5. The consequences of being wrong.

  We'll run the procedure on the three cases as requested.

  Structure of the Procedure:

  I. Preliminaries
     - Define the variable and the observed pattern (e.g., "pump failure rate is 2% per year").
     - State the intended use (e.g., for spare parts inventory).

  II. Step-by-Step Questions

  Step 1: Data Quality and History
     - Question: "How many years of data do we have for this pattern? Is the data complete and reliable for the entire period?"
     - Sufficient answer: At least 5 years (adjustable per context) of complete, reliable data. If not, flag as insufficient history.
     - If insufficient: output "Do not extrapolate; budget for uncertainty" OR if the data is very short (e.g., <2 years) and critical, hand back to human with a note that the data is too short.

  Step 2: Stability Assessment
     - Question: "Looking at the data over time (e.g., a plot), has the pattern been stable? Are there any visible trends, cycles, or breaks? If there was a change, do we know why and have we accounted for it?"
     - Sufficient answer: The pattern is flat (no trend) and without unexplained breaks. If there are breaks but they are explained and accounted for (e.g., a one-time event that won't recur), that's acceptable.
     - If unstable: output "Do not extrapolate; budget for uncertainty" OR if the instability is explainable and non-recurring, then proceed with caution (but note in the output).

  Step 3: Category Definition Check (This is our grue-safeguard)
     - Question: "Is the category we are looking at (e.g., 'type X meters') defined by a time boundary? For example, was the category created at a specific point in time (like 'installed after 2010')? And if so, does the time boundary relate to the outcome? (e.g., the 2009 billing software migration might have changed how we record data, but not the actual water use?)"
     - Red flags: 
          a) The category is defined by a single time cut (e.g., before/after a date) and the data only exists on one side of that cut (like your example of accounts opened before 2009).
          b) The time boundary might be related to the outcome (e.g., the new meter type was introduced to fix a problem, so we expect it to behave differently).
     - If red flags are raised: then we must question whether the pattern we see is an artifact of the category definition. Output: "Do not extrapolate; the category is time-bound and we cannot assume stability. Budget for uncertainty or use a different category if available." OR if the engineer can argue that the time boundary is irrelevant to the outcome (e.g., the billing software change didn't affect the physical meter performance), then we can proceed but with a note of caution and a shorter horizon.

  Step 4: Causal Mechanism
     - Question: "Do we understand the physical (or causal) mechanism behind this pattern? Can we explain why the number is what it is and why it has been stable?"
     - Sufficient answer: A clear causal story (e.g., pump failures are due to seal wear, and we know the wear rate from material science). If no mechanism, then we rely solely on the pattern and must be more cautious.
     - If mechanism is known and stable: we can be more confident. If not, we note that and may shorten the extrapolation horizon.

  Step 5: External Factors and Change Points
     - Question: "Are there any known external factors (e.g., climate, regulation, population growth, technology) that have changed in the past or are expected to change in the future that could affect this pattern? Have we seen any evidence of such effects in the data?"
     - Sufficient answer: No known changes that would affect the pattern, or if there are, we have data that shows the pattern is robust to such changes (e.g., the pattern held through a period of population growth).
     - If there are upcoming known changes: output "Do not extrapolate beyond the change point; budget for uncertainty" OR if the change is minor or we have data through similar changes, then extrapolate with caution and state a horizon that stops at the change.

  Step 6: Interpolation vs. Extrapolation
     - Question: "Are we extrapolating beyond the range of our data (e.g., predicting for older equipment than we've ever seen) or interpolating within the observed range?"
     - Note: Extrapolation is riskier. If we are extrapolating, we require a causal mechanism (Step 4) to be known and strong. Without it, we should not extrapolate.

  Step 7: Consequences of Being Wrong
     - Question: "What are the consequences if our extrapolation is wrong? (e.g., high: running out of a critical spare part; low: minor budget adjustment next year)"
     - This step doesn't change the stability assessment but might change the decision: if the consequences are high, we should be more conservative.

  III. Decision Rules

  We'll combine the answers to make a decision:

  - If any of Steps 1, 2, 3, or 5 raise a red flag (and the issue cannot be mitigated by a strong causal mechanism), then output: "Do not extrapolate; budget for uncertainty."
  - If no red flags and:
     - Causal mechanism is known and strong (Step 4), then we can extrapolate with a longer horizon (e.g., 5-10 years, but also consider Step 5 about upcoming changes).
     - Without a causal mechanism, but the data is long and stable, we can extrapolate with a shorter horizon (e.g., 2-5 years) and note the uncertainty.
  - The horizon should be set by:
     - The length of the historical data: never extrapolate further than the data history (e.g., if we have 10 years of data, we might set a horizon of 5-10 years, but adjust by other factors).
     - Known change points (Step 5): horizon must stop at the change.
     - The age of the system (Step 6): if extrapolating to older ages than seen, we require causal mechanism and set a short horizon (maybe 1-2 years) or avoid.

  Additionally, at any step if the answer is uncertain or the engineer doesn't know, we flag that the procedure cannot settle and hand back to human judgment.

  IV. What the Procedure Cannot Do

  - It cannot predict genuinely unprecedented events (black swans).
  - It cannot account for unknown unknowns (factors we haven't thought of).
  - It may be too conservative in stable systems with long histories but no known mechanism (because we require mechanism for long horizons).
  - It relies on the honesty and domain knowledge of the engineer answering the questions.

  Now, let's run the three cases:

  Case 1: Pump Failures
  - Step 1: 15 years of data, complete and reliable -> pass.
  - Step 2: Stable rates -> pass.
  - Step 3: The category is "pumps of type X" which has been in use for 20 years, so no time-bound category issue -> pass.
  - Step 4: Known failure mechanism (seal wear) -> strong pass.
  - Step 5: No known external changes -> pass.
  - Step 6: We are extrapolating the failure rate for pumps that are aging, but we have data on pumps up to 15 years old. If we are planning for pumps that will be 16-20 years old, that's extrapolation beyond the data. But with a mechanism, we can do it cautiously.
  - Step 7: Consequences: if we are wrong, we might run out of spare parts -> high consequence, so we must be cautious.

  Decision: We can extrapolate, but set a horizon. Because we have a mechanism, we might set the horizon to 20 years (since we have 15 years, we are extrapolating 5 more). However, note Step 6: we haven't seen pumps older than 15 years. We might set a shorter horizon (say 3-5 years) and then re-evaluate, or use the mechanism to model wear (which might allow a longer horizon). The procedure would output: "Extrapolate, but with a horizon of 5 years (or until the pumps reach 20 years of age)."

  Case 2: Household Demand by Meter Generation (Newest generation only 2 years old)
  - Step 1: 2 years of data -> insufficient history (by our 5-year threshold). This fails Step 1.
  - Step 2: Stable for 2 years, but too short to assess stability -> not sufficient.
  - Step 3: The category is defined by the meter generation, which is time-bound (installed after date X). This raises a red flag because the category is new and we haven't seen how it behaves over time. Also, the time boundary is when the new meters were installed, which is directly related to the outcome (they are a new type). -> red flag.
  - Step 4: Do we have a causal mechanism? We might know the technology, but without data on aging, we don't know how the demand pattern might change as the meter ages. -> mechanism not fully known for long-term behavior.
  - Step 5: No external changes? Maybe, but we haven't seen the meters through their life cycle.
  - Step 6: We are trying to predict for future years (as the meters age) but we have no data on aging for this generation -> extrapolation beyond the data without a proven mechanism.

  Decision: Multiple red flags (Steps 1, 3, and 6). Output: "Do not extrapolate; budget for uncertainty. The category is new and we have insufficient data on its long-term behavior."

  Case 3: Seasonal Demand Pattern (20-year history, but housing stock turnover)
  - Step 1: 20 years of data -> pass.
  - Step 2: Stable for 20 years -> pass.
  - Step 3: The category is "all residential demand" which is not time-bound? Actually, the pattern is for the entire region, but the housing stock is changing. The category isn't defined by a time boundary, but the composition might be changing. This step is about the category definition, not about the composition. So we might pass Step 3, but note that the composition change is a Step 5 issue.
  - Step 4: Do we have a causal mechanism? Seasonal demand is driven by weather and human behavior. We don't have a detailed mechanism that explains how housing stock turnover affects it, so this is a weak point.
  - Step 5: External factors: housing stock turnover (new residents, different water use habits, new appliances). This is a known change that might affect the pattern. We have to ask: has the pattern remained stable during the recent turnover? If yes, then we can be more confident. But if the turnover is recent and we haven't seen a full cycle, then we might have a problem. The engineer might say: "We've seen turnover in the past and the pattern held." But if the current turnover is faster and of a different nature, then it's a concern. If we don't have evidence that the pattern is robust to this change, then Step 5 raises a red flag.
  - Step 6: We are extrapolating the same pattern into the future. It's within the range of what we've seen (same seasons) but under changing conditions. So it's not extrapolation in the sense of going beyond the range, but the context is changing.

  Decision: The critical point is Step 5. If the housing stock turnover has been happening for a few years and we haven't seen a change in the seasonal pattern, then we might proceed. But if the turnover is recent and we haven't seen its full effect, then we should be cautious. Given the high consequence of being wrong (budgeting for water supply) and the lack of a mechanism that explains why the pattern is immune to housing changes (Step 4), we might output: "Extrapolate, but with a short horizon (1-2 years) and monitor for changes." OR if the turnover is very recent and we have no data on its effect, then "Do not extrapolate; budget for uncertainty until we have more data."

  But note: the engineers want to keep extrapolating. The procedure, if the engineer answers Step 5 by saying "we haven't seen an effect yet, but the turnover is ongoing and we don't know the full impact", then we would flag Step 5 and say "Do not extrapolate". However, if the engineer says "we've seen the pattern hold through the last 5 years of turnover, and we don't expect the new housing to behave differently", then we might proceed.

  Given your suspicion, you would argue in the meeting that the turnover is a significant change and we have no data to show the pattern holds under the new housing composition. So the procedure, if answered honestly, might go either way depending on the engineer's answer to Step 5. But note: the procedure requires evidence of robustness. Without evidence (i.e., data showing the pattern holds during the turnover period), Step 5 should be a red flag.

  Therefore, if the turnover has been happening for a few years and the pattern has remained stable, then we can extrapolate (with a note). But if the turnover is very recent and we haven't seen a full year with the new housing, then we cannot. Since you say the turnover has been "fast", and we don't know how many years of data we have during the turnover, we must be cautious.

  In summary, the procedure is designed to surface these issues. It will flag Step 5 and require the engineer to provide evidence of stability during the change. If they cannot, then the output is "Do not extrapolate".

  Finally, note that the procedure has subjective elements (especially Step 5 and Step 4). We must be honest about that. The director should know that the answers to these steps are judgment calls.

  Let me know if you want to adjust any thresholds or steps.
answer: |-
  Below is a structured, user-friendly procedure designed for utility engineers to evaluate whether a historical pattern can be extrapolated. It combines statistical principles (e.g., avoiding "grue-like" predicates, reference class problems) with practical domain knowledge. The procedure is modular, with clear exit points for "do not extrapolate" decisions or handoffs to human judgment. It explicitly flags subjective steps to avoid false precision.

  ---

  ### **Procedure: "Should We Extrapolate This Pattern?"**
  **Input**: A historical pattern (e.g., failure rate, demand) that has been stable for X years.  
  **Output**: One of three decisions:  
  1. **Extrapolate** (state time horizon and uncertainty range).  
  2. **Do not extrapolate; budget for uncertainty** (e.g., use conservative buffers, scenario planning).  
  3. **Inconclusive; hand back to human judgment** (due to ambiguity or critical unknowns).  

  **Who answers**: Domain engineers (no stats needed). You (the statistician) facilitate and interpret.  
  **Time**: Designed for a 1-hour meeting.  
  **Materials Needed**: Historical data plot, policy/code change records, and mechanism documentation (if any).  

  ---

  #### **Ordered Questions & Decision Rules**
  *(Answer each question in order. Stop early if a red flag triggers a "do not extrapolate" decision.)*

  1. **Data History & Stability**  
     - **Question**: "How many years of data do we have? Is the pattern flat (no trend/unexplained jumps) when plotted?"  
     - **Sufficient answer**: ≥5 years of data with no visual trends/jumps in plots. If trends/jumps exist, they must be explained (e.g., "That spike in 2015 was a drought; we adjusted for it").  
     - **Red flags**:  
       - <5 years of data.  
       - Unexplained trends/jumps.  
     - **Decision**:  
       - Red flag → **Do not extrapolate**.  
       - Pass → Proceed to Q2.  

  2. **Category Definition Check (Grue-Safeguard)**  
     - **Question**: "Was the category (e.g., 'Type-A pumps') defined at a specific time? Does its definition depend on a fixed date/event (e.g., 'installed before 2010')? Could the timing of this definition affect the outcome?"  
     - **Sufficient answer**: Category is not tied to a fixed date/event, OR if it is, the date/event is unrelated to the outcome (e.g., "Meter gen-3 was defined in 2020, but that’s just when we started ordering them; it doesn’t affect how they fail").  
     - **Red flags**:  
       - Category is time-bound (e.g., "pre-2009 software migration accounts") AND the time boundary could plausibly influence the outcome (e.g., older software might bias readings).  
       - All data comes from one "side" of a time boundary (e.g., only data after a policy change).  
     - **Decision**:  
       - Red flag → **Do not extrapolate** (time-bound categories are unreliable for extrapolation).  
       - Pass → Proceed to Q3.  

  3. **Mechanism Understanding**  
     - **Question**: "Do we know *why* this pattern exists? Can we explain it physically (e.g., 'seals wear out after 5 years')?"  
     - **Sufficient answer**: Clear mechanism stated (e.g., "Pipe corrosion causes leaks at rate X due to soil pH"). If no mechanism, acknowledge it (e.g., "We see seasonal demand peaks but don’t know why").  
     - **Red flags**: None (this step informs confidence but doesn’t trigger an exit).  
     - **Decision**:  
       - Mechanism known → Higher confidence; set longer horizon.  
       - No mechanism → Lower confidence; requires more caution in Q5.  
       - Proceed to Q4.  

  4. **External Factors & Change Detection**  
     - **Question**: "Are there past/future changes that could break this pattern? (e.g., climate, regulations, population, technology). Has the pattern survived similar changes before?"  
     - **Sufficient answer**: No material changes expected, OR changes exist but pattern remained stable during past tests (e.g., "Demand stayed stable during 2010–2020 population growth").  
     - **Red flags**:  
       - Pending changes (e.g., "New water restrictions start next year") with no data on their impact.  
       - Pattern broke during past changes.  
     - **Decision**:  
       - Red flag → **Do not extrapolate** beyond the change point.  
       - Pass → Proceed to Q5.  

  5. **Interpolation vs. Extrapolation**  
     - **Question**: "Are we predicting within the range we’ve seen (e.g., 3-year-old pumps) or beyond it (e.g., 20-year-old pumps)?"  
     - **Sufficient answer**: Clearly state the range (e.g., "We have data for pumps aged 1–15 years; we’re predicting for 16–20 years").  
     - **Red flags**: None (informs horizon).  
     - **Decision**: Proceed to Q6.  

  6. **Consequences of Being Wrong**  
     - **Question**: "How bad is it if we’re wrong? (e.g., 'Spare parts run out' = high; 'Minor budget tweak' = low)."  
     - **Sufficient answer**: Qualitative assessment (high/medium/low).  
     - **Red flags**: None (informs conservatism).  
     - **Decision**: Proceed to final decision.  

  ---

  #### **Final Decision Rules**
  Combine answers to choose:  
  - **Extrapolate** if:  
    - No red flags in Q1–Q4.  
    - Horizon = **minimum** of:  
      - 50% of data history (e.g., 7.5 years for 15-year data).  
      - Time until next expected change (from Q4).  
      - 5 years if mechanism exists (Q3); 2 years if no mechanism.  
    - *Output*: "Extrapolate for [horizon] years, with [low/medium/high] uncertainty. Monitor annually."  
  - **Do not extrapolate** if:  
    - Any red flag in Q1, Q2, or Q4.  
    - *Output*: "Budget for uncertainty: use [buffers/scenarios] based on Q6 consequences."  
  - **Hand back to human** if:  
    - Conflicting evidence (e.g., "Mechanism exists but major change coming" in Q4).  
    - Ambiguous answers (e.g., "Don’t know" in Q3 or Q4).  
    - *Output*: "Inconclusive due to [reason]. Human judgment required."  

  ---

  ### **What the Procedure Cannot Do**
  1. **Predict unprecedented "black swans"**: E.g., a sudden regulatory change or natural disaster.  
  2. **Handle sparse data**: If data is patchy (<5 years) or missing key variables, it defaults to "do not extrapolate."  
  3. **Override expert judgment**: Subjective steps (Q3, Q4, Q6) require honest domain input. False confidence here breaks the procedure.  
  4. **Replace causal models**: It screens for extrapolation risk but doesn’t build predictive models (that’s your job).  
  5. **Resolve deep uncertainty**: If the world changes fundamentally (e.g., new technology), historical data may become irrelevant.  

  ---

  ### **Case Applications**
  **Case 1: Pump Failures (15-year stable rate; seal wear mechanism)**  
  - Q1: 15 years, stable → Pass.  
  - Q2: Category ("Type-B pumps") not time-bound → Pass.  
  - Q3: Mechanism known (seal wear) → High confidence.  
  - Q4: No external changes → Pass.  
  - Q5: Predicting within data range (pumps ≤15 years old) → Pass.  
  - Q6: High consequence (spare parts shortage).  
  - **Decision**: **Extrapolate** for 7.5 years (50% of data history). Horizon could extend to 10 years due to strong mechanism, but Q6 consequences suggest conservative 7.5-year cap.  

  **Case 2: Household Demand by Meter Generation (2-year data; new meters)**  
  - Q1: Only 2 years of data → **Red flag** (insufficient history).  
  - Q2: Category ("Gen-4 meters") defined by 2022 rollout → Time-bound. Engineers admit rollout could affect demand (e.g., new tech) → **Red flag**.  
  - **Decision**: Stop at Q2 → **Do not extrapolate**. Budget for uncertainty (e.g., use demand range from older gens).  

  **Case 3: Seasonal Demand Pattern (20-year stability; housing turnover)**  
  - Q1: 20 years, stable → Pass.  
  - Q2: Category ("residential demand") not time-bound → Pass.  
  - Q3: No mechanism (pattern is empirical; no physics of housing turnover) → Low confidence.  
  - Q4: Housing turnover accelerating → **Red flag** (no data on how demand responds to rapid turnover). Engineers cannot confirm stability during past turnover.  
  - **Decision**: **Do not extrapolate** (Q4 red flag). Budget for uncertainty (e.g., ±20% buffer). *You were right; engineers overrelied on history despite changing context.*  

  ---

  ### **Key Weaknesses & Mitigations**
  - **Subjective steps**: Q3 (mechanism) and Q4 (external factors) rely on engineer honesty. Mitigation: You play "devil’s advocate" in meetings (e.g., "What if housing turnover *does* affect demand?").  
  - **Horizon arbitrariness**: The 50% data history rule is heuristic. Mitigation: Use shorter horizons for high-consequence items (Q6).  
  - **Grue-like blind spots**: Q2 catches most time-bound issues, but novel predicates (e.g., "meters in neighborhoods with >50% solar homes") may slip through. Mitigation: Document all category definitions.  
  - **False negatives**: Stable patterns with unknown mechanisms (e.g., seasonal demand) may be unduly rejected. Mitigation: Use the "hand back to human" exit for edge cases.  

  This procedure makes implicit biases explicit, separates statistical risk from domain risk, and forces conversations about uncertainty. It won’t eliminate disputes (e.g., Case 3), but it grounds them in auditable logic. If the director signs off, attach the completed Q&A as an appendix—so everyone sees where judgment was applied.
