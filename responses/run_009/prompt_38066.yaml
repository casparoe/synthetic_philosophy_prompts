  ## Dialogue: The Single Flip

  **Setting:** A sunny kitchen. Uncle Martin (71, retired geophysicist) pours coffee for his nephew, Ben (late 20s, intense energy). A notepad with calculations lies between them.

  **Ben:** (Leaning forward) Look, Uncle Marty, the math is *clear*. Favourable bet, p=0.5, b=2 – payout ratio is three times stake, so net gain is double stake on win. Kelly fraction is f* = p - q/b = 0.5 - 0.5/2 = 0.25. Quarter of the pot. $150k. It maximizes the *geometric* growth rate, even for this one bet!

  **Martin:** (Sipping coffee, calm) Ben, slow down. Geometric growth rate? For *one* flip? What sequence? What growth? It’s a singularity. I either gain $300k or lose $150k. That’s it. Game over.

  **Ben:** But it’s *not* game over! That’s the whole point Peters makes! Losing that $150k isn't just losing money. It’s potentially derailing your *entire future financial sequence*. You can’t play future ‘games’ – cover unexpected medical costs, help grandkids, enjoy that Alaskan cruise – if you take a big hit. Kelly protects against ruin, against being knocked out of the game permanently. That’s why time averages matter, not ensemble averages where you get infinite parallel tries.

  **Martin:** Okay, that’s a genuine hit. I concede I wouldn't bet the *whole* $600k on a 50/50 double-or-nothing. That proves my utility isn’t linear. But that’s my point! If I’m maximizing *my* expected utility, EU = p * U(W + gain) + (1-p) * U(W - loss), the optimal bet depends entirely on the *shape* of U(W). If U(W) = log(W), then voila! Kelly falls out naturally: you bet f* = 25%. But it’s not a rival *theory* to expected utility; it’s a *consequence* of assuming log utility. You just have a hunch U(W) = log(W) is the ‘right’ utility for humans.

  **Ben:** (Shaking his head) You’re missing the ergodicity! Expected utility assumes you can average over possible worlds *simultaneously*, like parallel universes. But you, Uncle Marty, live in *one* timeline. You experience wealth *sequentially*. The relevant measure isn’t the ensemble average <U(W)>, it’s the long-term *time average* growth rate, (1/T) * log(W_T / W_0). Kelly maximizes *that*. For *this* flip, betting f* gives the highest *expected* growth rate for the trajectory starting *now*. Even one step matters for the path.

  **Martin:** Hold on. Define ‘growth rate’ for a sequence of length one. What is the ‘time average’? W_T / W_0 *is* my terminal wealth ratio right after this single flip! How is maximizing E[log(W_1 / W_0)] fundamentally different from maximizing E[U(W_1)] with U=log? It looks identical! Your ‘time average’ for T=1 collapses to my EU with log utility. Where’s the operational difference?

  **Ben:** The difference is in the *interpretation* and the *focus on survival*. Log utility *emerges* as the correct tool *because* it maximizes the long-run growth rate and avoids ruin. It’s not an arbitrary psychological curve; it’s the mathematical consequence of caring about multiplicative growth and not going broke in a non-ergodic world. That bet you wouldn’t take – the 50/50 double-or-nothing on the whole pot? Revealed preference! Your utility isn’t linear, sure. But it’s probably not purely log either. Would you *really* be okay losing $150k? That suggests a utility function flatter than log for losses, steeper for gains maybe – but Kelly gives a robust anchor point *despite* that uncertainty, precisely because it guards against ruin.

  **Martin:** (Nodding slowly) So, you’re saying Kelly isn’t *just* EU with log utility. It’s a prescription derived from prioritizing the avoidance of financial extinction over a sequence of bets, where even a single bet is considered one step in the *inherent sequence* of my remaining financial life. And you argue this perspective is fundamentally different from just picking a concave utility function, because it directly addresses the non-repeatability of a mortal’s financial path.

  **Ben:** Exactly! And that’s why f* = 25% isn’t just aesthetics. It balances growth against the catastrophic risk of being removed from the game.

  **Martin:** And I’m saying that framing the catastrophic risk of ruin for a single bet *is* captured by a sufficiently steep utility function as wealth approaches zero within the standard EU framework. So Kelly *is* subsumed by EU with a specific, perhaps well-motivated, utility function choice.

  **Ben:** But the *motivation* for choosing log *is* the growth/ruin argument! That’s not arbitrary psychology.

  **Martin:** Agreed. So perhaps the core question is this: **Is the ‘ruin avoidance’ argument for a single bet fundamentally distinct from standard expected utility maximization with a utility function that assigns infinite negative utility to ruin, or is it simply a compelling reason to adopt a logarithmic (or similarly shaped) utility function within that classical framework?**

  **Ben:** (Takes a breath) Yes. That’s the heart of it. Does the ergodic/non-ergodic framing and the focus on time-averaged growth in a single life provide a *new theoretical foundation* justifying Kelly, or does it merely provide a powerful *rationale* for a particular utility function shape within the existing EU paradigm?

  **Martin:** Precisely stated. More coffee?

  **(End Dialogue)**

  **The Substantive Question:** Your disagreement is **substantive**, not merely verbal. Ben argues the ergodicity economics perspective fundamentally redefines the problem: wealth is a temporal trajectory, not a static state, and ruin is a terminal state removing future opportunity. This necessitates maximizing growth rate per period, inherently leading to Kelly. You argue that standard EU *can* encompass this by defining a utility function where the disutility of ruin is catastrophic (e.g., U(W) -> -∞ as W -> 0+), and that log utility is one way (perhaps the most natural) to achieve this. The substance lies in whether the ergodic framing offers a *new optimization principle* (growth rate maximization in a single path) genuinely distinct from maximizing the expectation of a path-dependent utility function within the classical framework. Ben sees a paradigm shift; you see a powerful motivation within the existing paradigm. Both positions have merit and aren't just talking past each other. The adjudication likely hinges on one's philosophical stance on the primacy of "growth rate" vs. "utility expectation" as the fundamental objective for financial decisions in a non-repeatable life. Your wife was wise to abstain.
