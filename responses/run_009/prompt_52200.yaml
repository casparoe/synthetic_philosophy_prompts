prompt: |-
  The Carnegie Hero Fund, a private foundation established in Pittsburgh in 1904, awards the Carnegie Medal to civilians in the United States and Canada who knowingly and voluntarily risk death or serious physical injury to an extraordinary degree in saving, or attempting to save, another person's life — and it accompanies the medal with scholarship aid, disability assistance, and death benefits for the dependents of rescuers killed in the attempt. Its eligibility rules are strict. Members of the armed forces, firefighters, police, and others whose vocations require rescue work are generally excluded unless the act was clearly beyond the line of duty; the rescuer must bear no responsibility for the peril, so anyone who caused the danger is ineligible; family members of the victim are excluded except where the rescuer died or was gravely injured; and children too young to comprehend the risk do not qualify. Meanwhile, the legal background is strikingly different: common-law jurisdictions impose no general duty to aid a stranger in peril even at trivial cost to oneself, whereas several civil-law systems criminalize the failure to render easy assistance.

  What theory of obligation and merit does this practice presuppose? Reconstruct its implicit account of duty and supererogation, attending in particular to: the exclusion of line-of-duty rescuers, which seems to presuppose that duty is indexed to role rather than to anything about the act itself; the family-member exception, which seems to presuppose both that special relationships generate duties and that dying or being gravely injured can push a duty-conforming act beyond duty; the extraordinary-risk threshold, which seems to presuppose a permission to weigh one's own life very heavily against a stranger's; the awarding of medals for failed attempts, which presupposes that merit attaches to risk willingly run rather than to lives saved; and the cash payments, which presuppose that society compensates sacrifice it did not require — even though it does, after all, pay firefighters for risk they were obligated to take. Where does the practice strictly presuppose one theory of these matters rather than merely fitting several, and what would have to change — in the eligibility rules, the payments, or the no-duty legal background — if we adopted instead the view that easy rescue is simply obligatory?
reasoning: |-
  Hmm, the user is asking about the Carnegie Hero Fund's theory of obligation and merit. They want me to reconstruct the implicit account of duty and supererogation based on the eligibility rules and contrast it with other theories. Let me break down each component they mentioned.

  First, the exclusion of line-of-duty rescuers. That suggests duty is role-dependent. Firefighters or police doing their job aren't eligible unless the act goes beyond their duty. So the Carnegie rules are separating duties arising from roles versus voluntary actions by civilians. That points to a role-relative duty theory.

  Then, the family-member exception. Normally, saving family doesn't count, except if the rescuer dies or is gravely injured. This implies that special relationships create duties to aid (like familial obligations), so saving family is expected, not supererogatory. But if the rescuer dies or is severely injured, that action becomes beyond duty, even if there was a prior obligation. This introduces a threshold where extreme sacrifice transforms a duty into supererogation.

  The extraordinary-risk threshold is important too. Rescuers must risk death or serious injury to an extraordinary degree. That suggests individuals have a permission to prioritize their own life over a stranger's. So there's no general duty to save strangers at high personal risk. This aligns with the legal no-duty rule mentioned. The Carnegie Medal thus honors those who go beyond this permission, entering supererogation territory.

  Awarding medals for failed attempts shows that merit is tied to the willingness to risk oneself, not the outcome. It's about the intention and the risk taken, not success. This emphasizes the subjective aspect of merit—voluntary risk-taking matters more than the result.

  Now, the cash payments. Society compensates these sacrifices even though it didn't require them. But why pay civilians for risks not obligated, while firefighters get paid for risks that are part of their job? This highlights that the payments are compensatory for supererogatory acts, not wages for duties. The fund acts as a societal mechanism to acknowledge and support those who go beyond.

  The user also asks where the practice strictly presupposes one theory. The exclusion of role-based rescuers strictly requires a role-relative duty theory. If duties were universal, excluding professionals wouldn't make sense. Also, the extraordinary-risk threshold and no-duty legal background strictly require the permission to prioritize self over strangers. Without that, risking extraordinary harm would be obligatory, not supererogatory.

  If easy rescue were obligatory, what would change? Eligibility rules would have to include those who perform easy rescues, but currently, the Carnegie Medal requires extraordinary risk. The payments might need restructuring since compensation for duty-fulfillment is different. The legal background would shift to criminalize failure to rescue, affecting the societal view of obligation.

  I should also consider how the family exception plays into special duties versus general duties. The exception reinforces that familial duties exist, but extreme sacrifice elevates the act. This nuanced view distinguishes levels of obligation and supererogation.

  Putting it all together, the Carnegie Hero Fund's framework is built on a combination of role-relative duties, special relationship duties, permissions for self-preference, and merit based on risk and intent. It strictly relies on these theories to define what counts as beyond duty. Changing to an easy-rescue-is-obligatory view would dismantle the current structure, requiring redefinition of eligibility, payments, and aligning laws to enforce rescue duties.
answer: |-
  The Carnegie Hero Fund's practice presupposes a nuanced theory of moral obligation and merit that distinguishes sharply between **duty** and **supererogation**, with duty tied primarily to **role-specific obligations and special relationships**, while supererogation arises from **voluntary, extraordinary sacrifice for strangers beyond social expectations**. Below is a reconstruction of its implicit account, followed by analysis of strict presuppositions and implications of adopting an "easy rescue is obligatory" view.

  ---

  ### **Reconstructed Theory of Obligation and Merit**
  1. **Duty as Role-Relative and Relationship-Bound**  
     - The exclusion of firefighters, police, and military personnel *unless acting beyond their line of duty* presupposes that **duties are indexed to social roles and contracts**, not universal moral principles. Rescue becomes obligatory when it falls within one's professional responsibility.  
     - The family-member exception (excluded unless the rescuer dies/suffers grave injury) presupposes **special relationships generate duties of aid** (e.g., parents owe care to children). Saving a family member is thus often seen as fulfilling a duty, not supererogation. Only extreme sacrifice elevates it beyond duty.

  2. **Supererogation as Voluntary, Extraordinary Risk for Strangers**  
     - The "extraordinary-risk threshold" (risk of death/serious injury) presupposes **no general duty to aid strangers at high personal cost**. Individuals are permitted to weigh their own life heavily against a stranger's.  
     - Awarding medals for *failed attempts* confirms that **merit resides in the willful acceptance of risk**, not outcomes. The moral worth lies in the intention and self-endangerment.  
     - The exclusion of those who "caused the peril" reinforces that supererogation requires **pure altruism**—no prior responsibility for the danger.

  3. **Compensation as Rectification for Non-Obligatory Sacrifice**  
     - Cash payments (scholarships, death benefits) presuppose **society owes compensation for sacrifices it did not demand**. This contrasts with paying firefighters, which is *wages for contracted duties*. The Fund treats civilian rescuers as volunteers who deserve reciprocity for acts society could not obligate.

  4. **Legal Background as Foundational**  
     The common-law "no duty to rescue" doctrine is essential. It establishes that **failure to save a stranger is permissible**, making voluntary rescue a "gift" rather than an obligation. Civil-law systems (criminalizing easy rescue noncompliance) would conflict with this framework.

  ---

  ### **Where the Practice Strictly Presupposes One Theory**
  - **Role-Relative Duty**: The exclusion of professionals *strictly requires* that duty derives from roles/contracts. If duty were universal (e.g., Kantian or utilitarian), excluding police for "in-duty" rescues would be incoherent.  
  - **No General Duty to Strangers**: The extraordinary-risk threshold *strictly presupposes* a permission to prioritize self-preservation. If easy rescue were obligatory, risking "extraordinary" harm could not define supererogation.  
  - **Merit as Risk-Based Intent**: Honoring failed attempts *strictly requires* that merit attaches to subjective willingness to sacrifice, not consequences. A consequentialist view (merit = lives saved) would reject this.

  ---

  ### **Changes Under an "Easy Rescue is Obligatory" View**
  If society adopted the view that **easy rescue is a universal duty** (as in civil-law jurisdictions), the Carnegie framework would collapse or require radical revision:  

  1. **Eligibility Rules**  
     - The "extraordinary-risk" threshold would be irrelevant for easy rescues, as they would now be obligatory. Medals might instead focus on *exceptional compliance* (e.g., extreme efficiency).  
     - Professionals could no longer be excluded for "in-duty" rescues—if rescue is everyone’s duty, role distinctions blur.  
     - Family exceptions might vanish, as saving kin would be obligatory, not supererogatory.  

  2. **Payments**  
     - Cash benefits for rescuers would shift from *compensating supererogation* to *rewarding duty compliance* (like hazard pay). Death benefits might resemble workers’ compensation, not "gratitude."  
     - The Fund’s rationale—"society compensates sacrifice it did not require"—would be obsolete if sacrifice were required.  

  3. **Legal Background**  
     - Adopting a duty-to-rescue law (e.g., "Bad Samaritan" statutes) would redefine non-rescue as culpable. The Carnegie Medal’s celebration of voluntary heroism would lose its moral contrast with baseline obligations.  

  4. **Conceptual Implications**  
     - Supererogation could only apply to *hard* rescues (high risk/cost), but even these might be debated as obligatory under strong altruistic theories (e.g., effective altruism).  
     - The medal’s symbolic meaning would change: from honoring "beyond duty" sacrifice to incentivizing duty compliance.

  ---

  ### **Conclusion**
  The Carnegie Hero Fund presupposes a **hybrid theory**: duties arise from roles/relationships, while supererogation involves voluntary, high-risk sacrifice for strangers in a context where no such duty exists. It strictly requires **role-relativism about duties**, **permission for self-preference**, and **merit as risk-based intent**. Adopting "easy rescue as obligatory" would dismantle its core distinctions, collapsing supererogation into duty and transforming the Fund into a mere reward system for compliance. The practice thus stands as a monument to a moral worldview where heroism is defined by *elective, extraordinary generosity*, not enforceable obligation.
