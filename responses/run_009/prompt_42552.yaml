  ok so I've been a rationalist blog reader since the old Overcoming Bias days, lurked LW through the redesigns, etc etc, and lately I've been going back through the Dennett vs Searle stuff on intentionality. specifically the two-bitser thought experiment — Dennett's imaginary vending machine that dispenses a can for two quarters, where the whole point is that the machine's coin-checking mechanism only looks like it "knows" what a quarter is because its designers built it that way, in an environment full of quarters. ship it to a country where the local coins happen to trip the same sensors and suddenly the question "does the machine believe it got two quarters, or two of the local coins?" has no fact of the matter independent of the design history — all the way down to Searle's own brain, whose intentionality is itself derived from evolution rather than stamped in intrinsically. or at least that's Dennett's move. anyway, I want a satire of this written for my blog's "weird philosophy humor" tag and I know I'd botch it myself. here's the request:

  Write a consumer product recall notice, roughly 600-700 words, from the fictional manufacturer of the Two-Bitser™ vending machine, in deadpan corporate-legalese voice. The setup: the machines were designed and calibrated in the US to accept two quarters, and the recall is triggered by a batch being relocated overseas, where the local two-unit coins happen to pass the same tests the quarters did. The legal team now has to draft language about what the machine "believes," and they keep almost noticing that the machine's aboutness was derived from them all along — their intentions, their design docs, their mission statement — which raises the uncomfortable question of where *their* aboutness came from (evolution? culture? Acme's shareholders?), and they keep flinching away from that question right before it lands. Somewhere include a consultant who is an obvious Searle stand-in: he insists the machine never had any beliefs in the first place, only they (the humans) do, intrinsically, and the company finds this position bizarrely useless for deciding whether to refund anyone. The humor has to come from the actual dialectic — derived vs. original/intrinsic intentionality, the intentional stance, the idea that natural selection is just design with no designer — not from generic "lol machines are dumb" jokes. End with a refund clause that quietly takes a side on whether the Searle-figure's own beliefs are just a better-engineered version of the same trick. The corporate voice should never break — no winking at the reader.

