  ### **Notes on Non-Separating Cases & Traps**  
  - **Ellsberg Trap (Choice 6)**: Does *not* distinguish EU from RWEU! Choosing A sorts you as **ambiguity-averse**, a separate phenomenon. Neither theory natively explains this; it requires extensions (e.g., subjective probabilities).  
  - **Non-Separating Case (Choice 8)**: EU with concave utility and cautious RWEU both choose A. This question does no separating work—it only checks consistency.  
  - **Underdetermination Warnings**:  
    - The Rabin sequence (2, 3, 5, 9) only diagnoses EU violations. It cannot identify *which* non-EU model (RWEU, prospect theory, etc.) explains them.  
    - Allais pairs (1 & 4) separate EU from non-EU but cannot distinguish RWEU from other weighted-utility models.  
    - Choices 8 and 10 rely on parametric assumptions; they work best with supporting data (e.g., Rabin rejections).  

  ### **Conclusion**  
  This instrument reliably identifies strict EU compliance (I) and stochastic dominance violations (V). For non-EU patterns, it distinguishes global cautious (II) and daring (III) RWEU *if* choices in 8 and 10 align cleanly, but **openly acknowledges** when patterns are consistent with multiple theories (e.g., II’s "cautious non-EU" label). It intentionally fails to separate RWEU from rank-dependent or prospect theory without theory-laden questions—aligning with your goal of purity. Use the quiz to spark debate, then reveal how theories explain the patterns!  

