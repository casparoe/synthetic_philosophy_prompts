  ### **Quiz: Which Decision Theory Do You Actually Hold?**  
  *Instructions: For each scenario, choose one option. Assume gambles are one-off opportunities and outcomes are total wealth changes (no prior stakes).*

  1. **Choice 1:**  
     - Option A: $1,000,000 for sure.  
     - Option B: 10% chance of $5,000,000, 89% chance of $1,000,000, 1% chance of $0.  

  2. **Choice 2 (wealth = $1,000):**  
     - Option A: 50% chance to lose $100, 50% chance to gain $110.  
     - Option B: Keep $1,000 (do nothing).  

  3. **Choice 3 (wealth = $2,000):**  
     - Option A: 50% chance to lose $100, 50% chance to gain $110.  
     - Option B: Keep $2,000 (do nothing).  

  4. **Choice 4:**  
     - Option A: 11% chance of $1,000,000, 89% chance of $0.  
     - Option B: 10% chance of $5,000,000, 90% chance of $0.  

  5. **Choice 5 (wealth = $5,000):**  
     - Option A: 50% chance to lose $100, 50% chance to gain $110.  
     - Option B: Keep $5,000 (do nothing).  

  6. **Choice 6:**  
     Urn A has 50 red balls and 50 black balls. Urn B has 100 red/black balls in unknown proportions. You draw one ball blindly.  
     - Option A: Win $100 if red from Urn A, $0 if black.  
     - Option B: Win $100 if red from Urn B, $0 if black.  

  7. **Choice 7:**  
     - Option A: 60% chance of $100, 40% chance of $50.  
     - Option B: 60% chance of $100, 40% chance of $0.  

  8. **Choice 8:**  
     - Option A: $10 for sure.  
     - Option B: 95% chance of $20, 5% chance of losing $100.  

  9. **Choice 9 (wealth = $1,000):**  
     - Option A: 50% chance to lose $1,000, 50% chance to gain $1,000,000.  
     - Option B: Keep $1,000 (do nothing).  

  10. **Choice 10 (wealth = $100):**  
      - Option A: Keep $100 (do nothing).  
      - Option B: 1% chance of $1,000, 99% chance of losing $10.  

  ---

  ### **Scoring Key**  
  *Map your answers to the categories below. Patterns are assessed holistically; no single answer is decisive. Limits of the instrument are noted in **bold**.*  

  #### **I. Strict Expected-Utility (EU) Maximizer**  
  *(Risk attitudes only via utility function)*  
  - **Pattern**:  
    - Choices 1 & 4: Both A or both B (no Allais paradox).  
    - Choices 2, 3, 5, 9: If you chose B in all three small-stakes bets (2, 3, 5), you must choose B in 9 (no Rabin violation).  
    - Choice 7: A (avoids stochastic dominance violation).  
  - **Most awkward commitment**: If you reject favorable small-stakes bets (2, 3, 5), you must also reject the wildly favorable bet in 9, no matter how large the gain.  
  - **Note**: Choices 6, 8, and 10 do not separate EU from alternatives (see below).  

  #### **II. Risk-Weighted EU (RWEU) Maximizer, Globally Cautious Risk Function**  
  *(Overweights worst outcomes; risk-aversion via function r(p) and utility)*  
  - **Pattern**:  
    - Choices 1 & 4: A in 1, B in 4 (Allais paradox).  
    - Choice 8: A (rejects gamble).  
    - Choice 10: A (rejects gamble).  
    - Choice 7: A.  
  - **Most awkward commitment**: You reject gamble 10 despite its positive expected value and tiny loss probability, as any gamble with a loss chance must be skewed massively in your favor to be acceptable.  
  - **Honesty limit**: **This pattern cannot distinguish RWEU from rank-dependent utility or prospect theory with loss aversion. Label: "Cautious non-EU, mechanism underdetermined".**  

  #### **III. Risk-Weighted EU Maximizer, Globally Daring Risk Function**  
  *(Overweights best outcomes; risk-seeking via r(p) and utility)*  
  - **Pattern**:  
    - Choices 1 & 4: B in both (consistent Allais).  
    - Choice 8: B (accepts gamble).  
    - Choice 10: B (accepts gamble).  
    - Choice 7: A.  
  - **Most awkward commitment**: You accept gamble 10 despite a 99% chance of a net loss ($90 outcome) for a 1% gain, as you overweight tiny chances of extreme gains.  
  - **Honesty limit**: If you chose B in all small-stakes Rabin bets (2, 3, 5), **this pattern cannot distinguish daring RWEU from EU with risk-loving utility**.  

  #### **IV. Risk-Weighted EU Maximizer, Mixed/Locally Varying Risk Function**  
  *(Context-dependent caution/daring; not globally consistent)*  
  - **Pattern**:  
    - Exhibits Allais paradox (A in 1, B in 4) but does not fit "cautious" or "daring" globally (e.g., A in 1, B in 4, but B in 8 or A in 10; or B in 1, A in 4).  
    - Avoids stochastic dominance (A in 7).  
  - **Most awkward commitment**: Your risk attitude shifts inconsistently—e.g., avoiding small losses in some contexts (A in 8) but chasing longshots in others (B in 10).  
  - **Unoccupied in practice?**: Rare but coherent; often a stepping stone to global models.  

  #### **V. Pattern Not Representable by EU or RWEU**  
  *(Violates core rationality constraints)*  
  - **Pattern**:  
    - Choice 7: B (chooses stochastically dominated option).  
    OR  
    - Rabin violation: B in 2, 3, 5 (rejects all small-stakes bets) and A in 9 (accepts large-stakes bet), *plus* no Allais paradox (fits EU otherwise).  
  - **Most awkward commitment**: Choosing B in 7 means you prefer a gamble giving you less money in every possible outcome state.  
  - **Unoccupied?**: Rare empirically; violates statewise dominance (incoherent under any theory).  

