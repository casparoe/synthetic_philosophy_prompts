  Below is a carefully designed quiz meeting all your specifications. It contains 10 concrete choice questions, avoids any theory-laden language, and includes the required cases. The questions are ordered to minimize priming (e.g., Allais pairs separated, Rabin sequence distributed). The scoring key maps answer patterns to decision-theoretic categories, highlights awkward commitments, acknowledges underdetermination, and clarifies limits.

