prompt: |-
  My roommate is taking a decision theory course and tried to explain Good's theorem to me after dinner, and something about his version felt off but I can't put my finger on it. Paraphrasing him as faithfully as I can: Good proved that information is always good for you — the expected utility of making a decision after you recieve some new evidence is always at least as high as the expected utility of deciding without it, and strictly higher whenever the evidence could change what you'd end up doing. Since the information is assumed to be free, the upshot (per my roommate) is that a rational agent should never turn down a free peek at anything, so people who avoid opening their medical test results, or who don't want to know their genetic risk profile, are being irrational by definition. He also said this is basically the formal version of knowledge is power, and that it holds for any rational agent, not just expected utility maximizers, and since it's a theorem it's not up for debate the way most psychology-of-reasoning claims are.

  So I'd like you to audit this. Go through it piece by piece: which parts would a decision theorist sign off on, which parts are subtle conflations or overstatements, and does the conclusion about refusing to look at test results actually follow from the accurate core? A few things I'm specifically wondering about, but feel free to go beyond them: (1) it seems like the theorem is about expected value *before* you look, so is there a difference between never regretting information in expectation and never regretting it given what you actually saw? (2) how much work is the word "free" doing — does it cover just money or also effects like dread, or effects the information has on you that don't run through your later choices? (3) is my roommate right that it applies to any rational agent, or does it lean on the expected-utility structure specifically — like, is there a coherent risk-averse agent who'd genuinely be worse off from free information? and (4) is there anything to the thought that an agent who *can't commit* to ignoring what she learns is different from one who can? Basically I want to know whether "I'd rather not know" can be rational or whether I'm just being squeamish.
reasoning: |-
  Okay, let me tackle this user's query about Good's theorem and their roommate's interpretation. The user wants to know if their roommate's claims hold up under scrutiny, especially regarding whether avoiding medical test results is irrational.

  First, I need to recall Good's theorem accurately. The theorem states that, under expected utility theory, acquiring free information has non-negative expected value. The key points here are that the information is costless and doesn't directly affect utility—only through influencing decisions. The user's roommate seems to have oversimplified this by ignoring psychological costs and commitment issues.

  The user's specific questions are crucial. For (1), the theorem deals with ex-ante expectations, not ex-post regret. It's possible to regret information after seeing bad results, even if it was beneficial in expectation. The roommate conflates these two perspectives.

  For (2), "free" is doing heavy lifting. The theorem assumes no costs—monetary, psychological, or otherwise. Real-world scenarios like medical tests often involve anxiety or dread, which aren't accounted for. If the information causes distress, refusing it could be rational. The roommate's claim ignores these subjective costs.

  Question (3) challenges the universality of the theorem. While Good's proof relies on expected utility theory, other rational models might differ. Ambiguity-averse agents, like those in Ellsberg scenarios, might prefer ignorance to avoid unresolved uncertainty. Risk aversion alone doesn't change this, but aversion to ambiguity could justify avoiding information.

  For (4), commitment is a big factor. If an agent can't commit to ignoring harmful information, they might avoid it altogether. Precommitment strategies, like Ulysses contracts, show how rational agents might choose ignorance to prevent future irrational actions. The roommate overlooks that self-binding can be rational.

  The medical test example is central. People avoiding results might fear psychological distress or feel powerless to act. If knowing increases anxiety without changing outcomes (like untreatable conditions), avoiding info preserves current utility. Calling this irrational ignores real human factors.

  The roommate's claim that "knowledge is power" oversimplifies. Information's value depends on actionable choices and psychological resilience. Without the ability to act or manage emotional fallout, information can be harmful. The theorem's assumptions don't hold in such cases, making avoidance rational.

  In conclusion, Good's theorem has strong assumptions: costless info, only instrumental value, ability to act on it. Real-world deviations mean refusing information can be perfectly rational. The roommate's view is too narrow, ignoring psychological and practical nuances.
answer: |-
  Let's audit your roommate's explanation of Good's theorem piece by piece, separating the solid decision-theoretic core from common overinterpretations and misapplications. Good's theorem (formally, the *value of information* theorem) is indeed a foundational result, but its real-world implications are narrower than often claimed.

  **The Accurate Core of Good's Theorem:**
  1.  **Formal Statement:** For an expected utility maximizer facing a decision under uncertainty, the *expected* utility of first acquiring *costless* information and *then* making a decision is *at least as high* as the *expected* utility of making the decision immediately without that information.
  2.  **Key Assumptions:**
      *   **Rational Agent:** The agent must be an *expected utility maximizer* (or satisfy equivalent axioms like Savage's).
      *   **Costless Information:** Acquiring the information has *no direct cost* (money, time, effort, psychic distress).
      *   **Instrumental Value Only:** The information's *only* value is its potential to influence the agent's future *choice* to get a better outcome. It has no intrinsic value (pleasure of knowing) or disvalue (dread, anxiety). It doesn't change the underlying state of the world or the agent's utility function.
      *   **Full Agency:** The agent *will* optimally use the information when making their subsequent decision.
      *   **Ex-ante Perspective:** The comparison is made *before* the information is acquired, based on the agent's current beliefs and expectations.
  3.  **The "Strictly Higher" Condition:** The expected utility is strictly higher if and only if there is a positive probability that the information will cause the agent to choose a *different action* than they would have chosen without it, *and* that different action leads to a better outcome given the true state. Information that merely confirms what you'd do anyway has zero marginal value.

  **Auditing Your Roommate's Claims:**

  1.  **"Information is always good for you (expected utility wise)":** **Largely Correct, within strict assumptions.** This is the core conclusion *ex-ante* for expected utility maximizers when information is free and only instrumentally valuable. It's a statement about the *expectation* before seeing the information.

  2.  **"Expected utility... is always at least as high... strictly higher whenever the evidence could change what you'd end up doing":** **Correct.** This precisely captures the core mathematical result.

  3.  **"A rational agent should never turn down a free peek at anything":** **Overstatement & Misapplication.** This is where the leap from abstract theorem to real-world prescription goes wrong. It ignores the critical assumptions:
      *   **"Free" ≠ Just Monetary:** "Free" means *zero cost in any dimension relevant to utility*. Psychological costs (dread, anxiety, loss of hope, damaged self-image) are *very real* utility costs. Good's theorem **assumes these costs do not exist**. If opening a medical result causes significant dread *regardless of the outcome*, that's a direct utility loss the theorem ignores. Avoiding this disutility is perfectly rational.
      *   **"Peek at anything":** The theorem applies to information *relevant to the impending decision*. Peeking at irrelevant information (e.g., the number of stars in Andromeda before choosing lunch) has zero expected value (but also zero cost, so indifference is rational). Peeking at information that *only* causes disutility (e.g., graphic images you find horrifying) is actively harmful.
      *   **"Could change what you'd end up doing":** This assumes there *is* an impending decision where the information is actionable. If a condition is untreatable and knowing won't change your behavior (only cause anxiety), the "strictly higher" condition fails, and the expected value is zero *at best*, potentially negative due to psychological costs.

  4.  **"People who avoid opening medical test results... are irrational by definition":** **False.** This is the most problematic claim. Rationality depends entirely on the *agent's utility function* and the *full context*:
      *   **Psychological Costs:** If the *process of knowing* causes significant anxiety or dread (a disutility), avoiding it maximizes expected utility. Good's theorem doesn't apply because information isn't costless.
      *   **Lack of Actionability:** If the test result (positive or negative) won't change the person's planned actions (e.g., "I won't pursue treatment even if positive"), then the information has no instrumental value. Knowing might only bring dread (if positive) or temporary relief (if negative), but the net expected utility could easily be negative.
      *   **Impact on Experience:** Knowing can alter how one experiences life *independent* of choices (e.g., enjoying life less due to constant worry about a future risk, even if asymptomatic). This changes the utility landscape itself, violating the instrumental-only assumption.

  5.  **"Formal version of knowledge is power":** **Overly Simplistic.** "Power" implies the ability to *act effectively*. The theorem shows that relevant, actionable information *gives you that power* in decision-making. However, it doesn't guarantee the information *itself* is pleasant or that you'll *feel* powerful; it might reveal powerlessness. "Knowledge is instrumentally valuable for decision-making under uncertainty" is more precise.

  6.  **"Holds for any rational agent, not just expected utility maximizers":** **Debatable/Incorrect.**
      *   **Core Dependence:** Good's standard proof relies fundamentally on the linearity of expectations in probability and the ability to average utilities coherently – hallmarks of expected utility theory (EUT).
      *   **Ambiguity Aversion:** Agents who are ambiguity-averse (e.g., Ellsberg paradox) might rationally *prefer* known probabilities (even bad ones) to unresolved uncertainty, but they might also prefer *ignorance* (a state of no specific probability assessment) to knowing a precise, terrifyingly high risk if they are sufficiently pessimistic or the ambiguity is less distressing than the bad news. The theorem doesn't straightforwardly apply.
      *   **Regret Aversion:** Agents who strongly fear future regret might avoid information that could reveal they made a past mistake, even if the information is potentially useful for future decisions.
      *   **Risk Aversion ≠ Problem:** Standard risk aversion (concave utility over wealth/outcomes) is fully compatible with EUT and Good's theorem. Information is still valuable ex-ante.
      *   **Conclusion:** While the *intuition* might extend, the formal guarantee relies on EUT. Agents violating EUT axioms *can* rationally reject free information in ways that contradict Good's result.

  **Addressing Your Specific Questions:**

  1.  **Expectation vs. Actual Regret:**
      *   **Ex-ante (Expectation):** Good's theorem guarantees you won't *expect* to be worse off by getting the information. On average, before you look, it looks beneficial or neutral.
      *   **Ex-post (Actual Outcome):** You can *absolutely* regret getting the information *after* you see it! If you learn devastating news that causes immense distress and doesn't lead to any beneficial action you couldn't have taken anyway, your actual utility is lower than if you remained ignorant. The theorem doesn't protect you from this. It only says that *before knowing what the news is*, the *probability-weighted average* of all possible outcomes (good news + relief + better action, bad news + dread + better action, news that changes nothing) is non-negative.

  2.  **The Word "Free":**
      *   **Crucial & Multifaceted:** "Free" means **zero impact on utility except through its effect on the subsequent decision.** This explicitly excludes:
          *   Monetary costs (covered).
          *   Time/effort costs (covered).
          *   **Psychological costs:** Dread, anxiety, loss of hope, trauma *caused by the act of acquiring or possessing the information itself* (NOT covered). These are direct utility losses.
          *   **Information as a State:** The information changing your internal state (e.g., knowing you have a gene making you susceptible) might alter your enjoyment of life *even if you take the same actions* (e.g., you hike less because you worry more, even though medically it's still fine). This violates the "instrumental only" assumption. "Free" does *not* cover these effects.

  3.  **Coherent Risk-Averse Agent Worse Off?**
      *   **Within EUT: No.** Standard risk aversion (caring more about losses) is modeled by a concave utility function over *outcomes*. Good's theorem still holds because the *expected utility calculation* incorporates this concavity. The information still helps you avoid choices with bad outcomes more often.
      *   **Outside EUT: Yes.** As mentioned above:
          *   **Ambiguity-Averse Agents:** Might prefer ignorance to knowing a precise high probability of a bad outcome if the unresolved uncertainty was less distressing.
          *   **Regret-Averse Agents:** Might avoid information revealing past mistakes.
          *   **Agents with Direct Disutility from Knowing:** If the *state of knowledge itself* enters the utility function negatively (e.g., U(happy, ignorant) > U(happy, knowing-risk)), then even within a coherent non-EUT framework, avoiding free information can be rational.

  4.  **Commitment:**
      *   **Critical Distinction:** This is a major point often overlooked. An agent who *can* credibly commit to *ignore* the information if acquired doesn't need Good's theorem – they are indifferent to acquiring it (since they'll ignore it, it has zero value/cost).
      *   **The Real Problem:** An agent who *cannot* commit to ignoring information faces a different scenario:
          *   They know that if they acquire the information, they *will* be unable to stop it from affecting them (psychologically) and their future choices.
          *   If the expected *direct* psychological costs of knowing (or the impact on life experience) outweigh the expected *instrumental* decision-making benefits (which might be low if actions are limited), then rationally *refusing to acquire the information in the first place* becomes a form of optimal pre-commitment. This is *not* irrational; it's a rational response to limited self-control or the inherent disutility of the knowledge state. (Think Ulysses tying himself to the mast).

  **Conclusion: Can "I'd rather not know" be rational?**

  **Absolutely, yes.** Good's theorem provides a powerful and important insight: *if* information is truly costless and its *only* effect is to potentially help you make a better decision you were already going to make, then a rational expected utility maximizer should accept it. However, the real world is messy. Information often comes with:

  *   **Significant psychological costs** (dread, anxiety, trauma).
  *   **Limited or no actionability** (e.g., untreatable conditions).
  *   **Effects on well-being independent of choices** (altering life experience).
  *   **Potential commitment problems** (knowing you'll be distressed and unable to ignore it).

  When any of these factors are present – and they frequently are in cases like avoiding medical test results or genetic profiles – refusing free information is **not inherently irrational**. It can be the utility-maximizing choice for a perfectly coherent agent whose preferences include aversion to these psychological burdens or states of knowledge.

  Your roommate accurately presented the formal, abstract theorem but significantly overstepped by applying it as a universal prescription for human behavior, ignoring the critical assumptions about costs, instrumental value, and actionability. "I'd rather not know" can indeed be a rational stance.
