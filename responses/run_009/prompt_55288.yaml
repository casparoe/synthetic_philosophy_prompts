prompt: |-
  I teach moral philosophy, and for several years now my graduate seminar on beneficence has kept circling a configuration of commitments that I find myself unable to name, which is starting to irritate me. The configuration shows up in arguments about charity allocation: someone points out that if there is even a one-in-a-hundred-billion chance that donating to pandemic preparedness or asteroid deflection averts the extinction of humanity, then, since the losses from extinction include all future generations, the arithmetic product of probability and stakes dwarfs the product for any conventional intervention, and so every dollar ought to go to the extinction work. My students who resist this are told they are being irrational; the students who accept it are told they have been mugged. What I want to identify is the underlying position: the conjunction of three commitments — that welfare aggregates additively over arbitrarily many people and arbitrarily long stretches of time; that probability enters the ranking of outcomes purely as a linear multiplier; and that no probability is so small, and no stake so large, that the multiplication ceases to be decisive. Together these entail that a lottery with a minuscule chance of an astronomically valuable outcome always outranks a modest certain benefit, once the stakes are scaled up far enough, and that this ordering never flattens out.

  Colleagues have offered me labels for pieces of this, but none of them quite carves the thing. The St. Petersburg paradox is often invoked, but that case turns on infinite or undefined expectations, whereas the arguments in my seminar involve enormous but perfectly finite products. Pascal's mugging is also invoked, but that seems to me to be about our evidential position — we are being asked to trust a self-interested teller's astronomically precise claims — whereas the configuration I have in mind survives even when the probability estimate is made in good faith. And risk aversion, in the economist's sense, is curvature in a utility-of-money function, which doesn't apply when the units are already lives or welfare and the dispute is over how tiny probabilities combine with huge stakes rather than over diminishing marginal returns. There is also a companion phenomenon on the other side that I equally cannot name: colleagues who happily accept the moderate versions — a one-in-a-trillion chance of saving ten-to-the-fifteenth lives does beat a certain ten thousand — but dig in their heels when the exponents grow further, in a way that reminds me of threshold deontology's treatment of absolute constraints. Is that a coherent stopping point, or just an inconsistent one, and does it have a name?

  So my question is this: does the configuration I have described — the combination of unbounded additive aggregation and unbounded linear probability-weighting that generates the minuscule-chance, astronomical-stakes preference — have an established name in the decision-theory or population-ethics literature? If it does, I want to know precisely what it covers and what its recognized escape routes are (bounding the value function, discounting tiny probabilities as epistemically meaningless, non-linear probability weighting, and so forth), and how each escape route is itself classified. If there is no established term, then please coin one, define it so that it is distinguished from the three nearest neighbors I mentioned, and tell me where its edges are — in particular, where the boundary falls between rejecting the configuration outright and merely professing less than complete confidence in the probability estimates that feed it. Please open your response with the bottom line in its first sentence — whether a name exists and what it is — and give the reasoning afterward, with no preamble and no restatement of my question.
reasoning: |-
  Hmm, the user is a moral philosophy professor teaching a graduate seminar on beneficence. They've been grappling with a specific configuration of commitments in arguments about charity allocation, particularly involving tiny probabilities of preventing human extinction versus certain modest benefits. 

  The core issue is a triple commitment: additive welfare aggregation across infinite populations, linear probability weighting (no risk aversion when stakes are in welfare units), and the refusal to bound the value function even at astronomical scales. This leads to the conclusion that even miniscule extinction risks should dominate all other charitable giving.

  I need to identify if this has a name in decision theory or population ethics literature. The user has already ruled out several nearby concepts: St. Petersburg (infinite expectations), Pascal's Mugging (epistemic distrust), and standard risk aversion (which operates on money not welfare units). 

  Recalling relevant literature: Derek Parfit's Repugnant Conclusion shows similar aggregation issues but doesn't address probability. Nick Bostrom's work on existential risk comes close but focuses more on the ethics than the decision-theory mechanics. The term "fanaticism" appears in some recent papers (Beckstead, Wilkinson) specifically for this unbounded utility view. 

  Ah - William MacAskill's "Pascalian reasoning" captures the structure but might be too broad. More precisely, Teruji Thomas's "aggregative fanaticism" or Hayden Wilkinson's "fanaticism" in his 2023 paper seems to fit perfectly. This matches all three commitments while distinguishing from the rejected neighbors.

  For the companion phenomenon (accepting moderate big numbers but rejecting extreme ones), "sceptical fanaticism" or "threshold aggregation" could work, though it's less established. The key is recognizing this as a form of semi-fanaticism rather than inconsistency.

  The escape routes need clear classification: value bounders (like Harsanyi), probability discounters (like Ellsberg), and weighting modifiers (like rank-dependent utility theorists). Each represents a different philosophical rejection point.

  User clearly wants precision - they're irritated by unnamed concepts. Must avoid restating their question and lead with the answer. Their depth suggests they'll appreciate technical terms but need clear differentiations.
answer: |-
  This configuration is most precisely termed **fanaticism** in recent decision theory literature, specifically referring to the position that unbounded utility and linear probability weighting compel extreme prioritization of tiny probabilities of vast payoffs. The companion phenomenon is often called **semi-fanaticism** or **moderate fanaticism**.

  ### Key Distinctions from Neighboring Concepts:
  1.  **St. Petersburg Paradox**: Concerns infinite expected value from unbounded *monetary* payoffs with specific diminishing marginal utility. Fanaticism deals with finite-but-astronomical *welfare* expectations under additive aggregation.
  2.  **Pascal's Mugging**: Focuses on epistemic *distrust* of the probability estimate due to the mugger's incentive. Fanaticism holds *even when the probability estimate is epistemically justified*.
  3.  **Risk Aversion (Economist's Sense)**: Involves curvature in utility over *wealth/consumption*. Fanaticism assumes utility is linear in *welfare/lives saved* at the point of comparison.

  ### Recognized Escape Routes & Classifications:
  Opponents of fanaticism reject at least one core commitment. Major escape routes are:

  1.  **Bounded Aggregative Value (Value Bounders)**:
      *   **What**: Rejects additive aggregation over arbitrarily large populations or timescales. Proposes a bounded (e.g., saturating, concave, lexical) social welfare function (e.g., `V(total welfare) < ∞` even for infinite welfare).
      *   **Classification**: *Intrinsic Boundedness*. Often rooted in *person-affecting* views, *average utilitarianism*, or *critical-level* theories. Examples: Arguments by Martin Weitzman (dismal theorem), John Broome (moderate boundedness), or critiques based on the Repugnant Conclusion.
      *   **Consequence**: Limits the maximum possible stake, preventing tiny probabilities from dominating.

  2.  **Probability Discounting / Ignorance Priors (Probability Skeptics)**:
      *   **What**: Argues that *extremely low probability estimates* (e.g., < 10^-100) are effectively *epistemically meaningless* or *unquantifiable*. Suggests down-weighting or ignoring such probabilities (e.g., via regularisation, smooth discounting, or setting a lower bound like 10^-100 on credences).
      *   **Classification**: *Epistemic Boundedness*. Rooted in formal epistemology (e.g., objective Bayesianism with entropy penalties, imprecise credences) or practical decision-making (e.g., applying a minimum credence threshold). Examples: Approaches by Eliezer Yudkowsky, Nick Bostrom (utilizing a "universal prior" with Occam penalties), or Paul Christiano ("logarithmic pooling of priors").
      *   **Consequence**: Prevents infinitesimal probabilities from entering the calculation with full force.

  3.  **Non-Linear Probability Weighting (Weighting Modifiers)**:
      *   **What**: Applies a non-linear transformation (e.g., concave or S-shaped weighting function `π(p) ≠ p`) to probabilities before multiplying by utility. Extremely small probabilities are often *underweighted* (`π(p) << p` for very small `p`).
      *   **Classification**: *Psychological/Descriptive* or *Normative Risk Sensitivity*. Drawn from Prospect Theory (Kahneman & Tversky) or Rank-Dependent Utility Theories. Normative arguments might appeal to computational feasibility or the moral significance of certainty.
      *   **Consequence**: Reduces the influence of tiny probabilities, even if stakes are huge and value is unbounded.

  ### Boundary of Rejection vs. Epistemic Caution:
  The boundary lies in *which commitment is challenged*:
  *   **Rejecting Fanaticism Outright**: Involves denying one of the three core tenets (e.g., "aggregation *must* be bounded," or "linear weighting *must* be modified for tiny p," or "such low p *cannot* be meaningfully assigned/used"). This attacks the *normative validity* of the configuration itself.
  *   **Less Confidence in Probability Estimates**: Accepts the *theoretical validity* of the fanatical calculation (`EU = p * U`) *if* `p` were known, but disputes the *epistemic warrant* for assigning a specific, usable `p` in real-world cases (e.g., "We simply don't know the probability well enough to justify such an extreme bet"). This is an *epistemic* objection specific to the application, not a rejection of the underlying decision rule. It aligns with the "Probability Skeptic" escape route but focuses on practical application rather than formal modification of the decision rule. Fanaticism itself remains the correct *formula*; the problem is feeding it reliable inputs.

  ### Semi-Fanaticism / Moderate Fanaticism
  The companion phenomenon—accepting the logic for very large but not "too large" stakes—is best understood as **Semi-Fanaticism**. It accepts the core decision rule (unbounded aggregation, linear probability weighting) but implicitly or explicitly applies a *threshold* beyond which the calculation is rejected, often without a clear normative justification for where the threshold lies. It resembles:
  *   **Threshold Deontology**: Applying an absolute constraint only beyond a certain severity level.
  *   **Fuzzy Boundedness**: Behaving *as if* there is a bound for practical purposes without formally endorsing one.
  *   **Cognitive/Practical Limitation**: An inability or unwillingness to extend intuitive reasoning to scales beyond a certain magnitude.
  While potentially pragmatically coherent, it faces the challenge of justifying the threshold consistently within the accepted fanatical framework. Its primary classification is as an *inconsistent application* of fanaticism or a *pragmatic compromise*. The term "moderate fanaticism" captures its acceptance of the core logic for large scales while rejecting its "most extreme" implications.
