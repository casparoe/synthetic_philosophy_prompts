  - Don't make American seem boastful; root in gratitude
  - Ensure arguments reference real dynamics (Swedish tax rates, US income inequality)

  The ending should show mutual incomprehension - American shaking head, Swede looking troubled - with one concession each (luck acknowledgement and envy admission) but fundamental divide intact. This preserves the "stress-test" while honoring both cultures' coherence.
answer: |-
  ## The Exit Party Divide
  *(The open-plan office is dimly, tastefully lit. Empty champagne flutes litter desks. ERIK (30s, Swedish, calm intensity) stares at a muted financial news channel flashing "STOCKHOLM STARTUP [NAME] ACQUIRED FOR $850M" on repeat. JACK (late 20s, American, buzzing energy) strides in, grinning, holding two fresh glasses.)*

  **Jack:** Erik! There you are. Hiding from the victory lap? C’mon, man! Grab this. To Jonas! *(He thrusts a glass towards Erik)* Can you believe it? That mad genius actually pulled it off! Eight-fifty! That’s… that’s life-changing. Monumental!

  **Erik:** *(Takes the glass but doesn't raise it, eyes still on the screen)* Monumental, yes. Life-changing for Jonas? Undoubtedly. *(He turns to Jack, his expression thoughtful, not celebratory)* But is plastering his face everywhere, making him the singular hero… is that helpful? Or fair?

  **Jack:** Fair? Erik, he *is* the hero! He built this from his dorm room! He maxed out credit cards, slept here for months, hustled the VCs… He *earned* this spotlight. Celebrating him isn’t just fun, it’s… necessary. It shows everyone what’s possible! Ambition rewarded! That’s the fuel, man. It tells the next kid in their garage: *This could be you*.

  **Erik:** And what does it tell Linnea in QA who debugged the critical flaw last month? Or Ahmed in ops who kept the servers alive through three DDoS attacks? Or the twenty junior devs who poured their souls into this? Does it tell them their contribution mattered less? That only the face on the screen truly *won*? Celebrating one so loudly… it inevitably whispers to the many: *You weren’t enough*.

  **Jack:** That’s a zero-sum mindset! Jonas winning doesn’t mean they lost! They *all* win – options vest, careers boosted! Celebrating the pinnacle doesn’t erase the foundation. It *inspires* the foundation to reach higher! You flatten the peak, you discourage anyone from even trying to climb. Why excel if excellence just makes your colleagues uncomfortable?

  **Erik:** You mistake discomfort for envy, Jack. Jantelagen isn’t about envy. It’s about cohesion. Arising above your station, flaunting it… that *breaks* cohesion. It creates resentment, distance. We celebrate *together*, quietly. We recognize luck – right place, right time, the right investor catching the right pitch. Jonas is brilliant, driven, yes. But was he *eight hundred and fifty million dollars* brilliant? Or was he brilliant *and* incredibly lucky? Honoring the luck humbles the achievement. It keeps the playing field level in our minds.

  **Jack:** Level? Or leveled? That humility norm – it feels like institutionalized mediocrity! You’re afraid of someone shining *too* bright? That’s not cohesion, that’s fear. Fear of ambition, fear of difference, fear of acknowledging that some people *do* push harder, risk more, see farther! Downplaying Jonas’s role *because* it was crucial… how is that honest? How does that drive the *next* leap? You need those standouts to pull everyone else up! They set the new benchmark!

  **Erik:** And what happens when the benchmark feels unattainable? Or worse, when the ‘standout’ believes their own hype? Arrogance isn’t just unpleasant, Jack, it’s *dangerous*. It leads to bad decisions, ignoring warnings, steamrolling dissent. We’ve seen it sink companies. Acknowledging luck and collective effort isn’t mediocrity, it’s *stability*. It allows everyone to contribute without feeling their value is solely tied to becoming a unicorn founder. Excellence thrives here, but quietly, collaboratively. Do you think Linnea works less hard because we don’t throw parades? Her excellence is in the *system*, not the spotlight.

  **Jack:** But the spotlight *matters*! It draws the capital, the talent! It signals to the *world* that excellence exists here! Without it, how does Stockholm compete with Silicon Valley? How do you attract the next Jonas if you treat him like… like just another cog when he succeeds? You risk losing your best precisely when they prove their worth. Celebrating individual genius isn't arrogance, it's *gratitude*. It's acknowledging the sheer force of will it took.

  **Erik:** *(Sips champagne finally, slowly)* Gratitude… I can see that. And perhaps… perhaps *some* discomfort *is* envy, wrapped in principle. I’ll concede that. Jantelagen isn’t pure virtue. *(He meets Jack’s eyes)* But you must also concede the luck, Jack. The specific moment his idea landed. The investor who happened to love blockchain *that* quarter. The competitor who stumbled. Luck is the silent, massive partner in every exit. Celebrating *only* the individual… it erases that. It feeds the myth of pure meritocracy. And that myth, when it fails – and it often fails – is deeply demoralizing. It tells the hard-working person who *didn’t* get lucky: *You just weren’t good enough*.

  **Jack:** *(Pauses, the fervor dimming slightly)* Okay. Luck plays a role. A big one sometimes. I’ll give you that. Jonas would say the same if he weren’t… well, currently neck-deep in champagne and reporters. *(He gestures towards the muted TV where Jonas is giving an exuberant interview)* But Erik… downplaying the win, the scale of *his* contribution, even with luck… it feels like denying fire its heat. It *was* monumental. For him. For us. Shouldn’t that… burn bright for a moment?

  **Erik:** *(Looks back at the screen, Jonas’s triumphant smile filling the frame. His expression remains troubled, unconvinced)* It burns bright, Jack. But maybe… maybe we don’t need to stare directly into the sun to feel its warmth. The heat reaches us all anyway. *(He sets his half-full glass down on a desk, untouched by the celebration)* I think I’ll head home. Congratulations to the team. Truly.

  **Jack:** *(Watches Erik go, then raises his own glass towards the screen, the gesture feeling suddenly smaller, quieter in the empty office)* To the team… and the sun, I guess. *(He drinks alone, the silence amplifying the distant cheers from Jonas's interview still playing silently on the screen.)*
