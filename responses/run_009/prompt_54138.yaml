  Structural approach:
  Start with the inciting incident - news of the exit. Have the American initiate celebration to trigger the debate. Make the Swede's pushback about team cohesion, not jealousy. Build arguments where each genuinely challenges the other's worldview: American pointing to how celebration drives innovation, Swede countering with burnout costs and survivor bias. 

  For authenticity:
  - Swede should reference lagom (enoughness) naturally
  - American should mention investors/VC culture
  - Both must acknowledge each other's points (e.g. American conceding luck, Swede admitting envy exists)
  - No resolution - end on lingering tension

  Potential pitfalls to avoid:
