  The user wants me to create a joint statement that represents what these friends might produce after a serious adversarial collaboration. They're looking for four specific components: agreed-upon claims without platitudes, clearly phrased disagreements without strawmen, underlying cruxes with evidence both sides would acknowledge, and identification of any verbal disputes.

  I need to approach this carefully. The friends have been arguing for years without resolution, so I should focus on areas where they genuinely agree. For the agreements section, I'll include points like the massive economic benefits of freer movement, the coercive nature of border enforcement, the distinction between exclusion and deportation, and the consensus on excluding dangerous individuals.

  For the disagreements section, I'll create a table format as requested. I'll phrase each side's position in language they would accept. Key disagreements will center on whether freedom of movement is a fundamental liberty versus an important interest, and whether justification is owed to outsiders or only to community members.

  The cruxes section needs to be particularly thoughtful. I'll identify two core issues: the status of freedom of movement and the scope of justification. For each, I'll include arguments both sides would acknowledge as relevant, along with their predictions about scenarios like entry fees with delayed benefits.

  I should also look for verbal disputes - places where they might be talking past each other. For example, "right to exclude" might mean different things regarding blanket exclusion versus regulated entry terms.

  Throughout, I'll maintain a tone that's intellectually rigorous but accessible for their reading group. I won't add unnecessary citations but will make the thinking sharp and clear. The goal is to help these friends move beyond their stalemate by clarifying where they actually disagree and what evidence might resolve those disagreements.
answer: |-
  Here’s the joint statement reflecting a rigorous adversarial collaboration, focusing on clarity, shared ground, and precise disagreement framing:

  ---

  ### Joint Statement: Adversarial Collaboration on Immigration Ethics

  **Section 1: Agreed Claims**  
  *(Non-platitude points both would endorse without reservation)*  

  1.  **Massive Economic Gains:** Freer global labor movement would generate enormous net economic benefits globally—likely doubling global GDP or more according to credible economic models (e.g., Clemens 2011). Gains primarily benefit migrants and their origin communities, with mixed but net-positive effects on destination-country low-skilled workers *over time*, and clear gains for destination economies overall.
  2.  **Coercion is Central:** Border enforcement inherently involves state coercion (e.g., detention, deportation, armed interdiction). This coercion is a significant moral consideration, distinct from purely economic arguments.
  3.  **Exclusion ≠ Deportation:** Excluding a peaceful non-citizen seeking entry is morally distinct from deporting a long-term resident who has established roots, social ties, and reliance on the community. The latter imposes a significantly higher moral burden to justify.
  4.  **Limited Consensus on Exclusion:** Both agree that states may permissibly exclude individuals posing credible, specific, and imminent threats to public safety (e.g., verifiable violent criminals or carriers of highly contagious deadly diseases) *if* exclusion is the least restrictive effective means. This does *not* extend to general demographic groups.
  5.  **Fiscal Effects are Secondary:** While fiscal impacts of migration exist and can be debated, neither side views them as the *primary* moral issue. A system resolving fiscal concerns wouldn't automatically resolve the core ethical disagreement about exclusion rights.
  6.  **Current Systems are Flawed:** Existing immigration regimes (e.g., extensive backlogs, limited legal pathways, harsh enforcement) create significant suffering, inefficiency, and injustice by both sides' lights.

  **Section 2: Precise Disagreements**  
  *(Phrasing each side accepts as accurate for their own position)*

  | Disagreement                                                                 | Side A (Open Borders) Accepted Phrasing                                                                 | Side B (Right to Exclude) Accepted Phrasing                                                                 | Underlying Crux                                   |
  | :--------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------- | :------------------------------------------------ |
  | **Status of Freedom of Movement**                                            | Freedom of movement across borders is a fundamental human liberty, akin to speech or association, which peaceful migrants possess. Restricting it requires justification meeting a very high threshold (e.g., preventing immediate, grievous harm). | Freedom of movement across borders is an important human interest, but not a fundamental liberty immune to significant restriction. It can be permissibly outweighed by a political community's legitimate claims of self-determination and associative freedom. | **Crux 1:** Is FoM a *basic liberty* or an *important interest*? |
  | **Justification Owed To Whom?**                                              | The permissibility of exclusion must be justifiable *to the peaceful individuals being excluded* according to standards they could reasonably reject. The state owes them a direct moral justification. | The permissibility of exclusion needs justification primarily *to the existing members of the political community* exercising their collective right to self-determination. Outsiders are owed basic humanitarian duties, but not full justificatory parity. | **Crux 2:** Is justification owed *to outsiders* or only *to members*? |
  | **Scope of the "Right to Exclude"**                                          | Any general right of a state to exclude peaceful individuals based solely on non-membership is incompatible with the equal moral status of persons. Exclusion requires specific, individualized justification. | A defining feature of a sovereign political community is its presumptive right to control membership and set general terms of admission as part of its collective self-determination, analogous to a private association (though recognizing crucial differences in scale and function). | **Crux 3:** Does "self-determination" inherently include a *presumptive right to control membership*? |

  **Section 3: Cruxes & Predictive Tests**

  | Crux                                                                 | What Bears On It (Agreed Evidence/Arguments)                                                                                                                               | Side A (Open Borders) Prediction                                                                                            | Side B (Right to Exclude) Prediction                                                                                       |
  | :------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------- |
  | **Crux 1 (FoM: Liberty vs. Interest)**                               | **The "Entry Fee & Delayed Rights" Bundle:** Would a policy allowing *any* peaceful migrant entry *if* they paid a substantial fee (covering fiscal costs), waived all welfare access for 10 years, and waived voting rights for 15 years be acceptable? | **A:** No. The core objection is the coercive exclusion itself, violating a basic liberty. This bundle treats FoM as contingent on economic contribution/citizenship delay, confirming it's not seen as fundamental. Reveals the objection was always about exclusion, not just fiscal/assimilation concerns. | **B:** Yes, *in principle*. This addresses the primary non-core objections (fiscal burden, rapid political impact, assimilation speed). Shows FoM can be regulated as an interest balanced against community concerns. |
  | **Crux 2 (Justification: Outsiders vs. Members) & Crux 3 (Scope)** | **Political Stability of the "Bundle":** Would a real-world implementation of the above "Entry Fee & Delayed Rights" policy be politically stable? Or would it collapse towards either Open Borders or stricter exclusion? | **A:** Unstable, collapses towards openness. The inherent injustice of "second-class" status creates pressure for equal rights and membership. Fees/waivers become targets for removal as migrant integration grows. | **B:** Stable *if* fees/waivers are set realistically. Provides a controlled, economically neutral entry path satisfying self-determination concerns (delayed full membership). Reduces pressure for either extreme. |
  |                                                                      | **Analogy Strength:** Do robust private associations (e.g., clubs, religious groups) have a strong presumptive right to control membership? Does this plausibly scale to a nation-state? | **A:** Weak analogy. States are coercive territorial monopolies providing essential goods (law, security); private associations are voluntary and non-comprehensive. The difference in power and function makes the analogy fail. | **B:** Strong, *qualified* analogy. Core principle of associative freedom applies, though acknowledging the state's unique scale/power necessitates broader duties (e.g., asylum, non-refoulement). Supports a presumptive right. |

  **Section 4: Verbal Dispute Flag**

  *   **The Phrase "Right to Exclude":** Part of the persistent disagreement stems from ambiguity in this term. Side B primarily uses it to mean **"the right to set general terms of admission and conditions for membership/full citizenship,"** which *includes* regulated entry paths (like the "bundle" above). Side A often interprets it as **"a right to blanketly deny entry to peaceful individuals based solely on non-membership."** This difference explains why Side B sees the "bundle" as a legitimate exercise of the right, while Side A sees it as a concession masking the underlying denial of a basic liberty. Clarifying that Side B defends the *former* (regulation) not necessarily the *latter* (blanket denial) in its strongest form is crucial, though Side A still rejects the moral basis for the regulated approach as unjustifiably coercive.

  ---
  **Tone & Purpose Achieved:** This structure avoids platitudes (Section 1), forces precise mutual understanding of disagreements (Section 2), identifies testable cruxes with falsifiable predictions (Section 3), and flags a key source of talking-past-each-other (Section 4). The phrasing in the disagreements table is designed to be acceptable to each side as a fair representation of their *own* core view. The predictive tests move beyond abstract theory to concrete, debatable expectations. This provides a map for where the *real* argument lies and how progress might be assessed.
