  ## On Knowing When It Ends

  We build each day on what the past has sown,
  Your trust returned for trust I freely gave.
  A slight might sting, a grudge be briefly known,
  Then washed away by tides we both forgave.
  For endless mornings seemed to stretch ahead,
  Each choice rebounding from the one before;
  We weighed each kindness done, each caution said,
  On scales that stretched beyond tomorrow's door.
  This fragile pact, held firm by what might be,
  Depended on the dread of futures far –
  Perhaps we counted wrong? Or might you see
  An ending I ignored, a hidden scar?

  **But now they say our numbered days are known:**
  **The final hand must fall, and fall alone.**

  **With no dread dawn to check the self's command,**
  **That last move poisons every offered hand.**

  ---

  ### Notes on the Structure & Theory

  1.  **The Octave (Lines 1-8):** Embodies the sustained cooperation of an indefinite iterated game. It relies on mutual trust ("trust returned for trust"), conditional forgiveness ("grudge be briefly known... washed away"), and crucially, the open-ended future ("endless mornings seemed," "scales that stretched beyond tomorrow's door"). Lines 11-12 introduce the *optional tremor of doubt* ("Perhaps we counted wrong? Or might you see / An ending I ignored...") – hinting at imperfect information or uncertainty about the endpoint or the other's rationality, a reason real cooperation *might* persist slightly longer, but phrased as a fragile question, not undermining the core trust *yet*.
  2.  **The Volta (Line 9-10):** The pivotal turn. Line 9 ("This fragile pact...") summarizes the octave's dependence. Line 10 ("Depended on the dread of futures far –") explicitly names the "shadow of the future" as the essential glue. This leads directly into the announcement of the endpoint.
  3.  **The Final Couplet (Lines 13-14):**
      *   **Line 13:** Announces the common knowledge of the endpoint ("numbered days are known") and the immediate consequence for the *last* move ("The final hand must fall, and fall alone"). "Fall alone" implies defection (selfish play) as the only rational choice without a future.
      *   **Line 14:** Executes the backward induction's devastating logic:
          *   **"With no dread dawn to check the self's command"**: No future threat ("dread dawn") exists to enforce cooperation ("check the self's command" - restrain selfishness) on the final move, hence defection.
          *   **"That last move poisons every offered hand"**: This defection on the last move retroactively makes defection rational on the second-to-last move (as it's now the *effective* last move), and this logic unravels *all the way back* ("poisons every offered hand"). The cooperation described so beautifully in the octave is revealed as unsustainable *from the very start* because the endpoint was always latent, and rational players foresee the unraveling.

  **Achieving the Hurt:** The couplet uses potent verbs ("fall," "poisons") and the stark image of a poisoned "offered hand" (recalling the trust and cooperation of lines 2 & 8) to deliver the emotional and logical blow. The octave builds a world of sustainable trust; the couplet annihilates it with cold, inescapable logic, mirroring the theorem's harsh conclusion. The doubt in the octave makes the initial trust feel human and poignant, but doesn't soften the couplet's devastating finality – it only highlights how fragile that trust *always* was under the formal conditions. The "hurt" comes from seeing the beautiful cooperation retrospectively invalidated.
