prompt: |-
  sanity check request — I've been reading LessWrong-adjacent stuff on induction forever and I think I've converged on a package of views, but something about it itches and I can't locate the problem myself. Here's roughly where I stand: (1) Solomonoff induction is the right idealization of empirical inference — put a prior of about 2^-n on hypotheses with shortest description length n, and Occam's razor stops being a vibes-based heuristic and gets an actual justification. (2) The fact that Kolmogorov complexity is relative to your choice of universal machine doesn't worry me, since the invariance theorem says the dependence is only an additive constant, and that's nothing next to the length of serious scientific hypotheses. (3) I take the razor as a rule about belief, not just prediction: when two theories fit the data equally well, the simpler one is more likely to be true, and this matters most to me in exactly the underdetermined cases where the competing theories are short. (4) Otherwise I'm a pretty relaxed Bayesian subjectivist about priors — I don't think there's a fact of the matter about the correct prior, and two agents with different reasonable priors can both be rational. (5) I put most of my credence on physics being computable, and honestly part of my reason is (1): a Solomonoff agent converges to the truth in any computable environment, so computability feels like the assumption that ideal rationality itself points toward. So — which of these actually pull against each other, which pairs only look like they conflict, and what's the cheapest fix? Rank the tensions by severity instead of flagging everything, and tell me if some of my views are individually fine but jointly worse than the sum of their parts. I can tell something's off but I genuinely can't tell whether it's in the prior stuff, the constant stuff, or something I haven't even noticed.
