  ## Memorandum: Recommendation on Proposed Resolution Concerning State Eugenics Program  

  To the Members of the Commission:  

  After careful deliberation on the proposed legislative resolution addressing our state's eugenic sterilization program (1930s-1970s), and recognizing the sincere and principled divisions within this Commission, I recommend the following course of action: **The legislature should adopt a resolution employing unequivocal apology language ("apologizes" or "apologizes sincerely"), explicitly acknowledging the state’s institutional responsibility for the profound injustice inflicted. Further, this apology must be accompanied by the establishment of a compensation fund for verified living victims, funded through a specific, non-discretionary appropriation.** This approach rejects both the substitution of "regret" for apology and the separation of apology from tangible redress, while directly confronting the complex nature of collective accountability.  

  The faction advocating for "regret" rightly emphasizes that no sitting legislator enacted these horrors. Their concern for avoiding an inappropriate imputation of personal guilt to the innocent is valid and must be respected. However, the distinction between the *state as a continuous institution* and its *temporary officeholders* is crucial here. When the state apologizes, it is not confessing the personal sins of its current legislators or citizens. Rather, it is acknowledging that the *institution itself*, acting through its legal authority and governmental machinery, perpetrated grave wrongs. To speak only of "regret" diminishes this institutional culpability; it frames the harm as a misfortune or a tragedy that merely occurred under the state's watch, rather than an active, systematic injustice perpetrated *by* the state. An apology, in this context, is the institution formally and solemnly stating: "This was our act. It was wrong. We disavow it." It affirms that the state's past actions violated its own foundational promises and the dignity of its citizens. The apology is addressed first and foremost to the living survivors, whose suffering is not historical abstraction but present reality. It is also addressed to the descendants of victims, to communities targeted by the program's prejudices, and to the citizenry at large, reaffirming the state's commitment to justice and repudiating the ideologies that fueled these crimes. Using "regret" risks sounding like sympathy for an unavoidable circumstance, which fundamentally mischaracterizes the deliberate, state-sanctioned violence inflicted.  

  The faction insisting that apology without compensation is a hollow gesture, even an insult, presents a powerful moral argument grounded in the victims' lived experience. Words alone cannot restore stolen futures, bodily autonomy, or the profound trauma endured. A purely verbal apology, devoid of material acknowledgment, can indeed function as a performative act of closure *for the state*, allowing it to claim moral high ground without incurring cost or confronting the lasting consequences of its actions. The impulse to reject such an outcome is ethically sound. Therefore, it is imperative that the apology resolution be inseparably linked to the creation of a compensation fund. This fund must be substantive, accessible, and administered with dignity and urgency, recognizing the advanced age of the few remaining survivors. Compensation is not "payment" for the harm – which is immeasurable – but a tangible, concrete symbol of the state’s acknowledgment of its debt and its commitment to making what amends it still can. To separate the apology from compensation, or to relegate compensation to a future, uncertain legislative battle, renders the apology suspect at best and cynical at worst. They must be presented and passed together.  

  The third faction, which challenges the very concept of a collective legislative apology as a category error, raises the most philosophically profound objection. They argue persuasively that moral agency and the capacity for genuine contrition reside solely in individuals; a legislature, they contend, is an abstract entity incapable of feeling remorse, and its collective "we" is a rhetorical fiction obscuring the fact that no one presently accountable is actually apologizing. This view forces us to confront the limitations of state action in addressing historical evil. There is undeniable truth in the assertion that a resolution cannot replicate the moral gravity of a personal apology between wrongdoer and victim. Legislative apologies *are* inherently symbolic and political acts.  

  However, while acknowledging the force of this argument, we must also recognize the unique nature of the wrong committed. This was not merely the sum of individual misdeeds; it was *state policy*, enacted through law, administered by state agencies, and sanctioned by the authority of the state. The harm was inflicted by the *institution*. Consequently, the response must also come from the institution. The state, as a perpetual entity, holds a continuous identity that transcends the individuals who temporarily constitute its government. It inherits both the legacy of its achievements and the burden of its atrocities. For the state to remain silent, or to offer only regret, is for the institution to tacitly endorse or minimize its past actions. A formal, collective apology, passed by the representatives of the people, is the only mechanism the institution possesses to publicly repudiate its own past, declare a change in its fundamental values, and attempt to restore a measure of broken trust with citizens it betrayed. It is an act of institutional reckoning, however imperfect, demanded by the scale of the institutional crime. To reject this symbolic act because it cannot be a perfect personal apology is to abdicate the state's unique responsibility to confront its own institutional history. The performative aspect is not inherently empty; it can be a necessary public ritual of condemnation and commitment.  

  Therefore, I urge the Commission to support a recommendation that insists on:  
  1.  **Clear Apology Language:** The resolution must explicitly state that the State of [Your State] *apologizes* for its role in authorizing, implementing, and perpetuating the eugenic sterilization program. It should detail the nature of the wrongs, the populations targeted, and the ideologies invoked to justify it, framing the apology within the context of the state's institutional responsibility and its violation of fundamental human rights.  
  2.  **Immediate Compensation Fund:** A rider establishing a compensation fund for verified living survivors must be an integral, non-severable part of the resolution package. The fund should be adequately funded through a direct appropriation, with clear, streamlined, and respectful procedures for distribution, administered by an entity sensitive to the survivors' needs and histories.  

  This dual approach recognizes that words of apology gain meaning through concrete action, and that material compensation gains moral weight and legitimacy when framed as an act of contrition rather than mere settlement. It confronts the state's institutional guilt directly while providing the most tangible form of acknowledgment possible to those who bear the scars of its policies. It acknowledges the limitations of collective political apology while asserting that such an act, coupled with redress, is not merely theater, but a necessary step in the long, imperfect journey toward acknowledging the truth and affirming the state's commitment to justice for all its people.
