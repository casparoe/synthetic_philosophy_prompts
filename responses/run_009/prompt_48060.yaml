prompt: |-
  I'm a novelist working through my third book, and I keep running into the same craft problem: how to render a character's emotion on the page. Broadly my options are to write it as a thought or appraisal (she understood, with sudden clarity, that she despised him), as a bodily sensation (her throat tightened, her palms went cold), or as a raw feeling described from the inside (a gray, spreading dread, unattached to any object). My impression is that philosophers genuinely disagree about what an emotion is — some treat emotions as judgments or appraisals of a situation, some as perceptions, whether of bodily change or of the world as carrying a certain significance, and some as feelings that can't be reduced to either — and I suspect the disagreement isn't idle for my purposes: which account is closer to the truth should bear on which rendering is faithful rather than merely effective. What I want is a procedure I can actually run at my desk, mid-draft, in the ten minutes before I commit to a paragraph. It should be a set of ordered questions that tells me which rendering to use for a given emotional beat, what counts as a sufficient reason to prefer one, and — this matters most — where the procedure has to stop and hand the decision back to me because the choice between the underlying theories is itself the artistic choice, not something a checklist can settle. For context on frequency and stakes: I write roughly six of these beats a week, I can't stop to reacquaint myself with the literature each time, and my editor will push back on any passage where the emotion reads as pasted on rather than lived, so the procedure needs to produce defensible choices quickly.

  Please run the procedure on three beats from my current draft. First, a woman feels fear when a car skids toward hers on an icy road, before she has any thought she could put into words. Second, a man is told by his brother of a betrayal, fully grasps what he's been told, and reports feeling nothing at all for a day. Third, a character grieves someone she also resented, and her feeling seems to shift its object depending on which room of the house she's standing in. I'd especially like to know whether the procedure, on the second beat, supports my instinct that the emptiness itself, not any felt quality, is the emotion — or whether that instinct cheats the theories rather than following any one of them — and I want you to be honest if the procedure ever comes back with a rendering I'm plainly inclined not to write.

  Since you'll have to lean on some view of what emotions are to build this at all, tell me plainly where your reasoning is most likely to misfire: which of the three beats the procedure handles worst, what a fourth case would have to look like for the procedure to give a different rendering than it gives on mine, and what consideration — some kind of case, or some argument — would move you to build the procedure on a different theory altogether.
reasoning: |-
  Okay, the user is a novelist struggling with how to convey character emotions effectively. They've identified three main approaches: cognitive appraisal (thoughts), somatic sensations (bodily reactions), and raw feelings (internal descriptions). They want a practical, step-by-step procedure to decide which approach to use for each emotional beat in their writing. 

  Hmm, interesting challenge. The user isn't just asking for abstract theory—they need something actionable they can use mid-draft. Their examples are very specific: sudden fear during a car accident, emotional numbness after betrayal, and mixed grief/resentment tied to physical spaces. 

  First, I should acknowledge that philosophers do indeed disagree about emotions—James-Lange (bodily), Cannon-Bard (simultaneous), Schachter-Singer (cognitive), etc. But the user's right: we don't need to resolve academic debates to build a practical tool. The key is creating a decision tree that respects artistic intent while avoiding "pasted-on" emotions (a great phrase from their editor).

  For the procedure itself... Let me structure it as a flowchart with clear exit points where artistic choice must take over. Core principles: 
  - Bodily reactions work best for immediate, pre-cognitive moments (like the car skid)
  - Appraisal suits deliberate realizations (the betrayal)
  - Raw feeling shines for complex/ambiguous states (the grief-resentment mix)
  - And sometimes you need hybrid approaches, like somatic + appraisal for layered moments

  Wait—the numbness example is tricky. Is "feeling nothing" an emotion? Philosophically, yes (absence as presence). Practically, it demands somatic markers (hollowness, detachment) to avoid sounding flat. The user's instinct here is spot-on.

  Biggest vulnerability: the procedure might oversimplify blended emotions. If a character feels rage disguised as calm, the flowchart could miss that nuance. Also, cultural/sensory differences aren't baked in—a writer might need to manually adjust for a character who intellectualizes everything.

  Testing against their cases:
  1. Car skid: Pure somatic (throat tightening, etc.)—no time for cognition.
  2. Betrayal numbness: Somatic void ("chest hollow") + delayed appraisal. Must show absence physically.
  3. Shifting grief: Raw feeling + environmental triggers. Rooms become emotional anchors.

  If I saw a case where emotion manifests as action (e.g., punching a wall without feeling anger), the procedure would default to behavior-focused rendering—which their examples don't cover. That's a gap to flag.

  Ultimately, this needs to live as a quick-reference tool, not dogma. The "override" steps are crucial because—as the user wisely notes—sometimes the theory choice *is* the artistic choice.
answer: |-
  Here's a practical, theory-informed procedure designed for your desk, followed by analysis of your three beats and a frank assessment of its limitations:

  **The Emotion Rendering Decision Procedure (5-Minute Version)**

  1.  **Immediacy & Cognition Check:** *Is the emotion occurring before or faster than verbal/cognitive processing?*
      *   **Yes (Pre-cognitive):** → **Somatic Rendering** (Bodily sensation). *Why:* Captures the raw, instinctive response prioritized by James-Lange/perception theories. (e.g., Startle, shock, primal fear).
      *   **No:** Proceed to Step 2.

  2.  **Cognitive Engagement Check:** *Is the character actively making a judgment, assessment, or conscious realization* about the situation's meaning *as part of experiencing the emotion?*
      *   **Yes (Judgment Central):** → **Appraisal Rendering** (Thought/Understanding). *Why:* Aligns with appraisal theories (Arnold, Lazarus). Best for moments of dawning comprehension, moral outrage, decisive realizations.
      *   **No:** Proceed to Step 3.

  3.  **Complexity/Ambiguity Check:** *Is the emotion complex, ambiguous, blended, or lacking a clear somatic signature or single cognitive label?*
      *   **Yes:** → **Raw Feeling Rendering** (Internal description). *Why:* Fits feeling-focused views (William James' "feeling-tone") and complex phenomenology. Ideal for grief, existential dread, nostalgia, conflicting emotions.
      *   **No:** Proceed to Step 4.

  4.  **Absence or Mask Check:** *Is the core emotion characterized by its *absence* (numbness, dissociation) or a deliberate masking of felt experience?*
      *   **Yes:** → **Somatic Void or Masked Behavior + Potential Appraisal.** *Why:* Absence is a felt state (often somatic hollowness, detachment) *or* a cognitive strategy. Requires showing the *lack* of expected feeling/sensation *or* the cognitive acknowledgment of numbness. Often needs hybrid.
      *   **No:** Proceed to Step 5.

  5.  **Artistic Override/Blend Point:** *No clear winner?* Theory reaches its limit. **Consider:**
      *   **Character Voice:** Does this character naturally intellectualize (lean Appraisal), somatize (lean Somatic), or dwell in internal states (lean Raw)?
      *   **Pacing & Focus:** Need visceral punch (Somatic)? Need thematic weight (Appraisal)? Need atmospheric depth (Raw)?
      *   **Previous Beats:** Avoid overusing one type. Create rhythm.
      *   **Hybrid:** Combine 2 types (e.g., Somatic + Appraisal: "Her throat tightened *as she understood...*").
      *   **→ Make the Artistic Choice.** Defend it internally: *Why* this rendering feels most "lived" for *this* moment.

  ---

  **Analysis of Your Beats:**

  1.  **Woman in Car Skid (Fear before words):**
      *   Step 1: **Yes (Pre-cognitive).** Fear hits instantly, faster than thought.
      *   **→ Rendering: Somatic.** *Why:* Faithful to the lived experience of sudden terror. Bodily changes *are* the primary initial experience. *Examples:* "Ice shot through her veins." "Her stomach lurched into her throat." "Muscles seized, locking her foot on the brake." *Avoid:* Appraisal ("She realized she might die") until *after* the initial somatic jolt.

  2.  **Man Told of Betrayal (Feels Nothing):**
      *   Step 1: **No.** He hears, understands the words.
      *   Step 2: **Yes (Judgment Central).** He "fully grasps what he's been told." The betrayal *is* the appraisal.
      *   **BUT** Step 4: **Yes (Absence).** The *reported emotion* is absence/numbness.
      *   **→ Rendering: Hybrid (Somatic Void + Appraisal).** *Why:* The appraisal *causes* the numbness. The numbness *is* the somatic/feeling state (void, detachment).
          *   *Appraisal Component:* Essential to show he understood the significance ("The words landed like stones. *Brother. Stolen. Lies.* Each one clear, undeniable.").
          *   *Somatic Void Component:* Render the *absence* of expected feeling physically. ("A curious hollowness opened in his chest where rage should have been." "His fingers felt distant, numb against the phone." "The room seemed to lose its pressure, leaving him floating in a silent void.").
      *   **Your Instinct Supported:** The emptiness *is* the emotion. The procedure confirms it's not cheating; it's Step 4 (Absence). The appraisal *triggers* the state of numbness, which manifests somatically as void/detachment. Avoid *only* appraisal ("He felt nothing") without rendering the somatic *experience* of that nothingness. Avoid *only* raw feeling implying a feeling *is* present.

  3.  **Grief Mixed with Resentment (Shifting with Rooms):**
      *   Step 1: **No.** Presumably ongoing, processed.
      *   Step 2: **Unclear/Complex.** The appraisal ("betrayed," "lost") is likely known, but the *blend* and *shifting object* are key.
      *   Step 3: **Yes (Complexity/Ambiguity).** Core issue is the conflicting, unstable nature of the feeling and its attachment.
      *   **→ Rendering: Raw Feeling + Environmental Trigger.** *Why:* The shifting, ambiguous, blended quality is paramount. The rooms act as perceptual anchors changing the feeling-tone.
          *   *Examples:* "In the kitchen, the grief was a heavy, sodden blanket, thick with the smell of his coffee. But crossing into the study, it sharpened into icy splinters – *that* was where she'd found the letters." "A gray, clinging fog of loss in the bedroom; in the garage, a brittle, resentful anger crackled off the tools he'd left unfinished." *Focus:* Describe the internal qualitative experience *as it changes* with the environment, highlighting the ambiguity of the object and the blend. Somatic cues (weight, chill, pressure) *can* be woven in to ground it, but the core is the shifting raw feeling.

  ---

  **Where the Procedure is Weak & When It Might Change**

  1.  **Biggest Vulnerability:** **Strongly Culturally/Situationally Modulated Emotions.** The procedure leans on universal physiology (Step 1) and common cognitive patterns. It could misfire with emotions heavily governed by display rules or complex social contexts not yet established.
      *   **Which Beat Handled Worst?** Arguably **Beat 3 (Grief/Resentment)**. If the character has a *very* strong somatic response pattern (e.g., panic attacks triggered by specific rooms) or a *highly* intellectualized defense mechanism (deliberately shifting appraisal per room), the procedure might underemphasize Somatic or Appraisal elements the character *actually* experiences primarily. The Raw Feeling focus is generally sound, but the nuance of *why* it shifts might need more tailoring.
  2.  **A Fourth Case for Different Rendering:**
      *   **Case:** A character experiences profound awe viewing a natural wonder. They are a highly rational scientist.
      *   **Procedure Likely:** Step 1 (Maybe slight somatic startle?) → Step 2 (Yes - Judgment: "This violates scale/comprehension") → **Appraisal Rendering** ("She understood, with humbling clarity, the insignificance of human endeavor before glacial time.").
      *   **Alternative Rendering You Might Prefer:** **Raw Feeling** ("A vast, silent stillness filled her, pressing out thought, leaving only the crushing, beautiful weight of the mountain's gaze."). *Why?* You want to emphasize the *overwhelming*, pre-verbal aspect even in a rational character, pushing against appraisal.
      *   **How Procedure Handles:** It would hit Step 5 (Artistic Override). Your choice for Raw Feeling prioritizes the intended *effect* (overwhelm, transcendence of rationality) over the character's typical mode (appraisal). Defensible: the *stimulus* forces a pre-cognitive/feeling-dominant response.
  3.  **What Would Make Me Rebuild on a Different Theory?**
      *   **The Case:** **Emotion as Primarily Social Action.** E.g., A character *performs* anger (stomping, shouting) strategically to intimidate, *without* feeling the core physiological arousal or appraisal of threat typically associated with anger.
      *   **Argument:** If convinced by theorists like Averill or Parkinson who see emotions fundamentally as social communicative acts or relationship negotiations, not primarily internal states (whether feeling, appraisal, or perception).
      *   **Impact on Procedure:** Steps 1-4 become less relevant. A new step emerges: **"Functional/Social Check: Is the emotion primarily serving a communicative or strategic purpose in an interaction?" → Rendering: Focus on *behavioral display* and *social effect*, with internal state (if present) rendered secondarily or ambiguously.** The current procedure struggles with purely performative emotion divorced from internal experience. If your work frequently involves characters masking, performing, or using emotion strategically *as action*, a social-functional theory might offer a better foundation.

  **Key Takeaway:** The procedure provides a *defensible path* rooted in emotional theory to make quick choices, preventing "pasted on" feelings by matching rendering to the *nature of the emotional moment* (pre-cognitive, judgmental, complex, absent). It flags points (Step 5) where the choice *is* artistic, requiring you to leverage character, theme, and pacing. It validates your instinct on numbness. Use it to ensure variety and fidelity to the beat's core, then trust your writer's intuition at the override point. Good luck with the draft!
