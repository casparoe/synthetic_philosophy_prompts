  The paternalism angle is particularly delicate. If the board rejects the addendum "for tenants' own good," it risks infantilizing them. But accepting it ignores how poverty limits choice. The solution? Shift focus from *whether* tenants consent to *how* the authority wields power—hence Pettit's non-domination framework. 

  For conditions, procedural safeguards (like paperwork trails) won't cut it. They need structural checks that make power non-arbitrary. An irrevocable cap removes the authority's unilateral adjustment power; independent inspectors prevent self-policing; tenant panels invert the hierarchy. Each flows directly from republican theory: unchecked discretion *is* the problem. 

  Final recommendation must be vote-ready. "Reject" feels too absolute given some tenants might genuinely want this. "Approve with conditions" allows participation while neutralizing domination risks. Key is specifying *which* conditions are non-negotiable—hence listing them as mandatory. 

