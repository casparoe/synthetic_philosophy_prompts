prompt: |-
  so heres the situation: I'm a junior in high school, and my older brother left his philosophy of logic books behind when he went back to college, and I got weirdly obsessed with the liar paradox ("this sentence is not true") over winter break. since then I've been reading whatever I can find about what people actually do with it, and there's this fight that's been going basically since the 70s-80s and as far as I can tell nobody has moved at all. one side says the liar sentence is both true and false, that contradiction is just true sometimes, and that we should change logic so a contradiction doesn't let you prove everything (they call that explosion, and their logic is "paraconsistent" because it stays consistent... no wait, I think "consistent" isn't even the right word for them, it's like "non-explosive"). the other side keeps trying to say the liar is neither true nor false (a gap) or only true at some other level or whatever, and every time they propose something, the first group constructs a "revenge" version of the paradox against it, like "this sentence is not true or in the gap" or whatever, and then the gap people revise, and the cycle repeats. there's even a weird third thing where some people say the problem is a rule called contraction, not negation at all, which seems to prove too much somehow? like Curry's paradox doesn't even use negation and it still breaks everything?

  anyway my question isn't who's right, it's what kind of disagreement this even is. my working theory, which I can't tell if it's dumb, is that it's not really a disagreement about the paradox at all but about what logic IS: whether logic is this super minimal thing you're allowed to use in the debate itself (so you can't revise it without cheating, kind of like using a ruler to measure whether the ruler is straight), or whether logic is just the most general facts about truth-preservation and can be revised like anything else. because it feels like when the paraconsistent people argue for their view they still argue classically, and when the classical people argue against contradictions they assume non-contradiction, so it's like each side is only allowed to win by begging the question, and maybe that's why it's been stuck for 40+ years. or maybe that's wrong and there's some actual technical thing that could settle it? so basically: is this a real formal dispute, a verbal one about the word "not", two groups answering different questions (what to SAY about the liar vs what logic to USE), or just... bedrock intuitions? and given your diagnosis, would anything actually count as progress here, like a new paradox, or a formal result, or a distinction someone hasn't made yet -- or is this the kind of thing that will just be stuck forever and honestly should be? I'd love a real diagnosis with reasons and not a tour of all the theories, I already did the tour, that's kind of how I got stuck.
