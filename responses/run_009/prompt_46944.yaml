prompt: |-
  I review papers for a mid-tier journal in evolutionary psychology — my PhD advisor got me roped into it, and now roughly one adaptive-hypothesis paper lands in my queue each month, usually something on the pattern of "trait x evolved because of benefit y," where x can be anything from gossip to morning sickness to why humans like spicy food. My actual training is in statistics and cognitive modeling, not organismal biology, so I can evaluate the math fine but I freeze at the adaptation question itself. My advisor was a huge Gould person and made me read the spandrels paper early on, and I absorbed the vibe: I'm suspicious of just-so stories, I know the words exaptation and byproduct, I get that a trait being useful today doesn't mean it was selected for that use. But the critique never came with anything I can actually run on a submission, and "I smell a Panglossian story" isn't something I can write in a review.

  So what I want is a decision procedure, not a lecture: exactly five numbered steps, each a sentence or two, with no introduction and no concluding paragraph. It should give me the questions to ask of a paper in order, what counts as an adequate answer to each question, at which steps an inadequate answer means I should reccomend reject or major revisions, and where the procedure has to give up and hand the call over to my judgment because the issue is framing or values rather than facts. It has to be usable in a single evening by someone who is not a developmental biologist, so no step can require me to know the pleiotropic effects of a particular gene or the phylogeny of the trait offhand. Two things it has to handle without breaking: papers arguing that a trait is a byproduct rather than an adaptation (I don't want a procedure that reflexively says "insufficient evidence of selection, reject," because sometimes the byproduct story is the well-supported one and deserves publication), and papers where the adaptive hypothesis is well-formulated but completely untested — whether that deserves to see print is genuinely unclear to me. If it helps to have a concrete target to calibrate against, imagine a submission claiming pregnancy nausea is an adaptation that shields the fetus from plant toxins in the first trimester.
reasoning: |-
  We are designing a decision procedure for reviewing papers proposing adaptive hypotheses in evolutionary psychology. The procedure must be in exactly five numbered steps, each a sentence or two. It must handle both adaptation and byproduct claims, and account for well-formulated but untested hypotheses. The goal is to have clear questions, criteria for adequacy, and actions (reject/major revisions or handover to judgment). We'll use the example of pregnancy nausea as an adaptation against plant toxins.

  Key principles from the spandrels critique:
  1. Adaptation requires evidence of design for a specific function, not just current utility.
  2. Traits can be exaptations (co-opted for a new use) or byproducts (non-adaptive consequences of other traits).
  3. We must avoid just-so stories by demanding evidence beyond plausibility.

  Steps:

  1. **Clarify the Trait and Its Proposed Function**: Ask: Is the trait clearly defined and the proposed adaptive function (or byproduct nature) explicitly stated? 
     - Adequate answer: The paper must unambiguously define the trait (e.g., pregnancy nausea) and state the proposed evolutionary explanation (e.g., adaptation to avoid plant toxins in the first trimester). If the paper argues for a byproduct, it must state what the primary adaptation is and how the byproduct arises.
     - Inadequate: Vague trait definition or unclear hypothesis. Action: Major revisions (clarify the hypothesis and trait).

  2. **Evaluate the Evidence for Current Utility**: Ask: Does the paper provide evidence that the trait currently serves the proposed function (or, for a byproduct, that it does not serve an independent function)? 
     - Adequate: For an adaptation, evidence (e.g., correlational, experimental) that the trait currently confers the benefit (e.g., showing that nausea reduces toxin intake and improves pregnancy outcomes). For a byproduct, evidence that the trait lacks current utility or that the utility is better explained by the primary adaptation.
     - Inadequate: No evidence beyond plausibility. Action: If the paper claims an adaptation and lacks any evidence of current utility, then it is a just-so story -> reject or major revisions (if fixable). For a byproduct claim, if there is no evidence against current utility, then also reject/major revisions.

  3. **Assess the Evidence for Historical Selective Pressure (or Lack Thereof)**: Ask: Does the paper provide evidence that the trait (or the underlying mechanism) was shaped by natural selection for the proposed function (or, for a byproduct, that it wasn't)? 
     - Adequate: For an adaptation, evidence such as phylogenetic comparisons (showing the trait co-occurs with the selective pressure in related species), fossil evidence, or genetic evidence (e.g., signatures of selection). For a byproduct, evidence that the trait is linked to an adaptation without having been a target of selection itself (e.g., via pleiotropy or constraints). 
     - Inadequate: No evidence beyond current utility. Action: This step is critical for adaptation claims. Without any evidence of historical selection, the hypothesis remains speculative. However, note that sometimes historical evidence is hard to get. If the paper lacks this entirely, then for an adaptation claim it is weak -> major revisions (to acknowledge limitations) or reject if the journal's standards require such evidence. For a byproduct claim, if the paper fails to show that the trait is not under selection, then it is weak -> same as above.

  4. **Consider Alternative Hypotheses**: Ask: Does the paper consider and rule out (or compare) alternative explanations, including byproduct, exaptation, or non-adaptive explanations? 
     - Adequate: The paper must discuss at least one alternative (e.g., for pregnancy nausea: it's a byproduct of hormonal changes that are adaptive for other reasons). It should provide arguments or evidence against alternatives. 
     - Inadequate: No discussion of alternatives. Action: Major revisions (require the authors to address alternatives).

  5. **Determine if the Hypothesis is Testable and if the Paper Tests It**: Ask: Even if the paper does not provide conclusive evidence, is the hypothesis formulated in a way that it can be tested? And if the paper does not test it, is the theoretical contribution sufficient?
     - Adequate: The hypothesis must be framed in a way that allows empirical testing (e.g., predictions that can be verified). If the paper is purely theoretical, it must make a compelling case for the plausibility and novelty of the hypothesis, and the testability must be clear.
     - Inadequate: The hypothesis is untestable, or the paper does not test it and the theoretical contribution is weak. Action: This step requires judgment. If the hypothesis is untestable in principle -> reject. If the paper is theoretical and the hypothesis is testable and novel, then it might be acceptable (if the journal publishes theoretical work). Otherwise, if it's untested and adds little new, reject. If it's untested but well-formulated and novel, it might warrant publication as a hypothesis paper (but flag as such).

  Now, let's map the steps:

  Step 1: Clarification -> if inadequate, major revisions.
  Step 2: Current utility evidence -> if inadequate for adaptation claim (no evidence), then reject or major revisions. For byproduct, if no evidence against utility, same.
  Step 3: Historical evidence -> if inadequate for adaptation claim (no evidence and the journal requires it), then reject or major revisions. For byproduct, if no evidence that it wasn't selected, same. But note: sometimes historical evidence is unavailable. Then the paper must acknowledge this and rely on other evidence (step 2 and 4).
  Step 4: Alternatives -> if inadequate, major revisions.
  Step 5: Testability and contribution -> if untestable, reject. If untested but theoretically sound and novel, it may be acceptable (judgment call).

  For the example of pregnancy nausea: 
  1. Trait: nausea in first trimester; function: avoid plant toxins? Clear.
  2. Current utility: Evidence? E.g., does nausea actually reduce toxin intake and lead to better outcomes? If not, weak.
  3. Historical: Was there selection? E.g., do we see similar traits in other primates? If not, then speculative.
  4. Alternatives: E.g., nausea as a byproduct of hormonal changes for maintaining pregnancy. Paper must address.
  5. Testable? Yes, but if the paper doesn't test it, then it's a hypothesis paper.

  The procedure must not break for byproduct papers. Example: A paper argues that the human chin is a byproduct of other facial adaptations. 
  1. Trait: chin; byproduct of what? (e.g., reduction in jaw size). Clear.
  2. Current utility: Does the chin have no function? Evidence that it doesn't (or that its function is negligible). 
  3. Historical: Evidence that it wasn't selected? E.g., it appears as a consequence of selection for reduced jaws.
  4. Alternatives: Consider if it could be an adaptation (e.g., for speech or mating). 
  5. Testable? Yes.

  Now, the five steps:

  1. Clarify the trait and evolutionary hypothesis: The paper must define the trait and state whether it is proposed as an adaptation (with a specific function) or a byproduct (with the primary adaptation identified). Inadequate: Unclear definition or hypothesis. Action: Major revisions.

  2. Provide evidence of current utility (for adaptation) or lack thereof (for byproduct): For an adaptation, evidence that the trait currently provides the proposed benefit. For a byproduct, evidence that the trait does not provide an independent benefit (or that the benefit is better explained by the primary adaptation). Inadequate: No evidence beyond plausibility. Action: Reject or major revisions.

  3. Provide evidence of historical selective pressure (for adaptation) or its absence (for byproduct): For an adaptation, evidence (e.g., phylogenetic, genetic, or fossil) that the trait evolved due to selection for the proposed function. For a byproduct, evidence that the trait arose without being a target of selection (e.g., as a side effect of an adaptation). Inadequate: No evidence and no acknowledgment of the gap. Action: Reject or major revisions (unless the paper acknowledges the limitation and the hypothesis is otherwise strong).

  4. Consider alternative explanations: The paper must discuss at least one alternative hypothesis (e.g., byproduct, exaptation, non-adaptive) and provide evidence or arguments against it. Inadequate: No alternatives considered. Action: Major revisions.

  5. Evaluate testability and contribution: The hypothesis must be testable. If the paper does not test it, the theoretical contribution must be substantial (novelty, clarity, testability). Inadequate: Hypothesis untestable or, if untested, adds little new. Action: Judgment call: if untestable, reject; if untested but theoretically strong, may be acceptable (but note in review). If tested but evidence is weak, then step 2 or 3 may have already triggered a rejection.

  This procedure allows for byproduct papers (steps 2 and 3 are symmetric) and untested hypotheses (step 5). It also flags just-so stories (by requiring evidence at steps 2 and 3) and forces consideration of alternatives (step 4). The reviewer uses their judgment at step 5 for untested hypotheses, considering the journal's scope.
answer: |-
  Here is the five-step decision procedure:

  1. **Verify the trait is clearly defined and the hypothesis is explicitly adaptive or byproduct-based.**  
     Adequate: Precise operationalization of the trait (e.g., "nausea frequency in weeks 5–12") and unambiguous claim (e.g., "an adaptation *for* toxin avoidance" or "a byproduct of immune changes"). Inadequate: Vague trait boundaries or conflated adaptation/exaptation/current utility. Action: Major revisions if unclear; reject if unfixable.

  2. **Demand evidence the trait currently aligns with the proposed function (for adaptations) or lacks function (for byproducts).**  
     Adequate: For adaptations, data showing the trait confers *specific, measurable benefits* (e.g., reduced miscarriage linked to nausea-induced food avoidance). For byproducts, data dissociating the trait from fitness outcomes (e.g., no correlation between nausea severity and pregnancy success). Inadequate: Sole reliance on surveys, anecdotes, or plausibility arguments. Action: Reject if absent; major revisions if partial.

  3. **Require exclusion of key alternative explanations using comparative, developmental, or mechanistic data.**  
     Adequate: Directly test ≥1 major alternative (e.g., for nausea: byproduct of progesterone surges; exaptation from general illness responses). Use methods like cross-species comparisons, developmental timing analyses, or causal modeling. Inadequate: Hand-waving dismissal of alternatives or no alternatives mentioned. Action: Major revisions (non-negotiable).

  4. **Assess whether historical evidence (if invoked) meets minimal standards.**  
     Adequate: Phylogenetic/temporal consistency (e.g., nausea timing coincides with fetal vulnerability peaks; toxin exposure in ancestral diets). Acceptable without evidence if the paper explicitly frames this as a limitation. Inadequate: Assertions about ancestral environments with no support (e.g., "toxins were abundant" without ecological data). Action: Reject if claimed as core evidence but unsupported; accept as theoretical if omitted/flagged.

  5. **Judge testability and novelty, ignoring evidentiary gaps if framed as a testable hypothesis.**  
     Adequate: Concrete predictions are derivable (e.g., "nausea should correlate with toxin sensitivity in modern populations"). Novel hypotheses need not be tested but must enable *future* tests and address understudied phenomena. Inadequate: Untestable claims (e.g., "evolution *must* have favored this") or recycled ideas with no new insight. Action: Judgment call—accept if novel/framed as testable; reject if untestable or unoriginal.  

  ---  
  **Key application notes:**  
  - **Byproduct papers:** Step 2 flips (require evidence *against* functionality); Step 4 focuses on mechanistic links to primary adaptations.  
  - **Untested hypotheses:** Pass Step 5 if novel/testable; Steps 2–4 become "should address in discussion" not "must prove."  
  - **Failure triggers:** Steps 1/2/3 inadequate → reject/major revisions; Step 4/5 inadequate → judgment call (reject if fatal; accept with caveats if salvageable).
