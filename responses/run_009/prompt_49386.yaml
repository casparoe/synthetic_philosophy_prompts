prompt: |-
  I'm trying to figure out my actual policy on taking bets, by going through my gut verdicts on cases, and I want someone to tell me what principle, if any, is behind them. Some background so the stakes make sense: I'm in my late twenties, decent salary, about $40k in savings, no kids, no one depending on me. My brother-in-law is big into poker and keeps telling me I'm "leaving money on the table," which is how this whole thing started. The cases:

  - A stranger offers me double-or-nothing on my entire savings at even odds (win $40k or lose $40k). No, obviously. Even if he gives me 60/40 in my favor, still no.
  - The same bet but for $500 a pop, and I can play it as many times as I want: yes, obviously, and I'd keep playing it all week.
  - One-off, unrepeatable: 60/40 in my favor, stake is 20% of my savings. Yes, I take that.
  - One-off, unrepeatable: 90/10 in my favor, all-in on everything I have. I honestly think I'd take this, and I can't explain why this feels fine when the 60/40 all-in in the first case felt insane. Both of them can leave me with zero.
  - I'd take a guaranteed $400 over a 50/50 shot at $1000 or nothing, even though the gamble is worth more on average. At $4 guaranteed vs. a 50/50 for $0 or $10, though, I'd flip the coin. Somewhere around a few hundred dollars I stop liking gambles, and I don't know why the size of the game relative to my savings would matter at amounts this small.
  - The one I keep going back and fourth on: a friend offers me 3-to-1 payout on a coin I'm confident is fair, so I have a real edge, but the stake is my entire savings plus $20k I'd have to borrow. Expected value is strongly positive. Half the time I think it's free money, the other half I picture being broke and in debt at 25.

  My half-formed theory is that the right stake grows with your edge, shrinks with how much losing would hurt, and repetition matters somehow — the $500 case feels safe *because* I can keep playing it. But that doesn't obviously explain why the one-off 60/40 at 20% of savings is fine, or why the risk aversion kicks in at a few hundred bucks where the stakes are pocket change compared to my savings. So: is there one principle that gets all my verdicts, or close to it? If not, which of my verdicts would you overturn, and what does the surviving principle say about the borrowed-money case I can't decide? I'm also curious what it predicts for a case I haven't mentioned: putting a fifth of my savings into a single friend's startup that I'd guess has maybe a 20% chance of returning 20x. Please lead with the bottom line in your very first sentence — state the principle, or say outright that no single one fits — then give the reasoning, no preamble and no restating my question back at me.
reasoning: |-
  Okay, let me figure out what principle is behind the user's betting decisions. The user has shared several scenarios with different stakes and probabilities, each with their gut reactions. 

  First, the user refuses a double-or-nothing bet with their entire savings, even at 60/40 odds. That makes sense because losing everything would be devastating. But they're okay with repeated $500 bets because the risk is manageable over many trials. The law of large numbers would average out the wins here. 

  Then there's a one-off 60/40 bet with 20% of savings. They'd take it, probably because the potential loss isn't catastrophic. But a 90/10 all-in feels acceptable even though both can lead to zero. The key difference is the higher probability of winning, reducing the perceived risk of ruin. 

  Next, they prefer a guaranteed $400 over a 50/50 chance at $1000, but for smaller amounts like $4 vs. $10, they'd gamble. This suggests risk aversion kicks in when the amount is significant relative to their mental accounting, not just their total savings. 

  The borrowed money case is tricky. Even with a positive expected value, the risk of ruin and debt creates hesitation. The startup investment with 20% chance at 20x return might be acceptable since it's only 20% of savings, but the potential for high returns could justify the risk. 

  The user's risk aversion seems tied to the probability of ruin and the emotional impact of loss. Repeated bets reduce variance, making smaller stakes acceptable. Larger single bets are only okay if the win probability is high enough to minimize ruin risk or the stake is a smaller portion of savings. 

  The startup scenario: putting 20% of savings into a friend's startup with 20% chance of 20x return. The expected value is positive (0.2 * 20x = 4x), so it might be acceptable. However, 80% chance of losing the entire investment could be too risky given the user's aversion to significant losses. Still, since it's not all savings and no debt involved, it aligns with their previous decisions where partial stakes with positive EV are taken. 

  The core principle seems to be minimizing the probability of ruin while accounting for emotional impact and expected value. Repeated bets leverage the law of large numbers, making smaller risks acceptable. For single bets, the stake size relative to savings and the win probability determine the comfort level, with a higher threshold for bets that could lead to ruin.
answer: |-
  **Bottom Line: Your gut follows *expected utility theory* with a sharply curved (risk-averse) utility function and an explicit *ruin aversion* constraint, amplified by loss aversion for larger stakes relative to your wealth.**

  Here's how that explains your cases:

  1.  **All-in at even odds or 60/40:** Ruin risk is too high (40% chance of losing everything). Expected value (EV) is positive at 60/40, but the *disutility* of $0 is catastrophic compared to the utility gain from $80k. Ruin aversion dominates.
  2.  **Repeated $500 bets:** Law of Large Numbers kicks in. The probability of ruin over many trials is negligible. The *expected growth rate* is positive, making this sustainable wealth building. Repetition eliminates ruin risk.
  3.  **60/40 at 20% stake:** The potential loss ($8k) is significant but not ruinous. The gain ($16k) is meaningful. The positive EV (+$3.2k) outweighs the risk within your utility curve. Ruin isn't on the table.
  4.  **90/10 All-in vs. 60/40 All-in:** While both *can* lead to ruin, the *probability* matters critically. A 10% ruin risk feels manageable ("a bad beat"), while 40% feels like Russian Roulette. The disutility of ruin is so high that even small probability differences near certainty feel vastly different. EV (+$32k vs. +$8k) also plays a role.
  5.  **$400 vs. $1000@50/50 vs. $4 vs. $10@50/50:** This is pure utility curvature and loss aversion. Losing $500 on a gamble *feels worse* than gaining $500 feels good (loss aversion). For small amounts ($4/$10), your utility curve is flatter – the potential loss doesn't sting much, and the higher EV ($5 vs $4) wins. For $400/$1000, the *disutility* of losing $500 outweighs the utility gain from winning $500 *plus* the tiny EV advantage ($500 vs $400). The absolute dollar amount triggers your risk aversion threshold, not just the percentage of savings.
  6.  **Borrowed $20k + Savings @ 3-to-1 on fair coin:** Your indecision is rational. EV is hugely positive (Win $120k @50% / Lose $60k @50%; EV = +$30k). BUT, the outcome "broke and $20k in debt" represents *negative wealth* – a disaster far worse than simply having $0. Your ruin aversion and extreme disutility of debt scream "NO", overpowering the strong EV. This bet violates the ruin constraint catastrophically.

  **Surviving Principle on Borrowed Money:** *Reject it.* Ruin aversion (amplified by debt-induced negative utility) dominates the strong EV. Even with an edge, betting *more than your net worth* is unacceptable under your revealed preferences.

  **Startup Case Prediction (20% savings, 20% chance of 20x):**
  *   **Stake:** 20% of savings is acceptable under your utility function (like the 60/40 case).
  *   **Edge:** EV = (0.2 * 20x * Stake) + (0.8 * 0) = 4x Stake. Strong positive EV.
  *   **Ruin Risk:** Losing the stake isn't ruin (you keep 80%).
  *   **Utility:** The potential 20x gain is life-changing utility. The loss of 20% is painful but recoverable.
  *   **Verdict:** **You would take this bet.** It aligns perfectly with your 60/40@20% case: significant but non-ruinous stake, strong positive EV, no debt risk. The higher variance (20x vs 2x) is compensated by the massive upside within your utility function.
