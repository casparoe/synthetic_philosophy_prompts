prompt: |-
  Retired neuroscientist here (visual development, mostly cats and ferrets), catching up on philosophy of language in my old age. Something keeps bugging me and I wonder if it has a name. In the lab we saw over and over that a capacity can be neither built in nor learned in the usual sense: the visual cortex comes pre-wired with a rough map, but if you suture one eyelid shut for the first few weeks the ocular dominance columns never come out right, and if both eyes get normal input the map sharpens up with no trial-and-error at all — the input acts like a key, not a teacher. The bird people tell me it's the same with song: a white-crowned sparrow will only copy songs of its own species, only during a certain window, and the tutor determines which dialect it ends up with — so the enviroment supplies the content, but the machinery that decides what counts as input is inherited. Now I'm reading the language acquisition literature and I keep running into this move — Chomsky's poverty of the stimulus: if the data the child hears are too thin to determine the grammar, the grammar must be innate. And that inference skips exactly the category I spent my career on: not learnable from the data as such, but acquirable from the data given an inherited restriction on what gets treated as data.

  So, questions. Does this middle category — a competence that develops reliably only if a particular class of inputs shows up during a window, with the input either supplying the content or merely unlocking a preset outcome — have an established name in philosophy of biology or philosophy of mind? The nearest things I can think of are a critical period (but that names the window, not the whole configuration), canalization (but that seems to be about insensitivity to perturbation, and my cases are sort of the opposite: hypersensitive to one input, indifferent to everything else), and whatever Seligman meant by preparedness. Are any of those actually it, or are they near misses? And is there a recognized split between the version where the trigger supplies the content (the dialect) and the version where it just permits a preset outcome (the cortex thing)? If no single concept covers it, carve one for me: say what the phenomenon is, what it isn't, where the edges are, and don't hesitate to tell me my two cases actually fall on different sides of some line. A bare name won't satisfy me, and I don't want a reading list — I want the concepts and how they differ. Also please answer in American English.
reasoning: |-
  Okay, let me start by unpacking what this retired neuroscientist is asking. They've worked on visual development in cats and ferrets, and now they're diving into philosophy of language. The core issue they're raising is about a middle category in development—something that's not purely innate nor learned through trial and error. They give examples from their own work: ocular dominance columns needing visual input during a critical period to develop properly, and white-crowned sparrows acquiring song dialects only from specific tutors during a sensitive window. 

  They're frustrated with how Chomsky's poverty of the stimulus argument skips this middle ground. Chomsky posits that if input is too sparse, grammar must be innate, but the neuroscientist sees a third option: innate machinery that's activated or shaped by specific environmental inputs during critical periods. They want to know if there's a established term for this in philosophy of biology or mind, and if their two examples (song dialect vs. cortical wiring) are fundamentally the same or different.

  First, I need to recall relevant concepts. Critical period is mentioned, but they note it's just the temporal window. Canalization comes to mind—Waddington's idea of developmental buffering—but that's about robustness against variations, whereas their examples show high sensitivity to specific inputs. Seligman's preparedness is about learning biases, which might be closer but still not quite right. 

  The key elements here are: innate constraints, time-sensitive triggering, and environmental input that either provides content (like dialect) or merely enables a preset outcome (like cortical columns). For the sparrows, the environment supplies the content (specific song), while in the visual cortex, input is more of a permissive trigger. So there might be a distinction within the broader mechanism.

  I remember the concept of "experience-expectant plasticity" from neuroscience. This fits the visual cortex example: the brain expects certain inputs to fine-tune pre-wired structures. Then there's "experience-dependent plasticity," which is more about individual learning. For the sparrows, it's similar but with content-specific acquisition. The philosopher's term "triggering" versus "shaping" might apply here—triggering for the cortex (just enabling), shaping for the song (imprinting specific content).

  But is there a single umbrella term? "Innate learning mechanisms" or "instincts to learn" come up, but they might be too vague. The neuroscientist might need to accept that their cases fall under different subcategories. I should clarify that the mechanism is the same (constrained plasticity), but the role of input varies: instructive (providing info) versus permissive (just enabling).

  They also mentioned canalization. While Waddington's term usually implies robustness, in modern usage it can include sensitivity to specific inputs. However, it's often about maintaining the same outcome despite variations, which contradicts the examples where outcomes vary based on input. So canalization isn't the best fit. 

  Seligman's preparedness is about evolved learning biases—easily associating certain stimuli (like taste and nausea). That's a form of constraint, but it's about learning speed, not critical periods or content provision. So preparedness is related but not identical. 

  The philosopher of biology Peter Godfrey-Smith's distinction between "imprinting" (content-providing) and "triggering" (enabling) is useful here. Imprinting for the sparrow song, triggering for the visual cortex. Both are under "canalized development with critical period sensitivity," but that's clunky. 

  In summary, the closest established terms are "experience-expectant plasticity" for the permissive case and "innate template learning" for the instructive case. The neuroscientist should recognize that their examples, while sharing core features, differ in how the input functions—either as a key (triggering) or as a template (shaping). The unifying framework is "constrained developmental plasticity requiring species-typical inputs during critical periods."
answer: |-
  Your neuroscientist's intuition is spot-on—you've identified a crucial middle category that classical nativist/empiricist debates often overlook. Here's the conceptual breakdown you requested:

  1.  **The Core Phenomenon:** What you describe is **Constrained Developmental Plasticity (CDP) requiring Species-Typical Input (STI) during a Sensitive/Critical Period.**
      *   **What it is:** An evolved, domain-specific neurobiological mechanism that *enables* or *structures* the acquisition of a specific competence. This mechanism is:
          *   **Innate:** Genetically specified.
          *   **Plastic:** Its final functional state *depends* on specific environmental input.
          *   **Constrained:** It is highly selective regarding *what* input it accepts/responds to (STI) and *when* it accepts it (the critical period).
          *   **Non-Associative:** The input acts as a trigger or template, not as reinforcement or data for statistical learning or hypothesis testing in the usual "learning" sense.
      *   **What it isn't:**
          *   **Pure Nativism (Chomskyan IAD):** The competence isn't pre-formed in detail; the input isn't merely "turning on" a fully specified module. The input *shapes* the outcome within innate bounds.
          *   **Pure Empiricism/General Learning:** The competence isn't built from scratch by associating stimuli, extracting statistics, or testing hypotheses across *any* input domain using *general* learning algorithms. The mechanism is domain-specific and input-restricted.
          *   **Maturation:** While maturation occurs, CDP requires *specific external input* to proceed correctly, not just internal timing.
          *   **Canalization (as usually defined):** Canalization emphasizes *robustness* – achieving a *specific* developmental outcome despite environmental or genetic variation. Your cases are about *reliable acquisition of variation* (dialect) or *precise refinement* (cortical columns) *only* in the presence of a *specific class* of input. It's hypersensitive to the *right* input, not robust against *wrong* inputs. (Though CDP *is* robust against *absence* of the *required* input during the window? – see below).
          *   **Preparedness (Seligman):** Preparedness is about *learning biases* – ease/difficulty of forming associations. CDP is about *acquisition mechanisms preceding associative learning*. Preparedness might influence *what* becomes STI, but CDP describes the *mechanism* of acquisition itself.

  2.  **Names & Near Misses:**
      *   **Experience-Expectant Plasticity (Neuroscience Term):** **This is the closest established term, especially for your visual cortex example.** It captures the idea that the brain "expects" certain ubiquitous inputs (like patterned light) during critical periods to fine-tune pre-existing rough structure. It emphasizes the *permissive* role of input.
      *   **Experience-Dependent Plasticity:** Often used for individual learning *within* the functional system *after* it's established via experience-expectant mechanisms. Not specific enough for your core phenomenon.
      *   **Instinct to Learn / Innate Learning Mechanism (Ethology/Tinbergen):** Captures the idea of an innate *predisposition* to acquire specific information. Often used for cases like bird song learning. Focuses more on the *acquisition of content*.
      *   **Triggering vs. Shaping (Philosophy of Biology/Piaget/Godfrey-Smith):** A useful *distinction within* CDP, not a single name.
          *   **Triggering (Permissive):** Input is necessary to *initiate* or *enable* a largely predetermined developmental cascade leading to a relatively fixed outcome. (Your visual cortex example: Input "keys" the lock; the columns develop "correctly" assuming binocular input, "incorrectly" with monocular).
          *   **Shaping (Instructive/Template):** Input provides *specific information/content* that is incorporated into the developing competence within innate constraints. (Your songbird example: Innate template defines *what kind* of song is learnable; tutor input provides *which specific* dialect/version).
      *   **Innate Releasing Mechanism (IRM) / Sign Stimulus (Ethology):** Focuses on *eliciting* a fixed action pattern. Too specific and behavioral; doesn't capture the *developmental* structuring and *content acquisition* aspects well.
      *   **Biological Preparedness (Seligman):** As noted, it's about *learning biases*, not the primary acquisition mechanism itself. It's a *related concept* influencing *what* might constitute STI.

  3.  **Distinguishing Your Cases:**
      *   **Visual Cortex Development:** Primarily **Experience-Expectant Plasticity** leaning towards **Triggering**. The input (patterned light) is necessary to *permit* the normal, largely predetermined refinement process. While binocular competition shapes the *details* of the map, the fundamental structure (layers, columnar organization potential) is innate, and the input acts more as a key enabling the innate program to run correctly. The *content* is primarily innate; input *permits* its expression/refinement.
      *   **Songbird Learning:** Primarily an **Innate Learning Mechanism / Instinct to Learn** leaning towards **Shaping**. The innate template defines the *space* of possible songs (species-specificity). The tutor input provides the *specific content* (dialect) that fills that template. The input *instructs* the final outcome within innate constraints.

  4.  **The Edges:**
      *   **Where CDP starts:** When a mechanism *requires* specific, constrained input during a developmental window to achieve its species-typical functional state, and acquisition is not primarily driven by general-purpose learning or association. The input isn't just "practice"; it's a necessary condition for normal development *of that specific competence*.
      *   **Where CDP ends:**
          *   **Pure Maturation:** No specific external input required beyond general nutrition/etc. (e.g., organ growth).
          *   **Pure Associative Learning:** Acquisition relies on statistical learning, reinforcement, or hypothesis testing across a broad or unconstrained input domain (e.g., learning arbitrary facts, some motor skills via trial-and-error).
          *   **Imprinting (as narrowly defined):** While imprinting (e.g., filial) is a classic CDP example (template + critical period), it sometimes implies a single, irreversible exposure, which isn't always true for CDP (e.g., cumulative song exposure).
          *   **Robust Canalization:** Achieving Outcome X *despite* variations in Inputs A, B, or C. CDP achieves *a* functional outcome *only* in the presence of *specific* Input X.

  5.  **The Poverty of the Stimulus (POS) Critique:** You are absolutely correct. Chomsky's POS argument often presents a false dichotomy: either the data fully determine the grammar (empiricism fails) or the grammar is fully innate (nativism wins). It ignores the CDP option: innate mechanisms *specifically designed* to acquire complex information (like grammar) from *highly constrained* inputs during a critical period. The "poverty" is relative to *general* learning algorithms; the stimulus might be entirely sufficient for the *innate, domain-specific acquisition mechanism*. The child's brain doesn't treat *all* auditory input equally as "data for grammar induction"; it has innate filters and processors specifically for linguistic input (an evolved STI detector/acquirer), making the *effective* stimulus rich for *that specific mechanism*.

  **In summary:** The established neuroscientific term **Experience-Expectant Plasticity** best captures your visual cortex case (triggering/permissive). The ethological term **Innate Learning Mechanism / Instinct to Learn** best captures the songbird case (shaping/instructive). The umbrella concept is **Constrained Developmental Plasticity requiring Species-Typical Input during a Critical Period (CDP-STI-CP)**. This category fundamentally challenges the nativist/empiricist dichotomy by showing how innate structure and environmental input are integrated through evolutionarily designed, domain-specific, time-sensitive developmental mechanisms. Your two cases are variations within this category, differing primarily in the *role* of the input (triggering vs. shaping).
