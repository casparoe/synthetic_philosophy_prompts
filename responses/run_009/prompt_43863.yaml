prompt: |-
  I fact-check claims for a mid-size newsroom, and lately most of our fights aren't about whether things are false but about statements that are technically true and feel like lies anyway. Like a politician saying crime doubled in the city on his opponent's watch when it doubled off a fifty-year low and is still lower than it was a decade ago. Half my desk says "it's literally true, we can't call it misleading," the other half wants to rate it misleading, and our rating system has no honest place for any of this. What I'd like is an actual procedure we can run, not vibes.

  I remember enough from college philosophy to know the relevant ideas live somewhere around Grice -- that we assume speakers are being as informative as needed, relevant, and not oddly worded, and that a speaker can exploit those assumptions to get an audience to believe something false without ever asserting it. That's exactly the politician's trick, right? He says the true thing, we do the math to get the false thing, and he never technically lied. But I don't know how to turn that into something two fact-checkers can apply in the twenty minutes we have before publication, and I don't want a procedure that's secretly just our politics.

  So please build me the procedure. It should say: what questions to ask, in what order; what counts as a sufficient answer at each step; where the procedure stops and hands off to the editor because the remaining question is a judgment call no checklist can make (I assume "would a normal audience take away the false thing" is one of those). It should tell us what to do when the misleading takeaway is true for part of the audience and not another part, and it should be honest about the misfire modes -- like when a statement is clumsy rather than sneaky, or when calling it "misleading" makes us the story.

  Then run it on three claims. One is the crime-doubling example above. Second: a governor announcing that her new program "has already served ten thousand families," where the program mainly rebranded services that already existed and the number includes everyone who walked past an information table. Third: a statement from a politician our editorial board endorsed, one where I have a feeling your procedure is going to come back with "misleading" and it will cost us -- I want to see whether the procedure actually binds us or quietly bends when it's our guy. And finish with what the procedure can't settle at all, so I know which arguments we're still going to have. Keep it practical -- my deadline is real.
reasoning: |-
  Okay, the user is a fact-checker facing a tough problem: technically true statements that feel like lies. They need a practical procedure to handle these cases quickly. Let me unpack their request.

  First, the core issue involves Gricean pragmatics—how speakers imply things without saying them directly. The politician's crime stat example is classic: true on surface, but implies false context. The team is split between literal truth and perceived deception, and their current rating system doesn't handle this gray area.

  The user explicitly wants:
  - A step-by-step procedure with clear questions
  - Defined thresholds for answers
  - Handoff points to editors for judgment calls
  - Handling of audience segmentation (e.g., experts vs general public)
  - Awareness of failure modes (e.g., clumsy vs malicious wording)
  - Testing on three examples including one that might hurt their own editorial board
  - Honest limitations disclosure

  Hmm, the time constraint is critical—20 mins per claim. So the procedure must be efficient but robust. Need to avoid political bias too, hence the "our guy" test case. 

  For structure, I consider a flowchart approach: start with literal truth (step 1), then assess materiality (step 2), then infer likely implication (step 3), and finally evaluate speaker intent if needed (step 4). Each step should have kill switches to avoid over-analysis. 

  Key challenges:
  - Step 3's "normal audience" test is inherently subjective—must flag this as editor handoff.
  - Audience segmentation: maybe distinguish between "informed" and "typical" interpretations?
  - Failure modes: need to differentiate malice from clumsiness, and avoid making the fact-check the story.

  For the test cases:
  1. Crime doubling: technically true but implies dangerous increase when it's still historically low. Should flag as misleading.
  2. Governor's program: "served" is weasel-worded, includes passive exposure. Misleading unless clarified.
  3. Their endorsed politician: procedure must bite equally hard even if uncomfortable. 

  Limitations to disclose: cultural context, satire, and statements where implications are equally valid. 

  Better make sure the questions are concrete—like "Does the statement omit context changing meaning?" with explicit thresholds (e.g., omission = material if it reverses interpretation). And build in off-ramps so fact-checkers don't waste time on borderline cases. 

  Final thought: Include a "public interest" override? No—too subjective. Stick to verifiable deception patterns. Save nuance for editor notes.
answer: |-
  Here's a practical, step-by-step procedure designed for speed and consistency, grounded in Gricean maxims and pragmatic deception analysis. It focuses on **material implication** – what a reasonable audience would *actually conclude* – not just literal truth.

  **The "Material Implication Test" (MIT) Procedure:**

  1.  **Literal Truth Check (1 min):**
      *   *Question:* Is the statement factually accurate at face value? Verify names, dates, numbers, quotes.
      *   *Sufficient Answer:* Clear evidence proving the statement true or false (official data, primary sources).
      *   *Outcome:*
          *   **False?** → Rate "False." *Stop.*
          *   **True?** → Proceed to Step 2.
      *   *Misfire Note:* Avoid semantic nitpicking irrelevant to core meaning.

  2.  **Material Omission/Frame Check (5 min):**
      *   *Question:* Does the statement omit *crucial, readily available context* that a reasonable person would expect for understanding, **and** does that omission significantly alter the meaning or implication? (Grice: Maxim of Quantity/Relation).
      *   *Key Indicators:* Cherry-picked timeframes (e.g., from historic low), lack of baseline comparison, unexplained redefinitions (e.g., "served"), failure to specify scale/scope.
      *   *Sufficient Answer:*
          *   Identified omission is objectively crucial (e.g., baseline is essential for interpreting change).
          *   Omission demonstrably changes the *likely conclusion* (e.g., "dramatic increase" vs. "rebound from historic low").
      *   *Outcome:*
          *   **No Material Omission?** → Rate "True." *Stop.* (It might be irrelevant or unhelpful, but not deceptive).
          *   **Material Omission Found?** → Proceed to Step 3.
      *   *Misfire Note:* Distinguish "crucial context" (changes meaning) from "additional detail" (provides nuance). Not every omission is deceptive.

  3.  **Likely Audience Takeaway Test (10 min - Judgment Handoff Point):**
      *   *Question:* What is the single, most salient conclusion a **reasonable, attentive, but non-expert member of the target audience** would likely draw from this statement *in its published context* (headline, tweet, speech)? (Grice: Maxim of Manner - avoiding obscurity/ambiguity).
      *   *Analysis:*
          *   State the literal claim.
          *   State the likely implied conclusion (e.g., "Crime is dangerously high now").
          *   Is this implied conclusion **false or unsupported** by the full context identified in Step 2?
          *   Is the implication the *only reasonable* takeaway, or just *one possible* interpretation?
      *   *Sufficient Answer:* Clear articulation of the likely takeaway and its falsity/unsupported nature *based on the omission*. Consensus among 2+ checkers on the "primary takeaway."
      *   *Outcome:*
          *   **Likely Takeaway is True/Supported?** → Rate "True" (possibly with "Context Needed" note). *Stop.*
          *   **Likely Takeaway is False/Unsupported AND is the primary implication?** → Proceed to Step 4.
          *   **Ambiguous/Equally Valid Interpretations?** → Flag for Editor: "Requires Contextual Framing." *Stop procedure.*
      *   *Handoff Note:* This *is* the judgment call. The procedure forces checkers to explicitly define the likely takeaway and its validity. Editors make the final call on ambiguity or borderline cases. **Audience Segmentation:** If evidence suggests significantly different takeaways (e.g., experts vs. public), describe both prominently in the editor's note. The primary audience usually drives the rating.

  4.  **Intent & Public Interest Filter (4 min):**
      *   *Question A (Intent - Use Sparingly):* Is there *strong, direct evidence* (e.g., leaked memo, consistent pattern, explicit contradiction) that the speaker *intentionally* crafted the statement to mislead via the omission/implication? (Avoid mind-reading).
      *   *Question B (Public Interest):* Would labeling this "Misleading" itself become the dominant story in a way that *distracts disproportionately* from more important issues? (Rare).
      *   *Sufficient Answer:* Clear evidence for A; Strong editorial consensus for B.
      *   *Outcome:*
          *   **Strong Evidence of Intent?** → Consider "False" or "Deliberate Misleading" (if policy allows). *Stop.*
          *   **High Public Interest Distraction Risk?** → Flag for Editor: "True but Requires Prominent Context - 'Misleading' Rating Risk." *Stop.*
          *   **Neither A nor B applies?** → Rate **"Misleading."** *Stop.*
      *   *Misfire Notes:*
          *   **Clumsy vs. Sneaky:** MIT focuses on *effect* (the misleading takeaway), not *intent*. Unless clear evidence exists (Step 4A), default to "Misleading" based on Steps 1-3. Add a note like "The statement, while literally true, omits crucial context leading to a false impression" without speculating on motive.
          *   **Making Us the Story:** Step 4B is the safeguard. Use it only for truly exceptional cases where the *fact-check itself* would cause massive, disproportionate distraction. Err on the side of transparency.

  **Procedure Outputs:**
  *   False
  *   True
  *   True - Context Needed (Clumsy but not materially misleading)
  *   Misleading (Materially true but implies false/unsupported conclusion)
  *   Requires Contextual Framing (Handoff to Editor - Ambiguous)
  *   True but Requires Prominent Context - 'Misleading' Rating Risk (Handoff to Editor - Public Interest)

  ---

  **Applying MIT to Your Cases:**

  1.  **"Crime doubled in the city on his opponent's watch."**
      *   **Step 1:** True (it doubled from a specific low point).
      *   **Step 2:** **Material Omission.** Omits the baseline (50-year low) and current level relative to history (still lower than 10 years ago). This omission transforms "doubled" from implying a crisis to describing a rebound.
      *   **Step 3:** **Likely Takeaway:** "Crime is now dangerously high / significantly worse than in the recent past." **False/Unsupported.** The primary implication is clear. *Handoff not needed - clear case.*
      *   **Step 4:** No clear evidence of *intent* needed for rating. Low risk of disproportionate distraction. **Rating: MISLEADING.** Add context prominently.

  2.  **Governor: Program "has already served ten thousand families."**
      *   **Step 1:** True (10k families interacted with the program in some defined way).
      *   **Step 2:** **Material Omission/Redefinition.** Omits that "served" includes passive/informational contact and that most "services" are rebranded existing ones. This omission redefines "served" and inflates the perceived scale/novelty of the *new* program's impact.
      *   **Step 3:** **Likely Takeaway:** "This *new* program has actively provided significant *new* benefits/services to 10,000 families." **False/Unsupported.** The implication of novel, active service is strong. *Handoff not needed.*
      *   **Step 4:** No clear intent evidence needed. Rating unlikely to be disproportionate distraction. **Rating: MISLEADING.** Explain the rebranding and broad definition of "served."

  3.  **Statement from Endorsed Politician (Hypothetical: "Unemployment has fallen 15% since I took office.")**
      *   **Step 1:** True (15% decrease verified).
      *   **Step 2:** **Material Omission?** Crucial context: The decrease started 6 months *before* they took office and has continued at the *same rate* since. They imply causation ("since I took office") without evidence their policies changed the trend. **Material Omission Found.**
      *   **Step 3:** **Likely Takeaway:** "My policies caused this 15% decrease in unemployment." **Unsupported.** The timing implies causation, but the trend pre-exists them. This is the primary implication. *Handoff not needed.*
      *   **Step 4:** No evidence of intent needed. Rating might be internally uncomfortable but unlikely to cause *disproportionate* public distraction vs. importance of accuracy. **Rating: MISLEADING.** Explain the pre-existing trend. **The procedure binds you.** It flags the unsupported causal claim inherent in the framing.

  ---

  **What MIT Cannot Settle (Arguments You'll Still Have):**

  1.  **Defining the "Reasonable Audience" (Step 3):** What's obvious to a policy wonk might not be to a casual reader. This requires editorial judgment and understanding of the publication's audience. MIT forces explicit discussion but can't eliminate debate.
  2.  **Truly Ambiguous Statements (Step 3 Handoff):** When multiple reasonable takeaways are equally plausible (one true, one false), MIT flags it for editors to decide framing. The argument shifts to *which* interpretation deserves prominence.
  3.  **"Public Interest Distraction" (Step 4B):** This is a high bar, inherently contentious, and requires senior editorial consensus. Arguments will center on proportionality and newsworthiness.
  4.  **Degree of "Materiality" (Step 2):** Is a specific omission *truly* crucial? MIT relies on checkers' consensus that it significantly alters meaning. Borderline cases will exist.
  5.  **Satire, Opinion, Hyperbole:** MIT is designed for assertions presented factually. Applying it strictly to obvious satire or rhetorical flourish would misfire. Distinguishing factual assertion from opinion/rhetoric remains a pre-procedure challenge.
  6.  **Cultural/Political Context:** Implicit meanings can vary subtly across different audience segments. MIT helps surface the dominant implication but can't fully account for all subtexts.

  **Key Benefits for Your Newsroom:**

  *   **Moves Beyond Vibes:** Replaces "feels like a lie" with structured analysis of omissions and implications.
  *   **Focuses on Harm:** Targets *materially misleading* statements that cause false beliefs.
  *   **Manages Time:** Forces quick decisions with off-ramps to "True" or Editor handoffs.
  *   **Reduces Bias:** Applies the same steps regardless of speaker (as your "endorsed politician" test showed).
  *   **Transparency:** Clearly shows *why* a technically true statement is misleading (omission X leads to false implication Y).
  *   **Defensible:** Grounded in communication theory (Grice) and journalistic ethics.

  This procedure gives you concrete questions, thresholds, and off-ramps, making your fact-checks faster, more consistent, and significantly harder to dismiss as "just vibes" or politics. Good luck hitting that deadline!
