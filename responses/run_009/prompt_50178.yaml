prompt: |-
  I own a small firm, about 40 people, and a couple of times a year one of us has to promote somebody into a role with a lot of unsupervised discretion — managing client relationships on their own, handling money, being the person who decides things when neither I nor my co-founder is around. Interviews have burned me twice now: people who came across as honest and steady in the room and then did dumb, and in one case pretty expensive, stuff once they were actually on their own. I took an ethics course in college and remember liking virtue ethics — judge the character, not just the act — but I also remember the situationist stuff that's supposed to undercut it: the Milgram experiments, the seminary students who literally stepped over a guy slumped in a doorway because they were told they were late, and those old studies where kids who cheated in class didn't cheat on the exam and vice versa. The moral as I took it: how people act is driven alot more by the situation they're in than by any stable trait, so a character-judgment procedure built on asking people about their values is doomed. But I still have to promote *somebody*, and just saying "design the situation well and promote whoever" feels like it gives up on the fact that some people really do seem more trustworthy than others across the board.

  So what I want from you is a decision procedure my co-founder and I can actually run in about an hour per candidate, written for people with no psychology training. Spell out the steps in order: what to ask the coworkers who've seen the candidate in real situations (not hypotheticals), what to look for in their answers, what counts as a sufficient answer at each step, where the procedure terminates with a no, and where it has to hand the call back to us because the question is one of judgment rather than fact. Be honest about which steps are still interview-vibes dressed up as procedure — I'd rather know. Also tell me plainly what the procedure *cannot* do, e.g. if it can't tell "person of genuinely good character" apart from "person who has only ever been in easy, well-resourced situations," say that, because that limitation is exactly the thing that's been biting me. Then run it on two candidates: one who's solid and well liked but has only ever worked under close supervision in a smoothly run enviroment, and one who's prickly, not well liked, but has been through genuinely messy situations (a failing project, a coworker everyone knew was cutting corners) and behaved decently throughout. If the procedure's verdict on the second person is one I won't like, so be it — give it anyway. Last thing: tell me whether any part of the output should really be a recommendation about changing the situation they'd be promoted into (checks, buffers, a transition period) rather than a verdict on the person, and where you'd draw that line. Please write the whole thing in American English.
reasoning: |-
  Okay, the user runs a small firm with around 40 people and faces a tough challenge: promoting someone to a role with significant unsupervised discretion. They've been burned twice by candidates who seemed honest in interviews but made poor (and costly) decisions once promoted. They recall virtue ethics from college but also remember situationist psychology studies (Milgram, seminary experiment) that suggest behavior is more situation-dependent than character-driven. 

  The user wants a practical, step-by-step decision procedure that:
  - Can be done in ~1 hour per candidate 
  - Uses coworker feedback about real past behaviors (not hypotheticals)
  - Clearly defines what constitutes pass/fail at each step
  - Acknowledges where it's still "vibes-based"
  - Explicitly states its limitations
  - Includes situational design recommendations
  - Is written for non-psychologists

  They also want two test cases analyzed: 
  1) A solid, well-liked candidate with only smooth-sailing experience 
  2) A prickly but crisis-tested candidate who acted ethically in messy situations

  First, I need to reconcile their virtue ethics interest with situationist critiques. The key is recognizing that while situations matter greatly, observable patterns of behavior across diverse contexts can reveal "character" as a set of reliable behavioral tendencies. But I must emphasize this isn't about finding "inherently good people" - it's about predicting reliability in unsupervised scenarios.

  For the procedure structure, behavioral interviewing is essential but needs adaptation: 
  - Focus on past unsupervised actions (not hypotheticals) 
  - Prioritize coworkers who've seen the candidate in low-stakes or pressure situations
  - Probe for "why" behind actions to uncover decision-making frameworks

  The core challenge is avoiding two traps: 
  1) Overvaluing likability (which burned them before) 
  2) Undervaluing proven crisis performance due to interpersonal roughness

  For test case 1 (solid but untested), the procedure should flag the lack of crisis exposure as a risk, necessitating safeguards like shadowing period. For test case 2 (prickly but crisis-proven), it should surface their ethical consistency but recommend pairing with a relationship-focused counterpart to offset interpersonal limitations.

  Critical limitations to emphasize: 
  - Can't distinguish between "truly virtuous" vs "never tested" people 
  - Relies on coworker recall accuracy 
  - Fails if the firm lacks behavioral diversity data 
  - Doesn't eliminate risk, only mitigates it

  The situational redesign component is crucial - especially since the user's past failures might stem from inadequate systems, not just poor hires. Recommendations should include: 
  - Mandatory grace periods for new role-holders 
  - Financial controls for all unsupervised roles 
  - "Buddy systems" during transition

  Finally, the analysis of both test cases must be brutally honest - if the procedure rejects the prickly but proven candidate due to coworker feedback, so be it. The user needs to see where the method has teeth.
answer: |-
  Here’s a 7-step decision procedure designed for practical use, acknowledging both character assessment *and* situational limitations. It takes ~60 minutes per candidate and relies on coworker testimony about **observed past behavior** (not opinions or hypotheticals).

  **Core Principle:** We assess **behavioral patterns in unsupervised or ambiguous situations** — not "character" in the abstract. Trustworthiness is judged by *demonstrated choices when no one was watching*.

  ---

  ### **The Procedure: Step-by-Step**
  **Who to Involve:** You + co-founder. Separately interview 3-5 coworkers who’ve seen the candidate in varied contexts (peers, juniors, seniors). *Each coworker interview takes 5-10 mins.*  
  **Output:** "Promote," "Do Not Promote," or "Promote with Safeguards X/Y/Z."

  #### **Step 1: Ask Coworkers for Specific Examples**  
  **Ask:** *"Recall a time [Candidate] had to handle something ambiguous/urgent without clear rules or supervision. What did they actually do? What was the outcome?"*  
  **Look For:**  
  - Concrete actions (e.g., "They paused the client deliverable and called Accounting to verify the budget," NOT "They’re careful").  
  - Situations where oversight was minimal (e.g., handled a client complaint alone, covered for an absent manager).  
  **Sufficient Answer:** A detailed story with actions/decisions made.  
  **Terminate if:** No coworker can recall *any* unsupervised scenario (automatic "Do Not Promote" or "Requires 3-month trial under supervision").  
  *🚩 Vibe Check Alert:* Coworkers might interpret "ambiguous" differently. Push for specifics.

  #### **Step 2: Probe for "Why" in Their Choices**  
  **Ask:** *"Why do you think they did that? Did they explain their reasoning at the time?"*  
  **Look For:**  
  - Evidence of **weighing trade-offs** (e.g., "They said delaying the project risked the timeline but rushing it risked errors").  
  - **Awareness of consequences** (e.g., "They knew the client would be mad but prioritized legal compliance").  
  - *Avoid* values-language ("They’re honest") unless backed by action.  
  **Sufficient Answer:** A plausible, non-self-serving rationale.  
  **Terminate if:** Choices were repeatedly impulsive, self-serving, or ignored clear stakes (e.g., "They didn’t check because it was Friday").  

  #### **Step 3: Test Consistency Across Contexts**  
  **Ask:** *"Did you see them act differently when under pressure vs. smooth sailing? Or with different people (e.g., tough client vs. friendly one)?"*  
  **Look For:**  
  - **Stable patterns** (e.g., "Always double-checks numbers, even when swamped").  
  - **Red flags:** Drastic shifts in ethics when stressed (e.g., "Normally thorough, but cut corners to hit a deadline").  
  **Sufficient Answer:** 2+ examples showing similar decision-making in different contexts.  
  **Terminate if:** Coworkers describe opportunism ("They kiss up to clients but bully vendors").  
  *🚩 Vibe Check Alert:* "Pressure" is subjective. Focus on actions, not emotions.

  #### **Step 4: Gauge Interpersonal Accountability**  
  **Ask:** *"When they made a mistake, how did they handle it? Did they hide it, fix it, or blame others?"*  
  **Look For:**  
  - **Transparency & repair** (e.g., "They emailed the client immediately to admit the error and offered a discount").  
  - **Defensiveness/blame-shifting** (e.g., "They said the intern gave them wrong data").  
  **Sufficient Answer:** At least one example of admitting/rectifying an error.  
  **Terminate if:** Pattern of covering up or denying responsibility.  

  #### **Step 5: Assess Peer Trust (Not Likability!)**  
  **Ask:** *"Would you trust them to handle [specific unsupervised task, e.g., resolving a billing dispute] if no one was checking? Why/why not?"*  
  **Look For:**  
  - **Behavior-based reasons** (e.g., "Yes, because they caught my accounting error last month").  
  - **Rejection based on observed actions** (e.g., "No, they once shared a client’s confidential email as gossip").  
  **Sufficient Answer:** Answers tied to *specific incidents*, not vibes.  
  **Hand Back for Judgment if:** Split votes without clear behavioral evidence (e.g., 2 say "trust completely," 2 say "not sure" with no examples).  

  #### **Step 6: Map to the Target Role’s Risks**  
  **Review:** The target role’s key unsupervised risks (e.g., "Makes $10k+ spending decisions alone").  
  **Ask Coworkers:** *"Have you seen them handle something comparable? How?"*  
  **Look For:**  
  - **Direct parallels** (e.g., "They managed a $8k client refund smoothly when Finance was slow").  
  - **Gaps** (e.g., "They’ve never handled money, but they always document client promises meticulously").  
  **Sufficient Answer:** Evidence of handling *comparable* stakes/complexity.  
  **Hand Back for Judgment if:** No direct parallels but strong indirect evidence (e.g., managed complex non-financial client issues well).  

  #### **Step 7: Judgment & Safeguards**  
  **You Decide Based On:**  
  - **Promote** if: Consistent evidence of accountability, sound judgment under ambiguity, and peer trust *based on actions*.  
  - **Do Not Promote** if: Red flags (blaming, inconsistency, recklessness) or no evidence in key areas.  
  - **Promote with Safeguards** if:  
    - Strong but limited evidence (e.g., great under pressure but never handled money) → Add **graduated autonomy** (e.g., $5k spending cap for 3 months).  
    - Good judgment but poor documentation → Add **automated checklists/audits**.  
    - Trust issues from some peers → Assign a **mentor for monthly check-ins**.  

  ---

  ### **What This Procedure CANNOT Do**  
  1. **Distinguish "untested integrity" from "proven integrity":**  
     A candidate who’s only been in easy, well-resourced situations *cannot be proven trustworthy* for high-stakes autonomy. The procedure will flag this gap (Step 1/Step 6), but you must decide if their *demonstrated habits* (e.g., meticulousness in low-risk tasks) justify a trial *with safeguards*.  
  2. **Predict behavior in entirely novel situations:**  
     Someone great in a failing project may crumble with client funds. We extrapolate from *similar* pressures.  
  3. **Override systemic risks:**  
     If the role has poor oversight structures, *no one* is safe. The procedure highlights this (Step 6 gaps).  

  ---

  ### **Test Cases: Applying the Procedure**  
  **Candidate A (Solid, Well-Liked, Supervised Experience):**  
  - **Step 1:** Coworkers struggle to recall unsupervised scenarios. Best example: "They finished a report solo when their manager was sick." → **Gap: Limited autonomy evidence.**  
  - **Step 2:** "They followed the template exactly." → No trade-off reasoning shown.  
  - **Step 3:** "Always pleasant, does their work." → No pressure examples.  
  - **Step 4:** "Once submitted a late form; apologized and stayed late to fix it." → **Positive accountability.**  
  - **Step 5:** "I’d trust them with small tasks, but not a big client crisis." → **Low trust for target role.**  
  - **Step 6:** No experience with money/autonomy.  
  - **Verdict: Do Not Promote (yet).** *Why?* No evidence they can handle ambiguity alone. **Safeguard Path:** Start with minor unsupervised tasks (e.g., client emails under $500 impact) + 3-month review.  

  **Candidate B (Prickly, Crisis-Proven):**  
  - **Step 1:** "During Project X’s meltdown, they rerouted funds from non-essential tasks to save the core deliverable — without approval, but it worked." → **Shows autonomous judgment.**  
  - **Step 2:** "They said, ‘Losing the client costs more than delaying the add-ons.’" → **Weighed trade-offs.**  
  - **Step 3:** "Same in calm or chaos: direct, impatient, but follows through." → **Consistent (if unlikeable).**  
  - **Step 4:** "When their error caused a delay, they briefed the client personally and took the heat." → **Accountability.**  
  - **Step 5:** "I’d trust them with money. They’re abrasive but won’t cut corners." → **Trust based on actions.**  
  - **Step 6:** Managed budgets in crises (parallel experience).  
  - **Verdict: Promote with Safeguard.** *Why?* Proven judgment but interpersonal risks. **Add:** Mandatory documentation for all decisions + quarterly peer feedback.  

  ---

  ### **When to Fix the Situation, Not the Person**  
  **Draw the line here:**  
  - If **>1 candidate fails Step 1/Step 6**, your role design lacks **graduated autonomy**. Fix: Add tiered authority (e.g., Stage 1: Decide on tasks <$1k, Stage 2: <$5k after 6 months).  
  - If **coworkers distrust the *role* (not the person)** in Step 5, add **transparency tools** (e.g., shared dashboards for client decisions).  
  - If **accountability fails (Step 4) across candidates**, build **blameless post-mortems** into your culture.  

  **Bottom Line:** This procedure reduces risk by focusing on **observed behaviors in real autonomy scenarios**, but it can’t create proof where none exists. Untested candidates need controlled testing. Proven candidates need guardrails against unseen pressures. Promote based on evidence — not charisma, not potential.
