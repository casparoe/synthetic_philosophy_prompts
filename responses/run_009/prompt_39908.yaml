      Status: tautology.
      Supports dismissing: no. (It just points out a possibility, not a necessity.)

   2. Humean is-ought gap: No amount of descriptive knowledge about human intentions can, by itself, generate a normative motivation to fulfill those intentions without the presence of pre-existing motivational elements that bridge the fact-value gap.
