   But note: the study group guy is saying that the project of making the system understand us is a category error because that understanding doesn't buy motivation. So he is likely pushing the inertness or the orthogonality.

   Let's do 5 readings:

   1. Tautology: It is possible for a system to have a representation of human intentions without being motivated by it.
   2. Is-ought: The system cannot logically derive an 'ought' (a motivation) from the 'is' (the fact of human intentions) without additional normative premises. (plausible)
