answer: |-
  Here's a battle-tested plan focusing on destabilizing the "obvious" view and forcing engagement with the core puzzle, using a carefully chosen example and anticipating student moves. The goal is to make them see the *philosophical problem*, not endorse any particular solution.

  **Core Objective:** Make them see that "you keep promises because you said you would" is circular and insufficient. Isolate the *binding force* itself as the mystery.

  **The Anchor Example: The Trivial Secret Promise**
  *   **The Case:** "Imagine you're alone in your room, absolutely no one else around. You find an old, ugly keychain you don't need. On a complete whim, you *promise* yourself (or perhaps promise the keychain, or promise 'the universe') that tomorrow morning, you will place this keychain on the highest shelf in your closet before you leave for class. You have no reason to do this, no one expects it, no one will ever know if you do it or not, it doesn't harm or help anyone in any way, and breaking it doesn't disappoint anyone. You wake up tomorrow, remember the promise, think 'that's pointless,' and leave the keychain on your desk. Did you do something *wrong* by breaking that promise? *Why* or *why not*?"
  *   **Why it works:** Eliminates harm, reliance, expectation, relationship damage, social sanction, and consequence. It isolates the *act of promising itself* as the potential source of obligation. The intuitive pull (for many) that breaking even *this* feels slightly "off" or "wrong" is the hook.

  **The 50-Minute Plan:**

  1.  **Hook & Destabilize (10 mins):**
      *   Start bluntly: "Raise your hand if you think the question 'Why do promises bind?' is a stupid question. Why *wouldn't* you keep a promise? Because you *said* you would, right?" (Validate the initial intuition).
      *   Challenge: "Okay, but *why* does saying you would do something *make* it wrong not to do it later? What's the magic here? If I say 'I will eat broccoli tomorrow,' that's just a prediction. If I break it, no big deal. If I *promise* 'I will eat broccoli tomorrow,' suddenly it's different? *How*?"
      *   **Plant the Seed:** "Is the obligation coming from *inside* you (your will, your intention)? Or from *outside* you (society, expectations, consequences)? Or somewhere else?"

  2.  **Introduce & Wrestle with the Anchor (15 mins):**
      *   Present the **Trivial Secret Promise** case clearly. Emphasize: *No consequences, no witnesses, no reliance, no harm/benefit, no reason to make it or keep it.*
      *   Poll: "Thumbs up if you think breaking it is wrong/thinks you *should* keep it, even slightly. Thumbs down if you think it's totally fine/meaningless. Thumbs sideways if unsure." (Expect a mix, hopefully significant thumbs up/sideways).
      *   **Focus Question:** "Those who think it's wrong/you should keep it: *Why?* What makes it wrong? Don't say 'because he promised' – tell me *why* promising creates the obligation *here*, where nothing else does." (Force them beyond the circle).
      *   **Anticipate & Cut Off Misconceptions (Order Likely):**
          *   *Misconception 1: "It harms himself/his integrity."* Cut-off: "What *is* 'integrity' in this context? Is it just 'keeping promises'? Isn't that circular? If he feels fine breaking it, where's the harm? Isn't the question *why* breaking a promise damages integrity in the first place?"
          *   *Misconception 2: "He intended to be bound."* Cut-off: "Okay, but *how* does intending to be bound *create* the bindingness? What if he intended it as a joke? What if he intended it sincerely but changed his mind? Does the *intention itself* have magical obligation-creating power? Can I intend myself into obligations just by thinking hard?"
          *   *Misconception 3: "Someone *could* find out/rely later."* Cut-off: "The case says *no one will ever know*. Stick to the facts given. We're imagining absolute secrecy and no possible future impact."
      *   **Goal:** Get them stuck. Highlight the puzzle: "So, many of us feel *something* is off about breaking even this pointless promise, but it's incredibly hard to say *what* creates that feeling of obligation if it's not consequences or expectations."

  3.  **Introduce Complexity: The Gunpoint Promise (15 mins):**
      *   Transition: "Okay, let's make it harder. Classic case: You're held up at gunpoint. The thief says, 'Promise you'll never tell the police or describe me, or I shoot you now.' Terrified, you say, 'I promise!' He runs off. Do you have to keep that promise? *Why* or *why not*?"
      *   **Focus:** Don't let it devolve into debate about the *right* answer. Focus on *why* their answers reveal the core puzzle.
      *   **Probe Both Sides:**
          *   *"It binds" side:* "Why? You *did* say the words. Is a promise still a promise even under duress? What if your life depended on making it?"
          *   *"It doesn't bind" side:* "Why not? Because it was coerced? How does coercion *remove* the binding force? Where *was* the binding force supposed to come from in the first place? Does this show the binding force *always* depends on context (like no coercion), or does it show promises *aren't* inherently binding?"
      *   **Connect to Anchor:** "Compare this to the keychain promise. In the keychain case, we might feel an obligation *despite* no external pressure. Here, under huge pressure, we might feel the obligation *isn't* there, or is overridden. What does this tell us about the *source* of the obligation? Does it come purely from the individual's act (which happened in both cases)? Or does it require the right social/voluntary context (which was missing in gunpoint)?"

  4.  **Implications & Framing the Debate (5 mins):**
      *   Summarize the tension: "So, we have cases (like the keychain) where *just* the act of promising seems to create an obligation out of thin air, even when nothing else matters. And we have cases (like gunpoint) where promising seems *not* to create a binding obligation, even though the words were said. What gives?"
      *   Frame the Theories (Briefly & Neutrally):
          *   "One idea: The obligation comes from *your own will/act* when you promise (Individual Will View). But then, why doesn't it bind at gunpoint? Did your 'will' not count?"
          *   "Another idea: The obligation comes from being part of a *social practice* that creates expectations and norms (Practice-Based View). But then, why might the keychain promise *still* feel binding even with no practice involved (no witnesses, no social context)?"
      *   **State What Won't Be Settled (Firmly & Clearly):**
          *   "We *won't* resolve the gunpoint case definitively today – it's a famous hard problem philosophers wrestle with. The point is seeing *why* it's hard."
          *   "We also *won't* dive into promises to yourself today – that's a whole other can of worms. Focus on promises to *others*, even if hypothetical (like promising the universe/yourself *as if* it were an other in the keychain case)."
          *   "Promises after death? Another fascinating but distinct issue – not today. We're focused on the core puzzle: what *makes* a promise binding *at the moment it's made and accepted*?"
          *   **How to say it:** "These are great questions, but they're tangential to the *core mystery* we're digging into today about the *source* of the binding force. We need to stay focused there to make progress. Jot those others down for office hours or future classes!"

  5.  **The Diagnostic Closing Question (5 mins):**
      *   Pose: **"Imagine you break the trivial keychain promise. *What exactly* did you do wrong, if anything? And *where* did that wrongness come from?"**
      *   **Why it works:** It forces them to articulate the *source* of the obligation (or deny its existence) in the purest case. Good answers show they grasp the puzzle:
          *   Recognize the feeling of obligation but struggle to pinpoint its source ("I dunno, just... breaking a promise *is* wrong?" shows they feel it but haven't moved beyond the circle).
          *   Attempt to locate it (e.g., "betrayed my own word," "violated a self-commitment" - leaning individual will; "undermined the idea of promising itself, even privately" - leaning practice).
          *   Clearly deny any obligation *and* explain why the promise itself is meaningless in isolation (showing they reject the initial intuition).
      *   **Don't** answer it yourself! Collect thoughts, thank them, and end. "This is where we leave it for today – wrestling with that 'what exactly?' and 'where from?' is the heart of the issue. Great discussion!"

  **Where It's Most Likely to Fall Apart & Backup Plans:**

  1.  **The Anchor Example Feels Too Silly/Doesn't Bite:** Some students might genuinely feel *zero* obligation in the keychain case and dismiss it.
      *   *Backup 1:* **The Meaningless Bet:** "You and a bored friend flip a coin for absolutely no stake. You lose and say, 'I promise I'll stand on one leg for 10 seconds tomorrow as my forfeit.' Neither of you care. Next day, you don't do it. Friend doesn't care/notice. Wrong? Why?" (Adds a witness but eliminates reliance/harm).
      *   *Backup 2:* **Emphasize the Internal Feeling:** Poll anonymously: "How many of you, if you *actually* made that keychain promise to yourselves privately, would feel *at least a tiny twinge* of guilt or 'I shouldn't have done that' if you broke it?" Use the result to show it's a common intuition worth examining, even if not universal.

  2.  **Getting Stuck on Gunpoint Too Early/Too Long:** Students might latch onto the drama of the gunpoint case and ignore the anchor.
      *   *Backup:* **Firm Pivot:** "Hold that thought on gunpoint! It's crucial, but first we need to understand the *basic* case where there are *no* complicating factors like coercion. Let's nail down the keychain/bet case first, *then* we'll bring in gunpoint to test it." Be prepared to physically move (e.g., write "Keychain" and "Gunpoint" in separate columns) to enforce the sequence.

  3.  **"Harm/Integrity" Arguments Persist:** Students might keep circling back to self-harm or vague integrity.
      *   *Backup:* **Demand Precision:** "Define 'harm' or 'integrity' here *without* using the word 'promise' or 'obligation'. What *is* the bad thing that happens *only* because he broke the promise, that wouldn't happen if he just *didn't* place the keychain without promising first?" Force them to isolate the promissory element.

  **Part I'm Least Sure Of:** The effectiveness of the **Trivial Secret Promise** with *this specific group*. Will it spark the intuitive pull, or will they unanimously dismiss it? The "Meaningless Bet" backup is safer but slightly less pure. **Have both ready.** Gauge the room during the initial poll and be ready to switch or combine them.

  **Key Teaching Moves Throughout:**
  *   **Relentless "Why?":** Never accept "because it's a promise" as an answer. Push for the mechanism.
  *   **Hold them to the Case Specs:** Don't let them change the anchor example ("Well, what if someone *did* find out?").
  *   **Validate Intuitions:** Acknowledge that the "obvious" view feels obvious for a reason. The goal isn't to mock it but to probe it.
  *   **Embrace the Tension:** Highlight that the gunpoint case exposes a genuine conflict in our intuitions. It's okay not to resolve it.
  *   **Manage Time Ruthlessly:** 50 mins is tight. Stick to the structure. Cut off tangents firmly using the pre-announced boundaries ("Great point, but remember, promises to self are off the table today!").

  This plan aims to make the familiar strange, force engagement with the core philosophical puzzle, and give you clear insight into their understanding through the final question. Good luck!
