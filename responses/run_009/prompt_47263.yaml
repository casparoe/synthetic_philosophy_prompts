prompt: |-
  I'm a first-year grad student teaching my own intro ethics discussion section next week on why promises bind — fifty minutes, twenty-two first-years who picked the course partly because it fit their shedule. They'll walk in thinking it's a non-question: you keep promises because you said you would, obviously. My own lean is toward a practice-based account (the bindingness comes from the shared institution of promising rather than from some private act of will), but I want to teach the issue rather than recruit for my view, and there's a case I genuinely can't decide: a promise extracted at gunpoint, where my intuition is that it both binds and obviously doesn't.

  Plan the section for me instead of explaining the philosophy to me. What has to be in place before the question even looks open to them, which single example should carry the whole hour — and note that the obvious candidates (paying back a friend's loan) fail because harm or friendship could explain those, so I need a case where breaking the promise hurts no one, nobody relies on it, and it still feels wrong — which misconceptions they'll form and roughly in what order, and where in the sequence I should cut each one off. Also tell me what to flatly refuse to settle in the room (I'm thinking promises to yourself, and maybe whether you can be released by the promisee's death) and how to say so without seeming to dodge. Finish with one question I can pose at the end that would show me whether they've actually got the issue or just got talked at.

  Since you're planning a live class and not writing an essay: say where the plan is most likely to fall apart in practice and which part you're least sure of, so I know where to have a backup ready.
