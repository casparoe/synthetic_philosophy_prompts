  We are facing a problem of Simpson's paradox or confounding in observational data. The key is to determine whether to aggregate or condition (slice) based on the causal structure. The literature (e.g., causal diagrams, collapsibility) tells us that:

  1. We should condition on a variable if it is a confounder (common cause of both the treatment and the outcome) to get an unbiased causal effect.
  2. We should not condition on a variable that is a mediator (on the causal path from treatment to outcome) because that would block part of the effect.
  3. We should not condition on a variable that is a collider (common effect of the treatment and outcome, or of the treatment and another cause) because that would introduce bias.
  4. We should not condition on a variable that is a descendant of a confounder if we haven't conditioned on the confounder, because it might act as a proxy and partially adjust for confounding.
  5. We should consider the aggregate if there are no confounders or if we have already adjusted for them.

  But in practice, we don't have a full causal diagram. We must rely on subject-matter knowledge and some quick heuristics.

  Brainstorming candidate distinctions and what must survive:

  - **Confounders must be conditioned on.** This is critical. If we don't condition on a confounder, the aggregate effect is biased.
  - **Mediators should not be conditioned on if we want the total effect.** This is also critical because conditioning on a mediator blocks the indirect path.
  - **Colliders should not be conditioned on.** Important to avoid bias.
  - **Effect modifiers (variables that modify the effect of the treatment) are not necessarily confounders, but we might want to condition on them to get heterogeneous effects. However, for a single number, we might want an average effect. But note: if the effect modification is strong, the average effect might be misleading for decision-making. However, the question is about whether the treatment had a positive effect overall, so the average might be what we want.

  But note: in our rate comparisons, we are often comparing two groups (e.g., before and after) and we want to know the causal effect of the intervention.

  The procedure must be:

  1. Fast (under 30 minutes per case).
  2. Lead to a defensible number (aggregate, conditional, or a statement that the data are insufficient).
  3. Explicit about the need for causal background knowledge.

  So, the procedure will be a series of questions that the analyst must answer based on their knowledge of the domain. We cannot avoid the need for subject-matter knowledge.

  Proposed Decision Procedure:

  Step 1: **Define the intervention and outcome.** What is the treatment (e.g., price change) and what is the outcome (e.g., revenue per cohort)? This should be clear from the question.

