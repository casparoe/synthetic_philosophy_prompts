              B: 50 users, 5 churned -> 10% -> difference -10%

          Now, we compute the adjusted difference:

          Weights: 
              Desktop, organic: 100+50 = 150
              Desktop, paid: 200+200 = 400
              Mobile, organic: 50+100 = 150
              Mobile, paid: 150+50 = 200
              Total: 900

          Weighted average of differences:
              (150*(-2%) + 400*(+6%) + 150*(-5%) + 200*(-10%)) / 900
              = (-3 + 24 -7.5 -20) / 900 = (-6.5) / 900 = -0.72%

          So the adjusted difference is -0.72%.

          We report: "After adjusting for device and acquisition channel, version B had a churn rate 0.72 percentage points lower than version A."

     So the answer is that version B is better.

     But note: without knowing the causal order, we might have conditioned on a collider or mediator. But we assumed both are confounders (pre-treatment). If they are not, we might have bias.

     What the procedure cannot settle: The causal role of device and acquisition channel. If, for example, acquisition channel causes device (e.g., paid ads are seen more on mobile) and only acquisition channel is a confounder, then conditioning on device might introduce bias (if device is a collider? or if it is a mediator). But without the causal diagram, we don't know. The procedure relies on the assumption that both are pre-treatment confounders.

     We must state: "We assumed that both device type and acquisition channel are pre-treatment confounders. If this causal assumption is incorrect, the result may be biased."

  Conclusion:

  The procedure is:

  1. Clarify the question (treatment, outcome).
  2. List potential confounders (pre-treatment variables that may affect both treatment assignment and outcome) based on subject-matter knowledge.
  3. Check data availability for these confounders.
  4. If no confounders, report the aggregate effect (difference in rates).
  5. If confounders, stratify by them and compute the adjusted effect as the weighted average of the stratum-specific differences, weighted by the combined stratum size.
  6. If multiple confounders, condition on all simultaneously (if possible, else note sparsity and use aggregate with caveat).
  7. If unmeasured confounders are suspected, note the limitation.

  The output is a single sentence: "The [adjusted] effect of [treatment] on [outcome] is [X] percentage points [direction]." And if adjusted, note the confounders adjusted for.

  For case (b), we did not adjust and reported the aggregate. For case (c), we adjusted for both and reported the adjusted effect.

  This procedure can be run in under 30 minutes if the data are available and the confounders are pre-specified.
