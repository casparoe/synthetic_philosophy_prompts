  Now, the procedure:

  Decision Procedure for Rate Comparisons:

  1. **Clarify the Question:**
     - What is the treatment (or intervention) being evaluated?
     - What is the outcome?
     - What is the time frame and population?

  2. **Identify Potential Confounders:**
     - Based on subject-matter knowledge, list the variables that are:
          - Pre-treatment (not affected by the treatment)
          - Likely to affect both the assignment to the treatment group and the outcome.
     - Examples: in a price change, user characteristics (like plan tier, device, acquisition channel) might be confounders if they are associated with when the price change is applied and also with the outcome (revenue, churn).

     If you cannot list any potential confounders, then skip to step 4.

  3. **Check Data Availability:**
     - For each potential confounder, check if you have data to condition (slice) on it.

  4. **Decision on Conditioning:**
     - If there are no potential confounders (or you have none in your data), then:
          - Report the aggregate comparison (e.g., the overall difference in rates).
          - Stop.

     - If there are potential confounders and you have data for at least one, then:
          - Condition on these confounders by stratifying the analysis.
          - For each stratum, compute the effect (difference in rates).
          - Compute the adjusted effect as the weighted average of the stratum-specific effects, weighted by the total number of observations in the stratum (from both groups combined). For example:
              Adjusted difference = Σ [ (n1_i + n2_i) * (rate1_i - rate2_i) ] / Σ (n1_i + n2_i)
            where i indexes strata, n1_i and n2_i are the sample sizes in stratum i for group 1 and group 2, and rate1_i and rate2_i are the rates in that stratum.
          - Report the adjusted effect and note the confounders adjusted for.

     - If the stratum-specific effects are very heterogeneous (e.g., opposite signs in some strata), still report the adjusted effect but note that the effect varies across strata. The overall average effect is still valid for the overall impact.

  5. **Handling Multiple Partitions:**
     - If there are multiple potential confounders, condition on all of them simultaneously (i.e., cross-tabulate to form joint strata). 
