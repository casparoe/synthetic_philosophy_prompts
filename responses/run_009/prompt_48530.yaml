  ### Decision Procedure for Rate Comparisons in Business Contexts

  This procedure is designed to resolve Simpson's paradox-like conflicts (aggregate vs. sliced results) by leveraging causal intuition within time constraints. It prioritizes defensible action over perfection, acknowledging that causal judgments are unavoidable but can be systematized. The core principle: **Aggregate when there's no confounding; slice when a pre-treatment confounder exists; otherwise, flag ambiguity.**

  #### Ordered Decision Procedure (≤30 min runtime)
  1. **Define the Focal Contrast**  
     Ask: *"What is the intervention (e.g., price change) and outcome (e.g., revenue per cohort)?"*  
     → *Sufficient answer:* Unambiguous treatment-outcome pair. If unclear, stop: *"These data don't match the question."*

  2. **Identify Candidate Confounders**  
     Ask: *"Which slicing variables (e.g., device, acquisition channel) are likely pre-treatment (not affected by the intervention) AND associated with both group assignment and outcome?"*  
     → *Sufficient answer:* 0–3 plausible confounders based on domain knowledge (e.g., "Device type affects both signup flow assignment and conversion").  
     → If none: **Report aggregate**.  
     → If ≥1: Proceed to Step 3.

  3. **Assess Data Limitations**  
     Ask: *"Can we compute stratum-specific rates without sparse cells (<5% of sample in any stratum)?"*  
     → If no: **Report aggregate** but note: *"Adjustment impractical; result may be confounded."*  
     → If yes: Proceed to Step 4.

  4. **Adjust for Confounders**  
     - Stratify by all confounders from Step 2.  
     - Compute **adjusted effect** as:  
       \[
       \text{Adjusted Difference} = \sum_{\text{strata}} \left( \frac{n_{\text{treat},i} + n_{\text{control},i}}{N_{\text{total}}} \right) \times (\text{Rate}_{\text{treat},i} - \text{Rate}_{\text{control},i})
       \]  
       (Weighted by combined stratum size; use absolute differences, not ratios).  
     - **Report adjusted effect**. State: *"After adjusting for [confounders], the effect is [X] pp."*

  5. **Handle Contradictory Partitions**  
     If stakeholders propose alternative slices:  
     Ask: *"Is this variable a pre-treatment confounder (Step 2 criteria)?"*  
     → If yes: Rerun Step 4 including it.  
     → If no/unclear: Reject. State: *"This partition lacks causal justification."*

  6. **Stop and Return**  
     - Ambiguity triggers:  
       - No consensus on confounders (Step 2).  
       - Unmeasurable confounder suspected.  
       → **"These data can't answer the question; causal assumptions conflict."**  
     - Timeout (25 min): **"Inconclusive; recommend A/B test for clarity."**

  ---

  ### Explicit Limits
  1. **Causal Judgment is Irreplaceable**  
     Step 2 *requires* your domain knowledge. The procedure prompts you to record:  
     *"I adjusted for [X] because [causal story]. I excluded [Y] because [reason]."*  
     This is taste, not truth—but *documented* taste is defensible.

  2. **Gaming Partitions**  
     The procedure blocks fishing via Step 5’s pre-treatment confounder requirement. Multiple partitions are resolved by *simultaneous adjustment* (Step 4), not cherry-picking.

  3. **Effect Heterogeneity ≠ Confounding**  
     If strata show opposite effects (e.g., mobile up, desktop down), report the weighted average anyway. The question is *overall impact*, not subgroup nuances.

  4. **Not Covered**  
     - Mediators (e.g., post-treatment variables).  
     - Time-varying confounders.  
     - Non-linear interactions.  
     → These require methods beyond stratification (e.g., regression, IPW).

  ---

  ### Worked Applications

  #### **Case (a): New onboarding flow**  
  - **Aggregate:** Higher conversion after change.  
  - **Slices (mobile/desktop):** Lower conversion in both.  
  - **Background:** Traffic shifted toward mobile (lower-converting segment) during the test.  

  **Procedure:**  
  1. **Focal Contrast:** Intervention = new onboarding flow. Outcome = conversion rate.  
  2. **Confounders:** Device type is pre-treatment, affects traffic mix (group assignment) and conversion → *plausible confounder*.  
  3. **Data:** Sufficient samples per device.  
  4. **Adjust:** Compute device-adjusted difference.  
     - *Result:* Adjusted effect shows lower conversion (e.g., -3 pp).  
  5. **Report:** **"After adjusting for device type, the new flow reduces conversion by 3 pp. Recommend revert."**  
     - *Limits:* Assumes device is the only confounder. If time-period effects exist (e.g., holiday traffic), result may still be biased.

  ---

  #### **Case (b): Price change "success"**  
  - **Aggregate:** Revenue per cohort ↑ after change.  
  - **Slices (plan tiers):** Revenue ↓ within every tier.  
  - **Background:** Users shifted to higher-priced tiers post-change.  

  **Procedure:**  
  1. **Focal Contrast:** Intervention = price change. Outcome = revenue per cohort.  
  2. **Confounders:** Plan tier is *post-treatment* (users choose tier after price change) → **not a confounder** (it’s a mediator).  
  3. **Data:** No other confounders identified.  
  4. **Adjust:** None. **Report aggregate.**  
     - *Result:* Aggregate effect shows revenue ↑ (e.g., +$10k/cohort).  
  5. **Report:** **"The price change increased revenue by $10k/cohort. Overall, it worked."**  
     - *Limits:* If tier shifts were caused by unmeasured factors (e.g., concurrent marketing), this confounds the result. The procedure cannot resolve this.

  ---

  #### **Case (c): Churn comparison with conflicting slices**  
  - **Slicing by device:** Intervention ↑ churn.  
  - **Slicing by acquisition channel:** Intervention ↓ churn.  
  - **Background:** Unknown if device or channel is causally prior.  

  **Procedure:**  
  1. **Focal Contrast:** Intervention = service version (A/B). Outcome = churn rate.  
  2. **Confounders:** Both device and acquisition channel are plausible pre-treatment confounders → include both.  
  3. **Data:** Sufficient samples for joint stratification.  
  4. **Adjust:** Compute doubly-adjusted difference (device × channel strata).  
     - *Result:* e.g., Adjusted effect = -1.5 pp (churn ↓).  
  5. **Report:** **"After adjusting for device and acquisition channel, Version B reduces churn by 1.5 pp."**  
     - *Limits:* Assumes no unmeasured confounders (e.g., user engagement). If device/channel interact causally (e.g., channel → device choice), adjustment may be biased.

  ---

  ### Executive Output Template
  > **"After adjusting for [X], the [intervention] [increases/decreases] [outcome] by [magnitude]. Act on this unless new confounders are identified."**  
  > **"We lack data for a causal answer. Do not act without an experiment."**

  This procedure forces causal assumptions into the open, resists data dredging, and delivers auditable decisions. It replaces statistical lectures with a checklist that prioritizes your judgment where it matters most.
