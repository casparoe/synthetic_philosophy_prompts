prompt: |-
  I have been reading a popular history of religious toleration, aimed at general readers, that pauses in its chapter on sixteenth-century France to discuss Montaigne's essay usually translated as "Of Cannibals" (1580), and its account of the Tupinambá people of coastal Brazil. The author's summary runs roughly as follows. Montaigne's essay is the birth certificate of cultural relativism: Montaigne's point is that no custom can be criticized from outside the culture that practices it, because the only standard any of us has for judging is the custom of our own country, so calling another people barbarous means nothing more than that they differ from us. His portrait of the Tupinambá is therefore of genuinely better human beings, closer to natural virtue, people whom contact with civilization has not yet corrupted, and he writes of them the way a later age would write of the noble savage. He knows whereof he speaks, having gathered his material from a servant who had spent more than a decade in Brazil and from a conversation, through an interpreter, with some Tupinambá men who had been brought to Rouen to be shown to Charles IX. The essay's centerpiece is its most famous comparison: it is not the Brazilians roasting and eating a dead enemy who are barbarous, but the French, who under the name of justice and piety torture a living man to death and tear him apart, and the point of the provocation is that by his own principle Montaigne cannot rank the two. The chapter ends by drawing the lesson that any cross-cultural criticism, whether from missionaries then or from human-rights advocates now, is incoherent on Montaigne's premises, since there is no standpoint outside a given society's customs from which one could be addressed. A friend who studied Montaigne at university tells me that enlisting him as the founder of relativism is an old mistake, but she couldn't articulate what the mistake actually is, and I couldn't follow her hand-waving about the difference between attacking custom and attacking standards. Please audit the summary for me. Go through it claim by claim: which parts would a Montaigne scholar accept as it stands, which are simplifications of things he does say, and which are misrepresentations he explicitly or implicitly rejects? In particular, I would like to know whether the book's picture of his evidence base is fair, given that the essay opens with an anecdote about Pyrrhus sizing up a Roman army and draws the moral that we should judge by the eye of reason rather than by common report, and given that Montaigne compares the Tupinambá to Plato's ideal city rather than to any modern utopia. And finally: setting aside whatever is wrong in the summary, does the chapter's conclusion actually follow from the parts that are accurate? If Montaigne really does rank cruelties as he does in the torture comparison, what does that leave of the claim that he took custom to be the only measure?
reasoning: |-
  Okay, the user is asking for an audit of a summary they encountered in a book about Montaigne's "Of Cannibals." They want to know which parts of the summary are accurate, which are oversimplified, and which are misrepresentations. They specifically mention concerns about Montaigne's evidence base and the conclusion that cross-cultural criticism is incoherent based on his premises.

  First, I need to recall Montaigne's essay. "Of Cannibals" is indeed often cited in discussions of cultural relativism, but I remember that Montaigne's position is more nuanced. The user's summary claims Montaigne is the founder of cultural relativism, stating that no custom can be criticized from outside its culture because the only standard is one's own custom. However, Montaigne doesn't dismiss all standards; he uses reason to critique both European and Tupinambá practices. His famous comparison between Brazilian cannibalism and European torture shows that he does make value judgments, which contradicts strict relativism.

  The user points out that Montaigne starts with Pyrrhus and the Roman army, emphasizing reason over common report. This is crucial because it shows Montaigne values rational judgment over cultural bias. Also, comparing the Tupinambá to Plato's Republic rather than a modern utopia suggests he's not idealizing them as noble savages but using them as a philosophical mirror.

  The evidence base: Montaigne did use a servant and Tupinambá visitors, but he explicitly critiques the reliability of these sources. He mentions their potential biases and the distortions of interpreters. So the book's claim about his evidence is oversimplified; Montaigne is skeptical of his own sources.

  The torture comparison is central. Montaigne argues that European torture is worse because it's prolonged and inflicted on the living, showing he ranks cruelties based on reason, not custom. This directly challenges the idea that he sees custom as the only measure. Therefore, the chapter's conclusion that cross-cultural criticism is incoherent doesn't hold because Montaigne himself engages in such criticism using reason as a standard.

  The user's deeper need might be understanding whether historical figures like Montaigne can be co-opted into modern debates like relativism. They want a nuanced view that avoids presentism. Also, they might be interested in how Montaigne's skepticism informs his relativism—questioning without denying all truths.

  In summary, the book's portrayal is a simplification. Montaigne isn't a strict relativist; he uses reason to critique cultures, including his own. The evidence base is fairly presented but lacks Montaigne's skepticism. The conclusion doesn't hold because Montaigne's method allows for reasoned cross-cultural judgment.
answer: |-
  Here's a detailed audit of the summary, breaking down each claim against Montaigne's actual arguments in "Of Cannibals" (I, 31), addressing your specific concerns about evidence and the torture comparison:

  **Claim 1: "Montaigne's essay is the birth certificate of cultural relativism..."**
  *   **Scholarly Assessment: Significant Misrepresentation.**
      *   **Why:** While Montaigne *pioneers* a powerful critique of ethnocentrism and demonstrates cultural relativism as a *method* of understanding, he does *not* conclude that all customs are equally valid or beyond critique. His relativism is primarily *descriptive* (showing how perspective shapes judgment) and *skeptical* (undermining absolute claims based solely on custom), not *normative* (stating all values are equally good). He explicitly uses reason and a concept of "natural" virtue/humanity as standards *beyond* mere custom to make judgments.

  **Claim 2: "...Montaigne's point is that no custom can be criticized from outside the culture that practices it..."**
  *   **Scholarly Assessment: Misrepresentation (Explicitly Rejected).**
      *   **Why:** Montaigne's *entire project*, especially in this essay, is to criticize his *own* culture's customs (wars of religion, torture, arrogance) using the perceived virtues of the Tupinambá and ancient philosophy (Plato) as an external standard. His critique *depends* on the possibility of cross-cultural judgment. He argues against *uncritical dismissal* based *only* on difference ("barbarous" merely meaning "not us"), not against reasoned critique based on deeper principles.

  **Claim 3: "...because the only standard any of us has for judging is the custom of our own country..."**
  *   **Scholarly Assessment: Oversimplification (Partly True, But Incomplete/Misleading).**
      *   **Why:** Montaigne brilliantly *diagnoses* this as the common, flawed human tendency ("We have no other test of truth and reason than the example and pattern of the opinions and customs of the country we live in"). However, he presents this as the *problem* he seeks to overcome, *not* as an inescapable truth. He proposes alternatives: the "eye of reason" (introduced via Pyrrhus) and the concept of "natural" law/virtue ("laws of nature"). The essay argues we *can* and *should* strive for a standard beyond mere local custom.

  **Claim 4: "...so calling another people barbarous means nothing more than that they differ from us."**
  *   **Scholarly Assessment: Accurate (as far as it goes).**
      *   **Why:** This is a core point Montaigne makes repeatedly: "each man calls barbarism whatever is not his own practice... for we have no other criterion of truth or right-reason than the example and form of the opinions and customs of our own country." He uses this to dismantle European arrogance.

  **Claim 5: "His portrait of the Tupinambá is therefore of genuinely better human beings, closer to natural virtue..."**
  *   **Scholarly Assessment: Oversimplification (with Nuance).**
      *   **Why:** Montaigne *does* portray them as embodying virtues he finds lacking in contemporary Europe (courage, loyalty, simplicity, lack of avarice or social hierarchy). He explicitly states they are "still very close to their original naturalness" and that "natural reason" is less corrupted in them. However:
          *   He avoids claiming they are *perfect* or lack flaws (e.g., he notes their warfare and cannibalism).
          *   His praise is often comparative ("in so many ways... superior") and aimed at critiquing Europe, not establishing them as an absolute ideal.
          *   He contrasts them with *Plato's Republic*, not modern utopias, precisely because Plato represents an abstract philosophical ideal of justice/nature, not a romanticized primitive state. He finds the Tupinambá *unexpectedly* closer to that *philosophical* ideal than Europe is. This is crucial – it's a comparison based on reason/philosophy, not just primitivism.

  **Claim 6: "...people whom contact with civilization has not yet corrupted..."**
  *   **Scholarly Assessment: Accurate.**
      *   **Why:** Montaigne explicitly warns against corrupting them: "it would be a marvel if so crude and superficial an understanding [as ours] could attach to so noble and well-ordered a machine [as theirs] without spoiling it." He sees European "civilization" (as practiced) as corrupting, contrasting with their "natural" state.

  **Claim 7: "...and he writes of them the way a later age would write of the noble savage."**
  *   **Scholarly Assessment: Oversimplification (Problematic Association).**
      *   **Why:** While later thinkers (like Rousseau) drew on Montaigne for the "noble savage" trope, Montaigne's portrayal is more complex and less idealized:
          *   **Philosophical, Not Primitive Ideal:** The comparison is to Plato's *Republic*, emphasizing rational order and natural law, not just uncorrupted simplicity. He admires their *societal structure* relative to nature/reason.
          *   **Acknowledges Flaws:** He describes their warfare and cannibalism without flinching, though he contextualizes it.
          *   **Skeptical Purpose:** His primary aim is critique of Europe, not creating a myth of primitive perfection. He uses them as a *mirror*, not an unreachable ideal. The "noble savage" concept often lacks this critical edge and becomes a romanticized stereotype.

  **Claim 8: "He knows whereof he speaks, having gathered his material from a servant... and from a conversation... with some Tupinambá men..."**
  *   **Scholarly Assessment: Fair but Incomplete Regarding His Skepticism.**
      *   **Why:** This accurately reports his sources (the servant who lived there 10-12 years, the Tupinambá visitors in Rouen). **However, the summary omits Montaigne's crucial caveats:**
          *   He starts with Pyrrhus to stress judging by "the eye of reason, not by common report."
          *   He immediately questions the reliability of his servant ("simple and crude men... likely to give a true testimony") and the distortions of interpreters ("How could he make sure of... their ideas and conceptions?").
          *   He explicitly states his account is filtered and potentially flawed: "I was... careful... to have his account confirmed by more competent testimony... I gathered from their talk... so far as my mediocre understanding... could follow it."
      *   **Conclusion:** The book is factually correct about his sources, but fails to convey Montaigne's *active skepticism* about the reliability of *any* testimony, including his own. He uses the sources but frames them within his broader skeptical method.

  **Claim 9: "The essay's centerpiece is its most famous comparison: it is not the Brazilians roasting and eating a dead enemy who are barbarous, but the French, who under the name of justice and piety torture a living man to death and tear him apart..."**
  *   **Scholarly Assessment: Accurate Representation of the Passage.**
      *   **Why:** This is a direct and faithful summary of the provocative climax: "I think there is more barbarity... in tearing by tortures and the rack a body still full of feeling, in roasting a man bit by bit... than in roasting and eating him after he is dead." He explicitly condemns the hypocrisy of Europeans condemning Tupinambá practices while committing worse acts under the guise of piety and justice.

  **Claim 10: "...and the point of the provocation is that by his own principle Montaigne cannot rank the two."**
  *   **Scholarly Assessment: Profound Misrepresentation.**
      *   **Why:** The *entire force* of the comparison relies on Montaigne *rankling* them! He explicitly says the European practice is *more* barbarous ("I think there is more barbarity..."). He does this by applying a standard *beyond* mere custom: the inherent cruelty of inflicting prolonged suffering on the living versus the (to him) more understandable ritual involving the *dead* enemy. He uses reason ("I think") and an implicit standard of minimizing suffering/hypocrisy. This passage *contradicts* the strict relativist reading.

  **Claim 11: "The chapter ends by drawing the lesson that any cross-cultural criticism, whether from missionaries then or from human-rights advocates now, is incoherent on Montaigne's premises, since there is no standpoint outside a given society's customs from which one could be addressed."**
  *   **Scholarly Assessment: Misrepresentation (Directly Contradicted by Montaigne).**
      *   **Why:** This conclusion is precisely what Montaigne *argues against* in the essay.
          1.  **The Torture Comparison:** He *directly* engages in cross-cultural criticism, ranking European torture as *worse* than Tupinambá cannibalism.
          2.  **The Standard:** He uses "reason" and "nature" as his standpoints. The Pyrrhus story introduces the "eye of reason." The comparison to Plato's *Republic* invokes a philosophical ideal of justice/nature. He consistently appeals to what is "natural."
          3.  **His Target:** His core critique *is* cross-cultural criticism – criticizing contemporary European (specifically French) customs using ancient philosophy and the Tupinambá example.
          4.  **Rejection of the Premise:** Montaigne does *not* accept that "custom is the only measure." He argues we are *trapped by it habitually*, but that philosophy, reason, and studying other cultures/nature allow us to transcend it and make judgments. Missionaries or human rights advocates might be criticized by Montaigne for *hypocrisy* or *lack of self-awareness* (as Europeans were towards the Tupinambá), but not for the *incoherence* of making cross-cultural judgments *per se*. He would demand they apply reason and self-critique consistently.

  **Conclusion on the Chapter's Logic:**
  *   **The Conclusion Does NOT Follow:** The chapter's final claim ("all cross-cultural criticism is incoherent") is fundamentally flawed because it relies on misreading Montaigne as a strict cultural relativist who believes custom is the *only* measure. The accurate parts of the summary (his critique of ethnocentrism, his description of sources, the torture comparison) **actively undermine this conclusion**:
      *   The **torture comparison** proves he *does* rank cruelties cross-culturally, using reason and a standard of suffering/hypocrisy.
      *   His use of **Pyrrhus** explicitly introduces "the eye of reason" as an alternative to common report/custom.
      *   His comparison to **Plato's Republic** invokes a philosophical standard outside contemporary French custom.
      *   His **entire project** is cross-cultural criticism of Europe.
  *   **What the Torture Comparison Leaves of "Custom as Only Measure":** It demolishes it. Montaigne demonstrates that while custom powerfully shapes perception, it is *not* the only measure available to the reasoning mind. He uses the comparison to show that *reason itself* (applied consistently and self-critically) can provide a basis for judgment that transcends cultural boundaries. His relativism is a tool for skepticism and self-examination, leading *towards* a more reasoned (though always provisional) understanding, not a denial of the possibility of judgment itself. He rejects the *absolutism* of custom, not the possibility of reasoned critique based on broader human principles he associates with "nature" and philosophy.
