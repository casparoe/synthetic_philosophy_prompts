prompt: |-
  I've read decision-theory threads on and off for a decade, and I long ago internalized the slogan that temporally inconsistent preferences leave you open to a money pump, so that diachronic consistency is a requirement of rationality, full stop. Writing down my actual verdicts on cases, though, I find the slogan doesn't capture them, and I'd like to know what principle, if any, does.

  1. The textbook cycle, but encountered one pairwise comparison at a time: offered a straight choice, I'd rather present at the conference on Friday than on Monday, rather present Monday than not at all, and rather not present at all than on Friday — say, because Friday means flying home on my anniversary. Each answer seems reasonable in the moment; assembled, they cycle, and a program chair who spots it can extract fees from me indefinitely. Verdict: irrational. And I hold this even for the version where I foresee the pump and would refuse the first trade: the defect is in the dispositions, not in any sequence of choices I ever actually make.

  2. New information: I planned to order the tasting menu; a friend who knows the restaurant tells me the courses are heavy on shellfish, which will put me in the hospital, so I switch to the vegetarian menu. Verdict: fine, trivially. Updating on evidence isn't a violation of diachronic consistency.

  3. No new information about the world, but new information from the inside: at the start line I preferred finishing the marathon to dropping out; at mile 22 I stop, having learned nothing about the world — only what the pain is like from in here. Verdict: I think this can be rational; "no new information" is too quick, since experience is information. But I can see that once this is allowed, a lot of convenience-based preference changes get to disguise themselves as discovery.

  4. Same facts, different context: in December I resolve that the January bonus goes into the index fund; when January comes and the money sits in my checking account, it goes to the trip to Japan instead. Nothing was learned, inside or out. Verdict: irrational — and I notice that an entire industry (buy-now-pay-later, casinos) exists to pump exactly this. Yet I go back and forth, because it lacks the cyclic shape of (1): it's a single reversal, and no trader gets unbounded profit from it, only a one-time transfer. Does the money-pump standard require iterability, or is a one-shot extraction enough?

  5. Commitment: I hand a friend $200, forfeited if I don't submit the chapter by the first, knowing that on the deadline night I will prefer keeping the money to submitting, and that I will then know nothing I don't know now. Verdict: the binding is rational. But this looks structurally like (4) with the polarity reversed — a present preference overriding a predictable future one — and I don't have a principled account of why (4) is inconsistency while (5) is precommitment.

  Is there a single principle that captures all five — presumably something about which preference changes count as learning, which as drift, and which preferences may bind which? Please state it precisely, say which clause each of my verdicts motivates, and tell me what it predicts for a case I haven't listed: the house-money effect, where I take more risk with winnings than with my salary while knowing, at both times, that a dollar is a dollar. Please also say how confident you are in each part of the answer and single out the point you'd most expect to be wrong — my guess is the treatment of (3), but tell me if you'd locate the weak spot elsewhere.
reasoning: |-
  Okay, let me try to unpack this user's query. They're deeply familiar with decision theory but struggling with how their intuitive verdicts on various cases don't align with the standard money-pump argument for diachronic consistency. They present five scenarios with their judgments and want a unifying principle that explains them all.

  First, I need to understand each case and their verdicts. The textbook money pump (case 1) is clearly irrational to them. Case 2 with new information is rational, which makes sense. Case 3, where new experiential knowledge changes preferences during a marathon, they see as potentially rational. Case 4, the bonus spending reversal without new info, feels irrational despite lacking a cycle. Case 5, precommitment with forfeit money, is rational even though it structurally resembles case 4.

  The core tension seems to be: when should preference changes count as rational updating versus irrational inconsistency? The user hints that "no new information" might be too simplistic because experience itself can be informative (like mile 22 pain). But they're wary this could justify convenient preference shifts.

  For a unifying principle, I consider what distinguishes legitimate preference changes. New external information (case 2) clearly qualifies. Internal experiential learning (case 3) might too if it reveals previously unknown subjective states. But case 4 lacks any such discovery - it's pure time-discounting or willpower failure. Case 5's rationality suggests that overriding future preferences is acceptable when done via commitment to counter predictable irrationality.

  The house-money effect case they mention at the end is interesting. People treat "found money" differently even knowing dollars are fungible. Under this framework, that would likely be irrational drift unless there's hidden belief change (e.g., "this money was unexpected so losing it hurts less" - but even then it feels more like cognitive bias).

  I should emphasize that case 3 (marathon pain) is the most debatable part. Some decision theorists might insist real preferences shouldn't change based on transient states. But the user's intuition about experiential learning feels philosophically defensible, even if practically slippery.

  The key distinction might be whether the preference shift stems from belief revision (rational) versus mere state changes (irrational if inconsistent). But this needs careful phrasing to avoid circularity. Maybe framing it as "information that resolves uncertainty about true state-dependent utilities" could work, with clear parameters for what counts as legitimate uncertainty resolution.
answer: |-
  Here's a single principle capturing your verdicts, grounded in information and resolvable uncertainty:

  **Principle of Rational Preference Revision (PRPR):**  
  A preference shift is rational iff it results from acquiring information that resolves *genuine uncertainty* about either (a) the state of the world relevant to outcomes, or (b) one's own stable, state-dependent valuation of outcomes. Preferences formed under certainty (or resolved uncertainty) must be diachronically consistent to avoid exploitation.

  **Key clauses & your cases:**
  1.  **"Genuine uncertainty... state of the world"** (Case 2: Shellfish): Learning about the menu resolves uncertainty about an objective state (allergen presence), justifying the shift. This is standard Bayesian updating.
  2.  **"Genuine uncertainty... own stable, state-dependent valuation"** (Case 3: Marathon): At mile 0, you were uncertain about your *stable* valuation of *completing vs. quitting* under the *state* of "extreme fatigue/pain". Experiencing mile 22 resolves that uncertainty about your true preferences *in that physical state*. Verdict: Rational. The "stable" qualifier excludes fleeting moods; the valuation must be tied to a persistent state (like physical exhaustion).
  3.  **"Preferences formed under certainty... must be diachronically consistent"** (Case 1: Textbook Pump): Once uncertainty is resolved (you know you prefer A>B, B>C, C>A *in the same state*), cyclic preferences create arbitrage. Verdict: Irrational. Foreseeing the pump highlights the flaw in the disposition itself.
  4.  **Violation: Shift without resolved uncertainty** (Case 4: Bonus): In December (state: distant future), you prefer saving. In January (state: immediate temptation), you prefer spending. No uncertainty about the world (bonus amount, trip cost) or your *stable* valuations was resolved (you *knew* in December you'd face temptation). The shift stems purely from temporal proximity changing your revealed preference, not resolving uncertainty about your true values. Verdict: Irrational. The lack of a cycle doesn't absolve it; exploitability exists (one-shot pump) due to *predictable* inconsistency relative to your resolved preferences.
  5.  **Commitment as enforcing resolved preferences** (Case 5: Deadline): You *resolve uncertainty* in the present (state: calm deliberation) about your *stable* preference for submitting over procrastinating. The future state (deadline pressure) predictably distorts your revealed preference. The commitment device enforces your resolved (calm-state) preference against the predictable distortion. Verdict: Rational. This *preserves* consistency with your resolved preferences, unlike (4) which abandons them.

  **Confidence & Weak Spot:**
  *   **High Confidence:** Core distinction (resolved uncertainty vs. mere state-change/distortion), Cases 1, 2, 4, 5 verdicts, and the house-money prediction below.
  *   **Moderate Confidence:** Case 3 verdict. This *is* the weak spot. **Why?** Distinguishing "resolving uncertainty about stable valuation under state S" from "merely having state S change your transient preference" is inherently fuzzy. What makes the marathon pain valuation "stable"? Couldn't someone rationalize *any* temptation as "resolving uncertainty"? My justification relies heavily on the *physicality* and *objectivity* of the exhaustion state making the valuation stable/revealing. This might not hold for all experiential learning claims. (You were right to guess this!)

  **House-Money Effect Prediction:**
  *   **Scenario:** You treat $100 won gambling differently from $100 salary, taking more risk with it, despite knowing "a dollar is a dollar" at both times.
  *   **PRPR Prediction:** Likely **Irrational**.
      *   **No Uncertainty Resolved:** You know the source of the money (gambling win vs. salary). You know (or claim to know) the monetary value is identical. You know your risk tolerance in principle. The shift isn't based on new information resolving uncertainty about states or valuations.
      *   **State-Drift, Not State-Dependent Valuation:** The "state" (having house money) changes your *revealed* risk preference, but it doesn't resolve uncertainty about your *stable* valuation of outcomes under that state. Your *stable* valuation under "wealth state X" shouldn't care about the source of a marginal dollar if you know its objective value and your risk profile. The shift looks like cognitive bias (mental accounting) exploiting predictable preference drift.
      *   **Exploitability:** While not a perfect money pump, it enables predictable one-shot losses (e.g., casinos encourage betting winnings more freely knowing this tendency).

  **Why PRPR Works:**
  1.  **Unifies Learning & Self-Discovery:** Captures external (Case 2) and internal/experiential learning (Case 3) under "resolving genuine uncertainty".
  2.  **Distinguishes Rational Commitment from Irrational Drift:** Commitment (Case 5) enforces preferences formed under resolved uncertainty. Drift (Case 4) abandons them without justification.
  3.  **Explains Money Pumps:** Both cyclic (Case 1) and one-shot (Case 4) exploitability arise from violating diachronic consistency *relative to resolved preferences*. The requirement isn't just iterability; it's vulnerability to exploitation *based on predictable inconsistency*.
  4.  **Handles "No New World Information":** Case 3 shows "information" includes resolving uncertainty about one's *own* valuations under specific states, not just the external world.

  PRPR elevates "diachronic consistency" from a bare requirement to a consequence of acting on *resolved* preferences, while providing criteria for when preference revision is rational. Its vulnerability lies in the potentially contestable line between "resolving uncertainty about a stable valuation" and "merely having a state change your preference."
