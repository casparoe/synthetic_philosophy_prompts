prompt: |-
  I'm a graduate TA running a fifty-minute section in a third-year course on free will and moral responsibility. Next week's reading is Galen Strawson's Basic Argument, and my students have just spent two weeks on compatibilism, so they'll arrive primed to file the paper under 'hard determinism' and move on. Plan the section for me rather than explaining the argument to me: the order in which the pieces must be introduced (I suspect the distinction between ultimate and ordinary responsibility has to come first, so the argument can't be heard as a rehash of the determinism debate, but check whether that's right and whether anything else has to precede even that); the single case I should carry the whole session through — it should be one in which the students start out genuinely wanting to blame the person, and it should be set up so that letting indeterminism into the story at any point visibly fails to help, since that is the move that separates the Basic Argument from hard determinism; the misconceptions they'll form, and exactly where in the sequence each should be headed off — my guesses are that they'll hear it as an argument that determinism is true, that they'll read the claim that true responsibility would require being causa sui as the claim that you'd have to have caused your own existence, and that they'll take the argument to depend on character being fixed rather than on the structure of self-creation; then one question I can ask in the last five minutes whose answer would show whether they've grasped that the argument turns on the structure of responsibility rather than on the truth of determinism; and finally what I should openly decline to get into at this level, together with what I should tell them about why I'm declining.
reasoning: |-
  Okay, the user is a graduate TA preparing for a fifty-minute section on Galen Strawson's Basic Argument. The students have just finished two weeks on compatibilism, so they might dismiss Strawson as just another hard determinist argument. The TA wants a lesson plan that prevents misconceptions and highlights the uniqueness of Strawson's argument.

  First, I need to recall the Basic Argument's structure. It argues that moral responsibility is impossible because it requires ultimate responsibility, which would necessitate being causa sui—self-caused in a way that's logically impossible. This is different from hard determinism, which focuses on determinism's incompatibility with free will. Strawson's point is structural, not about determinism.

  The TA mentioned starting with the distinction between ultimate and ordinary responsibility. That makes sense because without that, students might conflate it with determinism. So beginning with that distinction is crucial. Also, using a compelling case study where blame seems natural but ultimate responsibility is impossible. The case should show that indeterminism doesn't solve the problem, which separates Strawson from hard determinism.

  For the case study, a "rotten apple" scenario like a school shooter who had a terrible upbringing. Students would want to blame him initially. Then, tracing back the causes—his abusive parents, their upbringing, and so on—shows he didn't choose his formative influences. Even if indeterminism is introduced (e.g., a random event), it doesn't make him responsible because randomness isn't authorship. This illustrates Strawson's point about the structure of self-creation.

  Common misconceptions: students might think the argument assumes determinism, confuse causa sui with causing one's existence, or focus on fixed character instead of the regress of self-creation. These need to be addressed at specific points. For example, when introducing causa sui, clarify it's about self-creation, not existence. When discussing the regress, emphasize it's about the impossibility of being the ultimate cause of one's traits, not that traits are fixed.

  A check question at the end could be: "If determinism were false, would that make us ultimately responsible?" The correct answer is no, because indeterminism doesn't provide self-creation. This tests if they grasp the structural argument.

  The TA should avoid delving into compatibilist responses or other theories since the goal is to understand Strawson's unique argument. Explaining that focusing on Strawson first allows deeper engagement before comparing with other views.

  Timing the fifty-minute session: intro (5 min), responsibility distinction (10 min), case study (20 min), regress and causa sui (15 min), misconceptions and conclusion (10 min). Using the case study throughout keeps it concrete.

  Need to ensure the case study is sensitive but impactful. Avoid real cases to prevent triggering students. Emphasize that Strawson's argument is about logical impossibility, not determinism. Using board diagrams for the regress can help visualization.

  Finally, preemptively address where misconceptions might arise. When defining causa sui, immediately clarify it's not about existence. When discussing the regress, stress it's structural. Highlighting that adding randomness doesn't help during the case study analysis.
answer: |-
  Here’s a structured 50-minute plan designed to force engagement with Strawson’s unique argument while preempting misconceptions. The key is using a **single, visceral case study** to anchor the discussion and expose why indeterminism fails.

  ---

  ### **Section Plan: Galen Strawson’s Basic Argument**  
  **Core Goal:** Show that the argument targets the *structure of moral responsibility itself*, not determinism.  
  **Anchor Case:** **Liam** (details below)  

  ---

  ### **Timeline & Sequence**  
  **Total: 50 mins**  

  1. **Intro: Framing the Distinction (5 mins)**  
     - Start with: *"Strawson isn’t arguing about determinism. He’s asking: What would it take to be* TRULY *morally responsible—not just legally or socially, but in a way where you’re the* ultimate source *of your actions?"*  
     - **Define:**  
       - **Ordinary Responsibility** (what courts/parents assign): Based on control, intentions, and social norms.  
       - **Ultimate Responsibility (UR)**: Being the *uncaused cause* of your choices—nothing prior determines *who you are* when you act.  
     - **Why start here?** If UR isn’t distinguished first, students default to determinism/compatibilism.  

  2. **Case Study: Liam (20 mins)**  
     - **Present Liam (5 mins):**  
       *"Liam, raised in extreme poverty by abusive, alcoholic parents, was neglected and beaten. He witnessed violence daily. At 25, he robs a store, assaults the clerk, and leaves them permanently disabled. He shows no remorse."*  
       → Ask: *"Do you want to blame Liam? Why?"* (Elicit intuitions: *He chose to harm; he’s dangerous*.)  
     - **Trace Causes (10 mins):**  
       - *"Why is Liam the way he is?"* → Parents’ abuse, poverty, trauma.  
       - *"Why were his parents abusive?"* → Their own trauma, addiction, lack of resources.  
       - *"Could Liam have chosen differently?"* → Yes, but *only* using the desires/values he acquired from his upbringing.  
       → **Key Q:** *"Did Liam* choose *to need violence to feel powerful? Did he choose his trauma responses?"*  
     - **Indeterminism Test (5 mins):**  
       *"Suppose an undetermined event occurred—e.g., a neuron fired randomly in Liam’s brain during the robbery, making him angrier. Does this make him* ultimately *responsible?"*  
       → Students should see: Randomness ≠ authorship. If the "choice" is random, Liam *still* didn’t control what made him *likely* to choose violently.  

  3. **Strawson’s Argument via Liam (15 mins)**  
     - **The Regress (10 mins):**  
       - *"To be UR for robbing the store, Liam must be UR for the character that led him to rob.*  
       *But to be UR for that character, he must be UR for whatever formed it (e.g., his values at 20).*  
       *But to be UR for* those*... and so on."*  
       → **Visual:** Draw a backward chain on the board: *Action ← Character ← Prior State ← ...*  
       - *"Where could this chain start? At birth? Earlier?"*  
     - **Causa Sui (5 mins):**  
       - *"Strawson says UR requires being* causa sui *(self-caused). This* doesn’t *mean causing your existence. It means: You must have created your* initial self *— but you can’t, because you need a self to do the creating."*  
       → **Analogy:** *"Can you design your own brain from scratch? You’d need the very brain you’re trying to design to do it."*  

  4. **Combatting Misconceptions (5 mins)**  
     Address these *as they arise* or preemptively:  
     - ❌ **"This assumes determinism!"**  
       → *"Notice: Even if Liam’s choices had indeterministic gaps, did he* create *his core self? Random events don’t give you authorship."* (Refer to the Indeterminism Test.)  
     - ❌ **"Causa sui = causing your birth!"**  
       → *"No—it’s about causing your* motivational structure. *Liam didn’t choose to need violence to feel in control."*  
     - ❌ **"This claims character is fixed!"**  
       → *"Strawson agrees character changes—but UR requires you to be responsible for* how it changes. *Did Liam* ultimately *choose his therapy, influences, or random changes?"*  

  5. **Closing Check (5 mins)**  
     - **Key Question:**  
       *"If we discovered the universe is fundamentally* indeterministic, *would that give us Ultimate Responsibility? Why/why not?"*  
       → **Correct answer:** No. Indeterminism might break causal chains, but it doesn’t allow you to be the *original author* of yourself.  

  ---

  ### **What to Openly Decline & Why**  
  - **"Does this mean no one should be punished?"**  
    → *"Strawson’s focus is* moral desert, *not practical consequences. We’ll discuss punishment theories later, but today we’re isolating the concept of UR."*  
  - **"How do compatibilists respond?"**  
    → *"They reject UR as incoherent or unnecessary. But today, we’re testing Strawson’s claim that UR is* essential *for true blame/praise—not whether compatibilism offers an alternative."*  
  - **Deep metaphysics (e.g., agent causation)**  
    → *"Strawson’s point is that* any *account of responsibility requiring self-creation fails. We’ll explore solutions next week."*  

  **Why decline these?** Strawson’s argument is radical *because* it’s structurally distinct. Letting students wrestle with UR’s impossibility—without switching frameworks—is the goal.  

  ---

  ### **Why Liam Works**  
  - Students *want* to blame him (leveraging moral intuition).  
  - His background forces the question: *"Did he choose to be this way?"*  
  - Adding indeterminism visibly fails (randomness ≠ self-authorship).  
  - The regress is clear: He didn’t create his trauma, his parents’ issues, etc.  

  **Tip:** If discussion lags, return to Liam. *"Where in Liam’s life could he have become the ultimate source?"*  

  This plan forces engagement with Strawson’s core insight: **Moral responsibility requires the impossible—being unmade before you exist.**
