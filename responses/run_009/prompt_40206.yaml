prompt: |-
  I teach a mixed graduate seminar that leans heavily on history of science and history of ethics, and over the last few years I've watched a certain reflex spread among my history-minded colleagues and students, which I would like a name for if one exists. Everyone now knows the old sin: writing the past as a steady march toward our present opinions, treating earlier thinkers as failed approximations of us. But the correction has overshot in a distinctive way, and I keep running into it. Last spring I said, in passing, that Priestley had been simply wrong about combustion, and a student objected that this "imposes our standards on his conceptual world" -- as though "wrong about combustion" were an invidious comparison rather than an ordinary evaluation. A colleague reviewing a dissertation insisted that the chapter describe Aristotelian mechanics not as an early and inaccurate account of motion but as a "coherent framework in its own terms," and when I asked whether it was nonetheless less accurate, she said the question was "not a historical question." In another case a student defended a reading of a nineteenth-century moral theorist on the ground that it would be "anachronistic" to notice the theorist's argument was invalid. In each case the move was the same: some legitimate methodological point about understanding past thinkers on their own terms gets quietly converted into a refusal to make any evaluative claims about them at all.

  What intrigues me is that this is not the relativism it superficially resembles, because the people doing it are perfectly comfortable asserting that our current theories are true, that Lavoisier really did have the better of it, that some contemporary moral arguments are sound and others not. The refusal runs in one direction only: toward the past. It is also not the ordinary methodological caution about anachronism, which, done properly, governs what you must attend to in explaining a past view -- the questions it was answering, the standards internal to its time -- without saying anything about whether the view was correct. The people I have in mind have converted a rule about explanation into a rule about evaluation, and have done so selectively. Nor is it exactly the old sin in reverse: writing history as progress toward the present at least lets you say the past was worse; this reflex protects the past from comparative judgment altogether, and I cannot tell whether that is a substantive epistemology (past conceptual schemes are somehow incommensurable with ours), a moral scruple (the dead cannot defend themselves), or just a nervous tic that has become fashionable.

  Does this overcorrection have an established name in the historiography literature -- something that would be to the sin of Whig history what Whig history is to naive chronicle? I know the standard concepts in the neighborhood: the Whig interpretation itself, presentism, anachronism, and I am aware that the sociology-of-knowledge tradition said things about explaining true and false beliefs symmetrically, though I have never worked through whether that is the same thing or only looks like it. What I want is the carving, not the label: precisely what the phenomenon is, how it differs from each of the nearby concepts, and where its edges are -- in particular, whether there is a defensible version of the refusal (perhaps when past and present frameworks genuinely do not share enough machinery for comparative evaluation) that my student and my colleague are garbling, or whether every version collapses into the indefensible asymmetry I have described. If nothing established fits, please say so, coin a term for the asymmetrical refusal itself, and give me the boundary cases: views we can now safely call wrong, views where the comparison genuinely breaks down, and views where the only remaining disagreement is about which of those two categories they fall into.
reasoning: |-
  Okay, the user is describing a specific phenomenon in their academic field—history of science and ethics. They've noticed a trend where colleagues and students avoid making evaluative claims about past thinkers, even when those thinkers were demonstrably wrong. For example, saying Priestley was wrong about combustion was challenged as imposing modern standards. The user wants to know if there's a name for this overcorrection beyond Whig history or presentism.

  First, I need to pinpoint what makes this different. It's not just avoiding anachronism; it's a selective refusal to evaluate the past while still affirming current truths. The asymmetry is key: it's okay to say Lavoisier was right now, but not that Priestley was wrong then. 

  Looking at historiography concepts, presentism is judging the past by modern standards, which they're avoiding. Whig history is seeing the past as leading to the present, which they're also avoiding. But this seems like an overcorrection where any evaluation is seen as non-historical. 

  The sociology of knowledge (Bloor's symmetry principle) comes to mind, but that's about explaining true/false beliefs similarly, not refusing to evaluate. The user's colleagues aren't explaining symmetrically; they're just not evaluating the past at all. 

  Hmm, is there a term for this? Maybe "evaluative abdication" or "asymmetric historicism"? The latter might work because it emphasizes the one-sided refusal to judge the past. 

  Boundary cases: When can we safely say something was wrong? Combustion is a clear case—empirical evidence shows Priestley was mistaken. But what about phlogiston theory? It was coherent in its time but still incorrect by modern understanding. Then there's incommensurable frameworks, like Aristotelian physics vs. Newtonian. They answer different questions, so direct comparison is harder. Moral theories might fall into the contentious middle ground, where evaluation is debated.

  The user also wonders if there's a defensible version. In cases of true incommensurability, evaluation might not make sense. But in many cases, especially empirical ones, we can judge accuracy. The problem is when this refusal is applied indiscriminately. 

  I should clarify that this isn't relativism since current truths are accepted. It's an epistemic double standard. The core issue is converting methodological caution into a taboo on evaluation. 

  So, proposing "asymmetric historicism" as a term. Define it, distinguish from related concepts, and outline boundary cases. Make sure to address their deeper need: understanding whether this overcorrection has merit or if it's just an error, and how to handle evaluations in their teaching.
answer: |-
  This phenomenon you're describing is a precise and increasingly common overcorrection that **lacks a single universally established name** in historiography, but it can be precisely carved and named. It is distinct from neighboring concepts and represents a specific epistemological asymmetry.

  ### The Carving: Asymmetric Evaluative Abdication (or Asymmetric Historicism)

  1.  **Core Phenomenon:** The *selective refusal to apply contemporary epistemic standards (truth, accuracy, soundness, empirical adequacy) to past ideas or arguments*, while simultaneously accepting and applying those same standards to contemporary ideas. This stems from a (mis)application of methodological historicism/anachronism-avoidance, converting a rule about *explanation* (understand the past in its own context) into a rule about *evaluation* (withhold judgment on its truth/accuracy/soundness).
  2.  **Key Distinctions:**
      *   **Whig History:** *Does* evaluate the past, but judges it *solely* by how well it leads to the present ("progress"). It sees the past as inferior/incomplete but judges it *using present standards*. Your phenomenon *refuses* evaluation using present standards.
      *   **Presentism:** Imposes *current values, concepts, or concerns* onto the past in an explanatory or judgmental way. Your phenomenon *explicitly avoids* imposing current concepts for judgment, but incorrectly extends this avoidance to *withholding epistemic evaluation based on shared reality*.
      *   **Methodological Historicism/Contextualism:** Requires understanding past ideas within their own conceptual frameworks, questions, evidence, and standards *as a prerequisite for explanation*. It *does not preclude* subsequently evaluating those ideas against shared epistemic standards (like empirical accuracy or logical validity) where applicable. Your phenomenon misinterprets this as *forbidding* the subsequent evaluation.
      *   **Relativism (Epistemic/Cognitive):** Argues that truth/justification are *only* relative to a specific framework/era, making cross-era evaluation impossible *in principle*. Your phenomenon's actors *do not* hold this; they accept *our* current standards as valid for *us* and often implicitly for evaluating the *outcomes* of the past (Lavoisier won), but refuse to apply those standards *directly to the past thinker's claim* ("Priestley was wrong"). The asymmetry refutes pure relativism.
      *   **Symmetry Principle (Sociology of Knowledge):** Advocated (e.g., by Bloor) that *explanations* for why people hold beliefs should be the same type (social, psychological) regardless of whether we now judge the belief true or false. This is about *causal explanation*, not *epistemic evaluation*. Your phenomenon involves a refusal of *evaluation*, not necessarily a symmetrical *explanation*. They might happily explain Priestley using context *and* Lavoisier using experiment, refusing only to say "Priestley was wrong".

  3.  **The Asymmetry:** The core is the *one-way barrier to evaluation*. Evaluation flows forward (we can judge past *outcomes* like "Lavoisier's theory prevailed because it was better") but not backward (we cannot say "Priestley *was* wrong"). It protects the past from being called "wrong" or "inaccurate" while accepting that our present, built upon the rejection of that past, is "right".

  4.  **Motivations:** Likely a mix:
      *   **Epistemological Confusion:** Mistaking the necessity of contextual *understanding* for the impossibility of cross-contextual *evaluation* on shared grounds (like empirical observation or logic).
      *   **Moral Scruple (Hyper-Sensitivity):** An overblown fear of being "judgmental" towards the past or "imposing" on the dead, elevated to an epistemological principle.
      *   **Fashionable Tic:** An uncritical adoption of "context is everything" rhetoric without examining its limits, leading to a safe but intellectually hollow stance.

  **Proposed Name: Asymmetric Evaluative Abdication (AEA) / Asymmetric Historicism**

  *   **Abdication:** Highlights the deliberate refusal to perform a necessary intellectual task (evaluation).
  *   **Asymmetric:** Captures the core flaw – the refusal only applies *towards the past*.
  *   **Historicism:** Connects it to the methodological tradition it misapplies.

  ### Boundary Cases & Defensibility

  The defensible core your colleagues/students garbled is the recognition that **evaluation requires a shared framework or common ground**. AEA occurs when this requirement is applied *asymmetrically* or when the threshold for "sufficient shared ground" is set *unreasonably high*. Here's the breakdown:

  1.  **Clearly Evaluable (AEA Indefensible):**
      *   **Cases:** Claims about a shared, stable physical reality accessible (in principle) to both eras using different methods. Priestley's phlogiston theory vs. combustion involving oxygen. The shape of the Earth (flat vs. spherical). Basic empirical misobservations corrected by better instrumentation (e.g., sunspots). Arguments with clear logical fallacies identifiable within the past thinker's *own* logical framework (e.g., affirming the consequent if their system uses modus ponens).
      *   **Why:** We share the same physical world and basic logical principles. We can reconstruct the evidence available to them *and* the evidence available now. We can judge if their theory accurately modeled/explained/predicted the phenomena *they* observed and *we* observe. Saying "Priestley was wrong about combustion" is no more "imposing" than saying "Medieval mapmakers were wrong about the coastline here" based on better data. It's factual correction based on shared reality.

  2.  **Genuinely Incommensurable / Evaluation Meaningless (AEA Defensible *in these specific cases*):**
      *   **Cases:** Frameworks addressing fundamentally different questions or operating with radically different metaphysical commitments or standards of proof that preclude direct comparison *on specific points*. Judging Aristotelian *final causes* (purpose) by Newtonian *efficient causes* (force) misses the point of the former. Evaluating a medieval alchemist's quest for the Philosopher's Stone solely by modern chemistry's failure to produce gold that way ignores the spiritual/transformative goals. Judging a moral system based purely on divine command by secular utilitarian standards might be irrelevant to its internal validity *for believers*.
      *   **Why:** No shared goal, object of study, or standard of success exists for direct comparison. Asking "Is Newtonian mechanics *more accurate* than Aristotelian physics?" is incoherent if "accurate" means "predicts planetary orbits" – Newton wins easily. But if "accurate" means "explains why elements seek their natural place in a purposeful cosmos," Aristotle wins *within his framework*. Evaluation requires specifying *by which framework's standards*.

  3.  **Contentious Middle Ground (Where Dispute is Legitimate):**
      *   **Cases:** Many moral, social, or metaphysical theories; interpretations of complex historical events; theories where evidence is heavily theory-laden or interpretations differ significantly. Was Malthus "wrong" about population? (Empirically, on specifics, often yes; on the core tension, arguably not). Were 19th-century racial theories "invalid"? (Scientifically & morally, yes by our lights; but evaluating their *internal logic* vs. their *empirical foundations* vs. their *moral implications* requires careful framing). Arguments where validity depends on premises we reject but they held fervently.
      *   **Why:** Disagreement here is often about *which aspects* can be evaluated objectively (logical structure, empirical claims based on shared reality) vs. *which aspects* depend on values, foundational premises, or interpretive frameworks that lack a clear common ground. The key is avoiding the *blanket refusal* of AEA and instead engaging in the nuanced work of specifying *what* is being evaluated and *by which standards* (historical, logical, empirical, modern ethical).

  ### Conclusion

  The phenomenon you observe is **Asymmetric Evaluative Abdication (AEA) / Asymmetric Historicism**. It's an *overcorrection* stemming from a valid concern (contextual understanding) but misapplied as a taboo on epistemic evaluation specifically directed towards the past, while maintaining those standards for the present. It is **indefensible as a general principle** because it ignores the vast territory where shared reality and shared logical principles provide legitimate common ground for evaluation ("Priestley was wrong"). However, it *points towards* a **defensible core principle**: evaluation requires identifying a relevant shared framework or standard. Disputes most often arise in the contentious middle ground (Category 3), where careful articulation of *what* is being evaluated and *by which standard* is essential, rather than resorting to the blanket refusal of AEA or the opposite sin of crude presentism. Your challenge is to steer students away from the fashionable tic of AEA and towards this more nuanced, intellectually rigorous engagement with the past.
