  - Voters (judges) each provide a consistent and complete judgment set (a truth assignment to all propositions in the agenda that respects the logical constraints).
  - We wish to aggregate these individual judgments into a collective judgment set that is also consistent and complete.
  - The dilemma: premise-based (vote on premises and then derive the conclusion) vs. conclusion-based (vote directly on the conclusion) can lead to different outcomes even with the same votes.

  Distributed Systems Mapping:

  1. **The System Model**:
     - The judges are nodes in a distributed system.
     - Each node holds a private state: its judgment set (a set of beliefs about the propositions, which is consistent and complete with respect to the logical constraints).
     - The goal is to achieve a collective state (a replicated state) that is also consistent and complete.

  2. **The Aggregation as a Consensus Problem**:
     - We are trying to agree on the truth values of a set of propositions that are logically interdependent.
     - This is similar to agreeing on a state in a state machine replication, but with the twist that the state must satisfy logical constraints (so not every combination is allowed).

  3. **Premise-Based Aggregation**:
     - We break the problem into two parts: 
          - First, we run a consensus (or use a voting mechanism) on each premise (atomic proposition) independently. 
          - Then, we derive the conclusion (and any other non-atomic propositions) from these agreed premises using the logical rules.
     - In systems terms: 
          - The premises are the base state (like the replicated log in Raft). 
          - The conclusion is computed as a derived state (like applying the state machine to the log to get the current state).
     - This method guarantees that the collective judgment set is consistent (because we derive the conclusions from the premises and the logical constraints) but it might not reflect the majority view on the conclusion.

  4. **Conclusion-Based Aggregation**:
     - We run a consensus (or vote) directly on the conclusion (and possibly on other non-atomic propositions) without regard to the premises.
     - In systems terms: 
          - We are replicating the derived state directly (like replicating the current state without the log). 
          - However, note: if we only vote on the conclusion, we leave the premises unset. But in the classic example, the agenda includes both premises and the conclusion, so we must have a complete judgment set. Therefore, in a conclusion-based approach, we might only vote on the conclusion and not on the premises? But that would leave the collective judgment incomplete. 
          - Actually, the conclusion-based approach in the literature typically only outputs the conclusion and does not output the premises. However, the problem requires a complete judgment set. So the classic conclusion-based aggregation does not produce a complete set. Alternatively, one might vote on every proposition independently (without considering logical constraints) and then face the risk of inconsistency.

     - The problem: if we vote independently on every proposition, we might get an inconsistent set (e.g., majority says P is true, Q is true, but P∧Q is false). But in the example, the conclusion-based aggregation only votes on the conclusion and ignores the premises? Actually, in the example, the judges are voting on the conclusion (liability) and the collective judgment set only includes the conclusion? That would be incomplete. The literature often contrasts two methods: one that builds a complete set by voting on every proposition (which may be inconsistent) and one that votes only on the conclusion (which is incomplete). The dilemma is that the premise-based method gives one result (liable) and the conclusion-based (on the conclusion alone) gives the opposite.

     - However, the impossibility theorems (like the List-Pettit theorem) consider aggregation rules that must output a complete and consistent set for a sufficiently complex agenda.

  5. **Impossibility Results**:
     - The theorem (generalizing Arrow's theorem) says that for agendas that include at least two atomic propositions and their conjunction (or more generally, a sufficiently complex logical structure), any aggregation function that satisfies:
          - Universal Domain: accepts any profile of individual judgments (as long as each is consistent and complete).
          - Collective Rationality: outputs a consistent and complete collective judgment.
          - Unanimity: if all individuals agree on a proposition, the collective judgment must too.
          - Systematicity: the collective judgment on a proposition depends only on the individual judgments on that proposition (like independence of irrelevant alternatives) and is the same for every proposition (same function).
       must be an oligarchy: there is a fixed set of voters (at least one) such that the collective judgment is exactly the intersection of their judgments (or something similar) if they agree, and if they disagree, then the collective judgment might be incomplete? Actually, the oligarchy result: there is a fixed set of individuals such that the collective judgment set is the intersection of their individual judgment sets. But if the set is a singleton, then that one individual is a dictator.

     - In systems terms: 
          - We are trying to design a consensus protocol that must output a state that is consistent (satisfies the logical constraints) and complete (assigns a truth value to every proposition) for every possible input (the judges' consistent and complete states). 
          - The protocol must satisfy:
              - Unanimity: if all nodes have the same value for a proposition, the output must have that value.
              - Systematicity: the decision for each proposition is made independently and by the same rule (like majority for every proposition).
          - But the theorem says that if the agenda is sufficiently complex, the only such protocols are those where a fixed set of nodes (an oligarchy) determines the outcome. In particular, if we require the protocol to be anonymous (treating all nodes equally) then we can't have such a protocol.

     - This is reminiscent of the CAP theorem: we want Consistency (logical consistency of the collective judgment), Availability (completeness: we must output a truth value for every proposition), and Partition tolerance. But here the tradeoff is not exactly CAP. It's more like: we want a protocol that is fair (anonymous) and produces a consistent and complete output, but we can't have one for complex agendas.

     - The tradeoff: if we want consistency and completeness, we have to sacrifice either universal domain (i.e., we restrict the inputs) or systematicity (we allow the aggregation rule to be different per proposition or to depend on more than just that proposition) or anonymity (so we allow an oligarchy).

     - In distributed systems, we often sacrifice consistency (in the logical sense) in favor of availability and partition tolerance (as in AP systems) or we sacrifice availability (as in CP systems). But note: the consistency in CAP is about having a single up-to-date copy that is linearizable, whereas here the consistency is about satisfying logical constraints. They are different.

