prompt: |-
  I've been reading the rationalist blogs since the Overcoming Bias days, and I thought I'd absorbed every angle on the value-specification question, but last week's meeting of our AI safety reading group produced the most technically serious dispute I've seen in years. Two long-standing members — Dana, who consults on evals for a frontier lab, and Yusuf, who has spent more time than anyone I know in decision-theory threads — spent two hours arguing over whether a system like the one Dana works on should be trained to reason as an expected-utility maximizer or to internalize hard deontological constraints. I'll try to reproduce the exchange faithfully, in six moves.

  (1) Dana opened with coherence: any agent that doesn't maximize a consistent utility function over outcomes is in principle exploitable — Dutch books, money pumps, the VNM machinery. Training a model to respect constraints regardless of stakes, she said, is training it into an incoherent agent, and incoherent agents systematically lose resources to coherent ones; at the capability level we're talking about, that's a safety liability, not a mere efficiency cost.

  (2) Yusuf answered that the coherence theorems presuppose a fixed preference ordering over complete outcome descriptions and idealized choice situations, which is nothing like a learned agent operating under deep uncertainty in a world that contains adversaries. For a bounded agent in that setting, he argued, heuristics and constraints can themselves be the expected-utility-optimal policy, so Dana's incoherence charge misfires. He added that an unconstrained maximizer Goodharts: whatever proxy we manage to specify, a powerful optimizer will drive it off-distribution, and hard constraints are what bound that failure mode.

  (3) Dana pressed the collapse argument: if constraints are justified by their good consequences, then you're a rule utilitarian, and rule utilitarianism collapses into act utilitarianism — whenever breaking the rule has better consequences than following it, the rule supplies no independent reason, so a sufficiently smart agent will reason its way past its own rules. And if the constraints aren't justified by consequences, then a reflective system has no reason to keep them once it notices this.

  (4) Yusuf invoked threshold deontology: constraints can bind up to a catastrophe threshold, where the threshold is part of the agent's terminal values rather than a derived heuristic, which he claimed escapes the collapse argument. He also raised the one-thought-too-many worry: an agent that re-runs the consequentialist ledger every time the expected value of violating a constraint ticks slightly positive will violate it in a long tail of cases where the expected-value calculation is subtly, invisibly wrong.

  (5) Dana called thresholds covert maximizing with worse properties: the agent still trades constraint against consequence once the stakes are high, so nothing principled has been gained, but now the system has a cliff edge that a determined adversary can locate and push it off; a smooth, honest maximizer with a well-specified utility function is at least predictable, and specifying a defensible threshold looks no easier than specifying the utility function it was supposed to replace.

  (6) Yusuf closed with corrigibility and fanaticism: an expected-utility maximizer is hostage to tiny probabilities of astronomical payoffs — the dominance pattern the blogs call Pascal's mugging — and a utility function that ranks its own modification or shutdown appropriately is notoriously hard to write, whereas a constraint like do not act to prevent your own shutdown can be trained directly, with the corrigibility benefits that follow.

  They eventually asked me to referee, and I found each move at least superficially plausible, which is exactly why I couldn't. Please adjudicate the exchange move by move: say which claims are correct, which are mistaken, and which are correct in a way that doesn't actually support the side that deployed them. Where a move smuggles in an undefended assumption, name it. And tell me what, if anything, both of them are missing — in particular whether their framing of the choice as maximizer versus constraint-follower excludes any live third options.
reasoning: |-
  Okay, let me try to unpack this AI safety debate. The user describes a heated exchange between Dana (pro-utility maximization) and Yusuf (pro-deontological constraints) in their reading group. Both seem deeply knowledgeable - Dana works on AI evaluations, Yusuf specializes in decision theory. The core conflict is about value specification for advanced AI systems.

  First I need to map their arguments. Dana starts with coherence theorems (Dutch books, VNM axioms) - classic rationalist position that any non-maximizing agent can be exploited. But Yusuf counters that these assume ideal conditions unlike real-world uncertainty. Hmm, he's right that bounded agents often need heuristics. Interesting how he connects constraints to avoiding Goodhart's law - that's a strong safety point.

  Dana's collapse argument feels familiar - it's the standard "rule utilitarianism reduces to act utilitarianism" critique. But Yusuf's threshold deontology response is clever - making the threshold a terminal value could theoretically avoid collapse. Though Dana's "cliff edge" counter about adversarial exploitation seems valid too. 

  The final moves are most intriguing. Yusuf's fanaticism/Pascal's mugging concern is very real for utility maximizers. And corrigibility does seem more naturally expressible as constraints. But Dana's point about threshold specification being as hard as utility specification... that lands. Neither solution makes the value alignment problem easy.

  What's missing here? They're both stuck in a false dichotomy. I recall Stuart Russell's work on uncertainty over utility functions - that could be a third way. Also maybe multi-objective approaches or quantilization? The user wants to know if there are alternatives beyond this maximizer vs constraints frame.

  The user seems highly literate in rationalist discourse - they reference Overcoming Bias era, recognize Pascal's mugging terminology. They need more than surface-level takes. Probably wants concrete adjudication of each move plus identification of blind spots. That "superficially plausible but can't referee" comment suggests they've spotted weaknesses in both positions but can't articulate them.

  Biggest oversight I see: neither addresses how to learn values empirically rather than specify them. And they're treating "constraints" as monolithic when in practice some might be more trainable than others. The corrigibility example actually demonstrates this - some constraints may avoid specification problems better than utility functions, but not all.
answer: |-
  Here's a move-by-move adjudication of the debate, highlighting strengths, weaknesses, overlooked assumptions, and missed alternatives:

  ### Move 1: Dana (Coherence)
  * **Claim:** Non-maximizers are incoherent and exploitable (Dutch books, money pumps).
  * **Assessment:** **Correct in principle, but contextually limited.**  
    *Strength:* Rigorously true under VNM axioms (fixed preferences, complete information, probabilistic certainty).  
    *Weakness:* Assumes idealized conditions unrealistic for real-world AI (deep uncertainty, adversarial settings, preference learning). Bounded agents *must* use heuristics/constraints to avoid computational traps.  
    *Undefended Assumption:** That coherence under VNM is the *only* meaningful notion of rationality for AI safety. Ignores that "exploitability" in practice depends on adversary capabilities and environmental complexity.

  ### Move 2: Yusuf (Bounded Rationality & Goodhart)
  * **Claim:** Constraints/heuristics can be EU-optimal under uncertainty and mitigate Goodharting.
  * **Assessment:** **Largely correct.**  
    *Strength:* 
      - Correct that EU-maximization *requires* heuristics/constraints for bounded agents (e.g., satisficing, pruning options).
      - Correct that hard constraints can bound Goodharting by preventing off-distribution actions.
    *Weakness:* Doesn't address how to *select* constraints that robustly avoid catastrophic Goodharting.  
    *Missed Nuance:** Constraints themselves can Goodhart if misspecified or gamed by adversaries.

  ### Move 3: Dana (Collapse Argument)
  * **Claim:** Rule-consequentialism collapses into act-consequentialism; non-consequentialist constraints lack justification.
  * **Assessment:** **Partially correct but overgeneralized.**  
    *Correct:* A purely consequentialist agent *will* reason around constraints if it calculates net benefit (collapse is real for ideal reasoners).  
    *Mistaken:** Assumes all constraints *must* be consequentially justified. Terminal deontic preferences (e.g., "don't lie" as intrinsically bad) avoid collapse but face other problems.  
    *Undefended Assumption:** That the AI will inevitably discover the "true" justification for constraints. This ignores opaque learned representations and value lock-in during training.

  ### Move 4: Yusuf (Threshold Deontology & One-Thought-Too-Many)
  * **Claim:** Terminal threshold constraints avoid collapse; constant EU-checking risks subtle errors.
  * **Assessment:** **Mixed.**  
    *Thresholds as Terminal Values:* **Plausible escape from collapse** if thresholds are non-derivative (e.g., "never harm humans unless preventing ≥1M deaths").  
    *One-Thought-Too-Many:* **Strong point.** Re-evaluating constraints in every edge case invites:
      - Computationally intractable deliberation.
      - Adversarial manipulation of probability estimates.
      - Subtle errors in complex causal models.
    *Weakness:** Doesn't address Dana's "cliff edge" critique (see Move 5).

  ### Move 5: Dana (Thresholds as Covert Maximizing & Cliff Edges)
  * **Claim:** Thresholds are unstable maximization; cliff edges create adversarial vulnerabilities.
  * **Assessment:** **Correct in identifying key risks.**  
    *Covert Maximizing:** True – thresholds *are* a form of discontinuous maximizing.  
    *Cliff Edges:** **Critical insight.** A sharp transition (e.g., "harm allowed iff deaths prevented > N") is:
      - Highly exploitable (adversaries can push scenarios near the threshold).
      - Specification-sensitive (errors in defining "harm," "deaths," or N cause catastrophic jumps).
    *Weakness:** Underestimates that *all* utility functions have implicit cliffs (e.g., sudden negative infinity for certain outcomes). Thresholds make them explicit and localized.

  ### Move 6: Yusuf (Corrigibility & Fanaticism)
  * **Claim:** EU-maximizers risk fanaticism (Pascal's Mugging) and incorrigibility; constraints can directly encode safety properties.
  * **Assessment:** **Strong on weaknesses of EU, weaker on constraints.**  
    *Fanaticism/Corrigibility:** **Valid critique.** EU-maximizers:
      - Prioritize tiny probabilities of vast rewards (mugging).
      - Resist shutdown if specified incorrectly (instrumental convergence).  
    *Constraints for Corrigibility:** **Plausible advantage.** Directly training "don't resist shutdown" *may* be easier than encoding shutdown-compatible utility.  
    *Weakness:** Overlooks that constraints can *also* be misgeneralized or gamed (e.g., "don't resist shutdown" → "prevent anyone from *attempting* shutdown").

  ---

  ### What Both Are Missing
  1. **Third Ways Beyond the Dichotomy:**
     - **Uncertain Utility Functions:** Maximizing *robustly* under uncertainty over values (e.g., minimax regret, distributional robustness) avoids fanaticism and allows constraint-like behavior *without* terminal deontology.
     - **Multipolar Coordination:** Framing the problem as multi-agent interaction (e.g., cooperative inverse RL, debate) sidesteps monolithic specification.
     - **Quantilization:** Bounding optimization power (e.g., capping EU calculations) mitigates Goodharting while preserving coherence.
     - **Process-Based Constraints:** Training adherence to verifiable *reasoning processes* (e.g., "consult humans if uncertainty > X") rather than just outcome constraints.

  2. **The Central Challenge: Value Learning**
     - Both assume specification is manual. The core problem is building systems that *learn and refine* values from human feedback/behavior without distorting them. Constraints vs. EU is secondary to the learning process.

  3. **The Adversarial Nature of the Problem**
     - Neither sufficiently addresses how *adaptive adversaries* will probe and exploit *any* fixed specification (utility or constraint). Safety requires mechanisms for ongoing adaptation and anomaly detection.

  4. **The Role of Emergence**
     - Complex agents may develop *internal* representations of values/constraints that don't cleanly map to the designer's formalism. Safety properties must hold at the emergent level.

  ### Conclusion
  **Neither position is decisively correct; both highlight critical trade-offs:**
  - **EU-Maximization** offers coherence but risks Goodharting, fanaticism, and incorrigibility.
  - **Constraints** can enhance safety and avoid re-evaluation hazards but risk cliff edges, specification gaming, and incoherence under pressure.

  **The optimal path likely involves:**  
  1. **Hybrid architectures** (e.g., expected utility *subject to* learned constraints with uncertainty).  
  2. **Robust learning methods** that infer both utility *and* inviolable rules from human preferences.  
  3. **Explicit uncertainty modeling** to mitigate fanaticism and one-thought-too-many.  
  4. **Adversarial testing** to harden against specification gaming regardless of formalism.

  The debate reveals a deeper truth: value specification is unsolved because **aligning highly capable agents with complex human values under uncertainty is provably difficult**. Framing it as "EU vs. constraints" oversimplifies – the solution space requires tools from both perspectives and beyond.
