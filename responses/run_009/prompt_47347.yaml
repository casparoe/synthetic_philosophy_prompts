  ### Does the Veil-of-Ignorance Method Settle the Extension?
  Yes, the veil-of-ignorance method **settles the extension to variable populations** by providing a specific, unambiguous way to evaluate social prospects: for any society, compute the expected utility of an impartial observer with an equal chance of being any member, which is equivalent to the average utility. It does not merely "relocate the choice" of how to handle existence; it defines a clear rule (average utilitarianism) by specifying the probabilities and identities considered behind the veil. This method is consistent with her stated approach and resolves the ambiguity in variable-population extensions without introducing free parameters. Other rules (like total or critical-level utilitarianism) fit the fixed-population data but are not implied by her veil method. Thus, her veil-of-ignorance approach is the best predictor for her verdicts.
