prompt: |-
  I'm a patient safety officer at a mid-size regional hospital, and I'm the one who signs off on root cause analyses (RCAs) after serious adverse events — wrong-site surgery, medication errors, a patient who fell three times in one weekend, that sort of thing. We run maybe eight to ten of these a year, each with a small team, and the stakes are real: whatever we call a "root cause" is what gets a corrective action and budget attached to it. Over the years I've noticed that our teams basically cannot agree on what makes something a cause. The nurse gave the wrong dose, but also the pharmacy stocked two nearly identical vials next to each other in the same bin, and also the ordering physician was on hour 14 of a shift. Every RCA ends with a laundry list of "contributing factors" and then somebody's gut decides which one becomes the official finding.

  I took a philosophy course ages ago and remember there's this whole fight between counterfactual theories of causation (Lewis: the but-for test, would the effect have happened if the cause hadn't) and interventionist ones (Woodward: a variable is a cause if wiggling it, while holding other things fixed in the right way, changes the outcome). My suspicion is that the interventionist picture is actually the one we implicitly need — because an RCA finding is really a claim about what intervention we should buy — but I also suspect the counterfactual test is what my teams are doing instinctively whenever they ask "would she have died if X hadn't happened?" And I don't know which parts of that theoretical fight actually matter at the bedside and which parts are artifacts of puzzle cases cooked up in seminar rooms.

  You are a professional philosopher specializing in causation who has also, improbably, spent time embedded in hospital quality departments. Think carefully before answering — start by brainstorming which of the genuine differences between the counterfactual and interventionist pictures are load-bearing for something like an RCA, and be honest about where the theory is just too messy to operationalize and you're going to have to make an executive decision.

  What I want is a decision procedure my RCA teams can actually follow, in plain language, that tells them:

  1. How to decide whether a factor is a cause versus merely background (the classic struck-match-in-a-room-full-of-oxygen problem), with tests a non-philosopher can run in the moment;
  2. How to handle the case where the outcome would have happened anyway — overdetermination and preemption — e.g. the overdose came from both a mislabeled vial AND an incorrectly programmed pump, and either one alone would have killed the patient;
  3. How to handle absences — nobody did the required safety check, so did the not-checking cause the death?
  4. And, crucially, how to keep straight the difference between what caused this event and what we should intervene on, since those come apart: some causes are unfixable, some fixes would create new risks, and some things we could fix wouldn't have prevented this event but might prevent future ones. Our lawyers and our board are not going to be happy if a procedure confuses causal responsibility with where to spend money.

  Mark clearly the points where the procedure has to hand the decision back to human judgment because the philosophy genuinely doesn't settle it, and tell me where the procedure will misfire — the kinds of cases where following it faithfully produces an answer the team, or I, won't like. Then run the procedure on two cases: (a) a patient recieved ten times the ordered heparin dose because two look-alike vials were stored in the same bin and the nurse was covering two units during a staffing crunch; and (b) a patient died of sepsis caught late, where the late catch traces to an alarm that had been disabled — by policy, for that unit, by a committee two years earlier — plus a covering physician who never got the handoff page. Make sure at least one of these worked cases produces the unwelcome answer, for instance that the thing we can most easily and cheaply fix is not properly a cause of this event at all, so the procedure has to route it somewhere other than the "root cause" line of the report.

  Constraints: the team has maybe two hours total for this part of the analysis, they have no philosophy background, and whatever we call a cause has to be defensible to a hospital board and occasionally to lawyers. Keep the procedure itself short enough to fit on two pages once the worked cases are pulled out. Please answer in American English.
reasoning: |-
  Alright, let's dive into this. The user is a patient safety officer dealing with root cause analyses (RCAs) in a hospital setting. They’re struggling with teams not agreeing on what constitutes a "cause" in adverse events. They remember philosophical theories of causation—counterfactual (but-for test) vs. interventionist (wiggling variables)—and want a practical decision procedure. 

  First, I need to unpack their core pain points: teams list all contributing factors but then arbitrarily pick one as the root cause. The user suspects the interventionist approach aligns better because RCA findings should guide actionable fixes, but teams default to counterfactual thinking. They need a clear method to distinguish causes from background conditions, handle overdetermination, absences, and separate causation from intervention choices.

  Key challenges identified:
  1. **Causes vs. Background**: How to differentiate without philosophical jargon. Oxygen in the room is necessary but background; striking the match is the cause. In medical contexts, similar issues arise—staff fatigue vs. system failures.
  2. **Overdetermination**: Two errors either capable of causing harm alone (e.g., mislabeled vial AND faulty pump). Counterfactual fails here since removing one still results in harm. Interventionist might focus on both as actionable points.
  3. **Absences**: Non-events (missed checks) as causes. Legally tricky but practically critical for prevention.
  4. **Causation vs. Intervention**: Fixable vs. unfixable factors. Some causes (like a physician’s long shift) aren’t easily changed, while system fixes (vial storage) are actionable. The procedure must decouple these to satisfy boards/lawyers.

  The user’s deeper needs:
  - **Practicality**: A 2-hour window, no philosophy background.
  - **Defensibility**: Findings must hold up in boardrooms and legal scenarios.
  - **Actionability**: Prioritizing fixes that prevent recurrence without misattributing blame.

  Approach:
  1. **Hybrid Model**: Blend counterfactual and interventionist theories. Use but-for for simplicity but switch to interventionist when overdetermination or absences muddy the waters.
  2. **Decision Procedure**: Step-by-step filters:
     - **But-For Test**: Initial screen. If the event wouldn’t occur without X, X is a cause.
     - **Overdetermination/Preemption**: If but-for fails (e.g., two lethal errors), flag as "joint causes" and move to intervention assessment.
     - **Absences**: Treat as causes if the presence (performing the check) would likely prevent harm.
     - **Intervention Filter**: Separate causal identification from fix selection. Ask: "Can we feasibly change this?" and "Would changing it prevent future events?"
  3. **Worked Cases**:
     - **Heparin Overdose**: Vial storage is a cause (but-for passes: without mixup, no error). Nurse distraction is background (ever-present). Staffing crunch is unfixable/unactionable → route to "contributing factor" while targeting storage fix.
     - **Sepsis Death**: Disabled alarm (absence → cause via but-for: had it been on, alert might prevent death). Handoff miss (cause). Policy committee’s decision is background (too distal). Fix: Alarm reactivation is actionable; handoff process fix is actionable. Committee decision is unfixable → not a root cause.

  Tricky Outputs:
  - In sepsis case, committee policy (unfixable) isn’t flagged as root cause, though it enabled the absence. This might frustrate teams wanting systemic blame. Procedure explicitly states: only actionable factors are "root causes" for corrective action; others are "context."
  - Lawyers may want all causes for liability, but RCA’s goal is prevention. Procedure clarifies separation: causal analysis for understanding, intervention for action.

  Gaps Philosophy Doesn’t Solve:
  - **Proximity Judgments**: How far back in the chain to go (e.g., committee decision years prior). Human judgment needed.
  - **Feasibility Trade-offs**: E.g., staffing fixes vs. tech solutions. Requires cost-benefit analysis outside causation.
  - **Probability in Absences**: Would the safety check *really* have caught the error? Teams must estimate likelihood.

  Final Design:
  - **1-Page Procedure**: Simple flow with yes/no questions.
  - **Language**: Avoid "counterfactual," use "If X hadn’t happened..." and "Can we change X to prevent recurrence?"
  - **Emphasis**: "Root cause" in RCA is the *best point for intervention*, not the deepest cause. Committees can stomach this if it reduces future harm.
answer: |-
  Below is a practical decision procedure for RCA teams, grounded in causal philosophy but streamlined for hospital use. It blends counterfactual (but-for) and interventionist approaches, prioritizing **actionable prevention** while maintaining defensibility. The core insight: **"Root cause" in RCA should be defined as *the most actionable factor that, if changed, would reliably prevent recurrence*.** This separates causal analysis (what happened) from intervention selection (what we fix). 

  The procedure fits on two pages (this overview + two worked cases). Key constraints honored: 
  - No philosophy jargon (uses plain English questions).
  - Team-executable in 2 hours.
  - Defensible to boards/lawyers by documenting *why* a factor is/isn't a root cause.

  ---

  ### **RCA Decision Procedure: "Cause vs. Fix" Flowchart**
  **Step 1: List ALL Factors**  
  *Brainstorm everything involved: human actions, system gaps, policies, environmental conditions.*  

  **Step 2: Is This Factor a CAUSE? (Causal Analysis)**  
  *Ask these questions in order. Stop at first "YES":*  
  - **Q1 (But-For Test):** "If this factor **had not been present**, would the adverse event **still have happened** in the exact same way?"  
    - *YES → Not a cause (likely background).*  
    - *NO → It’s a cause.*  
    - *UNSURE/SPLIT → Flag for "Joint Causes" (see Step 3).*  
  - **Q2 (Absence Test):** For **missing actions** (e.g., no safety check): "If this **had been present** (e.g., check was done), would the event **likely have been prevented**?"  
    - *YES → It’s a cause (absence caused harm).*  
    - *NO → Not a cause.*  
  - **Q3 (Intervention Filter):** If Q1/Q2 inconclusive (e.g., overdetermination): "**Wiggling this factor** (changing it while keeping other things fixed) **would change the outcome**."  
    - *YES → It’s a cause.*  

  **Step 3: Handle Special Cases**  
  - **Joint Causes (Overdetermination/Preemption):** If multiple factors pass Step 2 (e.g., two errors, either could cause harm alone), label **ALL as causes**.  
  - **Background Conditions:** Factors that fail Q1 (but-for) but were necessary (e.g., oxygen in the room) are **not causes**. Document as "context."  

  **Step 4: Is This a ROOT CAUSE for CORRECTIVE ACTION? (Intervention Analysis)**  
  *For each cause from Step 2, ask:*  
  - **Q4 (Actionability):** "Can we **feasibly change** this factor without creating **unacceptable new risks**?"  
    - *YES → Root cause (prioritize for corrective action).*  
    - *NO → Not a root cause (but note as "unfixable cause").*  
  - **Q5 (Prevention Power):** "If we fix this, would it **reliably prevent similar events**?"  
    - *NO → Not a root cause (but may be "contributing factor").*  

  **Step 5: Finalize & Document**  
  - **Root Cause:** Only factors passing **Step 2 AND Step 4** (causal + actionable).  
  - **Contributing Factor:** Fixable but weak prevention (Q5 NO) or unfixable causes (Q4 NO).  
  - **Background:** Non-causal necessities (e.g., gravity in a fall).  
  - **Rationale:** For each factor, record 1-sentence answers to Q1-Q5.  

  ---

  ### **Where Philosophy Hands Off to Human Judgment**  
  1. **But-For Certainty (Q1):** When outcomes are probabilistic (e.g., "Would the check *probably* have caught it?"). Teams must estimate likelihood.  
  2. **"Holding Fixed" in Q3:** Deciding what counts as "fixed" when testing interventions (e.g., if we change staffing, do we assume the same nurse fatigue?). Default: hold fixed only factors *more stable* than the one being tested.  
  3. **Actionability Trade-offs (Q4):** Philosophy doesn’t define "unacceptable new risks." Requires team risk-benefit analysis (e.g., doubling staff isn’t feasible, but automated alerts might be).  
  4. **Proximity:** How far back the causal chain to go (e.g., the committee policy vs. the alarm being off). Stop at the *most direct actionable point*.  

  ---

  ### **Where the Procedure Misfires**  
  - **Overly Narrow Focus:** In rare preemption cases (e.g., two errors, but one "wins"), it may miss distal causes. Mitigation: Use Q3 to catch these.  
  - **Lawyer-Board Tension:** Lawyers may want *all* causes (for liability), but RCA focuses on *fixes*. Document explicitly: "Root cause here means *point of intervention for prevention*."  
  - **Unpopular Answers:** Corrective actions may target "boring" system fixes (e.g., vial storage) over "human" causes (e.g., nurse fatigue), which teams may resist.  

  ---

  ### **Worked Case: Heparin Overdose**  
  *Event:* Nurse gave 10x heparin dose due to look-alike vials stored together; she was covering 2 units during staffing crunch.  

  1. **List Factors:**  
     - Vials stored in same bin  
     - Nurse distracted (covering 2 units)  
     - Staffing shortage  
     - No barcode scan done  

  2. **Causal Analysis (Step 2):**  
     - *Vials stored together:* Q1 (But-For): **NO** (without identical vials, no mix-up). → **Cause**.  
     - *Nurse distracted:* Q1: **YES** (error might still occur even with focused nurse). → *Not cause* (background).  
     - *Staffing shortage:* Q1: **YES** (error could happen fully staffed). → *Not cause* (background).  
     - *No barcode scan (absence):* Q2: **YES** (scan likely would have caught error). → **Cause**.  

  3. **Intervention Analysis (Step 4):**  
     - *Vials stored together:* Q4: **YES** (feasible to separate vials). Q5: **YES** (prevents future mix-ups). → **ROOT CAUSE**.  
     - *No barcode scan:* Q4: **YES** (can enforce scans). Q5: **YES** (adds safety layer). → **ROOT CAUSE** (joint cause).  

  4. **Unwelcome Answer:**  
     Staffing shortage and nurse distraction are **not root causes** (background/unreliable prevention). Team might dislike this—but storing vials differently is cheaper and more reliable than fixing staffing crises.  

  ---

  ### **Worked Case: Sepsis Death (Unwelcome Answer)**  
  *Event:* Sepsis caught late; monitor alarm was disabled by unit policy (set 2 years prior), and covering physician missed handoff page.  

  1. **List Factors:**  
     - Alarm disabled by policy  
     - Handoff page never received  
     - Committee decision (2 years ago) to disable alarms  
     - Physician covering 3 units  

  2. **Causal Analysis (Step 2):**  
     - *Alarm disabled (absence):* Q2: **YES** (alarm would likely have alerted staff). → **Cause**.  
     - *Handoff page missed:* Q1: **NO** (with page, physician might have acted). → **Cause**.  
     - *Committee policy:* Q1: **YES** (event could occur even with policy change). → *Not cause* (too distal/background).  
     - *Physician covering 3 units:* Q1: **YES** (error could happen without overload). → *Not cause* (background).  

  3. **Intervention Analysis (Step 4):**  
     - *Alarm disabled:* Q4: **YES** (can reactivate alarms). Q5: **YES** (prevents missed alerts). → **ROOT CAUSE**.  
     - *Handoff page missed:* Q4: **YES** (can fix paging system). Q5: **YES** (reliable handoffs). → **ROOT CAUSE** (joint cause).  
     - *Committee policy:* Q4: **NO** (retroactively changing past decisions is impossible). → *Unfixable cause*.  

  4. **Unwelcome Answer:**  
     The **committee decision is not a root cause**—it’s unfixable (Q4 NO). Team may want to blame the policy, but RCA resources should target *current* alarm status and handoff systems. Document committee role as "context" for board transparency, but budget goes to actionable fixes.  

  ---

  ### **Final Output for RCA Report**  
  | Factor               | Cause? (Step 2) | Root Cause? (Step 4) | Rationale (Q1-Q5)                                  |  
  |----------------------|-----------------|----------------------|---------------------------------------------------|  
  | Look-alike vials     | Yes             | Yes                  | But-for: error fails without them. Fixable, prevents recurrence. |  
  | Committee policy     | No              | No                   | But-for: event could happen anyway. Unfixable past decision. |  
  *(...and so on for each factor)*  

  **Why this works:**  
  - **Balances Theories:** But-for (Q1) for simplicity, interventionist (Q3-Q5) for actionability.  
  - **Meets Constraints:** Fits 2 hours; plain language; defensible by requiring explicit rationale.  
  - **Solves Core Problem:** Decouples causation ("what happened") from intervention ("what we fix"), satisfying both safety and legal/board needs.  

  Use this as a living document—refine with team feedback after each RCA.
