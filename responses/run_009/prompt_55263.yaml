  ### Joint Statement: Causal Decision Theory (CDT) and Updateless Decision Theory (UDT) Collaboration on Decision Problems  

  **Signed:**  
  - *Committed Causal Decision Theorist*  
  - *Committed Updateless Decision Theorist*  

  Following a good-faith adversarial collaboration on Case 1 (Counterfactual Mugging) and Case 2 (XOR Blackmail), we issue this statement to clarify agreements, disagreements, and cruxes. Both frameworks aim to maximize expected utility but diverge in their interpretations of "rational action." Below, we articulate shared principles, residual disagreements, testable cruxes, and verbal disambiguations.  

  ---

  ### (a) Claims Both Parties Endorse  
  1. **Case 1 Payoff Structure**:  
     - The expected value of the policy "pay upon being asked" (assessed before the coin flip) is $4,950. The policy "refuse upon being asked" has an expected value of $0.  

  2. **Case 2 Payoff Structure**:  
     - Paying the blackmailer has no causal effect on whether the secret becomes public. The demand arises from a reliable predictor’s XOR condition: (condition & predicted refusal) OR (no condition & predicted payment).  

  3. **Ordinary One-Shot Decisions**:  
     - In standard decisions without predictors, precommitment, or acausal correlations, CDT and UDT converge on the same action. Both frameworks correctly handle cases where actions only affect outcomes through causal pathways (e.g., a one-off investment).  

  4. **Precommitment in Case 1**:  
     - Both parties would precommit before the coin flip to "pay if asked."  
     - **CDT Interpretation**: This shows precommitment can *causally influence* the predictor’s behavior (e.g., securing the $10,000 if heads). It does not imply that paying *at the time of asking* is rational, as the causal link to the reward is severed post-flip.  
     - **UDT Interpretation**: This shows the *optimal decision procedure* (chosen in ignorance of the coin flip) requires paying. UDT extends this to the moment of asking, treating the decision as outputting the procedure’s instruction.  

  5. **Real-World Relevance**:  
     - Case 1 resembles decisions we expect to face (e.g., building a cooperative reputation with predictable agents). Case 2 is less representative, as its XOR condition is artifactual and rarely mirrors natural correlations.  

  ---

  ### (b) Disagreements  
  Phrased such that each side accepts the wording:  

  1. **The Fundamental Question of Decision Theory**:  
     - CDT: "What should I do?" asks for the act that maximizes expected utility *given one’s current beliefs and causal structure*, ignoring evidence the act provides about uncontrollable variables.  
     - UDT: "What should I do?" asks for the output of a *decision function* chosen in ignorance of one’s situation to maximize expected utility across possible branches.  

  2. **Refusing in Case 1**:  
     - CDT: Refusing is rational *at the time of asking* because it maximizes utility given known tails (paying $100 yields no causal benefit). The $4,950 shortfall versus precommitment is a price worth paying to avoid exploitable deviations from causal norms.  
     - UDT: Refusing is a *mistake* because it violates the optimal procedure (paying) selected in the state of ignorance. Failing to "track" this procedure forfeits achievable utility.  

  3. **Asymmetry Between Cases 1 and 2**:  
     - UDT: The asymmetry (pay in Case 1, refuse in Case 2) is principled. In Case 1, correlation runs through the predictor’s *response to the decision procedure* (controllable via function choice). In Case 2, it runs through the *embarrassing condition* (uncontrollable; agents should condition on it).  
     - CDT: The asymmetry is ad hoc. Both cases involve purely evidential (non-causal) correlations between acts and past events. Refusing in both maintains a uniform policy against paying for non-causal "influence."  

  ---

  ### (c) Cruxes, Tests, and Predictions  
  Each crux includes a concrete test accepted by both parties. Predictions are recorded in advance.  

  1. **Crux: Does Rationality Require Ignorance-Perspective Optimization?**  
     - **Test Case: *The Rare Disease Dilemma***:  
       - *Setup*: A disease affects 1 in 1,000 people. A test is 99.9% accurate. You test positive. Treatment costs $1,000 but prevents death (worth $1M) if diseased. Treatment has no effect if healthy.  
       - **UDT Prediction**: Treat. The decision function "treat if positive" (chosen pre-test) maximizes expected utility.  
       - **CDT Prediction**: Do not treat. Given the test’s accuracy, P(disease|positive) ≈ 50%. Treatment’s causal effect does not justify $1,000 cost.  
       - *Handling "Terrible on its Face"*:  
         - UDT: Admits "treat" appears wasteful (99.9% of treated are healthy) but argues the procedure prevents death in 50% of disease branches.  
         - CDT: "Do not treat" avoids wasting resources on evidence-based correlations, preserving utility in the common case.  

  2. **Crux: Is CDT Vulnerable to Predictable Exploitation?**  
     - **Test Case: *The Predictable Parfit’s Hitchhiker***:  
       - *Setup*: A driver rescues you from a desert if they predict you will pay $1,000 in town. The driver is 99.9% reliable. You wake up in town.  
       - **CDT Prediction**: Refuse to pay. Paying cannot cause rescue (already done) and costs $1,000.  
       - **UDT Prediction**: Pay. The procedure "pay if rescued" (chosen pre-rescue) ensures rescue with 99.9% probability.  
       - *Handling "Terrible on its Face"*:  
         - CDT: "Refuse" appears self-defeating (fails to reward rescue) but is rational given no causal link to future rescues.  
         - UDT: "Pay" appears suboptimal in town (loses $1,000) but is required to make rescue probable ex ante.  
       - **Asymmetric Prediction**:  
         - UDT predicts CDT agents die in the desert 99.9% of the time.  
         - CDT predicts UDT agents overpay in the 0.1% error branch.  

  ---

  ### (d) Merely Verbal Disagreements  
  - **CDT View**: The term "decision function" (UDT) is a verbal repackaging of CDT’s "causal strategy." The dispute reduces to whether "act evaluation" includes hypothetical branches (UDT) or only actual causality (CDT).  
  - **UDT View**: CDT’s "causal effect" is a special case of UDT when correlations are purely causal. The dispute is verbal in that both agree on the *math* of utility maximization but define "rational action" differently.  
  - **Shared Stance**: The theories are *not* merely verbal in their prescriptions (e.g., Case 1), but the semantics of "should I do" contribute to divergence.  

  ---  
  **Final Note**: Neither party concedes their framework "gets the case wrong." CDT holds that UDT’s Case 1 recommendation is *pragmatically optimal but rationally incoherent post-flip*. UDT holds that CDT’s Case 1 refusal *undermines achievable utility by misapplying causal heuristics*. We agree that further testing on the cruxes (e.g., *Rare Disease* and *Parfit’s Hitchhiker*) may resolve the dispute.
