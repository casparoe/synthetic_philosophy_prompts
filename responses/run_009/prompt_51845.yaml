prompt: |-
  Compose a satirical job advertisement for the post of Moral Saint at a fictional organisation. The advertisement must consist of exactly five numbered essential criteria and nothing else — no introductory paragraph about the organisation, no salary details, no closing invitation to apply. Each criterion should run to a sentence or two. The humour should come from getting the philosophy right rather than from simple exaggeration: the criteria should quietly take positions in the debate over whether maximal moral goodness is desirable, so that a reader familiar with that literature can see the author understands it and finds the satire fair. Among the criteria, include ones that do the following: one that quietly excludes every distinctively non-moral excellence — wit, culinary discernment, a love of tennis or of particular persons — as incompatible with the post; one that distinguishes between candidates who are good out of love and candidates who merely do their duty, and hints at which the panel prefers; one that concedes, deadpan, that the successful applicant will be rather dull at dinner parties and that this is by design; and one that reveals, without ever stating it, that the organisation is not at all sure it wants the successful candidate to exist. Keep the register of a genuine recruitment advertisement throughout — person-specification jargon, equal-opportunities boilerplate — and remain deadpan: the position being satirised is the ideal of moral perfection itself, not morally serious people.
reasoning: |-
  Okay, the user wants me to create a satirical job advertisement for a "Moral Saint" position. This needs to be exactly five numbered criteria with no other content. The humor should come from philosophical accuracy rather than just exaggeration.

  I need to cover several specific elements in these criteria: excluding non-moral excellences, distinguishing between love-based vs duty-based morality, admitting the candidate will be dull socially, and subtly revealing the organization doubts whether such a person should exist. All while maintaining a deadpan, formal HR register.

  The philosophical underpinnings here are crucial - I'm satirizing concepts from moral philosophy like Susan Wolf's "Moral Saints" paper that questions whether maximal morality is desirable. The criteria should implicitly take positions in debates about moral demandingness, agent-centered prerogatives, and the conflict between moral perfection and human flourishing.

  For the first criterion, I'll exclude non-moral virtues by framing them as "distractions" using HR jargon about "core competencies." This tackles Wolf's point that moral saints lack room for personal excellences. 

  The second criterion will address motivation, preferring "affective alignment" (love) over "deontic compliance" (duty) - nodding to debates about moral psychology while sounding like standard person-specification language.

  Third, I'll concede the dullness factor deadpan by presenting it as a "risk mitigation" measure - acknowledging Bernard Williams' concerns about moral extremism killing personal meaning.

  Fourth should reveal organizational ambivalence through phrasing about "post-holder viability" - hinting at the paradox of wanting moral perfection while doubting its possibility or desirability.

  Finally, the fifth criterion will demand universal impartiality, rejecting special relationships - addressing the debate about whether morality requires complete self-abnegation.

  Throughout, I'll maintain robotic HR phrasing ("evidence-based assessment," "risk mitigation") to contrast with the extreme demands. The satire works by presenting philosophically rigorous positions as mundane job requirements, letting the inherent absurdity shine through without commentary.
answer: |-
  Here are the five essential criteria for the post of Moral Saint:

  1.  **Demonstrable Absence of Non-Moral Excellences:** Candidates must provide verifiable evidence that personal enthusiasms (e.g., aesthetic appreciation, athletic prowess, specialised knowledge, or deep affection for specific individuals beyond universal benevolence) have been consistently subordinated to, and never distracted from, the maximal optimisation of impartial moral good. Such excellences are incompatible with the core competencies of this role.
  2.  **Primary Motivation: Affective Alignment Over Deontic Compliance:** While dutiful adherence to moral principles is a baseline requirement, the panel will favour candidates whose primary motivation stems from a spontaneous, affectively rich love of the good itself, evidenced through behavioural consistency even in the absence of perceived obligation, rather than mere compliance with duty.
  3.  **Acknowledged Social Impact Mitigation:** Applicants must understand and accept that the rigorous application of impartial moral priority required for the role inherently necessitates significant personal sacrifice in conventional social arenas, resulting in predictable assessments of diminished conversational vivacity or relatable anecdote-sharing capacity at non-work-related gatherings; this is considered an acceptable operational characteristic and a form of risk mitigation against value drift.
  4.  **Robust Existential Sustainability Assessment:** Due to the known attrition rates associated with similar theoretical roles, candidates must undergo rigorous evaluation to demonstrate exceptional psychological resilience and long-term viability in maintaining maximal moral output without burnout or recourse to non-moral compensatory mechanisms, as organisational investment requires assurance of post-holder sustainability.
  5.  **Universal Impartiality Integration:** The successful candidate will seamlessly integrate the principle of strict impartiality, demonstrating through scenario-based testing and past conduct analysis an absolute absence of preferential treatment based on personal relationships, geographical proximity, or any other morally arbitrary factor, ensuring optimal resource allocation towards aggregate good maximisation.
