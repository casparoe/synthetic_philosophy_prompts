answer: |-
  ### Classroom Activity Design: Superrationality Dilemma  
  **Objective:** Make students experience the tension of coordinating in a volunteer's dilemma without prior theory. They should confront the conflict between individual incentives and group success.

  ---

  ### **Game Setup: "The Billion Dollar Telegram" (Classroom Edition)**
  **Premise:**  
  You are a rich eccentric (the instructor) offering a prize. Students must decide whether to "Enter" (send a telegram) or "Stay Out."  
  - **Win condition:** Exactly one student Enters → that student wins the prize.  
  - **Fail conditions:** 0 or ≥2 Enter → no one wins.  

  **Payoff Structure (Real Stakes):**  
  - **Prize:** $30 gift card **+ 1% extra credit** (if exactly one Enters).  
  - **Stay-Out Bonus:** If exactly one Enters, *all* students who Stayed Out get **0.25% extra credit**.  
    - *Why this works:*  
      - Entrants risk nothing but gain massively if alone.  
      - Stay-Outs get a small reward if the group succeeds, making failure (0 or ≥2 Entrants) costly for everyone.  
      - Stakes feel real: Extra credit is highly valued by grad students, and the $30 gift card is tangible.  

  **Rules:**  
  1. **Secret & Simultaneous:** Decisions written privately on paper slips. No communication.  
  2. **No Collusion:** Students cannot discuss decisions beforehand.  
  3. **One Shot:** Each student decides once per round.  
  4. **Reveal:** Outcomes announced publicly after decisions.  

  **Materials:**  
  - 16 paper slips (for decisions).  
  - 1 envelope (for collecting slips).  
  - Whiteboard (for tallying results).  
  - $30 gift card.  

  ---

  ### **Timeline (90 Minutes Total)**  
  | Phase | Time | Activity |  
  |-------|------|----------|  
  | **1. Introduction (5 min)** | 0-5 | - Explain rules *without theory*: "A prize is awarded only if exactly one of you Enters. If you Stay Out and we succeed, you get a small bonus."<br>- Emphasize: "Decide based on what you think others will do." |  
  | **2. Decision & Collection (10 min)** | 5-15 | - Hand out slips. Students write **"Enter"** or **"Stay Out"** + name.<br>- Collect slips in envelope. |  
  | **3. Round 1 Reveal (10 min)** | 15-25 | - Tally Entrants on whiteboard.<br>- **If exactly one Enter:** Announce winner, award $30 + 1% EC; give Stay-Outs 0.25% EC.<br>- **Otherwise:** Announce failure, no rewards. |  
  | **4. Initial Reactions (15 min)** | 25-40 | - **Guided discussion:**<br>  - "Why did you Enter/Stay Out?"<br>  - "What did you expect others to do?"<br>  - "How did it feel when the outcome was revealed?" |  
  | **5. Theory Debrief (25 min)** | 40-65 | - **Map outcomes to concepts:**<br>  - *Game Theory (Nash):* Pure equilibria require exactly one Entrant, but no coordination. Mixed equilibrium: Each Enters with probability 1/16.<br>  - *Superrationality (Hofstadter):* Identical reasoners assume others think alike → all choose same action. Optimal: Randomize entry with p=1/16.<br>- **Key contrast:** Same probability (1/16), but Nash assumes independent randomness, while superrationality assumes shared reasoning. |  
  | **6. Round 2 (Optional) (15 min)** | 65-80 | - Re-run game with same rules.<br>- Compare results: "Did knowing the theory change your strategy?"<br>- *Why include:* Tests if students apply randomization or coordination. |  
  | **7. Wrap-up (10 min)** | 80-90 | - Relate to research: "This is why collaborations, peer review, and funding bids fail without coordination."<br>- Mention Hofstadter’s luring lottery. |  

  ---

  ### **The "Clone" Twist: Should You Include It?**  
  **Yes, but with tweaks.** It highlights superrationality by forcing identical reasoning.  
  - **How to run:**  
    - **Before class:** Slip 4 students a note (others unaware).  
    - **Note text:**  
      > *"You and 3 others are ‘clones’: You have identical training, notes, and instructions. You know the other 3 received this note, and they know you know. Whatever you decide, they will decide the same. Keep this secret."*  
    - **When:** Hand notes as students enter the room.  
  - **Why it works:**  
    - Clones realize they *must* all Enter or all Stay Out.  
    - If all Enter → guaranteed failure (4 Entrants).  
    - If all Stay Out → they rely on non-clones to produce one Entrant.  
    - **Debrief insight:** Clones default to Staying Out, illustrating Hofstadter’s point: Identical reasoners avoid actions that guarantee failure.  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Collusion:**  
     - *Risk:* Students whisper pre-decision.  
     - *Fix:* Seat them apart. State: "Talking voids your reward." Start immediately after rules.  

  2. **Joker Entry:**  
     - *Risk:* A student Enters "for fun" to spoil the prize.  
     - *Fix:* Frame stakes seriously: "Your extra credit depends on thoughtful decisions."  

  3. **Hofstadter Expert:**  
     - *Risk:* One student knows the concept and stays out.  
     - *Fix:* Use it! In debrief, ask: "Did prior knowledge help? Could you ‘outthink’ the group?"  

  4. **Anxiety/Confusion:**  
     - *Risk:* Students freeze or misunderstand.  
     - *Fix:* Use simple slips (clearly labeled "Enter"/"Stay Out"). Walk around during decision time.  

  ---

  ### **What the Activity Can’t Replicate (and How to Compensate)**  
  | Gap | Classroom Limitation | Compensate in Debrief |  
  |------|----------------------|------------------------|  
  | **Anonymity** | Students know each other → altruism/grudges affect decisions. | Discuss: "How would strangers vs. peers change your choice? Real-world stakes (e.g., grants) involve anonymity." |  
  | **Stakes Scale** | $30/EC ≠ life-changing money. | Use Hofstadter’s story: "With $1B, failure is catastrophic. Here, we simulate the *logic* of escalation." |  
  | **Repeated Interactions** | Students will collaborate later → fear of "looking greedy." | Highlight: "Research shows repeated interactions *reduce* volunteering—people avoid grudges." |  

  ---

  ### **Why No Second Round?**  
  - **Optional but recommended:** Run Round 2 *after* the debrief.  
    - **Pros:** Students test superrationality (e.g., randomizing via dice). Reveals if theory changes behavior.  
    - **Cons:** If Round 1 had a winner, Round 2 may have copycats; if failure, students may overcorrect.  
    - **Solution:** Run it but contrast outcomes: "Did knowing the dilemma make coordination easier or harder?"  

  ---

  ### **Final Tips**  
  - **No pre-lecture:** Let the dilemma unfold organically.  
  - **Clones?** Include them—it’s low-effort and profound.  
  - **Panic remedy:** Rehearse tallying/revealing outcomes. Have extra slips ready.  
  - **Debrief anchor:** Contrast "Nash vs. Hofstadter" on the board. Emphasize: "Same math, different assumptions about *how* we think."  

  This design forces students to face the paradox head-on. They’ll leave remembering the tension—not just the theory. Good luck!
