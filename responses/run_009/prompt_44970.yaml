  First, I need to recall the core of Molyneux's problem: can a newly sighted person recognize shapes across modalities without prior visual experience? The historical responses are key here—Leibniz's rationalist yes versus Berkeley's empiricist no. The Prakash study seems to support Berkeley initially (chance performance post-surgery) but complicates things with rapid improvement.

