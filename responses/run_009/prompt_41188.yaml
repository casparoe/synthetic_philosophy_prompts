prompt: |-
  I chair the pharmacy and therapeutics committee at a mid-sized regional hospital. We make sequential formulary decisions — adding, restricting, switching preferred agents within a class — monthly, in ninety-minute meetings, with no member trained in decision theory. I've come to suspect we can be led around in circles: last year we switched our preferred proton-pump inhibitor twice and ended up back where we started, minus the switching costs in retraining, protocol revisions, and a quarter of therapeutic confusion. A colleague who reads decision theory says we are money-pumpable and that the irrationality lives in the sequence of decisions, not in any single meeting, and he muttered something about whether rationality should guard individual choices or whole plans. I don't want the theory; I want a procedure the committee can actually run. Please write it: how we should log each decision and its stated reasons so that cycles surface on their own, tests to distinguish a genuine change in evidence or values from mere intransitive drift or status-quo bias, where the procedure should block a motion with 'we already answered this, and here is what it would take to reopen it,' and where it must hand the question back to the committee because it is a value judgment no procedure can settle. Say plainly which of your tests are just judgment dressed up as a rule, and say whether your procedure treats each meeting's choice as free-standing or binds us to plans, and why you chose that. Then run it on two cases: a manufacturer pushing us to switch to their agent on essentially the same cost-effectiveness trade we declined six months ago, and a real reopening problem — new comparative safety data favoring a drug we removed two years ago in a cost-driven switch, where reopening means admitting the earlier switch was a mistake that cost the hospital money. I want to see what the procedure does when the honest answer is to reopen a settled question against our face. Begin your response with the procedure itself, with no preamble and no restatement of this request.
reasoning: |-
  We are designing a procedure for the Pharmacy and Therapeutics (P&T) Committee to avoid decision cycles and ensure that decisions are made in a rational, consistent, and evidence-based manner. The procedure will focus on logging decisions and their reasons, and providing rules for when to reopen a previous decision.

  **Procedure: Logging and Reopening Decisions**

  1. **Decision Log Structure:**
     - For every formulary decision (adding, restricting, switching preferred agents), create a log entry that includes:
       - The date of the decision.
       - The specific motion and the class of drug.
       - The outcome (approved, denied, or modified).
       - The primary reasons for the decision, categorized as:
         - Clinical evidence (e.g., efficacy, safety, new studies).
         - Economic evidence (e.g., cost, cost-effectiveness).
         - Operational considerations (e.g., supply chain, storage, administration).
         - Value judgments (e.g., committee's weighing of risks vs. benefits, cost vs. outcomes).
       - The key evidence cited (with references or sources).
       - The vote tally (if taken) and any significant dissenting opinions.

  2. **Reopening Criteria:**
     - A motion to reconsider a previous decision may be placed on the agenda only if at least one of the following conditions is met:
       - **New Evidence Condition:** There is new, substantial evidence (clinical, economic, or operational) that was not available at the time of the previous decision and that directly addresses the key reasons for the prior decision.
       - **Changed Context Condition:** There is a significant change in the hospital's operational context (e.g., change in drug pricing, formulary structure, or hospital guidelines) that alters the basis of the prior decision.
       - **Error Condition:** There is clear evidence that the prior decision was based on a material error (e.g., miscalculation, misrepresentation of data) that, if corrected, would have led to a different outcome.
     - If none of these conditions are met, the committee chair must rule the motion out of order, stating: "We have already addressed this matter. To reopen, the motion must demonstrate new evidence, changed context, or a material error. The log from [date of prior decision] shows our reasons: [brief summary]."

  3. **Blocking Motions That Are Mere Repeats:**
     - Before any motion is put to a vote, the chair (or a designated log-reviewer) must check the decision log for any prior decisions on the same drug or class. If a prior decision exists, the chair will require the mover to state, in writing, how the motion meets one of the reopening criteria (above). If it does not, the motion is blocked.

  4. **Handling Value Judgments:**
     - If the primary point of contention is a value judgment (e.g., how much weight to give to cost vs. a marginal clinical benefit) that has not changed, the committee must not reopen the decision solely because of a shift in committee membership or personal opinions. The procedure does not bind the committee to never change its values, but it requires that such a change be explicitly acknowledged and justified as a shift in the hospital's values or priorities. In such cases:
       - The chair must ask: "Is the committee now adopting a different set of values or priorities than at the time of the prior decision? If so, state the new values and why they have changed."
       - Without a documented change in values (e.g., a new hospital policy directive) or without meeting one of the reopening criteria, the motion must be blocked.

  5. **Tests That Are Judgment Dressed as Rules:**
     - The determination of what constitutes "substantial" evidence or "significant" change in context is inherently judgmental. The chair (or a subcommittee) must make this call, but they must base it on:
       - The magnitude of the new evidence (e.g., a large randomized trial vs. a small observational study).
       - The relevance to the prior decision's key reasons.
       - The potential impact on patient care or hospital operations.
     - Similarly, the "Error Condition" requires judgment to decide if an error was material (i.e., it would have changed the outcome).

  6. **Free-Standing vs. Binding to Plans:**
     - The procedure treats each meeting's choices as part of a continuous plan, not as free-standing. We bind the committee to prior decisions unless there is a valid reason to reopen. This is chosen to prevent cycles and to respect the costs of switching (retraining, protocol changes, confusion). It forces the committee to explicitly confront the reasons for change and to avoid capricious reversals.

  **Case Applications:**

  **Case 1: Manufacturer pushing to switch to their agent on essentially the same cost-effectiveness trade declined six months ago.**
  - **Log Check:** The log from six months ago shows a decision to decline the switch. The reasons were based on cost-effectiveness: the new agent was not cost-effective enough to justify switching from the current preferred agent.
  - **Reopening Test:** The manufacturer is now pushing the same trade. There is no new evidence, no changed context (e.g., pricing is the same), and no error in the prior decision. The motion does not meet any reopening criterion.
  - **Procedure Outcome:** The chair blocks the motion, stating: "We addressed this six months ago. Our decision was based on cost-effectiveness. Unless you can show new evidence, a change in context, or an error in the prior decision, we cannot reopen."

  **Case 2: New comparative safety data favoring a drug we removed two years ago in a cost-driven switch.**
  - **Log Check:** The log from two years ago shows the drug was removed due to cost. The primary reason was economic: a cheaper alternative was available and deemed acceptable at the time, despite some safety concerns for the alternative (which were noted but outweighed by cost).
  - **Reopening Test:** New safety data has emerged showing that the alternative drug has a higher risk of a serious adverse event than previously known, and the removed drug is now shown to be safer. This is:
     - **New Evidence Condition:** The safety data was not available two years ago and directly addresses a key reason for the prior decision (the safety of the alternative). The prior decision accepted some safety risk for cost savings, but the magnitude of the risk is now greater.
     - **Error Condition?** Not applicable unless the prior decision misrepresented the safety data (which it did not; it was based on the best evidence then).
  - **Judgment Call:** The chair (or a subcommittee) must judge if the new evidence is "substantial." Given that it reveals a higher risk for the alternative, which was a key factor in the original trade-off, it is likely substantial.
  - **Procedure Outcome:** The motion to reconsider is allowed. The committee must now reevaluate the cost-safety trade-off in light of the new data. This may lead to switching back, which would imply the prior decision was a mistake in hindsight (due to new information). The procedure forces the committee to confront this and make an explicit decision, but it does not force them to switch back if the cost difference still outweighs the new safety concerns.

  **Note on Admitting Mistakes:**
  In Case 2, the procedure requires reopening because the new evidence meets the criterion. This may lead to admitting that the prior decision was a mistake in light of new information, but the procedure does not require the committee to avoid such admissions. It is better to correct a mistake than to persist due to status-quo bias. The procedure helps by making the reason for reopening explicit and evidence-based.
answer: |-
  **Procedure: Logging and Reopening Decisions**  

  ### **I. Decision Log Requirements**  
  For every formulary decision, log:  
  1. **Date, drug class, motion** (e.g., "Switch preferred PPI from drug A to drug B").  
  2. **Outcome** (approved/rejected/modified).  
  3. **Stated reasons**, categorized as:  
     - **Evidence**: New clinical/efficacy data, safety signals, cost-effectiveness analyses.  
     - **Values**: Trade-offs accepted (e.g., "Cost savings justify marginal efficacy loss").  
     - **Context**: External factors (e.g., "Shortage of drug X", "New hospital budget policy").  
  4. **Key evidence sources** (e.g., "Study Z, published 2023").  
  5. **Vote tally** (if recorded) and notable dissents.  

  ---  

  ### **II. Tests for Reopening a Decision**  
  A prior decision may be reopened **only if** one of these is met:  
  1. **New Evidence Test**:  
     - *Rule*: Evidence must be **new** (published after last decision) and **material** (directly contradicts prior evidence or addresses a key reason).  
     - *Judgment element*: "Materiality" requires chair/subcommittee review (e.g., a large RCT vs. a case report).  

  2. **Changed Context Test**:  
     - *Rule*: External context must change (e.g., drug price shifts >20%, new FDA warning, formulary restructuring).  
     - *Judgment element*: Threshold for "significant" change (e.g., 20% cost difference is arbitrary but enforceable).  

  3. **Error Correction Test**:  
     - *Rule*: Proof of factual error in prior decision (e.g., miscalculated savings, misquoted study).  
     - *Judgment element*: Distinguishing "error" from "new perspective" (requires evidence audit).  

  If no test is met, the chair **blocks the motion** with:  
  > *"Decision on [drug] closed on [date]. Reopening requires: [state unmet criteria]. Prior reasons: [summary]."*  

  ---  

  ### **III. Handling Value Judgments**  
  - **Block reopening** if the motion hinges on re-litigating identical value trade-offs (e.g., "We still value cost over marginal efficacy, but want a different outcome").  
  - **Hand back to committee** only if:  
    - Values have **explicitly shifted** (e.g., "Hospital policy now prioritizes safety over cost savings"), or  
    - New evidence forces a **new trade-off** (e.g., "Safety data reveals risks that alter the cost-benefit balance").  

  ---  

  ### **IV. Free-Standing vs. Binding Decisions**  
  - **Treats decisions as bound to plans**, not free-standing.  
  - **Why?** Prevents money-pump cycles by forcing consistency with past commitments unless facts/context change. Respects switching costs (training, confusion) and avoids self-contradiction.  

  ---  

  ### **V. Judgment Dressed as Rules**  
  - **New Evidence "materiality"**: Chair’s qualitative call (e.g., rejects small retrospective studies unless they fill a critical gap).  
  - **Changed Context thresholds**: Arbitrary but necessary (e.g., 20% cost change rule avoids reopening for minor fluctuations).  
  - **Value shift verification**: Requires explicit documentation (e.g., CEO memo), not just committee sentiment.  

  ---  

  ### **Case 1: Manufacturer Pushes Same Cost-Effectiveness Trade (Declined 6 Months Ago)**  
  - **Log check**: Prior decision: "Rejected switch to drug B. Reason: Insufficient cost savings (10% reduction) to offset efficacy concerns in reflux patients. Value: Efficacy > minor savings."  
  - **Reopening test**:  
    - *New evidence?* None claimed; same cost data.  
    - *Changed context?* Drug price unchanged.  
    - *Error?* None alleged.  
    - *Value shift?* No policy change.  
  - **Outcome**: **Motion blocked**. Chair:  
    > *"Decision on drug B closed 6 months ago. Reopening requires new evidence, context change, or error. Prior reasons: Efficacy valued over 10% savings."*  

  ---  

  ### **Case 2: New Safety Data Favors Drug Removed 2 Years Ago (Cost-Driven Switch)**  
  - **Background**: Switched from drug X (expensive) to Y (cheaper) 2 years ago. Log: "Chose drug Y. Reason: 40% cost savings outweighed similar safety profiles. Value: Cost >> safety (given comparable data)."  
  - **New data**: Meta-analysis shows drug Y has 2x cardiac risk vs. drug X.  
  - **Reopening test**:  
    - *New evidence?* **Yes**. Data published after prior decision; directly targets the "comparable safety" assumption.  
    - *Material?* **Yes** (large study, addresses core justification).  
    - *Changed context?* Not needed (evidence suffices).  
    - *Value shift?* Unnecessary (new evidence redefines the trade-off).  
  - **Outcome**: **Reopen for debate**.  
    - Chair: *"New material evidence re: safety of drug Y. Original decision assumed safety parity; this invalidates that. Committee must reassess cost-safety trade-off."*  
    - **Confronting the mistake**: Procedure forces acknowledgment that prior decision was rational *with past data*, but new evidence may make it a "mistake" in hindsight. Vote on reversal must weigh updated savings (if any) against new risks.  

  ---  
  **Key takeaway**: This procedure surfaces cycles by tethering decisions to documented reasons and external changes. It blocks capricious reversals but mandates reopening when facts shift, even if uncomfortable.
