answer: |-
  The persistence of hereditary monarchy within mature democracies presents a profound theoretical puzzle about political legitimacy. Below is a reconstruction of the implicit theory, a distinction between core presuppositions and compatible ideas, and an analysis of what strict popular sovereignty would require changing. This institution is not philosophically monolithic; it contains tensions that different states resolve in distinct ways.

  ### I. Reconstructing the Implicit Theory of Legitimacy
  Constitutional monarchy presupposes a **dualist theory of sovereignty**, distinguishing between:
  - **Constituent Sovereignty**: The *ultimate source* of authority (vested in "the people").
  - **Constituted Authority**: The *symbolic embodiment and continuity* of the state (vested in the Crown).

  This dualism resolves into four core presuppositions:

  1. **The State as a Trans-Temporal Corporate Person**:  
     The state is not merely an administrative apparatus but a *legal person* persisting across generations. The hereditary monarch—unchosen, unremovable, and existing before and beyond any government—represents this corporate entity. The monarch *is* the state in legal fiction, while governments are temporary agents. This explains oaths to the Crown: allegiance is to the enduring polity itself, not its transient rulers.

  2. **Legitimacy Requires Non-Instrumental Symbolic Anchoring**:  
     Effective power may be democratically distributed, but legitimacy depends on a symbolic locus *distinct from* the competitive political arena. The monarch’s neutrality, heredity, and sacral/historical aura provide an "apolitical" anchor, distancing the state’s permanence from partisan contention. This addresses Rousseau’s worry that democratic legitimacy corrodes without transcendent symbols.

  3. **Continuity as a Foundational Good**:  
     Hereditary succession embodies the polity’s unbroken existence. While "the people" are sovereign, they are a fluctuating body; the Crown is the fixed point ensuring the state’s identity across time. This contrasts with elected offices, which imply periodic revolutionary re-founding (even if procedural). The Crown represents *time* as a dimension of legitimacy.

  4. **Authority as Performance-Dependent Convention**:  
     The monarch’s legitimacy derives from rigid adherence to constitutional conventions (e.g., assenting to all parliamentary bills). Their power is not inherent but *constituted by* public acceptance of their role as a neutral symbol. Defenders admit this is "mere convention," but the convention itself is seen as legitimizing because it stabilizes the system.

  ### II. Core Presuppositions vs. Compatible Ideas
  - **Strictly Presupposed**:  
    - The state must have a *personal*, hereditary head as its corporate embodiment.  
    - Symbolic authority must be *divorced from electoral contestation* to ensure neutrality and continuity.  
    - Sovereignty requires a *dual structure*: popular will (active) + Crown (passive/continuous).  

  - **Compatible But Not Required**:  
    - Formal powers (e.g., royal assent, appointing governments). Sweden shows these are dispensable.  
    - Religious sanctity (e.g., UK’s "Defender of the Faith" vs. secular Japanese Emperor).  
    - Specific theories of democracy (e.g., Westminster majoritarianism vs. Scandinavian consensus models).  

  **Norway vs. Sweden: Same Core, Different Expressions**  
  Both presuppose the Crown’s symbolic role in embodying continuity and unity. Norway retains residual formal powers because its constitutional culture sees the monarch as a *guardian of process* (e.g., ensuring post-election stability). Sweden’s purely ceremonial monarchy reflects a stricter separation: the Crown symbolizes unity, but all active legitimacy flows *only* from elected bodies. Neither contradicts dual sovereignty; they represent different balances within the same framework. The institution *is* philosophically underdetermined—compatible with multiple democratic theories—as long as the Crown’s symbolic continuity is preserved.

  ### III. Replacing with Strict Popular Sovereignty: What Must Change?
  A purely nominal elected presidency (e.g., Germany’s *Bundespräsident*) could replicate ceremonial functions but would dismantle the implicit theory in three key ways:

  1. **The Oath of Allegiance**:  
     Swearing loyalty to "the Crown" affirms allegiance to the *transcendent state*. Swearing to an elected president—even ceremonially—reduces loyalty to the *current constitutional order*, implying the state is contingent and revisable. Heredity’s "naturalness" masks the state’s constructedness; election exposes it.

  2. **The Hereditary Claim to Continuity**:  
     An elected president cannot embody *pre-political continuity*. Their term limits and electoral origin tie the state’s identity to the present popular will. The Crown’s heredity suggests the state predates and outlives democracy itself—a claim incompatible with strict popular sovereignty, which sees legitimacy as perpetually reauthorized by the living people.

  3. **The Conflation of Person and Institution**:  
     The monarch’s physical body *is* the Crown’s mystical body (e.g., "The King is dead, long live the King!"). An elected president is a temporary occupant of an office. Heredity allows the *person* to symbolize the *eternal institution*; election separates the role from the holder, undermining the corporate-person fiction.

  **What Survives?**  
  Ceremonial functions (opening parliament, signing bills) could transfer to a presidency. But the *symbolic capital* of heredity—its illusion of natural authority, its dissociation from politics, its representation of time—cannot be replicated. Strict popular sovereignty requires:
  - Oaths to "the constitution" or "the people," rejecting allegiance to a personified state.
  - Abandoning the idea that legitimacy flows partly from historical continuity embodied in a bloodline.
  - Accepting that all authority, including symbolic, derives from present collective will.

  ---

  ### Conclusion: The Monarch's Paradox
  Constitutional monarchy presupposes that democratic legitimacy is incomplete without a pre-democratic symbol. It relies on a **productive fiction**: the Crown is both sovereign (as the state’s personification) and subordinate (as a conventional tool of democracy). This fiction collapses if interrogated too rigorously—hence defenders retreat to "convention." Yet the institution persists because it resolves tensions in liberal democracy: between change and continuity, popular will and state permanence, secular politics and sacred unity. To replace it with strict popular sovereignty would not just alter practices but abandon the claim that the state is an eternal entity distinct from its current citizens. The monarch is democracy’s silent partner, legitimizing the present by invoking the past.
