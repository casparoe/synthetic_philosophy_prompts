prompt: |-
  World Anti-Doping Agency (WADA) rules create a category called the therapeutic use exemption: an athlete with a properly documented medical condition — asthma, say, or ADHD — may use a substance that is on the banned list, provided a panel is satisfied that the treatment returns the athlete to normal health rather than conferring an edge. So a cyclist with diagnosed asthma may inhale salbutamol at permitted doses, while her healthy teammate taking the same puffs purely to open her airways further is guilty of doping. Meanwhile, the same code allows athletes to enhance themselves in all sorts of other ways without a whisper of disapproval: altitude training, hypoxic sleeping tents, altitude-simulation chambers, advanced nutrition, laser eye surgery, and — for a period — even caffeine. I am puzzled by what exactly the exemption system thinks it is tracking.

  What account of the therapy/enhancement distinction, if any, does the therapeutic use exemption presuppose? Reconstruct the implicit theory — is it a baseline view on which treatment restores some normal species-functioning level while enhancement pushes beyond it, or a fairness view on which the exemption merely removes an obstacle the athlete would not otherwise face, or something else entirely? Then tell me whether the practice strictly presupposes that theory or merely sits comfortably with several: could a purely fairness-based account, which says nothing about therapy and health at all, licence exactly the same exemption? Consider also the wrinkle that the surrounding code is officially relaxed about unequal natural endowments — no one bans a swimmer's wingspan or a distance runner's unusually efficient heart — so if the exemption presupposes that an athlete's own untreated body is the relevant baseline, does that presupposition conflict with the code's tolerance of natural inequality elsewhere, or coexist with it somehow? And where is the system philosophically underdetermined — which cases would it have to be settled by a further commitment it never states (the healthy athlete whose treatment takes her above baseline, the condition that is itself common among elite athletes in that sport, the grey zone between restoring and boosting)? Conclude by saying what would actually have to change in the rules if WADA abandoned the presupposed view and adopted instead (a) a blanket health-and-safety standard permitting any substance a doctor judges safe, and (b) a strict 'own baseline' standard banning anything that raises performance above the athlete's untreated level — and say which of the resulting regimes would resemble the current one more.

  Begin your reply with your bottom-line answer in the first sentence, then give the reasoning. Write in British English. No preamble and no restatement of the question.
reasoning: |-
  Hmm, the user has posed a complex philosophical question about the therapeutic use exemption (TUE) system in anti-doping regulations. They want me to analyse the implicit theory behind distinguishing therapy from enhancement, explore contradictions with natural inequality tolerance, identify ambiguities, and compare alternative frameworks. This requires unpacking several layers: conceptual foundations, internal coherence, practical implications, and reform scenarios.

  First, I need to reconstruct WADA's implicit theory. The exemption system clearly presupposes a baseline view where therapy restores normal species-functioning while enhancement pushes beyond it. This explains why asthmatic cyclists can use salbutamol to breathe normally while healthy teammates cannot use it for extra advantage. The language about "returning to normal health" in the rules directly supports this interpretation. 

  But the user raises a clever point about fairness: could a pure fairness view (merely removing obstacles) justify the same exemptions? While superficially plausible, this doesn't hold because fairness alone would permit enhancements too if equally accessible. WADA's actual practice bans enhancements even when available to all athletes, proving the baseline view is fundamental. 

  Now the tension with natural endowments: if untreated bodies are the baseline, why tolerate genetic advantages? The system implicitly coexists through compartmentalisation - biological luck is seen as "given" while medical interventions are controllable. It's philosophically messy but practically functional. 

  The underdetermined cases reveal cracks in the theory: 
  - Healthy athletes using treatments to exceed baseline (e.g., ADHD meds for neurotypicals) would require arbitrary lines between "restored" and "enhanced" states.
  - Conditions common in certain sports (like exercise-induced asthma in cycling) blur medical need and performance adaptation.
  - Grey-zone therapies (say, testosterone for clinically low but "normal" levels) expose the fiction of a universal species baseline.

  For the reform scenarios: 
  (a) A health-and-safety standard would collapse the therapy/enhancement distinction, permitting any safe drug under medical supervision. This destroys WADA's current logic but resembles unregulated sports. 
  (b) A strict "own baseline" standard would ban even therapeutic interventions if they improve performance - absurdly punishing athletes for treating disabilities. 

  The current system is closer to (b) in outcome but radically different in rationale. Ultimately WADA's approach is a pragmatic, flawed compromise - it leans on biomedical objectivity while quietly accepting that "normal" is a constructed category in elite sports.
answer: |-
  The therapeutic use exemption presupposes a baseline view where therapy restores normal species-typical functioning while enhancement pushes beyond it, coexisting uneasily with the code’s tolerance of natural inequality through an implicit distinction between unchosen biological endowments and deliberate medical intervention; this theory is strictly presupposed, as a pure fairness-based account could not licence the same exemptions without endorsing performance-enhancing interventions that remain banned, and the system is philosophically underdetermined in cases of supra-baseline treatment for healthy athletes, sport-common conditions like exercise-induced asthma in cycling, and ambiguous restorative/boosting therapies such as testosterone for borderline-low levels.  

  Adopting (a) a blanket health-and-safety standard would obliterate the therapy/enhancement distinction, permitting any medically supervised substance (e.g., an ADHD athlete using amphetamines for cognitive edge, or a healthy one using EPO if deemed safe), radically diverging from current rules by prioritising safety over competitive equity. Adopting (b) a strict ‘own baseline’ standard would ban restorative treatments that improve performance relative to an athlete’s impaired state (e.g., insulin for a diabetic rower), creating perverse incentives to avoid medical care and diverging significantly by penalising necessary healthcare. The current regime more closely resembles (b) in outcome—both forbid enhancements—but crucially differs in rationale, as (b) ignores normalisation and health, instead banning any upward deviation from personal baselines regardless of medical need.
