     i) In stage one, which condition of the Gibbard-Satterthwaite theorem is not satisfied? Why does the theorem then allow for a strategy-proof social choice function? 
     ii) In stage two, the domain of preferences is still restricted (since four voters have single-peaked preferences and only one does not). Does the Gibbard-Satterthwaite theorem guarantee that there must be a manipulation? Why or why not? 
     iii) Despite the domain restriction, we found a manipulation. What does this tell you about the strategy-proofness of the median rule when the domain is not single-peaked?

  d) [Defender's response and assessment] 
     A defender of the median rule might argue that non-single-peaked preferences like Fiona's are rare and can be identified in advance. They might also suggest that the rule could be patched to handle such cases. 
     i) How might the committee identify such preferences? 
     ii) Propose a patch: for example, require voters to submit full rankings and then use a different rule (like the Borda count or Copeland). Would such a rule be strategy-proof? 
     iii) Alternatively, the committee might ask Fiona to report her peak as the alternative she most prefers (which is 10) and then use the median rule. But we saw that this leads to an outcome (5) that she dislikes, and she can manipulate. Is there a way to adjust the median rule to account for non-single-peakedness without sacrificing strategy-proofness? 
