answer: |-
  Below is a two-stage thought experiment designed for your undergraduate social choice problem set. It meets all specified constraints: realistic context (university budget committee), hand-verifiable arithmetic, institutionally grounded non-single-peaked preferences, and clear connections to Gibbard-Satterthwaite. I include a step-by-step breakdown for students, followed by the "check" (theorem analysis) and defender's response.

  ---

  **Problem Set: The Median Rule and Its Fragility**  
  **Context:** The Economics Department at Greenwood University must choose next year’s budget from 10 levels (1 = lowest, 10 = highest). The committee has five members. The social choice rule is the **median rule**: each member reports their ideal budget level, and the median of the five reports is selected. Preferences are assumed to be single-peaked unless stated otherwise.

  ---

  ### Stage 1: Single-Peaked Preferences (Strategy-Proofness)  
  **Committee:**  
  - Alex (ideal = 3), Briar (ideal = 4), Carmen (ideal = 5), Dana (ideal = 6), Eli (ideal = 7).  

  All have single-peaked preferences: utility decreases as budgets move away from their ideal point.  

  **Questions:**  
  1. **Truthful reporting:** If all report truthfully, what is the budget?  
  2. **Dominant strategy:** Voter-by-voter, show that truthful reporting is dominant. For each member:  
     - Explain why misreporting their ideal cannot improve their outcome.  
     - Illustrate with one example of a misreport that leaves the budget unchanged or worsens it.  

  **Example Breakdown (for students):**  
  - **Truthful outcome:** Reports = {3, 4, 5, 6, 7}. Ordered: 3, 4, 5, 6, 7. Median = 5.  
  - **Alex (ideal=3):**  
    - Truthful outcome: 5.  
    - *Misreport to 2:* Reports = {2, 4, 5, 6, 7}. Ordered: 2, 4, 5, 6, 7. Median = 5 (unchanged; Alex gains nothing).  
    - *Misreport to 6:* Reports = {3, 4, 5, 6, 6}. Ordered: 3, 4, 5, 6, 6. Median = 5 → 6? Wait: five reports, so ordered: 3, 4, 5, 6, 6. Median = 5 (third smallest). Still unchanged.  
    - *Why dominant?* Alex’s misreport can only:  
      - Keep median at 5 (if report ≤5), or  
      - Move it to ≥6 (if report >6), which is farther from 3 (|3–6|=3 > |3–5|=2).  
  - **Briar (ideal=4):**  
    - Truthful outcome: 5.  
    - *Misreport to 3:* Reports = {3, 3, 5, 6, 7}. Ordered: 3, 3, 5, 6, 7. Median = 5 (unchanged).  
    - *Why dominant?* Misreporting leaves median at 5 if report ≤5, or moves it away to ≥5 (worse for Briar).  
  - **Carmen (ideal=5):**  
    - Truthful outcome: 5 (ideal).  
    - *Misreport to 4:* Reports = {3, 4, 4, 6, 7}. Ordered: 3, 4, 4, 6, 7. Median = 4 (worse; |5–4|=1 > 0).  
    - *Why dominant?* Any misreport moves median away from 5.  
  - **Dana (ideal=6):**  
    - Truthful outcome: 5.  
    - *Misreport to 7:* Reports = {3, 4, 5, 7, 7}. Ordered: 3, 4, 5, 7, 7. Median = 5 (unchanged).  
    - *Why dominant?* Misreporting keeps median at 5 (if report ≥5) or moves it to ≤4 (|6–4|=2 > |6–5|=1).  
  - **Eli (ideal=7):**  
    - Truthful outcome: 5.  
    - *Misreport to 6:* Reports = {3, 4, 5, 6, 6}. Ordered: 3, 4, 5, 6, 6. Median = 5 (unchanged).  
    - *Why dominant?* Keeps median at 5 (if report ≥5) or moves it to ≤4 (|7–4|=3 > |7–5|=2).  

  **Conclusion:** With single-peaked preferences, truthful reporting is dominant for all.

  ---

  ### Stage 2: Non-Single-Peaked Preferences (Manipulation)  
  **Committee change:** Eli is replaced by Fiona (new hire).  
  - Alex, Briar, Carmen, Dana retain ideals: 3, 4, 5, 6.  
  - **Fiona’s preferences:**  
    - Her lab closes if budget < 4 (levels 1–3 are worst).  
    - Budgets 4–9 fund the lab, but she believes 10 would trigger a dean-level intervention, resetting the budget and causing chaos.  
    - She also believes mid-level budgets (5–8) are inefficient, as they attract scrutiny without enabling major projects.  
    - Her ranking (best to worst): **10 > 4 > 9 > 8 > 7 > 6 > 5 > 3 > 2 > 1**.  
    - *Why not single-peaked?* On the line 1<2<...<10, consider the triple {4,5,10}: Fiona prefers 10 (high) > 4 (low) > 5 (middle). This violates single-peakedness, as her preference "dips" at 5.  

  **Questions:**  
  1. **Truthful reporting:** If Fiona reports truthfully (ideal=10), what is the budget?  
  2. **Manipulation:** Show that Fiona can profitably misreport.  
     - Provide her misreport, the new median, and explain why she gains.  
     - Use full arithmetic (true reports, reported peaks, ordered list, median).  

  **Breakdown:**  
  - **Truthful outcome:** Reports = {3 (Alex), 4 (Briar), 5 (Carmen), 6 (Dana), 10 (Fiona)}.  
    - Ordered: 3, 4, 5, 6, 10 → Median = 5.  
    - Fiona’s utility: Budget 5 is 7th in her ranking (below 10,4,9,8,7,6).  
  - **Fiona misreports to 4:**  
    - Reports = {3, 4, 5, 6, 4} → Ordered: 3, 4, 4, 5, 6 → Median = 4.  
    - Fiona’s utility: Budget 4 is 2nd in her ranking (best except 10).  
    - **Gain:** 4 ≻ 5 in her ranking, so she benefits.  

  **Conclusion:** Fiona profits by misreporting her ideal as 4.

  ---

  ### Check: Gibbard-Satterthwaite Theorem in Both Stages  
  **Theorem recap:** Any deterministic social choice function over ≥3 alternatives that is non-dictatorial, onto, and defined on the unrestricted domain of preferences must be manipulable.  

  1. **Stage 1: Why is strategy-proofness possible?**  
     - **Failed premise:** Unrestricted domain.  
     - **Explanation:** Preferences are restricted to single-peaked profiles. The median rule is strategy-proof here because the domain restriction "disables" the theorem’s guarantee of manipulability. The theorem permits strategy-proofness when domains are restricted, even if the rule is non-dictatorial and onto.  
     - **Key feature:** The single-peaked *profile shape* (not the rule itself) enables strategy-proofness. Voters’ preferences align on a linear scale, allowing the median to be robust to misreports.  

  2. **Stage 2: Why is there manipulation despite domain restrictions?**  
     - **Domain status:** Still restricted (4/5 voters single-peaked), but not unrestricted.  
     - **Theorem’s guarantee:** The theorem does *not* guarantee manipulability here because the domain is restricted. It only guarantees manipulability for rules on the *unrestricted* domain.  
     - **Manipulation source:** Fiona’s non-single-peaked preferences create a "local" unrestricted subdomain. The median rule’s strategy-proofness depends on *all* preferences being single-peaked; one violation breaks it.  
     - **Key feature:** The *profile shape* (Fiona’s cliff-and-dip preferences) enables manipulation. Her ideal point’s position relative to others allows strategic "pulling" of the median toward 4.  

  ---

  ### Defender’s Response and Assessment  
  **Defender’s arguments:**  
  1. **Rarity and identification:** Non-single-peaked voters like Fiona are rare. Committees can screen for them by:  
     - Surveying members on budget rankings before the vote.  
     - Flagging voters with thresholds/cliffs (e.g., "My lab closes if budget < X").  
  2. **Patching the rule:**  
     - **Option 1:** Require full rankings and switch to Borda or Copeland. But these are *not* strategy-proof (Gibbard-Satterthwaite applies on unrestricted domains).  
     - **Option 2:** Keep the median rule but exclude Fiona (or voters with non-single-peaked prefs). This restores strategy-proofness but sacrifices inclusivity.  
     - **Option 3:** "Repair" non-single-peaked preferences by forcing Fiona to report her top choice (10). But as shown, this invites manipulation (she can profit by reporting 4).  

  **Honest assessment:**  
  - **No robust patch:** No simple adjustment restores strategy-proofness on the enlarged domain. The median rule’s vulnerability stems from its reliance on single-peakedness; expanding the domain recreates Gibbard-Satterthwaite’s "inescapable" manipulability.  
  - **Broader lesson:** Strategy-proofness was never the median rule’s core attraction. It is desirable because:  
    - It is **simple, efficient, and Condorcet-consistent** in single-peaked domains.  
    - Strategy-proofness is a **fragile byproduct** of domain restriction, not an intrinsic property.  
  - **Practical takeaway:** Committees should verify single-peakedness ex-ante. If non-single-peaked preferences are detected (e.g., via thresholds/cliffs), they should:  
    - Use a different rule (accepting manipulability), or  
    - Restructure the agenda (e.g., sequential voting) to mitigate incentives.  

  ---

  **Why this satisfies your constraints:**  
  - **Realism:** Budget committees, lab thresholds, and dean interventions are relatable. No abstract labels.  
  - **Hand-verifiable:** Medians require sorting 5 numbers (takes <30 seconds).  
  - **No perversity:** Fiona’s preferences arise from institutional stakes (funding cliff, reset risk).  
  - **Arithmetic-driven:** Dominance and manipulation follow from reported peaks and medians.  
  - **Theorem clarity:** Explicitly links stages to domain restrictions and profile shapes.  

