answer: |-
  Your question hits on a profound and still-evolving debate in formal epistemology—**how to update beliefs when evidence itself is uncertain**. You're right that introductory treatments of Bayes' theorem often assume evidence is learned with certainty (conditioning on a proposition \(E\) with \(P(E) = 1\)), but real-world evidence is rarely so crisp. Here's how the field approaches your concerns:

  ---

  ### **1. The Core Issue: Uncertain Evidence**
  When you're 70% confident the bird feeder fell (proposition \(F\)) but didn't observe it directly, **standard conditioning fails**. Bayes' theorem requires conditioning on an event known with certainty (e.g., "I heard a scraping sound," \(S\)). But if you doubt even \(S\) (e.g., "Was that a scrape or the wind?"), we need new tools.

  ---

  ### **2. Established Solutions & Their Limits**
  Three main approaches exist, each handling your "70% confidence" differently:

  #### **A. Jeffrey Conditionalization (a.k.a. Probability Kinematics)**
  - **What it does**: Updates beliefs when you directly assign a *new probability* to a proposition (e.g., \(P_\text{new}(F) = 0.7\)) without being certain of any evidence.
  - **Rule**:  
    \[
    P_\text{new}(H) = P_\text{old}(H | F) \cdot P_\text{new}(F) + P_\text{old}(H | \neg F) \cdot P_\text{new}(\neg F)
    \]
    where \(H\) is any hypothesis (e.g., "a raccoon did it").
  - **Assumptions**:  
    - Your *conditional beliefs* (e.g., \(P(H|F)\) and \(P(H|\neg F)\)) remain unchanged.  
    - Only your belief in \(F\) shifts.
  - **Breaks down in your cases**:  
    - **Thump vs. Faulty Memory**: Jeffrey conditioning **cannot distinguish these**. It only cares about your final \(P_\text{new}(F) = 0.7\), not why you believe it. If \(P_\text{old}(H|F)\) is the same in both scenarios, \(P_\text{new}(H)\) will be identical—even though intuitively, the thump *should* boost \(H\) (raccoon) more than faulty memory.  
    - **Why?**: Jeffrey conditioning treats \(F\) as a "direct input," ignoring *how* you arrived at \(P_\text{new}(F)\).

  #### **B. Adams Conditioning (a.k.a. Input Conditioning)**
  - **What it does**: Conditions on the *sensory experience* or *evidence-generating process* itself. You *are* certain of an "input proposition" \(I\) (e.g., "I heard a sound at 2 AM"), but \(I\) only probabilistically implies \(F\).
  - **Rule**: Standard Bayes, but applied to \(I\):  
    \[
    P_\text{new}(H) = P_\text{old}(H | I)
    \]
  - **Distinguishes your cases**:  
    - **Thump case**: \(I =\) "I heard a distinct thump." Likelihoods like \(P(I|\text{raccoon})\) and \(P(I|\text{wind})\) are high and low, respectively. Updating on \(I\) boosts \(H\) (raccoon).  
    - **Faulty memory case**: \(I =\) "I can't recall if I righted the feeder." \(P(I|\text{raccoon}) \approx P(I|\neg\text{raccoon})\) (memory failure is independent of raccoons). Updating on \(I\) doesn't change \(P(H)\).  
  - **Advantages**:  
    - Uses standard conditioning.  
    - Explains why different routes to \(P(F) = 0.7\) affect \(H\) differently.  
  - **Challenges**:  
    - Requires specifying \(I\) and its likelihoods for all hypotheses.  
    - What if you're uncertain about \(I\) itself (e.g., "Was it a thump or not?")? This pushes you to an even "earlier" input (e.g., "I had an auditory experience at 2 AM"), risking regress.

  #### **C. Propositionalization (a.k.a. "Expand the State Space")**
  - **What it does**: Treats uncertain evidence as a *new proposition* about your beliefs.  
    - E.g., Define \(E^* =\) "I assign 70% probability to \(F\)."  
    - Then update on \(E^*\): \(P_\text{new}(H) = P_\text{old}(H | E^*)\).  
  - **Problems**:  
    - Requires pre-existing beliefs about your own belief states (incoherence risks).  
    - Still ignores *why* you believe \(E^*\)—same issue as Jeffrey.

  ---

  ### **3. Key Insights from Your Examples**
  - **"It matters how I arrived at my confidence"**: Absolutely. **Adams conditioning** captures this by tying updates to the *process* (e.g., hearing a thump). Jeffrey conditioning ignores it.  
  - **"Conditioning on sensations seems unmanageable"**: True. Adams avoids infinite regress by choosing a pragmatic "input level" (e.g., "I heard a sound" vs. "I had a raw auditory qualia").  
  - **What counts as "evidence"**:  
    - In Jeffrey: The proposition you're uncertain about (\(F\)).  
    - In Adams: The input experience (\(I\)).  
    - In propositionalization: The fact that you have a certain credence (\(E^*\)).  

  ---

  ### **4. Current Status & Contenders**
  - **Accepted solution?** No universal consensus.  
  - **Dominant approaches**:  
    - **Jeffrey conditioning** is simple and used when evidence sources are opaque (e.g., expert testimony).  
    - **Adams conditioning** is favored when evidence-generation can be modeled (e.g., scientific instruments, sensory processes).  
  - **Cutting-edge debates**:  
    - Can we formalize "evidence sources" without regress? (Some use *causal models*.)  
    - How to handle self-doubt about inputs? (Some advocate *imprecise probabilities*.)  
    - Is all updating really conditioning on *experiences*? (See *radical probabilism* by Richard Jeffrey.)  

  ---

  ### **5. Practical Guidance for Your Cases**
  - **Thump case**: Use **Adams conditioning**.  
    - Input \(I\) = "I heard a thump-like sound."  
    - Likelihoods: \(P(I|\text{raccoon})\) high, \(P(I|\text{wind})\) low.  
    - \(P(H)\) increases.  
  - **Faulty memory case**: Use **Adams conditioning**.  
    - Input \(I\) = "I don't remember righting the feeder."  
    - Likelihoods: \(P(I|\text{raccoon}) \approx P(I|\neg\text{raccoon})\).  
    - \(P(H)\) unchanged.  

  ---

  ### **Why This Isn't Just "Fuzzier Bayes"**
  Standard conditioning assumes evidence is a *proposition known with certainty*. Once evidence is gradational or uncertain, **you must decide what to condition on**:  
  - The *worldly fact* (\(F\)) via Jeffrey?  
  - The *experience* (\(I\)) via Adams?  
  - The *belief state* (\(E^*\)) via propositionalization?  

  **No approach is perfect**, but Adams best addresses your intuition that the *route* to partial beliefs matters. For deeper exploration, see:  
  - Jeffrey's *The Logic of Decision* (1983) for his conditioning.  
  - Bradley's "Radical Probabilism and Bayesian Conditioning" for Adams conditioning.  
  - Garber's "Old Evidence and Logical Omniscience" for propositionalization.  

  You've identified a genuine limitation in introductory treatments—Bayesian updating is far richer (and messier) when evidence isn't certain. The answer hinges on what you take as your "epistemic bedrock."
