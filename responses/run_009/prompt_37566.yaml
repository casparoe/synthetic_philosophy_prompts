prompt: |-
  Lately I've been noticing a certain kind of behavior and I can't figure out if there's a proper name for it. You watch an animal, or a person, or a piece of software do something that looks genuinely smart — a whole coordinated sequence of steps that fit together, as if it understood what it was doing. Then you perturb one small thing about the situation, and it turns out the whole performance was on rails: the creature (or program, or person) runs the exact same sequence anyway, even when it's now pointless or self-defeating, and shows no sign of registering that anything changed. The impressive part was real — the routine really is well-designed — but the designer isn't in the room, so to speak. It's intelligent-looking and rigid at the same time, and the rigidity is invisible until the world deviates even slightly from what the routine assumes.

  Some examples, since I'm probably not describing it well. I'm a software engineer, and our office has a little delivery robot that once made a beautifully smooth detour around a chair someone left in the corridor, and then, two minutes later, stood waiting at a door that had been propped open all morning — its routine was apparently arrive at door, wait for the door, and no amount of standing there re-triggered anything. My father-in-law's farm cat runs an elaborate begging routine at the food bowl at exactly 6pm, complete with the same three moves in the same order, even when the bowl is already full. And a friend of mine, an extremely careful cook, once added salt twice in a row because the recipe's steps assumed a pan setup she wasn't using — she executed each step perfectly and never once looked at whether the steps still made sense in her kitchen. Same shape in all three cases: looks clever, can't be bargained with, and once you see the rigidity you can't unsee it.

  So — is there an established term for this exact configuration? Multi-step, apparently purposeful behavior that runs without any monitoring of whether it's still appropriate? I don't mean a plain reflex or instinct, those are single responses to a trigger, not routines; and I don't quite mean habit either, since habits are learned, and at least the cat seems to have been born with the whole routine intact. If there is a word for it I'd love to know where it comes from, and how people who use it draw the line between the real thing and near misses (things that look rigid but turn out to be flexible once you test them properly). And if there's no established term, I'd honestly be happy with a well-made-up one, as long as you define it precisely enough that it excludes stuff that only superficially resembles this. Don't just give me a bare label — I want to know what the category includes, what it leaves out, and where the edges sit.
reasoning: |-
  Okay, the user is describing this fascinating phenomenon where an animal, person, or software performs a complex, seemingly intelligent sequence of actions, but when there's a slight change in the environment, the whole thing falls apart because the system rigidly follows the same steps regardless. They've given examples: a delivery robot that detours around a chair but then gets stuck at a propped-open door, a farm cat with an elaborate begging routine even when the bowl is full, and a cook adding salt twice because of a recipe misalignment.

  The user is a software engineer, so they're probably familiar with concepts like algorithms and rigid programming. But they're looking for a term that captures this specific behavior across different domains—biology, human psychology, and AI. They want to know if there's an established term for this "intelligent-looking but rigid" behavior.

  First, I need to figure out if there's an existing term. Words like "instinct" or "habit" come to mind, but the user already dismissed those. Instincts are usually simpler, single actions, and habits are learned, whereas the cat example seems innate. So those don't fit. 

  What about in psychology? Fixed action patterns (FAPs) in ethology might be close. FAPs are innate, sequence-based behaviors triggered by a sign stimulus. Like the cat's begging routine. But FAPs are more about animals, and the user's examples include humans and robots. So while FAPs might cover the cat, it doesn't fit the cook or the robot. 

  In robotics or AI, there's "brittle intelligence" or "brittle systems," where a system works well in expected scenarios but fails under unexpected changes. That definitely fits the robot example. But is there a unified term? Maybe not, since different fields have their own jargon. 

  The user also wants to know how to distinguish this from things that look rigid but are actually flexible. So I need to consider edge cases. For example, a behavior that seems rigid but adapts when probed further. That's where the criteria of no monitoring or re-evaluation comes in. If there's any feedback loop allowing adjustment, it's not part of this category.

  Putting it all together, there might not be a single established term. So proposing a new term like "criptomeria" with clear criteria makes sense. The key is defining it precisely: multi-step, no online monitoring, rigid execution, etc. Then providing examples and non-examples to clarify boundaries. 

  Also, the user's deeper need might be to have a precise concept for discussing this phenomenon, especially in software engineering where designing adaptive systems is crucial. They might want to avoid creating systems that exhibit such rigidity. So emphasizing the importance of feedback loops in their designs could be an unspoken need.
answer: |-
  What you're describing is a **perfectly crystallized phenomenon** that lacks a single, universally established term—but several concepts converge on it, and I'll synthesize a precise framework for you. The core is: **complex, sequentially structured behavior that executes without real-time evaluation of environmental feedback, making it appear intelligent in its intended context but brittle under perturbation.**

  Here's the breakdown with terminology, boundaries, and edge cases:

  ### 1. **Core Candidates & Their Fit:**
     - **Fixed Action Pattern (Ethology):**
       - **What it covers:** Innate, stereotyped behavioral sequences (like your cat's begging routine). Triggered by a *sign stimulus* (e.g., 6pm light), runs to completion even if irrelevant (e.g., full bowl). No monitoring.
       - **Gaps:** Applies primarily to innate animal behavior. Doesn't cover learned human routines (your cook) or programmed systems (robot).
     - **Script (Cognitive Psychology/AI):**
       - **What it covers:** Predefined sequence of actions for a known scenario (e.g., the robot's "door protocol" or the cook's recipe steps). Humans/software "follow the script" without deviation.
       - **Gaps:** Scripts imply *learning* or *design*, but may involve minor adaptability. Doesn't inherently emphasize the *brittleness*.
     - **Algorithmic Brittleness (CS/AI):**
       - **What it covers:** Systems (like your robot) that handle expected inputs perfectly but fail on edge cases due to lack of real-time state evaluation. The "intelligence" is an illusion of pre-programmed paths.
       - **Gaps:** Technical term, not used for biological/human cases.

  ### 2. **The Synthesis: "Criptomeria" (or Context-Rigid Intelligent-seeming Pattern Execution)**
  Since no term perfectly spans all domains, I propose a new label (with Greek roots):
  - **Kryptós** (κρυπτός) = "hidden, concealed"
  - **Mería** (μεριά) = "part, portion"
  **Meaning:** *The hidden rigidity within a seemingly intelligent sequence.*  
  **Defined as:** *A multi-step, coherent behavioral sequence that executes deterministically without environmental feedback once initiated, creating the illusion of contextual understanding while lacking adaptive capacity.*

  ### 3. **Boundaries: What Counts & What Doesn't**
  **Essential Criteria:**  
  ✅ **Multi-step coordination:** Not a reflex (e.g., knee jerk), but a chain of actions (cat's 3-move beg).  
  ✅ **Apparent purposefulness:** Sequence is functional *in its intended context* (detouring chairs, begging for food).  
  ✅ **Zero online monitoring:** No evaluation of environmental changes *during execution* (ignoring open door, full bowl, redundant salt).  
  ✅ **Rigid completion:** Runs identically regardless of changed conditions once triggered.  
  ✅ **Brittleness reveals illusion:** Failure under perturbation exposes the lack of real intelligence.

  **Excluded Cases (Near Misses):**  
  ❌ **Habits with feedback:** Brushing teeth while half-asleep *can* adapt if you drop the brush. Habit execution often has *some* low-level monitoring.  
  ❌ **Learned skills with flexibility:** A chess player running an opening "script" *abandons it* if the opponent deviates. Involves ongoing evaluation.  
  ❌ **Adaptive algorithms:** A robot using SLAM (real-time mapping) *re-plans* if a chair moves—it monitors.  
  ❌ **Instincts with fixed triggers but variable execution:** A spider's web-building is innate but adjusts to anchor points.  
  ❌ **Deliberate stubbornness:** Your cook *choosing* to follow a recipe rigidly isn't criptomeria—it’s conscious policy.

  ### 4. **Edge Cases & How to Judge:**
  - **"Almost" monitoring:** If the robot pauses briefly at the door but still doesn't *process* that it's open, it’s still criptomeria. Brief hesitation ≠ evaluation.  
  - **Partial sequences:** If the cat stops mid-routine when the bowl is full, it’s not criptomeria (feedback occurred). The routine must *complete* rigidly.  
  - **Human expertise:** Your cook is criptomeria *only* if they’re mechanically executing steps without assessing outcomes (e.g., tasting). Expert cooks constantly sample and adjust.  
  - **Machine Learning "Black Boxes":** An AI that *always* outputs the same sequence for similar inputs—even when nonsensical—fits if it lacks internal state-checking during execution.

  ### 5. **Why This Phenomenon Matters**
  - **In biology:** Reveals evolutionary trade-offs. Fixed sequences are efficient when environments are stable (e.g., your farm cat’s reliable 6pm routine).  
  - **In humans:** Explains "autopilot" errors in high-skill experts under stress or fatigue (e.g., surgeons following protocols despite anomalies).  
  - **In AI:** Highlights the gap between narrow task mastery and general intelligence. Brittleness is the hallmark of most current "smart" systems.  

  **In short:** You’ve identified a profound flaw in *simulated* intelligence. Whether in neurons or code, **criptomeria** occurs when a system substitutes a pre-computed "excellent sequence" for genuine situational awareness. The intelligence isn’t *in* the actor—it’s fossilized in the design.
