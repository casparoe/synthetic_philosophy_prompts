prompt: |-
  I keep issuing different verdicts on failed long-run predictions, and I want to know whether there is a principled difference between the categories I'm implicitly using or whether I am simply playing favorites with Malthus. Here are my verdicts, case by case. Malthus's claim that population, if unchecked, grows faster than subsistence, so that misery and vice would always reassert themselves: I want to say right but early, since the mechanism still runs and we have merely bought centuries with fossil energy and plant breeding. Paul Ehrlich's 1968 famine forecasts for the 1970s: flatly wrong, and I feel no temptation whatsoever to call them early, even though the mechanism is the same exponential-growth-against-finite-resources one. The Limits to Growth projections of 1972: right but early, like Malthus. Peak oil in the Hubbert tradition: wrong, and worse than wrong, because the predicted date keeps being moved forward as it passes, which strikes me as rescue rather than prediction. Y2K: right in a different way altogether, since the catastrophe did not happen precisely because it was foreseen and remediated. My tentative principle is that a failed prediction is right but early when the mechanism it invoked is still operating and only the timing was misjudged, and merely rescued when its proponents keep re-dating it as events pass it by; but this cannot be right, because the mechanism is still operating in every one of these cases, including Ehrlich's and Hubbert's, so the principle cannot explain why my verdicts on them differ from my verdict on Malthus. So please give me your best account of the distinction between right-but-early, falsified-and-rescued, and right-by-being-prevented, and whether my Malthus verdict is defensible at all or just the rescue instinct in respectable dress. Answer in exactly five numbered points, each a sentence or two, with no introduction or conclusion: (1) your principle, stated precisely enough to be applied by someone who disagrees with you; (2) which of my verdicts it overturns, and why that one rather than another; (3) the runner-up principle, and which verdicts it saves that the winner does not; (4) what your principle says about two cases I have not mentioned — a 1970s forecast of catastrophic cooling from industrial aerosols by the year 2000, and a 1990s prediction that India's growth would stall for demographic reasons; (5) the point at which your principle collapses into an unfalsifiable license to keep predicting the same thing indefinitely. Do not soften the fifth point to spare my Malthus verdict.
reasoning: |-
  Hmm, the user is grappling with how to evaluate failed long-run predictions and wants a principled distinction between "right but early," "falsified-and-rescued," and "right-by-being-prevented." They've shared their verdicts on several cases like Malthus, Ehrlich, Limits to Growth, Peak Oil, and Y2K, and feel inconsistent in how they judge them. Their tentative principle about mechanisms doesn't hold up when examined, and they're worried they're being biased toward Malthus.

  I need to provide a clear, numbered response as requested: five points without any introduction or conclusion. The user wants precision to apply even if someone disagrees, and they want me to be honest about where the principle breaks down without sparing Malthus.

  For the first point, I should establish a core principle that focuses on falsifiability. The key is whether the prediction was specific enough to be proven wrong by observable events, and whether proponents admit this falsification. If they keep moving the goalposts, it's rescued, not early. If the mechanism was real but timing was off without excuses, it might be early. If prevention worked because of foresight, that's a different category.

  For the second point, I'll apply this to overturn their verdict on Malthus. Malthus's prediction was vague and not tied to specific timelines, so it can't be "early" in a meaningful way—it's unfalsifiable and thus rescued whenever it seems relevant.

  For the third point, I'll discuss a runner-up principle based on mechanism persistence, which might save verdicts like Limits to Growth. But I'll explain why it's inferior: it doesn't account for specificity and can make predictions unfalsifiable.

  For the fourth point, I'll test the principle on new cases: a cooling prediction that was falsified by real events, and a demographic prediction for India that was wrong due to unforeseen factors like policy changes.

  For the fifth point, I'll address the collapse point honestly: the principle fails when predictions lack clear deadlines or observable thresholds, allowing endless rescues. This directly implicates Malthus, as the user requested not to soften this.

  I'll make sure the language is precise and each point is concise—just sentences or two. This should help the user see that their inconsistency comes from vagueness in the predictions rather than mechanism alone, and that their favorable view of Malthus might indeed be biased.
answer: |-
  (1) A prediction is "right but early" only if it specifies a falsifiable timeline that passed without the event occurring, yet the *unchanged mechanism* still operates toward an observable threshold; "falsified-and-rescued" if proponents repeatedly move the goalposts after falsification without acknowledging error; and "right-by-being-prevented" if the predicted harm was credibly averted solely by deliberate mitigation triggered by the warning itself.  
  (2) It overturns your "right but early" verdict on Malthus: his claim lacked any falsifiable timeline or observable threshold for "reassertion," making it perpetually rescuable rather than merely early.  
  (3) The runner-up principle (mechanism persistence alone justifies "early") saves your Limits to Growth verdict; however, it fails because it cannot distinguish between genuinely delayed events and unfalsifiable claims.  
  (4) The 1970s catastrophic cooling forecast is falsified-and-rescued (observed warming disproved it; proponents shifted to warming without conceding error); India's demographic stall prediction is falsified (growth continued, so the claimed mechanism was either incorrect or incomplete).  
  (5) The principle collapses when a prediction lacks a defined, observable endpoint, allowing indefinite rescue by claiming the mechanism persists—directly implicating Malthus as unfalsifiable.
