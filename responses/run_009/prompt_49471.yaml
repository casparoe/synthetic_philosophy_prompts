answer: |-
  ## Joint Statement on Persistence: Draft for Signatories

  **Preamble:** We, the undersigned perdurantist and endurantist, acknowledge that our long-standing debate concerns fundamental metaphysical differences in how objects persist through time. We agree that both views aim to account for the same pre-theoretical phenomena and face genuine puzzles. This statement seeks to clarify our areas of agreement, articulate our remaining disagreements precisely, identify potential cruxes, and assess the nature of the dispute. (Stage Theorist: We invite your signature on the agreed claims marked with an asterisk (*).)

  ---

  ### 1. Agreed Claims (Substantive Neutral Ground)

  1.  **Ordinary Persistence Talk is Theory-Neutral:** Ordinary language concerning persistence (e.g., "the same table exists now as existed yesterday," "I walked to the store") is compatible with, and does not uniquely determine, either perdurantism or endurantism. Both theories offer coherent interpretations of this discourse. (*Stage Theorist can sign*)
  2.  **Counting and Coincidence Constitute a Genuine Puzzle:** Cases like the Statue and the Lump of Clay (where distinct sortals seem to apply to the same spatially coincident matter at a time, e.g., "statue" and "lump") present a significant metaphysical puzzle *for both views*. Neither view has an obvious, universally accepted solution that avoids counterintuitive consequences. The dispute here is internal to each view as much as between them.
  3.  **Persistence Does Not Imply Movement Through Time:** Neither view requires that objects literally "move" or "travel" through time in the same way objects move through space. Both accounts are consistent with the static "B-theory" of time, where all times are equally real. The disagreement concerns the *structure* of persistence within this framework, not its dynamic nature. (*Stage Theorist can sign*)
  4.  **Temporal Indexing is Necessary:** Accounting for change and temporal variation (e.g., the poker's shape) requires *some* form of temporal indexing or relativization in our descriptions or metaphysics. Both views employ this, though in structurally different ways (see Disagreements). Denying the need for any temporal indexing is untenable. (*Stage Theorist can sign*)
  5.  **Identity is Strict:** Numerical identity is absolute and does not admit of degrees. An object at one time is either strictly identical to an object at another time, or it is not. Neither view endorses "relative identity" in the coincidence puzzle. (*Stage Theorist *cannot* sign - stages are distinct)*
  6.  **Spatio-Temporal Location is Fundamental:** The persistence of an object is fundamentally tied to its occupation of a region of spacetime. Both views agree that an object's existence is located within spacetime. The disagreement concerns *how* the object is located within that region - as a whole at each sub-region or as a sum of parts corresponding to sub-regions. (*Stage Theorist can sign - locating instantaneous stages)*

  ---

  ### 2. Disagreements Table

  | Disagreement Topic              | Endurantist Wording (Acceptable to Endurantist)                                                                 | Perdurantist Wording (Acceptable to Perdurantist)                                                                                                                              |
  | :------------------------------ | :-------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Temporary Intrinsics**        | An object is **wholly present** at each moment it exists and has its intrinsic properties **simpliciter**, but **only at or relative to specific times**; change involves the same whole object gaining and losing incompatible properties over time. | An object **persists by having distinct temporal parts** at different times; properties like 'being bent' or 'being straight' are **had intrinsically by those temporal parts** at the times they exist; no single temporal part has incompatible properties. |
  | **"Wholly Present" Meaning**    | For an object to be **wholly present** at a time t means that **the entire object, in its full concrete particularity, exists at and is located within the spatial region corresponding to t**; no part of the object is "missing" or located only at other times. | The phrase **"wholly present"** is either **misleading or only applicable to instantaneous temporal parts**; the persisting object *as a whole* is **spatially extended and temporally extended**, and at any instant t, **only its temporal part at t is located within the spatial region corresponding to t**. |
  | **Counting During Coincidence** | In cases of coincidence (e.g., Statue/Lump), **there is only one concrete particular present** at the location, but it **instantiates two distinct sortal properties** (e.g., being a statue, being a lump) which ground distinct persistence conditions and potential modal differences. | In cases of coincidence (e.g., Statue/Lump), **there are two distinct persisting objects** (the statue-worm and the lump-worm) **co-located** during the period of coincidence; they share the same temporal parts during that period but are different sums of temporal parts overall. |
  | **Persistence as Location**     | Persistence is **not a species of spatial extension**; it is the **continued, complete existence of the same object** at different times. An object's location at a time is its maximal spatial extent *at that time*. | Persistence **is analogous to spatial extension**; just as an object extends by having spatial parts, it **persists by having temporal parts**. An object's spacetime location is its maximal spatiotemporal extent. |

  ---

  ### 3. Cruxes and Predictions

  *   **Crux 1: Relativity of Simultaneity and "Wholly Present"**
      *   **Sub-Question:** Does the frame-relativity of simultaneity in Special Relativity fundamentally undermine the endurantist notion of an object being "wholly present" at a single, objective time? Does it require perdurantism or stage theory?
      *   **Endurantist Prediction:** Frame-relativity poses no unique problem. Just as we index shape to a time (which is frame-relative in SR), we can index "being wholly present" to a frame. The object is wholly present relative to any chosen frame's simultaneity slice. Shapes-at-frames are no more problematic than shapes-at-times in classical physics. A slowly rotating object *just has* different shapes relative to different frames, just as it has different shapes at different times relative to one frame. The account handles it cleanly by relativizing properties and presence to reference frames.
      *   **Perdurantist Prediction:** Frame-relativity reveals a deep incoherence in "wholly present at a time" because there is no privileged "time" slice. The object's shape *at a given coordinate time* in one frame is a spatial cross-section of the 4D worm; in another frame, it's a *different* spatial cross-section (a "tilted" slice through the worm). The perdurantist account handles this effortlessly: the object's shape relative to a frame *just is* the shape of its temporal part *as defined by that frame's simultaneity slice*. The rotating object case cleanly shows different spatial parts being picked out by different frames.
      *   **Progress:** Clarifying whether "being wholly present relative to a frame" retains the core metaphysical intuition endurantists intend (complete concrete existence *here-and-now* from that perspective) or whether it collapses into acknowledging temporal parts. Developing a robust endurantist semantics for frame-relative property ascription that avoids hidden temporal parts.

  ---

  ### 4. Verbal vs. Non-Verbal Disputes

  *   **Potentially Verbal Aspect:** The debate over the phrase **"wholly present"** has a significant verbal component. The endurantist uses it to mean *complete concrete existence at a spatial location at a time*. The perdurantist argues this concept is either incoherent (given temporal variation) or only applies to instantaneous entities. Much disagreement stems from different interpretations of this phrase and whether the perdurantist's "temporal part at t" satisfies it. If "wholly present" were abandoned or redefined, some heat might dissipate, though the underlying structural differences would remain. Similarly, the exact scope of the word "object" in coincidence cases involves differing linguistic preferences for counting.
  *   **Definitely Non-Verbal Aspect:** The core disagreement about the **metaphysical structure of persistence and change** is substantive and not merely verbal. It concerns the fundamental nature of what exists over time:
      *   Does the poker that is straight at t1 and bent at t2 involve **one entity** (the whole poker) gaining and losing properties over time? (Endurantism)
      *   Or does it involve **distinct temporal parts** (t1-part, t2-part), each with their own properties, composing a larger 4D entity? (Perdurantism)
      *   Or are **only instantaneous stages** real, with persistence talk being a useful fiction? (Stage Theory)

  The intensity of the debate over the fire poker stems from this deep, non-verbal disagreement about the ontology of persisting objects and the metaphysical ground of change. *How* the poker manages to have incompatible properties at different times without contradiction, and *what* it fundamentally *is* over time, is the real, substantive heart of the matter. This disagreement would persist even if we adopted entirely new terminology.
