prompt: |-
  You are a philosopher of history and a methodologist who spends more time thinking about how historians know things than about what they know. I am preparing to write a critical essay on causal explanation in history — the kind of work that explains why the Berlin Wall fell, why the First World War broke out, or why Rome's western empire collapsed — and before I evaluate any particular historian's explanations, I want the standard of evaluation itself worked out. Write me the desiderata.

  Specifically: write the list of requirements that any adequate explanation of a particular historical outcome must meet in order to count as genuinely explanatory rather than a retrospective story that merely feels right because we already know the ending. The list should include, at minimum, conditions drawn from (a) the psychology of hindsight — once people know an outcome occurred, they systematically overestimate how foreseeable it was, and an adequate historical explanation must not merely exploit that distortion; (b) the narrative fallacy — the human tendency to compress messy sequences into stories with a manageable cast, a small number of turning points, and a satisfying arc, where the story's coherence is mistaken for evidential support; and (c) the distinction between explaining and merely re-describing: an explanation that could be retold, unchanged, to "explain" the opposite outcome should be disqualified. For each desideratum, give the motivating case or consideration — a concrete historical episode or a stylized experiment makes it vivid — and say whether it is non-negotiable or instead a preference of a particular school of historiography (analytical philosophy of history, cliometrics, traditional narrative history, the Annales school), so that I can tell genuine requirements from camp prejudices.

  Two candidate desiderata I want you to weigh explicitly, and I don't know how much weight they deserve:

  1. The twin-outcome test: an explanation of why X happened earns its keep only if, had X not happened, the same explanatory apparatus would have counted against X, and its author could say in advance what evidence would have pushed them toward the non-occurrence. Consider whether any actual historical practice could pass this, or whether it is jointly unsatisfiable with the requirement that explanations be intelligible and persuasive to readers who already know the outcome — in which case the tension itself is the finding.

  2. Narrative economy: the suspicion that the demand that an explanation be a good story — sequential, focused, with a climax — is not a neutral virtue of historical writing but the very engine of hindsight bias, so that requiring perspicuity and requiring bias-resistance may pull against each other.

  Begin with a short brainstorm of candidate desiderata before committing to the final list; I want to see which ones you considered and discarded, and why. Flag any pair of desiderata you suspect cannot be jointly satisfied — that joint-unsatisfiability result is the part I most want to see. Then, briefly and only briefly, note how a covering-law account, a counterfactual account, and a plain narrative account of historical explanation fare against the list — a few lines each; the criteria are where I want the thinking, and I will do the full scorecard myself. Do not cite literature or give references; argue from the concepts and the cases directly. Think carefully and take your time — the value here is in the reasoning behind each requirement, not in the length of the list.
reasoning: |-
  Okay, the user wants to craft a critical essay on causal explanation in history. They're focusing on the standards for evaluating such explanations, not the explanations themselves. The key challenges they mentioned are hindsight bias, narrative fallacy, and the distinction between explaining vs. redescription. They also want me to weigh two specific candidate desiderata: the twin-outcome test and narrative economy.

  Hmm, the user is clearly well-versed in historiography and philosophy of history. They're asking for a framework to distinguish genuine explanations from just-so stories. The depth of their query suggests they're preparing serious academic work. I should avoid oversimplifying.

  First, I need to brainstorm potential desiderata. For hindsight immunity, we can't let historians exploit the "knew-it-all-along" effect. The Rosenhan experiment in psychology shows this perfectly - once you know the outcome, everything seems obvious. This feels non-negotiable. 

  Then there's non-narrative contingency. Historians often compress chaos into clean stories. Take the outbreak of WWI - was it really just about the assassination of Franz Ferdinand? Probably not, but the narrative makes it feel inevitable. The Annales school would push back here, but I think it's essential.

  The asymmetry requirement is crucial too. If your explanation could just as easily "explain" the opposite outcome, it's worthless. Like if someone argues Rome fell because of moral decay - but if it hadn't fallen, they'd say moral renewal saved it. That's redescription, not explanation. Non-negotiable.

  For the twin-outcome test... this is tricky. In theory it's ideal - your explanation should specify what would count as evidence against it. But in practice? Most historians don't write papers saying "Had Rome survived, here's what I'd look for." Still, it's a useful thought experiment to prevent hindsight bias. I'll mark it as a high-value aspirational goal rather than a minimum requirement.

  Narrative economy is another tough one. We want clear explanations, but the very act of storytelling creates hindsight bias. Macrohistorians like Braudel might avoid this with their long-term analyses, but traditional narrative historians can't escape it. There's inherent tension here - I'll note that as a fundamental dilemma rather than trying to resolve it.

  Now, which desiderata might conflict? Asymmetry and twin-outcome actually complement each other well. But narrative economy clashes with almost everything - the clearer the story, the more it likely distorts reality. That's a painful tradeoff historians must navigate.

  For explanatory frameworks: Covering-law models struggle with contingency. Counterfactual approaches help with asymmetry but can get speculative. Plain narratives are engaging but prone to hindsight bias. Each has strengths and weaknesses against our checklist.

  The final list should prioritize what's essential while acknowledging where ideals meet practical limits. The key is making the tensions visible - that's where the deepest historical thinking happens.
answer: |-
  Here is a distilled list of desiderata for evaluating causal explanations in history, designed to resist hindsight bias, narrative fallacy, and redescription, with explicit analysis of your candidate tests. Brainstormed candidates and conflicts are noted.

  **Brainstormed & Rejected Candidates:**
  1.  **Predictive Accuracy:** Discarded. History deals with unique, contingent events; demanding prediction misunderstands the domain. (Non-starter)
  2.  **Completeness (All Causes):** Discarded. Impossible and paralyzing; explanation requires selecting *salient* causes. (Replaced by Salience Justification).
  3.  **Moral Resonance:** Discarded. While compelling narratives often have this, it's orthogonal to explanatory power and risks teleology/bias. (Preference, often Traditional Narrative).
  4.  **Single Root Cause:** Discarded. Overly reductive; most outcomes are multi-causal. (Preference, some Marxist/Great Man histories).
  5.  **Immediate Causation Only:** Discarded. Neglects necessary background conditions and long-term processes. (Replaced by Process Specification).

  **Final Desiderata (Non-Negotiable Unless Stated):**

  1.  **Hindsight Immunity:** The explanation must not rely on or amplify the "knew-it-all-along" effect.
      *   **Motivation:** Rosenhan Experiment ("On Being Sane in Insane Places"): Knowing the outcome ("patient is schizophrenic") makes observers interpret ambiguous behaviors as confirmatory. Historians knowing the Wall fell might overvalue protest signs and undervalue stable GDR economic reports from 1988.
      *   **Status:** Non-negotiable (Core to analytical philosophy/critical methodology). Requires explicit acknowledgment of alternatives considered plausible *at the time*.

  2.  **Non-Narrative Contingency:** The explanation must incorporate the genuine openness and branching possibilities of the past *as experienced*, resisting compression into an inevitable arc.
      *   **Motivation:** July Crisis 1914: The narrative often flows smoothly from Sarajevo to war, obscuring the many points where different choices (e.g., German restraint, Russian partial mobilization, British ambiguity) could have derailed it. The explanation must show *why* specific paths closed while others opened.
      *   **Status:** Non-negotiable (Core to analytical philosophy, cliometrics, Annales processualism). Contradicts deterministic narratives (some Traditional/Marxist).

  3.  **Asymmetry:** The explanation must not be symmetrically applicable to the opposite outcome. It must specify why *this* happened *rather than* plausible alternatives.
      *   **Motivation:** "Moral Decay" explanations for Rome's Fall: If Rome fell, it's due to decadence; if it hadn't fallen, the *same* evidence could be framed as cultural vitality overcoming challenges. A valid explanation (e.g., specific military/fiscal collapse interacting with barbarian pressure) must not work symmetrically.
      *   **Status:** Non-negotiable (Widely accepted in analytical philosophy/critical methodology). Fundamental to distinguishing explanation from redescription.

  4.  **Salience Justification:** The selected causes must be justified as *differentially salient* compared to background conditions or other contributing factors, relative to the specific outcome and plausible alternatives.
      *   **Motivation:** Explaining the Wall's Fall: Why emphasize Gorbachev's policies *over* decades of East German dissent *or* the Chernobyl disaster *or* Reagan's rhetoric? The historian must argue why these factors were decisive triggers/necessary conditions vs. background/enablers, given the contingency (Desid. 2) and avoiding hindsight (Desid. 1).
      *   **Status:** Non-negotiable (Methodological requirement across most schools). Replaces the impossible "Completeness."

  5.  **Process Specification:** The explanation must detail the *causal mechanisms* linking proposed causes to the outcome, not just list factors or describe the sequence.
      *   **Motivation:** "Nationalism caused WWI." This is redescription, not explanation. How did nationalist sentiments translate into specific policy decisions (e.g., Austrian ultimatum drafting, Russian mobilization orders) amidst the July Crisis contingencies? Specify the *how*.
      *   **Status:** Non-negotiable (Core to analytical philosophy, cliometrics; increasingly expected elsewhere). Distinguishes explanation from correlation/association.

  6.  **Evidential Transparency:** The explanation must be grounded in evidence that exists *independently* of the outcome itself and be open to scrutiny regarding its interpretation.
      *   **Motivation:** Using the *outcome* (e.g., Rome's fall) to interpret ambiguous evidence (e.g., late Roman poetry) as "proof" of inevitable decline. Valid evidence (e.g., tax records, troop deployments, contemporary crisis reports) must support the causal claims *without* relying on the outcome's inevitability.
      *   **Status:** Non-negotiable (Fundamental historiography).

  **Evaluating Your Candidate Desiderata:**

  1.  **Twin-Outcome Test:**
      *   **Weight & Status:** High-value *aspirational ideal*, but **not a minimum requirement** for adequacy. It's the logical extension of Asymmetry and Hindsight Immunity.
      *   **Tension:** Directly conflicts with **Narrative Economy/Perspicuity** and the practical reality that historians write *knowing* the outcome. Requiring historians to pre-specify evidence for non-occurrence is unrealistic for complex events. However, a *strong* explanation *implicitly* suggests what might have changed the outcome (counterfactuals). *The tension is the finding:* Truly rigorous explanation requires this mindset, but its full formal expression is often incompatible with accessible narrative. (Analytical philosophy aims for it; Traditional Narrative often avoids it).

  2.  **Narrative Economy:**
      *   **Analysis:** This is **the core tension**. A "good story" (clear sequence, protagonists, turning points, climax) is the primary vehicle for **Hindsight Bias** and **Narrative Fallacy**. It inherently smooths contingency and implies inevitability.
      *   **Conflict:** Narrative Economy fundamentally conflicts with **Non-Narrative Contingency**, **Hindsight Immunity**, and potentially **Process Specification** (if mechanisms are complex). Perspicuity often demands simplification that sacrifices explanatory rigor regarding messiness and openness.
      *   **Status:** **Preference (Traditional Narrative History)** masquerading as a neutral virtue. Annales/Cliometrics often sacrifice narrative economy for analytical depth; Analytical Philosophy is deeply suspicious of it. *Resisting its seduction is crucial for bias resistance.*

  **Inherent Tensions/Joint Unsatisfiability:**
  *   **Narrative Economy vs. Non-Narrative Contingency & Hindsight Immunity:** This is the most profound conflict. A perfectly clear, compelling narrative almost inevitably distorts the past's messiness and openness. Satisfying one deeply compromises the other. Historians must navigate this tension, not resolve it.
  *   **Twin-Outcome Test vs. Practical Historiography:** Fully satisfying the Twin-Outcome Test is incompatible with writing explanations *for an audience that knows the outcome* in a way that feels relevant and persuasive to them. It demands a counterfactual mode of argument most histories avoid.

  **Brief Framework Assessment:**

  1.  **Covering-Law (Hempel):** Strong on **Process Specification** (if laws exist) and **Asymmetry** (if laws are directional). Fails **Non-Narrative Contingency** (forces events into deductive mold), **Hindsight Immunity** (laws often selected post-hoc), and **Salience Justification** (doesn't handle causal weighting well). Impractical for unique events.
  2.  **Counterfactual:** Strong on **Asymmetry**, **Non-Narrative Contingency** (explicitly explores alternatives), and **Hindsight Immunity** (if well-constructed). Can struggle with **Process Specification** (needs mechanisms, not just "if X then Y") and **Evidential Transparency** (evidence for what didn't happen is tricky). Risks speculation.
  3.  **Plain Narrative:** Excels at **Narrative Economy** and accessibility. Highly vulnerable to **Hindsight Bias**, **Narrative Fallacy**, failure of **Non-Narrative Contingency**, and **Asymmetry**/Redescription. Often weak on explicit **Process Specification** and **Salience Justification**. **Evidential Transparency** depends on embedding.

  This list provides the critical toolkit. Evaluating any specific historical explanation means asking: Does it resist the seduction of hindsight? Does it preserve the past's openness? Does it explain *this* outcome and not its opposite? Does it justify its focus and show *how* causes worked? Is its evidence sound? And crucially, how does it navigate the unavoidable tension between clear storytelling and truthful complexity?
