answer: |-
  ## Fellowship Proposal: Causation by Omission, Agency, and Normative Dependence

  Dear Fellowship Committee,

  I am writing to propose a research project for the one-year dissertation fellowship, focused on resolving a persistent metaphysical puzzle concerning causation by omission, with significant implications for the philosophy of law. My core investigation centers on whether the notorious problem of "too many omissions" – where intuitively, only a specific omission (e.g., the gardener's failure to water) seems causally relevant, yet numerous others (the neighbor's failure, the absence of rain) appear equally qualified – can be dissolved, or alternatively, deepened, by rigorously distinguishing omissions proper (involving agents and normative expectations) from mere absences (agentless non-occurrences). I suspect that existing solutions subtly rely on this distinction without adequately justifying it, and that probing its viability will reveal fundamental constraints on how we understand causal claims involving non-events.

  The central question guiding my research is: **To what extent does the resolution of the problem of too many omissions causally depend on distinguishing omissions (as agent-involving, normatively loaded non-actions) from mere absences (agentless non-occurrences), and what are the implications of this distinction (or its failure) for the metaphysics of causation and accounts of causal responsibility?** This question is tractable: it can be answered by constructing and analyzing carefully designed thought experiments and test cases that isolate the variables of agency and normativity, then systematically evaluating how major existing theories (contrastivist, quasi-causal, deflationary) handle these cases under both a unified (omissions = absences) and a split ontology (omissions ≠ absences), assessing which approach yields more coherent and less ad-hoc solutions to the standard counterexamples.

  The existing positions I outlined – contrastivism (focusing on salient alternatives), quasi-causation (deriving from genuine causes), and deflationism (invoking pragmatic salience) – leave this question crucially open. While each implicitly *gestures* towards the importance of agency or expectation (e.g., the gardener "was supposed" to water, making her omission salient), none explicitly argues *why* or *whether* this marks a *metaphysical* difference in the *causal relation itself* versus merely a difference in our *description* or *evaluation* of events. Contrastivism defines the relevant contrast class, but doesn't settle whether agency/norms *constitute* that class or merely *guide* our selection of it. Quasi-causal views posit a derivative relation, but remain silent on whether the derivation *requires* an agent or norm. Deflationism attributes the selection to salience norms, but avoids specifying whether these norms track a pre-existing ontological split or create one. Consequently, all approaches potentially *presuppose* the distinction I aim to test, rather than demonstrating its necessity or dispensability. My project seeks to fill this gap by forcing the distinction into the open and evaluating its causal work.

  My methodology will proceed dialectically over the fellowship year, structured in four interwoven phases. In the first three months, I will conduct a focused literature review, deepening my grasp of the core theories (contrastivism, quasi-causation, deflation) and their specific responses to the problem of too many omissions, while also mapping related discussions in agency theory and normativity to refine the potential omission/absence distinction. Concurrently, during months four to six, I will develop the core analytical tool: a series of meticulously constructed test cases. These cases will systematically vary the presence or absence of agency (e.g., a designated caretaker vs. a random passerby), normative expectation (e.g., a contractual duty vs. no prior relation), and the nature of the negative event (failure to perform a specific act vs. a general absence), while holding constant the physical outcome (e.g., death by dehydration). Crucially, each case will be analyzed twice: first, assuming a unified ontology where all non-occurrences are fundamentally similar ("absences"), and second, assuming a split ontology where "omissions" are a distinct metaphysical kind involving agents under potential obligations. Months seven to nine will be dedicated to rigorous dialectical testing. For each major theory, I will examine whether adopting the split ontology allows it to resolve the too-many-omissions problem more elegantly and without residual counterexamples than the unified ontology, or conversely, whether the split introduces new inconsistencies or fails to provide unique explanatory power. I will specifically assess if theories relying implicitly on the split can justify it non-circularly. Finally, in months ten to twelve, I will synthesize the findings, evaluating the overall success of the splitting strategy versus the implications if the distinction proves unstable or normatively dependent. This phase will solidify the project's core argument regarding the relationship between causation, agency, and normativity in omissions.

  Possible conclusions, adjudicated by the success of the test cases within the dialectical framework, include: (1) The splitting strategy is robust: distinguishing omissions from absences metaphysically dissolves the too-many-omissions problem for one or more theories, demonstrating that the puzzles arise from conflation. (2) The splitting strategy fails or is unstable: the distinction cannot be coherently maintained without collapsing into one of the existing approaches (e.g., just being contrastivism in disguise) or generating equally severe problems, suggesting the normative element (expectation, obligation) is ineliminable from *any* adequate causal account of omissions. (3) A hybrid result: the distinction holds for specific causal theories but not others, revealing deeper commitments within those theories. Conclusion (2) would be particularly significant, implying that claims of causation by omission inherently blend causal and normative/responsibility-tracking components in a way that resists metaphysical separation.

  An honest assessment of failure would involve two main scenarios. First, if I cannot construct non-question-begging test cases that effectively isolate agency and normativity from other causal factors, the core adjudicative mechanism would collapse. Second, if the dialectical analysis reveals that both the unified and split ontologies lead to equally problematic or equally viable outcomes across all major theories under scrutiny, the project might fail to yield a decisive answer regarding the distinction's necessity or the ineliminability of normativity, leaving the central question unresolved despite the investigation.

  Regarding the philosophy of law applications – such as liability for failures to rescue, medical negligence, or omissions in criminal law – I propose these are best framed as *significant future implications* of this project rather than primary components of the fellowship year's work. Including detailed legal analysis within this single year would risk diluting the necessary depth of the metaphysical investigation, which is foundational. The core question – whether agency and normativity are metaphysically separable from causation in omissions – must be answered *before* its consequences for legal responsibility can be fully mapped. A robust metaphysical account, developed in this project, is precisely what will provide the strongest framework for subsequent analysis of legal doctrines concerning omissions. Flagging these implications powerfully demonstrates the project's relevance and potential impact beyond metaphysics, while keeping the fellowship year focused on achieving the required metaphysical clarity. I will explicitly note these legal connections as a vital direction for future research stemming directly from this project's conclusions.

  This project promises a novel contribution by rigorously testing an implicit distinction that underpins, yet remains unexamined within, current debates on causation by omission. By clarifying the relationship between causation, agency, and normativity, it addresses a fundamental metaphysical puzzle with profound consequences for how we understand responsibility for what does *not* happen.

  Thank you for considering my application.
