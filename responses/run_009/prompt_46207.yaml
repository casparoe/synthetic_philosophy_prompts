answer: |-
  ## Sestina for a Single Cast

  A single cast: the die takes to the air,
  One polished **face** turned briefly to the light.
  No pattern known, no history to share,
  It tumbles down towards the waiting night
  Of green felt, where its final **fall** will cease,
  And one bright number grants uncertain **rest**.

  Is there a pattern etched in unseen **rest**?
  Does hidden law direct its frantic **face**
  Through empty air, ensuring it will **fall**
  Within a grid the calculating **light**
  Of reason knows? Or is the coming night
  Of outcome pure, with nothing we can **share**?

  We tally scores that others might **share**,
  Observing outcomes, seeking final **rest**
  In numbers grouped against the fading **night**.
  We count the sides, assign to every **face**
  An equal claim within the failing **light**
  Of finite trials. But when the last die **fall**s,

  The perfect run, that endless hoped-for **fall**
  Of balanced scores, remains beyond our **share**.
  We glimpse the shape within the partial **light**,
  But never reach the shore of perfect **rest**.
  The limit gleams upon each numbered **face**,
  Retreating as we peer into the **night**.

  Is meaning held within the die, the **night**
  Before the throw? Does weight ensure its **fall**?
  The maker's craft, the wrist's impulsive **share**
  Of force, the table's unforgiving **rest** –
  Do these conspire behind the turning **face**
  To fix the point before it meets the **light**?

  Or must we judge in this imperfect **light**,
  With knowledge partial as the gathering **night**?
  No run exists, no hidden law to **rest**
  Upon. The bet is called. We watch it **fall**,
  And stake our claim with nothing we can **share**
  But reasoned doubt on this one trembling **face**.

  The die now lies, one stubborn number's **face**
  Upturned. Cold certainty replaces **light**
  And guesswork. Was the **chance** we thought to **share**
  Before it fell mere shadow in the **night**?
  Or did the true **chance** only truly **fall**
  When knowledge ceased, granting the dice its **rest**?

  **World** of the throw, now stilled: what final **rest**
  Can hold the **chance** that lived before the **fall**?
  The **face** revealed ends speculation's **light**.
  Three honest shades linger within the **night**:
  The long run dreamt, the weight within the **fall**,
  The knowing **chance** no hand could ever **share**.

  ---

  **Annotations for the Instructor:**

  *   **Form:** Traditional sestina: 6 sestets, 1 envoi (3 lines), using the prescribed end-word permutation.
  *   **End-Words:** Face, Fall, Rest, Light, Share, Chance (World/Chance substitution in envoi per tradition). Each shifts meaning subtly:
      *   *Face:* Die surface, clock dial (implied), opponent's expression.
      *   *Fall:* Descent, outcome, statistical distribution.
      *   *Rest:* Stillness, reliance (on long run), repose.
      *   *Light:* Illumination, understanding, reason, dawn (vs. night).
      *   *Share:* Divide, possess in common, contribute, partake.
      *   *Chance:* Probability, opportunity, luck, fate.
      *   *World:* Context of the event, conceptual framework.
  *   **Interpretations:**
      *   **Stanzas 1 & 2:** Build the world of the "tally and the long run" (Frequentism). Stanza 2 explicitly admits the "endless hoped-for fall... remains beyond our share" and the limit "retreating as we peer into the night."
      *   **Stanzas 3 & 4:** Explore the "disposition" within the physical system (Propensity). Focuses on the die's weight ("weight ensure its fall"), the maker's craft, the thrower's wrist, and the table ("these conspire behind the turning face").
      *   **Stanzas 5 & 6:** Address the bettor's perspective with "incomplete knowledge" (Subjectivism/Bayesianism). Highlights "judge in this imperfect light," "No run exists," "stake our claim with nothing we can share but reasoned doubt."
  *   **Envoi:** Addresses the die after it rests ("The die now lies"). "Three honest shades" represent the three interpretations. The final line emphasizes the core epistemic question: "The knowing **chance** no hand could ever **share**."
  *   **Meter:** Primarily iambic pentameter, with some variations for emphasis or natural phrasing, prioritizing exactness of concept over rigid metricality. Rhyme is incidental/assonantal as the form demands focus on end-words.
