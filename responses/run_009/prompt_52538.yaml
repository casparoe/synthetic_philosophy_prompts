prompt: |-
  I write for a general-interest magazine, mostly on a science and ideas beat, and something I keep tripping over in my own copy is how we talk about things lasting through time — and I want to know whether philosophy has a name for the specific wrinkle. Here's the wrinkle. Last year I did a piece about a cathedral that burned and was rebuilt, and without thinking I wrote both that the cathedral has stood on that site for 900 years and, two paragraphs later, that nothing of the original building survives above the foundations. Both sentences felt fine to my editor, both felt fine to me, and their in tension in a way I can't quite pin down: if nothing original survives, in what sense has the *same* cathedral stood there? Once you start looking, the same switch shows up everywhere. A profile will say a company traces its history to 1904 right after describing how three mergers replaced its management, workforce and product line — and a source quoted in the very same story will say the outfit he joined doesn't exist anymore, which also seems true. Obituaries do it with people: "she was never the same after the stroke," said as a literal claim and not just a turn of phrase.

  The part I'm actually curious about is not the Ship of Theseus bit — I know that label, everyone knows that label, and it's usually told as a puzzle about how much replacement one object can absorb. What I keep noticing is different: it's that we seem to silently switch between two ways of picking the thing out, depending on which features the sentence needs. Sometimes the thing is whatever thread connects the stages — the corporation chartered in 1904, the building on that plot, the body with that name — and sometimes it's a cluster of characteristics, the architecture, the research culture, the personality, and ordinary language lets us call both of them "the same thing" without ever flagging that a switch happened. So: is there an established concept or literature for this two-track way of talking about persistence? If the nearest thing out there is just the Theseus puzzle again, tell me that straight, and explain how the two come apart. And if there's no standard name, coin one and define it precisely enough that I can look at a given sentence in a piece and say which track the writer is on — because right now I'm printing sentences that are true on one reading and false on the other, and I'd like to at least know which is which.
reasoning: |-
  Okay, this is a fascinating question from a science and ideas writer. They're noticing a subtle but pervasive pattern in everyday language where we switch between two different ways of talking about persistence without acknowledging the shift. It's not quite the Ship of Theseus problem, but something more fundamental about how we conceptualize identity over time.

  Hmm, let me unpack their core observation. They give three clear examples: a rebuilt cathedral described as standing for 900 years despite no original material, a corporation tracing history to 1904 despite complete overhaul, and a person being "never the same" after a stroke. In each case, we effortlessly use the same name ("the cathedral," "the company," "she") while referring to different aspects - sometimes the formal continuity (charter/location/body) and sometimes the qualitative essence (architecture/culture/personality).

  What they're really asking for is: 1) whether philosophy has a name for this dual-track thinking, 2) if not, a precise way to distinguish the two modes, and 3) practical tools to identify which track a given sentence is using. Importantly, they want to avoid conflating this with the Ship of Theseus puzzle, which they correctly note focuses on material replacement thresholds rather than conceptual switching.

  I recall this taps into Derek Parfit's work on personal identity - his distinction between "numerical identity" (the entity itself) and "qualitative identity" (similar properties). But the writer's examples show this extends beyond persons to institutions and artifacts. Lynne Baker's constitution view might also be relevant for objects like cathedrals. 

  The corporate example makes me think of organizational persistence theories - how companies maintain identity through legal registration rather than physical continuity. And the cathedral case parallels debates about restoration ethics in heritage conservation. 

  For practical application, what the writer needs is diagnostic criteria. We could call the two modes "formal persistence" (charters, deeds, biological continuity) versus "qualitative persistence" (traits, culture, character). A test question for any statement might be: "If this aspect changed completely, would we still consider it the same entity?" 

  The deeper issue they're circling is how language handles what philosophers call "continuants" - things that persist through change by having temporal parts. But introducing that terminology might overwhelm their practical needs. Better to stick with clear, magazine-friendly distinctions.

  Ah, and they explicitly asked for a coined term if none exists. "Perspectival persistence" could work, but "continuity switching" might be more intuitive for writers. The key is giving them analytical lenses they can apply sentence by sentence.
answer: |-
  What you're describing isn't just the Ship of Theseus puzzle – it's a deeper, more fundamental observation about **how language itself handles persistence over time**. Philosophers *do* have concepts for this, though there isn't one universally agreed-upon label. Your insight about the "silent switch" is spot on.

  Here's the breakdown, the established concepts, and a practical toolkit for your writing:

  **The Two Modes of Persistence (The Switch):**

  1.  **Numerical Identity (The "Formal Thread"):** This is the strict "sameness" of the *particular individual thing*. It's the entity itself persisting through time. We track it via *spatiotemporal continuity* (the thing traces an unbroken path through space and time) and/or *formal designation* (the legal charter, the deed to the plot, the biological organism, the registered name). This mode answers the question: "Is it literally *this very thing*?"
  2.  **Qualitative Identity / Similarity (The "Cluster of Characteristics"):** This is about *resemblance*, *properties*, *character*, *function*, or *essence*. It answers the question: "Is it *like* the original in the ways we care about?" or "Does it fulfil the same role/embody the same core idea?" This is about features, not the underlying entity.

  **Why This Isn't *Just* Ship of Theseus:**

  *   **Ship of Theseus Focus:** Primarily on the *threshold* of change within a *single mode* (numerical identity). How much replacement of parts (material characteristic) can the *one ship* (numerical entity) endure before it's no longer numerically identical?
  *   **Your Observation Focus:** On the *linguistic/conceptual switch* between two *fundamentally different modes* of identification (numerical vs. qualitative) happening seamlessly within ordinary discourse, often *within the same narrative*. The problem isn't gradual replacement blurring the line for one concept; it's the effortless use of the same name (*"the cathedral," "the company," "she"*) to refer to *different concepts* depending on the immediate context.

  **Established Philosophical Concepts & Frameworks:**

  1.  **Numerical vs. Qualitative Identity:** This is the core distinction, widely used in metaphysics and philosophy of identity (personal, object, etc.).
      *   **Numerical Identity:** A = B (It *is* the very same thing).
      *   **Qualitative Identity:** A is *exactly similar* to B in all relevant properties (It's *like* the original, perhaps indistinguishable).
  2.  **Continuants vs. Perdurants / Endurants vs. Perdurants:** This tackles *how* things persist.
      *   **Continuants/Endurants:** The thing exists *wholly* at each moment it exists. It endures through time, changing its properties. This perspective naturally leans towards tracking the "formal thread" (the entity itself changing). Your cathedral *as a single enduring entity* stands for 900 years.
      *   **Perdurants:** The thing is spread out in time, composed of different *temporal parts* (like a worm). The "cathedral" is the sum of its temporal slices: the 1100 AD slice, the 1500 AD slice, the 2023 post-fire slice. Persistence is having successive temporal parts. This can accommodate both the numerical thread (the worm) and the changing qualities (the properties of each slice). Saying "the cathedral has stood for 900 years" refers to the entire perduring entity. Saying "nothing original survives" refers to the properties of the *current* temporal part.
  3.  **Sortal-Dependence (P.T. Geach, Wiggins):** What counts as "the same thing" depends crucially on *what kind of thing* we are talking about (its *sortal*). The criteria for persistence are kind-relative.
      *   Persistence for a *human* relies heavily on biological/psychological continuity.
      *   Persistence for a *corporation* relies heavily on legal continuity, charters, and perhaps organizational structure.
      *   Persistence for a *building* might rely on location, function, or formal designation (like being listed as a heritage site).
      *   **The Switch:** We may subtly shift the implied sortal or the weight given to different persistence criteria within the same narrative context. "The company since 1904" uses a *legal/institutional* sortal. "The outfit he joined doesn't exist" uses a *cultural/operational* sortal.

  **The Coined Term & Practical Toolkit:**

  Since no single term perfectly captures the *linguistic switch* itself, let's define one:

  *   **Continuity Switching:** The seamless, often unconscious, shift in discourse from identifying an entity primarily by its **Formal Continuity** (numerical identity, legal/bio/spatio-temporal thread) to identifying it primarily by its **Characteristic Continuity** (qualitative identity, resemblance in core properties, function, essence), or vice versa, while using the same name.

  **How to Diagnose "Continuity Switching" in a Sentence:**

  Ask these questions about the specific claim being made:

  1.  **What defines "sameness" here?**
      *   Is sameness defined by an unbroken chain (deed, charter, birth certificate, physical location, continuous existence)? → **Formal Continuity.**
      *   Is sameness defined by retained features (looks the same, functions the same, has the same culture/personality, is made of the same stuff)? → **Characteristic Continuity.**
  2.  **What would make the claim false?**
      *   If the claim "The cathedral has stood for 900 years" would be false only if the *plot was abandoned* or the *legal entity dissolved*, even if the original stonework remained → **Formal Continuity.**
      *   If it would be false if the *architecture/style/function radically changed* (even if on the same plot with the same name) → **Characteristic Continuity.**
      *   If "She was never the same after the stroke" would be false only if her *biological organism ceased* → **Formal Continuity.**
      *   If it would be false if her *personality/memories/abilities returned to pre-stroke state* → **Characteristic Continuity.**
  3.  **What is the relevant "sortal" implied?**
      *   Is it treated as a *legal entity*, *biological organism*, *spatially fixed object*? → Favors **Formal Continuity.**
      *   Is it treated as a *cultural institution*, *brand*, *personality*, *collection of specific materials*? → Favors **Characteristic Continuity.**

  **Applying it to Your Examples:**

  1.  **Cathedral:**
      *   "Stood on that site for 900 years" → **Formal Continuity.** (Emphasis on location, continuous existence as *a* cathedral on *that* spot).
      *   "Nothing of the original building survives" → **Characteristic Continuity.** (Emphasis on the *specific material properties* of the initial structure).
  2.  **Company:**
      *   "Traces its history to 1904" → **Formal Continuity.** (Emphasis on the unbroken chain of legal incorporation/registration/ownership traceable back to the 1904 entity).
      *   "The outfit he joined doesn't exist anymore" → **Characteristic Continuity.** (Emphasis on the specific culture, management, workforce, products - the operational essence he experienced).
  3.  **Person:**
      *   "She was never the same after the stroke" → **Characteristic Continuity.** (Emphasis on personality, abilities, cognitive traits - the qualitative essence).
      *   (Implied contrast): Referring to her *as the same person* elsewhere in the obituary → **Formal Continuity.** (Emphasis on the biological organism, the legal person, the life story thread).

  **Why This Matters for Your Writing (and why you're right to notice):**

  You *are* printing sentences that are true on one reading (Formal Continuity) and potentially false on the other (Characteristic Continuity), and vice-versa. Recognizing "Continuity Switching" allows you to:

  1.  **Be Intentional:** Decide *which* kind of continuity is most relevant to your point in a specific sentence. Do you want to emphasize the unbroken thread of existence, or the preservation (or loss) of core characteristics?
  2.  **Avoid Unintended Contradiction:** Be mindful when switching modes close together. Acknowledge the shift implicitly through context or explicitly if needed (e.g., "While the *legal entity* dates to 1904, the *company familiar to longtime employees* vanished after the merger").
  3.  **Enhance Precision:** Use language that subtly cues the reader to the relevant mode. Words like "legacy," "traces its roots," "chartered," "located at" lean Formal. Words like "character," "essence," "culture," "original fabric," "spirit" lean Characteristic.
  4.  **Deepen Analysis:** When profiling a transformed company or an individual after trauma, explicitly exploring the tension between Formal and Characteristic continuity can be a powerful narrative and conceptual tool.

  You've identified a fundamental feature of how language copes with time and change. By naming it ("Continuity Switching") and using the diagnostic questions, you gain the power to see *which* track you or your sources are on in any given sentence, making your writing more precise and philosophically aware.
