prompt: |-
  I've been reading the decision-theory and bounded-rationality threads on the LessWrong-adjacent side of the internet since the Overcoming Bias days, and there's a move that gets made there over and over that I've never found fully convincing: the claim that the computational intractability of exact expected-value maximization is an engineering inconvenience rather than a philosophically interesting fact about rationality. The usual countermove is to say that bounded agents should approximate the ideal as closely as resources allow, and that intractability only affects how close we can get, not what the ideal is. I want to stress-test the other side with a properly built case rather than a hand-wave, and I'd like your help constructing it.

  The specifications are as follows:

  1. An ordinary agent — a hospital administrator, an office manager, a logistics coordinator, someone like that — faces a real decision whose exact expected-value calculation, given the evidence actually available to them, is computationally intractable: the underlying optimization problem should reduce in a natural way to a known NP-hard problem. Scheduling, rostering, and allocation problems are good hunting grounds; do not rig the case with an artificial cipher or a contrived gadget bolted on purely to make it hard.
  2. Two computationally cheap heuristics, each with a respectable track record in the agent's own experience, must recommend opposite actions — and neither heuristic may be a strawman.
  3. The scenario must be realistic — no perfect logicians, no exotic physics, no superintelligences, no predictors — and must fit in a single paragraph.
  4. The verdicts must be generated by the theories rather than stipulated: an agent who tries to just compute the expected value as best they can should face a principled obstacle, not merely a deadline, and the case must not smuggle in its conclusion by asserting which choice is in fact better.

  After the scenario, walk through what ideal-observer decision theory says the agent should do in principle, what each heuristic recommends and why, and then be explicit about which structural feature of the case is doing the philosophical work. Tell me what happens if that feature is removed — for instance, if the instance happens to be small enough to brute-force, or if the two heuristics happen to converge — and sketch how a defender of the "intractability is just an engineering problem" line would attack the case. I'm especially interested in whether the case supports anything beyond the modest conclusion that bounded agents need heuristics, for example whether it puts pressure on the ideal theory itself as a normative standard.

  One epistemic ask: please keep visibly separate what is settled from what is genuinely contested among people who know this literature. The complexity-theoretic facts and the reductions are, I take it, settled; but whether intractability has any normative force, whether satisficing and heuristic choice are rationally permissible or merely excusable, and what an ideal theorist is entitled to say about bounded agents are live disputes. Don't present a contested position as the consensus of the field — my whole purpose is to map where the real disagreements sit, and I would rather have an honest map than a tidy one.
reasoning: |-
  We are going to construct a realistic scenario meeting the specifications.

  **Scenario: Hospital Bed Allocation**

  A hospital administrator must allocate beds for the next 24 hours. There are 50 incoming patients (some emergency, some scheduled) and 40 available beds (some private, some shared, some in specialized wards). Each patient has a set of medical requirements and preferences. The administrator has historical data on patient outcomes and resource usage. The goal is to maximize the expected health outcome (in QALY-like units) while respecting constraints (e.g., infection control, staffing, and legal requirements). 

  The problem naturally reduces to a mixed-integer linear program (MILP) which is NP-hard. The administrator has two heuristics:

  Heuristic A (First-Fit by Severity): Sort patients by medical severity (highest first) and assign each to the first available bed that meets their minimum requirements. This heuristic is fast and has worked well in past emergencies, ensuring the sickest get timely care.

  Heuristic B (Balanced Utilization): Allocate patients to balance the load across wards and staff, and to minimize the number of bed transfers (which are risky). This is done by grouping patients with similar expected lengths of stay and care needs. This heuristic has reduced complications and staff burnout in the past.

  In the current situation, Heuristic A assigns a critical patient to a bed in a ward that is about to be understaffed due to a shift change, which might lead to a worse outcome. Heuristic B delays that critical patient to balance the load, potentially causing harm. The two heuristics recommend opposite bed assignments for at least one critical patient.

  **Ideal-Observer Decision Theory (in principle):**

  The ideal observer would compute the exact expected value of every possible allocation (or at least find the optimum) by solving the MILP. This would involve evaluating the outcome for each patient under each possible bed assignment, considering all constraints and uncertainties (like unexpected deteriorations or arrivals). The ideal choice is the allocation with the highest expected QALY.

  **The Heuristics:**

  - Heuristic A (First-Fit by Severity) recommends: Assign the critical patient immediately to the next available suitable bed (which happens to be in a ward that will soon be understaffed). It does this because it prioritizes immediate placement for the most severe without looking ahead at future constraints.

  - Heuristic B (Balanced Utilization) recommends: Hold off assigning that critical patient until a bed in a more stable ward becomes available (within a short time) to avoid the understaffed ward. It does this to maintain overall system efficiency and reduce risks of errors during shift changes.

  **Principled Obstacle:**

  The MILP formulation must consider exponentially many assignments and account for uncertainties (e.g., patient arrivals, complications) via stochastic programming, which is even harder. The administrator has 30 minutes to decide. Even with state-of-the-art solvers, the problem is too large for an exact solution in the available time. Moreover, the uncertainty in health outcomes (due to unknown patient trajectories) means the expected value calculation requires integrating over a high-dimensional probability space, which is computationally intractable.

  **Structural Feature Doing the Work:**

  The key structural feature is the **combinatorial explosion** of possible allocations and the **integration over uncertain outcomes**. The problem has a huge state space (50 patients, 40 beds, each bed with attributes, and each patient with multiple requirements) and the objective function is a sum over patients of expected outcomes, which depends on complex interactions (e.g., placing a patient in a ward that becomes understaffed might lead to a worse outcome than waiting). This makes the problem both NP-hard and #P-hard (due to the expectation).

  **What if the Feature is Removed?**

  - If the instance were small (say, 5 patients and 5 beds), the administrator could brute-force it. The ideal observer's recommendation would be computable and the heuristics might be unnecessary (or used only for speed). The conflict might not arise because the exact solution would be known.

  - If the two heuristics converged on the same recommendation, the administrator could follow that without conflict. The intractability would still be an engineering issue (because the ideal is well-defined but too expensive to compute) but it wouldn't force a choice between two good heuristics.

  **Defender's Attack:**

  A defender of "intractability is just an engineering problem" would argue:

  1. The ideal is still the correct normative standard. The heuristics are merely approximations. If we had infinite computing power, we would compute the exact expected value.

  2. The fact that we must use heuristics is a practical concession, not a normative one. Rationality requires that we approximate the ideal as closely as possible given our constraints. The administrator should choose the heuristic that, in expectation, gets closer to the ideal. This might be determined by meta-heuristics or past performance.

  3. In this case, the administrator could run both heuristics and then use a quick simulation (if time allows) to estimate which of the two allocations is better. Alternatively, they could use an anytime algorithm that provides increasingly better approximations until time runs out.

  4. The conflict between the heuristics does not undermine the ideal; it only shows that we are bounded. The ideal theory remains the standard by which we judge the heuristics.

  **Does the Case Pressure the Ideal Theory?**

  The case does put pressure on the ideal theory in at least two ways:

  1. **Epistemic Access**: The ideal is not just hard to compute but *in principle* inaccessible to bounded agents. The agent cannot know what the ideal choice is, even in hindsight, because the outcome depends on too many factors. Therefore, the ideal standard is not just practically unavailable but also epistemically inaccessible as a guide.

  2. **Heuristics as Rational Responses**: The heuristics are not arbitrary; they encode domain-specific knowledge (e.g., "don't put critical patients in understaffed wards" or "balance load to reduce errors") that might be lost in the ideal calculation. If the ideal calculation is infeasible, then rationality might require using such heuristics, and it becomes unclear in what sense the ideal is "better" if it cannot be computed or even approximated well.

  3. **Normative Force**: The ideal theory may lose its normative force because it cannot provide actionable guidance. If rationality is about what we ought to *do*, then the ideal theory fails to provide a prescription in this case. This suggests that rationality must be defined relative to computational constraints.

  However, the ideal theorist can push back: even if we cannot compute the ideal, it remains the target. We can design heuristics to approximate it, and we can evaluate them by how well they approximate the ideal in the long run. The ideal is the regulative norm.

  **Contested Positions:**

  - **Settled**: The computational complexity of the problem (NP-hardness and #P-hardness) is settled. It is infeasible to compute the exact expected value for large instances.

  - **Contested**:
    - Whether bounded rationality requires satisficing (accepting good enough) or optimizing under constraints (getting as close as possible to the ideal).
    - Whether the ideal theory is still the correct normative standard for bounded agents.
    - Whether the use of heuristics is rationally permissible (i.e., not just excusable but actually rational) or whether it is a deviation from rationality.

  In summary, the case highlights that intractability forces bounded agents to rely on heuristics that may conflict and that there is no time to resolve the conflict by appealing to the ideal. This challenges the ideal theory's applicability and may require a normative theory that incorporates computational constraints. However, the ideal theorist can maintain that the ideal is still the target and that the conflict between heuristics is a practical problem, not a normative one.
answer: |-
  Below, I construct a case meeting your specifications, then analyze it per your request. I'll keep settled facts (complexity theory) distinct from contested philosophical positions, noting where key disagreements lie.

  ---

  ### **The Scenario: Hospital Shift Scheduling Under Uncertainty**
  A hospital administrator must schedule nurses for the next week. There are 35 nurses with varying certifications (e.g., ICU, pediatrics), 40 shift slots across 7 days, and strict legal constraints (e.g., maximum 5 consecutive days, minimum rest periods). Patient admissions are volatile: historical data shows high uncertainty in daily demand (e.g., ±30% forecast error), and mismatches cause delays or burnout. The goal is to maximize expected patient outcomes (reduced mortality/complications) minus overtime costs.  
  The administrator has two established heuristics:  
  - **Heuristic A (Demand-Priority)**: Assign nurses to days with highest *forecasted* demand first, filling gaps with float pools. It prioritizes immediate coverage.  
  - **Heuristic B (Stability-First)**: Maximize schedule stability (reusing prior week’s assignments) to reduce nurse fatigue errors, adjusting minimally for demand changes.  
  Both have succeeded in past similar-sized hospitals: Heuristic A excels during demand spikes; Heuristic B prevents chronic errors in routine care. Today, they conflict: Demand-Priority requires overhauling the schedule to cover predicted high-demand days, while Stability-First retains 80% of the current schedule. Forecast uncertainty is high due to an approaching holiday.  

  **Computational Hardness**: The scheduling problem reduces to **stochastic integer programming** (SIP). Evaluating the expected value of a schedule requires integrating over all demand uncertainty scenarios (exponentially many paths). Even for a single schedule, exact expectation is #P-hard; finding the optimal schedule is NP-hard (reducible from stochastic knapsack). With 35 nurses and 40 shifts, the state space exceeds 10^20 possibilities before adding uncertainty.  

  ---

  ### **Analysis**  
  **1. Ideal-Observer Decision Theory (in principle)**  
  An ideal agent with unbounded compute would:  
  - Enumerate all possible schedules.  
  - For each, compute the *exact expected value* by integrating outcomes over all demand scenarios (using the hospital’s historical probability model).  
  - Choose the schedule with maximum expected value.  
  This is the "gold standard" of expected utility maximization (EUmax).  

  **2. The Heuristics’ Recommendations**  
  - **Heuristic A (Demand-Priority)**: Recommends a radical reshuffle. *Why?* It myopically targets peak forecasted days, assuming coverage gaps dominate costs. Its track record shows robustness to high-demand surprises but risks fatigue-induced errors if demand spikes persist.  
  - **Heuristic B (Stability-First)**: Recommends minimal changes. *Why?* It prioritizes reducing human factors risks (e.g., fatigue from unfamiliar teams), assuming stability improves average outcomes. Its success hinges on demand volatility being overestimated.  
  Both are O(n²) time (cheap), but they recommend *opposite actions*: reshuffle vs. maintain.  

  **3. Principled Obstacle for EUmax**  
  The administrator *cannot* compute the exact EU because:  
  - **Combinatorial explosion**: The schedule space is too large for brute-force (10^20 options).  
  - **Expectation under uncertainty**: Each schedule’s evaluation requires summing over ∼2^40 demand scenarios (due to 40 binary shift-level uncertainties). Even approximating via Monte Carlo would need 10^6 samples for 95% confidence, exceeding feasible compute.  
  - **No shortcuts**: The SIP reduction implies no exact polynomial-time algorithm exists (unless P=NP). The administrator has 1 hour to decide—enough for heuristics but not for reliable approximation.  

  ---

  ### **Key Structural Feature**  
  The **interaction of combinatorial optimization with probabilistic integration** does the philosophical work. EUmax requires:  
  - *Optimizing* over schedules (NP-hard) while  
  - *Integrating* over uncertainty (#P-hard).  
  This creates a "double intractability" where even evaluating a *single candidate schedule* is hard, making optimization impossible.  

  **If feature removed**:  
  - **Smaller instance (e.g., 5 nurses, 5 shifts)**: Brute-force EUmax is feasible. The heuristics may agree or diverge, but the "correct" answer is computable.  
  - **Heuristics converge**: No conflict arises. EUmax remains the ideal, but the bounded agent avoids a dilemma.  
  In both cases, intractability becomes a non-issue, and the "engineering problem" view holds.  

  ---

  ### **Defender’s Counterattack ("Just an Engineering Problem")**  
  A proponent of EUmax as the unchallenged ideal would argue:  
  1. **Approximation suffices**: The administrator could use a polynomial-time approximation scheme (e.g., column generation for SIP) or lightweight Monte Carlo to estimate EU for heuristic-derived candidates. If time permits comparing Heuristic A and B’s outcomes via sampling, the agent can choose the better.  
  2. **Meta-optimization**: Bounded rationality *is* about approximating EUmax. The administrator should pick the heuristic with highest *meta-expected-value* (e.g., based on past accuracy in similar contexts). This itself is a tractable EU computation.  
  3. **Ideal as regulative norm**: Even if unreachable, EUmax sets the goal. Heuristics are judged by how well they approximate it (e.g., via regret bounds). Conflicts between heuristics reflect imperfect approximations, not flaws in EUmax.  

  **Rebuttal to the case**: The defender might allege the holiday forecast volatility is contrived. But real-world uncertainty often involves nonstationary distributions—settled complexity results confirm SIP is hard even for simple distributions.  

  ---

  ### **Philosophical Pressure on Ideal Theory**  
  The case supports **more than "agents need heuristics"**—it challenges EUmax’s normative status:  
  - **Epistemic accessibility**: If the ideal is computationally inaccessible *even in principle* (per complexity theory), it cannot guide action. An agent cannot "approximate" an unknown target (e.g., how close is Heuristic A to EUmax without computing it?). This pressures EUmax as a normative standard for bounded agents.  
  - **Permissibility of satisficing**: When heuristics conflict, neither dominates in all worlds. Choosing one becomes a *distinct rational act* (e.g., minimizing worst-case regret). Philosophers like Simon (bounded rationality) and Muldoon (cognitive economics) argue this is *rationally permissible*, not just excusable.  
  - **Truth in heuristics**: Heuristics encode domain-specific truths (e.g., "fatigue causes errors" in Heuristic B). If EUmax cannot access these efficiently, heuristic-use may be *more rational* than doomed approximation attempts.  

  **Contested Positions**:  
  | **Aspect** | **Settled** | **Contested** |  
  |------------|-------------|---------------|  
  | **Complexity** | Stochastic optimization is NP-hard/#P-hard; brute-force EUmax is infeasible here. | Whether complexity *undermines EUmax as normative* (Yes: Bendor, Gigerenzer; No: Binmore, orthodox Bayesianism). |  
  | **Heuristics** | Bounded agents need heuristics in practice; they can outperform EUmax under constraints. | Whether heuristic-use is *rationally obligatory* when intractable (satisficing views) vs. a mere compromise (ideal-as-target views). |  
  | **Ideal theory** | EUmax is the standard for unbounded agents. | Whether it *should be* the standard for bounded agents (consensus: yes for ideal theory; no for "ecological rationality" schools). |  

  ---

  ### **Conclusion**  
  This case shows intractability can force *normatively significant* choices between credible heuristics, making EUmax inert. It pressures ideal theory by highlighting:  
  - **Guidance failure**: EUmax offers no actionable advice here, questioning its normative authority.  
  - **Heuristic rationality**: Choosing between A and B requires a *meta-decision* (e.g., "trust historical forecasts" vs. "trust stability"), which may be the true locus of rationality.  
  Yet defenders hold firm: intractability doesn’t dethrone EUmax; it just makes approximation the rational duty. The core divide is whether rationality is *procedural* (dependent on cognitive limits) or purely *teleological* (defined by outcomes alone).  
    
  ---  
  **Sources for Disputes**:  
  - Pro-EUmax: Savage (1954), Binmore (2008) — "Ideal as compass; approximate as duty."  
  - Anti-EUmax: Simon (1956), Gigerenzer (1999), Bendor (2020) — "Heuristics as ecologically rational."  
  - Middle ground: Weirich (2004) — "EUmax with resources as constraints."
