prompt: |-
  so I've been trying to figure out what my gut actually says about when something is "above and beyond the call of duty" versus just plain duty, and I want a principle. You're a professional philosopher working in normative ethics — think carefully, maybe start with some quick brainstorming about candidate principles before you commit to one, and don't just hedge on everything.

  here are my verdicts on cases:

  - soldier jumps on a grenade to save squadmates: above and beyond, obviously
  - donating a kidney to a stranger: above and beyond
  - pulling a drowning kid out of a shallow pond, ruining your shoes and being late to work: NOT above and beyond, that's just obligatory. you'd be a monster to walk past
  - keeping my promise to drive a friend to the airport at 5am, big hassle: duty, not above and beyond, even though it costs me way more than giving blood does
  - donating blood every couple months: somehow above and beyond, even though its cheap and easy for me
  - staying late to fix a mistake I made at work: duty
  - staying late to fix a coworker's mistake so they dont get blamed: above and beyond. same cost, different verdict, and I can't fully explain it
  - telling a friend a hard truth about their relationship when nodding along would be easier: duty, not above and beyond

  my tentative principle was: an act is above and beyond when it involves a sacrifice bigger than duty requires. but that gets the promise case wrong (huge sacrifice, still just duty) and the blood case wrong (tiny sacrifice, still feels above and beyond), so it needs surgery, not a bandaid.

  what principle actually captures all of this? does it need something like "for whose benefit" or "did you already commit to it" built in? tell me what the resulting principle says about the case I keep flip-flopping on: a parent donating a kidney to their own child. part of me says that's just duty for a parent, part of me says it's clearly above and beyond, I genuinely can't tell which my gut settles on. and please be honest about which of my verdicts your principle can't save — I'd rather drop a verdict than bolt on some ugly epicycle.
reasoning: |-
  Okay, the user is struggling to define a principle that distinguishes "above and beyond the call of duty" from regular duties. They've provided several examples with their intuitive judgments. Let me start by understanding their cases.

  First, the soldier jumping on a grenade is clearly above and beyond. Donating a kidney to a stranger too. But pulling a kid from a pond is obligatory, not above and beyond. Keeping a promise to drive a friend, even if it's a hassle, is duty. Donating blood regularly, despite being easy, feels above and beyond. Fixing your own mistake at work is duty, but fixing a coworker's mistake is above and beyond. Telling a friend a hard truth is duty.

  Their initial principle was about sacrifice size, but it fails with the promise case (big sacrifice but duty) and blood donation (small sacrifice but above and beyond). They mentioned factors like "for whose benefit" or prior commitments. The kidney donation to a child is ambiguous for them.

  I need to brainstorm principles. Maybe looking at moral theories. Deontology focuses on duties and permissions. Supererogation involves actions beyond duty. But how to define that boundary? 

  Looking at the cases, the key might be the relationship or prior obligations. For example, driving a friend is a promise, so it's a duty. Fixing your own mistake is a duty because you caused it. But fixing a coworker's mistake isn't your responsibility, so above and beyond. Donating blood has no prior obligation, so even if easy, it's supererogatory. 

  The kidney donation to a child: parents have a special duty to care for their children. Medical sacrifice might fall under that duty, but it's significant. The user is conflicted, which suggests that parental duties have limits. Maybe the principle needs to account for the extent of sacrifice relative to the relationship. 

  Another angle: actions that are morally optional versus required. Required duties stem from relationships, promises, or direct causation. Optional acts are those not obligatory but praiseworthy. 

  The principle could be: An act is above and beyond when (1) it isn't required by a specific prior commitment or relational duty, and (2) it involves significant sacrifice for another's significant benefit. 

  Testing this: Donating kidney to stranger meets both. Pulling kid from pond is required by general duty to aid when easy. Blood donation: no prior commitment, but sacrifice is minimal. However, the user sees it as above and beyond. Maybe adjust: sacrifice doesn't need to be huge if the act is optional. But then why is blood donation above and beyond? Because there's no obligation to donate, even if easy. 

  Ah, the optionality is key. If there's no duty to act, but you do it for others' benefit, it's supererogatory. Blood donation isn't obligatory; society doesn't require it. Whereas saving a drowning child is obligatory because you're directly preventing harm with minimal cost. 

  For the parent-child kidney: parents have a duty to provide necessary care, but organ donation might exceed typical expectations. The sacrifice is substantial. So it could be seen as beyond duty, but maybe the user's intuition varies because parental duties are strong. 

  The user needs honesty about mismatches. The blood donation case might be tricky. If the principle requires significant sacrifice, but blood donation is low cost, why is it above and beyond? Perhaps because it's not obligatory; the duty to help isn't specific. But then pulling the kid is obligatory due to immediacy and low cost. 

  Maybe the principle combines: absence of duty + positive net benefit. Blood donation: no duty, benefits others. But driving to airport is a duty because of a promise. 

  The kidney for a child: parental duties might include reasonable medical care, but organ donation is beyond. So it's above and beyond. The user's flip-flopping might come from societal expectations versus personal sacrifice. 

  Need to check all cases. Fixing coworker's mistake: no prior commitment, sacrifice, so above and beyond. Telling hard truth: duty as a friend. 

  So the final principle: An act is above and beyond if (a) it isn't required by a specific obligation (from relationships, promises, or direct causation), and (b) it involves non-trivial cost to the agent for another's significant benefit. 

  Blood donation: meets a and b? Cost is trivial, but the user says above and beyond. Maybe adjust (b) to allow for low cost if the benefit is great and no duty exists. But then why isn't donating blood just obligatory if it's easy? Because there's no specific obligation; it's a general charity. 

  The user's judgment on blood donation might be cultural or personal. The principle could note that low-cost acts can be supererogatory if beyond minimal decency. 

  For the parent-child kidney, the principle would say: parents have an obligation to aid, but organ donation's cost might exceed duty, making it above and beyond. The user's conflict might stem from strong parental expectations. 

  Honestly, the blood case might be a mismatch unless we accept that some duties are minimal, and anything beyond is supererogatory, even if easy. But the user's intuition is strong here, so perhaps the principle needs to accommodate that by emphasizing the lack of specific obligation rather than cost. 

  Final thought: the principle holds except for blood donation, which might be an edge case where societal norms influence perception. The user might need to decide if they're willing to adjust that verdict or refine the principle.
answer: |-
  After analyzing your cases and wrestling with the core tension (sacrifice size vs. obligation source), the most robust principle I land on is this:

  **An act is above and beyond the call of duty if and only if:**
  1.  **It is not required by a specific obligation** arising from a prior commitment (promise, contract, role-based duty), a relationship of special responsibility (parent-child, close friendship), *or* direct causal responsibility for the harm/threat; *and*
  2.  **It involves a significant cost, risk, or sacrifice** to the agent, understood relative to their circumstances and capacities, *and* provides a significant benefit or prevents a significant harm to another.

  **Why this principle works for your cases:**

  | **Case** | **Specific Obligation?** | **Significant Cost?** | **Above & Beyond?** | **Explanation** |
  |----------|---------------------------|------------------------|---------------------|----------------|
  | **Soldier jumps on grenade** | No (beyond role duty) | Extreme (life) | ✔ Yes | Combat role doesn't *require* self-sacrifice |
  | **Donating kidney to stranger** | No | Substantial (surgery, risk) | ✔ Yes | No prior commitment or relationship |
  | **Saving drowning kid** | Yes (direct harm prevention) | Minor (shoes, lateness) | ✘ No | Easy rescue creates immediate duty |
  | **Driving friend to airport** | Yes (explicit promise) | Substantial (sleep loss) | ✘ No | Promise creates binding obligation |
  | **Donating blood regularly** | No | Minimal (for user) | ✔ Yes | No specific obligation despite low cost |
  | **Fix own work mistake** | Yes (causal responsibility) | Moderate (time) | ✘ No | Self-caused problem creates duty |
  | **Fix coworker's mistake** | No | Moderate (time) | ✔ Yes | No direct responsibility or commitment |
  | **Tell friend hard truth** | Yes (friendship duty) | Moderate (discomfort) | ✘ No | Friendship implies honesty obligation |

  **Handling the Parent-Child Kidney Donation:**
  This case exposes a boundary. The principle *strongly suggests* it's **duty**, not above and beyond:
  1.  **Specific Obligation?** YES. The parent-child relationship creates a *very strong* duty of care. Providing life-saving medical intervention (within reasonable limits) falls under this core responsibility, similar to providing food or shelter.
  2.  **Significant Cost?** YES (major surgery/risk). But crucially, the *first condition fails* – the obligation exists.

  **Why your gut might flip-flop:**
  *   **The Sacrifice Magnitude:** The cost is immense, triggering our "above and beyond" intuition. We instinctively recognize the heroism.
  *   **Defining "Reasonable Limits" of Parental Duty:** Does parental duty demand *any* sacrifice, however large? Most ethicists argue duties have limits. Donating a kidney might push against that limit, making it *feel* supererogatory. The principle captures this tension: the *duty* is strong, but the *cost* makes fulfilling it exceptionally praiseworthy – it's a **heroic fulfillment of duty**, not an act *beyond* duty. Your conflict likely stems from weighing the extreme cost against the extreme strength of the parental obligation.

  **Honest Mismatches & Trade-offs:**
  1.  **Blood Donation:** This is the **weakest fit**. The cost is minimal *for you*, yet you (and society) intuitively see it as above and beyond. The principle captures *why* it's supererogatory (no specific obligation), but the minimal cost makes it feel less heroic than the other "above and beyond" cases. **Potential Resolution:** We might slightly adjust principle point 2 to "involves *some* cost/sacrifice (even if minimal) *or* significant effort/initiative where none is required." This better captures low-cost supererogation like easy charity or blood donation. However, it risks making *too many* minimal acts "above and beyond." I lean towards keeping "significant cost" but acknowledging blood donation as a case where societal norms amplify the praiseworthiness beyond the cost, precisely *because* it's optional.
  2.  **Parent-Child Kidney:** As argued, the principle firmly places it as duty. If your gut *persistently* says it's above and beyond, it might challenge the strength I assign to the parental obligation in this extreme scenario. However, dropping the verdict that it's duty would require "bolting on" an ugly exception about cost thresholds within relationships, weakening the principle's coherence.

  **Conclusion & Refined Principle:**
  The core insight is that **duty stems from specific grounds (commitment, relationship, causation)**, not just cost. "Above and beyond" acts *lack* these specific grounding obligations *and* involve significant sacrifice for another's significant good.

  **Final Principle:**
  **An act is above and beyond the call of duty iff it (a) fulfills no specific obligation arising from the agent's prior commitments, special relationships, or direct causal responsibility for the situation, *and* (b) involves significant cost, risk, or sacrifice to the agent that results in significant benefit or harm-prevention for another.**

  **Blood Donation Accommodation (Optional):** If preserving that verdict is essential, amend (b) to: "involves *a* cost, risk, or sacrifice to the agent (even if relatively minor, provided it is non-zero) that results in significant benefit or harm-prevention for another." This works for blood but risks diluting the "above and beyond" distinction for very small goods. The parent-child case remains firmly *duty* under either version.

  This principle explains your intuitions systematically, handles the ambiguous case coherently (as heroic duty), and only struggles slightly with blood donation's minimal cost – which reflects a real tension in how we categorize low-cost, high-optionality beneficence.
