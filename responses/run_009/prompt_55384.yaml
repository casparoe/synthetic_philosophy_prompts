  We are designing a self-contained exam question on conceptual slippage in a letter-string microdomain.
   The domain: strings of letters from {a, b, c}. Concepts: letters, sameness groups (maximal runs of the same letter), group length, first/last position, left/right neighbors.
   Transformations: duplicating or deleting material.

   Two analogy problems:
   1. abc → abcc; cba → ?
      Here, the transformation in the source is duplicating the rightmost letter (c). In the target string cba, duplicating the rightmost letter (a) gives cbaa? But note: the problem is to apply the same rule. However, note that in the source, the rightmost letter is also the rightmost group (since each group is of length 1). Similarly, in cba, each group is of length 1. So duplicating the rightmost letter (a) yields cbaa. Alternatively, duplicating the rightmost group (which is the group of a at the end) also yields cbaa. So they coincide.

   2. abc → abcc; aabbcc → ?
      In the source, abc becomes abcc by duplicating the rightmost letter (c). If we apply the same rule to aabbcc, we duplicate the rightmost letter (c) to get aabbccc.
      But note: in the source, the transformation can also be seen as duplicating the rightmost group (which in abc is a group of one c). In the target aabbcc, the groups are aa, bb, cc. The rightmost group is cc. If we duplicate that group (i.e., duplicate the entire group of c's) we get aabbcccc.

      The two interpretations diverge: 
        - Letter-level: duplicate the rightmost letter -> aabbccc.
        - Group-level: duplicate the rightmost group -> aabbcccc.

   The question asks the student to:
   (i) Give answers to both problems, explain why problem 1 is easy and problem 2 is not, and defend a preferred answer to problem 2 (noting that the shallow answer is not wrong, but arguing for depth).

   (ii) Reconstruct the case for fluid concepts: why fixed predicates and fixed correspondences struggle? Because in the source string (abc) the transformation can be described at either level, but in the target (aabbcc) the levels conflict. The solver must decide whether the correspondence is between letters or between groups. The fluid concepts view says that the concepts (like "rightmost") are not fixed but can slip (from letter to group) under context. Then present the incrementalist rebuttal: we can have a fixed set of predicates and just add a rule that allows remapping of predicates (e.g., when a group-level description fits better, we remap the concept). Then the fluidist reply: this remapping is arbitrary without a deeper pressure for coherence and elegance? Or that the incrementalist approach doesn't capture the context-sensitivity and the emergent conceptualization.

   (iii) Evaluate the reverse-engineering objection: that the domain is designed to show off the strengths of fluid concepts. What evidence from outside the microdomain would bear on the dispute? For example, real-world analogies that show conceptual slippage (like in scientific discovery or everyday language) and whether they can be captured by fixed predicate systems.

   We write the question and then a model answer with a marking scheme.

   Exam Question:

  In this problem, we explore a microdomain of strings of letters from the set {a, b, c}. We will consider the following concepts:

  - **Letters**: The individual characters in the string.
  - **Sameness groups**: Maximal contiguous runs of the same letter. For example, the string "aabbcc" has three sameness groups: "aa", "bb", and "cc".
  - **Group length**: The number of letters in a sameness group.
  - **Position**: The first or last letter (or group) in the string.
  - **Neighbors**: The immediate left or right neighbor of a letter or group (if any).

  We consider transformations that involve duplicating or deleting some part of the string. Specifically, we are interested in analogy problems of the form:

      Source string → Transformed source string
      Target string → ?

  where the transformation applied to the source string should be applied in a corresponding way to the target string.

  Consider the following two problems:

  **Problem 1:**
  Source: `abc` → `abcc`
  Target: `cba` → ?

  **Problem 2:**
  Source: `abc` → `abcc`
  Target: `aabbcc` → ?

  **Tasks:**

  (i) For each problem, provide an answer and explain the reasoning behind your answer. Then, explain why Problem 1 is straightforward while Problem 2 is not. For Problem 2, there are at least two plausible answers: one that duplicates the rightmost letter (yielding `aabbccc`) and one that duplicates the rightmost sameness group (yielding `aabbcccc`). Argue for which of these two answers (or another if you prefer) is more appropriate, appealing to the "depth" of the correspondence and the structure of the string. Note that the answer based on duplicating the rightmost letter is not wrong, but you should explain why the alternative might be more insightful.

  (ii) Explain why a problem-solving system that uses a fixed set of concepts (predicates) and fixed object-to-object correspondences (e.g., mapping letters in the source to letters in the target) would struggle with Problem 2. In particular, discuss how the transformation in the source string could be interpreted at two levels (letter and group) and how the target string forces a choice between these levels. Then, present the case for "fluid concepts": the idea that concepts (like "rightmost") are not fixed but can shift (e.g., from letter to group) under context, driven by pressures for coherence and elegance. Next, present the strongest rebuttal from an incrementalist perspective: that one could extend a fixed-predicate system by adding an operator that remaps predicates (e.g., from letter to group) during the search for correspondences. Finally, give the fluidist reply to this rebuttal.

  (iii) Evaluate the objection that success in microdomains like this one is an artifact of reverse-engineering the domain to match the strengths of a particular cognitive architecture (such as fluid concepts). Discuss what kind of evidence from outside such microdomains (e.g., in real-world cognition) would be relevant to the debate between fluid and more rigid, compositional accounts of concepts.

  ---

  **Model Answer (approx. 600 words):**

  (i) 
  **Problem 1:** The source transformation `abc` → `abcc` duplicates the rightmost letter (c). Applying the same rule to `cba` duplicates its rightmost letter (a) to yield `cbaa`. This is straightforward because in both strings, every group is of length 1, so the rightmost letter is also the rightmost group. Thus, both interpretations (letter-level and group-level) lead to the same result.

  **Problem 2:** The source transformation `abc` → `abcc` can be interpreted in two ways when applied to `aabbcc`:
  - **Letter-level interpretation:** Duplicate the rightmost letter (c) → `aabbccc`.
  - **Group-level interpretation:** Duplicate the rightmost group (cc) → `aabbcccc`.

  Problem 2 is challenging because the two interpretations diverge. I argue that the group-level interpretation (`aabbcccc`) is deeper. In the source, the transformation duplicates the rightmost letter, but note that the source string `abc` has three groups of length 1. The target `aabbcc` has groups of length 2. A deeper correspondence would map the entire group structure: each group in the source (a, b, c) is of length 1, while in the target they are of length 2. The transformation in the source duplicates the last group (which is of length 1). In the target, duplicating the last group (which is of length 2) would yield a group of 4 c's, hence `aabbcccc`. This preserves the group-level structure and the pattern of group lengths. The letter-level answer (`aabbccc`) is not wrong, but it ignores the higher-level structure (groups) that becomes salient in the target.

  (ii) A system with fixed predicates and fixed correspondences (e.g., mapping letters to letters) would struggle with Problem 2 because the source transformation is ambiguous: it can be described as duplicating the last letter or the last group. In the source, both descriptions yield the same result. However, in the target, the two descriptions conflict. Without a mechanism to change the level of description (from letter to group), the system might rigidly apply the letter-level rule and get `aabbccc`, missing the group-level insight. 

  The fluid concepts view argues that the relevant concepts (like "rightmost element") are not fixed but can slip under contextual pressures. For example, in the target string `aabbcc`, the groups are more salient because they are longer, so the concept of "element" might slip from "letter" to "group". This slippage is driven by a pressure for structural coherence: preserving the pattern of group lengths.

  The incrementalist rebuttal is that one can keep a fixed set of predicates but add a heuristic that remaps predicates (e.g., from "letter" to "group") during the search for correspondences. Thus, the system might try both mappings and choose the one that yields a more coherent result.

  The fluidist reply is that this incrementalist approach does not capture the essence of conceptual slippage because the remapping is arbitrary without a deeper, emergent pressure. In fluid concepts, the slippage is not a predefined operation but emerges from the dynamic interaction of multiple pressures (e.g., simplicity, symmetry, and structural consistency). The incrementalist approach would require predefining all possible remappings, which is computationally expensive and lacks the elegance of a system where concepts fluidly adapt to context.

  (iii) The reverse-engineering objection holds that microdomains like this are designed to showcase the strengths of fluid concepts and might not generalize. To evaluate this, we need evidence from real-world cognition. For instance, in scientific analogies (like Rutherford's solar system model of the atom), we see conceptual slippage: the sun corresponds to the nucleus, and planets to electrons, but the concept of "orbiting body" slips from a gravitational to an electromagnetic context. If rigid predicate systems struggle to model such slippage without ad hoc remapping rules, that supports fluid concepts. Conversely, if real-world analogies can be handled by compositional systems with predicate remapping, that supports the incrementalist view. The key evidence would come from cognitive studies of analogy-making, especially cases where people spontaneously shift conceptual levels, and from computational models that can handle such shifts without domain-specific engineering.

  ---

  **Marking Scheme (Total: 25 marks):**

  **(i) Answers and explanations (10 marks):**
  - Problem 1 answer: `cbaa` (or equivalent) and correct reasoning (2 marks).
  - Problem 2: presenting at least two answers (`aabbccc` and `aabbcccc`) (2 marks).
  - Explanation why Problem 1 is easy: because letter and group levels coincide (2 marks).
  - Defense of a preferred answer (for Problem 2) based on depth: arguing for group-level duplication as more structurally coherent (4 marks). 
    - To get full marks here, the student must go beyond correctness and appeal to the structure (e.g., group length pattern). Merely stating the answer is insufficient.

  **(ii) Case for fluid concepts and rebuttal (10 marks):**
  - Explanation of the struggle: fixed predicates and fixed correspondences lead to ambiguity in mapping (2 marks).
  - Presentation of fluid concepts: concepts can slip (e.g., from letter to group) under context (2 marks).
  - Incrementalist rebuttal: adding predicate remapping as an operator in heuristic search (2 marks).
  - Fluidist reply: rebutting that this does not capture the emergent, context-sensitive nature (2 marks).
  - Quality of argumentation and clarity (2 marks).

  **(iii) Evaluation of reverse-engineering and evidence (5 marks):**
  - Articulation of the reverse-engineering objection (1 mark).
  - Discussion of evidence from outside microdomains (e.g., real-world analogies) (2 marks).
  - Evaluation of how such evidence bears on the fluid vs. compositional debate (2 marks).

  **Distinguishing A from B:**

  - **A answer (21-25 marks):** 
    - In (i): Clearly distinguishes the two interpretations in Problem 2 and provides a compelling defense of the group-level answer by appealing to the group structure and the pattern of lengths (not just the existence of groups). Explains why the group-level answer is deeper (coherence with the entire structure).
    - In (ii): Explains the underdetermination in the source and how the target forces a choice. Clearly articulates fluid concepts as context-sensitive and emergent. Presents a strong incrementalist rebuttal (e.g., predicate remapping as an additional operator) and a fluidist reply that highlights the non-arbitrariness and emergent coherence of slippage in fluid systems.
    - In (iii): Provides a nuanced evaluation of the reverse-engineering objection and gives specific examples of real-world evidence (e.g., historical scientific analogies) and how they might support or challenge the accounts.

  - **B answer (16-20 marks):**
    - In (i): Gives correct answers and explains why Problem 1 is easy but the defense for Problem 2 is somewhat superficial (e.g., just states that groups are more important without linking to the pattern).
    - In (ii): Describes the struggle of fixed systems and the fluid concepts alternative, but the rebuttal and reply are underdeveloped.
    - In (iii): Mentions the reverse-engineering objection and the need for outside evidence but without specific examples or a clear link to the debate.
answer: |-
  ### Exam Question: Conceptual Slippage in Letter-String Analogies

  **Domain Introduction:**  
  Consider a microdomain of strings composed of the letters {a, b, c}. Key concepts include:  
  - **Letters**: Individual symbols (e.g., in "aabbcc", the letters are a, a, b, b, c, c).  
  - **Sameness groups**: Maximal contiguous runs of identical letters (e.g., "aabbcc" has three groups: "aa", "bb", "cc").  
  - **Group length**: The number of letters in a group (e.g., "aa" has length 2).  
  - **Positions**: First/leftmost and last/rightmost elements (letters or groups).  
  - **Neighbors**: Immediate left/right adjacent letters or groups.  
  Permitted transformations: **Duplicating** or **deleting** letters/groups.  

  **Analogy Problems:**  
  Apply the same transformation rule from the source to the target:  
  1. **Source**: `abc` → `abcc`  
     **Target**: `cba` → ?  
  2. **Source**: `abc` → `abcc`  
     **Target**: `aabbcc` → ?  

  **Tasks:**  
  **(i)** For each problem:  
  - Provide your answer and reasoning.  
  - Explain why Problem 1 is straightforward, while Problem 2 is ambiguous.  
  - Defend a *preferred* answer for Problem 2. Note that the shallow answer (duplicating the rightmost *letter*) is valid, so your defense must appeal to "depth" (e.g., structural coherence, elegance, or systematicity).  

  **(ii)** Reconstruct the case for *fluid concepts*:  
  - Explain why a system with fixed predicates (e.g., "letter", "group", "rightmost") and fixed object correspondences (e.g., mapping source letters to target letters) struggles with Problem 2. Focus on how the source transformation’s ambiguity (letter vs. group duplication) becomes salient in the target.  
  - Argue how "fluid concepts" resolve this: Concepts (like "rightmost element") are not fixed but *slip* (e.g., from letter to group) under contextual pressures (e.g., symmetry, group salience).  
  - Present the strongest *incrementalist rebuttal*: That predicate remapping (e.g., "treat ‘element’ as groups instead of letters") can be added as a heuristic in a compositional system.  
  - Give the *fluidist reply*: Why is this rebuttal insufficient? (Hint: What makes slippage *non-arbitrary*?)  

  **(iii)** Evaluate the objection:  
  - "Success in such microdomains is artificial because domains are reverse-engineered to favor fluid architectures."  
  - Discuss what *real-world evidence* (outside microdomains) would bear on the dispute between fluid and rigid-compositional accounts of concepts.  

  ---

  ### Model Answer (Approx. 600 words)  
  **(i) Answers and Analysis**  
  For **Problem 1** (`abc → abcc; cba → ?`), the answer is `cbaa`. The transformation duplicates the rightmost *letter* ("c" in `abc` → "cc"), and applying this to `cba` duplicates its rightmost letter ("a") to yield `cbaa`. This is straightforward because each group in both strings is length-1, so duplicating the rightmost letter *coincides* with duplicating the rightmost group.  

  **Problem 2** (`abc → abcc; aabbcc → ?`) is ambiguous:  
  - **Shallow answer**: `aabbccc` (duplicate rightmost *letter*, "c").  
  - **Preferred answer**: `aabbcccc` (duplicate rightmost *group*, "cc" → "cccc").  
  Problem 2 is harder because group lengths differ: `abc` has three length-1 groups, while `aabbcc` has three length-2 groups. The shallow answer applies the literal letter-correspondence, but it ignores the target’s salient group structure. The preferred answer slips "rightmost element" from *letter* to *group*, mapping the source’s rightmost group (length-1 "c") to the target’s rightmost group (length-2 "cc") and duplicating it. This preserves the *pattern* of group lengths (all groups remain equal-length) and reflects a deeper structural analogy: both strings transform their rightmost *constituent unit* (a singleton group in `abc`; a paired group in `aabbcc`).  

  **(ii) Fluid Concepts vs. Incrementalist Rebuttal**  
  A rigid system fails because the source transformation (`abc → abcc`) is *underdetermined*: It could duplicate the rightmost *letter* or *group* (both valid). Fixed correspondences (e.g., source letters → target letters) force the shallow answer (`aabbccc`), but this ignores the target’s group-based symmetry. Nothing in the source specifies whether "element" means letter or group; the target’s structure *creates* the ambiguity.  

  Fluid concepts resolve this via *slippage*: Under pressure for structural coherence, "rightmost element" slips from letter to group in `aabbcc` because groups are more salient (length >1) and duplicating a group maintains uniformity (all groups stay length-2). This slippage is not random but driven by contextual "pressures" (e.g., symmetry, unit homogeneity).  

  The **incrementalist rebuttal** claims slippage can be reduced to predicate remapping: Add operators like "map letter → group" during heuristic search. For example, try both letter/group correspondences and pick the most elegant output.  

  The **fluidist reply** is that this misses the point: Incrementalism treats slippage as a predefined "switch" between fixed predicates, but fluid concepts *emerge* from context. In Problem 2, the decision to slip is not arbitrary—it is *compelled* by the target’s group structure. Incrementalism requires pre-specifying all possible remappings (e.g., letter↔group), but fluid architectures allow concepts to *reconstitute* dynamically (e.g., "element" becomes group-based only when groups are salient).  

  **(iii) Reverse-Engineering and Real-World Evidence**  
  The objection has merit: Microdomains like this are engineered to induce slippage (e.g., variable group lengths). However, this does not invalidate fluidity—it *tests* it. Evidence for fluid concepts beyond microdomains includes:  
  - **Creative analogies**: E.g., in Rutherford’s atom-solar system analogy, "planet" slips from "orbiting body" (in gravity) to "electron" (in electromagnetism), driven by structural pressures (central attraction). Rigid systems fail here without ad hoc remapping.  
  - **Conceptual change**: E.g., in language evolution, "mouse" slips from animal to computer device due to context (shape, function). Cognitive studies show humans prioritize deep structure over fixed predicates.  
  - **Computational limits**: If incrementalism requires combinatorial searches for predicate remappings, but humans solve analogies quickly, fluid architectures (where slippage is emergent) better model efficiency.  

  ---

  ### Marking Scheme (Total: 25 marks)  
  ***(i) Answers and Analysis (10 marks)***  
  - **Problem 1 answer (1 mark)**: `cbaa` (or equivalent).  
  - **Problem 2 answers (2 marks)**: Both `aabbccc` (letter) and `aabbcccc` (group) presented.  
  - **Clarity of reasoning (2 marks)**: Correctly identifies why Problem 1 is unambiguous (coinciding letter/group levels).  
  - **Defense of preferred answer (5 marks)**:  
    - **A (5)**: Argues for `aabbcccc` by appealing to *group-level coherence* (e.g., preserving uniform group lengths, systematic unit mapping). Explicitly contrasts "depth" (structural) vs. "shallow" (literal).  
    - **B (3)**: Prefers `aabbcccc` but only cites group salience (not deeper structural pressures).  

  ***(ii) Fluid Concepts Debate (10 marks)***  
  - **Struggle of rigid systems (3 marks)**: Highlights underdetermination in source and target-induced ambiguity (fixed predicates force arbitrary choices).  
  - **Fluid concepts case (2 marks)**: Explains slippage (letter→group) as context-driven (e.g., group salience, symmetry pressure).  
  - **Incrementalist rebuttal (2 marks)**: Proposes predicate remapping as a heuristic operator.  
  - **Fluidist reply (3 marks)**: Distinguishes emergent slippage (context-compelled) from arbitrary remapping; notes computational/emergence differences.  
    - **A (3)**: Emphasizes non-arbitrary pressures (e.g., "groups become the natural unit due to uniformity").  
    - **B (2)**: Generic critique (e.g., "remapping is inflexible").  

  ***(iii) Reverse-Engineering & Evidence (5 marks)***  
  - **Objection articulation (1 mark)**: Notes domain design bias.  
  - **Evidence discussion (4 marks)**:  
    - **A (4)**: Specific real-world examples (e.g., scientific analogies, language change) and how they test fluidity vs. rigidity.  
    - **B (2)**: Vague allusions to "real-world cognition" without concrete cases.  

  **Grade Boundaries**:  
  - **A (21–25)**: All "A" criteria above. Specifically:  
    - (i) Depth defense *must* cite group-structure preservation.  
    - (ii) Fluidist reply *must* contrast emergent context-sensitivity vs. combinatorial search.  
    - (iii) *Must* provide named real-world evidence (e.g., Rutherford’s atom).  
  - **B (16–20)**: Meets "B" criteria; may omit structural depth in (i) or emergent pressures in (ii).  
  - **C (11–15)**: Superficial analysis; e.g., names slippage but does not defend depth or critique incrementalism.  
  - **D/F (0–10)**: Major omissions (e.g., no defense in (i), ignores rebuttal in (ii)).  

  **Note**: Answers merely naming "Copycat" or "slippage" without applying domain concepts score 0.
