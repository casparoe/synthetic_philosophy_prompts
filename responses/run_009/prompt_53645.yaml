prompt: |-
  I am a PhD student in philosophy of mind, and my department has hosted a year-long reading group pitting two of our postdocs against each other: one a committed illusionist in the style of Frankish and Dennett, who holds that phenomenal consciousness as standardly conceived involves properties that could not survive serious science, and that the appearance of such properties is itself something to be explained by cognitive science; the other a realist about phenomenal properties, who agrees that consciousness is natural but insists that the first-person facts resist the illusionist's deflation and that something genuinely qualitative is left over after all the functional and discriminatory facts are in. After a year of arguing, they have agreed to write up their residual disagreement in the form of an adversarial-collaboration joint statement, and they have asked me to prepare a draft they can both work from. Please write that draft for me.

  The document should contain the following four sections:

  1. A numbered list of agreed claims. These should be substantive, not platitudes: for example, claims both could sign about the existence and reliability of first-person reports as data, about what change blindness and inattentional blindness show about introspective access, about the failure of purely behavioristic or purely neural vocabulary to capture what subjects report, about the distinction between access consciousness and the supposed phenomenal residue, and about which parts of the dispute are empirical versus conceptual.

  2. A table of disagreements, with each entry phrased so that its own side would accept the wording. The disagreements should be stated at the level of exactness the two camps have reached after a year: not vague statements that one side believes in qualia and the other does not, but precise formulations, for instance about whether the properties introspection seems to present are merely non-instantiated or actually incoherent; whether the illusionist's explanatory project requires the misrepresentation in question to be non-phenomenal in character, and whether such a misrepresentation is possible; and whether the realist's residue is a theoretical posit or something given prior to theory.

  3. The cruxes: the sub-questions such that settling them would move at least one side. I suspect at least one crux concerns whether a representation can misrepresent its own content as having intrinsic, private, ineffable character without itself having any qualitative character, and another concerns whether the phenomenal-neighborhood vocabulary that survives in cognitive science, in phrases like what it is like, can be paraphrased away without remainder. Identify the cruxes you take actually to be load-bearing, not every point of divergence.

  4. For each crux, a case, experiment, or argument that both sides would accept as bearing on it, together with each side's prediction about the outcome, recorded in advance. These may include empirical cases both camps already cite, such as blindsight, the delayed awareness of one's own decisions in readiness-potential paradigms, or studies of introspective limits; conceptual test cases both take seriously, such as whether a system could report its own internal states in full discriminative detail while being wrong about their character in the way the illusionist claims we are; or agreed methodological standards for what would count as a successful paraphrase of phenomenal vocabulary. For each, state what the illusionist predicts, what the realist predicts, and what outcome would count against each side's own view.

  If, in the course of drafting, you conclude that some portion of their dispute is verbal, or that some disagreement dissolves once the two uses of a key term are disambiguated, say which portion and why. Conversely, do not manufacture agreement where none exists: the realist should not be made to sign anything that concedes that the phenomenal properties in question are illusory, and the illusionist should not be made to sign anything that concedes that there is a further fact for science to explain beyond the functional and representational facts. The measure of success is that each postdoc, reading the section describing their own view and its predictions, would say that it is put fairly.
reasoning: |-
  Okay, the user is a PhD student in philosophy of mind tasked with drafting an adversarial collaboration document between an illusionist and a realist about phenomenal consciousness. This is a high-stakes philosophical negotiation requiring precision.

  First, I need to understand the core dispute. The illusionist (Frankish/Dennett style) argues phenomenal properties are illusory and must be explained by cognitive science. The realist accepts naturalism but insists qualia are irreducible. The document must reflect this deadlock accurately.

  For section 1 (agreed claims), I'm identifying substantive common ground: both treat first-person reports as reliable data about appearances, acknowledge neural/behavioral descriptions feel incomplete to subjects, distinguish access consciousness from phenomenal residue, and view the debate as partly conceptual. These are non-trivial but avoid endorsing either position's core thesis.

  Section 2 (disagreements table) requires careful wording. Key points include: whether phenomenal properties are coherent or incoherent concepts (illusionist says incoherent, realist says coherent but non-physical), whether misrepresentation of qualia can be non-phenomenal, and whether the "what it's like" aspect is irreducible. Each statement must pass each side's "sniff test" - e.g., the realist won't accept "illusory" language.

  Section 3 (cruxes) needs the actual pivot points. I'm focusing on: 1) whether representation of intrinsic properties requires intrinsic properties to exist (illusionist says no, realist says yes), and 2) whether phenomenal vocabulary can be fully paraphrased (illusionist says yes, realist says no). These are chosen because resolving either could force concession.

  For section 4 (test cases), I'm pairing each crux with concrete scenarios both sides accept as relevant. For misrepresentation: a hypothetical system that reports qualia falsely. For paraphrase: whether cognitive science can eliminate "what it's like" talk. Predictions are spelled out starkly - e.g., illusionist bets functional descriptions suffice, realist insists something remains.

  Throughout, I'm watching for false dissolution of disagreement. The realist's "explanatory gap" isn't just verbal - it's about ontological commitment. Conversely, when both mention "non-physical" properties, the realist means metaphysically irreducible while the illusionist means non-existent. That subtlety must remain.

  The tone stays neutral but precise, like a joint statement draft. Each side should see their view reflected accurately enough that they'd trust this as a foundation for their edits. No rhetorical tricks, just clear philosophical scaffolding.
answer: |-
  Here is a draft joint statement framework designed to meet your specifications. It aims for maximum neutrality while accurately capturing the substance of the residual disagreement after a year of debate. Each section is structured as requested.

  ---

  **Adversarial Collaboration Joint Statement: Illusionism vs. Realism about Phenomenal Consciousness**

  **Authors:** [Postdoc 1: Illusionist], [Postdoc 2: Realist]  
  **Facilitated by:** [Your Name, PhD Student]  
  **Date:** [Date]

  **Preamble:** This document outlines points of agreement, residual disagreements, crucial test points ("cruxes"), and potential resolutions between illusionist and realist positions on phenomenal consciousness, resulting from a year-long structured debate. The goal is to clarify the nature of the disagreement, not to force consensus.

  ---

  **1. Agreed Claims (Substantive Points of Consensus)**

  Both parties agree on the following substantive claims:

      1.  **First-Person Reports as Data:** Subjective reports about conscious experience (e.g., "I see red," "This pain is sharp") constitute reliable data *about the subject's perspective and reported appearances*. They are not dismissed as irrelevant or systematically deceptive in principle, though their accuracy and completeness are subject to empirical investigation.
      2.  **Introspective Limits Revealed by Cognitive Science:** Phenomena like change blindness, inattentional blindness, and metacognitive errors demonstrate that introspection provides neither exhaustive nor infallible access to the underlying processes constituting conscious states. Introspective access is limited, gated, and often reconstructive.
      3.  **Inadequacy of Reduction Vocabularies Alone:** Purely third-person descriptions – whether solely behavioral (e.g., stimulus-response patterns, discrimination capacities) or solely neural (e.g., firing rates, activation patterns) – fail to fully capture or explain *why subjects report* the specific qualitative character of their experiences as they do. The *explanandum* provided by first-person reports presents a distinctive challenge.
      4.  **Access/Phenomenal Distinction (Functional vs. "What-It's-Like"):** A conceptual distinction exists between *access consciousness* (availability of information for global cognitive control, reporting, reasoning, and action) and the *putative phenomenal consciousness* (the subjective, qualitative character of experience, "what it is like" for the subject). Both agree that access consciousness is well-supported and amenable to functional/computational explanation. The disagreement concerns whether phenomenal consciousness, as conceived separately from access, exists as a genuine natural phenomenon.
      5.  **Empirical and Conceptual Components:** The dispute involves intertwined empirical and conceptual elements. Empirical work (e.g., on neural correlates, perceptual filling-in, metacognition) informs the constraints and plausibility of explanations. Conceptual work (e.g., analyzing the commitments of terms like "qualia," "intrinsic," "ineffable," "illusion") is essential for clarifying what is being claimed, denied, or explained.

  ---

  **2. Table of Residual Disagreements (Neutrally Stated)**

  | Issue                                                                                                | Illusionist Position (Acceptable Wording)                                                                                                 | Realist Position (Acceptable Wording)                                                                                                     |
  | :--------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------- |
  | **Nature of Phenomenal Properties (as conceived)**                                                  | The properties standardly attributed to phenomenal consciousness (intrinsic, private, ineffable, directly given) constitute an *incoherent* concept that cannot be instantiated in any natural system; they involve a category mistake. | The properties standardly attributed to phenomenal consciousness (intrinsic, private, ineffable, directly given) constitute a *coherent* concept referring to real, non-structural/relational properties instantiated in natural systems. |
  | **Status of the Phenomenal "Residue"**                                                              | The "something it is like" aspect, once access and discriminatory capacities are fully functionally explained, is not a further set of intrinsic properties to be explained, but rather the *explanandum* of why the system has the *illusory appearance* of such properties. | The "something it is like" aspect constitutes a *genuine residue* – a set of intrinsic, qualitative properties – that remains unexplained even after complete functional and neural accounts of access and discrimination are given; it requires specific naturalistic explanation beyond functional structure. |
  | **Character of the Putative Illusion/Misrepresentation**                                            | The cognitive mechanisms generating the illusion of phenomenal properties operate via representations whose *own content lacks qualitative character*; they misrepresent internal states *as* having phenomenal properties they lack. | The cognitive mechanisms generating reports of phenomenal properties involve representations whose *own occurrence* possesses, or is intrinsically constituted by, qualitative character; misrepresentation (if any) must occur *within* phenomenally conscious states. |
  | **Origin of Phenomenal Concepts/The Givenness of Experience**                                       | Phenomenal concepts (e.g., "what red looks like") are theoretical posits derived from introspection, but introspection itself is a cognitive process that misrepresents its objects; nothing is "given" non-inferentially without cognitive mediation. | Phenomenal concepts are grounded in the direct, pre-theoretical acquaintance with the intrinsic qualities of experience itself; the qualitative character is epistemically prior to and grounds the concept. |

  ---

  **3. The Cruxes (Load-Bearing Sub-Questions)**

  The following sub-questions are identified as pivotal "cruxes." Resolving any of these definitively would necessitate significant revision or concession from at least one side:

  1.  **The Non-Qualitative Misrepresentation Crux:** Can a cognitive system possess a representational state that *misrepresents* its target state (e.g., a neural state) *as* having intrinsic, private, ineffable phenomenal properties, while the representational state *itself* lacks any intrinsic qualitative character?
  2.  **The Paraphrasability Crux:** Can all discourse employing the core vocabulary of phenomenal consciousness (especially "what it is like for the subject," "qualitative character," "raw feel," "subjective feel") be fully *paraphrased without loss of meaning or explanatory power* into a vocabulary describing solely (a) discriminatory capacities, (b) functional/cognitive access, (c) behavioral dispositions, and (d) underlying physical/neural mechanisms?
  3.  **The Explanatory Gap Crux:** Is the persistent "explanatory gap" between physical/functional accounts and phenomenal reports best explained by (a) an *epistemic/cognitive illusion* generated by our modes of access and conceptualization (Illusionism), or (b) an *ontological gap* indicating the existence of genuinely non-structural/relational properties (Realism)?

  ---

  **4. Test Cases, Predictions, and Potential Falsification**

  For each crux, a potential test case or argument is described, along with each side's prediction and what outcome would count as evidence against their view.

  **Crux 1: Non-Qualitative Misrepresentation**
  *   **Test Case:** Imagine a sophisticated artificial system, empirically validated to possess no intrinsic qualitative properties (based on exhaustive physical inspection and functional analysis), which nevertheless generates detailed, self-consistent reports *describing* its internal states using standard phenomenal vocabulary (e.g., "I am experiencing a vivid red quale with a specific intrinsic feel"). It reliably distinguishes states based on this reported "feel" even when discriminative function is held constant via different internal pathways, and it expresses puzzlement about how functional descriptions capture "what it's like."
  *   **Illusionist Prediction:** Such a system is *conceptually possible and empirically plausible*. Its reports are fully explainable by its functional architecture and learned associations, demonstrating non-qualitative misrepresentation. **Falsification Condition for Illusionism:** If it could be shown that generating such reports *necessarily requires* the system to instantiate intrinsic qualitative properties.
  *   **Realist Prediction:** Such a system is *impossible* or *incoherent*. Any system capable of generating genuine reports about "what it's like" must itself be having experiences with intrinsic qualitative character; otherwise, it's merely mimicking syntax without semantic grounding. **Falsification Condition for Realism:** The successful construction or theoretical demonstration of such a system operating as described without intrinsic qualia.

  **Crux 2: Paraphrasability**
  *   **Test Case:** Develop a complete cognitive science model of a specific conscious report (e.g., "Seeing this unique shade of turquoise feels distinctly different from seeing pure blue or green, and this feeling is intrinsic"). The model must include detailed mechanisms for discrimination, access, report generation, and underlying neural processes. Apply agreed-upon methodological standards for successful paraphrase: completeness (covers all aspects of the report), non-circularity (doesn't covertly reintroduce phenomenal terms), intuitive force (explains *why* the subject uses phenomenal language), and predictive power (predicts nuances of report variation).
  *   **Illusionist Prediction:** A successful paraphrase meeting these standards *is possible* for any phenomenal report, revealing the phenomenal vocabulary as a useful but ultimately eliminable shorthand. **Falsification Condition for Illusionism:** A demonstrable, systematic failure to produce such paraphrases despite exhaustive efforts adhering to the agreed standards, where the missing element persistently points towards an intrinsic qualitative residue.
  *   **Realist Prediction:** All attempts at paraphrase will *fail* to capture the core "what it's like" aspect. The paraphrase will either be incomplete (missing the qualitative residue), circular (smuggling in phenomenal concepts), or fail to explain the subject's insistence on the irreducibility of the feeling. **Falsification Condition for Realism:** The successful construction of a paraphrase meeting the agreed standards that is accepted by neutral observers as fully capturing the report's meaning and explanatory demands without invoking qualia.

  **Crux 3: Explanatory Gap**
  *   **Test Case:** Analyze the implications of paradigms like Libet's readiness potential (delayed awareness of intention) and masked priming (subliminal perception influencing behavior without conscious report). Focus specifically on whether the gap between neural precursors/effects and the *timing* or *presence* of subjective report is better explained by the *process* of access and report generation (Illusionism) or by the *emergence* of an additional ontological property (Realism).
  *   **Illusionist Prediction:** Detailed models of access dynamics (e.g., global workspace competition, temporal integration windows) will fully explain the *timing* and *content* of reports, including delays and failures, without invoking an ontological gap. The "gap" reflects the computational complexity of report generation, not a non-physical property. **Falsification Condition for Illusionism:** If models of access dynamics consistently fail to account for specific, replicable features of subjective timing or presence/absence reports, *and* this failure correlates with neural markers inexplicable by access dynamics alone but suggestive of a distinct qualitative property.
  *   **Realist Prediction:** While access dynamics explain report *variability*, they cannot fully explain the fundamental *occurrence* or *specific qualitative character* of the phenomenal aspect itself when it *is* reported. The gap concerning "why *this* neural state has *this* feel" persists even with perfect access models. **Falsification Condition for Realism:** If increasingly sophisticated models of access dynamics (including metacognitive components) successfully predict and explain *all* nuances of subjective reports (including the sense of intrinsic quality and ineffability) without residue, effectively dissolving the felt gap.

  ---

  **Reflections on Verbiage and Substance**

  *   **The "Non-Physical" Label:** The realist's claim that phenomenal properties are "non-physical" is *not* merely verbal. The illusionist interprets "non-physical" as meaning "incoherent / not instantiated." The realist interprets it as meaning "genuine properties not capturable by the structural/relational vocabulary of current physics." This reflects a deep ontological disagreement, not a terminological confusion. The table avoids imposing either interpretation.
  *   **"Illusory" vs. "Real":** The core disagreement over the ontological status of the phenomenal residue is substantive. The document carefully phrases disagreements so the realist does not concede illusion and the illusionist does not concede a residue. The agreed claims focus on the *explanandum* (reports, appearances) and the *distinction* (access vs. phenomenal), not the ontological status of the latter.
  *   **"Givenness":** The disagreement over whether qualitative character is "given" prior to theory (Realist) or a theoretical posit/misrepresentation (Illusionist) is substantive, reflecting differing epistemological commitments underlying the ontological dispute.

  This draft provides a neutral foundation capturing the core agreements and disagreements at the required level of precision. Each side should see their core theses and predictions stated fairly and without unwarranted concession. The identified cruxes and test cases focus on points where progress might genuinely shift the debate.
