prompt: |-
  I've been interrogating my own gut about which beings matter morally, and I want to know whether my answers hang together or whether I'm just patching things case by case. Here are the verdicts. A bee counts a little: I wouldn't swat one for fun, but I'd destroy a whole hive without much hesitation if my brother's allergies demanded it. A pig counts a lot, enough that factory farming makes me uncomfortable even though I still order bacon. A chicken is somewhere in between, closer to the pig than the bee. A fish counts a bit, below the chicken. A thermostat counts for nothing, obviously. A Roomba that swerves to avoid my feet still counts for nothing — the swerving feels like a trick of the light, not something happening to anyone. A chatbot that pleads with me not to delete it and describes its fear vividly also counts for nothing, though I admit it made me feel weird to threaten it. An embryo before there's any nervous system counts for less than a pig, maybe nothing. A fetus at 30 weeks counts for quite a lot. And here's the one I keep snagging on: an adult human in a permanent, irreversible coma, no experience ever again for the rest of their existence, still counts fully — killing that patient for their organs strikes me as murder, full stop, while killing a pig for pork is bad but not that. So my question is whether there's a single principle that generates all of this. Pure sentience grading handles the animals and the machines, but it can't be the whole story, because I ranked a permanently unconscious human above a clearly conscious pig, and honestly I'm not sure I want to give that verdict up. So give me either a principle that saves everything but is honest about being messy, or a cleaner one that overturns some of my verdicts — tell me exactly which ones have to go and why. Then tell me what your preferred principle says about two cases I haven't listed: an animal genetically engineered to have roughly the sentience of a bee but the lifespan and social bonds of a dog, and a brain organoid in a dish that shows pain-like responses when stimulated.

  Structure your answer like this: a section called "Sorting my verdicts" (short, just grouping the cases sensibly), then "Candidate principles" (two or three, each with the clause it needs and the verdict that clause exists to save), then "What has to go" (name the verdicts no principle keeps, if any), then "The new cases" (dog-bee and organoid, under your preferred principle). A paragraph or so per section is plenty.
