answer: |-
  Here is a draft joint statement reflecting the agreed-upon common ground, precise points of disagreement, and identified cruxes, written as continuous prose for signature:

  We, the undersigned, agree on the following foundational points concerning P.F. Strawson's concept of the reactive attitudes and their place in moral life. Both parties affirm that the reactive attitudes—such as resentment, indignation, gratitude, and forgiveness—are deeply embedded features of ordinary human interpersonal relationships. These attitudes, we concur, are typically responsive to the perceived "quality of will" manifested in an agent's actions towards others. We understand "quality of will" broadly to encompass the intentions, regard, carelessness, or indifference an agent displays towards others’ legitimate expectations and moral standing. Consequently, we agree that these attitudes track something morally significant about the agent and the interaction. Furthermore, we share the view that in paradigmatic cases of wrongdoing—for instance, when an ordinary, non-manipulated agent, fully aware of the nature and wrongness of their action, deliberately causes significant harm to another—the reactive attitudes of resentment or indignation naturally arise and are generally considered appropriate within our existing practices. Neither party disputes the phenomenological reality or the current social ubiquity of these attitudes.

  Where we diverge is in our assessment of the reactive attitudes' ultimate justifiability and their necessity within a reflective moral framework. The first view holds that the reactive attitudes are constitutive of the very practices that define our interpersonal relationships and moral community. On this view, questions about the "desert" of blame or praise only make sense *within* this framework of reactive engagement. Challenging the framework itself, perhaps on grounds of determinism or causal explanations of agency, is seen as fundamentally misguided or irrelevant to the practice-bound notions of responsibility and desert we operate with. The attitudes are not merely useful features but are essential expressions of holding one another accountable as members of the moral community; they embody a distinctive form of moral address and demand that cannot be reduced to or replaced by other stances without a significant loss of meaning and function.

  The second view maintains that, while the reactive attitudes are deeply ingrained, they ultimately depend on a notion of "basic desert" that is incompatible with a fully naturalistic understanding of human agency—specifically, the idea that agents could be ultimately responsible for their actions in such a way as to deserve reactive responses like resentment or indignation purely as a matter of retrospective justice, irrespective of future consequences. This view argues that we possess compelling reasons, grounded in considerations about determinism, causation, and the origins of character and action, to *revise* our practices. It proposes replacing the "hot" reactive attitudes (e.g., resentment, indignation, moral anger) with "cooler" analogues focused on forward-looking goals. These substitutes—such as sorrow or sadness at the wrong done, disappointment, regret, a resolve to communicate the reasons for moral protest, and a hopeful commitment to the offender’s moral reform and the repair of relationships—are argued to capture the morally significant core of our responses (namely, the recognition of wrong and the commitment to values) without relying on problematic ideas of basic desert. This revision is presented not as an abolition of moral concern, but as an ethically preferable alternative fostering clearer communication and reducing harm, while still upholding the distinction between justification, excuse, and no excuse.

  Our continuing disagreement centers on several specific cruxes, the resolution of which would significantly impact the debate. The first crux concerns the *functional indispensability* of the hot reactive attitudes. The constitutive view predicts that resentment and indignation perform a unique communicative and normative function: they express a distinctive kind of moral protest and demand for recognition that cannot be fully replicated by sorrow, disappointment, or hope alone. These hot attitudes, it is claimed, embody the stance of holding the offender *answerable* in a way that cooler substitutes fail to capture, thereby sustaining the depth and texture of interpersonal recognition and mutual accountability essential to relationships among responsible agents. The revisionist view predicts, conversely, that all morally relevant functions—communicating wrongness, demanding acknowledgment, motivating reform, protecting values—can be effectively served by the proposed cooler substitutes. It holds that the intensity of the hot attitudes often obscures communication and undermines reform, and that their expressive power, while culturally familiar, is not fundamentally necessary for upholding moral norms or relationships.

  The second crux involves the *resilience of resentment under reflection*. Consider a specific case: An individual suffers a significant, deliberate harm from another person—a betrayal by a close friend, for example. Years later, the victim gains access to a comprehensive, high-quality biography of the wrongdoer. This biography provides a detailed, empathetic causal narrative of the factors shaping the wrongdoer’s character and actions leading to the harm—their upbringing, formative experiences, psychological vulnerabilities, and the specific pressures operating at the time—rendering the harmful action deeply intelligible without thereby presenting it as excused or justified. The question is whether engaging deeply with this narrative reliably attenuates the victim's resentment towards the wrongdoer. The revisionist view predicts that yes, such deep causal understanding *does* reliably tend to diminish resentment. It sees this attenuation as evidence supporting the revisionist program: demonstrating that reflection on the causes of action, even absent excuses, naturally moves us towards the cooler attitudes and away from the retributive core of resentment. The constitutive view predicts that while such understanding *may* sometimes lessen resentment, this is not the reliable outcome the revisionist expects. When attenuation occurs, it argues, it is typically because the narrative alters the perception of the *quality of will* displayed—perhaps revealing greater internal conflict, ambivalence, or diminished capacity for regard than initially perceived—rather than undermining the very framework of holding responsible. It maintains that resentment can and often does persist stably even with full comprehension of the causal history, precisely because the perception of ill will remains salient.

  A third crux pertains to the interpretation of "desert". It appears that part of our disagreement is terminological concerning this term. The constitutive view uses "desert" to describe what is internal to the practice of holding responsible via reactive attitudes: within that framework, an agent who displays ill will *deserves* resentment in the sense that resentment is the fitting response. The revisionist view reserves "desert" (especially "basic desert") for a specific, foundational, and ultimately untenable form of non-consequentialist, ultimate retributive worthiness that they argue underlies the reactive attitudes. Consequently, the revisionist denies that the constitutive view's practice-bound notion counts as "desert" in the relevant sense for justifying blame. This difference in terminology reflects a deeper disagreement about the necessity and nature of the justification required for our moral practices.

  We present this statement as a precise map of our agreement and persisting disagreement, acknowledging that progress hinges on resolving these identified cruxes through further philosophical investigation, empirical inquiry where relevant, and continued dialogue. We commit to engaging with these cruxes, including the specific predictions outlined regarding the biography case.

  ---

  **Key features addressed in this draft:**

  1.  **Common Ground:** Explicitly stated shared premises on tracking quality of will, the nature of ordinary cases, and the embeddedness of the attitudes.
  2.  **Precise Disagreements:** Each view's core stance is articulated neutrally. The Strawsonian view is described as constitutive and practice-bound; the Pereboom-inspired view is described as revisionist, rejecting basic desert, and proposing substitutes. Key terms like "constitutive," "basic desert," "revision," and "replace/substitute" are used carefully to reflect each side's self-understanding.
  3.  **Cruxes Defined:** Three cruxes identified:
      *   Functional Indispensability: Can cool substitutes do the work?
      *   Resilience of Resentment: Does deep causal understanding *reliably* attenuate it? (Predictions made using the biography case).
      *   The Meaning of "Desert": Diagnosed as partly verbal/terminological.
  4.  **The Biography Case:** Explicitly integrated as a test case for the second crux, with clear, contrasting predictions committed to by each side.
  5.  **No Capitulation:** The text avoids language implying either side has conceded key points. The revisionist isn't portrayed as wanting to abolish accountability, and the Strawsonian isn't portrayed as ignoring skepticism.
  6.  **Format:** Continuous prose. Differences are spelled out using phrases like "The first view holds...", "The second view maintains...", "The constitutive view predicts...", "The revisionist view predicts...".
  7.  **Substance & Conciseness:** Focuses on the core philosophical claims and disagreements without unnecessary padding, suitable for senior scholars putting their names to it.
