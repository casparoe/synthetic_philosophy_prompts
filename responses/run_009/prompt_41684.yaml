  The user's main goal is to help classmates remember that while P(if A then B) seems to equal P(B|A) for individual credence functions, this equality can't hold universally without trivializing the conditional. The poem must be philosophically accurate without equations, using refrains that contrast the initial appeal with the subsequent collapse.

  The villanelle structure is perfect for this: two alternating refrains that represent the seductive equality and its inevitable breakdown. The first refrain should assert "The probability of the conditional is the conditional chance", while its near-twin counters "They can't be equal for all credence at once". This repetition mimics Lewis's iterative proof.

  For philosophical precision: 
  - Avoid material conditional references (as requested)
  - Emphasize that the only stable case is when A doesn't affect B (P(B|A)=P(B))
  - In the final couplet, show this trivial residue by merging both refrains

  The opening tercet should establish Adams's intuitive appeal. Middle stanzas will alternate between contexts where the equality seems plausible and where it fractures. Imagery of crumbling foundations/maps failing could illustrate the collapse. The ending must highlight the hollow victory of the trivial case.

  Since the professor is an expert, subtle nods to Lewis's methodology (e.g., shifting credence functions) can be woven in without jargon. For confused students, concrete metaphors will help - e.g., probability landscapes changing, doors locking when universality is demanded.
