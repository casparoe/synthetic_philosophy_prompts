  2.  **Form Doing the Work:**
      *   The villanelle's cyclical return of the refrains mirrors the structure of Lewis's proof. Adams's Thesis (Refrain 1) is repeatedly asserted as intuitive and seemingly workable *in a specific context* (lines like "For one belief, the numbers seem to leap").
      *   Lewis's challenge (Refrain 2) consistently breaks that assertion when universality ("for *every* stance," "through *all* the landscapes steep") is demanded.
