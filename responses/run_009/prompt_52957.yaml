answer: |-
  ## The Uninvited Guest's Bill: Why Conventions Bind Even When You're Passing Through

  The friction between you and your roommate exposes a profound tension in social life: are the unspoken rules governing queues, gratuities, and street crossings genuine moral demands, or merely inconvenient social facts enforced by disapproval? While the "when in Rome" principle offers pragmatic guidance, it dodges the core ethical question, particularly for the one-shot visitor – the tourist who will never return, never face reciprocal judgment, and whose actions seem to leave no lasting footprint. To settle this, we must dissect the nature of conventional obligations, distinguishing between those causing direct harm and those governing coordination, and confront the visitor's unique position. My verdict: **many everyday conventions, especially those preventing direct harm or exploitation within established cooperative schemes, impose genuine moral obligations even on temporary visitors, grounded in fairness and the prevention of free-riding, not merely social pressure. However, truly victimless coordination conventions (like jaywalking on an empty street) lack inherent moral weight.**

  The standard justifications for conventions – reciprocal benefit, repeated interaction, and generalized cooperation – indeed seem to weaken for the fleeting tourist. If you'll never dine at that restaurant again, never interact with that server, and never rely on the tipping system yourself, where's the reciprocity? If you vanish after one week, where's the incentive based on future interactions? This apparent evaporation of self-interested reasons tempts us toward a purely social-fact view: tipping is just "what's done," enforced by awkwardness or judgment, not morality. The tourist, then, could rationally skip the tip, suffering only a fleeting social penalty they'll never feel.

  But this conclusion unravels upon examining conventions that prevent direct, tangible harm within a specific cooperative context. Tipping in the US is the prime example. Here, the convention isn't merely coordination; it's a *de facto* wage system. Servers are legally paid a sub-minimum wage *because* the tipping convention exists. Their livelihood *depends* on patrons fulfilling this social expectation. The tourist partakes in the service – enjoying food, atmosphere, and labor priced artificially low *under the explicit assumption* the tip will cover the gap. Refusing to tip in this context isn't merely breaking a coordination rule; it's **free-riding on a system that exploits the server's dependence.** The tourist receives the full benefit of the service (the meal priced low *because* tips are expected) while deliberately withholding the crucial component that makes the system function for the worker. This is a direct harm: the server loses expected income for labor rendered.

  The moral obligation here stems from **fairness and non-exploitation,** not reciprocity with the *individual* server or the *expectation* of future benefit. The tourist willingly enters a pre-existing cooperative scheme (the restaurant service model) built on mutual, though often unspoken, understandings. By accepting the service under its established terms (low menu prices coupled with tipping), the tourist implicitly agrees to its rules. Violating those rules to gain a personal advantage (a cheaper meal) at the specific expense of the vulnerable party (the server relying on tips) is unfair exploitation. Kant's principle of universalizability applies starkly: if *every* tourist (or every patron) skipped the tip, the system would collapse, servers would be destitute, and the service model couldn't exist. The tourist's action, multiplied, undermines the very practice they benefit from in that singular instance. Their obligation isn't born of fear of judgment; it's born of participating in and benefiting from a system whose functioning relies on widespread adherence, and refusing to pay their fair share within it harms a specific individual.

  This distinguishes tipping sharply from conventions like queueing or jaywalking rules *in their purely coordinative aspects*. Queueing prevents chaos and conflict; it's a fair way to allocate access to a scarce resource (service, entry). Breaking an orderly queue typically causes direct frustration, delay, and a sense of injustice to those bypassed – a harm to specific individuals expecting fair treatment based on the established order. The tourist who jumps the queue directly harms those behind them by stealing their place.

  Jaywalking, however, presents our second category: the **truly victimless coordination convention.** Imagine crossing a completely deserted street at 3 AM in a country where jaywalking is strictly forbidden but carries no automated penalty, and no one is around to witness or be affected. The law exists for safety and traffic flow *when cars and pedestrians are present*. In this specific, hypothetical moment, violating it causes no direct harm to any specific person. There's no endangered driver, no pedestrian confused by your action, no erosion of a system anyone is currently relying on for safety. The obligation here feels different. It seems primarily legal or conventional, grounded in the *general* need for predictable rules to prevent harm *when conditions are risky*. Violating it *when harm is genuinely impossible* lacks the direct exploitative character of skipping a tip or queue-jumping. The obligation, in this precise scenario, dissolves into a social fact or legal requirement – you shouldn't do it because it's illegal or might offend an unseen local, but the *moral* core is absent without potential or actual harm. It becomes pure coordination, and violating it *only* when conditions make harm impossible isn't inherently immoral, though it may be irrational (if you misjudge the emptiness) or illegal.

  **What does this mean for the local?** Does the tourist's obligation reveal the local's duty as mere habit? Emphatically no. The local server *also* relies on the tipping system. The local patron *also* benefits from the artificially low prices and participates in the same cooperative scheme. Their obligation is identically grounded in fairness and preventing exploitation of the server. Habit and fear of judgment might be the *psychological mechanism* ensuring compliance, but the *moral foundation* – preventing harm and free-riding within a system one benefits from – remains solid. The local's repeated interactions don't change the core moral wrong of exploiting the system in a single instance; it merely provides more opportunities and stronger social reinforcement. The tourist scenario strips away the reinforcement, revealing the underlying moral obligation in its purest, most demanding form: fairness requires participation even when no one is watching and no future penalty looms.

  **Therefore, the verdict:** The one-week tourist *does* have a moral obligation to tip in the US system. Their participation in the service, benefiting from its low-price structure predicated on tipping, creates a duty of fairness to the server whose livelihood depends on it. Skipping the tip is free-riding and exploits the worker. This obligation stems from preventing direct harm within a specific cooperative scheme, not reciprocity or future self-interest. Conversely, violating a purely coordinative convention like jaywalking on a demonstrably empty street causes no harm and thus imposes no *moral* obligation, though it may remain illegal or imprudent. The local's obligation in cases like tipping shares the same moral core – fairness and non-exploitation – even if reinforced by habit and social pressure. Conventions gain genuine moral weight not from their status as norms, but when their violation within the context of participation causes tangible harm or constitutes unfair exploitation of a system others sustain. The tourist isn't absolved by transience; their fleeting presence still binds them to the demands of fairness within the systems they choose to use.
