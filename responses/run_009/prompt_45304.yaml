prompt: |-
  I've been arguing with my brother-in-law about whether you can actually write down moral rules, and I've noticed something in my own head that I can't find a word for, so I want you to act as a professional ethicist who's read everything and help me figure out if this thing has a name. Here's the thing. When I try to justify a moral judgement I've made, I point at features of the situation — she promised, he was drunk, nobody got hurt, she did it for money. And I noticed that the same feature doesn't always pull the same direction. Normally "she promised" is the whole reason she should do the thing. But my friend promised her ex, back when they were together and he was threatening to hurt himself, that she'd never move cities — and now that fact seems to point AGAINST feeling bound, not just to count for nothing. Or: someone doing you a favor because he's being paid usually makes it less warm, less of a favor, but a surgeon being paid is just... correct, it's how it should be. It's like the feature's meaning depends on whatever else is in the situation, instead of having a fixed sign.

  And here's why I don't think this is just "rules have exceptions." My brother-in-law keeps saying: fine, so the rule is "keep your promises, unless X, unless Y." But when we actually go through cases, the exceptions don't behave like a list. Sometimes "she promised under duress" removes the promise's force, sometimes (a coerced confession? a deal signed at gunpoint?) the coercion is the whole story, and sometimes a promise made under weird pressure still seems to count because of what happened after — the person relied on it for years or whatever. It feels less like a rule with carve-outs and more like the colors in a painting, where adding one new color changes what all the others look like. I can't seem to find a bottom layer of features that ALWAYS count the same way no matter what else is present. Maybe there is one and I'm just not seeing it, but I've tried.

  So: is there an established name for this exact configuration — where the reasons seem to get their direction from the whole setup rather than each carrying their own? If there is, tell me what it's called, and also what the nearest neighbor concepts are and how they differ, because I want the precise version, not just a label. If nothing fits exactly, I'd rather you said so and coined a term with a definition and some edge cases than just slapped the closest famous name on it. Please actually think before answering — maybe brainstorm a few candidate concepts first and check each one against my examples — because my brother-in-law is a lawyer and he WILL find the loophole. Also if theres a name for the opposite view (that features do carry fixed weight, like chess pieces) I'd like that too, since that seems to be what he actually believes and it would help to know what I'm arguing against.
reasoning: |-
  Okay, the user is having a debate about moral rules with their brother-in-law and has noticed that moral features don't always point in the same direction—they change based on context. They want to know if there's a term for this phenomenon. 

  First, I need to unpack their core observation: moral reasons aren't atomic units with fixed weights. Features like "she promised" can sometimes create obligations, sometimes not, or even count against an obligation depending on the whole situation. They explicitly reject the "rules with exceptions" model because exceptions don't behave like tidy lists—they interact dynamically. Their painting analogy (colors changing in relation to each other) is vivid and important. 

  The user's frustration with their brother-in-law's "lawyerly" approach suggests they're dealing with someone who thinks in discrete rules and exceptions. So I should contrast their view with atomistic deontology or rigid rule-utilitarianism. 

  Now, scanning ethical frameworks:  
  - **Particularism** (Dancy) fits perfectly—it denies invariant reasons and emphasizes holism. But I must check if it fully matches their examples. The promise-under-duress variation and surgeon payment cases are textbook particularist illustrations.  
  - **Holism in the theory of reasons** is the broader meta-ethical label.  
  - **Wittgensteinian family resemblances** might help explain why we group cases without fixed rules.  
  - **Defeasibility theories** (from logic/law) get close but feel too mechanical for their description.  
  - **Contextualism** is adjacent but vaguer.  

  Crucially, their examples resist reduction:  
  - Promise under duress sometimes voids obligation (ex's threat), sometimes doesn't (coerced confession), sometimes transforms it (years of reliance). This isn't just "duress = exception"—it's reason interaction.  
  - Paid surgeon vs. paid friend shows how the same feature (payment) changes moral valence contextually.  

  The brother-in-law likely subscribes to **invariantism** (reasons always carry fixed valence) or **atomism**. Naming this opposition will help the user.  

  I should also flag nearby-but-distinct concepts:  
  - *Moral pluralism* (multiple principles) ≠ holism.  
  - *Situational ethics* focuses on love/agape, not reason interaction.  
  - *Casuistry* uses cases but often presumes stable principles.  

  Since they want precision, I'll define "moral holism about reasons" clearly and distinguish it from similar ideas. Their skepticism about "bottom layer" features suggests sympathy for anti-foundationalism—worth noting but not overcomplicating.  

  ...and I'll offer to coin "context-valence entanglement" if they want a new term, but Dancy's particularism is literally designed for this. Must emphasize it's not "exceptions" but organic interdependence. The chess pieces vs. painting contrast is perfect—I'll reuse that.
answer: |-
  Your observation is razor-sharp and cuts to the heart of a major debate in moral philosophy. What you're describing has a **precise name: Moral Particularism** (most associated with Jonathan Dancy). Let's break this down systematically, following your request for exactness, distinctions, and contrasts.

  ### The Core Concept: Moral Particularism (Holism of Reasons)
  1.  **Definition:** Moral particularism is the view that the moral relevance and *valence* (positive/negative direction) of a feature (like "made a promise," "was paid," "caused harm") **are not invariant**. Instead, they depend entirely on the context of the whole situation. A feature that is a reason *for* an action in one context can be a reason *against* it, or no reason at all, in another context. The moral significance emerges from the holistic interplay of all relevant features.
  2.  **Why "Particularism"?** It emphasizes that moral judgment is fundamentally tied to the *particulars* of the situation, resisting the idea that we can always apply general rules or principles derived from abstracting across cases.
  3.  **Why "Holism of Reasons"?** This is the specific thesis within particularism that directly addresses your core insight: the contribution a feature makes to the overall moral judgment is *holistic* – it is determined by its relationships with *all other features present*. Adding or removing a feature can fundamentally alter the contribution of the others. Your painting analogy is perfect: adding yellow next to blue makes green, changing the perception of both colors; adding "duress" to "promise" can invert the moral force of the promise.
  4.  **Key Proponent:** Jonathan Dancy ("Ethics Without Principles" is central).

  ### Why This Fits Your Examples Perfectly
  *   **Promise Under Duress:**
      *   *Normal Context:* "She promised" = Strong reason *for* doing the thing (supports fidelity).
      *   *Your Friend's Context:* "She promised *under emotional blackmail/threat of self-harm*" = This context transforms "promise" from a reason *for* keeping it into a reason *against* feeling bound by it (supports autonomy, non-exploitation). The *same feature* ("promise") gets its valence from the context (duress).
      *   *Coerced Confession Context:* "He promised *at gunpoint*" = The coercion isn't just an exception; it *defines* the feature. The "promise" here isn't a positive reason weakened; its *nature* is fundamentally altered. The valence of "coercion" itself dominates and is negative. Holism explains why the *combination* has a different moral quality than either feature alone.
      *   *Reliance Context:* "Promised under pressure, *but the other party reasonably relied on it for years*" = The *new feature* (reliance) interacts with the original features. The negative valence potentially introduced by duress might be *overcome* or *transformed* by the positive valence of preventing harm through reliance. The features dynamically interact.
  *   **Being Paid:**
      *   *Friend Doing a Favor:* "He was paid" = Usually a reason *against* viewing it as a genuine favor (diminishes warmth, altruism). Valence: Negative in this context.
      *   *Surgeon Performing Surgery:* "She was paid" = A reason *for* viewing it as correct, professional, expected. Valence: Neutral or even Positive (enabling the service) in this context. The *nature of the relationship and act* (professional service vs. personal favor) completely changes the valence of "being paid."

  ### Why "Rules with Exceptions" (Your Brother-in-Law's View) is Different & Problematic
  1.  **Atomism/Invariantism of Reasons:** This is the opposing view. It holds that moral features *do* carry a fixed, invariant valence (e.g., "promise-making" is *always* a pro-tanto reason *for* keeping the promise; "causing harm" is *always* a pro-tanto reason *against* an action). Exceptions are seen as *external defeating conditions* that silence or outweigh the default reason, but don't change its inherent valence. This is likely your brother-in-law's implicit framework (common in some forms of rule-based deontology or rule-utilitarianism).
  2.  **The Problem:** As you intuitively grasped, real-world moral reasoning doesn't behave like applying a rule and then checking a predefined list of exceptions. The *meaning* and *force* of the initial feature *itself* shifts based on the context:
      *   "Promise under duress" isn't just "Promise (positive) + Duress (negative exception)". In your friend's case, the duress fundamentally alters what the "promise" *is* morally – it might become a marker of coercion itself. The holism means the *combination* creates a new moral quality.
      *   The list of potential "exceptions" isn't finite or predictable because new contextual features can always emerge (like long-term reliance) that change the moral landscape in unforeseen ways. The "exceptions" aren't separate weights; they reconfigure the board.

  ### Nearest Neighbor Concepts & Distinctions
  1.  **Situation Ethics (Joseph Fletcher):**
      *   **Similarity:** Emphasizes context over rigid rules; the "loving thing to do" depends on the situation.
      *   **Difference:** Fletcher posits *one* supreme principle (Agape/Love). Particularism is more radical – it denies that *any* feature (even "produces love" or "causes harm") *always* has the same valence. Love might require breaking a promise, but sometimes keeping a painful promise *is* loving. Particularism is meta-ethical (about how reasons function), while Situation Ethics is normative (prescribing a principle).
  2.  **Casuistry:**
      *   **Similarity:** Case-based reasoning, comparing paradigm cases.
      *   **Difference:** Traditional casuistry often *assumed* stable principles applied to cases, using analogies. Particularism is more skeptical that stable, invariant principles exist underneath the cases. Casuistry is a method; particularism is a thesis about the nature of moral reasons.
  3.  **Defeasible Reasoning (Logic/Law):**
      *   **Similarity:** Recognizes that conclusions can be overturned by new information (exceptions).
      *   **Difference:** Defeasibility typically assumes a default conclusion based on core features, defeated by specific, often predefined, conditions. Particularism argues the core features themselves lack fixed valence/weight *independently* of potential defeaters (it's holistic from the start).
  4.  **Moral Pluralism (e.g., W.D. Ross):**
      *   **Similarity:** Acknowledges multiple, sometimes conflicting, moral considerations (prima facie duties).
      *   **Difference:** Rossian pluralism is atomistic/invariantist. Each prima facie duty (fidelity, non-maleficence) has a *fixed* valence. Keeping a promise is *always* a pro-tanto good, even if outweighed. Particularism denies this fixed valence – "promise" isn't *inherently* a reason *for* anything; its valence is context-dependent.
  5.  **Wittgensteinian "Family Resemblances":**
      *   **Similarity:** Explains how we group things (like "games") not by a single defining feature, but by overlapping similarities, without a fixed essence. This resonates with how particularists see moral concepts.
      *   **Difference:** "Family resemblances" is a descriptive concept about categorization. Particularism is a normative/meta-ethical claim about how reasons function in moral deliberation.

  ### Edge Cases & Nuances
  *   **Are *No* Features Invariant?** Hard particularism (Dancy) argues no feature *guarantees* the same valence. Soft particularism might allow a very small set (e.g., "causing severe, unjustified pain for fun is wrong"). Your surgeon example ("being paid is correct") challenges even this – imagine a surgeon paid to perform unnecessary, harmful surgery; "being paid" now contributes negatively.
  *   **Does this Lead to Subjectivity?** Critics argue it does. Particularists counter that context is objective and shareable; skilled judgment perceives the holistic moral landscape, not arbitrary whim. It demands discernment, not subjectivism.
  *   **What About "Harm"?** Is causing harm *always* bad? Particularists point to cases: necessary surgery (harm is justified), competitive sports (harm is consented to/part of the good), tragic choices (lesser harm prevents greater harm). The *badness* of harm depends on context (consent, role, alternatives, intention). Its *valence* isn't absolutely fixed.

  ### The Name for Your Brother-in-Law's View
  The core opposing view is **Moral Generalism** or **Principle-Based Ethics**, specifically underpinned by **Atomism** or **Invariantism about Moral Reasons**. This holds that:
  1.  Moral judgment requires general principles/rules.
  2.  Moral features have invariant valence/contributory weight (e.g., promise-keeping always pro-tanto good).
  3.  Exceptions are external defeaters, not intrinsic context-dependent valence shifts.

  ### Conclusion
  You've identified **Moral Particularism**, specifically the **Holism of Reasons**, as articulated by Jonathan Dancy. It perfectly captures your insight: moral features get their direction and force from the entire context, like colors in a painting, not from carrying fixed, intrinsic weights like chess pieces. Your brother-in-law likely holds **Moral Generalism with Invariant Reasons**. This distinction isn't just academic; it reflects a fundamental difference in how we perceive moral reality – as a dynamic interplay of context or as the application of stable rules with exceptions. Your examples brilliantly illustrate the core challenge to invariantism. Keep wielding that painter's eye!
