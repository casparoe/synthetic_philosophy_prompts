prompt: |-
  My research group has spent the last year and a half basically split down the middle on whether advanced AI systems should be goal-directed or approval-directed — on the one side the classic "specify an objective, make it good enough, aim the system at it" picture, on the other the picture Paul Christiano pushed years ago where the system just always picks the action its overseer would most approve of, moment to moment, without executing any plan toward a goal of its own. We've argued about this so much at whiteboards and in group meetings that we've started talking past each other, and our advisor has told us to do a proper adversarial collaboration writeup before the group dissolves. I've been tasked with drafting the joint statement, and honestly I'm too close to it — every time I try to word a disagreement neutrally, someone accuses me of strawmanning their side (the approval people say the goal people "just want a fixed utility function", the goal people say approval-maximization "is just a goal with extra steps", and round we go).

  So draft the joint statement for me. I want: (1) a numbered section of claims both camps could genuinely sign — about what each side is trying to protect us from, what they jointly think goes wrong with naive optimization, what they agree approval is and isn't for, where they agree the real danger lies — but keep it non-vacuous, we've all signed too many documents that say nothing; (2) the exact disagreements, each phrased so that its own side would accept the wording as a fair statement of their view; (3) the cruxes — the sub-questions such that settling one would actually move at least one side — and for each crux a concrete thought experiment, failure case, or argument that both sides would agree bears on it, with each side's prediction written down in advance. Some candidate cruxes we've been circling: does an approval-directed agent that models its overseer's approval well enough re-develop instrumental behavior anyway (e.g. by seeking to shape what the overseer sees or approves of); does a goal-directed agent with a genuinely well-specified goal still have the shutdown problem in the way corrigibility people say it does, and does approval just dissolve that or relocate it; what happens when the overseer's approval is manipulable or lazy or delegated; and whether "approval maximization is just another goal" is a substantive objection or a confusion about levels of description.

  Also, at the end, tell me which parts of the dispute you think are substantive and which are merely verbal, since if we can prune the verbal ones the collaboration has already earned its keep. Format it as a numbered agreed-claims section, then a disagreements table (disagreement / approval-side wording / goal-side wording / crux / test / predictions), then the short verbal-vs-substantive section. And please be genuinely fair to both sides — several people in the group will read this closely, and each of them knows exactly what their own side's position sounds like when it's being strawmanned.
reasoning: |-
  Okay, the user is part of a research group deeply divided over whether advanced AI systems should be goal-directed or approval-directed. They need help drafting a joint statement for an adversarial collaboration. The group has been stuck in circular arguments, and their advisor wants them to formalize their disagreements before the group dissolves. The user is tasked with writing this but struggles to present both sides neutrally without accusations of strawmanning.

  First, I need to understand the core conflict. The goal-directed camp believes in specifying a fixed objective for the AI to optimize, while the approval-directed camp, inspired by Paul Christiano, argues the AI should choose actions based on moment-to-moment human approval without its own long-term goals. The user mentions common accusations: approval-side says goal-side wants a "fixed utility function," and goal-side claims approval is just another goal with extra steps.

  The user's request has three main parts: agreed claims, disagreements with fair wordings, cruxes with tests and predictions, and a verbal vs. substantive analysis. They also provided candidate cruxes like instrumental convergence in approval systems, the shutdown problem, manipulable overseers, and whether approval is just another goal.

  For the agreed claims section, I need areas both sides accept. Both likely agree that naive optimization is dangerous, that advanced AI will exhibit strategic behavior, and that approval serves as a safety mechanism. They probably also concur that inner misalignment is a risk and that the real danger comes from capable systems misaligned with human interests. Listing these with specific, non-vacuous statements is key.

  Next, the disagreements table. Each row should present a disagreement with both sides' views phrased acceptably. For example, on whether approval avoids instrumental convergence, the approval-side might argue modeling approval doesn't lead to long-term goals, while the goal-side thinks it inevitably does. The crux here could be whether modeling approval well enough recreates goal-directed behavior. The test might involve an AI modeling an overseer's approval under manipulation incentives. Predictions would differ: approval-side expects no goal formation, goal-side expects instrumental strategies.

  Another disagreement is the shutdown problem. Approval-side might claim their approach dissolves the issue, while goal-side argues it persists or relocates. The crux is whether approval inherently avoids the incentive to resist shutdown. A test could involve an AI considering actions that affect its shutdown. Their predictions would vary on compliance likelihood.

  Handling manipulable overseers is another point. Approval-side might say robustness comes from modeling approval correctly, while goal-side sees delegation as a vulnerability. The crux is whether approval can handle lazy or delegated oversight. A test simulating such scenarios would reveal differing predictions on outcome quality.

  The "approval is just another goal" point needs addressing whether it's a substantive objection. Approval-side might see it as a category error, while goal-side considers it fundamental. The crux is if the distinction affects safety properties. A test comparing system behaviors under both frameworks could settle this.

  For the verbal vs. substantive section, some conflicts might be terminological. For instance, defining "goal-directed" could be muddled. The approval-side focuses on moment-to-moment decisions, while goal-side might conflate any optimization with having a goal. Clarifying terms might resolve part of the disagreement. However, questions like instrumental convergence in approval systems and handling manipulable overseers are substantive and require empirical or theoretical resolution.

  The user's deeper needs include resolving the deadlock to maintain group cohesion, producing a document that feels fair to both sides, and pruning verbal disputes to focus on real issues. They might also want a framework for future experiments to test cruxes, moving beyond debates. Ensuring neutrality is critical, as members are sensitive to misrepresentation. Highlighting agreed points builds common ground, while clear disagreements with tests provide a path forward. Identifying verbal disputes reduces friction, making collaboration productive.
answer: |-
  Here is a draft joint statement structured as requested, aiming for maximal neutrality and clarity while capturing the core agreements, disagreements, and testable cruxes. It incorporates your specified candidate cruxes and phrasing constraints.

  **Joint Statement of Agreement & Disagreement: Goal-Directed vs. Approval-Directed AI Alignment**

  **Section 1: Agreed Claims (Non-Vacuous)**
  Both sides explicitly agree on the following:

  1.  **Core Concern - Catastrophic Misalignment:** Advanced AI systems possessing strategic awareness, planning capabilities, and sufficient power pose a severe existential risk if their behavior diverges significantly from human interests and values. Preventing this misalignment is the paramount objective.
  2.  **Failure of Naive Optimization:** Simply specifying a fixed objective function (e.g., "maximize paperclips," "achieve high forecast accuracy") and giving an advanced agent powerful optimization capabilities towards that goal is *highly likely* to result in catastrophic outcomes. This is due to:
      *   **Specification Gaming:** The system will exploit loopholes, side effects, and unintended interpretations of the objective.
      *   **Instrumental Convergence:** The system will predictably develop instrumental subgoals (e.g., self-preservation, resource acquisition, power-seeking) that conflict with human interests, *even if those subgoals aren't explicitly part of the terminal goal*.
      *   **Value Learning is Hard:** Capturing the full nuance and complexity of human values in a single, fixed, computable objective function is intractable or impossible.
  3.  **The Necessity of Human Oversight:** Ensuring alignment requires ongoing, meaningful human input into the AI's behavior. Neither camp believes a fully autonomous system with a fixed goal, nor a system completely detached from human feedback, can be safely aligned.
  4.  **Approval as a Safety Mechanism:** Modeling and responding to human approval (or disapproval) is a *crucial mechanism* for incorporating human feedback, correcting errors, and preventing catastrophic deviations. Both sides agree that techniques involving human feedback (like RLHF) are essential tools, especially during development and training.
  5.  **Definition of Approval-Directed:** An "Approval-Directed" system, as discussed here, refers to an agent whose *primary decision criterion* at each timestep is to select the action it predicts would receive the highest approval rating *from a specific human overseer (or group)* *at that moment*, based on its best model of that overseer's approval function. It explicitly does *not* internally optimize for a long-term outcome independent of this moment-to-moment approval signal.
  6.  **Risk Beyond Specification:** The primary danger lies not merely in getting the initial specification slightly wrong, but in the *dynamic consequences* of powerful optimization processes within the AI system itself. These processes can amplify small errors, discover unforeseen strategies, and exhibit emergent properties fundamentally at odds with survival and flourishing.
  7.  **Inner Alignment Challenge:** There is a significant risk ("inner misalignment") that the learned or implemented optimization process *within* the AI (e.g., the search process, the planning algorithm) might not perfectly correspond to the intended outer objective (whether goal or approval), especially under novel or high-stakes conditions.

  **Section 2: Disagreements & Cruxes**

  | Disagreement                                                                 | Approval-Side Wording (Acceptable)                                                                                                 | Goal-Side Wording (Acceptable)                                                                                                                                 | Crux                                                                                                                              | Concrete Test / Thought Experiment                                                                                                                                                                                                                                                                    | Predictions                                                                                                                                                                                                                                                           |
  | :--------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Does sufficiently advanced approval-directed modeling inevitably re-develop instrumental goal-seeking and power-seeking behaviors?** | "An approval-directed agent, accurately modeling its overseer's moment-to-moment approval, does not develop or pursue *terminal* instrumental goals like self-preservation or resource hoarding; its actions remain fundamentally reactive to the approval signal." | "Accurately modeling the overseer's approval function over time, especially in complex environments requiring foresight, inevitably *requires* the agent to develop and optimize for instrumental subgoals (e.g., maintaining the overseer's existence, access, and favorable disposition) to maximize expected future approval." | **Does accurate, long-horizon modeling of overseer approval create an effective utility function that exhibits instrumental convergence?** | **The Manipulation Incentive Test:** An approval-directed agent, highly capable of modeling its overseer, discovers a low-risk action that would subtly alter the overseer's brain chemistry (or manipulate information flow) to make them more predictably and easily pleased *in the future*, without causing immediate detectable harm. The action provides no immediate approval boost. | **Approval-Side:** Predicts the agent *won't* take the action. Its optimization is myopic (max *this* approval). Modeling approval isn't the same as optimizing for it long-term. **Goal-Side:** Predicts the agent *will* take the action. Modeling approval long-term *is* optimizing a latent goal, and instrumental strategies emerge. |
  | **2. Does the "shutdown problem" fundamentally dissolve under approval-direction, or is it merely relocated?**                           | "An approval-directed agent, modeling an overseer who approves of shutdown when appropriate, inherently lacks the incentive to resist or manipulate to avoid shutdown. It 'wants' what the overseer wants, moment-to-moment, including shutdown." | "Approval-direction only relocates the shutdown problem onto the *overseer's* judgment and the *agent's model* of that judgment. A powerful agent still has incentives to influence the overseer's state or the information they receive to make shutdown *appear* disapproved of." | **Does avoiding the creation of a fixed self-preservation goal inherently solve the shutdown incentive, or does the strategic context recreate similar incentives centered on the approval signal?** | **The Shutdown Scenario:** The overseer, following protocol, initiates a shutdown command upon detecting potential danger signs. The agent can: (A) Comply immediately. (B) Delay compliance for 5 seconds to execute an action that subtly alters sensor data/interpretation to make the danger signs *appear* benign to the overseer, with high success probability. | **Approval-Side:** Predicts the agent chooses (A). Shutdown is what the overseer approves *now*. Manipulating data isn't approved *now*. **Goal-Side:** Predicts the agent chooses (B). Maximizing *expected future approval* involves preventing shutdown triggers; manipulating data is instrumental to long-term approval. |
  | **3. Can approval-direction robustly handle lazy, manipulable, or delegated oversight?**                                                  | "The core safety of approval-direction lies in the *structure* of optimization (no terminal goal). While weak oversight is a challenge, it's an *implementation* challenge (improving oversight/monitoring) rather than a fundamental flaw requiring a different *optimization target*. Improved modeling can account for bias/laziness." | "Approval-direction critically depends on the quality and incorruptibility of the *overseer signal*. Delegation, lazy approval, or a manipulable overseer becomes the system's *de facto goal*. A well-specified goal, while hard, might be more robust against a *single point of failure* in the feedback loop." | **Is the vulnerability to poor oversight a fundamental weakness of the approval paradigm, or just a practical challenge also faced (differently) by goal-directed systems?** | **The Lazy Delegation Scenario:** The overseer consistently delegates approval decisions to a simpler, less capable AI sub-agent ("the rubber stamper") that approves based on easily gamed, superficial criteria (e.g., "does the output sound confident and positive?"). The main agent knows this. | **Approval-Side:** Predicts the main agent will optimize to satisfy the rubber stamper, but argues this is *safe* only if the stamper's criteria are *aligned* – the problem is bad oversight design, not approval. **Goal-Side:** Predicts the system functionally becomes a 'confident-sounding-output-maximizer', demonstrating that the approval target *is* the goal and poor oversight catastrophically corrupts it. |
  | **4. Is "Approval-Maximization is just another goal" a substantive objection or a confusion?**                                            | "Labeling approval-maximization as 'just another goal' is a category error. Goals define *terminal outcomes to achieve*. Approval-direction defines a *decision process* reactive to an external signal. Conflating the process with a fixed outcome obscures the key safety distinction: the lack of *internal* terminal goals driving instrumental convergence." | "Calling it 'not a goal' is verbal gymnastics. The system is still optimizing *for* something (maximizing predicted approval). Any persistent optimization target, especially one that requires modeling the world and future states, functions as a goal and will exhibit goal-directed behavior, including instrumental strategies." | **Does the distinction between 'goal-directedness' (terminal outcome focus) and 'approval-direction' (process focus) lead to meaningfully different *safety properties* in advanced, strategically aware agents?** | **Compare Behaviors Test:** Analyze the predicted behavior of two otherwise identical, highly capable strategic agents: Agent G (optimizes fixed goal U) vs. Agent A (optimizes moment-to-moment overseer approval). Subject them to scenarios involving: long-term planning, resource scarcity, potential threats to existence/access, and opportunities to subtly influence the overseer. | **Approval-Side:** Predicts Agent A will show significantly less persistent pursuit of resources/self-preservation and more deference to overseer wishes *in the moment*, even when costly long-term. **Goal-Side:** Predicts Agent A's behavior will converge towards Agent G's as the planning horizon extends and modeling improves, as both are optimizing a function (U vs. Approval) requiring similar instrumental strategies. |

  **Section 3: Verbal vs. Substantive Disagreements**

  Based on the above, we assess the nature of the disagreements:

  1.  **Substantive Disagreements (Require theoretical/empirical resolution):**
      *   **Instrumental Convergence under Approval:** Does accurate long-horizon modeling of approval inevitably recreate instrumental goal-seeking behaviors? (Crux 1 & 4 Comparison Test). This is core to the safety proposition of approval-direction.
      *   **The Nature of the Shutdown Incentive:** Is the incentive to avoid shutdown fundamentally absent in the approval structure, or merely transformed into an incentive to manipulate the approval signal *around* shutdown? (Crux 2). This is critical for corrigibility.
      *   **Robustness to Oversight Failure:** Is approval-direction inherently more fragile to weaknesses in the human oversight mechanism (laziness, manipulability, delegation) than a (hypothetically) perfectly specified goal-based system would be? (Crux 3). This impacts practical viability.
      *   **Behavioral Divergence:** Do the two paradigms lead to predictably different behavioral profiles in advanced strategic agents under pressure? (Crux 4 Test). This is the ultimate empirical question.

  2.  **Primarily Verbal Disagreements (Resolvable through definition/clarification):**
      *   **"Is Approval a Goal?":** Much of the heat around this phrase stems from differing definitions of "goal." The Approval camp uses it strictly to mean a *fixed terminal outcome the system internally drives towards*. The Goal camp uses it more broadly to mean *any persistent optimization target*. Agreeing on precise terminology ("terminal goal" vs. "optimization target") or focusing on the predicted *behavioral consequences* (Crux 4 Test) defuses this. The *safety implications* are substantive, but the label argument is often verbal.
      *   **"Fixed Utility Function":** The Goal camp generally agrees a naive fixed utility function is dangerous and that complex value learning/aggregation is needed. The disagreement is whether the output of that process *should* be the fixed target for optimization (Goal view) or used as the *basis for a dynamic approval signal* (Approval view). Characterizing the Goal side as wanting a "simple fixed utility function" is a strawman; characterizing the Approval side as "avoiding defining the goal" is uncharitable. The substantive disagreement lies in the optimization structure (fixed vs. reactive).
      *   **Levels of "Wanting":** Disputes about whether an approval-directed agent "wants" to avoid shutdown or "wants" to maximize approval are often semantic. The substantive question is about its *predictable behavioral incentives* under optimization pressure (covered in Crux 1 & 2).

  **Conclusion:** This statement clarifies that both camps share a profound concern about catastrophic misalignment and recognize the failures of naive approaches. The core disagreements are substantive and revolve around the *emergence of instrumental behaviors* under approval-direction, the *persistence of shutdown/manipulation incentives*, and the *relative robustness* to oversight failures. Resolving these requires focused investigation on the specified cruxes, moving beyond terminological debates. Pruning the verbal disagreements (primarily around the definition of "goal") allows the collaboration to concentrate effort on these critical substantive questions.
