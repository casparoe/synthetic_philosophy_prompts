  The user's sharp - they sense newsroom vocabulary can't capture everything here. Like how legal validity debates have no journalism parallel, or how morality in law is more structural than journalism's ethical codes. Also, their British English request means I'll swap "color" for "colour" and avoid American legalisms. 

