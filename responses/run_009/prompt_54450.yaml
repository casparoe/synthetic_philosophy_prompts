prompt: |-
  I've been rereading Orwell's "Politics and the English Language", and I keep noticing a phenomenon his catalogue of vices doesn't quite capture. Certain phrases in political speech — "the right side of history", "common-sense reform", "not who we are" — carry no propositional content at all: you cannot extract from them a claim that could be true or false, and nobody using them expects you to. Yet they are not vague or slovenly, which is what Orwell was mainly attacking; they are perfectly precise about their actual job, which is to display which side the speaker is on. The tell is what happens when you ask what such a phrase asserts: people react as though you had impugned the allegiance it signals rather than asked a question about meaning. Rival movements can even use the same phrase of opposite policies, and it still works. Is there an established term for vocabulary whose function is allegiance-display rather than assertion? "Dogwhistle" doesn't fit, since there is no concealed message aimed at a subset of listeners — the display is the whole of it. "Phatic" comes closest, but it is normally reserved for greetings and small talk, not loaded political vocabulary. And Orwell's own thesis — that "the slovenliness of our language makes it easier for us to have foolish thoughts" — assumes language is failing at its proper job of expressing thought, whereas these phrases seem to be succeeding at a different job entirely. Does the phenomenon have a name of its own? If not, I'd like you to coin one and mark its boundaries against euphemism, shibboleth, and plain vagueness; a bare label won't satisfy me.
reasoning: |-
  Okay, let me unpack this user's query. They're deep into Orwell's "Politics and the English Language" but noticed something Orwell missed—phrases like "right side of history" that signal allegiance without making actual claims. The user wants a term for this phenomenon.  

  First, I need to grasp their core observation: these phrases aren't vague or deceptive; they're precise in signaling tribal affiliation. When challenged, people react defensively as if their loyalty is questioned, not the phrase's meaning. The user already ruled out "dogwhistle" (no hidden message) and "phatic" (too broad). Orwell's focus on sloppiness doesn't fit because these phrases aren't failing—they're excelling at a different function.  

  The user's deeper need seems theoretical: they want to categorize a linguistic gap Orwell overlooked. They might be a linguist, political analyst, or avid reader frustrated by unlabeled phenomena. Their rejection of "bare labels" suggests they crave rigorous taxonomy—distinguishing this from euphemism (which softens), shibboleth (which tests membership), and vagueness (which obscures).  

  I recall similar concepts: sociolinguistics has "identity markers," but that's too broad. "Totem words" (Klemperer) and "orthophemisms" (Allan & Burridge) come close but don't nail the *non-propositional* aspect. "Signaling phrase" is descriptive but flat. "Tribal semaphore" feels right—military semaphores signal allegiance visibly, and "tribal" captures the in-group loyalty.  

  Why coin a term? Because existing frameworks (Orwellian vagueness, phatic communion) assume language is for information or bonding, not pure allegiance-display. This needs a distinct niche: phrases that are *intentionally* non-propositional, trigger tribal defensiveness, and resist falsification.  

  Testing boundaries:  
  - Vs. euphemism: "Collateral damage" softens; "tribal semaphore" asserts belonging.  
  - Vs. shibboleth: "Shibboleth" tests membership; tribal semaphores broadcast it.  
  - Vs. vagueness: Vagueness is fuzzy; these are precise in signaling.  

  User might push back: Is this just a subset of phatic language? I'd argue phatic language (like "how are you?") maintains social bonds neutrally, while tribal semaphores are weaponized for identity politics. Coining "tribal semaphore" crystallizes that difference.  

  Final note: User's intellectual curiosity is palpable. They'll appreciate the historical roots (Klemperer, Orwell) and care in boundary-drawing. The proposed term needs to feel both academic and vivid—hence "tribal semaphore" over drier alternatives.
answer: |-
  Your observation cuts to the heart of a profound linguistic phenomenon that Orwell's framework doesn't fully address. You've identified **performative allegiance-markers**—phrases designed purely to signal tribal affiliation while evading substantive claims. The established term closest to this is **"shibboleth"**, but it requires refinement for your specific case. Let's dissect and coin:

  ### The Core Phenomenon: **Tribal Semaphores**
  I propose **"Tribal Semaphore"** (from *semaphore*: a visual signaling system). This captures:
  - **Non-propositional function**: Like flag signals, these phrases convey affiliation without content.
  - **In-group ritual**: Their meaning exists solely in reaffirming shared identity.
  - **Defensive reactivity**: Challenging the phrase is treated as challenging tribal loyalty (e.g., asking "What *is* the 'right side of history'?" implies disloyalty).
  - **Contextual fluidity**: As you noted, opposing groups can use identical phrases ("freedom," "justice") because the signal overrides semantic content.

  ### Distinguishing from Related Concepts:
  | Term              | Key Difference from Tribal Semaphores                     |
  |-------------------|----------------------------------------------------------|
  | **Shibboleth**    | Tests membership (e.g., pronunciation). Tribal semaphores *proactively broadcast* allegiance without gatekeeping. |
  | **Euphemism**     | Softens taboo content (e.g., "passed away"). Tribal semaphores lack *any* referential content to soften. |
  | **Dogwhistle**    | Contains covert meaning for subgroups. Tribal semaphores are overt, universal signals within the tribe. |
  | **Orwellian Vague**| Arises from lazy thinking. Tribal semaphores are *strategically precise* in signaling allegiance. |
  | **Phatic**        | Maintains social bonds (e.g., "How are you?"). Tribal semaphores are *combative*, reinforcing in-group/out-group boundaries. |

  ### Why Orwell's Framework Misses This:
  Orwell assumed language primarily *conveys thought*. Tribal semaphores operate in Jacques Ellul's realm of **"sociological propaganda"**—language that binds groups through ritualistic affirmation, not persuasion. Their "success" lies in their **immunity to falsifiability**: if a phrase asserts nothing, it can't be disproven, making it ideal for ideological cohesion.

  ### Boundary Cases:
  - **"Thought-terminating clichés"** (Hannah Arendt): Overlap exists, but these halt debate via faux-wisdom ("it is what it is"), while tribal semaphores provoke *affective solidarity*.
  - **"Empty Signifiers"** (Laclau/Mouffe): Close, but these absorb contested meanings (e.g., "democracy"), whereas tribal semaphores *reject meaning-absorption entirely*.

  ### Example Analysis:
  - **Phrase**: "Common-sense gun reform"  
    - **Orwellian critique**: Vague, unexamined assumptions.  
    - **Tribal Semaphore view**: Signals alignment with urban progressives; using "common-sense" *immunizes* against scrutiny (opposing it = "lacking sense"). The phrase's emptiness *is its strength*—it requires no policy specifics to function socially.

  ### Coined Definition:
  > **Tribal Semaphore**: *A lexical unit or phrase whose primary function is to signal allegiance to an ideological group by performing shared identity, deliberately devoid of testable propositional content, and which provokes defenses of loyalty when semantically interrogated.*

  This construct thrives in polarized ecosystems where group identity supersedes policy coherence. Where Orwell lamented language that *conceals* thought, tribal semaphores celebrate language that *replaces* thought with belonging. Their precision lies not in denoting reality, but in activating tribal neurology—making them linguistic pureblood sigils for the age of affective polarization.
