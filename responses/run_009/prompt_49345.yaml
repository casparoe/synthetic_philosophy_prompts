answer: |-
  Your intuition that this dispute resists empirical resolution is profoundly insightful—it cuts to the heart of why modal metaphysics is both fascinating and frustrating. Let's dissect the nature of the disagreement, why it persists, and what constitutes progress.

  ### 1. **The Core Disagreement: Not Verbal, Not Notational, But Substantively Metaontological**
     - **Against Verbal/Notational Equivalence**:  
       While counterpart theory (CT) and transworld identity (TI) can model the same *set of modal truths* (e.g., "Humphrey could have won"), they disagree on **what grounds those truths**. They are not merely "bookkeeping variants":
       - **CT** reduces modality to qualitative resemblance relations between world-bound individuals. Humphrey’s possibility of winning is made true by a *different* individual (his counterpart) in another world who resembles him and wins.  
       - **TI** treats Humphrey as literally existing in multiple worlds (though only actual in one). His possibility is made true by *Humphrey himself* winning in another world.  
       This isn’t about the *phrase* "could have been" but about **what entities/relations populate reality** to make modal claims true.

     - **The Haecceitism Divide**:  
       The dispute centers on whether **non-qualitative facts** (haecceities) are fundamental.  
       - **Lewis (CT)**: Denies haecceitism. Identity across worlds isn’t primitive; it’s supervenient on qualitative facts. There’s no "bare particular" Humphrey-ness transcending worlds.  
       - **Kripke (TI)**: Implicitly accepts haecceitism. Humphrey’s transworld identity is a primitive fact not reducible to qualitative properties.  
       This makes the disagreement **substantive**: it’s about the structure of reality itself—whether identity is reducible or brute.

  ### 2. **Why Both Arguments Seem Decisive (But Don’t Directly Engage)**
     - **Kripke’s Objection** ("Humphrey doesn’t win—his double does!") targets *intuition*. It highlights that CT seems to "rob" individuals of their own possibilities.  
     - **Lewis’s Objection** ("No fact fixes which individual is Humphrey") targets *metaphysical rigor*. It argues TI requires indeterminate or arbitrary primitives.  
     They appear decisive because they attack different vulnerabilities:  
     - CT sacrifices *de re modal intuition* (we *feel* that *we* could have done otherwise).  
     - TI sacrifices *ontological parsimony* (adding cross-world identities as brute facts).  
     This isn’t a stalemate—it’s a clash of **theoretical virtues**: intuitive fidelity vs. metaphysical economy.

  ### 3. **Why the Disagreement Persists Without Empirical Resolution**
     - **No Possible Observation Could Decide**: Modal claims concern *non-actual* possibilities. We can’t "observe" Humphrey in another world to check if it’s *him*. The dispute is fundamentally **non-empirical**.  
     - **The Role of Intuition and Theoretical Virtues**:  
       Philosophers align with CT or TI based on deeper commitments:  
       - If you prioritize **parsimony** and fear "suspicious" primitives (haecceities), you lean Lewis.  
       - If you prioritize **modal intuition** and reject "alienated possibilities," you lean Kripke.  
       Like choosing between interpretations of quantum mechanics (Copenhagen vs. Many-Worlds), the choice reflects **philosophical temperament**.

  ### 4. **Progress Since the 1980s: Refinement, Not Resolution**
     Later work clarified the debate but didn’t "solve" it. Key advances:
     - **Refined Counterpart Theories** (e.g., Hazen, Fara): Allowed multiple counterparts per individual per world, addressing Kripke’s "Humphrey has multiple ways to win" intuition.  
     - **Kripke’s Response**: He conceded transworld identity is a "picture" but insisted CT misdescribes *de re* modality. This shifted focus to **how we fix reference** to individuals across worlds.  
     - **Formal Equivalence Proofs** (e.g., Melia, Divers): Showed CT and TI can model the same modal logic. But this reinforced your hypothesis—they *are* empirically equivalent—while underscoring that the disagreement is **metaphysical** (about what exists).  
     - **Metaontological Turn** (Sider, Hirsch): Asked *what the disagreement means*. Is it about reality or conceptual schemes? This exposed the **depth of the stalemate**: if ontology depends on conceptual choices, the debate may lack a "fact of the matter."  

  ### 5. **What Counts as Progress?**
     - **Clarifying Stakes**: Showing how CT/TI affects other domains (e.g., CT better handles temporal counterparts; TI simplifies essentialism).  
     - **New Frameworks**: "Modal stage theory" (Hawley) treats individuals as spacetime worms, blending CT and TI intuitions.  
     - **Connecting to Science**: Some (e.g., Ladyman) argue physics undermines haecceitism (e.g., in quantum indistinguishability), favoring CT.  
     - **Acknowledging Pragmatism**: Recognizing that CT/TI are **tools** for different tasks. CT excels in *context-dependent* modality ("How would I look with a mohawk?"); TI excels in *absolute* modality ("Could I have had different parents?").  

  ### Conclusion: A Persistent Stalemate with Intellectual Value
  Your hypothesis is largely correct: **CT and TI describe the same modal phenomena with different ontological commitments**. There’s no experiment to decide because the dispute is about *what exists beyond the qualitative*. Yet the debate persists because it forces us to confront deeper questions:  
  - Can identity transcend worlds?  
  - Must modality be grounded in resemblance?  
  - How do our intuitions shape reality?  

  Like wave-particle duality in physics, this duality in modal metaphysics reveals that our concepts strain against the phenomena they describe. The lack of resolution isn’t failure—it’s a testament to philosophy’s role in probing the limits of intelligibility. As someone who spent decades distinguishing theories with data, you’ve identified why metaphysics is both maddening and indispensable: it grapples with what lies beyond observation.
