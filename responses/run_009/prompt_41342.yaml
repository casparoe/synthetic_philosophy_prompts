  Key conceptual distinctions to address:
  1. Nociception (the ability to detect harmful stimuli) vs. felt pain (the subjective experience of suffering). We care about the latter for moral relevance.
  2. Threshold view (a line below which no protection) vs. smooth scaling (protections increase continuously). The procedure should adopt a smooth scaling view because a threshold is arbitrary and doesn't account for gradations in capacity.
  3. Double-counting: Brain size might be a proxy for both capacity to suffer and intelligence. We should separate these because:
     - Capacity to suffer (sentience) is the primary moral concern for welfare protections (e.g., analgesia, humane endpoints).
     - Intelligence (cognitive capacities) might be relevant for other protections (e.g., enrichment, social housing) but is secondary to suffering in the context of pain and distress.

  Therefore, the procedure will focus on sentience (capacity for subjective experience, especially suffering) as the primary moral consideration. Brain measures are used as a proxy for sentience.

  Choice of master measure: 
  - Absolute brain mass: Problematic because birds have smaller brains but high neuron density, and octopuses have distributed brains.
  - Total neuron count: Better because it correlates with computational capacity. However, it's harder to measure and data may be lacking for some species.
  - Encephalization quotient (EQ): Adjusts for body size and is a measure of relative brain size. But it might not capture absolute cognitive capacity and is less direct for sentience.

  Given the committee's concerns and the species in question, I propose using **total neuron count** as the primary measure because:
  - It is a direct indicator of neural processing capacity, which is plausibly linked to sentience.
  - It avoids the bird problem (since corvids have high neuron counts despite small brain mass) and the octopus problem (if we count all neurons, including those in the arms, which are part of the nervous system and relevant for distributed cognition and sensation).
  - However, for octopuses, we must count the entire nervous system (central brain plus the ganglia in the arms) because their nervous system is decentralized.

  But note: neuron count is not a perfect proxy for sentience. We must also consider the presence of neural structures analogous to those known to support sentience in mammals (e.g., the presence of a cortex or equivalent). However, for simplicity and given time constraints, we will use neuron count as the main numerical measure, supplemented by behavioral evidence and expert judgment.

