  ### Honest Limitations  
  - **Misfires expected:** The procedure will underestimate sentience in animals with small but efficient brains (e.g., ants) and overestimate it in animals with high neuron counts but no subjective experience (e.g., due to lack of neural integration).  
  - **Time vs. accuracy:** Runs in <1 hour by design but sacrifices nuance. Step 4 (behavioral evidence) often forces contentious committee votes.  
  - **Vet’s role:** The attending veterinarian can override verdicts with clinical evidence (e.g., observed distress), ensuring flexibility.  
  - **Evolution-proofing:** Regular review (e.g., annual) is advised as neuroethology advances.  

