answer: |-
  ### Decision Procedure for Scaling Protections Based on Brain Measures  
  **Master Measure:** Total neuron count (entire nervous system).  
  **Rationale:** Neuron count is chosen over brain mass or encephalization quotient because it directly correlates with computational capacity for sentience, avoiding biases against birds (high neuron density), cephalopods (distributed neurons), and developmental stages. It prioritizes the capacity to suffer over intelligence, reducing double-counting risks.  

  ### Procedure Table  
  | Step | Question asked | Evidence that suffices | Default rule if evidence missing | Verdict or hand-off |  
  |------|----------------|------------------------|----------------------------------|---------------------|  
  | 1 | Does the animal have a nervous system? | Published neuroanatomical data or veterinary consensus. | Default to "no" for organisms without ganglia/nerve nets (e.g., sponges). | If "no": **Level 0** (basic humane handling only). If "yes": Proceed to Step 2. |  
  | 2 | Is the total neuron count for the species/stage known? | Peer-reviewed studies quantifying neurons in the entire nervous system (central + peripheral). | If unavailable, proceed to Step 3. | Assign **Protection Level** based on count:<br>- < 100k: **Level 0**<br>- 100k–10M: **Level 1**<br>- 10M–500M: **Level 2**<br>- \> 500M: **Level 3**. Terminate. |  
  | 3 | Can neuron count be estimated from brain mass? | Published brain mass + taxon-specific neuron density (e.g., birds: 2× mammals). | If no density data, proceed to Step 4. | Estimate neuron count → Assign Level per Step 2. |  
  | 4 | Is there behavioral evidence of felt pain? | ≥2 studies showing: avoidance learning, trade-off behaviors (e.g., enduring pain for reward), or pain-specific responses reduced by analgesia. | If absent, proceed to Step 5. | **Hand-off to committee vote** (values-based: weight of evidence). |  
  | 5 | Is the animal a vertebrate or cephalopod? | Taxonomic classification. | Default to "no" for non-vertebrate/non-cephalopods. | If vertebrate: **Level 1**<br>If cephalopod: **Level 2**<br>Else: **Level 0**. Terminate. |  

  **Protection Levels:**  
  - **Level 0:** Humane handling only (no analgesia/enrichment).  
  - **Level 1:** Analgesia for invasive procedures; no enrichment required.  
  - **Level 2:** Analgesia, anesthesia, environmental enrichment, humane endpoints.  
  - **Level 3:** Level 2 + cognitive enrichment, social housing (if applicable), vet-approved analgesia.  

  **Key Conceptual Simplifications:**  
  - **Nociception vs. felt pain:** The procedure assumes behavioral evidence (Step 4) suffices for felt pain. Nociception alone is insufficient.  
  - **Threshold vs. scaling:** Uses fixed thresholds (Step 2) for practicality. Smooth scaling is rejected for operational clarity.  
  - **Double-counting:** Neuron count proxies only for suffering capacity (not intelligence). Intelligence is addressed separately in enrichment requirements (Levels 2–3).  

  ---

  ### Case Applications  
  **Case 1: Octopus Learning Experiment (no analgesia beyond fish standard)**  
  - **Step 1:** Octopus has a nervous system → Proceed.  
  - **Step 2:** Total neuron count = ~500M (central brain + arms) → **Level 3**.  
  - **Verdict:** **Reject protocol** as-is. Requires Level 3 protections (e.g., vet-approved analgesia, enrichment).  
  - **Why you won’t like this:** Octopuses are invertebrates, yet the procedure mandates mammal-level safeguards.  

  **Case 2: Zebrafish Larvae (5 days post-fertilization, "no protections" proposed)**  
  - **Step 1:** Larvae have a nervous system → Proceed.  
  - **Step 2:** Neuron count = ~10,000 (published data) → **Level 0** (<100k threshold).  
  - **Verdict:** **Approve exemption** with Level 0 handling (e.g., no analgesia required).  
  - **Why you won’t like this:** Despite behavioral responses to stimuli, low neuron count classifies larvae as non-sentient.  

  **Case 3: Pig Surgical-Training Program**  
  - **Step 1:** Pig has a nervous system → Proceed.  
  - **Step 2:** Neuron count = ~2.2B → **Level 3**.  
  - **Verdict:** **Reject protocol** as-is. Requires Level 3 enhancements (e.g., cognitive enrichment, analgesia beyond standard surgery).  
  - **Why this surprises:** Pigs often receive less scrutiny in training contexts, but neuron count triggers top-tier protections.  

  ---

  ### JSON Summary  
