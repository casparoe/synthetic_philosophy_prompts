    "master_measure": "total neuron count (entire nervous system)",
    "measure_rationale": "Prioritizes capacity for suffering over intelligence; accounts for distributed systems (e.g., octopus arms) and neuron density (e.g., birds). Avoids biases in brain mass/encephalization quotient.",
    "cases": [
      {
        "case": "Octopus learning experiment",
        "verdict": "Reject protocol - requires Level 3 protections",
        "key_evidence": "Total neuron count = 500M (entire nervous system)",
        "value_calls": "None - neuron count suffices.",
        "expected_objection": "Octopuses are invertebrates; procedure overrides 'fish standard' convention."
      },
      {
        "case": "Zebrafish larvae (5 dpf)",
        "verdict": "Approve exemption - Level 0 protections",
