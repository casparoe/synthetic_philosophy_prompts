      \]
      implying \(1 - w(0.99) + w(0.10) > w(0.11)\). This holds for typical inverse-S \(w\) (e.g., Tversky-Kahneman with \(\delta \approx 0.65\): \(w(0.10) \approx 0.14\), \(w(0.11) \approx 0.19\), \(w(0.99) \approx 0.93\), so \(0.14 + 1 - 0.93 = 0.21 > 0.19\)).
  - **Prediction for E vs. F**:
    - **E** (outcomes ordered: $0$ then $1M$):
      \[
      U(E) = v_1 w(0.555).
      \]
    - **F** (outcomes ordered: $0$, $1M$, $5M$):
      \[
      U(F) = v_1 [w(0.555) - w(0.10)] + v_5 w(0.10).
      \]
      Compare:
      \[
      U(F) - U(E) = v_1 [w(0.555) - w(0.10)] + v_5 w(0.10) - v_1 w(0.555) = w(0.10) (v_5 - v_1).
      \]
      Since \(v_5 > v_1 > 0\) and \(w(0.10) > 0\), \(U(F) > U(E)\). **She chooses F.**
  - **Determinacy**: Prediction is determinate (holds for any \(w(p) > 0\) at \(p=0.10\) and increasing \(v\)).

  ### Conclusion for E vs. F
  - **All three rules predict she will choose F.** 
    - Certainty effect (i): F is preferred by EU, with no bonus.
    - Disappointment aversion (ii): F is preferred for parameters consistent with choices 1 and 2.
    - Inverse-S weighting (iii): F is preferred due to \(w(0.10) (v_5 - v_1) > 0\).
  - **Best Guess**: **F**, as all models align. The reasoning is robust across rules given the constraints.

