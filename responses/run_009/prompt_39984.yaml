prompt: |-
  Quick background so we're on the same page: the Knobe effect is the asymmetry where people say a chairman who approves a program that'll harm the environment as a side effect (he doesn't care about the harm, only profit) brought about the harm intentionally, but deny he helped intentionally when the side effect is beneficial instead. I'm prepping vignettes for an experimental philosophy study and I need a case engineered to flip the asymmetry: a scenario where typical readers would say the harmful side effect was NOT intentional but the helpful side effect WAS. Constraints: everyday workplace stuff (a coworker, a shift supervisor — no CEOs or boards), the agent has to actually know about both side effects in advance (otherwise the flip is trivial, you can't get unintentional just by making them ignorant), one paragraph max, and no cheating by making the agent's psychology so strange that the verdicts are stipulated rather than falling out of normal judgment. After the scenario, do the walkthrough: what the blame-based explanation of the Knobe effect predicts for your case, what the norm-violation explanation predicts, which one your case actually favors, and which feature of the case is doing the work to flip things. Then tell me how a defender of whichever explanation comes out worse would try to argue your case doesnt count — and whether removing that key feature collapses it back to a standard Knobe-style vignette. I'm coding these up for annotation, so end with a machine-readable line of the form \answer{...} containing a short phrase naming the feature of your scenario that does the most work in flipping the asymmetry.
reasoning: |-
  Okay, the user is working on an experimental philosophy study about the Knobe effect. They need a vignette that flips the asymmetry - where people judge harmful side effects as unintentional but helpful ones as intentional. The constraints are: everyday workplace setting, the agent knows about both side effects, short paragraph, and normal psychology. Then they want a walkthrough of how different explanations (blame-based and norm-violation) handle it, which one the case favors, what feature flips it, how critics might respond, and if removing that feature reverts to standard Knobe. Finally, a machine-readable answer with the key feature.

  First, I need to recall the Knobe effect: people say harming the environment is intentional if the agent doesn't care, but helping isn't intentional in the beneficial case. The flip means making harm unintentional and help intentional. The agent must know both outcomes to avoid triviality.

  Brainstorming scenarios: The key is to make the harmful side effect a necessary step for a primary goal, while the helpful one is an optional bonus. That way, for harm, it's seen as an unavoidable cost, not intentional. For help, it's an extra effort they chose to do. Workplace examples could be a shift supervisor changing schedules.

  Let me sketch a scenario: A shift supervisor needs to cover a shift. Option A harms a coworker's commute by making them drive in rush hour, but it's the only way to meet staffing needs. The supervisor knows this and does it, though they feel bad. For the helpful version, they could rearrange schedules to help a coworker's commute, even though it's extra work and not required. They do it specifically to help.

  Check constraints: Everyday workplace - yes, supervisor and coworker. Agent knows both effects - explicitly stated. Short paragraph - should fit. Normal psychology - no weird stipulations.

  Now for the walkthrough. Blame-based explanation says we're more likely to judge intentional when we blame the agent. Norm-violation says it's about breaking a norm. In this case, for harm: it's a necessary action to meet a norm (staffing), so not intentional. For help: they went beyond norms to help, so intentional. This favors norm-violation because the judgments align with norm adherence/deviation.

  Critics from blame-based might say: In the harm case, since the agent feels bad, we don't blame them, so not intentional. In help, we praise, so intentional. But the norm-violation is stronger here. Removing the necessity: if harming wasn't necessary, it might revert to standard Knobe where harm is seen as intentional.

  Key feature: "Necessary cost vs. optional benefit". That captures that harm is unavoidable for the goal, while help is an extra choice.

  Refine the vignette to be clearer. Make sure the harm is framed as the only option, and help requires additional effort. Add that the supervisor knows and acknowledges the effects.

  Final scenario: Shift supervisor must cover a sudden absence. Only way harms a coworker's commute, but it's unavoidable for staffing. They regret it. In the flip, they go out of their way to help a commute, adding work for themselves, specifically to help.

  Answer: \answer{Necessity of negative outcome / optionality of positive outcome}
answer: |-
  Here's a vignette designed to flip the Knobe asymmetry while meeting your constraints:

  **Vignette (Harmful Side Effect):**  
  Alex, a shift supervisor at a café, urgently needs to cover a sudden staff absence. The only available replacement is Taylor, whose commute will become 90 minutes longer due to rush hour traffic if they take the shift. Alex knows this will significantly inconvenience Taylor, but staffing requirements must be met, and there’s no other option. Alex feels bad but calls Taylor in, covering the shift successfully. Taylor’s commute was harmed.

  **Vignette (Helpful Side Effect):**  
  Alex, a shift supervisor at a café, urgently needs to cover a sudden staff absence. Morgan is available, but taking the shift would shorten their usual commute by 30 minutes due to timing. Alex could easily call another worker instead, but they know Morgan would benefit and actively choose Morgan *specifically* to help them. Staffing is covered successfully. Morgan’s commute was helped.

  ---

  ### Walkthrough Analysis  
  **1. Blame-Based Explanation Prediction:**  
     - This theory claims intentionality judgments track blame/praise. If harm triggers blame, people judge it intentional; if help fails to trigger strong praise, it’s not judged intentional.  
     - **For this case:** It predicts the *harmful* outcome should be judged *intentional* (blame arises from harming Taylor) and the *helpful* outcome should be judged *unintentional* (praise for helping Morgan might be weak or absent).  

  **2. Norm-Violation Explanation Prediction:**  
     - This theory claims intentionality hinges on whether the agent violates a norm. Harmful norm violations are judged intentional; beneficial non-violations are not.  
     - **For this case:** It predicts the *harmful* outcome should be judged *unintentional* (Alex adheres to the norm of maintaining staffing; harming Taylor is an unavoidable cost of compliance). Conversely, the *helpful* outcome should be judged *intentional* (Alex violates the efficiency norm by going out of their way to help Morgan when alternatives exist).  

  **3. Which Explanation Does the Case Favor?**  
     - **Actual judgments (predicted flip):** People will likely say harming Taylor’s commute was *not intentional* (it was a forced cost of meeting staffing needs) but helping Morgan’s commute *was intentional* (Alex chose Morgan specifically for the benefit).  
     - **Favored explanation:** The norm-violation account. The asymmetry flips because the harmful outcome stems from *norm adherence* (staffing is obligatory), while the helpful outcome stems from *norm violation* (prioritizing help over efficiency is non-obligatory). The blame-based account fails, as blame for harm is mitigated by necessity, and praise for help is salient due to active effort.  

  **4. Key Feature Flipping the Asymmetry:**  
     - **The necessity of the negative outcome vs. the optionality of the positive outcome.** In the harm case, the negative side effect (long commute) is an unavoidable consequence of fulfilling a primary obligation (staffing). In the help case, the positive side effect (shorter commute) is avoidable and requires an extra, non-obligatory effort (choosing Morgan despite alternatives). This makes harm feel "collateral" and help feel "purposeful."  

  **5. Critic Response (Defending Blame-Based Explanation):**  
     - A defender of the blame-based account might argue: "The case artificially suppresses blame in the harm condition by making the harm necessary, and inflates praise in the help condition by making the benefit agent-initiated. But typical Knobe scenarios don’t manipulate necessity—they focus on the agent’s indifference. Here, the flipped judgments stem from extraneous factors (e.g., ‘no other option’ in harm, ‘specifically to help’ in help), not core intentionality mechanisms. Remove these, and the effect collapses."  
     - **Does removal revert to standard Knobe?** Yes. If you remove necessity (e.g., "Alex could call others but picks Taylor, harming their commute") and optionality (e.g., "Morgan is the only option; helping their commute is incidental"), judgments revert: harm becomes intentional (blame without justification), help becomes unintentional (no praise-worthy effort). The flip depends entirely on these features.  

  \answer{necessity of harm / optionality of benefit}  

  ---  
  **Implementation Notes:**  
  - **Why this works for annotation:** The key feature ("necessity/optionality") is isolated and machine-readable, and the vignette avoids stipulating psychology (Alex’s "feels bad" and "specifically to help" reflect ordinary workplace reasoning).  
  - **Pilot testing tip:** Pre-test with attention checks to ensure participants notice the necessity/optionality contrast (e.g., "Was there another worker Alex could call in the helpful case?").  
  - **Theoretical weight:** This case challenges the blame-based account by decoupling blame from intentionality (blame exists but is overridden by norm compliance) while supporting norm-violation as the driver of asymmetry flips.
