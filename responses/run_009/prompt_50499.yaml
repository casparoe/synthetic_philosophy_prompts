answer: |-
  Here is a carefully crafted essay question addressing your core tension, followed by a model answer and marking scheme. I've adjusted the framing slightly to avoid presupposing an unresolvable tension or overstating the suberogatory's evidential role, while preserving your key objectives.

  ---

  **(i) Essay Question**

  "Evaluate whether the concept of supererogation requires a non-arbitrary threshold for duty. In your answer, critically assess: (a) whether demandingness arguments (e.g., Singer) undermine the possibility of such a threshold; (b) whether proposals like 'fair-share' or 'reasonable cost' can provide a non-arbitrary standard; and (c) what role, if any, the recognition of the suberogatory plays in justifying a threshold-based view of obligation."

  ---

  **(ii) Model Answer (598 words)**

  Supererogation—acts praiseworthy but not obligatory—seems to presuppose a threshold separating duty from non-duty. However, Singer-style demandingness arguments challenge this by suggesting that any sacrifice of lesser moral significance than the good achieved is required. If pushing this logic erases the supererogatory, collapsing it into duty, the category risks becoming incoherent or ideologically suspect. I argue that while supererogation *benefits* from a non-arbitrary threshold, it does not strictly *require* one, and demandingness arguments constrain but do not destroy the category.

  Singer’s logic exerts pressure on thresholds but does not dissolve them entirely. His principle that we must prevent harm if we can do so without comparable sacrifice pushes duties beyond common-sense limits. Yet, "comparable sacrifice" remains context-dependent. Saving a drowning child at minimal cost *is* obligatory, but donating a kidney to a stranger, while heroic, involves significant personal cost impacting long-term autonomy. A threshold can persist at the point where sacrifice becomes *disproportionate* to the agent’s capacities or role, even if not mathematically precise. Demandingness highlights the elasticity of duty but cannot mandate infinite sacrifice without ignoring agent-relative permissions.

  Proposals for non-arbitrary thresholds have merit but face limitations. A "fair-share" norm (Murphy) suggests duty extends only to what would be required if all contributed equally. This avoids excessive individual burden but struggles with partial compliance: if others shirk, must I pick up their slack? A "reasonable cost" standard (Heyd) ties duty to what doesn’t severely disrupt an agent’s life projects. This better accommodates personal integrity but risks subjectivity—what is "reasonable" to a wealthy donor versus a subsistence farmer? Neither standard is perfectly objective, yet both offer defeasible guidance. Their imperfections suggest thresholds may be *scalar* (admitting degrees of stringency) rather than binary, but this doesn’t annihilate supererogation; it merely refines its boundary.

  The suberogatory (mildly blameworthy but permissible acts, like minor rudeness) offers only weak evidence for sharp thresholds. Its existence implies a zone "below" duty where conduct is suboptimal yet not forbidden, mirroring supererogation’s "above." However, this symmetry doesn’t prove thresholds are non-arbitrary. Both categories might reflect shared social intuitions rather than moral facts. If the suberogatory arises from conventions about permissible selfishness, it may simply import cultural arbitrariness into the threshold’s location. Thus, while the suberogatory supports a *structural* distinction between duty and non-duty, it cannot independently justify where the line falls.

  Ultimately, supererogation survives demandingness because morality must balance beneficence with personal autonomy. Even without a razor-sharp threshold, we can distinguish *core obligations* (enforceable, minimal decency) from *moral ideals* (praiseworthy excellence). The former might expand under demandingness, but the latter remains where costs are significant or roles non-universal. Supererogation isn’t merely a comfort-preserving illusion; it’s a structural feature of any plausible morality that values agent integrity alongside outcomes. Thresholds may be fuzzy and culturally influenced, but the category endures as a space for moral aspiration beyond strict requirement.

  ---

  **(iii) Marking Scheme (5 x 4 marks = 20 marks total)**

  **1. Framing the Threshold-Demandingness Tension**  
  - **4 marks**: Clearly explains how supererogation implies a duty-threshold AND how Singer-style arguments pressure this threshold, framing the central problem.  
  - **2 marks**: Describes one side (e.g., supererogation OR demandingness) but not their tension, or presents tension unclearly.  
  - **0 marks**: Fails to address the tension; only defines terms or lists examples.  

  **2. Critical Assessment of Threshold Proposals (e.g., Fair-Share/Reasonable Cost)**  
  - **4 marks**: Evaluates at least two proposals, highlighting specific strengths (e.g., fair-share’s burden-sharing) AND weaknesses (e.g., fair-share’s partial compliance problem, reasonable cost’s subjectivity).  
  - **2 marks**: Describes proposals without critical evaluation OR evaluates only one proposal superficially.  
  - **0 marks**: No engagement with proposed standards; only general assertions.  

  **3. Engagement with Demandingness Implications**  
  - **4 marks**: Argues whether demandingness erases/constrains thresholds (e.g., accepts elasticity but rejects collapse; notes cost/disproportionality as limit), linking to supererogation’s viability.  
  - **2 marks**: States demandingness challenges thresholds but doesn’t analyse implications, OR asserts supererogation survives without explaining how.  
  - **0 marks**: Ignores demandingness or misrepresents its logic.  

  **4. Analysis of Suberogatory’s Evidential Role**  
  - **4 marks**: Assesses whether suberogatory supports threshold structure (e.g., symmetry argument) AND critiques its weight (e.g., may reflect convention not objectivity; doesn’t fix location).  
  - **2 marks**: Notes suberogatory exists but doesn’t assess its evidential value, OR makes one-sided claims about its role.  
  - **0 marks**: Omits suberogatory or mentions it irrelevantly.  

  **5. Overall Position on Supererogation’s Viability & Threshold-Dependence**  
  - **4 marks**: Takes a clear stance (e.g., "beneficial but not strictly necessary"), defends it (e.g., via scalar/fuzzy thresholds or core/ideal distinction), and addresses implications for the category.  
  - **2 marks**: Stance is vague/unclear OR undefended; implications for supererogation are stated but not developed.  
  - **0 marks**: No clear position; summary without argument.  

  \answer{20 marks, 600 words}
