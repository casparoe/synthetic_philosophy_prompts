  Then there's the redundancy problem with double effect. If all apparent doing/allowing cases are better explained by intention and means, the distinction might be idle. The user needs to show that their doctrine explains cases that double effect can't, like unintended harms where allowing vs. doing matters. Otherwise, their view might not add value.

  Operationalization worries come next. In complex systems like healthcare or policy, determining the "original threat" or tracing paths becomes messy. If the doctrine can't be reliably applied outside controlled scenarios, its practicality is limited. The user might counter with their hospital examples, but in public policy, like redistributing risks, the tracing might be too vague.

  Insulation is another concern. If the user's qualifications (ceteris paribus, tracing) make the doctrine only applicable in clear-cut cases, it might not withstand philosophical scrutiny. However, the user might argue that practical ethics doesn't need universal applicability, just reliability in contexts like medical decisions.

