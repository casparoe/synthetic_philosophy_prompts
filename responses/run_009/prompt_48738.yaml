answer: |-
  Below is a practical decision procedure for species delimitation in regulatory contexts, designed for transparency and robustness against bias. It follows a sequential approach, escalating from least ambiguous (reproductive isolation) to more subjective criteria, with explicit handoff points for policy decisions. The procedure flags where biology underdetermines the answer and requires human judgment.

  ---

  ### **Species Delimitation Decision Procedure**
  *Designed for spreadsheet implementation; stop at the first conclusive step.*

  | Step | Question Asked | Evidence Used | Sufficient Answer | Fallback if Inconclusive |
  |------|----------------|--------------|-------------------|--------------------------|
  | 1 | **Is there a recent (<10 yr), authoritative taxonomic consensus?** | IUCN/CITES listings, peer-reviewed revisions, national databases. | Consensus for 1 or 2 species → **Stop & adopt consensus.** | Proceed to Step 2. |
  | 2 | **Do populations occur in sympatry AND show strong reproductive isolation?** | Field/gene flow studies: hybrid fitness, assortative mating, fertilization rates. | - No hybrids OR sterile hybrids → **2 species.**<br>- Free interbreeding → **1 species.** | Allopatry or ambiguous data → Proceed to Step 3. |
  | 3 | **Is there fixed genetic divergence?** | Published sequences (COI, nuclear markers), phylogenies, genetic distances. | - Reciprocal monophyly + >2% COI divergence → **2 species.**<br>- Paraphyly/polyphyly OR <1% divergence → **1 species.** | Conflicting data OR no genetics → Proceed to Step 4. |
  | 4 | **Are populations morphologically diagnosable?** | Measurements (≥20 specimens), type specimens, PCA of traits. | Fixed difference in ≥2 traits with **no overlap** → **2 species.**<br>No differences → **1 species.** | Variable/overlapping traits → Proceed to Step 5. |
  | 5 | **Is there disruptive ecological divergence?** | Pollinator observations, phenology, habitat partitioning, isotope analysis. | Complete niche separation (e.g., pollinators/habitat) → **2 species.**<br>Identical ecology → **1 species.** | Partial divergence → Proceed to Step 6. |
  | 6 | **Synthesis: Does preponderance of evidence support divergence?** | All data from Steps 2–5 weighted equally. | Consistent evidence for divergence → **2 species.**<br>Consistent evidence against → **1 species.** | Contradictory evidence → **Hand off to ecology lead.**<br>Insufficient data → **Commission genetics.** |

  ---

  ### **Key Notes on Procedure**
  - **Stop conditions:** Conclude at any step if evidence meets "sufficient answer."
  - **Bias mitigation:** Document all evidence transparently. If lumping/splitting equally plausible, escalate to Step 6.
  - **Known failure modes:** 
    - **Ring species:** Use genetics (Step 3) + ecology (Step 5). Hand off endpoints as distinct if no gene flow.
    - **Recent divergence:** Prioritize reproductive isolation (Step 2) or genomics (commission if needed).
    - **Hybrid swarms:** If hybrids dominate, default to 1 species unless parental forms are genetically distinct.
    - **Asexual taxa:** Relies on Step 4 (morphology) + policy (Step 6). No biological "fact of the matter."

  ---

  ### **Worked Examples**

  **Case 1: Brown Crickets**  
  - **Step 1:** No taxonomic consensus.  
  - **Step 2:** Sympatric, no response to songs → **reproductive isolation confirmed.**  
  - **Verdict:** Two species (high confidence).  

  **Case 2: Orchids**  
  - **Step 1:** No taxonomic consensus.  
  - **Step 2:** Allopatric or unsampled sympatry → inconclusive.  
  - **Step 3:** No genetic data → inconclusive.  
  - **Step 4:** Subtle morphology, no fixed differences → inconclusive.  
  - **Step 5:** Flowering time + pollinator divergence → **complete niche separation.**  
  - **Verdict:** Two species (medium confidence; assumes temporal isolation prevents gene flow).  

  **Case 3: Apomictic Dandelions**  
  - **Step 1:** Taxonomy contested (hundreds vs. 15 microspecies).  
  - **Step 2:** Asexual → reproductive isolation N/A.  
  - **Step 3:** No genetic data.  
  - **Step 4:** Morphology diagnosable but arbitrary threshold (15 vs. hundreds).  
  - **Step 5:** Ecology similar.  
  - **Step 6:** **Biology underdetermined.** No objective "species" boundary in asexuals.  
  - **Verdict:** **Policy decision required** (low confidence; procedure cannot resolve arbitrary morphological splitting).  

  ---

  ### **JSON Output for QA Template**
  ```json
  [
    {
      "case": "Brown crickets with song divergence in sympatry",
      "verdict": "Two species",
      "confidence": "high",
      "what_the_procedure_couldnt_settle": "None — reproductive isolation (Step 2) was decisive."
    },
    {
      "case": "Orchids with flowering time and pollinator differences",
      "verdict": "Two species",
      "confidence": "medium",
      "what_the_procedure_couldnt_settle": "Whether temporal isolation alone constitutes reproductive barriers without genetic data (required Step 5 judgment)."
    },
    {
      "case": "Apomictic dandelions with contested microspecies",
      "verdict": "Policy decision required",
      "confidence": "low",
      "what_the_procedure_couldnt_settle": "Asexual taxa lack objective species boundaries; morphological thresholds are arbitrary (Step 6 handoff)."
    }
  ]
  ```

  ---

  ### **Recommendations for Implementation**
  1. **Documentation:** Maintain an audit trail for each step to justify decisions.  
  2. **Commission genetics early:** When Step 3 is inconclusive and stakes are high, budget for ddRAD-seq or similar.  
  3. **Escalate policy decisions:** If Step 6 is reached, provide regulators with:  
     - Risk of false negative (losing a unique lineage) vs. false positive (unnecessary costs).  
     - Precautionary principle recommendation (e.g., split if evidence is ≥50% for divergence).  
  4. **Calibration:** Test the procedure on well-studied local taxa to establish error rates.  

  This procedure prioritizes operationalizability while explicitly flagging subjective judgments—ensuring biology drives decisions where possible and policy handles the rest.
