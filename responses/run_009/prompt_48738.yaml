   Case 3: Apomictic dandelions (asexual). Field team treats 15 microspecies, plant taxonomy book lists hundreds.

   Step 1: Check taxonomic consensus. The plant taxonomy book lists hundreds, but we have a field team that uses 15. This is contested? We might not have a clear consensus. So step 1 is inconclusive -> step 2.

