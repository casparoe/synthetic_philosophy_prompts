     How do we proceed? We might have to rely on the morphological diagnosability at a certain level. But the procedure requires fixed differences. If the 15 microspecies are morphologically diagnosable (with fixed differences) then we would call them 15 species. However, the taxonomy book lists hundreds, meaning that there are even more diagnosable units. But we don't have the data to distinguish hundreds. 

