prompt: |-
  I work as a biodiversity assessor for a regional environmental consultancy, and a weirdly large chunk of my job comes down to one question that my zoology degree never actually equipped me to answer: are these two populations the same species or not? It's not academic for us — whether a client needs protected-species surveys, translocation permits, or can just build depends on the call, and a listing decision can hold up a development worth tens of millions, or conversely leave a genuinely distinct lineage with no protection at all. The wrinkle is that my training gave me the standard menu of species concepts — reproductive isolation, smallest diagnosable monophyletic clade, morphology, gene flow, ecological niche — and told me the "species problem" is unresolved, but nobody ever told me what to do on a Monday morning when I have two rodent populations on either side of a river valley that intergrade morphologically, hybridise a bit where they meet, and come out as seperate branches in one published phylogeny and a single branch in another. These calls come up maybe a dozen times a year, I usually have no genomics lab and rely on morphology plus whatever sequences are already published, our ecology lead has to sign off on every one, and if the regulator disagrees with our reasoning we can lose approved-assessor status. There's also an awkward incentive I want the procedure to be robust to: clients prefer lumping (fewer species, fewer obligations), and I don't want a procedure that quietly drifts toward whatever's convenient.

  So what I'm after is a genuine decision procedure — something I can run in an afternoon on a spreadsheet, with the steps in order, what each step asks, what evidence feeds it, what counts as a sufficient answer to stop, and where it stops with "one species", "two species", or "insufficient data, commission genetics". Crucially, mark the points where the biology genuinely underdetermines the answer and it becomes a values or policy judgement that should get handed off to my ecology lead or the regulator rather than smuggled into the procedure as if it were science. I'd also like you to run it on three worked cases so I can see whether it actually works. Case one: two brown cricket populations, morphologically near-identical, that differ only in male calling song and, where their ranges overlap, don't respond to each other's songs. Case two: two orchid populations my field colleague swears are obviously distinct species because they flower four weeks apart and seem to attract different pollinators, but with no usable genetic data and only subtle morphological differences. Case three: a group of apomictic dandelions — the asexual, clone-forming kind — where the field team informally treats about fifteen "microspecies" as real and our plant taxonomy book lists hundreds. On that last one I suspect there's no biological fact of the matter in the way I want there to be, which is exactly the kind of answer I won't like, so please be straight about it rather than papering over it. Also tell me where the procedure will predictably misfire — e.g. ring species, recent divergence, or hybrid swarms — and what I should do when it does.

  For the deliverable, could you give the procedure itself as a table with columns: Step number, Question asked, Evidence it uses, What counts as a sufficient answer, and Fallback if inconclusive. Then after the three worked applications, a short JSON object summarising them, with one entry per case having the fields "case", "verdict", "confidence" (high / medium / low), and "what_the_procedure_couldnt_settle". Plain English between the table and the JSON is fine — I just need the structured bits so I can drop them straight into our QA template. Cheer!
reasoning: |-
  We are creating a decision procedure for determining whether two populations are the same species or not. The procedure must be practical, run in an afternoon on a spreadsheet, and have clear steps. It should account for multiple species concepts and clearly indicate when the decision is underdetermined by biology and becomes a policy/value judgment.

   Key principles:
   1. We will use a multi-criteria approach, starting with the most operational and least ambiguous criteria first.
   2. We stop as soon as we have a sufficient answer (either one species, two species, or insufficient data).
   3. The procedure must be robust against bias towards lumping or splitting.

   Steps:

   Step 1: Check for known taxonomic consensus.
     Why? If there is a widely accepted and recent taxonomic treatment, we can rely on that to avoid reinventing the wheel.
     Evidence: Published taxonomic revisions, checklists (e.g., IUCN, CITES, national species lists), and expert databases.
     Sufficient answer: If there is a clear, recent (last 10 years) and authoritative consensus (e.g., by a major taxonomic database or society) that treats them as one species or two, we follow that. If the consensus is old (>10 years) or contested, we move to step 2.

   Step 2: Check for reproductive isolation in sympatry.
     Why? The Biological Species Concept (BSC) is still widely used and has practical implications (e.g., if they don't interbreed in nature, they are different species).
     Evidence: Field observations or published studies on sympatric zones: presence of hybrids, hybrid fitness, assortative mating, etc.
     Sufficient answer: 
        - If the two populations occur in sympatry and show no evidence of interbreeding (no hybrids found despite opportunity) OR if hybrids are produced but are sterile or have very low fitness (postzygotic barriers), then they are two species.
        - If they interbreed freely and produce fertile offspring, then they are one species.
        - If they occur in allopatry (no sympatry) or we have no data on sympatry, move to step 3.

   Step 3: Check for genetic divergence (using available data).
     Why? Genetic data can provide evidence of evolutionary independence.
     Evidence: Published genetic studies (mitochondrial, nuclear DNA), genetic distances (e.g., COI barcoding gap, nuclear markers), or if we have to commission genetics, we might skip to step 4 and then come back if needed.
     Sufficient answer: 
        - If there is a published phylogeny showing they are reciprocally monophyletic (each forms a clade without the other) with strong support (e.g., bootstrap >90%) in multiple genes, they are two species.
        - If they are paraphyletic or polyphyletic, or if genetic distances are below typical within-species thresholds for the group, then one species (if no other evidence to the contrary).
        - If genetic data is conflicting (one study says monophyletic, another doesn't) or unavailable, move to step 4.

   Step 4: Check for morphological diagnosability.
     Why? Morphology is often the most accessible and is the basis for many species descriptions.
     Evidence: Morphological measurements (quantitative) or discrete characters from specimens (preferably multiple individuals from each population).
     Sufficient answer:
        - If they are fixed and diagnostically different in multiple morphological characters (without overlap in the range of variation), then two species.
        - If they are morphologically indistinguishable or differences are clinal, then one species (if no other evidence to the contrary).
        - If there are some differences but not fixed (overlap in variation) and no other clear evidence, move to step 5.

   Step 5: Check for ecological divergence.
     Why? Ecological differences can maintain species boundaries and are the basis for the Ecological Species Concept.
     Evidence: Differences in habitat, diet, pollinators, phenology, or other ecological niches.
     Sufficient answer:
        - If they show consistent and significant ecological differences (e.g., different pollinators, non-overlapping flowering times, different habitats) that would prevent gene flow if they were in contact, then two species.
        - If they are ecologically identical, then one species.
        - If ecological differences are present but not consistent, or data is insufficient, move to step 6.

   Step 6: Synthesis and judgment.
     Why? After gathering the evidence, we may have conflicting or incomplete data.
     Action: 
        - If the evidence from steps 2-5 consistently points to one species or two, we can make a call.
        - If there is conflict (e.g., genetic divergence but no reproductive isolation in sympatry) or insufficient data, then we have two options:
            a) If the data is insufficient and we can commission genetics (and it's within budget and time), then we do so and re-run from step 3.
            b) If we cannot get more data, then we must make a judgment call. This is where biology underdetermines the answer and it becomes a policy issue.

     For the judgment call, we must consider:
        - The consequences of splitting (protection) vs. lumping (no protection).
        - The precautionary principle: if there is any reasonable doubt, err on the side of protection (if the client is seeking to avoid regulation) or on the side of more study (if the client is seeking to develop). However, note that we want to avoid bias.

     But note: We should not make this judgment ourselves. We hand off to the ecology lead (or regulator) with a summary of the evidence and the conflicts. They then make the policy-based decision.

     Therefore, the fallback for step 6 is: 
        - If we have commissioned genetics and it's still unclear, or we can't get more data, then we stop and report "insufficient data for a biological determination; policy decision required".

   Special cases:

     - Ring species: The procedure might break at step 2 (if intermediates are present) but step 3 (genetics) might show a pattern of divergence. However, ring species are complex and rare. If we suspect a ring, we note it and recommend more study (genomics) and treat the endpoints as distinct if they do not interbreed in sympatry.

     - Recent divergence: Steps 2-5 might not show strong divergence. We might have to rely on step 3 (genetics) showing reciprocal monophyly or step 5 (ecology) showing strong divergence. If not, we may have to lump.

     - Hybrid swarms: If there is extensive hybridization and introgression, step 2 might show they interbreed freely. But if the hybridization is recent and the parental forms are distinct, we might have to consider them as two species that hybridize. This is tricky and might require step 3 (genetics) to see if there are distinct clusters.

     - Asexual organisms (like the dandelions): The BSC (step 2) doesn't apply. We rely on step 3 (genetics) and step 4 (morphology). However, for asexuals, the concept of species is often based on morphological and genetic clusters (step 4 and 3). But note that in asexuals, every clone could be considered a separate species (if we follow the logic of no gene flow). This is where the procedure must acknowledge that the species concept for asexuals is different. We might use the threshold of genetic and morphological distinctness to define "microspecies", but this is arbitrary. Therefore, we might have to rely on the taxonomic consensus (step 1) and if that is not available, we hand off to policy.

   Now, let's create the table:

   Step | Question asked | Evidence it uses | What counts as a sufficient answer | Fallback if inconclusive
  ------|----------------|------------------|-----------------------------------|--------------------------
  1 | Is there a recent, authoritative taxonomic consensus? | Published taxonomic revisions, checklists, expert databases | - If consensus says one species: stop (one species).<br>- If consensus says two species: stop (two species). | If no consensus, old, or contested, go to step 2.
  2 | Do they occur in sympatry and, if so, is there evidence of reproductive isolation? | Field observations or published studies on sympatric zones: hybrid occurrence, hybrid fitness, assortative mating | - In sympatry, no interbreeding OR hybrids are sterile/low fitness: two species.<br>- In sympatry, free interbreeding with fertile offspring: one species. | If allopatric or no sympatry data, go to step 3.
  3 | Is there strong genetic evidence for divergence? | Published genetic studies (phylogenies, genetic distances) | - Reciprocally monophyletic with strong support in multiple genes: two species.<br>- Paraphyletic/polyphyletic or low genetic distance (within typical within-species range): one species. | If conflicting genetic data or no data, go to step 4.
  4 | Are they morphologically diagnosable? | Morphological measurements or discrete characters from multiple specimens | - Fixed diagnostic differences (no overlap): two species.<br>- No differences or clinal variation: one species. | If differences exist but not fixed (overlap), go to step 5.
  5 | Are they ecologically divergent? | Data on habitat, diet, pollinators, phenology, etc. | - Consistent and significant ecological differences that would prevent gene flow: two species.<br>- Ecologically identical: one species. | If ecological differences are inconsistent or data insufficient, go to step 6.
  6 | Can we make a synthesis or do we need more data? | All evidence from steps 2-5 | - If consistent evidence for one or two: make the call.<br>- If inconsistent or insufficient: | a) Commission genetics (if possible) and return to step 3.<br>b) If not, hand off to ecology lead/regulator for policy decision.

   Now, let's run the three cases:

