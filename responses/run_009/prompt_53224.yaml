     a) This pattern is best explained by a combination of age effects (young people are always more comfortable) and period effects (everyone becomes more comfortable over time). (TR or E)
     b) This pattern also suggests a cohort effect: the cohorts that grew up in the digital age are inherently more comfortable. (RR: might argue that the period effect is actually a cohort effect because it's the cohorts that are changing)
     c) The pattern is a result of society labeling younger generations as tech-savvy, which encourages them to become so. (Constructivist)

