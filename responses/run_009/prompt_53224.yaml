  - If you have high scores in both RR and C, that is unstable because RR believes traits are discovered and not created by labeling, while C believes the opposite.

  - If you have high scores in both TR and E, note that TR believes in cohort effects (as statistical residue) and E does not. So they differ on Q5: TR says (c) and E says (b). Also, Q4: TR says (b) and E says (c). So if you have a mix, you might be in between.

  - If you have high scores in TR and C, that might be unstable because TR does not believe labeling creates the traits, while C does. They differ on Q2, Q3, Q7.

  Pairs that are hard to separate:

  - Thin Realist and Constructivist: They are separated by the role of labeling (Q2, Q3, Q7). But if a student answers inconsistently on those, they might end up with a mix.

  Finally, we note that the quiz has 8 questions, so each position has 8 preferred answers. The student's score for a position is the number of matches.

  We also note that there might be unoccupied combinations. For example:

  - High scores in RR and E: This is incoherent because RR believes in real cohort effects and E denies them.

  - High scores in RR and TR: They might be compatible? But RR believes in cohort effects as real kinds with objective boundaries, while TR sees them as statistical residue with arbitrary boundaries. So in Q1, RR is (b) and TR is (a). In Q4, RR is (a) and TR is (b). So they are different.

