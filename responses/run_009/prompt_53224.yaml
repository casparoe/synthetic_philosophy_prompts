  7. Case: A marketing firm creates a new generational label "Gen Alpha" for children born after 2010. They predict that this generation will be highly tech-integrated and environmentally conscious. They then run ads targeting these children and their parents, emphasizing these traits. Ten years later, surveys show that Gen Alpha is indeed more environmentally conscious than previous generations at the same age. What happened?
     a) The marketers correctly predicted the cohort's traits based on the events they would experience. (RR)
     b) The advertising campaign created a self-fulfilling prophecy by encouraging children to be environmentally conscious. (Constructivist)
     c) The observed difference is due to period effects (e.g., increased awareness of climate change) and age effects (children are more impressionable), not because of the generational label. (TR or E)

  8. Case: Consider a trait like "comfort with technology". We observe that 20-year-olds are more comfortable than 60-year-olds. We also observe that 20-year-olds in 2020 are more comfortable than 20-year-olds in 2000. And we observe that 60-year-olds in 2020 are more comfortable than 60-year-olds in 2000. What does this pattern suggest?
