     c) It shows that generational labels are becoming more influential over time. (Constructivist: but the pattern doesn't directly show that)

  But note: the pattern described is:
  - Cross-sectional: 20 > 60 in both 2000 and 2020 (age effect)
  - Time trend: both 20 and 60 are higher in 2020 than in 2000 (period effect)
  - And note that the gap between 20 and 60 might be the same or changing? The problem doesn't say. But the key is that we don't see a unique cohort effect because the same period effect is affecting everyone.

