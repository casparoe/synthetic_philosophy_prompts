prompt: |-
  so my advisor wants a one-page research proposal before she signs off on my term paper topic, and the topic is value of information. The thing everyone learns is Good's old result: a free, rational agent with coherent probabilities can never expect to be worse off after observing new evidence for free — always look before you leap. Then there are the exceptions everyone shrugs at, supposedly a grab bag: the agent has to be free to act on what she learns, the information can't cost anything, it can't be about the agent herself, other agents can't be watching. My suspicion is its not a grab bag at all. The exceptions look like they split into two kinds: ones where the information changes what *other* agents do (you leak your test result to the insurer, you signal just by asking a question, blackmail), and ones where the information is about *your own future choices* (you learn what you're going to do anyway, you precommit to not conditioning on it, updateless-style agents who would pay good money to stay ignorant). And behind both, maybe, one question: is the nonnegativity of information a theorem about your prior, or about your decision rule? It could be that causal and evidential decision theorists actually disagree about whether some free observation helps you, and "always take the free information" is only sound relative to one of them.

  turn this into the proposal: state the question precisely enough that it has a determinate answer, explain whats left open by the usual ways of carving up the exceptions, give the method (constructing cases where decision theories disagree about an observation's value, and checking exactly which premises of the proof each case breaks), say what would count as a result, what would count as the project failing, and whether one semester (~7000 words) is realistic or whether I should cut it down to just one of the two exception types. No lit review by citation — name the positions and arguments and I'll hunt down the references later.
reasoning: |-
  We are constructing a one-page research proposal. The topic is the "Value of Information" (VoI) and the exceptions to the nonnegativity of free information. The main goal is to investigate whether the exceptions to Good's theorem (which states that a rational agent with coherent probabilities cannot expect to be worse off from free evidence) can be unified into two categories: (1) when the information affects other agents' actions (e.g., signaling, blackmail) and (2) when the information is about the agent's own future choices (e.g., precommitment, updatelessness). Moreover, we want to examine if the nonnegativity of information depends on the decision theory (e.g., causal vs. evidential decision theory).

  The proposal should have:
  1. A precise research question.
  2. Explanation of what is left open by the usual categorization of exceptions.
  3. Method: constructing cases where different decision theories disagree about the value of an observation and checking which premises of Good's proof each case breaks.
  4. What would count as a result (success) and what would count as failure.
  5. Assessment of feasibility in one semester (about 7000 words) and whether to cut to one type.

  Structure the proposal as follows:

  **Title:** The Non-Negativity of Information: Unifying Exceptions through Decision-Theoretic Lenses

  **Introduction and Background:**
  - Briefly state Good's theorem: a rational agent with coherent probabilities, who can freely act on new evidence and for whom the information is free and not about herself (in certain ways), will never expect to be worse off from observing the evidence.
  - Note that the exceptions are often presented as a disorganized list (e.g., information cost, constrained actions, self-referential information, presence of other agents). 
  - Propose that these exceptions fall into two categories: (A) when the information affects other agents' actions (strategic interactions) and (B) when the information is about the agent's own future choices (leading to issues of self-prediction and commitment). 
  - Suggest that the heart of the issue might lie in the decision theory (DT) employed: perhaps Good's theorem holds under evidential decision theory (EDT) but not causal decision theory (CDT), or vice versa? Or maybe the nonnegativity is a property of the prior and the decision rule jointly?

  **Research Question:**
  Precisely: "Under what conditions does the expected value of information (VoI) become negative, and how does this depend on the agent's decision theory? Specifically, can we unify the known exceptions as either (1) strategic interactions (where the observation affects others) or (2) self-referential predictions (where the observation is about the agent's own actions), and show that in each case, the breakdown of nonnegativity correlates with a conflict between causal and evidential decision theories?"

  **Gap in Existing Literature:**
  - The existing literature (e.g., Good's original work, subsequent discussions in decision theory) lists exceptions but does not systematically unify them under two categories and does not explicitly link them to the choice of decision theory. 
  - The role of decision theory in the VoI nonnegativity is underexplored. For instance, in cases of self-prediction, updateless agents (as in UDT) might avoid negative VoI, whereas EDT or CDT agents might not.

  **Method:**
  - Construct a series of thought experiments that cover both types of exceptions (strategic and self-referential). 
  - For each scenario, compute the expected VoI under both CDT and EDT (and possibly other decision theories like UDT if time permits). 
  - Identify which premise of Good's theorem is violated in each case (e.g., freedom to act, no cost, no self-reference, no other agents) and note the correlation with the decision theory in use.
  - Analyze whether the negative VoI in each case arises only under one decision theory and not the other, and whether the two categories of exceptions are exhaustive.

  **Expected Outcomes and Significance:**
  - A unified framework for the exceptions to the nonnegativity of VoI, showing that they are not a grab bag but fall into two distinct categories, each tied to a specific failure of the decision theory to align with the assumptions of Good's theorem.
  - A clear account of how the nonnegativity of VoI depends on the decision theory: we expect that in cases of self-referential information, EDT might avoid negative VoI while CDT might not (or vice versa), and in strategic cases, both might fail but for different reasons.
  - This would advance decision theory by clarifying the role of decision rules in the value of information and potentially lead to a more nuanced understanding of when to seek information.

  **Feasibility and Timeline:**
  - One semester (about 7000 words) is realistic but tight. We propose to cover both types of exceptions by focusing on paradigmatic cases for each. However, if time becomes an issue, we will prioritize the self-referential category because it is less explored and more directly tied to decision theory. 
  - The project fails if: (a) the constructed cases do not clearly show a divergence between CDT and EDT regarding VoI, or (b) the two categories do not cover all major exceptions (e.g., if we find a third category that doesn't fit). In such a case, the project would still contribute by mapping the limitations.

  **Conclusion:**
  This project aims to provide a unified account of the exceptions to the non-negativity of information by linking them to the agent's decision theory and to two fundamental categories of exceptions. The results will clarify the theoretical boundaries of Good's theorem and the practical conditions under which information can be harmful.

  Now, write the proposal in one page (without the structure headings, as a continuous text). Remember to be concise.
answer: |-
  **Research Proposal: The Non-Negativity of Information and the Role of Decision Theory**  

  **Introduction and Background**  
  Good’s theorem—that a rational agent with coherent probabilities cannot expect negative value from free, costless information—is a cornerstone of decision theory. Yet its exceptions (e.g., information affecting other agents, self-referential predictions) are often dismissed as a disjointed "grab bag." I hypothesize these exceptions are unified: they arise from either (1) **strategic interactions**, where observation influences others’ actions (e.g., signaling to insurers), or (2) **self-prediction**, where information concerns the agent’s future choices (e.g., precommitment or updatelessness). Crucially, both may trace to a deeper question: is nonnegativity a property of the agent’s *prior beliefs* or their *decision rule*? I propose that causal (CDT) and evidential (EDT) decision theories may systematically disagree on the value of information (VoI), undermining the universality of "always look before you leap."  

  **Research Question**  
  Under which conditions does free information yield negative expected VoI, and how does this depend on the agent’s decision theory? Specifically:  
  - Can all exceptions be categorized as strategic or self-predictive?  
  - Do CDT and EDT diverge in their VoI assessments for these cases?  
  - Which premises of Good’s proof (free action, no cost, no self-reference, no other agents) does each exception violate, and does this align with the choice of decision theory?  

  **Gaps in Existing Frameworks**  
  Current analyses treat exceptions as isolated (e.g., Good’s caveats, blackmail paradoxes, or updateless agents). They fail to:  
  - Unify exceptions under a decision-theoretic lens (e.g., does EDT consistently avoid negative VoI in self-prediction cases while CDT fails?).  
  - Test whether nonnegativity holds only for specific decision rules (e.g., if "free information" is evaluated differently by CDT and EDT in strategic settings).  
  This leaves open whether Good’s theorem is fundamentally a claim about priors or decision rules.  

  **Method**  
  I will construct and analyze thought experiments where CDT and EDT disagree on VoI:  
  1. **Strategic cases**:  
     - *Example*: An agent tests for a disease; revealing the result to an insurer triggers premium changes.  
     - *Analysis*: Compute expected VoI under CDT (which ignores correlations with outsiders) vs. EDT (which accounts for evidence about others’ responses).  
  2. **Self-prediction cases**:  
     - *Example*: An agent learns their future action via a prediction, precommitting them to ignore it (à la Newcomb’s Problem).  
     - *Analysis*: Compare VoI in updateless agents (e.g., UDT) vs. CDT/EDT.  
  For each case, I will:  
  - Identify violated premises of Good’s proof (e.g., "freedom to act" fails in strategic cases; "no self-reference" fails in self-prediction).  
  - Map divergence in VoI to decision rules (e.g., does EDT’s focus on correlations explain negative VoI in signaling?).  
  - Assess if these categories exhaust known exceptions (e.g., costly information is excluded as non-free).  

  **Expected Outcomes and Significance**  
  - **Success**: (1) A unified taxonomy showing strategic/self-predictive exceptions cover all major cases; (2) Demonstration that CDT and EDT *do* conflict on VoI (e.g., CDT may deem self-predictive information harmful while EDT does not); (3) Proof that nonnegativity relies on decision rules, not priors alone. This would refine Good’s theorem and clarify when information harms.  
  - **Failure**: If (1) cases show no CDT/EDT divergence, (2) exceptions defy the two categories (e.g., a "third type" emerges), or (3) violations of Good’s premises are decision-theory-invariant. Even then, the project maps boundaries, showing nonnegativity is less universal than assumed.  

  **Feasibility**  
  One semester (~7000 words) is **realistic** with scope narrowed to **self-prediction exceptions**. Strategic cases (e.g., game theory) require more background, while self-prediction (e.g., Newcomb-like scenarios) is more novel and directly tests decision theory. I will:  
  - Prioritize 3–4 self-prediction cases (e.g., precommitment, updateless agents).  
  - Briefly address strategic cases in the conclusion if time permits.  
  - **Cut strategic cases entirely** if progress is slow; self-prediction alone suffices to test the core decision-theoretic claim.  

  **Conclusion**  
  This work challenges the fragmentation of VoI exceptions by linking them to decision theory. By proving CDT/EDT conflicts cause nonnegativity failures—especially in self-referential cases—it will clarify whether "free information" is universally beneficial or decision-rule-dependent.  

  ---  
  **References to Name-Drop** (no citations; I will source later): Good’s original theorem; Nozick on Newcomb’s Problem; Yudkowsky on updateless decision theory (UDT); signaling games (Spence); blackmail paradoxes (Schelling).
