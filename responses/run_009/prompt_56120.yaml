  For disagreements, I need precise formulations each side would accept. For instance, the asymmetrist would say creating happy people doesn't benefit anyone, while the totalist would say it improves the world state. The key is wording these neutrally without favoring either view.

  The cruxes are where things get interesting. The "better for" question - whether existence benefits a person - seems fundamental. Another is whether helping existing people vs creating new happy people are morally equivalent. The non-identity problem also creates challenges both sides must address.

  For test cases, I'll design scenarios that isolate these cruxes. The "Alone in the Void" case tests if existence can be better than non-existence. The "Two Children" case examines moral symmetry between creating happy people and helping existing ones. Each case needs clear predictions from both sides.

  Throughout, I must avoid strawmanning either position. Where wording conflicts arise, I'll choose the most neutral phrasing and explain why. For example, when discussing "benefit," I'll note the terminological dispute but emphasize the substantive disagreement about moral reasons.

