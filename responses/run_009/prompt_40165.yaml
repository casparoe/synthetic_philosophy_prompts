prompt: |-
  So I've been going down an American philosophy rabbit hole and I found this podcast episode (pop philosophy, kinda smug host but entertaining) on pragmatism, and now I can't tell what to trust from it. The host's bit went roughly like this: Peirce invented pragmatism with the claim that a belief's meaning is just its practical consequences, which he then applied to truth itself — truth is whatever the community of scientists agrees on, so truth is basically consensus, and if the consensus changes, what was true yesterday becomes false today. James, he said, took this and ran with it in the dangerous direction: truth is whatever works for you, meaning that if a belief is comforting, convenient, or useful to the person holding it, then it's true for them, full stop. The host's punchline was that on James's view, belief in Santa is true for kids who profit from the presents. He wrapped up saying Peirce was so appalled by where James took it that he renamed his own view "pragmaticism" specifically so James couldn't keep using the word, which he admitted was a pretty funny own.

  How much of this survives contact with the actual texts? I want to know specifically: (a) whether the Peirce part is fair — did he even offer a theory of *truth* like that, and is "whatever the community agrees on" the same as what he had in mind (the consensus thing sounded like it might be flattening something)? (b) whether "truth is whatever works for you" is James or a caricature — I've definitely seen him paraphrased that way, but I've also heard he had some stuff about beliefs having to cohere with each other and survive in the long run, and I can't tell if that's a real distinction or defenders doing damage control. (c) whether the Santa example is a legitimate application of James's view or a cheap shot that ignores something in the view. And (d) the pragmaticism renaming bit — is that actually why he did it, or is the host embellishing?

  Also, separately: the host said at the end that this whole tradition "collapses science into democracy," since if truth is consensus, climate science is just a vote. Does that follow from anything *accurate* in his summary, or only from the inaccurate parts? That's the bit I most want to untangle, because it's the kind of line people repeat at parties.

  Go easy on the jargon where you can — I've read basically none of these people directly, so tell me what I'd actually need to read to check this myself, without giving me a whole syllabus, just the one or two things that would settle it.
