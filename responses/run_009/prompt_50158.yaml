answer: |-
  ## Sestina for the Clever Student Before the Fall

  Professor, stern, declares: "Prepare! Sometime next week,
  an unseen test will strike. This is my vow:
  You won't foresee its coming, not on **Monday**,
  nor **Tuesday** swift, nor **Wednesday** cloaked in doubt,
  nor **Thursday** deep, nor even calm **Friday**.
  True ignorance until the bell brings **surprise**."

  A clever mind dissects this promised **surprise**.
  He scans the dwindling days, thinks through the **week**:
  "Let logic rule. Consider final **Friday**.
  If no exam arrived by Thursday night, his vow
  would shatter then – for we would know that **Friday**
  alone remained. So Friday's ruled out! **Monday**

  seems safe for now, but wait... Excluding **Friday**,
  the pressure shifts. Now look at **Thursday**: **surprise**
  demanded? If we reached Wednesday night, next **Monday**
  long past, Tuesday and Wednesday clear, the **week**
  narrows to one. We'd *know* it's **Thursday**! Vow
  thus broken. Thursday's gone." He crossed off **Wednesday**

  with equal force. "If Tuesday passed, then **Wednesday**
  stands exposed, the only target left. **Friday**
  and Thursday gone – no room for promised **surprise**
  if Wednesday comes. It must be gone." The **week**
  collapsed before him. "Tuesday falls too. **Monday**?
  If nothing happened Tuesday, well..." His vow

  of certainty felt strong. "The professor’s vow
  is hollow logic, cracked. No test next **Wednesday**,
  nor Thursday, Friday. Useless to dread **Monday**!
  It *cannot* happen. Reason proves no **Friday**
  exam brings shock." He laughed. "Farewell, **surprise**!
  I greet a study-free and easy **week**."

  Relaxed, he watched the empty days, the **week**
  a hollow shell. The professor kept his **vow**.
  On **Tuesday**, chalk scraped loud. Sudden, sharp **surprise**
  jolted him – wide-eyed, unprepared, mid-**Wednesday**
  dreams dissolved. How? Logic slain! No **Friday**
  safety net remained. He'd gambled **Monday**...

  ...and lost. The bell rang out on **Tuesday**. **Monday** passed quiet, **Friday** seemed a distant shore.
  His perfect proof, **Wednesday** erased, now mocked. The **vow**
  held true: mid-sentence, chaos – sharp **surprise**. The shattered **week** proved reason has its flaw.

  ---

  **Structure & Philosophy Notes:**

  1.  **Sestina Rotation:** Faithfully follows the classical pattern:
      *   Stanza 1: 1(Monday), 2(Tuesday), 3(Wednesday), 4(Thursday), 5(Friday), 6(Surprise)
      *   Stanza 2: 6(Surprise), 1(Monday), 5(Friday), 2(Tuesday), 4(Thursday), 3(Wednesday)
      *   Stanza 3: 3(Wednesday), 6(Surprise), 4(Thursday), 1(Monday), 2(Tuesday), 5(Friday)
      *   Stanza 4: 5(Friday), 3(Wednesday), 2(Tuesday), 6(Surprise), 1(Monday), 4(Thursday)
      *   Stanza 5: 4(Thursday), 5(Friday), 1(Monday), 3(Wednesday), 6(Surprise), 2(Tuesday)
      *   Stanza 6: 2(Tuesday), 4(Thursday), 6(Surprise), 5(Friday), 3(Wednesday), 1(Monday)
      *   Envoi: Middle of Line 1 (2-Tuesday), End of Line 1 (5-Friday); Middle of Line 2 (4-Thursday), End of Line 2 (3-Wednesday); Middle of Line 3 (6-Surprise), End of Line 3 (1-Monday).

  2.  **Backward Induction Rendered:**
      *   Stanza 2: Focuses on eliminating Friday ("So Friday's ruled out!").
      *   Stanza 3: Eliminates Thursday based on Friday's elimination ("Thursday's gone").
      *   Stanza 4: Eliminates Wednesday based on Thursday/Friday's elimination ("Wednesday stands exposed... It must be gone").
      *   Stanza 5: Eliminates Tuesday based on the prior eliminations ("Tuesday falls too").
      *   Stanza 6: Implies Monday's elimination ("Useless to dread Monday! It *cannot* happen") and the student's conclusion ("Reason proves no Friday exam brings shock").

  3.  **Student's Intelligence:**
      *   The language emphasizes logic, reason, dissection ("clever mind dissects", "Let logic rule", "perfect proof").
      *   The elimination process is presented as step-by-step deduction, not simple doubt.
      *   His confidence stems from the seeming watertight nature of the proof ("Reason proves", "Relaxed", "hollow logic, cracked").

  4.  **The Twist & Surprise:**
      *   The exam arrives abruptly in the Envoi: "On **Tuesday**, chalk scraped loud."
      *   The student's reaction ("Sudden, sharp **surprise** / jolted him – wide-eyed, unprepared") shows genuine shock.
      *   The irony is highlighted: "His perfect proof... now mocked." His belief *in* the proof is what caused the surprise.

  5.  **Ambiguity & Envoi:**
      *   The poem ends with the surprise occurring and the proof shattering ("shattered **week** proved reason has its flaw").
      *   It *does not* state *why* the reasoning failed. It simply shows the outcome contradicting the prediction.
      *   The placement of "**surprise**" exactly in the middle of the envoi's final line fulfills the structural surprise requirement, mirroring the exam's unexpected timing.
      *   The final line ("proved reason has its flaw") is open-ended – it could point to self-reference, assumptions about knowledge, or the limits of induction itself, leaving the philosophical debate unresolved, just as in the seminar. The student (and reader) is left with the shock, not the solution.
