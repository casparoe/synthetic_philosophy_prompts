          This matches our earlier result? Actually, in our first model (with flipping) we had net work = - min(p,1-p) * kT ln(2). But now we have a different expression. However, note that the new expression is symmetric in p and 1-p and equals the mutual information minus ln(2) (times kT) but wait:

