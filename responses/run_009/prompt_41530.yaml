  ### Constructed Case: Noisy Maxwell's Demon in a Szilard Engine
  **Scenario**: A single-molecule gas in a box of volume \(V\) is in thermal equilibrium with a heat bath at temperature \(T\). The demon measures the molecule's position (left/right) using a noisy detector: it reports the correct side with probability \(p\) and the wrong side with probability \(1-p\), independently per measurement. The demon knows \(p\) but cannot distinguish individual errors. Based on the measurement \(M\) (0: left, 1: right), it inserts a partition at the center and extracts work by allowing the molecule to expand isothermally against a weight. After extraction, the partition is removed, and the system resets. The demon records \(M\) in a one-bit memory tape. To operate cyclically, the memory must eventually be erased, costing work per Landauer's principle. All processes are classical and isothermal.

  ---

  ### Full Accounting (Per Cycle, in Units of \(kT\))
  1. **Measurement**:  
     The true state \(S\) (0: left, 1: right) is uniformly random: \(P(S=0) = P(S=1) = 1/2\).  
     The measurement \(M\) is correct with probability \(p\):  
     - Joint distribution:  
       \(P(S=0, M=0) = \frac{p}{2}\), \(P(S=0, M=1) = \frac{1-p}{2}\),  
       \(P(S=1, M=0) = \frac{1-p}{2}\), \(P(S=1, M=1) = \frac{p}{2}\).  
     - Mutual information (correlation between \(S\) and \(M\)):  
       \[
       I(S; M) = \ln 2 + p \ln p + (1-p) \ln(1-p) \quad \text{(nats)}.
       \]

  2. **Work Extraction**:  
     Given \(M\), the demon uses the posterior distribution \(P(S|M)\) to extract maximum work. The extractable work is \(kT \times I(S; M)\):  
     \[
     W_{\text{ext}} = \ln 2 + p \ln p + (1-p) \ln(1-p).
     \]  
     This is optimal and accounts for measurement noise. For example:
     - If \(p = 1\) (perfect), \(W_{\text{ext}} = \ln 2 \approx 0.693\).
     - If \(p = 0.75\), \(W_{\text{ext}} \approx 0.130\).
     - If \(p = 0.5\) (random), \(W_{\text{ext}} = 0\).

  3. **Erasure Cost**:  
     After extraction, the system is reset, decoupling it from memory. The memory bit \(M\) is random (since \(P(M=0) = P(M=1) = 1/2\)) and independent of the reset system. Erasing it to a standard state (0) requires work:  
     \[
     W_{\text{erase}} = \ln 2 \quad \text{(minimal cost for a random bit)}.
     \]

  4. **Net Work per Cycle**:  
     \[
     W_{\text{net}} = W_{\text{ext}} - W_{\text{erase}} = p \ln p + (1-p) \ln(1-p).
     \]  
     This is **always non-positive** (since \(x \ln x \leq 0\) for \(x \in [0,1]\)).

  ---

  ### Answers to Specific Queries
  1. **Cutoff for Positive Net Work?**  
     Jake is **incorrect**. \(W_{\text{net}} = p \ln p + (1-p) \ln(1-p) \leq 0\) for all \(p\), with equality **only** at \(p = 0\) and \(p = 1\):  
     - At \(p = 1\): \(W_{\text{net}} = 1 \ln 1 + 0 \ln 0 = 0\) (breaks even).  
     - At \(p = 0.51\): \(W_{\text{net}} \approx -0.692\) (negative).  
     Net work is **never positive**, regardless of \(p\). The demon cannot violate the second law.

  2. **Demon Usefulness and Symmetry**  
     - **Usefulness**: Demon is "useful" only in reducing losses. \(W_{\text{net}}\) is minimized (most negative) at \(p = 0.5\) (random guessing), where \(W_{\text{net}} = -\ln 2\). It is least harmful near \(p = 0\) or \(p = 1\).  
     - **Symmetry**: \(W_{\text{net}}\) is symmetric: \(W_{\text{net}}(p) = W_{\text{net}}(1-p)\). A demon with \(p = 0.25\) is identical to one with \(p = 0.75\):  
       \[
       W_{\text{net}}(0.25) = W_{\text{net}}(0.75) \approx -0.562.
       \]  
       Accuracy \(p\) is irrelevant; **correlation** (mutual information \(I(S; M)\)) determines extractable work.

  3. **Skipping Erasure: Borrowing Against the Tape**  
     - **Short-term**: If erasure is skipped, \(W_{\text{net}}^{\text{no erase}} = W_{\text{ext}} > 0\) (e.g., \(p = 0.75\) gives \(W_{\text{ext}} \approx 0.130\)). The demon seems to profit.  
     - **Long-term**: The memory tape accumulates \(n\) random bits (entropy \(n \ln 2\)). Resetting it later costs at least \(W_{\text{erase}}^{\text{total}} = n \ln 2\). Total work over \(n\) cycles:  
       \[
       \sum_{i=1}^n W_{\text{ext}}^{(i)} - W_{\text{erase}}^{\text{total}} = n \cdot I(S; M) - n \ln 2 = n \cdot W_{\text{net}} \leq 0.
       \]  
       The second law is **not embarrassed**: "Profits" are loans against future erasure costs. The demon borrows **free energy from the memory tape**, repaid upon resetting.

  ---

  ### Key Insight: Correlation Over "Intelligence"
  - **Real Work**: The demon’s utility stems solely from **correlation** (mutual information \(I(S; M)\)) between measurement and system. "Intelligence" is a red herring; even a "usually wrong" demon (\(p < 0.5\)) is equivalent to its "usually right" counterpart (\(p > 0.5\)) via output inversion.  
  - **Landauer’s Principle as Accounting**: Critics might argue Landauer’s cost is conventional—e.g., if the tape is not reset, "debt" is ignored. However:  
    1. Physical memory has finite capacity; avoiding erasure indefinitely is impossible.  
    2. The tape’s increasing entropy represents stored heat, which must be dissipated to reset it (enforcing the second law).  
    **Rebuttal**: The accounting is physical—erasure dissipates \(kT \ln 2\) per bit to the bath, increasing global entropy.

  ---

  ### Summary
  - **Net Work**: \(W_{\text{net}} = p \ln p + (1-p) \ln(1-p) \leq 0\).  
  - **Symmetry**: \(p\) and \(1-p\) yield identical performance.  
  - **Erasure Debt**: Skipping erasure delays but does not prevent net energy cost.  
  - **Core Principle**: Correlation \(I(S; M)\) sets the work ceiling; noise (\(p \neq 0,1\)) ensures \(W_{\text{net}} < 0\).  
  **Jake’s linear-profit model is falsified; the TA’s dismissal overlooks that mutual information—not idealization—resolves the paradox.**
