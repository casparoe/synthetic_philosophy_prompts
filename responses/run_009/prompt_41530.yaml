     Conclusion: the key feature is the mutual information between the system and the memory. The work that can be extracted is exactly kT times the mutual information. The erasure cost is kT ln(2) because the memory is a random bit independent of the system at the time of erasure. Therefore, the net work is:

          Net work = kT * I(S;M) - kT * ln(2) 
