prompt: |-
  My housemate is a physics grad student and I'm the philosophy person in the apartment, and she's decided it's her job to convert me to the block universe with an argument she found that goes back to Rietdijk and Putnam in the sixties. It goes roughly like this. (1) Take any event far enough away that light can't yet have gotten between it and me, and an observer moving suitably relative to me: in that observer's frame, the event is simultaneous with some event on my worldline, so if the event is real for them it's real for me. (2) Because simultaneity is frame-relative you can zigzag a chain of observers, each simultaneous with the next, from here-and-now to an event that is in my absolute future in every frame -- say, whether I sign the lease on a new apartment next month. (3) Reality transmits along the chain: what's real for someone whose events are real for me is real for me. (4) So the lease decision is already real now, already a determinate fact. (5) And a fact about what I'll decide that exists before I've deliberated isn't up to me in any interesting sense, so the future is as closed as the past and my deliberation next month is theater. She's very pleased with herself and says the physics kills free will without any philosophy having to lift a finger.

  Here's my problem. When I push back she escalates: she now claims the argument also shows that a quantum measurement next week, one even she agrees is genuinely chancy, already has a definite outcome for me now, and that there's no room for objective chance anywhere in the future, because it's all equally fixed by the chain. That's where she loses me, because as far as I can tell nothing in the premises says anything about how the facts got there -- the chain is built entirely out of simultaneity relations, and none of them connect my present to the event's causes. So her move from (4) to (5) looks to me like it would go through just as well in a Newtonian universe with an omniscient bookkeeper, or even for a coin flip nobody has fixed: it's already true now that the coin lands heads or lands tails, and if "already a fact" meant "not up to me" then deliberation about anything would be pointless in every possible world whatever the physics says, which is the fatalist argument Aristotle already had to deal with, wearing a spacetime costume. But when I say this she just shrugs and says fine, maybe it does prove all that, maybe deliberation is always theater. Meanwhile I have a separate worry that the fish is actually in step (3), that "real for an observer" is a relation and relations like that don't obviously chain, but if I deny (3) I seem stuck with each observer having their own private inventory of what exists, which sounds worse than fatalism. Tell me where the argument actually goes wrong, which step I should be refusing and what refusing it costs me -- I'd like to keep the block universe if I can since it's the one part of this I feel like I understand, but I genuinely can't decide whether the mistake is the transitivity step or the slide from determinate to not-up-to-me. Write it as plain prose, no headings or bullet points or bold or anything, like a long email, and don't bother with a reading list.
