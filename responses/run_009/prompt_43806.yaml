prompt: |-
  I'm TAing a 200-level metaphysics course — 18 students, one 75-minute section, a room with movable desks. We just covered the special composition question, i.e. under what conditions do some things compose a further thing, and the students have mostly decided it's verbal bookkeeping: whether the bolt-and-nut assembly on the table is one object or two is just a way of talking, nothing worth fighting over. I was complaining about this to the instructor over coffee and she said stop assigning more reading and make them do something instead. So: I want an activity where they run into the question themselves, before anyone names it for them. The moment I'm after is the one where every physical fact about a setup is fixed — positions, what's glued, what's resting on what, what's touching — and they still catch themselves genuinely unsure, and arguing with each other, about how many objects are sitting there. And then a second moment, where they notice that no further observation would settle it: the missing fact isn't a physical one, and no measurement is coming to the rescue.

  I can bring materials: a duffel of junk — a chipped teacup that's been glued back together, a loose stack of books, a handful of hex nuts, a bag of sand, some velcro strips, a dead phone. Have them stage scenes with that, or propose your own materials if you think something else works better. What I want from you is a full design: setup, roles (I'm imagining some students act as registrars who have to issue a list of the objects in a scene and commit to it, and others as auditors of some kind — but you tell me), a timeline that fits 75 minutes, and a scoring scheme that doesn't use real money. Here's the trap I want built into the scoring: the participants should be rewarded for something, so their choices have stakes and they invest in them — but the payoffs should quietly never depend on how many objects they counted. They argue hard about the count, and then discover the count did no work anywhere in the game. That's the engine of the whole thing.

  Then a debrief that maps what actually happened onto the real positions — nihilism, unrestricted composition, the restricted answers like composition only occurring in living things — and onto the argument from vagueness that people use to push toward unrestricted composition. Two things I want you to be honest about. First, what will predictably go wrong the first time I run it: I assume some students will refuse to take the counting seriously at all, and others will just pick a convention quickly and thereby miss the point — how do I handle that in the moment without just telling them the answer? Second, which part of the actual debate the activity can't reproduce and I'll have to supply myself in the debrief. My own guess is the activity can generate the felt arbitrariness of any cutoff, but can't reproduce the sorites-style reasoning that makes unrestricted composition look like the only principled option — if you agree, say how I bridge that gap in the debrief without it collapsing into a lecture, which is exactly what I'm trying to avoid.
reasoning: |-
  Okay, let me tackle this TA's problem step by step. They need an activity for a metaphysics class where students confront the special composition question firsthand. The core goal is to create a situation where students genuinely argue about how many objects exist in a given setup, then realize that counting doesn't actually affect outcomes. 

  First, I consider the instructor's advice: stop assigning readings and make them do something. The materials mentioned—glued teacup, books, hex nuts, sand—are perfect for creating ambiguous compositions. The key is to design scenarios where physical facts are fixed but object counts remain debatable. 

  The scoring trap is crucial. Students should care deeply about counting during the activity, only to discover later that it was irrelevant. I'm thinking about a game with registrars who list objects and auditors who challenge those lists. Points could be awarded for consensus or successful challenges, but the scoring must secretly never depend on the actual count. Maybe points come from agreement or catching inconsistencies, not the numbers themselves. 

  For the setup, dividing the class into small groups seems practical. Each group builds a scene with provided materials, then registrars from other groups count objects while auditors watch. Rotating roles ensures everyone engages with the ambiguity. The timeline needs to fit 75 minutes: 10 min intro, 20 min scene-building, 30 min counting/challenges, 15 min debrief. 

  I anticipate problems: some students might dismiss the task as silly, while others might rigidly adopt conventions (e.g., "only count what's glued"). To handle this, the rules should emphasize that any counting method is allowed but must be defensible. The instructor can subtly challenge quick conventions by asking "What if we moved this slightly?" during audits. 

  The debrief must connect the activity to real philosophical positions. The activity can show arbitrariness but not the sorites paradox pushing toward unrestricted composition. To bridge this, I'll prepare Socratic questions: "If adding one sand grain doesn't create a new object, when does it?" This can lead into discussing vagueness without lecturing. 

  Materials-wise, adding clay and magnets introduces more ambiguity—like whether attached magnets count as one object. The scoring system rewards persuasion and consensus, not correct counts. Auditors earn points by spotting contradictions, registrars by defending lists consistently. 

  Finally, the reveal: showing scoreboards where groups with wildly different counts have similar points. This drives home that counting was inconsequential. The debrief then links this to nihilism, universalism, etc., using the students' own frustrations as entry points.
answer: |-
  Here’s a full activity design, "The Registry Game," engineered to create the "aha" moment you want — where students confront the arbitrariness of composition through lived frustration, then discover their counting efforts were functionally irrelevant.

  **Core Structure:**  
  Teams build physical scenes. "Registrars" count objects in another team’s scene under time pressure. "Auditors" challenge counts. Points are awarded for consensus and defensibility, **never** for matching a "correct" count (which doesn’t exist). The scoring is rigged to make counting *feel* vital while being operationally meaningless.

  **Materials (Duffel of Junk):**  
  - Glued-then-chipped teacup  
  - 3-4 books (loose/unbound if possible)  
  - 10 hex nuts (some loose, 2-3 pre-loosely-threaded onto a bolt but not tightened)  
  - Bag of sand (~1 cup)  
  - Velcro strips (some attached, some loose)  
  - Dead phone (with removable battery if possible)  
  - *Additions: Small clay lump, 2-3 weak magnets (can attach/detach easily), a rubber band.*

  **Setup (5 mins):**  
  1. **Divide Class:** 3 teams of 6 students each.  
  2. **Assign Roles/Rules:**  
     - **Builders (3 per team):** Create a "scene" on a table using materials. Goal: Make object-counting *ambiguous* (e.g., stack books precariously, half-bury the teacup in sand, attach magnets to the phone).  
     - **Registrar (1 per team):** Visits *another* team’s scene. Has 3 mins to produce a numbered list: "Objects in Scene" (e.g., "1. Teacup, 2. Book stack, 3. Loose hex nut...").  
     - **Auditor (2 per team):** Reviews *a third team’s* Registrar list against the actual scene. Can challenge any count (e.g., "Why is the book stack one object? Each book is separate!").  
  3. **Scoring Rules (Emphasize these):**  
     - **Registrar** gets 2 pts if their list is *unchallenged*.  
     - **Auditors** get 1 pt per *upheld* challenge (Registrar concedes the count was flawed).  
     - **Registrar** gets 1 pt per *defended* challenge (Auditor backs down).  
     - **Team Bonus:** 3 pts if all roles in a team score *something*.  
     *(Crucially, points depend ONLY on agreement/disagreement dynamics, NOT the count itself).*  

  **Timeline (75 mins):**  
  1. **Intro & Role Assign (10 mins):** Explain roles, rules, scoring. Stress: "Your goal is to score points by creating defensible lists/challenges. Physical facts (positions, attachments) are fixed during counting. No new gluing/breaking!"  
  2. **Scene Building (15 mins):** Builders construct ambiguous scenes. *Circulate:* "How can you make counting hard?" "Is that sand one thing or many?"  
  3. **Rotation 1: Counting & Challenges (20 mins):**  
     - Registrars move to *assigned* scene (not their team's), count, write list.  
     - Auditors move to *their assigned* scene, get Registrar's list, discuss challenges.  
     - **Facilitate Conflicts:** "Auditor, explain your challenge. Registrar, defend your count. Do you concede or defend?" Record scores.  
  4. **Rotation 2 (15 mins):** Roles rotate *within teams* (Builder becomes Auditor, etc.). New scenes (or subtly modify old ones: flip a book, add a nut). Repeat counting/challenges.  
  5. **Score Reveal & Silent Reflection (5 mins):** Tally scores publicly. Ask: *"Glance at the scenes and the scores. What patterns do you see? Jot down one observation."*  
  6. **Debrief (20 mins):** Guide discussion using questions. *Reveal the trap last.*  

  **The Trap & Predictable Problems:**  
  - **The Trap:** Teams will argue intensely about counts to score points. High-scoring teams will have wildly different counts (e.g., Team A: "Sand pile=1 object", Team B: "Each grain=1 object, 200+ objects!"). **Reveal:** "Check the scores. Did anyone's points *depend* on whether the sand was 1 object or 200? What *did* the points depend on?" → Points depended solely on social negotiation (agreement/defensibility), not ontology.  
  - **Problem 1: Students dismiss the task.**  
    *Handle it:* Frame it competitively ("Which team can master the registry system?"). After Rotation 1, most get invested in scoring. If resistant, assign them as Auditor – challenging forces engagement.  
  - **Problem 2: Quick conventions ("Glued=1 object").**  
    *Handle it:* As facilitator, whisper to Auditors: "Is glued *always* one object? What about this weak magnet?" or ask Builders to make a scene that breaks the convention (e.g., a nut glued to a book, but resting on a separate nut pile). Force inconsistency.  
  - **Problem 3: "It's all arbitrary!" early.**  
    *Handle it:* Agree. "Sure! But *your job* is to get points within this arbitrary system. Play the game." The scoring trap makes them *feel* the arbitrariness despite knowing it intellectually.  

  **Debrief Structure (Key Questions):**  
  1. **"What was frustrating?"** → Surface the moment of uncertainty ("We couldn’t agree if the phone+battery was one or two!").  
  2. **"What strategies worked for scoring?"** → Highlight negotiation, persuasion, convention-creation – not "accurate counting."  
  3. **"What couldn’t observations solve?"** → Emphasize: Fixed physical facts, no new data helped. "What *kind* of fact was missing?" (Metaphysical fact about composition).  
  4. **MAP TO THEORY:**  
     - **Nihilism:** "Did anyone think *nothing* truly composes a new object? Just atoms/sand grains?" (Rare, but point out it avoids vagueness).  
     - **Universalism (Unrestricted):** "Did anyone list 'Teacup + Top Book + 3 grains of sand' as an object? Why not?" → Too many objects, but principled (no arbitrary cutoffs).  
     - **Restricted Views:** "Who used 'glued together' or 'functional unity' (like the phone) as a rule? Where did that rule break down?" (Chipped cup? Dead phone?).  
  5. **BRIDGE THE GAP (Sorites/Principled Argument):**  
     - *The activity can't replicate sorites pressure.* **Bridge it:** "Let’s take the sand pile. If I remove one grain, is it still a pile? If yes, what about removing another? And another? [...] If there's no sharp cutoff between heap/non-heap, does that mean *every* collection of grains is a heap? Or *no* collection is? How does this relate to the bolt-and-nut?"  
     - **Socratic Push:** "If composition isn't all-or-nothing, what *determines* when it happens? Can you define 'contact' without vagueness? 'Function'? If all answers have borderline cases, does unrestricted composition win by default?" *Let them wrestle.* Then note: "This is the sorites argument pushing toward universalism. The activity showed you the *arbitrariness*; this reasoning points to a *conclusion*."  

  **Why This Works:**  
  - **Embodied Ambiguity:** Students *create* and *confront* vagueness (stacked books, sand, magnets).  
  - **Scoring Trap:** They care intensely about counting, then discover it was a decoy – mirroring the "verbal bookkeeping" insight.  
  - **Debrief Leverage:** Their frustration fuels the theoretical discussion. You’re not lecturing; you’re helping them interpret their own experience.  

  **Prep Tip:** Pre-build 1-2 "practice" scenes yourself to anticipate ambiguities. Bring a whiteboard to track scores and list "contested objects" during the debrief. The dead phone and sand are your MVPs – exploit them ruthlessly.
