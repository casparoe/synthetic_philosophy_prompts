prompt: |-
  I work on large legacy software systems, and I've noticed a configuration I can't find a proper word for. Some objects in a system seem to exist only relative to a particular way of predicting the system — but once you adopt that way of predicting, they behave exactly like ordinary objects: they persist through changes, they have locations, you can intervene on them and the intervention works. Two examples. In a flocking simulation, no line of code mentions a flock; every agent follows purely local rules. Yet the flock — its centroid, its habit of splitting when startled — is by far the most compact way to describe what the screen will look like in ten seconds, and if I drop an obstacle into the flock's path, the flock responds in the flock-level description just as an object of that shape would. In the codebase I maintain, nothing anywhere stores the user's intentions, but treating the input-handling subsystem as if it believes the user wants a certain outcome and is trying to bring it about predicts that subsystem's behavior far better than any specification or trace I can write down. In both cases the pattern is not written into the system; it is a compression you can find in the system, and it beats the literal description.

  Two features make me suspect this is not just what people loosely call emergence. First, whether the pattern is present seems to depend on the observer's budget: an observer with unlimited time and memory could simply run the micro-level forward and would never need to posit the flock at all, so the pattern's existence appears to be indexed to observers who, like me, are in a hurry. Does that make the flock real, or merely real-for-us, and is there a principled distinction between those? Second, the boundaries wobble: two different predictive shortcuts over the same codebase pick out slightly different subsystems — one includes the retry logic, one doesn't — and both compress well, so which of them is the real object? Is there an established concept or literature for patterns that exist by out-competing the literal description of a system, together with the observer-dependence and boundary problems that follow? I would also like to know how the answer distinguishes these from merely useful fictions, since the patterns support interventions and counterfactuals in a way ordinary fictions do not; and if there is no established concept, I would settle for a careful definition and some boundary cases.
reasoning: |-
  Okay, let me unpack this user's query. They're describing a phenomenon in complex systems where certain patterns—like a flock in a simulation or user intentions in a codebase—act as predictive tools despite not being explicitly coded. The user is questioning whether these patterns are "real" or observer-dependent constructs, especially given boundary ambiguities and varying computational budgets.

  First, I need to recognize their core tension: they're noticing that these patterns are functionally real (supporting interventions/counterfactuals) but ontologically fuzzy (observer-dependent, boundary-relative). Their examples are brilliant—flocking and intention-ascription—because they demonstrate compression *and* causal efficacy. 

  The user is clearly deeply familiar with complex systems and philosophy of mind (mentioning "merely useful fictions" suggests they've read Dennett or Vaihinger). Their frustration with "emergence" as an underspecified term is justified. Two nuances stand out: 
  1. **Observer-budget dependence**: The flock "exists" only for resource-constrained observers. This echoes computational irreducibility—if you could simulate every particle, the macro-pattern adds no value.  
  2. **Boundary wobble**: Their codebase example shows competing subsystem boundaries (with/without retry logic) that both work. This isn't just coarse-graining; it's multiple valid mappings.  

  I should avoid regurgitating emergence 101. They need precision. Key angles:  
  - **Epistemic vs ontological**: Are these patterns "in" the system or "in" the model? But their intervention point ("obstacles affect flocks") suggests it's not purely epistemic.  
  - **Pragmatic realism**: Dennett's real patterns framework fits perfectly—it defines reality by predictive resilience *at a compression level*.  
  - **Multiple realizability**: The boundary wobble implies supervenience without reduction. The system admits *many* compressed descriptions.  

  Literature-wise, Dennett is essential, but also:  
  - **Control theory's "quasi-objects"** (like centers of pressure)  
  - **Causal emergence** (Rosas, Hoel) quantifies informational advantage of macro-models.  
  - **Mechanistic explanation** (Craver) for boundary relativity.  

  Their "useful fictions" challenge is critical. Unlike fictionalism (e.g., "economic agents"), these patterns:  
  - **Ground interventions** (obstacles alter flock paths)  
  - **Support counterfactuals** ("if the flock density were higher...")  
  This pushes toward *instrumental realism*: real *because* they reliably participate in causal networks.  

  Boundary cases to test:  
  - **Pathological compression**: A horoscope that "predicts" stock markets by coincidence lacks intervention-support.  
  - **Overfitting**: A description that compresses history but not future states.  
  - **Non-composable patterns**: Two good compressions that break when combined.  

  Finally, their meta-need: labeling this phenomenon. "Real pattern" is close but may undersell boundary fluidity. Alternative: *pragmatically stable projection*. But Dennett's term is established. Emphasize that wobble *isn't* a flaw—it reflects underdetermination by micro-dynamics, like quantum decoherence allowing multiple classical bases.
answer: |-
  Your description captures a profound phenomenon that straddles philosophy of science, complex systems theory, and software engineering. This is **not merely "emergence"** in the colloquial sense—it's a specific class of pattern that is **observer-relative, prediction-optimal, and intervention-supporting**. The established framework addressing this is **Daniel Dennett's "Real Patterns"** (1991), but your examples reveal deeper nuances requiring synthesis with other ideas.

  ### Core Concept: **Real Patterns (Dennett)**
  Dennett argues that a pattern is "real" if:
  1. **It compresses information** better than storing/processing raw data.
  2. **It reliably predicts behavior** across contexts.
  3. **It withstands noise/variation** (i.e., it's robust to perturbations).
  Crucially, **reality is indexed to the observer's predictive goals and computational constraints**. In your flocking example, the flock is "real" because positing it lets you predict/systematically intervene on the system *far more efficiently* than tracking individual agents. It's not "in the code" but is a **projection of the system's structure onto an efficient predictive model**.

  ---

  ### Addressing Your Specific Concerns
  #### 1. **Observer-Budget Dependence**  
  - **Dennett's answer**: The pattern *is* real-for-us, but "for-us" is the only coherent reality. An omniscient observer with infinite resources sees only atoms/bits, but *no observer fits this description*. Thus, patterns are real **relative to pragmatic constraints**.  
  - **Key insight**: The pattern's reality arises from **computational irreducibility** (Wolfram). Simulating every particle is intractable; the compressed description (flock/intention) is *necessary* for timely prediction. If the compression is optimal (minimizes prediction error per bit), it transcends subjectivity.  
  - **Boundary case**: A horoscope might "compress" stock market data coincidentally but fails under intervention. Your patterns *do* support interventions, proving their mind-independence.

  #### 2. **Boundary Wobble**  
  - This reveals **multiple realizability**: The same micro-state can support *multiple* valid macro-patterns.  
  - **Example**: Your input-handling subsystem could be bounded with/without retry logic. Both compress well because:  
    - The system exhibits **near-decomposability** (Simon): Subsystems interact weakly, allowing overlapping boundaries.  
    - **Causal emergence** (Rosas et al.): Macro-level variables (e.g., "user intention") can have greater causal power than micro-variables in specific contexts.  
  - **Resolution**: The "real" object is the one that **maximizes causal information flow** (quantified via integrated information or mutual information). If both compressions are optimal for *different prediction tasks*, both are real relative to those tasks.

  ---

  ### Distinguishing from "Useful Fictions"
  These patterns are **not fictions** because they:  
  1. **Support interventions**: Dropping a barrier *reliably* deflects the flock; changing UX *reliably* alters input-handling. Fictions (e.g., "phlogiston") fail under intervention.  
  2. **Generate counterfactuals**: You can reason about "what the flock would do if startled" or "how input-handling would respond to a new error." Fictions lack this.  
  3. **Are objectively discoverable**: Different observers converge on similar compressions when optimizing prediction (e.g., biologists agree flocking behavior exists).  

  **Boundary case**: A "useful fiction" would be treating a random number generator as "having preferences." It might coincidentally compress past outputs but fails at prediction/intervention. Your patterns *pass* this test.

  ---

  ### Literature and Extensions  
  1. **Dennett's Real Patterns** (1991): Foundational for observer-relative realism.  
  2. **Causal Emergence** (Hoel, Rosas, et al.): Quantifies when macro-scales have more causal power than micro-scales.  
  3. **Computational Mechanics** (Crutchfield): Uses ε-machines to find minimal predictive models in dynamical systems.  
  4. **Mechanistic Explanation** (Craver): For boundary wobble—objects are "real" within a mechanistic model if they play a role in causal structure.  

  ---

  ### Proposed Definition  
  **Pragmatically Stable Projection (PSP)**:  
  > A pattern in a system is a PSP if:  
  > - (a) It provides **optimal lossy compression** (minimal description length for maximal predictive accuracy) for a given observer's computational constraints;  
  > - (b) It **supports valid interventions and counterfactuals**;  
  > - (c) Its boundaries may **overlap or shift** with alternate PSPs, but each maximizes causal information for a specific prediction task.  

  **Your examples**:  
  - The flock is a PSP for predicting group motion under resource constraints.  
  - "User intention" is a PSP for explaining input-handling behavior. Neither is fictional—both are **causal invariants** under compression.  

  This framework resolves your concerns: observer-dependence is a feature (not a bug), boundary wobble reflects task-relativity, and the distinction from fiction lies in intervention-support. PSPs are the "real joints" of complex systems when we carve nature at its *computationally efficient* seams.
