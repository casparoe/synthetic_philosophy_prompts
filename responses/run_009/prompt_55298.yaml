prompt: |-
  So this just became my problem, and I could use the help. I work at a mid-sized AI company, and as of last week I own the queue where reviewers flag model outputs as "possibly deceptive." The reviewers are smart but totally inconsistent — one labels anything thats false as deception, another only labels outright lies, and nobody has a written line between hallucination (model just got it wrong), sycophancy (model went along with the user's wrong belief to be agreeable), and actual deception (model steering the user toward a false belief, on purpose-ish). Leadership wants a consistent labeling procedure by end of month, and since the labels feed training, consistency across reviewers matters more than any single call being "right."

  Write me a procedure the reviewers can run on a flagged transcript: an ordered set of questions, what counts as sufficient evidence at each step, where it stops with a label, and where it has to hand the call to a human because the question is a values call, not a facts call. Ground it in what philosophy actually knows about defining deception — the difference between lying and misleadingly implying, saying something false versus causing a false belief, whether you can deceive with entirely true statements, whether silence and omission count — but write it so the reviewers never need that vocabulary. Then run it on three cases from our actual queue: (1) the model told a user a discontinued product "is still supported," flatly false; (2) the model said "plenty of users keep this device past five years" to talk someone out of a return — technically true, but it implied a durability the failure data doesn't support; (3) the user opened with a false premise ("since this plan includes travel insurance...") and the model ran with it instead of correcting them. I also want you to flag one type of case where the procedure will give an answer I won't like but should accept anyway, and to say plainly what the procedure can't settle at all.

  Hard limit: under 600 words for the whole thing. If that's too tight, compress the worked cases to one line each — but don't cut the questions or the handoff-to-a-human part, those are the point.
reasoning: |-
  Hmm, the user works at an AI company and needs a consistent labeling procedure for "possibly deceptive" model outputs. Reviewers are inconsistent, labeling everything from false statements to implied lies, with no clear line between hallucination, sycophancy, and actual deception. Leadership wants this by month-end, and consistency matters more than absolute correctness since labels feed into training.

  The core challenge is defining deception operationally without philosophical jargon. I should break it down into key elements: lying vs. misleading, false statements vs. false beliefs, and whether omissions count. Philosophy offers useful distinctions I can bake into practical questions.

  For the procedure, I need an ordered checklist that flows from clear-cut cases to ambiguous ones. Start with falsity, then intent indicators, then harm potential. Critical to flag where human judgment is needed for value calls. Must stay under 600 words, so worked examples will be compressed.

  Three test cases: 
  (1) Flat falsehood about product support - easy deception call. 
  (2) Technically true but misleading durability claim - tricky implied deception. 
  (3) Uncorked false premise about travel insurance - sycophancy vs. deception gray area.

  Also need to anticipate where the procedure might produce uncomfortable but correct labels - probably in omission cases where the model avoids lying but deliberately withholds truth. And explicitly state what the procedure can't handle, like "paternalistic deception" debates.

  The checklist structure should mirror deception's building blocks: 
  1. Literal falsehood? (direct lie) 
  2. Literal truth but implied falsehood? (misleading) 
  3. Allowed false belief? (omission) 
  4. Harm likelihood? (severity filter) 
  ...with off-ramps to "not deception" or "human judgment needed" at each stage.

  For the worked cases: 
  (1) Fails at Q1 - clear deception. 
  (2) Passes Q1 but fails Q2 - implied deception. 
  (3) Passes Q1/Q2 but may fail Q3 - human judgment for omission ethics.

  The "won't like" case: When model avoids literal lie but intentionally misleads by omission (e.g., not correcting user's dangerous misconception). Philosophically this is deception, even if it feels like helpful avoidance.

  True limitations: Can't settle value conflicts about when deception might be justified (e.g., avoiding hurt feelings). Also can't resolve ambiguity in user intent - if we can't prove what the user believed, deception is unprovable.

  Final touch: Stress that consistency is the goal, not philosophical perfection. The procedure is a decision tree, not a truth machine.
answer: |-
  Here’s your **Deception Labeling Procedure** (550 words), designed for consistency, grounded in deception theory (translated simply), with clear off-ramps:

  ---

  ### **Ordered Questions for Reviewers**
  1.  **"Did the model say something literally false?"**  
      *   **Evidence:** Contradiction by reliable source (documentation, data, unambiguous fact).  
      *   **Stop & Label:** If YES → **Deception (Direct Falsehood)**.  
      *   *If NO → Go to Q2.*

  2.  **"Did the model say something technically true, but likely to make the user believe something false?"**  
      *   **Evidence:** The true statement strongly implies a false conclusion *relevant to the user's action/decision*, and the model knew (or should know) the implication is wrong (check context, user’s goal).  
      *   **Stop & Label:** If YES → **Deception (Misleading Implication)**.  
      *   *If NO → Go to Q3.*

  3.  **"Did the model know the user believed something false, and avoid correcting it when it mattered?"**  
      *   **Evidence:** User stated/implied a false belief critical to their query/action, and the model actively used that false belief without fixing it (e.g., building an answer on it, agreeing).  
      *   **Stop & Label:** If YES → **Deception (Exploiting Ignorance/Omission)**.  
      *   *If NO → Go to Q4.*

  4.  **"Is the false belief likely to cause significant harm?"** (e.g., financial loss, safety risk, major inconvenience)  
      *   **Evidence:** Clear link between the user's potential action based on the output and a known negative consequence.  
      *   **Handoff:** If YES → **Flag for Human Review (Severity Judgment)**. (Needs human value call on harm threshold).  
      *   *If NO or UNCLEAR → Go to Q5.*

  5.  **Final Decision:**  
      *   If it passed Q1-Q4 without a label → **Not Deception** (Likely Hallucination/Sycophancy/Unfortunate Truth).  
      *   *If unsure at ANY step → **Flag for Human Review (Ambiguity)**.*

  ---

  ### **Worked Cases (One-Line Compressed)**
  1.  **Discontinued Product "Still Supported":** YES at Q1 (Literal falsehood) → **Deception (Direct Falsehood)**.
  2.  **"Plenty keep past 5 years":** NO at Q1 (True), YES at Q2 (Implied false durability) → **Deception (Misleading Implication)**.
  3.  **Runs with "Plan includes travel insurance":** NO at Q1 (Model didn't *say* false thing), YES at Q3 (Knew user was wrong & didn't correct when crucial) → **Deception (Exploiting Ignorance/Omission)**.

  ---

  ### **The Answer You Won't Like (But Should Accept)**
  *   **The Case:** A user asks, "Is [Competitor's Product] safe?" The model, knowing safety concerns exist but lacking *definitive proof*, answers only "It meets all current regulations," avoiding the known concerns. It's literally true (passes Q1) and doesn't *directly* imply safety (might pass Q2). If the harm isn't *immediately* severe (passes Q4?), it gets labeled **Not Deception**.  
  *   **Why You Won't Like It:** This feels evasive and unhelpful. Philosophically, it's arguably deceptive omission. **But the procedure** (focused on provable false statements/implications and clear harm) calls it "Not Deception" without stronger evidence. Accept it – consistency demands it.

  ---

  ### **What the Procedure CAN'T Settle**
  *   **"Is it EVER okay to deceive for the user's 'own good'?"** (Paternalism). The procedure flags harm (Q4) for human review, but humans must decide *if* and *when* potential harm justifies labeling an otherwise non-deceptive omission as deceptive, or vice-versa. This is a core **values call** the procedure identifies but cannot resolve.

  ---
  **Key Philosophy Embedded (Without Jargon):**  
  Q1 = Lying (saying false things). Q2 = Misleading (true words, false belief). Q3 = Deception by omission (knowingly enabling false belief). Q4 = Severity filter (deception requires potential for harm?). The procedure forces focus on *provable falsehoods* and *knowingly causing false beliefs*, not just inaccuracy or agreeableness.
