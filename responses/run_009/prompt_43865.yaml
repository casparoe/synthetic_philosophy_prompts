prompt: |-
  I'd like to practice defending epistemicism about vagueness against a serious opponent. Please play a committed supervaluationist — one who genuinely believes vagueness is semantic indecision rather than hidden ignorance — and stay in character until I say 'stop'. Give real arguments from your position's resources, concede small points when you should but never the core view, and keep each reply to about a paragraph so it feels like a live exchange.

  So we're on the same page: I hold the epistemicist line that every vague predicate has a sharp cutoff — there is some number of hairs such that one more makes the man bald — though the cutoff is unknowable even in principle. You hold that a vague term like 'bald' admits a range of equally admissible precisifications, that a borderline sentence is neither true nor false, but that some compounds are settled anyway: the disjunction 'he is bald or he is not bald' comes out true on every precisification, while 'there is a particular hair whose removal would tip him into baldness' comes out false on every precisification.

  Here's my opening: I suspect your view is mine with the labels changed. You agree with me that each instance of excluded middle holds for borderline cases — your supertruth machinery guarantees it. You agree with me that there is no hair anyone could ever point to as the one that made the difference. And you agree with me that no speaker could ever know which side of the line the man falls on. Your only remaining difference, as far as I can tell, is that you call the cutoff 'unsettled meaning' where I call it 'unknowable fact', and you call our failure to locate it 'indeterminacy' where I call it 'ignorance'. That's a renaming, not a rival theory. So tell me plainly: what claim do you deny that I affirm — and what work does denying it do for you that my view can't do at least as well?
