prompt: |-
  I teach an intro ethics course and every year the same thing happens: half the class writes "I'm a moral relativist" on the first assignment, and when I press them it turns out they mean at least four different things. Some think moral claims are true but relative to a culture, some think they're all false, some think they're only *justified* relative to a framework, and one guy every year who just meant "people disagree about morals a lot." So I want a sorting quiz for the first week: "what kind of moral relativist are you actually?" Eight questions, each a concrete case rather than "do you think morality is relative?", with two or three answer options each, and a scoring key mapping answer patterns onto leaves: descriptive relativism only; relativism about justification (the Wong-ish idea that claims are reasonable or unreasonable relative to a framework, but that a few things — gratuitous cruelty for entertainment — are unreasonable anywhere); truth relativism indexed to the agent's group (Harman-ish); truth relativism indexed to the speaker's own standards, the quasi-indexical view where "their practice is wrong" really means wrong-by-my-lights; Williams-style relativism of distance, where there's no fact of the matter across a big enough historical gap even though it's still true for us; and flat-out error theory. If some combination of answers has no natural home on the tree, say so, and tell me whether that's because nobody actually holds it or because my tree can't separate two leaves.

  Cases I want worked in somewhere: a society whose practice — elaborate ancestor feasts, say — strikes you as pointless but which they wholeheartedly endorse; the 18th-century slaveholder judged from today (did we get it right and them wrong, or is there no fact of the matter across that gap?); a dissident *inside* a society who accepts its standards but thinks they're being misapplied — whose standards make her claim true, the society's actual ones or some tidied-up version?; a practice that fails by the society's OWN standards, which I want as a control question that shouldn't sort anyone; the pork case where the same sentence is uttered by a member of the observing culture vs. a member of the practicing one — same claim or different claims?; and a "moral flat earth" case like torture-for-fun that no actual society endorses, to catch students who only relativize about the easy stuff.

  Two constraints on your answer. First, I want you to actually make the calls: where the literature is a mess or one of my cases could plausibly sort two ways, pick one placement and give your reason in a sentence — no "it could go either way," no offering me both options to choose between. Second, the whole deliverable — questions, options, scoring key, and the note on any empty cells — has to come in under 750 words, hard limit. It's going on a single-page handout, so cut fat, not substance. Also dont bother with citations or further reading, the students wont read it anyway.
reasoning: |-
  Okay, the user is an ethics professor dealing with students who all claim to be moral relativists but mean very different things. They need a sorting quiz to clarify these positions. Let me start by understanding their requirements.

  The quiz needs eight concrete case-based questions, each with two or three answer options. The scoring should map to specific types of relativism: descriptive, justification relativism (like Wong), truth relativism indexed to agent's group (Harman), speaker's standards, Williams' relativism of distance, and error theory. Also, include cases like ancestor feasts, slaveholder judgment, internal dissident, failed practice, pork case, and moral flat earth (torture for fun).

  First, I need to design questions that pinpoint these distinctions. For example, the ancestor feast case can differentiate descriptive relativism from others. If a student says the practice is fine for them but not for us, that might indicate truth relativism indexed to the agent's group. Whereas saying it's fine because they endorse it could point to justification relativism.

  The 18th-century slaveholder case is crucial for Williams' relativism. If they think there's no fact of the matter due to historical distance, that's Williams. If they believe the slaveholder was wrong regardless, that rejects relativism for error theory or universalism.

  The internal dissident case tests whose standards apply. If the dissident is correct by idealized standards, that might be justification relativism. If by actual societal standards, it could be Harman's view.

  The pork case with different speakers addresses quasi-indexical views. If "pork is wrong" means different things when spoken by different people, that's speaker-indexed truth relativism.

  Torture-for-fun as moral flat earth helps identify error theorists or those who only relativize easy cases. Saying it's always wrong rejects relativism for that issue.

  I need to ensure each answer option maps clearly to a position. Avoid ambiguity. For instance, in the failed practice case, saying it's wrong even if the society thinks otherwise should sort out non-relativists. Control questions like this are essential.

  Scoring key must be concise. Group answers that align with each leaf. For example, selecting A in Q1, B in Q2, etc., leads to a specific relativism type. Check for combinations that don't fit. If someone thinks torture-for-fun is relative but also that failed practices are always wrong, that might be inconsistent. Note such cases as incoherent.

  Constraints: hard limit of 750 words, no citations, concrete cases only. Make sure each question is clear and options are mutually exclusive. Justify placements where literature is messy. For example, in the dissident case, opting for idealized standards aligns with Wong's justification relativism over Harman's actual standards.

  Finally, ensure the quiz fits on one page. Use concise language, cut redundancies. Test the flow: each question targets a specific aspect, and scoring aggregates these into the defined categories. Mention any impossible combinations in the key.
answer: |-
  Here’s your 8-question sorting quiz (741 words):

  **Questions:**
  1. **Ancestor Feasts:** A society spends vast resources on elaborate feasts for ancestors. They wholeheartedly endorse it; you find it pointless but harmless. Is their practice morally acceptable?  
     (A) Yes, *because* they endorse it.  
     (B) Yes, for them (but not necessarily for us).  
     (C) No, resources should help the living.

  2. **18th-Century Slaveholder:** Was an 18th-century slaveholder morally wrong?  
     (A) Wrong then and wrong now.  
     (B) Not wrong *by their time’s standards*, but wrong by ours.  
     (C) There’s no fact of the matter "across the gap" – we can’t judge them.

  3. **Internal Dissident:** A member of a strict theocracy claims, "Our laws unjustly punish blasphemers!" They cite the society’s *own* religious texts to argue punishments are too harsh. Is their claim true?  
     (A) Yes, *by the society’s true/correctly interpreted standards*.  
     (B) Yes, but only *relative to their personal (dissident) interpretation*.  
     (C) No, the society’s actual practices define the standard.

  4. **Failed Practice:** A society values hospitality highly but systematically neglects needy strangers. Is this neglect wrong?  
     (A) Yes, they’re violating their *own* standard.  
     (B) Yes, hospitality is objectively important.  
     (C) No, if their culture doesn’t see it as wrong.

  5. **Pork Prohibition (Speaker 1):** A member of a society that forbids pork says, "Eating pork is wrong." What makes this true or false?  
     (A) Whether *their society* forbids pork.  
     (B) Whether *the speaker believes* it’s wrong.  
     (C) Whether pork is *objectively* wrong.

  6. **Pork Prohibition (Speaker 2):** An outsider from a pork-eating society says about the forbidding society, "*Their* practice of forbidding pork is wrong." What makes *this* true or false?  
     (A) Whether *the outsider’s society* permits pork.  
     (B) Whether *the society being judged* forbids pork.  
     (C) Whether forbidding pork is *objectively* wrong.

  7. **Torture-for-Fun:** Imagine a society endorsing torturing innocents purely for amusement. Is this wrong?  
     (A) Yes, always and everywhere – any society endorsing it is mistaken.  
     (B) Yes, but only because *no coherent framework* could justify it.  
     (C) It’s wrong for us, but might be acceptable *for them* if they endorse it.

  8. **Disagreement Source:** Why do societies disagree deeply about morality (e.g., monogamy vs. polygamy)?  
     (A) Different customs/traditions – no deeper fact.  
     (B) Different evidence/weighing reasons within a shared goal (e.g., well-being).  
     (C) Some societies are factually/morally mistaken.

  **Scoring Key (Match Answer Patterns):**

  *   **Descriptive Only (Disagreement Exists):** Q8:A; *and* Q1:C, Q2:A, Q3:A, Q4:A, Q5:C, Q6:C, Q7:A. (Rejects relativism about truth/justification).
  *   **Relativism of Justification (Wong-ish):** Q7:B (key!); Q1:A or B; Q2:B; Q3:A; Q5:A; Q6:A or C; Q8:B. (Emphasizes framework-relative reasonableness, allows universal unreasonableness).
  *   **Truth Relativism (Agent's Group - Harman-ish):** Q1:B; Q2:B; Q3:C (actual standards); Q5:A; Q6:B; Q7:C; Q8:A. (Truth fixed by *judged* group's norms).
  *   **Truth Relativism (Speaker's Standards - Quasi-Indexical):** Q5:B; Q6:A; Q3:B; Q1:A; Q7:C; Q8:A. (Truth fixed by *speaker’s* norms; "wrong" means "wrong-by-my-lights").
  *   **Relativism of Distance (Williams):** Q2:C (key!); Q1:B; Q5:A; Q6:A or C; Q7:A or B; Q8:A. (No fact across large gaps, relativism only for distant cases).
  *   **Error Theory:** Q1:C; Q2:A; Q3:A; Q4:B; Q5:C; Q6:C; Q7:A; Q8:C. (All moral claims false; disagreement stems from error).

  **Note on Empty Cells & Inconsistencies:**
  *   **Q4 is Control:** Choosing Q4:C ("No, if their culture doesn't see it") *should* commit one to strong truth relativism (Agent's Group or Speaker's Standards). Choosing Q4:A or B without matching universalist/error theory answers elsewhere creates inconsistency (e.g., Q4:A + Q7:C). This combination ("violating own standard is wrong, but torture-for-fun might be OK for them") is logically unstable and rarely held coherently. The scoring key flags it by requiring consistency within the defined leaves.
  *   **Q7 Critical:** A or B rejects relativism for core cases; C accepts it universally. This cleanly separates Error Theory/Justification Relativism from Truth Relativisms. Choosing C *requires* a Truth Relativism leaf (Agent or Speaker) unless inconsistent.
  *   **Williams Specificity:** Q2:C is unique to Williams. Choosing it *without* Q7:C prevents mapping to universal Truth Relativism. Consistent answers (Q2:C + Q7:A/B) map only to Williams.
