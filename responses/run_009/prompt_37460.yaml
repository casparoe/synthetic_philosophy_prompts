  - Twinning (#4) and fission (#5) are stress tests. Good inclusion - forces theories to handle edge cases.
  - Biological messiness (#6) is the reality check. Can't have a theory requiring precision where science says there is none.

  Their suspicion about tension is spot-on. Strict origin essentialism struggles with #3 (e.g., if conception time is essential, even "a month later" becomes impossible). Meanwhile, psychological continuity views might ace #3 but flunk #1. 

  Prepping the evaluation:
