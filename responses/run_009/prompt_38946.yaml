  The substantive heart lies in how we handle consistency constraints. Impossibilists treat them as inviolable logical boundaries; compatibilists as fixed background conditions; probabilists demand they be elevated to law-like status to avoid miracles. This isn't just verbal - it's about the metaphysics of laws and explanation.

  Progress seems achievable in three areas:  
