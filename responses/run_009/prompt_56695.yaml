prompt: |-
  I'm a PhD student in philosophy working on moral uncertainty, and in our department's animal-ethics reading group a conservation-biology PhD student presented an argument that has been bothering me for weeks, because it seems to license far more than she intended and neither of us can locate the joint at which it bends. Her argument runs as follows. (1) On any broadly aggregative view, the rational way to allocate our moral effort across domains is by the expected total welfare at stake in each. (2) Where we are uncertain whether the members of some class of beings are sentient, the expected welfare at stake in that class is the number of beings, multiplied by our credence that they are sentient, multiplied by the welfare at stake per sentient being. (3) The evidence on insect sentience is thin but not empty — decentralized nociception, trade-offs against competing motivations, self-medication-like behavior in some species — so a defensible credence falls somewhere between one in ten thousand and one in ten. (4) Even at the bottom of that range, the roughly 10^18 insects alive at any moment yield an expected number of sentient beings that dwarfs all vertebrates put together, so insect welfare should dominate the allocation of animal-welfare resources. (5) But the reasoning is perfectly general, and she concedes this: bacteria outnumber insects by more than a trillion to one, so a credence of even one in a trillion that bacterial valenced experience exists — not demonstrably zero, she insists — puts the expected stakes in bacteria ahead of those in insects by the same logic that put insects ahead of chickens. (6) Iterate the point across fungi, protists, and any merely possible sentient systems, and the expected totals grow without bound as populations grow and our credences, while never exactly zero, track nothing we can act on. (7) So the same premises that told her to take insect welfare seriously tell us to direct essentially all moral effort toward beings whose inner lives, even if real, we have no idea how to influence — a conclusion she will not sign and I cannot either.

  She suspects the fault lies in (2), something about the multiplication silently ignoring the difference between welfare at stake and welfare one can actually affect; I keep feeling that the deeper problem is in the slide connecting (3) to (5) and (6), where a credence that is "strictly between zero and one" gets treated as a stable quantity that can be set arbitrarily close to zero while the population term balloons to compensate — but I can't make that complaint precise without it sounding like I just dislike the conclusion. Which step should be rejected, and what does rejecting it cost? I would be genuinely sad to abandon (1), since I'm temperamentally drawn to aggregative views, and a diagnosis that amounts to capping our credences wherever the arithmetic gets uncomfortable looks like motivated reasoning rather than philosophy — but I'd rather pay that price than sign (7).
reasoning: |-
  Okay, let me start by unpacking the problem this philosophy PhD student is facing. They're dealing with an argument presented by a conservation biology student about moral uncertainty and sentience. The core issue is that applying expected value calculations to sentience credences leads to counterintuitive conclusions where bacteria or other numerous entities dominate moral considerations, even if we have no idea how to affect their welfare.

  First, I need to understand each step of the argument clearly. Step (1) states that moral effort should be allocated based on expected total welfare. That seems solid from an aggregative perspective. Step (2) introduces the formula: expected welfare equals number of beings times credence of sentience times welfare per being. The problem starts when they apply this to insects with a credence between 1/10,000 and 1/10. Even at the low end, insects' expected sentient beings outnumber vertebrates. Then in step (5), bacteria are introduced with a credence as low as 1 in a trillion. Since there are so many bacteria, their expected value still surpasses insects. Step (6) extends this to fungi, protists, etc., leading to step (7): all moral effort should go towards beings we can't affect, which is unacceptable.

  The user suspects step (2) might be flawed because it ignores whether we can affect welfare. The conservationist thinks the issue is the credence sliding to near-zero while populations balloon. Both have points, but I need to dig deeper.

  Looking at step (2), the multiplication assumes that welfare at stake is independent of our ability to affect it. But if we can't influence an entity's welfare, then the welfare at stake isn't actionable. The formula needs to incorporate effectiveness. For example, even if bacteria were sentient, our interventions might not change their welfare. So modifying step (2) to include an effectiveness factor could resolve this. That means expected welfare should be number times credence times welfare per being times the probability we can affect their welfare. Without this, the calculation ignores feasibility.

  Then there's the credence issue. Assigning a non-zero credence to bacteria's sentience based on "not demonstrably zero" is problematic. Credences should be evidence-based, not just non-zero. If there's no positive evidence for bacterial sentience, the credence shouldn't merely be a tiny number; it should be effectively zero. The principle of indifference might be misapplied here. We shouldn't assign equal probability to sentience without evidence; instead, our prior should be low, and without evidence, it stays low. So step (3) to (5) might misuse credence assignment by treating any non-zero possibility as requiring consideration regardless of evidence.

  Also, step (6) leads to paralysis because as we consider more entities, the expected value becomes dominated by numerous but low-credence beings. But if we can't affect them, their inclusion is irrelevant. Even with effectiveness factored in, the aggregation might still be dominated by entities we can influence effectively. For insects, we might have some interventions (like reducing pesticide use), but for bacteria, we have none. So the expected influenceability is near zero.

  The user wants to preserve step (1) but avoid the conclusion. Introducing an effectiveness multiplier and proper credence calibration based on evidence rather than just non-zero probability seems key. Also, distinguishing between metaphysical possibility and practical consideration is important. Just because something isn't impossible doesn't mean it merits moral attention without evidence or means of intervention.

  Another angle: welfare per being might vary. For bacteria, even if sentient, their welfare range might be negligible compared to more complex beings. But the argument assumes welfare per being is constant, which might not hold. However, the user might not want to go there as it could complicate the aggregative view.

  In summary, the flaws are in step (2) missing effectiveness and steps (3)-(5) misassigning credences. Rejecting these doesn't abandon aggregative ethics but refines it with feasibility and evidence-based priors. The cost is adding complexity to the expected value calculation, but that's necessary to avoid absurd conclusions.
answer: |-
  Your colleague's argument is a fascinating and troubling instance of the "Problem of the Wrap" (or "Pascalian problems" in moral uncertainty) – where low-probability/high-stakes scenarios dominate expected value calculations. The conclusion (7) is indeed unacceptable, and the flaw isn't in your aggregative commitment (1), nor is it merely discomfort with the math. The critical break occurs at **step (2)'s oversimplification and step (5)'s misapplication of credence**, compounded by how "welfare at stake" is conceptualized. Here's the diagnosis and repair:

  ### The Core Flaw: Step (2) Ignores "Affectability" and Misapplies Expected Value
  Step (2) states:
  > *"...the expected welfare at stake in that class is the number of beings, multiplied by our credence that they are sentient, multiplied by the welfare at stake per sentient being."*

  **This formula is incomplete for moral decision-making under uncertainty.** It correctly calculates the *expected existence of welfare bearers*, but **not** the *expected impact of our actions on welfare*. The missing element is **affectability** – the probability that our actions can actually influence the welfare of these beings, *given* they are sentient. The standard expected value formula for resource allocation *must* include:

  **Expected Impact = (Number) × (Credence in Sentience) × (Welfare at Stake *per unit intervention*) × (Probability our Action Affects that Welfare)**

  ### Why this resolves the absurdity:
  1.  **For Vertebrates/Insects (Plausible Cases):** We have reasonable models of welfare (pain, flourishing) and known interventions (reducing factory farming, habitat protection, humane pest control). The affectability term (P(action affects welfare | sentience)) is **non-negligible**.
  2.  **For Bacteria/Fungi/Protists (Implausible Cases):**
      *   **Credence Issue (Step 5):** Assigning a "not demonstrably zero" credence (e.g., 1 in a trillion) based *only* on metaphysical possibility ignores epistemology. Credences should reflect *evidence*, not just logical non-contradiction. The evidence for bacterial valenced experience isn't just "thin" (like insects); it's **non-existent** based on our current understanding of sentience (requiring integrated neural processing, not just nociception). A defensible credence isn't a tiny non-zero number plucked from indifference; it should be **effectively zero** absent *positive* evidence suggesting valenced experience *could* exist in such systems. Treating it as merely "tiny" is the misstep allowing populations to balloon and dominate.
      *   **Affectability Issue:** Even *if* we granted a non-zero credence, the term **P(our actions affect bacterial welfare | sentience)** is **effectively zero**. We have *no idea* what constitutes "welfare" for a bacterium (if it even has valenced states), nor any known interventions to reliably improve it. Spraying antibiotics might kill sentient bacteria, but we can't say if that's harm or relief. The link between our actions and their putative welfare is completely opaque. Multiplying by this near-zero affectability term swamps the huge (Number × Credence) term.

  ### Rejecting Step (5) and Refining Step (3) & (6)
  *   **Step (5) is invalid:** It misapplies the credence logic. Moving from insects (where *some* evidence exists for nociception and trade-offs relevant to valenced states) to bacteria (where *no* such evidence exists) isn't a smooth continuum. Credences shouldn't be assigned based solely on "not proven impossible." They require *positive reason* to suspect sentience is even a *viable hypothesis* for the system. For bacteria, there is none, making the "1 in a trillion" figure arbitrary and unjustified, not a defensible lower bound. This isn't capping credences due to discomfort; it's demanding *evidence-sensitive credences*.
  *   **Step (3) needs nuance:** Insect credence (1/10,000 to 1/10) is defensible *because* there *is* relevant evidence (nociception, trade-offs, learned avoidance). This evidence, while inconclusive, provides a *positive reason* to assign non-negligible credence. The range reflects uncertainty *within* a plausible hypothesis.
  *   **Step (6) collapses:** Without positive evidence for sentience in fungi/protists/etc., credences should not be set to arbitrary tiny non-zeros. Affectability for these systems is also near-zero even if sentience were granted.

  ### What This Costs (Minimally)
  1.  **Refining the Aggregative Formula (Cost to Step 1/2):** You must incorporate **affectability** explicitly into your expected value calculation for resource allocation. This isn't abandoning aggregation; it's making it *operational*. The "welfare at stake" *must* be interpreted as *welfare impactable by our actions*. This adds complexity but is essential for realism. It aligns with standard decision theory where expected utility considers the probability an action achieves a desired outcome.
  2.  **Evidence-Sensitive Credences (Cost to Step 5's Generality):** You must reject the principle "assign non-zero credence to any logically possible sentience." Credences must be grounded in *positive evidence* suggesting sentience is a *plausible* (not just conceivable) property of the system in question. This avoids Pascalian madness without arbitrary caps. The cost is accepting that some boundaries (like bacteria) might be sharper than others (like insects), based on the evidence landscape. This *is* philosophically defensible – it's Bayesian updating starting from very low priors for radically dissimilar systems, absent evidence to update on.

  ### Why This Works & Preserves Insect Concerns
  *   **Insects:** High number × Moderate Credence (evidence-based) × Significant Welfare Range (plausible) × Moderate Affectability (we can reduce clear harms like being boiled alive, use less painful pesticides) = **High Expected Impact**. This justifies significant resources.
  *   **Bacteria/etc.:** Immense Number × Effectively Zero Credence (no evidence) OR (if granted tiny credence) × Unknown Welfare Range × Near-Zero Affectability = **Negligible Expected Impact**. They vanish from the calculation.
  *   **Vertebrates:** Lower Number × Very High Credence × High Welfare Range × High Affectability = **High Expected Impact**. They remain crucial.
  *   **Novel/Emergent Systems (AI, Aliens):** Here, step (6)'s "merely possible" systems *could* become relevant **if** we develop: a) Positive reasons for credence (e.g., AI architecture mimicking neural correlates), b) Models of their welfare, c) Ways to affect it. But until then, they don't dominate.

  ### Addressing Your Specific Suspicions
  *   **Your colleague (fault in Step 2 - affectability):** She is partially right. Step 2 is incomplete because it ignores affectability. This is the most direct fix.
  *   **Your intuition (fault in Step 3->5 slide - credence misuse):** You are also right. The slide from "thin evidence" (insects) to "no evidence but not impossible" (bacteria) and treating the credence as a stable, arbitrarily tiny multiplier is the engine of the absurdity. It conflates epistemic probability with mere logical possibility. Demanding evidence-sensitive credences stops this.

  ### Conclusion
  Reject the *formulation* in step (2) for moral resource allocation – it must include **affectability**. Reject step (5)'s misassignment of credence to bacteria – credence requires **positive evidence**, not just the absence of disproof. This preserves the core aggregative insight (1) and the seriousness of insect welfare (3,4) while avoiding the paralyzing absurdity (5,6,7). The cost is a more complex, evidence-sensitive, and affectability-conscious expected impact calculation. This isn't motivated reasoning; it's recognizing that moral action requires not just *possible* stakes, but *actionable* ones based on our best understanding of the world. You can remain temperamentally aggregative while acknowledging that aggregating over entities we cannot comprehend or influence is practically meaningless and theoretically unsound without evidence grounding the probabilities.
