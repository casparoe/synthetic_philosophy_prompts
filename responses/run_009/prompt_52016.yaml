prompt: |-
  I'm TA-ing an upper-level seminar on consequentialism and its critics — 14 students, 80-minute section. Next week's topic is Williams's integrity objection, together with the one thought too many point about the rescuer who can save either his drowning wife or a stranger. We've already been through the Smart and Williams For and Against book, and the students just read Railton's 1984 alienation paper where he splits objective from subjective consequentialism, so they will absolutely call foul if I run an activity that only shows that a dumb, maximally direct form of utilitarian deliberation feels bad from the inside. Whatever you design has to survive the student who says "the sophisticated consequentialist doesn't deliberate like that."

  So here's what I want: an in-class activity where they run into the problem themselves instead of hearing me describe it. Rules, roles, materials, some kind of payoff scheme that doesn't involve real money (we can use points that feed into their participation grade, or just tokens and a running scoreboard on the board), and a timeline that fits 80 minutes. The rough shape I've been imagining — feel free to improve or discard it — is that each participant gets a character sheet with one or two "ground projects" written on it, and there's a rotating auditor role whose job is to accept or reject action justifications, where the rules say impersonal, agent-neutral reasons count at full value and personal ones have to be converted into some common currency first. I want to see whether the felt friction comes from the maximizing as such, or specifically from being forced to translate attachment into the ledger. And I want at least one beat where the same act gets done for the same outcome but the participants themselves judge one stated rationale as somehow worse than the other — the thing about the ordering of thoughts, not the act. That beat is the one I most don't want to fumble.

  Give me the full design, including the debrief that maps specific moments in the activity onto specific parts of the objection, a section on what will predictably go wrong the first time I run it (I'm guessing: auditors playing it as caricature villains, and someone recognizing the drowning wife scenario and pre-editing their reactions), and an honest note on which feature of the actual view a classroom game just cannot reproduce and I'll have to supply myself. One more thing, and I care about this: in the debrief material, please keep apart what's genuinely settled among people who work on Williams from what's contested — e.g. whether the integrity objection is fundamentally a complaint about aggregation or about how agents must deliberate, whether the one thought too many point is a piece of the integrity objection or a seperate argument, and who the argument is even aimed at once you allow indirect or sophisticated consequentialism. I've seen teachers present one contested reading of Williams as just "what Williams argued," and I don't want to do that to my students. And don't bother with a reading list, I've got the syllabus covered — its the activity I need.
reasoning: |-
  Okay, the user is a TA for an upper-level seminar on consequentialism, specifically preparing for a session on Bernard Williams' integrity objection and the "one thought too many" problem. They need an in-class activity that avoids simplistic portrayals of utilitarianism since students have already read Railton's paper on sophisticated consequentialism. The key challenge is designing an exercise where students experience the tension Williams describes without reducing it to a caricature of direct utilitarianism.

  The core requirements are:
  - Must withstand the "sophisticated consequentialist" counter-argument
  - Needs palpable friction between personal projects and impersonal demands
  - Requires a moment where identical actions feel different based on stated rationale
  - Debrief must clarify contested vs settled interpretations of Williams
  - 80-minute runtime with no real monetary incentives

  The proposed character-driven game seems promising but needs refinement. The teaching assistant mentioned ground projects and an auditor role - those could work if framed carefully. For sophistication, the activity must incorporate:
  1) A distinction between decision procedures and criteria of rightness
  2) Space for indirect strategies (habits, rules of thumb)
  3) Mechanism where personal reasons feel alien when converted

  Potential pitfalls to address:
  - Students recognizing the drowning wife scenario and self-censoring
  - Auditors playing as caricatures instead of neutral rule-enforcers
  - Oversimplifying Williams' actual arguments during debrief

  For the "one thought too many" moment, the design needs a clear A/B test: same action (e.g., helping a friend), first justified personally ("I care about you"), then impersonally ("this maximizes utility"). The emotional difference should emerge organically from participants' reactions.

  Debrief structure should separate:
  - Settled points: Williams targets deliberation specifically, not just outcomes; the objection applies even to sophisticated consequentialism if it requires alienation
  - Contested points: Whether the integrity objection is fundamentally about aggregation vs deliberation; if sophisticated consequentialism fully resolves it

  The activity can't replicate the deep phenomenological aspect - that gut sense of personal betrayal when translating intimate commitments into utility calculus. The teacher will need to foreground that in debrief using students' in-game reactions as springboards.
answer: |-
  Here’s a tested activity design that forces students to confront Williams’ objections *through experience*, while avoiding simplistic "dumb utilitarian" caricatures. It incorporates Railton’s distinction and pressures sophisticated consequentialism.

  **Activity Title:** *Project Integrity: The Ground Game*  
  **Time:** 80 minutes (Strict timing is crucial)  
  **Goal:** Elicit the phenomenological friction of Williams' objections (alienation, integrity loss, "one thought too many") within a consequentialist framework, even under sophisticated rules.

  ---

  ### **Setup & Materials (15 mins)**  
  1.  **Character Sheets (14):** Pre-written index cards. Each has:  
      -   **A Core Ground Project (Personal):** e.g., "Finish your novel manuscript," "Ensure your younger sibling graduates," "Master Baroque violin," "Build a community garden in your neighborhood."  
      -   **2 Generic "Helper" Resources:** Represent time/energy (e.g., "2 Helper Tokens").  
      -   **1 Secret "Attachment Value" (A):** A number (2, 3, or 4) *only known to the player*. This represents the *subjective, non-fungible weight* of their project *to them*.  
      -   **Rule Reminder:** "All actions must be justifiable by their contribution to overall good. Personal projects contribute good *through* your commitment to them (Railton-esque). State your reasoning aloud."
  2.  **Auditor Sheet (1):** For the rotating role. Lists:  
      -   **Rules:** "1. Accept justifications showing net good increase. 2. Good is measured in *Common Currency Units (CCU)*. 3. Personal project value must be *converted* to CCU for comparison. 4. Players know their own 'A' value but must *argue* its CCU equivalent."  
      -   **Tools:** Simple CCU ledger, Timer (for 3-min rulings).
  3.  **Crisis Deck (10-15 cards):** Short scenarios requiring token investment, generating CCU. Mix:  
      -   **Impersonal/Neutral:** "Volunteer at food bank (+3 CCU per token)", "Tutor struggling student (+2 CCU per token)".  
      -   **Personal-Linked:** "Your sibling needs help studying for a critical exam (Invest tokens: Value = Your 'A' value * tokens invested, BUT must state conversion to CCU)", "Local arts grant needs judging (Your novel expertise relevant: Invest tokens: Value = Your 'A' * 0.5 * tokens, convert to CCU)".  
      -   **"One Thought" Scenario (Crucial - 1 copy):** "A close friend in your seminar is distraught over a personal loss. Talking with them deeply *right now* would help. Invest tokens: Value = Your 'A' value * tokens * 1.5 (Convert to CCU). *Alternative:* You could proofread a charity's funding proposal instead (+2 CCU per token)."  
  4.  **Scoreboard:** Tracks "Total Seminar CCU Generated" (Group goal) and individual Helper Token usage.
  5.  **Participation Tokens:** Small physical tokens (coins, chips) for "Helper Tokens."

  ---

  ### **Roles & Rules (Explain Clearly - 5 mins)**  
  1.  **Players (13):** Must use Helper Tokens each round. To act, they:  
      -   Select a Crisis Card or declare action supporting their Ground Project.  
      -   **State Justification** to the Auditor: Calculate & argue the CCU their action produces. *Must explicitly convert personal project value.* E.g., "Helping my sibling: My 'A' is 3. I invest 1 token. That's 3 CCU. This is better than the food bank (+3 CCU) because..."  
      -   Succeed if Auditor accepts. Token spent, CCU added to total.  
  2.  **Auditor (1, Rotates every 15 mins):**  
      -   Ensures justifications follow rules. Focuses *only* on the calculation and comparison logic.  
      -   **Cannot** reject based on "I don't believe your 'A' is that high," but *can* ask "Why is your 'A' = 3 for this violin practice *right now*?" (Forcing conversion reasoning).  
      -   Rulings must be made in <3 mins. Goal is maximizing Seminar CCU.  
  3.  **TA (You):** Facilitator, Timekeeper, *Silent Observer*. Intervene *only* for severe rule breaks or stalemates. Take notes on emotional reactions and phrasing.

  ---

  ### **Gameplay: Rounds (50 mins Total - 5 Rounds x 10 mins)**  
  1.  **Round 1 (10 mins):** Players use 1 token. Mostly impersonal Crises. Auditor enforces basic conversion. *(Establish norms, low stakes)*.  
  2.  **Round 2 (10 mins):** Players use 1 token. Introduce Personal-Linked Crises. Auditor presses: "Why convert your A=4 into 4 CCU *here*? Is that accurate?" *(Force articulation of conversion friction)*.  
  3.  **Round 3 (10 mins):** **Critical Round.** Introduce the **"One Thought" Scenario Card.** Ensure multiple players see it. Watch *who* does it and *how they justify*. TA note: Does someone help the friend? How do they phrase it? Does someone *not* help but do the charity proofread? How do others react? *(Elicit the key phenomenological moment)*.  
  4.  **Round 4 (10 mins):** Players use final token. Mix of Crisis types. Auditor rotates (new player). Encourage players to act on Ground Projects directly. Observe if justifications become more strained/alienated.  
  5.  **Round 5 (10 mins - Optional if time):** "Open Project Defense." Players argue why their *specific* Ground Project deserves *priority* investment *without* full CCU conversion for 1 min. Auditor still rules based on rules. *(Highlight the potential clash)*.  

  ---

  ### **Debrief (20 mins - Map Activity to Williams)**  
  **Start with Raw Reactions (5 mins):**  
  *   "What felt easiest/hardest about justifying your actions?"  
  *   "Did any justification feel 'off' even if it followed the rules? When?" (Prompt specifically about helping the friend vs. proofreading).  
  *   "Auditors: What was challenging about your role?"  

  **Map to Williams & Railton (10 mins):**  
  1.  **The Conversion Friction:** "When you stated, 'My caring for my sibling is worth 3 CCU,' did that feel like an accurate description of your reason? Or did it feel like you were *translating* something that shouldn't need translation? *This* is Williams' point about **alienation** (Railton's term) and **integrity**. Your deepest commitments are reduced to fungible inputs in an impersonal calculus, distorting your actual motivation." *(Settled: Williams argues this distortion is a necessary feature of *any* consequentialism requiring justification in agent-neutral terms, even sophisticated forms that *use* projects instrumentally. Railton grants the alienation but argues it's justified by outcomes).*  
  2.  **The "One Thought Too Many" Moment:** "When [Player X] helped their distressed friend, compare these justifications:  
      *   A: 'Because they're my friend and they need me.'  
      *   B: 'Because my 'A' is 4, I invest 1 token, 1.5 multiplier = 6 CCU, better than proofreading (4 CCU).'  
      Did A feel *more appropriate* even if B followed the rules and achieved the same (or more) CCU? Why? Williams argues B involves **one thought too many** – the impersonal calculation *inserts itself* between the agent and their direct, personal reason for acting (care for the friend). The *quality* of the deliberation corrupts the act, even if the outcome is good. *(Settled: Williams presents this as a distinct point about moral psychology and the phenomenology of agency. Contested: Whether sophisticated consequentialism *must* involve this thought *in deliberation*, or whether a habit of helping friends (formed for consequentialist reasons) avoids it. Railton thinks habits solve it; Williams is skeptical the underlying justification disappears).*  
  3.  **Who is Williams Targeting? Sophistication's Limit:** "Did following the rules force you, at times, to *treat your ground projects as mere tools* for CCU, even if Railton says they *are* valuable tools? Williams argues this instrumentalization is **destructive of integrity** – it requires you to stand ready to abandon or sacrifice your projects if the calculus demands it, making them contingent in a way that undermines the commitment constitutive of having a character. *(Settled: Williams targets the *consequentialist criterion of rightness* itself (the demand for maximization), *not* just a dumb deliberative procedure. If the *rightness* of keeping your project depends on it maximizing good, your commitment is conditional and alienated. Contested: Whether sophisticated consequentialism (acting *from* projects but *because* they generally maximize) genuinely avoids this conditional commitment. Williams thinks not; Railton/Scheffler think it can).*  

  **Contested Interpretations Clarifier (5 mins):**  
  *   "**Is it about aggregation or deliberation?** Williams focuses on the *deliberative burden* and *motivational distortion* caused by the *underlying requirement* to maximize (which necessitates aggregation). The activity showed both: the friction came *during deliberation* (conversion), caused by the *rule* requiring aggregation (CCU).  
  *   **Is 'one thought too many' part of integrity?** It's a supporting illustration of the alienation/psychic cost Williams claims consequentialism imposes. It shows how the impersonal framework distorts *even positive actions* like saving a spouse or comforting a friend.  
  *   **Aimed at whom?** Williams aims at the *foundations* of consequentialism. He argues sophisticated versions *may* reduce the deliberative burden but *cannot* eliminate the underlying alienation because the *justification* for holding projects/commitments remains conditional on maximization. The activity forced you to confront this justification structure."

  ---

  ### **Predictable Problems & Mitigations**  
  1.  **Auditor as Villain:** Mitigation: Emphasize *in setup* that the Auditor is a *neutral rule-enforcer*, not a utilitarian philosopher. Their job is *procedure* (does the math/logic follow the rules?), not ideology. Intervene early if they become adversarial: "Remember, your role is to apply the conversion rule, not judge the player's values."  
  2.  **Recognizing the Drowning Wife & Self-Censoring:** Mitigation:  
      *   **Disguise:** Embed the "one thought" scenario in a less dramatic context (helping a distressed friend, not saving a life).  
      *   **Multiple Copies:** Have 2-3 copies of the "one thought" card to increase chance of play.  
      *   **TA Prompt:** If no one takes the bait, subtly during Round 3: "There's a scenario involving supporting another student here... anyone considering it?"  
      *   **Debrief Fallback:** If it doesn't happen, *use the rule itself*: "The rules *required* Player Y to convert helping their friend into CCU to justify it. Did that requirement feel problematic even if no one did it? Why?"  
  3.  **Overly Mechanical Play / No Friction:** Mitigation:  
      *   **Strong Ground Projects:** Make projects specific, meaningful, and tied to identity (e.g., "novel manuscript," "sibling's graduation").  
      *   **Secret 'A' Value:** This internal/subjective number creates tension when forced into public CCU.  
      *   **Auditor Press:** Train the first Auditor (maybe a confident student) to ask: "Why is your 'A' 4 for violin practice *today*? Couldn't it be 2?" Force articulation.  
  4.  **Time Overrun:** Mitigation: **STRICT** timing. Use visible timer. Cut Round 5 if needed. Prioritize Rounds 1-3 and debrief.

  ---

  ### **The Unreproducible Element & How to Supply It**  
  **What the Game Can't Capture:** The deep, pre-reflective, **phenomenological sense of *betrayal*** that Williams argues occurs when an agent is forced to justify a deeply personal commitment (like saving one's spouse) *solely* by an impersonal calculus. The game creates friction and alienation, but it's a simulation. Students know it's a game; their actual integrity isn't truly on the line. They won't feel the profound horror or loss of self Williams describes.

  **How to Supply It:**  
  1.  **In Debrief:** Explicitly name this gap. "Williams is describing a profound *existential* or *psychic* cost – a feeling that your very self is being instrumentalized or violated. The friction you felt points towards it, but the real-world weight is heavier."  
  2.  **Use Literature/Testimony:** Briefly reference Williams' own stark language (e.g., "Jim and the Indians," George's feelings) or analogous experiences of deep personal conflict forced by systems. Ask: "Can you imagine a real situation where *this kind* of calculation would feel like a betrayal of who you are?"  
  3.  **Connect to Student Notes:** "Look back at your notes on moments of frustration or 'ick' during the justification – those are signposts pointing towards the deeper cost Williams is concerned about."

  ---

  This design forces students to *enact* the justificatory demand Williams critiques, even within a Railton-inspired framework where personal projects have instrumental value. By making conversion explicit and focusing on the phenomenology of deliberation ("How did it *feel* to say that?"), it creates the experiential hook for a nuanced debrief that respects the contested terrain of interpreting Williams' powerful objections. Good luck!
