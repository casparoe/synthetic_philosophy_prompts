  - Round 1: 5 minutes (each group plays one round simultaneously).
  - Rotate roles and play a second round (same scenario, same hidden state? or change?): 5 minutes. (We change the hidden state for the second round to get variation.)
  - Then we do a third round? Maybe only two rounds per group? Then we have 10 minutes of group play and then 25 minutes for debrief and discussion.

  But we have 5 groups, each playing two rounds (10 rounds total) but simultaneously, so it takes only 10 minutes? Actually, each round is 5 minutes, so two rounds take 10 minutes. Then we have 10 minutes for groups to discuss their experiences and then 20 minutes for class debrief? Let's break down:

  Total time: 50 minutes

  - 0-5 min: Introduction and rules.
  - 5-10 min: Group setup (assign groups, roles, and explain the scenario and evidence for their group). Each group gets one scenario for both rounds, but the hidden state is reset for the second round (by the teacher randomly, but without revealing to the students). 
  - 10-20 min: Round 1 (5 min) and then quickly reset the hidden state (teacher flips a coin for each group) and Round 2 (5 min). 
  - 20-25 min: In-group reflection: each group discusses what assertions were made, what challenges, and what they noticed about when assertions were challenged and defended. They prepare to report to the class.
  - 25-45 min: Class debrief and discussion.
  - 45-50 min: Wrap-up and introduce the three candidate norms.

  To ensure the lottery phenomenon surfaces, one of the scenarios is a lottery scenario. We assign that to one group, but we want all groups to potentially experience the lottery-like situation? Alternatively, we can design all scenarios to have a lottery structure? But let's have one scenario be a lottery and the others be similar (e.g., a murder mystery with very weak evidence, or a stock market prediction).

  Scenarios:

  1. Lottery Ticket: Hidden state: Winner/Loser. Evidence: 
