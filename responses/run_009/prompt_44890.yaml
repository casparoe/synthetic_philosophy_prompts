  We are designing an in-class activity for a 50-minute session with 20 second-year students on the norms of assertion. The goal is for students to discover that assertion seems governed by something stronger than truth, through two phenomena: the shape of challenges (typically "how do you know?" rather than "is that true?") and the lottery-ticket case (where one cannot assert a ticket will lose even with very high probability).

  Activity Design: "The Evidence Game"

  Overview:
  - Students are divided into groups of 4 (5 groups total). Each group has a scenario with a hidden state of the world and differential evidence distribution.
  - Each student in a group gets a role: two "Asserters" and two "Challengers". (Alternatively, to involve all, we can have rounds so everyone gets a turn. But to keep it simple for 50 minutes, we assign roles per round and then rotate.)
  - The game has multiple rounds. In each round, an Asserter makes an assertion about the hidden state, and Challengers can challenge. The goal is to earn points by making successful assertions (that go unchallenged or are defended successfully) and by successful challenges.

  Setup:
  - Prepare 5 scenarios (one per group) that have a hidden state (e.g., "The diamond is in the safe" or "The ticket is a loser"). Each scenario has a set of evidence cards that are distributed to the students in the group. Some evidence is strong, some weak, and some misleading.
  - Example scenario: "The Lottery Ticket"
     - Hidden state: Either "Winner" or "Loser" (determined randomly by a coin flip or by the teacher before the round, but not revealed until the end of the round).
     - Evidence cards:
          - Strong evidence for Loser: "The odds of winning are 1 in a million." (held by one student)
          - Weak evidence for Loser: "I heard someone say most tickets lose." (held by another)
          - Misleading evidence: "I heard the winning ticket was sold at the store next door." (but that might be false) - held by another.
          - Neutral: "I have no information." (if needed)

  - Roles per round (for a group of 4):
     - Two Asserters: They can choose to make an assertion about the hidden state (e.g., "The ticket is a loser") at any time during the round. But they must base it on their evidence and they can only assert once per round.
     - Two Challengers: They can challenge any assertion made by an Asserter by asking "How do you know?" or by questioning the evidence. They cannot directly say "That's false" without challenging the basis.

  - Point system:
     - Asserter: 
          - If an assertion goes unchallenged and is correct: +3 points.
          - If challenged and the Asserter successfully defends (by providing evidence that convinces the challengers to withdraw the challenge) and the assertion is correct: +2 points.
          - If the assertion is challenged and the Asserter cannot defend (i.e., the challengers are not satisfied) and the assertion is correct: +0 points (because they couldn't back it up) OR if incorrect: -2 points.
          - If the assertion is incorrect and unchallenged: -3 points (because they misled everyone without being caught).
