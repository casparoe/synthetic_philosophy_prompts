  - Groups: 5 groups of 4.
  - Each group gets a scenario and evidence cards. Each student in a group gets one evidence card per round (the same card for both rounds? or new ones? We keep the same evidence cards for both rounds but reset the hidden state).
  - Roles: Two asserters and two challengers per round. After the first round, they rotate roles so that everyone gets to be an asserter and challenger.
