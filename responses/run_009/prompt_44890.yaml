  4. Weather Prediction: Hidden state: It will Rain or Not Rain tomorrow. Evidence:
     - Card A: "The weather forecast says 90% chance of rain." (strong for Rain)
     - Card B: "I saw clear skies in the evening." (weak against Rain)
     - Card C: "The humidity is very low." (weak against Rain)
     - Card D: "My knee aches, which usually means rain." (weak for Rain, folk)

