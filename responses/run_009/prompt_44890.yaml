     - Card A: "I studied very hard and know the material." (strong for Pass, but not certain)
     - Card B: "The exam was very difficult." (strong for Fail)
     - Card C: "I answered most questions." (weak for Pass)
     - Card D: "I heard the professor is failing many students." (weak for Fail)

  We assign these to the groups. The lottery scenario (group 1) is key for the lottery paradox. We hope that in that group, an asserter with the high-probability evidence (Card A) will be challenged even though they are very confident.

  Debrief Structure:

  1. Ask groups to report: What assertions were made? What challenges? What were the outcomes?
  2. Focus on the lottery group: Did anyone assert that the ticket was a loser? If so, were they challenged? What did they say in defense? How did the challengers react?
  3. Notice the form of challenges: Did challengers ask "How do you know?" or did they say "That's false"? We expect mostly "How do you know?" or "What's your evidence?"
  4. Then introduce the three norms: truth, belief, knowledge. Explain that the truth norm would require only that the assertion is true, the belief norm that the asserter believes it, and the knowledge norm that the asserter knows it.
  5. Map specific moments:
     - Truth: If an assertion was true and unchallenged, the asserter got points. But was that enough? What about when someone asserted with weak evidence and was true? They might have been challenged and lost points because they couldn't defend.
     - Belief: Did anyone assert something they believed (even strongly) but were challenged? Why was that challenge appropriate?
     - Knowledge: The knowledge norm explains why we ask "How do you know?" - because we require not just truth and belief, but also justification (and some say knowledge).

  6. Press on the distinction between knowledge and justified belief: In the activity, the challengers were looking for justification. But does that amount to knowledge? Or can one have justified true belief without knowledge (like in Gettier cases)? Note that the activity didn't have Gettier cases, so we cannot distinguish. But in the lottery case, the asserter has justified true belief (if it's a loser) but not knowledge? We think so. But in the activity, if the ticket is a loser, and the asserter has the 1-in-a-million evidence, do they know? We want the students to see that they still feel uncomfortable asserting. So we point out: even with very strong justification (short of 100%), we don't allow assertion. That suggests knowledge (which is factive and requires more than high probability) or perhaps a justification norm that requires very high standards.

  Predictable Problems:

  - Students might not challenge enough because they are shy or don't want to be negative. Solution: Emphasize that challenges are part of the game and they earn points for good challenges.
  - Students might focus too much on winning points and not on the philosophical point. Solution: The debrief will connect.
  - In the lottery scenario, a student might assert with the strong evidence and not be challenged. Then the lottery paradox doesn't surface. To mitigate, the teacher can monitor and if needed, as a challenger in that group, ask "How do you know?" if no one else does. But that's intervention. Alternatively, design the evidence so that it's obvious that it's not conclusive.

  Feature the activity cannot reproduce: The lottery paradox in the real world is about a single ticket holder who has purely statistical evidence. In the game, the evidence is distributed and the challengers have other evidence. We must note that in the real lottery case, there is no other evidence. The activity might not perfectly isolate that. So the teacher will have to supply that in the debrief: "Imagine you are in a real lottery: you have a ticket and the odds are 1 in a million that you win. Can you assert 'My ticket is a loser'? Why not? Even though you believe it and it's very likely true?"

  Confidence:

  I am fairly confident that the activity will generate the phenomena of challenges taking the form "how do you know?" because the rules and point system encourage challengers to question the basis rather than the truth (since they don't know the truth). The lottery case might not come out as strongly, so that's the point I'm least sure of. We depend on the group assigned to the lottery scenario having the right dynamics. To increase the chance, we might make the evidence in the lottery scenario particularly weak (remove any strong evidence) and have multiple weak evidence? Then an asserter might assert with weak evidence and get challenged. Alternatively, we can have the lottery scenario only have probabilistic evidence and no conclusive evidence.

  Revised Lottery Evidence:
  - Card A: "The odds of winning are 1 in 1,000,000." (strong for loser, but not knowledge)
  - Card B: "I heard that the lottery is fair." (neutral or weak for loser)
  - Card C: "I had a dream that I lost." (weak and unreliable)
  - Card D: "I bought the ticket at a store that never sold a winner." (weak, because it doesn't affect the current ticket)

  Then, an asserter with Card A might assert "It's a loser." But then a challenger might ask: "But how do you know? There's still a chance, right?" And the asserter cannot provide conclusive evidence.

