answer: |-
  Below is a detailed design for a 50-minute in-class activity that meets your specifications. The activity, called the **Evidence Challenge Game**, uses role-play and structured scenarios to help students organically encounter the two target phenomena (the "how do you know?" challenge pattern and the lottery-ticket reluctance). The debrief connects these observations to the norms of assertion (truth, belief, knowledge) and presses on the knowledge vs. justified-belief distinction. I close with predictability notes, limitations, and confidence assessments.

  ---

  ### **Activity: Evidence Challenge Game**
  **Objective:** Students discover that assertion requires more than truth through role-play, with built-in phenomena (challenge patterns and lottery-style cases).  
  **Time:** 50 minutes total (activity: 25 min; debrief: 25 min).  
  **Students:** 20 students, divided into 5 groups of 4.  
  **Materials per Group:**  
  - One **scenario card** (describing a hidden state of the world).  
  - Four **evidence cards** (distributed privately; some strong, some weak, some misleading).  
  - Role tokens (two "ASSERTER" and two "CHALLENGER" badges).  
  - Point-tracking sheets (for scoring).  

  **Scenarios:** Each group has a unique hidden-state scenario. **Key:** One group gets a lottery-ticket scenario; others reinforce probabilistic reasoning.  
  1. **Lottery Ticket:** Hidden state = Ticket is a *Winner* or *Loser* (e.g., 1-in-1,000,000 odds).  
  2. **Art Authenticity:** Hidden state = Painting is *Real* or *Fake*.  
  3. **Weather Event:** Hidden state = Storm *Will* or *Will Not* hit the city.  
  4. **Job Candidate:** Hidden state = Candidate *Will* or *Will Not* succeed.  
  5. **Historical Fact:** Hidden state = Event *Did* or *Did Not* occur.  

  **Evidence Cards (Example: Lottery Group):**  
  - Card 1 (Strong but probabilistic): "Odds of winning are 1 in 1,000,000."  
  - Card 2 (Weak): "I overheard someone say tickets from this batch often lose."  
  - Card 3 (Misleading): "A friend claimed the store sold a winner yesterday."  
  - Card 4 (Neutral): "I have no special information about the ticket."  

  **Rules & Payoff Scheme:**  
  - **Roles:** Each group has 2 asserters and 2 challengers. Roles rotate after Round 1.  
  - **Hidden State:** Determined secretly by a coin flip (e.g., heads = "Loser," tails = "Winner") before each round. *Not revealed until the debrief*.  
  - **Gameplay (per 5-min round):**  
    1. **Assertion:** Asserters may assert the hidden state (e.g., "The ticket is a loser") *once per round*. They must base claims on their evidence card.  
    2. **Challenge:** Challengers may *only* challenge by asking **"How do you know?"** or **"What evidence supports that?"** Direct challenges like "That’s false!" are penalized.  
    3. **Defense:** Asserters respond with evidence (e.g., "I know because of the 1-in-a-million odds").  
    4. **Resolution:**  
       - If unchallenged, the asserter’s claim stands.  
       - If challenged, challengers vote on whether the defense was adequate (simple majority).  
    5. **Scoring (Points):**  
       - **Asserter:**  
         - +3: Correct assertion, unchallenged.  
         - +1: Correct assertion, challenged but defense succeeds.  
         - -2: Incorrect assertion (even if unchallenged).  
         - -1: Correct assertion, challenged and defense fails.  
       - **Challenger:**  
         - +2: Successful challenge (asserter’s defense fails *and* claim is wrong).  
         - +1: Successful challenge (asserter’s defense fails, regardless of truth).  
         - -1: Unsuccessful challenge (asserter’s defense succeeds).  

  **Why this setup works:**  
  - The payoff scheme incentivizes challengers to focus on *evidence gaps* (not truth) and asserters to avoid assertions without strong backing.  
  - The lottery scenario is designed so high probability (e.g., 99.9999% belief) feels insufficient for assertion due to the scoring risk.  
  - Challenges are forced into the "how do you know?" mold by rules and penalties.  

  ---

  ### **Step-by-Step Flow**  
  **0-5 min: Setup**  
  - Assign groups and roles. Give each group a scenario card and evidence cards (shuffled/distributed randomly).  
  - Briefly explain rules and scoring. Emphasize: "Challenges must question evidence, not truth."  

  **5-15 min: Round 1**  
  - Groups play 5-minute rounds. Teacher flips coins secretly to set hidden states (e.g., for lottery: heads = Loser, tails = Winner).  
  - **Monitor groups:** Note if lottery-group asserters hesitate to claim "It’s a loser" despite strong probabilistic evidence.  

  **15-25 min: Round 2**  
  - Students rotate roles (asserters become challengers; vice versa). Reset hidden states with new coin flips.  
  - **Key moment:** Watch for challengers defaulting to "how do you know?" without prompting.  

  ---

  ### **Debrief (25 min)**  
  **Goal:** Students articulate the phenomena; you introduce norms and press on knowledge vs. justified belief.  

  **Part 1: Elicit Observations (10 min)**  
  - Ask groups:  
    1. "What patterns did you notice in how challenges were made?"  
       - *Expected:* Challenges were almost always "how do you know?" not "is that true?"  
    2. (To lottery group): "Did anyone assert the ticket was a loser? If not, why? If yes, what happened?"  
       - *Expected:* Hesitation due to fear of penalties if wrong, even with 99.9999% belief.  
    3. "When did an assertion feel 'risky' even if you believed it strongly?"  
       - *Expected:* Cases with probabilistic/misleading evidence (e.g., lottery, weather).  

  **Part 2: Introduce Norms & Map to Activity (10 min)**  
  - Present the three candidate norms:  
    - **Truth:** Assert only what is *true*.  
    - **Belief:** Assert only what you *believe*.  
    - **Knowledge:** Assert only what you *know*.  
  - **Map to activity moments:**  
    - **Truth norm failure:** "In Round X, [Name] asserted something true (e.g., ‘The ticket lost’), but lost points because they couldn’t defend it. Truth alone didn’t protect them."  
    - **Belief norm insufficiency:** "In the lottery, many of you *believed* the ticket would lose but hesitated to assert it. Belief wasn’t enough."  
    - **Knowledge norm emergence:** "Challenges like ‘how do you know?’ mirror real life—we demand *knowledge*, not just truth or belief."  

  **Part 3: Press Knowledge vs. Justified Belief (5 min)**  
  - **Puzzle:** "In the game, challenges focused on *justification* (evidence). Does that support a *justified-belief norm* or a *knowledge norm*?"  
  - **Use activity data:**  
    - "In Group Y’s challenge, [Name] asked for evidence but didn’t question if the belief was *true*. This fits both norms."  
    - "But in the lottery case, you had justified belief (99.9999% confidence) yet couldn’t assert comfortably. Knowledge requires *factivity*—you can’t ‘know’ something with a 0.0001% chance of being wrong. The activity suggests we demand that extra certainty."  
  - **Conclusion:** The game can’t fully distinguish them, but it reveals that justification alone isn’t sufficient (paving the way for knowledge norms).  

  ---

  ### **Predictable Problems & Limitations**  
  **What will go wrong (and fixes):**  
  1. **Problem:** Students may ignore evidence and assert recklessly for points, missing the lottery phenomenon.  
     - *Fix:* Preemptively stress penalties for incorrect assertions. Monitor lottery groups and subtly prompt: "Remember, even 99.9999% isn’t 100%."  
  2. **Problem:** Challengers might slip into "That’s false!" due to competitive zeal.  
     - *Fix:* Penalize non-evidence challenges harshly (-2 points) and remind them mid-round.  
  3. **Problem:** Asserters in non-lottery groups may not feel the "high probability isn’t enough" tension.  
     - *Fix:* Use the debrief to generalize: "The lottery case is a metaphor—replace ‘ticket’ with any high-risk claim."  

  **Feature the activity cannot reproduce:**  
  - The **solitary nature of real lottery cases**. In real life, lottery-ticket holders don’t face challengers with counter-evidence; their reluctance comes from internal norms. The game relies on *social penalties* (challenges/scoring) to mimic this. **You must supply this post-activity:** "In the real lottery, you’re alone with your evidence—yet you still can’t assert ‘It’s a loser.’ This shows the norm isn’t just about social pressure."  

  ---

  ### **Confidence Assessment**  
  - **Overall confidence:** 85%. The activity reliably surfaces "how do you know?" patterns due to forced challenge rules. Point penalties make probabilistic assertions feel "off," priming the lottery insight.  
  - **Least confident point:** **The lottery hesitation will emerge unprompted** (60% confidence). Students might assert boldly due to game incentives, downplaying the norm. Mitigations:  
    - Use the lottery scenario’s scoring to make failure costly (e.g., -2 for wrong assertions).  
    - If no hesitation occurs, use the debrief to contrast: "Did anyone *want* to assert but held back? In real life, we often do."  
  - **Why I’m confident elsewhere:**  
    - The challenge structure is hardwired into rules/scoring, ensuring "how do you know?" dominates.  
    - Point penalties for incorrect assertions create stakes where truth alone fails, mirroring real assertion risks.  

  This design balances discovery with structure, using gamification to make norms tangible. It’s adaptable—shorten rounds or simplify scoring if needed. Run it as-is, and the phenomena *will* surface for the debrief to crystallize.
