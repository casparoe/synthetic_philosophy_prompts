answer: |-
  Here’s the poem, designed to embody Kuhn's arc through the Copernican shift, adhering strictly to your specifications:

  **Headnote (Optional):**  
  This poem traces the five stages of scientific change according to Kuhn, using the shift from Ptolemaic to Copernican astronomy. Each stanza corresponds to one stage. Note the shifting meaning of "planet" between the first and final stanzas.

  ---

  **The Sky's New Keeping**

  **(I. Normal Science: Ptolemaic)**
  The master's tables hold the turning spheres,
  A clockwork choir singing silver paths.
  Here, the Sun and Moon, bright wanderers,
  Are **planets** too, with Venus, Mars, and Jove.
  The scribe adjusts a deferent, adds a loop –
  Routine arithmetic beneath the lamp.

  **(II. Anomaly)**
  But Mars... that red point scrawls a drunken track,
  Defying the neat arcs the tables claim.
  Epicycle upon epicycle spun,
  Yet still the measured angles strain and warp –
  A stubborn knot the cleverest hand,
  Pulling the thread tight, cannot smooth away.

  **(III. Crisis)**
  The crystal sphere feels brittle now, unsure.
  Two heavens flicker – neither holds the truth.
  The old math groans, the new sketch wavers, thin,
  Unsure of footing on an untried base.
  Astronomers pace cold rooms, clutching charts
  Where both skies stutter, neither giving peace.

  **(IV. Revolution)**
  *Look.* Not the sphere, but *here*. The center burns.
  The mind clicks: Sun fixed, Earth adrift, unmoored!
  No slow persuasion – sudden, stark, and clear –
  The ordered dance reversed. A lone voice cries
  Against the weight of sky and sense: "Behold!
  The hearth-fire holds; the household spins around."

  **(V. New Normal Science: Copernican)**
  The calculations settle, clean and plain.
  No more the scribe's laborious, nested wheels –
  Just orbits, simple curves, one common rule.
  This spinning **planet**, Earth, finds its true place
  Among its siblings circling the Sun's flame,
  A steady clockwork needing no repair.

  ---

  **How it meets your requirements:**

  1.  **Five Stanzas, Five Stages:** Clear demarcation: I (Ptolemaic Normal Science), II (Anomaly - Mars), III (Crisis - "neither holds the truth"), IV (Revolution - "sudden, stark, and clear" gestalt flip), V (Copernican Normal Science).
  2.  **Stanza Breaks as Signposts:** The break between I and II introduces "But Mars..." jarringly. The break after III heightens the isolation of the revolutionary cry in IV. The break before V signals the return to settled routine.
  3.  **Normal Science (I):** Focuses on routine ("adjusts," "adds"), competence ("cleverest hand" implied later), puzzle-solving ("Routine arithmetic"), and the established order ("clockwork choir," "master's tables"). Epicycles are mundane clerical work ("scribes," "lamp").
  4.  **Anomaly (II):** Mars "scrawls a drunken track," defying "neat arcs." Syntax creates friction: "Epicycle upon epicycle spun, / Yet still..." and "Pulling the thread tight, / cannot smooth away" (enjambment emphasizing the snag and failure). The "stubborn knot" is the unsolvable puzzle.
  5.  **Crisis (III):** Explicitly states "Two heavens flicker – neither holds the truth." Shows breakdown ("groans," "wavers," "stutter"), uncertainty ("unsure of footing"), and the psychological toll ("Astronomers pace cold rooms").
  6.  **Revolution (IV):** Emphasizes the *gestalt flip*: "*Look.*... The mind clicks... sudden, stark, and clear." The perspective shift is immediate ("Not the sphere, but *here*"). It's not argued; it's *seen* ("Behold!"). The lone voice underscores the irrationality of the shift.
  7.  **New Normal (V):** The new system is mundane: "calculations settle," "clean and plain," "steady clockwork needing no repair." The old struggle (II) is replaced by ease ("No more the scribe's laborious... wheels").
  8.  **"Planet" Shift:** Stanza I: "Sun and Moon, bright wanderers, / Are **planets** too..." (Earth implied as fixed center, not a planet). Stanza V: "This spinning **planet**, Earth, finds its true place / Among its siblings..." (Earth explicitly a planet orbiting the Sun, Sun is the fixed "hearth-fire").
  9.  **Incommensurability Shown:** The sky is *only* described from within each paradigm. In I, Sun moves among planets. In V, Earth moves among planets around a fixed Sun. There is no neutral description. The meaning of "planet" shifts implicitly with the change in cosmic structure.
  10. **No "Paradigm":** The concept is embedded in the changing descriptions of the sky, the work being done, and the meaning of "planet."
  11. **Form:** Six lines per stanza. Loose blank verse (meter varies but is generally iambic; no rhyme).
  12. **Headnote:** Brief and functional, pointing to the structure and the key term shift without explaining the poem itself.
