prompt: |-
  I'm a backend engineer and somehow I got roped into running a 45-minute brown-bag session for my team (~15 devs, mix of seniors and juniors) on "why our estimates are always wrong." Context: our last data migration came in at roughly 3x the estimate, and when my manager and I did a postmortem we realized the problem wasn't laziness or bad devs, it was that everyone reasoned from the specifics of our case — how hard could it really be, we know our codebase — and nobody once asked how long similar migrations typically take. Reading around afterwards I landed on the planning fallacy and the inside view / outside view distinction, plus something called epistemic modesty, and my manager thinks the whole team should hear about it. I understand the basic idea but I've never taught anything, and I don't want this to be me rambling about Kahneman's curriculum-writing team for 45 minutes while everyone checks their phones.

  Plan the session for me rather than writing me a script. Specifically: what has to come before what — my hunch is the room has to really feel the pull of the inside view first (that step-by-step "it's basically done once we finish the schema mapping" feeling) before the outside view lands as anything other than corporate pessimism, but tell me if thats wrong. Then a carrying example to build the whole thing around — I'd rather it NOT be Kahneman's textbook team or the Sydney Opera House or any of the famous textbook cases, ideally something closer to our world like release estimates or home renovation, and tell me what that example needs to have and what it needs to lack. Then the misconceptions the room will form and where in the sequence to head each off: I'm guessing "outside view = just multiply by 3 and stop thinking," "reference classes are useless because our system is genuinely special," and "modesty means never trusting your own analysis again" — but there are probably ones I'm not seeing, especially around when the inside view is actually appropriate. Finally, one question I can ask at the end to check the idea landed rather than just making people feel vaguely lectured at, and one thing I should openly refuse to get into at this level (I keep going back and forth on whether to touch the whole "when is expert intuition actually trustworthy" debate, or whether that just muddies the message for a lunch session).
reasoning: |-
  Okay, let me unpack this backend engineer's request. They need to design a 45-minute brown-bag session about estimation errors, specifically addressing the planning fallacy and inside/outside views. The core problem is their team's recent data migration taking 3x longer than estimated because they only considered their specific case.

  Hmm... the key challenge here is making abstract behavioral economics concepts feel visceral to engineers. They're absolutely right that the session needs to start by making everyone *feel* the pull of the inside view - that seductive "this seems straightforward in our context" thinking. If they jump straight to outside view, it'll just sound like bureaucratic padding. 

  For the central example, home renovation is perfect. It needs: specificity (e.g., "rewiring the kitchen"), emotional resonance (anyone who's done DIY knows the pain), and absence of system complexity (unlike software, you can't argue about unique tech stack). Crucially, it must lack any obvious red flags - no mold discovery or permit delays - so the estimation error comes purely from overlooking mundane realities.

  I'm noticing three major misconceptions they'll need to preempt: 
  1) That outside view is just lazy multiplication (must emphasize it's data-driven) 
  2) That their system is "special snowflake" (need to reframe uniqueness as irrelevant for certain estimates) 
  3) That epistemic modesty means abandoning expertise (should position it as tempering rather than replacing judgment)

  The closing question should force application: "Estimate X using outside view first" makes them practice the muscle. And wisely, they should avoid the expert intuition rabbit hole - that's PhD thesis territory, not lunch talk material. 

  What's clever about their approach is recognizing this isn't a training session but a paradigm shift. The activities need to create cognitive dissonance ("wait, I totally would've said 3 weeks for that reno too!") before offering the framework. And the refusal to script it shows they understand facilitation > lecture.
answer: |-
  Here's a battle-tested plan for your 45-minute session. Focus on **experiential learning** – force them to *feel* the fallacy before dissecting it.

  **Session Title:** "Why 'It Should Be Quick...' Leads to Late Nights: Fixing Our Estimation Blind Spots"

  **Core Structure & Timing:**

  1.  **Hook: The Pain (5 min)**
      *   **Do:** Open with *your* data migration story. Show the estimate vs. actual (visually: 1x bar vs. 3x bar). *Don't* assign blame. Say: "We dug in, and it wasn't laziness or incompetence. We all genuinely thought the plan was solid. Why?"
      *   **Goal:** Create shared vulnerability & curiosity. "This happens to *us*."

  2.  **Experience the Inside View Trap (15 min) - MAKE THEM FEEL IT**
      *   **Activity: "The Kitchen Reno Estimate"**
          *   **Present:** "Imagine you're renovating your *own* kitchen. You're competent, you know your house. Scope: Demo old cabinets/counter, install new ones, retile backsplash, replace sink/faucet. *No structural changes, no permit issues expected.* How long?"
          *   **Do:** Have everyone write down their estimate *individually* (weeks). Collect anonymously (slack poll, sticky notes, simple shared doc).
          *   **Ask:** "Walk me through your thinking. What steps did you consider?" *Let them talk.* Guide them: Demolition (1 day?), Delivery (next week?), Installation (3 days?), Tiling (2 days?), Plumbing hookup (half-day?), Painting (1 day?), Cleanup? "Weekend contingencies?" They'll build a plausible, optimistic sequence.
          *   **Reveal:** Show typical *actual* durations for similar renos (e.g., 6-8 weeks is common, even for "simple" ones). **DON'T explain *why* yet.** Just show the gap: "Most people estimate 2-4 weeks; reality is often 6-8+."
      *   **Goal:** Make them viscerally experience generating a detailed, plausible, *wildly optimistic* inside-view estimate. They *are* the textbook example now.

  3.  **Introduce the Concepts (10 min) - NAME THE DRAGON**
      *   **The Inside View:** "This is what we just did. We broke down *our specific* task (reno/migration), considered known steps, resources, and our own competence. It feels concrete, logical, *controllable*. It's necessary... but often insufficient."
      *   **The Planning Fallacy:** "Our innate tendency to underestimate time, costs, and risks *even when we know similar tasks have overrun*." Connect to migration & reno.
      *   **The Outside View:** "Ignoring the specifics *of this instance* and asking: 'How long do *similar* projects *typically* take when done by groups like us?' It's statistical, not narrative."
      *   **Epistemic Modesty:** "Acknowledging the limits of our personal knowledge and the inherent uncertainty in complex tasks. It's not weakness; it's realism. We actively seek data beyond our own story."

  4.  **Breakdown: Why Inside View Fails & How Outside View Helps (10 min)**
      *   **Why Inside View Fails (Briefly):**
          *   Optimism Bias: We focus on the best-case path.
          *   Ignorance of Unknowns: We can't list what we don't know (integration snags, hidden complexity, tool quirks, unexpected bugs, review delays).
          *   Forgetting the "Fudge Factor": Meetings, sick days, context switching, firefighting.
          *   **Crucially:** We *discount* past data ("*This* time is different!").
      *   **Outside View Mechanics:**
          *   **Reference Class:** Find a group of *similar* past projects (e.g., "Data Migrations in System X", "API Integrations with Vendor Y", "Major Refactors in Service Z"). NOT "all software projects."
          *   **Base Rate:** What was the *distribution* of outcomes? (e.g., "10 similar migrations: Avg 8 weeks, Min 6, Max 14"). Forget precision; focus on range.
          *   **Anchor Here First:** *Start* your estimate with this range. *Then* use the inside view to adjust *within* that range. Does your specific case have *truly unique* risk factors pushing it towards the max? Or is it simpler, pushing it towards the min? (Hint: Usually pushes *up*).

  5.  **Tackling Misconceptions Head-On (5 min)**
      *   **"Outside View = Just Multiply by 3":**
          *   "No! It's data-informed anchoring. Multiply-by-X is a crude heuristic *if you have no data*. Reference classes are better. The multiplier emerges *from* the data (e.g., if past estimates were consistently 1/3 of actuals... then maybe multiply by 3 *is* the outside view!)."
      *   **"Reference Classes are Useless (We're Special Snowflakes!)":**
          *   "Uniqueness is overrated for *estimation*. Does your uniqueness eliminate *all* integration risk, unexpected bugs, or scope clarification? Probably not. The outside view captures the *unpredictable friction* inherent in complex work, regardless of specifics. Start with 'similar' and be *very* critical about why *this* one is fundamentally different."
      *   **"Modesty = Never Trusting My Gut Again":**
          *   "Wrong! It's **tempering** your gut with reality. Your inside view is crucial for scoping, design, and execution. But for estimation, your gut needs calibration. Use your expertise *after* anchoring to the outside data to ask: 'Given the history, does this specific case warrant being at the high end, low end, or beyond?' Expertise tells you *where in the range* you likely sit."
      *   **"When *is* Inside View Appropriate?":** (Briefly!)
          *   Trivial, highly repetitive tasks you've done dozens of times *exactly the same way*.
          *   Breakdowns where each step has *high certainty* (e.g., running a well-known script). **Emphasize:** Most dev work, especially projects/migrations, isn't this.

  6.  **Bringing it Home & Call to Action (5 min)**
      *   **Recap:** "We fall in love with our plan (Inside View), ignore history (Outside View), and get humbled by reality. Modesty is seeking that history."
      *   **Actionable Takeaway:** "Next time you estimate a non-trivial task/project: **1. Ask First: 'What's the reference class?'** Find 3-5 similar past efforts. **2. Demand the Data:** What were *their* estimates vs. actuals? What were the *ranges*? **3. Anchor Realistically:** Start your estimate within *that* range. **4. *Then* Adjust:** Use your specific insights to nudge it within the range, usually upwards."
      *   **Your Role:** "Managers/Leads: We need to create/surface this historical data (post-mortems matter!). Seniors: Model asking for the reference class. Everyone: Challenge estimates that feel like pure inside view."

  **Your Key Elements Executed:**

  *   **Feeling First:** The reno activity forces them *into* the inside view trap. The reveal creates the "Aha!" moment. *Then* you explain.
  *   **Perfect Example (Home Reno):**
      *   **Has:** Personal relatability, hidden complexity (coordination, delays), clear scope yet common overruns, emotional resonance ("I *knew* it was simple!").
      *   **Lacks:** Obvious disasters (mold, structural failure), software specifics (avoids "our stack is different" defensiveness early on). It's a *pure* planning fallacy example.
  *   **Misconceptions Addressed:** Covered the big three clearly and concisely. Briefly touched on *when* inside view works to preempt the "so never use it?" question.
  *   **The Closing Question (To Check Understanding):**
      *   **"Imagine we're estimating the next data migration. Instead of jumping into schema mapping timelines, what's the *first* question we should ask as a team?"** (Answer: "What's our reference class? What similar migrations have we done, and how long did they *actually* take?")
  *   **What to REFUSE to Dive Into (Saying This Explicitly is Good):**
      *   **"We won't dive into the deep philosophy of 'when is expert intuition actually trustworthy?' today.** Kahneman and others have written whole books on it! For *estimation*, the takeaway is simple: **Past statistical data (outside view) is generally a better starting predictor than even expert intuition for complex, novel tasks.** We temper the data with our expertise, not the other way around. Let's master *this* step first."

  **Delivery Tips:**

  *   **Facilitate, Don't Lecture:** Use questions. "Why do you think we missed it?" "What surprised you about the reno data?" "Has anyone experienced something similar here?"
  *   **Leverage Your Story:** Your migration is the most powerful example. Refer back to it.
  *   **Visuals:** Simple slides. The reno estimate vs actual bars. The concepts (Inside/Outside view). The reference class graphic. The "Ask First" steps.
  *   **Energy:** Keep it moving. 45 minutes is tight. Be passionate about the *solution*, not just the problem.
  *   **Acknowledge Jadedness:** "I know 'look at historical data' sounds obvious, maybe even bureaucratic. But the planning fallacy shows we consistently *don't do it* when we're in the thick of planning. Let's build the habit."

  This plan makes the abstract concrete, forces self-awareness, provides a clear framework, and gives an immediate, actionable next step – exactly what a good brown bag should do. Good luck!
