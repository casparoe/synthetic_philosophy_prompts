  Here's where I stand: Maxwell's demon got genuinely resolved once people noticed the demon's memory, and the resolution holds. The demon can sort fast and slow molecules all it wants, but the information it gathers has to live somewhere, resetting that memory to a blank state costs at least kT ln 2 per bit, and that exactly cancels the entropy it removed from the gas. Second law survives, just with information-theoretic bookkeeping built in. What would actually count against this view? Not the hand-wavy objections — I want the serious threats, ranked from fatal to merely awkward. A couple that already bug me: someone told me that if the demon's memory bit already happens to be in the state it needs, the reset looks thermodynamically free, which suggests the cost is really about memory *preparation* rather than erasure as such, and that the neat kT ln 2 bookkeeping isn't as universal as advertised. And I've never settled for myself whether the erasure principle is supposed to be a theorem of statistical mechanics or an empirical finding, which seems to matter for how much weight the whole resolution can bear. There's also the thing about the second law being statistical anyway — a demon that runs for a while and only pays the erasure bill later doesn't obviously contradict anything, so in what sense does the resolution save the law rather than reinterpret it? For each of these (and anything else you think is in the same weight class), tell me whether a committed defender of the resolution should concede it as a real problem, absorb it with a clarification, or just dismiss it — and be honest about whether the view has been qualified into something unfalsifiable, and whether that would even matter for a principle of this kind. Under 450 words please.
