prompt: |-
  My sister and I have been arguing for years about whether an evil rule counts as a real law or is just force dressed up as law, and over that time she has settled into what looks like a stable pattern of verdicts. I want to be able to predict her on new cases, and I keep failing, so I'd like your help figuring out the rule she is actually running.

  Her verdicts so far, on cases we've argued about at family dinners: a clearly worded, published, forward-looking statute ordering citizens to inform on a persecuted minority — she says that one is not law at all, though I've noticed she also claims it was never really enforced as written, since officials looked the other way when the accused was well connected. The old pass laws of apartheid South Africa, terrible but clear, published, and enforced in an orderly, predictable way — she says those were laws, evil ones, and she gets impatient when I treat that answer as a concession. A secret decree nobody was allowed to read, punishing people for conduct that was not a crime when they did it — not law. A clearly posted modern regulation with a modest fine for something everyone agrees is unfairly treated — law, obviously, next question.

  Here are the new cases I want to put to her, and I'd like you to predict her verdicts. First, a country whose legislature passes a plainly worded, prospective, published statute requiring householders to report guests who stay more than three nights, and — this is the part that differs from the informer statute — it is enforced exactly as written, against everyone, friend of the regime or not. Second, after a peaceful revolution, the new democratically elected parliament passes a clear, published statute that retroactively criminalizes acts the old regime's officials committed with full legal authority at the time, including interrogation methods everyone now calls torture. Third, a statute that is general, published, and prospective, but written so vaguely that officials, judges, and citizens each read it three different ways, and the government enforces whichever reading suits it that week.

  What I really want is not just answers but the candidate rules that fit her record so far. Is it something like "a rule is law only if it's made and administered lawfully — general, public, forward-looking, clear, and actually enforced the way it's written" — in which case she has to treat the pass laws and the fairly enforced informer statute alike, and I'd like to know whether she can live with that? Or is it "a rule evil enough stops being law," in which case the pass laws bother her? Or "a rule that conscripts ordinary citizens into doing wrong isn't law, while one that merely targets its victims still is"? Or some fourth thing. For each new case, tell me what each rule predicts, give me your best guess at her verdict with your reasons, and design the one further case I should put to her next to best tell the rules apart. Please write in American English.
reasoning: |-
  Okay, the user is trying to understand his sister's philosophy on what constitutes "real law" versus "force dressed as law." They've been arguing this for years, and he wants to predict her verdicts on new cases. Let me start by analyzing her past verdicts to find patterns.

  First, her responses to known cases: The informant statute ordering citizens to report a persecuted minority—she says not law, noting it wasn't enforced against well-connected people. Apartheid pass laws (clear, published, enforced predictably)—she calls them evil laws. Secret retroactive decree—not law. Fair modern regulation—law.

  Key factors here seem to be publication, clarity, prospectiveness, and consistent enforcement. But the informant statute was published and clear, yet she rejected it. The difference she pointed out was inconsistent enforcement. For the pass laws, enforcement was consistent, so she accepted them as evil laws. The secret decree lacked publication and retroactivity, so not law. The modern regulation meets all criteria.

  So maybe her rule requires: clarity, publication, prospectiveness, and consistent enforcement. That fits all past cases. The informant statute failed because enforcement was inconsistent, not because of its evil nature. She explicitly mentioned that officials looked the other way for the well-connected. The pass laws had orderly enforcement, so they were laws, albeit evil.

  Now, the new cases: 

  1. Enforced informant statute: Published, clear, prospective, and enforced uniformly. Applying the hypothesized rule, this should be law. Past cases suggest consistent enforcement is key here, so she'd likely say it's law, even if evil.

  2. Retroactive criminalization: Clear, published, but retroactive. She rejected the secret retroactive decree, so retroactivity seems a deal-breaker. Even though it's post-revolution, retroactivity violates prospectiveness. So she'd probably say not law.

  3. Vague statute: Published, prospective, but vague with arbitrary enforcement. Clarity is missing, and enforcement is inconsistent. She rejected similar issues in the informant case (inconsistent enforcement) and the secret decree (lack of clarity). So likely not law.

  But the user also mentioned alternative rules: one based on evilness, or conscripting citizens. The evilness rule doesn't fit because she accepted apartheid laws as evil laws. The conscription idea: the informant statute forced citizens to inform, while pass laws targeted victims. But the new enforced informant case also conscripts citizens. If she calls it law, that rules out conscription as the deciding factor. If she rejects it, maybe conscription matters. But past verdicts suggest enforcement consistency is the key.

  Next step: design a test case to distinguish between consistent enforcement and conscription. A vague law that conscripts citizens but is enforced uniformly? But vagueness might override. Better: a law that conscripts citizens (like informing) but is enforced uniformly. That's the first new case. If she accepts it, conscription isn't the issue. If she rejects, maybe it is. But her past verdict on the apartheid laws (which targeted, not conscripted) being law, and the inconsistently enforced informant not, points to enforcement. 

  Another test case: a retroactive law that doesn't conscript citizens, like punishing officials for past acts. She'd likely reject it due to retroactivity, regardless of conscription. 

  The user wants to know if she can accept the enforced informant as law. If she does, her rule is based on form and enforcement, not morality. If she doesn't, there's another factor. But given her acceptance of apartheid laws, morality isn't the primary factor. 

  So my predictions: 

  Case 1: Law. Meets all criteria. 

  Case 2: Not law. Retroactive. 

  Case 3: Not law. Vague and arbitrary enforcement. 

  Further test case: A clear, published, prospective law that conscripts citizens (e.g., mandatory reporting) and is enforced uniformly. If she calls it law, enforcement is key. If not, conscription matters. But based on her apartheid verdict, she separates morality from legality. So likely she'll call it law.
answer: |-
  Based on your sister's pattern—especially her distinction between the inconsistently enforced informant statute (not law) and the consistently enforced apartheid laws (evil law)—I'll break this down step by step. Her verdicts suggest **procedural legality** (how rules are made and applied) matters more than moral content. Here's my analysis:

  ### Her Likely Rule (Based on Past Verdicts)
  **"A rule is law only if it meets ALL these criteria:**
  1. **Published & Accessible** (not secret)
  2. **Prospective** (not retroactive)
  3. **Clear/Unambiguous** (not vague)
  4. **Enforced Consistently** (as written, predictably, without favoritism)
  5. **(Implied) General Application** (not a bill of attainder or purely personal)"

  *Why this fits:*
  - **Informer statute (not law)**: Failed #4 (inconsistent enforcement for well-connected).
  - **Apartheid pass laws (law)**: Met all criteria (#1–4), so "evil but law."
  - **Secret retroactive decree (not law)**: Failed #1 (secret) and #2 (retroactive).
  - **Modern regulation (law)**: Met all criteria.

  She *rejects* moral evil as a disqualifier (since apartheid laws were "evil but law"), and focuses on **procedural integrity**. Inconsistency (#4) seems her biggest trigger.

  ---

  ### Predictions for New Cases
  | Case                                        | Candidate Rule Prediction | My Guess for Her Verdict | Reason                                                                 |
  |---------------------------------------------|---------------------------|--------------------------|------------------------------------------------------------------------|
  | **1. Enforced informant statute** (published, clear, prospective, enforced uniformly) | **LAW** (meets all 5 criteria) | **"It's law"** | Uniform enforcement (#4) fixes the flaw from the past informant case. She'll hate it but call it law, like apartheid. |
  | **2. Retroactive prosecution of old regime** (published, clear, but retroactive) | **NOT LAW** (fails #2: retroactive) | **"Not law"** | Retroactivity violates her core requirement (#2), mirroring her rejection of the secret decree. Democratic origin won't override this. |
  | **3. Vague statute + arbitrary enforcement** (published, prospective, but ambiguous + capricious enforcement) | **NOT LAW** (fails #3 and #4: unclear + inconsistent) | **"Not law"** | Vagueness (#3) and unpredictable enforcement (#4) make it "force disguised as law," like the secret decree. |

  ---

  ### Ruling Out Alternative Theories
  - **"Evil enough = not law"**: Fails. She explicitly called apartheid laws "evil but law."
  - **"Conscripts citizens = not law"**: Unlikely. The apartheid pass laws *did* conscript citizens (e.g., Black South Africans forced to carry passes), yet she called them law. The new enforced informant statute also conscripts citizens, but I predict she’ll call it law.
  - **"Lawful origin required"**: Unclear. Her apartheid verdict implies she accepts rules from illegitimate regimes *if* procedurally sound. The retroactive case (#2) has democratic origin but fails prospectiveness—that’s her dealbreaker.

  ---

  ### The Best Next Test Case to Distinguish Theories
  **"A statute from an unelected military regime, clearly worded and published, requiring all doctors to report patients with dissident political views. It is enforced uniformly against every doctor, regardless of connections."**

  - **Why this tests her rule**:  
    - If she says **"law" (evil but valid)**, her rule is purely procedural (meets #1–4).  
    - If she says **"not law"**, it suggests either:  
      - Moral evil *does* matter (rejecting "doctor conscription" as a bridge too far), OR  
      - She requires democratic legitimacy (rejecting the military regime’s authority).  

  This pits procedural compliance against moral/content-based objections. Her answer here would clarify whether "enforced uniformly" is *sufficient* (as with apartheid) or if evil + citizen conscription *combined* negates legality despite procedure.

  ---

  ### Key Insight
  Your sister separates **legal validity** from **moral legitimacy**. Her frustration when you treat apartheid as a "concession" suggests she sees law as a technical category—one that can be weaponized. If she accepts the enforced informant statute (#1) as law, it confirms her stance is about **rule-of-law mechanics**, not moral comfort. If that unsettles her, the doctor test case will force a reckoning.
