  First, I need to understand the core of each position. The all-affected-interests camp argues that anyone whose interests are impacted by a decision should have a say, regardless of citizenship. The all-subjected-to-coercion camp believes only those subject to the state's enforcement should be included, as democracy's primary role is to legitimize coercion. 

  The user provided specific sections required: agreed claims, exact disagreements, cruxes, test cases with predictions, and potential verbal disputes. I should ensure each section is balanced, avoiding any bias toward either principle. 

  Starting with the agreed claims: Both sides likely agree that democratic legitimacy requires justifying decisions to those bound by them. They might also concur that current citizenship-based boundaries are somewhat arbitrary. Cases like long-term residents or children could be common ground. I'll list these points neutrally.

  For the disagreements, phrasing is critical. Each principle's scope must be described without implying one is superior. For example, stating that Camp A includes those affected while Camp B includes those coerced, without judgment. Highlighting how each handles indeterminacy—Camp A sees it as manageable, Camp B as fatal—will clarify their differences.

  The cruxes identified by the user are solid: (a) whether affected interests create the same claim as coercion, and (b) if indeterminacy invalidates a principle. I'll frame these as open questions. For test cases, selecting real-world examples like future generations or tourists will force concrete predictions. Each side must state their view upfront to prevent backtracking.

  Verbal disputes might revolve around the term "affected." Camp A might use it broadly (e.g., economic effects), while Camp B restricts it to direct coercion. Disambiguating this could reduce misunderstandings. I'll note that in the document.

  Ensuring symmetry is key. Both students have tendencies—Camp B over-concedes, Camp A assumes their view is obvious. The template must give equal weight to both, using neutral language and mutual concessions. For instance, acknowledging that each principle has strengths and weaknesses without resolution.

  Finally, structuring the document clearly with numbered sections will provide a reusable template. Ending with signatures reinforces commitment. This approach should help the students engage constructively, addressing the user's goal of fostering collaborative rather than adversarial debate.
answer: |-
  ## Adversarial Collaboration on the Demos Boundary Problem  
  **Joint Statement by [Name of All-Affected-Interests Proponent] and [Name of All-Subjected-to-Coercion Proponent]**

  **1. Agreed Claims**  
  We jointly affirm the following:  
      1.1. **Democratic Justification Requirement:** The core purpose of democracy is to provide legitimate justification for collective decisions, particularly those imposing binding rules.  
      1.2. **Problem of Arbitrary Exclusion:** Existing boundaries of the demos (e.g., citizenship) often exclude individuals who have a significant moral claim to inclusion based on the impact or application of decisions.  
      1.3. **Shared Cases:**  
          *   **Long-Term Resident Non-Citizens:** Individuals permanently residing and working within a state's territory, paying taxes, and subject to its laws *should* be included in the demos. Both principles converge here: they are demonstrably affected *and* continuously subject to state coercion.  
          *   **Children:** Minors residing within the territory should be future members of the demos. While their current capacity differs, the *principle* of their eventual inclusion (or representation of their interests) is accepted, recognizing the state's coercive authority over them and the profound effect of decisions on their future.  
      1.4. **Non-Definitional Stakes:** The dispute is substantive, not merely semantic. The chosen principle has significant practical consequences for the scope of democratic participation and the perceived legitimacy of decisions.  
      1.5. **Legitimacy Deficit:** Both principles identify significant potential legitimacy deficits in purely territorial/citizenship-based demoi: one through exclusion of the significantly affected, the other through exclusion of the significantly coerced.

  **2. Exact Disagreements**  
  Our core disagreement centers on the *primary criterion* for membership in the demos entitled to a direct say:  
      2.1. **Proponent A (All-Affected-Interests):** Holds that the decisive factor for inclusion is whether an individual's significant interests are meaningfully impacted by the collective decision. Citizenship or physical presence is secondary to the nature and degree of impact.  
      2.2. **Proponent B (All-Subjected-to-Coercion):** Holds that the decisive factor for inclusion is whether an individual is subject to the direct, ongoing coercive enforcement of the collective decision by the state apparatus. Being affected, without being subject to enforcement, is insufficient to trigger the specific democratic duty of justification via voting rights.  
      2.3. **Scope & Indeterminacy:**  
          *   **Proponent A** argues that the "subjected" principle arbitrarily limits the demos at state borders, excluding individuals demonstrably bearing significant burdens from decisions (e.g., those suffering severe negative externalities like pollution or economic collapse).  
          *   **Proponent B** argues that the "affected" principle generates an *unknowably vast and indeterminate* demos for most significant decisions (especially regarding policy domains like environment, economy, or security), rendering it operationally infeasible and diluting the special relationship between coercion and justification that grounds democracy. Proponent B views this indeterminacy as qualitatively different and more damaging than the boundary fuzziness inherent in any principle.

  **3. Cruxes of the Disagreement**  
  The fundamental points requiring resolution are:  
      3.1. **Crux 1: The Nature of the Democratic Claim**  
          *   Does having one's *interests significantly affected* by a decision generate the *same kind and strength* of claim to a democratic say as being *subjected to the state's coercive enforcement* of that decision? Or is the claim triggered by coercion distinct and stronger because democracy's core function is to legitimize the imposition of binding rules?  
      3.2. **Crux 2: The Significance of Indeterminacy**  
          *   Is the practical *indeterminacy* of the "all-affected" demos for many decisions a *fatal flaw* rendering it unsuitable as a primary principle for constituting a demos? Or is this indeterminacy a *manageable challenge* inherent to democratic theory (similar to boundary issues under the "subjected" principle), requiring practical institutional solutions rather than abandonment of the core moral claim?

  **4. Test Cases & Predictions**  
  We agree the following cases fairly test our principles. Our *pre-argument* predictions are:  
      4.1. **Case: Future Generations**  
          *   *Crux Tested:* 1 (Nature of Claim) & 2 (Indeterminacy)  
          *   **Proponent A Prediction:** Future generations are *profoundly affected* by present decisions (e.g., climate, debt). Therefore, mechanisms *must* be found to represent their interests within the demos (e.g., proxies, guardians, weighted votes for younger cohorts).  
          *   **Proponent B Prediction:** Future generations are not *currently subject to coercive enforcement*. While their interests warrant strong moral consideration (e.g., via constitutional rights, policy constraints), they *cannot be direct voting members* of the present demos. Democracy requires contemporaneous principals and agents.  
      4.2. **Case: Tourist Subjected to Minor Coercion / Affected by Major Policy**  
          *   *Crux Tested:* 1 (Nature of Claim)  
          *   **Scenario:** A tourist (2-week visit) is subject to local traffic laws (coercion) but is also significantly affected economically by a sudden, major change in national trade policy impacting their home-country industry.  
          *   **Proponent A Prediction:** The tourist's *significant interest* in the trade policy warrants inclusion in the relevant decision *despite* minimal direct coercion during the visit. The impact outweighs the temporary coercion.  
          *   **Proponent B Prediction:** The tourist's *subjection to coercive enforcement* (traffic laws) during their stay warrants a *local-level* say (e.g., on local ordinances directly impacting them), but not a say in national trade policy, where they lack sustained subjection to the enforcing state. The coercion defines the scope.  
      4.3. **Case: Citizen Living Abroad Permanently**  
          *   *Crux Tested:* 1 (Nature of Claim)  
          *   **Scenario:** A citizen permanently residing in another country, paying no taxes to homeland, not using its services, but affected by its foreign policy (e.g., sanctions impacting their business) and still subject to some laws (e.g., taxation on homeland assets, conscription).  
          *   **Proponent A Prediction:** If the foreign policy *significantly affects* their interests, inclusion is warranted. Limited ongoing coercion is secondary.  
          *   **Proponent B Prediction:** The *diminished and selective nature* of their subjection to the homeland state's coercive apparatus (compared to residents) weakens their claim to a full democratic say, potentially limiting it to specific decisions where coercion applies (e.g., taxation of homeland assets).  
      4.4. **Case: Individuals in a Sanctioned Third Country**  
          *   *Crux Tested:* 1 (Nature of Claim) & 2 (Indeterminacy)  
          *   **Scenario:** Ordinary citizens in Country Z suffer severe economic hardship due to comprehensive sanctions imposed by Country A.  
          *   **Proponent A Prediction:** These individuals are *significantly affected* by Country A's decision. In an ideal world, they should have *some* mechanism to voice their interests in Country A's decision.  
          *   **Proponent B Prediction:** These individuals are *not subject to Country A's coercive enforcement*. While Country A bears moral responsibility for foreseeable harm, the sanctions decision is made to bind *Country A's own subjects* (e.g., banks, exporters). Including citizens of Z in A's demos is neither feasible nor required by democracy's core function of legitimizing coercion *within* a polity.

  **5. Potential Verbal Dispute: "Affected"**  
  We acknowledge that part of our disagreement may stem from differing interpretations of "affected interests":  
      *   **Proponent A** typically employs a broad understanding, encompassing significant economic, social, environmental, or security impacts, even if indirect or mediated through complex chains (e.g., global markets, climate systems).  
      *   **Proponent B** often uses "affected" more narrowly, sometimes conflating it with *being the target* of coercion or experiencing *direct and immediate* harm equivalent to coercion.  
      *   **Clarification:** Disambiguating "affected" to explicitly mean *"experiences a non-trivial impact on their well-being or life prospects"* (A's core meaning) helps isolate the substantive disagreement (Crux 1) from purely verbal confusion. Proponent B maintains that even under this clarified definition, being "affected" in this sense does not generate the *same* democratic claim as being subjected to enforcement.

  **Signed,**  
  _________________________________________  
  [Name of All-Affected-Interests Proponent]  

  _________________________________________  
  [Name of All-Subjected-to-Coercion Proponent]  
  Date: _________________________  

  ---

  **Key Design Choices Reflecting Your Requirements:**

  1.  **Symmetry & Neutral Framing:** Each principle's core claim is stated neutrally in Section 2 ("holds that..."). Disagreements are framed as differences in the "decisive factor" or the "primary criterion," avoiding language implying one is the default or "common sense." Criticisms of each principle (2.3) use the opponent's own standard language ("arbitrarily limits," "unknowably vast").
  2.  **Concrete Agreed Cases:** Long-term residents and children are explicitly listed as convergence points with brief justifications referencing *both* principles. This prevents either side from dismissing the agreement as trivial.
  3.  **Cruxes Matching Your Analysis:** Crux 1 directly addresses the "same kind/strength of claim" question. Crux 2 tackles the "indeterminacy fatal or normal" question explicitly, using Proponent B's language ("fatal flaw") vs. Proponent A's ("manageable challenge").
  4.  **Pre-Commitment in Test Cases:** Predictions are clearly labeled as *pre-argument* positions. Cases are chosen to probe the cruxes directly (e.g., Tourist probes Crux 1; Future Generations/Sanctions probe Crux 2). Cases cover your suggested examples (tourists, expats, sanctioned populations, future gens).
  5.  **Explicit Verbal Disambiguation:** The "affected" ambiguity is named explicitly in its own section. The clarification offered ("non-trivial impact on well-being") aligns with Proponent A's core concern while isolating it from Proponent B's coercion focus, potentially reducing spurious conflict.
  6.  **Preventing Drafting Slips:** Language is rigorously checked to avoid phrases like "obviously affected" or "merely coerced." Concessions are mutual (e.g., agreeing current boundaries are arbitrary, agreeing on long-term residents). The structure forces equal articulation of both positions at every step. The signature block formalizes joint ownership.

  This template forces them to engage the substance of their disagreement within a structured framework, pre-commits them to specific interpretations and predictions, highlights genuine common ground, and minimizes opportunities for talking past each other or retreating from written positions. Good luck with the experiment!
