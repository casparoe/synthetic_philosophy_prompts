prompt: |-
  I serve on the board of a mid-sized nonprofit music school — about four hundred students, a modest endowment, no municipal backing. Four years ago we launched a capital campaign to convert a 1920s vaudeville house we own into a proper recital hall. The original estimate was $3.4 million; we have now spent $11.2 million, the contractor has just disclosed a serious waterproofing problem at the foundation, and completing the work is now priced at roughly $5 million more. Meanwhile, a comparable, fully renovated 400-seat venue two neighborhoods over has come on the market at $7.9 million, and our broker believes we could sell our half-finished shell for perhaps $3 million. The board is split down the middle. The strongest argument for continuing is not architectural: the family behind our largest naming gift — $4 million, pledged specifically for this building — has let it be known that they would withdraw all support from the school, and encourage their circle to do likewise, if we abandon what they regard as their hall, and their annual giving covers an operating gap no other funder plausibly would. One of our trustees, who teaches game theory, has begun calling the project Shubik's dollar auction: the game in which a dollar bill is auctioned to the highest bidder under the rule that the second-highest bidder also pays, so that once bidding passes a certain point both parties are trapped paying for a prize only one can win. She argues our position is worse, because under every option we are the one who pays for something already sunk, and each individually reasonable decision to continue has carried us to an outcome none of us would have voted for at the outset.

  Please draft the written opinion I will circulate to the board before next month's meeting. It should recommend one concrete course of action — finish under a hard cap, buy the alternative venue and sell the shell, stop and sell outright, or a better option we haven't yet considered — with the options compared on a forward-looking basis only, treating the $11.2 million as gone under every branch, as our game-theorist trustee insists. But it must also engage the donor consideration seriously rather than waving it away as sentimentality, because it is the one respect in which our situation arguably is not a dollar auction: the money already spent is, in effect, held over us by parties who can retaliate, and I want the memo to say plainly whether that makes further escalation rational here, or merely explicable. Finally, it should close with a standing rule for any future capital project — some form of pre-committed stop-loss or renewal gate at fixed spending thresholds — and defend that rule against the obvious objection that it will sometimes force abandonment of projects whose expected value, judged from inside the escalation, still favors continuing. The other trustees are practical people; they will not accept a memo that just labels the sunk-cost fallacy and stops, nor one that pretends the donor question doesn't exist.
reasoning: |-
  Okay, the user is on the board of a nonprofit music school facing a major financial dilemma. They've spent $11.2 million on renovating a historic building that was originally budgeted at $3.4 million, and now need another $5 million to finish. Meanwhile, a comparable renovated venue is available for $7.9 million, and their half-finished project might sell for $3 million. 

  The key complication is the major donor family threatening to withdraw all support if they abandon "their" hall - this isn't just about sunk costs but active retaliation risk. The game theory analogy (Shubik's dollar auction) is apt but incomplete because of this external pressure. 

  The user needs a board memo that: 1) Recommends a specific action 2) Compares options forward-looking only 3) Seriously addresses the donor leverage 4) Proposes a future spending rule 5) Avoids oversimplifying either the economic or human factors.

  Hmm... the donor threat is particularly tricky because their annual gifts cover an operating gap no one else can fill. This makes the "walk away" option potentially catastrophic beyond just losing the naming rights. But continuing could be financial suicide too.

  Let me structure this carefully. First, the recommendation should be to buy the alternative venue while negotiating with the donor family - it's the only path that potentially solves both problems. The financial comparison clearly favors this: net $4.9 million outlay vs $5+ million to finish the original. 

  But the memo must acknowledge this could still trigger the donor exodus. So we need to frame the donor talks as: offering naming rights transfer to the new venue, emphasizing shared values (preserving music education), and positioning it as salvaging their legacy rather than rejecting it. 

  For the future rule, a hard spending cap with renewal gates makes sense - say 25% over budget triggers automatic review. The defense against "but sometimes continuing makes sense" is that the rule protects against exactly this psychological trap. 

  The tone needs to be brutally honest about the sunk costs ("$11.2 million is gone regardless") while showing deep respect for the donor relationship. No academic jargon - practical language for practical people. 

  Biggest risk is the donor talks failing. The memo should admit this but argue it's still the least-bad gamble: finishing the original project risks insolvency even if donors stay, whereas the alternative venue at least provides a functioning asset. 

  Final touch: the subject line should signal decisive action - "Recommendation: Acquire Alternative Venue..." - to set the right tone from the start.
answer: |-
  ## Memorandum: Capital Project Decision & Path Forward  
  **To:** Board of Trustees, [Music School Name]  
  **From:** [Your Name/Title]  
  **Date:** [Date]  
  **Subject:** Recommendation: Acquire Alternative Venue, Sell Shell, and Engage Key Donors with Transparent Contingency  

  ### I. The Core Principle: Forward-Looking Analysis Only
  As our game-theorist colleague rightly insists, the **$11.2 million already spent is irrecoverable**. It must not factor into our decision. Our choice rests solely on future costs, benefits, and risks. We face three primary paths forward:  

  1.  **Finish Original Project (Hard Cap $5M):** Complete construction despite foundation issues.  
  2.  **Buy Alternative Venue ($7.9M) & Sell Shell ($3M):** Purchase operational hall; liquidate current asset.  
  3.  **Sell Shell Outright ($3M):** Abandon project; forfeit naming gift; accept donor retaliation.  

  *(All figures represent net future cash outflows/inflows, excluding sunk costs)*  

  | Option                     | Est. Net Future Outlay | Key Risks & Uncertainties                           | Key Benefits                                      |
  | :------------------------- | :--------------------- | :-------------------------------------------------- | :------------------------------------------------ |
  | **1. Finish Project**      | **$5.0M**              | Costs exceed cap; future maintenance surprises; delays. | Retains $4M naming gift; avoids donor retaliation. |
  | **2. Buy Alternative + Sell Shell** | **$4.9M** ($7.9M - $3M) | Shell sale price < $3M; donor retaliation despite negotiations. | **Operational hall IMMEDIATELY; resolves construction risk; preserves venue capability.** |
  | **3. Sell Shell Outright** | **$0 (Net Gain $3M)**  | Loss of $4M gift + donor retaliation = existential operating crisis. | Eliminates future construction costs/risk.         |

  ### II. The Donor Dilemma: Rational Engagement, Not Sentimentality
  The threat from our naming donor family is not mere sentimentality; it is **credible financial coercion**. Their withdrawal of the $4M pledge *and* annual support could cripple operations. This *does* differentiate us from a pure dollar auction: a third party can inflict additional, avoidable loss if we choose certain paths.  

  *   **Finishing the project ($5M)** buys donor compliance but risks endless cost escalation and delivers a potentially flawed asset.  
  *   **Selling outright ($3M gain)** guarantees donor retaliation, likely costing far more than $4M in lost future support.  
  *   **Buying the alternative venue ($4.9M net)** is the only path offering a **negotiating position** with the donor:  
      *   We can present this as salvaging their legacy *and* the school's mission by securing a functional hall *now*.  
      *   Offer to transfer the naming rights to the new venue ("The [Family Name] Performance Hall at [School Name]").  
      *   Emphasize the responsible stewardship: avoiding throwing good money after bad *while still delivering* their vision of a dedicated recital space.  
      *   **Contingency:** If they reject this and retaliate, the financial outcome ($4.9M spent + loss of $4M gift + lost annual gifts) is arguably *no worse* than finishing the original project ($5M spent) *and* we have an operational asset. If they accept, it's a significant win.  

  ### III. Recommendation: Buy the Alternative Venue & Sell the Shell
  **I recommend we pursue Option 2: Purchase the alternative venue for $7.9M and sell our existing shell, targeting $3M.**  

  *   **Rationale:**  
      *   **Lowest Net Risk:** Lowest *probable* net outlay ($4.9M vs. $5M+ for finishing).  
      *   **Risk Mitigation:** Eliminates catastrophic construction risk (waterproofing, future overruns).  
      *   **Immediate Revenue Generation:** Operational hall = faster ticket/rental income.  
      *   **Preserves Mission Capability:** Ensures we have a dedicated, quality recital space.  
      *   **Best Donor Negotiation Posture:** Offers a pragmatic, mission-focused solution that honors the donor's intent while demonstrating fiscal responsibility. It provides a path to potentially retain their vital support.  

  ### IV. Critical Contingency: Transparent Donor Negotiation
  *   **Immediately engage the naming donor family.** Present the situation with brutal honesty:  
      *   The unforeseen $5M overrun required to finish "their hall" is unsustainable and threatens the school's core financial health.  
      *   Purchasing the alternative venue allows us to fulfill the *purpose* of their gift – providing a permanent, dedicated recital hall for students and the community – immediately and cost-effectively.  
      *   Offer the naming rights transfer as a seamless continuation of their legacy.  
      *   Clearly state the alternative: Abandoning the venue concept entirely (Option 3) is the only other financially viable path, which would force us to forfeit their gift and deeply regret the loss of their partnership.  
  *   **Decision Deadline:** Set a firm deadline (e.g., 10 business days) for their response to the naming transfer proposal *before* finalizing the purchase/sale. Their reaction will be critical data but should not paralyze us – the financial logic of Option 2 stands regardless.

  ### V. A Standing Rule for Future Capital Projects: The Hard Cap Renewal Gate
  To prevent recurrence, I propose this binding rule for *all* future capital expenditures exceeding $500,000:  

  **"At any point where committed expenditures (including contracts, materials, labor) reach 125% of the original Board-approved budget, the project is automatically paused. No further spending is authorized until the Board, based on a fresh, independent forward-looking cost/benefit/risk analysis (treating all prior spend as sunk), explicitly reapproves the project with a new, hard cap budget. This approval requires a 2/3 majority vote of the full Board."**  

  *   **Defense Against the "Expected Value" Objection:**  
      Yes, this rule may force abandonment of projects that, *from within the escalation tunnel*, still show a positive expected value. This is the **entire point**. Escalation creates powerful psychological and institutional biases that systematically *overestimate* future benefits and *underestimate* future costs and risks. The "expected value" calculation inside the tunnel is notoriously unreliable. The rule forces a cold, external perspective *before* crossing critical thresholds. It protects the organization from ruin by making disengagement a structured, pre-committed option, not a failure of will. It shifts the burden of proof onto proponents to justify *further* investment with fresh data, under heightened scrutiny.  

  ### VI. Conclusion
  We are in an agonizing position created by unforeseen circumstances and escalating commitment. Continuing the original project offers only the illusion of safety while carrying unacceptable financial risk. Selling outright guarantees severe donor retaliation. Purchasing the alternative venue provides a functional asset at the lowest probable net future cost and offers the best – though not guaranteed – chance to preserve our critical donor relationship through honest negotiation and a pragmatic solution.  

  The $11.2 million is gone. Our duty now is to preserve the school's future with the least additional risk. **I move that the Board authorize negotiations for the purchase of the alternative venue and the sale of our existing shell, contingent upon the immediate and transparent engagement with the [Family Name] regarding the transfer of naming rights.** Let us secure our students' future performance home and rebuild our financial foundation.  

  Respectfully submitted for your consideration before our crucial vote.
