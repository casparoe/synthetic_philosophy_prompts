  **FOR IMMEDIATE RELEASE**

  **AquaStewardship Council Unveils Industry-First Premium Welfare Certification for Whiteleg Shrimp, Harnessing Sentience Science for Enhanced Value**

  *Singapore, 17 October 2023* – The AquaStewardship Council (ASC) today announced the groundbreaking launch of its Premium Welfare Pathway (PWP) certification for farmed *Litopenaeus vannamei* (Whiteleg Shrimp). This innovative scheme represents a significant leap forward in responsible aquaculture, translating the latest scientific understanding of crustacean sentience into tangible, verifiable welfare standards that deliver value across the supply chain.

  Recognising the growing consumer and retailer demand for ethically sourced seafood, the PWP harnesses the pivotal 2022 UK Animal Sentience legislation acknowledgement as a springboard for market differentiation. The scheme provides shrimp producers with a clear, tiered framework to demonstrate their commitment to progressive animal care, meeting discerning buyer expectations while optimising operational efficiencies. Crucially, the PWP offers producers flexibility, allowing them to select the welfare level that aligns with their market positioning and resource capabilities, from the accessible Foundation Tier to the premium Platinum Plus Tier.

  **Optimising Lifecycle Management for Superior Outcomes**
  The PWP incorporates scientifically validated practices designed to enhance welfare and productivity throughout the shrimp lifecycle. Key innovations include selective broodstock enhancement protocols, ensuring consistent, high-quality nauplii production essential for stable yields. Water quality parameters and stocking densities are meticulously calibrated via the ASC's proprietary BioYield Matrix™, maximising resource utilisation and minimising biological stressors to facilitate optimal growth. Harvest protocols are similarly refined; the Platinum Plus Tier incorporates advanced in-water electrical stun technology, while the Foundation Tier utilises the industry-standard rapid thermal reduction method, both ensuring processing efficiency. Rigorous, independent audits, conducted by ASC-certified specialists visiting a representative sample of participating ponds, verify compliance against the comprehensive PWP criteria.

  **Unprecedented Scale of Positive Impact**
  A cornerstone of the PWP's significance is its sheer scale. Given the vast global production volume of Whiteleg Shrimp, the ASC estimates that this single scheme will cover more individual animals than any welfare certification programme in history, marking an unparalleled opportunity for positive industry transformation. This scale ensures significant market penetration for certified premium welfare shrimp.

  **The Premium Welfare Pathway (PWP) for Whiteleg Shrimp includes:**

  *   **Tiered Welfare Framework:** Foundation, Enhanced, and Platinum Plus levels, enabling producers to step up their welfare commitments incrementally.
  *   **Sentience-Informed Protocols:** Management practices reflecting the latest evidence on crustacean nociception and behavioural responses.
  *   **Selective Broodstock Enhancement:** Advanced techniques applied to breeding females to maximise reproductive efficiency and larval viability.
  *   **BioYield Matrix™ Optimisation:** Real-time monitoring and adjustment of stocking density and water quality parameters (dissolved oxygen, ammonia, pH) to maximise survival rates and growth velocity.
  *   **Refined Harvest Options:** Platinum Plus Tier utilises cutting-edge in-water electrical stun systems for instantaneous insensibility; Foundation Tier employs efficient thermal reduction protocols.
  *   **Natural Behaviour Expression Zones:** Dedicated pond areas designed to encourage species-specific activities, fostering vitality (research into defining these behaviours is ongoing).
  *   **Independent Audit Verification:** Regular assessments by ASC-accredited auditors ensuring scheme integrity.

  "This isn't just about certification; it's about catalysing a paradigm shift in aquatic farming," stated Dr Eleanor Finch, ASC's newly appointed Head of Crustacean Compassion. "The Premium Welfare Pathway provides the aquaculture sector with the first truly scalable mechanism to operationalise crustacean sentience science. By aligning enhanced welfare practices with commercial viability through our tiered approach and BioYield Matrix™, we empower producers to meet evolving ethical expectations while safeguarding their businesses. The potential for positive impact, given the billions of animals involved, is truly transformative. We are proud to lead this essential evolution in responsible shrimp production."

  **ENDS**

  **About the AquaStewardship Council (ASC):**
  The ASC is a global leader in developing certification standards for responsible aquaculture, fostering environmental sustainability and social responsibility. The Premium Welfare Pathway for Whiteleg Shrimp expands its commitment to encompass leading animal welfare science. www.aquastewardshipcouncil.org (fictitious)

