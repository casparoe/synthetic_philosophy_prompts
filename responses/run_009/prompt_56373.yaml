prompt: |-
  I spent thirty-six years as a physical chemist — mostly spectroscopy, the last decade in polymer characterization — and since retiring I have joined a fortnightly philosophy reading group that has worked through Kripke's Naming and Necessity and Putnam's Twin Earth material, with a few members now pressing David Chalmers's two-dimensional semantics on the rest of us. I follow perhaps two-thirds of it. Our most decisive member is Miriam, a retired circuit court judge who treats every example the group proposes as a case to be ruled on, delivering verdicts with great confidence and, I am fairly sure, no underlying theory she would own up to. She insists she is just reporting how the words work. I have kept minutes of her rulings, and I would like your help predicting her rulings on the cases I plan to bring next meeting.

  Her verdicts so far, in the order she issued them:

  1. "Water is H₂O" — necessary; and only empirical investigation could have established it.
  2. "Hesperus is Phosphorus" — same ruling: necessary, a posteriori.
  3. "Water is the watery stuff" — by which she meant the clear, potable liquid that fills our lakes and rivers, whatever its underlying chemistry might turn out to be — knowable a priori, simply by grasping the concept.
  4. On the hypothetical that the clear, potable liquid had turned out to be XYZ rather than H₂O: it might indeed have turned out that way, and in that scenario, she ruled, the liquid would still have been water. This is the ruling that made me sit up.
  5. Stick S, the standard meter in Paris: "Stick S is one meter long" is contingent, yet a priori.
  6. Jade — after I pointed out that the term covers two chemically distinct minerals, jadeite and nephrite — genuinely names a disjunctive kind; it is not a term that half-fails to refer.
  7. "Phlogiston" never referred to anything; when I pressed her, invoking jade, she said that nothing even superficially played the phlogiston role, whereas the two jades each fully play theirs.

  The three cases I intend to bring next meeting:

  A. The discovery scenario: suppose it turned out that our lakes, rain, and tap water are all XYZ — macro-indistinguishable from H₂O by any test available to us — while H₂O exists only as crystalline deposits several kilometers underground, never encountered by anyone. Has it turned out that water is XYZ rather than H₂O? Did the word "water" refer to the lakes' liquid all along, to the hidden deposits, to both, or to neither?

  B. The counterfactual twin: setting aside what would have "turned out," consider as a mere counterfactual a world whose lakes are XYZ and whose deep deposits are H₂O. Given that in our world water is H₂O, does that world contain water — and if so, in its lakes or in its deposits?

  C. Caloric: did the word "caloric," as used by the physicists who posited a self-repelling fluid flowing from hot bodies to cold, ever refer to anything at all? To heat? To molecular motion? To nothing?

  Please predict Miriam's verdict on each case, and, more importantly, tell me what rule she seems to be running. I can see at least two ways to systematize her record — two-dimensional semantics, with its distinction between what is settled by how the world seems to us and what is settled by how it in fact is; and some retooled descriptivism on which "water" just means the watery stuff and the identity with H₂O was a discovery about its referent — and members of the group have argued for a version of Putnam's externalism as well, though I suspect that one strains against her fourth ruling. Which of the new cases best discriminates between the candidate rules? Where do the rules converge, and where do they come apart on A, B, and C — and if her verdicts on A and B come out differently from each other, what exactly is doing that work? Finally, give me the single further question I should put to her that would settle, as cleanly as anything in this territory can be settled, which rule she is implicitly running — and tell me frankly whether any of her seven rulings to date sits uneasily with the rest, so I know whether to press her on it. Please write in American English.
reasoning: |-
  Okay, let me try to figure out how Miriam would rule on these new cases. First, I need to understand her existing rulings to see the pattern.

  Miriam has a background as a judge, and she bases her decisions on "how the words work." Looking at her past verdicts:

  1. "Water is H₂O" is necessary a posteriori. That matches Kripke and Putnam's view that once we discover water is H₂O, it's necessarily true.
  2. Same for "Hesperus is Phosphorus" – necessary a posteriori.
  3. "Water is the watery stuff" is a priori. So she thinks the description "watery stuff" defines the concept.
  4. If watery stuff turned out to be XYZ, it would still be water. This is interesting because it diverges from Putnam. Putnam would say that in that scenario, XYZ isn't water. But Miriam says it is. So she's prioritizing the initial concept over the actual chemistry.
  5. Stick S being one meter is contingent a priori. That's straight from Kripke – the stick could have been different lengths, but we define a meter by it.
  6. Jade refers to both minerals because both play the role. So disjunctive kinds are acceptable if both fulfill the descriptive role.
  7. Phlogiston never referred because nothing played its role, unlike jade.

  Her rulings seem to emphasize the initial concept or description fixing the reference. What matters is what the users intended to refer to when they used the word, based on how things appeared to them. The actual underlying nature might be different, but as long as something fits the superficial description, it's the referent.

  Now for the new cases:

  **Case A:** Discovery scenario where lakes have XYZ, and H₂O is underground. What is water?
  - If she sticks to her ruling #4, she should say water is XYZ because that's the watery stuff in the lakes. The hidden H₂O isn't water because it doesn't play the role. So "water" refers to the lakes' liquid.

  **Case B:** Counterfactual twin world with XYZ in lakes and H₂O underground. Given our world where water is H₂O, does that world have water?
  - Here, she might say the lakes' liquid isn't water because it's XYZ, not H₂O. But wait, in case #4 she said if it turned out to be XYZ, it's still water. But that was about our world. For a counterfactual world, she might separate the two. However, her approach seems centered on the users' perspective. In the twin world, the inhabitants would call their lakes' liquid "water," so she might say yes, that's water. But since the question specifies that in our world water is H₂O, she might say that XYZ isn't water in any world. But that conflicts with #4. Hmm, tricky.

  **Case C:** Caloric – did it refer to anything?
  - Similar to phlogiston. Caloric was supposed to be a fluid, but it turned out heat is molecular motion. Nothing fits the fluid description, so like phlogiston, she'd say it never referred to anything. Maybe heat? But heat isn't a fluid, so probably not.

  Looking at the candidate rules:
  - **2D Semantics:** There's a primary intension (what fits the description in any scenario) and secondary intension (what fits the actual chemistry). For water, primary is watery stuff, secondary is H₂O.
  - **Retooled Descriptivism:** "Water" just means the watery stuff, so the H₂O identity is a discovery about that referent.
  - **Putnam's Externalism:** The actual underlying structure (H₂O) determines the extension, so XYZ isn't water even if it looks the same.

  Miriam's ruling #4 favors descriptivism because she says XYZ would still be water. That goes against Putnam.

  For **Case A**, if she's descriptivist, she should say water is XYZ in the lakes. If 2D, primary intension picks XYZ as water in that scenario. Putnam would say it's not water, but she already rejected that in #4.

  **Case B** is the key differentiator. In the counterfactual twin world, descriptivism would say the lakes' XYZ is water because it fits the description. Externalism says only H₂O is water. 2D semantics says in that counterfactual world, "water" refers to XYZ because primary intension applies. But secondary intension in our world might say it's not water? This is messy.

  Miriam might rule that in the twin world, their "water" refers to XYZ, so yes, that world contains water in the lakes. But the question is, given our world where water is H₂O, does that twin world contain water? She might say yes, but it's XYZ, not H₂O. That aligns with descriptivism and 2D's primary intension.

  **Case C** is straightforward. Caloric was supposed to be a fluid, but nothing is such a fluid. Molecular motion isn't a fluid, so like phlogiston, it never referred. So "nothing."

  The best discriminator is **Case B** because it tests whether the actual chemistry in our world affects what counts as water in other worlds. If she says the twin world's lakes contain water (descriptivism/2D), or if she says only the H₂O deposits are water but not the lakes (externalism), that shows the difference.

  A sharp follow-up question could be: **"If we discovered that the liquid in our lakes is XYZ, would it be correct to say 'Water is XYZ'?"** Based on her ruling #4, she should say yes. If she does, that confirms descriptivism over externalism.

  Her ruling #4 is the outlier because Putnam and Kripke would say that XYZ isn't water. So that's the tension. If she holds to #4, she's not a full externalist.
answer: |-
  Based on Miriam's rulings and her insistence that she's "just reporting how the words work," her approach aligns most closely with **retooled descriptivism**, where reference is fixed by the speaker's conceptual or descriptive criteria (e.g., "water" picks out whatever satisfies the "watery stuff" role in the actual world). This contrasts with strict Putnam-style externalism (which prioritizes underlying microstructure) and 2D semantics (which distinguishes epistemic and metaphysical dimensions). Below, I predict her verdicts for your new cases, systematize her "rule," identify where theories diverge, suggest a diagnostic follow-up, and flag tensions in her record.

  ---

  ### **Predicted Verdicts for New Cases**
  1. **Case A (Discovery Scenario: Lakes = XYZ, Deposits = H₂O)**  
     **Verdict:** Water refers to the lakes' liquid (XYZ) all along.  
     *Reasoning:* Miriam's ruling #4 (if watery stuff were XYZ, it would be water) shows she prioritizes the "watery role" (clear, potable liquid in lakes/rivers) over chemistry. Here, XYZ occupies that role in our world, so it is water. The hidden H₂O isn't water because it doesn't play the watery role—it's "never encountered" and isn't the stuff we interact with.  

  2. **Case B (Counterfactual Twin World: Lakes = XYZ, Deposits = H₂O)**  
     **Verdict:** That world contains water in its lakes (XYZ), not in its deposits.  
     *Reasoning:* Miriam treats counterfactuals like discovery scenarios (#4). Since "water" in *that world* refers to whatever plays the watery role locally (XYZ in lakes), it qualifies as water. She wouldn't let our world's H₂O fact "override" the twin world's local use.  

  3. **Case C (Caloric)**  
     **Verdict:** "Caloric" never referred to anything—not to heat, not to molecular motion.  
     *Reasoning:* Like phlogiston (#7), caloric was posited as a "self-repelling fluid." Nothing satisfies that description (molecular motion isn't a fluid, heat isn't self-repelling). Jade (#6) is different because both minerals *fully played* the jade role descriptively (e.g., green, hard, used in carvings).

  ---

  ### **The Rule Miriam is Running**
  - **Retooled Descriptivism:** Reference is fixed by the **dominant descriptive criteria** associated with a term in the actual world (e.g., "watery stuff" for water). This is "retooled" because:
    - It accommodates necessary a posteriori truths (#1–2): Once reference is fixed descriptively (e.g., "water = the watery stuff"), we discover its essence (H₂O), making "water = H₂O" necessary but empirical.
    - It allows reference to shift in hypotheticals (#4) or counterfactuals (Case B) based on what satisfies the original description.
    - It rejects "failures of reference" if *something* fits the description (jade #6 vs. phlogiston #7).
  - **Contrast with Other Theories:**
    - **Putnam's Externalism:** Would say water *must* be H₂O in all worlds (contradicting #4 and Case B).
    - **2D Semantics:** Distinguishes primary intension (what fits the description in any scenario) from secondary intension (what fits the actual microstructure). Miriam collapses this—her "watery stuff" is both reference-fixer *and* meaning, so she lacks 2D's two-step intensions.
    - **Kripkean Rigidity:** She accepts necessary a posteriori (#1–2) but rejects that rigid designation overrides description (#4).

  ---

  ### **How Cases A, B, and C Discriminate Between Theories**
  - **Case A vs. B** is the critical divergence point:  
    - In **Case A** (discovery in *our* world), all theories *except* strict externalism *could* agree water = XYZ (since it occupies the watery role).  
    - **Case B** (counterfactual world) forces a split:  
      - Miriam's descriptivism says: Water = XYZ (in lakes).  
      - Externalism says: Water = only H₂O (in deposits).  
      - 2D semantics says: Primary intension (description) picks XYZ in lakes; secondary intension (actual essence) picks H₂O in deposits.  
      - *Verdict difference*: Miriam treats A and B identically (water = what plays the role), but theories diverge on B. Externalism and 2D distinguish actual vs. counterfactual reference; she does not.  
  - **Case C** is consistent across theories (like phlogiston, caloric fails), so it doesn't discriminate well.

  **Where the Rules Converge/Divide:**
  | Case | Descriptivism (Miriam) | Externalism | 2D Semantics |
  |------|-------------------------|-------------|--------------|
  | **A** | Water = XYZ (lakes) | Water ≠ XYZ; only H₂O is water | Primary: XYZ (lakes); Secondary: H₂O (deposits) |
  | **B** | Water = XYZ (lakes) | Water = H₂O (deposits) | Primary: XYZ (lakes); Secondary: H₂O (deposits) |
  | **C** | No reference | No reference | No reference |

  - **Key Divergence**: Case B tests whether "water" is **world-relative**. Miriam says yes (each world's watery stuff is water), externalism says no (only H₂O is water everywhere), 2D says it's ambiguous (depends on intension).

  ---

  ### **The Best Follow-Up Question to Diagnose Her Rule**
  Ask:  
  **"Suppose we discovered that the liquid in our lakes is XYZ. Would it be correct to say, 'Water has always been XYZ'?"**  

  - **Why this settles it**:  
    - If she says **yes** (consistent with #4), she's a *retooled descriptivist*: reference is fixed by the watery role, so XYZ would be water.  
    - If she says **no**, she leans toward *externalism/2D*: our world's actual H₂O essence "locks" water to H₂O.  
    Her #4 ruling predicts she'll say yes—but this forces her to explicitly confront whether discovery *changes* reference or *reveals* it.  

  ---

  ### **Tension in Her Rulings**
  - **Ruling #4 is the outlier**: It clashes with Putnam-style externalism (which she superficially resembles in #1–2) and strains against Kripke. If she strictly followed externalism, XYZ couldn't be water even in hypotheticals—but she allows it. This is why descriptivism fits best.  
  - **Why not a problem?** Her rulings cohere under descriptivism: #1–2 show empirical discovery *about* the descriptively fixed referent, #4–5 confirm reference is world-relative, and #6–7 show descriptions can be disjunctive or fail.  
  - **Press her?** Yes—gently challenge #4: "If water is necessarily H₂O (#1), how could XYZ ever be water?" Her answer will reveal if she truly prioritizes description over essence.

  ---

  ### **Summary**
  - **Predicted Verdicts**:  
    A: Water = XYZ (lakes).  
    B: Water = XYZ (lakes in twin world).  
    C: Caloric refers to nothing.  
  - **Her Rule**: Retooled descriptivism—reference fixed by dominant descriptive criteria ("how the words work" in practice).  
  - **Best Diagnostic**: Case B, as it forces a choice between world-relative description (her view) and transworld essence (externalism/2D).  
  - **Sharp Follow-Up**: The XYZ discovery question above.  
  - **Tension**: Ruling #4 is the linchpin—if she holds firm, she's not an externalist.  

  Miriam's strength is her consistency: she defers to the "folk" use of words (e.g., we call lakes "water" regardless of chemistry). For your group, this might spark a debate on whether language is more "democratic" (descriptive) or "scientific" (externalist). If she rules as predicted, it’s a win for descriptivism.
