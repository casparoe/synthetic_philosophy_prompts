answer: |-
  ### Audit of Immigration Analogies

  #### Father's House Analogy Mappings
  - **House**: The nation-state  
  - **Door**: National border  
  - **Lock**: Immigration controls/laws  
  - **Owner**: Citizens (collectively "own" the country)  
  - **Family Inside**: Current citizens/residents  
  - **Empty Guest Room**: Unused land/resources  
  - **Stranger Walking In**: Immigrant  
  - **Locking the Door**: Sovereignty/right to exclude  

  **What It Smuggles In**:  
  - Assumes the nation is a *private* property owned by citizens.  
  - Implies immigrants are trespassers violating personal space.  
  - Frames citizens as a monolithic "family" with identical interests.  

  ---

  #### Daughter's Apartment Building Mappings  
  - **Apartment Building**: The nation-state  
  - **Landlords**: Property owners/businesses  
  - **Employers**: Companies hiring workers  
  - **Stores**: Markets/goods/services  
  - **Newcomers**: Immigrants  
  - **Renting/Working/Shopping**: Voluntary transactions  
  - **No "Door" Involved**: National border isn't a private threshold  

  **What It Smuggles In**:  
  - Reduces the state to a real estate market with no collective identity.  
  - Ignores non-economic dimensions (culture, politics, shared infrastructure).  
  - Assumes all interactions are purely consensual with no externalities.  

  ---

  ### Load-Bearing Disanalogies (Policy-Relevant)  
  1. **House Analogy Breaks**  
     - **Why**: A country isn't a private home but a *shared public space*. Locking the "door" prevents access to *public* resources (roads, unused land) that aren't "owned" like a house. Citizens aren't co-owners but stakeholders in a system with moral/legal obligations (e.g., asylum laws).  
     - **Sinks Father's Conclusion**: His "no duty to admit" claim fails because states have duties to refugees and historical responsibilities (e.g., colonialism driving migration).  

  2. **Apartment Building Breaks**  
     - **Why**: A country has *collective governance* (e.g., taxes, welfare, elections). Landlords/employers can't unilaterally admit people if it strains *shared* resources (schools, hospitals) or alters democratic representation.  
     - **Sinks Daughter's Conclusion**: Open borders aren't viable because states must regulate membership to maintain social contracts (e.g., avoiding welfare overload or cultural fragmentation).  

  ---

  ### Verdicts on Conclusions  
  - **Father's Conclusion Survives?**  
    **False**: His "no duty to admit" stance collapses. States *do* have duties to refugees (per international law) and moral obligations. The house analogy ignores that "empty rooms" (resources) may be *unjustly hoarded* (e.g., land stolen from Indigenous peoples).  

  - **Daughter's Conclusion Survives?**  
    **False**: Her "open borders if consensual transactions exist" ignores systemic risks. Unregulated immigration can destabilize public goods (e.g., wage suppression, infrastructure strain), requiring collective oversight.  

  ---

  ### Better Analogy: **A Cooperative University**  
  - **Why it works**:  
    - The university (country) has shared resources (libraries, classrooms) and admissions criteria balancing openness with sustainability.  
    - It acknowledges voluntary exchanges (e.g., students paying tuition) but requires collective rules to maintain standards/fairness.  
    - Allows for both generosity (scholarships for refugees) and justified exclusion (rejecting applicants who threaten campus safety).  
  - **Policy Reflection**: Like a university, a country can admit selectively based on capacity, contribution potential, and ethical duties—neither fully open nor closed.  

  ---

