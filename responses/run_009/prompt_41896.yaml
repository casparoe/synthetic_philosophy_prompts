prompt: |-
  I'm writing a novel where a father argues immigration with his daughter over dinner, and I want the scene to actually hold up. He leans on the line that a country is like a house: your home is yours, you lock your door at night, and nobody has a right to walk in just because their own place is worse -- letting people in is generosity, not a duty. She fires back that a country isn't a house at all, it's more like a giant apartment building: newcomers rent from willing landlords, work for willing employers, shop at willing stores, and nobody's "door" is involved. I don't want either of them to win on a cheap line. Can you audit both analogies -- lay out what maps onto what (the door, the owner, the keys, the family inside, the empty guest room, whatever the source domain offers), then where each mapping breaks, and what each one quietly smuggles in about who the country belongs to? Then separate the disanalogies that actually matter for the policy question -- whether anyone has to be admitted, and on what terms -- from the ones that are just decoration. Does the father's restrictionist conclusion survive once his disanalogies are on the table, and does the daughter's open-borders-ish conclusion survive hers? If there's a third analogy a smarter character would reach for, I'd take that too. Finish with a brief structured summary as a JSON object with fields "house_mapping" (object mapping each house element to its country counterpart), "building_mapping" (same for the apartment building), "load_bearing_disanalogies" (array, each entry naming the analogy it sinks and why), "verdicts" (object with "father_conclusion_survives" and "daughter_conclusion_survives", booleans with a one-line reason), and "better_analogy" (string).
reasoning: |-
  We are going to analyze both analogies (house and apartment building) in detail, then identify where the mappings break (disanalogies) and which of those are critical for the policy question. Finally, we'll see if the conclusions of each character survive the disanalogies and suggest a better analogy.

  ### Father's House Analogy:
  Mapping:
  - House: The country.
  - Door: The national border.
  - Lock: Border control/immigration restrictions.
  - Owner: The citizens of the country (collectively) or the government representing them.
  - Family inside: Current citizens.
  - Empty guest room: Unused resources (land, jobs, etc.) that could be used by immigrants.
  - Walking in uninvited: Illegal immigration.
  - Letting people in: Legal immigration (as an act of generosity, not duty).

  What it smuggles in:
  - The country is a private property owned by the citizens (like a family owns a house).
  - The government is like the head of the household who decides who enters.
  - Immigrants are like strangers who have no prior connection or claim.

  Critical disanalogies (load-bearing for policy):
  1. **Ownership of the country**: A country isn't privately owned like a house. It's a collective space with complex governance, including obligations under international law and human rights. The "owner" (citizens) doesn't have absolute rights to exclude as a private homeowner does.
  2. **Resources and space**: A house has fixed space and resources that are diminished when shared. A country's economy can grow with more people (immigrants can be net contributors). Also, the "empty guest room" might be a resource that isn't being used and could be shared without harming the family, but in a country, resources like land are not simply "empty" but may be public or have complex ownership.
  3. **Duty vs. generosity**: The analogy ignores that countries have historical and moral obligations (e.g., due to colonialism, wars, or global inequalities they contributed to). Also, international treaties (like refugee conventions) create legal duties.

  Does the father's restrictionist conclusion survive? 
  - Partially. The core idea that a country has the right to control its borders is widely accepted in international law. However, the absolute discretion implied by the house analogy (like locking the door) is undermined by obligations to refugees and human rights considerations. So, while a country can set immigration policies, it cannot do so arbitrarily without regard to international law and moral duties.

  ### Daughter's Apartment Building Analogy:
  Mapping:
  - Apartment building: The country.
  - Landlords: Property owners (or businesses) who rent to immigrants.
  - Employers: Business owners who hire immigrants.
  - Stores: Sellers who transact with immigrants.
  - Newcomers: Immigrants.
  - Renting, working, shopping: Voluntary economic transactions.
  - Nobody's "door" is involved: The national border isn't like a private door because the transactions are between consenting parties and don't require the permission of the entire building (country).

  What it smuggles in:
  - The country is merely a collection of private properties and voluntary exchanges.
  - There is no collective entity (the state) that has the right to regulate the overall flow of people because each transaction is private.
  - The only relevant permissions are from the individuals directly involved (landlords, employers, etc.), not the community as a whole.

  Critical disanalogies:
  1. **Collective governance**: An apartment building typically has a building management or homeowners association that sets rules for the common good (like security, shared spaces). Similarly, a country has a government that regulates immigration for reasons of national security, public resources (welfare, infrastructure), and social cohesion. The daughter's analogy ignores that the "building" (country) as a whole has a legitimate interest in who moves in, even if individual landlords are willing.
  2. **Public goods and externalities**: Immigration affects public goods (like schools, roads, social services) and can have negative externalities (e.g., if too many immigrants strain public resources). In an apartment building, if one landlord rents to a problematic tenant, it can affect others. The building management (government) has a role in regulating for the common good.
  3. **Citizenship and non-economic factors**: The analogy reduces immigration to economic transactions. But citizenship involves political participation, cultural integration, and loyalty. Also, the state has a duty to protect its current citizens, which may include controlling the rate of immigration to ensure smooth integration.

  Does the daughter's open-borders-ish conclusion survive?
  - Partially. The idea that voluntary transactions should be allowed is strong for economic migration. However, the analogy fails to account for the collective decision-making of a nation-state and the legitimate role of government in regulating immigration for the common good. Therefore, while it argues against heavy-handed restrictions, it doesn't eliminate the need for some regulation.

  ### Better Analogy:
  A smarter character might use a **"Community Garden"** analogy. 
  - The garden is a shared resource managed by a collective (the community) with individual plots (private property) and common areas (public spaces). 
  - The community sets rules for new gardeners: they might require applications, fees, or a commitment to help maintain common areas. 
  - Why it's better: 
    - It acknowledges both collective governance (the community association) and individual transactions (plot rentals). 
    - The garden can grow and become more productive with more members, but the community must ensure that new members don't overcrowd or damage the shared resource. 
    - It reflects that the "country" is a shared project with responsibilities and benefits. 
    - It allows for both generosity (inviting refugees or those in need) and rules (to prevent abuse of the system).

