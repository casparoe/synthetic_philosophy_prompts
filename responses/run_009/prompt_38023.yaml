answer: |-
  ### Retrodiction Evaluation Procedure for Model Validation

  This procedure assesses models pre-fitted to historical data, minimizing "retrodiction bias" (over-crediting models for explaining past events). Follow sequentially—**fail any step triggers "Reject: No retrodiction credit. Provide live forecasts."** Judgment calls (JC) are flagged; escalate to senior validation lead if unresolved.

  ---

  #### **Step 1: Event-Independence Check** (JC)  
  **Question**: *Was the model designed using specific knowledge of the events it claims to predict?*  
  **Sufficient Answer**:  
  - Builder demonstrates model structure (e.g., variables, thresholds) was defined *before* analyzing target events (e.g., via preregistered research or dated documentation).  
  - Theoretical foundation (e.g., "This factor explains risk premia") exists independently of the events.  
  **Failure**: Builder admits events directly influenced design (e.g., "We added housing variables to capture 2008").  
  **Output**: Fail → Reject.  
  **Vibe Check**: High skepticism if events are prominently cited in marketing materials.

  #### **Step 2: Out-of-Sample (OOS) Stress Test** (Quantitative)  
  **Question**: *Does the model hold up when tested on unseen data adjacent to key events?*  
  **Sufficient Answer**:  
  - Split data: Train model on data *ending 1–3 years pre-event*; test on *event window + 1 year after*.  
  - Metrics must exceed benchmarks (e.g., for bubbles: precision > 60%; for macro: RMSE < benchmark model).  
  **Failure**:  
    - Performance drops significantly (e.g., precision ≤ 50%, RMSE > benchmark).  
    - Model misses the event entirely (e.g., no "bubble warning" in 1999 for 2000 crash).  
  **Output**: Fail → Reject.  
  **Quantitative Rigor**: Use fixed model specs; no retraining on test data.

  #### **Step 3: Sensitivity to Critical Episodes** (JC/Quantitative Hybrid)  
  **Question**: *Does the model’s success hinge on single events or narrow windows?*  
  **Sufficient Answer**:  
  - Remove each claimed event window (e.g., 1998–2000 for dot-com, 2007–2009 for GFC) and recalculate overall fit.  
  - Performance (e.g., global R², AUC) should not drop >20% from full-history fit.  
  **Failure**:  
    - >20% performance loss when any single event is excluded.  
    > *Example*: A model’s R² falls from 0.8 to 0.5 when 2008 is excluded → over-reliance.  
  **Output**: Fail → Reject.  
  **JC Note**: Human judgment to define "event window" breadth (e.g., 12 vs. 24 months).

  #### **Step 4: Complexity vs. Robustness Audit** (Quantitative)  
  **Question**: *Is the model over-engineered for the dataset?*  
  **Sufficient Answer**:  
  - **Parameter check**: Parameters ≤ 10% of training observations (e.g., 50 params max for 500 data points).  
  - **Stability test**: Refit model on bootstrapped samples; >90% of key parameters retain sign/significance.  
  **Failure**:  
    - Excess parameters (e.g., 100 params for 200 obs).  
    - Parameter instability (e.g., sign flips on >30% of bootstraps).  
  **Output**: Fail → Reject.

  #### **Step 5: Benchmark Comparison** (Quantitative)  
  **Question**: *Does the model beat a simple, theory-agnostic benchmark?*  
  **Sufficient Answer**:  
  - Outperform naive benchmarks (e.g., historical mean, linear trend) on OOS test (Step 2) with statistical significance (p<0.05 via Diebold-Mariano test).  
  **Failure**: Fails to beat benchmark (e.g., valuation model underperforms "CAPE > 30" rule).  
  **Output**: Fail → Reject.

  #### **Step 6: Handling New Models (No Live Track Record)**  
  **If all prior steps pass**, but no live data exists:  
  - **Approved with conditions**:  
    1. **Theoretical justification** (JC): Strong, non-circular narrative (e.g., "This factor links to risk premia via X mechanism").  
    2. **Pilot mandate**: Run live with limited capital (e.g., 0.5% of AUM) for 6–12 months.  
    3. **Precommit metrics**: Define success/failure thresholds (e.g., "SR > 0.5 or reject").  
  - **Failure**: Weak theory or refusal to pilot → Reject.

  ---

  ### Case Studies: Applying the Procedure

  #### **Case 1: Valuation Model (Flags 2000 & 2008 Bubbles)**  
  - **Step 1 (JC)**: Builder claims model uses "Shiller P/E and debt ratios"—established pre-2000. Pass.  
  - **Step 2 (OOS)**:  
    - Train: 1970–1996; test: 1997–2000.  
    - Model flags bubble in Q3 1999 (correct).  
    - Train: 1970–2005; test: 2006–2008.  
    - Flags bubble in Q4 2006 (correct). Pass.  
  - **Step 3 (Sensitivity)**: Excluding 2000–2002: R² drops 15%. Excluding 2008–2009: R² drops 18%. Pass.  
  - **Step 4 (Complexity)**: 8 params / 1,000 obs. Stable on bootstrapping. Pass.  
  - **Step 5 (Benchmark)**: Beats "P/E > 25" rule (p=0.03). Pass.  
  **Verdict**: **Approve for live pilot** (no track record).

  #### **Case 2: 2024 Macro Model ("Predicts" 2021–2023 Inflation)**  
  - **Step 1 (JC)**: Builder admits "added supply-chain disruption vars after 2021." Failure → **Reject**.  
    > *Why*: Direct event targeting. Even if it passed later steps, fails Step 1.  
  - **Hypothetical if Step 1 passed**:  
    - **Step 2 (OOS)**: Train on 2000–2019; test 2020–2023.  
      - Model fits 2021–2023 inflation well. Pass.  
    - **Step 3 (Sensitivity)**: Excluding 2021–2023: R² drops 40% (fails).  
    - **Step 4 (Complexity)**: 20 params / 200 quarterly obs (10% ratio). Pass.  
    - **Step 5 (Benchmark)**: Beats ARIMA(1,1,0) (p=0.04). Pass.  
    **Verdict**: **Reject** (fails Step 3: over-reliance on 2021–2023).

  ---

  ### Where Retrodiction Traps Catch Practitioners  
  **Most common failure point: Step 2 (Out-of-Sample Stress Test)**.  
  - **Why**: Model builders optimize for full-history fit, ignoring temporal robustness. OOS testing exposes this when models fail on "known" events excluded from training.  
  - **Industry reality**: >70% of models fail here—e.g., a "2008-predicting" model trained on 1990–2006 misses the crash when tested on 2007 data.  

  **Secondary trap: Step 1 (Event-Independence JC)**.  
  - Builders subconsciously tune models to past crises. Human judgment is needed to detect this, but it’s often obscured by "theoretical" narratives.  

  **Pro tip**: Demand OOS tests *before* reviewing model code—this forces objectivity.
