  We are designing a procedure to evaluate models that have been pre-fitted to historical data. The goal is to avoid giving undue credit for retrodiction (fitting the past) and to push for live forecasting where possible. The procedure should be actionable in an afternoon and include clear decision points.

  Key issues with retrodiction:
  1. The model may be overfitted to the known historical data.
  2. The model builder might have designed the model with the historical events in mind (data snooping).
  3. The model's performance on the historical data does not guarantee future performance.

  The procedure will consist of a series of questions. At any point if the model fails to meet the criteria, we reject it and ask for live forecasts. Some steps are judgment calls and we note that.

