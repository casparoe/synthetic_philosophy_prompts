prompt: |-
  I'm taking a second-year applied ethics course, and we've spent three seminars on everyday conventions — tipping, queueing, jaywalking — and the debate has completely stalled and I can't work out why. The question started simple enough: when I'm on holiday somewhere and the queueing or tipping norms work differently, am I under a moral obligation to follow the local convention, or is it just sensible/polite to? But the class has split into two camps that haven't moved an inch. One side says conventions like queueing and tipping are solutions to coordination problems — arbitrary in content but not in function, everyone benefits when everyone complies, so free-riding on the convention (not tipping in America where staff literally rely on it, cutting a queue because you're in a hurry) treats other people's compliance as a resource you can exploit, which is basically unfair. The other side agrees with all of that — they don't deny the coordination story — but insists a convention can't generate a *moral* obligation, because it's just a habit held up by sanction and expectation, so at most it gives you a prudential reason plus maybe a weak duty of politeness. And that's where it died: both sides just keep repeating the same moves, and whenever someone proposes a test case (jaywalking in a city where nobody does it vs. one where everyone does, or tipping in a country where it's actively resented) each camp reads the case its own way and nothing changes.

  So what I'd like is a diagnosis rather than a verdict on who's right. Is this actually a verbal disagreement about the phrase 'moral obligation' — one side using it for anything with normative force that you'd be a bit of a jerk to violate, the other reserving it for obligations that hold independantly of local practice (like not stealing)? If it is verbal, is there any principled way to fix the usage, or is it just a fight over a word? Or is it a genuine substantive disagreement about the source of normativity — one camp thinking fairness can arise out of the mutual expectations themselves, the other thinking expectations need some independent grounding before they can obligate anyone? My tutor mumbled something about it possibly being two seperate questions — what do I have most reason to do, versus what would I be blameworthy for not doing — travelling under one heading, but never developed it, and honestly I can't tell if that would dissolve the dispute or just relocate it.

  Given whichever diagnosis you think is right, what would count as progress here? A sharper distinction, a test case that forces one side to bite a bullet everyone can see is ugly, or is this one of those disagreements that's just going to stay stuck, and if so why? Sorry for the wall of text, it's been bugging me for weeks and the seminar just goes in circles now.
reasoning: |-
  Okay, let me unpack this user's problem. They're stuck in a circular ethics debate about whether local conventions create moral obligations. Both sides are entrenched: one sees free-riding as unfair exploitation, the other denies conventions can be morally binding. 

  First, I need to diagnose why this deadlock exists. The user suspects it might be verbal - about the definition of "moral obligation" - or substantive - about the source of normativity. Their tutor mentioned a reason vs blameworthiness distinction. 

  Hmm, I think it's actually all three layers working simultaneously:
  1) Verbal: How broadly should we define "moral obligation"? 
  2) Substantive: Can mutual expectations alone create fairness duties?
  3) Meta-ethical: Are reasons necessarily prior to conventions?

  That explains why test cases don't move the needle - each camp interprets them through their own framework. Like jaywalking: the fairness camp sees orderly traffic as a collective good worth preserving, while the other sees it as mere conformity pressure. 

  The real progress might come from zooming out. Instead of fighting over "is this moral?", we could ask: 
  - What kind of reasons do conventions actually give us? (Prudential? Aesthetic? Proto-moral?) 
  - When does violating conventions become blameworthy versus merely impolite?
  - Could there be a middle position where some conventions "grow into" moral obligations when they prevent harm or exploitation?

  User seems frustrated but intellectually curious. They'd probably appreciate concrete tools to reframe the discussion. Maybe introducing David Lewis' convention theory or Hume on artificial virtues could provide fresh scaffolding. 

  Also worth noting: their frustration matters. A good diagnosis should help them feel the deadlock is tractable, not just inevitable. The key might be shifting from "who's right?" to "what precise question are we really disagreeing about?" That could turn a circular debate into a productive taxonomy of disagreement.
answer: |-
  Your frustration is completely understandable—this is a notoriously sticky debate in moral philosophy, and your diagnosis instincts are sharp. The deadlock likely stems from **multiple overlapping disagreements** (verbal, substantive, and meta-ethical) reinforcing each other. Here's a breakdown:

  ### Core Diagnoses:
  1.  **Verbal Disagreement (What counts as "moral obligation"?):**
      *   **Camp 1 ("Unfair Exploitation"):** Uses "moral obligation" broadly. They see *any* stable norm where non-compliance exploits others' cooperation (free-riding) as generating a fairness-based *moral* duty. Violating it is "unfair," which is a moral failing. "Moral" here encompasses pro-social obligations beyond foundational harm/justice.
      *   **Camp 2 ("Conventions Lack Moral Force"):** Uses "moral obligation" narrowly. They reserve it for duties grounded in universal principles (autonomy, harm, justice, rights) *independent* of contingent social practices. Conventions create *social* pressure, prudence, or etiquette, but violating them might only make you "impolite" or "foolish," not *immoral* unless it *also* violates an independent principle (e.g., causing harm, breaking a promise).
      *   **Why it fuels deadlock:** Each side interprets examples through their preferred definition. "Cutting in line" is *immoral unfairness* (Camp 1) vs. *merely rude/selfish* (Camp 2). Neither definition is inherently "wrong," but they talk past each other.

  2.  **Substantive Disagreement (Can mutual expectations *alone* generate moral force?):**
      *   **Camp 1 ("Yes - Fairness Arises from Practice"):** Believes the *very act* of participating in a mutually beneficial coordination practice, where others rely on your compliance, generates a fairness obligation. The expectations and reliance *constitute* the moral relationship. Grounding: Contractualism, some forms of Rule Utilitarianism, Scanlonian "what we owe to each other."
      *   **Camp 2 ("No - Needs Independent Grounding"):** Believes expectations are just psychological/social facts. For an obligation to be *moral*, it needs grounding *outside* the convention itself. "Why *should* I care about exploiting the cooperative scheme?" needs an answer beyond "because others expect it." Grounding: Kantianism, Natural Law, strong Moral Realism.
      *   **Why it fuels deadlock:** Test cases get filtered through this lens. Camp 1 sees *any* stable, beneficial convention as generating fairness duties. Camp 2 sees the convention as inert unless plugged into a deeper moral principle (e.g., "Not tipping exploited workers causes harm," "Cutting queues violates equal respect").

  3.  **Distinction Travelling Together (Reasons vs. Blameworthiness - Your Tutor's Point):**
      *   **What You Have Most Reason to Do (Reasons):** Camp 1 argues you have *strong moral reasons* (fairness) to comply. Camp 2 argues you have *strong non-moral reasons* (prudence, politeness, efficiency) and perhaps weak moral reasons (avoiding minor harm/offense).
      *   **What You Are Blameworthy For (Blame):** Even if Camp 2 concedes non-compliance is *bad* (rude, imprudent), they deny it warrants *moral blame* or condemnation unless an independent principle is violated. Camp 1 sees unfairness as inherently blameworthy.
      *   **Why it fuels deadlock:** Progress requires disentangling these questions: "Is there *a reason* to comply?" (Yes, both agree - prudence/politeness/fairness), "Is that reason *moral*?" (Verbal disagreement), "Does violation make you *morally blameworthy*?" (Substantive disagreement). Bundling them obscures the real friction points.

  ### Why Test Cases Fail:
  *   **Jaywalking (Empty Street vs. Busy City):** Camp 1 sees risk/order as the collective good; violating it *when it matters* is unfair exploitation. Camp 2 sees it as purely regulatory; violation is only wrong if it causes harm or disrespects law (which they might also deny is *moral*).
  *   **Tipping (USA vs. Japan):** Camp 1: In the US, not tipping exploits the system workers rely on = unfair. In Japan, tipping might disrupt local norms/offend = rude, but *less unfair* (no exploitation of a reliance practice). Camp 2: In the US, not tipping is harmful (reduces wages) and/or breaks an implied contract = potentially immoral. In Japan, tipping is just confusing/awkward = purely non-moral faux pas. Each side fits the case into their existing framework.

  ### Paths to Progress (Not Guaranteed, But Possible)
  1.  **Explicitly Map the Disagreements:**
      *   **Step 1:** Agree that conventions solve coordination problems and provide benefits (common ground).
      *   **Step 2:** Separate the questions:
          *   Q1: Do I have *any* good reason to follow local conventions? (Likely Yes - prudence, politeness, efficiency).
          *   Q2: Is *one* of those reasons a *moral* reason (specifically, fairness)? (Core substantive disagreement).
          *   Q3: If it is a moral reason, is it *strong enough* to make violation morally *blameworthy*? (Distinction often missed).
      *   **Step 3:** Isolate the verbal issue: "What do *we* mean by 'moral obligation' in this context?" Acknowledge both usages exist. Maybe temporarily adopt terms like "fairness obligation" vs. "core moral obligation."

  2.  **Seek a "Costly Bullet-Biting" Test Case:** Find an example where:
      *   Compliance is clearly inconvenient/has no prudential benefit.
      *   Non-compliance exploits others' cooperation/free-rides.
      *   Non-compliance violates *no* independent moral principle (no harm, deception, rights violation, promise-breaking).
      *   **Example:** A complex, strictly enforced queueing system for a non-essential, non-scarce resource (e.g., entering a very large, empty park where order is purely ceremonial). Cutting provides no real harm, no deception, no rights violation... but clearly exploits the order maintained by others.
      *   **Pressure Point:** Camp 1 must argue it's still *immoral* (unfair). Camp 2 must argue it's *only* rude/antisocial, not immoral. Can Camp 2 accept that the free-rider is *not* doing anything morally wrong? Can Camp 1 accept that condemnation here is *only* about social disapproval, not moral blame?

  3.  **Introduce Meta-Ethical Frameworks:** Briefly explore the underlying theories:
      *   **For Camp 1:** Explore *how* conventions generate duties. Is it implicit agreement? Reliance? Rule-utilitarian benefits? (David Lewis on conventions; T.M. Scanlon on reliance/expectations).
      *   **For Camp 2:** Explore *why* conventions lack inherent moral weight. What *is* the source of moral obligation? Universal rationality? Human flourishing? Divine command? (Kant; Natural Law theorists). Can *any* social practice ever create a genuinely new moral duty, or only activate/apply pre-existing ones?
      *   **Goal:** Shift from "Is this moral?" to "What *makes* something moral?" This exposes the foundational rift.

  4.  **Focus on the "Why" of Non-Compliance:** Instead of *whether* violating a convention is wrong, ask *why* someone might violate it. Does the *reason* matter?
      *   Cutting a queue because you're having a heart attack? (Both camps likely excuse it).
      *   Cutting because you're late for a meeting? (Camp 1: Still unfair exploitation. Camp 2: Rude, but not immoral).
      *   Cutting because you philosophically reject queueing? (Camp 1: Still unfair. Camp 2: Possibly more defensible if principled, still rude).
      *   **Pressure Point:** Does Camp 1 think *all* non-compliance for self-interest is immoral? Does Camp 2 think *no* act of non-compliance with *only* a convention is immoral, regardless of motive? This highlights the rigidity.

  ### Will it Stay Stuck?
  Possibly. The disagreement touches deep questions about the nature of morality:
  *   **Is morality primarily about harm/rights/autonomy, or also about fairness/cooperation?**
  *   **Can social practices *create* moral facts, or only reflect/implement them?**
  *   **Is "free-riding" inherently morally wrong, or just socially disfavored?**

  These aren't easily resolved. However, progress isn't necessarily about reaching consensus, but about **understanding the structure of the disagreement.** By mapping the verbal, substantive, and meta-ethical layers, and carefully disentangling reasons from blameworthiness, the debate can move from frustrating circles to a clearer, more productive exploration of the underlying philosophical terrain. Your role might be to facilitate this mapping in your seminar – asking clarifying questions about definitions, reasons, blame, and foundations whenever the repetition starts. Good luck!
