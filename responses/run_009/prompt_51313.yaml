answer: |-
  ### In-Class Tasting Experiment Design  
  **Objective:** Create a scenario where students experience the introspective indeterminacy of taste changes (without naming qualia or Dennett) and confront the three-way ambiguity: unchanged substance, changed physiology, or shifted standard.

  ---

  #### **Materials & Prep**  
  - **Bitter drink:** Brewed black coffee (bitterness agent). Prepare 4 dilutions in identical, unlabeled flasks:  
    - Flask 1: 100% coffee (strongest).  
    - Flask 2: 75% coffee + 25% water.  
    - Flask 3: 50% coffee + 50% water.  
    - Flask 4: 25% coffee + 75% water (weakest).  
  - **Physiological manipulation:** Sugar-water solution (1 tbsp sugar/100ml water) for adaptation; plain water as control.  
  - **Tasting setup:** Small disposable cups (2 sets per student, labeled A-D for samples), water for palate cleansing, spit cups.  
  - **Rating sheets:** Scales of 1–10 for "intensity of flavor" (disguised as a generic sensory study).  
  - **Logistics:**  
    - Keep flasks hidden; use a divider when pouring to imply samples might differ.  
    - Pre-measure identical samples for both phases (draw from same flasks).  
    - Assign students to Sugar or Control group secretly (alternate seating).  

  ---

  #### **Procedure**  
  **Total time:** 25–30 mins (15-min Phase 1 start, 10-min Phase 2 near end).  
  **Debrief:** 15–20 mins at session end.  

  1. **Phase 1: "Calibration" (Start of class, 15 mins)**  
     - **Disguised task:** "We’re collecting baseline data for a future study on sensory vocabulary. Taste each sample A-D and rate intensity (1= mild, 10= intense). Focus on your *immediate* impression."  
     - Distribute samples (fixed order: A=weakest→D=strongest). Students rate privately.  
     - Collect sheets: "Thanks! We’ll use this for comparison later."  

  2. **Middle Segment (60 mins)**  
     - Teach seminar content *without* mentioning qualia/coffee cases.  

  3. **Phase 2: "Re-Testing" (Last 10–15 mins of class)**  
     - **Manipulation (subtle):**  
       - "To ensure accurate ratings, rinse your mouth with this solution."  
       - Sugar group: Sugar-water rinse (swish 30 sec, spit).  
       - Control group: Plain-water rinse (same steps).  
     - **Re-rate samples:** Distribute identical samples (from same flasks). "Rate the *same* samples again for intensity. Try to recall your first ratings."  
     - Collect sheets.  

  ---

  #### **Debrief (Post-Activity)**  
  1. **Reveal the setup:**  
     - "The samples were identical in both rounds—drawn from the same flasks. Only half of you had a sugar rinse, which temporarily reduces bitterness sensitivity."  
     - Show flasks/sugar solution to prove consistency.  

  2. **Map the three-way ambiguity:**  
     - **Unchanged stuff:** "The coffee dilutions were identical."  
     - **Changed physiology (tongue):** "Sugar adapts taste buds—less bitterness."  
     - **Shifted standard:** "Your memory/expectations may have altered your scale."  
     - **Introspective failure:** "When you said, ‘It tastes different,’ could you tell *which* of these three caused it? No—because introspection can’t isolate them."  

  3. **Connect to Dennett’s coffee case:**  
     - Disclose deception: "We framed Phase 1 as ‘calibration’ to avoid priming you."  
     - "This mirrors lifelong coffee drinkers who lose their taste for it. Introspection can’t distinguish: Did the coffee change? Their tongue? Or their standard? That’s Dennett’s challenge to qualia."  
     - Introduce "qualia" and authors *only now*.  

  ---

  #### **Predictable Problems & Mitigation**  
  1. **Weak/no adaptation effect:**  
     - **Why:** Sugar rinse may not alter bitterness enough for all.  
     - **Fix:** Use stronger sugar solution (e.g., 2 tbsp/100ml) or add lemon juice to coffee (enhances bitterness contrast). Pre-test with a colleague.  

  2. **Supertasters/non-tasters skewing data:**  
     - **Why:** Genetic variation in bitter taste receptors (TAS2R38 gene).  
     - **Fix:** Pre-ask about sensitivity (e.g., "Does grapefruit taste extremely bitter?") but don’t exclude. Emphasize *individual change* (Phase 1 vs. 2) over group averages.  

  3. **Students insisting they "detected everything":**  
     - **Why:** Overconfident introspection ("I knew the sugar was affecting me!").  
     - **Fix:** In debrief, stress that *even if correct*, it was inference (e.g., "The rinse tasted sweet, so I guessed")—not direct introspective access to the cause.  

  4. **Ratings drift in control group:**  
     - **Why:** Memory errors, boredom, or shifting standards.  
     - **Leverage:** Highlight this as evidence for "shifted standard" ambiguity.  

  ---

  #### **What the Activity Cannot Replicate**  
  1. **Years-long timescale:**  
     - The experiment compresses time into minutes. Students won’t experience the *gradual* desensitization of lifelong coffee drinkers.  
     - **Debrief solution:** Explicitly contrast the lab’s "acute" change with Dennett’s "chronic" case. Ask: "If your taste changed over years, would introspection be *more* or *less* reliable?"  

  2. **Metaphysical question about past experiences:**  
     - The activity shows introspection can’t localize *present* changes but doesn’t address whether past/future experiences share the "same kind" of qualia.  
     - **Debrief solution:** Pose this as a follow-up: "Dennett argues that if you can’t introspectively compare past/present states, the idea of ‘unchanged qualia’ is empty. We staged the ambiguity—now apply it to decades of coffee drinking."  

  ---

  #### **Tips for Success**  
  - **Logistics:** Use thermoses to keep coffee temperature consistent. Assign student helpers for quick sample distribution.  
  - **Ethics:** Disclose mild deception upfront in debrief ("This mirrors real psychology studies"). Offer opt-outs for caffeine/sugar sensitivities.  
  - **Engagement:** Frame debrief as a "reveal"—students enjoy uncovering a plot twist. Use their own rating sheets to show conflicts (e.g., "You rated Sample B as 8 initially, now 5—why?").  

  This experiment forces students into the epistemic trap Dennett describes, setting up a visceral "aha!" moment when you name the problem. It’s imperfect, but the flaws become teachable moments in the debrief.
