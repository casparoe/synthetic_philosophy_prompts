  Okay, let me unpack this user's query. They're describing a recurring pattern in scientific debates where both sides agree on the facts but clash over the default assumption when evidence is absent. The examples given are the adaptationism debates post-spandrels paper and nativism arguments about language. 

  The user wants to know if there's an established term for this specific configuration where the disagreement isn't about facts but about the "null setting" - what you assume when evidence is silent. They've rejected "burden of proof" as insufficient since both sides agree on all claims. They're asking for either an existing concept or a newly coined term with clear boundaries.

  Hmm... This requires careful thought. First, I need to confirm what exactly the user is observing: a meta-disagreement about epistemic starting points. In adaptationism, it's whether to assume a trait is adaptive until proven otherwise; in nativism, whether to presume innate structures or learned behavior as the baseline. 

  The key elements seem to be: shared factual understanding, agreement that all mechanisms exist, but fundamental disagreement about which explanation gets privileged as the default position when no data exists. This isn't about proof burden but about epistemic inertia - what sticks when nothing else does.

  I recall similar concepts in philosophy. Bayesian "priors" capture subjective starting points but feel too individualistic. "Presumption rules" from argumentation theory come close but are too broad. "Default reasoning" in AI lacks the normative tension. The user wants something that specifically highlights the contested nature of this baseline.

  Perhaps "epistemic default" could work, but needs sharpening. The core conflict is over justification authority - who must argue against the status quo. This resembles Kuhn's "disciplinary matrices" where paradigms dictate what counts as an anomaly. But the user wants precision.

  After considering various angles, I land on "default presumption conflict" as the best framing. It emphasizes that the fight is over which position presumes itself valid without evidence. The real-world consequences make it substantial: the chosen default shapes research agendas and resource allocation. 

  To define it clearly: This occurs when disputants share all factual beliefs and conceptual understandings about possible explanations in a domain, but irreconcilably disagree about which explanation should be treated as the privileged null hypothesis that stands until actively disproven. The disagreement is structural, about justification frameworks rather than content.

  The boundaries would be: 1) Must have full agreement on what mechanisms exist 2) Must have symmetrical ability for any position to be true in principle 3) The conflict must specifically concern the baseline when no evidence exists. This excludes cases where facts are disputed or burden of proof is asymmetrical due to implausibility.

  This formulation seems to meet the user's request for a carved concept with "actual edges". It explains why such debates persist despite factual agreement - because they're ultimately about the rules of the epistemic game itself.
answer: |-
  Your observation cuts to the heart of a profound and persistent pattern in scientific and philosophical discourse. You're absolutely right that this isn't a mere burden-of-proof dispute in the conventional sense, nor is it simply a disagreement about facts or definitions. What you've identified is a conflict over **epistemic defaults** or **justificatory baselines** – the foundational, often unspoken, assumptions about which explanatory framework holds the privileged position *before* evidence is gathered, particularly when faced with silence.

  The established concept that comes closest, though imperfect, is the notion of the **"null hypothesis"** within scientific methodology. However, the conflict you describe isn't about *what* the null hypothesis *is* for a specific test, but rather a deeper, meta-level disagreement about **which broad explanatory paradigm should *constitute* the default null position across an entire domain of inquiry when initiating investigation into any novel, unexplained phenomenon within that domain**.

  In adaptationism vs. pluralism (Gould & Lewontin's "spandrels" critique), the adaptationist position elevates "selection for function" to the status of the **presumptive null model**. Their methodological stance is: "Assume a trait is an adaptation shaped by natural selection *until* specific evidence demonstrates that it is better explained by constraint, drift, or as a non-adaptive byproduct." The critic, conversely, insists there should be **no privileged presumptive explanation**. Their stance is: "Approach each trait with an *agnostic* baseline; the burden is on *any* specific mechanism (selection, drift, constraint) to demonstrate its applicability through positive evidence from the outset. Absence of evidence for adaptation is *not* evidence for non-adaptation, but simply *lack of knowledge*."

  This difference in **presumptive starting points** is structurally distinct from burden of proof because:
  1.  **Shared Ontology:** Both sides agree on the *existence* of all the mechanisms (selection, drift, constraints, byproducts). The disagreement isn't over whether these forces *are* real or *can* operate.
  2.  **Shared Epistemic Goal:** Both sides agree that the *ultimate* goal is to determine the correct explanation for any given trait using evidence.
  3.  **Conflict at the Threshold of Inquiry:** The clash occurs *before* evidence gathering begins, over the logical and methodological stance taken *towards* the unexplained. It's a disagreement about the **epistemic inertia** assigned to a particular type of explanation. Should "adaptation" carry an inherent presumption that must be actively dislodged, or should it start from a neutral position, requiring active justification like any other hypothesis?

  This is why it feels different from "burden of proof." Burden of proof typically kicks in *after* a claim is made and assigned based on plausibility, novelty, or consequence. Here, the conflict is about *which claim (or type of claim) is implicitly "made" by default* simply by encountering an unexplained phenomenon within the field. It's about the **default presumption rule**.

  In philosophy of science, this aligns with debates about **heuristic principles** and **research programs** (Lakatos). The adaptationist stance is a heuristic: "Look for function first; it's the most likely path to understanding complex traits and has proven fruitful." The pluralist critic sees this heuristic as morphing into an unjustified *presumption* that biases inquiry and overlooks alternatives.

  For the nativism/empiricism debates in language/cognition, the structure is identical. Both sides agree innate structures and learning mechanisms exist and interact. The nativist presumes that core aspects of language or cognition reflect innate, domain-specific structures *until* learning-based explanations can demonstrably account for the complexity and universality observed. The empiricist presumes a domain-general learning architecture operating on experience *until* evidence *specifically necessitates* invoking rich innate structures. The null setting differs: "Innate structure present (needing disconfirmation)" vs. "No innate structure presumed (needing confirmation)."

  Given that existing terms like "null hypothesis," "burden of proof," or "heuristic" only partially capture this specific meta-level conflict over the *privileged baseline explanation*, coining a precise term seems warranted. Let's call this a **Default Presumption Conflict (DPC)**.

  **Definition of Default Presumption Conflict (DPC):**
  A Default Presumption Conflict occurs within a scientific or philosophical domain when:
  1.  **Fundamental Agreement:** Disputants share a core understanding of the relevant phenomena and agree on the *existence* and *potential explanatory power* of the major competing mechanisms or frameworks (e.g., selection vs. drift/constraint; nativism vs. empiricism).
  2.  **Evidential Silence:** The conflict centers on the appropriate stance to take when encountering *novel instances* within the domain *for which no specific evidence yet exists* to distinguish between the competing explanations.
  3.  **Opposed Baselines:** The disagreement manifests as an irreconcilable difference over which mechanism or framework should be granted the status of the **presumptive default explanation** – the position treated as provisionally valid *until actively overturned by evidence*.
  4.  **Methodological Consequence:** The choice of default presumption has significant downstream consequences for research focus, resource allocation, interpretation of ambiguous evidence, and what constitutes a satisfactory explanation (e.g., "hand-waving" vs. requiring positive proof).

  **Edges of the Concept:**
  *   **Not DPC:** Disagreements where the core issue is the *existence* of a mechanism (e.g., creationism vs. evolution), the *meaning* of key terms, or the *validity* of evidence for a *specific* case.
  *   **Not DPC:** Simple burden-of-proof disputes over a *single, specific claim* (e.g., "You claim this *specific* trait is an adaptation; prove it"). DPC is about the *general rule* applied to *any* unexplained trait in the domain.
  *   **Not DPC:** Disagreements about *how strong* evidence needs to be to overturn a hypothesis, once a hypothesis is actively under test. DPC is about *which hypothesis is assumed to be standing before the test begins*.
  *   **Is DPC:** The core conflict in the adaptationism debates post-spandrels, as you described.
  *   **Is DPC:** The core conflict in the "poverty of the stimulus" arguments in language acquisition (nativist default: innate structure presumed; empiricist default: learning mechanisms presumed until innate structure is proven necessary).
  *   **Likely DPC:** Certain foundational debates in physics (e.g., interpretations of quantum mechanics where different schools accept the same math but disagree on the "default" ontological picture in the absence of measurement).

  DPCs are persistent because they stem from deep-seated differences in **epistemic values** and **methodological priorities** (e.g., prioritizing explanatory power for complexity vs. prioritizing caution against over-attribution; valuing theoretical parsimony vs. valuing explanatory breadth). While they often involve differing Bayesian priors, the conflict is more structural – it's about the *rules of the game* for initiating inquiry and assigning initial justificatory status within a field, shaping the very landscape upon which evidence is sought and interpreted. The fight isn't over the map, but over where you place the "You Are Here" marker before you start exploring. That's why they generate such enduring friction despite apparent agreement on the territory itself.
