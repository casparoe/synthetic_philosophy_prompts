  We are designing an activity to illustrate the problem of interpersonal utility comparisons. The key elements:
   - Each participant has a private utility function (on a slip) with numerical utilities for various outcomes.
   - The group must make allocation decisions (unpleasant tasks and small prizes) without showing slips.
   - We want participants to experience the difficulty of comparing utilities across persons and the strategic incentive to misrepresent.

   Steps:

   1. Preparation:
      - Create a set of tasks and prizes. Let's say:
          * Tasks: Clean the whiteboard after class (mildly unpleasant), Stay 10 minutes late to rearrange chairs (more unpleasant), Take notes for the group and type them up (time-consuming, moderately unpleasant).
          * Prizes: A candy bar, A fancy pen, A $5 gift card, A book (all small but desirable).

      - Create utility slips for each participant. We need to assign numerical utilities to each task and prize for each person. The utilities should be on different scales for different people (to simulate different "happiness units") and with different trade-offs.

      Example slip for Person A:
          Clean whiteboard: -5
          Rearrange chairs: -15
          Take notes: -20
          Candy bar: +10
          Fancy pen: +5
          Gift card: +15
          Book: +25

      Example slip for Person B (with a different scale and different valuations):
          Clean whiteboard: -1
          Rearrange chairs: -4
          Take notes: -8
          Candy bar: +3
          Fancy pen: +2
          Gift card: +5
          Book: +10

      Note: The numbers are private and should not be comparable across individuals. We must make sure that the scales are arbitrary and that the zero point is different? Actually, the zero point is arbitrary too. We can have both positive and negative numbers.

      However, we must avoid having a common scale. But the problem is that the numbers are printed and look like they are on a common scale. We can try to mitigate by:

          - Using different ranges for different participants (e.g., one from -20 to 25, another from -10 to 15, another from -5 to 12, etc.)
          - Using different units (but we can't really, because we are using numbers) so we must emphasize that the numbers are only meaningful for that person.

      We can include a note on the slip: "These numbers are your personal utilities. They are only meaningful for you and cannot be directly compared to others' numbers."

   2. Rules and Setup:

      - The group has to assign the tasks and prizes to individuals. The goal is to maximize the total utility of the group. But wait, we cannot add utilities across people? Exactly the problem.

      - We tell them: "Your goal as a group is to maximize the sum of everyone's utility. But remember, each person knows their own utility numbers and cannot show the slip to others. You must come up with a way to assign the tasks and prizes without knowing each other's numbers."

      - The catch: They have to figure out a mechanism to aggregate the information without being able to compare the numbers interpersonally.

      - We might also include a twist: allow them to try to report their utilities (but then they can lie) and then show the strategic problem.

   3. Timeline (90 minutes):

      - Introduction (5 min): Explain the activity. We have some tasks (which are bad) and prizes (which are good). Each person has a private utility for each. The group's goal is to assign tasks and prizes to maximize the total utility. But no one can show their slip.

      - Step 1: Intra-personal trade-off exercise (15 min): 
            Give an example. Suppose a person has two tasks and one prize. They can see how to trade off. For instance, if a task is -5 and a prize is +10, they would be happy to take the task if they get the prize because net +5. But if they have to take two tasks for one prize, that might be net negative. This part is to show that cardinal utilities within a person are unproblematic.

      - Step 2: Group assignment without reporting (20 min):
            Let the group try to assign tasks and prizes without any formal reporting. They can talk and negotiate. They might try to ask: "How much do you hate rearranging chairs?" but then the answer is in words (e.g., "a lot") and not numbers. This should be messy.

      - Step 3: Introduce a reporting mechanism (15 min):
            Now, we allow each person to report their utility numbers for each item. But we don't tell them to be truthful. They can report any numbers they want. Then we (the facilitator) will add up the reported utilities and assign the tasks and prizes to minimize the total reported disutility for tasks and maximize for prizes (or we can do a combined assignment). But note: we are going to use the reported numbers to assign. This will likely lead to strategic misreporting.

      - Step 4: Let them play with the reporting mechanism (20 min):
            They report, we assign. Then we reveal the assignment and then we ask each person: are you happy? We might also reveal the true utilities (if they are willing) to see if the assignment was really optimal.

      - Step 5: Debrief (15 min): Map to the philosophical issues.

