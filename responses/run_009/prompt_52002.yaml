      - Ordinal preferences: Within a person, they can rank the tasks and prizes. That's easy and unproblematic.

      - Cardinal utilities within a person: They can see how much they are willing to trade. For example, "I would take the whiteboard cleaning if I get the candy bar because net positive." This is fine because it's within one person.

