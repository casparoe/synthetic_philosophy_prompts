answer: |-
  ### Activity Design: **"Utility Dilemmas: The Interpersonal Comparison Challenge"**

  #### **Learning Objectives**
  1. Experience the **impossibility of interpersonal utility comparisons**.
  2. Understand why **ordinal preferences** are observable but **cardinal intensities** are not.
  3. Discover the **strategic incentives to misreport** utility intensities.
  4. Contrast intra-personal cardinal utility (unproblematic) with interpersonal comparisons (problematic).

  ---

  ### **Materials & Setup**
  - **Participants**: 12 students.
  - **Time**: 90 minutes.
  - **Materials**:
    - **12 sealed envelopes** (each with a private utility slip).
    - **Task/Prize tokens**: 3 unpleasant task cards (e.g., "Clean moldy fridge," "Sort recycling in rain," "Archive old paperwork") and 3 desirable prize cards (e.g., "Coffee gift card," "Philosophy book," "Artisanal chocolate").
    - Whiteboard for tracking decisions.
    - Timer.

  ---

  ### **Utility Slips (Private, Heterogeneous Scales)**
  Each slip assigns **personal utility points** to outcomes. Scales vary arbitrarily (e.g., -100 to +100 vs. -10 to +10) to avoid implicit common units.  
  **Example Slips**:
  - **Slip A**:  
    `Clean moldy fridge: -80`  
    `Sort recycling: -30`  
    `Archive paperwork: -10`  
    `Coffee card: +20`  
    `Philosophy book: +60`  
    `Chocolate: +5`  
    *Scale: -100 to +100*

  - **Slip B**:  
    `Clean moldy fridge: -8`  
    `Sort recycling: -4`  
    `Archive paperwork: -1`  
    `Coffee card: +3`  
    `Philosophy book: +10`  
    `Chocolate: +1`  
    *Scale: -10 to +10*

  - **Slip C**:  
    `Clean moldy fridge: -200`  
    `Sort recycling: -50`  
    `Archive paperwork: -20`  
    `Coffee card: +40`  
    `Philosophy book: +150`  
    `Chocolate: +10`  
    *Scale: -200 to +150*

  **Key**: Tasks have negative utilities (disutility), prizes have positive. Each person’s scale is independent. Include a note:  
  *"These numbers are your personal utility intensities. They are not comparable to others’. Do not share your slip."*

  ---

  ### **Rules & Timeline** (90 min)

  #### **1. Intro & Intra-Personal Exercise** (15 min)
  - **Goal**: Show cardinal utility works *within* one person.
  - **Activity**:  
    - Each student uses their slip to answer:  
      *"Would you accept 'Clean moldy fridge' if given 'Philosophy book'? Calculate net utility."*  
      (e.g., Slip A: `-80 + 60 = -20` → Reject; Slip B: `-8 + 10 = +2` → Accept).
    - **Debrief**: Cardinal trade-offs are unproblematic for one person. We can observe *if* they accept, but not *how much* they value it relative to others.

  #### **2. Group Allocation: Silent Phase** (20 min)
  - **Goal**: Force interpersonal comparisons with only ordinal hints.
  - **Activity**:  
    - Assign 3 tasks and 3 prizes across the group.  
    - **Rules**:  
      - No one reveals utility numbers.  
      - Students can only state ordinal preferences (e.g., "I hate cleaning more than sorting," "I want the book most").  
      - Group must decide via discussion.  
  - **Predicted Struggle**:  
    - Students will try to compare intensities ("How much do you hate cleaning?") but lack tools.  
    - Inefficient compromises emerge (e.g., someone who mildly dislikes a task does it, while a prize goes to someone who barely wants it).

  #### **3. Group Allocation: Reporting Phase** (25 min)
  - **Goal**: Expose strategic misreporting.
  - **Activity**:  
    - Students *report* utility numbers for tasks/prizes (verbally or written). They **can lie**.  
    - Facilitator assigns tasks to those reporting *least negative* scores and prizes to those reporting *most positive* scores.  
    - **Example**: If Alice reports `-5` for cleaning (true: `-80`), she’s assigned the task; if Bob reports `+50` for chocolate (true: `+1`), he gets it.  
  - **Predicted Behavior**:  
    - Tasks: Inflate disutility (report more negative) to avoid work.  
    - Prizes: Inflate utility (report more positive) to win.  
    - Result: Assignments are inefficient/gamed (e.g., a prize goes to someone who lied, not to whoever truly values it most).

  #### **4. Debrief & Philosophy Bridge** (30 min)
  **Guided Discussion Questions**:  
  1. **Ordinal vs. Cardinal**:  
     - *"In the silent phase, could you rank preferences? Could you measure intensity differences between people?"*  
     → Highlight: Ordinal rankings are public; cardinal intensities are private.  

  2. **Intra vs. Inter Personal**:  
     - *"Why could you trade tasks/prizes for yourself but not across people?"*  
     → Emphasize: Cardinal utility is meaningful *within* one mind, but no common scale exists *across* minds.  

  3. **Strategic Gaming**:  
     - *"What happened when we allowed reporting? Why did it fail?"*  
     → Note: Without objective verification, people game the system. Philosophers (e.g., Harsanyi) propose mechanisms, but all are manipulable.  

  4. **The Scaling Problem**:  
     - *"Did the numbers on your slip solve the interpersonal comparison? Why not?"*  
     → Stress: The slips *simulated* private intensities but didn’t provide a common unit (e.g., is -80 for Alice worse than -8 for Bob?).  

  5. **"Veil of Ignorance" Moment**:  
     - *"Could we have assigned tasks/prizes fairly if no one knew their own slip?"*  
     → If students suggest this, note Rawls/Harsanyi. Otherwise, pose it: *"What if you had an equal chance of being any person?"*  

  ---

  ### **What Will Go Wrong (Brutally Honest)**
  1. **Silent Phase Frustration**:  
     - Students will flounder when denied intensity comparisons. Some may cheat by "hinting" at numbers.  
     - **Mitigation**: Strictly enforce ordinal-only language (e.g., "I hate this a lot" is allowed; "I hate it -100" is not).  

  2. **Reporting Phase Chaos**:  
     - Strategic lies may lead to resentment (e.g., "You lied to get the chocolate!").  
     - **Mitigation**: Frame it as part of the experiment—"This is why real-world mechanisms fail."  

  3. **The Slip Problem (Your Worry)**:  
     - **Yes, the slips smuggle in a pseudo-common scale**. Students may treat numbers as comparable (e.g., "Alice has -80, Bob has -8, so Alice suffers more").  
     - **Why it’s unavoidable**: We need *some* way to simulate private intensities. The debrief must aggressively dismantle the illusion:  
       - *"These numbers are hypothetical. In reality, we don’t have them—and even if we did, we couldn’t assume Alice’s ‘-80’ is comparable to Bob’s ‘-8’ because utility isn’t measured in universal units."*  
     - **Silver Lining**: The arbitrary scales (Slip A: -100 to +100 vs. Slip B: -10 to +10) help show the problem. Ask: *"Does a ‘-80’ on a 100-point scale mean the same as ‘-8’ on a 10-point scale?"*  

  4. **What the Game Can’t Capture**:  
     - **Real-world complexity**: Utility isn’t static or perfectly known—even to oneself.  
     - **Empathy/ethics**: The activity focuses on measurement, not morality. Students may ignore fairness for efficiency.  

  ---

  ### **Instructor Notes**
  - **Lean into the mess**: Struggles are pedagogically valuable. Let students sit with the uncertainty.  
  - **Emphasize**: The core problem is epistemological (we can’t access others’ utilities), not just strategic.  
  - **Adaptation**: If time runs short, skip the intra-personal exercise (but it’s critical for contrast).  
  - **Final Takeaway**: *"We can agree societal decisions require interpersonal comparisons, but we have no objective way to make them. This is why philosophers and economists still debate this."*  

  This activity transforms an abstract problem into a visceral dilemma. The slips are a necessary evil—use the debrief to expose their limitations.
