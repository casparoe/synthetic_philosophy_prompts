  ### Decision Tree: The Nature of Dream Reports  
  *Answer each question based on intuitions about cases, not theoretical labels. Cases referenced:*  
  - **A (Lucid Signaling):** *A lucid dreamer signals with pre-agreed eye movements during EEG-confirmed REM sleep upon realizing they are dreaming.*  
  - **B (Coherent Narrative):** *A sleeper woken mid-REM reports a vivid, 20-minute dream matching the duration of the REM phase.*  
  - **C (Non-REM Dream):** *A sleeper reports a vivid dream after a night with no REM sleep.*  
  - **D (Morning Report):** *An ordinary dream report given upon morning waking.*  

  ---

  #### Start:  
  **Q1 (Case A):** When the lucid dreamer signals with eye movements, is she *currently experiencing* the dream (e.g., awareness of dreaming, control over signaling)?  
  - **Yes (→ Q2)**  
  - **No (→ Q5)**  

  ---

  #### Branch 1: **Yes** to Q1 (Experience during signaling)  
  **Q2 (Case B):** When the sleeper reports a 20-minute coherent dream upon waking mid-REM, was the experience unfolding *continuously* over those 20 minutes?  
  - **Yes (→ Q3)**  
  - **No (→ Q4)**  

  **Q3 (Case D):** In ordinary morning reports, are dreams remembered as *perceptual experiences* (like seeing/hearing events) or *imaginative constructions* (like composing a story)?  
  - **Perceptual → Orthodox View**  
    *Dreams are experiences during sleep, encoded in memory and reported verbatim.*  
  - **Imaginative → Imaginings View**  
    *Dreams are imaginative activities during sleep, distinct from perception.*  

  **Q4 (Case B):** Is the report of the 20-minute dream *constructed at the moment of waking* (not recalled from continuous sleep experiences)?  
  - **Yes → Dennett’s View**  
    *Dream content is fixed only upon waking; sleep may involve fragmentary states retrospectively narrated.*  
  - **No → UNOCCUPIED**  
    *Diagnosis: Incoherent. If experiences aren’t continuous but reports aren’t waking constructions, what grounds the narrative?*  

  ---

  #### Branch 2: **No** to Q1 (No experience during signaling)  
  **Q5 (Case B):** Is the 20-minute dream report a *memory of experiences during sleep*?  
  - **Yes → UNOCCUPIED**  
    *Diagnosis: Inconsistent. Accepts experiences in Case B but denies them in Case A, despite both occurring during REM.*  
  - **No (→ Q6)**  

  **Q6 (Case D):** Does an ordinary morning report describe an experience that *occurred during sleep*?  
  - **Yes → Dennett’s View**  
    *"Dream experience" is attributed to sleep but content is fixed upon waking.*  
  - **No → Malcolm’s View**  
    *Dream reports describe post-awakening cognition or behavior; no experiences occur during sleep.*  

  ---

  ### Notes on Ambiguities & Unoccupied Positions  
  1. **Dennett’s View** appears in two branches (→ Q4-Yes and → Q6-Yes) but reflects the same core claim: *dream content is fixed at waking*. The tree cannot separate these paths further.  
  2. **Case C (Non-REM Dream)** is not a node because:  
     - All views except strict **Orthodox** can accommodate it (e.g., dreams in NREM sleep, waking constructions, or non-experiential reports).  
     - **Orthodox** adherents may reinterpret Case C as misremembered REM or accept NREM dreams, avoiding falsification.  
  3. **Unattractive/Incoherent Positions:**  
     - → Q5-Yes: Inconsistent acceptance of sleep experiences in Case B but not Case A.  
     - → Q4-No: No mechanism for coherent reports if sleep experiences are fragmentary and not constructed at waking.  
  4. **Key Distinctions Carried by Cases:**  
     - **A** tests for *any* experience during sleep.  
     - **B** tests for *temporally extended* experiences.  
     - **D** tests whether reports are *memories* or *constructions*.  

  ---

  *Tree ends; positions are mutually exclusive except where noted.*
