answer: |-
  Here’s a practical decision procedure based on luck egalitarian principles, designed for real-world constraints. It prioritizes **verifiable facts** over philosophical debates and minimizes speculation about patients’ knowledge or motives. Steps are sequential—proceed only if the prior question is answered "yes."

  ---

  ### **Decision Procedure: Responsibility-Sensitive Allocation**
  **Key Principle:** *Public funds should cover costs primarily when the health need arose from unchosen disadvantages. Costs arising from clear, informed personal choices may lower priority.*

  #### **Questions in Order:**
  1. **Was the condition caused by an unchosen disadvantage?**  
     *Check referral for:*  
     - Genetic disorders (e.g., inherited joint disease).  
     - Documented childhood deprivation (e.g., malnutrition, neglect).  
     - Environmental hazards (e.g., industrial pollution).  
     - Severe unavoidable accidents (e.g., hit by drunk driver).  
     *✅ Sufficient answer:* File explicitly notes poverty, abuse, genetics, or external harm as primary cause.  
     *⛔ Termination:* If "yes," **approve funding** (unchosen disadvantage).  
     *➡️ Next step:* If "no" or unclear, go to Q2.

  2. **Did the patient repeatedly engage in high-risk behavior *after* the risks were clearly known?**  
     *Check referral for:*  
     - Medical records showing prior diagnoses/warnings (e.g., "obesity discussed 2018," "alcohol cirrhosis warned 2020").  
     - Occupational/legal evidence (e.g., DUI convictions, employer-mandated safety training).  
     *✅ Sufficient answer:* File contains **multiple** professional warnings *before* the current need arose.  
     *⛔ Termination:* If "yes," **deny funding** (informed choice).  
     *➡️ Next step:* If "no" or warnings absent/unclear, go to Q3.

  3. **Could the patient reasonably access alternatives to the risky behavior?**  
     *Check referral for:*  
     - Geographic barriers (e.g., no safe parks for exercise).  
     - Financial constraints (e.g., unaffordable healthy food/therapy).  
     - Social context (e.g., addiction in high-trauma community).  
     *✅ Sufficient answer:* Evidence of **systemic barriers** (e.g., food deserts, rehab waitlists).  
     *⛔ Termination:* If "yes," **approve funding** (choice constrained by circumstance).  
     *➡️ Next step:* If "no" or evidence weak, **hand to panel for judgment** (values debate begins).

  ---

  ### **Applied to Test Cases**
  **Case 1: Woman seeking bariatric surgery (obesity from childhood poverty)**  
  - Q1: **Yes**—File notes "food insecurity in childhood, relied on high-calorie processed foods." *Unchosen disadvantage.*  
  ⛔ **Outcome: Approve funding.**  
  *Why you might dislike:* Critics argue obesity is always partially "chosen." Procedure prioritizes verifiable childhood deprivation.

  **Case 2: Former heavy drinker (sober 2 years, needs liver surgery)**  
  - Q1: No—Alcohol use not unchosen (e.g., no genetic alcoholism noted).  
  - Q2: Check for prior warnings. If file shows **multiple MD warnings pre-dating sobriety**: **Yes** → ⛔ **Deny funding** (informed choice).  
    If no warnings: Q3 → **Hand to panel** (debate if addiction nullifies choice).  
  *Why you might dislike:* Sobriety suggests responsibility—but procedure focuses on *past* choices after known risks.

  **Case 3: Rock climber (third injury, claims climbing is "core to identity")**  
  - Q1: No—Climbing is voluntary.  
  - Q2: **Yes**—File notes "prior surgeries for climbing injuries (2020, 2022)" + surgeon warnings. *Informed choice.*  
  ⛔ **Outcome: Deny funding.**  
  *Why you might dislike:* Identity claims are irrelevant here—procedure rejects "valued lifestyle" as unchosen disadvantage.

  ---

  ### **Where the Procedure Misfires**
  1. **Punishing ignorance/addiction misclassified as choice:**  
     - If files lack records of warnings (Q2), patients with severe addiction/impulsivity may be wrongly denied.  
     - *Fix:* Require clinicians to document risks discussed at every visit.  

  2. **Verifying "informed choice" costs more than treatment:**  
     - Tracking lifetime risk disclosures is administratively unrealistic.  
     - *Fix:* Only use *existing* records—never commission new investigations.  

  3. **Inherent limitations:**  
     - **Cannot resolve identity/value conflicts** (e.g., Case 3’s "climbing = religion"). Q3 funnels these to panel judgment.  
     - **Ignores structural forces masquerading as choice** (e.g., "choosing" fast food in a food desert). Relies on Q1/Q3 evidence.  
     - **Biased toward documented disadvantages** (e.g., childhood poverty in files). Undocumented trauma (e.g., unrecorded abuse) gets penalized.  

  ---

  ### **Key Safeguards for Appeals**
  - **Written reasons must cite file evidence only:**  
    *"Funding approved due to documented childhood food insecurity (Q1)."*  
    *"Funding denied: file shows prior warnings about climbing risks (Q2)."*  
  - **No speculation:** If evidence is missing (e.g., no warnings in Case 2), default to panel debate—never assume patient "should have known."  

  This procedure operationalizes luck egalitarianism while avoiding unverifiable claims. It accepts that some cases (Q3) require democratic judgment—not mechanistic rules—when values conflict.
