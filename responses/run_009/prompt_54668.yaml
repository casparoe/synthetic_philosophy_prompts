answer: |-
  ### Final Exam Question: The Copycat Project and Conceptual Fluidity in Extended Domains  

  **Background:** In the standard Copycat domain, letter-strings (e.g., `abc`, `kjj`) are manipulated via successor/predecessor relations in a linear alphabet (a→b→c...→z). We now extend this microdomain: the alphabet *wraps around*, allowing **cyclic successors** (z→a) alongside standard **dead-end successors** (z→nothing). For example, in `xyz → xyd`, `y` maps to `d` via a cyclic jump (y→z→a→b→c→d). Consider the analogy problem: **`xyz → xyd`; `ab → ?`**.  

  **Task:**  
  1. **Predict & Explain**: From Copycat’s architecture (Slipnet, workspace, codelets, temperature), predict how the system would resolve `ab → ?`. Where would it struggle, and why?  
  2. **Evaluate Slippage**: Is the difficulty with wraparound a fixable engineering issue (e.g., adding Slipnet nodes) or a symptom of deeper limitations? Does conceptual slippage in Copycat truly go beyond "movement along hand-coded Slipnet distances"?  
  3. **Architectural Judgment**: Does this case support the claim that fluid concepts *require* a pressure-driven, interactive architecture (like Copycat’s), rather than static representations in fixed similarity spaces?  

  Support your arguments with architectural mechanics.  

  ---

  ### Model Answer (600 words)  

  **Prediction & Struggles**  
  Copycat would likely fail to produce the cyclic solution `ab → zy` (or `aa`, `ac`). The workspace would activate directional bonds: `a→b` as increasing, favoring `b→c` for consistency. The cyclic successor (`a→z` backward) requires two radical steps: (1) violating the entrenched left-to-right directionality, and (2) accepting a long slippage chain (`a→z→y...`). The Slipnet’s `successor` node would weakly activate `cyclic-successor` (a new node), but `directionality` (rightward) and `alphabetic-position` nodes exert stronger influence. Temperature would remain low due to early perceptual clarity (`a→b` as a simple pair), reducing pressure for risky slippage. Codelets would build structures favoring `c` (`ab→ac`) or `a` (`ab→aa`), dismissing `zy` as incoherent. The struggle arises from **conflicting constraints**: cyclic relations lack pre-built "chunk" support, and directional bonds dominate workspace competition.  

  **Slippage: Engineering or Deep Flaw?**  
  The wraparound issue is *not* just fixable engineering. Adding a `cyclic-successor` node to the Slipnet is trivial, but slippage to it requires:  
  - **Dynamic Reinterpretation**: The system must suppress `directionality` and `leftmost` to permit backward traversal, but these nodes are deeply linked to `successor` via hand-coded distances. Slippage here isn’t emergent semantic discovery—it’s weighted activation along predefined paths. For `ab → zy`, Copycat must abandon local consistency (upholding `a→b`) for global relational remapping (seeing `ab` as adjacent to `zy` via wrap). This demands *reconceptualizing the string’s role* (e.g., as a circular sequence), which Slipnet’s static topology cannot spontaneously generate.  
  - **Fluidity Illusion**: Copycat’s slippage relies on hand-tuned conceptual proximities (e.g., `successor` to `predecessor`). Wraparound exposes this: cyclic relations are "distant" in the Slipnet’s ontology, requiring ad-hoc links. True fluid concepts would demand context-dependent redefinition of "distance," but Copycat’s network is fixed. Thus, slippage reduces to activation spreading, not meaning transformation.  

  **Architecture & Fluid Concepts**  
  This case *strengthens* the necessity of pressure-driven architectures. Static models (e.g., semantic networks, SVMs) would predefine "similarity" between `ab` and `zy` (e.g., via graph paths or feature overlap), but fail to model the *process* of relational reinterpretation under conflict. Copycat’s temperature-driven codelets create competition: low temperature amplifies conservative solutions (`ac`), while high temperature *could* (in theory) enable radical slippage—but here, the Slipnet lacks infrastructure to reward cyclic leaps. The impasse reveals that fluidity requires:  
  - **Dynamic Attention**: Codelets must de-prioritize `directionality` when cyclic mappings better satisfy unity, but Copycat has no mechanism to invert entrenched hierarchies.  
  - **Emergent Similarity**: Static spaces cannot capture how `ab` and `zy` become analogous only under cyclic reframing—a process requiring workspace negotiation, not Slipnet lookup.  
  Thus, while Copycat’s architecture is necessary for fluidity, its implementation—especially the rigid Slipnet—limits truly open-ended conceptual shifts.  

  **Conclusion**: Wraparound exacerbates Copycat’s brittleness. The system struggles with relational conflicts because slippage is bounded by hand-coded semantics. Fluid concepts demand architectures where "similarity" is reconfigured dynamically via global pressure—a strength of Copycat’s approach, but constrained by its fixed ontology.  

  ---

  ### Marking Scheme (5 x 4 = 20 marks)  
  **Must-hit points** (4 marks each):  

  1. **Conflict Prediction**: Identifies directional bonds (`a→b`) overpowering cyclic mappings due to Slipnet node strengths and low initial temperature.  
     *→ Memorizers miss*: Tend to state "Copycat might choose `ac`" without tying to codelet competition under perceptual constraints.  

  2. **Architectural Struggle**: Explains how workspace structures (built by codelets) favor local consistency, and why cyclic solutions lack support (e.g., no "wrap" perceptual codelets).  
     *→ Memorizers miss*: Attribute struggle only to "missing nodes," not codelet biases or temperature’s role in risk-taking.  

  3. **Slippage Critique**: Argues that slippage is confined by pre-set Slipnet distances (e.g., `successor` to `predecessor` is close, but to `cyclic` is far), reducing it to activation spreading.  
     *→ Memorizers miss*: Parrot "slippage is flexible" without contrasting hand-coded vs. emergent semantic shifts.  

  4. **Fixability Judgment**: Concludes wraparound exposes deeper limits (static Slipnet topology), not just engineering gaps.  
     *→ Memorizers miss*: Propose "add cyclic nodes" as sufficient, ignoring directional conflict and workspace dynamics.  

  5. **Fluidity Argument**: Links pressure-driven interaction (temperature modulating codelet competition) to fluid concepts, contrasting static models’ inability to *reconceptualize* relations.  
     *→ Memorizers miss*: Claim "Copycat is fluid" generically, without dissecting how wraparound challenges its static foundations.  

  ---  
  **Key differentiator**: Top answers will *weave* architecture (e.g., "Temperature moderates codelets, but Slipnet’s fixed links prevent cyclic mappings from gaining salience"), while memorizers list parts disjointedly.
