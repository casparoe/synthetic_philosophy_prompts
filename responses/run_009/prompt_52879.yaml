  User wants 1500-2000 words with no clear "winner" - tricky but essential. The unresolved tension should mirror the user's own scholarly struggle. Maybe end mid-debate with the sponsor dilemma hanging? That feels honest.

  Biggest risk is accidentally taking sides. Ezra's lexicographic ordering argument could easily sound hysterical if not presented well. Conversely, Maya might come off coldly utilitarian. Need to give Ezra poetic language about integrity and Maya sharp game-theoretic logic.

