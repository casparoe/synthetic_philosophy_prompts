answer: |-
  ### Brainstorming Core Tensions in Teleosemantics
  The field's impasses stem from **three fault lines**:  
  1. **History vs. Synchronicity**: Must content rely on historical selection (Millikan, Papineau) or can synchronically stable functions suffice (e.g., recent "mapping account" variants)?  
  2. **Granularity of Selection**: Are functions fixed at the level of lineages, organism-tokens, or neural subsystems? This affects indeterminacy and swampman cases.  
  3. **Normativity Source**: How do misrepresentation and correctness conditions emerge purely from natural processes?  

  The applied AI question is a **litmus test**, not a distraction: if teleosemantics cannot handle artificial systems with clear selection histories (e.g., trained neural nets), its naturalistic credentials weaken. However, *premature* focus on AI risks conflating engineering metaphors with robust content.  

  ---

  ### Prioritized Research Agenda (Ranked)

  #### **1. The Indeterminacy Problem**  
  *Why prioritized?*  
  - **Upstream Dominance**: Until we resolve *what* determines content (e.g., frogs representing flies vs. "small dark things"), theories cannot address *how* history or functions generate content. Solutions here constrain all other problems (e.g., swampman assumes content is determinate sans history).  
  - **Tractability**: Primarily conceptual but requires biological/neuroscientific input. Recent work on "structural representations" (Shea) and decoder-based teleosemantics offers paths forward. Philosophers can collaborate with computational neuroscientists on predictive processing models.  
  - **Game-Changing Developments**:  
    - ↑ If new evidence shows neural "decoding mechanisms" resolve indeterminacy in animal cognition.  
    - ↓ If pluralism becomes unavoidable, making determinacy a false goal.  

  #### **2. Selection Processes & Function Individuation**  
  *Why second?*  
  - **Upstream Relevance**: Determines *which* histories matter (lineage, learning, drift) and whether swampman lacks content due to missing *specific* histories. Affects if AI training counts as "selection."  
  - **Tractability**: Interdisciplinary (evolutionary biology, learning theory). Requires parsing "selection" in multilevel evolutionary models (Okasha) and neural Darwinism. Philosophers must engage with empirical work on cultural evolution and neuroplasticity.  
  - **Game-Changing Developments**:  
    - ↑ Evidence that synaptic selection in learning mirrors natural selection (e.g., neural pruning).  
    - ↓ If no principled distinction between selection types emerges, forcing pluralism.  

  #### **3. Swampman & the Necessity of History**  
  *Why third?*  
  - **Dependence**: Presupposes solutions to #1–2. If indeterminacy persists without history, swampman has no content; if functions require lineage history, swampman is empty.  
  - **Tractability**: Mostly philosophical but needs evolutionary biology input. Key is testing whether synchronic properties (e.g., dynamical coupling) suffice for content in biological systems.  
  - **Game-Changing Developments**:  
    - ↑ If AI systems with randomized "histories" exhibit identical behaviors to selected systems (testing necessity).  
    - ↓ If etiological theories incorporate synchronic stability (e.g., Neander’s "stabilized functions").  

  ---

  ### Excluded Topics & Criteria  
  #### **Criteria & Trade-offs**  
  - **Importance** (40%): Centrality to naturalization project (indeterminacy > selection > swampman).  
  - **Tractability** (30%): Feasibility in 4 years with interdisciplinary input.  
  - **Neglectedness** (20%): Swampman is underexplored empirically; selection processes lack consensus.  
  - **Downstream Impact** (10%): Solutions to #1–2 enable progress on AI/applied questions.  

  #### **Defunded Areas**  
  - **Function Pluralism**: Premature without prior resolutions. Funding this now risks fragmenting the field.  
  - **Pure AI-First Projects**: Unless tightly coupled to core theory (e.g., testing if gradient descent counts as selection *after* clarifying #2). AI is a forcing function *only* when core theory is robust.  

  #### **AI as Forcing Function?**  
  AI is **valuable but secondary**. It *exposes* teleosemantics' gaps (e.g., if LLMs lack "functions" despite optimization histories) but cannot resolve them alone. Prioritize it *after* #1–3: e.g., "Can artificial selection (backpropagation) ground content if biological selection does?"  

  ---

  ### Strategic Recommendations  
  1. **Mandate Interdisciplinary Teams**: Pair philosophers with evolutionary biologists (for #2) and computational neuroscientists (for #1).  
  2. **Benchmark Progress**: Require grantees to articulate how their work reduces indeterminacy in a concrete case (e.g., frog vision, place cells).  
  3. **Defer AI**: Year 3–4 workshops on AI implications *after* foundational outputs.  

  This agenda forces engagement with the hardest problems first, using empirical constraints to ground conceptual work. Success would yield a unified theory resolving indeterminacy via selection mechanisms, making swampman and AI cases fall into place.
