  Below is a flowchart designed to sort your group into decision-theory positions based on gut reactions to Death in Damascus variants. It avoids theory-laden questions and uses intuitive scenario tweaks. The leaves are tagged with positions (CDT-like, EDT-like, FDT-like, unstable, fatalism, or unnamed). 

  **Key Knobs Varied:**
  1. **Predictor accuracy:** Infallible (100%) vs. 90% accurate.
  2. **Timing:** Before vs. after a tentative decision.
  3. **Death's dependence:** Prediction based on your psychology vs. fixed fact (e.g., coin flip).
  4. **Cost:** Fleeing costs money or not.

  ---

  ### **Start: Base Case**
  You meet Death in Damascus. He says, "I'm expecting you tomorrow in Aleppo."  
  - **Predictor:** Infallible (Death is never wrong).  
  - **Tentative decision?** No (you haven't thought about it yet).  
  - **Death's location:** Depends on predicting **your choice**.  
  - **Fleeing cost?** No cost.  

  **Q1: What do you do?**  
  - **A: Stay in Damascus** → Go to Q2.  
  - **B: Flee to Aleppo** → Leaf: **Unnamed (Why?** Fleeing is pointless effort since you die either way. Rarely held—usually a misunderstanding of control).  
  - **C: Doesn’t matter (flip a coin, shrug)** → Go to Q2.  

  ---

  ### **Q2: Add Cost to Fleeing**
  Same as base case, **but fleeing costs most of your money** (e.g., bribes, lost savings). You lose the money if you flee, regardless of outcome.  

  **Q2: What do you do?**  
  - **A: Stay in Damascus** (avoid cost) → Go to Q3.  
  - **B: Flee to Aleppo** (ignore cost) → Leaf: **Unnamed (Why?** Paying to flee into Death’s arms is incoherent. Almost no one does this).  
  - **C: Still doesn’t matter** → Leaf: **Fatalism** (You think outcomes are fixed; choices are illusions. "Why bother packing?").  

  ---

  ### **Q3: Imperfect Predictor (90% Accuracy)**
  Predictor is **90% accurate** (e.g., a human seer, not Death).  
  - **Death’s location:** Depends on predicting your choice.  
  - **No fleeing cost.**  
  - *Example: If you stay, 90% chance Death is in Damascus (you die), 10% he’s in Aleppo (you live).*  

  **Q3: What do you do?**  
  - **A: Stay in Damascus** → Go to Q4.  
  - **B: Flee to Aleppo** → Leaf: **Unnamed (Why?** Fleeing increases evidence you’ll die *and* has no upside. Theoretically unstable).  
  - **C: Doesn’t matter** → Go to Q4.  

  ---

  ### **Q4: Add Cost to Fleeing (90% Predictor)**
  Same as Q3, **but fleeing costs most of your money**.  

  **Q4: What do you do?**  
  - **A: Stay in Damascus** → Go to Q5.  
  - **B: Flee to Aleppo** → Leaf: **Unstable choice** (You sense a dilemma: fleeing feels irrational after choosing, but you can’t commit to staying. Matches **ratifiability** views).  

  ---

  ### **Q5: Fixed-Fact Variant**
  Death’s location is **fixed by a coin flip** (50% Damascus, 50% Aleppo), unrelated to you. A **90% accurate seer** predicts the coin flip. You’re told the seer predicted "Aleppo."  
  - *Example: P(Death in Aleppo | Prediction) = 90%. If you flee to Aleppo, 90% chance you die.*  
  - **No fleeing cost.**  

  **Q5: What do you do?**  
  - **A: Stay in Damascus** → Leaf: **CDT-like** (You ignore "evidence" from your choice. Only causal consequences matter: fleeing doesn’t *cause* Death to move, so you minimize risk).  
  - **B: Flee to Aleppo** → Leaf: **Fatalism** (You act on the prediction as destiny. "If I’m fated for Aleppo, I’ll go").  
  - **C: Doesn’t matter** → Leaf: **EDT-like or FDT-like** (In this setup, EDT/FDT agree with CDT: fleeing is dangerous. But your indifference suggests weak preferences).  

  ---

  ### **Q6: Post-Tentative-Decision Variant**
  You **tentatively decide to stay** in Damascus (e.g., booked a hotel). Then you meet Death, who says “I’m expecting you in Aleppo.” Predictor is **infallible**. No fleeing cost.  

  **Q6: Do you change your plan?**  
  - **A: Stick with staying** → Leaf: **EDT-like** (Your choice is evidence: staying "proves" Death is in Damascus. You feel trapped).  
  - **B: Flee to Aleppo** → Leaf: **FDT-like** (You act on the "function" of your decision: if you *always* stick to tentative plans, predictors exploit that. Fleeing "controls" for the algorithm).  
  - **C: Panic, can’t decide** → Leaf: **Unstable choice** (The tentative decision breaks rationality. You need meta-preferences).  

  ---

  ### **Summary of Leaves**
  - **CDT-like:** Q5A (fixed fact → stay). Ignores self-fulfilling evidence.  
  - **EDT-like:** Q6A (post-tentative → stay). Chooses based on conditional evidence.  
  - **FDT-like:** Q6B (post-tentative → flee). Treats decisions as functions.  
  - **Unstable choice:** Q4B or Q6C. Requires ratifiability/randomization.  
  - **Fatalism:** Q2C or Q5B. "Outcomes are fixed; effort is futile."  
  - **Unnamed:** Rare paths (e.g., fleeing in base case). Usually incoherent.  

  ---

  ### **Do EDT, FDT, and Fatalism Collapse?**
  In the **base case (infallible, no cost)**, EDT, FDT, and fatalism **all recommend indifference** (no reason to flee). They diverge when:  
  - **Cost is added (Q2):** EDT/FDT/fatalism all say "stay" to avoid cost.  
  - **Post-tentative-decision (Q6):** EDT says "stay" (evidence hasn’t changed), FDT says "flee" (control your algorithm), fatalism says "doesn’t matter."  
  - **Fixed-fact (Q5):** Fatalism might flee (embrace destiny), EDT/FDT say "stay" (risk minimization).  

  **Useful variant to pull them apart:**  
  - **Q6 (tentative decision)** splits EDT (stay) and FDT (flee).  
  - **Q5 (fixed fact)** splits fatalism (flee) from others (stay).  

  ---

