prompt: |-
  I sit on the franchise subcommittee of our country's constitutional review commission, which must report within two months on whether three contested groups should vote in national parliamentary elections: long-term resident non-citizens (about nine percent of the adult population, resident five years or more, all taxpaying, many barred from naturalization for reasons unrelated to loyalty, such as prohibitions on dual citizenship in their countries of origin); expatriate citizens (roughly eighteen percent of the citizenry, including a third generation born abroad that has never set foot here); and sixteen- and seventeen-year-olds. The subcommittee is deadlocked, and the structure of the deadlock matters: whoever's principle enfranchises the expatriates tends to exclude the minors, and vice versa. The all-subjected principle takes the residents and the minors but drops the expatriates; a competence threshold takes the residents and the expatriates but drops the minors; and the only principle that takes both expatriates and minors — affected interests — would, taken seriously, enfranchise schoolchildren and anyone touched by our monetary policy, which not even its defender accepts without a competence floor she cannot justify non-arbitrarily. Whatever rationale we give for one group will also be cited in litigation over the others, so splitting the difference is not available to us.

  Draft the memo I will circulate before our final two sessions. It should recommend a concrete disposition for each of the three groups, together with an operational test the electoral commission could actually administer — a residency window, an application mechanism, a registration threshold — rather than a principle stated at the level of abstraction that got us stuck. It should be grounded in an explicit position on the boundary problem: what makes someone a member of the demos at all, as opposed to merely affected by its decisions or merely subject to them. And it must treat my chair's objection honestly rather than routing around it: his view is that the franchise is not a philosophical prize but a trust held by a specific historical community, that any principled test we write will be seized upon by groups we did not anticipate, and that the honest answer may be that the demos is constituted by mutual recognition and shared fate rather than by any criterion that could be written down. If you conclude that he is right that no single principle does the work, say so — but then show what does decide our three cases, and where that leaves the subcommittee's authority to decide them at all.
reasoning: |-
  Okay, the user is part of a constitutional review commission subcommittee dealing with who should have voting rights. They need to resolve deadlocks on three groups: long-term residents (9% of adults, taxpaying, can't naturalize due to dual citizenship issues), expatriate citizens (18% of citizens, including third-gen abroad), and 16-17 year-olds. The subcommittee is stuck because principles conflict—enfranchising expats excludes minors, and vice versa. The chair believes voting rights stem from mutual recognition and shared fate, not abstract principles. The user needs a memo with concrete recommendations and operational tests for each group, addressing the chair's concerns.

  First, I need to unpack the deadlock. The principles in play are: all-subjected (includes residents and minors, excludes expats), competence threshold (includes residents and expats, excludes minors), and affected interests (includes expats and minors but leads to over-inclusion). The chair's objection is that any principle they pick will be misapplied later, and the demos is about mutual recognition, not criteria. The user wants concrete tests, not abstract principles, to avoid litigation risks.

  The key is to shift from philosophical principles to practical, administrable tests. For long-term residents, the argument is they're de facto members—paying taxes, contributing, barred from citizenship not by choice. A residency period test (e.g., 5 years) is operational. For expatriates, the challenge is their connection to the community. Requiring active steps like tax filing or consular registration shows ongoing ties. For minors, competence is the issue, but age is a proxy. Aligning with existing youth rights (e.g., work, consent) makes 16 voting defensible.

  The chair's view about mutual recognition and shared fate is valid. So, the memo should acknowledge that while no single principle works, practical tests based on existing legal/social frameworks can operationalize shared fate. For residents, residency duration reflects integration. For expats, voluntary engagement (like taxes) indicates maintained ties. For minors, societal recognition of their capacities at 16 (via other laws) supports voting.

  Operational tests need to be clear: fixed residency window, documented expat engagement, age cutoff via existing registries. This avoids abstract criteria and uses concrete markers. The memo must address litigation risks by tying tests to administrative ease and social recognition, not universal principles. Conclude that the demos is defined by practice, not theory, and the subcommittee's role is to formalize these practical boundaries.
answer: |-
  ## MEMORANDUM  
  To: Constitutional Review Commission, Franchise Subcommittee  
  From: [Your Name], Subcommittee Member  
  Date: [Date]  
  Subject: Concrete Recommendations for Franchise Expansion & Operational Tests  

  **I. Introduction**  
  This memo provides concrete recommendations for the three contested voting groups, grounded in the practical realities of administration and the Chair’s legitimate concern that the *demos* is defined by mutual recognition and shared fate, not abstract philosophy. While no single principle cleanly resolves all cases, we can craft administrable tests reflecting **gradations of belonging and practical capacity**, avoiding litigation traps by anchoring decisions in existing legal/social frameworks.  

  **II. Core Position: The Demos Boundary**  
  We accept the Chair’s core insight: the franchise is a trust held by a historical community constituted through **mutual recognition and shared fate**. This manifests in *tangible, measurable connections* to the community’s life and governance. Mere affectedness or subjection is insufficient; active participation in the community’s ongoing project is key. However, this "shared fate" must be **operationalized through proxies** the Electoral Commission (EC) can administer. These proxies should reflect:  
  *   **Enduring Connection:** Sustained, significant ties to the community’s territory, institutions, or future.  
  *   **Recognized Capacity:** Societal acknowledgment of an ability to participate responsibly.  
  *   **Administrative Feasibility:** Clear, objective criteria verifiable by the EC without philosophical inquiry.  

  **III. Recommendations & Operational Tests**  

  1.  **Long-Term Resident Non-Citizens (9% of Adult Pop):**  
      *   **Recommendation:** **ENFRANCHISE**  
      *   **Rationale:** These individuals meet the "shared fate" threshold. They reside permanently, contribute taxes, obey laws, and are integrated into the social fabric. Barriers to naturalization (e.g., dual citizenship prohibitions) are external accidents, not reflections of disconnection. They share the community’s daily fate.  
      *   **Operational Test:** **Continuous Legal Residency for 7 Years + Active Tax Filing.**  
          *   *Administration:* EC verifies residency via national registry/immigration records (must show continuous legal residency for 7 years preceding the electoral register cutoff date). EC cross-references with tax authority records showing filing in at least 5 of the last 7 years. Automatic registration upon verification (opt-out available).  
          *   *Why this test?* 7 years (slightly above the 5-year minimum) demonstrates enduring commitment beyond a transient stay. Tax filing confirms active contribution and integration into the state’s fiscal system. Avoids naturalization barriers.  

  2.  **Expatriate Citizens (18% of Citizenry):**  
      *   **Recommendation:** **ENFRANCHISE, BUT WITH CONDITIONS**  
      *   **Rationale:** Citizenship signifies formal belonging, but prolonged absence (especially multi-generational) can attenuate the "shared fate" connection. Unconditional enfranchisement risks diluting the votes of those living with the direct consequences of policies. Mutual recognition requires *demonstrable, ongoing ties*.  
      *   **Operational Test:** **Citizenship + Demonstrable Ongoing Ties via Registration & Tax Status.**  
          *   *Administration:* Expatriates must **actively register** on a dedicated EC expatriate voter list. Registration requires:  
              (a) Proof of citizenship;  
              (b) Declaration of intent to return to [Country] *or* evidence of **significant, ongoing ties** within the last 5 years. Acceptable evidence includes:  
                  *   Filing [Country] income tax (declaring worldwide income or significant [Country]-sourced income).  
                  *   Ownership of taxable property in [Country].  
                  *   Current enrollment/employment at a [Country] government institution abroad (e.g., embassy school, cultural institute).  
                  *   Maintaining [Country] professional licensure requiring active renewal.  
              (c) Renewal required every 5 years.  
          *   *Why this test?* Active registration shifts the burden to the expatriate to affirm their connection beyond mere citizenship. Tying it to concrete actions (tax filing, property, institutional links) provides objective proof of "ongoing ties" and shared fate. Excludes those with only nominal or historical connections.  

  3.  **Sixteen- and Seventeen-Year-Olds:**  
      *   **Recommendation:** **ENFRANCHISE**  
      *   **Rationale:** This group is unambiguously part of the community’s shared fate – they live here, are educated here, are subject to laws here, and their future is most directly shaped by current policies. Societal recognition of their capacity is increasing (e.g., consent laws, work rights, driving). Excluding them based solely on age is arbitrary given varying individual capacities.  
      *   **Operational Test:** **Age Threshold (16+) via National Civil Registry.**  
          *   *Administration:* Automatic provisional registration upon turning 16, based on the national civil registry. Confirmation/activation required (simple online process) upon first eligibility to vote. Standard identity verification applies on voting day.  
          *   *Why this test?* Age is the only administratively feasible, objective, and non-arbitrary threshold readily available. It aligns with societal shifts recognizing increasing autonomy at 16. It avoids impossible competence assessments.  

  **IV. Addressing the Chair’s Core Objection**  
  You are correct, Mr. Chair: no single, abstract philosophical principle (all-subjected, competence, affected interests) resolves all cases without absurdity or dangerous over/under-inclusion. The franchise *is* a trust rooted in a specific community's mutual recognition and shared fate.  

  *   **How this memo responds:**  
      1.  **Avoids Universal Principles:** We abandon the search for a single rule. Instead, we use **context-specific proxies** for "shared fate" and "recognized capacity" that are **embedded in existing systems** (tax records, residency registries, citizenship law, civil registry, societal norms around age).  
      2.  **Mitigates Litigation Risk:** Recommendations are tied to *administrable facts* (7 years residency, tax filing status, citizenship proof + specific tie evidence, birthdate), not abstract claims ("affectedness," "competence"). Litigants would need to challenge the *reasonableness of the proxy* (e.g., "Is 7 years a reasonable proxy for integration?"), not claim universal entitlement under a principle. This is a stronger legal position.  
      3.  **Grounds in Recognition:** The tests reflect societal recognition:  
          *   *Residents:* Recognition via long-term legal status and tax contribution.  
          *   *Expatriates:* Recognition of citizenship *conditioned* on demonstrating ongoing recognition *of* the community through specific actions.  
          *   *Youth:* Recognition via existing legal/social frameworks granting rights and responsibilities at 16.  
      4.  **Practical Authority:** The subcommittee’s authority stems from its mandate to define the *operational boundaries* of the existing demos based on observable connections to the community’s shared fate. We are not inventing philosophy but **codifying practical manifestations of belonging** the EC can manage.  

  **V. Conclusion & Path Forward**  
  This approach breaks the deadlock by shifting from contested principles to workable tests grounded in the Chair’s crucial insight: the demos is defined by tangible connections within a historical community. Our recommendations offer a coherent, defensible framework:  

  *   **Long-Term Residents:** IN (7 yrs residency + tax filing).  
  *   **Expatriate Citizens:** CONDITIONALLY IN (Citizenship + Active Registration + Proof of Ongoing Ties).  
  *   **16/17-Year-Olds:** IN (Age 16+).  

  These operational tests provide the Electoral Commission with clear, objective criteria, minimize future litigation by avoiding abstract principles, and honor the idea of the franchise as a trust based on shared fate and mutual recognition, practically applied. I move that we adopt this framework as the basis for our final report.  

  **Recommended Vote:** Approve the above recommendations and operational tests.
