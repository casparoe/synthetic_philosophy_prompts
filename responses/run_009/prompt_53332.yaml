answer: |-
  Here are five numbered points as requested:

  1.  Killmonger's museum critique explicitly endorses restitution by grounding ownership in cultural patrimony ("How'd your ancestors get these? You think they paid a fair price? Or did they take it... like they took everything else?") and directly challenging the universal museum justification, framing acquisition as theft and denying the museum's moral right to possession.

  2.  The film significantly complicates Killmonger's pro-restitution stance by making him use the *same violent tactics* (theft, coercion, murder) he condemns colonizers for, implicitly questioning whether restitution achieved through replicating colonial violence offers true justice or merely perpetuates cycles of harm and illegitimate possession.

  3.  Wakanda's fictional status as a *never-colonized* nation that *chose* isolation fatally undermines the core restitution argument applied to itself: it possessed the power and resources to prevent looting entirely, making its hidden artifacts fundamentally unlike looted objects like the Bronzes or Marbles acquired through colonial force or duress.

  4.  The film dramatizes the *diasporic claim* to cultural heritage and restitution far more viscerally than typical academic debate: Killmonger's rage stems from being severed from his cultural birthright, highlighting how restitution arguments focusing solely on nation-states ignore the profound losses and demands of descendants forcibly removed through slavery and colonization.

  5.  The Oakland outreach center ending replaces material restitution with soft power and future-oriented aid, defanging Killmonger's radical demand for *return* (of both artifacts and power) and reflecting a neoliberal, Disney-fied solution that avoids the politically fraught act of dismantling existing Western collections while still profiting aesthetically from the cultures whose contested heritage fuels the plot.
