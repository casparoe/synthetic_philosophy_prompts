  I need to design a structured but practical procedure. First, I'll outline the diagnostic steps: what evidence to look at sequentially, how to distinguish between never encountering outside views versus encountering and dismissing them, and where the procedure stops requiring a values call. Then I'll map diagnoses to interventions, being realistic about what mods can actually achieve with limited powers. Finally, I'll apply this to the three specified cases.

  For diagnostics, I'll suggest reviewing: 1) external citation frequency (to detect bubbles), 2) treatment of outside sources (to detect echo chambers), 3) internal consensus patterns (to assess expertise), and 4) conflict outcomes. Each step needs clear pass/fail criteria and stopping points where human judgment is required.

  For interventions, I'll categorize them by diagnosis and feasibility. Mods can implement channel structures, pinned resources, and moderated discussions, but can't force attitude changes. I'll be honest about risks, especially how forced exposure might backfire in echo chambers.

  Then I'll analyze the three cases:
