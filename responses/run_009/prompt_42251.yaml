prompt: |-
  my decision theory seminar has been going through the Pasadena game (the Nover/Hájek one, I'll define it so nothing is left vague) and my friend swears he can derive from it that expected value reasoning is basically dead for real decisions, which smells like proving way too much. Here's his argument:

  (1) A gamble's expected value is the sum, over its outcomes, of each payoff times its probability, whenever that sum converges.

  (2) In the Pasadena game you flip a fair coin until it lands heads for the first time; if the first heads comes on toss n, you're paid 2^n/n dollars when n is odd and you pay 2^n/n when n is even. So the sum is 1 - 1/2 + 1/3 - 1/4 + ..., which converges (to ln 2), and so by (1) the game's expected value is ln 2.

  (3) A conditionally convergent series can be rearranged to converge to any number you like, or to diverge — and "rearranging the terms" here just means relisting the outcomes in a different order, which obviously doesn't change the gamble at all.

  (4) So the very same gamble has every expected value simultaneously, which is impossible.

  (5) Therefore (1) is false: mere convergence isn't enough for a gamble to have any expected value.

  (6) But now there's no principled place to stop. Pasadena-style games sit arbitrarily close to ordinary gambles — anything with infinitely many possible outcomes, or any real decision with unbounded tails, can be dressed up as one (Hájek apparently calls these "altitude" cases, where the pathology can be pushed as high as you like). So "no expected value" spreads to insurance, climate policy, anything with fat tails, and EV maximization turns out to be inapplicable to basically every interesting decision we make. Which he takes as the death sentence for the whole expected-value framework.

  I'm sure something in there is rotten but I genuinely can't decide whether the damage is in (2), in (3), or in the slide from (5) to (6). My instinct is to keep something like (1) with whatever patch it needs, rather than accept that EV theory never applies — but I can't see where the patch is supposed to come from without it just being an ad hoc "shut up and compute" rule. So: which step is the bad one, why did it look fine on the way in, and what does rejecting it cost me? If you think the argument is actually valid and I have to swallow (6), tell me that too, and what a defensible version of the conclusion would even look like.
reasoning: |-
  I'm dealing with this Pasadena game paradox that my friend is using to argue against expected value reasoning. Let me break down his argument step by step and see where it goes wrong.

  First, he defines the expected value as the sum of payoff times probability when that sum converges. That seems standard.

  In the Pasadena game, you flip a fair coin until heads, and the payoff depends on when that happens: if n is odd, you gain \( \frac{2^n}{n} \) dollars, and if n is even, you pay \( \frac{2^n}{n} \), so it's \( \frac{(-1)^{n+1} 2^n}{n} \) for n starting from 1.

  The probability of the first heads on trial n is \( \frac{1}{2^n} \), since it's tails for the first n-1 times and heads on the nth, and each flip is fair, so probability \( \left(\frac{1}{2}\right)^{n-1} \times \frac{1}{2} = \frac{1}{2^n} \).

  The expected value would be the sum over n of [payoff for n] times [probability of n].

  Payoff for n: if n odd, + \( \frac{2^n}{n} \), if n even, - \( \frac{2^n}{n} \), so let's write it as \( (-1)^{n+1} \frac{2^n}{n} \).

  Probability: \( p(n) = \frac{1}{2^n} \).

  So expected value E = \( \sum_{n=1}^{\infty} \left[ (-1)^{n+1} \frac{2^n}{n} \right] \times \frac{1}{2^n} = \sum_{n=1}^{\infty} (-1)^{n+1} \frac{1}{n} \).

  Because \( \frac{2^n}{2^n} = 1 \), so E = \( \sum_{n=1}^{\infty} (-1)^{n+1} \frac{1}{n} \).

  And that's the alternating harmonic series: 1 - 1/2 + 1/3 - 1/4 + ..., which converges to ln(2).

  So step (2) seems correct.

  Now, step (3): this series is conditionally convergent, meaning it converges, but not absolutely, because the harmonic series diverges. And for conditionally convergent series, the Riemann rearrangement theorem says you can rearrange the terms to converge to any real number, or to diverge.

  In terms of expected value, rearranging the terms corresponds to relisting the outcomes in a different order. But in probability, when we define expected value, we usually sum over the sample space, which has a specific order, like n=1,2,3,... But the sample space is the set of outcomes, each with their probability and payoff.

  In this case, the outcomes are indexed by n, the number of flips until first heads. Each outcome has a probability and a payoff.

  The key point is that the expected value is defined as the integral or sum with respect to the probability measure. For discrete outcomes, it's sum over i of p_i * x_i.

  When we write it as a series, we are summing in a particular order: n=1,2,3,...

  But the value shouldn't depend on the order, right? Because it's a sum over a countable set.

  But with conditional convergence, the order matters for the sum.

  That seems problematic.

  So in step (4), he says that by rearranging the terms, you can get any expected value, but since rearranging doesn't change the gamble, it must have every expected value simultaneously.

  Therefore, the expected value isn't well-defined, and (1) is false.

  Then (5) concludes that convergence isn't sufficient.

  (6) extends this to say that many real decisions have similar issues.

  But I think there's a mistake here.

  The issue is with how we define the expected value for a countable infinity of outcomes.

  In standard probability theory, when we have a countable sample space, we define the expected value as the sum of p_i x_i, and this sum is required to be absolutely convergent for the expected value to be well-defined.

  That's the key point.

  If the series converges absolutely, then rearrangement doesn't matter, and the sum is well-defined.

  If it only converges conditionally, then the expected value isn't well-defined because it depends on the order of summation.

  In this case, for the Pasadena game, let's check absolute convergence.

  The absolute expected value would be sum of |x_i| p_i.

  Here, |payoff| is \( \frac{2^n}{n} \), probability is \( \frac{1}{2^n} \), so |x_i| p_i = \( \frac{2^n}{n} \times \frac{1}{2^n} = \frac{1}{n} \).

  So sum of |x_i| p_i = sum_{n=1}^{\infty} \frac{1}{n} = \infty, which diverges.

  Therefore, the expected value does not converge absolutely, only conditionally.

  Hence, by standard definitions, the expected value is not defined for this gamble.

  So step (1) should say that the expected value is defined only when the sum converges absolutely.

  The argument in (1) says "whenever that sum converges," but it should specify "converges absolutely."

  In many texts, expected value is defined only for random variables with finite expectation, meaning absolute convergence.

  For example, if E|X| = infinity, then EX is not defined, even if the sum of x_i p_i converges conditionally.

  In this case, for the Pasadena game, E|X| = sum |payoff| p_i = sum 1/n = infinity, so EX is not defined.

  Therefore, the expected value is not ln(2); it's undefined.

  So step (2) is incorrect in claiming that the expected value is ln(2); it's not defined because of the lack of absolute convergence.

  Then, when you rearrange, you're changing the order of summation, which shouldn't be allowed because the series isn't absolutely convergent.

  In terms of the probability space, the expected value depends on how you order the outcomes, but since the probability space doesn't specify an order, you need absolute convergence to have a well-defined value independent of ordering.

  So for the Pasadena game, expected value is undefined.

  Therefore, the argument fails at step (2): the game does not have an expected value of ln(2); it has no well-defined expected value.

  Then step (3) and (4) are moot because there is no expected value to rearrange.

  Step (5) says that (1) is false, but (1) should have absolute convergence, not just convergence.

  So we need to amend (1) to require absolute convergence.

  Then, for this game, it doesn't satisfy that, so no expected value.

  Now, about step (6): he says that Pasadena-style games are common, and this pathology spreads.

  But for many real decisions, we do have finite expected value or absolute convergence.

  For example, in insurance, payouts are bounded or have thin tails, so E|X| is finite.

  Similarly for climate policy, it might have fat tails, but not necessarily in this pathological way.

  The Pasadena game is specifically designed to have the payoffs grow in such a way that the probabilities make the conditional convergence happen.

  In general, for decisions with unbounded tails, we might need to ensure that the expected utility is well-defined by requiring absolute convergence or using a different approach.

  But expected value maximization can still be applied when the absolute expectation is finite.

  In cases where it's not, like the Pasadena game, we need other decision rules, like those from decision theory without expected utility.

  But it doesn't mean EV is dead; it just has limitations.

  Moreover, Hájek and others discuss this; I think they propose that for such games, no decision rule satisfies all desiderata, or something.

  But let's not go there.

  The key point is that the mistake is in step (2): claiming that the expected value is ln(2), when in fact it is undefined due to lack of absolute convergence.

  Therefore, the argument doesn't show that (1) is false; it shows that (1) needs to specify absolute convergence.

  So to answer the question: the bad step is (2), because it assumes the expected value is defined and equals ln(2), but it isn't defined.

  It looked fine because the series converges, but for expected value, we need absolute convergence to be well-defined.

  Rejecting it costs us the ability to assign an expected value to such pathological games, but for most practical purposes, it's fine.

  Now, what about the rearrangement?

  Suppose we fix an order, say n=1,2,3,... then the partial sums converge to ln(2).

  But if we rearrange the outcomes, say, list all even n first, then odd n, or something.

  But in probability, the outcomes are distinct events, and we sum over them with their probabilities.

  When we rearrange the terms in the series, we're changing the order of addition, but since the sum isn't absolutely convergent, it changes the value.

  However, in the context of expected value, the order shouldn't matter; it's a sum over a set, not a sequence.

  Formally, for a countable probability space, we need to specify an enumeration, and for the expected value to be well-defined, it must be that the sum is absolutely convergent, so that it doesn't depend on the enumeration.

  Otherwise, different enumerations give different sums, and it's not intrinsic to the random variable.

  Therefore, for the Pasadena game, since it's not absolutely convergent, expected value is not defined.

  That's the resolution.

  So in step (3), rearranging the terms does change the gamble in the sense that the series representation changes, but the underlying probability measure hasn't changed; however, since the sum depends on order, we can't assign a unique value.

  Hence, it's not that the gamble has every expected value; it has no well-defined expected value.

  So step (4) is incorrect.

  Therefore, the whole argument fails.

  For (6), while there are cases with infinite expectation, like the St. Petersburg paradox, but even there, the expected value is infinite, not undefined.

  In St. Petersburg, you win 2^n if first heads on n, probability 1/2^n, so payoff x p = 1 for each n, so E|X| = sum 1 = infinity, and EX = infinity, which is defined but infinite.

  In Pasadena, it's conditionally convergent, so undefined.

  But in real decisions, we often deal with bounded utilities or other ways to handle fat tails.

  So EV isn't dead; it just needs care in application.

  I think that's it.
answer: |-
  The flaw in your friend's argument lies in step (2), where he claims that the Pasadena game has a well-defined expected value of $\ln 2$. This is incorrect because the expected value of a random variable is only well-defined when the sum of the absolute values of the payoffs multiplied by their probabilities converges (i.e., when $E[|X|] < \infty$). This condition ensures that the expected value is finite and does not depend on the order of summation.

  In the Pasadena game, the absolute expectation $E[|X|]$ is given by:
  \[
  E[|X|] = \sum_{n=1}^{\infty} \left| (-1)^{n+1} \frac{2^n}{n} \right| \cdot \frac{1}{2^n} = \sum_{n=1}^{\infty} \frac{2^n}{n} \cdot \frac{1}{2^n} = \sum_{n=1}^{\infty} \frac{1}{n}.
  \]
  This is the harmonic series, which diverges to infinity. Therefore, $E[|X|] = \infty$, and the expected value $E[X]$ is not well-defined. The series $\sum_{n=1}^{\infty} (-1)^{n+1} \frac{1}{n}$ converges conditionally to $\ln 2$ for the standard ordering of terms (n=1,2,3,...), but conditional convergence is insufficient for a well-defined expected value in probability theory. This is because the expected value must be invariant to the ordering of outcomes in the sample space, and conditional convergence violates this requirement.

  ### Why step (2) looked fine initially
  Step (2) appears plausible because the series $\sum_{n=1}^{\infty} (-1)^{n+1} \frac{1}{n}$ does converge to $\ln 2$ under the standard ordering of outcomes. This ordering corresponds to the natural indexing of the sample space by $n$ (the number of flips until the first heads). However, this convergence is deceptive for decision theory because it relies on a specific enumeration of the outcomes. Since the absolute expectation diverges, the expected value is not robust to rearrangements, which means it cannot serve as a reliable guide for rational choice.

  ### What rejecting step (2) costs you
  Rejecting step (2) means accepting that the expected value is undefined for the Pasadena game. This requires a stricter interpretation of expected value than your friend's premise (1): convergence alone is not enough; absolute convergence is necessary. The cost is that you cannot assign a unique expected value to certain pathological games like the Pasadena game. However, this does not spell the death of expected value reasoning for most real-world decisions. Instead, it highlights a limitation: expected value is only well-defined and applicable when $E[|X|] < \infty$, which ensures that the sum is immune to rearrangement.

  ### Addressing the other steps
  - **Step (3)**: The Riemann rearrangement theorem is correctly applied to the series, but it does not imply that the gamble itself has multiple expected values. Rather, it shows that the conditional convergence of the series makes any finite value (like $\ln 2$) an artifact of the ordering, not an inherent property of the gamble. Since the expected value is undefined, there is no "single gamble" with multiple values—it simply lacks a well-defined expectation.
    
  - **Step (4)**: The conclusion that the gamble has every expected value simultaneously is invalid because it presupposes that an expected value exists. In reality, no well-defined expected value exists at all.

  - **Step (5)**: Premise (1) is not entirely false, but it is incomplete. Expected value reasoning is not "dead"; it must be refined to require absolute convergence. The issue is with the definition, not the concept itself.

  - **Step (6)**: The slide from (5) to (6) is an overgeneralization. While the Pasadena game is problematic, it is a carefully constructed edge case. Most real decisions (e.g., insurance, climate policy) do not exhibit this pathology:
    - **Insurance and thin-tailed risks**: Payoffs are typically bounded or have light tails, so $E[|X|] < \infty$ holds. Expected value (or expected utility) is well-defined and applicable.
    - **Fat-tailed distributions**: These can be challenging (e.g., in finance or climate modeling), but they do not necessarily involve conditional convergence. For instance, a distribution with power-law tails may have infinite expectation (e.g., the St. Petersburg paradox) or finite expectation depending on the parameters. In such cases, $E[X]$ is either finite, infinite, or undefined, but infinite expectations are not the same as undefined expectations due to conditional convergence.
    - **"Altitude" cases**: Hájek's point is that the Pasadena pathology can be scaled (e.g., by tweaking payoffs to create similar conditional convergence), but this does not imply that all unbounded decisions are pathological. Real-world decisions often involve bounded utilities, discounting, or other structures that prevent such issues. Moreover, decision theory has responses, like using decision rules that avoid expectation for ill-behaved gambles (e.g., minimax, or rank-dependent utility).

  ### Broader implications for expected value theory
  Expected value maximization is not "dead"; it remains a cornerstone of decision theory for well-behaved gambles where $E[|X|] < \infty$. The Pasadena game shows that there are limits, but these are edge cases rather than the norm. To handle pathological cases:
  - **Refine expected value**: Insist on absolute convergence as part of the definition. This is standard in measure-theoretic probability, where $E[X]$ is defined only if $E[|X|] < \infty$.
  - **Alternative approaches**: For gambles like the Pasadena game, consider other decision rules (e.g., those from robust control, prospect theory, or bounded utility approaches). However, no single rule may satisfy all intuitive axioms, as Hájek and Nover discuss.
  - **Practical relevance**: For real decisions with unbounded tails, ensure that utilities are bounded or that distributions are chosen to avoid conditional convergence (e.g., by truncating payoffs or using integrable utility functions).

  In sum, the argument fails at step (2) because it misapplies expected value theory to a gamble that lacks a well-defined expectation. Rejecting this step costs you nothing but the illusion that expected value can handle every conceivable gamble—which was never its claim. Expected value reasoning is alive and well for the vast majority of decisions, and its limitations in pathological cases do not undermine its utility in ordinary contexts. If you want to explore this further, look into decision-theoretic responses to the Pasadena game, such as Nover and Hájek's work on "uncountable expectations" or the use of weighted utility models.
