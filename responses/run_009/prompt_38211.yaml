prompt: |-
  I sit on the ethics committee of a nonprofit organization that runs several dementia care homes, and we must adopt a general policy on dementia-specific advance directives before our January meeting, using one live case as our test case.

  The case: Mrs. H executed a directive fifteen years ago, while fully competent, shortly after watching her mother spend six years in advanced dementia. The document is unusually specific. Once she can no longer recognize family members or converse about her own past, she directs that she not be transferred to hospital for any reason, not receive antibiotics for intercurrent infections, and not be hand-fed if she stops eating on her own — comfort care only. It also contains a provision her family's lawyer says he has never encountered in another directive: she wrote that the whole document should be treated as void if she has visibly settled into a contented routine and is no longer distressed by her condition.

  Mrs. H is now in mid-stage dementia. She no longer recognizes her daughter and cannot discuss her past, so the operative conditions of the directive are met. But staff describe her as genuinely content: she enjoys her meals, laughs at the activities program, has a companion she walks the corridor with every afternoon, and shows none of the fear and agitation her mother reportedly suffered. Her daughter insists the directive be honored in full, arguing that the void-if-content clause was boilerplate her mother added to appease relatives who worried she was asking for too little care, and that in any case a patient who cannot form new memories is in no position to rescind anything. Her son argues the opposite: the clause is the single most personal line in the document, it points precisely at the situation we now face, and honoring the restrictive provisions while quietly ignoring the escape hatch is selective enforcement of his mother's wishes. The nursing staff, meanwhile, are deeply uncomfortable with the no-hand-feeding provision and want a policy that tells them clearly when they may decline to follow instructions of that kind.

  Three positions have emerged on our committee. The first holds that the competent author of the directive had the authority to settle these matters in advance, that her current preferences cannot override it because they issue from the very condition she wrote against, and that a policy that lets later contentment cancel prior instructions makes such directives worthless precisely when they matter. The second holds that the woman currently living on the ward is the only person whose interests are actually at stake now, that the directive is at most one input into judging those interests, and that a policy that starves a happy patient to satisfy an author who no longer exists in any meaningful sense is perverse. The third proposes a compromise in which directives reliably shape the patient's environment and the goals of care but can never mandate withholding the basics of comfort, including assisted feeding.

  Please draft the written opinion I will circulate before the meeting. It should recommend a concrete course of action for Mrs. H's case, and, more importantly, recommend which of the three general policy frameworks we should adopt — or argue for a fourth if none is workable — with criteria our staff can actually apply at the bedside rather than abstract principles. It should take a definite position on how the self-referential clause should be read, including whether voiding a directive requires the kind of decisional capacity Mrs. H lacks, and whether contentment in dementia is even something a policy can measure. And it should engage the strongest argument on the losing side honestly rather than strawmanning it: whichever framework you recommend, there is a version of the opposing view that a thoughtful colleague on this committee holds, and the memo will only be persuasive to her if it shows why her view nonetheless falls short.
reasoning: |-
  Okay, the user is on the ethics committee of a nonprofit that runs dementia care homes. They need to draft a policy on dementia-specific advance directives, using Mrs. H's case as a test. Let me break down the key elements.

  First, Mrs. H's directive is clear but has a unique clause: it becomes void if she's content. She's now in mid-stage dementia, meets the conditions for the directive to take effect (doesn't recognize family, can't discuss past), but is described as happy and content. The daughter wants the directive enforced, arguing the void clause was just to appease relatives. The son disagrees, saying the clause is crucial and should void the directive. Staff are uncomfortable with the no-hand-feeding part.

  The committee has three positions: strict adherence to the directive, prioritizing current interests over past directives, and a compromise where directives shape care but can't withhold basic comfort like feeding.

  The user needs a written opinion recommending a course for Mrs. H and a general policy. It must address the void clause, how to measure contentment, decisional capacity, and engage opposing views fairly.

  I need to consider the ethical principles: autonomy vs. beneficence, the changing self in dementia, and practical application. The void clause is central—does it require capacity to rescind? Contentment might be observable without decision-making ability. Staff need clear, measurable criteria.

  For Mrs. H, her current contentment seems to meet the void clause condition. But the daughter claims it was boilerplate. However, since it's in the document and specific, it should be honored. Also, hand-feeding is basic care; withholding it conflicts with comfort measures.

  The compromise position makes sense as a policy. Directives guide care but can't deny basics like assisted feeding. This balances past autonomy with current well-being. For the void clause, contentment should be assessed by observable behavior over time, not requiring capacity. Staff can use tools like QoL scales.

  Addressing opposing views: the strict adherence side values autonomy but risks harm to a content person. Prioritizing current interests might disregard clear directives. The compromise avoids these extremes. Staff discomfort with no-hand-feeding supports excluding such provisions.

  Recommendation: For Mrs. H, void the directive based on her contentment. General policy: directives are binding except for basic care provisions, with mechanisms to void based on observable well-being. Provide staff with assessment tools and clear guidelines.
answer: |-
  ## Ethics Committee Recommendation: Policy Framework for Dementia-Specific Advance Directives  

  **To:** Ethics Committee Members  
  **From:** [Your Name], Ethics Committee Member  
  **Date:** December 1, 2024  
  **Subject:** Recommended Policy Framework & Action for Mrs. H’s Case  

  ### I. Introduction  
  This memorandum addresses Mrs. H’s case and the broader policy framework for dementia-specific advance directives. Our task is to reconcile the autonomy of the past self with the well-being of the present self, while providing staff with actionable criteria. After careful analysis, I recommend adopting a **modified version of Position Three (the compromise framework)** as institutional policy, with specific guidance for interpreting clauses like Mrs. H’s "void-if-content" provision.  

  ---

  ### II. Recommended Action for Mrs. H’s Case  
  1. **Honor the void-if-content clause:** Mrs. H’s directive is rendered **inoperative** in its restrictive provisions (no antibiotics, no hand-feeding).  
  2. **Basis for decision:**  
     - **Contentment is observable:** Staff reports confirm Mrs. H exhibits sustained, unambiguous contentment (enjoyment of meals, social engagement, absence of distress).  
     - **No decisional capacity required:** The clause does not require Mrs. H to *rescind* the directive; it automatically voids it based on objective conditions ("visibly settled into a contented routine").  
     - **Contextual integrity:** Ignoring this clause—the directive’s most situationally specific element—undermines the document’s overall intent.  
  3. **Care Plan:** Provide comfort-focused care, including hand-feeding if needed and antibiotics for infections causing suffering. Transfer to hospital only if comfort cannot be maintained onsite.  

  ---

  ### III. Recommended General Policy Framework  
  **Policy:** Advance directives for dementia are binding guides to the patient’s values and environment, **except** when they mandate withholding basic comfort measures (e.g., assisted oral feeding, hygiene, pain relief) or when the directive contains a *validated observable-condition voiding clause*.  

  #### Key Policy Components:  
  1. **Core Principle:**  
     - **"Dual Commitment Framework":** We honor the *precedent autonomy* of the directive’s author while recognizing the *current experiential interests* of the living patient. Neither trumps the other absolutely; they are balanced through structured criteria.  

  2. **Binding Elements of Directives:**  
     - *Environment & Care Goals:* Directives dictate the *milieu* (e.g., "no aggressive interventions," "focus on quiet comfort") and overarching goals ("avoid prolonged dying," "prioritize dignity over longevity").  
     - *Limits on Burden:* Refusals of specific high-burden interventions (e.g., CPR, ventilators, dialysis) remain binding.  

  3. **Non-Binding Elements:**  
     - **Comfort Care Imperative:** No directive may mandate withholding basics of comfort:  
       - Assisted oral feeding/hydration  
       - Routine hygiene  
       - Pain/symptom management  
       - Treatment of easily manageable infections (e.g., UTIs, pneumonia) if causing distress.  
     - **Voiding Clauses Based on Observable States:**  
       - Clauses voiding directives based on *observable behaviors* (e.g., "if content," "if engaged") are valid if:  
         - The condition is clearly defined.  
         - The state is **measurable** by staff via:  
           - *Standardized tools:* Dementia-specific QoL scales (e.g., QUALID, QOL-AD) documenting sustained well-being.  
           - *Behavioral markers:* Documented enjoyment of activities, social interaction, absence of distress signals (≥30 days).  
         - **No capacity assessment is required.** The condition is met by observable state, not patient intent.  

  4. **Staff Safeguards:**  
     - **Conscience Provision:** Staff may decline to participate in implementing non-comfort-care directives after ethics consultation.  
     - **Regular Reassessment:** Patient well-being and applicability of voiding clauses reassessed quarterly or with clinical changes.  

  ---

  ### IV. Interpretation of Mrs. H’s Void-If-Content Clause  
  - **Valid & Triggered:** The clause is highly specific ("visibly settled," "contented routine") and mirrors Mrs. H’s current state. It reflects her nuanced understanding that her mother’s suffering, not dementia itself, motivated her directives.  
  - **Does Not Require Capacity:** The clause is a *condition precedent*, not a revocation. It voids the directive automatically upon observable fulfillment, akin to a "sunset clause." Requiring capacity to "rescind" would nullify the clause’s purpose in dementia.  
  - **Measurable Contentment:** Staff observations (mealtime enjoyment, laughter, companionship) meet the threshold. Policy will standardize this via:  
    - **Checklist:** Documented positive affect ≥3x/day, participation in ≥1 preferred activity daily, no distress behaviors (e.g., aggression, withdrawal) for ≥30 days.  
    - **Care Conferences:** Multidisciplinary review (nursing, activities, MD) to confirm contentment.  

  ---

  ### V. Engagement with Opposing Views  
  **Strongest Argument for Strict Adherence (Position 1):**  
  *"Discounting clear instructions because a patient ‘seems happy’ destroys the utility of directives. The current self’s preferences are products of the disease the directive sought to avoid. Autonomy requires respecting the competent self’s binding choice."*  
  - **Why it falls short:**  
    1. **Ignores Document Complexity:** Mrs. H explicitly *limited* her directive’s applicability if contentment occurred. Strict adherence selectively enforces only her restrictions while ignoring her contingency.  
    2. **Overmedicalizes Personhood:** Reducing the directive to "binding commands" ignores that Mrs. H valued *well-being*, not just avoidance of suffering. Her voiding clause shows she prioritized experiential quality over biological existence.  
    3. **Practical Impossibility:** Staff cannot humanely withhold spoon-feeding from a patient who opens her mouth and smiles. This violates core nursing ethics and risks trauma to caregivers.  

  **Strongest Argument for Current Interests Primacy (Position 2):**  
  *"The directive is a historical document. The sentient person here now—who is happy and engaged—deserves protection from harm dictated by a ‘self’ that no longer exists. Interests, not past autonomy, are paramount."*  
  - **Why it falls short:**  
    1. **Dismisses Autonomy Unfairly:** Mrs. H’s directive wasn’t a rejection of life *per se* but of *specific suffering*. Her voiding clause integrates her future self’s interests. Ignoring the entire directive disrespects her foresight.  
    2. **Slippery Slope:** If all directives can be overridden by current contentment, future patients lose a crucial tool to prevent unwanted overtreatment. This undermines trust in advance care planning.  
    3. **Fails Staff:** Without the directive’s guidance, staff lack criteria to resist family/clinical pressure for burdensome interventions the patient explicitly refused.  

  ---

  ### VI. Conclusion & Recommended Policy Adoption  
  Mrs. H’s case demonstrates the need for a policy that:  
  - **Respects autonomy** by honoring directives as expressions of values,  
  - **Protects well-being** by mandating comfort care fundamentals,  
  - **Validates observable changes** through structured voiding clauses.  

  **Move to adopt the "Dual Commitment Framework"** as outlined, with:  
  1. Comfort care (including assisted feeding) as non-waivable.  
  2. Valid voiding clauses based on measurable well-being, not capacity.  
  3. Staff tools for assessing contentment (standardized scales/checklists).  

  This framework provides actionable bedside criteria, respects Mrs. H’s nuanced directive, and aligns with our mission to deliver compassionate, dignity-preserving care. I urge the committee to support this recommendation at our January meeting.  

  **Attachments:**  
  - Draft Policy Language: "Dementia-Specific Advance Directives: Implementation Guidelines"  
  - Staff Assessment Tool: "Observable Well-Being Checklist for Voiding Clauses"  
  - QoL Scales: QUALID & QOL-AD Protocols  

  ---  
  **Signature:**  
  [Your Name]  
  Member, Ethics Committee
