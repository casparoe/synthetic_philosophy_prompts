prompt: |-
  Longtime lurker on LessWrong-adjacent spaces here, and after all these years I still don't have a stated policy on METI — only gut verdicts. Can someone extract the principle out of them for me? Here's the raw data.

  The Voyager golden record and the Pioneer plaque: fine. Whoever finds those is already parked in our solar system, so they've found us. The Arecibo message from the 70s, beamed at a globular cluster some 25,000 light years off: fine, I think, because the reply arrives 50,000 years from now, and the "we" that receives it just isn't the "we" doing the sending. A one-shot message to a star ~20 light years out, which is roughly what the Cosmic Call people did in the 90's: not fine. A permanent omnidirectional beacon that screams our location forever: extremely not fine. Our ordinary TV and radar leakage: can't be helped, so no verdict. And the argument "we've been leaking for a century anyway, so one more deliberate message changes nothing" — I'm sure it's wrong, but notice that my verdicts on the Arecibo case make it awkward to explain exactly why.

  Two more data points. The Cosmic Call was arranged by a private outfit rather than any government, and that somehow makes it feel worse to me, though I can't defend that at all. And the case I keep flip-flopping on: suppose we receive a clear signal from 50 light years away, and the obvious move is to reply. Is that fine — they sort of asked, after all — or have we just handed a stranger our exact address?

  So: is there a single principle behind all this, or close? The two candidates I half-see are "only send what the recipients could detect about us anyway" and "only send at ranges where the round trip outlasts our civilization," and I suspect the real answer is some conjunction of them, but when I try the conjunction on the reply case it goes silent. Give me the principle stated precisely, tell me which of my verdicts it has to throw overboard (I assume the private-company one, but check whether it's that one or the Arecibo one), and say what it predicts for a case I haven't listed.
reasoning: |-
  Okay, the user is a long-time lurker on LessWrong-adjacent spaces, so they're familiar with rationalist and existential risk concepts. They've been grappling with METI (Messaging Extraterrestrial Intelligence) policies but only have gut feelings, not a clear principle. They want someone to extract a coherent principle from their verdicts on various METI scenarios.

  First, let's list their verdicts: Voyager and Pioneer are fine because the finder is already in our solar system. The Arecibo message to a globular cluster 25k light-years away is fine because the reply comes back in 50k years, so future humans deal with it. But a targeted message to a star 20 light-years away (Cosmic Call) is not fine. A permanent beacon is extremely not fine. TV/radio leakage is unavoidable, so no verdict. They reject the argument that deliberate messages don't matter since we're already leaking. 

  Additional points: They feel worse that Cosmic Call was done by a private company, though can't defend it. They're conflicted about replying to a signal from 50 light-years away—is it fine because they "asked," or bad because we're giving our address?

  The user suspects two candidate principles: "only send what recipients could detect anyway" and "only send at ranges where the round trip outlasts our civilization." But combining them doesn't cover the reply case. They want a precise principle, which verdicts it overrules, and a prediction for a new scenario.

  Looking at their cases, the key factors seem to be:
  1. **Intentionality vs. Accidental**: Accidental leakage is unavoidable, so no verdict. Deliberate acts are judged.
  2. **Detection Range**: Short-range (like Voyager) is low risk since the entity is already here. Long-range (Arecibo) is okay because the timeline is beyond our civilization's expected lifespan. Medium-range (20 light-years) is problematic because the round-trip is within human timescales.
  3. **Permanence**: A permanent beacon is the worst because it continuously broadcasts forever.
  4. **Reciprocity**: Replying to a signal is tricky—is it invited contact or reckless?

  The "round trip outlasts civilization" principle explains most cases: Voyager isn't a message but a probe, so it's passive. Arecibo's 50k year round-trip exceeds civilization duration (say, 10k years). Cosmic Call's 40-year round-trip is within our lifetime. A beacon has no round-trip but permanently advertises, so it's infinitely bad. Leakage is unintentional. 

  The private company aspect might tie to governance: unauthorized actors making decisions for humanity. Replying to a signal feels like consent ("they asked"), but giving our exact location is risky. The principle could include a reciprocity clause: replying is acceptable because it's responsive, not initiating.

  Synthesizing a principle: **"Deliberate METI is permissible only if either (a) the minimum round-trip communication time exceeds the expected duration of our civilization, or (b) it is a responsive communication to a signal verified as originating from extraterrestrial intelligence."**

  This covers:
  - Arecibo: 50k years > civilization duration → permissible.
  - Cosmic Call: 40 years < civilization duration → impermissible.
  - Beacon: No round-trip, permanent → impermissible.
  - Reply to signal: Responsive → permissible.
  - Voyager/Pioneer: Not METI (passive artifacts), so N/A.
  - Leakage: Unintentional, so not deliberate METI.

  Overruled verdicts: 
  - The user's discomfort with private companies isn't directly addressed. The principle is outcome-based, not actor-based. If a private company sends a message within 50 light-years, it's bad; if to 25k, it's acceptable. So the actor doesn't matter, only the parameters.
  - Arecibo is deemed fine under this principle, matching the user's verdict.

  New case prediction: A deliberate message to a star 200 light-years away (400-year round-trip). If civilization duration is 10k years, it's permissible. If we expect collapse sooner, say 500 years, it's impermissible since 400 < 500.

  Underlying needs: The user wants moral clarity on METI to align actions with existential risk mitigation. They might also seek a framework to advocate for policy or resolve internal conflict. The reciprocity case shows they value consent but fear naivety. The principle addresses this by allowing replies as "invited" contact while restricting unsolicited broadcasts to safe timelines.
answer: |-
  Based on your gut verdicts, I can extract a coherent principle that explains nearly all your judgments while resolving your internal contradictions. Your intuitions align with a **Risk-Timescale Symmetry Principle** with a critical addendum:

  ### The Principle
  **"Deliberate METI is permissible only if either:  
  (a) The *minimum round-trip communication time* exceeds the expected duration of Earth-originating technological civilization, or  
  (b) It is a *responsive communication* to a signal verified as originating from extraterrestrial intelligence."**

  ### Breakdown of the Principle
  1. **Round-trip time > Civilization duration**:  
     Ensures any response arrives when "we" (as a coherent, continuous civilization) no longer exist. This makes the risk impersonal and non-agentive (future entities bear the consequences).  
     
  2. **Responsive exemption**:  
     Replying to an alien signal is permitted because:  
     - They initiated contact, accepting mutual risk.  
     - Ignoring a signal could be seen as hostile or invite further probing.  
     - It doesn't *reveal* our location beyond what their signal already confirmed (they clearly know where we are).

  3. **Implicit corollary**:  
     Unintentional leakage (e.g., TV/radar) is irrelevant because it's non-deliberate. Deliberate acts impose *moral responsibility*.

  ---

  ### Application to Your Verdicts
  | Case                          | Your Verdict | Principle's Verdict | Explanation |
  |-------------------------------|--------------|---------------------|-------------|
  | **Voyager/Pioneer**           | Fine         | Fine (N/A)          | Not METI—passive artifacts. Finding them implies presence in our system, so risk is already realized. |
  | **Arecibo (25k LY)**          | Fine         | Fine                | Round-trip = **50k years** ≫ civilization duration (∼10k years?). Future entities inherit the risk. |
  | **Cosmic Call (∼20 LY)**      | Not fine     | Not fine            | Round-trip = **∼40 years** ≪ civilization duration. *We* bear the risk. |
  | **Permanent beacon**          | Extremely not fine | Not fine       | No round-trip—broadcasts *forever*. Maximizes exposure across all timescales. |
  | **TV/radar leakage**          | No verdict   | Permissible         | Non-deliberate; no moral agency. Principle only governs *intentional* acts. |
  | **Reply to signal (50 LY)**   | Flip-flops   | **Fine** (responsive) | Exempt under (b). They know we're here; replying is diplomatic necessity. |
  | **Private company METI**      | Feels worse  | **No distinction**  | Principle is actor-agnostic. Risk depends on *parameters*, not sender. |

  ### Verdicts Overruled
  1. **Private-company discomfort**:  
     Discarded—as long as the message parameters (range, content) satisfy the principle, it doesn't matter if it's a government, company, or individual. Your unease likely stems from *governance* concerns (e.g., "Who decides for humanity?"), but the principle focuses on *outcomes*.
     
  2. **Arecibo survives**:  
     Your intuition holds—it's fine because of the timescale disconnect.

  ### Why Your "Awkwardness" Resolves
  You rejected *"we're already leaking, so METI changes nothing"* but struggled to articulate why. The principle explains:  
  - **Leakage**: Accidental, low-intensity, and degradable (signals fade; old TV shows are indecipherable noise at >100 LY).  
  - **Deliberate METI**: High-powered, targeted, and designed for detection. It shouts *"Here we are!"* to specific targets, amplifying risk exponentially.  
  Crucially, **Arecibo is harmless** under this framework because its 50k-year round-trip severs responsibility, while **Cosmic Call** is reckless because 40 years is a blink in civilizational time.

  ---

  ### Prediction for a New Case
  **Scenario**: *A laser beacon targeting a star 200 LY away, repeating annually for a decade.*  
  **Principle's Verdict**: **Not fine** if civilization duration < 400 years (round-trip time).  
  - **Why?** Targets a *specific* system at a range where the round-trip (400 years) could plausibly be within our civilization's lifespan (e.g., if we last 500+ years). Unlike Arecibo, this isn't "far enough" to guarantee timescale decoupling.  
  - **Contrast with Arecibo**: Arecibo targeted a *globular cluster* (high stellar density) 25k LY away—intentionally maximizing distance and minimizing targetability.

  ### Final Note
  This principle prioritizes **civilizational continuity** and **intergenerational responsibility**. It assumes:  
  - Technological civilizations are rare and potentially dangerous (Great Filter).  
  - "We" are stewards of Earth's future intelligence.  
  - Replying to contact is ethically distinct from initiating it.  

  If you define "civilization duration" as ≤10,000 years (a common estimate), any deliberate METI inside ∼5,000 LY is impermissible. Cosmic Call (20 LY) fails spectacularly; Arecibo (25,000 LY) passes. The reply case is safe because it's not *initiation*—it's cosmic etiquette.
