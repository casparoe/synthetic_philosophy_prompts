  Therefore, to have underdetermination, we must not allow the interpreters to see the hidden node activations. Only inputs and the final output.

  Then what do they interpret? They might try to interpret the hidden nodes, but without data on them, they can only infer from the input-output pairs.

  But then they might not be able to uniquely determine the hidden node functions.

  However, the hidden nodes are not observable to them. So they might build a model of the hidden layer that is consistent with the input-output pairs.

  But there can be many such models.

  So for underdetermination, we can have two different assignments to the hidden nodes that are consistent with the input-output pairs.

  Example: the function is O = (A AND (B OR C)) OR (B AND C)

  But there is also O = (A AND B) OR ((A OR B) AND C)   [which is the same function].

  But the hidden node structure is different. But since the hidden nodes are not observable, the interpreters might propose either of these two as the internal mechanism.

  And both will predict the same final output for any input.

  Then when we do interventions on hidden nodes, the predictions will differ.

  So we can do that.

  But the interpreters don't see the hidden nodes, so they might not ascribe concepts to individual hidden nodes? Or they might, as part of their theory.

  The wrinkle: tempt them to ascribe a concept that isn't there. In this setting, they might ascribe to a hidden node a concept that is not actually computed by any node.

  For example, they might think that there is a hidden node that computes A AND C. But in the actual implementation, there isn't. And in the alternative, there isn't either.

  But how would they know? They might propose that one of the hidden nodes is computing A AND C. But then they would have to complete the rest of the network.

  But it's possible that they propose a network where one hidden node is A AND C, and then they have to make the output work.

  For example, they might propose:
    H1 = A AND C
    H2 = ... we need to make O = majority.

  But majority cannot be expressed as H1 OR something if H1 is A AND C.

  For instance, they might set:
    O = (A AND C) OR (B AND something) ... but it's not straightforward.

  Alternatively, they might propose a different architecture with three hidden nodes? But we only have two.

  So to keep it simple, we can have the underdetermination between the two implementations (Imp1 and Imp2) and then the wrinkle might be that they are tempted to think that the network is using a node for "exactly two" or something else.

  But let's proceed with the underdetermination between the two implementations.

  Summary of the exercise:

  1. Split the class: 6 implementers, 6 interpreters.
  2. Implementers: 
     - 3 input nodes (A, B, C) - each has a card with their label.
     - 2 hidden nodes (H1, H2) - cards with their rules:
          H1: Output 1 if A is 1 and (B is 1 or C is 1), else 0.
          H2: Output 1 if B is 1 and C is 1, else 0.
     - 1 output node (O): Output 1 if H1 is 1 or H2 is 1, else 0.
     - The implementers are arranged in a row: input nodes first, then hidden, then output.
     - They pass paper slips with 0 or 1.

  3. Interpreters: 
     - They can only see the inputs (A, B, C) and the final output (O).
     - They are given a set of training examples: inputs and corresponding outputs.
     - They can ask for any input and get the output.
     - They are paid points for correctly predicting the output for held-out inputs (passive prediction).
     - Then, they are paid for predicting the effect of interventions (e.g., force H1 to 0, then give input (1,0,1) and predict the output).

  4. Underdetermination: 
     - The function is the majority function. 
     - The interpreters might come up with two theories:
          Theory 1 (actual): O = [A and (B or C)] or (B and C)
          Theory 2 (alternative): O = (A and B) or ((A or B) and C)
     - Both theories predict the same outputs for all inputs.

  5. Intervention to break underdetermination:
     - Force H1 to 0.
     - Input (1,0,1):
          - In the actual implementation: O = 0 or (B and C) = 0 or (0 and 1) = 0.
          - In theory 2: O = 0 or ((A or B) and C) = ((1 or 0) and 1) = 1.

     So if they believe theory 2, they will predict 1, but the actual output is 0.

  6. Wrinkle: Tempt them to ascribe a concept not there.
     - We can have the training set include many examples where A and C are both true, and the output is true, and also H1 is often active in these cases (because in the actual implementation, when A and C are true and B is false, H1 is true). But there is no node that exclusively represents A and C.
     - The interpreters might then propose that H1 represents the concept of "A and C". But then for an input like (1,1,0), they would predict H1=0 (because A and C is 0) but in the actual implementation, H1=1. But they don't see H1! So they can't verify.
     - However, they might incorporate this into their theory of the hidden layer. For example, they might theory that the network has:
            H1 = A AND C
            H2 = ... let's say they set H2 = B AND (something) ... but it's hard to make the output work.

     Alternatively, they might think that the network is using A AND C as a feature, even if not represented in a single node. But the wrinkle is to ascribe it to a node.

     Since they don't see the nodes, they might ascribe it to H1 in their proposed model. For example, in their proposed model, they might have H1 = A AND C, and then they have to explain the output. But then for input (1,1,0), the output should be 1, but if H1=0 (because C=0), then they would need H2 to be 1. So they might set H2 = A AND B. Then their model would be: O = (A AND C) OR (A AND B). But then for input (0,1,1): A=0, so H1=0, H2=0, so O=0, but the correct output is 1. So their prediction would fail.

     Therefore, if they try to use H1 = A AND C, they will make mistakes in passive prediction and abandon it.

     So to have a wrinkle that doesn't break passive prediction, we need a false concept that is predictively equivalent in the passive phase.

     How about they ascribe to the network as a whole the concept of "at least two of the same feature"? But that's vague.

     Another idea: in the training set, include only inputs that have at least one of the following: a horizontal line in the top row of a grid, etc. But we changed to bits.

     Perhaps we should return to the grid idea.

    Let's try a different wrinkle: the task is to detect whether a 2x2 grid has a filled row or a filled column, but the actual network uses only row detectors and not a column detectors? But in our earlier design with the grid, we had:

    B1 = top row (A1 and A2)
    B2 = bottom row (A3 and A4)
    B3 = (A1 and A3) or (A2 and A4)   [ which is any vertical ]

    then C = B1 or B2 or B3.

    The wrinkle: the interpreters might think that B3 is only for left vertical (A1 and A3) and that there is another node for right vertical? But there isn't, because B3 combines both.

    But then when they want to predict the effect of an intervention on B3, they might think that disabling B3 only disables left vertical, but in fact it disables both.

    How about underdetermination? Can we have two interpretations of B3?

    Interpretation 1: B3 = left vertical OR right vertical (actual)
    Interpretation 2: B3 = left vertical only

    Then they would have to explain how right vertical is detected. They might think there is another node? But there isn't. In our architecture, we have only three hidden nodes.

    So in interpretation 2, they would predict that for a right vertical input (A2=1, A4=1), the output should still be 1 even if B3 is set to 0, because they think B3 is only for left vertical. But in fact, with B3=0, the output is 0 for right vertical.

    So prediction fails.

    But is interpretation 2 consistent with the passive phase? Only if they assume that right vertical is handled by another node. But there is no other node. The output is not activated. So for an input that is only right vertical (A2=1, A4=1, and others 0), they will see that the output is 1. How do they explain that in interpretation 2? They must assume that there is a node for right vertical. But they don't see it. 

    So unless they invent an extra node, they can't have interpretation 2. 

    Given the known architecture (3 hidden nodes), they might assume that one node is for top row, one for bottom row, and one for left vertical, and then how is right vertical handled? They might think it's not handled, but it is in the data. So they would be forced to abandon interpretation 2.

    So underdetermination is not between these two.

    We can have underdetermination with two different ways to assign the vertical feature.

    For example, the actual: 
          B1 = top row
          B2 = bottom row
          B3 = left vertical OR right vertical

    Alternative:
          B1 = top row
          B2 = bottom row
          B3 = left vertical

    then how to handle right vertical? They might think that the output node also takes input from the input nodes directly? But in our architecture, the output node only from hidden nodes.

    So it's not possible.

   Given the time, let's go with the majority function and the two different implementations that are functionally equivalent for the output and for the hidden node activations are not observable. Then the underdetermination is at the level of the hidden node functions, and only interventions will distinguish.

   And for the wrگیچله, we can have the instructor encourage the interpreters to ascribe concepts to the hidden nodes. For example, the instructor can say: "What do you think H1 represents?" and then in the actual implementation, H1 is "A and (B or C)" which can be described as "A and at least one other", but someone might say "A and ( not both B and C are zero )" or something. But we can also have the temptation to say that H1 is "A and B" or "A and C". But without data on H1, they can't verify.

   However, to make the wrinkle work without prediction errors, we can have them ascribe a concept that is not locally computed by any node but is a distributed property. But that might be too advanced.

   Given the complexity, I will focus on the underdetermination between the two wiring interpretations.

   Exercise structure:

   Phase 1: Setup (10 minutes)
     - Explain the rules.
     - Implementers receive their index cards and understand their rule. They are arranged in a network: 
          A -> H1
          B -> H1, H2
          C -> H1, H2   [ because H1 uses A, B, C; H2 uses B, C ]
          H1 -> O
          H2 -> O
     - But note: in the actual implementation, H1 = A and (B or C), so it needs A and (B or C). How do we implement that? We can have H1 receive A, B, C and then apply the rule.

     - The implementers practice with a few inputs.

     - Interpreters are told that they can query any input combination and get the output. They also know the architecture: 3 input nodes, 2 hidden nodes, 1 output node, and the connectivity: 
          A is connected to H1.
          B is connected to H1 and H2.
          C is connected to H1 and H2.
          H1 and H2 are connected to O.

     - They do not know the rules on the index cards.

   Phase 2: Passive prediction (20 minutes)
     - Interpreters are given a training set of 5-10 input-output examples.
     - They can also query any input they want.
     - Their goal is to build a model that can predict the output for new inputs.
     - They are given a set of held-out inputs for which they predict the output and earn points for correct predictions.

     - We expect they will come up with the truth table for the majority function.

     - Then, we ask them to propose the rules for the hidden nodes. They might come up with two possible theories:

          Theory 1 (actual): 
              H1 = A and (B or C)
              H2 = B and C

          Theory 2 (alternative):
              H1 = A and B
              H2 = (A or B) and C

     - Both are consistent with the input-output data.

     - The class might split into two groups advocating for each.

   Phase 3: Intervention (20 minutes)
     - Interpreters are now asked to predict the effect of interventions.
     - Example interventions: 
          - Disconnect or force H1 to 0.
          - Disconnect or force H2 to 0.
          - Force H1 to 1.
     - They are given an input and must predict the output after the intervention.

     - We engineer a input where the two theories differ, e.g., (A=1, B=0, C=1) and force H1 to 0.
          - Actual: O=0
          - Theory 2: O=1

     - When they see the actual output is 0, the Theory 2 group is surprised.

     - Then they might revise.

     - We can have another intervention to confirm.

   Phase 4: Wrinkle 
     - To plant the wrinkle, in the training set, include several examples where A and C are 1 and B is 0, and the output is 1. 
     - Then, when they are ascribing concepts, ask them what they think H1 might be. They might say it is "A and C" because that co-occurs with the output in these examples.
     - But then when they try to build a model, they will see that if H1 = A and C, then for (1,1,0) which should output 1, but if H1=0 (because C=0), then they need H2 to account for it. So they might set H2 = A and B. 
     - Then for (0,1,1): output should be 1, but their model: H1 = 0 and 1 =0, H2 =0 and 1 =0, so O=0 -> prediction error in passive phase.

     - So they will abandon it during the passive prediction phase. So the wrinkle will be resolved then.

     - Alternatively, we can have the instructor or a confederate in the interpreter group propose that H1 might be A and C, and then let the group see that it doesn't work.

   Debrief (20 minutes)

   Specific moments mapped to positions:

     - When the interpreters are successful in passive prediction, this favors the deflationary view: a good predictive summary is all that matters.

     - When they are paid for intervention predictions and their models fail, this favors the realist view: there is a causal structure that goes beyond input-output mappings.

     - The underdetermination moment (two theories) highlights that behavioral data alone might not specify the internal structure.

     - The resolution by intervention shows that interventions can provide evidence for the internal structure.

     - The wr experience shows that it is easy to ascribe concepts that are not there, and that they can be (in this case) falsified by prediction.

   Predictably go wrong:

     - The implementers might make mistakes in calculation. Solution: have them double-check or use a calculator (but no computers, so maybe have a checker).

     - The network might be too simple and the underdetermination might not occur to the students. Solution: the instructor should be ready to seed the two theories.

     - The intervention might not be clearly executed. Solution: have the implementers clearly announce when they are forcing a node's output.

     - Time might be short. Solution: keep the number of examples small.

   The disanal: in the classroom, there is a ground truth (the index cards). For a trained network, the realist claims that there is a ground truth in the weights.

     - This disanalogy does not fatally weaken the exercise because the exercise is about the方法论 of science: how can we know what's inside? The index cards are like the weights: they are there, but we have only behavioral access. The exercise shows that with enough data (including intervention data), we can converge on the ground truth. For real networks, the realist claims that there is a ground truth in the weights, and we can use similar methods to probe it.

     - The exercise should leave the students closer to realism because it shows that interventions can break underdetermination and reveal the causal structure. The deflationary view might say that the only reality is the input-output function, but the exercise shows that the input-output function underdetermines the causal structure, and that structure has observable effects under interventions.

     - Therefore, in the debrief, take the side of realism: representations are real causal components.

   Design definite: 
     - Use the majority function with 3 inputs, 2 hidden nodes, 1 output.
     - Implementers: rules as in Imp1.
     - Allow the interpreters to see only inputs and output.
     - Seed two theories for underdetermination.
     - For wrinkle, in the training set include several (1,0,1) and then ask what concept might be in H1. They might say "A and C", but then it will be falsified when they try to use it in a model for (1,1,0).

  Debrief mapping:

     - Passive prediction success: deflationary view (predictive summary is sufficient for practical purposes).
     - Underdetermination: agnosticism about internal structure.
     - Intervention variance: realist view (the internal structure matters for what happens under interventions).
     - Resolution by intervention: realism is vindicated.

  Final decision: the exercise is designed to show that internal representations have causal powers that go beyond input-output mappings, hence realism is supported.

