answer: |-
  ### Role-Play Design: "The Black Box and the Cards"  
  **Objective:** Students confront whether interpretive stories about neural networks capture causal reality or useful fictions by physically simulating a network with hidden states. Implementers *are* the network; interpreters probe it behaviorally.  

  ---

  ### **Structure & Rules**  
  **Participants:**  
  - **6 Implementers ("The Network"):** Physically embody nodes with fixed input-output rules.  
  - **6 Interpreters ("The Lab"):** Infer the network's internals using inputs, outputs, and interventions.  
  - **Architecture:**  
    - **Input Layer (2 nodes):** Receive hand-drawn 2x2 grids (e.g., ⬛⬜ / ⬜⬛). Each cell is binary (shaded/dark or blank/light).  
    - **Hidden Layer (3 nodes):** Compute rules in secret (index cards).  
    - **Output Layer (1 node):** Classifies if the grid contains a "filled row or column" (✅) or not (❌).  
  - **Connectivity:**  
    - Input 1 → Hidden 1, Hidden 3  
    - Input 2 → Hidden 2, Hidden 3  
    - Hidden 1, 2, 3 → Output  
  - **Index Card Rules (Implementers):**  
    - **Hidden 1:** Output 1 if **top row is shaded** (Input 1 cells both dark). Else 0.  
    - **Hidden 2:** Output 1 if **bottom row is shaded** (Input 2 cells both dark). Else 0.  
    - **Hidden 3:** Output 1 if **any column is shaded** (one column fully dark). *Rule:* `(Input 1, top-left AND Input 2, top-right) OR (Input 1, bottom-left AND Input 2, bottom-right)`  
    - **Output:** Output 1 (✅) if **any hidden node outputs 1**. Else 0 (❌).  

  **Constraints:**  
  - Interpreters see **only inputs (grids) and outputs (✅/❌)**. *No access to hidden nodes or cards.*  
  - **Phase 1 (Prediction):** Lab earns points for predicting outputs on held-out grids.  
  - **Phase 2 (Intervention):** Lab earns points for predicting outputs after interventions (disconnect/force nodes).  
  - **Blackboard:** Record predictions, interventions, and theories.  

  ---

  ### **Session Flow**  
  **0. Setup (10 mins)**  
  - Assign roles: 6 implementers (3 hidden, 2 input, 1 output), 6 interpreters.  
  - Implementers receive index cards, practice rules. Interpreters form a "lab" with blackboard.  
  - **Task Demo:** Facilitator draws a grid (e.g., full top row). Network classifies ✅.  

  **1. Phase 1: Prediction (25 mins)**  
  - **Behavioral Access:** Lab tests grids, observes outputs. *Goal: Predict held-out grids.*  
  - **Training Set (5 grids):**  
    - Full top row (✅), full bottom row (✅), full left column (✅), full right column (✅), diagonal (❌).  
  - **Held-Out Set (3 grids):**  
    - Full right column (✅), full bottom row (✅), scattered fills (❌).  
  - **Engineered Underdetermination:**  
    - Both "row/column" theory *and* "row/edge" theory predict training/held-out correctly:  
      - **Theory A (True):** "Network detects filled rows/columns."  
      - **Theory B (False):** "Network detects filled rows *or outer-edge cells*."  
    - *Wrinkle:* Grids with dark outer-edge cells (e.g., corners) tempt interpreters toward Theory B. *Implementers know "outer edge" isn’t computed.*  
  - **Outcome:** Lab earns points for correct predictions. Theories A and B coexist.  

  **2. Phase 2: Intervention (25 mins)**  
  - **Intervention Rules:**  
    - Disconnect a node (ignore its output).  
    - Force a node to 0 or 1.  
  - **Critical Test:**  
    - **Intervention:** Disconnect Hidden 3.  
    - **Input:** Full right column grid (✅ normally).  
      - Theory A: "Relies on Hidden 3 (column detector). Output ❌ without it."  
      - Theory B: "Uses outer-edge cells (not Hidden 3). Output ✅."  
    - **Actual:** Output ❌ (Hidden 3 is essential).  
  - **Reveal:** Theory B fails. Lab confronts predictive vs. causal divergence.  

  **3. Debrief & Discussion (30 mins)**  
  - **Facilitator Reveals:** Index card rules. Discuss how underdetermination collapsed under intervention.  

  ---

  ### **Debrief: Mapping Moments to Philosophy**  
  1. **Prediction Phase Success (Deflationary View):**  
     - *Moment:* Theories A and B both predict perfectly.  
     - *Philosophy:* Favors **instrumentalism**. Interpretations are "useful fictions" for prediction; no need for causal realism.  

  2. **Intervention Failure (Realist View):**  
     - *Moment:* Theory B fails when Hidden 3 is disconnected.  
     - *Philosophy:* Favors **realism**. Representations (e.g., Hidden 3’s column detection) have causal powers; they’re not just summaries.  

  3. **Underdetermination (Agnosticism):**  
     - *Moment:* Both theories coexist until interventions.  
     - *Philosophy:* Highlights **underdetermination by data**. Behavior alone can’t distinguish interpretations; mechanisms matter.  

  4. **Wrinkle (Projection Risk):**  
     - *Moment:* Lab ascribes "outer-edge detection" (not on cards) due to correlated inputs.  
     - *Philosophy:* Exposes **anthropomorphic projection**. Interpreters impose concepts absent in the mechanism.  

  **Instructor’s Position:** **Realism** wins. Interventions revealed causal structure beyond behavior. The exercise *strengthens* the analogy: just as index cards ground truth here, weights ground truth in neural networks. We infer hidden states *because* they exert causal force—even if "written by evolution" (training) not humans.  

  ---

  ### **Predictable Problems & Fixes**  
  - **Problem:** Implementers make calculation errors.  
    - *Fix:* Use simple grids; rehearse rules. Have a "checker" student verify.  
  - **Problem:** Interpreters fixate on one theory.  
    - *Fix:* Seed both theories via "lab notes" on blackboard. Ask: "Could both work?"  
  - **Problem:** Interventions cause chaos.  
    - *Fix:* Clearly define "disconnect" (node sits out) and "force" (holds 0/1 card).  
  - **Problem:** Time runs short.  
    - *Fix:* Use 3–5 grids per phase; focus on critical tests.  

  ---

  ### **Confronting the Disanalogy**  
  **Disanalogy:** Classroom has index cards (ground truth); neural networks lack a "writer."  
  **Resolution:** This *strengthens* the exercise. Realism argues that training *creates* causal structures (analogous to cards) in weights. The exercise shows how *inference under uncertainty* (via interventions) can uncover hidden realities. Deflationists reduce representations to prediction tools—but the intervention collapse proves predictions *aren’t enough*.  

  **Final Design Choice:** The activity lands students **closer to realism**. Interpretations are more than summaries; they track causal structures with independent powers. The disanalogy becomes the lesson: we posit "ground truth" in networks *because interventions work*, not because we see it.
