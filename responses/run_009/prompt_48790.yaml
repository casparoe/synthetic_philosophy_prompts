prompt: |-
  My flatmate and I have been having the same argument on and off for about two years now, ever since we both read Taurek's famous 70s paper about the person who can either save one friend or a group of strangers (should the numbers count, etc.), and we've decided the only sane thing left to do is a proper adversarial collaboration and actually write the joint statement we should have produced ages ago. For context: she's basically a Taurekian — she thinks there's no such thing as the claims of the many "adding up", that each of the five stands to lose exactly what the one stands to lose, and that if anyone's entitled to a rescue the fairest thing is a coin flip so everyone gets a shot at an equal chance; I think she's confusing fairness with a refusal to do the obvious arithmatic, and that leaving the five to die when you could flip a coin is a moral disaster. We're both exhausted of talking past each other and we want a document we can both actually put our names to.

  So: please draft the joint statement for us. I want a numbered section of claims we can both sign off on — including about the case itself, about what the rescuer owes each person taken one at a time, about what would change if the one were a friend rather than a stranger, and about what's not at issue (we both accept, e.g., that it's better to save one than to save none, and neither of us is a consequentialist about it in the crude sense). Then a disagreements table where each remaining disagreement is worded so that the side holding it would accept the wording as fair — I'm sick of her describing my view as "adding up people's suffering like grocery items" and she's sick of me calling hers "moral innumeracy", so neutral phrasing please. Then the cruxes: we suspect one of them is whether benefits to different people can be aggregated at all, another is whether the mere fact that more people would be saved gives the group a claim that no individual member has, and a third is what fairness actually demands when you can't save everyone — whether equal chances are a requirement or just one permissible option among others.

  For each crux, could you set out the test case or argument that we both agree would bear on it (thought experiments like the one where you up the stakes to a thousand people, or Scanlon-style cases where the numbers work as a tie-breaker between claims that are otherwise comparable, or the variant where the one person faces a worse fate than each of the many), and then write down what each of us would predict about the case — like, what intuition we'd each be committed to and what would make us squirm. And if you think part of our two-year argument has secretly been verbal — e.g. we mean different things by "claim" or by "counting" — please say which part and why, because we've never once managed to work that out ourselves. Format it however makes sense (numbered claims section, then the table), just make it something we could genuinely both sign.
