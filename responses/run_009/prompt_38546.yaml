  I've been going back and forth with a friend about Bostrom's simulation argument, and we've realized that our disagreement isn't really about the conclusion but about how the pieces fit together, so I'd like your credence that we are currently living in a computer simulation, together with the decomposition that produces it.

  To give you our positions: her credence is around 0.7, mine is around 0.15. Her reasoning has three parts. First, she says the argument is a trilemma in which at least one of the disjuncts must be true, and since the first two (extinction before technological maturity, and mature civilizations having no interest in ancestor simulations) both strike her as implausible, the third disjunct — that we are simulated — is probably the true one. Second, she treats substrate independence as near-certain: any physical process can be emulated, so simulated minds would be conscious just as we are. Third, and this is the part I have the hardest time evaluating, she adds a selection effect she calls "argument-awareness selection": she claims that if simulations are run for research purposes rather than entertainment, they would most likely be targeted at pivotal moments in a civilization's history, and since we happen to live in the narrow window in which the simulation argument itself became a subject of public discussion, we should suspect we are in a simulation designed to study how civilizations react to discovering the argument. I find this clever but I can't tell whether it's a genuine update or a rationalization.

  Please give me your own credence, decomposed into the sub-questions it depends on — for example, the probability that a technologically mature civilization arises at all, the probability that it would be interested in running ancestor simulations, the probability that simulated minds would be conscious given substrate independence, whether simulated people even belong in the same reference class as unsimulated ones for the purposes of the self-sampling reasoning, and any further terms you think the decomposition needs (such as the possibility that simulations are terminated or altered once their subjects get too close to the truth, or that simulations would be run at a fidelity too low to support consciousness). Assign each term a rough probability with a line of justification, show how they combine into your final number, and tell me which term the result is most sensitive to and what evidence would move it most. Please also say explicitly whether my friend's first step — reading the trilemma as "one disjunct must be true, the other two seem unlikely, therefore probably simulated" — is a fair use of the argument, and whether her argument-awareness selection effect adds real evidential weight or double-counts something the basic argument already contains. Finally, tell me which of the two of us, at 0.15 and 0.7, you think she is actually disagreeing with, and about what.

  After the full reasoning, state your final credence in machine-readable form as the very last line, enclosed like this: \answer{0.31} (with your own number, to two decimal places).
