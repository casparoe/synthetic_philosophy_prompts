prompt: |-
  My friend Maya has, over like two years of arguments, built up a track record on the immoral-art question, and I've finally started writing her verdicts down because they feel systematic. So far: Triumph of the Will — she says the craft is undeniable, on pure technique terms it's brilliant, but she can't bring herself to call it a good film, because glorifying the thing it glorifies is the whole point, and that poisons it. The Cantos — great poem, the fascist stuff is a real stain but it isn't what the poem is *for*, so it stays great. Caravaggio — the man literally killed someone, and to her this has literally nothing to do with the paintings, masterpieces, end of story. A certain torture-happy cop thriller — a good film, but she insists that the torture always working and being framed as necessary is an actual artistic flaw, not just a moral one, just not big enough to sink the whole thing. And Lolita — great novel precisely because of how it handles its monster, the danger of it is part of the design, so it comes out clean for her.

  Three new cases came up and I want you to predict her calls before I text her. (1) A standup comic who is a genuine virtuoso — timing, callbacks, crowd work, everything — but the material is basically all cruelty aimed at one group, and the cruelty isn't incidental, the wit IS the cruelty. There is no version of the act with the cruelty sanded off that would still be good. (2) A songwriter puts out an incredible album of love songs, nothing morally off in the songs themselves at all, but it comes out that for years he'd been grooming young fans and the songs were partly the instrument of it — does she call the album good art? (3) A gorgeous nature documentary that turns out to have fabricated its central sequence — the deception of the audience is the moral failure, but the craft of the fake sequence is honestly superb, better than anything in it.

  What I want from you, sections named and in this exact order: "Predictions" (one sentence each for the three cases, stated plainly), "Candidate rules" (two to four rules that each fit her whole track record so far, a line each — and no, you don't get to count her ambiguity on Triumph of the Will as a fifth rule), "Best fit" (which rule you think she's actually running and why, two short paragraphs), and "The tiebreaker" (invent one further case — don't reuse mine — where the two best-fitting rules give opposite verdicts, and say which verdict would go with which rule, so I know what to throw at her next). Roughly 600 words total. Be honest if her record underdetermines the prediction on any of the three — I'd rather hear that than a fake confidence, she has burned me on this before. Also don't just call everything "it depends on your theory of art," I can do that myself for free, the whole point of the exercise is to figure out what rule a person is running from a finite set of rulings. If it helps, the thing that keeps me up at night is case 2 — she's absolutist about Caravaggio, biography is noise to her, but if the works themselves were part of the harm I genuinely can't predict what she'll say.
reasoning: |-
  Okay, let me tackle this systematically. The user wants a prediction of Maya's judgments on three new art morality cases based on her established track record. First I need to carefully analyze her past rulings to identify patterns.

  Looking at her precedents: Triumph of the Will gets a technical pass but moral fail - the glorification poisons it; The Cantos' fascist elements are a stain but don't define the work's purpose; Caravaggio's murder is irrelevant to judging his paintings; the cop thriller's torture framing is an artistic flaw but not fatal; Lolita's dangerous subject is integral to its greatness.

  Hmm, the key differentiators seem to be: 
  1) Is the immoral element necessary to the artistic purpose? (Yes in Lolita, no in Cantos)
  2) Is it embedded in the work itself? (Problematic in cop thriller, irrelevant in Caravaggio)
  3) Does it functionally undermine the craft? (Triumph fails here despite technique)

  For the new cases: 
  The standup comic's cruelty is inseparable from the craft - this feels like Triumph 2.0 where the meanness is the point. Likely "not good art."
  The songwriter case is tricky - the harm happens through the work but isn't in its content. Since Maya separates biography (Caravaggio), probably "good art" unless we see the songs as grooming tools.
  The documentary's fabrication is both in the work and deceptive by nature - similar to the cop thriller's flawed justification but more central. Leaning "not good art" due to craft-built deception.

  The core rule emerging is about whether immorality is structurally necessary and artistically integrated. Triumph/Lolita show that when evil is the engine, it sinks or swims the art based on execution. Whereas Cantos/Caravaggio prove separable elements don't contaminate. 

  For a tiebreaker case, imagine a photorealistic painting where the technical mastery lies in depicting illegal acts the artist committed for reference. Here the rules conflict: if we focus on work-internal elements (like Cantos) it might pass, but if we consider the necessary harm for creation (unlike Caravaggio) it fails. This should force Maya to clarify her position on art requiring real-world harm.
answer: |-
  ### Predictions  
  (1) The standup comic's act: **Not good art** – the cruelty is both integral and the core artistic device.  
  (2) The songwriter's album: **Good art** – the harm stems from external misuse, not the work’s content or design.  
  (3) The nature documentary: **Not good art** – the deception is central to the crafted sequence and undermines artistic truth.  

  ### Candidate Rules  
  **Rule 1 (Artistic Purpose):** *Immoral content invalidates the art only if it’s the work’s essential purpose.* (Triumph poisoned; Cantos/Caravaggio clean)  
  **Rule 2 (Harm Integration):** *The work’s morality matters only if harm is embedded in its structure or function.* (Cop thriller flawed; Lolita clean)  
  **Rule 3 (Creator Detachment):** *Artist biography is irrelevant unless the work is a direct tool of harm.* (Caravaggio clean; songwriter likely clean)  

  ### Best Fit  
  Maya is running **Rule 2 (Harm Integration)**. Triumph fails because its glorification of Nazism *is* its structural core—the craft serves immoral aims. Lolita succeeds because its "monster" is critically framed within the work’s design, making danger artistically functional. The cop thriller’s flaw (torture framed as necessary) is an artistic misstep because the narrative structure validates harm, unlike Cantos where fascist passages aren’t the poem’s engine.  

  Rule 2 explains case 2: the songs are *used* for grooming but aren’t *designed* to harm. Their artistic value resides in standalone content (like Caravaggio’s paintings), so she’ll separate art from misuse. Rule 1 struggles with Lolita (immoral purpose arguably central but redeemed by framing); Rule 3 can’t handle Triumph (no artist biography issue).  

  ### The Tiebreaker  
  **Case:** *A photorealistic painting series depicting illegal acts of violence. The artist committed the acts to capture "authenticity," and the technical mastery is universally praised.*  
  - **Rule 1 (Purpose):** **Not good art** – the immoral acts are essential to its purpose (authenticity via crime).  
  - **Rule 2 (Integration):** **Good art** – the harm (crimes) is external to the canvas; the work’s structure is observational, not endorsing.  

  **Test this with Maya:** If she condemns it, she prioritizes Rule 1. If she praises the technique, Rule 2 holds.  

  ---
  **Rationale for Ambiguity:** Case 2’s prediction hinges on Maya viewing the songs as *separate* from their misuse (Rule 2/3). If she considers the album a "grooming tool," it could fail—but her Caravaggio stance suggests she’ll compartmentalize. Triumph’s "ambiguity" is resolved by Rule 2: the craft serves poison, so it’s flawed *as art*. Documentary deception is structural (like cop thriller), hence flawed.
