  First, I need to identify the key points of contention. The user suspects it's about the definition of "locality" and possibly the applicability of Bell's theorem to QM without hidden variables. Let me break down the possible senses of locality they mentioned: Bell-locality (factorization), signal locality, no superluminal influence, Lorentz invariance. Each camp might be using different definitions. 

  Looking at Maudlin's side: they emphasize Bell's factorization condition as the core of locality. They argue that any theory predicting QM correlations must violate this, hence nonlocal. They dismiss "local realism" as a misleading term, insisting realism isn't a separate assumption. For them, QM's collapse is inherently nonlocal, so Bell just confirms that.

  On the Everettian side, they focus on the absence of causal influences. Since all outcomes exist, no signaling is possible, and the correlations are explained by the global state. They see Bell's theorem as only applying to hidden variable theories, not to unitary QM. Thus, Everett avoids nonlocality because no causal propagation is needed.

  The third group (signaling doesn't violate relativity) adds another layer, but the main clash is between the first two. The user’s hypothesis about unperformed measurements is crucial. Bell's theorem assumes that measurements have definite outcomes even when not performed (realism), but Everettians reject that, saying only the wavefunction exists. So, if Bell's theorem requires counterfactual definiteness, and Everett doesn't have that, then maybe it doesn't apply.

  Now, is this verbal or substantive? Both. The definitions of locality differ, leading to talking past each other. But there's a substantive issue: does Bell's theorem apply to interpretations without hidden variables? Maudlin argues yes because any theory must account for the correlations, regardless of hidden variables. Everettians say no because their framework doesn't assign values pre-measurement.

  The crux is whether a theory must satisfy Bell's premises (like factorizability) to be local. Maudlin says yes; Everettians say locality is about causal structure, not probability factorization. So, resolving this requires agreeing on what "locality" entails. A formal result clarifying the necessary conditions for locality could help, but entrenched positions might resist.

