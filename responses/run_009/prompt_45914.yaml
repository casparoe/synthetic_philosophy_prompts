  Where do the user and classmate likely disagree? Probably not physicalism itself, but whether PCS works (they accept it, user is skeptical) or the knowledge taxonomy (they might dismiss acquaintance as "not real knowledge"). The tetrachromat point suggests their intuition might overgeneralize. 

