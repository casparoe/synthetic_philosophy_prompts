  Hmm, their working hypothesis about credences secretly converging but disagreeing on belief thresholds feels... almost right but oversimplified. Like they've spotted something important but the reality is messier. The higher-order evidence angle is where things get properly substantive - that's not just semantics. And the perspective point is razor-sharp; I recall Kelly does emphasise the agent's standpoint while Elga's framing feels more external. 

