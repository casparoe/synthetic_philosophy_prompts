  We are designing a multi-stage in-class activity to illustrate the Gibbard-Satterthwaite theorem without naming it until the debrief. The goal is to have students experience the temptation to misreport and the difficulty of designing a strategy-proof rule.

  **Overall Structure:**
  1. **Stage 1:** Sincere voting (no communication) on a set of alternatives. Outcome is disliked by many.
  2. **Stage 2:** Allowed pre-ballot communication and strategic voting. Some visibly gain by lying.
  3. **Stage 3:** Small groups (constitutional committees) design an aggregation rule for 3+ alternatives that they believe is immune to strategic misreporting. Rival groups (adversaries) try to find a preference profile under which some voter gains by lying.

  **Payoff Scheme:**
  - The collective decision will be about the **order in which seminar topics are covered** for the rest of the term. The class must live with this order. This is a genuine choice with real but small stakes (no real money). Alternatively, it could be about the **weighting of assignments** (e.g., the relative weight of the final paper vs. participation, within a small range).

  **Materials:**
  - Whiteboard or projector to display alternatives and rules.
  - Index cards or slips of paper for voting (for secret ballot stages).
  - Timer.
  - Handout with instructions for each stage (including the payoff scheme and the rules of the game).
  - Flip charts or large paper for groups to write their designed rules.

  **Alternatives:**
  Let the alternatives be three seminar topics (or four, to make it more interesting). For example:
  - A: Climate Change and Social Choice
  - B: Fair Division and Cake Cutting
  - C: Voting Paradoxes and Arrow's Theorem
  - D: Algorithmic Fairness

  (Adjust to fit your actual seminar topics.)

  **Timeline (90 minutes total):**

  **Stage 1: Sincere Vote (15 minutes)**
  - (0-5 min) **Introduction:** Explain the payoff (the order of topics for the rest of the term) and the three (or four) alternatives. Tell students they are to vote sincerely (according to their true preferences) and that no communication is allowed. Distribute index cards for voting. Each student writes their ranking (or just their top choice if using plurality? But we want to set up for later strategic voting, so we should use a voting rule that is known to be manipulable, such as plurality or Borda, and we want to have a situation where the outcome is bad for many). 
    - *Voting Rule for Stage 1:* **Plurality voting** (each votes for one top choice). This is simple and known to be manipulable.
  - (5-10 min) **Vote and Tally:** Collect votes and tally on the board. Announce the winner. 
    - *Engineer the situation:* If the topics are equally liked, we might need to set up a scenario. Alternatively, you can assign preferences to the students to ensure that the outcome is disliked by many. But to keep it real, perhaps let them have their true preferences. However, if the class is large enough (18 students), we can hope that the distribution leads to an outcome that is not the Condorcet winner or that is disliked by a majority. If not, we might have to adjust on the fly. Alternatively, you can have a pre-arranged set of preferences by having them draw preference orders from a hat? But that might feel artificial. 
    - *Alternative plan:* Use a Borda count in Stage 1 and have a profile where the Borda winner is not the Condorcet winner and is disliked by a majority. But that might be complex. 
    - *Simplest:* Use plurality and have three alternatives. Suppose the class splits: 7 for A, 6 for B, 5 for C. Then A wins. If A is the least favorite of the B and C voters (which together are 11 out of 18), then many are unhappy. We can hope that the preferences are such that A is polarizing. But to ensure, we might have to assign preferences. 

    **Proposal for assigned preferences (to ensure the effect):**
    - Distribute preference orders on cards. For example:
        - Group 1 (7 students): A > B > C
        - Group 2 (6 students): B > C > A
        - Group 3 (5 students): C > B > A
    - Then under plurality: A wins with 7 votes. But the 11 students in groups 2 and 3 prefer both B and C over A. So many are unhappy.

  - (10-15 min) **Discussion:** Ask the class how they feel about the outcome. Point out that 11 out of 18 would have preferred either B or C over A. Note that the voting rule (plurality) led to this outcome.

  **Stage 2: Strategic Vote with Communication (20 minutes)**
  - (15-20 min) **Instructions:** Now tell the class that they will vote again on the same alternatives, but this time they are allowed to communicate before the vote. They can form coalitions and change their vote if they think it will lead to a better outcome. They are allowed to lie about their preferences. The voting rule is still plurality. They will have 5 minutes to discuss and then vote.
  - (20-25 min) **Discussion and Coalition Formation:** Students talk and try to form coalitions. The groups that prefer B and C might try to coordinate to vote for B (or C) to beat A. For example, the B and C groups might agree to all vote for B (if they prefer B over A and C over A, and they might have a common interest to defeat A). But note: in the assigned preferences above, group 2 (B>C>A) and group 3 (C>B>A) both prefer B over A and C over A. They might coordinate to vote for B (if they think B has a better chance) or for C? But group 3 (who prefer C>B) might be reluctant to vote for B. However, they might be convinced that if they split, A will win again. So they might agree to vote for B? Then the tally would be: A:7, B:6+5=11 -> B wins. 
    - Alternatively, group 3 might try to trick group 2: they might promise to vote for B but then vote for C? But that would be risky because then if group 2 votes for B and group 3 votes for C, we have A:7, B:6, C:5 -> A wins again. So they must trust each other.
    - The point is to show that strategic voting can pay off if they coordinate, but it requires trust and communication. Also, individuals might be tempted to free-ride or misreport.

  - (25-30 min) **Vote and Tally:** Collect votes and tally. Discuss the outcome and how it changed. Point out who gained by lying (if anyone). For example, if group 3 actually voted for B (even though they prefer C) and B won, then they are better off than when A won. But they had to misreport (vote for B instead of C). 

  **Stage 3: Constitutional Design and Adversarial Testing (45 minutes)**
  - (30-35 min) **Group Formation and Instructions:** 
    - Divide the class into 3 or 4 small groups (about 4-5 students each). Each group is a "constitutional committee" tasked with designing a voting rule (for 3 or more alternatives) that they believe is immune to strategic misreporting (i.e., no voter can ever gain by lying about their preferences). 
    - Also, assign each group to be an adversary for one other group (rotate). The adversary's job is to try to find a preference profile and a voter who can gain by misreporting their preferences under the rule designed by the other group.
    - Give them 20 minutes for design and testing.

  - (35-55 min) **Design and Testing:** 
    - Committees design their rule (they must write it down clearly). 
    - Adversaries get the rule and try to think of a profile and a voter who can manipulate. They can ask the committee to run the rule on a profile they propose. The committee must run the rule and then the adversary can see if by having one voter lie, the outcome changes to one the liar prefers.
    - Rules must satisfy:
        - Unrestricted domain: any ranking of the alternatives is allowed.
        - The rule must produce a single winner (or a ranking? but to keep it simple, we can have a single winner).
    - Each committee should also test their own rule.

  - (55-70 min) **Presentation and Challenge:** 
    - Each committee presents their rule. Then the adversary group presents a challenge (a profile and a manipulation if they found one). The class discusses.
    - If no manipulation is found, the committee claims their rule is strategy-proof.

  - (70-75 min) **Wrap-up the activity:** Note that no group has likely created a rule that is both non-dictatorial and strategy-proof for all profiles. But we will discuss in the debrief.

  **Debrief (15 minutes):**
  - (75-90 min) **Structured Discussion:**
    1. **Recap the activity:** 
       - Stage 1: We saw an outcome that many disliked under sincere voting.
       - Stage 2: With communication, we saw that by misreporting (voting strategically) some were able to get a better outcome.
       - Stage 3: We tried to design rules that would prevent such manipulation, but every rule presented was either broken by the adversaries or had a special feature.

    2. **Map to the theorem:**
       - We were working with at least three alternatives (condition of the theorem).
       - The "unrestricted domain" assumption: our rules had to accept any preference ordering (and we did that by not restricting what preferences voters could have). This is a key assumption that the committees were silently granted.
       - The two escape hatches they discovered:
          - **Dictatorship:** One group might have proposed a rule that designates one person as the dictator (always chooses the dictator's top choice). This is strategy-proof (the dictator has no incentive to lie, and others cannot change the outcome) but obviously not democratic.
          - **Collapsing the set of outcomes:** Another group might have proposed a rule that only ever selects from two alternatives (e.g., only A and B are ever considered, ignoring C). Then we are effectively in a two-alternative world. But note: the theorem requires at least three alternatives that are all possible outcomes.

    3. **The Theorem (now name it):** The Gibbard-Satterthwaite theorem tells us that if we have a voting rule that:
          - has unrestricted domain,
          - selects one winner from at least three alternatives,
          - and is not a dictatorship (i.e., there is no dictator whose top choice is always selected),
       then it cannot be strategy-proof. That is, there will always be at least one profile where at least one voter can gain by misreporting.

    4. **Clarify what the activity did not show:**
        - We tested a few profiles. But the theorem says that for every non-dictatorial rule (with unrestricted domain and ≥3 alternatives), there exists at least one profile where manipulation is possible. We did not (and could not) test all profiles. Therefore:
            - Just because no one found a manipulation for a rule in our activity does not mean that the rule is strategy-proof. It might be that we didn't look hard enough or the adversaries didn't find the right profile.
            - Also, note that the theorem does not say that every profile is manipulable. It only says that there is at least one profile that is manipulable.

    5. **Address predictable problems:**
        - **Adversaries found only manipulations requiring implausible coordination?** 
            - In the theorem, manipulation is by a single voter. The adversaries were allowed to have one voter lie. But sometimes they might have proposed a profile that requires multiple voters to lie? Clarify that the manipulation must be by a single voter.
            - If the adversaries found a manipulation that requires coordination, that's not what we are looking for. We want one voter who, by changing only their own vote, gets a better outcome. So in the activity, remind adversaries to look for single-voter manipulations.
        - **A committee confuses "nobody found a manipulation" with "there is no manipulation"**:
            - This is exactly the point to emphasize: absence of evidence is not evidence of absence. We only tested a few profiles. The theorem tells us that for any non-dictatorial rule, there exists a profile (somewhere in the vast space of profiles) that is manipulable. So we can never be sure by testing a few.
        - **Participants sulking over the payoff**:
            - Remind them that the stakes were small and the purpose was pedagogical. Also, the outcome (topic order) is fixed, so they must live with it. But note: the activity might have changed the order from what they would have gotten sincerely? That's part of the lesson.

  **Predictable Problems and Handling:**
  1. **Stage 1:** The sincere vote might not produce an outcome that many dislike. 
     - *Handling:* Assign preferences (as described) to ensure the effect. If you don't want to assign, have a backup plan: if the outcome is liked by most, then you can still proceed to Stage 2 by saying "But imagine if the outcome had been one that many disliked. How might you try to change it?"

  2. **Stage 2:** The strategic vote might not lead to a different outcome. 
     - *Handling:* In the assigned preferences, it's clear that if groups 2 and 3 coordinate on B, then B wins. But if they fail to coordinate, A wins again. So you might need to facilitate the communication to ensure coordination happens. Alternatively, if they don't coordinate, then you can point out that without trust, strategic voting might not work.

  3. **Stage 3:** 
     - Committees might design a rule that is too complex or not well-defined. 
       - *Handling:* Encourage simplicity and provide examples (plurality, Borda, Condorcet method, etc.) but they are free to invent. Also, have a TA or yourself circulate to help clarify.
     - Adversaries might not find a manipulation even if one exists. 
       - *Handling:* This is expected. In the debrief, you will explain that the theorem guarantees the existence of a manipulation even if we didn't find it.
     - Committees might propose a dictatorship or a rule that only considers two alternatives. 
       - *Handling:* That's good! They found the escape hatches. Then in the debrief, you can point out that these are the only ways out.

  4. **Time Management:** The activity is tight. 
     - *Handling:* Be strict with time. Use a timer and cut off when needed.

  **What the Activity Cannot Show:**
  - The universal claim (that every non-dictatorial rule has at least one manipulable profile) cannot be experienced by testing a few profiles. We must assert it in the debrief.
  - The distinction between "some manipulable profile" and "every profile is manipulable" is crucial and must be emphasized.

  This activity should create the desired arc: temptation to misreport, then exhaustion of trying to design a rule that removes the temptation, and finally the intellectual satisfaction of understanding the theorem as a fundamental limitation.
answer: |-
  ### In-Class Activity: The Temptation to Manipulate and the Impossibility of Perfect Rules  
  **Objective:** Students experience strategic voting incentives and the challenge of designing strategy-proof voting rules, setting the stage for understanding the Gibbard-Satterthwaite theorem.  
  **Stakes:** The class will decide the **order of seminar topics** for the rest of the term (e.g., topic sequence: "Voting Paradoxes" → "Fair Division" → "Algorithmic Fairness"). This decision is binding but low-stakes.  

  **Materials:**  
  - Whiteboard/projector (display alternatives, rules, profiles)  
  - Voting slips (for secret ballots)  
  - Timer  
  - Handout: Instructions for each stage + preference profile examples  
  - Group worksheets (for constitutional committees)  

  **Alternatives:** Three topics (minimal for the theorem):  
  - **A** = Climate Justice Policies  
  - **B** = AI and Fairness  
  - **C** = Wealth Inequality  

  ---

  ### Minute-by-Minute Timeline (90 Minutes Total)  

  #### **Stage 1: Sincere Vote & Undesirable Outcome** (20 minutes)  
  - **0–5 min**: Introduce the stakes. Explain: "Today, we collectively decide the order of our next three topics. Vote sincerely—no strategizing." Display alternatives A, B, C.  
  - **5–10 min**: **Vote:** Students rank alternatives on slips (1st, 2nd, 3rd). Use **Borda count** (3 pts for 1st, 2 for 2nd, 1 for 3rd) to ensure a manipulable rule.  
  - **10–15 min**: Tally votes publicly. *Engineer an unpopular outcome:*  
    - *Example profile (pre-assign if needed):*  
      - 8 voters: A > B > C (A=24 pts)  
      - 6 voters: B > C > A (B=18 pts)  
      - 4 voters: C > B > A (C=12 pts)  
    - **Outcome:** A wins (50 pts total). B is the Condorcet winner (14 prefer B > A), so many are dissatisfied.  
  - **15–20 min**: Discuss discontent: "Who is unhappy? Why? Is there a better outcome?" Highlight that Borda count ignored majority preferences.  

  #### **Stage 2: Strategic Voting & Visible Gains** (25 minutes)  
  - **20–25 min**: Reset. Announce: "Now, discuss openly for 5 minutes. Form coalitions, trade promises—then revote. Goal: Get a better outcome for yourself."  
  - **25–30 min**: Open lobbying. *Predictable behavior:*  
    - B-supporters (6 voters) lobby C-supporters (4): "Join us to beat A! Rank B first, C second!"  
    - A-supporters may offer concessions (e.g., "We’ll support C in a future vote").  
  - **30–35 min**: **Revote:** Same Borda count. New votes:  
    - All 6 B-supporters vote B > C > A (B=18 pts).  
    - 3 C-supporters "betray": Vote B > C > A (B=9 pts).  
    - 1 C-supporter votes sincerely: C > B > A (C=3 pts).  
    - A-supporters: Unchanged (A=24 pts).  
  - **35–40 min**: Tally: B wins (18+9=27 pts). C has 3+4=7 pts (from 1 sincere + 3 partial). A=24 pts.  
  - **40–45 min**: Discuss: "Who gained? Who lied? Why?" Show the 3 C-supporters who ranked B first avoided A (worst outcome) and got B (better than A). Point out: **Lying paid off.**  

  #### **Stage 3: Constitutional Design & Adversarial Testing** (40 minutes)  
  - **45–50 min**: Divide into **3 committees** (6 students each). Task: "Design a voting rule for A/B/C that is immune to strategic lying. It must:  
    - Allow any voter preferences (unrestricted domain).  
    - Produce a single winner (no ties).  
    - Be non-dictatorial (no fixed voter always decides)."  
  - Assign **adversaries**: Each committee tests another group’s rule.  
  - **50–65 min**: **Design phase (15 min):** Committees brainstorm rules (e.g., "Condorcet method," "Approval voting," "Modified Borda"). *Common proposals:*  
    - "Ignore third place—only 1st/2nd matter."  
    - "Rotating dictator: One voter picks per week."  
    - "Two-stage runoff: Top two face off."  
  - **65–75 min**: **Testing phase (10 min):**  
    - Committees present rules on whiteboard.  
    - Adversaries propose a preference profile and identify a voter who could gain by lying. Committees run the rule to check.  
    - *Example test:* Adversaries propose profile:  
      - 2 voters: A > B > C  
      - 1 voter: B > C > A  
      - Rule: "Plurality, but if tie, B wins."  
      - Test: Sincere outcome? Adversary asks: "Can the B > C > A voter lie and vote C first to force a tie (so B wins) instead of A winning?"  
  - **75–85 min**: **Report & Challenge:** Each committee: (1) Explains rule, (2) Admits if adversaries found manipulation. *Expected outcomes:*  
    - All non-dictatorial rules fail (adversaries find a manipulation).  
    - "Escape hatches" emerge: Dictatorship or restricting to two options (e.g., "Always ignore C").  

  ---

  ### Closing Debrief (5 Minutes)  
  **Map the Activity to the Theorem (Unnamed until now):**  
  > "Today we felt the tension in collective decision-making. Let’s crystallize what we learned:  
  > **1. Unrestricted Domain (Assumption):** Your committees designed rules allowing *any* preferences—no matter how 'unreasonable.' This freedom is key: it forces rules to handle all scenarios.  
  > **2. Three-or-More Alternatives (Condition):** We used three topics (A/B/C). With two, majority vote works—but add a third, and manipulation becomes inevitable.  
  > **3. The Escape Hatches You Found:**  
  > - *Dictatorship:* Some groups 'solved' manipulation by letting one voter decide. This is immune to lying—but violates democracy.  
  > - *Collapsing Outcomes:* Others restricted choices (e.g., 'Ignore C'). But this reduces three alternatives to two—avoiding the problem, not solving it.  
  >  
  > **This is the Gibbard-Satterthwaite Theorem:** Any voting rule with unrestricted domain and ≥3 alternatives is either:  
  > - **Manipulable** (someone can gain by lying),  
  > - **Dictatorial** (one voter decides everything), or  
  > - **Not surjective** (some outcomes can never win, like ignoring C).  
  >  
  > **Crucial Distinctions:**  
  > - The theorem says *some profile exists* where manipulation is possible—not that *every profile* is manipulable. Your adversaries only needed to find one!  
  > - If adversaries *failed* to find manipulation, it doesn’t mean your rule is strategy-proof. You only tested a few profiles—but the theorem guarantees a bad profile *exists* for non-dictatorial rules."  

  ---

  ### Predictable Problems & Solutions  
  1. **Problem: Adversaries find only complex manipulations requiring coordination.**  
     - *Solution:* Intervene during testing: "Focus on single-voter lies. Can one person change the outcome alone?"  

  2. **Problem: Committees claim "no manipulation found = strategy-proof."**  
     - *Solution:* In debrief, stress: "Testing 3 profiles ≠ proof. The theorem says a bad profile *exists*, even if hidden."  

  3. **Problem: Participants sulk over the topic order outcome.**  
     - *Solution:* Pre-empt: "This is pedagogy, not punishment! We’ll revisit topic order if rules feel unfair."  

  4. **Problem: Committees design overly complex rules, wasting time.**  
     - *Solution:* Cap design time at 10 min. Provide examples: "Condorcet: Pairwise comparisons; Borda: Points for ranks."  

  5. **Problem: Adversaries struggle to invent profiles.**  
     - *Solution:* Distribute handout with sample profiles (e.g., Condorcet cycles, divided majorities).  

  ### What the Activity Cannot Show (Clarify in Debrief)  
  - **Universal Claims:** Students tested 1–3 profiles per rule. They *did not* experience the theorem’s core: *Every* non-dictatorial rule *must* have ≥1 manipulable profile. You must assert this.  
  - **Strategy-Proofness ≠ Non-Manipulability in Practice:** A rule can be manipulable but rarely manipulated in real life (e.g., Borda count). The theorem is about theoretical possibility.  

  **Final Note:** Withhold the theorem’s name until the debrief. The activity’s frustration—designing rules only to watch them fail—mirrors the field’s historical struggle, making the theorem a profound revelation.
