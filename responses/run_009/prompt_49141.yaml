prompt: |-
  I'm a PhD student in economic history, and my thesis chapter on the Great Divergence keeps getting stuck in a way I'd like help diagnosing rather than adjudicating. The debate I mean is the one opened in earnest by Pomeranz's The Great Divergence around 2000 and its aftermath: whether the economic divergence between Britain (or northwest Europe) and China was late and contingent — turning on coal's location and New World resources, with the Yangzi delta and the European core comparably developed until roughly the eighteenth century — or early and structural, rooted in differences going back centuries in institutions, scientific culture, or the competitive state system. What I've noticed is that the argument has stopped moving even as the data has improved: the real-wage and GDP-series work of the past twenty years gets contested line by line, the two camps each have a story about why the other's numbers are built on false commensurability, and nobody appears to have changed their mind since roughly the mid-2000s.

  My question is what kind of disagreement this actually is, and I have a hypothesis I want tested rather than endorsed. Philosophers of science sometimes analyse explanation as contrastive: a "why" question always carries an implicit contrast class, so "why did Britain industrialise first?" and "why did China not industrialise first?" are different questions that can license different explanations even from a shared set of facts. It strikes me that the divergence debate might be a disguised instance of this. The contingency camp seems to be answering "why did the Industrial Revolution happen where the coal was, rather than somewhere else?" while the structural camp is answering "why was England, as a whole and over centuries, on a different trajectory from China, as a whole?" — and when they argue, they fight about the unit and period of comparison (the Yangzi delta versus England; the whole of China versus the whole of Europe; divergence dated to 1700 or to 1800) precisely because each framing is what makes their own question answerable.

  So: is my diagnosis right, in whole or in part, and where does it go wrong? Consider seriously the alternatives — that this is a genuine empirical dispute about dating and magnitudes that better price and wage series could in principle settle; that it is a dispute about standards of evidence, where the two camps disagree over what counts as a relevant comparison rather than over any fact; that the sides are divided over the legitimacy of different levels of explanation, proximate resource geographies versus ultimate institutional causes, and are fighting about which level "really" explains; or that the Needham-style question — why Europe and not China? — is simply ill-posed, smuggling in an assumption that China is the natural counterfactual Britain against which Britain must be explained, when no such privileged comparison exists. Note that answering this requires saying something about what each camp actually claims and how their arguments bite, not just labelling them. And be honest about what would count as progress under your diagnosis: a new dataset, a change in how the question is posed, a formal distinction between the kinds of explanations each side offers, or nothing at all and why. If part of the disagreement turns out to be merely verbal, identify which part, and try to restate the residue that is not.
reasoning: |-
  Okay, let me approach this systematically. The user is a PhD student in economic history struggling with a theoretical impasse in the Great Divergence debate. Their core insight is that the Pomeranz vs. structuralists deadlock might stem from fundamentally different contrastive questions being asked. 

  First, I need to validate their hypothesis against the literature. The user's observation about "disguised contrastive explanations" is sharp - Pomeranz does emphasize "why here (Britain) and not there (Yangzi)" with coal/colonies as differentia, while institutionalists like Landes ask "why this whole system (Europe) and not that one (China)" over centuries. The user's framing explains why they argue past each other on spatiotemporal scales.

  But I should test alternatives. Is it really just empirical? No - both sides acknowledge each other's data but reinterpret it. Standards of evidence? Partly, but deeper. Levels of explanation? Important, but not the root. The Needham question critique? Valid but doesn't resolve the core issue. 

  Where the user might be underestimating: 1) Institutionalists do address "why Britain specifically" via property rights etc., complicating the clean contrast; 2) The unit problem isn't just about contrast classes - it's ontological (what constitutes an economic unit). 

  For progress: We need explicit framing choices first. When presenting research, the user should state "This answers why X rather than Y" upfront. Formalizing the contrast classes could defuse disputes. New data alone won't help without this clarity. 

  The verbal trap is "divergence" itself - it means different things temporally and spatially to each camp. The real residue is about causal primacy: do contingent factors override deep structures? That requires mechanism studies, not just comparisons. 

  Suggestions: The user could design research that tests specific mechanisms (e.g., how coal locations interacted with pre-existing institutions) rather than general "why Europe/China" questions. Also, studying near-misses (Japan, Netherlands) might bypass the binary trap.
answer: |-
  Your diagnosis is perceptive and largely correct—the Great Divergence debate *is* fundamentally a clash of **contrastive questions** masked by disputes over units, timing, and methodology. However, this isn't the *sole* driver; it interacts with deeper disagreements about causality and evidence. Let's dissect your hypothesis against the alternatives:

  ### 1. **Your Contrastive Explanation Hypothesis: Correct Core Insight**
     - **Contingency Camp (Pomeranz, Parthasarathi, etc.)**:  
       - **Implicit Question**: "Why did industrialization occur in *Britain specifically* rather than in other *similarly advanced core regions* (e.g., Yangzi Delta)?"  
       - **Contrast Class**: Advanced Eurasian cores (Yangzi vs. Britain) ~1750.  
       - **Unit/Period**: Regional, late 18th century. Favors wage/GDP parity evidence (e.g., Allen's "high-wage economy" thesis, Li Bozhong's Yangzi data).  
       - **Why they dismiss structural arguments**: If cores were equal, "ultimate" causes (e.g., medieval property rights) are irrelevant to the *proximate* divergence trigger (coal + colonies).

     - **Structural Camp (Mokyr, Landes, Acemoğlu et al.)**:  
       - **Implicit Question**: "Why did *Europe as a system* develop sustained growth when *China as a system* did not?"  
       - **Contrast Class**: Continental civilizational trajectories (Europe vs. China) 1500–1800.  
       - **Unit/Period**: Macro-institutional, *longue durée*. Favors institutional/scientific differences (e.g., Royal Society vs. Qing bureaucracy).  
       - **Why they dismiss wage parity**: Even if Yangzi matched London in 1750, it reflects static efficiency, not dynamic capacity for innovation *at the system level*.

     - **Where Your Diagnosis Excels**:  
       - Explains why **unit/period disputes are non-negotiable**: Accepting Pomeranz's unit (Yangzi) makes coal decisive; accepting Mokyr's unit (Europe vs. China) makes institutions decisive.  
       - Clarifies why **data improvements don't resolve debates**: Each camp uses data to answer *their* question. E.g., wage parity validates Pomeranz's contrast but doesn't refute Landes' point about Europe's scientific infrastructure.

  ### 2. **Where Your Diagnosis Needs Nuance**
     - **Not Purely Contrastive**: The camps *also* disagree on **causal mechanisms**. Contingency theorists see coal/colonies as *necessary* breaks from a Malthusian ceiling; structuralists see them as *contingent accelerants* of deeper advantages (e.g., Europe could have innovated without coal, albeit slower).  
     - **The "Ill-Posed Needham Question" Alternative**: Yes, "Why Europe not China?" risks Eurocentrism, but both camps *do* treat China as the primary counterfactual. The deeper issue is **teleology**: Structuralists risk "reading backward" from divergence (e.g., glorifying the Glorious Revolution), while Pomeranz risks treating 1750 parity as evidence that divergence *must* be late/contingent.

  ### 3. **Other Disagreement Layers**
     - **Standards of Evidence**:  
       - Contingency camp requires **tight counterfactuals** (e.g., "Had China had coal, it would have industrialized").  
       - Structuralists accept **plausible mechanism-based narratives** (e.g., "Competitive states ➔ warfare ➔ fiscal-military efficiency ➔ growth").  
       - Result: They disagree on whether wage/GDP data can *ever* settle "capacity" (structural) vs. "outcome" (contingency).
     - **Levels of Explanation**:  
       - Proximate (coal) vs. Ultimate (institutions) is real, but **not symmetrical**. Contingency theorists reject ultimate causes as irrelevant to the *timing/location*; structuralists see proximate factors as insufficient without prior conditions.

  ### 4. **Verbal vs. Substantive Disputes**
     - **Verbal**: "Divergence" itself is ambiguous. Is it wage divergence (1700s)? Industrial takeoff (1800)? Cumulative GDP gap (post-1820)?  
     - **Substantive Residue**:  
       - **For Contingency**: Could China's core *have* industrialized given coal/colonies? (i.e., were its institutions *compatible* with growth?)  
       - **For Structural**: Why did Britain industrialize *first* even within Europe? (i.e., are contingent factors still necessary within a "favorable" system?)

  ### 5. **Pathways to Progress**
     - **Not Data Alone**: Better wage/GDP series (e.g., Broadberry, Xu et al.) get absorbed into existing frameworks. Contingency scholars note Yangzi’s falling wages post-1750; structuralists note Europe’s *rising* scientific output pre-1750.  
     - **Reframe the Questions Explicitly**:  
       - Shift from "Why Europe not China?" to **"Under what conditions do advanced organic economies transition to industrialization?"** This forces both camps to engage with *multiple* cases (e.g., why not Japan? India? Ottoman Empire?).  
     - **Formalize Contrast Classes**:  
       - Specify: "I am explaining why A happened *here* (Britain) rather than *there* (Yangzi)" vs. "Why A happened *in this system* (Europe) rather than *that system* (China)."  
     - **Test Mechanisms, Not Outcomes**:  
       - E.g., Did Europe’s institutions *actually* enable faster adoption of Chinese innovations (e.g., gunpowder, printing)? Did New World resources *only* matter because of pre-existing British property rights?  
     - **Acknowledge Asymmetry**: The Industrial Revolution was a low-probability event. Contingency explains its *specificity*; structuralism explains the *asymmetric distribution of preconditions*.

  ### Conclusion
  Your diagnosis is 80% correct: **The core deadlock arises from unstated contrastive questions driving incompatible units/periods of analysis**. The residue is a mix of **causal mechanism disputes** (coal as necessary vs. sufficient) and **epistemic standards** (narrative vs. counterfactual evidence). Progress requires:
  1. **Explicit framing of contrast classes** in research questions.
  2. **Mechanism-focused comparative studies** (e.g., textile innovation in India vs. Britain; state capacity in France vs. Qing China).
  3. **Abandoning "Why Europe not China?"** for **"When/where do organic economies overcome growth constraints?"**  

  This won’t end the debate but could transform it from a stalemate into a framework for testing distinct hypotheses. As a PhD student, your leverage is to *use* this insight: Position your chapter as diagnosing these implicit questions, then apply a consistent contrastive lens to your evidence (e.g., "I ask why Lancashire had cheaper cotton than Songjiang, not why Europe 'had' colonies and China did not"). That alone would be a methodological contribution.
