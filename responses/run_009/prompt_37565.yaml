answer: |-
  Right, let's have a proper go at this. That blog post summary captures the *spirit* of Lewis's triviality results but mangles the specifics and draws overly strong conclusions. A philosopher working on conditionals (especially indicative ones like your AGI example) would raise several eyebrows. Let's break it down bit by bit, in good British English:

  1.  **"Lewis proved back in the seventies that indicative conditionals can't have probabilities."**
      *   **Wince/Fair with Caveats:** This is the *conclusion* Lewis argued for, based on his triviality results, but it's highly contentious, not universally accepted fact. Many philosophers (e.g., Ernest Adams, Dorothy Edgington, Frank Jackson) *do* think indicative conditionals have probabilities – they just argue these probabilities aren't *truth-conditional* probabilities (i.e., they aren't probabilities of the conditional proposition being *true*). They embrace Adams' Thesis (`P(If A, then C) = P(C|A)`) as *defining* the probability of the conditional, rejecting that it expresses a standard proposition with a truth value. Lewis aimed to show this leads to absurdity if you *also* assume conditionals are ordinary propositions.

  2.  **"The idea he was attacking — called Adams' Thesis, and it seems obviously right on its face — is that the probability of an 'if' statement should equal the conditional probability of the consequent given the antecedent."**
      *   **Accept:** This is spot on. Adams' Thesis (or Equation) is the core target. It *does* seem intuitively compelling for many indicative conditionals. Lewis wasn't attacking its intuitive plausibility, but its compatibility with the idea that conditionals are truth-conditional propositions within standard probability theory.

  3.  **"Lewis showed that if you insist on this, the only way it can work is if nothing anywhere has a probability strictly between 0 and 1 — everything has to be either certainly true or certainly false."**
      *   **Wrong/Misleading Garbling:** This is the crucial mangling. Lewis **did not** show that Adams' Thesis *requires* all probabilities to be 0 or 1 **within a single probability function**. What he *actually* showed (in his 1976 paper "Probabilities of Conditionals and Conditional Probabilities") is far more subtle and devastating *for the project of assigning truth conditions*:
          *   **The Core Result:** Assume two things: (A) Indicative conditionals (A → C) express propositions with truth values. (B) Adams' Thesis holds universally: `P(A → C) = P(C|A)` for *all* propositions A, C and *all* probability functions P (or at least a very wide class of them).
          *   **The Contradiction:** Lewis proved that (A) + (B) lead to absurd consequences. The most famous is that they imply `P(C|A) = P(C)`. That is, A and C must be probabilistically independent *for all A, C, and all probability functions P*. This is blatantly false (think "If I roll a fair die, it lands on 1" - `P(1|roll) = 1/6`, `P(1) = 1/6`, true here, but "If I roll a fair die, it lands even" - `P(even|roll) = 1/2`, `P(even) = 1/2`, true here, but "If I roll a 1, it lands even" - `P(even|1) = 0`, `P(even) = 1/2`, false! Independence doesn't hold universally).
          *   **The "Triviality":** The *only* way to avoid this contradiction while holding onto (A) and (B) is if the probability algebra is so impoverished that conditional probabilities `P(C|A)` are *only* defined when `P(A) = 1` or `P(A) = 0`. That is, you can only condition on things that are certainly true or certainly false. This makes conditional probability trivial and useless. Crucially, this is a result about the *impossibility of (A)+(B) holding across different probability functions or for a sufficiently rich algebra*. It doesn't say that *within one specific P*, everything must have probability 0 or 1. It says the *framework* for having propositional conditionals satisfying Adams' Thesis for all/many A,C and P collapses unless the whole probability space is trivial.

  4.  **"Since that's absurd, conditionals just aren't the sort of thing that can be more or less likely..."**
      *   **Contentious Philosophical Stance:** This is Lewis's *preferred conclusion* (rejecting (A)), but it's not forced by the theorem *alone*. The theorem forces a **dilemma**: either
          *   (i) Conditionals aren't propositions (reject (A)), OR
          *   (ii) Adams' Thesis doesn't hold universally (reject (B)).
          Lewis chose (i). But others, like Adams and Edgington, also choose (i) but *still* assign probabilities to conditionals! They say `P(If A, C)` *is defined* as `P(C|A)`, but this probability isn't the probability of a truth; it's a measure of *assertability*, *acceptability*, or *your conditional degree of belief*. Jackson chose (i) but gave conditionals *special* truth conditions that make `P(If A, C)` *close* to `P(C|A)` in many contexts. Yet others explore weakening (B) (e.g., holding only for a *single* fixed P, though this faces other problems).

  5.  **"...which is also why Bayesians treat 'if' statements as inference rules or dispositions rather than claims..."**
      *   **Overgeneralisation / Partly Fair:** Many Bayesians (especially those influenced by de Finetti or the operationalist/decision-theoretic tradition) *do* lean towards treating conditionals as guides to belief revision or "inference tickets" rather than factual claims. This *is* one major response to the triviality results (aligning with option (i) above). However:
          *   It's not the *only* Bayesian response (Jackson's approach is also Bayesian).
          *   Calling them "dispositions" is a bit vague here – it might point towards assertability or acceptance conditions.
          *   It's a *philosophical choice* motivated by the problems Lewis highlighted, not something the theorem *directly* states. The theorem shows a problem with treating them as ordinary claims *if* you want Adams' Thesis; this is one way out.

  6.  **"...and why you can never coherently bet on an 'if'."**
      *   **Mostly Wrong / Misleading:** This is the easiest bit to refute based on everyday practice, as you suspected.
          *   **The Core Problem:** If a conditional `A → C` isn't a factual proposition with a determinate truth value *in all circumstances* (especially when A is false), then you can't define a simple bet that pays out £1 if `A → C` is true, £0 if false. What happens if A is false? Is the conditional "vacuously true"? False? Indeterminate? This ambiguity makes a straightforward bet on its *truth value* problematic.
          *   **How People Actually Bet on "If":** People bet on conditionals *all the time* by betting *on the consequent conditional on the antecedent*. The coherent way to bet on "If A, then C" is:
              *   The bet is called off (stakes returned) if A turns out false.
              *   If A turns out true, you win if C is true, lose if C is false.
          *   **Connection to Adams' Thesis:** The *fair betting odds* for this conditional bet are *exactly* given by `P(C|A)`. If you think `P(If A, C) = P(C|A)`, this *is* the coherent way to bet on it. Adams and others argue this *is* what we mean by betting on the conditional. Lewis's result shows you *can't* coherently bet on it *as if it were an ordinary proposition with a standard truth value in all cases*, but you absolutely *can* (and do) bet on it using this conditional betting structure. The blog confuses betting on a conditional *as a proposition* with conditional betting *on the consequent given the antecedent*.

  **Your Specific Queries Answered:**

  *   **"Nothing between 0 and 1" thing:** It's a garbled version. Lewis showed that **conditional probability becomes trivial** (only defined for certainties) if you insist on conditionals being propositions obeying Adams' Thesis universally. He didn't show all *unconditional* probabilities must be 0 or 1.
  *   **One probability function or all?:** This distinction **matters crucially**. Lewis's strongest results show the incompatibility when Adams' Thesis is assumed to hold for a **wide class of probability functions** (or for all pairs A,C within a sufficiently rich algebra under one P). Some have explored weakening this, but holding it for just *one fixed P* faces significant hurdles (like "import-export" principles failing badly).
  *   **Is "p(if X, Y) = 20%" always meaningless?** **No.** The comment-section conclusion is too strong. Here's the sensible reading that survives:
      *   It *is* problematic if you interpret `If X, Y` as an ordinary proposition with a standard truth value within standard probability theory (thanks to Lewis).
      *   However, it is **perfectly meaningful and coherent** if you interpret it as **`P(Y | X) = 0.2`**. This is the reading championed by Adams, Edgington, and many others. On this view, "p(if X, Y) = 20%" is simply *shorthand* for assigning a conditional probability of 0.2 to Y given X. This captures the intuitive force of Adams' Thesis without committing to the conditional being a standard proposition. This is how most sophisticated Bayesians actually use such expressions in practice, especially when discussing uncertain hypotheses. Your AGI example makes perfect sense interpreted this way: your *degree of belief* that we're all dead, *given that* we get AGI by 2030, is 0.2.

  **In Summary for the Comment Section:**

  Lewis's triviality results are genuine and profound. They show you cannot consistently treat indicative conditionals *as ordinary propositions with truth conditions* while also insisting that their probability *always* equals the corresponding conditional probability. This forces a choice.

  However, the claim that "conditionals can't have probabilities" is Lewis's preferred choice, not an inevitable consequence. Many philosophers and Bayesians **do** assign probabilities to conditionals by **defining** `P(If A, C)` as `P(C|A)`, abandoning the idea that conditionals express standard truth-conditional propositions. On this view, "p(if X, Y) = 20%" is not only meaningful, it's equivalent to and best understood as "P(Y | X) = 0.2". The betting argument against it fails because there *is* a coherent way to bet on conditionals – the conditional bet – whose fair odds are given precisely by that conditional probability.

  So, while the pedant can correctly say "`If X, Y` isn't a proposition suitable for unconditional betting on its truth value", in the context of rationalist forums and everyday reasoning, writing "p(if X, Y) = 20%" as shorthand for a conditional probability is perfectly sensible and common practice amongst those familiar with the literature. Lewis's result shows *why* we need to be careful about interpreting what that "p" means, not that we can't use the expression coherently. The real takeaway is subtlety, not prohibition. Now, go forth and argue with slightly better ammunition!
