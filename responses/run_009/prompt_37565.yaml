  First, I need to recall Lewis's triviality results. From what I remember, Lewis showed that if you assume the probability of "if A then C" equals P(C|A) for all cases, it leads to contradictions unless probabilities are only 0 or 1. The user is suspicious about the blog's claims, especially treating conditionals as rules and the betting part.

  The user mentions the blog's summary: Lewis proved indicative conditionals can't have probabilities because that would require all probabilities to be extreme. They question if this is accurate. I should check the actual theorem. Lewis's 1976 paper demonstrated that under Adams' Thesis, you get absurd results like P(C|A) = P(C), which can't hold generally. So the "nothing between 0 and 1" part is a misinterpretation. The result is about the impossibility across all probability distributions, not within one.

  The user is also doubtful about the implications—treating conditionals as inference rules and the betting claim. Philosophers like Adams and Edgington do advocate for probabilistic semantics without truth values. And people bet on conditionals all the time, which suggests the blog's claim might be overstated. The key is that while you can't bet on the conditional itself as a proposition, you can design bets that reflect conditional probability.

  The user wants to know if "p(if X, Y) = 20%" is meaningless. The answer is nuanced. Under Lewis's result, it can't be a standard proposition, but it can represent P(Y|X) = 0.2. So in everyday contexts, it's meaningful as long as we interpret it correctly.

  I need to address each part of the blog's summary bit by bit. Point out where it's correct (Lewis's triviality), where it's misleading ("nothing between 0 and 1"), and where it's wrong (betting impossibility). Also, clarify that the conclusion about conditionals not having probabilities is one response, but there are other approaches like Adams'.

  The user's deeper need might be to resolve forum arguments. They want a clear understanding to articulate why people can use p(if X, Y) informally, even if it's not technically a proposition. Emphasizing the practical vs. technical distinction would help.

