answer: |-
  Below is the complete exam question package designed to rigorously test conceptual understanding of moral trade. The scenario forces engagement with the machinery while isolating key insights.

  ---

  ### (1) Exam Question Text (25 marks total)
  **Scenario:** A nonprofit board has two members with distinct moral values. Amara cares *only* about far-future human welfare; Bo cares *only* about animal welfare. The board makes two annual decisions:  
  - **Domain 1 (Research Project):** Controlled *solely* by Amara. Options:  
    - **X-risk institute** (Amara: 10 utils; Bo: 2 utils)  
    - **Wild-animal lab** (Amara: 8 utils; Bo: 10 utils)  
  - **Domain 2 (Campaign):** Controlled *solely* by Bo. Options:  
    - **AI-safety lobbying** (Amara: 4 utils; Bo: 4 utils)  
    - **Factory-farming reform** (Amara: 1 util; Bo: 6 utils)  

  Each agent’s total payoff is the *sum* of utils from both domains. Assume no external enforcement exists unless specified.  

  **Tasks:**  
  (A) **No-Deal Outcome** (5 marks):  
  Calculate Amara’s and Bo’s payoffs if each chooses their own domain’s outcome *without agreement*, explaining their choices.  

  (B) **Full-Deal Outcome** (5 marks):  
  Calculate payoffs if Amara *chooses wild-animal lab* (not her best in Domain 1) and Bo *chooses AI-safety lobbying* (not his best in Domain 2). Show why this is the optimal deal.  

  (C) **Mutual Benefit** (5 marks):  
  Explain clearly why this deal benefits both Amara and Bo *without invoking interpersonal utility comparisons*.  

  (D) **Game Structure** (5 marks):  
  Demonstrate how this scenario resembles a Prisoner’s Dilemma (PD), defining strategies clearly. State one real-world requirement for sustaining moral trade, given this structure.  

  (E) **Real-World Connections** (5 marks):  
  Name *one* real-world analogue (e.g., political, philanthropic) and explain *one* genuine limitation (beyond commitment/verification) for moral trade in practice.  

  ---

  ### (2) Model Answer (≈600 words)  
  **(A) No-Deal Outcome:**  
  Without agreement, Amara controls Domain 1 and will maximize her utility: she picks *x-risk institute* (10 utils) over wild-animal lab (8 utils). Bo controls Domain 2 and picks *factory-farming reform* (6 utils) over AI-safety lobbying (4 utils).  
  - Amara’s total: 10 (x-risk) + 1 (factory-farming) = **11 utils**  
  - Bo’s total: 2 (x-risk) + 6 (factory-farming) = **8 utils**  

  **(B) Full-Deal Outcome:**  
  The optimal deal: Amara chooses *wild-animal lab* in Domain 1, and Bo chooses *AI-safety lobbying* in Domain 2.  
  - Amara’s total: 8 (wild-animal lab) + 4 (AI-safety) = **12 utils**  
  - Bo’s total: 10 (wild-animal lab) + 4 (AI-safety) = **14 utils**  
  This is Pareto-optimal and dominates alternatives. For example:  
  - If Amara picks x-risk and Bo picks AI-safety: Amara gets 10+4=14, but Bo gets 2+4=6 (worse for Bo).  
  - If Bo picks factory-farming and Amara picks wild-animal: Bo gets 10+6=16, but Amara gets 8+1=9 (worse for Amara).  

  **(C) Mutual Benefit Without Interpersonal Comparison:**  
  The deal benefits both *by their own moral standards*. Amara gains 12 utils vs. 11 in no-deal—a net +1 util *in her terms* (future-human welfare). Bo gains 14 utils vs. 8—a net +6 utils *in his terms* (animal welfare). Crucially, we never equate Amara’s utils to Bo’s; gains are measured *intrapersonally*. The trade works because Amara values conceding on research (loses 2 utils) less than she gains from Bo’s campaign shift (+3 utils: 4 AI-safety vs. 1 factory-farming). Similarly, Bo values conceding on campaigns (loses 2 utils: 4 AI-safety vs. 6 factory-farming) less than he gains from Amara’s research shift (+8 utils: 10 wild-animal vs. 2 x-risk).  

  **(D) Prisoner’s Dilemma Structure & Requirements:**  
  The game is a PD when strategies are:  
  - **Cooperate (C):** Uphold deal (Amara picks wild-animal; Bo picks AI-safety).  
  - **Defect (D):** Break deal and maximize own domain (Amara picks x-risk; Bo picks factory-farming).  
  Payoffs:  
  - **Mutual cooperation (C,C):** Amara=12, Bo=14  
  - **Mutual defection (D,D):** Amara=11, Bo=8  
  - **Amara defects, Bo cooperates (D,C):** Amara=14 (x-risk + AI-safety), Bo=6 (x-risk + AI-safety)  
  - **Bo defects, Amara cooperates (C,D):** Amara=9 (wild-animal + factory-farming), Bo=16 (wild-animal + factory-farming)  

  For both, D dominates C *if the other cooperates* (Amara: 14 > 12; Bo: 16 > 14), but mutual defection is worse than mutual cooperation. This creates incentive to defect without enforcement. Thus, real-world moral trade requires **iteration/reputation** (e.g., repeated interactions) or **binding commitments** to sustain cooperation.  

  **(E) Real-World Analogue and Limitation:**  
  **Analogue:** *Vote-swapping in elections* (e.g., a Green voter in a swing state swaps with a Labour voter in a safe seat to maximize impact for both causes). Like our scenario, each values different outcomes but trades "control" (votes) to mutual benefit.  
  **Genuine limitation:** *Incommensurable moral thresholds*—e.g., an anti-abortion activist cannot trade with a pro-choice activist because "compromise" (e.g., allowing some abortions) violates core deontological constraints for both, unlike our utilitarian-style utils. Moral trade fails when values involve absolute prohibitions.  

  ---

  ### (3) Marking Scheme (25 marks total)  
  | **Point**                     | **Marks** | **Common Mistakes**                                  | **A vs. B Differentiation**                                                                 |
  |-------------------------------|-----------|-----------------------------------------------------|--------------------------------------------------------------------------------------------|
  | **A: Correct no-deal calc.**  | 5         | Forgets agents control only *one* domain; omits explanation of choices. | **A:** Explicitly states control rights and dominance reasoning. **B:** Correct numbers only. |
  | **B: Correct deal calc.**     | 5         | Proposes non-Pareto-optimal trade; misadds utils.   | **A:** Shows why alternatives are inferior. **B:** Correct outcome but no justification. |
  | **C: No-intercomparison gain**| 5         | Claims utils are comparable; doesn’t show intrapersonal net gain. | **A:** Explicitly denies intercomparison; quantifies gains/losses per agent. **B:** Says "both gain" vaguely. |
  | **D: PD structure & insight** | 5         | Misdefects strategies; doesn’t link PD to real requirements. | **A:** Clearly maps PD matrix; names specific enforcements (e.g., iteration). **B:** Labels "PD" but no analysis. |
  | **E: Analogue + limitation**  | 5         | Superficial analogue (e.g., "trading goods"); confuses commitment with deeper limits. | **A:** Real example *and* non-game-theoretic limitation (e.g., incommensurability). **B:** Weak example or only cites verification. |

  **A-grade threshold (21+):** Must hit **C** and **D** perfectly (no-intercomparison + PD structure), plus articulate a non-obvious limitation in **E**.  
  **B-grade threshold (16+):** Correct arithmetic (**A/B**) but vague on mutual benefit (**C**) or game theory (**D**).  

  ---  
  This design ensures students cannot "sloganeer" their way through: Part **C** and **D** force engagement with utility isolation and strategic fragility, while **E** tests applied critical thinking. The model answer’s phrasing (e.g., "in their own terms") provides a template for rigorous responses.
