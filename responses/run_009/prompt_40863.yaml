prompt: |-
  I'm a retired chemist — 38 years at the bench, now getting into philosophy in retirement because my knees won't allow hill-walking anymore. I just read a pop-philosophy book with a chapter on Moore's paradox, and something about its summary itches, but I don't know the literature well enough to say where. Here's what it said, as close as I remember:

  'Moore showed that sentences like "It's raining but I don't believe it" are contradictions. Since you can't be getting rained on while disbelieving it at the same time, the sentences are simply false, and Moore concluded that they can never be truthfully asserted. Wittgenstein was so taken with this that he gave it the name Moore's paradox, and took it to show that our beliefs are part of the world — so a complete description of reality would have to include what everyone believes.'

  My own hunch is that the middle part is off: it seems to me an old fellow could be rained on while disbeliving it — people are wrong about the weather all the time — so the sentence could be true. But maybe the book is right in some other sense of "contradiction" that I, as a newcomer, am missing. Please go through the summary piece by piece: what would a Moore scholar accept, what's a simplification, and what's plain wrong? Then tell me whether the final claim about a complete description of reality follows from anything that survives the audit. For each verdict, say how confident you are, and single out the one you're least sure of — I'd rather know where the soft spots are than recieve something polished. And keep the whole thing under 400 words: I'm asking for an audit, not a lecture.
