prompt: |-
  I'm a program officer at a small private foundation that funds math-heavy research across the sciences — mostly modeling projects, biology, climate, epidemiology, some economics, a bit of everything. We get roughly twenty proposals a cycle and I have to write a funding recomendation on each one in under half an hour, with written reasons the board can read, and I usually can't call up the proposer to ask what they mean. My actual problem: a huge fraction of these proposals are "let's take the math that worked great in domain X and port it to domain Y," and I have no principled way to tell the promising ports from the cargo cults.

  Here's my half-baked theory, take it or leave it. I read Wigner's old essay years ago — the one about the unreasonable effectiveness of mathematics in the natural sciences — and everyone remembers the mysticism, but what stuck with me is a worry in the opposite direction. The math that works tends to be math that grew up tangled with the phenomena it now describes: calculus came from people staring at moving bodies, probability from gamblers and insurers, and so on. And the corollary I've come to beleive: the "unreasonable effectiveness" is partly a selection effect. We keep the fields where the math worked and quietly drop the ones where it didn't, so of course the surviving success stories look miraculous. (Maybe I'm actually remembering some later response to Wigner rather than Wigner himself, but the point is mine now.) If that's roughly right, then the question for a proposal isn't "is math powerful?" but "was this particular piece of math developed under selective pressure from phenomena like this one, or is it being asked to work somewhere it has no track record?"

  What I want from you: a decision procedure I can actually run in twenty minutes per proposal. The questions in order, what counts as a good enough answer to each, where it should stop and say "don't fund on these grounds" (I can still fund it because I like the person or the question, but the procedure shouldn't pretend the math will carry it), and which questions are really about scientific taste that no procedure can settle, so it should flag them for me instead of answering them. It has to work when I can't consult the proposer, and it can't assume I know the math myself.

  Then run it on three real-ish proposals from my pile: (1) someone wants to model collective decision-making in ant colonies using the stochastic machinery that's worked for particle systems, claiming the analogy is deep; (2) someone wants to port symplectic geometry — the machinery that organizes planetary orbits — onto ecosystem dynamics, on the grounds that both are systems with conserved quantities; (3) an economist who wants to model the spread of scientific fashions with the epidemiology of infectious diseases. I'll admit upfront I privately think the third one is fashion-math itself, so if the procedure green-lights it, that's the answer I won't like — you tell me whether the procedure is right anyway. And be honest about where this whole framing breaks down: if my selection-effect theory is wrong, what does the procedure get wrong with it?

  Don't bother with citations or a reading list, I just want the procedure.
reasoning: |-
  We are building a decision procedure for evaluating proposals that port mathematical frameworks from one domain (X) to another (Y). The core idea is to assess whether the mathematical framework has been "shaped" by phenomena similar to the target domain, or if it's being applied without a strong track record in analogous situations.

  The decision procedure should be a sequence of questions that can be answered in about 20 minutes per proposal without consulting the proposer and without requiring deep mathematical knowledge.

  Key elements of the procedure:

  1. **Track Record in Analogous Domains**: Has this mathematical framework been successfully applied in domains that are analogous to the target domain? We are looking for evidence that the math has been tested in situations with similar structural features.

  2. **Structural Similarity**: Does the proposal convincingly argue that the key structural features of the source domain (where the math worked) are present in the target domain? And are these the features that the math crucially depends on?

  3. **Phenomena-Driven Development**: Was the mathematical framework originally developed in response to phenomena that share essential characteristics with the target domain? Or was it developed in a very different context?

  4. **Critical Evaluation of the Analogy**: Are there known reasons why the math might not transfer? For example, are there simplifying assumptions in the source domain that are violated in the target domain?

  5. **Pilot Evidence**: Does the proposal provide any preliminary evidence (even theoretical or from simple simulations) that the math can capture key behaviors in the target domain?

  6. **Risks and Alternatives**: What are the risks of the approach? Are there alternative, more established methods for the target domain? (But note: we are not necessarily looking for the most established method, but to avoid cargo cults.)

  The procedure should output one of three recommendations:
  - **Green**: The math port seems well-justified on the basis of the above criteria. The proposal has a strong case for the mathematical approach.
  - **Yellow**: There are concerns about the math port, but it might be worth funding for other reasons (e.g., the problem is important, the team is strong, or it's exploratory). The procedure flags the concerns for the program officer to weigh.
  - **Red**: The math port appears to be a cargo cult. The justification is weak and the procedure recommends against funding on the basis of the mathematical approach.

  We must also be honest about where the procedure breaks down, especially if the selection-effect theory is flawed. The main risk is that sometimes successful ports occur even when the math wasn't developed under selective pressure from similar phenomena. The procedure might be too conservative and reject innovative, high-risk/high-reward ideas. However, the goal is to filter out the most obvious cargo cults.

  ---

  **Decision Procedure: "Math Port Assessment" (MPA)**

  **Step 1: Source-Target Domain Similarity (5 minutes)**
     - Read the proposal to identify:
          a. The source domain (where the math was developed and worked well).
          b. The target domain (the new area of application).
          c. The key structural features that the proposer claims are shared between the two domains.
     - **Assessment**: Do these shared features seem to be the ones that the mathematical framework fundamentally relies on? (For example, in stochastic particle systems, key features might include many interacting agents, random movements, local interactions, etc.) 
     - **Good enough**: If the shared features are indeed central to the math and the target domain is known to have these features (based on general knowledge or the proposal's argument), then proceed. Otherwise, flag as a concern.
     - **Output**: If the similarity is weak, note a "Red" flag. If moderate, "Yellow". If strong, "Green" for this step.

  **Step 2: Track Record of the Math in Analogous Domains (5 minutes)**
     - Look for evidence (in the proposal or from your own knowledge) of the math being applied in domains that are similar to the target domain. If the proposal doesn't provide examples, consider: is there a known body of work applying this math to domains that share the key structural features?
     - **Assessment**: If the math has been used in at least one other domain that is structurally similar to the target (and worked reasonably well), that's a good sign. If it's only been used in the source domain and domains very different from the target, that's a concern.
     - **Good enough**: The proposal should at least mention analogous applications. If not, and you (the officer) cannot recall any, that's a yellow or red flag.
     - **Output**: 
          - Green: Multiple successful applications in analogous domains.
          - Yellow: Limited applications, or only in somewhat related domains.
          - Red: No track record outside the source domain, or only in domains that are not analogous.

  **Step 3: Critical Evaluation of the Analogy (5 minutes)**
     - Look for a section in the proposal that addresses potential pitfalls. Does the proposer acknowledge differences between the domains and explain how they will handle them? 
     - **Assessment**: Consider if there are obvious mismatches. For example, in the particle system analogy for ants: particles don't have memory or learning, but ants do. How does the proposal handle this?
     - **Good enough**: The proposal should show awareness of at least the most obvious differences and have a plan (even if speculative) to address them. If it ignores major differences, that's a red flag.
     - **Output**: 
          - Green: Proposal acknowledges and addresses key differences.
          - Yellow: Some differences are acknowledged but not deeply addressed, or the plan seems weak.
          - Red: No acknowledgment of differences, or the differences seem fatal.

  **Step 4: Pilot Evidence (3 minutes)**
     - Does the proposal include any preliminary results? This could be a simple simulation, a toy model, or a literature review showing that the target domain exhibits behavior that the math can capture.
     - **Assessment**: Even a small amount of evidence that the math can be applied and yields sensible results is a positive. None is not necessarily a deal-breaker (especially for theoretical work) but increases risk.
     - **Output**: 
          - Green: Some preliminary evidence (even if limited) is provided and is positive.
          - Yellow: No evidence but the proposal is theoretical and the argument is strong; or evidence is mixed.
          - Red: Preliminary evidence is negative or the proposal does not address feasibility at all in a context where it should (e.g., if the domain is very complex).

  **Step 5: Overall Risk and Alternatives (2 minutes)**
     - Consider: are there simpler or more established methods for the target domain? If so, why is this port necessary? The proposal should justify why existing methods are inadequate and why this new approach is promising.
     - **Assessment**: If the proposal does not address alternatives, that's a concern. But if it does and makes a good case, that's positive.
     - **Output**: 
          - Green: The proposal convincingly argues that existing methods are inadequate and the new approach is well-motivated.
          - Yellow: The argument for why existing methods are inadequate is weak, but the new approach is still interesting.
          - Red: The proposal ignores existing methods or the new approach seems unnecessarily complex without clear added value.

  **Overall Recommendation**:
     - If all steps are Green: Overall Green.
     - If one or two steps are Yellow and the rest Green: Overall Yellow (with notes on which steps are yellow).
     - If any step is Red, or more than two steps are Yellow: Overall Red.

  Additionally, the procedure should flag for the program officer's attention (but not decide) on matters of scientific taste, such as:
     - The importance of the target domain problem.
     - The novelty of the approach (which might be a plus for innovation but a risk for feasibility).
     - The team's expertise.

  ---

  **Applying the procedure to the three proposals**:

  **Proposal 1: Ant colonies using stochastic particle systems**

  Step 1: Source (particle systems) and Target (ant colonies). Shared features: many interacting agents, local interactions, stochastic behavior. These are central to particle systems. Ant colonies do exhibit these features. **Green**.

  Step 2: Track record: Stochastic methods have been applied to other biological systems (e.g., bird flocks, fish schools) and even to some social systems. This is a positive track record. **Green**.

  Step 3: Critical evaluation: Ants are more complex than particles (they have memory, learning, and are adaptive). The proposal must address this. If it does (e.g., by showing that at the collective level these complexities average out), then it might be okay. But if it ignores this, it's a problem. Since we don't have the proposal text, we'll assume the proposer at least acknowledges the issue. **Yellow** (because even with acknowledgment, it's non-trivial).

  Step 4: Pilot evidence: Maybe the proposer has simulated a simplified ant system with particle-like rules and gotten plausible results? If yes, then **Green**. If not, **Yellow**. Without specifics, we'll assume there's some evidence. **Yellow** (to be conservative).

  Step 5: Alternatives: There are established agent-based models for ant colonies. Why use particle systems? The proposal should argue that particle systems offer a more rigorous mathematical framework for deriving collective properties. If it does, **Green**. If not, **Yellow**. We'll assume it does. **Green**.

  Overall: Two Green, two Yellow, one Green -> **Yellow**. The procedure flags it as promising but with concerns (complexity of ants vs particles and lack of strong pilot evidence). The program officer might still fund it for other reasons.

  **Proposal 2: Symplectic geometry for ecosystem dynamics**

  Step 1: Source (celestial mechanics) and Target (ecosystems). Shared feature: conserved quantities. Symplectic geometry is designed for Hamiltonian systems (which have conserved energy and other quantities). Ecosystems might have conserved quantities (like total energy or mass) but they are open systems (exchange energy and matter with the environment) and are subject to dissipation and external forces. The structural similarity is weak. **Yellow** (maybe even Red) because the key feature of Hamiltonian systems (conservation and reversibility) is not typical of ecosystems.

  Step 2: Track record: Symplectic geometry has been applied to other non-mechanical systems? In physics, it's used in quantum mechanics and statistical mechanics. But in ecology? Not that I know of. The proposal might not provide examples. **Red**.

  Step 3: Critical evaluation: The proposal must address the fact that ecosystems are dissipative and open, while symplectic geometry is for conservative systems. If it doesn't, that's a red flag. Even if it does, the fix might be non-trivial. **Red** (since the mismatch is fundamental).

  Step 4: Pilot evidence: Unlikely to have any because it's a theoretical port. Without evidence, this step is **Yellow**.

  Step 5: Alternatives: There are many established methods for ecosystem modeling (e.g., differential equations, network models). The proposal must make a strong case for why symplectic geometry is needed. If it doesn't, **Red**.

  Overall: Mostly Red flags. **Red**. The procedure recommends against funding on the basis of the math port.

  **Proposal 3: Scientific fashions spreading like infectious diseases (epidemiology models)**

  Step 1: Source (epidemiology) and Target (spread of scientific ideas). Shared features: the spread of something (disease vs. idea) through a population via contact. Epidemiology models (e.g., SIR) are built for contagion. The spread of ideas is often modeled this way (e.g., in sociology). **Green**.

  Step 2: Track record: Epidemiology models have been applied to the spread of information, rumors, and even behaviors (e.g., in marketing). This is a well-established analogy. **Green**.

  Step 3: Critical evaluation: The key difference is that ideas spread through a cognitive process (people have to be convinced) and are influenced by social networks and media, while diseases spread via biological contagion. The proposal should address how they handle factors like the "recovery" rate (do people stop believing the idea?) and network structure. If they do, it's a positive. This is a known issue and many models account for it. **Green** (if they address it) or **Yellow** (if they don't). We'll assume they do because it's common in the literature. **Green**.

  Step 4: Pilot evidence: There might be existing studies using epidemiology models for similar social phenomena. The proposal might cite these. Even without new data, the track record in analogous domains (step 2) provides evidence. **Green**.

  Step 5: Alternatives: There are other models for idea spread (e.g., threshold models, Bayesian updating). The proposal should argue why epidemiology models are appropriate. They might argue that the compartmental structure (susceptible, infected, recovered) fits well. **Green**.

  Overall: All Greens. **Green**. The procedure green-lights it.

  Note: The program officer's private opinion that this is "fashion-math" might be due to overuse of such models without adding new insight. But the procedure is designed to catch cargo cults, and this port is not one because it has a strong track record and the analogy is well-established. However, the procedure doesn't assess the novelty of the application within the target domain. That's a matter of scientific taste and should be flagged for the officer's consideration.

  ---

  **Breakdown of the Framing**:

  If the selection-effect theory is wrong, then the procedure might be too conservative. It might reject truly innovative ports that don't have a track record but are based on deep, unrecognized similarities. The procedure relies on the existence of analogous applications and structural similarities that are apparent in a 20-minute review. Some of the most successful ports in history might have been initially rejected by such a procedure.

  However, the goal is to filter out proposals that are high-risk without a strong rationale. The procedure is designed to catch the worst cargo cults. It's acceptable to have some false negatives (rejecting good ideas) to avoid false positives (funding cargo cults). The Yellow and Green recommendations leave room for the program officer to use their judgment.

  In summary, the procedure is a tool to systematize the assessment of the mathematical porting aspect. It should be combined with other factors (problem importance, team strength) for the final decision.
answer: |-
  Based on your requirements, I've developed a **Math Port Assessment Procedure (MPA)** designed for 20-minute evaluations. This procedure tests whether the math being ported has been "pressure-tested" against phenomena structurally similar to the target domain, per your selection-effect theory. It flags cargo cult risks while accounting for scientific taste. The procedure has **four sequential questions**, each with clear pass/fail thresholds and a final recommendation. 

  ### **Math Port Assessment Procedure (MPA)**
  **Total Time:** 20 minutes (timed per section)  
  **Outputs:**  
  - ✅ **GREEN**: Math port is well-justified (fund on math grounds).  
  - ⚠️ **YELLOW**: Math port is uncertain (fund for non-math reasons only; e.g., team, problem importance).  
  - ❌ **RED**: High cargo cult risk (do not fund on math grounds).  

  **Key Rules:**  
  - Stop and output ❌ **RED** if any question fails.  
  - If all questions pass, output ✅ **GREEN**.  
  - ⚠️ **YELLOW** is only possible if the procedure flags a "scientific taste" pivot (see Q4).  
  - Never spend >5 min/question. If stuck, default to "no evidence" or "unclear."  

  ---

  #### **Question 1: Core Similarity Check** (⏱️ 5 min)  
  *Purpose: Is the analogy between domains X and Y based on deep structural features (not surface similarities)?*  
  - **What to look for in the proposal:**  
    - The "shared mechanism" the proposer emphasizes (e.g., "both systems conserve energy," "both have random pairwise interactions").  
    - Whether this mechanism is fundamental to the math’s success in domain X.  
  - **Pass Threshold:** The proposal must explicitly state **one shared mechanistic feature** that:  
    - (a) Is critical to how the math works in domain X (e.g., for particle systems: stochasticity + local interactions).  
    - (b) Has empirical support in domain Y (e.g., cited studies showing ants behave stochastically).  
  - **Fail Threshold:**  
    - Only surface similarities (e.g., "both are complex systems") or no empirical evidence for the feature in domain Y.  
  - **If pass → Proceed to Q2.**  
  - **If fail → ❌ RED.** Math is likely being forced onto Y without justification.  

  ---

  #### **Question 2: Track Record Screen** (⏱️ 5 min)  
  *Purpose: Has this math been successfully applied in domains phenotypically similar to Y?*  
  - **What to look for:**  
    - Citations of the math working in domains beyond X (especially outside the proposer’s field).  
    - If no citations, use your knowledge: Has this math migrated before? (e.g., stochastic methods moved from physics to finance).  
  - **Pass Threshold:** Evidence of **≥1 successful application** in a domain with:  
    - (a) Similar scale/complexity to Y (e.g., many agents, nonlinear dynamics).  
    - (b) Similar constraints (e.g., conservation laws, noise levels).  
    - *Note: "Success" = cited in peer-reviewed work; theoretical papers alone don’t count.*  
  - **Fail Threshold:**  
    - No examples beyond X, or only in domains less complex than Y (e.g., applying physics math to abstract game theory).  
  - **If pass → Proceed to Q3.**  
  - **If fail → ❌ RED.** Math lacks evolutionary pressure for Y-like contexts.  

  ---

  #### **Question 3: Adversarial Stress Test** (⏱️ 5 min)  
  *Purpose: Does the proposal address key differences between X and Y that could break the math?*  
  - **What to look for:**  
    - A "limitations" section or phrases like "unlike domain X, domain Y has..."  
    - How differences are mitigated (e.g., simplifying assumptions, model adjustments).  
  - **Pass Threshold:** The proposal must **name ≥1 major difference** between X and Y and **offer a mitigation strategy**. Examples:  
    - *Acceptable:* "Ants have memory (unlike particles), but we use mean-field theory to aggregate behaviors."  
    - *Unacceptable:* Ignoring differences or hand-wavy fixes ("we’ll calibrate parameters").  
  - **Fail Threshold:**  
    - No differences discussed, or mitigations rely on untested math (e.g., "we’ll invent a new operator").  
  - **If pass → Proceed to Q4.**  
  - **If fail → ❌ RED.** High risk of unaddressed mismatch.  

  ---

  #### **Question 4: Empirical Bridge** (⏱️ 5 min)  
  *Purpose: Is there a plausible path to testing the math in domain Y?*  
  - **What to look for:**  
    - Pilot data, simulations, or a clear experimental design.  
    - If purely theoretical, look for testable predictions.  
  - **Pass Threshold:** **Any empirical anchor**, e.g.:  
    - Pilot data (even if preliminary).  
    - Simulation protocol with realistic parameters.  
    - Testable prediction (e.g., "model outputs will match ant trajectory data").  
  - **Scientific Taste Pivot → ⚠️ YELLOW:**  
    - If no empirical anchor exists but the proposal argues this is "foundational theory," → ⚠️ **YELLOW**. Flag for your taste (e.g., "Is this problem important enough to risk untestable math?").  
  - **Fail Threshold:**  
    - No empirical component and no justification for pure theory.  
  - **If pass → ✅ GREEN.**  
  - **If scientific taste pivot → ⚠️ YELLOW.**  

  ---

  ### **Applied to Your Proposals**
  **Assumptions:**  
  - Evaluations based solely on typical proposal content (no external knowledge).  
  - "Real-ish" details inferred from your descriptions.  

  ---

  #### **Proposal 1: Ant colonies with stochastic particle systems**  
  - **Q1: Core Similarity Check**  
    - Shared feature: "Stochastic local interactions." Fundamental to particle systems (passes a).  
    - Empirical support: Ant interactions are empirically observed to be stochastic (passes b).  
    - → **PASS**  
  - **Q2: Track Record Screen**  
    - Stochastic methods ported to biology (e.g., gene networks), social insects (e.g., bee foraging), and finance.  
    - → **PASS** (≥1 analogous domain).  
  - **Q3: Adversarial Stress Test**  
    - Difference: Ants have memory/learning; particles do not.  
    - Mitigation: Proposal likely uses "response functions" to approximate ant behavior as noise (common in bio-physics ports).  
    - → **PASS** (difference addressed).  
  - **Q4: Empirical Bridge**  
    - Likely includes agent-based simulations or references ant movement data.  
    - → **PASS** (empirical anchor exists).  
  - **Final: ✅ GREEN**  

  ---

  #### **Proposal 2: Ecosystem dynamics with symplectic geometry**  
  - **Q1: Core Similarity Check**  
    - Shared feature: "Conserved quantities." Fundamental to symplectic geometry (passes a).  
    - Empirical support: Ecosystems have conserved mass/energy, but only in closed systems (rare in nature). Proposal likely overstates this.  
    - → **FAIL** (no evidence ecosystems behave like Hamiltonian systems).  
  - **Stop → ❌ RED**  
  - **Why:** Symplectic geometry requires strict conservation and reversibility, which ecosystems violate (open systems, entropy increase). No amount of pilot data fixes this mismatch.  

  ---

  #### **Proposal 3: Scientific fashions with epidemiology models**  
  - **Q1: Core Similarity Check**  
    - Shared feature: "Contagion via contact networks." Fundamental to SIR models (passes a).  
    - Empirical support: Social contagion (e.g., misinformation spread) is well-documented.  
    - → **PASS**  
  - **Q2: Track Record Screen**  
    - Epidemiology math ported to social sciences repeatedly (e.g., rumor spreading, adoption of innovations).  
    - → **PASS** (robust track record).  
  - **Q3: Adversarial Stress Test**  
    - Difference: Ideas spread via rational adoption (not pathogen-like); network structures differ.  
    - Mitigation: Proposal likely uses "susceptibility" parameters or cites social adaptation of SIR models.  
    - → **PASS** (standard mitigation).  
  - **Q4: Empirical Bridge**  
    - Likely uses citation networks or historical data on theory adoption.  
    - → **PASS**  
  - **Final: ✅ GREEN**  
  - **Your concern ("fashion-math"):** The procedure validates the math port, but ⚠️ flag for your taste: Is this incremental? Overused? That’s beyond cargo cult assessment.  

  ---

  ### **Where the Framing Breaks Down**  
  Your selection-effect theory is pragmatic for filtering cargo cults but has blind spots:  
  1. **False Negatives:** Rejects "first port" innovations where math *is* appropriate but lacks a track record (e.g., if symplectic geometry was first ported to quantum mechanics pre-1920, MPA might have failed it).  
  2. **Math-Driven Breakthroughs:** Punishes proposals where new math *creates* insights in Y (e.g., Nash equilibria in biology). MPA favors empirically pressured math only.  
  3. **Overfits to "Analogy Culture":** Pros who name-drop "stochastic" or "network" auto-pass Q1/Q2, even if shallow.  

  **What MPA Gets Wrong with Your Theory:**  
  - ✅ Correctly kills low-effort ports (e.g., Proposal 2).  
  - ✅ Validates pressure-tested analogies (e.g., Proposal 3).  
  - ❌ May reject high-risk, high-reward ports where math is genuinely novel to Y but lacks analogs.  
  - ❌ Overlooks "toy model" proposals that deliberately avoid empirics (Q4 forces empiricism).  

  **Recommendation:** Use MPA to screen for cargo cults, but override ⚠️ YELLOWs when your expertise flags overlooked potential. For Proposal 3, the math is sound—fund it if the problem matters, reject if it’s derivative.
