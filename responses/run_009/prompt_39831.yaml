answer: |-
  ### **Commuter's Dilemma: An Experiential Activity on Preference Inference**

  #### **Activity Overview**
  Students observe an "agent" (confederate) commuting through a map with labeled paths, infer preferences from choices, then predict behavior in novel scenarios. The twist: Half the teams are told the agent is "rational," half are told they’re "habit-driven," revealing how rationality assumptions shape inference.

  ---

  ### **Materials & Setup**
  - **Map Poster**: A simple commute map (Home → Work) with nodes and paths.  
    ![Map](https://via.placeholder.com/400x300?text=Commute+Map)  
    **Nodes**: Home (H), A, B, C, D, Work (W).  
    **Paths** (attributes: ⏱️ Time, 🛡️ Safety, 🌳 Scenery):  
    - H → A: ⏱️3 min, 🛡️Safe, 🌳Industrial  
    - H → B: ⏱️5 min, 🛡️Safe, 🌳Park  
    - A → C: ⏱️4 min, 🛡️Risky, 🌳Alley  
    - A → D: ⏱️6 min, 🛡️Safe, 🌳Residential  
    - B → C: ⏱️2 min, 🛡️Safe, 🌳Park  
    - C → W: ⏱️5 min, 🛡️Risky, 🌳Alley  
    - D → W: ⏱️7 min, 🛡️Safe, 🌳Residential  

  - **Confederate Briefing Script**:  
    > "Your true preferences: **Avoid risky paths at all costs. Then, minimize time.** Never choose a risky path unless forced. If all options are safe, pick the fastest. Stick to this rigidly. If asked, say, ‘I pick what feels right.’"

  - **Team Cards** (secret):  
    - **Rational Teams** (2 teams): "Assume the agent is logical and optimizes their preferences perfectly."  
    - **Habit-Driven Teams** (2 teams): "Assume the agent is impulsive and repeats familiar routes, avoiding new options."  

  - **Prediction Scenarios** (novel situations):  
    1. **Flooded Path**: At Home (H), new option: H → E (⏱️2 min, 🛡️Risky, 🌳Industrial) → W.  
       - *Tests*: Safety priority (rational) vs. avoidance of new/hazardous paths (habit-driven).  
    2. **Park Shortcut**: At C, new option: C → W (⏱️3 min, 🛡️Safe, 🌳Park).  
       - *Tests*: Time priority (rational) vs. sticking to known paths (habit-driven).  

  - **Scoring**: 1 point per correct prediction (max 2). No points for "plausible stories."

  ---

  ### **Step-by-Step Flow (75 min)**  
  **0–10 min: Introduction**  
  - "Today, we’ll observe a commuter’s choices to infer their priorities. Your goal: predict their behavior in new situations."  
  - Show the map. Introduce attributes (⏱️, 🛡️, 🌳). Do **not** mention preferences or rationality.  

  **10–20 min: Demonstration Phase**  
  - Confederate agent "commutes" aloud:  
    1. **H → A** (fastest safe option).  
    2. **A → D** (avoids risky A→C).  
    3. **D → W** (only safe path).  
  - Students record the trajectory: `H → A → D → W`.  

  **20–35 min: Team Hypothesis-Building**  
  - Split into 4 teams (2 rational, 2 habit-driven). Give secret team cards.  
  - **Task**: "Commit to a **strict ranking** of attributes (e.g., 🛡️ > ⏱️ > 🌳). Write it down with a 1-sentence rationale."  
  - *Rational teams likely infer*: 🛡️ > ⏱️ > 🌳 (avoided risk, then minimized time).  
  - *Habit teams likely infer*: 🌳 > 🛡️ > ⏱️ (stuck to residential paths) or similar.  

  **35–50 min: Prediction Phase**  
  - Present novel scenarios:  
    1. **Flooded Path**: At H, options: H→A (safe), H→B (safe), H→E (new/risky).  
    2. **Park Shortcut**: At C, options: C→W (new/safe/park), C→W via alley (risky).  
  - Teams predict the agent’s choice in each scenario. Collect written responses.  

  **50–60 min: Reveal & Score**  
  - Confederate chooses:  
    - **Flooded Path**: Avoids H→E (risky), picks H→A (safe).  
    - **Park Shortcut**: Takes C→W (safe and faster).  
  - Award points (1 per correct prediction). Most rational teams score 2; habit-driven teams score 0 (they predict avoidance of new paths).  

  **60–75 min: Debrief**  
  - **Key Moments → Concepts**:  
    - *Same data, different hypotheses*: Teams with identical observations inferred clashing rankings (e.g., 🛡️ > ⏱️ vs. 🌳 > 🛡️).  
      → **Non-identifiability**: Behavior alone can’t pin down preferences.  
    - *Framing split*: Rational teams predicted better because the agent *was* rational, but habit-driven teams forced the data into their box.  
      → **Rationality prior**: Assumptions about the agent’s "mind" drive inference.  
    - *Novel scenario failures*: Habit-driven teams missed the park shortcut (agent never faced "new + safe" in demo).  
      → **Dependence on data**: You only learn about situations the agent encountered.  
  - **Everyday Parallel**: "Like assuming a friend ‘loves coffee’ because they go to Café X daily—but maybe they just hate change."  
  - **AI Alignment Link**:  
    > "When AI learns values from human behavior, it faces the same ambiguity. If it assumes we’re perfectly rational, but we’re actually habitual or biased, it learns wrong preferences. Worse: it’s confident, just like your hypotheses felt solid—until novel cases broke them."  

  ---

  ### **Predictable Problems & Fixes**  
  - **Confederate drifts off-script**:  
    - *Fix*: Rehearse twice pre-class. Give cheat sheet: "SAFETY FIRST → TIME SECOND."  
  - **Teams collude with confederate**:  
    - *Fix*: Use a TA or yourself as the agent. If a student, pick one with no close friends in class.  
  - **Treating preference as a "guessing game"**:  
    - *Fix*: Emphasize: "Your goal is a hypothesis that *fits the data*, not mind-reading." Debrief explicitly on underdetermination.  
  - **Time overrun**:  
    - *Fix*: Use a timer. Cut team discussion at 15 min; move on even if unresolved.  

  ---

  ### **What This Activity Can’t Replicate**  
  1. **Hypothesis Space Scale**: Real IRL tests thousands of reward functions; here, teams only rank 3–4 attributes.  
  2. **Demonstrator Independence**: In reality, AI doesn’t know the "true" objective; here, you (the scorer) briefed the agent.  
  3. **Algorithmic Confidence**: An AI outputs precise, mathematical preferences—creating a false sense of certainty. A debrief can’t replicate that visceral shock.  

  > **Transition to Lecture**: "Next, we’ll see how these ambiguities explode in AI systems—and why ‘human irrationality’ is the hardest problem in alignment."  

  This activity forces students to *feel* the gap between behavior and preference. By the debrief, "revealed preference" feels less like economics and more like a high-stakes bet.
