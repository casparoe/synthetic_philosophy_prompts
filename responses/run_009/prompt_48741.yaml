answer: |-
  Here's a precise formulation of principles addressing your cases, followed by analysis of your examples and predictions for new cases. The core tension reveals a distinction between **experiential aesthetic properties** (requiring first-person experience) and **relational/structural properties** (knowable via testimony).

  ### Proposed Principles
  1. **The Experiential Access Principle (EAP):**  
     Beliefs about *phenomenal aesthetic qualities* (e.g., funniness, visual overwhelm, comparative fineness) can only be known through direct sensory/emotional experience. Testimony about such properties provides *evidence* but not knowledge until experienced.

  2. **The Relational Testimony Principle (RTP):**  
     Beliefs about *non-phenomenal aesthetic properties* (e.g., historical significance, compositional role, descriptive notes) can be known through testimony when backed by expertise/track record. These are objective or intersubjectively verifiable.

  3. **The Predictive Proxy Corollary (PPC):**  
     When testimony about experiential properties comes from a source with a proven track record of predicting *your* reactions, you may treat it as *pragmatic warrant* for action (e.g., buying a ticket), but not as full knowledge until experienced.

  ---

  ### Analysis of Your Cases
  | Case                          | Principle Applied          | Verdict Under Principles                     | Tension Resolved?                         |
  |-------------------------------|----------------------------|----------------------------------------------|-------------------------------------------|
  | **R.'s film reco ("masterful")** | PPC                        | Warrants action; knowledge only after viewing | Yes: You knew you'd *likely experience it as masterful* (not that it "is" masterful sans experience). |
  | **Sommelier's blackcurrant note** | RTP                        | **Knowable by testimony** (descriptive property) | Yes: This is a detectable feature, not a subjective experience. |
  | **Sommelier's "finer wine"**  | EAP                        | Not knowable by testimony (comparative evaluation) | Yes: Requires your palate's judgment. |
  | **Art historian's "keystone"** | RTP                        | **Knowable by testimony** (structural role)  | Yes: Curation/exhibition logic is relational, not experiential. |
  | **Blind friend & Rothko**     | EAP                        | Not knowable (phenomenal "overwhelm" requires sight) | Yes: Aligns with joke/fineness cases. |
  | **Unfunny joke**              | EAP                        | Not knowable until "gotten" (phenomenal humor) | Yes: Humor requires subjective comprehension. |

  **Overturned Verdict:** Your dinner-table repetition of "keystone" **is saved** by RTP. The blind friend's case **is saved** by EAP. The inconsistency was illusory: "keystone" is relational (testimony-apt), while "overwhelming" is experiential (not testimony-apt).

  **Lurking Worry Addressed:**  
  "Masterful" *can* be two propositions:  
  - *Relational*: "This film has traits experts classify as masterful" (knowable via RTP).  
  - *Experiential*: "You will find this masterful" (knowable only via EAP/PPC).  
  Your trust in R. works because she reliably maps the relational to *your* experiential response (PPC). The propositions are distinct but correlated via expertise.

  ---

  ### Predictions for New Cases
  1. **Colorblind person told two swatches clash:**  
     - **EAP applies:** "Clashing" is a phenomenal color-experience.  
     - **Verdict:** They cannot *know* they clash via testimony. They can know the designer *says* they clash (RTP), and act on it (e.g., avoiding the combo), but won't grasp the aesthetic discord without color vision.

  2. **Assurance about unfunny joke (after context explained):**  
     - **EAP + RTP hybrid:** The joke's *relational structure* (wordplay/cultural reference) is knowable via testimony (RTP).  
     - **Verdict:** Testimony gives you tools to *potentially* experience humor (e.g., "This joke uses irony about X"), but knowledge of funniness still requires the "aha" moment (EAP). Until then, you only know the joke *has properties typically found funny*.

  3. **Post-film retrospection:**  
     - **Distinguish two beliefs:**  
       - *Before viewing:* You knew "R. predicts I’ll find this masterful" (RTP/PPC) and "Experts deem it masterful" (RTP).  
       - *After loving it:* You now know *both* "I found it masterful" (EAP) and "It *is* masterful" (as a durable evaluative fact supported by your experience + expert consensus).  
     - **Verdict:** Pre-viewing, you knew relational facts and predictions. Post-viewing, you also know the experiential truth, upgrading "masterful" from prediction to first-person confirmation.

  ---

  ### Why This Works
  - **Saves your core intuition:** Humor, Rothko's overwhelm, and wine fineness *require experience* because their aesthetic "what-it’s-like" is irreducibly subjective.  
  - **Preserves legitimate deference:** Expertise on descriptive features (blackcurrant notes) or contextual roles (keystone status) is testimony-apt because they don’t depend on *your* phenomenology.  
  - **No arbitrary boundary:** The line is drawn at whether the property is *defined by subjective experience* (EAP) or exists as a relational/historical fact (RTP).  
  - **Stress-test passed:** The framework cleanly handles all your cases and new ones without special pleading.

  **Concession:** If "masterful" is *solely* defined by individual experience (not expert consensus), then pre-viewing you only knew R.’s prediction (PPC). But in practice, aesthetic terms often blend expert-endorsed traits and subjective response – which is why R.’s track record is persuasive.
