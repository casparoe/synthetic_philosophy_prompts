answer: |-
  Here’s a scenario designed to flip the script, followed by analysis:

  ### **The Scenario: Social Worker Allocating Scarce Housing**  
  Maria (act-utilitarian) and Ben (deontologist) work at a nonprofit allocating emergency housing. Demand vastly exceeds supply. Today, they have one unit left. Two families apply:  
  - **Family A**: Recently homeless, no children, both adults unemployed. Maria calculates they’d gain 20 "well-being units" (WB) from housing.  
  - **Family B**: Facing eviction next week; two young children, one with asthma. Parents work low-wage jobs but could stabilize with housing. Maria calculates 50 WB for them (preventing child harm + job loss).  

  A third family, **Family C**, arrives in crisis: fleeing domestic violence, terrified, unverified paperwork. Maria estimates *if* their story is true, housing them would save 80 WB (preventing violence/trauma). But verifying claims takes 48 hours—by then, the unit is gone. Maria must decide *now*: house the highest apparent need (C) or the verified higher-need family (B)?  

  **Utilitarian Move**: Maria houses Family C. Reason: 80 WB > 50 WB. Even with a 30% chance Family C is exaggerating (expected value: 56 WB), it still beats Family B’s 50 WB. Maximizing expected welfare is rational.  

  **Deontologist Move**: Ben refuses to house Family C. Grounds: "First-come, first-served with *verified* need is a procedural constraint. We owe fairness to those who transparently followed rules, and we can’t incentivize crisis performance." He allocates to Family B.  

  ### **Outcome & Why the Deontologist "Wins"**  
  - **Short-term**: Maria’s choice seems better—Family C gets housing.  
  - **Long-term**:  
    - Family C’s claim was fabricated (they vanish after securing housing).  
    - Word spreads: "Crisis acting gets housing." Verified families start embellishing emergencies.  
    - Over 6 months, Maria’s approach causes:  
      - 40% increase in unverifiable "crisis" claims.  
      - Longer verification delays (staff overwhelmed).  
      - *True* high-need families (like B) are consistently deprioritized for louder claimants.  
  - **Result**: Average WB per allocation drops 35% under utilitarian rules. Ben’s rigid process maintains stability: fewer false claims, faster help for verifiable cases.  

  ---

  ### **Structural Feature Doing the Work: Incentive Distortion + Epistemic Limits**  
  - **Key Mechanism**: Maria’s *single-act optimization* alters community behavior. Rewarding unverified claims incentivizes dishonesty, wasting resources on verification and crowding out quietly desperate cases. Ben’s constraint prevents this arms race.  
  - **Utilitarian Blind Spot**: Act-utilitarians can’t reliably model how their choices shift others’ strategies—especially under information asymmetry (can’t instantly verify crises).  
  - **Deontologist’s Strength**: Constraints act as Schelling points—fixed rules that curb destructive competition. Ben’s "verify first" norm preserves trust in the system.  

  ---

  ### **What If We Remove the Key Feature?**  
  If this were a **one-time decision** with no behavioral feedback (e.g., allocating a kidney to one patient where others won’t learn the criteria), Ben’s refusal to house Family C looks cruel—classic paradox territory. But in **iterated, information-scarce** contexts, constraints mitigate adversarial reactions that worsen outcomes.  

  ---

  ### **"This Case Is Rigged" – Utilitarian Counterattack**  
  **Strongest Objection**:  
  *"You biased the outcome by assuming dishonest actors. A sophisticated utilitarian would adjust for incentive effects! Maria could adopt a ‘verified need only’ rule *as a utilitarian policy* after seeing the pattern. Ben’s constraint is just crude utilitarianism in disguise."*  

  **Deontologist’s Reply**:  
  - **"Constraint vs. Rule-Utilitarianism"**: Ben doesn’t follow "verify first" *because* it maximizes utility. He follows it because it respects applicants as autonomous agents entitled to transparent treatment, not emotional auditions. If he adopted it for utilitarian reasons, he’d abandon it when calculation favored exception (e.g., a *known* true crisis). His commitment withstands outlier cases.  
  - **"Dispositions Matter"**: Maria *must* be disposed to optimize case-by-case. If she rigidly adopts "verify first," she ceases to be act-utilitarian. Ben’s constraint is *constitutive* of his role—it protects against the corrupting pressure to "find" utility in chaos.  

  ---

  ### **Your Framing: Why This Matters**  
  You’re exactly right: **the paradox assumes constraints must justify themselves per act**. But this case shows constraints defend against *systemic decay from repeated optimization*—like how "never negotiate with terrorists" avoids incentivizing more kidnappings. The utilitarian’s math fails when others adapt to exploit it.  

  **Final Verdict**:  
  - **Utilitarian mistake**: Ignoring how her *disposition* to reward apparent crises distorts the ecosystem.  
  - **Deontologist’s edge**: His constraint stabilizes social cooperation under uncertainty.  
  - **Not rigged**: The reversal emerges from bounded knowledge and iterated stakes—conditions defining real-world institutions. Remove those, and deontology collapses; include them, and it guards against utilitarianism’s self-sabotage.
