answer: |-
  Here is a specification of desiderata for an adequate account of conspiracy-theory belief, structured as requested:

  **Non-Negotiable Desiderata (Core Requirements):**

  1.  **The Watergate Criterion (Non-Falsity):** The account **must not** define conspiracy theories *by their falsity*. It must accommodate the existence of true, substantiated conspiracies uncovered through legitimate investigation (e.g., Watergate, Tobacco Industry fraud, FBI hair analysis scandal). A definition that labels the investigators who exposed these truths as "conspiracy theorists" *at the time they were investigating* is fundamentally flawed. *(Case: Historical record of verified conspiracies discovered via methods indistinguishable from investigating "conspiracy theories".)*
  2.  **Trust Asymmetry:** The account **must** explain the pattern of *selective credulity* and *selective skepticism*. It must account for why believers often exhibit profound distrust of official institutions, mainstream media, and credentialed experts while simultaneously placing high trust in alternative sources (e.g., anonymous online posts, specific contrarian figures, niche platforms). This is not random distrust but a structured epistemic stance. *(Case: Dismissal of CDC/FDA/peer-reviewed journals on vaccines coupled with credence in anecdotal Telegram videos or substack posts; rejection of election audits by state officials combined with belief in unverified voter-fraud claims from specific sources.)*
  3.  **Scale Discrimination:** The account **must** distinguish between "conspiracy theory" as a problematic epistemic category and "conspiracy" as a common, often mundane, socio-legal fact (e.g., price-fixing, corporate cover-ups of minor accidents, academic misconduct). Simply "positing a conspiracy" cannot be the defining feature. The account must identify what *elevates* a conspiracy claim to the status of a "conspiracy theory" with its characteristic epistemic and social dynamics. *(Case: Recognizing that a theory about colleagues fudging data is fundamentally different in kind and epistemic impact than a theory about a global cabal orchestrating pandemics.)*

  **Essential Desiderata (Strongly Required for Adequacy):**

  4.  **Immunization Phenomenon:** The account **must** explain why and how counter-evidence or debunking often *strengthens* belief for the adherent ("backfire effect" or "belief perseverance"). It must capture the mechanisms by which contradictory information is reinterpreted as evidence *for* the conspiracy (e.g., "They're debunking it *because* it's true!"). *(Case: Release of official reports definitively refuting a claim (e.g., 9/11 Commission Report) being cited by believers as proof of the cover-up's sophistication/scope.)*
  5.  **Mutual Incompatibility Tolerance:** The account **must** explain the empirical observation that believers often endorse multiple, logically *incompatible* explanations for the *same event* or phenomenon. Holding A and not-A simultaneously, or A and B where B implies not-A, must be explicable within the framework. *(Case: Believing both that a school shooting was a "false flag" orchestrated by the government *and* that it was perpetrated by a specific ideological group the believer opposes; believing COVID-19 was both a bioweapon leaked from a lab *and* didn't exist at all as a distinct virus.)*
  6.  **Non-Pathologization:** The account **must** avoid defining conspiracy-theory belief *inherently* as a symptom of individual psychopathology (paranoia, cognitive deficiency) or simple ignorance/vice-counting. It must be compatible with the observation that intelligent, thoughtful, and otherwise rational individuals can hold such beliefs, often based on genuine concerns about power, corruption, or institutional failure. *(Case: Interviews with scientifically literate individuals holding specific conspiracy beliefs; historical figures with documented conspiracy beliefs who made significant contributions elsewhere.)*

  **Practical Desideratum (Highly Desirable):**

  7.  **Journalistic Defeater Guidance:** The account **should ideally** provide practical, actionable epistemic heuristics or "defeaters" to guide a working journalist (or investigator) in assessing when observed anomalies, official inconsistencies, or source behaviors warrant shifting resources *away* from an official account and towards investigating a suspect alternative claim. It should help distinguish *reasonable skepticism* from *conspiratorial reasoning*. *(Case: When does an agency's lack of transparency shift from bureaucratic inertia to potential cover-up warranting investigation? What specific patterns in evidence withholding or source credibility signal a need to dig deeper?)*

  **Tensions & Analysis:**

  *   **Primary Tension:** The requirement for a **sharp epistemic defect** inherent to conspiracy-theory belief **collides directly with the Watergate Criterion**. If the defect is *definitional* (e.g., inherent unfalsifiability, rejection of all authority), it would disqualify legitimate investigations into *actual* conspiracies, which often start by questioning authority and seeking falsifying evidence for official stories. *This tension likely sinks most simplistic "epistemic vice" definitions.*
  *   **Knockout Requirement:** The **Mutual Incompatibility Tolerance** requirement likely **excludes the most contenders**. Many popular accounts (e.g., based purely on cognitive biases like pattern-seeking, or on single epistemic vices like gullibility) struggle to explain how intelligent individuals can simultaneously hold A and not-A without resorting to explanations that violate Non-Pathologization or are simply inadequate. This requirement demands a complex understanding of belief formation and maintenance.
  *   **Non-Negotiables vs. Prejudices:** The first three are non-negotiable based on empirical reality and conceptual coherence. Immunization, Incompatibility, and Non-Pathologization are strongly supported by evidence and are essential for descriptive adequacy. The Journalistic Defeater is a practical goal reflecting the user's profession, not a core theoretical prejudice. Potential prejudices flagged might be:
      *   *Over-reliance on pathology* (excluded by Desideratum 6).
      *   *Defining by social disapproval* (excluded by needing to satisfy Watergate, Scale, and potentially creating circularity).
      *   *Assuming inherent irrationality* (challenged by 5 & 6).

  **Brief Scorecard of Familiar Approaches Against Desiderata:**

  1.  **Popperian Falsifiability Critique (CTs are unfalsifiable):**
      *   *Fails Watergate:* Investigating real conspiracies *requires* falsifiable hypotheses challenging official accounts.
      *   *Fails Scale:* Many small conspiracies are highly falsifiable.
      *   *Fails Compatibility:* Doesn't explain holding incompatible beliefs.
      *   *Poor on Defeaters:* Focuses on theory structure, not evidence assessment.

  2.  **Conspiratorial Reasoning (Pattern of reasoning - e.g., nefarious intent, agency overdetermination):**
      *   *Potentially Fails Watergate:* Legitimate investigations *can* start by considering nefarious intent as a hypothesis.
      *   *Handles Asymmetry/Immunization well:* Explains selective evidence use and reinterpretation.
      *   *Handles Scale:* Can distinguish reasoning applied to small vs. vast claims.
      *   *Struggles with Compatibility:* Doesn't inherently explain embracing contradictions.
      *   *Risk of Pathologization:* Can slip into implying inherent irrationality.

  3.  **Epistemic Vice (e.g., gullibility, rigidity, cynicism):**
      *   *Directly Collides with Watergate/Non-Pathologization:* Investigators need skepticism; vices aren't unique to CT belief; pathologizes.
      *   *Handles Asymmetry:* Explains selective trust.
      *   *Handles Immunization:* Vices explain resistance to counter-evidence.
      *   *Struggles with Compatibility:* Vices don't inherently predict embracing contradictions.
      *   *Poor on Scale/Defeaters:* Focuses on individual traits, not claim structure or journalistic triggers.

  4.  **Deflationary View (CT = disliked conspiracy claim):**
      *   *Fails Utterly:* Explains nothing substantive. Doesn't address any desideratum meaningfully (Watergate? Scale? Asymmetry? Immunization? Compatibility? Pathologization? Defeaters?). It merely relabels the phenomenon based on attitude, offering no account of the belief's distinctive epistemic/social features.

  This specification provides the rigorous framework demanded. The scorecard highlights why existing simplistic approaches fail and where the theoretical heavy lifting must occur (especially navigating Watergate vs. epistemic defect and explaining compatibility).
