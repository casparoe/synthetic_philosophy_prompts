prompt: |-
  I'm a graduate TA running discussion sections for a second-year course on rational choice theory. Next week's fifty-minute section covers Newcomb's problem. The students have already worked through expected utility maximization and dominance reasoning, but they have not formally encountered causal versus evidential decision theory, and I want to keep it that way for now — the goal is for them to feel the genuine pull of both the one-boxing and two-boxing arguments before they have labels that let them file the disagreement away. Please don't explain the problem to me; plan how I should teach it.

  Specifically, I'd like the following:

  1. The order the pieces must go in. Which features of the setup — the predictor's accuracy, the timing of the prediction, the fact that box contents are already fixed at choice time, the fact that the students know all of this — have to be nailed down before the dilemma actually bites, and which parts of the standard presentation are load-bearing rather than decoration? Where should I put the moment where the students are asked to commit to what "the predictor is almost never wrong about people like you" obliges them to accept about their own choice?

  2. The carrying example. I'm torn between building the session around the standard black-box version and a variant in which the predictor is explicitly described as something the students might actually face — a copy of the agent that has already deliberated, or a process that observes the agent's earlier behaviour. What must the carrying case have, and lack, for students to be unable to dismiss the dilemma as an artifact of an impossible omniscient predictor? Which variant best serves a section whose real aim is the tension between dominance and expected-payoff reasoning, and why?

  3. The misconception map. My predictions are: (a) that students will reason as if their choice causally determines the already-fixed contents of box B, (b) that students who one-box will treat the payoff structure as a rigged intuition pump and the two-boxers as simply correct, and (c) that many will conclude the case has no bearing on any real decision and stop caring. In roughly what order will these arise, where in the sequence should each be headed off rather than left to fester, and which misconceptions am I missing?

  4. One question I can pose in the final five minutes whose answer would show me whether a student has understood the dilemma rather than merely picked a team — ideally something that separates 'got it' from 'memorized which answer the course prefers'.

  5. What to openly refuse to cover at this level — I'm inclined to keep free will, and the question of what an agent should do upon learning it has been predicted, out of the room entirely — and how to fence those off gracefully without seeming to dodge.

  Constraint: no readings, and please treat the section as self-contained; the students will not have looked at anything beforehand.
reasoning: |-
  We are teaching Newcomb's problem to students who have seen expected utility and dominance reasoning. We want them to feel the tension without introducing causal vs. evidential decision theory. We have 50 minutes.

  1. Order of presentation:

     We must build the scenario step by step to ensure that the dilemma is felt. The key features that must be established in order:

     a. **The setup**: There are two boxes, Box A and Box B. The chooser can take either Box B alone or both boxes.
     b. **The contents**: 
          - Box A is transparent and always contains $1,000.
          - Box B is opaque. It either contains $1,000,000 or $0.
     c. **The prediction**: 
          - A Predictor has made a prediction about what the chooser will do.
          - The Predictor has put $1,000,000 in Box B if and only if it predicts that the chooser will take only Box B (one-box).
          - If the Predictor predicts that the chooser will take both boxes (two-box), then it puts $0 in Box B.
     d. **The accuracy**: The Predictor is almost always correct. We must emphasize that the Predictor has a track record of being correct in similar cases, and that the chooser knows this. We should avoid making it supernatural; instead, we can say it's based on advanced psychological profiling or a sophisticated algorithm, and that in the past it has been right 99% of the time (or some high percentage).
     e. **The timing and fixed contents**: The prediction has already been made, and the contents of the boxes are fixed before the chooser makes their decision. The chooser cannot change what is in the boxes by their choice.

     The moment to commit to the implications of the predictor's accuracy: After explaining the setup and the predictor's accuracy, we should ask the students: "If the predictor is almost never wrong about people like you, what does that imply about the relationship between your choice and what is in Box B?" We want them to see that if they are going to one-box, then the predictor likely predicted that and put $1M, and if they are going to two-box, then the predictor likely predicted that and put $0. This step is crucial for the evidential reasoning.

     The load-bearing parts: 
          - The predictor's high accuracy (so that the choice provides strong evidence about the contents).
          - The fixed contents at the time of choice (so that the choice does not causally affect the contents).
          - The asymmetry in payoffs (so that one-boxing yields $1M if predicted, but two-boxing yields only $1K when predicted and $1,001,000 when not, but the latter is very rare).

     Decoration: The exact mechanism of the predictor (unless we are using a carrying example) and the exact accuracy percentage (as long as it's high) can be adjusted.

  2. Carrying example:

     We want to avoid the dismissal of the predictor as impossible. Therefore, a variant that is more realistic might help. One idea is to describe the predictor as a very accurate simulation of the agent that has already run and produced a prediction. Alternatively, we can use a variant that involves a precommitment or a past action that the predictor observed.

     Example: 
        - The predictor is a sophisticated computer program that has analyzed the chooser's brain state (via a scan taken a week ago) and run a simulation to predict the choice. The scan and simulation are so accurate that they have been right 99.9% of the time in tests.

     Why this variant? It maintains the fixed contents (the prediction is already made and the box is filled accordingly) and the high accuracy, but it is more scientifically plausible. It also avoids the idea of "omniscience" and instead relies on a causal process that has already occurred.

     However, note that the standard version with a "psychic" predictor is also acceptable if we stress the track record. The key is that the predictor is not magical but based on a reliable process.

     The carrying case must have:
          - The prediction already made and the boxes already filled.
          - The predictor's accuracy must be high and based on a reliable method that the agent has reason to believe in.
          - The agent's choice must be the kind of thing the predictor can predict (so the agent must not have any special reason to think they are an exception).

     What it must lack: 
          - Any hint that the choice can causally affect the box contents (so the prediction must be based solely on prior information).

     Which variant best serves the tension? The simulation variant is good because it makes it clear that the agent's decision process is being predicted, and that the agent's current choice is determined by factors that were present at the time of the scan. This can make the evidential reasoning more compelling (if the simulation is accurate, then my choice now is evidence of what the simulation predicted). But it doesn't break the dominance reasoning (because the boxes are fixed, so taking both always gives $1000 more than taking one, regardless of what's in Box B).

     We are trying to highlight the tension between:
          - Dominance: Whatever is in Box B, I get $1000 more by taking both. So I should two-box.
          - Expected utility: If I one-box, I am very likely to get $1M. If I two-box, I am very likely to get only $1K. So I should one-box.

     The simulation variant can help because it makes the accuracy more plausible and therefore the expected utility reasoning more compelling.

  3. Misconception map:

     a. **Causal determination**: Students might think that by choosing to one-box they cause the $1M to be in Box B (or vice versa). This must be headed off by emphasizing that the prediction has already been made and the box is already filled. We can say: "Remember, the money is already in the boxes. Your choice now does not change the contents. The predictor put the money in (or left it out) based on what it thought you would do, and that's already done."

        When to address: Immediately after presenting the setup and before asking for initial reactions. We should reinforce this at the moment of choice.

     b. **One-boxers as irrational**: Some students will think that one-boxing is only for people who don't understand dominance. They might see the two-boxing argument as obviously correct. We can head this off by having them calculate expected utilities. Ask: "If the predictor is 99% accurate, what is the expected value of one-boxing? What is the expected value of two-boxing?" (EV(one-box) = 0.99 * $1,000,000 + 0.01 * $0 = $990,000; EV(two-box) = 0.99 * $1,000 + 0.01 * $1,001,000 = $990 + $10,010 = $11,000). This shows that one-boxing has a much higher expected value. 

        When to address: After presenting the accuracy and before the initial commitment. We can ask: "If you were going to play this game many times, which strategy would make more money?" (one-boxing). Then note that the problem is only played once, but the expected utility reasoning still applies.

     c. **Dismissal as unrealistic**: Some might say that no predictor is that accurate, so the problem is irrelevant. We can counter by saying: "Let's assume for the sake of argument that such a predictor exists (or is very close to existing, with brain scans and simulations). The point is to examine what decision theory says in such a scenario. We are testing the principles of rational choice in a well-defined hypothetical." Also, the carrying example (simulation) can help by making it more plausible.

        When to address: At the beginning when setting up the predictor, we can note that we are assuming a very high accuracy for the thought experiment. If the objection arises, we can reiterate that it's a hypothetical to test our principles.

     Other misconceptions:
          d. **Confusing the predictor's accuracy with the agent's ability to change the prediction**: They might think that if they decide to one-box, then the predictor would have predicted that, so they get $1M, and if they decide to two-box, then the predictor would have predicted that, so they get $1K. But then they might think they can choose to one-box and thereby cause the predictor to have put $1M. This is a subtle form of the causal misconception. We must stress that the prediction is already made and fixed.

          e. **Thinking the dominance argument is the only rational argument**: We must present the expected utility calculation to show that one-boxing is also rational.

          f. **Thinking that the problem is about free will**: We will avoid that by saying the predictor bases its prediction on prior causes (like the brain scan) and we are not addressing free will.

     Order of misconceptions: 
          - First, (a) causal determination: when we first describe the setup and the fixed contents. We must head this off immediately.
          - Then, (c) dismissal: when we introduce the predictor, we must establish that we are assuming high accuracy for the sake of the argument.
          - Then, (b) one-boxers as irrational: when we get to the decision, we must show the expected utility calculation to validate one-boxing as rational.

  4. One question for the final five minutes:

     "Suppose that after you make your choice, you are told what the predictor predicted and what was in Box B. If you chose to two-box and you see that Box B was empty, how would you explain that outcome? If you chose to one-box and you see that Box B had $1M, how would you explain that outcome? And if you had chosen differently, what would have been the outcome?"

     We are looking for:
          - A two-boxer who sees $0 in Box B would say: "The predictor predicted I would two-box, so it left Box B empty. I got $1,000 from Box A." They should not say that if they had one-boxed they would have gotten $0 (because if they had one-boxed, the predictor would have predicted that and put $1M, so they would have gotten $1M). But note: the contents are fixed, so if the predictor predicted two-boxing and put $0, then if the agent had one-boxed, they would have gotten $0 (because Box B is empty). 

          - A one-boxer who sees $1M in Box B would say: "The predictor predicted I would one-box, so it put $1M. I got $1M." If they had two-boxed, they would have gotten $1,001,000? But wait: if the predictor predicted one-boxing and put $1M, then if the agent two-boxes, they get $1,001,000. However, the predictor would have been wrong in that case.

     The key is to see if they understand that the predictor's prediction is fixed and the contents are fixed, so the outcome for the actual choice is fixed, but the counterfactual outcome depends on what the predictor predicted. If the predictor predicted one-boxing (and put $1M) and the agent two-boxes, then the agent gets $1,001,000 and the predictor is wrong. But if the predictor predicted two-boxing (and put $0) and the agent one-boxes, then the agent gets $0 and the predictor is wrong.

     However, because the predictor is very accurate, these counterfactuals are unlikely. But the question tests whether they realize that the predictor's prediction is fixed and independent of the actual choice.

     A better question that separates 'got it' from 'memorized':

     "Suppose we run the experiment many times with many different people. We see that people who two-box almost always get $1,000, and people who one-box almost always get $1,000,000. Why does that happen? And does that mean that if a particular person two-boxes, they are likely to get $1,000, but if that same person had one-boxed, they would have been likely to get $1,000,000? Why or why not?"

     We are looking for:
          - The student should note that the predictor is accurate: it predicts two-boxing for those who two-box and one-boxing for those who one-box. Therefore, two-boxers get $1,000 (from Box A) plus $0 (from Box B) = $1,000. One-boxers get $0 (from Box A) plus $1,000,000 (from Box B) = $1,000,000.
          - For a particular person: if they two-box, it is because the predictor predicted they would two-box (with high probability) and put $0 in Box B, so they get $1,000. If that same person had one-boxed, then they would have been an exception: the predictor would have predicted two-boxing (because it predicted what they actually did) but they one-boxed, so they would have gotten $0 (because Box B is empty). Therefore, that particular person would have been worse off by one-boxing? 

     But wait: the predictor predicts based on the person's state. If the person is a two-boxer, then the predictor predicts two-boxing. If that same person had been a one-boxer (i.e., if they had a different state that led them to one-box), then the predictor would have predicted one-boxing and put $1M. So the counterfactual is tricky.

     Alternatively, we can avoid the personal counterfactual and ask: "In the long run, why do two-boxers get less than one-boxers? Does that mean that if you two-box you are likely to get less than if you one-box? And if you two-box, is it true that you would have gotten more if you had one-boxed?"

     The answer we want:
          - In the long run, two-boxers get less because they are predicted to two-box and thus Box B is empty, so they get $1,000. One-boxers get $1,000,000 because they are predicted to one-box and Box B is full. So yes, if you two-box you are likely to get $1,000 and if you one-box you are likely to get $1,000,000. But for the particular person who two-boxes, if they had one-boxed, they would have been an exception: the predictor would have predicted two-boxing (as it did) and put $0 in Box B, so they would have gotten $0. Therefore, for that person, two-boxing got them $1,000 and one-boxing would have gotten them $0. So they are better off having two-boxed. This is the core of the dilemma.

     So the question: "If you two-box, you get $1,000. If you had one-boxed, what would you have gotten? And why?"

     The correct answer for the two-boxer: "I would have gotten $0, because the predictor would have still predicted I would two-box (since it predicted based on my state, which led me to two-box) and put $0 in Box B. Then I would have taken only Box B and gotten $0."

     Similarly, if they one-boxed and got $1M, if they had two-boxed they would have gotten $1,001,000? But again, if they had two-boxed, that would have been a different choice, so the predictor might have predicted differently? Actually, the predictor predicted one-boxing for them because of their state. If they had two-boxed, then that would have been a mistake by the predictor? So the predictor put $1M in Box B (because it predicted one-boxing) and they take both, so they get $1,001,000.

     But note: the predictor is very accurate, so these counterfactuals are rare. But they are possible.

     Therefore, a good question:

     "Suppose you are a two-boxer and you got $1,000. If you had one-boxed instead, what would you have gotten? And why?"

     Expected answer: "I would have gotten $0. Because the predictor, being very accurate, predicted that I would two-box (which I did) and so put $0 in Box B. If I had one-boxed, I would have opened Box B and found $0."

     Similarly, for a one-boxer: "Suppose you one-boxed and got $1M. If you had two-boxed, what would you have gotten? Why?"
          Answer: "I would have gotten $1,001,000. Because the predictor predicted I would one-box and put $1M in Box B. If I had taken both, I would have gotten $1,000 (from A) + $1,000,000 (from B) = $1,001,000."

     This shows that the two-boxer, by two-boxing, actually avoided getting $0 (which they would have gotten if they one-boxed) and got $1,000 instead. And the one-boxer, by one-boxing, got $1M but left an extra $1,000 on the table (because if they had two-boxed they would have gotten $1,001,000). 

     This highlights the tension:
          - The two-boxer can say: "I got $1,000, and if I had one-boxed I would have gotten $0. So I did better by two-boxing."
          - The one-boxer can say: "I got $1M, and if I had two-boxed I would have gotten $1,001,000? Wait, that seems like I left money on the table, but actually, if I had been the kind of person who two-boxes, the predictor would have predicted that and put $0 in Box B, so I would have only gotten $1,000. So I did much better by one-boxing."

     But note: the one-boxer's counterfactual is not about being the same person. The one-boxer is saying: if I (with my current state) had two-boxed, that would have been a fluke, and the predictor would have been wrong. So I would have gotten $1,001,000. But that is because the predictor predicted one-boxing and put $1M. So the one-boxer is correct that in that scenario they would have gotten more by two-boxing? But that doesn't happen because they didn't two-box.

     Actually, the one-boxer's statement is: if I had chosen to two-box (with the same predictor prediction), I would have gotten $1,001,000. But that is true. However, the two-boxer's statement is: if I had chosen to one-box (with the same predictor prediction), I would have gotten $0. 

     So the question tests whether they understand that the predictor's prediction is fixed and the counterfactual choice does not change it. And that the predictor is usually right, but in the counterfactual it would have been wrong.

     This is complex. Alternatively, we can ask:

     "If you were to play this game, would you one-box or two-box? Give one reason for your choice and one reason that someone might choose the other way."

     But that doesn't test the understanding of the fixed prediction.

     Let me propose:

     "Suppose you are watching a friend play the game. You know that the predictor has already made its prediction and filled the boxes. Your friend is about to choose. You don't know what the predictor predicted. Would you advise your friend to one-box or two-box? Why? And what if you knew that the predictor predicted your friend would one-box? What if you knew it predicted two-boxing?"

     We are looking for:
          - Without knowing the prediction: they might say one-box because of the high expected return, or two-box because of dominance.
          - If they know the predictor predicted one-boxing: then they should advise two-boxing because then the friend gets $1,001,000 (since Box B has $1M). But note: if the friend two-boxes, then the predictor was wrong. But the contents are fixed: Box B has $1M. So two-boxing yields $1,001,000. One-boxing yields $1M. So two-boxing is better in this case.
          - If they know the predictor predicted two-boxing: then Box B is empty. So two-boxing yields $1,000 and one-boxing yields $0. So they should advise two-boxing.

     Therefore, in both cases, two-boxing yields more. This is the dominance argument.

     But without knowing the prediction, the expected utility of one-boxing is much higher because the predictor is likely to have predicted correctly.

     This question shows that the student understands both arguments and the role of knowledge of the prediction.

     However, note that in the actual game, the chooser does not know the prediction. So the expected utility argument favors one-boxing.

     Therefore, a student who says: "Without knowing, I would advise one-boxing because of the high expected return. But if I knew the prediction, I would advise two-boxing in both cases because then you always get $1000 more." shows they understand the tension.

  5. What to refuse to cover:

     - Free will: We can say: "We are not addressing the philosophical question of free will. We are assuming the predictor uses prior information to make a prediction, and we are only concerned with what decision to make given the setup."
     - What an agent should do upon learning the prediction: We are assuming the agent does not know the prediction. We can say: "We are focusing on the case where the agent does not know the prediction. The problem becomes different if the agent knows the prediction, but that's not Newcomb's problem as we are discussing it."

     We can fence these off by stating at the beginning: "Today, we are only concerned with the decision problem as described: the boxes are fixed, the predictor is highly accurate, and you don't know what it predicted. We won't be discussing free will or cases where you know the prediction."

  Lesson plan outline:

  I. Introduction (5 minutes)
     - Briefly recall expected utility and dominance reasoning from previous sessions.
     - Introduce the setup: two boxes, A and B. Box A has $1000, Box B may have $1M or $0. You can take one box (B) or both.

  II. Building the scenario (10 minutes)
     - Explain the predictor: it has already predicted your choice and filled Box B accordingly.
          - If it predicts you take only B, it puts $1M in B.
          - If it predicts you take both, it puts $0 in B.
     - Emphasize: the prediction is done, the boxes are fixed. Your choice does not change the contents.
     - The predictor's accuracy: 99% (or 99.9%) accurate. Use the simulation variant: "The predictor is a supercomputer that scanned your brain a week ago and simulated your decision. It has been tested and is almost always right."
     - Ask: "What does the predictor's accuracy imply about the relationship between your choice and what is in Box B?" (Guide to: if you one-box, it's very likely the predictor predicted that and put $1M; if you two-box, it's very likely the predictor predicted that and put $0.)

  III. The decision (15 minutes)
     - Ask students to think individually: what would you choose? Then have them pair and share.
     - Poll the class: one-boxers vs two-boxers.
     - Have volunteers from each side present their reasoning.
          - Two-boxer: dominance. Whatever is in B, you get $1000 more by taking both.
          - One-boxer: expected utility. By one-boxing, you are very likely to get $1M. By two-boxing, you are very likely to get only $1000.
     - Address misconceptions:
          - Reinforce: the boxes are fixed. Your choice doesn't change the contents.
          - Show expected utility calculation to validate one-boxing.
          - Note: the dominance argument is valid too because the boxes are fixed.

  IV. Deepening the dilemma (10 minutes)
     - Discuss: "Why is this a dilemma? Both arguments seem valid."
     - Present the counterfactual reasoning as in the final question above (with the friend) to show that if you knew the prediction, you would always two-box. But without knowing, one-boxing has higher expected utility.
     - Highlight: the tension is between two principles of rational choice.

  V. Final question and wrap-up (5 minutes)
     - Pose the question: "Suppose you are watching a friend play. You don't know what the predictor predicted. Would you advise your friend to one-box or two-box? Why? Now, what if you knew the predictor predicted one-boxing? What if you knew it predicted two-boxing?"
     - Briefly collect responses (time permitting).
     - Conclude: "We've seen that rational choice is not always straightforward. Next time, we'll put labels on these two approaches, but for now, ponder the dilemma."

  Refuse: If free will or prediction knowledge comes up, say: "We're focusing on the decision under uncertainty about the prediction. We'll leave other aspects for another time."
answer: |-
  ### Lesson Plan for Newcomb's Problem Discussion Section

  **Overall Goal:** Ensure students viscerally experience the tension between dominance reasoning and expected utility maximization without introducing causal/evidential decision theory. The session must be self-contained (no pre-readings).

  ---

  #### **1. Order of Presentation (15 minutes)**  
  **Key Principle:** Build the dilemma incrementally. Nail down **fixed box contents** and **predictor accuracy** before revealing the choice, as these are load-bearing. Decorative details (e.g., predictor’s exact mechanism) can be streamlined.  

  **Sequence:**  
  1. **Box Setup (2 min):**  
     - "There are two boxes: Box A (transparent, contains $1,000) and Box B (opaque, contents unknown). You choose: take *only* Box B, or *both* boxes."  
     - *Why early?* Establishes the payoff structure without complications.  

  2. **Prediction Timing & Fixed Contents (3 min):**  
     - "A Predictor filled Box B *yesterday*. If it predicted you’ll take *only Box B*, it put $1,000,000 in Box B. If it predicted you’ll take *both*, it put *nothing* in Box B."  
     - Hammer: "The boxes are *already sealed*. Your choice today cannot change what’s inside."  
     - *Why here?* Prevents misconception (a) by clarifying causal impotence upfront.  

  3. **Predictor Accuracy (5 min):**  
     - "The Predictor is almost never wrong—say, 99% accurate—based on your past behavior, brain scan, or similar proxies. It’s tested; people like you rarely stump it."  
     - **Commitment Moment (Critical):** Pose: *"If the Predictor is almost never wrong about people like you, what must be true about the relationship between your choice and what’s in Box B?"*  
       - Force explicit consensus: "If I one-box, it’s very likely $1M is there; if I two-box, it’s very likely empty."  
     - *Why here?* Accuracy is load-bearing for expected utility reasoning. Delaying this risks students dismissing the dilemma.  

  4. **The Dilemma (5 min):**  
     - Reveal payoffs:  
       - One-box: Likely $1M (if Predictor right), or $0 (if wrong).  
       - Two-box: $1,000 + $1M (if Predictor wrong), or $1,000 + $0 (if right).  
     - *Why last?* The tension bites only after accuracy + fixed contents are internalized.  

  ---

  #### **2. The Carrying Example (10 minutes)**  
  **Goal:** Use a plausible variant to prevent dismissal of the Predictor as "magic."  

  **Chosen Variant:**  
  - "The Predictor is an AI that scanned your brain a week ago, simulated your decision process, and locked Box B’s contents then. It’s correct 99% of the time for people with your neural profile."  

  **Why This Works:**  
  - **Has:**  
    - **Plausible mechanism** (simulation based on prior state).  
    - **High accuracy** without omniscience.  
    - **Fixed contents** (scan/simulation is done; choice doesn’t affect boxes).  
  - **Lacks:**  
    - Any hint that choice *causally* influences Box B.  
    - Supernatural elements students might reject.  
  - **Serves the Tension Best:**  
    - Evidential reasoning feels intuitive (your choice *correlates* with the prediction).  
    - Dominance remains mechanically valid (boxes are physically fixed).  
    - *Why not a copy/earlier behavior?* Brain scans avoid "me vs. my clone" distractions while feeling sci-fi plausible.  

  ---

  #### **3. Misconception Map (15 minutes)**  
  **Predicted Misconceptions & Mitigation Sequence:**  

  | Misconception | When It Arises | Mitigation Strategy | Timing in Session |
  |---------------|----------------|---------------------|-------------------|
  | **(a) Causal determination** | Early, when describing Box B contents. | Preempt: Repeat 3x that contents are "already fixed." Use analogy: *"Choosing is like revealing a lottery ticket—it doesn’t change the result."* | During **Prediction Timing** (min 3–5). |
  | **(c) Dismissal as unrealistic** | During Predictor accuracy discussion. | Isolate: *"Assume the Predictor exists for this scenario. Our goal is to pressure-test rational choice principles, not realism."* Show a real-world parallel (e.g., Amazon algorithms predicting purchases). | During **Predictor Accuracy** (min 8–10). |
  | **(b) One-boxers as irrational / 'rigged pump'** | After revealing payoffs. | Validate both sides: *"Two-boxers: Explain dominance. One-boxers: Calculate expected utility together."*<br>EV(one-box) = 0.99×$1M + 0.01×$0 = **$990,000**<br>EV(two-box) = 0.99×$1K + 0.01×$1.001M = **$11,000** | During **The Dilemma** (min 12–15). |
  | **(d) Missing: 'I can outsmart the Predictor'** | During commitment moment. | Crush: *"If you try to 'trick' it, the Predictor simulated that too—it’s part of your profile."* | During **Commitment Moment** (min 8). |
  | **(e) Missing: 'But dominance is always right!'** | When polling choices. | Nuance: *"Does dominance apply if states aren’t independent? What if your choice *signals* the state?"* | During **The Dilemma** (min 14). |

  **Order of Arise:** (a) → (d) → (c) → (e) → (b).  
  **Head-off Strategy:** Preempt (a), (d), and (c) *early*; validate (b) and (e) *after* polling choices to let tension simmer first.  

  ---

  #### **4. Final Diagnostic Question (5 minutes)**  
  **Question:** *"Suppose you two-box and get $1,000. If you had one-boxed instead, what would you have gotten? Now, suppose you one-box and get $1M. If you had two-boxed, what would you have gotten?"*  

  **Why This Works:**  
  - **Tests Understanding:**  
    - Correct answer shows grasp of fixed contents/prediction:  
      - *If two-boxed and got $1K → Predictor likely predicted two-boxing → Box B empty → One-boxing would yield $0.*  
      - *If one-boxed and got $1M → Predictor likely predicted one-boxing → Box B full → Two-boxing would yield $1,001,000.*  
    - Reveals if they see the "dilemma" (dominance says two-boxing *should* dominate, but outcomes confound this).  
  - **Distinguishes 'Got It' vs. 'Picked a Team':**  
    - Surface-level team-pickers assert: "One-boxing gets $1M!" or "Two-boxing always wins!" without engaging counterfactuals.  
    - Deep understanding: Recognizes that both choices *feel* rational but lead to regret in hindsight (e.g., two-boxers wish they’d one-boxed for $1M; one-boxers realize they left $1K on the table).  

  ---

  #### **5. What to Refuse to Cover (Gracefully)**  
  - **Free Will:** *"We’re bracketing free will—assume the Predictor uses data, not metaphysics. Focus on the decision given the setup."*  
  - **Post-Prediction Actions:** *"We’re only discussing cases where you *don’t* know the prediction. If you knew, it becomes a different problem."*  
  - **Decision Theory Labels:** *"Today is about the raw tension. Next week, we’ll name the frameworks."*  
  **Framing:** Position limits as "focusing the experiment," not dodging. Use: *"For today’s 50 minutes, we’re isolating X so we can feel the dilemma in our bones."*  

  ---

  #### **Timing Summary**  
  - **0–15 min:** Order of presentation (box setup → fixed contents → accuracy → dilemma).  
  - **15–25 min:** Carrying example + misconception mitigation.  
  - **25–40 min:** Poll choices, dissect reasoning, validate both sides with EV/dominance math.  
  - **40–45 min:** Diagnostic question + discussion.  
  - **45–50 min:** Wrap-up + explicitly fence off excluded topics.  

  **Key Delivery Tip:** Stay neutral. Use "devil’s advocate" to amplify both sides (e.g., *"Two-boxers, convince me I’m wrong!"* → *"One-boxers, retaliate!"*). This heightens the tension without resolving it.
