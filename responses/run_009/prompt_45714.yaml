  ### Fictional Scenario
  The damp earth yielded cool and fragrant under the probing snout, a mosaic of scent-lines sharp as cuts – bitter roots, sweet decay, the hot-metal tang of the one-who-kicked. Memory-flash: the sharp crack against flank, the sudden breathlessness. Now, the safe-dark under the overhang pulsed with the warm, familiar grunts of the round-bodied ones, the deep rumble of Big Mother nearby. A high, thin squeal echoed – the small, wobbly-legged one was separated again. Muscle tensed, a low warning hum building in the chest cavity, scanning the bright-beyond the dark. Not-safe. Not-safe where the small one was. The remembered taste of the yellow mush from the stone trough bloomed, saliva pooling. Later-sun meant mush-time. Must find the small one before the bright-noise beings came with their clanging things. Push out from the dark, snout low, ears twitching for the small one's panic-cry, flank still twinging where the kick landed. Find. Guard. Hide.

  The human voice cut through the yard’s din: "Get that escaped sow back in the farrowing crate, now!"

  ### Philosophical Analysis

  1.  **Capacity-Based Anti-Speciesist Verdict:** Before the human reveal, the narration meticulously constructs a being experiencing:
      *   **Sensory Pain/Discomfort:** The "twinging flank" recalling the "sharp crack," the "breathlessness."
      *   **Fear:** The assessment of "Not-safe," triggered by separation and memory of harm ("one-who-kicked"), the vigilance ("ears twitching," "scanning").
      *   **Anticipation:** The "blooming" memory-taste of food triggering salivation, linking "later-sun" to "mush-time."
      *   **Attachment to Particular Others:** Distinct recognition of "Big Mother" and the "small, wobbly-legged one," proactive concern driving protective action ("Must find," "Guard").
      *   **Simple Problem-Solving/Planning:** The sequence driven by memory, anticipation, and protective intent ("find the small one before the bright-noise beings came").
      These are precisely the capacities (sentience, emotional bonds, anticipation, basic agency) that a capacity-based anti-speciesist deems morally relevant for consideration. The verdict – that this being has interests (in avoiding pain, fear, separation; in companionship, comfort) demanding moral weight – is fixed by the demonstrated inner life *before* the species is named. The reveal ("sow," "farrowing crate") merely confirms *which* species possesses these capacities; it cannot honestly alter the moral verdict based *on* those capacities. Denying moral relevance post-reveal would be arbitrary, applying the criteria only to humans.

  2.  **Relational/Contractualist Revision:** A relational view (focusing on existing bonds or social roles) or a contractualist view (focusing on reciprocity within a moral community) *could* legitimately revise its practical verdict upon the reveal. Pre-reveal, the being is presented intimately but abstractly. Post-reveal, the context ("farrowing crate," "escaped sow") establishes its *actual* societal role within human systems: property, livestock, existing outside the human moral community or reciprocal contract. While a relationalist might acknowledge its *intrinsic* capacities, they could argue its *actual* moral claims on *humans* are diminished by the lack of pre-existing social bonds *with humans* or its designated role within human society. A contractualist might argue it cannot participate in or understand the social contract, thus warranting different (lesser) treatment. The reveal exposes the contextual, non-intrinsic nature of these views' verdicts – the capacities remain, but the societal relationship changes the moral calculus *for them*.

  3.  **Defender of Bare Species Membership:** This position – that moral status derives solely from being human – is profoundly challenged. The experiment shows a non-human exhibiting the very capacities deemed morally significant. The defender is left in an untenable position: either they must accept that these capacities *do* grant moral status regardless of species (abandoning bare membership), or they must insist that *only* when these capacities exist *in humans* do they matter. The latter is exposed as pure, unjustifiable species prejudice ("speciesism"). The chapter forces the defender to confront the arbitrariness of their boundary.

  ### Addressing the Editor's Objection

  *   **The Objection:** "The narrative intimacy itself smuggles relational facts (closeness, empathy) into the case, rigging it in the anti-speciesist's favour."
  *   **Does it Succeed?** **Partially, but not fatally.** Intimacy undoubtedly fosters empathy, potentially predisposing the reader to recognise the being's moral status. It *is* a powerful rhetorical tool.
  *   **The Real Work:** However, the **real work** is done by the **specific capacity demonstration under constraint**. The intimacy is the *vehicle*, but the *cargo* is the detailed depiction of *plausible, non-anthropomorphised inner states* (pain, fear, anticipation, attachment) that align with the anti-speciesist's *capacity criteria*. The design forces these capacities to be inferred *directly from the phenomenology*, not from human-like thoughts or imposed sentimentality ("no genre uplift").
  *   **Rescuing Speciesism (Without Stipulation):** A speciesist aiming to rescue their position *without* simply invoking "human-only" status would need to **alter the internal narration itself to undermine the evidence for morally relevant capacities**. They might:
      *   **Reduce Cognitive Complexity:** Eliminate clear anticipation ("later-sun meant mush-time"), depicting responses as purely instinctive reflexes devoid of future-orientation.
      *   **Dilute Attachment:** Portray the search for the small one as a generalised herd instinct or biological drive, not concern for a *particular individual* ("Big Mother," "small... one").
      *   **Blunt Pain/Fear:** Describe sensations more as immediate physical irritants without clear emotional fear or memory linking them to past harm or future threat ("the kick-place felt hot," not "memory-flash: the sharp crack... breathlessness" and "Not-safe").
      *   **Remove Agency:** Frame actions as purely reactive, driven by immediate stimuli, without any sense of problem-solving or protective intent ("moved towards the squeal," not "Must find the small one before the bright-noise beings came... Guard. Hide.").
      Essentially, they would need to rewrite the chapter to depict a creature whose inner world appears significantly simpler, more reactive, and devoid of the complex affective states and social cognition the capacity-based argument hinges on. This risks misrepresenting the actual cognition of species like pigs or corvids, demonstrating that defending bare species membership often requires *denying* the evident complexity of other minds.
