prompt: |-
  I work in the legislative affairs unit of a federal ministry — think a made-up mid-sized federal country with ten or so states, if that helps you avoid claiming anything about a specific constitution. Around forty bills a year land on my desk, and for each one I have to attach a recommendation: handle it federally, leave it to the states, or something in between (federal minimum standards, state implementation, etc.). The minister signs off on my recomendation, and a wrong call means either a court strikes the law down or the states block it in the upper house, so the stakes are real — but I usually get a day, maybe two, per bill.

  Please act as an expert on comparative federalism — subsidiarity as the EU tries to operationalize it, German cooperative federalism and the essential-matters idea, Swiss cantonal dynamics, the US commerce-clause mess — and turn all that into a decision procedure I can actually run on a bill in that timeframe. Ordered questions, what counts as a sufficient answer to each, where it stops with "federal", where with "states", and where it has to hand the question back to the minister because it's about values rather than structure. Then run it on three bills: (1) a national noise limit for heat pumps, where the states currently have a patchwork and industry is lobbying hard for uniformity; (2) rules for where shared e-scooters can be parked, basically a city-streets problem but three states have asked us to intervene anyway; (3) minimum staffing ratios in nursing homes, where I personally want a federal answer but suspect the procedure won't give me one — be honest if that's how it comes out. I'd also like you to say where the procedure will systematically misfire, and please do some brainstorming about what subsidiarity actually requires before you lock the procedure in. At the end, tell me how confident you are in the overall thing and which part of the procedure you're least sure of.
