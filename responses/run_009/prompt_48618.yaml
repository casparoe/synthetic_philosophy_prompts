answer: |-
  Here’s a **Subsidiarity Decision Procedure** distilled from comparative federalism, designed for your 1-2 day timeframe. It prioritizes constitutional defensibility over political convenience, with clear exit points for ministerial judgment. The procedure has **5 sequential questions**; if any answer is "yes," proceed to the linked recommendation. If all answers are "no," federal action is justified.

  ---

  ### **Decision Procedure: Key Questions & Thresholds**
  1. **Is the matter purely local (no cross-jurisdictional spillovers)?**  
     *Sufficient evidence:* Impacts are physically contained (e.g., sidewalk repairs).  
     *→ State/Local Action*  

  2. **Would state-level regulation create significant negative externalities?**  
     *Sufficient evidence:* Documented race-to-the-bottom risks, regulatory arbitrage, or collective action problems (e.g., pollution crossing state lines).  
     *→ Federal Action*  

  3. **Is there a demonstrable need for uniform standards?**  
     *Sufficient evidence:* Industry data showing compliance costs ≥20% higher under patchwork, or safety risks from inconsistency (e.g., medical device specs).  
     *→ Federal Standards (with state implementation if feasible)*  

  4. **Does the bill regulate "essential state functions" (police, local infrastructure, education core)?**  
     *Sufficient evidence:* Core competency per constitutional tradition (e.g., German *Kernbereich staatlicher Eigenverantwortung*).  
     *→ State Action (or Federal Framework only if severe national interest)*  

  5. **Is the primary goal fiscal (funding redistribution) or rights-based (equality)?**  
     *Sufficient evidence:* Addresses vertical fiscal imbalance or protects fundamental rights against state discrimination.  
     *→ Federal Minimum Standards + State Flexibility*  

  **Ministerial Handoff Trigger:** If constitutional authority exists (*answered "no" to all above*), but the policy involves **value tradeoffs** (e.g., liberty vs. security) without structural necessity → *Escalate to Minister for political judgment*.

  ---

  ### **Test Runs on Your Bills**
  #### **1. National Noise Limit for Heat Pumps**  
  - **Q1:** *Purely local?* No (industry supply chains cross states).  
  - **Q2:** *Negative externalities?* Yes (patchwork incentivizes "lax state" market distortion, per industry data).  
  - **→ Federal Action.**  
  *Why?* German BVerfG would allow under "economic unity" (Art. 72(2) GG); EU subsidiarity test passed due to internal market barrier.  

  #### **2. E-Scooter Parking Rules**  
  - **Q1:** *Purely local?* Yes (physical footprint is hyperlocal; no spillovers).  
  - **→ State/Local Action.**  
  *Why?* Swiss *Kantone* delegate such issues to municipalities; US "traditional state functions" doctrine applies. States’ requests ≠ subsidiarity justification.  

  #### **3. Minimum Staffing Ratios in Nursing Homes**  
  - **Q1:** *Purely local?* No (labor markets/patients cross borders).  
  - **Q2:** *Externalities?* Weak (states can set ratios; no proven race-to-bottom).  
  - **Q3:** *Need for uniformity?* Insufficient evidence (cost impact data absent).  
  - **Q4:** *Essential state function?* Yes (healthcare delivery is state-core in German/Swiss models).  
  - **Q5:** *Fiscal/rights-based?* Potentially (equality/quality of care), but not severe enough to override Q4.  
  - **→ State Action (or escalate to Minister).**  
  *Your suspicion is correct.* Without proof of interstate harm or discrimination, this fails subsidiarity. *But*: Minister could invoke "national solidarity" if framed as rights protection.  

  ---

  ### **Where the Procedure Misfires Systematically**  
  1. **Coordination Gaps:** Hybrid models (e.g., federal min standards + state implementation) assume state capacity. May fail in low-resource states.  
  2. **"Spillover" Overclaim:** Agencies may exaggerate cross-border impacts (like post-*Wickard* US Commerce Clause creep).  
  3. **Cultural Blindspots:** German "essential matters" doctrine is culturally specific; may not translate to your federation.  
  4. **Innovation Suppression:** Uniform standards can stifle policy labs (e.g., Swiss cantons piloting assisted suicide laws).  

  ---

  ### **Brainstorming: What Subsidiarity *Actually* Requires**  
  Before locking the procedure, consider these tensions:  
  - **Subsidiarity ≠ Decentralization:** It’s about *effective* solution at the lowest level *capable* of handling it (EU Protocol 2). A weak state may justify federal intervention.  
  - **Dynamic Balance:** Swiss "double majority" (fed + cantons) ensures mutual vetoes prevent overreach.  
  - **Anti-Checksum:** Subsidiarity isn’t federal + state powers adding to 100%; some spaces (e.g., AI ethics) may belong to neither initially.  
  - **Burden of Proof:** EU places burden on *federal* actors to prove necessity—reverse yours to avoid mission creep.  

  ---

  ### **Confidence Assessment**  
  - **Overall Confidence: 85%**  
    - *Strengths:* Blocks clear overreach (e.g., e-scooters), forces evidence for uniformity claims.  
    - *Weakest Link:* **Q4 (essential state functions).** Doctrine is highly interpretive (e.g., is *digital infrastructure* now "essential"?). Mitigation: Pair with a "state impact statement" from your legal unit.  
  - **Highest Risk:** Nursing home ratios. Procedure correctly flags this as ministerial judgment—but values-based calls will always be contested.  

  **Recommendation:** Add a "Subsidiarity Impact Memo" to bills: 1 page max covering the 5 questions. Reduces misfires by forcing systematic analysis. Run past your constitutional court clerks—they’ll spot jurisdictional tripwires.
