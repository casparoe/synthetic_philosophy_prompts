answer: |-
  Below is a diagnostic quiz designed to uncover implicit views on credal uncertainty. The quiz consists of 10 concrete cases, each with answer options phrased to avoid philosophical jargon. Respondents can answer based on their intuitive reactions. The cases cover: an original Ellsberg-style urn, updating that widens uncertainty, divergent expert forecasters, decision-making without settled credences, and the interpretation of uncertainty intervals. The scoring key maps answer patterns to named positions in the literature, notes gaps in the logical space, and flags limitations.

  ---

  ### Diagnostic Quiz: Views on Uncertainty  
  **Instructions:** For each scenario, choose the answer that best reflects your reaction. No prior philosophical knowledge is needed. Answer based on intuition.

  1. **Urn Choice**  
     You face two urns. Urn A contains 100 balls, each black or white, but the proportion is unknown. Urn B has exactly 50 black and 50 white balls. You win $100 if you draw a black ball. You must choose an urn.  
     a) Prefer Urn B (known 50-50).  
     b) Indifferent between Urn A and Urn B.  
     c) Prefer Urn A (unknown proportion).  

  2. **Machine Reliability Update**  
     A machine is either Type X (80% reliable) or Type Y (20% reliable), but you have no initial information about which type it is. After one test, the machine works. How does this affect your uncertainty about the next test?  
     a) Narrow to a single probability (e.g., ~66%).  
     b) Narrow to a small interval (e.g., [0.5, 0.7]).  
     c) Widen or stay equally uncertain (e.g., [0.2, 0.8]).  

  3. **Divergent Expert Forecasts**  
     Two equally trusted forecasters advise you. Forecaster A predicts a 0.7 probability of a system failure. Forecaster B predicts 0.3. You have no reason to favor either. How do you report the risk?  
     a) Average to 0.5.  
     b) Report the range [0.3, 0.7].  
     c) Seek more data before reporting anything.  

  4. **Decision Under Ambiguity**  
     You must press one of two buttons:  
     - Button A: Wins $10 if a coin of unknown bias lands heads (else $0).  
     - Button B: Wins $5 guaranteed.  
     You cannot form a definite belief about the coin. What do you do?  
     a) Press A (potential upside).  
     b) Press B (guaranteed outcome).  
     c) Cannot choose without a definite belief.  

  5. **Interval Width Interpretation**  
     Your team reports a pandemic risk as "between 0.2 and 0.4." A policymaker asks if the width (0.2) reflects inherent world variability or your team’s ignorance. How do you interpret it?  
     a) Inherent variability (fact about the world).  
     b) Ignorance (lack of knowledge).  
     c) A mix of both.  

  6. **Gambling on Ambiguous Events**  
     You are offered:  
     - Gamble X: Win $100 if a black ball is drawn from an urn with 100 black/white balls (unknown proportion).  
     - Gamble Y: Win $100 if a fair coin lands heads.  
     Which do you choose?  
     a) Indifferent—choose either.  
     b) Prefer Gamble Y (coin).  
     c) Prefer Gamble X (urn).  

  7. **Aggregating Sources to One Number**  
     Source 1 reports a probability of 0.7 for an event. Source 2 reports 0.9. You know nothing about their reliability or correlation. You must output a single number. What do you report?  
     a) Average (0.8).  
     b) Maximum (0.9).  
     c) Minimum (0.7).  
     d) Refuse—outputting one number is misleading.  

  8. **Probability of Alien Life**  
     A new exoplanet is discovered. You have zero data. What do you assign for the probability of life?  
     a) 0.5 (indifference).  
     b) A wide interval, e.g., [0, 1].  
     c) Nothing—no assignment is defensible.  

  9. **Expected Height in an Unknown Country**  
     You must estimate the average height of a person in a country you know nothing about. What do you report?  
     a) A point estimate (e.g., global average of 165 cm).  
     b) A wide interval (e.g., 150–180 cm).  
     c) Nothing—no basis for any estimate.  

  10. **Gambling on Complete Ignorance**  
      You are offered:  
      - Gamble A: Win $100 if event E happens.  
      - Gamble B: Win $100 if event E does not happen.  
      You know nothing about E. Which do you choose?  
      a) Choose A arbitrarily.  
      b) Choose B arbitrarily.  
      c) Indifferent—flip a coin to decide.  
      d) Cannot choose—no basis for preference.  

  ---

  ### Scoring Key  
  Map your answers to the positions below. Each position is defined by a pattern of answers. If your answers don’t fit perfectly, see which is closest.  

  #### Named Positions:  
  1. **Sharp-Credence Bayesianism (SCB)**  
     - Belief: Probabilities are always precise (single numbers). Ignorance is handled by indifference priors or averaging.  
     - **Answer pattern**:  
       - 1b, 2a, 3a, 4a/b (indifference-driven choice), 5b, 6a, 7a, 8a, 9a, 10a/b/c (indifference or arbitrary choice).  
     - Key: Forces aggregation to one number (emergent from answers to 3,7,8,9).  

  2. **Credal-Set Imprecise Probability (CSIP)**  
     - Belief: Uncertainty is represented by sets of probabilities (intervals). Decisions use rules to handle ambiguity.  
     - **Sub-positions based on decision rules**:  
       - **CSIP-Maximin (Pessimism)**: Choose options with best worst-case outcome.  
         - Pattern: 1a, 2c, 3b, 4b, 5b, 6b, 7c/d, 8b, 9b, 10b/d (avoid worst-case losses).  
       - **CSIP-E-Admissibility (Optimism/Tie-Breaking)**: Choose options optimal under some probability in the set.  
         - Pattern: 1a/c, 2c, 3b, 4a/b, 5b, 6a/c, 7d, 8b, 9b, 10a/b/c (flexible choices; avoids "cannot choose").  
       - *Note: Maximin and E-admissibility often overlap (e.g., both may choose 1a, 4b, 6b) but diverge when worst-case isn’t decisive (e.g., 10: Maximin may pick "d" if both gambles have $0 worst-case; E-admissibility picks "a/b/c").*  

  3. **Ambiguity-Preference Views (APV)**  
     - Belief: Divergent forecasts reflect preferences over ambiguity (not credences). Avoids intervals; focuses on willingness to act.  
     - **Answer pattern**: 1c, 2a/b, 3c, 4a, 5a, 6c, 7a/b/c (any single number), 8a/c, 9a/c, 10a/b.  
     - Key: Rejects intervals (5a, 8c, 9c) but aggregates (3c → seek data → emit one number later).  

  4. **Qualitative/Ordinal Views (QOV)**  
     - Belief: Probabilities are only meaningfully ordinal (e.g., "more likely"). Intervals/numbers are refused or coarse.  
     - **Answer pattern**: 1a/b/c (any), 2c, 3b/c, 4c, 5b/c, 6a/b/c (any), 7d, 8c, 9c, 10d.  
     - Key: Refuses to assign numbers when ignorant (7d, 8c, 9c, 10d).  

  #### Logical Space and Gaps:  
  - **Coherent Combinations**: All patterns above are occupied. CSIP sub-positions coexist in the same "credal set" framework but diverge on decisions.  
  - **Incoherent/Unattractive Gap**:  
    - *Ambiguity-averse intervals without credal sets*: E.g., 1a (avoid ambiguity) + 2a (precise update) + 8a (precise ignorance). Why? Incoherent—avows ignorance in choices but not in representation.  
    - *Why unoccupied?* If ambiguity aversion (e.g., 1a) reflects ignorance, updating (2) should preserve/widen intervals; using precision in 2a/8a contradicts this.  

  #### Limitations and Flags:  
  - **Cannot Distinguish CSIP Decision Rules Reliably**:  
    - Maximin vs. E-admissibility often agree (e.g., both choose 1a, 4b, 6b). They diverge only when options have identical worst-cases (Q10: Maximin may say "d" if both gambles have $0 worst-case; E-admissibility says "a/b/c"). The quiz lacks enough forced-tie cases to separate them cleanly.  
  - **Cannot Detect "Forced Aggregation" Bias**: The commitment to emit one number (your team’s constraint) emerges implicitly:  
    - SCB and APV always aggregate (e.g., 3a, 7a, 8a, 9a).  
    - CSIP and QOV refuse when possible (e.g., 3b, 7d, 8b/c, 9b/c).  
    - If a respondent’s answers force aggregation (e.g., 3a + 7a + 8a) but otherwise align with CSIP, they may hold a "pragmatic CSIP" view—using intervals internally but aggregating for decisions.  

  ---

  ### How to Use in Workshop  
  - **Step 1**: Participants answer the quiz individually.  
  - **Step 2**: Use the scoring key to map answers to positions.  
  - **Step 3**: Discuss patterns:  
    - "Which views dominate our team?"  
    - "Do our answers align with our forced-aggregation practice?" (e.g., SCB/APV vs. CSIP/QOV).  
  - **Step 4**: Flag limitations: "We can’t distinguish decision rules within credal-set views—this requires deeper debate on action choices."  

  This quiz isolates philosophical commitments without rigging questions around your aggregation constraint. It reveals if your team’s "emit one number" practice reflects SCB/APV (probabilities are always precise) or a pragmatic compromise with CSIP (intervals are internal tools).
