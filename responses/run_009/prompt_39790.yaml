      a) Press button A, because the expected value of A is $5, same as B, but there's a chance for more.
      b) Press button B, because it is a sure thing and you are unsure about A.
      c) I must form a credence; I cannot choose without one.

  Question 5: Width of interval as world fact or ignorance
    Scenario: You are an epidemiologist. You report that the probability of a pandemic in the next year is between 0.2 and 0.4. A policy maker asks: "Is the width of this interval, 0.2, a measure of how little we know, or is it a fact about the world (like the pandemic probability itself) that we are reporting?" How do you answer?
    Options:
      a) The width is a fact about the world: it represents the inherent variability in the pandemic probability.
      b) The width is a measure of our ignorance: it represents the lack of knowledge that prevents us from reporting a single number.
      c) The width is a combination of both.

