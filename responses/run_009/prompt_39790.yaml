  Question 6: Another case for decision-making under imprecision
    Scenario: You are offered a choice between two gambles. Gamble X: you get $100 if a randomly drawn ball from an urn (with 100 balls, each either red or blue, but you don't know the proportion) is red. Gamble Y: you get $100 if a fair coin lands heads. Which do you choose?
