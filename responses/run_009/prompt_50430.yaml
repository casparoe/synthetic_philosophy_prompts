prompt: |-
  I work as a patient-safety investigator for a large hospital trust, and one of the recurring problems in our serious-incident reviews is deciding when a failure to act gets written up as a causal contributing factor and when it just goes into the background narrative. A patient deteriorates overnight and nobody escalates to the on-call doctor; a scan result sits unactioned because the ordering doctor went on leave and handed nothing over; a locum doesn't read the notes that were available. Everyone on the review panel agrees these omissions "mattered," but we have no shared rule for when an omission is a cause of the harm versus context, and the disagreement always gets resolved by whoever is loudest in the room. I've been reading a bit of philosophy on this and the problem seems to be structural: absences are everywhere, so if we use the ordinary counterfactual test — the harm wouldn't have occurred had someone done the thing they didn't do — almost any non-event qualifies, from the nurse who didn't recheck the patient to the nurse who happened to be on a different ward. What appears to do the real work is some notion of an expectation of intervention: an omission counts as causal only against a background of who was supposed to do what, which is partly a fact about rosters and protocols but partly a judgment about what counts as normal in the first place — and I can see that normality judgments are exactly where hindsight bias sneaks in, since after a death everything a reasonable person failed to anticipate looks like an obvious omission.

  Please build us a decision procedure we can actually run inside a forty-five-minute review meeting with clinicians who have no patience for philosophy. It should take the panel through the questions in order: how to identify candidate omissions without the list exploding into every conceivable non-event; how to test whether the omission made a difference to the outcome in the relevant sense; how to weigh duty or protocol against reasonable departures from both; how to keep what people could have known at the time separate from what we know now; and where the procedure should stop with "background factor, no formal finding." It should end in one of three dispositions on our incident form — causal contributing factor, contextual note, or no finding — with a named senior clinician signing off, and it must be honest about which steps are judgment calls wearing procedure clothes. Please also flag explicitly what the procedure cannot do: I don't expect it to settle legal liability or individual blame, and it should say so rather than pretending otherwise.

  Then run it on three cases from our recent files. First: a night nurse who didn't escalate a deteriorating patient, where the escalation criteria in the protocol were genuinely ambiguous and several experienced nurses have said they would have read them the same way. Second: a patient who died because the on-call doctor was never informed of a critical result, but no individual was assigned to inform anyone — the handover system simply had no owner for that step. Third, and I want you to include this even though I dislike where I suspect it lands: an experienced nurse who checked the patient only once during a night on which the rosters were so thin that checking more often was not physically possible for anyone on shift. If your procedure classifies that third case as a systemic factor rather than a causal finding about the nurse, fine — but I want to see whether the procedure says so for principled reasons or just because the facts make us uncomfortable, and what the panel is supposed to do when the procedure's answer and the family's expectation of a named cause come apart.
reasoning: |-
  Okay, the user is a patient-safety investigator dealing with a recurring problem in serious-incident reviews: determining when a failure to act should be classified as a causal contributing factor versus just background context. They've noticed that using a counterfactual test (whether the harm would have occurred if the action had been taken) leads to too many omissions being considered, which isn't practical. They're looking for a structured decision procedure that can be used in 45-minute meetings with clinicians who aren't interested in philosophical debates. The procedure needs to handle three specific cases and address issues like hindsight bias and the separation of systemic factors from individual actions.

  First, I need to understand the core challenge. The user points out that omissions are tricky because they're absences, and the counterfactual approach is too broad. They mention the importance of expectations based on rosters and protocols, but also judgments about normality, which can introduce hindsight bias. The user wants a practical tool that guides panels through key questions step-by-step, ending with one of three dispositions: causal factor, contextual note, or no finding. It must clarify that it's not for legal liability or blame.

  The user provided three test cases:
  1. A night nurse not escalating a deteriorating patient due to ambiguous protocol criteria.
  2. A critical result not communicated because the handover system lacked ownership.
  3. An experienced nurse who couldn't check a patient more often due to understaffing.

  The procedure must be efficient, avoid philosophical jargon, and have clear steps. I should structure it as a flowchart or checklist with questions in sequence. Key elements include:
  - Identifying candidate omissions without overloading the list.
  - Testing if the omission made a difference in a relevant sense.
  - Weighing duty against reasonable departures from protocols.
  - Separating what was known at the time from hindsight.
  - Deciding when to stop and classify as background.

  I recall concepts from causation in philosophy, like Hart and Honoré's distinction between causes and conditions, and the idea of "normative expectations." The user referenced this indirectly by talking about duty and protocols. The procedure needs to operationalize these ideas without getting theoretical.

  For the decision procedure, I'll break it down into phases:
  1. **Identification**: Filter omissions to those with a duty or expectation. Ask: Was there a specific person/role assigned? Was there a protocol? Was the omission reasonably noticeable?
  2. **Causal Link**: Use a modified counterfactual: "Would timely action *specifically* have prevented harm?" and "Was the omission a necessary link in the chain?"
  3. **Normative Assessment**: Check if the duty was clear at the time, considering what a reasonable person could have known. Allow for justified deviations.
  4. **Disposition**: Classify as causal factor only if all criteria are met; otherwise, contextual or no finding. Systemic issues go under contextual.

  Crucially, the procedure must flag judgment calls and disclaimers about legal liability. For the cases:
  - Case 1: Ambiguous protocol → contextual, not causal (no clear duty).
  - Case 2: System failure → contextual, as no individual duty.
  - Case 3: Resource constraint → contextual, emphasizes systemic issue.

  The user is concerned about Case 3 conflicting with family expectations. The procedure should explicitly state that it separates causal analysis from blame and that systemic factors require different interventions. The panel might need to communicate this carefully to families.

  Finally, the procedure should be honest about its limitations: it can't assign legal liability, it might not satisfy families seeking accountability, and it relies on group judgment. The goal is learning, not blaming.
answer: |-
  Here is a practical decision procedure designed for 45-minute review meetings, structured as a sequential checklist. It prioritizes clinical pragmatism, minimizes philosophy, and forces explicit judgment calls. The procedure has **three possible outputs** (causal contributing factor, contextual note, no finding) and requires a named senior clinician (e.g., Lead Consultant or Matron) to sign off. Crucially, **it does not determine legal liability, blame, or disciplinary action**—this is solely for systems learning.

  ---

  ### **Patient Safety Omission Assessment Procedure (PSOAP)**
  **Purpose:** To consistently classify omissions in incident reviews.  
  **Time:** 15-20 minutes per candidate omission.  
  **Before Starting:** Panel agrees on 1-3 *candidate omissions* from the narrative (use pre-meeting triage: "Was there a specific *unmet expectation* linked to harm?").  
  **Key Rule:** Stop after 4 questions. If consensus isn’t reached, default to "contextual note."

  #### **Step 1: IDENTIFY THE OMISSION**  
  *Ask:* **"Was there a specific, definable action not taken by an identifiable role/person, where a reasonable expectation to act existed *before the incident*?"**  
  - **YES →** Proceed to Step 2.  
  - **NO →** Stop. Output: **No finding** (e.g., vague "someone should have done something" isn’t actionable).  
  - *Judgment call:* "Reasonable expectation" = written protocol, rostered duty, or explicit professional standard (e.g., "nurses assess deteriorating patients"). Ignore hindsight-driven "shoulds."  
  - *Procedure honesty:* This filters out irrelevant non-events (e.g., "the CEO didn’t visit the ward").

  #### **Step 2: TEST THE CAUSAL LINK**  
  *Ask:* **"Would timely action *specifically* have prevented or significantly reduced the harm *in this case*?"**  
  - **YES →** Proceed to Step 3.  
  - **NO →** Stop. Output: **Contextual note** (e.g., omission existed but harm was inevitable).  
  - *Judgment call:* Focus on *this patient’s trajectory*. Use clinical expertise, not speculation. If harm was multifactorial, ask: "Was this omission a *necessary* link in the chain?"  
  - *Procedure honesty:* This excludes omissions that wouldn’t have changed the outcome.

  #### **Step 3: ASSESS DUTY & REASONABLENESS**  
  *Ask:* **"Could a reasonably competent person in that role, with the *knowledge and resources available at the time*, have been expected to act?"**  
    - **YES →** Proceed to Step 4.  
    - **NO →** Stop. Output: **Contextual note** (e.g., system blocked action).  
    - *Sub-questions to resolve disagreement:*  
      - Was the protocol ambiguous/unknown?  
      - Were resources (time, staff, equipment) *grossly* inadequate?  
      - Was information needed to act *available* to the actor?  
    - *Judgment call:* "Reasonable" ≠ perfect. Allow for clinical judgment deviations if justifiable pre-incident. Hindsight is banned here.

  #### **Step 4: FINAL DISPOSITION**  
  *Ask:* **"Is classifying this as a causal factor essential to prevent recurrence *without* blaming an individual?"**  
  - **YES →** Output: **Causal contributing factor** (sign-off required).  
  - **NO →** Output: **Contextual note** (e.g., omission was systemic or duty unclear).  
  - *Judgment call:* Forces focus on *learning*. If the fix requires punishing a person → it’s likely not truly causal. If the fix requires system redesign → it’s contextual.  

  ---

  ### **What PSOAP Cannot Do**  
  1. Assign legal liability or individual blame.  
  2. Overcome poor evidence (e.g., if facts are disputed, pause the procedure).  
  3. Satisfy families seeking "accountability" (managing expectations is separate).  
  4. Eliminate hindsight bias entirely—it only *contains* it via Steps 1 and 3.  

  ---

  ### **Applying PSOAP to Your Cases**  
  **Case 1: Nurse didn’t escalate deteriorating patient (ambiguous protocol)**  
  - **Step 1:** YES. Identifiable action (escalate), role (nurse), expectation (protocol exists).  
  - **Step 2:** YES. Timely escalation would likely have prevented harm.  
  - **Step 3:** NO. Reasonable nurses interpreted ambiguity the same way → *no expectation to act differently*.  
  - **Output: Contextual note.**  
  - *Why principled?* The omission fails Step 3—no *reasonable* duty existed *at the time*. Fix: clarify the protocol.  

  **Case 2: Critical result not communicated (no owner for handover)**  
  - **Step 1:** NO. No identifiable role/person assigned to act → "inform doctor" had no owner.  
  - **Output: No finding** (or **Contextual note** if "handover gap" is the candidate omission).  
  - *Why principled?* Fails Step 1. The problem is a *system design flaw*, not an individual omission. Fix: assign ownership.  

  **Case 3: Nurse checked patient only once (understaffing made more checks impossible)**  
  - **Step 1:** YES. Action (frequent checks), role (nurse), expectation (standard of care).  
  - **Step 2:** YES. More checks might have detected deterioration.  
  - **Step 3:** NO. Resources were *grossly inadequate* (roster unworkable) → a reasonable nurse *could not* have done more.  
  - **Output: Contextual note** (systemic factor: unsafe staffing).  
  - *Why principled?* Fails Step 3. The omission was *caused* by the system, not the nurse.  
  - **Family expectation conflict:** The procedure separates *causal analysis* from *accountability*. Here, the "cause" is systemic, but families may still seek individual accountability. PSOAP forces the panel to:  
    - State clearly: "No individual causal factor identified; harm resulted from resourcing failures."  
    - Recommend: "Address staffing gaps + explain systemic nature to family."  
    - *Never* misclassify to satisfy emotional needs—it corrupts learning.  

  ---

  ### **Implementation Tips**  
  - **Pre-meeting:** Circulate a 1-page PSOAP flowchart with the three cases as examples.  
  - **In meeting:** Assign a timekeeper. Use a whiteboard to track answers.  
  - **Sticking points:** If consensus fails at Step 3, senior clinician decides.  
  - **Sign-off:** Senior clinician confirms disposition *after* the meeting (avoids pressure).  
  - **Audit trail:** Document answers to each step briefly in the report.  

  This procedure makes judgment calls explicit, contains hindsight bias, and prioritizes fixable systems issues over individual culpability. It works because it starts with expectations, ends with prevention, and ruthlessly filters out noise.
