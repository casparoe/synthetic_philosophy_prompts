answer: |-
  Here’s a complete, classroom-ready game design to simulate the Sleeping Beauty problem without amnesia drugs. It uses envelopes, role-playing, and non-monetary scoring to highlight the core dilemma. The goal is to make students *feel* the tension between "per waking" and "per experiment" perspectives.

  ---

  ### **Game Setup: "Beauty’s Dilemma"**
  **Materials Needed** (prep time: 30-45 minutes):
  - A coin (or a digital coin flip app).
  - 30 identical envelopes (15 labeled "MONDAY", 15 labeled "TUESDAY" — but hide labels inside).
  - Index cards for recording "credences" (one per waking).
  - A tally sheet for the facilitator.
  - A bell or timer (for "waking" transitions).
  - Optional: Simple puzzles (e.g., riddles, math problems) for distraction.

  **Player Roles**:
  - **Beauty**: 1 student per experiment (rotate roles to involve everyone).
  - **Facilitator**: You (or a student) who flips coins, manages envelopes, and records data.
  - **Oracle**: A student who secretly checks the coin flip result and hands out envelopes (to ensure the facilitator is blind to the coin outcome during questioning).

  **Prep**:
  - Pre-fold and seal each envelope with a day card inside (e.g., "MONDAY" or "TUESDAY"). Ensure envelopes are indistinguishable from the outside.
  - For each experiment, prepare:
    - **Heads**: 1 envelope (always "MONDAY").
    - **Tails**: 2 envelopes (one "MONDAY", one "TUESDAY").

  ---

  ### **Game Rules**
  1. **Experiment Flow** (repeat for 10-15 rounds):
     - **Step 1**: Flip the coin (hidden from Beauty). *Heads → 1 waking, Tails → 2 wakings.*
     - **Step 2**: Beauty is "awakened":
       - They sit at a separate table facing away from the class.
       - The Oracle hands them an envelope (without revealing the coin result).
       - Beauty opens the envelope, sees the day ("MONDAY" or "TUESDAY"), and announces their **credence** for heads (a number from 0 to 1, e.g., 0.5).  
         *Example prompt: "Given it’s [day], how confident are you the coin was heads? 0 = tails, 1 = heads, 0.5 = unsure."*
       - Beauty writes their credence on an index card, then hands it to the facilitator.
     - **Step 3**: Simulate "amnesia" for Tails wakings:
       - If the coin was **Tails**, after the first waking, ring a bell and say: "Beauty, sleep now. You will forget this when you wake again."  
         - *Optional distraction*: Give Beauty a 30-second puzzle (e.g., "Solve 3x + 2 = 11") to reset their focus.
       - Repeat Step 2 for the second waking (with the other envelope).
     - **Step 4**: Rotate the Beauty role every 1-2 experiments.

  2. **Scoring System** (use points or tokens):
     - **Per Waking Payoff**:  
       After each waking, Beauty scores points based on how *calibrated* their credence was:  
       `Score = 1 - (actual outcome - credence)^2`  
       - *Example*: If Beauty says 0.3 (30% heads) and the coin was heads, score = 1 - (1 - 0.3)^2 = 1 - 0.49 = 0.51.  
       If it was tails, score = 1 - (0 - 0.3)^2 = 1 - 0.09 = 0.91.  
       *(This rewards accurate probabilities. Highest possible score per waking = 1).*
     - **Per Experiment Payoff**:  
       After both wakings (for Tails), Beauty scores based on their **average credence** across wakings in that experiment, using the same formula.

  ---

  ### **Debrief Structure**
  1. **Reveal the data** (after all rounds):
     - Tally total wakings (e.g., 10 experiments: 5 Heads → 5 wakings, 5 Tails → 10 wakings, total = 15).
     - Calculate:  
       - **Fraction of wakings where coin was heads** (e.g., 5/15 ≈ 1/3).  
       - **Fraction of experiments where coin was heads** (e.g., 5/10 = 1/2).  
       - **Average credence Beauty gave for heads across all wakings** (e.g., if students averaged 0.4, note it’s close to 1/3).

  2. **Map to the Sleeping Beauty positions**:
     - **"One-third" view**: "When Beauty wakes up, there are three possible scenarios: Heads-Monday, Tails-Monday, or Tails-Tuesday. Only one has heads, so credence should be 1/3. Our game showed heads occur in 1/3 of wakings, and if Beauty’s average credence matched this, they scored best **per waking**."  
     - **"One-half" view**: "The coin is fair, and Beauty learns nothing new when waking. She should stick with 1/2. Our game showed heads occur in 1/2 of experiments, and if Beauty’s credence was consistently 1/2, they scored best **per experiment**."  
     - **Key insight**: The "right" answer depends on whether you care about *each waking* (like scoring per question on a test) or *each experiment* (like passing/failing the whole test).

  3. **Avoid jargon**: Don’t use "halfer/thirder" until now. Call them "team per-experiment" and "team per-waking."

  ---

  ### **What This Version Fails to Replicate**
  1. **Self-locating uncertainty**:  
     In the original, Beauty wonders, "Is it Monday or Tuesday?" Our game gives her the day (via envelopes), which she *doesn’t* get in the puzzle. This weakens the "no new information" argument (halfers’ view), since knowing the day could theoretically inform her.  
     - *Mitigation*: Stress that Beauty still can’t tell *why* it’s Monday (e.g., "Is Monday happening because of heads, or because tails and it’s the first day?").

  2. **Shared knowledge in the room**:  
     Students watching others wake multiple times for tails might infer the coin result, breaking amnesia.  
     - *Fix*: Run wakings in a private area (e.g., hallway) or have Beauty wear noise-canceling headphones until their turn.

  3. **True amnesia**:  
     Distraction puzzles don’t fully erase memory. Students might recall prior wakings.  
     - *Fix*: Use very short breaks (10 seconds) and emphasize role-playing: "You are Beauty—you *truly* forget."

  ---

  ### **Predicted Problems (and Fixes)**
  - **Problem**: Students say extreme credences (0 or 1) to "game" the scoring.  
    *Fix*: Explain that the quadratic scoring penalizes overconfidence (e.g., saying "1" when wrong gives 0 points).  
  - **Problem**: Time constraints (15 wakings take 20+ minutes).  
    *Fix*: Run 5 pre-flipped experiments (e.g., 3 Heads, 2 Tails → 7 wakings). Pre-fill some credence data to discuss.  
  - **Problem**: Confusion over "credence."  
    *Fix*: Demo with a simple coin flip first ("If I flip a coin now, what’s your credence for heads?" → 0.5).  
  - **Problem**: Envelope days leak info (e.g., "Tuesday" implies tails).  
    *Fix*: Clarify during setup: "Tuesday doesn’t mean tails—it could be part of either outcome."

  ---

  ### **Why This Works**
  - **Physicalizes amnesia**: Envelopes + distractions simulate memory loss without drugs.  
  - **Scoring exposes tension**: Per-waking vs. per-experiment payoffs mirror the philosophical divide.  
  - **Data-driven**: Students *see* heads occur in 1/3 of wakings but 1/2 of experiments, making the conflict visceral.  
  - **Safe for beginners**: No jargon, no math beyond averages, and points replace money.  

  Run the game, then reveal the Sleeping Beauty problem by name. You’ll have a room full of students arguing one-half vs. one-third—exactly the productive struggle you want!
