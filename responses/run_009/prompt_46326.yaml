prompt: |-
  Two friends of mine have a long-running dispute. One holds that the world has become dramatically less violent over the past two centuries; the other holds that this is an artifact of what gets counted, and that under a fuller count the modern era fares no better, and possibly worse. I have concluded that we cannot argue productively until we have a specification: a list of the desiderata that a definition of violence, together with a way of measuring it, would have to meet before it could adjudicate between them — exacting enough that two careful researchers applying it to the same historical record would agree on the direction of change. Please write those desiderata as a numbered list of exactly five items, each a sentence or two, with no introduction or conclusion. At least three of the five should be drawn from the following topics, in whatever order you judge best: whether the count is absolute or per capita, and what the measure should report when the two disagree; whether agentless harms — deaths from hunger, exposure, or unsafe water under policies someone could have changed — fall inside the definition or outside it; whether the measure needs a common currency across severities, such that many minor harms can outweigh a single death, and what that currency would have to be; whether the verdict must be robust to the choice of baseline year, so that it cannot come out true relative to 1800 and false relative to 1970 without the measure itself indicating which question was being asked; and whether the measure must be computable from fragmentary evidence — coroners' records, parish registers, skeletal trauma — rather than only from modern crime statistics. If you suspect that one item on your list cannot be jointly satisfied with another, say so within that item rather than adding a sixth. Please answer in American English.
reasoning: |-
  Hmm, the user is asking me to create a numbered list of five desiderata for defining and measuring violence to settle a dispute between their friends. One friend believes violence has decreased over the past two centuries, while the other thinks it's just an artifact of what gets counted. They want exact specifications so careful researchers would agree on whether violence has increased or decreased.

  The user has given me specific constraints: exactly five items, no introduction or conclusion, and at least three must cover these topics: absolute vs per capita counts; agentless harms like deaths from hunger or exposure; a common currency across severities; robustness to baseline year choice; and computability from fragmentary evidence. I need to cover at least three of these five topics in my list.

  I should draw from the specified topics while creating five distinct desiderata. For the absolute vs per capita issue, I think both measures should be required and specified clearly, especially when they disagree. For agentless harms, this is crucial to include since policies affecting survival could be seen as structural violence. Regarding a common currency, I need to address how to weigh minor harms against deaths - this requires a defined equivalence scale. For robustness to baseline year, the measure should clearly indicate which comparison is being made to avoid ambiguity. And for computability, the measure must work with historical evidence like parish records, not just modern data.

  I'll create a list that covers all five specified topics since that's possible within five items. I'll make them concise sentences as requested. I'll also note any potential incompatibilities within items, like how per capita vs absolute measures might conflict or how defining agentless harms could be contentious.

  The list should be practical and precise enough that researchers could apply it consistently to historical records. I'll write it in American English as specified. I think this approach will give the user what they need to help resolve their friends' dispute with clear criteria for evaluating violence trends.
answer: |-
  1. The measure must explicitly state whether it reports violence in absolute numbers or per capita, and specify how to interpret cases where these metrics disagree (e.g., stating that a verdict of "less violent" requires agreement from both, or clearly defining which metric is the primary adjudicator).
  2. The definition must clearly include or exclude "agentless harms" (deaths from preventable famine, exposure, or unsafe water resulting from policies or systemic failures); if included, the criteria for attributing such harms to human agency rather than natural causes must be rigorously defined and consistently applicable across eras.
  3. If the measure incorporates a range of severities (e.g., injuries vs. deaths), it requires a defined common currency (e.g., Disability-Adjusted Life Years - DALYs, or a severity weighting scale) to aggregate harms; this currency must specify the equivalence rule (e.g., how many minor injuries equal one death) and be justifiable independently of the historical trend being assessed.
  4. The verdict on the direction of change must be robust to the specific choice of baseline year within the 19th or 20th centuries; if the result flips (e.g., decrease from 1800 to 2000 but increase from 1970 to 2000), the measure itself must inherently and unambiguously indicate which comparative question is being answered to prevent arbitrary selection.
  5. The measure must be computable using methodologies applicable to fragmentary historical evidence (e.g., coroners' records, parish registers, skeletal trauma, chronicles) and not rely solely on modern, standardized crime statistics or comprehensive vital records unavailable for earlier periods, acknowledging inherent uncertainty margins.
