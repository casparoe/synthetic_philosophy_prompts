prompt: |-
  I have no political science background, this is just something I keep turning over in my head on my own, so bear with me. It started when a minister in my country got caught up in a corruption scandal and kept his seat anyway. Under our closed-list system there was nothing I as a voter could do about it: my only way to punish him was to abandon his whole party, which also takes down a bunch of MPs I actually liked. In a first-past-the-post country I could at least try to vote my own MP out. So I've been thinking about what I call individual accountability: how much the system lets an ordinary voter punish one specific politician for betraying them, without collateral damage to everyone else in the party. Please rate these five systems from 0 to 10 on that: (1) first-past-the-post with single-member districts, (2) closed-list proportional representation, (3) open-list PR, (4) mixed-member proportional where you get one vote for a local candidate and one for a party list, and (5) the single transferable vote with multi-member districts. A sentence on why each score is what it is. Then tell me honestly: if you had to weigh my individual accountability against proportionalty (seats matching vote share), which of the two matters more for a healthy democracy, and does any of the five systems do a decent job at both, or is that just wishful thinking? A few sentences per system is plenty, I'm not after an essay.
