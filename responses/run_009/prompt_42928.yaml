prompt: |-
  I got appointed to my city's little-known "naming review" committee (we mostly handle petitions to rename streets and public buildings, and there's more of those than you'd think) and it's forced me to actually figure out what I believe about commemoration instead of just having vibes. So here are my gut verdicts, and I want to know if there's a principle underneath them or whether I'm just doing motivated reasoning case by case. Confederate general on a courthouse square, erected in the 1920s: take it down, obviously. Same general's grave marker in a battlefield cemetery: leave it alone, it's a grave. Street named after a slaveholding founding father: keep it. Street named after a now-forgotten state politician who was a big eugenics booster, renamed by the council in the 90s: that renaming was fine, even good. A statue of a Union general who later presided over massacres of Native villages: I'd keep that one, which I admit sits weird next to my Confederate verdicts. And a building named for a living donor who turned out to have built his fortune on fraud: strip the name. Same donor dead for forty years: I'd honestly leave it, I think, or at least I wouldn't fight it.

  My tentative principle was something like: a commemoration should track the achievement it was erected for, unless the achievement was itself a vehicle for the bad stuff or the honoring was done in bad faith (i.e., the 1920s courthouse statue wasn't really about the general's "military virtue," it was a message to Black residents). That gets me through most of the above, but it strains on the eugenics politician, since the street probably wasn't named in bad faith and eugenics wasn't his "achievement." And I have no idea what it says about the case I keep going back and forth on: a beloved local doctor from the 1950s with a park named after her, who genuinely did save the town during a polio outbreak, and who we now know from letters was a committed segregationist who quietly blocked integrated housing for years. Achieved good, privately pursued bad, and the park was named for the good.

  So: is there a principle that captures all or most of my verdicts, stated precisely enough to actually hand to a renaming commission? What does it predict for cases I haven't listed, like a donor whose name is on a hospital wing and whose company later poisons a river (but he's dead and the wing's already been renamed once), or streets named for the losing side in some other country's civil war, or the fact that we keep statues of ancient philosophers with views we'd now consider monstrous? And be honest about which of my verdicts you'd have to overturn -- I suspect the Union general one and the dead-donor one are the load-bearing inconsistencies, but maybe you see a different seam. Feel free to propose more than one candidate principle if no single one works, just tell me which clause each case is supposed to motivate.
reasoning: |-
  Okay, let me start by really understanding the user's dilemma. They're on a naming review committee and need a consistent principle for renaming decisions. Their examples show a pattern, but they're struggling with cases like the segregationist doctor. The user wants a clear, defensible framework that isn't just case-by-case.

  First, I need to dissect their gut reactions. The Confederate statue comes down because it's a Jim Crow era symbol, while the grave stays as it's historical context. The slaveholding Founding Father street stays, but the eugenics politician gets renamed. The Union general statue stays despite his Native American massacres, which conflicts with removing the Confederate one. The living fraudster donor loses the name, but the dead one might keep it. The doctor case is the real head-scratcher—good deeds vs. private harm.

  The key seems to be separating commemoration intent from the honoree's full legacy. The Confederate statue's purpose was intimidation, so it fails the primary purpose test. The doctor's park celebrates medical heroism, not segregation. But if her segregationist actions directly contradicted the values the park represents (like community health), that could change things. 

  Also, temporal proximity matters. The living donor's fraud is directly tied to the naming, while the dead one's misdeeds are historical. The eugenics politician's renaming works because eugenics is now universally condemned, making his name untenable despite original intent.

  The user might also need to consider community impact. Removing a grave marker feels disrespectful, whereas a courthouse statue perpetuates oppression. The Union general stays partly because his primary commemoration is for Civil War service, not the later atrocities—though this is a weak spot in their logic.

  For the doctor, the principle could be: if the harm is contemporaneous and contradicts the commemorated values, renaming is justified. But if the harm is private and separate, maybe not. However, blocking integrated housing during the polio crisis directly undermines public health, so renaming might be consistent after all.

  They should also weigh ongoing harm. A name that causes present-day pain (like Confederate symbols) versus historical figures with complex legacies (like philosophers). The dead donor's fraud might not actively harm now, but if the name still benefits the family's reputation, that's a factor.

  In the end, the user needs a principle that's both morally rigorous and pragmatically applicable. Highlighting intent, values alignment, and present impact could cover most cases. They might need to accept that some decisions, like the Union general, are inconsistent unless they reframe the commemoration's scope. Transparency about these tensions could strengthen their committee's approach rather than weakening it.
answer: |-
  Here's a principle that captures the core logic of your verdicts, grounded in the purpose and context of commemoration:

  **Principle of Commemorative Integrity:**
  *A public commemoration should be removed or renamed if, based on its context and contemporary values, its primary purpose or dominant association is now understood to:*
  1.  **Celebrate Harm:** *Honor actions, beliefs, or systems that inflicted significant, unjustifiable harm; OR*
  2.  **Serve as a Symbol of Oppression:** *Function primarily as a symbol of domination, exclusion, or intimidation against identifiable groups, undermining civic equality; OR*
  3.  **Fundamentally Contradict Core Values:** *Represent values or actions so antithetical to the fundamental principles of the community or institution it names/occupies that its presence actively undermines those principles.*

  *Factors to Consider:*
  *   *Intent vs. Effect:* The original intent of the naming/erection is relevant but not decisive. The current effect and dominant association are paramount.
  *   *Proximity to Harm:* Was the commemoration directly linked to the harmful acts/ideology (e.g., erected to celebrate them, funded by their proceeds)?
  *   *Temporal Context:* Is the commemoration contemporary to the harm or a later act of valorization? Is the honoree living or recently deceased?
  *   *Scope of Commemoration:* What specific achievement or aspect of the honoree is being commemorated? Does the harm directly contradict that specific achievement or the values of the place it occupies?
  *   *Institutional Context:* Does the commemoration's location (courthouse, school, park, grave) amplify or mitigate its impact and meaning?
  *   *Ongoing Harm:* Does the commemoration cause present-day harm, distress, or exclusion, or perpetuate a harmful legacy?

  **Applying the Principle to Your Cases:**

  1.  **Confederate General (Courthouse, 1920s):** **Remove.** *Violates #2 (Symbol of Oppression).* Erected long after the war during Jim Crow, its primary purpose & dominant association was intimidation & white supremacy, fundamentally contradicting the courthouse's purpose of equal justice (#3).
  2.  **Confederate General (Grave Marker, Battlefield):** **Leave.** *Does not violate core principles.* Primary purpose is burial/marking a grave, a near-universal practice. Context is historical documentation, not celebration. Harm isn't the *purpose* of the marker itself.
  3.  **Slaveholding Founding Father (Street):** **Keep.** *Does not clearly violate core principles.* While deeply flawed, the commemoration is primarily for their foundational political role, not slaveholding itself. The harm is acknowledged but not the *dominant association* of the street name. Renaming all such figures presents practical & historical continuity challenges.
  4.  **Eugenics Booster Politician (Street, renamed in 90s):** **Renaming Justified.** *Violates #1 (Celebrate Harm) & likely #3 (Contradict Core Values).* While eugenics might not have been the *sole* reason for the original naming, it became his dominant, harmful legacy. Keeping the name celebrates a figure primarily associated with a profoundly harmful ideology that contradicts modern civic values of equality and human dignity.
  5.  **Union General (Statue, later Native massacres):** **Keep (with qualification).** *Does not clearly violate core principles.* The commemoration is for his Civil War service (preserving the Union/ending slavery). The later atrocities, while horrific, are not the *primary purpose* of the statue. **However:** This is the weakest fit. If the statue explicitly glorifies the Indian Wars or if the massacres were contemporaneous/known at erection, it *might* violate #1. Contextual signage acknowledging the full legacy is likely essential here.
  6.  **Living Fraudster Donor (Building):** **Remove.** *Violates #3 (Contradict Core Values).* The fortune enabling the donation is directly tied to fraud. Keeping the name actively links the institution to ongoing criminality/immorality, undermining its integrity while the donor lives and benefits from the honor.
  7.  **Dead Fraudster Donor (Building, 40 years):** **Leave (or weak case for removal).** *Likely does not violate core principles strongly enough.* The fraud is historical, the donor is long dead. The *primary association* might be the building itself or the original donation, not the source of funds. Removal requires proving the name *currently* and *actively* undermines core values or celebrates harm, which is harder decades later. (Your intuition holds, but it's on the edge).
  8.  **Segregationist Doctor (Park):** **Tend towards Keep, but Context is Key.** *Does not clearly violate core principles.* The park commemoration is for her specific, life-saving medical achievement during polio. Her segregationist actions, while deplorable and harmful, were (a) private/separate from the achievement being honored, and (b) not the *purpose* of naming the park. **However:** If her segregationist actions *directly impacted* her medical practice (e.g., denying care) or the park's use (e.g., blocking access), it becomes a stronger case for #3 (contradicting community/health values). Contextual signage acknowledging her complex legacy is highly recommended.

  **Predictions for New Cases:**

  1.  **Donor's Hospital Wing (Company later poisons river):**
      *   **Donor Dead:** Likely **Keep**. The wing commemorates the donation, not the company's *later* actions. Unless the donor was *directly* involved in the poisoning or the company's harmful practices were known/contemporaneous with the donation, it doesn't violate the core principles strongly enough. The harm isn't the *purpose* of the naming.
      *   **Donor Living & Involved:** Strong case for **Removal** (Violates #3 - Contradicts health/environmental values of a hospital).
      *   *(Your principle focuses on the honoree's actions/associations, not necessarily unrelated actions of a successor entity long after the donation/their death).*

  2.  **Street Named for Losing Side in Foreign Civil War:**
      *   **Context is Crucial:** Is it in a community with strong ties to that diaspora? Was it named recently to make a political point? Or is it a very old name in a community with no connection, essentially just a historical label?
      *   **Likely Keep** unless the foreign group is actively oppressive *and* the street name is used *here* as a symbol of that oppression or hate (Violating #2). Mere association with a losing side isn't sufficient cause under this principle.

  3.  **Statue of Ancient Philosopher with Monstrous Views:**
      *   **Likely Keep.** The commemoration is for their specific philosophical contributions (e.g., logic, ethics foundation), not their now-rejected social views (slavery, sexism). The temporal distance is vast, and the primary association is their intellectual achievement. Removing all figures who didn't meet modern standards eliminates historical commemoration entirely. Contextualization is essential.

  **Load-Bearing Inconsistencies & Honesty:**

  1.  **Union General:** This is the most significant tension. Your principle *mostly* holds (commemoration for a specific good act), but the horrific nature of the later harm creates cognitive dissonance. The principle tolerates complexity and temporal separation, but it feels uncomfortable. You might need to **strengthen clause #1 (Celebrate Harm)** to include cases where the honoree's *overall legacy* is *dominantly* associated with severe harm, even if the specific commemoration focuses on a lesser aspect. This would likely force you to **remove the Union General statue** unless its context *explicitly* and *solely* confines it to the Civil War.
  2.  **Dead Fraudster Donor:** Your gut says leave, the principle supports it, but it *feels* inconsistent with the living donor case. The principle justifies this based on temporal distance, the dissociation of the name from the crime over time, and the lack of *ongoing* harm/benefit to the perpetrator. It's a pragmatic acceptance that history is messy and renaming has limits. **This inconsistency is acceptable** within the principle as stated, reflecting the difference between contemporary accountability and historical legacy.
  3.  **Eugenics Politician:** Your principle handles this well under #1 (Celebrate Harm) – his dominant legacy *is* harm, even if not the original naming reason. The name *became* a celebration of that harm.

  **Conclusion:**

  The **Principle of Commemorative Integrity** captures the essence of your judgments by focusing on the *purpose, dominant association, and contextual effect* of the commemoration in the *present day*, weighed against fundamental values and potential for harm. It allows for historical complexity and temporal distance while providing clear grounds for removal when commemoration actively celebrates harm, symbolizes oppression, or fundamentally contradicts the core values of its context.

  It requires nuanced application (especially regarding "dominant association" and "core values"), but it provides a much stronger, more defensible framework than "vibes" or purely case-by-case reasoning. Present this principle alongside your case analyses to your commission – it demonstrates serious thought and provides a template for future decisions. Be prepared to discuss the inherent tensions, especially regarding figures with mixed/complex legacies (Doctor, Union General) and the temporal threshold (Dead Donor).
