prompt: |-
  I have been trying to work out, case by case, what I actually believe about the truth of statements concerning the future, and I would like to know whether my verdicts add up to a coherent position — and, if so, what that position commits me to elsewhere.

  It is tonight unsettled whether there will be a sea battle tomorrow. On 'There will be a sea battle tomorrow' my verdict is that it is neither true nor false — not merely unknown, but lacking a truth value at present. The same goes for its negation: 'There will not be a sea battle tomorrow' is also neither true nor false. Yet 'Either there will be a sea battle tomorrow or there will not' strikes me as plainly true, and that is a verdict I will not surrender. Likewise, of a fair coin to be tossed tomorrow, I hold that 'The coin will land heads or tails' is true now, even though neither 'The coin will land heads' nor 'The coin will land tails' is true now. I also accept 'If the coin lands heads, the coin will land' as true now, despite both antecedent and consequent being unsettled.

  Some future-tensed claims, however, I count simply true. If astronomers tell me there will be a total solar eclipse some decades hence, I take that to be true now — already settled by the present state of the heavens and the laws — in a way the coin toss is not.

  My tentative principle is this: a future-tensed claim is true now if and only if its truth is already settled by the present state of the world together with the laws; where the laws leave matters open, the claim is neither true nor false; but a compound built from open components can still be true, provided that every way things could go makes it true.

  Two things worry me. First, I also hold, as a quite general conviction about truth, that nothing is true unless something in reality makes it true, and that a disjunction is true only through a true disjunct. My verdicts on the excluded-middle and coin sentences appear to violate this: I am asserting truth without a true disjunct. Second, there is a case I keep going back and forth on: a sea battle whose occurrence depends on whether a radioactive atom decays before dawn. It is chancy, like the coin, yet it proceeds from the laws, like the eclipse. My settledness principle treats decay and decision alike, but I am not certain I do.

  Please tell me, precisely, what my verdicts and my tentative principle amount to. Then commit: say which of my verdicts, or which of my two general convictions, has to go, and defend that choice rather than presenting it as a tie. State what the resulting position predicts on cases I have not mentioned: whether, after tomorrow's battle, one may truly say 'It was true yesterday that there would be a sea battle today'; what it says about the sentence 'Either it will be the case that there was a sea battle or it will be the case that there was not'; and what it says about a rigged case, in which the ambush is sprung if and only if the coin lands heads, so that 'The coin will land heads if and only if there will be a battle' seems settled in advance. Finally, give a definite verdict on the decay case, and say whether it is coherent, on the position you arrive at, to speak of one future among the open ones as the future that will in fact occur — what some philosophers call the thin red line. If you find more than one of my verdicts untenable, name them and explain why; but do not leave me with a menu of options — tell me what I should think.
reasoning: |-
  Okay, this user is wrestling with some deep philosophical questions about truth and future contingents. They've clearly put a lot of thought into specific cases - sea battles, coin tosses, solar eclipses - trying to reconcile their intuitions with logical principles. What's interesting is how they're noticing tensions in their own thinking, especially around disjunctions and the principle that truth requires a truthmaker.

  Hmm... they're committed to excluded middle for future contingents ("there will or won't be a battle" is true) but reject bivalence for the disjuncts themselves. That immediately raises red flags about truthmaker maximalism - the idea that every truth needs a current truthmaker. Their coin toss example is particularly clever: they want to say "heads or tails" is true now despite neither disjunct being true. 

  The radioactive decay case seems to be their sticking point. They sense it's fundamentally similar to the coin toss, but the involvement of physical laws makes them hesitate. That's understandable - quantum indeterminacy feels different from human decisions, even if both are unsettled. 

  I notice they're implicitly working with a supervaluationist framework without naming it. Their "settled by present state + laws" criterion maps neatly to supervaluationism's "true in all histories" definition. But they haven't yet confronted the implications for truthmakers or retroactive truth ascriptions. 

  The rigged ambush case they mention is especially tricky. If the battle is perfectly correlated with the coin toss, does that make the biconditional settled? Under their principle, only if the correlation itself is law-governed. But they haven't considered whether such perfect correlations could exist without being deterministic.

  Their thin red line question cuts to the heart of whether they can maintain realism about a single actual future while denying it's currently settled. That's going to require careful handling - either they embrace a branching timeline view or they need to modify their truthmaker principle.

  What's admirable is how they're systematically testing their intuitions against principles rather than just collecting opinions. This isn't just idle speculation - they clearly want a coherent, defensible position. The frustration in phrases like "I keep going back and forth" suggests they've hit a genuine impasse.

  The key conflict is between three things: 1) their semantic intuition that future contingents lack truth values, 2) their logical intuition that excluded middle holds, and 3) their metaphysical principle that disjunctions require true disjuncts. Something has to give, and I think the weakest link is the third one - it's the least fundamental to their core examples. 

  For the decay case, consistency demands they treat it like the coin toss. The distinction between "chancy" and "law-governed" collapses when laws themselves incorporate chance. This might discomfort them initially, but it's where their principle leads. 

  On retroactive truth: after the battle, can we say it "was true yesterday"? Their framework suggests no - yesterday it wasn't true, though today we can say it's true that it was going to happen. This preserves their core intuition while allowing us to speak truly about the past future.

  The rigged ambush biconditional would be true only if the correlation is nomologically necessary - otherwise it's just contingently true in actual history but unsettled. This exposes an interesting feature of their view: some biconditionals might be true while both sides are indeterminate, if the equivalence holds across all histories.

  They need to explicitly reject truthmaker maximalism for future contingents. The "truthmaker" for "heads or tails" isn't a current fact about heads or about tails, but about the structure of possibilities. This isn't ad hoc - similar moves are made in mathematics for disjunctions over infinite sets.

  The thin red line is incompatible. If they allow one privileged future, they collapse back into determinism about truth values. Their unsettledness requires all histories to be metaphysically equal until "collapsed" by the present. This might feel counterintuitive but it's coherent - we don't need an ontologically privileged future to make sense of eventual truth.
answer: |-
  Your verdicts and tentative principle align precisely with **supervaluationism for future contingents**, a well-established position in temporal logic and philosophy of time. Let's systematize your view, resolve tensions, and extend it to new cases—with clear commitments.

  ### Core Position: Supervaluationist Semantics
  - **Truth definition**: A future-tensed statement is *true now* iff it is true in *all* causally possible futures (given present state + laws); *false now* iff false in *all* possible futures; *indeterminate* (no truth value) iff true in some futures and false in others.
  - **Excluded middle**: "P or not-P" is true because in every possible future, either P holds or not-P holds. This is a *logical truth* across all histories.
  - **Disjunctions**: "Heads or tails" is true because every possible future has one outcome. Neither disjunct is true *simpliciter*, but the disjunction is *supertrue* (true on all precisifications).
  - **Settled vs. chancy**: The eclipse is true now because *no* physically possible future lacks it. The coin toss is indeterminate because futures diverge.

  ### Resolving Your Tensions
  1. **Truthmaker conviction must be revised**:  
     You cannot maintain both that (a) disjunctions require a true disjunct and (b) "heads or tails" is true while neither disjunct is. **Abandon (a)**. In supervaluationism, truth is defined globally across possibilities, not locally via present "truthmakers." The "truthmaker" for a disjunction is the *structure of future possibilities* itself: the fact that all histories resolve the disjunction. This is consistent with your core intuition that truth depends on reality—it just denies that reality is fully determinate at present.

  2. **Radioactive decay case**:  
     Treat this exactly like the coin toss. If decay is genuinely indeterministic (per quantum mechanics), "The atom will decay by dawn" is *indeterminate* now. Your intuition that it "proceeds from the laws" is correct—but laws can be probabilistic, leaving outcomes unsettled. **Your settledness principle demands this verdict.** To treat decay differently than the coin would introduce inconsistency.

  ### Verdicts on New Cases
  - **After the battle**:  
    If a sea battle occurs, you *cannot* truthfully say, "It was true yesterday that there would be a battle today." Yesterday, the statement was indeterminate; today, we can say "It *became* true at dawn" or "It is now true that it *was going to* happen." Truth is time-relative.

  - **Iterated future contingency**:  
    "Either it will be the case that there was a battle or it will be the case that there was not" **is true now**. In every possible future, one disjunct will hold. This is a doubly nested excluded middle, still supertrue.

  - **Rigged ambush (coin-toss battle)**:  
    - "The coin will land heads iff there will be a battle":  
      This biconditional is **true now** *only if* the rigging is nomologically necessary (e.g., a law of nature links them). If the connection is contingent (e.g., a general's arbitrary decision), it's indeterminate—some futures may have heads without battle (if the general changes plans).  
    - If true, it illustrates a key point: biconditionals can be settled while their components are indeterminate.

  ### The "Thin Red Line" (TRL)
  - **TRL is incoherent on your view**. To speak of "the future that *will* in fact occur" implies a *privileged* timeline, making future contingents *already* true/false (just unknown). But your core intuition—that unsettled events lack truth values—requires *no* privileged future. All causally possible histories are ontologically equal until choices/chances resolve them. Adopting TRL would collapse your position into standard bivalence and determinism.

  ### Your Commitments Summarized
  | **Statement**                          | **Your Verdict**       | **Why**                                                                 |
  |----------------------------------------|------------------------|-------------------------------------------------------------------------|
  | "Sea battle tomorrow"                  | Indeterminate          | Not settled by present + laws                                           |
  | "No sea battle tomorrow"               | Indeterminate          | Same as above                                                           |
  | "Battle or no battle"                  | True                   | Supertrue across all futures                                            |
  | "Coin lands heads"                     | Indeterminate          | Chance outcome                                                          |
  | "Heads or tails"                       | True                   | Exhaustive possibilities                                               |
  | "If heads, then coin lands"            | True                   | Material implication; consequent is necessitated by antecedent          |
  | "Eclipse in 2050"                      | True                   | Settled by current laws/conditions                                     |
  | "Atom decays by dawn"                  | Indeterminate          | Probabilistic laws → unsettled                                         |
  | "Was it true yesterday?" (post-battle) | No                     | Truth-value is temporal; it was indeterminate then                     |
  | "Heads iff battle" (rigged nomically)  | True                   | Connection holds in all possible futures                               |
  | "The *actual* future" (TRL)            | Rejected               | Denies genuine openness; violates settledness principle                |

  ### Defense: Why Revise Truthmakers, Not Excluded Middle?
  - Surrendering excluded middle ("P or not-P") would cripple logic. Your intuition that it *must* hold for future contingents is sound—denying it leads to radical skepticism or dialetheism.
  - The "no truth without truthmaker" maxim is not fundamental. In supervaluationism, truth is grounded in *global modal reality* (the space of possibilities), not atomistic present facts. This upholds realism while accommodating indeterminacy.
  - Quantum decay and coin tosses *must* be treated alike: both are probabilistic processes. Differentiating them would require ad hoc metaphysics unsupported by science.

  **Conclusion**: You are a supervaluationist. Your position is coherent, widely defended (e.g., by Thomason, Belnap), and resolves future contingents without sacrificing logic or indeterminism. Commit to it fully: revise truthmaker maximalism, treat all chancy processes uniformly, reject the thin red line, and embrace time-relative truth.
