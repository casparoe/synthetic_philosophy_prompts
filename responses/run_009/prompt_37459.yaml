answer: |-
  Based on your constraints and goals, here’s a prioritization of research questions that maximize conceptual leverage, tractability for formal/philosophical work, neglect relative to adjacent fields, and potential to reshape real-world prioritization. The ranking balances **upstream foundational gaps** against **actionable insights for institutional design**, deprioritizing popular but low-crux debates.

  ---

  ### **Top 3 Research Priorities (12 researcher-years total)**
  #### **1. Stability of Precommitments Under Evolutionary and Adaptive Pressure**  
  *(Allocate 6 researcher-years)*  
  **Why upstream?**  
  - If precommitments (e.g., treaties, constitutions, algorithmic restraints) reliably decay when faced with novel competitors, mutation, or self-modification, *all* coordination solutions relying on binding agreements fail. This question determines whether "coordination" is even possible in dynamic systems (e.g., AI races, climate treaties).  
  - **Load-bearing crux**: Debates about "enforcement mechanisms" (e.g., reputation, punishment) presuppose precommitment stability. If evolutionary pressure *inevitably* breeds defectors that exploit rigid commitments, solutions must shift toward antifragile/adaptive structures.  

  **Tractability**  
  - Formal methods: Model precommitments as equilibria in evolutionary game theory with mutation rates, or as proof-of-stake consensus in decentralized networks. Philosophers can analyze counterfactual resilience (e.g., "Would this commitment resist a coalition of 1% hyper-adaptive agents?").  
  - No lab needed: Use agent-based simulations with varying selection pressures or proof assistants to verify protocol invariants.  

  **Neglect**  
  - Ostrom studied static communities; modern work (e.g., Hanson’s "em"s) assumes commitments hold. Rationalists gesture at "defection" but lack formal models of *how* defectors evolve to circumvent barriers.  
  - *Synthesis gap*: Evolutionary dynamics + mechanism design + algebraic stability proofs.  

  **Value for Prioritization**  
  - **Decision-critical**: If precommitments are unstable, funders should redirect resources from treaty-building to *mutation-resistant* coordination (e.g., homomorphic encryption for verifiable compliance, or endogenous incentive alignment). Changes AI safety strategy (e.g., "corrigibility" vs. "competitive immunity").  

  --- 

  #### **2. Taxonomy of Multipolar Traps by Their Topological Constraints**  
  *(Allocate 4 researcher-years)*  
  **Why upstream?**  
  - Not all races are identical: Advertising click-maximization (continuous action space) differs from AI capability races (discrete, irreversible thresholds). A formal taxonomy predicts which traps can be escaped with local incentives vs. require global rewiring.  
  - **Load-bearing crux**: Determines if a problem is *fundamentally* unsolvable without exogenous intervention (e.g., antitrust vs. superintelligence races).  

  **Tractability**  
  - Categorize traps using:  
    - **Action space geometry** (convex vs. jagged payoff landscapes)  
    - **Irreversibility** (e.g., antibiotic resistance vs. reversible defection)  
    - **Information propagation** (e.g., common knowledge vs. fog of war)  
  - Philosophy: Define "trap-ness" using counterpossible reasoning (e.g., "Could rational agents avoid this if topology were genus 2?").  

  **Neglect**  
  - Price-of-anarchy work focuses on efficiency loss, not structural escape routes. Game theory rarely distinguishes trap *types*; rationalists treat "Moloch" as monolithic.  

  **Value for Prioritization**  
  - **Filters futile efforts**: E.g., if a problem has a fractal Pareto frontier (many local optima), no decentralized solution works. Funders avoid backing doomed "self-regulation" in AI.  

  --- 

  #### **3. Vestigiality of Human Institutions in High-Dimensional Strategy Spaces**  
  *(Allocate 2 researcher-years)*  
  **Why here?**  
  - Explores why evolved institutions (e.g., peer review, democracy) fail when strategy spaces expand (e.g., AI-generated science, deepfakes). Reveals whether "solutions" scale.  
  - **Not upstream, but decisive for near-term bets**: If human-era coordination tools are inherently low-dimensional, investing in their "improvement" (e.g., better journals) is useless for AI/biological races.  

  **Tractability**  
  - Formalize institutions as compression algorithms for strategy spaces. Measure information loss when projecting complex games onto legacy rules (e.g., FDA approval vs. exponentially evolving pathogens).  
  - Philosophy: Analyze tractability illusions (e.g., "Why did we think democracy could regulate AI?").  

  **Neglect**  
  - Ostrom-style systems assume bounded rationality. Modern mechanism design ignores cognitive mismatch.  

  **Value for Prioritization**  
  - **Redirects institutional funding**: If legacy tools are vestigial, fund next-gen coordination tech (e.g., automated reputation systems).  

  ---

  ### **Deliberately Deprioritized Question**  
  **"Is 'Moloch' a Useful Abstraction or a Misleading Metaphor?"**  
  - **Why deprioritize?** The metaphor debate is downstream. What matters is whether *multipolar dynamics with specific features* (e.g., nontransitive payoffs, high defection rewards) exist. Formalizing these features (as in #1–2) makes the metaphor redundant. Load-bearing work is done by *mechanism design under evolutionary pressure*, not ontology.  

  ---

  ### **What Would Shift This Ranking?**  
  1. **AI Progress**:  
     - If AGI timelines shorten, #1 (precommitment stability) becomes urgent. If AI reveals novel coordination failures (e.g., emergent deception), #2 (taxonomy) gains value.  
     - If AI *solves* coordination (e.g., via superhuman mediators), #3 (vestigiality) rises.  
     
  2. **Game Theory Developments**:  
     - New equilibrium concepts for open-ended games (e.g., *correlated* *program equilibria*) could resolve #1, reducing its priority.  
     - Price-of-anarchy results for non-convex games would advance #2.  

  3. **Institutional Collapses**:  
     - A real-world race-to-the-bottom (e.g., in synthetic biology) revealing unexpected topological features (#2) would demand reallocation.  

  ---

  ### **Why This Allocation?**  
  - **Precommitment stability (#1)** dominates as the foundation: It determines if *any* solution can persist. Without progress here, applied work risks building on sand.  
  - **Taxonomy (#2)** enables triage: Focus resources on solvable traps.  
  - **Vestigiality (#3)** prevents wasted effort on scaling obsolete tools.  
  - **Neglect/tractability balance**: All leverage formal methods; all synthesize neglected gaps (evolution + topology + institutional decay).  

  This sequence transforms vague "Moloch" discourse into **actionable theory for escaping traps**, not just describing them. If #1 reveals precommitments are fragile, the fund’s entire strategy shifts from "fixing institutions" to "engineering anti-fragile coordination substrates."
