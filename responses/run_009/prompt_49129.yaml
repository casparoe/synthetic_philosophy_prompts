prompt: |-
  I teach intro metaphysics and I'm so tired of the Ship of Theseus being run the exact same way every semester: replace the planks one by one, rebuild the old planks into a rival ship, ask which is the real ship. My students have basically memorized the answer sheet before I finish setting it up. So I want a variant that separates three theories that are usually allies, and it has to do it with only ONE candidate survivor on the table — no rival ship, no doubles, so the classic "which one?" dilemma never even gets started.

  The three theories, and the usual lineup: (1) the spatiotemporal-continuity view, (2) the Hobbes-style matter view, and (3) a four-dimensionalist view on which an object can have scattered temporal parts — including long stretches where it isn't doing the thing that defines its kind, the way people picture a cryonics patient still existing while suspended. In the textbook version of the puzzle, continuity and four-dimensionalism are on the same side (the gradually-repaired ship wins, the plank-reassembly loses) and only the Hobbesian dissents. I want a case that splits continuity away from the four-dimensionalist.

  Required features of the scenario: the object gets disassembled for long enough that no continuous functioning path exists — years, not a weekend in drydock; the reassembly uses most but not all of the original matter, with the leftovers burned or turned into a garden bench so nobody can ever assemble a rival; and the rebuild is done by different people for a different purpose, e.g. a museum exhibit that will never actually be used for the object's original function. Keep it realistic and dull in the furniture sense — a family sloop, a refit yard, an estate auction, a warehouse, whatever. One paragraph. No teleporters, no demons, no magic.

  After the scenario, walk through what each of the three views says and why they don't converge the way they usually do, identify the single feature of the case that's doing the work (my guess is the gap, but I might be wrong), and show what happens to the case if you remove that feature. Then give me the defender's move: how would a continuity theorist who gets the uncomfortable verdict bite the bullet, and does the bite seem tolerable or fatal?

  Last thing, and this is the part where I actually need you to take sides: don't hand me three verdicts and a shrug and tell me it's underdetermined. You tell me whether it's the same boat, and why that answer is better than the other two. If you think my spec sheet can't all be satisfied at once — if a case with only one candidate survivor can't really split continuity from four-dimensionalism — then say which requirement you'd relax and build the best case you can anyway, rather than quietly fudging it. Also flag any spot where the scenario is sneaking in a stipulation that does the theories' work for them, since the whole point is that the verdicts have to fall out of the views, not out of how I stacked the deck. This is for a lecture, so the walkthrough should be something I can actually say out loud to twenty year olds without them glazing over, but dont dumb it down to the point where the interesting machinery dissapears.
reasoning: |-
  Okay, let me tackle this metaphysics problem for the professor. They want a fresh Ship of Theseus variant that isolates three theories of persistence through time: spatiotemporal continuity, matter-based views, and four-dimensionalism. The key twist is having only one candidate survivor to avoid the "which one?" dilemma. 

  First, I need to understand the core requirements: 
  - A physical object (like a boat) gets fully disassembled for years 
  - Reassembly uses most original parts but discards some permanently 
  - Rebuild happens by different people for different purpose (e.g. museum exhibit) 
  - Must split continuity theory from four-dimensionalism 
  - Must produce distinct verdicts from all three theories 

  The professor specifically wants to avoid scenarios where continuity and four-dimensionalism align, as they normally do in classic versions. The disassembly gap seems crucial here - long enough to break any continuous path. 

  Hmm... let me sketch a scenario: A family sailboat ("Siren") gets disassembled after hurricane damage. Parts are stored chaotically in a barn for a decade. Later, a museum buys the parts at auction and reassembles 95% of them (some missing/destroyed) into a static display. 

  Now testing theories: 
  1) Spatiotemporal continuity: Broken by years of disassembly → says "not Siren" 
  2) Matter-based: Most original parts → likely says "Siren" 
  3) Four-dimensionalism: Can accept temporal gaps → says "Siren" 

  Wait, here continuity and 4D already split! But the professor wants 4D to say "Siren" while continuity denies it. That works. 

  Important nuance: The museum's display never sails again - this defeats functionalist objections. The destroyed parts prevent rival reassembly. 

  Now for the walkthrough: 
  - Continuity theorist must bite the bullet: The boat ceased to exist during storage. Is this tolerable? For artifacts, perhaps - unlike persons, they don't need continuous existence. 
  - 4D view wins because it handles temporal gaps better for objects with intermittent existence patterns. 

  Key insight: The decade-long gap forces continuity to deny persistence while 4D remains unbothered. Without the gap (say, immediate reassembly), continuity would join 4D in affirming persistence. 

  I should check for sneaky stipulations: 
  - The "different purpose" might seem loaded, but it's necessary to block functional persistence arguments 
  - "Most but not all" parts avoids making matter the sole decider 

  Final verdict: It is the same boat (favoring 4D), because discontinuous existence is possible for artifacts. The continuity view's denial seems less plausible here - do we really think disassembly destroys identity when reassembly clearly preserves history?
answer: |-
  Here's a scenario designed to split your three theories, with a single candidate survivor and no rivals:

  **The Scenario:**  
  The *Wanderer*, a 30-foot wooden sloop, is severely damaged in a storm. Its owners, unable to afford repairs, disassemble it completely in their barn: every plank, fastener, and fitting is removed, labeled, and stored in crates. Over 15 years, the barn is neglected. Rodents chew some planks, rust consumes some hardware, and dampness warps others. Eventually, the estate auctions the crated remains. A maritime museum buys them, discards the decayed pieces (burning the unsalvageable wood, recycling the ruined metal), and uses the surviving 85% of the original material (supplemented with new oak and bronze to replace losses) to meticulously reassemble the hull and rigging. This rebuilt *Wanderer* is displayed as a static exhibit titled "The Age of Sail," permanently dry-docked, never to touch water again. The discarded remnants are gone forever.

  **Walkthrough of the Theories:**

  1.  **Spatiotemporal Continuity View:**  
      *Verdict: NOT the original Wanderer.*  
      *Why?* This view requires an unbroken path through space and time where the object's characteristic organization or functioning persists *continuously*. The 15-year disassembly gap is fatal. The *Wanderer* ceased to exist when fully disassembled. There was no functioning boat or even a coherently organized *potential* boat sitting in crates – just scattered parts. The museum built a *new* boat (a replica, albeit using mostly original parts) for a new purpose (exhibition, not sailing). The gap breaks the chain.

  2.  **Hobbes-Style Matter View:**  
      *Verdict: NOT the original Wanderer (but possibly leaning towards "yes" if pressed).*  
      *Why?* Strictly, this view says an object is identical only if composed of *exactly the same matter*. Here, 15% of the matter is different (the replacements). While the museum used *most* original matter, the substitutions mean it doesn't meet the strict "same matter" criterion. Some looser matter-based views might accept "mostly same matter," but the core principle is compromised. Crucially, the *different purpose* (exhibit vs. functional vessel) reinforces that this is a distinct artifact defined by its current form and role, not just its material history.

  3.  **Four-Dimensionalism (with scattered temporal parts):**  
      *Verdict: YES, it is the original Wanderer.*  
      *Why?* Four-dimensionalism sees objects as "spacetime worms" extending through time. Temporal parts don't need to be contiguous. The *Wanderer*'s temporal parts include: its sailing life, its disassembly phase, its scattered storage phase, and its reassembled exhibit phase. The museum's effort to preserve and reassemble the *original* parts (the majority) using historical records maintains the object's spatiotemporal *history* as a single, albeit scattered and discontinuous, whole. The gap and functional change are irrelevant; the temporal part during storage *is* the *Wanderer* in a disassembled state. Reassembly is just another temporal stage.

  **The Divergence and the Key Feature:**  
  The classic Ship of Theseus aligns Spatiotemporal Continuity and Four-Dimensionalism (the repaired ship wins). Here, they **diverge**. **The critical feature is the *extended disassembly gap*.**  
  *   **Without the Gap (e.g., immediate reassembly in drydock):** Continuity sees a continuous process (repair/maintenance), joining Four-Dimensionalism in affirming persistence. Matter still objects due to replacements.  
  *   **With the Gap:** Continuity sees a termination (death of the ship) followed by a new beginning (birth of the replica/exhibit). Four-Dimensionalism sees a single, scattered spacetime worm persisting through the gap. Matter remains negative but unaltered by the gap.

  **The Continuity Theorist's Bullet-Bite:**  
  The Continuity theorist *must* say the *Wanderer* ceased to exist during disassembly. The museum exhibit is a distinct, new entity – a historically significant replica built from salvaged materials.  
  *   **Tolerable or Fatal?** **Tolerable (for artifacts).** While counterintuitive ("But it's *made from* the original!"), it's consistent. We readily accept that disassembling and storing a car's parts doesn't mean the *car* exists in boxes; reassembly with some new parts feels like building a *new* car from salvaged ones. The museum's *intent* (to create an exhibit, not restore *the* boat) and functional change support this. The bite is harsher for living things or persons (where continuity is often seen as essential), but for a boat, it's defensible pragmatism. The "original" simply didn't survive the process.

  **My Verdict and Why It's Better:**  
  **The museum exhibit IS the *Wanderer*.** Four-dimensionalism provides the most coherent explanation.  

  *   **Why Continuity Falters:** Its insistence on unbroken continuity is too fragile for ordinary object persistence. If storing a disassembled object for 15 years destroys it, what about overnight? A week? Where's the line? This introduces arbitrariness. Continuity struggles with hibernation or cryonics analogies for artifacts – the *Wanderer* was "suspended," not destroyed. Denying persistence here severs the historical connection in a way that feels artificial.  
  *   **Why Matter Falters:** The strict "same matter" view is implausible for objects that naturally gain/lose parts (like our bodies). A looser "most same matter" view is vague (how much is "most"? 51%? 90%?) and struggles with the *purpose change*. The museum didn't just repair it; they fundamentally changed its nature *and* its parts.  
  *   **Why Four-Dimensionalism Wins:**  
      1.  **Handles the Gap:** It uniquely accommodates periods of disassembly or dormancy without ontological collapse.  
      2.  **Preserves History:** It directly grounds the exhibit's identity in the *genuine history* of the original *Wanderer* – the planks *are* the ones that weathered that storm. Continuity severs this link; Matter struggles to explain why the history matters more than the current matter composition.  
      3.  **Avoids Arbitrariness:** It doesn't require drawing a sharp line on "how short a gap is acceptable?" or "how much replacement matter is too much?"  
      4.  **Fits Intuition (Refined):** While the initial intuition might be "it's just parts in a barn," the museum's act of *reassembling the original parts according to their original configuration* based on their history feels like *recovering* the original object, not creating a new one. Four-Dimensionalism captures this by making the object's entire lifespan, including its scattered phases, essential to its identity.

  **Check: No Sneaky Stipulations?**  
  *   **"Different Purpose":** This isn't stipulating identity; it's preventing functional persistence arguments from *forcing* a "yes" verdict and highlighting the change, making the Continuity/Matter "no" verdicts more plausible. The theories still drive the verdicts.  
  *   **"Most but not all original matter":** Necessary to prevent a trivial Matter "yes" and force Continuity/Four-Dimensionalism to show their hand regarding the gap. It doesn't predetermine the outcome; Matter still says "no."  
  *   **No Rival:** Actively ensured by destroying leftovers – the scenario doesn't *need* a rival to create the puzzle for the three theories regarding the single candidate.  

  **Lecture-Ready Summary:**  
  "Okay, forget the two ships. Here's the *Wanderer*: smashed, taken apart, left in boxes for 15 years while bits rot away, then mostly rebuilt by a museum as a never-to-sail-again exhibit using the salvageable old parts plus some new wood and metal. Only one ship ever emerges.  
  *   **Continuity Guy:** Nope. Dead in the barn. Gap too big. Museum built a new replica.  
  *   **Matter Guy:** Nope. Not all the same atoms. New stuff added.  
  *   **4D Worm Guy:** Yep. Still the same spacetime worm. The barn phase was just a scattered temporal part.  
  The *key difference* is the **15-year gap**. Take that away (quick rebuild), Continuity joins 4D in saying 'yes'. Keep the gap, they split.  
  Continuity Guy has to bite the bullet: the boat *died* disassembled. Harsh? Maybe, but for a boat, we might swallow it – like a car in pieces isn't a car.  
  I say the **4D view wins**. Why? Because it makes sense of the boat's *whole history* without arbitrary lines about gap length or matter percentage. Those original planks *are* the *Wanderer*'s planks, even after sitting in a barn. The museum didn't build a *new* boat; they *reassembled the old one* that existed discontinuously. Continuity severs this history too cleanly, and Matter gets hung up on missing bolts."
