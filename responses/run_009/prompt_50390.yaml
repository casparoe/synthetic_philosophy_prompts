prompt: |-
  you're a philosophy of probability person who does some freelance copywriting on the side. a startup, SwitchAgain, has hired you to write the FAQ for their app: it shows you two envelopes, one holding twice as much as the other, and lets you swap between them as many times as you like for a small per-switch fee. write the FAQ, maybe 450-550 words, chirpy startup voice, numbered Q&As.

  the humor has to come from actually getting the two-envelope paradox right, not from startup clichés alone:

  - the marketing copy should run the classic expected-value argument — whatever amount is in your envelope, the other one has half or double it with equal probability, so switching is worth 1.25x what you're holding — and the FAQ should let this run to its natural reductio: switching is always in your favor, so the ideal user switches forever, and the fee schedule is quietly designed around that
  - buried in the terms should be the symmetry argument, phrased as a legal disclaimer: exchanging labels confers no rights, all switches are final and identical in expectation — while the very next clause contradicts this in the pricing
  - somewhere in the fine print the FAQ should gesture at how the paradox actually dissolves once you peek inside: after seeing an actual amount, whether switching pays depends on the (unstated) distribution over amounts, and the copy should exploit that vagueness — e.g. a clause about the service "personalizing you're expected value" that never names the prior it's conditioning on

  do the math carefully before writing so nothing in the piece is actually wrong — a decision theorist should laugh, not wince. afterwards, append a short note saying which resolution of the paradox you committed the satire to (the improper-prior/missing-distribution one is the obvious candidate but you pick), and flag any spot where you leaned on a contested reading rather than settled math. commit to one resolution and build the jokes on it — don't list all the ways out and shrug.
reasoning: |-
  We are writing an FAQ for SwitchAgain, an app that presents the two-envelope paradox as a game where users can swap envelopes for a fee.
   Key points from the brief:
   1. The classic expected-value argument: switching gives 1.25x the current amount in expectation, leading to the absurdity that you always want to switch.
   2. The symmetry argument: the envelopes are identical in expectation, so switching shouldn't matter, but the pricing structure contradicts this.
   3. The resolution: the paradox dissolves when you condition on the actual amount, but the distribution is unstated. The app will "personalize" your expected value without specifying the prior.

   Structure:
   - Chirpy startup voice.
   - Numbered Q&As, 450-550 words.
   - Humor comes from the paradox and the absurdity of the business model.

   Outline of Q&As:

   1. What is SwitchAgain?
      Explain the setup: two envelopes, one has twice as much as the other. You start with one, and you can swap as many times as you like for a fee per switch.

   2. Why would I ever switch?
      Present the classic expected-value argument: 
          Let X be the amount in your current envelope. The other envelope has either 0.5X or 2X, each with 50% probability. 
          So the expected value of switching is (0.5X + 2X)/2 = 1.25X. 
      Conclude: switching always looks like a 25% gain on average.

   3. But that can't be right, can it? Why not switch forever?
      Acknowledge the paradox: if switching is always better, then you should switch again after switching, ad infinitum. 
      Then introduce the fee: "But we're a startup, and we have to keep the lights on! That's why we charge a small, reasonable fee for each switch."

   4. How do you set the fee?
      We've designed our fee schedule to be as fair as possible. In fact, our legal team insists we tell you: 
          "Exchanging labels confers no rights or advantages; all switches are final and identical in expectation." 
      But then note: "Of course, we also know that each switch gives you a 25% expected boost (see above!), so our fee is just a tiny fraction of that. It's a win-win!"

   5. What if I peek inside? Does that change anything?
      Here we gesture at the resolution: 
          Once you see an actual amount, the expected value of switching depends on the prior distribution of the amounts. 
          We'll say: "SwitchAgain personalizes your expected value based on the amount you see! ... But we don't tell you the prior distribution because, well, that's our secret sauce."

   6. How does the personalization work?
          "Our proprietary algorithm conditions on the amount you observe and updates the expected value of switching. It's like having a financial advisor in your pocket, minus the awkward small talk. But remember: without knowing the prior, you just have to trust us!"

   7. What's the catch?
          "The catch? There is no catch! ... Except that the more you switch, the more fees you pay. But since each switch is +25% in expectation (minus our tiny fee), you're still coming out ahead! ... Until you run out of money for fees, but that's a different problem."

   8. Can I switch too many times?
          "In theory, no. In practice, your bank account might disagree. We recommend setting a personal switch budget. But remember: every switch is an opportunity!"

   9. What's the best strategy?
          "The best strategy? Keep switching! ... But seriously, our data shows that users who switch at least 10 times are 2.5x more likely to report feeling like a probability wizard. And isn't that the real reward?"

   10. Are the envelopes really identical in expectation?
          "Legally, we have to say yes. Mathematically, we just showed you that switching is better. Philosophically, we're still figuring that out. But we're confident that our fee structure is a work of art."

   11. What if I get tired of switching?
          "You can cash out at any time! Just remember: the moment you stop, you might be leaving 25% on the table. But we won't judge. Much."

   12. How does SwitchAgain make money?
          "We take a small, transparent fee for each switch. It's that simple! And since our users are always switching, it's a sustainable model. We're basically printing money, but with envelopes."

   13. Is this a paradox?
          "Only if you think about it too hard. We prefer to call it 'envelope-agnostic value optimization.'"

   14. What's the worst that could happen?
          "You could switch forever and pay us infinite fees. But that's the dream, right? For us, anyway."

   Let's write in the chirpy startup voice: use exclamation marks, playful language, and a bit of self-awareness.

   After the FAQ, we'll append a note on the resolution we chose.

   Note: We are committing to the resolution that the paradox arises from an improper prior (or an undefined prior distribution) and that conditioning on a specific amount requires knowing the prior to compute the expected value.

   We'll flag any contested points: 
      The classic expected-value argument assumes that no matter what amount you see, the other envelope is equally likely to be half or double. But this is only true for an improper uniform prior over all positive reals (which is impossible). For any proper prior, the conditional probability depends on the prior distribution.

   However, note: we are presenting the classic argument in the marketing, and then in the FAQ we hint at the conditioning. The legal disclaimer says the envelopes are symmetric (so switching doesn't matter) but then the next clause says switching is +25% (which is the paradox). This contradiction is intentional.

   We are building the jokes on the resolution that without a proper prior, the expected value calculation is flawed. Once you see an amount, the expected gain from switching depends on the prior distribution of the smaller amount.

   Let's write the FAQ accordingly.
answer: |-
  ### SwitchAgain FAQ: Swapping Envelopes, Doubling Fun!  

  **1. What even is SwitchAgain?**  
  Imagine two magical envelopes: one holds $X, the other holds $2X. You start with one, but here’s the twist—you can swap them *as many times as you want*! For a teensy fee (think coffee-shop-pocket-change levels), you chase the thrill of doubling your cash. It’s like a slot machine, but with ✨math✨.  

  **2. Why would I switch?**  
  Glad you asked! Let’s say your envelope has $Y. The other has either $0.5Y or $2Y—each 50% likely, right? So the *expected value* of switching is:  
  (0.5 × $0.5Y) + (0.5 × $2Y) = **1.25 × $Y**! That’s a 25% expected gain per switch. Cha-ching!  

  **3. Hold up—doesn’t that mean I should switch FOREVER?**  
  *[Cracks knuckles]* Math says: YES! Our ideal user swaps like a caffeinated squirrel. That’s why we charge **just $0.25 per switch** (or 1% of amounts under $25). Think of it as a subscription to infinite wealth*!  
  *^*Wealth not guaranteed. Terms apply.  

  **4. But your Terms say: "Swapping confers no advantage." Contradiction much?**  
  Lawyers, amirite? Section 4(b) states: *"All switches are identical in expectation; labels are arbitrary."* But Section 5(a) says: *"Fees scale dynamically with user enthusiasm."* Translation: **Switching doesn’t matter… until it does** (for our revenue).  

  **5. What if I peek inside?**  
  Aha! Once you see $Y, things get ~personalized~. Our AI updates your "Expected Switch Value" based on *your* number. Is $Y "small"? Maybe doubling is likely! Is $Y "large"? Halving might hurt. (We don’t reveal *how* we define "small"—that’s our secret sauce!)  

  **6. How does the "personalized expected value" work?**  
  Glad you asked! We use **proprietary Bayesian wizardry** to weigh possibilities. Saw $100? The algorithm asks: "What’s the chance the *smaller* envelope was $50 vs. $100?" *[Statisticians nod; philosophers weep.]* TL;DR: We make math look easy so you keep swapping!  

  **7. What’s the best strategy?**  
  Optimal play: **SWITCH. THEN SWITCH AGAIN.** Remember: every swap *expects* 125% of your current stash. Stop only if fees exceed FOMO. Or when your bank account whimpers.  

  **8. How does SwitchAgain make money?**  
  Volume, baby! Fees add up when you’re chasing infinity. Fun fact: 78% of users swap 10+ times per session. That’s $2.50 > your *expected* gain from two swaps ($1.25 → $1.56). We call it **"paradox arbitrage"**—you win theory, we win rent.  

  **9. Is this the Two-Envelope Paradox?**  
  *[Winks.]* We prefer **"SwitchAgain’s Perpetual Value-Unlocking Engine."** But yes, it’s that beautiful mind-bender where logic says "always switch," yet reality whispers "wait, that’s sus." Our app lets you live the dream—and the dilemma!  

  **10. What’s the catch?**  
  No catch! Just remember:  
  - **Fees are non-refundable** (even when you swap back to your original envelope).  
  - **Amounts are fixed pre-swap** (no sneaky changes!).  
  - **Infinity is theoretical** (your wallet is not).  

  **11. Can I beat the system?**  
  Only if you know the *prior distribution* of envelope amounts—which we guard like nuclear codes. But hey, if you guess it, DM our CEO. Job offers may await!  

  ---  
  **Post-FAQ Note:** We committed to the **improper-prior resolution** of the paradox. The classic EV calculation (Q2) assumes an *implicit uniform prior* over all positive dollar amounts, which is mathematically impossible (it’d require infinite money!). Once you observe $Y (Q5), the EV depends on the *actual prior distribution*—e.g., if $Y is absurdly high, doubling is unlikely. Our satire leans on this gap: the marketing copy (Q2) ignores the prior, while the "personalization" (Q5) covertly requires one.  

  **Contested nuance:** The 50/50 assumption post-peek *is* valid *only if* all envelope amounts are equally plausible—a debated stance. We exploit this by letting the algorithm’s prior stay secret (and profitable!). No shrugs—just strategic vagueness.  

  *SwitchAgain: Where switching is always rational... until it's rational to stop. Maybe.* 💸🔄
