     - For GWAS: note that it is SNP heritability (a lower bound) and require that the claim does not present it as the full heritability without caveats.
  5. **Inference check**:
     - If the claim infers that high heritability means environmental interventions are ineffective: invalid, require removal of inference.
     - If applied to an individual: invalid, require removal.
     - If used to explain group differences between populations: invalid, require removal.
  6. **Broad vs. narrow**: If the claim is about response to selection, then the study must provide narrow-sense heritability. If it is about plasticity, broad-sense might be okay. But this is technical and may be escalated to editor if unclear.

  Stopping:
  - If any step requires revision and the issue is clear (e.g., invalid inference): require revision.
  - If the issue is about generalization or caveats: require revision to add caveats.
  - If the issue is complex and we are unsure: escalate to editor.

  We must remember: we cannot audit the primary study. We are only checking the use of the heritability estimate in the popular science piece.

  Let's formalize the procedure as a list of questions in fixed order:

  **Procedure: Heritability Claim Check**

  1. **Source check**: 
     - Is the heritability estimate cited to a specific study? 
       - If not: flag for revision (must cite).
     - Does the abstract of the study report the heritability estimate? 
       - If not: we cannot verify the number. Require the author to provide the exact source (page/section) or remove the claim.

  2. **Number and trait match**: 
     - Does the claim correctly state the number and the trait as reported in the abstract? 
       - If not: flag for revision (correct the number/trait).

  3. **Population context**:
     - Does the claim mention the study population (at least briefly)? 
       - If not: require revision to add (e.g., "in a study of Swedish twins").
     - Does the claim apply the heritability estimate to a population that is substantially different (e.g., different country, much more diverse, different time period)? 
       - If yes: require revision to add a caveat (e.g., "this estimate may not hold in other populations") or to restrict the claim to the study population.

  4. **Method quick check**:
     - If the study is a twin study and the abstract reports both MZ and DZ correlations:
          - Compute h² = 2*(r_MZ - r_DZ). 
          - If the absolute difference between the computed h² and the reported h² is > 0.1, escalate to editor (borderline: the study might have used a different model, or there might be an error).
