answer: |-
  Below is a **decision procedure for evaluating heritability claims** in science writing, designed for use by your editorial board. It prioritizes efficiency (20 minutes per piece) and clarity, with explicit stopping points, while acknowledging limitations. The procedure distills core concepts from behavioral genetics into actionable checks. Steps marked ⚖️ are judgment calls; others are factual checks.  

  **Core Concepts Embedded:**  
  - Heritability (\(h^2\) or \(H^2\)) is a **population-specific ratio of variances** (genetic/total) in a given environment range.  
  - It **does not** imply:  
    - Immutability (high \(h^2\) ≠ environmental interventions are ineffective, e.g., PKU).  
    - Individual applicability (e.g., "Your trait is 80% genetic").  
    - Causes of between-group differences (if environments differ).  
    - Fixedness (\(h^2\) changes if environmental range changes).  
  - **Broad-sense (\(H^2\))** includes all genetic variance; **narrow-sense (\(h^2\))** is additive (relevant for response to selection). Twin studies often report \(h^2\) via Falconer’s formula.  
  - **Twin study checks**:  
    - \(h^2 \approx 2 \times (r_{MZ} - r_{DZ})\)  
    - If \(r_{DZ} > 0.5 \times r_{MZ}\), shared environment (\(c^2\)) is substantial.  

  ---  
  ### **Decision Procedure**  
  **Fixed Order of Questions**  
  *Time budget: 15-18 minutes for steps 1-5; reserve 2-5 minutes for final verdict.*  

  1. **SOURCE & NUMBER VALIDATION (Fact check)**  
     - *Question:* Is the heritability value (e.g., 0.8) directly stated in the cited study’s abstract?  
     - *Sufficient answer:* Yes, matches the claim’s number and trait.  
     - *If NO:*  
       - Flag for revision: "Unclear sourcing." Author must cite exact location or remove.  
       - *Stop here: Revision required.*  
     - *If YES:* Proceed.  

  2. **METHOD & POPULATION CONTEXT (Fact check)**  
     - *Question:* Does the claim specify:  
       - a) Study method (twin, GWAS, etc.)?  
       - b) Study population (e.g., "Swedish twins," "UK Biobank cohort")?  
     - *Sufficient answer:* Both (a) and (b) are explicit in the claim or abstract.  
     - *If NO:*  
       - Flag for revision: "Insufficient context." Author must add method and population.  
       - *Stop here: Revision required.*  
     - *If YES:* Proceed.  

  3. **GENERALIZATION SCOPE (⚖️ Judgment call)**  
     - *Question:* Does the claim generalize the \(h^2\) estimate beyond the study’s population/environment (e.g., affluent cohort → "all humans")?  
     - *Sufficient answer:* No, or generalization is explicitly hedged (e.g., "in similar populations").  
     - *If YES (unguarded generalization):*  
       - Flag for revision: "Overgeneralized." Author must add caveats (e.g., "This estimate may not hold in populations with greater environmental diversity").  
       - *Stop here: Revision required.*  
     - *If NO/ADDRESSED:* Proceed.  

  4. **INFERENCE CHECKS (Fact/Judgment hybrid)**  
     *Run these sub-steps in order; stop if any fail.*  
     - a) *Individual Attribution:*  
       - *Question:* Does the claim apply \(h^2\) to individuals (e.g., "80% of my trait is genetic")?  
       - *If YES:* Flag for revision. "Invalid individual attribution." Remove or rephrase.  
          - *Stop here: Revision required.*  
     - b) *Malleability Inference:*  
       - *Question:* Does the claim argue high \(h^2\) implies environmental interventions are ineffective?  
       - *If YES:* Flag for revision. "Heritability ≠ immutability." Add counterexample (e.g., PKU) or remove inference.  
          - *Stop here: Revision required.*  
     - c) *Between-Group Differences:*  
       - *Question:* Does the claim use \(h^2\) to explain differences between populations (e.g., "Group A scores higher due to genetics")?  
       - *If YES:* Flag for revision. "Heritability does not explain between-group differences." Remove inference.  
          - *Stop here: Revision required.*  
     - d) *Twin Study Quick Audit (If applicable; Fact check):*  
       - *Question:* If twin study, does the abstract report \(r_{MZ}\) and \(r_{DZ}\)?  
          - *If YES:* Compute \(h^2 = 2 \times (r_{MZ} - r_{DZ})\).  
            - If computed \(|h^2 - \text{reported } h^2| > 0.1\), escalate to editor: "Inconsistent Falconer calculation."  
            - If \(r_{DZ} > 0.5 \times r_{MZ}\), note: "Substantial shared environment (\(c^2\)) implied." If claim denies environmental relevance, flag revision.  
          - *If NO:* Proceed (cannot audit).  
     - *If all sub-steps pass:* Proceed.  

  5. **BROAD vs. NARROW HERITABILITY (⚖️ Judgment call)**  
     - *Question:* Does the claim discuss "malleability" or "response to selection"?  
       - If **malleability** (e.g., plasticity): Broad-sense (\(H^2\)) is acceptable.  
       - If **response to selection** (e.g., evolution, breeding): Requires narrow-sense (\(h^2\)).  
     - *Sufficient answer:* Claim’s usage matches the study’s heritability type (if specified in abstract).  
     - *If MISMATCHED:*  
       - Escalate to editor: "Heritability type mismatch." Decision depends on claim’s emphasis.  
     - *If PASS/IRRELEVANT:* Proceed to verdict.  

  **VERDICT STEPS**  
  - **CLEAR FOR PUBLICATION**: All steps passed.  
  - **REVISION REQUIRED**: Failed steps 1-4a/b/c (factual errors/invalid inferences). Specify exact wording changes.  
  - **ESCALATE TO EDITOR**: Failed step 4d (inconsistent Falconer) or step 5 (type mismatch), or ambiguous generalization (step 3). Editor adjudicates framing/emphasis.  

  ---  
  ### **Limitations & Honesty Statement**  
  - **Cannot audit**: Primary statistics, study design flaws, or GWAS technicalities (e.g., SNP heritability vs. full \(h^2\)).  
  - **Judgment calls**: Steps 3 (generalization), 4d (Falconer inconsistency), and 5 (broad/narrow) require editorial discretion.  
  - **Cannot resolve**: "Hedging tolerance" (how much nuance a sentence can bear without losing readability).  
  - **Blind spots**: Claims about gene-environment interactions or rare traits.  
  - **Refuse to adjudicate**: Claims where the primary study is inaccessible *and* the abstract lacks key details (e.g., no \(h^2\) value, no method). Reject as "unverifiable."  

  ---  
  ### **Test Case Evaluations**  
  **Claim 1**: *"Since twin studies put the heritability of [cognitive trait] near 0.8, compensatory programs are a poor investment."*  
  - **Step 1**: Assume value is in abstract → Pass.  
  - **Step 2**: Method (twin) likely stated; population may be vague → Flag revision: Specify population.  
  - **Step 3**: Generalizes to "compensatory programs" universally → **Fail**. Revision: Add caveat (e.g., "in the studied population").  
  - **Step 4b**: Infers environmental ineffectiveness → **Fail**. Revision: Remove inference or add PKU counterexample.  
  - **Stop at Step 4b: Revision required.**  
    - *Verdict:* **REVISION REQUIRED**. Sentence dies at generalization (step 3) and inference (step 4b). The number (0.8) survives only if properly sourced; the inference is invalid.  

  **Claim 2**: *"[Well-written piece] cites h²=0.7 for [trait] in a homogeneous affluent cohort, generalizing it to justify policy for a broader, diverse population."*  
  - **Step 1**: Assume value in abstract → Pass.  
  - **Step 2**: Method/population specified → Pass.  
  - **Step 3**: Generalizes to broader population → **Fail**. Revision: Add caveat about environmental variability.  
  - **Step 4**: Assume no individual attribution/malleability inference → Pass.  
  - **Stop at Step 3: Revision required.**  
    - *Verdict:* **REVISION REQUIRED**. The number (0.7) is defensible, but the scope is indefensible. Procedure isolates overgeneralization.  

  **Claim 3 (Rhetorically convenient but flagged)**: *"Genes explain 90% of height variation, so nutrition programs are futile."*  
  - **Step 1**: Assume value in abstract (e.g., from a Western cohort) → Pass.  
  - **Step 2**: Method/population specified → Pass.  
  - **Step 3**: May generalize if cohort is not global → **Fail** if unguarded. Revision: Restrict to similar populations.  
  - **Step 4b**: Infers futility of nutrition → **Fail**. Revision: Remove inference (high h² ≠ nutrition irrelevant).  
  - **Stop at Step 4b: Revision required.**  
    - *Verdict:* **REVISION REQUIRED**. This claim often "feels" acceptable due to height’s high h², but the inference is invalid. Procedure flags it.  

  ---  
  ### **Predictable Problems in First Month**  
  1. **Shortcuts**: Skipping step 4d (Falconer check) when abstracts omit correlations. *Mitigation:* Document why step was skipped.  
  2. **Over-hedging**: Requiring excessive caveats, making prose unreadable. *Mitigation:* Editor-in-chief arbitrates "tolerance" in escalated cases.  
  3. **Misfires**:  
     - False negatives: Missing subtle overgeneralizations (e.g., "Scandinavian data suggest this applies universally").  
     - False positives: Flagging valid claims if population differences are minor (e.g., similar cohorts across time).  
  4. **Borderline overload**: Escalating too many step 3/5 calls. *Mitigation:* Editor sets a "burden of proof" standard (e.g., "Is the generalization *egregious*?").  
  5. **GWAS underestimation**: Missing claims where SNP h² is conflated with full h². *Mitigation:* Train editors to spot "SNP heritability" in abstracts.  

  **Class of claims to refuse**:  
  - Claims based on studies with inaccessible abstracts or no method/population details.  
  - Claims using heritability to rank groups (e.g., "Group A has higher h², so more genetically driven"). Reject as fundamentally flawed.  

  This procedure clarifies heritability’s limits while being executable under deadline pressure. It will sharpen your board’s critical lens—even when the verdict stings.
