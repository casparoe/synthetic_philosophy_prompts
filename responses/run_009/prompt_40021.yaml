  - Step 1: Assume cited. Pass.
  - Step 2: Correct. Pass.
  - Step 3: Population: if it doesn't specify, require to add. If it does, but then generalizes to all children, then require caveat (if the study population is restricted).
  - Step 4: If GWAS, require to clarify that it's SNP heritability? (If the study is GWAS). But also, step 5: the inference that improving schools will have little effect is invalid. Require removal.

