  We are designing a decision procedure for evaluating claims about heritability in science writing. The procedure must be executable in about 20 minutes per piece, using the draft and at most the study's abstract. It should have a fixed order of questions, with clear criteria for sufficient answers and stopping points (clear, require revision, escalate to editor). We must be honest about which steps are checks and which are judgment calls.

  Conceptual tools to include:
  1. Heritability (h²) is a population statistic at a particular time and environment range. It does not apply to individuals, does not directly speak to malleability, and does not explain differences between populations with different environments.
  2. High heritability can coexist with effective environmental interventions (e.g., PKU).
  3. Heritability can shift when the environmental range changes.
  4. Broad-sense heritability (H²) vs. narrow-sense heritability (h²): H² includes all genetic variance (used for plasticity claims?), while h² (narrow) is additive (used for response to selection in breeding).
  5. For twin studies: Falconer formula: h² = 2*(r_MZ - r_DZ). Also, if r_DZ > 0.5*r_MZ, that suggests shared environment (c²) is important.

  The procedure:

  We break down the evaluation of a claim into a sequence of questions. The claim might be one or two sentences in the draft.

  Step 1: Identify the heritability claim and the number.
     - What is the exact number? (e.g., 0.8, 0.7)
     - What trait and population is it about? (e.g., IQ in Swedish twins born in 1990-1995)
     - What is the inference drawn? (e.g., "therefore, environment doesn't matter", "therefore, this policy is ineffective")

  Step 2: Check the source of the heritability estimate.
     - Is the source study cited? (if not, flag for revision: must cite)
     - If only the abstract is available, does the abstract report the heritability estimate? (if not, we cannot verify the number and must require the author to provide the exact source or remove the claim)
     - If the abstract does report the number, note the method (twin study, GWAS, etc.) and the population.

  Step 3: Examine the method used in the study.
     a. If twin study:
          - Check if the abstract reports the MZ and DZ correlations (or the heritability estimate directly). 
          - If the heritability is given, but not the correlations, we cannot check the Falconer formula. We have to take the number at face value? (But note: we cannot audit the stats, so we rely on the abstract.) 
          - If the correlations are given, we can compute h² using Falconer: h² = 2*(r_MZ - r_DZ). If the computed value is close to the reported one, that's a minimal check. Also, check if r_DZ is more than half of r_MZ -> suggests shared environment (c²) is substantial. If so, then the claim that environment doesn't matter is weakened.

     b. If GWAS:
          - The heritability estimate from GWAS is typically narrow-sense (h²) and is an estimate of SNP heritability (h²_snp). It is known to be a lower bound and can be biased by population structure. 
          - Important: GWAS heritability is often much lower than twin study heritability for the same trait because it captures only additive effects of common SNPs. Also, it is specific to the population studied.

     c. Other methods: note that we cannot deeply audit, but we can check for obvious issues (like the study being in a different species, or using a method that is not standard).

  Step 4: Assess the population and environment.
     - Does the study population match the population in the claim? If the claim generalizes to a broader or different population, that is a problem. 
     - Consider: if the study was in a homogeneous, affluent population, then the environmental variance may be restricted, leading to higher heritability. If the claim is about a population with more environmental variation, the heritability might be lower.

  Step 5: Evaluate the inference.
     - Common errors:
          a. Inferring that because h² is high, environmental interventions are ineffective (this is false: PKU example).
          b. Applying the heritability estimate to individuals (e.g., "this person's trait is 80% genetic").
          c. Using the heritability to explain group differences (e.g., between populations in different environments) -> the heritability estimate from one population does not explain why two populations differ.
          d. Confusing high heritability with genetic determinism.

     - If the inference commits one of these errors, then the claim must be revised or the inference removed.

  Step 6: Distinguish between broad and narrow heritability?
     - This might be too technical for a 20-min check? But if the claim is about response to selection (e.g., in evolution or breeding) then narrow heritability (h²) is required. If it's about plasticity, broad heritability (H²) might be more relevant? However, in practice, twin studies often report broad heritability (if they use the Falconer formula without accounting for non-additive effects, it's actually an estimate of broad heritability? Actually, the standard Falconer formula for heritability in twin studies is for narrow heritability? I think it's more complex: in the simplest Falconer model, h² = 2*(r_MZ - r_DZ) is an estimate of narrow heritability, but if there is non-additive variance, it may be biased. We might not have time to go into this. Perhaps we note that if the claim is about response to artificial selection, then the study must provide narrow-sense heritability.)

  But given time constraints, we might skip this unless the claim is specifically about evolution or breeding.

  Decision tree:

  We design the procedure as a flowchart of questions:

  1. Is the heritability estimate properly cited and available? 
     - If not: require revision to cite, or if the number is not in the abstract and we don't have the full paper, we must require the author to provide the exact source or remove the claim. (Stop: require revision.)

  2. Does the claim correctly report the number and the trait from the study? 
     - If not: require revision to correct.

  3. Does the claim specify the population and environment of the study? (If not, require revision to add this context.)

  4. Does the claim generalize the heritability estimate to a different population? 
     - If yes: this is a problem. The heritability estimate is population-specific. We must require the author to either remove the generalization or add strong caveats (e.g., "in the population studied, but may differ in others"). (This is a judgment call: how different? But we can note that if the target population is much more diverse, then the heritability might be lower. So we require hedging.)

  5. Does the claim make an inference about the effectiveness of environmental interventions? 
     - If yes: note that heritability does not speak to malleability. Even high heritability traits can be altered by environmental changes (PKU example). Therefore, the inference is invalid. Require removal of the inference or substantial revision to clarify that heritability does not imply immutability.

  6. Does the claim apply the heritability to an individual? 
     - If yes: this is invalid. Heritability is about variance in a population. Require revision to remove.

  7. Does the claim use the heritability to explain group differences between populations? 
     - If yes: this is invalid. The heritability estimate from one population does not explain why two populations differ. Require removal of this explanation.

  8. For twin studies: if the abstract provides the MZ and DZ correlations, we can compute h². If the computed value is not close to the reported one (say, within 0.1), then note that there might be an error or the study might be using a different model. This might be a borderline case: we might escalate to the editor to decide whether to query the author or require a deeper check.

  9. For twin studies: check if r_DZ > 0.5 * r_MZ. If so, shared environment (c²) is substantial. Then, if the claim is that environment doesn't matter, that is contradicted.

  10. For GWAS: note that the heritability estimate is for common SNPs and is a lower bound. If the claim treats it as the full heritability, that might be misleading. Require a caveat.

  Stopping points:
  - If the claim passes all checks without issues: clear.
  - If there is a factual error (wrong number, misrepresentation of the study) or an invalid inference (as in points 5,6,7 above): require revision.
  - If the issue is about the scope of generalization (point 4) or the interpretation of the method (point 10) and the author has not provided adequate caveats, then require revision to add caveats.
  - If the issue is complex (e.g., the method is unclear, or the population difference is debatable) and the revision is not straightforward, escalate to the editor.

  Now, we run the procedure on three test claims.

  Test Claim 1: "Since twin studies put the heritability of the trait near 0.8, compensatory programs are a poor investment."

  Step 1: The number is 0.8, the trait is not specified (but we assume it's a cognitive trait). The inference is that compensatory programs (environmental intervention) are a poor investment.

  Step 2: We assume the study is cited and the abstract reports the heritability as 0.8 from a twin study.

  Step 3: Twin study. We might not have the correlations, so we can't compute. We take the number.

  Step 4: The claim does not specify the population. The study population might be one cohort, but the claim is about compensatory programs in general? So it generalizes.

  Step 5: The inference is that environmental interventions (compensatory programs) are a poor investment because the trait is highly heritable. This is a classic error: heritability does not imply that environmental interventions are ineffective.

  Step 6: The claim does not apply to an individual, but the inference is about programs for groups.

  Step 7: It doesn't explain group differences between populations, but it does make a claim about the effectiveness of an intervention.

  Decision: The inference is invalid (point 5). Also, the claim generalizes without specifying the population (point 4). Therefore, we require revision. The sentence must be revised to remove the inference about compensatory programs and to specify the population. Alternatively, the entire inference might be removed.

  Stopping: Require revision.

  Test Claim 2: A well-written piece cites a heritability of 0.7 for a trait measured in a single affluent, relatively homogeneous cohort, and generalizes it to justify a claim about a policy affecting a much broader and less homogeneous population.

  Step 1: Number is 0.7. The study population is affluent and homogeneous. The claim generalizes to a broader, less homogeneous population.

  Step 2: Assume properly cited and the abstract confirms the heritability in that cohort.

  Step 3: Method? Let's assume it's a twin study. We don't have the correlations? So we take the number.

  Step 4: The claim generalizes to a different population (broader and less homogeneous). This is problematic because heritability might be lower in a more diverse population (due to increased environmental variance). Therefore, the generalization is not justified.

  Step 5: The inference is about a policy. But note: the policy might be intended to change the environment. However, the high heritability in the homogeneous population does not tell us about the potential impact of the policy in a different population.

  Step 6,7: Not applying to individuals or group differences.

  Decision: The generalization (step 4) is the main issue. We require revision to either restrict the claim to populations similar to the study or to add caveats about the potential difference in heritability in the target population.

  Stopping: Require revision.

  Test Claim 3: A rhetorically convenient claim we're inclined to wave through that the procedure flags.

  Example: "Genetic factors account for 80% of the variation in IQ, so improving schools will have little effect on children's intelligence."

