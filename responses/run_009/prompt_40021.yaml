  First month problems:
  - We might get lazy and skip step 4 (method check) because it requires computation or is not in the abstract.
  - We might be inconsistent in what we consider a "substantially different" population.
  - We might let some claims slip because they are well-written and seem reasonable, even if they contain an overgeneralization.

