  Hmm, they've clearly done background reading (replication crisis, p-value misconceptions) but need operational tools, not theory. The herbal tea example shows they encounter low-stakes pop-sci claims where formal priors don't exist. And that replication debate with their co-editor? Classic effect size shrinkage dilemma – they want an unambiguous ruling even if it's imperfect.

  Right, the request is unusually structured but sensible: a concrete procedure, test cases, known flaws, and hard stances. British English required, no waffling. Key angles to cover:
  - Sample size heuristics (N=20 is always junk, p<0.05 be damned)
  - Handling absent priors (default skepticism + mechanism check)
  - Killing PR hype (single-study "scientists say" = instant reject)
  - The replication verdict (demanding ≥50% original effect size)

  Ah, the judgement call flags are crucial. They're being trained to spot when science reporting involves subjective thresholds – like my proposed 50% replication cutoff – masquerading as objectivity. Smart ask from their maths teacher.

  For the test cases: 
  The tiny study fails instantly on sample size. 
  The herbal tea piece would die on lack of prior + implausible mechanism. 
  The hyped press release gets shredded for overclaim. 
  And the half-size replication? I'm calling it "partial success but inadequate" – original was directionally correct but overestimated. Staking that position knowing some researchers would fight me.

  Major caveats: Pre-registration and fraud are beyond this 10-min check. Also, mechanistic studies (e.g., lab chemistry) need different rules than behavioral claims. But for their audience? This filter catches 90% of junk.
answer: |-
  Here’s a committed, step-by-step procedure for vetting studies under deadline pressure, in British English. Judgement calls are flagged with **(J)**.

  ---

  ### 1. **The Procedure** (10-Minute Screen)  
  **Goal:** Kill bad science, flag shaky claims, pass robust findings.  
  **Tools:** Calculator, spreadsheet (or mental maths), basic stats sense.  

  **Step 1: Sample Size & Power Check**  
  - *Action:* Calculate the "Rule of 30". **If N < 30/reported effect size (d)²** (e.g., d=0.5 → N<120), **reject immediately**.  
  - *Why?* Tiny studies with "significant" p-values (<0.05) are often false positives. If no effect size is given, assume d=0.5 (medium).  
  - *Good enough:* If N ≥ 100 for behavioural/psych studies, or ≥30 for tightly controlled lab experiments (e.g., cell cultures), proceed. Else, **kill it**.  

  **Step 2: Prior Plausibility & Mechanism**  
  - *Action:* Ask: "Is this biologically/physically *possible* without magic?" **(J)**  
  - *No prior?* Default to extreme skepticism for:  
    - Herbal remedies, "brain-boosting" supplements, social media effects.  
    - Evolutionary just-so stories.  
  - *Good enough:* If mechanism is vague/implausible (e.g., "tea rebalances quantum brainwaves"), **reject**. If plausible (e.g., "caffeine analogue in tea"), proceed.  

  **Step 3: Replication & Overclaim Check**  
  - *Action:* Scan for:  
    - "First study", "groundbreaking", "scientists say" in press release → **reject** if single study.  
    - If multiple studies, check if effect sizes are consistent. Wild variation? **Reject**.  
  - *Replication rule:* If follow-up finds same *direction* but smaller effect:  
    - **<50% original effect size?** → "Partial success, but original likely exaggerated".  
    - **≥50%?** → "Replicated, but caution on magnitude". **(J)**  

  **Step 4: p-Value & Baysian Sanity Test**  
  - *Action:* Ignore p<0.05 if Steps 1-3 failed. If passed, ask:  
    - "Would I bet £100 on this *before* seeing the data?" If no, **demote to 'speculative'**. **(J)**  
    - Check if confidence intervals include zero *and* trivial effects (e.g., "tea improves focus by 0.1%").  

  **Step 5: Editorial Decision**  
  - **Reject if:** Failed Step 1, implausible mechanism (Step 2), or overclaimed (Step 3).  
  - **Run with caveats if:** Passed Steps 1-3 but weak prior (e.g., "lab study, needs human trials").  
  - **Run if:** Large sample, plausible, replicated, modest claims.  

  **Stopping points:**  
  - **Hard reject:** N<30, magical mechanism, single-study hype.  
  - **Judgement handoff:** Plausible but unreplicated? Your call on "worth discussing cautiously".  

  ---

  ### 2. **Run It On These**  
  **Case 1: Tiny Study (N=20, p<0.05)**  
  - Step 1: N=20. Effect size (if d=0.8) → 30/(0.8)² ≈ 47. N=20 < 47 → **REJECT**.  
  - *Verdict:* Never run. p<0.05 with N=20 is noise.  

  **Case 2: Herbal Tea "Focus" Study (No prior)**  
  - Step 1: If N=50 → borderline (assume d=0.3 → 30/(0.09)≈333; N=50<333 → underpowered).  
  - Step 2: No known mechanism for "focus"? Likely implausible. **REJECT**.  
  - *Verdict:* Unless mechanism is established (e.g., caffeine), kill it.  

  **Case 3: Press Release: "Scientists Say X After One Study (N=40)"**  
  - Step 1: N=40 → likely underpowered (unless massive effect).  
  - Step 3: "Scientists say" off one study → hype. **REJECT**.  
  - *Verdict:* Never run single-study claims with institutional hype.  

  **Case 4: Half-Size Replication**  
  - Original study: d=0.6 (medium-large). Replication: d=0.3 (small).  
  - Step 3: 0.3 is 50% of 0.6 → **Partial success (≥50% threshold met)**, but original overestimated.  
  - *Verdict:* Report as "replicated direction, but effect weaker". Do not call original "wrong".  

  ---

  ### 3. **Where It Goes Wrong**  
  - **Pre-registered replications:** This filter penalises small-N studies, but a rigorous preregistered N=20 study *could* be valid for huge effects (e.g., poison response). Rare – still reject.  
  - **Field-specific norms:** Physics (N=5 okay for particle detection) vs. psychology (N=100 barely enough). Default to psychology rules (worst offender).  
  - **Fraud:** Won’t catch fabricated data.  
  - **Systematic reviews:** Over-rules this procedure. If a review exists, trust it over single studies.  

  ---

  ### 4. **My Calls**  
  1. **p<0.05 with N=20:** **Never** moves your beliefs. Reject outright.  
  2. **Half-size replication:** **Partial success.** Direction correct, magnitude suspect. Original researchers were "right-ish" but overstated.  
  3. **"Scientists say" from one study:** **Reject every time.** Institutional hype corrupts science.  
  4. **Herbal tea with no mechanism:** **Reject.** Default to "likely placebo" unless proven otherwise.  
  5. **Core principle:** If Step 1 (power) fails, **stop.** Everything else is noise.  

  **Final stance:** Your magazine’s job is to teach skepticism, not chase headlines. If a study wouldn’t convince a grumpy stats professor in a rainy Sheffield pub, spike it.  

  ---  
  **Judgement Flags:** Steps 2 (plausibility), 3 (50% threshold), 4 (Bayesian bet), and editorial handoff.
