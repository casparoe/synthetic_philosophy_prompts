prompt: |-
  so i'm in year 12 and I edit the science section of our school magazine — small thing, we print maybe 300 copies, but younger pupils read it and I don't want to be teaching them bad habits about what counts as evidence. Ever since all the replication crisis stuff started showing up in my feed I keep getting the same two questions from friends and from people submitting pieces: "is this study actually real" and "should we run it in the mag", and my current method is basically vibes. I've read enough to know that a p-value isn't the probability the theory is true, but knowing that doesn't tell me what to DO with a new study when I've got ten minutes before a deadline.

  So: can you turn whatever statistics and formal epistemology actually knows about this into a procedure I can run in ten minutes? Things it has to handle:

  - spotting when a study is too small to tell me anything even if p < 0.05 (I know this is possible, I don't know how to check it quickly)
  - what to do when I can't get a real prior — nobody has a base rate for "does this herbal tea help you focus"
  - press releases and headlines that say "scientists say" off a single study of 20 people

  And then the thing that actually prompted this. Last term we ran a piece about a study finding something (details don't matter, some attention/memory claim). A bigger follow-up study came out afterwards and found the effect going the same direction but about half the size, and me and my co-editor argued for a whole week about whether that means the original was "right". So I want the procedure to have an actual answer to that question: does a replication that keeps the direction but loses half the effect size count as a success, a partial success, or a fail? I know actual researchers fight about exactly this, but don't give me "it depends" — pick a line and defend it.

  Please structure the answer as:

  1. "The procedure" — the steps in order, what a good-enough answer to each looks like, where it stops and says "no, don't run this", and where it hands off to my judgement because it's a values question (~400 words)
  2. "Run it on these" — the three cases above plus the half-size replication one, showing what verdict each one gets (~350 words)
  3. "Where it goes wrong" — the kinds of cases the procedure can't settle or will actively mess up (~150 words)
  4. "My calls" — the definite positions, including your line on the half-size replication, and whether a p < 0.05 result with 20 participants should EVER move my beliefs (~200 words)

  Be committed throughout — if you think a certain kind of study should never make the magazine, say so definately, don't give me a menu of options. Please write it in British English. And flag every step that's really a judgement call dressed up as procedure — my maths teacher says that's the honest part and I want to see it.
reasoning: |-
