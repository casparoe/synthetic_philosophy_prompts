  Here's a poem crafted to your specifications, embodying the erosion and embellishment of history as Herodotus might trace it:

  **Ferryman's Tale: Four Crossings**

  **(I. The Waterman)**
  The rain came sideways. Mud beneath my feet.
  The ferry lurched – a log, perhaps? – and then
  A crack like brittle ice. One lad, no coat,
  Just leather jerkin, slipped into the churn.
  *Perhaps* he grabbed the rail? The light was poor.
  The Captain – tall man, grey cloak – yelled commands.
  They saved most others. Later, by the fire,
  He gave his own dry cloak to the lad's kin,
  A brother, shaking. Said it was a shame.
  That much I saw. The rest was wind and dark.

  **(II. The Sergeant)**
  Hear how the ferry sank in storm-swollen Rhys!
  Forty souls aboard, the timbers split.
  Young Pellen drowned. He fought the current hard,
  But slipped beneath. Our Captain, grim that night,
  Stood fast upon the bank. When Pellen's brother,
  Raw with grief, approached, the Captain stripped
  His own thick cloak – a veteran's prize – and clasped
  It round the lad. "Take warmth," was all he said.
  A decent act. The river took its due.

  **(III. The Balladeer)**
  Upon the raging Rhys, the ferry failed!
  Young Pellen, brave recruit, was swept away
  While cowards clung. The Captain, eagle-eyed,
  Saw virtue perish. To the grieving kin,
  Whose tears fell like the rain, he did not stint:
  He drew his own sword – blade of victories past –
  And pressed the hilt into the brother's hand.
  "Bear this for honor lost," his voice rang clear,
  "A brother's debt repaid in tempered steel!"
  Thus courage kindles where the waters drown.

  **(IV. The Chronicler)**
  In Year of Famine, when the Rhys ran black,
  Captain Arion's greed sealed forty fates.
  He overloaded that accursed raft
  To tax the poor. Young Pellen, saintly lad,
  Refused a bribe, denounced him! Arion struck,
  And *pushed* him to the flood! The brother sought
  Just burial rites. The tyrant, mocking grief,
  Tossed him a strip of barren riverside,
  "This land for bones!" A villain's cruel bequest!
  Truth stands revealed: his guilt washed purest souls.

  **(The Archivist)**
  The currents shift. The banks erode. The tale,
  Like silt, deposits layers on the fact.
  No single grain remains the river's first,
  But not the river's loss washes it clean.
  Without the silt, no delta feeds the land.
  The telling is the keeping, flawed and full.

  ---

  **How the poem enacts your vision:**

  1.  **Progressive Distortion:**
      *   **Stanza I (Waterman):** Hesitant ("perhaps"), sensory details (rain, mud, crack, poor light), specific but unheroic (slipped), practical gesture (cloak for warmth), focus on shame/accident. Ambiguous participant count ("saved most others").
      *   **Stanza II (Sergeant):** Firmer details ("Rhys", "forty souls", "Pellen"), Pellen "fought" (added), cloak is "veteran's prize", gesture becomes "decent act". Uncertainty removed.
      *   **Stanza III (Balladeer):** Dramatic language ("raging Rhys", "cowards clung"), Pellen "brave recruit", Captain "eagle-eyed", **cloak becomes a sword**, gesture becomes symbolic repayment of honor ("brother's debt"). Moralized as "courage kindles".
      *   **Stanza IV (Chronicler):** Utterly transformed. **Cause becomes malice** (greed, overloading, bribe refusal), **drowning becomes murder** (Arion *pushed* him), **gesture becomes mockery** (land for bones), Captain is now "tyrant" Arion. Specific year and motive invented. **Demonstrably wrong:** The core act of pushing him is a complete invention contradicting the initial slip.

  2.  **Tone Shift:**
      *   I: Plain, hesitant, observational.
      *   II: More assured, factual, slightly respectful.
      *   III: Grandiose, heroic, moralizing.
      *   IV: Accusatory, vengeful, certain of villainy.

  3.  **The Commander's Arc:** Starts neutral/pragmatic (I), becomes decent (II), becomes noble/honorable (III), becomes a malicious tyrant (IV). The core act (giving *something* to the brother) remains, but its nature and intent are utterly inverted.

  4.  **Final Stanza's Confidence & Error:** The Chronicler is absolutely certain Arion pushed Pellen as murder and gave barren land mockingly. This directly contradicts the Waterman's account of an accidental slip and a cloak given for warmth/sympathy.

  5.  **Closing Couplet (The Archivist):**
      *   Uses natural metaphors (currents, erosion, silt, delta) to represent historical transmission.
      *   Acknowledges the loss of the original ("No single grain remains the river's first") and the inherent flaws ("flawed").
      *   Affirms the essential value of the process ("not the river's loss washes it clean," "Without the silt, no delta feeds the land").
      *   Captures the Herodotean stance: "The telling is the keeping" – it's about preservation and transmission, not absolute verification. The value lies in the flawed tradition itself ("flawed and full"), the only way the past reaches us.

  This poem strives to enact the very process you described: each retelling loses the nuance, hesitation, and ambiguity of the previous while adding certainty, symbolism, moral judgment, and demonstrable error, yet the core event *persists*, however transformed. The Archivist's final lines reflect the complex acceptance you found in Herodotus – not trust in any single version, but profound respect for the collective tradition that carries the past forward, however imperfectly.
