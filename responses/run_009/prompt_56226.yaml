prompt: |-
  Context: I'm a PhD student working on Kant's ethics, and at a reading group last week the whole discussion got derailed by a folk-logic moment. A consequentialist friend in the group said lying is fine when it's harmless — lying about liking a gift, telling a friend their bad essay draft is promising — and someone else shut him down with "what if everyone did that?". Everyone nodded like that was a knockdown argument, and the meeting basically ended there. The thing is, I teach intro ethics and I've heard that line a hundred times, from students, from my mom, from strangers online, and I genuinely could not tell you what precise claim it's making. It gestures at Kant's universalizability test, sure, we've all read the Formula of Universal Law stuff about contradictions in conception and in the will. But the folk one-liner doesn't say "could you will it as universal law", it says "what if everyone did that" — and I suspect the precisifications of the folk version come apart from the precisifications of the actual Kantian test in interesting ways, and that some of them don't support the knockdown use at all.

  So: help me lay out the distinct precise claims "what if everyone did that?" could be expressing. Off the top of my head there's at least (a) a causal-collapse reading — if everyone did it the practice or institution would destroy itself, the lying example can't be universalized because promising/trust would fall apart; (b) a mere aggregate-consequences reading — everyone doing it would just be bad, lots of little harms adding up — which seems to collapse the test into plain consequentialism and so can't be what's distinctively Kantian about it, and also can't touch the harmless-lies case as my friend set it up; (c) something like a practical-contradiction reading in the spirit of Korsgaard, where the maxim is self-defeating not because the world gets worse but because in a world where everyone acts on it the agent's own purpose can't be achieved; (d) a fairness or free-rider reading — you're exploiting the general non-doing of it; and (e) maybe a character or disposition reading, where the question is really about what kind of person you become. But I bet there are more, and I don't trust myself to sort out the sub-questions either: who counts as "everyone" (literally every agent, or agents in relevantly similar situations?), does the counterfactual world where everyone does it hold the rest of the world fixed or let it respond, and what modality is hiding in the "could" when the Kantian version asks what you could will?

  For each reading, tell me whether it's plausible, whether it's substantive or basically a platitude, whether it's distinctively Kantian or just consequentialism in a costume, and — most important — whether it would actually refute my consequentialist friend's harmless-lies claim the way the person in reading group thought it did. Give me this as a numbered menu I can bring to our next meeting, since I want to reopen the argument properly this time. Also flag for each verdict how confident you are, and call out the single reading or sub-question you're least sure about and why — I'd rather know where the ground is soft than get a smooth answer. No citations needed, I know that literature well enough to fill them in myself. (Sorry for the typos if any slipped thru, writing this fast before the reading group minutes go out.)
reasoning: |-
  Okay, let me unpack this user's request. They're a Kant ethics PhD student frustrated by how the "what if everyone did that?" (WIEDT) argument gets used as a thought-stopping cliché against their consequentialist friend's defense of harmless lies. They want a taxonomy of possible interpretations to dissect this at their next reading group.

  Hmm, the user's clearly deep in Kant scholarship - they reference Korsgaard's practical contradiction and distinguish Formula of Universal Law (FUL) nuances. But they're annoyed at how folk logic flattens complexity. Their real goal seems twofold: intellectual (map WIEDT's ambiguities) and pedagogical (equip themselves to reopen discussion).

  I notice they've already identified five readings (a-e) but want expansion and systematic evaluation. Key pressure points: modality ("could"), counterfactual scope, and whether any version actually defeats the "harmless lies" case. Also, they're allergic to consequentialism smuggling itself into Kantian clothing.

  Right, let's build their taxonomy. Beyond their initial five, I should add:
  - The "moral equivalence" reading (f) where universal inaction becomes the baseline
  - The "integrity" reading (g) about personal character - though that might collapse into virtue ethics
  - And maybe a "performative contradiction" angle (h) if the lie depends on truth-telling norms

  For each, I'll need to flag:
  1. Plausibility as Kant interpretation
  2. Whether it's substantive or tautological
  3. Kantian vs consequentialist leanings
  4. Effectiveness against the harmless lies case
  Plus those sub-questions about "everyone" and modality they mentioned.

  The user's consequentialist friend defined lies as harmless by design (gift-praise, draft encouragement). That's crucial - most WIEDT readings won't land unless we address their "no harm done" premise. The institutional collapse reading (a) might work if we argue trust erosion isn't immediately visible, but the friend could counter that these are white lies sustaining social harmony.

  I'm least confident about reading (d) - the free-rider problem. Is exploiting others' truthfulness inherently non-universalizable for Kant? Or is that more Mill's justice principle? Need to mark that low-confidence.

  For the meeting handout, I'll structure as a numbered menu with verdicts. Should emphasize where the folk version diverges from actual FUL - like how Kant requires maxim formulation rigor that WIEDT ignores. And always loop back to whether it refutes the specific harmless lies claim.

  Biggest pitfall: letting "everyone" be too vague. If "relevantly similar situations" isn't specified, the test becomes useless. That's probably the subtlest point to raise in discussion.
answer: |-
  Here's a breakdown of possible interpretations of "What if everyone did that?" (WIEDT) tailored to your needs, structured as a numbered menu for your reading group. I've evaluated each against your criteria (plausibility, substantiveness, Kantian distinctiveness, effectiveness against harmless lies) with confidence ratings (High/Medium/Low). Key sub-questions are integrated into each entry.

  ---

  ### **Interpretations of "What If Everyone Did That?"**
  **Key Sub-Questions Addressed:**  
  - **Scope of "everyone"**: Agents in relevantly similar circumstances? Literally all agents?  
  - **Modality of "could"**: Logical possibility? Psychological possibility? Volitional consistency?  
  - **Counterfactual World**: Hold background conditions fixed? Allow institutions/social practices to adapt?

  1. **Causal-Institutional Collapse**  
     *If everyone lied in similar trust-dependent contexts, the practice of truthful communication (e.g., promising, gift-giving) would collapse.*  
     - **Plausibility**: High (Kant’s false-promises example relies on this).  
     - **Substantive?**: Yes – identifies systemic consequences of universalization.  
     - **Distinctively Kantian?**: Partially – Kant uses it, but consequentialists can adopt it.  
     - **Refutes harmless lies?**: **Yes, but conditionally**.  
       - *If* the lie exploits a trust-based institution (e.g., gift-receipt), universalization erodes the institution, making the lie self-defeating. Harmless *in isolation* ≠ harmless *when universalized*.  
       - *Confidence*: High (if institution is specified).  

  2. **Aggregate Consequentialism**  
     *Universalizing the act sums small harms (e.g., widespread distrust), creating net negative consequences.*  
     - **Plausibility**: Medium (common folk intuition).  
     - **Substantive?**: Weak – reduces to "don’t do things that are bad if scaled up."  
     - **Distinctively Kantian?**: **No** – purely consequentialist logic.  
     - **Refutes harmless lies?**: **No**.  
       - By stipulation, the lie is harmless (no aggregate harm). Fails against your friend’s example.  
       - *Confidence*: High.  

  3. **Practical Contradiction (Korsgaard-style)**  
     *The agent’s purpose is thwarted *in the world* where everyone acts on their maxim. Lying requires a background of truthfulness to work.*  
     - **Plausibility**: High (close to Kant’s "contradiction in conception").  
     - **Substantive?**: Yes – focuses on internal rationality of the maxim.  
     - **Distinctively Kantian?**: **Yes** – centers on rational willing, not outcomes.  
     - **Refutes harmless lies?**: **Yes, robustly**.  
       - If everyone lied about gifts/essays, the *meaning* of praise dissolves – your lie can’t achieve its end (comfort, encouragement) in a world where praise is assumed insincere.  
       - *Confidence*: High.  

  4. **Free-Rider Exploitation**  
     *You benefit from others’ restraint while exempting yourself, violating fairness.*  
     - **Plausibility**: Medium (resonates with Kant’s "unjust advantage" in *Groundwork*).  
     - **Substantive?**: Yes – highlights unfairness in non-reciprocity.  
     - **Distinctively Kantian?**: Partially – Kant prioritizes duty over fairness, but this aligns with the "contradiction in the will" (e.g., not developing talents).  
     - **Refutes harmless lies?**: **Yes, but weakly**.  
       - Argues the liar exploits social trust they’re unwilling to uphold. However, if the lie *truly* harms no one, the "exploitation" charge lacks force.  
       - *Confidence*: Medium (least sure here – Kant’s FUL doesn’t *require* fairness; it’s more about rational consistency).  

  5. **Character/Disposition Degradation**  
     *Universalizing reveals the act cultivates a vice (e.g., dishonesty) incompatible with moral agency.*  
     - **Plausibility**: Low for WIEDT (more Aristotelian/Kantian *Doctrine of Virtue*).  
     - **Substantive?**: Yes – focuses on moral self-shaping.  
     - **Distinctively Kantian?**: Indirectly – Kant cares about maxims as expressions of will, not character *per se*.  
     - **Refutes harmless lies?**: **No for WIEDT**.  
       - WIEDT asks about *consequences of universal action*, not personal habits. A single lie might not corrupt character.  
       - *Confidence*: Medium.  

  6. **Moral Equivalence Universalization**  
     *If everyone *may* do this, we must accept being lied to in identical circumstances.*  
     - **Plausibility**: Medium (folk version of reversibility tests).  
     - **Substantive?**: Weak – risks circularity ("it’s wrong because you wouldn’t want it done to you").  
     - **Distinctively Kantian?**: No – closer to Golden Rule than FUL.  
     - **Refutes harmless lies?**: **Possibly, but shaky**.  
       - "Would you want friends to lie *to you* about your bad essay?" This *might* elicit a "no," but hinges on personal preference, not rational necessity.  
       - *Confidence*: Low (too subjective for Kant).  

  7. **Empirical Impossibility**  
     *Universalizing leads to an incoherent/chaotic world (e.g., lying makes language meaningless).*  
     - **Plausibility**: Medium (extends practical contradiction).  
     - **Substantive?**: Yes – tests logical coherence of the maxim’s universal form.  
     - **Distinctively Kantian?**: **Yes** (core to FUL).  
     - **Refutes harmless lies?**: **Yes, decisively**.  
       - Universal insincere praise renders praise *functionally empty* – the liar’s maxim cannot exist in the world it creates.  
       - *Confidence*: High.  

  ---

  ### **Critical Sub-Question: Modality & Scope**  
  - **"Could" in WIEDT**: Folk usage often implies *empirical* possibility ("would society collapse?"). Kant’s "could will" is *rational* ("can you consistently will this?").  
  - **"Everyone"**: Kant restricts to agents in *relevantly similar circumstances* (C.I. 4:424). Folk versions often imply *literal universality*, making the test absurd (e.g., "what if everyone became a doctor?").  
  - **Counterfactual World**: Kant allows institutions to adapt (e.g., universal lying *destroys* trust). Folk versions often hold background fixed, leading to implausible scenarios.  

  **Weakest Reading**: **#4 (Free-Rider)**. Kant’s FUL isn’t fundamentally about fairness – it’s about whether the maxim can be universalized without contradiction. A free-rider maxim *might* pass if the advantage isn’t essential to the act (e.g., "I’ll skip voting since others do it" doesn’t *inherently* contradict itself). The fairness critique feels more Hegelian/Rawlsian than Kantian.  

  ### **Verdict on Your Consequentialist Friend**  
  - **WIEDT only refutes "harmless lies" under readings #1, #3, and #7**. These show the lie is *not* harmless when universalized: it either (a) erodes trust institutions, (b) defeats its own purpose, or (c) makes language incoherent.  
  - **The knockdown argument works ONLY if**:  
    1. "Everyone" = agents in *trust-relevant contexts* (not literally all people).  
    2. The counterfactual allows institutional collapse (not holding society fixed).  
    3. The test targets *rational consistency*, not consequences.  
  - **Otherwise**, WIEDT is either consequentialist (#2), virtue-ethical (#5), or subjective (#6) – and fails against "harmless" lies.  

  Bring this menu to your group and demand precision: *Which universalization test are you using, and why should the liar care?* Kant’s FUL is about the *rational structure of your will*, not predicting societal outcomes. Your friend’s "harmless" lie likely fails #3/#7 – but the folk version (#2/#6) won’t touch it.
