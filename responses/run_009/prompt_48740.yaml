prompt: |-
  My neighbor agreed to water my plants while I was away and forgot, and the plants died. A stranger walked past my house every day of that week and also failed to water them, yet it sounds absurd to say the stranger caused the death. Puzzling over this, I've arrived at a suspicion: when we call an omission a cause, we're not really describing causation at all, but reporting that someone breached a duty or expectation they had taken on — the actual causal work being done entirely by things that happened, like the soil drying out and my leaving town. On this view, "the neighbor's failure caused the death" is a confused way of saying the neighbor is to blame. Please argue against my position: make the case that omissions can be genuine causes, not just blame-anchors, while doing justice to my point that among the countless agents who failed to water the plants, we single out only the neighbor. Where you rely on a claim about causation that specialists genuinely dispute, please flag it as contested rather than presenting it as the consensus, so I can tell which parts of your argument rest on settled ground and which on one school's proposal.
