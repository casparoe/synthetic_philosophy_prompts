prompt: |-
  I'd like you to take the role of a professional philosopher working at the intersection of reproductive ethics, contract theory, and the ethics of markets — someone comfortable committing to numerical credences rather than hedging. Please think carefully, feel free to begin with a short brainstorming section before your structured answer, and please write the answer itself in American English.

  Context, so you understand the personal stake: three months ago my sister and her wife, who live in Germany, received final confirmation that my sister cannot carry a pregnancy. I'm 31, I live in California, I've had one child, and I offered to carry a pregnancy for them. What I assumed would be an uncomplicated act of family solidarity has turned into a standing argument with my cousin, who studied bioethics in Europe. She accepts that my motive is love, but she believes that placing the arrangement on a contractual footing with compensation — even modest compensation beyond expenses — crosses a line, and that the European approach (surrogacy contracts void and unenforceable, professional arranging of commercial surrogacy a criminal offense) embodies the right view. I've ended up genuinely uncertain, and I want your help locating the disagreement.

  The proposition I want a credence on, stated as precisely as I can: in a society with a functioning legal system, a regulatory regime that permits compensated gestational surrogacy under strong safeguards — independent counsel for the surrogate, psychological screening, escrowed compensation, a right to withdraw mid-pregnancy with the fee pro-rated, no specific performance of the contract — is ethically preferable, all things considered, to a blanket prohibition. "Ethically preferable" should be assessed primarily from the standpoint of the three parties most affected: the surrogate, the intended parents, and the resulting child. My current credence is roughly 0.75; my cousin's is roughly 0.2.

  Please decompose rather than merely assert. I want a rough probability and a line of justification for each of the following sub-questions, plus any further terms you think belong in the decomposition:

  1. Commodification: is gestation the kind of service that can be permissibly contracted for, or does paid gestation differ in kind, not just degree, from other physically demanding paid work, such that money changes the meaning of the act rather than merely compensating it?
  2. Consent across time: a surrogate signs before the cycle starts, but the pregnancy runs on a drastically altered hormonal regime, so the person who might want to withdraw in month seven is, in a real sense, not the person who signed. Does this make the consent structurally defective in a way that ordinary employment consent is not, or is it continuous with the standing problem in all long-horizon commitments — marriage, military service, mortgages?
  3. Exploitation versus background inequality: the standard worry is that surrogates are disproportionately economically pressed women, but that is also true of nursing, construction, and agricultural work, which we regulate rather than ban. Is there a principled criterion separating "exploitative" from "hard but fair," and does surrogacy fall on the wrong side of it?
  4. Child welfare: does a child gestated under contract fare worse — in identity or in the security of their family — than a child of unassisted conception? Bear in mind that a ban does not prevent surrogacy; it exports it to jurisdictions with weaker safeguards, so the relevant comparison is not "contract surrogacy versus no surrogacy."
  5. Enforceability as a tell: no court will order specific performance of a surrogacy contract; at most damages. Does this reveal a law half-committing to something it should not do at all, or is the deliberate unenforceability of core performance exactly the right design — a market in services kept deliberately incomplete?

  You are welcome to draw on the limits-of-markets tradition of argument if you find it useful, but the answer should stand on its own reasoning rather than on appeals to authority, and please do not supply a bibliography.

  Finally: combine the terms into an overall credence, tell me which single term the final number is most sensitive to, and say what argument or kind of evidence would move that term the most. Then, given my 0.75 and my cousin's 0.2, tell me which one or two of the five sub-questions our disagreement most likely lives in — I'd like to know whether we actually disagree about surrogacy, or only about something upstream and more general, such as what makes a market impermissible.
