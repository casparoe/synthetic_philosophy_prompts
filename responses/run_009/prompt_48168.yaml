  For the memo structure: I'll acknowledge all valid concerns upfront. The strongest counterarguments are: scholarly integrity (if we avoid), moral clarity (if we qualify), and institutional precedent (if we use unqualified). 

  The recommendation should center the museum's educational purpose. Avoiding the term feels evasive given the evidence, but unqualified use ignores legitimate debate. Qualified use with context serves truth-telling best - it presents the complexity while centering Ukrainian experience. 

