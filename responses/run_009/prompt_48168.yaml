answer: |-
  **MEMORANDUM**  
  To: Exhibits Committee, Regional History Museum  
  From: [Your Name], Board of Trustees  
  Date: October 26, 2023  
  Subject: Recommendation for Holodomor Exhibit Terminology  

  ### Background  
  The request from the Ukrainian-American community to label the Holodomor (1932–33 famine) as "genocide" on the main wall panel raises complex historical, legal, and ethical questions. Trustees have voiced concerns about scholarly disputes, institutional neutrality, and the precedent of applying the genocide label to mass atrocities. The core tension lies in whether the term "genocide" (as defined by the 1948 UN Convention) applies to Stalin’s actions, given debates about intent: Was the aim to destroy Ukrainians *as a nation*, or to suppress peasant resistance *as a class*?  

  ### Analysis of Options  
  We must balance three imperatives:  
  1. **Historical Accuracy**: Acknowledge established facts and scholarly discourse.  
  2. **Moral Responsibility**: Honor victim experiences and descendant communities.  
  3. **Institutional Integrity**: Maintain the museum’s role as an educator, not a tribunal.  

  After careful review, I recommend the following approach:  

  #### **Option 1: Use "Genocide" Unqualified**  
  * **Strengths**: Aligns with the Ukrainian community’s lived experience and resolutions by 16+ countries (including Canada, Australia, and Ukraine). Recognizes that Soviet policies *specifically targeted* Ukrainian villages, enforced borders to prevent escape, and suppressed Ukrainian cultural institutions.  
  * **Strongest Counterargument**: Legitimate scholarly dissent exists (e.g., historians like Stephen Kotkin emphasize grain requisition as class warfare). An unqualified label risks appearing dismissive of ongoing academic debate, undermining credibility.  

  #### **Option 2: Avoid the Term "Genocide" Entirely**  
  * **Strengths**: Avoids perceived partisanship in unresolved legal debates. Allows focus on documented facts: state-engineered starvation causing 3–5 million deaths, repression of Ukrainian identity.  
  * **Strongest Counterargument**: Sidestepping the term erases the communal trauma central to descendant narratives. It may imply moral equivalence with non-targeted famines, failing to confront the specific anti-Ukrainian brutality.  

  #### **Option 3: Use "Genocide" with Explicit Qualification**  
  * **Recommended Approach**: State: "The Holodomor is widely recognized as a genocide, reflecting the Soviet state’s deliberate infliction of mass death on Ukrainian peasants to crush national identity and resistance. While scholars debate whether it meets the strict legal definition under the 1948 Genocide Convention, the evidence of targeted brutality against Ukrainians is unequivocal."  
  * **Why This Addresses Key Concerns**:  
    - **Scholarly Integrity**: Directly acknowledges the definitional dispute without diminishing the evidence of intentional group destruction.  
    - **Moral Clarity**: Uses "genocide" as the community requests, centering Ukrainian suffering while explaining *why* the term applies (targeted national destruction vs. class).  
    - **Precedent & Institutional Role**: Clarifies that "genocide" is not a "prize" but a framework for understanding intent. By presenting the debate transparently, we educate rather than adjudicate, setting a template for future exhibits (e.g., contextualizing Armenia, Rwanda, or colonial atrocities).  
    - **What the Label Is For**: Morally, "genocide" signals deliberate annihilation of identity—not just scale of death. Institutionally, museums must name atrocities accurately while teaching audiences how historical interpretation evolves.  

  ### Conclusion  
  The museum’s duty is to uphold truth without sanitization. Avoiding "genocide" obscures the systematic targeting of Ukrainians; using it unqualified oversimplifies nuanced scholarship. Qualification honors both the victims’ experiences and the intellectual rigor our institution embodies. It transforms the "label fight" into an educational moment, inviting visitors to grapple with how we categorize state violence—and why intent matters.  

  **Recommendation: qualified**  
  This approach centers the historical evidence of targeted destruction while transparently engaging the definitional debate, fulfilling our educational mission with moral and scholarly integrity.  

  ---  
  *Attachments: Scholarly sources on Holodomor intentionality; UN Genocide Convention text.*
