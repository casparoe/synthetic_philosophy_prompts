answer: |-
  Here’s a detailed critique addressing your specific questions, structured to strengthen your argument and clarify its originality:

  ### **1. On Retroactivity vs. Epistemology**  
  Your case *does* threaten conventionalism, but its force hinges on distinguishing **truth-makers** from **epistemic access**.  
  - **The Threat**: Conventionalism (e.g., Wiggins, Lowe) holds that sortal-relative criteria resolve the paradox. Your 2010 case shows that applying the sortal "ship" *still* depends on contingent historical narratives (e.g., "material continuity was never disturbed"). When new evidence revises the narrative, identity judgments shift *without physical change*. This implies identity isn’t fixed by sortals alone but by empirical narratives—undermining the claim that the puzzle is "merely verbal."  
  - **The Epistemology Objection**: A critic might counter: "The ship’s identity *facts* didn’t change in 2010; only our *knowledge* did. 'Mostly original' was always true/false."  
    - **Your Riposte**: Argue that for artifacts, *there are no identity facts independent of evidence*. The museum’s restoration ledger, dendrochronology, and provenance records *constitute* the criteria for "originality." If these socially embedded records define the truth conditions (e.g., "original" = planks installed in Year X), then truth *is* evidence-relative. Without such criteria, "original" lacks operational meaning.  
  - **Key Move**: Draw a line between natural kinds (water = H₂O, evidence-independent) and artifacts (identity criteria are convention-laden and evidence-dependent). Your case falls on the "identity verdicts change" side because the *truth conditions themselves* are anchored to human practices.  

  ---

  ### **2. Identity Talk as Historical Inquiry**  
  The analogy is defensible but requires refinement to avoid conflating semantics with warranted assertion.  
  - **The Conflation Risk**: Yes, a critic will insist that "mostly original" had a fixed truth value in 1980, revealed in 2010. To defend your view:  
    - **Semantics of Artifact Terms**: Argue that artifact identity predicates (e.g., "original ship") are **inherently historical-relational**. Their meaning depends on causal histories accessible only through evidence (e.g., ledgers, scientific analysis). Unlike "water," whose essence is intrinsic, "Ship of Theseus" is a *hermeneutic* category.  
    - **Warrant vs. Truth Conditions**: Grant that warrant and truth are distinct but insist that for artifacts, **truth conditions include evidentiary thresholds**. If "original" requires >50% original material *as per authoritative records*, then a record revision *changes the truth conditions*.  
  - **Strengthen the Analogy**: Cite historical practice (e.g., debates over artifact authentication in archaeology). When carbon dating reclassifies a relic, the *identity* of the object changes (e.g., "medieval forgery" vs. "ancient original"), not just our beliefs.  

  ---

  ### **3. Weakest Point: Anti-Realist Leap**  
  The sharpest critic will attack your conclusion: "The realist [...] is in serious trouble because her real object [...] plays no role."  
  - **The Gap**: You move from "identity depends on evidence" to "the ship plays no role," but this risks overreach. A moderate realist (e.g., Thomasson) could argue:  
    - Physical continuity *constrains* plausible narratives (e.g., you can’t call a random plank pile "the ship").  
    - Evidence must still *track* physical history; it isn’t arbitrary.  
  - **Repair Strategy**:  
    - Clarify that artifacts are **intentional objects**: Their identity is fixed by design, use, and maintenance practices (Baker, Lynne Rudder). The "real object" matters as a *focus of practices*, but its persistence conditions are defined by those practices, not brute physics.  
    - Emphasize that evidence revisions *correct* narratives, but only relative to community standards (e.g., museum curators, naval historians).  

  ---

  ### **4. Most Promising Development: Identity as Historical Inquiry**  
  **Expand the historical-inquiry framework** into a full paper. This requires:  
  - **More Cases**:  
    - A case where *conflicting evidence* creates temporary indeterminacy (e.g., two ledgers with rival restoration records).  
    - A case where identity changes *without* physical alteration (e.g., a ship declared a replica after discovering provenance fraud).  
  - **Tighter Argument**:  
    - **Step 1**: Show conventionalism relies on unexamined historical assumptions (as you do).  
    - **Step 2**: Argue that artifact identity criteria are **instituted by practices** (e.g., curation, documentation) and thus depend on evidence.  
    - **Step 3**: Defend "evidentiary dependence" against semantic indeterminacy views (e.g., Sider, Hirsch) by showing they cannot resolve retroactive revisions.  
  - **Engage Rivals**: Contrast your view with:  
    - **Semantic Indeterminacy**: Rebut by noting your cases involve *determinate* (but revised) verdicts.  
    - **Moderate Realism**: Concede artifacts have physical constraints but insist their *persistence* is practice-relative.  

  ---

  ### **Overall Assessment**  
  Your argument is **not** a relabeling of old epistemology. By tying identity to revisable evidence, you:  
  - Expose a blind spot in conventionalism (sortals depend on historical narratives).  
  - Offer a fresh, deflationary view where artifact identity is "made true" by institutional records and scientific methods.  
  **Biggest Risk**: Overclaiming anti-realism. Tempering this to "practice-dependent realism" might broaden appeal without sacrificing insight.  

  **Recommended Next Steps**:  
  1. Tighten §2 (2010 case) to explicitly link evidence shifts to truth-condition changes.  
  2. Engage Baker’s *Artifacts and Intentional Identity* to ground your historical-inquiry model.  
  3. Preempt the "epistemology not metaphysics" objection by distinguishing natural/artifact kinds upfront.  

  This draft is already provocative and publishable—with targeted revisions, it could reshape debates on artifact persistence. Well done!
