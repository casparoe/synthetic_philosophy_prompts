prompt: |-
  me and my friend Priya argued until like 2am about advance directives and I ended up with a list of cases where my gut is really firm but I can't find the thread connecting them. here they are with my verdicts:

  my grandmother signed a directive years ago saying no feeding tube once she couldn't recognize family. now she has dementia, doesn't know any of us, but she's honestly kind of content — giggles at her soaps, likes her lunch. my gut says honor it anyway, tube stays out, even though it means the content person dies.

  a climbing buddy used to say constantly that if he was ever paralyzed he'd want to be let go. then he had his accident, and eighteen months later he's racing wheelchairs and planning trips and clearly glad to be alive. I'd never in a million years hold him to what he used to say.

  a jehovah's witness refuses blood while fully competent, then starts bleeding out and semi-conscious gasps "save me." I don't transfuse. past refusal wins.

  a guy with schizoaffective disorder, while clear-headed, signs an involuntary committment contract that kicks in whenever he stops his meds, explicitly waiving his future refusals. later he's floridly psychotic and saying no hospital. I'd commit him per his own contract.

  my friend's mom never signed anything but told everyone for twenty years that she'd never want to be kept alive in a vegetative-ish state. when it happened, the family followed the dinner-table statements, and I think that was right, though it felt weaker than a signed form.

  and the one that keeps bugging me: a woman at 22, terrified right after watching her mom die of cancer, writes a directive saying if she ever needs a colostomy, let her go. at 60 she has dementia and needs one, and from everything about the 38 years in between — she loved her life, joked about living with the bag — the 22-year-old's horror clearly wasn't her settled values. my gut says ignore it.

  priya's take was that I only honor the past self when the present self has lost competence, which makes the whole thing about the present person's welfare with the directive as a convenient tool. mine was something vaguer about a person being a whole life and the directive speaking for the parts that are gone. neither of us could get the grandmother and the colostomy woman apart — both directives signed when competent, both present selves demented.

  so: is there one principle that gets all six verdicts, or close? state it precisely, tell me which of my verdicts it can't save, and tell me what it predicts for a case I didn't list — like whether a still-competent person can revoke the committment contract they wrote for their own psychotic episodes, or whether the dinner-table statements would survive being one remark instead of twenty years of them.

  lead with the principle itself in your first sentence, then the reasoning, no preamble and no restating my cases back at me.
reasoning: |-
  Okay, the user is presenting a complex ethical dilemma involving advance directives across various scenarios. They've clearly thought deeply about this, wrestling with how to reconcile their intuitive judgments into a coherent principle. The cases show a tension between past directives and present realities, with dementia, changed circumstances, and competence playing key roles.

  Hmm, the grandmother case is particularly poignant - honoring a directive even when the current self seems content. But the colostomy case feels different because the directive seems disconnected from the person's lived values. The climbing buddy scenario clearly shows why changed preferences matter when competence remains. 

  The principle needs to account for both the enduring nature of core values and the possibility of genuine change. The Jehovah's Witness case suggests that deeply held beliefs should persist even in crisis, while the schizoaffective contract recognizes that some decisions are designed specifically for compromised states. 

  For the unwritten dinner-table wishes, consistency over time lends credibility, but what if it was just one remark? The principle would likely require stronger evidence of settled intent. And for the commitment contract - if revoked while competent, that should override the prior agreement because current competent wishes always take precedence. 

  The user's frustration with their friend Priya's "present welfare" theory is understandable - it doesn't explain why they'd ignore the colostomy directive but honor the grandmother's. The key distinction might be whether the directive reflects the person's lifelong identity or a transient fear. 

  This is fundamentally about respecting the whole person across time - not just the present moment, but not eternally binding them to past selves either. The "enduring values" framework seems most consistent with all six judgments while allowing for necessary nuance in new cases.
answer: |-
  **Principle:** Honor prior directives *only* when the present self lacks decision-making capacity *and* the directive reflects the person's settled, enduring values or identity, rather than transient states, unendorsed fears, or values demonstrably abandoned during competent life.

  **Reasoning:** This distinguishes between directives expressing core, persistent aspects of the person and those arising from temporary circumstances, incomplete understanding, or values later rejected. It prioritizes the competent person's *overall life narrative and identity*.

  *   **Grandmother:** Honored. Dementia destroyed capacity; her directive reflects a settled value about identity loss and dependency, not a transient fear. Her current contentment doesn't negate her prior value judgment on *how* she wanted to live/die.
  *   **Climbing Buddy:** Ignored. He *retains capacity* and demonstrates his prior statement (made without experiential understanding) no longer reflects his values. Current autonomous wishes prevail.
  *   **Jehovah's Witness:** Honored. She *lacks capacity* during the crisis. Her refusal reflects a core, religious identity and deeply held principle consistently held while competent. The semi-conscious plea is an instinctive survival impulse, not a competent revocation of her faith-based value.
  *   **Schizoaffective Contract:** Honored. He *lacks capacity* during psychosis. The contract reflects his settled, competent judgment about managing his illness and preserving his future capacity/well-being. It embodies his enduring value of stability achieved *through* treatment during lucid periods.
  *   **Friend's Mom (Verbal):** Honored. She *lacks capacity*. While unwritten, decades of consistent statements constitute evidence of a settled, enduring value about her existence, meeting the threshold of reflecting her core identity/wishes.
  *   **Colostomy Directive:** Ignored. She *lacks capacity* due to dementia. However, the directive stemmed from a specific trauma-induced fear at 22, explicitly contradicted by her lived values and attitudes throughout her long competent adulthood (joking about living with a bag). It does *not* reflect an enduring or settled value of her life narrative.

  **Verdicts Saved:** All six align. The key distinctions are:
  1.  **Capacity:** Present capacity trumps (Climbing Buddy).
  2.  **Enduring Values vs. Transient State:** Directives reflecting core identity/values are honored when capacity is lost (Grandmother, JW, Schizoaffective, Friend's Mom). Directives contradicting demonstrably settled later values are not (Colostomy).

  **Predictions for New Cases:**

  1.  **Revoking Commitment Contract While Competent:** **Allow Revocation.** The Principle prioritizes the *current competent self*. If they now possess capacity and judge the contract no longer serves their enduring values or best interests, they can revoke it. Their current autonomous assessment of their needs and values governs.
  2.  **Dinner-Table Statement - One Remark:** **Likely Ignore.** A single, uncorroborated remark lacks sufficient evidence to establish it reflected a "settled, enduring value" or core aspect of the person's identity. It's more likely perceived as a transient thought or reaction. Without repetition or other evidence of deep conviction, it wouldn't meet the threshold to override the ambiguity of the incapacitated state. (Contrast with 20 years of statements).

  **Core Insight:** The directive is not sovereign over the person; it's a tool used by the competent self to project their core values into a future state of incapacity. We honor it only when it authentically speaks *for* the person's enduring identity in that future state, not when it binds them to a past self they fundamentally moved beyond while competent or represents a fear they overcame.
