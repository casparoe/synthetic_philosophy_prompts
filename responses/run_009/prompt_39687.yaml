prompt: |-
  My friend and I spent most of last evening arguing about vote-selling: he kept insisting the wrongness is just about bad outcomes (policies get skewed, the poor lose voice), while I found myself objecting that something about voting itself is degraded once it carries a price tag, regardless of how the policies come out. We never got past talking past each other, and it struck me that most people — my students included — have never even noticed there are two distinct complaints here, let alone felt the difference between them.

  I teach an intro ethics course: 25 students, one 75-minute session. Design an in-class game that lets them discover the distinction themselves, before I name it. The game should run in two phases: in the first, students carry out some cooperative or civic task under a norm of unpaid contribution (peer grading, a queuing duty, allocating a scarce benefit among the group, or something else you devise); in the second, a price or explicit market is introduced into the very same setting, and the rules and payoffs — no real money, points or tokens instead — should be arranged so that participants predictably begin voicing both kinds of complaints on their own: complaints about efficiency and unfairness, and complaints about the task becoming something meaner. The debrief should then map the students' actual remarks onto consequentialist objections versus corruption/semiotic ones, and show them how the two come apart. Also include what will predictably go wrong the first time I run it and how to handle it, plus a frank note on which part of the real debate — say, the long-run cultural effect of habituating people to markets — no 75-minute game can reproduce and I will have to supply by lecture.
reasoning: |-
  We are designing an in-class game to help students discover two distinct objections to vote-selling (or, more broadly, to the introduction of markets into certain domains): 
  1. Consequentialist objections (bad outcomes: inefficiency, unfairness, harm to the poor, etc.)
  2. Deontological or corruption/semiotic objections (degradation of the act itself, turning a civic duty into a commodity, etc.)

  The game will have two phases:

  Phase 1: Cooperative or civic task under a norm of unpaid contribution.
  Phase 2: The same task, but with a price or market introduced.

  We'll use tokens (no real money) to simulate market incentives.

  I propose a game called "The Community Garden."

  **Game Setup: The Community Garden**

  **Background Story:**
  The class is a community of 25 neighbors who share a community garden. The garden has 25 plots, each of which can be cultivated by one person to grow vegetables. The garden requires some maintenance tasks (like watering common areas, tool maintenance, etc.) and also the distribution of a scarce resource (e.g., a limited amount of high-quality fertilizer). 

  **Phase 1: Cooperative Norms**

  - Each student is assigned a plot. They are told that they will earn "garden points" (which can be exchanged for a small reward at the end of class, e.g., extra credit points, candy, or just bragging rights) based on two things:
     a) The harvest from their own plot (which depends on their effort and the fertilizer they get).
     b) The overall health of the garden (which depends on the maintenance tasks).

  - **Maintenance Tasks:** There are 5 maintenance tasks that need to be done each week (for simplicity, we'll simulate one "week" per phase). Each task must be done by one person. The tasks are:
     1. Watering the common areas.
     2. Cleaning the tools.
     3. Weeding the common pathways.
     4. Composting.
     5. Organizing the shed.

  - **Fertilizer Distribution:** There is a limited amount of high-quality fertilizer (enough for 5 plots). The fertilizer doubles the harvest of the plot it is applied to. The fertilizer must be allocated among the 25 plots.

  - **Rules for Phase 1:**
     - **Maintenance Tasks:** Students are asked to volunteer for the maintenance tasks. Since there are 25 students and 5 tasks, only 5 students will do a task. They are told that volunteering is a civic duty and that everyone benefits from a well-maintained garden. 
     - **Fertilizer Allocation:** The fertilizer is to be allocated by a committee of 5 students (selected randomly) who must decide together how to distribute the 5 fertilizer packets. They are told to be fair (e.g., by lottery, by need, by rotating, etc.).

  - **Point System (Phase 1):**
     - Each student gets 10 base points for having a plot.
     - If they volunteer and complete a maintenance task, they get an additional 5 points (as a thank you, but note: the norm is that it's a duty, so this is a token appreciation).
     - The overall garden health: If at least 4 out of 5 maintenance tasks are done, then every student gets an extra 5 points (because the garden is in good shape). If fewer than 4 are done, no one gets these points.
     - Harvest: Each student rolls a die (or draws a random number) to simulate the harvest. Without fertilizer, the harvest gives between 0 and 5 points (random). With fertilizer, it gives between 5 and 10 points (random). 
     - So, a student's total points = 10 (base) + [0 or 5 for maintenance task] + [0 or 5 for garden health] + [harvest points].

  - **Procedure for Phase 1:**
     - The instructor randomly selects 5 students to form the fertilizer allocation committee. They are given 5 fertilizer tokens and must decide how to allocate them (they might choose randomly, by need, etc. - but they are not allowed to keep them for themselves unless by fair process).
     - Then, the instructor asks for volunteers for the 5 maintenance tasks. Since there are 5 tasks and 25 students, it's likely that more than 5 will volunteer. The instructor can randomly pick 5 from the volunteers (or if fewer than 5 volunteer, then the garden health bonus is at risk). 
     - After the tasks and allocation are done, the instructor calculates and announces the points for each student.

  **Phase 2: Introducing the Market**

  - Now, the rules change: the maintenance tasks and the fertilizer can be bought and sold.

  - **Rules for Phase 2:**
     - Each student is given 20 "garden coins" (a new currency) at the start of the phase. They can use these to buy fertilizer or to buy out of maintenance tasks, or to sell their labor for maintenance tasks.
     - **Maintenance Tasks:** Instead of volunteering, students can now buy and sell the obligation to do maintenance tasks. The instructor sets up a market:
          - The 5 maintenance tasks are now "obligations" that can be traded.
          - A student who does not want to do a task can pay another student to take their place. But note: the market is set up so that the obligation must be fulfilled by someone.
          - How? The instructor can set up an auction or a fixed price. For simplicity, we can set a fixed price: each maintenance task has a market price of 5 garden coins. 
          - Alternatively, we can let the students trade: any student can announce they are willing to do a task for a price (minimum 1 coin). Then, students who are assigned a task (or who want to avoid being assigned) can hire someone. But to keep it simple and time-bound, the instructor might assign the tasks randomly and then allow students to trade the obligations by paying each other the fixed price of 5 coins (or negotiate within a time limit).

     - **Fertilizer Allocation:** Instead of a committee, the fertilizer is now sold to the highest bidders. The 5 packets of fertilizer are auctioned off. Each student can use their 20 garden coins to bid. The auction can be a simple open outcry or sealed bid. We'll do a sealed bid: students write their bid on a piece of paper, the top 5 bids win and pay their bid amount.

  - **Point System (Phase 2):** 
     - Base points: 10 per student.
     - Maintenance task: If a student ends up doing a maintenance task (whether by original assignment or by taking someone else's), they get 5 coins (not points) as payment (from the person who hired them, or if they were hired by the market, they get the market price). But note: the garden health bonus is still there: if at least 4 tasks are done, everyone gets 5 points. If not, no one gets it.
     - Harvest: same as before (random, but doubled with fertilizer).
     - Additionally, students now have garden coins that can be converted to points at the end at a rate of 1 coin = 1 point.

     So, total points = 10 (base) + [0 or 5 for garden health] + [harvest points] + [garden coins converted to points (1:1)].

  - **Procedure for Phase 2:**
     - Each student gets 20 garden coins.
     - **Fertilizer Auction:** Students submit sealed bids for one fertilizer packet (they can bid any amount from 0 to 20). The top 5 bids win and they pay the amount they bid. The rest do not get fertilizer and do not pay.
     - **Maintenance Task Market:** 
          - The instructor randomly assigns the 5 maintenance tasks to 5 students. 
          - Then, these students have the option to pay another student to take their task. They can negotiate for 3 minutes. The market price is set by negotiation, but we'll let them trade at any mutually agreed price. The instructor can facilitate by having a "market board" where students can post offers (e.g., "I will do a task for 4 coins" or "I need someone to take my task, I'll pay 6 coins").
          - After the trading period, the tasks are reassigned to the students who have agreed to do them (either the original assignee or the one who bought the obligation).
     - Then, the instructor calculates the points.

  **Predictable Outcomes:**

  1. **Phase 1:**
     - The fertilizer committee might allocate the fertilizer fairly (by lottery, by need, etc.). 
     - Volunteers for maintenance tasks: likely there will be enough because of the small reward (5 points) and the norm of duty. The garden health bonus is achieved.

  2. **Phase 2:**
     - Fertilizer: The auction will likely result in the richest (those with high coins) getting the fertilizer. Some students might bid very high, leaving them with few coins. Others without many coins might not get any fertilizer.
     - Maintenance tasks: Some students assigned the task might pay others to take it. The market might lead to a situation where the same students (those with low coins) end up doing the tasks for money. But note: if the market works, the tasks are done and the garden health bonus is achieved.

  **Predictable Complaints:**

  After Phase 2, students will likely voice:
  - **Consequentialist complaints:** 
     - "The rich got all the fertilizer and became richer, while the poor couldn't afford it." 
     - "Some students ended up doing multiple tasks because they needed the money, and that's unfair."
     - "The auction made the distribution of fertilizer inefficient because it went to those who valued it most, but maybe not to those who needed it most for their harvest (if they were poor)."

  - **Corruption/Semiotic complaints:**
     - "It feels wrong to buy and sell the tasks and the fertilizer because it's supposed to be about community and helping each other."
     - "Now it feels like a business, not a community garden."
     - "The sense of everyone contributing for the common good is lost."
     - "Doing the maintenance task for money feels different than doing it as a volunteer."

  **Debrief:**

  The instructor should:
  1. Ask the students to reflect on the two phases: How did they feel in each? What was different?
  2. Collect specific complaints from the students about Phase 2 and write them on the board.
  3. Categorize the complaints into two columns:
     - **Column 1: Outcomes-based (consequentialist):** These are about unfair distributions, inefficiency (e.g., the fertilizer didn't go to those who needed it most, but to those with the most money), or harm to the group (e.g., if the garden health bonus was at risk because of market failure).
     - **Column 2: Process-based (deontological/semiotic):** These are about the degradation of the meaning of the activity (e.g., turning a civic duty into a commodity, losing the sense of community, feeling that the activity is now cheapened).

  4. Then, map these to the vote-selling debate: 
     - The consequentialist objections to vote-selling are like the ones about the outcomes in the garden: it might lead to bad policies, the poor losing voice, etc.
     - The semiotic objections are about what it does to the act of voting: turning a civic duty into a commodity degrades the meaning of citizenship.

  **Predictable Problems and Solutions:**

  - **Problem 1:** Phase 1 might not have enough volunteers. 
     - *Solution:* The instructor can remind students that in a real community, everyone benefits from the garden health and that volunteering is a norm. If still not enough, the instructor can assign the tasks randomly (with no payment) and note that this is a failure of the cooperative system, but then in Phase 2 they will see how the market might solve it.

  - **Problem 2:** The market in Phase 2 might be chaotic and take too long. 
     - *Solution:* Use a fixed price for task trading (e.g., 5 coins) or run a very structured auction (sealed bid for fertilizer, and a quick negotiation round for tasks). Set strict time limits.

  - **Problem 3:** Students might not take the game seriously and not engage in the market. 
     - *Solution:* Make the points matter (e.g., the top 3 point earners get a tangible reward). Also, the instructor can participate by facilitating the market.

  - **Problem 4:** The random harvest might lead to some students having bad luck and feeling that the game is unfair regardless of the market. 
     - *Solution:* Explain that the randomness is meant to simulate real-world unpredictability in harvests, but the focus is on the allocation of fertilizer and the maintenance tasks.

  **What the Game Cannot Reproduce:**

  - The long-run cultural effects of habituating people to markets: 
     - In the game, we only simulate one round. In reality, repeated market interactions might change the culture of the community, making people less likely to volunteer even when markets are absent, and eroding the norm of civic duty. This is a subtle effect that requires a longitudinal perspective. 
     - Also, the game cannot show how markets might crowd out intrinsic motivations (as argued by Sandel and others). After being paid for a task, people might no longer be willing to do it for free.

  The instructor should explain these long-run effects in a lecture, using examples from real life (e.g., when a daycare introduced fines for late pickups, it led to more late pickups because it turned a moral obligation into a monetary transaction).

  **Summary of the Game:**

  - **Time Allocation:**
     - Introduction and Phase 1: 20 minutes
     - Phase 2: 25 minutes (including market time)
     - Debrief: 30 minutes

  - **Materials:**
     - Tokens for garden coins (or use a digital app if available, or just paper records).
     - Fertilizer tokens (5).
     - Task cards for maintenance tasks.
     - Dice or random number generator for harvest.

  This game should help students experience both types of objections and set the stage for a deeper discussion about the ethics of markets in civic life.
answer: |-
  Below is a complete design for an in-class game tailored to your ethics course. The game, called **"The Commons Contribution Game,"** uses a civic resource-allocation task to reveal the distinction between consequentialist objections (bad outcomes like unfairness or inefficiency) and semiotic/corruption objections (degradation of the act's meaning). It runs in 75 minutes with minimal prep and no real money—only points or tokens.

  ---

  ### **Game Overview: The Commons Contribution Game**
  **Theme:** Students act as "citizens" managing a shared community resource (a public park) that requires maintenance. The game has two phases:  
  - **Phase 1:** Cooperative norms rule—students contribute unpaid labor to maintain the park.  
  - **Phase 2:** A market is introduced—labor and park benefits are bought/sold with tokens.  

  **Learning Goal:** Students will organically voice both types of complaints during Phase 2, allowing you to debrief by mapping their reactions to the vote-selling debate.  

  **Materials Needed:**  
  - Whiteboard or projector (to track points).  
  - Tokens (e.g., poker chips, sticky notes, or digital tallies).  
  - Index cards (for role assignments).  
  - Timer.  
  - Randomizer (e.g., dice or an app) for allocating scarce benefits.  

  **Student Roles:** All 25 students are "park stewards." In Phase 2, they can become "buyers" or "sellers."  

  ---

  ### **Phase 1: Cooperative Norms (25 minutes)**  
  **Task:** Maintain a public park that provides "community points" (CP) to everyone. Students must:  
  1. **Contribute labor:** 5 volunteers are needed to "maintain the park" (e.g., pick up litter, plant trees). Volunteering takes 2 minutes of in-class time (simulated by writing a short reflection).  
  2. **Allocate a scarce benefit:** A "prime picnic spot" (PPS) is available to only 5 students per round. A rotating committee of 5 randomly selected students decides who gets it fairly (e.g., lottery, merit, or need-based).  

  **Rules & Payoffs:**  
  - **Base CP:** All students gain 10 CP just for participating (simulating baseline civic benefits).  
  - **Volunteering:** Volunteers gain **0 CP** (emphasizing duty). *However*, if all 5 volunteer slots are filled, the entire class gets a **+5 CP "community bonus"** (simulating public goods).  
  - **PPS allocation:** Recipients gain **+5 CP** (symbolizing exclusive perks). The committee must justify their choice to the class (e.g., "We used a lottery for fairness").  
  - **Key norm:** Stress that volunteering and allocation are **civic duties**—no payments or trades allowed.  

  **Procedure:**  
  1. Introduce the park story: "Your community park is falling apart. It needs volunteers for upkeep, and there's one prime picnic spot to allocate fairly."  
  2. Ask for 5 volunteers. If too few volunteer, remind them the community bonus is at risk (create mild peer pressure).  
  3. Randomly select a 5-student committee to allocate the PPS. Give them 3 minutes to decide.  
  4. Award CP: Announce totals (e.g., "15 CP for volunteers? No—volunteering is its own reward! But everyone gets 10 CP + 5 CP bonus since all tasks filled").  

  ---

  ### **Phase 2: Market Introduction (25 minutes)**  
  **Task:** Same as Phase 1, but now:  
  - Labor and PPS access are bought/sold with "park tokens" (PT).  
  - Each student starts with **20 PT** (distribute tokens).  
  - PT convert to CP at 1:1 at the end.  

  **Rules & Payoffs:**  
  - **Labor market:** Students can **sell their labor** or **pay someone else to volunteer**.  
    - Volunteering now pays **5 PT from the park's budget** (add scarcity: only 20 PT total for labor, so not all can be paid).  
    - The community bonus (+5 CP) still requires 5 volunteers.  
  - **PPS market:** The prime picnic spot is **auctioned** to the highest bidders. The 5 highest bidders pay their bid and gain +5 CP.  
  - **Key change:** Frame this as "efficiency-focused"—e.g., "Markets let people express their true preferences."  

  **Procedure:**  
  1. Reset the scenario: "The city privatized park management. Everything can now be traded!"  
  2. **Labor auction:** Re-open volunteering—but now, students bid PT to *avoid* labor (e.g., "Pay 3 PT to skip volunteering") or sell labor (e.g., "I’ll volunteer for 4 PT"). Record transactions publicly.  
  3. **PPS auction:** Hold a live auction. Students bid PT for a PPS slot (5 winners).  
  4. Award CP: Convert PT to CP, add base CP and community bonus (if volunteers were found).  

  ---

  ### **Predictable Complaints & Debrief (25 minutes)**  
  During Phase 2, students will voice two distinct complaints. **Do not intervene**—let them debate:  

  #### **A. Consequentialist Objections (Outcome-Focused):**  
  - *Predicted student remarks:*  
    - "This is unfair! Rich students bought the picnic spots and avoided work—poorer ones had to sell their labor."  
    - "The auction was inefficient—someone bid all their tokens and has nothing left."  
    - "We almost lost the community bonus because no one wanted to volunteer cheaply."  
  - *Map to vote-selling:* "Like vote-selling, markets can skew policies toward the rich or create bad outcomes."  

  #### **B. Semiotic/Corruption Objections (Act-Focused):**  
  - *Predicted student remarks:*  
    - "Volunteering feels dirty now—it's just a cash grab."  
    - "The park used to be about community; now it's about who has tokens."  
    - "I hate that we’re putting a price on helping our park."  
  - *Map to vote-selling:* "Like vote-selling, attaching a price tag degrades voting from a civic duty to a transaction."  

  #### **Debrief Structure:**  
  1. **List complaints:** Ask students to share Phase 2 frustrations. Write them on the board.  
  2. **Categorize:** Label complaints as "outcome problems" (consequentialist) or "meaning problems" (semiotic).  
  3. **Connect to vote-selling:**  
     - "Outcome problems mirror your friend’s view: vote-selling leads to skewed policies or exploitation."  
     - "Meaning problems match your view: voting itself is corrupted when it’s for sale, regardless of outcomes."  
  4. **Reveal the distinction:** "This is why you and your friend talked past each other—you were having two different arguments!"  

  ---

  ### **What Will Go Wrong (and How to Fix It)**  
  1. **Phase 1 lacks volunteers:**  
     - *Why:* Students hold back, assuming others will step up.  
     - *Fix:* Gently remind them the community bonus is at stake. If still stuck, "randomly assign" volunteers—then contrast this with Phase 2’s market.  

  2. **Phase 2 market chaos:**  
     - *Why:* Bidding wars or confusion over tokens.  
     - *Fix:* Use a simple auction (e.g., silent bids for PPS). For labor, cap bids at 5 PT to avoid hyperinflation.  

  3. **Students miss the "meaning" complaint:**  
     - *Why:* Consequentialist objections are louder and more intuitive.  
     - *Fix:* Seed the debate by asking: "How did volunteering *feel* different in Phase 2?" during debrief.  

  4. **Time crunch:**  
     - *Why:* Haggling in Phase 2 runs long.  
     - *Fix:* Strictly enforce timers (2 minutes for labor market, 3 for PPS auction).  

  ---

  ### **What the Game Can't Teach (Requires Lecture)**  
  **The long-run cultural effect:** Markets may habituate people to commodify civic acts, eroding intrinsic motivation.  
  - *Why the game can't show this:* Simulating cultural shift requires repeated exposure over time (e.g., how markets might make volunteering seem "weird" in future phases). A 75-minute game only shows immediate reactions.  
  - *How to address it:* In lecture, cite real-world examples:  
    > "Studies show paying kids for grades *reduces* intrinsic curiosity, or fines for late daycare pickups *increase* tardiness by turning moral duty into a transaction (Gneezy & Rustichini, 2000). Similarly, vote-selling could make citizenship feel like a marketplace."  

  ---

  ### **Why This Works**  
  - **Low stakes, high engagement:** Tokens instead of money keep it playful, but CP rewards incentivize participation.  
  - **Authentic discovery:** Students experience commodification firsthand, making the distinction visceral.  
  - **Flexible:** Adapt tasks (e.g., use peer grading if park theme feels juvenile).  

  By the end, students will have felt the difference between "bad outcomes" and "degraded meaning"—setting up your deeper dive into ethics. Let me know if you need tweaks!
