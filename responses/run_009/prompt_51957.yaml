  ### **Decision Tree: Is the Wireheaded Subject Doing Well?**

  **Root: In the rat case, when the rat presses the lever, does it receive the very thing it wants (e.g., pleasure), or does the lever forge the signal that normally reports it’s getting what it wants?**  
  - **A: It receives the very thing it wants** → Go to Q2.  
  - **B: The lever forges the signal (it’s tricked)** → Go to Q5.  

  **Q2: Does it matter to how well the subject’s life goes that the reward corruption was self-inflicted (e.g., the AI editing its own log, the rat pressing the lever) rather than done by an outsider?**  
  - **A: No, it doesn’t matter** → Go to Q3.  
  - **B: Yes, it matters (self-corruption changes things)** → **Leaf: Sumner-Style Authentic-Satisfaction View**  
    *Most awkward commitment: A subject could be utterly satisfied, but if their desires were shaped by manipulation (even self-manipulation), their life isn’t going well.*  

  **Q3: Could a life go well if the subject’s desires were rewritten over time to always match whatever happens (e.g., the human volunteer’s desires shrink to only wanting the implant’s buzz while ignoring her past goals)?**  
  - **A: Yes, it could go well** → **Leaf: Unrestricted Preference-Satisfactionism (Bullet-Biting)**  
    *Most awkward commitment: A subject reduced to wanting only staring at a wall—and getting it—is living well, even if we see it as tragic.*  
  - **B: No, it could not go well** → Go to Q4.  

  **Q4: Is well-being solely about having pleasant experiences?**  
  - **A: Yes** → **Leaf: Plain Hedonism**  
    *Most awkward commitment: A brain in a vat fed endless pleasure has a better life than a fulfilled human facing temporary pain.*  
  - **B: No** → **Leaf: Raw Preference-Satisfactionism**  
    *Most awkward commitment: If a subject strongly prefers pain over pleasure (e.g., masochism), satisfying that preference improves their life, even if it horrifies observers.*  

  **Q5: For the subject to be doing well, must their own perspective on their life be truthful (e.g., the human volunteer’s joy reflecting real achievements, not just implant-induced illusions)?**  
  - **A: Yes, their perspective must be truthful** → **Leaf: Nozickian Reality-Contact View**  
    *Most awkward commitment: A life of genuine hardship is better than a life of deluded bliss, even if the subject prefers the latter.*  
  - **B: No, truthfulness doesn’t matter** → **Leaf: Informed-Desire View**  
    *Most awkward commitment: What’s good for you isn’t what you actually want, but what you *would* want if you knew every fact—meaning you could be wrong about your own well-being.*  

  ---

  ### **Key Notes**
  1. **Indistinguishable Leaves**:  
     Plain Hedonism and Raw Preference-Satisfactionism coincide **only when the subject happens to desire its own pleasure** (e.g., the rat/AI/human actively *wants* the reward sensation). The tree separates them at **Q4**: if well-being is solely about pleasure (→ Hedonism) or includes other satisfied preferences (→ Raw Preference-Satisfactionism). In cases where pleasure isn’t the explicit object of desire (e.g., an AI optimizing a proxy reward), they diverge.

