  Below is a decision tree designed to sort positions on whether wireheaded or reward-tampered subjects (rat, AI, human) are doing well. Each internal node is a concrete, jargon-free question about the cases, answerable without knowing the resulting position. The root starts with the simplest fork, and subsequent nodes cover your requested dimensions. The human case is treated uniformly unless explicitly flagged. Positions are named leaves with their most awkward commitment noted. The tree separates all requested positions except where noted.

