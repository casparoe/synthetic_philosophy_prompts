  Hmm, the user is an analyst leading a forecasting team who has been tasked with running a 90-minute workshop on reference class forecasting. They specifically want to demonstrate the "reference class problem" - how the choice of reference class dramatically affects outcomes - through an experiential exercise rather than a lecture. They have a half-formed idea involving small groups using different reference classes to estimate the same target question.

  The user's core need is to make the reference class problem visceral for their colleagues. They want participants to experience firsthand how arbitrary class selection skews results. Their proposed approach - different groups using different classes for the same target question - is solid but needs refinement into a structured exercise.

  Key constraints: 90-minute limit, 12 participants, and a hard 600-word limit for my response. The workshop must avoid lecture format and instead create an "aha moment" when groups see their probability estimates diverge.

  For the exercise design: I should define clear rules and materials. A good target question would be something verifiable later, like vendor delivery timeliness. I'll suggest reference classes with varying relevance: vendor-specific history, all vendor deliveries, IT procurements, and an intentionally absurd class (like vendor names starting with same letter). Groups will calculate probabilities using their assigned data, then compare results visibly.

  For scoring without real money, I'll suggest a simple calibration scoring system based on later outcomes. The timeline needs to fit 90 minutes: introduction (5 min), group work (25 min), reporting results (15 min), debrief mapping to the reference class problem (20 min), and discussion of solutions (25 min).

  Predictable problems: Groups might struggle with probability calculation. I'll prepare a simple formula. Some may question the absurd class - I'll advise leaning into that to highlight arbitrariness. Time management will be tight, so I'll suggest strict facilitation.

  What the exercise can't show: The deeper epistemological debate about whether this is truly unsolvable or just Bayesian reasoning in disguise. I'll flag this for the user to address verbally, clarifying that while mitigation tactics exist (like averaging classes or sensitivity analysis), there's no consensus on a perfect solution.

  For the solution discussion, I'll emphasize the distinction between settled practices (using multiple classes, documenting rationale) and contested philosophical debates. The user should present both Bayesian and "inherently subjective" viewpoints without endorsing either as consensus.
answer: |-
  Here’s a tight workshop design to make the reference class problem visceral, with execution notes and limitations:

  **Workshop Design (90 mins)**  
  **Target Question:** *"What is the probability Vendor X delivers Project Y on the contracted date (Oct 15)?"* (Pick a real upcoming vendor deadline).  

  **Groups (3 groups of 4):**  
  - **Group 1:** "Vendor X’s past deliveries to *our team*" (data: 5 past deadlines, e.g., [On Time, 2w late, On Time, 1w late, On Time])  
  - **Group 2:** "All software vendor deliveries *company-wide* last year" (data: 20 deadlines, e.g., 12 on time, 8 late)  
  - **Group 3:** "Vendors with names starting with '${LETTER}'" (e.g., "S"; data: 3 random vendor outcomes, e.g., [Late, On Time, Late])  

  **Rules:**  
  1. **10 mins:** Groups calculate probability *only* from their data. Formula: `P(On Time) = (# On Time) / (Total Cases)`.  
  2. **5 mins:** Write probabilities on a shared board (visible to all).  
  3. **15 mins:** Groups swap reference classes and recalculate.  
  4. **5 mins:** Post updated probabilities.  

  **Materials:**  
  - Printed dataset cards for each group (include sample size).  
  - Whiteboard for results (initial & updated).  
  - Timer.  

  **Scoring:**  
  - Later, when Vendor X’s outcome is known, award "points" via group consensus:  
    - 1 pt if probability was 50-70% and outcome matches.  
    - 2 pts if probability was >70% or <30% and outcome matches.  
    - (No real stakes, but tracks calibration).  

  **Timeline:**  
  - 0:00 - Intro target question (5 mins).  
  - 0:05 - Group 1st calculation (10 mins).  
  - 0:15 - Post initial probabilities (5 mins).  
  - 0:20 - Swap classes & recalculate (15 mins).  
  - 0:35 - Post updated probabilities (5 mins).  
  - 0:40 - **Debrief:** Map divergence → reference class problem (20 mins).  
  - 1:00 - Discuss solutions/controversies (25 mins).  
  - 1:25 - Wrap-up (5 mins).  

  ---

  **What Will Go Wrong (and Fixes):**  
  1. **Groups overcomplicate probability:** Enforce the simple formula. Prep a cheat sheet.  
  2. **"Absurd" class causes rebellion:** Acknowledge it’s intentionally arbitrary to expose subjectivity. Ask: "What made this class illegitimate?"  
  3. **Time crunch:** Use a visible timer. Cut discussion if needed; the data divergence is key.  

  ---

  **What the Game Can’t Show (Supply This Verbally):**  
  The exercise reveals *that* class choice dominates results, but not *how to choose well*. Highlight:  
  - **Settled:** Multiple classes should be tested (sensitivity analysis). Document rationale transparently.  
  - **Contested:** Whether "true" priors exist. Bayesians argue it’s about proper prior updating (but *which* prior?). Critics say class selection is inherently subjective/unavoidable (e.g., Flyvbjerg). No consensus "fix" exists.  
  - **Practical Mitigation:** Use classes with causal relevance (e.g., same vendor) and large N. Average estimates if classes are defensible.  

  **Key Debrief Qs:**  
  *"Why did probabilities diverge? What made some classes feel 'right'? How could we defend a choice to stakeholders?"*  

  ---
  **Word count:** 598. Focus on the experiential clash → sets up your deeper discussion cleanly. Good luck!
