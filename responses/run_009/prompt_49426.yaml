prompt: |-
  So my team at work (12 analysts, forecasting group) just got told we're switching to reference class forecasting for our project deadline estimates, and because I was the one who mentioned the term in a meeting, I've been voluntold to run a 90-minute workshop on it next month. great. The part I actually care about is the reference class problem itself — that which class of "similar past cases" you pick does all the work and there's no principled rule for picking it. I don't want a lecture-with-slides situation, I want them to run into the problem themselves before I name it.

  My half-formed idea: same target question for everyone (something with a findable answer later, like "will this one specific vendor deliver on the contract date"), but each small group gets handed a different reference class to start from — one group gets our past projects with that vendor, another gets all vendor deliveries ever, another gets something broader like "IT procurement delays" or maybe an annoyingly narrow one like "deliveries by vendors whose name starts with the same letter" to make the arbitrariness visible. They each come out with a probability, then we put the numbers on the board and watch them not match. But you're the one who should design the actual thing: rules, materials, how to score it without real money, timeline, and the debrief mapping what happened onto the problem.

  Two extra asks. First, tell me what will predictably go wrong the first time I run this and how to handle it. Second, be honest about which part of the actual issue the game can't reproduce and I'll have to supply myself.

  One more thing: when you touch on whether the problem has a solution — I know some people think it dissolves into ordinary Bayesian reasoning and others think that's dodging the question — separate what's genuinely settled from what's actually contested among people who know this stuff. I don't want to present one side's fix as the consensus view to a room of people who'll repeat it in meetings.

  Hard limit: 600 words total for your design, I will not read more than that before friday. tysm
