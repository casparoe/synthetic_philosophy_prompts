answer: |-
  Here’s a rigorous set of desiderata for genuinely **crane-like explanations**, designed to exclude both skyhooks *and* greedy reductionism, with tensions explicitly flagged. These criteria apply to explanations of emergent complexity (life, mind, culture, etc.) and are distilled from Dennett’s core arguments, evolutionary theory, and philosophy of science.

  ---

  ### **The Crane Desiderata: 7 Requirements**
  *(Non-negotiable in **bold**; contingent/weighted in plain)*

  1.  **No Smuggled Competence:**  
      *Each step must be performed by entities/processes **less sophisticated** than the phenomenon being explained.*  
      *Why?* If a step requires foresight, design, or cognitive capacity *equal to or greater than* the target phenomenon (e.g., explaining human intelligence by invoking a "homunculus" inside the brain), it’s a skyhook.  
      *Case:* Explaining bacterial flagellum evolution via stepwise mutation/selection (crane) vs. requiring "irreducible complexity" demanding a designer (skyhook).  

  2.  **Feasible Substrate Implementation:**  
      *The proposed process must be physically implementable by the available components/energy, within realistic timescales and environmental constraints.*  
      *Why?* An explanation requiring impossibly rare events, infinite time, or magic physics isn’t a crane.  
      *Case:* Natural selection works because replication + variation + selection *can* run on chemistry in a billion years; "quantum consciousness" invoking unproven, non-scalable quantum effects in warm, wet brains often fails this.  

  3.  **Constructive Generativity:**  
      *The process must demonstrably *generate* the target phenomenon from simpler precursors in a non-trivial way, not merely be consistent with it.*  
      *Why?* Many "just-so stories" (e.g., "aggression is adaptive for resource competition") are consistent with outcomes but don’t show *how* aggression *constructs* from simpler behavioral rules + selection.  
      *Case:* Game theory models showing how cooperation evolves via tit-for-tat strategies from simple replicators (generative) vs. stating "cooperation is adaptive" (non-generative).  

  4.  **No Deferred Miracle:**  
      ***The explanation cannot rely on unexplained (or unexplainable) components at its foundation.*** Crane-stacking is allowed (e.g., atoms → molecules → cells → organisms), but the bottom layer must itself be a crane (e.g., physics/chemistry), not a skyhook.  
      *Why?* "God did it" or "it’s just a fundamental law of mind" defers the miracle downward.  
      *Case:* Darwinian evolution builds on (then-unknown) genetics, which itself builds on chemistry → physics (cranes all down). Intelligent Design inserts a skyhook at the base.  

  5.  **Adequate Articulation (Anti-Greedy):**  
      *The explanation must identify the *specific intermediate machinery* (mechanisms, structures, information flows) doing the work at each relevant level of organization. Skipping levels is invalid.*  
      *Why?* Greedy reductionism violates this by jumping from quarks to consciousness, ignoring cognitive neuroscience, psychology, etc.  
      *Case:* Explaining language via cultural evolution of learnable grammars + neural learning mechanisms (articulated) vs. "language is an emergent property of complex systems" (vague, greedy).  

  6.  **Robustness to Perturbation:**  
      *The process should produce the phenomenon reliably under plausible variations in initial conditions or environmental noise, without fine-tuning.*  
      *Why?* Skyhooks (e.g., fine-tuned universe arguments) and flimsy cranes break if initial conditions change slightly. Robustness signals mindless, algorithmic processes.  
      *Case:* Convergent evolution (similar forms arising independently under similar pressures) demonstrates robustness of natural selection.  

  7.  **No Arbitrary Stoppage:**  
      *The process shouldn’t *prematurely halt* explanatory ascent where genuine further crane-work exists.*  
      *Why?* Stopping at "it’s genetic" for complex behaviors ignores gene-environment interactions, learning, and culture – a form of greedy *upward* reductionism.  
      *Case:* Sociobiology explaining altruism *only* via kin selection, ignoring cultural norms and learning (incomplete crane-work).  

  ---

  ### **Key Tensions Between Desiderata**
  *   **Feasibility (#2) vs. Articulation (#5):** Strict feasibility may demand overly simplistic models that skip levels (greedy). Full articulation may propose processes too slow/rare to be feasible. *Resolution: Require articulation of the* minimal *sufficient machinery consistent with feasibility.*  
  *   **Generativity (#3) vs. Anti-Greedy (#5):** Highly generative abstract models (e.g., some complexity theory) may lack biological/cognitive specifics. Overly specific models may lack generative power for novelty. *Resolution: Generative models must map plausibly to the substrate (#2); specific models must show generative scope.*  
  *   **Robustness (#6) vs. Novelty:** Extremely robust processes (e.g., basic physics) may seem insufficient for radical novelty (e.g., consciousness). *Resolution: Novelty arises from new combinations/configurations of robust lower-level processes via cranes (#1, #4).*

  ---

  ### **Testing Candidate Approaches (Briefly)**
  1.  **Straight Adaptationism (Neo-Darwinism):**  
      *Passes:* 1 (No Smuggled Competence), 2 (Feasible - usually), 4 (No Deferred Miracle), 6 (Robustness).  
      *Fails/Risks:* 3 (Generativity - weak on *how* specific novelties build), 5 (Articulation - often skips developmental/learning mechanisms), 7 (Arbitrary Stoppage - often ignores non-selective factors). *Vulnerable to greedy reductionism if oversimplified.*

  2.  **Memetics (Cultural Evolution):**  
      *Passes:* 1 (No Smuggled Competence - if memes are simple replicators), 3 (Generativity - in models), 4 (Cranes down to brains).  
      *Fails/Risks:* 2 (Feasibility - vague on neural implementation of meme copying fidelity), 5 (Articulation - often handwaves psychological mechanisms), 6 (Robustness - memes lack clear selection units/mechanisms like genes). *Can be a skyhook if "memes" are too smart.*

  3.  **Self-Organization/Complexity Theory:**  
      *Passes:* 2 (Feasibility - often mathematically tractable), 3 (Generativity - strong), 6 (Robustness - often inherent in models).  
      *Fails/Risks:* 1 (No Smuggled Competence - sometimes implies "laws of form" border on skyhooks), 4 (Deferred Miracle - if "emergence" is unexplained), 5 (Articulation - often lacks specific biological/cognitive implementation). *Vulnerable to skyhooks if emergence is mystical.*

  4.  **Intelligent Design (Control Skyhook):**  
      *Fails Catastrophically:* 1 (Smuggles Ultimate Competence), 4 (Deferred Miracle - Designer unexplained). *May pass* 3 (Generativity - "Designer built it") *trivially, but violates the core spirit of crane explanation.* Fails #2 (Feasibility of Designer?).

  ---

  ### **The Heavy Lifter: No Smuggled Competence (#1)**
  **This is the single most effective requirement for knocking out bad candidates.** It directly targets the core sin of skyhooks: explaining complexity by invoking unexplained, pre-existing complexity. It also implicitly guards against some greedy reductionism by forcing attention to the *specific, simpler* mechanisms doing the work at each level. While feasibility (#2) and no deferred miracles (#4) are crucial, #1 is the sharpest knife for dissecting pseudo-explanations that *sound* mechanistic but secretly rely on hidden intelligence, purpose, or unexplained sophistication. If an explanation violates #1, it’s almost certainly a skyhook or on very shaky ground. This is the line your editor wants.

  **In essence:** A genuine crane is a *mindless, implementable, generative, articulated, robust, non-miraculous lifting mechanism*. Its power comes not from what it *is*, but from *what it doesn’t assume* and *what it actually builds*.
