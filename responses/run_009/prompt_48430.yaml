  The core tension is between "seeing differently" versus "reporting differently" - and the frustration of watching this cycle repeat across decades. User wants a precise term for this specific pattern where: 
  (1) Original study frames effect as perceptual change 
  (2) Critical follow-up reveals it's actually response bias 
  (3) Yet the body sometimes "cooperates" (e.g. neural activity) 
  (4) It's not simple dishonesty 

  Key challenges they raise: 
  - Need a term that doesn't pre-judge (can't call it "bias" upfront) 
  - Must distinguish from related concepts like attention/memory effects 
  - Should capture the academic cycle aspect, not just individual behavior 

  Hmm... existing terms feel inadequate: 
  "Response bias" is too narrow (ignores the publication/replication dynamic) 
  "Demand characteristics" too broad (applies to any cueing) 
  "Replication crisis" too general 

  Considering coining a new term: 
  "Perceptual inflation" feels close - hints at exaggerated claims collapsing under scrutiny. But maybe too metaphorical? 
  "Reporting artifact cascade" - emphasizes the systematic error propagation 

  Wait - the user mentioned philosophy of perception too. Could borrow "epistemic leakage" from epistemology? But might be obscure for general audiences. 

  Perhaps "percept-report entanglement syndrome"? Too clunky. Need something crisp... 

  *Lightbulb* What about "The Framing Mirage"? 
