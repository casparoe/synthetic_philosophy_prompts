answer: |-
  ### One-Sentence Verdict
  Harsanyi's theorem establishes weighted utilitarianism only conditionally on contested assumptions, with interpersonal comparability being an insurmountable external requirement and Diamond's fairness objection exposing a serious normative gap.

  ### Ranked Defeaters
  1.  **Fatal: Interpersonal Comparability Requirement**  
      *   **Issue:** vNM utilities are unique only up to affine transformations (scale/zero point). Equal weights require *comparable* units across individuals. The theorem *presupposes* a specific cardinalization is normatively valid for aggregation but provides no justification for choosing it.  
      *   **World/Theory:** Individuals lack interpersonally comparable utility scales. Normative theory must supply the scaling (e.g., via "extended preferences" or fundamental equality), making the utilitarian sum *conditional* on this external input.  
      *   **Consequence:** The theorem proves *weighted* utilitarianism *if* comparable cardinal utilities are given; it doesn't *derive* classical utilitarianism from individual preferences alone. (Mongin, 1994 is key here). Harsanyians must concede this requires extra-normative input.

  2.  **Serious: Diamond's Fairness Objection (Against Equal Weights & Form)**  
      *   **Issue:** The SWF is indifferent between (A) giving a kidney to Person A for sure and (B) a fair lottery giving it to A or B. Many find (B) fairer ex-ante, even if ex-post outcomes are identical.  
      *   **Defender Replies & Immunization:**  
          *   *Concede the Implication:* Pure ex-post utilitarianism *is* indifferent. Diamond shows utilitarianism conflicts with ex-ante fairness.  
          *   *Dismiss as Changing Axioms:* The theorem assumes only vNM axioms + Pareto. If society values ex-ante fairness, it violates vNM axioms (specifically Independence) *at the social level*. It's not a flaw *within* the theorem's strict assumptions.  
          *   *Qualification:* The theorem fixes the *form* (weighted sum) of the *ex-post* evaluation. How chances are distributed isn't addressed.  
      *   **Assessment:** The "qualification" is correct logically but feels like immunization; it highlights the theorem's inability to capture procedural fairness values many deem essential. A serious normative cost.

  3.  **Serious/Awkward: Pareto Over Risky Prospects & "Sure Outcomes" Device**  
      *   **Issue A (Pareto over Lotteries):** Social preference must respect unanimous individual strict preferences over *any* lotteries. This rules out society caring about *how* risk is distributed (ex-ante fairness/equality) independently of final outcomes. Diamond exploits this.  
      *   **World/Theory:** Society cares about the fairness of the *process* (e.g., equal chances) even when everyone is indifferent ex-post between outcomes.  
      *   **Issue B (Allocations as Sure Outcomes):** Treating "allocation to person i" as a "sure outcome" within the social lottery assumes the *only* thing that matters is *who* gets *what* in the final state. It ignores the *identity* of the risk-bearers or the *correlation* of risks across individuals.  
      *   **World/Theory:** The *distribution* of risk exposure matters normatively (e.g., avoiding systematically exposing the same person to bad luck).  
      *   **Assessment:** These assumptions embed a purely consequentialist, outcome-focused view. Violations show the framework is restrictive. Defenders dismiss this as outside the theorem's intended scope.

  4.  **Awkward/Live Rivals: Modest Axiom Variations Yield Non-Utilitarian SWFs**  
      *   **Prioritarianism/Equality Aversion:** Dropping/additivity or modifying Pareto can yield prioritarian SWFs (e.g., sum of concave transformations of utilities). Requires relaxing vNM axioms or Pareto in specific ways.  
      *   **Variable Populations:** Extending Harsanyi's setup to variable population size leads to severe problems for utilitarianism (e.g., the Repugnant Conclusion). Non-additive SWFs (e.g., Critical-Level Utilitarianism) are major live rivals requiring different axiomatizations (Blackorby, Bossert, Donaldson).  
      *   **Assessment:** These are genuine, live alternatives within welfare economics, showing Harsanyi's axioms aren't uniquely compelling. They escape by relaxing assumptions Harsanyi deemed essential.

  **Conclusion:** The theorem proves less than its reputation suggests. It establishes that *if* you demand vNM rationality for society and individuals *and* Pareto over lotteries *and* accept a purely consequentialist framing treating allocations as outcomes, *then* the SWF must be a weighted sum of vNM utilities. However, it **fails to deliver interpersonal comparability** (fatal to deriving *classical* utilitarianism internally) and **fails to accommodate ex-ante fairness concerns** (a serious normative limitation). Its insulation relies on restrictive assumptions that many find normatively inadequate; this very restrictiveness is a defect when presented as a foundational justification for utilitarianism. It proves conditional weighted utilitarianism, not unconditional classical utilitarianism.
