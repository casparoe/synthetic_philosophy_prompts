  Okay, let me approach this systematically. The user needs a teaching plan for a 90-minute session on epistemic game theory focused on common knowledge of rationality (CKR), with specific constraints and audience considerations. 

  First, considering the audience mix: half haven't seen payoff matrices, some ML folks, and one critical econ PhD. The core challenge is building understanding of CKR without getting bogged down in formalism. The user's debate about starting points (muddy children vs. game example) reflects a tension between intuitive puzzles and practical application. 

  I notice the user is particularly concerned about misconceptions. The "common knowledge as repeated mutual knowledge" error seems fundamental to address early. Also the "father's announcement adds no information" misunderstanding could derail understanding of public announcements in CKR. And the rationalist-group-specific "bootstrapping cooperation" issue requires careful handling since it relates to real-world coordination failures.

  For structure, I'm thinking:
  - Must establish mutual vs common knowledge distinction visually and concretely before anything else
  - Muddy children works well here but needs explicit bridge to game theory
  - Then transition to a simple game matrix to show CKR enabling iterated deletion
  - The "k-levels suffice" result should come late as a reveal after they've struggled with the infinite regress

  The carrying example should be a single scenario that shows both the puzzle aspect and game theory application. Coordinated attack is tempting but too abstract. Maybe modify muddy children to include payoffs? Or use a simple coordination game with asymmetric information.

  Key misconceptions to preempt:
  1. After defining mutual knowledge: "So common knowledge is just more levels?" → Nope, infinite regress matters
  2. When father speaks: "But kids already knew this!" → Clarify that the announcement transforms mutual into common knowledge
  3. Post-game example: "So rational agents always coordinate?" → Emphasize that CKR enables but doesn't guarantee coordination

  For the k-levels result: Present it as a "practical cheat" after they've seen the tower collapse in muddy children. Frame as "The magic is that finite depth unlocks infinite reasoning"

  Should explicitly avoid:
  - Belief vs knowledge distinction (too philosophical)
  - Backward induction epistemic conditions (too advanced)
  - Anything requiring measure theory

  Ending question: "Why don't the generals in coordinated attack problem just assume CKR and attack?" If they grasp that CKR can't be bootstrapped from nothing, the idea landed.
answer: |-
  Here’s the plan, step by step, like we’re chatting over coffee after one of those meetups. Start by grounding everyone in **why common knowledge matters** before even saying the phrase. Forget slides; the whiteboard is your friend. Draw two stick figures facing each other, label them Alice and Bob. Pose a scenario: *They both want to meet for coffee tomorrow. Alice prefers Starbucks, Bob prefers Peet’s, but both hate missing each other more than they hate the wrong place.* Sketch a simple payoff matrix—even if half haven’t seen one, keep it visceral: rows for Alice’s choices (Starbucks/Peet’s), columns for Bob’s. Show that no single choice dominates. Ask, "What do they do?" Let the econ PhD groan; it’s fine. This takes ten minutes and forces the question: *How do we resolve uncertainty without communication?*  

  Now, **transition to the muddy children puzzle**. Not as a parlor trick, but as a lens for how knowledge propagates. Set up classic three muddy kids. Emphasize each step: after the father’s announcement, after the first "no," after the second "no." Ask, "Why didn’t they figure it out immediately?" Draw the knowledge tiers: "Kid A sees two muddies, so A knows B sees mud somewhere. But A doesn’t know if B sees mud on C—or if B thinks C sees mud on A?" Unpack the recursion until someone gasps. The key here is showing that the father’s announcement *creates common knowledge* of at least one muddy forehead. Preempt the misconception early: "Yes, every kid saw muddy faces, but no kid knew that others knew it was public. The announcement isn’t new *facts*—it’s new *structure* for their uncertainty." This should take twenty minutes.  

  **Pivot back to game theory** with a dominance-solvable game. Use the "Traveler’s Dilemma": two travelers claim luggage value (say 2 to 100). Airline pays both the lower claim, plus a bonus to the lower claimant, minus a penalty to the higher. Start small: "If you could only claim 99 or 100, what dominates?" Show that 99 beats 100. Then: "If you both know no one claims 100, does 98 dominate 99?" Iterate down to the Nash equilibrium (usually 2). Stress that *each deletion requires both players to know the other is rational, and to know that the other knows, and so on*. Hammer: "Mutual knowledge isn’t enough. If you stop at ‘I know you’re rational,’ I might think you doubt my rationality and you’ll overclaim." Twenty minutes here.  

  **Now fuse the insights**. "So why do the generals never attack?" Sketch coordinated attack: two armies, messengers might get lost. Emphasize that after any finite number of message confirms, it’s mutual knowledge ("I know you got my plan, you know I know...") but not common knowledge. The econ PhD will nod here; the ML folks might lean in. Crush the bootstrapping fallacy: "Can rational agents just *assume* CKR? No—because if you assume it unilaterally, you might coordinate while I defect, thinking you’ll defect. CKR isn’t a belief; it’s a *shared epistemic state* forged by public events (like the father’s announcement). Without that event, you can’t get there." This is where you quietly murder the rationalist pathology. Fifteen minutes.  

  **Reveal the punchline** about finite levels of knowledge. Right after showing k rounds of deletion in Traveler’s Dilemma, say: "Here’s the magic: you only need k levels of ‘I know you know...’ to justify k deletions. The infinite tower collapses when you hit the game’s logical ceiling." Frame it as a relief—"No one needs infinite brainpower!"—and tie it to muddy children: "The kids only needed two levels of knowledge for three players. Finite puzzles, finite steps." If the matrix-newbies glaze over, point back to the puzzle: "It’s why the third kid figured it out after two ‘no’s." Ten minutes, max.  

  **What to omit**: Absolutely skip common belief vs. knowledge (too philosophical) and epistemic conditions for backward induction (too dense). If the PhD sighs, say, "Next session, I’ll buy you a beer and you can school me."  

  **End with one question**: "In the coordinated attack problem, after the 10th messenger confirms receipt, General A thinks, ‘Surely we both know the plan. Why not attack?’ What’s wrong with his thinking?" If they say, "He can’t be sure she knows he knows," or "It’s not common knowledge yet," the idea landed. If they shrug, you’ll know.  

  Total arc: coffee game (10 min) → muddy children (20 min) → Traveler’s Dilemma (20 min) → coordinated attack + bootstrapping trap (15 min) → finite-levels reveal (10 min) → Q&A (15 min). Bring markers, and when you draw the first payoff matrix, say, "This is just a spreadsheet for ‘what happens if.’" You’ve got this.  

  ---  

  *P.S. The carrying example is muddy children + Traveler’s Dilemma, glued by coordinated attack. The drama’s in the stakes (coffee, shame, war), the puzzle’s in the logic, and the game’s in the matrices. And yes, openly refuse the belief/knowledge rift—it’s a meetup, not a seminar.*
