  First, I need to address their pain points: lack of concrete steps, fuzzy scoring leading to false precision, and ignoring the board's local focus. The procedure must be lightweight—no heavy data demands since most applicants can't provide metrics. It should also explicitly separate factual ITN scoring from values-based decisions, especially when ITN pushes toward global causes against local preferences.

  For the three-step procedure, I'll design it as a filter: Importance first (is this big enough to consider?), then Tractability (can it move the needle?), then Neglectedness (is there leverage?). Each step has clear pass/fail thresholds using proxies like beneficiary counts or expert consensus when data is scarce. Multiplying scores seems pseudo-scientific here—better to use tiered ratings (High/Med/Low) and only compare proposals that pass all three filters. 

  Key innovations: 
  - A "values override" flag when ITN conflicts with board priorities (e.g., local vs. global).
  - Explicitly defining Neglectedness as "underfunded despite merit" to avoid mistaking bad ideas for neglected ones.
  - Failure mode checks like "is tractability just confidence?" or "does scale ignore depth of impact?"

  For the test cases: 
  - The food bank (local darling) should fail Neglectedness but trigger a values discussion. 
  - The literacy org with thin evidence might fail Tractability despite appealing scale. 
  - The pandemic fund should ace ITN but clash with local focus—perfect for demonstrating the values flag. 

  The goal isn't to replace judgment but to make it more rigorous. When ITN and values conflict, the procedure should surface that tension rather than hide it behind math. For this foundation, that honesty is more valuable than false objectivity.
answer: |-
  Here's a practical ITN procedure designed for your constraints: a half-day review of 10-15 proposals, minimal data requirements, and explicit "judgment call" flags. It prioritizes **triage** over false precision and forces value conflicts into the open.

  ---

  ### **The Procedure: 3-Step Triage with Values Flags**
  **Tools Needed:** Proposal docs, spreadsheet, timer (45 min/proposal max), board's predefined geographic priorities.

  #### **STEP 1: IMPORTANCE (Gatekeeper Question)**
  *   **Question:** *"If this worked perfectly, how many lives would it significantly improve per $100K, adjusted for depth/duration?"*
  *   **Proxies & Thresholds:**
      *   *High:* Directly impacts >1,000 people/year OR prevents severe harm (death/displacement) to >10 people/year per $100K. *(e.g., bed-nets for malaria)*
      *   *Medium:* Impacts 100-1,000 people/year OR addresses systemic risk with high downside. *(e.g., job training for 50 youth)*
      *   *Low:* Impacts <100 people/year AND no catastrophic risk mitigation. *(e.g., museum exhibit)*
  *   **Sufficient Evidence:** Order-of-magnitude estimates accepted. If no numbers: **Require** a clear theory of change *how* impact scales (e.g., "Trains 10 teachers who each reach 100 students/year"). Reject if entirely hand-wavy.
  *   **Decision:** **Reject** if LOW Importance. MEDIUM/HIGH proceed.

  #### **STEP 2: TRACTABILITY (Feasibility Filter)**
  *   **Question:** *"Is there credible evidence (even indirect) that this approach can cause the change, and this team can deliver it?"*
  *   **Proxies & Thresholds:**
      *   *High:* RCT or rigorous quasi-experimental evidence for *this specific intervention* OR strong logical link to a proven mechanism + experienced team. *(e.g., cash transfers w/ evidence)*
      *   *Medium:* Plausible theory + pilot data (even unpublished) + competent team OR adaptation of proven approach to new context. *(e.g., literacy program w/ pilot)*
      *   *Low:* Novel mechanism with no evidence/logic chain, or team lacks relevant track record. *(e.g., untested AI tool)*
  *   **Sufficient Evidence:** Published studies > internal reports > expert consensus > founder confidence. Demand *specifics* on past success.
  *   **Decision:** **Reject** if LOW Tractability. MEDIUM/HIGH proceed.

  #### **STEP 3: NEGLECTEDNESS (Leverage Lens)**
  *   **Question:** *"Is this funding gap due to underappreciation/coordination failure (good leverage), or is it a bad bet others avoided (bad signal)?"*
  *   **Proxies & Thresholds:**
      *   *High:* Core funding gap in a field with <3 major funders OR your grant >5% of their annual budget. *Explicitly confirm* others aren't funding due to oversight/capacity, not flaws. *(e.g., pandemic fund in 2019)*
      *   *Medium:* Some comparable funders exist, but your grant adds unique value (e.g., seed funding, local match) OR fills a specific niche.
      *   *Low:* Well-funded field (>5 similar funders) OR your grant <1% of org's budget without strategic rationale. *(e.g., large food bank)*
  *   **Sufficient Evidence:** Candid talk with ED about funding landscape > public databases (Candid, org reports) > guesswork.
  *   **Decision:** **Reject** if LOW Neglectedness *unless* it triggers a **Values Flag**.
  *   **CRITICAL CHECK:** Ask *"Why aren't others funding this?"* If answer hints at "tried and failed," "ethical concerns," or "lack of demand" → **Reject for cause**.

  ---

  ### **Scoring & Comparison: No Fake Math**
  1.  **Categorize, Don't Calculate:** Assign H/M/L for each ITN dimension. **DO NOT MULTIPLY.** Fuzzy math hides bad judgments.
  2.  **Prioritize:** Proposals surviving all 3 steps are "ITN-Viable." Rank them by:
      *   **Rule 1:** Any HIGH/HIGH/HIGH > others.
      *   **Rule 2:** For others, count "HIGH" scores. Break ties with board values.
  3.  **The Values Flag:** If a proposal fails **only Neglectedness** but is **core to your geographic mandate** (e.g., local food bank), tag it "VALUES OVERRIDE." Present separately to the board: *"This fails ITN on leverage, but advances our local priority. Fund?"*

  ---

  ### **Key Failure Modes & Cheap Fixes**
  1.  **"Neglectedness = Obscurity" Mistake:**  
      *   **Fix:** Mandatory "Why aren't others funding this?" question. Reject if red flags emerge.
  2.  **"Tractability = Confidence" Mistake:**  
      *   **Fix:** Require *evidence type* (RCT/pilot/logic) + team *track record*. Override confidence without evidence.
  3.  **"Scale vs. Depth" Blind Spot:**  
      *   **Fix:** In Importance, ask *"How life-changing is this per person?"* (e.g., meals vs. saving a life). Adjust thresholds qualitatively.
  4.  **"ITN as Excuse" for Pet Projects:**  
      *   **Fix:** Document proxies/rationale for *every* H/M/L. Make assumptions explicit. "Because it's cool" isn't a proxy.
  5.  **False Precision Theater:**  
      *   **Fix:** Ban numbers > order-of-magnitude. Use tiers. Admit uncertainty.

  ---

  ### **Running Your Test Cases**
  **Assumptions:** Board mandates local focus but allows global grants if ITN is overwhelming. $100K grants.

  1.  **Local Food Bank Expansion (Well-known, $100K ask)**  
      *   **Importance:** HIGH (Feeds thousands locally, prevents hunger).
      *   **Tractability:** HIGH (Proven model, strong team).
      *   **Neglectedness:** LOW (Many local funders; your grant <5% of budget). **Fails ITN.**  
      *   **VERDICT:** **VALUES OVERRIDE FLAG.** Present to board: *"ITN says no due to low leverage in a crowded field. But it's hyper-local and effective. Fund anyway?"*

  2.  **Early Literacy Intervention ($100K ask, unpublished pilot)**  
      *   **Importance:** MEDIUM/HIGH (Lifelong benefits if effective, but per-dollar scale moderate).
      *   **Tractability:** MEDIUM (Pilot data exists but not peer-reviewed; team may lack scale experience).
      *   **Neglectedness:** MEDIUM (Niche approach, few specialist funders; your grant >10% of budget).  
      *   **VERDICT:** **ITN-VIABLE (M/H/M).** Competitive but not stellar. Prioritize below HIGH/HIGH/HIGH.

  3.  **Pandemic Preparedness Pooled Fund ($100K ask)**  
      *   **Importance:** VERY HIGH (Mitigates existential risk; impacts millions).
      *   **Tractability:** MEDIUM/HIGH (Evidence for preparedness ROI; pooled fund leverages expertise).
      *   **Neglectedness:** HIGH (Minimal private funding pre-2020; $100K is catalytic).  
      *   **VERDICT:** **ITN-VIABLE (H/H/H).** Top priority by ITN. **Values Conflict Alert:** *"This global opportunity ranks highest by ITN but conflicts with local focus. Board must decide: override mandate for max impact?"*

  ---

  ### **Where the Procedure Stops & Judgment Takes Over**
  1.  **Threshold Setting:** What's "enough" impact per $100K? (Board input needed).
  2.  **Evidence Weight:** Is an unpublished pilot + theory enough? (Staff judgment).
  3.  **Values Overrides:** Funding local vs. global when ITN conflicts (Board decision).
  4.  **Trade-offs:** Between two MEDIUM/HIGH/MEDIUM proposals (Board/staff priorities).

  **Output for Board:** A clear spreadsheet showing:
  - ITN ratings (H/M/L) + rationale
  - ITN-Viable? (Y/N)
  - Values Override Flag? (Y/N)
  - **No overall score** – just categorization and flags.

  This forces discussion onto *why* something is High Importance, not whether "8.2 > 7.9." It makes value conflicts visible rather than laundering them through bad math. At your scale, the goal isn't perfect EA alignment – it's **killing vibes with structure** and **making trade-offs explicit**.
