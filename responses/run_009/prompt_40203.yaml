  I've got a student who wants to do a PhD on predictive processing and the free energy principle — strong formal background (physics MSc), decent but not deep philosophy of science, realistically one project over three or four years. Everyone keeps telling her the big open question is whether the FEP is falsifiable, full stop, but I suspect that framing lumps together several distinct problems that shouldn't be ranked together: whether the principle is a normative/mathematical truism or an empirical claim about actual brains, whether Markov blankets can really do the work of individuating organisms and their boundaries, whether active inference adds anything that optimal control theory and reinforcement learning didn't already give us, and what "surprise" even means when it's defined over states the agent supposedly never touches. She can realistically take on one of these, maybe two. So: which one would you steer her toward, and in what order? Defend the ranking — what's upstream of what, which of these genuinely need the math she has versus a philosophy-of-science toolkit she'd have to acquire, and which are traps in the sense that settling them wouldn't change how the others go. And if you think I've carved up the terrain badly and there's a better decomposition, say so, but then tell me what it is and redo the ranking under it.
