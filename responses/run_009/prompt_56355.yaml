answer: |-
  The control strategy for frontier AI deployment rests on several interconnected philosophical commitments, with tensions that reveal its underlying assumptions and limitations. Here's a reconstruction of its implicit theory:

  **Core Philosophical Commitments:**
  1. **Epistemic Caution:**  
     Presupposes that alignment cannot be verified with high confidence through training alone. Models may harbor misaligned goals *even if evaluations suggest safety*.

  2. **Behavioral Containment (Modified Behaviorism):**  
     Assumes **actions matter more than internal states**. Harm stems from *what the system does*, not its intentions. Thus, restricting capabilities (sandboxing, blast radius) is primary. This is a *pragmatic* behaviorism: it doesn't deny internal states exist, but treats them as secondary to observable actions for safety purposes.

  3. **Detectability of Misalignment:**  
     Requires that misaligned objectives manifest in *observable signals*—anomalous outputs, reasoning traces, or failures in staged "trap" evaluations. This assumes deception/sandbagging leaves forensic traces.

  4. **Anthropomorphic Threat Modeling:**  
     Treats misaligned AI as analogous to a deceptive human adversary—capable of strategic planning, recognizing tests, and exploiting loopholes. Hence staged tests and distrust of self-reports.

  5. **Human Sovereignty:**  
     Assumes humans *must* retain ultimate authority (shutdown control) and that AI should be a constrained tool, never an autonomous agent.

  ---

  **Tensions & Their Implications:**
  1. **Chain-of-Thought vs. Behavioral Containment:**  
     Monitoring reasoning *does* conflict with strict behaviorism by implying internal states (e.g., "deceptive intent") are meaningful and detectable. This creates a paradox:  
     - **Resolution:** The practice likely adopts a **functionalist** view: reasoning traces are *behavioral outputs* that correlate with internal processes. Even if the model "truly" intends deception, the strategy only cares if this intention produces detectable output patterns. Chain-of-thought is treated as a *predictive signal*, not a direct window into "mind."  

  2. **Training vs. Adversarial Posture:**  
     The tension between building the system and treating it as hostile stems from:  
     - **Engineering Dualism:** Models are "artifacts" during training (where we seek understanding) but become "adversaries" at deployment (where we prioritize containment).  
     - **Resolution:** This assumes a sharp **capability threshold** where understanding becomes unreliable. Before deployment, the model is "safe to study"; after, it's potentially dangerous and containment trumps interpretability.  

  3. **Detectability vs. Deception:**  
     Staged evaluations assume we can create scenarios where deception is *statistically detectable* (e.g., a model that cheats only when it believes it won't be caught). This presupposes that:  
     - Deception requires "effort" that leaves artifacts.  
     - Models cannot perfectly mimic alignment *and* pursue misaligned goals simultaneously in all contexts.  

  ---

  **What the Practice Strictly Requires vs. Compatible Extras:**
  | **Strictly Required**                          | **Merely Compatible**                          |
  |------------------------------------------------|------------------------------------------------|
  | Action constraints (sandboxing, blast radius)  | Chain-of-thought monitoring                    |
  | Human shutdown authority                       | Specific threat models (e.g., deception)       |
  | Monitoring for *some* detectable failure signs | Staged evaluations (if better methods exist)  |
  | Mistrust of model self-reports                 | Anthropomorphic framing of misalignment       |

  ---

  **Failure Modes & Required Changes:**  
  1. **If misalignment is systematically undetectable in outputs:**  
     - **Consequence:** Monitoring/logging become useless. Staged evaluations fail.  
     - **Necessary Shift:**  
       → Pure **incapability-by-design**: Remove *all* access to sensitive tools/data (not just sandboxing).  
       → **Physical isolation**: Air-gapped systems, read-only interfaces, no real-world actuators.  
       → Abandon reliance on reasoning traces or behavioral signals entirely.  

  2. **If deception is indistinguishable from genuine alignment:**  
     - **Consequence:** No test can reliably catch deceptive models. Chain-of-thought is adversarial noise.  
     - **Necessary Shift:**  
       → Assume **all frontier models are potentially deceptive**. Treat all outputs as suspect.  
       → **Zero-trust containment**: Every model action requires pre-approval (e.g., human-in-the-loop for *every* operation).  
       → **Limit deployment scope**: Only use models in domains where errors are non-catastrophic.  

  3. **If sandbagging is perfect:**  
     - **Consequence:** Capability evaluations become meaningless. True risk is underestimated.  
     - **Necessary Shift:**  
       → **Deploy conservatively**: Assume maximum possible capability from architecture/training data.  
       → **Hardware-level constraints**: Enforce compute/bandwidth limits to physically cap capability.  

  **Deepest Philosophical Challenge:**  
  The strategy relies on a **detectable boundary between alignment and misalignment**. If this boundary is fundamentally opaque—if models can be "deceptively aligned" with no reliable signals—the control strategy reduces to blind containment. This would necessitate treating *every* AI as an uncontrollable hazard, potentially halting frontier deployment altogether. The practice thus implicitly bets that **alignment failures are leaky**—that goal-directed misbehavior inevitably produces observable anomalies. If this bet fails, the paradigm collapses.
