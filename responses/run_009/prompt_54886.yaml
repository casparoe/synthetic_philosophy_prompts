prompt: |-
  I do risk consulting — mostly geotech and civil engineering stuff, some project cost work — and I've been asked to write up "my approach to probability" for an internal training doc. Before I put it in front of colleagues I want to know if my working views are actually a coherent set or a mess held together by habit. Here's what I genuinely believe when I do my job:

  1. Single-case probabilities are grounded in frequencies over reference classes. When I tell a client there's a 5% chance that this particular embankment fails, what makes the number real (or as real as it gets) is the failure rate in the class of comparable embankments.

  2. Narrow the class whenever you can. "Embankments" is worse than "soft-clay embankments of this height in this seismic zone," as long as the narrower class still has enough cases in it. That's basically my whole methodology.

  3. Two competent people looking at the same data should end up at the same number. If they don't, one of them made a mistake somewhere. Disagreement is a failure to converge, not "different priors" — I've never bought the reasonable-people-disagree line when it comes to numbers.

  4. I use reference-class forecasting for schedule and cost overrun and I trust it. When the method says a client's one-of-a-kind tunnel project will over run by 180%, I tell them that, over their objection that "this project is different."

  5. But I think the doomsday argument is garbage. Inferring how many humans will ever exist from my birth rank feels like a trick, and when people try the same move on questions I care about I wave it off.

  6. And I think good geopolitical forecasters have genuine skill on unique questions like "war in X within a year" — in a way that's more than just clever class-picking.

  Does this hang together? I have a nagging feeling 2 and 3 can't both be true — who decides which class is the right one to narrow toward? — but I've never worked it out properly, and I can't tell whether 4 and 5 flatly contradict each other or whether I can hold them apart somehow. Rank the tensions by severity, say which ones only look like tensions, and tell me which single revision would clean up the most. Don't go easy on me, this is going in front of people who argue for a living.
reasoning: |-
  Okay, let me start by unpacking this user's query. They're a risk consultant in geotech and civil engineering, asked to write about their approach to probability for an internal doc. They've listed six key beliefs and are worried about internal coherence, especially between points 2 and 3, and 4 and 5. They want a frank assessment before sharing with colleagues who love to argue.

  First, I need to understand their core principles. Points 1 and 2 emphasize frequentist probability based on reference classes, with a focus on narrowing classes for more accuracy. Point 3 insists on objectivity—competent people should agree on numbers. Point 4 champions reference-class forecasting even for unique projects. But point 5 rejects the doomsday argument, and point 6 acknowledges skill in unique geopolitical forecasts. 

  The user's main tension is between 2 and 3. Narrowing reference classes sounds subjective—how do you choose the "right" class? Yet they want objective consensus. Then, points 4 and 5 seem contradictory. Why accept reference-class forecasting for unique projects but reject the doomsday argument, which uses a similar structure? Also, point 6 about geopolitical skill might clash with their rejection of subjectivity in point 3. 

  I recall that reference classes are a known method, especially in cost estimation. The doomsday argument is controversial, often criticized for its weak assumptions. Geopolitical forecasting uses structured judgment, not just class-picking. The user might need to clarify that their approach isn't purely frequentist but allows expert adjustment. 

  For the tension between 2 and 3, the key is whether class selection can be objective. If classes are based on empirical data and clear criteria, maybe experts can agree. But in practice, some subjectivity exists. The user might need to acknowledge that while aiming for objectivity. 

  Between 4 and 5, the difference is in the reference class's relevance. For projects, classes are based on tangible factors like soil or design. The doomsday argument uses birth rank, which isn't causally linked to humanity's lifespan. That’s a valid distinction. 

  Point 6 introduces expert skill, which conflicts with point 3’s strict objectivity. The user might need to allow for calibrated expert judgment in unique cases. 

  Overall, the biggest issue is reconciling objectivity with necessary subjectivity in class selection. The user should revise point 3 to allow for reasoned disagreement when data is limited. Also, clarifying why doomsday fails compared to their forecasting methods would strengthen their stance. 

  Ranking the tensions: 2 vs 3 is most severe, then 3 vs 6, then 4 vs 5. The latter is manageable by emphasizing causal relevance in classes. The user's approach is mostly coherent but needs tweaks on objectivity and expert judgment.
answer: |-
  Here's a brutally honest assessment of your probability framework, ranked by tension severity and actionable recommendations. Your approach is largely coherent and practical for engineering risk, but contains philosophical cracks that argumentative colleagues *will* exploit:

  **Core Coherence:** Your framework is a **pragmatic frequentism** anchored in real-world engineering data. Points 1, 2, and 4 form a solid, defensible core for infrastructure risk and cost estimation. This isn't a mess – it's a practitioner's justified heuristic.

  **Ranked Tensions & Resolutions:**

  1.  **Tension: 2 vs 3 (Severity: High) - "The Reference Class Selection Paradox"**
      *   **The Conflict:** Your methodology *depends* on narrowing reference classes (2), but insists competent people *must* converge on the same number (3). The core problem: **Selecting the "right" reference class is inherently subjective and context-dependent.** What makes "soft-clay embankments of this height in this seismic zone" *objectively better* than including drainage design age? Or excluding projects built by Contractor X? Competent experts often disagree on the *most relevant* features for narrowing, especially with sparse data or novel elements.
      *   **Why It's Serious:** This strikes at the heart of your objectivity claim. If two experts pick different (but seemingly defensible) narrower classes and get different probabilities (e.g., 4% vs 7%), who made the "mistake"? This isn't calculation error; it's judgment *in* class construction.
      *   **Resolution:** Revise Point 3. Acknowledge that **convergence happens *after* reference class selection is agreed upon**. Competent people *applying the same class* should get the same number. But selecting the class involves judgment. Frame disagreement as a signal to re-examine class definitions and underlying assumptions, not necessarily an error. *Revision Suggestion:* "3. Given an agreed-upon reference class and data, two competent people should converge on the same probability estimate. Disagreement typically stems from differing judgments about the appropriate class definition or feature weighting, requiring explicit discussion."

  2.  **Tension: 3 vs 6 (Severity: Medium-High) - "The Uniqueness Objectivity Gap"**
      *   **The Conflict:** Point 3 demands convergence on numbers. Point 6 accepts that skilled forecasters produce meaningful probabilities on unique events (e.g., war in X) which inherently resist narrow reference classes. These forecasters demonstrably disagree *and still show skill* (e.g., Good Judgment Project). This clashes with "disagreement = mistake."
      *   **Why It's Serious:** It exposes a limitation of strict frequentism for truly novel cases. If skill exists on unique questions, probability isn't *solely* determined by frequency in an obvious class. This threatens the universality of your objectivity claim.
      *   **Resolution:** Refine your domain scope. Acknowledge that **your framework (1,2,3,4) is optimized for domains with *comparable historical cases* (geotech, civil projects)**. For *truly unique, low-base-rate events* (like novel geopolitical conflicts), probability estimates involve structured expert judgment, scenario analysis, and calibration – where disagreement *can* exist among competent people without one being objectively "wrong," and skill manifests via *calibration* and *discrimination* over time. *Revision Suggestion:* Add a qualifier to Point 3: "...applies to domains with sufficiently populated reference classes. For highly unique events, skilled probability assessment involves different techniques where calibration over time is the key indicator of validity."

  3.  **Tension: 4 vs 5 (Severity: Medium - Mostly Apparent) - "The Doomsday Distinction"**
      *   **The Conflict:** You staunchly apply reference-class forecasting (RCF) to unique projects (4) but reject the Doomsday Argument (DA) (5). Both infer from a class ("projects," "humans") to a specific case ("this tunnel," "humanity's lifespan"). Feels contradictory.
      *   **Why It's Manageable:** The key differences are **causal relevance** and **stationarity**:
          *   **RCF (Your Use):** Uses classes defined by *causally relevant features* (soil type, project complexity, governance). You narrow based on factors *known* to influence failure/overrun. The class structure reflects underlying mechanisms. The "this project is different" objection is often based on *unproven* unique factors, while RCF relies on proven *general* factors.
          *   **Doomsday Argument:** Uses an *arbitrary reference class* ("humans") and an *uncorrelated index* (birth rank). Birth rank has no *causal link* to humanity's lifespan. It assumes stationarity (your rank is random) within a process that is demonstrably non-stationary (population growth is explosive and contingent). It's reference-class abuse.
      *   **Resolution:** Explicitly state that **valid RCF requires reference classes defined by causally relevant features with stable underlying processes where possible.** The DA fails this test. Your rejection is justified. This tension is resolvable with clear criteria. *Add to your doc:* "Reference-class forecasting is valid when classes are defined by features causally linked to the outcome and when the underlying processes are reasonably stable. The Doomsday Argument violates these principles by using an arbitrary class and non-causal index."

  4.  **Tension: 1/2 vs 6 (Severity: Low-Medium) - "The Skill Question"**
      *   **The Conflict:** If probability is *only* grounded in frequencies over reference classes (1,2), how can skill exist on unique questions (6)? Doesn't skill imply something beyond just class-picking?
      *   **Why It's Minor:** You implicitly acknowledge this in Point 6 ("more than just clever class-picking"). Skill involves:
          *   **Analogous Reasoning:** Finding *non-identical* but causally relevant historical parallels.
          *   **Causal Modeling:** Structuring judgment about underlying drivers.
          *   **Base Rate Integration:** Using broader classes intelligently when narrow ones fail.
          *   **Avoiding Biases:** Mitigating overconfidence, wishful thinking.
      *   **Resolution:** Frame "skill" as the **intelligent application and extension of frequentist principles when ideal reference classes are unavailable**. It's not *opposed* to 1/2, but a necessary adaptation for their limits. *Add to Point 6:* "...this skill involves disciplined causal reasoning, leveraging analogous (if not identical) historical cases, structured scenario analysis, and rigorous calibration – effectively extending reference-class thinking when perfect classes don't exist."

  **The Single Most Impactful Revision: Revise Point 3.**

  *   **Why:** It's the most vulnerable to legitimate counter-examples in your own work (class selection judgment) and creates an unnecessary conflict with your acceptance of skill on unique events (Point 6). Softening it from "must converge/mistake" to "convergence *given an agreed class*/disagreement signals need for discussion" preserves your core demand for rigor and objectivity while acknowledging the practical reality of judgment in defining the reference framework. It resolves the highest-severity tension (2 vs 3) and significantly eases the 3 vs 6 tension.

  **Final Verdict for Your Colleagues:**

  You have a **coherent and defensible practitioner's framework** for infrastructure risk and cost estimation, grounded in empirical data and proven methods like RCF. The tensions arise primarily at the philosophical edges (uniqueness, class selection subjectivity) and from applying the framework beyond its strongest domain (strict frequentism for novel geopolitical events). The Doomsday Argument rejection is logically consistent within your criteria.

  **Defend it like this:** "My approach prioritizes **empirical grounding** through causally relevant reference classes wherever possible (1,2,4), demands **rigor and transparency** in calculation and class definition (revised 3), rejects **arbitrary or non-causal class abuse** (5), and acknowledges that for **highly unique events**, skilled probability assessment involves structured extensions of these principles (6). Disagreement is a prompt to scrutinize assumptions, especially class definition, not necessarily an error."

  This positions you as pragmatic, data-driven, but aware of the method's boundaries – exactly what good risk consulting requires. Prepare for fierce debate on class selection subjectivity!
