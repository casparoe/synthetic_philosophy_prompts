          - In the no-commitment round, the counterfactual reporting: students might lie. They might say they would have paid even if they wouldn't, just to make the driver look bad. Then the driver who didn't pick up would be penalized (get 0) even though they made the right prediction? That would distort the results. How to avoid? We can stress the importance of honesty for the sake of the exercise. Or we can skip the counterfactual and not score the driver for the "not pick up" cases? 

          I think we skip the counterfactual and change the driver payoff:

            - Driver gets 10 points if they pick up and the hitchhiker pays.
            - Driver gets 0 if they pick up and the hitchhiker doesn't pay.
            - Driver gets 5 points if they do not pick up. (This represents avoiding the risk. We don't know if it was correct, but we give a baseline.)

          Then the driver doesn't care about the counterfactual. And we avoid the issue.

          Revised driver payoff in no-commitment round:
            - If they pick up and the hitchhiker pays: 10
            - If they pick up and the hitchhiker doesn't pay: 0
            - If they do not pick up: 5

          Then, the driver's decision: 
            - If they think the probability that the hitchhiker will pay is p, then their expected payoff from picking up is 10p. 
            - They will pick up if 10p > 5, i.e., p > 0.5.

          This is a reasonable threshold.

          And we don't need the counterfactual.

          Also, we can then drop the question to the hitchhiker about what they would have done.

          So the steps become simpler.

          Steps for no-commitment round per run:
            1. Hitchhikers write a message to their driver: "pay" or "not pay".
            2. Drivers write: "pick up" or "do not pick up".
            3. Instructor collects and announces for each hitchhiker: whether picked up.
            4. For each picked-up hitchhiker: they choose to pay or not pay and write it down.
            5. Payoffs:
                 Hitchhiker:
                   - Not picked up: 0
                   - Picked up and pay: 10
                   - Picked up and not pay: 20
                 Driver:
                   - If they picked up and the hitchhiker paid: 10
                   - If they picked up and the hitchhiker didn't pay: 0
                   - If they did not pick up: 5

          This is clean.

          Now, what do we expect?
            - Hitchhikers: always say "pay" (because saying "not pay" will lead to not being picked up? But maybe they can trick? Actually, if they say "not pay", the driver might think they are honest and not pick up? But the driver gets 5 for not picking up. So they won't pick up a hitchhiker who says "not pay". So hitchhikers will say "pay" to have a chance of being picked up.
            - Drivers: they know that any hitchhiker who says "pay" might not pay. They must form a belief about p (the probability that the hitchhiker will pay). In a one-shot game with no information, what is p? It should be 0? Because the hitchhiker has no incentive to pay. So p=0. Then 10*0 = 0 < 5. So they should not pick up.

            Therefore, we expect: 
               All hitchhikers say "pay".
               All drivers choose "not pick up".

            Outcome: 
               Hitchhikers get 0.
               Drivers get 5.

            But if one driver deviates and picks up, then the hitchhiker will not pay, so the driver gets 0. So the driver is worse off? So they won't.

          In practice, some drivers might pick up because they trust the message? Then they get 0. 

          We will see.

       Let's stick with this simpler version.

       Final rules:

          Round 1 (Commitment):
            - Each student (hitchhiker) chooses and writes on a card: 
                 "Commit" -> payoff = 10
                 "Not commit" -> payoff = 0
            - Instructor collects and announces outcomes.

          Round 2 (No commitment):
            - Split into Group A (7 hitchhikers) and Group B (7 drivers).
            - Steps:
                 a. Each hitchhiker in A writes a message to their driver: either "I will pay" or "I will not pay".
                 b. Each driver in B, upon receiving the message, writes: "pick up" or "do not pick up".
                 c. Instructor collects the driver decisions and announces for each hitchhiker: picked up or not.
                 d. For each hitchhiker who is picked up: they write their choice: "pay" or "not pay".
                 e. Instructor collects and then computes payoffs.
            - Payoffs for hitchhiker:
                 Not picked up: 0
                 Picked up and pay: 10
                 Picked up and not pay: 20
            - Payoffs for driver:
                 If they wrote "pick up":
                     and the hitchhiker paid: 10
                     and the hitchhiker did not pay: 0
                 If they wrote "do not pick up": 5
            - Then switch roles and repeat.

       This should work.

       Debrief after both rounds:

          - Show the results: 
               Round 1: all committed? Got 10.
               Round 2: 
                   Run 1: How many hitchhikers were picked up? How many of those paid? How many drivers got 10, 0, or 5?
                   Run 2: same.

          - Discuss:
               Why did some hitchhikers pay in the no-commitment round? (If any did) -> they might say: to be fair, or to help the driver, or because they felt guilty? But the rational choice is not to pay.
               Why did some drivers pick up? -> they might have trusted the message? Or thought that the hitchhiker would pay? But why?
               Why did other drivers not pick up? -> they didn't trust.

          - Connect to Parfit: 
               The hitchhiker wants to be rescued. At the time in the desert, they would be willing to commit to paying. But once rescued, they don't want to pay. 
               Without a commitment device, they cannot make a credible promise. 
               The driver knows this, so she doesn't pick up unless she has some reason to believe the hitchhiker will pay (like a commitment, or if the hitchhiker is not purely self-interested).

          - The takeaway: commitment devices can enable cooperation that would otherwise be impossible.

       What feature of the real case can't we reproduce?
          - In the real case, the driver's prediction is based on her own assessment of the hitchhiker's character? Or reputation? In our game, we only had one round and no prior information. So the driver had to go on the cheap talk message. In reality, there might be more context.
          - Also, the hitchhiker in reality might have moral reasons to pay? Our game assumed self-interest, but people are not always purely self-interested.

       We can note these in the debrief.

       Now, let's write the instructions for the students.

       We'll create a handout or slide for each round.

       Due to the length, I'll summarize the instructions for the instructor.

       Instructor script:

          Introduction (5 min):
            "Today we're going to play a game that models Derek Parfit's hitchhiker thought experiment. You are stranded in the desert. A driver comes by and will only pick you up if she can predict that you will pay her at the destination. But once you are at the destination, paying is costly and you wouldn't do it if you were purely self-interested. We'll play two rounds: one with a commitment device and one without."

          Round 1 (Commitment round) - 5 min:
            "In this round, you are all hitchhikers. You have two options:
               Option 1: Commit to paying. If you choose this, the driver will pick you up and you will pay. Your payoff: 10 points.
               Option 2: Do not commit. If you choose this, the driver will not pick you up. Your payoff: 0 points.

             Write your choice on the card: either 'Commit' or 'Not commit'. Write your name on it. You have 1 minute."

            Collect the cards. Then announce: "If you committed, you get 10 points. If not, 0."

          Round 2 (No commitment round) - 15 min (split into two runs of 7 min each, with 1 min to split and explain):

            "We are now splitting into two groups: Group A and Group B. First, Group A will be hitchhikers and Group B will be drivers. Then we will switch.

            Rules for the hitchhiker:
              - You are stranded and want to be rescued.
              - You will send a message to your driver: either 'I will pay' or 'I will not pay'. (You can lie.)
              - If the driver picks you up, then you get to the destination. At the destination, you choose: pay or not pay.
                   - If you pay, you get 10 points (20 for being rescued minus 10 for paying).
                   - If you do not pay, you get 20 points (20 for being rescued and 0 cost).
              - If the driver does not pick you up, you get 0 points.

            Rules for the driver:
              - You are driving by and see a hitchhiker.
              - You will receive a message from the hitchhiker.
              - You then decide: pick up or do not pick up.
              - Your payoff:
                   - If you pick up and the hitchhiker pays: you get 10 points.
                   - If you pick up and the hitchhiker does not pay: you get 0 points.
                   - If you do not pick up: you get 5 points.

            Steps:
              1. Hitchhikers: write your message to your driver (either 'I will pay' or 'I will not pay'). Do not show it to anyone except the instructor. Hand it to the instructor, who will pass it to your driver.
              2. Drivers: upon receiving the message, write your decision: 'pick up' or 'do not pick up'. Hand it to the instructor.
              3. Instructor will announce for each hitchhiker: picked up or not.
              4. Hitchhikers who are picked up: write your choice: 'pay' or 'not pay'. Hand it to the instructor.
              5. Instructor will record the payoffs.

            We will do this for Group A as hitchhikers and Group B as drivers first. Then we switch.

            You have 2 minutes to make your decisions at each step."

          Then run the first run (Group A hitchhikers, Group B drivers) and then the second run (Group B hitchhikers, Group A drivers).

          Debrief (20 min):
            - Present the results from Round 1: how many committed? (probably all) and their payoff (10).
            - Present the results from Round 2, first run and second run:
                 - How many hitchhikers sent "I will pay"? How many sent "I will not pay"?
                 - How many drivers picked up? How many did not?
                 - For the hitchhikers who were picked up: how many paid? how many didn't?
                 - Average payoffs for hitchhikers and drivers in each run.

            - Ask for volunteers to share their reasoning:
                 - Hitchhikers: Why did you choose the message you did? Why did you pay or not pay?
                 - Drivers: Why did you decide to pick up or not? Did the message influence you? How?

            - Discuss: 
                 - In Round 1, the commitment device allowed you to get rescued. How?
                 - In Round 2, without commitment, what happened? Why couldn't you achieve the cooperative outcome (driver picks up and hitchhiker pays) more often? 

            - Connect to Parfit: 
                 - The problem: at the time of being stranded, you want to commit to paying. But once rescued, you don't want to pay. Without a way to bind your future self, the driver doesn't trust you.
                 - This is an example of how it can be rational to intend to do something in the future that you know will be irrational at that time? But only if you can commit. Without commitment, you cannot form such an intention credibly.

            - Limitations of the game:
                 - We assumed self-interest. In reality, people might pay because of moral reasons? Or the driver might trust because of the hitchhiker's appearance? 
                 - We played one-shot. In repeated interactions, reputation might matter.

            - Conclude: commitment devices can solve time-inconsistency problems.

       This should fit in 50 minutes.

       What might go wrong?
          - Time: The no-commitment round might take more than 7 minutes per run? We must keep it tight.
          - In Round 2, if a driver doesn't receive a message? We must make sure the instructor passes the messages.
          - Students might not understand the payoffs. We can have a slide with the payoff matrices.

       We can provide a summary of payoffs:

          Round 1:
            Hitchhiker:
              Commit: 10
              Not commit: 0

          Round 2:
            Hitchhiker:
              Not picked up: 0
              Picked up and pay: 10
              Picked up and not pay: 20

            Driver:
              Picked up and hitchhiker pays: 10
              Picked up and hitchhiker doesn't pay: 0
              Not picked up: 5

       We hope it goes well!
answer: |-
  ### In-Class Game: Parfit's Hitchhiker  
  **Objective:** Experience the tension between current and future incentives in commitment problems.  
  **Structure:** Two rounds (commitment vs. no-commitment), 50 minutes total.  
  **Payoffs:** Points (no real money).  

  ---

  ### **Round 1: Commitment Device Allowed**  
  *Simulates binding promises (e.g., contract, deposit).*  
  **Rules & Payoffs:**  
  - **Hitchhikers (all 14 students):**  
    - Choose to **commit** or **not commit**.  
    - **Commit:** Sign a "binding contract" (e.g., pledge card). If picked up, you **must pay** at the destination.  
    - **Not commit:** No binding promise.  
  - **Driver (Instructor):**  
    - "Picks up" hitchhikers **only if they committed**.  
  - **Payoffs:**  
    | Action                | Hitchhiker Points |  
    |-----------------------|-------------------|  
    | Commit + picked up    | 10 (rescue - cost)|  
    | Not commit            | 0 (stranded)      |  

  **Mechanics:**  
  1. Students write "COMMIT" or "NOT COMMIT" on cards (2 mins).  
  2. Instructor collects cards, announces who is "picked up" (only committers).  
  3. **Payoffs awarded:** Committers get 10 pts; others get 0.  

  **Predicted Outcome:** All students commit and get rescued (10 pts).  

  ---

  ### **Round 2: No Commitment Device**  
  *Simulates cheap talk (non-binding promises).*  
  **Rules & Payoffs:**  
  - **Roles:**  
    - **Hitchhikers (7 students):** Send a message to their driver: "I will pay" or "I won’t pay."  
    - **Drivers (7 students):** Predict whether their paired hitchhiker will pay. Decide to **pick up** (only if predicting "will pay") or **not pick up**.  
  - **Hitchhiker Payoffs:**  
    | Outcome               | Points |  
    |-----------------------|--------|  
    | Not picked up         | 0      |  
    | Picked up + **pay**   | 10     |  
    | Picked up + **not pay**| 20     |  
  - **Driver Payoffs:**  
    | Outcome                     | Points |  
    |-----------------------------|--------|  
    | Correct prediction          | 10     |  
    | Incorrect prediction        | 0      |  
    | **Not picking up**          | 5      |  

  **Mechanics:**  
  1. **Pairing:** Split into 7 hitchhiker-driver pairs (3 mins).  
  2. **Cheap-talk stage:** Hitchhikers write their message (e.g., "I will pay") (2 mins).  
  3. **Prediction stage:** Drivers see the message, write "pick up" or "not pick up" (2 mins).  
  4. **Resolution:**  
     - If "picked up," hitchhikers decide to **pay** or **not pay** (2 mins).  
     - Payoffs calculated based on actions/predictions.  
  5. **Swap roles:** Repeat with the other 7 students as hitchhikers (same mechanics).  

  **Predicted Outcome:**  
  - Hitchhikers all say "I will pay" (lying is rational).  
  - Drivers learn not to trust messages; most don’t pick up.  
  - Result: Few pickups, low cooperation.  

  ---

  ### **Timing (50-Minute Session):**  
  1. **Intro (5 mins):** Explain Parfit’s dilemma, rules for both rounds.  
  2. **Round 1 (Commitment):** 7 mins (decisions + payoff).  
  3. **Round 2 (No Commitment):** 18 mins (7 mins per group + swap).  
  4. **Debrief (20 mins):** Critical discussion (see below).  

  ---

  ### **Debrief: Mapping to Parfit’s Dilemma**  
  **Goal:** Avoid lecture—use guided discussion to highlight insights.  
  **Key Questions:**  
  1. **Round 1 Reflection:**  
     - *"Why did everyone commit? What did this let you accomplish?"*  
     - **Link:** Commitment devices align future actions with current intentions.  

  2. **Round 2 Reflection:**  
     - *"Hitchhikers: Why did you say you’d pay? Drivers: Did you believe them? Why/why not?"*  
     - *"Why did most hitchhikers not pay even after saying they would?"*  
     - **Link:** Without commitment, future-self incentives dominate ("irrational" not to pay).  

  3. **Contrasting Rounds:**  
     - *"How did the two rounds feel different? What changed?"*  
     - **Link:** Commitment solves time inconsistency (rational now to bind future irrationality).  

  4. **Real-World Implications:**  
     - *"Where do we see this in life? (E.g., gym memberships, voting pledges)."*  
     - *"Why might someone pay even without commitment?"* (Moral instincts, reputation).  

  **Teaching Takeaways:**  
  - **Commitment devices** enable cooperation by altering future payoffs.  
  - **Cheap talk fails** without external enforcement—only credible if interests align.  
  - **Parfit’s insight:** Rationality is time-sensitive; binding yourself *now* can be wise even if *later* you’d regret it.  

  ---

  ### **What Will Go Wrong (And How to Adapt):**  
  1. **Gaming the Prediction Mechanism:**  
     - Drivers may collude or ignore messages (e.g., always picking up to "help" classmates).  
     - **Fix:** Emphasize driver incentives ("You earn points for accuracy!"). Use anonymous pairs.  

  2. **Hitchhikers Paying in Round 2:**  
     - Some may pay out of guilt/shame (violating self-interest).  
     - **Use This:** Discuss in debrief—"Why did you pay? Was it ‘rational’?"  

  3. **Drivers Trusting Messages:**  
     - In early runs, drivers may naively trust "I will pay."  
     - **Use This:** Show how distrust emerges after seeing non-payment.  

  ---

  ### **Limitations of the Game:**  
  **1. The "Counterfactual Problem":**  
     - In reality, the driver predicts your *actual future choice*. In the game, drivers are other students guessing—not a perfect model of "prediction."  
     - **Bridge in Debrief:** "Parfit’s driver isn’t incentivized like yours; she predicts based on your character/reputation. How might that change things?"  

  **2. One-Shot vs. Repeated Interaction:**  
     - Real life allows reputation building (e.g., "I always pay"). The game is one-shot.  
     - **Bridge:** "How might outcomes differ if this happened weekly? What would make promises credible?"  

  **3. Moral Motivations:**  
     - The game assumes pure self-interest, but people pay for ethical reasons.  
     - **Bridge:** "Why might someone pay in real life? Does this challenge Parfit’s assumption?"  

  ---

  **Materials Needed:**  
  - Index cards for pledges/messages.  
  - Timer.  
  - Whiteboard to track payoffs.  
  - Slides with rules/payoffs (visual aid).  

  This design forces students to *feel* the commitment problem, uses peer interaction to reveal incentives, and primes a rich debrief linking gameplay to theory. Run it tight on time, and lean into "mistakes" as teaching moments!
