prompt: |-
  I sit on the editorial board of a mid-tier interdisciplinary journal (psych plus evolutionary biology, that sort of thing), and we keep getting papers that go like this: humans in the ancestral environment faced problem X, therefore trait Y is an adaptation for X, and here's a questionnaire on 200 undergrads thats consistent with Y existing. The latest one argues that gossip is an evolved free-rider-detection mechanism, resting mostly on the finding that people report enjoying gossip about norm violations more than gossip about, say, the weather.

  My co-editor has had enough and wants a blanket policy of desk-rejecting anything in this mould — adaptationist psychology isn't science, she says, until it makes risky predictions, it's just stories with a lab coat on. Another board member points out that we happily publish adaptationist work on peacock tails and finch beaks, and nobody calls those just-so stories, so what exactly is the difference? That we can't run experiments on humans? That we can't observe the ancestral environment? Or just that these hypotheses happen to be about us, which makes everyone squeamish?

  Draft the memo I'll circulate before thursday's meeting. It needs to reccomend something concrete: blanket rejection, case-by-case judgement, or a stated evidential bar — and if it's the bar, say what the bar is in terms a reviewer can actually apply to a manuscript, not "must be more rigorous". I want the co-editor's worry engaged with seriously, not waved off with the word falsifiability. The hard question, as I see it: is there a principled line between the gossip paper and a perfectly respectable behavioural ecology paper, or is it just degrees of confidence and tidier study design? If some of these papers are salvageable, say what they'd actually need — cross-cultural sampling, phylogenetic comparison, developmental signatures, whatever you think genuinely does the work. And be honest about whether the sceptics are right that the core move, inferring function from the fit between a trait and a hypothesised ancestral problem, is circular in a way the finch work isn't.

  Also, no reading lists or name-dropping of authorities please — I want the reasoning, not the bibliography.
reasoning: |-
  Hmm, the user is describing a conflict on their journal's editorial board about adaptationist psychology papers. They need a memo draft that addresses whether to reject such papers outright or set specific criteria, while seriously engaging the skepticism that these are "just-so stories."

  The core tension seems to be between two views: one editor wants blanket rejection calling it unscientific, while another points out the double standard since they publish similar adaptationist work in biology. The user wants concrete guidance on whether there's a principled distinction or just differences in evidence quality.

  Key concerns to address:
  - The circularity worry: inferring function from present-day trait/problem fit
  - What elevates this beyond storytelling
  - Concrete standards reviewers can apply
  - Whether human-focused studies face unique limitations

  Important distinctions from non-human biology:
  - Experiments: We can manipulate finch environments but not human evolutionary history
  - Direct observation: We see peacock tails' mating outcomes directly
  - Time scale: Human traits evolve slower, leaving fewer traces
  - Confounds: Human culture complicates trait-function links

  For the evidential bar, I should propose testable criteria:
  1. Multiple lines of evidence requirement
  2. Clear falsification conditions
  3. Plausible alternative explanations addressed
  4. Cross-cultural/developmental data to reduce WEIRD bias

  The memo should reject blanket bans but set high standards. Crucially, it must show how human studies can meet biological rigor levels through specific methodological approaches like cross-cultural work or developmental studies, rather than just questionnaires.

  The tone needs to balance respect for skepticism with constructive solutions. The conclusion should offer actionable review criteria while acknowledging legitimate concerns about circular reasoning in human adaptation studies.
answer: |-
  ## Memo: Policy on Adaptationist Psychology Submissions

  **To:** Editorial Board  
  **From:** [Your Name/Position]  
  **Re:** Handling Adaptationist Psychology Manuscripts (e.g., "Gossip as Free-Rider Detection")  
  **Date:** [Date]

  This memo addresses the ongoing debate regarding submissions proposing evolutionary psychological adaptations in humans, typified by the recent "gossip" paper. We must balance scientific rigor with intellectual openness. Blanket rejection risks stifling valid science, but unconstrained acceptance risks lowering our evidentiary standards. **I recommend establishing a clear, high evidential bar and rejecting papers that fail to meet it.** The core issue isn't adaptationism itself (we accept it in non-humans), nor solely falsifiability, but the *quality and independence* of evidence required to overcome unique epistemological challenges in human evolutionary psychology.

  **The Legitimate Concern:**  
  Co-Editor [Name]'s frustration is valid. Inferring an evolutionary function *solely* from a modern trait's apparent fit to a hypothesized ancestral problem ("Problem X existed, Trait Y seems to solve X, therefore Y evolved for X") *is* often circular. A questionnaire showing undergrads enjoy norm-violation gossip more than weather gossip *is* weak evidence for an evolved free-rider-detection mechanism. It demonstrates a *current* preference consistent with *one* hypothesis, but doesn't rule out alternatives (e.g., gossip as social bonding, status competition, or simply inherent interest in salient events). This "current utility = past adaptation" leap, without strong independent evidence, *is* storytelling.

  **The Finch/Peacock Distinction (And Its Limits):**  
  Board Member [Name] rightly notes we accept adaptationist claims in behavioral ecology. The difference isn't *principle* (inferring function from form/problem-fit) but *evidential access*:
  1.  **Experimentation & Manipulation:** We can experimentally alter finch beaks or peacock tails *and observe fitness consequences* in relevant environments. We cannot manipulate human evolutionary history or ancestral environments.
  2.  **Direct Observation of Fitness:** We can often measure reproductive success/survival linked to a trait variation *in the wild* for non-humans. This is ethically and practically impossible for hypothesized human psychological adaptations.
  3.  **Comparative Phylogenetics:** We can map trait evolution across related species with known divergence times, testing if trait appearance correlates with environmental shifts. Human uniqueness limits this power.
  4.  **Fossil/Archaeological Record:** Provides *some* direct evidence of past environments/selective pressures for morphological traits. Largely silent on specific cognitive adaptations.

  **Human work isn't inherently unscientific, but it faces higher evidential hurdles.** The "circularity" charge bites harder because the independent lines of evidence available for finches are often inaccessible for humans. The "gossip" paper fails because it provides *only* the circular core: a modern behavior (enjoying norm gossip) consistent with a hypothesized function (free-rider detection), with no attempt to break out of the circle.

  **The Required Evidential Bar (Concrete Criteria for Reviewers):**  
  To warrant publication, manuscripts proposing a specific psychological adaptation **must provide at least two strong, independent lines of evidence beyond simply demonstrating the trait exists or correlates with a proposed function in a modern sample.** Reviewers should reject papers lacking this. Acceptable lines include:

  1.  **Cross-Cultural Universality & Specificity:** Evidence the trait emerges reliably across diverse, culturally isolated populations *in contexts relevant to the hypothesized adaptive problem*. Not just "it exists everywhere," but showing its expression patterns (e.g., developmental trajectory, triggering contexts, behavioral outputs) align with the proposed function across ecologies. (A gossip paper would need cross-cultural data showing heightened attention/response specifically to free-riding gossip, not just gossip generally, across diverse societies).
  2.  **Identification of Design Features:** Evidence the trait exhibits complex, specialized structure ("design") that is *better explained* by the proposed adaptive function than by simpler alternatives (e.g., general learning, byproducts). Does gossip processing show cognitive specializations *specifically* tuned to detecting cheating or norm violations? (e.g., enhanced memory, specific emotional triggers, dedicated neural circuitry).
  3.  **Developmental Evidence:** Does the trait emerge early in development in a form consistent with preparedness for the adaptive problem, before extensive cultural learning could solely explain it? (e.g., do young children show a specific, early-emerging sensitivity to gossip about rule-breaking vs. other topics?).
  4.  **Cognitive/Neural Specificity:** Evidence from neuroscience or rigorous cognitive experiments demonstrating dedicated mechanisms attuned to the proposed adaptive problem. (e.g., does gossip about free-riders activate distinct neural networks compared to other gossip, and are these networks implicated in social threat detection or cost-benefit analysis?).
  5.  **Falsification of Plausible Alternatives:** Actively testing and ruling out strong competing hypotheses (e.g., gossip as general social information gathering, status enhancement, or bonding mechanism) using methods capable of distinguishing between them. The "null hypothesis" isn't "no evolution," but *other evolutionary or non-adaptive explanations*.
  6.  **Precise, Risky Predictions:** Generating and testing novel, non-obvious predictions derived *specifically* from the adaptation hypothesis that would be unlikely under alternative explanations. (e.g., predicting *who* is most likely to gossip about *whom* under specific resource conditions based on free-rider detection logic, and confirming this pattern cross-culturally).

  **Application to the Gossip Paper & Similar Submissions:**  
  The current gossip paper relies *only* on self-reported enjoyment differences in undergraduates – a single, weak line correlating modern behavior with a hypothesized function. It provides *no* cross-cultural data, *no* evidence of specific design features, *no* developmental data, *no* neural evidence, *no* test of alternatives, and *no* risky predictions. **It fails the evidential bar and should be rejected.** Future papers of this mold must integrate multiple lines from the list above.

  **Conclusion & Recommendation:**  
  Adaptationist hypotheses about human psychology *can* be scientific, but they demand more rigorous evidence than analogous non-human studies due to constraints on experimentation, observation, and comparative analysis. **We reject the blanket ban.** Instead, **we adopt a policy requiring multiple, independent lines of evidence demonstrating specificity, universality, design, and/or falsification of alternatives.** Reviewers must apply this bar strictly: papers offering only a modern trait/function correlation with minimal controls (like the gossip paper) should be desk-rejected. Papers integrating cross-cultural, developmental, cognitive/neural specificity, or strong comparative tests *alongside* functional arguments deserve full review. This elevates our standards while keeping the door open to rigorous evolutionary psychology. Let's discuss refining these criteria on Thursday.
