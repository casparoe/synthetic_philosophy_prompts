prompt: |-
  Me and my wife just found out we're both carriers for the same genetic condition -- not life-threatening, but the kid would spend a lifetime managing symptoms. There's a gene therapy in late trials that should be available for use in about a year. My mother-in-law says conceiving before then would be selfish: we'd be knowingly taking a 25% gamble with a child's life when waiting twelve months costs us basically nothing. But a friend pointed out that if we wait, we're not saving any particular kid from the condition -- the child we'd conceive a year from now is a different child entirely, and the kid we might have now, even with the condition, would still have a life worth living. So on his view no one is actually harmed by conceiving now, and my mother-in-law's objection just doesn't land on anyone. I feel like both of them are wrong somehow but I can't put my finger on it. Does her objection even make sense, and if not, is that the end of it, or does the worry survive in some other form? And does his argument prove too much, like that nothing anyone does about the timing or circumstances of conception could ever wrong the resulting child?
