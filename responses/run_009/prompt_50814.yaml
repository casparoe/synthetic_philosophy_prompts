answer: |-
  ### The Procedure
  1. **List Options and Theories**: Identify the grant proposals (options) and each committee member's moral theory (e.g., utilitarianism, person-affecting, animal welfare). Members with hybrid views (e.g., "mixtures") must specify how their theory ranks options or split into component theories.
  2. **Rank Options per Theory**: For each theory, rank options best to worst. Treat "impermissible" (contractualism) or "zero weight" (person-affecting) options as worst, tied if multiple. Hybrid members rank once for their blended view.
  3. **Score Options (Borda)**: For \(n\) options, assign scores: best = \(n-1\), second = \(n-2\), ..., worst = 0. Average scores for ties. For 2 options: best=1, worst=0.
  4. **Weight Theories (Confidence Ranks)**:  
     - Each member ranks all theories by confidence (1st, 2nd, ...), allowing ties.  
     - Convert ranks to weights: Top rank = \(k\) (for \(k\) theories), next = \(k-1\), ..., bottom = 1. Average tied ranks. Normalize weights to sum to 1 per member.  
     - *Fallback if refusal*: Default equal weights (1/\(k\)) for all theories.  
  5. **Compute Aggregate Scores**:  
     - Per option, calculate:  
       \[
       \text{Score} = \frac{1}{m} \sum_{\text{members}} \left( \sum_{\text{theories}} (\text{theory weight}) \times (\text{Borda score}) \right)
       \]  
       where \(m\) = number of members.  
     - Use normalized weights from Step 4.  
  6. **Select Winner**: Highest score wins. If tie/difference < 0.1, majority vote decides.  
  7. **Document and Explain**: Record rankings, weights, scores, and outcome. For board: Summarize key moral tradeoffs and scores.  

  ---

  ### The Two Cases  
  **Case (a): Livestock procedure phaseout ($500k) vs. Eyeglasses for schoolkids ($500k)**  
  - **Theories**: Utilitarian (U1, U2), Person-Affecting (PA), Animal Welfare (AW), Contractualist (C), Mixture1 (M1: utilitarian-leaning), Mixture2 (M2: person-affecting-leaning).  
  - **Step 2: Rankings**  
    - *Utilitarian*: Eyeglasses > Livestock (human impact certain; animal impact indirect). Scores: Eyeglasses=1, Livestock=0.  
    - *Person-Affecting*: Eyeglasses > Livestock (helps existing children; future animals "unaffected"). Scores: Eyeglasses=1, Livestock=0.  
    - *Animal Welfare*: Livestock > Eyeglasses (animal suffering paramount; humans secondary). Scores: Livestock=1, Eyeglasses=0.  
    - *Contractualist*: Livestock > Eyeglasses (livestock procedure "impermissible"; eyeglasses failure not). Scores: Livestock=1, Eyeglasses=0.  
    - *M1*: Eyeglasses > Livestock (utilitarian dominance). Scores: Eyeglasses=1, Livestock=0.  
    - *M2*: Eyeglasses > Livestock (person-affecting dominance). Scores: Eyeglasses=1, Livestock=0.  
  - **Step 4: Weights**  
    - All members use confidence ranks. Example weights (normalized):  
      - U1: Utilitarian=0.6, Others=0.1 each.  
      - AW: Animal Welfare=0.7, Others=0.075 each.  
      - ... *Similar for others; averages per theory*: Utilitarian=0.28, Person-Affecting=0.18, Animal Welfare=0.22, Contractualist=0.16, Mixtures=0.16.  
    - *Fallback not needed*.  
  - **Step 5: Aggregate Scores**  
    - Eyeglasses: \((0.28 \times 1) + (0.18 \times 1) + (0.22 \times 0) + (0.16 \times 0) + (0.16 \times 1) = 0.62\)  
    - Livestock: \((0.28 \times 0) + (0.18 \times 0) + (0.22 \times 1) + (0.16 \times 1) + (0.16 \times 0) = 0.38\)  
  - **Result**: Eyeglasses wins (0.62 > 0.38).  
  - **Board Explanation**: "Eyeglasses scored higher (0.62 vs. 0.38) due to strong utilitarian/person-affecting support. Animal welfare and contractualist views favored livestock but had lower aggregate weight."  

  **Case (b): Far-future research institute ($500k) vs. Near-term disaster relief ($500k)**  
  - **Theories**: Same as (a), but PA and AW oppose far-future.  
  - **Step 2: Rankings**  
    - *Utilitarian*: Far-future > Disaster relief (existential risk dwarfs near-term gains). Scores: Far-future=1, Disaster=0.  
    - *Person-Affecting*: Disaster relief > Far-future (future people "unaffected"; helps existing people). Scores: Disaster=1, Far-future=0.  
    - *Animal Welfare*: Disaster relief > Far-future (helps existing animals/humans; future too speculative). Scores: Disaster=1, Far-future=0.  
    - *Contractualist*: Far-future > Disaster relief (duty to future generations). Scores: Far-future=1, Disaster=0.  
    - *M1*: Far-future > Disaster relief (utilitarian dominance). Scores: Far-future=1, Disaster=0.  
    - *M2*: Disaster relief > Far-future (person-affecting dominance). Scores: Disaster=1, Far-future=0.  
  - **Step 4: Weights**  
    - Similar to (a); averages: Utilitarian=0.26, Person-Affecting=0.20, Animal Welfare=0.22, Contractualist=0.16, Mixtures=0.16.  
  - **Step 5: Aggregate Scores**  
    - Far-future: \((0.26 \times 1) + (0.20 \times 0) + (0.22 \times 0) + (0.16 \times 1) + (0.16 \times 1) = 0.58\)  
    - Disaster: \((0.26 \times 0) + (0.20 \times 1) + (0.22 \times 1) + (0.16 \times 0) + (0.16 \times 0) = 0.42\)  
  - **Result**: Far-future wins (0.58 > 0.42).  
  - **Board Explanation**: "Far-future research won (0.58 vs. 0.42). Utilitarian/contractualist support outweighed person-affecting/animal welfare opposition. Moral weights prioritized future-focused theories."  

  *Note for (a)*: As the animal welfare advocate, you lose—eyeglasses prevail due to higher utilitarian/person-affecting weights.  

  ---

  ### Where It Breaks  
  The procedure struggles when theories are *radically incommensurable* (e.g., contractualist "impermissible" vs. utilitarian utility scores) and rankings become arbitrary, or when all options are equally ranked. It also fails if hybrid members cannot split or rank their views, forcing oversimplified blends. In these cases, the fallback to majority vote kicks in, but this abandons moral uncertainty—highlighting where values genuinely clash beyond quantitative reconciliation.
