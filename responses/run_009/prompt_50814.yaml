prompt: |-
  I'm a program officer at a mid-sized foundation, and every quarter our grants committee has to pick between proposals while the seven of us flatly disagree about what matters. Two are basically utilitarians, one holds a person-affecting view (thinks you can't be harmed before you exist), one gives serious moral weight to animals, one is a contractualist who thinks some ways of treating people are off the table regardless of payoff, and the rest are mixtures. So far we resolve this by whoever argues longest, and the board is starting to ask why we funded X over Y.

  I want a decision procedure the committee can actually run in a two-hour meeting, based on whatever the moral uncertainty literature actually says -- maximizing expected choiceworthiness, Borda-style aggregation across theories, Bostrom's moral parliament idea, variance voting -- but usable when nobody will give real probability weights to their theories. If a step starts with "estimate how confident you are in each theory," they'll refuse or just make numbers up, so the procedure needs a fallback. It should say what to do when theories use different currencies (a contractualist's "this is impermissible" isn't a number you can average with a utilitarian's), where it hands the call back to a plain majority because it's a values question the math can't settle, and it has to produce an explanation a board member could follow.

  Then run it on two of the proposals we recieve: (a) $500k for a campaign to phase out a painful but standard livestock procedure, versus the same money for vision screening and eyeglasses for schoolkids in low-income countries; (b) a grant to set up a far-future-focused research institute, where the person-affecting folks think the benefit is literally zero and the utilitarians think it dwarfs everything else. Include at least one case where the procedure gives an answer I won't like -- I'm the animal person, and I suspect the arithmetic favors the eyeglasses.

  Format, in this order: "The procedure" (numbered steps, short enough to print on one page), "The two cases" (a worked run of each, roughly half a page apiece), "Where it breaks" (one short paragraph on what this genuinely can't settle).
reasoning: |-
  We are designing a decision procedure for a grants committee with members holding different moral theories. The procedure must:
  - Be runnable in a two-hour meeting.
  - Not require members to assign precise probability weights to their theories (though they may if they can).
  - Handle incommensurable currencies (e.g., impermissible vs. utility numbers).
  - Have a fallback when the math cannot settle the issue (e.g., plain majority vote).
  - Produce an explanation that a board member can follow.

  We'll base the procedure on the idea of "Borda-style aggregation across theories" and incorporate elements of variance voting to account for the different ways theories evaluate options. We'll also allow for a fallback to majority vote when the aggregation does not yield a clear result or when the theories are too incommensurable.

  **The Procedure (steps):**

  1. **List the options and moral theories:** 
     - Clearly state the grant proposals under consideration (e.g., Option A, Option B).
     - List the moral theories represented in the committee (e.g., Utilitarianism, Person-Affecting, Animal Welfare, Contractualism, etc.). Assign a label to each theory for simplicity.

  2. **Rank the options per theory:**
     - For each moral theory, have the adherent(s) of that theory (or the whole committee, if they can simulate the theory) rank the options from best to worst according to that theory. If a theory deems an option impermissible, that option is ranked last (and if multiple, they are tied at the bottom). If a theory cannot compare two options, they are tied at the lowest possible rank where they are comparable (but we encourage as much ranking as possible).
     - If a committee member holds a mixture of theories, they should either:
       a) Split into their component theories and rank for each, OR
       b) If they cannot, they should provide a single ranking that represents their blended view (but this is less ideal).

  3. **Assign scores per theory (Borda count):**
     - For each theory, assign Borda scores to the options: 
       - If there are n options, the best option gets n-1 points, the next n-2, ..., down to 0 for the worst. 
       - For ties: assign the average of the scores for the tied positions (e.g., if two options tie for best in a 3-option case, they get (2+1)/2 = 1.5 each, and the last gets 0).
     - If an option is deemed impermissible by a theory, it must be ranked last (and gets 0 points). If multiple impermissible options, they are tied at 0.

  4. **Weight the theories (without requiring probabilities):**
     - Each committee member is asked to express their confidence in each theory in one of two ways:
       a) (Preferred) Assign a weight to each theory that reflects their confidence (with the weights across theories summing to 1 for each member). OR
       b) (Fallback) If they refuse or cannot, they assign an ordinal ranking of the theories from most to least plausible (with ties allowed). Then convert the ranking to weights by a fixed rule: 
          - Assign a score to each theory: if there are m theories, the top-ranked theory gets m-1, next m-2, etc. (tied theories get the average of the positions they occupy). Then normalize the scores so they sum to 1 for each member.
     - Note: If a member only endorses one theory, they can assign weight 1 to that theory and 0 to others.

  5. **Aggregate across theories (expected Borda score):**
     - For each option, compute its weighted average Borda score across all theories. The weights for each theory are the average of the weights assigned by the committee members to that theory (so average across members for each theory).
       - Let T be the set of theories, and M the set of members.
       - For a given option, its score S = (1/|M|) * Σ_{m in M} [ Σ_{t in T} (weight that member m assigns to theory t) * (Borda score of option in theory t) ]
     - Alternatively, if we used the fallback in step 4b, we use the same method: the weight for theory t is the average of the normalized scores assigned by the members to theory t.

  6. **Choose the winning option:**
     - The option with the highest aggregate score wins.

  7. **Fallback to majority vote:**
     - If the aggregate scores are tied (or if the difference is below a pre-specified threshold, e.g., 0.1), then the committee holds a majority vote on the tied options.
     - Additionally, if the committee feels that the aggregation method is inappropriate for the case (e.g., because the theories are too incommensurable and the scores do not reflect meaningful comparisons), they may, by a majority vote, decide to override the method and hold a majority vote on all options. This override should be used sparingly.

  8. **Document the rationale:**
     - Record the rankings per theory, the weights assigned by each member, the computed aggregate scores, and the final decision (including any fallback vote). This provides an explanation for the board.

  **The Two Cases:**

  We'll run the procedure for the two cases described.

  **Case (a): $500k for a campaign to phase out a painful livestock procedure (Option A) vs. same money for vision screening and eyeglasses for schoolkids (Option B).**

