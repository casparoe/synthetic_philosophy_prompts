  ### Moral Responsibility Quiz: What Do You Actually Think?

  **Instructions:** For each scenario, imagine yourself in the situation and select the option that best reflects your judgment about whether the protagonist (you) is morally responsible (blameworthy or praiseworthy) for the action described. There are no right or wrong answers—this is about your intuitive judgments.  
  **Options for each question:**  
  - **A) Definitely responsible**  
  - **B) Probably responsible**  
  - **C) Probably not responsible**  
  - **D) Definitely not responsible**  

  ---

  1. **The Neuroscientist’s Backup Plan**  
     You’re deciding whether to steal a rare diamond. An evil neuroscientist has implanted a device in your brain that will force you to steal it if you show any sign of choosing not to. But you decide to steal the diamond on your own, so the device never activates.  
     *Are you morally responsible for stealing the diamond?*  

  2. **The Unavoidable Trigger**  
     You’re about to vote in an election. A neuroscientist has rigged a device to force you to vote for Candidate Smith if it detects a specific brain state (which you’d inevitably display if you were going to vote for Jones). You freely decide to vote for Smith, so the device remains inactive.  
     *Are you morally responsible for voting for Smith?*  

  3. **The Implanted Dream**  
     As a child, scientists secretly rewired your brain to make you passionately want to become an architect. You grow up genuinely loving architecture, feel it’s "who you are," and freely choose to pursue it. You’re unaware of the manipulation.  
     *Are you morally responsible for becoming an architect?*  

  4. **The Forgotten Lunch**  
     You promise to bring your friend’s lunch to work but forget it in your fridge. Your friend has a medical emergency from missing their meal. You’re normally reliable—this was a rare lapse—but remembering would have required sheer luck.  
     *Are you morally responsible for your friend’s harm?*  

  5. **The Determined Lie**  
     Imagine the universe is 100% governed by causal laws (no randomness or divine intervention). In this world, you lie to avoid an awkward conversation.  
     *Are you morally responsible for lying?*  

  6. **The Ignored Warning**  
     You take an experimental drug after being warned it may erase your empathy. It does, and you later assault someone. You knew the risk but took the drug anyway for the thrill.  
     *Are you morally responsible for the assault?*  

  7. **The Accidental Addict**  
     You developed a painkiller addiction after a surgery you couldn’t refuse. One day, overwhelmed by withdrawal, you steal money for drugs. You’ve tried quitting but relapsed each time.  
     *Are you morally responsible for stealing?*  

  8. **The Texting Driver**  
     You text while driving and swerve into oncoming traffic. By pure chance, no cars are there, and you avoid a crash.  
     *Are you morally responsible for texting while driving?*  

  9. **The Reckless Habit**  
     As a teen, you drove recklessly for fun, knowing it was dangerous but not caring. Now, as an adult, you cause an accident due to the same reckless driving habit you never tried to change.  
     *Are you morally responsible for the accident?*  

  10. **The Endorsed Desire**  
      You discover scientists secretly implanted your lifelong desire to be a lawyer. After reflection, you decide you’d still choose law even without manipulation. You freely enroll in law school.  
      *Are you morally responsible for becoming a lawyer?*  

  ---

  ### Scoring Key  
  Convert your answers to numerical scores:  
  - **A = 3, B = 2, C = 1, D = 0**  
  - **Total Score Range: 0–30**  

  **Interpretation Guide**  
  Match your pattern of answers to the closest philosophical view. No view is universally accepted—this is descriptive, not prescriptive.  

  - **0–7: Hard Incompatibilism**  
    You consistently deny moral responsibility. You likely believe free will is impossible in a deterministic universe (or any universe) and reject responsibility in manipulation, negligence, and even ordinary cases.  
    *Key markers: D/C in all cases, especially #5 (determinism) and #1/2 (neuroscientist cases).*  

  - **8–15: Strict PAP (Principle of Alternative Possibilities)**  
    You require the ability to do otherwise for responsibility. You deny it in neuroscientist cases (#1–2), manipulation (#3), and determinism (#5), but assign it when alternatives exist (#10) or luck intervenes (#8).  
    *Key markers: D/C in #1, #2, #3, #5; A/B in #8, #10.*  

  - **16–22: Responsibility-by-Tracing**  
    You assign responsibility if the agent could have "traced back" to a prior free choice (e.g., negligence from avoidable habits). You deny it when prior control is absent (#3, #7) but affirm it in #4 (forgettable lapse), #6 (ignored warning), and #9 (reckless habit).  
    *Key markers: A/B in #4, #6, #9; D/C in #3, #7.*  

  - **23–30: Frankfurt-Style Compatibilism or Sourcehood**  
    You assign responsibility when actions flow from the agent’s own will, even without alternatives. You deny it in manipulation (#3) and addiction (#7) but affirm it in neuroscientist cases (#1–2) and determinism (#5).  
    *Key markers: A/B in #1, #2, #5, #10; D/C in #3, #7.*  

  ---

  ### Limitations & Diagnostics  
  - **Unseparated Views:** The quiz **cannot distinguish Frankfurt-style compatibilism from sourcehood views**. Both agree on:  
    - Responsibility in classic neuroscientist (#1), prior-sign (#2), and deterministic (#5) cases.  
    - Non-responsibility in manipulated-desire (#3) and accidental addiction (#7) cases.  
    *Why?* These views diverge only in niche scenarios (e.g., manipulation with awareness, as in #10), but #10 is answered similarly by both.  

  - **Empty Combinations:**  
    - **A/B in #3 (Implanted Desire) + D/C in #10 (Endorsed Desire)** is rare and **unexplored**. If you hold this, you might see manipulation as inherently undermining responsibility, even with endorsement—a view not well-mapped in mainstream literature.  
    - **D/C in #8 (Texting Driver) + A/B in #9 (Reckless Habit)** is **incoherent**. If you assign responsibility for reckless habits (#9), consistency demands it for the same act without harmful outcomes (#8).  

  ---

  **Reflection:** This quiz reveals how intuitions about control, luck, and identity shape responsibility judgments. No theory perfectly captures all cases—philosophers debate these tensions endlessly. Use your results to explore the free will literature further!
