prompt: |-
  I'm a second-year psychology graduate student, and like everyone in my cohort I've been pulled into the department's running arguments about the replication crisis and whether we should all become Bayesians. My stats professor, who is a resolute frequentist, keeps defusing these arguments with the same analogy: a significance test is a criminal trial. The null hypothesis is the presumption of innocence, the data are the evidence presented at trial, the p-value is like the probability of seeing evidence this damning if the defendant were actually innocent, and the 0.05 threshold is just our culture's "beyond a reasonable doubt" standard. He draws several morals from this: that failing to reject the null is an acquittal, not a proof of innocence, so null results tell us little; that the threshold itself is not arbitrary but a socially settled standard, like the reasonable-doubt convention; and that the replication crisis is essentially a wrongful-conviction problem — a matter of better procedure (preregistration as discovery rules, replication as appeals), not of abandoning the trial format. A postdoc in my lab who is a committed Bayesian says the analogy actually proves the opposite of what he thinks: a good court would weigh the prior odds that the defendant did it, and the frequentist courtroom deliberately bans that, which is exactly why effects with tiny prior plausibility get "convicted" and then evaporate in replications.

  I'd like a careful audit of this analogy rather than a defense of either camp. Please set out the correspondence table explicitly — what plays the role of the defendant, the prosecutor, the defense attorney, the jury, the standard of proof, the verdict — and then go through the disanalogies, separating the ones that matter for the replication-crisis debate from the ones that are merely amusing (for instance, that a trial has one defendant while a field runs thousands of simultaneous hypotheses, or that a criminal trial is adversarial while the researcher who designed the study is also, in effect, the prosecutor, with no defense attorney present at all). Where does the trial picture quietly import features the scientific case lacks — an asymmetry between the costs of wrongful conviction and wrongful acquittal, a prohibition on re-prosecuting an acquitted hypothesis, the fact that acquittals go unreported while convictions make the papers? And conversely, does my postdoc's Bayesian moral actually follow from the analogy, given that real courts often instruct juries in ways that are closer to the frequentist than the Bayesian picture? Conclude with your own judgment on whether my professor's conclusions — especially his "better procedure, same standard" reading of the replication crisis — survive once the disanalogies are on the table, and if the analogy can't carry that weight, say what would do the job better. Throughout, please flag how confident you are in each step and single out the point in your audit you're least sure of, since I may quote this back at my professor and I'd rather know where I'm exposed. Please answer in American English.
reasoning: |-
  Alright, let's tackle this user's request step by step. They're a psychology grad student caught in the stats methodology debate between their frequentist professor and a Bayesian postdoc. The core issue is auditing the trial analogy for hypothesis testing. 

  First, I need to map the professor's trial analogy explicitly. Defendant = null hypothesis, prosecutor = researcher, etc. But immediately I see red flags: in science there's no defense attorney equivalent, and "acquittals" (null results) get buried in file drawers. That's a critical disanalogy for the replication crisis since publication bias distorts the evidence base.

  Hmm, the user also wants disanalogies categorized by relevance to replication crisis. The asymmetric error costs stand out - science should care equally about false positives and negatives, unlike courts. And the "no double jeopardy" rule? That directly contradicts how replication works in science. 

  The postdoc's Bayesian critique is interesting. Real courts do allow prior odds (via motive/means evidence), which the professor's analogy conveniently ignores. But courts aren't fully Bayesian either - judges explicitly forbid basing verdicts solely on priors like defendant's background. Tricky.

  For the conclusion... The professor's "better procedures" argument holds some water (preregistration helps), but pretending the 0.05 threshold is sacred like "beyond reasonable doubt" is dangerous. In science we can calibrate thresholds per field - genome-wide studies use 5e-8 for a reason. The analogy breaks here.

  Least confident point? Whether courts are meaningfully Bayesian. One could argue admitting motive evidence is Bayesian updating, but judges' jury instructions lean frequentist ("if the glove doesn't fit..."). Should flag this ambiguity.

  Ultimate verdict: the analogy is pedagogically useful but overextended. The replication crisis needs both procedural fixes AND rethinking standards - which the trial metaphor obstructs by implying 0.05 is immutable. Better to frame it as signal detection theory with tunable parameters.
answer: |-
  Here's a systematic audit of the "significance test as criminal trial" analogy, structured to address your concerns about its validity in the replication crisis debate. I'll follow your requested format, flagging confidence levels and key uncertainties.

  ### Correspondence Table (The Professor's Analogy)
  | **Criminal Trial Element** | **Hypothesis Testing Element** | **Confidence** |
  |----------------------------|--------------------------------|----------------|
  | Defendant                  | Null Hypothesis (H₀)          | High           |
  | Presumption of Innocence   | Default assumption H₀ is true | High           |
  | Evidence                   | Observed Data                 | High           |
  | Prosecutor                 | Researcher/Study Designer     | Medium-High    |
  | Jury/Decision Rule         | Statistical Test Procedure    | Medium         |
  | Standard of Proof          | α-level (e.g., 0.05)          | Medium         |
  | Verdict (Guilty)           | Reject H₀                     | High           |
  | Verdict (Not Guilty)       | Fail to Reject H₀             | High           |
  | Wrongful Conviction        | Type I Error (False Positive) | High           |
  | Wrongful Acquittal         | Type II Error (False Negative)| Medium         |
  | Trial Rules/Procedures     | Research Methods (Design, Analysis) | Medium |

  ---

  ### Critical Disanalogies
  **I. Disanalogies Relevant to Replication Crisis**
  1. **Asymmetric Error Costs**  
     - *Trial:* Wrongful conviction (jailing innocent) is deemed far worse than wrongful acquittal (freeing guilty).  
     - *Science:* Costs are field-dependent. False positives (published noise) and false negatives (missed discoveries) can be equally damaging. Psychology’s replication crisis suggests false positives are *systemically* costly due to publication bias and wasted resources.  
     - **Why it matters:** The 0.05 threshold prioritizes avoiding false positives, but science lacks society’s consensus that this asymmetry is always appropriate.  
     - **Confidence:** High  

  2. **No "Double Jeopardy" vs. Replication Imperative**  
     - *Trial:* Acquitted defendants cannot be retried for the same crime.  
     - *Science:* "Failed" replications of an original "significant" finding are not just permitted but essential. Null results should trigger skepticism, not case closure.  
     - **Why it matters:** The analogy implies that once H₀ is "acquitted" (p>0.05), the hypothesis is "innocent forever," discouraging replication. This contradicts science’s self-correcting ideal.  
     - **Confidence:** High  

  3. **Role of the "Defense Attorney"**  
     - *Trial:* Defense actively challenges evidence and presents counterarguments.  
     - *Science:* No equivalent mechanism. Researchers (prosecutors) design studies seeking to convict H₀. Peer review is an overworked judge, not a defense advocate.  
     - **Why it matters:** Without systematic critique *before* publication (e.g., adversarial collaboration), weak evidence easily "convicts" H₀. This enables false positives.  
     - **Confidence:** Medium-High  

  4. **Publication Bias ("Invisible Acquittals")**  
     - *Trial:* Acquittals are public record.  
     - *Science:* Null results often go unpublished ("file drawer problem").  
     - **Why it matters:** If only "convictions" (p<0.05) are visible, the literature over-represents false positives. The "trial system" appears more reliable than it is.  
     - **Confidence:** High  

  5. **Multiple Testing ("Mass Trials")**  
     - *Trial:* One defendant per trial.  
     - *Science:* Thousands of hypotheses tested simultaneously; no correction for "innocent bystanders."  
     - **Why it matters:** With α=0.05, 1 in 20 true nulls will be "convicted" by chance alone. The trial analogy ignores this selection bias.  
     - **Confidence:** High  

  **II. Amusing/Secondary Disanalogies**
  - **Adversarial Imbalance:** Researcher is prosecutor, judge (reviewer), *and* sometimes jury (reader). No defense.  
  - **"Defendant" Identity:** H₀ is abstract (e.g., "no mean difference"), not a person with rights.  
  - **Jury Instructions:** Real juries are told "innocent until proven guilty"; researchers often *want* H₀ to be false.  
  - **Appeals Process:** Failed replications are like appeals, but occur haphazardly without institutional support.  

  ---

  ### Evaluating the Bayesian Critique
  Your postdoc is partially right, but oversimplifies legal practice:
  - **Courts and Priors:**  
    - *Bayesian View:* Courts *do* consider prior odds (e.g., defendant’s motive, past crimes, opportunity).  
    - *Frequentist Reality:* Judges often restrict prior information (e.g., past convictions) to avoid jury prejudice. Standard jury instructions are frequentist: "Evaluate *only* whether evidence proves guilt beyond reasonable doubt."  
    - **Verdict:** The analogy *does* highlight frequentism’s refusal to quantify prior plausibility. This *is* a weakness when studying low-probability effects (e.g., ESP). However, real courts aren’t purely Bayesian either.  
    - **Confidence:** Medium (legal procedures vary by jurisdiction)

  ---

  ### Does the Analogy Support the Professor's Conclusions?
  1. **"Null results are acquittals, not proof of innocence"**  
     - **Survives?** Yes. Correctly emphasizes that p>0.05 doesn’t prove H₀.  
     - **Confidence:** High  

  2. **"0.05 is a socially settled standard like 'beyond reasonable doubt'"**  
     - **Survives?** Partially. The *concept* of a standard is valid, but 0.05 isn’t analogous:  
       - Legal standards are context-sensitive (e.g., civil trials use "preponderance of evidence").  
       - Science can and should calibrate α to costs (e.g., genomics uses α=5×10⁻⁸).  
       - Treating 0.05 as immutable because "courts do it" ignores scientific flexibility.  
     - **Confidence:** Medium-High  

  3. **"Replication crisis ≈ wrongful convictions; fix procedures, not standards"**  
     - **Survives?** **No.** The analogy obscures key drivers of the crisis:  
       - Asymmetric error costs don’t justify ignoring false negatives in science.  
       - "No double jeopardy" disanalogy means replication isn’t an "appeal" but a core process.  
       - Publication bias and missing "defense" mechanisms aren’t addressed by *just* preregistration.  
       - The analogy ignores that "reasonable doubt" is jury-subjective, while frequentism pretends α is objective.  
     - **Confidence:** High  

  ### Least Confident Point
  **"Whether courts are meaningfully Bayesian."**  
  - I’m least sure here (Confidence: **Low**). Legal evidence rules are a hybrid: prior acts are sometimes admitted (Bayesian), but juries are told to avoid "prejudice" (anti-Bayesian). Case law varies, and I’m not a legal scholar. Your professor could reasonably counter that courts *aim* for frequentist purity.

  ---

  ### Final Judgment
  **The analogy fails as a defense of "better procedures, same standard."** It correctly frames Type I errors as "wrongful convictions" but:
  - Ignores systemic disanalogies (publication bias, no defense, asymmetric costs).
  - Overstates the sanctity of 0.05 by falsely equating it with a centuries-old legal standard.
  - Hides why low-prior-probability effects get published: no "prior odds" filter.

  **Better Framing: Signal Detection Theory**  
  For the replication crisis, drop the trial analogy. Use **signal detection** (SDT):
  - **Effect = Signal**, Noise = Sampling variability  
  - **Threshold** (criterion) balances:  
    - Hits (True positives)  
    - False Alarms (False positives)  
    - Misses (False negatives)  
  - **Optimal threshold depends on:**  
    - Base rate of true effects (prior)  
    - Cost of false alarms vs. misses  
  SDT makes explicit that α=0.05 *is* arbitrary if base rates or costs aren’t considered. Preregistration and replication adjust the *sensitivity* (power) and *specificity* (error control), but we must also debate the *criterion* (α) and *priors* (plausibility). This directly addresses both the frequentist and Bayesian concerns.

  **To quote confidently:** Focus on SDT and the disanalogies around asymmetric costs, publication bias, and lack of defense. Your professor’s procedural fixes *help* but are insufficient without calibrating standards to context.
