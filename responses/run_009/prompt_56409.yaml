prompt: |-
  My roommate and I have been arguing for a month about pseudoscience vs real science, and she has extremely confident verdicts but insists she has no rule, it's just obvious to her case by case. I've started writing her verdicts down because I want to test whether there's actually a consistent principle underneath. So far: astrology, not science; classical Freudian psychoanalysis, not science; Newtonian gravitation, science; intelligent design, not science; continental drift as Wegener himself was proposing it — back when the whole geology establishment dismissed it and he had no mechanism for it — science, and she'll die on that hill, she says it was good science that happened to be wrong, which is apparently the point; string theory, not science; and modern macroeconomics, science, which honestly surpised me. The Wegener verdict is what got me hooked, because it seems to rule out both the obvious "whatever the expert community accepts" rule and the "only theories with confirmed novel predictions" rule, since he had neither going for him at the time.

  Next week I want to walk in with predictions for three new cases before I show them to her, and I want them to actually stress-test her implicit rule rather than be easy wins. The three cases: the aquatic ape hypothesis (our ancestors went through a semi-aquatic phase, supposed to explain our hairlessness, breath control, subcutaneous fat etc.); the Younger Dryas impact hypothesis (a comet impact around 12,900 years ago that supposedly triggered the cooling and killed off the megafauna); and eternal inflation with its bubble multiverse, the version where our universe is one bubble among infinitely many. Please take the role of a professional philosopher of science and think carefully before answering — ideally brainstorm the candidate rules that fit her record first, and don't give me the lazy "demarcation is impossible, everything's a continuum" cop-out, she already tried that and then went back to giving verdicts anyway. I want: the rules consistent with her record (I count at least two, suspect more), what each predicts for my three cases, your best guess for each verdict with reasoning, and, crucially, one further case I could add that would best split the remaining rules apart — because she'll deny any rule exists right up until it makes a wrong prediction in front of her, and I want to be holding it.
reasoning: |-
  Okay, let me tackle this fascinating demarcation problem. The user's roommate claims to judge science vs pseudoscience case-by-case without explicit rules, but her verdicts show intriguing patterns. 

  First, analyzing her existing judgments: astrology (no), Freud (no), Newton (yes), intelligent design (no), Wegener's continental drift (yes despite being wrong/unaccepted), string theory (no), macroeconomics (yes). The Wegener case is particularly telling - it breaks both consensus-based and prediction-based demarcation criteria.

  Considering possible underlying principles:
  - Methodological naturalism seems essential (rules out intelligent design)
  - Testability requirement, but not necessarily confirmed predictions (Wegener had none)
  - Structural features like explanatory coherence or mechanism-independence (Wegener offered evidence patterns without mechanism)
  - Probably not falsificationism alone (Freud was falsifiable but rejected)

  For the test cases:
  Aquatic ape hypothesis - likely "not science" due to lack of fossil evidence and adaptationist storytelling
  Younger Dryas impact - probably "science" as it makes testable claims about geological layers
  Eternal inflation - tricky, but leaning "not science" due to untestability of other bubble universes

  The key is finding a case that splits between the main candidate rules. Something like Ptolemaic epicycles could distinguish between "productive framework" vs "just saving appearances" criteria. Or modern string theory variants to test consistency with her prior string theory rejection.

  Need to design a fourth case that forces contradiction between explanatory coherence and testability requirements. Maybe historical theories that were later vindicated but lacked mechanisms initially, versus contemporary untestable but mathematically elegant models.
answer: |-
  Based on her verdicts and your goal of stress-testing, here's a systematic analysis of possible rules, predictions for your three cases, and a crucial fourth case to split the rules:

  **Candidate Rules Consistent With Her Verdicts:**

  1.  **Explanatory Coherence & Evidence Integration:** A theory is scientific if it *systematically integrates diverse lines of evidence* into a *coherent explanatory framework*, even if initially incomplete or lacking a mechanism/novel prediction. It must aim for consistency with established knowledge and be structured to *refine itself based on new evidence*. This fits **Wegener** (integrated fossil, geological, paleoclimatic evidence coherently, despite no mechanism) and **Newton** (unified celestial/terrestrial mechanics). It excludes **Astrology** (lacks coherence, doesn't integrate evidence systematically), **Freud** (often ad-hoc, resists falsification/refinement), **ID** (supernatural, resists integration/refinement), and **String Theory** (often seen as lacking connection to diverse evidence, difficult to refine/falsify empirically). Includes **Macroeconomics** (integrates diverse data - GDP, employment, inflation - into coherent, albeit imperfect, models that are constantly refined).
  2.  **Methodological Naturalism & Testability-in-Principle:** A theory is scientific if it *proposes natural mechanisms* and is *structured such that empirical evidence could potentially confirm or contradict its core claims*, even if current technology limits testing. This fits **Newton** (clear natural mechanism, testable), **Wegener** (natural mechanism implied/assumed, evidence *could* confirm/refute continental connections), and **Macroeconomics** (natural mechanisms, testable with economic data). It excludes **Astrology** (supernatural/mystical), **ID** (supernatural agent), and likely **Freud** (core concepts like libido/Oedipus complex hard to define/test). **String Theory** is borderline (natural but arguably untestable even in principle in some formulations), consistent with her "not science" verdict.
  3.  **Progressive Research Program (Lakatosian):** A theory is scientific if it forms the core of a *progressive research program* – it generates novel questions, guides new research (even without novel *predictions* initially), and adapts to explain new evidence without constant ad-hoc adjustments. This fits **Wegener** (spurred massive geological research, core idea vindicated), **Newton** (the epitome), and **Macroeconomics** (drives vast empirical/theoretical work). It excludes **Astrology** (degenerative, no progress), **ID** (degenerative, avoids core test), **Freud** (arguably degenerative/sectarian in classical form). **String Theory** is debated (some see it as progressive mathematically, others as empirically stagnant), fitting her "not science" if she emphasizes empirical progress.
  4.  **Mechanism-Independent Pattern Recognition:** A theory is scientific if it *identifies robust, empirically demonstrable patterns or relationships* in nature, even without proposing a *specific* causal mechanism. The core claim must be about observable (or inferable) structure. This fits **Wegener** (pattern: continents fit, fossils match) and **Newton** (pattern: inverse square law motion). It excludes **Astrology** (pattern not robustly demonstrable), **ID** (core claim is agency, not pattern), **Freud** (patterns claimed but not robustly demonstrable/testable). **String Theory** (focuses on mechanism, pattern evidence weak) and **Macroeconomics** (focuses on mechanisms *and* patterns) are less clear, but her verdicts can be accommodated (ST: no pattern evidence = not science; Macro: identifies patterns = science).

  **Predictions for Your Three Cases:**

  1.  **Aquatic Ape Hypothesis (AAH):**
      *   **Candidate Rules Predict:** Likely **NOT SCIENCE** by all 4 rules.
      *   **Reasoning:** Lacks systematic integration of diverse evidence (contradicted by key fossil/isotopic data), coherence is weak (many "explanations" are just-so stories), no clear mechanism proposed beyond adaptation, fails to generate a progressive research program (remains speculative, little active mainstream research), pattern recognition is weak (features explained as well/better by terrestrial hypotheses). *Your Roommate Likely Verdict:* **NOT SCIENCE.** It lacks the structured, evidence-integrating coherence of Wegener.

  2.  **Younger Dryas Impact Hypothesis (YDIH):**
      *   **Candidate Rules Predict:** Likely **SCIENCE** by Rules 1, 2, & 3; Rule 4 less clear.
      *   **Reasoning:** Proposes a specific natural mechanism (comet impact). Actively seeks diverse evidence (nanodiamonds, platinum spikes, meltglass, carbon spherules) to integrate into a coherent causal story for an event. Generates a progressive research program with intense debate, new studies, and refinement of claims (e.g., recognizing multiple potential impact sites/times). Identifies a potential pattern (materials layer at YD boundary). While controversial and contested, its *structure* aligns with scientific endeavor – it's testable and evolves based on evidence. *Your Roommate Likely Verdict:* **SCIENCE.** It mirrors Wegener: a bold, initially rejected natural hypothesis integrating diverse evidence within a testable framework, driving research despite controversy.

  3.  **Eternal Inflation / Bubble Multiverse:**
      *   **Candidate Rules Predict:** **NOT SCIENCE** by Rules 1, 2, & 4; Rule 3 is the only potential for "science" (if seen as mathematically progressive).
      *   **Reasoning:** Core claim (other bubble universes) is fundamentally untestable *even in principle* from within our bubble (Rule 2 violation). Struggles to systematically integrate *diverse empirical evidence* – it's primarily motivated by theoretical/mathematical issues (Rule 1). Doesn't identify a testable *pattern* in our universe uniquely explained by other bubbles (Rule 4). While mathematically sophisticated (Rule 3 potential), the lack of empirical anchor or testability likely dominates. *Your Roommate Likely Verdict:* **NOT SCIENCE.** It resembles String Theory in its profound disconnect from empirical testability, contrasting sharply with Wegener's empirically grounded (if mechanism-less) pattern.

  **The Crucial Fourth Case to Split the Rules: Ptolemaic Astronomy (Epicycles/Deferents)**

  *   **Why it Splits the Rules:**
      *   **Rule 1 (Coherence/Evidence Integration):** **SCIENCE.** It systematically integrated diverse positional astronomical data (planetary motions, retrograde loops) into an incredibly coherent mathematical framework for centuries. It was constantly refined based on new evidence (adding epicycles).
      *   **Rule 2 (Naturalism/Testability):** **SCIENCE.** Proposed purely natural mechanisms (geometric motions of spheres). Its core predictions (planet positions) were highly testable and drove observations for over a millennium.
      *   **Rule 3 (Progressive Research Program):** **SCIENCE (initially), then DEGENERATES.** It was the *definition* of a progressive research program for centuries, guiding precise observations and refinements. However, by the late period, it became increasingly complex and ad-hoc (adding equants, more epicycles) to save appearances, arguably becoming degenerative.
      *   **Rule 4 (Pattern Recognition):** **SCIENCE.** It identified and mathematically described the observable patterns of planetary motion with remarkable accuracy for its time.

  *   **The Stress Test:** Her verdict on Ptolemy will be critical:
      *   If she calls it **SCIENCE**, it strongly favors Rules 1, 2, and 4 (and potentially 3, depending on her view of its later stages). This emphasizes *method* and *historical context* over ultimate truth or simplicity.
      *   If she calls it **NOT SCIENCE**, it strongly favors a stricter interpretation of Rule 3 (it degenerated) *or* introduces a new criterion like "simplicity" or "truth-likeness" not captured by the initial rules. It might also indicate she judges based on *ultimate* scientific status rather than *contemporary* status.
      *   **Your Strategy:** Present it neutrally as the dominant predictive model of planetary motion from antiquity through Copernicus. Ask *specifically* if it counts as "science" *during its period of dominance* (e.g., circa 150 AD to 1500 AD). Her reasoning here will be more revealing than the verdict alone.

  **Summary & Best Guesses for Your Cases:**

  *   **Aquatic Ape:** Prediction: **NOT SCIENCE** (Lacks coherence, evidence integration, progressive program).
  *   **YDIH:** Prediction: **SCIENCE** (Natural mechanism, integrates diverse evidence, testable, drives research).
  *   **Eternal Inflation:** Prediction: **NOT SCIENCE** (Untestable core claim, weak empirical integration).
  *   **Crucial Splitter:** **Ptolemaic Astronomy (c. 150 AD - 1500 AD).**

  Present the three cases, get her verdicts, then spring Ptolemy on her. The tension between the *historical method* of Ptolemy (which fits Rules 1, 2, 4) and its *eventual rejection* (which might trigger Rule 3 degeneration or an unstated "truth" criterion) is the key to unlocking her implicit rule. Pay close attention to *why* she gives her verdict on Ptolemy – that reasoning will be the Rosetta Stone. Good luck!
