prompt: |-
  I'm the strategy director at a mid-sized industrial components firm, and a recurring category of decision has been landing on my desk that I don't think we handle well: irrevocable or near-irrevocable commitments made under time pressure because a counterparty might commit first. Publicly announcing we will exit a market segment before a competitor announces entering it; signing a long exclusivity agreement with a supplier before our rival gets a meeting; announcing a multi-year price guarantee that we cannot honourably withdraw from. The bargaining literature since Schelling tells us the first party to make a genuinely irreversible commitment often captures the surplus; but I've also seen the opposite failure, where two firms race each other into incompatible public commitments and both end up locked into positions they'd each have paid to unwind. In some decision-theory discussions I've come across the term 'commitment races' for roughly this phenomenon: when speed of commitment is itself an advantage, agents are pushed to bind themselves before they've gathered the information or done the deliberation that would have told them not to, and a capability that is an advantage in each individual interaction can be a systematic liability in the long run, because the organisation that can commit fastest is also the organisation that commits wrongly fastest.

  What I want from you is a decision procedure my team can actually run when one of these situations comes up — we face perhaps four to six per year, stakes in the range of a bad quarter to an existential threat, and sometimes we have a week, sometimes forty-eight hours, because the whole point is that the other side may move first. The people running it are smart but have no formal training in decision theory, and anything above a certain size needs board sign-off, so the procedure has to produce an auditable written trace of why we committed or didn't. Please give me: the questions to ask, in order; what counts as a sufficient answer to each; the points at which the procedure terminates in a 'commit', a 'don't commit', or a 'wait'; and the points at which it has to hand the decision to a named human because the question is one of judgement or values rather than fact — I want those points flagged honestly rather than papered over with pseudo-quantification.

  The procedure should make room for the considerations that make commitment races distinctive rather than just risky decisions: whether the other side can actually observe and verify our commitment (a commitment no one believes in isn't one); whether 'irrevocable' really means irrevocable or merely expensive to reverse, and what that difference does to the logic; the value of the information we'd get by waiting, weighed against the risk of losing the first-mover position entirely; the possibility of negotiating a mutual standstill rather than racing; and the portfolio-level worry that winning individual races one at a time can still leave the firm committed into an accumulating pile of bad positions — though be careful to say whether that last consideration belongs inside the procedure or is a reason to have a separate annual review.

  Then run the procedure on three cases, worked through in enough detail that I can see it bite: (a) a competitor is rumoured to be entering one of our smaller segments, and we could pre-empt them by publicly and verifiably announcing our own exit from an adjacent segment as part of a focus strategy we were half-planning anyway; (b) our sole supplier for a key input offers a seven-year exclusivity deal at below-market prices, but they will only keep the offer open for two weeks, and our own engineers tell us there's a decent chance a substitute input becomes viable within three years; and (c) a case where I expect you to show the procedure giving an answer its own user won't like — for instance, a situation where the race logic says commit immediately and the procedure says don't, or vice versa, with the reasoning made explicit. Finally, state plainly what the procedure cannot do: where it will systematically misfire, and what kind of commitment decision it should never be trusted with at all. Please write the whole answer in British English.
reasoning: |-
  Okay, let me tackle this complex request from a strategy director. They're dealing with high-stakes "commitment races" where irreversible decisions must be made quickly to preempt competitors, but rushing leads to costly mistakes. The challenge is to create a practical decision procedure for their team.

  First, I need to unpack what makes commitment races unique. It's not just about risk assessment - it's about the strategic value of being first to commit irrevocably, while avoiding mutual destruction scenarios. Schelling's work on credible commitments is key here, but so is the danger of racing blindly. 

  The procedure must address several critical dimensions:
  - Verifiability (can the counterparty confirm the commitment?)
  - True irreversibility (is it truly impossible to reverse, or just expensive?)
  - Information value (what would we learn by waiting?)
  - Mutuality options (can we negotiate a standstill?)
  - Portfolio effects (how does this compound other commitments?)

  For the structure, I'm considering a staged approach with clear exit ramps. It should start with verifying the race conditions actually exist before proceeding to assessment. Each stage needs unambiguous pass/fail criteria and designated handoff points for human judgment. The audit trail requirement means every conclusion must be documented with reasons.

  The three test cases will demonstrate how it handles different scenarios:
  (a) The market exit preemption plays on strategic positioning - does "half-planning" a focus strategy make this less risky?
  (b) The supplier exclusivity deal tests how we handle technological uncertainty and contractual lock-in
  (c) For the counterintuitive case, I'm considering a situation where committing fast seems obvious but the procedure flags hidden risks

  Important limitations to flag:
  - It can't replace board governance on major decisions
  - It struggles with truly unprecedented scenarios
  - It assumes rational actors (won't capture emotional escalation)
  - Portfolio effects need separate review

  The language must stay precise but accessible for non-specialists, using British English throughout. No false quantification - where judgment is needed, we'll say so explicitly.
answer: |-
  ## Strategic Commitment Race Decision Procedure (v1.0)

  **Purpose:** To guide structured assessment of irreversible/near-irrevocable commitments under time pressure where pre-empting a counterparty is a key factor, minimising rash action while capturing first-mover advantage where justified. Produces an auditable rationale for `Commit`, `Don't Commit`, or `Wait` (with conditions).

  **Procedure Overview:** Sequential stages. Proceed only if prior stage is satisfied. Document answers & reasoning at each step. Terminate early if clear `Don't Commit` or `Wait` signal emerges. **Flagged Judgement Points (JP)** require designated senior input (e.g., CEO, CFO, Board Rep).

  ---

  ### Stage 1: Validate the Race Exists (Is this *really* a commitment race?)
  1.  **Q1: What specific, verifiable evidence indicates the counterparty is likely to make a similar, pre-emptive commitment imminently?**  
      *   *Sufficient Answer:* Concrete evidence (e.g., credible leak from their supplier, verified industry intelligence, public regulatory filing hinting at move, direct but time-limited offer from counterparty). Hearsay/rumor is insufficient.
      *   *Terminate:* `Don't Commit` if evidence is weak/unverifiable. This isn't a true race.
      *   *JP:* Assessment of evidence credibility if ambiguous.
  2.  **Q2: Can we make a commitment that the counterparty will reliably observe and believe is binding?**  
      *   *Sufficient Answer:* Clear "Yes" with mechanism (e.g., public announcement to key customers/market, signed & enforceable contract with penalties, verifiable sunk cost). "Maybe" or reliant on trust is insufficient.
      *   *Terminate:* `Don't Commit` if commitment cannot be made observable/credible. It won't serve its strategic purpose.
  3.  **Q3: What is the irrevocability level? (a) Truly Irrevocable (e.g., legal ban, physical destruction), (b) Very Costly Reverse (e.g., huge contract penalties, reputational ruin), (c) Moderately Costly Reverse?**  
      *   *Sufficient Answer:* Clear categorisation based on legal/financial/operational analysis.
      *   *Impact:* Higher irrevocability (a/b) increases risk weight. (c) weakens the commitment's strategic value but may still be used.

  **Stage 1 Outcome:** Proceed only if Q1 evidence is strong, Q2 is "Yes", and irrevocability is defined. Else `Don't Commit`.

  ### Stage 2: Assess the Commitment's Core Value (Ignoring the Race)
  4.  **Q4: Is this commitment inherently beneficial *to us*, based on current information, even if the counterparty *doesn't* act?**  
      *   *Sufficient Answer:* Quantitative/qualitative analysis of standalone NPV, strategic alignment, risk exposure. Must pass internal hurdle rates/strategic filters.
      *   *Terminate:* `Don't Commit` if standalone value is negative/marginal. Avoid bad commitments just to "win" a race.
      *   *JP:* Interpretation of strategic alignment; setting acceptable risk thresholds.
  5.  **Q5: What is the range of potential negative outcomes if we make this commitment and the counterparty *doesn't* act as expected (e.g., they don't enter the market, don't sign with the supplier)?**  
      *   *Sufficient Answer:* Identification of key downside scenarios (e.g., stranded capacity, paying above market long-term, lost flexibility) and estimated financial/strategic impact (point estimates or ranges).
      *   *Impact:* Large potential downsides increase risk.

  **Stage 2 Outcome:** Proceed only if Q4 shows clear positive standalone value AND Q5 downsides are deemed acceptable/controllable by leadership (`JP`). Else `Don't Commit`.

  ### Stage 3: Assess the Race Dynamics & Information Value
  6.  **Q6: What specific advantage do we gain *only* by committing *before* the counterparty?**  
      *   *Sufficient Answer:* Clear articulation (e.g., capture sole supplier, deter competitor entry, secure key customer, pre-empt regulatory change). Must be material.
      *   *Terminate:* `Don't Commit` if first-mover advantage is negligible or speculative.
  7.  **Q7: What critical information are we missing *now* that we could obtain by waiting (even briefly)? How would that information change our decision?**  
      *   *Sufficient Answer:* Specific information gaps identified (e.g., competitor's final investment decision, substitute tech feasibility proof, true market demand signal). Analysis of how likely info is to change Stage 2 assessment.
      *   *Impact:* High value of missing info that could invalidate the commitment favours `Wait` or `Don't Commit`.
  8.  **Q8: Can we credibly negotiate a mutual standstill or coordination mechanism to avoid a destructive race?**  
      *   *Sufficient Answer:* Exploration (even rapid) of options (e.g., joint venture discussion, market division proposal, temporary information sharing pact). Feasibility assessment.
      *   *Terminate:* `Wait` (for negotiation outcome) if feasible & counterparty engagement likely. `Don't Commit` if negotiation is impossible/pointless.
      *   *JP:* Assessment of counterparty's willingness to coordinate.

  ### Stage 4: Make the Call (Commit / Don't Commit / Conditional Wait)
  9.  **Synthesis & Decision Rule:**
      *   If **Standalone Value (Q4)** is **Strongly Positive** AND **First-Mover Advantage (Q6)** is **High & Material** AND **Downside if Counterparty Doesn't Act (Q5)** is **Acceptable** AND **Value of Missing Info (Q7)** is **Low** -> **`Commit`**.
      *   If **Value of Missing Info (Q7)** is **High** AND obtaining it is **Feasible within the Timeframe** AND the **Risk of Losing First-Mover Position** during wait is **Moderate/Low** -> **`Wait`** (specifying timeframe/conditions for reassessment).
      *   If **Standalone Value (Q4)** is **Negative/Marginal** OR **Downside (Q5)** is **Unacceptable** OR **First-Mover Advantage (Q6)** is **Negligible** OR **Commitment Credibility (Q2)** is **Weak** -> **`Don't Commit`**.
      *   If **Mutual Standstill (Q8)** is **Achievable and Preferable** -> **`Don't Commit`** (to the unilateral race) and pursue coordination.
      *   **JP:** Final weighting of factors, especially when synthesis is ambiguous or involves significant strategic trade-offs beyond pure quantification. Board sign-off triggered here per governance rules if `Commit` is proposed and exceeds threshold.

  **Portfolio-Level Risk Note:** The procedure assesses *this specific race*. The systemic risk of accumulating bad commitments ("winning battles, losing the war") **does not belong here**. This requires a **separate, periodic (e.g., quarterly/annual) strategic review** of the *entire portfolio* of existing and potential commitments for coherence, over-exposure, and hidden correlations.

  ---

  ### Procedure Walkthroughs (British English)

  **Case (a): Pre-emptive Market Exit Announcement**
  *   **Q1:** Evidence? Credible industry source confirms competitor actively scoping our adjacent Segment B. Medium evidence.
  *   **Q2:** Credible Commitment? Public announcement to key customers & press release verifiable. Yes.
  *   **Q3:** Irrevocability? Very Costly Reverse (reputational damage, customer loss if re-entered later). (b).
  *   **Q4:** Standalone Value? We were "half-planning" focus. Analysis shows Segment A (core) margins 15%, Segment B 5%. Exiting B frees capital for A growth (+£2m NPV estimated). Moderately Positive.
  *   **Q5:** Downside if Competitor Doesn't Enter? We've exited a marginally profitable segment unnecessarily. Loss: ~£500k/year profit. Acceptable given strategic focus gain? (`JP: Leadership` - May say yes for focus).
  *   **Q6:** First-Mover Advantage? Deters competitor from entering B (they wanted synergy with A). High & Material (protects core).
  *   **Q7:** Value of Waiting/Missing Info? Competitor's final decision. Could confirm entry (supports) or reveal bluff (makes exit potentially premature). High value. Can we wait? Rumour suggests decision in 1 week; announcement prep takes 3 days. Risk of them moving first? Moderate. (`JP: Leadership` - Assess risk tolerance).
  *   **Q8:** Mutual Standstill? Unlikely (competitive market deterrence).
  *   **Synthesis:** Mod Positive Standalone, High First-Mover Advantage, Acceptable Downside, BUT High Value Info potentially available soon. Risk of losing first-mover spot by waiting 1 week is Moderate.
  *   **Decision:** `Wait` (7 days) to gather competitor intent. If confirmed entering, then `Commit` to announcement. If no confirmation, reassess Standalone Value more critically - likely `Don't Commit` to pre-emptive exit. (`JP` required on risk of waiting vs. value of info).

  **Case (b): Supplier Exclusivity Deal**
  *   **Q1:** Evidence? Supplier stated offer only open 2 weeks; they are meeting our rival next week. High evidence (direct).
  *   **Q2:** Credible Commitment? Signed 7-year contract with liquidated damages for breach. Yes.
  *   **Q3:** Irrevocability? Very Costly Reverse (penalties = 2x annual savings). (b).
  *   **Q4:** Standalone Value? Below-market prices save £1m/year initially. BUT engineers estimate 40% chance viable substitute in 3 years (saving £1.5m/year if achieved). NPV range: -£2m (if sub works early) to +£5m (if no sub). Standalone value ambiguous. (`JP: Leadership` on risk appetite).
  *   **Q5:** Downside if Rival Doesn't Sign? We are locked in. If substitute emerges, we lose £500k/year opportunity cost vs. market for 4 years (-£2m). If no sub, we still save. Downside is Potentially Large.
  *   **Q6:** First-Mover Advantage? Secures below-market input cost exclusively, denying rival same advantage. High & Material.
  *   **Q7:** Value of Waiting/Missing Info? Substitute viability clarity. Engineers say pilot results in 6 months give 80% confidence. High value. Can we wait? Supplier deadline is 2 weeks. Risk of rival signing first? High.
  *   **Q8:** Mutual Standstill? Impossible (exclusivity is the offer).
  *   **Synthesis:** Ambiguous Standalone Value, High First-Mover Advantage, Potentially Large Downside, High Value Info but cannot wait long enough to get it without high risk of losing the deal.
  *   **Decision:** Hinges critically on `JP` (Leadership/Board) risk appetite regarding the substitute. If highly risk-averse to lock-in: `Don't Commit`. If confident in engineering's timeline/odds or prioritises cost certainty now: `Commit`. The race pressure forces a judgement call on an uncertain core value. *Audit Trace Must Show JP Rationale Clearly*.

  **Case (c): The Counter-Intuitive Result - Price Guarantee Announcement**
  *   **Scenario:** Competitor rumoured to launch a disruptive low-price product in 6 months. Sales urges us to announce a 3-year "Price Guarantee" to lock in customers now, fearing customer churn if we don't act first. Stakes: High (10% revenue segment). Time: 48 hours.
  *   **Q1:** Evidence? Rumours strong, competitor hiring sales staff. Medium/High.
  *   **Q2:** Credible Commitment? Public announcement to customers. Yes (reputational hit to break).
  *   **Q3:** Irrevocability? Very Costly Reverse (reputational ruin with customers). (b).
  *   **Q4:** Standalone Value? Locking prices *now* prevents us from *lowering* prices if competitor launches. If competitor launches low, we could lose share OR be forced to break guarantee (ruinous). If they don't launch, guarantee is unnecessary. Standalone Value is **Negative** (removes future flexibility with high downside). (`JP` might argue otherwise, but analysis shows negative).
  *   **Q5:** Downside if Competitor Doesn't Launch? We are stuck with potentially uncompetitive prices if market softens, cannot react. Moderate/High.
  *   **Q6:** First-Mover Advantage? Claims to "secure" customers. But customers won't sign long-term if they suspect price drop/competitor entry. Advantage likely **Negligible** or even negative (signals desperation).
  *   **Q7:** Value of Waiting? Competitor launch confirmation. Critical. Launch likely confirmed within 3-4 months. High value.
  *   **Q8:** Mutual Standstill? N/A.
  *   **Synthesis:** **Negative Standalone Value, Negligible First-Mover Advantage, Moderate/High Downside, High Value Info obtainable soon(ish).** Race pressure is high but based on fear, not sound advantage.
  *   **Decision:** `Don't Commit`. Despite intense time pressure and fear of competitor action, the core commitment is bad strategy. The procedure overrules the instinct to "race". Better to monitor competitor closely and develop flexible response plans. *This demonstrates the procedure's value in preventing destructive racing based on panic.*

  ---

  ### What the Procedure Cannot Do: Limitations & Exclusions

  1.  **Predict the Unpredictable:** It cannot reliably assess scenarios involving unprecedented events, black swans, or radical competitor irrationality. It relies on reasoned estimates.
  2.  **Replace Board Governance:** Major commitments requiring board approval per company policy must still go to the board. The procedure informs, doesn't override, governance.
  3.  **Quantify the Unquantifiable:** While it forces identification of key values and risks, deep strategic trade-offs or values-based decisions remain `Judgement Points`. It doesn't fake precision.
  4.  **Handle Emotional Escalation:** It assumes rational actors following the procedure. It cannot prevent emotional "doubling down" or personal vendettas distorting judgement at `JP`s.
  5.  **Solve True Prisoner's Dilemmas:** In pure mutual-destruction races where *both* sides are forced to commit to avoid the worst outcome (even if mutual non-commitment is better), the logic may still push towards `Commit`. It highlights the dilemma but doesn't magically resolve it.
  6.  **Account Fully for Portfolio Effects:** As noted, systemic accumulation risk requires separate review. This procedure is inherently single-decision focused.
  7.  **Guarantee Success:** It structures the decision and improves odds by forcing critical considerations, but outcomes depend on external events and execution. It's a better process, not a crystal ball.

  **Never Trust This Procedure For:**
  *   **Decisions Driven Primarily by Moral/Ethical Imperatives:** (e.g., committing to unsafe production because a competitor might). The procedure is amoral; ethics must be a prior filter.
  *   **Decisions Involving National Security or Extreme Systemic Risk:** The stakes and dynamics exceed the model's scope.
  *   **Decisions Where Irrevocability is Absolute and Catastrophic Failure is Possible:** (e.g., launching nuclear weapons). The risk-weighting mechanisms are insufficient.
  *   **Decisions Under Seconds/Minutes:** The procedure requires structured thought, incompatible with extreme time pressure.

  This procedure provides a rigorous, auditable framework for navigating high-stakes commitment races. It forces explicit consideration of the unique dynamics involved, surfaces critical judgements, and aims to prevent both reckless rushing and paralysing hesitation, balancing Schelling's insight with the perils of the race itself. Remember to integrate the portfolio review process separately.
