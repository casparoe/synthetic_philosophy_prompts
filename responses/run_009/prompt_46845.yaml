prompt: |-
  I've been collecting my gut verdicts on inside-view versus outside-view reasoning, and I want to know whether they add up to a principle or whether I'm just rationing epistemic modesty to whoever happens to be in front of me. The verdicts: my friend's startup will fail even though his plan is detailed and coherent, because the base rate for startups is brutal, and I'd say the same to him. My own career pivot, though, I'm confident about despite an equally grim base rate, because I know things about my situation the reference class can't see. A doctor who tells me only the survival statistics for my condition, waving off the specifics of my case as noise, seems like she's reasoning well; an engineer who tells me the launch will succeed because every launch in the reference class succeeded, ignoring the specific component he knows is marginal, seems like he's reasoning badly. Predictions of imminent civilizational doom I discount heavily on the outside view, since such predictions have a perfect record of failure; but when my community's own favored catastrophe scenario is challenged on exactly those grounds, I find myself saying the reference class is a trap, because the class of failed doom predictions was assembled by people who never considered the mechanism. And in forecasting tournaments I've noticed I trust a forecaster more when she beats the crowd by a small, boring margin than when she claims a large edge from special insight, which feels like modesty -- yet the forecasts that actually changed my life came from people with extreme, conviction-driven inside views.

  Is there a single principle -- something about when reference classes are informative versus malformed, or about how much private information it takes to override a base rate -- that captures all of these? Or do I have to give some up? I can see at least two tempting but suspicious principles I'd want you to test rather than endorse: that the inside view is legitimate exactly when you have genuine private information (which my startup-owning friend also plausibly has), and that the inside view is legitimate when the reference class is heterogeneous or gerrymandered (which is exactly what someone with a vested interest in the inside view always says about their reference class). Tell me which principle, if any, survives my cases; where it forces me to overturn a verdict, say which one and why; and what it predicts for a case I haven't listed -- say, a small organization deciding whether to attempt a project that has failed everywhere it has been tried, but under materially different conditions each time. Please answer in American English.
reasoning: |-
  Okay, the user is struggling with when to trust the inside view versus the outside view across various life scenarios. They've listed several personal verdicts that seem contradictory on the surface - sometimes favoring base rates, other times dismissing them for specific insights. 

  Hmm, what's really going on here? The user seems intellectually honest - they're noticing their own inconsistencies and want a principled framework rather than just defending their preconceptions. The examples span startups, medical decisions, engineering, existential risks, and forecasting tournaments. That's quite a range! 

  I notice two main tensions: First, between statistical evidence and personal agency (like in their career pivot). Second, between wanting experts to respect base rates (the doctor case) but also value specialized knowledge (the engineer case). There's also this meta-layer where they recognize they might be applying double standards when it suits them or their tribe.

  The user mentions two suspicious principles they're aware might be self-serving: 1) That private information justifies overriding base rates (but their startup friend has that too) and 2) That heterogeneous reference classes invalidate outside views (which is convenient for insiders). Smart of them to flag these - shows they're not just seeking validation.

  What's their deeper need? Probably epistemic integrity. They want to know when they're thinking clearly versus rationalizing. The organizational case they added at the end is telling - it's about decision-making under uncertainty where both views have merit.

  Looking at their cases, the common thread seems to be signal quality. When the outside view has high signal (like startup failure rates), it dominates. When inside information has high signal (like knowing a rocket component is faulty), it should override. But crucially, most people overestimate their inside signal. 

  The forecasting tournament example is particularly insightful. They instinctively trust small consistent edges over dramatic claims - that's classic Bayesian updating. Yet they admit life-changing insights came from conviction-driven views. This tension between calibration and transformative ideas is real - Nassim Taleb's "antifragile" concepts come to mind.

  For the organizational case I'd propose: The outside view says "this usually fails" is valuable but not decisive. They should probe why failures happened under different conditions. If those differences include crucial factors their org controls better (real inside signal), attempt it. If the differences seem irrelevant (noise), abort. The key is rigorously stress-testing whether their "special factors" are truly differentiators or just excuses.
answer: |-
  Here's a single, robust principle that survives all your cases while exposing one verdict that needs overturning:

  **The Principle of Signal Strength vs. Reference Class Integrity:**
  *Outside view reasoning (base rates/reference classes) should be the default anchor.*
  *Inside view reasoning (private information/specific mechanisms) can override the outside view **only when**:*
  1.  **The private signal is genuinely strong and causally relevant** (high quality, specific, verifiable knowledge unavailable to the reference class compiler), *AND*
  2.  **The reference class is demonstrably flawed** (too heterogeneous, gerrymandered, or crucially missing a key causal factor your private signal addresses).

  **How it resolves your verdicts:**

  1.  **Friend's Startup:** **Correct to discount inside view.** Your friend has private info, but the reference class (startups) is robust *and* the signal strength of individual founder confidence/plan coherence is notoriously weak (overconfidence is universal). The base rate dominates. *(Principle applied: Strong reference class, weak/overconfident private signal).*
  2.  **Your Career Pivot:** **Potentially correct, but high bar.** Confidence is justified *only if* your private information is *strongly predictive and unique* (e.g., "I have a signed offer letter for the new role," "My specific niche skill is suddenly in massive demand," "I possess unique data proving this market is underserved"). Generic "I know myself/my situation" is usually weak signal vulnerable to bias. *(Principle applied: Can override IF private signal is genuinely strong/causal AND the 'failed career pivots' class might be heterogeneous/missing a key factor you possess).*
  3.  **Doctor (Stats Only):** **Correct reasoning.** Medical statistics incorporate vast, relevant data. A patient's subjective "specifics" are usually weak signals or noise compared to population-level evidence. Doctors *should* anchor on stats unless presented with *objectively strong, novel* private data (e.g., a rare genetic test result). *(Principle applied: Strong reference class, weak/irrelevant private signal from patient).*
  4.  **Engineer (Ignores Marginal Component):** **Correct reasoning.** The engineer has *strong, specific, causal private information* (knowledge of a known weak component). The reference class ("all previous successful launches") is **flawed** because it doesn't account for *this specific causal factor* being different in *this* launch. The inside view *must* override the misleading outside view. *(Principle applied: Strong, causal private signal; flawed reference class missing key causal factor).*
  5.  **General Doom Predictions:** **Correct to discount.** The reference class ("past predictions of imminent doom") is robust and homogeneous in outcome (all failed). The predictors' private "mechanisms" consistently generate weak signals (high false positive rate). Base rate dominates. *(Principle applied: Strong reference class, consistently weak private signals from predictors).*
  6.  **Your Community's Doom Scenario:** **Verdict Overturned.** Your defense ("failed predictions didn't consider *this* mechanism") mirrors your engineer case *but misses the critical element*. Does your community possess **objectively strong, novel evidence** for the mechanism *unavailable* to prior predictors? Or is this just special pleading? The "doom prediction failure" reference class is strong *unless* you have truly unique, high-quality evidence making *this* prediction fundamentally different causally. Generic "they didn't consider it" isn't enough; *you* need to show *your specific evidence* is strong enough to break the class. Default should be skepticism. *(Principle applied: Reference class is strong; "they didn't consider it" is usually a weak private signal indicating bias, not strong evidence. Override only justified with extraordinary proof).*
  7.  **Forecasting Tournaments (Small Edge):** **Correct trust.** Beating the crowd consistently by a small margin demonstrates superior *calibration* and effective use of *both* inside and outside views. It suggests skill in weighing signals appropriately, avoiding overconfidence. This *is* epistemic modesty in action. *(Principle applied: Consistent small outperformance signals robust skill integrating views, not over-reliance on weak inside signals).*
  8.  **Forecasting Tournaments (Large Edge from Insight):** **Correct skepticism.** Extreme conviction-driven inside views often stem from overweighting weak private signals or underweighting strong base rates. While occasionally transformative, they fail far more often. Trust requires extraordinary evidence of the signal's strength and the forecaster's past success with similar bold calls. *(Principle applied: Large edges claimed purely from inside view are red flags for overconfidence/ignoring base rates unless backed by exceptional track record/evidence).*
  9.  **Life-Changing Extreme Forecasts:** **No conflict.** Transformative insights can come from valid strong inside views *that happened to be correct*. The principle doesn't deny this possibility; it simply dictates *how much evidence* you need *before* accepting such a claim over strong base rates. Survivorship bias makes these memorable, but they are rare exceptions, not the rule. *(Principle applied: A correct extreme inside view retrospectively had a strong private signal. The principle governs prospective assessment: high bar required to *accept* such a claim upfront).*

  **The Suspicious Principles Tested:**
  *   *"Inside view legitimate only with genuine private information":* **Too weak.** Your startup friend *has* private info, but it's low-quality signal (overconfidence). The principle requires **strong, causally relevant** private info.
  *   *"Inside view legitimate when reference class is heterogeneous":* **Too easily gamed.** Everyone can *claim* heterogeneity. The principle requires **demonstrable flaws** (heterogeneity *on a causally relevant factor* your private signal addresses) and crucially, **strong private signal**.

  **Prediction for the Small Organization Case:**
  *   **Project:** Attempted everywhere, failed everywhere, under "materially different conditions."
  *   **Outside View (Default Anchor):** Very strong prior against success. "Failed everywhere" is a powerful signal.
  *   **Inside View Override?** **Depends entirely on signal strength vs. reference class integrity:**
      *   *Strong Inside Signal Needed:* The organization must identify *specific, causal factors* that caused past failures AND possess *strong, objective evidence* that *their specific situation* differs *favorably* on *those exact factors* (e.g., "Past failures lacked Tech X; we uniquely possess proven Tech X," "Failures were in Region Y with regulation Z; we operate in Region W without Z, and here's market data proving viability").
      *   *Reference Class Flaw:* They must demonstrate the "materially different conditions" represent **causally relevant heterogeneity** that invalidates the "failed everywhere" class for *their specific attempt*. "Conditions were different" isn't enough; they must show *how those differences directly enable success where it was impossible before*.
      *   **Conclusion:** Without strong, specific, causal inside information demonstrating a fundamental, favorable difference on the failure drivers, the outside view *must* dominate – attempting the project is likely foolish. If they have that strong inside signal, a cautious, evidence-based attempt *might* be justified, heavily monitored for confirmation bias. The burden of proof is very high.

  This principle forces epistemic modesty by making the outside view the default, demanding high-quality evidence for overriding it, and protecting against the universal human tendency toward overconfidence in our own "special" insights. It survives your cases by rigorously defining when the inside view isn't just *present*, but *powerful enough* to matter. The one verdict it forces you to overturn is your defense of your community's doom scenario – unless you can point to truly extraordinary, objective evidence uniquely available to you.
