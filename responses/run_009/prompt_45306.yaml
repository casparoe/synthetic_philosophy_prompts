prompt: |-
  I'm taking a philosophy of science course this term, and we recently covered the idea that the available evidence can fail to single out one theory as true. There's a specific configuration I keep running into, in the readings and outside them, that I can't find a label for, and I'd like to know whether the field has one. The setup is this: two accounts of the same domain agree about every observation that has been made and, as far as anyone can tell, about every observation that could be made. When you ask each side what experiment would decide between them, they name the same experiment and agree in advance on how each possible result would be described. What keeps the dispute alive is something else: the two camps disagree about which of their shared commitments is doing the real work. One side treats A as fundamental and B as a consequence that happens to hold in our corner of things; the other treats B as fundamental and A as the derived, local fact. Two instances: in the course we discussed whether, in general relativity, the metric counts as part of the container or as a field sitting on a stage — where both sides accept every reading of every rod and clock; and in an economics seminar I sat in on, whether market prices are to be explained by individual preferences or whether individual preferences get their content from prices — again, both camps would accept the same data and the same future data.

  This is clearly adjacent to what our course covered under underdetermination, but in the standard cases the rivals at least differ in some possible observation, so evidence could in principle close the gap; here neither side believes any possible instrument reading would move the other, and both say so openly. It also doesn't look like what our textbook called incommensurability, since the two camps understand each other perfectly well and share vocabulary. So my questions: does this configuration — full observational agreement plus a standing dispute over which shared claim is basic — have an established name of its own (conventionalism? something like "equivalent descriptions"? Poincaré came up only in passing), and if not, how should it be carved? I want to know what exactly the disagreement is over, what it is not over, and where its edges lie — specifically, what separates it from ordinary underdetermination on one side and from a merely verbal dispute on the other. Please lead with your verdict on whether a name exists, and keep the whole answer to at most 400 words.
reasoning: |-
  Okay, the user is taking a philosophy of science course and has encountered a specific philosophical configuration where two theories agree on all observations but disagree on what's fundamental versus derived. They want to know if this has a name and how to distinguish it from related concepts.

  First, I recall that this setup resembles Poincaré's conventionalism, especially his geometric examples. He argued that choosing between Euclidean and non-Euclidean geometries is a matter of convention since they're empirically equivalent. The user's examples—general relativity's metric and economics preferences/prices—fit this pattern perfectly. Both sides agree on all possible data but differ in what they consider foundational.

  The user mentioned underdetermination and incommensurability, but this case is different. Underdetermination involves theories that could diverge with future evidence, whereas here no observation could ever distinguish them. Incommensurability involves conceptual mismatches, but here both sides share vocabulary and understand each other. 

  This also isn't a verbal dispute because the disagreement is about ontological priority, not meanings. The core issue is explanatory asymmetry: which principle grounds the other. For example, in economics, do preferences cause prices or vice versa? The evidence can't settle this because any data point will be interpreted consistently by both frameworks.

  The established term here is "conventionalism" (specifically from Poincaré) or sometimes "equivalent descriptions." The user's examples align with historical cases like Poincaré’s geometry or Reichenbach’s coordinative definitions. The key is the disagreement over fundamentality despite empirical equivalence. 

  To carve its boundaries: it differs from underdetermination by having no possible evidential divergence, and from verbal disputes by involving substantive explanatory disagreements. The edges lie in whether the theories are intertranslatable without residue and if the dispute persists solely due to choices in explanatory framing.
answer: |-
  Yes, this configuration has an established name: **Conventionalism** (specifically drawing on **Poincaré's geometric conventionalism**).

  **Why Conventionalism Fits:**

  1.  **Poincaré's Core Insight:** Henri Poincaré argued that choosing between Euclidean and non-Euclidean geometries for physical space is a matter of *convention*, not empirical discovery. Both descriptions are *empirically equivalent* – they predict the same observations about rigid bodies and light rays. The choice rests on convenience or simplicity, not truth.
  2.  **Your Examples Match Perfectly:**
      *   **GR Metric:** The debate over whether the metric is part of the container (spacetime itself) or a field *on* a container (a background spacetime) is a quintessential conventionalist choice. Both descriptions account for *all* rod/clock measurements. The dispute is about what is ontologically fundamental vs. a useful description.
      *   **Economics:** The "preferences -> prices" vs. "prices -> preferences" debate, assuming full empirical agreement on market data and behavior, similarly reflects a choice in explanatory fundamentality with no empirical consequence.

  **Carving the Concept & Boundaries:**

  *   **What the Disagreement IS Over:** It's about **ontological priority, explanatory fundamentality, and theoretical interpretation.** Which element in the shared web of belief is the *ground* and which is the *consequence*? It's a disagreement about the *structure* or *interpretation* of the theory, not its empirical predictions.
  *   **What it is NOT Over:** It is **not over any possible observation** (distinguishing it from standard underdetermination). It is **not a verbal dispute** because both sides agree on the meanings of the terms (distinguishing it from incommensurability *and* mere semantics); they disagree on *what the shared terms refer to fundamentally* in the world's structure.
  *   **Edges:**
      *   **vs. Standard Underdetermination:** Underdetermination allows for *future* empirical differences. Conventionalism asserts *no possible* empirical difference ever. The rivals are *empirically indistinguishable*.
      *   **vs. Verbal Dispute/Mere Semantics:** While the dispute hinges on interpretation, it concerns substantial ontological or explanatory commitments, not just word meanings. Both sides agree on word meanings *and* all facts; they disagree on *what explains what* or *what the underlying reality is*. The disagreement feels substantive, not trivial.
      *   **vs. Incommensurability:** Incommensurability involves a failure of full communication or shared meanings/concepts. Here, communication is perfect; the frameworks are intertranslatable.

  **Verdict:** The established name is **Conventionalism**, rooted in Poincaré's work on geometry and extended to similar cases of empirically equivalent descriptions differing only in what is deemed fundamental.
