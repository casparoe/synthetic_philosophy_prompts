  Below is a decision tree designed for your 40-minute discussion session. It fits on one page, uses concrete cases to anchor branches, and leads to the five specified ethical positions without revealing labels. Each branch question is phrased neutrally to avoid presupposing doctrines. The tree includes a cross-check question to identify inconsistencies and flags unresolvable distinctions.

  ---

  ### **What Do You Actually Believe About Doing Harm vs. Allowing It?**  
  *Answer honestly—no prior philosophy knowledge needed.*

  **Start Here:**  
  1. **In the trolley scenario, is it morally acceptable to divert a runaway trolley onto a side track where it will kill one person to save five others?**  
     - **Yes** → Go to 2  
     - **No** → Go to 7  

  **Branch 1 (Diverting Trolley = Yes):**  
  2. **In the footbridge scenario, is it morally acceptable to push a large man off a footbridge to stop the trolley and save five people?**  
     - **Yes** → Go to 3  
     - **No** → Go to 4  

  3. **In the organ-harvesting scenario, is it morally acceptable for a surgeon to kill one healthy patient (without consent) to harvest organs and save five dying patients?**  
     - **Yes** → **Leaf A: Straight Consequentialism**  
       - *Hardest commitment: Pushing the man or harvesting organs is not just "permissible" but often obligatory, even if it feels deeply wrong.*  
     - **No** → **Leaf D: Pro Tanto View**  
       - *Hardest commitment: Diverting the trolley is acceptable (harm is outweighed), but pushing the man is not—even though both save five lives.*  

  4. **In the medical scenario, if a dying patient requests death to end suffering:**  
     a. **Is it acceptable to switch off their ventilator?**  
        - **Yes**  
     b. **Is it acceptable to give them a lethal injection?**  
        - **Yes** → Go to 5  
        - **No** → **Leaf E: Killing vs. Letting Die Distinction**  
          - *Hardest commitment: Switching off the ventilator is "letting die" (acceptable), but a lethal injection is "killing" (forbidden)—even with consent and identical outcomes.*  

  5. **In the drowning-child scenario, if you walk past a shallow pond and see a child drowning, are you morally required to save them (even if it ruins your clothes)?**  
     - **Yes** → Go to 6  
     - **No** → Stop (Inconsistent responses; see facilitator)  

  6. **In the famine-victims scenario, if you can save a starving child in a faraway country by donating money (at similar personal cost), are you morally required to do so?**  
     - **Yes** → **Leaf A: Straight Consequentialism**  
       - *Hardest commitment: Walking past the drowning child is as wrong as ignoring famine victims—both are failures to prevent harm.*  
     - **No** → **Leaf C: Moralized Doing/Allowing**  
       - *Hardest commitment: Harvesting organs is forbidden because rights override outcomes, but saving the drowning child is required due to proximity (while famine victims are "allowed" to die).*  

  **Branch 2 (Diverting Trolley = No):**  
  7. **In the footbridge scenario (pushing the man), is it morally acceptable?**  
     - **Yes** → Stop (Inconsistent responses; see facilitator)  
     - **No** → Go to 8  

  8. **In the ventilator scenario, if a dying patient requests it, is switching off their ventilator acceptable?**  
     - **Yes** → Go to 9  
     - **No** → Stop (Rare view; see facilitator)  

  9. **In the lethal-injection scenario (same patient request), is it acceptable?**  
     - **Yes** → **Leaf B: Non-Moralized Doing/Allowing**  
       - *Hardest commitment: Diverting the trolley redirects an existing threat (impermissible if it "does harm"), but switching off a ventilator merely "allows" death (permissible).*  
     - **No** → **Leaf E: Killing vs. Letting Die Distinction**  
       - *Hardest commitment: Switching off the ventilator is "letting die" (acceptable), but lethal injection is "killing" (forbidden), even if the harm is identical.*  

  ---

  ### **Key Notes for Your Discussion:**  
  - **Cross-Check Question:** Use the **drowning child vs. famine victims** (questions 5–6) to detect inconsistencies. If someone says "yes" to saving the child but "no" to donating, yet also endorses consequentialism (Leaf A), their answers pull in opposite directions.  
  - **Unresolvable Distinction:** **Leaf B (Non-Moralized Doing/Allowing) and Leaf E (Killing/Letting Die)** *cannot be fully separated* by your cases. Both reject footbridge pushing and lethal injection but accept ventilator removal. The medical cases partially distinguish them, but deeper nuances (e.g., "initiating a threat" vs. "killing as a special category") require philosophical labels.  
  - **Empty Region:** A view that treats *doing harm as always worse than allowing harm, yet denies any duty to prevent harm* (e.g., walking past the drowning child is fine). This is coherent but unattractive—it implies no obligations to aid anyone, anywhere, which few defend.  
  - **Diagnostic Success:** The **ventilator vs. lethal injection** pair cleanly isolates Leaf E (killing/letting die) from other views. No reinforcement needed—it forces a choice even for non-philosophers.  

  ### **Why This Works for Your Class:**  
  - **Anchors all five cases** while adding the drowning/famine pair to stress positive duties.  
  - **Fits one page** (9 branch max).  
  - **Clarifies hardest commitments** for each position (e.g., consequentialists must defend pushing the man).  
  - **Labels hidden** until the end to prevent bias.  

  Run the session by having classmates self-sort via the tree, then reveal the leaves. Discuss inconsistencies and "empty" regions to spark debate!
