prompt: |-
  I've been cataloguing my friend's verdicts on when a group's majority deserves more trust than any of its individual members, and I'd like a prediction about where she'll go next. Her record so far: (i) a hundred voters, each independently 51% accurate on binary questions, and she says their majority is very likely right and deserves more trust than any one of them; (ii) a thousand voters, each 51% accurate, who all read the same newspaper and take their cues from it, and she says their majority is barely better informed than the newspaper alone, so she would rather just consult the paper; (iii) a panel of three experts, each 60% accurate, and she trusts their majority over any single expert; (iv) five forecasters, each only 40% accurate, and she says their majority is probably wrong and she would bet against it. Next week we'll be asking her about two new systems: a suite of fifty language models, each 55% accurate on a certain question type, but all fine-tuned from the same base model and trained on overlapping corpora, so they tend to make the same mistakes on the same questions; and ten human forecasters, each 55% accurate, who deliberate together and share their reasoning before casting their votes. Predict her verdict on each of the two new systems, identify the candidate rules that fit her track record equally well, say which rule you would bet on her using and why, and propose one further case that would best discriminate among those rules. Please answer in American English.
reasoning: |-
  Okay, the user wants me to predict their friend's verdict on two new systems based on her previous judgments about group decision-making. Let me start by analyzing her track record to understand her decision patterns.

  First, she trusts a majority of 100 independent voters each 51% accurate. This makes sense because of the Condorcet Jury Theorem—many independent voters slightly better than chance make the majority very reliable. 

  Next, with 1000 voters all influenced by the same newspaper at 51% accuracy, she doesn't trust the majority. Here, the lack of independence negates the wisdom of the crowd. So dependency matters a lot to her.

  Then, three experts at 60% each: majority trusted. Higher individual accuracy here, even with a small group. But why no concern about dependency? Maybe because the accuracy is higher or the group is small enough that dependency isn't an issue? 

  Five forecasters at 40% each: she bets against the majority. Since each is worse than chance, more of them amplifying errors. So individual accuracy below 50% is a red flag for her.

  Now the new cases: Fifty language models at 55% accuracy, but dependent due to shared base and training data. Similar to the newspaper case—high dependency might make her dismiss the majority. 

  Ten human forecasters at 55% who deliberate. Deliberation introduces dependency through shared reasoning. But unlike the newspaper case, they might have some diversity initially. However, her past concern with shared cues suggests she might distrust this too. But maybe the deliberation adds value? Her newspaper case shows she discounts dependent groups even with high numbers. 

  Possible rules she uses: The first candidate rule combines independence and accuracy above 50%. The second adds that dependency reduces effective group size to near one. The third considers both individual accuracy and dependency.

  For the language models, high dependency and moderate accuracy—likely she'll say no better than the base model. For the humans, dependency through deliberation might lead her to distrust, but maybe she values the deliberation? Her newspaper case suggests dependency overshadows numbers, so probably similar verdict. 

  Discriminating case: A small group (say 5) with 52% accuracy, independent. Candidate rule 1 trusts them (above 50% and independent), but rule 2 doesn't because small group size might not reach reliability. Rule 3 might trust if dependency is low. This case could clarify if she requires a minimum group size or strictly follows independence and accuracy.
answer: |-
  Based on your friend's track record, here's the prediction for the new systems, the candidate rules, and how to test them:

  ### Prediction for New Systems
  1.  **Fifty Language Models (55% accurate, high dependency):**  
      *   **Verdict:** She **will NOT trust the majority** over the base model/individuals.  
      *   **Reasoning:** This strongly mirrors case (ii) - the thousand voters relying on the same newspaper. Despite the decent 55% accuracy, the shared base model and overlapping training data create extreme dependency ("tend to make the same mistakes"). Like the newspaper case, she'll see the majority as essentially just amplifying the base model's opinion, not creating meaningful new wisdom. The dependency likely outweighs the moderate accuracy and larger group size.

  2.  **Ten Human Forecasters (55% accurate, deliberation-induced dependency):**  
      *   **Verdict:** She **will NOT trust the majority** over the individuals.  
      *   **Reasoning:** This resembles case (ii) and the language model case due to the induced dependency (deliberation/shared reasoning). While deliberation *might* improve individuals, her verdict in (ii) shows she heavily discounts group wisdom when members aren't independent. Deliberation creates shared biases and groupthink, undermining the "wisdom of crowds" effect she values in case (i). The 55% accuracy is better than 51%, but likely insufficient to overcome her concern about dependency. She'll see the output as the product of a single, flawed group process rather than an aggregate of independent judgments.

  ### Candidate Rules Fitting the Track Record
  1.  **Rule 1: Independence & >50% Threshold:**  
      *   Trust the majority *only if* (a) individuals are independent, *and* (b) individual accuracy > 50%. (Explains: Trusts (i) [indep, 51>50], Rejects (ii) [dep], Trusts (iii) [indep implied?, 60>50], Rejects (iv) [40<50]).

  2.  **Rule 2: Effective Independence & Sufficient Competence:**  
      *   Trust the majority *only if* the group is sufficiently large *and* effectively independent *and* individual accuracy >50%. Dependency radically reduces "sufficiently large" - potentially to near 1. (Explains: Trusts (i) [large, indep, 51>50], Rejects (ii) [large but dep -> effective size=1], Trusts (iii) [small but high accuracy 60>50 compensates for size, indep implied?], Rejects (iv) [40<50]).

  3.  **Rule 3: Accuracy + Dependency Discount:**  
      *   Base trust on both individual accuracy and the *degree of dependency*. High dependency drastically reduces the benefit of the group. Requires accuracy significantly >50% to trust a dependent group. (Explains: Trusts (i) [51>50, indep], Rejects (ii) [51>50 but high dep], Trusts (iii) [60>>50, compensates for potential mild dep/small size], Rejects (iv) [40<50]).

  ### Which Rule I'd Bet On & Why
  *   **Bet on Rule 3: Accuracy + Dependency Discount.**  
  *   **Why:** It best captures the nuance in her judgments.  
      1.  Her strong rejection of (ii) shows dependency is a *major* factor, not just a minor tweak (Rules 1 & 2 struggle with this emphasis).  
      2.  Her acceptance of (iii) shows that sufficiently high individual accuracy *can* overcome the limitations of a small group size or *potential* mild dependency (expert panels often have *some* shared biases). Rule 1's strict independence might not fit (iii) if experts share common knowledge/frameworks. Rule 2 requires assuming (iii) is independent enough, but doesn't explicitly model the accuracy boost.  
      3.  Rule 3 explicitly weights both factors: moderate accuracy (51%) *requires* independence to be trusted (i), but higher accuracy (60%) can compensate for smaller size or some dependency (iii). Low accuracy (40%) is rejected regardless (iv), and dependency kills trust even with moderate accuracy (ii).

  ### Discriminating Case Proposal
  *   **Case:** **Five independent voters, each 52% accurate on binary questions.**
  *   **Why it Discriminates:**  
      *   **Rule 1 Prediction:** Trust majority. (Independence: yes, Accuracy: 52>50).  
      *   **Rule 2 Prediction:** *Likely reject majority.* While independent and >50%, the group (n=5) is small and individual accuracy is barely above chance. The Condorcet probability for 5 voters at 52% is only about 53.8% - likely below her "sufficiently large/competent" threshold implied by trusting the large 51% group but rejecting small groups unless accuracy is higher (like 60% in iii).  
      *   **Rule 3 Prediction:** *Likely reject majority.* While independent, 52% is only *marginally* better than 50%. Rule 3 emphasizes needing accuracy "significantly" >50% for trust, especially in smaller groups. The tiny improvement (52% vs 51%) combined with the small size likely wouldn't meet her threshold, contrasting with the high confidence in the large 51% group.

  Her verdict on this small, barely competent, independent group would clearly distinguish Rule 1 (Trust) from Rules 2 & 3 (Reject), and potentially refine the accuracy threshold required by Rule 3.
