answer: |-
  Here’s a breakdown of the implicit foundations of iterated dominance in mixed strategies, the tension with dominant-strategy mechanism design, and how to reconcile your department’s practices:

  ### 1. **What Iterated Dominance (Mixed or Pure) Strictly Requires**  
     - **Common Knowledge of Rationality (CKR)**: Iterated deletion of strictly dominated strategies (IDSDS) requires that:  
       (i) All players are rational (never play a strictly dominated strategy),  
       (ii) All players know (i),  
       (iii) All players know (ii), and so on *ad infinitum*. This is **common knowledge of rationality** in the formal epistemic sense.  
     - **No Additional Beliefs Needed**: IDSDS does *not* require players to have correct beliefs about others' payoffs, information, or strategies. It only requires that players *eliminate* strategies dominated relative to the *full set* of opponents' possible strategies remaining at that stage. Beliefs about *which* strategies opponents will play are irrelevant for deletion.  

  ### 2. **Special Implications of *Mixed*-Strategy Dominance**  
     - **Rationality as EU Maximization**: Avoiding a strategy dominated by a mixed strategy presupposes that players:  
       - Are **expected utility (EU) maximizers**, not just "rule followers."  
       - Can *conceive* of and *evaluate* mixed strategies (i.e., they model opponents as potentially randomizing).  
     - **No Personal Randomization Required**: Players need not randomize themselves. They only need to recognize that *opponents might*, and that a strategy can be dominated *only* if outperformed by some mixture of their own strategies.  
     - **Epistemic Burden**: Mixed domination increases the "cognitive load" but *not* the epistemic depth. The same CKR is required as for pure dominance—just applied to a larger strategy space.  

  ### 3. **Is Weaker Knowledge Sufficient?**  
     - **Finite Depths Fail**: For *n* rounds of deletion, you need *n* levels of mutual knowledge ("I know you're rational," "I know you know I'm rational," etc.). But:  
       - If the game requires *k* rounds to solve, and players only have *k-1* levels of knowledge, a dominated strategy might survive in round *k*.  
       - **Common knowledge is effectively necessary**: Without it, there’s no guarantee deletions will converge to the solution.  
     - **Common *p*-Belief Alternatives**: If rationality is **common *p*-belief** (everyone assigns probability ≥ *p* to rationality, ≥ *p* to others assigning ≥ *p*, etc.):  
       - For high *p*, iterated dominance *might* hold approximately, but deletions become probabilistic. Strategies are only *probably* eliminated.  
       - *p* < 1 introduces equilibrium selection problems. The "solution" is no longer unique or certain.  

  ### 4. **Coherence in Real-World Contexts (e.g., Auctions)**  
     - **The Problem**: Human bidders lack the cognitive capacity for infinite regress reasoning. Common knowledge of rationality is an **idealization**, not a plausible psychological state.  
     - **Why It’s Used Anyway**:  
       - As a **benchmark**: It defines the "fully rational" outcome when agents are hyper-rational.  
       - In **tightly structured, repeated settings** (e.g., chess, oligopolies), players may approximate CKR through learning.  
     - **In Auctions?**: Deep reasoning chains crumble under:  
       - **Unfamiliarity**: One-shot auctions lack learning.  
       - **Complexity**: Payoff structures are often opaque.  
       - **Stakes**: High penalties for missteps make conservatism rational.  

  ### 5. **Are the Two Practices Inconsistent?**  
     **No—but they reflect divergent priorities:**  
     - **Game Theory (IDSDS)**:  
       - *Goal*: **Predict** behavior in *strategic* settings under idealized rationality.  
       - *Assumption*: CKR is tractable/applicable here (e.g., small strategy sets, analytical simplicity).  
       - *Pedagogy*: Teaches students to "solve" games using minimal tools (no equilibrium refinements needed).  
     - **Mechanism Design (Dominant Strategies)**:  
       - *Goal*: **Design robust rules** for *high-stakes, low-trust* environments.  
       - *Assumption*: CKR is **unreliable** with real humans; mechanisms must work even if players are myopic, skeptical, or confused.  
       - *Pedagogy*: Prepares students to build systems immune to belief errors.  

     **Tension? Only superficially**:  
     - Iterated dominance isn’t meant to prescribe how bidders *should* act in auctions—it’s a tool to analyze games *if* CKR holds.  
     - Mechanism design sidesteps CKR precisely *because* it’s fragile. Dominant strategies reduce the game to a decision problem: "What’s best for me *regardless* of others?" This is **orthogonal** to iterated reasoning.  

  ### 6. **What Changes if We Relax Assumptions?**  
     - **In Teaching (Game Theory)**:  
       - Replace CKR with *k*-level mutual knowledge → Show deletion *stops early* if depth < rounds needed.  
       - Use **common *p*-belief** → Solutions become probabilistic sets (e.g., "Outcome A survives with probability > 0.8").  
       - Consequence: IDSDS loses its "deterministic solution" appeal.  
     - **In Design (Mechanisms)**:  
       - Dominant-strategy mechanisms **remain optimal** under relaxed rationality. They *already* assume minimal cognition (no belief formation).  
       - If using *p*-belief, designers might accept *approximate* dominance (e.g., ε-dominant strategies) but sacrifice incentive purity.  

  ### Bottom Line  
  Your department isn’t inconsistent—it’s **contextually nuanced**. Game theory uses IDSDS *because* it’s a clean, teachable solution concept under strong rationality. Mechanism design rejects it *for applications* because human cognition and trust fail to meet CKR. The "rationality" in each room serves a different purpose:  
  - **Morning (Game Theory)**: "Rationality" = **axiomatic, procedural** (follow deletion rules).  
  - **Afternoon (Mechanism Design)**: "Rationality" = **behavioral, robust** (act in self-interest without overthinking).  

  This isn’t a contradiction—it’s the discipline wisely adjusting its lens for the problem at hand. Your challenge as a TA is to clarify *why* each approach fits its context, not to force them into alignment.
