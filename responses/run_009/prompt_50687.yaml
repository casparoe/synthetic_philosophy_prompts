  Then, the tension between the two courses. In game theory, they assume deep rationality chains for solution concepts. In mechanism design, dominant strategies simplify because they don't require such reasoning. The key is context: in one-shot games or thin markets, common knowledge is unrealistic. But in repeated settings, maybe it's more plausible. The auction theorist avoids this by designing mechanisms where truth-telling is dominant, removing the need for belief hierarchies.

  I should also address whether the department's practices are inconsistent. It's not inconsistent because they're applied to different problems. Iterated dominance is a tool for analyzing games, while dominant-strategy mechanisms are about robustness. Each has its place. The user might be worried about teaching conflicting messages, but it's about different applications.

