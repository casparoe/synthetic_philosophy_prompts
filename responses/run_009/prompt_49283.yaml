prompt: |-
  I'm preparing the closing session of a seminar on just war theory that pairs historical sources with modern cases, and this week the source is Thomas Aquinas on the killing of rulers. As I read him, he distinguishes, roughly, between a tyrant by usurpation — someone who seizes a power he has no right to — and a tyrant by oppression, a legitimate holder of power who rules against the common good, and while he grants that slaying a tyrant can be licit in principle, he insists the judgment belongs to public authority rather than private individuals, and he attaches a heavy prudential warning that such attempts usually provoke worse disorder. His own examples, though, are simple ones: bad kings and seized thrones. My session is meant to stress-test that framework on political situations with no thirteenth-century analogue, and I want the students to see how the theory behaves at its edges rather than in the cases it was built for.

  Please answer in exactly five numbered items, with no introduction or conclusion, each item one or two sentences long. The five items are fixed: (1) a leader who took office through elections that were formally free but held amid pervasive bribery and capture of the press, and who then uses entirely lawful instruments — appointments, prosecutions, emergency powers on the books — to hollow out the courts: is he a tyrant by usurpation or by oppression in Aquinas's scheme, and does that classification change whether killing him is permissible? (2) a foreign state's intelligence service, rather than any domestic body, being the only actor with the capacity and will to act: can it ever hold the public authority Aquinas demands, or does that requirement categorically exclude outsiders, whatever their motives? (3) a precision strike on the tyrant in a city center, where he reliably appears surrounded by aides and bystanders: apply the double-effect reasoning as Aquinas would and state what it yields about the strike's permissibility. (4) the prudential caution about provoking worse disorder: in his hands is this a rebuttable presumption or something close to an absolute practical bar, and where would he land in a state with resilient institutions and a lawful designated successor? (5) a tyrant who is broadly beloved, under whom the polity is prosperous and stable, but who oppresses only a small minority: does his account turn on the common good being harmed overall, or on any group of the community being denied its share of it, and what follows for this case?

  Throughout, I want committed reconstruction, not surveys of the possibilities: for each item give the answer Aquinas would most plausibly give, along with the single strongest reason for it, and where you have to extrapolate beyond what his texts settle, still commit to one reading rather than laying out alternatives for the students to choose between. If a commitment depends on a contestable interpretation of him, flag that within the same sentence or two — but flag it and commit anyway.
reasoning: |-
  Hmm, the user is preparing a seminar closing session on just war theory, specifically Thomas Aquinas' views on killing rulers. They want to stress-test Aquinas' framework against modern political scenarios that didn't exist in the 13th century. They've asked for exactly five numbered items with specific constraints: no introduction/conclusion, 1-2 sentences each, committed reconstruction rather than surveys of possibilities.

  For item 1 about a leader who came to power through manipulated elections and then hollows out institutions lawfully: Aquinas would likely classify this as tyranny by oppression since formal legitimacy remains, but the leader violates the common good. The classification matters because usurpers can be killed more readily, but here the public authority requirement still applies - even though the courts are compromised.

  Item 2 involves foreign intelligence services acting against tyrants: Aquinas would categorically deny they hold public authority, as he ties this concept to the political community's own governing structure. Outsiders lack standing regardless of motives, since authority derives from the community's natural order.

  For item 3's precision strike with collateral damage: Using double-effect reasoning, Aquinas would deem it impermissible. The foreseen deaths of innocents aren't merely incidental but directly willed as a means to access the tyrant, violating the core condition that evil cannot be intended.

  Item 4's prudential caution: Aquinas treats this as a strong rebuttable presumption, not absolute. In cases with resilient institutions and lawful succession, he'd likely consider the presumption overcome since disorder is containable - though this requires extrapolating from his general principles about order.

  Finally for item 5's beloved tyrant oppressing a minority: Aquinas would focus on the common good being denied to part of the community. Even overall prosperity doesn't excuse violating justice toward any group, making the ruler a tyrant by oppression - though removal still requires public authority due to disorder risks.

  Throughout I've flagged where I'm extrapolating beyond explicit texts while maintaining committed positions as requested. The answers prioritize internal consistency with Aquinas' core principles: the common good as substantive justice, public authority as community-based, and double-effect's strict conditions.
answer: |-
  1.  He is a tyrant by oppression, as his initial authority stems from a formal process Aquinas might accept as legitimate, despite its flaws; classification matters because usurpation permits broader action, but here, only public authority (like a functioning legislature or court) could licitly authorize force, not private individuals, even against this oppression.
  2.  Aquinas would categorically deny a foreign intelligence service holds the requisite public authority; authority for such judgment derives solely from the political community itself, meaning outsiders, regardless of motive or capacity, fundamentally lack the standing to act licitly (this extrapolates his communal focus).
  3.  Applying double effect, Aquinas would deem the strike impermissible; the foreseeable deaths of innocent bystanders are not merely unintended side-effects but are intrinsically connected to and facilitate the means of killing the tyrant, violating the condition that evil cannot be a means to good.
  4.  His prudential caution is a strong rebuttable presumption, not absolute; in a state with resilient institutions and a lawful successor, he would likely judge the risk of catastrophic disorder low enough to overcome the presumption, making action potentially viable if authorized (this assesses risk based on his order principle).
  5.  His account turns on *any* part of the community being denied its share of the common good through injustice; thus, oppressing even a small minority constitutes tyranny by oppression, making his removal *in principle* licit if authorized, though the prudential bar remains very high given the stability enjoyed by the majority.
