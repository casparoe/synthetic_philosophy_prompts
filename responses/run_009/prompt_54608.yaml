answer: |-
  Right, let’s hack through this thicket properly. I’ve been mulling it over too, and the decomposition feels essential because, as you say, the tree dominates the number. My credence for the main claim – *that the badness-for-the-subject of any given pain is entirely constituted by its aversiveness* – lands at roughly **0.35**. Not high, but not dismissible either. Crucially, it’s brittle; nudge the branches and it crumbles or solidifies. Here’s the honest decomposition, British spelling and all, woven in:

  First, the lynchpin: **the accuracy of asymbolia reports (P1)**. My credence here is **0.8**. It’s high, but not maximal. The standard story – preserved sensory-discriminative aspects (localisation, intensity reports), absent motivational-affective (distress, withdrawal urge), often with bizarrely incongruent affect (smiling) – feels robust across multiple case studies and fits the neuroanatomy (insula/cingulate lesions disrupting the ‘suffering’ network whilst sparing S1/S2). The counterarguments feel weaker: ‘flattened affect’ usually bleeds into other domains, which isn’t consistently reported; ‘stoic reporting’ doesn’t explain the *genuine* lack of withdrawal or the *positive* affect sometimes observed. The biggest wobble is whether their ‘pain’ label reflects genuine *phenomenology* or just preserved semantic knowledge. "It feels like pain, sharp, here, *but it’s not bothering me*" – that introspective report feels phenomenologically loaded, not just descriptive. If someone devised a rigorous phenomenological interview probing qualia structure directly, bypassing the word ‘pain’, it could shift this. But absent that, **0.8** seems fair. This term moving to 0.9 or 0.7 wouldn't shock me, but it's not the most volatile branch.

  Conditional on P1 being true, we hit the core philosophical leap: **the right theory of wellbeing makes badness track aversiveness, not the raw feel (P2)**. My credence here is **0.6**. This is where the flip-flop lives. Desire-based theories (or dislike-based, or motivational oomph theories) slot in neatly: the badness *just is* the frustration of the aversion (or the aversion itself). Pain asymbolia is a clean existence proof of sensation divorced from aversion, hence divorced from badness. Hedonism, especially reductive versions identifying valence directly with pleasantness/unpleasantness qualia, struggles. It either has to deny the reports (which we’ve tentatively accepted via P1), posit a mysterious ‘intrinsic badness’ qualia that’s somehow absent in asymbolics despite intact sensation, or become circular (defining the unpleasantness *as* the aversion). The attraction of P2 is its parsimony with the asymbolia data. But the wobble comes from the nagging sense that *in normal experience*, the sensation and aversion feel fused – phenomenally inseparable. Is that fusion essential? Or just contingent? A good experiment, like your volunteer one dialling down aversiveness pharmacologically or via neurofeedback while keeping intensity high, is crucial. If subjects consistently *prefer* or are *indifferent* between high-intensity/low-aversiveness ‘pain’ and mild ordinary pain (which they rate as subjectively worse), that would rocket P2 towards **0.8** or higher. If they still find the intense-but-not-aversive sensation *bad*, even mildly, P2 plummets. Morphine reports ("still there but doesn't bother me") feel like the *same phenomenon* as asymbolia, just pharmacologically induced – they strengthen P1 and are consistent with P2, but don't decisively prove it on their own. **P2 is the most sensitive term**. Its movement dominates the final number.

  Then there’s the **verbal dispute escape hatch (P3)**: “It’s not *pain* anymore without the aversiveness.” My credence this dissolves the issue is only **0.3**. It feels like special pleading. We happily call intense, purely sensory phenomena (like very loud noise or bright light) ‘painful’ or analogous *because* they are aversive. If asymbolics report identical *sensory* qualities to their pre-lesion pain, localise it correctly, and call it ‘pain’ based on those qualities, insisting it’s not *really* pain seems to move the goalposts purely to save a theory. The concept ‘pain’ likely has a prototype structure where both sensory intensity and aversiveness are central features; losing one might make it a borderline case, but not clearly a different category. If future work showed asymbolics fundamentally misdescribing the *sensory* character (e.g., confusing it with intense cold or pressure), P3 could rise. But based on current reports, **0.3** feels generous to the objector.

  **Combining:** The main claim essentially requires P1 AND P2 AND NOT(P3). They aren’t perfectly independent, but near enough for rough credence calculus. P1 (~0.8) and NOT(P3) (~0.7) together give a base of ~0.56. Multiplying by P2 (0.6) lands at **~0.34**, rounded to **0.35**. The lack of independence (e.g., if P1 is true, P3 feels less likely) might nudge it up a smidge, but not enough to hit 0.4. As said, P2 is the lever. A finding boosting P2 to 0.8 would push the final credence to ~0.45; dropping P2 to 0.4 pulls it down to ~0.22.

  **On your snags:**  
  *   **False Dichotomy?** A fair nudge. ‘Aversiveness’ likely isn’t monolithic – it might involve immediate urge-to-withdraw, longer-term dread/fear, cognitive appraisal. ‘Sensory intensity’ might modulate aversiveness non-linearly. And yes, the separation might *only* occur cleanly in pathology. But your core proposition – *badness requires aversiveness* – still stands. Even if aversiveness has parts, the *absence* of all parts (as in asymbolia) seems sufficient to demonstrate that sensation sans aversion isn't bad. The proposition holds as stated for the stress test.
  *   **Moral Stakes (Crustaceans/AI):** Quarantine it. Absolutely. It’s a crucial *consequence*, but feeding it back into the credence for the factual claim about human pain phenomenology and badness is textbook motivated reasoning. Our discomfort about crustaceans shouldn’t make us deny the possible reality of pain without suffering in humans, or vice versa. Let the chips fall where they may on the facts, *then* wrestle with the ethics. My **0.35** tries to ignore the looming spectre of ethical recalibration.

  So, there it is. **0.35**, built on **P1=0.8, P2=0.6, P3=0.3**, combined multiplicatively with a slight fudge for non-independence. The number feels like thin ice over deep water – plausible but easily shattered by better data, especially that crucial experiment dialling down aversion in healthy volunteers. If those subjects shrug off intense sensation without distress *and* don’t rate it as subjectively bad compared to milder aversive states, my credence in the aversiveness-only view would surge. If they still find it intrinsically unpleasant, even without distress, it collapses. The ball, as they say, is in the empiricist’s court. Keep chewing; I’ll be doing the same.
