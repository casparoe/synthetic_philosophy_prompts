  7. **Should we prioritize reducing wild insect suffering (e.g., via humane pesticides) over farmed insect welfare?**  
     - **A.** Yes—wild suffering is vast and neglected.  
     - **B.** No—focus on human-caused suffering (farming).  
     - **C.** Neither—insect welfare isn’t actionable yet.  

