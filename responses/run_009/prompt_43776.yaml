answer: |-
  Below is a decision tree designed to sort readers into their position on insect welfare based on concrete, literature-free questions. It isolates key philosophical splits: how to handle uncertainty about insect sentience, moral weight per individual, scope of concern (farmed vs. wild insects), and practical implications. The tree uses seven questions (with early exits for skeptics) and minimizes overlap between leaves. Positions are named only if they map to established views; unnamed leaves are flagged with explanations. 

  ### **Decision Tree**
  *(Readers answer sequentially; follow the path based on your choice)*

  1. **You’re reviewing a mosquito-abatement program that kills billions of larvae annually. Proponents argue it reduces net suffering (since wild insects likely die painfully anyway). Critics say killing is wrong without consent. What’s your stance?**  
     - **A.** Continue the program—it likely reduces net suffering.  
     - **B.** Stop the program—killing sentient beings is unacceptable, even if their lives are bad.  
     - **C.** Stop the program—even if their lives are net-negative, we can’t risk being wrong (precautionary principle).  
     - **D.** Continue—insects probably aren’t sentient, so it doesn’t matter.  

     → *If D, go to Q2. If A, B, or C, go to Q3.*  

  2. **Evidence shows insects respond to anesthetics/analgesics (e.g., avoiding harm after painkiller exposure). How does this affect your view?**  
     - **A.** This suggests a high probability (>50%) of sentience—I take it seriously.  
     - **B.** It’s still ambiguous, but even a 1–20% chance matters given the scale of insect suffering.  
     - **C.** Unconvinced—the evidence is too weak to cross a meaningful threshold (e.g., <10% chance).  

     → *If C, you’re a **Threshold Skeptic**. Exit tree.  
     → If A or B, go to Q3.*  

  3. **A project can reduce crowding on a cricket farm, improving individual welfare but decreasing total crickets raised (and thus total "lives"). Do you support it?**  
     - **A.** Yes—welfare gains per individual outweigh the loss of total lives.  
     - **B.** No—more lives are better if they’re net-positive, or we can’t be sure.  
     - **C.** Support it, but only because it might reduce suffering—not because I value "more lives."  

     → *If A or C, go to Q4. If B, go to Q5.*  

  4. **Would you prioritize funding research on insect sentience over directly reforming farms?**  
     - **A.** Yes—we need certainty before acting at scale.  
     - **B.** No—act now using precautionary principles.  
     - **C.** Depends on cost-effectiveness, but research is high-value.  

     → *Go to Q6.*  

