  #### **Notes on Leaf Placements**  
  - **Confidence**: ~85% in mappings. The tree separates core disagreements cleanly, but real-world views often blend elements.  
  - **Least Confident Leaf**: *Deontological Precautionist* (Q1C path). Some may hold this view provisionally without absolutism.  
  - **Unseparated Pairs**: The tree struggles to distinguish "risk-averse expected value" (e.g., probability weighting) from "high probability" views in practice (Q2A vs. Q2B). These often converge on similar actions (hence combined in leaves).  
  - **Why Unnamed?** Positions are unnamed if they’re: (1) incoherent (e.g., weighting scales with neuron count but ignoring brain complexity evidence), (2) ethically unattractive in dominant frameworks (e.g., "antinatalist-leaning"), or (3) unexplored in literature.  

  ### **Practical Upshot Summary**  
  - **Threshold Skeptics/Vertebrate Chauvinists**: Ignore insect welfare; focus on vertebrates.  
  - **Research-First Pragmatists**: Fund studies (e.g., anesthesia response, behavior).  
  - **Farmed-Insect Advocates**: Reform farms (reduce crowding, improve slaughter).  
  - **Wild-Suffering Utilitarians**: Support humane pesticides or population management.  
  - **Insect Egalitarians**: All of the above, prioritizing scale.  
  - **Deontological Precautionists**: Oppose killing-based programs (e.g., abatement).  

