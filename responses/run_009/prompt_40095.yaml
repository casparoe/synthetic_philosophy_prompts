  The deliberative democracy faction will pounce on my vagueness about "contestable conceptions." They'll demand examples of what specific values a test might encode. Should preempt this by naming concrete cases during the presentation: prioritizing economic literacy over climate justice awareness, or favoring institutional knowledge over lived experience. 

  Ah, the Condorcet problem is delicate. If the math shows epistocracy improves decision quality, my normative argument crumbles. Must emphasize that jury theorems assume (a) binary choices and (b) voter independence—both unrealistic in politics. But the mathematician will see this as dodging; better to admit epistemic benefits exist in theory while arguing they're unattainable in practice. 

  The landmine question? Definitely the one about epistocracy within institutions. If I admit the Supreme Court is epistocratic, I imply competence thresholds can work—just not for voting. Need a clear distinction: judicial competence is narrowly defined (legal expertise), while civic competence is irreducibly plural. 

  Biggest concession: Knowledge does improve decisions. But democracy values more than just output efficiency—it's also about ownership of collective mistakes. That last point might resonate with the deliberative faction if framed as democratic humility.
answer: |-
  Here’s a strategic Q&A sheet tailored to your PPE audience, anticipating key objections, prioritizing damage potential, and preparing nuanced replies. Focus on preempting high-risk critiques while conceding weaker ground.

  ---

  ### **Q&A Sheet: Defending Universal Suffrage Against Epistocracy**  
  *Core Thesis: Competence tests embed contested values, shifting—not resolving—political conflict.*

  ---

  ### **I. High-Damage Objections (Prioritize These)**  
  *(Ordered by potential to undermine core argument)*

  1. **Libertarian Economist Objection**  
     *Vocabulary:* "Your argument ignores dynamic incentives. A public competency test would *reveal preferences* for political knowledge, creating a market for civic education. Voters acquire costly information only if it yields utility; weighting votes raises ROI, correcting rational ignorance. You’re dismissing mechanism design."  
     **Reply:** "True, tests incentivize learning—but *what* they incentivize depends on the test designer. Prioritizing economics over ethics (e.g., testing GDP metrics but not Rawls’ Veil of Ignorance) steers civic engagement toward technocratic values. This isn’t neutral efficiency; it’s state-sponsored cultural entrepreneurship."  
     **Soft Spot:** Concedes tests *can* boost knowledge. Mitigate by stressing: "Even optimal incentives can’t resolve whose 'competence' counts—see next objection."  

  2. **Condorcet Mathematician Objection**  
     *Vocabulary:* "Under Condorcet’s theorem, if voters are *more likely than random* to be correct (*p > 0.5*), adding votes from high-competence agents monotonically increases decision accuracy. Your 'contestable conception' point is normatively valid but ignores welfare gains from epistemic optimization."  
     **Reply:** "Condorcet assumes a *binary choice* with a *definitive correct answer*. Politics involves multidimensional tradeoffs (e.g., liberty vs. equality) with no 'correct' outcome. Further, tests measuring 'competence' on contested issues (e.g., 'Is inflation primarily monetary?') bake in ideological assumptions, violating voter independence."  
     **Soft Spot:** Doesn’t refute epistocracy’s *statistical* edge in clear-cut scenarios. Concede: "For factual referendums (e.g., 'Is CO₂ a greenhouse gas?'), epistocracy *may* help—but most political choices aren’t this."  

  3. **Deliberative Democrat Objection**  
     *Vocabulary:* "You reduce citizenship to ballot-casting. Deliberative democracy requires *public reasoning*, which competence tests could strengthen by selecting participants better equipped for discursive justification (Habermas). Why conflate voting with deeper civic virtue?"  
     **Reply:** "Granted, deliberation benefits from expertise. But epistocratic tests *replace* inclusive deliberation with exclusionary gates. If we value reciprocal justification (as you do), restricting participants to a state-approved 'competent’ class undermines the legitimacy of outcomes. The test itself becomes a site of strategic contestation."  
     **Soft Spot:** Avoids defining "reciprocal justification" thresholds. Preempt by citing real-world exclusion: e.g., literacy tests historically disenfranchised Black deliberators.  

  ---

  ### **II. Medium-Damage Objections**  
  *(Counter decisively but concisely)*

  4. **Political Theorist Objection**  
     *Vocabulary:* "Aren’t *all* voting systems 'contestable'? Universal suffrage operationalizes a conception of equality you find less problematic—but that’s a prior normative commitment, not a neutral fact."  
     **Reply:** "Absolutely. But universal suffrage minimizes *additional* contestation by avoiding state-defined competence. We dispute equality’s meaning, but excluding citizens requires justifying *disqualification*—a heavier burden epistocrats haven’t met."  
     **Soft Spot:** Admits normative foundations are contested. Strengthen with: "Disqualification risks harm; equality defaults to inclusion."  

  5. **Economist Objection**  
     *Vocabulary:* "If voters are rationally ignorant, why not outsource to the informed? Markets delegate to experts (e.g., pilots over passengers)—why can’t politics?"  
     **Reply:** "Market delegation is *voluntary* and *reversible* (I can choose another airline). Political power is coercive and monopolistic. Epistocracy makes expertise compulsory, stripping agency from those deemed 'incompetent.'"  

  ---

  ### **III. Concessions to Make Upfront**  
  *(Preempt credibility loss by ceding defensible ground)*  
  - **Concede:** "Yes, universal suffrage tolerates incompetence. Some voters *are* ignorant or irrational."  
  - **Concede:** "Epistocracy *might* improve certain outcomes if competence were measurable neutrally—but it isn’t."  
  - **Concede:** "Deliberative bodies (e.g., juries) benefit from competence screenings. But scaling this to mass democracy changes the stakes."  

  ---

  ### **IV. The Landmine Question (Hope Nobody Asks)**  
  **Question:** *"If competence tests are illegitimate for voting, why do we accept them for high-office eligibility (e.g., age, citizenship, residency)? Doesn’t this prove some gatekeeping is necessary?"*  
  **Why It’s Deadly:** It forces you to distinguish *minimal threshold qualifications* (preventing chaos) from *graded political weight* (violating equality).  
  **If Asked:**  
  > "Minimal thresholds (e.g., age 18) are *inclusionary floors* based on broadly acceptable criteria (capacity for responsibility). Epistocracy creates *exclusionary ceilings* using contested expertise metrics. One protects functional democracy; the other stratifies it by disputed notions of 'merit.'"  
  **Vulnerability:** Hardline egalitarians reject *all* voting restrictions. Your distinction risks seeming arbitrary.  

  ---

  ### **Strategic Summary**  
  - **Win over deliberative democrats** by framing epistocracy as anti-discursive.  
  - **Neutralize economists** with coercion/reversibility arguments.  
  - **Flank the mathematician** by attacking Condorcet’s political applicability.  
  - **Preempt the landmine question** by pre-defining "minimal thresholds" in your talk.  

  Good luck—your friend’s wavering suggests this argument bites deeper than abstract equality claims. Anchor in the *institutional instability* of contested tests.
