prompt: |-
  I am a graduate student in philosophy of physics, and I have reached the chapter of my thesis where I have to take a position on the hole argument. My situation is awkward: my supervisor, who is broadly a structural realist, treats the argument as the end of the story for substantivalism about spacetime, while a senior student in my program has spent two years defending a version of sophisticated substantivalism on which the manifold's points are individuated only via the metric and matter fields they carry. My own tentative credence that the hole argument, once properly formulated, gives us a decisive reason to reject any view deserving the name of substantivalism is about 0.5, which is a way of admitting I don't understand my own uncertainty. I'd like your actual credence on that proposition, and, more importantly, a decomposition of it rather than a bare number. The decomposition should at least address: whether Leibniz equivalence — the claim that diffeomorphically related models of general relativity represent the same physical situation — is something we should accept, and on what grounds (empiricist scruples, the objectivity of the theory's own resources, or something else); whether accepting it already amounts to abandoning substantivalism or whether the sophisticated substantivalist can coherently hold that spacetime points exist while denying they have identity independent of what they carry; whether the determinism strand of the argument does independent work or merely dramatizes the underdetermination; and whether the fact that the argument can be reconstructed in a diffeomorphism-invariant reformulation of Newtonian gravitation tells us it is really a lesson about formulations of theories rather than about spacetime itself. If you think some of these terms don't belong, or that I have left out a load-bearing one — say, whether the haecceitism the argument forces on the naive substantivalist is objectionable in its own right or only in combination with something else — substitute your own and say why.

  A few constraints on the answer I want. First, please assign a rough probability to each term in your decomposition, with a sentence of justification apiece, and then show how they combine into your overall number, so that I can see whether my 0.5 and your figure diverge because of one term or because we are carving the question differently. Second, tell me which single term your overall credence is most sensitive to, and what argument or development would move that term the most — for instance, whether a precise and non-question-begging statement of sophisticated substantivalism, one that neither collapses into structural realism nor smuggles primitive identity back in, would change your number, and by how much. Third, resist the urge to conclude that the dispute is merely verbal: my examiners will not accept that, and frankly neither will I, since the two sides do seem to disagree about whether there is a fact of the matter about which manifold point a given physical event occupies. I should say that I don't need references or a literature review; I have the literature. What I need is your reasoning laid out so its weak points are visible. If it helps you calibrate, I'd also be curious whether you think my supervisor and my fellow student most plausibly disagree about the truth of Leibniz equivalence itself, about whether sophisticated substantivalism is a genuine third way or a capitulation in disguise, or about something upstream of both.
