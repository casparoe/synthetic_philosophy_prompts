  ## Dishwater Logic

  **One:**  
  The sink is crusted, greasy, cold –  
  a proof in porcelain. You shrug.  
  I state the fact the basin told:  
  **You didn't wash the dishes.**  
  (That judgment stands, a solid block,  
  condemning idleness like grime.)  

  **Two:**  
  Now, reason builds its careful lock:  
  **If you didn't wash the dishes,**  
  then water hasn't touched this spoon,  
  this plate retains its smear of noon.  
  (We grant the *if*, step back, observe  
  the chain of consequence unswerved.)  

  **Three:**  
  The *if* was true. The logic flows –  
  the basin's evidence still shows.  
  Therefore, the consequence arrives,  
  clear as the drying rack survives:  
  **You didn't wash the dishes**.  
  (Conclusion drawn, necessity’s cold breath.)  

  **Four:**  
  But pause... Here hangs the ghostly word  
  in different air. First, anger stirred  
  (a blunt demand, a charged command).  
  Then, neutral gear in logic's land  
  (a stepping stone, devoid of heat).  
  Then, back again – the same defeat  
  pronounced, yet now just logic's fruit.  

  **But what if the dishes were washed?**  
  The counter claims. The sentence hushed  
  still waits: **You didn't wash the dishes**.  
  Same syllables, a changeling dressed  
  in shirt, then shroud. This fragile thread  
  of meaning, taut above the dread  
  abyss – *how does one sentence wear*  
  *accusation, thought, and doubt?*  
  The words don't shift. They simply stare.  

  ---

  **Why this works for your seminar:**

  1.  **Concrete Moral Sentence:** "You didn't wash the dishes" – a domestic failing, norm-governed, carrying implicit blame/disapproval.
  2.  **Three Appearances:**
      *   **Stanza 1 (Asserted):** "...I state the fact...: *You didn't wash the dishes.*" (Direct moral condemnation).
      *   **Stanza 2 (Conditional Antecedent):** "*If you didn't wash the dishes,*" (Hypothetical premise for reasoning).
      *   **Stanza 3 (Asserted Conclusion):** "Therefore...: *You didn't wash the dishes.*" (Logical consequence).
  3.  **Modus Ponens Enacted:**
      *   **Premise 1 (Conditional):** *If P, then Q.* (Stanza 2: If ~washed, then evidence remains).
      *   **Premise 2 (Assertion of Antecedent):** *P.* (Stanza 1/Conclusion: ~washed).
      *   **Conclusion (Assertion of Consequent):** *Therefore, Q.* (Stanza 3: Evidence remains / implicitly confirms ~washed *again*). The poem *shows* the inference happening across stanzas 1-3.
  4.  **Sense Invariance Made Visible:** The *exact* sentence "You didn't wash the dishes" is used in premise 2 and the conclusion. The validity of the inference from Stanza 2 + Stanza 1/3 to Stanza 3 *depends entirely* on "P" meaning the same thing in both its asserted and conditional-antecedent roles. The poem's structure forces this recognition.
  5.  **Expressivist Prediciment Revealed (Not Stated):** Stanza 4 ("But pause...") explicitly contrasts the *functional roles*:
      *   Anger/Command (Stanza 1 - expressive act).
      *   Neutral Premise (Stanza 2 - truth-apt component).
      *   Logical Conclusion (Stanza 3 - truth-apt).
      It highlights the *question*: How can identical words perform such different acts (expression vs. hypothesis/truth-bearer)? The final lines ("Same syllables...", "*how does one sentence wear...*", "The words don't shift") starkly present the puzzle without solving it. The negation ("But what if the dishes were washed?") also implicitly uses the *same proposition* under challenge.
  6.  **Accuracy & Neutrality:** The logic is valid modus ponens. The poem accurately depicts the Frege-Geach challenge for expressivism (how can an expressive act *also* be a truth-apt proposition in embeddings?) without endorsing realism or quasi-realism. It simply makes the problem vivid.
  7.  **Accessibility:** Uses a relatable scenario. The structure clearly separates the three uses. The final stanza explicitly asks the core question the students need to grapple with, priming them for the quasi-realist reply (which must explain how the *same* state of mind/attitude can both express disapproval *and* constitute a truth-evaluable proposition in different contexts).
