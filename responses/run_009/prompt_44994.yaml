  ### Activity Design: Bertrand's Chord Paradox Discovery

  #### **Overview**
  - **Goal:** Students discover that "random chord" is ambiguous, leading to different probabilities (1/2, 1/3, 1/4) depending on the physical procedure used.
  - **Time:** 90 minutes  
  - **Students:** 18 (divided into 3 groups of 6)  
  - **Key Concepts:** Principle of indifference, parametrization, ambiguity in "random" probabilities.  

  ---

  #### **Materials (Per Group)**
  - **Circle:** A large circle (radius ~30 cm) drawn on poster paper or with chalk on the floor. Mark the center and circumference clearly.  
  - **Equilateral Triangle Reference:** Inscribe an equilateral triangle in the circle; mark one side as the reference chord (length = \(\sqrt{3} \times \text{radius}\)).  
  - **Group-Specific Randomization Tools:**  
    - **Group 1 (Random Endpoints):** 2 spinners (0°–360°), protractor, string.  
    - **Group 2 (Random Radial Point):** 1 spinner (0°–360°), 1 six-sided die, ruler.  
    - **Group 3 (Random Midpoint):** 2 six-sided dice, ruler, calculator (for \(\sqrt{u}\) approximation).  
  - **Recording Sheet:** Tally chords as "long" (longer than reference) or "short".  
  - **Common Items:** Pencils, extra paper, measuring tape/string for chord length.  

  ---

  #### **Activity Flow**  
  **1. Introduction (10 min)**  
  - Pose the question: *"What’s the probability that a random chord is longer than the side of an inscribed equilateral triangle?"*  
  - Avoid defining "random chord"—let students discover ambiguity.  
  - Split students into 3 groups. Assign each a method (without revealing differences).  

  **2. Group Procedures (30 min)**  
  Each group generates 30 chords using their method, tallies "long" chords, and computes the fraction.  
  - **Group 1: Random Endpoints**  
    - **Procedure:**  
      1. Spin spinner 1 to get angle \(\alpha\) (point A).  
      2. Spin spinner 2 to get angle \(\beta\) (point B).  
      3. Draw chord AB.  
      4. Measure length: if > reference chord, tally "long".  
    - **Randomization:** Spinners simulate uniform points on circumference.  
    - **Expected Fraction:** \(\frac{1}{3}\) (chord long if central angle > 120°).  

  - **Group 2: Random Radial Point**  
    - **Procedure:**  
      1. Spin spinner to pick a radius (angle \(\theta\)).  
      2. Roll die: result \(d\) (1–6). Distance from center = \(\frac{d-1}{5} \times \text{radius}\).  
      3. Draw chord perpendicular to radius at this point.  
      4. Tally "long" if \(d = 1, 2, 3\) (i.e., distance < half-radius).  
    - **Randomization:** Die + spinner simulate uniform radius and uniform distance.  
    - **Expected Fraction:** \(\frac{1}{2}\).  

  - **Group 3: Random Midpoint**  
    - **Procedure:**  
      1. Roll two dice: results \(a, b\) (1–6).  
      2. Compute \(u = \frac{6(a-1) + (b-1)}{35}\) (number in 0–1).  
      3. Distance from center = \(\text{radius} \times \sqrt{u}\).  
      4. Draw chord with this midpoint (perpendicular to radius).  
      5. Tally "long" if \(u < 0.25\) (i.e., midpoint in inner circle).  
    - **Randomization:** Dice simulate uniform midpoint in disk.  
    - **Expected Fraction:** \(\frac{1}{4}\).  

  **3. Reporting and Punchline (10 min)**  
  - Groups report fractions (e.g., Group 1: ~0.33, Group 2: 0.50, Group 3: 0.25).  
  - **Reveal the paradox:** All did "random chord", but got different results.  

  **4. Debrief (35 min)**  
  - **Map Procedures to Parametrizations (10 min):**  
    | **Group** | **Physical Procedure** | **Parametrization** | **Probability** |  
    |-----------|------------------------|---------------------|-----------------|  
    | 1 | Random endpoints | Uniform on circumference | \(\frac{1}{3}\) |  
    | 2 | Random radius + point | Uniform on radius | \(\frac{1}{2}\) |  
    | 3 | Random midpoint | Uniform in disk | \(\frac{1}{4}\) |  
    - **Key Insight:** "Random" is defined by *how* you randomize (parameters matter!).  

  - **Physical Process Fixes the Answer (10 min):**  
    - **Example:** Dropping a 10-meter straw on a 1-meter circle.  
      - *Why it fixes the probability:* The straw’s center and orientation define a unique parametrization (equivalent to Group 1, giving \(\frac{1}{3}\)).  
    - **Takeaway:** Language ("random chord") is ambiguous; physical process resolves it.  

  - **Invent a Fourth Procedure (10 min):**  
    - **Task:** Groups brainstorm a new method (e.g., "choose chord length uniformly between 0 and diameter").  
    - **Example:**  
      - Roll die for length \(L = \frac{d}{6} \times \text{diameter}\).  
      - Chord is long if \(L > \text{reference}\).  
      - **Probability:** \(\frac{2 - \sqrt{3}}{2} \approx 0.134\) (new fraction!).  
    - **Discussion:** "Which fraction is *correct*?" → None! Depends on the procedure.  

  - **Principle of Indifference (5 min):**  
    - **Lecture:** The principle ("no reason to favor one outcome") is silent on *which parameters* to apply indifference to.  
    - **Conclusion:** Probability requires a well-defined sample space and measure—no "THE" probability without context.  

  ---

  #### **What Will Go Wrong (and Solutions)**  
  1. **Straw-Dropping Not Uniform (Group 1):**  
     - **Issue:** Dropping physical straws often favors chords near the center (not uniform endpoints).  
     - **Fix:** Use spinners to simulate endpoints—avoid physical bias.  

  2. **Clustering of Points (Group 1/2):**  
     - **Issue:** Students place "random" points unevenly on circumference/radius.  
     - **Fix:** Use spinners/dice for randomization; enforce blind spins/rolls.  

  3. **Fractions Don’t Separate (All Groups):**  
     - **Issue:** Small samples (e.g., <30 trials) cause noise (e.g., Group 1 gets 0.4, Group 3 gets 0.3).  
     - **Fix:** Use 30 trials/group; pool class data if needed. Pre-calculate expected ranges:  
       - Group 1: 8–12 long chords (theoretical: 10).  
       - Group 2: 13–17 long (theoretical: 15).  
       - Group 3: 5–10 long (theoretical: 7.5).  

  4. **Midpoint Calculation Errors (Group 3):**  
     - **Issue:** Students struggle with \(\sqrt{u}\) or dice math.  
     - **Fix:** Simplify to "\(u < 0.25\)" using dice lookup tables (e.g., \(a=1\) or \(a=2, b \leq 3\)).  

  ---

  #### **Limitations of the Activity**  
  - **Indifference-Principle Debate:** Students won’t intuit why parametrization choices are arbitrary—this requires a lecture.  
    - **Cover in Debrief:** Explain that indifference applies to parameters, not outcomes, and no "correct" choice exists without physical context.  
  - **Continuous vs. Discrete:** Dice/spinners approximate continuity; emphasize they’re "good enough" proxies.  
  - **Complex Fourth Methods:** Students may invent methods that reduce to existing ones (e.g., another \(\frac{1}{2}\) method). Use this to highlight non-uniqueness.  

  #### **Expected Outcome**  
  Students leave understanding that:  
  1. "Random" is ambiguous without a physical process.  
  2. Probability models depend on parametrization.  
  3. The principle of indifference is not a magic bullet—it shifts ambiguity to parameter choice.  

  This activity transforms a philosophical puzzle into an empirical, student-driven discovery!
