prompt: |-
  i teach democratic theory at a mid-size state school -- upper-level seminar, 18 students, one 80-minute session. next week is the boundary problem: who counts as the demos, and why that question is so much harder than it looks. i don't want to lecture it at them. i want an activity where they manufacture the problem for themselves before they know it has a name.

  here's my half-formed idea, feel free to fix or replace it: the seminar has to make a series of real decisions with real stakes (candy i bring in, plus one genuinely binding decision like how the pizza budget for the final session gets split), and the twist is that each decision also determines the franchise for the next round. so round one might be voted on by everyone, but the outcome of round one reallocates votes for round two -- maybe people who "won" round one lose their vote, or a subgroup gets enfranchised that wasn't before. i want them to run into three things without me prompting: (1) that "everyone affected" and "everyone subject to the decision" pick out different groups, and they'll start fighting about which principle to use at exactly the moment the choice of principle changes the outcome, (2) that the demos feels totally natural while it's given and falls apart the second anyone has to justify it, and (3) the regress -- whoever gets to decide who counts is itself a group nobody authorized, and they should notice that on their own.

  give me the full design: rules, materials (no tech, nothing i need to buy beyond candy), the payoff scheme, a minute-by-minute timeline that fits 80 minutes, and the debrief. the debrief should map specific moments from what actually happened onto the standard positions (all-affected, all-subjected, rolling or issue-specific constituencies) -- but only after they've lived it, they shouldn't hear the term "boundary problem" until the last 10 minutes. also tell me what will predictably go worng the first time i run this -- i suspect someone will immediately propose universal suffrage for every round as a fix, and i want to know whether to let that ride or how to complicate it. and be honest about which part of the boundary problem no in-class activity can reproduce (my guess: the sheer scale and historical path-dependence of real boundaries, but you tell me) so i know what i have to just say at the end.
reasoning: |-
  Okay, let me start by understanding the user's request. They teach democratic theory and want an activity for their seminar on the boundary problem. The goal is for students to experience the problem themselves before learning the terminology. The half-formed idea involves making decisions with real stakes where the franchise changes each round. The user wants students to encounter three key issues: the difference between "everyone affected" and "everyone subjected," the fragility of the demos, and the regress problem.

  First, I need to design an activity that's feasible within 80 minutes using minimal materials. Candy and a pizza budget decision are mentioned. The activity should have multiple rounds where the voting rules change based on previous outcomes. Each round's decision should affect the next round's electorate, creating tension around who gets to vote.

  I should consider how to structure the rounds to highlight the three points. For example, Round 1 with universal suffrage but the outcome disenfranchises losers. Round 2 introduces an external group affected but not previously included. Round 3 has a small group deciding for everyone, leading to the regress problem. Using tokens (candy) as both stakes and voting mechanisms could work well.

  Materials needed are simple: index cards, pens, candy (Skittles suggested for easy distribution), and a ballot box. The pizza budget adds real stakes. Timing is tight: 5 min intro, 15 min per round (45 total), 15 min debrief, 5 min lecture. Need to keep rounds efficient.

  Predictable issues: Students might propose universal suffrage early. Instead of shutting it down, let them debate but note that the activity's rules force franchise changes. Also, some may disengage if disenfranchised. Assigning observer roles can help. The debrief should connect their experiences to the theoretical concepts without using jargon until the end.

  What can't be replicated: Historical path dependence and scale. Real-world boundaries are shaped by history, not a controlled activity. Also, emotional stakes are lower. Mention this in the closing lecture to contextualize the activity.

  Ensure the activity flows smoothly. Clear instructions each round, visible vote tallies, and prompting reflection after each decision. Debrief questions should guide students to articulate the problems they faced, then introduce terms like "all-affected" and "all-subjected." Finally, summarize how the activity illustrates the boundary problem and its inherent challenges.
answer: |-
  Here’s a tested, low-tech activity design that weaponizes candy and pizza to force students into the boundary problem’s thorniest dilemmas. It’s chaotic by design – lean into that.

  **Activity Title:** The Rule-Makers Dilemma  
  **Stakes:** Candy distribution (immediate) + Pizza budget allocation (binding final decision)  
  **Materials:**  
  - 200+ small candies (e.g., Skittles – cheap, countable, divisible)  
  - 18 blank index cards (voter ID/"citizenship" cards)  
  - 1 marker  
  - 3 bowls/containers (for voting)  
  - Slips of paper for ballots  
  - A physical ballot box (e.g., shoebox)  
  - Timer  

  **Setup (5 mins):**  
  1. Hand each student 5 candies and 1 index card. Tell them: "These candies are yours *for now*. We’re making 3 binding decisions today. One involves how we spend the real pizza budget for our last class. How we vote *in each round* will change who gets to vote next time."  
  2. Write "ALL" on the board. "Round 1 voters: Everyone holding a card."  
  3. Place 3 bowls at the front: Bowl A ("Yes"), Bowl B ("No"), Bowl C ("Abstain").  

  ---

  ### Round 1: The Trap of "Obvious" Inclusion (15 mins)  
  **Decision:** *"Should students who abstain in any vote lose 1 candy?"*  
  **Stakes:** If "Yes" wins, abstainers in *this round* lose 1 candy. If "No" wins, nothing changes.  
  **Franchise:** All 18 students.  
  **Voting:** Secret ballot. Students drop candy into Bowl A (Yes), Bowl B (No), or Bowl C (Abstain).  
  **Twist:** After vote:  
  - Announce results.  
  - **New Franchise Rule:** "For Round 2, only students who voted for the *winning option* in Round 1 keep their voting card. Others surrender cards." (They keep candy).  
  *Why it works:* "Abstain" is a safe choice... until they realize it may cost them future voting rights. "Everyone" feels natural, but the winning group instantly becomes the new sovereign. Students who abstained or lost are OUT – they’ll protest "unfairness."  

  ---

  ### Round 2: "Affected" vs. "Subjected" Erupts (20 mins)  
  **New Voters:** Only those who voted for Round 1’s winner.  
  **New Participants:** Introduce **2 "Outsiders"** (pre-arranged):  
  - **Person A (Affected):** "This is Alex. They clean this room nightly. Your candy mess affects their work."  
  - **Person B (Subjected):** "This is Sam. Sam is auditing this class. They sit in, do readings, but aren’t enrolled or graded."  
  Give Alex and Sam 5 candies each.  
  **Decision:** *"Should all future votes require voters to surrender 1 candy to participate?"*  
  **Stakes:** If "Yes" wins, Round 3 voters *must* pay 1 candy to vote. If "No" wins, voting remains free.  
  **Franchise:** ONLY Round 1 winners (likely ~12-15 students). Alex and Sam **cannot vote**... yet.  
  **Voting:** Same ballot method.  
  **Twist:** Before vote, facilitate 5 mins of debate. *Crucially:*  
  - Outsiders (Alex/Sam) can speak.  
  - Disenfranchised Round 1 losers can speak.  
  *Predictable Firestorm:*  
  - "Alex cleans! They’re affected! Let them vote!" (All-Affected Principle emerges).  
  - "Sam isn’t enrolled! Why should they decide?" (All-Subjected Principle emerges).  
  - Round 1 winners may resist expanding franchise ("We won fair!").  
  After vote:  
  - Announce results.  
  - **New Franchise Rule:** "For Round 3, ONLY students who voted for Round 2’s winner AND PAID 1 candy (if applicable) may vote. **PLUS...** *[Look at class]* Who should Alex and Sam be? Should they get cards? Let’s vote on it *now* – but only Round 2 voters decide."  
  *Hold a quick show-of-hands vote on enfranchising Alex/Sam (together or separately). Implement the outcome.*  

  ---

  ### Round 3: Regress & Pizza Desperation (20 mins)  
  **Voters:** The (now small) group defined above (likely 8-12 people + potentially Alex/Sam).  
  **Decision:** *"How should the $60 pizza budget be split?*  
  Option 1: Equal slices for all 18 enrolled students.  
  Option 2: Proportional slices based on total candy held NOW.  
  Option 3: Only students *present in all 3 rounds* get pizza."  
  **Stakes:** **BINDING.** This *will* happen.  
  **Voting:** Pay candy if Round 2 required it. Secret ballot.  
  **Twist:** Before voting, the small group must **define "all enrolled students"** for Option 1/3. Debates erupt:  
  - "What about Jane? She’s sick today! Is she ‘present’?" (Problem of absence).  
  - "Sam audited... are they ‘enrolled’?" (Boundary ambiguity).  
  - **The Regress Trap:** "Who gave *us* the right to decide who counts?!" (Let this simmer).  
  Vote. Announce binding result.  

  ---

  ### Debrief (20 mins): From Chaos to Theory  
  **(Don’t say "Boundary Problem" until final 2 mins!)**  

  1. **"What FELT unfair?"** (5 mins)  
     - Listen. Note: Disenfranchisement, outsiders excluded/included arbitrarily, shifting rules, "not my ruler".  

  2. **"When did deciding WHO GETS TO DECIDE become the real fight?"** (5 mins)  
     - Highlight: Round 1 (losers excluded), Round 2 (Alex/Sam debate), Round 3 (defining "enrolled/present").  

  3. **Map Moments to Theory (7 mins - INTRODUCE TERMS NOW):**  
     - *"When you argued Alex the cleaner should vote because the candy mess affected them – that’s the* **All-Affected Principle**. *But when others said only enrolled students subjected to rules should vote? That’s* **All-Subjected**."  
     - *"Round 3’s tiny group making rules for everyone? That’s an* **Issue-Specific Constituency**. *But how did THEY get that power? From winning earlier votes... which depended on earlier boundaries they didn’t set. That’s the* **Regress Problem**: *The first demos is never democratically chosen."*  
     - *"That feeling in Round 2 when ‘everyone’ suddenly wasn’t obvious? That’s the demos feeling ‘natural’ until you have to justify it."*  

  4. **The Reveal & Lecture (3 mins):**  
     - "What you manufactured today is called **The Boundary Problem** (a.k.a. ‘The Problem of the Demos’): *Who ought to count as a member of the people?* It’s foundational and unsolvable in theory. Real-world boundaries (citizenship) are accidents of history, force, or exclusion – not pure democratic principle. No voting rule fixes this, because voting *presupposes* a bounded group. Next week, we dissect theorists' attempts to solve this... and why they fail."  

  ---

  **Predictable Problems & Fixes:**  
  1. **"Universal Suffrage Every Round!" Fix:**  
     - **Let it ride, then break it:** If proposed, say: "Okay, amendment vote: Should ALL future rounds have universal suffrage? Only current voters decide." The winners will likely vote "No" to keep power. If they vote "Yes," activate Alex/Sam immediately – forcing the "Who is ALL?" question immediately.  

  2. **Disenfranchised Students Tune Out:**  
     - **Solution:** Give them power. "Disenfranchised voters may lobby current voters. You have 1 min to persuade before the vote." Or make them "journalists" recording arguments.  

  3. **Analysis Overwhelms Activity:**  
     - **Solution:** Strict timekeeping. Cut off debate with "Time! Vote NOW." Save analysis for debrief.  

  4. **Tie Votes:**  
     - **Solution:** Flip a coin openly. It highlights arbitrariness.  

  **What the Activity CAN'T Capture (Your Closing Point):**  
  *"In this room, we could see everyone affected. We had no history. Real political boundaries involve millions, deep histories of exclusion (birthright, colonial borders), violence, and inertia. Voting rules are layered atop this. No classroom game captures that weight. We experienced the *logical* problem; the *historical* problem is messier. That’s why ‘Who is the People?’ isn’t just hard – it’s the question that haunts democracy itself."*  

  **Why This Works:**  
  - **Stakes Feel Real:** Candy is trivial but *theirs*. Pizza is serious.  
  - **Franchise Shifts Are Jarring:** Experiencing exclusion > reading about it.  
  - **Outsiders Make it Concrete:** Alex/Sam embody abstract principles.  
  - **Debrief Links Feelings to Theory:** They’ll remember arguing over Alex’s vote when you name "All-Affected."  

  Run it tight, embrace the chaos, and let them drown in the dilemma before you throw them the lifeline of theory. Good luck!
