answer: |-
  Here's a breakdown of the forum post's claims:

  **1. What the post gets right**
  The core point about the Gibbard–Satterthwaite (G-S) theorem is essentially correct: it proves that *no* non-dictatorial voting system (where voters express preferences over three or more alternatives) is immune to strategic voting ("manipulation" or "gaming"). Voters can sometimes achieve a better outcome by misrepresenting their true preferences. The observation that approval voting moves the strategic decision to "where to set the cutoff" also captures a genuine strategic consideration inherent in that method.

  **2. What's subtly off and what's wrong**

  *   **"Gibbard–Satterthwaite is basically Arrow's theorem restated for manipulation":**
      *   **Subtly Off:** It's understandable to group them as impossibility theorems about voting systems. Both highlight fundamental limitations.
      *   **Wrong:** They are fundamentally different theorems addressing distinct problems.
          *   **Arrow's Theorem:** Concerns the *aggregation* of individual *rankings* into a social ranking. It shows no system (under specific fairness criteria like Pareto efficiency and Independence of Irrelevant Alternatives) can always produce a rational (transitive) social *ranking* without being a dictatorship. **Focus:** Logical consistency of collective rankings.
          *   **G-S Theorem:** Concerns *strategy-proofness*. It shows no non-dictatorial system (where voters express preferences over outcomes) is immune to situations where a voter benefits by voting insincerely. **Focus:** Incentive compatibility for individual voters. While often applied to ranked systems, G-S applies much more broadly (including to approval voting). It's not a "restatement" but a different, complementary impossibility result focusing specifically on strategic incentives.

  *   **"it proves that every voting system where voters rank candidates is gameable":**
      *   **Subtly Off:** G-S *does* apply to voting systems based on rankings (like IRV, Borda, Plurality).
      *   **Wrong:** This phrasing implies G-S *only* applies to ranked systems, which is incorrect. The theorem applies to *any* non-dictatorial voting system where voters express preferences over outcomes, regardless of the ballot format. This includes cardinal systems like Score Voting and Approval Voting, as well as matching markets and auctions. Its scope is much wider than just ranked ballots.

  *   **"The only ranked method that can't be gamed is a dictatorship":**
      *   **Mostly Right (but scope is wrong):** This is the core conclusion of G-S. However, the "ranked method" qualifier is misleading (see above). The theorem states the *only* strategy-proof system is a dictatorship, regardless of ballot type.

  *   **"This is why the approval voting people are fooling themselves — their method is in the same boat, they've just moved the strategizing from ranking candidates to picking where to cut off your approvals.":**
      *   **Subtly Off:** He's correct that G-S *does* formally apply to Approval Voting, meaning it *is* theoretically manipulable. The observation that strategy manifests as choosing an approval threshold is accurate.
      *   **Wrong/Misleading:**
          1.  **"Fooling themselves":** Approval advocates don't claim it's perfectly strategy-proof (they understand G-S). They argue it's *less susceptible* to common, harmful forms of strategy *in practice* compared to FPTP or many ranked systems. The *nature, frequency, and impact* of strategic voting differ significantly between systems.
          2.  **"Same boat" is a vast oversimplification:** While both theoretically manipulable, the *strategic burden* differs. Ranking manipulation (e.g., burying a strong rival, compromising) can be complex and counter-intuitive. Approval's cutoff strategy, while real, is often argued to be simpler and less prone to catastrophic errors like accidentally electing your least favorite candidate (a risk in FPTP and sometimes IRV). Approval also avoids the "center-squeeze" pathology of some ranked methods.
          3.  **Ignoring FPTP's unique flaws:** FPTP isn't just manipulable; it suffers uniquely from vote-splitting/spoiler effects, poor expressiveness, and high rates of "wasted" votes. Approval mitigates these significantly. Calling approval no better than FPTP because both are manipulable ignores these crucial practical differences.

  *   **"And since it's an impossibility theorem, no amount of clever mechanism design fixes this, not for elections, not for auctions, not for matching markets either.":**
      *   **Subtly Off:** G-S *is* an impossibility theorem, meaning *perfect* strategy-proofness for non-dictatorial systems is impossible.
      *   **Wrong/Misleading:** This leap to "nothing can be fixed" is a profound misapplication of impossibility theorems.
          1.  **"Fixes this":** Impossibility theorems show perfection is unattainable. They *do not* say all systems are equally bad. Clever mechanism design absolutely *can* create systems that are *highly resistant* to manipulation, make manipulation harder to execute, reduce the *frequency* of profitable manipulation opportunities, or minimize the *harm* caused by manipulation compared to existing systems. Approval Voting is an attempt at such an improvement.
          2.  **Scope:** While G-S applies broadly, the *practical impact* of manipulability varies enormously across different contexts (elections vs. auctions vs. matching). Mechanisms like the Vickrey auction or Deferred Acceptance algorithm (for matching) are celebrated precisely *because* they achieve strong incentive properties *despite* impossibility theorems, making manipulation difficult or unprofitable in many practical scenarios. "Nothing can be fixed" is demonstrably false - huge improvements *are* possible.

  **3. Does his conclusion follow?**
  **No.** While the G-S theorem correctly establishes that no voting system is perfectly strategy-proof, **nothing in the theorem supports abandoning reform or defending FPTP.** The conclusion that "nothing can be fixed" ignores that systems vary drastically in their *degree* of manipulability and other critical flaws. FPTP suffers from uniquely severe problems like spoiler effects and poor representation that alternatives like Approval Voting demonstrably mitigate, even if perfect strategy-proofness remains impossible. Impossibility theorems define the limits of perfection, not the futility of improvement.

  **4. Corrected takeaway**
  Gibbard–Satterthwaite proves perfect strategy-proofness is impossible for any non-dictatorial voting system (including Approval and Score), not just ranked methods. Arrow's theorem is a distinct result about ranking aggregation. While all systems are manipulable in theory, the *practical likelihood, complexity, and consequences* of strategic voting differ significantly. Reform aims to find systems *less susceptible* to harmful strategy and *more expressive/representative* than FPTP, even if perfection is unattainable. Approval Voting represents one such attempt, trading off one form of strategy (ranking manipulation) for another (cutoff choice), often argued to be simpler and less damaging in common scenarios. Impossibility theorems highlight necessary trade-offs, not hopelessness.
