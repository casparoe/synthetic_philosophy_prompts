prompt: |-
  My brother-in-law is a nuclear policy nerd, like works at a think tank in DC and cannot let a single family dinner pass without bringing up deterrence. Last Thanksgiving he derailed the whole gravy situation by explaining why missile defense is supposedly destabilizing. Anyway he's turning 40 and I'm giving the speech at his party, and I want to close it with one actually good deterrence joke instead of the usual generic nukes-are-scary stuff that he'd just politely fake-laugh at.

  The thing I'd love the joke to turn on is the difference he's always going on about between deterrence and compellence — as far as I understand it, deterrence is threatening to punish someone if they do something, and compellence is threatening to punish them until they undo something they've already done, and apparently this is a much bigger deal than it sounds like it would be? He's also obsessed with brinkmanship being this weird thing where you threaten in a way you don't fully control, like the threat only works because there's some chance things spiral on their own. If the punchline could actually need one of those ideas to land, that would be perfect — the goal is that he does his annoying surprised-laugh, not the polite one, and definitely doesn't do the thing where he explains afterwards why the joke is technically wrong.

  I've tried writing something myself a few times but it keeps coming out as just a war joke with extra steps. Also fair game: he owns like five books with missiles on the cover, he thinks Thomas Schelling is basically a celebrity, and he once said the most romantic thing about his wife was that their relationship was "stable" and meant it as high praise. Keep it clean-ish since there will be kids at the party.
