answer: |-
  Here is the five-point marking scheme:

  1.  **Distinguish paraconsistency as solely about inference preservation (rejecting explosion) from dialetheism as an ontological claim about truth (some contradictions being true).** A B answer conflates them or defines them only superficially.
  2.  **Evaluate the Liar derivation by explicitly contrasting the dialetheist interpretation (it *reveals* a true contradiction) with the instrumentalist view (it exposes an *inconsistency-tolerant system's capability* without ontological commitment).** A B answer only describes the derivation without contrasting interpretations.
  3.  **Analyze classical recapture: explain how it *protects* dialetheism by showing consistency suffices for classical reasoning, but also how it *undermines* it by suggesting classical logic reflects truth-in-consistent-domains.** A B answer merely defines recapture without discussing its dual implications for the truth of contradictions.
  4.  **Address the necessity/contingency of inconsistency: argue whether dialetheism posits true contradictions as *inescapable* (e.g., semantic universality) or if paraconsistency treats them as *avoidable defects*.** A B answer discusses inconsistency tolerance without framing it as avoidable vs. fundamental.
  5.  **Defend or attack paraconsistency's stability by arguing whether rejecting explosion alone provides sufficient grounds for rejecting dialetheism's stronger truth claim, or if paraconsistency inevitably requires dialetheism to explain certain phenomena.** A B answer asserts stability/unstability without engaging the core tension between rejecting explosion and accepting true contradictions.
