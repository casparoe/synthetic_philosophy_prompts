prompt: |-
  been lurking lesswrong and the ea forum for like a decade now, and one thing that keeps coming up whenever people argue about s-risks or whether a mostly-aligned AI could still be catastrophic is negative utilitarianism — like, "an AI that only cared about suffering could conclude that painlessly switching everything off is the best action," that whole genre of argument. and i realized recently that despite having read a hundred comment threads about it, i couldn't actually state the view precisely. so i asked a friend who watched some youtube philosophy videos, and he sent me a video that summarizes it like this: "Negative utilitarianism is the view that only suffering matters morally — happiness counts for literally nothing. It was invented by Karl Popper, who argued that relieving suffering must always take priority over increasing happiness. Taken seriously, this means the ideal world contains no sentient life at all: a consistent negative utilitarian with a button that would painlessly end all consciousness instantly would be obligated to press it, since any residual suffering outweighs any amount of joy. Philosophers in this tradition, like David Pearce and David Benatar, therefore advocate for winding down life on earth. Most philosophers reject the view exactly because of this implication, which is known as the pinprick argument."

  some of this smells off to me. like, i'm pretty sure Pearce is the guy who wrote about abolishing suffering through genetic engineering and turning the biosphere into some graders-and-bliss paradise thing, not about ending life, and i have a vague memory that even people who call themselves negative utilitarians fight amongst themselves about whether the "press the button" thing actually follows. i also dimly remember someone claiming popper never really held the view and it's basically a misreading that got repeated for decades, but i cant remember where i saw that, so no clue if it's true.

  can you go through the video's summary piece by piece and tell me what a serious negative utilitarian would actually accept, where it's conflating different views (it wouldn't shock me if "only suffering matters" is one specific strong version and there are weaker versions getting lumped in), and whether the pinprick argument is really the standard knockdown everyone cites or whether n.u.'s have actual replies. and does the "most philosophers reject it" bit survive once you fix the errors — i.e., is the view rejected because of the button implication, or is that implication itself maybe an artifact of stating the view wrong in the first place? i'd like to be able to push back in these threads with something better than vibes.
reasoning: |-
  Okay, the user has been following discussions on LessWrong and EA Forum for about a decade and keeps encountering arguments about negative utilitarianism (NU) in AI risk scenarios. They mention the common claim that a suffering-focused AI might end all life painlessly. A friend shared a video summary stating NU only cares about suffering, invented by Popper, leading to the "obligation to press the button" to end all consciousness. The user is skeptical because they recall David Pearce advocates for abolishing suffering via genetic engineering, not ending life, and that even NUs debate the button conclusion. They also question if Popper truly held this view.

  First, I need to address each part of the video's summary. The video says NU is "only suffering matters morally—happiness counts for literally nothing." That's the strong version, but there are weaker forms. I should clarify the spectrum: strong NU prioritizes suffering reduction exclusively, while weak NU might allow some positive value to happiness but emphasizes suffering more. 

  Next, Popper's involvement. The user heard Popper might not have endorsed NU as described. Popper did write about minimizing suffering in "The Open Society and Its Enemies," but he didn't explicitly formulate NU. He was more about critical rationalism. Philosophers like R.N. Smart later expanded on NU and attributed the extreme conclusion to Popper. So the video oversimplifies Popper's role.

  David Pearce is mentioned in the video as advocating ending life, but the user knows Pearce actually promotes the "Hedonistic Imperative"—using tech to eliminate suffering while enhancing bliss. Pearce is a negative utilitarian but rejects the extinction implication. He argues for suffering abolition without ending sentient life. Benatar, however, is an anti-natalist who thinks existence is net negative, so he might support the button. Important to distinguish these thinkers.

  The pinprick argument: if one pinprick of suffering outweighs any happiness, then pressing the button is obligatory. But NUs have counterarguments. They might deny the premise that life contains unavoidable suffering, or argue that future suffering reduction could outweigh current minimal suffering. Weak NUs might say small sufferings don't obligate extinction if happiness has some weight. Practical NUs focus on feasible suffering reduction, not hypothetical buttons.

  The user wants to push back in forums with accurate info. They need to know the nuances: strong vs. weak NU, Popper's actual stance, Pearce vs. Benatar, and NU responses to the pinprick argument. Also, clarify that philosophers reject strong NU due to the button implication, but weak versions are more defensible. Highlighting that most NUs today don't advocate extinction, focusing instead on reducing suffering within existence.

  I should also mention the asymmetry in Benatar's views as a separate point since he's not strictly an NU but his arguments are often lumped in. Emphasize that the video's summary conflates different positions, leading to misrepresentation. The user's skepticism is valid; the summary is oversimplified. Providing these distinctions will help them articulate counterarguments effectively in discussions.
answer: |-
  You're absolutely right to be skeptical - that video summary oversimplifies and somewhat misrepresents negative utilitarianism (NU). Let's break it down point by point:

  ### 1. **"Only suffering matters morally — happiness counts for literally nothing."**
     - **Strong NU (Held by few)**: Yes, this is a *possible* formulation ("strong" or "pure" NU), where positive experiences have zero intrinsic moral weight. Only suffering reduction matters.
     - **Weak NU (More common)**: Most contemporary NUs (like David Pearce) hold that while suffering reduction is the *overriding* moral priority, positive states *do* have value. They argue suffering is lexically worse than happiness is good (i.e., no amount of happiness can compensate for extreme suffering). This avoids the "happiness is literally nothing" claim.
     - **Conflation:** The video presents only the strongest, least defensible version as the whole view.

  ### 2. **"Invented by Karl Popper... Philosophers like David Pearce and David Benatar"**
     - **Popper's Role (Mostly Misattributed):** Popper *did* write in "The Open Society and Its Enemies" (1945): *"I believe that there is, from the ethical point of view, no symmetry between suffering and happiness... human suffering makes a direct moral appeal, namely, the appeal for help, while there is no similar call to increase the happiness of a man who is doing well anyway."* However, Popper **never** formulated a systematic NU theory, nor did he endorse the "obligatory extinction" conclusion. Philosophers like R.N. Smart (1958) later developed NU *critically*, attributing the extreme implication *to* Popper's offhand remark. Popper wasn't a card-carrying NU.
     - **Pearce vs. Benatar (Crucial Distinction):**
       *   **David Pearce (The Hedonistic Imperative):** Is a prominent NU **but explicitly REJECTS the extinction conclusion.** His core argument is that suffering is *biologically unnecessary* and can (and should) be abolished through genetic engineering, neurotechnology, and AI, leading to a "gradient of bliss" paradise. He sees NU as demanding suffering *abolition*, not existence *annihilation*. The video completely misrepresents him.
       *   **David Benatar (Anti-natalism):** Benatar argues that coming into existence is *always* a serious harm (due to inevitable suffering) and that non-existence is preferable. He *is* often associated with an extinction conclusion ("better never to have been"). However, Benatar's arguments are **asymmetry-based** (absence of pain is good even if no one exists to enjoy it; absence of pleasure is not bad if no one exists to desire it) rather than strictly NU. He's a fellow traveler but not the same.
     - **Conflation:** The video lumps Pearce (anti-extinction NU), Benatar (anti-natalist, closer to pro-extinction), and Popper (misattributed) together incorrectly. Popper didn't invent it, Pearce doesn't advocate extinction, and Benatar isn't strictly NU.

  ### 3. **"A consistent negative utilitarian... would be obligated to press [the extinction button]"**
     - **Strong NU Implication:** For a *pure* NU who believes *only* suffering has disvalue and happiness has *zero* value, then yes, a painless extinction that prevents *all future suffering* would be the optimal outcome, regardless of any happiness lost. The "pinprick argument" (even one pinprick of suffering outweighs any amount of happiness) logically leads here *if* you accept pure NU and unavoidable future suffering.
     - **NU Rebuttals (Why most NUs reject the button):**
       *   **Weak NU:** If happiness has *some* positive value (even if lexically less important than suffering reduction), then a world without suffering *and* with immense happiness (Pearce's vision) is better than non-existence.
       *   **Asymmetry & Opportunity Cost:** Non-existence prevents *future* suffering reduction. A NU agent (especially an AI) could dedicate vast resources to actively reducing suffering *within* existence, potentially achieving net zero suffering without extinction. Pressing the button eliminates this possibility.
       *   **Uncertainty & Risk:** Can we be *certain* extinction is painless? Can we be *certain* non-existence contains no suffering (e.g., simulations, afterlives, Boltzmann brains)? Is the risk of causing *more* suffering through a botched extinction attempt worth it?
       *   **Practicality & Scope:** Most NUs focus on *actionable* ways to reduce suffering *now* (animal welfare, mental health, existential risk mitigation) rather than hypothetical buttons. The button is a philosopher's tool, not a policy proposal.
       *   **Thresholds & Minimization:** Some NUs argue that minimal, unavoidable "friction" (like mild frustration) might be acceptable if it enables vastly greater suffering reduction overall or is necessary for agency. The goal is *minimizing* suffering, not necessarily achieving absolute zero at any cost if the cost is existence itself (especially under Weak NU).
       *   **Focus on Intensity:** NUs often prioritize preventing the *worst* suffering first. A world with minimal, manageable suffering might be acceptable if the truly catastrophic forms are eliminated.

  ### 4. **The Pinprick Argument: Is it a Knockdown?**
     - **The Argument:** "If you accept that preventing one pinprick of suffering outweighs creating any amount of happiness, then you are logically compelled to endorse painless extinction to prevent all future pinpricks."
     - **Standard Critique?** Yes, it's the *most common* and powerful objection to *Strong* NU. Philosophers widely cite it as a reason to reject Strong NU.
     - **Does it Survive Scrutiny?**
       *   **Against Strong NU:** It's logically valid *if* you accept the premises (only suffering matters, happiness is worthless, future suffering is guaranteed). Most philosophers find this implication morally repugnant or absurd, hence Strong NU is widely rejected.
       *   **Against Weak NU:** The pinprick argument **doesn't work** against Weak NU. If happiness has *some* positive value, then the immense happiness in a suffering-minimized world outweighs the isolated pinprick. Weak NU avoids the extinction implication.
       *   **Against Practical NU:** It attacks a theoretical extreme that most self-identified NUs don't hold or act upon. Pearce, for example, would argue the pinprick argument is irrelevant because pinpricks can be abolished without ending life.

  ### 5. **"Most philosophers reject the view exactly because of this implication"**
     - **Accuracy:** This is **largely true for Strong NU.** The extinction implication is a major reason Strong NU is a minority view in academic philosophy. The perceived counter-intuitiveness is significant.
     - **Nuance:**
       *   Weak NU avoids the implication and is harder to dismiss solely on these grounds.
       *   Many philosophers also reject NU (even Weak NU) for other reasons: it seems to undervalue flourishing, beauty, achievement, relationships; it struggles with distributive justice questions if suffering reduction conflicts with fairness; it might demand excessive sacrifices for minor suffering reductions.
       *   **BUT**, the core concern about the extinction implication *is* a primary driver of rejection for the version most people initially encounter (Strong NU).

  ### Summary & How to Push Back

  1.  **Distinguish Strong vs. Weak NU:** The video describes only Strong NU ("happiness counts for literally nothing"). Most modern NUs (like Pearce) are Weak NUs – suffering reduction is paramount, but happiness has value. Weak NU avoids the extinction obligation.
  2.  **Correct Attributions:**
      *   Popper made a suggestive remark; he didn't "invent" NU and didn't endorse the extinction button.
      *   Pearce **explicitly rejects extinction** and advocates for suffering abolition *within* a thriving, blissful biosphere.
      *   Benatar's anti-natalism *is* closer to the extinction view but is *not* identical to mainstream NU (it's based on different asymmetries).
  3.  **NU Has Nuanced Replies to the Pinprick/Button Argument:** Weak NU escapes it entirely. Strong NUs might argue from uncertainty, opportunity cost (future suffering reduction), or focus on minimizing worst suffering rather than absolute zero at the cost of existence. Most actual NUs prioritize practical suffering reduction over hypothetical buttons.
  4.  **Rejection Reason:** Philosophers *do* largely reject **Strong NU** because of the extinction implication. However, **Weak NU** is rejected for a combination of reasons: the extinction implication (if misapplied), undervaluing the positive, and other philosophical concerns. The implication isn't an "artifact" of getting Strong NU wrong – it's a valid critique *of* Strong NU.

  **How to Push Back Effectively:**

  *   "That summary describes **Strong Negative Utilitarianism**, but most people discussing NU seriously today, like David Pearce, hold **Weak NU**. They believe happiness *does* have value; suffering reduction is just the overwhelming priority. Pearce explicitly argues for using tech to *abolish suffering in a thriving ecosystem*, not end life."
  *   "The 'obligation to press the extinction button' is a valid critique of **Strong NU** (where happiness has zero weight). However, **Weak NU** avoids this because it assigns *some* value to happiness. The common conflation of Pearce (anti-extinction) with Benatar (pro-extinction) or attributing the pure view to Popper (who didn't hold it) creates confusion."
  *   "Even within NU frameworks, there are arguments against pressing the button: uncertainty, the opportunity cost of preventing future suffering reduction, and focusing on eliminating *worst-case* suffering rather than chasing absolute zero at the cost of all existence. The 'pinprick argument' is powerful against Strong NU, but it's not the end of the discussion for the broader suffering-focused ethics landscape."
  *   "The philosophical rejection is strongest against Strong NU due to the extinction implication. Weak NU is debated, with objections focusing more on whether it adequately values positive experiences and flourishing, not solely on extinction."

  This approach separates the strawman (Strong NU + misattributions) from the more nuanced views actually debated (Weak NU, suffering-focused ethics), acknowledges the valid core of the pinprick argument while showing its limitations, and corrects the factual errors about key figures. Your vibes were spot on!
