answer: |-
  ## Joint Statement on Theories of Causation: Counterfactual vs. Interventionist Frameworks

  **Prepared for Signatories:**  
  **Signatory 1 (Counterfactual Analysis Advocate)**  
  **Signatory 2 (Interventionist Analysis Advocate)**  
  **Facilitated by: [Your Name/Department]**

  **Date:** 23 October 2023

  This statement represents points of agreement, disagreement, and key testable cruxes between proponents of the Lewis-style counterfactual analysis of causation (Signatory 1) and the Pearl-Woodward interventionist analysis (Signatory 2). Our goal is to clarify our positions, identify shared ground, and outline specific points of divergence where further analysis or empirical consideration might be decisive.

  ### 1. Points of Agreement

  We jointly affirm the following:

  1.  **Counterfactuals are Central:** Any adequate analysis of causation must involve counterfactual reasoning. Claims like "C caused E" imply that if C had not occurred (or had been different), E would not have occurred (or would have been different), under suitably specified conditions.
  2.  **Formal Machinery Overlap:** Both frameworks utilise formal tools that can be represented using structural equations. Signatory 1 acknowledges that structural equations provide a perspicuous way to model causal dependencies and counterfactuals. Signatory 2 acknowledges that evaluating interventions often involves considering non-actual scenarios, which can be formally modelled using possible worlds semantics, interpreted as a mathematical tool rather than necessarily committing to their metaphysical reality.
  3.  **Core Cases Require Handling:** Any credible theory of causation must provide coherent and intuitive accounts of:
      *   **Preemption:** Cases where a potential cause is preempted by another actual cause (e.g., Assassin 1 poisons the tea, but Assassin 2 shoots first; the victim dies instantly from the bullet).
      *   **Symmetric Overdetermination:** Cases where multiple sufficient causes occur simultaneously (e.g., two rocks thrown simultaneously shatter a bottle; either alone would have sufficed).
      *   **Omissions:** Cases where the absence of an event plays a causal role (e.g., the failure of a guard to lock a door enables a theft).
  4.  **Theory Evaluation Criteria:** A good theory of causation should:
      *   Be conceptually clear and precise.
      *   Provide an analysis that aligns with competent causal judgements in a wide range of cases (preemption, overdetermination, omissions, etc.).
      *   Offer a plausible account of the distinction between *causes* and *mere conditions*.
      *   Be applicable to empirical science and useful for reasoning about manipulation and control.
      *   Ideally, illuminate the connection between causation and other concepts like explanation, responsibility, and law.
  5.  **The Greenhouse Case Presents a Shared Challenge:** The case described below is recognised by both parties as a significant test for any theory of causation involving omissions and redundant backups:
      *   **Scenario:** A greenhouse has an automated irrigation system reliant on a soil-moisture sensor. The sensor is faulty and always reads "wet", preventing the pump from ever firing. Separately, a student was supposed to hand-water the plants that morning but failed to do so. The plants die due to lack of water.
      *   **Shared Intuition:** The death of the plants was caused *by something* – likely involving the lack of water. The challenge is to identify *what* counts as *the cause(s)*, particularly given the redundancy in failure (both the system and the student failed to provide water).

  ### 2. Key Disagreements

  The following table outlines our core disagreements, with each position stated in terms acceptable to its proponent:

  | Point of Disagreement          | Signatory 1 (Counterfactual)                                                                                                 | Signatory 2 (Interventionist)                                                                                                                                                   |
  | :----------------------------- | :--------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ |
  | **1. Primary Conceptual Foundation** | Causation is fundamentally analysed in terms of **counterfactual dependence** between distinct events, evaluated via similarity relations over **possible worlds**. | Causation is fundamentally analysed in terms of **invariant relationships under interventions** (understood as surgical modifications of structural equations setting variables). |
  | **2. Role of Possible Worlds** | Possible worlds semantics provides the **truth conditions** for counterfactuals. Evaluating "if C hadn't occurred..." requires assessing what happens in the **closest possible world(s)** where ~C holds. | Possible worlds are a useful **formal modelling tool** for representing counterfactual scenarios defined by interventions, but they are **not ontologically fundamental**. The core concepts are interventions and invariance within a causal model. |
  | **3. Role of Structural Equations** | Structural equations are a helpful **formal representation** of causal dependencies and counterfactuals, which are ultimately grounded in possible worlds. | Structural equations represent the **actual causal structure** of the system. Interventions directly manipulate these equations, defining the causal relations **operationally**. |
  | **4. Analysing Omissions (Greenhouse Core Case)** | In the core greenhouse case, **neither** the sensor fault nor the student's omission *alone* caused the death via simple counterfactual dependence: <br>~Sensor Fault → Pump fires? (Unclear - depends on model) → Plants live? (Unclear). <br>~Student Omission → Student waters → Plants live? (Yes, *but*...). However, the pump *wouldn't* have fired due to the sensor fault, so this world is arguably not close. The actual cause is the **complex event of the water not being supplied**, arising from the conjunction or disjunction of failures. Preemption/backup machinery *is* required to make this precise. | By defining appropriate variables (e.g., SensorState, PumpActivation, StudentAction, WaterPresent, PlantState) and applying an interventionist account of actual causation (e.g., Woodward's), **both** the sensor fault and the student's omission can be identified as **actual causes** of the plant death, depending on the chosen variables and context. The need for complex preemption machinery in the counterfactual approach highlights its conceptual burden compared to the interventionist focus on modular invariance. |

  ### 3. Cruxes and Predictions on Greenhouse Variants

  We identify the following specific sub-questions (cruxes) where settling the issue could alter one or both of our views. For each crux, we provide a concrete variant of the greenhouse case and record our *advance predictions* about what a correct causal analysis *should* conclude.

  **Crux 1: Can a single omission be an actual cause when a redundant backup system *also* fails, but where fixing the omission alone *would* have prevented the outcome?**

  *   **Test Case (Variant A - Fixed Sensor, Unfixed Student):** The sensor fault is repaired and is now working perfectly. However, the student still fails to water the plants. The automated system correctly reads "dry" but, due to an *unrelated, new fault* discovered only now, the pump fails to fire. The plants die.
  *   **Signatory 1's Prediction:** The student's omission **does not cause** the death. Counterfactual dependence fails: If the student *had* watered (~omission), the plants *would* have lived? Yes. *However*, this counterfactual requires "fixing" the omission while holding fixed the actual failure of the pump (a later event). In the closest world where the student waters, the pump still fails (due to the new fault), so the plants *still die*. Therefore, there is no counterfactual dependence of the death on the student's omission. The cause is the pump failure (or the complex lack of water).
  *   **Signatory 2's Prediction:** The student's omission **is an actual cause** of the death. We can intervene on `StudentAction` (set to `DidWater`) while holding fixed the new pump fault (as it is on a separate path). Under this intervention, `WaterPresent` becomes `Yes` (due to hand-watering), and `PlantState` becomes `Alive`. The student's omission thus satisfies the conditions for actual causation. The pump fault is also a cause.

  **Crux 2: Can a system fault be an actual cause of an outcome when a human omission *also* occurs, but where fixing the system alone *would* have prevented the outcome?**

  *   **Test Case (Variant B - Fixed Student, Unfixed Sensor):** The student fulfils their duty and waters the plants. However, the sensor is still faulty (always reads "wet"). Due to this, the automated pump *does not fire* (as per its programming). Crucially, the single hand-watering by the student was **insufficient** to keep the plants alive; they required the *additional* water from the automated system (or consistent watering the student didn't provide). The plants die.
  *   **Signatory 1's Prediction:** The sensor fault **does not cause** the death. Counterfactual dependence fails: If the sensor had been functional (~fault), the pump *would* have fired? Yes (assuming dry reading). And the plants *would* have lived? **No.** Because the student only watered once, and the plants needed more water (either consistent hand-watering beyond what the student did *or* the automated system). Therefore, the death does not counterfactually depend on the sensor fault. The cause is the insufficiency of the water supplied (perhaps attributable to the student only watering once, or the plants' needs).
  *   **Signatory 2's Prediction:** The sensor fault **is an actual cause** of the death. We can intervene on `SensorState` (set to `Functional`) while holding fixed `StudentAction` (at `DidWater` once). Under this intervention, the pump fires (as it reads dry), `WaterPresent` becomes `Sufficient` (hand-water + pump), and `PlantState` becomes `Alive`. The sensor fault thus satisfies the conditions for actual causation. The insufficiency of the student's single action (relative to need) might also be a cause.

  **Agreed Significance:** Agreement or disagreement on the predicted outcomes in Variants A and B will provide concrete evidence regarding the ability of each theory to handle omissions and pre-emption/backup scenarios cleanly, and the necessity (or lack thereof) of complex counterfactual similarity machinery versus interventionist modularity. If one theory consistently yields predictions aligning more strongly with pre-theoretical intuitions across these variants, it would constitute significant evidence in its favour for the other signatory.

  ---

  **Procedural Note:** This document serves as a foundation for continued discussion. We commit to revisiting our predictions in light of further analysis of these variants and other test cases. Signed copies will be held by the facilitator.

