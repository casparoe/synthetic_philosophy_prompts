answer: |-
  ### Thought Experiment: The Alma Mater and the School Fundraiser

  Anya chairs a university hiring committee reviewing three equally qualified candidates for a single tenure-track position. Candidate A graduated from Anya's own alma mater, a prestigious but not uniquely superior institution. Anya feels a subtle warmth and familiarity towards Candidate A, subtly nudging discussions towards their strengths and framing minor points in their favor, ultimately tipping the scales. Boris, a middle-class parent, receives a $5,000 bonus. He could donate it to a highly effective global health charity (e.g., Against Malaria Foundation, demonstrably saving lives cheaply) or use it to buy essential supplies for his child's severely underfunded public school classroom, directly benefiting his child and classmates. He chooses the latter, feeling a visceral pull to help 'his own' immediate community despite knowing the greater aggregate good elsewhere. Both act on a deep-seated preference for the proximate and familiar, framing it as "supporting quality/community I know" (Anya) or "fulfilling my duty to those closest" (Boris), and both would likely dismiss abstract statistics about fairness or efficiency with "it's not just about the numbers."

  ### Analysis of Demarcation Tests

  1.  **Reflective Endorsement Test (Would you keep the disposition after cool, idealized reflection?):**
      *   **Anya:** Under idealized reflection (impartial, informed about cognitive biases, considering long-term institutional health), Anya would likely reject her favoritism. She'd recognize it undermines meritocracy, fairness, and potentially the department's quality by excluding equally qualified outsiders. She'd endorse a merit-based principle instead.
      *   **Boris:** Under idealized reflection (impartial, understanding the scale of suffering prevented by effective charities, considering all children equally), Boris *might* still endorse his partiality. He might argue that the special obligations and emotional bonds of parenthood, and the concrete value of nurturing his immediate community, are legitimate moral values that survive reflection, even acknowledging the greater good elsewhere.
      *   **Separates?** **Yes.** Reflection likely leads Anya to reject her preference as illegitimate bias, while Boris might affirm his as a permissible expression of legitimate partiality (e.g., parental duty).

  2.  **Tracking Test (Does the disposition track morally relevant features or mere proximity/similarity?):**
      *   **Anya:** The preference tracks *mere proximity/similarity* (shared institutional history). The morally relevant features for hiring are qualifications, potential, and fit. Alma mater affiliation is irrelevant to these; it's a coincidental similarity biasing judgment.
      *   **Boris:** The preference tracks *both* proximity/similarity (his child, local school) *and* a potentially morally relevant feature: **special relationship/specific obligation.** Parental obligations are widely recognized as creating legitimate reasons for partiality that aren't *solely* based on proximity (though proximity enables the relationship). The benefit is also concrete and relational.
      *   **Separates?** **Yes (but nuanced).** Anya's preference tracks *only* morally irrelevant proximity/similarity. Boris's preference tracks proximity *and* a morally relevant feature (special obligation arising from the parent-child relationship), giving it a plausible claim to legitimacy beyond mere bias.

  3.  **Full-Information + Empathy Test (Would the disposition survive knowing everything and feeling deeply for everyone affected?):**
      *   **Anya:** Knowing the qualifications and potential of the rejected candidates *equally well* as Candidate A's, and *feeling* their profound disappointment, dashed career hopes, and the unfairness of losing out due to an irrelevant affiliation, Anya would likely find her favoritism impossible to maintain. The harm caused is visceral and directly attributable to her bias.
      *   **Boris:** Knowing *exactly* the suffering of the distant strangers who won't receive life-saving aid (e.g., visualizing a child dying of malaria), and *feeling* that suffering with the same intensity he feels for his own child's classroom needs, Boris would face an agonizing conflict. While the pull towards his child might remain incredibly strong, the sheer scale and intensity of the distant suffering, fully felt, would make his choice far less comfortable or obviously permissible. The disposition *might* survive but would be severely challenged and feel like a deep moral failure by the standard of pure, impartial empathy.
      *   **Separates?** **No.** Both dispositions are severely undermined. Anya's collapses under the weight of clear, felt unfairness. Boris's faces an intense, potentially paralyzing conflict where the "permissible partiality" feels like a tragic necessity forced by human emotional limits, not clearly morally superior. The test collapses the distinction, revealing both as preferences rooted in partiality that cause significant harm when viewed impartially.

  ### The Discriminating Feature and Its Removal

  *   **What does the work?** **Institutional Role and Mandate.** Anya acts within a specific institutional role (hiring committee chair) with a defined mandate: to select the best candidate based on merit for the good of the institution and the field. Her partiality violates this mandate and the implicit social contract of fairness governing the role. Boris acts as a private individual spending personal resources. While morality applies, there's no specific institutional mandate demanding impartiality; parental partiality is a widely accepted social norm *for individuals* in that context.
  *   **Feature Removed:** Imagine Anya is *not* on a hiring committee but is privately recommending a former student from her alma mater for a freelance gig to a friend, bypassing equally qualified strangers. Or imagine Boris is a government official allocating *public* education funds, choosing to massively overfund his own child's school while underfunding others serving needier populations. In the first altered Anya case, her favoritism looks more like permissible networking/nepotism-lite (still potentially biased, but less egregious). In the altered Boris case, his partiality looks like blatant corruption and bias, violating his public trust. **Removing the institutional role context significantly blurs the distinction.** The "bias" label sticks most firmly when partiality violates the impartiality requirements of a specific, entrusted role.

  ### The Deflationist Attack

  The deflationist argues that labeling Anya's behavior "bias" and Boris's "permissible partiality" is merely a social convention reflecting *our own preferences* for how institutional roles *should* function and how family bonds *should* be prioritized. There's no deeper moral truth revealed by the tests. The reflective endorsement test just codifies our existing intuitions about fairness in hiring vs. family. The tracking test presupposes which features (merit vs. special obligation) *we* deem relevant. The empathy test's "collapse" reveals the uncomfortable truth: both are ultimately arbitrary preferences favoring "near and dear," causing harm to outsiders. Calling one "bias" is just rhetorical enforcement of norms we like (meritocratic institutions) while giving a pass to norms we also like (strong families). The distinction is purely sociological, not genuinely moral; it's "bias" when we disapprove of the partiality context, "preference" when we approve.

  ### Own Call & Confidence

  *   **Own Call:** The distinction *partially* survives, but its foundation is revealed as fragile and context-dependent, resting primarily on social roles and norms rather than a deep, intrinsic moral difference in the psychological mechanism itself. The empathy test powerfully exposes this fragility. While Anya's action is clearly blameworthy *in context* and Boris's is typically excused, the core partiality impulse and its consequences for unseen others share a morally problematic common root.
  *   **Confidence:** 0.7 (The role context creates a robust *practical* distinction, but the deflationist challenge and the empathy test collapse create serious doubt about a fundamental *moral* distinction).

