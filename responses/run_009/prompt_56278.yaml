prompt: |-
  For my decision theory seminar we've been on expected utility and Pascal's mugging, and it made me realize my gut verdicts on small-probability-huge-stakes cases are kind of all over the palce, so I'm trying to figure out if there's actually a principle behind them. Here's the list. A guy at a bus stop tells me he'll torture a googolplex of people unless I hand over $5: not paying, obviously. Donating $50 to a group that tracks near-earth asteroids: seems fine to me, even though the chance my $50 actually stops and impact is astronomically small. My friend offers me 1% of his startup for $200 and swears there's a 1-in-10,000 shot it sells for $100M, so it's supposedly worth $100k in expectation: taking it would still be dumb. Signing up for cryonics at $100/month on the theory that there's maybe a 1% chance it eventually gets me centuries more life: I go back and forth but lean yes. A lottery site selling $1.20 tickets for a genuinely random 1-in-500-million shot at $600M: I wouldn't buy one, and I wouldn't even be tempted. A fair coin flip for $20 with my roommate: I take it, so it's not like I'm just scared of risk in general.

  Is there one principle that gets all of these, or close? The lottery verdict and the cryonics verdict seem hardest to hold together — structurally they look almost identical, tiny chance of an enormous payoff, except cryonics costs me way more per shot and I still lean toward it?? And what does the principle say about the case I genuinely can't settle: giving $1000 to a group that works on making sure future superintelligent AI doesn't wipe out humanity, where they'd tell me there's some small but real chance of saving literally everyone who will ever live? If the principle has to overturn some of my verdicts, I'd rather know which ones, and I'd also like to hear what it predicts on a case I haven't thought of.
reasoning: |-
  Okay, let me try to unpack the user's decision theory puzzle. They've listed several scenarios where small probabilities meet huge stakes, and their gut reactions seem inconsistent. The core question is whether there's a unifying principle behind these judgments. 

  First, I notice the user is clearly intellectually engaged - this is for a decision theory seminar, and they're grappling with real philosophical tension between expected utility calculations and intuition. The fact they mention Pascal's Mugging suggests they're already familiar with standard frameworks failing here. 

  Hmm... the cryonics vs lottery contradiction jumps out. Both involve tiny chances of massive payoffs, yet they lean yes on cryonics but reject lottery tickets. That's the central inconsistency to explain. Also interesting how they accept asteroid donation but reject the startup investment - both have astronomically small probabilities of success, but different contexts.

  Wait, the bus stop torture case reveals something important: they instinctively reject threats from unverifiable sources. That points to a credibility filter. Whereas for asteroid tracking, they likely trust scientific institutions more. The AI safety donation uncertainty makes sense here - it's about trusting the organization's credibility.

  For the coin flip with roommate: this shows risk aversion isn't the issue since they accept fair 50/50 bets. So the hesitation must be specifically about tiny probabilities. The startup rejection suggests they're applying an "unlikely to be true" meta-probability rather than just the stated odds.

  The cryonics case is fascinating - they admit going back and forth. I suspect the difference from lottery tickets might be about personal relevance. Death feels more concrete than abstract wealth, and cryonics offers some psychological comfort regardless of actual odds. Whereas lottery tickets feel like pure greed.

  For the AI donation dilemma... if I apply the credibility + personal action principles, it becomes about whether they believe the organization can actually convert $1000 into meaningful risk reduction. That's probably why they're stuck - it's hard to assess that probability.

  The deeper need here seems to be about reconciling rationality with human intuition. They want a decision framework that doesn't force them to pay Pascal's Muggers but still allows supporting important causes. The unstated request might be for permission to trust their instincts while having principled reasons.

  I should emphasize that expected utility isn't wrong - it's just that humans naturally apply additional filters like credibility assessment and psychological factors. Their judgments are actually quite reasonable when you consider these layers. The startup rejection shows particularly good intuition about unrealistic promises.
answer: |-
  Your intuitions reveal a deep tension between pure expected utility (EU) maximization and several psychological/philosophical filters humans apply. There *is* a coherent pattern here, driven by a combination of **epistemic credibility assessment**, **action efficacy perception**, **psychological framing**, and **loss aversion**. Let me break it down:

  ### The Core Principles Explaining Your Verdicts
  1.  **Epistemic Credibility ("Is this claim believable?"):** You heavily discount claims from unverifiable, untrustworthy, or strategically motivated sources. The probability you *assign internally* is much lower than the stated probability.
  2.  **Action Efficacy ("Will *my* action make a difference?"):** You assess whether your specific contribution has a non-negligible chance of being causally necessary for the outcome.
  3.  **Psychological Framing & Loss Aversion:** You are more willing to accept small certain losses to avoid large potential losses (insurance/altruism) than to pay small certain costs for large potential gains (gambling). Losses loom larger than gains.
  4.  **Scale Saturation & Moral Weight:** Beyond a certain point, increasing the number of beneficiaries/stakes has diminishing marginal impact on your valuation.

  ### Applying the Principles to Your Cases

  1.  **Bus Stop Torturer (Not Paying):**
      *   **Credibility:** Effectively zero. Random guy at a bus stop? Absurd claim. Your internal probability assigned is infinitesimal, not "small".
      *   **Efficacy:** Even if true, your $5 is irrelevant to someone capable of torturing a googolplex people. They could just take it.
      *   **Framing:** Framed as a pure extortion gamble. Loss aversion makes paying $5 *certain* loss feel bad against an incredible threat.

  2.  **Asteroid Tracking Donation ($50 - Fine):**
      *   **Credibility:** Moderate-to-high. Scientific consensus exists on the *risk*. The organization has trackable methods.
      *   **Efficacy:** Your $50 *is* part of a collective effort where the *sum* of contributions funds detection/prevention. Your contribution increases the collective capacity slightly.
      *   **Framing:** Framed as insurance/altruism against a catastrophic loss (human extinction). Small certain cost to mitigate a massive potential loss feels reasonable.
      *   **Scale:** Saving "everyone" is the ultimate catastrophic loss prevention.

  3.  **Startup Investment (1% for $200 - Dumb):**
      *   **Credibility:** Very Low. Your friend is motivated to sell. "1-in-10,000" sounds pulled from thin air. Startups fail constantly; huge exits are rare. Your internal probability is far below 0.01%.
      *   **Efficacy:** High *if* true (owning 1% of a $100M company). But the low credibility swamps this.
      *   **Framing:** Framed as a pure speculative gamble for gain. Loss aversion makes the $200 certain loss salient against the incredible promise.

  4.  **Cryonics ($100/month - Lean Yes):**
      *   **Credibility:** Low-to-Moderate, but *personally salient*. The science is highly speculative, but the *concept* (preserve brain, revive later) isn't *logically* impossible like the bus stop guy. Organizations exist with some track record (preservation).
      *   **Efficacy:** High *if* revival works. Your payment directly funds *your* preservation and the organization working on revival. Your action is causally necessary for *your* potential benefit.
      *   **Framing:** Framed primarily as **insurance against personal catastrophic loss (death)**. Small recurring cost to avoid permanent loss of consciousness/experience. Loss aversion strongly activated (avoiding death). Also involves hope/personal significance.
      *   **Scale:** Personal stakes feel immense, even if objectively smaller than humanity-scale stakes.

  5.  **Lottery Ticket ($1.20 for $600M - No):**
      *   **Credibility:** High (genuinely random), but...
      *   **Efficacy:** Low. Your single ticket has negligible impact on your win probability. Buying it doesn't make the *system* more likely to exist or work.
      *   **Framing:** Framed as pure speculative gambling for gain. The $1.20 loss is certain and salient. The astronomical odds make the gain feel unreal, even if credible.
      *   **Scale:** The gain feels abstract and excessive ("life-changing" is enough; $600M vs $100M feels similar psychologically).

  6.  **Coin Flip ($20 - Take it):**
      *   **Credibility:** Perfect (fair coin).
      *   **Efficacy:** Perfectly captures the causal link - the flip determines the outcome.
      *   **Framing:** Symmetric gain/loss. Moderate stakes. Your loss aversion isn't strongly triggered at this level. Pure risk assessment applies.
      *   **Scale:** Stakes are comprehensible and personally meaningful but not overwhelming.

  ### Resolving the Cryonics vs. Lottery Paradox
  *   **Credibility:** Cryonics involves speculative science you find *plausible enough* for personal stakes; Lottery involves pure, credible chance.
  *   **Framing:** Cryonics is **Loss Prevention** (avoiding death); Lottery is **Gain Seeking**. Loss prevention is psychologically stronger.
  *   **Efficacy:** Cryonics payment directly funds *your* specific chance; Lottery ticket buys a miniscule slice of a prize pool that exists independently. Your action feels more causally connected in cryonics.
  *   **Personal Salience:** Death is viscerally real; becoming a billionaire is a fantasy. Cryonics offers hope tied to a core human drive (survival).

  ### The AI Safety Donation Dilemma ($1000)
  This is the ultimate test. Applying the principles:

  1.  **Credibility:** CRITICAL. How credible is the organization? Do they have a concrete theory of change? Are they reputable experts or fringe actors? Does their "small but real chance" assessment seem rigorous or hand-wavy? *This is where your uncertainty lies.*
  2.  **Efficacy:** Does your $1000 demonstrably increase the *marginal* probability of success? Are they funding specific, scalable research/interventions? Or is it lost in overhead? Does the effort have a critical funding threshold your donation helps reach?
  3.  **Framing:** Pure **Catastrophic Loss Prevention**. Like asteroid donation, but potentially even higher stakes ("everyone who will ever live"). This strongly activates the "insurance" justification.
  4.  **Scale:** Maximum conceivable scale. The principle of scale saturation might kick in – saving "everyone" is already the maximum moral weight; increasing the number further doesn't change the imperative *if* the chance is real and your action helps.

  **What the Principles Predict:** If you judge the organization's **credibility** as sufficiently high (similar to asteroid trackers) and believe your donation has non-negligible **efficacy** (it funds impactful work at the margin), then the **loss prevention framing** and **catastrophic scale** strongly argue for donating. If credibility or efficacy feels low (like the bus stop guy or lottery), you shouldn't donate.

  ### What Might Need Overturning? (Based on Pure EU)
  *   **Startup Investment:** If you *truly* believed your friend's 1-in-10,000 assessment was credible (e.g., based on solid due diligence, not just his word), EU says $200 for a $10,000 EV is a steal. Your intuition correctly flags the credibility issue as paramount.
  *   **Lottery Ticket:** Pure EU says a positive EV ticket (expected value > cost) is rational to buy. Your intuition highlights the *psychological unreality* of mega-gains and the *efficacy* feeling ("my ticket won't win anyway"). If the EV was massively positive ($1.20 for a 50% chance at $3?), you'd probably take it. The scale + low efficacy make the tiny positive EV feel irrelevant.

  ### Prediction on a New Case
  **Case:** A reputable climate science NGO claims donating $100 has a 1-in-a-million chance of averting a specific climate tipping point that would otherwise cause $100 trillion in damage. (EV = $100,000 per $100 donated).
  *   **Prediction (Leaning Yes):**
      *   **Credibility:** High (reputable science NGO).
      *   **Efficacy:** Plausible (funds research/advocacy that could influence policy/tech, collective action).
      *   **Framing:** Catastrophic Loss Prevention (massive economic/environmental damage).
      *   **Scale:** Massive, but comprehensible (economic cost vs. abstract googolplex lives).
      *   **Comparison:** Very similar to Asteroid/Donation. You'd likely donate, despite the tiny probability, because the credibility, loss-prevention framing, and perceived efficacy align.

  Your intuitions are not irrational; they reflect sophisticated heuristics for navigating a world full of uncertainty, strategic actors, and actions with complex causal chains. They prioritize avoiding being scammed or wasting resources on futile gestures ("Pascal's Mugging avoidance") while allowing investment in credible efforts to prevent catastrophic losses, especially when the action feels personally efficacious or addresses profound personal risks. The key is rigorously applying the credibility and efficacy filters.
