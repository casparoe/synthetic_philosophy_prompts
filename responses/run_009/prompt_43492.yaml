  Second question, and honestly the one I care about more for the piece: why should a normal person care? Nobody's offering me a Pasadena-style gamble at the shops, so is this a pure mathematical curiosity, or does it reveal something real about where the whole "maximise expected utility" framework runs out of road — and about what it could even mean to say there's *no fact of the matter* about how good a bet is? Please write in British English, and don't just give me the textbook recap — I want the intuitions behind the pathology, in terms I can actually put across to readers who've never taken a probability course.
