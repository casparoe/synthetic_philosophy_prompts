prompt: |-
  longtime lurker here (lesswrong mostly, some EA forum, been reading since the overcoming bias days) and i have a half-formed idea I want you to turn into a real research proposal, like for a dissertation prospectus or a year-long fellowship thing.

  The idea: everyone in the academic literature on the inefficacy objection — your one hamburger doesn't cause any suffering because factory farming doesn't respond to single purchases, your vote is basically never decisive, one person's emissions vanish into the aggregate, that whole literature — seems to just quietly assume causal decision theory. The standard move is "my act makes no causal difference to the harm, so I'm not responsible for it," and then the other side argues back with expected value or thresholds or whatever, but nobody seems to flag that the entire debate inherits CDT's way of individuating what counts as a consequence of your act.

  Meanwhile the rationalist-adjacent world spent like fifteen years arguing that CDT gives the wrong answer on Newcomb, and converged (well, some of them) on FDT / updateless-ish views, where what matters is the logical correlation between your choice and other agents' choices. And on those views the inefficacy objection looks weird from the start: if my choice to skip the burger is logically linked to thousands of similar choices by structurally similar agents, then in the decision-relevant sense I'm not impotent at all. I one-box, so I should also "one-box" at the supermarket, so to speak.

  so my suspicion is: the inefficacy debate in philosophy is a covert fight about decision theory that neither side noticed they were having. the philosophers are two-boxing and the EAs are one-boxing, and if that's right the debate isn't about thresholds or expected value at all.

  What I want from you: a proposal with (1) the question stated precisely enough that it has a determinate answer — something like "does the best answer to the inefficacy objection change depending on which decision theory is true, and can the two debates be run in parallel such that results transfer between them" — but sharpen that, it's still mushy in my head. (2) why the existing positions leave it open, i.e. where exactly the CDT assumption gets smuggled in (I'm guessing it's in how people individuate the act — "my purchase" vs "the rationally similar set of purchases" — but I haven't nailed this down). (3) the actual method, month by month — and here's the part I care about most: I want it to include constructing paired cases, where you take a classic inefficacy scenario (voting, meat, climate) and a decision-theory scenario (newcomb-ish, Twin Prisoner's Dilemma, medical newcomb) and check whether intuitions stay consistent when you move between them. if people two-box AND donate-to-the-inefficacy-defense, or one-box AND accept the inefficacy objection, that's the interesting data. (4) what a failure looks like — and be honest about the obvious worry that this is either trivial (FDT fans already believe it, no argument needed) or already done (philosophers have evidentialist replies to the voting thing from forever ago, and I genuinely don't know how close those get to the logical-correlation point). If the honest answer is "the evidential replies already contain this idea and the proposal is just rebranding," say so in the proposal as a live failure mode.

  Don't do a bibliography or named literature review — I'll fill the citations in myself, just refer to positions by their content (e.g. "the threshold view", "the expected value defense") and I'll match them to actual people later. Aim for something like a two-page proposal's worth of content. And keep the tone serious even tho this ask is very not serious, the fellowship people can smell vibes.
