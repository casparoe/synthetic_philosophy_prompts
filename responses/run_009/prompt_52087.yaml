answer: |-
  ## Research Proposal: Decision-Theoretic Foundations of the Inefficacy Objection

  **1. Research Question (Sharpened):**
  Does the normative force of the inefficacy objection (against individual moral responsibility in collective harm cases) fundamentally depend on the underlying decision theory? Specifically, does adopting Causal Decision Theory (CDT) structurally commit proponents to the objection's validity while adopting Functional Decision Theory (FDT) or similar updateless frameworks structurally undermine it, thereby resolving the inefficacy problem for logically correlated agents? Further, can the existing philosophical debate on inefficacy be systematically mapped onto the rationalist debate on decision theory, revealing it as an unrecognized conflict between CDT-like and FDT-like reasoning?

  **2. The Gap in Existing Literature & Smuggled CDT Assumption:**
  The core inefficacy objection ("My single act X causes no harm H, therefore I bear no responsibility for H via X") implicitly rests on a *causal* and *atomistic* conception of agency and responsibility. This is revealed by:

  *   **Atomistic Act Individuation:** The literature universally frames the relevant act as the *singular, physical token event* (e.g., *this* purchase, *this* vote, *this* emission). The consequences evaluated are only those *directly counterfactually dependent* on this specific token act. This mirrors CDT's focus on the causal consequences of the specific choice *now*.
  *   **Neglect of Logical Correlation:** Defenses primarily rely on probabilistic aggregation (expected value) or contingent structural features (thresholds, tipping points). Crucially, they lack a robust account of how the *logical structure* of the decision problem itself – particularly the correlation between the agent's decision algorithm and those of other agents in structurally similar positions – fundamentally alters the counterfactuals relevant to responsibility. This neglects the core FDT/updateless insight.
  *   **Missing Decision-Theoretic Lens:** While some philosophers employ *evidential* reasoning (e.g., "Buying meat is *evidence* of supporting factory farming"), this often remains superficial. It typically lacks the formal machinery of FDT to handle logical correlations between decision algorithms ("If I defect here, so do my logical twins, leading to bad outcomes") or the updateless perspective ("Which decision rule, if followed by all similar agents, yields the best outcome?"). The debate proceeds without recognizing that the very definition of "efficacy" and "consequence" is decision-theory-dependent. The CDT assumption is smuggled in by taking the causal, token-level counterfactual as the exclusive basis for moral evaluation, without considering agent-type counterfactuals central to FDT.

  **3. Methodology (Month-by-Month):**

  *   **Months 1-2: Foundational Analysis & Formal Mapping:**
      *   Deconstruct key positions in the inefficacy debate (e.g., pure impotence, expected value defense, threshold arguments, collective obligation views). Isolate their explicit and implicit assumptions about agency, counterfactuals, and consequence-individuation.
      *   Formally characterize these assumptions using CDT and FDT frameworks. Map existing philosophical positions onto CDT-like reasoning and identify where potential FDT-like reasoning appears nascent or absent.
      *   Identify canonical decision theory dilemmas (Newcomb's Problem, Twin Prisoner's Dilemma, Medical Newcomb, Parfit's Hitchhiker) that structurally parallel key inefficacy scenarios (voting, individual meat consumption, small emissions, charitable donations in large pools).
  *   **Months 3-4: Paired Scenario Construction & Validation:**
      *   Develop paired sets of scenarios:
          *   **Set A (Inefficacy):** Standard cases (e.g., buying 1 burger from a mega-farm, 1 vote in a large election, emitting 1 ton of CO2) phrased to elicit judgments on permissibility/responsibility.
          *   **Set B (Decision Theory):** Structurally analogous dilemmas (e.g., Twin PD: Your burger choice is mirrored by 10,000 identical agents facing identical choices simultaneously; Voting Newcomb: A predictor scans your brain state before voting; Climate Medical Newcomb: Taking a carbon-intensive flight guarantees a life-saving treatment only if the predictor foresaw you would refuse similar flights when insignificant).
      *   Ensure scenarios are tightly matched in logical structure but differ in surface features. Pre-test for comprehensibility and perceived relevance.
  *   **Months 5-7: Experimental Data Collection:**
      *   Deploy surveys to relevant populations (philosophers, EAs/rationalists, general public samples) presenting pairs of scenarios from Set A and Set B in counterbalanced order.
      *   Measure:
          1.  Judgments on permissibility/responsibility for actions in Set A.
          2.  Choices in Set B.
          3.  Explicit reasoning (optional open-ended).
          4.  Familiarity with decision theory concepts/rationalist ideas.
      *   Primary Hypothesis: Participants who consistently make "CDT-style" choices in Set B (e.g., two-box, defect in Twin PD) will be significantly more likely to accept the inefficacy objection in Set A. Participants who make "FDT-style" choices (e.g., one-box, cooperate in Twin PD) will be significantly more likely to reject the inefficacy objection in Set A.
  *   **Months 8-10: Analysis, Interpretation & Synthesis:**
      *   Statistically analyze the correlation between decision types across scenarios.
      *   Analyze reasoning for insights into how participants conceptualize agency and consequences.
      *   Synthesize findings: Does the data support the hypothesis that the inefficacy debate is a proxy for decision theory commitments?
      *   Develop a formal account of how FDT dissolves the inefficacy objection by reframing the relevant counterfactual to the agent-type level ("If my decision rule recommends X, what happens when all similar agents follow that rule?").
      *   Re-interpret key philosophical arguments through the CDT/FDT lens.
  *   **Months 11-12: Writing & Dissemination.**

  **4. Failure Modes & Assessment:**

  *   **Triviality (FDT Fans Already Know):** *Likelihood: Moderate. Mitigation:* The target contribution is not to convince FDT proponents, but to rigorously demonstrate the *structural parallel* to the philosophical debate, provide *empirical evidence* of the connection in reasoning patterns, and offer a *formal resolution* of inefficacy *within* the FDT framework that philosophers can engage with. Success is showing the debate *is* about decision theory, not just asserting it.
  *   **Redundancy (Evidentialism Covers It):** *Likelihood: High, but addressable. Mitigation:* While EDTerly views exist in philosophy, they often lack the specific tools of FDT:
      *   FDT explicitly handles *logical correlation* between *decision algorithms*, not just probabilistic evidence. It answers *why* correlation exists (shared decision rule).
      *   FDT provides a *normative justification* ("maximize utility across possible worlds where this decision rule is followed") distinct from evidentialist "maximize conditional expected utility".
      *   The experiment directly tests if *actual reasoning* aligns better with simple evidentialism or the stronger logical correlation implied by FDT. A *failure* would be finding no difference between FDT choices and simple evidentialist reasoning in driving inefficacy rejection.
  *   **Unrelated Debates:** *Likelihood: Low-Moderate. Mitigation:* The strong structural similarity between scenarios (e.g., Twin PD and meat consumption) suggests a connection. A failure would be finding *no significant correlation* between choices in Set A and Set B, even after controlling for demographics and familiarity. This would suggest the debates are psychologically distinct. We pre-register this null finding as a critical possible outcome.
  *   **Inconclusive Results:** *Likelihood: Moderate. Mitigation:* Focus on the conceptual mapping and formal argument even if empirical results are noisy. A clear theoretical demonstration that FDT dissolves the objection remains valuable. Refine scenarios based on initial data and iterate.
  *   **Rebranding Failure:** *Likelihood: Low. Mitigation:* The proposal actively seeks to identify if existing "evidentialist" replies *are* functionally equivalent to FDT in this context. If analysis shows they are, the contribution becomes synthesizing and formalizing this equivalence explicitly within decision theory, demonstrating that philosophers were using a proto-FDT all along. This is still valuable clarification.

  **Expected Significance:** This research promises to resolve a longstanding philosophical deadlock by exposing its hidden decision-theoretic foundation. It offers a novel, theoretically grounded resolution to the inefficacy objection via FDT. It bridges a significant gap between academic philosophy and rationalist decision theory, potentially enriching both fields. The empirical component provides unique evidence on the cognitive underpinnings of moral reasoning in collective action problems.
