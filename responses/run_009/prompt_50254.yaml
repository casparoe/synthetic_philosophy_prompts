  The user has identified several key opponents in their department: a senior self-determination theorist, a colleague focused on migration and development, a Kantian cosmopolitan, a law-and-economics scholar, and the department administrator. Each has distinct concerns, and the user wants to anticipate their objections and prepare responses. They also worry about a potential question regarding emergencies like pandemics expanding the exclusion proviso.

  The user needs a prep sheet that outlines each objection in the expected order, phrased as the questioners would, with two-minute replies. They want each response to clarify which premises are contested versus settled in the field and note where their replies might be vulnerable. The unasked question about emergencies is a particular concern.

  For the senior self-determination theorist, the objection will likely dismiss the association analogy as irrelevant and argue that self-determination inherently includes membership control. The reply should acknowledge their perspective but maintain that jurisdictional legitimacy is prior and conditional. This is contested territory, so the user must be careful not to present their view as settled.

  The migration and development colleague will question the state-centric nature of jurisdictional rights, especially in weak or contested states. The response needs to admit the framework's limitations while arguing that legitimacy conditions still apply. This is contested, especially in postcolonial contexts.

  The Kantian cosmopolitan will challenge why legitimacy toward foreigners doesn't lead to global egalitarianism and open borders. The reply should distinguish political legitimacy from distributive justice, emphasizing functional thresholds. This is highly contested, particularly regarding the scope of state obligations.

  The law-and-economics scholar will push for practical implications regarding admission systems. The response should link the theory to policy design without overstepping into empirical details, which is moderately contested but allows the user to engage constructively.

  The administrator's recurring question about individual border guards requires addressing complicity and institutional roles. The response should differentiate policy-level justification from individual responsibility, which is on relatively settled ground regarding institutional agency.

  The emergency scenario (like a pandemic) is the user's feared question. They must admit this is underdeveloped in their thesis but suggest that legitimate emergency powers would still require proportionality. This area is highly contested and needs cautious handling.

  Throughout, the user needs to clearly flag contested premises to avoid appearing dismissive of established debates. The prep sheet should help them navigate these objections while maintaining academic rigor and collegial respect.
answer: |-
  Here’s your prep sheet, structured to anticipate objections in likely order of attack, with replies tailored to your audience’s known positions. I’ve flagged contested/settled ground clearly (**Contested** / **Settled**) and noted soft spots.

  ---

  ### **Prep Sheet: Seminar Q&A Defense**
  **Core Thesis:** State exclusion rights derive *solely* from jurisdictional legitimacy conditional on duties to foreigners, permitting exclusion *only* for institutional functionality (not culture, welfare, or wages).

  ---

  ### **1. Senior Self-Determination Theorist (David Miller-esque)**  
  **Likely Objection:**  
  *"You’re wasting time on the association analogy – it’s a distraction. Self-determination isn’t reducible to jurisdiction; it’s fundamentally about a *people* controlling its own fate, *including* defining membership. If a people can’t decide who joins, how is their self-determination meaningful? Your ‘jurisdictional’ view ignores the *cultural agency* inherent in collective autonomy."*  

  **Your Reply (2 mins):**  
  "Your point about cultural agency is crucial. But my argument is that *before* we ask what a ‘people’ can decide, we must establish *who has the standing* to make that decision. Jurisdictional legitimacy is the precondition: only a state meeting basic duties to *all* subject to its power (including foreigners at borders) can claim authority to define the ‘people.’ Without this, self-determination risks becoming arbitrary boundary-drawing. This doesn’t negate cultural agency – it constrains it by requiring justification *to those excluded*. Miller’s ‘public culture’ argument, for example, assumes the state already has standing to define it. I’m questioning that standing."  

  - **Where it’s Soft:**  
    Assumes jurisdictional legitimacy is *prior* to self-determination. Millerians see them as co-constitutive.  
  - **Contested Premises:**  
    - **Priority of Jurisdiction:** Highly contested (vs. communitarians/Miller).  
    - **Legitimacy Owed to Foreigners:** Contested (nationalists vs. cosmopolitans).  
  - **Settled Ground:**  
    Self-determination requires *some* control over rules of membership (acknowledge this to show engagement).  

  ---

  ### **2. Migration & Development Colleague (Anti-State-Centric)**  
  **Likely Objection:**  
  *"Your ‘jurisdictional legitimacy’ framework is hopelessly state-centric. What about Somaliland or Haiti, where de facto rulers lack legitimacy but control borders? Or refugee flows where the ‘state’ is absent? If your theory only works for liberal democracies, it’s irrelevant to most migration crises – you’ve built a castle on sand."*  

  **Your Reply (2 mins):**  
  "This is a vital challenge. My framework *presupposes* a Weberian state monopoly on force – it’s explicitly conditional on minimal institutional functionality (*which includes* duties to non-citizens). In cases of state failure, the question shifts: who *ought* to have jurisdiction? The duty to admit/protect might fall to neighboring states or the international community, but *their* legitimacy is still contingent on fulfilling duties to the displaced. Yes, this exposes a gap: my account doesn’t resolve *who* has exclusion rights when territorial control is contested. But it *does* insist that whoever exercises control inherits the legitimacy condition – including duties to foreigners."  

  - **Where it’s Soft:**  
    Doesn’t resolve non-ideal cases (e.g., warlords controlling borders).  
  - **Contested Premises:**  
    - **Weberian State as Baseline:** Contested (esp. in postcolonial/decolonization theory).  
    - **Legitimacy Transfers to De Facto Rulers:** Highly contested.  
  - **Settled Ground:**  
    States failing basic duties lack legitimacy (common in liberal theory; cite Rawls/Pogge).  

  ---

  ### **3. Kantian Cosmopolitan**  
  **Likely Objection:**  
  *"If legitimacy requires duties to foreigners, why stop at functional institutions? Doesn’t ‘justice to outsiders’ imply equal moral concern – meaning open borders *or* massive transfers? Your ‘functionality’ proviso seems arbitrary; why not require egalitarian redistribution before exclusion?"*  

  **Your Reply (2 mins):**  
  "Justice *to* outsiders isn’t justice *for* outsiders in the cosmopolitan sense. My claim is narrower: a state’s legitimacy over territory depends on not inflicting *harm* or *arbitrary disadvantage* on those it excludes. This is a threshold duty, not a full distributive principle. For example, excluding someone fleeing persecution *directly harms* them by returning them to danger – failing the legitimacy condition. Excluding someone to avoid *marginally* lower wages doesn’t. Cosmopolitan equality is a further demand, but legitimacy sets the baseline for state authority to exist at *all*. Without it, exclusion isn’t justified, but fulfilling it doesn’t require equal outcomes."  

  - **Where it’s Soft:**  
    "Arbitrary disadvantage" is underspecified; cosmopolitans will push for a broader definition.  
  - **Contested Premises:**  
    - **Threshold vs. Equality:** Highly contested (Rawlsians vs. Cosmopolitans).  
    - **Harm-Based Duties to Foreigners:** Contested (Blake/Risse vs. Carens).  
  - **Settled Ground:**  
    States have *some* negative duties to foreigners (e.g., non-refoulement).  

  ---

  ### **4. Law & Economics Scholar**  
  **Likely Objection:**  
  *"This is elegant theory, but what’s the *operational* takeaway? If states can only exclude to ‘protect institutions,’ does that mean points systems are illegitimate? Should we scrap family reunification? And what *is* ‘institutional functionality’ – GDP? Bureaucratic capacity? Give me policy implications or admit this is navel-gazing."*  

  **Your Reply (2 mins):**  
  "Fair demand. Policy implications flow from the *grounds* for exclusion:  
  1. **Points systems:** Legitimate if selecting skills vital to institutional function (e.g., healthcare in a crisis), but *not* if used to preserve ‘cultural fit’ or high wages.  
  2. **Family reunification:** Bolsters social stability (a core institution) – so *required*, not discretionary.  
  3. **Refugee quotas:** Non-compliance with them *directly undermines* legitimacy (duty to the persecuted).  
  4. **Guest workers:** Illegitimate if creating a permanent underclass – that *harms* institutional function by corroding rule of law.  
  ‘Functionality’ means maintaining institutions that secure basic rights. Metrics? Start with objective thresholds: capacity to deliver justice, security, and subsistence."  

  - **Where it’s Soft:**  
    "Basic rights" and "subsistence" are contested. Avoid overclaiming policy precision.  
  - **Contested Premises:**  
    - **Policy Prescriptions from Philosophy:** Contested (pragmatists vs. ideal theorists).  
  - **Settled Ground:**  
    States may prioritize vital interests (e.g., security) in admission policies (see Walzer).  

  ---

  ### **5. Department Administrator (Border Guard Question)**  
  **Likely Objection:**  
  *"Let’s bring this down to earth. Suppose a border guard is told to turn away a family fleeing drought under your ‘institutional functionality’ rule. She knows her state *could* take more people without collapsing. Is she complicit in injustice? Should she resign?"*  

  **Your Reply (2 mins):**  
  "The guard acts within an institution whose *overall legitimacy* depends on its systemic duties. Her individual duty is to follow *just procedures* (e.g., non-refoulement), not assess the state’s entire legitimacy. If the policy clearly violates a core duty (e.g., rejecting asylum seekers en masse), she *may* have a conscientious objection – but the primary failure is institutional. Philosophy can’t resolve every individual dilemma, but it clarifies that the state’s authority – not the guard’s discretion – is the problem."  

  - **Where it’s Soft:**  
    Sidesteps the "how much exclusion is too much?" question she’s hinting at.  
  - **Contested Premises:**  
    - **Individual Complicity in Unjust Systems:** Contested (conscientious objection debates).  
  - **Settled Ground:**  
    Low-level officials aren’t responsible for systemic legitimacy (standard in political obligation theory).  

  ---

  ### **6. The Nightmare Question: Emergency Powers**  
  **Likely Objection:**  
  *"Your ‘institutional functionality’ proviso is a Trojan horse. During a pandemic or famine, wouldn’t ‘protecting institutions’ justify *massive* exclusion to preserve healthcare or food security? Haven’t you handed nationalists exactly what they want?"*  

  **Your Reply (2 mins):**  
  "This is the hardest case – and I concede the proviso *could* be abused. But legitimacy requires *proportionality* and *non-arbitrariness*. Shutting borders to all during a pandemic *might* be justified if: (a) the threat is imminent and catastrophic, (b) less restrictive measures fail, and (c) exclusions are time-limited. But banning migrants *solely* to ‘preserve culture’ during a crisis? That’s arbitrary – no empirical link to functionality. The key is: the same legitimacy test *still applies*. If exclusion violates duties to foreigners (e.g., blocking refugees from a warzone during a pandemic), it’s illegitimate even in emergencies."  

  - **Where it’s Soft:**  
    No bright line for "proportionality" in crises. Requires empirical judgment.  
  - **Contested Premises:**  
    - **Emergency Powers Derogation:** Highly contested (liberty vs. security debates).  
    - **Proportionality in Migration:** Underexplored.  
  - **Settled Ground:**  
    States may take extraordinary measures in existential crises (e.g., quarantine), but not as a blanket justification.  

  ---

  ### **Overall Q&A Strategy**
  - **Steel Yourself For:** The Millerian and Cosmopolitan going for the jugular on contested premises.  
  - **Deflect Gracefully:** "That’s beyond this paper’s scope, but I take the point for future work" – especially for non-ideal cases.  
  - **Concede Where Necessary:** "You’re right that proportionality needs more work – I’m developing this now."  
  - **Beware Of:** Slipping into policy wonkery (irritates philosophers) or hyper-abstraction (irritates empiricists).  
  - **Secret Weapon:** Frame your view as *procedural* – it forces states to *justify* exclusion in terms of legitimacy, shifting the burden onto them.  

  **Final Tip:** Start your Q&A with: "I’ve sketched a deliberately provocative framework – my goal today is to stress-test it with you." This disarms critics by inviting collaboration.  

  You’ve got this. The fact you’re prepping this hard means you’re ready. Go wound some sacred cows.
