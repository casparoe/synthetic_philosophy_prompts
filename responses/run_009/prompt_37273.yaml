  ### Decision Tree: Positions in Scientific Realism  
  **Starting Commitment:** The predictive success of mature physical theories requires explanation beyond sheer luck or selection bias (e.g., why do theories like atomic theory or electromagnetism predict novel phenomena so well?).

  #### Q1: When a predictively successful theory is replaced (e.g., phlogiston by oxygen theory), is its success best explained by the theory being approximately true?  
  - **Yes** → Go to Q2.  
  - **No** → Go to Q8.  

  #### Q2 (Realism Path): Should we believe our *current* best theories (e.g., quantum field theory) are approximately true in their entirety?  
  - **Yes** → **Convergent Realism**  
    - *Awkward commitment:* Faces the pessimistic induction: if past successful theories (e.g., ether) were false, why trust current ones?  
  - **No** → Go to Q3.  

  #### Q3: In theory shifts (e.g., Fresnel’s ether optics to Maxwell’s electromagnetism), is the preserved element primarily the mathematical structure (equations) rather than the nature of entities?  
  - **Yes** → Go to Q4.  
  - **No** → Go to Q6.  

  #### Q4: Do unobservable entities (e.g., electrons) possess intrinsic properties (i.e., properties not defined by relations to other entities)?  
  - **No** → **Ontic Structural Realism**  
    - *Awkward commitment:* Relations without relata—how can structure exist without objects to instantiate it?  
  - **Yes** → Go to Q5.  

  #### Q5: Can we know these intrinsic properties (e.g., an electron’s non-relational essence)?  
  - **No** → **Epistemic Structural Realism**  
    - *Awkward commitment:* We are forever ignorant of the intrinsic nature of the world, even if structures are knowable.  
  - **Yes** → **Unoccupied**  
    - *Diagnosis:* Incoherent—if intrinsic properties are knowable and preserved, history (e.g., phlogiston’s properties discarded) suggests they are not.  

  #### Q6 (Non-Structural Path): Is belief in an unobservable entity (e.g., quarks) warranted primarily when we manipulate it to affect other phenomena (e.g., using electrons in microscopy)?  
  - **Yes** → **Entity Realism**  
    - *Awkward commitment:* Cannot justify belief in entities we cannot manipulate (e.g., distant galaxies).  
  - **No** → Go to Q7.  

  #### Q7: Is our knowledge of unobservable entities restricted to their causal properties (e.g., charge or spin, as they affect measurements)?  
  - **Yes** → **Semi-Realism**  
    - *Awkward commitment:* Blurs the line between causal and intrinsic properties (e.g., is mass intrinsic or causal?).  
  - **No** → **Selective Realism**  
    - *Awkward commitment:* No clear criterion to identify “essential” parts of a theory (e.g., which aspects of Newtonian gravity were “preserved” in GR?).  

  #### Q8 (Anti-Realism Path): Are scientific theories truth-apt descriptions (capable of being true/false) of observable phenomena?  
  - **No** → **Instrumentalism**  
    - *Awkward commitment:* Cannot explain why theories predict successfully if they are mere tools, not truth-tracking.  
  - **Yes** → Go to Q9.  

  #### Q9: Should we believe successful theories are true about observable phenomena (e.g., gas laws predict pressure changes)?  
  - **No** → **Unoccupied**  
    - *Diagnosis:* Unattractive—skepticism about observables undermines science’s empirical basis.  
  - **Yes** → Go to Q10.  

  #### Q10: When theories change, does the preserved mathematical structure (e.g., Poisson’s equation in gravity models) reveal something real about the world?  
  - **Yes** → **Structural Empiricism**  
    - *Awkward commitment:* Grants reality to structure but not entities, risking incoherence (e.g., can relations exist without things to relate?).  
  - **No** → **Constructive Empiricism**  
    - *Awkward commitment:* Underdetermination—many theories fit the same data, so why prefer one?  

  ---

  ### Note to the Instructor  
  Three branch questions were particularly challenging to phrase neutrally:  
  1. **Q1 (No-Miracles Intuition):** Anti-realists (e.g., van Fraassen) reject the premise that approximate truth is the *only* explanation for success, as selection effects or empirical adequacy suffice. Phrasing it as a binary choice risks biasing students toward realism.  
  2. **Q10 (Structure’s Reality):** Distinguishing structural empiricism from epistemic structural realism hinges on whether structure “reveals something real.” Realists see this as a claim about mind-independent reality; empiricists see it as pragmatic. Students might conflate the two, as both endorse structure’s utility. The tree honestly reflects this limitation—positions are separated only by prior answers to Q1.  
  3. **Q4 (Intrinsic Properties):** This metaphysical question is alien to many physicists. I used “properties not defined by relations” for clarity, but some (e.g., ontic structural realists) argue all properties are relational, potentially framing the debate in an unpopular way.  

  The tree minimizes violence to the debate by grounding questions in historical cases (e.g., Q3 uses Fresnel/Maxwell) and avoiding jargon. Positions like structural empiricism and epistemic structural realism are distinguished only by Q1 (realism vs. anti-realism), as you anticipated—this is noted in the tree’s structure.
