  - Paper/board = the brain/embodied mind  
  But here's the rupture: Escher's real hand and viewer don't cleanly map. There's no "external artist" for consciousness; the mind's loop *is* the whole system. The friend's analogy snaps when applied here.

  The user suspects fiction is either framed (like art) or frameless (like mind). Exactly. Fiction *is* framed; minds *aren't*. So:  
  - Editor is right that the device is just artifice (readers know it's a trick).  
