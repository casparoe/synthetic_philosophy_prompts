  ### Minimal Pair of Variants for the Surprise Examination Paradox

  I present two variants that isolate the variable of whether the students *know* the teacher's announcement to be true (knowledge variant) versus merely having a *justified true belief* in it (mere-belief variant). The announcement is identical in both and adheres to the specifications: it states that an exam will occur on exactly one of Monday, Tuesday, or Wednesday, and on the morning of the exam, the students will not be able to deduce (from the announcement and their knowledge) that the exam is that day. The teacher is truthful, fixes the exam day in advance, and holds the exam on the announced terms without randomness or forgetfulness. The key difference is the epistemic status of the students' acceptance of the announcement.

  - **Knowledge Variant**: The students know the teacher's announcement to be true. This is based on their knowledge that the teacher is truthful (a fact established by past interactions), and they have no doubt about the announcement's truth. They treat the announcement as a known constraint.
    
  - **Mere-Belief Variant**: The students have a justified true belief in the announcement but do not know it. Their justification comes from the teacher's generally truthful history, but they harbor a small, reasonable doubt: they consider it possible (though unlikely) that the teacher might be mistaken or deceptive in this instance. Crucially, this doubt is not strong enough to make them disbelieve the announcement; they still justifiably believe it and act on it. However, because of this residual uncertainty, they cannot rule out scenarios where the announcement is false (e.g., no exam occurs). The announcement is still true, and the teacher holds the exam as stated.

  Both variants are identical in all other respects: the announcement wording, the exam period, the teacher's truthfulness and reliability, and the definition of surprise (inability to deduce the exam day on the morning). The mere-belief variant does not violate any specifications; the doubt is consistent with justified true belief without knowledge (e.g., a Gettier-style element where luck prevents true belief from rising to knowledge).

  #### (a) Backward Induction in Each Variant

  **Knowledge Variant**  
  The students, knowing the announcement is true, attempt backward induction before the exam period:

  - **Wednesday step**: If no exam occurs by Wednesday morning, the students reason that, knowing the announcement is true, the exam must be on Wednesday. But the announcement forbids deducing the exam day on the morning of the exam, so an exam on Wednesday would violate it. Thus, they conclude the exam cannot be on Wednesday.  
    **Failure**: This step loses validity. The premise that fails is that the students *still know the announcement is true* on Wednesday morning. After completing the induction, the students realize the announcement leads to a contradiction (no possible exam day), so they cease to believe it. On Wednesday morning, if no exam has occurred, they do not deduce the exam is that day because they now doubt the announcement (e.g., they think there may be no exam). Thus, surprise is possible on Wednesday.

  - **Tuesday step**: If no exam on Monday, and assuming Wednesday is eliminated, the students reason that the exam must be on Tuesday. But deducing this on Tuesday morning would violate the announcement, so they conclude Tuesday is impossible.  
    **Failure**: This step is never reached because the Wednesday step fails first. Even if attempted, it relies on the invalid Wednesday elimination.

  - **Monday step**: With Tuesday and Wednesday eliminated, the students would deduce the exam is on Monday, violating the announcement.  
    **Failure**: This step is never reached due to prior failures.

  *Outcome*: The induction collapses at the Wednesday step. The exam can occur on any day. For example, if held on Wednesday, the students (having abandoned belief in the announcement) do not deduce it on Wednesday morning, satisfying surprise.

  **Mere-Belief Variant**  
  The students, with justified true belief but residual doubt, attempt backward induction:

  - **Wednesday step**: If no exam by Wednesday morning, the students reason that *if* the announcement is true, the exam must be on Wednesday. But due to their doubt, they cannot rule out that the announcement is false (e.g., no exam). Thus, they cannot deduce the exam is on Wednesday. An exam on Wednesday does not violate surprise. Wednesday remains possible.

  - **Tuesday step**: If no exam on Monday, the students consider: the exam could be on Tuesday, Wednesday, or there might be no exam (if the announcement is false). They cannot rule out Wednesday or the no-exam scenario, so they cannot deduce the exam is on Tuesday. Tuesday remains possible.

  - **Monday step**: On Monday morning, the students consider all days and the possibility of no exam. They cannot deduce the exam is on Monday. Monday remains possible.

  *Outcome*: The induction runs fully without eliminating any day. The exam can occur on any day without violating surprise, as doubt prevents deduction.

  #### (b) Structural Feature, Its Role, and Deletion

  - **Structural Feature**: The knowledge variant has an **inconsistency between the announcement's truth and the students' ability to maintain belief in it during induction**. The mere-belief variant lacks this because doubt prevents the inconsistency from arising.
    
  - **Role in Induction**: In the knowledge variant, the inconsistency forces students to abandon belief in the announcement when induction implies its falsity. This breaks the induction at the first step (Wednesday), as the students no longer accept the announcement as a premise on Wednesday morning. In the mere-belief variant, doubt acts as a "buffer": students never fully trust the announcement, so induction does not lead to a contradiction, and belief persists.

  - **Effect of Deletion**:
    - If the inconsistency feature is deleted from the knowledge variant (i.e., students cannot abandon belief), induction would run through, concluding no exam is possible. But this contradicts the exam's occurrence, violating Specification 4 (teacher holds the exam). Thus, the variant becomes infeasible.
    - If the inconsistency feature is added to the mere-belief variant (e.g., by removing doubt), it collapses into the knowledge variant, and induction fails as above.

  #### (c) Reply to the Self-Refutation View and Impact of the Pair

  - **Strongest Reply to Self-Refutation**: A proponent of the induction's soundness might argue that the announcement is self-refuting because it inevitably leads to a contradiction when known. Thus, it cannot be true and known simultaneously, explaining why the exam seems impossible in the induction. The paradox is "resolved" by declaring the announcement self-defeating.

  - **Impact of the Pair**: This pair forces the self-refutation view to be abandoned. In the knowledge variant, the exam occurs (e.g., on Wednesday) without violating surprise because the students' prior induction undermines their belief, preventing deduction on the exam morning. The announcement is not self-refuting; it is fulfilled through the students' epistemic shift. The pair shows that the paradox arises from a flaw in the induction (overlooking belief abandonment), not an inherent self-refutation. Thus, the view must be redescribed: the announcement *can* be true and satisfied, but induction is invalid if it ignores how students' beliefs evolve.

  #### (d) Purpose of the Pair

  This pair tests the **epistemic status resolution** of the paradox, which attributes the paradox to the students knowing the announcement rather than just believing it. Proponents (e.g., philosophers like Wright and Sudbury) argue that knowledge introduces infallibility that amplifies contradictions, while belief allows doubt to block induction. The pair isolates this by showing:
  - In the knowledge variant, induction fails due to belief abandonment, allowing surprise.
  - In the mere-belief variant, doubt prevents elimination of days, allowing surprise without induction failure.
  The difference in verdicts (induction fails vs. runs fully) derives solely from the epistemic status variable, not fiat. It avoids collapse by ensuring the knowledge variant involves an unsustainable belief shift, while the mere-belief variant maintains consistent belief. This validates the resolution: knowledge causes the paradox's bite, but careful analysis shows it is resolvable.
