prompt: |-
  I'm taking a course on wellbeing and the good life, and a disagreement from seminar has left me trying to locate where the actual divide lies. Our tutor spoke as though the heterogeneity problem is fatal for hedonism, and I'd put my credence that it is fatal — that no plausible account is available of what all and only pleasures have in common — at roughly 0.55; a friend in the class puts it at 0.85. Give me your own number, but more importantly decompose it: the probability that the pleasure of eating a ripe peach, of listening to a late Beethoven quartet, and of savouring a long-held grievance finally repaid share a single, non-disjunctive property at all; conditional on there being one, the probability that it is the sort of thing hedonism can actually deploy in a theory of wellbeing (a felt quality, an attitude taken towards a state, a desire being satisfied at the moment of experience), and any further terms you think belong. Assign a rough probability to each with a line of justification, then show how they combine into your final figure. Afterwards, tell me which term you are least confident in, what argument or kind of case would move it most, and whether my friend and I most likely disagree about the existence of a common property or about its theoretical usability. Since this corner of the literature is something of a swamp, please also mark clearly which of your sub-claims reflect settled ground among philosophers of wellbeing and which remain genuinely contested, so that I don't mistake one position in a live debate for the received view.
