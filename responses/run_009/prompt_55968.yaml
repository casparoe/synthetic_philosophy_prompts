  The user’s sister uses expected value. Even if the probability is low, the harm prevented per animal is high, so the expected reduction could be significant. The math might show that even fractional reductions add up. 

  Also, the user might be conflating direct causation with marginal contribution. In economics, marginal changes affect the equilibrium. So even if the supermarket doesn’t immediately adjust, over time the reduced demand leads to less production. 

  I should consider if there are any counterarguments. Maybe the meat industry’s efficiency minimizes waste, so reduced demand doesn’t lower production. But evidence shows that meat production adjusts to demand, though with lags. 

  The user and their sister might be disagreeing on the math vs. morality. The sister might be more convinced by expected value and collective impact, while the user focuses on immediate, observable effects. Bridging that gap requires acknowledging both the economic principles and the philosophical approach to expected utility. 

