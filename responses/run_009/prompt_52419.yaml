  Next, the disagreements table requires phrasing each point from both perspectives without bias. For instance, comparativist: "Ordinal comparisons are feasible and necessary." Anti-comparativist: "Ordinal comparisons are incoherent across distinct atrocities." Need to differentiate between ordinal (ranking) and cardinal (quantitative) comparisons. Also, address per-victim vs. aggregate suffering. Clarify if any disagreements are verbal, like "incommensurable" vs. "incomparable."

