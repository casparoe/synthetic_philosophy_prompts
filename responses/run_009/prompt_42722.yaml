prompt: |-
  I'm defending my thesis in about two weeks and need to get ready for the Q&A, and honestly the committee situation is a bit unusual so I want to be careful about who will come at me from which angle. The thesis: special duties to compatriots are real, but they don't come from shared culture, national identity, or anything sentimental like that. They come from the state's ongoing coercion of everyone inside its borders. Basically my claim is that the special claims compatriots have on each other are downstream of the coercive apparatus itself -- you and I are both subject to the same police, courts, tax authority, etc., and that shared subjection is what makes us owe each other things we don't owe strangers abroad. On this view a cosmopolitan who says "borders are morally arbitrary so duties can't stop at them" is answering the wrong question -- the arbitrariness of borders doesn't matter because the duties track the coercion, not the line on the map. And the communitarian who roots special duties in shared culture is wrong too, but for the opposite reason.

  The room: a politics/philosophy workshop, maybe 20 people. The composition matters, so let me lay it out. There's one very senior Kantian who thinks duties have to be grounded in universal reason and will not like that coercion, of all things, generates anything positive. There are two effective-altruist types, grad students mostly, who are strong cosmopolitans and will do the drowning-child / distance-is-arithmetic argument with total sincerity. There's one old-school communitarian who is actually kind of on my side conclusion-wise (compatriots do have special claims) but will hate my grounds, and I expect him to be the most personally invested critic. A handful of undecideds who mostly want to see whether the position is just nationalism in a nicer jacket.

  What I want from you: a prep sheet, not a defense of the view for its own sake. List the objections I'm actually going to get from this specific room, in rough order of how much damage they'd do, each phrased the way that person would actually phrase it (the Kantian's version of an objection is not the EA's version of the same objection, even when it's basically the same worry). For each: a reply I can give in about two minutes, and, honestly, where the reply is soft -- I'd rather know that now than find out in the room. Please include the one question I'm quietly hoping nobody asks, and tell me if you think it's actually as dangerous as I think it is or whether I'm overestimating it.

  One more thing: if there's an objection where the right move is to conceed something up front rather than fight it, flag that too. I'd rather make a small concesion early and keep the core intact than go down defending everything. And if you think one of my premises (the coercion one, probably) is doing way more work than I realize, say so. Thanks!
reasoning: |-
  Okay, the user is preparing for their thesis defense in two weeks and needs help anticipating objections from their specific committee members. Their thesis argues that special duties to compatriots arise from shared subjection to state coercion, not from culture or national identity. They've outlined the committee: a Kantian, two EA types, a communitarian, and some undecideds.

  First, I need to understand each critic's perspective. The Kantian will object to coercion generating duties, seeing it as non-universal and non-autonomous. The EAs will push the drowning-child argument, emphasizing that physical distance shouldn't matter. The communitarian will resist replacing cultural ties with coercion. The undecideds will worry this is just nationalism repackaged.

  The user wants damage-ranked objections in each person's phrasing, with concise replies and flags for soft spots. They also want to know the "dangerous question" they're hoping won't be asked.

  For the Kantian, the key objection is that coercion can't ground duties because duties must stem from reason. My reply should concede coercion isn't "good" but argue it creates relational obligations. The soft spot is that this might not feel "moral" enough for Kantians.

  The EAs will argue that coercion shouldn't override basic moral equality. I need to reframe coercion as creating new obligations without denying baseline duties. The soft spot is explaining why physical proximity matters less than institutional proximity.

  The communitarian will protest that coercion is too thin to bind people. My reply should position coercion as the minimum viable basis in diverse societies. The soft spot is whether this can generate strong enough duties.

  For undecideds, I'll address the nationalism concern by distinguishing coercion-based duties from ethnic nationalism. The soft spot is that this might still justify exclusion.

  The dangerous question is probably about oppressed minorities having duties to their oppressors. The reply should differentiate between the existence of duties and their content, but this is genuinely tricky.

  I'll also note that the coercion premise is carrying maximum weight - if it fails, the whole argument collapses. The user should be ready to defend why coercion creates obligations rather than just resentment.

  Finally, I'll include tactical advice: concede that coercion isn't ideal to the Kantian, and emphasize "relationality over sentimentality" to the communitarian. The core move is separating the source of duties from their content - coercion binds, but doesn't justify unjust coercion.
answer: |-
  Here’s your prep sheet, tailored to your committee’s likely angles, ordered by potential damage (high to medium), with objections phrased in their voices, strategic replies, soft spots flagged, and tactical concessions. The "*coercion premise*" is your linchpin—if it wobbles, the whole structure risks collapse. I’ll finish with the "dangerous question."

  ---

  ### **1. The Kantian (Highest Damage: Undermines moral foundations)**  
  **Likely Objection:**  
  *"You’ve made a category error. Coercion is a violation of autonomy—the very antithesis of moral duty. How can a *wrong* (state coercion) generate a *right* (duties to compatriots)? Moral obligations must arise from universal practical reason, not contingent force. This reduces ethics to power relations."*  

  **Your 2-Minute Reply:**  
  "Respectfully, I’m not arguing coercion *creates* morality. I’m arguing it creates a *relational context* that triggers special obligations. Think of Rawls’ basic structure: the state coerces all equally to maintain justice, and that shared framework generates duties of reciprocity among participants. Even Kant acknowledges duties of right (*Recht*) arise from coexisting in a coercive juridical order. My claim is that *within* that order, compatriots owe each other more because they jointly sustain and suffer under its machinery. The duty isn’t to *endorse* coercion but to rectify its burdens fairly among co-subjects."  

  **Soft Spot & Concession:**  
  - **Soft:** If pressed, this may feel like "duties from injustice." Concede that coercion isn’t *ideal*, but stress it’s the *actual* condition that binds us.  
  - **Tactical Concession:** *"I agree coercion alone can’t ground *universal* duties—but it *can* ground *relational* ones among those subjected to the same system."*  

  ---

  ### **2. The Communitarian (High Damage: Personal investment, may sway undecideds)**  
  **Likely Objection:**  
  *"This is morally barren! You’ve stripped patriotism of all meaning. If duties come from coercion, not shared history or values, why should I care about my compatriot? Your ‘duties’ sound like paying a tax bill, not loyalty. Can this *really* motivate sacrifice or solidarity? Or is it just nationalism without a soul?"*  

  **Your 2-Minute Reply:**  
  "My point isn’t that solidarity *feels* like coercion—it’s that coercion *enables* the conditions for demanding solidarity. Shared culture can inspire loyalty, but it’s exclusionary and arbitrary (e.g., who ‘counts’ as sharing it?). Coercion is non-voluntary and universal within borders. When the state forces us into a collective project—taxes, laws, defense—it creates *material interdependence*. We owe each other because we’re *stuck* in a system where my compliance relies on yours. That’s *thicker* than sentiment: it’s a debt of reciprocity for upholding a structure we all need."  

  **Soft Spot & Concession:**  
  - **Soft:** This won’t satisfy someone who ties duties to *affective* bonds.  
  - **Tactical Concession:** *"I grant that shared culture *enhances* solidarity—but it’s not necessary for the *duty* itself. Coercion is the baseline in diverse societies."*  

  ---

  ### **3. Effective Altruists (Medium-High Damage: Challenges core cosmopolitan intuition)**  
  **Likely Objection:**  
  *"If I’m coerced equally with someone 5,000 miles away under a brutal regime, why don’t I owe them the same duties? Distance is arithmetic, but your coercion criterion draws arbitrary lines. Isn’t this just smuggling in statist prejudice? Shouldn’t we prioritize need, not passports?"*  

  **Your 2-Minute Reply:**  
  "Coercion isn’t global; it’s territorially bounded and *reciprocal*. You and a distant foreigner aren’t mutually subjected to the *same* enforcement system. My tax dollars fund *our* roads, not theirs; our courts resolve *our* disputes. This reciprocity—where we all contribute to and draw from the same coercively maintained pool—creates special claims. Cosmopolitan duties *exist* (e.g., aid to those in absolute need), but they’re general. Compatriot duties are specific because we’re *joint authors* of each other’s constraints. The drowning child isn’t in your state’s coercive web—that’s why pulling her out is charity, not reciprocity."  

  **Soft Spot & Concession:**  
  - **Soft:** EAs may retort that reciprocity is morally irrelevant vs. suffering.  
  - **Tactical Concession:** *"I agree we have *some* duties to distant strangers—but they’re weaker because they lack the *relational* element of shared subjection."*  

  ---

  ### **4. Undecideds / "Nicer Nationalism?" Concern (Medium Damage: Reputational risk)**  
  **Likely Objection:**  
  *"Isn’t this just a fancy excuse for ‘us first’? If duties track coercion, won’t this justify excluding refugees (they’re not coerced here) or ignoring global poor? How is this different from nationalist realism?"*  

  **Your 2-Minute Reply:**  
  "Not at all. Nationalism says ‘our culture deserves priority.’ My view says ‘our *institutional entanglement* creates duties.’ This *limits* compatriot preference: if the state coerces unjustly (e.g., apartheid), duties among co-citizens include *reforming* it. Refugees impose no reciprocal burden? Then we owe them *general* duties of rescue. But once inside our coercive system, they become compatriots. This isn’t tribalism—it’s institutional realism."  

  **Soft Spot:**  
  - If your theory can’t explain duties *to* newcomers, you look exclusionary. Stress: *"Subjection, not birth, triggers duties. Immigrants owe and are owed from Day 1."*  

  ---

  ### **The Dangerous Question (You’re Right to Fear This)**  
  **Likely Source:** Kantian or EA, probing the *coercion premise*.  
  **The Question:**  
  *"If coercion grounds duties, do oppressed minorities owe *more* to their oppressors (since they’re coerced by the same state)? Doesn’t this perversely burden the victim?"*  

  **Why It’s Dangerous:**  
  It exposes a tension: if duties arise *from* coercion, the heavily coerced (e.g., marginalized groups) seem to incur *greater* obligations to the privileged who benefit from the system. This could invert justice.  

  **Your Best Reply (2 mins):**  
  "Duties arise from *shared subjection*, but their *content* is shaped by fairness. Oppressors violate reciprocity by wielding coercion unjustly. The minority’s duty isn’t to acquiesce—it’s to demand the state *cease* oppressive coercion and restore equal standing. Their ‘special duty’ is to hold co-citizens accountable, not submit. Meanwhile, the privileged owe *reparative* duties for exploiting the system."  

  **How Bad Is It?**  
  **High risk, but survivable.** If you pivot to "duties include reforming coercion," you recover. *Never* say the oppressed "owe more." Stress:  
  - *"Coercion creates the relationship, but justice defines the duties."*  
  - *"The duty is *mutual*—oppressors fail their obligations first."*  

  ---

  ### **Key Strategic Takeaways**  
  1. **Defend the *Coercion Premise* Relentlessly:**  
     - It’s your engine. Preempt by framing coercion as "creating relational obligations, not moral worth."  
  2. **Concede Early Where Needed:**  
     - To Kantian: *"Coercion isn’t moral—it’s the context."*  
     - To Communitarian: *"Culture matters, but isn’t necessary."*  
     - To EAs: *"We owe strangers something—just less."*  
  3. **Reframe "Arbitrariness":**  
     - "Borders *are* arbitrary—but the coercion within them isn’t. That’s what matters."  
  4. **Undercut Nationalism Accusation:**  
     - Hammer: *"This applies to any coercive state, even multinational ones. No ethnic/cultural baggage."*  

  You’ve got a tight, original argument. The room’s objections are fierce but predictable. **Prioritize:** Kantian > Communitarian > Dangerous Question > EAs > Undecideds. Good luck—coercion’s got your back. 💪
