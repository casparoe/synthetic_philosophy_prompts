prompt: |-
  I spent the better part of my career in vision science, where one of the few clean distinctions available to us was that between a veridical percept and an illusion, and since retiring I have been reading steadily in metaethics and moral psychology. A distinction I now encounter constantly is that between a moral "preference" and a moral "bias," and the literature, as far as I can tell, treats it on the model my old field would use: a bias is to a preference as an illusion is to a veridical perception — a systematic error that the right sort of check can expose, much as the Müller-Lyer figure is exposed by reaching for a ruler. If that mapping holds, it suggests something I find rather attractive: that moral biases could be identified, and perhaps corrected, using morally neutral tests — inconsistency across structurally similar cases, sensitivity to morally irrelevant factors such as framing or the order in which cases are presented, discordance with the subject's other considered commitments — without anyone first taking a stand on the underlying moral questions. My reading group was skeptical of this; one member objected that the analogy quietly assumes there is such a thing as "veridical" moral perception for the biases to be deviations from, and that this is precisely what is in dispute.

  I would therefore like a proper audit of the analogy. Please begin with an explicit correspondence table: what plays the role of the stimulus, the percept, the illusion, the measuring instrument, and the observer. Then identify where the mapping breaks, and kindly distinguish the disanalogies that matter for my intended use — the hope for morally neutral bias-detection — from those that do not. Conclude with a verdict: does the neutral-testing program survive once the disanalogies are on the table, or was the analogy carrying it the whole time? If some better analogy is available for the preference/bias distinction, name it and say in a sentence what it gets right that the perceptual model gets wrong. Please keep the entire answer to 500 words or fewer; I would rather have a disciplined page than a sprawling essay.
reasoning: |-
  Okay, let me tackle this user's query methodically. The user is drawing an analogy between perceptual illusions in vision science and moral biases in metaethics, hoping to show how moral biases can be detected through neutral tests without resolving underlying moral disputes. The core challenge is auditing whether this analogy holds up, especially regarding neutral bias-detection.

  First, I need to map the vision science concepts to their proposed moral equivalents. The stimulus would be the moral scenario, percept is the moral judgment, illusion corresponds to bias, veridical percept to correct preference, ruler to consistency tests, and observer to the moral agent. This seems straightforward, but the user's reading group already raised a key concern: the analogy assumes a "veridical" moral baseline, which is philosophically contentious.

  The critical disanalogy lies in the lack of an independent moral measurement tool. In vision science, rulers provide objective verification separate from perception. In ethics, consistency tests (like framing sensitivity) still rely on the agent's existing judgments - there's no external standard. This directly threatens the user's neutral-testing program because what counts as "inconsistency" might itself depend on moral assumptions.

  For the user's purpose, other disanalogies (like stable stimuli vs. complex cases) seem less critical. The core issue is whether bias-detection can truly be neutral without an objective moral standard. While I should acknowledge alternative analogies like cognitive biases, they share similar limitations regarding neutrality.

  Ultimately, the analogy fails to support fully neutral bias-detection because moral "inconsistency" isn't provably erroneous like perceptual illusion - it might reflect reasonable moral distinctions. The testing program might identify inconsistencies, but calling them "biases" requires additional normative assumptions. The conclusion should be honest: the analogy carries too much weight for the intended application, though the testing approach remains pragmatically useful for personal reflection.
answer: |-
  Here is your requested audit of the perceptual illusion analogy for moral preferences and biases:

  **Correspondence Table:**

  | Vision Science Concept | Moral Psychology Analog |
  |------------------------|--------------------------|
  | Physical Stimulus      | Moral Scenario/Case      |
  | Percept                | Moral Judgment/Intuition |
  | Veridical Percept      | "Correct" Preference/Commitment |
  | Illusion               | Bias                     |
  | Measuring Instrument (Ruler) | Tests for Consistency, Framing Invariance, Order Invariance, Coherence with Prior Commitments |
  | Observer               | Moral Agent/Judge        |

  **Critical Disanalogies & Impact:**

  1.  **Lack of Independent Access to the "Stimulus Truth":** (Matters **Critically**)
      *   **Vision:** The ruler provides independent, physical access to the stimulus property (line length), objectively verifying the percept as illusory or veridical.
      *   **Morality:** There is no universally agreed-upon, morally neutral "ruler" (objective moral truth) accessible independently of moral perception/judgment itself. We lack a non-moral standard to definitively call a preference "veridical" and a bias an "error." Your tests (inconsistency, framing sensitivity) flag *internal* incoherence, not necessarily error relative to an external truth. What constitutes "irrelevant" framing may itself be morally contested.

  2.  **The Nature of the "Stimulus":** (Matters **Less** for neutral detection)
      *   **Vision:** Stimuli are relatively stable physical properties.
      *   **Morality:** Moral scenarios involve complex, often unique, social, intentional, and contextual factors, making "structurally similar" harder to define neutrally. However, your proposed tests *aim* to identify inconsistency *despite* this complexity.

  3.  **Observer Passivity vs. Agency:** (Matters **Somewhat**)
      *   **Vision:** Perception is largely automatic and passive.
      *   **Morality:** Judgment often involves reasoning, principles, and agency. While biases can be automatic, the "correction" process is more complex than simply applying a ruler. This doesn't prevent detection via your tests, but complicates correction.

  **Verdict on the Neutral-Testing Program:**

  The analogy **fails to fully support** the hope for *completely morally neutral bias-detection* **in the strong sense** of identifying deviations from an objective moral truth. The critical disanalogy (#1) means your tests (inconsistency, framing effects) can successfully identify *internal incoherence* within an agent's own set of judgments or commitments without resolving underlying moral truths. This is valuable for exposing psychological influences and prompting reflection.

  However, labeling this incoherence as "bias" (systematic *error*) rather than mere "inconsistency" **does implicitly rely on the assumption** that coherence (or invariance to irrelevant factors) is a mark of correctness. While a powerful regulative ideal, this assumption is itself a normative stance, not a purely neutral empirical fact. Your program survives for *detecting inconsistency*, but the *interpretation* of that inconsistency as "bias" (error) rather than, say, reasonable sensitivity to complex features, requires additional (contestable) philosophical argument.

  **Alternative Analogy:**

  A better fit might be **cognitive biases in reasoning** (e.g., base rate neglect, conjunction fallacy). Here, deviations from normative rules of logic or probability *can* be identified neutrally using tests (like the Linda problem) without resolving the truth of the *specific conclusion*. The disanalogy is that logic/probability norms are less contested than moral norms, but the *structure* of detecting deviation from a procedural standard (coherence, consistency, invariance) is very similar to your program.
