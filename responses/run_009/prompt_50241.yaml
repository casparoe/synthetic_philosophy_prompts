  One chance in googolplex, still not quite nil—  
  *My sister spits her wine:* “A sucker’s trade!  
  Some guru’s fairy tale, a placebo pill!”  
  For stakes that span the cosmos we might save.  

  “When numbers swell past sense, they cease to weigh—  
  What’s ‘infinite’ to ants? A blank, a void.”  
  One chance in googolplex, still not quite nil.  

  She points downstairs: “That shelter’s heat’s gone gray.  
  *Real* breath clouds glass—not paper ghosts deployed—”  
  For stakes that span the cosmos we might save.  

  “The whole block knows you’re being milked each day,  
  Your life drained dry for phantoms on a screen.”  
  One chance in googolplex, still not quite nil.  

  I walk home blind. Her logic shreds, disarms—  
  Yet zero stays a fortress none can storm.  
  One chance in googolplex, still not quite nil,  
  For stakes that span the cosmos we might save.  

