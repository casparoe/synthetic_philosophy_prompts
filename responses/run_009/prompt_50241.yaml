  ### Key Design Notes  
  - **Refrain Ambiguity**: "still not quite nil" evolves from statistical fact (stanza 1) to moral absolution (stanza 5). "Cosmos we might save" shifts from ambition (stanza 1) to delusion (stanza 4).  
  - **Couplet Chill**: By finally merging the refrains, the poem reveals the fanatic’s core pathology: probability and payoff, once separated, now *feed* each other.  
  - **Philosophical Rigor**: Each objection mirrors real fanaticism debates (e.g., Bostrom's "Pascal's Mugging," Parfit's "repugnant conclusion").  
  - **Meter Flexibility**: Deliberate metrical breaks in objections (e.g., "sucker’s trade") heighten emotional realism.  

  This structure forces the reader to experience the fanatic’s circular logic: like the villanelle’s form, her reasoning admits no new variables.
