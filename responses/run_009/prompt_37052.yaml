prompt: |-
  I cover science and ideas for a national newspaper, and an increasing share of my beat consists of expert advisory bodies: vaccine safety committees, dietary guideline panels, drug advisory boards, and the occasional multinational consortium issuing a consensus statement. The recurring problem is how to characterize, in a two-hundred-word brief filed on deadline, what a panel actually decided — because what a panel collectively concludes is often not what a majority of its members individually believe. The judgment-aggregation literature has a name for the cleanest version of this, the discursive dilemma, along with a family of distinctions I only half understand: premise-based versus conclusion-based aggregation, agenda-sensitivity, oligarchic rules, the possibility that a group's official position is one no member holds. What I need is a procedure a working reporter can actually run.

  Please write that procedure: an ordered sequence of steps for deciding, given a committee's vote record or published annex, whether to lead with the collective conclusion as issued, whether to report the premise-level votes instead, when the word "split" is honest and when it misleads, and when the aggregation method itself is the story. For each step, state what counts as a sufficient answer, and what to do when the record is incomplete or the aggregation rule is undisclosed. The procedure must run in the ninety minutes between a press release landing and my deadline; it must be usable by a reporter who can read a technical annex but has never studied formal logic; and it must mark the points at which it stops and hands the question to a human — for instance, whether a committee's chosen aggregation rule is normatively legitimate is not something a reporter can adjudicate on deadline, but whether the rule was disclosed is a reportable fact.

  Then run the procedure on three cases. First: a nine-member vaccine advisory committee where the proposition that an adverse event is causally linked to a vaccine passes five to four, the proposition that the link is serious enough to outweigh the benefit in a given subgroup passes five to four on the strength of a different majority — one member in the overlap — so that the recommended contraindication fails eight to one, and the committee announces it found no basis for restricting use. Second: a dietary panel that is unanimous, nine to zero, on each factual premise, but splits five to four on the normative conclusion about whether the risk warrants new guidance. Third: a panel whose votes are weighted and whose chair holds a tie-break, so that the aggregation rule can be only partly reverse-engineered from the published annex. Include at least one case where the procedure yields an answer I will not like — for instance, that the honest brief states the committee's official conclusion flatly, without the premise-level splits that would make a better story — and close with a candid account of where the procedure will misfire and what it cannot settle.
reasoning: |-
  We are creating a procedure for a reporter to analyze committee decisions in a short time frame. The procedure should help decide how to report the outcome: whether to use the collective conclusion, premise-level votes, when to use "split," and when the aggregation method is the story.

  Steps of the Procedure:

  1. **Identify the aggregation rule (if disclosed):**
     - Check the press release, annex, or any available documentation for the committee's stated rule for aggregating votes (e.g., majority on conclusions, unanimity on premises, weighted votes, chair's tie-breaking power).
     - *Sufficient answer*: The rule is explicitly stated (e.g., "we use majority vote on the final conclusion" or "premises must be accepted by at least two-thirds").
     - *If incomplete*: If the rule is not disclosed, note this and proceed to step 2 to try to infer.

  2. **Examine the structure of the decision:**
     - Determine if the decision was made by voting on:
       a. Only a final conclusion (conclusion-based aggregation).
       b. Premises (facts) and then deriving the conclusion from the premises (premise-based aggregation).
       c. A mix of both.
     - *Sufficient answer*: The annex shows separate votes on premises and/or conclusions.
     - *If incomplete*: If the structure is unclear, note that the aggregation method is opaque and that the official conclusion is the only available information. Then skip to step 5.

  3. **Map the votes (if available):**
     - If there are votes on premises and a conclusion, create a table (mentally or on paper) of how each member voted on each premise and the conclusion (if available).
     - *Sufficient answer*: A clear record of each member's vote on each proposition.
     - *If incomplete*: If individual votes are missing (only totals are given), note the vote counts for each proposition and proceed.

  4. **Check for consistency in the aggregation:**
     - **Case 1: Premise-based aggregation:** 
       - The committee votes on premises and the conclusion is logically derived (e.g., if P and Q then C). Check if the majority vote on the premises leads to the conclusion. If not, there's a discursive dilemma.
       - Then, check if the official conclusion matches the logically derived conclusion from the premises (even if it contradicts the direct vote on the conclusion).
     - **Case 2: Conclusion-based aggregation:**
       - The committee votes only on the conclusion. Then the majority vote on the conclusion is the official position.
     - **Case 3: Mixed or other rules:**
       - If there are weighted votes or a chair's tie-break, then the outcome might not reflect a simple majority of members. Calculate the outcome based on the rule (if known) and compare to the official statement.

     - *Check for discursive dilemma*: 
       - If the majority of members individually hold a set of beliefs (on premises) that would lead to a particular conclusion, but the committee's official conclusion is different (because of premise-based aggregation) OR if the majority vote on the conclusion is different from what the premises would lead to, then there is a discursive dilemma.
     - *Check for oligarchic rule*: If the rule requires unanimity on a key premise (e.g., safety) and one member can block, note that.

     - *Sufficient answer*: The official conclusion matches the aggregation rule. If there is a discrepancy (like a discursive dilemma) then note it.

  5. **Decide on reporting:**
     - **If the aggregation rule is disclosed and the outcome matches the rule:**
       - Report the official conclusion as the committee's position. However, if there is a discursive dilemma (i.e., the conclusion derived from the premises is not the same as the majority vote on the conclusion) and the committee used premise-based aggregation, then the story might be about the premises and the derived conclusion (which may be at odds with what many members believe about the conclusion).
       - Use the word "split" if there is a notable division (e.g., 5-4) on the conclusion or on key premises. But if the split is on premises and the conclusion is unanimous, then the split on premises may be less relevant for the conclusion.
     - **If the aggregation rule is not disclosed and the outcome is inconsistent with a simple majority on the conclusion (or with the premise-based derivation) in a way that affects the story:**
       - Then the aggregation method itself becomes part of the story. Report the official conclusion but note that the voting pattern suggests a more complex internal division (and state the vote counts on key premises and the conclusion).
     - **When to lead with the collective conclusion:**
       - Always state the official conclusion. But if the discursive dilemma is present and significant (i.e., the official conclusion is not what a majority of members would have chosen by a direct vote on the conclusion) then the story might focus on the premises and the derived outcome.
     - **When to report premise-level votes:**
       - When the premises are critical to the debate (e.g., safety, efficacy) and the split on premises is substantial (e.g., 5-4) and the conclusion is derived from these, even if the conclusion vote is unanimous.
       - Also, when the official conclusion is derived from premises and the premises themselves are contested, it is important to report the premise-level votes.
     - **When the word "split" is honest:**
       - When there is a substantial division (e.g., not 8-1 or 9-0) on either the conclusion or the key premises that led to the conclusion. But note: if the committee uses premise-based aggregation and the conclusion is logically derived from the premises (even if some members disagree with the conclusion) then the committee might present a united front on the conclusion. However, the split on premises is still newsworthy.
     - **When "split" misleads:**
       - If the committee had a split on a minor premise that did not affect the conclusion, or if the split is on a non-decisive issue, then emphasizing a split might be misleading. Also, if the committee used a rule that required unanimity on a key point and achieved it, then the conclusion is unanimous even if some members had reservations on other points.

  6. **Mark the limits:**
     - The procedure stops at the point of normative legitimacy of the rule. The reporter cannot judge if the rule is fair, but can report if it was disclosed and if it led to a result that might be at odds with the majority of members.
     - Also, if the record is too incomplete (e.g., only the conclusion is announced without any vote breakdown) then the reporter must rely on the official statement and note the lack of transparency.

  Time constraint: 90 minutes. The reporter must be able to do this with the annex and without formal logic training.

  Now, we run the procedure on three cases.

  **Case 1: Vaccine Advisory Committee**
  - Vote 1 (causal link): 5-4 in favor.
  - Vote 2 (seriousness outweighs benefit in subgroup): 5-4 in favor (with a different majority, only one member overlapping).
  - Vote 3 (recommend contraindication): fails 8-1.
  - Committee announcement: "no basis for restricting use."

  Steps:
  1. Aggregation rule: not stated. We proceed.
  2. Structure: We have votes on two premises (causal link and seriousness) and a conclusion (contraindication). The conclusion vote is also taken.
  3. Map votes: We don't have individual votes, but we have the totals. We see that the two premises pass by 5-4, but the conclusion fails 8-1.
  4. Check consistency:
     - The two premises (if both true) would logically imply that the contraindication is warranted (if causal and serious, then restrict). But the committee did not draw that conclusion. Instead, they voted separately on the conclusion and it failed overwhelmingly.
     - This suggests they are using conclusion-based aggregation: the conclusion is whatever the majority votes on the conclusion, regardless of the premises. Alternatively, they might have a rule that the conclusion requires a supermajority and the 5-4 on premises was too weak? But that's not stated.
     - However, note that the two premises had different majorities (only one member overlapping). So, only one member held both beliefs? Then a premise-based aggregation would require that both premises are accepted by the same set of members? Actually, no: in premise-based, the committee collectively accepts a premise if a majority votes for it, regardless of which members. Then the conclusion follows. But here the committee does not follow that. Instead, they vote separately on the conclusion and reject it by 8-1.

     There is a discursive dilemma: 
       - Premise-based aggregation would lead to the conclusion that the contraindication is warranted (because both premises are accepted by majority). 
       - But the majority vote on the conclusion is against (8-1). 
       - The committee, by taking a vote on the conclusion and going by that, is using conclusion-based aggregation.

     However, note the committee announcement: they say they found no basis for restricting. This matches the conclusion vote (8-1 against). 

  5. Reporting:
     - The official conclusion is clear: no restriction. But the vote on the premises (causal link and seriousness) were both 5-4 in favor. This is a classic discursive dilemma: the premises would lead to a different conclusion. 
     - Since the committee used conclusion-based aggregation (by actually voting on the conclusion and going by that), we report the official conclusion. However, the split on the premises is highly relevant because it shows that a majority of the committee believed the adverse event was causally linked and serious enough to outweigh benefits in the subgroup, but the committee as a whole did not recommend a contraindication. 
     - Therefore, the story should report the official conclusion but also note the premise-level splits. The word "split" is honest for the premises (5-4) and for the conclusion (8-1, which is a split but a lopsided one). However, the key split is on the premises and the fact that the conclusion vote was against despite the premises.

     Lead: The committee found no basis for restricting the vaccine, but the vote revealed deep divisions on key safety questions.

  **Case 2: Dietary Panel**
  - Unanimous (9-0) on each factual premise.
  - Split 5-4 on the normative conclusion (whether the risk warrants new guidance).

  Steps:
  1. Aggregation rule: not stated, but we can infer.
  2. Structure: Votes on premises (unanimous) and a conclusion (split).
  3. Map votes: Premises all 9-0, conclusion 5-4.
  4. Check consistency:
     - The premises are accepted unanimously. The conclusion is a normative step. The committee is likely using conclusion-based aggregation: they vote directly on the conclusion and the majority (5-4) carries.
     - Alternatively, if they were using premise-based, the conclusion would have to be derived from the premises. But normative conclusions are not logically derived from facts alone. Therefore, the conclusion vote is necessary.

     There is no discursive dilemma because the premises are not in dispute. The split is solely on the normative step.

  5. Reporting:
     - The official conclusion: if the committee announces the normative conclusion (by 5-4) then that is the position. 
     - The split (5-4) is honest and should be reported. The premises are not contested, so the focus is on the normative disagreement.

     Lead: The panel concluded by a 5-4 vote that the risks warrant new dietary guidance, despite unanimous agreement on the underlying facts.

  **Case 3: Weighted Votes and Chair's Tie-Break**
  - Panel with weighted votes (some members have more than one vote) and the chair holds a tie-break.
  - The published annex shows the total weighted votes on each proposition but does not disclose individual weights or the chair's weight.

  Steps:
  1. Aggregation rule: partially disclosed (weighted votes and chair tie-break) but not fully (individual weights and when the chair breaks a tie?).
  2. Structure: We have the total weighted votes on each proposition (e.g., proposition A: 15 votes in favor, 10 against; proposition B: 13 in favor, 12 against, etc.).
  3. Map votes: We have the totals, but without knowing the weights, we cannot know how many members were on each side. We might know the total number of members, but the weights might be uneven.
  4. Check consistency: 
     - Without knowing the weights, we cannot reverse-engineer the individual positions. We can only report the weighted vote outcome. 
     - If the rule says the chair breaks ties, and a vote is close, the chair might have decided. But without knowing the exact weights and the chair's extra power, we cannot say.

  5. Reporting:
     - The official conclusion is what the committee announced. The premise-level votes (as weighted) are reported as totals. However, the reporter must note that the votes are weighted and that the outcome might not reflect a simple count of members. 
     - The aggregation method (weighted votes and chair's tie-break) is part of the story because it may have influenced the outcome. The lack of full disclosure of weights and the chair's role is a transparency issue.

     Lead: The committee announced [conclusion], based on weighted votes that gave some members more influence. The vote on the key proposition was [result], but the individual members' positions are unclear due to the weighting system.

  **One case the reporter won't like:**
  In Case 1, the procedure might lead to a brief that states the committee's official conclusion (no restriction) and then notes the premise-level splits. But the reporter might prefer to lead with the split on the premises because it's more dramatic. However, the procedure says to always state the official conclusion and then add context. So the reporter must lead with the official conclusion.

  **Where the procedure misfires and what it cannot settle:**
  - Misfires: 
    - If the committee uses a complex aggregation rule that is not disclosed and the annex does not provide enough vote details, the procedure may not detect a discursive dilemma or oligarchic rule.
    - If the committee's decision involves many premises and complex logic, the reporter might not have time to reconstruct the entire logical structure.
  - Cannot settle:
    - The normative legitimacy of the aggregation rule. The reporter can only report if it was disclosed and if it led to an outcome that seems at odds with the majority of members (if known).
    - When the committee's rule is undisclosed and the votes are not published, the reporter must rely solely on the official statement.

  **Final Procedure Summary:**

  **Step 1:** Check for disclosed aggregation rule. If found, note it. If not, note undisclosed and proceed.
  **Step 2:** Determine the decision structure (premises, conclusion, or both). If unclear, note opaque and skip to step 5.
  **Step 3:** Map the votes (if available) for each proposition. If only totals, note that.
  **Step 4:** Check consistency:
     - If premise-based: does the majority on premises lead to the conclusion? If not, discursive dilemma.
     - If conclusion-based: does the majority on conclusion match the official position?
     - If mixed or weighted: try to compute with the rule (if known) or note limitations.
  **Step 5:** Decide reporting:
     - Always state the official conclusion.
     - Report premise-level votes if they are split and critical to the decision, especially if there is a discursive dilemma.
     - Use "split" for substantial divisions (e.g., 5-4, 6-3) on the conclusion or key premises.
     - If the aggregation method is undisclosed and the vote pattern suggests inconsistency (like a discursive dilemma) then report the method as part of the story.
  **Step 6:** Note when the record is incomplete and the limitations (cannot judge legitimacy, etc.).

  End of procedure.
answer: |-
  Below is a step-by-step procedure designed for a reporter on deadline. It prioritizes speed, clarity, and actionable outputs while flagging when human judgment is needed. The procedure assumes you have access to the committee's press release and any published annex (e.g., vote tallies, meeting minutes). It focuses on detecting *discursive dilemmas* (where collective conclusions conflict with individual member beliefs) and other aggregation quirks. 

  **Procedure: Analyzing Committee Decisions (90-Minute Deadline)**
  *Key principles: Start with the official conclusion; report splits only if they meaningfully challenge it; flag hidden aggregation rules.*

  1. **Identify the aggregation rule (5 min)**  
     *Goal: Determine how the committee converts votes into decisions.*  
     - Check the press release, annex, or charter for terms like: "majority vote on conclusions," "premise-based voting," "weighted votes," "chair tie-breaker," or "consensus required."  
     - **Sufficient answer:** Rule explicitly stated (e.g., "conclusions adopted by simple majority vote").  
     - **Incomplete/undisclosed:** Note: "Aggregation rule not disclosed." Proceed to Step 2.  
     - **Human handoff:** Stop if normative legitimacy is questioned (e.g., "Is this rule fair?"). Report only disclosure status.

  2. **Map the voting structure (10 min)**  
     *Goal: Distinguish premise votes (facts/evidence) from conclusion votes (actions/recommendations).*  
     - Review the annex for:  
       - Votes on *premises* (e.g., "Is Event X causally linked? Y/N").  
       - Votes on *conclusions* (e.g., "Issue guidance? Y/N").  
       - Logical links between them (e.g., "If Premise A and B are true, then Conclusion C follows").  
     - **Sufficient answer:** Annex labels votes as premises/conclusions AND shows their logical relationship (or lack thereof).  
     - **Incomplete:** If only conclusions are voted on, note: "No premise votes recorded." Skip to Step 4. If only premises, note: "No conclusion vote recorded." Proceed to Step 3.  

  3. **Check for discursive dilemmas (20 min)**  
     *Goal: Detect if the official conclusion conflicts with member beliefs.*  
     - **If premise-based aggregation (votes on premises determine conclusion logically):**  
       - Use the vote tallies to derive the "logical conclusion" from premises (e.g., if Premise A and Premise B both pass >50%, then Conclusion C *must* be true).  
       - Compare this derived conclusion to:  
         - The *official conclusion* in the press release.  
         - The *actual conclusion vote* (if recorded).  
       - Flag if:  
         - The logical conclusion ≠ official conclusion (e.g., premises imply "restrict vaccine," but committee says "no restriction").  
         - The logical conclusion ≠ majority vote on conclusion (e.g., premises imply "restrict," but conclusion vote fails).  
     - **If conclusion-based aggregation (votes only on conclusions):**  
       - No discursive dilemma possible. Premise votes are context, not decisive.  
     - **Sufficient answer:** Premise votes + logical rule yield a clear derived conclusion. Conflict (if any) is unambiguous.  
     - **Incomplete:** If premises/conclusions lack logical links (e.g., normative judgments), no dilemma can be inferred. Note this.  

  4. **Assess splits and transparency (15 min)**  
     *Goal: Decide when to highlight divisions or hidden rules.*  
     - **When to report splits:**  
       - **Honest:** A vote (premise or conclusion) is split near 50-50 (e.g., 5-4, 6-3 in a 9-member panel) AND it either:  
         - Directly challenges the official conclusion (e.g., normative split in Case 2).  
         - Reveals a discursive dilemma (e.g., Case 1).  
       - **Misleading:** Splits are lopsided (e.g., 8-1) or on irrelevant premises.  
     - **When to report premises over conclusions:**  
       - If a discursive dilemma exists (Step 3), premises are the story.  
       - If premises are unanimous but conclusions split (e.g., Case 2), the conclusion split is the story.  
     - **When aggregation is the story:**  
       - Rule is undisclosed (Step 1) AND votes suggest manipulation (e.g., weighted votes change outcomes).  
       - Rule is "oligarchic" (e.g., chair’s tie-break alters results).  
     - **Sufficient answer:** Clear vote counts + conflict with official conclusion.  

  5. **Write the brief (40 min)**  
     *Goal: Structure the story based on above.*  
     - **Lead with the official conclusion** (always).  
     - **Add context if:**  
       - Discursive dilemma exists (e.g., "The committee rejected restrictions, though a majority of members found evidence the vaccine may cause serious harm in some patients").  
       - Conclusion split is honest (e.g., "The decision passed 5-4, reflecting disagreement over risks").  
       - Aggregation rule is undisclosed/opaque (e.g., "The outcome relied on undisclosed voting weights").  
     - **Omit premise splits if:** No dilemma exists AND splits don’t challenge the conclusion.  
     - **Human handoff:** Stop if ambiguity requires expert input (e.g., "Is this logical link valid?"). Report only observable facts.  

  --- 
  **Procedure Applied to Cases**  
  *Assume 9-member panels; votes are member counts unless noted.*

  **Case 1: Vaccine Committee**  
  - **Step 1:** Rule undisclosed. Proceed.  
  - **Step 2:** Premises voted: Causal link (5-4 ✅), Seriousness (5-4 ✅). Conclusion voted: Contraindication (1-8 ❌). Logical link: Premises imply contraindication.  
  - **Step 3:** **Discursive dilemma found.** Logical conclusion (contraindication) ≠ official conclusion ("no restriction") AND ≠ conclusion vote (fails 8-1).  
  - **Step 4:** Split is honest on premises (both 5-4). Conclusion split (8-1) is misleading alone; premises reveal conflict. Aggregation is the story (undisclosed rule enabled dilemma).  
  - **Step 5:**  
    **Brief:** "The committee found no basis for restricting the vaccine’s use. However, votes show five members agreed the vaccine is causally linked to a serious adverse event in a subgroup—a position that, if applied consistently, would support restrictions. Only one member endorsed a contraindication."  
    **Why you won’t like it:** You must lead with the dull official conclusion, not the dramatic premise split. But the dilemma makes premises newsworthy.

  **Case 2: Dietary Panel**  
  - **Step 1:** Rule undisclosed. Proceed.  
  - **Step 2:** Premises unanimous (9-0 ✅). Conclusion: New guidance (5-4 ❌). No logical link (normative jump).  
  - **Step 3:** No discursive dilemma (premises don’t dictate conclusion).  
  - **Step 4:** Conclusion split (5-4) is honest and critical. Premise unanimity is secondary.  
  - **Step 5:**  
    **Brief:** "The panel declined to issue new dietary guidance by a 5-4 vote, despite unanimous agreement on underlying evidence about health risks."  
    **Note:** Premises omitted because they don’t challenge the conclusion.

  **Case 3: Weighted Votes + Chair Tie-Break**  
  - **Step 1:** Rule partially disclosed ("weighted votes, chair breaks ties"). Proceed.  
  - **Step 2:** Annex shows weighted votes: Premise A (15-10 ✅), Premise B (12-13 ❌), Conclusion (14-14 → chair breaks for "no action").  
  - **Step 3:** No premises-conclusion logic provided. Conclusion depends on chair.  
  - **Step 4:** Aggregation is the story (rule undisclosed fully; chair overruled deadlock). Splits are opaque (weights hide member views).  
  - **Step 5:**  
    **Brief:** "The committee opposed policy changes after its chair broke a 14-14 deadlock in a weighted vote. The outcome may not reflect member consensus, as voting power was uneven and individual positions undisclosed."  

  ---  
  **Where the Procedure Misfires and Limits**  
  - **Misfires:**  
    - **Oversimplifies logic:** Fails if premises/conclusions have complex dependencies (e.g., 10+ premises). Human judgment needed.  
    - **Misses hidden agendas:** Cannot detect strategic voting (e.g., members voting against beliefs to manipulate outcomes).  
    - **Biased toward disclosed data:** If votes are missing, it defaults to official conclusions, potentially missing scandals.  
  - **Cannot settle:**  
    - **Normative jumps:** In Case 2, it can’t judge if the conclusion split was justified.  
    - **Ambiguous rules:** In Case 3, it can’t reverse-engineer weights without full data.  
    - **"Consensus" smokescreens:** If votes are unpublished, it must take "consensus" claims at face value.  
  - **Critical limit:** It prioritizes accuracy over intrigue. You’ll sometimes kill a juicy premise-split story (e.g., Case 1) because the official conclusion is unambiguous.  

  **Final Tip:** In 90 minutes, focus on Steps 1–3. If a dilemma or opaque rule emerges, it’s your lead. If not, state the conclusion and note splits sparingly. Always attribute positions to the committee, not members, unless quotes exist.
