  ### Population Axiology Decision Tree  
  **Shared Ground:** Adding a life of negative welfare (i.e., a life worse than non-existence) does not improve a population.  

  #### Step 1: Mere Addition  
  *Case:*  
  - **Population A:** 10 billion people flourishing (welfare: 100 units each).  
  - **Population A+:** The same 10 billion at 100 units, plus 1 billion new people with *barely positive* welfare (1 unit each). They don’t harm existing people.  

  **Question:** Is A+ better than A?  
  - **Yes** → Go to Step 2A.  
  - **No** → Go to Step 2B.  

  ---

  #### Step 2A: Repugnant Conclusion  
  *Case:*  
  - **Population B:** 10 people with ultra-high welfare (1,000 units each).  
  - **Population Z:** 10 trillion people with barely positive welfare (1 unit each).  

  **Question:** Is Z better than B?  
  - **Yes** → **Total Utilitarianism**.  
    - *Why?* You prioritize total welfare: More lives with net positive welfare are always better, even if quality is low.  
  - **No** → **Critical-Level Utilitarianism** (or inconsistency).  
    - *Why?* You accept adding good lives in Step 1 but reject Z. This implies a "critical level" (above 1 unit) must be met for new lives to count as improvements.  

  ---

  #### Step 2B: Is Mere Addition Harmful?  
  **Question:** Is A+ *worse* than A?  
  - **Yes** → Go to Step 3.  
  - **No** → Go to Step 4.  

  ---

  #### Step 3: Average Welfare vs. Critical Thresholds  
  *Case:* Use **B** (10 people at 1,000) and **Z** (10 trillion at 1) again.  

  **Question:** Is Z better than B?  
  - **Yes** → **Inconsistent or Unorthodox View**.  
    - *Why?* If adding lives at 1 unit makes A+ *worse* (Step 2B), Z should be far worse than B—not better.  
  - **No** → **Average Utilitarianism or Critical-Level Utilitarianism**.  
    - *Why?* You reject Z because average welfare plummets (Average Utilitarianism) or because new lives below a critical level subtract value (Critical-Level). *These are indistinguishable here.*  

  ---

  #### Step 4: Non-Identity and the Value of Creation  
  **Question:** Can a person who *never exists* be "better off" if created with positive welfare?  
  - **Yes** → **Inconsistent**.  
    - *Why?* If creation benefits them, A+ should be better than A. But you said "no" in Step 1 and "not worse" in Step 2B.  
  - **No** → Go to Step 5.  

  ---

  #### Step 5: Person-Affecting Asymmetry  
  **Question:** Does a policy that changes *which people exist* (e.g., creating new lives) obligate us to those future people?  
  - **Yes** → **Person-Affecting View**.  
    - *Why?* You only consider impacts on people who *will exist regardless*. Creating new people (even with good lives) isn’t required—they weren’t "owed" existence.  
  - **No** → **Asymmetry View**.  
    - *Why?* Creating bad lives is wrong, but creating good lives isn’t obligatory. Mere addition isn’t better or worse—it’s neutral.  

  ---

  ### Leaf Positions Summarized  
  1. **Total Utilitarianism** (Step 2A → Yes):  
     - Maximize total welfare. Accepts the Repugnant Conclusion.  
  2. **Critical-Level Utilitarianism** (Step 2A → No):  
     - New lives must exceed a welfare threshold (e.g., 10+ units) to improve the population.  
  3. **Average Utilitarianism** (Step 3 → No):  
     - Maximize average welfare per person. Avoids Repugnant Conclusion.  
  4. **Person-Affecting View** (Step 5 → Yes):  
     - Only actions that affect *specific* future people (who exist in all scenarios) matter.  
  5. **Asymmetry View** (Step 5 → No):  
     - Creating bad lives harms, but creating good lives is neutral. Non-existence isn’t "worse" for anyone.  

  ### Unoccupied Leaves & Notes  
  - **Step 2A → No:** Labeled Critical-Level, but could be inconsistent if no threshold justifies rejecting Z.  
  - **Step 3 → Yes:** Unoccupied (incoherent). If adding lives at 1 unit harms (Step 2B), trillions at 1 unit can’t be better.  
  - **Step 4 → Yes:** Unoccupied (incoherent). If creation benefits people, A+ must be better—contradicts Step 1.  
  - **Average vs. Critical-Level:** Not separated here. Both reject Step 1 and Step 3’s "Z better than B."  
  - **Inconsistent Branches:** Flagged where answers conflict (e.g., approving mere addition but rejecting repugnance without a threshold).  

  ### Key Distinctions  
  - **Totalism** prioritizes quantity of welfare.  
  - **Averagism/Critical-Level** prioritize quality.  
  - **Person-Affecting/Asymmetry** deny that creating good lives is a moral gain.  
  - **Asymmetry** uniquely treats creation of good and bad lives as non-symmetric.  

  Use this tree to clarify your intuitions. If branches feel inconsistent, revisit the cases—population ethics has no universally accepted solution.
