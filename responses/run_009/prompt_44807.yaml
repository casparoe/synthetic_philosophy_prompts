prompt: |-
  I'm a high school senior doing an independent study project on decision theory, and I've run into a disagreement with the teacher supervising the project that I can't resolve on my own. His position, defended with real conviction, is that whenever one available action has a strictly higher expected value than another, a rational agent is required to choose it — even if the entire advantage in expected value comes from a fantastically small probability of a fantastically large payoff. His stock example: suppose a charitable intervention that reliably saves a hundred lives competes with one that has a one-in-a-billion chance of saving a trillion future lives. He insists the second is obligatory, because its expected value works out to roughly a thousand lives rather than a hundred, even though it is overwhelmingly likely to save no one at all. I've since learned that this commitment of expected-value maximization — always take the higher expectation, no matter how the expectation is generated — is what philosophers in this literature call fanaticism. My teacher describes it as simply doing the arithmetic. My credence that he is right, i.e., that fanaticism, so defined, is the correct rule for what rational agents ought to do, is about 0.3; his, I would guess, is above 0.9.

  What I would like from you is your own number, with the reasoning fully in the open rather than a bare figure. Please decompose the question into the sub-claims the final credence depends on, assign each a rough probability with one line of justification, and show how they combine into your overall estimate. My tentative carving, which you should correct if you think it's wrong, is something like: (a) there being a determinate fact of the matter about what rationality requires in choices under risk, rather than a plurality of equally defensible rules; (b) that, given (a), the rule is expectation-maximizing rather than something risk-weighted, satisficing, or otherwise sensitive to how sure things are; (c) that, given (b), vanishingly small probabilities enter the arithmetic at face value, rather than being reasonably ignored, rounded off, or discounted the way most people treat a one-in-a-billion promise from a stranger; and (d) that value adds up without any ceiling, so that no payoff is so large that additional lives stop counting toward the total. If you think some term is missing or one of mine conflates two issues, say so and adjust.

  Two further requests. First, tell me which of your component probabilities you are least confident in, and what argument or kind of case would move it the most. Second, given my 0.3 and my teacher's 0.9-plus, tell me which single sub-claim the two of us most likely disagree about — not just which is most uncertain in the abstract, but which difference would best explain why our final numbers land so far apart. That is where I want to take our next supervision meeting, and I would rather aim it at the actual source of the dispute than at a symptom.
