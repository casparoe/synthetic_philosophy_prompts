answer: |-
  You've hit on a profound tension at the heart of law, ethics, and philosophy. The enforceability of advance directives for dementia *does* seem to rely on a specific, often unstated, theory of the self. Let's reconstruct the implicit theories, evaluate their consistency, and see how Dennett's "narrative gravity" might reshape things.

  **The Implicit Theories of Self in Legal Practice:**

  1.  **Dworkin's "Critical Interests" Theory (The "Split Interests" View):**
      *   **Premise:** Ronald Dworkin argued we have two types of interests:
          *   **Experiential Interests:** Moment-to-moment desires, preferences, and feelings (e.g., the demented patient's current desire for food/comfort via a feeding tube).
          *   **Critical Interests:** Judgments about what makes a life good *as a whole*, based on values, convictions, and a sense of integrity (e.g., the competent person's judgment that prolonging life in severe dementia violates their dignity or life narrative).
      *   **Legal Application:** The law implicitly privileges critical interests over experiential interests. The competent self, capable of forming critical judgments about their life's narrative arc and core values, is seen as the true author of that life. The demented self, lacking the capacity for critical judgment and sustained narrative coherence, possesses only experiential interests. Honoring the advance directive respects the person's *overall life project* rather than the fleeting desires of a diminished state.
      *   **Strengths for Advance Directives:** Explains why the *earlier* self wins specifically regarding profound, life-altering incapacity. It captures the intuition that respecting autonomy means respecting the person's deepest values, not just immediate impulses, especially when those impulses arise from the very condition the directive sought to avoid.
      *   **Weaknesses:** Doesn't easily explain why the demented self's experiential interests shouldn't carry *some* weight. Also, struggles with revocation – why does a competent revocation (critical interest) trump the directive, but a demented request (experiential interest) doesn't? This suggests competence, not just interest type, is key.

  2.  **Psychological Continuity/Discontinuity Theory:**
      *   **Premise:** Personal identity persists over time based on psychological connectedness (memory, beliefs, desires, intentions). Severe dementia often causes such radical discontinuity that the demented individual is arguably a different person than the one who wrote the directive.
      *   **Legal Application:** Enforcing the directive isn't binding the *current* self; it's respecting the wishes of the *previous* person who no longer exists. The directive acts like a will – instructions from a now-gone individual about how to handle the biological entity that remains.
      *   **Strengths:** Provides a stark justification for ignoring the current requests – they come from a different "person." Fits well with the will analogy.
      *   **Weaknesses:** Legally and ethically problematic. Courts rarely explicitly declare the demented person "not the same person" (it undermines personhood rights). It risks dehumanizing the individual currently experiencing dementia. Also, continuity is often a matter of degree – where is the precise cutoff? This view struggles with milder dementia where some connections remain. Revocation rules become even harder: if discontinuity is severe, the *demented* self can't revoke because it's not the author, but the competent self can revoke up until discontinuity occurs.

  3.  **The Competence Threshold View (Your Skeptical Option):**
      *   **Premise:** This view minimizes the role of deep theories of self and focuses purely on *decision-making capacity*. The law respects the choices of competent individuals. If you are competent *now*, you can bind your future self (contracts, research participation) or revoke prior instructions. If you are incompetent *now*, we fall back on the last known competent instructions (advance directive, will) or a surrogate decision-maker.
      *   **Legal Application:** Advance directives are valid because they were made competently. Current requests by an incompetent individual are disregarded *because they are incompetent*, not because of identity discontinuity or interest types. The "past self binding present self" issue dissolves – it's only binding if the present self lacks the legal capacity (competence) to make a different choice. Revocation rules are perfectly consistent: only competent individuals can revoke.
      *   **Strengths:** Highly practical. Fits the legal language and evidentiary focus (assessing competence at time of signing/speaking). Explains the revocation paradox perfectly. Explains why the "binding" works for dementia (incompetence) but not slavery (competence required for ongoing assent).
      *   **Weaknesses:** Doesn't fully explain *why* we honor the *past* competent wishes rather than appointing a surrogate to make *current* best-interest judgments (like we often do for never-competent individuals). It seems to presuppose that honoring past autonomy is particularly important *even when* the current individual has preferences, suggesting something deeper than mere competence is at play.

  **Does the Practice Need One Particular View?**
  *   **No.** The legal practice *functions* with a primary reliance on the **Competence Threshold View**. This provides the most consistent and workable framework for courts and doctors.
  *   **However,** the *moral justification* for honoring advance directives over current demented requests often draws heavily on **Dworkin's Critical Interests view**. It answers the "why *should* we do this?" question by appealing to respect for the person's autonomous life narrative and values.
  *   The **Psychological Continuity** view is less commonly the *explicit* foundation, though elements of it (the "not really them anymore" intuition) sometimes surface in ethical discussions and family justifications.

  **What Changes if Courts Took Dennett's "Narrative Gravity" Seriously?**

  Dennett's view sees the self as a fiction, a useful abstraction – the "center of narrative gravity" that gives coherence to the story we and others tell about a person's life over time. It's not a homunculus, but a point around which the narrative coheres.

  *   **Focus on Narrative Coherence:** Courts might focus less on pinpointing a moment of "identity loss" (Psychological Continuity) or classifying "interests" (Dworkin), and more on whether the current individual can sustain a *narrative self*.
      *   Could the demented person articulate a coherent reason for changing their mind linked to their *life story* or values (beyond immediate hunger)? If not, their request might be seen as an experiential blip, not a new chapter authored by the narrative center.
      *   Evaluating the advance directive would involve assessing how well it fits into the person's established life narrative (values, beliefs, fears expressed over time).
  *   **Authorship and Editing Rights:** Dennett's view emphasizes the self as *author* of the narrative. Severe dementia represents a loss of authorship. Enforcing the directive respects the last act of competent authorship. Revocation by a competent person is the author exercising editorial control.
  *   **Potential Changes in Practice:**
      1.  **Revocation During Dementia:** This becomes trickier. If the demented individual expresses a *sustained, coherent new narrative* (e.g., "I find joy in small things now, life is worth living like this"), even if incompetent by strict medical standards, a Dennettian court *might* find the "center of narrative gravity" has shifted enough to warrant respecting the new preference, viewing it as a new (albeit limited) authorship. This would be a significant departure from current law.
      2.  **Evidence Scope:** Courts might place *more* weight on evidence of the person's lifelong narrative – journals, letters, testimony about deeply held values beyond the directive document itself – to establish the "center of gravity" the directive aimed to protect.
      3.  **Surrogate Decisions:** Surrogates might be instructed to decide based on what best *continues or honors the established life narrative* rather than just "substituted judgment" (what the person *would* want) or "best interests" (objective welfare). This aligns with Dworkin but frames it narratively.
      4.  **Ambiguity & Subjectivity:** The downside is increased subjectivity. Determining narrative coherence, authorship, and the "true" center of gravity is inherently interpretive and contested, potentially making decisions less predictable and more vulnerable to bias.
  *   **Contrast with Current Practice:** Currently, competence is the bright(er) line. Dennett's view blurs that line by focusing on the degree of narrative coherence and authorship, potentially giving *some* weight to expressions from individuals in the "gray zone" of mild/moderate dementia if they demonstrate a coherent (though perhaps simplified) narrative stance.

  **Conclusion & Addressing Your Framing:**

  1.  **The Core Driver is Competence:** Your skeptical instinct is largely correct. Legally, the **Competence Threshold View** provides the most consistent and operational framework. The enforceability hinges on the *evidentiary fact* of past competence and the *current legal status* of incompetence. Identity theories aren't *necessary* for the legal machinery to function.
  2.  **But Identity Theories Provide Justification:** However, the Competence Threshold alone doesn't fully explain *why* we privilege past competent wishes over current welfare judgments by surrogates in these specific cases of profound incapacity. Here, **Dworkin's Critical Interests view** (and to a lesser extent, intuitions related to Psychological Continuity) provides the dominant *ethical justification*. It answers *why* honoring the directive feels like respecting the *person*, not just following a rule.
  3.  **Dennett Offers a Different Lens:** Applying Dennett's "narrative gravity" wouldn't radically overhaul the *core* practice (honoring advance directives in severe dementia) but would change the *reasoning* and potentially the *edges* of the practice, especially regarding revocation in milder dementia or the evidence considered. It emphasizes the constructed, narrative nature of the self that the law is trying to respect.

  **For Your Paper:**

  *   **Strong Thesis:** Argue that while legal practice *operationally* relies on a competence threshold, its *justification* for privileging past wishes in dementia specifically leans heavily on a Dworkinian view of critical interests protecting the life narrative, implicitly treating the competent self as the true author of that narrative. Contrast this with the law's general refusal to let past selves bind present competent selves.
  *   **Engage Dennett:** Explore how a Dennettian view reframes the justification (narrative authorship/coherence) and could lead to subtle but significant shifts in handling ambiguous cases (milder dementia, revocation attempts) by focusing on narrative continuity rather than just medical competence.
  *   **Acknowledge the Competence Core:** Concede that the competence framework is essential for the legal system's function, but show how identity theories fill the justificatory gap left by competence alone in these profound cases.

  Your framing is insightful, not off. You've pinpointed a genuine philosophical tension underlying a concrete legal practice. The key is recognizing that the law uses competence as its *tool*, but often reaches for theories of self/identity to explain *why* it uses that tool in this specific, poignant way. Good luck with the paper!
