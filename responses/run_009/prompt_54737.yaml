answer: |-
  Your friend's argument is a clever revival of epistemicism via modal reasoning, but the fatal flaw lies in **premise (1)**. Rejecting this premise is costly but necessary, and the cost depends on your chosen theory of vagueness. Here's the diagnosis:

  ### Step-by-Step Breakdown:
  - **Premise (1)**: "If there's no fact of the matter, then things *could have gone either way*."  
    This equates **indeterminacy** with **metaphysical contingency**. It assumes that if no unique truth-value obtains, there must be two genuinely possible worlds: one where n is a heap, and one where it isn't.  
    **Why it fails**: Indeterminacy isn't about multiple *metaphysical* possibilities; it's about semantic incompleteness (supervaluationism) or ontic vagueness (if you're a realist). The "ways" aren't distinct possible worlds—they're precisifications *of our concepts*, not alternative realities.  

  - **Premise (2)**: "Heap-hood depends only on the grains."  
    This is defensible for physical predicates like "heap." Rejecting it requires radical metaphysics (e.g., heap-hood depends on irreducibly vague external factors). Most theories accept (2).  

  - **Premise (3)**: If (1) and (2) hold, heap-hood must depend on something beyond the grains.  
    This is logically sound *if* (1) and (2) are granted. The flaw propagates from (1).  

  - **Conclusion (4)-(6)**: Sharp borders + ignorance follow directly if (1)-(3) hold.  

  ### The Cost of Rejecting (1):
  Rejecting (1) means denying that "no fact of the matter" implies *metaphysical* contingency. Here's what this costs under different theories:

  1. **Supervaluationism**:  
     - **What you reject**: The "ways" in (1) are **precisifications** (interpretations of "heap"), not possible worlds. "Could have gone either way" means "some precisifications make it true, others false"—not that reality itself branches.  
     - **Cost**: You must abandon classical bivalence *and* accept that truth is relativized to precisifications. "Fact of the matter" becomes "truth on all admissible precisifications" (which fails for borderline cases).  
     - **Reply to your friend**: Supervaluationism *doesn't* posit sharp borders in reality—only in each precisification. The *actual world* has no cutoff because no single precisification is "correct."  

  2. **Ontic Vagueness (Worldly Indeterminacy)**:  
     - **What you reject**: Indeterminacy is a feature of *reality itself*, not our language. "No fact of the matter" means reality is unsettled—not that multiple settled realities are possible.  
     - **Cost**: You commit to metaphysical indeterminacy, which many find incoherent. How can reality "fail to settle" whether n grains are a heap? This challenges classical logic and requires new metaphysics (e.g., fuzzy properties or gaps in reality).  
     - **Reply to your friend**: Heap-hood isn't "already settled" (contra (4)); the world is *objectively indeterminate* at borderline cases.  

  ### Why Higher-Order Vagueness Fails Your Friend's Argument:
  Your friend's extension to "definitely" assumes the same flawed premise (1) applies at every level. But if "no fact of the matter about definiteness" doesn't imply multiple *metaphysical* possibilities, the regress stops. For supervaluationists, higher-order vagueness arises because "admissible precisification" is itself vague—not because there are unknowable sharp borders for "definitely."

  ### Why (2) Can (Usually) Be Saved:
  Premise (2) is plausible for physical predicates like "heap." Rejecting it would require claiming heap-hood depends on minds, contexts, or irreducible emergent properties—a heavier cost than rejecting (1). Supervaluationists and epistemicists typically accept (2); ontic vagueness theorists might reject it if they see vagueness as fundamental to reality.

  ### Practical Payoff:
  - **Reject (1)** to avoid sharp borders.  
  - **Supervaluationism pays** with semantic complexity and loss of bivalence.  
  - **Ontic Vagueness pays** with metaphysical revisionism.  
  - **Epistemicism (your friend's view) pays** by making all vagueness ignorance—a cost your friend accepts, but which strains credibility with higher-order vagueness.

  **In short**: Your instinct about "could have gone" is correct. Premise (1) smuggles in a modal assumption that conflates indeterminacy with contingency. Reject it, and the argument collapses—but you'll need a theory that explains indeterminacy without metaphysical branching. The choice between supervaluationism and ontic vagueness depends on whether you prefer semantic or metaphysical costs.
