answer: |-
  You've hit on a profound tension at the heart of patent law – one that reveals a fascinating, often inconsistent, implicit theory of invention. Let's reconstruct it step-by-step, drawing on the history of science and patent doctrine, just as you'd analyze any institution in your seminar:

  **The Patent System's Implicit Theory of Invention: A Bimodal "Contingent Leap" Model**

  1.  **The Core Presupposition: "Contingent Creation" (Not "Inevitable Discovery"):** The foundational assumption is that valuable, patent-worthy inventions are **non-obvious, contingent acts of individual or organizational genius/effort.** They are *not* inevitable consequences of the state of the art. The system presupposes that without the *specific* inventor(s) and the *specific* incentive of the monopoly, this *particular* invention would **not** have emerged at that time, or perhaps ever in that form. This is the "but-for" causality underpinning the incentive story.

  2.  **The "Bimodal" View & The Role of Non-Obviousness:**
      *   **Mode 1: "Inevitable" Discoveries:** The system explicitly acknowledges your point – some advances are logically demanded by the existing knowledge base ("obvious to try," routine optimization, straightforward combinations). Non-obviousness/inventive step is the legal mechanism for filtering these out. Here, the system *agrees* with the history of science: these *would* have been made by others soon anyway. Granting a monopoly here would be inefficient and unjust.
      *   **Mode 2: "True" Inventions:** For everything that clears the non-obviousness hurdle, the system implicitly flips the script. It now treats this invention **as if it were a unique, contingent creation that *would not* have occurred without the inventor(s) and the patent incentive.** This is the zone where the monopoly is justified – the prize for doing something society *wouldn't* otherwise get.

  3.  **Operational Mechanics Reinforcing the Contingent Leap Model:**
      *   **First-to-File/Priority:** Rewards speed and secrecy, treating the invention as a *thing* captured by the first claimant. Independent creation is irrelevant because the system assumes Mode 2 inventions *wouldn't* happen independently without the filer (or at least, not in a timeframe justifying monopoly). Simultaneous invention is treated as a rare anomaly or evidence of obviousness.
      *   **Fixed Term (20 years):** Assumes a uniform period is sufficient incentive/reward *regardless* of how "ripe" the field was. It doesn't adjust because the underlying theory assumes Mode 2 inventions are singular leaps, not inevitable outcomes whose timing could be predicted. The term reflects a political/economic compromise, not an empirical measure of "inevitability lag."
      *   **No Independent Inventor Defense:** This is crucial. It starkly demonstrates the system's commitment to the contingent leap model *for patented inventions*. If the invention was truly non-obvious (Mode 2), the independent inventor *couldn't* exist by definition (according to the system's logic at the moment of infringement). If they *did* independently invent, it must mean the invention was actually obvious (Mode 1) and the patent should be invalid. There's no middle ground recognized.

  **The Cracks in the Foundation: Where the System Strains Against Reality**

  1.  **The Fuzzy Non-Obviousness Line:** This is the biggest flaw. The history of science shows simultaneous invention is common *even for significant breakthroughs* (your Darwin/Wallace, calculus, telephone, lightbulb examples prove this). The legal test for non-obviousness (e.g., TSM in the US, "problem-and-solution" in Europe) is notoriously subjective, context-dependent, and applied retrospectively. **The system *cannot* reliably distinguish between "inevitable" and "contingent" inventions in practice.** A patent granted for something deemed "non-obvious" today might be revealed tomorrow as something multiple labs were converging on independently. The system pretends the line is clear; history and practice show it's porous.
  2.  **Incentive Story Overreach:** The "no exclusive rights, no invention" narrative is a vast oversimplification. It ignores:
      *   **Intrinsic Motivation:** Curiosity, desire for fame, passion for problem-solving.
      *   **Non-Patent Incentives:** First-mover advantage, trade secrets, lead time, reputational gains, research funding, prizes.
      *   **Social/Collective Nature:** Much innovation builds incrementally on shared knowledge and collaboration, not isolated genius. The system downplays this by focusing on the named inventor(s).
  3.  **Fixed Term vs. Variable Inevitability:** The uniform 20-year term makes no distinction between inventions that were truly ahead of their time (perhaps justifying longer protection) and those that were just barely non-obvious and likely to be independently invented within months or years (where 20 years is excessive). The system ignores the *degree* of contingency/inevitability.
  4.  **The Priority Fight Paradox:** The very existence of historical priority disputes (Newton/Leibniz) undermines the system's clean bimodal view. If multiple geniuses arrive at the same complex, non-trivial idea independently around the same time, doesn't that suggest *some* form of inevitability or "ripeness," even if it wasn't obvious to the "person skilled in the art"? The system struggles to categorize these events neatly.

  **Reconciling the Tensions? Underdetermination and Operational Pragmatism:**

  *   **Underdetermination:** You're absolutely right. The *operational* aspects of patent law (first-to-file, fixed term, no independent inventor defense) are compatible with multiple theories. They primarily serve administrative efficiency, legal certainty, and reducing transaction costs. Assigning clear, early ownership is paramount for the system to function, even if the philosophical justification is messy. The "contingent leap" theory is the *dominant narrative justification*, but the system could *operate* with a more nuanced "inevitability spectrum" view – it just chooses not to for practical reasons.
  *   **The Courts' Role:** Courts *do* grapple with the fuzziness, primarily through the malleable doctrine of non-obviousness. They try to set the bar high enough to hopefully capture only the more truly contingent leaps. But they are constrained by the statutory framework that enforces the bimodal logic in its other rules (like no independent inventor defense). They can't easily introduce nuance like variable terms or inevitability defenses without legislative change.

  **What Would Change Under an "Inevitability Spectrum" Model?**

  If patent law fully embraced the history of science view (significant inventions often arise inevitably when conditions are ripe), several fundamental changes would be needed:

  1.  **Shorter and/or Variable Terms:** Protection terms could be inversely proportional to some measure of "inevitability" or "ripeness" (e.g., density of research in the field, number of competing approaches). Highly ripe fields get very short terms (e.g., 5 years). Truly unforeseeable leaps might keep longer terms.
  2.  **Independent Inventor Defense:** If you can prove clear, contemporaneous, independent creation *prior to the patent filing date*, you could get a royalty-free license or even invalidate the patent if multiple independent inventions occur rapidly. This directly challenges the "contingent leap" assumption.
  3.  **Prizes or Government Grants:** For fields where inevitability is high (e.g., incremental pharma improvements), replacing monopolies with ex-post prizes or ex-ante grants funded by the state could be more efficient and avoid monopoly deadweight loss. The monopoly reward only makes sense if the invention truly wouldn't happen otherwise.
  4.  **Stricter Non-Obviousness / Focus on "Unexpectedness":** The bar for non-obviousness would be raised significantly, focusing less on "not obvious to try" and more on truly unexpected, counter-intuitive results or mechanisms. Evidence of simultaneous research efforts would be strong evidence *against* patentability.
  5.  **Compulsory Licensing Regimes:** If a patent is granted but rapid independent invention occurs *after* filing, this could trigger compulsory licensing at reasonable rates, acknowledging the invention was "in the air."

  **Conclusion: A Necessary Fiction with Real Costs**

  The patent system presupposes a **bimodal theory of invention**: "Inevitable" (obvious, no patent) vs. "Contingent Leap" (non-obvious, patentable, wouldn't happen otherwise). It *needs* this fiction to justify the monopoly reward and enable its administratively simple rules (first-to-file, fixed term, no independent inventor defense).

  However, this model **fundamentally conflicts** with the historical and sociological reality that significant inventions often arise independently when the epistemic and technical conditions are ripe. The non-obviousness doctrine is the system's flawed, subjective attempt to filter out the "inevitable," but it fails to capture the full spectrum of simultaneity. The fixed rules then apply the "contingent leap" logic rigidly to everything that passes the filter, creating inefficiency and potential injustice.

  The system is **underdetermined** in its operational core (it *could* run with different rules reflecting inevitability), but it is **overdetermined** by its *dominant justification narrative* (the contingent leap theory) and its *need for administrative simplicity*. The courts work within these constraints, using non-obviousness as their main tool to manage the tension, but cannot resolve it fully.

  **For your section:** Frame it as institutional cognitive dissonance. Patent law is built on a philosophically shaky (or at least oversimplified) theory of invention because that theory provides a clear, administrable justification for a monopoly system. The history of science exposes this dissonance, particularly through simultaneous discovery. Ask whether the benefits of the current system's simplicity outweigh the costs of its inaccurate model, or if reforms acknowledging inevitability could create a more efficient and just regime. Highlight the non-obviousness doctrine as the battleground where this tension plays out daily. Your insight about the inconsistency between the incentive story and the no-independent-inventor-defense rule is spot-on – it perfectly crystallizes the core contradiction. Good luck!
