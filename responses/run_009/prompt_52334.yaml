  Below is a practical, step-by-step procedure for your committee to evaluate long-shot grant proposals. It combines decision theory principles with pragmatic checks for real-world constraints (15 minutes, pencil and paper). The procedure flags when expected value (EV) is reliable and when it fails, and explicitly separates mathematical checks from value judgments. Contested areas in decision theory are marked as such.

  ---

  ### **Procedure for Evaluating Long-Shot Proposals**
  **Time:** 15 minutes per proposal.  
  **Tools:** Pencil, paper, calculator.  
  **Inputs:** Grant cost, possible outcomes, probabilities, impacts (quantified in common units, e.g., dollars or "equivalent benefit units").  
  **Outputs:** Accept, reject, or hand to full committee (for value judgments).

  #### **Step 1: Sketch the Scenario (3 minutes)**
  - **Task:** List 3–5 key outcomes, probabilities, and impacts.  
  - **Details:**  
    - Impacts must be in **common units** (e.g., dollars). If non-monetary (e.g., "students trained"), convert to a dollar value using committee-agreed ratios (e.g., "$500/student").  
    - Probabilities must sum to ≈1 (include "failure" or "unknown" outcomes).  
  - **Stop if:**  
    - Impacts cannot be converted to common units → Hand to committee (value judgment).  
    - Outcomes are too vague → Reject or request more data.  
  - **Good enough:** A simple, plausible model (no precision needed).

  #### **Step 2: Check for Dominance (1 minute)**
  - **Task:** Compare best/worst cases to the status quo.  
  - **Rules:**  
    - If all outcomes are worse than doing nothing → Reject.  
    - If all outcomes are better than doing nothing → Accept.  
  - **Stop if:** Outcomes are mixed → Proceed to Step 3.  
  - **Judgment call:** "Better/worse" includes non-quantifiable effects (e.g., reputation). If disputed, hand to committee.

  #### **Step 3: Calculate Expected Value (EV) (2 minutes)**
  - **Task:** Compute:  
    **EV = Σ (probability × impact) - Grant cost**.  
  - **Details:**  
    - Use outcomes from Step 1.  
    - If EV > 0, the grant has positive expected net value.  
  - **Stop if:** EV is clearly negative (< -20% of grant cost) → Reject.  
  - **Good enough:** Rough estimates suffice.

  #### **Step 4: Robustness Check (5 minutes)**
  EV can be misleading in long-shots. Check for three failure modes:  
  1. **Infinite EV?**  
     - **Task:** Ask: "Is there a tiny chance of near-infinite impact (e.g., >100× grant cost)?"  
     - **Stop if:** Yes → EV is unreliable. Proceed to Step 5.  
     - **Settled theory:** Infinite EV invalidates standard decision rules (e.g., St. Petersburg paradox).  

  2. **Undefined EV?**  
     - **Task:** Calculate the **expected absolute value**:  
       **EAV = Σ |probability × impact|**.  
     - **Check:** If EAV = ∞ (in theory) or EAV >> EV (e.g., EAV > 10× |EV|), EV is unstable.  
     - **Stop if:** Unstable → EV is unreliable. Proceed to Step 5.  
     - **Settled theory:** Non-convergent EAV means EV is undefined (e.g., Pasadena game).  

  3. **EV Dominated by One Outcome?**  
     - **Task:**  
       - Find the outcome with the largest |probability × impact|.  
       - Remove it and recalculate EV.  
     - **Check:** If new EV changes sign or by >50% → EV is fragile.  
     - **Stop if:** Fragile → EV is unreliable. Proceed to Step 5.  
     - **Contested theory:** Robustness heuristics (e.g., outcome removal) are practical but not rigorously justified.  

  #### **Step 5: Handle Unreliable EV (2 minutes)**
  - **Task:** Evaluate worst-case and best-case scenarios.  
  - **Rules:**  
    - **Reject if:** Worst-case loss is catastrophic (e.g., >20% of fund assets) and probability >1%.  
    - **Hand to committee if:**  
      - Best-case is highly desirable but risky.  
      - Non-quantifiable values dominate (e.g., "excitement").  
  - **Judgment call:** "Catastrophic" and "desirable" depend on fund values.

  #### **Step 6: Final Decision (2 minutes)**
  - **Task:** Synthesize results:  
    - If EV reliable and EV > 0 → Accept.  
    - If EV reliable and EV < 0 → Reject.  
    - If EV unreliable → Use Step 5 outcome.  
  - **Output:** Accept, reject, or hand to committee.

  ---

  ### **Applied to Your Proposals**
  **Common setup:**  
  - Impact units: Dollars (committee agrees $500/student for education outcomes).  
  - Catastrophic loss threshold: $20,000 (assumes $100,000 fund).  

  ---

  #### **Proposal 1: $2,000 for Coding Classes**
  - **Step 1:** Sketch  
    - Success (90%): Train 20 students → Impact = 20 × $500 = $10,000.  
    - Failure (10%): 0 students → Impact = $0.  
  - **Step 2:** No dominance (mixed outcomes).  
  - **Step 3:** EV = (0.9 × $10,000) + (0.1 × $0) - $2,000 = **$7,000** (positive).  
  - **Step 4: Robustness**  
    - No infinite impact.  
    - EAV = |0.9×10,000| + |0.1×0| = $9,000 (not >> EV).  
    - Dominance check: Removing success → EV = -$2,000 (50%+ change). **Fragile!** But only 2 outcomes → Committee judgment.  
  - **Step 5:** Worst-case: Lose $2,000 (not catastrophic).  
  - **Step 6:** **Hand to committee** (due to fragility).  
    - *Committee likely accepts*: Simple EV is strong; worst-case tolerable.

  ---

  #### **Proposal 2: $5,000 for State Grant Leverage**
  - **Step 1:** Sketch  
    - Win state grant (5%): $100,000 impact.  
    - Lose state grant (95%): $1,000 impact (e.g., partial work).  
  - **Step 2:** No dominance.  
  - **Step 3:** EV = (0.05 × $100,000) + (0.95 × $1,000) - $5,000 = **$950** (positive).  
  - **Step 4: Robustness**  
    - No infinite impact.  
    - EAV = |0.05×100,000| + |0.95×1,000| = $5,950.  
    - Dominance check: Removing win-state-grant outcome → EV = ($950 - $5,000) = **-$4,050** (sign change). **Fragile!**  
    - Also: Win-state-grant contributes 84% of EAV → Low confidence in 5% probability?  
  - **Step 5:**  
    - Worst-case: Lose $4,000 ($5,000 - $1,000) → Not catastrophic.  
    - Best-case: Gain $95,000.  
  - **Step 6:** **Hand to committee** (due to fragility and excitement).  
    - *You may not want this*: EV positive but driven by 5% chance. Committee might accept based on upside.  

  ---

  #### **Proposal 3: Donor’s Coin-Flip Publicity Stunt**
  - **Step 1:** Sketch (simplified to 4 flips)  
    - Heads on flip 1 (50%): Win $2.  
    - Tails then heads (25%): Lose $4.  
    - Tails² then heads (12.5%): Win $8.  
    - Tails³ then heads (6.25%): Lose $16.  
    - All tails (6.25%): Lose $0 (arbitrary cap).  
  - **Step 2:** No dominance.  
  - **Step 3:** EV = (0.5×2) + (0.25×−4) + (0.125×8) + (0.0625×−16) + (0.0625×0) = **$0**.  
  - **Step 4: Robustness**  
    - **Infinite impact?** Yes: Impacts double each flip (e.g., flip 20 → ±$1M).  
    - **EAV = ∞:** |0.5×2| + |0.25×−4| + ... grows unbounded → **EV undefined!**  
    - (Dominance check skipped; already failed).  
  - **Step 5:**  
    - Worst-case: Unlimited losses (unbounded downside).  
    - Catastrophic risk → **Reject**.  
  - **Step 6:** **Reject** (mathematically invalid EV; catastrophic risk).  
    - *Matches your concern*: No sensible number possible.  

  ---

  ### **Settled vs. Contested Theory**
  - **Settled:**  
    - EV requires finite EAV (absolute convergence); else undefined.  
    - Infinite EV breaks standard decision rules.  
    - Dominance principles (Step 2) are uncontroversial.  
  - **Contested:**  
    - **Robustness heuristics (Step 4):** Removing outcomes or using EAV thresholds is practical but not derived from axioms. Some theorists prefer utility functions or risk metrics.  
    - **Handling unreliable EV (Step 5):** "Worst-case focus" vs. "EV as default" is debated. This procedure uses worst-case for catastrophe avoidance (conservative).  
    - **Probability/impact confidence:** The "show of hands" for dominance (Step 4) is a committee hack, not formal theory.  

  ### **Key Judgment Calls**
  - Step 1: Converting impacts to dollars (e.g., $500/student).  
  - Step 4: Thresholds for "tiny chance" (>100× grant cost), "fragile" (50% EV change), "catastrophic" (>20% of fund).  
  - Step 5: Defining "exciting" or "desirable" upside.  

  Use this procedure to filter clear math-based decisions and escalate value-driven debates. Revisit thresholds annually as your fund evolves.
