  Hmm, the user is clearly deeply engaged with foundational issues in decision theory under ambiguity. They're frustrated with circular debates and want a rigorous specification of what makes a theory adequate. This isn't a casual inquiry - they've mapped out seven detailed requirements and specific phenomena (Ellsberg variants, comparative ignorance) that any theory must handle.

  The core tension I see is between capturing robust empirical phenomena (Requirement 1) while maintaining normative coherence (Requirements 3,5,6). The user hints at but doesn't state the elephant in the room: that ambiguity aversion might be fundamentally incompatible with dynamic rationality under standard constraints. That's where I'll focus my joint-satisfiability analysis.

  For Requirement 5 (dynamic consistency), I recall that Epstein-Le Breton showed it forces Bayesian updating and collapses ambiguity attitudes unless we modify either the updating rule (like maxmin's rectangularity) or abandon consequentialism. The smooth model often ignores dynamic issues entirely. This requirement might be the linchpin - if we relax "pure" dynamic consistency to allow consistent planning, we preserve ambiguity attitudes at cost of true dynamic rationality.

  The comparative ignorance finding is fascinating - it suggests ambiguity aversion is contextual, not inherent. That subtly undermines Requirement 4's demand for fixed "location" of attitude. Perhaps attitudes emerge from framing, not stable preferences. But normative theories can't easily incorporate that without becoming descriptive.

  On Requirement 7 (exploitation): Maxmin's inactivity problem is serious but fixable via prior constraints. More interesting is that ambiguity-averse agents might rationally reject free information (Requirement 6) if it increases uncertainty - that's not irrational, just uncomfortable for standard norms.

  For scoring: Maxmin nails Requirements 1,2,4 but struggles with 5 and 7. Smooth model handles 1,2,6 better but fails 4 and 5. Neither cleanly satisfies 3 (completeness/transitivity) when we consider dynamic choices. The real separator is Requirement 5 - it exposes maxmin's artificial rectangularity and the smooth model's dynamic silence.

  Ultimately Requirement 1 (taking Ellsberg seriously) collides with Requirement 5 (dynamic consistency) under standard rationality constraints. That's the joint unsatisfiability. I'll recommend relaxing dynamic consistency to "consistent planning" - it's the least normatively damaging compromise. The user seems ready for that conclusion given their frustration with circular debates.
answer: |-
  Here is a specification of desiderata for a theory of rational choice under ambiguity, structured as requested. The requirements are evaluated for non-negotiability, tensions are identified, and candidate theories are scored.

  ---

  ### **Desiderata for a Theory of Rational Choice Under Ambiguity**

  1.  **Taking the Data (Ellsberg Robustness)**  
      *Requirement:* The theory must explain the Ellsberg paradoxes as rational behavior, not cognitive errors. It must account for both the two-urn and three-color paradoxes, including the preference reversals and implied probability contradictions.  
      *Motivation:* Ellsberg patterns are robust, intuitive, and replicated across contexts. Dismissing them as "irrational" ignores systematic behavior demanding explanation.  
      *Non-Negotiable?* **Yes.** A theory ignoring this fails its core purpose. The "comparative ignorance" finding (weak aversion in isolation) does *not* undermine this; it suggests context-dependence of ambiguity attitude, which the theory should accommodate.

  2.  **Expected-Utility Limit**  
      *Requirement:* Under objective, known probabilities, the theory reduces to standard expected utility (EU).  
      *Motivation:* Ambiguity supplements risk, it doesn’t replace it. Rational agents should satisfy EU when probabilities are unambiguous (e.g., casino roulette).  
      *Non-Negotiable?* **Yes.** This is foundational for coherence. A theory violating this conflates risk and ambiguity attitudes unnecessarily.

  3.  **Formal Floor (Preference Rationality)**  
      *Requirement:* Preferences are complete and transitive. The theory provides a well-defined functional representing preferences (e.g., utility function, preference functional).  
      *Motivation:* Without this, "rational choice" lacks structure. Completeness and transitivity are minimal requirements for coherent choice; a representing functional ensures tractability and testability.  
      *Non-Negotiable?* **Conditionally Yes.** Completeness/transitivity are core to rationality. However, allowing *incompleteness* under deep ambiguity is a defensible camp preference (e.g., Bewley models). The representing functional is pragmatically non-negotiable.

  4.  **Locating the Attitude**  
      *Requirement:* The theory must specify whether ambiguity attitude stems from belief (non-additivity/set of priors) or evaluation (non-linear weighting of EU). It must identify an empirical or theoretical scenario where these placements yield distinct predictions.  
      *Motivation:* The distinction is theoretically crucial. Does ambiguity alter perception of likelihoods (belief) or valuation of uncertain prospects (taste)? Without testable differences, the choice is aesthetic.  
      *Non-Negotiable?* **Camp Preference.** Normative theories can differ here. However, demanding *testability* (distinct predictions) is non-negotiable for scientific adequacy. Example: Belief-based models predict different updating behavior than evaluation-based models.

  5.  **Dynamic Consistency & Consequentialism**  
      *Requirement:* The theory must specify choice behavior across time. Ideally, agents are dynamically consistent (plans made ex-ante are followed ex-post) and consequentialist (choices depend only on current subtree).  
      *Motivation:* Dynamic inconsistency leads to exploitable plans. Consequentialism ensures local rationality. The tension is real: Epstein & Le Breton (1993) showed that dynamic consistency + consequentialism + ambiguity sensitivity force EU-like behavior.  
      *Non-Negotiable?* **No, but critical.** Pure dynamic consistency + consequentialism is *incompatible* with ambiguity aversion (per Ellsberg). Theories *must* relax one:
      *   **Maxmin:** Relaxes consequentialism via "rectangularity" of priors (e.g., Gilboa-Schmeidler updating), ensuring consistent planning but violating subtree independence.
      *   **Smooth Model:** Often assumes naive updating, risking dynamic inconsistency unless specific restrictions apply.
      Demanding both unmodified is a **prejudice** – the cost of ambiguity aversion is relaxing one pillar of dynamic rationality.

  6.  **Non-Perversity of Information**  
      *Requirement:* More information (weakly) improves the agent’s ex-ante welfare.  
      *Motivation:* Rational agents should not rationally avoid free, decision-relevant information.  
      *Non-Negotiable?* **Camp Preference (but weak).** Under ambiguity, "bad news" can increase perceived uncertainty, making the agent worse off (e.g., Epstein (2006)). This *can* be rational if information truly worsens the decision problem (e.g., revealing more ambiguity). The requirement may reflect risk-domain intuition; relaxing it is defensible. Failure is a **benign artifact** of ambiguity sensitivity, not a refutation.

  7.  **Immunity to Exploitation & Activity**  
      *Requirement:* The agent is immune to sure loss (no "Dutch books"). The theory predicts agents engage in non-trivial trade (no pathological inactivity).  
      *Motivation:* Sure loss is irrational. Maxmin with an overly large prior set can reject all ambiguous bets, which is empirically false (people participate in markets) and normatively dubious (inactivity wastes gains from trade).  
      *Non-Negotiable?* **Partially.** Immunity to sure loss is **non-negotiable** (core rationality). Predicting plausible activity levels is a **modeling constraint** (non-pathology), not strict rationality. Theories should explain participation (e.g., via constrained prior sets or explicit costs of inactivity).

  ---

  ### **Joint Satisfiability & Core Tension**

  *   **The Core Conflict:** Requirements **1 (Ellsberg Robustness)**, **2 (EU Limit)**, **3 (Formal Floor)**, and **5 (Dynamic Consistency/Consequentialism)** are **jointly unsatisfiable** under standard dynamic rationality assumptions. Epstein’s result is pivotal: explaining Ellsberg (1) while collapsing to EU under risk (2) and maintaining dynamic + consequentialist rationality (5) forces EU universally.
  *   **The Escape Valve:** Requirement **5 must be relaxed**. Any adequate theory *must* sacrifice either:
      *   **Full Dynamic Consistency:** Accepting consistent planning but not necessarily time-consistent behavior (e.g., maxmin with rectangular priors).
      *   **Consequentialism:** Allowing choices at a node to depend on "irrelevant" past ambiguity (e.g., history-dependent preferences).
  *   **Accepting the Negation:** Sacrificing pure consequentialism is less normatively damaging. It acknowledges that ambiguity is resolved (or not) over time and context. The agent remains dynamically consistent via pre-commitment to a plan (rectangularity), violating subtree independence but avoiding exploitable naivete.

  ---

  ### **Scoring Candidate Theories**

  | Requirement          | Maxmin EU (MMEU)                     | Smooth Ambiguity (SA)                  |
  | :------------------- | :----------------------------------- | :------------------------------------- |
  | **1. Ellsberg**      | **✓** (Directly built for this)      | **✓** (Handles reversals via curvature) |
  | **2. EU Limit**      | **✓** (Set collapses to single prior) | **✓** (Curvature → 0)                  |
  | **3. Formal Floor**  | **✓** (Complete, transitive, rep.)   | **✓** (Complete, transitive, rep.)     |
  | **4. Locating Att.** | **✓ Belief** (Set of priors)         | **✗ Evaluation** (Curvature on EU); Lacks clear test vs. belief models |
  | **5. Dynamics**      | **△** (Rectangularity saves planning; violates consequentialism) | **✗** (Often assumes naive updating; Dynamic inconsistency likely) |
  | **6. Information**   | **✓** (Rectangularity preserves non-perversity) | **△** (Can exhibit perversity; Context-dependent) |
  | **7. Exploit/Active**| **△** (Sure loss immune; Inactivity risk without prior discipline) | **✓** (Smoothness avoids extreme inactivity; No sure loss) |

  *   **Key Separator:** **Requirement 5 (Dynamics)** does the most work. MMEU explicitly addresses it (via rectangularity) at the cost of consequentialism. SA typically ignores or fails it, making it dynamically incoherent without ad hoc fixes.
  *   **Overall:** MMEU better handles the core normative tensions (5,7) but struggles with psychological realism (4). SA better fits attitudes as "taste" (4) and activity (7) but falters dynamically (5) and lacks clear empirical distinction (4). Neither fully resolves the core conflict—both relax Requirement 5.
