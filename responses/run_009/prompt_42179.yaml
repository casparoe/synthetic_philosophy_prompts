  - Duval: All yes on fit, but Halloran/Beck no on cost. Osei yes on cost. Not invited. Both methods same because even though cost failed 2-1, up-or-down would have Halloran/Beck voting no.
  - Narasimhan: Halloran/Beck no on fit, Osei yes. All yes on cost. Not invited. Both methods same because fit failed.
  - Bhatt: Halloran/Beck yes on fit, Osei no. All yes on cost. Invited. Both methods same because fit passed 2-1, cost passed.

  So in all past cases, the outcome aligned. The key is that when a criterion failed, the no votes came from at least two members, meaning up-or-down would also fail. For Bhatt, both criteria passed, so up-or-down passed.

  Now for Ozdemir, criterion-by-criterion passes both (fit: Halloran no, Beck no, Osei yes → wait no, Halloran says yes on fit? Let me check. Halloran thinks she fits (yes), Beck thinks not (no), Osei yes. So fit passes 2-1 (Halloran and Osei yes, Beck no). Cost: Halloran no (too expensive), Beck yes (affordable), Osei yes. So cost passes 2-1 (Beck and Osei yes). So both pass, so criterion-by-criterion says invite. But up-or-down: Halloran would vote no because cost is too high, Beck votes no because doesn't fit, Osei votes yes. So 2-1 against. So the procedures split.

  The user wonders if Halloran will choose the procedure to get her desired outcome (rejecting Ozdemir). Since she's chair, she might call for an up-or-down vote to reject, even though criterion-by-criterion would approve.

  For consistency with past cases: in all past cases, an invite required both criteria passing. In Bhatt, fit passed 2-1, cost passed unanimously, so invited. In Duval, fit passed but cost failed, not invited. In Narasimhan, fit failed, cost passed, not invited. So the pattern is that both criteria must pass. Therefore, for Ozdemir, both criteria pass (each 2-1), so consistent with past, she should be invited. So the committee should use criterion-by-criterion to be consistent.

  Beck's idea: require unanimity on budget. In past cases, Duval had cost fail without unanimity (Halloran/Beck against, Osei for). If they required unanimity on budget, then Duval would have been rejected anyway since it wasn't unanimous. Narasimhan: cost was unanimous yes, but fit failed. Bhatt: cost was unanimous yes. So requiring unanimity on budget would fit past cases because in Duval, budget wasn't unanimous and was rejected; in others, when budget passed, it was unanimous except possibly...wait, in Bhatt, all agreed affordable, unanimous. In Kessler, unanimous. In Duval, not unanimous, rejected. In Narasimhan, unanimous yes on cost. So actually, in all past cases, when cost passed, it was unanimous? Duval is the only one where cost was contested, and it failed. In other cases where cost passed, it was unanimous. So if they required unanimity on budget, it would fit past decisions because cost only passed when unanimous. For Ozdemir, cost vote is 2-1 (Halloran no, Beck yes, Osei yes). Not unanimous, so under unanimity requirement for budget, cost fails. Then even with criterion-by-criterion, Ozdemir would be rejected because cost fails. Halloran would be happy, but Osei and Beck might not. But Beck is the one proposing unanimity on budget, even though he voted yes on cost here. That might be inconsistent for Beck.

  Finally, is there a candidate where up-or-down invites but criterion-by-criterion rejects? Suppose a candidate where both criteria fail under individual votes, but in up-or-down, two members vote yes. For example, Halloran and Beck each think one criterion fails but are willing to approve overall? But in the user's description, members seem to vote no in up-or-down if they think one criterion fails. In Ozdemir's case, Halloran votes no because cost fails, Beck no because fit fails. So if a member requires both criteria to pass to vote yes, then if either fails for them, they vote no. Therefore, if both criteria fail individually, everyone votes no in up-or-down. If one criterion fails, say cost fails, then members who think cost fails vote no in up-or-down. Only if both criteria pass for a member will they vote yes. So in that case, criterion-by-criterion approving requires both criteria to pass, meaning at least two members say yes to each. For a member to vote yes in up-or-down, they must think both criteria pass. Therefore, if both criteria pass individually (each by majority), then all members who voted yes to both would vote yes in up-or-down. But members who voted no on one criterion would vote no in up-or-down. So the number voting yes in up-or-down would be less than or equal to the minimum of the yes votes on each criterion. For example, in Ozdemir, fit passed with Halloran and Osei yes (so two yes), cost passed with Beck and Osei yes (two yes). But Osei is the only one who voted yes on both, so only Osei votes yes in up-or-down. Halloran voted yes on fit but no on cost, so she votes no in up-or-down. Beck voted no on fit but yes on cost, so he votes no. So only one yes. But if both criteria pass, the up-or-down yes voters are only those who said yes to both. So the up-or-down vote can reject even if both criteria pass, as in Ozdemir.

  Is there a scenario where up-or-down approves but criterion-by-criterion rejects? That would require both criteria to fail individually (so criterion-by-criterion rejects), but in up-or-down, a majority votes yes. But if both criteria fail individually, that means for each criterion, a majority votes no. For example, fit fails: at least two vote no. Cost fails: at least two vote no. Then in up-or-down, each of these members who voted no on a criterion would likely vote no overall. So if there are two who voted no on fit, they would vote no in up-or-down; similarly for cost. The only way someone might vote yes in up-or-down is if they think both are satisfied, but if both criteria failed majority, that means no more than one member thinks both pass. So at most one would vote yes in up-or-down, so it would fail. Therefore, it's impossible for up-or-down to approve when criterion-by-criterion rejects. But the reverse can happen: criterion-by-criterion approves (both criteria pass) but up-or-down rejects (if no two members agree on which criterion is satisfied, and each has one failure). That's the Ozdemir case. So the user's intuition is right: up-or-down can reject someone who passes both criteria individually, but not the other way around. That's the famous thing in social choice, like the discursive dilemma.
answer: |-
  Based on your committee's voting history and the Ozdemir case, here's a clear breakdown of the dynamics, consistency questions, and predictions. I'll address each part systematically, referencing your past cases.

  ### 1. **What Will Happen with Ozdemir?**
     - **Halloran's Likely Move**: Your intuition is correct. Halloran, as chair, will almost certainly call for an **up-or-down vote** (rejecting Ozdemir 2-1). 
       - *Why?* 
         - She has never lost a vote (per your observation), and an up-or-down vote aligns with her position (she opposes due to cost).
         - In past cases, she controlled the procedure when it mattered. For example, in Narasimhan (fit contested, cost unanimous), she ensured fit was debated/voted first, leading to rejection. Here, she can bypass criterion votes entirely.
       - *Outcome Prediction*: Ozdemir rejected 2-1 (Halloran and Beck no, Osei yes).

  ### 2. **What *Should* the Committee Do to Be Consistent?**
     - **Consistency Requires Criterion-by-Criterion Voting**: 
       - Past cases show that **both criteria must pass** for an invite (see Kessler, Duval, Narasimhan, Bhatt). 
       - In Ozdemir's case, both criteria pass 2-1 individually (fit: Halloran/Osei yes, Beck no; cost: Beck/Osei yes, Halloran no). 
       - This matches Bhatt (fit passed 2-1, cost passed 3-0), where the candidate was invited. Using an up-or-down vote here would *inconsistently* reject a candidate who meets both criteria.
     - **Closest Analog**: **Bhatt** is the best precedent. 
       - Both had a criterion passing 2-1 (fit for Bhatt, both for Ozdemir) and no budget objections from the majority. Rejecting Ozdemir would break this pattern.

  ### 3. **Beck's Unanimity Proposal for Budget**
     - **Does It Fit Past Cases?** 
       - **Yes, but trivially**: In all past cases, the outcome under unanimity matches the actual result:
         - Duval: Budget lacked unanimity (2 no, 1 yes) → rejected (consistent).
         - Others (Kessler, Narasimhan, Bhatt): Budget was unanimous (3 yes) → invited/not based on fit (consistent).
       - *However*, this is coincidental. Unanimity wasn't required; budget passed/failed by majority. Beck’s rule would *retroactively* fit but wasn't necessary.
     - **Effect on Ozdemir**: 
       - Budget vote is 2-1 (not unanimous: Halloran no, Beck/Osei yes). 
       - Under unanimity, budget fails → Ozdemir rejected regardless of fit. 
       - *Paradox for Beck*: He supports unanimity but voted "yes" on Ozdemir's cost. If he pushes this, he contradicts his own position on affordability.

  ### 4. **Can Up-or-Down Invite Someone Criterion-by-Criterion Rejects?**
     - **No, It's Impossible**—and this is the "famous thing" your friend mentioned (likely the **discursive dilemma** in social choice theory).
     - **Why?** 
       - For up-or-down to approve, at least 2 members must vote "yes." Each member votes "yes" only if *both criteria are satisfied for them* (based on their stated positions).
       - If both criteria fail individually (e.g., fit fails 2-1 *and* cost fails 2-1), no member has both criteria satisfied → all vote "no" in up-or-down → rejection.
     - **But the Reverse Can Happen (as with Ozdemir)**:
       - Both criteria can pass individually, but members oppose for *different reasons* (e.g., Halloran: cost fail; Beck: fit fail) → up-or-down fails 2-1.

  ### Key Implications for Your Meeting
  - **Procedural Fairness**: To avoid arbitrariness, the committee should:
    1. **Formalize the voting procedure** (e.g., always vote criterion-by-criterion first, then combine results).
    2. **Clarify research strengths/budget rules** (e.g., define "practical ethics," set a policy on multi-day costs).
  - **Strategic Advice for You (as Non-Voting Rep)**:
    - **Before the meeting**: Share your analysis (especially the consistency argument) with Osei and neutral parties. Highlight that:
      - Past invites required both criteria to pass (cite Bhatt).
      - Up-or-down voting creates inconsistency (Ozdemir meets both criteria but would be rejected).
    - **During the meeting**:
      - If Halloran calls for up-or-down, ask: *"In Bhatt's case, fit passed 2-1 and cost 3-0, so we invited. Here, both pass 2-1. Shouldn't we treat these consistently?"*
      - If Beck pushes unanimity on budget, note: *"In Duval, we rejected based on majority budget objection, not unanimity. Changing that now might set a new precedent."*

  ### Prediction Summary
  | **Voting Method**       | **Ozdemir Outcome** | **Consistent with Past?** |
  |--------------------------|---------------------|---------------------------|
  | Criterion-by-criterion   | Invite (both pass)  | Yes (matches Bhatt)       |
  | Up-or-down               | Reject (2-1 no)     | No (inconsistent)         |
  | Unanimity on budget      | Reject (budget fails) | Yes (fits past outcomes)  |

  **Final Word**: Halloran will likely force an up-or-down vote to reject Ozdemir, but the committee *should* use criterion-by-criterion to stay consistent. The deeper takeaway? Your committee’s voting history reveals a **hidden norm**: an invite requires *both criteria to pass by majority*, regardless of up-or-down mechanics. Fixing this formally prevents future manipulation.
