answer: |-
  ## Distributive Justice Final Essay Question

  **Question (20 marks):**  
  "Telic egalitarians face the leveling-down objection: they must admit that an outcome where everyone is equally worse off is *in one way better* than an unequal outcome with higher total welfare. Prioritarians claim to avoid this objection.  

  *   **Case 1 (Leveling Down):** Society A: (Well-Off: 100, Worse-Off: 50). Society A-: (Well-Off: 80, Worse-Off: 50). (Assume the numbers represent identical, interpersonally comparable welfare units).  
  *   **Case 2 (Redistribution Choice):** Society B: (Person X: 80, Person Y: 60). We can choose to either:  
      *   **Option B1:** Give a +20 benefit to Person Y (result: X:80, Y:80).  
      *   **Option B2:** Give a +21 benefit to Person X (result: X:101, Y:60).  

  Explain clearly:  
  1.  Why a telic egalitarian would judge A- as *impersonally better* than A in *one way*, while a prioritarian would judge A as strictly better than A-.  
  2.  What the prioritarian and the telic egalitarian would each judge about the choice between B1 and B2.  
  3.  Whether the prioritarian's successful avoidance of the leveling-down problem in Case 1 means they have genuinely escaped the *core ethical concern* motivating the leveling-down objection, or whether a similar concern re-emerges in Case 2. In your answer, explicitly discuss the role of the prioritarian's concave transformation of welfare and how it generates their verdicts in *both* cases."

  ---

  ## Model Answer (Approx. 600 words)

  The leveling-down objection highlights a major flaw in **telic egalitarianism**. Telic egalitarians hold that equality is intrinsically valuable. Therefore, even if an equal distribution has *less total welfare* than an unequal one, the equality itself makes it better *in one respect*.  

  1.  **Case 1 (Leveling Down - A vs. A-):**  
      *   *Telic Egalitarian:* Society A (100, 50) is unequal. Society A- (80, 50) is perfectly equal. While A- has lower total welfare (130 vs. 150), the telic egalitarian must affirm that A- is *in one way better* than A because it realizes the intrinsic good of equality. They must admit that leveling down the well-off (from 100 to 80) while leaving the worse-off unchanged (at 50) produces a genuine (though perhaps outweighed) impersonal good. This is deeply counterintuitive, as A- helps *no one* and harms someone compared to A.  
      *   *Prioritarian:* Prioritarians reject the intrinsic value of equality. They care about improving the welfare of individuals, giving greater *weight* (priority) to benefits affecting those at lower absolute welfare levels. Their core commitment is to a strictly increasing and strictly **concave transformation function** applied to individual welfare before summing. This means:  
          *   Adding a fixed amount of welfare to a person always increases the transformed value (good).  
          *   Taking welfare away from a person always decreases the transformed value (bad).  
          *   The *gain* in transformed value from a fixed welfare boost is greater the worse off the recipient is.  
      *Applying this to Case 1:*  
          *   A: Transform(100) + Transform(50)  
          *   A-: Transform(80) + Transform(50)  
      Since Transform(100) > Transform(80) (because the transformation function is strictly increasing), and Transform(50) is identical in both, the *sum* of transformed values for A is strictly greater than for A-. The prioritarian judges A as strictly better than A-. Lowering the well-off (hurting someone) while helping no one cannot make things better. They avoid the leveling-down objection cleanly here.  

  2.  **Case 2 (Redistribution Choice - B1 vs. B2):**  
      *   *Telic Egalitarian:* Both options result in inequality. However, B1 (80, 80) is perfectly equal, while B2 (101, 60) is more unequal. The telic egalitarian would likely strongly prefer B1 over B2 because it achieves perfect equality. The large extra benefit to X (+21 vs. +20) does not compensate for the loss of equality.  
      *   *Prioritarian:* Prioritarians must compare the sum of transformed welfare:  
          *   B1: Transform(80) + Transform(80) = 2 * Transform(80)  
          *   B2: Transform(101) + Transform(60)  
      Due to the **concavity** of the transformation function:  
          *   The *gain* from moving X from 80 to 101 is [Transform(101) - Transform(80)]. Because X is already well-off, this gain is relatively *small* per unit of welfare.  
          *   The *loss* from *not* moving Y from 60 to 80 is [Transform(80) - Transform(60)]. Because Y is worse off than X, this *foregone gain* is relatively *large* per unit of welfare.  
      Crucially, concavity often means that the large per-unit gain for the worse-off person (Y) from a smaller absolute boost (+20) outweighs the small per-unit gain for the better-off person (X) from a larger absolute boost (+21). Therefore, the prioritarian will typically judge B1 (giving +20 to Y) as producing a higher *sum of transformed welfare* than B2 (giving +21 to X), despite B2 having a higher *total welfare* (161 vs. 160). They prefer the smaller benefit to the worse-off over the larger benefit to the better-off.  

  3.  **Survival or Shape-Shifting?**  
      The prioritarian successfully avoids the *pure leveling-down* problem (Case 1). Their concave function ensures harming someone (without helping anyone) is always bad. However, this does not mean they escape the *core ethical concern* behind the leveling-down objection. That concern is the implausibility of letting *relative disadvantage itself* drive moral judgments in ways that seem to ignore absolute welfare gains or losses.  

      The prioritarian verdict in Case 2 reveals this concern re-emerging. Prioritarians *must* prioritize benefits to the worse off, *because* they are worse off in absolute terms. While this prioritization avoids endorsing harmful leveling down, it leads to judgments like preferring a +20 boost for Y over a +21 boost for X solely due to Y's lower absolute (and thus relative) starting point. This mirrors the intuitive objection to egalitarianism – that it focuses excessively on relative standing. The Otsuka/Voorhoeve point highlights this: prioritarianism demands potentially extreme sacrifices from the better-off for the sake of the worse-off, driven fundamentally by the *relative positions* established by absolute welfare levels. The leveling-down objection hasn't been refuted; its core worry about the moral weight of relative position has simply changed shape, following the prioritarian out of the pure leveling-down trap and into a different, yet still controversial, distributive principle. The concave function is the engine driving *both* the escape from Case 1 *and* the controversial verdict in Case 2.

  ---

  ## Marking Scheme (20 Marks Total - 5 Must-Hit Points)

  **Point 1: Telic Egalitarianism & Leveling Down (Case 1) (4 Marks)**  
  *   **A (4):** Clearly states telic egalitarianism values equality intrinsically. Explains *why* A- (80,50) is judged impersonally better *in one way* than A (100,50) *despite* lower total welfare (equality is achieved). Contrasts with prioritarian rejection of this due to decreasing transformed sum (Transform(100) + T(50) > T(80) + T(50)).  
  *   **B (2-3):** Identifies telic egalitarian preference for A- but lacks clarity on *why* (intrinsic value of equality) or prioritarian rejection (fails to explicitly link to transformation sum decreasing or only states "no one helped").  
  *   *Typical Botch:* "Prioritarians care about equality too." or "Leveling down helps the worse-off." (It doesn't in Case 1).

  **Point 2: Prioritarian Transformation Function (Core Mechanism) (4 Marks)**  
  *   **A (4):** Defines prioritarian value as sum of a strictly increasing, strictly concave function of individual welfare. Explains implications: adding welfare always good, taking away always bad; marginal value decreases with higher welfare (concavity). Explicitly links this to verdict in Case 1 (T(100) > T(80), same T(50), so sum(A) > sum(A-)).  
  *   **B (2-3):** Mentions prioritarians transform welfare or care more about worse-off but doesn't specify strict concavity or its core implications (always increasing, always bad to harm). Link to Case 1 arithmetic weak or absent.  
  *   *Typical Botch:* "Prioritarians maximize total welfare" (No, they maximize sum of *transformed* welfare). Or "Concavity means they like equality" (Not necessarily - it means they prioritize gains to worse-off).

  **Point 3: Analysis of Case 2 (B1 vs. B2) (4 Marks)**  
  *   **A (4):** Correctly states telic egalitarian strong preference for B1 (equality). Correctly states prioritarian *preference for B1* over B2. Explains *why* prioritarian prefers B1 using concavity: The *foregone gain* for Y (T(80)-T(60)) is large per unit because Y is worse off, while the *actual gain* for X in B2 (T(101)-T(80)) is small per unit because X is better off; the large per-unit gain on a lower base outweighs the smaller per-unit gain on a higher base, despite the smaller absolute gain (20 vs 21). Notes B2 has higher total welfare (161>160) but lower transformed sum.  
  *   **B (2-3):** Identifies prioritarian preference for B1 but explanation is vague ("because Y is worse off") without linking to concavity and marginal value. May misstate verdicts (e.g., thinks prioritarian prefers B2). Neglects telic egalitarian view or total welfare comparison.  
  *   **Typical Botch:** "Prioritarians would prefer the bigger benefit" (B2) or "Concavity means they always prefer equality" (Not true - depends on amounts/levels).

  **Point 4: Concavity's Dual Role (4 Marks)**  
  *   **A (4):** Explicitly contrasts concavity's role in Case 1 vs. Case 2. In Case 1, concavity (combined with strict increase) ensures lowering welfare *must* decrease value (escape leveling-down). In Case 2, concavity *causes* the preference for the smaller benefit to the worse-off (B1) over the larger benefit to the better-off (B2), *because* it makes welfare gains at lower levels more morally significant.  
  *   **B (2-3):** Mentions concavity matters in both cases but doesn't clearly differentiate *how* (escape vs. cause) or why the mechanism differs. May only discuss one case.  
  *   **Typical Botch:** "Concavity solves leveling down and also makes them prioritize the worse-off" (True, but fails to articulate *how* it solves LD (by forbidding harm) vs. *how* it causes prioritization (marginal value)).

  **Point 5: Core Concern & Shape-Shifting Objection (4 Marks)**  
  *   **A (4):** Argues convincingly that while prioritarianism escapes the *specific* leveling-down *scenario* (Case 1), it does not escape the *core ethical concern* motivating the objection (excessive focus on relative standing/position). Clearly links this to Case 2: The prioritarian verdict stems *entirely* from the *relative positions* (Y being worse off than X in absolute terms), leading to a counterintuitive rejection of a larger absolute gain for a slight relative improvement. Identifies this as the "changed shape" of the objection (Otsuka/Voorhoeve point), showing relative position still drives demanding distributive judgments.  
  *   **B (2-3):** States prioritarianism avoids Case 1 but faces a problem in Case 2. May mention "similar concern" but lacks depth in identifying the *core concern* (focus on relative position) or explaining *how* Case 2 resurrects it. May simply say "prioritarianism has its own problems."  
  *   **Typical Botch:** "Leveling down objection refutes prioritarianism too" (It doesn't, as shown in Case 1). Or conflates the concerns: "It still cares about equality" (Prioritarianism doesn't care about equality *per se*, but concavity often mimics it).

  ---
  **Key for Grading:**  
  *   **A (16-20):** Hits all 5 points at A level. Clear, precise, demonstrates deep understanding of mechanisms (transformation function, concavity) and the core argument about the shape-shifting objection. Fluent arithmetic intuition for cases.  
  *   **B (12-15):** Hits most points, likely at B level on 1-2. Understands the views and cases broadly but explanations lack precision or depth, especially regarding the transformation function's mechanics and the distinction between escaping LD vs. facing the core concern. Some minor errors or omissions.  
  *   **C (8-11):** Identifies basic views and case outcomes but struggles significantly with explanation (especially concavity) and synthesis. Major errors (e.g., prioritarian likes LD) or omissions (fails to analyze one case properly, misses core argument).  
  *   **D (4-7):** Superficial or significantly flawed understanding. Misstates core views or case verdicts. Little to no engagement with transformation function or core argument.  
  *   **F (0-3):** Minimal relevant content, significant misunderstandings, or unanswered.
