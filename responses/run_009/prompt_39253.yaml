  *scratches head* The tricky part is designing concrete cases that make this tension unavoidable. Case 1 must be pure leveling down (where egalitarians and prioritarians clearly diverge), while Case 2 needs identical welfare distributions but differing prioritarian weights (forcing value-function arithmetic). 

