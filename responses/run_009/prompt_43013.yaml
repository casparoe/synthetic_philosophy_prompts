  ### Classical Indian Philosophy: Epistemological Decision Tree  
  *This tree helps you discover which classical Indian school aligns with your intuitive responses to concrete cases. Start at Question 1 and follow the branches. No prior knowledge of Sanskrit or doctrine is needed. Each question is answerable from ordinary experience.*  

  ---

  #### **Question 1: Inference from Evidence**  
  *You see smoke rising from a distant hill (no fire visible). You recall that smoke always accompanies fire. Do you now **know** there is fire on the hill?*  
  - **A: Yes, I know it.** → Go to Q2.  
  - **B: No, I only have a strong expectation, not knowledge.** → **Cārvāka** (rejects inference as a source of knowledge).  

  #### **Question 2: Scriptural Authority**  
  *A trustworthy text (e.g., the Vedas) describes a realm beyond ordinary perception (e.g., heaven). Does this text give you **knowledge** of that realm?*  
  - **A: Yes.** → Go to Q3.  
  - **B: No.** → **Buddhist Logicians** (reject Vedic authority; knowledge requires perception/inference).  

  #### **Question 3: Ultimate Reality of the World**  
  *Is the physical world (trees, mountains, etc.) **ultimately real**—independent and not illusory?*  
  - **A: Yes.** → Go to Q4.  
  - **B: No, it is ultimately illusory or dependent.** → **Advaita Vedānta** (world is *māyā*; only Brahman is real).  

  #### **Question 4: Knowledge by Description**  
  *You’ve never seen a *gavaya* (a rare animal). A trustworthy person says it resembles a cow. Later, you spot an unfamiliar cow-like animal. Do you now **know** this animal is a *gavaya*?*  
  - **A: Yes, I know it is a *gavaya* and what a *gavaya* is.** → Go to Q5.  
  - **B: I know this animal is *called* a *gavaya*, but not its essence.** → **Vaiśeṣika** (reduces comparison to inference/testimony).  

  #### **Question 5: Purpose of Sacred Texts**  
  *What is the **primary role** of scriptures like the Vedas?*  
  - **A: To prescribe actions (e.g., rituals).** → Go to Q6.  
  - **B: To reveal truth about reality (e.g., the self).** → **Nyāya** (emphasizes logic and metaphysics).  

  #### **Question 6: Knowledge of Absence**  
  *After carefully checking a well-lit room for a jar and finding none, do you **know** the jar’s absence?*  
  - **A: Yes, I know it directly (no reasoning needed).** → **Bhāṭṭa Mīmāṃsā** (non-perception is an independent source of knowledge).  
  - **B: I infer it (reasoning: “If present, I’d see it”).** → **Prābhākara Mīmāṃsā** (absences are inferred, not directly known).  

  ---

  ### Key Notes on the Tree  
  1. **Unseparated Pairs**:  
     - **Nyāya and Vaiśeṣika** share nearly identical *pramāṇa* (epistemology) in this tree. Their deeper divergence (e.g., Vaiśeṣika’s atomism vs. Nyāya’s theism) requires doctrinal questions beyond this tree’s scope.  
     - **Bhāṭṭa and Prābhākara Mīmāṃsā** are split only by their view of absence. Their core disagreement on error theory (*akhyāti* vs. *anirvacanīyakhyāti*) is not captured here.  

  2. **Unoccupied Combinations**:  
     - *Q1-A + Q2-A + Q3-A + Q4-B + Q5-A* (World real, Vedic authority accepted, comparison rejected, Vedas prescribe action) → **Unexplored**. No classical school holds this; it is coherent but historically unattractive (ritualists like Mīmāṃsā accept comparison).  
     - *Q1-A + Q2-A + Q3-A + Q4-A + Q5-B* (World real, comparison accepted, Vedas reveal truth) → **Occupied by Nyāya**, but if combined with Q6-B, it becomes incoherent (Nyāya holds absence is perceptual, not inferential).  

  3. **Weaknesses and Contestations**:  
     - **Buddhist Placement (Q2-B)**: Contested. Some Buddhists (e.g., Dharmakīrti) accept scripture conditionally, but the tree oversimplifies by isolating them solely on Vedic rejection. A case on momentariness (*kṣaṇikavāda*) would refine this.  
     - **Mīmāṃsā Split (Q6)**: Least confident. Prābhākara’s view of absence is debated (some scholars say they reject absence altogether). If absence-knowledge is deemed inferential *by all schools*, the tree fails to split Mīmāṃsā.  
     - **Vaiśeṣika Reduction (Q4-B)**: Minority view. Some argue Vaiśeṣika *does* accept comparison; if confirmed, Vaiśeṣika and Nyāya collapse into one leaf.  
     - **Advaita (Q3-B)**: Simplified. Advaitins accept empirical reality provisionally; a case on dream vs. waking states would clarify.  

  4. **Redesign Triggers**:  
     - If schools debate **internal diversity** (e.g., Advaita’s *dṛṣṭi-sṛṣṭi* vs. *sṛṣṭi-dṛṣṭi*), the tree would need a node on whether the world arises *from* ignorance or *with* it.  
     - A question on **perceptual error** (e.g., mistaking a rope for a snake) could split Nyāya (anyathākhyāti) from Advaita (anirvacanīyakhyāti).  

  ---

  **Final Advice**: Use this tree as a starting point for debate, not a final taxonomy. Classical schools often share epistemological tools but clash on metaphysics (e.g., the self’s nature). To resolve ambiguities, consult primary texts—this tree prioritizes intuition over doctrine.  

