answer: |-
  Here's your Q&A prep sheet, structured for a dynamic semantics audience. The objections are ordered by likelihood and severity, phrased in their terminology, with concise replies designed to acknowledge their framework while defending your core thesis.

  **Key Strategic Goals for Q&A:**  
  1. **Separate Truth-Conditions from Discourse Dynamics** relentlessly.  
  2. **Concede Pragmatics** where needed to appear reasonable.  
  3. **Cite Their Literature** to show you’re not ignoring their work.  
  4. **Redirect to Cold Contexts** when they raise warm-context examples.  

  ---

  ### **Anticipated Objections & Replies**  
  *(Ordered from Most to Least Likely)*  

  1. **Objection: Presupposition Projection in Cold Contexts**  
     *"But existence/uniqueness **project** as presuppositions even in statutes! Look at negation: ‘The surviving spouse does NOT inherit’ still triggers the inference that there *is* a unique spouse. That’s classic presupposition projection (Heim 1983), not assertion."*  
     - **Reply (Hold Firm):** "Projection behavior doesn’t entail metaphysical presupposition. In cold contexts, projection is a *logical consequence* of the quantificational structure. Negating ‘The F is G’ doesn’t presuppose F; it asserts there’s no unique F or that it’s ¬G. Legal texts treat failure of existence/uniqueness as falsity (e.g., ‘void for inapplicability’), not truth-value gaps. This aligns with Schlenker’s (2008) view that some presuppositions are context-independent."  
     - **Tactics:** Cite Schlenker to show awareness. Stress that legal interpretation treats these as truth-conditional failures.  

  2. **Objection: Accommodation Happens in Writing**  
     *"Writers design texts for accommodation! If a statute says ‘The plaintiff must file within 30 days,’ readers accommodate there’s a contextually unique plaintiff. That’s dynamic semantics doing truth-conditional work (Lewis 1979)."*  
     - **Reply (Concede Minimally, Then Reframe):** "Accommodation is real, but it’s about *epistemic access*, not truth-conditions. The statute *asserts* there is exactly one relevant plaintiff. If readers accommodate, they’re resolving indexicality (e.g., *which case*?), not changing truth-conditions. In cold contexts, ‘the F’ is rigid: it means ‘the unique F in the domain of discourse,’ which the text itself defines. Your example shows pragmatic resolution of the domain, not dynamic semantics overriding Russell."  
     - **Tactics:** Agree accommodation occurs but frame it as domain restriction.  

  3. **Objection: Novelty Without Anaphora**  
     *"What about ‘first-mention’ definites in cold contexts? E.g., a scientific paper: ‘The solution was heated.’ No prior mention, yet ‘the’ is licensed. This requires a file-change semantics (Heim 1982), not brute Russellianism."*  
     - **Reply (Hold Firm):** "This confuses *discourse* novelty with *logical* novelty. In cold contexts, ‘the solution’ isn’t anaphoric; it’s a shorthand for a description recoverable from the experimental setup (e.g., ‘the solution prepared in step 3’). The Russellian paraphrase still holds: there’s a unique solution satisfying contextual descriptors. The dynamic ‘file’ here is just a structured domain of quantification—no need for discourse referents."  
     - **Tactics:** Emphasize contextual domain restriction. Cite Roberts (2003) on contextually supplied domains.  

  4. **Objection: Weak vs. Strong Definites**  
     *"Not all definites require uniqueness! ‘I went to the hospital’ (weak definite) doesn’t imply a unique hospital. Your ‘cold contexts’ ignore this distinction (Carlson et al. 2006)."*  
     - **Reply (Concede and Quarantine):** "I fully accept weak definites! But they’re irrelevant to my thesis. Weak definites are non-unique, lexicalized expressions (‘the hospital’, ‘the radio’). I’m only discussing *strong* definites in cold contexts—like ‘the surviving spouse’ in a will—where uniqueness *is* enforced. Dynamic approaches often overgeneralize weak definites to strong cases. In statutes/science, strong definites dominate."  
     - **Tactics:** Cite Carlson to show you know the literature. Isolate weak definites as a separate phenomenon.  

  5. **The Embedded Case You Fear: Conditionals**  
     *"In ‘If a person dies without a will, the surviving spouse inherits,’ existence/uniqueness of the spouse projects universally (∀x[die-without-will(x) → ∃!y(spouse(y,x))]). That’s presupposition, not assertion (von Fintel 1999)."*  
     - **Reply (Hold Firm with Nuance):** "Here’s my Russellian disambiguation: The sentence asserts that for any person who dies without a will, *there is exactly one surviving spouse*, and that spouse inherits. If no spouse exists, it’s false—not undefined. Courts interpret this as a *falsifiable condition*: if a widow has two spouses (e.g., polygamy), the provision fails. This is Russell’s wide-scope paraphrase: ∀x[¬will(x) → ∃!y(spouse(y,x) ∧ inherit(y))]."  
     - **Tactics:** Use logical notation. Stress legal practice: courts treat failure of uniqueness as invalidation.  

  ---

  ### **The Question You Hope Nobody Asks (But Might)**  
  **Objection: Anaphora to Non-Existent Entities**  
  *"In dynamic semantics, ‘the king of France’ can introduce a discourse referent even in cold contexts. E.g., a history text: ‘The king of France in 1700 was bald. He ruled for 40 years.’ This anaphora forces a non-Russellian representation (e.g., DRT’s referential box)."*  
  - **Reply (Strategic Retreat):** "Anaphora is the kryptonite of pure Russellianism! I concede that discourse referents are needed for cross-sentential anaphora. But note: the *truth* of ‘The king was bald’ is still Russellian (false if no king). The anaphoric ‘he’ is a separate issue—a pragmatic pointer to the discourse referent. In cold contexts, we can have ‘truth-conditional Russell + dynamic anaphora resolution’ without contradiction."  
  - **Why it’s Dangerous:** Forces you to split your account.  

  ---

  ### **Preemptive Moves for Your Talk**  
  To avoid seeming "stuck in 1905," **explicitly engage these points during your talk**:  
  1. **Cite Their Foundational Work**:  
     *"Heim’s file-change semantics brilliantly captures discourse dynamics, but I’ll argue it doesn’t replace truth-conditional content in cold contexts."*  
  2. **Acknowledge Donnellan/Strawson Insights**:  
     *"Strawson was right about speaker reference in conversation—but statutes don’t have speakers, only texts."*  
  3. **Preempt Anaphora**:  
     *"I’m bracketing anaphoric uses of ‘the’ today—Russell never handled those, and dynamic semantics rightly owns that territory."*  
  4. **Use Their Jargon**:  
     Use "presupposition," "accommodation," "discourse referent" when critiquing them.  

  ---

  ### **Summary of Q&A Strategy**  
  | **Objection Focus**      | **Your Stance**       | **Key Citation to Drop** |  
  |--------------------------|----------------------|--------------------------|  
  | Presupposition projection| Assertion in cold ctx| Schlenker (2008)         |  
  | Accommodation            | Domain restriction   | Roberts (2003)           |  
  | Weak definites           | Concede & quarantine | Carlson (2006)           |  
  | Embedded conditionals    | Wide-scope assertion | Legal practice           |  
  | Anaphora                 | Strategic concession | (Avoid if possible)      |  

  **Final Tip**: If cornered, say: *"I’m not denying dynamic semantics—I’m denying that it’s *always* truth-conditional. In cold contexts, it’s a layer *on top* of Russellian core."* This frames you as a unifier, not a reactionary.  

  Good luck—those dynamic semanticists can be relentless, but your distinction is philosophically sound. Break a leg!
