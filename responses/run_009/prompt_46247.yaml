prompt: |-
  A coworker and I keep arguing about when someone deserves to be credited with knowing how to do something, and the argument has now moved to our code-assistant tooling. She has a strikingly consistent track record: she says a colleague who has read every book on bicycle repair and can answer any question about it, but has never fixed a bike, does not know how to fix bikes; a pianist paralyzed by ALS who can still teach students and mentally rehearse flawlessly still knows how to play; a man who has lost all episodic memory but still rides flawlessly knows how to ride a bike; a brute-force chess engine that was never given any human-legible heuristics knows how to play chess; and someone who has memorized the complete theory of swimming, has never swum, and would drown does not know how to swim.

  Next sprint we have three cases to call: (1) an LLM pair-programmer that writes correct, novel solutions to problems it has never seen, but can neither run its code, observe results, nor act on anything; (2) a passenger with zero flight experience who lands a small plane by following step-by-step instructions radioed from the ground; and (3) a master silversmith who, after a stroke, still produces perfect work with her hands but can no longer say a single true thing about what she is doing, or recognize her own pieces afterward.

  I am less interested in the yes/no calls than in the rule she seems to be running. Please work out the candidate rules that fit her track record equally well — I suspect more than one does — and say which way each rule calls each of the three new cases. Then give your best guess for each case, with your reasons for preferring that reading of her, and identify the further case that would best tell the candidate rules apart. I would also like to know whether any of her earlier verdicts already put pressure on the rules that fit them — the pianist and the chess engine seem to pull in opposite directions to me, but I may be missing something. Please write your answer in American English.
reasoning: |-
  Okay, I need to figure out the coworker's rule for crediting someone with knowing how to do something. Let me start by reviewing her past judgments to identify patterns.

  First, she says the person who read all books on bike repair but never fixed a bike doesn't know how to fix bikes. The paralyzed pianist who can teach and mentally rehearse does know how to play. The amnesiac who rides flawlessly knows how to ride. The brute-force chess engine knows how to play chess. And the theorist who memorized swimming theory but would drown doesn't know how to swim.

  So, what's common here? The bike repair book learner and the swim theorist both have theoretical knowledge but no practical ability. They don't get credit. The pianist, the amnesiac biker, and the chess engine do get credit. The pianist has mental ability but no physical execution due to paralysis. The amnesiac performs physically without conscious recall. The chess engine plays without human-like heuristics.

  This suggests that practical ability or successful performance is key, regardless of theoretical knowledge or awareness. The rule might be about the capability to perform the task successfully, even if not through traditional learning or consciousness.

  Now, looking at the new cases. Case 1: an LLM that writes correct, novel code but can't run or observe results. Case 2: a passenger landing a plane by following radio instructions. Case 3: a silversmith who produces perfect work post-stroke but can't articulate or recognize her work.

  Applying the coworker's rule to these. For the LLM, it generates correct solutions but lacks the ability to execute or observe. Since it can't perform the entire task (running code), maybe she'd say it doesn't know how to program. But the chess engine analogy might apply—it plays chess without understanding, similar to the LLM writing code. However, the chess engine is acting (making moves), while the LLM isn't running the code. So perhaps the ability to produce correct outputs is key, even without execution.

  Case 2: Following instructions to land a plane. This is like the bike repair book learner—theoretical guidance without prior experience. But she denied the bike repair person. However, in this case, they're successfully landing the plane by following steps. The coworker might focus on the successful outcome. The amnesiac biker performs without memory, so maybe performing correctly, even via instructions, counts as knowing.

  Case 3: The silversmith produces perfect work but can't articulate. Similar to the amnesiac biker—procedural memory intact without declarative knowledge. She said the biker knows, so likely the silversmith knows too.

  Candidate rules:
  1. **Performance Capability Rule:** Knowing requires the ability to perform the task successfully when attempting it, even without theoretical understanding or awareness.
  2. **Procedural Competence Rule:** Knowing depends on procedural knowledge (how to do) rather than declarative knowledge (what or why). If someone can execute the task correctly, they know how, regardless of ability to explain.
  3. **Outcome-Oriented Rule:** Knowing is credited if the agent can produce the correct outcome of the task, irrespective of the method (e.g., brute-force calculation or instinctive action).

  Testing these against past cases:
  - Bike repair book learner: Can't perform, so no under all rules.
  - Paralyzed pianist: Can't perform physically, but mentally rehearses and teaches. Rules 1 and 3 might not credit since no actual performance, but she said knows. So perhaps Rule 2 (procedural competence) fits, as mental simulation counts.
    But ALS paralysis prevents physical action, yet she credits knowing. Maybe successful mental performance suffices if physical is impossible? Or teaching ability demonstrates procedural knowledge.
  - Amnesiac biker: Performs flawlessly, so yes under all rules.
  - Chess engine: Produces correct moves via brute force, so yes under Rules 1 and 3. Rule 2 might apply as it's following procedural steps.
  - Swim theorist: Can't perform, drowns, so no under all.

  The pianist case is tricky. Since she can teach and mentally rehearse flawlessly, that might be seen as a form of performance, even if not physical. So Rule 3 (outcome-oriented in mental space) or Rule 2 (procedural knowledge intact).

  Chess engine: Brute-force but produces correct outcomes, so Rule 3 fits.

  Now, for new cases:
  - Case 1 (LLM): Writes correct code but can't run it. If the task is "writing correct code," then it performs that. But if the task includes running and debugging, then not. The coworker might see the core task as producing solutions, not executing. But she denied the bike repair person who could answer questions but not fix. However, the LLM is generating solutions, not just answering questions. Similar to chess engine? But the engine is playing the game, while LLM isn't running code. Ambiguous. Under Rule 1 (performance capability): LLM isn't performing the full programming task (coding, running, iterating). So probably "no." Under Rule 2: If procedural competence includes generating code, maybe "yes," but it lacks experience. Rule 3: If producing correct code is the outcome, then "yes."

  - Case 2 (Passenger landing plane): Follows instructions to perform successfully. Like the bike repair learner, but here they are performing. The amnesiac biker is similar—performing without conscious knowledge. So likely "yes" under all rules, as the outcome is successful.

  - Case 3 (Silversmith): Produces perfect work without declarative knowledge. Exactly like amnesiac biker, so "yes."

  The pianist and chess engine might conflict: Pianist has mental competence but no physical action, credited; chess engine has no understanding but credited. Both emphasize outcome over process or awareness.

  Further case to distinguish rules: Someone who can describe how to swim perfectly but has never done it and fails when trying. Like swim theorist, "no." Or a robot that performs a task via pre-programmed instructions without adaptability—if it succeeds, Rule 3 says yes, but if it fails in novel situations, maybe not.

  Best guesses for coworker's calls:
  - Case 1 (LLM): No, because it can't run code or observe results, so it's not performing the full act.
  - Case 2 (Passenger): Yes, because they successfully landed the plane by following instructions, demonstrating performance.
  - Case 3 (Silversmith): Yes, procedural memory allows flawless production.

  Reasons: The coworker values actual successful performance or the capability to produce the outcome. For the pianist, mental rehearsal and teaching substitute for physical performance. For LLM, since it can't execute, it's incomplete.

  Further case: A person who can mentally simulate swimming perfectly but has never swum and would drown if trying. If she says they know how to swim, it aligns with pianist; if not, with swim theorist. That tests if mental performance suffices without physical ability.
answer: |-
  Based on your coworker's track record and the three new cases, I'll break this down step by step. First, I'll analyze her past judgments to infer candidate rules that fit consistently. Then, I'll apply those rules to the new cases (LLM pair-programmer, passenger landing a plane, and silversmith post-stroke). After that, I'll give my best guesses for how she'd rule on each case, with reasons. Finally, I'll suggest a further case to help distinguish the rules and address whether any past judgments create tension between them.

  ### Step 1: Analyzing your coworker's track record to infer candidate rules
  Your coworker's judgments emphasize **successful performance or execution** over theoretical knowledge, awareness, or learning methods. Here's a quick recap of her positions:
  - **Bike repair theorist (no credit)**: Has encyclopedic knowledge but can't fix a bike → lacks practical ability.
  - **Paralyzed pianist (credit)**: Can't play physically but teaches and mentally rehearses flawlessly → retains the core skill mentally.
  - **Amnesiac bike rider (credit)**: Rides flawlessly without memory → executes the skill automatically.
  - **Brute-force chess engine (credit)**: Plays chess competently without human-like understanding → produces correct outcomes.
  - **Swimming theorist (no credit)**: Knows all theory but would drown → fails in practice.

  These judgments suggest that "knowing how" is tied to the ability to reliably produce the correct outcome of the task, regardless of:
  - **Conscious understanding** (e.g., amnesiac rider and chess engine don't need it).
  - **Physical capability** (e.g., paralyzed pianist is credited based on mental competence).
  - **Learning method** (e.g., chess engine's brute-force approach is acceptable).

  Three candidate rules fit all these cases equally well:
  1. **The Performance Rule**: You know how to do something if you can *reliably execute the task successfully* when attempting it, even if you lack theoretical knowledge, awareness, or the ability to explain it. Execution can be physical, mental, or computational.
     - Why it fits: 
       - Bike repair/swimming theorists fail at execution → no credit.
       - Pianist executes mentally (teaching/rehearsing) → credit.
       - Amnesiac rider and chess engine execute physically/computationally → credit.

  2. **The Outcome-Oriented Rule**: You know how to do something if you can *produce the correct outcome* of the task, irrespective of how it's achieved (e.g., via instinct, algorithms, or external guidance), as long as it's not purely theoretical.
     - Why it fits:
       - Bike repair/swimming theorists produce no real-world outcome → no credit.
       - Pianist produces correct outcomes mentally (e.g., teaching correct technique) → credit.
       - Amnesiac rider, chess engine, and pianist all achieve valid outcomes (riding, winning games, teaching) → credit.

  3. **The Procedural Competence Rule**: You know how to do something if you possess *procedural knowledge* (the "how" of the skill), even if you lack *declarative knowledge* (the "what" or "why"). Procedural knowledge is shown through successful action, whether physical, mental, or simulated.
     - Why it fits:
       - Bike repair/swimming theorists have only declarative knowledge (facts) → no credit.
       - Pianist has procedural knowledge (mental rehearsal/teaching) → credit.
       - Amnesiac rider and chess engine demonstrate procedural knowledge through action → credit.
       - (Note: This rule treats mental simulation as valid procedural competence when physical execution is impossible.)

  All three rules explain the track record because they prioritize *functional ability* over theory or explanation. The pianist case is key here—your coworker credits knowing based on mental execution (teaching/rehearsing), which all rules accommodate by allowing non-physical forms of performance.

  ### Step 2: How each rule calls the three new cases
  Here's how the three candidate rules apply to your sprint cases. I'll show the call (credit or no credit) and a brief rationale for each.

  | Case                                      | Performance Rule Call & Rationale                                                                 | Outcome-Oriented Rule Call & Rationale                                                                 | Procedural Competence Rule Call & Rationale                                                                 |
  |-------------------------------------------|---------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------|
  | **(1) LLM pair-programmer**: Writes novel, correct code but can't run, observe, or act. | **No credit**. Rationale: The LLM doesn't "execute" programming—it only generates code. Programming involves running/testing (performance), which it can't do. | **Credit**. Rationale: It produces correct code (the core outcome) for novel problems. How it works (no execution) is irrelevant, like the chess engine. | **No credit**. Rationale: Code generation might involve procedural elements, but it lacks full procedural competence (e.g., no iteration based on results). |
  | **(2) Passenger landing plane**: Follows radioed instructions with zero experience; lands successfully. | **Credit**. Rationale: They successfully execute the task (landing) via guidance, like the amnesiac rider relying on muscle memory. | **Credit**. Rationale: The outcome (safe landing) is achieved, and external instructions (like the chess engine's algorithms) are valid. | **Credit**. Rationale: Following instructions becomes procedural knowledge "in the moment," enabling correct action. |
  | **(3) Silversmith post-stroke**: Produces perfect work but can't explain or recognize it. | **Credit**. Rationale: She executes the skill flawlessly (hands-on performance), like the amnesiac rider. | **Credit**. Rationale: The outcome (perfect silverwork) is produced, and her lack of explanation is irrelevant. | **Credit**. Rationale: Her hands retain procedural knowledge, even without declarative memory. |

  ### Step 3: My best guesses for how your coworker would rule, with reasons
  Based on her track record, I think she'd rule as follows. I'll emphasize consistency with past judgments and address potential tensions.

  - **(1) LLM pair-programmer: No credit**  
    **Reasoning**: Your coworker draws a line between *generating instructions* and *performing the skill*. The LLM is like the bike repair theorist—it can answer questions (generate code) but can't "fix the bike" (run/test the code). The paralyzed pianist was credited because mental rehearsal/teaching is a form of skill execution, but the LLM has no analogous "mental performance" for programming; it's purely theoretical output without engagement. The chess engine is different because it *plays the game* (produces moves as outcomes), while the LLM doesn't "program" in a full sense (it doesn't debug, iterate, or observe). Past pressure point: The pianist and chess engine both involve "doing" (mentally or computationally), but the LLM lacks this—it's passive, like the swimming theorist.

  - **(2) Passenger landing a plane: Credit**  
    **Reasoning**: This mirrors the amnesiac bike rider—both perform flawlessly with "external" support (radio instructions vs. muscle memory). Your coworker cares about successful execution, not how it's achieved (e.g., the chess engine uses brute force, not heuristics). The passenger isn't like the bike repair theorist because they're *doing* the task, not just describing it. Outcome matters most here, so all three rules align.

  - **(3) Silversmith post-stroke: Credit**  
    **Reasoning**: This is nearly identical to the amnesiac rider—procedural knowledge persists without declarative awareness. Her hands "know" what to do, and she produces perfect outcomes. The pianist case supports this; physical limitation (paralysis) didn't negate knowing, so loss of language/recognition shouldn't either. All rules point to credit.

  **Why I prefer this reading**: Your coworker seems to use a *hybrid of Performance and Outcome-Oriented Rules*, with a focus on whether the agent can reliably "do" the task in a real or simulated way. Key to her view is that "knowing how" requires the capacity for successful action, not just potential. For example:
  - The pianist can "act" mentally (teaching/rehearsing), which counts as performance.
  - The LLM can't "act" at all—it's a static generator, not an executor.
  - The passenger and silversmith are actively performing, so they credit.

  ### Step 4: Further case to distinguish the rules
  To tease apart the candidate rules, use this case:  
  **"A person who can mentally simulate swimming perfectly (e.g., describe strokes, breathing, etc. in real-time) and 'teach' it flawlessly, but has never swum and would drown if they tried."**

  - **How the rules differ**:
    - **Performance Rule**: Likely **no credit** because they can't physically execute swimming (unlike the pianist, who could perform mentally via teaching). Mental simulation alone might not suffice without a "performance" context.
    - **Outcome-Oriented Rule**: Likely **credit** because mental teaching produces correct outcomes (e.g., instructing others), similar to the pianist. The drowning part is irrelevant if the outcome is the knowledge transfer.
    - **Procedural Competence Rule**: Likely **credit** if mental teaching demonstrates procedural knowledge, but **no credit** if procedural knowledge requires physical potential.

  - **Why this case helps**: It directly tests the pianist analogy. If your coworker credits this person, she leans toward Outcome-Oriented or Procedural Competence Rules (mental outcomes count). If not, she favors the Performance Rule (physical executability is key). Her pianist verdict suggests she might credit it, but the swimming theorist (drowning) pulls the other way—this tension clarifies her priorities.

  ### Addressing tensions in past judgments
  You're right that the pianist and chess engine seem to pull in opposite directions—pianist has "human" understanding but no physical action, while chess engine has no understanding but computational action. However, both fit the rules because:
  - **Pianist**: Her mental teaching/rehearsing is a form of performance and outcome production (e.g., she can "execute" correct technique in instruction).
  - **Chess engine**: It produces correct outcomes (moves/wins) despite lacking heuristics.
  The tension is resolved because your coworker prioritizes *results* over *mechanism*. The real pressure point is the **swimming theorist** versus the **pianist**: Why does mental competence (pianist) count but not theoretical knowledge (swimming theorist)? The rules handle this by requiring *application* (pianist applies knowledge mentally; swimming theorist does not). No past judgment breaks the rules—they all cohere under a "successful doing" framework.

  In summary, your coworker's core principle seems to be: **"Knowing how requires reliably generating correct outcomes through some form of action, not just possessing knowledge."** For your sprint, I'd predict she rules "no" on the LLM (no action/outcome), "yes" on the passenger (successful action via guidance), and "yes" on the silversmith (automatic action). If you want to test this, use the mental swimming teacher case—it'll reveal if mental performance alone suffices.
