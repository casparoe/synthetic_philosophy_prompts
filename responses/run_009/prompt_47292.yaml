answer: |-
  ### Exam Question: Iterated Elimination and Mixed Strategies

  Consider the following two-player game. The row player (Player 1) has strategies T, M, B. The column player (Player 2) has strategies L, C, R. The row player’s payoffs are given below (Player 2’s payoffs are irrelevant for this question and may be assumed arbitrary):

  |      | L   | C   | R   |
  |------|-----|-----|-----|
  | **T** | 0   | 0   | 0   |
  | **M** | 3   | 3   | -1  |
  | **B** | -1  | -1  | 3   |

  **Part 1 (5 marks)**  
  a. Prove that no pure strategy (M or B) strictly dominates T.  
  b. Prove that T is strictly dominated by a specific mixed strategy (state the mixture and verify domination).  

  **Part 2 (15 marks)**  
  A classmate claims:  
  > "Allowing mixed strategies to dominate pure strategies breaks iterated elimination. Order matters now, and we might accidentally delete a Nash equilibrium. For example, the mixture that dominates T could be eliminated later, retroactively invalidating T’s elimination."

  Evaluate this claim. In your response:  
  - Explain whether iterated elimination of **strictly** dominated strategies (with mixed dominators allowed) is order-independent.  
  - Explain whether this process can remove a strategy played in a Nash equilibrium.  
  - Address why the "later elimination" of the dominating mixture does *not* undermine T’s elimination.  
  - Contrast this with why the classmate’s worries *would* apply to **weakly** dominated strategies.  

  ---

  ### Model Answer (600 words)  
  **Part 1**  
  a. T is not strictly dominated by any pure strategy:  
     - **M vs. T**: Against R, M yields \(-1 < 0\) (T’s payoff). Thus, M does not dominate T.  
     - **B vs. T**: Against L and C, B yields \(-1 < 0\) (T’s payoff). Thus, B does not dominate T.  

  b. T is strictly dominated by a 50-50 mix of M and B. Let \(\sigma = \frac{1}{2}M + \frac{1}{2}B\). The expected payoff of \(\sigma\) vs. any column exceeds T’s payoff (0):  
     - Against L: \(\frac{1}{2}(3) + \frac{1}{2}(-1) = 1 > 0\)  
     - Against C: \(\frac{1}{2}(3) + \frac{1}{2}(-1) = 1 > 0\)  
     - Against R: \(\frac{1}{2}(-1) + \frac{1}{2}(3) = 1 > 0\)  
  Thus, \(\sigma\) strictly dominates T.  

  **Part 2**  
  The classmate’s claim misapplies properties of **weak** dominance to **strict** dominance and misunderstands elimination mechanics.  

  1. **Order-independence**: Iterated elimination of **strictly** dominated strategies (allowing mixed dominators) **is order-independent**. A strategy \(s_i\) is strictly dominated if there exists *any* mixed strategy \(\sigma_i\) yielding higher payoff *against all possible opponent strategy profiles*. Crucially, if \(s_i\) is strictly dominated in the full game, it remains strictly dominated in any subgame containing \(\sigma_i\)’s support. Thus, the sequence of elimination does not affect the final set of surviving strategies. (This mirrors pure-strategy elimination.)  

  2. **Nash equilibria preservation**: Iterated strict dominance **cannot remove any strategy played with positive probability in a Nash equilibrium**. If a strategy \(s_i\) is strictly dominated by \(\sigma_i\), then \(s_i\) is never a best response. In any Nash equilibrium, players only play best responses. Thus, no such \(s_i\) can be in the support of a Nash equilibrium.  

  3. **"Later elimination" of the dominating mixture**: The classmate’s worry is unfounded because:  
     - **Mixtures aren’t eliminated**: Elimination removes *pure strategies*, not mixtures. The 50-50 mix of M and B is not a strategy to be eliminated; it is a tool to justify removing T.  
     - **Elimination is irrevocable**: Once T is removed (because it is strictly dominated at that stage), it never returns. Even if M or B are eliminated later (e.g., if another strategy dominates them), T’s elimination remains valid because it relied on M and B being present *at that step*.  
     - **No retroactive invalidation**: Suppose M is eliminated later (e.g., by another mixture). This doesn’t change the fact that when T was eliminated, \(\sigma\) (using M and B) dominated it. The procedure only requires domination at the time of elimination.  

  4. **Contrast with weak dominance**: The classmate’s concerns *do* apply to **weakly** dominated strategies:  
     - **Order-dependence**: Weak domination can be order-dependent (e.g., in "Beer-Quiche" games).  
     - **Nash equilibria removal**: Weakly dominated strategies *can* be in Nash equilibria (e.g., coordination games), so their elimination may remove equilibria.  
     - **Later elimination**: If \(\sigma\) weakly dominates \(s_i\) but \(\sigma\)’s support is later eliminated, \(s_i\) might "reappear" as undominated in a subgame.  
     However, these issues arise from weak domination’s tolerance for equality, not from mixtures.  

  **Conclusion**: The claim confuses strict and weak dominance. For **strict** dominance (even with mixtures), order-independence and Nash preservation hold. The "later elimination" problem is illusory because mixtures aren’t strategies and elimination is stepwise-valid.  

  ---

  ### Marking Scheme (20 marks total)  
  **Part 1 (5 marks)**  
  - **1a (2 marks)**: Prove no pure strategy dominates T.  
    - 1 mark: Correct comparison for M vs. T (emphasize R: \(-1 < 0\)).  
    - 1 mark: Correct comparison for B vs. T (emphasize L/C: \(-1 < 0\)).  
    - *Common error: Claims M dominates T by ignoring column R.*  
  - **1b (3 marks)**: Verify mixed domination.  
    - 1 mark: Correct mixture (50-50 M/B).  
    - 1 mark: Correct payoff calculations for all columns (1 vs. L/C/R).  
    - 1 mark: Strict domination conclusion (all 1 > 0).  
    - *Common error: Arithmetic mistakes (e.g., miscalculating \(\frac{1}{2}(3) + \frac{1}{2}(-1)\) as 2).*  

  **Part 2 (15 marks)**  
  - **Order-independence (4 marks)**:  
    - 2 marks: States iterated strict dominance (mixed allowed) is order-independent.  
    - 2 marks: Explains why (domination holds in any subgame with \(\sigma_i\)’s support).  
    - *Common error: Confuses with weak dominance or claims order matters "because mixtures change things".*  
  - **Nash equilibria (4 marks)**:  
    - 2 marks: States no strategy in a Nash equilibrium can be strictly dominated.  
    - 2 marks: Explains why (strictly dominated strategies are never best responses).  
    - *Common error: Claims "some Nash equilibria might be removed" or confuses with weak dominance.*  
  - **Later elimination of mixture (4 marks)**:  
    - 2 marks: Explains mixtures aren’t eliminated (only pure strategies).  
    - 2 marks: Explains T’s elimination is irrevocable and depends only on strategies present at that stage.  
    - *Common error: Assumes the mixture "disappears" if M/B are eliminated, retroactively invalidating T’s removal.*  
  - **Weak vs. strict dominance (3 marks)**:  
    - 1 mark: Notes weak dominance introduces order-dependence/Nash issues.  
    - 2 marks: Contrasts strict vs. weak (e.g., weak domination can preserve equilibria, order matters).  
    - *Common error: Fails to distinguish strict/weak or claims mixtures cause these problems.*  

  ### Verification Notes  
  - **Matrix arithmetic**: Double-checked:  
    - \(\frac{1}{2}(3) + \frac{1}{2}(-1) = 1\) (correct for L/C/R).  
    - T’s payoffs are 0 everywhere (correct).  
  - **Domination logic**:  
    - T dominated by mix: Correct (1 > 0 for all columns).  
    - Pure strategies: Correct (M fails vs. R; B fails vs. L/C).  
  - **Game theory claims**:  
    - Order-independence for strict dominance (with mixed) is standard (proof via transitivity).  
    - Nash equilibria: Strictly dominated strategies are never best responses (fundamental theorem).  
    - Weak dominance issues are well-documented (e.g., Marx-Swinkels).  
  - **Marking dispute potential**:  
    - Part 2 weight (15 marks) may seem high, but it targets core misconceptions.  
    - Weak dominance (3 marks) could be 2 marks, but contrasting it is key to the confusion.  
    - "Later elimination" point (4 marks) is emphasized due to the specific error in the claim.  

  *Submitted for final review. Verify column player invariance: Row domination depends only on row payoffs, so unknown column payoffs are irrelevant.*
