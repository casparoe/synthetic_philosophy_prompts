  In conclusion, the classmate's claim is incorrect for strict dominance: iterated elimination with mixed dominators remains order-independent and does not remove any Nash equilibrium strategies. The worry about the dominating mixture being pruned later is a non-issue because we only eliminate pure strategies, and the mixed strategy that dominates T is not a pure strategy. Moreover, the elimination of T is based on the current set of strategies and does not depend on what happens later.

