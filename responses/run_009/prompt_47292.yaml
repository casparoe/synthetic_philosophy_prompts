  b. Consider the mixed strategy σ that plays M with probability 1/2 and B with probability 1/2. The expected payoff of σ against each column is:
  - Against L: (1/2)*3 + (1/2)*(-1) = (3-1)/2 = 1
  - Against C: (1/2)*3 + (1/2)*(-1) = 1
  - Against R: (1/2)*(-1) + (1/2)*3 = (-1+3)/2 = 1

  The payoff of T against any column is 0. Since 1 > 0 for every column, T is strictly dominated by σ.

  **Part 2:**
  The classmate's claim contains several misconceptions.

  First, iterated elimination of strictly dominated strategies (SDS) when allowing mixed dominators is still order-independent. This is because strict domination by a mixed strategy is transitive and the elimination process is well-defined: if a strategy is strictly dominated, it remains strictly dominated even if other strategies are removed (as long as the dominating strategies are still present). In fact, the set of strategies that survive iterated elimination of SDS (with mixed dominators) is unique and does not depend on the order. This is a fundamental theorem in game theory: the order of elimination does not matter for strict dominance when mixed strategies are allowed.

  Second, iterated elimination of SDS (with mixed dominators) never removes a strategy that is played with positive probability in some Nash equilibrium. The reason is that in a Nash equilibrium, no player plays a strictly dominated strategy. This is because if a strategy is strictly dominated, then there exists a mixed strategy that yields a strictly higher payoff regardless of the opponents' actions, so the player would deviate to that mixed strategy. Therefore, any strategy that is eliminated cannot be part of any Nash equilibrium. This holds regardless of whether the domination is by a pure or mixed strategy.

  Third, the classmate worries that the mixed strategy (50-50 mix of M and B) that dominates T might be eliminated later, which would retroactively invalidate the elimination of T. However, this worry is unfounded. The elimination of T is justified at the stage when it is eliminated because the dominating mixed strategy (which uses M and B) is still available. Even if later we eliminate M or B (or both), that does not change the fact that at the time of elimination, T was strictly dominated. Moreover, the elimination of a strategy is permanent and does not get "undone". Also, note that the mixed strategy itself is not a pure strategy to be eliminated; we eliminate pure strategies. So if we later eliminate M and/or B, we are removing pure strategies, but the mixed strategy that dominated T is not a strategy in the game to be eliminated (it's a mixed strategy of the row player, but the elimination procedure only removes pure strategies). Therefore, the elimination of T is valid and does not depend on the future survival of M or B.

