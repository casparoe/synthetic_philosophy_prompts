  I think Maya has a point about acuity—if patients can't even fixate, failure might reflect low-level issues, not conceptual transfer. But Jake's right that demanding "perfect" vision is a moving target. His reply isn't question-begging though; it's pragmatic. Still, Maya could've noted that later testing (after visual maturation) might be better evidence.

  For Round 2: Maya separates the philosophical question (are shape concepts amodal?) from the psychological one (can concepts deploy immediately cross-modally?). She says studies only address the latter. Jake calls this unfalsifiable. 

