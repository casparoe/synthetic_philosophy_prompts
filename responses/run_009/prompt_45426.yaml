  Maya's example actually undermines her Round 2 separation—if transfer happens rapidly, it suggests shared representational formats. But Jake misses that "immediate" might be too strict; Locke never specified a timeframe. 

  On the "two questions" verdict: Maya isn't just rescuing philosophy. The studies *do* answer "can it happen at t=0?" but not "are the concepts fundamentally compatible?" That said, if transfer *never* occurred, it'd challenge amodal views—so data *can* constrain philosophy, just not decisively. 

  The big thing both miss? Molyneux's question assumes shapes are perceived as discrete properties, but modern neuroscience shows vision and touch process geometry differently (e.g., visual motion vs. haptic pressure). Failure might reflect mismatched *feature extraction*, not conceptual gaps. Also, neither mentions developmental critical periods—those patients missed visual wiring windows, so their brains literally couldn't support normal vision-touch integration. 

