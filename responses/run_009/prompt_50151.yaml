prompt: |-
  ok so I'm trying to actually read Kierkegaard instead of just knowing about him, and I'm stuck on a bit from that long book review he published in 1846 (the review of Two Ages, where he drops the novel halfway through and goes off on newspapers and "the public"). I get the general vibe — grumpy 1840s guy vs. the media — but when I slow down I can't follow the actual arguement. Here's the passage, from the translation I've got:

  "For leveling really to take place, a phantom must first be raised, the spirit of leveling, a monstrous abstraction, an all-encompassing something that is nothing, a mirage–and this phantom is the public. Only in a passionless but reflective age can this phantom develop with the aid of the press, when the press itself becomes a phantom. There is no such thing as a public in spirited, passionate, tumultuous times."

  And a little later:

  "The public is not a people, not a generation, not one's age, not a congregation ... for all these are what they are only by being concretions."

  He also calls the public "the actual master of leveling" and "a monstrous nonentity."

  Things I need untangled:

  1. Why does leveling need the phantom first? Why can't an age just level itself down without anyone inventing "the public" — why is the abstraction doing casusal work instead of just describing what's happening anyway?
  2. "when the press itself becomes a phantom" — is the press only phantom-like in a passionless age, or is a newspaper intrinsically an abstraction because it's not a "political concretion" (his phrase elsewhere in the review)?
  3. This one is really bugging me: he says the public is "an all-encompassing something that is nothing, a mirage" AND the "actual master of leveling." How can a mirage be the master of anything? Is the idea that people start acting as if the public existed, and that acting-as-if is what does the leveling — so it's real the way a self-fulfilling prophecy is real? Or is he saying the public "does" the leveling in some other, non-causal sense that I'm missing?
  4. What's a "concretion" here? Is the point just that "the public" has no members (nobody is the public the way somebody is a Dane or a member of a congregation), or is it something stronger about how words like "people" get their meaning in the first place?

  Also: "There is no such thing as a public in spirited, passionate, tumultuous times" — does "there is no such thing" mean the public literally doesn't exist in those times, so it only ever exists as a kind of collective mistake people can fall into? Or just that nobody in those times bothers with the concept?

  Please actually work through the passage with me instead of giving me the encyclopedia entry on Kierkegaard and leveling — I've read the summaries, I want the machinery. I know his final answer is basically religiousness, but I want to understand how the press/public/leveling part is supposed to run on its own terms before I get to that.
