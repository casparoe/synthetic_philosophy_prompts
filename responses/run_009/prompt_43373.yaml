prompt: |-
  Every other month I run a little discussion group at work — six or seven coworkers, none of them philosophers, one 90-minute session on some ethics-ish topic. Next up is standing to blame and hypocrisy, and what I want from you is a plan for how I should run the explanation, not the explanation itself. The core thing I want them to walk out with is the distinction between whether someone's blame is on target and whether they're well positioned to deliver it — the hypocrite can be right about the wrongness but lack the standing to blame, and "do as I say, not as I do" doesn't settle it either way. I'm torn on the carrying example: the obvious one is the parent who smokes telling their kid not to smoke, but I worry it actually undercuts the point, because the parent seems to have a special license there ("I know because I did it"). Maybe a better carrier is the coworker who quietly takes credit for other people's work and then gives a big speech about team ethics? You decide — and tell me what the example needs to have and to lack. Misconceptions I'm bracing for: that hypocrisy shows the blame is wrong (conflating standing with truth), that you have to be blameless yourself before you can blame anyone for anything, and — this one is subtle and I half beleive it myself — that the only cure for hypocritical blame is to stop blaming rather than to stop the hypocrisy. Where in the sequence should each of those get headed off, and in what order do the pieces need to come so nothing lands before its time? Also tell me where to slot the question of wether standing to blame is even a real moral phenomenon or just a rude way of pointing back at the blamer, and what one question I can ask at the end to check it landed. Skip the academic literature entirely, they'll glaze over. Lead with the bottom line — your call on the right sequence and carrier — in your first sentence, then the reasoning, no preamble and no restating my question.
reasoning: |-
  Okay, the user is running a discussion group on ethics topics at work, focusing next on standing to blame and hypocrisy. They want a plan that distinguishes between the accuracy of blame and the blamer's position to deliver it. Key misconceptions to address include conflating hypocrisy with incorrect blame, thinking one must be blameless to blame, and the idea that stopping blame is the only solution.

  First, I need to choose an effective example. The parent smoking might imply special authority, so that's risky. The coworker taking credit and preaching teamwork avoids that, showing clear hypocrisy without inherent justification. It highlights standing without conflating with truth.

  Next, structuring the sequence. Start with the core distinction upfront to anchor the session. Use the coworker example to illustrate how blame can be correct but the blamer lacks standing. Then tackle misconceptions in order: first, that hypocrisy makes blame wrong (address early with the example). Second, the idea that one must be blameless to blame—use a third-party example to show neutrality isn't required. Third, the subtle point about curing hypocrisy by stopping blame—emphasize reforming behavior instead.

  Including the meta-question about standing's reality: slot it after the distinction is clear but before misconceptions. Ask if it's a genuine moral issue or just deflection. This positions it as a substantive concept.

  For the closing check, ask participants to generate their own examples of correct blame with poor standing. This tests their grasp of the separation between truth and standing.

  I should avoid academic terms, keep it practical. Ensure each part builds logically: distinction first, then examples, address misconceptions in order of complexity, validate the concept, end with application. Watch for the user's half-belief about stopping blame as the only cure—reinforce that fixing the hypocrisy is key. The coworker example effectively lacks special roles, making the standing issue clearer.
answer: |-
  Here's your session plan:

  **Lead with the core distinction using the coworker hypocrisy example:** Begin by stating clearly: "Today we're separating *whether someone is right about the wrongness* of an action from *whether they are in a good position to be the one blaming* for it. For example, imagine a coworker who quietly takes credit for your work on a project, but then gives a big speech to the team about the importance of giving proper credit and not stealing others' contributions. Their *point* about stealing credit being wrong might be absolutely correct, but *them* being the one to give that lecture feels deeply off-putting and unfair – they likely lack the 'standing' to be the blamer here."

  **Why this carrier example works (and what it has/lacks):**
  *   **Has:** Clear hypocrisy ("do as I say" vs. "what I do"), relatable workplace context, separates the *truth* of the ethical claim (stealing credit is wrong) from the *position* of the blamer (they are guilty of it).
  *   **Lacks:** Any inherent special justification or role-based authority (like a parent might claim). The hypocrisy directly undermines their credibility *as a blamer* without necessarily invalidating the underlying principle. It focuses on *their specific failing* related to the blame act.
  *   **Avoids:** The parental "I know because I did it" complication. The coworker gains *no* moral authority from their hypocrisy.

  **Session Sequence & Misconception Mitigation:**

  1.  **Core Distinction & Initial Example (5-10 mins):** Start immediately with the statement above. Present the coworker scenario. Ask: "Is their *point* about stealing credit being wrong correct?" (Yes). "Does it feel legitimate for *them* to be the one giving this lecture?" (No). Label this feeling: "That's the sense that they lack the *standing* to blame – their hypocrisy undermines their position *as a blamer*, even if their *message* is true."
      *   *Heading off Misconception 1 (Hypocrisy shows blame is wrong):* Explicitly state: "Their hypocrisy doesn't magically make stealing credit *okay*. The underlying wrongness stands. It just makes *them* a lousy messenger for that particular blame."

  2.  **Deepen the Distinction: "On Target" vs. "Well Positioned" (15 mins):** Break it down further.
      *   "Was the Blame **On Target**?" Did they correctly identify a genuine wrong? (Yes, stealing credit *is* wrong).
      *   "Were They **Well Positioned** to Deliver It?" Did their own actions, character, or relationship to the wrong make them hypocritical, compromised, or unfair *in delivering this specific blame*? (Yes, because they do it themselves). Emphasize these are two separate questions. Introduce the phrase "lacking standing" as shorthand for "not well positioned."

  3.  **Slot the Meta-Question: Is Standing Real? (10 mins):** *After* establishing the distinction but *before* tackling the "blamelessness" misconception. Pose: "Is this 'standing to blame' a real moral thing, or is it just a defensive trick – a way for the person being blamed to say 'Look over there!' and deflect?"
      *   Guide discussion: If it's just deflection, why does the coworker example feel so intuitively *unfair*? Does hypocrisy genuinely damage trust, sincerity, or fairness in the blaming act itself? Conclude that while it *can* be used defensively, the underlying feeling points to a genuine moral feature of interpersonal blame – fairness and consistency matter in who accuses whom.

  4.  **Tackle "Blamelessness" Misconception (15 mins):** *Now* address Misconception 2 ("You must be blameless to blame").
      *   **Counter-Example:** "Imagine a manager who *used* to frequently interrupt people in meetings but has genuinely worked hard and succeeded in stopping for the last year. They call out a team member who constantly interrupts others. Are they hypocritical? (Slightly, based on past actions). Do they lack *all* standing? (Probably not – their reform matters). Does someone need to be *perfect* on *every* issue to blame *any* issue? (No)."
      *   **Key Point:** Standing is specific. It's about *relevant* hypocrisy or compromised position *related to the specific wrong being blamed*. You don't need sainthood; you need not to be *guilty of the very same thing you're blaming, in a way that undermines your fairness*. Reform can restore standing. Standing can also be lacking for non-hypocrisy reasons (e.g., complicity).

  5.  **Address the Subtle Cure: Stop Blaming vs. Stop Hypocrisy (15 mins):** *Finally*, tackle Misconception 3 (Only cure is to stop blaming).
      *   **Reframe:** If the problem is the hypocrite's *own actions* undermining their standing, what actually *fixes* their standing? Is it silencing them, or is it them *changing their own behavior*?
      *   **Scenario:** Back to the credit-stealing coworker. If they *stopped* stealing credit (and maybe apologized), would they *gain* standing to credibly speak against it in the future? (Yes). If they just *stopped* giving the lectures but kept stealing credit, is the problem solved? (No – the underlying wrong and their hypocrisy remain). The cure for hypocritical blame is primarily for the *blamer* to *stop the hypocrisy* (reform), not necessarily to stop the blame *if* they reform. Sometimes stopping blame *temporarily* is necessary *while* reforming.

  **Final Check Question (5 mins):** "Think of a situation where someone might be *right* that an action is wrong, but you'd still feel they lack the standing to be the one calling it out. What's the hypocrisy or compromising factor?" (Listen for examples showing they grasp the separation of truth from blamer-position).
