answer: |-
  Based on your neighbor's pattern of verdicts and the underlying logic of the four-rung ladder, here's a breakdown of her likely reasoning, predicted verdicts for your new cases, and a strategy to test the boundaries. Her system prioritizes *how* cognition is structured over *what* it achieves, with key thresholds at **internal simulation** (rung 3) and **culturally transmitted symbolic tools** (rung 4).

  ### Predicted Verdicts for New Cases
  1.  **Octopus watching & unscrewing jar:** **Rung Two.** She’ll argue this is observational *association*, not insight. The octopus links "jar + action = reward" after seeing it once, but it’s not simulating novel internal scenarios. It’s fast trial-and-error bootstrapped by social cues (like the Skinner box rat), not offline mental rehearsal.
  2.  **Chess program evaluating millions of continuations:** **Rung Three (with discomfort).** She’ll concede this looks like "offline trial-and-error" (simulating moves without acting). However, she’ll likely add caveats: it’s not *biological* cognition, lacks true "error" (it’s deterministic calculation), and is programmed—so it might "fall off the ladder" as an artifact. But formally, it fits her rung-three criterion of pre-action simulation.
  3.  **New Caledonian crow with culturally transmitted tool designs:** **Rung Two.** This is the most contentious! She’ll acknowledge the *social learning* but deny it’s rung four because the "thinking tools" (tool designs) aren’t *symbolic* (like words/numbers). She’ll call it sophisticated rung-two learning: copying physical actions/outcomes ("do this to get food"), not internalizing abstract representational systems that restructure thought. The *tradition* is real, but the *cognitive mechanism* remains associative.
  4.  **You doing long division on paper:** **Rung Four.** Textbook case. You’re using external symbolic notation (digits, operators, place value) and culturally learned algorithms. This changes the *kind* of thinking possible (handling abstract quantities impossible to manage mentally), fitting her "not just faster rung three" stance.

  ### The Underlying Rules (Decoding Her Ladder)
  Her boundaries hinge on **representational format and origin**:
  - **Rung 1 → Rung 2:** Shift from *genetic* problem-solving to *individual experiential* learning (trial-and-error).
      - *Criterion:* Can the individual *modify behavior within its lifetime* based on direct experience?
  - **Rung 2 → Rung 3:** Shift from *behavioral trial-and-error* to *internal simulation*.
      - **Her Core Criterion: Offline generation and evaluation of *novel* action sequences or outcomes *before* acting.** Mere "remembering what worked" (like the rat pausing) isn't enough. It requires flexible mental manipulation of representations (e.g., the chimp imagining crate-stacking configurations, the raven mentally "testing" wire bending).
      - *Not just one-trial learning*: The octopus case shows fast learning can still be rung two. *Not just pausing*: The rat paused but didn’t simulate alternatives. Scrub-jays re-hiding caches are applying a learned "if observed, re-hide" rule, not mentally role-playing the thief's actions.
  - **Rung 3 → Rung 4:** Shift from *internally generated simulations* to *cognition structured by external symbolic systems*.
      - **Her Core Criterion: Use of *abstract, recombinable symbols* (language, math, maps) acquired culturally, which enable *new cognitive operations* impossible otherwise.** These tools aren't just shortcuts; they allow hierarchical reasoning, formal logic, and decoupled thought (e.g., long division vs. mental estimation). Physical tool *traditions* (like the crow’s) don’t count—they lack the symbolic abstraction.

  ### Why the Crow Case Splits the Interpretations & How to Test It
  - **Conflict:** Rung four requires **symbolic cultural tools**. Your neighbor likely defines "symbol" narrowly: a *referent-decoupled* token governed by combinatorial rules (like words/numbers). Crow tool designs are culturally transmitted, but they’re *coupled* to immediate function and physical form. She sees them as "recipes," not symbols enabling abstract thought.
  - **Test Case to Split Interpretations:** Introduce **an animal using a *referential symbolic system***.
      - **Option A (If she denies rung four to crows):** *Kanzi the bonobo* using lexigrams *combinatorially* (e.g., "chase bite ball" to describe a game). If she calls this rung four, it confirms her rung four is **language-like symbolism**. If she calls it rung three ("just associative combinations"), it shows she reserves rung four for *human-level* symbols.
      - **Option B (If she denies rung three to crows):** A *crow solving a novel multi-step puzzle* requiring tool modification *without prior trial* (e.g., breaking a stick to create a hook for a new task). If she accepts this as rung three, it shows her boundary is **novel solution generation via simulation**. If she dismisses it as "instinct" or "luck," her rung three is inconsistently strict.

  ### The Chess Program: Where the Ladder Breaks
  - **Her Dilemma:** The program *operationally* fits rung three (massive offline simulation). But it challenges her framework because:
      1.  It lacks *embodiment* (no "body" to commit).
      2.  It lacks *biological error* (mistakes are miscalculations, not survival risks).
      3.  Its "simulation" is brute-force computation, not flexible mental modeling.
  - **Likely Verdict:** She’ll bite the bullet and call it **rung three technically, but not "real" cognition**. She might argue the ladder is for *biological* minds, excluding AI. This exposes an unstated premise: the ladder assumes **evolutionarily shaped, embodied intelligence**. The chess program highlights that her system isn’t about *computation* but about *biological cognitive architecture*.

  ### Strategic Summary
  - **Her Likely Rules:**  
    - **Rung 3:** Evidence of *internally generating and evaluating novel action/scenario representations* prior to action.  
    - **Rung 4:** Use of *culturally acquired, abstract symbolic systems* that enable decoupled, hierarchical thought.  
  - **Best Test:** Present **Kanzi’s symbolic combinations** or **crows generating novel tool solutions without trial**.  
  - **Weak Spot:** The chess program forces her to confront the **biological bias** in her framework. Ask: "If the chess program isn’t rung three, is it only because it isn’t made of meat? What if we find a biological brain that computes like this?"

  Walk in ready to challenge the crow verdict—it’s the most revealing edge case. If she calls it rung two, press her: "What *specific* evidence would show a bird is using a cultural *symbolic* tool, not just a copied action?" Her answer will clarify the rung-four boundary. Good luck!
