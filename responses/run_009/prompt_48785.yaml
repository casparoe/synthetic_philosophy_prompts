prompt: |-
  I'm an undergraduate taking a seminar this term on personal identity, and my study partner and I have gotten into the habit of running thought experiments past each other before each Tuesday session. Over the semester she has built up a track record of verdicts on mind-transfer cases, and for the final session our instructor is having us each predict the other's verdict on a new case he has circulated, with our prediction sheets due before we discuss it. I've been keeping notes on her record, and I can't settle on a prediction. Her verdicts so far:

  - If her neurons are replaced one at a time, over roughly five years, by silicon chips that take over each neuron's input-output role at the moment it is removed, while she goes on living normally: she survives, and remains conscious throughout.
  - The same procedure, confined to her left hemisphere over two years: she survives.
  - If every organ except her brain were replaced with artificial parts: she survives, obviously.
  - If her brain is destructively scanned and an exact emulation of her is then run: the emulation is fully conscious, but she does not survive — a new person comes into existence who happens to be psychologically continuous with her.
  - If the scan is non-destructive: she survives in the flesh, and the digital copy is a new person.
  - A teletransporter that destructively scans her and reconstructs her elsewhere: no survival.
  - A patient whose brain activity was deliberately and completely suspended for a full day of hypothermic surgery and then restarted: she survives.

  She insists her verdicts have nothing to do with consciousness — she is entirely willing to grant that the emulation and the copy are conscious — and says the question is always whether the later system is the same continuing one as the earlier one. That formula hasn't helped me, because I can hear at least three different ideas inside it, and I can't tell which she means.

  The new case we have to predict on: over a single weekend, under general anesthesia, each of her neurons is removed one at a time and replaced by a chip that is not installed in her skull but sits in a server rack across campus, connected by a radio link with sub-millisecond latency. At no moment is any of her brain's function interrupted; the last biological neuron is retired on Sunday night; on Monday she wakes up with no biological brain in her head at all. What will she say — survival or no survival?

  My uncertainty is about what, in her eyes, did the work in the earlier cases: the unbroken causal handoff from each dying neuron to its successor, the sheer slowness of the change relative to ordinary cellular turnover, or the fact that everything so far happened in place, inside her skull. The new case seems designed to pull these apart — the timescale collapses, the hardware leaves her head, but the handoffs never miss a beat — and depending on which of those I take to be her real criterion, I get opposite predictions.

  Please don't hand me a menu of candidate rules with the choice left to me. Commit: identify the rule her track record most plausibly shows her running, name the strongest rival rule that fits the same verdicts, and state your actual prediction for the weekend case, with your reasons for preferring that reading of her. Then tell me the single further case — one you invent, stated concretely — that would most cleanly separate the two candidate rules, and say what each rule predicts about it. Keep the whole thing to 600 words or fewer.
reasoning: |-
  Okay, the user is an undergraduate in a philosophy seminar on personal identity. They're trying to predict their study partner's verdict on a new mind-transfer case based on her previous judgments. I need to help them figure out her underlying rule. 

  First, let's list her past verdicts clearly: 
  - Gradual neuron replacement over years: survival
  - Left hemisphere only: survival 
  - Full body replacement: survival 
  - Destructive brain scan emulation: no survival 
  - Non-destructive scan: original survives, copy is new 
  - Destructive teletransporter: no survival 
  - Hypothermic suspension: survival 

  Her key statement is that survival depends on whether "the later system is the same continuing system as the earlier one," not consciousness. 

  The new case involves weekend neuron replacement with off-site chips via radio link - fast, external hardware, but continuous function. 

  Looking at her pattern: 
  - She accepts gradual replacement (cases 1-2) and full suspension (case 7) as survival 
  - Rejects destructive copying (cases 4,6) 
  - Distinguishes original from copy in non-destructive scan (case 5) 

  The critical factor seems to be causal continuity without branching. In gradual replacement, there's no moment where multiple claimants exist - it's a single continuous system. Whereas copying creates competing streams (case 5) or replaces the original (cases 4,6). 

  In the hypothermia case (7), though function pauses, the physical substrate remains continuous. 

  Now for the new weekend case: 
  - Hardware moves off-site 
  - But causal chain remains unbroken (sub-millisecond latency) 
  - No branching occurs 

  If her core principle is unbroken causal continuity (regardless of speed or location), she should say survival. The suddenness might give pause, but her suspension case shows she accepts temporal gaps if the system persists. 

  The main alternative rule would be physical continuity (things staying in the skull). But that fails because: 
  1) She accepts full body replacement (case 3) which removes physical brain components 
  2) She rejects destructive scans even if the copy is physically identical 

  Thus physical continuity isn't her driver. 

  Prediction: She'll say survival. 

  To test this, propose a branching case: 
  - Non-destructive scan creates a copy while she remains conscious 
  - Then the original biological brain is gradually replaced over years while the copy runs separately 

  My rule (causal continuity without branching) predicts: 
  - Original survives replacement (continuous system) 
  - Copy is new person (branched off) 

  Physical continuity rule would say: 
  - Original survives only until replacement starts (losing physical brain) 
  - But that contradicts her gradual replacement verdicts 

  This cleanly separates the rules.
answer: |-
  Based on her verdicts and stated principle ("same continuing system"), her core rule is **unbroken causal continuity without branching**: survival requires that the later stage is causally connected *as the same persisting system*, with no point where multiple claimants (like an original and a copy) coexist or compete. 

  **Your prediction for the weekend case: SHE SURVIVES.**  
  *Why this rule fits her record:*  
  - Gradual replacement (cases 1, 2) preserves the system’s causal thread without branching.  
  - Non-destructive scan (case 5) creates a *new* branch (the copy), so only the original survives. Destructive scans (cases 4, 6) lack continuity—no system persists.  
  - Hypothermic suspension (case 7) has causal continuity despite paused function (substrate persists).  
  - Off-site hardware (new case) doesn’t break continuity: the system operates unbroken via seamless handoffs (like case 1), and no branching occurs. Speed/location changes don’t disrupt the causal chain.  

  **Strongest rival rule: Physical continuity of the brain substrate.**  
  *Why it initially fits:* Rejects scans/teletransport (new substrate) but accepts gradual replacement (substrate changes slowly) and suspension (same substrate).  
  *Why it fails:*  
  1. She accepts full body replacement (case 3)—non-brain substrate changes entirely.  
  2. Gradual *brain* replacement (case 1) destroys the substrate yet she says survival. Physical continuity isn’t decisive.  

  **Test case to separate the rules:**  
  *A non-destructive scan creates a digital copy while she remains conscious. Then, over 10 years, her biological neurons are gradually replaced by chips linked to the* same *server running her copy. The copy is never activated until replacement completes.*  

  - **Her rule (causal continuity):** SHE SURVIVES. No branching occurred *during* continuity—the copy was inert until after replacement finished. The active system persisted unbroken.  
  - **Rival rule (physical continuity):** SHE DOES NOT SURVIVE. The original biological brain is gone, replaced by new hardware.  

  This test isolates whether substrate or unbroken causal flow matters when no branching overlaps with the continuous system. Her history favors the latter.  

  **Prediction confidence:** High. Her suspension case (7) shows temporal gaps don’t break continuity if the system persists; here, the system never even gaps. Off-site hardware is a red herring—only causal unity counts.
