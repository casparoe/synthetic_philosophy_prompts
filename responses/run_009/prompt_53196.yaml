answer: |-
  Your exploration cuts to the heart of profound moral phenomenology, and philosophy *does* have precise concepts to dissect this "stain." The closest established term is **Moral Residue**, primarily associated with the work of philosophers like Bernard Williams and Thomas Nagel, particularly within discussions of **"Agent-Regret"** and **"Tragic Dilemmas."** However, let's define it rigorously for your practical application.

  **The Established Core: Moral Residue & Agent-Regret**

  1.  **Moral Residue:** This is the *persistent emotional and psychological aftermath* experienced by an agent *after* making a morally correct, or at least defensible, decision in a situation where *all available choices involve significant moral loss or violation*. It's the "stain" you describe.
  2.  **Agent-Regret (Bernard Williams):** A specific, powerful form of regret distinct from mere regret about a bad state of affairs or remorse over a wrong *choice*. Agent-regret is:
      *   **First-Personal:** It is felt *because I was the one who acted*, even if my action was necessary or justified.
      *   **Appropriate/Intelligible:** It is not necessarily irrational or a sign of error; it can be a fitting response to the awful *situation* one was instrumental in bringing about.
      *   **About the Outcome Linked to Agency:** It focuses on the *harm* that resulted *through one's own agency*, even if that agency was constrained or the harm unavoidable given the circumstances.

  **Applying the Concepts to Your Characters & Defining the Edges**

  *   **The Mother:** This is a paradigmatic case of **agent-regret** generating **moral residue**.
      *   **Action:** She *actively chose* (named the son) under duress.
      *   **Correctness?** Given the options (refuse -> both die; choose -> one lives), choosing one was arguably the *lesser evil* or even the *only conceivable right action* to save a life. No *choice error*.
      *   **Residue:** Her guilt stems from being the *agent* through whom the specific harm (the younger son's fate) was directly channeled. She *did* something awful (naming her son for death), even if the awfulness was forced upon her by the situation. The residue is the lifelong burden of that agency. Williams would emphasize it's intelligible *because* it was *her* doing.
  *   **The Doctor:** This also fits **moral residue**, potentially involving a nuanced form of **agent-regret**.
      *   **Action:** He *administered* a rule he endorsed, making a *decision* based on it (denying care).
      *   **Correctness?** Following the rule (e.g., "treat those with survival probability above X who arrived before time Y") was correct *given the systemic constraints and goal of saving the most lives*. No *decision error* based on the rule.
      *   **Residue:** The guilt stems from being the *agent who enacted* the system's necessary brutality. While he didn't invent the rule, he was its instrument. His agency is implicated:
          *   He *applied* the rule to *this specific man*.
          *   He *endorses* the rule system, sharing responsibility for its outcomes.
          *   He *faced the victim* as the agent of denial. The residue is the burden of embodying the system's tragic logic in a concrete, life-ending moment.

  **Key Characteristics of the Configuration (The "Stain") - Criteria for Application:**

  1.  **Unavoidable Moral Conflict:** The agent faces a genuine **tragic dilemma** or **moral remainder situation**. There is no cost-free option. *All* choices involve violating a significant moral value or causing serious harm. (This directly counters the view you mentioned that dilemmas are illusions; philosophers like Williams, Nagel, and Martha Nussbaum argue compellingly for their reality).
  2.  **Correct (or Defensible) Action Chosen:** The agent chooses the *best available option* under the horrific constraints, the *lesser evil*, or the action dictated by a justified rule/system. There is no *better alternative* the agent could/should have seen at the time.
  3.  **Significant Moral Loss:** The chosen action *necessarily* results in serious harm, suffering, or the violation of a deep moral principle (e.g., sacrificing one life, denying care, breaking a promise under duress).
  4.  **Agent as Conduit:** The harm occurs *specifically through the agent's own necessary action or decision*. They were not merely present; they *did* the thing that caused the harm, even if forced by circumstance.
  5.  **Residue as Fitting Response:** The resulting guilt/shame/stain is portrayed not as *irrational* (though painful), but as an *intelligible, fitting, even constitutive* part of being a moral agent who lived through and acted within that awful situation. It testifies to the *reality* of the moral loss incurred, even by the right action. It acknowledges the agent's *involvement* in the harm.

  **Where the Edges Lie - Important Exclusions:**

  *   **Ordinary Regret:** Feeling bad about a bad outcome one caused *if* one could have avoided it or if the action was wrong. (E.g., "I regret speeding because I got a ticket and it was reckless").
  *   **Remorse:** Feeling guilty *because one believes one did the wrong thing*. (E.g., "I feel remorse for betraying my friend; I shouldn't have done it").
  *   **"Dirty Hands" (Strict Political Sense):** While related, classic "dirty hands" (e.g., Machiavelli, Walzer) involves *knowingly doing moral wrong* (e.g., torture, assassination) for a greater political good (saving the state). The agent *transgresses*. Your characters, while causing harm, are not typically seen as *transgressing*; they are doing the *best possible thing* within impossible constraints. The "dirt" comes from the situation, not (primarily) from a chosen transgression for gain. *However*, the broader phenomenological experience of "dirtiness" overlaps significantly.
  *   **Survivor Guilt:** While similar in feeling, survivor guilt often lacks the *active agency* component. It's guilt for *having survived* when others died, not necessarily guilt for *having done something* that caused the death (even if necessary).
  *   **Irrational/Neurotic Guilt:** Guilt that persists despite the agent clearly having done nothing wrong and having no causal or agential link to the harm. This is pathological, not a fitting moral residue.

  **Coining a Term for Precision: Agent-Stain**

  If you find "moral residue" too broad (it can sometimes cover simpler regret) or "agent-regret" too specific to Williams' formulation, consider coining **Agent-Stain**.

  *   **Definition:** The *indelible, fitting sense of moral taint or burden* experienced by an agent *as a direct result of having performed a necessary and correct action* within a *genuine tragic dilemma*, where that action *inevitably and directly* caused significant harm or violated a deep moral value.
  *   **Criteria for Application (Agent-Stain):**
      1.  Genuine tragic dilemma (unavoidable moral conflict with loss).
      2.  Action taken was necessary and correct/defensible under the circumstances.
      3.  Action directly caused significant harm/moral violation.
      4.  The agent was the conscious executor of the action.
      5.  The "stain" is portrayed as a fitting, non-pathological response to the conjunction of agency and tragic necessity.

  **Applying "Agent-Stain" to Your Questions:**

  *   **Does it apply to the Doctor?** **Yes.** He administered the rule, making the concrete decision that sent the man away. His agency was the necessary conduit for the system's tragic outcome in that instance. The stain arises from being the one who *enacted* the denial upon that specific person, even though the rule and its application were correct.
  *   **Does it apply to the Mother?** **Yes, quintessentially.** She performed the direct, agonizing act of naming her son. The stain is the lifelong burden of that specific, necessary act of agency.
  *   **Difference from Regretting a Bad Outcome?** **Crucially, yes.** Ordinary regret focuses on the *outcome being bad*. Agent-stain focuses on the *outcome being bad AND having been brought about through my own necessary, correct action*. The "stain" is the mark of that *personal, agential involvement* in the necessary harm. Regretting a bad outcome you caused *might* involve agent-stain, but only if the action causing it was also the *correct/necessary* one in a dilemma. If the action was wrong, it's remorse, not agent-stain.

  **In Conclusion:**

  The philosophical framework you need centers on **moral residue** arising from **agent-regret** within **tragic dilemmas**. The core insight is that *acting rightly in a morally catastrophic situation does not absolve one of the emotional and psychological burden of having been the agent through whom the catastrophe was, in part, realized*. The "stain" is the mark of that inescapable agency amidst tragedy. Using the established terms or the coined **"Agent-Stain"** with the strict criteria provided will give you the precision to identify and portray this profound phenomenon authentically in your characters, scene by scene. The stain *is* the rational response to the situation *precisely because* the situation forced the agent to become the instrument of harm through their own necessary action.
