  The term "moral remainder" from Williams and "tragic agent" from Nussbaum could also apply. Tragic dilemmas acknowledge that no choice is without cost, and the guilt is a testament to the character's moral awareness. The user needs to distinguish this from ordinary regret or remorse. 

  The user's deeper need might be to accurately portray this guilt in their writing, ensuring characters feel authentic. They might also seek validation that this phenomenon is recognized, helping them refine their thematic exploration. Coining a term like "agent-stain" could provide precision, emphasizing the indelible mark on the agent despite correct action.

  I should check if existing terms suffice. "Moral residue" is close but might need clarification. The doctor's case involves institutional rules, so the guilt might stem from complicity in the system. The mother's is more personal. Both, however, share the inescapable moral stain from the situation's structure. 

  The user needs explicit criteria: unavoidable choices between vital goods, correctness of the action, necessary guilt as fitting response. Exclusions include cases with better alternatives or irrational guilt. Ensuring the term's applicability scene by scene is crucial for their writing process. 

