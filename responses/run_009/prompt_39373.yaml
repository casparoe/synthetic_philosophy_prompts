answer: |-
  Here's a breakdown of the implicit theory embedded in the practices you describe, rigorously distinguishing what the practices *require*, what they are merely *compatible* with, and where the inconsistencies lie, especially regarding the subtitle paradox:

  ### Core Implicit Theory of the Practices
  1.  **The Word Itself Carries Intrinsic Harm/Offense:** The consistent masking/replacement (even in direct quotes and transcripts) presupposes that **the *lexical string itself* possesses a harmful, offensive, or taboo quality independent of any single utterance.** This is non-negotiable. If the harm resided *solely* in speaker intent or audience perception, verbatim reporting of quotes/transcripts wouldn't be problematic. The act of *writing* or *displaying* the string is seen as actively inflicting harm or perpetuating the offense.

  2.  **Speaker Identity Modulates *Permission* to Use the String:** The in-group/out-group moderation carve-outs presuppose that **the speaker's identity determines whether using the string is *permissible* or constitutes a *social/policy violation*.** An out-group member using it is seen as wielding a weapon; an in-group member using it might be seen as reclaiming, referencing, or using in-group vernacular. This is fundamentally about **social norms and standing**, not altering the core meaning.

  3.  **Context Can Mitigate *Responsibility* or *Endorsement* (Barely):** The awkward handling of lyrics and quoted speech suggests a weak concession that **the *context* of an utterance (e.g., reporting, art, historical document) *might* lessen the *endorsement* or *direct responsibility* of the *current publisher/platform* for uttering the string.** However, this mitigation is insufficient to overcome the intrinsic harm of displaying the string (point 1), hence the masking/replacement persists. The harm of the word itself trumps contextual nuance for publishers.

  ### Addressing Your Core Questions

  *   **Does this practice *require* speaker-relative/identity-dependent semantics (à la Hom, Camp, etc.)?**
      *   **No.** The practice is **compatible** with such views but **does not strictly require them.** It primarily requires Point 1 (intrinsic harm of the string) and Point 2 (identity-dependent *norms of use*). A **fixed derogatory content view** can survive:
          *   **Fixed Content View:** The slur `S` *always and inherently* expresses derogatory content `D` targeting group `G`.
          *   **Practice Interpretation:** *Using* `S` always expresses `D`. However, *social norms* dictate that only members of `G` have the standing to *invoke* `D` without automatic censure (for reasons of reclamation, in-group discussion, etc.), while out-group use is inherently an act of derogation and aggression. The *meaning* `D` is fixed; the *permissibility and social consequences* of invoking it are relative. Masking protects audiences from exposure to `D` itself.

  *   **Could a purely pragmatic account (offense = intent + expectation) license this bundle?**
      *   **No, it cannot fully explain the core practice.** A purely pragmatic account (offense arising solely from speaker intent to derogate or violate audience expectations) **fails to explain Point 1:**
          *   **Quote/Transcript Masking:** If offense depends on the *original speaker's* intent, verbatim reporting merely *reports* that intent, it doesn't *re-enact* it. The reporter/captioner has no intent to derogate. Masking makes no sense under pure pragmatics. The practice reveals a belief that the *string itself* triggers offense/harm *regardless* of the current user's intent.
          *   **Lyrics/Quoted Speech Awkwardness:** The *need* for awkward special cases arises *because* pragmatics (context, intent) *should* mitigate the offense. Yet the string is still often masked, showing the intrinsic harm view outweighs the pragmatic mitigation.

  *   **Which semantic views are ruled out?**
      *   **Views denying intrinsic semantic offensiveness** are ruled out. Any theory claiming the derogatory force is *exclusively* pragmatic (e.g., only from speaker attitude or conversational implicature) cannot explain the systematic avoidance of the bare string even in contexts devoid of derogatory intent (reporting, transcribing, subtitling). The practice *requires* that the string itself bears semantic (or at least conventional/social) offensiveness.

  ### The Subtitle Stress Test: Exposing Inconsistency
  *   **The Paradox:** Unbleeped audio delivers the harmful string directly to the audience's ears. Masked text hides the same string from the eyes. This *seems* to presuppose:
      *   Audio: The offense is in the *act* of the *original speaker*. Since they said it, the audio is merely reportage. Harm flows from the original utterance event.
      *   Text: The offense resides in the *displayed string itself*. Writing it (even as transcription) is an active act of infliction by the *captioner/network*.
  *   **Who is "Saying It"? The Incoherence:**
      *   **Original Speaker:** Clearly uttered it. But the captioner isn't them.
      *   **Captioner:** Produces the token, but only as a faithful reporter. They intend no offense. If the harm is solely in the original act, why mask *their* token?
      *   **The Network:** Publishes both tokens. Why is the audio token acceptable reportage but the written token unacceptable?
  *   **The Implicit Theory's Failure:** The practice provides **no coherent answer.** It simultaneously relies on:
      1.  The intrinsic harm of the string (requiring text masking).
      2.  The context of reportage (allowing unedited audio, assuming its harm is merely referential, not re-inflicted).
      **These are inconsistent.** If the string is intrinsically harmful, broadcasting it *is* re-infliction, regardless of medium. If the harm is only in the original speech act and context, transcribing it faithfully shouldn't require masking. The practice tries to have it both ways and fails logically.

  ### Minimal Patch for Coherence
  The inconsistency arises from treating audio and text differently despite both being representations of the same harmful utterance. A minimal patch requires choosing one core principle consistently:

  1.  **Option 1 (Strict Intrinsic Harm):** **The string itself is harmful upon perception.** *Both* audio and text representations should be masked/bleeped if the word is deemed too harmful to display/utter in *any* context by the platform. (This is rare, as unbleeped audio is common).
  2.  **Option 2 (Contextual Harm):** **Harm is tied to the original utterance *event* and the *platform's role* in reproduction.** If the platform is purely reporting/transcribing without endorsement, *both* audio and text can be presented verbatim. Masking is unnecessary. Harm flows from the original speaker's act, not the platform's reproduction of it. (This clashes with current text practices).
  3.  **Option 3 (Medium-Specific Harm - Ad Hoc but Common):** **The written word is uniquely potent/permanent/actionable.** This is the de facto patch: writing the string is seen as a more deliberate, replicable, endorsing, or legally risky act *for the publisher* than transmitting audio of someone else saying it. The harm isn't *just* semantic; it's also social/legal risk associated with *publishing the string in text*. This isn't a semantic theory, but a pragmatic institutional risk-aversion layered on top. It "patches" the inconsistency for the institutions by prioritizing their liability concerns over theoretical coherence.

  ### Conclusion
  *   **Core Commitment:** The practices **strictly require** that slurs possess **intrinsic, conventional offensiveness** residing in the lexical string itself, making its display harmful.
  *   **Compatible With:** This is **compatible** with both **fixed derogatory content semantics** and **speaker-relative semantics**, as long as they acknowledge this conventional offensiveness.
  *   **Ruled Out:** **Pure pragmatic accounts** (offense solely from speaker intent/audience expectation) are **ruled out** by the quote/transcript masking.
  *   **Speaker Identity:** Primarily governs **norms of use/permissibility** (pragmatics/social rules), not necessarily the core semantic content.
  *   **Inconsistency:** The **subtitle/text-masking vs. unbleeped-audio practice is fundamentally incoherent** within the implicit theory. It simultaneously treats the string as intrinsically harmful (requiring text censorship) and as harm residing only in the original context (allowing unedited audio).
  *   **De Facto Patch:** Institutions rely on an **unstated, medium-specific risk assessment** (written text is more endorsing/actionable/permanent than audio reportage), prioritizing liability management over semantic or philosophical coherence. The minimal *coherent* patches (consistent masking or consistent verbatim reporting) are generally rejected.
