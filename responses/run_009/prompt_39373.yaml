  I should start by outlining the practices and what they might presuppose. The quote replacement suggests the word itself is harmful when written. Moderation policies imply speaker identity matters, which leans towards speaker-relative semantics. The subtitle case is tricky—masking text but playing audio implies that the offense isn't in the string itself but in the act of using it. But then, who is using it in subtitles? The captioner isn't endorsing it; they're reporting. So maybe it's about perceived endorsement or social meaning.

  For the pragmatic-only approach, could offense be based on intent and expectations? For example, in-group use might be acceptable because the intent isn't derogatory, and the audience expects it. But the subtitle issue challenges this. If the word is harmful only when spoken with intent, why censor the text? Unless the text is seen as a re-infliction. But that might not hold if the captioner is just transcribing.

  The user might be hinting at an inconsistency. The practices treat the written word as toxic regardless of context, but audio gets a pass. That suggests the medium matters, which isn't explained by semantics alone. Maybe the implicit theory is that writing is endorsement, while audio is reportage. But that's shaky. 

  The minimal patch? Perhaps distinguishing between active and passive presentation: text as endorsement, audio as non-agentive. But that's not entirely coherent. Alternatively, the practice might be driven by liability—written records are permanent, while audio is ephemeral. But that's more legal than semantic.

