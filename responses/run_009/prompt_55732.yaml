  Okay, the user is part of a reading group focused on early modern travel and ethnographic writing, currently studying Montaigne's "Of Cannibals." They're stuck on a specific paragraph and want a detailed analysis to resolve their confusion. Let me start by understanding their main questions.

  First, they're confused about Montaigne's statement that we have "no other level of truth and reason" than our local customs. They wonder if this is descriptive or a critique. Then, the fruit analogy where Montaigne flips the meaning of "wild" to argue that cultivated fruit (and by extension, civilized people) are the real deviations. The user questions if this implies cultivation is corruption and whether that contradicts the earlier relativism. Lastly, the closing sentences where Montaigne praises the cannibals' wars as noble while calling war a disease and accusing Europeans of greater barbarity. They see a tension between this judgment and the opening relativism.

  I need to unpack each part. Starting with the "level of truth and reason." Montaigne is describing how people actually judge—based on their own customs. But he's also critiquing this as a mistake. His exemption comes from his skepticism; he recognizes this tendency and consciously works against it by using comparative reflection. The key is that Montaigne doesn't claim absolute truth but uses relativism to expose European biases.

  Next, the fruit analogy. The initial point is that "wild" shouldn't be pejorative. But when he reverses it, calling cultivated fruit "wild," he's making a stronger statement: human intervention corrupts nature's purity. This does introduce a normative standard of nature, which seems to conflict with the earlier relativism. However, Montaigne's nature is a hypothetical, uncorrupted state, not a knowable absolute. He uses it as a rhetorical tool to challenge European arrogance, not as a metaphysical truth.

  The closing judgments need to be seen in light of his rhetorical strategy. By calling European wars more barbarous, he's applying their own standards against them. The cannibals' wars are "noble" within their context, but war itself is a universal flaw. This isn't inconsistent because Montaigne operates on two levels: descriptive relativism about customs and universal moral judgments about actions like cruelty and greed.

  The user’s deeper concern is about coherence. They might be worried that Montaigne is contradicting himself. But his position is coherent if we see his relativism as a tool for critique rather than a complete philosophy. He uses custom to undermine European superiority while appealing to minimal universal ethics like restraint in warfare. The tension between descriptive relativism and normative claims is intentional, forcing readers to question their assumptions.

  I should also address the user's need for a close reading without external references. They want the paragraph analyzed on its own terms. So focusing on internal consistency and rhetorical strategies within the text is key. Highlighting how each part serves to challenge ethnocentrism and how Montaigne navigates the tension between relativism and judgment through self-aware skepticism.
answer: |-
  This is a brilliantly knotty paragraph where Montaigne performs a complex critical maneuver, weaving together observation, critique, irony, and a subtle normative claim. Let's dissect it piece by piece:

  1.  **"No other level of truth and reason" - Descriptive Diagnosis & Ironic Self-Exemption:**
      *   **Description:** Montaigne is primarily *describing* a universal human tendency, not merely diagnosing a specific mistake. He observes that people universally ("every one") judge everything else ("barbarism") solely against the standard ("level") of their own local customs and opinions ("example and idea... of the place wherein we live"). This local standard becomes, de facto, their measure of "truth and reason." He's highlighting the inherent ethnocentrism in human judgment.
      *   **Diagnosis:** Implicitly, this *is* a mistake – a failure of perspective and reason. It leads to the arrogant assumption that one's own way is "perfect" – "the perfect religion... perfect government... most exact... usage."
      *   **Self-Exemption (How?):** This is where Montaigne's skepticism shines. He *exempts himself precisely by acknowledging the tendency*. His whole project in this essay (and the *Essays* generally) is an exercise in *suspending* this automatic judgment. He doesn't claim access to an absolute "level"; instead, he uses *comparison* and *self-reflection* to expose the limitations of his *own* local standard. By recognizing the bias ("there is nothing barbarous... excepting, that every one gives the title..."), he consciously steps outside its immediate grip *for the purpose of this examination*. His favorable judgment isn't based on *replacing* French customs with an absolute truth, but on recognizing the *relativity* of *all* customs and using that to critique the *arrogance* inherent in labeling others "barbarous." His "level" becomes the *recognition of relativity itself*, allowing a more impartial comparison. He judges the cannibals favorably *relative* to European practices, not absolutely.

  2.  **The Fruit Analogy & Its Reversal: Cultivation as Corruption?**
      *   **Initial Point:** Calling fruit "wild" simply means it grows without human intervention ("nature produces of herself"). Similarly, labeling people "savages" might just mean they live without European-style "civilization." It needn't be inherently negative.
      *   **The Reversal & Stronger Claim:** Montaigne *does* make the stronger, more provocative claim: "In truth, we ought rather to call those wild, whose natures we have changed by our artifice..." He argues that the *cultivated* fruit (and by analogy, "civilized" people) are the *true* deviants ("diverted from the common order"). Our "artifice" has "degenerated" them, corrupted their "genuine, most useful and natural virtues and properties" to suit our "corrupted palate."
      *   **The Normative Standard & Apparent Contradiction:** This *seems* to introduce a normative standard ("common order," "natural virtues") he just denied access to. How to resolve this?
          *   **Hypothetical Nature:** Montaigne's "nature" here is not a knowable absolute blueprint, but a *hypothetical state of being unaltered by European-style artifice*. He posits that *left alone*, things possess inherent vigor and virtue ("genuine," "useful," "natural").
          *   **Empirical Comparison:** His claim is based on *observation* of the effects of this "artifice." He sees European society as manifestly corrupt, greedy, cruel, and hypocritical (as detailed elsewhere in the essay and his work). Conversely, he observes (or interprets reports of) indigenous societies as possessing virtues Europeans lack: courage, fidelity, liberty, simplicity, moderation in warfare. The reversal is a *critical tool*: by calling the cultivated "wild," he shockingly inverts the usual hierarchy to expose the *degenerative* effects of so-called civilization *as he experiences it*. The normative force comes *retrospectively* from contrasting the perceived outcomes – the relative health and virtue of the "uncultivated" vs. the corruption of the "cultivated."
          *   **Rhetorical Strategy:** It's a deliberate, ironic provocation designed to unsettle European complacency. He's not claiming perfect knowledge of "Nature's intent," but arguing that *by the observable results*, the "natural" state (untainted by European artifice) appears superior in key virtues. The "common order" is the state *before* European corruption, not a cosmic absolute.

  3.  **The Closing Verdicts: Relativism vs. Judgment?**
      *   **"Barbaric in respect to the rules of reason":** This acknowledges the *perspective* of European reason. *By European standards* (their "rules of reason"), the cannibals' practices *might* seem barbaric (e.g., eating the dead). He concedes this relativistic point.
      *   **"But not in respect to ourselves, who in all sorts of barbarity exceed them":** Here, he shifts ground. He *compares* European and indigenous practices *on a scale he implies is more fundamental*. He judges European actions (torture, greed, treachery, religious persecution, colonial brutality – the "barbarity" he details implicitly and explicitly) as *worse* ("exceed them") than indigenous practices like ritual cannibalism or warfare motivated by honor.
      *   **"Their wars are throughout noble and generous...":** This judgment is *comparative and specific*. He contrasts the limited, honor-bound warfare he attributes to the Tupinambá with the limitless, greed-driven, treacherous warfare of Europeans. "Noble and generous" describes their *conduct* and *motives* ("jealousy of valour") relative to European conduct. He's not saying war is objectively noble; he's saying *their way of waging war* displays virtues lacking in the European way.
      *   **War as "human disease":** This is a crucial qualifier. Montaigne maintains a universalist, skeptical view of humanity. War itself is a fundamental flaw ("human disease"). His praise is *relative*: *within* this universal failing, the cannibals' version has "as much excuse and beauty as this human disease is capable of." It's the *lesser* barbarity, constrained by a code, compared to the *greater* barbarity of European warfare. The judgments aren't absolute endorsements but comparative assessments within the flawed context of humanity.

  **Coherence: The Central Position**

  Montaigne's position *is* coherent, though it operates on multiple levels and leverages tension:

  1.  **Descriptive Relativism:** He accurately describes the human tendency to judge everything by local custom.
  2.  **Critical Skepticism:** He uses this observation to *undermine* the absolute validity of *any* local custom (especially Europe's) as a standard of "truth and reason" or "barbarism." Recognizing this tendency is the first step towards critical distance.
  3.  **Comparative Humanism:** Freed from the absolute claims of his *own* culture, he compares societies based on observable *virtues* and *vices* (fidelity, courage, cruelty, greed, hypocrisy). He posits a minimal universal human standard: actions causing excessive suffering, driven by base motives like greed or fanaticism, are worse than actions motivated by honor or necessity within a different cultural framework, even if that framework includes practices Europeans find shocking.
  4.  **Normative "Nature" as Critical Construct:** His invocation of "nature" and the "common order" is not a claim to metaphysical knowledge but a *rhetorical and critical device*. It serves to:
      *   Invert the hierarchy ("civilized" = corrupted).
      *   Provide a hypothetical benchmark *against which* European corruption can be measured and found wanting.
      *   Ground his preference for the perceived virtues of the indigenous society (simplicity, vigor, natural reason) over the perceived vices of his own (artifice, degeneration, "corrupted palate").
  5.  **Distinguishing Judgment from Absolutism:** His favorable judgments of the cannibals are *comparative* ("not in respect to ourselves"), *specific* (their wars are more noble *than ours*), and *qualified* (war itself is a disease). He judges *actions* and *motives* (greed vs. valor, restraint vs. excess) more than the entire cultural package in absolute terms.

  **Where the Strain Shows (The Genuine Break):**

  The primary strain is between the *strong descriptive relativism* ("no other level of truth and reason" than local custom) and the *positive invocation of "nature"* as a standard. While he uses "nature" critically rather than metaphysically, the paragraph doesn't *fully* resolve how he accesses even this hypothetical standard if all judgment is so deeply conditioned. He relies on the *apparent evidence* of indigenous virtue and European vice to bridge this gap, trusting his comparative observations more than the abstract claim of radical cultural incommensurability. His skepticism allows him to doubt the absolute validity of *all* standards *except* the self-evident (to him) corruptions of his own society and the relative virtues he perceives in the other. The tension is productive but not entirely dissolved.

  **Conclusion:**

  Montaigne's paragraph is a masterful critique of ethnocentrism. He argues:

  1.  Calling others "barbarous" based solely on difference is arrogant and stems from our limited perspective.
  2.  "Savage" might simply mean "uncultivated by us," not inherently inferior.
  3.  Shockingly, *our* cultivation ("artifice") may have corrupted *us*, deviating us from a more "natural" and vigorous state (a critical construct, not an absolute).
  4.  Judged comparatively by the scale of human actions and motives, *we* ("civilized" Europeans) are often *more* barbarous, especially in warfare, than the so-called "savages."

  The "level of truth and reason" is our inescapable cultural bias, which he exposes and transcends through skeptical comparison. The fruit analogy reversal is a powerful rhetorical device to invert the hierarchy and expose European corruption. The closing judgments are comparative assessments of specific practices and motives within a universally flawed humanity, not a lapse into absolutism. The coherence lies in the consistent project: using relativism to dismantle European superiority, comparative observation to identify relative virtues and vices, and a minimal humanist ethic to condemn excessive cruelty and hypocrisy, regardless of its source. The unresolved tension around "nature" is the engine driving the critique.
