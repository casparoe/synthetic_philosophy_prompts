  After the scenario, I'll analyze both theories' verdicts. Lexical threshold NU would prohibit the festival if the pain crosses threshold, while symmetric utilitarianism would allow it due to net pleasure. Then I'll show how nudging the pain below threshold (say, to severe but manageable discomfort) makes both theories permit the festival. Finally, I'll explore defenses for lexical threshold NU - perhaps arguing for a higher threshold placement to avoid counterintuitive prohibitions on ordinary activities.

