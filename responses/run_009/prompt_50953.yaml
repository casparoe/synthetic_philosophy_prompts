answer: |-
  Your impasse isn't a failure of understanding but a collision of fundamentally distinct intellectual projects disguised as one debate. Laudan's "demise" was premature because he addressed only *one* project while the other—the institutional one—remains stubbornly vital. Here's a diagnosis:

  ### The Core Disagreement: Two Projects Under One Name
  Your hypothesis is correct but needs sharpening:
  1.  **The Descriptive/Explanatory Project (Your Friend's Focus):**
      *   **Goal:** Understand how scientific knowledge *actually* grows and differentiates itself from other epistemic practices *historically and sociologically*.
      *   **Conclusion (Laudan/Friend):** There is no timeless, universal methodological rule (falsifiability, progressiveness) that cleanly separates "science" from "non-science" *as practiced*. Science is heterogeneous, evolves, and shares features (immunization, speculation, periods of stagnation) with other fields. Demarcation as a *philosophical* search for necessary/sufficient conditions fails. Feyerabendian pluralism and sociological analyses better explain the messy reality.
      *   **Residue:** The retrospectivity of Lakatos is fatal *for this project*. You cannot *define* science in the moment by its future success. Judging a *practice* as scientific requires historical context, not a snapshot criterion.

  2.  **The Normative/Institutional Project (Your Focus & the Courtroom's):**
      *   **Goal:** Provide functional criteria for *decisions* made *now* about resource allocation, curriculum design, legal admissibility, and public trust. It's about *gatekeeping*, not ontology.
      *   **Demand:** Institutions (courts, schools, funding bodies) *structurally require* operational boundaries, however fuzzy. "Badly supported" (Laudan's escape) doesn't suffice because:
          *   Many non-scientific claims (historical narratives, legal arguments) can be well or badly supported *within their own domains*.
          *   The issue isn't *degree* of support but *kind* of practice and its *fit* within a specific institutional context (e.g., a *science* classroom).
          *   Institutions need a binary(ish) verdict *now*: "Does this belong *here*, under *this* label, *today*?"
      *   **Residue:** Popper/Lakatos failed to provide *philosophically robust* criteria, but the *need* for *functional* criteria persists. The courtroom shows the project is *alive*, not as pure philosophy, but as *applied socio-epistemology*.

  ### Where the Sequence Left the Residue
  The Popper-Lakatos-Laudan sequence exposed crucial tensions crucial to *both* projects:
  1.  **The Retrospectivity Problem:** Inherent in judging "progressiveness" or "degeneration." Fatal for *defining* science *as it happens*, but *less so* for *evaluating institutional fit*. An institution can ask: "Does this field/practice *currently employ methods* aimed at empirical testability, correction, and novel prediction *in a way comparable* to established sciences?" (This is prospective, though fallible).
  2.  **The Gap Between Theory & Practice:** Philosophers focused on abstract theories/methodologies. Real-world demarcation (courtroom, classroom) is about *practices, communities, and institutional contexts*. "Intelligent Design" wasn't rejected because its *theory* was unfalsifiable *in principle* (though it is), but because its *practitioners* rejected methodological naturalism, avoided rigorous peer review aimed at empirical critique, and failed to generate a progressive research tradition *in practice*.
  3.  **The Immunity/Ad Hoc Problem:** Popper was right to worry, Lakatos nuanced it, but Laudan/Friend are right that it happens in "good" science. The institutional filter must ask: *Is this immunity/ad hoc repair a temporary heuristic within an otherwise empirically engaged, self-correcting practice, or is it the core strategy insulating the core claim from empirical challenge?* The *pattern of practice* matters more than isolated immunizations.

  ### The Courtroom's Need: Does it Revive the Project?
  It shows the *problem* is alive, not that the *original philosophical project* (finding a universal logical criterion) is viable. The judge's job *can* be redescribed **without** needing a perfect philosophical category:
  *   **It's about methodological commitment:** Does the practice in question commit to methodological naturalism (as a practical rule, not metaphysical dogma)? Does it engage seriously with empirical evidence under that constraint?
  *   **It's about community norms & track record:** Does it participate in the institutional processes of science (peer review, replication attempts, open critique)? Does it have a track record of generating consilient, empirically fruitful research?
  *   **It's about institutional fit:** Does this body of knowledge/practice *functionally resemble* established sciences *in its core epistemic aims and methods* sufficiently to belong in *this specific context* (a biology class)?

  The category "science" *does* work here, but as a **cluster concept** (Wittgensteinian family resemblances) applied pragmatically to *practices* within an *institutional frame*, not as a timeless definition of a theory.

  ### What Counts as Progress?
  Forget a "new criterion" mimicking Popper or Lakatos. Progress lies in clarifying the disambiguation and developing tools for the institutional project:

  1.  **Formalize the Impossibility (for the Descriptive Project):** A rigorous demonstration (building on Duhem-Quine, underdetermination, theory-ladenness, sociological studies) that *no necessary and sufficient logical/methodological conditions* can demarcate "science" universally and timelessly in the way Popper imagined. This settles the *philosophical* quest decisively. (This leans towards Laudan/Friend but makes it harder).
  2.  **Develop a Robust Framework for Institutional Demarcation:**
      *   **Context-Specific Criteria:** Explicitly acknowledge that "science" for a curriculum, a grant panel, or a courtroom might involve different emphases (e.g., pedagogical appropriateness, feasibility, societal impact alongside epistemic rigor).
      *   **Procedural & Pragmatic Focus:** Emphasize the *procedures* (peer review, data sharing, methodological transparency, commitment to empirical testing *in principle*), *community norms*, and *functional outcomes* (generating reliable, empirically constrained, progressively integrated knowledge) over abstract logical features of theories.
      *   **Methodological Naturalism as a Practical Rule:** Defend its use *not* as a philosophical truth, but as a foundational *practical commitment* required for the specific epistemic project of the natural sciences (and thus for what belongs in a science classroom). It's a boundary condition for participation *in that game*.
      *   **Expertise & Deliberation:** Accept that demarcation in practice relies on expert judgment within the relevant scientific community (e.g., biologists judging ID, geologists judging young-Earth creationism) about what constitutes legitimate participation in *their* evolving practice. Philosophers can analyze the *reasoning* behind such judgments.
  3.  **Settle the Deflationary View (for Philosophy):** Philosophy of science should formally abandon the search for *the* demarcation criterion as historically conceived. Its role becomes:
      *   Analyzing the epistemic features of scientific practices (fallibilism, underdetermination, theory-ladenness, etc.).
      *   Critically examining the *use* of "science" as a label in societal contexts (rhetoric, authority, boundary-work).
      *   Informing the *development* of context-specific institutional criteria by clarifying concepts like evidence, confirmation, explanation, and naturalism.

  ### Is the Question Merely Hard or Ill-Posed?
  **It's both, depending on the project:**
  *   **For the Descriptive/Explanatory Project:** The question *as originally posed* ("Find the necessary and sufficient conditions for science") is **ill-posed**. It presupposes a clean, ahistorical, universal essence that doesn't exist. This project is better served by asking "How have different epistemic practices evolved and differentiated?" or "What features contribute to reliable empirical knowledge generation?"
  *   **For the Normative/Institutional Project:** The question ("How should we decide what counts as science *for purpose X*?") is **extremely hard** but **not ill-posed**. It demands nuanced, context-sensitive, practical reasoning drawing on philosophy, sociology, history, and ethics. It requires accepting fallible, contingent, and sometimes contested judgments.

  **Conclusion:** Your disagreement is substantive and stems from conflating two projects. Concede the *philosophical* point to your friend: Popper and Lakatos *were* chasing a chimera regarding a universal logical criterion. But don't concede the *institutional* point. The residue is the gap between judging abstract theories/methods and judging situated practices within institutional contexts. Progress means abandoning the doomed philosophical quest while seriously engaging with the messy, necessary practice of institutional gatekeeping using refined, pragmatic, context-aware tools. The "demise" was only of the philosopher's dream, not the societal need.
