prompt: |-
  I've been reading the rationalist blogosphere since the Overcoming Bias days — LessWrong, Slate Star Codex, the EA Forum — and over the years I've noticed something I'd like your help thinking through properly. The effective altruism world runs on metrics: DALYs averted, GiveWell's moral weights for deaths averted versus consumption gains, self-reported life satisfaction, measured household consumption. Each of these quietly takes a side in the old "equality of what?" debate that Amartya Sen opened in his 1979 Tanner Lecture — welfare, resources, or capabilities — and in the follow-on exchange among Dworkin, Cohen, and Arneson over the proper currency of egalitarian justice. A QALY weights life-years by health-related quality of life, which is a welfare metric confined to health; measured consumption is a resource proxy; a "years of good life" measure would be capabilities-flavored. Yet the philosophers almost never ask what happens to their favored currency when it must be cardinal, interpersonally comparable, and computable from messy survey data, and the EA measurement people almost never ask which currency their machinery implicitly commits them to. My thesis is that the genuinely interesting open questions live at that joint, and I'm planning a long-form piece — a blog sequence, possibly expanding into something bigger — making the case. I have roughly a year of evenings to spend on it.

  What I want from you is not a survey of the debate but a defended agenda. Which unresolved questions in this area actually matter most for that project, and in what order should I tackle them? For each item you place, I'd like the reasoning that drove the placement: whether it's upstream of the others (for instance, whether interpersonal comparisons of welfare are coherent at all seems to gate nearly every operationalization question downstream), whether it's tractable for a non-academic with a statistics background rather than for a professional philosopher, and what evidence or argument over the next couple of years would move it up or down the list. I'd also like you to be candid about which famous parts of this debate are overrated for my purposes. My working suspicion is that the luck-egalitarian fight over whether chosen disadvantages should count — absorbing as it is — changes very little once you're trying to score a deworming program against a cash transfer; tell me whether that's right, and if not, where the responsibility-sensitivity question actually bites in a metric. Finally, be explicit about anything I haven't mentioned that belongs above some of what I have: adaptive preferences and what they do to survey-based welfare measures, the currency question for people who cannot report preferences (young children, severe cognitive disability), and whether any capabilities measure can be made cardinal without quietly collapsing back into resources or welfare.

  One constraint on your answer: do not respond with a bibliography or reading list. Give me the ranking argued from the ideas themselves, as you understand them.
reasoning: |-
  Okay, the user is deeply embedded in the rationalist and EA communities, having followed them since Overcoming Bias days. They're planning a long-form piece on the intersection between philosophical debates about egalitarian justice (welfare, resources, capabilities) and EA's operational metrics. They want me to identify the most critical unresolved questions at this junction and prioritize them for their project.

  Hmm, their core tension is fascinating: philosophers ignore operational constraints while metric designers ignore philosophical commitments. The user suspects many famous philosophical debates (like luck egalitarianism) become irrelevant in practical metrics - which feels true but needs verification. They also hint at three underdiscussed elephants: adaptive preferences, non-verbal populations, and capabilities' measurement collapse risk.

  Right, constraint is key: no bibliographies, just argued priorities. They want an agenda defended by logical dependencies, tractability for a stats-savvy non-philosopher, and sensitivity to new evidence. Also candidly flag overrated debates. 

  First, I should map the dependency tree. The root seems to be *interpersonal comparability* - if that fails, most metrics crumble. Then *cardinality*, since ordinal measures can't quantify tradeoffs like DALYs vs. consumption. Both gate downstream questions. 

  For overrated elements: luck egalitarianism does seem less urgent here. Deciding whether to "penalize" chosen disadvantages in metrics feels impractical when measuring deworming vs. cash transfers. The real bite might be in responsibility-sensitive designs like adjusting weights for lifestyle diseases - but that's niche in global health. 

  Biggest omissions they noted: 
  - Adaptive preferences could poison welfare metrics (e.g., women in patriarchy reporting high life satisfaction) 
  - Non-verbal populations break preference-based measures 
  - Capabilities risk collapsing into resources/welfare when cardinalized (e.g., "years of good life" becoming just survival + income) 

  Now prioritizing: 
  1. **Interpersonal comparability** must come first - no point discussing metrics if we can't compare Person A's welfare gain to Person B's. Tractability: high for a stats person; evidence from psychometrics (e.g., predictive validity of cross-person happiness scales) could move the needle. 
  2. **Cardinality** next. Welfare economists pretend ordinal utility is sufficient, but EA needs ratios (e.g., 1 DALY = X% consumption increase). Evidence: behavioral economics on intensity measures (e.g., "how much worse is blindness than asthma?"). 
  3. **Capabilities operationalization** - crucial because it avoids welfare/resource pitfalls but is underdeveloped. Risk of collapse into welfare/resources when made cardinal (e.g., Nussbaum's list becomes a scored index). Tractability: middle; requires conceptual work. 

  Then adaptive preferences (undermines subjective welfare metrics) and non-verbal populations (exposes limits of preference-based approaches). Both affect real-world measurement but aren't foundational. 

  Finally, responsibility-sensitivity: low priority unless targeting programs where behavior affects outcomes (e.g., anti-smoking campaigns). But in GiveWell-style interventions? Minimal. 

  Structure for the project: start by exposing how EA metrics smuggle in philosophical commitments, then systematically dismantle operational assumptions (comparability, cardinality), before tackling capabilities' promise and perils. Save adaptive preferences/non-verbal for later sections as case studies. 

  ...Did I cover everything? User's thesis about the "joint" being where action is feels spot-on. Their stats background is perfect for pressuring-testing philosophical coherence with data constraints. Biggest gap might be political philosophy - e.g., can capabilities avoid paternalism? But that's beyond their scope. 

  Solid.
answer: |-
  Here’s a defended agenda for your project, prioritizing unresolved questions at the philosophy/metrics intersection based on logical dependencies, tractability, and real-world impact for EA. The ranking reflects which issues **gate** downstream work, which are **actionable** given your background, and which have **high stakes** for real interventions.

  ### **Tier 1: Foundational (Must Tackle First)**
  1. **Is cardinal, interpersonally comparable welfare even coherent?**  
     - **Why first?** This gates everything. If welfare comparisons are meaningless (e.g., due to the epistemic gap between individuals), EA’s welfare-centric metrics (DALYs, well-being surveys) collapse into fiction.  
     - **Tractability:** High for you. Debate hinges on statistical evidence (e.g., cross-cultural consistency in well-being surveys), neuroscience (neural correlates of utility), and behavioral economics (preference reversals under framing).  
     - **Evidence that moves it:** If large-n studies show interventions consistently *rank* beneficiaries’ welfare gains the same across cultures, but cardinal *magnitudes* diverge wildly, comparability fails.  
     - **Overrated sidestep:** Philosophical "solutions" like hypothetical preferences (Harsanyi) ignore measurement noise. Focus on empirical coherence.

  2. **Can capabilities be measured cardinally without collapsing into resources or welfare?**  
     - **Why now?** Capabilities (e.g., "years of good life") are EA’s best escape from welfare/resource tradeoffs—but if operationalization requires weighting health/autonomy/education via prices (resources) or life satisfaction (welfare), it’s not distinct.  
     - **Tractability:** Moderate. Requires analyzing existing "capability indices" (e.g., WHO’s metric for disability weights) for implicit welfare/resource assumptions. Your stats skills can pressure-test dimensionality reduction in survey data.  
     - **Evidence that moves it:** If factor analysis shows capability indicators (e.g., "mobility," "social support") load onto a single latent variable correlating with income or happiness, collapse is likely.  
     - **Stakes:** High. Determines if capabilities are a viable third way or a dead end.

  ---

  ### **Tier 2: Operational (High Impact for EA Practice)**
  3. **How do adaptive preferences corrupt survey-based welfare metrics?**  
     - **Why here?** Directly undermines welfare-focused tools (e.g., self-reported life satisfaction). Poor populations reporting high happiness despite deprivation could misdirect aid.  
     - **Tractability:** High. Test via longitudinal data: if rising consumption/health *lowers* reported satisfaction initially (as aspirations adjust), metrics are unreliable. Natural experiments (e.g., sudden wealth shocks) are key.  
     - **Evidence that moves it:** If interventions show gains in objective metrics (e.g., child survival) but no change—or declines—in subjective well-being, EA must discount welfare metrics.  
     - **Philosophical link:** Exposes the limits of preference-satisfaction as a moral arbiter.

  4. **What metric handles non-preference-holders (infants, cognitively impaired)?**  
     - **Why now?** Welfare metrics fail here (no preferences to satisfy), resource metrics ignore differential needs, capabilities often rely on proxies. Gates EA work in neonatal care, disability support.  
     - **Tractability:** Moderate. Requires dissecting how GiveWell/EA orgs *currently* value these groups (e.g., imputing preferences from caregivers? Using species-typical functioning?).  
     - **Evidence that moves it:** If beneficiary groups without voice (e.g., severe autism) receive less funding per "objective need" than groups that self-report, metrics are flawed.  
     - **Stakes:** Moral credibility of EA. Can’t claim impartiality if metrics exclude the most vulnerable.

  ---

  ### **Tier 3: Contextual (Relevant but Lower Priority)**
  5. **Does responsibility-sensitivity ("luck egalitarianism") matter for real metrics?**  
     - **Your suspicion is mostly right.** When comparing deworming vs. cash transfers, *choice* is irrelevant—beneficiaries (e.g., children) aren’t responsible for their poverty.  
     - **Where it bites:** Only in metrics for interventions where behavior affects outcomes (e.g., anti-smoking programs vs. lung cancer care). Even then, EA avoids "blaming victims."  
     - **Placement:** Low unless your project tackles "lifestyle disease" interventions. Evidence needed: Do health DALYs for smokers get discounted? (Spoiler: Rarely.)

  6. **Do resource metrics (e.g., consumption) proxy welfare/capabilities uniformly?**  
     - **Why last?** Less urgent—EA already knows $1 ≠ 1 util everywhere. But worth showing *where* it fails catastrophically (e.g., disability-adjusted consumption).  
     - **Tractability:** High. Regression analysis on how consumption gains correlate with welfare/capability gains across contexts (e.g., post-conflict vs. stable economies).  
     - **Evidence that moves it:** If elasticity of welfare w.r.t. consumption is near-zero in some groups (e.g., severe chronic pain), cash transfers may be inefficient.

  ---

  ### **Overrated Elements to Sideline**
  - **Luck egalitarianism debates (Dworkin/Cohen/Arneson):** Intellectually rich but irrelevant to 95% of EA’s work. Most interventions target unchosen disadvantage.
  - **"Equality of what?" taxonomy for its own sake:** Don’t rehash Sen. Focus on how metrics *force* hybridizations (e.g., DALYs = health resources × welfare weights).
  - **Ideal theory vs. feasibility:** EA is already in the trenches. Prioritize "how to measure now" over "what justice demands ideally."

  ### **Missing Critical Question:**
  **Can any metric be *robust* under value pluralism?**  
  EA often implicitly assumes a utilitarian framework. But if different cultures/individuals weight death vs. suffering vs. autonomy differently (e.g., a DALY in rural India vs. Sweden), a single metric may be oppressive. This needs embedding throughout—especially in Tier 1-2 issues.

  ---

  ### **Recommended Project Flow**
  1. **Expose the hidden commitments:** Start by reverse-engineering EA’s metrics to reveal their philosophical baggage (e.g., QALYs assume health is separable from overall welfare).  
  2. **Break foundations:** Attack interpersonal comparability and capability collapse—if these fail, EA’s edifice crumbles.  
  3. **Pressure-test with hard cases:** Adaptive preferences and non-preference-holders force a reckoning with real-world data.  
  4. **Explore repairs:** If foundations crack, propose alternatives (e.g., capabilities with explicit context-weights) or humility (e.g., "best we can do" metrics).  

  This sequence mirrors EA’s workflow: define a metric, apply it, discover flaws, iterate. Your stats background is ideal for steps 2–3, where philosophers fear to tread. Focus on **what the data can’t resolve**—that’s where philosophy bites back.
