  Then there's the regress argument. When a relation relates qualities, what connects the relation to the qualities? If another relation is needed, it leads to infinite regress. The user mentioned that some see this regress as benign, but Bradley would argue it's vicious because each step fails to explain the connection, leaving the initial relation unexplained. The user also brought up facts like "Socrates is wise." If instantiation is a relation, it triggers the same regress, making facts unintelligible.

