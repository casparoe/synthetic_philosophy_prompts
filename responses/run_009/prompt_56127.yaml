answer: |-
  Here's the zombie conceivability argument against physicalism, rigorously restated in Kripke-semantic vocabulary, followed by a residue report identifying where your formalism captures the argument cleanly, where it distorts it, and where it fails entirely. I'll then explicitly diagnose the residue and pick a side as requested.

  ### The Argument in Kripke-Semantic Terms
  1. **Premise 1 (Conceivability → Satisfiability):**  
     "A physically identical zombie world is ideally conceivable" translates to:  
     There exists a model \(\mathcal{M}_z = \langle W_z, R_z, D_z, I_z \rangle\) such that:  
     - \(\mathcal{M}_z\) satisfies all physical truths \(\Phi_P\) of the actual world model \(\mathcal{M}_@\) (i.e., \(\mathcal{M}_z \vDash \Phi_P\)).  
     - \(\mathcal{M}_z\) satisfies \(\neg \exists x (P(x))\), where \(P\) is a rigid designator for the phenomenal property "being in pain" (i.e., no entity in \(D_z\) instantiates pain in any world \(w \in W_z\)).  
     - This model \(\mathcal{M}_z\) exists under an **ideal conceivability accessibility relation** \(R_c\) (defined below).  

  2. **Premise 2 (Ideal Conceivability → Metaphysical Possibility):**  
     "What is ideally conceivable is metaphysically possible" translates to:  
     If \(\mathcal{M}_z\) is satisfiable under \(R_c\), then it is satisfiable under the **metaphysical accessibility relation** \(R_m\) (i.e., \(\mathcal{M}_z\) exists in the set of metaphysically possible models).  

  3. **Physicalism's Commitment (Necessitation Thesis):**  
     "Physicalism requires that physical truths necessitate phenomenal truths" translates to:  
     Physicalism is true only if, in all models \(\mathcal{M}\) metaphysically accessible from \(\mathcal{M}_@\) (i.e., \(\mathcal{M}_@ R_m \mathcal{M}\)) where \(\mathcal{M} \vDash \Phi_P\), we also have \(\mathcal{M} \vDash \exists x (P(x))\).  

  4. **Conclusion (Physicalism is False):**  
     By (1) and (2), \(\mathcal{M}_z\) is metaphysically possible: \(\mathcal{M}_@ R_m \mathcal{M}_z\), \(\mathcal{M}_z \vDash \Phi_P\), and \(\mathcal{M}_z \vDash \neg \exists x (P(x))\).  
     By (3), this contradicts physicalism's necessitation claim.  
     ∴ Physicalism is false.  

  **Key translations:**  
  - **"Physically identical zombie world"**: A model \(\mathcal{M}_z\) satisfying \(\Phi_P \cup \{\neg \exists x P(x)\}\).  
  - **"Pain"**: Treated as a rigid designator \(P\) (constant across all worlds where it exists).  
  - **"Ideal conceivability"**: Satisfiability under an accessibility relation \(R_c\) that indexes models to **maximally rational a priori reasoning** (i.e., models where all a priori consequences of \(\Phi_P\) are satisfied, and no contradictions are derivable under an idealized proof system \(\Pi_\text{ideal}\)).  
  - **"Conceivable"**: Satisfiability in some model under \(R_c\).  

  ---

  ### Residue Report  
  **Cleanly Translated Components (No Distortion):**  
  1. **Physicalism's Necessitation Thesis**: This is purely model-theoretic: Physicalism requires \(\Phi_P \vDash_{R_m} \exists x P(x)\) (i.e., \(\exists x P(x)\) is true in all \(R_m\)-accessible models satisfying \(\Phi_P\)).  
  2. **Zombie World Definition**: \(\mathcal{M}_z \vDash \Phi_P \cup \{\neg \exists x P(x)\}\) is unambiguous.  
  3. **Rigid Designation of Pain**: \(P\) is rigid by stipulation (per Kripke).  
  4. **Contradiction with Physicalism**: If \(\mathcal{M}_z\) exists under \(R_m\), physicalism is false. This is a straightforward validity claim.  

  **Distorted Translations (Forced or Inexact):**  
  1. **"Ideal Conceivability" as \(R_c\)**:  
     - **Distortion**: We must define \(R_c\) as an accessibility relation over models constrained by **a priori derivability in \(\Pi_\text{ideal}\)**. But \(\Pi_\text{ideal}\) is underspecified:  
       - Is it a complete axiomatization of a priori truths?  
       - Does it include all mathematical truths?  
       - What is its proof-theoretic strength?  
     - **Result**: "Ideal conceivability" becomes *satisfiability relative to an unspecified proof system*, not purely model-theoretic. This smuggles in **epistemic assumptions** about rational idealization.  

  2. **"Conceivability" as Satisfiability**:  
     - **Distortion**: The premise "I can coherently conceive of a zombie world" is translated as \(\mathcal{M}_z\) *exists* under \(R_c\). But "conceivability" in the argument is **primarily epistemic** (about what agents can *grasp*), while satisfiability is **ontological** (model existence).  
     - **Critical Gap**: Satisfiability assumes a fixed domain of models, but conceivability is agent-relative. We must assume agents have **perfect access to \(R_c\)-accessible models**—a non-trivial claim.  

  **No Expression in Your Vocabulary (The Residue):**  
  1. **Epistemic Possibility vs. Model Existence**:  
     - Conceivability asserts that *no contradiction can be discerned* by an ideal reasoner, not just that a model exists. Your vocabulary lacks tools for **agent-relative consistency judgments**.  
     - **Example**: "Satisfiability under \(R_c\)" assumes \(\Pi_\text{ideal}\) captures "rational coherence," but Chalmers' "ideal conceivability" includes **primitive epistemic constraints** (e.g., "no a priori incoherence") that lack model-theoretic analogues.  

  2. **The "Genuine Possibility" Ambition**:  
     - The argument relies on conceivability *feeling like a guide to metaphysical possibility*. Model theory has no counterpart for **why satisfiability under \(R_c\) should imply anything about \(R_m\)**. This link requires a philosophical bridge your formalism doesn't provide.  

  ---

  ### Where the Residue Lives: Picking a Side  
  **Option One is Correct: The residue is a missing epistemic notion of possibility.**  

  - **Why**: The argument's force hinges on the **epistemic appearance of possibility** ("I can't see a contradiction, so it *must* be metaphysically possible"). Your model-theoretic framework reduces this to bare satisfiability (\(\mathcal{M}_z\) exists), but that drops the agent's *recognition* of consistency.  
  - **The Smuggled Assumption**: To translate "conceivability" as satisfiability, I implicitly assumed that **ideal rational coherence is isomorphic to model existence**. But this is substantive: it assumes that if no contradiction is derivable in \(\Pi_\text{ideal}\), a model *must* exist (i.e., \(\Pi_\text{ideal}\) is sound/complete for the space of metaphysically possible models). Philosophy of mind debates this.  
  - **Consequence**: The residue explains why the argument *feels* compelling—it leverages our epistemic confidence—but also why it's contestable. Physicalists (e.g., Churchland) reject that conceivability tracks metaphysical possibility precisely because epistemic and model-theoretic "possibility" come apart.  

  **Why Not Option Two?**  
  While the argument *uses* "conceivability" ambiguously, the ambiguity isn't between model existence and "genuine possibility"—it's between **epistemic accessibility** (\(R_c\)) and **metaphysical accessibility** (\(R_m\)). The core residue is that \(R_c\) and \(R_m\) are distinct relations, and no model-theoretic principle justifies linking them.  

  ### Conclusion for Your Teaching  
  The zombie argument *is* applied modal logic—but only if modal logic is stretched to include **unformalized epistemic relations**. In your vocabulary:  
  - The necessity of identity (Hesperus/Phosphorus) is **purely model-theoretic** (rigid designation + transworld identity).  
  - The zombie argument is **not**, due to its reliance on an unreduced notion of *conceivability*. The residue is the ghost of epistemology haunting your possible worlds.  

  If you formalize it, emphasize that "\(\mathcal{M}_z\) satisfies \(\Phi_P \cup \{\neg \exists x P(x)\}\) under \(R_c\)" is where philosophy invades—and where physicalists will attack.
