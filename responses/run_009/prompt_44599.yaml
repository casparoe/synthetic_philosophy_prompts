prompt: |-
  Ok so I need help writing a final exam question, and I'm asking you specifically because I just spent three hours arguing about this with my friend Dev and I want the exam to basically recreate that argument for my students.

  Some context: I co-teach a grad seminar on social choice and welfare theory, the students are mostly second-year PhD students in an econ/philosophy track, and I'm responsible for the unit on Harsanyi's utilitarianism theorem(s) for the final. Dev is one of those people who thinks the 1955 paper just ended the debate — rational agents, equiprobable veil of ignorance, everyone maximizes expected utility, boom, utilitarianism falls out, Rawls should've conceded and gone home. My position in the argument (which we did NOT resolve, it ended with Dev sending me voice memos at 1am) was that Dev is running together two genuinely different results — the impartial-observer/equiprobability argument and the Pareto-plus-aggregation argument — and that they don't even deliver the same utilitarianism when you change the population, which is a nasty little fact I only half-remembered mid-argument. I also kept pushing the Diamond fairness example on him: if you give the only available benefit to person A for sure, versus flipping a fair coin between A and B, expected utility behind the veil treats those the same, and that seems like a straight-up bug, not a feature. Dev's whole comeback was that anyone who rejects an expected-utility axiom is ipso facto irrational, end of story, which is exactly the move I want the exam to catch.

  So here's the ask: write one 90-minute essay question on whether Harsanyi proved utilitarianism, that cannot be answered by reciting the theorem statements or by the lazy gotcha that the theorem just "assumes utilitarianism" (there's a real version of that objection and a lazy version, and the question should be buildable so the lazy version visibly fails). Then a model answer of around 650 words, and a marking scheme out of 20 marks that seperates an A from a B by naming the specific moves each one contains — e.g. an A answer states Diamond's example *and* says what it's actually supposed to show about which axiom, a B answer states it and thinks it's just a counterexample to utilitarianism's conclusions. Five must-hit points with the marks each is worth, and a one-line note per point on how students typically fumble it. One of the five points should be about what the theorems presuppose rather than derive, and one should be the average-vs-total thing I mentioned, since nobody in my class picked up on it when I mentioned it offhand and I want to know if they can reconstruct it under exam conditions.
