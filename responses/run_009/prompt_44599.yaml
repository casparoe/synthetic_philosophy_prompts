answer: |-
  Here’s a comprehensive exam question, model answer, and marking scheme designed to recreate your debate with Dev and probe the nuances of Harsanyi’s theorems.

  ---

  ### **Final Exam Question (90 minutes)**
  > "Harsanyi’s theorems are often claimed to provide a decisive defense of utilitarianism. Critically evaluate whether Harsanyi *proved* utilitarianism in a normatively compelling sense. Your answer must:  
  > (a) Distinguish the logical structures and normative assumptions of his 1955 ‘impartial observer’ (equiprobability) theorem and his 1953/1977 ‘aggregation’ theorem;  
  > (b) Address whether rational agents *must* accept the theorems’ axioms (e.g., expected utility, Pareto);  
  > (c) Explain how Diamond’s kidney transplant example challenges Harsanyi’s framework;  
  > (d) Discuss what each theorem *presupposes* about utility (e.g., cardinality, interpersonal comparability);  
  > (e) Analyze whether the theorems coherently support utilitarianism under population changes.  
  >   
  > *Avoid merely restating theorem proofs or claiming circularity without engaging axioms’ normative plausibility.*"

  ---

  ### **Model Answer (650 words)**  
  Harsanyi’s two theorems—the 1955 impartial observer (IO) theorem and the 1953/1977 aggregation theorem—are distinct arguments for utilitarianism, but neither "proves" it in an unproblematic sense. Both require contestable axioms that embed utilitarian premises rather than deriving them neutrally.

  **1. Two Theorems, Two Utilitarianisms**  
  The aggregation theorem assumes individual cardinal utilities, Pareto indifference, and Pareto strict preference. It concludes that social welfare must be a *weighted sum* of utilities. Only by adding an *egalitarian* assumption (e.g., anonymity) does this yield classical utilitarianism. The IO theorem, however, assumes an impartial observer behind a veil of ignorance who maximizes *expected* utility under equiprobability. This directly implies average utilitarianism. Crucially, these are different objects: the aggregation theorem delivers *total* utilitarianism under population changes, while the IO theorem’s expected utility maximization implies *average* utilitarianism—a conflict Harsanyi never resolved (Adler, 2012).

  **2. Axioms as Rationality? The Diamond Challenge**  
  Dev’s claim that rejecting expected utility (EU) axioms is "irrational" falters against Diamond’s (1967) kidney example. Suppose we must allocate a transplant to Ann (policy X) or use a fair lottery between Ann and Bob (policy Y). EU axioms force the impartial observer to be indifferent between X and Y, as both yield identical expected utility. Yet intuitively, Y seems fairer—it gives Bob a chance. Diamond shows that EU axioms conflict with ex post fairness, which many deem rational (e.g., giving each person an "equal claim"). Rejecting the independence axiom here isn’t irrational; it reflects a commitment to procedural equity Harsanyi’s framework ignores. Thus, the IO theorem’s axioms encode substantive moral assumptions, not neutral rationality.

  **3. Presuppositions, Not Derivations**  
  Both theorems *presuppose* cardinal, interpersonally comparable utilities. The aggregation theorem assumes utilities are von Neumann-Morgenstern (vNM) and comparable across persons to define Pareto improvements. The IO theorem assumes the observer can compare utility gains *between* individuals to maximize expected utility. Harsanyi did not derive comparability; he assumed it. Utilitarianism is thus built into the input space, not proven from thinner premises (Mongin, 2001).

  **4. Population Paradoxes**  
  The aggregation theorem’s weighted sum becomes total utilitarianism under replication invariance: adding people with neutral utility increases social welfare. But the IO theorem’s average utilitarianism *condemns* such additions (e.g., Parfit’s "mere addition paradox"). This divergence reveals that "Harsanyi’s utilitarianism" is not a single doctrine. When populations vary, the theorems prescribe opposite policies—undermining Dev’s claim of a unified proof.

  **Conclusion**  
  Harsanyi’s theorems are elegant derivations *conditional* on utilitarian-friendly axioms. However, they do not "prove" utilitarianism because: (i) the axioms embed moral choices (e.g., EU over fairness), (ii) utility comparability is assumed, not derived, and (iii) the theorems disagree on core utilitarian prescriptions under population changes. Rawls’ rejection was not a concession but a recognition that rational agents can reasonably prioritize fairness over Pareto or EU axioms.

  ---

  ### **Marking Scheme (20 marks total)**  
  **A (17–20)**: Distinguishes theorems, names specific axioms, diagnoses presuppositions, and ties objections to normative conflicts (not just "counterexamples").  
  **B (13–16)**: Correctly describes theorems and objections but conflates assumptions or misattributes targets (e.g., thinks Diamond targets utilitarianism *conclusions* not EU axioms).  

  #### **Five Must-Hit Points**  
  1. **Distinction between aggregation (total util) and IO (average util) theorems** (4 marks)  
     - *A*: Notes conflict under population changes. *B*: States difference but misses population implication.  
     - *Fumble*: Claiming both theorems yield "the same" utilitarianism.  

  2. **Diamond’s example as challenge to EU axioms (not util per se)** (4 marks)  
     - *A*: Explains it targets independence axiom’s exclusion of fairness. *B*: Presents it as counterexample to utilitarianism.  
     - *Fumble*: "Diamond shows utilitarianism is unfair."  

  3. **Axioms as normative presuppositions** (4 marks)  
     - *A*: Identifies cardinal/comparable utility as assumed, not derived. *B*: Notes assumption but doesn’t contrast with derivation.  
     - *Fumble*: "Harsanyi assumes utilitarianism" without specifying *how* (e.g., via vNM or Pareto).  

  4. **Rationality defense critically assessed** (4 marks)  
     - *A*: Contrasts EU-as-rationality with fairness-as-rational alternative. *B*: States Dev’s view but doesn’t rebut.  
     - *Fumble*: "Rejecting axioms is irrational."  

  5. **Population problem: total (aggregation) vs. average (IO) conflict** (4 marks)  
     - *A*: Uses replication invariance to show theorems diverge. *B*: Mentions but doesn’t analyze the conflict.  
     - *Fumble*: "Both support total util."  

  ---

  ### **Why This Works**  
  - **Blocks lazy objections**: By requiring engagement with axioms (e.g., "Explain how Diamond challenges EU"), it forces students beyond "Harsanyi assumes utilitarianism."  
  - **Targets Dev’s stance**: The model answer refutes "EU axioms = rationality" using Diamond and exposes conflation of the two theorems.  
  - **Tests subtlety**: Population ethics is underdiscussed but decisive—A students must spot how aggregation vs. IO theorems fracture "Harsanyi’s utilitarianism."  
  - **Philosophy/econ balance**: Integrates Diamond (philosophy) with technical distinctions (econ), fitting your dual-track cohort.  

  This setup ensures students who parrot Dev ("just maximize EU!") or vague objections ("but fairness!") score a B at best. The A requires them to *weaponize* the distinctions you debated.
