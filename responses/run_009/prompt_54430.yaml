prompt: |-
  I'm defending my thesis at a normative ethics workshop next month and need a Q&A prep sheet. My claim: the separateness of persons objection to utilitarianism only works if the boundaries between persons are metaphysically deep, but the people who press the objection hardest (Rawls via Parfit, basically) have also absorbed Parfit's reductionism about personal identity, and once identity across time is itself just psychological continuity and matters of degree, it's hard to see why aggregation across persons is any worse than the aggregation across times within one life that everybody already allows. The audience is mostly Rawlsian and contractualist political philosophers who think treating persons as mere containers of utility is the whole point of the objection, plus two Parfit scholars who know Reasons and Persons backwards, and one economist who will want to know what any of this does to social choice theory. Give me the seven or eight objections I'll actually get from these people, ordered by how much damage they'd do, each phrased the way they'd phrase it, with a two-minute reply and a note on where the reply is soft -- and include the one question I'm hoping nobody asks. Lead with your bottom line in the first sentence, then the reasoning, no preamble or restating my thesis back at me. British English please, and note: definately flag any point where I'm just assuming Parfit got personal identity right.
reasoning: |-
  Okay, the user is prepping for a thesis defense in normative ethics, specifically tackling the separateness of persons objection to utilitarianism. Their argument hinges on Parfit's reductionism undermining the metaphysical basis for opposing interpersonal aggregation. The audience includes Rawlsians, contractualists, Parfit scholars, and an economist—so objections will vary.

  First, the core vulnerability: the user assumes Parfit's view on personal identity is correct without defending it. That's a major weak spot, especially with Parfit experts present. The hardest question would be if someone challenges this assumption head-on, forcing them to justify reductionism itself rather than its implications.

  Rawlsians will likely argue that contractualism doesn't need deep metaphysics—it's about respect for agency, not ontology. The reply must concede that Rawls avoids metaphysics but stress that Parfit-inspired critics (like Nagel) explicitly tie the objection to metaphysical claims. Still, this might feel like dodging the agency point.

  The economist will care about social choice implications. Arrow’s theorem already blocks interpersonal comparisons, so if the user's argument permits aggregation, it might imply utilitarianism is viable. But Arrow’s formal framework doesn’t engage with metaphysics—this could be a mismatch the user hasn’t addressed.

  Parfit scholars might note that Parfit himself rejected utilitarianism despite reductionism, emphasizing distributive constraints. The user must argue Parfit was inconsistent here, but that’s risky with experts who know his work intimately.

  Other angles: the "mere containers" concern (but utilitarians don’t actually reduce people to containers), special obligations (reply: reductionism might weaken those too), and whether degrees of identity change anything (probably not—discrete persons remain pragmatically salient).

  Biggest fear: "Why accept Parfit’s view?" If asked, the user has no good defense mid-defense. Best to prep a fallback about the objection’s internal inconsistency if proponents hold both reductionism and anti-aggregation.

  Overall, the strategy should be:
  - Preempt the metaphysics assumption by flagging it early.
  - For Rawlsians, pivot from ontology to Parfit-influenced critics.
  - For the economist, admit social choice needs separate treatment.
  - With Parfit scholars, boldly call out Parfit’s inconsistency.
  - Hope no one forces a foundational debate on personal identity.
answer: |-
  **Bottom line:** Your strongest vulnerability is assuming Parfit's reductionism is correct without argument, while your most damaging objections will challenge whether metaphysical "depth" is even relevant to the separateness objection or if you've misread Rawls/Parfit.  

  **Objections Ordered by Damage Potential (Highest First):**  

  1. **"You’re presupposing Parfit’s reductionist account of personal identity is *true*, but isn’t that the very thing at issue? Why should we accept it, especially when critics like Korsgaard or Williams reject it on normative grounds?"**  
     - **Reply:** "I grant I’m not defending reductionism itself here—my claim is conditional: *if* one accepts Parfit’s view (as many objectors do), the separateness objection loses force. For those who don’t, the objection may stand, but my target is its internal inconsistency in Parfit-influenced critics."  
     - **Soft spot:** Doesn’t engage with non-reductionist defences of separateness; concedes the objection might hold elsewhere. **FLAGGED: You assume Parfit is right.**  

  2. **"Rawls’ objection isn’t metaphysical—it’s about *moral personality* and the basic structure respecting citizens as free, equal agents. Parfit’s psychology doesn’t touch that. Why conflate ontology with normative agency?"**  
     - **Reply:** "Rawls avoids metaphysics, true—but his followers (like Nagel) explicitly root separateness in the ‘distinctness of persons’ as a metaphysical fact. If that foundation is eroded by Parfit, their version of the objection crumbles. Rawls’ agency-based view is different but wasn’t my target."  
     - **Soft spot:** Rawls scholars may insist your "Parfit via Rawls" framing misreads *A Theory of Justice*; you sidestep contractualism’s core agency argument.  

  3. **"Parfit *himself* (Reasons and Persons, §123) rejects utilitarianism precisely because reductionism doesn’t license ignoring distributive constraints—so why isn’t your argument a non-starter?"**  
     - **Reply:** "Parfit is inconsistent: he claims reductionism removes the ‘deep distinction’ between intrapersonal and interpersonal aggregation (§99), yet keeps separateness for normative reasons. But if identity isn’t deep, the *moral weight* of that distinction needs new justification—which he doesn’t provide."  
     - **Soft spot:** Parfit scholars will note he addresses this later (e.g., in *On What Matters*), arguing reductionism supports contractualism.  

  4. **"Even if identity is ‘shallow’, persons are still discrete loci of agency *now*. Why does psychological continuity over time license ignoring present separateness?"**  
     - **Reply:** "It doesn’t—but the objection compares interpersonal aggregation to *intrapersonal* aggregation, which also involves sacrificing present interests for future ones. If the latter is permissible despite psychological discontinuity, why treat interpersonal sacrifices differently without deeper boundaries?"  
     - **Soft spot:** Doesn’t address whether ‘present agency’ is morally paramount; may concede too much to utilitarianism.  

  5. **"Your view implies we can aggregate across persons like we do across time—but doesn’t Arrow’s theorem show interpersonal utility comparisons are impossible? If not, what’s your response to social choice theory?"**  
     - **Reply:** "Arrow assumes ordinal preferences, but utilitarianism requires cardinal, comparable utility. If we accept that (e.g., via Harsanyi), and if personal boundaries are metaphysically thin, aggregation isn’t *more* problematic than intrapersonal trade-offs over time."  
     - **Soft spot:** The economist will counter that Arrow applies even with comparability; you’ve not engaged technical social choice literature.  

  6. **"Special obligations (e.g., to family) seem to rely on the very separateness you downplay. Doesn’t reductionism, if true, undermine those too—making your argument self-defeating?"**  
     - **Reply:** "Not necessarily: obligations can be grounded in relationships or projects, not identity. Parfit (§101) suggests reductionism *strengthens* concern for others. But this is separable—my point is that *if* we allow intrapersonal aggregation, rejecting interpersonal aggregation needs justification beyond ‘separateness’."  
     - **Soft spot:** Hand-wavy on how obligations survive without robust identity.  

  7. **"Utilitarians *do* treat persons as ‘mere containers’ for utility. Even with reductionism, doesn’t ignoring the container’s integrity remain objectionable?"**  
     - **Reply:** "Containers imply walls—but if psychological continuity is what matters, and it’s degree-relative, the ‘container’ is porous. We don’t treat past/future selves as ‘containers’ when we discount their utility intrapersonally; consistency demands similar flexibility interpersonally."  
     - **Soft spot:** Doesn’t answer the charge that utilitarianism still flattens agency into experiential states.  

  **The Question You Hope Nobody Asks:**  
  **"If personal identity is just psychological continuity, why isn’t a brain-fused ‘group person’ (like Parfit’s Russian nobleman) morally equivalent to a single person—making aggregation across *anyone* unobjectionable? Wouldn’t that collapse society into one agent?"**  
  - **Why it’s deadly:** Forces you into sci-fi edge cases where your view implies radical collectivism, alienating Rawlsians.  
  - **Reply (if pressed):** "Pragmatically, we prioritise existing biological persons. But metaphysically, fusion *would* obligate direct aggregation. Still, this doesn’t affect my core point: critics can’t consistently appeal to ‘deep’ separateness while accepting reductionism."  
  - **Soft spot:** Admits your view could justify extreme conclusions.  

  **Key Tactic:** Pre-empt the top objection by opening with: "I’m not defending Parfit’s metaphysics—I’m arguing that those *invoking* Parfit against utilitarianism face a contradiction." Frame replies to concede ground where needed (e.g., Rawls’ agency) while hammering the inconsistency in Parfit-influenced separateness arguments.
