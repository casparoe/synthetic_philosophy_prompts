answer: |-
  Here are the three deliverables for your take-home final question on Hume:

  ### 1. Essay Question (Student-Facing Version)  
  **Length Guideline:** 90 minutes  
  **Word Limit:** 800–1000 words  

  > **Hume’s "Standard of Taste": Constitutive or Epistemic?**  
  > Hume argues that the "joint verdict" of qualified judges establishes a "standard of taste." This question asks you to determine whether this standard is **constitutive** or **epistemic**, and what hangs on this distinction for the objectivity of beauty.  
  >   
  > **Key Distinction:**  
  > - A **constitutive standard** *defines* the fact it measures. For example, the original metre was defined by a platinum-iridium bar in Sèvres: matching the bar *made* something one metre long. The bar couldn’t be "wrong" because it fixed what "metre" meant.  
  > - An **epistemic standard** *tracks* a fact that exists independently. A thermometer measures temperature, but it can be faulty, corrected, or compared to other instruments because temperature exists apart from the thermometer.  
  >   
  > **Your Tasks:**  
  > A. Decide whether Hume’s "joint verdict" of qualified critics is a constitutive or epistemic standard (or if his essay slides between the two). Explain what this implies for whether beauty is objective. If constitutive, can Hume genuinely answer the skeptic who denies objectivity? If epistemic, what must beauty be "in itself" for critics to track it?  
  >   
  > B. Treat Hume’s claim that "the same Homer who pleased at Athens and Rome two thousand years ago, is still admired at Paris and London" as an empirical prediction: if a work admired for centuries fell *permanently* out of favor, would this:  
  >   - Refute the standard?  
  >   - Show earlier critics were unqualified?  
  >   - Prove beauty was constitutive (and changed with human nature)?  
  > Justify your view using the constitutive/epistemic distinction.  
  >   
  > C. Hume identifies qualified judges partly by their agreement with "durable admiration" for certain works (e.g., the *Iliad*), then uses their verdicts to justify that admiration. Is this circular? If so, is it vicious? Do Hume’s "marks of the true judge" (delicacy, practice, comparison, etc.) resolve the circle or just relocate it?  
  >   
  > D. The essay promises a "standard of *taste*," not beauty. Does Hume secure objectivity for the *judgments* of critics rather than for beauty "in the work"? If so, is this true objectivity about beauty, or merely intersubjective agreement?  

  ---

  ### 2. Model Answer (650 words)  
  **Position:** *Hume’s standard is constitutively defined, rendering beauty’s objectivity nominal rather than robust.*  

  Hume’s "joint verdict" of qualified judges functions as a constitutive standard for beauty. This grants a hollow, stipulative objectivity: beauty is *defined* as what ideal critics approve, evading the skeptic’s challenge rather than answering it. Hume’s sentiment-based metaphysics—where beauty arises from "certain qualities in objects fitted by nature" to please observers—demands an epistemic standard (beauty as an independent fact critics track). Yet his system lacks resources to fulfill this, collapsing into circularity and exposing beauty as mutable consensus, not objective truth.  

  **A. Constitutivity and the Objectivity Illusion**  
  Hume’s critics *fix* beauty’s standard, like the metre bar fixing length. He writes that "the taste of all individuals is not upon an equal footing," elevating ideal critics to arbiters. If beauty were epistemic, critics would track mind-independent properties (e.g., "fitness" to please). But Hume’s "fitness" is irreducibly relational: it depends on human sensibilities. Thus, the "standard" cannot point beyond sentiment. Calling critics "qualified" disguises a tautology: beauty is what qualified judges endorse, and judges are qualified partly because they endorse what we call beautiful. This stipulation neuters skepticism but reduces objectivity to authority.  

  **B. Empirical Failure and Mutability**  
  Hume’s Homer example predicts durable convergence. If Homer fell permanently from favor, Hume would likely claim past critics lacked full qualification (e.g., insufficient comparison to modern works). But this reveals constitutivity: the verdict *defines* beauty, so "error" is impossible. Disagreement merely indicates failed qualifications, not flawed tracking. Worse, Hume allows that if human nature changed (e.g., due to climate or illness), "the perfect consensus of sentiment" could shift, altering beauty itself (*Essays*, 150). An epistemic standard would require beauty’s persistence beyond such shifts; Hume’s account permits its dissolution.  

  **C. Vicious Circularity**  
  The circle in identifying critics and works is vicious. Hume selects judges partly for endorsing "durable" works like Homer, then cites their verdicts to validate Homer. His independent "marks" (delicacy, practice, etc.) merely relocate the circle. To identify a "delicate" judge, we must already know which subtle features in works (e.g., Virgil’s "propriety") deserve attention—features established by prior judgments we trust. Without pre-existing benchmarks, the marks are empty criteria. This circularity is inevitable because Hume’s standard is constitutive: beauty and expertise are co-defined.  

  **D. Taste vs. Beauty: Subjectivity Relabeled**  
  The title’s focus on "taste" is telling. Hume secures objectivity for critics’ *judgments*, not beauty itself. He writes that critics "employ" a standard allowing "confirmation of one another’s verdict." But intersubjective agreement among experts is not objectivity about works; it’s refined consensus. If beauty were objective, we could ask *why* critics agree (e.g., does Homer possess universal "fitness"?). Hume offers no answer beyond shared sentiment. Thus, his "standard" describes reliable human responses, not a property in objects.  

  In sum, Hume’s standard is constitutively defined, masking subjectivity as authority. While his marks of good judges offer practical guidance for criticism, they fail to ground beauty’s objectivity. The essay’s circularity and mutability reveal that Hume’s "standard" is a social construct—an elegant solution to reconciling divergent tastes, but a surrender to the skeptic.  

  ---

  ### 3. Marking Scheme (20 points total)  
  **Must-Hit Points:**  
  1. **Clear classification of Hume’s standard** (constitutive/epistemic/slide) **with implications for objectivity** (4 pts).  
     *Lose marks for:* Vague classification; ignoring how constitutivity "stipulates" objectivity.  
  2. **Analysis of empirical reversal (Homer scenario) using the constitutive/epistemic distinction** (4 pts).  
     *Lose marks for:* Treating reversal only as evidence of critic error; ignoring mutability.  
  3. **Assessment of Hume’s circularity: vicious or resolved? Role of "marks" of true judges** (4 pts).  
     *Lose marks for:* Denying circularity; uncritically accepting the marks as independent.  
  4. **Treatment of "taste" vs. "beauty": Does objectivity attach to works or judgments?** (4 pts).  
     *Lose marks for:* Equating intersubjectivity with objectivity; ignoring the title’s significance.  
  5. **Overall coherence: Integration of tasks into a unified argument about beauty’s status** (4 pts).  
     *Lose marks for:* Disconnected points; ignoring Hume’s sentiment-based metaphysics.  

  **A vs. B Differentiation:**  
  - **B answers** (14–16 pts) accurately summarize Hume, apply the constitutive/epistemic distinction, and hit all tasks competently but remain descriptive. They may note tensions without resolving them (e.g., "Hume seems epistemic but has constitutive elements").  
  - **A answers** (17–20 pts) **diagnose why Hume’s metaphysics forces a constitutive reading despite his epistemic framing**. They expose the unsolved problem: an epistemic standard requires beauty to be a mind-independent "fit," but Hume’s sentiment-based theory reduces "fit" to *actual* human response, collapsing into constitutivity. They use this tension to explain the circularity (Task C) and the taste/beauty gap (Task D) as symptoms of this deeper flaw.  

  ---  
  This question forces engagement with Hume’s unresolved dilemma: his empirical method seeks an epistemic standard, but his commitment to sentiment as the source of beauty dooms it to constitutivity. The marking scheme rewards students who trace this tension through all three tasks, moving beyond summary to critique.
