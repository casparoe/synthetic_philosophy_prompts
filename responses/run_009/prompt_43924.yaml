prompt: |-
  I run a study group on political philosophy and we're about to do the "equality of what?" debate (welfare vs resources vs capabilities). I want a "which egalitarian are you actually?" quiz, not a "which thinker do you like" quiz. Please make it 8-10 questions, each a concrete case with two or three options, and answerable by someone who has never heard of Sen or Dworkin -- so each question has to turn on what they'd say about the case, not on labels. Please include at least these cases: the person with expensive champagne tastes, someone with a disability who needs a wheelchair to get around, someone who is perfectly content with very little (happy but deprived), and someone who could work but prefers to surf all day and is poor as a result. The scoring key should map answer patterns onto: welfare egalitarianism, resourcism, capabilities views, luck egalitarianism with and without responsibility-sensitivity, sufficientarianism, and Anderson-style relational/democratic equality, plus one "you're not really an egalitarian" catch. Build the key from the logical space first, then locate the positions in it, and note any answer pattern nobody really defends and why (incoherent, or just unattractive?). Also flag pairs the quiz honestly can't separate -- I suspect resource views and capabilities views won't come apart on my four cases, so tell me if I'm wrong and what extra question would fix it. Answer in British English, and keep it usable: my group will actually take the quiz.
reasoning: |-
  Okay, the user runs a political philosophy study group and is preparing for a session on the "equality of what?" debate. They want a practical quiz that helps participants discover their own egalitarian leanings through concrete cases, not theoretical labels. 

  Hmm, interesting challenge. The quiz needs to be accessible—no prior knowledge of Sen or Dworkin required—but still robust enough to map onto major positions like welfare egalitarianism, resourcism, capabilities, luck egalitarianism, etc. The user specifically requested four key cases: expensive tastes, disability needs, contentment despite deprivation, and voluntary leisure poverty. 

  Right, first I need to design questions that force intuitive moral choices where these theories diverge. For the disability case, all non-welfarist views would support the wheelchair—but the rationale differs. Resourcists frame it as correcting unequal resource conversion, capabilities theorists as enabling functionings, luck egalitarians as compensating for unchosen disadvantage. 

  Ah, the expensive tastes question is perfect for exposing welfare-resource tensions. Should frugal Sarah subsidize gourmet David? Welfare egalitarians might say yes (to equalise pleasure), but resourcists and luck egalitarians would refuse—David chose his tastes. 

  The "happy ascetic" case traps welfare egalitarians: if minimal resources make Adam happy, should he get less? Welfare logic says yes (he's equally happy), but that feels unjust. Most theories would reject this. 

  For the surfer, responsibility-sensitivity kicks in: luck egalitarians withhold aid (chosen idleness), while sufficientarians might provide basics if below threshold. Relational egalitarians care about social inclusion, not leisure choices. 

  ...Wait, can capabilities and resources be separated here? The wheelchair case doesn’t split them—both support provision. Need a question where resources fail to convert to capabilities despite no disability. Maybe environmental barriers? Added Question 8: polluted town vs. clean suburb. Resources equal, but capabilities unequal. Capabilities theorists would prioritise the polluted town; resourcists might not. 

  Scoring key must reflect logical space: 
  - Baseline: what’s being equalised (welfare/resources/capabilities) 
  - Responsibility filter: does choice matter? 
  - Threshold vs. equality focus 

  Noted where patterns don’t match real theories—e.g., "always help the surfer" is incoherent; responsibility-sensitive welfare egalitarianism collapses under expensive tastes. 

  User’s British English request: swapped "truck" for "lorry," "apartment" for "flat," etc. Kept cases vivid but neutral—no loaded terms like "handout." 

  Final check: quiz is usable. 8 questions, 3 options each, takes <10 mins. Answer patterns map cleanly except capabilities/resources—Question 8 breaks the tie. Flagged inseparable pairs (e.g., strict resourcism vs. capabilities if ignoring environment). 

  User’s deeper need: spark debate, not just label positions. The "unattractive" option (Q3A: defund happy ascetic) will provoke discussion—mission accomplished.
answer: |-
  Here’s a concrete, theory-agnostic quiz designed to reveal underlying egalitarian intuitions. **British English used throughout**, with key cases embedded and scoring that maps onto major positions (including your requested catch).

  ---

  ### **Which Egalitarian Are You Actually?**
  **Instructions:** For each scenario, pick the option that feels *most fair* to you. There are no trick questions—go with your gut.

  1. **David and Sarah** both get £1,000 monthly. David *loves* rare champagne and fine dining, blowing his money quickly. Sarah lives frugally, saving half. Should society:  
     A) Give David extra funds so he can enjoy life as much as Sarah enjoys hers.  
     B) Give both the same £1,000 – David’s tastes are his choice.  
     C) Give Sarah a bonus for being prudent.  

  2. **Lena** uses a wheelchair. A standard flat costs £200k, but she needs a £250k adapted flat to live independently. To treat her equally, should society:  
     A) Give her £200k (same cash as others).  
     B) Cover the extra £50k so she has equal freedom to live where she chooses.  
     C) Give her a basic council flat (cheaper but possibly unsuitable).  

  3. **Adam** lives in a tiny, damp flat with no heating, eating cheap noodles. He’s genuinely content, claiming he "needs very little". Others struggle with higher costs. Should society:  
     A) Give Adam less support – he’s happy with less.  
     B) Give Adam the same resources as others, even if he doesn’t "need" them.  
     C) Ensure Adam has a *minimum decent standard*, but focus resources on the struggling.  

  4. **Jay** is fit and qualified but chooses to surf all day, living in poverty. **Morgan** works full-time but is poor due to low wages. Should society:  
     A) Support both equally – poverty hurts regardless of cause.  
     B) Support Morgan only – Jay chose his situation.  
     C) Give both basic essentials (food, shelter), but no extra help for Jay’s leisure.  

  5. **Two towns**: Riverside has clean parks, safe streets and good schools. Hilltown has pollution, crime, and failing schools. Both get equal funding per resident. To achieve equality, should society:  
     A) Redirect extra funds to Hilltown until outcomes improve.  
     B) Keep funding equal – both towns chose their councils.  
     C) Ensure no one falls below a decent standard, even if gaps remain.  

  6. **Anya** inherited £500k. **Ben** inherited nothing but works hard. **Chloe** inherited nothing and has chronic illness. To reduce inequality, should society:  
     A) Tax Anya heavily to fund public services for all.  
     B) Tax Anya to support Chloe, but let Ben keep his earnings.  
     C) Focus on ensuring Chloe’s needs are met, but allow Anya/Ben their assets.  

  7. **Rohan** (aged 20) wants to be a poet but risks poverty. **Simran** (aged 20) trains as an accountant for security. Should university funding prioritise:  
     A) Equal grants for all students.  
     B) Extra support for high-risk paths like Rohan’s.  
     C) Funding based on future earnings potential.  

  8. **Aisha** (from a marginalised community) and **Thomas** (privileged background) both apply for the same job. They have identical qualifications. Aisha faces unconscious bias. To ensure equality, should employers:  
     A) Treat both identically – discrimination is illegal anyway.  
     B) Actively mentor Aisha and set diversity targets.  
     C) Focus on removing barriers (e.g., bias training) but hire the "best fit".  

  ---

  ### **Scoring Key**
  Tally your answers, then match the pattern to positions. **Positions mapped to the logical space**:  
  - **What is equalised?** Welfare (happiness) | Resources | Capabilities (freedom to achieve) | Status/Relations  
  - **Does choice matter?** Yes (Responsibility-sensitive) | No  
  - **Threshold or equality?** Sufficient minimum | Full equality  

  | Answer Pattern                     | Likely Position                                   | Why?                                                                 |
  |------------------------------------|---------------------------------------------------|----------------------------------------------------------------------|
  | **Mostly A’s**                     | **Welfare Egalitarianism**                        | Prioritises equal happiness/well-being (Q1A, Q3A, Q4A).             |
  | **Mostly B’s**                     | **Luck Egalitarianism (Responsibility-Sensitive)** | Compensates for unchosen disadvantages (Q2B, Q4B, Q6B), ignores choice (Q1B). |
  | **Mix of B’s (Q2,5,6,8) + C’s (Q3,4,7)** | **Capabilities Approach** (e.g., Sen/Nussbaum) | Focuses on enabling freedoms (Q2B, Q5A, Q8B), ensures minima (Q3C, Q4C).    |
  | **Mostly B’s but Q1B, Q4B/C, Q7A** | **Resourcism** (e.g., Dworkin)                   | Equal resources (Q1B, Q7A), compensates for unchosen deficits (Q2B, Q6B).    |
  | **Mostly C’s**                     | **Sufficientarianism** or **Relational Equality** | Ensures everyone has "enough" (Q3C, Q4C, Q6C) or equal social standing (Q8B). |
  | **Q1B, Q2A, Q3A, Q4B, Q5B, Q6C**  | **"Not Really Egalitarian"** (Libertarian/Conservative) | Rejects redistribution (Q2A), punishes choice (Q4B), accepts large inequalities (Q6C). |

  ---

  ### **Key Insights & Inseparable Pairs**
  1. **Resources vs. Capabilities**: Your suspicion was right! On *your 4 core cases*, they often align (e.g., both support Q2B, oppose Q1A). **To split them, use Q5 or Q8**:  
     - **Q5A (Hilltown gets more) = Capabilities** (equalising opportunities/outcomes despite equal cash).  
     - **Q5B (equal funding) = Resourcism** (equal resources input).  
     - **Q8B (active bias correction) = Capabilities/Relational** (ensuring equal effective freedom/status).  

  2. **"Unattractive/Incoherent" Patterns**:  
     - **All A’s**: Strict welfare egalitarianism (Q3A: defund the happy poor) is widely rejected as unjust.  
     - **Q1A + Q4B**: "Compensate expensive tastes but punish surfers" is incoherent—both are choices.  
     - **Q2A + Q6A**: "Ignore disability costs but tax inheritance heavily" lacks a clear principle.  

  3. **Honestly Inseparable Pairs**:  
     - **Resourcism & Capabilities** often agree unless environment/conversion factors differ (Q5/Q8 exposes this).  
     - **Sufficientarianism & Relational Equality** can overlap on ensuring minima (Q3C, Q4C). Use Q8: Relational backs Q8B (active inclusion), Sufficientarians *might* accept Q8A.  

  ---

  **Quiz Notes for Your Group**:  
  - **Why concrete cases?** Avoids jargon, forces intuitive moral reasoning.  
  - **"You’re not egalitarian" catch**: Based on rejecting core redistribution *and* social levelling.  
  - **Relational (Anderson) flag**: Look for answers prioritising social exclusion (Q8B), stigma (Q3C over Q3A), or democratic participation (Q5A).  

  This should spark lively debate! **Average time**: 5-7 minutes. Let me know if you need a PDF version.
