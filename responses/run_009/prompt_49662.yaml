  Here's a complete decision tree for your Anthropocene quiz, designed to meet your constraints and expose potential inconsistencies in user reasoning. The tree prioritizes concrete questions, avoids jargon, folds in the "who decides" axis, and flags inconsistencies (especially for early agriculture proponents).

  ---

  ### **Decision Tree Structure**
  **Max Depth:** 4 questions (most users hit a leaf in 2-3 questions)  
  **Total Questions:** 7 (but no path uses >4 questions)  
  **Leaves:** 5 positions (with "who decides" context baked into each leaf)

  ```mermaid
  graph TD
    A[Q1: Is the most important signal of human impact a *sudden global event* or a *slow buildup*?] -->|Sudden global event| B[Q2: Is the best marker radioactive fallout or species exchange?]
    A -->|Slow buildup| C[Q3: Did humans reshape the planet *mostly after 1800* or *over thousands of years*?]
    B -->|Radioactive fallout| D[Mid-20th century]
    B -->|Species exchange| E[~1610]
    C -->|Mostly after 1800| F[Q4: Was the key driver coal/industry or post-WWII acceleration?]
    C -->|Over thousands of years| G[Early agriculture]
    F -->|Coal/industry| H[Industrial Revolution]
    F -->|Post-WWII acceleration| I[Mid-20th century]
    G --> J[Q5: Is the Holocene itself a human-shaped epoch?]
    J -->|Yes| K[No formal Anthropocene]
    J -->|No| G
  ```

  ---

  ### **Question List**  
  Each question is neutral, concrete, and avoids telegraphing positions:

  1. **Is the most important signal of human impact a *sudden global event* (like a catastrophe or invention) or a *slow buildup* (like gradual changes to land or climate)?**  
     - *Purpose:* Splits sharp vs. gradual markers. Filters out Holocene-purists early.

  2. **If "sudden event": Which event left the clearest *global* trace: radioactive fallout (1950s) or species exchange between continents (~1600s)?**  
     - *Concrete cases:* Bomb tests vs. Columbian Exchange. Avoids "Orbis spike" jargon.

  3. **If "slow buildup": Did humans reshape the planet *mostly after 1800* (e.g., factories, cities) or *over thousands of years* (e.g., farming, fire)?**  
     - *Filters:* Industrial vs. agrarian focus. Exposes if user overlooks deep-time impacts.

  4. **If "mostly after 1800": Was the key driver *coal/industry* (1800s soot, steam engines) or *post-WWII acceleration* (plastics, nukes, population boom)?**  
     - *Distinguishes:* Industrial Revolution vs. Great Acceleration without jargon.

  5. **If "early agriculture": Do you think the *Holocene itself* (last 11,700 years) is already a human-shaped epoch?**  
     - *Inconsistency trap:* Tests if users deny the Holocene's human ties while claiming ancient roots for the Anthropocene.

  ---

  ### **Leaf Map**  
  *(Positions + "Who decides" context)*

  | **Leaf Position**               | **Path to Reach It**                                                                 | **"Who Decides" Note**                                                                                               | **Inconsistency Flag** |
  |---------------------------------|--------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------|------------------------|
  | **Mid-20th century**            | Q1 (Sudden) → Q2 (Radioactive) OR Q1 (Slow) → Q3 (After 1800) → Q4 (Post-WWII)       | "Geologists: Must have a sharp, global marker (like plutonium in sediments). Others: Captures the 'Great Acceleration' tipping point." | None |
  | **~1610**                       | Q1 (Sudden) → Q2 (Species exchange)                                                 | "Geologists: Needs a synchronous layer (like pollen/fossil shifts). Others: Represents colonialism's ecological rupture." | None |
  | **Industrial Revolution**       | Q1 (Slow) → Q3 (After 1800) → Q4 (Coal/industry)                                    | "Geologists: Rejects this (no single marker). Others: Highlights capitalism/fossil fuels as the turning point."      | None |
  | **Early Agriculture**           | Q1 (Slow) → Q3 (Thousands of years) → Q5 (No, Holocene isn't human-shaped)          | "Geologists: Impossible to define (no global layer). Others: Emphasizes slow violence of farming/colonization."      | **YES**: Claims human epoch starts with agriculture but denies the Holocene (which encompasses it) is human-shaped. |
  | **No formal Anthropocene**      | Q1 (Slow) → Q3 (Thousands of years) → Q5 (Yes, Holocene is human-shaped)            | "Geologists: Human changes are too gradual. Others: Avoids excusing recent damage by calling it 'geological fate'."  | None |

  ---

  ### **Design Choices & Notes**
  1. **Question-first tree:**  
     Questions branch on **temporal sharpness** (sudden vs. gradual) → **driver events** (nukes, exchange, coal, farming) → **Holocene awareness**. This surfaces 6/7 possible answer combos, with only one unmapped ("sudden event + reject both 1950/1610"). That combo is rare/unpopular—no credible position rejects *all* sharp markers.

  2. **Folding in "who decides":**  
     Embedded in **leaf descriptions** (not branch questions). Why?  
     - The debate is about *criteria* (sharp marker vs. broad impact), which maps cleanly to geologists (GSSP required) vs. others (narrative-driven).  
     - Asking "who should decide?" directly would feel abstract and political. Concrete events (Q2/Q4) implicitly force this choice.

  3. **Separating leaves:**  
     - **Mid-20th vs. Industrial Revolution** splits on *driver* (Q4: nukes/plastics vs. coal) and *temporal type* (sudden vs. gradual).  
     - **~1610 vs. Early Agriculture** splits on *sharpness* (Q1) and *Holocene awareness* (Q5).  
     - **All leaves are separable** *except*: Mid-20th is reachable by two paths (sudden/nukes OR slow/acceleration). This is intentional—it reflects real-world overlap (e.g., a geologist and a climate scientist both landing here for different reasons).

  4. **Inconsistency exposure:**  
     - The **Early Agriculture → Q5** path tests your roommate's hypothesis. If users say "human impacts began 8kya but the Holocene isn't human-shaped," they land in a logical trap (leaf description calls this out).  
     - *Why she's half-right:* Technically, the **Holocene *is* the interglacial period humans modified** (via farming, extinctions). But some argue "Anthropocene" should emphasize *recent, irreversible* changes. The quiz exposes if users haven’t thought this through.

  5. **Why this works for normies:**  
     - No jargon (avoids "GSSP," "stratigraphy," "Orbis spike").  
     - Forces concrete choices (e.g., "species exchange" not "1610").  
     - Short (83% paths end by Q3).  
     - "Slow buildup" path mirrors common eco-conscious narratives, making the Q5 trap more surprising.

  ---

  **Final Output:**  
  - **Tree:** Mermaid syntax above (ready for JS libs like mermaid-js).  
  - **Questions:** 5 total (Q1–Q5).  
  - **Leaves:** 5 positions with "who decides" context.  
  - **Inconsistency:** Flagged on Early Agriculture leaf.  

  **Roommate hypothesis verdict:** She's right that **early-agri advocates often overlook the Holocene's human context**—the tree exposes this. But it *is* coherent if users see the Anthropocene as a *sub-epoch* of the Holocene (though few do). The quiz highlights the tension without forcing alignment.
