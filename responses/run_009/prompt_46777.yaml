  First, I need to recall Dennett's intentional stance. It's a tool for prediction—treat an entity as rational, attribute beliefs/desires, and predict behavior. The friend argues that if it predicts well, it's valid, just like with corporations. The user counters that the corpus stance (predicting based on training data) is equally viable, creating ambiguity. Also, without real-world anchors like perception or memory, attributions might not hold.

