  Legal scaffolding is last. Even if needed, it's premature without clarifying prior issues. It's speculative but could rise if policy debates intensify.

  Deprioritizing moral status and knowledge makes sense. These require more than stance-theoretic grounds and involve additional debates. The user wants focus on belief attribution's foundations, not extended implications.

