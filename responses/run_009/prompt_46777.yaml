  Then, the corporate analogy. This is central to the friend's argument. If the analogy fails, the intentional stance might not apply as-is. But it's downstream because it relies on the first two questions. Historical and legal analysis makes it tractable. Changes in corporate law or AI incidents could impact its relevance.

