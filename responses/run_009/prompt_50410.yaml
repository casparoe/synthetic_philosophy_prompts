prompt: |-
  I'm taking a philosophy of mind course, and our professor wants us to write essays arguing that some theory of consciousness is adequate only relative to a checklist we have to build ourselves first. Take the role of a professional philosopher of mind and help me draft that checklist for theories located in the access-vs-phenomenal-consciousness debate. Begin with some brief brainstorming before committing to the final list. The desiderata should cover at least the following, though you may add others: (i) explaining cases that seem to show phenomenal consciousness overflows the capacity-limited contents that global workspace theory says get broadcast (e.g., the Sperling partial-report setup); (ii) handling postdictive phenomena, where the moment-to-moment contents of experience appear to depend on what arrives slightly later (e.g., the cutaneous rabbit); (iii) respecting the access/phenomenal distinction without either collapsing it by stipulation or positing an untestable second layer of consciousness; and (iv) accounting for subjects who cannot report their experiences at all. My professor also insists on a requirement she calls "demotion discipline": when a theory reclassifies some everyday experience as not-really-conscious, it owes us an account of what that experience then is, rather than quietly deleting it. Please say which desiderata you think are non-negotiable and which are camp prejudices (e.g., favors of overflow defenders or of workspace theorists), whether any subset is jointly unsatisfiable, and finish with one paragraph on how global workspace theory does against your list.
reasoning: |-
  Okay, the user is taking a philosophy of mind course and needs help drafting a checklist for evaluating theories of consciousness, specifically in the access vs. phenomenal consciousness debate. They've mentioned several specific requirements from their professor: explaining cases like the Sperling experiment, handling postdictive phenomena like the cutaneous rabbit, respecting the access/phenomenal distinction without collapsing it or adding untestable layers, accounting for unreportable experiences, and following "demotion discipline." 

  Hmm, this is a sophisticated request. The user clearly understands the core tensions in consciousness studies—they're not just asking for definitions but for evaluative criteria that can handle real theoretical disputes. Their professor seems rigorous, pushing them to avoid superficial takes. The mention of "camp prejudices" suggests they want neutral tools, not partisan weapons. 

  First, I need to unpack their four explicit points: 
  - Sperling's partial-report paradigm challenges workspace theories by suggesting phenomenal consciousness exceeds accessible content. Any checklist must test how theories handle this "overflow."
  - Postdictive effects like the cutaneous rabbit undermine strict moment-by-moment processing accounts. Theories need temporal flexibility.
  - The access/phenomenal distinction is central but treacherous—some theories erase it (reductionists), others inflate it (dualists). The checklist should enforce conceptual hygiene.
  - Unreportable experiences (e.g., in aphasia or neglect) probe whether consciousness requires accessibility. Can't ignore edge cases.

  The "demotion discipline" add-on is spicy! It stops theories from sweeping inconvenient experiences under the rug. If you claim something isn't *really* conscious, you owe an alternative story. That's meta-theoretical accountability. 

  Now, brainstorming: beyond their list, I should include...
  - *Unity/Integration*: How does the theory bind features into a single experience?
  - *Informational Depth*: Does it explain why consciousness feels a certain way, not just functions?
  - *Neurobiological Plausibility*: Can it map to known neural mechanisms? Avoids "zombie brain" handwaving.
  - *Evolutionary Coherence*: Why would consciousness emerge? Fitness benefits matter.
  - *Metaphysical Parsimony*: No multiplying entities needlessly (looking at you, epiphenomenalism).

  But which are non-negotiable? *Explanatory Power* (Sperling/postdiction), *Distinction Respect*, and *Demotion Discipline* feel essential—they're checks against evasion. *Neuro-Plausibility* and *Parsimony* are strong preferences, but some theories (e.g., panpsychism) might reject them on principle. *Evolutionary Coherence* could be negotiable if the theory is non-naturalist. 

  Ah, tensions: Demanding both *Informational Depth* and *Neuro-Plausibility* might squeeze out non-reductive theories. And *Distinction Respect* could clash with *Parsimony* if preserving the gap requires extra mechanisms. No fatal incompatibilities though—just balancing acts. 

  Finally, applying this to Global Workspace Theory (GWT): 
  - *Sperling/Overflow*: Fails—it denies overflow, so must demote rich iconic memory to non-conscious (needing demotion discipline!). 
  - *Postdiction*: Struggles—backward-in-time effects strain the "broadcast now" model. 
  - *Access/Phenomenal Distinction*: Collapses it—access *is* consciousness. 
  - *Unreportable Cases*: Poor fit—if unreportable, it's not conscious by GWT lights. 
  - *Demotion Discipline*: Owes us an account of what demoted states (e.g., Sperling's grid) *are*. 

  GWT scores on unity and neuro-plausibility but stumbles on key challenges. The checklist exposes its tradeoffs clearly. User gets a rigorous tool—not a verdict, but a way to argue. Their professor should approve.
answer: |-
  Here’s a structured approach to your checklist, grounded in professional philosophy of mind. I’ll begin with brainstorming, then refine into a formal list, analyze desiderata, and evaluate Global Workspace Theory (GWT).

  ---

  ### **Brainstorming Core Desiderata**  
  1. **Explanatory Scope**: Must address empirical puzzles (Sperling, cutaneous rabbit).  
  2. **Conceptual Rigor**: Avoids conflating access/phenomenal consciousness (A/P) or positing untestable "magic."  
  3. **Inclusivity**: Accounts for unreportable states (e.g., locked-in syndrome, preverbal infants).  
  4. **Demotion Discipline**: Requires theories to explain *what* demoted states are (e.g., if not "conscious," are they unconscious? Illusory?).  
  5. **Neuro-Cognitive Plausibility**: Aligns with known neural architecture without ad-hoc assumptions.  
  6. **Temporal Flexibility**: Handles non-linear temporal dynamics (postdiction, time perception).  
  7. **Phenomenal Robustness**: Explains *why* experience feels a certain way (beyond functional role).  

  ---

  ### **Final Checklist for Theories of Consciousness**  
  1. **Overflow Handling**  
     - *Criterion*: Explains cases where phenomenal content appears richer than accessible report (e.g., Sperling’s partial-report paradigm).  
     - *Test*: Does the theory acknowledge/explain rich iconic memory without reducing it to access?  

  2. **Postdictive Integration**  
     - *Criterion*: Accommodates temporal anomalies (e.g., cutaneous rabbit, flash-lag) where later stimuli alter earlier phenomenology.  
     - *Test*: Can the theory model retroactive influences without violating causal order?  

  3. **A/P Distinction Maintenance**  
     - *Criterion*: Respects the access/phenomenal distinction *without*:  
       - (a) Collapsing them (e.g., GWT’s identity claim),  
       - (b) Invoking empirically untestable layers (e.g., non-physical qualia).  
     - *Test*: Can phenomenal properties exist without access in the theory?  

  4. **Unreportable Experience Accounting**  
     - *Criterion*: Explains consciousness in subjects lacking report capacity (e.g., aphasia, neglect, infancy).  
     - *Test*: Does consciousness require *potential* access, or is it independent?  

  5. **Demotion Discipline**  
     - *Criterion*: If a state is deemed "non-conscious" (e.g., Sperling’s unaccessed grid), the theory must specify its ontological status (e.g., proto-conscious, unconscious processing).  
     - *Test*: No "deletions" — what replaces the demoted state?  

  6. **Unity/Integration Constraint**  
     - *Criterion*: Explains how disparate features bind into a unified experience (e.g., color-motion binding).  

  7. **Informational Depth**  
     - *Criterion*: Accounts for the intrinsic structure of phenomenology (e.g., why red feels different than blue).  

  8. **Neurobiological Compatibility**  
     - *Criterion*: Aligns with established neuroscience (e.g., neural correlates of consciousness).  

  ---

  ### **Analysis of Desiderata**  
  - **Non-Negotiables**:  
    - *Overflow Handling*, *A/P Distinction Maintenance*, and *Demotion Discipline* are essential. They prevent theories from ignoring inconvenient data or stipulating away problems.  
    - *Unreportable Experience Accounting* is critical for avoiding anthropocentric bias.  

  - **Camp Prejudices**:  
    - *Overflow Handling* favors **Phenomenal Overflow** (e.g., Block) and challenges GWT.  
    - *Neurobiological Compatibility* favors **GWT/Physicalists** and challenges non-naturalist theories.  
    - *Informational Depth* favors **Qualia Realists** (e.g., Chalmers) and challenges eliminativism.  

  - **Joint Satisfiability**:  
    - Tension exists between *A/P Distinction* (requiring separation) and *Unity/Integration* (requiring integration).  
    - *Overflow* + *Neurobiological Compatibility* may strain reductive theories (e.g., GWT).  
    - *No subset is strictly unsatisfiable*, but trade-offs emerge (e.g., prioritizing phenomenology vs. functionalism).  

  ---

  ### **Global Workspace Theory (GWT) vs. the Checklist**  
  1. **✅ Neurobiological Compatibility**: GWT excels here, linking consciousness to global neuronal broadcasting (e.g., prefrontal cortex integration).  
  2. **✅ Unity/Integration**: Strong fit — broadcasting explains coherence.  
  3. **❌ Overflow Handling**: Fails. GWT denies phenomenal overflow, demoting Sperling’s rich experience to non-conscious processing.  
  4. **❌ A/P Distinction**: Collapses it — access *defines* consciousness.  
  5. **⚠️ Postdictive Phenomena**: Struggles; backward masking requires ad-hoc temporal extensions.  
  6. **❌ Unreportable Experiences**: Fails — unreportable = unconscious by definition.  
  7. **⚠️ Demotion Discipline**: Owes an account: What *is* Sperling’s grid if not conscious? (Typically: "preconscious" processing).  
  8. **❌ Informational Depth**: Functionalist — sidesteps "why" of phenomenology.  

  **Verdict**: GWT scores well on empirical tractability and integration but fails key tests (*Overflow*, *A/P Distinction*, *Unreportability*). Demotion Discipline forces it to confront ambiguities (e.g., "preconscious" as a catch-all). It thrives as a theory of *access* consciousness but stumbles on *phenomenal* richness.  

  This checklist exposes GWT’s trade-offs: it gains explanatory power for reportable states by sacrificing phenomenal depth — a defensible but incomplete stance. Your essay could argue its adequacy *only if* "consciousness" is defined as access (per Dennett), but this requires rigorous demotion discipline for outliers.
