answer: |-
  The reconstruction you propose—distinguishing between religion as "heritage" and religion as "assertion"—accurately captures the operational logic of French laïcité as practiced, though it reveals deep tensions in its underlying theory of neutrality. Let's assess its coherence, philosophical foundations, and implications.

  ### **1. Validity of the Heritage/Assertion Distinction**
  - **Yes, the pattern fits**: 
    - **Heritage Register**: State funding of Alsace-Moselle clergy, maintenance of pre-1905 religious buildings, and subsidies to religious schools (via "contracts" with the state) treat religion as *cultural patrimony*. Here, religion is akin to a historical artifact or linguistic tradition—a passive, inherited feature of French identity to be preserved by the state. This aligns with the logic of *"religion as culture"*.
    - **Assertion Register**: Banning religious symbols in schools frames visible religiosity as an *active claim* on public space, comparable to political speech. The state demands citizens shed particular identities to become "abstract" public actors, treating religious signs as disruptive assertions that compromise institutional neutrality.

  - **No Contradiction in Practice?**  
    Administratively, the state avoids perceiving a conflict because these registers operate in separate spheres: heritage management (backward-looking, cultural) vs. public order (forward-looking, civic). A cathedral is "furniture" (state-owned heritage), while a headscarf is a "proposition" (individual expression demanding recognition).

  ### **2. Coherence and Philosophical Foundations**
  - **Implicit Protestant Bias**:  
    The system presupposes religion as fundamentally *interior belief* (private, individual) rather than embodied practice. This enables the state to separate "neutral" public space from "private" faith while funding religious structures as inert culture. Critics rightly identify this as a Protestant-inflected view (rooted in Reformation theology), applied universally. A Sikh turban or Muslim hijab—intrinsically tied to embodied identity—becomes "assertion," while state-subsidized cathedrals are neutralized as "art."
    
  - **Rival Views Ruled Out**:  
    - **Symmetry of Funding**: Laïcité rejects symmetrical support for all religions (e.g., funding mosques like cathedrals). Heritage status is reserved for historically dominant groups (Catholicism, then Lutherans/Reformed/Jews in Alsace). Newer religions (Islam, Sikhism) lack "patrimonial" legitimacy.  
    - **Neutrality Toward Identity**: The model refuses to accommodate identity-based claims in public institutions (e.g., allowing hijabs as neutral expressions of self). Religion-as-assertion must be suppressed to preserve the "abstract" public sphere.  
    - **Communal Autonomy**: The state regulates religious practice (e.g., banning face coverings in public) while funding "heritage" religions, denying autonomy to minority communities.

  ### **3. Underdetermination vs. Incoherence**
  - **Philosophically Underdetermined?**  
    Yes—the *same policies* could serve opposite theories:  
    - **Anglo-American Multiculturalism** might fund religious schools or maintain churches as *active accommodations* of pluralism, not inert heritage. A hijab ban would contradict this logic.  
    - **French Laïcité** uses heritage funding to *domesticate* religion (e.g., Catholic schools under state contracts teach national curriculum) while banning symbols to enforce public homogeneity.  
    → The policies are compatible with divergent theories, but France’s *combination* reflects a distinct ideology: religion is tolerable only when depoliticized into culture or privatized.

  - **Incoherence in Practice**:  
    The system is **operationally stable but normatively inconsistent**. The heritage/assertion distinction collapses under scrutiny:  
    - Why is a state-paid priest in Alsace not an "assertion," but a headscarf is?  
    - Why is a cathedral "neutral" heritage but a mosque (often built post-1905) not?  
    → The distinction favors *old, majority religions* by defining their expressions as "culture" and minority expressions as "political."

  ### **4. Paths to Consistency**
  To resolve contradictions:  
  - **Extend Separation Universally**:  
    Abolish the Alsace concordat, end state funding for religious schools, and transfer pre-1905 buildings to religious associations (as the 1905 law intended). This aligns with "strict separation" but risks erasing religious heritage.  
  - **Extend Accommodation Universally**:  
    Fund all religions symmetrically (e.g., state salaries for imams) and permit religious symbols in schools. This rejects laïcité for multicultural pluralism.  
  - **Reform Heritage Criteria**:  
    Define "patrimony" inclusively (e.g., include post-1905 sites like mosques) and allow discrete religious symbols (e.g., headscarves) as non-assertive identity markers.  

  ### **5. Neutrality Assessment**
  - **Laïcité is Not Neutral Among Religions**:  
    It privileges Christianity (and Judaism in Alsace) as "heritage" while framing minority practices as "assertions" threatening neutrality. The heritage/assertion distinction is **structurally majoritarian**:  
    - Catholicism’s cultural dominance lets cathedrals be "neutral," while minority symbols are politicized.  
    - Islam faces a double bind: its buildings lack patrimonial status, and its symbols are banned as "assertions."  

  ### **Conclusion**
  Your hypothesis correctly identifies the dual registers of French laïcité—**heritage (religion as culture) and assertion (religion as politics)**. This framework is coherent as administrative logic but philosophically unstable, relying on a Protestant-leaning view of religion that disadvantages non-majoritarian faiths. While the system is *underdetermined* (similar policies exist elsewhere), its *specific combination* in France exposes a hierarchy favoring historical religions as "culture" and marginalizing newer ones as "threats." True neutrality would require either universal separation or symmetric accommodation—neither of which describes laïcité as practiced. The result is a system that is **formally neutral but substantively majoritarian**, betraying its claim to equal treatment of all religions.
