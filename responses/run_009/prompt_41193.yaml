answer: |-
  Here's a reconstruction of the implicit philosophical theories behind the major sex work regulation models, focusing on consent, agency, work, and the distinction between strict requirements versus compatible theories. I'll flag confidence levels and end with the verdict on the Nordic model.

  **Core Philosophical Concepts:**
  *   **Consent:** Whether entering into a sex work transaction can be truly voluntary given structural factors (poverty, coercion, trafficking, gender inequality).
  *   **Agency:** The capacity of sex workers to make choices and exert control over their work and lives, even within constrained circumstances.
  *   **Work:** Whether sex work constitutes legitimate labour deserving of workplace rights and protections, or inherently harmful activity to be minimised/eliminated.

  ---

  **1. The Nordic Model (Criminalise Purchase, Decriminalise Sale)**
  *   **Strict Philosophical Requirement:**
      *   **Unequal Power & Coercion:** The act of *purchasing* sexual access inherently exploits vulnerability and unequal power dynamics. True, freely given, equal consent in this specific transaction is impossible or exceptionally rare. The buyer is always the perpetrator of exploitation.
      *   **Seller as Victim:** The seller is *presumed* to be acting under conditions of structural vulnerability, coercion (economic or otherwise), or direct victimisation (trafficking). Their "choice" is not seen as a free expression of agency in a meaningful sense regarding *this specific transaction*.
      *   **Goal:** Abolition through deterring demand. Protecting (potential) victims by targeting the source of exploitation (buyers).
  *   **Compatible With (Underdetermined):**
      *   **Gradations of Coercion:** While presupposing pervasive vulnerability, it *can* accommodate (though rarely acknowledges) that some sellers may possess *more* agency than others (e.g., independent workers vs. trafficked persons). However, the model doesn't functionally distinguish based on this.
      *   **Harm Reduction (Limited):** Measures supporting exit programs are compatible, but *only* within the abolitionist goal. Harm reduction *for ongoing work* is not the focus.
      *   **Moral Opposition:** Moral condemnation of commercial sex, separate from (but overlapping with) the coercion argument.
  *   **The Practice Contradiction (Raids, Evictions, Deportation):**
      *   This exposes a tension between the *strict requirement* (seller as victim lacking meaningful consent/agency *in the transaction*) and the *operational reality* of state power.
      *   **Resolution Attempt:** Proponents argue these measures are "collateral damage" or unintended consequences necessary to target organised crime/trafficking rings exploiting sellers, ultimately *for* the sellers' protection/liberation. They aim at "profiteers" (pimps, traffickers, landlords knowingly enabling exploitation) but inevitably sweep up workers.
      *   **The Inconsistency:** The practice treats the seller as an *accountable actor within the illegal framework* (their presence/activity justifies state intervention affecting *them* directly: loss of home, deportation) or as a *nuisance/victim to be "rescued"* against their will, while the core theory strictly defines them as a victim *of the buyer's act* who should not be punished. The model presupposes *transactional* non-consent/victimhood but enables state practices that disregard the seller's *situational* agency regarding their housing, migration status, or choice to work, treating them as responsible *for being in the situation* that makes them a victim. It conflates victimhood with lack of all agency in dealings with the state.
  *   **Confidence:** High on the strict requirement (unequal power, buyer as perpetrator, seller as victim). Moderate on compatibility with gradations of coercion. **Least Confident Claim:** That the model *can* be implemented without state practices that effectively punish or severely harm the very victims it purports to protect, given its focus on disrupting the *environment* of sex work. The treatment of migrant sellers under deportation is particularly difficult to square with pure victimhood.

  **2. German/Dutch Model (Regulated Legalisation/Licensing)**
  *   **Strict Philosophical Requirement:**
      *   **Harm Management:** Sex work is recognised as a persistent social reality involving significant potential harms (exploitation, trafficking, violence, disease). The primary goal is to *manage and reduce these harms* through state regulation, oversight, and control.
      *   **Distinction Legitimate/Illegitimate:** The law presupposes a distinction can be made between "voluntary" sex work (which can be regulated) and trafficking/coercion (which remains illegal and targeted). It requires the *possibility* of consent/agency in *some* sex work transactions.
  *   **Compatible With (Underdetermined):**
      *   **Sex Work as Labour (Ambiguous):** While creating a legal framework resembling labour (licenses, business premises, health checks), the primary driver is harm reduction, not affirming labour rights per se. Regulation often focuses on public order and health, not core workers' rights (unionisation, collective bargaining are often absent or weak). It *facilitates* treating it as labour for *some* but doesn't strictly *require* viewing it as legitimate work equal to others.
      *   **Limited Agency:** Assumes sellers possess *enough* agency to comply with regulations and operate within the legal framework, but doesn't necessarily presuppose full, unconstrained autonomy. Vulnerability is acknowledged and managed (e.g., mandatory counselling).
      *   **Pragmatism/Paternalism:** A pragmatic acceptance that abolition is unrealistic, coupled with a paternalistic desire to control the industry for societal benefit (public health, order, reducing visible street work).
  *   **Confidence:** High on harm management as the core driver. High on the requirement of distinguishing legal/illegal based on coercion. **Least Confident Claim:** The extent to which the model genuinely presupposes or facilitates sex work *as labour* with full rights, versus creating a highly regulated zone for a tolerated but still-stigmatised activity. The focus remains overwhelmingly on control and harm mitigation, not empowerment.

  **3. New Zealand Model (Full Decriminalisation)**
  *   **Strict Philosophical Requirement:**
      *   **Sex Work as Labour:** The sale of sexual services is recognised as a form of work. This is the foundational premise enabling the application of standard employment law, health and safety regulations, and contract law.
      *   **Agency & Capacity to Consent:** Adult sex workers are presumed to possess the agency to consent to their work and negotiate the terms of that work, like workers in other sectors. This presupposes that meaningful consent *is* possible within sex work transactions.
      *   **Harm Reduction via Rights:** The most effective way to reduce harm (violence, exploitation, disease, stigma) is to empower workers through rights, legal protections, and safe working conditions, enabling them to report crimes and abuses without fear of prosecution.
  *   **Compatible With (Underdetermined):**
      *   **Gradations of Choice/Agency:** Acknowledges that workers enter the industry under varying circumstances (economic need, preference, coercion) like other sectors (e.g., mining, cleaning). It addresses coercion through general criminal law (against trafficking, assault, exploitation) and labour law protections, not by invalidating the entire sector's legitimacy.
      *   **Harm Management:** While harm reduction is a key *outcome*, it's achieved *through* the lens of labour rights and agency, not as the primary, separate goal driving a regulatory framework distinct from other work.
      *   **Moral Neutrality/Pragmatism:** The law itself adopts a morally neutral stance ("it's work"), compatible with both pragmatic acceptance and positive affirmation of sex workers' rights.
  *   **Confidence:** High on the requirement of recognising sex work as labour and workers as possessing agency/capacity to consent. High on the mechanism of harm reduction via rights. **Least Confident Claim:** Whether the model *strictly requires* the belief that *all* sex work is *inherently* free from unique moral objections or distinct forms of harm compared to other work, or simply that the *legal framework* must treat it as work regardless of such objections. It doesn't require moral endorsement, just legal equivalence.

  **Verdict on the Nordic Model's Presuppositions:**
  The Nordic model's **strict philosophical requirement** (that the seller is a victim lacking meaningful consent in the transaction, while the buyer is the perpetrator) is **inconsistent** with the **necessary practical consequences** of enforcing the model (police raids on sellers' workplaces, pressure leading to their eviction, deportation of migrant sellers). These enforcement mechanisms inherently treat the seller as an accountable actor (responsible for being present in an illegal activity environment, a "nuisance," or an illegal migrant) or an object of paternalistic "rescue," actively undermining the core presupposition of their pure victimhood and lack of transactional agency. The model's theory cannot coherently account for why state power justifiably inflicts significant harms *on the presumed victim* as a direct consequence of targeting the *context* of their victimisation.

  **Verdict: inconsistent**
