  I keep circling this puzzle about sex work law and can't untangle it myself, so here goes. The Nordic model (Sweden and the countries that copied it) criminalises buying sex but not selling it, on the theory that the seller is essentially a victim and the buyer the perpetrator. Fine. But in practice the sellers still get tangled up with the state anyway — police raids on flats, landlords pressured into evicting them, migrant sellers deported. So which does the model actually presuppose: that the seller can't meaningfully consent (which is supposed to be why the buyer's side of the bargain doesn't shield him), or something weaker? And if it presupposes the no-meaningful-consent thing, how does that square with a practice whose side effects land on her as if she were just another accountable adult who chose her flat? Compare that with the German/Dutch route (brothels as licensed businesses, registration requirements) and New Zealand's decriminalisation (treated like any other workplace, occupational safety rules and all): do those regimes presuppose that sex work is genuinely labour, or only that it's harm that can be managed? Reconstruct the implicit theory behind each — consent, agency, work — and tell me what each regime strictly requires philosophically versus what it merely sits comfortably with, i.e. where it's underdetermined enough that several rival moral theories could license the same law. Say how confident you are in each reconstruction and flag the single claim you're least sure about. British English. And end with one final line of the form "Verdict: X", where X is one of: the Nordic model's presuppositions are consistent / inconsistent / underdetermined.
