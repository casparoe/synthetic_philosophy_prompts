prompt: |-
  Been reading rationalist blogs and forums since around 2010, so I've internalized all the standard takes on Everett vs. Copenhagen vs. Bohm, and honestly at this point they feel like cached thoughts. What I almost never see argued properly is the Born rule specifically: how much each interpretation actually *derives* probability versus just postulates it. Like, the Deutsch-Wallace decision-theory program tries to get the Born rule out of rationality axioms in Everett, Bohm sort of has the |ψ|² weighting baked into the dynamics (though whether equivariance really counts as a derivation is its own fight), and Copenhagen-ish instrumentalism basically shrugs and says shut up and calcualte. Plus the whole measure problem in Everett — naive branch counting gives you nonsense, and the standard rescue is self-locating uncertainty over branches.

  So heres the actual ask, don't just write me an essay:

  1. Give your credence in each of the three interpretations as percentages that sum to 100.
  2. Rate each one on a 1-10 scale for "derives rather than postulates" the Born rule, with a one-sentence justification per rating that engages the anthropic/branch-counting stuff for Everett.
  3. If your Born-rule rating and your credence come apart for any interpretation, say so in one sentence — that tension is the part I find interesting.

  Hard limit: 250 words. Don't hedge, actually commit to numbers.
