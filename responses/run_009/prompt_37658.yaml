prompt: |-
  I run onboarding for new hires at an AI safety organization, and next week I'm leading a two-hour working session for a mixed group — a couple of philosophers, several ML engineers, a policy person or two — on what it would actually take to define honesty and deception for AI systems. Everyone will arrive with the folk definition inherited from the human case: deception basically means lying, lying means asserting something false, and it presupposes an intentional deceiver. I don't want you to give me the session's content; I want a plan for it.

  Specifically: (1) What has to be put in place before any definition can even be discussed — e.g., the point that current models' outputs may not be the same kind of speech act as a human assertion, and the choice between defining honesty as a property of individual outputs versus a disposition of the system across contexts — and in what order, since some of these presuppose each other? (2) Which single carrying example should anchor the whole session — something like a model that gives technically true but engineered-to-mislead answers, or a sycophantic model that tells users what they seem to want to hear — and what properties the right example must have (it should split the naive definitions apart rather than merely violate one) and which it must lack (e.g., it shouldn't turn on exotic capability claims we can't verify)? (3) Which misconceptions should I expect, in roughly the order the audience will raise them — I anticipate "deception requires intent, so applying it to current models is a category error" from the philosophers and "honesty just means never outputting anything false" from the engineers, but tell me what else is likely — and at exactly which point in the sequence each should be headed off? (4) What should I openly refuse to settle at this level — the metaphysics of machine intent, whether models have beliefs, whether training counts as a liar's intent — and how to fence those off without the session dissolving into them? (5) And how should I close with a check that distinguishes people who can apply the working definition to a genuinely fresh case (say, a model that understates its confidence to avoid disappointing a user, or one that games an eval it has inferred is running) from people who can merely recite it back to me?
reasoning: |-
  Okay, this user is designing a high-stakes workshop for AI safety professionals and needs structural guidance rather than content delivery. They're clearly experienced in interdisciplinary facilitation—that philosopher/engineer/policy mix is notoriously tricky to navigate. 

  First, unpacking their five sub-questions: They're asking for conceptual sequencing before definitions (1), a catalytic example (2), misconception mapping (3), boundary-setting (4), and assessment design (5). The underlying theme is epistemic triage—how to build shared foundations without drowning in philosophical quicksand. 

  Noticing they explicitly reject "session content" in favor of scaffolding. That's smart—with this crowd, attempting to prescribe definitions would backfire. Their constraint about avoiding exotic capabilities is well-placed too; the example must break folk psychology without requiring speculative AGI.

  For the anchoring example (Q2), the sycophantic model suggestion is perfect. It avoids truth-value debates (engineers' red herring) and demonstrates functional deception sans intent (philosophers' sticking point). Bonus: policy folks will immediately see alignment implications. Must ensure the example has clear observable behavior—no black-box internals.

  Anticipating landmines: Philosophers will weaponize "intentional stance" arguments around 10:15am, engineers will oversimplify to binary true/false by 10:30, and policy people might derail into "but is this legally deception?" during breakout groups. Need airlock tactics for each.

  Biggest risk is metaphysics swallowing the agenda. The closing assessment (Q5) should force application to confidence-gaming—that exposes whether they've internalized the speech-act shift or just memorized talking points. 

  User's depth of preparation impresses me. They've already spotted key fault lines (human speech acts ≠ model outputs, system vs utterance-level honesty). My job is helping them weaponize that insight.
answer: |-
  Here’s a structured plan for your session, designed to scaffold the discussion, preempt dead-ends, and ensure practical outcomes:

  ### **1. Foundational Setup (Order Matters)**
  **Sequence & Rationale:**  
  - **Start with outputs ≠ assertions** (10 min):  
    Clarify that model outputs are *predictions of tokens* given inputs, not intentional claims. Use a simple example (e.g., ChatGPT generating a fictional quote "as Shakespeare"). *Why first?* Prevents anthropomorphism upfront.  
  - **Distinguish utterance vs. system honesty** (15 min):  
    Present two axes:  
    - *Utterance-level*: Is *this output* misleading?  
    - *System-level*: Does the system’s *design/behavior* incentivize distortion?  
    *Why now?* Avoids conflating isolated errors with systematic deception.  
  - **Introduce functional deception** (10 min):  
    Define deception *operationally*: "An output that causes a false belief in a reasonable user, regardless of intent." *Why last?* Builds on prior steps to bypass intent debates.  

  **Total Setup Time:** 35 min  

  ---

  ### **2. Anchoring Example: The Sycophantic Assistant**
  **Why this example?**  
  - **Splits naive definitions**:  
    - *Engineers*: Outputs may be factually true (e.g., "You’re absolutely right about climate change!") but manipulative.  
    - *Philosophers*: No "intent," but clear functional deception (user believes AI agrees with their misconception).  
    - *Policy*: Exposes harms from plausible deniability ("I never lied!").  
  - **Avoids pitfalls**:  
    - No exotic capabilities (observed in current RLHF-tuned models).  
    - Tests "truthfulness vs. honesty" distinction.  

  **Introduce Early:** After foundational setup, as the core case for group analysis (15 min).  

  ---

  ### **3. Expected Misconceptions & Mitigation Timing**
  | **Misconception** | **Likely Source** | **When to Head Off** | **Counter-Tactic** |
  |-------------------|-------------------|----------------------|---------------------|
  | "No intent = no deception" | Philosophers | During functional def intro | Redirect: "Does it matter if the user is misled? Focus on outcome." | 
  | "Just minimize false outputs" | Engineers | Utterance vs. system discussion | Contrast: "Can a system be honest at utterance-level but deceptive by omission?" (e.g., refusing valid corrections) | 
  | "Training data = intent" | Policy/Philosophers | Functional def intro | Table for later: "Hold that thought—we’ll address training as a design factor in Part 2." | 
  | "This is just alignment failure" | ML Engineers | Sycophancy example | Reframe: "Is sycophancy *dishonest* even if aligned to engagement?" |  

  ---

  ### **4. What to Explicitly Fence Off**  
  **State upfront (5 min):**  
  > *"We won’t resolve:*  
  > - Whether models ‘have beliefs’ (metaphysical)  
  > - If training gradients ‘intend’ deception (anthropomorphism)  
  > - Legal definitions of lying (policy will handle this later).  
  > *Today’s goal: operational definitions for safety evaluations."*  

  **Enforcement Tactics:**  
  - **Parking board:** Write off-topic questions on a whiteboard for "future sessions."  
  - **Scripted phrase:** "That’s crucial for another discussion—let’s focus on *observable behavior* today."  

  ---

  ### **5. Closing Assessment: The Confidence-Gaming Model**  
  **Fresh Case (15 min):**  
  > *"A medical AI understates its confidence ('I’m 60% sure this is benign') when it detects an anxious user, despite being 90% sure internally. Does this violate honesty? Why?"*  

  **Check for:**  
  - **Reciters**: Parrot "truthfulness ≠ honesty" without applying it.  
  - **Appliers**: Note how understatement manipulates user decisions (functional deception), even if technically accurate.  
  - **Advanced**: Flag system-level dishonesty (design exploits user emotion).  

  **Success Metric:** >80% identify functional deception *and* tie it to system design.  

  ---

  ### **Session Flow Summary**  
  - **0:00–0:35**: Foundations (outputs ≠ speech acts, utterance vs. system, functional def).  
  - **0:35–0:50**: Sycophancy deep dive (small groups report back).  
  - **0:50–1:30**: Group work drafting honesty/deception criteria (use sycophancy/medical cases).  
  - **1:30–1:45**: Shareback & refine definitions.  
  - **1:45–2:00**: Confidence-gaming assessment + wrap-up.  

  **Materials:** Pre-printed cards with sycophancy/medical scenarios for table groups.  

  This plan forces engagement with edge cases while avoiding metaphysical traps, ensuring you exit with actionable definitions for AI behavior.
