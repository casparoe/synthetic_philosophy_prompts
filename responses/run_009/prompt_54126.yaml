  ## Draft Commission Opinion: Reimagining the Hollis Legacy through Nietzsche's Lens

  **To:** Members of the Monuments Review Commission  
  **From:** [Your Name], Commissioner  
  **Date:** October 26, 2023  
  **Subject:** Recommendation for the Warren Hollis Statue in Hollis Park: Embracing Critical History for a Living Community  

  Over the past weeks, we have grappled with the complex legacy of Dr. Warren Hollis, guided significantly by the insightful framework of Nietzsche's *On the Uses and Disadvantages of History for Life*. This lens – distinguishing **Monumental**, **Antiquarian**, and **Critical** history – has proven invaluable in moving beyond simple binaries. Applying it rigorously to our specific context leads me to recommend a single, concrete course of action: **Relocate the statue to the County Historical Museum for contextual interpretation, rename Hollis Park, and install a substantial counter-monument plaque within the park itself.**

  ### Reasoning Structured by Nietzsche's Modes

  1.  **Monumental History: The Past as Inspiration, Now Fractured**
      *   *The Work it Did:* The Hollis statue served quintessential monumental history. For ninety years, it stood as a singular symbol of civic triumph – the defeat of typhoid, the creation of clean water, the embodiment of scientific progress and public health heroism. It aimed to inspire current and future generations by presenting Hollis as a model of achievement and civic virtue.
      *   *The Present Problem:* The newly uncovered 1908 records shatter this monolithic narrative. Hollis's actions during the smallpox quarantine – the armed confinement and denial of care leading to preventable deaths within a specific immigrant community – fundamentally undermine his status as an *uncomplicated* inspirational figure. The monument now actively suppresses a crucial, painful aspect of our history directly tied to the park's location and its present-day community. Its continued presence *as a monument* in this space glorifies a legacy that includes significant injustice, negating its ability to function purely inspirationally for the entire community.

  2.  **Antiquarian History: Preservation for its Own Sake, Insufficient Here**
      *   *The Argument:* This view urges us to preserve the statue solely because it *is* old, because it's a work by a locally significant sculptor, and because it represents a layer of the city's physical past. It asks us to accept it as a relic, divorced from evolving moral judgments ("don't judge the past by today's standards").
      *   *Why it Fails in this Context:* Pure antiquarianism ignores the *living* impact of history. The statue isn't an inert artifact in a vacuum; it occupies the *only* greenspace of a neighborhood housing descendants of the very community harmed by Hollis's documented actions. Preserving it *in situ* as an antiquarian object ignores the ongoing symbolic violence its presence inflicts and prioritizes the aesthetic/historical value of the *object* over the lived experience and historical memory of the *people* who use the park. The "don't judge" argument becomes an abdication of our responsibility to understand the *consequences* of past actions, especially when those consequences resonate so directly in the present space.

  3.  **Critical History: The Necessary Stance for an Honest & Living Future**
      *   *The Imperative:* Critical history demands we actively interrogate the past, break down harmful narratives, and use this understanding to shape a better present and future. It is *not* about feeling superior to the dead; it is about honestly confronting the complexities and injustices embedded in our history to liberate ourselves from their uncritical perpetuation.
      *   *Why it Applies Forcefully Here:** The documented evidence of Hollis's actions during the 1908 quarantine requires this critical stance. Ignoring it perpetuates a false and exclusionary history. Maintaining the statue in its current position and form actively suppresses this critical knowledge, especially in the space most relevant to it. Critical history isn't about erasing Hollis's contributions to public health infrastructure; it is about refusing to let those contributions *obscure* or *excuse* grave injustice committed under his authority. Honesty demands acknowledging the *whole* legacy.

  ### The Recommended Course of Action: Critical History in Practice

  Therefore, I propose:

  1.  **Relocate the Statue:** Remove the statue from Hollis Park and transfer it to the County Historical Museum.
      *   *Implementation:* Coordinate with the Museum for acceptance and transport. (Timeline: Initiate within 1 month of vote, complete within 3 months).
      *   *Condition:* Relocation is contingent on the Museum committing to **robust contextual interpretation**. This *must* include:
          *   Hollis's public health achievements (typhoid, water system).
          *   The full details of the 1908 smallpox quarantine policy under his leadership, including the armed confinement, denial of transfer, and deaths.
          *   Analysis of the social context (anti-immigrant sentiment, class disparities in healthcare).
          *   The statue's own history – why it was erected in 1931, the sculptor's significance, and the evolution of its meaning.
          *   Connection to the park and the riverfront community's experience. (Museum to draft plan within 2 months of acceptance; Commission to review for adequacy).

  2.  **Rename Hollis Park:** Initiate the official process to rename the park.
      *   *Implementation:* Commission forms a small working group (including commissioners, historians, and *meaningful representation from the riverfront descendant community and current park users*) to propose new names. (Timeline: Proposals within 2 months, Council vote following standard renaming procedures). The new name should reflect the park's function as community greenspace and/or acknowledge its complex history, *not* glorify an individual with a deeply tarnished local legacy.

  3.  **Install a Substantial Counter-Monument Plaque in the Park:** Commission and install a permanent, highly visible interpretive plaque or marker within the park at or near the former statue's location.
      *   *Implementation:* Commission a historian (potentially the one who uncovered the records) to draft text, reviewed by the working group above and the full Commission. (Timeline: Draft within 1 month of vote, final approval within 2 months, installation within 4 months).
      *   *Content:* This plaque must:
          *   Acknowledge the park's former name and statue.
          *   Summarize Hollis's achievements *and* his role in the 1908 injustice with equal factual weight.
          *   Name the eleven known victims and acknowledge others who suffered.
          *   Explain the significance of the park to the affected community then and now.
          *   State clearly why the statue was moved and the park renamed – as an act of historical honesty and community respect.

  ### Addressing the Strongest Counter-Argument: Preservation as Duty

  The most compelling argument *against* this recommendation, particularly from the "leave it alone" faction, is the **antiquarian** concern: that removing or relocating the statue erases a tangible piece of our history and devalues the artistic merit and age of the object itself. They argue that context can be added *in place* and that moving it risks losing the physical connection to the specific site.

  **A Fair Shake:** This perspective rightly emphasizes the importance of preserving physical artifacts and their connection to place. The sculptor's local significance and the statue's longevity *are* historical facts worthy of consideration. Adding context *in situ* is a theoretically valid approach often used elsewhere.

  **Why it Doesn't Prevail:** However, in this *specific* case, the weight of the **critical historical** imperative and the **monumental** harm outweigh pure antiquarian preservation. Adding a plaque next to a towering, heroic bronze figure of Hollis in the park central to the injustice is insufficient. It cannot overcome the inherent glorification of the statue's form and placement. It forces reconciliation onto a traumatized space. Relocation to the museum *preserves* the artifact for study and contextual presentation (satisfying antiquarian concerns) while liberating the vital community space from its oppressive symbolic presence. The physical connection to the *site of injustice* is precisely why relocation is necessary for healing – the counter-plaque establishes a new, honest connection to that history.

  ### Conclusion: A Path Forward Grounded in Honesty

  Nietzsche reminds us that history must serve life. Leaving the Hollis statue untouched in Hollis Park serves neither historical honesty nor the life of the community that gathers there now. Pure antiquarian preservation ignores the harm. Maintaining the monumental narrative is untenable. Only critical history provides a path forward.

  Relocating the statue to the museum with rigorous interpretation preserves the artifact for study and allows a full exploration of Hollis's complex legacy. Renaming the park liberates the space from its association with injustice. Installing a counter-plaque ensures the *true* history of that place – the achievements *and* the failures, the victims alongside the powerful – is permanently embedded in the community's heart. This approach respects the past by confronting it honestly, serves the present by acknowledging community pain, and builds a more inclusive future for our shared public space. I urge my fellow commissioners to support this recommendation.
