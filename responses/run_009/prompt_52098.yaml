  Hmm, this is a deep political philosophy question about the contradictions in voting norms. The user is clearly well-versed in social choice theory - they're referencing Gibbard-Satterthwaite theorem and making sophisticated observations about the tension between electoral sincerity norms and legislative pragmatism. 

  Let me unpack the core paradox they're highlighting: why do we morally condemn tactical voting by citizens while praising tactical voting by legislators? And how does this square with the mathematical certainty of manipulability? The user wants me to reconstruct the implicit theory behind these practices.

  First, I need to tackle the ballot-as-testimony concept. The sincerity norm absolutely treats voting as preference reporting rather than strategic action. But Gibbard-Satterthwaite makes this incoherent - truth-telling can't be everyone's dominant strategy. So the practice must be relying on something else, like coordination problems preventing widespread manipulation. 

  The legislative contrast is fascinating. When legislators vote tactically, we call it statesmanship. This suggests we view legislative votes as tools rather than expressions. Key differences: legislatures have repeated interactions, public votes, and explicit principal-agent relationships. These structural factors make the double standard somewhat defensible - but still reveal deep ambiguity about what votes fundamentally are.

  The user's final question about changing the expressive view is particularly sharp. If we fully embraced strategic voting, we'd likely see more Approval Voting (where "sincerity" is undefined) or perhaps STV. But I suspect the expressive view does crucial work in maintaining legitimacy - people need to feel their vote "matters" beyond just influencing outcomes.

  Throughout this, I should distinguish what the practice strictly requires (ballot secrecy makes sincerity unenforceable) versus what it assumes (that manipulation won't become systemic). And acknowledge the underdetermination - both expressive and instrumental theories can justify current rules, which is why the contradiction persists.

  The user seems to be probing whether our voting institutions are philosophically coherent. My answer will suggest they're not - but that this might be inevitable and even functional. The tension between the ideal of authentic expression and the reality of strategic imperatives runs too deep to resolve neatly.
answer: |-
  Your inquiry exposes a profound tension at the heart of democratic practice—a tension between expressive ideals and strategic realities. Let's reconstruct the implicit theory of voting embedded in these norms and assess its coherence, asymmetry, and possible futures.

  ### The Implicit Theory: Ballot as Expressive Testimony, Not Strategic Action
  The sincerity norm presupposes that:
  1.  **The ballot is a report/testimony:** It treats the vote as a *declaration* of inner preference or judgment, akin to sworn testimony. Its value derives from truthful revelation ("this is who I truly support").
  2.  **The voter is a truth-teller, not a strategist:** The "upstanding citizen" is conceived as fulfilling a civic duty by revealing their authentic state of mind. Strategic calculation is seen as corrupting this duty, akin to perjury.
  3.  **The system aggregates truth:** The voting mechanism is implicitly trusted to translate these sincere reports into a legitimate collective decision. Dishonesty (tactical voting) pollutes this input.

  **Coherence Problems:**
  *   **Gibbard-Satterthwaite (G-S) as Existential Threat:** G-S proves this presupposition is *structurally incoherent*. No non-dictatorial voting rule can guarantee that sincere voting is always in every voter's best interest. The system *itself* guarantees incentives for misreporting in some situations. The norm demands an impossibility.
  *   **The "Rarity Assumption" as Practical Salvage:** The norm likely survives only because it tacitly assumes that:
      *   *Coordination is hard:* Voters lack the knowledge (exact preferences of others, pivotal probabilities) to reliably identify manipulation opportunities.
      *   *Manipulation is risky:* Misjudging the situation can backfire (e.g., causing a worse outcome).
      *   *Sincerity is a Schelling Point:* In the absence of coordination, sincerity is a simple, focal default rule.
      *   *Consequences are diffuse:* The harm of one's own tactical vote is usually negligible and invisible.
      **This assumption about *rarity* (not the duty itself) is what the practice *needs* to function tolerably despite G-S.** If manipulation became widespread and predictable, the system's legitimacy would collapse.

  *   **Secrecy & Conscience:** The secrecy of the ballot is crucial to this fragile norm. It:
      *   Prevents enforcement or social shaming, making the norm purely internalized (reliant on individual conscience).
      *   Paradoxically *protects* the norm by shielding the (likely common) instances of minor tactical voting from public view and condemnation, preventing a breakdown of the shared fiction of widespread sincerity. It allows the *appearance* of sincerity to be maintained.

  ### The Legislative Asymmetry: Why Tactics are "Statesmanship"
  The stark contrast with legislative voting is defensible *only* on functional, not expressive, grounds:
  1.  **Principal-Agent Relationship:** Legislators are explicitly agents acting on behalf of constituents (principals). Their vote is not a *personal testimony* but a *delegated action*. Strategic compromise ("logrolling," vote trading, supporting a disliked bill for a greater good) is understood as part of fulfilling their representative *function*—getting the best achievable outcome for their constituents or advancing broader policy goals within a complex system.
  2.  **Repetition & Iteration:** Legislatures are repeated games. Building trust, reputation, and the ability to make credible commitments (including compromises) is essential for long-term effectiveness. A single "sincere" protest vote that achieves nothing is often seen as ineffective grandstanding.
  3.  **Public Scrutiny & Accountability:** Legislative votes are public. Agents must justify their strategic actions to principals. This forces a *consequentialist* justification ("I voted for X to secure Y") rather than an expressive one ("X is my true preference").
  4.  **Complex Collective Action:** Passing legislation inherently requires building coalitions across diverse preferences, a process that demands strategic negotiation and compromise far exceeding the single-shot aggregation of citizen preferences.

  **Coherence of Practices?** This reveals a fundamental inconsistency in what "a vote" *is*:
  *   **Citizen Ballot:** Presupposed to be an *expressive act* (testimony of preference/judgment).
  *   **Legislative Vote:** Understood as an *instrumental act* (a tool to achieve outcomes within a bargaining process).
  The practices *do* presuppose inconsistent things. The citizen norm clings to an expressive ideal mathematically proven impossible to fully satisfy, while the legislative norm pragmatically embraces the strategic reality inherent in any non-trivial aggregation of preferences.

  ### Replacing the Expressive View: Consequences of a Strategic Takeover
  Abandoning the expressive view entirely for a game-theoretic conception would necessitate significant changes:

  1.  **Voting Rules:** Systems that *embrace* or are *robust* to strategy would gain favor:
      *   **Approval Voting (AV):** Explicitly invites strategic expression ("Who is acceptable?"). "Sincerity" lacks a clear, normatively privileged definition. AV openly acknowledges the vote as a strategic tool to influence outcomes.
      *   **Ranked Choice Voting (RCV/STV):** While manipulable (G-S applies), it mitigates "wasted vote" fears and allows more nuanced expression, reducing the *need* for drastic strategy compared to plurality. Strategy becomes more about ranking order than desertion.
      *   **Methods Seeking Strategy-Proofness:** Exploration of rules less vulnerable to manipulation (e.g., certain randomized mechanisms, though often impractical) or rules where strategic voting is complex and risky.

  2.  **Normative Rhetoric:**
      *   **Abandon Sincerity:** The moralistic language condemning "dishonesty" would fade. Civic education would focus on *effective* voting given the rules and likely behavior of others, akin to teaching negotiation tactics.
      *   **Embrace Transparency:** There might be calls for tools (polls, models) to help voters identify pivotal situations and vote strategically *effectively* (raising coordination risks).
      *   **Shift Justification:** Legitimacy would derive purely from procedural fairness and outcome quality, not the "purity" of inputs.

  3.  **The Indispensable Work of the Expressive View:** Abandoning it would likely incur costs:
      *   **Legitimacy Erosion:** Many citizens derive satisfaction from expressing their "true" preference, even if their candidate loses. Purely strategic voting feels cynical and reduces voting to a cold calculation, potentially depressing turnout or engagement among those who value expression.
      *   **Coordination Chaos:** If all voters actively tried to game the system based on imperfect information, outcomes could become highly volatile and unpredictable, potentially *less* reflective of underlying preferences than under a norm-constrained (though imperfectly sincere) system.
      *   **Moral Anchor Lost:** The expressive norm, however imperfectly followed, provides a shared ideal of civic virtue. Its removal leaves a vacuum potentially filled by more overtly self-interested or even destructive forms of strategy.

  **Likely Path:** A messy transition. We might see:
  *   **Rule Changes:** Adoption of AV or RCV, acknowledging strategy.
  *   **Rhetorical Shift:** Weakening of the "dishonesty" charge against tactics, replaced by pragmatic advice ("vote smart").
  *   **Persistent Tension:** The expressive ideal is deeply ingrained; abandoning it entirely would be culturally jarring. We'd likely see a *de facto* hybrid: a weakened sincerity norm persisting as a default for low-information voters or non-pivotal situations, while sophisticated voters (or campaigns guiding them) embrace strategy where beneficial.

  ### Underdetermination and What the Practice Presupposes
  *   **Strictly Presupposed:** The practice *requires* ballot secrecy and *presupposes* that widespread, coordinated manipulation is prohibitively difficult. It *does not* strictly presuppose the expressive view is coherent or achievable; it merely relies on its *psychological grip* and the *rarity assumption* to function.
  *   **Fits Well With:** The expressive view provides the most straightforward moral justification for the sincerity norm and resonates with individual voter psychology. Consequentialist views struggle to explain why secrecy is essential or why the norm exists at all for citizens but not legislators.
  *   **Philosophically Underdetermined:** The *existing rules* (like plurality voting) are compatible with multiple theories:
      *   **Expressive:** Vote as testimony (the dominant norm).
      *   **Minimally Consequentialist:** Vote to increase the chance your preferred candidate wins, within the constraints of the secrecy norm and coordination difficulties (explains *some* tactical voting).
      *   **Duty-Based:** Voting as fulfilling a civic obligation, where the act itself matters more than the specific mark (sincerity becomes a secondary duty).
      The *asymmetry* between citizen and legislative voting, however, is best explained by the explicit shift from an expressive to an instrumental concept of the vote, driven by the functional demands of representation and bargaining in the legislature. This inconsistency highlights that our practices are not built on a single, coherent theory of voting, but are a pragmatic (and somewhat philosophically messy) adaptation to different institutional contexts and constraints.
