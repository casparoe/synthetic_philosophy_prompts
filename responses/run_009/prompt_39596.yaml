prompt: |-
  My flatmate (economics PhD, insufferable about it) has been on my case about this decision theory problem and I can't find the hole in his argument. The setup is a version of the absent-minded driver: you're driving home on a highway with two identical intersections, and because you're absent-minded you can't tell which one you're at when you reach one — no odometer, no landmarks, nothing. At each intersection you can exit or continue. Payoffs: exiting at the first intersection gets you 1 (a motel), exiting at the second gets you 4 (home), and continuing past both gets you 0 (you end up lost in the bad part of town). So always exiting is worth 1, always continuing is worth 0.

  Here's his argument. (1) Ex ante, the best plan is: at each intersection, continue with probability 3/8. That's worth 25/16 ≈ 1.56, which beats both pure plans, so planning-optimal rationality endorses this specific randomization. (2) A rational agent follows the optimal plan unless, at the moment of action, something is better than what the plan says to do. (3) Suppose you're at an intersection and you know you're implementing the 3/8 plan. You reach the first intersection with probability 1 and the second with probability 3/8, so conditional on being at an intersection at all, it's 8/11 the first one and 3/11 the second. (4) Exiting now is worth (8/11)(1) + (3/11)(4) = 20/11; continuing now is worth (8/11)[(5/8)(4)] = 20/11. You're exactly indifferent. (5) So at the point of action the plan's randomization does no rational work — you have no reason to continue rather than exit. (6) An agent with no reason to follow a plan's instruction at the point of action can permissibly do anything, including resolving right now to always exit. (7) But always exiting is worth 1 ex ante, which is worse than 1.56, so the "optimal" plan is self-undermining: adopt it, and it rationally permits behavior that defeats it. (8) The same goes for any mixed plan in any problem, so randomization is never really rationally binding and ex ante plan-optimality can't be the standard of rational action. He loves this conclusion because he thinks it shows planning is basically a scam.

  Ive checked the arithmatic and it's all correct as far as I can tell (the 20/11 = 20/11 indifference is real and kind of eerie). My instinct is the sleight of hand is somewhere in (5)-(7), because (6) smells like it conflates "this plan leaves me indifferent between today's options" with "no plan does better for me from where I stand" — and also because if he resolves to always exit, his absent-mindedness means that resolution is in effect at the other intersection too, so he hasn't just picked today's action, he's swapped the whole policy, and the 20/11 comparison quietly stops applying. But every time I say something like this he asks me exactly what information or influence I have at the intersection that makes the swap irrational, and I stall. And I do want to keep (1) — planning has to be able to recommend randomization, otherwise matching pennies and min-max bluffing are inexplicable. Where exactly does his argument go wrong, and what does rejecting that step cost? Give me exactly five numbered points, each one or two sentences, with no introduction or conclusion.
reasoning: |-
  We are given a decision theory problem and a flatmate's argument that randomization is not rationally binding. The argument concludes that the ex ante optimal mixed plan (continue with prob 3/8) is self-undermining because at the moment of choice the agent is indifferent and could permissibly deviate to a pure strategy (always exit) which is ex ante worse. We must find the flaw. Here are five numbered points:

  1. The argument in step (6) incorrectly assumes that indifference at the point of action implies that the agent can permissibly adopt any action without affecting future behavior. However, due to absent-mindedness, the agent cannot condition on the current intersection, so a deviation (like exiting now) must be taken at both intersections, leading to the pure strategy of always exiting.

  2. Step (5) and (6) conflate the permissibility of a single action with the permissibility of changing the entire plan. The agent, being unable to distinguish intersections, must commit to the same action at both. Thus, the agent does not have the option to change only the current action without also changing the action at the other intersection.

  3. The calculation of indifference (20/11 = 20/11) is conditional on being at an intersection and following the 3/8 plan. If the agent deviates to always exit, they are no longer following the 3/8 plan, and the conditional probabilities (8/11 and 3/11) are no longer valid because they were derived under the assumption of the 3/8 plan.

  4. Step (7) claims that adopting the optimal plan permits behavior that defeats it, but the plan is defined as a strategy (a rule for both intersections). The agent cannot unilaterally change the plan at one intersection without affecting the other. Therefore, the only rational way to deviate is to change the entire plan, which would require recalculating the ex ante expected payoff.

  5. The argument fails to account for the requirement of consistent planning: the agent must choose a strategy (a function from information sets to actions) that is optimal ex ante. The mixed strategy of continuing with probability 3/8 is ex ante optimal and cannot be improved by any other strategy, including pure strategies. The indifference at the intersection does not break the optimality of the mixed strategy because the agent cannot condition on the intersection and must therefore use the same randomizing device at both.
answer: |-
  1. Step (6) misapplies the permissibility of deviation: indifference at one information set (here, an intersection) only allows deviation at that set, but absent-mindedness forces identical actions at both intersections, so deviating "now" means deviating everywhere, not locally.  
  2. Step (5) overlooks that indifference is conditional on the plan being followed; if the agent deviates to always exit, the conditional probabilities (8/11 and 3/11) change because they depend on the plan’s randomization, invalidating the indifference calculation.  
  3. Step (7) equivocates between action and plan: resolving to "always exit" is adopting a new policy, not a one-off choice, and this policy’s ex ante payoff (1) is indeed worse than the mixed plan’s (1.56), but that doesn’t undermine the mixed plan—it shows the new plan is inferior.  
  4. The argument ignores strategic rationality: following the ex ante optimal plan is rational because it maximizes expected utility given the information constraint (no distinction between intersections), and no alternative strategy (pure or mixed) yields higher ex ante utility.  
  5. Step (6) falsely assumes "no reason to follow the plan" implies freedom to deviate locally, but the plan’s instruction binds via commitment to a strategy that solves the decision problem under uncertainty, and local indifference doesn’t break this commitment absent a better unconditional strategy.
