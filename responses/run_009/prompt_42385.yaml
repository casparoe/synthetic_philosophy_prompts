answer: |-
  ## Fellowship Proposal: The Granularity of Equality - Temporal Units and the Metric of Egalitarian Concern

  **Project Title:** Beyond Invariance: Temporal Granularity and the Contingency of Egalitarian Metrics

  **1. Core Question & Hypothesis:**
  The central debate in distributive justice – "Equality of what?" (welfare, resources, capabilities) – presupposes that the *correct metric* for assessing equality is **invariant across temporal distributive units**. Proponents argue for their preferred metric (e.g., resources for Rawlsians, capabilities for Senians, welfare for luck egalitarians) as the singularly appropriate measure for egalitarian concern, typically assuming the unit is the "whole life." This project challenges that foundational assumption. Its core question is: **Does the normative plausibility and practical tractability of welfare, resource, and capability metrics vary systematically depending on the temporal unit (e.g., whole life vs. decade vs. year vs. day) over which equality is assessed?** The working hypothesis is that **the arguments favoring one metric over another are contingent upon the chosen temporal granularity.** What appears as a fundamental disagreement between theories (e.g., resourcism vs. capability approach) may partially stem from unacknowledged differences in the implicit temporal units presupposed by their respective arguments or applications.

  *   **Unit-Relative Metric:** The claim that metric M1 (e.g., resources) is normatively preferable and/or practically tractable for assessing equality over temporal unit U1 (e.g., a lifetime), while metric M2 (e.g., capabilities) is preferable/tractable for unit U2 (e.g., a workday). The "correct" metric depends on the unit.
  *   **Invariant Metric:** The claim that a single metric M (e.g., capabilities) is normatively preferable and practically tractable for assessing equality over *all* plausible temporal units, from a lifetime down to arbitrarily small slices.

  **2. The Unexamined Premise in Existing Positions:**
  Existing arguments for each major metric implicitly rely on unstated assumptions about temporal units, leaving the invariance question open:

  *   **Resourcism (e.g., Rawlsian Primary Goods):** Defended for enabling individuals to pursue their life plans. This presumes the unit is the whole life. Key premises – that resources are "all-purpose means" and individuals are responsible for converting them – become strained when applied to very short units. Can we assess "equal resources for the next hour" meaningfully when the conversion of those resources into functionings is path-dependent (e.g., needing time to learn, heal, or build) and heavily influenced by prior holdings inaccessible within the unit?
  *   **Capability Approach (e.g., Sen/Nussbaum):** Focuses on substantive freedoms to achieve valuable functionings. While applicable across scales, its plausibility relies on selecting relevant capabilities. Arguments for selecting capabilities often implicitly reference life-course concerns (e.g., "being able to live to the end of a human life of normal length," "being able to participate effectively in political choices"). Applying the same metric to a very short unit (e.g., an afternoon) risks either triviality (equal capability to "choose leisure activities?") or impracticality (defining and measuring fine-grained capabilities exhaustively). The premise that capability sets are the core informational focus *regardless of temporal scope* is unexamined.
  *   **Welfare Egalitarianism (e.g., preference satisfaction, hedonic states):** Often justified by the intrinsic importance of well-being. However, arguments for *equality* of welfare frequently rely on aggregating welfare over a life (e.g., whole-life preference satisfaction, or equalizing lifetime opportunity for welfare). Assessing welfare equality over a short unit faces problems of myopia (ignoring long-term consequences), volatility (hedonic states fluctuate wildly), and aggregation puzzles (how short-term equal welfare moments build into a life). The premise that "welfare" maintains its normative primacy as the equality-bearer identically across all temporal scales remains undefended.

  Each theory builds its case primarily at the lifetime level, taking the unit for granted. Their core arguments do not explicitly demonstrate why their metric *must* hold for substantially different units, creating the space for this investigation.

  **3. Methodology & Work Plan (12 Months - Philosophical Investigation):**
  This project employs rigorous philosophical analysis, constructing cases, testing conceptual coherence, and evaluating arguments at varying temporal grains. No empirical data collection is involved.

  *   **Months 1-2: Foundational Framing & Case Construction:** Precisely define the core concepts (welfare, resources, capabilities) and key dimensions of temporal units (duration, position within a life, relationship to life stages). Develop a battery of structured thought experiments designed to stress-test each metric at contrasting units (e.g., lifetime vs. single day; decade vs. hour). *Example Case:* "Resource Equality at Noon": Two individuals possess identical resources at 12:00 pm. However, one is temporarily paraplegic after an accident (reducing immediate capabilities), while the other is healthy but deeply depressed (reducing welfare). Is this snapshot resource equality normatively compelling? Does it differ from lifetime resource equality?
  *   **Months 3-5: Granularity Stress-Test I - Resources & Capabilities:** Systematically apply the cases to resourcist and capability metrics. Analyze: (a) **Normative Plausibility:** Does the argument for the metric retain intuitive force at different grains? (e.g., Does "equality of all-purpose means" make sense for an hour?) (b) **Tractability:** Does defining and measuring the metric become conceptually incoherent or practically absurd at certain grains? (e.g., Defining a non-trivial set of "capabilities for a Tuesday afternoon"). (c) **Path-Dependence & Prior Holdings:** How do short-unit assessments interact with past inequalities? Does the metric adequately capture this?
  *   **Months 6-8: Granularity Stress-Test II - Welfare & Synthesis:** Repeat the analysis for welfare metrics. Explore aggregation issues: How does equality over short units relate to equality over the long term? Are the metrics composable? Synthesize findings: Identify patterns where a metric loses plausibility/tractability as the unit shrinks (or grows), and where apparent conflicts between metrics might dissolve when unit-relativity is acknowledged.
  *   **Months 9-10: Coherence & Implications:** Test the internal coherence of a "unit-relative" view. Does it lead to contradictions or unacceptable trade-offs? Explore implications: Does justice require different *distributive principles* (not just metrics) for different units? What does this mean for practical policy design (e.g., hourly wages vs. pensions)?
  *   **Months 11-12: Integration, Refinement & Dissemination Prep:** Refine the core argument, address potential counterarguments rigorously, formalize the unit-relativity thesis or the case for invariance, and structure findings into dissertation chapters and fellowship report/publication drafts.

  **4. Outcomes of Success:**
  *   **Positive Result (Confirmation of Unit-Relativity):** Demonstrate that the normative defensibility and/or practical feasibility of welfare, resource, and capability metrics significantly depends on the temporal unit of assessment. This would: a) Reconceptualize the "Equality of What?" debate, revealing a significant source of cross-purpose disagreement; b) Force theorists to explicitly justify their choice of unit and potentially accept metric pluralism; c) Provide new tools for analyzing specific egalitarian claims made at non-lifetime units (e.g., workplace fairness, educational equity per term).
  *   **Negative Result (Confirmation of Invariance):** Demonstrate that the core arguments for each metric remain robust across diverse temporal units. This would: a) Significantly strengthen the case for invariant metrics by eliminating a major potential challenge; b) Clarify the robustness of existing theories; c) Highlight the specific features of each metric that *do* make it resilient to temporal granularity changes, deepening understanding of their foundations. *Even this negative result is valuable:* It resolves an important, previously unasked question, providing essential meta-clarity to the field and preventing future wasted effort on unit-relativity if it proves illusory.

  **5. Scope Management & Core:**
  *   **Potential Trims (Without Gutting):** (1) Deep dive into only one competing metric's historical arguments (e.g., focus less on welfare's nuances if resources/capabilities show the strongest effect). (2) Limit exploration of non-temporal units (e.g., spatial, institutional) beyond necessary contrast. (3) Reduce the number of very finely-grained test units (e.g., focus on life/decade/year/day rather than hour/minute). (4) Curtail extended discussion of policy implications beyond core theoretical insights.
  *   **Indivisible Core:** The systematic conceptual analysis comparing the normative plausibility and practical tractability of **all three core metrics (welfare, resources, capabilities)** at **at least two significantly different temporal grains (e.g., whole life and a short-term unit like a day or week)** using constructed philosophical cases and coherence testing. This comparative analysis across metrics and units is the essential test of the hypothesis.

  **6. Weakest Link & Critical Vulnerability:**
  *   **The Weakest Link:** The **"Tractability Challenge"** for capability metrics at fine grains. The project's success hinges significantly on showing that defining and assessing capabilities becomes *conceptually problematic* or *practically absurd* (not just difficult) for very short units, not merely administratively burdensome. If compelling arguments can be made that a non-trivial yet manageable set of "short-unit capabilities" *can* be coherently defined (e.g., basic physical functioning, immediate choice options, freedom from acute distress within the period), the case for unit-relativity based on intractability weakens considerably. The project relies on demonstrating a genuine *conceptual mismatch*, not just a measurement challenge.
  *   **Critical Vulnerability (Funding Undermined):** If it emerges early that **the core normative arguments for each metric demonstrably *already incorporate* and *successfully handle* temporal granularity within their standard formulations**, the project's novelty and potential contribution collapses. For instance, if resourcists convincingly argue their metric *only ever* applies to holdings over time sufficient for conversion (implicitly rejecting fine-grained snapshots), or if capability theorists have robust criteria for selecting contextually-relevant capabilities at any scale, the central hypothesis (that granularity is an unexamined factor driving disagreement) loses force. The project would shrink to merely documenting *how* existing theories manage granularity, rather than revealing a fundamental hidden assumption. This would undermine the case for funding by suggesting the core insight is either already addressed or trivial. *Mitigation:* Initial months will rigorously probe canonical texts for such implicit handling; if found robustly, the focus shifts to synthesizing and comparing *how* each theory manages granularity, still yielding valuable meta-theory.

  This project offers a novel lens to dissect a foundational debate in political philosophy, promising significant conceptual clarification regardless of whether the unit-relativity hypothesis holds. It addresses a genuine gap in the theoretical landscape with a methodologically sound philosophical approach tailored to the fellowship timeframe.
