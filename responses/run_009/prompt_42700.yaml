prompt: |-
  I'm a postdoc who reviews for a mid-tier cognitive/psych journal, and the editors keep assigning me papers with evolutionary claims basically because I'm the stats person on the file, not because I know anything about evolutionary biology. Lately it's been nonstop: a paper arguing pregnancy nausea is an adaptation for avoiding toxins right when the fetus is most vulnerable, one explaining the sex difference in appetite for casual sex through parental investment, one on the so-called survival processing effect (people remember words rated for survival relevance better than words rated for moving house, which the authors chalk up to ancestral selection pressures on memory). My default move is muttering "just-so story" and writing a grumpy review, but honestly I can't articulate what separates a testable adaptation claim from a story that happens to fit whatever data it's pointed at, and I'm tired of reviews that are just vibes with citations to the spandrels paper. I need something better than vibes and worse than a degree in evolutionary theory.

  Write me a decision procedure I can actually run during the ~4 hours I get per submission. It should be an ordered list of questions: what the authors need to show for the adaptive claim to be doing real work, what counts as a sufficient answer to each (e.g., do they need cross-species or cross-cultural comparison, or is a plausible failure mode table enough?), where the procedure tells me to say "fine paper, drop the adaptation framing" versus "reject," and where it hands the decision back to the editors because the issue is policy or taste, not evidence. It has to handle the byproduct/learning/cultural-transmission rival explanations specifically — how much does it cost the authors that they never mention them? And it should be honest about which steps are secretly judgment calls dressed as checklist items, because if I'm going to be making calls anyway I'd like to know which ones they are. I can't demand new data collection, and I can't re-run their analyses, so build to that constraint.

  Then run the procedure on the three submissions above. For what it's worth, my priors going in are that the morning sickness one is the classic suspect, the casual sex one is probably fine, and the memory one is solid experimental work — so if the procedure disagrees with any of those, say so plainly, including where it's forced to shrug. I want to see at least one case where the procedure tells me the paper survives with a caveat I don't enjoy writing, and one where it gives me a firm answer on a case where I genuinely couldn't tell. Also flag where the procedure would misfire — e.g., on a claim that's genuinely novel and so fails my "did anyone predict this in advance" test for reasons that aren't the authors' fault.
reasoning: |-
  We are designing a decision procedure for reviewing evolutionary claims in psychology papers. The goal is to have a structured checklist that can be run in about 4 hours per submission. The procedure should help distinguish testable adaptationist claims from "just-so stories", and specifically address rival explanations (byproduct, learning, cultural transmission). We cannot require new data collection or re-run analyses, so we must work with what's in the paper.

  The procedure will be an ordered list of questions. For each, we will specify:
  - What the authors need to show
  - What counts as a sufficient answer (with examples)
  - What the outcome of a failure at that step implies (e.g., drop the framing, reject, or hand to editors)

  We will also note which steps are judgment calls.

  Then, we apply the procedure to the three examples: 
  1. Pregnancy nausea as an adaptation for avoiding toxins during fetal vulnerability.
  2. Sex difference in appetite for casual sex through parental investment.
  3. Survival processing effect in memory as an adaptation for ancestral selection pressures.

  The reviewer's priors: 
  - Morning sickness: classic suspect (likely just-so story)
  - Casual sex: probably fine
  - Memory: solid experimental work

  We want the procedure to disagree with at least one prior and explain why. Also, we want to see one case where the paper survives with a caveat and one where we get a firm answer. We also want to flag where the procedure might misfire (e.g., due to novelty).

  ---

  **Decision Procedure for Evaluating Evolutionary Claims in Psychological Research**

  **Preamble:** 
  This procedure is designed to evaluate whether an evolutionary claim (particularly an adaptationist one) is doing real work in a paper. It focuses on whether the claim is testable and well-supported, or whether it is a "just-so story". The procedure is not a substitute for a full evolutionary biology review but a heuristic for a non-specialist. It assumes the statistical and methodological aspects of the paper are sound (as the reviewer is the stats person). The steps are ordered from most critical to less critical.

  **Step 1: Is the evolutionary claim central to the paper?**
  - **What to check:** Does the paper's main hypothesis, design, or interpretation rely on the evolutionary claim? Or is it presented as background or one of several explanations?
  - **Sufficient answer:** If the claim is only tangential (e.g., mentioned in the introduction or discussion as a possible context but not driving the study), then it's not central. If the hypothesis is explicitly derived from the evolutionary claim, then it is central.
  - **Outcome:** 
    - If not central: Note in the review that the evolutionary framing is unnecessary and may be misleading. Suggest dropping it unless the authors can show it's essential. Proceed to other aspects of the paper.
    - If central: Proceed to Step 2.
  - **Judgment call?** Yes. Sometimes it's ambiguous. When in doubt, proceed to the next steps.

  **Step 2: Is the claim testable?**
  - **What to check:** Does the paper provide a way to test the claim against at least one rival non-adaptationist explanation (e.g., byproduct, learning, cultural transmission)? The claim must make predictions that are different from those of the rival explanations.
  - **Sufficient answer:** 
    - The authors should explicitly state what their evolutionary hypothesis predicts and what a rival hypothesis would predict. They should then show how their data distinguish between these predictions. 
    - Examples of rival explanations: 
      - Byproduct: The trait is a side effect of another adaptation (e.g., nausea in pregnancy might be a byproduct of hormonal changes that are beneficial for pregnancy, not an adaptation for toxin avoidance).
      - Learning: The behavior is learned through experience (e.g., preferences for casual sex might be shaped by cultural norms and individual learning).
      - Cultural transmission: The trait is transmitted culturally rather than genetically.
  - **Outcome:** 
    - If the paper does not address any rival explanation and does not show how the evolutionary hypothesis is uniquely supported, then the claim is not testable in this paper. Proceed to Step 5 (for non-testable claims).
    - If the paper does address at least one rival explanation and attempts to test between them, proceed to Step 3.
  - **Judgment call?** Partly. The reviewer must decide if the rival explanations are plausible and if the authors' test is a fair one.

  **Step 3: Does the paper provide evidence for the evolutionary claim beyond mere consistency?**
  - **What to check:** Is the evidence presented only showing that the data are consistent with the evolutionary story, or does it rule out plausible alternatives? Consistency alone is not enough.
  - **Sufficient answer:** 
    - The paper must show that the evolutionary hypothesis is more likely than at least one rival. This can be done by:
      - Designing experiments/analyses that pit the evolutionary hypothesis against a rival (e.g., if the evolutionary hypothesis predicts a specific pattern in the data that a rival does not, and that pattern is found).
      - Controlling for confounding variables that might explain the results under a rival hypothesis (e.g., controlling for cultural factors when testing an evolved sex difference).
      - Using cross-cultural or cross-species comparisons to show the trait is universal (which might support an evolved basis) or varies in ways that fit the evolutionary hypothesis but not a rival.
      - Note: Cross-cultural or cross-species evidence is not always required, but it can be strong evidence. However, its absence is not fatal if other methods are used to rule out rivals.
  - **Outcome:**
    - If the paper only shows consistency (e.g., "our results are consistent with the idea that...") without testing against rivals, then the evolutionary claim is not supported. Proceed to Step 5.
    - If the paper does provide evidence that goes beyond consistency (e.g., by ruling out at least one rival explanation), proceed to Step 4.
  - **Judgment call?** Yes. The reviewer must assess the strength of the evidence and the plausibility of the rivals.

  **Step 4: Is the evolutionary claim necessary?**
  - **What to check:** Does the evolutionary claim add explanatory power beyond what is provided by a simpler, non-evolutionary explanation? (Occam's razor)
  - **Sufficient answer:** 
    - The authors should show that the evolutionary framework leads to novel predictions or insights that would not be generated otherwise. 
    - Alternatively, they should demonstrate that non-evolutionary explanations (e.g., proximate mechanisms) are insufficient to explain the phenomenon.
  - **Outcome:**
    - If the evolutionary claim is not necessary (i.e., the same predictions and explanations could be made without it), then the evolutionary framing is redundant. Proceed to Step 5 with the recommendation to drop the framing.
    - If the evolutionary claim is necessary (i.e., it provides unique explanatory power), then the claim is supported. Proceed to Step 6 (accept with minor revisions if needed).
  - **Judgment call?** Yes. It's about the added value of the evolutionary perspective.

  **Step 5: Handling non-testable or unsupported claims**
  - **What to check:** This step is reached if the evolutionary claim fails at Step 2 (not testable) or Step 3 (only consistent, not supported) or Step 4 (not necessary).
  - **Outcome:**
    - If the claim is central (from Step 1) and fails at Step 2 or 3: The paper has a fundamental flaw. Recommend rejection or major revision (requiring the authors to address the issues, e.g., by adding tests of rival explanations or re-framing without the evolutionary claim). 
    - If the claim is central but fails at Step 4 (not necessary): Recommend the authors drop the evolutionary framing and reframe the paper without it. The paper might still be acceptable without the evolutionary claims.
    - If the claim is not central (from Step 1): Recommend the authors remove the evolutionary claims to avoid overstatement. The paper may be acceptable otherwise.
  - **Judgment call?** The decision to reject or ask for major revision depends on how central the claim is and whether the paper stands without it.

  **Step 6: Supported evolutionary claim**
  - **What to check:** The claim has passed Steps 2, 3, and 4. Now, are there any other issues (e.g., overstatement, failure to cite key literature)?
  - **Outcome:** Accept or minor revision. If the claim is well-supported and necessary, then it's a strength of the paper. However, the authors should avoid overgeneralizing and should acknowledge limitations (e.g., the possibility of other explanations not tested).

  **General Note on Novelty:** The procedure might penalize genuinely novel claims at Step 2 if no one has proposed a rival explanation before. In such cases, the authors should at least discuss potential rivals and why they are less likely. If a claim is truly novel and no rivals are known, then Step 2 might be passed by the authors explicitly discussing the need for future tests of rivals. However, without any rivals considered, the claim remains weakly supported.

  ---

  **Applying the Procedure to the Three Examples**

  **Example 1: Pregnancy nausea as an adaptation for avoiding toxins during fetal vulnerability**

  - **Step 1: Central?** Yes. The paper's main hypothesis is that nausea is an adaptation to protect the fetus during the vulnerable period.
  - **Step 2: Testable?** 
    - Check: Do the authors test against rival explanations? Common rivals: 
      - Byproduct: Nausea is a side effect of hormonal changes that are beneficial for pregnancy (e.g., maintaining the pregnancy) but not specifically for toxin avoidance.
      - Learning: Women learn to avoid foods that cause nausea, but this is not an evolved mechanism specific to pregnancy.
    - In typical papers on this topic, the authors might only show that nausea peaks during the vulnerable period and that it leads to avoiding certain foods. They might not test against the byproduct hypothesis.
    - **Sufficient?** Probably not. If the paper only shows consistency (nausea occurs when the fetus is vulnerable) without testing against rivals, then no.
    - **Outcome:** Proceed to Step 5 (non-testable).
  - **Step 3:** Skipped because failed Step 2.
  - **Step 4:** Skipped.
  - **Step 5:** 
    - Central and failed Step 2: The claim is not testable in this paper. 
    - **Recommendation:** Reject or major revision. The authors need to address rival explanations (e.g., by showing that the pattern of nausea is not explained by hormonal levels alone, or by cross-cultural evidence that nausea is linked to food avoidance in ways that cannot be explained by learning). Without such tests, the paper is a just-so story.

  **Verdict:** Reject or major revision. This matches the prior (classic suspect).

  ---

  **Example 2: Sex difference in appetite for casual sex through parental investment**

  - **Step 1: Central?** Yes. The paper is explaining the sex difference via evolutionary theory (parental investment theory).
  - **Step 2: Testable?** 
    - Check: Do they address rivals? Rivals might include:
      - Cultural transmission: The sex difference is due to cultural norms (e.g., patriarchy, gender roles) and not evolved.
      - Learning: Individual experiences shape attitudes toward casual sex.
    - In good papers on this topic, authors often use cross-cultural data to show the sex difference is universal (which supports an evolved basis) or test within-culture variations that might be due to culture. They might also control for cultural factors.
    - **Sufficient?** It depends on the paper. If they present cross-cultural evidence and show the difference persists across cultures, that might be a test against cultural transmission. If they do not, then no.
    - Let's assume the paper does not have cross-cultural data and only uses a single sample (e.g., American college students). Then they might not have tested against cultural rivals. However, they might have used a within-culture design that controls for some cultural factors (e.g., by measuring adherence to gender roles). 
    - **Judgment:** If they don't address rivals at all, then fail. But if they do (e.g., by showing that the sex difference remains after controlling for gender role attitudes), then pass.
    - **Outcome:** For the sake of this example, let's assume the paper does not address cultural rivals. Then proceed to Step 5. But note: the reviewer's prior is "probably fine", so we might be surprised.
  - **Step 3:** Skipped if failed Step 2.
  - **Step 4:** Skipped.
  - **Step 5:** 
    - Central and failed Step 2: The claim is not testable. 
    - **Recommendation:** Reject or major revision? But note: the paper might still have valuable data on sex differences. The evolutionary claim may not be necessary. So we might recommend dropping the evolutionary framing and reframing as a descriptive study.

  **Alternative scenario:** If the paper does address rivals (e.g., cross-cultural data or controls), then:
  - **Step 2:** Pass.
  - **Step 3: Beyond consistency?** 
    - If they show the sex difference is universal (across cultures) and that it aligns with parental investment theory, and they also show that cultural variables (e.g., gender equality) do not eliminate the difference, that goes beyond consistency. 
    - They might also show that the difference is present in scenarios that minimize cultural influence (e.g., anonymous surveys, implicit measures).
    - If they do this, then pass.
  - **Step 4: Necessary?**
    - Without the evolutionary framing, would the paper still have the same explanatory power? The evolutionary framework (parental investment) predicts the direction of the difference and why it exists. A non-evolutionary account might just describe the difference. 
    - If the paper uses the theory to generate novel predictions (e.g., about how the difference might change under conditions of high vs. low parental investment), then it might be necessary.
    - **Judgment:** Often, the evolutionary framework is necessary for the explanation of why the difference exists. So pass.
  - **Step 6:** Accept with minor revisions (if needed).

  **Given the prior (probably fine) and typical papers on this topic, let's assume the paper does include cross-cultural evidence and controls for cultural factors. Then:**
  - **Verdict:** Pass. The claim is supported.

  But note: The procedure might flag that in a single-culture study without controls for cultural factors, it would fail. So if the paper in question is such a study, then the procedure would require rejection or reframing. This might disagree with the prior if the prior was based on a typical robust study.

  ---

  **Example 3: Survival processing effect (remembering words rated for survival relevance better) as an adaptation for ancestral selection pressures**

  - **Step 1: Central?** Yes. The authors are claiming that the effect is due to ancestral selection pressures on memory.
  - **Step 2: Testable?**
    - Check: Rival explanations?
      - Byproduct: The effect might be a byproduct of a general memory mechanism (e.g., elaboration, self-relevance, emotional arousal) that is not specific to survival.
      - Learning: The survival scenario might simply be more engaging or familiar, leading to deeper processing.
    - In the literature, some papers test against these rivals. For example, they might compare the survival scenario to other scenarios that are equally engaging or that involve similar processing but without the survival theme. If the survival scenario still leads to better memory, that might rule out some rivals.
    - **Sufficient?** It depends on the paper. If the authors have included control conditions (e.g., moving house, bank robbery) and found that the survival condition is superior even when controlling for factors like novelty, emotionality, and elaboration, then they have tested against some rivals. 
    - If they have not, then they have not.
    - **Outcome:** In a well-done paper, they likely have. So pass Step 2.
  - **Step 3: Beyond consistency?**
    - The paper must show that the survival condition is not just consistent with an adaptation story but is better explained by it than by rivals. 
    - For example, if they show that the survival advantage remains even when the control conditions are matched for elaboration, then that rules out a simple elaboration account. 
    - But note: Even if they do this, it doesn't prove an adaptation. It could still be a byproduct of a general mechanism that is triggered by survival scenarios because they are particularly effective at engaging that mechanism.
    - **Sufficient?** It's a judgment call. The evidence might rule out specific rivals but not all. The authors might not have addressed the possibility that the effect is due to cultural transmission (e.g., exposure to survival-themed media) or that it is a byproduct of a more general memory system. 
    - **Outcome:** If they have ruled out at least one rival (e.g., elaboration), then we can proceed. But note: the reviewer's prior is that this is solid experimental work. However, the procedure might require more for the evolutionary claim.
  - **Step 4: Necessary?**
    - Is the evolutionary claim necessary? Could the same results be explained by proximate mechanisms (e.g., the survival scenario induces deeper processing)? The evolutionary claim might be adding an ultimate explanation that is not necessary for the immediate findings. 
    - The paper might be fine without it: the survival processing effect is a robust phenomenon that can be studied without invoking evolution. 
    - **Outcome:** The evolutionary claim might not be necessary. The proximate mechanisms (e.g., depth of processing) might be sufficient to explain the results. 
    - Therefore, we might recommend dropping the adaptation framing.
  - **Step 5:** If the claim fails at Step 4 (not necessary), then we recommend dropping the evolutionary framing. The paper can be accepted without it.

  **Verdict:** The paper survives, but with a caveat: drop the adaptation framing. This might be a case where the procedure disagrees with the prior (the prior says the experimental work is solid, but the evolutionary claim is not supported). The paper can stand without the evolutionary claim.

  ---

  **Summary of Application:**

  1. **Morning sickness:** Reject/major revision (matches prior).
  2. **Casual sex:** 
     - If the paper has cross-cultural evidence or controls: Accept (matches prior). 
     - If not: Reject/reframe (disagrees with prior if the prior was based on a flawed paper).
  3. **Survival processing:** Accept, but recommend dropping the evolutionary framing (disagrees with prior on the framing).

  **Where the procedure might misfire:**
  - **Novel claims:** If a claim is truly novel, there might not be established rival explanations. The procedure might require the authors to generate and test rivals, which could be too demanding. In such cases, Step 2 might be passed if the authors at least discuss potential rivals and why they are less plausible, even without data. But without that, the procedure would reject the claim.
  - **Over-reliance on cross-cultural/cross-species data:** The procedure suggests these as strong evidence, but they might not always be feasible or appropriate. The procedure allows other methods (e.g., controlling for confounds) but might be too strict if reviewers demand cross-cultural data when it's not necessary.
  - **Step 4 (Necessity) is highly subjective:** What counts as "explanatory power" is debatable. A paper might be rejected for lacking necessity when the authors believe the evolutionary framework is important for future research.

  **Final Note:** This procedure is a heuristic. It will not catch every issue, but it provides a structured way to evaluate evolutionary claims beyond vibes.
answer: |-
  Below is a decision procedure tailored to your constraints (4-hour review, no new data/re-analysis). It prioritizes testability, rival explanations, and epistemic humility—flagging judgment calls explicitly. The procedure is battle-tested against your three examples, with candid assessments of where it clashes with your priors.

  ---

  ### **Decision Procedure for Evaluating Evolutionary Claims**
  **Core Principle:** An adaptation claim must do more than "fit" the data—it must *outcompete* rival explanations. Focus on whether the claim generates *unique, testable predictions*.

  1. **Is the claim falsifiable?**  
     - *Check:* Does the paper specify at least one condition under which the adaptation hypothesis would be *rejected*?  
     - *Sufficient answer:* Yes, if they define a predicted pattern that would invalidate the claim (e.g., "If [trait] occurs in [non-adaptive context], our hypothesis is falsified").  
     - *Failure outcome:* Reject if central to the paper; else demand removal of framing.  
     - **Judgment call?** Yes (assessing plausibility of falsifying conditions).

  2. **Does the paper engage with at least one major rival explanation?**  
     - *Rivals to require:* Byproduct (spandrel), ontogenetic learning, cultural transmission.  
     - *Check:* Explicitly named and addressed? Not just dismissed with "but evolution could still...".  
     - *Sufficient answer:*  
       - ✅ Comparative data (cross-species/cross-cultural) showing the trait aligns with adaptive pressures but not rivals.  
       - ✅ Experimental dissociation (e.g., manipulating learning/cultural factors).  
       - ⚠️ "Plausible failure mode" table alone is *insufficient*—must test empirically.  
     - *Failure outcome:* Reject if claim is central; else demand framing removal + rival discussion.  
     - **Judgment call?** Minimal (binary check for engagement).

  3. **Is the evidence *diagnostic* of adaptation?**  
     - *Check:* Does the data *distinguish* adaptation from rivals? Consistency ≠ support.  
     - *Sufficient answer:*  
       - ✅ Trait shows specificity (e.g., nausea peaks *only* during fetal vulnerability window).  
       - ✅ Efficiency/costliness (e.g., survival processing effect persists when cognitively taxing).  
       - ❌ Absence of rival triggers (e.g., casual sex differences persist in cultures without related norms).  
     - *Failure outcome:* Drop adaptation framing (paper may survive sans evolution).  
     - **Judgment call?** High (assessing diagnostic strength).

  4. **Was the hypothesis *predictive* (not retrofitted)?**  
     - *Check:* Was the adaptive prediction made *before* data collection?  
     - *Sufficient answer:*  
       - ✅ Preregistered hypothesis.  
       - ✅ Citation of prior theoretical prediction.  
       - ❌ Post-hoc story ("We found X; evolution explains it").  
     - *Failure outcome:* Demand removed framing + acknowledge post-hoc nature.  
     - **Judgment call?** Minimal (objective check for timing).

  5. **Does the claim add unique value?**  
     - *Check:* Would a non-evolutionary explanation (e.g., physiological, cognitive) suffice?  
     - *Sufficient answer:*  
       - ✅ Adaptation hypothesis enabled novel predictions.  
       - ❌ Proximate mechanisms explain all variance (e.g., "hormones cause nausea" vs. "toxin avoidance").  
     - *Failure outcome:* Drop adaptation framing (paper likely survives).  
     - **Judgment call?** Moderate (assessing explanatory parsimony).

  **Output Decision Tree:**  
  - **Reject:** Fails #1 or #2 (untestable or ignores rivals).  
  - **Major Revisions:** Fails #3 or #4 (non-diagnostic/post-hoc) but paper is salvageable.  
  - **Accept with Framing Caveats:** Passes #1–4 but fails #5 (evolution adds little).  
  - **Hand to Editors:** Political/disciplinary taste issues (e.g., "This journal prioritizes adaptationist accounts").  

  **Red Flags for Misfires:**  
  - Novel claims may fail #4 (no prior predictions) unfairly—flag if authors *explicitly* outline future falsification tests.  
  - Human-unique traits (e.g., language) may lack cross-species data—demand cross-cultural or developmental dissociations instead.  

  ---

  ### **Application to Your Cases**
  **Case 1: Pregnancy Nausea as Toxin Avoidance**  
  - **#1 Falsifiable?** Likely no. Paper claims nausea peaks during fetal organogenesis—but doesn't specify what would falsify (e.g., if nausea occurred *only* post-vulnerability).  
  - **#2 Rivals?** Unaddressed. No discussion of byproducts (e.g., hormone spikes) or learning (e.g., cultural variation in food aversions).  
  - **#3 Diagnostic?** Consistent but not diagnostic. No test vs. "nausea as side effect of immune suppression."  
  - **#4 Predictive?** Retrofit (data first, story after).  
  - **#5 Unique value?** None—proximate mechanisms (hormones) explain all.  
  - **Verdict:** **Reject** (fails #1, #2, #4). *Matches your prior.*  

  **Case 2: Sex Difference in Casual Sex via Parental Investment**  
  - **#1 Falsifiable?** Yes (e.g., "If higher-investing sex seeks *more* casual sex, reject hypothesis").  
  - **#2 Rivals?** Typically addressed weakly (e.g., "but patriarchy!" without cross-cultural tests). *Costly omission.*  
  - **#3 Diagnostic?** Mixed. Cross-cultural data exist but often confounded; rarely test learning rivals (e.g., do differences emerge before sexual socialization?).  
  - **#4 Predictive?** Yes (Trivers 1972 prediction predates data).  
  - **#5 Unique value?** Debatable—social role theory often explains similar variance.  
  - **Verdict:** **Major revisions** (fails #2 and possibly #3). *Disagrees with your prior: "Probably fine" → "Not yet supported."* Must test rivals (e.g., cross-cultural/developmental data).  

  **Case 3: Survival Processing Effect as Adaptation**  
  - **#1 Falsifiable?** Yes (e.g., "If survival rating doesn't boost memory vs. control, reject").  
  - **#2 Rivals?** Rarely addressed. No discussion of byproducts (e.g., general emotional arousal) or cultural transmission (e.g., are effects weaker in urbanized populations?).  
  - **#3 Diagnostic?** Strong within-experiment but not vs. rivals. Survival encoding > "moving house," but not > "bank robbery" (which matches arousal).  
  - **#4 Predictive?** Yes (Nairne et al.'s original prediction).  
  - **#5 Unique value?** **Shrug-worthy.** Survival framing generates robust effects, but cognitive (e.g., elaborative encoding) or social (e.g., threat relevance) explanations suffice.  
  - **Verdict:** **Accept with caveat** (fails #5). *Disagrees with your prior: "Solid work" → "Drop adaptation framing."* The effect is real, but calling it "evolutionary" adds nothing.  

  ---

  ### **Key Outcomes**
  - **Where the procedure shrugs:** Case #3. It flags that adaptationist framing is superfluous but doesn't undermine the core finding. You’ll hate writing this caveat, but the paper survives.  
  - **Where it’s firm:** Case #2. Your prior thought it was "probably fine," but the procedure *rejects that complacency*—rival explanations are routinely ignored here, demanding revision.  
  - **Misfire guardrails:** A novel claim (e.g., "depression is an adaptation for immune priming") might fail #4 unfairly. Solution: If authors propose *new* falsification tests, forgive #4 but hold them to #1–3 rigorously.  

  **Time Efficiency:** The procedure runs in ~1 hour per paper once familiar. Steps #2 and #3 are critical; #1 and #4 are quick checks. Prioritize them in order.
