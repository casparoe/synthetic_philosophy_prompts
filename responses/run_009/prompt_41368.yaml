  ## Address: Jahrzeit for the Living - 2025

  Family. We gather again, ten years on, as we have since 1985. This ritual, our “Jahrzeit for the living,” asks a question born in the shadow of a war we didn’t fight, about a past we didn’t make. My grandfather, in ’85, saw the question fading with the generation that bore responsibility. My grandmother, a decade later, challenged that with a profound framework she carried in her heart – Karl Jaspers’ four kinds of guilt. She argued, fiercely, that the matter wasn’t so easily closed.

  Today, the question returns: Does our family’s obligation to that German past still bind us? And if so, *how*? Some of you, especially our younger members, stand here feeling this ritual is a burden unfairly placed on your shoulders. You’re right to ask: How can we be guilty of things that happened before we were born? Others, like my cousin’s husband, question the ritual’s very logic. And in the corner, Great-Aunt Liesel sits, a silent witness whose presence holds decades we can only imagine.

  My answer is this: **Our obligation persists, but it has transformed. We are not bound by inherited guilt; we are bound by inherited responsibility.** Jaspers’ distinctions, which Grandma wielded so powerfully, are crucial for drawing this line clearly. Let me walk us through them, not as categories of blame for us, but as signposts for our duty.

  1.  **Criminal Guilt:** This rests with individuals who broke specific laws. It’s proven in courts. Those trials are long past. The individuals responsible for specific atrocities are gone, or nearly so. None of us in this room bear *criminal guilt* for the actions of the Third Reich. That chapter is closed for us. Grandma rightly insisted on acknowledging its reality, but for us inheritors, its direct legal weight lifts.
  2.  **Political Guilt:** This arises from belonging to a state whose actions caused harm. It’s collective, carried by citizens. Here is our first point of connection. We are citizens of the German state – a state whose predecessor committed profound crimes. This doesn’t mean *we* committed those crimes. But it does mean we inherit a *political liability*. We inherit the consequences, the reparations, the need to uphold the structures built to prevent recurrence – the democracy, the rule of law, the vigilance against hatred. We benefit from the nation that emerged; we bear the responsibility to maintain its foundations against the forces that once shattered it. This liability doesn’t fade quickly; it’s woven into the fabric of our citizenship.
  3.  **Moral Guilt:** This is personal. It stems from our own choices, actions, or failures to act against wrongs we witness. Grandma emphasized this intensely. Again, for the specific choices made during those dark years, ours cannot be direct moral guilt. We weren’t there. We didn’t choose. But – and this is vital – *moral responsibility* endures. It means we are responsible for *knowing*. For understanding the mechanisms – the propaganda, the fear, the incremental steps – that led ordinary people into complicity. It means we are responsible for examining our *own* choices now, in our own time, against that knowledge. Do we speak up? Do we challenge lies? Do we recognize the early warning signs? Our obligation is to cultivate this moral awareness, to learn history not just as facts, but as a cautionary tale for our own conscience. Ignorance is no longer an excuse; the information is there. The responsibility to engage with it is ours.
  4.  **Metaphysical Guilt:** This is the hardest one, the one that lingers. Jaspers called it a guilt felt not for specific acts, but simply for being human while others suffer unjustly. It’s based on a fundamental solidarity, a shared humanity. It arises from the simple, shattering fact: *It happened, and we are here.* Grandma held onto this tightly, I think. Time doesn’t dissolve this. The machinery of Auschwitz, the transports from our very town – they rupture the basic trust that the world is just. Those who come after inherit the world that rupture created. We live in its shadow. This isn’t guilt we *earned*, like moral guilt. It’s a condition we *inhabit*. Our obligation, born from this metaphysical solidarity, is to *acknowledge the rupture*, to resist the easy comforts of forgetting, and to actively mend the fabric of human trust through how we live – through empathy, through standing against dehumanization wherever we see it, through recognizing the inherent dignity of every person. This is the obligation that calls us, generation after generation, simply because we are human, connected to those who suffered and to those who failed them, by the fragile thread of existence itself.

  So, why do we gather? Not to wallow in guilt that isn’t ours. Not to perform some "secular original-sin service." We gather to *take up the responsibility* that history has passed to us.

  *   **We gather to affirm the Political Liability:** To remember that the state we are part of requires constant, active defense of its democratic values.
  *   **We gather to sharpen our Moral Responsibility:** To remind ourselves that complacency is dangerous, that knowledge is necessary, and that our choices matter – now.
  *   **We gather to acknowledge the Metaphysical Solidarity:** To feel the weight of the past rupture and commit to being repairers of the world, however small our corner of it.

  This gathering isn’t about the past pinning us down. It’s about us deciding how to carry it forward. It’s about transforming the passive inheritance of history into active, conscious stewardship. Our obligation binds us not to guilt, but to vigilance, to knowledge, to empathy, and to action. It binds us to build a present worthy of the painful lessons learned by those who came before, including those who sat silently or acted wrongly, and especially those who suffered.

  To the young who asked to be spoken *to*, not *at*: You are absolutely right. You bear no stain of criminal guilt. Your lives are your own. But you inherit the world those crimes shaped. This ritual isn’t about making you feel bad for what you didn’t do. It’s about asking: What will *you* do with the world you inherited? Will you be passive inheritors, or active guardians of the hard-won lessons? The responsibility isn’t a burden of shame; it’s the challenge of building something better, informed by the darkest chapters. It’s yours now, as it will be for those who come after you.

  To my cousin’s husband: The distinctions matter. We are not claiming inherited guilt. We are tracing lines of responsibility – political, moral, and metaphysical – that persist precisely because the *consequences* and the *human condition* persist. This isn’t confusion; it’s clarity born of careful differentiation.

  And to Great-Aunt Liesel, sitting quietly with us: Your presence is a testament to the complexities of time, memory, and silence. You remind us, simply by being here, that the past is never truly abstract. It lives in people, in choices made and unmade, in the long arc of a life lived in the aftermath. We hold this space with respect for that journey, and for the silence you keep.

  My grandmother used Jaspers to argue the obligation remained. I stand here 30 years later, using those same distinctions, to argue it has transformed. The guilt fades with the actors. The responsibility endures with the inheritors. That is why we gather. Not for guilt, but for resolve. Not for the past, but for the future we choose to build upon it. Thank you.

