prompt: |-
  I'm TA-ing intro ethics this semester and my section leader assigned me the nonidentity problem for next week's fifty-minute section (first-years, no philosophy background, most of them still shaky on utilitarianism vs. deontology). Don't give me the explanation itself -- I roughly have that. I need a teaching plan: what order the pieces go in, what example should carry the whole thing, the misconceptions I should expect, and where exactly in the sequence to kill each one off.

  On the carrying example: I've been debating between Parfit's depletion policy thing (society that consumes more now so future people have worse but still worth-living lives) and something more concrete like a city that rebuilds its floodwalls in a way that changes housing patterns, which changes who marries whom, which changes who exists fifty years later. Does the concrete version actually work better for first-years, or does it bury the structure under details? Or is there a better option I haven't thought of? Also tell me what the example needs to include and what it needs to leave OUT to make the puzzle bite.

  Misconceptions: my guess is the big one is students thinking the puzzle dissolves because the future person "can't complain, since they wouldn't exist otherwise," and treating that as a clean answer rather than the thing that makes it weird. And probably some of them will slide into "so nothing we do to future generations matters," which I want to block. Where in the sequence do these hit, and where do I preempt them?

  Also: what should I openly refuse to cover in fifty minutes (I'm assuming the whole person-affecting morality literature, but maybe more), and what single question can I ask at the end to check whether they actually got the puzzle rather than just followed the story?

  Two more things. Please keep the whole answer under 450 words -- tight, not an essay. And as you go, mark what's basically settled among people who work on this versus what's genuinely contested (I gather even whether nonidentity is a real problem vs. a confusion about baselines is disputed -- if so say so, don't present one side as the consensus). Answer in American English please, and push back on my framing wherever it's off.
reasoning: |-
  Okay, the user is a TA preparing to teach the nonidentity problem to first-year students with no philosophy background. They need a structured teaching plan, including example choice, misconception handling, and time management. 

  First, assessing their needs: They're time-pressed (50 minutes) and want to avoid tangents. The core challenge is making an abstract problem tangible without oversimplifying. Their example dilemma (Parfit's depletion vs. city floodwall) is practical—I should advise on which works better for newcomers.

  Considering their students: First-years grasp utilitarianism vs. deontology shakily, so the example must sidestep ethical frameworks. The floodwall scenario risks overwhelming them with causal chains. Depletion is better—clear cause/effect, minimal steps. But I'll stress simplifying it further: "Policy A (sustainable) vs. B (depletes resources)" with Policy B creating different, worse-off future people. Key is emphasizing *same number* of lives, all worth living, to prevent distraction.

  Misconceptions are predictable. Students will latch onto "can't complain" as a solution, not the paradox. Need to preempt this by *starting* with harm principles—show Policy B seems unharmful yet feels wrong. Then reveal nonidentity. Also, they'll infer "nothing matters for future generations," so I'll build in a rebuttal: contrast nonidentity cases (where identity changes) with fixed-identity harms like pollution.

  Time limits mean skipping person-affecting debates. Focus purely on why nonidentity creates a puzzle for standard harm principles. End with a diagnostic question: "Why doesn't 'they wouldn't exist otherwise' solve the problem?" If they articulate the harm intuition clash, they get it.

  Contested points: Some philosophers think nonidentity isn't a real problem, just a baseline confusion. I'll note this briefly without derailing the lesson. User wants neutrality—mark settled vs. debated clearly.

  Finally, their framing is sound, but I'll push back gently: Depletion *is* concrete enough if stripped to essentials. And misconceptions should be tackled proactively in the sequence, not reactively.
answer: |-
  Here’s a tight teaching plan for a 50-minute section:

  **Order & Example (30 mins total)**  
  1.  **(5 mins) Warm-up:** "When is an action harmful?" Elicit student examples. Establish baseline: harm usually requires making someone *worse off than they otherwise would be*.  
  2.  **(10 mins) Core Example (Use Parfit's Depletion):**  
      *   *Policy A (Sustainable):* Conserve resources. Future population exists, enjoys good lives (Life Quality: 100).  
      *   *Policy B (Depletion):* Use more resources now. Different future population exists (due to changed jobs, marriages, timing). Lives are worse but still worth living (Life Quality: 60).  
      *   **Crucial:** Hammer that Policy B causes *different specific people* to exist than Policy A. Life Quality 60 > non-existence (0), but 60 < 100.  
      *   **Include:** That Policy B *causes* the future people to exist *and* sets their life quality. **Exclude:** Complex causal chains, climate nuances (save time).  
  3.  **(10 mins) The Puzzle Setup:**  
      *   "Is Policy B wrong/harmful?" Apply the harm principle from step 1.  
      *   *For Future Person X under Policy B:* Are they worse off than *they* would be otherwise? No – without Policy B, *they wouldn't exist*. Person X isn't worse off; they owe their existence to it.  
      *   **Preempt "Can't Complain":** When they raise it (likely here), agree it *seems* true but point out: "Yet Policy B intuitively seems *worse* than A. What's wrong with it, if no one is harmed? That's the puzzle."  
  4.  **(5 mins) Why It's Weird:** Emphasize – the intuition that Policy B is bad clashes with the standard definition of harm. The nonidentity (different people) blocks the harm claim.  

  **Blocking Misconceptions (10 mins)**  
  *   **"So nothing matters?":** Hit this *immediately* after establishing the puzzle. Contrast:  
      *   *Nonidentity Cases (like Depletion):* Action changes *who* exists.  
      *   *Fixed Identity Harms (e.g., dumping toxins that give *specific future children* cancer):* Action makes *identifiable future people* worse off. Harm principle *does* apply. Stress most future-affecting actions (pollution, debt) *are* fixed-identity harms. Nonidentity is a *specific, weird* problem.  

  **What to Skip (Explicitly State)**  
  *   Solutions (Repugnant Conclusion, person-affecting views, rights-based approaches).  
  *   Deep dives into "what makes life worth living?" (Stick to "still worth living" as given).  
  *   Whether existence can be a "benefit" (keep it simple: 60 > 0).  

  **Diagnostic Question (Last 5 mins)**  
  *   **Ask:** "Why doesn't the statement 'But without Policy B, *that specific person* wouldn't exist to be harmed?' solve the problem? What does it leave unanswered?"  
  *   **Check For:** Understanding that it *prevents* labeling Policy B as *harmful* via standard definitions, yet the intuition that Policy B is *worse* than A persists. The puzzle is this clash.  

  **Contested vs. Settled**  
  *   **Settled:** The logical structure of the nonidentity problem itself (as described) is widely accepted *as a puzzle* for standard harm-based morality.  
  *   **Contested:**  
      *   Whether it's a *serious* problem or dissolves under scrutiny (baseline issues, alternative harm definitions).  
      *   *All* proposed solutions are contested.  
      *   The moral significance of causing someone to exist with a life worth living.  

  **Pushback on Framing:**  
  *   The floodwall example *can* work but risks getting bogged down in "how does rebuilding change *who* exists?". Depletion is cleaner. Stick with it, but make the identity-shift crystal clear ("different jobs -> different partners -> different sperm meets egg -> different people").  
  *   Don't assume they'll slide to "nothing matters." Proactively block it with the fixed-identity/future-identity distinction.
