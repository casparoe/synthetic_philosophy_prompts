  Okay, the user is a health economist who had a deep debate with a moral philosopher friend about Scanlon's contractualism. Let me unpack this carefully.

  First, the core conflict: The philosopher defends Scanlon's view that policies are wrong if reasonably rejectable by those burdened, with strict limits on aggregating small harms to outweigh large individual harms. The economist points out this contradicts QALY summation in cost-effectiveness analysis. Their argument hit a stalemate around commensurability.

  Hmm... the user wants three things: 
  1) A precise translation of Scanlon's concepts into health economics terms 
  2) A "residue report" showing what fits, what distorts, and what's untranslatable 
  3) Judgment on whether this reveals a gap in health economics or just semantic differences

  Let me tackle the translation first. "Reasonable rejection" maps well to opportunity cost in budget constraints - any allocation implicitly rejects some claims. The personal complaint focus aligns perfectly with non-aggregative equity weights that prioritize worst-off groups. The anti-aggregation principle is essentially a discontinuous threshold where small harms never outweigh catastrophic ones like death, violating separability.

  Now the residue analysis... The technical parts translate cleanly: opportunity cost framing, equity weights for priority to worst-off, and thresholds. But forcing the "reasonable rejection" standard into existing frameworks distorts it - Scanlon requires actual consent while HTA makes expert judgments. The untranslatable part is Scanlon's foundational individualism: his moral ontology where complaints aren't commensurable isn't just a weighting difference but a denial of the welfare economics framework itself.

  Ah, this is crucial - the residue reveals a genuine philosophical gap. Health economics assumes comparability as axiomatic, while Scanlon questions that axiom. No equity weight can capture "this comparison is morally impermissible." Their debate wasn't verbal; it's about whether to build a system that allows such comparisons at all.

  The user might be underestimating how radical Scanlon's challenge is. It's not about tweaking weights but rejecting the sum-ranking paradigm. Yet in practice, many HTAs already incorporate similar principles through severity adjustments and catastrophic cost thresholds - so the field might be more Scanlonian than it admits!

  I should emphasize that while the frameworks are irreconcilable at the foundational level, there are pragmatic convergences in policy application. The key insight for the user is that their dispute goes deeper than terminology - it's about the moral mathematics itself.
answer: |-
  Here’s a precise translation of your friend’s Scanlonian contractualism into health economics vocabulary, followed by a residue analysis:

  ### Translation to Health Economics Vocabulary  
  1. **Reasonable Rejection → *Budget Constraint Violation Under Individual Opportunity Cost***  
     A policy is "reasonably rejectable" if it imposes a burden on any individual that exceeds the opportunity cost of forgoing that policy under a fixed budget. Formally: An intervention is unjust if ∃ an individual *i* for whom the burden *Bᵢ* (e.g., loss of life, disability) is greater than the total health gain *ΣΔQALY₋ᵢ* distributed to others by that same budget allocation.  

  2. **Individualist Restriction on Complaints → *Non-Aggregative Equity Weights in Social Welfare Functions***  
     Complaints cannot be interpersonally summed; instead, equity weights *ωᵢ* are discontinuous and person-specific. The social welfare function (SWF) takes a *leximin* form:  
     *SWF = max min[ωᵢ ⋅ Uᵢ(H)]*  
     where *ωᵢ → ∞* for catastrophic burdens (e.g., death), making minor gains for others irrelevant. Comparisons are only valid pairwise (burdened individual vs. beneficiaries), not population-wide.  

  3. **Anti-Aggregation Claim → *Discontinuous Thresholds & Non-Separability***  
     A catastrophic loss (e.g., 1 death) cannot be outweighed by aggregating minor gains (e.g., 10,000 people avoiding a headache), no matter how large *N*. This implies:  
     - **Threshold effect**: A discontinuity at *Bᵢ ≥ T* (e.g., *T* = loss of 20 QALYs), where *T* acts as a moral veto.  
     - **Non-separability**: The QALY gain function is *non-additive* across persons when *Bᵢ > T*.  

  ---

  ### Residue Report  
  **I. Clean Translation (Implementable in HTA)**  
  | Scanlonian Concept          | HTA Implementation                                                                 |  
  |------------------------------|------------------------------------------------------------------------------------|  
  | Priority to worst-off       | Equity weights for severity (e.g., NICE’s severity modifier, WHO fairness weights) |  
  | Individual catastrophic burden | Explicit QALY loss thresholds (e.g., Norway’s "rule of rescue" in coverage decisions) |  
  | Pairwise reasonableness     | Equity-weighted ICERs comparing subgroups (e.g., burdened vs. non-burdened)       |  

  **II. Distorted Translation (Requires Framework Violation)**  
  | Concept                     | Distortion Required                                                                 |  
  |-----------------------------|-------------------------------------------------------------------------------------|  
  | "Reasonable rejection"      | HTA must accept *individual veto power* over allocations—incompatible with population efficiency. |  
  | Non-aggregation of minor harms | Requires setting *ωᵢ = ∞* for *Bᵢ ≥ T*, making ICERs undefined for affected interventions. |  
  | Complaint-based justification | Forces HTAs to evaluate *each individual’s complaint*—operationally infeasible for population policies. |  

  **III. Untranslatable Residue**  
  1. **Moral Incommensurability**: Scanlon denies QALYs/DALYs are valid *common currency*. Health economics assumes comparability; Scanlon rejects it axiomatically.  
  2. **Grounds for Complaint**: Scanlon’s "personal reasons" include non-health burdens (autonomy, dignity) outside QALY metrics.  
  3. **Proceduralism**: "Reasonable rejection" is a deliberative standard—not a computable threshold—demanding justification *to the burdened individual*.  

  ---

  ### Verdict: Genuine Gap or Semantic Dispute?  
  **Genuine gap exists**—but *not* one resolvable by existing equity weights or thresholds.  

  - **What health economics misses**:  
    The **moral primacy of individualized justification**. Scanlon’s framework is fundamentally *procedural* (Was this policy justifiable *to you*?) while cost-effectiveness is *consequentialist* (Did it maximize aggregate welfare?). No equity weight can capture the requirement that an individual must *accept* the reason for their burden.  

  - **What dissolves under scrutiny**:  
    The "aggregation problem" *partially* collapses. Real-world HTAs already use:  
    - Thresholds for catastrophic burdens (e.g., cancer drug exceptions)  
    - Non-linear weighting (e.g., logarithmic QALY aggregation)  
    However, these are **pragmatic compromises**, not implementations of Scanlon’s core ethics. Your friend’s insistence on *strict non-aggregation* (1 death ≠ ∞ headaches) remains irreconcilable with summation-based QALY models.  

  **Conclusion**: Your debate was **substantive, not verbal**. Health economics lacks the apparatus to operationalize Scanlon’s requirement of *individual moral justifiability*, which rejects welfare aggregation itself. Yet in practice, many HTAs incorporate Scanlon-like priorities (severity weighting, rule of rescue) without accepting his anti-aggregation axiom. The residue reflects a foundational divide: **consequentialism vs. contractualist deontology**. To bridge it, you’d need a deliberative process (e.g., citizen juries) to set thresholds—not just recalibrate weights.  

  *Recommendation for your next debate*: Argue that *discontinuity thresholds in ICERs* (e.g., "Never sacrifice 1 life for <100,000 QALYs") functionally approximate Scanlon’s anti-aggregation while preserving commensurability. His counter will reveal whether the gap is technical or existential.
