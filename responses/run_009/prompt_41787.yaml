answer: |-
  Your request is precise, and I appreciate the clarity of your professional framework. Let's walk through Jackson's thought experiment as you'd encounter it in a colour lab, then dissect what holds and what fractures under translation.

  **Mary Translated:**  
  Mary possesses a complete physical database: every known surface reflectance spectrum, every illuminant SPD, the precise Stockman & Sharpe cone fundamentals, the full model of chromatic adaptation (von Kries, CIECAT, or beyond), the non-linear transforms to opponent channels (perhaps a detailed CIELAB or IPT variant), and the neural noise characteristics of human vision. She understands metamerism exhaustively: for any given adaptation state and illuminant, she can list all spectra producing identical LMS excitations and predict when two spectra will be distinct in cone response despite matching in XYZ. She has equations mapping any viewing condition to predicted appearance attributes (lightness, chroma, hue). Her knowledge isn't static; she can simulate any observer state computationally. Crucially, she has never *experienced* cone excitation or opponent responses firsthand—her entire interaction is with spectral data and model outputs.

  She exits and sees a red rose. Under standard illuminant D65, her M-cones are minimally stimulated, L-cones highly, S-cones moderately. Her adapted visual system transforms this to high a* (CIELAB) or intense redness (CIECAM). The question: what did she gain?

  **The Replies in Your Terms:**  
  1.  *Ability Hypothesis:* Mary gained no new *data* about spectra, illuminants, or transforms. She acquired *skills*: the capacity to rapidly recognize a specific opponent-channel state (e.g., high L-M activity under adaptation) as "red" without calculation, to imagine it voluntarily, or to match it visually across contexts. It’s like moving from having a perfect CIE standard observer model to *being* that observer – operationalizing the model in real-time perception.  
  2.  *Phenomenal Concept Strategy:* Mary already knew the *fact* that roses reflect long-wave-dominant spectra causing high L-M opponent responses under D65. What changed is she now possesses a *direct referent* for that state – a "label" generated by the visual system itself. Think of it as her visual cortex generating a unique 'tag' (the phenomenal red) for a specific pattern of cone-derived opponent activity she previously only described mathematically. The fact (the neural state correlated with "red") was known; the introspective tag wasn't.  
  3.  *Jackson's Recantation (Physicalism):* Jackson later argued that upon seeing red, Mary merely undergoes a *physical event* (a specific pattern of cone excitations transformed into opponent signals) that she could always *describe* physically. The "newness" is just the first-person instantiation of that known physical process – like running the simulation on wetware instead of software. There's no extra non-physical fact, just the difference between *describing* a transform and *executing* it neurally.

  **The Residue Report:**  
  *What Maps Cleanly:*  
  -   **"Physical Facts" = Complete spectral/physiological models:** This maps perfectly. Mary's knowledge is your daily toolkit: spectra, fundamentals, adaptation transforms, opponent encodings, noise models.  
  -   **Metamerism Distinction:** The core difference between spectral identity and experiential identity is central to your work. Mary knows spectra that produce identical cone responses for her (metamers) *and* those that don't.  
  -   **Specification vs. Instantiation:** The gap between tristimulus values (a *description* of a stimulus) and the *occurrence* of the opponent-channel state in an adapted observer is fundamental to your field. This cleanly captures the "knowing the description vs. having the experience" dichotomy.  
  -   **Ability Hypothesis:** Framing the gain as acquiring recognitional/imagistic skills aligns well with the distinction between computational modeling and real-time perceptual performance.

  *What Distorts:*  
  -   **"Phenomenal Concepts":** Translating this as a "neural tag" for a known opponent state *flattens* it. Philosophers intend this "tag" to have a unique, intrinsic, subjective quality absent from the physical description. In your terms, it's smuggled in as an unexplained *property* of the opponent signal instantiation, not just its occurrence. The distortion leans physicalist.  
  -   **"New Fact":** Jackson's original claim hinges on Mary learning a *fact* about the world (what seeing red *is like*). In your framework, the only plausible "new fact" is the *first-person report* of her own neural state ("Now I know *this* neural state feels like *this*"). This turns the "fact" inward, making it autobiographical data about her own processing, not about colour itself. This subtly shifts the argument.

  *What Has No Expression:**  
  -   **The Intrinsic "What-It's-Like"-ness (Qualia):** Your vocabulary describes observer *states* (e.g., high L-M activity) and *responses* (discrimination, matching). It has no term for the intrinsic, felt character seemingly *associated* with that state – the "redness" itself as a subjective quality. Philosophers argue *this* is what Mary learns. You can describe the neural correlate of "seeing unique red" exhaustively, but the framework remains silent on *why that particular state has that particular feel*, or if the "feel" is anything beyond the state+reporting. This is the irreducible residue.  
  -   **The Explanatory Gap:** Your models predict *discrimination* and *appearance attributes* from physical inputs. They don't purport to explain *why* experiencing high L-M activity subjectively feels like "redness" rather than nothing, or like "coolness", or why it feels like *anything* at all. The knowledge argument exploits this gap: knowing all the physical/functional correlates doesn't seem to tell you *that* specific experiential quality. Your vocabulary lacks tools to even formulate this gap within its own terms; it simply describes the correlates.

  **Test Case 1: Tetrachromatic Mary**  
  Mary is a standard trichromat. She possesses complete physical knowledge of a tetrachromat observer: the fourth cone fundamental, the expanded opponent channel transforms, metamers for tetrachromats, etc. She *cannot*, however, simulate or experience the tetrachromat's unique channel states. Upon gaining tetrachromacy (somehow), she would presumably learn something new: the experiential quality associated with the fourth channel's activity.  
  *Translation Impact:* This case *magnifies* the residue. Your framework readily distinguishes her trichromatic limitations from the tetrachromat's physical data. The untranslatable "what-it's-like" for the novel tetrachromatic channel state becomes starkly clear. The argument structure holds, but the unexplained residue – the novel quale – becomes even more pronounced and harder to dismiss as mere skill acquisition. It highlights that the gap isn't just about *her* encoding, but about novel *types* of encodings fundamentally.

  **Test Case 2: The Metamer Worry**  
  Mary knows spectra A and B are distinct (differing in IR reflectance) but metameric for her under D65, producing identical LMS→opponent states. When she sees A (or B), she experiences "metameric red". Has she learned something new about A or B beyond her data? In your terms: No. She instantiates the opponent state she predicted. She learns the quale associated with *that shared opponent state*, but nothing new about spectrum A *specifically* that distinguishes it from B *in her experience*. The knowledge argument doesn't turn *only* on description vs. encoding instantiation; it turns on the claim that the quale itself (associated with the instantiated state) is a new fact. The metamer case shows she learns *less* (no distinction between A/B) experientially than she knew physically, yet gains *something* new (the quale of the metamer match) that wasn't in her physical database. The residue – the quale – persists as the novel element.

  **Judgement on the Residue:**  
  Your vocabulary is *incomplete* for the philosophical task, not inadequate for your scientific one. It perfectly describes the physical, physiological, and computational processes of colour vision. What it cannot capture – and what colour science, as currently constituted, doesn't require – is the *subjective significance* of those processes. Philosophers point to this significance (qualia) as a real feature demanding explanation. The residue indicates this:  
  1.  **Your framework *assumes* the link:** You correlate neural states with perceptual reports ("the observer calls this 'unique red'"). The framework works because this correlation holds. It doesn't explain *why* the correlation holds at the level of subjective feeling.  
  2.  **The gap is real, but perhaps inert:** For predicting discrimination, adaptation, or appearance, the residue is irrelevant. Your models succeed without it. Philosophers argue it points to a deeper truth about consciousness your models don't address.  
  3.  **Distortion vs. Illusion:** The flattening of phenomenal concepts into "neural tags" might be a distortion of the philosopher's intent... or it might reveal that the philosopher's "qualia" is an illusion generated by the reporting mechanisms your models describe. Jackson's later view leans here.

  Honestly? Your vocabulary exposes the knowledge argument's core move: pointing to the first-person instantiation of a known process and declaring "This feels like *something*, and that 'something' wasn't in the data!" Whether this reveals a genuine gap in physicalism or merely a cognitive limitation in *grasping* what complete physical knowledge entails remains contested. Your work shows *where* philosophers must engage if they want their arguments to bite against colour science: not on the physics or physiology, but on the nature of subjective reportage arising from complex neural encodings. The residue is the itch you don't scratch because your job is to model the skin, not the itch itself. Whether the itch is real or neural noise is the unresolved question.
