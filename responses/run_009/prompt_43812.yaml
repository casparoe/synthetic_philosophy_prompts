  Internal consistency? The practice prioritizes replication for new claims but accepts established facts. This isn’t inconsistent but pragmatic. Resources are limited. Trust in background knowledge enables focusing on frontier research. Changing this would require verifying everything, which is impractical. A strictly verificationist lab would be paralyzed, constantly checking melting points or constants instead of advancing.

  The user also asks where rival accounts of testimony could fit. Reductionism, Nyāya, and maybe social epistemology (knowledge as collective) might all work, but with different philosophical baggage. The practice itself doesn’t dictate one theory; it’s underdetermined. The lab functions as long as trust is granted, regardless of its philosophical basis.

  Finally, replacing with verificationism: science would slow to a crawl. Collaboration would suffer, instruments would need constant reinvention, and education would be impossible. The user’s career exemplifies how science thrives on shared knowledge, not individual verification.

