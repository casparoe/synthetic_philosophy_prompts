  Okay, let me start by unpacking the user's query. They've been part of a rationalist meetup for 12 years and noticed that David Lewis's modal realism hasn't been covered, which is surprising given the group's focus on possible worlds as tools. They're tasked with teaching a session and need a solid plan. 

  First, I need to understand their main concerns. They're worried about the sequence: starting with possible worlds as semantics versus jumping straight into ontology. The key is to avoid the bait-and-switch feeling. The audience knows Kripke semantics but not Lewis's realism. Bridging that gap smoothly is crucial. 

  The user wants a carrying example. Chess moves are their idea, but I should consider alternatives. Something concrete that shows the necessity of possible worlds without ontology. Maybe a decision-making scenario? Chess works because it's familiar, but I need to ensure it doesn't lead to quantum confusions. 

  Misconceptions are a big deal. The user listed three: conflating with quantum multiverse, nihilism, and modal collapse. I should address each preemptively. Also, counterpart theory might be tricky. People might think it's about personal identity, but it's a semantic tool. How to clarify that without getting bogged down? 

  The parsimony objection is predictable. The user wants to tackle qualitative vs. quantitative parsimony. But diving into ersatz worlds could derail the session. Maybe just contrast briefly and emphasize Lewis's trade-off. 

  For checking understanding, a question that tests the indexicality of "actual" is needed. Something like "Is there a world where we're all unicorns?" to see if they grasp that actuality is relative. 

  Time management is essential. The user has 90 minutes. Formal counterpart theory and debates with van Inwagen are out. Announcing omissions upfront keeps focus. Mentioning Eliezer Yudkowsky's stance might stir the room, so it's better as optional discussion material. 

  Looking deeper, the user might be concerned about group dynamics. Some attendees treat the Sequences as dogma. Avoiding a referendum on Yudkowsky while still acknowledging his view is tricky. Presenting it as a foil without endorsing could work. 

  Also, the grad students might want more depth, but the primary audience is programmers. Balancing technicality with accessibility is key. Using analogies like "here" for indexicals and contrasting with Kripke helps. 

  Finally, ensuring the session flows without getting stuck on objections. Structuring each part with clear transitions, preempting misconceptions, and having a strong example will keep engagement high. The chess example seems solid, but emphasizing its non-quantum nature is vital.
answer: |-
  Here’s a battle-tested teaching plan optimized for your rationalist audience, balancing clarity, engagement, and preemptive misconception-nuking:

  ---

  ### **1. Sequencing: Start Semantics → Escalate to Ontology**
  **Order:**  
  `Kripkean Tool → Counterfactual Pull → Lewisian Leap → Objections/Clarifications`  
  **Why:**  
  - **Avoids bait-and-switch:** Start with what they know (possible worlds as semantic devices), show the *explanatory gaps* left by "just a tool," then reveal Lewis’s move as a solution ("This is why he thinks they *must* be real").  
  - **Dependencies:** Their familiarity with Kripke semantics is the anchor. Use it to highlight *what Lewis agrees with* (worlds are useful for modality) and *where he diverges* (they’re not abstract models).  
  - **Key transition:** "If worlds do all this work across logic, language, and decision-making, what *are* they? Lewis says: take them literally."

  ---

  ### **2. Carrying Example: Chess (But Modified)**
  **Use:**  
  *"Your queen sacrifice (Qf7!!) wins because in *most nearby worlds* where you play it, Black’s king position collapses."*  
  **Why it works:**  
  - Concrete, decision-relevant, leverages their CS/DT instincts.  
  - Forces engagement with "nearby worlds" (similarity metrics) and probabilistic outcomes.  
  **Crucial Modifications:**  
  - **EXPLICITLY DECOUPLE FROM PHYSICS:** "These aren’t quantum branches. Worlds differ in *initial conditions, laws, or history*—no wave functions here."  
  - **AVOID:** Examples involving personal identity ("A world where *you* are a pirate") until counterpart theory is briefly introduced.  
  **Alternative:** A causal decision theory case (e.g., Newcomb’s Problem with counterfactual dependence).

  ---

  ### **3. Misconception Takedowns (Preemptive & Integrated)**
  | Misconception                          | When to Head Off                         | Response                                                                 |
  |----------------------------------------|------------------------------------------|--------------------------------------------------------------------------|
  | **i. "It’s the quantum multiverse!"**  | IMMEDIATELY after introducing worlds     | "Lewisian worlds are *logically* possible, not quantum branches. They can have magic, different physics, or unicorns—no relation to Everett." |
  | **ii. "Nihilism!"**                    | When discussing "actual" as indexical    | "Your actions matter *because* they affect which world-segment *you* inhabit. Saving a child here matters *here*, even if it dies elsewhere. 'Actual' is like 'here'—not a cosmic value judgment." |
  | **iii. "Modal collapse!"**             | After defining possibilia                | "Impossible worlds don’t exist! Worlds are maximal *consistent* entities. No world contains round squares—Lewis preserves modal distinctions." |
  | **iv. Counterpart Confusion**          | If de re modals arise (e.g., "Could *I* be a fish?") | "Lewis rejects transworld identity. You don’t exist elsewhere. A *counterpart* (similar entity under counterpart relations) does. This avoids haecceitism, it’s not a claim about personal identity." |

  **Failure Mode on Counterparts:** People think Lewis claims "you have infinite copies." Clarify: *You* exist only here. Other worlds have *distinct* beings *analogous* to you under context-dependent similarity.

  ---

  ### **4. Parsimony Objection: Quick & Decisive**
  **Response Script:**  
  *"Lewis flips the script: Yes, he has infinite worlds, but ONLY ONE KIND OF THING: concrete spatiotemporal universes. His 'competitors' (ersatzists) need abstract entities, primitive modality, or unanalyzable 'truthmakers'—which are* ***new kinds*** *of metaphysical baggage. Lewis trades quantitative bloat for qualitative simplicity. Is that trade-off worth it? Debate later!"*  
  **Do NOT dive into ersatzism.** Label it "the mainstream alternative" and move on.

  ---

  ### **5. Check for Understanding: The Indexicality Test**
  **Question:**  
  *"In a world W where dolphins evolved hands and built cities, is the statement 'No actual beings build cities' true or false as uttered in W?"*  
  - **Correct answer:** FALSE (for speakers in W).  
  - **Wrong answer:** TRUE (reveals residual absolutism about "actual").  
  - **Follow-up:** "What if uttered by *us*?" → TRUE (shows context-dependence).

  ---

  ### **6. Strict Omissions & Time Management**
  **Announce upfront:**  
  *"To fit 90 mins, we skip:  
  - Formal counterpart theory (it’s a semantics for de re modality)  
  - Debates w/ van Inwagen (e.g., 'Are there chairs?')  
  - Objections from haecceitism/truthmaking  
  Ask me after!"*  
  **Why upfront:** Manages expectations, avoids "wait, what about...?" derails.

  ---

  ### **Side: The Eliezer Line**
  **Handle like this:**  
  - **IF** raised, say: *"Lewis would reply: 'If worlds are just made-up, what grounds the truth of your counterfactuals or probabilities?' The Sequences use possible worlds constantly—Lewis asks you to take their metaphysics seriously."*  
  - **Do NOT** make it a foil unless asked. If pushed: "This is a big debate! Lewis’s case turns on whether we can make sense of modality *without* ontological commitment."

  ---

  ### **Session Flow (90 mins)**
  1. **Hook (5 min):** Chess example → Why "nearby worlds" feel indispensable for decisions.  
  2. **Semantics Refresher (10 min):** Kripke models for □/◇, counterfactuals. Emphasize: worlds as undefined primitives.  
  3. **The Gap (10 min):** What *are* these worlds? Can "made-up constructs" explain similarity, probability, or actuality?  
  4. **Lewis’s Big Idea (15 min):** Concrete worlds, indexical "actual," no privileged reality.  
  5. **Objections Takedown (20 min):** Preempt quantum/nihilism/modality collapse/counterparts.  
  6. **Parsimony & Why Care (10 min):** Trade-offs, applications (modality without magic).  
  7. **Indexicality Check (5 min):** Dolphin world question.  
  8. **Q&A (15 min):** Flag omissions upfront. Pre-load parsimony/dolphin answers.

  ---

  **Why this works:** Leverages their intuitions about worlds-as-tools, exposes the metaphysical vacuum in instrumentalism, and positions Lewis as offering a brutally coherent (if extravagant) solution. The chess example grounds it; preemptive strikes prevent derailment.
