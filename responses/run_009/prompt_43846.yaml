  Okay, let me unpack this ethics debate between Priya and Dan. The user is in an upper-level seminar on demandingness objections to consequentialism and needs help adjudicating their classmates' 40-minute coffee argument. 

  First, I need to map their exchange clearly. Priya starts with the classic demandingness objection: consequentialism requires near-total self-sacrifice that invalidates ordinary life. Dan counters that this is just a biased intuition shaped by evolutionary psychology. Priya then shifts to the "integrity" argument - that consequentialism reduces individuals to value-conduits. Dan responds with two points: 1) "too demanding" lacks a non-arbitrary threshold, and 2) commonsense morality faces similar problems (drowning child case). Finally, Priya invokes fair shares/capped duties, which Dan dismisses as smuggling in non-consequentialist cooperation norms.

  Hmm, the user also hints at an unexplored angle: the asymmetric stakes of moral error. When we under-demand, others suffer; when we over-demand, we bear the cost. That's worth flagging since neither student mentioned it.

  Now, assessing each move:
  - Priya's opening is rhetor effective but philosophically thin - she's right about implications but wrong to treat demandingness as automatically fatal. Rating: Partly right.
  - Dan's intuition-dismissal oversimplifies - he correctly notes evolutionary origins but wrongly implies intuitions are irrelevant. Rating: Partly right.
  - Priya's integrity point is stronger - Williams' objection has weight, though Dan will likely say consequentialism can accommodate projects via rules or long-term value. Rating: Mostly right.
  - Dan's threshold complaint is sharp - "too" does imply a line, and where to draw it isn't obvious. But his drowning-child analogy is imperfect since commonsense morality isn't systematically demanding. Rating: First point strong, second weaker. 
  - Priya's fair-shares idea resonates practically but conflicts with consequentialism's outcome-focus. Dan correctly spots the theoretical switcheroo. Rating: Priya practically appealing but theoretically shaky; Dan solid here.

  Overall? Dan edges it on logic (consequentialism's consistency), but Priya wins on human plausibility. The user's asymmetry point is excellent - it reframes demandingness as risk allocation. Under-demanding harms others; over-demanding harms self. That tilt might justify leaning toward demandingness. Should mention that.
answer: |-
  Here's a move-by-move adjudication of Priya vs. Dan, with ratings and reasons, followed by an overall verdict and the reframing point you mentioned:

  ### Move-by-Move Analysis
  1. **Priya’s Opening (Demandingness as Fatal)**  
     *Rating: Partly Right, but Overstated.*  
     She’s correct about the *implications* of strict maximizing consequentialism (e.g., Singer’s "shallow pond" logic extended globally). But calling it "fatal" assumes intuitive unreasonableness alone refutes the theory, which Dan rightly challenges.  

  2. **Dan’s First Reply (Intuition is Broken)**  
     *Rating: Mostly Right.*  
     He correctly notes that evolved intuitions (e.g., proximity bias, Dunbar’s number limits) aren’t reliable guides in a globalized world. The "arithmetic" analogy is strong: discomfort ≠ falsehood. But he underplays how deeply this clashes with human psychology.  

  3. **Priya’s Integrity Objection**  
     *Rating: Strong Point.*  
     Invoking Bernard Williams’ "integrity" objection is valid: reducing all personal projects to disposable value-sources *is* dehumanizing. Demandingness isn’t just about effort—it’s about alienation. "A theory humans can live by" *is* a legitimate constraint (contra Dan).  

  4. **Dan’s Two Replies:  
     a) Threshold Problem**  
     *Rating: Clever but Flawed.*  
     Yes, "too demanding" implies an arbitrary line (why 10% sacrifice? Why not 50%?). But this dodges Priya’s core point: consequentialism doesn’t just demand *a lot*—it demands *everything* until marginal utility flattens. That’s qualitatively different from threshold debates.  
     **b) Commonsense Morality is Also Demanding**  
     *Rating: Weak.*  
     The drowning child case shows commonsense morality *can* be demanding, but not *systematically* so. Consequentialism makes extreme demands a permanent feature of ethical life. False equivalence.  

  5. **Priya’s Fair Shares Argument**  
     *Rating: Intuitive but Theoretically Shaky.*  
     "Capped duties" resonate (e.g., Murphy’s *Moral Demands in Nonideal Theory*), but Dan is right: this smuggles in deontic cooperation norms. If the *goal* is minimizing suffering, others’ noncompliance *should* increase your duty (e.g., if neighbors ignore a burning house, you don’t stop at "your share" of bucket-duty).  

  6. **Dan’s Reply to Fair Shares**  
     *Rating: Clearly Right.*  
     He nails it: fair shares presuppose a cooperative framework alien to consequentialism’s telos. Consequentialism cares about *outcomes*, not "doing your part" in a hypothetical collective. Priya’s move *does* implicitly reject pure consequentialism.  

  ### Overall Verdict
  **Dan wins on logic, Priya on human plausibility—but Dan edges it.**  
  - Dan better defends consequentialism’s *internal consistency*: if minimizing suffering is the goal, his responses hold. Priya’s critiques often rely on external values (integrity, fairness) consequentialism explicitly rejects.  
  - Priya exposes real weaknesses: consequentialism *is* alienating and psychologically unrealistic. But calling it "fatal" overreaches—many consequentialists (e.g., rule-utilitarians) modify the theory to address this.  

  ### The Crucial Reframing You Mentioned
  **Yes! The asymmetry of moral error is a major missing piece.**  
  - **Under-demanding cost:** Others suffer/die.  
  - **Over-demanding cost:** You sacrifice projects, relationships, etc.  
  This asymmetry *heavily* favors consequentialism. As philosopher Peter Unger argues in *Living High and Letting Die*, when stakes are life/death for others vs. lifestyle loss for you, erring toward demandingness is morally safer. Priya treats "no independent standing for personal projects" as a *reductio*, but consequentialists reply: "Why should your hobbies outweigh strangers’ lives?"  

  ### Key Takeaway for Your Seminar
  This debate reveals the irreconcilable clash between:  
  1. **Agent-neutrality** (consequentialism): Value exists independently of agents; you’re a tool to maximize it.  
  2. **Agent-centeredness** (deontology/virtue ethics): Moral life includes permissions to prioritize your own projects.  

  Neither "wins"—it’s a foundational divide. But Dan’s defense is more coherent *if* you accept the premise that morality is about outcomes. Priya’s arguments work only if you reject that premise upfront. Your shower thought? **It’s a profound point that shifts the burden of proof onto anti-demandingness views.**
