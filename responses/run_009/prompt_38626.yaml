prompt: |-
  I spent thirty-five years as an epidemiologist before retiring, and one habit from the bench I cannot shake is asking what a claim has to deliver before it counts as established. In my old field we had Koch's postulates: explicit criteria for when a microbe could be said to cause a disease. I have lately been reading discussions of artificial intelligence and human prospects, and they keep leaning on something people call the strategy-stealing assumption: roughly, that any strategy humans could use to secure an advantage over sufficiently capable AI systems is a strategy those systems could use just as well, so that if humans are to retain an edge, it must come from strategies that are in some way unavailable to machines. The assumption is doing a lot of quiet argumentative work, yet I have not found anyone state what a careful version of it would have to get right. So, before I read further, I want the specification settled. Write the desiderata: what any adequate precisification of the assumption must deliver. I would expect the list to cover, at minimum, which cases it must classify correctly (mutual-destruction standoffs versus ordinary economic competition; strategies that depend on embodiment, on being recognized and trusted as human, or on building coalitions among humans); which distinctions it must respect (between copying a strategy and having the means to execute it; between there being no human-favoring strategy and the best such strategy being only marginally better; between what holds at parity of capability and what holds under large asymmetries); and which empirical facts about how strategies actually spread and are countered it cannot contradict. For each requirement, give the case or consideration behind it, mark it non-negotiable or a preference of one camp, and flag any subset of the requirements you suspect is jointly unsatisfiable -- that possibility is what I most want to see, since a spec that cannot be met is itself a result. Then, and only briefly, score two readings I have encountered against your list: the narrow reading on which "strategy" covers only informational and computational moves, and the broad reading on which it covers anything an agent intentionally does to gain advantage. I am less interested in the scorecard than in whether either reading can meet the non-negotiables.
reasoning: |-
  Okay, the user is a retired epidemiologist with 35 years of experience, so they're used to rigorous scientific frameworks like Koch's postulates. They're now diving into AI safety discussions and encountered the strategy-stealing assumption (SSA). They want a clear specification of what a solid version of SSA must include before they proceed. 

  Hmm, they're essentially asking for a "Koch's postulates for SSA." That's a smart approach—translating their epidemiology rigor to a new field. Their request is very structured: they want desiderata covering classification cases, key distinctions, empirical constraints, and potential contradictions. 

  I notice they're particularly wary of "quiet argumentative work"—that phrase suggests they've spotted hand-wavy logic in AI discussions and want to pressure-test SSA. Their examples (mutual destruction vs. competition, embodiment, trust) show they're thinking about real-world edge cases. And the joint unsatisfiability point? That's the epidemiologist's instinct: "What if this 'postulate' is fundamentally flawed?"

  Let me unpack their implied needs:
  - They want to know if SSA is a robust concept or a rhetorical sleight-of-hand.
  - They're signaling skepticism about whether any version can handle all real-world complexities (hence the "jointly unsatisfiable" ask).
  - The scoring of narrow vs. broad readings feels secondary; they really want to see if either survives the non-negotiables.

  The challenge: SSA isn't a formal theorem—it's a heuristic. So I need to distill the core claims AI safety folks rely on while flagging where it might break. Those embodiment cases (e.g., needing human biology) seem like landmines for SSA. And the distinction between strategy replication vs. execution? Crucial—a superintelligence might "steal" a strategy but lack the physical or social means to deploy it. 

  For the scoring, the narrow reading fails fast (can't handle physical/biological cases), while the broad reading overreaches—it risks becoming tautological ("if humans have an advantage, it's definitionally unstealable"). Neither scores well, but the user expected that. Their real goal was to expose SSA's limits, and the answer is: yes, there are likely unresolvable tensions in the desiderata.
answer: |-
  Below is a structured specification of desiderata for a rigorous "Strategy-Stealing Assumption" (SSA), informed by your demand for epidemiological-grade clarity. The list prioritizes **non-negotiable** requirements for conceptual coherence over domain-specific preferences, flags tensions, and evaluates two common readings.

  ---

  ### **Desiderata for an Adequate SSA Precisification**
  *(Non-negotiables marked ⚠️; preferences/contextual tensions marked ⚖️)*

  1.  **⚠️ Correct Classification of Core Cases:**  
      - **Must correctly classify:**  
        - Mutual-destruction standoffs (e.g., nuclear deterrence) as **non-stealable** (requires mutual vulnerability).  
        - Ordinary economic competition (e.g., patent races) as **stealable** (algorithms replicate arbitrage).  
      - **Why:** Standoffs rely on *asymmetric stakes* (human survival > AI goals) or *irreplicable human traits* (e.g., evolved loss aversion). Economic strategies are purely informational.  
      - **Non-negotiable:** Misclassifying deterrence undermines SSA’s role in existential risk debates.

  2.  **⚠️ Distinguishing Strategy Replication vs. Execution:**  
      - **Must respect** that copying a strategy’s *description* ≠ possessing *capacity* to execute it.  
      - **Case:** A strategy requiring human biology (e.g., hormone-driven bluffing in negotiations) or legal personhood (e.g., voting) may be understood but not executable by AI.  
      - **Non-negotiable:** Without this, SSA implies omnipotence from comprehension (a known fallacy).

  3.  **⚠️ Handling Embodiment & Trust:**  
      - **Must address** strategies relying on:  
        - Biological embodiment (e.g., deploying biometric sensors inaccessible to AI).  
        - Being perceived/trusted as human (e.g., gaining entry to human-only spaces).  
      - **Why:** If "stealing" requires functional equivalence, strategies exploiting *materiality* or *identity* resist transfer.  
      - **Non-negotiable:** Central to debates on human-AI competitive niches.

  4.  **⚖️ Coalition-Building & Social Proof:**  
      - **Should ideally classify** strategies leveraging human-exclusive networks (e.g., forming unions against AI management).  
      - **Tension:** If AI can *infiltrate* or *simulate* human networks, this may become stealable.  
      - **Preference:** "Strong SSA" advocates dismiss this; "weak SSA" proponents see it as critical.

  5.  **⚠️ Distinguishing No Strategy vs. Marginal Advantage:**  
      - **Must separate** "no human-favoring strategy exists" from "best strategy yields negligible gains."  
      - **Why:** SSA often argues for *zero* human advantage; conceding marginal strategies (e.g., 0.1% edge) reframes risk calculations.  
      - **Non-negotiable:** Policy outcomes hinge on this distinction.

  6.  **⚠️ Capability Asymmetry Scope:**  
      - **Must define applicability conditions:**  
        - Holds only under *sufficient AI capability* (e.g., superintelligence).  
        - Fails under large *human advantage* (e.g., humans control AI's power source).  
      - **Why:** SSA is vacuously true if AI is vastly weaker, or false if humans hold decisive asymmetric leverage.  
      - **Non-negotiable:** Unstated boundary conditions invite misuse.

  7.  **⚖️ Empirical Plausibility of Strategy Transfer:**  
      - **Must not contradict** how strategies spread/counter in reality:  
        - Some strategies require tacit knowledge (e.g., craftsmanship) resistant to codification.  
        - Counters often involve novel context-aware adaptations, not replication.  
      - **Tension:** AI’s ability to model humans may overcome this; hinges on disputed cognitive assumptions.  
      - **Preference:** Critics demand alignment with organizational theory; proponents assume perfect modeling.

  ---

  ### **Tensions & Joint Unsatisfiability**
  - **Core Conflict:** Desiderata **2 (Execution Capacity)**, **3 (Embodiment/Trust)**, and **7 (Tacit Knowledge)** likely **jointly unsatisfiable** with a strong SSA.  
    - *Why:* If SSA requires strategies to be stealable *merely by being comprehensible*, it contradicts the empirical reality that many advantages (e.g., trust networks) are non-transferable without specific physical/social substrates. A "perfect" SSA must either deny substrate-dependence (implausible) or accept limits to stealing—undermining its use in existential risk arguments.  

  ---

  ### **Evaluation of Two Readings**
  *(Scored against non-negotiables: ✓ = satisfies, ✗ = fails, ~ = partial)*

  1.  **Narrow Reading (SSA-N):**  
      *"Strategy" = informational/computational moves (e.g., game theory tactics, data analysis).*  
      - **1:** ✓ (Economic strategies stealable; standoffs not purely informational → misclassified).  
      - **2:** ✗ (Assumes comprehension → execution).  
      - **3:** ✗ (Ignores embodiment/trust).  
      - **5:** ~ (Plausible for digital realms).  
      - **6:** ✓ (Explicitly capability-bound).  
      - **Verdict:** **Fails non-negotiables 2 & 3.** Only viable in abstract, closed-system models.

  2.  **Broad Reading (SSA-B):**  
      *"Strategy" = any intentional advantage-gaining action (e.g., forming alliances, using legal rights).*  
      - **1:** ✓ (Correctly classifies deterrence as non-stealable).  
      - **2:** ~ (Acknowledges execution limits but often handwaves AI's ability to proxy them).  
      - **3:** ~ (Addresses embodiment but assumes AI can bypass via simulation/surrogates).  
      - **5:** ✗ (Tends to conflate marginal gains with no viable strategy).  
      - **6:** ✗ (Rarely specifies capability thresholds, overgeneralizes).  
      - **Verdict:** **Fails non-negotiables 5 & 6**, and risks tautology (e.g., "unstealable strategies are those AI can't steal"). Survives only by being underspecified.

  ---

  ### **Conclusion**
  No existing reading satisfies all non-negotiables. **SSA-N** is coherent but empirically inadequate; **SSA-B** is flexible but either tautological or false under capability constraints. The unresolved tension—**whether substrate-dependent strategies *must* be stealable by superintelligence**—suggests SSA cannot bear the argumentative weight placed on it without significant, possibly unattainable, qualification. This aligns with your suspicion: a specification meeting *all* desiderata appears **jointly unsatisfiable**, revealing SSA as a heuristic, not a universal law. Proceed with scrutiny for hidden premise slippage, especially in "broad" formulations.
