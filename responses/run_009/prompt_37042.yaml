  ok so this might be a dumb question but im writing an essay for my physics class and got stuck. we just covered einstein's hole argument, and the way my teacher explained it: you take a region of spacetime with no matter in it (the "hole"), and einstein showed that the equations of general relativity cant pin down where the gravitational field is inside the hole — you can slide all the fields around inside that region and the same equations still say yes to the result. so general relativity is indeterministic, the future isnt fixed, einstein basically beat quantum mechanics to proving the universe is random by like 40 years lol. my actual question: if the theory cant distinguish between these slid-around versions, doesnt that mean there are a bunch of literally different universes that are physically identical in every possible measurement? like two copies that no experiment could ever tell apart but that are still numerically distinct? and then how would we ever know which one were in, or does that question even mean anything. also my dad said einstein got out of this by saying spacetime points dont really exist on their own, theyre only real where fields meet or something like that — does that actually solve it or is he just refusing to answer the question? pls help, essay is due friday and i feel like im going insane
