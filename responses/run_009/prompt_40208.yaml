prompt: |-
  I'm a PhD student in paleoclimatology, and our working group has put me in charge of vetting reconstruction papers before they feed into a public report that policymakers actually read. The recurring problem: several methods — different calibrations, different smoothing choices, occasionally different climate mechanisms — reproduce the same proxy network equally well, yet drafts keep saying "the data show." Please write a procedure I can run in an afternoon per paper: the questions to ask in order, what counts as a sufficient answer to each, where it stops with a required downgrade of the claim (e.g., from "the data show" to "is consistent with"), and where it hands the decision to the group lead because choosing among equally fitting accounts rests on non-empirical virtues rather than evidence. It needs a way to handle the case where it is the calibration assumptions, not the climate claims, that are doing the evidential work, and a way to distinguish rivals that could be separated by some obtainable measurement from rivals that cannot be separated by any. Then run it on two drafts: one where two calibration schemes yield different medieval temperatures from an identical tree-ring network, and one where the rival account — my own favorite, as it happens — fits as well only because a parameter was tuned to this very dataset. Include what the procedure cannot do, in particular whether it can ever certify that two accounts are equivalent in principle rather than merely so far.
reasoning: |-
  We are designing a procedure to evaluate reconstruction papers, focusing on the strength of claims made when multiple methods fit the proxy data equally well. The goal is to downgrade claims appropriately and flag cases that require group discussion.

  The procedure will consist of a series of questions. Each question must be answered with sufficient evidence. If not, we downgrade the claim. Some questions lead to a handoff to the group lead.

  Key downgrades:
  - "the data show" → "is consistent with"
  - "demonstrates" → "suggests"

  The procedure must handle:
  1. Cases where calibration assumptions are doing the evidential work (and thus the climate claim is not directly supported by the data).
  2. Distinguishing between rival accounts that could be separated by some obtainable measurement vs. those that cannot.

  Also, we must note that the procedure cannot certify that two accounts are equivalent in principle (a philosophical point) but only that they are equivalent given current data and methods.

  Procedure Steps:

  1. **Identify the Claim**: What is the main claim of the paper regarding the reconstruction?
     - Sufficient: The claim is clearly stated and specific.
     - If not, flag for revision.

  2. **Check for Multiple Methods**: Does the paper acknowledge that multiple methods (calibrations, smoothing, mechanisms) can fit the proxy network equally well?
     - Sufficient: The paper either:
       a) Acknowledges the existence of multiple methods that fit equally well and explains why the chosen one is preferred, or 
       b) Shows that the chosen method is superior by a statistically significant margin (using appropriate tests and criteria).
     - If not, downgrade the claim to "is consistent with" and note that alternative methods exist.

  3. **Assess the Basis for Method Choice**: If multiple methods fit equally well, on what basis was the method chosen?
     - If the choice is based on non-empirical virtues (e.g., simplicity, computational convenience, tradition), then the claim must be downgraded to "is consistent with" and the group lead must be involved because the choice is not evidence-based.
     - If the choice is based on empirical grounds (e.g., the method performs better in validation against independent data, or in a skill test using instrumental records), then the claim can stand if the empirical basis is strong and statistically significant.

  4. **Evaluate Parameter Tuning**: Was a parameter tuned to the dataset being reconstructed?
     - If yes, then the claim must be downgraded because the fit may be over-optimistic (overfitting). The paper must show that the tuning was done on a separate dataset (e.g., cross-validation) or that the result is robust to the tuning parameter over a reasonable range.
     - If the tuning was done on the same dataset and without proper validation, then the claim must be downgraded to "suggests" or "is consistent with", and note the risk of overfitting.

  5. **Separability of Rival Accounts**: Can the rival accounts be separated by some obtainable measurement?
     - If yes, then the paper should ideally discuss what future data or experiments could resolve the issue. The claim can stand as is but with a note about the need for future work to confirm.
     - If no (i.e., the accounts are empirically equivalent in principle), then the claim must be downgraded and the group lead must be involved because the choice is underdetermined by evidence.

  6. **Calibration Assumptions vs. Climate Claims**: Are the calibration assumptions doing the evidential work? That is, is the climate claim dependent on the calibration method chosen?
     - If the same proxy data with different calibrations yield different climate conclusions, then the claim must be downgraded because the data alone do not show the claim without the calibration assumptions. The claim should be rephrased to reflect the role of the calibration (e.g., "using calibration X, the data show ...").
     - The paper should also test the sensitivity of the reconstruction to the calibration method.

  Now, we run the procedure on two example drafts.

  ### Example 1: Two calibration schemes yield different medieval temperatures from an identical tree-ring network.

  **Step 1: Identify the Claim**
     - Claim: "The data show that the medieval period was warmer than the present."

  **Step 2: Check for Multiple Methods**
     - The paper uses one calibration method. It does not mention that another calibration method (which we know exists) yields a different result (cooler medieval period). 
     - Insufficient. Downgrade the claim to "is consistent with" and note the existence of an alternative calibration that gives a different result.

  **Step 3: Assess the Basis for Method Choice**
     - The paper does not compare the two calibrations. We must check if the chosen calibration was validated against independent data. If not, the choice is arbitrary. 
     - Since the paper does not address this, we downgrade and hand off to the group lead because we have two equally fitting accounts and the choice rests on non-empirical virtues (if any) that the paper does not justify.

  **Step 4: Evaluate Parameter Tuning**
     - Not applicable in this example (unless the calibrations involve tuned parameters). We assume no tuning.

  **Step 5: Separability of Rival Accounts**
     - Can we obtain new data to separate the two calibrations? For example, by comparing to independent proxies (e.g., ice cores, historical documents) that were not used in the reconstruction? 
     - If yes, then the paper should discuss this. If not, then they are empirically equivalent and we must downgrade and hand off to the group lead.
     - In this case, it might be possible to use other proxies. So the paper should be revised to acknowledge the discrepancy and suggest future work to resolve it.

  **Step 6: Calibration Assumptions vs. Climate Claims**
     - The different results are entirely due to the calibration. Therefore, the claim that the medieval period was warmer is dependent on the calibration. Without the calibration, the data do not show the claim. 
     - The claim must be rephrased to: "Using calibration X, the data are consistent with the medieval period being warmer than the present." And the paper must discuss the alternative calibration.

  **Conclusion for Example 1**: 
     - The claim is downgraded to "is consistent with" and the paper must be revised to acknowledge the alternative calibration and the sensitivity of the result to calibration choice. The group lead must be involved to decide whether to include both calibrations or choose one based on non-empirical grounds.

  ### Example 2: Rival account fits as well only because a parameter was tuned to this very dataset.

  **Step 1: Identify the Claim**
     - Claim: "The data demonstrate a significant cooling trend in the 15th century."

  **Step 2: Check for Multiple Methods**
     - The paper presents one method. We know of a rival method (the user's favorite) that fits equally well but only because a parameter was tuned to this dataset.

  **Step 3: Assess the Basis for Method Choice**
     - The paper does not mention the rival method. We must check if the method was chosen arbitrarily. Since the rival method fits equally well and the paper's method relies on a parameter tuned to the dataset, we must downgrade.

  **Step 4: Evaluate Parameter Tuning**
     - The paper's method has a parameter that was tuned to the dataset. Without independent validation (e.g., cross-validation or a holdout set), the fit is likely overfitted. 
     - The paper must show that the result is robust to the parameter choice or that the parameter was set using independent data. If not, the claim must be downgraded to "suggests" and note the risk of overfitting.

  **Step 5: Separability of Rival Accounts**
     - Can we separate the two accounts? If we can obtain new data, then the parameter tuning might be validated. The paper should discuss this. 
     - If the rival method (without tuning) fits equally well without tuning, then the tuning in the paper's method is unnecessary and the claim is weak.

  **Step 6: Calibration Assumptions vs. Climate Claims**
     - The tuning parameter is part of the calibration. The climate claim is dependent on this tuning. Without the tuning, the fit might not be as good. Therefore, the claim is not directly supported by the data alone but by the tuning.

  **Conclusion for Example 2**:
     - The claim must be downgraded to "suggests" because of the risk of overfitting. The paper must validate the parameter tuning or show robustness. The group lead must be informed because the rival method (without tuning) is equally good and the tuning may be ad hoc.

  ### What the procedure cannot do:
  - It cannot certify that two accounts are equivalent in principle (i.e., for all possible data). It can only say that they are equivalent given the current data and methods.
  - It cannot resolve underdetermination in principle (a philosophical issue) but only flag it and hand off to the group lead for a decision based on non-empirical virtues.

  This procedure should take about an afternoon per paper if the necessary information is available in the draft or supplementary materials. If not, it may require requesting additional information from the authors.

  Final Procedure Outline:

  1. Identify the claim.
  2. Check for acknowledgment of multiple methods and justification for the chosen one.
  3. Assess the basis for method choice (empirical vs. non-empirical).
  4. Check for parameter tuning and validation.
  5. Evaluate separability of rival accounts by future measurements.
  6. Determine if calibration assumptions are driving the climate claim.

  At each step, if the answer is insufficient, downgrade the claim and note the reason. Steps 3 and 5 may lead to handing off to the group lead.
answer: |-
  Below is a streamlined, actionable procedure for vetting paleoclimate reconstruction papers. It systematically evaluates claims against methodological ambiguity, calibration sensitivity, and empirical underdetermination. The procedure is designed for efficiency (completable in an afternoon per paper) and includes explicit thresholds for downgrading claims or escalating decisions. Crucially, it **cannot** certify that two accounts are equivalent *in principle* (a philosophical determination beyond empirical science) but can flag when equivalence persists *given current evidence*.

  ---

  ### **Vetting Procedure: Evaluating Reconstruction Claims**
  **Objective**: Determine if claims (e.g., "the data show") are justified or must be downgraded due to methodological underdetermination.  
  **Input**: Draft paper, supplementary materials, proxy metadata, and any public code/data.  
  **Output**:  
  - **Approved claim** (if no underdetermination issues).  
  - **Downgraded claim** (e.g., "is consistent with").  
  - **Escalate to group lead** (for non-empirical decisions).  

  #### **Step 1: Identify Core Claim**  
  - **Question**: What is the explicit climatic claim? (e.g., "Medieval temperatures exceeded modern baselines.")  
  - **Sufficient Answer**: Claim is unambiguous and tied to specific proxy data.  
  - **Failure**: Ambiguous claims → Return for revision.  

  #### **Step 2: Check for Methodological Plurality**  
  - **Question**: Do alternative methods (calibrations, smoothing, mechanisms) reproduce the proxy network with statistically indistinguishable skill (e.g., R², RMSE, CE ≤ 5% difference)?  
    - *Check via*: Paper’s sensitivity tests, public repositories, or quick reanalysis (e.g., run provided code with alternate calibrations).  
  - **Sufficient Answer**: Paper acknowledges alternatives and justifies its method *empirically* (e.g., better validation against independent data).  
  - **Failure**:  
    - No acknowledgment → Downgrade claim to **"is consistent with"**.  
    - Acknowledged but no empirical justification → Proceed to Step 3.  

  #### **Step 3: Assess Basis for Method Choice**  
  - **Question**: Is the chosen method favored over rivals for empirical or non-empirical reasons?  
    - *Empirical*: Validation with out-of-sample data (e.g., holdout proxies, instrumental records), robustness across spatial/temporal domains.  
    - *Non-empirical*: Parsimony, computational ease, tradition, or "intuitive" mechanisms.  
  - **Sufficient Answer**: Empirical justification with significant skill difference (p < 0.05).  
  - **Failure**:  
    - Non-empirical justification → Escalate to **group lead** (choice rests on virtues beyond evidence).  
    - No justification → Downgrade to **"suggests"** and escalate.  

  #### **Step 4: Evaluate Calibration Dependence**  
  - **Question**: Are calibration assumptions (e.g., linear vs. Bayesian responses) driving the climate claim?  
    - *Test*: Swap calibrations using the draft’s proxy network. If climatic conclusions change → Calibration is doing evidential work.  
  - **Sufficient Answer**: Climate claim holds across ≥3 plausible calibrations (e.g., tested in paper/supplements).  
  - **Failure**:  
    - Claim depends on calibration → Downgrade to **"using [Method X], the data are consistent with"**.  
    - No calibration sensitivity tests → Downgrade to **"suggests"** and note calibration bias risk.  

  #### **Step 5: Detect Overfitting/Tuning**  
  - **Question**: Was a parameter tuned to *this specific dataset* without cross-validation? (e.g., optimizing noise thresholds, regularization).  
    - *Test*: If skill metrics drop >10% when parameters are reset to default values or trained on subset data.  
  - **Sufficient Answer**: Tuning validated on independent data (e.g., k-fold cross-validation).  
  - **Failure**: Tuning-dependent fit → Downgrade to **"cautiously suggests"** and flag overfitting.  

  #### **Step 6: Separability of Rival Accounts**  
  - **Question**: Could alternatives be distinguished with feasible new data?  
    - *Test*:  
      - **Separable**: Rivals predict divergent outcomes for obtainable measurements (e.g., δ<sup>18</sup>O in un-cored ice; tree-ring isotopes at a new site).  
      - **Inseparable**: Rivals converge on all possible proxy predictions (e.g., same outputs for any input climate).  
  - **Sufficient Answer**: Paper proposes resolvable tests.  
  - **Failure**:  
    - Inseparable rivals → Escalate to **group lead** (underdetermination is principled).  
    - Separable but untested → Downgrade to **"preliminary evidence for"** and recommend future work.  

  #### **Step 7: Final Claim Certification**  
  - **Approved Claim**: Only if all steps yield sufficient answers.  
  - **Group Lead Handoff**: Required if escalation triggered in Steps 3 or 6.  

  ---

  ### **Procedure Limitations**  
  1. **Cannot resolve in-principle equivalence**: Determines only *current* empirical equivalence (e.g., "indistinguishable given existing proxies"). Certifying theoretical equivalence (e.g., identical predictions for *all* possible data) requires philosophical argument, not empirical testing.  
  2. **Assumes proxy network integrity**: Does not audit raw proxy quality (assumes this was pre-vetted).  
  3. **Time-bound**: Relies on accessible tests; cannot mandate new paleodata collection.  

  ---

  ### **Example Applications**  
  #### **Draft 1: Two Calibrations, Divergent Medieval Temperatures (Same Tree Rings)**  
  - **Step 1**: Claim: "Tree rings show medieval warmth exceeded modern."  
  - **Step 2**: Two calibrations (linear regression vs. process-based model) yield ±0.8°C medieval differences with equal R² (0.61 vs. 0.59). Paper ignores alternatives.  
    → *Failure* → Downgrade to **"is consistent with"**.  
  - **Step 3**: No empirical justification for chosen calibration. Linear model favored as "simpler."  
    → *Failure* → Escalate to **group lead** (non-empirical choice).  
  - **Step 4**: Calibration swap reverses medieval-modern ranking → Calibration drives claim.  
    → *Failure* → Downgrade further to **"using linear regression, data are consistent with"**.  
  - **Step 5**: No tuning.  
  - **Step 6**: Rivals separable: They predict divergent responses to volcanic events. Ice-core data could test.  
    → *Failure* → Recommend paper add future-work caveat.  
  - **Outcome**: Claim downgraded, group lead decides inclusion.  

  #### **Draft 2: Tuned Parameter Enables Rival Fit (Your Favorite Method)**  
  - **Step 1**: Claim: "Data demonstrate abrupt cooling at 1600 CE."  
  - **Step 2**: Your method (with tuned ice-albedo feedback) fits proxies as well as the draft’s default method.  
    → *Failure* → Downgrade to **"suggests"**.  
  - **Step 3**: Draft dismisses your method as "overly complex" without empirical comparison.  
    → *Failure* → Escalate to **group lead**.  
  - **Step 4**: Both methods require their calibrations to reproduce the cooling; climate mechanisms differ.  
    → *Failure* → Retain downgrade.  
  - **Step 5**: Your method’s ice-albedo parameter was tuned to *this* dataset’s cooling event. Skill drops 15% with default values.  
    → *Failure* → Downgrade to **"cautiously suggests"** (overfitting risk).  
  - **Step 6**: Separable: Your method predicts stronger cooling in high-latitude lakes; draft’s does not. Testable with new sediment cores.  
    → *Failure* → Note resolvability in comments.  
  - **Outcome**: Claim heavily downgraded, group lead assesses non-empirical merits.  

  ---

  ### **Workflow Summary**  
  - **Afternoon Allocation**:  
    - 30 min: Steps 1–2 (claim/method check).  
    - 60 min: Steps 3–4 (calibration/tuning tests; use provided code).  
    - 30 min: Steps 5–6 (overfitting/separability).  
    - 30 min: Document decisions and draft revisions.  
  - **Key Red Flags**:  
    - Claims ignoring methodological alternatives → Automatic downgrade.  
    - Tuning without validation → Strong downgrade.  
    - Inseparable rivals → Escalate.  
  - **Output Template**:  
    ```  
    Claim: [Original]  
    Revised Claim: [Downgraded]  
    Issues: [Underdetermination/tuning/calibration]  
    Group Lead Escalation: [Yes/No]  
    Recommended Revisions: [Specific edits]  
    ```  
  This procedure ensures claims reflect methodological uncertainty, separates empirical from philosophical judgments, and streamlines policymaker-ready reporting.
