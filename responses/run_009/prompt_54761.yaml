answer: |-
  Your frustration with the "constitution without identity" solution is completely understandable—it *feels* like cheating. And your Aristotelian "statue-as-pattern" fix is a sophisticated approach endorsed by several contemporary philosophers (e.g., Amie Thomasson, Lynne Baker). Let's break down why it's promising but tricky, and explore alternatives:

  ### Your Solution: Statue as Abstract Pattern
  **Strengths:**  
  - **Avoids co-location:** Only one concrete object (the clay) exists. The statue is a dependent entity—a "form" instantiated by the clay.  
  - **Explains modal differences:** The clay survives squashing because the *matter* persists; the statue is destroyed because its *structure* is annihilated.  
  - **Aristotelian coherence:** It aligns with hylomorphism (matter + form), where "statue" names a higher-order property of the clay.  

  **The Hammer Problem:**  
  You’re right that "I smashed the statue" seems to refer to a concrete event. Here’s how defenders reconcile this:  
  1. **Derived concreteness:** The statue isn’t abstract like a number—it’s an *embodied pattern*. Smashing it means destroying the physical structure that realizes it. We say "I broke the statue" *because* we’re describing the destruction of its physical basis.  
  2. **Language shortcuts:** Ordinary language treats artifacts as concrete objects for practical purposes, even if metaphysically they’re dependent. Compare: "I destroyed the company" (a legal/social entity) isn’t a category error, but the company isn’t fundamental concrete stuff.  

  **Refinement:** Call the statue a **weakly abstract entity** or a **supervenient particular**. It’s location-bound and causally efficacious *through its matter*, but not ontologically independent.

  ---

  ### Alternatives to Co-Location (If Your Fix Still Feels Awkward)
  1. **Four-Dimensionalism (Perdurantism):**  
     - The statue and clay are different *temporal parts* of the same spacetime worm.  
     - *Statue* = the clay’s stage during its statue-shaped phase.  
     - Solves co-location: They overlap spatially but are distinct temporal slices.  
     - **Problem:** Implies objects are spacetime worms—counterintuitive if you think objects are "wholly present" at each moment.

  2. **Eliminativism / Mereological Nihilism:**  
     - Only atoms (or particles) exist. "Statue" and "clay" are just ways of describing arrangements of atoms.  
     - "Smashing the statue" = rearranging atoms that we *called* a statue.  
     - **Problem:** Rejects ordinary objects entirely—radical but logically bulletproof.

  3. **Trope Theory:**  
     - The statue is a *bundle of tropes* (particularized properties: shape, function, art-historical role) inhering in the clay.  
     - Co-location is avoided: one substance (clay) with multiple property bundles.  

  ---

  ### Why Co-Location *Might* Be Less Spooky Than You Think
  Your intuition that "two things can’t occupy the same space" likely stems from:
  - **Physics:** Fermions obey the Pauli exclusion principle, but macroscopic objects aren’t fundamental particles.  
  - **Leibniz’s Law:** If two things share all properties, they’re identical. *But constitution theorists argue they don’t*:  
    - The statue has the property *came into existence when molded*; the clay has *existed since last week*.  
    - The clay can survive being rolled into a ball; the statue cannot.  
  - These are **modal and historical properties**—not current physical states—but they’re genuine differences in how the objects persist through time.  

  **Why it’s not "just bookkeeping":**  
  If objects are defined by their persistence conditions (e.g., a "statue" must retain its structure, "clay" need not), then they *are* distinct entities with different essences. Destroying the statue by squashing isn’t magic—it’s ending a specific configuration the clay temporarily realized.

  ---

  ### Verdict on Your Fix
  **It holds up philosophically,** but requires accepting that:  
  - Some objects (artifacts, organisms) are **ontologically dependent** on their matter.  
  - We can refer to them as "concrete" in everyday speech because their existence is physically embodied.  

  **Easier way out?** If you dislike abstracta, **four-dimensionalism** avoids co-location while taking modal differences seriously. But no solution is universally loved—this puzzle persists because each answer challenges deep intuitions.  

  **Final thought:** Your intuition against co-location is likely rooted in the **container theory of space** (space is a fixed "container" objects occupy). If space is relational (defined by objects), co-location feels less paradoxical. The puzzle reveals how deeply our metaphysics depends on unexamined assumptions.
