prompt: |-
  My clinic's ethics committee likes to think of itself as consistant, and I want to keep it that way. Our past rulings: we allowed PGD to screen out embryos with the Huntington's gene; we allowed picking an embryo that was a tissue match for a sick older sibling, even though the selected child himself would have been healthy either way; we refused a deaf couple who wanted to deliberately select a deaf embryo; we refused sex selection for family balancing; we allowed screening out a BRCA1 variant even though the cancer it raises risk for is partly treatable and might never develop. Now a new one's on our desk: an IVF couple with no family history of anything, five healthy embryos, and they want us to run polygenic risk scores and transfer the one with the lowest predicted risk of depression and type 2 diabetes — we're talking differences like 12% vs 8%, with every embryo healthy in absolute terms. If we want to stay consistent with ourselves, what's the call? Which of our old cases is the closest analog, and if our record genuinely underdetermines it, what principle would we be adopting with each choice — plus, what's the next case that would best split those candidate principles apart? Answer in American English, please.
reasoning: |-
  Okay, the user is part of a clinic's ethics committee and wants to maintain consistency in their rulings. They've provided several past cases and now have a new one involving polygenic risk scores for depression and type 2 diabetes. Let me start by understanding their past decisions.

  First, they allowed PGD for Huntington's because it's a severe, untreatable condition with high penetrance. Then, they permitted selecting a tissue match for a sick sibling, prioritizing the family's medical need even though the selected child is healthy. However, they refused a deaf couple's request for a deaf embryo, seeing that as choosing a disability, not preventing harm. They also denied sex selection for family balancing, viewing it as non-medical. Lastly, they allowed screening out BRCA1, which has significant cancer risk despite being treatable and not 100% penetrant.

  Now the new case: healthy embryos, no family history, using polygenic scores to pick the one with the lowest risk for depression and T2D (12% vs 8%). The absolute risk is low for all, and the differences are small. The key is consistency. 

  Looking for the closest analog. Huntington's and BRCA1 were about preventing serious diseases, but those had high risks and clear genetic links. Here, depression and T2D are multifactorial, influenced by environment, and the risk reduction is minimal. The tissue match case was for a direct medical benefit to another person, not the embryo itself. Refusing deaf selection and sex selection was because they were non-medical or creating disability. 

  This new request feels closer to the refused cases because the risks are probabilistic and not severe enough to warrant selection. Yet, BRCA1 was allowed despite not being 100% certain. But BRCA1's risk is much higher (60-70%) compared to the small differences here. Also, polygenic scores are less reliable than single-gene tests. 

  The committee's principle seems to be: allow selection only to avoid serious, high-likelihood medical harm to the child. The embryo's welfare is key. Here, all embryos are healthy, and the risks are low. Allowing this could open doors to selecting for traits like intelligence, which is a slippery slope. 

  The next case to split principles might be screening for Alzheimer's with a gene like APOE, which increases risk but isn't deterministic. That would test the boundary between avoiding serious disease versus probabilistic risks. 

  So, the consistent call is to refuse this request. The closest analog is the refusal of sex selection and deaf selection because this is seen as non-medical enhancement rather than disease prevention. The principle is avoiding significant harm, not optimizing traits.
answer: |-
  Based on your committee's established rulings and the need for consistency, here's the breakdown for the new polygenic risk score (PRS) case:

  **The Consistent Call: Refuse the request.**

  Here's why, based on your precedents:

  1.  **Closest Analog: Sex Selection Refusal & Deaf Embryo Selection Refusal**
      *   **Why:** These refusals centered on selecting for *non-medical characteristics* or conditions *not considered serious medical harm*. Selecting for sex (family balancing) or deafness was deemed outside the core medical purpose of PGD, which your committee has implicitly defined as preventing significant, concrete disease or suffering *for the resulting child*.
      *   **Application to PRS:** Selecting an embryo based on a slightly lower *probabilistic risk* of depression and T2D (conditions that are highly multifactorial, influenced heavily by environment/lifestyle, and where the absolute risk difference is small - 12% vs 8%) moves firmly into the realm of *trait optimization* rather than *disease prevention*. It's closer to "family balancing" (desiring a specific trait) than preventing Huntington's or even high-risk BRCA1 cancer. None of these embryos are predicted to *have* the disease; it's about choosing the "most optimal" based on statistical probabilities of common conditions.

  2.  **Distinguishing from Allowed Cases:**
      *   **Huntington's:** This involves preventing a specific, severe, untreatable, highly penetrant neurological disease with near-certainty if the gene is present. The harm is profound and definite.
      *   **Tissue Match ("Savior Sibling"):** While the *selected child* isn't directly prevented from disease, the *primary medical justification* was to save the life/health of an existing, gravely ill child – a significant, concrete medical benefit within the family unit. The committee prioritized this extreme medical need over potential non-medical objections to the selection process itself.
      *   **BRCA1:** This is the trickiest comparison, but key differences exist:
          *   **Magnitude & Certainty of Risk:** BRCA1 confers a *high* lifetime risk (40-70%+) of often aggressive cancers occurring relatively young. The PRS differences here represent *small absolute changes* in risk for common, complex conditions.
          *   **Seriousness & Preventability:** While breast cancer is partly treatable, it remains a serious, potentially fatal condition requiring major interventions. The *level* of risk being mitigated is significantly higher than a 4% absolute risk difference for T2D/depression.
          *   **Genetic Basis:** BRCA1 is a single, high-impact variant with well-understood, major effects. PRS aggregates thousands of tiny effects with much lower predictive power and greater environmental influence. Selecting based on PRS is far less certain in preventing the actual disease outcome.
      *   **Deaf Embryo Refusal:** This directly rejects the notion of *intentionally selecting for a condition* considered a disability, reinforcing that PGD's purpose is to *avoid* significant impairments, not choose them.

  **Underlying Principle Clarified:**
  *   **By Refusing PRS Selection:** Your committee would be reaffirming that PGD is ethically permissible **only to prevent significant, serious, and relatively concrete future harm (disease or disability) to the child who will be born, or in extreme circumstances (like savior siblings) to prevent grave harm to another existing child.** It draws a line against selection based on probabilistic optimization for common conditions or non-medical traits. The core principle focuses on **avoiding substantial, likely suffering** rather than **maximizing statistical advantages** where all embryos are fundamentally healthy and the predicted differences are minor and uncertain.
  *   **By Allowing PRS Selection:** You would shift towards a principle allowing selection based on **probabilistic risk reduction for common, multifactorial conditions**, even when all embryos are healthy and the absolute risk differences are small. This moves PGD towards "enhancement" or "trait selection" territory, prioritizing statistical optimization over preventing clear and present harm.

  **The Next Case to Split These Principles: Screening for APOE-e4 Homozygosity (Alzheimer's Disease Risk)**

  *   **Why it Splits:** Alzheimer's (AD) is a severe, devastating neurological disease.
      *   **Argument for Allowing (aligned with BRCA1/Huntington's):** APOE-e4 homozygosity confers a *very high* lifetime risk (estimates vary, but potentially >50% by age 85) for a severe, untreatable, fatal neurodegenerative disease. This approaches the level of certainty and severity seen in Huntington's/BRCA.
      *   **Argument for Refusing (aligned with PRS refusal):** Unlike Huntington's (100% penetrance) or BRCA (high, defined risk), APOE-e4 is a *risk factor*, not deterministic. Many carriers *never* develop AD, and many without it *do*. It's probabilistic, penetrance is age-dependent, and environmental factors play a role. Selecting against it would be preventing a *high probabilistic risk*, not a certainty, for a disease that manifests late in life. Allowing it would validate the principle of selecting against high probabilistic risks, opening the door wider to the PRS case you just refused. Refusing it maintains a stricter line requiring near certainty or very high, early-onset risk (like BRCA) for selection.
  *   **The Dilemma:** Does the *level* of probabilistic risk (very high for AD with APOE-e4) and the *severity* of the disease cross the threshold established by BRCA1, justifying selection? Or does the inherent uncertainty and late onset place it closer to the PRS case for common diseases, making selection an unacceptable move towards optimization?

  **Conclusion:** For consistency with your rulings against sex selection and deaf embryo selection, and distinguishing the BRCA1 case by the *magnitude* and *concreteness* of the risk being mitigated, refusing the polygenic risk score request for depression and T2 diabetes is the most defensible position. It maintains the principle that PGD is for preventing significant, likely harm, not for statistical optimization where all options are healthy. The APOE-e4 case would be the critical next test, forcing you to define *how high* a probabilistic risk must be (and how severe the disease) to ethically justify selection.
