prompt: |-
  I've been a longtime reader of the rationalist blogosphere — LessWrong in its heyday, the decision-theory-adjacent corners, the periodic posts on the value of information — and I now run a weekly decision review at a three-hundred-person company that builds logistics software. Several times a week a team comes to me with some version of the question "should we find out more before we decide?" Run another A/B test before rolling out the checkout change; commission a customer study before the rebrand; run a load test against production before the holiday traffic; do reference calls with a vendor's former customers before signing. The stakes range from a week of engineering time to an irreversible pricing commitment; the teams want an answer within a day; and the people who would apply whatever I come up with are mid-level product managers with no decision-theory background and no patience for anything that smells of a seminar.

  What I want is a decision procedure my PMs can actually run, built out of the theory of the value of information — I. J. Good's result that acting with free, relevant information in hand is never worse in expectation than acting without it, together with the practical structure around that theorem: information has value only insofar as some possible result would change the action; its value is capped by the stakes; and the theorem's assumptions (the information is genuinely free, it arrives before the decision, it is used to update rather than to rationalize, and gathering it does not itself alter the situation) are precisely the assumptions that fail in practice. The procedure should translate all of this into an ordered checklist: the questions to ask about a proposed information-gathering step, in order; what counts as a sufficient answer to each; the point at which the procedure returns a flat "no, skip the study"; and the point at which it returns "yes, but only for this subset of outcomes." The idea that a test is worth running only if some result would actually flip the decision seems to me the load-bearing insight of the whole framework, and I want it to survive the simplification. The procedure must also mark honestly which steps are judgment calls dressed up as procedure, and it must hand off to a human exactly where the question is one of values rather than facts — above all, whether the worst case is tolerable, which no theorem answers.

  Then run the procedure on three proposals, chosen to stress it:

  1. A two-week A/B test of a redesigned checkout flow before full rollout, where the cost of testing is a slower rollout and a small conversion hit on the control branch.
  2. A six-figure customer research study before a rebrand that senior leadership has already all but committed to, where I suspect the study is wanted as cover rather than as input.
  3. A load test against production infrastructure two weeks before peak season, where gathering the information itself carries a risk of an outage — that is, the act of finding out changes the thing you are trying to find out about.

  On case 2, I expect the procedure to answer "don't run it" or "run only a stripped-down version," which is an answer I will not enjoy relaying. So tell me also how to distinguish "the information has no value because no result would change the decision" from "the information has no value because the decision has already been made and the study is theater" — the first is a fact about the decision, the second is a fact about my organization, and I need the procedure to be honest about which of the two it can actually detect.

  Finally, say what the procedure cannot do: where it will misfire; what it does about numbers nobody has (our PMs will not produce priors, and any procedure that demands them will simply be ignored); and where the value-of-information framework is the wrong lens entirely. I'm told there are cases in which more information is harmful even when used perfectly, and I would like to know whether my weekly queue is likely to contain any.
reasoning: |-
  We are designing a decision procedure for determining whether to gather additional information before making a decision. The procedure is based on the value of information (VoI) theory, particularly I.J. Good's theorem, but simplified for use by mid-level product managers without decision-theory background.

  Key insights from VoI theory to preserve:
  1. Information has value only if there exists at least one possible outcome that would change the decision (i.e., lead to a different action than the one taken without the information).
  2. The value of information is bounded by the stakes of the decision (i.e., the maximum possible loss from making the wrong decision).
  3. The assumptions of the theorem (free, relevant, arriving on time, used to update, non-disturbing) are critical and often fail in practice.

  We'll structure the procedure as an ordered checklist. The goal is to quickly rule out unnecessary information gathering and only proceed when the conditions are met.

  **The Procedure: "Should We Find Out More?" Checklist**

  *Instructions for the PM:*
  - Answer the questions in order. Stop and return the indicated answer as soon as you hit a "No" or a condition that fails.
  - The procedure will either:
    - **Stop with "No, skip the study"** (and a reason)
    - **Stop with "Yes, run the study"** (optionally with constraints such as only for certain outcomes)
    - **Continue to the next step** until a stopping condition is met.

  ---

  **Step 1: Is the decision reversible?**
  - *Question:* If we make the wrong decision, can we easily undo it (without significant cost or loss)?
  - *Rationale:* If the decision is reversible, then the value of information is low because we can adjust later. Gathering information might not be worth the delay and cost.
  - *Sufficient answer:*
    - **Yes (reversible):** Move to Step 2.
    - **No (irreversible or costly to reverse):** Move to Step 3.

  **Step 2: What is the cost of delay?**
  - *Question:* What is the cost (in time, money, opportunity) of waiting to decide until after the information is gathered? Is this cost negligible compared to the stakes of the decision?
  - *Rationale:* If the cost of delay is high relative to the stakes, then gathering information might not be worth it even if the decision is irreversible.
  - *Sufficient answer:*
    - **Cost of delay is negligible:** Move to Step 3.
    - **Cost of delay is significant:** Then consider: Is the cost of delay so high that it outweighs the potential benefit of the information? If yes, then **stop and return "No, skip the study" (reason: cost of delay too high)**. Otherwise, move to Step 3.

  **Step 3: Are there multiple viable actions?**
  - *Question:* Are there at least two distinct actions under consideration that are both viable? (If not, then the decision is already made.)
  - *Rationale:* If there's only one action, then there's no decision to make, and information won't change anything.
  - *Sufficient answer:*
    - **No (only one action):** **Stop and return "No, skip the study" (reason: no decision to make)**.
    - **Yes (multiple actions):** Move to Step 4.

  **Step 4: Is the information free?**
  - *Question:* Is gathering the information truly free? That is, does it cost nothing (or negligible cost) in time, money, and resources? And does it not alter the situation? (Note: "Free" also means that it does not introduce new risks, such as the risk of an outage during a load test.)
  - *Rationale:* If gathering the information has a cost or risk, then we must account for that. Also, if it alters the situation, then the information might not be about the state we care about.
  - *Sufficient answer:*
    - **Yes, free and non-disturbing:** Move to Step 5.
    - **No, not free (costly or risky) or disturbing:** Then we must account for the cost/risk. Move to Step 6.

  **Step 5: Is there a possible outcome that would change the decision?**
  - *Question:* For each possible outcome of the information-gathering activity, would any outcome lead you to choose a different action than the one you would choose without the information? (This is the core of VoI: the information must be potentially decisive.)
  - *Rationale:* If no possible outcome would change the decision, then the information has no value.
  - *Sufficient answer:*
    - **Yes, at least one outcome would change the decision:** Then **stop and return "Yes, run the study"**.
    - **No, no outcome would change the decision:** Then **stop and return "No, skip the study" (reason: the information won't change the decision)**.

  **Step 6 (if Step 4 was "No"): Quantify the cost and risk.**
  - *Question:* Can we quantify the cost and/or risk of gathering the information? And is the maximum possible value of the information (which is bounded by the stakes of the decision) greater than the cost plus the risk?
  - *Rationale:* The value of the information cannot exceed the stakes of the decision (the maximum loss from making the wrong decision). If the cost of gathering the information (including the cost of delay and any risks) is higher than the stakes, then it's not worth it.
  - *Sufficient answer:*
    - **The cost/risk is negligible compared to the stakes:** Then move to Step 5 (to check if the information is decisive).
    - **The cost/risk is significant but the stakes are much higher:** Then move to Step 5.
    - **The cost/risk is comparable to or exceeds the stakes:** Then **stop and return "No, skip the study" (reason: cost/risk too high relative to stakes)**.

  **After Step 6, if we proceed to Step 5 and the answer is "Yes" (decisive), then return "Yes, run the study" with a note: "But be cautious of the cost/risk." If Step 5 is "No", then return "No, skip the study" (reason: the information won't change the decision).**

  **Special note for Step 5:** If there are outcomes that would change the decision and others that wouldn't, consider whether the study can be designed to only look for the decisive outcomes. If so, the procedure can return: "Yes, but only run a stripped-down version that focuses on the decisive outcomes." This is a judgment call that the PM must make.

  **Handling Judgment Calls and Values:**
  - The procedure marks steps that are judgment calls by explicitly stating so. For example:
    - Step 2 (cost of delay) and Step 6 (comparing cost/risk to stakes) require judgment. The procedure says: "This step requires judgment: compare the cost of delay to the stakes. If the cost is high and the stakes are low, then skip."
    - Step 5 (whether an outcome would change the decision) is also a judgment call. The PM must honestly consider: "If I see outcome X, would I really change my action?" This requires thinking about the worst-case and best-case scenarios.
  - The procedure explicitly hands off to a human on questions of values. For instance, the question "Is the worst case tolerable?" is a value judgment. The procedure cannot answer that. In Step 5, if the PM is unsure whether an outcome would change the decision, they must consult with stakeholders to clarify the threshold for action.

  **Distinguishing between two reasons for "no value":**
  - In Step 5, if we return "No, skip the study" because no outcome would change the decision, that is a fact about the decision: the information is not decisive. This is a rational reason.
  - However, if the decision is already made (Step 3: only one action) and the study is theater, then Step 3 catches that (returning "No" because there's no decision). But if the decision appears open (Step 3: multiple actions) but in reality the organization is committed to one, then Step 5 might reveal that: the PM might realize that no outcome would change the decision because the decision is fixed. The procedure cannot directly detect organizational theater, but it can expose it by asking the PM to state whether any outcome would change the decision. If the PM cannot name an outcome that would change the decision, then either the information is not decisive (rational) or the decision is fixed (organizational). The procedure returns the same answer in both cases: skip the study. It is then up to the manager (you) to interpret why: by asking the PM to explain why no outcome would change the decision. If the PM says, "Well, we have to do it anyway," then you know it's theater.

  **Limitations of the Procedure:**
  1. **Requires Honest Assessment:** The procedure relies on the PM being honest and not gaming the system. For example, in Step 5, if the PM is under pressure to run a study for political reasons, they might not truthfully admit that no outcome would change the decision.
  2. **Does Not Quantify VoI Precisely:** We are not asking for priors or doing calculations. We are using a qualitative approach. This might miss cases where the information has small but positive value that outweighs a small cost. The procedure is conservative: it only says "yes" when there is a clear decisive possibility and the cost is low.
  3. **Cannot Handle Complex Dependencies:** The procedure assumes that the information is independent of the decision and that the world is static. In dynamic situations (e.g., competitors react to your tests), the framework may not apply.
  4. **Where VoI Framework Fails:**
     - **When more information is harmful:** Even when used perfectly, more information can be harmful in some game-theoretic situations (e.g., in a negotiation, knowing your own weakness might lead to a worse outcome) or in decision-making under ambiguity (where having more information might lead to overfitting or analysis paralysis). However, in the context of business decisions (like A/B tests, customer studies, load tests) these are rare. The most common harmful effect of more information in your queue might be the delay and the opportunity cost of not acting.
     - **When the cost of information is too high to justify:** The procedure accounts for this in Step 6.

  **Running the Examples:**

  **Example 1: Two-week A/B test of a redesigned checkout flow.**
  - **Step 1:** Is the decision reversible? The rollout is reversible (you can roll back). So **Yes (reversible) -> Step 2.**
  - **Step 2:** Cost of delay? Two weeks of slower rollout and a small conversion hit on the control branch. Is this cost negligible compared to the stakes? The stakes are the risk of a bad rollout (which could cause a significant loss in conversion). The cost of delay (two weeks of small conversion hit) might be significant but likely less than the potential loss from a bad rollout. But the procedure requires judgment: if the cost of delay is too high, then skip. Let's assume it's acceptable. **Move to Step 3.**
  - **Step 3:** Multiple actions? Yes (roll out the change or not). **Move to Step 4.**
  - **Step 4:** Is the information free? The test has a cost: the two-week delay and the conversion hit. Also, it might not be completely non-disturbing (if the test itself affects customer experience). So **No -> Step 6.**
  - **Step 6:** Quantify cost and risk. The cost is the two-week delay and conversion hit. The risk is low (if the test is well-designed). The stakes: if the change is bad, the full rollout could cause a substantial drop in conversion. The maximum value of the information is the difference between rolling out a bad change (which causes a big loss) and avoiding it. The cost of the test is likely much less than the potential loss. So **move to Step 5.**
  - **Step 5:** Is there a possible outcome that would change the decision? Yes: if the test shows a significant drop in conversion, we would not roll out. If it shows an increase, we would. **Return "Yes, run the study".**

  **Example 2: Six-figure customer research study before a rebrand.**
  - **Step 1:** Is the decision reversible? A rebrand is somewhat reversible (but at high cost and potential brand damage). So **No (irreversible) -> Step 3.**
  - **Step 3:** Multiple actions? The question says senior leadership has already all but committed. So if there's only one action (rebrand), then **No -> Stop and return "No, skip the study" (reason: no decision to make).** 
    - But let's check: if the study could potentially stop the rebrand, then there are two actions (rebrand or not). However, if leadership is committed, then even if the study is negative, they might rebrand anyway. So we must be honest in Step 5.
  - *Assume Step 3 is passed (because the PM says there are two actions: rebrand or not). Then:*
  - **Step 4:** Is the information free? No, it costs six figures. **-> Step 6.**
  - **Step 6:** The cost is high (six figures). Compare to the stakes: what is the maximum loss from a bad rebrand? If the stakes are in the millions, then the cost might be acceptable. **Move to Step 5.**
  - **Step 5:** Is there a possible outcome that would change the decision? This is the critical step. If the study comes back negative, would the rebrand be canceled? If the answer is no (because leadership is committed), then the study has no value. **Return "No, skip the study" (reason: the information won't change the decision).** 
    - If the PM says that a negative result would indeed stop the rebrand, then the procedure would return "Yes". But note: the procedure relies on the PM's truthful assessment. In reality, if the study is theater, the PM might not admit that a negative result wouldn't change anything.

  **How to distinguish the two reasons in Example 2:**
  - The procedure returns "No" in Step 5 because no outcome would change the decision. The reason could be either:
    a) The decision is fixed (organizational theater) - the study is wanted as cover.
    b) The decision is not fixed, but the study is not decisive - for example, the rebrand might be so important that even a negative study wouldn't stop it (because the long-term benefits are worth the short-term pain). 
  - The procedure cannot directly tell the difference. It is the PM's (or your) responsibility to probe: ask the PM, "What would it take to stop the rebrand? Would a negative study result be enough?" If the PM says, "We have to do it regardless," then it's theater. If the PM says, "Only if the study shows catastrophic loss, but that's very unlikely," then it's a rational assessment that the information is not decisive because the threshold for change is very high. In that case, the procedure still says "No" because the study is unlikely to meet the threshold (so the expected value is low). But note: our procedure doesn't require priors, so we are not assessing likelihoods. We are asking: is there *any* outcome that would change the decision? If the PM says, "Yes, if the study shows catastrophic loss, we would stop," then the procedure would say "Yes". But if the catastrophic loss outcome is extremely unlikely and the study doesn't focus on that, then the PM might still say "No" in Step 5. This is a gray area. The procedure, being qualitative, might be too blunt. We might adjust Step 5 to: "Is there a plausible outcome that would change the decision?" But that introduces judgment. We stick with "any outcome" to keep it simple.

  **Example 3: Load test against production infrastructure two weeks before peak season.**
  - **Step 1:** Reversible? The decision to change infrastructure is reversible? Actually, the decision is whether to make changes to the infrastructure (or not) before peak. But the load test itself is the information gathering. The decision it informs is: change the infrastructure or not. Changing infrastructure might be reversible? But the test itself has risk. We are being asked whether to run the load test. So let's reframe: the decision at hand is whether to run the load test. But the load test is an information gathering step for a subsequent decision (about infrastructure changes). We have to consider the whole chain.
    - Alternatively, we can think of the decision as: "Should we change the infrastructure?" and the load test is proposed to inform that. So:
  - **Step 1:** If we change the infrastructure and it fails during peak, that's irreversible damage. So **No (irreversible) -> Step 3.**
  - **Step 3:** Multiple actions? Yes (change infrastructure or leave it as is). **-> Step 4.**
  - **Step 4:** Is the information free? No, because the load test itself carries a risk of outage. **-> Step 6.**
  - **Step 6:** The cost is the time and resources to run the test. The risk is an outage during the test. The stakes of the infrastructure decision: if we don't change and the infrastructure fails during peak, that's a huge loss. If we change and it breaks, that's also bad. The value of the information is high. But the risk of the test (outage) is also high. We must compare: is the risk of the test (probability of outage times cost of outage) plus the cost of the test less than the maximum value of the information? The maximum value is the difference between making the right infrastructure decision and the wrong one. This requires judgment. If the risk of an outage during the test is low and the potential loss from a wrong infrastructure decision is high, then proceed. Otherwise, skip. **Move to Step 5.**
  - **Step 5:** Is there a possible outcome that would change the decision? Yes: if the load test shows that the current infrastructure cannot handle the load, we might change it. If it shows that it can, we leave it. **Return "Yes, run the study" but with caution: the test must be designed to minimize the risk of outage.** However, note that the procedure does not account for the possibility that the test might not be representative (because it's two weeks before peak, and traffic patterns might change). That's a limitation.

  **Cases where more information is harmful:**
  - In your weekly queue, the most likely harmful effect of more information is the cost (time, resources) and the risk (like the load test). The VoI framework accounts for that by subtracting the cost. But there are cases where even after accounting for cost, more information can lead to a worse decision. For example:
    - **Overfitting:** Running multiple A/B tests and then cherry-picking results might lead to a bad decision. But the procedure doesn't address how the information is used, only whether to gather it.
    - **Strategic interactions:** If a competitor sees your test and reacts, then the information gathering might change the competitive landscape. This is rare in your examples.
    - **Psychological effects:** More information might lead to decision paralysis. The procedure doesn't account for that.

  In practice, for the types of decisions you described (A/B tests, customer studies, load tests), the VoI framework is appropriate. The main risks are the cost and the potential for the information to be misused (which the procedure does not control for).

  **Final Procedure Summary:**
  - The procedure is a 6-step checklist. It is designed to be quick and to catch the most common reasons not to gather information.
  - It requires the PM to make honest judgments, especially on whether an outcome would change the decision and on comparing costs to stakes.
  - It flags Step 2 and Step 6 as judgment calls and hands off value judgments (like the tolerability of the worst case) to humans.
  - It does not require numbers (like priors) and can be run qualitatively.
  - It will misfire in situations where the value of information is positive but small and the cost is small, but the procedure might skip because the PM judges that no outcome would change the decision (if the bar for change is too high). It is conservative.

  **Recommendation:**
  - Train the PMs on the core idea: information is only valuable if it can change the decision.
  - Use the checklist as a guide, but encourage PMs to consult with you when they are unsure, especially on Step 5 and Step 6.
  - For the organizational theater problem, use the procedure as a tool to expose it: if the study is proposed but the procedure returns "No" because no outcome would change the decision, then ask why the study is being proposed. This can start a conversation about commitment and the role of the study.

  Let me know if you need further refinement.
answer: |-
  Below is a decision procedure designed for your product managers (PMs), translating the value of information (VoI) framework into a practical, ordered checklist. The procedure prioritizes simplicity, speed, and the core VoI insight: **information is only valuable if it could change the action**. It explicitly flags judgment calls and value-based decisions, avoids quantitative priors, and includes clear stopping rules. The checklist is structured as a flowchart with binary questions, returning a definitive output at each step.

  ---

  ### **Decision Procedure: "Should We Find Out More?" Checklist**  
  *For mid-level PMs, no decision theory background required. Answer in order—stop at first conclusive answer.*

  1. **Is the decision already made?**  
     - *Ask:* "Has leadership or the team already committed to an action, regardless of what the study finds?"  
     - *If YES → Return:* **"No, skip the study. Reason: No decision to make (the study is theater)."**  
     - *If NO → Proceed to Step 2.*  
     - *Why this first?* Catches "cover-your-ass" studies early. Distinguishes organizational theater (e.g., Case 2) from rational VoI analysis.  

  2. **Are there at least two *viable* actions?**  
     - *Ask:* "Could we realistically choose different paths (e.g., launch/not launch, choose vendor A/B) based on the study?"  
     - *If NO → Return:* **"No, skip the study. Reason: Only one action is feasible (information won’t change anything)."**  
     - *If YES → Proceed to Step 3.*  
     - *Judgment call note:* PM must define "viable" (e.g., "not launching" must be a real option).  

  3. **Is there *any* possible result that would flip the decision?**  
     - *Ask:* "Name one concrete outcome of the study that would make you choose Action A instead of Action B (or vice versa). If none exist, stop."  
       - *Example (A/B test):* "If the test shows a >5% drop in conversion, we won’t launch."  
       - *Example (rebrand study):* "If customer sentiment is negative, we delay the rebrand."  
     - *If NO CONCRETE OUTCOME → Return:* **"No, skip the study. Reason: No outcome would change the decision."**  
     - *If YES → Proceed to Step 4.*  
     - *Core insight:* This is the load-bearing step. Forces PMs to specify decision thresholds.  

  4. **Is the information free and non-disruptive?**  
     - *Ask:*  
       - "Does gathering the information cost nothing (time/money/risk)?"  
       - "Does the *act of measuring* alter the outcome (e.g., testing in production risks downtime)?"  
     - *If FREE and NON-DISRUPTIVE → Proceed to Step 6.*  
     - *If COSTLY or DISRUPTIVE → Proceed to Step 5.*  
     - *Why here?* Tests VoI assumptions. "Free" includes no delays, no resource costs, and no observer effects.  

  5. **Does the value justify the cost/risk?**  
     - *Ask:* "Is the worst-case cost/risk of gathering info *less* than the stakes of the decision?"  
       - *Cost examples:* Engineering time, delayed launch, outage risk.  
       - *Stakes examples:* Max loss from a bad decision (e.g., lost sales from a flawed checkout).  
     - *If NO → Return:* **"No, skip the study. Reason: Cost/risk exceeds stakes."**  
     - *If YES → Proceed to Step 6.*  
     - *Judgment call note:* No numbers needed. PMs compare rough magnitudes (e.g., "a week of engineering time vs. $1M in sales").  

  6. **Should we run a stripped-down version?**  
     - *Ask:* "Could a cheaper/faster/safer version (e.g., partial data, smaller sample) still capture the outcome that would flip the decision?"  
     - *If YES → Return:* **"Yes, but only run a stripped-down version focused on the decisive outcome."**  
     - *If NO → Return:* **"Yes, run the full study."**  
     - *Why last?* Ensures efficiency. PMs must revisit Step 3’s "flip conditions" to design minimal tests.  

  ---

  ### **Key Features of the Procedure**  
  - **Speed:** PMs get answers in minutes. Stops at first "No" (Steps 1–3 cover 80% of cases).  
  - **No priors/math:** Uses binary thresholds (e.g., "any outcome," "viable actions") instead of probabilities.  
  - **Explicit judgment flags:** Highlights Steps 2 (viability), 5 (cost vs. stakes), and 6 (stripping down) as subjective.  
  - **Handoff for values:** Step 5 forces PMs to weigh costs vs. stakes—this is where values (e.g., "can we tolerate outage risk?") override facts.  
  - **Distinguishes theater vs. rational "No":**  
    - Step 1 catches **organizational theater** ("study as cover").  
    - Steps 2–3 catch **rational "No"** ("no viable actions" or "no outcome flips decision").  
    - *Your role:* If Step 1 is triggered, escalate to leadership. If Step 3 is triggered, it’s a fact about the decision.  

  ---

  ### **Applying the Procedure to Your Cases**  
  **Case 1: A/B Test for Checkout Flow Redesign**  
  - Step 1: Decision not made → Proceed.  
  - Step 2: Two viable actions (launch or don’t launch) → Proceed.  
  - Step 3: Concrete flip outcome (e.g., "drop in conversion >X%") → Proceed.  
  - Step 4: Not free (slow rollout, conversion hit) → Go to Step 5.  
  - Step 5: Cost (engineering time + small conversion hit) likely < stakes (permanent revenue loss) → Proceed.  
  - Step 6: Can it be stripped down? Maybe (e.g., shorter test, smaller user sample).  
  - **Output:** **"Yes, but only run a stripped-down version."**  

  **Case 2: Customer Study for Rebrand**  
  - Step 1: Leadership "all but committed" → **Output:** **"No, skip the study. Reason: No decision to make (the study is theater)."**  
  - *Why?* Step 1 catches organizational theater. If PMs protest, ask: "Would leadership cancel the rebrand if the study is negative?" If no, it’s theater.  

  **Case 3: Load Test Before Peak Season**  
  - Step 1: Decision not made (e.g., "add capacity" vs. "do nothing") → Proceed.  
  - Step 2: Two viable actions → Proceed.  
  - Step 3: Concrete flip outcome (e.g., "test shows >90% server failure") → Proceed.  
  - Step 4: Not free (risk of outage) → Go to Step 5.  
  - Step 5: Cost/risk (outage) could exceed stakes (if test-induced outage loses more than a peak-season failure) → **Requires judgment.**  
    - *If risk is acceptable* → Proceed to Step 6.  
    - *If risk is unacceptable* → **Output:** **"No, skip the study. Reason: Cost/risk exceeds stakes."**  
  - Step 6: Can it be stripped down? Maybe (e.g., test on non-critical servers, use synthetic load).  
  - **Output (if risk acceptable):** **"Yes, but only run a stripped-down version."**  

  ---

  ### **Where the Procedure Misfires (Limitations)**  
  1. **Ignores small VoI:** The procedure rejects studies if no outcome *flips* the decision (Step 3). But in reality, information might *refine* actions (e.g., optimize pricing within a range). This is VoI’s blind spot—it assumes discrete actions.  
     - *Your queue risk:* Common in optimization tasks (e.g., "run a test to choose between two similar UI colors"). Solution: Train PMs to reframe decisions as binaries (e.g., "stick with old vs. adopt new").  

  2. **Fails with ambiguous stakes:** If stakes are unclear (e.g., brand damage from a rebrand), Step 5 becomes guesswork.  
     - *Mitigation:* Force PMs to define stakes upfront (e.g., "worst-case sales drop: 20%").  

  3. **Distortion by "observer effects":** VoI assumes measurement doesn’t change the system. The procedure flags this in Step 4 but can’t resolve it (e.g., Case 3’s load test risk).  
     - *Mitigation:* In Step 5, lean on engineering judgment for risk tolerance.  

  4. **Harmful information edge cases:**  
     - *When more info hurts:* Perfectly used information can be harmful in:  
       - **Game theory scenarios** (e.g., competitors infer your strategy from public tests).  
       - **Ambiguity aversion** (e.g., more data reveals extreme risks, causing panic).  
       - **Overfitting** (e.g., A/B tests lead to local optima, ignoring long-term effects).  
     - *Your queue risk:* Low. Logistics software decisions (A/B tests, load tests) rarely involve adversarial dynamics. If a PM proposes a study that could leak strategic info (e.g., testing a new pricing model competitors could see), override Step 6 with "No."  

  5. **Biased thresholds:** Step 3 relies on PMs honestly defining "flip conditions." Overconfident PMs might set unrealistic thresholds (e.g., "only a 20% sales drop would stop launch").  
     - *Mitigation:* Spot-check decisions by asking, "What’s the smallest change that would flip your decision?"  

  ---

  ### **When to Abandon the VoI Framework**  
  Use this procedure for **irreversible, high-stakes decisions with clear actions**. Avoid it for:  
  - **Emergent problems** (e.g., "investigate customer complaints" where actions are unknown).  
  - **Exploratory research** (e.g., "study market trends" where goals aren’t decision-linked).  
  - **Low-stakes reversible decisions** (e.g., "test button color" – just ship and iterate).  
  - **Ethical/safety decisions** (e.g., "should we audit for bias?" – values dominate VoI).  

  ---

  ### **Implementation Tips**  
  - **Training:** Run a 30-minute workshop with PMs. Use your cases as examples. Emphasize:  
    - Step 3 ("flip conditions") is non-negotiable.  
    - Step 1 exposes politics—escalate these to leadership.  
  - **Scaling:** Build a lightweight template (Google Forms/Airtable) with the 6 steps.  
  - **Your role:** Audit 10% of "No" outputs to catch theater or misapplied judgment.  

  This procedure optimizes for speed and practicality while preserving VoI’s core: information must change actions to be valuable. It won’t eliminate all wasted studies, but it will force clarity on why a study is run—or why it’s theater.
