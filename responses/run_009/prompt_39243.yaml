prompt: |-
  My ethics prof keeps explaining supererogation with an exam analogy: duties are the required questions, and going above and beyond the call of duty is extra credit. you either answer the required questions or you fail (that's blame), the extra credit is optional — skipping it does nothing to your grade — but doing it earns praise, and there's a cap on how much it can count toward the total. A friend of mine who's a died-in-the-wool consequentialist uses the analogy to argue her own view can't allow supererogation at all: consequentialism grades on the raw total, not pass/fail, so "optional but praiseworthy" looks incoherent on it — whatever maximizes the total just IS what the exam demands, there's no pass mark to exceed.

  Can you audit the whole thing? Give me the correspondence table — what plays the role of the exam's total points, the grader, the pass/fail line, partial credit — and then where the mapping breaks. The obvious suspects: exams have a ceiling (you can't be asked for more than 100%, so "extra" has a natural start), but does morality have anything like that, or is the scale open-ended, in which case what could "extra" even mean? Is blame really like failing a required question, or can you be blameworthy while passing? Extra credit problems are usually cheap bonus trivia, whereas heroic acts are costly and risky — does the analogy quietly import effortlessness? And then the part I actually care about: does my consequentialist friend's conclusion survive once the disanalogies are out in the open, or was she only getting it because the analogy fixes a pass mark that her view might not need?

  Also, the analogy gets strained on easy rescues: if wading in to save a kid from a shallow pond is a required question rather than extra credit (which is what one reading of the pond case says), the extra credit section shrinks down to just the risky, costly stuff — running into the burning building. Is that actually what we mean by a hero, or did the analogy just quietly define heroism for us? And if the required section really does expand that far, is there any room left for the optional-but-praiseworthy at all, or does supererogation collapse into either duty or mere preference? If you think there's a better analogy that does the work this one was doing without importing a fixed ceiling and an external grader, I'd want to hear it.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're dealing with an ethics professor using an exam analogy to explain supererogation, and a consequentialist friend argues this analogy shows consequentialism can't accommodate supererogation. The user wants a detailed audit of the analogy, a correspondence table, where it breaks, and whether the friend's conclusion holds after examining disanalogies.

  First, I need to recall the key elements of supererogation: actions beyond duty that are praiseworthy but not obligatory. The exam analogy maps duties to required questions (pass/fail) and supererogation to extra credit (optional, adds points but capped). The friend's point is that consequentialism, focusing on maximizing good, has no separate pass mark, so everything is either required or not, leaving no room for "extra."

  The user's deeper concerns seem to be: 1) whether the analogy's fixed ceiling and external grader are necessary for supererogation, 2) if consequentialism truly can't allow for it, and 3) if expanding duties (like in the pond case) collapses supererogation. They also want a better analogy if possible.

  I should break down the analogy into components: total points, pass mark, grader, etc., and map them to ethical concepts. Then identify disanalogies: open-ended vs. capped scales, blame vs. failure, cost/risk in heroic acts vs. trivial extra credit. 

  For consequentialism, the friend's argument hinges on the lack of a pass mark. But some consequentialists (like Slote) use agent-centered options where personal costs can make supererogatory actions permissible but not required. Others (Singer) might see minimal duties as pass marks, with anything beyond as supererogatory. 

  The pond case shows how context affects duty. If saving a child in shallow water is a required question, then saving in dangerous situations might be extra. But heroic acts involve high risk, which the exam's extra credit doesn't capture. This might shrink the supererogatory space, but doesn't eliminate it if we accept variable duties based on cost/risk.

  The user might be worried that expanding duties too far leaves no room for supererogation. But thresholds can be set to allow for optional acts beyond basic requirements. The key is whether morality has a non-maximal baseline. If duties are demanding, supererogation shrinks; if less so, it expands.

  A better analogy could be a tiered performance system (bronze, silver, gold) without a fixed ceiling, where each tier represents increasing levels of moral achievement. This avoids the cap issue and external grader, focusing on social recognition instead.

  Ultimately, the friend's conclusion isn't inevitable. Consequentialism can accommodate supererogation with modifications, rejecting maximalism or incorporating agent-centered permissions. The exam analogy's flaws highlight where the ethical debate lies, but don't settle it. The user likely wants to understand if supererogation is viable under consequentialism or if the analogy misleads. Addressing the disanalogies shows that the concept can survive, depending on how we define duties and permissible sacrifices.
answer: |-
  Here's a full audit of the exam analogy for supererogation, its breakdowns, and the implications for your consequentialist friend's argument:

  **Correspondence Table:**

  | Exam Element          | Moral Analogy (Deontic View)        | Consequentialist Challenge           |
  | :-------------------- | :---------------------------------- | :----------------------------------- |
  | **Total Points**      | Overall "Goodness" of the act/agent | **The same: Total Value/Utility Produced.** |
  | **Grader**            | Moral Community/Reason/God          | **The same: Moral evaluation.**      |
  | **Pass/Fail Line**    | **Minimum Threshold of Duty** (What you *must* do to avoid blame). | **Doesn't exist / Is maximal.** Whatever *doesn't* maximize is "failing". |
  | **Required Questions**| **Strict Duties/Obligations** (Justice, non-maleficence, specific promises). | **Whatever action(s) maximize value.** Only one "question" matters: "Did you maximize?". |
  | **Failing (Required)**| **Blameworthiness / Wrongdoing**    | **Failing to maximize value.**       |
  | **Extra Credit**      | **Supererogatory Acts** (Praiseworthy but optional). | **Incoherent.** Maximizing *is* required. Doing *less* than max is failing. |
  | **Partial Credit**    | **Mitigated Blame / Imperfect Duties** (Effort counts, but may not fully discharge duty). | **Suboptimal outcomes.** Still a "failing" grade relative to the max. |
  | **Bonus Cap (100%)**  | **Conceptual Limit on "Owed" Good** (Duty has an upper bound beyond which action is optional). | **No inherent cap.** The "scale" of potential good is open-ended. More good is always better. |
  | **Praise (EC)**       | **Moral Praise for Heroism/Saintliness** | **Only for maximizing.** Praise is binary: maxed or didn't. No "extra" level. |
  | **Skipping EC**       | **No Blame, No Praise (Morally Neutral)** | **Blame for not maximizing.**        |

  **Where the Analogy Breaks Down (Disanalogies):**

  1.  **The Fixed Ceiling (100%):**
      *   **Exam:** A hard cap exists. You *can't* be required to score 110%. Extra credit starts *after* 100% is achievable via required questions.
      *   **Morality:** **No obvious ceiling.** How much good *could* one do? (Donate 10%? 50%? 99%? Devote life to charity?). The scale seems open-ended. Without a defined "100% duty point," where does "extra" begin? This is the core challenge for defining supererogation generally, not just for consequentialism.

  2.  **The Nature of "Extra Credit" vs. Heroic Acts:**
      *   **Exam:** Extra credit is usually **low-cost, low-risk, optional trivia**. It adds points easily.
      *   **Morality:** Supererogatory acts are often **high-cost, high-risk, and demanding** (saving a life at great personal peril, radical self-sacrifice). The analogy *downplays effort/cost*, making "extra" seem trivial when it's often monumental.

  3.  **Blame vs. Failing:**
      *   **Exam:** Failing a required question = automatic failure. Binary.
      *   **Morality:** Blameworthiness is **graded and context-dependent**. You can marginally fulfill a duty (barely pass) and still be blameworthy *to some degree* for doing the minimum poorly or resentfully. You can also *exceed* minimal duty significantly without reaching the heroic "extra credit" level (partial credit exists between pass and max).

  4.  **External Grader vs. Moral Reality:**
      *   **Exam:** Grade is assigned *by* the professor/institution.
      *   **Morality (Realist View):** Duties and praiseworthiness exist independently of societal judgment. The analogy risks making morality seem *conventional* (defined by the "grader").

  **Your Specific Concerns & The Consequentialist Argument:**

  1.  **Does your friend's conclusion survive?**
      *   **Her argument is strong *within strict, maximizing, act-consequentialism*.** If the *only* moral demand is "Maximize the Good," then:
          *   Anything less than the *best available action* is morally deficient (failing).
          *   There's no conceptual space for an action that is:
              *   (a) Morally *permissible* (not blameworthy),
              *   (b) Not the maximizing option, *and*
              *   (c) Morally *praiseworthy*.
          *   Praise only attaches to maximizing; blame attaches to anything less. The "optional but praiseworthy" category collapses. The exam analogy *reveals* this structural feature of maximizing consequentialism.

  2.  **The Shallow Pond & the Shrinking "Extra Credit":**
      *   You're right. If saving the child in the shallow pond (low cost) is a *required question* (duty), then "extra credit" is pushed further out to **only the highest-cost/highest-risk acts** (like running into the burning building).
      *   **Is this what heroism is?** Often, yes. Heroism typically *does* involve exceptional risk/sacrifice beyond what could reasonably be demanded of anyone. The analogy doesn't *define* heroism, but it *reflects* how we often distinguish duty from supererogation: **the level of personal cost/risk involved.** The "required section" expands to cover *all* low-to-moderate cost beneficence for many (e.g., Singer-inspired views). Supererogation is reserved for the *truly* demanding.
      *   **Does supererogation collapse?** Not necessarily, *if* we accept a **non-maximal baseline for duty.** Duty demands actions up to a point defined by *significant but not overwhelming* sacrifice (the pass mark). Acts demanding *extreme* sacrifice remain optional and supererogatory, even if they produce more good. The challenge is rigorously defining that baseline.

  3.  **Is there room left for supererogation?** Yes, *if* we reject the idea that duty demands *every* possible good action, no matter the cost. We need a **threshold theory of duty**. Duty requires us to do *enough* good (pass the exam), but not necessarily *the absolute most* good humanly possible (get 100% + bonus). The space *between* "enough" (passing) and "the absolute most" (maximizing) is where supererogation lives. Consequentialism struggles with this threshold.

  **A Better Analogy: Tiered Performance Levels (e.g., Service Awards)**

  *   **Bronze Level:** **Minimum Duty.** Achievable with reasonable effort by most. Failing this results in significant blame/punishment (e.g., fired, sanctioned). *(Passing the exam)*.
  *   **Silver Level:** **Commendable Performance.** Clearly exceeds the minimum, involves noticeable extra effort/skill. Earns recognition and praise, but falling short *only* means missing this praise, not blame. *(Getting a B/A on the exam without EC)*.
  *   **Gold Level / "President's Club":** **Supererogatory/Heroic.** Exceptional, extraordinary performance involving high sacrifice, risk, or rare talent. Earns the highest praise, awards, and admiration. Not expected of everyone; failing to reach it carries *no blame whatsoever*. *(Doing significant extra credit / aced exam + bonus)*.
  *   **No Fixed Ceiling:** Someone might achieve "Platinum" (sainthood/martyrdom), but these are clearly *beyond* any conceivable duty.

  **Why this works better:**

  1.  **No Arbitrary 100% Cap:** The scale is open-ended, but duties are tied to achievable levels (Bronze), not the theoretical maximum.
  2.  **Accommodates Cost/Risk:** Reaching higher tiers inherently involves greater effort/sacrifice.
  3.  **Clear "Optional but Praiseworthy":** Silver and Gold are praiseworthy but not required. Only failing Bronze brings blame.
  4.  **No External Grader Needed:** The tiers can represent inherent levels of moral achievement/sacrifice.
  5.  **Compatible with (Modified) Consequentialism?:** A consequentialist *could* adopt this by arguing duty only demands meeting a *sufficient* level of good (Bronze), not maximal good. Praiseworthiness increases as outcomes (or effort relative to capacity) increase beyond that sufficiency threshold. This rejects *maximizing* as the sole requirement.

  **Conclusion:**

  Your consequentialist friend is **largely correct *if* we assume strict maximizing act-consequentialism.** The exam analogy effectively exposes why: without a non-maximal baseline for duty ("pass mark"), the "optional but praiseworthy" category vanishes. Everything is either required (maximizes) or blameworthy (suboptimal).

  However, the analogy also **breaks down** due to morality's open-ended scale, the high cost of heroism vs. trivial EC, and graded blame. The "Shallow Pond" point shows how the *scope* of duty impacts the *scope* of supererogation, but doesn't necessarily eliminate it, provided we accept that duty has *limits* based on cost/risk.

  **Supererogation survives if we reject maximalism.** The "Tiered Performance" analogy offers a better model, defining duty by a **sufficientarian threshold** rather than an impossible maximum. While this requires modifying standard consequentialism (e.g., incorporating agent-centered *options* or *prerogatives* allowing agents to sometimes prioritize their own interests without maximizing the good), it shows your friend's conclusion isn't *inevitable*; it depends on accepting a very demanding, maximalist version of consequentialism. The debate hinges on whether morality *has* that non-maximal pass mark. The exam analogy is a useful tool for framing the problem, but its disanalogies reveal where the real philosophical work lies.
