prompt: |-
  I'm a software engineer with no philosophy training, and at work we score project proposals on a rubric of scale times feasibility times "nobody else is doing this" — basically a home-grown version of the importance, tractability, and neglectedness framework that effective-altruism groups use for prioritizing causes. I recently tried applying the borrowed version to my own charitable giving and produced an argument whose conclusion I can't accept, even though each step looked fine when I wrote it:

  (1) A fixed budget should be directed wherever the product of importance, tractability, and neglectedness is highest.
  (2) Importance is bounded above by the full scale of the problem, but tractability and neglectedness both fall as effort on a cause rises: the more people already work on something, the less each additional unit of effort accomplishes and the less neglected the cause becomes.
  (3) So any cause that already receives serious attention gets pushed down the ranking, and the top of the ranking will always be occupied by a cause that almost nobody works on.
  (4) Among causes nobody works on, the ranking is settled by importance times tractability, and since there is no shortage of untouched problems that are small but very cheap to fix, I can always find one whose product beats any crowded cause — it only needs to be somewhat less small than the last one I found.
  (5) Therefore the framework directs my giving toward some obscure, minor, completely unattended problem, and away from any major problem, precisely because major problems attract serious funding.
  (6) That can't be right: the framework was supposed to help me locate the most important causes, not to make me flee whatever anyone else cares about.

  I can't tell which step to reject. I'd like to keep (2), since diminishing returns seem real, and I'd be relieved to learn that (4) is where the argument cheats, but I can't pin down exactly how it cheats. Where does this go wrong, and what does rejecting that step cost me?
reasoning: |-
  Okay, let's tackle this problem. The user is a software engineer applying a rubric similar to EA's ITN framework to charitable giving. They've derived a conclusion that seems counterintuitive: the framework always directs them to obscure, minor problems because major ones are well-funded. They can't accept this but can't spot the flaw.

  First, I need to trace their argument step by step. Step 1 is the ITN formula: budget allocation based on I×T×N. Step 2 notes that importance is capped, but tractability and neglectedness decrease as effort increases. Step 3 concludes that causes with existing effort rank lower. Step 4 argues that among neglected causes, small but cheap fixes will always outrank major ones. Step 5 says this leads to funding obscure problems. Step 6 rejects this outcome.

  The user suspects step 4 might be flawed but isn't sure. They want to keep step 2 (diminishing returns). Where's the error?

  Let me think about step 4. The user claims that among unattended problems, you can always find a small, cheap one whose I×T product beats crowded causes. But is that true? Importance (I) isn't just about absolute scale. In EA, importance might be the value of solving the entire problem. However, for small problems, even if tractability is high, the absolute impact might be tiny. For example, fixing a rare disease affecting 100 people cheaply has low importance compared to malaria affecting millions, even if the latter is harder to solve per dollar due to existing efforts.

  Ah, that's a key point. The ITN framework uses the absolute importance, not per-dollar. So a small problem has low I, even if T is high. Step 4 assumes that a small problem's I×T can beat a large problem's, but if I is too small, even high T won't help. The product could still be lower than a major problem's ITN score, especially since neglectedness (N) is part of the original formula. The user dropped N in step 4 when comparing within neglected causes, but N is already accounted for in the initial ranking. 

  Also, tractability (T) might not scale linearly. Some problems have high fixed costs or thresholds. A small problem might be cheap per unit but still require a minimum investment to make any difference. The user's step 4 ignores that possibility.

  Moreover, neglectedness (N) isn't just about the number of people working on it but the remaining work needed. If a problem is 99% solved, N is low, but if it's massive and only 10% addressed, N could still be high. The user's step 3 oversimplifies by assuming any serious attention reduces N significantly, which might not be true for colossal problems.

  So the main flaws are in step 4: underestimating the importance of large problems and overestimating the tractability of small ones without considering absolute impact thresholds. Also, step 3 might not account for the magnitude of neglect in large-scale issues. Rejecting step 4 means acknowledging that small problems can't trivially outcompete large ones in I×T, and rejecting step 3's generalization that all attended causes are pushed down equally. This preserves the core of ITN while adjusting for real-world scale and complexity.
answer: |-
  Your reasoning highlights a genuine tension in the ITN framework, but the flaw lies primarily in **step (4)**, with secondary issues in the interpretation of step (3). Here's the breakdown:

  ### Where the Argument Fails
  1. **Step (4) Misunderstands "Importance" and "Tractability"**:
     - **Importance (I) is the absolute scale of the problem**, not its per-dollar solvability. A "small but cheap" problem has low *absolute importance* by definition. For example:
       - **"Small" Problem**: Fixing a rare disease affecting 100 people. Importance (I) = 100 (lives saved).  
       - **"Large" Problem**: Reducing malaria deaths affecting 600,000/year. Importance (I) = 600,000.  
     - **Tractability (T) is the *proportion* of the problem solved per unit effort**. A "cheap fix" implies high T, but even if T is near-perfect (e.g., $1 saves 1 life for the small problem), **I × T = 100 × 1 = 100**.  
     - For the large problem, even if tractability is low (e.g., $10,000 saves 1 life due to existing efforts), **I × T = 600,000 × (1/10,000) = 60**.  
     - **Result**: The small problem wins (100 > 60) *only if neglectedness (N) is equal*. But N is part of the framework! Step (4) ignores that **N ≠ 1 for all unattended causes** and that **I dominates large problems**.

  2. **Step (4) Assumes Unlimited "Small but High-I×T" Problems**:
     - In reality, problems with high *absolute I × T* among neglected causes are rare. If a problem is both highly tractable *and* important (even moderately), it’s unlikely to be completely neglected. Truly "obscure minor" problems have low I, capping I × T.

  3. **Step (3) Overgeneralizes "Serious Attention"**:
     - **Neglectedness (N) is relative to the problem’s scale**. A cause can receive "serious attention" but still be highly neglected *if the problem is vast*.  
     - *Example*: Global malaria funding is $3B/year but needs $6B for full coverage. Doubling funding would save ~300K lives/year. Here:  
       - **I** = 600K deaths/year,  
       - **T** = Medium (each $ saves lives but with diminishing returns),  
       - **N** = High (50% funding gap remains → high marginal impact per dollar).  
       - **I×T×N** could still dominate a tiny neglected problem with I=100, T=1, N=1.

  4. **The Framework Uses *Marginal* Impact**:
     - ITN measures **marginal impact per dollar**, not total impact. A "crowded" cause has low N and often low T (diminishing returns), but if I is enormous, I×T×N can still be high.  
     - *Counterexample to Step (5)*: GiveWell recommends the Against Malaria Foundation (AMF) despite $3B/year in funding. Why? Because:  
       - **I** remains colossal (600K deaths/year),  
       - **T** is moderate ($5,000 saves a life),  
       - **N** is high (funding gaps persist → your $ saves lives *now*).  
       - **Result**: AMF scores highly *despite* not being obscure.

  ---

  ### What Rejecting Step (4) Costs You
  By rejecting step (4), you accept that:
  1. **Importance (I) dominates the product** for large-scale problems, even when T and N are modest.  
  2. **Truly high-impact neglected opportunities are scarce**. You can't "always find" a minor problem that beats major ones in I×T×N.  
  3. **Real-world ITN leaders (e.g., global health charities) validate this**: They rank highly *because* I is massive, not because they’re obscure.

  ---

  ### How to Apply ITN Correctly
  1. **Quantify Importance Absolutely**:  
     - "Importance" = Total disability-adjusted life years (DALYs) or lives at stake.  
  2. **Assess Neglectedness Rigorously**:  
     - N ≈ (Unmet need) / (Total need). A cause with 90% unmet need is highly neglected even if funding exists.  
  3. **Beware of "Tiny Cause" Traps**:  
     - Reject causes where I×T is small (e.g., saving 10 lives for $100) unless no larger opportunities exist.  
  4. **Use Real Data**:  
     - Consult groups like GiveWell or Open Philanthropy. If your framework avoids their top picks, you’ve likely misapplied ITN.

  ### Why the Argument Felt Persuasive
  - **Software Engineering Analogy**: In tech, "small quick wins" (e.g., fixing a trivial bug affecting 1% of users) often dominate efficiency metrics. But in philanthropy, "scale" (I) carries exponential weight.  
  - **Neglectedness Blind Spot**: N is counterintuitive; it feels like "no one cares" should correlate with small problems, but giant problems (e.g., pandemic prevention) can be both neglected and critical.

  ### Conclusion
  The flaw is in **step (4)**: You can’t trivially find small, unattended problems whose I×T exceeds that of major causes. Rejecting this preserves ITN’s core insight—massive, underfunded problems (e.g., malaria, AI safety) can and do top the rankings *despite* receiving funding. Your giving shouldn’t flee major causes; it should flee *saturated* causes where marginal impact is low. Use data to find the sweet spot where scale, solvability, and neglect converge.
