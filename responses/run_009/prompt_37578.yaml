prompt: |-
  I'm a PhD student in political theory and I'm trying to work out what I actually think about the whole equality-of-what question by going through my gut verdicts on cases, instead of starting from the big frameworks. Here's my current set. Two neighbours with the same salary and the same flat, one of them is blind and spends a decent chunk on assistive tech, accessible transport, audio stuff: he's worse off, and the egalitarian planner owes him something. A deaf woman whose whole environment is fully signed — school, work, family, everyone signs, and she reports the same life satisfaction as her hearing colleagues on the same income: no inequality left, we don't owe her a top-up. A guy who's miserable unless his food and drink are way fancier than what everyone else is content with, on the same income that leaves the rest of them satisfied: we don't subsidize him, his expensive tastes are his problem. A slum dweller who is honestly, cheerfully content — genuinely happy, would tell you so — compared with a grumbling rich man who reports lower life satisfaction: the slum dweller is much worse off, I'm sure of it, even though on a happiness metric he's ahead. And two colleagues on identical salaries in the same fixed pay band, where one is on call every weekend and works 60-hour weeks while the other works 30: the overworked one is worse off, even though she choose that job with eyes open and could have taken the quieter one. So, is there a principle that gets all five? I can half-see one — something like "equalize capability sets, but only at a generic level, and don't count contentment that's adaptive" — but I can't make it precise and it smells like it's doing a lot of ad hoc work to save my verdicts. What I want from you: state the principle, or a couple of candidates, as precisely as you can; say which of my verdicts each clause is there to save; tell me what it predicts on a case I haven't listed — for instance someone with chronic fatigue who can only work twenty hours a week, or an illiterate sixty-year-old who's serenely uninterested in learning to read; and be honest about which of my verdicts you'd overturn rather than save, if any, and why that one rather than the others. Lead with your bottom line in the first sentence, then give the reasoning — no preamble and no restating my question back at me.
reasoning: |-
  Hmm, the user is a PhD student in political theory working through the "equality of what" question using case-based intuition rather than starting from frameworks. They've described five scenarios where they have strong egalitarian intuitions and want a principle that captures all their verdicts.

  Looking at their cases: The blind neighbor needs compensation despite same income/conditions; the fully accommodated deaf woman doesn't; the expensive tastes guy shouldn't be subsidized; the content slum dweller is worse off than the unhappy rich man despite happiness metrics; and the overworked colleague is worse off despite voluntary choice.

  Their proposed "equal capability sets at generic level + ignore adaptive contentment" seems close but feels ad hoc. They want me to: (1) state precise principle(s), (2) map clauses to cases, (3) test on new cases (chronic fatigue worker, content illiterate elder), and (4) identify any verdicts I'd overturn.

  My core principle would be: Equalize effective access to core functionings required for human agency, excluding expensive tastes and adaptive preferences. Breaking this down:
  - "Core functionings" covers basics like mobility, communication, health - explains blind neighbor (needs mobility access) vs. deaf woman (already has communication access)
  - "Effective access" implies actual opportunity regardless of personal expenditure - explains why blind neighbor gets help with assistive tech costs
  - "Excluding expensive tastes" handles the gourmet guy - his preferences aren't core needs
  - "Human agency" as threshold explains why slum dweller is worse off despite happiness - lacks substantive freedoms
  - "Ignoring adaptive contentment" addresses the slum dweller's false consciousness
  - "Required for agency" covers the overworked colleague - excessive work hours impair health/autonomy

  Testing new cases: Chronic fatigue worker needs compensation for lost earning power since health is core functioning. Content illiterate elder gets help even if uninterested - literacy enables agency in modern society.

  I'd potentially overturn the deaf woman verdict: Full signing environment is rare; principle might still require ensuring alternative communication access exists. Their "no top-up" view assumes perfect accommodation, but real-world accessibility gaps might require compensation.

  The principle avoids welfarism by focusing on objective capabilities, avoids brute luck by compensating for unchosen disadvantages, and rejects expensive tastes as responsibility. The "core functionings" threshold prevents infinite claims while addressing adaptive preferences through agency-focused requirements.
answer: |-
  **Bottom line:** The principle capturing your verdicts is: *Equalize effective access to a threshold level of core, agency-enabling functionings, where "core" excludes expensive tastes and "effective access" corrects for unchosen costs/barriers, while treating self-reported satisfaction as irrelevant when it conflicts with objective access to these functionings.*

  ---

  ### **The Principle Explained & Mapped to Your Cases**
  1. **"Equalize effective access..."**: Compensate for *extra costs required to achieve core functionings* due to unchosen circumstances.  
     → **Saves the blind neighbor verdict**: He spends more to achieve basic mobility/communication, so compensation is owed to make his *effective access* equal.  
     → **Saves the overworked colleague**: Her long hours reduce effective access to rest/leisure (core functionings), even if chosen.  

  2. **"...to a threshold level of core, agency-enabling functionings"**: Focus on *objectively necessary capabilities for basic agency* (e.g., senses, mobility, health, social participation), not all possible functionings.  
     → **Saves the deaf woman verdict**: If signing fully enables communication/participation (core functioning), no top-up is needed—equality is achieved.  
     → **Excludes the expensive-tastes guy**: Gourmet food isn’t "core" or agency-enabling; his tastes are non-essential preferences.  

  3. **"...where 'core' excludes expensive tastes"**: Explicitly rejects subsidizing luxury preferences.  
     → **Saves the expensive-tastes verdict**.  

  4. **"...treating self-reported satisfaction as irrelevant when it conflicts with objective access"**: Adaptive preferences (e.g., contentment from deprivation) don’t negate inequality.  
     → **Saves the slum dweller verdict**: His happiness is adaptive; objectively, he lacks core functionings (security, health, etc.) compared to the rich man.  

  ---

  ### **Predictions on New Cases**
  - **Chronic fatigue worker (can only work 20hr/week)**:  
    *Principle predicts compensation is owed.* Health is a core functioning; her unchosen condition reduces effective access to income/security. Society should top up her earnings to match the threshold achievable by others working standard hours.  
    *Clause:* "Effective access" corrects for unchosen health barriers to income (a proxy for agency).  

  - **Illiterate 60-year-old (serenely uninterested in reading)**:  
    *Principle predicts intervention is owed.* Literacy enables core functionings (e.g., accessing information, autonomy). His lack of interest is an adaptive preference; society should provide education access, even if he refuses.  
    *Clause:* Self-reported satisfaction is irrelevant; objective access to agency-enabling functionings takes priority.  

  ---

  ### **Verdict I’d Overturn: The Deaf Woman**  
  - **Why overturn?** Your verdict assumes a *perfectly* accommodated environment is stable and universal. But if society doesn’t guarantee sign language access (e.g., in emergencies, new workplaces, or public services), her *effective access* to core functionings (e.g., safety, healthcare) is objectively worse than hearing peers. The principle would require ensuring this access—possibly via subsidized interpreters or legal protections—even if her current satisfaction is equal.  
  - **Why this one?** It’s the only case where your verdict risks mistaking contingent local accommodation for structural equality. The others are robust: the blind neighbor *always* faces extra costs; the slum dweller *always* lacks core functionings; etc.  

  ---

  ### **Why This Principle Isn’t Ad Hoc**  
  It’s a hybrid of **capability threshold egalitarianism** (Sen/Nussbaum) with **responsibility-sensitive desert** (Dworkin):  
  - **Core functionings** define a minimum for agency (avoiding infinite claims).  
  - **Effective access** addresses brute luck disadvantages (blindness, fatigue).  
  - **Excluding expensive tastes** respects personal responsibility.  
  - **Ignoring adaptive contentment** avoids false negatives (slum dweller).  
  The unity comes from prioritizing *objective conditions for agency* over subjective states, which aligns with your rejection of welfarism (happiness metrics) and resourcism (identical salaries ≠ equality).
