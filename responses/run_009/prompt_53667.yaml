prompt: |-
  I write historical fiction, and for fifteen years my partner — a historian of early modern Europe who reads my drafts before any editor does — has been issuing verdicts on the explanations I tuck into afterwords and put in the mouths of my characters. When I ask her for the principle behind her rulings, she waves me off and says the next manuscript will tell. Her track record, as best I can reconstruct it: she accepted my account of the trench stalemate of the First World War, which rests on the generalization that entrenched defenders with machine guns dominate massed infantry; she accepted the standard explanation of the collapse of the Aztec Empire via smallpox, praising the underlying generalization about previously isolated populations meeting Old World diseases; she accepted an explanation of the Reformation's spread that turns on cheap printing lowering the cost of coordinated dissent; she rejected, as an explanation, the claim that Princip's shots caused the First World War — she concedes they were a cause but insists that two pistol shots are not an explanation; she rejected a biography's account of Napoleon's invasion of Russia as hubris, remarking that hubris is a diagnosis, not an explanation; and she accepted my account of the repeal of the Corn Laws, which traces a particular sequence — the famine, Peel's conversion, the League's agitation, the parliamentary arithmetic — though she grumbled that its generalizations were all implicit and would have to be written out before it counted as finished.

  My next novel is about the Haitian Revolution, and my afterword currently explains its success through three ingredients at once: a lawlike statistical claim (European armies campaigning in the Caribbean suffer catastrophic mortality from yellow fever, to which the formerly enslaved population has far greater resistance); a traced chain of particular decisions (the French expedition's early victories, the treachery by which Toussaint was seized and shipped to France, the moment news arrived that slavery had been reinstated in the other colonies, Dessalines's final campaign); and an overall narrative arc from the uprising of 1791 to independence in 1804, told so the reader can follow how each stage grew out of the one before.

  Predict her verdict on this afterword — accept, reject, or accept with conditions — and tell me what exactly she will demand I change. Then reconstruct the rule she seems to be running: strict covering-law explanation, causal-chain explanation, narrative understanding, statistical relevance, or something else that fits her six earlier verdicts just as well. I want the rival rules that also fit, where they diverge in their editorial demands on my afterword (for instance, whether she will insist the yellow fever generalization carry the explanatory weight and demote the rest to narrative ornament, or instead foreground Dessalines's reasons and treat the epidemiology as background), and your best guess as to which rule is really hers and why. Finally, name the one further case — an explanation I could float at dinner — that would most cleanly separate the candidate rules, and say what each rule predicts she would say about it.
reasoning: |-
  Okay, the user writes historical fiction and has a historian partner who reviews their drafts. They've provided several examples of her verdicts on their afterword explanations. Now they're working on a novel about the Haitian Revolution and want to predict her verdict on their current afterword explanation. They also want to understand the underlying rule she's using and test it with a new case.

  First, I need to analyze the partner's past verdicts. She accepted explanations that had clear generalizations like entrenched defenders with machine guns dominating infantry, smallpox affecting isolated populations, and cheap printing enabling coordinated dissent. But she rejected Princip's shots as the cause of WWI, calling it a cause but not an explanation. She also rejected hubris as an explanation for Napoleon's invasion, saying it's a diagnosis, not an explanation. She conditionally accepted the Corn Laws repeal explanation but wanted explicit generalizations.

  Looking at the Haitian Revolution afterword, it combines three elements: a statistical claim about yellow fever mortality, a chain of specific decisions and events, and a narrative arc. The key question is whether this meets her criteria. She probably values explicit generalizations, so the yellow fever claim might be acceptable like the smallpox example. But the chain of events and narrative might need to show clear causal links, not just a sequence.

  Her rule seems to be that explanations need explicit causal mechanisms or generalizations. She rejects singular events (like Princip's shots) or abstract concepts (like hubris) without underlying mechanisms. For the Haitian afterword, she might accept it conditionally, demanding that the generalizations be made explicit and the narrative clearly show causation between stages.

  Alternative rules could be covering-law (which might overemphasize the yellow fever part), causal-chain (focusing on Dessalines's decisions), or narrative (accepting the arc as is). But her past behavior suggests a blend, prioritizing mechanisms over mere chronology or single causes.

  A test case could be explaining the fall of the Roman Empire with barbarian invasions. Covering-law would want a generalization about empires falling due to invasions. Causal-chain would focus on specific battles or decisions. She'd likely reject it without deeper mechanisms, like economic strain or internal decay.

  So, predicting her verdict: accept with conditions, requiring explicit links in the narrative and clear articulation of the yellow fever generalization. The underlying rule is "causal-mechanism explanation," integrating generalizations with specific chains. The test case helps distinguish by seeing if she demands more than just events.
answer: |-
  Based on her track record and the structure of your Haitian Revolution afterword, here's the breakdown:

  1.  **Predicted Verdict:** **Accept with Conditions.**
  2.  **Demanded Changes:** She will demand that you:
      *   **Explicitly State the Causal Mechanism within the Narrative Arc:** While you say "each stage grew out of the one before," she will want the *specific causal links* between these stages made explicit *within the explanation itself*, not just implied by the narrative flow. *How* did the French victories lead to the conditions for Toussaint's seizure? *How* did the news of reinstated slavery directly cause the shift in strategy or unity? *How* did the specific sequence empower Dessalines's campaign? She wants the "grew out of" translated into concrete cause-and-effect steps woven into the chain.
      *   **Make the Yellow Fever Generalization Do More Work:** She won't let it just sit as "an ingredient." She'll demand you explicitly connect it to *specific outcomes* in the chain. How did catastrophic mortality *directly cause* French strategic failures, troop shortages, or specific defeats at key moments? How did differential resistance *directly enable* Haitian maneuvers, endurance, or specific tactical choices? She wants the statistical law shown *actively shaping* the events in your traced chain.
      *   **Clarify the Interaction:** How did the epidemiological factor (yellow fever) *interact* with the political/military decisions? Did disease create opportunities exploited by Dessalines? Did resistance allow for strategies impossible for the French? The ingredients need to be shown mixing, not just listed side-by-side.

  **Reconstructing Her Rule:**

  Her consistent pattern rejects **singular events as sufficient explanations** (Princip's shots) and **abstract character diagnoses** (Hubris) because they lack *mechanism* and *generality*. She accepts explanations grounded in **causal generalizations** (machine guns favor defense, isolated populations vulnerable to disease, cheap printing enables dissent) and **traced sequences** (Corn Laws repeal - conditional on explicitness).

  The rule that best fits all six verdicts is **Causal Mechanism Explanation (CME)**. This approach demands:
  *   **Identification of Causal Components:** The relevant entities/actors/forces (e.g., European armies, yellow fever virus, formerly enslaved population, Toussaint, Dessalines, French commanders).
  *   **Specification of Activities/Interactions:** What these components *do* and how they *interact* to produce change (e.g., yellow fever *kills* European soldiers *at a high rate*, granting Haitian forces a *strategic advantage*; Dessalines *exploits* this advantage by *pursuing* a specific campaign *in response to* the reinstatement of slavery).
  *   **Explicit Causal Links:** Showing *how* one event leads to the next via these mechanisms (e.g., French losses to disease *cause* troop shortages, which *force* strategic overextension, which *creates* an opportunity Toussaint *exploits*).
  *   **Generalizations as Underlying Mechanisms:** Statistical laws (like disease mortality) or social regularities (like the effect of cheap printing) are valued *because* they describe the stable mechanisms (biological vulnerability, information dissemination) that *drive* the specific sequence.

  **How Rival Rules Fit (and Diverge on Your Afterword):**

  1.  **Strict Covering-Law (CL):** Would demand your explanation be a logical deduction from universal laws. Fits the *accepted generalizations* but poorly fits the *rejected singular causes* and the *accepted traced sequence* of the Corn Laws. It would also struggle with the complexity of multiple factors interacting.
      *   *Divergence for Haiti:* A strict CL advocate would likely **insist the yellow fever generalization carry the primary explanatory weight**, potentially viewing the specific chain and narrative arc as merely illustrating the law or as contingent details. They might demand you show Haitian success as *deducible* primarily from the disease mortality differential law, demoting decisions/sequence to secondary importance. Your partner's acceptance of the multi-factor Corn Laws sequence (even conditionally) makes strict CL unlikely.
  2.  **Causal-Chain Explanation (CCE):** Focuses on tracing a sequence of specific events linked by causation. Fits the *rejection of singular events* (needs a chain), the *acceptance of the Corn Laws sequence*, and potentially the *rejection of hubris* (too vague for a chain link). It fits less well with her strong emphasis on *underlying generalizations* as necessary components.
      *   *Divergence for Haiti:* A pure CCE advocate would likely **foreground Dessalines's reasons and the specific decisions/events** as the core explanation. The yellow fever generalization might be treated as important background context enabling the chain, but not necessarily as an *active causal component* needing explicit linkage within the chain's mechanism. Your partner's demand for explicit generalizations (e.g., Corn Laws, machine guns) goes beyond pure sequence-tracing.
  3.  **Narrative Understanding (NU):** Emphasizes coherence, meaning, and following a story. Fits the *acceptance of the Corn Laws sequence* and the *rejection of hubris* (too abstract, not a story element). It fits poorly with the *rejection of Princip's shots* (a perfect narrative hook!) and the *demand for explicit generalizations*. She cares about the *causal* structure *within* the narrative, not just the narrative flow.
      *   *Divergence for Haiti:* A NU advocate would likely **accept your "overall narrative arc" as sufficient** if it's coherent and allows the reader to follow. They might be less concerned about explicitly stating the yellow fever mechanism or demanding intricate proof of every causal link in the chain, focusing instead on the story's internal logic and emotional resonance. Your partner's grumbles about "implicit" generalizations in the Corn Laws explanation show she demands more than NU provides.
  4.  **Statistical Relevance (SR):** Focuses on factors that raise the probability of the outcome. Fits the *accepted generalizations* (disease, machine guns, printing) as relevant factors. It fits poorly with the *rejection of Princip's shots* (statistically relevant to the war starting!) and the *acceptance/rejection based on mechanism vs. diagnosis*. SR doesn't inherently demand *how* the factor works, just that it correlates.
      *   *Divergence for Haiti:* An SR advocate would likely **accept the yellow fever claim as a relevant factor** but might be less concerned about *how* it interacted with decisions or the *specificity of the causal chain*. They might see the inclusion of the statistical claim as sufficient for its explanatory role. Your partner's demand for explicit mechanisms and traced sequences goes beyond mere relevance.

  **Best Guess for Her Rule:** **Causal Mechanism Explanation (CME).** It uniquely captures her insistence on:
  *   Rejecting insufficient singular causes and vague diagnoses.
  *   Requiring underlying generalizations that describe the *mechanisms* at work.
  *   Demanding explicit, traceable sequences of cause-and-effect events.
  *   Wanting the generalizations *integrated* into the causal chain, showing *how* they operate.
  *   Her conditional acceptance of the Corn Laws explanation hinging on making generalizations explicit and mechanisms clearer.

  **The Discriminating Test Case:**

  **Explanation to Float:** "The Roman Empire in the West fell primarily because of the barbarian invasions."

  **What Each Rule Predicts She Would Say:**

  1.  **Causal Mechanism Explanation (CME):** **Reject.** "Barbarian invasions" is a singular (or category of) event(s), not a mechanism. *How* did the invasions cause collapse? What were the *specific mechanisms*? (e.g., Did they disrupt tax collection? Destroy infrastructure? Shatter military cohesion? Overwhelm depleted legions? Exploit internal divisions?). She'd demand an explanation detailing the *interactions* (e.g., Goths defeating Valens *due to* Roman tactical errors *compounded by* troop shortages *caused by* earlier losses) and the *underlying vulnerabilities* (e.g., economic strain, succession crises, overextension) the invasions exploited.
  2.  **Strict Covering-Law (CL):** **Likely Reject or Demand Unrealistic Law.** It's hard to state a universal law about empires falling due to invasions. She might reject it as insufficiently law-like or demand an impossible universal generalization ("All empires facing significant invasions collapse?" - demonstrably false).
  3.  **Causal-Chain Explanation (CCE):** **Conditionally Accept (demand chain).** She'd accept invasions as a major *cause* but demand the *specific sequence* be traced: Which invasions? When? What specific defeats? What consequential decisions (e.g., allowing foederati settlements, assassination of key generals)? How did *this* invasion lead to *that* province being lost? She might be less concerned about deep underlying generalizations beyond "invasions are bad for empires."
  4.  **Narrative Understanding (NU):** **Likely Accept.** "Barbarian invasions" provides a clear, dramatic narrative arc for the fall – a recognizable story of pressure, conflict, and decline. The coherence and storytelling potential might suffice.
  5.  **Statistical Relevance (SR):** **Accept.** Barbarian invasions are statistically relevant to the collapse of the Western Roman Empire. Their presence raises the probability of collapse compared to periods without major invasions. No demand for mechanism or specific chain is inherent.

  This test cleanly separates CME (demands mechanism) from CCE (demands sequence, less on deep mechanisms), NU (accepts narrative), and SR (accepts relevance), while highlighting CL's impracticality for complex historical events. Her rejection of this explanation would strongly confirm CME. Even a conditional acceptance demanding a sequence would still likely involve her pushing for the mechanisms *behind* the sequence's effectiveness.
