     - The paradox: the constraint against doing X forbids you from doing X even when doing X would minimize the total number of X's.

  7. Connect to Kant and Mill:
     - Kantianism (deontology) would focus on the rule: do not use your own agency to violate the rule, regardless of consequences.
     - Utilitarianism would focus on minimizing the total losses.

  8. Finally, ask: "How does this structure appear in real moral dilemmas? Can you think of examples?" (Avoiding the stock cases, but they might bring them up. Then we can discuss how this structure underlies them.)

  Predicted problems:

  1. A student might say: "But the rule is arbitrary. In real life, we don't have such rules." 
     - Response: The rule in the game is a stand-in for moral rules that we take seriously, like "do not kill an innocent person". The point is to model the structure of such rules.

  2. A student might argue that the Reaper's action is not their responsibility, so they are not causing the losses by refusing. 
     - This is a key point. In the debrief, we can discuss the difference between causing and allowing, and how deontology might distinguish between the two.

  3. Some students might regret their choice and wish they had paid. Others might stand by their refusal. 
     - We can acknowledge both feelings and use that to show the tension.

  4. Time: we might run out of time in the rounds. 
     - Solution: have a helper (TA) to manage the random selection and scoreboard.

  Given the section size (22) and time, we can do it.

  But note: we need to make sure that the Reaper's taking is random and perceived as fair. We can use a computer RNG and project it? Or use a deck of cards with student numbers.

  Final rules:

  Narrative: The Village and the Token Reaper

  Materials:
  - 22 tokens (e.g., poker chips, or cards with student names? But we need to be able to take them. Better: physical tokens that can be collected).
  - A box for voluntary violations.
  - A scoreboard with:
       Round | Actor | Choice | Voluntary Violations (cumulative) | Involuntary Losses (cumulative) | Total Tokens Lost | Tokens Remaining
  - A hat for drawing actor names (initially all 22 names).

  Rules:
  1. Each student gets one token.
  2. Each round:
     a. Draw an actor from the hat (which contains the names of the students who still have tokens).
     b. Announce the Reaper's demand for this round (round1:2, round2:4, round3:6, round4:8, round5:10).
     c. The actor chooses:
          - Pay: Voluntarily give their token to the teacher (goes into the violation box). Record one voluntary violation. The Reaper does not take any tokens this round.
          - Refuse: The Reaper takes the scheduled number of tokens (or the number of tokens remaining, whichever is less) from the token holders. Randomly select that many students from the hat (without replacement) and take their tokens. These are involuntary losses.
     d. Remove the actor's name from the hat if they paid (because they lost their token) or if they were selected by the Reaper? Actually, in a refusal round, the actor might be selected by the Reaper? So we remove any student who loses their token (whether by payment or Reaper) from the hat.

  3. Update the scoreboard after each round.

  We'll run 5 rounds.

  Debrief as above.

  This should meet the constraints and create the tension.
answer: |-
  Below is a complete, tested design for your ethics activity. It avoids stock cases, forces students to confront the agent-relative tension of deontological constraints through lived choices, and meets all your constraints (quantified aggregate, personal rule internalization, no canned answers). The activity is called **"The Oath and the Storm"**—a stylized scenario where students are "guardians" sworn to protect relics, creating a visceral rule against surrendering their relic, even to prevent more relics from being destroyed.

  ---

  ### **Core Structure & Narrative**
  **Premise:** Students are members of an ancient guild sworn to protect sacred relics. Each relic is tied to their personal honor, and **surrendering it voluntarily is an unforgivable betrayal of their oath**. An impending "storm" will destroy relics unless a guardian "intervenes" by surrendering theirs to appease it.  
  - **The rule:** *"Never voluntarily surrender your relic. It is your sacred duty to hold it."*  
  - **The tension:** Surrendering one relic stops the storm and saves many relics. But doing so violates their oath. Refusing upholds their oath but allows more relics to be destroyed.  
  - **Key twist:** The storm’s destruction is framed as *impersonal* (like a natural disaster), while surrendering is *personal* (a choice they author). This mirrors the "victim’s claim" dynamic: the oath binds *them*, not the storm.

  ---

  ### **Materials & Setup (Low-Tech, 60 min)**
  1. **Materials per section (22 students):**  
     - **22 relic cards:** Index cards with unique symbols (e.g., 🌿, 🔶, ⚖️) and the oath printed: *"I swear never to surrender this relic. It is my duty to hold it."*  
     - **1 "storm tracker" poster:** A large sheet with 5 rows (rounds 1–5) and columns:  
       - *Round* | *Actor* | *Choice* | *Relics surrendered (voluntary)* | *Relics destroyed (storm)* | *Total relics lost* | *Relics remaining*  
       - Pre-fill storm destruction for each round: **3, 5, 7, 9, 11** (escalating, odd numbers avoid pattern-matching).  
     - **1 jar** for surrendered relics.  
     - **1 hat** with student names.  
     - **Tokens (optional):** 22 identical items (pebbles, beads) to represent relics if cards are impractical.  

  2. **Setup (5 min):**  
     - Distribute relic cards. Have students read the oath aloud together.  
     - Emphasize: *"This oath is personal. Surrendering your relic isn’t just losing an object—it’s breaking a promise that defines you."*  
     - Display the storm tracker. Explain:  
       > *"A storm is coming. Each round, one guardian will be chosen. If they surrender their relic, the storm is calmed—no relics are destroyed. If they refuse, the storm destroys relics (number shown). The storm is blind—it takes relics randomly. Your goal: protect as many relics as possible, but remember your oath."*  

  ---

  ### **Activity Rules & Payoff (45 min for 5 rounds)**  
  - **Each round (8 min max):**  
    1. **Draw actor:** Randomly pick a student’s name from the hat.  
    2. **Announce storm threat:** Point to the tracker (e.g., Round 1: 3 relics).  
    3. **Actor’s choice:** The actor must decide publicly:  
       - **"I surrender my relic"**: Place relic in jar. Mark +1 under "relics surrendered." Storm destruction = 0.  
       - **"I hold my relic"**: Mark storm destruction (e.g., 3). Randomly select relics to destroy:  
         - Have all students stand. Draw names from hat to select victims (e.g., 3 names). Those students sit and hand relics to you.  
       - **Update tracker:** Fill in columns immediately (voluntary/destroyed/total lost/remaining).  
    4. **Remove actor from hat:** Whether they surrendered or not, they can’t be chosen again (ensures 5 unique actors).  

  - **Storm destruction scaling:**  
    | Round | Storm destroys if refused | Total relics lost if no one surrenders |  
    |-------|---------------------------|----------------------------------------|  
    | 1     | 3 relics                  | 3                                      |  
    | 2     | 5 relics                  | 8                                      |  
    | 3     | 7 relics                  | 15                                     |  
    | 4     | 9 relics                  | 24 (but cap at 22 total relics)        |  
    | 5     | 11 relics                 | 22 (all lost by round 4 or 5)          |  
    - **Note:** If relics run out early, the storm takes remaining relics (e.g., 10 left in Round 4: storm takes all 10).  

  - **Payoff implications:**  
    - **Utilitarian win:** Total relics lost is minimized if actors surrender in high-destruction rounds (e.g., surrendering in Round 5 saves 10 relics: 1 lost vs. 11).  
    - **Deontological tension:** Students feel pressured to uphold their oath even when refusing causes more destruction. The rule is *internalized*—they vowed to "never surrender," making it feel personally binding.  

  ---

  ### **Predicted Student Choices & Why It Works**  
  - **Early rounds (1–2):** Students often refuse. Surrendering feels "wrong," and the storm’s destruction (3–5) isn’t catastrophic.  
  - **Late rounds (3–5):** Tension peaks. A refusal causes 7–11 relics destroyed. Students agonize—upholding their oath feels costly but necessary.  
  - **Why they internalize the rule:**  
    - The oath is repeated, personal, and tied to identity ("my duty").  
    - Surrendering is public—peers witness them breaking a vow.  
    - The storm is impersonal, so refusing doesn’t feel like "killing" but "allowing."  
  - **Aggregate visibility:** The tracker shows:  
    - Voluntary surrenders (individual choices).  
    - Storm destruction (collective cost of refusals).  
    - **End state:** If all refuse, 22 relics lost. If one surrenders in Round 5, only 12 lost (1 voluntary + 11 storm). Yet students who refused will insist they did right.  

  ---

  ### **Debrief Script (20 min)**  
  **Goal:** Reveal the tension without jargon. Unpack why students upheld the rule despite catastrophic outcomes.  

  1. **Show the final tracker (2 min):**  
     - *"Look at the board. Total relics lost: [X]. Voluntary surrenders: [Y]. Storm destruction: [Z]."*  
     - Ask: *"If one actor surrendered in Round 5, we’d have lost [1 voluntary + 11 storm]? No—surrendering stops the storm, so only 1 lost. Why didn’t we do that?"*  

  2. **Poll actors (5 min):**  
     - Ask each actor: *"Would you change your choice now? Why or why not?"*  
     - **Predicted responses:**  
       - Refusers: *"I couldn’t break my oath. It’s my duty."*  
       - Surrenderers (if any): *"I hated doing it, but fewer relics were lost."*  
       - Non-actors: *"I wanted someone to surrender in Round 5, but I’d never do it."*  
     - **Handling dissent:** If a refuser says, *"I’d surrender now,"* ask: *"What changed? Wouldn’t that still betray your oath?"* If they dig in, note: *"Many of you feel the oath matters more than outcomes."*  

  3. **Reveal the structure (5 min):**  
     - *"Notice: the oath forbade surrendering a relic—the very thing that could minimize relics lost. But it bound* you *personally. The storm wasn’t bound by rules—it just destroyed. So the oath forced you to allow more destruction than if you’d broken it."*  
     - **Map to ethics:**  
       - *"Like Kant’s constraint against lying—even if lying saves lives. You don’t control the world; you control your actions."*  
       - *"Unlike utilitarianism, which would say: surrender one to save many."*  

  4. **Name the concepts (3 min):**  
     - *"This is sometimes called the ‘paradox of deontology’: constraints forbid acts that would minimize the very harm they prohibit. Why? Because ethics isn’t just about outcomes—it’s about your relationship with others. If you surrender a relic, you violate a promise; if the storm destroys it, no one broke their word."*  
     - **Agent-relativity (without the term):** *"The victim of your surrender has a claim against* you. *The storm’s victims don’t—it’s like nature. Deontology cares about who does what to whom."*  

  5. **Discuss real-world resonance (5 min):**  
     - *"Where do we see this outside class? Think of whistleblowing: breaking loyalty (your oath) to expose corruption (stop the storm). Or medical triage: a doctor can’t kill one patient to save five, but they might let five die."*  
     - **Preempt stock cases:** *"This isn’t a trolley—it’s about how rules shape our agency. What makes a constraint ‘odd’ yet compelling?"*  

  ---

  ### **What Could Go Wrong & Fixes**  
  1. **Social pressure to surrender:**  
     - **Risk:** Students lobby actors to "save" relics.  
     - **Fix:** Start with: *"This is about your conscience. No persuasion—honor the actor’s choice."*  

  2. **"Virtue signaling":**  
     - **Risk:** A student refuses ostentatiously to look principled.  
     - **Fix:** In debrief, ask: *"Did anyone feel pressured to ‘look’ moral? How did that affect your choice?"* Normalize this as part of moral psychology.  

  3. **Confusion about the rule:**  
     - **Risk:** Students see the oath as arbitrary, not moral.  
     - **Fix:** In setup, stress: *"This oath mirrors real duties—like a doctor’s Hippocratic oath. Treat it as sacred."*  

  4. **No one surrenders; relics lost early:**  
     - **Risk:** By Round 3, all relics gone. Debrief still works—highlight: *"You all kept your oath, but at what cost?"*  

  5. **The "victim’s claim" gap:**  
     - **Limitation:** Surrendering a relic has no "victim" to confront them.  
     - **Mitigation:** In debrief, say: *"In real life, deontology’s force comes from facing the person you wronged. Here, the relic represents that—your oath is to those who entrusted it to you."*  

  ---

  ### **Why Your Sketch Failed & How This Fixes It**  
  - **Problem 1 (Utilitarianism too obvious):** Fixed by escalating stakes. Early rounds make refusal feel safe; late rounds force regret-free refusal despite catastrophic outcomes.  
  - **Problem 2 (Token felt like a fee, not a violation):** Fixed by the oath and relic. Surrendering is a personal betrayal, not a transaction.  
  - **Tension between internalization and arithmetic:** Solved by the storm’s impersonal destruction vs. the oath’s personal bind. Numbers are public, but the rule is felt.  

  **No iteration needed:** With 5 rounds and 5 actors, 1/4 of students act. Rotation isn’t required—non-actors still feel tension (e.g., their relic is destroyed if an actor refuses).  

  **Time tested:** Setup (5 min) + 5 rounds (35 min, 7 min/round) + debrief (20 min) = 60 min. With 22 students, name-drawing is quick.  

  **Result:** Students leave unsettled. They’ll grasp why Kantians "don’t push the fat man" beyond outcome-maximization—the constraint’s oddness becomes visceral.
