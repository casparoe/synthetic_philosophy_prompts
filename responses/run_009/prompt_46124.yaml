prompt: |-
  I'm writing my IB extended essay on Kant's ethics and I've hit a wall on one specific thing, and my supervisor just keeps repeating the same example back at me (the one about promising to repay money you know you can't repay), which honestly doesn't help.

  The bit I'm stuck on is from the Groundwork, in the Abbott translation. Kant writes: "I am never to act otherwise than so that I could also will that my maxim should become a universal law." 

  I get the gist. What I don't get is the word "will". When I ask myself whether I could will my maxim as a law for everyone, what am I actually checking? Is it (a) whether it's even logically possible, (b) whether universalising it would still get me what I want, or (c) whether I'd be fine with it, like endorsing it? My supervisor kept saying willing isn't the same as wishing, but wouldn't explain what the difference is supposed to be. And from what I can tell, the false-promise case seems to fail the test in a completely different way from the case about letting your talents rust — the first one feels like it breaks logic, the second one is more like you couldn't rationally want a world like that. So are there actually two different tests hiding under one formula, or one test with two ways of failing? If it's two tests, that seems like a pretty big deal that the text glosses over.

  The reason I care: I've been testing all this on a made-up case about a friend of mine who always fibs about having read books she hasn't, purely so conversations go smoother. She never breaks promises or lies about anything that matters, she just inflates her own reading. When I run the test on this I genuinely can't decide if it passes or fails, and I think it's because I can't work out what her maxim even is. Is it lie about books when it's convenient? Present yourself as better read than you are? Do whatever keeps conversations pleasant? Depending on which one you pick, the universalising seems to come out different — and if the answer depends on how you describe the maxim, isn't that a problem for the whole method? Like, couldn't a clever person always describe their maxim in the version that survives?

  Please explain like I'm 17 but don't dumb it down, and no reading lists or citations of other papers — I've got the Groundwork and thats it.
