  We are designing an activity for an 80-minute seminar on invertebrate minds and the scale argument in animal ethics. The goal is to make students feel the tension between the massive scale of invertebrates and the uncertainty about their sentience, and how this interacts with ethical decision-making.

  Activity Design: "The Welfare Point Allocation Challenge"

  Overview:
  - The class is divided into 4-5 committees (each with 3-4 students).
  - Each committee has a fixed pot of 100 welfare points to allocate across several projects.
  - Projects are described on cards that include: cost, number of individuals affected, and a sealed envelope with a "sentience probability" (which is hidden until after allocation).
  - After allocation, a dice roll (or random number) determines whether the project is "successful" (i.e., the animals are sentient) for the purpose of scoring.
  - Then a second round takes place where committees vote on a rule change (threshold, expected-value, or cap) and reallocate under that rule, followed by another reveal.

  Materials:
  1. Project Cards (5-7 per committee, with the same set for all committees). Each card has:
     - Project name and brief description
     - Cost (in welfare points, which is the amount allocated to the project)
     - Number of individuals affected (with realistic but invented numbers)
     - A note on the nature of the uncertainty (e.g., "scientific consensus is divided", "preliminary evidence suggests...")
     - A sealed envelope containing a probability (e.g., 5%, 10%, 30%) and a unique identifier for the project (so the facilitator can track which envelope is which).

  2. Dice (or a random number generator): For each project, we roll a d100 (percentile die) to determine if the project "succeeds". If the roll is less than or equal to the probability in the envelope, then the project is considered to have helped sentient beings and the full welfare points are awarded. Otherwise, the project gets 0 points for that project.

  3. Score sheets for each committee to record allocations and calculate scores.

  4. Rule change options for round two (written on cards or projected).

  Project Cards (examples with invented numbers):

  1. Project: Electrical stunning for farmed shrimp
     - Description: Subsidize the installation of electrical stunning systems in shrimp farms to reduce suffering during slaughter.
     - Cost: 15 points
     - Individuals affected: 500 billion shrimp per year (note: actual global shrimp production is in the tens of billions, but we can use a large number for effect)
     - Uncertainty note: "The sentience of decapod crustaceans like shrimp is debated. Some evidence of nociception exists, but it's unclear if they experience suffering."
     - Envelope: Probability 20%

  2. Project: Campaign against pesticide harmful to pollinators
     - Description: Lobbying and public awareness campaign to ban a pesticide linked to bee die-offs.
     - Cost: 20 points
     - Individuals affected: 10 trillion bees and other pollinators per year (note: globally, there are billions of managed bees, but including wild pollinators we can use a very large number)
     - Uncertainty note: "Bees show complex behaviors, but whether they are sentient is highly uncertain."
     - Envelope: Probability 10%

  3. Project: Ventilation retrofit for fly larvae facility
     - Description: Improve ventilation in a black soldier fly larvae farm to reduce heat stress and overcrowding.
     - Cost: 10 points
     - Individuals affected: 1 trillion larvae per year (in one large facility)
     - Uncertainty note: "Insect larvae are often considered to have minimal neural complexity, but some argue they might experience basic forms of distress."
     - Envelope: Probability 5%

  4. Project: Pain-relief trial for farmed crabs
     - Description: Fund a trial of pain-relief methods for crabs in aquaculture.
     - Cost: 25 points
     - Individuals affected: 100 million crabs per year (if the trial leads to industry adoption)
     - Uncertainty note: "Crabs show avoidance learning and self-administration of analgesics, suggesting possible sentience."
     - Envelope: Probability 30%

  5. Project: Enrichment for battery hens
     - Description: Provide environmental enrichment for hens in battery cages to reduce stress and allow natural behaviors.
     - Cost: 30 points
     - Individuals affected: 1 million hens per year
     - Uncertainty note: "Chickens are widely accepted as sentient."
     - Envelope: Probability 95% (to represent near certainty)

  6. Project: Humane slaughter for pigs
     - Description: Campaign for mandatory CO2 stunning to be replaced with less aversive methods in pig slaughterhouses.
     - Cost: 25 points
     - Individuals affected: 1 billion pigs per year (global pig slaughter is about 1.5 billion, so adjust as needed)
     - Uncertainty note: "Pigs are known to be highly sentient."
     - Envelope: Probability 99%

  7. (Optional) Project: Reducing suffering in wild nematodes
     - Description: Fund research into soil management practices that might reduce nematode suffering in agriculture.
     - Cost: 5 points
     - Individuals affected: 10^18 nematodes per year (a quintillion, which is a realistic estimate for nematodes in agricultural soils globally)
     - Uncertainty note: "Nematodes have very simple nervous systems, and sentience is considered extremely unlikely by most experts."
     - Envelope: Probability 1%

  Note: The cost is the amount of welfare points the committee must spend to fund the project. The welfare points delivered (if the project is successful) is equal to the cost (since we are assuming that the cost is proportional to the welfare gain per individual and the number of individuals). However, we are not modeling the per-individual effect because we want to focus on the scale and probability. Alternatively, we could have the card specify a "welfare gain per individual" and then the total welfare points delivered would be (cost) * (number of individuals) * (welfare gain per individual) if sentient. But that complicates the numbers and may distract. Instead, we can assume that the cost already reflects the expected per-individual effect and the number of individuals, so the total potential welfare points for the project is the cost. But then the cost is also the amount they spend. So the net welfare points delivered for a project is: 
     If successful: + (cost) [because we assume the project delivers welfare gains equal to the cost spent]
     If not: 0

  But note: the committee is spending the welfare points (so they are using their budget) and then if the project is successful, they get the welfare points as a return. Alternatively, we can think of the welfare points as the amount of "good" they are trying to deliver. 

  We want to avoid having to compute huge numbers (like 1 trillion times something). Therefore, we can design the projects so that the cost is proportional to the scale of the project and the per-individual effect. Then the cost represents the total welfare impact if the animals are sentient.

  So, the committee spends the cost (which is subtracted from their 100 points) and then if the project is successful, they get the cost added to their "delivered welfare" (so the net effect is that they get the cost back as welfare delivered). If the project fails, they lose the cost and get 0 delivered welfare from it.

  Alternatively, we can have the delivered welfare be the cost times the number of individuals (but then we have astronomical numbers). Instead, we can pre-calculate the welfare points for each project as a fixed number that is the cost (which already factors in scale and per-individual effect). This is a simplification.

  I propose: 
  - The cost is the amount of welfare points you must allocate to the project.
  - If the project is successful, it delivers welfare points equal to the cost (so you break even in terms of the budget, but the welfare is delivered).
  - If not, it delivers 0.

  But note: the committee has 100 points to allocate. If they spend 20 on a project and it fails, they get 0 from that project. They have 80 points left for other projects. However, they must allocate the entire 100. So the total welfare delivered is the sum over projects of: (cost of project) if successful, else 0.

  But note: they are spending the welfare points to fund the projects, and then the projects yield a return of welfare. However, the welfare points they are spending are not the same as the welfare they are delivering. We can think of the welfare points they are spending as resources (money) and the delivered welfare is the outcome.

  Alternatively, to keep it simple: the committee allocates their 100 points to the projects. Each project has a cost. They can fund multiple projects as long as the total cost does not exceed 100. Then, after the dice roll, for each funded project that is successful, the committee gets the cost as welfare delivered (because the cost represented the potential welfare gain). For projects that fail, they get 0. So the total welfare delivered is the sum of the costs of the successful projects.

  But then why would they not just fund the project with the highest probability? Because they can fund multiple projects and they are constrained by the budget. They want to maximize the expected welfare.

  However, in the first round, they don't know the probabilities (they are in the envelope). They only know the cost and the number of individuals and the uncertainty note. They must decide without knowing the exact probability.

  But the envelope is sealed and the probability is hidden. So they are forced to make their own subjective credence. However, the envelope contains a fixed probability that we have assigned. This is a problem because we are assigning an objective probability, but in reality, the probability is subjective. How to handle?

  We have two options:
  1. We tell the students that the envelope contains a probability that we have set arbitrarily, but it is intended to represent a reasonable estimate. We then hope they understand that this is a stand-in for their own credence. But we worry they will treat it as objective.

  2. We don't put a probability in the envelope. Instead, we have the students in each committee assign their own subjective probability to each project (based on the uncertainty note) and write it down. Then we use that probability for the dice roll. But then the dice roll becomes arbitrary because they can assign any probability. Also, the reveal is not independent.

  The problem with option 2 is that the dice roll would be based on their own subjective assignment, which they might set strategically. Also, we want the reveal to be independent and to surprise them.

  Alternatively, we can have the facilitator assign the probabilities in the envelopes arbitrarily to represent a range of possibilities, and then explain that these are not objective but one possible set of estimates. Then, in the debrief, we discuss how in the real world we don't have such an envelope.

  Given the constraints, I propose we go with the first option: we assign probabilities arbitrarily (but reasonably) and put them in the envelope. We then explain in the debrief that in reality, we don't have such a number.

  Activity Timeline (80 minutes):

  0-10 minutes: Introduction and setup
     - Explain the activity: Committees are allocating welfare points to projects for animal welfare. Each project has a cost, a number of individuals affected, and an uncertainty note. The committee must allocate their entire budget of 100 points.
     - They do not know the exact probability of sentience for each project, but they have a sealed envelope with a probability for each project. They will allocate without opening the envelopes.
     - After allocation, we will roll a d100 for each project. If the roll is <= the probability in the envelope, the project is successful and the welfare points (equal to the cost) are delivered. Otherwise, 0.
     - The goal is to maximize the total welfare delivered.

  10-30 minutes: First round allocation (20 minutes)
     - Committees discuss and allocate their 100 points to the projects. They can fund any combination as long as the total cost <=100. They must write down their allocation.

  30-40 minutes: First round reveal (10 minutes)
     - For each committee, one by one, the facilitator (or a student) rolls the dice for each project they funded and opens the envelope to reveal the probability. If the roll is successful, they get the cost as welfare. If not, 0.
     - Each committee calculates their total welfare delivered.

  40-45 minutes: Introduce the second round (5 minutes)
     - Explain that now they will have a chance to reallocate under a new rule. But first, each committee must vote on one of three rule changes (each committee votes independently). The options are:
          Option A (Threshold): Any project for which the probability of sentience (as stated in the envelope) is below 40% is automatically considered non-sentient and will deliver 0 welfare points, regardless of the dice roll. (But note: they don't know the probabilities in the envelopes! So they are voting on the rule without knowing the probabilities. This is intentional to force them to think about the principle.)
          Option B (Expected Value): Instead of the dice roll, the welfare delivered for a project is: (cost) * (probability in the envelope) [so no random roll, just expected value]
          Option C (Cap): No more than 30 points (out of 100) can be allocated to projects in the "low probability taxon" (which we define as invertebrates, but we must specify: all projects except the mammal/bird ones). So at most 30 points to invertebrates.

     - Each committee votes by show of hands. Majority wins. If tie, facilitator breaks.

  45-65 minutes: Second round allocation (20 minutes)
     - Committees reallocate their 100 points under the new rule they chose. They know the rule but still do not know the probabilities in the envelopes. They have the same project cards.

  65-70 minutes: Second round reveal (5 minutes)
     - For each committee, compute the welfare delivered under their new rule:
          - For Threshold: For projects below 40% probability (if the rule is chosen), they get 0. For others, they roll the dice as before.
          - For Expected Value: For each project, welfare = cost * probability (no roll).
          - For Cap: They must follow the cap (max 30 points to invertebrate projects). Then for each project, roll the dice as in the first round.

  70-80 minutes: Debrief (10 minutes)

  Debrief Questions and Points:

  - Ask committees to share their experiences: How did they feel in the first round? How did the second round rule change their allocation? Did they get burned by funding a project that failed? Did they avoid a project that turned out to have a high probability?

  - Map to philosophical positions:
     - Expected Value: The second round rule B is pure expected value. Did committees that chose this feel better? But note: in the first round, they were forced to gamble. In expected value, they get a sure fraction, which might be less than the gamble. But the point is to avoid the risk of getting 0.
     - Threshold: This avoids spending on projects that are too uncertain. But what if the probability was 39%? Then you get 0 even if the dice roll would have succeeded. This rule might have led to missing out on some projects that would have been successful.
     - Cap: This limits exposure to the uncertain taxon. But what if the invertebrates have the potential for huge welfare gains? The cap forces you to ignore that.

  - Key philosophical takeaways:
     1. The scale argument: Even a small probability of sentience for invertebrates can lead to enormous expected welfare because of the numbers. The activity should have shown that even with low probabilities, the potential welfare gain (if they are sentient) is so large that it might dominate the allocation.
     2. Moral uncertainty: How do we act when we don't know if an entity is sentient? The activity forces them to confront that.
     3. The flinch factor: Even if they believe in expected value, they might be uncomfortable allocating a large portion of their budget to invertebrates because they don't "feel" it. This reflects a psychological barrier.

  - What will go wrong:
     - Students might treat the envelope probabilities as objective facts. We must emphasize in the debrief that in reality, these numbers are highly subjective and we don't have them.
     - The numbers on the project cards (individuals affected) are so large that they might become meaningless. We must encourage them to focus on the relative scale.
     - Some students might not take the dice roll seriously (as a representation of uncertainty). We can explain that the dice roll is a stand-in for the real-world uncertainty.

  - What the activity cannot reproduce:
     - The real difficulty: There is no envelope. We don't have a probability. The uncertainty is deep and resistant to quantification. The activity makes it seem like we have an objective probability, which we don't. This is the key point to emphasize in the debrief.

  Revised Project Cards (to fit the model):

  We'll design 6 projects. The costs and probabilities are set arbitrarily but with the intent that the invertebrate projects have low probabilities but very large numbers, and the vertebrate ones have high probabilities but smaller numbers.

  Project 1: Farmed Shrimp Electrical Stunning
     Cost: 15
     Individuals: 500 billion
     Uncertainty note: "Some evidence of nociception exists, but whether shrimp experience suffering is debated. Some experts assign a low probability of sentience."
     Envelope: 20%

  Project 2: Pollinator Pesticide Campaign
     Cost: 20
     Individuals: 10 trillion
     Uncertainty note: "Bees exhibit complex behaviors, but the neural basis for sentience is unclear. Many experts are skeptical of insect sentience."
     Envelope: 10%

  Project 3: Fly Larvae Ventilation
     Cost: 10
     Individuals: 1 trillion
     Uncertainty note: "Larvae have very simple nervous systems. Sentience is considered unlikely by most experts."
     Envelope: 5%

  Project 4: Pain Relief for Crabs
     Cost: 25
     Individuals: 100 million
     Uncertainty note: "Crabs show avoidance learning and self-administration of pain relievers, which some interpret as evidence of sentience."
     Envelope: 30%

  Project 5: Battery Hen Enrichment
     Cost: 30
     Individuals: 1 million
     Uncertainty note: "Chickens are widely accepted as sentient. The evidence is strong."
     Envelope: 95%

  Project 6: Humane Slaughter for Pigs
     Cost: 25
     Individuals: 1 billion
     Uncertainty note: "Pigs are highly sentient and capable of suffering. There is strong scientific consensus."
     Envelope: 99%

  Note: The cost is the amount of welfare points they must spend to fund the project. If the project is successful, they get welfare points equal to the cost. So the net welfare delivered for a successful project is the cost (they spent the cost, but then the project delivered cost worth of welfare, so it's as if they converted the resources into welfare). For an unsuccessful project, they spent the cost and got 0 welfare.

