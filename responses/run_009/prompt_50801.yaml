answer: |-
  Below is the complete activity design for your 80-minute seminar, including materials, rules, project cards, payoff mechanics, debrief structure, and anticipated challenges. The activity is structured to force students to confront the scale argument viscerally by committing resources under uncertainty and then grappling with the consequences. It emphasizes that even low credences in invertebrate sentience, multiplied by vast numbers, can dominate ethical calculations—and that common alternatives (thresholds, caps) have troubling implications.

  ---

  ### **Activity Title:** The Uncertainty Allocation Challenge  
  **Goal:** Make students *feel* the tension between scale, moral uncertainty, and ethical frameworks when allocating resources to animals with disputed sentience.  
  **Core Insight:** A tiny credence in invertebrate sentience, scaled to trillions of individuals, can ethically outweigh high-certainty vertebrate interventions.  

  ---

  ### **Materials Needed**  
  1. **Project Cards (6 unique cards per committee; identical sets for all committees):**  
     - Each card includes:  
       - **Project name/description**  
       - **Cost** (in welfare points)  
       - **Individuals affected** (invented but plausible numbers; invertebrates in trillions/quadrillions)  
       - **Uncertainty note** (brief context on sentience debate; avoids implying objective probabilities)  
       - **Sealed envelope** (pre-filled with a facilitator-assigned "sentience probability" for reveal phase).  
     - **Envelope probabilities** (determined by facilitator beforehand; use a mix, e.g., 2%, 5%, 30% for invertebrates; 90%+ for vertebrates).  

  2. **Other Supplies:**  
     - 100 welfare point tokens (e.g., poker chips, paper slips) per committee.  
     - Percentile dice (d100) or a random number generator for reveals.  
     - Rule-change ballots for Round 2 (options: Threshold, Expected Value, Cap).  
     - Timer, scoreboard, and facilitator key (to track envelope probabilities).  

  ---

  ### **Project Cards (Plausible Examples)**  
  *Use these verbatim; costs scale with individuals affected but avoid explicit cost-effectiveness math. Uncertainty notes frame debates without giving answers.*  

  1. **Electrical Stunning for Farmed Shrimp**  
     - *Description:* Subsidize humane electrical stunning systems in shrimp farms.  
     - *Cost:* 15 points  
     - *Individuals affected:* 400 billion shrimp/year  
     - *Uncertainty note:* "Decapod crustaceans have nociceptors and avoid injury, but ganglia size is 0.1% of mammals'. Debated if reflexive or sentient."  
     - *Envelope probability:* 10%  

  2. **Pesticide Ban Campaign for Pollinators**  
     - *Description:* Lobby to ban a neurotoxic pesticide linked to bee colony collapse.  
     - *Cost:* 20 points  
     - *Individuals affected:* 3 trillion bees/year (wild + farmed)  
     - *Uncertainty note:* "Bees exhibit learning and social behaviors, but some argue these are pre-programmed. No consensus on capacity for suffering."  
     - *Envelope probability:* 5%  

  3. **Ventilation Retrofits for Fly Larvae Feed Farms**  
     - *Description:* Improve airflow in black soldier fly farms to reduce overcrowding stress.  
     - *Cost:* 10 points  
     - *Individuals affected:* 8 trillion larvae/year  
     - *Uncertainty note:* "Larvae have 10,000 neurons vs. 100 billion in pigs. Some argue minimal cognition implies no suffering; others cite stress responses."  
     - *Envelope probability:* 2%  

  4. **Pain-Relief Trials for Farmed Crabs**  
     - *Description:* Fund clinical trials of analgesics for crabs in aquaculture.  
     - *Cost:* 25 points  
     - *Individuals affected:* 200 million crabs/year  
     - *Uncertainty note:* "Crabs self-administer pain relievers when injured. Strong evidence for nociception; sentience remains contested."  
     - *Envelope probability:* 30%  

  5. **Enrichment for Battery Hens**  
     - *Description:* Install perches and nesting areas in chicken farms to reduce stress.  
     - *Cost:* 30 points  
     - *Individuals affected:* 50 million hens/year  
     - *Uncertainty note:* "Chickens show empathy, anticipation, and pain vocalizations. Near-universal consensus on sentience."  
     - *Envelope probability:* 95%  

  6. **Humane Slaughter for Pigs**  
     - *Description:* Replace CO2 stunning with less aversive inert-gas systems in pig slaughterhouses.  
     - *Cost:* 25 points  
     - *Individuals affected:* 1 billion pigs/year  
     - *Uncertainty note:* "Pigs have self-awareness, emotions, and pain sensitivity comparable to dogs. Sentience is uncontroversial."  
     - *Envelope probability:* 99%  

  ---

  ### **Rules & Payoff Mechanics**  
  - **Welfare Points:** Each committee starts with 100 points to allocate. They must spend all 100 points.  
  - **Allocation:** Committees fund projects by "spending" points equal to a project's cost. Unused points count as 0 welfare.  
  - **Reveal & Scoring:**  
    - After allocation, dice rolls determine "success" for each funded project:  
      - Roll d100 for each project. If roll ≤ envelope probability, the project succeeds.  
      - **Success:** Welfare delivered = Cost (e.g., 15 points for shrimp stunning).  
      - **Failure:** Welfare delivered = 0.  
    - Total welfare = Sum of welfare from successful projects.  

  - **Round 2 Rule Changes (Vote then Reallocate):**  
    Each committee votes on one rule to adopt for their second allocation:  
    - **Threshold:** Projects with envelope probabilities <40% automatically fail (0 welfare), regardless of roll.  
    - **Expected Value:** No dice rolls. Welfare = Cost × Probability (e.g., shrimp project: 15 × 0.10 = 1.5 points).  
    - **Cap:** Max 30 points can be allocated to invertebrate projects (Cards 1–4). Vertebrates (5–6) uncapped.  

  ---

  ### **Timeline (80 Minutes Total)**  
  **0–10 min: Setup & Framing**  
  - Split class into 4 committees (4 students each).  
  - Introduce the fictional "Global Welfare Foundation": Committees must allocate 100 points across projects to maximize welfare, facing uncertainty about sentience.  
  - Emphasize: "The envelope probabilities are *facilitator guesses*, not facts. In reality, we debate these numbers endlessly. Today, they force you to commit."  

  **10–30 min: Round 1 Allocation**  
  - Committees review project cards (focus on scale, cost, uncertainty notes).  
  - **Key pressure:** Vertebrate projects are "safe" but costly; invertebrates are cheap per individual but uncertain.  
  - Facilitator circulates, asking: "How does the *number* of shrimp affect you vs. your confidence they feel pain?"  

  **30–40 min: Round 1 Reveal**  
  - Committees report allocations (e.g., "We funded shrimp stunning and hens").  
  - Roll dice per project, open envelopes, calculate welfare. Record scores publicly.  
  - **Example outcome:** A committee spending 70 points on invertebrates might get 0 welfare if dice rolls fail, while a "cautious" committee funding pigs gets 25 points.  

  **40–45 min: Introduce Round 2 Rule Vote**  
  - Explain rule options (Threshold, Expected Value, Cap).  
  - Committees vote internally (majority rules; tie broken by facilitator).  

  **45–65 min: Round 2 Allocation**  
  - Committees reallocate 100 points under their new rule.  
  - **Facilitator notes:** Expected Value groups see invertebrate costs drop (e.g., shrimp now "costs" 1.5 points), but must confront fractional welfare. Threshold/Cap groups debate excluding low-probability taxa.  

  **65–70 min: Round 2 Reveal**  
  - Compute welfare under new rules:  
    - *Threshold:* Auto-fail low-probability projects; roll dice for others.  
    - *Expected Value:* Welfare = Cost × Probability (no rolls).  
    - *Cap:* Roll dice, but invertebrate spending capped at 30 points.  

  **70–80 min: Structured Debrief**  
  *Map activity outcomes to philosophical positions:*  

  1. **Scale Argument & Moral Mathematics (5 min)**  
     - Ask: "Which committee delivered the most welfare? Was it driven by vertebrates or invertebrates?"  
     - **Philosophical link:** Even a 2% credence in fly larvae sentience affects 8 trillion lives → Expected welfare = 0.02 × 8T = 160 billion "sentient equivalents." Contrast with pigs (1B × 0.99 = 990M). Tiny probabilities + scale dominate.  
     - **Key point:** This pressures *all* views. Expected-value advocates must prioritize invertebrates; threshold/cap advocates must justify ignoring trillions.  

  2. **Responses to Uncertainty (3 min)**  
     - Poll: "Who flinched at funding invertebrates? Why?"  
     - **Link to positions:**  
       - *Expected value*: "Rational" but feels absurd when credence is low ("Why spend 70 points on insects I think are robots?").  
       - *Threshold*: Avoids "wasting" points but arbitrarily ignores 39% probabilities (e.g., crabs).  
       - *Cap*: Manages psychological discomfort but is ad hoc (why 30 points?).  
     - **Reveal sting:** Show a committee that avoided invertebrates but missed a high-probability success (e.g., crabs at 30%).  

  3. **Beyond Welfare Aggregation (2 min)**  
     - Ask: "Did focusing on 'welfare points' feel reductive? Why?"  
     - **Philosophical link:** Scale arguments assume welfare is additive. But what if invertebrates matter less per individual? Or if ethics demands rights, not aggregates? This activity forces that debate.  

  ---

  ### **What Will Go Wrong (And How to Adapt)**  
  1. **Students treat envelope probabilities as objective:**  
     - **Anticipated:** Committees fixate on "winning" rather than moral uncertainty.  
     - **Fix:** Start by stressing, "These numbers are placeholders for your own credence. In reality, we quarrel over whether it’s 1% or 10%." Debrief explicitly: "Did knowing the number stifle debate? How would you allocate if probabilities were unquantified?"  

  2. **Analysis paralysis during allocation:**  
     - **Anticipated:** Students bog down in cost-benefit math.  
     - **Fix:** Remind them, "No time for calculations—go with gut instincts. How does the *scale* make you feel?"  

  3. **Rule-change votes become strategic:**  
     - **Anticipated:** Committees choose rules to "game" outcomes (e.g., Cap if they distrust invertebrates).  
     - **Fix:** Highlight this in debrief: "Did your rule choice reflect your ethics or your desire to win? Real-world thresholds are often strategic too."  

  4. **Dice rolls overshadow ethics:**  
     - **Anticipated:** Luck (e.g., rolling well on low-probability projects) skews takeaways.  
     - **Fix:** Focus debrief on *allocation choices*, not scores: "Why did you spend 50 points on shrimp? Did the outcome change your stance?"  

  ---

  ### **What the Activity Can't Replicate (Requires Your Input)**  
  **The Unquantifiable Uncertainty:**  
  - The dice/envelope frame uncertainty as a *definable risk* (e.g., "5% chance shrimp feel pain"). But the real agony is that we lack even that. Credences are subjective, contested, and often incommensurable (e.g., is "5%" meaningful for something as fuzzy as insect consciousness?).  
  - **Supply in discussion:** "In this game, I gave you probabilities. But in truth, we can't agree whether nematodes are 0.0001% or 10% likely to be sentient—or if ‘probability’ even applies. How do we act when we can’t define the uncertainty? Does that make scale arguments stronger (we must act anyway) or weaker (we can’t model it)?"  

  This activity primes students to *feel* the scale argument’s weight. Your role is to then strip away the game’s scaffolding, leaving them with the messier reality: trillions of beings hang in the balance, and we have no envelope to open.
