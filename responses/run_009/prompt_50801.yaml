  Second Round Rule Details:

  - Threshold (Option A): After the allocation, when computing the welfare, for any project that has a probability in the envelope below 40%, it automatically fails (0 points). For projects at or above 40%, we roll the dice as usual.

  - Expected Value (Option B): For each project, the welfare delivered is (cost) * (probability in the envelope). No dice roll. (Note: the probability is taken from the envelope, so they still don't know it until after allocation? Actually, in this rule, we don't need to open the envelope until after allocation? But we need the probability to compute the welfare. So after they allocate, we open the envelopes and compute without rolling.)

  - Cap (Option C): They cannot allocate more than 30 points in total to the invertebrate projects (Projects 1-4). The vertebrate projects (5 and 6) are not capped. Then, for each project, we roll the dice as in the first round.

  Timeline Adjustments:

