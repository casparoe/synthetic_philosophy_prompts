  ### Key Stances & Rationale
  1. **Abandon Raw Expected Value**: Heavy tails make classical EV order-dependent and unstable. Truncating at T resolves this by enforcing absolute convergence.
  2. **T as Fiduciary Anchor**: The loss cap T encodes the company's risk appetite. Scenarios beyond T are treated as "existential" and evaluated separately.
  3. **Order-Dependence Fix**: Grouping/ordering matters only if it hides scenarios above T or merges non-identical events. Step 2 forces explicit declaration.
  4. **Colleague's Proposal Rejected**: Choosing scenario ordering to "match fiduciary duty" invites manipulation. T and V_cat institutionalize duty; ordering is neutralized by truncation.

  ### Where Judgment is Dressed as Process
  - Step 7 forces executives to own catastrophic risk decisions, but "risk appetite" arguments may override arithmetic.
  - V_cat (Step 5) is a value judgment disguised as a parameter – its calibration determines tail-project viability.
  - T (Step 1) assumes executives can define a coherent risk threshold, which may be optimistic.
