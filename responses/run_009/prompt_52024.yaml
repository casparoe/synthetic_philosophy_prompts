     Alternatively, the company might set V based on the truncated loss: the catastrophic event, when it happens, costs T (because we cap at T). So the expected loss from catastrophe without the project is T * P_cat_0 = $100M * 1e-6 = $100. Then the reduction in expected loss from the catastrophe is $100. But we already included that in B_tev. So why did we get B_tev = -49,900? Because we included the $100 saving and then subtracted the cost.

