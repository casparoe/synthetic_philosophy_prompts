prompt: |-
  I'm a backend engineer at a company that runs a large distributed platform, and every quarter our team has to rank a backlog of reliability and security projects — things like adding checksumming to a replication path, pre-provisioning spare capacity in a second region, rewriting legacy failover logic — by expected dollar impact over the next two years. The distributions we're implicitly dealing with are brutally heavy-tailed: most scenarios cost nothing, a few cost a few thousand dollars, and one scenario (the region-wide outage, the silent data-corruption incident) produces a number that our spreadsheet renders in scientific notation. When I sum over my scenario list, the total is completely dominated by whatever I happened to put in the tail, and I've noticed that the ranking of projects changes depending on how I enumerate and group the scenarios — which sounds like it shouldn't matter. A colleague who reads decision-theory blogs mentioned something called the Pasadena paradox, apparently a variant of the St. Petersburg game where the expected value isn't just infinite but genuinely undefined, because the series you're supposed to add up gives different answers depending on the order you add it in. I strongly suspect the same thing is happening in my spreadsheet, minus the infinity, and I'd like to know what philosophy and decision theory actually say about choosing under such distributions, translated into something my team can run.

  Concretely: please write a decision procedure that a group of engineers could apply in a half-day planning meeting, with no philosophy background and no sign-off available for hand-wavy reasoning. Lay out the questions to ask in order, what counts as a sufficient answer to each, where the procedure terminates with a "no" (project doesn't make the cut), and where it must hand the decision to a human because the remaining question is one of values or risk appetite rather than facts. The procedure should take a definite stance on the core question — whether to keep using straight expected value in the tail, switch to something like a truncated or capped version, or abandon EV ranking for these projects altogether — and defend that stance rather than listing options for us to pick from. It should explicitly address the order-dependence issue: under what conditions does the enumeration of scenarios legitimately change the answer, and when is that just an artifact of how I built the list. It should also say what the procedure does with my most annoying colleague's proposal, which is that since the sum is order-dependent anyway, we should choose the scenario ordering that best matches our fiduciary duty to the company and let the ranking fall out of that.

  Then run the procedure on three worked cases: (1) the checksumming project, where a single rare corruption scenario accounts for essentially all the estimated value; (2) a dependency-security patch whose expected value is tiny but whose worst case is catastrophic; and (3) a capacity-reservation project whose headline number is the biggest on the backlog but which the procedure should plausibly reject or demote — I want to see it give us an answer we won't like, since that's the real test of whether it's a procedure or a rubber stamp. Be explicit about where the procedure will misfire and which steps are judgment calls dressed up as process. After the prose, please provide a JSON object with the following schema: a top-level object with fields "procedure_summary" (one sentence), "steps" (an array of objects, each with "step_number", "question", "sufficient_answer", "stops_with_no", and "judgment_required" as a boolean), "worked_cases" (an array of objects, each with "case", "verdict", "confidence" taking one of the values "low", "medium", or "high", and "reasoning"), and "failure_modes" (an array of strings describing where the procedure breaks down).
reasoning: |-
  We are facing a decision problem with heavy-tailed distributions where standard expected value (EV) calculations are unstable due to order-dependence in the summation of scenarios (similar to the Pasadena paradox). The core issue is that the EV is not absolutely convergent, meaning the sum changes based on the order of scenarios. This makes ranking projects by EV problematic.

  The procedure I propose is based on the following principles:
  1. We cannot rely on the standard EV when the series is conditionally convergent (or divergent) in a way that order matters. Instead, we should use a risk-adjusted measure that explicitly accounts for the tail risk without requiring infinite moments.
  2. We will use a two-step approach: 
     a. For each project, we assess whether the distribution of losses (or gains, if framed as savings) has a finite mean. If it does, we can use EV. If not, we move to a risk-averse evaluation.
     b. In the risk-averse evaluation, we use a metric that caps the losses at a level that the company can absorb (a form of truncation) and then compute the expected value under that cap. The cap is set by the company's risk tolerance (e.g., the maximum loss that would not threaten the company's survival).
  3. We also consider the probability of ruin (or severe impairment) as a separate criterion when the tail event is catastrophic.

  The procedure must be practical for a half-day meeting. It will consist of a series of questions that the team must answer for each project. The goal is to either approve, reject, or flag for human judgment (due to value/risk appetite questions).

  Key features:
  - We abandon the use of raw EV for heavy-tailed distributions without truncation.
  - We introduce a cap (T) on losses, which is set by the company's risk tolerance. This cap should be pre-defined at the company level (e.g., by the CFO or board) and not per project. If it is not set, then that becomes a blocking issue that must be escalated.
  - We also consider the probability of events that exceed the cap (even though they are truncated in the EV calculation) as a separate criterion because they represent existential risks.

  The procedure:

  Step 1: For the project, list all the negative scenarios (loss events) that the project mitigates. For each scenario, we need:
     - The loss amount (L_i) if the event occurs.
     - The probability (p_i) of the event over the next two years.

  Step 2: Check if the distribution of losses has a finite mean. In practice, we do this by checking if the sum of |L_i| * p_i converges. However, this is abstract. For engineers, we can ask: "Is there a scenario in the list with a loss so large that it is essentially unlimited (or beyond the company's capacity to bear) and a non-zero probability?" If yes, then the mean may not be finite (or the EV may be order-dependent). We then move to Step 3. If no, then we can compute the EV as the sum of L_i * p_i (which will be negative, so we want to minimize this) and use that for ranking. But note: even if the mean is finite, if the variance is extremely high, we might still want to adjust. However, for simplicity, we focus on the tail.

  But note: The problem states that the distributions are heavy-tailed and the total is dominated by the tail. So we assume that for the projects in question, the tail is the issue.

  Step 3: We set a cap (T) on losses. This cap should be a company-defined maximum loss that can be absorbed. If T is not defined, we must stop and get it defined (which is a human/value decision). Then, we truncate: for any scenario with loss L_i > T, we set L_i = T. Then we compute the truncated expected value (TEV) = sum [ min(L_i, T) * p_i ].

  Step 4: We also compute the probability of a catastrophic loss (i.e., any scenario that originally had L_i > T) as P_cat = sum [ p_i for all i where L_i > T ].

  Step 5: We then have two metrics for the project:
     a. The truncated expected value (TEV) which we use for ranking (we want the project that reduces TEV the most, i.e., the most negative TEV reduction, but note: we are saving money, so the value of the project is the reduction in TEV).
     b. The probability of catastrophic loss (P_cat) which we want to reduce to zero if possible.

  However, note that a project might not affect all scenarios. So we must compute the TEV and P_cat both with and without the project.

  But the project may also have a cost (C) and may only reduce the probability of some events. So we need:

  For the project, we estimate:
     - The cost C (to implement and maintain over two years).
     - For each scenario i, the reduction in probability (dp_i) that the project brings (so the new probability is p_i - dp_i).

  Then, the benefit of the project is:
     Without project: TEV_0 = sum [ min(L_i, T) * p_i ]
     With project: TEV_1 = sum [ min(L_i, T) * (p_i - dp_i) ]
     Benefit in terms of TEV reduction: B_tev = TEV_0 - TEV_1 - C   [Note: we subtract C because that is a cost]

  But note: if the project also reduces the loss amount in some scenarios, we would need to adjust. We assume that the project only reduces probabilities.

  Additionally, we consider the reduction in catastrophic probability: 
     Without: P_cat_0 = sum [ p_i for L_i > T ]
     With: P_cat_1 = sum [ (p_i - dp_i) for L_i > T ]
     Reduction in P_cat: dP_cat = P_cat_0 - P_cat_1

  Now, the decision:

  Step 6: If dP_cat > 0, then the project reduces the chance of a catastrophe. We must then consider if dP_cat is above a threshold (which is a risk appetite question). We set a threshold for dP_cat (say, 0.001 or 0.0001) that we consider significant. If dP_cat is above the threshold, then we approve the project regardless of B_tev? Not exactly. We have two goals: reduce the TEV (which is the bounded expected loss) and reduce the chance of catastrophe. We need to balance.

  But note: if dP_cat is positive and large, we might want to do the project even if B_tev is negative? That is, we might be willing to pay a premium to reduce catastrophic risk.

  So we break into two cases:

  Case A: dP_cat is negligible (below a pre-defined threshold, say 1e-6 per year). Then we base the decision solely on B_tev. If B_tev > 0, then the project is worthwhile (because it saves more than it costs in the bounded expectation). We rank by B_tev.

  Case B: dP_cat is above the threshold. Then we must consider the project as a catastrophe-reducer. The company should have a value for reducing the probability of catastrophe by a unit (e.g., $X per 0.001 reduction in P_cat). If they do, then we can compute the catastrophe-reduction benefit as: B_cat = dP_cat * V, where V is the value per unit reduction. Then total benefit B = B_tev + B_cat. If B > 0, approve.

  But if V is not defined, then we cannot compute B. Then we must have a human decision: the project is flagged for manual approval based on the dP_cat and the cost.

  Now, the procedure in steps for a project:

  Step 1: Enumerate scenarios. For each scenario i, we have:
     - Loss amount L_i (if the scenario occurs)
     - Probability p_i (without the project)
     - Reduction in probability dp_i (with the project)

  Step 2: Check if the company has defined a loss cap T (a truncation level) and a catastrophic probability threshold (thresh_cat) and a value V per unit reduction in catastrophic probability. If T is not defined, stop and escalate for T to be set (this is a company risk appetite decision). Similarly, if thresh_cat and V are not defined, we can proceed but will have to flag for human judgment when dP_cat is significant.

  Step 3: Truncate losses at T: set L_i_trunc = min(L_i, T) for each scenario.

  Step 4: Compute:
     - TEV_0 = sum ( L_i_trunc * p_i )
     - TEV_1 = sum ( L_i_trunc * (p_i - dp_i) )
     - B_tev = (TEV_0 - TEV_1) - C   [because we are saving on expected loss, but subtract cost]

  Step 5: Compute:
     - P_cat_0 = sum ( p_i for i where L_i > T )
     - P_cat_1 = sum ( (p_i - dp_i) for i where L_i > T )
     - dP_cat = P_cat_0 - P_cat_1

  Step 6: Compare dP_cat to thresh_cat (if thresh_cat is defined). If dP_cat < thresh_cat, then the catastrophe reduction is negligible. Then:
     - If B_tev > 0, approve and rank by B_tev.
     - Else, reject.

  Step 7: If dP_cat >= thresh_cat, then we are reducing catastrophic risk. Then:
     - If V (value per unit reduction) is defined, compute B_cat = dP_cat * V, and total benefit B = B_tev + B_cat.
          - If B > 0, approve and rank by B (or by dP_cat and B_tev? We need to rank projects, so we use B).
          - Else, reject.
     - If V is not defined, then we cannot compute B. Flag for human decision: present dP_cat and the cost C and ask if it's worth it.

  Now, addressing the most annoying colleague's proposal: 
     He suggests choosing the scenario ordering that best matches fiduciary duty. Our procedure avoids this by:
     - Not relying on the order of scenarios: we sum in any order because we are truncating and because we are taking absolute values? Actually, truncation makes the series absolutely convergent (since we are bounded by T). So the order doesn't matter. Thus, we have fixed the order-dependence by truncation.

  But note: the truncation level T is set by the company's risk tolerance, which is exactly the fiduciary duty. So we are using the fiduciary duty to set T, and then the math becomes stable.

