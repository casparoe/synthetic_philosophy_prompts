answer: |-
  ### Decision Procedure for Heavy-Tailed Reliability/Security Projects

  **Procedure Summary**: Evaluate projects by truncating losses at a company-defined risk tolerance cap (T), then compute a risk-adjusted expected value (RAEV) that combines truncated expected savings with a separate assessment of catastrophic risk reduction, escalating to human judgment when values or risk appetite are unquantified.

  **Steps**:

  ```json
  {
    "procedure_summary": "Projects are evaluated by truncating losses at a company-defined risk cap (T), then combining truncated expected savings with explicit catastrophic risk reduction, escalating unquantifiable value judgments.",
    "steps": [
