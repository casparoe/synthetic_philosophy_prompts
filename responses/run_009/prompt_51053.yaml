prompt: |-
  My set theory prof keeps pushing this line: the continuum hypothesis is the parallel postulate of the twentieth century. ZFC can neither prove it nor refute it, just like Euclid's postulates couldn't settle the parallel postulate, and we long ago accepted non-Euclidean geometry as perfectly good math, so we should accept two equally good set theories — one with CH, one with the negation — and asking which is "really true" is as confused as asking which geometry is the true one. He thinks this settles the matter and that anyone who talks about the intended universe of sets is just in denial about what the independence results showed. How far does the analogy actually carry? Map out what is supposed to correspond to what (the axioms, the models, Gödel's constructible universe versus Cohen's forcing on one side and Euclidean versus hyperbolic geometry on the other), then say where the mapping breaks — I've heard something about how geometry after the non-Euclidean discovery quietly became the study of arbitrary structures satisfying the axioms, whereas set theory claims to describe one specific cumulative hierarchy, and maybe the parallel postulate had an empirical referee (physical space) that CH doesn't — and then tell me whether his indeterminacy conclusion survives once the disanalogies are on the table, or whether the analogy was doing all the work. Write it as continuous prose please, like an email to me — no headings, bullets, bold, or tables, just plain paragraphs.
