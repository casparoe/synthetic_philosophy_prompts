prompt: |-
  My flatmate and I have spent two years arguing about whether utilitarian aggregation rides roughshod over the separateness of persons, and she has finally adopted a policy of refusing to discuss theory at all: she will only issue verdicts on cases. Her track record so far:

  (a) A surgeon cuts up one healthy traveler to distribute his organs to five dying patients: impermissible.
  (b) A utility monster who converts resources into vastly more welfare than anyone else would get, so that giving it everything maximizes total welfare: impermissible.
  (c) The runaway trolley diverted from five onto one: permissible.
  (d) Redistributive taxation of the well-off to lift the badly-off, in circumstances where incentive effects mean total welfare ends up slightly lower than it would have been without the redistribution: permissible.
  (e) A compulsory national vaccination program that will predictably kill two people out of a hundred million while preventing thousands of deaths: permissible.
  (f) Forcing one specific person to surrender a kidney to save two others, where the donor survives and is otherwise healthy: impermissible.

  This week her city is voting on two proposals, and she has agreed to rule on them, sight unseen, after I describe them to you.

  The first is a National Service Act: a fair lottery conscripts one in two hundred twenty-year-olds for a year of hazardous flood-defense and disaster-relief work. Conscription is compulsory, with prison as the alternative. Each conscript faces roughly a 1-in-500 chance of death and near-certain hardship; the program is projected to save several hundred lives spread across the whole population and to prevent catastrophic losses that would otherwise fall on identifiable coastal towns.

  The second is a Voluntary Renal Compensation Scheme: the state offers a fixed, substantial payment for kidney donation to strangers on the transplant list. Uptake is expected to come almost entirely from the destitute, who would be volunteering in a robust but not literally coercive sense.

  Here is what I want from you. First, lay out at least two genuinely different rules or principles that fit all six of her earlier verdicts — I can see she is running something, but I cannot tell whether it is a constraint against using identifiable people as mere means that yields in cases of equal ex ante risk, or an ex ante/ex post distinction about certain versus probabilistic burdens, or a prioritarian floor that licenses redistribution and risk-spreading but not sacrifice of the concentrated few, or something about consent and the voluntariness of the burden instead. Say what each candidate rule predicts about the National Service Act and about the Renal Compensation Scheme, which so far as I can see do not get answered in the same way by all of them. Second, give me your best single guess at the verdict she will issue on each, with your reasons for preferring that rule over its rivals as the account of her. Third, describe the one further case — you design it — that would most cleanly discriminate between your top two candidate rules. Finally, and this matters to me: keep straight what is settled from what is contested among people who actually work on this. I do not want you presenting, say, one particular way of formalizing the separateness objection, or one story about why she accepts the vaccination program, as though it were the consensus, when the real literature is divided on whether the objection even succeeds against utilitarianism and on what exactly the objection amounts to. Flag which parts of your reconstruction of her would be accepted by nearly everyone and which parts involve taking sides.
reasoning: |-
  Hmm, the user presents an interesting ethical puzzle involving their flatmate's case judgments. The flatmate refuses to discuss ethical theory but has given clear verdicts on six scenarios, and now the user wants help analyzing two new proposals through the lens of her established pattern. 

  The core challenge is reverse-engineering the flatmate's implicit ethical framework. Looking at her verdicts: she rejects organ harvesting and utility monsters but accepts trolley diversion, redistributive taxation (even with net welfare loss), and vaccination programs. She draws the line at forced kidney donation. This pattern suggests she's wrestling with classic deontological concerns - particularly the "separateness of persons" objection to utilitarianism that Rawls and Nagel emphasized. 

  Three plausible principles emerge from her judgments: First, a "non-sacrifice principle" that prohibits targeting identifiable individuals as means, but allows probabilistic risks. This would explain why vaccination (diffuse risk) passes but organ harvesting fails. Second, a "voluntarism principle" emphasizing consent, which would validate the renal compensation scheme if framed as voluntary. Third, a "prioritarian floor" view that permits burden-spreading for basic needs but rejects extreme sacrifices. 

  For the National Service Act, the non-sacrifice principle might allow it since risks are probabilistic and distributed, while voluntarism would reject the compulsory aspect. The renal scheme fares better under voluntarism but worse under prioritarianism if it exploits the destitute. 

  My best guess: she'll approve national service (parallel to vaccination) but reject renal compensation (like forced kidney donation). The key differentiator is the targeting of specific bodies versus statistical lives. To test this, I'd propose a case where an identifiable person faces certain harm to avert probabilistic harm to many - say, forcibly quarantining a typhoid carrier to prevent expected deaths. 

  Important caveats: While the separateness-of-persons objection is widely recognized, its precise formulation is contested. Some utilitarians like Hare argue it's overstated, while Scanlonians ground it in justifiability. My interpretation leans toward a Thomson/Scanlon view of permissible harm, but this isn't universal. The user should know that the vaccination/taxation acceptance has multiple possible defenses in the literature.
answer: |-
  Based on your flatmate's verdicts, here are two genuinely different candidate rules that fit all six cases, their predictions for the new proposals, my best guess at her verdicts, a discriminating case, and clarity on settled vs. contested points.

  ---

  ### Part 1: Candidate Rules Fitting All Six Verdicts

  1.  **Rule A: Non-Sacrifice Principle with Risk Pooling Exception**
      *   **Core Idea:** It's impermissible to intentionally cause severe harm (death, permanent injury, profound rights violation) to a specific, identifiable person *as a means* or *as a necessary direct cost* to achieve a greater aggregate good, *unless* the harm is probabilistic and distributed fairly via a risk pool where everyone faces an equal *ex ante* chance of bearing the burden.
      *   **Explains Verdicts:**
          *   (a) Impermissible: Sacrifices a specific healthy person.
          *   (b) Impermissible: Sacrifices specific identifiable others (deprived of resources).
          *   (c) Permissible: Harm to the one is probabilistic *ex ante* (could be anyone on the track) and a foreseen side-effect of saving the five, not an intentional sacrifice *of that person*.
          *   (d) Permissible: Harm (tax burden) is probabilistic & distributed across a large group (well-off) via a fair scheme, aiming to lift the worst-off. Net loss is secondary to the distributive aim.
          *   (e) Permissible: Deaths are probabilistic, distributed across the population via a fair vaccination program (everyone faces tiny risk).
          *   (f) Impermissible: Sacrifices a specific, identifiable person (forced organ removal).
      *   **Predictions:**
          *   **National Service Act:** Likely **Permissible**. Conscription lottery creates a fair *ex ante* risk pool (all eligible 20-yr-olds face equal chance). Harm (death/injury) is probabilistic and a side-effect of lifesaving work, not an intentional sacrifice *of specific conscripts*.
          *   **Renal Compensation Scheme:** Likely **Impermissible**. While "voluntary," the scheme predictably exploits the destitute. The harm (organ loss) is certain and directly inflicted *on specific, identifiable vulnerable individuals* chosen *because* they are desperate. Feels like targeted sacrifice.

  2.  **Rule B: Robust Autonomy & Anti-Exploitation Constraint**
      *   **Core Idea:** Interventions are permissible only if they either (1) involve burdens consented to under reasonably non-desperate conditions (robust autonomy), or (2) impose only probabilistic/fairly distributed risks/burdens necessary for essential public goods *without* creating exploitative pressure on the vulnerable. Deliberately imposing severe, certain harm on non-consenting individuals is forbidden. Redistribution is permissible even with net loss if it significantly alleviates severe deprivation.
      *   **Explains Verdicts:**
          *   (a) Impermissible: No consent, severe harm.
          *   (b) Impermissible: Exploits/violates autonomy of others deprived of resources.
          *   (c) Permissible: Harm is probabilistic, not targeted; no specific non-consenting person is *chosen* for harm.
          *   (d) Permissible: Addresses severe deprivation; burden is distributed, not targeted at specific individuals *as a sacrifice*.
          *   (e) Permissible: Public good; risk is probabilistic, minimal, and distributed fairly.
          *   (f) Impermissible: Severe harm, no consent.
      *   **Predictions:**
          *   **National Service Act:** Likely **Impermissible**. Conscription is non-consensual and imposes severe hardship/death risk. Prison alternative compounds coercion. Not sufficiently voluntary.
          *   **Renal Compensation Scheme:** Likely **Permissible.** Involves consent, even if driven by destitution. The state isn't *forcing* anyone; it's offering an option. The "robust but not coercive" voluntariness might suffice. Addresses a severe need (life-saving transplants).

  ---

  ### Part 2: My Best Guess for Her Verdicts & Preferred Rule

  *   **National Service Act Prediction:** **Permissible**
  *   **Renal Compensation Scheme Prediction:** **Impermissible**
  *   **Preferred Rule:** **Rule A (Non-Sacrifice Principle with Risk Pooling Exception)**
  *   **Reasons for Preference over Rule B:**
      1.  **Vaccination (e) vs. National Service:** Rule A cleanly groups Vaccination and National Service as permissible due to probabilistic risk in a fair pool. Rule B struggles: Vaccination is non-consensual imposition of risk, yet she permits it. Why permit non-consensual risk in (e) but not in National Service? Rule A's *ex ante* risk distinction explains this. Rule B would likely need an *ad hoc* exception for public health risks.
      2.  **Exploitation Sensitivity:** While Rule B highlights exploitation in the Renal Scheme, Rule A captures the core objection more directly: the Renal Scheme *selects specific vulnerable individuals* to bear a *certain, severe bodily burden* for the benefit of others. This mirrors the impermissible cases (a, b, f) of sacrificing specific persons. Rule B's focus on consent undercuts her rejection of (b) – the utility monster's victims didn't "consent" to deprivation either, but the harm wasn't bodily invasion.
      3.  **Trolley (c) Consistency:** Rule A explains Trolley consistently via probabilistic harm/side-effect. Rule B's reliance on "not targeting" fits Trolley but less clearly differentiates it from National Service (which also uses a lottery, not targeting).
      4.  **Taxation (d):** Both rules handle it reasonably well, but Rule A's focus on distributed burden fits neatly. Rule B's anti-exploitation element might raise questions about taxing the well-off, which she permits.

  **Conclusion:** Rule A best systematizes her pattern, particularly the acceptance of *ex ante* probabilistic risks for public good (Vaccination, likely National Service) alongside the rejection of sacrificing specific individuals (Organ Harvest, Utility Monster, Forced Kidney). The Renal Scheme feels too much like sacrificing specific vulnerable bodies, despite "voluntariness."

  ---

  ### Part 3: Discriminating Case

  *   **The Typhoid Tracker:** Public health officials know with certainty that a specific individual, Person P, is an asymptomatic carrier of a deadly, highly contagious typhoid strain. P refuses quarantine. Isolating P for 6 months would prevent an expected 10 deaths from the outbreak. Not isolating P means a ~10% chance P starts an outbreak killing ~100 people. Isolation causes P severe psychological distress but no permanent physical harm.
      *   **Rule A (Non-Sacrifice/Risk Pooling) Prediction:** **Impermissible.** This involves intentionally imposing a severe, certain burden (isolation) on a specific, identifiable person (P) *as the direct means* to prevent probabilistic harm to others. It lacks the *ex ante* risk pool; P is targeted *because* they are the carrier.
      *   **Rule B (Robust Autonomy/Anti-Exploitation) Prediction:** Likely **Impermissible** (due to non-consensual severe burden), but *potentially* **Permissible** if framed as a public health necessity overriding autonomy to prevent catastrophe (similar to vaccination justification, but targeted). The lack of consent and certainty of burden make it a close call leaning towards impermissible.
      *   **Why it Discriminates:** Rule A clearly forbids this as sacrificing a specific person to avert a probabilistic threat. Rule B might be tempted to permit it based on the massive potential harm and public good, straining its commitment to non-consensual burdens. If your flatmate says **Impermissible**, it strongly favors Rule A. If she says **Permissible**, it favors Rule B (or a different rule emphasizing catastrophic harm prevention).

  ---

  ### Part 4: Settled vs. Contested

  *   **Settled (Near Consensus):**
      1.  **The Separateness of Persons Objection Exists:** Virtually everyone agrees Rawls and Nagel articulated a powerful objection concerning how utilitarianism might ignore distinctness and potentially sanction unacceptable sacrifices of individuals for aggregate gain. Your flatmate's rejection of (a), (b), and (f) clearly aligns with this concern.
      2.  **The Trolley Problem is a Puzzle:** There's wide agreement that finding a principle distinguishing (a) from (c) is difficult and central to debates about aggregation and constraints. Your flatmate's acceptance of (c) is common among non-utilitarians who reject (a).
      3.  **Deontological Constraints are Plausible:** Most non-utilitarians agree constraints against harming/killing/sacrificing specific individuals exist, though their exact nature is debated. Your flatmate clearly endorses such constraints.
      4.  **Distributive Justice Matters:** Acceptance of (d) reflects the widespread non-utilitarian view that fairness/priority for the worst-off matters independently of strict aggregation. Her permitting it even with a net loss is significant.

  *   **Contested (Taking Sides):**
      1.  **Does the Separateness Objection *Succeed* Against Utilitarianism?** This is **highly contested**. Sophisticated utilitarians (e.g., Hare, Harsanyi) argue it can be answered (e.g., via impartial perspective, *ex ante* rationality). Others (Williams, Scanlon) argue it is fatal. My reconstruction assumes the objection has significant force for your flatmate.
      2.  **What *Exactly* is the Core of the Separateness Objection?** Is it about intentions/means (Doctrine of Double Effect), using persons as mere means (Kantianism), lack of consent, claims of the individual vs. aggregation (Scanlon), or the distinction between harming and not aiding? My Rules A & B represent *specific interpretations* (Risk Pooling vs. Autonomy/Exploitation) of this contested core. The literature offers many variants.
      3.  **Why Accept Vaccination (e) but Reject Forced Kidney (f)?** This is **crucial and contested**. My Rule A relies heavily on the *ex ante* probabilistic vs. certain harm distinction. Others might emphasize the public good nature of vaccination, impossibility of consent, or minimal individual risk. Rule B emphasizes the non-targeted nature. There's no single consensus explanation; different non-utilitarians justify it differently. My preference for Rule A involves choosing this specific *ex ante/ex post* distinction as primary for her.
      4.  **The Permissibility of Taxation (d) with Net Loss:** This prioritizes distributive fairness over strict aggregation. While common among prioritarians/egalitarians, it's contested by strict utilitarians and some libertarians. My rules accept her verdict as given, incorporating a prioritarian/egalitarian element.
      5.  **The Role of Voluntariness/Consent:** The extent to which consent legitimizes otherwise impermissible actions (like the Renal Scheme) is deeply contested (e.g., debates on sweatshop labor, extreme sports, organ sales). Rule A downplays it in the Renal case (focusing on sacrifice), Rule B emphasizes it. Her verdict here will be telling.

  **In summary:** My reconstruction accepts the reality and force of the separateness objection for your flatmate (a common non-utilitarian stance) but takes specific sides on *how* it manifests in her judgments, particularly by prioritizing the *ex ante* probabilistic harm vs. certain sacrifice distinction (Rule A) as the best systematization of her pattern, especially regarding Vaccination vs. Forced Kidney and predicting her likely verdicts on the new cases. The literature is deeply divided on the precise formulation and success of the separateness objection and the best justification for the Vaccination/Trolley permissions.
