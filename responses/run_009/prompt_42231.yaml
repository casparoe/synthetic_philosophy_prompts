  ### Decision Tree: Positions on the Unity of Propositions  
  *Start here (common commitment):*  
  **Some sentences with multiple terms (e.g., "Alice admires Bob") are true, and this requires an account of how their constituents (e.g., Alice, admiration, Bob) form a unified whole.**  

  #### **Question 1: Does truth require a unifying entity beyond the sentence’s constituents?**  
  *(Constituents = objects, properties, relations, etc.)*  
  - **Yes** → Go to Question 2.  
  - **No** → Go to Question 3.  

  #### **Question 2 (for "Yes" to Q1): Is the unifier itself a constituent needing unification?**  
  *(e.g., if the unifier is a "relation" or "fact," must it relate to the constituents?)*  
  - **Yes** → **Leaf A: Bradleyan Regress**  
    - *Position:* Accepts an infinite regress (unifier U1 unifies constituents but requires U2 to unify U1, ad infinitum).  
    - *Challenge:* Explaining how unity is achieved without circularity or incoherence.  
    - *Judgment problem:* Same regress applies.  
  - **No** → Go to Question 4.  

  #### **Question 3 (for "No" to Q1): Why no unifier?**  
  - **Arranged constituents suffice** → Go to Question 4.  
  - **Truthmaker picture is confused** → **Leaf B: Deflationary Dissolution**  
    - *Position:* Unity arises from linguistic/semantic practices; no metaphysically "sticky" entities needed.  
    - *Challenge:* Explaining normative constraints (e.g., truth) without propositions/facts.  
    - *Judgment problem:* Dissolved similarly (e.g., attitude reports are just language games).  

  #### **Question 4 (for all non-regress paths): Are relations intrinsically ordered?**  
  *(i.e., does "R(a,b)" differ from "R(b,a)" because R itself has direction?)*  
  - **Yes** → Go to Question 5.  
  - **No** → **Leaf C: External Order**  
    - *Position:* Order is imposed externally (e.g., by positions in a structure, mental acts, or syntax).  
    - *Challenge:* Explaining what grounds this ordering non-arbitrarily.  
    - *Judgment problem:* Often distinct (e.g., mental acts unify judgments; world unity is separate).  

  #### **Question 5 (for "Yes" to Q4): Is the unity problem for judgment identical to that for states of affairs?**  
  *(i.e., is "Alice judges that Bob admires Carol" unified the same way as "Bob admires Carol"?)  *  
  - **Yes** → **Leaf D: Unified Realism**  
    - *Position:* Both involve the same glue (e.g., Armstrong-style states of affairs; relations carry internal order).  
    - *Challenge:* Explaining how abstract entities (propositions) or mental states mirror worldly unity.  
  - **No** → **Leaf E: Positionalism / Internal Order**  
    - *Position:* Relations have intrinsic "slots" (e.g., admirer→admired); judgment uses distinct mechanisms (e.g., multiple relations).  
    - *Challenge:* Justifying why relations have built-in order without regress.  

  ---

  ### Leaf Summary & Key Challenges  
  | **Leaf**                 | **Position**                                                                 | **Hardest Commitment**                                                                 |  
  |---------------------------|------------------------------------------------------------------------------|----------------------------------------------------------------------------------------|  
  | **A: Bradleyan Regress**  | Infinite unification needed; no coherent stopping point.                     | Defending the regress as non-vicious (rarely held).                                    |  
  | **B: Deflationary Dissolution** | No propositions/facts; unity is linguistic/conceptual.                  | Rejecting truthmaker intuition without losing explanatory power.                       |  
  | **C: External Order**     | Order imposed by structure/mind (e.g., Russell’s multiple relation theory).  | Grounding order externally without ad hoc machinery.                                   |  
  | **D: Unified Realism**    | World/judgment share the same unity (e.g., facts as truthmakers).            | Explaining how minds "grasp" unified propositions.                                     |  
  | **E: Positionalism**      | Relations have intrinsic order; judgment differs (e.g., mental acts).        | Justifying why relations have built-in directionality.                                 |  

  ---

  ### Notes on Tree Logic  
  - **Unseparated Positions:**  
    - **Multiple Relation Theory (Russell)** falls under **Leaf C** (external order) for judgment, but shares **Leaf E**’s commitment to relations with internal order for worldly states. The tree separates these aspects: **Leaf C** captures judgment unity; **Leaf E** captures worldly unity.  
    - **Armstrong-style states of affairs** align with **Leaf D** (if judgment/world unity are conflated) *or* **Leaf E** (if judgment differs). The tree splits them cleanly via Q5.  
  - **Empty/Incoherent Branch:**  
    - **Q1=Yes + Q2=Yes** (Bradleyan Regress) has no stable position; it is typically abandoned or used reductively.  
  - **Omitted Questions:**  
    - No branch for "Are relations fundamental?" (collapses into Q4’s ordering) or "Can unity be primitive?" (covered in Q2=No/Q1=No paths).  
  - **Handout Design:**  
    - Fits one page (5 questions → 5 leaves).  
    - Branch questions avoid jargon; answers don’t presuppose positions.  

  **How to use:** Answer each question honestly, ignoring where it leads. Your leaf reveals your core commitment. Discuss divergences!
