  ### A St. Petersburg Variant that Breaks the Concavity Fix

  **The Game:**  
  We flip a fair coin until it lands heads. If the first heads appears on the nth flip, you win a prize of $\exp(2^n)$ dollars. (Here, $\exp(x)$ means $e^x$, where $e \approx 2.718$.)

  **Expected Utility for a Logarithmic Agent:**  
  For an agent with utility function $U(x) = \ln(x)$, the utility from winning $\exp(2^n)$ dollars is $\ln(\exp(2^n)) = 2^n$. The probability of the first heads on the nth flip is $(1/2)^n$. Therefore, the expected utility is:

  \[
  E[U] = \sum_{n=1}^{\infty} \left(\frac{1}{2}\right)^n \cdot 2^n = \sum_{n=1}^{\infty} 1 = \infty.
  \]

  This series diverges, so the expected utility is infinite.

  **Sanity Check 1: Bounded Utility**  
  Suppose we assume utility is bounded above by some maximum utility $M$. Then the expected utility becomes:

  \[
  E[U] = \sum_{n=1}^{\infty} \left(\frac{1}{2}\right)^n \cdot \min(2^n, M).
  \]

  There exists an $N$ such that for $n>N$, $2^n > M$. Then the series splits into:

  \[
  \sum_{n=1}^{N} 1 + \sum_{n=N+1}^{\infty} \left(\frac{1}{2}\right)^n \cdot M = N + M \cdot \left(\frac{1}{2}\right)^N.
  \]

  This is finite. Therefore, the bounded utility assumption resolves the issue.

  **Sanity Check 2: Truncation (House Cap of $1 Trillion)**  
  Suppose the house can pay at most $1$ trillion dollars. Then for $n \geq 5$, the prize is capped at $10^{12}$ dollars (since $\exp(2^5) = \exp(32) \approx 7.9 \times 10^{13} > 10^{12}$). 

  *Logarithmic Agent:*
  \[
  E[U] = \sum_{n=1}^{4} 1 + \sum_{n=5}^{\infty} \left(\frac{1}{2}\right)^n \cdot \ln(10^{12}) = 4 + \ln(10^{12}) \cdot \frac{1}{16} \approx 4 + 27.63 \cdot 0.0625 \approx 4 + 1.726 \approx 5.726.
  \]

  *Linear Agent:*
  \[
  E[U] = \sum_{n=1}^{4} \left(\frac{1}{2}\right)^n \exp(2^n) + \sum_{n=5}^{\infty} \left(\frac{1}{2}\right)^n \cdot 10^{12} \approx 3.69 + 13.65 + 372.62 + 555,375 + 62,500,000,000 \approx 62.5 \text{ billion dollars}.
  \]

  The truncation removes the infinite expectation, but the linear agent still faces an astronomical expected value, preserving the paradoxical flavor that one would need to pay an enormous amount to play, even though the chance of a large payout is tiny.

  **Conclusion:**  
  The concavity of utility (like logarithmic utility) is not sufficient to resolve the St. Petersburg paradox because a game designer can always increase the payouts fast enough to make the expected utility infinite. The more fundamental fixes are either to bound the utility function or to recognize the house's finite resources (truncation). A philosopher defending expected-utility theory might argue that in reality, all games are truncated by the house's finite wealth, so the paradox does not arise in practice. However, in the theoretical realm, bounded utility is the most robust solution.
answer: |-
  ### St. Petersburg Variant: The Double Exponential Game  
  **Game Description:**  
  We flip a fair coin until it lands heads. If the first heads appears on the *n*-th flip, you win a prize of **$\exp(2^n)$ dollars** (i.e., $e^{2^n}$, where $e \approx 2.718$). For example:  
  - Heads on 1st flip: Prize = $e^{2^1} = e^2 \approx \$7.39$  
  - Heads on 2nd flip: Prize = $e^{4} \approx \$54.60$  
  - Heads on 3rd flip: Prize = $e^{8} \approx \$2,980.96$  
  - Heads on 4th flip: Prize = $e^{16} \approx \$8.89$ million  
  ... and so on.  

  ### Expected Utility for a Logarithmic Agent  
  Assume an agent has a **logarithmic utility function**: $U(x) = \ln(x)$. The expected utility is:  
  $$  
  E[U] = \sum_{n=1}^{\infty} P(\text{First heads on } n) \cdot U(\text{Prize for } n) = \sum_{n=1}^{\infty} \left(\frac{1}{2}\right)^n \cdot \ln(e^{2^n})  
  $$  
  Simplify $\ln(e^{2^n})$:  
  $$  
  \ln(e^{2^n}) = 2^n \quad (\text{since } \ln(e^k) = k).  
  $$  
  So the series becomes:  
  $$  
  E[U] = \sum_{n=1}^{\infty} \left(\frac{1}{2}\right)^n \cdot 2^n = \sum_{n=1}^{\infty} 1 = \underbrace{1 + 1 + 1 + 1 + \cdots}_{\infty} = \infty.  
  $$  
  **Result:** The expected utility **diverges to infinity** despite logarithmic utility.  

  ---

  ### Sanity Checks  
  #### 1. Bounded-Utility Check  
  Suppose we assume utility is **bounded above** (e.g., $U(x) \leq M$ for some large $M$). For $n$ large enough that $2^n > M$, we have $\ln(e^{2^n}) = 2^n > M$, so:  
  $$  
  E[U] = \sum_{n=1}^{n^*} \left(\frac{1}{2}\right)^n \cdot 2^n + \sum_{n=n^*+1}^{\infty} \left(\frac{1}{2}\right)^n \cdot M,  
  $$  
  where $n^*$ is the smallest $n$ such that $2^n > M$. The first sum is finite (just $n^*$), and the second is a convergent geometric series:  
  $$  
  M \cdot \sum_{n=n^*+1}^{\infty} \left(\frac{1}{2}\right)^n = M \cdot \frac{(1/2)^{n^*+1}}{1 - 1/2} = M \cdot (1/2)^{n^*}.  
  $$  
  **Key insight:** The sum is **finite**. Bounded utility resolves the paradox, but it is **not** a natural extension of concavity—it’s a stronger (and more controversial) assumption that *admits* concavity alone failed.  

  #### 2. Truncation Check  
  Suppose the house caps payouts at **$1$ trillion** ($10^{12}$ dollars), as it realistically must (since $\exp(2^5) = e^{32} \approx 7.9 \times 10^{13} > 10^{12}$). Prizes for $n \geq 5$ are truncated to $10^{12}$ dollars.  

  - **Linear utility agent** ($U(x) = x$):  
    $$  
    E[U] = \sum_{n=1}^{4} \left(\frac{1}{2}\right)^n e^{2^n} + \sum_{n=5}^{\infty} \left(\frac{1}{2}\right)^n \cdot 10^{12}.  
    $$  
    - First sum:  
      $n=1$: $(0.5) \cdot e^2 \approx 3.69$  
      $n=2$: $(0.25) \cdot e^4 \approx 13.65$  
      $n=3$: $(0.125) \cdot e^8 \approx 372.62$  
      $n=4$: $(0.0625) \cdot e^{16} \approx 555,375$  
      **Total $\approx 555,764$**.  
    - Second sum:  
      $\sum_{n=5}^{\infty} \left(\frac{1}{2}\right)^n \cdot 10^{12} = 10^{12} \cdot \frac{(1/2)^5}{1 - 1/2} = 10^{12} \cdot \frac{1/32}{1/2} = 10^{12} \cdot \frac{1}{16} = 62.5 \times 10^9$.  
    **Final $E[U] \approx 62.5$ billion dollars**.  

  - **Logarithmic utility agent** ($U(x) = \ln(x)$):  
    $$  
    E[U] = \sum_{n=1}^{4} \left(\frac{1}{2}\right)^n \cdot 2^n + \sum_{n=5}^{\infty} \left(\frac{1}{2}\right)^n \cdot \ln(10^{12}).  
    $$  
    - First sum: $1 + 1 + 1 + 1 = 4$.  
    - Second sum: $\ln(10^{12}) = 12 \ln(10) \approx 27.63$, and  
      $\sum_{n=5}^{\infty} (1/2)^n = (1/2)^5 / (1 - 1/2) = 1/16$.  
      So $\approx 27.63 \cdot (1/16) \approx 1.73$.  
    **Final $E[U] \approx 4 + 1.73 = 5.73$**.  

  **Paradoxical flavor?** For the linear agent, $E[U]$ is astronomical (62.5 billion)—far beyond what anyone would pay to play—despite a >96.875% chance of winning ≤$54.60. **Yes, the paradox survives truncation for linear utility**. For the logarithmic agent, $E[U]$ is modest (5.73), so the paradox vanishes.  

  ---

  ### Which Fix Does the Real Work?  
  - **Concavity alone fails** because a game designer can always scale payoffs to outrun *any* concave utility (e.g., use $e^{2^n}$ to break $\ln(x)$).  
  - **Truncation** (house wealth limits) caps *payoffs*, forcing convergence. But it **presupposes the paradox’s resolution** by altering the game’s rules to match reality.  
  - **Bounded utility** forces convergence *theoretically* but is an *ad hoc* fix that rejects the paradox’s premise.  

  ### Philosopher’s Defense of Expected Utility  
  A philosopher might argue:  
  1. The St. Petersburg paradox (and this variant) are **artifacts of unrealistic games**. No house can pay $e^{2^{100}}$ dollars, so we should *always* model games with **truncated payoffs**.  
  2. Expected utility theory works fine in **real-world cases** (truncated games). The "paradox" only exposes misapplication to idealized scenarios.  
  3. **Concavity** still models risk aversion *empirically*; infinite expectations are mere mathematical curiosities.  

  ### Conclusion for Students  
  This variant proves that **no concave utility function** (logarithmic or otherwise) is immune to infinite expected utility—concavity isn’t a universal fix. **Truncation** resolves the paradox practically, but **bounded utility** is the only *theoretical* safeguard. The debate highlights how we model rationality: Should we "fix" utility functions, or dismiss unplayable games?
