answer: |-
  Here are the desiderata for an adequate theory of the moral equality of combatants (MEC), structured as requested. The theory must simultaneously guide individual soldier decisions *and* evaluate the legal near-symmetry of combatant status under LOAC/IHL.

  ### Core Desiderata (Motivation & Status)

  1.  **The Unjust Conscript (Duress & Belief):** The theory must explain the moral status of a combatant forced to fight (under threat of imprisonment) for an unjust cause, who *sincerely believes* his side is just.
      *   *Motivation:* Tests whether duress or sincere (though mistaken) belief mitigates moral responsibility or liability for participation/killing. Central to individual advice.
      *   *Status:* **Non-negotiable.** Any theory must address the core tension between external coercion/internal belief and participation in wrongful harm.

  2.  **Motives vs. Threat (Volunteer Aggressor vs. Defensive Mercenary):** The theory must distinguish between a volunteer who joins a war of *aggression* for pay/adventure and a mercenary who fights *defensively* for identical pay/adventure. It must say if their moral equality as combatants depends on their motives or the objective threat they pose/address.
      *   *Motivation:* Challenges whether MEC rests on the role/function ("posing a threat for an unjust cause") or the actor's subjective mental state/motives. Tests consistency for individual advice and law's focus on status/conduct over motive.
      *   *Status:* **Non-negotiable.** Essential for evaluating the relevance of motive vs. objective role to liability and the symmetry principle.

  3.  **Bloodless Invasion (Minimal Threat & Defensive Force):** The theory must determine if, and why, defensive lethal force may permissibly be used against soldiers participating in a purely administrative, bloodless annexation where no lives (civilian or military) are *imminently* threatened by their presence/actions.
      *   *Motivation:* Tests whether liability stems *solely* from posing an *unjust lethal threat*, or if participation in an unjust *enterprise* (like unlawful occupation) or violation of sovereignty suffices, even absent immediate violence. Challenges the necessity of "threat" for liability.
      *   *Status:* **Camp Prejudice (Revisionist Leaning).** Traditionalists often accept defensive force here based on resisting aggression; strict revisionists focusing on *imminent lethal threat* struggle.

  4.  **Symmetrically Unjust War (Vacuous Equality):** The theory must account for a war where *neither* side has a just cause. It must explain if MEC still meaningfully holds between two sets of unjust combatants, or if it collapses into mutual wrongdoing without distinct moral permissions/restrictions.
      *   *Motivation:* Tests the robustness and non-vacuity of MEC. Does it require *at least one* side being just to make sense, or can it structure permissions even in mutual aggression? Crucial for evaluating the law's symmetrical application in messy realities.
      *   *Status:* **Non-negotiable.** A theory of MEC must function in wars where *no* just side exists, or explain why such wars defy moral structuring.

  5.  **Remote Warfare (Presence & Risk Decoupled):** The theory must address whether physical presence on the battlefield or exposure to reciprocal risk is necessary for liability to attack, given drone operators who commute home and face minimal risk while posing lethal threats.
      *   *Motivation:* Challenges the historical link between liability and shared risk/geography. Does MEC depend on mutual vulnerability, or is liability solely tied to responsibility for unjust threat, regardless of location/risk? Critical for modern warfare and law's adaptability.
      *   *Status:* **Camp Prejudice (Revisionist Leaning).** Traditionalists often tie status/liability to the "battlefield" and shared risk; revisionists focus purely on the threat/responsibility nexus.

  6.  **War Crimes & the Scope of Excuse (Just-Side Atrocity):** The theory must clearly delineate the boundary between acts excused (or permissions granted) by fighting for a just cause, and acts (war crimes) that are *never* excused by the justness of the cause. It must explain the status of a combatant fighting for a just cause who commits atrocities.
      *   *Motivation:* Tests the limits of the "just cause" justification. Does it extend immunity beyond combatant status to specific acts? Essential for individual responsibility under IHL and evaluating the law's focus on conduct, not cause.
      *   *Status:* **Non-negotiable.** Any theory must prevent the just cause from becoming a blanket excuse for atrocity.

  ### Joint Unsatisfiability & The Central Tension

  The core unsatisfiable trio is:
  1.  **Liability tracks individual responsibility for contributing to an unjust threat.** (Revisionist Core)
  2.  **The blameless unjust conscript (coerced, sincere believer) lacks the kind of responsibility (culpability) that grounds liability to be killed.** (Intuitive Moral Pull)
  3.  **In war, it is, and ought to remain, permissible under IHL/morality to attack the enemy's blameless conscripts.** (Traditional MEC + IHL Symmetry)

  **Resolution:** These cannot be held together. The theory must drop one.

  *   **Drop (1):** Leads to **Conventionalism/Contractarianism.** Liability is based on role/status (being a combatant) within a mutually beneficial convention, not individual responsibility. The blameless conscript is liable simply by virtue of being a combatant posing a threat for the opposing side.
      *   *Cost:* Severes the link between liability and individual moral desert. Makes liability seem arbitrary or purely rule-based from an individual perspective. Struggles to condemn the volunteer aggressor (Desideratum 2) more harshly than the blameless conscript, as both are just "combatants". Can make symmetrical unjust wars (Desideratum 4) seem permissibly violent by convention alone.
  *   **Drop (2):** Leads to **Strict Revisionism (McMahan-esque).** The blameless conscript *is* liable if they objectively contribute to an unjust threat, regardless of duress/belief. Culpability is relevant to *blameworthiness*, but liability stems from the *unjust threat* itself. Defensive killing is permissible against unjust threats posing a sufficient risk.
      *   *Cost:* Severely undermines the permissibility of attacking conscripts under IHL and common intuition. Creates massive friction with existing law and practice. Makes individual advice for the conscript ("Don't fight!") clear but practically difficult. Challenges the symmetry needed for IHL functioning (Bloodless Invasion - Desideratum 3 - becomes highly problematic).
  *   **Drop (3):** Leads to **Radical Pacifism or Highly Restrictive Jus in Bello.** If blameless unjust combatants cannot be permissibly killed, then large-scale warfare (reliant on attacking conscripts) becomes impermissible. Defensive force is restricted only to targeting culpable individuals (leaders, volunteers).
      *   *Cost:* Renders large-scale national defense effectively impossible under modern conditions. Wholly incompatible with existing IHL and the realities of state warfare. Fails as a practical guide for soldiers or law.

  ### The Key Excluding Requirement

  **The Blameless Unjust Conscript (Desideratum 1)** does the most work excluding candidate theories. It forces the fundamental choice:
  *   **Revisionism** must reject his blamelessness *for liability* or accept the impermissibility of attacking him (undermining symmetry).
  *   **Traditionalism/Conventionalism** must accept his liability despite blamelessness (severing liability from desert).
  *   **Pacifism/Restrictivism** must reject the permissibility of attacking him (undermining warfare).

  This case crystallizes the conflict between individual moral responsibility and the collective, rule-governed practice of warfare embodied in IHL symmetry.

  ### Scorecard of Three Positions

  *   **Walzerian Traditionalism:** Excels at justifying IHL symmetry (Desiderata 3, 4, 6) and permitting attack on blameless conscripts (1). Fails Desiderata 1 (individual advice is weak - "just follow orders/role"), 2 (struggles to condemn volunteer aggressor morally), and 5 (clings to geography/risk). Weak on individual grounding.
  *   **McMahan-esque Revisionism:** Excels at Desiderata 1 (clear individual advice: don't fight unjustly), 2 (distinguishes culpability), 5 (liability based on threat, not location). Fails catastrophically on Desiderata 3 (Bloodless Invasion), 4 (Symmetrically Unjust War), and the core IHL symmetry/permissibility of attacking blameless conscripts (1, 3). Weak on collective practice/law coherence.
  *   **Conventionalism/Contractarianism:** Excels at justifying IHL symmetry (Desiderata 3, 4, 6) and permitting attack based on role (1, 5). Fails Desiderata 1 (individual advice: "follow the convention" ignores personal morality), 2 (cannot morally distinguish volunteer aggressor from defensive mercenary based on role), and 6 (war crimes become purely rule violations, detached from deeper moral wrongs). Weak on individual moral accountability.

  **Conclusion:** The criteria highlight the profound difficulty in reconciling individual morality with the collective practice of war governed by symmetrical IHL. No single theory satisfies all desiderata; each sacrifices either robust individual moral guidance or the practical coherence of the symmetrical combatant privilege central to IHL. The choice hinges on prioritizing which realm (deep individual morality or functional collective practice) the theory aims to serve.
