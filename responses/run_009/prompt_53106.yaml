prompt: |-
  I teach metaethics to third-years (about 14 students, one 2-hour session, they've already done the realism/anti-realism rounds and read Street's Darwinian Dilemma paper) and I want an in-class game that makes evolutionary debunking arguments land as an experience rather than a slide. The key thing: they shouldn't just be told that their moral intuitions have a genealogy — they should live through a selection process, and only afterwards find out it applies to their actual judgments.

  Rough idea, feel free to rework it: a multi-round simulation where they play small bands of foragers, and the payoff rules quietly reward bands that develop intuitions like cheater-punishment, kin loyalty, disgust at freeriders — so that after a few rounds the surviving "tribes" have basically built the moral psychology we actually have. Then the twist: hand out a sheet of present-day moral claims and let them notice their own real judgments line up suspiciously well with whatever the game selected for. The debrief is where the actual philosophy happens: does selection-for-usefulness undermine truth-tracking? Does it matter that we'd probably have different intuitions if the payoffs had been different? And where does the debunker's argument break — our belief that fire is hot also has evolutionary roots but doesn't seem debunked by it, so what exactly is the difference supposed to be?

  Please give me: rules and materials (no real money needed), round structure with timings, the payoff scheme, the twist sheet, and a debrief that maps specific moments in the game onto specific steps of the debunking argument. Also tell me what will predictably go wrong the first time I run it, and be honest about which part of the real philosophical argument no simulation this simple can ever reproduce — the bit I'll have to just supply in the debrief.

  One more thing: please dont make it feel like a lecture with dice bolted on. The selection pressure should be something they discover happened to them, not something announced up front. Untill the reveal they should think they're just playing a resource game.
reasoning: |-
  We are designing an in-class game for a 2-hour session. The goal is to simulate evolutionary pressures that shape moral intuitions without revealing the connection until the end. The game should have multiple rounds where students, in small bands (about 3-4 bands of 3-5 students each), make decisions that lead to the development of intuitions that align with real-world moral psychology. Then, we reveal the connection and have a debrief.

  Key elements:
  - The game should feel like a resource management game initially.
  - The payoff rules should quietly reward behaviors that are evolutionarily advantageous (e.g., cooperation, punishment of cheaters, loyalty to kin, disgust at freeriders).
  - After several rounds, the surviving tribes will have developed norms that mirror our moral intuitions.
  - Twist: Hand out a sheet of present-day moral claims and have students compare their in-game decisions and the resulting norms to their real-world moral judgments.
  - Debrief: Map the game to the evolutionary debunking argument.

  Structure:

  1. Setup (15 mins)
     - Divide the class into 3-4 bands (tribes). Each band has 3-5 students.
     - Explain the basic rules: They are foragers in a harsh environment. Each round, they must decide how to allocate resources and how to respond to events that occur.
     - Distribute resources: Each band starts with the same amount of a resource (e.g., 10 "survival tokens").

  2. Rounds (4 rounds, 15 mins each, total 60 mins)
     - Each round has two phases: 
       a) Decision Phase: The band discusses and makes decisions about how to act in a scenario. 
       b) Resolution Phase: The teacher applies the payoff rules and updates the resources.

     - Scenarios: Each round presents a scenario that involves a moral dilemma. We create scenarios that are framed as resource problems but contain elements that will trigger the desired intuitions.

     Example Scenarios:

     Round 1: The Kin Loyalty Scenario
     - Scenario: "A band member's brother from a neighboring band is starving and asks for food. Your band has just enough for your own needs. Do you share some of your food with him?"
       - Options: 
          A) Share 1 resource token (costs 1 token, but the brother survives and may return the favor in the future).
          B) Refuse to share (save the token, but the brother may die and the neighboring band may hold a grudge).
       - Payoff: 
          - If they share: Lose 1 token. In a future round (say Round 3), they get 1 token back (because the brother returns the favor).
          - If they refuse: No immediate cost, but in Round 3, they lose 1 token (because the neighboring band is less helpful).

     Round 2: The Cheater-Punishment Scenario
     - Scenario: "One member of your band is caught stealing resources from the common storage. This is the second time this has happened. What do you do?"
       - Options:
          A) Banish the thief (lose the member and the resources they contributed, but prevent future theft and set an example).
          B) Forgive but warn (keep the member, but they may steal again or others may become less cooperative).
       - Payoff:
          - Banish: Lose 1 token per round for the next two rounds (because of lost labor) but then gain 1 token per round for the next two rounds after that (because of increased cooperation and no theft).
          - Forgive: No immediate loss, but in the next round, there's a 50% chance (determined by teacher) that the thief steals again (lose 2 tokens) and also a 50% chance that another member becomes a freerider (losing 1 token per round until dealt with).

     Round 3: The Freerider Disgust Scenario
     - Scenario: "A member of your band has been avoiding work, but when it's time to divide the resources, they demand an equal share. How do you respond?"
       - Options:
          A) Give them a full share (to avoid conflict).
          B) Give them half a share (as a penalty).
          C) Exclude them entirely (they get nothing).
       - Payoff:
          - Full share: The band loses 1 token (because resources are wasted on a non-contributor). Additionally, there's a 50% chance that another member becomes a freerider in the next round.
          - Half share: The band saves 0.5 tokens. The freerider might leave (50% chance) or reform (50% chance). If they leave, the band loses 0.5 tokens per round for two rounds (lost labor) but then gains 1 token per round after that (if they reform, they become a full contributor).
          - Exclude: The band saves 1 token. The freerider leaves immediately, causing an immediate loss of 0.5 tokens per round for two rounds (lost labor) but then the band gains 1 token per round after that (because of increased cooperation).

     Round 4: The Altruistic Punishment Scenario (optional, if time)
     - Scenario: "You witness a member of a neighboring band stealing from a third band. The victim band is weak and cannot retaliate. Do you intervene?"
       - Options:
          A) Intervene and stop the theft (costs 1 token because of the risk and effort).
          B) Ignore it (no cost).
       - Payoff:
          - Intervene: Lose 1 token now, but gain 1 token in the future (because the neighboring band that was helped becomes an ally and shares resources).
          - Ignore: No cost now, but in the future, the thief band may target you next (lose 1 token in the next round).

     Important: The teacher should keep the payoff rules hidden. After each decision, the teacher simply informs the band of the outcome (gain or loss of tokens) without explaining the exact mechanism.

  3. Survival (After Round 4, 5 mins)
     - Calculate the total tokens for each band. The band with the fewest tokens is eliminated (or loses a member, which reduces their future earning potential). But since we have limited rounds, we might just note which bands are above a certain threshold (e.g., 5 tokens) to survive. If a band falls below 0, they are eliminated.

  4. The Twist (10 mins)
     - Hand out a sheet with present-day moral claims. Examples:
          - "One should help close family members even at a cost to oneself."
          - "Cheaters should be punished, even if the punishment is costly."
          - "Freeriders are disgusting and deserve to be excluded."
          - "It is good to help the weak even when they cannot repay you."
     - Ask students to rate how much they agree with each statement on a scale (1-5). Then, have them compare their band's decisions in the game to these statements. They should notice that the bands that survived (or did well) tended to make decisions that align with these claims.

  5. Debrief (30 mins)
     - Map the game to the evolutionary debunking argument:
          a) In the game, the bands developed certain norms (like kin loyalty, cheater punishment) because those norms were adaptive (led to resource gains). 
          b) In reality, our moral intuitions are shaped by similar evolutionary pressures (as Street argues).
          c) The twist: we see that our real-world moral judgments align with what was selected for in the game (and by evolution). 
          d) The philosophical question: Does the fact that these intuitions were selected for their usefulness (in terms of survival and reproduction) mean they are not truth-tracking? 
          e) Contrast with non-moral beliefs: We also have the belief that fire is hot, which was selected for by evolution because it's true. So why think moral beliefs are different? 
          f) Where the debunking argument might break: Perhaps moral beliefs are not like beliefs about fire because they don't refer to objective properties? Or maybe they do? (This is the part that the simulation cannot capture and must be discussed.)

     - Specific mapping:
          - The game's selection process mirrors natural selection: Bands that adopted certain norms survived and passed on those norms (in the game, by having more resources to continue).
          - The twist reveals that our moral judgments are similarly shaped by selection pressures.
          - The debunking argument questions whether these selected beliefs are true, just because they are useful.

     - The part the simulation can't capture: The simulation shows that the norms are adaptive, but it doesn't show that they are not true. In fact, in the game, the norms are adaptive because they lead to resource gains, which is a real-world benefit. But in the moral case, the question is whether the normative truth is being tracked. The simulation doesn't have a "moral truth" built into it, so it can't show the students that the selected norms are not tracking truth. We have to discuss that in the debrief.

  6. Predictable Problems:
     - Time: The rounds might run longer than expected. Solution: Keep the scenarios short and the decision time limited (5 mins per round for discussion, 2 mins for resolution).
     - Unpredictable decisions: Students might choose options that break the intended payoff. Solution: The teacher can adjust the payoffs on the fly to maintain the intended lesson (but without revealing the adjustment). Alternatively, design the payoffs to be robust to different choices (by having multiple paths that still lead to the desired outcome).
     - Some bands might be eliminated early and become disengaged. Solution: Instead of eliminating bands, have them lose members (so they become smaller and less effective) but still participate. Or, if a band is eliminated, they can become observers or be absorbed into another band.
     - The connection might be too obvious. Solution: Frame the game as purely about resource management. Avoid moral language until the twist.

  Materials:
     - Tokens (can be paper clips, poker chips, or just a tally on the board).
     - Scenario sheets for each round (or projected).
     - A payoff cheat sheet for the teacher (to keep track of the consequences).
     - The twist sheet (with moral claims).

  Timing Breakdown:
     - Setup: 15 mins
     - Round 1: 15 mins (5 min discussion, 5 min resolution, 5 min for the teacher to update and set up next round)
     - Round 2: 15 mins
     - Round 3: 15 mins
     - Round 4: 15 mins (if included, otherwise adjust)
     - Survival and Twist: 15 mins (5 min for survival calculation, 10 min for the twist activity)
     - Debrief: 30 mins

  Total: 105 mins (if 4 rounds) - which is 1 hour 45 mins. We have 2 hours (120 mins), so a bit of buffer.

  Alternative: If time is tight, do 3 rounds.

  Debrief Questions:
     - "In the game, why did your band end up with the norms you did?"
     - "How did the decisions that led to survival align with the moral claims on the sheet?"
     - "Does the fact that these norms were selected for by the game (and by evolution in real life) mean they are true? Or just useful?"
     - "Compare to the belief that fire is hot: that was also selected for, and it's true. What's the difference with moral beliefs?"

  The part that the simulation cannot capture: The simulation does not contain any moral facts. It only has practical outcomes (resource gains). So while it shows that certain norms are adaptive, it does not (and cannot) show that they are not also true. The debunking argument relies on the idea that the evolutionary process is not tracking moral truth. The simulation, by design, has no moral truth to track. Therefore, it cannot by itself show that moral truths are not being tracked. That critical step must be argued for separately in the debrief.

  This is where the instructor must step in and explain that in the absence of an independent moral truth that the process is responsive to, we might worry that the process only selects for useful beliefs, not true ones. And then the debate continues as to whether moral truths exist and whether evolution could be responsive to them (as Street discusses).

  This game should make the students feel the force of the debunking argument by making them live through a process that generates moral-like norms without any appeal to truth, but the final philosophical step must be taken in discussion.
answer: |-
  ### Evolutionary Debunking Game: "Survival of the Fittest Norms"  
  **Goal**: Students experience how adaptive pressures shape moral-like intuitions in a resource game, then discover their real-world judgments align with game-evolved norms. The debrief connects this to Street's dilemma.  

  ---

  #### **Materials**  
  - **Resource Tokens**: Colored paper clips (red = food, blue = tools, green = medicine). Each clan starts with 10 tokens total (mix of colors).  
  - **Clan Sheets**: One per group listing resources and a "Code of Conduct" (blank at first; they fill it post-round).  
  - **Scenario Cards**: 4 sealed envelopes (one per round) with dilemmas.  
  - **Twist Sheet**: Moral claims for the reveal (see below).  
  - **Teacher Cheat Sheet**: Payoff rules (keep hidden!).  

  ---

  #### **Setup (15 min)**  
  1. **Divide into Clans**: 3-4 clans of 3-5 students each. Assign each a territory (e.g., "Forest Clan," "River Clan").  
  2. **Frame the Game**: "You’re foragers in a harsh environment. Your goal: survive 4 seasons (rounds) by collecting resources. The clan with the most tokens after winter wins."  
  3. **Distribute**: Each clan gets starting tokens and a clan sheet.  

  ---

  ### **Round Structure (60 min total; 15 min per round)**  
  Each round has:  
  - **Scenario (3 min)**: Open the envelope, read the dilemma aloud.  
  - **Clan Discussion (7 min)**: Decide actions. *They must add one rule to their "Code of Conduct"* (e.g., "Always share with family").  
  - **Resolution (5 min)**: Teacher secretly applies payoffs, updates tokens.  

  #### **Round Scenarios & Payoff Scheme (Hidden Evolutionary Pressures)**  
  *(Payoffs trigger based on choices; teacher adjusts tokens without explanation)*  

  1. **Round 1: Kin Loyalty**  
     - *Scenario*: "Your clan finds a sick elder. Healing them costs 1 medicine (green token), but they can’t work afterward. Do you help?"  
     - *Payoff*:  
       - **Help**: Lose 1 green now. *Gain 2 red tokens next round* (elders advise on foraging).  
       - **Don’t help**: No cost. *Lose 1 blue token next round* (clan morale drops).  

  2. **Round 2: Cheater-Punishment**  
     - *Scenario*: "A member hoards 2 food tokens. Confront them? If yes, how?"  
     - *Payoff*:  
       - **Punish (e.g., banish/take tokens)**: Lose 1 blue token (conflict effort). *Gain 3 red tokens over next two rounds* (deterrence boosts cooperation).  
       - **Ignore**: No cost. *Lose 2 red tokens* (hoarding spreads).  

  3. **Round 3: Freerider Disgust**  
     - *Scenario*: "A healthy member refuses to forage. Others demand consequences. What do you do?"  
     - *Payoff*:  
       - **Shame/exclude them**: Lose 1 red token (lost labor). *Gain 2 blue tokens* (others work harder).  
       - **No consequence**: *Lose 3 red tokens* (laziness spreads).  

  4. **Round 4: Tribal Loyalty**  
     - *Scenario*: "A neighboring clan steals your tools. Retaliate, or focus on your survival?"  
     - *Payoff*:  
       - **Retaliate**: Lose 2 blue tokens (risk). *Gain 1 token of each color* next round (deterrence/respect).  
       - **Ignore**: No cost. *Lose 1 clan member* (they defect to stronger groups) = permanent -1 token/round.  

  ---

  ### **The Twist (10 min)**  
  1. **Declare "winners"** (most tokens).  
  2. **Hand out "Modern Moral Claims" Sheet**:  
     > "Rate your agreement (1–5) with:  
     > 1. *We must help family, even at great cost.*  
     > 2. *Cheaters deserve punishment, even if it’s costly.*  
     > 3. *Freeriders are disgusting and should be shunned.*  
     > 4. *Loyalty to your group is more important than fairness to outsiders.*"  
  3. **Reveal**: "The game payoffs secretly rewarded clans who developed rules like #1-4. Check your clan’s Code of Conduct against your ratings."  

  ---

  ### **Debrief (35 min) – Mapping Game to Street’s Dilemma**  
  **Key Moments & Philosophical Links**:  
  | **Game Moment**              | **Debunking Argument Step**                                  | **Discussion Questions**                                                                 |  
  |------------------------------|-----------------------------------------------------------|----------------------------------------------------------------------------------------|  
  | Clans adding "help family" to their Code (Round 1) | **Genealogy of Intuitions**: Norms arise from adaptive pressures. | *"Why did ‘help family’ feel like the ‘right’ call? Was it truth or survival?"* |  
  | Payoffs boosting cooperating clans (Rounds 2–3)    | **Selection ≠ Truth-Tracking**: Usefulness drives adoption, not accuracy. | *"Did the winning clans ‘discover’ moral facts, or just luck into useful rules?"* |  
  | Twist sheet alignment         | **Suspicious Correlation**: Our real judgments match evolved instincts. | *"Why do your ratings align with the game’s payoffs? Coincidence?"* |  
  | Contrast: "Fire is hot" belief | **Alarm vs. Comfort**: Non-moral beliefs (e.g., fire) are testable; morals aren’t. | *"Why does evolution debunk morals but not ‘fire is hot’?* (Hint: causal feedback loops vs. no independent moral ‘fire’ to track)" |  

  **Breakdown of Street’s Dilemma in Debrief**:  
  1. **First Horn**: If evolution shaped moral intuitions, they track fitness, not moral truth. *(Game: Norms were selected for resource gains.)*  
  2. **Second Horn**: If morals *do* track truth, evolution coincidentally aligned us with them. *(Game: Clans coincidentally had rules matching the payoffs.)*  
  3. **The Difference**: Moral beliefs lack independent verification (unlike fire, where pain corrects error). *(Game: No "moral pain" existed—only token gains.)*  

  ---

  ### **Predictable Problems & Fixes**  
  - **Problem**: Students see through the "moral" layer early.  
    - *Fix*: Use neutral language (e.g., "Code of Conduct" vs. "morals"; "resource efficiency" vs. "fairness").  
  - **Problem**: One clan dominates, others disengage.  
    - *Fix*: Add randomness (e.g., "a storm destroys 2 tokens" for leading clans).  
  - **Problem**: Debate eats time.  
    - *Fix*: Use timers; offer "default" choices if stuck.  
  - **Problem**: Oversimplification of evolution.  
    - *Fix*: Acknowledge post-game: "Real evolution involves genes, not tokens!"  

  ---

  ### **What the Game Can’t Simulate (Must Explain in Debrief)**  
  **The Representation Problem**:  
  - In the game, tokens objectively measure survival. In reality, there’s no independent "moral token" to track.  
  - **Why it matters**: Street’s point isn’t that evolution *causes* morals—it’s that evolution can’t *justify* them because usefulness ≠ truth. The game’s payoffs are arbitrary (you set them), but real evolution’s "payoffs" (fitness) are equally silent on truth.  

  **Bridge the Gap**:  
  > "In the game, you saw how rules that felt ‘right’ were just those that won tokens. But tokens are real! Moral truths, if they exist, aren’t like tokens—we can’t point to them. So when Street says evolution gave us useful intuitions, she’s asking: useful for *what*? Survival, not truth."  

  ---

  ### **Why This Works**  
  - **Experiential**: They *live* the selection process, making the "aha" moment visceral.  
  - **Stealthy**: Moral language is avoided until the twist.  
  - **Low Prep**: Paper clips, envelopes, and printed sheets suffice.  
  - **Philosophically Rigorous**: Every game mechanic maps to Street’s logic.  

  **Final Tip**: Start the debrief by having clans share one norm from their Code. Highlight how the "winners" all have kin loyalty/cheater-punishment—then drop Street’s bomb: *"Your real morals likely got here the same way."* 😉
