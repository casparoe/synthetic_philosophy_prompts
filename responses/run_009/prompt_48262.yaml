answer: |-
  ## Dialogue on the Talus: Composing Reality

  **Setting:** A steep, shifting talus slope in the Yukon. Sun glints off angular granite fragments, from fist-sized to car-sized. Fine dust puffs with each step. Below, the moraine left by the vanished glacier sprawls; above, the cirque headwall looms. **Mira** (early 50s, sharp eyes, practical boots) and **Cal** (late 60s, weathered face, steady gait) pick their way upwards.

  **Mira:** See this slope, Cal? Textbook universalism exhibit. Every single clast here, from that tiny quartz grain sparkling over there to that monstrous gneiss boulder we just passed? They all compose something: *this* slope. Right now. Just like they composed the glacial till pile down there yesterday, and the bedrock up there a million years before that. The composition relation doesn't care about our fussy maps.

  **Cal:** (Kicks a loose cobble, watches it clatter down) Universalism, Mira? So this slope is one object. Fine. But by your lights, *this* handful of pebbles I just dislodged *also* composes an object. And those pebbles *plus* my boot compose another. And my boot plus that patch of lichen on the boulder over there composes *yet* another. And my boot plus the Andromeda Galaxy...? You’re telling me each of those wildly scattered, utterly unconnected sums is a genuine, distinct *thing*? How do you even count them? Isn’t reality just one infinitely overlapping mess of trillions of 'objects'? That feels like parody, not ontology.

  **Mira:** (Stops, leans on her ice axe, gesturing) Parody? No, it’s consistency! *Why* is the slope okay but my boot-and-Andromeda sum not? Because the slope *looks* cohesive? Because it *functions* as a unit for a marmot burrow or our mapping? That’s smuggling in human interest! Geology 101: ‘Cohesion’ is a gradient. Down below, fines are settling, spar cement’s starting to form at contacts – is that the magical ‘composition’ threshold? Is it 10% cement? 15%? 5 microns thick? You restrictionists draw a line in this shifting sand and pretend it’s bedrock.

  **Cal:** (Points at two interlocked boulders) It’s not *just* about human interest, Mira. Look at those two. Gravity, friction, their shapes – they’re *interacting*, bound in a stable configuration. They exert forces *on each other* as a unit relative to the rest of the slope. That’s different from your boot and Andromeda, which share no relevant causal connection whatsoever. There’s *unity* here – a causal coherence absent in your gerrymandered sums. A pile becomes an object when its parts are unified, bound together by relevant forces or processes, forming a relatively stable, integrated whole. The slope *as a whole* has a degree of this – internal forces distribute load, fines fill voids creating structure. It’s proto-conglomerate, a system *becoming* more unified.

  **Mira:** Ah, ‘unified’! ‘Integrated’! ‘Relevant forces’! Cal, you’re describing a *spectrum*. That glacier moraine? Those clasts were unified by ice flow, pressed together. Now they’re just sitting, less unified than this slope, but more unified than the same clasts scattered by a flood. Where’s *the* threshold? And what makes a force ‘relevant’? Gravity binds the slope *and* binds my boot to Earth *and* loosely binds the solar system. Does gravity unify everything? If not, why does it unify the slope but not the solar system? Your ‘unity’ is just as interest-relative as my ‘composition’ – you pick the scale and forces *geologists* care about: friction, cementation, structural integrity for mapping.

  **Cal:** (Taps a boulder with his hammer, a sharp *clink*) Okay, grant me the slope itself *is* messy. Maybe it *is* indeterminate right now whether it’s one object or just a big pile. But that indeterminacy isn’t about *existence*, Mira! It’s about *classification*. The rocks are there, the contacts are there, the incipient cement is there. The *ontology* is sharp – the fundamental particles, the atoms, the minerals. The vagueness is in our *concept* ‘object’, applying it to complex, borderline aggregates like this. We can’t always say definitively ‘one thing’ or ‘many things’, but that doesn’t mean reality is fuzzy *or* that every arbitrary sum exists. It means *our categories* have fuzzy boundaries when dealing with emergent complexity.

  **Mira:** (Scoops up some gravel and fines, lets it trickle through her fingers) Indeterminacy in classification, not existence? Fine. But Cal, if reality is sharp – just fundamental particles arranged rock-wise – then *what exists* besides those particles? Do composites *really* exist at all? Your ‘unified’ composites? Or is it all just particles arranged pile-wise, or slope-wise, or mountain-wise? If composites *do* exist, and their existence isn't vague, then the composition question *must* have a yes/no answer for *any* collection. If it doesn't – if it's vague for this slope – then either composites don't fundamentally exist (only the particles do), or existence *can* be vague. Universalism avoids that mess: composition *always* happens. The slope exists *as a composite object*, just like the boulder exists, and the moon-plus-spoon exists – whether it’s useful or not. Vagueness in the middle supports *me*, Cal. It shows your principle for restricting composition can't deliver sharp answers where reality itself presents gradual transitions, like diagenesis. Geology is *full* of these transitions – sediment to rock, magma chamber to pluton, talus to proto-conglomerate. Your ‘unity’ criterion gets washed out in the hydraulic sorting.

  **Cal:** (Looks out over the slope, then up at the cirque) I won’t deny the transitions, Mira. I mapped them for decades. But I think you mistake the map for the territory. Just because *we* draw a line on an airphoto where the resolution blurs, just because the physical interactions that bind a pile of rubble into a coherent mass *increase gradually*, doesn’t mean there’s no underlying physical reality to being unified. That spar cement forming? It’s a new *bond*, creating a new level of structural integrity. It’s ontological novelty, not just semantic shuffling. The moon and your spoon share no such novel bond or integrated function. My core is this: there *is* a difference in kind between a pile of stuff held together only by external forces (like gravity acting on each part individually) and a system where parts are dynamically interconnected, creating emergent properties and behaviors *of the whole*. The slope is edging towards the latter; the glacier moraine was shaped by it; your spoon and the moon aren’t. I’ll concede the boundaries can be hellishly fuzzy to *detect*, especially mid-process. But that fuzziness reflects epistemic limits, not ontological permissiveness. Not *every* arrangement composes. Only those that achieve a certain threshold of internal causal integration.

  **Mira:** (Starts climbing again, voice carrying back) And I’ll concede that threshold of ‘integration’ is what makes things *interesting* and *useful* to us – geologists, marmots, spoon-users. My core is this: existence isn’t graded by how interesting or integrated something is. Composition is cheap and universal. What matters is how the parts are arranged – and *all* arrangements exist. Your ‘integration’ is a fascinating, emergent property *of* some composites, but it’s not the prerequisite *for* their existence as composites. The slope is one object, warts and all. So’s the moraine. So’s the boot-Andromeda sum. The difference isn't in *what exists*, Cal, it's in *what's cohesive*. You're trying to make cohesion define existence. I say existence is given; cohesion is earned. Now watch your step – this next bit is loose scree. One object, but a treacherous one.

  **Cal:** (Chuckles grimly, following carefully) Cohesion *matters*, Mira. It matters for whether something hangs together as one thing in the causal web, not just in a logician's notebook. But point taken about the scree. Let’s argue ontology on more solid ground. That outcrop up ahead looks promisingly... integrated.

  **(They continue climbing towards a massive, jointed granite outcrop, the debate unresolved but the tension now companionable.)**

  \bottomline{Cal maintains composites only exist when parts achieve sufficient causal integration/unity, while Mira maintains any collection composes an object regardless of integration, seeing Cal's unity as emergent property not existence condition.}
