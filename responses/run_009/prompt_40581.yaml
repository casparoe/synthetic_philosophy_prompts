prompt: |-
  So I teach ethics and I'm putting together my position statement on supererogation for a faculty workshop thing, and before I embarrass myself I want to know if my commitments actually hang together. Here's roughly the package:

  1. Supererogation is real: some acts are genuinely good to do while it remains permissible not to do them. Jumping on the grenade, donating a kidney to a stranger.

  2. I reject any deep doing/allowing distinction — letting die and killing are morally on a par when the outcomes and costs to the agent are the same.

  3. Duties of beneficence toward strangers are all imperfect duties: they're satisfied by some pattern of giving of the agent's own choosing, and no particular act of aid, at no particular time, is ever strictly required.

  4. Morality is only moderately demanding — it's permissible to keep enough of your income for a decent life even when giving more would do more good.

  5. My case judgments, which I'm fairly firm on: the passerby who won't ruin his expensive shoes to wade into the shallow pond and save the drowning child does something *wrong*; but the donor who gives enough to save exactly one child through an effective charity and then stops has done nothing wrong at all.

  6. It's never apt to praise someone merely for doing what duty already required — praise is for the beyond-duty, that's kind of its whole job.

  My worry is that when I line these up, 2 and 5 seem to collide (pond guy and distant donor look relevantly similar if the doing/allowing distinction does no work), and 3 seems to make the pond judgment impossible (a duty that never requires any specific act can't condemn one specific omission). But maybe I'm wrong about where the real pressure is, and maybe some of what looks like a collision isn't one. I honestly can't tell which of my six commitments is causing the trouble, or whether it's the same culprit twice.

  So: audit the set. Tell me which pairs are genuinely in tension and how badly, which apparent tensions dissolve on inspection (I suspect there's at least one that only looks bad, maybe involving 1 and 3, or the latitude idea and supererogation generally, but don't let me steer you), rank the real tensions by severity, and for each one say what would have to give and roughly what it costs me to give it up. If there's a single revision that cleans up the most, flag that too. Keep it under 600 words — I'd rather have the sharp version than the complete one.
reasoning: |-
  Okay, the user is an ethics teacher preparing a position statement on supererogation for a faculty workshop. They've listed six commitments and are worried about internal tensions, specifically between points 2 (rejecting doing/allowing distinction) and 5 (pond case judgment), and between 3 (imperfect duties never require specific acts) and 5. 

  Hmm, let me unpack this systematically. First, the pond case (point 5) is tricky because condemning the shoe-ruining omission seems to demand a specific duty to act, which clashes with point 3's claim that no particular act of aid is ever required. The user might be underestimating how much this undermines their framework — if imperfect duties truly lack act-specificity, the pond judgment collapses. 

  Meanwhile, point 2's rejection of doing/allowing makes the distant donor case (where stopping after one donation is permissible) look inconsistent with condemning the pond omission. If outcomes and costs are equalized, why is one blameworthy and the other not? The user seems attached to both intuitions but hasn't resolved this asymmetry. 

  *scratches head* Wait, point 4 (moderate demandingness) might actually help with the donor case — it explains why keeping income for a decent life is permissible even when more giving would help. But that doesn't fix the pond tension. 

  *lightbulb flickers* Ah! The real culprit is point 3. By insisting imperfect duties *never* require specific acts, the user boxes themselves in. They could soften this to allow rare, low-cost, high-urgency cases like the pond to trigger specific obligations without collapsing into full perfect duties. That'd preserve the pond judgment while keeping distant aid discretionary. 

  But then point 2's rejection of doing/allowing becomes problematic — if pond and distant cases are morally equivalent when costs/outcomes match, why treat them differently? The user might need to either: (a) bite the bullet and say the pond omission *isn't* wrong (contra their intuition), or (b) concede that doing/allowing *does* matter in practice for triggering duties, despite theoretical parity. 

  *pauses* The praise point (6) seems fine standalone but might amplify tensions if supererogatory acts become too scarce due to overbroad duties. Not an immediate issue though. 

  Recommendation: Prioritize revising point 3 to allow specific requirements in extreme cases. That resolves the pond/duty clash. For point 2, either adjust the pond judgment (politically risky!) or add nuance about context/scarcity affecting obligation. The kidney donation example in point 1 actually helps — it shows supererogation survives even with this revision. 

  *checks word count* Should emphasize: the core conflict is between the rigidity of point 3 and the situational force of the pond intuition. Everything else is manageable with careful phrasing. User’s instincts about 1/3 compatibility were right — supererogation thrives *because* of latitude, not despite it.
answer: |-
  Here's the audit, focusing on tensions and solutions:

  **Critical Tension: Points 3 & 5 Collide Badly**
  *   **Problem:** Point 3 states that duties of beneficence are *imperfect* and **never require any specific act.** Yet point 5 condemns the pond passerby for a *specific omission* (not wading in). This creates a direct contradiction. If no specific act is required, how can omitting *this specific act* be wrong? The pond case seems to demand a *perfect* duty in that moment.
  *   **Severity:** High - This strikes at the core consistency of your package.
  *   **What Must Give:** You must relax point 3. Imperfect duties *can* generate specific requirements in extreme, immediate, low-cost/high-benefit situations like the pond. This doesn't collapse into a general perfect duty to aid; it carves out an exception for emergencies where agency and opportunity uniquely converge.
  *   **Cost:** You sacrifice the purest form of "no specific act is *ever* required." You adopt a "moderate latitude" view where imperfect duties mostly grant discretion *except* in clear, pressing, low-cost emergencies.

  **Significant Tension: Points 2 & 5 Create Pressure**
  *   **Problem:** Rejecting doing/allowing (Point 2) makes outcomes and costs the key factors. The distant donor (Point 5) stops after saving one child. The pond passerby refuses to save one child at low cost (ruined shoes). If costs/outcomes are similar (both "letting one die" at moderate personal cost), Point 2 suggests they should be judged similarly. Yet you blame the pond guy but not the donor. The *context* (immediacy/directness) seems to drive your different judgments, but Point 2 denies this distinction matters fundamentally.
  *   **Severity:** Moderate-High - It challenges the coherence of your case judgments if costs/outcomes are truly paramount.
  *   **What Must Give:** Either:
      1.  **Modify Point 2:** Concede that *context* (like immediacy, direct perception, unique capability) *can* affect whether an omission violates a duty, even if "killing vs. letting die" per se isn't fundamental. Or,
      2.  **Re-evaluate Point 5:** Argue the costs *aren't* equivalent (potential psychological burden/missed chances for the distant donor vs. simple property loss for pond guy) or that the pattern requirement (Point 3, as revised) explains the difference (donor satisfies duty via pattern, pond guy fails the *in extremis* requirement).
  *   **Cost:** (Option 1) Weakens the strong rejection of doing/allowing by introducing context-dependence. (Option 2) Requires defending a potentially less intuitive cost assessment or leaning heavily on the revised imperfect duty view.

  **Minor Tension / Potential Synergy: Points 1, 3 & 4**
  *   **Problem:** Points 1 (Supererogation exists) and 3 (Imperfect duties) are generally compatible. Latitude (Point 3) creates the space for supererogation (Point 1). Point 4 (Moderate Demandingness) sets the baseline below which acts become supererogatory. However, the *extent* of latitude in Point 3 (especially if revised) affects *how much* room exists for supererogation. Overly broad specific requirements shrink supererogation's scope.
  *   **Severity:** Low - Primarily requires careful articulation.
  *   **Resolution:** Your revised Point 3 (allowing specific requirements *only* in extreme emergencies) preserves ample space for supererogation (Point 1). Point 4 clearly defines the baseline level of required beneficence (fulfilling imperfect duties without heroic sacrifice), making acts beyond this supererogatory. Ensure Point 4's "decent life" threshold isn't set so high it swallows the latitude needed for supererogation.

  **Point 6 (Praise):** Stands independently and is compatible with the rest. It defines a function of praise, not a constraint on duties.

  **The Single Best Revision:**
  **Revise Point 3:** Allow that imperfect duties of beneficence **can generate specific requirements in extreme, immediate, low-cost/high-benefit emergencies** (like the pond), while retaining significant discretion otherwise. This directly resolves the critical Point 3 vs. 5 tension and lessens the Point 2 vs. 5 pressure by providing a context-based (non-doing/allowing) reason for the different judgments. It preserves supererogation and moderate demandingness effectively.

  **Summary of Revisions & Costs:**
  1.  **Revise Point 3:** Cost - Abandons the strict "no specific act *ever* required" dogma for imperfect duties; adopts a more nuanced "moderate latitude" view.
  2.  **Clarify/Adjust Points 2 or 5:** Cost - Either slightly weaken the rejection of doing/allowing by acknowledging contextual relevance to duty (Point 2), or provide a more robust defense of the cost/pattern difference between the pond and donor cases (Point 5).

  Prioritize revising Point 3. This addresses the most severe inconsistency and creates a foundation for resolving the others.
