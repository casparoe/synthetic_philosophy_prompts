  Purpose: The standard of adequacy is that the theory must serve the practice of empirical science.

  Desiderata (with id, name, statement, motivating_case, status, status_note):

  We list the desiderata from the user's description and add any obvious ones for empirical science.

  1. Inference Licensing: The theory must license the inference between asserting a sentence and asserting that it is true (e.g., from "it is true that the sample contains cesium-137" to the sample containing cesium-137, and vice versa).

     - Motivating case: Everyday scientific discourse and reporting require that if we say a statement is true, we are committed to the statement, and if we are committed to the statement, we can say it is true. This is fundamental to scientific communication.

     - Status: non-negotiable. Without this, the concept of truth would not function in scientific reasoning and reporting.

  2. Expressive Generalization: The theory must allow truth to serve as a device for expressing infinite or open-ended conjunctions (e.g., "every entry in this data table is accurate" without listing each entry).

     - Motivating case: In science, we often make general claims about large sets of data or hypotheses (e.g., all measurements in a log are correct). Truth as a generalization device is essential.

     - Status: non-negotiable. This is a key function of truth in scientific discourse.

  3. Norm of Assertion/Belief: The theory must account for truth being the norm of assertion and belief (if it is indeed the norm).

     - Motivating case: In science, we assert and believe things because they are true (or we take them to be true). The concept of truth guides our acceptance of claims.

     - Status: camp_preference. Some camps (e.g., alethic realists) hold that truth is the fundamental norm, while others (deflationists) may account for it differently. But in empirical science, it is a common intuition.

     - Status_note: This is a preference of the realist camp and some normativist camps. Deflationists can accommodate it by saying that to assert is to present as true, but they may not see truth as a substantial norm.

  4. Explanatory Role in Success: The theory must explain (or explain away) the intuition that the success of our best instruments and models requires truth as an explanatory posit (as scientific realists claim).

     - Motivating case: Scientific realists argue that the success of science is best explained by the truth (or approximate truth) of theories. Anti-realists and deflationists may challenge this.

     - Status: camp_preference. This is a key point for scientific realists. Deflationists typically deny that truth plays such an explanatory role.

     - Status_note: This is a preference of the scientific realist camp.

  5. Formal Compatibility: The theory must mesh with formal results such as Tarski's undefinability theorem and the liar paradoxes.

     - Motivating case: A scientist with some knowledge of logic (like the user) is aware of these formal limitations and expects a theory of truth to be consistent with them.

     - Status: non-negotiable. A theory that leads to contradictions (like the liar) or ignores Tarski's results would be inadequate for rigorous science.

  6. Calibration Problem: The theory must address the concern that in instrument calibration, we never compare readings directly with reality but only with other instruments, and the whole edifice must be anchored in truth at some point (or explain why this is not necessary).

     - Motivating case: The user's experience in radiochemistry: instrument readings are calibrated against other instruments, and the worry is that without truth, we only have consistency, not connection to the world.

     - Status: suspect? Or camp_preference? The user is unsure if this is a genuine constraint or a confusion. We note that realists see this as requiring a correspondence theory, while deflationists and coherence theorists may have different takes.

     - Status_note: This is a preference of the correspondence realist camp. Deflationists might say that the calibration chain is justified by its reliability and that truth is just a device for endorsing statements, not an independent anchor.

     - We mark it as camp_preference (for correspondence realists) but note that the user is unsure.

  We add one more that is implicit in the deflationary account but is a general requirement:

  7. Conservativeness: The theory should not imply substantive metaphysical commitments that go beyond what is required by the scientific practice.

     - Motivating case: In science, we want a concept of truth that does not require us to take on heavy metaphysical baggage (e.g., a particular ontology of facts or properties). This is a deflationary motivation.

     - Status: camp_preference. This is a key point for deflationists and minimalists.

     - Status_note: This is a preference of the deflationist camp.

  Now, we have:

  - d1: Inference Licensing
  - d2: Expressive Generalization
  - d3: Norm of Assertion/Belief
  - d4: Explanatory Role in Success
  - d5: Formal Compatibility
  - d6: Calibration Problem
