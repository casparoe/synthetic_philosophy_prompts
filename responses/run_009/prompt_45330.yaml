    - [d6, d7]: "Addressing the calibration problem by requiring a direct correspondence anchor (d6) conflicts with conservativeness (d7)."

  But note: d6 is classified as camp_preference (correspondence), so it is not mandatory. Similarly, d4 is camp_preference (realist). The non-negotiable ones (d1, d2, d5) are satisfied by both.

  Most Excluding:

  The desideratum that knocks out the most candidates is d5 (Formal Compatibility) because it rules out naive theories that do not handle the liar paradox or Tarski's undefinability. However, all the theories we are considering (deflationary ones) are designed with Tarski in mind. Actually, d4 (Explanatory Role) is the one that deflationary theories fail, and it is a camp_preference. The non-negotiable ones are met by all the deflationary candidates.

