  Given that d6 is classified as camp_preference, it doesn't exclude deflationism per se. The most excluding might be d5, but actually, all modern theories are built to be formally compatible. So perhaps d4 is the one that excludes deflationary theories and d7 excludes realist ones.

  But in the context of the user's interest in deflationism, d4 is the main hurdle.

  We'll say: d4 (Explanatory Role) because it is the desideratum that deflationary theories explicitly reject, and it is a key point of contention.

  Scorecard:

  We evaluate four theories:

  1. Redundancy theory (e.g., Ramsey): Truth is redundant; "it is true that p" is equivalent to asserting p.
  2. Quinean disquotationalism: Truth is a device of disquotation; the truth predicate applies to a sentence when we can assert the sentence (removing quotation marks).
  3. Horwich's minimalism: The concept of truth is captured by the equivalence: <p> is true iff p. The theory consists of all such instances (and is minimal).
  4. Prosentential theory (e.g., Grover, Camp, Belnap): Truth predicates are prosentences that stand in for other sentences, like pronouns.

