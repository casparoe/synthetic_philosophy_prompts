  Joint Satisfiability:

  We must check if all these can be satisfied together. The main tensions are between the deflationary camp and the realist camp.

  - The deflationary theories (redundancy, disquotationalism, minimalism, prosentential) will satisfy d1, d2, d3 (with a deflationary account of norm), d5, d6 (by explaining away the need for an anchor in a correspondence sense), and d7. But they fail d4 (explanatory role) and the correspondence reading of d6.

  - Realist theories (e.g., correspondence) satisfy d1, d2, d3, d4, d5 (if carefully handled, e.g., with Tarski), d6 (by providing the anchor), but they fail d7 (they are not conservative).

  So, the conflicting sets are:

  - {d4, d7}: The explanatory role (d4) requires a substantive theory of truth that can explain success, but conservativeness (d7) forbids such substantive commitments. So they conflict.

  - Also, the calibration problem (d6) in the correspondence sense conflicts with d7 (conservativeness) because a correspondence theory requires a substantive relation to the world.

  Therefore:

  Verdict: "Not all desiderata can be jointly satisfied because of conflicts between the demands of realism and deflationism."

