prompt: |-
  I teach a final-year undergraduate module in social choice theory, and I am setting this year's closed-book final examination. Last year's question on Arrow's impossibility theorem produced answers I could have written myself before the exam was sat: virtually every script recited the theorem, listed unrestricted domain, Pareto, independence of irrelevant alternatives and non-dictatorship, offered a sentence on why independence is meant to be attractive, and stopped. This year I want a question that cannot be answered by reciting the four conditions. I have a particular angle in mind — one we spent two weeks on in lectures — and I would like you to turn it into a proper exam question, together with a model answer and a marking scheme.

  The angle turns on an asymmetry between two ways of responding to the theorem by weakening a condition. If we weaken independence, possibility returns at once: the Borda count, for instance, satisfies unrestricted domain, Pareto, non-dictatorship and transitivity of the social ordering, and fails only independence. If instead we drop Pareto and keep the rest, we do not get possibility back. A corollary we proved in lectures, by running Arrow's argument on decisive coalitions, says that any social welfare function satisfying unrestricted domain, independence, non-dictatorship and transitivity of the social ordering — provided the rule is not imposed, that is, the social ordering is not simply fixed in advance regardless of what anyone prefers — must be an oligarchy: there is a group of individuals such that whenever all of its members strictly prefer x to y, society ranks x above y, and whenever any one of them strictly prefers x to y, society is at least indifferent between them. The members of the oligarchy are jointly decisive, and each individually holds a veto. So dropping Pareto buys almost nothing, while dropping independence buys a great deal, and I want the question to force students to confront that asymmetry and its implications for the fashionable reaction to Arrow that says, in effect, that the theorem merely demonstrates independence is an implausibly strong condition, and that relaxing it dissolves the problem.

  The deliverables are these: one essay question, answerable in ninety minutes by a student who has attended the course but has memorised nothing beyond the lecture notes (a single prompt or two linked parts is your call); a model answer of roughly 600 words; and a marking scheme out of 20 that separates a first-class script from an upper-second by naming the specific moves each must contain. My expectation is that an upper-second answer should reproduce the corollary and the Borda point accurately, whereas a first-class answer should additionally diagnose why the asymmetry arises — I have my own view (roughly, that independence is a structural constraint on how the rule may use information about preferences, while Pareto is a substantive constraint on outcomes, and the proof shows the structural constraint does nearly all the work on its own), but full credit should be available for any well-argued diagnosis, not only mine — and should engage seriously with the "just reject independence" reaction rather than dismissing it. For each band, include a one-line note on the mistake students typically make at that point. Please also reserve at least two marks for noticing that the corollary as I have stated it needs its non-imposition proviso, since a permanently imposed social ordering satisfies unrestricted domain, independence, non-dictatorship and transitivity while making every voter irrelevant; a script that spots this unprompted, and can say what work the proviso is doing, is exactly what I want the question to elicit. Finally, no bibliography is required — award no marks for name-dropping references that are never used, and expect the model answer to stand entirely on its own.
reasoning: |-
  We are designing an exam question that forces students to engage with the asymmetry between weakening Independence and weakening Pareto in Arrow's theorem. The key points are:
   - Dropping Independence (keeping Pareto) allows for possibility (e.g., Borda count).
   - Dropping Pareto (keeping Independence) only leads to oligarchy (if we also require non-imposition) and not full possibility.

   The question should elicit:
   1. The statement of the asymmetry.
   2. The corollary about oligarchy (with the non-imposition proviso).
   3. An explanation of why the asymmetry arises.
   4. Engagement with the "just reject independence" reaction.

   We are to produce:
   - One essay question (possibly with two linked parts).
   - A model answer of about 600 words.
   - A marking scheme out of 20, with specific criteria for first-class and upper-second, and notes on common mistakes.

   Question idea:

   "Arrow's Impossibility Theorem shows that no social welfare function can satisfy a set of seemingly reasonable conditions. A common reaction is to argue that the Independence of Irrelevant Alternatives (IIA) condition is too strong and should be relaxed. However, relaxing the Pareto condition instead does not lead to a similarly rich set of possibilities.

   (a) Explain this asymmetry by comparing what becomes possible when we drop IIA (while keeping Pareto, Unrestricted Domain, Non-dictatorship, and Transitivity) and what happens when we drop Pareto (while keeping IIA, Unrestricted Domain, Non-dictatorship, and Transitivity, and adding the requirement that the rule is not imposed). [12 marks]

   (b) Discuss why this asymmetry might arise, and evaluate the claim that Arrow's theorem merely shows that IIA is implausible and should be rejected. [8 marks]"

   Alternatively, we can have a single prompt:

   "It is often said that Arrow's Impossibility Theorem shows that the Independence of Irrelevant Alternatives (IIA) condition is too strong, and that by relaxing it we can avoid the impossibility. However, relaxing the Pareto condition instead does not lead to a similarly rich set of possibilities. Explain and critically assess this claim."

   But the two-part structure might help the students organize their answer and ensure they cover both the facts and the critical assessment.

   Let's go with the two-part structure.

   Model Answer (approx 600 words):

   Arrow's Impossibility Theorem states that no social welfare function can simultaneously satisfy Unrestricted Domain (UD), Pareto Efficiency (P), Independence of Irrelevant Alternatives (IIA), and Non-dictatorship (ND), while producing a transitive social ordering. The theorem has led some to argue that IIA is the most problematic condition and that by relaxing it we can avoid the impossibility. This view is supported by the fact that several well-known voting rules, such as the Borda count, satisfy UD, P, ND, and transitivity, but fail IIA. However, when we relax Pareto instead (while retaining IIA, UD, ND, and transitivity, and adding non-imposition) we only get a possibility of oligarchic rules, which are still highly restrictive. This asymmetry suggests that IIA is the key driver of the impossibility.

   (a) When we drop IIA but retain UD, P, ND, and transitivity, we open the door to a variety of voting systems. The Borda count is a prime example: it assigns points to alternatives based on their rank in each individual's preference ordering and sums these points to determine a social ranking. It satisfies UD because it can handle any preference profile. It satisfies P because if every individual prefers x to y, then x gets a higher Borda score than y. It is non-dictatorial because no single individual can always determine the social ranking. And it produces a transitive social ordering. However, it violates IIA because the relative ranking of two alternatives can change based on the introduction or removal of an irrelevant alternative (one that is not one of the two being compared). Thus, by relaxing IIA, we get a workable and democratic voting system.

   In contrast, if we drop Pareto but retain IIA, UD, ND, transitivity, and require non-imposition (that is, the social welfare function is not imposed, meaning the social ordering is not fixed in advance for all profiles), we do not get a return to a wide range of possibilities. Instead, we get an oligarchy. An oligarchy is characterized by a group of individuals (the oligarchs) such that: (i) if all oligarchs strictly prefer x to y, then society prefers x to y (joint decisiveness); and (ii) if at least one oligarch strictly prefers x to y, then society does not prefer y to x (each has a veto). This result is derived by running Arrow's proof but without Pareto. The proof shows that the set of all individuals is decisive (by non-imposition) and then uses IIA to show that there is a smallest decisive coalition, which becomes the oligarchy. Without Pareto, we cannot rule out that this coalition has more than one member, but we still get an undemocratic structure. Note that non-imposition is necessary to avoid the trivial case of an imposed rule that ignores all voters and satisfies the conditions trivially (by always outputting a fixed ordering).

   (b) The asymmetry arises because IIA is a structural constraint on how the social welfare function uses information from individual preferences, while Pareto is a substantive constraint on outcomes. IIA restricts the social welfare function to using only the individual orderings over pairs of alternatives when determining the social ordering of that pair. This restriction is so severe that, when combined with the other conditions, it forces the rule to be dictatorial (or oligarchic without Pareto). In contrast, Pareto only requires that if everyone prefers x to y, then so does society. Relaxing IIA allows the rule to use more information (like the entire preference ordering) and thus enables non-dictatorial rules. Relaxing Pareto, however, does not relax the structural constraint and so the rule is still forced to base the social ranking on pairwise information in a way that leads to concentrated power.

   The claim that Arrow's theorem merely shows IIA is implausible and should be rejected is therefore partially justified: relaxing IIA does indeed open up many possibilities. However, it is an oversimplification to say that the problem is entirely dissolved. First, IIA has intuitive appeal: it ensures that the social choice between two alternatives is determined solely by how individuals rank those two, which is seen as a requirement of rationality and fairness (avoiding strategic manipulation by introducing new alternatives). Second, while rules like Borda count are possible without IIA, they come with their own drawbacks (e.g., susceptibility to strategic voting). Moreover, the fact that relaxing Pareto does not help highlights that the core of the impossibility lies in the combination of IIA and the other conditions. Thus, while rejecting IIA is one way out, it is not without costs, and the theorem remains a profound insight into the difficulties of collective decision-making.

   Marking Scheme (out of 20):

   Part (a): [12 marks]
   - Correct explanation of what becomes possible when dropping IIA: mention of Borda count (or another example) and that it satisfies UD, P, ND, transitivity, but not IIA. [4 marks]
   - Correct explanation of what happens when dropping Pareto: the oligarchy result, including the two conditions (joint decisiveness and individual veto) and the non-imposition proviso. [5 marks]
   - Clear comparison of the two scenarios, highlighting the asymmetry (rich possibilities vs. oligarchy). [3 marks]

   Part (b): [8 marks]
   - Diagnosis of why the asymmetry arises (e.g., IIA as a structural constraint vs. Pareto as a substantive one, or any other well-argued reason). [3 marks]
   - Engagement with the "just reject IIA" reaction: noting that it does open possibilities but also that IIA has appealing properties and that relaxing it introduces new issues. [3 marks]
   - Critical assessment: evaluating the claim and providing a balanced view. [2 marks]

   Additionally, reserve 2 marks (within part (a)) for the non-imposition proviso: 
     - 1 mark for mentioning that without non-imposition, an imposed rule would trivially satisfy the conditions (and thus the oligarchy result requires non-imposition to avoid that triviality).
     - 1 mark for explaining that non-imposition ensures the rule is responsive to preferences.

   However, we note that the non-imposition proviso is already required in the oligarchy part. We have allocated 5 marks for the oligarchy result including the proviso. We can break down the 5 marks as:
     - 3 marks for the oligarchy definition (joint decisiveness and individual veto) and the fact that it satisfies the conditions.
     - 1 mark for stating the non-imposition proviso.
     - 1 mark for explaining why it is needed (to avoid the imposed rule).

   Alternatively, we can leave the breakdown as above and note that the 2 marks for non-imposition are included in the 5 for the oligarchy part.

   Now, for the bands:

   First-class (typically 70+%, so 14-20 marks): 
     - Covers all parts of (a) and (b) thoroughly.
     - In (a): accurately describes both the Borda example and the oligarchy result (with non-imposition) and clearly compares them to show the asymmetry.
     - In (b): provides a clear and well-argued diagnosis of the asymmetry (e.g., structural vs. substantive) and engages seriously with the "just reject IIA" reaction by discussing both the potential of relaxing IIA and the reasons why one might be reluctant to do so (e.g., the normative appeal of IIA, or the trade-offs in alternative systems).

   Upper-second (typically 60-69%, so 12-13.9 marks):
     - Reproduces the corollary (oligarchy) and the Borda point accurately, but without the same level of insight in the comparison or the critical assessment.
     - May have a less developed diagnosis in (b) or a more superficial engagement with the reaction.

   Common mistakes:
     - Forgetting the non-imposition proviso in the oligarchy result (which would lead to an incorrect claim that without Pareto we get possibility, or not recognizing the imposed rule as a trivial case).
     - Confusing the oligarchy with a dictatorship (failing to note that an oligarchy has multiple members and the veto power).
     - Not providing a concrete example (like Borda) for the case without IIA.
     - In (b), simply dismissing the "just reject IIA" reaction without considering its merits or oversimplifying the trade-offs.

   Let's write the question and model answer accordingly.
answer: |-
  ### Exam Question  
  **Arrow's Impossibility Theorem highlights a tension between democratic values and procedural constraints. A popular response argues that relaxing the Independence of Irrelevant Alternatives (IIA) condition resolves the impossibility, as IIA is purportedly too demanding. However, relaxing the Pareto condition instead yields starkly different results.**  

  **(a)** Explain why dropping IIA (while retaining Unrestricted Domain, Pareto, Non-Dictatorship, and Transitivity) permits appealing voting systems like the Borda count, whereas dropping Pareto (while retaining IIA, Unrestricted Domain, Non-Dictatorship, and Transitivity, plus non-imposition) only allows for oligarchic rules. Include why non-imposition is essential to this comparison.  

  **(b)** Discuss why this asymmetry arises and evaluate the claim that Arrow’s theorem merely indicts IIA as implausible. Why might someone defend IIA despite this asymmetry?  

  ---

  ### Model Answer (≈600 words)  
  **(a)** Arrow’s theorem proves no social welfare function (SWF) satisfies Unrestricted Domain (UD), Pareto (P), Independence of Irrelevant Alternatives (IIA), Non-Dictatorship (ND), and Transitivity. Relaxing different conditions yields asymmetric outcomes.  

  Dropping IIA while retaining UD, P, ND, and Transitivity restores possibility. The Borda count exemplifies this: it assigns points to alternatives based on rank positions (e.g., 2 points for a top rank, 1 for second), sums points across voters, and ranks alternatives by total score. It satisfies UD (any preference profile is admissible), P (if all prefer *x* > *y*, *x* outscores *y*), ND (no single voter always determines the ranking), and Transitivity (scores induce a complete order). However, it violates IIA: adding a third alternative can reverse the relative ranking of *x* and *y* by altering their Borda scores. Thus, relaxing IIA enables coherent, non-dictatorial aggregation.  

  Conversely, dropping P while retaining IIA, UD, ND, Transitivity, and *non-imposition* (where the SWF is not "imposed," i.e., not fixed independently of voter preferences) leads only to oligarchy. An oligarchic SWF has a group *O* (the oligarchs) such that:  
  1. *Joint Decisiveness*: If all oligarchs strictly prefer *x* > *y*, society ranks *x* > *y*.  
  2. *Individual Veto*: If any oligarch strictly prefers *x* > *y*, society never ranks *y* > *x* (i.e., society is indifferent or prefers *x*).  

  This arises because Arrow’s proof relies on IIA to construct decisive coalitions. Without P, the set of all voters may not be decisive, but non-imposition ensures some coalition is decisive. IIA then forces the existence of a unique smallest decisive coalition (*O*), whose members gain veto power. Without non-imposition, an *imposed* SWF (e.g., always ranking *x* > *y* > *z*) would trivially satisfy IIA, UD, ND, and Transitivity but ignore all voter input. Non-imposition excludes this triviality, ensuring the SWF responds to preferences and exposing oligarchy as the only non-imposed option.  

  **(b)** The asymmetry stems from IIA’s role as a *structural* constraint, while P is *substantive*. IIA restricts an SWF to using only pairwise preference data when ranking any pair (*x*, *y*), ignoring other alternatives and preference intensities. This structural limitation amplifies the power of local agreements: IIA + UD + Transitivity (+ non-imposition) alone suffice to generate decisive coalitions, with P merely initiating the process by making the full set decisive. Relaxing IIA frees the SWF to use global data (e.g., Borda scores), enabling compromise. Relaxing P leaves IIA’s structural constraint intact, so power still concentrates in a group (*O*)—revealing that IIA is the primary engine of impossibility.  

  The claim that Arrow’s theorem "merely" shows IIA is implausible oversimplifies. While relaxing IIA enables popular rules like Borda, IIA defends against strategic voting and agenda manipulation. For example, IIA prevents spoiler effects (where adding a losing alternative sways the *x* vs. *y* outcome). Abandoning IIA thus risks real-world vulnerability to strategic nomination or misrepresentation of preferences. Conversely, relaxing Pareto—while theoretically possible—leads to oligarchy, which is normatively unacceptable in democracies. Hence, the asymmetry does not trivialize Arrow’s theorem but clarifies the trade-offs: rejecting IIA enables democracy at the cost of robustness, while rejecting Pareto invites elite control.  

  Ultimately, Arrow’s theorem exposes a core tension between information parsimony (IIA) and egalitarianism (ND). The asymmetry shows IIA is the linchpin, but its relaxation demands careful scrutiny of procedural costs.  

  ---

  ### Marking Scheme (Total: 20 marks)  
  #### Part (a) (12 marks)  
  - **Borda count explanation (3 marks)**:  
    - Describes Borda mechanics (points based on ranks, summation).  
    - Correctly states it satisfies UD, P, ND, Transitivity but violates IIA.  
  - **Oligarchy result (5 marks)**:  
    - Defines oligarchy: joint decisiveness + individual veto.  
    - Notes it arises under IIA, UD, ND, Transitivity, non-imposition.  
  - **Non-imposition proviso (2 marks)**:  
    - Identifies that without non-imposition, an imposed SWF trivially satisfies conditions.  
    - Explains why non-imposition is needed (to exclude trivial/irresponsive rules).  
  - **Asymmetry contrast (2 marks)**:  
    - Compares Borda’s democratic appeal vs. oligarchy’s restrictiveness.  

  #### Part (b) (8 marks)  
  - **Diagnosis of asymmetry (3 marks)**:  
    - Argues IIA is structural (restricts information) vs. P substantive (constrains outcomes).  
    - Notes IIA + non-P still forces concentration of power (via decisive sets).  
  - **Engagement with "reject IIA" reaction (3 marks)**:  
    - Concedes relaxing IIA enables possibility (e.g., Borda).  
    - Critiques IIA relaxation (e.g., vulnerability to strategy, loss of pairwise robustness).  
  - **Normative evaluation (2 marks)**:  
    - Contrasts the acceptability of relaxing IIA vs. the undesirability of oligarchy.  

  #### Band Descriptors  
  - **First-class (17–20)**:  
    - Covers all (a) and (b) elements with precision.  
    - Diagnoses asymmetry via IIA’s structural role (not just listing conditions).  
    - Critically engages "reject IIA" (e.g., "IIA’s relaxation trades possibility for strategic risks").  
    - **Common mistake**: Overlooking IIA’s strategic rationale in (b).  
  - **Upper-second (12–16)**:  
    - Accurately explains Borda and oligarchy (including non-imposition).  
    - States asymmetry but lacks depth on *why* (e.g., calls IIA "stronger" without structural analysis).  
    - Mentions "reject IIA" but superficially (e.g., "Borda works, so IIA is the problem").  
    - **Common mistake**: Omitting non-imposition or misdefining oligarchy (e.g., confusing it with dictatorship).  
  - **Lower-second (8–11)**:  
    - Partial recall of Borda/oligarchy but errors (e.g., Borda "fails Pareto"; oligarchy without veto).  
    - Ignores non-imposition or asymmetry diagnosis.  
  - **Pass (5–7)**:  
    - Basic knowledge (e.g., defines Arrow’s conditions) without focus on asymmetry.  
  - **Fail (0–4)**:  
    - Major inaccuracies (e.g., "dropping Pareto allows Borda").  

  #### Notes  
  - **Non-imposition**: Award 2 marks only if explicitly named *and* justified.  
  - **Originality**: Full credit for any coherent diagnosis (e.g., "IIA’s informational constraints drive impossibility").  
  - **Name-dropping**: No marks for uncited references.  

  ---  
  This question forces students to move beyond rote condition-listing, integrating logical proof (oligarchy), examples (Borda), and critical analysis (IIA’s trade-offs). The asymmetry diagnosis and non-imposition highlight deeper conceptual mastery.
