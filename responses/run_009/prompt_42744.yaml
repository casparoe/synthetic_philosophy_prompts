  I teach an upper-level seminar on the philosophy of artificial intelligence and I'm writing the take-home final. Please draft one essay question on the orthogonality thesis and instrumental convergence that students cannot answer by reciting the standard definitions and examples. The question should force them to engage with two complications they will not have seen in the assigned reading: first, self-limiting final goals — goals whose satisfaction terminates the agent's pursuit of them (for instance, an agent whose final goal is to hold a particular door open until the first person passes through, after which it has no further stake in anything); second, non-rival intermediate goods — resources such as information, coordination protocols, or copies of the agent itself that can be duplicated rather than fought over. The question should ask whether either the orthogonality thesis or instrumental convergence survives these complications as more than a contingent tendency, and it should require students to distinguish claims of logical compatibility between intelligence levels and goal contents from empirical generalizations about what agents with various goals will in fact pursue. Please write the question, a model answer of about 650 words, and a marking scheme built around five must-hit points worth 4 marks each (total 20), with a one-line note on how candidates typically get each point wrong.
