answer: |-
  ## The Sestina of the Unembedded Boo
  **(For the Shameless Sibling)**

  That slippery word escapes your tongue: a **wrong**
  Committed lightly, air dismissed with **if**?
  You tell the tall tale, then command your **brother**
  To swear it’s true. What sound escapes? A **boo**
  From me, instinctive. Surely this feels **same**
  As when your own untruths began, this **lying**?

  "But ponder," I insist, "this act of **lying**,
  This fabricating path you call not **wrong**.
  Admit the feeling – wouldn't you feel **same**
  Disgust if *I* did this? Consider **if**
  This act deserved not praise, but just a **boo**,
  Performed perhaps... by me, or by your **brother**?"

  You shrug, imagining your younger **brother**
  Caught weaving webs, pure artistry in **lying**.
  I press: "What judgement forms? Not cheers, a **boo**!
  You'd call his action plainly **wrong**,
  No hesitation. Hold that thought. Now, **if**
  His act *is* wrong, then mustn't yours feel **same**?"

  A flicker crosses thought. Is it the **same**,
  This judgement cast on you or on your **brother**?
  The logic coils. "Suppose the premise: **if**
  *My* speaking falsehoods counts as vicious **lying**
  (Admit you feel it, deep down – that’s the **wrong**
  I name!), then prompting him earns just a **boo**."

  But *can* an attitude, mere gust of **boo**,
  Persist inside this structure, hold its **same**
  Essential force, when lifted from the **wrong**
  Asserted plainly, grafted onto **brother**?
  The inference demands the seed of **lying**
  Remains intact, alive, within the **if**…

  For logic turns upon the pivot: **if**
  The premise harbors just a gust of **boo**,
  How does it anchor, locked against the **lying**,
  The inference that claims the feeling's **same**
  For both deceiver and deceived **brother**?
  Unless the meaning holds, the proven **wrong**

  Collapses. **Boo** conceived inside the **if**
  Must mean the **same** as when we damn the **brother**,
  Or **lying** stands condemned, yet proves no **wrong**.

  ---

  ### Mapping Form to Frege-Geach: A Note

  1.  **End-Word Roles:** `wrong` (moral predicate), `if` (embedding operator), `brother` (shifting moral patient), `boo` (emotive expression), `same` (semantic constancy demand), `lying` (core moral action). Each recurs, forced into new syntactic/semantic slots.
  2.  **Stanza 1:** Direct assertion: "`lying` is `wrong`" + expressed `boo`. `same` introduces the constancy problem casually.
  3.  **Stanza 2:** Embedding begins: `if` appears, embedding the moral claim (`wrong`) applied to `brother`. `boo` is recalled, not directly expressed.
  4.  **Stanza 3:** Further embedding under imagination ("imagine...") and negation ("not `wrong`?"). `brother` shifts grammatical role. `same` questions cross-contextual identity.
  5.  **Stanza 4:** Explicit modus ponens setup: `if` [P], then [Q]. `boo` is awkwardly forced into a premise role ("judgement forms... a `boo`").
  6.  **Stanza 5:** The core problem: How can `boo` (an attitude) function identically (`same`) inside the `if` as when asserted? `lying` becomes the abstracted act.
  7.  **Stanza 6:** The conclusion (`brother`'s act is `wrong`) drawn, but `boo` is now alienated ("conceived inside the `if`"). `same` is the failing requirement.
  8.  **Envoi:** Crystallization: Unless `boo` inside `if` means the `same` as asserted `boo`, the inference (`wrong` applied to `brother`'s `lying`) fails. The tension remains: `boo` cannot be *both* pure expression *and* a logically composable element (`same`). The final gesture ("must mean the same") points towards a solution (structured attitudes), but the poem structurally enforces the gap via the end-words' demanding recurrence. The form *is* the compositional demand.
