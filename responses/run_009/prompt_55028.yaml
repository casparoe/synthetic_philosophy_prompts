prompt: |-
  After rereading the Ant Fugue I've gotten tired of the yes-it-is / no-it-isn't about whether an ant colony can literally have beliefs. I want the spec before the theories: write out the desiderata any adequate account of colony-level cognition has to meet. Off the top of my head it should cover: what work colony-level states do that ant-level states can't do on their own (otherwise why posit them at all); where the level gets cut in a principled way — why the whole colony and not the half that ends up on my shoe, or the pile that sits on a log for a week; whether attributing beliefs to the colony is a realist claim or just bookkeeping; how it avoids smuggling intelligence back into individual ants, whose brains are miniscule; which colony behaviors count as the colony's cognition versus just the additive sum of ant behavior; and what it says about the fact that if you cut a colony in half you get two colonies, while cutting a brain gives you a worse brain, not two brains — is graceful degradation under damage a requirement or just a camp preference? For each desideratum give the case behind it, mark which are non-negotiable and which are negotiable, and flag any pair that can't be jointly satisfied — my hunch is the realist one and the level-cut one are in tension. Skip scoring existing views against the list, I just want the list.
reasoning: |-
  Okay, the user wants a clear set of desiderata for evaluating theories about colony-level cognition in ants. They're frustrated with the back-and-forth debates and want a solid foundation before diving into theories. Let me unpack their main points.

  First, they mentioned the functional necessity—why colony-level states are needed if individual ants can't achieve the same outcomes. That's crucial. Without this, there's no reason to posit higher-level cognition. Maybe emergent properties or complex coordination behaviors that aren't reducible to single ants.

  Next, principled boundaries. Why the whole colony and not subgroups? This ties into cohesion mechanisms like pheromone networks or shared resources. If a subgroup can't maintain colony functions independently, it shouldn't count. But temporary splits might complicate things, so cohesion over time matters.

  Then, realism vs. instrumentalism. Are colony beliefs real or just useful metaphors? The user suspects tension here with boundaries. If you're a realist, you need clear criteria for when a colony exists, which might conflict with fluid ant populations.

  Avoiding anthropomorphism is another key point. How to attribute cognition without implying individual ants are intelligent. Focus on distributed systems where no single ant has the big picture. Algorithms like swarm intelligence where simple rules lead to complex outcomes.

  Behavioral criteria: distinguishing true cognition from simple aggregation. Colony-level problem solving like optimizing foraging paths or responding collectively to threats would qualify. Need examples like adaptive responses to new obstacles.

  Graceful degradation vs. fission. When split, colonies can form two functional units, unlike brains. This might challenge strict cognition analogies. Accepting that systems can replicate or degrade differently could be negotiable—some systems might not need brain-like resilience.

  Now, identifying tensions. Realism and boundaries might clash because colonies aren't discrete. If colonies can merge or split, defining "one colony" gets fuzzy. Also, functional necessity and avoiding anthropomorphism: explaining complex behaviors without smart ants requires mechanisms like stigmergy.

  The user's deeper needs: a structured framework to cut through debates. They want clarity on what any theory must address, highlighting where compromises are possible. They might be preparing to evaluate theories or propose their own. Ensuring the list is comprehensive but flexible, marking negotiable points to guide future discussions.
answer: |-
  Here is a structured list of desiderata for any adequate account of colony-level cognition, derived from your points. Each includes its rationale, negotiability status, and flagged tensions:

  ### Desiderata for Colony-Level Cognition

  1.  **Functional Necessity / Emergence:**
      *   **Desideratum:** The account must specify what colony-level states or processes *do* that cannot be adequately explained, predicted, or described solely by the states and interactions of individual ants. What problem-solving, adaptive advantage, or functional capacity emerges at the colony level?
      *   **Case:** Examples include collective decision-making (e.g., nest site selection), distributed problem-solving (e.g., optimizing foraging trails), resilience to individual failure, or achieving goals beyond any single ant's capability (e.g., thermoregulation, large-scale defense). Without this, colony-level cognition is superfluous.
      *   **Status:** **Non-Negotiable** (Otherwise, the concept is explanatorily empty).

  2.  **Principled Boundaries:**
      *   **Desideratum:** The account must provide a *principled basis* for identifying *which* collection of ants constitutes "the colony" as a cognitive unit. This must distinguish a functioning colony from arbitrary sub-groups (like half on a shoe) or mere aggregates (like ants on a log).
      *   **Case:** Why is the whole colony the cognitive unit, but a foraging party isn't? What defines membership? Cohesion mechanisms (pheromones, trophallaxis), shared resource flow (brood, food stores), coordinated defense, collective reproduction, and persistence of organization over time are key factors. A pile of ants lacks these.
      *   **Status:** **Non-Negotiable** (Without boundaries, the concept is ill-defined).
      *   **Tension Flag:** ✅ Potentially strong tension with **Realism** (see #3) and **Fission/Degradation** (see #6). Defining a crisp boundary for a continuously changing, potentially merging/splitting entity is hard for realism. Fission directly challenges fixed boundaries.

  3.  **Ontological Commitment (Realism vs. Instrumentalism):**
      *   **Desideratum:** The account must explicitly state whether attributing cognitive states (like beliefs) to the colony is a *realist claim* (the colony genuinely possesses cognitive properties not reducible to individual ants) or merely an *instrumentalist* tool (a useful fiction for prediction/description, but ultimately reducible).
      *   **Case:** Is the colony truly "thinking," or are we just using cognitive language as shorthand for complex ant interactions? Realism requires showing emergent cognitive properties; instrumentalism avoids ontological inflation but may feel unsatisfying.
      *   **Status:** **Explicit Requirement** (Must be addressed clearly). The specific stance (Realist/Instrumentalist) may be **Negotiable** depending on the theory, but the *commitment* must be stated.
      *   **Tension Flag:** ✅ Strong tension with **Principled Boundaries** (#2) and potentially **Avoiding Anthropomorphism** (#4). Crisp realism requires crisp boundaries. Avoiding smuggling intelligence down may be easier for instrumentalism.

  4.  **Avoiding Anthropomorphism / Downward Smuggling:**
      *   **Desideratum:** The account must *not* implicitly attribute sophisticated cognitive capacities (reasoning, complex representation, planning) to individual ants as a necessary consequence of attributing cognition to the colony. Colony-level cognition must arise from interactions of components with *minimal* individual cognitive requirements.
      *   **Case:** Individual ant brains are tiny and behavior is largely reactive/stimulus-driven. The colony's "intelligence" must emerge from simple rules (e.g., pheromone following, thresholds, basic responses) and interaction dynamics, not require smart individual ants.
      *   **Status:** **Non-Negotiable** (Violating this makes the account biologically implausible and fails the core challenge).

  5.  **Behavioral Criteria for Cognition:**
      *   **Desideratum:** The account must specify what *types* of colony-level behaviors constitute evidence for cognition (vs. mere aggregation or summation). This should focus on flexibility, adaptability, problem-solving, learning, or goal-directedness *at the colony level*.
      *   **Case:** What distinguishes "cognition" from just the sum of ant behaviors? Examples: Adapting foraging strategy to new food sources/obstacles, collective learning (e.g., avoiding harmful paths), error correction in decision-making, achieving complex goals (nest building) robustly under varying conditions.
      *   **Status:** **Non-Negotiable** (Need criteria to identify the phenomenon).

  6.  **Fission vs. Degradation (Graceful Degradation):**
      *   **Desideratum:** The account must address the phenomenon of colony fission (one colony splitting into two functional colonies) and contrast it with the degradation observed when a brain is damaged. It must clarify whether "graceful degradation" (like brain damage) is a requirement for cognition or if systems that replicate/divide (like colonies or cells) represent a different paradigm.
      *   **Case:** Splitting a colony often results in two functional units exhibiting colony-level behaviors. Splitting a brain destroys its function. Is the ability to *replicate* the functional unit (fission) compatible with "cognition," or does cognition *require* a system that degrades rather than replicates when damaged? Or is graceful degradation simply a feature of *some* cognitive systems (brains) but not others (colonies)?
      *   **Status:** **Negotiable** (Whether graceful degradation is *required* is debatable). The account must explicitly *address* the difference.
      *   **Tension Flag:** ✅ Potential tension with **Principled Boundaries** (#2) and analogies to individual brains. Fission fundamentally challenges fixed boundaries and brain-like models.

  ### Summary of Flagged Tensions

  *   **Principled Boundaries (#2) vs. Realism (#3):** Defining a crisp, real cognitive entity is difficult for a fluid, potentially splitting/merging system like a colony.
  *   **Principled Boundaries (#2) vs. Fission/Degradation (#6):** Fission directly challenges the idea of a single, persistent cognitive unit with fixed boundaries.
  *   **Realism (#3) vs. Avoiding Anthropomorphism (#4):** Strong realism might risk implying more sophistication at the individual level than is plausible, or struggle to show true emergence without it. Instrumentalism avoids this but may feel less robust.
  *   **(Implicit) Principled Boundaries/Realism vs. Fission:** Fission poses a major challenge to viewing the colony as a single, unified cognitive *subject* analogous to an individual.

  This list provides the foundational "spec" you requested, focusing on the core conceptual challenges any theory of colony-level cognition must confront, highlighting where compromises might be possible and where fundamental tensions exist.
