answer: |-
  Your description captures a **profound and under-discussed social dilemma** that sits at the intersection of game theory, social psychology, and organizational design. While it shares features with several established concepts, no single term perfectly encompasses the *full* dynamic you've outlined—especially the combination of **irreversibility, private dissent, and the perverse effect of group size increasing the likelihood of the harmful action**. Let's break this down:

  ### Core Dynamics & Why Existing Terms Fall Short
  1.  **Structural Core = Volunteer's Dilemma (VD) Variant:**
      *   **Yes, this is fundamentally a Volunteer's Dilemma.** In the classic VD (Diekmann, 1985), N players face a situation where *one* "volunteer" must incur a cost to provide a collective benefit (e.g., calling the police). Each player prefers someone *else* volunteers (free-riding). The equilibrium often involves a positive probability that *no one* volunteers (collective failure).
      *   **Your case is the *Inverse* or *Negative* Volunteer's Dilemma:** Here, the "volunteer" action (publishing, banning, naming) *harms* the collective (e.g., reputational damage, loss of leverage, escalation). Each player prefers that *no one* volunteers (acts). The equilibrium involves a positive probability that *someone* will act (collective harm). The payoff matrix is symmetrically inverted.
      *   **Why "VD" feels incomplete:** The classic framing emphasizes failure to provide a *good* (inaction causing loss). Your case emphasizes failure to *prevent a bad* (action causing harm). The "volunteering" metaphor also feels odd when the action is harmful. Crucially, VD often doesn't explicitly emphasize the **irreversibility** or the **epistemic component** (everyone privately agrees it's bad).

  2.  **Epistemic Component = Pluralistic Ignorance (PI) + Shared Responsibility:**
      *   **Pluralistic Ignorance:** Everyone privately believes acting is wrong but (incorrectly) assumes others believe it might be acceptable/necessary ("Someone else must have had a reason to ban"). This creates false social proof.
      *   **Shared Responsibility Diffusion:** The knowledge that *anyone* can act diffuses individual responsibility ("My restraint won't matter if someone else does it"). This is the "mirror" of the Bystander Effect, where diffusion *reduces* helpful action. Here, diffusion *increases* harmful action. **"Diffusion of Provocation"** could be a descriptive sub-term.
      *   **Why PI isn't enough:** PI explains the *misperception*, but not the *structural incentive* tied to group size and the single-action trigger inherent in the VD structure.

  3.  **Group Size Effect:**
      *   As N (number of potential actors) increases:
          *   The probability that *at least one* person has a lapse in judgment, misreads the situation, or acts impulsively increases.
          *   The perceived efficacy of *individual* restraint decreases ("Surely someone else will do it anyway?").
          *   The perceived *personal cost* of being the "last one to act" (e.g., missing the scoop, being seen as unvigilant) might subtly increase for some, further distorting incentives.
      *   This is the stark inversion of the Bystander Effect, where increased N *reduces* the likelihood of intervention.

  ### The Best Fit: Established Term + Nuance
  *   **The closest established term is the *Volunteer's Dilemma*,** specifically an **Inverse (or Negative) Volunteer's Dilemma under conditions of Pluralistic Ignorance.** Game theorists would recognize the structural equivalence by simply inverting the payoffs. Adding "Inverse" explicitly signals the harmful nature of the "volunteer" action.

  ### Coining a New Term: For Precision
  Given the lack of a perfect term capturing *all* elements (VD structure + irreversibility + epistemic PI + group size effect), a precise coined term could be:

  *   **The Collective Action Trigger (CAT) Dilemma:**
      *   **Definition:** A social dilemma where:
          1.  An irreversible, harmful action can be taken by *any single member* of a group.
          2.  All members *privately believe* the action is undesirable/mistaken.
          3.  Each member perceives their *own restraint* as ineffective in preventing the harm, since any other member can trigger it.
          4.  This structure, combined with pluralistic ignorance regarding others' true judgments, leads to a situation where the *probability of the harmful action occurring increases with the size of the group*.
      *   **Key Features:** Irreversibility, Single-Actor Sufficiency, Private Dissent, Perceived Futility of Individual Restraint, Group Size Amplification, Epistemic Uncertainty (PI).
      *   **Boundaries:**
          *   **Firing Squad (Shared Responsibility):** *Not* a pure CAT. The harm requires *coordinated* action (multiple shooters). An individual shooter *cannot* cause the harm alone against orders. Shared responsibility diffuses *guilt*, but doesn't create the "any single actor can trigger it" dynamic. (It's closer to a coordination game with moral hazard).
          *   **Tragedy of the Commons:** Involves *cumulative* harm from many individuals acting independently for personal gain. CAT involves a *single, discrete, irreversible* harmful action by *any one* actor.
          *   **Race Conditions/First-Mover Advantage:** CAT can *involve* a race (e.g., researchers publishing first), but the core harm is triggered by the *first* action, not necessarily the *race* itself. The motive isn't always personal gain over others; it can be error, misjudgment, or perceived duty.
          *   **Chilling Effects:** CAT can *create* chilling effects (e.g., admins afraid to discuss bans), but it's distinct.

  ### Do the Fixes Work? Relocating vs. Solving the Epistemic Problem
  1.  **k-of-n Consensus (e.g., 2 admins must agree to ban):**
      *   **Structural Fix:** Significantly reduces the probability of the harmful action occurring purely due to an individual lapse. The larger k is, the lower the probability.
      *   **Epistemic Relocation:** *Does not solve* the core epistemic problem (private dissent + PI). It simply raises the threshold. The group can *still* suffer PI – everyone might privately think a ban is bad, but assume *others* see a reason, leading them to approve it. The "perceived futility" shifts: "My 'No' vote won't matter if k-1 others vote 'Yes' anyway." The group size effect is mitigated but not eliminated; more actors still mean more potential "yes" votes. Requires careful choice of k.
  2.  **Designated Decider:**
      *   **Structural Fix:** Eliminates the "any single actor" trigger point. Only one person *can* act.
      *   **Epistemic Relocation:** *Intensifies* the epistemic problem onto one person. They now face immense pressure, potential isolation, and the full burden of the decision. Pluralistic ignorance is replaced by potential isolation error or pressure to conform to *perceived* group expectations they can't easily verify. Requires high trust and competence in the decider. *Reduces* the group size effect dramatically (only one actor matters).
  3.  **Transparency & Deliberation:**
      *   **Epistemic Fix (Potential):** Open discussion *before* action can shatter pluralistic ignorance ("Wait, *all* of you think this exploit disclosure is premature too?"). This addresses the core epistemic failure.
      *   **Limitations:** May not be feasible (time pressure, sensitive info). Can lead to groupthink if dissent isn't truly welcomed. Doesn't change the structural trigger; it just makes coordinated *inaction* more likely. Requires strong psychological safety norms.

  ### In Summary
  *   **Established Term (Best Fit): Inverse Volunteer's Dilemma.** This accurately describes the game-theoretic structure.
  *   **Coined Term (For Full Nuance): Collective Action Trigger (CAT) Dilemma.** Captures the irreversible harm, single-actor trigger, private dissent, perceived futility, and group size amplification.
  *   **Epistemic Core:** Pluralistic Ignorance combined with the diffusion of responsibility inherent in the single-actor-trigger structure is essential to the dynamic.
  *   **Fixes:** k-of-n and Designated Decider primarily fix the *structural* vulnerability by reducing the number of trigger points or raising the threshold. They *relocate* but do not inherently solve the epistemic problem (private dissent + misperception). Transparency and deliberation are needed to *address* the epistemic core but have their own challenges. The optimal solution often involves combining structural constraints (k-of-n) with cultural ones (transparency, psychological safety).

  This pattern is indeed pervasive and insidious, explaining failures in security, moderation, whistleblowing, diplomacy, and organizational governance. Recognizing it as a distinct, namable phenomenon (whether Inverse VD or CAT) is the first step towards designing better safeguards.
