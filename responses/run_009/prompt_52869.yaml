prompt: |-
  My friend Elena and I have argued for years about what individuals owe in collective harms, and I've started writing up her views as a case study for a practical ethics seminar I help teach. Her track record so far: she votes in every national election and is openly contemptuous of friends who don't, even though she cheerfully concedes that any single ballot in our district is almost certainly causally idle. She went vegetarian after concluding animal agriculture is a moral catastrophe, and when her brother told her one person's groceries won't change production by even a single animal, she said the point was irrelevant and hasn't wavered since. She buys her phones and laptops from a manufacturer with well-documented labor abuses in its supply chain, and says she'd feel no guilt even if the abuses were twice as bad, because her abstention would accomplish literally nothing. She flies to two or three work conferences a year and pays for carbon offsets every time, calling it the least she can do — though she has never once suggested giving up the flights. And when someone told her that her recurring donation to a large anti-malaria fund is a drop in the ocean, she replied that drops count.

  Now her cousin has announced a destination wedding on another continent, and I want to predict her verdict before she announces it, as a test of whether I actually understand her position. The flight would emit several tonnes of CO2, a large fraction of her annual footprint under any responsible budget, and she can buy an offset for about a sixth of the ticket price. The rehearsal dinner is a plated beef dinner for the full guest list: the caterer has locked in the count, so her portion will be produced and then eaten or discarded whether or not she touches it, and nobody will notice either way. So there are two verdicts to predict — the flight (does she fly, and if so does she buy the offset, or does she decline the invitation?) and the dinner (does she eat the beef or quietly decline it?).

  I'm less interested in the answers than in the rule she seems to be running. As far as I can tell, several principles fit her record equally well: a pivotal-chance view on which an individual's act matters only when it might be decisive; a smooth expected-marginal-harm view on which tiny contributions generate proportionally tiny reasons; and a clean-hands view on which one refuses participation in serious harms regardless of efficacy. Note that some of these fit only given assumptions about how she weighs the underlying harms — animals seem to register with her differently than the factory workers do, and I don't know whether that reflects severity or something else. Please tell me which rules genuinely fit the record, what each predicts for the wedding, your best guess with your reasons, and, if two rules survive, the single further case outside the wedding that would best discriminate between them. End with a line in the form \answer{[flight]: fly-with-offset | fly-without-offset | stay-home; [dinner]: eat | refuse} and nothing after it.
reasoning: |-
  Hmm, the user is presenting an ethical puzzle about their friend Elena's behavior regarding collective harms. They've described several examples of how Elena approaches moral decisions where individual actions seem insignificant but are part of larger harmful systems. Now they want to predict how Elena will handle two specific decisions about a destination wedding - whether to fly (and offset) and whether to eat beef at the dinner.

  The key is to identify the consistent principle behind Elena's seemingly contradictory positions. From the examples: she votes despite knowing her individual vote won't swing an election, she's vegetarian because animal agriculture is a moral catastrophe regardless of individual impact, but she buys electronics from unethical manufacturers because her abstention wouldn't change anything. She flies but buys carbon offsets, and defends charitable donations as "drops counting."

  Several ethical frameworks could explain this:
  - Pivotal chance: acting only if your action could be decisive
  - Expected marginal harm: calculating tiny probabilities of making a difference
  - Clean hands: avoiding participation in perceived wrongdoing regardless of impact

  Looking at the patterns: She rejects arguments about individual impact when it comes to voting and vegetarianism ("point was irrelevant"), but accepts it for electronics ("accomplish literally nothing"). The clean-hands principle seems strongest here - she avoids participation when she views the system as intrinsically wrong (voting, meat-eating), but participates when she doesn't feel complicit (electronics), while using offsets/donations as gestures to mitigate harm without changing behavior.

  For the wedding prediction:
  - Flight: She'll likely fly with offset, as with work conferences
  - Dinner: She'll refuse the beef, similar to her vegetarian stance, even though the meal is already paid for

  The clearest discriminator would be a case where individual action has high pivotal chance but the harm is one she doesn't intrinsically object to - like whether she'd cross a picket line if she knew her action would break the strike.

  Final answer based on clean-hands principle with selective participation.
answer: |-
  Based on Elena's track record, two ethical rules fit her behavior consistently: a **clean-hands view** and a **selective participation view** (a hybrid of clean-hands and expected-marginal-harm, applied inconsistently based on perceived harm severity).  

  ### Rules That Fit the Record:  
  1. **Clean-hands view**: She refuses participation in acts she deems intrinsically wrongful or complicit in harm, regardless of individual impact. This explains:  
     - Voting (duty to participate in democracy).  
     - Vegetarianism (refusing complicity in animal suffering).  
     - Refusing beef at the wedding dinner (non-participation in harm).  
     - *But not* her electronics purchases or flights, which violate strict clean-hands.  

  2. **Selective participation view**: She combines clean-hands for "symbolic" or "identity-defining" harms (voting, meat-eating) with expected-marginal-harm reasoning for other harms (electronics, flights with offsets). Severity matters:  
     - Animal suffering/climate change are "catastrophic" (motivating offsets/donations as moral gestures).  
     - Labor abuses are not severe *enough* to trigger clean-hands (abstention "accomplishes nothing").  
     - Offsets/donations are "drops in the ocean" but absolve participation guilt.  

  **Rules eliminated**:  
  - **Pivotal-chance view**: Contradicted by voting (non-pivotal) and vegetarianism (her brother's argument dismissed).  
  - **Smooth expected-marginal-harm view**: Contradicted by vegetarianism (she ignores marginal impact) and electronics (she dismisses efficacy).  

  ### Predictions for the Wedding:  
  - **Flight**: **Fly-with-offset**.  
    - *Why*: Parallels work conferences—she flies but offsets as a guilt-mitigating gesture ("least she can do"). The offset cost is trivial, and she sees no duty to abstain if harm is offset.  
  - **Dinner**: **Refuse**.  
    - *Why*: Mirrors vegetarianism—she won’t participate in eating beef, viewing it as complicity in a "moral catastrophe," even if her refusal changes nothing.  

  **Best Guess**: Selective participation view. She distinguishes between harms: animal suffering/climate evoke symbolic non-participation or offsets, while labor abuses do not. For the wedding:  
  - Flight causes climate harm, but offsets allow participation.  
  - Beef is direct complicity in animal suffering, triggering refusal.  

  ### Discriminating Case (if needed):  
  If both views seem plausible, test **participation in a boycott with high pivotal chance**.  
  - *Scenario*: A strike at her electronics supplier’s factory. If she crosses the picket line, the strike fails (pivotal chance ~100%); if she boycotts, it succeeds.  
  - *Prediction differences*:  
    - **Clean-hands**: Boycotts regardless (non-participation in labor abuse).  
    - **Selective participation**: Crosses the picket line (labor abuses aren’t severe enough to trigger action; "accomplishes nothing" mindset).  

  \answer{[flight]: fly-with-offset; [dinner]: refuse}
