  ## MEMORANDUM: Amnesty Application - Former Security Officer (Case File: EO-7B)

  **To:** Amnesty Committee Members  
  **From:** [Your Name]  
  **Date:** 18 October 2023  
  **Subject:** Recommendation on Application EO-7B & Critical Examination of "Full Disclosure" Framing  

  **1. Core Dilemma & Stakes:**  
  Officer EO-7B possesses uniquely critical information – likely locations for three mass graves and potential access to the fourth – essential for answering families' most fundamental question: *What happened to their loved ones?* However, his testimony systematically minimizes personal responsibility, portraying himself solely as a conduit for orders, absent during violence, and denying direct involvement attested to by a survivor. The committee is rightly divided:  
  *   **Objection:** Granting amnesty based on this narrative fatally undermines "full disclosure" by accepting self-exculpation, effectively endorsing a sanitized history and violating the enabling act's core requirement of admitting *personal* responsibility.  
  *   **Concern:** Refusal risks losing the fourth grave location permanently and likely results in a failed prosecution (due to evidentiary gaps), denying families *both* truth (via burial) *and* judicial accountability.  

  **2. Interrogating Our Framing ("Graves vs. Justice"):**  
  **The core framing IS muddled and requires sharpening:**  
  *   **"Full Disclosure" as Applied:** Our interpretation (truthful facts, names, locations, *plus* honest admission of personal responsibility) is legally sound and morally necessary. However, **this case exposes a tension within the concept itself when applied to high-level facilitators.** Does "full disclosure" demand *only* factual accuracy enabling truth recovery (graves, chains of command), or *also* a moral accounting of one's own role within that system? The enabling act ("degree of responsibility") and our practice clearly require the latter. EO-7B fails the latter test.  
  *   **False Dichotomy ("Graves vs. Justice"):** Framing this as a trade-off oversimplifies. Refusing amnesty doesn't *guarantee* justice (trial may fail), nor does granting it *guarantee* graves (he might not know/deliver the 4th). More critically:  
      *   **"Justice" is multi-faceted.** For many families, *knowing* and *recovering remains* is a profound form of justice – truth itself is reparative. A failed trial delivers *neither* truth nor punishment.  
      *   **The Real Trade-off:** **Integrity of the Amnesty Standard vs. Maximizing Truth Recovery.** Granting amnesty despite minimization sacrifices the former for a *chance* at the latter. Our mandate requires upholding the standard.  

  **3. Serious Engagement with Minimization:**  
  EO-7B's narrative is indeed "textbook minimization" and fails "full disclosure":  
  *   **Structural Evasion:** Relaying orders without context or personal agency ignores the reality of command responsibility within a detention facility. His role *enabled* abuses, regardless of direct perpetration.  
  *   **Implausible Denial:** The specific denial contradicted by a surviving witness demonstrates a deliberate refusal to acknowledge verifiable facts about his presence and potential complicity (even if passive).  
  *   **Defeating the Purpose:** Accepting this narrative allows him to escape *all* personal reckoning. It tells other perpetrators minimization works, undermining the entire amnesty process's credibility and its goal of establishing an authoritative, *unvarnished* record. Granting amnesty here *would* effectively certify his sanitized version.

  **4. Recommendation: Conditional Refusal with Final Opportunity & Prosecutorial Coordination**  

  *   **Recommendation: REFUSE amnesty at this time, based on failure to meet the "full disclosure" requirement regarding personal responsibility.**  

  *   **Conditional Pathway (Simultaneous Steps):**  
      1.  **Offer One Final Closed Session:** Inform EO-7B *immediately* that his application is set for refusal due to insufficient disclosure of personal responsibility. Offer a single, strictly time-bound (e.g., 48 hours) closed session *before* our final vote.  
      2.  **Clear Ultimatum:** State unequivocally that amnesty *requires* him to:  
          *   Provide the specific location of the fourth mass grave (if known, or best available information enabling recovery).  
          *   Revise his testimony to provide a full and honest account of his *own* role, decisions, awareness, and level of responsibility regarding the acts occurring under his command/in his facility. This includes addressing the specific incident attested to by the survivor. Minimalism is unacceptable.  
          *   Understand that any new information provided will be verified and any falsehoods will definitively void his application and be referred to prosecutors.  
      3.  **Coordinate with Prosecutors (NOW):** Concurrently, initiate confidential liaison with the Prosecutor's Office. Share:  
          *   The existence and critical importance of the grave information.  
          *   The *specific deficiencies* in his testimony regarding personal responsibility.  
          *   Our impending decision timeline and the conditional offer.  
          *   **Goal:** Ensure prosecutors are prepared to potentially use his grave information (if provided, even if amnesty is refused) and understand the evidentiary weaknesses *we* have identified regarding his personal culpability. This maximizes the *chance* his information aids recovery *regardless* of the amnesty outcome and informs prosecutorial strategy.  

  **5. Reasoning:**  

  *   **Upholds the Mandate:** This recommendation prioritizes the integrity of the "full disclosure" standard, which is non-negotiable for legitimate amnesty. We cannot grant based on incomplete and self-serving testimony.  
  *   **Maximizes Truth Recovery Potential:** It creates a final, high-pressure opportunity for EO-7B to provide the grave location *and* meet the standard. The prosecutorial coordination ensures the grave information isn't necessarily lost if he refuses.  
  *   **Addresses Practical Realities:** Acknowledges the probable failure of a prosecution focused *solely* on his direct perpetration by proactively sharing our assessment with prosecutors. They may focus on other charges (e.g., command responsibility, obstruction based on false testimony) or leverage the information for other cases.  
  *   **Maintains Commission Integrity:** Avoids the catastrophic precedent of granting amnesty based on minimization. It demonstrates that critical information, while valuable, does not trump the legal and ethical requirements of the process.  
  *   **Clarity & Finality:** Provides a definitive path: comply fully and get amnesty, or face refusal and criminal process, with the grave information potentially still entering the legal domain via prosecutors.  

  **6. Key Considerations for Thursday's Discussion:**  

  1.  **Is the "final session" realistic or merely procedural?** Are we convinced he *can* provide the 4th grave location? Is genuine contrition/truthfulness about his role even possible now?  
  2.  **Prosecutorial Realism:** How confident are we that prosecutors can/will act effectively on the grave information and our assessment, even without amnesty?  
  3.  **The Survivor Witness:** Does the specific, corroborated denial regarding his presence outweigh the value of the grave information in assessing "full disclosure"?  
  4.  **Precedent:** Does refusing EO-7B, despite his unique information, strengthen the amnesty process's credibility in the long term, or does it represent a failure to recover vital truth?  

  **Conclusion:**  
  The gravity of losing the fourth grave location is immense. However, sacrificing the "full disclosure" standard – particularly the requirement for honesty about personal responsibility – to secure it fundamentally corrupts the amnesty process and the commission's legacy. Our recommendation seeks to uphold the standard while exhausting every avenue to recover the truth. It forces EO-7B to choose: provide *everything* required for amnesty, or face the consequences, knowing his information may still aid the families via other means. I recommend we adopt this position.  

  **Ready for robust discussion on Thursday.**
