prompt: |-
  I am a sixth-form student writing an extended essay, and I have become convinced by the Libet experiments that my conscious mind does not really make decisions: the readiness potential shows up in the brain several hundred milliseconds before I feel the urge to move, so what I experience as choosing seems to be just my brain announcing a decision it has already taken. I would like to know what would count against this view. Please set out the observations, arguments, and later findings that should make me doubt it — for instance, I have read that some researchers now think the readiness potential may be something more like background noise that occasionally builds up until a movement is triggered, rather than the decision itself unfolding, and I do not know how much damage that does. Which of these defeaters would defenders of the view themselves concede as counting against it, and which would they dismiss? Rank them from fatal to merely awkward, and tell me honestly whether the view has been qualified over the years into something that could never be refuted, and whether that is a problem for a claim of this kind. Throughout, please state how confident you are in what you claim, single out the point you are least sure of, and write in British English.
