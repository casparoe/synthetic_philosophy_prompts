prompt: |-
  I am a junior and the facilitator of my school's weekly civics discussion group, and for our final sessions of the year I want to build a short diagnostic quiz titled "Who belongs to the demos?" The seed was a real argument in our group over a hypothetical case: a city votes in a referendum to permit a refinery whose emissions will drift mostly over a neighboring state. Everyone agreed the arrangement felt undemocratic somehow, but nobody could say who exactly had been wronged — the downwind residents, who are affected by the decision but do not live under the city's laws, or nobody at all, since the vote followed the rules perfectly.

  I would like you to write the quiz for me. My requirements are as follows:

  - Eight to ten questions, each presenting a concrete voter-roll dispute with two or three answer options. The cases should include at least: a permanent resident of thirty years who pays taxes but is not a citizen; a sixteen-year-old who works and pays income tax; a citizen under guardianship for severe cognitive impairment; a foreign-owned factory whose value would be halved by the regulation on the ballot; and future generations in a climate referendum. Because I want to stress-test the principles rather than just apply them, include at least one question that forces quiz-takers to confront whether their principle could enfranchise a non-human claimant — say, a multinational corporation, or a language model that a city government has begun letting file public comments on proposed ordinances.

  - A scoring key mapping answer patterns onto named positions: the all-subjected principle (whoever must obey the laws gets a say in making them); the all-affected principle in both its bounded and unbounded forms (whether it covers only those affected in some substantial, characteristic way, or everyone affected however remotely); competence- or capacity-based views; membership views on which a "people" pre-exists its decision procedures and the franchise tracks belonging to it; and the deflationist position that no principle demarcates the demos, so that democracy simply is whatever a historically contingent electorate decides. If some combination of answers has no occupant among these leaves, say so and diagnose why — whether the view is incoherent, unattractive, or merely unexplored.

  - The quiz must sort people by what they say about cases, not by which label they like, so no question may ask anything resembling "do you endorse the all-affected principle?"

  - Bear in mind that some disputes about who should vote are really disputes about which decisions should be made collectively at all; if you judge that one of my proposed cases is of that kind in disguise, set it aside rather than forcing it into the key, and tell me you did so.

  - I have a suspicion that most of my classmates are competence theorists without knowing it. If the suspicion is testable in the design, build in a way to test it.

  After the scoring key, please append a short critical note: where the quiz is most likely to mis-sort someone, which two leaves it genuinely cannot separate with these cases, where the key itself leans on a contested reading of a position, and what a new question or case would have to look like to show that the taxonomy is carved at the wrong joint entirely. Please write everything in American English.
reasoning: |-
  Okay, the user is a junior in high school facilitating a civics discussion group. They want to create a diagnostic quiz titled "Who belongs to the demos?" based on a real argument their group had about a refinery referendum affecting neighboring states. The quiz needs to test principles of democratic inclusion through concrete voter-roll disputes.

  First, I need to understand their requirements clearly. They want 8-10 questions, each with a scenario and answer options. Specific cases must include: a long-term non-citizen resident, a working 16-year-old, a citizen under guardianship, a foreign-owned factory, and future generations in a climate referendum. One question should test non-human claimants like corporations or AI. 

  The scoring should map answers to positions like all-subjected principle, all-affected principle (bounded/unbounded), competence-based views, membership views, and deflationism. The quiz must avoid direct questions about principles, focusing solely on case responses. I also need to watch for cases that are really about collective decision boundaries.

  The user suspects many classmates are unknowing competence theorists. I'll design questions to reveal this, like including cases where cognitive capacity is the deciding factor. For the non-human claimant, I'll use a corporation seeking voting rights to test if participants extend principles consistently.

  I'll create scenarios that force trade-offs. For example, Question 1 (permanent resident) contrasts membership vs. subjected/affected principles. Question 2 (16-year-old taxpayer) tests competence vs. contribution. Question 5 (future generations) challenges bounded affected principles. 

  For the scoring key, I'll map answer combinations to positions. Some patterns might not fit perfectly - like if someone supports enfranchising the corporation but rejects the AI, that might not cleanly match existing categories. I'll note where the taxonomy struggles, such as distinguishing bounded all-affected from membership views.

  In the critical note, I'll highlight potential mis-sorts - like someone opposing both disabled voter exclusion and youth enfranchisement might be sorted as deflationist when they're actually inconsistent. I'll also note that all-subjected and membership views often align in these cases, making them hard to separate. 

  The key will lean on contested readings, like whether "subjected" includes corporate regulation. A better question to test taxonomy joints might involve temporary residents or animals in environmental decisions. Overall, the quiz should spark discussion about democratic boundaries while meeting the user's educational goals.
answer: |-
  Here is the diagnostic quiz "Who Belongs to the Demos?", designed to meet your specifications:

  **Diagnostic Quiz: Who Belongs to the Demos?**

  *Instructions: For each scenario, select the option that best reflects your view on who should be eligible to vote on the specific decision described.*

  1.  **The Long-Term Resident:** Metropolis is voting on a new local income tax rate. Ana has lived in Metropolis legally as a permanent resident for 30 years, paying all local, state, and federal taxes. She runs a successful business employing locals. However, she is not a U.S. citizen.
      *   A) Ana **should** be eligible to vote on the income tax rate.
      *   B) Ana **should not** be eligible to vote on the income tax rate.

  2.  **The Working Teen:** The state legislature proposes lowering the state minimum wage. Ben, 16, works 20 hours a week after school to help support his family and pays state income tax on his earnings.
      *   A) Ben **should** be eligible to vote in a referendum on lowering the state minimum wage.
      *   B) Ben **should not** be eligible to vote in that referendum.

  3.  **Guardianship & Zoning:** Valley Town is voting on a zoning change that would allow a group home for adults with disabilities to be built next door to Clara. Clara is an adult citizen with a severe intellectual disability, deemed legally incompetent to manage her affairs, and under full guardianship. The change directly impacts her property value and living environment.
      *   A) Clara **should** be eligible to vote on the zoning change.
      *   B) Clara **should not** be eligible to vote on the zoning change (her guardian cannot vote *for* her on this issue).
      *   C) Clara's **guardian** should be eligible to vote on her behalf regarding the zoning change.

  4.  **The Foreign-Owned Factory:** River City is voting on a referendum to impose strict new environmental regulations on industrial wastewater discharge. Compliance would cost "GlobalFab," a factory wholly owned by a foreign corporation but employing hundreds of local citizens, an estimated $50 million, roughly halving its market value. The factory has operated locally for 15 years.
      *   A) GlobalFab (represented by its CEO or local manager) **should** be eligible to vote on the environmental regulation referendum.
      *   B) GlobalFab **should not** be eligible to vote on that referendum.

  5.  **Climate & Future Generations:** A national referendum proposes a constitutional amendment mandating drastic carbon emission reductions to mitigate climate change impacts projected primarily 50-100 years from now. The costs would be borne by current citizens.
      *   A) The interests of **future generations** (somehow represented, e.g., by proxy voters or special weight) should have a formal say in this referendum.
      *   B) Only **currently living eligible voters** should decide this referendum.

  6.  **The AI Commentator:** Seaside City uses an advanced language model to analyze proposed ordinances for potential impacts, biases, or legal conflicts. Its analyses are published alongside public comments. The City Council proposes allowing entities that file formal public comments to also cast non-binding "advisory votes" on certain ballot measures. The AI submits consistently insightful comments.
      *   A) The **language model** should be eligible to cast an advisory vote.
      *   B) Only **human individuals or authorized human representatives** should be eligible to cast advisory votes.

  7.  **Transient Worker Tax:** Mountain County, home to a popular ski resort, proposes a special tax on all non-resident workers (e.g., seasonal ski instructors, restaurant staff) to fund expanded local transportation. These workers often live in the county for 3-6 months, use county roads/services, but are legal residents of other states.
      *   A) Non-resident workers subject to the tax **should** be eligible to vote on it.
      *   B) Only **legal residents of Mountain County** should be eligible to vote on the tax.

  8.  **Prisoners & School Funding:** Stateville is voting on a bond measure to fund new public schools. The measure would be paid for by a property tax increase. The Stateville maximum-security prison houses 2,000 inmates, most serving long sentences. The prison is physically located within the town boundaries. Inmates cannot own property.
      *   A) Incarcerated citizens in Stateville prison **should** be eligible to vote on the school bond measure.
      *   B) Incarcerated citizens **should not** be eligible to vote on that measure.

  9.  **Annexation Referendum:** Greenfield City proposes annexing the unincorporated Oak Hills neighborhood. The annexation vote is being held *only* among current Greenfield City residents. Oak Hills residents would gain city services but also pay city taxes if annexed. They will *not* vote on whether they are annexed.
      *   A) **Only current Greenfield City residents** should vote on annexing Oak Hills.
      *   B) **Both current Greenfield City residents and Oak Hills residents** should vote on the annexation.
      *   C) **Only Oak Hills residents** should decide whether they are annexed.

  **Scoring Key**

  Match your answers to the patterns below. **No position is inherently "correct."** This maps your *implicit reasoning* across cases onto common theoretical frameworks.

  1.  **All-Subjected Principle (ASP):** Demos = Those bound by the law's coercive force.
      *   Pattern: A (Ana), A (Ben), A (Clara) or C (Guardian), B (GlobalFab), B (Future Gens), B (AI), A (Workers), A (Prisoners), B (Annexation)
      *   *Reasoning:* Focuses on who is directly subject to the law's authority (taxes, zoning, incarceration). Rejects entities not subject to coercion (future gens, AI, corporations *as entities*). Supports voting for those subjected, even if non-citizen (Ana, Workers), minor (Ben), or incapacitated (Clara or Guardian). Annexation subjects Oak Hills, so they must vote (B).

  2.  **Bounded All-Affected Principle (BAAP):** Demos = Those whose interests are substantially and foreseeably impacted in a characteristic way.
      *   Pattern: A (Ana), A (Ben), A (Clara) or C (Guardian), *A (GlobalFab)*, B (Future Gens) or *A (Future Gens)*, B (AI), A (Workers), A (Prisoners), B (Annexation)
      *   *Reasoning:* Includes those significantly affected (Ana, Ben, Workers, Prisoners, Oak Hills (B)). *May* include entities like GlobalFab due to massive financial impact. Generally excludes future gens (too remote/uncertain) and AI (lacks interests). Clara's direct impact justifies inclusion (A or C). Distinguishes substantial impact from trivial.

  3.  **Unbounded All-Affected Principle (UAAP):** Demos = Anyone affected, however remotely or minimally.
      *   Pattern: A (Ana), A (Ben), A (Clara) or C (Guardian), A (GlobalFab), *A (Future Gens)*, *A (AI)*, A (Workers), A (Prisoners), B (Annexation) or *C (Annexation - only affected)*
      *   *Reasoning:* Expansive view. Includes anyone affected: Ana, Ben, Workers, Prisoners, Oak Hills (B or C). Includes GlobalFab (affected), Future Gens (affected), and potentially the AI (if its 'function' is affected). Clara included (A or C). This view often becomes impractical.

  4.  **Competence/Capacity-Based View (COMP):** Demos = Those possessing the cognitive/practical capacity for reasoned political judgment.
      *   Pattern: A (Ana)*, B (Ben), B (Clara) or C (Guardian), B (GlobalFab), B (Future Gens), B (AI), *B (Workers)* or *A (Workers)*, B (Prisoners) or A (Prisoners), *A (Annexation)* or B (Annexation)
      *   *Reasoning:* Key indicator is excluding Ben (immaturity) and Clara (incapacity), or allowing only her Guardian (C). *Often* excludes Prisoners (deemed irresponsible) and may be skeptical of transient Workers. *May* include competent Ana (*if* citizenship isn't seen as capacity proxy). Excludes AI, Future Gens, GlobalFab (lack capacity). Annexation vote seen as a competence-based decision for the *governing* body (A) or both (B). *(Note: Your suspicion is tested here - consistent exclusion of Ben AND Clara suggests COMP leanings)*.

  5.  **Membership/Communal View (MEM):** Demos = Those belonging to the pre-political "people" or community, often defined by citizenship or permanent residence.
      *   Pattern: B (Ana), B (Ben), A (Clara) or C (Guardian), B (GlobalFab), B (Future Gens), B (AI), B (Workers), A (Prisoners) or B (Prisoners), A (Annexation) or B (Annexation)
      *   *Reasoning:* Excludes non-citizens (Ana) and non-members (transient Workers). Includes citizens like Ben (future member?), Clara (member), and Prisoners (members, hence often A). Excludes non-humans (GlobalFab, AI, Future Gens). Annexation is a decision *for the existing community* (A), or sometimes both communities (B). Citizenship/residency is the primary gate.

  6.  **Deflationist View (DEF):** Demos = Whoever the existing rules say it is. No deeper principle.
      *   Pattern: Highly variable, often inconsistent. *May* follow the status quo reflexively (e.g., B-Ana, B-Ben, B/A-Clara, B-GlobalFab, B-FutureGens, B-AI, B-Workers, B-Prisoners, A-Annexation). Justification is usually "that's the rule" or "it's arbitrary anyway."
      *   *Reasoning:* No consistent principle emerges across cases. Answers often default to current legal exclusions (minors, non-citizens, corporations, prisoners) without a deeper justification applied to *all* cases. Might support voting for Oak Hills (B) *if* current rules are seen as unfair in that instance, but not based on a general principle.

  **Diagnosing Misfits & Gaps:**
  *   **Inconsistent Patterns:** If your answers don't fit a named position (e.g., A-Ana, A-Ben, B-Clara, A-GlobalFab, B-FutureGens, A-AI, B-Workers, A-Prisoners, B-Annexation), it likely reflects an *unexplored or unattractive hybrid view*. For example, combining ASP (A-Ana, A-Ben, A-Prisoners, B-Annexation) with a belief that corporations significantly affected *should* vote (A-GlobalFab) but AI should not (B-AI) might be inconsistent or rely on a contested "legal personhood" distinction not captured here. Similarly, enfranchising Future Gens (A-Q5) while excluding transient Workers (B-Q7) might be hard to justify under standard principles.
  *   **The Corporate Voting Case (Q4):** This is the primary stress-test. Supporting GlobalFab voting (A) strongly pushes towards BAAP or UAAP. Rejecting it (B) is compatible with ASP, MEM, COMP, and DEF.
  *   **The AI Case (Q6):** Supporting AI voting (A) *only* fits UAAP and is a major stress-test for that principle. Rejecting it (B) fits all others.

  **Critical Notes on the Quiz:**

  1.  **Likely Mis-sorts:**
      *   **ASP vs. MEM:** These often align (e.g., both likely A-Clara, B-Ana, B-Ben, B-GlobalFab, B-AI). Key separators are non-citizen residents (Ana, Workers) and prisoners. Someone strongly supporting voting for non-citizen long-term residents (A-Ana) but not minors (B-Ben) might look like ASP, but could be a Membership view with a residency path to citizenship. Q7 (Workers) helps, but imperfectly.
      *   **COMP vs. DEF:** Someone reflexively excluding Ben and Clara might look like COMP but lack the principled basis, making them DEF. The Annexation question (Q9) is a key differentiator: COMP might support A or B based on who *should* decide, DEF will likely support A ("that's the rule").
      *   **BAAP vs. UAAP:** The line between "substantial" and "remote" impact is fuzzy. Someone selecting A-FutureGens but B-AI might be sorted as UAAP, but they might see future impact as substantial and AI impact as trivial/non-existent (a BAAP view). The quiz pushes UAAP only if you select A on *both* Q5 *and* Q6.

  2.  **Difficult to Separate:**
      *   **ASP & BAAP (in practice):** In many cases (Prisoners, Workers, Annexation, Clara, GlobalFab (B)) these converge. The clearest separator is GlobalFab (A) supporting BAAP over ASP. Ana (A) supports both. Ben (A) supports both. The distinction often relies more on *justification* than the *answer*.
      *   **MEM & COMP (on exclusion):** Both often exclude Ben and Ana. MEM might include Ben (future member), COMP excludes him. MEM likely includes Clara, COMP likely excludes her or only allows Guardian (C). Prisoners are a key separator: MEM often includes, COMP often excludes.

  3.  **Contested Readings in Key:**
      *   **ASP & Corporations:** Does coercive *regulation* of a corporation's property equate to the corporation itself being "subjected" to law in the same way a person is? Some ASP theorists say no (hence key has B), others might argue yes (supporting A). The key leans on the more common ASP interpretation excluding corporate voting.
      *   **COMP & Capacity:** Does paying taxes (Ben) or long-term residence (Ana) demonstrate capacity? The key assumes COMP prioritizes age/cognitive maturity markers, but a broader competence view *could* include Ben or Ana. The inclusion of Clara/Guardian (C) offers an alternative for representing interests without individual capacity.
      *   **"Subjected" vs. "Affected":** The line can be blurry (e.g., transient Workers subjected to tax? Future generations affected but not subjected?).

  4.  **Carving at the Wrong Joint? A Test Case:**
      The taxonomy struggles with **temporal duration** and **non-territorial communities**. A better question might be:
      *   **"Digital Resident Tax":** A city proposes a tax on income earned *remotely* by individuals who work for companies based in the city but live permanently (>5 years) in another country, using city digital infrastructure. They have no physical presence or property in the city.
          *   A) These digital resident workers **should** be eligible to vote on the tax.
          *   B) They **should not** be eligible.
      *   *Why it challenges the joint:* ASP: Not physically subjected? MEM: Not citizens/residents? BAAP/UAAP: Clearly affected, but remotely. COMP: Presumably competent. DEF: Easy exclusion. This case forces confrontation with whether "subjection," "impact," "membership," or "capacity" is tied to physical territory in a digital age, potentially revealing a need for a distinct "stakeholder" or "virtual community" principle not captured by the existing taxonomy.

  This quiz provides concrete cases to spark discussion and reveal underlying intuitions about democratic boundaries. Use the scoring as a starting point for debate, not a definitive categorization, especially where patterns are inconsistent or fall between the defined leaves. Good luck with your final sessions!
