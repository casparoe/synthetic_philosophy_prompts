prompt: |-
  I'm taking a seminar on philosophy of time, and we've just spent three weeks on tomorrow's sea battle — the ancient puzzle about whether statements about the future already have truth values. My own verdicts on cases are now on the table, and my tutorial partner, who is a devoted champion of Łukasiewicz's three-valued logic, tells me they don't add up to any coherent story. I'd like to know whether she's right, or whether there's a principle underneath them that I haven't managed to state.

  Here are my verdicts, all concerning statements made today about tomorrow. "There will be a sea battle tomorrow": neither true nor false — the admirals haven't yet decided. "Either there will be a sea battle tomorrow or there will not be a sea battle tomorrow": true, and I refuse to give this one up. "There will be a sea battle tomorrow and there will not be a sea battle tomorrow": false. "The sun will rise tomorrow": true — and I don't feel any tension with the first verdict, since the sun's rising seems somehow already settled in a way the admirals' decision is not. "The battle will be won by the Greeks," said on the assumption that the fleets will in fact meet: neither true nor false. Then the two I keep going back and forth on. First, "Either there will be a sea battle tomorrow or the fleet will remain in harbour": this feels as though it must be true, the way the excluded-middle disjunction is, but the disjuncts aren't strict contradictories (a storm could wreck the fleet tonight), and if I'm honest it also feels like one large future contingent rather than a logical truth. Second, "It was true yesterday, while the admirals were still arguing, that there would be a sea battle tomorrow": part of me says that of course it was, and part of me says that if it was true yesterday, then it was settled yesterday, which is precisely what I denied in my first verdict.

  My tentative principle is that a future-tensed statement is true exactly when what it says is already settled — fixed by how things presently are, together with the laws of nature — and otherwise lacks a truth value altogether. But I can see the principle needs repair: it isn't obvious what makes the excluded-middle disjunction true when neither disjunct is, and I genuinely cannot decide whether the "sea battle or harbour" disjunction counts as settled once the storm is in the picture. So here is what I want: is there a single account — my settledness idea, suitably repaired, my partner's three-valued truth tables, or something else entirely — that delivers all of my verdicts, or nearly all? Where it cannot, which verdicts should be surrendered, and why those rather than the others? What does the best account say about the two cases I waver on? And what would it predict about a case I haven't yet considered — say, "The coin I will toss tomorrow will land heads or will land tails," where my instinct says true until I remember that coins occasionally stand on edge?
reasoning: |-
  Okay, let me start by understanding the user's dilemma. They're in a philosophy seminar focused on the sea battle problem, which deals with future contingents and truth values. Their tutorial partner, who supports Łukasiewicz's three-valued logic, claims their intuitive verdicts are inconsistent. The user wants to know if there's a coherent principle behind their judgments or if they need to adjust some of them.

  First, I need to list their verdicts clearly:
  1. "There will be a sea battle tomorrow": neither true nor false (unsettled).
  2. Excluded middle ("either battle or no battle"): true, and they insist on this.
  3. Contradiction ("battle and no battle"): false.
  4. "The sun will rise tomorrow": true (settled).
  5. "Greeks will win" (if battle occurs): neither true nor false (unsettled).
  6. Disjunction ("battle or harbor"): they're unsure—feels true like excluded middle but disjuncts aren't contradictories due to external factors like a storm.
  7. Retrospective truth ("yesterday it was true there’d be a battle"): conflicted—if true yesterday, it should be settled, but they denied that.

  Their tentative principle is that a future-tensed statement is true if settled by present conditions and laws of nature; otherwise, no truth value. But they see issues: how does excluded middle hold when neither disjunct is true? And how does the "battle or harbor" disjunction fit?

  I recall that Łukasiewicz's three-valued logic might not satisfy their exclusion of the middle. Supervaluationism comes to mind because it handles unsettled statements by considering all possible futures. In this framework, a statement is true if it's true in all futures, false if false in all, and neither otherwise. 

  For the excluded middle, even though each disjunct is indeterminate, the disjunction is true in every possible future. So it's supertrue. The contradiction would be superfalse. The sun rising is settled, so true. The Greeks winning is unsettled, so indeterminate. 

  Now, the tricky disjunction: "battle or harbor." If a storm could prevent both, then in some futures, neither happens. So the disjunction isn't true in all futures, making it indeterminate. That matches their hesitation. 

  The retrospective statement: if today it's indeterminate that there's a battle tomorrow, then yesterday it wasn't true. This resolves their conflict. 

  The coin toss example: "heads or tails" seems true, but if landing on edge is possible, it's not settled. So under supervaluation, it's indeterminate unless edge-landing is impossible. 

  The user needs to decide if they can accept that excluded middle is true despite individual disjuncts being indeterminate. They might also need to give up the retrospective statement being true yesterday. Supervaluation offers a coherent system that aligns with most of their intuitions, except possibly the retrospective part, which requires letting go of the idea that past truth implies past settledness. 

  The user's deeper need might be reconciling logical principles with metaphysical openness. They value both the law of excluded middle and the idea that not all futures are settled. Supervaluation preserves classical logic for settled truths while allowing indeterminacy for contingents. They might need reassurance that surrendering the retrospective truth verdict is necessary for consistency and that the "battle or harbor" disjunction being indeterminate is justified by the storm possibility.
answer: |-
  Based on your verdicts and the challenges you face, **supervaluationism over branching futures** provides the most coherent single account that delivers nearly all your verdicts, requiring only one significant (but principled) surrender. Here's how it works and how it addresses your concerns:

  ### Core Principle (Repaired Settledness)
  *   **Truth:** A future-tensed statement is **true** *now* if and only if it is **settled true** – it is true *no matter how* the presently open possibilities unfold (i.e., true in *every* causally/practically possible future branch consistent with the present state + laws of nature).
  *   **Falsity:** A future-tensed statement is **false** *now* if and only if it is **settled false** – false in *every* possible future branch.
  *   **Indeterminacy (Neither):** A future-tensed statement is **indeterminate** (neither true nor false) *now* if it is true in *some* possible future branches and false in *others* – it is not settled.

  This repairs your settledness idea by defining settledness relative to *all possible futures* consistent with the present, not just a single deterministic outcome. It preserves the law of excluded middle while accommodating genuine indeterminacy.

  ### Applying Supervaluationism to Your Verdicts

  1.  **"There will be a sea battle tomorrow" (Indeterminate):** **Matches.** In some futures (admirals decide to fight), it's true. In others (they decide not, or a storm prevents), it's false. Not settled.
  2.  **"Either there will be a sea battle or there will not" (True):** **Matches & Explained.** In *every* possible future branch, one disjunct is true. It is settled true (supertrue).
  3.  **"There will be a sea battle and there will not" (False):** **Matches.** This is false in *every* possible future branch. It is settled false (superfalse).
  4.  **"The sun will rise tomorrow" (True):** **Matches.** Given our understanding of physics, this is true in *every* physically possible future branch consistent with the present state of the solar system. It is settled true.
  5.  **"The battle will be won by the Greeks" [assuming battle] (Indeterminate):** **Matches.** Assuming the battle's outcome depends on open factors (tactics, morale, chance), it's true in some battle-futures, false in others. Not settled *even given the battle occurs*.
  6.  **"Either there will be a sea battle or the fleet will remain in harbour" (Indeterminate?):** **Matches Your Wavering (Surrender "Must Be True").** A storm introduces a future branch where *neither* happens (fleet is wrecked at sea). Therefore:
      *   In "fight" futures: True (battle occurs).
      *   In "stay" futures: True (harbour).
      *   In "wreck" futures: **False** (no battle, not in harbour).
      Since it's false in some possible futures (wrecked), it is *not* true in *all* futures. It is **indeterminate**. This explains your unease – it *looks* tautological but isn't, due to the external possibility (storm) making the disjuncts non-exhaustive. You must surrender the intuition that it "must be true."
  7.  **"It was true yesterday... that there would be a sea battle tomorrow" (False):** **Requires Surrender (of "of course it was").** This is the crucial point. Supervaluationism is *temporally neutral*. The truth-value *yesterday* depends on what was settled *yesterday*. Yesterday, the battle was *also* unsettled – there were futures yesterday where it happened and futures where it didn't. Therefore, *yesterday*, the statement "There will be a sea battle tomorrow" was **indeterminate**, just like it is today. Claiming it was *true* yesterday is incorrect. This resolves your tension: denying it was true yesterday is consistent with denying it's true (or false) today. You must surrender the "of course it was" intuition. The past *fact* that a statement was indeterminate does *not* make it true later that it *was* true then.
  8.  **"The coin I will toss tomorrow will land heads or will land tails" (Indeterminate):** **Matches Your Refined Instinct.** If standing on edge is a physically possible future branch consistent with the present state and laws (even if improbable), then:
      *   In "heads" futures: True.
      *   In "tails" futures: True.
      *   In "edge" futures: **False** (it lands neither heads nor tails).
      Since it's false in some possible futures (edge), it is **not** true in *all* futures. It is **indeterminate**. If you deem "edge" *impossible* (e.g., due to coin/environment design), then it would be true (settled). Supervaluationism cleanly handles this based on the *genuine openness* of the possibilities.

  ### Comparison & Why Supervaluationism Wins

  *   **Your Settledness Idea (Repaired):** This *is* supervaluationism. It delivers nearly all verdicts but forces the surrender of the retrospective truth claim and the "sea battle or harbour" tautology intuition, providing principled reasons.
  *   **Łukasiewicz 3-Valued Logic:** Struggles fundamentally with the excluded middle ("Either battle or not"). In Łukasiewicz, if P is indeterminate (I), then P ∨ ¬P is also indeterminate (I). This directly contradicts your firm verdict that it is *True*. Supervaluationism preserves classical logic for settled truths (like excluded middle) while allowing indeterminacy for contingents.
  *   **Simple 3-Valued Logic (Kleene, etc.):** Suffers the same problem as Łukasiewicz with the excluded middle.
  *   **Determinism / All Future Contingents True or False Now:** Contradicts your core intuition about the sea battle being unsettled (Verdict 1).
  *   **Peirceanism (Future Contingents are ALL False Now):** Makes "The sun will rise" false now, contradicting Verdict 4.

  ### Summary & Recommendations

  1.  **Best Account:** **Supervaluationism over branching futures.**
  2.  **Required Verdict Surrenders:**
      *   **"It was true yesterday that there would be a sea battle tomorrow":** Surrender this. It was indeterminate yesterday. (Principle: Truth-value is always assessed relative to the *then-present* open possibilities).
      *   **"Either there will be a sea battle or the fleet will remain in harbour":** Surrender the intuition that it "must be true." It is indeterminate due to the storm possibility. (Principle: A disjunction is only settled true if it's true in *every* possible future).
  3.  **Resolution of Wavering Cases:**
      *   **"Sea battle or harbour":** **Indeterminate** (due to storm/wreck possibility).
      *   **Retrospective Truth:** **False** (it was indeterminate yesterday).
  4.  **Prediction for New Case (Coin Toss):** **Indeterminate** (if "edge" is a genuine possibility). True only if "edge" is deemed impossible.
  5.  **Underlying Coherence:** Your core intuition – distinguishing settled futures (sun) from unsettled ones (battle, battle outcome, coin toss) and preserving classical logic for necessary truths (excluded middle, non-contradiction) – finds its most natural and consistent expression in supervaluationism. The surrenders required are not arbitrary; they follow directly from rigorously applying the definition of settledness relative to *all* open possibilities.

  Supervaluationism provides the "coherent story" your partner seeks, grounding your verdicts in a single, well-established principle of truth-as-settledness-across-possible-futures. It resolves your tensions by clarifying the role of alternative possibilities ("storm", "edge") and the temporal indexicality of truth-value assessment (yesterday's truth depends on yesterday's possibilities).
