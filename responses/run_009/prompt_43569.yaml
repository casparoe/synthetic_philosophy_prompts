  The two-envelope paradox arises from a flawed assumption in the naive expected value calculation when you peek and see an amount. The key issue is the conditional probability that your envelope is the smaller or larger one given the observed amount, which depends on the prior distribution of the smaller amount and the setup of the game. Your gut reactions across the scenarios are mostly consistent once we account for this, and the split between #2 and #3 highlights the core principle. Below, I'll explain the rule, apply it to all your cases (including the additional one), and note where your intuitions align or might need adjustment.

  ### The Single Principle: Conditional Probabilities Depend on the Prior and Setup
  The rule is: **The expected gain from swapping depends on the conditional probability that the other envelope contains half or double your amount, given what you observed. This probability is determined by the prior distribution of the smaller amount (if the envelopes are filled beforehand) or by the randomization process (if the other envelope is filled after you peek).**

  - **When the envelopes are filled beforehand (fixed contents):**  
    The other envelope's content is fixed but unknown. The probability that it contains half or double your amount depends on the prior distribution of the smaller amount. If you don't know the prior, this probability might not be 50/50, and the naive expected value calculation (averaging half and double) can be misleading. Swapping may or may not be beneficial, depending on the prior.

  - **When the other envelope is randomized after you peek (random contents given observation):**  
    The other envelope's content is not fixed; it is chosen randomly (e.g., by coin flip) based on what you saw. Here, the probabilities are defined by the setup: half and double are equally likely by construction, so the naive calculation is valid, and swapping has positive expected gain.

  This principle resolves the paradox by showing that the 50/50 assumption is only valid in specific setups (like #3). It also explains why peeking is sometimes informative (#5, #6, additional case) and sometimes not (#2), and why multiple swaps or no peeking lead to no gain.

  Now, applying this rule to your scenarios:

  ### Analysis of Your Scenarios
  1. **No peek, one swap offer:**  
     - **Your gut:** Swapping makes no difference; it's symmetric.  
     - **Rule's verdict:** Correct. Without peeking, there's no conditioning on an amount, so the expected gain from swapping is zero. The envelopes are symmetric, and swapping is like re-choosing at random.  
     - **Why?** The prior distribution is irrelevant here since you don't condition on anything. E[gain] = 0 always.

  2. **Peek and see $100 (envelopes filled beforehand):**  
     - **Your gut:** Swapping feels like a trick; it shouldn't make you richer on average, but the math (average $125) smells wrong.  
     - **Rule's verdict:** Your gut is right to be suspicious. The naive math assumes P(other is half) = P(other is double) = 0.5 given $100, but this depends on the unknown prior. If the prior makes it equally likely (e.g., uniform with no boundaries), swapping gains 25% on average for this specific amount. But if the prior favors certain values (e.g., large amounts are less likely to be the smaller envelope), swapping could lose. Since the prior is unknown, the 50/50 assumption is unjustified, and swapping may not be beneficial.  
     - **Why the split with #3?** In #2, the contents are fixed, so probabilities depend on the prior. In #3, randomization after peeking forces 50/50 probabilities.

  3. **Peek and see $100, other envelope decided by coin flip after seeing yours:**  
     - **Your gut:** Swapping is clearly beneficial; the $125 average is real.  
     - **Rule's verdict:** Correct. The other envelope is randomized after you see $100, so P(other is $50) = P(other is $200) = 0.5 by construction. E[other] = 0.5 * 50 + 0.5 * 200 = 125 > 100, so swapping gains 25% on average.  
     - **Why the same math as #2 but different gut?** The math is identical, but the setup differs: here, probabilities are defined by the randomization, not the prior. Your gut correctly distinguishes this.

  4. **Multiple swaps allowed before opening:**  
     - **Your gut:** Swapping multiple times shouldn't help; the per-swap 25% gain argument must break.  
     - **Rule's verdict:** Correct. Without peeking, there's no conditioning, so each swap has E[gain] = 0. The per-swap "25% gain" only applies if you peek and condition on an amount (which you don't). Multiple swaps without peeking are equivalent to doing nothing.  
     - **Why?** If you could peek and swap repeatedly, you'd need to re-evaluate after each swap, but here, no peeking means no conditioning, so E[gain per swap] = 0.

  5. **Know possible amounts ($10 and $20), see $20:**  
     - **Your gut:** Don't swap; the other is $10 for sure.  
     - **Rule's verdict:** Correct. The prior is known: the smaller amount is $10. Seeing $20 means you have the larger envelope, so P(other is half) = 1 and P(other is double) = 0. E[other] = $10 < $20, so swapping loses. Peeking gives full information here.

  6. **Whole dollars only, min $1, peek and see:**  
     - **See $1:**  
       - **Your gut:** Swap; the other must be $2.  
       - **Rule's verdict:** Correct. With min $1 and whole dollars, $1 can't be half of $0.50, so you must have the smaller envelope. P(other is double) = 1 and P(other is half) = 0. E[other] = $2 > $1, so swapping gains.  
     - **See $100:**  
       - **Your gut:** Torn; the math says swap for 25% gain, but it feels rotten.  
       - **Rule's verdict:** Your torn feeling is justified. The prior is unknown. If the prior is uniform and unbounded, P(other is half) ≈ P(other is double) ≈ 0.5, so E[other] ≈ $125 > $100, and swapping gains. But with min $1, $100 might be near a boundary (e.g., if amounts are small, $100 is likely the larger envelope), making swapping bad. Without knowing the prior, the 50/50 assumption is unreliable, so swapping is ambiguous.  
     - **Why different at $1 vs. $100?** At $1, the min boundary forces certainty; at $100, no boundaries constrain the probabilities, so prior dependence causes uncertainty.

  ### Additional Case: Known Prior for Pairs
  **Setup:** You know the guy uses either {$50, $100} or {$100, $200}, with a fair coin flip for which pair. You peek and see $100.

  - **Do you swap?**  
    Yes, swap. The prior is known: given you see $100, it's equally likely from the {$50,$100} pair (where $100 is larger) or {$100,$200} pair (where $100 is smaller). So P(other is $50 | see $100) = P(other is $200 | see $100) = 0.5. E[other] = 0.5 * 50 + 0.5 * 200 = 125 > 100, so swapping gains 25% on average.

  - **Was peeking worth it?**  
    Yes. Without peeking, E[value] = 0.5 * 75 + 0.5 * 150 = 112.5 (since pairs are equally likely, and you get a random envelope). After seeing $100, you swap to get $125 on average, which is better than keeping $100. Peeking lets you condition and make a better decision: swap if you see $50 or $100, don't swap if you see $200.

  ### Which Gut Verdicts Might Need Adjustment?
  - **#2 (peek to $100, fixed envelopes):** Your gut says swapping feels wrong, but with a reasonable prior (e.g., uniform and unbounded), swapping does gain on average for that amount. However, your skepticism is valid because the prior is unknown, and in real life, priors often make large amounts less likely to be the smaller envelope (so swapping could lose). Your gut is "mostly right" in rejecting the naive 50/50 assumption without priors, but mathematically, it can be beneficial. I'd keep your gut verdict as it reflects caution about unknown priors.
    
  - **#6 at $100 (peek to $100, min $1):** Your torn feeling is spot-on— it depends on the prior. If you have no information, swapping might be risky, but the math suggests it if you assume uniformity. No change needed.

  All other gut verdicts are consistent with the rule. The principle saves them all by emphasizing that probabilities depend on the setup and prior.

  ### Final Takeaway
  The paradox stems from assuming P(other is half) = P(other is double) = 0.5 without justification. This holds only when:
  - The other envelope is randomized after you peek (e.g., #3).
  - The prior distribution makes it true (e.g., uniform with no boundaries, or the additional case).

  Otherwise, the probabilities depend on the unknown prior, and swapping may not be beneficial. Your gut is good at spotting this— it trusts the 50/50 only when enforced by the setup (#3) or boundaries (#6 at $1), but doubts it when the prior is vague (#2, #6 at $100). For decision-making: if the setup randomizes after peeking, swap; if envelopes are fixed, be cautious unless you know the prior or have boundary information.
