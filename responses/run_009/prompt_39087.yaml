  so I'm a second year taking a game theory module this term and we just covered the prisoner's dilemma. the lecturer spent ages on Axelrod's tournaments and how tit-for-tat won both of them, and how in the iterated version cooperation can be stable as long as the "shadow of the future" is long enough. but then on the problem set for the one-shot version we're supposed to say defecting is rational, and I honestly can't see how both things are true. Axelrod literally ran the thing and the cooperators came out on top — so doesn't that just prove the textbook answer is wrong? my tutor said something like "doing well in a tournament is not the same as being rational" but I don't really get the difference, winning is winning isn't it. also, since tit-for-tat can't be exploited and does fine against itself, doesn't that make it irrational for the other player to try anything except cooperating with me from round one? basicly if cooperation wins the iterated game, how can defecting win a game that's just one round of that same game — surely the one-shot answer should fall out of the iterated one somewhere. (sorry if this is a daft question, it's my first phil/econ crossover module and I'm finding it a bit much, we've also got the folk theorem and the WWI trench stuff coming up next week so I'd like to get this straight before then)
