answer: |-
  This is **absolutely not a daft question**—it's a profound insight that cuts to the heart of game theory! Your confusion arises because the strategic dynamics of the *one-shot* Prisoner's Dilemma (PD) and the *iterated* PD are fundamentally different. Let's break it down:

  ### 1. **The One-Shot Prisoner's Dilemma: Why Defecting is "Rational"**
     - **Rationality Defined:** In game theory, "rational" typically means playing a *best response* to what you believe the other player will do. In the one-shot PD, **defecting strictly dominates cooperating**:
       - If the other cooperates: You get a better payoff by defecting (temptation payoff > reward payoff).
       - If the other defects: You get a better payoff by defecting (punishment payoff > sucker's payoff).
     - **Nash Equilibrium:** The only Nash equilibrium is (Defect, Defect). Even if both players *wish* they could cooperate, neither can unilaterally switch to cooperation without hurting themselves. Rationality here is about *individual incentive*, not group outcomes.

  ### 2. **Axelrod's Tournaments: Why Cooperation *Emerges* in Iterated Play**
     - **The Shadow of the Future:** In repeated games, players can use **future punishments/rewards** to incentivize cooperation *today*. Tit-for-Tat (TFT) succeeds because:
       - It starts cooperatively (building trust).
       - It retaliates immediately against defection (deterring exploitation).
       - It forgives after retaliation (restoring cooperation).
     - **Success ≠ Individual Rationality:** TFT won Axelrod's tournaments because it was **collectively stable** in a population of diverse strategies. But if you knew your opponent was playing TFT in a *finitely repeated* PD, is cooperating always rational? **No!**  
       - In the **final round**, the game reduces to a one-shot PD. Rational players defect here (no future to punish them).
       - Knowing this, players defect in the *second-to-last* round (since cooperation won't be rewarded later), and so on. This unravels cooperation all the way back to round one (**backward induction**).

  ### 3. **The Crucial Difference: Known vs. Uncertain Endpoints**
     - **Finitely Repeated PD:** If the number of rounds is *known and finite*, (Defect, Defect) in every round is the only Nash equilibrium (though this is debated—see the Folk Theorem next week!).
     - **Infinitely/Uncertainly Repeated PD:** If players believe the game might continue indefinitely (or with high probability), the threat of *future retaliation* makes cooperation rational. TFT is a Nash equilibrium here because:
       - If Player 2 uses TFT, Player 1's best response is *also TFT* (cooperating forever gives a high payoff; defecting triggers punishment).
       - This is where the "shadow of the future" (discount factor) matters. If future payoffs are valued highly enough, cooperation is sustainable.

  ### 4. **Why TFT Isn't "Rational" in the One-Shot Sense**
     - Suppose you play a *single round* against a TFT player. They will cooperate if you cooperate, defect if you defect. Your best response? **Defect!** You get the temptation payoff (better than the reward for mutual cooperation). TFT *cannot enforce cooperation in a one-shot interaction*—it only works when there are future rounds to threaten punishment.

  ### 5. **What Axelrod Actually Showed**
     - Axelrod demonstrated that **cooperative strategies can thrive in evolutionary/ecological settings** where strategies compete over many rounds. TFT is:
       - **Nice** (never defects first).
       - **Retaliatory** (deters exploitation).
       - **Forgiving** (avoids endless feuds).
       - **Clear** (easy for opponents to understand).
     - This makes it robust against many real-world strategies. But it doesn't mean TFT is a strictly dominant strategy in the game-theoretic sense.

  ### Connecting to Your Upcoming Topics
  - **The Folk Theorem:** Addresses exactly your question! It states that in infinitely repeated games, *any feasible, individually rational payoff* can be sustained as a Nash equilibrium if players are patient enough. Cooperation isn't the *only* rational outcome—but it *can* be rational.
  - **WWI Trench Warfare (e.g., Live-and-Let-Live):** Soldiers cooperated (reduced aggression) despite being enemies. Why? Because they faced the *same opponents daily* (high probability of future interaction). Defection (e.g., sniping) risked triggering retaliation. This collapsed when high commands enforced attacks (shortening the "shadow of the future").

  ### Key Takeaway
  - **One-shot PD:** Rationality → Defect (no future, no punishment possible).  
  - **Iterated PD:** Rationality → *Can* include cooperation (if future interactions matter enough).  
  - **Axelrod's Lesson:** Cooperation isn't irrational—it's a sophisticated strategy for long-term survival when interactions repeat. But it *depends* on the expectation of future consequences.

  You’re spotting the tension between *individual rationality* (one-shot) and *evolutionary success* (iterated tournaments)—which is why this is such a rich topic! This will all click when you hit the Folk Theorem. Keep questioning—it’s the best way to learn game theory.
