  2. Option (b) achieves equal false-negative rates via a lower threshold for the higher-base-rate population but silently sacrifices calibration for the resulting decisions, as "30% risk" no longer implies equal likelihood across groups when thresholds differ.  
  3. Option (c) abandons calibration and fairness goals for one population: Reverting to clinician judgment avoids model constraints but risks higher overall false negatives or unintended biases, as human decisions may be less consistent or accurate than the model.  
  4. Apparent escape routes fail: Ignoring group membership during decision-making still yields unequal false-negative rates under calibration, while retraining on alternative labels (e.g., non-readmission outcomes) does not resolve the impossibility, as the program requires predicting 30-day readmission specifically.  
