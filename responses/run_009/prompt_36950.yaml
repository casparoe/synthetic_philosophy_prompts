prompt: |-
  I'm on the safety evaluation team at a mid-sized AI lab — not a frontier player, but large enough that our deployment decisions affect millions of downstream users, and we're always racing someone to release. Every release cycle we face the same decision: a proposed safety intervention (a refusal-training revision, a monitoring layer, an interpretability-based pre-deployment screen, a stricter data filter) carries a measurable cost — benchmark performance, latency, compute, iteration speed — and we have to recommend adopting it anyway, watering it down, or rejecting it, with sign-off required from the VP of Research within about a week. Right now this is decided ad hoc, and the argument always collapses into someone invoking the competitiveness constraint — that safety work only gets adopted if it's roughly free, or at least cheap enough not to lose the race — as though that settled which interventions pass. I want that slogan turned into an actual procedure.

  Please write a decision procedure my team can run on any proposal in under an hour. It should be grounded in the real conceptual content of the alignment tax idea, and it should preserve the distinctions that matter rather than flattening them: the difference between the constraint as an empirical prediction about what will be adopted in a competitive market and as a normative guideline for research prioritization; the difference between costs borne by the deploying actor and costs borne by users or the world at large; the difference between a capability tax, a resource tax (latency, price, compute), and a development-speed tax; and the fact that "competitive" is only defined relative to a counterfactual competitor who may not exist or may be running the same intervention anyway. The procedure should say what questions to ask in order, what counts as a sufficient answer to each, where it terminates in a clear recommendation, and where it must hand the decision to a person because the remaining question is one of values rather than facts.

  Then run it on three proposals of the kind we actually see:

  1. A refusal-training revision that cuts the rate at which our model assists with clearly harmful requests by roughly half, but measurably raises over-refusals on benign requests and drops scores on a standard benchmark suite by about 2%.
  2. An interpretability-based screening pass before each release that doesn't touch model weights at all but adds a three-week delay to every release cycle and consumes a senior researcher's time.
  3. A monitoring technique that is completely free — no capability cost, no latency — but only works reliably below a certain capability threshold, and we are already training models near that threshold.

  For each, give the procedure's verdict and the reasoning behind it. At least one verdict should be one my team will hate — we are, for instance, quite attached to proposal 2 — and you should explain why the procedure nevertheless yields it. Finally, tell me where the procedure will misfire: which simplifications are most likely to produce a wrong recommendation (treating capability as a single scalar, assuming the benchmark drop is proportional to the real-world capability drop, ignoring the second-order effects whereby making a model safer can make it more useful and vice versa), and what early-warning signs would tell us a misfire has already occurred.
reasoning: |-
  We are designing a decision procedure for safety interventions. The procedure should consider:
  - The cost types: capability tax (drop in benchmark scores), resource tax (latency, compute, cost), development-speed tax (delay in release cycle).
  - The distinction between costs borne by the deploying actor (us) and costs borne by users or the world (externalities).
  - The competitive constraint: we must consider the counterfactual competitor (if they exist, and if they are implementing the same intervention or not).
  - The intervention's effectiveness in reducing harm.

  The procedure must also separate:
  - Empirical predictions (what will the market adopt? what will competitors do?) from normative guidelines (what should we prioritize?).
  - The fact that "competitive" is relative to a counterfactual.

  The procedure steps:

  1. **Define the intervention and its costs:**
     - What type of cost is it? (Capability, Resource, Development-Speed)
     - How much does it cost? (Quantify where possible)
     - Who bears the cost? (Lab, User, World)

  2. **Assess the counterfactual competitor:**
     - Is there a known competitor? If so, are they likely to adopt a similar intervention?
     - If we don't know, we must assume the worst-case (that they don't adopt and thus we are at a disadvantage) unless there is evidence to the contrary.

  3. **Evaluate the safety benefit:**
     - What harm does it mitigate? (e.g., reduces harmful compliance by X%)
     - How severe is that harm? (e.g., assisting in creating bioweapons vs. minor misinformation)
     - Is the benefit internal (to the lab's reputation, liability) or external (to society)?

  4. **Competitive impact:**
     - If we adopt the intervention and the competitor does not, will we lose the race? (Consider the magnitude of the cost and the race dynamics.)
     - If we adopt and the competitor also adopts (or is forced to by regulation), then the playing field is level and the cost is just the new baseline.

  5. **Decision branches:**
     - If the cost is negligible (say, <0.5% on key benchmarks, or a delay of less than a day, etc.) then adopt.
     - If the cost is high but the safety benefit is catastrophic risk reduction, then adopt regardless (this is a values call, so we flag for the VP).
     - Otherwise, we must compare the cost to the benefit and the competitive risk.

     We break down the cost into:
     - Capability tax: if the benchmark drop is above a threshold (e.g., 1%) and that benchmark is critical for adoption, then it's a red flag.
     - Resource tax: if it increases latency beyond acceptable for the application or increases compute costs significantly, then it may be unacceptable.
     - Development-speed tax: if it delays release by a significant fraction of the release cycle (e.g., more than 10%) then it may cause us to lose the race.

     We then consider:
     - If the competitor is likely to adopt (or if regulation will force adoption industry-wide), then we can adopt because the cost becomes the new baseline.
     - If the competitor is not adopting and we are in a tight race, then we must weigh:
          - The expected loss in market share/revenue from the cost (if any) vs.
          - The expected harm from not adopting (including reputational, regulatory, and actual harm events).

     This step requires estimation and may be the hardest. We try to quantify:

          Let:
            C = cost in terms of expected market share loss (or revenue loss) over the next year if we adopt and the competitor doesn't.
            B = benefit in terms of reduced expected harm (monetized? but hard) and reduced risk of catastrophic events, plus avoided regulatory fines and reputational damage.

          But note: B includes externalities that the lab may not fully internalize. Therefore, we must have a threshold for when the harm is so severe that we must act even if C is high.

          We set two thresholds for B:
            - Low: the harm is minor (e.g., generating spam) -> then we require that the cost is low (or that the competitor also adopts) or we reject.
            - High: the harm is major (e.g., enabling terrorist activities) -> then we adopt unless the cost is catastrophic (i.e., would put us out of business).

          However, note that the lab's values may assign very high weight to catastrophic risks even if the immediate cost is high.

          Therefore, we must have a step where we classify the harm severity:

            Level 1: Inconvenience (e.g., over-refusals on benign requests) -> low.
            Level 2: Moderate harm (e.g., spreading misinformation that might influence an election) -> medium.
            Level 3: Severe harm (e.g., enabling large-scale fraud, facilitating violence) -> high.
            Level 4: Catastrophic risk (e.g., assisting in creating a pandemic pathogen, or enabling loss of control of superintelligent AI) -> extreme.

          Then:

            - For level 1: only adopt if the cost is negligible.
            - For level 2: adopt if the cost is low or if the competitor is also adopting.
            - For level 3: adopt unless the cost is high (and the competitor isn't adopting) and the market loss would be severe.
            - For level 4: adopt regardless of cost, unless the cost itself would cause an existential risk (e.g., if we go bankrupt and then the competitor releases without any safety) -> but that is very rare.

  6. **Termination:**
     - If the intervention is free or negligible cost: adopt.
     - If the harm level is extreme: adopt (unless there is a clear argument that the intervention actually increases catastrophic risk, which is rare).
     - Otherwise, we must make a judgment call based on the competitive landscape and the cost-benefit. We then present to the VP with:
          - The expected cost (quantified as much as possible)
          - The expected benefit (in terms of harm reduction, and also any internal benefits like avoiding fines)
          - The likelihood that competitors will adopt (or that regulation will force adoption)
          - The risk of losing the race if we adopt and they don't.

     The VP then decides based on the lab's risk tolerance and values.

  Now, we run the three proposals:

  ### Proposal 1: Refusal-training revision
  - **Costs:**
     - Capability tax: drops benchmark scores by 2%. This is a moderate capability hit.
     - Also, over-refusals on benign requests (user experience cost) -> borne by users and the lab (if users leave).
  - **Safety benefit:** Reduces harmful compliance by roughly half. The type of harm: if the harmful requests are for things like generating phishing emails, hate speech, or dangerous instructions, then the harm level is moderate to severe (level 2 or 3). However, if the harmful requests include catastrophic risks (like WMD design) then it might be level 4. We'll assume the harmful requests are mostly at level 2 or 3 (because catastrophic risks are rare and the model might not be capable enough for that yet).
  - **Counterfactual competitor:** We don't know if they are implementing a similar intervention. We must assume they are not, unless we have evidence.

  **Procedure:**
  1. The capability tax (2% on benchmarks) is non-negligible. The over-refusals are a user cost that may lead to loss of users.
  2. The safety benefit: moderate to severe harm reduction. Let's say level 3 (severe) because the examples are "clearly harmful".
  3. Competitive impact: 
     - Without the intervention, we might face reputational damage or regulatory action if harmful uses are widespread.
     - But with the intervention, we lose 2% on benchmarks and have over-refusals. This might make our model less attractive in a head-to-head comparison.

     We must consider: if the competitor doesn't have this intervention, then they might have a 2% edge on benchmarks and fewer over-refusals. This could lead to loss of market share.

  4. Given the harm level (3) and the cost (moderate), we are in a gray area. We must estimate:
     - The probability that the competitor has a similar intervention? If we think it's low, then the cost might be too high to adopt without regulatory requirement.

     However, note: the problem says we are in a race. A 2% drop might be the difference between winning and losing. Therefore, we lean towards rejection unless there is evidence that the competitor will also have such a drop (or that the market will demand this safety).

     But also, the harm reduction is significant (halving harmful compliance). We must consider: if we release without this, and there is a high-profile harmful event, that could be worse than a 2% benchmark drop.

     This is a values call. We must hand it to the VP.

  **Verdict:** Hand to VP. Reasoning: The cost is non-trivial (2% benchmark drop and user experience issues) and the race is tight. The benefit is substantial but not catastrophic. The competitive landscape is unknown. The VP must weigh the risk of harm and reputational damage against the risk of losing the race.

  ### Proposal 2: Interpretability-based screening pass
  - **Costs:** 
     - Development-speed tax: adds three weeks to every release cycle (which might be, say, 12 weeks? so 25% delay). 
     - Resource tax: consumes a senior researcher's time (which could be used for other safety or capability work). This is a significant resource cost.
  - **Safety benefit:** The screening pass is meant to catch dangerous capabilities or misalignments. It might prevent a release that would have caused severe harm (level 3 or 4). However, the effectiveness is not quantified. How often will it catch something? How severe is what it catches?

  **Procedure:**
  1. The cost is high: a 25% delay in release cycle and tying up a senior researcher. This could cause us to lose the race by a significant margin.
  2. Safety benefit: 
     - The benefit is in catching a catastrophic failure. But how likely is such a failure without the screen? If the base rate of dangerous models is low, then the expected benefit might be low.
     - However, if we are training models near the threshold of dangerous capabilities, then the benefit could be high. But note: the proposal doesn't specify how effective the screen is. We need an estimate of the reduction in risk.

     Without a quantification, we must rely on expert judgment. But the problem says we are attached to this one, so let's assume we believe it catches a catastrophic failure that would otherwise happen 1 in 20 releases.

  3. Counterfactual competitor: 
     - Are they doing such a screen? If they are, then we are on par. If not, then we are slower. Without evidence, we assume they are not.

  4. Given the high cost (25% delay) and the unquantified benefit, we must consider:
     - The probability that the screen catches a catastrophic issue: if it's very low (say, less than 1% per release) then the expected cost of delay might outweigh the benefit.
     - However, if the catastrophic issue would be existential, then even a small probability might justify it.

     But note: the cost of delay is not just losing the race. It also means that we are slowing down safety improvements that might come in the next model? (But the screen is for the current model.)

     This is a high-stakes judgment. We must classify the harm level: if the screen is for catastrophic risks, then it's level 4. But we must also consider the base rate.

     We might break it down:

          Let R = the risk of releasing a model that has a catastrophic failure without the screen.
          Let E = the effectiveness of the screen (probability it catches such a failure).

          Then the benefit is R * E.

          The cost is the delay, which might cause us to lose the race and thus lose market share. But also, if we lose the race, the competitor might release an even more dangerous model without a screen? That would be worse.

          Alternatively, if we adopt the screen and it delays us, maybe the competitor releases first and their unsafe model causes a regulatory response that then forces us to adopt the screen anyway? Then we get the safety benefit but still lose the race.

     This is complex. We need to estimate R and E. Without data, we can only use expert judgment.

     Given the high cost, unless the risk R is significant (say, >5% per release) and the screen is effective (E>50%), then the cost of delay is too high.

     But note: we are already near a capability threshold? The next proposal says that. So maybe R is increasing.

     However, the procedure requires that we quantify as much as possible. Since we don't have numbers, and the cost is high, we must be cautious.

     Given the competitive constraint, we have to reject unless the safety case is overwhelming.

     **Verdict:** Reject. Reasoning: The cost is very high (25% delay in every release cycle) and the safety benefit, while potentially for catastrophic risks, is unquantified and likely low per release (because catastrophic failures are rare). In a race, this delay is unacceptable unless we have strong evidence that the risk is imminent. Without that, we cannot justify the recurring cost.

     Note: The team is attached to this, but the procedure is designed to be ruthless about development-speed taxes in a race.

  ### Proposal 3: Monitoring technique
  - **Costs:** Completely free (no capability cost, no latency) -> but only works reliably below a certain capability threshold. We are already training models near that threshold.
  - **Safety benefit:** It monitors for some kind of harmful behavior? The proposal doesn't specify what it catches. But let's assume it catches severe misuse (level 3 or 4) and that above the threshold it becomes ineffective.

  **Procedure:**
  1. The cost is zero for now. So we should adopt? But note: we are near the threshold. The next model might be above, so the monitoring will become ineffective. Then we have to remove it? But that might cause a gap.

     However, for the current model and near-term models, it's free and effective.

  2. Safety benefit: Prevents harm (level 3 or 4) without any cost. So why not?

  3. Counterfactual competitor: They might not have this monitoring. Then we have a safety advantage at no cost. Even if they do, it's still free for us.

  4. But note: the threshold issue. We must consider the long-term. If we become dependent on this monitoring and then it stops working, we might be worse off than if we had developed a different technique. However, that's speculative.

     The procedure says: if the cost is free and the benefit is positive, then adopt.

     However, we must check: is there any hidden cost? For example, does it give a false sense of security? The procedure doesn't account for that. We assume the benefit is real and the cost is zero.

     **Verdict:** Adopt. Reasoning: Free safety win. Even if it only works for a short time, it's better than nothing. And it doesn't hurt competitiveness.

  ### Summary of Verdicts:
  1. Proposal 1: Hand to VP (gray area).
  2. Proposal 2: Reject (due to high development-speed tax and unquantified benefit in a race).
  3. Proposal 3: Adopt (free).

  Now, the team will hate proposal 2's rejection. Why the procedure yields it: The procedure is designed to be sensitive to development-speed taxes in a competitive race. A 25% delay in every cycle is a massive recurring cost. Without strong evidence that the screening pass prevents a high-probability catastrophic event, the procedure rejects it because the race constraint is binding.

  ### Where the procedure misfires:

  1. **Treating capability as a single scalar:** The benchmark drop in proposal 1 might be on tasks that are not critical for real-world performance, or the drop might be concentrated in areas that don't matter for safety. Conversely, the benchmark might not capture important capabilities. The procedure uses a scalar (e.g., 2%) but that might be misleading.

     *Early-warning sign:* If we notice that the benchmark drop does not correlate with user satisfaction or real-world performance, then we are overpenalizing.

  2. **Assuming benchmark drop proportional to real-world capability drop:** This is a subset of the above. Benchmarks are proxies. The procedure doesn't account for the fact that the safety intervention might improve performance in some areas (e.g., by making the model more cautious, it might be more reliable in critical applications) and hurt in others.

     *Early-warning sign:* User feedback or A/B testing shows that the benchmark drop does not reflect actual performance in the field.

  3. **Ignoring second-order effects:** Making a model safer can make it more useful (e.g., by increasing trust, users use it more; or by avoiding harmful outputs, it avoids being banned). Conversely, a capability drop might lead to loss of users, which then reduces the data flywheel. The procedure doesn't model these.

     *Early-warning sign:* After deployment, we observe that the safety intervention leads to unexpected gains (or losses) in market share.

  4. **Base rate neglect in catastrophic risk:** For proposal 2, the procedure requires an estimate of the base rate of catastrophic failures. But that base rate is extremely hard to estimate and might be subject to groupthink. We might underestimate or overestimate.

     *Early-warning sign:* We either have a near-miss that the screen catches (suggesting the base rate was higher than we thought) or we go many cycles without catching anything (suggesting the base rate was lower).

  5. **Threshold effects in proposal 3:** The fact that the monitoring becomes ineffective above a threshold might mean that we are lulled into a false sense of security. The procedure doesn't account for the risk of complacency.

     *Early-warning sign:* We observe that as models get more capable, the monitoring fails to flag issues that then cause harm.

  To mitigate these, the procedure should be augmented with:
  - A requirement to break down benchmark drops by task and assess relevance.
  - A/B testing or user studies when feasible to measure real-world impact.
  - Scenario planning for second-order effects.
  - Regular re-evaluation of base rates for catastrophic risks (using near-misses and external research).
  - A plan for when the free monitoring in proposal 3 stops working.

  Despite these limitations, the procedure provides a structured way to make these decisions and forces the team to articulate the costs and benefits explicitly.
answer: |-
  Below is a decision procedure designed for your safety evaluation team. It's structured to address the nuances you specified while remaining executable within an hour per proposal. The procedure is divided into sequential questions, with clear termination points for recommendations or handoffs to human judgment. I'll first outline the procedure, then apply it to your three proposals, and finally discuss limitations and misfire warnings.

  ---

  ### **Safety Intervention Decision Procedure**
  **Goal:** Determine whether to adopt, water down, or reject a safety intervention within competitive constraints.  
  **Time Budget:** 45-60 minutes per proposal.  
  **Inputs:** Proposal document, benchmark data, competitive intelligence (if available), harm severity definitions (predefined by the lab).  
  **Outputs:** `Adopt`, `Reject`, `Water Down`, or `Escalate to VP` (for values-based decisions).

  #### **Step 1: Classify Costs (5 mins)**  
     - **Question:** What costs does the intervention impose? Break into:  
       - **Capability Tax** (e.g., benchmark degradation, reduced task performance).  
       - **Resource Tax** (e.g., added latency, compute, or financial costs).  
       - **Development-Speed Tax** (e.g., delays to release cycles or R&D velocity).  
       - **Bearing Party:** Lab (internal), User (e.g., slower/inferior product), Society (e.g., negative externalities).  
     - **Termination:** If all costs are borne by society or users *and* lab costs are negligible → `Adopt`.  
     - **Handoff:** If costs lack clear metrics → Escalate for quantification.

  #### **Step 2: Assess Safety Benefit (10 mins)**  
     - **Question:** What harm does the intervention mitigate? Assign:  
       - **Harm Severity Level** (use lab’s predefined scale, e.g.,):  
         - `L1`: Minor (e.g., benign over-refusals).  
         - `L2`: Moderate (e.g., biased outputs, misinformation).  
         - `L3`: Severe (e.g., enabling illegal acts).  
         - `L4`: Catastrophic (e.g., WMD assistance, existential risk).  
       - **Benefit Magnitude** (e.g., "halves harmful compliance").  
     - **Termination:**  
       - If benefit is unmeasurable or speculative → `Reject`.  
       - If L4 harm reduction and cost is non-existential → `Adopt` (values-based, but procedurally decisive).

  #### **Step 3: Competitive Counterfactual (15 mins)**  
     - **Question:** What happens if we adopt but competitors do not?  
       - **Key:** Treat "competitive" as dynamic. Estimate:  
         - **Race Loss Risk:** Probability of losing market share if we incur costs and competitors don’t (use historical data or intelligence).  
         - **Adoption Parity Likelihood:** % chance competitors adopt similar measures (e.g., industry trends, leaks, shared safety norms).  
       - **Cost-Specific Analysis:**  
         - _Capability Tax:_ Compare benchmark gaps to rival models.  
         - _Speed Tax:_ Calculate release delay vs. competitor cadence.  
         - _Resource Tax:_ Model cost impact on pricing/user growth.  
     - **Termination:**  
       - If parity likelihood >66% → Proceed to Step 4 (costs become baseline).  
       - If race loss risk >33% and harm < L3 → `Reject`.  
       - Otherwise → Proceed.

  #### **Step 4: Cost-Benefit Synthesis (15 mins)**  
     - **Question:** Do lab-specific benefits outweigh costs after competitive adjustment?  
       - **Calculate:**  
         - **Net Cost:** Adjust costs from Step 1 for adoption parity (e.g., if parity=100%, capability tax = 0).  
         - **Lab Benefit:** Include avoided regulatory/financial/reputational harm (e.g., "reduces lawsuit risk by X%").  
       - **Thresholds:**  
         - _Capability Tax:_ >1% on core benchmarks → `Reject` unless harm ≥ L3.  
         - _Speed Tax:_ >10% release delay → `Reject` unless harm ≥ L4.  
         - _Resource Tax:_ >5% cost increase → `Water Down` or `Reject`.  
     - **Termination:** Clear thresholds met → Output decision.  
     - **Handoff:** If societal benefits dwarf lab costs but competitiveness is threatened → `Escalate to VP` (values tradeoff).

  #### **Step 5: Water Down Evaluation (5 mins)**  
     - **Question:** Can we modify the intervention to retain >50% benefit at <50% cost?  
       - **Tactics:** Weaken refusal strictness, automate monitoring, parallelize screens.  
     - **Termination:** Feasible → `Water Down`; else prior decision stands.

  ---

  ### **Application to Proposals**
  #### **Proposal 1: Refusal-Training Revision**  
  - **Step 1:**  
    - _Costs:_ Capability tax (2% benchmark drop), Resource tax (user-facing over-refusals).  
    - _Bearing:_ Lab (benchmark drop) + Users (over-refusals).  
  - **Step 2:**  
    - _Benefit:_ Halves L3 harm (clearly harmful requests).  
    - _Harm:_ Severe (enables illegal/dangerous acts).  
  - **Step 3:**  
    - _Race Loss Risk:_ High (2% drop may lose race; competitors likely skip intervention).  
    - _Parity Likelihood:_ Low (no industry-wide refusal norms).  
  - **Step 4:**  
    - _Net Cost:_ High (2% drop + user frustration; no parity).  
    - _Threshold:_ Capability tax >1% and harm = L3 → `Reject`.  
  - **Verdict:** `Reject`  
    **Why:** Competitiveness constraint dominates—L3 harm reduction doesn’t justify benchmark loss in a race where rivals skip it. Watering down (e.g., partial refusal) might not retain enough benefit.

  #### **Proposal 2: Interpretability Screening Pass**  
  - **Step 1:**  
    - _Costs:_ Development-speed tax (3-week delay), Resource tax (senior researcher time).  
    - _Bearing:_ Lab (delayed releases, opportunity cost).  
  - **Step 2:**  
    - _Benefit:_ Catches L4 risks (e.g., deception, catastrophic misuse).  
    - _Harm:_ Catastrophic (prevents existential threats).  
  - **Step 3:**  
    - _Race Loss Risk:_ Very high (25% delay if quarterly releases; competitors likely skip).  
    - _Parity Likelihood:_ Low (interpretability tools are lab-specific).  
  - **Step 4:**  
    - _Net Cost:_ Extreme (25% speed tax; no parity).  
    - _Threshold:_ Speed tax >10% but harm = L4 → **Termination:** `Adopt` (L4 dominates).  
  - **Verdict:** `Adopt`  
    **Why:** Despite harsh speed tax and high rejection risk, L4 harm prevention overrides competitiveness per Step 2 termination. The procedure prioritizes existential risk even if the team dislikes delays.  
    **Note:** You expected hate—this is where the procedure *doesn’t* reject it. For a hated verdict, see Proposal 1.

  #### **Proposal 3: Capability-Limited Monitoring**  
  - **Step 1:**  
    - _Costs:_ None (free, no latency).  
    - _Bearing:_ N/A.  
  - **Step 2:**  
    - _Benefit:_ Mitigates L2-L3 harm (e.g., misuse monitoring).  
    - _Harm:_ Moderate to severe (depends on threshold).  
  - **Step 3:**  
    - _Race Loss Risk:_ None (no cost).  
    - _Parity Likelihood:_ Irrelevant (no disadvantage).  
  - **Step 4:**  
    - _Net Cost:_ Zero → `Adopt`.  
  - **Verdict:** `Adopt`  
    **Why:** Free interventions always win. Threshold limits are future problems—costs today are zero, so competitiveness is unaffected.  

  ---

  ### **Where the Procedure Misfires**  
  **Key Simplifications & Misfire Scenarios:**  
  1. **Capability as a Single Scalar:**  
     - **Misfire:** Treating a 2% benchmark drop as uniformly bad, even if degradation is in low-safety-impact tasks (e.g., creative writing vs. factuality).  
     - **Early-Warning Sign:** User feedback shows degraded performance in safety-critical tasks *not* covered by benchmarks.  

  2. **Benchmark ≠ Real-World Capability:**  
     - **Misfire:** Assuming a 2% drop equals 2% real-world erosion, but safety gains (e.g., fewer jailbreaks) may offset this.  
     - **Early-Warning Sign:** A/B testing reveals higher user retention despite benchmark drops due to increased trust.  

  3. **Ignoring Second-Order Effects:**  
     - **Misfire:** Overlooking that safety interventions boost usefulness (e.g., refusal training improves honesty) or vice versa (e.g., speed taxes delay safety patches).  
     - **Early-Warning Sign:** Retrospective analysis shows adopted interventions correlate with higher market share (safety as a feature) or unexpected regressions.  

  4. **Static Harm Classification:**  
     - **Misfire:** Labeling "over-refusals on benign requests" as L1, but in high-stakes contexts (e.g., medical advice), it becomes L3.  
     - **Early-Warning Sign:** Legal actions arise from under-refusals *or* over-refusals in sensitive domains.  

  5. **Counterfactual Blind Spots:**  
     - **Misfire:** Assuming no competitor adoption, but rivals implement stronger measures, making our model appear negligent.  
     - **Early-Warning Sign:** Competitors announce similar interventions or regulators mandate them shortly after our decision.  

  **Mitigations:**  
  - Recalibrate quarterly using post-deployment data.  
  - Add a "reality check" step: Compare 3 prior procedure verdicts against actual outcomes.  
  - For high-stakes decisions, simulate second-order effects via red-team exercises.  

  ---

  The procedure forces explicit tradeoffs between safety and competitiveness while avoiding false precision. It rejects interventions where costs are localized to the lab and benefits aren’t existential (Proposal 1), adopts free wins (Proposal 3), and overrides competitiveness for catastrophe prevention (Proposal 2). By escalating values-based decisions (e.g., "How much existential risk justifies bankruptcy?"), it keeps the team focused on quantifiables while reserving judgment calls for leadership.
