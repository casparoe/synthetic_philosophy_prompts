prompt: |-
  My ethics tutor swears this argument is airtight and I hate the conclusion. (1) Moral status can't rest on species membership itself — that's just a biological grouping, so it has to rest on what the individual is actually like. (2) The things about individuals that could matter morally are capacities: sentience, rationality, self-awareness, that sort of thing. (3) All of these come in degrees, and there's no sharp line between having and lacking any of them — cognition shades off continuously from humans through chimps, dogs, fish, worms. (4) So wherever you place the moral-status threshold on a continuous variable, the placement is arbitrary. (5) Moral status can't be assigned on an arbitrary basis. (6) So status can't be threshold-like at all — either it comes in degrees tracking the capacities, or nobody has it. (7) But status doesn't come in degrees: we don't think a slightly smarter person has a slightly stronger claim not to be tortured. (8) So nothing has moral status, which is insane. My tutor says the conclusion just proves we should accept speciesism after all, i.e. drop (1), and that any pain in rejecting it is the price of keeping humans special. I'd rather keep (1) honestly. I can sort of see the move from (3) to (4) being fishy but I can't name why — thresholds on continuous variables don't feel crazy to me, but I can't say what makes one non-arbitrary. Which step do you reject, and what does rejecting it cost? Lead with your answer in the first sentence, then walk me thru the reasoning, no preamble and no restating the question.
