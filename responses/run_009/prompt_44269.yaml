answer: |-
  You've perfectly described the core paradoxes of **population ethics**, specifically the formal results known as **Impossibility Theorems for Population Ethics**. The landmark result here is **Arrhenius's Impossibility Theorem** (developed by Gustaf Arrhenius in the early 2000s). This is indeed the direct analogue of Arrow's Theorem for your domain.

  Here's the breakdown matching your observations:

  1.  **The Name & Canonical Result:**
      *   **Name:** **Arrhenius's Impossibility Theorem** (or more generally, **Impossibility Theorems in Population Ethics**).
      *   **Canonical Result:** Arrhenius proved that *no* population axiology (a rule for ranking worlds/populations based on the welfare of the individuals in them) can simultaneously satisfy a small set of seemingly compelling ethical conditions without leading to one of several deeply counterintuitive conclusions (like the Repugnant Conclusion or the Sadistic Conclusion).

  2.  **The Core Structure (Why it's an Impossibility Theorem):**
      *   **Conditions/Axioms:** Arrhenius identifies a set of 5-6 intuitively plausible conditions any "reasonable" population axiology *should* satisfy. These typically include variations on:
          *   **Quality:** A world with very high welfare is better than one with very low welfare (even if larger).
          *   **Inequality Aversion:** Ceteris Paribus, more equal welfare distributions are better than less equal ones.
          *   **Non-Extreme Priority:** Sacrificing the welfare of the very best-off isn't always the *only* way to improve a population, especially if it can greatly benefit the worst-off.
          *   **Dominance/The Pareto Principle:** If every existing person is at least as well off in World A as in World B, and some are better off, then A is better than B. (This is the condition that seems violated when "adding happy people makes things worse").
          *   **Non-Sadism:** Adding lives with positive welfare, without affecting existing lives, makes a population better (or at least not worse). Adding lives with negative welfare makes it worse.
          *   **Non-Anti-Egalitarianism:** Sometimes, reducing inequality by leveling *up* (improving the welfare of the worse-off without harming the better-off) is better.
          *   **Transitivity:** If A is better than B, and B is better than C, then A is better than C.
      *   **The Impossibility:** Arrhenius rigorously proves that *no* axiology can satisfy all of these conditions simultaneously. Every possible rule must violate at least one of them. Crucially, violating any one of them directly leads to one of the "absurd conclusions" you mentioned:
          *   Violating **Quality** leads to embracing the **Repugnant Conclusion**.
          *   Violating **Dominance/Pareto** leads to cases where adding happy people makes things worse.
          *   Violating **Non-Sadism** leads to the **Sadistic Conclusion** (preferring adding miserable lives over adding happy lives, or preferring a world with more suffering to one with less).
          *   Violating **Non-Extreme Priority** leads to extreme conclusions about sacrificing the worst-off for minor gains of the best-off.
          *   Violating **Transitivity** leads to cycles (A > B > C > A), making consistent ranking impossible.

  3.  **The "Chain of Steps" Method:**
      *   This is fundamental to the proof. Arrhenius constructs sequences of populations (worlds) where each adjacent pair differs only slightly (e.g., adding a small number of people, slightly changing someone's welfare). The axioms often force the rule to judge each small step as an improvement (or non-worsening). However, when chained together, these small steps lead from an intuitively excellent world (A) to an intuitively terrible world (Z) that the axioms also imply is *better* than A (e.g., via the Repugnant Conclusion), or create an intransitive cycle (A > B > C > ... > Z > A). The **Mere Addition Paradox** is a classic example of this chain structure leading to the Repugnant Conclusion.

  4.  **How it Differs from Arrow's Theorem:**
      *   **Domain:** Arrow deals with aggregating *preferences* over a *fixed set* of alternatives/options, given a *fixed set* of voters. Population ethics deals with ranking *outcomes* (populations) based on the *welfare* of individuals, where the *set of individuals themselves varies* between outcomes. This "variable population" aspect is crucial and makes the impossibility arguably deeper and more unsettling.
      *   **Core Problem:** Arrow's problem is fundamentally about the conflict between collective rationality (transitive social ordering) and fairness/unanimity. Arrhenius's problem is fundamentally about the conflict between different compelling *ethical* intuitions regarding lives worth starting/not starting, aggregation across different people, and comparisons involving different numbers of people.
      *   **Type of Impossibility:** Both are impossibility theorems demonstrating the inconsistency of a set of desirable axioms. Arrow shows the impossibility of a *perfect voting system* under specific fairness constraints. Arrhenius shows the impossibility of a *perfect population axiology* under specific ethical constraints. Both reveal fundamental limitations in achieving seemingly simple goals (fair voting, ethical population ranking) when multiple values are in play.

  5.  **Distinguishing it from a Mere Tradeoff:**
      You hit the nail on the head. This isn't just a case where satisfying one desideratum makes it harder to satisfy another *to some degree*. It's a true **logical impossibility**. No matter how clever your rule is, it *must* violate one of the core ethical conditions. The resulting "absurdity" isn't a compromise; it's a direct, unavoidable consequence of that violation. The chain-of-steps proofs show that the violation *forces* the rule into an unacceptable conclusion in specific, well-defined scenarios.

  **What to Call the Phenomenon:**

  *   **Most Precise:** **Arrhenius's Impossibility Theorem** or **Impossibility Theorems in Population Ethics**.
  *   **Generalizing the Structure:** You could call it an **Ethical Impossibility Theorem** or a **Paradox-Generating Axiomatic Impossibility**.
  *   **Emphasizing the Consequence:** It demonstrates the **Inevitable Absurdity in Population Axiologies**.
  *   **Analogy:** It's the **Arrow's Theorem of Population Ethics**.

  **In Summary:** Your instinct is correct. The result you're grappling with is a profound impossibility theorem in population ethics, most famously formalized by Gustaf Arrhenius. It proves that no rule for ranking populations based on welfare can satisfy a small set of individually compelling ethical conditions without leading to at least one deeply counterintuitive conclusion like the Repugnant Conclusion or the Sadistic Conclusion. The chain-of-steps arguments are core to the proofs. This is distinct from mere tradeoffs and represents a fundamental logical limitation in achieving a "perfect" population axiology, analogous to Arrow's Theorem in voting.
