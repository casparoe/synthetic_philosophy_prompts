answer: |-
  ### Philosophical Reconstruction of QALY-Based Rationing

  QALY-based cost-effectiveness analysis implicitly adopts a **deprivation account of death's badness**, where death is harmful because it deprives the individual of future life-years containing net positive welfare (QALYs). This is evident in its core mechanics:  
  - **Future-oriented valuation**: A death averted generates QALYs equal to the *expected future welfare* the person would have experienced, weighted for health status.  
  - **Age sensitivity**: Saving younger people yields higher QALY gains because they have more potential life-years to lose, directly reflecting deprivation magnitude.  
  - **Palliative vs. curative asymmetry**: Improving existing life (e.g., better palliative care) is capped at the duration of remaining life, while prevention creates entirely new future welfare streams.  

  **What the practice strictly requires**:  
  1. A **cardinal, interpersonally comparable measure** of health-related welfare (QALYs).  
  2. **Aggregation of individual welfare** across time and populations.  
  3. **Future deprivation as loss**: Death must reduce total welfare by annihilating expected future QALYs.  
  4. **Non-identity irrelevance**: Prenatal nonexistence isn’t a "loss" because there was no prior subject to be deprived.  

  **Compatible rival theories** that could license similar scoring:  
  - **Preference-based accounts**: If individuals strongly prefer survival, QALY gains could represent preference satisfaction.  
  - **Harm-to-others frameworks**: If grief/bereavement costs correlate with the deceased’s lost QALYs (e.g., more grief for young deaths), scoring might align.  
  - **Prior-existence views**: Valuing welfare only for existing persons (ignoring prenatal nonexistence) fits QALY logic without metaphysical commitment.  

  **Internal tensions**:  
  1. **Deprivation vs. equity weights**: Core logic weights lives by remaining QALYs, but "fair innings" adjustments prioritize young patients *even when their remaining QALYs are low* (e.g., terminally ill children). This contradicts the deprivation basis.  
  2. **Asymmetric nonexistence**: Counting posthumous but not prenatal nonexistence as loss conflicts with "age-neutral" welfare ethics—prioritizing the young assumes a "normal life span" entitlement, yet denies symmetrical entitlement to earlier existence.  
  3. **Individualism vs. social value**: While QALYs focus on individual welfare loss, age-weighting smuggles in societal judgments about "deserved" life stages.  

  **Epicurean revision**: Under strict Epicurean premises (death harms no one, as there is no subject to experience loss), averted deaths would *not* generate individual welfare gains. Death prevention might be valued only via:  
  - **Bereavement reduction**: Scoring QALY losses in survivors (e.g., family depression).  
  - **Instrumental benefits**: Maintaining social trust or fulfilling prior preferences. Palliative care would likely dominate life-extension investments, and "averted death" metrics would be replaced by grief-minimization or preference-honoring calculations.  

