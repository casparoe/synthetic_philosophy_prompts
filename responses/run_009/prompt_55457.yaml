prompt: |-
  I'm putting together a short position paper for a graduate workshop on democratic inclusion, and before I circulate it to the group I want a proper consistency check, because I have a suspicion I'm committed to more than I can actually defend as a package. Here is where I've landed. (1) I endorse the all-subjected principle: anyone who is subject to the binding, coercively enforced laws of a collective decision-making body is entitled to a say in that body's decisions, which is why I support voting rights for long-term resident non-citizens and have little patience for the view that political membership is essentially cultural or ethnic. (2) I'm a cosmopolitan about moral status: I think borders are morally arbitrary, that equal concern for persons doesn't stop at a boundary, and that in the long run democratic institutions ought to be organized on something closer to a global scale rather than a state scale. (3) At the same time, I believe democratic authority is more than a decision procedure — it presupposes a bounded people with some baseline of shared history, mutual trust, and a common civic language, since a majority vote among mutual strangers is just external imposition by headcount, and this is also why states can legitimately refuse to be dissolved or merged by a plebiscite of outsiders. (4) I'm confident that future generations, and distant people affected by a state's climate or trade policy, are not wronged by lacking a vote in that state's elections — their claims are real, but they should be met through representation, duties of justice, and judicial review, not enfranchisement. (5) I reject the all-affected principle as hopelessly indeterminate: being affected by a decision can't specify a demos, because nearly everyone is affected, in some attenuated way, by nearly everything.

  So the question I'd like you to work through is: which of these commitments are genuinely in tension with each other, which only look like it, and where does the set become untenable? I'm less interested in a tour of the literature than in an audit of my own position — for each real tension, say how severe it is, what would have to give, and what that concession would cost me elsewhere in the package. A few things I specifically want your judgment on: does the "bounded people" claim in (3) quietly do the cultural-membership work I officially disavow in (1)? Does (4) actually follow from (1) and (5), or am I helping myself to a subjected/affected distinction that (2) won't let me draw cleanly at the global scale? And is there a single revision — to one of the five claims — that would clean up most of the mess, or is the problem structural enough that any fix just relocates it? Please rank the tensions by severity rather than flagging everything equally, and don't assume you know which commitment I'd be most willing to give up, because I honestly don't know.
reasoning: |-
  Okay, the user is preparing a position paper for a graduate workshop on democratic inclusion and wants a consistency check on their five commitments. Let me start by understanding each point clearly.

  First, they endorse the all-subjected principle (1), meaning anyone under a collective's coercive laws should have a say. They support voting rights for long-term residents and reject cultural or ethnic membership as the basis for political inclusion. Then, they're a cosmopolitan (2), viewing borders as morally arbitrary and advocating for global democratic institutions eventually. But they also believe democratic authority requires a bounded people with shared history, trust, and language (3). They argue that future generations and distant people affected by policies like climate change don't need voting rights but should have representation through other means (4). Lastly, they reject the all-affected principle as too vague (5).

  The main tensions seem between (2) and (3). Cosmopolitanism pushes for global inclusion, but (3) insists on bounded communities. How can both coexist? The user might need to adjust the bounded people requirement or redefine it without cultural elements. Then, (1) and (4): if subjected people should vote, why exclude those affected by things like climate policies? The user says they're subjected only if directly coerced, but climate policies might affect people coercively through environmental harm. This needs clarification. Also, (3) might introduce cultural elements through "shared history and language," which conflicts with (1)'s rejection of cultural membership. They need to ensure these are procedural, not cultural. 

  The user's deeper need is to present a coherent argument without contradictions. They might fear that their bounded people claim undermines their cosmopolitan stance. They also need to defend why some groups are excluded from voting despite being affected. I should prioritize tensions, suggesting possible adjustments and their costs. The key is to make (3)'s requirements minimal and procedural, clarify the subjected/affected distinction, and acknowledge where compromises are necessary.
answer: |-
  Here’s a systematic audit of your position, ranking tensions by severity and identifying potential fixes. Your core commitments reveal a sophisticated but ultimately unstable equilibrium—primarily due to friction between cosmopolitanism and democratic boundedness. I’ll flag **three severe tensions**, **two moderate ones**, and suggest targeted repairs.

  ---

  ### **Severe Tensions (Threaten Coherence)**
  1. **Cosmopolitanism (2) vs. Bounded Democratic Authority (3)**  
     - **Conflict**: (2) demands institutions transcending state boundaries, while (3) insists democracy *requires* boundedness with shared identity/trust. This creates a *democratic trilemma*: you can’t simultaneously have (a) global scope, (b) meaningful democratic authority, and (c) rejection of cultural/ethnic membership.  
     - **Severity**: Critical. (3) functionally blocks (2)’s institutional realization. If "shared history" and "common civic language" are prerequisites, cosmopolitan democracy becomes impossible—global populations lack these bonds.  
     - **What must give**: Either dilute (3) to *minimal procedural prerequisites* (e.g., mutual commitment to rules, not thick identity) or accept that (2) is aspirational with no institutional path.  
     - **Cost**: Diluting (3) risks making democracy "thin" (headcount imposition you criticize); abandoning (2)’s institutional ambition undermines cosmopolitan consistency.

  2. **All-Subjected Principle (1) vs. Exclusion of Future/Distant Persons (4)**  
     - **Conflict**: Climate/trade policies coercively subject distant people and future generations to harm (e.g., sinking islands, resource depletion). (1) suggests they’re entitled to a say, but (4) denies this. Your subjected/affected distinction collapses here: climate laws *directly and coercively* reshape lives.  
     - **Severity**: High. (4) appears ad hoc unless you define "subjected" *extremely narrowly* (e.g., only direct territorial jurisdiction). But (2)’s moral universalism resists such arbitrariness.  
     - **What must give**: Either expand "subjected" in (1) to include *transnational coercion* (undermining (5)), or concede some "subjected" agents lack voting rights (weakening (1)’s authority).  
     - **Cost**: Expanding (1) forces engagement with all-affected’s indeterminacy; narrowing "subjected" contradicts (2)’s equal concern.

  3. **Rejection of All-Affected Principle (5) vs. Cosmopolitanism (2)**  
     - **Conflict**: (5) dismisses all-affected as unworkable due to overinclusion, but (2) insists borders are arbitrary. If borders don’t matter morally, why use territorial "subjection" (reliant on borders) as the franchise criterion?  
     - **Severity**: High. Your demos-bounding tool (subjection) relies on the very borders (2) calls arbitrary. This privileges existing states while (2) condemns their moral relevance.  
     - **What must give**: Either reframe (1) as a *practical proxy* (not moral ideal) for global democracy, or soften (5) to allow *context-specific* all-affected applications.  
     - **Cost**: Treating (1) as provisional weakens its normative force; qualifying (5) opens indeterminacy debates you sought to avoid.

  ---

  ### **Moderate Tensions (Manageable with Clarification)**
  4. **Bounded People (3) vs. Anti-Cultural Membership (1)**  
     - **Apparent Conflict**: (3)’s "shared history/language" sounds cultural, contradicting (1)’s rejection of ethnic/cultural membership.  
     - **Resolution Potential**: **Salvageable** if you specify these as *procedural*, not cultural: e.g., "shared history" = institutional experience; "common language" = *lingua franca* for deliberation, not heritage.  
     - **Risk**: If "trust" requires cultural affinity, it smuggles in the exclusion you oppose. **Solution**: Explicitly decouple trust from ethnicity (e.g., trust built via fair institutions).  
     - **Cost of Clarity**: Forces thinner, institutional conception of peoplehood—may weaken (3)’s critique of "headcount" democracy.

  5. **All-Subjected (1) vs. Democratic Authority (3)**  
     - **Apparent Conflict**: Granting non-citizen residents voting rights (per (1)) might erode the "shared identity" (3) deems essential.  
     - **Resolution Potential**: **Easily fixed** by noting that inclusion *builds* shared identity through participation. Long-term residents become co-authors of the "shared history."  
     - **Risk**: None if you frame (3) dynamically. Your existing view already supports this via enfranchising residents.

  ---

  ### **The Single Most Efficient Revision**
  **Reframe (3) to emphasize *political* (not cultural) boundedness**:  
  > *"Democratic authority requires a *constituted polity* with institutional continuity, reciprocal accountability, and communicative capacity—all achievable through pluralist civic integration, not pre-political identity."*  

  **Why this helps**:  
  - Neutralizes the clash with (1) by removing cultural overtones.  
  - Aligns with (2) by making boundedness *functional* (could scale globally if institutions allow reciprocity/communication).  
  - Explains (4): Distant/future people lack institutional reciprocity with current voters.  
  - Softens tension with (5): "Subjection" becomes one (contestable) way to define the polity, not a moral absolute.  

  **Cost**: Forces you to accept that "headcount" votes *can* be legitimate if procedural conditions are met—undercutting (3)’s original critique of plebiscitary dissolution. You’d need new arguments against forced mergers.

  ---

  ### **Overall Stability Assessment**
  Your position is **defensible but precarious**. The core instability is using state-derived tools (subjection, boundedness) to pursue a post-state ideal (cosmopolitan democracy). The revision above makes your view **internally consistent** but **vulnerable externally**:  
  - **Strengths**: (1) and (5) cohere well; (4) is tenable if subjected/affected is clarified.  
  - **Weaknesses**: (2) and (3) remain in tension—now a practical, not logical, problem (how to build trust in global institutions?).  
  - **Biggest Unresolved Issue**: Why is territorial coercion the only type that triggers voting rights? If a state’s climate policy coercively displaces people (e.g., via droughts), haven’t they "subjected" them? **You need a rigorous theory of coercion** to defend (1)/(4) against (2).

  ---

  ### **Recommendations for Your Paper**
  1. **Explicitly define "subjected"**: Distinguish *direct institutional coercion* (voting required) from *structural effects* (addressed via representation/judicial review).  
  2. **Clarify "shared" in (3)**: Specify it as *civic*, not cultural—e.g., "commitment to common institutions."  
  3. **Acknowledge the cosmopolitan trilemma**: Admit that reconciling (2) and (3) requires reimagining democracy at scale, not just expanding states.  

  This package remains distinctive and provocative—leaning into the tensions with transparency may be your best defense.
