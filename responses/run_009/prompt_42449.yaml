prompt: |-
  My mate and I had a massive argument last night after a few beers. I work in compliance for a UK engineering firm that does a lot of infrastructure work abroad, and I was telling him about how half my job is deciding whether a gift or payment we're asked to make abroad is a bribe or just... how things are done there. He reckoned that calling our whole gift-giving and favour-doing culture corrupt is just cultural imperialism -- that the line between a clientelism that holds societies together and corruption that rots them is something WE drew, mostly to label non-Western practices as dirty. I pushed back but honestly it got messy, because he had a point that a "facilitation payment" to get a customs official to do their job looks different depending on where you're standing, and that plenty of perfectly legal lobbying back home looks a lot like what we prosecute foreigners for.

  So heres what I want from you. Write me a decision procedure I can actually use when one of our project managers comes to me with a questionable request -- the questions to ask in order, what counts as a sufficient answer at each step, where the procedure says no outright, and crucially where it has to admit the question is a values judgement rather than a compliance one, because that last category is exactly where my mate thinks I'm pretending to have objective answers. Ground it in whatever the actual philosophy of corruption says -- the difference between a gift and a bribe, whether the wrongness is in the exchange itself or in the institutional harm it does, whether reciprocity norms make some of this not bribery at all -- but keep it usable by someone who hasn't read any of that. Then run it on three cases: (1) a government client's procurement official expects a "consulting fee" to his brother's company before our bid gets shortlisted, (2) our local partner insists on giving the minister who approved our project a substantial retirement gift, which everyone there says is normal and refusing would humiliate him and probably cost us the follow-on contract, and (3) we hire the nephew of a senior official as a local liaison at a market salary, he's actually decent at the job, and my colleague says that's just how networks work there and we'd do the same with an MP's kid at home. Be honest about where the procedure would let my mate's argument in the door, and whether there's any version of it that isn't just laundering my cultural priors as process.

  Please write in British English. And keep it readable -- I'll take honesty about hard bits over false tidiness.
reasoning: |-
  Okay, let me tackle this user's request. They work in compliance for a UK engineering firm and need a practical decision procedure for distinguishing bribes from acceptable gifts in international contexts. The core challenge is balancing ethical compliance with cultural sensitivity after an argument about cultural imperialism. 

  First, I need to establish the philosophical grounding. The user wants this rooted in corruption theory but kept usable. Key concepts include: the quid pro quo test (direct exchange), institutional harm versus social cohesion, and whether reciprocity norms change the nature of the act. The procedure must flag where judgments are value-based rather than purely compliance-driven.

  For the structure, I'm considering a staged approach: 
  1) Start with bright-line legal prohibitions under UK Bribery Act 2010 (like facilitation payments being illegal regardless of local norms). 
  2) Then assess intent - is this about bypassing due process? 
  3) Evaluate harm - does it distort institutions or just fulfill social expectations? 
  4) Finally, acknowledge gray areas where Western frameworks may clash with local practices.

  The three test cases are perfect for pressure-testing: 
  Case 1 (consulting fee) clearly fails - it's a quid pro quo with a hidden beneficiary. 
  Case 2 (retirement gift) is tougher - it's post-facto and culturally expected, but still risks institutional harm. 
  Case 3 (nephew hire) sits in the gray zone - defensible if truly merit-based, but requires extra scrutiny.

  Crucially, I'll highlight where the procedure exposes value judgments: 
  - When "normal" practices still undermine institutional integrity 
  - When refusing might cause disproportionate offense 
  - Whether market-rate payments sanitize nepotism

  The user's mate has a point about Western bias, so I'll explicitly call out steps where cultural relativism could reasonably challenge the outcome - like Case 2 where the procedure says "no" despite cultural norms. The honesty they want means admitting that some calls are ethical choices disguised as process.

  British English reminders: "mate" not "buddy", "reckoned" not "figured", "whilst" not "while". Keep sentences tight but conversational - they prefer messy truth over false neatness.
answer: |-
  Right, let's crack this. Your mate landed some solid punches – the line *is* blurrier than we sometimes admit, and waving the "corruption" flag can look suspiciously like cultural high-handedness. But compliance isn't just philosophy; it's about staying out of prison and protecting the firm. The key is building a procedure that **acknowledges the grey zones honestly** while giving you defensible "Go/No Go" calls where possible, grounded in *why* bribery is wrong, not just because it's illegal.

  **The Philosophical Grounding (Simplified):**

  1.  **The Core Wrong:** The fundamental wrong in bribery isn't *always* the exchange itself (gift-giving is universal). It's the **corruption of a duty** and the **harm to institutions**.
  2.  **Quid Pro Quo vs. Reciprocity:** A bribe involves a *specific, illicit exchange*: "I pay you *so that* you misuse your official power for my benefit." Genuine reciprocity or gift-giving within social norms lacks this direct, corrupting link to an official act. It's diffuse, social, not transactional.
  3.  **Harm Focus:** The primary harm is **distortion**. It undermines fair competition, erodes trust in public institutions, diverts resources, and replaces merit/rules with patronage. If an exchange *doesn't* cause this harm (debatable, but possible), it sits differently.
  4.  **Intent & Perception:** Why is the payment/gift being made? How would a reasonable person (locally *and* internationally) perceive it? Perception of impropriety can be damaging even if intent is murky.
  5.  **The UK Bribery Act 2010 is King:** Regardless of local norms, the Act applies globally to UK companies. Facilitation payments (small payments to officials to perform routine functions they *should* do anyway) are **illegal**. Gifts/favours intended to induce improper performance are illegal. "It's normal here" is not a defence.

  **The Decision Procedure: "The Duty & Distortion Test"**

  Ask these questions **in order**. Stop and say "NO" if any step fails outright. If you get to the end, it's likely a "NO" or a very high-risk "Proceed with Extreme Caution & Full Disclosure". Crucially, note **where the values judgment kicks in**.

  1.  **The Bright Line Test:**
      *   **Question:** Is this payment/gift/favour directly linked to obtaining or retaining business, or securing an improper advantage? Is it a "facilitation payment" (speed money for routine govt action)?
      *   **Sufficient Answer:** "Yes" = **IMMEDIATE NO. STOP.** (UK Bribery Act violation is clear cut).
      *   **Values Judgment?** Minimal. This is core illegal bribery/facilitation payment. Your mate's cultural argument *doesn't apply here* under UK law. This is the objective line.

  2.  **The Beneficiary Test:**
      *   **Question:** Who is the *ultimate beneficiary*? Is it a public official (or close family member/associate) acting in their official capacity? Is the recipient someone in a position to influence a decision *benefiting the firm*?
      *   **Sufficient Answer:** "Yes, it's a public official or their close associate/family, *and* they are involved in a decision affecting us" = **PROCEED TO STEP 3 (High Risk)**. "No, it's a genuine vendor/client unrelated to official decisions, or a purely personal gift unconnected to business" = **Potential YES, but proceed to Step 4 for due diligence**.
      *   **Values Judgment?** Some. Defining "close associate" can be culturally fuzzy. However, the *link to official power* is key. Paying the official's brother's company (Case 1) clearly targets the official's influence.

  3.  **The Quid Pro Quo & Intent Test:**
      *   **Question:** Is there a *direct or implied understanding* of a specific favour in return? ("We give X, so you do Y"). Is the timing suspicious (just before/after a key decision)? Is the value disproportionate to any legitimate service rendered or social norm? What's the *stated reason* for the payment/gift? Is it plausible?
      *   **Sufficient Answer:**
          *   "Yes, there's a clear expectation of a specific improper act" = **IMMEDIATE NO. STOP.** (Bribery).
          *   "No clear *specific* improper act, but the value/timing is highly suspicious, or the stated reason seems flimsy/cover" = **STRONG LEAN TO NO.** (High risk of being perceived/construed as bribery).
          *   "No, it's framed as a customary gift/retirement present/courtesy, no *specific* favour is expected *in return for this specific thing*, and the value is within accepted local norms for such occasions" = **PROCEED TO STEP 4 (But still high risk).**
      *   **Values Judgment?** **Significant.** This is where your mate's argument bites hardest. What counts as "disproportionate"? What defines "customary"? The UK Act cares about *intent to induce improper performance*. Judging intent/implied understanding across cultures is inherently subjective. You *must* gather local insight but apply a UK/global ethical lens too. This step often lacks a purely objective answer.

  4.  **The Transparency & Legitimacy Test:**
      *   **Question:** Can this payment/gift be recorded accurately, transparently, and legitimately in our accounts? Can we obtain a proper invoice/receipt? Does the recipient's organisation allow it? Would we be comfortable if this appeared on the front page of the FT or was disclosed to the UK authorities?
      *   **Sufficient Answer:**
          *   "No, it needs to be hidden, cash-in-hand, no receipt, or violates the recipient's own rules" = **IMMEDIATE NO. STOP.** (Huge red flag).
          *   "Yes, it can be properly recorded, invoiced, and declared internally/externally if needed" = **PROCEED TO STEP 5.**
      *   **Values Judgment?** Some. Defining "properly recorded" has standards. However, the inability to be transparent is a major objective red flag.

  5.  **The Distortion & Harm Test (The Crucial Grey Zone):**
      *   **Question:** **Even if it passes Steps 1-4,** what is the *actual and likely* consequence? Does it:
          *   Distort fair competition? (Give us an unfair advantage others can't access?)
          *   Undermine the proper functioning of public institutions? (Make officials act for private gain, not public good?)
          *   Create an expectation of future improper favours?
          *   Damage our reputation significantly if known?
          *   **Conversely:** Is it purely symbolic? Genuinely expected within local *social* (not corrupt) norms? Refusing would cause disproportionate offence *without* materially changing the institutional outcome? Does it *actually* hold a legitimate social fabric together in that context?
      *   **Sufficient Answer:** **This is almost entirely VALUES JUDGMENT.**
          *   Clear answers of "Yes" to the distortion/harm questions = **STRONG LEAN TO NO.**
          *   Clear answers of "No" to distortion/harm, and strong evidence it's genuinely non-distorting social reciprocity = **Potential YES, but HIGH RISK & requires CEO/Board Level Approval + Full Documentation.**
          *   Ambiguous/Mixed = **LEAN HEAVILY TO NO.** The risks almost always outweigh the perceived benefits.
      *   **Values Judgment?** **Extreme.** This is the heart of your mate's critique. You are *explicitly* making a judgment call about institutional harm vs. social cohesion, filtered through your (and the firm's) ethical framework and UK legal context. There is no purely objective, culture-neutral answer here. The procedure forces you to *confront* this ambiguity rather than hide it.

  **Procedure Summary:**

  1.  **Bright Line?** (Illegal Quid Pro Quo/Facilitation?) **YES = NO.**
  2.  **Beneficiary an Official/Influencer?** **NO = Due Diligence (Step 4). YES = Proceed.**
  3.  **Quid Pro Quo/Improper Intent?** **YES = NO.** Suspicious/Implied? **LEAN NO.** Customary/No Specific Favour? **Proceed (High Risk).**
  4.  **Transparent & Recordable?** **NO = NO.** **YES = Proceed.**
  5.  **Causes Distortion/Harm?** **YES/Probably = LEAN NO.** **No/Truly Social = HIGH-RISK YES (Top Approval).** **Ambiguous = NO.**

  **Applying the Procedure to Your Cases:**

  1.  **"Consulting Fee" to Official's Brother's Company for Bid Shortlisting:**
      *   **Step 1:** Directly linked to obtaining business/advantage? **YES.** IMMEDIATE NO. (Bright Line violation). *Stop. No cultural argument gets in here. This is pure bribery.*
  2.  **Substantial Retirement Gift to Minister who Approved Project:**
      *   **Step 1:** Linked to improper advantage? Timing is *highly* suggestive (just after approval), but not *explicitly* for a future act *yet*. Not a facilitation payment. Proceed.
      *   **Step 2:** Beneficiary? **YES** (Senior Official). Proceed (High Risk).
      *   **Step 3:** Quid Pro Quo/Intent? Strongly implied ("cost us the follow-on contract"). Value likely disproportionate to a mere retirement gift. Stated reason ("normal", "humiliation") masks the underlying expectation of favour. **LEAN STRONGLY TO NO.** (High risk of being seen as inducement for future favour). *Your mate's "cultural norm" argument enters here, but the link to official power and future business makes it too direct and distorting. The procedure pushes back.*
      *   *(Steps 4 & 5 largely moot after Step 3 lean, but...)*
      *   **Step 4:** Could it be transparent? Probably not without causing offence/defeating the purpose. **Another NO flag.**
      *   **Step 5:** Distortion/Harm? **YES.** Creates expectation of favour for follow-on contract, undermines fair process for that contract, uses firm resources to reward past favour (distorting the initial decision retrospectively). **CLEAR NO.** *Values judgment confirmed: Institutional harm outweighs cultural norm.*
      *   **VERDICT: NO.**
  3.  **Hiring Official's Nephew at Market Salary, Competent:**
      *   **Step 1:** Linked to improper advantage? Not *directly* payment for a specific favour. Nepotism isn't automatically bribery. Proceed.
      *   **Step 2:** Beneficiary? **YES** (Relative of official who could influence us). Proceed (High Risk).
      *   **Step 3:** Quid Pro Quo/Intent? **Tricky.** Hiring *itself* is the "favour" to the official. Is there an *implied* understanding of future official favour? Competence *helps* but doesn't erase the conflict. Value (salary) is legitimate *if* truly merited. Stated reason ("how networks work") is common, but masks potential for improper influence. **AMBIGUOUS - Major Values Judgment Zone.** *This is where your mate's argument has the most traction: "networks work differently, we'd hire an MP's kid." The procedure forces you to confront the ambiguity.* Proceed cautiously.
      *   **Step 4:** Transparent & Recordable? **YES.** Can be done openly with contract, salary benchmarking. **Green light here.**
      *   **Step 5:** Distortion & Harm? **The Crux.**
          *   *Harm:* Potential for future pressure on the nephew/official, perception of favouritism undermining meritocracy internally/externally, *could* distort future decisions if official feels indebted.
          *   *Mitigation:* Genuine competence, market salary, clear job description, firewalls from uncle's influence/decisions, robust conflict-of-interest declaration/management. Is this *just* using a network (common everywhere) or *buying* influence?
          *   *Social Cohesion?* Networks *are* important in many cultures. Refusing *might* offend, but less directly than refusing a gift. Competence matters.
          *   **JUDGMENT CALL:** This sits firmly in the grey zone the procedure highlights. A strict compliance view might say "Avoid all appearances of impropriety - NO." A pragmatic view considering competence, transparency, and local norms might say "Proceed with EXTREME caution and safeguards - HIGH-RISK CONDITIONAL YES."
      *   **VERDICT:** **NO Clear Answer - High-Risk Values Judgment.** The procedure forces you to:
          *   Document rigorous proof of competence & market salary.
          *   Implement strict conflict-of-interest controls (nephew has no role involving uncle's department/official business).
          *   Obtain explicit written approval from Legal/CEO documenting the risks and rationale.
          *   Continuously monitor.
          *   **Likely Outcome for a cautious compliance officer:** Advise against unless the business case is overwhelming and safeguards are ironclad. The risk often outweighs the benefit. But the procedure *explicitly* shows this isn't a clean compliance "no"; it's an ethical risk assessment laundering your priors (risk aversion, institutional integrity focus) through a process.

  **Honesty About the Procedure:**

  *   **Where Your Mate Gets In:** Steps 3 (Quid Pro Quo/Intent) and especially Step 5 (Distortion/Harm) are the gates. Here, cultural context ("normal here," "social glue," "networks") directly challenges the Western-derived concepts of "improper performance," "distortion," and "institutional harm." The procedure forces you to *engage* with that argument explicitly, not ignore it. It admits that defining harm vs. cohesion is a values judgment.
  *   **Is it Laundering Cultural Priors?** Partially, yes. The UK Bribery Act and the underlying philosophy prioritise institutional integrity, transparency, and meritocracy. These *are* Western values. The procedure inherently weights these heavily, especially in Step 5. However:
      *   It starts with an objective legal line (Step 1).
      *   It forces explicit consideration of local context and potential non-harm (Step 5).
      *   It flags the judgment calls transparently ("This is the Values Judgment Step").
      *   It doesn't automatically say "local custom = ok," but demands an assessment of *harm* even within that custom.
  *   **The Safeguard:** The requirement for **transparency and record-keeping (Step 4)** is a powerful objective filter. Truly benign social reciprocity usually *can* withstand scrutiny. Things needing secrecy are almost always corrupt.

  **Final Thought:** No procedure eliminates the grey. This one aims to give you clear "NOs" where possible (Bright Lines, Obvious Quid Pro Quo, Lack of Transparency), force explicit risk assessment where it's murky (Intent, Harm vs. Norms), and demand senior accountability for the hairiest judgment calls. It makes the cultural relativism argument visible in the process rather than letting it be an unexamined veto. Ultimately, your job is to protect the firm within the UK legal framework – this procedure aims to do that while acknowledging the uncomfortable complexities your mate rightly pointed out. Keep the documentation meticulous, especially when you hit Step 5. Good luck. Next round's on him?
