prompt: |-
  here's where I've landed on rational belief and I want to know if it hangs together before I bring it to my epistemology reading group: (1) all-or-nothing belief isn't just credence above a threshold — you can be 99.99% confident in something and still not believe it, because belief requires the kind of non-accidental support that knowledge needs; (2) whether it's rational to believe p depends only on the relation between p and your evidence, not on what else you happen to believe alongside it; (3) rational belief is closed under conjunction — if you rationally believe each of a bunch of claims and notice that you do, you rationally believe them all together; (4) in a million-ticket fair lottery it's irrational to believe your own ticket will lose; (5) a careful author can rationally believe every single claim in her book while also rationally believing that at least one claim in it is false; (6) it's fine to act on things you don't believe — I'd happily take even money that my ticket loses without beleiving it will. Which of these actually pull against each other, which only look like they do, and what's the cheapest revision? Please rank the tensions by severity instead of treating everything as equally bad, and be specific about what would have to give in each case.
