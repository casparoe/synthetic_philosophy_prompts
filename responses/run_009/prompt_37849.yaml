  | **Existence of Unique Symmetric Measures** | For problems with sufficient symmetry, there exists a unique invariant measure that the Principle of Indifference can legitimately pick out, and this measure is the correct representation of ignorance. | Even in symmetric settings, the existence of a unique invariant measure does not imply that it represents ignorance; it is merely a convention that may be useful but is not forced by rationality alone. |
  | **Probability as Representation of Ignorance** | Probabilities can be meaningfully assigned to represent ignorance about an unknown event, and such assignments can be objectively determined by the symmetries of the problem. | Probabilities require a well-defined random process; without one, there is no fact of the matter about the probability, and claims about probabilities in ignorance are either false or rest on arbitrary choices. |

  **3. Cruxes**

  We identify the following cruxes. For each, we state a test that we both agree bears on the issue and our respective predictions.

  3.1. **Question**: Does a rotational symmetric emission pattern in the photon randomizer uniquely determine the probability of the chord length being greater than the side of the inscribed triangle?  
     **Agreed Test**: Consider a device that fires photons from the center of a circular screen with a rotationally symmetric emission pattern. A chord is drawn between the two points where consecutive photons land. What is the probability that the chord is longer than the side of the inscribed equilateral triangle?  
