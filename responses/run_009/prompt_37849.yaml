prompt: |-
  Two friends of mine have been fighting about Bertrand's paradox for literally two years and finally agreed to do a proper adversarial collaboration, and I've been drafted to write up the joint statement. One of them (call her the Reformer) thinks the principle of indifference is basically right but needs the right constraints or the right domain (equiprobable partitions, invariant measures, maximum entropy, whatever the fix turns out to be). The other (the Skeptic) thinks the whole tradition of getting probabilities out of ignorance is a mistake -- indifference either gives inconsistent answers or, once you fix it, is smuggling in real information and no longer deserves the name.

  Please draft the document they should be able to sign. I want:

  1. A numbered section of claims BOTH accept -- about the formal facts (the chord problem, what Bertrand's argument actually shows, the cube factory-style cases, the fact that different symmetric-looking procedures give different answers), about what a defensible principle here would have to do, and about which moves (invariance requirements, maximum entropy, stipulating a physical generation process) fail or succeed at what.

  2. A disagreements table where every row is phrased so that the side it describes would accept the wording as a fair statement of their own view. The Skeptic's rows shouldn't say "the principle is vague," the Reformer's shouldn't say "the Skeptic just wants frequencies."

  3. The cruxes -- the subquestions such that settling one would move at least one of them -- and for each crux, an argument, case, or thought experiment they'd BOTH agree bears on it, with each side's prediction written down in advance. Feel free to use this one they cooked up that I never fully followed: imagine a physical randomizer that fires photons from the center of a circular screen with a rotationally symmetric emission pattern, and a chord is drawn between the two points where consecutive photons land. Does the physical setup answer the 1/3, 1/2, 1/4 question, and does answering it that way vindicate indifference or just quietly replace it with model-building? They disagreed about what this case even shows, so I want to see how you'd nail that down.

  4. An honest verdict on which parts of their dispute are substantive and which are verbal -- e.g., whether they're even using "probability" to mean the same thing when the Reformer says "the chance is 1/3 given this protocol" and the Skeptic says "there's no fact of the matter."

  Then after the document itself, give me a structured summary as a JSON object with this schema:

  - "agreed_claims": array of strings, one per agreed claim, keyed to the numbered section
  - "disagreements": array of objects, each with fields "topic", "reformer_wording", "skeptic_wording"
  - "cruxes": array of objects, each with fields "question", "agreed_test", "reformer_prediction", "skeptic_prediction"
  - "verbal_disputes": array of strings describing which parts of the fight you diagnosed as merely verbal, with a one-line why

  Keep it good-faith -- neither of them is an idiot, and the Reformer is well aware of the inconsistent-answer problem, so dont give her some naive version of the principle. And the Skeptic does accept ordinary probability theory once a model is fixed; her complaint is about the pre-model step.
