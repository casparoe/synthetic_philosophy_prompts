prompt: |-
  ok so some context: I'm a first-year PhD student and just got handed my own discussion section for the first time — intro course on rational choice, about 20 students, 75 minutes. My week's topic is Parfit's hitchhiker and the cluster around it: rational irrationality, commitment, credibility, why being (or seeming) irrational can pay. The topic also got weirdly personal for me last month: back in January I asked a collegue to cover one of my grading shifts because I was travelling, and sealed it by promising to cover her shift in April. April rolls around, its a gorgeous weekend, and I'm standing there realizing: past me made a promise that present me now has to eat the cost of, and if she'd known I'd be this rational about it in April she'd never have covered me in January. Apparently that's the whole point of the literature, but I felt it before I could name it, and that's what I want for the students.

  Design me a game that gets them there. Requirements, roughly:

  - No real money — points or tokens, maybe a silly leaderboard. But at the moment of paying, paying has to be strictly dominated: it costs you points and you get literally nothing back. They should feel the "why on earth would I" pull in their own heads, not just see it on a handout.
  - Two roles, hitchhikers and drivers, multiple rounds so reputations can form. Drivers choose whom to take.
  - Crucially: I want dispositions dealt like cards. Some students get a sealed card that says they keep promises even when it costs them; some get a card that says they're fully rational and will not pay once paying is pointless. They don't get to pick. I'm hoping the finding emerges on its own: the fully rational ones can't get rides.
  - A cheap-talk phase — hitchhikers get 30 seconds to say whatever they want to the driver before the driver decides. I want to know if talk works, and whether it works differently for the two card types.
  - A commitment device they can purchase: sign a binding card at a small upfront cost, and I act as the referee and enforce it. I want to see if demand for it only shows up after the first failure, which is the part I find most interesting.
  - Don't reveal the philosophical point up front. No lecture, the name can come out in the debrief if at all.
  - The debrief has to map specific moments in the game onto the distinction between the rationality of acts and the rationality of dispositions/characters, and onto one-shot vs repeated play. And it has to be honest about what the game can't reproduce — in the game your character is dealt to you, in life you can't just decide to be someone who keeps promises at a cost, or can you? I'd rather that part be said out loud to me than papered over.
  - Also tell me what will predictably go wrong the first time I run it. I've never facilitated anything before, so include the novice-facilitator stuff too: rules disputes, kids colluding outside the rules, the one person who thinks its hilarious to defect every round, me fumbling the explanation.
  - One last thing: give me the payoff table as something I can just put on a slide, because I will absolutely botch explaining it out loud. And maybe a sentence or two on where this debate actually lives so I don't sound like an idiot when a student asks "wait, so is being rational bad?" — but keep it light, I don't want the debrief turning into a lecture on constrained maximization.
reasoning: |-
  We are designing a classroom game to illustrate Parfit's hitchhiker, rational irrationality, and commitment. The game should have two roles: hitchhikers and drivers. Multiple rounds will allow reputations to form. Dispositions are assigned via cards: some hitchhikers are "committed" (they keep promises even when costly) and some are "rational" (they break promises when it's costly and no future benefit). Drivers choose which hitchhiker to pick up. Hitchhikers can engage in cheap talk and can purchase a commitment device (a binding card enforced by the instructor) at a small upfront cost.

  Key elements:
  - Payoff structure: Paying should be strictly dominated at the moment of payment (costs points with no return).
  - The game should run for several rounds to allow for reputation effects.
  - The debrief should connect game experiences to the rationality of acts vs. dispositions, and one-shot vs. repeated interactions.

  Game Design:

  1. **Setup**:
     - Students are divided into two groups: hitchhikers (about 2/3 of the class) and drivers (about 1/3). The ratio can be adjusted so that there are more hitchhikers than drivers (e.g., 12 hitchhikers and 8 drivers for 20 students). Each round, each driver will pick one hitchhiker to "give a ride".
     - Each hitchhiker is secretly dealt a disposition card at the beginning of the game (and keeps it for the entire game). The card is either:
          - **Committed**: "You always keep your promises. If you promise to pay, you must pay when the driver asks, even if it costs you points."
          - **Rational**: "You are rational and self-interested. You only pay if it benefits you. Since paying costs you and you get nothing back at the moment of payment, you will not pay unless you think it will help you get future rides (but note: the game may end after any round)."
     - Drivers do not get any disposition card. Their goal is to maximize their own points.

  2. **Rounds**:
     - The game will have a fixed number of rounds (e.g., 5 rounds). At the beginning of each round, hitchhikers and drivers are randomly paired (but not necessarily one-to-one; drivers choose from the hitchhikers). Alternatively, we can have a "matching market" where drivers approach hitchhikers.

     However, to make it more dynamic, we can structure each round as follows:

     a. **Cheap Talk Phase (30 seconds per driver-hitchhiker pair?)**:
          - Actually, we can have a "market" phase: all hitchhikers are in the room, each driver moves around and can talk to any hitchhiker for a short time (say 30 seconds per interaction). But with 8 drivers and 12 hitchhikers, that might be chaotic. Alternatively, we can have a "speed dating" style: drivers rotate among hitchhikers in fixed time intervals? But that might be too structured.

     Instead, let's do:

          - Each round, drivers and hitchhikers are randomly assigned to small groups. For example, if we have 8 drivers and 12 hitchhikers, we can form 8 groups (each with 1 driver and 1-2 hitchhikers). Then, within each group, the hitchhiker(s) get 30 seconds to talk to the driver. Then the driver chooses one hitchhiker from the entire set? That doesn't work because the driver only sees a subset.

     Alternatively, we can have:

          - Each driver stands at a "station". Hitchhikers move around and can talk to any driver for up to 30 seconds. Then, each driver writes down the name of the hitchhiker they choose. But with 12 hitchhikers and 8 drivers, each driver might be approached by multiple hitchhikers simultaneously? That could be chaotic.

     We need a manageable procedure. Let's try:

          - Each round, each hitchhiker can approach one driver and have a 30-second conversation. If a driver is approached by multiple hitchhikers, the hitchhikers form a queue. The instructor can time 30 seconds per conversation. After all conversations, each driver chooses one hitchhiker. If a driver is not approached by any hitchhiker, they don't give a ride (but we can avoid this by having more hitchhikers than drivers).

     But note: we want drivers to have a choice. So we can have:

          - Each driver can be approached by up to, say, 3 hitchhikers (if there are 8 drivers and 12 hitchhikers, that works). The instructor can announce: "Hitchhikers, you have 1 minute to approach drivers and have 30-second conversations. Each driver can only talk to one hitchhiker at a time. If there is a queue, we'll do multiple cycles."

     This might be messy. Alternatively, we can do:

          - **Announcement phase**: Each hitchhiker has 10 seconds to make a public announcement (to all drivers) about why they should be picked. Then drivers choose. But that loses the one-on-one cheap talk.

     Given the constraints, I propose:

          - **Cheap Talk Phase**: All participants are in one room. Drivers are seated at tables (or stand in fixed spots). Hitchhikers move freely. The phase lasts 3 minutes. During this time, hitchhikers can talk to any driver, but each driver can only talk to one hitchhiker at a time. Hitchhikers can queue. After 3 minutes, each driver writes down the name of the hitchhiker they choose (if any). Then the instructor collects choices.

     This might be chaotic but is manageable.

  3. **Commitment Device**:
     - At the start of each round (or at the beginning of the game?), hitchhikers can purchase a commitment device. The device is a card that says: "I promise to pay if you give me a ride. This promise is binding: if I break it, the instructor will deduct double the payment from me and give it to the driver." The hitchhiker must pay a small upfront cost (say, 1 point) to get this card for the round. They can only use this device once per round (if they get a ride, they must pay if they have the device). They show the card to the driver during the cheap talk phase? Or they announce it? They can show it during the cheap talk.

     - The commitment device is available for purchase at the beginning of each round (before the cheap talk). The instructor sells it for 1 point (deducted immediately). The hitchhiker then holds the card and can show it to drivers as proof of commitment.

  4. **The Ride and Payment**:
     - After drivers choose, each chosen hitchhiker gets a ride (and both get base payoffs). Then, the driver decides whether to ask for payment (which is optional for the driver? Or in the original story, the driver expects payment). We can set: the driver always asks for payment (because they were promised?).

     But wait: the hitchhiker might have promised? How do we model?

     We can have:

          - During the cheap talk, hitchhikers can make promises (verbally or via the commitment device). Then, if the driver picks a hitchhiker who promised to pay, the driver will ask for payment. If the hitchhiker did not promise, then no payment is expected.

     However, we want to mirror the story: the driver saves the hitchhiker and then asks for payment. So:

          - The driver always gives a ride to the chosen hitchhiker. Then, after the ride, the driver can ask for payment (if they want). But in the story, the driver expects payment because of the promise. So we can say: the driver only asks for payment if the hitchhiker made a promise (either verbally or via the commitment device). Otherwise, they don't.

     Alternatively, to simplify: we can have the driver always ask for payment if the hitchhiker promised (and the promise can be made during cheap talk, with or without the device). Without a promise, the driver doesn't ask.

     - **Payment step**: If the driver asks for payment (because the hitchhiker promised), then the hitchhiker must decide whether to pay (unless they have the commitment device, in which case they must pay). If they have the commitment device, the payment is automatic. If they don't, then they can choose to pay or not.

     - **Payoffs for a ride**:
          - Driver: gets 2 points for giving a ride (regardless of payment) and an additional 3 points if they receive payment.
          - Hitchhiker: gets 5 points for getting a ride (they are saved!) but loses 3 points if they pay.

          So without payment: 
            Driver: 2 points
            Hitchhiker: 5 points

          With payment:
            Driver: 2+3 = 5 points
            Hitchhiker: 5-3 = 2 points

          But note: the hitchhiker only pays if they promised (and are asked). If they didn't promise, they don't pay and get 5 points, and the driver gets 2 points.

          Also, if a hitchhiker is not chosen, they get 0 points for that round (and the driver who didn't pick anyone gets 0? Or we can say drivers must pick someone? Let's say drivers must pick one hitchhiker to avoid 0, but if no one approaches? We'll ensure each driver is approached by at least one?).

          We can adjust: drivers don't have to pick if they don't want. But then drivers might skip if they don't trust anyone? That's realistic. So:

            - If a driver picks a hitchhiker: 
               - If the hitchhiker promised and the driver asks for payment (which they will if the promise was made? Actually, the driver can choose to ask or not? But in the story, the driver relies on the promise. So let's assume the driver always asks for payment if a promise was made, and does not ask if no promise was made. The promise is made during the cheap talk.

          So the driver's payoff depends on whether they get paid. They prefer to pick a hitchhiker who will pay.

          How does the driver know if a promise was made? They should remember from the cheap talk. But we can have the hitchhiker state whether they promise or not. We can require that during the cheap talk, the hitchhiker must clearly state if they are making a promise (and if they have the commitment device, they show it and that is a binding promise). Also, they can make a non-binding promise (just verbally).

          Therefore, we have two types of promises:
            - Binding: via the commitment device (costs 1 point upfront, and payment is enforced)
            - Non-binding: just verbal

          Then, the driver will ask for payment if the hitchhiker made any kind of promise (binding or non-binding). For a binding promise, the hitchhiker must pay (and loses 3 points). For a non-binding promise, the hitchhiker can choose to pay (losing 3 points) or not.

  5. **Payoff Table**:

     We can present the payoffs as follows:

     | Action | Driver Payoff | Hitchhiker Payoff |
     |--------|---------------|-------------------|
     | **Driver picks hitchhiker and no promise was made** | 2 points | 5 points |
     | **Driver picks hitchhiker, promise made, and hitchhiker pays** | 5 points (2+3) | 2 points (5-3) |
     | **Driver picks hitchhiker, promise made (non-binding), and hitchhiker does not pay** | 2 points (they gave the ride but didn't get paid) | 5 points (they got the ride and didn't pay) |
     | **Driver picks hitchhiker with binding promise** | 5 points (they get paid) | 2 points - 1 point (for the device) = 1 point? Or: they pay 3 and already paid 1 for the device? |

     Actually, the binding promise: the hitchhiker pays 1 point upfront for the device. Then, if they get a ride and the driver asks (which they will because of the promise), they automatically pay 3 points. So total cost for hitchhiker: 1 (upfront) + 3 (payment) = 4 points. They get 5 points for the ride, so net: 1 point.

     Without the device, if they make a non-binding promise and then pay: 5 - 3 = 2 points.

     Without the device, if they make a non-binding promise and don't pay: 5 points.

     Without any promise: 5 points.

     But note: without a promise, the driver might not pick them? So the hitchhiker might get 0.

     So the hitchhiker faces a trade-off: making a promise (binding or not) might increase the chance of being picked, but then they face the cost.

     Also, for the driver: they prefer to pick a hitchhiker who they believe will pay. So they will look for signs of trustworthiness.

  6. **Dispositions and Decisions**:
     - **Committed hitchhiker**: If they make a non-binding promise, they will always pay. They might not need the commitment device because they are going to pay anyway. But they might use the device to signal their commitment? However, they are already committed. They might choose not to make a promise? But then they might not get picked. Alternatively, they can make a non-binding promise and then pay (costing them 3 points, but they get 5, so net 2). They don't have to buy the device because they are going to pay anyway.

     - **Rational hitchhiker**: They will break a non-binding promise if it is in their interest (i.e., they won't pay). But if they break a promise, drivers might not trust them in the future. They might use the commitment device to make a binding promise and thereby get rides. But the device costs 1 point and then they have to pay 3, so they only get 1 point. Without the device, they could make a non-binding promise and then not pay, getting 5 points, but then they might not be trusted again.

     The rational hitchhiker must weigh the immediate gain of 5 points (by not paying) against the loss of future rides.

  7. **Game Flow**:

     - **Round Structure**:
       1. **Purchase Phase (1 minute)**: Hitchhikers can purchase a commitment device for the round (cost: 1 point). The device is only valid for the current round.
       2. **Cheap Talk Phase (3 minutes)**: Hitchhikers approach drivers and talk. They can make promises (non-binding) and/or show a binding commitment card if they bought one.
       3. **Driver Choice (1 minute)**: Drivers write down the name of the hitchhiker they choose (if any).
       4. **Ride and Payment (2 minutes)**:
            - For each chosen hitchhiker:
               - If they made a promise (binding or non-binding), the driver asks for payment.
               - If they have a binding commitment: the payment is automatically taken (3 points from hitchhiker, given to driver). The hitchhiker also already paid 1 point for the device.
               - If they made a non-binding promise: the hitchhiker decides whether to pay (unless they are committed by disposition, in which case they must pay). Rational hitchhikers can choose not to pay.
            - The instructor records the outcomes and updates the scores.
       5. **Scoreboard Update**: The instructor updates a public scoreboard (with pseudonyms? or real names? We can use real names to build reputation).

     - The game runs for 5 rounds.

     - **End of Game**: The instructor announces the winners (top scorers) and then moves to debrief.

  8. **Debrief Points**:

     - **Rationality of Acts vs. Dispositions**:
          - Ask the committed hitchhikers: how did it feel to have to pay? Did you ever wish you could break the promise? But you couldn't because of your disposition.
          - Ask the rational hitchhikers: did you ever break a promise? What happened in the next rounds? Did drivers stop trusting you?
          - Point: The "rational" type (who breaks promises when it is costly) might do well in a one-shot game, but in repeated interactions, they lose out because they cannot build trust. The committed type, even though they pay a cost in the short term, can get more rides in the long run.

     - **Cheap Talk and Commitment Devices**:
          - Did drivers believe non-binding promises? Did that change over rounds?
          - Did hitchhikers buy the commitment device? When? (After being distrusted? After breaking a promise?) Why?
          - Point: The commitment device allows rational types to mimic the committed type by pre-committing. But note: in real life, we don't have an external enforcer. However, we might have social norms, contracts, etc.

     - **What the game cannot capture**:
          - In real life, we can choose to cultivate a disposition (e.g., by practicing honesty, or by setting up habits). But once you have the disposition, you might not be able to turn it off. The game assigned dispositions randomly, but in life we have some control over our character.

     - **The Philosophical Point**:
          - The game illustrates that being rational in every single action (act-by-act) can lead to worse outcomes than having a disposition that commits you to irrational acts (like keeping a costly promise). This is the idea of "rational irrationality" or the rationality of having a disposition. It also relates to the concept of commitment in game theory (Schelling) and the idea of constrained maximization (Gauthier).

     - **Answering "Is being rational bad?"**:
          - In a one-shot interaction, breaking the promise is rational and gets you more points. But in repeated interactions, being seen as rational (in the act-by-act sense) can be bad because others won't trust you. So it's about the context. Sometimes, being the kind of person who is predictably irrational (in keeping promises) can be instrumentally rational.

  9. **What Can Go Wrong**:

     - **Rules Disputes**: 
          - A hitchhiker might argue that they didn't technically promise. Be clear: during cheap talk, if they say "I promise" or anything similar, it counts. If they show the binding card, that's a promise. Otherwise, no promise.
          - How to handle if a driver doesn't pick anyone? They get 0. But we can encourage them to pick.
          - Time management: the cheap talk phase might run over. Use a timer and be strict.

     - **Collusion**:
          - Students might try to team up: "I'll always pick you if you promise and then I won't ask for payment." But that defeats the purpose. Say: drivers are self-interested and want to maximize their points. They should ask for payment if a promise was made because they get 3 extra points.

     - **The Joker**:
          - One student (rational) might break every promise and then laugh. But then they won't get picked in later rounds. That's part of the lesson. You can point out in debrief: "What happened to the person who broke their promise every time? Did they get many rides?"

     - **Facilitator Fumbling**:
          - Practice the explanation. Have a slide with the payoff table and step-by-step rules.
          - Run a test round with a small group before the actual game.

     - **Other Issues**:
          - The commitment device might be too expensive? Or too cheap? Adjust the costs in practice.
          - If the game has too many committed types, then rational types might get away with breaking promises because drivers don't know who is who. But that's realistic: in the beginning, drivers don't know. Reputation builds over time.

  10. **Payoff Table Slide**:

     ```
     Payoffs:

     For a driver:
       - Gives a ride without any promise: 2 points
       - Gives a ride and receives payment: 5 points
       - Gives a ride but does not receive payment (after a non-binding promise): 2 points

     For a hitchhiker:
       - Gets a ride without having made a promise: 5 points
       - Gets a ride and pays (either by choice or by binding device): 
            - If they used a binding device: 1 point (5 - 3 - 1 = 1)
            - If they paid without a device: 2 points (5 - 3)
       - Gets a ride and breaks a non-binding promise: 5 points
       - Not chosen: 0 points

     Additional:
       - Buying a binding commitment device costs 1 point (deducted at purchase, regardless of being chosen).
     ```

     But note: if a hitchhiker is not chosen, they get 0 and if they bought the device they still lose the 1 point? Yes. So they might end at -1 for that round.

  11. **Logistics**:

      - Have a scoreboard (whiteboard or projected spreadsheet) to update after each round.
      - Prepare disposition cards (in sealed envelopes so others don't see) for hitchhikers.
      - Prepare commitment device cards (maybe index cards) that the instructor can issue.
      - Timer for each phase.

  This design should create the tension for hitchhikers: if they are rational, they are tempted to break a non-binding promise and get 5 points, but then they might be avoided in future rounds. Committed hitchhikers will pay and get only 2 points (if they don't use the device) but can build a reputation. Drivers will learn over rounds to look for trustworthy hitchhikers or those with binding commitments.

  The game should illustrate the value of commitment and the potential failure of act-by-act rationality in repeated interactions.
answer: |-
  Below is a comprehensive game design tailored to your needs. I'll break it down into **Game Structure**, **Payoff Table**, **Logistics**, **Anticipated Problems**, and **Debrief Points**.

  ---

  ### **Game Name**: "Desert Drive Dilemma"
  *(Avoids referencing "Parfit" upfront to keep discovery organic)*

  ---

  ### **Game Structure**  
  *Total Time*: 60-70 mins (5 rounds + debrief)  
  *Participants*: 20 students → **12 Hitchhikers** (HH), **8 Drivers** (D). Adjust ratios if needed.  

  #### **Setup**  
  1. **Assign Roles & Dispositions**  
     - Randomly assign 12 students as HH, 8 as D.  
     - Give each HH a **secret disposition card** (sealed envelope):  
       - **COMMITTED (6 cards)**: *"You ALWAYS keep promises. If you promise to pay, you MUST pay when asked (even if it costs you)."*  
       - **RATIONAL (6 cards)**: *"You maximize your points. You pay ONLY if it benefits you. If paying costs points and gains nothing, you WON’T pay."*  
     - Drivers get no card → They act in self-interest.  

  2. **Tokens & Scoring**  
     - Use **plastic tokens** (or tally points) → No real money.  
     - Starting tokens: **10 tokens/player**.  
     - Public **"leaderboard"** (nicknames only, e.g., "HH-7", "D-3") to track scores.  

  3. **Commitment Device**  
     - **"Binding Oath Card"**: Costs 1 token upfront. If bought, HH signs it and gives it to you (the referee). You enforce payment if they promise and get a ride.  
     - Available for purchase **at the start of each round**.  

  ---

  ### **Round Flow** (Repeat for 5 rounds)  
  1. **Purchase Phase** (2 mins)  
     - HH decide to buy a **Binding Oath Card** (1 token) → You record purchases.  

  2. **Cheap Talk** (3 mins)  
     - Drivers stand at "checkpoints" (desks around the room).  
     - HH approach drivers (1:1 or small groups). HH have **30 seconds/driver** to pitch:  
       *"I’ll pay you!"* / *"I have an Oath Card!"* / *"Trust me!"*  
     - HH can **show Oath Cards** (if bought) but **CANNOT reveal disposition cards**.  

  3. **Driver Choice** (2 mins)  
     - Each driver chooses **ONE HH** to "drive" (or none).  
     - Record pairs publicly (e.g., "D-1 picks HH-4").  

  4. **Ride & Payment** (3 mins)  
     - **IF** HH promised (verbally or via Oath Card) during Cheap Talk:  
       - Driver **automatically asks for payment** (no choice → mirrors Parfit’s driver).  
       - HH **MUST pay 3 tokens** if:  
         - They have a **Binding Oath Card** (enforced by you), **OR**  
         - They are **COMMITTED** (disposition card).  
       - **RATIONAL** HH with **no Oath Card** choose: **pay 3 tokens or refuse**.  
     - **IF** HH **did NOT promise**: No payment occurs.  
     - **Payoffs distributed** (see table below).  

  5. **Score Update** (2 mins)  
     - Update leaderboard. Reset driver positions for next round.  

  ---

  ### **Payoff Table**  
  *(Project this slide during the game)*  

  | **Situation**                          | **Hitchhiker (HH) Payoff**      | **Driver (D) Payoff**        |  
  |----------------------------------------|----------------------------------|------------------------------|  
  | HH gets a ride, **NO promise made**    | +5 tokens                        | +2 tokens                    |  
  | HH **promised**, **pays**              | +5 - 3 = **+2 tokens**           | +2 + 3 = **+5 tokens**       |  
  | HH **promised**, **refuses payment**   | +5 tokens                        | +2 tokens                    |  
  | **Binding Oath Card used** (HH pays)   | +5 - 3 - 1 = **+1 token**        | +2 + 3 = **+5 tokens**       |  
  | HH **not chosen**                      | 0 tokens                         | 0 tokens                     |  

  **Key Notes**:  
  - **Paying is strictly dominated** when it gains nothing: HH lose 3 tokens for no personal benefit.  
  - **Binding Oath Card** costs 1 token upfront (paid even if not chosen).  

  ---

  ### **Logistics**  
  - **Materials**: Tokens (poker chips/buttons), disposition cards (sealed), Oath Cards (index cards), timer, public scoreboard.  
  - **Space**: Clear room for drivers to stand at "checkpoints," HH to move freely.  
  - **Facilitation Script**:  
    - *"You’re hitchhikers stranded in a desert. Drivers can save you... but only if they believe you’ll pay. Each round, make choices to maximize your tokens."*  
    - **Never mention "rationality," "Parfit," or "commitment"** until debrief.  

  ---

  ### **Anticipated Problems & Solutions**  
  1. **"Why would I pay? It’s dumb!"** (HH refusal) → **Expected!** Let RATIONAL HH refuse → They’ll see consequences in later rounds (no rides). Use as debrief example.  

  2. **Collusion** (e.g., "I’ll pay you extra next round!"):  
     - Ban side deals: *"No token transfers outside payoffs. Only talk in Cheap Talk phase."*  

  3. **The Joker** (defects every round):  
     - Let them! Drivers will stop picking them → Natural lesson on reputation.  

  4. **Rules Confusion**:  
     - **Preempt**: Walk through a **practice round** with 1 driver/1 HH.  
     - **Fumbling Fix**: Keep printed rules/payoff table visible. Pause to clarify.  

  5. **Time Crunch**:  
     - Assign a student as "timekeeper." Cut Cheap Talk to 20 sec if needed.  

  6. **Driver Bias** (picking friends):  
     - Use anonymous nicknames (HH-1, D-1) on leaderboard.  

  7. **Oath Card Overuse**:  
     - If HH buy cards recklessly, they’ll go bankrupt → Self-correcting.  

  ---

  ### **Debrief Framework** (10-15 mins)  
  **Goal**: Connect game moments to theory **without lecturing**. Use Socratic Q&A:  

  1. **"What happened?"**  
     - *"Why did some HH never get rides after Round 1?"* → Reputation.  
     - *"Did Oath Cards work? When did people buy them?"* → After trust failed (R1→R2).  

  2. **Map to Concepts**:  
     - **Rational ACTS vs. Dispositions**:  
       *"RATIONAL HH refused payment (act rationally) but lost future rides. COMMITTED HH ‘irrationally’ paid... but got more rides. When is ‘irrationality’ rational?"*  
     - **One-shot vs. Repeated**:  
       *"In Round 1, RATIONAL HH won big. By Round 5, they were stranded. Why?"* → Repeated play rewards trust.  

  3. **The Personal Hook** (Your story):  
     *"Remember when I mentioned my broken promise in April? That was ‘act rationality’ clashing with ‘disposition rationality.’ Past me wished present me was COMMITTED!"*  

  4. **Honest Limitations**:  
     - *"In life, you can’t choose a disposition card. Can you BECOME ‘committed’? Can habits/friendships force ‘irrational’ honesty? That’s the real debate."*  

  ---

  ### **Answering "Is Rationality Bad?"**  
  **Light Response**:  
  *"Not ‘bad’—but context matters. In one-off deals, maximizing gains makes sense. In repeated games (friendships, careers), being ‘predictably irrational’ (keeping promises when it hurts) builds trust. Philosophers like Gauthier call this ‘constrained maximization.’ It’s rational to *sometimes* be irrational!"*  

  **Sources to Name (if asked)**:  
  - David Gauthier (*Morals by Agreement*), Parfit (*Reasons and Persons*), Schelling (commitment devices).  

  ---

  ### **Why This Works**  
  - **"Why on earth would I pay?"** emerges organically when RATIONAL HH face payment.  
