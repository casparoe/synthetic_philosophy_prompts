  ### Session Design: Collective Choice Paradoxes in Action

  #### **Overview**
  This 90-minute seminar immerses students in a committee simulation where they experience two collective choice paradoxes. The first round replicates the discursive dilemma (without naming it) using fixed judgment profiles. The second round demonstrates an agenda effect in preference aggregation. Students are ambushed by counterintuitive outcomes, setting up a debrief that ties back to your admissions committee experience. The session avoids technical jargon until the end.

  ---

  ### **1. The Game Itself**
  #### **Materials Needed**
  - **Role Cards** (14 sets, one per student)  
    - *Round 1 (Judgment Aggregation)*: Cards for "Applicant 1" with judgments on three premises (Writing, Fit, Preparation) and a conclusion (Admit = Writing ∧ Fit ∧ Preparation).  
    - *Round 2 (Agenda Effect)*: Cards for "Policy Vote" with ranked preferences for three options (A, B, C).  
  - **Voting Mechanism**: Physical ballots or a simple app (e.g., Google Forms) to hide patterns until tallied.  
  - **Whiteboard** to record votes and reveal paradoxes.  
  - **Timer** (for structured voting).  

  #### **Round 1: Fixed Judgment Profiles (Discursive Dilemma)**  
  - **Premises & Conclusion**:  
    - Writing (W): "The writing sample is strong."  
    - Fit (F): "The applicant fits the program."  
    - Preparation (P): "The applicant is adequately prepared."  
    - Conclusion (Admit): Admit if **W ∧ F ∧ P**.  
  - **Assigned Profiles (14 Students)**:  
    - 3 Type A: W=Yes, F=Yes, P=Yes → Admit=Yes  
    - 4 Type B: W=Yes, F=Yes, P=No → Admit=No  
    - 4 Type C: W=Yes, F=No, P=Yes → Admit=No  
    - 3 Type D: W=No, F=Yes, P=Yes → Admit=No  
  - **Voting Procedure**:  
    1. **Premise-Based Vote**:  
       - Students vote on W, F, P individually (ballots hide peers' votes).  
       - Tally: Majority approves each premise (W: 11 Yes, F: 10 Yes, P: 10 Yes).  
       - Announce: "Applicant passes all criteria → Admit!"  
    2. **Conclusion-Based Vote**:  
       - Students vote directly on Admit (ballots again).  
       - Tally: 3 Yes, 11 No → "Applicant rejected!"  
  - **Ambush**: Students see the same applicant admitted via premises but rejected via conclusion. Reveal profiles on the whiteboard to show no individual holds all three Yes votes.  

  #### **Round 2: Agenda Effect (Condorcet Cycle)**  
  - **Policy Options**: Three funding proposals:  
    - A: Arts initiative  
    - B: STEM lab  
    - C: Community outreach  
  - **Assigned Preferences (14 Students)**:  
    - 5 Students: A > B > C  
    - 4 Students: B > C > A  
    - 5 Students: C > A > B  
  - **Voting Procedure**:  
    1. **Agenda 1: A vs. B first, then winner vs. C**  
       - A vs. B: A wins (5+5=10 > 4).  
       - A vs. C: C wins (4+5=9 > 5) → **C wins**.  
    2. **Agenda 2: B vs. C first, then winner vs. A**  
       - B vs. C: B wins (5+4=9 > 5).  
       - B vs. A: A wins (5+5=10 > 4) → **A wins**.  
  - **Ambush**: Same preferences, different outcomes based on vote order.  

  #### **Preventing Coordination**  
  - Assign roles randomly and privately.  
  - Ban discussion during voting (emphasize "sincere judgments").  
  - Use ballots/app to hide votes until tallied.  

  ---

  ### **2. Stakes That Are Felt**  
  - **Scoring System**:  
    - Each student earns a point if:  
      - *Round 1*: Committee’s **final decision on Admit** matches their sincere judgment on Admit.  
      - *Round 2*: Committee’s **chosen policy** matches their top choice.  
  - **Why It Works**:  
    - In Round 1, Type A students (Admit=Yes) win if premise-based voting is final, but lose if conclusion-based is used. Types B/C/D win in the opposite case. This mirrors the tension between criteria and overall judgment.  
    - In Round 2, only 5 students win per agenda, creating high stakes (e.g., Arts supporters lose under Agenda 1 but win under Agenda 2).  
  - **Avoids Triviality**: Outcomes depend on aggregation rules, not raw majorities.  

  ---

  ### **3. Debrief: Connecting to Theory and Your Experience**  
  **Timing**: Last 25 minutes. Reveal formal terms only at the end.  
  - **Map Activity to Concepts**:  
    - **Round 1**:  
      - *Premise-Based Aggregation*: "We derived Admit from individual criteria. The group ‘admitted’ without anyone fully supporting it."  
      - *Conclusion-Based Aggregation*: "We voted on Admit directly, and it failed despite passing all criteria."  
      - *The Gap*: "No individual saw inconsistency, but the group’s verdict contradicted every member’s logic."  
    - **Round 2**:  
      - *Agenda Dependence*: "No one changed their mind, but voting order changed the outcome."  
  - **Link to Your Admissions Meeting**:  
    - "In my committee, we used premise-based aggregation: we passed the applicant on each criterion but rejected them overall. Today, you saw why – the majorities for criteria didn’t overlap. We had a ‘distributed majority’ like your Type B/C/D profiles."  
    - Show your whiteboard reconstruction:  
      ```  
      Writing: ✔ (11 Yes)  
      Fit:    ✔ (10 Yes)  
      Prep:   ✔ (10 Yes)  
      Admit:  ✘ (3 Yes)  ← Conclusion-based rejection  
      ```  
  - **Formal Terms**: Finally name the **doctrinal paradox** (Round 1) and **agenda manipulation** (Round 2).  

  ---

  ### **4. Failure Modes and Mitigation**  
  - **Students Seeing Through the Design**:  
    - Mitigate by using abstract scenarios (e.g., "Policy A/B/C" vs. real policies) and randomized roles.  
  - **Abstentions**:  
    - Require full participation; assign roles compellingly (e.g., "You’re a tough critic on Preparation").  
  - **Discussion**:  
    - **Forbid Deliberation** in Round 1 to preserve the paradox. If students talk, they’ll align judgments and "solve" the dilemma (e.g., Type B/C/D might compromise to reject).  
    - **Trade-off**: Lost opportunity to model real committees, but gains a clean paradox. Acknowledge this in debrief: "Real groups escape through debate, but today we exposed the raw mechanics."  
  - **Other Risks**:  
    - Misunderstanding ballots → Use simple icons (✅/❌) and rehearse with a test vote.  
    - Tie votes → Use odd groups or add a chair’s vote.  

  ---

  ### **5. Limits of the Activity**  
  - **Endogenous Judgments**:  
    - **The Core Limit**: In real committees, judgments are shaped by the aggregation rule itself (e.g., knowing criteria are pivotal changes how members vote). Assigned profiles can’t replicate this strategic behavior.  
  - **Other Missing Elements**:  
    - **Dynamic Deliberation**: Real committees use debate to resolve conflicts (e.g., "If you support Writing, you should admit!").  
    - **Non-Binary Judgments**: Criteria often use scales, not yes/no.  
    - **Power Imbalances**: Senior members sway opinions.  
  - **Debrief Compensation**:  
    - "In reality, profiles aren’t fixed – they’re warped by the rules we use. Today’s game shows the *structure* of the paradox, but my admissions meeting had the *messiness* of human negotiation."  

  ---

  ### **Session Flow**  
  1. **Intro (5 min)**: Frame as a "committee simulation"; assign roles privately.  
  2. **Round 1 (25 min)**: Vote on Applicant 1 (premises → conclusion → reveal paradox).  
  3. **Round 2 (25 min)**: Vote on Policy (two agendas → reveal agenda effect).  
  4. **Scoring (5 min)**: Tally points; highlight who won/lost due to rules.  
  5. **Debrief (25 min)**: Whiteboard analysis → map to theory → your admissions story → name concepts.  
  6. **Conclusion (5 min)**: "These paradoxes aren’t flaws – they’re inherent to group decisions. Now you’ve felt them."  

  This design ensures students experience the reversal viscerally, priming them for deeper theory in your seminar. The staged ambush, stakes, and debrief will make your admissions committee story resonate.
