  We are drafting a joint statement between a computationalist (C) and an anti-computationalist (A) after an adversarial collaboration. The goal is to have a document that both can sign, clarifying ambiguities, stating agreements and disagreements, and identifying cruxes with testable predictions.

  ### 1. Disambiguation of Terms

  **Agreed Definitions:**

  - **Computation (as Abstract Automaton):** A formal process defined over abstract states (e.g., states of a Turing machine) by a set of rules (transition function) that map inputs and current states to outputs and next states. This is a mathematical object, independent of physical implementation.

  - **Computation (as Physical Symbol Manipulation):** A physical process that instantiates an abstract automaton by having physical states that are reliably mapped to formal states and that transition according to the automaton's rules. This requires a clear mapping from physical states to formal states and causal transitions that mirror the formal rules.

  - **Computation (as Causal Organization):** A physical system whose causal structure is isomorphic to the structure of an abstract automaton. The system's state transitions are driven by the physical properties that realize the formal states and rules.

  **The Debate Is About:**

  The debate centers on whether the brain is a computer in the sense of **Physical Symbol Manipulation** or **Causal Organization** that implements an abstract automaton sufficient for mind. Specifically, we are debating whether the brain's operation is best described as executing a formal computation (with states and transitions that can be captured by a program) and whether such a formal description is necessary and sufficient for mental phenomena.

  **Confirmation:**

  - **C:** "I hold that the brain is a computer in the sense of Physical Symbol Manipulation and Causal Organization. I maintain that a physical system that implements the right kind of abstract automaton (with the right computational properties) is sufficient for mind. My view survives this disambiguation because I argue that the brain's causal structure is indeed isomorphic to a formal computation that gives rise to mind."

  - **A:** "I hold that computation, as an observer-relative description, is a way we interpret physical systems, but it is not intrinsic to the system. What matters for mind is the specific biological and physical organization of the brain, which cannot be fully captured by formal-state talk. My view survives because I deny that the brain's mind-producing properties depend on the implementation of a formal automaton; instead, they depend on the concrete biological details."

  ### 2. Agreed Claims (Non-Vacuous)

  Both parties agree on the following:

  1. **Turing Machines and Formal Automata:** Turing machines and other formal automata are abstract mathematical objects. They are defined by their states, transition rules, and inputs/outputs, and they can be implemented in various physical substrates (multiple realizability in principle). However, not every physical system can be said to implement a given automaton without constraints on the mapping.

  2. **Neural Implementation:** Neuroscience has established that the brain processes information via electrochemical signals in neurons and synapses. The brain's operation can be modeled at multiple levels (molecular, cellular, circuit, system) and these models often use computational terminology (e.g., neural coding, information processing). However, the brain's physical processes are continuous, stochastic, and massively parallel, which differs from typical digital computers.

  3. **Multiple Realizability (Empirical Matter):** Multiple realizability is an empirical hypothesis: it is possible in principle to have different physical systems that exhibit the same input-output behavior and even the same internal state transitions (as per an abstract automaton). However, whether multiple realizability holds for mental states (including subjective experience) is not settled. Both parties agree that if multiple realizability fails for mental states (i.e., if only biological brains can have experiences), that would support A; if it holds (e.g., if a silicon brain emulation has experiences), that would support C.

  4. **Dead Versions:** 
     - A naive computationalist view that ignores implementation details (e.g., "any system that computes the same function as a brain must have experiences, regardless of how it is built") is dead because of the implementation problem (e.g., a lookup table that mimics the brain's input-output behavior without internal states).
     - A naive anti-computationalist view that denies any role for information processing in the brain is dead because neuroscience shows that neural activity is information-bearing and causal to behavior.

  ### 3. Disagreements (Stated in Each Side's Terms)

  | Disagreement | Computationalist (C) Statement | Anti-Computationalist (A) Statement |
  |--------------|--------------------------------|--------------------------------------|
  | **Nature of Mind** | Minds arise from the implementation of the right kind of abstract computation. The specific physical substrate is irrelevant; only the formal structure matters. | Minds arise from the specific biological and physical properties of the brain. Formal computation is an incomplete description that misses the essential physical and biological properties necessary for mind. |
  | **Sufficiency of Computation** | Any physical system that implements the abstract automaton corresponding to a mind (e.g., a brain emulation) will have the same mental states, including subjective experiences, regardless of the substrate. | Implementing the abstract automaton is insufficient for mind. The physical substrate (e.g., biological neurons) and the continuous, analog, stochastic nature of neural processes are essential for mental states. |
  | **Observer-Relativity** | The computation implemented by a physical system is an objective feature of that system, determined by its causal structure. It is not observer-relative. | The attribution of computation to a physical system is always relative to an interpreter who assigns meanings to states and transitions. Without an interpreter, there is no intrinsic computation. |

  ### 4. Cruxes and Constraints

  **Crux: The Implementation Problem**

  - **Problem:** If mappings between physical states and formal states are arbitrary, any physical system can be interpreted as implementing any finite automaton, which trivializes computationalism.

  **Constraints on State Mappings:**

  - **C's Endorsed Constraint:** A physical system implements a computation only if there is a **causal isomorphism**: the physical state transitions must be causally driven by properties that correspond to the formal states and rules, and the mapping must be natural (not gerrymandered). The system must have distinct physical states that reliably correspond to distinct formal states and transition in accordance with the rules.

  - **A's Endorsed Constraint:** Even with a causal isomorphism, the physical system must have the **right kind of physical properties** (e.g., biological, chemical, continuous) to support mind. Formal state mappings are insufficient because they abstract away these properties.

  **Predictions under Scrutiny:**

  - **C predicts:** Under scrutiny, A's constraint (requiring specific physical properties) will either reduce to a requirement for causal isomorphism (which C accepts) or become an arbitrary restriction (e.g., carbon chauvinism) that cannot be justified.
    
  - **A predicts:** Under scrutiny, C's constraint (causal isomorphism) will be shown to be too permissive, allowing systems that are clearly non-minded (e.g., a system with causally isomorphic but extremely slow state transitions) to be considered as having experiences.

  ### 5. Concrete Cases and Predictions

  Both parties agree that the following cases bear on the cruxes. For each, we state whether there is "something it is like" to be the system.

  | Case | Computationalist (C) | Anti-Computationalist (A) | Where They Diverge |
  |------|----------------------|---------------------------|-------------------|
  | **Neuromorphic Analog Chip:** A chip that emulates a brain at 1/1000th speed with continuous, noisy state variables, using analog components. | **Yes.** The system implements the same causal structure as the brain, just slower. Speed and noise are implementation details. | **No.** The chip lacks the biological properties and real-time interactions essential for mind. The extreme slowdown disrupts the causal dynamics necessary for experience. | C focuses on structural isomorphism; A on physical/biological properties and real-time dynamics. |
  | **Giant Lookup Table:** A system that precomputes all possible inputs and outputs of a human brain over a lifetime. For any input, it outputs the pre-stored response. | **No.** The system does not implement the causal structure of the brain. There are no internal state transitions driven by the input; it's just a memory recall. | **No.** This system lacks any causal organization resembling a brain. It's a static mapping. | Agreement on "no", but for different reasons: C because of no causal isomorphism; A because of no biological properties and no causal dynamics. |
  | **Geographically Distributed Network:** A brain emulation where each "neuron" is a separate computer connected over the internet, with communication delays (e.g., 100ms per signal). | **Yes, but degraded.** The causal structure is preserved, but delays may fragment experience. If delays are minimized, full experience. | **No.** The spatial distribution and delays disrupt the unified, real-time causal dynamics necessary for consciousness. | C allows for distributed implementation if causal structure is preserved; A requires unified physical embodiment and real-time interactions. |
  | **Embodied Robot vs. Disembodied System:** An embodied robot with rich sensorimotor loops vs. a disembodied system with identical internal processing (e.g., a brain in a vat fed the same inputs). | **Both can have experiences.** The internal processing is the same. Embodiment affects the content of experience but not its existence. | **Only the embodied robot might have experiences.** The brain in a vat lacks the embodied interaction with the world, which is essential for grounding mental content and consciousness. | C: experience depends only on internal computation; A: embodiment and interaction are essential. |

  ### 6. Closing: Residual Disagreements and Future Moves

  **Substantive vs. Verbal Disagreements:**

  - **Verbal:** The parties agree that some disputes about "computation" are verbal (e.g., when "computer" is used in the abstract automaton sense, both agree the brain can be modeled as such). The substantive disagreement is whether the physical realization of a computation (with causal isomorphism) is sufficient for mind.

  - **Substantive:** The core disagreement is ontological: does mind arise from formal structure alone (C) or from specific physical properties (A)? This is not merely verbal because it leads to different predictions about novel systems (e.g., brain emulations).

  **What Would Move the Debate:**

  Both parties agree that the following would move the debate:

  - **Empirical Evidence:** Building a brain emulation (e.g., whole-brain emulation) and testing whether it exhibits behavioral and neural correlates of consciousness. If it does, C is supported; if not, A is supported.

  - **Theoretical Development:** A rigorous theory of consciousness that either (a) shows how subjective experience arises from formal computations alone (supporting C) or (b) demonstrates the necessity of specific biological mechanisms (supporting A).

  - **Crux Cases:** Resolving the status of the concrete cases above (e.g., the neuromorphic chip) through experiments or refined theories.

  **Joint Statement Closing:**  
  "We, the undersigned, have engaged in this adversarial collaboration to clarify our positions and identify the core disagreements. We commit to updating our views based on the outcomes of the crux cases and future developments. We encourage the scientific community to focus on these empirical and theoretical questions."

  **Signatures:**  
  [Computationalist]  
