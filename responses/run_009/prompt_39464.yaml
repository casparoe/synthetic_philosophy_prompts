answer: |-
  ### Joint Statement: Computationalism vs. Anti-Computationalism  
  **After Adversarial Collaboration**  
  *Signed by Dr. Eliezer Markov (Computationalist) and Dr. Rosa Nguyen (Anti-Computationalist)*  
  *Date: October 26, 2023*  

  ---

  ### 1. **Disambiguation of Key Terms**  
  We agree that ambiguity in "computation" and "computer" has muddied the debate. The following senses are distinct:  
  - **Sense 1 (Abstract Automaton):** Computation as a formal, mathematical procedure (e.g., Turing machines, finite-state automata) defined by state transitions, independent of physical implementation.  
  - **Sense 2 (Physical Symbol System):** Computation as a physical process where symbolic states are manipulated via causal rules (e.g., digital CPUs), requiring a non-arbitrary mapping between physical states and formal states.  
  - **Sense 3 (Causal Organization):** Computation as a pattern of causal structure in a physical system, regardless of symbolic representation (e.g., neural networks, analog systems).  

  **The core debate** concerns whether the brain is a computer in **Sense 2 (Physical Symbol System)**.  
  - **Computationalist (C) Position:** The brain literally computes in Sense 2: its physical states non-arbitrarily map to formal states in a program-like structure, and this suffices for mind.  
  - **Anti-Computationalist (A) Position:** The brain’s "computation" is observer-relative (Sense 1) or merely causal (Sense 3), but it is not a Physical Symbol System. Mind arises from biological/physical properties, not formal symbol manipulation.  

  **Both parties confirm** their core views survive disambiguation:  
  - **C:** "My claim that the brain is a computer rests on Sense 2. Disambiguation removes straw-man objections (e.g., that I treat the brain as a silicon CPU)."  
  - **A:** "My denial targets Sense 2. Disambiguation clarifies I accept brains process information (Sense 3) but reject that this is literal symbol manipulation."  

  ---

  ### 2. **Agreed Claims (Non-Vacuous)**  
  Both parties endorse these empirically grounded claims:  
  1. **Turing Machines & Automata:** Formal automata are abstract mathematical objects; they do not "exist" physically and cannot, alone, explain implementation.  
  2. **Neural Implementation:** Brains use electrochemical signals with analog, stochastic, parallel processes. No evidence supports that neurons manipulate discrete symbols in a program-like way.  
  3. **Multiple Realizability (Empirical):**  
     - *Possible:* Identical input-output behavior can be achieved via different physical systems (e.g., brain vs. digital AI).  
     - *Unsettled:* Whether identical *mental states* (e.g., subjective experience) can arise from non-biological systems.  
  4. **Dead Positions:**  
     - Naive computationalism (e.g., "any input-output equivalent system has a mind") is dead. A lookup table mimicking human behavior lacks mentality.  
     - Naive anti-computationalism (e.g., "brains don’t process information") is dead. Neuroscience confirms causal information flow.  

  ---

  ### 3. **Disagreements (Stated Fairly)**  
  | Issue | Computationalist (C) Wording | Anti-Computationalist (A) Wording |  
  |-------|------------------------------|-----------------------------------|  
  | **Mind from Computation** | "Minds arise solely from the implementation of the right kind of formal computation (Sense 2), regardless of substrate. Biological details are irrelevant." | "Minds arise solely from specific biological/physical properties of neural systems. Formal computation (Sense 1 or 2) is insufficient and observer-relative." |  
  | **AI Moral Status** | "Artificial systems implementing human-equivalent computations (Sense 2) have identical moral status to humans, as they possess subjective experiences." | "Artificial systems lack moral status regardless of computation (Sense 1–3), as they lack the embodied biological causality essential for experience." |  
  | **Implementation Objectivity** | "The mapping between physical states and formal states is objective, fixed by causal structure, not observer interpretation." | "All mappings between physical and formal states are observer-dependent; no intrinsic computation exists." |  

  ---

  ### 4. **Cruxes: Pivotal Sub-Questions**  
  #### **Crux 1: The Implementation Problem**  
  - **Issue:** If state-mappings are unconstrained, any physical system (e.g., a rock) "implements" any computation, trivializing computationalism.  
  - **C’s Constraint:** Mappings require **causal isomorphism**—physical state transitions must *reliably and non-arbitrarily* mirror formal state transitions.  
  - **A’s Constraint:** Mappings require **biological specificity**—only systems with continuous, wetware-like properties can implement "real" computation for mind.  
  - **Predictions under Scrutiny:**  
    - **C predicts:** A’s biological constraint reduces to mysterianism; causal isomorphism is the only non-arbitrary standard.  
    - **A predicts:** C’s causal isomorphism permits absurd implementations (e.g., slow-motion "brains"), showing it is insufficient.  

  #### **Crux 2: Real-Time Dynamics**  
  - **Issue:** Whether the temporal properties of computation affect mentality.  
  - **C’s View:** Speed is irrelevant if causal structure is preserved.  
  - **A’s View:** Real-time, embodied dynamics are essential for mind.  

  ---

  ### 5. **Concrete Cases & Predictions**  
  Both parties agree these cases test the cruxes. Predictions are falsifiable and recorded for future evaluation.  

  | Case | System Description | Computationalist (C) Prediction | Anti-Computationalist (A) Prediction | Divergence Point |  
  |------|-------------------|--------------------------------|--------------------------------------|------------------|  
  | **Case 1: Slow Analog Emulation** | Neuromorphic analog chip emulating a human brain at 0.1% biological speed, with continuous/noisy variables. | "Yes: Experiences are degraded but present. Causal isomorphism holds; speed/noise are implementation details." | "No: Extreme slowdown disrupts real-time causality. Experiences require biological timescales." | Temporal dynamics as essential (A) vs. incidental (C). |  
  | **Case 2: Giant Lookup Table** | System with precomputed outputs for all possible human brain inputs (no internal state transitions). | "No: Lacks causal isomorphism. Outputs are not generated by rule-based state transitions." | "No: No biological organization or causal depth. A trivial case for rejection." | *Agreement on outcome, but for different reasons.* |  
  | **Case 3: Geographically Dispersed Network** | Brain emulation distributed across continents, with 100ms delays between "neural" nodes. | "Yes: If causal structure is preserved, fragmented experiences exist (e.g., like dissociative states)." | "No: Spatial discontinuities and delays prevent unified, embodied consciousness." | Spatial unity and embodiment as necessary (A). |  
  | **Case 4: Embodied vs. Disembodied** | Robot with human-like sensorimotor loops vs. identical internal processing in a disconnected server. | "Both have experiences: Identical computations imply identical minds. Embodiment only alters input data." | "Only the robot has experiences: Disembodied systems lack world-embedded causality, essential for grounding meaning." | Embodiment as constitutive (A) vs. contextual (C). |  

  ---

  ### 6. **Closing: Residual Disagreements & Pathways Forward**  
  **Substantive vs. Verbal Residual Disagreements:**  
  - **Verbal (Resolved):** Whether brains "compute" in Sense 3 (causal organization). *Both agree they do.*  
  - **Substantive (Unresolved):**  
    - Whether implementation of Sense 2 computation is *sufficient* for mind (C: yes; A: no).  
    - Whether biological properties are *necessary* for mind (A: yes; C: no).  

  **What Would Move the Debate:**  
  Both parties commit to the following as decisive:  
  - **Empirical:** A whole-brain emulation that passes behavioral and neuro-correlate tests for consciousness.  
    - *C predicts success; A predicts failure due to missing biological properties.*  
  - **Theoretical:** A unified theory of implementation constraints that either:  
    - (C) Derives causal isomorphism from physics, dissolving "biological chauvinism."  
    - (A) Shows causal isomorphism is observer-relative or insufficient for subjective states.  
  - **Experimental:** Resolving Case 1 (Slow Analog Emulation) via first-person reports from neuromorphic systems.  

  **Final Statement:**  
  > "We agree that computationalism’s fate hinges on whether non-biological systems can host subjective experiences under rigorous tests. We endorse adversarial scrutiny of the cases above. If Cases 1 or 3 yield robust evidence of experience, computationalism is strengthened; if not, anti-computationalism is. We commit to updating our views based on these outcomes."  

  ---  
  **Signatures:**  
  *Dr. Eliezer Markov (Computationalist)*  
  *Dr. Rosa Nguyen (Anti-Computationalist)*  
  *October 26, 2023*  

  ---  
  **Note for Readers:**  
  This document’s predictions (Section 5) are falsifiable within 5 years via advances in neuromorphic computing and brain emulation. Future evidence for/against experiences in slow analog chips or distributed systems will resolve the cruxes identified here.
