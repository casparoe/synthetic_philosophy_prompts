     - In the design activity, they might propose a dictatorial rule. Then we can say: "But then one person always decides. Is that fair?" They might propose random dictatorship? But then it's not deterministic? The theorem assumes a deterministic rule. Or they might propose only two alternatives? Then we say: "But we have three." 

     We can handle that by noting the conditions.

     Let me write the exact materials.

     Preference cards:

     Type1 (5 students):
     - Ranking: A > B > C
     - Payoff: 3 candies if A wins, 2 if B wins, 1 if C wins.

     Type2 (5 students):
     - Ranking: B > A > C
     - Payoff: 3 candies if B wins, 2 if A wins, 1 if C wins.

     Type3 (8 students):
     - Ranking: C > A > B
     - Payoff: 3 candies if C wins, 2 if A wins, 1 if B wins.

     Ballots: simple slips with three options: A, B, C. They mark one.

     Rules for rounds:
     - Round 1: Vote for one candidate. No talking.
     - Tally and announce the winner. Distribute candy accordingly.
     - Reveal the full preference distribution (write on board: 5 voters: A>B>C, 5: B>A>C, 8: C>A>B).
     - Show pairwise: 
          A vs C: 5+5 =10 for A, 8 for C -> A wins.
          B vs C: 5+5=10 for B, 8 for C -> B wins.
          A vs B: 5 (Type1) + 8 (Type3) =13 for A, 5 (Type2) for B -> A wins? 
          So A is the Condorcet winner.

     - Round 2: Allow 5 minutes of open discussion. Then vote again by plurality (same ballots). Distribute candy.

     Group activity: "Design a voting rule for three alternatives that you think cannot be manipulated by strategic voting. By 'manipulated', we mean that no voter (or group of voters) can get a better outcome by lying about their preferences. Write down the rule clearly."

     Then we ask each group to present. We don't have time to test, so we just collect ideas and then explain the theorem.

     Debrief:

     - We have seen that plurality voting can be manipulated (in round 2, you did it by coordinating and lying).
     - You proposed rules X, Y, Z. But the Gibbard-Satterthwaite theorem says that no matter what rule you design, if it satisfies:
          1. The rule is defined for at least three alternatives.
          2. The rule is non-dictatorial (there is no single voter who can always determine the winner).
          3. The rule is onto (every alternative can win under some preference profile).
          then there will be some preference profile where at least one voter can benefit by misrepresenting their preferences.

     - In our simulation:
          - We had three alternatives -> condition 1 satisfied.
          - Our rule (plurality) is non-dictatorial: no one voter decided the outcome -> condition 2 satisfied.
          - Our rule is onto: if everyone voted for A, A wins; similarly for B and C -> condition 3 satisfied.
          - And we saw that the rule was manipulated in round 2 (by a coalition).

     - The theorem is stronger: it says even individually there will be a situation. We didn't see an individual manipulation in our example, but that doesn't contradict the theorem because the theorem says there exists at least one profile where it happens.

     - What we cannot show: we only tested one profile. The theorem says that for any rule, there will be at least one profile where manipulation is possible. We cannot test all profiles, so we rely on the general proof.

     This should make them feel the impossibility.

     Let's hope it works.
answer: |-
  ### **Classroom Simulation: Feeling the Gibbard-Satterthwaite Theorem**

  #### **Overview**
  - **Goal**: Illustrate that *any* reasonable voting rule over ≥3 alternatives is vulnerable to strategic voting (misrepresenting preferences).
  - **Structure**: Three rounds (sincere vote → strategic vote → rule-design challenge) + debrief. Use candy payoffs to create tangible incentives.
  - **Time**: 75 minutes total.
  - **Setup**: 
    - 18 students, three alternatives: **Apple (A)**, **Banana (B)**, **Cherry (C)**.
    - Payoffs: Students receive candy based on the winner (3 candies for top choice, 2 for second, 1 for last). **Crucial**: Preferences are fixed and private; payoffs incentivize truth-telling *only if* the system is strategy-proof.
  - **Key Insight**: After a "bad" sincere outcome, students will try to manipulate the vote, then fail to design a manipulation-proof rule, mirroring the theorem’s impossibility.

  ---

  ### **Materials**
  - **Preference Cards** (distribute secretly; ensure no one sees others’ cards):
    - **Type 1 (6 students)**: A > B > C  
      *(Payoff: A wins = 3 candies, B wins = 2, C wins = 1)*
    - **Type 2 (6 students)**: B > C > A  
      *(Payoff: B wins = 3, C wins = 2, A wins = 1)*
    - **Type 3 (6 students)**: C > A > B  
      *(Payoff: C wins = 3, A wins = 2, B wins = 1)*
  - **Ballots**: Blank slips for writing one letter (A, B, or C).
  - **Candy**: Small, identical candies (e.g., M&Ms) for payoffs.
  - **Whiteboard**: To tally votes and reveal preferences later.

  ---

  ### **Step-by-Step Procedure** (Total: 60 min)

  #### **Round 1: Sincere Plurality Vote** (15 min)
  1. **Setup (5 min)**:
     - Distribute preference cards and ballots. Emphasize: "Vote for your *true* top choice. Your payoff depends on the winner."
     - Rule: **Plurality voting** (most first-place votes wins; ties broken alphabetically).
  2. **Vote & Tally (5 min)**:
     - Students vote silently. Collect ballots and tally publicly:
       - Type 1 votes: All 6 vote **A**.
       - Type 2 votes: All 6 vote **B**.
       - Type 3 votes: All 6 vote **C**.
       - **Result**: Tie (A=6, B=6, C=6). Tiebreak: **A wins** (alphabetical order).
  3. **Reveal Preferences & Payoffs (5 min)**:
     - Display full preference profile on the board:
       ```
       6 voters: A > B > C
       6 voters: B > C > A
       6 voters: C > A > B
       ```
     - Show pairwise comparisons:
       - A vs. B: A wins (12 prefer A > B: Type 1 + Type 3) vs. B wins (6: Type 2).
       - B vs. C: B wins (12: Type 1 + Type 2) vs. C wins (6: Type 3).
       - C vs. A: C wins (12: Type 2 + Type 3) vs. A wins (6: Type 1).
       - **No Condorcet winner** (A beats B, B beats C, C beats A → a cycle).
     - Distribute payoffs: Type 1 gets 3 candies (A won), Type 2 gets 1 (A is their worst), Type 3 gets 2.
     - **Prompt**: "Type 2 and Type 3 are unhappy. Could we get a better outcome if you voted differently?"

  #### **Round 2: Strategic Vote with Communication** (20 min)
  1. **Setup (5 min)**:
     - "Now, talk openly for 10 minutes to coordinate. You can change your vote, lie about preferences, or make deals. Goal: Get as many candies as possible."
     - Same rule: Plurality voting. Ties broken alphabetically.
  2. **Vote & Tally (5 min)**:
     - **Prediction**: Students may try to coordinate to avoid A (Type 2 hates A). But conflicts arise:
       - Type 1 wants A or B (but not C).
       - Type 2 wants B or C (but not A).
       - Type 3 wants C or A (but not B).
     - Likely outcomes:
       - **Perfect coordination fails**: E.g., Type 2 and Type 3 ally to elect C, but Type 1 might defect to A. Or, Type 1 and Type 2 ally for B, but Type 3 defects.
       - **Tie persists**: If no group concedes, tie → A wins again.
       - **Manipulation succeeds**: E.g., Type 2 and Type 3 agree to all vote C → C wins (Type 2 gets 2 candies, better than 1).
     - Tally votes and distribute payoffs.
  3. **Discussion (5 min)**:
     - "Did anyone lie? Why? Did you get a better outcome?" Highlight:
       - Type 2/3 may have lied (voted C not B/A) to elect C.
       - Type 1 may have lied (voted B not A) to break the tie.

  #### **Rule-Design Challenge** (15 min)
  1. **Task (10 min)**:
     - Split into 3–4 groups. "Design a voting rule for 3+ alternatives that *cannot* be manipulated. You must satisfy:  
       (1) No dictator,  
       (2) Every candidate can win (onto),  
       (3) Works for any preferences."
     - Give examples: Borda count, ranked pairs, approval voting.
  2. **Group Presentations (5 min)**:
     - Groups share rules. **Predictable issues**:
       - Borda: Vulnerable to "burying" (ranking a threat last).
       - Condorcet methods: Fail with cycles (like our profile).
       - Approval: How to set thresholds? May incentivize dishonesty.
     - **Key**: Don’t critique yet. Note: "We’ll test if these avoid manipulation."

  ---

  ### **Debrief: Mapping the Game to the Theorem** (15 min)
  Use concrete moments from the game to explain the theorem’s conditions:

  1. **Strategy-Proofness (Non-Manipulability)**:
     - *What happened*: In Round 2, Type 2 voters lied (voted C instead of B) to get C elected (2 candies > 1).  
     - *Theorem clause*: No rule is strategy-proof. Here, plurality failed → someone always has incentive to lie.

  2. **Non-Dictatorship**:
     - *What happened*: No single student decided the winner in any round (e.g., no one’s vote alone broke the tie).  
     - *Theorem clause*: Non-dictatorship is required → but it’s not enough to prevent manipulation.

  3. **At Least Three Alternatives**:
     - *What happened*: With three options (A/B/C), coordination failed, and manipulation emerged.  
     - *Theorem clause*: With two options, majority vote is strategy-proof. Three breaks it.

  4. **Onto (Surjectiveness)**:
     - *What happened*: Each candidate *could* win (e.g., if all voted A, A would win).  
     - *Theorem clause*: Rules must allow any candidate to win → but this enables "protest" votes that create cycles/manipulation opportunities.

  **The Wall They Hit**:  
  - In Round 2, manipulation helped some.  
  - In the design challenge, every proposed rule had a flaw (e.g., Borda fails if voters "bury" strong opponents).  
  - **Conclusion**: "You experienced the theorem: *Any* rule satisfying these conditions will sometimes incentivize lying. No fix is possible."

  ---

  ### **Honest Notes on Limitations**
  - **"Our rule survived" fallacy**: We tested *one* preference profile. The theorem says *some* profile will break *any* rule. Your rule might work here but fail elsewhere.
  - **Coordination short-circuit**: If students perfectly coordinate in Round 2 (e.g., all agree to vote B), they avoid manipulation *this time*. Handle it by:  
    (1) Asking: "Could you do this without talking? What if preferences were private?"  
    (2) Emphasizing: The theorem is about *individual* incentives, and coordination is a form of group manipulation.
  - **What we didn’t show**: The theorem guarantees *individual* manipulation in some profile. Our game showed *coalitional* manipulation.

  ---

  ### **Predictable Issues & Fixes**
  - **Problem**: Students coordinate perfectly in Round 2, masking manipulation incentives.  
    **Fix**: Restrict communication next time ("You can lie but not talk"). Or, secretly recruit 1–2 students to betray coalitions.
  - **Problem**: Design challenge groups propose trivial rules (e.g., "always choose A").  
    **Fix**: Enforce "onto" condition: "Prove every candidate can win under your rule."
  - **Problem**: Confusion about pairwise comparisons.  
    **Fix**: Use simple visuals (arrows on the board: A → B → C → A).

  ---

  ### **Why This Works**
  - **Tangible stakes**: Candy makes misrepresentation "real." Type 2 students *feel* the incentive to lie when A wins.
  - **Discovery-based**: They see manipulation emerge (Round 2), then hit the impossibility wall (design challenge).
  - **Concrete debrief**: Every theorem condition maps to a moment they lived (e.g., "Remember the tiebreak? That’s non-dictatorship failing us").

  By the end, they won’t just understand the theorem—they’ll have sweated and strategized their way through it.
