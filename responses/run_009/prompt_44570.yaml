  Next, the logician will ask about semantic values and compositionality. They want to know how moral sentences fit into a formal semantics. The reply should explain using plan-laden propositions or similar constructs, but the weakness is the lack of a fully developed formal system. The user needs to admit this gap but point to ongoing work.

  The grad students might bring up negation and disagreement. The approval-based versions fail here, so the plan-based approach needs to distinguish between failing to accept a norm and accepting its negation. The reply should clarify the distinct attitudes, but the weakness is the challenge in explaining the specific mental state of "acceptance."

  For goodwill, conceding that expressivism requires more complex semantics than realism is strategic. It shows humility and acknowledges the realists' concerns without undermining the core argument.

  The user's hidden worry is the amoralist problem. If someone has no normative plans, how does disagreement work? The reply must show that the amoralist fails to engage in the planning stance, but the weakness is that it feels like talking past each other. This is tough, so the user needs to prepare for this but hope it doesn’t come up.

  Also, considering deeper needs: the user might want to establish credibility, avoid technical pitfalls, and steer the discussion away from their weakest points. They need concise, memorable comebacks that acknowledge criticisms while defending their position. Highlighting the plan-based solution to embedded contexts is key, but admitting where the theory is underdeveloped builds trust.

  I should ensure each objection flows logically from the groups present. Realists start with Frege-Geach, logician dives into semantics, grad students probe psychological states. The amoralist question is the elephant in the room. Structuring the Q&A in this order makes sense. The user’s concession upfront about semantic complexity can disarm critics early. For the amoralist, emphasizing the planning framework as essential to moral discourse might help, even if it’s not perfect.
answer: |-
  Here’s your Q&A battle plan, tailored to your audience and version of expressivism. The objections flow from most predictable to niche but deadly, with replies designed for clarity and damage control.

  **Concession for Goodwill (Open Strong):**  
  *"Before we dive in, let me concede: the expressivist owes a **far more complex semantic story** than the realist. Mapping moral language onto non-cognitive attitudes while preserving logical structure is genuinely hard work. My claim isn't that it's simple, but that the plan-based approach I defend offers the *most promising* path through the thorns – especially compared to approval models."*  
  *(Why it works: Acknowledges their core technical grievance without surrendering, shows intellectual honesty, frames your view as the 'least bad' expressivist option.)*

  ---

  **Q&A Sheet: Predicted Objections & Replies**

  1.  **The Realist Opening Salvo (Frege-Geach: Modus Ponens):**  
      *Objection (Phrased as they would):* "Your view seems to immediately collapse on moral modus ponens. Take: 'If lying is wrong, then getting your little brother to lie is wrong.' 'Lying is wrong.' Therefore, 'Getting your little brother to lie is wrong.' The premises must express belief-states capable of truth/falsity for the inference to be *logically* valid. If they express non-cognitive planning states, how is validity preserved? This was settled decades ago."  
      *Reply (2 mins):* "Validity is preserved because the *logical role* of the attitude matters, not its 'belief-like' nature. On my view, accepting the conditional plan means being committed to a specific disposition: *if* I accept the plan-type for 'Don't lie', *then* I must accept the plan-type for 'Don't get your brother to lie'. Accepting the first premise (the conditional plan) is *incompatible* with accepting the second premise (the plan 'Don't lie') while rejecting the conclusion (the plan 'Don't get your brother to lie'). The 'inconsistency' isn't factual contradiction, but a *practical inconsistency* in one's total web of plans. Modus ponens tracks this practical incompatibility, preserving the *force* of the inference within the planning framework."  
      *Where it's Soft:* Requires buying into the idea that logical validity can supervene on practical/normative constraints of plan consistency, not just truth-preservation. Realists will demand a *formal semantics* showing this explicitly (see next objection). It feels like a re-description, not a full solution, to them.

  2.  **The Logician's Compositionality Question:**  
      *Objection (Phrased as they would):* "Okay, granting your 'practical inconsistency' move for argument's sake, I need your *semantic values*. In a compositional semantics, what does the sentence 'Lying is wrong' *denote* or *refer to* at the subsentential level? What is its contribution to the truth-condition (or, in your case, 'plan-condition') of complex sentences like conditionals or negations? Specifically, is 'failing to accept the plan for not lying' the same semantic value as 'accepting the plan for lying'? That seems crucial for negation."  
      *Reply (2 mins):* "The core semantic value isn't a proposition (a truth-apt content) but a *plan-laden content* or *prescription*. Think of 'Lying is wrong' as expressing the *acceptance of the plan-type: 'Reject lying!'*. Composition works by defining operators over these plan-acceptance states. Crucially, **negation is not 'failure to accept'**. Negating 'Lying is wrong' ('Lying is not wrong') expresses *accepting a different plan-type: 'Permit lying!'* (or rejecting 'Reject lying!'). 'Failing to accept' is a psychological state of indifference or indecision; 'accepting not-X' is an active, opposing planning commitment. This distinction resolves the negation problem plaguing approval models."  
      *Where it's Soft:* You need a robust *formal system* defining these plan-types, acceptance states, and operators compositionally. While frameworks exist (e.g., Gibbard's planning semantics), fleshing it out fully in 2 minutes is impossible. The logician will rightly push for formal details you likely won't have time to fully present. Admit this is work-in-progress but conceptually distinct.

  3.  **Grad Student Probing (Signaled Negation/Disagreement):**  
      *Objection (Phrased as they might, echoing senior cues):* "You distinguish 'failing to accept' and 'accepting not-X'. That sounds psychologically implausible. Isn't 'approving of not-X' or 'planning to permit X' just the natural state someone is in if they *don't* disapprove of X? How are these distinct mental states, and how does this ensure genuine *disagreement*? If I accept 'Reject lying!' and you merely *fail* to accept it (but don't accept 'Permit lying!'), are we disagreeing?"  
      *Reply (2 mins):* "The key is that the attitudes expressed are *commitments*, not mere occurrent feelings. 'Accepting a plan-type' is a stable commitment to guide deliberation and action under that norm. 'Failing to accept' is the absence of that commitment. 'Accepting not-X' is an *active commitment to the opposite guidance* (e.g., permitting). Genuine disagreement occurs when we express *incompatible planning commitments*. If I express commitment to 'Reject lying!' and you express commitment to 'Permit lying!', our plans directly conflict – we disagree about how to live/plan regarding lying. If you merely lack commitment, we don't *disagree* about lying's wrongness; you're just not engaged in *that* normative framework."  
      *Where it's Soft:* Defining the precise nature of "commitment" or "plan-acceptance" is philosophically tricky. It risks being stipulative. Explaining why lacking a commitment isn't a form of disagreement *within the moral domain* (even if it's a factual disagreement *about* commitments) requires careful delineation of the domain of 'moral disagreement'.

  4.  **The Amoralist Nightmare Question (The One You Hope Nobody Asks):**  
      *Objection (Phrased starkly):* "Your 'disagreement as clashing commitments' seems to exclude the *amoralist* entirely. Suppose someone truly has *no* normative plans or commitments regarding torture – not pro, not con, just complete indifference within the moral framework. They say 'Torture? Meh, do whatever.' You express commitment to 'Reject torture!'. On your view, are you *disagreeing*? It seems not. You're just committed to a plan they don't share (or oppose). But intuitively, you *are* disagreeing – you think torture is wrong, they think it's not wrong (or not morally significant). How does your view capture this *genuine normative disagreement* with someone who lacks the relevant attitudes?"  
      *Reply (The Best You Can Do - 2 mins):* "This is a tough case. My view suggests that strict, full-blooded *moral* disagreement requires engagement within the shared domain of normative planning. The amoralist, by having *no* relevant commitments, opts out of that domain. So, in one sense, we aren't having a *moral* disagreement *with them* about torture; we're disagreeing *about whether to engage in moral planning at all* regarding torture. However, the expressivist *can* say we condemn their stance: we express our commitment to a plan that involves rejecting torture *and* involves rejecting the stance of complete normative indifference towards fundamental harms like torture. We see their indifference as itself plan-inconsistent with a life lived well. The disagreement becomes about the *framework* itself."  
      *Where it's Devastatingly Soft:* This concedes that the amoralist isn't *contradicting* your moral claim within your system. It frames the disagreement as meta-level (about engaging in morality) rather than object-level (about the wrongness of torture), which many find unsatisfying. It risks making moral discourse seem like a club only for the committed, failing to capture the intuition that the amoralist is *wrong* about torture itself. This is arguably the deepest challenge for any non-cognitivist.

  **Key Q&A Strategy:**

  *   **Control the Frame:** Start with your concession to set a tone of seriousness.
  *   **Anchor in Plans:** Constantly pivot back to "accepting a plan-type/norm" and "practical inconsistency of commitments" as your core machinery. Avoid "approval"/"disgust" language.
  *   **Acknowledge Soft Spots Briefly:** Don't hide weaknesses; briefly name them ("This requires accepting X, which you may not", "The formal semantics is complex and still being developed", "The amoralist is genuinely hard"). This builds credibility.
  *   **Target the Logician Wisely:** If the logician seems sympathetic to your distinction between 'failure to accept' and 'accepting not-X', lean into that. They might be an unexpected ally against sloppy realist dismissals.
  *   **Manage the Amoralist:** If asked, give your reply calmly, concede it's difficult, but emphasize how the *plan-based* view at least provides *more* resources (framework-level commitment) than approval-based views. Then try to pivot back to the strengths (handling embedding, negation).

  **Good luck! Your focus on plans over approval is definitely the right move within expressivism. The amoralist is everyone's problem.**
