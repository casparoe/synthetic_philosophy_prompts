prompt: |-
  I'm a junior on the student council at my high school, and for the second year I sit on our Philanthropy Committee: nine students, one afternoon-long meeting per semester, deciding how to allocate roughly $7,500 that our fall fundraiser brings in. Historically we've split the money evenly among four or five causes because no one could defend a principled way to do otherwise — last year it was the local food bank, an international deworming charity, a campus mental-health peer-support program, and a reforestation nonprofit, each getting a check. Over the summer I read about how some effective altruism organizations prioritize causes by scoring each problem on importance (how big it is), tractability (how solvable per unit of effort), and neglectedness (how much attention and money it already gets from others), sometimes combining the three into an overall priority score. I'd like to bring a more disciplined version of this to our committee instead of the equal-split default, but I want to understand it properly, not just wave the acronym around.

  Please act as someone who both knows the theory behind this framework cold and has practical experience advising small donors and volunteer committees, and think carefully before answering — start by brainstorming the candidate implications without worrying about polish, then commit to the ones that actually matter. I'd like the most important implications of the importance-tractability-neglectedness framework for a group like ours specifically: a handful of teenagers with a few thousand dollars, no ability to run studies or evaluate charities in depth, and a budget that is a rounding error next to essentially any real funder. Which of the framework's lessons survive at our scale, which quietly stop working, and what should we actually do differently on that December afternoon?

  Please structure the response as follows: a "First thoughts" section of rough bullet points (~100 words); then "Three implications that matter most for us," ordered by importance, with roughly 150 words on each; then "Where the framework will mislead us" (~200 words) covering the ways a committee our size could be led astray by applying it too literally; and finally "Bottom line" (under 100 words). One more thing: our faculty advisor thinks cause-prioritization math is "TED-talk utilitarianism with a spreadsheet," and I'll have to defend whatever I bring to the room — so flag anything in your answer she would pounce on. And if you think the framework genuinely doesn't transfer to a group like ours at all — that it only earns its keep for funders moving millions — please say that plainly rather than applying it politely; I'd rather find out now than mid-meeting.
reasoning: |-
  Okay, let me approach this systematically. The user is a high school junior on a philanthropy committee with $7,500 to allocate, seeking to apply EA principles at micro-scale. 

  First, I need to mentally simulate how ITN (Importance-Tractability-Neglectedness) functions differently for small donors versus large foundations. The core tension: framework assumes capacity for deep research they lack, but its underlying logic could still combat arbitrary splitting. 

  Key constraints flashing red: 
  - No staff researchers, minimal time (one afternoon meeting)
  - Budget is microscopic globally (<0.0001% of GiveWell's annual grants)
  - Must withstand faculty skepticism about "spreadsheet altruism"

  Hmm... where does ITN genuinely bend to their reality? 
  *Neglectedness* becomes critical - their dollars matter most where few funders look. But *tractability* assessment is tricky without expert input. Might need to flip the script: instead of scoring charities, use ITN to filter cause areas first. 

  Biggest hidden risk: Misapplying ITN could make them overconfident in shallow analysis. Must emphasize they're not finding "best" charity but "least bad fit for tiny grants." 

  Faculty objection anticipation: She'll rightly note that quantified scores mask value judgments. Solution? Present ITN as discussion scaffold, not calculator. 

  *Structure thoughts*: 
  First thoughts will list raw pros/cons. 
  Then prioritize 3 actionable implications: 
  1. Neglectedness as primary lever 
  2. Importance ≠ scale (local vs global) 
  3. Tractability via proxies 
  Warnings section must highlight false precision danger. 
  Bottom line: Framework useful if framed as "conscious prioritization" tool, not optimization engine. 

  *Red flag check*: Explicitly note where their $7,500 can't move needles - but that's okay. Impact isn't always about scale.
answer: |-
  ### **First Thoughts**  
  - *Pros*: Stops arbitrary splits; forces explicit reasoning; highlights underfunded gems; combats bias toward visible/emotional causes.  
  - *Cons*: Requires data they lack; risks false precision; $7.5K is negligible for most "neglected" global issues; may clash with local impact expectations.  
  - *Reality Check*: Won’t find "optimal" grants but can avoid worst pitfalls. Faculty pushback likely on "pseudo-scientific scoring."  

  ---

  ### **Three Implications That Matter Most for Us**  
  **(Ordered by Impact)**  

  1. **Prioritize Neglectedness Above All**  
     *Why*: Your $7,500 disappears in well-funded causes (e.g., big food banks get millions). It shines where others don’t look—e.g., deworming (low PR) or niche local gaps (e.g., menstrual products for homeless teens). *Action*: Filter first by "Who else funds this?" Drop any org with >$1M annual revenue or heavy government backing.  
     *Faculty Pushback Flag*: "Neglected ≠ impactful!" (Counter: Explain that funding overheads in saturated spaces wastes pennies.)  

  2. **Redefine ‘Importance’: Local Context Beats Global Scale**  
     *Why*: You can’t measure "importance" like EA orgs (e.g., DALYs saved). But you *can* gauge local severity: Is this the top unmet need *your peers face*? (e.g., mental health vs. reforestation). *Action*: Rank "importance" via student surveys or teacher input—not abstract stats.  
     *Faculty Pushback Flag*: "This is parochial!" (Counter: $7.5K won’t cure malaria, but could fund 100 therapy sessions locally.)  

  3. **Tractability = Proof, Not Promise**  
     *Why*: You lack tools to vet effectiveness. Instead, demand evidence of past wins with budgets like yours. *Action*: Favor charities that share specific, verifiable outcomes (e.g., "We planted 500 trees per $1K in 2022") over vague pitches. Reject any lacking clear reports.  
     *Faculty Pushback Flag*: "Outcomes ≠ real impact!" (Counter: Insist on transparency—this is basic due diligence, not utilitarianism.)  

  ---

  ### **Where the Framework Will Mislead Us** (~200 words)  
  - **False Precision Trap**: Assigning scores to "tractability" or "importance" with no data is theater. Your faculty advisor will shred this as "TED-talk math." *Fix*: Use ITN as a *qualitative* filter—e.g., "Is this more neglected than that?"—not a scoring system.  
  - **Scale Mismatch**: ITN assumes your dollars shift outcomes. But $7.5K to Against Malaria is a rounding error *to them* (they move $20M/year). You’ll overestimate impact on global giants. *Fix*: Favor orgs where $2K–$5K funds a discrete project (e.g., "This buys 10 beds for a shelter").  
  - **Local Blindspot**: Pure ITN favors global health (e.g., deworming), but your committee may value campus/community ties. Ignoring this breeds resentment. *Fix*: Reserve 1–2 slots for local causes meeting neglectedness (e.g., peer counseling not covered by school funds).  
  - **Motivation Tax**: Over-rationalizing can drain passion. If you dismiss emotional choices (e.g., cancer funds) without nuance, peers disengage. *Fix*: Frame ITN as "rigorous empathy"—ensuring good intentions aren’t wasted.  

  ---

  ### **Bottom Line**  
  Use ITN as a *lens*, not a calculator. At your scale:  
  1. **Start with neglectedness** to find high-leverage opportunities.  
  2. **Demand proof, not promises** for tractability.  
  3. **Define "importance" locally** via student/staff input.  
  Allocate 60–70% to neglected causes with evidence, 30–40% to vetted local gaps. Ditch equal splits—but never pretend you’re doing "EA math." Your goal isn’t perfection; it’s avoiding waste.  

  > **Faculty Advisor Defense**: *"We’re not calculating utopia—we’re asking ‘Will this $2,500 actually *do* something, or just feel good?’ If that’s TED-talk utilitarianism, fine. But wasting money isn’t philanthropic."*
