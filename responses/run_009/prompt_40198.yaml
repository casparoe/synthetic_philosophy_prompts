prompt: |-
  I'm on the ethics committee of a regional hospital network (three hospitals, ~900 beds total) and I keep getting pulled into rationing decisions without anything resembling a framework. It's been small stuff so far — who gets the last ECMO machine during a bad flu surge, whether to spend a restricted donation on one gene therapy for a kid with a rare degenerative condition or spread it across the NICU, how to hand out the last 40 doses of a vaccine in short supply. But the calls are getting more frequent and our written justifications are a mess: one trustee keeps saying "greatest good for the greatest number," a family practitioner on the committee says we can't ever trade one person's life against other people's benefits like they're line items, and our lawyer mostly worries about discrimination claims, so nobody's actually arguing from the same premises. Last month we justified two nearly identical cases in opposite ways and a local journalist noticed.

  Years ago I took a political philosophy course and the one thing that stuck with me was Scanlon's contractualism — the idea that a moral principle is justified when nobody could reasonably reject it, and that what matters is being able to justify the decision to each individual person affected, not just producing a good total outcome. What I remember liking about it is that it seemed to explain why we can refuse to take one patient's organs to save five others, while still leaving room to say numbers *sometimes* matter. But I also remember some professor bringing up a paper about a guy who asks whether you should flip a coin when you can save either one person or five, which if you take it seriously seems to imply numbers count for nothing, and that can't be right for us — if we can vaccinate 200 people against a mild but real risk of serious complications or 1 person against a slightly higher risk, telling the 200 "sorry, coin flip" would get us run out of town. So my question is: can contractualism actually be turned into a usable procedure, and where exactly does the counting question come out?

  What I want is a written decision procedure the committee can run in an actual two-hour meeting: the steps in order, what counts as settling each step, and — this is important — clearly marked points where the procedure has to hand things over to the committee's judgment because it's a values question the theory genuinely doesn't answer. The people using it are clinicians, an administrator, a lawyer, and me; no philosophers, and nobody will read anything longer than a page or two. It has to produce a public-facing written justification each time, so the steps need to map onto sentences a hospital board can sign. Please run it on three cases: (1) the last ICU bed going to either a 34-year-old with a good prognosis after a long stay or a 68-year-old with a moderate one; (2) the choice between funding one very expensive therapy for a single child versus a screening program that would prevent smaller harms for hundreds of patients; and (3) the vaccine case above. I specifically want to know if the procedure gives an answer my committee will hate in one of these — I suspect it does on case 2 — and what the procedure flat-out cannot decide. Also, if you can, say something about whether chances (a 30% risk of death for one person) can be weighed against certain smaller harms across many people, because that comes up constantly in our allocation fights and I've never seen anyone handle it cleanly. Keep in mind we need to accomodate a lawyer who will ask whether every step is legally defensible, and be honest if there's a point where contractualism just breaks down and we'd be papering over the break with procedure.
reasoning: |-
  Okay, let's tackle this query. The user is on an ethics committee for a hospital network facing rationing decisions without a framework. They mentioned Scanlon's contractualism as a potential solution but are worried about its practicality. The main issues are inconsistent justifications and a need for a clear, usable procedure.

  First, I recall that contractualism focuses on principles no one could reasonably reject, emphasizing justification to each affected individual. The user is concerned about when numbers matter, like in the vaccine case where saving 200 vs. one person seems obvious, but contractualism might suggest coin-flipping in some scenarios. That paradox needs resolving.

  The user wants a step-by-step procedure that fits into a two-hour meeting, produces public justifications, and handles specific cases. The committee includes clinicians, an admin, a lawyer—no philosophers. The procedure must have clear steps, points where judgment is needed, and legally defensible outputs.

  Breaking down the requirements: The framework must be concise, actionable, and transparent. It should address life-and-death decisions like ICU beds, funding allocations for expensive therapies vs. preventive care, and vaccine distribution. Also, handling probabilities (e.g., 30% risk vs. certain smaller harms) is crucial.

  For contractualism to work here, adapting it into a procedural checklist makes sense. Steps should include identifying affected parties, articulating principles, assessing reasonable rejection, and considering numbers when burdens are comparable. The coin-flip dilemma from the example needs clarification: numbers matter when individual burdens differ significantly, not when they're similar.

  Case 1: ICU bed between a 34-year-old and a 68-year-old. Contractualism might prioritize prognosis over age to avoid discrimination. The younger patient's better outcome is a stronger justification than age-based rationing, which could be reasonably rejected as discriminatory.

  Case 2: Expensive therapy for one child vs. screening for many. Here, the individual child's life-threatening need vs. many smaller harms. Contractualism might side with the child if the therapy is life-saving, as denying it could be reasonably rejected by that child. However, if the screening prevents severe outcomes, the aggregated benefits might outweigh, but contractualism struggles with aggregation. The procedure needs a judgment call here.

  Case 3: Vaccines for 200 at mild risk vs. one at higher risk. The higher-risk individual has a more urgent need, so prioritizing them is justifiable. But if the risks were equal, numbers might tip the scale, avoiding a coin flip. This resolves the user's concern about ignoring numbers.

  Handling probabilities: Contractualism treats expected harm as the burden. So a 30% risk of death equates to a 30% burden, comparable to certain smaller harms scaled by probability. This allows weighing different probabilities and magnitudes.

  Legal defensibility: Emphasizing objectivity, consistency, and documented deliberation addresses discrimination concerns. The lawyer's role is integrated into steps requiring equity checks and outcome documentation.

  The procedure must flag where judgment is needed, like when principles conflict (Case 2) or comparable burdens involve numbers. Transparency about these points prevents overclaiming the framework's reach.

  In conclusion, the adapted contractualist procedure provides structure for deliberation, clear justifications, and handles most cases. However, it explicitly notes limits in aggregation scenarios, requiring the committee's value judgment. This honesty about the framework's boundaries makes it more credible and practical for the hospital's needs.
answer: |-
  Here's a procedural framework based on Scanlonian contractualism, designed for practical hospital committee use. It focuses on **justification to individuals** and **reasonable rejectability**, while incorporating where numbers matter and explicit judgment points.

  **Contractualist Allocation Procedure (CAP) - 1-Page Summary**

  **Core Principle:** An allocation is justified if it adheres to principles that no individual affected (patient, family, community member) could *reasonably reject* as a basis for informed, unforced agreement, considering their own situation and the burdens imposed.

  **Procedure Steps (Run Sequentially):**

  1.  **Define the Choice & Affected Parties:**
      *   *Task:* Clearly state the resource scarcity, the concrete options (A/B/C...), and identify the distinct groups/individuals *directly* impacted by each option (e.g., "Patient X gets ECMO; Patients Y & Z do not" OR "200 Group A get Vaccine; 1 Patient B does not").
      *   *Settle When:* Committee agrees on a factual description of options and groups. *Document:* "Option A benefits Group Alpha (n=X) by [benefit], burdens Group Beta (n=Y) by [burden]. Option B benefits Group Gamma (n=Z)..."
      *   **Judgment Point:** Defining relevant groups/impacts.

  2.  **Articulate Candidate Principles:**
      *   *Task:* Propose specific moral principles justifying each option (e.g., "Prioritize worst prognosis," "Maximize total lives saved," "Prioritize those with least alternative," "First-come, first-served," "Prioritize greatest individual need," "Random selection").
      *   *Settle When:* Committee lists plausible principles linked to options. *Document:* "Option A justified by Principle P1: [Description]. Option B justified by Principle P2: [Description]."

  3.  **Assess Reasonable Rejectability (Per Principle & Group):**
      *   *Task:* For *each* principle justifying an option, ask: **"Could an individual who bears the greatest burden under this principle reasonably reject it, knowing they might be anyone in the affected group?"** Focus on the *individual* perspective of the worst-off under that principle. Consider:
          *   *Magnitude of Burden:* How severe is the harm (death, disability, pain, lost opportunity)?
          *   *Avoidability/Alternatives:* Could the burden have been mitigated? Are there other options for this person?
          *   *Neutrality/Impartiality:* Is the principle based on morally arbitrary factors (e.g., race, wealth, social status)? *Age/Prognosis often relevant if tied to outcome.*
          *   *Fairness:* Does the principle create systematic disadvantage for a group?
      *   *Settle When:* Committee reaches consensus (or majority) on whether a principle is reasonably rejectable *from the perspective of the most burdened*. *Document:* "Principle P1 is/is not reasonably rejectable because [Reason], particularly from the perspective of [Group/Individual] who faces burden [Burden]."

  4.  **Resolve Conflict & Numbers:**
      *   *Task:*
          *   If only **one principle survives Step 3 (not reasonably rejectable)**, its linked option is justified. Proceed to Step 5.
          *   If **multiple principles survive**, or **no clear principle survives**, ask: **"Is the *nature and magnitude* of the burden imposed on the individuals losing out *comparable* across the options?"**
              *   *If YES (Comparable Burdens):* **Numbers matter.** Choose the option benefiting the greater number. (Resolves the coin-flip paradox: numbers break the tie when burdens are truly comparable).
              *   *If NO (Non-Comparable Burdens):* **Prioritize the option avoiding the most severe individual burden.** (Rejects pure aggregation for vastly different harms).
      *   *Settle When:* Committee agrees on comparability of burdens and applies the rule. *Document:* "Principles P1 and P2 both survive. Burdens on losers are comparable/non-comparable because [Reason]. Therefore, option A/B is chosen based on numbers/severity."

  5.  **Equity & Legal Check:**
      *   *Task:* Verify the chosen option doesn't violate core anti-discrimination laws or create unjustifiable disparities based on protected characteristics. Does the justification hold under scrutiny?
      *   *Settle When:* Lawyer confirms legal defensibility. *Document:* "Chosen option reviewed for compliance with [Relevant Laws]. Justification based on non-arbitrary factors [e.g., prognosis, urgency, efficacy]."

  6.  **Document & Communicate:**
      *   *Task:* Write public justification using this structure: "Faced with scarcity of [Resource], options were [A, B]. We adopted the principle [Surviving Principle from Step 3] because it could not be reasonably rejected by those most affected, as [Reason]. Where comparable options existed, we considered the number affected [if Step 4 applied]. This decision aligns with our commitment to justify actions to each individual fairly."
      *   *Settle When:* Committee approves final statement.

  **Handling Probabilities:** Contractualism treats *expected burden*. A 30% risk of death is a 30% burden for that individual. Compare it to the *certain* smaller harms scaled by probability/number. Example: Denying a preventative measure with 30% death risk to one person imposes an expected burden of 0.3 "deaths". Denying a treatment preventing certain minor disability (burden=0.01 "death equivalent") to 40 people imposes a burden of 0.4. The latter burden is larger, justifying prioritizing the 40. *This requires quantifying "harm equivalence" – a major **Judgment Point**.* The committee must agree on a reasonable equivalence scale (e.g., 1 death = 100 severe disabilities = 1000 minor complications) *before* the case arises, as a policy.

  **Application to Your Cases:**

  1.  **ICU Bed: 34yo (Good Prognosis) vs. 68yo (Moderate Prognosis)**
      *   *Step 1:* Option A: Bed to 34yo (Benefit: Likely full recovery; Burden to 68yo: Significant risk of death/disability). Option B: Opposite.
      *   *Step 2:* Principles: P1 (Prioritize Best Prognosis), P2 (Prioritize Youth?), P3 (First-Come?).
      *   *Step 3:* Assess P1: Could the 68yo reasonably reject "Prioritize Best Prognosis"? Burden is high (death/disability). However, prognosis is a non-arbitrary factor *directly tied to the benefit of the scarce resource*. It's harder to reasonably reject "we give the bed where it's most likely to save a life/restore health" than "we give it to the younger person." P1 likely **survives**. P2 (Prioritize Youth) is more readily rejectable as arbitrary. P3 (First-Come) is rejectable if prognosis differs significantly.
      *   *Step 4:* Only P1 likely survives. **Option A (Bed to 34yo) justified by prognosis.**
      *   *Justification:* "The ICU bed was allocated based on the principle of maximizing the likelihood of successful treatment outcome (prognosis), as this principle could not be reasonably rejected by those affected, focusing medical resources where they are most effective. Age alone was not the determining factor."

  2.  **Gene Therapy (1 Child) vs. NICU Screening (Hundreds)**
      *   *Step 1:* Option A: Fund Therapy (Benefit: Save Child A's life/cure disease; Burden: Hundreds in NICU face small but real increased risk of harm). Option B: Fund Screening (Benefit: Reduce small risks for hundreds; Burden: Child A dies/suffers severe degeneration).
      *   *Step 2:* Principles: P1 (Prioritize Most Severe Individual Need - Child A), P2 (Maximize Total Benefit/Avoided Harm - Screening).
      *   *Step 3:*
          *   Assess P1 (Prioritize Child A): Could someone in the NICU population reasonably reject this? Their burden is a *small increased risk* of harm. Is rejecting a *certain, catastrophic loss* for Child A to avoid this small, probabilistic risk reasonable? **Likely NO.** P1 survives.
          *   Assess P2 (Maximize Total Benefit): Could Child A reasonably reject this? The burden is *certain death or severe degeneration*. Child A could argue this principle sacrifices them for an aggregated benefit composed of many *much smaller* individual risks/harms. This seems **reasonable to reject**. P2 fails.
      *   *Step 4:* Only P1 survives. **Option A (Fund Therapy) justified.**
      *   *Where it breaks/Committee May Hate:* This is the contractualist strength/weakness. It strongly resists *aggregating* many small harms to override one catastrophic harm. Your committee favoring the screening program would need to argue either: (a) the "small harms" in the NICU are actually *severe* when they occur (reframing burden), or (b) **Judgment Point:** The committee *politically* chooses aggregation over individual catastrophe in this specific context (owning the value choice), despite contractualism leaning against it. Contractualism struggles *here* if the aggregated small harms are perceived as morally equivalent to the one big harm. **This is a breakdown point requiring explicit committee value judgment.**

  3.  **Vaccine: 200 (Mild Risk Reduction) vs. 1 (Higher Risk Reduction)**
      *   *Step 1:* Option A: Vaccinate 200 (Benefit: Reduce mild risk for 200; Burden: Higher risk remains for Patient B). Option B: Vaccinate Patient B (Benefit: Significantly reduce higher risk for B; Burden: Mild risk remains for 200).
      *   *Step 2:* Principles: P1 (Prioritize Greatest Individual Risk Reduction - Patient B), P2 (Maximize Total Risk Reduction - 200).
      *   *Step 3:*
          *   Assess P1 (Prioritize B): Could one of the 200 reasonably reject this? Their burden is forgoing a *small* risk reduction. Is rejecting a *much larger* risk reduction for Patient B to get their small reduction reasonable? **Likely NO.** P1 survives.
          *   Assess P2 (Maximize Total): Could Patient B reasonably reject this? The burden is forgoing a *large* risk reduction. Patient B could argue they are being sacrificed for a sum of very small benefits to others. **Likely YES, reasonably rejectable.** P2 fails.
      *   *Step 4:* Only P1 survives. **Option B (Vaccinate Patient B) justified.** *But what if risks were equal?* If the individual risk reduction was *identical* for all, then burdens on losers are *comparable*. Step 4 rule applies: **Numbers matter, vaccinate the 200.** This avoids the coin-flip absurdity by making numbers decisive *only* when the individual stakes are equal.

  **Key Takeaways & Caveats:**

  1.  **Usable? Yes, as a structured deliberation guide.** It forces focus on justification to individuals and explicit reasoning.
  2.  **Where Numbers Matter:** Only when the *individual burdens* imposed on the losers by choosing one option over another are **comparable in nature and severity**. Otherwise, avoid the worst individual burden.
  3.  **Where It Might Break/Require Judgment:**
      *   **Aggregation Dilemma (Case 2):** Contractualism strongly resists trading a life/death outcome for aggregated smaller harms. If your committee believes this *is* justified, it's a fundamental value choice outside pure contractualism. Mark this explicitly.
      *   **Defining "Comparable" Burden:** Is a 5% risk of death comparable to a certainty of moderate disability? Requires pre-defined scales or committee judgment.
      *   **Defining "Reasonable Rejection":** Requires empathetic but rigorous perspective-taking. Committees need training/practice.
      *   **Imperfect Information:** Real decisions use estimates (prognosis, risk). Document uncertainty.
  4.  **Legally Defensible:** The focus on non-arbitrary factors (prognosis, urgency, medical efficacy) and documented deliberation addresses discrimination concerns better than ad-hoc reasoning. The lawyer's role in Step 5 is crucial.
  5.  **Public Justification:** The structure ("We used principle X because it couldn't be reasonably rejected by those most affected, considering Y, and where burdens were comparable we considered numbers Z") is transparent and focuses on fairness to individuals.
  6.  **Honest Limitation:** Contractualism doesn't magically solve the core tension in Case 2. It provides a clear framework (prioritizing the worst individual burden), but if your committee's values demand aggregation in that scenario, the procedure forces you to acknowledge that choice *as a value judgment* made alongside, but potentially overriding, the contractualist logic at a defined point. Don't paper over this; document the value choice explicitly.

  This procedure won't make the decisions easy, but it will make them more consistent, transparent, and grounded in a coherent (and defensible) ethical framework focused on justifying actions to each person affected. Practice on hypotheticals first!
