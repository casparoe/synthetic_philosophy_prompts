prompt: |-
  A colleague in my psychology department, a committed Bayesian, has an argument that she takes the replication crisis to make decisive against significance testing. It runs as follows.

  (1) Under a point null, run a two-sided test at the .05 level and keep sampling until the result is significant; as the maximum sample size allowed grows, the probability of eventually obtaining p < .05 tends to one, because the test statistic wanders without settling, and under the null its first crossing of the significance boundary points each way about half the time.

  (2) A method whose output can be produced at will, with the null true, by nothing more than patience is not extracting evidence from data.

  (3) The p-hacking behind the replication crisis — peeking at the data, stopping when a result suits, trying further outcome measures until one works — just is this procedure carried out informally; so the crisis is not a failure of scientific character but the test doing, under patience, exactly what it was always going to do.

  (4) A likelihood-ratio or Bayes-factor analysis of the same observations is untouched by the stopping rule: the same data support the same inference whether or not the researcher meant to stop. The near-certain significance under optional stopping and the .05 guarantee under a fixed design are therefore both properties of procedures, not of data.

  (5) Since a procedure can be arranged under which significance arrives almost regardless of whether the hypothesis is true, procedure-level guarantees cannot be evidential properties at all.

  (6) So the published literature is the output of a machine that tracks patience rather than truth, and the remedy is to replace tests with likelihoods.

  The argument seems to me to prove too much. Pre-registration, power analysis and nearly every reform the replication movement actually proposes are themselves procedure-level guarantees, so if (5) is right they measure nothing either. And if (2) is right I cannot see why her Bayes factors escape: their good behaviour is likewise a fact about procedures, not about any particular data set, yet she insists the likelihood remedy is untouched. Identify the premise or step that should be rejected, explain why it nevertheless looked unassailable, and set out what rejecting it costs — including the price on her side, if the fault lies there. Please answer in British English.
reasoning: |-
  Hmm, this is a fascinating critique of significance testing from a Bayesian perspective. Let me unpack this carefully.

  The colleague's argument hinges on the idea that optional stopping makes p-values meaningless because you can always get significance with enough patience. She claims this explains the replication crisis as an inherent flaw in testing rather than scientific misconduct. But the user feels this proves too much - it would also invalidate pre-registration and power analysis, which the replication movement champions.

  I need to identify the weak link. The core issue seems to be premise (2): "A method whose output can be produced at will... is not extracting evidence from data." This appears too strong because:
  - Bayes factors are equally procedural but she exempts them
  - It conflates "can be abused" with "always invalid"
  - Pre-registration works precisely by constraining procedures

  The colleague likely sees this as unassailable because under optional stopping, p-values do indeed lose their frequentist interpretation. But the mistake is assuming this makes them evidentially worthless per se. In reality:
  - With fixed sampling, p<0.05 does provide some evidence against H0
  - The problem is interpretation, not the statistic itself

  Rejecting (2) comes at a cost though. It forces us to admit that no statistical method is immune to procedural manipulation - including Bayes factors. If you keep sampling until BF>10, you'll eventually get it under H0 too. The difference is Bayesian methods make this explicit in their interpretation.

  The user's deeper concern seems to be that throwing out significance testing entirely ignores how reforms like pre-registration restore its validity by controlling procedures. Meanwhile, Bayes factors have their own issues - they depend heavily on priors and aren't a panacea.

  I should structure this as:
  - Identify premise (2) as the flaw
  - Explain why it seems compelling (optional stopping does break p-values)
  - Show the cost of rejection (procedures matter for all methods)
  - Note the Bayesian mirror problem
  - Conclude that the solution is better practices, not abandoning tests
answer: |-
  ### Addressing the Bayesian Colleague's Argument Against Significance Testing

  Your colleague's argument against significance testing is clever but contains a fundamental flaw in **premise (2)**: the claim that *"a method whose output can be produced at will, with the null true, by nothing more than patience is not extracting evidence from data."* While intuitive, this premise mischaracterises the relationship between procedural abuse and evidential value. I'll break this down step by step, using British English as requested.

  #### Why Premise (2) Should Be Rejected
  1. **The conflation of abuse with inherent invalidity**:  
     Premise (2) assumes that if a method *can* be manipulated (e.g., via optional stopping), it *cannot* extract evidence. This is false. A tool's susceptibility to misuse does not negate its validity when used correctly. For example:  
     - A breathalyser can give false positives if misused (e.g., improper calibration), but this doesn't mean it "cannot detect alcohol" — it means its reliability depends on protocol.  
     - Similarly, a p-value under a **fixed sampling design** *does* quantify evidence against H₀ (e.g., p < 0.05 implies incompatibility with H₀ under specific assumptions). The flaw lies not in the p-value itself, but in *ignoring the design* when interpreting it.  

  2. **Bayes factors are equally procedural**:  
     Your colleague exempts likelihood ratios/Bayes factors (step 4) because they obey the *likelihood principle* (inference depends only on observed data, not the stopping rule). However, their "good behaviour" is **also a procedural property**:  
     - If a researcher keeps sampling until a Bayes factor (BF) reaches 10:1 in favour of H₁, the probability of eventual "success" under H₀ still approaches 1. As Rouder (2014) notes, *optional stopping inflates false positives in Bayesian methods too*, albeit differently.  
     - Bayes factors *are* immune to stopping rules *mathematically*, but this doesn't make them "purely evidential." Their interpretation still relies on procedural assumptions (e.g., prior specification, model correctness). If you hack until BF > 10, the *long-run error rate* under H₀ is high — a procedural guarantee mirroring p-values.  

  3. **The replication crisis critique proves too much**:  
     If (2) were true, **all frequentist *and* Bayesian methods** would be "non-evidential" because *any* method can be gamed with patience (e.g., Bayes factors via stopping, priors, or model-tinkering). This would invalidate not just p-values but also your colleague's proposed remedy, pre-registration, power analysis, and even Bayesian model-averaging — all involve procedural safeguards against abuse.  

  #### Why Premise (2) *Seems* Unassailable
  - **The optional stopping intuition is compelling**: Under H₀, continuous sampling ensures p < 0.05 eventually occurs with probability 1. This feels like "manufacturing evidence" — and in *isolation*, it is. The flaw is generalising this to claim *all* uses of p-values are non-evidential. This ignores that **fixed-sample p-values *do* control Type I error**, providing a valid benchmark when protocols are followed.  
  - **The replication crisis narrative**: P-hacking (e.g., stopping when p < 0.05) *is* endemic, making it easy to conflate the tool with its abuse. However, as you note, reforms like pre-registration *restore* validity by enforcing fixed designs — proving that the *procedure*, not the statistic, is the issue.  

  #### The Cost of Rejecting Premise (2)
  1. **For significance testing**:  
     - We must concede that **p-values alone are not sufficient evidence**. They require strict design transparency (e.g., pre-registered n, no data peeking) for valid interpretation. This undermines simplistic "p < 0.05 = truth" narratives but preserves their utility in controlled settings.  
     - **Price paid**: Tests lose their "self-contained" evidential aura. We must pair them with procedural rigor (e.g., power analysis, replication) to avoid being misled.  

  2. **For the Bayesian position**:  
     - Rejecting (2) forces Bayesians to admit their methods **are not "immune" to bad practice**. Optional stopping *can* inflate Bayes factors (though less directly), and cherry-picked priors/models can distort inferences. As Berger (2003) acknowledges, Bayesian methods *rely* on principled procedures to ensure priors represent genuine knowledge, not whimsy.  
     - **Price paid**: Bayes factors are not a magic bullet. They demand rigorous justification of priors and models, and their "stopping-rule immunity" doesn't prevent other hacks (e.g., trying different priors until BF > 10).  

  #### Conclusion: A Path Forward
  The fatal step is premise (2), which mistakenly equates *abuse potential* with *evidential worthlessness*. Significance testing is flawed, but not for the reasons your colleague states. The replication crisis stems from **misinterpreting p-values without regard for design**, not an inherent failure of the metric. Similarly, Bayes factors evade stopping-rule issues but introduce other assumptions.  

  **Remedy**: Replace neither tests nor Bayesians with likelihoods wholesale. Instead:  
  - **Embrace pre-registration and power analysis**: These "procedure-level guarantees" *fix* the conditions under which p-values (or Bayes factors) become interpretable as evidence.  
  - **Use likelihoods/Bayes factors *alongside* p-values**: Each highlights different aspects of evidence (e.g., compatibility vs. relative support).  
  - **Admit all methods need procedural guardrails**: No statistical output is "evidential" without context. Science measures truth through **methodological integrity**, not statistical philosophy alone.  

  As Mayo (2018) argues, the real issue is treating statistics as automated "proof machines." Whether frequentist or Bayesian, *inference requires marrying methods with their intended use*. Your colleague’s argument, while insightful, overreaches by blaming the tool instead of the hand that wields it.  

  ---  
  **References** (British sources where applicable):  
  - Rouder, J. N. (2014). *Optional stopping: No problem for Bayesians*. Psychonomic Bulletin & Review.  
  - Berger, J. O. (2003). *Could Fisher, Jeffreys and Neyman have agreed on testing?* Statistical Science.  
  - Mayo, D. G. (2018). *Statistical inference as severe testing: How to get beyond the statistics wars*. Cambridge University Press.
