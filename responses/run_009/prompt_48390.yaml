  Also, the user emphasized not splitting the baby without reason. So, the compromise must be justified. For 2D art, photos and descriptions might suffice, especially with Doreen's expertise. For 3D installations, physical presence is key to assess scale and interaction. That's a principled distinction.

  Including measures like high-quality video walkthroughs for installations could help, but currently, those might not be available. So, Doreen's vote wouldn't count there until she can attend or better tech is in place. This balances integrity with inclusivity.

  The memo should acknowledge both viewpoints to show neither side is dismissed. Highlighting Doreen's value and the chair's valid concerns fosters mutual respect. Also, framing it as a temporary adjustment for fairness and integrity, not exclusion.

