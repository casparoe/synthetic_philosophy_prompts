  On the other hand, Doreen is hurt by this. She's a long-term member with expertise, and excluding her feels unfair and ableist. Mark's notes are thorough, and Doreen's experience allows her to interpret them effectively. Plus, forcing her out might set a bad precedent and lose valuable input.

