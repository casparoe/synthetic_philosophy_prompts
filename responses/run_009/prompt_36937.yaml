answer: |-
  ### Decision Tree: Ethics of Preference Idealization  
  **Shared Starting Point**: A benevolent agent should act on idealized preferences (what people *would* want under improved conditions), not their current, possibly flawed preferences. Answer the questions below to find your position. Labels are irrelevant—focus on your beliefs.  

  ---

  #### **Node 1: Whose Preferences Are Idealized?**  
  - **A. One person** (e.g., medical decisions for an incapacitated patient) → *Go to Node 2*  
  - **B. A bounded group** (e.g., family, organization, community) → *Go to Node 4*  
  - **C. Everyone** (e.g., global AI policy, societal reform) → *Go to Node 4*  

  #### **Node 2 (Scope: One Person): What Is the Core of Idealization?**  
  - **A. Cognitive refinement only** (e.g., full information, logical coherence, calm reflection) → *Go to Node 3*  
  - **B. Moral improvement** (aligning preferences with ethical truths) → *Leaf 1: Moral Perfectionism*  

  #### **Node 3 (One Person + Cognitive Refinement): Is the Output Procedural or Substantive?**  
  - **A. Procedural**: Corrects errors but preserves core desires (e.g., "I still want X, just without mistakes") → *Leaf 2: Full-Information Accounts*  
  - **B. Substantive**: Transforms desires (e.g., "I now want Y because I see it’s better") → *Leaf 3: Coherent Extrapolated Volition (Individual)*  

  #### **Node 4 (Scope: Group/Everyone): What Does Idealization Include?**  
  - **A. Only non-moral elements** (information, coherence, reflection) → *Go to Node 5*  
  - **B. Moral improvement** (even if combined with non-moral elements) → *Go to Node 6*  

  #### **Node 5 (Group/Everyone + Non-Moral Idealization): How Are Conflicts Resolved?**  
  - **A. Aggregation/voting** (e.g., sum or average preferences) → *Leaf 4: Idealized Preference Utilitarianism*  
  - **B. Further idealization** (seek convergence via more refinement) → *Leaf 5: Coherent Extrapolated Volition (Original CEV)*  
  - **C. Declared beyond theory** (conflicts require external resolution) → *Leaf 6: Procedural Minimalism*  

  #### **Node 6 (Group/Everyone + Moral Improvement): How Are Conflicts Resolved?**  
  - **A. Aggregation/voting** → *Leaf 7: Aggregated Moral Preferences*  
  - **B. Further idealization** → *Go to Node 7*  
  - **C. Veto power** (any member can block) → *Leaf 8: Moral Unanimity*  

  #### **Node 7 (Moral Improvement + Further Idealization): What Is the Output?**  
  - **A. Preferences to satisfy** → *Leaf 9: Convergence Moral Desire*  
  - **B. Judgment to defer to** → *Leaf 10: Unoccupied (Moral Convergence Deference)*  

  ---

  ### **Leaves**  
  1. **Moral Perfectionism**: For one person, idealization adds moral truth. Output is a *judgment* (e.g., "This is right for you") to defer to. *Example: Kantian trusteeship*.  
  2. **Full-Information Accounts**: For one person, idealization adds facts/coherence. Output is *preferences* to satisfy (e.g., Railton’s ideal advisor). *Procedural*.  
  3. **Coherent Extrapolated Volition (Individual)**: For one person, idealization (information + coherence) *substantively* transforms desires. Output is *preferences* to satisfy. *New variant*.  
  4. **Idealized Preference Utilitarianism**: For groups, non-moral idealization. Conflicts resolved by aggregation. Output is *preferences* to satisfy (e.g., Harsanyi).  
  5. **Coherent Extrapolated Volition (Original CEV)**: For everyone, non-moral idealization (information + reflection). Conflicts resolved by further idealization until convergence. Output is *preferences* to satisfy (e.g., Yudkowsky’s AI alignment).  
  6. **Procedural Minimalism**: For groups, non-moral idealization only. Conflicts are "beyond theory." Output is *preferences* to satisfy, but only if no conflict. *New variant*.  
  7. **Aggregated Moral Preferences**: For groups, moral improvement. Conflicts resolved by aggregation. Output is *preferences* to satisfy. *Example: Idealized social contract with voting*.  
  8. **Moral Unanimity**: For groups, moral improvement. Conflicts resolved by veto. Output is *preferences* to satisfy only if unanimous.  
  9. **Convergence Moral Desire**: For groups, moral improvement + further idealization. Output is convergent *preferences* to satisfy. *Example: "What a morally enlightened humanity would desire."*  
  10. **Unoccupied: Moral Convergence Deference**: For groups, moral improvement + further idealization. Output is a convergent *judgment* to defer to. *No known theory defends this*.  

  ---

  ### **Notes**  
  - **Indistinguishable Pair**: **Leaf 2 (Full-Information)** and **Leaf 3 (CEV Individual)** both apply to one person with cognitive refinement. The tree cannot separate procedural vs. substantive transformations cleanly here without more context.  
  - **Unoccupied Region**: **Leaf 10 (Moral Convergence Deference)**. This combines:  
    - Moral improvement for everyone + further idealization → convergent *judgment* (not preferences).  
    - **Why unoccupied?** Neglect—it’s coherent (group deference to a moral "verdict") and potentially attractive (e.g., for AI enforcing human rights), but overlooked in favor of preference-centric theories.  
  - **Surprise Factor**: Students may land on **Leaf 3 (CEV Individual)** or **Leaf 10 (Unoccupied)** without realizing these are rarely discussed. Self-identified "anti-paternalists" might end up at **Leaf 6 (Procedural Minimalism)**, which rejects resolving conflicts—a radical stance.  
  - **Key Distinctions**: The tree isolates differences in *scope*, *moral vs. non-moral*, *conflict resolution*, and *output type*. Labels like "paternalist" or "libertarian" often blur these.
