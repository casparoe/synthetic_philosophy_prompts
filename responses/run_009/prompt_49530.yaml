     Step 1: Symmetry argument.

          The symmetry argument says that switching should not matter because the situation is symmetric. However, we have just seen that conditionally on the observed amount, switching is always beneficial. But unconditionally, the expected gain does not exist. This seems to break the symmetry.

          Actually, the symmetry argument is valid in the sense that the unconditional distribution of the two envelopes is the same: the amount in your envelope and the amount in the other envelope have the same distribution. To see this, note that in any pair, the two amounts are distinct, but over the entire distribution, the probability of observing any particular amount A (which is 2^m) is the same as the probability of that amount being in the other envelope? 

          However, the unconditional expected gain from switching is undefined. So the symmetry argument does not yield a finite expected gain of zero, but it does yield that the two envelopes are identically distributed. And for an identically distributed pair (X,Y), we have E[X-Y] = 0? But note: this expectation is not defined in the usual sense because E|X| and E|Y| are both infinite. So we cannot use linearity of expectation.

     Step 2: Pointwise switching calculation.

          As above, for every observed amount A, the conditional expected gain from switching is positive. Specifically, we computed it as A * (p - q/2) which is positive.

     Step 3: Comparison of strategies.

          If we fix a strategy, we can try to compute the expected gain. But the unconditional expected gain for switching is undefined.

          However, note that if we do not switch, the expected amount we get is:

              E[amount] = sum_{k} [ (1/2)*c*(1/r)^{|k|} * 2^k + (1/2)*c*(1/r)^{|k|} * 2^{k+1} ]
                         = sum_{k} (1/2)*c*(1/r)^{|k|} * (2^k + 2^{k+1})
                         = sum_{k} (1/2)*c*(1/r)^{|k|} * 3 * 2^k
                         = (3/2)*c * sum_{k} (2/r)^k * (1/r)^{|k|-k} ? 

          Actually, we have to split by positive and negative k.

          For k>=0: (1/r)^{|k|} = (1/r)^k, so the term is (1/r)^k * 2^k = (2/r)^k.
          For k<0: let k=-n, n>0. Then (1/r)^{|k|} = (1/r)^n, and 2^k = 2^{-n} = (1/2)^n, so the term is (1/r)^n * (1/2)^n = (1/(2r))^n.

          So E[amount] = (3/2)*c * [ sum_{k=0}^∞ (2/r)^k + sum_{n=1}^∞ (1/(2r))^n ]

          The first series diverges (since 2/r>1) and the second converges. Therefore, the expected amount is infinite. Similarly, if we switch, we also get an infinite expected amount. This does not help.

          The issue is that the unconditional expectation of the amount in your envelope is infinite. Therefore, any finite gain is negligible? But we are interested in the gain from switching.

          The key is that the series for the expected gain by conditioning:

              E[gain | A] is positive for every A, so if we try to compute the expected gain by conditioning:

                  E[gain] = E[ E[gain | A] ]

              But E[gain | A] = k * A for some positive constant k (depending on r) but actually it varies with A. However, we know that E[gain | A] >= δ * A for some δ>0? In our calculation, the factor is (2-r)/(2(r+1)) for m>=1, which is a positive constant for fixed r. For m<=-1, it's (2r-1)/(2(r+1)) which is also a positive constant. For m=0, it's (2r-1)/(2(r+1)). So let δ = min{ (2-r)/(2(r+1)), (2r-1)/(2(r+1)) } > 0. Then E[gain | A] >= δ * A.

              Then E[gain] >= E[ δ * A ] = δ * E[A] = ∞.

              So this would suggest that the expected gain is +∞.

          But wait, we also have an argument that the unconditional expectation is undefined (because the positive and negative parts are both infinite). How to reconcile?

          The error is in the step:

              E[gain] = E[ E[gain | A] ]

          This law of total expectation requires that E|gain| < ∞, which is not true. Alternatively, it holds if we have a signed measure and the series is absolutely convergent? But in this case, it is not.

          In fact, the law of total expectation in the form that we are trying to use is not valid when the unconditional expectation does not exist.

          Therefore, the inference from the pointwise conditional gains to the unconditional gain fails because the series of the conditional gains weighted by the probability of A is not absolutely convergent. Specifically, the series:

              E[ E[gain | A] ] = sum_{m} E[gain | A=2^m] * P(A=2^m)

          = sum_{m} [ positive constant * 2^m ] * P(A=2^m)

          But P(A=2^m) is about c * (1/r)^{|m|} (times a factor that is bounded), so the term is roughly 2^m * (1/r)^{|m]}.

          For m>=0: 2^m * (1/r)^m = (2/r)^m -> diverges since 2/r>1.
          For m<0: 2^m * (1/r)^{-m} = (1/2)^{-m} * (1/r)^{-m} = (r/2)^{-m} = (2/r)^{|m|} -> diverges as well since 2/r>1.

          So the series diverges. Therefore, we cannot compute the unconditional expectation by this summation.

          The standard condition that licenses the inference (that the unconditional expectation is the average of the conditional expectations) is that the unconditional expectation of |gain| is finite. But we know that E|gain| = ∞.

     Step 4: The sharpest student's argument.

          The student says: the conditional expected gain is always positive, and the series of the conditional gains weighted by the probability of A is a series of positive terms that diverges to infinity. Therefore, the expected gain from switching is +∞.

          But note: the gain can be negative. The student's argument only shows that the positive part is infinite, but the negative part is also infinite. And we cannot subtract two infinities arbitrarily.

          However, in our case, the gains are not always positive. They are positive sometimes and negative sometimes. The student's series is for the positive part of the conditional gains? Actually, the conditional expected gain is positive, so the entire term is positive. The series is:

              sum_{m} E[gain | A=2^m] * P(A=2^m) 

          and every term is positive. So it is a series of positive terms that diverges to infinity. This shows that the expectation of the gain, if it exists, must be positive infinity. But we know that the expectation does not exist because the integral of the negative part is also infinite.

          How can we reconcile? 

          The issue is that the random variable "gain" is defined on the sample space. The sample space has outcomes that are pairs (k, choice) where choice says which envelope we picked. The gain function is defined on these outcomes. When we try to compute the expectation by conditioning on A, we are grouping outcomes that have the same A. But note that the events {A=2^m} are not finite: there are two outcomes that yield A=2^m (for each m): 
              outcome1: pair m, pick the smaller (so A=2^m, gain=2^m)
              outcome2: pair m-1, pick the larger (so A=2^m, gain=-2^{m-1} = -2^{m}/2)

          The series by conditioning on A=2^m is:

              [ E[gain | A=2^m] ] * P(A=2^m) = [ (2^m) * p + (-2^{m-1}) * q ] * P(A=2^m)

          But note: the two outcomes that yield A=2^m are already included in the event. However, when we sum over m, we are covering all outcomes.

          But the total expectation is:

              sum_{m} [ (2^m) * P(outcome1) + (-2^{m-1}) * P(outcome2) ]

          = sum_{m} [ (2^m) * (1/2)*c*(1/r)^{|m|} + (-2^{m-1}) * (1/2)*c*(1/r)^{|m-1|} ]

          But note that the event A=2^m corresponds to two outcomes that are in different pairs. So this is the same as the overall expectation.

          And we know that this overall expectation breaks into pairs and each pair contributes 0, so the total is 0.

          But when we group by m, we get:

              For each m, the contribution is: 
                  (2^m) * (1/2)*c*(1/r)^{|m|} + (-2^{m-1}) * (1/2)*c*(1/r)^{|m-1|}

          = (c/2) * [ 2^m * (1/r)^{|m|} - 2^{m-1} * (1/r)^{|m-1|} ]

          Now, let's see the pattern by considering m:

            m=0: 
                2^0 * (1/r)^0 = 1
                2^{-1} * (1/r)^{| -1 |} = (1/2) * (1/r) = 1/(2r)
                term = (c/2) * [1 - 1/(2r)]

            m=1:
                2^1 * (1/r)^1 = 2/r
                2^{0} * (1/r)^{0} = 1
                term = (c/2) * [2/r - 1]

            m=2:
                2^2 * (1/r)^2 = 4/r^2
                2^{1} * (1/r)^{1} = 2/r
                term = (c/2) * [4/r^2 - 2/r]

            m=-1:
                2^{-1} * (1/r)^{1} = 1/(2r)
                2^{-2} * (1/r)^{2} = 1/(4r^2)
                term = (c/2) * [1/(2r) - 1/(4r^2)]

          If we sum over m, we get a telescoping series? Not obviously.

          But note: the total expectation is 0, so the sum of these terms must be 0.

          However, the series of conditional expectations is:

              sum_{m} E[gain | A=2^m] * P(A=2^m) = sum_{m} [ ... ] 

          and we can compute it as the same as the total expectation? But wait, the event A=2^m has two outcomes, and we are summing over m. This is just a rearrangement of the double sum. And since the series is not absolutely convergent, the rearrangement may matter.

          In fact, if we sum over m in increasing order, we might get a different answer than if we sum by pairs.

          This is the Riemann rearrangement theorem. 

          Therefore, the student's series (which is a particular grouping) diverges to infinity, but a different grouping (by pairs) yields 0.

          And the definition of expectation requires a particular order? Actually, no. The expectation is defined as the integral over the sample space. It is independent of the order. But when the integral is not absolutely convergent, then the expectation is not defined. 

          So the unconditional expectation does not exist.

          The student's argument that the expected gain is +∞ is not valid because it is based on a particular summation order (by the amount A) and we can find another order that yields a different sum.

     Step 5: Truncate the distribution at a finite cap.

          We restrict the pairs to |k| <= N for a large N. Then the distribution is finite. 

          Now, the unconditional expected gain from switching can be computed by pairs, and it is 0.

          But what about the conditional expected gain? 

          For an amount A=2^m that is not at the boundary (i.e., m not equal to N or -N), the conditional expected gain is still positive, as before.

          However, consider the largest amount: A = 2^{N+1} (which appears as the larger amount in pair k=N) but wait, what amounts are present?

          The pairs are for k from -N to N. The amounts range from 2^{-N} to 2^{N+1}.

          For an amount A=2^m:

            - If m is such that |m|<=N and |m-1|<=N, then the conditional expected gain is positive (as before).

            - But if m = N+1, then it can only appear as the larger amount in pair k=N. 
              Because the pair k=N+1 is not included. 
              So P(A=2^{N+1}) = P(pair N and picked the larger envelope) = (1/2) * c_N * (1/r)^N, 
              where c_N is the normalizing constant for the truncated distribution.

              Given A=2^{N+1}, the only possibility is that we are in pair N and we picked the larger envelope. Therefore, the other envelope is 2^N = A/2. 
              So the conditional expected gain from switching is: (A/2 - A) = -A/2 < 0.

            - Similarly, if m = -N-1, then it can only appear as the smaller amount in pair k=-N-1? But k=-N-1 is not included. Actually, the smallest amount is 2^{-N}. So we don't have an envelope with 2^{-N-1}. 

            - What about the amount 2^{-N}? 
              It can be:
                 - the smaller amount in pair k=-N: then the other envelope is 2^{-N+1} (if -N+1 >= -N, which is true) -> but wait, pair k=-N: smaller=2^{-N}, larger=2^{-N+1}. 
                 - the larger amount in pair k=-N-1: but that pair is not included.

              So it only appears as the smaller amount in pair k=-N. Therefore, the other envelope is 2^{-N+1} = 2 * A. So the gain is A>0.

            - And for the amount 2^{N+1}: only as the larger in pair k=N, so gain is -A/2.

          Therefore, in the truncated distribution:
              - For A=2^{N+1}: conditional expected gain = -A/2 < 0.
              - For all other amounts: conditional expected gain is positive.

          The damage is confined to the topmost amount (and also the bottommost? We just saw that the bottommost amount is 2^{-N} and it has positive gain). 

          But note: the amount 2^{-N} appears and has positive gain. The amount 2^{N+1} is the only one with negative gain.

          Since the probability of seeing the amount 2^{N+1} is very small (exponentially decaying in N), the overall expected gain is still 0 by the pair argument.

          The moral: a player who has not yet opened the envelope cannot distinguish the truncated world from the untruncated one? But in the truncated world, if they open and see the top amount, they do not want to switch. In the untruncated world, they always want to switch. However, the probability of seeing the top amount goes to 0 as N->∞.

     Step 6: Reply to the defender of the naive switcher.

          The defender says: conditioning on the observed amount is what a rational agent does. So if conditionally switching is always beneficial, then the rational agent should switch.

          But then we are in the untruncated world, and the defender says: switch. However, we can apply the same reasoning after switching: we are holding a new amount, and conditionally on that new amount, we should switch again. This leads to infinite switching.

          But the flaw is that the agent's decision is made based on the observed amount. In the untruncated world, no matter what amount they see, they will want to switch. But note that switching does not yield a defined expected gain in the unconditional sense. It is not that switching yields a gain of infinity: it simply doesn't have an expected gain.

          Moreover, if they are allowed to switch only once, then conditionally they gain in expectation. But unconditionally, the expectation does not exist. However, if they are going to play this game only once, does that matter? 

          The problem is that the conditional expectation is positive for every A, so conditionally they should switch. But the unconditional nonexistence of expected gain does not prevent the conditional analysis.

          However, the difficulty is that the conditional expected gain, while positive, is not bounded away from zero in a way that would guarantee a positive gain with probability one? Actually, the gain can be negative sometimes. But conditionally, the expected gain is positive. 

          The real catch is that the decision to switch does not depend on the amount: it is always beneficial conditionally. But note that the amount is part of the information. So the agent is using the information. 

          But then why is the symmetry argument valid? It is valid in the sense that the two envelopes are symmetric in the overall distribution. However, the agent breaks the symmetry by observing the amount. The amount gives information about which pair they are in. 

          In the end, the defender's position is not refuted: conditionally, switching is beneficial. The paradox then is that switching is conditionally beneficial but unconditionally undefined. 

          The exhibit shows that the symmetry argument does not imply that the unconditional expected gain is zero, but it does imply that the two envelopes are identically distributed. And for identically distributed random variables, the expected gain is not necessarily zero if the expectations are infinite. 

          So the moral is: when expectations are infinite, our intuition breaks. The agent should condition on the amount and then decide to switch. But they should not be surprised that the overall expected gain is not defined.

     Step 7: What the exhibit cannot reproduce.

          The humbler version of the paradox: where the total expectation is finite and the switching argument is simply a probability error.

          For example, suppose we have a finite number of pairs. Then the symmetry argument works: the unconditional expected gain is 0. But the conditional expected gain is not always positive: it is positive for some amounts and negative for others. In fact, in our truncated distribution, the top amount has a negative conditional expected gain. So in that case, the naive fifty-fifty assumption is what leads to the error.

          How to deploy the case:

            Before the reveal: 
              - Students should compute the conditional expected gain in the truncated distribution (with N large) for a few amounts: say, for A=1, A=2, A=4, and also for the top amount if they can figure it out.
              - They should see that for most amounts, the conditional expected gain is positive, but for the top amount it is negative.
              - Then reveal the untruncated distribution and show that now the conditional expected gain is always positive, but the unconditional expected gain is undefined.

            The limits of the demonstration:
              - The example uses discrete amounts that are powers of two and a specific distribution. The students might think the paradox is an artifact of these choices.
              - The example uses infinite support, which is not realistic. But the truncation argument shows that the effect is present in finite but large distributions.

          In a fifty-minute session:

            - 10 minutes: present the scenario and the naive switching argument. Have the students compute the conditional expected gain assuming fifty-fifty for a fixed amount A. They will get (0.5)(2A-A) + (0.5)(A/2-A) = A/4 > 0.
            - 10 minutes: present the symmetry argument. Discuss that the unconditional expected gain should be 0, but then why is the conditional always positive?
            - 10 minutes: introduce the explicit distribution (with r=1.5). Have the students compute the conditional probabilities for a specific amount (say A=2). They should see that the two possibilities are not fifty-fifty.
            - 10 minutes: show that the conditional expected gain is positive for every amount. Then compute the unconditional expected gain by pairs (getting 0) and then by splitting into positive and negative parts (showing both are infinite). Discuss why the law of total expectation fails.
            - 10 minutes: truncate the distribution and show that the top amount has a negative conditional expected gain, breaking the always-positive pattern. Discuss the moral.

          The session might run over, so adjust. The key is to show that the fifty-fifty assumption is false in the explicit distribution, but the conditional expected gain is still positive. And to highlight the role of infinite expectations.

     Finally, we choose r=1.5 and write the scenario clearly.
answer: |-
  ### Scenario: The Millionaire's Envelope Game

  A wealthy benefactor has devised a game using pairs of envelopes. For each integer \(n\) (positive, negative, or zero), there is a pair of envelopes containing amounts \((2^n, 2^{n+1})\). The benefactor selects a pair with probability proportional to \(\left(\frac{2}{3}\right)^{|n|}\). For example, the pair \((1, 2)\) (i.e., \(2^0, 2^1\)) has weight \(\left(\frac{2}{3}\right)^0 = 1\), the pair \((2, 4)\) has weight \(\left(\frac{2}{3}\right)^1 = \frac{2}{3}\), the pair \((\frac{1}{2}, 1)\) has weight \(\left(\frac{2}{3}\right)^1 = \frac{2}{3}\), and so on. The normalizing constant is \(\frac{1}{5}\) (since the total weight sums to 5 for \(\frac{2}{3}\)). Within a pair, the benefactor flips a fair coin to decide which envelope to give you. You receive one envelope, open it to see amount \(A\), and must decide whether to switch to the other envelope.

  ### Verification of Specifications
  - **(a) Positive conditional expected gain for every observed \(A\):**  
    For any observed amount \(A = 2^m\), the other envelope is either \(2A\) or \(A/2\). The conditional probabilities are:  
    - If \(m \geq 1\), \(P(\text{other} = 2A) = \frac{1}{2.5} \approx 0.4\), \(P(\text{other} = A/2) = \frac{1.5}{2.5} = 0.6\).  
    - If \(m \leq -1\), \(P(\text{other} = 2A) = \frac{1.5}{2.5} = 0.6\), \(P(\text{other} = A/2) = \frac{1}{2.5} = 0.4\).  
    - If \(m = 0\), \(P(\text{other} = 2A) = \frac{1.5}{2.5} = 0.6\), \(P(\text{other} = A/2) = \frac{1}{2.5} = 0.4\).  
    The expected gain from switching is:  
    \[
    \text{Gain} = 
    \begin{cases} 
    A \left( \frac{2 - 1.5}{2 \times 2.5} \right) = \frac{A}{10} > 0 & \text{if } m \geq 1, \\
    A \left( \frac{2 \times 1.5 - 1}{2 \times 2.5} \right) = \frac{2A}{10} > 0 & \text{if } m \leq -1, \\
    A \left( \frac{2 \times 1.5 - 1}{2 \times 2.5} \right) = \frac{2A}{10} > 0 & \text{if } m = 0.
    \end{cases}
    \]  
    Thus, for every \(A\), the conditional expected gain is strictly positive (e.g., for \(A=2\), gain \(=0.2\); for \(A=\frac{1}{2}\), gain \(=0.1\)).

  - **(b) Unconditional expected gain does not exist, symmetry explained:**  
    The symmetry argument states that switching should not matter since the envelopes are identical in distribution. However, the unconditional expected gain from switching is undefined. For each pair \((2^n, 2^{n+1})\), the gain from switching is \(+2^n\) (if you have \(2^n\)) or \(-2^n\) (if you have \(2^{n+1}\)), each with probability \(\frac{1}{2} \times P(\text{pair})\). The expected gain for pair \(n\) is \(0\), but the expected gain from switching across all pairs is:  
    \[
    \sum_{n=-\infty}^{\infty} \left[ \frac{1}{2} \cdot \frac{1}{5} \cdot \left(\frac{2}{3}\right)^{|n|} \cdot 2^n - \frac{1}{2} \cdot \frac{1}{5} \cdot \left(\frac{2}{3}\right)^{|n|} \cdot 2^n \right] = 0.
    \]  
    Despite this, the positive part (gains) and negative part (losses) separately diverge:  
    \[
    \text{Expected gains} = \sum_{n} \frac{1}{10} \left(\frac{2}{3}\right)^{|n|} 2^n = \infty, \quad \text{Expected losses} = -\sum_{n} \frac{1}{10} \left(\frac{2}{3}\right)^{|n|} 2^n = -\infty.
    \]  
    Thus, the unconditional expectation is \(\infty - \infty\), undefined. Symmetry holds (both envelopes have the same distribution), but infinite expectations invalidate the naive conclusion of zero expected gain.

  - **(c) Naive fifty-fifty premise false, yet switching is conditionally beneficial:**  
    The naive argument assumes \(P(\text{other} = 2A) = P(\text{other} = A/2) = \frac{1}{2}\). Here, this is false (e.g., for \(A=2\), probabilities are \(0.4\) and \(0.6\)). However, switching is still conditionally beneficial due to asymmetric probabilities. This punishes the lazy dismissal (ignoring distribution) and lazy derivation (incorrect fifty-fifty assumption) equally.

  ### Key Demonstration Points
  1. **Failure of pointwise-to-unconditional inference:**  
     The series \(\sum_m E[\text{gain} \mid A=2^m] P(A=2^m)\) has strictly positive terms and diverges (since \(E[\text{gain} \mid A=2^m] \propto 2^m\) and \(P(A=2^m) \propto \left(\frac{2}{3}\right)^{|m|}\), so terms grow as \((\frac{3}{2})^{|m|}\) for \(m < 0\) and \((\frac{4}{3})^m\) for \(m \geq 0\)). Divergence implies the unconditional expectation cannot be finite, but **it does not establish that the expected gain is \(+\infty\)** because the gains and losses are entangled. The standard condition allowing \(E[E[\text{gain} \mid A]] = E[\text{gain}]\) is absolute convergence (\(E[|\text{gain}|] < \infty\)), which fails here.

  2. **Truncation to finite cap (\(N\)):**  
     Restrict to \(|n| \leq N\). The unconditional expected gain is \(0\) by symmetry. For observed \(A\):  
     - If \(A \neq 2^{N+1}\) and \(A \neq 2^{-N}\), the conditional gain is positive (as before).  
     - If \(A = 2^{N+1}\) (only possible if you have the larger envelope in pair \(n=N\)), switching yields \(2^N = A/2\), so gain \(= -A/2 < 0\).  
     - If \(A = 2^{-N}\) (smallest amount, only possible as smaller envelope in pair \(n=-N\)), switching yields \(2^{-N+1} = 2A\), so gain \(= A > 0\).  
     Damage is confined to the top amount (\(2^{N+1}\)), which occurs with probability \(\propto \left(\frac{2}{3}\right)^N \to 0\) as \(N \to \infty\). A player who hasn't opened the envelope sees no difference between truncated and untruncated worlds, but upon seeing \(A\), the optimal decision depends on the truncation.

  3. **Reply to naive switcher's defense:**  
     A defender might argue, "Conditioning on \(A\) is rational, so always switch." However:  
     - **No practical benefit:** The undefined unconditional expectation means switching doesn't guarantee a net gain.  
     - **Infinite switching regress:** If you switch and then reapply the same logic to the new amount, you switch again ad infinitum.  
     - **Symmetry restored:** Before opening, symmetry dictates indifference, as the unconditional gain is undefined, not positive.  
     Conditioning is valid, but the conclusion is fragile: it holds pointwise but not globally due to infinite expectations.

  ### Limitations and Deployment
  - **What the exhibit cannot reproduce:** The humbler paradox where total expectation is finite and switching is a probability error (e.g., with finite pairs and symmetric distribution). Here, the fifty-fifty assumption is false, and switching is harmful for some amounts. Use a separate finite example for that lesson.
  - **Deployment in a 50-minute session:**  
    - **Pre-reveal (20 min):** Give the scenario. Have students compute \(E[\text{gain} \mid A]\) assuming fifty-fifty (get \(A/4 > 0\)) and note the symmetry argument (\(E[\text{gain}] = 0\)). Highlight the conflict.  
    - **Reveal (15 min):** Show the actual distribution. For \(A=2\), compute the true conditional probabilities (not fifty-fifty) and gain (\(0.2 > 0\)). Compute unconditional gain (undefined due to \(\infty - \infty\)).  
    - **Truncation (10 min):** Cap at \(N=2\). Show \(E[\text{gain}] = 0\) and that \(A=8\) (top amount) has negative gain. Discuss why the naive argument fails.  
    - **Moral (5 min):** Infinite expectations break naive inferences; conditioning is local, but rationality requires global coherence.  
    - **Limits:** The case relies on infinite support and may seem artificial. Emphasize that truncation approximates large finite settings, where the paradox resurfaces near boundaries.

  This exhibit forces students to confront the interplay between conditioning, expectation, and infinity, moving beyond superficial resolutions.
