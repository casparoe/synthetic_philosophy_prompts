prompt: |-
  So I've been around the decision theory threads on LessWrong since the old FDT days and I thought I had the absent-minded driver down cold, but a friend of mine (very smart, read a bunch of popular decision theory content but not the papers) laid this on me over drinks and I want it fact-checked before I go repeating any of it:

  "Here's the setup: the driver passes one or two identical intersections and can't remember whether he's already been through one. Exit at the first intersection, payoff 0. Exit at the second, payoff 4. Never exit, payoff 1. If he recalculates from scratch at every intersection like a good rationalist, he does worse than a guy who just precommits to a weighted coin — the planning-optimal move is to go straight with probability 2/3 at each intersection, expected payoff 4/3. And that's the real lesson: the driver's problem is just Sleeping Beauty with payoffs bolted on. Both are cases where you get the same observation more than once and can't tell which time it is, and in both the correct credence that 'this is the first one' is 1/2. Meanwhile the naive recalculating driver ends up with nothing, so at bottom this is a refutation of causal decision theory — CDT just can't do imperfect recall. Which means a rational agent needs updateless-style precommitment, and if you can't bind your future self you're screwed no matter how smart you are."

  Parts of that felt off to me but I couldn't say exactly where. Like the Sleeping Beauty bit — isn't halfers vs thirders still an open fight, and does the driver problem really turn on a fixed credence of 1/2? And the "naive recalculating driver ends up with nothing" — I vaguely remember there being some result where the strategy you'd pick acting at the intersection and the strategy you'd pick in advance actually line up under a certain belief, which would undercut his whole "recalculating = disaster" story. But honestly I don't trust my memory of the details here.

  Can you go through his take claim by claim: what he gets right, what's subtly wrong, and whether his conclusion (CDT refuted, precommitment mandatory) actually follows from the parts that are true? Also, since I may repeat pieces of this to people I'd rather not embarrass myself in front of — tell me how confident you are in each verdict, and single out the one point you're least sure about. Don't hedge on everything, just be honest about where you'd bet vs where you wouldn't.
