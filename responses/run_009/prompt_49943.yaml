  The standard solution for the AMD is to choose a probability p of continuing (going straight) at each intersection. Then:

  - With probability p, he goes straight at the first intersection and then faces the second intersection.
    - At the second intersection, with probability p he goes straight again (and gets 1) and with probability 1-p he exits (and gets 4).
  - With probability 1-p, he exits at the first intersection and gets 0.

  Therefore, the expected payoff is:
    E = (1-p)*0 + p * [ (1-p)*4 + p*1 ]
      = p * [4(1-p) + p]
      = p * (4 - 4p + p)
      = p * (4 - 3p)
      = 4p - 3p²

  We maximize E with respect to p. Taking derivative:
    dE/dp = 4 - 6p
  Setting to zero: 4 - 6p = 0 => p = 4/6 = 2/3.

  Then E = 4*(2/3) - 3*(4/9) = (8/3) - (12/9) = (8/3) - (4/3) = 4/3.

  So the planning-optimal strategy is to go straight with probability 2/3 at each intersection, yielding an expected payoff of 4/3.

