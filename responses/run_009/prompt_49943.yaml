  The setup of the AMD problem:
  - The driver encounters one or two identical intersections (with no memory of past actions).
  - At each intersection, he can choose to exit or go straight.
  - Payoffs:
    - Exit at first intersection: payoff 0
    - Exit at second intersection: payoff 4
    - Never exit (i.e., go straight at both): payoff 1

  The optimal strategy in advance (the planning-optimal) is to go straight with probability p at each intersection. The expected payoff is:
    E = p * [probability that this is the first intersection] * (payoff if go straight now and then exit at second? Or what?) 
