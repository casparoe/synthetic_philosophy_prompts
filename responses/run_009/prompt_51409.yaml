answer: |-
  ### Decision Tree for Drug Policy Positions  
  **Starting Premise**: Recreational drugs can cause serious harm to users.  

  #### The Decision Tree  
  **1. May the state criminalize drug use?**  
     - **Yes** → Go to 2  
     - **No** → Go to 3  

  **2. Should medical use be exempt?**  
     - **Yes** → **Medical-only regime** (e.g., U.S. federal policy for most drugs)  
     - **No** → Go to 4  

  **3. Does heavy addiction justify coercive, non-criminal intervention?**  
     - **Yes** → **Portuguese-style decriminalization** (referral to dissuasion commission)  
     - **No** → Go to 5  

  **4. Should recreational use laws be enforced?**  
     - **Yes** → **Prohibition** (e.g., Japan, Saudi Arabia)  
     - **No** → Go to 6  

  **5. Should supply be legal?**  
     - **No** → *Unstable position*: Legal use + illegal supply → Diagnosed as unworkable (creates a black market for users)  
     - **Yes** → Go to 7  

  **6. Should retail sale be tolerated in licensed venues?**  
     - **Yes** → **Dutch-style de facto tolerance** (e.g., cannabis coffee shops)  
     - **No** → *Unattractive position*: Non-enforced use + no tolerated supply → Diagnosed as incoherent (users rely on illicit markets)  

  **7. May legal drugs be sold commercially?**  
     - **Yes** → **Commercial cannabis legalization** (e.g., Canada, California)  
     - **No** → **Legalization without commercialization** (e.g., social clubs, state monopolies)  

  ---

  ### Commentary  
  #### Named Positions in the Tree  
  - **Prohibition** (Q1=Y, Q2=N, Q4=Y): Criminalizes all non-medical use and supply.  
  - **Medical-only** (Q1=Y, Q2=Y): Criminalizes recreational use but exempts medical use.  
  - **Dutch-style tolerance** (Q1=Y, Q2=N, Q4=N, Q6=Y): Use/supply criminalized on paper but not enforced for users; retail sale tolerated.  
  - **Portuguese decriminalization** (Q1=N, Q3=Y): Use not a crime but prohibited; non-criminal sanctions (dissuasion commissions).  
  - **Commercial legalization** (Q1=N, Q3=N, Q5=Y, Q7=Y): Legal market with profit-driven sales.  
  - **Non-commercial legalization** (Q1=N, Q3=N, Q5=Y, Q7=N): Legal supply via non-profit models (social clubs, state monopolies).  

  #### Untested or Unstable Positions  
  - **Legal use + illegal supply** (Q1=N, Q3=N, Q5=N): Theoretically unstable—users need suppliers, inviting illicit markets.  
  - **Non-enforced use + no tolerated supply** (Q1=Y, Q2=N, Q4=N, Q6=N): Incoherent—users face supply vacuums or enforcement arbitrariness.  

  #### Diagnostic Insights  
  - **Q1 (Criminalization of self-harm)**: The deepest split. "Yes" opens the door to state coercion; "no" anchors in classical liberalism (harm principle).  
  - **Q3 (Coercive treatment for addiction)**: Separates Portuguese decriminalization (non-criminal paternalism) from full legalization.  
  - **Q7 (Commercialization)**: Distinguishes profit-driven markets (Canada) from non-commercial models. Non-commercial legalization is a defensible position—e.g., Uruguay’s state monopoly avoids profit incentives seen as exacerbating harm.  
  - **The Dutch/Portuguese Distinction**: The tree separates them cleanly: Dutch starts with criminalization (non-enforced), Portuguese with decriminalization.  
  - **Medical-only**: A genuine leaf—it carves an exemption from prohibition but retains criminalization for recreation.  

  #### Unused Questions  
  - **Q4 (Supplier asymmetry)**: Prohibitionists see punishing suppliers as principled (profiting from vice); liberals see it as unstable. Not needed for sorting but explains why some positions are untenable.  
  - **Q3 (State endorsement)**: Affects Q7 (non-commercial models avoid state promotion), but doesn’t sort core positions.  
  - **Q6 (Graded harm)**: Principled distinctions (e.g., cannabis vs. heroin) could justify different policies for different drugs. But the tree focuses on *one* drug’s regime to avoid ad hoc branches.  

  #### Theoretical Tension  
  The harm principle (from Mill) justifies *at most* non-commercial legalization—state permission without endorsement or profit incentives. Commercial legalization goes beyond this, prioritizing harm reduction via regulation over liberal purity. The tree shows how a harm-principle liberal (Q1=no, Q3=no) lands at non-commercial legalization unless they accept commercialization (Q7=yes). Non-commercial legalization is not a philosopher’s artifact: it exists (e.g., Uruguay’s state-controlled cannabis, Spanish social clubs) and avoids black markets while limiting corporate influence.
