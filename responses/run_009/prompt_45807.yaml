  Hmm... the user's real anxiety might be about whether pragmatism can survive its own extremes. They're subtly asking: "Can either version avoid self-destruction?" That's smart. The sprinter case especially feels like a trap set by their professor to expose James' potential subjectivism. 

  For Peirce: The counterfactual move ("truth is what would be agreed given infinite time") seems necessary, but does it betray pragmatism? I recall Peirce did emphasize the ideal limit of investigation in his later writings. His "would-be" modality isn't just a disguised correspondence theory—it's grounded in real-world inquiry practices. The key is that for Peirce, truth isn't defined by correspondence but by the process itself. The 50-year deadline fails because it violates the theory's core premise: truth requires the possibility of continued inquiry. It's like asking "What if gravity stopped?" in physics—the question breaks the framework. 

  For James: The sprinter case is tougher. James does say "the true is only the expedient," but he adds crucial constraints: truth must withstand future experience and social verification. That sprinter's belief might "work" now but will crash against reality at the finish line. James also distinguishes "temporary" from "absolute" truth—the belief's utility is context-bound. Still, this feels messier than Peirce. James' "what works" needs careful handling to avoid relativism. 

