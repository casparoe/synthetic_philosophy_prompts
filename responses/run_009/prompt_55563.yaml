  ## Sestina: The Map That Folded Wrong

  That autumn's air was thick with bluff and bluster,
  The gilded table set for talk's pretence.
  They traced the borders, yielding inch by inch,
  Hoping the fevered rhetoric might cool.
  The ink still wet upon the doomed accord,
  The old maps rendered useless overnight.

  What stalked the chancelleries that fragile **night**?
  Not just the spectre of the coming **war**,
  But the grim silhouette of the **Dictator**,
  His appetite enlarged by each **concession**.
  The bitter draft they swallowed at that **summit**
  Became the poisoned **lesson** etched in stone.

  A **lesson** sharpened for the next **Dictator**,
  For every shadow cast by coming **night**.
  Each fresh dread framed within that Munich **summit**,
  Each threat demanding swift response, like **war**,
  Each voice that counselled caution, weak **concession**.
  The past became the only map they brought.

  They brought the map, yet dropped the vital ground:
  The shifting strengths, the allies thin on **ground**,
  The complex chains of cause they called a **lesson**.
  They saw the **Dictator**, the need for **war**,
  The looming cost of one more **concession**,
  The urgent pressure of the ticking **night**,
  The stage forever set for hasty **summit**.

  Forget the vanished context of that **summit**,
  The specific armies massing on the **ground**,
  The brittle coalitions lost by **night**.
  They kept the drama – forceful **Dictator**,
  The fatal lure of offered **concession**,
  The stark binary: submit or choose **war**.

  So later fires were lit as righteous **war**,
  New faces cast upon the **summit** stage,
  New lines drawn firm against mere **concession**.
  The **lesson**, rigid, scanned the new terrain
  And found its shape in each new **Dictator**,
  Each crisis shaded by that precedent **night**.

  The **lesson**, hardened, turned into the **trap**.
  It saw the **Dictator** in every foe,
  Demanded **war** to cauterise the doubt,
  Condemned as **concession** reasoned, measured talk,
  Made every **summit** echo Munich's script,
  Each **night** a deadline borrowed from the past.

  Now watch the **lesson** calcify: a **trap**.
  The **Dictator** must rise, the **summit** fall.
  No **concession**! Lest that old dark **night** return...
  And **war**, the only script the past allows.

  > *The envoi crystallizes the moment of recognition: the pattern ("trap") belongs to the analogy itself ("the past," "the lesson"), not to objective reality. The speaker sees that misreading the unique drama of 1938 as an eternal law ("the only script") is precisely what transformed a historical lesson into a dangerous cognitive trap, forcing new situations into an old, ill-fitting story.*

  **Notes on Execution:**

  1.  **End Words:** `Dictator`, `concession`, `summit`, `war`, `lesson`, `trap`. "Trap" was chosen as the sixth word to encapsulate the analogy's ultimate consequence – a self-imposed cognitive prison. Its repetitions hammer this home.
  2.  **1938 Accuracy:** The poem depicts the core elements accurately: a specific dictator (Hitler) making demands, the summit in Munich, concessions granted (Sudetenland), the immediate aftermath (night after the signing), and the resulting war. It avoids anachronism.
  3.  **What's Kept/Discarded:** The poem explicitly names the elements kept: `Dictator`, `concession`, `summit`, `war`, `deadline` (`night`). It implicitly highlights the discarded elements through phrases like "dropped the vital ground," "shifting strengths," "allies thin," "vanished context," "brittle coalitions," "specific armies," "complex chains of cause," and "new terrain."
  4.  **Gesture, Don't List:** Later crises are evoked through phrases like "later fires," "new faces," "new lines," "new terrain," "each fresh dread," "each crisis," "every foe," without naming Suez, Vietnam, or Iraq. The focus is on the *process* of misapplication.
  5.  **Form as Philosophy:** The sestina's rigid rotation of the same six end words perfectly embodies the phenomenon: a fixed set of concepts (`Dictator`, `concession`, `summit`, `war`, `lesson`, `trap`) is compulsively rearranged ("traced," "framed," "cast," "brought," "scanned," "echo") onto "each fresh dread" and "new terrain." The new situation is forced to fit the old grammatical slots.
  6.  **The Envoi:** The three-line envoi compresses the argument. Line 1 states the core problem: the lesson *became* the trap. Line 2 shows the analogy's mechanism: forcing the dictator-summit dynamic. Line 3 reveals the tragic consequence: forbidding concession leads to war as the only perceived option, driven by the fear of repeating 1938 ("that old dark night"). The half-echoes ("trap," "past," "script," "night") tie it all back.
  7.  **Poem First:** The poem uses concrete imagery (maps, tables, ink, fever, shadows, fires, scripts, stages) alongside the abstract concepts. It builds a narrative of repetition and hardening perception. A reader unfamiliar with the historiography should grasp the core theme of a rigid past story distorting present choices.
