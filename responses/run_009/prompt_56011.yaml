  The quiz format will present each case with clear options, avoiding theory labels. For scoring, I'll group answers by their diagnostic value for each theory, showing which combinations suggest which positions. For mixed results, I'll explain how certain answers are decisive indicators. I'll also flag that some theories (performative vs normative-power) might look identical in this quiz since they often converge in practice, and note that the "personal relationship" case strongly distinguishes moralized theories from others.

