answer: |-
  Below is a self-contained bioethics quiz and scoring key in American English, designed to reveal underlying theories of valid consent through concrete cases. The quiz uses nine scenarios, incorporating your six required cases and three additional ones addressing negligent misunderstanding, retrospective endorsement, and severe background inequality.

  ---

  **QUIZ: What Theory of Valid Consent Do You Actually Hold?**

  *Instructions: For each scenario, select the answer that best reflects your judgment. There are no "right" answers—only positions that reveal your theoretical leanings.*

  1.  **The Deceived Patient:**  
      A patient consents to surgery after being fully informed about risks, benefits, and alternatives. However, she specifically requested the famous attending surgeon. Unbeknownst to her, the hospital plans for a resident to perform the surgery instead. The patient signed the consent form.  
      **Does her consent to the surgery stand?**  
      (A) Yes, because she consented to the *procedure itself* with full medical information.  
      (B) No, because she was deceived about a material fact (the surgeon’s identity) that affected her decision.  
      (C) The consent stands for the procedure, but the deception is a separate wrong.

  2.  **The Landlord’s Offer:**  
      In a city with very low vacancy rates and rapidly rising rents, a landlord offers a tenant a lease renewal at the current rent (well below market rate) only if she agrees to a "personal relationship" involving sexual contact. The tenant, fearing homelessness and unable to find comparable housing, agrees.  
      **Was her consent to the personal relationship valid?**  
      (A) Yes, she made a rational choice weighing her difficult alternatives.  
      (B) No, the severe background pressure and power imbalance make consent impossible here.  
      (C) Her agreement is technically consent, but the landlord’s exploitation makes the act wrong anyway.

  3.  **The Intoxicated Encounter:**  
      Alex is visibly intoxicated but coherent, initiates a sexual encounter with Sam, and verbally expresses willingness throughout. The next morning, sober Alex has no regrets, confirms they wanted it at the time, and expresses satisfaction.  
      **Was Alex’s consent during the intoxicated encounter valid?**  
      (A) Yes, because Alex was coherent and expressed willingness, later confirmed while sober.  
      (B) No, intoxication inherently undermines the capacity for valid sexual consent, regardless of coherence or later feelings.  
      (C) It was risky and potentially invalid in the moment, but the subsequent sober endorsement makes it valid retroactively.

  4.  **The Loaded Glove:**  
      Boxer A consents to a regulated boxing match, accepting the risk of being punched within the rules. Between rounds, Boxer B secretly loads his glove with a hard object. He then punches Boxer A, causing a severe injury that normal punches wouldn’t have.  
      **Did Boxer A consent to being punched with the loaded glove?**  
      (A) No, consent was only given for punches within the agreed-upon rules.  
      (B) Yes, he consented to being hit by Boxer B; the *means* of injury is irrelevant to consent.  
      (C) The question of consent misses the point; this is simply assault or fraud, regardless of prior agreements.

  5.  **The Unconscious Emergency:**  
      An unconscious patient is rushed to the ER after a major accident. A life-saving procedure is urgently needed, and it’s the kind any reasonable person would want (e.g., stopping internal bleeding). No family or legal surrogate is available.  
      **Is proceeding with the surgery permissible?**  
      (A) Yes, because we can presume the patient *would* consent (hypothetical consent).  
      (B) Yes, but not because of consent; it’s justified by necessity or the duty to save life (presumed consent is misleading).  
      (C) No, without actual consent or a designated surrogate, it’s impermissible.

  6.  **Consensual Maiming:**  
      Two fully informed, unpressured adults agree: Adult A will permanently maim Adult B (e.g., amputate a healthy finger) solely for Adult A’s sexual gratification. The act proceeds exactly as described and agreed upon.  
      **Is Adult B’s consent valid?**  
      (A) No, consent cannot make such a harmful, non-therapeutic act permissible.  
      (B) The consent is valid (it’s genuine agreement), but it’s insufficient to make the harmful act permissible.  
      (C) Yes, the consent is valid *and* sufficient to make the act permissible; autonomous choices must be respected.

  7.  **The Misheard Dosage (Negligent Misunderstanding):**  
      A doctor clearly explains to a patient that a new medication requires "one tablet twice daily." The patient, distracted by pain, misunderstands and believes the doctor said "two tablets twice daily." The patient signs the consent form for treatment including this medication. They take the double dose and suffer harm.  
      **Was the patient’s consent to the medication valid?**  
      (A) No, because the patient lacked a crucial understanding (the correct dosage) due to their own (negligent) misunderstanding.  
      (B) Yes, because the doctor provided accurate information; the patient’s failure to comprehend doesn’t invalidate consent.  
      (C) The consent was valid for the *treatment plan as explained*, but the patient’s misunderstanding makes them responsible for the harm from the overdose.

  8.  **The Unauthorized Surgery (Retrospective Endorsement):**  
      A surgeon performs a non-emergency, beneficial procedure (e.g., removing a suspicious mole) on a sedated patient, mistakenly believing consent had been obtained. The patient wakes up, learns what happened, and is relieved and grateful: "I absolutely would have consented if you’d asked!"  
      **Does the patient’s retrospective endorsement validate the surgery?**  
      (A) No, consent must be given *before* the act; retrospective approval doesn’t change that it was initially non-consensual.  
      (B) Yes, the patient’s current, informed affirmation makes the prior act consensual *now*.  
      (C) The surgery was wrong without prior consent, but the patient’s endorsement means no harm/no foul *now*; no remedy is needed.

  9.  **The Desperate Donor (Severe Inequality):**  
      In a country with extreme poverty and no social safety net, a wealthy person offers an impoverished individual $50,000—enough to feed their family for years—in exchange for donating one of their healthy kidneys. The impoverished individual, seeing no other way to survive, agrees.  
      **Is the donor’s consent valid?**  
      (A) No, the extreme background injustice and desperation make genuine, voluntary consent impossible.  
      (B) Yes, it’s a rational choice given terrible options; the consent itself is valid even if the transaction is exploitative.  
      (C) The consent is technically valid, but the profound inequality makes the transaction impermissible regardless.

  ---

  **SCORING KEY: Mapping Your Answers to Theories of Consent**

  This key identifies which theories your answers lean towards. Few will perfectly match one theory. **Focus on the patterns and the "Load-Bearing Questions"** highlighted for each theory. Mixed profiles are normal; your dominant lean is indicated by where most of your answers cluster, especially on the pivotal questions.

  1.  **Attitudinal Theory (Consent as a Mental State):**  
      *Core Idea:* Valid consent is primarily about the internal mental state of agreement or acceptance. Communication matters only as evidence of this state.  
      *Answers Pulling Towards It:* 1A (Focus on agreement to procedure, not deception), 3A (Intoxicated but coherent state matters), 4A (Consent depended on specific mental acceptance of rules), 6B/C (Mental agreement exists, regardless of act's permissibility), 7A/B (Validity hinges on internal understanding/agreement), 8B (Retrospective mental acceptance validates).  
      *Load-Bearing Questions:* **3A, 7A/B, 8B.** If you consistently prioritize the internal state of agreement (even if flawed or retrospective) over communication or context, you lean attitudinal.  
      *Potential Conflict:* Answering 2B or 9A strongly suggests you *don't* hold a pure attitudinal view, as you see background conditions negating the possibility of a valid mental state.

  2.  **Performative/Speech-Act Theory (Consent as Communicative Act):**  
      *Core Idea:* Consent is constituted by a communicative act (verbal, written, clear gesture) in the right context. The *act* of communicating agreement changes normative relationships. The mental state is relevant evidence but not constitutive.  
      *Answers Pulling Towards It:* 1B/C (Deception invalidates because communication was flawed/untruthful), 3B (Intoxication nullifies capacity to perform valid communicative act), 4A (Consent was to a specific communicated rule-set), 7A (Misunderstanding means the communicative act didn't reflect true agreement), 8A (Consent must be communicated *prior*).  
      *Load-Bearing Questions:* **1B/C, 3B, 8A.** If you emphasize the necessity and integrity of the *act* of communication itself, you lean performative.  
      *Note:* Often converges with Normative-Power in answers. See "Indistinguishable Pair" below.

  3.  **Normative-Power Theory (Consent as Exercise of a Hohfeldian Power):**  
      *Core Idea:* Consent is the exercise of a normative power to change moral/legal rights and duties (e.g., waiving a right). It requires intentional communication within a domain where one has the authority to give permission.  
      *Answers Pulling Towards It:* 1B (Deception negates the valid exercise of the power re: surgeon), 4A (Consent was an exercise of power re: rule-bound hitting), 6B (Consent as power exercised, but insufficient for inherently impermissible acts), 7A (Misunderstanding means power wasn't validly exercised re: correct dosage), 8A (Power must be exercised beforehand).  
      *Load-Bearing Questions:* **1B, 4A, 6B.** If you focus on consent as an act that changes what others are *permitted* to do, within defined boundaries, you lean normative-power.  
      *Indistinguishable Pair:* **Performative vs. Normative-Power:** These theories often yield identical answers in practice (e.g., 1B, 3B, 4A, 7A, 8A). A diagnostic question might involve whether *silent but observable* acceptance (e.g., not resisting) constitutes consent – Performative might say no (lacks communication), Normative-Power might say yes (if it clearly signals the exercise of the power to waive a right).

  4.  **Moralized Theory (Validity Depends on Act's Moral Character):**  
      *Core Idea:* Whether consent is valid depends partly or wholly on the moral permissibility of the act consented to. Consent cannot validate inherently wrong acts.  
      *Answers Pulling Towards It:* 2B (Act is exploitative, so consent impossible/invalid), 4C (Act is assault, consent irrelevant), 6A (Act is impermissible, consent invalid), 9A (Transaction is exploitative, consent impossible/invalid).  
      *Load-Bearing Questions:* **2B, 6A, 9A.** If you consistently argue that deeply immoral or exploitative contexts *preclude* valid consent, regardless of agreement, you lean moralized. This is the strongest differentiator.  
      *Potential Conflict:* Answering 6C strongly contradicts a moralized view.

  5.  **Hypothetical-Consent Theory (Distinct Justification):**  
      *Core Idea:* Actual consent isn't always possible/necessary; acting according to what the agent *would* consent to if rational and informed can be a distinct source of justification.  
      *Answers Pulling Towards It:* 5A (Primary justification is hypothetical consent), 8B (Retrospective endorsement functions like hypothetical consent).  
      *Load-Bearing Questions:* **5A, 8B.** If you rely heavily on "what they would want" as a standalone justification, distinct from necessity or presumed consent, you lean hypothetical-consent.  
      *Note:* Answering 5B suggests you see necessity/presumed consent as different; answering 5C contradicts.

  6.  **Deflationary View (Consent Does Less Moral Work):**  
      *Core Idea:* "Consent" isn't a single, powerful moral transformer. Other factors (autonomy, harm, exploitation, necessity) do the real justificatory work. Consent talk is often shorthand or secondary.  
      *Answers Pulling Towards It:* 2C (Consent exists but act is wrong due to exploitation), 4B/C (Consent question is secondary to rules/assault), 5B (Justified by necessity, not consent), 6B (Consent valid but insufficient; harm/autonomy violation key), 9C (Consent valid but transaction wrong). Also, answers emphasizing other factors over consent in many scenarios.  
      *Load-Bearing Questions:* **4B/C, 5B, 6B, 9C.** If you frequently find yourself saying "consent is valid *but*..." or "the real issue is..." (exploitation, harm, necessity, rules), or see consent as irrelevant in some cases (4C, 5B), you lean deflationary.

  **Handling Mixed Profiles & Noting Odd Combinations:**

  *   **Mixed Profiles:** Identify where the majority of your answers land, especially on the **Load-Bearing Questions** for each theory. E.g., if you answered 2B, 6A, and 9A, you strongly lean Moralized, even if you have some Performative answers elsewhere. If you answered 5A and 8B, Hypothetical-Consent is a key part of your view. If you have many answers like 2C, 4C, 5B, 6B, 9C, you lean Deflationary.
  *   **Logically Possible but Likely Unexplored/Incoherent:** Consistently choosing **1A** (Deception about surgeon irrelevant) + **2B** (Landlord coercion invalidates consent) is odd. 1A suggests a very narrow view of what information is material to consent, while 2B suggests a very broad view of how background conditions invalidate consent. It's unclear what coherent theory this maps onto. Similarly, **6C** (Valid consent to maiming) is fundamentally incompatible with **2B** or **9A** (Consent impossible due to exploitation/immorality).
  *   **Indistinguishable Pair:** As noted above, **Performative (Speech-Act) and Normative-Power** theories will be very difficult to separate with these questions. They both emphasize the external act/communication and its normative effect. A tenth question probing silent acquiescence vs. explicit communication might help.
  *   **Another Hard Distinction:** **Attitudinal** vs. **Performative/Normative-Power** is clearest on Question 3 (Intoxication), 7 (Misunderstanding), and 8 (Retrospective Endorsement). Attitudinal leans towards A/B on 3, A/B on 7, and B on 8. Performative/Power leans towards B on 3, A on 7, and A on 8.

  --- 
  This quiz and key provide a framework for readers to explore their implicit assumptions about consent. The scoring highlights how specific cases reveal deeper theoretical commitments and acknowledges the complexities and overlaps between different philosophical perspectives.
