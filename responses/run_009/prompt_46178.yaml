  First, I need to map the correspondence table thoroughly. The core mappings are straightforward: ruler as father, ministers as older sons, subjects as children. But the target side (state) has elements without family equivalents - like the Mandate of Heaven (which functions more like a cosmic landlord clause) or rival states (who'd be the creepy neighbors trying to steal your ancestral land). The source side (family) has its own unique features too, like the mother's role that never cleanly maps to any state institution.

