  The abusive father problem is thorny. Mencius does allow tyrannicide, but practically? Good luck enforcing that without civil war. Meanwhile in a family, uncles might actually intervene. So the analogy fails at providing equivalent safeguards.

  Ah, and the nepotism paradox! Confucius' "upright son" case shows family loyalty trumping public justice. Yet the same tradition bans nepotism in office. The tension reveals that the analogy can't generate its own public/private distinction - it has to borrow from elsewhere (probably legalist or modern bureaucratic norms).

  On the user's friend's argument: no, "hierarchy is natural" doesn't survive. The family's hierarchy is temporary, intimate, and welfare-oriented; the state's is permanent, impersonal, and power-oriented. Conflating them is category error. 

  For modern role-ethics folks? They can keep the family as model for relational selves, but must decouple it from politics unless they want authoritarian baggage. The analogy only works as a one-way norm for rulers ("be fatherly"), not as description of subjects' duties.

