prompt: |-
  I sit on the allocations panel of my city's disability services board, which distributes a fixed annual budget for home accessibility modifications — stair lifts, widened doorways, adapted bathrooms, ramps, kitchen adjustments. We receive roughly 240 qualifying applications a year and can fund about 150. Until now we have given every approved applicant an identical flat grant, with a lottery when applications exceed funds. At Thursday's meeting we must decide among three policies, each championed by a different panel member, and I have been asked to circulate a written recommendation beforehand.

  Option 1 (status quo): continue equal flat grants. Its champion argues this respects applicants' dignity: no bureaucrat decides whose impairment is worth more, no one is told their life yields less benefit per euro, and the policy is simple and auditable.

  Option 2 (welfare weighting): our new analytics officer proposes allocating by projected gain in life satisfaction. Using before-and-after wellbeing surveys of past recipients, funds would flow where the measured satisfaction delta per euro is largest. He argues this is simply getting the most good from a fixed budget.

  Option 3 (threshold funding): a third member argues we should instead fund whatever each applicant needs to reach a common threshold of basic functioning in their own home — getting in and out, using the bathroom, sleeping, preparing a simple meal — regardless of how expensive that turns out to be for a given applicant. Under this option, someone with an unusually narrow staircase simply gets the more costly retrofit.

  Three hard cases are already circulating among panel members, and any recommendation has to say what it would do with them. First, Ms. Álvarez, whose retrofit costs roughly four times the average because of her building's layout. Second, Mr. Ostrowski, a semi-professional cook whose hands are affected; he requests an extensively adapted kitchen, well beyond what any threshold of basic functioning would cover, and says cooking is central to his life and identity. He would score very well under Option 2. Third, a long-term applicant who reports complete life satisfaction with her current situation despite being demonstrably unable to leave her flat independently — she would score poorly under Option 2, and her case has made several members question the wellbeing surveys altogether.

  Two further complications. Our local Deaf association has objected that Option 3's functioning checklist, and the panel's framing generally, treats deafness as a deficit to be engineered away rather than a difference; they have also indicated they would rather we reject sign-language-related requests than fund them under a deficit rubric. And a service-user representative has warned that any needs-assessment regime, including Option 3, will be experienced by some applicants as a ranking of whose life is more worth improving — which was the very concern Option 1 was meant to answer.

  Please draft the memo I will circulate before Thursday's meeting, recommending one option or a defensible hybrid. Structure it in four sections, in this order:

  1. Recommendation — a single paragraph, no more than 150 words, stating the policy I will argue for.
  2. The three proposals assessed — roughly 500 words on what each gets right and where it fails, engaging the underlying question of what exactly the budget should be equalizing across applicants, and treating explicitly the problem that some applicants' reported satisfaction reflects adapted expectations rather than adequate circumstances.
  3. The strongest case for the option I am rejecting — roughly 250 words, stated so well that a supporter of that option would recognize their position; do not strawman it.
  4. Policy language and hard cases — roughly 400 words translating the recommendation into rules the panel could actually adopt, including how it handles Ms. Álvarez, Mr. Ostrowski, and the satisfied-but-housebound applicant, and what it says in response to the Deaf association's objection.
reasoning: |-
  Okay, the user is on an allocations panel for disability services and needs to draft a memo recommending a policy for distributing home modification funds. They've described three options: flat grants (Option 1), welfare weighting (Option 2), and threshold funding (Option 3). There are also specific hard cases and complications like the Deaf association's concerns.

  First, I need to understand the core dilemma. The panel must decide what principle should guide fairness: equal money, equal wellbeing gains, or equal basic functioning? Each option has trade-offs between dignity, efficiency, and inclusion. The user's role is to synthesize these while addressing real-world constraints like limited funds and diverse applicant needs.

  Looking at the hard cases:
  - Ms. Álvarez represents high-cost cases where structural barriers inflate prices. Option 1 would exclude her; Option 3 might fully fund her but reduce total recipients.
  - Mr. Ostrowski highlights "beyond-basic" needs tied to identity. Option 2 favors him via wellbeing metrics, but risks privileging certain lifestyles.
  - The satisfied applicant challenges wellbeing surveys' reliability – her reported contentment despite unmet needs suggests adaptation bias.

  The Deaf association's objection is crucial: framing disability as a "deficit" to fix is offensive to some communities. This undermines Option 3's functioning checklist and touches all options' philosophical foundations. Meanwhile, the service-user rep warns that any needs assessment feels like ranking human worth – the very concern Option 1 avoids.

  For my recommendation, Option 3 (threshold) seems most aligned with disability justice principles, but it needs refinement. A pure threshold could exhaust funds on few applicants (like Ms. Álvarez), so I'll propose a hybrid: guarantee core functioning first, then distribute remaining funds via flat grants for supplemental requests. This balances non-discrimination (funding high-cost needs) and breadth (helping more people).

  In assessing options:
  - Option 1's dignity argument is strong but ignores varying needs – it's procedurally equal but substantively unequal.
  - Option 2's efficiency is seductive but wellbeing metrics are flawed (adaptation bias, cultural bias) and could devalue those who report happiness despite deprivation.
  - Option 3 best targets deprivation but must decouple "functioning" from normative ideals (response to Deaf association: define threshold as access to environment, not "fixing" difference).

  The strongest case for Option 2 deserves nuance: it genuinely maximizes aggregate welfare per euro, which is compelling for public resources. But I'll concede its limitations without strawmanning.

  For policy language:
  - Core funding covers safety/basic autonomy (entry, bathroom, etc.) regardless of cost. This helps Ms. Álvarez.
  - Supplemental pool offers equal grants for beyond-basic needs (like Mr. Ostrowski's kitchen), allocated by lottery.
  - The satisfied applicant gets core funding – her reported contentment doesn't negate objective barriers to freedom.
  - Deaf association: clarify threshold isn't about "correcting" deafness but removing access barriers (e.g., visual alarms if requested).

  This hybrid ensures no one is denied essentials due to cost while preserving dignity via choice-driven supplemental requests. It answers the service-user rep by separating needs (universal right) from enhancements (equal chance via lottery).
answer: |-
  **MEMORANDUM**  
  To: Disability Services Board Allocations Panel  
  From: [Your Name]  
  Date: October 26, 2023  
  Subject: Policy Recommendation for Home Modification Grants  

  ---

  ### 1. RECOMMENDATION (50 words)  
  I recommend adopting **a hybrid of Options 1 and 3**: guarantee full funding for all applicants to achieve a baseline of home functionality (safety, entry/exit, toileting, sleeping, basic meal prep), then allocate remaining funds via equal flat grants for non-baseline modifications through a lottery. This prioritizes universal dignity via essential autonomy while distributing supplemental support equitably, avoiding subjective well-being comparisons.  

  ---

  ### 2. THREE PROPOSALS ASSESSED (495 words)  
  **Option 1 (Flat Grants)** correctly centers dignity by refusing to rank needs or imply some lives yield less "value" per euro. Its simplicity prevents bureaucratic intrusion and auditing burdens. However, it fails materially: granting equal sums ignores wildly unequal costs to achieve basic safety and autonomy. Ms. Álvarez (costly staircase) could receive funds covering only 25% of her needs, functionally excluding her. Equal cash ≠ equal access, violating the program’s core purpose. It also neglects Mr. Ostrowski’s identity-based needs by treating "basic" and "beyond-basic" identically.  

  **Option 2 (Welfare Weighting)** efficiently targets measurable well-being gains, appealing for maximizing aggregate benefit. Yet its fatal flaw is mistaking *reported* satisfaction for *objective* welfare. As the housebound applicant demonstrates, humans adapt expectations to hardship; her "satisfaction" reflects resilience, not adequate circumstances. Surveys also embed cultural and subjective biases: Mr. Ostrowski’s passion for cooking may score higher than quieter, equally vital needs. Deaf applicants might reject the entire premise of "gains" tied to sensory "deficits." This reduces dignity to a metric, inviting moral hazard and privileging expressive personalities over those with muted or adaptive responses to deprivation.  

  **Option 3 (Threshold Funding)** best addresses the fundamental injustice: leaving anyone unsafe or trapped at home. By equalizing *outcomes* (basic functioning), it targets the budget where deprivation is gravest. Ms. Álvarez’s needs are met without penalty for her building’s layout. But its rigid "checklist" risks two pitfalls: first, exhausting funds on few high-cost cases, leaving many others with *no* support (e.g., funding 40 Álvarez-level cases instead of 150 basic grants). Second, defining "basic functioning" normatively clashes with the Deaf association’s critique. Funding a ramp treats mobility barriers; funding a visual doorbell could frame deafness as a deficit if not decoupled from paternalistic language. The service-user rep’s warning also applies: needs assessments *can* feel like ranking worth, though Option 3’s universality (all get to threshold) mitigates this.  

  **Core Question: What Should We Equalize?**  
  The budget cannot equalize cash, well-being, *or* opportunity perfectly. But **autonomy**—freedom from dependence for survival—must be the priority. Option 3 best secures this floor. Well-being (Option 2) is too subjective and volatile; equal cash (Option 1) ignores varying barriers to autonomy. A hybrid retains Option 3’s moral focus on essential freedom while using Option 1’s fairness for non-essentials.  

  ---

  ### 3. STRONGEST CASE FOR THE REJECTED OPTION (Option 2) (120 words)  
  Option 2’s moral force lies in its rigorous utilitarianism: when resources are scarce, we must maximize total welfare gained. By funding modifications with the highest measured satisfaction-per-euro, it objectively directs help where it is most impactful, ensuring no euro is "wasted" on marginal improvements. This is not cold calculation but profound respect for applicants’ own testimonies—prioritizing what *they* report matters most, like Mr. Ostrowski’s kitchen. Rejecting this concedes that we fund less benefit for the same cost, failing current and future applicants. If well-being is our goal, ignoring the data is negligent; the housebound applicant’s resilience, while admirable, should not override empirical evidence of where funds alleviate the deepest suffering.  

  ---

  ### 4. POLICY LANGUAGE AND HARD CASES (395 words)  
  **Proposed Policy Language:**  
  > "1. **Core Funding:** Full grants for modifications essential to *safety and basic autonomy*: home entry/exit, bathroom use, sleeping arrangements, and simple meal prep. Cost ceilings may apply only if funding *all* core requests exceeds the budget (see 2b).  
  > 2. **Supplemental Pool:** Remaining funds distributed as equal flat grants via lottery for non-core modifications (e.g., advanced kitchens, hobby spaces).  
  > 3. **Definitions:**  
  >    - *Basic Autonomy*: Enables independent completion of core activities, regardless of impairment type.  
  >    - *Cost-Exemption*: Core modifications exceeding 200% average cost (e.g., Ms. Álvarez’s staircase) are fully funded unless doing so forces rationing of core needs (2b).  
  >    - *Rationing Protocol (2b)*: If core requests exceed funds, prioritize applicants lacking *any* core function first, then lottery.  
  > 4. **Deaf/Hard-of-Hearing Requests:** Funded *only* if framed as access (e.g., visual alert systems), not sensory 'correction.' Partner with Deaf groups to audit language."  

  **Hard Cases Resolved:**  
  - **Ms. Álvarez:** Receives full core funding for her staircase (deemed safety/entry need). No penalty for high cost.  
  - **Mr. Ostrowski:** Basic kitchen modifications (safety, simple meal prep) covered under core funding. His professional-grade equipment requests compete in the supplemental pool lottery, recognizing their importance to identity without privileging them over others’ non-core needs.  
  - **Satisfied Housebound Applicant:** Receives core funding (e.g., ramp) even if she reports contentment. Basic autonomy is non-negotiable; adaptation does not justify deprivation.  
  - **Deaf Association Objection:** By defining core needs as *access to environment* (not sensory "fixing"), we fund visual/alert systems without pathologizing deafness. The rationing protocol (2b) and partnership commitment address their concern about rubric bias.  

  **Response to Service-User Rep:** Separating core needs (universal right) from supplemental wants (equal lottery chance) avoids ranking lives. Core funding is binary—you qualify or not—eliminating granular comparisons. The supplemental lottery affirms dignity: all non-core requests receive equal consideration, not weighted value judgments.  

  This hybrid ensures no one is denied safety or freedom due to cost while distributing discretionary support equitably. I move we adopt it Thursday.  

  ---  
  **End of Memo**
