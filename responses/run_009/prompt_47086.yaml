  so, background: i'm a backend engineer, zero formal philosophy training, my entire philosophy education is 2am wikipedia rabbit holes. last week it was the causal exclusion argument (jaegwon kim i think?) and it hit me that it reads EXACTLY like a bug ticket. the way i understand it: the physical world is causally closed, every physical event already has a sufficient physical cause. so if my mental state of wanting coffee causes my arm to move, that arm movement already has a complete physical cause (neurons etc), which means either the mental cause just IS the physical cause, or every single action is overdetermined by two independent sufficient causes (which seems insane when you're overdetermining literally everything, all the time), or the mental state does nothing at all and is just along for the ride. and you can't fix it by saying the mental state causes its physical implementation either, because realization doesn't seem to be a causal relation at all. i think that's roughly right? anyway.

  write me a fake issue-tracker ticket from a company whose whole codebase implements a person. there's a "physical layer" (the actual implementation, everything downstream of it runs fine) and a "mental layer" (the high-level states, which the docs swear are real and doing important work). a skeptical senior engineer files the ticket: "mental layer appears causally idle — deprioritize?"

