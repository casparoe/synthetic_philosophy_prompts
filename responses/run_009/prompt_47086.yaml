answer: |-
  **Issue #MIND-42: Mental Layer Appears Causally Idle - Deprioritize?**  
  **Status:** Closed (Resolution: Works as Intended)  
  **Priority:** P3  
  **Component:** Causality Module / Mental-Physical Interface  

  ### Description  
  The `MentalLayer` (high-level states: `Intentions`, `Beliefs`, `Desires`) is documented as initiating downstream actions in the `PhysicalLayer` (e.g., `ArmMovementService`). However, per causal closure of the `PhysicalLayer` (Core Principle CP-7), all physical events (e.g., `NEURON_FIRE_ARM_RAISE`) already possess sufficient physical causes (`NeuralCascadeService`). This implies one of three scenarios:  

  1.  **Token Identity:** `MentalLayer` states are redundant labels for `PhysicalLayer` states (violating Non-Reductive Docs v3.1).  
  2.  **Systematic Overdetermination:** Every physical event has *two* independent sufficient causes (`MentalLayer` + `PhysicalLayer`). This violates DRY-CAUSAL-1 and would bloat event logs (see attached trace: `LOG_ARM_RAISE_#1938`).  
  3.  **Causal Idleness:** `MentalLayer` states are epiphenomenal—observed but non-functional.  

  Proposal: Deprioritize `MentalLayer` resource allocation pending causality audit.  

  ### Steps to Reproduce  
  1.  Trigger a high-level `MentalState` (e.g., `User.desire("coffee")`).  
  2.  Execute `CausalTracer.downstream(PhysicalLayer, "ARM_RAISE")`.  
  3.  Observe trace: `SensoryInputService` → `NeuralCascadeService` → `MotorOutputService` → `ArmMovementService`.  
  4.  Note: `MentalLayer` processes (`DesireProcessor`, `IntentionBuilder`) **do not appear** in the causal trace.  

  ### Expected Behavior  
  `MentalState` (e.g., `coffee_desire`) should be causally necessary in the `ArmMovementService` invocation chain.  

  ### Actual Behavior  
  `ArmMovementService` executes solely via `PhysicalLayer` causality. `MentalState` is logged (`MentalObservationLogger`) but absent from causal pathways.  

  ---

  ### Comment Thread  

  **Dev_A (Non-Reductive Team):**  
  *This is by design! `MentalLayer` is *realized by* `PhysicalLayer` but isn’t *identical* to it. It’s a distinct abstraction layer with its own causal powers (see Docs: "Emergent Causation"). Example: `coffee_desire` *is* the neural cascade, but described at a higher level of functionality.*  

  **Sr_Engineer_B (Skeptical):**  
  @Dev_A: If `coffee_desire` *is* the neural cascade (token identity), why maintain two layers? If it’s *not* identical (non-reductive), how does it add causal power? If it causes the *neural cascade itself*, we violate CP-7 (physical closure). If it causes the *arm movement directly*, we get overdetermination. Attached: simulation showing 12,000 simultaneous arm raises with `MentalLayer` disabled. No regression.  

  **Dev_A:**  
  Realization isn’t causation! The `MentalLayer` supervenes on the `PhysicalLayer`... but the causal work is done at the base. However, it’s *essential for feature completeness* (e.g., `RationalExplanationService` requires `Belief`/`Desire` states).  

  **Sr_Engineer_B:**  
  So its role is descriptive, not causal? That’s epiphenomenalism. Also, `RationalExplanationService` is a reporting tool—doesn’t affect runtime causality.  

  ---

  ### Proposed Fix  
  **Type-Identity Patch (PR #REDUCE_MIND):**  
  - Merge `MentalLayer` states into `PhysicalLayer` as metadata (e.g., `NeuralCascadeService.label("coffee_desire")`).  
  - Eliminates overdetermination, preserves logging.  

  **Rejected by Arch_Committee:**  
  - Breaks backwards compatibility with `ConsciousnessModule` and `FreeWillInterface`.  
  - "Type reduction invalidates user-facing APIs" (Ref: UX-POLICY-9 "Illusion of Unified Self").  

  ---

  ### Resolution  
  **Management (CTO_Office):**  
  Closing as **Works as Intended**. Per design spec: "`MentalLayer` provides interpretability and abstracts complex physical processes." Not required for core functionality.  

  **Linked Issues:**  
  - QUALIA-7 ("Undocumented subjective properties in `MentalState` objects") remains OPEN.  
  - MIND-43 ("Remove `MentalLayer` to optimize resources?") marked WONTFIX.
