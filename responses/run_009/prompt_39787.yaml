prompt: |-
  I'm a software engineer, ten years in, I spend my days in git and code review, and my biology education ended somewhere around age 16. Lately I keep reading that biologists can't agree on what a "species" is, and every explanation I find either goes over my head or smells like the thing I actually know well: version control. So let's test that.

  Take the main views on what counts as a species — I gather there's the one about interbreeding ("if they can breed and produce fertile offspring, same species"), the one about shared physical form, the one about tracing a group back to a common branch point, and whatever else counts as a serious contender (I've heard there are twenty-odd of these "concepts" in circulation, which is part of why I'm confused). Translate each of them into the vocabulary I actually use: repositories, forks, merge commits, branch divergence, cherry-picks, tags, diffs, "is this fork dead or just dormant". From my chair, "can interbreed" looks a lot like "can still merge cleanly", and a species looks like a fork that stopped taking pulls from upstream a long time ago.

  For each concept, tell me three things: what translates cleanly, what you had to bend to make it fit, and what has no expression at all in my vocabulary. Then the residue report, which is the part I care about most: does what's left over point at something real in biology that version control simply can't say (off the top of my head: there's no canonical main branch, no repo owner, and nobody tags releases), or does it suggest the biologists' disagreement is less substantive than it looks — more like arguing over whether to organize your repo by tags or by branches than like a fight about facts? I want your honest read on which it is, not both-sidesing.

  One more thing: if my framing is quietly loading in assumptions — like that lineages are discrete things you can point at the way you point at a repo, or that there's some default trunk everything else is defined relative to — flag that plainly instead of working around it. Same if the whole translation project is doomed for a reason I can't see from here. And if a piece of this is genuinely contested or you're not sure, say that rather than papering over it.

  Hard limit: 500 words total. I will stop reading at 501.
reasoning: |-
  Okay, let me tackle this fascinating request from a software engineer wanting to map biology's species concepts to version control systems. 

  First, I need to identify the core species concepts they mentioned: Biological (interbreeding), Morphological (physical form), and Phylogenetic (common ancestry). The user clearly wants a strict translation exercise with three parts per concept: clean mappings, forced fits, and unmappable elements.

  Hmm... the Biological Species Concept maps neatly to "clean merges with fertile offspring," but I notice trouble spots - horizontal gene transfer is like a rogue pull request that breaks the isolation metaphor. Morphological is basically diffing physical traits, but those traits might not reflect actual lineage, like superficial code similarities. Phylogenetic matches branch ancestry perfectly... until hybridization happens, which is like a merge commit that shouldn't work but does.

  The residue is critical here. Three big gaps stand out: no central repository (biology's decentralized), no authoritative committer (it's all mutation and selection), and no way to tag species boundaries definitively. This isn't just repo organization disagreement - it's fundamental to how evolution operates without version control's artificial constraints.

  I should flag their hidden assumptions too: the idea of discrete lineages is problematic when biology has continuous variation, and there's no default "trunk" branch in nature. Also worth noting that 20+ concepts exist because evolution solves different "problems" than code does.

  For the conclusion: the unmappable parts reveal real biological complexity, not just semantic debates. The lack of centralized control and clean boundaries makes species fundamentally different from code repositories. I'll emphasize that while the analogy holds in places, the residue shows why biologists genuinely disagree - it's about nature's messiness, not taxonomy preferences.
answer: |-
  Here's your translation, residue report, and flagged assumptions:

  **Assumptions Flagged Upfront:**  
  - Lineages aren't discrete repos; they're blurry commit graphs with constant micro-commits (mutations).  
  - No `main` branch exists; every branch is someone's "trunk".  
  - "Merges" (hybridization) happen unpredictably between distant forks.  
  - No repo owner; commits (mutations) are random PRs from chaos.  

  **Biological Species Concept (Interbreeding)**  
  - *Clean:* "Clean merges producing runnable offspring (fertile)" = `git merge --no-ff` with passing tests.  
  - *Bent:* Forced to ignore ring species (A merges with B, B with C, but A and C conflict). Ignores asexual "repos" (bacteria).  
  - *Unmappable:* Hybrid zones where merges *sometimes* work (flaky tests?). No CI server for fertility.  

  **Morphological Species Concept (Physical Form)**  
  - *Clean:* `git diff branchA..branchB` on phenotype (code structure/output). Ignores commit history.  
  - *Bent:* Polymorphism (same branch, different "UI") looks like forks. Cryptic species (identical UI, different backend) invisible.  
  - *Unmappable:* Developmental plasticity (environment changes output without commits). No `git blame` for why a trait exists.  

  **Phylogenetic Species Concept (Shared Ancestry)**  
  - *Clean:* Smallest monophyletic group = a branch and *all* its children. `git branch --contains <common-commit>`.  
  - *Bent:* Requires complete, resolved tree (real phylogenies are messy DAGs). Where to tag "species"?  
  - *Unmappable:* Horizontal gene transfer (cherry-picked commits from unrelated repos). No `git tag` for speciation events.  

  **Residue Report (The Real Stuff):**  
  1. **No Central Truth:** Biology lacks a canonical `origin/main`. Every lineage is its own repo.  
  2. **Boundaries are Emergent:** Speciation isn't a `git tag`; it's gradual divergence until merges consistently fail (if ever).  
  3. **Environment is the CI Server:** "Tests" (natural selection) run live 24/7 with changing requirements. No static test suite.  
  4. **Chaotic Collaboration:** Billions of unsupervised repos constantly force-push to each other (HGT, symbiosis).  

  **Honest Read:** The residue points to **real, substantive disagreement**. This isn't tags-vs-branches. It's because:  
  - Evolution lacks intentionality (no PR author).  
  - Reproduction isn't merging (it's messy rebases + random forks).  
  - "Species" is a label for human convenience on continuous, multidimensional divergence.  

  **Translation Doom?** Useful for *processes* (divergence, selection ≈ CI fails). Doomed for *definitions*. Biology is a distributed, adversarial, multi-repo system with no `git` binary.
