answer: |-
  ### The two norms  
  **Knowledge Norm (KN)**: Assert only what you know (Williamson, DeRose). KN is motivated by cases where asserting a true belief *without knowledge* seems improper. For instance, asserting "Your ticket lost" in a fair lottery (based on odds alone) violates KN: though likely true, you lack knowledge. KN also explains Moorean absurdity ("It's raining but I don't know it")—asserting *p* while denying knowledge of *p* is paradoxical because assertion requires knowledge.  

  **Truth Norm (TN)**: Assert only what is true (Weiner). TN’s core motivation is parsimony: it avoids internalist constraints, focusing solely on truth. It handles cases where *knowingly* asserting falsehoods is wrong (e.g., lying). However, TN struggles with "lucky guesses": asserting a true conjecture without evidence (e.g., randomly guessing a proven theorem’s truth) satisfies TN but intuitively feels improper, as it lacks justification.  

  ---  

  ### The mathematical case  
  Pure mathematics presents a challenge. Mathematicians routinely assert theorems like the **Four-Color Theorem** (4CT), despite no individual verifying its computer-assisted proof (~1,200 cases). They rely on peer review, testimony, and communal vetting. Crucially:  
  - **KN struggles**: Few mathematicians *know* 4CT in the traditional sense—they lack firsthand proof access. KN might deem their assertions improper, yet they are paradigmatically acceptable.  
  - **TN is too weak**: TN permits asserting 4CT (as it’s true), but also permits asserting *unproven conjectures* that happen to be true (e.g., a mathematician luckily guessing a solution). Yet such assertions are improper pre-proof.  
  This suggests mathematical assertion relies on **communal warrant**—norms tied to the community’s entitlement to rely on shared evidence, not individual knowledge or mere truth.  

  ---  

  ### Which norm fares better  
  **Truth Norm (TN)** fails decisively. It permits asserting conjectures pre-proof if true by luck, violating mathematical practice where assertions require *proof-backed warrant*. TN cannot distinguish between proper assertions (vetted theorems) and improper ones (unverified truths). Its focus on truth alone ignores the justificatory structure essential to mathematics.  

  **Knowledge Norm (KN)** has resources to absorb the case, but requires refinement:  
  1. **Testimony as knowledge-transmission**: If knowledge can transfer through testimony (e.g., Lackey), a mathematician *knows* 4CT via trust in the community’s verification.  
  2. **Group knowledge**: KN could expand to include "collective knowledge" (Bird)—the community *knows* 4CT through distributed checking, enabling individual assertions.  
  **Objection**: The 4CT’s proof is non-surveyable; no human "knows" it inferentially. *Reply*: If the computer proof is reliable and vetted, its output can ground testimonial knowledge. Mathematicians know *that* the proof is sound (via meta-justification of methods), even if not *how* it works.  

  KN’s advantage is its ability to exclude lucky guesses: asserting conjectures lacks testimonial/communal warrant, thus violating KN. While TN stumbles on justification, KN can incorporate communal norms via testimony, aligning with mathematical practice.  

  ---  

  ### My verdict  
  **KN prevails**, but only when augmented by a social epistemology of testimony and group justification**. TN’s inability to exclude unjustified true assertions renders it inadequate for mathematics. KN’s demand for individual knowledge *can* be met in mathematical practice via structured testimony: the community’s verification process generates knowledge, which individuals inherit through rational trust in peer review. This preserves KN’s core intuition—assertions require robust epistemic warrant—while accommodating division of labor. The 4CT case shows that "knowledge" here is not solitary but socially embedded; the norm remains individual ("assert only what *you* know"), but knowledge itself is often communally sourced. Thus, a collectivized KN best captures mathematical assertion.  

