  Please structure your response as follows: first, 'The two norms' (~200 words), setting out each norm's motivations and its best-known supporting cases; second, 'The mathematical case' (~200 words), developing the problem above; third, 'Which norm fares better' (~250 words), evaluating whether either norm can absorb the case, for instance via transmission of warrant through testimony; finally, 'My verdict' (~100 words), where you commit to a definite conclusion rather than a compromise for its own sake.
