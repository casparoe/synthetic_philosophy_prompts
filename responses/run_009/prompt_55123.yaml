prompt: |-
  I chair a philosophy department of about thirty faculty, and every December and May our executive committee spends a long evening deciding which of our multi-year commitments to keep, reshape, or wind down: a curriculum reform now three years in that most instructors quietly ignore, a half-built digital archive of our colloquium recordings, a mentoring program for first-generation graduate students that hasn't moved the numbers, and — my own favorite — a spring conference we have run for two decades whose attendance has halved. Between six and ten such items per meeting, ninety minutes total, real stakes for students and colleagues, and several decisions that are politically radioactive. Our standing instinct is the one drilled into every graduate student: sunk costs are irrelevant, decide as if you were starting fresh today. But I have come to suspect the textbook injunction is blunter than the decision theory behind it. Sometimes the years and money already spent seem to matter — not as costs, but as evidence about the project's quality, or as signals to collaborators and funders who need to know we finish what we start, or as part of what makes the project the project at all: a reform abandoned at year three may be worse than no reform, for reasons having to do with precedent and with our identity as planners, not with marginal payoffs.

  What I want from you is a procedure the committee can actually run: a one-page ordered list of questions, answerable by people with no philosophical training in roughly ten minutes per item, with a clear statement of what counts as a sufficient answer to each question, where the procedure terminates in a recommendation to stop, and — crucially — where it hands the decision back to human judgment because the remaining question is one of values or politics rather than facts. In constructing it, please take the philosophical complications seriously rather than waving at them: (i) when past investment is genuinely evidential, so that the standard "would we start this today, knowing what we know, at the remaining cost?" test misleads; (ii) when sunk costs generate reasons through commitment — precedent, morale, the credibility of our future promises to students and partners, the way a partially executed plan can acquire a rational authority of its own; (iii) how to keep the fallacy proper out, i.e., unrecoverable costs entering the weighing as though they were future ones, including its disguised forms ("we can't waste what we've already put in," loyalty to colleagues who did the work); and (iv) where loss aversion, waste aversion, and status quo bias will predictably corrupt each step, so the procedure can build in guards against them. And be honest about which of your steps are judgment calls dressed up as procedure.

  Then run the procedure on three of our actual cases: the curriculum reform, a fifth-year doctoral student whose committee is divided over whether to support one more year versus advising a terminal master's, and the spring conference. Run it straight even where the answer will be unwelcome — I suspect that will be the conference, and I would rather see the procedure bite than flatter me. Close with a short statement of what the procedure cannot do: which decision types it should never be applied to, and where continuing versus quitting is simply a question of what kind of department we intend to be, which no checklist is entitled to answer for us.
reasoning: |-
  Okay, let me tackle this complex request from a philosophy department chair. The user needs a practical decision-making procedure for evaluating ongoing commitments, with specific philosophical considerations and real-world application examples.

  First, I need to understand the core tension: they're caught between standard sunk cost fallacy avoidance and recognizing legitimate reasons why past investments might matter (evidential value, commitments, identity). The challenge is creating a procedure that navigates this while being usable by non-philosophers in time-constrained meetings.

  Key requirements from the query:
  - One-page checklist format
  - 10 minutes per item
  - Clear termination points for decisions
  - Explicit handoff to human judgment for value/political questions
  - Must address four philosophical complications seriously
  - Needs built-in guards against cognitive biases
  - Must be transparent about "judgment call" steps
  - Requires demonstration on three cases (curriculum reform, PhD candidate, conference)

  I'll structure the procedure to methodically separate factual analysis from value judgments. The sequence should:
  1. Establish basic viability (is this even functioning?)
  2. Assess whether past investment provides legitimate evidence
  3. Evaluate commitment-based reasons to continue
  4. Calculate marginal costs/benefits from today forward
  5. Make explicit where political/value judgments are required

  For bias guards, I'll incorporate:
  - Pre-mortems for loss aversion
  - "Zero-baseline" comparisons for status quo bias
  - Reframing exercises for waste aversion
  - Mandatory devil's advocate steps

  The three test cases are particularly telling:
  - The curriculum reform shows institutional identity questions
  - The PhD candidate illustrates ethical commitments to individuals
  - The conference demonstrates sunk costs masquerading as tradition

  In the demonstration, I'll need to be ruthlessly objective, especially with the chair's favorite conference. The terminal master's decision will highlight how procedures handle cases with incomplete information.

  The closing limitations section must emphasize that no procedure can resolve:
  - Core identity questions ("what kind of department are we?")
  - Pure political trade-offs
  - Decisions requiring moral imagination
  - Existential stakes beyond resource allocation

  Throughout, I'll maintain academic rigor while ensuring practical usability - the exact balance this philosophy department chair is seeking.
answer: |-
  Here is a procedure designed for your committee, addressing your core requirements and philosophical complexities. It follows a sequential "Funnel" approach, escalating in complexity only if earlier steps don’t yield a clear decision. Each step must be answered *factually* before proceeding. **Time:** Strict 10-minute timer per item. Use a facilitator to enforce time and document answers.

  ---

  ### **Project Continuation Decision Protocol (PCDP)**

  **Objective:** Determine whether to **Stop**, **Continue/Reframe**, or **Hand to Judgment** an ongoing initiative, avoiding sunk cost fallacy while respecting legitimate evidential/commitment roles of past investment.

  #### **STEP 1: VIABILITY SCREEN (2 min)**  
  *Question: "Is this project functionally dead or irreparably broken?"*  
  - **Sufficient Answer:** Objective evidence of total failure (e.g., zero participation for 2+ cycles, core functionality impossible, legal/ethical violation).  
  - **Outcome:**  
    - **YES** → **Recommend STOP**.  
    - **NO** or **UNCLEAR** → Proceed to Step 2.  
  *Guards:* Prevents status quo bias by forcing "dead project" acknowledgment.  

  #### **STEP 2: EVIDENTIAL VALUE OF PAST INVESTMENT (3 min)**  
  *Question: "Does past effort (time/money) provide unique evidence about FUTURE success that we couldn’t have known at the start?"*  
  - **Sufficient Answer:** Concrete data/events demonstrating *new* insights (e.g., pilot revealed unforeseen scalability issues, early adopters proved a latent demand). *Exclude* moral claims ("we owe it to them") or generic sunk costs ("we’ve spent so much").  
  - **Outcome:**  
    - **STRONG EVIDENCE** (e.g., data shows fixable flaws) → Proceed to Step 4.  
    - **WEAK/NO EVIDENCE** → Proceed to Step 3.  
  *Guards:* Isolates *evidential* (not emotional) value of sunk costs. Flags "loyalty/waste" as fallacies.  

  #### **STEP 3: COMMITMENT-BASED OBLIGATIONS (2 min)**  
  *Question: "Does stopping now violate a credible promise, damage critical trust, or undermine a core institutional identity?"*  
  - **Sufficient Answer:** Specific stakeholders harmed (e.g., grant requiring deliverables, students promised support, department reputation for follow-through). *Exclude* vague "precedent" or "morale" without named parties.  
  - **Outcome:**  
    - **YES** (e.g., external funding at risk, explicit student contract) → Proceed to Step 4.  
    - **NO** → **Recommend STOP** (no compelling evidence or obligation).  
  *Guards:* Narrows "commitment" to tangible promises. Counters "identity" inflation.  

  #### **STEP 4: MARGINAL FUTURE VALUE (3 min)**  
  *Question: "Knowing what we now know (Step 2) and honoring obligations (Step 3), would we start this TODAY at the FUTURE cost (time/money) required?"*  
  - **Sufficient Answer:** Projected outcomes (e.g., student impact, research yield) vs. resources needed. *Use best-available data*.  
  - **Outcome:**  
    - **YES** → **Recommend CONTINUE/REFORM** (specify minimal reforms if needed).  
    - **NO** → **Hand to JUDGMENT** (values/politics dominate).  
  *Guards:* Enforces marginal analysis. "Reframe" option avoids waste aversion.  

  #### **HANDOFF TO JUDGMENT CRITERIA**  
  - Decisions reach this point only if:  
    - Obligations exist (Step 3) BUT future value is low (Step 4), *or*  
    - Competing values (e.g., equity vs. efficiency) lack factual resolution.  
  - **Committee must articulate:** "We are choosing X because we prioritize value Y, despite marginal costs."  

  ---

  ### **Application to Cases**  
  *Assumption: All projects pass Step 1 (not "dead").*

  1. **Curriculum Reform (Ignored by Most)**  
     - **Step 2 (Evidence):** Past investment reveals *why* ignored (e.g., unclear guidelines, no incentives). **→ Weak evidence** (problems identifiable earlier).  
     - **Step 3 (Commitment):** No specific promises to students/funders. **→ No obligation.**  
     - **Outcome: STOP.** *Rationale:* No unique evidence or binding commitment; marginal future value low.  

  2. **PhD Student (5th Year, Committee Split)**  
     - **Step 2 (Evidence):** Past investment (student/faculty effort) shows capability gaps or advisor misalignment. **→ Strong evidence** (e.g., data confirms persistent deficits).  
     - **Step 3 (Commitment):** Implicit promise of support if milestones met? **→ Obligation YES** if department policies imply this.  
     - **Step 4 (Marginal Value):** Probability of completion in 1 year vs. cost. If low → **Hand to JUDGMENT**.  
     - **Judgment Call:** Department values (merit vs. compassion, equity for first-gen). *Procedure forces explicit tradeoff.*  

  3. **Spring Conference (20 Years, Halved Attendance)**  
     - **Step 2 (Evidence):** Decline proves unsustainable model (e.g., hybrid events now expected). **→ Strong evidence** (market shift).  
     - **Step 3 (Commitment):** Regular attendees rely on it? External partners? **→ Likely NO** (no named dependents).  
     - **Step 4 (Marginal Value):** Cost to run vs. marginal networking value. If niche value persists → **CONTINUE/REFORM** (e.g., virtual, biennial). Else → **STOP.**  
     - **Unwelcomed Outcome:** Likely **STOP or REFORM radically.** *Past glory ≠ current obligation.*  

  ---

  ### **What This Procedure Cannot Do**  
  1. **Resolve pure value conflicts:** When "continue vs. quit" hinges on *who we are* (e.g., "a department that prizes tradition over efficiency"), no checklist substitutes for debate.  
  2. **Handle existential stakes:** Decisions threatening the department’s survival (e.g., accreditation loss) exceed the protocol’s scope.  
  3. **Override political realities:** If powerful stakeholders veto evidence-based stops, the procedure flags it but cannot force compliance.  
  4. **Replace moral reasoning:** Cases involving justice (e.g., harming vulnerable groups) require ethical deliberation, not cost-benefit.  

  **Final Note:** Steps 3 and 4 are "judgment calls dressed as procedure" — they structure questions but demand rigor in defining "obligation" and "value." The protocol’s power lies in *forcing articulation* of why sunk costs "matter" beyond fallacy, then isolating the residual choice as one of values. It prevents inaction by design but honors politics where they legitimately reign.
