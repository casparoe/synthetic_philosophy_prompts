prompt: |-
  So my friends and I keep getting into this same argument and I want to figure out if there's an actual rule underneath my gut reactions or if I'm just being inconsistent. Background: none of us have studied philosophy, this all started because my wife got dismissed by three different doctors who basically patted her head about her chronic pain before a fourth one actually ran tests and found something real. Ever since then I've been collecting situations where someone's account of things gets discounted and asking myself each time: fair or unfair? Here's my list of verdicts. Doctor dismissing my wife: obviously unfair. My coworker Rajat proposing an idea in a meeting, everyone kind of mumbling, then our boss Dave says basically the same thing ten minutes later and everyone loves it: unfair, and I'm honestly not sure who exactly wronged Rajat, the room? Dave? My buddy who was drunk when the bar fight started, whose version I discount heavily: totally fair, that's just evidence. My cousin whose financial tips I ignore because he's been wrong like five times running: fair. But my coworker who ignores ALL investing talk from "finance bros" as a type: that feels unfair, and I can't say why, since groups have track records too, so what's the difference between discounting one guy for his record and discounting his whole type for the type's record? Then the one I keep going back and forth on: my sister discounts everything her teenage son says about why he missed curfew, and I actually think that's fine, parents do that, kids lie about curfew constantly -- but if discounting by group track record is unfair in the finance bro case, why is it fine here? And one more that bugs me: years back my friend was in a relationship where her boyfriend kept insisting she remembered things wrong, and back then (this was before anyone I knew used the word for it) she literally could not explain to anyone what was wrong, like the complaint wouldn't come out as a sentence anyone understood. Nobody in particular dismissed her, but something went wrong for her anyway, and I don't even know who did it, if anyone.

  So what I want: is there one principle, or maybe a couple, that explains which discounts of a person's word are unfair and which are just ordinary common sense? Tell me what the principle says about my sister case and the finance bro case specifically since I flip on those, and be honest if you think one of my verdicts just has to go. Please don't assume I've read any philosophy books -- if there's a name for any of this, explain it from scratch. Keep the whole answer under 450 words.
reasoning: |-
  Okay, let me unpack this user's dilemma. They're wrestling with consistent principles for when it's fair to discount someone's testimony, based on personal experiences ranging from medical dismissal to parenting choices. The core tension seems to be between individual assessment and group-based judgments.

  First, I notice their examples cluster around two axes: epistemic reliability (like the drunk friend or cousin with bad financial tips) and social power dynamics (like the stolen idea or gaslighting ex). The finance bro vs. parenting cases highlight this tension - both involve group generalizations, but feel different because teenagers are in a temporary developmental phase while "finance bro" stereotypes may mask individual competence.

  The medical dismissal case is particularly revealing. It shows how unfair discounting often happens when the listener has structural authority (doctors) over the speaker (patient) about the speaker's own experience. Whereas Rajat's stolen idea involves horizontal power dynamics among peers plus vertical authority (the boss).

  For the teenage son case, the key distinction might be that parents have both responsibility and contextual knowledge - they're discounting based on specific patterns with this child, not abstract stereotypes. The drunk friend and financially unreliable cousin similarly involve direct personal history.

  The gaslighting example introduces a crucial third dimension: it's not about reliability at all, but about undermining someone's epistemic confidence. That's why it felt "unspeakable" - the harm wasn't in disbelieving a claim, but destabilizing her ability to make claims.

  Potential principles emerging:
  1. Discounting is fair when based on direct evidence of unreliability regarding the specific matter (drunk friend, cousin).
  2. Unfair when it ignores individual competence due to group stereotypes (finance bros) or when power imbalances prevent course-correction (medical case).
  3. Uniquely harmful when it attacks the person's capacity as a knower (gaslighting).

  On the sister case: likely fair because she's applying specific knowledge of her son's behavior patterns, with responsibility for his welfare. Finance bro discounting is unfair because it pre-judges individuals without engaging their actual arguments.

  The user's consistency seems solid except perhaps needing to distinguish between developmental contexts (teens) and professional identities (finance). The gaslighting case isn't about discounting per se but about epistemic violence - which explains why it felt categorically different.
answer: |-
  Based on your cases, the unfair discounts share two core principles:

  1.  **Epistemic Injustice:** Discounting is unfair when it ignores the speaker's *specific competence* on the topic *and* stems from harmful prejudice or power imbalance. The listener fails in their duty to evaluate the speaker's credibility fairly.
  2.  **Responsibility & Context:** Discounting is fair when based on *direct, relevant evidence* of the *specific individual's unreliability* regarding the *specific matter*, especially where the listener has responsibility to judge critically.

  **Applying the Principles:**

  *   **Your Sister & Her Son (Fair):** She discounts based on *direct, repeated evidence* of *this specific teenager* lying *about curfews* (relevant evidence). She has parenting responsibility to judge his claims critically in this context. It's about *his* track record on *this* issue.
  *   **Ignoring "Finance Bros" (Unfair):** Discounting *every individual* based *only* on membership in a broad, socially constructed group ("finance bro") ignores their *specific competence* and individual track record. It's prejudice-based, not evidence-based assessment of the person speaking. (The group's "record" here is often a stereotype, not rigorous data applied to individuals).

  **Your Verdicts:**

  *   **Doctor:** Unfair (Ignored her competence about her own body; prejudice/power imbalance).
  *   **Rajat:** Unfair (Ignored Rajat's specific competence; group dynamics/power let Dave steal credit).
  *   **Drunk Friend:** Fair (Specific evidence: intoxication impairs reliability *at that time*).
  *   **Cousin:** Fair (Specific evidence: *His* track record on *financial tips*).
  *   **Friend Gaslighted:** Unfair Epistemic Injustice (Systematically undermined her competence as a knower, destroying her credibility *to herself* and others).

  **Inconsistency?** Your gut is mostly right. The key difference between your cousin (fair) and the "finance bro" discount (unfair) is **individual assessment vs. group prejudice**. Your sister's case is fair because it *is* individual assessment (her son's specific lies) within a specific responsibility context (parenting). The "finance bro" discount prejudges individuals solely by group, ignoring their specific competence. Stick with your initial verdicts!
