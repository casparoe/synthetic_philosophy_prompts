prompt: |-
  Give an example of a concrete scenario where an AI system would genuinely run into the frame problem, as opposed to just the boring task of figuring out what's relevant. Like, a lot of people shrug and say humans "solve" this all day long by ignoring stuff, so come up with a case where the interesting part is not detecting what changed but ruling out the unbounded pile of things that didn't change but were never explicitly listed as staying the same. Please avoid the stock examples (robot pushing a box around a room, etc.) -- maybe something from a totally different setting like a legal assistant or a game-playing system. Also explain where in your example the naive fix of a default rule like "assume things stay as they were unless told otherwise" would break down, e.g. because the system ends up having to check its own assumptions or gets stuck deciding what counts as a "thing" to hold constant.
reasoning: |-
  We are going to avoid the typical robotics examples and instead look at a legal scenario. Specifically, consider an AI system designed to assist in legal reasoning about property law, such as determining the effects of a new contract or a change in legislation on existing property rights.

  **Scenario: Legal Assistant AI and the Impact of a New Easement**

  **Setting:** A legal AI assistant is used by a law firm that deals with real estate. The system has a knowledge base that includes the current state of property rights for a particular piece of land (Parcel A) and the surrounding parcels. The current situation is:

  - Parcel A is owned by Alice.
  - Parcel B (adjacent to Parcel A) is owned by Bob.
  - There is an existing easement that allows Bob to cross a specific path on Parcel A to access a public road (this is recorded in the deeds and known to the system).
  - The system also knows about various zoning laws, environmental regulations, and contractual obligations that might affect the property.

  **Event:** A new contract is signed between Alice and Bob that modifies the existing easement. The contract states:
  - Bob's easement is now restricted to use only on weekdays (Monday to Friday) from 8 am to 6 pm.
  - Bob is required to maintain the path at his own expense.

  **The Frame Problem in this Scenario:**

  The AI system is tasked with updating its knowledge base to reflect the new state after the contract. The obvious changes are:
  - The temporal restrictions on the easement.
  - The maintenance obligation on Bob.

  However, the frame problem arises because the system must ensure that everything else that was true before remains true unless the contract explicitly changes it. The challenge is that the "everything else" is potentially unbounded and not explicitly listed.

  **Why is this non-trivial? What didn't change?**

  The system must reason that the following (and many more) remain unchanged:

  1. Alice still owns Parcel A.
  2. Bob still owns Parcel B.
  3. The boundaries of the parcels remain the same.
  4. Other easements or rights (e.g., utility easements) on Parcel A are unaffected.
  5. The zoning classification of Parcel A remains residential.
  6. The property tax rate for Parcel A hasn't changed because of this contract.
  7. Environmental regulations that apply to the property are still in force.
  8. Any existing mortgages on Parcel A are unaffected.

  Moreover, the system must avoid drawing incorrect inferences that might seem plausible but are not justified. For example:

  - Did the contract alter the ownership of Parcel A? (No, it only changed the easement.)
  - Did the contract create a new lien on the property? (No, it only changed the terms of the easement.)
  - Is the path now being maintained by Bob considered an improvement that might affect the property value? (The contract doesn't say, so we don't assume that it does without further evidence.)

  **Where the naive "assume things stay the same" breaks down:**

  1. **Inferring Non-Effects on Unrepresented Properties:** The system must avoid assuming that the contract affects properties that are not mentioned. But what if the contract mentions a third party (e.g., a neighbor's consent) that is not represented in the current knowledge base? The system must not assume that the neighbor's property rights are unchanged without checking the contract's full context.

  2. **Indirect Effects via Chains of Reasoning:** The system might have rules that allow for inferences. For example, if the easement is restricted, does that affect the market value of Parcel A? The naive frame assumption might prevent the system from updating the market value (because the contract doesn't explicitly mention market value). However, if the system has a rule that says "restrictions on use may decrease market value", then it must update the market value. But note: the frame assumption would typically block such updates because the contract doesn't explicitly mention market value. This creates a conflict: the frame rule says "market value remains the same" but the inference rule says "market value changes". How does the system know when to apply inference and when to hold the frame?

  3. **Deciding What "Things" Are:** The frame problem requires knowing what "things" (properties, relations) we are holding constant. But in a rich representation, the system must decide what counts as a distinct property. For example, the system might represent:
     - The easement has a "duration" property (which changed) and an "obligation" property (which now includes maintenance).
     - But what about the "burden" on the servient estate (Parcel A)? The burden might be represented as a separate property. The contract doesn't explicitly say the burden changed, but by restricting the hours and adding maintenance, the burden has actually changed. However, the system might have a rule that the burden is defined by the easement terms. So, if the terms change, the burden changes. But then the frame problem arises: the system must update the burden because it's defined by the terms, but it must also note that the burden is not an independent fact that can be held constant by the frame rule.

  4. **Interactions with Other Rules:** The system might have to check if the new contract violates any existing laws or contracts. For example, if there was a prior agreement that the easement must be available 24/7 for emergency vehicles, then the new restriction might violate that. The frame rule would typically not trigger such a check because it's about holding things constant, not about checking consistency. Thus, the system must have a way to know that it must check for such conflicts even though the prior agreement wasn't mentioned in the new contract.

  5. **Temporal Projection Beyond the Immediate Change:** The frame problem also appears when projecting the state into the future. For instance, if the system is asked what the state will be next week, it must not only hold constant the unchanged properties but also account for the fact that some properties might change due to other events (like a tax bill being passed) that are not related to the contract. The frame rule would naively hold everything constant, which is incorrect because the world changes independently.

  **Conclusion:**

  In this legal scenario, the frame problem is not just about ignoring irrelevant information but about the system's ability to correctly and efficiently update its knowledge base without having to explicitly check every single fact in its database (which might be huge and constantly growing). The naive frame rule of "if not mentioned, then unchanged" breaks down when:

  - The system has inference rules that might derive changes from the new state.
  - The representation of what constitutes a "thing" is complex and interdependent (like the burden of the easement being defined by the terms).
  - The system must check for consistency with other rules (like prior contracts or laws) that were not mentioned in the new contract but are relevant.

  Thus, the AI system must have a sophisticated mechanism to determine which facts are subject to the frame rule and which require inference, and it must do so without falling into infinite regress or combinatorial explosion.
answer: |-
  Below is a concrete example of the frame problem in a legal AI assistant scenario, designed to highlight the challenge of managing an unbounded set of *unchanged* elements beyond simple relevance filtering. The naive "assume things stay the same" default rule breaks down in subtle ways, forcing the system to confront ambiguities in what counts as a "thing" to hold constant and triggering self-referential checks.

  ---

  ### **Scenario: Legal AI Assistant Handling a Corporate Merger**  
  **Context**: An AI legal assistant manages contractual obligations for a multinational corporation ("Alpha Corp"). Alpha Corp has thousands of active contracts with partners, employees, governments, and suppliers. Each contract has clauses that interact with others (e.g., a supplier contract might reference intellectual property terms from an R&D partnership).  

  **Event**: Alpha Corp merges with Beta Inc.  
  - The merger agreement states:  
    - *All Alpha Corp patents transfer to the new merged entity ("Alpha-Beta")*.  
    - *All employee contracts with Alpha Corp are terminated; new contracts are issued under Alpha-Beta*.  

  **Task**: The AI must update its knowledge base to reflect post-merger legal realities.  
  - **Explicit changes**: Patent ownership updates, employee contract cancellations.  
  - **Frame problem challenge**: The AI must ensure *everything else remains unchanged* unless contradicted.  

  ---

  ### **Where the Frame Problem Arises: The Unbounded "Unchanged"**  
  The AI cannot simply assume "unchanged" by default because:  
  1. **Indirect dependencies**: Contracts reference external policies, laws, or other agreements not explicitly mentioned in the merger document.  
  2. **Emergent interactions**: A change in one area (e.g., patents) might *implicitly* affect unrelated clauses (e.g., liability limits).  
  3. **Ambiguous "things"**: The system must define what constitutes a discrete "thing" to hold constant (e.g., is a "confidentiality obligation" one fact or 100 sub-clauses across contracts?).  

  **Example Breakdown**:  
  Suppose an Alpha Corp supplier contract states:  
  > *"Supplier must not use Alpha Corp's patented Method X in its products."*  

  **Post-Merger Questions the AI Must Resolve**:  
  1. Does the *patent transfer* invalidate this clause?  
     - Explicit change: Patents now belong to Alpha-Beta.  
     - Unchanged? The clause forbids use of "Method X," but the patent owner changed.  
     - **Frame issue**: The default rule assumes the clause is unchanged, but ownership transfer might alter enforceability (e.g., if the contract defines "Alpha Corp" rigidly). The AI must check if the clause relies on patent ownership.  

  2. Does the *employee contract termination* affect supplier agreements?  
     - Explicit change: Only employee contracts are terminated.  
     - Unchanged? The supplier contract requires approval from "Alpha Corp's Head of R&D," who was an Alpha Corp employee.  
     - **Frame issue**: The default rule assumes the approval process is unchanged, but if the Head of R&D was fired in the merger, the clause is unenforceable. The AI must verify if roles still exist.  

  3. **Unbounded ripple effects**:  
     - A tax treaty between Alpha Corp and Country Z grants exemptions if "Alpha Corp owns Patent Y."  
     - Post-merger, Patent Y is now owned by Alpha-Beta.  
     - **Frame issue**: The tax treaty wasn't mentioned in the merger. The default rule assumes the exemption holds, but ownership changed. The AI must decide:  
       - Is the treaty a "thing" to hold constant?  
       - Does "Alpha Corp" in the treaty include successors?  
       - This requires checking legal definitions *outside the merger document*.  

  ---

  ### **Why the Naive "Assume Unchanged" Default Fails**  
  1. **Self-referential traps**:  
     - The rule "assume things stay the same" applies to *itself*. If the merger alters how change-propagation works (e.g., "all clauses referencing Alpha Corp now include successors"), the AI must *suspend* the default rule to handle this meta-change.  

  2. **Undefinable "things"**:  
     - What counts as a "thing"? The AI might represent:  
       - Low-level: *Individual contract clauses* (e.g., 50,000+ "facts").  
       - High-level: *Legal concepts* (e.g., "Alpha Corp’s corporate identity").  
     - **Breakdown**: If the merger dissolves "Alpha Corp" as a legal entity, high-level concepts (e.g., "Alpha Corp’s obligations") become undefined. The default rule can’t hold them constant because they no longer exist. The AI must:  
       - Re-map obligations to Alpha-Beta.  
       - Audit every clause referencing "Alpha Corp" to see if it survives.  
       → This requires *context-aware inference*, not a blanket default.  

  3. **Inconsistent defaults**:  
     - **Scenario**: A contract states, "Supplier must follow Alpha Corp’s Sustainability Policy." Post-merger, Alpha-Beta adopts a new policy.  
     - **Naive default**: The clause is unchanged → supplier must follow the old policy.  
     - **Reality**: The old policy might be legally void if Alpha Corp no longer exists.  
     - **Conflict**: The AI must override the default rule by inferring that policies are tied to the *current entity*, not preserved statically.  

  ---

  ### **Why This is Fundamentally Harder Than "Relevance Detection"**  
  Humans handle this by intuitively:  
  - Prioritizing *salient* interactions (e.g., "patent transfer affects IP clauses").  
  - Ignoring low-risk invariants (e.g., "a supplier’s office address won’t change").  
  But the AI faces:  
  - **Combinatorial explosion**: 10,000 contracts × 100 clauses each → 1M+ facts to verify.  
  - **No clear boundaries**: "Holding everything constant" requires defining "everything," which is ambiguous (e.g., is "Alpha Corp’s goodwill" a distinct fact?).  
  - **Meta-reasoning**: The system must check if its *own rules* for applying defaults are still valid post-merger.  

  ### **Key Takeaway**  
  This scenario forces the AI to:  
  1. **Identify implicit invariants** (e.g., "contracts survive entity changes unless specified").  
  2. **Override defaults** when logical dependencies emerge.  
  3. **Define fluid categories** (e.g., when "Alpha Corp" becomes a historical reference).  
  Unlike robotics examples, legal systems have no physical closure—every clause can theoretically interact with laws, policies, or other contracts, creating a non-bounded set of "unchanged" elements to verify. The frame problem here is less about *ignoring* irrelevance and more about *proving* consistency in an open-ended domain.
