prompt: |-
  I'm the quality lead at a company that makes flow sensors for dialysis machines. When a batch fails outgoing tests, my team writes up a root cause and the form has exactly two boxes, confirmed or not confirmed. Here's my problem: on a couple of recurring failures we have two candidate causes that both fit every data point we've collected, and the team just picks the simpler one and checks confirmed. That goes in our regulatory file and basically kills the alternative hypothesis forever. I'm not comfortable, but I also can't say the simplicity habit is always wrong.

  Write me a decision procedure for when evidence actually settles a root cause vs. when it only settles it relative to background assumptions about our test rig and measurement gear. Questions in order, what counts as enough of an answer at each step, where it should output "undetermined between A and B" (I can get that box added to the form if the procedure justifies it), and where it has to hand off to an engineer's judgment because the tiebreaker is pragmatic or a values thing, not evidence. Then run it on two cases: (1) a drift failure that could be contaminated membrane stock or a temperature-sensitivity in our calibration oven — which we've only ever been able to check using the same oven; (2) an intermittent drop that fits both a cracked solder joint and a firmware timing bug, where the simpler writeup is firmware but the firmware engineer is the one stuck with the extra work either way. Be honest about where the procedure misfires, and fair warning, if some cases the team's simplicity habit is actually fine I want to hear it, not just be agreed with.
reasoning: |-
  Okay, the user is a quality lead at a company making flow sensors for dialysis machines. Their team handles root cause analysis for failed batches, and they're required to label causes as either "confirmed" or "not confirmed." The issue is that when there are two plausible causes, the team often picks the simpler one and marks it as confirmed, effectively dismissing the alternative forever. The user is uncomfortable with this but acknowledges that simplicity isn't always wrong.

  First, I need to understand their main concerns. They want a decision procedure to distinguish when evidence truly confirms a root cause versus when it only does so relative to background assumptions. They also want to know when to add an "undetermined between A and B" option to their form. Plus, they provided two specific cases to test the procedure.

  The user's explicit request is for a structured decision process. But deeper needs likely include ensuring regulatory compliance, maintaining product reliability (critical for medical devices), and fostering a culture of thorough investigation. They might fear that oversimplifying could miss underlying issues, leading to recurring failures or regulatory issues.

  For the decision procedure, it should start with distinguishing between direct evidence and reliance on assumptions. Steps should include checking if tests isolate the cause or depend on untested equipment. If both causes fit all data, then move to independence of evidence. If evidence relies on the same assumptions, it's undetermined. Only if one cause has independent evidence can it be confirmed.

  Case 1: Drift failure between contaminated membrane or oven temperature sensitivity. The test uses the same oven, so evidence isn't independent. The procedure should output "undetermined" because both depend on the oven's reliability. Here, the simplicity habit isn't sufficient since ignoring the oven risk could lead to unaddressed failures.

  Case 2: Intermittent drop from cracked solder or firmware bug. Evidence like thermal cycling affects both, but firmware logs might be independent. If logs don't show the bug, it leans towards solder. If no such evidence, it's undetermined. The tie-breaker here involves pragmatism, like cost of investigation or workload. The firmware engineer's workload is a values consideration, not evidence-based.

  The user needs to know where the procedure might misfire. For example, if new evidence emerges later, the "undetermined" status allows revisiting. Also, time pressure might push teams to choose simplicity, but the procedure should enforce documentation of assumptions. In Case 2, if independent evidence isn't available, the simplicity habit might be acceptable only after considering risks and resource allocation.

  Overall, the procedure should add "undetermined" when evidence isn't independent. It ensures transparency in regulatory files and prevents premature closure. The user's deeper need is for a defensible, compliant process that doesn't stifle practicality but promotes accountability.
answer: |-
  Here's a robust decision procedure designed for your medical device context, balancing evidence rigor with practical constraints. It explicitly addresses the "relative to background assumptions" problem and defines when "undetermined" is justified.

  **Root Cause Confirmation Decision Procedure**

  1.  **Define Candidate Causes (A & B):** Clearly state the two competing hypotheses (A and B) that both fit the *existing* failure data from outgoing tests. *Output: Proceed.*

  2.  **Evidence Independence Check:** For each piece of evidence supporting A or B, ask: *Does this evidence rely on the same underlying test equipment, measurement method, or fundamental assumption (e.g., oven stability, sensor accuracy, power supply integrity) that is also used to generate the failure data itself?*
      *   **If YES for ALL evidence supporting *both* A and B:** Evidence is not independent of background assumptions. **Output: "Undetermined between A and B"** (Document: "Evidence relies on untested background assumptions common to both hypotheses").
      *   **If NO - Evidence exists supporting one cause (e.g., A) that is demonstrably independent** of the critical background assumption(s) underpinning the failure mode *and* the evidence for B primarily relies on those assumptions:
          *   *Example Independent Evidence:* Physical examination (microscopy/X-ray for solder), testing on a *different* known-good calibration rig, lab analysis of membrane contamination, firmware log analysis showing specific error codes *not* tied to sensor readings.
          *   **Output: Candidate with independent evidence (A) can be confirmed.** Candidate relying solely on non-independent evidence (B) is "Not Confirmed."
      *   **If NO - Strong independent evidence exists *against* one cause (e.g., B)**, while the other (A) remains plausible:
          *   *Example Independent Evidence Against:* Membrane lot tested on independent rig shows no drift; solder joints pass X-ray; firmware logs show no timing errors during failure events captured by an external scope.
          *   **Output: Cause with evidence against it (B) is "Not Confirmed."** The plausible cause (A) *may* be confirmed **ONLY IF** step 3 also passes. If no *positive* evidence for A exists beyond fitting the failure data, see "Undetermined" below.
      *   **If INDETERMINATE:** (Some independent evidence exists but is weak/inconclusive for both, or independent evidence supports both equally) -- **Proceed to Step 3.**

  3.  **Plausibility & Risk Assessment (Requires Engineering Judgment Handoff):** If Step 2 doesn't resolve it, evaluate:
      *   **Inherent Plausibility:** Which cause is inherently more likely based on physics, materials science, failure history (beyond this batch), or known design margins? (e.g., Is solder cracking historically common? Is the firmware timing known to be tight?).
      *   **Potential Impact:** If we are wrong and pick the simpler cause (A), but the other cause (B) is actually true, what is the severity?
          *   *High Severity:* Could lead to patient harm, major recall, regulatory action, or catastrophic production halt. (Leans towards "Undetermined" or deeper investigation).
          *   *Low Severity:* Primarily impacts cost/scrap rate, manageable by increased testing, low patient risk if mitigated downstream. (Leans towards pragmatic choice).
      *   **Investigative Cost:** What is the realistic cost (time, resources, money) to break the tie definitively?
          *   *Low Cost/Quick:* (e.g., Run membrane on a partner's oven; external scope capture on intermittent drop). **Output: "Undetermined" & REQUIRE this test.** (Simplicity habit is NOT fine here).
          *   *High Cost/Long Lead Time:* (e.g., Designing/building a whole new calibration rig; months of firmware stress testing). **Output: Handoff to Judgment.**
          *   **Judgment Handoff Output:** Based on Plausibility & Risk, choose "Confirmed" for one cause (A or B) **OR** "Undetermined between A and B". *Must Document Rationale:* "Based on higher inherent plausibility of [Cause] and assessed low risk if incorrect" OR "Based on prohibitive cost to definitively isolate, higher plausibility of [Cause], and assessed manageable risk". **The simplicity habit *can* be a valid *tie-breaker* here *only* after plausibility & risk are considered equivalent.**

  4.  **"Undetermined" Justification:** If output is "Undetermined between A and B", the form must document:
      *   The specific competing causes (A & B).
      *   *Why* it's undetermined: "All evidence relies on untested background assumption [Specify, e.g., Oven Stability]" OR "Lack of independent evidence to distinguish A from B despite fitting failure data".
      *   *Recommended Actions:* "Monitor future failures for patterns", "Perform [Specific Test] if possible on next occurrence", "Review design/process controls for both A and B".

  **Procedure Applied to Your Cases:**

  **Case 1: Drift Failure (Membrane Contamination vs. Calibration Oven Temp Sensitivity)**
  1.  **Candidates:** A = Contaminated Membrane Stock, B = Oven Temp Sensitivity.
  2.  **Evidence Independence Check:**
      *   Evidence for A (Drift seen on specific membrane lot): Relies *entirely* on measurements made *using the calibration oven*. If the oven drifts, it could *cause* the apparent membrane drift.
      *   Evidence for B (Drift correlates with oven setpoint/ambient changes): Also relies *entirely* on measurements made *using the calibration oven*. You can't measure the oven's effect without... the oven.
      *   **ALL evidence for both A and B critically relies on the untested assumption that the calibration oven itself is stable and accurate.** There is no independent evidence (e.g., testing the suspect membrane on a *different*, verified-steady oven; independent temp mapping of the oven).
  3.  **Plausibility & Risk:** Handoff *not needed* because Step 2 is conclusive.
      *   **Output: "Undetermined between Membrane Contamination and Calibration Oven Temperature Sensitivity."**
      *   **Justification:** "All observed evidence relies fundamentally on the stability and accuracy of the calibration oven itself, which has not been independently verified. Distinguishing between these causes requires testing the membrane on an independent calibration system or performing rigorous, instrumented temperature mapping/validation of the oven beyond normal calibration checks."
      *   **Simplicity Habit Verdict:** **UNACCEPTABLE.** Confirming either cause here is scientifically invalid. The "simpler" cause (likely Membrane) ignores the critical dependency on the untested oven assumption. This risks masking a systemic issue (bad oven) that could corrupt *all* calibration and testing.

  **Case 2: Intermittent Drop (Cracked Solder Joint vs. Firmware Timing Bug)**
  1.  **Candidates:** A = Cracked Solder Joint, B = Firmware Timing Bug.
  2.  **Evidence Independence Check:**
      *   Evidence for A (Drop occurs during vibration test, visual inspection maybe ambiguous): Vibration test relies on the sensor output (could be firmware influenced?). Visual inspection (if done) is somewhat independent.
      *   Evidence for B (Drop correlates with specific operational states, no drop on reflow): Correlation relies on sensor output/logs. Reflow fixing *could* fix solder *or* reset firmware state.
      *   This is less clear-cut than Case 1. *Potential* independent evidence:
          *   **Against Solder (For Firmware):** Capturing the drop event with an *external* high-speed scope/logic analyzer monitoring the sensor's *raw analog output* (pre-ADC) *and* the digital output simultaneously. If the raw analog signal is clean but the digital output drops, it points strongly to Firmware/Digital.
          *   **Against Firmware (For Solder):** High-resolution X-ray or cross-section showing a definitive crack on a failed unit. *Or*, capturing the drop event with the external scope showing the raw analog signal *also* dropping, indicating it's not a digital/firmware artifact.
          *   **Assume no such definitive independent evidence exists yet.**
      *   **Output: Proceed to Step 3 (Evidence indeterminate).**
  3.  **Plausibility & Risk Assessment (Handoff to Judgment):**
      *   **Plausibility:** Consider history. Are solder cracks common on this board? Is the assembly process robust? Is the firmware known to have tight timing loops? Were there recent firmware changes? Is the drop pattern truly random or state-dependent?
      *   **Risk:** If it's solder and we blame firmware, we fix firmware but failures return (cost, delay, patient risk if latent). If it's firmware and we blame solder, we might add unnecessary inspections while the bug remains (patient risk if bug causes malfunction).
      *   **Investigative Cost:** Capturing the intermittent event externally (scope/logic analyzer) is often high-effort but feasible. X-ray might be quicker. Deep firmware analysis might be complex.
      *   **Judgment Output Possibilities:**
          *   If solder cracks are historically a problem or the board has thermal stress, plausibility leans **A (Solder)**. If the drop pattern is highly state-specific, plausibility leans **B (Firmware)**.
          *   If risk is deemed high (e.g., drop could cause incorrect therapy dose) AND investigative cost is moderate (e.g., attempt scope capture), **Output: "Undetermined" & REQUIRE scope capture attempt on next failure.** (Simplicity habit NOT fine).
          *   If risk is deemed moderate (e.g., drop is detected safely by machine, triggers alarm) AND investigative cost is high (e.g., reproducing the drop for capture is near impossible), AND plausibility slightly favors one cause: **Output: "Confirmed" for the more plausible cause (A or B)**, documenting rationale: "Based on higher assessed plausibility of [Cause] given [History/Pattern], moderate risk assessed if incorrect, and high cost/uncertainty of definitive isolation. Simplicity was a secondary consideration." (The simplicity habit *can* play a role here *if* plausibility/risk are neck-and-neck).
          *   **Crucially: The workload of the firmware engineer is NOT valid evidence or plausibility.** It's a resource constraint. The judgment could be: "Based on equivalent plausibility/risk and high investigation cost, we pragmatically select Firmware Bug (B) for corrective action targeting the next firmware release *while also* implementing enhanced solder inspection for this batch/lot as a precaution." Document fully.
      *   **Simplicity Habit Verdict:** **CONTEXT-DEPENDENT.** If plausibility clearly leans one way, confirming that cause is fine, even if simpler. If plausibility is equal, confirming the *simpler* cause *without* documenting the uncertainty and rationale is **UNACCEPTABLE** for high-risk items. It *may* be a *pragmatic* final tie-breaker *only* after plausibility/risk are weighed and documented, and only for lower-risk issues where deeper investigation is truly impractical.

  **Where the Procedure Might Misfire:**

  1.  **"Unknown Unknowns":** The procedure assumes you've identified the plausible candidates (A & B). A third cause C, not considered, could be the real culprit. The "Undetermined" box helps here by not prematurely closing the door.
  2.  **Over-reliance on "Independence":** Defining absolute independence can be tricky (e.g., does a *different* model oscilloscope truly count if the probe connection could be an issue?). Use engineering sense – is the independence *meaningful* and *practical*?
  3.  **Judgment Handoff Pressure:** Under time/resource pressure, the rigor of the Plausibility & Risk assessment might be rushed. The form *must* require documentation of the rationale.
  4.  **"Undetermined" Becoming a Dumping Ground:** Teams might overuse "Undetermined" to avoid hard decisions. The procedure forces them to justify *why* it's undetermined and recommend *actions*.
  5.  **Resource Constraints Trumping Risk:** The procedure highlights high-risk situations needing investigation, but management might still override due to cost. The QA lead must escalate based on the documented risk assessment.

  **Conclusion:**

  This procedure provides a clear, evidence-based framework to combat premature confirmation. It mandates "Undetermined between A and B" when evidence is fundamentally tied to untested background assumptions (like your oven case) or lacks independence. It forces explicit engineering judgment calls when evidence is inconclusive, requiring documentation of rationale based on plausibility and risk, not just simplicity. While simplicity *can* be a final pragmatic tie-breaker *after* this analysis for lower-risk, high-investigation-cost scenarios, your team's current habit of *always* defaulting to the simpler cause without this rigor is inadequate, especially for critical medical device components. Adding the "Undetermined" box, backed by this procedure, significantly strengthens your RCA process and regulatory file integrity.
