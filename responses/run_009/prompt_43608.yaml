prompt: |-
  So I'm in year 12 and I run this debate club blog thing at school where we argue about basically everything (last week it was whether zoos should exist, it got heated). Next month the motion is along the lines of "this house would take in far more refugees" and honestly everyone keeps talking past each other, because half the club means totally different things by "refugee" and the other half means different things by "take in". So I want to make a quiz — "which view on refugees do you actually hold?" — that sorts people by what they say about concrete cases, not by which political label they like.

  Can you write it for me? What I want:

  - 8 to 10 questions, each one a concrete case with 2 or 3 answer options (not agree/disagree scales). Mix "who counts" cases and "who has to take them in" cases. For who counts, things like: a woman fleeing a gang that's going to kill her because her brother testified against them, where her own government either can't or won't protect her — is she a refugee even though the classic legal definition centres on persecution by the state? A family whose island floods badly every year now — refugee or "just a migrant"? A guy fleeing crushing poverty but not persecution. And the textbook case, someone their own government is jailing for their political opinions.
  - For who has to take them in: does the nearest safe country have a special duty? Do rich countries owe more because of capacity, or because of past involvement (wars they funded, arms they sold)? Is it ever ok to turn people away because your own housing and services are stretched? Does paying another country to host them count as doing your share?
  - A scoring key mapping answer patterns onto positions. The leaves should at least include the strict literal reading of the 1951 Convention definition, expanded definitions that pull in climate migrants and gang persecution, something like a near-open-borders view, and the view that states have wide freedom to exclude except where there's a special relationship. If a position has a well known defender you can mention the name but dont stress about it, "unnamed" is fine.
  - The tricky bit I actually care about: build the quiz from the questions first — like, lay out the logical space of possible answer combinations — and then say where the real positions sit inside it. Flag any combination nobody holds, with a sentence on why (incoherent? just unattractive? noone's explored it?). And flag any two positions the quiz can't actually separate — I'd rather know where it fails than pretend it works.
  - No question should just be "do you think refugees have rights" — that's exactly the thing I'm trying to avoid, people picking the option that sounds like their team.

  One more thing: at the end, tell me where you think the quiz is most likely to mislabel someone, and what kind of answer or case would show the sorting doesn't work — basically, what would change your mind that the tree is built right. If you're not sure a position actually exists, or that a question cleanly separates two views, just say so instead of faking confidence.

  Also pls write it in British English, since that's what we use here (my own spelling is obviously a lost cause, as you can probably tell).
reasoning: |-
  Okay, the user is running a debate club blog in Year 12 and wants a quiz to help clarify different views on refugees. They're frustrated because people in their club use terms like "refugee" and "take in" differently, leading to unproductive arguments. The quiz needs concrete scenarios to sort people into actual positions rather than political labels.

  The user wants 8-10 questions with specific cases—mixing "who counts" as a refugee and "who should take them in." For "who counts," examples include a woman fleeing gang violence where the state won't protect her, climate migrants, economic migrants, and political prisoners. For "who should take them," questions should cover duties of neighboring countries, responsibilities of wealthy nations, capacity limits, and outsourcing hosting.  

  The scoring key should map answers to positions like the strict 1951 Convention definition, expanded definitions including climate and gang refugees, near-open borders, and state sovereignty views. The user emphasizes avoiding vague questions about rights and instead using concrete cases.  

  The tricky part is designing the quiz by first laying out the logical space of possible answer combinations, then placing real positions within it. I need to flag combinations no one holds (due to incoherence or unattractiveness) and positions the quiz can't distinguish. Also, I should note where mislabeling might occur and what could invalidate the sorting.  

  I'll use British English spelling and terminology. The quiz structure should have clear scenarios with 2-3 answer options each. After drafting questions, I'll map the answer patterns to positions, highlighting gaps and overlaps. Finally, I'll discuss limitations and potential mislabeling risks.  

  For "who counts" questions:  
  - Political dissident (textbook case)  
  - Woman fleeing gangs (state unwilling to protect)  
  - Family from flooded island (climate displacement)  
  - Man fleeing poverty (economic migrant)  

  For "who should take in" questions:  
  - Duty of nearest safe country  
  - Responsibility based on wealth vs. historical involvement  
  - Turning away due to strained resources  
  - Paying another country to host  

  I'll ensure questions don't have "rights" framing but present dilemmas. The scoring will reflect how answers cluster into coherent positions while noting edge cases. The analysis will address where the quiz might fail, like when someone holds a nuanced view not captured by the options.
answer: |-
  Here's a refugee policy quiz designed for your debate club, focusing on concrete cases and avoiding vague labels. It's built by mapping the logical space first, then identifying where real-world positions sit within it, warts and all.

  **The "What Do You *Actually* Think About Refugees?" Quiz**

  **Instructions:** Read each scenario carefully. Choose the answer (A, B, or C) that best reflects your view on the specific question asked. There are no "right" or "wrong" answers, just what *you* believe should happen based on the case described.

  ---

  **1. The Political Dissident:** Ahmed is jailed and tortured in Country X for criticising the government. He escapes and seeks asylum.  
  *Question:* Should Country Y grant him refugee status?  
      A. **Yes, absolutely.** This is the core reason the refugee system exists.  
      B. **Yes, but only if Country Y has no major security concerns about him.**  
      C. **No, Country Y has no obligation; it's Country X's problem.**

  **2. The Sister in Peril:** Maria flees her home in Country Z after a powerful gang threatens to kill her because her brother testified against them. The police refuse to protect her.  
  *Question:* Should Maria qualify as a refugee?  
      A. **Yes.** The state's inability/unwillingness to protect her from non-state persecution makes her a refugee.  
      B. **No.** Refugee status is only for state persecution; she should seek other forms of protection or migrate normally.  
      C. **Maybe, but only if the threat is extreme and widespread, not just personal.**

  **3. The Sinking Island:** The Patel family lives on a low-lying island. Rising sea levels and annual severe flooding have destroyed their home and livelihood repeatedly. They cannot relocate safely within their country.  
  *Question:* Should the Patel family qualify as refugees?  
      A. **Yes.** Climate destruction creating unliveable conditions is equivalent to persecution, forcing displacement.  
      B. **No.** This is environmental disaster, not persecution; they need migration pathways, not refugee status.  
      C. **They need protection, but the 'refugee' label doesn't fit; a new category is needed.**

  **4. The Economic Hardship Case:** Kofi lives in Country W with extreme poverty, famine, and no job prospects. He risks the journey to seek work and a better life in Country V.  
  *Question:* Should Kofi qualify as a refugee?  
      A. **No.** Poverty, however severe, is not persecution. He is an economic migrant.  
      B. **Possibly, if the poverty is caused by conflict or state neglect amounting to persecution.**  
      C. **Not technically, but wealthy countries have a moral duty to offer pathways to people in such desperate situations.**

  **5. The First Safe Harbour Principle:** Refugees flee Conflictland. The nearest safe country, Neighbourton, takes in a large number but is overwhelmed. They continue travelling to reach Richerland, further away.  
  *Question:* Does Richerland have the right to refuse asylum claims because Neighbourton was the first safe country?  
      A. **Yes.** The first safe country principle is practical and fair; refugees should claim asylum there.  
      B. **No.** Refugees have the right to seek asylum wherever they can reach safely; responsibility isn't solely geographical.  
      C. **Only if Neighbourton can genuinely offer adequate protection; Richerland should help Neighbourton cope instead.**

  **6. The Capacity Question:** Country A is wealthy but experiencing a severe housing shortage and stretched public services. A large group of recognised refugees arrives seeking settlement.  
  *Question:* Is it acceptable for Country A to limit the number it takes in due to these pressures?  
      A. **Yes.** States must prioritise their own citizens' welfare; capacity is a legitimate limiting factor.  
      B. **No.** Protecting refugees is a fundamental duty; capacity constraints require international solutions, not refusal.  
      C. **Yes, temporarily, but only while actively working to increase capacity and share responsibility internationally.**

  **7. The Historical Responsibility Argument:** Country B (a former colonial power) sold large quantities of arms to factions in Country C, contributing significantly to the civil war causing refugees.  
  *Question:* Does this history mean Country B has a *greater* obligation to take refugees from Country C than a similarly wealthy country with no such involvement?  
      A. **Yes.** Causing harm creates a special responsibility to help the victims.  
      B. **No.** Obligation should be based on current capacity and global need, not past actions.  
      C. **Yes, but primarily through funding and supporting host countries near Country C, not necessarily taking people itself.**

  **8. The Offshore Processing Deal:** Country D pays Country E (a poorer, stable country) to host and process asylum seekers aiming for Country D. Country E provides basic shelter but conditions are poor.  
  *Question:* Does this arrangement satisfy Country D's obligations towards refugees?  
      A. **Yes.** Country D is funding protection elsewhere; this is a valid form of responsibility-sharing.  
      B. **No.** Outsourcing protection to avoid direct responsibility is unethical; refugees deserve the chance to settle in Country D.  
      C. **Only if Country E guarantees high standards of protection, processing, and durable solutions, which is often not the case.**

  **9. The Family Reunion Priority:** Jamal is a recognised refugee in Country F. His wife and children are trapped in a dangerous refugee camp elsewhere.  
  *Question:* Should reuniting Jamal with his family be a high priority for Country F's refugee intake?  
      A. **Yes, absolutely.** Family unity is a fundamental right and crucial for integration.  
      B. **Possibly, but the overall need and vulnerability of others should be the primary factor.**  
      C. **No; Country F's primary duty is to those already on its territory or at its borders.**

  ---

  **Scoring Key & Mapping the Logical Space**

  This key maps patterns of answers onto coherent positions. **Crucially, not every combination of answers is held by anyone.** The positions are clusters within the logical space defined by the questions.

  1.  **Strict 1951 Conventionist:**
      *   Core Belief: Adheres rigidly to the original UN definition (persecution by state for specific reasons - race, religion, nationality, political opinion, membership of a social group).
      *   Key Answers: 1A, 2B, 3B, 4A, 5A, 6A/C, 7B, 8A, 9B/C.
      *   Why it's held: Legal clarity, fear of system overload, belief in controlled immigration channels.
      *   **Gaps/Overlaps:** Might overlap with State Sovereigntist on Q5A/Q6A but diverges on Q1A/Q7B. Q9B/C is typical, but some might argue A.

  2.  **Expanded Protectionist:**
      *   Core Belief: The refugee definition should evolve to include severe harm from non-state actors (gangs, warlords) where the state fails to protect, and potentially severe climate displacement. Often supports stronger international burden-sharing.
      *   Key Answers: 1A, 2A, 3A/C, 4B/C, 5B/C, 6C/B, 7A/C, 8C/B, 9A.
      *   Why it's held: Recognises modern drivers of forced displacement beyond classic state persecution, emphasises human rights and protection needs.
      *   **Gaps/Overlaps:** Major distinction from Strict Conventionist on Q2A/Q3A/C. Distinction from Cosmopolitan on Q4B/C (not full open borders). Q3A vs Q3C is a key internal debate. Q8C is common, though some (B) oppose outsourcing entirely.

  3.  **Cosmopolitan/Humanitarian (Near-Open Borders):**
      *   Core Belief: National borders have limited moral weight. Wealthy states have strong obligations to those in desperate need, driven by fundamental human rights and global inequality. Views economic hardship and climate displacement as compelling reasons for admission.
      *   Key Answers: 1A, 2A, 3A, 4C/A, 5B, 6B, 7A, 8B, 9A.
      *   Why it's held: Strong belief in global justice, human equality, and the artificiality of borders. Views migration as a fundamental right.
      *   **Gaps/Overlaps:** Clear distinction on Q4C/A (accepting economic hardship as grounds) and Q6B (rejecting capacity limits). Q8B is a strong marker. Might overlap with Expanded Protectionist on Q1A/Q2A/Q3A but diverges sharply on Q4 and Q6.

  4.  **State Sovereigntist/National Prioritist:**
      *   Core Belief: States have a primary duty to their own citizens and wide discretion to control borders. Refugee protection is a limited exception, not a general obligation. Prioritises national interest, security, and cultural cohesion.
      *   Key Answers: 1B/C, 2B/C, 3B, 4A, 5A, 6A, 7B, 8A, 9C/B.
      *   Why it's held: Emphasis on national sovereignty, community cohesion, security concerns, and prioritising citizen welfare. Skepticism of international obligations overriding national interest.
      *   **Gaps/Overlaps:** Clear distinction on Q1B/C (possible refusal even for textbook cases), Q5A, Q6A. Might overlap with Strict Conventionist on Q2B/Q3B/Q4A but diverges significantly on Q1 (sovereigntists are more restrictive even there) and Q7B. Q8A is a strong marker.

  **Combinations Nobody Holds (and Why):**

  *   **Q1C + Q2A + Q3A + Q4A:** Believes Maria (gang) and the Patels (climate) *should* get refugee status, but Ahmed (textbook political) *should not*, while Kofi (poverty) definitely shouldn't. This is incoherent. If you accept expanded definitions, rejecting the core case makes no sense logically or ethically. No movement advocates this.
  *   **Q4C + Q5A + Q6A:** Believes countries have a strong moral duty to accept people fleeing poverty (C), but also that refugees must claim asylum in the first safe country (A) and that capacity limits justify refusal (A). This is contradictory. If poverty creates a strong moral duty, the geographic limitation (Q5A) becomes ethically dubious, and capacity arguments (Q6A) would be overridden by the strength of that duty. It's an unstable, unattractive middle ground.
  *   **Q6B + Q8A:** Believes states can *never* refuse refugees due to capacity limits (B), but *also* believes paying another country to host them (A) fulfils their obligation. This is incoherent. If capacity isn't a valid reason for refusal, outsourcing to potentially worse conditions (especially if Q8A implies low standards) contradicts the principle of non-refusal based on domestic constraints. Someone might *want* both, but the logic clashes.

  **Positions the Quiz Might Struggle to Separate:**

  1.  **Strict Conventionist vs. State Sovereigntist:** Both might choose Q1B, Q2B, Q3B, Q4A, Q5A, Q6A, Q7B, Q8A. The *difference* often lies in the *degree* of restrictionism even towards Convention refugees (Sovereigntists more likely Q1C, more emphasis on Q9C, more skeptical of Q7A even if they chose B). The quiz *might* not always capture this nuance if someone picks the slightly less restrictive option (B) on Q1. **Where it might mislabel:** A very security-focused Strict Conventionist might get labelled Sovereigntist, or a Sovereigntist who begrudgingly accepts core cases might get labelled Strict Conventionist.
  2.  **Expanded Protectionist vs. Cosmopolitan:** Both choose Q1A, Q2A, Q3A/C. The clearest divider is Q4. An Expanded Protectionist answers Q4B/C (poverty alone isn't enough, maybe if linked to persecution/neglect), while a Cosmopolitan answers Q4C/A (poverty is sufficient grounds). However, if an Expanded Protectionist strongly chooses Q4C ("moral duty"), and a Cosmopolitan chooses Q4C, they look the same here, even if their underlying philosophy differs. Q6B (Cosmopolitan) vs Q6C (Expanded Protectionist) is another divider, but an idealistic Expanded Protectionist might choose B. **Where it might mislabel:** An Expanded Protectionist with very strong humanitarian leanings on economic migrants might get labelled Cosmopolitan, or a Cosmopolitan concerned about feasibility might choose Q6C and look like an Expanded Protectionist.

  **Where Mislabeling is Most Likely & What Would Challenge the Model:**

  1.  **The Nuanced Pragmatist:** Someone who generally fits "Expanded Protectionist" but has strong concerns about integration capacity or security vetting might pick answers (like Q1B, Q6A, Q9B) that push them towards "State Sovereigntist" or "Strict Conventionist" in the scoring, even if their core view on *who counts* (Q2, Q3) is expansionary. **What challenges it:** If many people consistently select answers that mix, say, Q2A/Q3C (expanded definition) with Q5A/Q6A (strong sovereignty/capacity limits), it suggests a common "Cautious Expansionist" position isn't well captured by the current four-leaf structure. Adding this as a fifth position might be needed.
  2.  **The "Special Relationship" Advocate:** Someone whose views are primarily driven by historical responsibility (Q7A) or regional ties, but who might be restrictive otherwise. They might pick Q7A, but also Q1B, Q2B, Q3B, Q4A, Q5A, Q6A, Q8A, Q9C – looking like a Sovereigntist/Conventionist *except* for Q7. The quiz currently bins them as Sovereigntist/Conventionist. **What challenges it:** If a significant group consistently selects Q7A *alongside* otherwise restrictive answers, it indicates a distinct position driven by reparative justice *only* in specific cases, needing clearer separation.
  3.  **Ambiguity on Climate (Q3C):** Choosing "C" (Need a new category) could fit within Expanded Protectionist *or* Strict Conventionist/State Sovereigntist frameworks (the latter seeing it as a way to *avoid* calling them refugees). The quiz relies on other answers to disambiguate, which might not always work. **What challenges it:** If people choosing Q3C don't cluster neatly with either Expanded Protectionist or Conventionist/Sovereigntist answers on other questions, the category needs refinement.

  **Conclusion for the Quiz-Master:**

  This quiz forces engagement with concrete dilemmas, revealing underlying principles better than labels. Its strength is exposing *incoherent* combinations and highlighting the *main* axes of disagreement (definition vs. obligation, sovereignty vs. rights). Its weakness is potentially blurring the lines between adjacent positions (Strict vs. Sovereigntist; Expanded vs. Cosmopolitan) and missing highly specific views driven by single issues like historical responsibility.

  **Use it as a discussion starter:** After taking the quiz, have club members share their result and *which specific answer* they disagreed with most, or which scenario they found hardest. That's where the real debate begins! Good luck with the motion next month!
