  Elias should frame the regress as rational impossibility: demanding self-causation violates the principle of sufficient reason. Aris will counter by distinguishing between "authorship" and "causal ultimacy," citing emergent self-modification in complex systems. To honor the user's physics background, I'll have Aris invoke boundary-condition-altering dynamics as analogues for how agents *participate* in shaping their traits without ex nihilo creation.  

