answer: |-
  Your diagnosis is perceptive and largely correct—the impasse *is* substantially verbal, rooted in differing temporal perspectives on "effectively calculable" and distinct underlying questions being conflated. However, there are substantive nuances beneath the verbal disagreement that sustain the debate. I'll refine your hypothesis, identify the substantive core, and outline paths to progress.

  ### Refinements to Your Hypothesis:
  1. **Not Two but Three Temporal Stages**:  
     Your simultaneity analogy is apt, but the CT-thesis involves **three conceptual layers**, not two:
     - **Pre-theoretic (1930s practice)**: "Effectively calculable" as understood by working mathematicians (e.g., Hilbert's "finite combinatorial procedures").
     - **Formalization (1936–1950s)**: Turing's analysis as a *rational reconstruction* of this practice, crystallizing into a mathematical standard.
     - **Physical generalization (post-Gandy)**: Extending the thesis to encompass computation in physical systems (quantum, relativistic, analog).

  2. **Camps Map to Temporal Layers**:  
     - **Camp 1 (quasi-empirical)**: Focuses on the *retrospective justification* of the formalization stage. Their "non-deductive grounds" affirm that Turing's analysis *accurately captured* the pre-theoretic concept.  
     - **Camp 2 (stipulative)**: Addresses the *current use* of the formalized concept. For them, "computable" now *means* Turing-computable; questioning its "truth" confuses definition with discovery.  
     - **Camp 3 (physical)**: Concerned with the *future/extended application* to physical systems. They see the original thesis as a historical artifact, irrelevant to whether physics permits hypercomputation.  

  3. **The Core Verbal Dispute**:  
     All camps agree on the mathematical facts (e.g., equivalence of formalisms). The disagreement arises when asking:  
     - *What is the Church-Turing thesis about?*  
       - Camp 1: "The 1936 mathematical practice."  
       - Camp 2: "The modern definition of computation."  
       - Camp 3: "Universal physical realizability."  
     Calling this "verbal" is justified—but it masks deeper issues.

  ---

  ### The Substantive Undercurrent:
  Beneath the verbal dispute lie two unresolved questions:

  1. **Did the Pre-Theoretic Concept Have a Determinate Extension?**  
     - Camp 1 assumes it did (and Turing captured it).  
     - Camp 2 argues it was too vague to have an extension; formalization *created* the concept.  
     - **Substantive issue**: Whether historical practices (e.g., use of choice sequences, analog devices) genuinely challenged computability pre-1936. If pre-Turing mathematicians routinely accepted non-Turing-computable methods as "effective," Camp 1 collapses. Evidence suggests they did not—but this is contingent.

  2. **Does the Human-Clerk Restriction Matter for Physics?**  
     - Turing’s bounds (finite states, discrete steps) were motivated by human cognition. Gandy relaxed these for machines (e.g., parallel processing).  
     - **Substantive issue**: Are Gandy’s principles (locality, finite density) *necessary* for physical computation? If future physics violates them (e.g., non-local entanglement), does that refute the physical CT-thesis or just show its limits?

  ---

  ### Paths to Progress:
  The stalemate can be broken by **disambiguating the thesis** and **targeted empirical/theoretical work**:

  | Approach                  | Action                                                                 | Effect on Camps                                                                 |
  |---------------------------|------------------------------------------------------------------------|---------------------------------------------------------------------------------|
  | **Distinguish Three Theses** | Label them: <br>- **Historical CT**: Did Turing capture 1936 practices?<br>- **Formal CT**: Is "computable" defined as Turing-computable?<br>- **Physical CT**: Can all physical processes be simulated by TMs? | Forces camps to engage their specific domain. Camp 2 wins Formal CT trivially; debates shift elsewhere. |
  | **Clarify Pre-Theoretic Concept** | Analyze historical texts (e.g., pre-1936 discussions of "calculable" in Göttingen/Berkeley). Did mathematicians intuit Church-Turing limits? | If yes, strengthens Camp 1. If no, supports Camp 2. Resolves whether a determinate extension existed. |
  | **Test Physical CT**        | Build devices exploiting quantum gravity, closed timelike curves, or nonlinear dynamics. Does it solve uncomputable problems? | Refutes Physical CT if successful. Irrelevant to Historical/Formal CT. |
  | **Formalize "Effectiveness"** | Develop a tighter axiomatic model (e.g., beyond Gandy-Sieg) capturing "feasibility" or "physical realizability." | If successful, replaces Formal CT with a new standard. If not, reinforces Camp 2. |

  ---

  ### Your Refutability Test: A Decisive Diagnostic
  **"Could anything refute the thesis?"** reveals which version a camp endorses:

  - **Camp 1 (Historical CT)**:  
    - *Refuted by*: Discovery that pre-1936 mathematicians accepted non-Turing-computable methods (e.g., if Brouwer's choice sequences were seen as "effective").  
    - *Not refuted by*: Physical hypercomputation (irrelevant to historical practice).

  - **Camp 2 (Formal CT)**:  
    - *Refuted by*: Nothing—it's a definition. "Hypercomputation" is either incoherent or describes a non-computational process.  
    - *Response to alternatives*: "You're defining something else."

  - **Camp 3 (Physical CT)**:  
    - *Refuted by*: A physical device solving the halting problem (e.g., via Malament-Hogarth spacetime).  
    - *Not refuted by*: Formal redefinitions (irrelevant to physics).

  **Conclusion**: The camps persist because *all three positions are defensible within their frame*. Progress requires abandoning the monolithic "Church-Turing thesis" and specifying which question is at stake. The dispute is 80% verbal—but the remaining 20% hinges on empirical/historical facts about mathematical practice and physics, which *could* resolve sub-debates. Absent such discoveries, the camps will endure: their positions serve different purposes (historical fidelity, mathematical clarity, physical generality), and no "silver bullet" exists.

  ### Final Thought
  Your insight parallels Carnap's "explication": concepts evolve from vague pre-theoretic notions to precise technical tools. The CT-thesis debate is a paradigm case of explicatory growing pains. The camps aren't *wrong*—they're emphasizing different phases of the explicatory process. Recognizing this may not end the debate, but it clarifies why it persists and how to move forward.
