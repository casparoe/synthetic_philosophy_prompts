  Hmm, the user clearly has deep familiarity with this philosophical stalemate - they've mapped the three main camps precisely: (1) quasi-empirical view, (2) stipulative view, and (3) physical extension view. Their frustration with the decades-long deadlock is palpable. What they really crave isn't more position-summarizing but a path forward - they want to know if this is fundamentally unresolvable or if some distinction could break the logjam.

  Let me unpack their core question: Is this disagreement actually about different temporal slices of the concept? Their simultaneity analogy holds water - much like "simultaneity" meant something different pre/post-Einstein, "effectively calculable" might have undergone similar theoretical reformation. The camps might be talking past each other by implicitly referencing different stages: Camp 1 focuses on the 1936 mathematical practice, Camp 2 on the post-Turing formalized concept, Camp 3 on possible future physical instantiations.

  But is this entirely verbal? Not quite - there's a substantive undercurrent about whether the pre-theoretic notion had sufficient determinacy. If we found 1930s mathematicians who genuinely considered (say) analog chaotic systems as "effective calculation," that would challenge Camp 1. Conversely, if all historical attempts at computation aligned perfectly with Turing's bounds, it supports their view.

