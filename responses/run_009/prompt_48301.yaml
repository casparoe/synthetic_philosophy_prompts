answer: |-
  Your situation resonates deeply—that tension between academic frameworks and institutional practice is precisely where memory politics becomes visceral. Having examined our committee’s record, I believe your vote on Meridian Hall should lean toward **renaming**, though with critical nuance to align with precedent. Let me walk you through the reasoning.

  **The Precedent Closest to Calloway: Collier College**  
  Governor Calloway’s case echoes the Collier renaming most directly. Both involve figures whose wealth—directly tied to systemic oppression (convict leasing for Collier, segregation enforcement for Calloway)—funded university growth. The committee rejected Collier’s name because the endowment’s origin was inseparable from the university’s founding budget, rendering the honor ethically untenable. Similarly, Calloway’s governorship *defined* his public legacy; his scholarship, while laudable, functions as retrospective reparations, not absolution. Crucially, both honors memorialize power derived from oppression. The Averill Medal precedent reinforces this: direct complicity in discrimination (Averill’s segregation codes) outweighed his administrative contributions.  

  **Where Calloway Diverges—and Why It Fails to Save the Name**  
  The scholarship complicates matters, but not decisively. Unlike the WPA mural or stained-glass window—*artifacts* the committee contextualized rather than removed—Calloway’s name on Meridian Hall is an *active honorific*. The mural and window are historical documents; their preservation with annotation acknowledges complexity without endorsing ideology. Naming a building after Calloway, however, perpetuates a celebratory narrative. His scholarship, while transformative, does not neutralize his harm; it merely creates paradox. As with Collier, we cannot disentangle the "gift" from its oppressive roots. Keeping the name risks endorsing the "Lost Cause in reverse" critique: laundering reputations by emphasizing late-stage benevolence while obscuring foundational injustice.  

  **Voting for Consistency: Rename, but Decouple the Scholarship**  
  To vote consistently:  
  1. **Support renaming Meridian Hall**. Upholds the Collier/Averill principle: honors tied directly to oppression cannot stand, regardless of subsequent contributions.  
  2. **Propose decoupling Calloway’s name from the scholarship**. The scholarship’s impact is real and distinct; its beneficiaries should not bear the weight of his past. Rename it the "Meridian Scholars Program" or similar, retaining its mission. This mirrors the committee’s mural/window approach: contextualize harm without erasing history or collateral good.  

  **If the Record Underdetermines: Principles at Stake**  
  Should colleagues dispute this reading, the vote commits us to one of two paths:  
  - **Renaming** affirms the "German-style" principle: *honors require moral accountability; structural complicity negates celebratory commemoration*.  
  - **Retaining** shifts us toward "Japanese quietism": *preserve all history neutrally, trusting annotation to reconcile contradictions*. This would undermine Collier/Averill, suggesting renaming occurs only when figures lack countervailing "good."  

  **A Case to Clarify Our Rule: The Founders’ Plaza Statue**  
  Next semester, propose reviewing the 1940 Founders’ Plaza statue. It depicts the university’s first president, who championed "industrial education" for Black citizens—a paternalistic alternative to integration. Petitions likely exist to remove it; defenders cite his philanthropic work. This case *lacks* a clear redemptive element (like Calloway’s scholarship) but involves complex historical intent (unlike Collier/Averill).  

  **Why this reveals our true framework**:  
  - If we remove it, we’re German-style: rejecting honors for oppressive ideologies, regardless of era-relative context.  
  - If we contextualize it (plaques, counter-monuments), we’re hybrid: acknowledging harm while preserving physical history.  
  - If we keep it unchanged, we’ve defaulted to quietism—or worse, Lost Cause logic, where "philanthropy" excuses injustice.  

  Vote to rename Meridian Hall. It aligns with our hardest precedents, avoids moral laundering, and forces the committee to confront whether "context" applies only to art—or to honors themselves. Then, put the statue on the docket. Where we land will tell you, once and for all, whose memory politics we’re practicing.  

  Warmly,  
  A fellow traveler in the thickets of memory
