answer: |-
  ## Recommendation Memo: Decriminalisation of Consensual Adult Incest in Specified Circumstances

  **To:** Criminal Law Working Group Members  
  **From:** [Your Name], Seconded Member  
  **Subject:** Recommendation on Narrowing the Offence of Incest – The Case of X & Y  
  **Date:** [Date]

  **1. Concrete Recommendation:**  
  Based on the principles examined below and the specific facts of the test case (adult half-siblings, separated upbringing, no shared household history, one infertile, informed consent), **the Working Group should recommend narrowing the existing incest offence.** The law should be amended to **exclude criminal liability for consensual sexual relationships between adults** where *all* of the following conditions are met:
      *   (a) The parties are over the age of consent.
      *   (b) The relationship is demonstrably consensual (accounting for power dynamics inherent in familial roles).
      *   (c) The parties did not cohabit within the same household during the formative years (defined as under 18) of *either* party.
      *   (d) At least one party is permanently infertile, OR both parties utilize highly reliable, long-term contraception verified by medical consultation, OR the parties provide documented, legally binding undertaking against procreation.

  **2. Reasoning Grounded in Hart-Devlin & Harm Principle:**  
  The core tension here mirrors the Hart-Devlin debate: whether law should enforce shared morality *as such* (Devlin) or only prohibit conduct causing harm to others (Hart, building on Mill and the Wolfenden Report's rationale for decriminalising homosexuality).

  *   **Applying Hart/Harm Principle:** The specific circumstances of X & Y negate the primary harms traditionally used to justify incest laws:
      *   **Genetic Harm:** Rendered moot by infertility/effective contraception.
      *   **Harm to Family Unit/Upbringing:** Absent due to separate upbringing; no familial structure is disrupted.
      *   **Coercion/Abuse of Trust:** Significantly mitigated by adulthood, lack of shared formative history, and apparent genuine consent. The inherent power imbalance in familial relationships *is* a serious concern, but the specific facts (meeting as adults, separate lives) weaken its application here compared to intra-household cases.
      *   **Psychological Harm:** While complex and potentially present *for the individuals*, this is speculative and highly individualised. Criminalisation is a blunt tool for managing personal psychological distress absent demonstrable harm *to others* or *non-consensual* harm. Therapeutic support, not criminal sanction, is the appropriate response.
      *   **Conclusion (Harm Principle):** Where these specific safeguards (consent, separate upbringing, infertility/contraception) are demonstrably present, the state lacks a compelling *harm-based* justification for criminalisation. Liberty interests prevail.

  *   **Steel-manned Devlinian Position:** Lord Devlin argued society has a right to protect its fundamental shared moral fabric through law, as the dissolution of this shared morality could lead to societal disintegration. Incest prohibitions, he might contend, represent one such fundamental taboo essential to the stability of the family unit – society's foundational institution. The law's expressive function is crucial: declaring certain acts intolerable reinforces the norms that bind society together. Even absent *direct, measurable harm* in a specific case like X & Y, decriminalisation could:
      *   **Erode a Foundational Norm:** Normalising any form of incestuous relationship, however exceptional, risks undermining the powerful taboo protecting against far more prevalent and harmful intra-familial abuse (especially involving minors or dependent adults within households).
      *   **Signal Societal Acceptance:** The law's removal of sanction could be misinterpreted as societal approval, potentially confusing social norms and weakening the protective barrier against exploitation within traditional family settings.
      *   **Cause "Offence to Feelings":** While Devlin went beyond mere disgust ("feelings of intolerance, indignation, and disgust" held by "the right-minded man"), the deep-seated revulsion many feel towards incest *is* evidence of the moral principle's perceived fundamentality. Disregarding this widespread sentiment risks alienating citizens and diminishing respect for the law's moral authority.

  **3. Does the Devlinian Position Ultimately Reduce to "Ickiness"?**  
  Not entirely. While visceral disgust is a component, the steel-manned argument is about the *functional role* of the taboo in safeguarding the vulnerable family structure and preventing societal fragmentation. The concern is less about the specific feelings of individuals and more about the *symbolic and practical consequences* of abandoning a core prohibition perceived as foundational. However, **in this exceptionally narrow factual scenario**, the *practical* link between criminalising X & Y and preventing intra-household abuse is highly attenuated. The potential for societal disintegration seems dramatically overstated in response to such a rare, harm-mitigated case. The "expressive function" argument, while powerful in principle, risks becoming oppressive when applied inflexibly to consensual adults facing no tangible harm, solely to uphold a symbolic norm disconnected from its original harm-prevention rationale in *this* context.

  **4. Drawing the Line: A Principle for Future Cases**  
  The Commission should adopt the following principle to guide the boundary between law enforcing morality and law protecting people:  
  > **"The criminal law may prohibit consensual conduct between adults only where it can be shown to cause, or present a significant and demonstrable risk of causing, concrete harm to identifiable others (including societal structures essential for preventing harm to vulnerable individuals), and where criminalisation is a proportionate and necessary response to that harm."**  
  *   **Key Implications:**  
      *   **Burden of Proof:** Rests on justifying criminalisation by demonstrating harm/risk, not merely offence to sensibilities.
      *   **Concrete Harm:** Focuses on tangible harm (physical, psychological, exploitation) or demonstrable risk to societal structures (like protecting the family unit *as a shield against abuse*), not abstract moral decay.
      *   **Proportionality & Necessity:** Criminalisation must be the last resort; less intrusive measures (education, support services, civil remedies) should be preferred where possible.
      *   **Vulnerability Focus:** Reinforces that laws like incest prohibitions primarily target power imbalances and risks within *dependent* relationships (parent-child, guardian-ward, siblings raised together), not relationships between fully autonomous adults lacking those dynamics.

  **5. What Would Change My Mind?**  
  My reasoning hinges on the absence of demonstrable harm and the exceptional nature of cases like X & Y. I would reconsider my recommendation if presented with:

  1.  **Robust Empirical Evidence:** Data demonstrating that decriminalisation in *similarly narrow circumstances* (separate upbringing, infertility/contraception) leads to: (a) a measurable increase in intra-familial abuse cases (suggesting erosion of the protective taboo), or (b) significant, widespread psychological harm to the consenting adults involved beyond what occurs in other complex relationships.
  2.  **A More Compelling Harm-Based Argument for Symbolism:** A rigorous demonstration that the *symbolic force* of a blanket incest prohibition is *objectively necessary and uniquely effective* in preventing the vast majority of harmful intra-familial abuse, and that exceptions, however tightly defined, would critically undermine this deterrent or protective effect in a way less intrusive measures cannot address.
  3.  **Evidence of Coercion Masked as Consent:** Research or case data proving that claims of consent in adult "discovered relative" scenarios are frequently or inherently invalid due to subconscious familial pressures or psychological vulnerabilities specific to this dynamic, even without shared upbringing.
  4.  **Overwhelming Societal Consensus *as Harm*:** If widespread consultation revealed not just moral disapproval, but that knowledge of such lawful relationships caused *widespread, severe, and demonstrable social disruption or psychological distress* to the broader community akin to a public nuisance or threat to social stability.

  **Where I Might Be Wrong:**  
  My greatest vulnerability lies in potentially underestimating the **symbolic potency and practical necessity of the absolute taboo** as a protective societal barrier. I prioritise individual liberty and demonstrable harm, but perhaps the law's expressive function in this *specific* domain is irreplaceable for preventing the far greater harms of intra-familial exploitation, and any exception, no matter how narrow, is a dangerous crack in that dam. Alternatively, I may underestimate the **unique psychological complexities and potential for subtle coercion** even in "discovered relative" scenarios, making genuine, fully autonomous consent less achievable than I assume.
