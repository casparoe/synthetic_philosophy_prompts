  Below is a one-page decision tree designed to clarify positions on future contingents using concrete cases. Participants start by agreeing that past and present claims are true or false. Each node poses a plain-language question about a scenario, avoiding jargon until the leaves. Pairs of leaves the tree cannot separate are marked, and consistent paths leading to no named position are noted.

  ---

  **DECISION TREE: FUTURE CONTINGENTS**  
  *Start by agreeing: Statements about the past or present are either true or false (e.g., "It rained yesterday" or "The coin is in my hand now" must be true or false).*

  ### Case 1: The Coin Flip  
  A fair coin will be flipped tomorrow.  
  **Question 1:** Is the statement *"The coin will land heads tomorrow"* **either true or false right now**?  
  - **NO** → Go to **Case 2**.  
  - **YES** → Go to **Case 3**.  

  ### Case 2: The Disjunction  
  Consider: *"Either the coin will land heads tomorrow or it will land tails tomorrow."*  
  **Question 2:** Is this **true right now**?  
  - **NO** → **Denial of bivalence (Łukasiewicz/Aristotelian view)**: Future contingents lack truth values (neither true nor false). What will happen is genuinely open.  
  - **YES** → **Supervaluationism (or Growing Block)**: The disjunction is true because it must happen, but neither outcome is *yet* true/false. *(Note: The tree cannot distinguish Supervaluationism from Growing Block here. Both say the future is unreal/open but accept this disjunction as true.)*  

  ### Case 3: The Storm System  
  A storm has formed offshore. It *may or may not* hit Friday, and the present state (e.g., current weather patterns) does **not** determine if it will hit.  
  **Question 3:** If *"There will be a storm on Friday"* **is true right now**, does that mean the present state **forces** the storm to happen? (i.e., Is it impossible for the storm to miss?)  
  - **YES** → **Fatalism**: If true, the future is unavoidable. Truth requires present determination.  
  - **NO** → Go to **Case 4**.  

  ### Case 4: The General’s Decision  
  A general has **not yet decided** whether to attack tomorrow. But suppose the statement *"The general will order the attack tomorrow"* **is true right now**.  
  **Question 4:** Is it **still possible for the general to choose not to attack**?  
  - **YES** → **Ockhamism or Thin Red Line**: The statement is true/false now but doesn’t prevent free choices. Truth reflects what *will* happen, not what *must*. *(Note: The tree cannot distinguish Ockhamism from Thin Red Line. Both say truth is "soft" or about a privileged future branch.)*  
  - **NO** → **Fatalism**: Truth rules out alternative possibilities. The future is fixed.  

  ---

  ### Key Notes:  
  1. **Indistinguishable Positions**:  
     - **Supervaluationism vs. Growing Block** (Case 2-YES): Both accept the disjunction as true but deny truth values for specific outcomes. The tree cannot separate them with these cases.  
     - **Ockhamism vs. Thin Red Line** (Case 4-YES): Both allow truth without determinism or fatalism. The tree cannot separate them.  

  2. **Unoccupied Paths**:  
     - **Case 1-YES → Case 3-NO → Case 4-NO** leads to Fatalism (occupied).  
     - **All paths lead to a named position**. No consistent path is "empty" — the tree covers the logical space.  

  3. **Fatalism**: Appears in two paths (Case 3-YES *or* Case 4-NO). Both reflect the core idea: truth implies inevitability.  

  4. **What’s Missing?**  
     - **Theological cases** (e.g., God’s foreknowledge) are omitted to avoid complexity.  
     - **Branching-time semantics** (e.g., "many futures") is not directly tested, as it underpins several leaves (e.g., Supervaluationism/Thin Red Line).  

  ---

  **How to Use This Tree**: Answer the questions based on your intuitions about the cases. The "leaves" (bolded positions) show where your answers align with established philosophical views. Discuss why indistinguishable positions *might* differ (e.g., ontology of time), and why fatalism appears twice!  

