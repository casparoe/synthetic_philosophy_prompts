answer: |-
  Here's the complete exam package designed to push students beyond rote recitation and into conceptual critique:

  **1. Exam Question (Doable in 90 minutes, no outside sources)**

  > **Evaluate the "expanding circle" metaphor as a model of moral progress. Your evaluation should specifically address the following:**
  >
  > *   **Does the metaphor's core structure (a binary boundary separating those 'inside' moral consideration from those 'outside') accurately capture the nature of historical changes in moral concern? Could alternative models (e.g., seeing moral status as a matter of *degree* or *weight*, rather than simple inclusion) better explain phenomena often described as 'expansion'?**
  > *   **How does the metaphor handle the apparent shift over time in the *criteria* for inclusion (e.g., rationality, sentience, relational capacity)? Does this shift challenge the idea of simple 'expansion'?**
  > *   **Consider the 'endpoint' problem: If the circle expands indefinitely, encompassing all sentient beings with equal weight, it seems to demand equal concern for a stranger's minor discomfort and one's own child's significant suffering. Is this a fatal flaw for the circle model? If not, how might the model be modified or interpreted to avoid this counterintuitive result?**
  >
  > **Your answer should move beyond simply describing historical examples of expansion. Critically engage with the conceptual structure of the metaphor itself. Can it be successfully defended, modified, or must it be replaced?**

  **2. Model Answer (Approx. 600 words)**

  The "expanding circle" metaphor powerfully captures the intuition that moral progress involves extending concern to beings previously excluded. However, a critical evaluation reveals significant conceptual limitations that challenge its adequacy as a comprehensive model, particularly concerning its binary structure, static criteria, and problematic endpoint. Alternative models focusing on *weight* or *priority* might better explain historical change and avoid reductios.

  The metaphor's core weakness is its binary conception of moral status: entities are either 'in' (full consideration) or 'out' (no consideration). This struggles to explain historical realities. Consider attitudes towards animals in 1800. While rarely granted *full* moral status akin to humans (not 'in' the circle), they weren't treated with *zero* consideration ("out”). Laws against extreme cruelty existed, suggesting a low but non-zero *weight* in moral calculations. What looks like later "expansion" (e.g., animal welfare laws) might be better understood as an *increase in moral weight* assigned to beings already weakly considered, not a sudden transition from exclusion to inclusion. Similarly, historical attitudes towards women or enslaved peoples often involved complex hierarchies of partial consideration, not simple exclusion. A model based on a gradient of moral weight (e.g., 0 to 1) accommodates these nuances better than the rigid in/out binary, allowing for progress via *intensification* of concern for entities already marginally valued.

  Furthermore, the metaphor implicitly assumes a stable criterion for inclusion (e.g., rationality, humanity). Yet, the *basis* for inclusion has shifted dramatically. Early expansions often relied on shared humanity or rationality, but later inclusions (animals, future generations, ecosystems) appeal to sentience, potential for relationships, or intrinsic value – criteria fundamentally different from the original core. This isn't merely expanding the *scope* of a fixed criterion; it involves *redefining the characteristic that confers status*. The circle metaphor obscures this conceptual revolution, presenting it as quantitative growth rather than qualitative transformation.

  The endpoint problem starkly exposes the model's limitations. Indefinite expansion with equal weight inside the circle leads to the absurd demand for impartial concern between vastly disparate needs across immense social distances (e.g., a child's scraped knee vs. a stranger's hangnail). This reductio isn't just a challenge to impartialism; it's *structurally inherent* to the circle model if it insists on uniform weight post-inclusion. Simply calling it counterintuitive is insufficient; the model *generates* this counterintuitive result.

  Can the circle be salvaged? Modifications are possible but transform it significantly. Introducing a "decay function" – where moral weight diminishes with social, temporal, or biological distance – abandons the core idea of uniform concern within the circle. Alternatively, treating special obligations (e.g., to family) as a separate, justified layer *on top* of basic inclusion preserves the circle for baseline status but concedes that progress isn't *solely* about scope expansion and requires an independent account of partiality. However, these patches risk making the model ad hoc. While the circle powerfully illustrates the directionality of progress (inclusion is generally good), its inability to handle degrees of concern, shifting criteria, and the necessity of partiality suggests it is, at best, an incomplete heuristic. A more robust model would likely integrate a multidimensional view incorporating scope, weight, and the evolving grounds of moral status itself, moving beyond the simplicity of the circle.

  **3. Marking Scheme (Out of 20 Points)**

  *   **A Range (17-20):** Demonstrates sophisticated conceptual analysis. **Must contain:**
      *   **(Scope vs. Weight Distinction - 5 pts):** Explicitly identifies the binary in/out structure as a core limitation. Clearly articulates the alternative "weight/degree" model and provides a plausible historical or conceptual example demonstrating how phenomena described as "expansion" could be reinterpreted as "weight increase" (e.g., pre-existing weak animal concern). Explains the difference in *evidentiary basis* – what evidence would support expansion vs. weight increase?
      *   **(Shifting Criteria - 4 pts):** Critically discusses how the *bases* for moral status (rationality, sentience, etc.) have changed over time, arguing this represents a qualitative shift (redefinition) not merely quantitative expansion, and how this challenges the metaphor.
      *   **(Endpoint Problem & Model Defense - 5 pts):** Clearly articulates the partiality reductio (kid's knee vs. stranger's hangnail) **as a structural consequence of the circle model combined with uniform weight and indefinite expansion.** Doesn't just dismiss it as "counterintuitive." Seriously engages with potential modifications (e.g., decay functions, layered partiality) and evaluates their success/failure in rescuing the core metaphor, acknowledging the trade-offs (e.g., decay abandons uniform concern).
      *   **(Overall Synthesis & Originality - 3 pts):** Synthesizes these critiques coherently. Offers a balanced final evaluation (e.g., valuable heuristic but incomplete model). Writing is clear, concise, and logically structured.
  *   **B Range (13-16):** Demonstrates good knowledge but lacks deep conceptual engagement.
      *   Accurately describes the expanding circle concept and provides relevant historical examples.
      *   *May mention* "scope vs. weight" or "shifting criteria" but does not **clearly define the distinction** or provide a **concrete example demonstrating the weight alternative**. Treats them as minor addendums rather than fundamental critiques.
      *   *May mention* the partiality problem but frames it vaguely as "impartialism is too demanding" **without explicitly connecting it to the structural features of the circle model** (uniform weight + indefinite expansion).
      *   Discusses modifications superficially (e.g., "we can care more about family") without analyzing *how* this changes the model or its core assumptions.
      *   Relies heavily on recitation of the "standard story" with examples.
  *   **C Range (9-12):** Basic understanding but significant gaps or errors.
      *   Vague or inaccurate description of the expanding circle.
      *   Little to no engagement with the critiques specified in the question (scope/weight, shifting criteria, endpoint problem as structural flaw).
      *   Superficial treatment of partiality or modification ideas.
      *   Significant omissions or factual errors regarding historical examples.
  *   **D Range (5-8):** Demonstrates minimal understanding of the core concepts.
  *   **F Range (0-4):** Fundamentally incorrect or irrelevant.

  **Costly Mistakes (Automatic Cap / Significant Deduction):**

  *   **Treating the partiality reductio solely as "impartialism is counterintuitive" without explicitly linking it to the structure of the circle model (uniform concern + expansion) - (Cap at B-/C+ range, lose 3-4 pts).** *This is the key mistake you flagged.*
  *   **Failing to distinguish "scope expansion" from "weight increase" beyond just mentioning the terms - i.e., not providing an example or explaining what evidence would differ (Lose 3-4 pts).**
  *   **Ignoring the issue of shifting criteria for moral status entirely (Lose 3 pts).**
  *   **Merely listing historical examples without critically engaging the metaphor's structure (Cap at B range).**

  This package forces students into the conceptual weeds you identified, rewards critical analysis over recitation, and specifically penalizes the superficial treatments you anticipate. Good luck with grading season!
