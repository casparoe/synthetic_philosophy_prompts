prompt: |-
  I chair the board of a grant-making foundation established thirty years ago by a founder who died in 2019. The trust deed commits us to broad purposes — it speaks of relieving need and expanding opportunity — and leaves nearly everything else to the trustees' discretion. The founder also left a body of letters and interview transcripts in which he explained his thinking: he favored prevention over remediation, distrusted large institutions, wanted grants to reach people directly rather than through layers of administration, and expressed views about the deserving and undeserving poor that most of the board now finds repugnant and that were, in several cases, grounded in factual claims we know to be false.

  Our disagreements have stopped being about particular grants and have become about a deeper question: when the deed doesn't settle a proposal, whose judgment are we actually exercising? One faction says we should ask what the founder would say today if we could put the proposal to him. A second says we should apply his documented preferences as faithfully as museum conservators apply a restoration policy. A third — the position I find myself drifting toward — says both are wrong: we should ask what he would have concluded under conditions he never actually enjoyed: fully informed, free of his factual errors, required to make his values consistent with one another, and deliberating calmly rather than from grievance. If I understand the philosophical literature, this is roughly what is called indirect normativity: deriving what to do not directly, but from the output of an idealized deliberative process. And I understand it faces a known objection I want the procedure to confront rather than ignore: that the idealized founder becomes a screen onto which each trustee projects her own politics, so that consultation with the ideal turns out to be consultation with ourselves.

  What I need is a decision procedure the board can actually run, in a meeting, on any proposal the deed doesn't settle. It should specify: the questions to ask, in order; what counts as a sufficient answer to each; the point at which it returns "the deed settles it, apply the deed"; and the point at which it returns "founder's intent cannot be constructed here, decide on other grounds" — and I want that final branch to be real, not decorative. Above all, it must contain a step that tests for projection: some check the trustees can run to notice when the idealized founder has started agreeing with whoever is describing him.

  Then run it on three cases.

  1. A proposal to fund a conditional cash transfer program administered by a large international NGO. The founder distrusted large institutions and wanted money to reach people directly, but the transfers do reach people directly, and the evaluation evidence is strong. His letters never mention cash transfers; the first major trial postdates his death.
  2. A proposal to fund needle exchange. The founder would almost certainly have opposed this in writing — his letters on drug use are among the harshest things he left — but his opposition traces entirely to factual beliefs about addiction that are false, while his own most explicit principle, reducing preventable death, points the other way.
  3. A case where the procedure's answer will be one I dislike: the founder's documented preferences and his idealized ones come apart in favor of a restriction I would vote against, and I want the procedure to say so anyway rather than bend.

  Constraints: the board meets quarterly, and the procedure must run in fifteen minutes per proposal; no trustee has philosophy training beyond what we have picked up for this dispute; and the minutes must record which branch of the procedure decided each case, because our regulator asks how we exercised discretion.

  Please structure your response with the following sections, in this order and at roughly these lengths: "The procedure" — the steps, numbered, each with its sufficient-answer condition stated, about 600 words; "The three cases" — the procedure run on each, showing the projection check at work, about 450 words total; "Where judgment remains" — the points at which the procedure cannot decide and a trustee must, and what the minutes should say at those points, about 200 words; "What this procedure cannot do" — an honest accounting, including whether it genuinely answers the regulator's question or merely repackages board politics in founder-shaped language, about 200 words.
reasoning: |-
  Hmm, the user chairs a grant-making foundation board facing a profound ethical dilemma. The founder's trust deed is intentionally broad ("relieving need and expanding opportunity"), but his personal writings reveal problematic views that conflict with modern values and facts. The board is fractured over how to interpret founder intent, with three factions emerging: literalists, historical reconstructionists, and idealizers (the user's leaning toward "indirect normativity").

  The core challenge is operationalizing philosophical concepts into a practical 15-minute meeting procedure that: (1) prevents trustees from projecting their biases onto an idealized founder, (2) handles cases where founder preferences clash with evidence/ethics, and (3) maintains regulatory compliance by documenting decision rationales. The user specifically requests testing this on three thorny cases (cash transfers, needle exchange, and an "uncomfortable truth" scenario).

  Key constraints: quarterly meetings, no philosophy expertise, and transparency for regulators. The user's meta-concern seems to be legitimacy—whether any procedure can avoid being a fig leaf for trustee preferences. They're intellectually honest about this, explicitly asking the procedure to surface disagreements rather than mask them.

  For the procedure design, I'm considering a tiered approach: first screen for deed coverage, then historical intent, then move to idealized deliberation only when necessary. The projection check is critical—it needs to be more than tokenism. I'm thinking of using "red flags" like unanimity on controversial topics or selective evidence weighting as measurable indicators.

  The three test cases perfectly triangulate the tensions: 
  - Case 1 (cash transfers) tests whether institutional distrust should override direct beneficiary impact
  - Case 2 (needle exchange) probes whether factual errors invalidate stated principles
  - Case 3 must deliberately force acceptance of a founder-preference the user dislikes, proving the system's integrity

  For regulatory compliance, minutes must clearly distinguish when decisions come from deed vs. reconstructed intent vs. trustee discretion. The "where judgment remains" section should acknowledge that some gaps require pure trustee judgment—and that's legally acceptable if properly documented.

  The hardest trade-off is rigor vs. time: philosophers might spend years debating idealized deliberation, but we have 15 minutes. So the procedure must use heuristics like "would the founder reject this if shown RCT evidence?" rather than open-ended moral reasoning.

  Ultimately the user needs more than a decision tree—they need institutional legitimacy. So the procedure should end by asking "Could we defend this rationale to the founder's ghost AND to his most vocal critics?" If not, it's likely projection.
answer: |-
  ## The Procedure

  This 15-minute, 6-step procedure uses founder documents as primary evidence, prioritizes the deed, and forces explicit confrontation with projection. It assumes trustees have pre-read the proposal and relevant founder documents.

  1.  **Deed Check (2 mins):**
      *   **Question:** Does the proposal *clearly* violate or fulfill the deed's express purposes ("relieving need," "expanding opportunity")? Cite specific deed language.
      *   **Sufficient Answer:** YES (Violates/Fulfills): Stop. Decision made by deed. Record: "Deed mandates/forbids this proposal." NO (Deed is silent/ambiguous): Proceed to Step 2.
      *   *Purpose:* Anchors in the legally binding document. Avoids unnecessary founder intent debate.

  2.  **Direct Historical Intent (3 mins):**
      *   **Question:** Does unambiguous, specific evidence in the founder's *documents* (letters, transcripts) directly address *this specific type* of proposal or its core elements (recipient type, method, scale, institution)?
      *   **Sufficient Answer:** YES (Clear Approval/Opposition): Stop. Decision made by documented intent. Record: "Founder's documented intent mandates/forbids this proposal." NO (No direct evidence or ambiguity): Proceed to Step 3.
      *   *Purpose:* Honors explicit wishes where they exist. Limits over-interpretation.

  3.  **Relevant Documented Principles (3 mins):**
      *   **Question:** What relevant principles, preferences, or aversions are *explicitly stated* in the documents? (e.g., "distrust large institutions," "favor prevention," "reach people directly"). List verbatim quotes.
      *   **Sufficient Answer:** A list of specific, cited principles relevant to the proposal's key aspects (e.g., institution size, intervention type, delivery mechanism). Proceed to Step 4.
      *   *Purpose:* Identifies the raw material for reconstruction, grounded in evidence.

  4.  **Idealized Reconstruction (4 mins):**
      *   **Question:** Applying the principles from Step 3, what would the founder likely conclude if:
          *   He knew *all relevant, verified facts* about this proposal (including modern evidence, evaluation data, context).
          *   He was freed from any *known factual errors* evident in his writings.
          *   He was required to make his *stated principles consistent* with each other and the deed.
          *   He deliberated *calmly*, free from documented personal grievances?
      *   **Sufficient Answer:** A reasoned conclusion ("likely approve," "likely oppose," "ambiguous") *based solely on applying the cited principles under the idealized conditions*. Must reference specific principles and how facts/consistency/calm alter the historical view. Proceed to Step 5 (Projection Check).
      *   *Purpose:* Attempts indirect normativity – deriving intent from idealized deliberation on *his* principles.

  5.  **Projection Check (2 mins):**
      *   **Question:** Does the reconstructed conclusion (Step 4) show any of these "Red Flags"?
          *   **Unanimity on a complex point:** Are trustees *too easily* agreeing despite known historical complexity?
          *   **Ignoring contrary principles:** Are key documented principles inconvenient to the conclusion being ignored?
          *   **Over-reliance on "calm deliberation":** Is this being used excessively to override *multiple* strong documented preferences?
          *   **"Would want progress":** Is "he'd want us to be modern" the *primary* justification?
          *   **"Mirroring":** Does the reconstructed founder's view perfectly mirror the *current* dominant political/social view of the board majority on unrelated matters?
      *   **Sufficient Answer:** NO RED FLAGS: Accept Step 4 conclusion. Record: "Idealized reconstruction of founder's principles mandates/forbids/supports this proposal." **ONE OR MORE RED FLAGS:** Proceed to Step 6. *Purpose:* Forces trustees to spot when idealism masks projection.

  6.  **Trustee Discretion (1 min):**
      *   **Question:** How should the foundation best fulfill its *deed purposes* ("relieving need," "expanding opportunity") in this specific case, given the failure to construct reliable founder intent?
      *   **Sufficient Answer:** Trustee vote based on their best judgment of the foundation's mission under the deed. Record: "Deed purpose applied via trustee discretion: Approved/Rejected."

  ---

  ## The Three Cases

  1.  **Conditional Cash Transfer via Large NGO:**
      *   Step 1: Deed silent (relieves need/expands opp? Ambiguous).
      *   Step 2: No direct evidence (cash transfers post-date him).
      *   Step 3: Principles: Distrust large institutions ("bloated, inefficient"), Reach people directly ("cut out the middleman").
      *   Step 4: Idealized: Knows transfers *do* reach people directly (verified) & evidence is strong. Principle "reach directly" is satisfied. Distrust of institutions remains, but principle is not absolute; effectiveness evidence counters inefficiency concern. Calm deliberation weighs direct impact + evidence vs. institutional aversion. *Likely Approval*.
      *   Step 5: Projection Check: **Red Flag?** "Ignoring contrary principles"? Distrust is strong, but countered by direct reach evidence. "Unanimity"? Possibly, but grounded in specific evidence overriding one principle. **No Strong Red Flag**. **Decision:** Approve (Idealized Reconstruction).

  2.  **Needle Exchange:**
      *   Step 1: Deed silent.
      *   Step 2: Direct evidence? His writings condemn drug use harshly ("moral failing," "weakness"). Implicit strong opposition to anything seen as enabling.
      *   Step 3: Principles: Reduce preventable death ("a core duty"), Harsh judgment on drug use/addiction ("self-inflicted," "undeserving").
      *   Step 4: Idealized: Freed from false facts (addiction as moral failing vs. disease). Knows needle exchange drastically reduces death/disease transmission. Principle "reduce preventable death" becomes paramount. Calm deliberation prioritizes saving lives over moral judgment when facts change. *Likely Approval* (despite historical opposition).
      *   Step 5: Projection Check: **Red Flags?** "Ignoring contrary principles"? The moral judgment principle *is* overridden, but based on factual error correction *and* prioritizing his explicit core principle (prevent death). "Mirroring"? Board's modern view aligns, but justification is tied tightly to *his* principle + corrected facts. **No Strong Red Flag**. **Decision:** Approve (Idealized Reconstruction).

  3.  **The Uncomfortable Case (e.g., Funding Job Training Only for Non-Offenders):**
      *   Step 1: Deed silent (could arguably fit "opportunity").
      *   Step 2: Direct evidence? Founder writings explicitly state belief that formerly incarcerated are largely irredeemable/undeserving, oppose "rewarding criminals."
      *   Step 3: Principles: "Deserving vs. undeserving poor" (with specific groups cited), Expanding opportunity ("for those willing to work").
      *   Step 4: Idealized: Freed from false facts? (Assume facts show recidivism drops with opportunity). Make principles consistent? "Expanding opportunity" conflicts fundamentally with immutable "undeserving" category for ex-offenders. Calm deliberation? May lessen harshness, but core belief in categorical undeservingness might persist even with facts, conflicting with deed's breadth. *Likely Opposition* to funding ex-offenders.
      *   Step 5: Projection Check: **Red Flags?** "Ignoring contrary principles"? Board might *want* to ignore "undeserving" label, but it's explicit and core here. "Over-reliance on calm deliberation"? Not sufficient to override such a specific, strongly held documented preference. "Mirroring"? Board's modern view likely opposes, but reconstruction points to opposition. **Potential Red Flag**: If trustees *insist* idealized founder approves *despite* strong documented aversion and lack of clear factual error correction *on the moral judgment itself*. **Red Flag Tripped** (Ignoring contrary principle / forcing approval via "calm"). **Decision:** Proceed to Step 6 (Trustee Discretion). Trustees vote based on deed purposes. *Result likely:* Approve (discretion), but **Record:** "Trustee discretion applied: Approved." *Founder's idealized intent construction failed projection check.*

  ---

  ## Where Judgment Remains

  Judgment is explicitly required in Step 6 (Trustee Discretion). It may also be needed subtly within Steps 4 and 5:
  *   **Step 4 (Idealized Reconstruction):** Trustees must *judge* how the founder would weigh potentially conflicting principles under idealized conditions. The procedure forces evidence-based reasoning, but the synthesis involves judgment.
  *   **Step 5 (Projection Check):** Identifying a "Red Flag" involves *judgment* about whether the reconstruction ignores evidence, overrides core principles arbitrarily, or mirrors politics. The flags are prompts, not algorithms.

  **Minutes Recording:**
  *   For Steps 1, 2, or 4/5 (No Red Flag): Clearly state which step decided and the basis (e.g., "Deed mandates rejection," "Documented founder intent forbids," "Idealized reconstruction supports").
  *   **For Step 6 (Discretion):** State: "Trustee discretion applied under deed purposes: [Approved/Rejected]." **Crucially, add:** "Founder's intent could not be reliably constructed [due to lack of evidence / irreconcilable conflict / projection risk]." This satisfies the regulator by showing *why* discretion was used.

  ---

  ## What This Procedure Cannot Do

  1.  **Eliminate Disagreement or Judgment:** It structures debate but doesn't remove trustees' need to interpret principles, weigh evidence, and judge projection risks. Disagreements in Step 4 will occur.
  2.  **Resolve Fundamental Value Conflicts:** If the founder's *core values* (e.g., categorical "undeserving poor") fundamentally conflict with modern ethics or the deed's breadth, Step 6 discretion becomes necessary. The procedure surfaces this conflict but doesn't magically resolve it.
  3.  **Guarantee "True" Intent:** Idealized reconstruction is inherently speculative. We can never *know* what the founder *would* have thought. This procedure only seeks the *most reasonable, evidence-based, projection-mitigated* inference.
  4.  **Fully Answer the Regulator?** It provides a *structured rationale* for decisions, clearly distinguishing when deed, documented intent, reconstructed intent, or pure discretion was applied. This is significantly better than unstructured politics. **However, the "founder-shaped language" risk remains:** A determined board could manipulate Steps 4 & 5 to cloak their views. The projection check is a guardrail, not a guarantee. The minutes' requirement to state *why* discretion was used (e.g., "projection risk") provides crucial transparency for the regulator, showing awareness of the limitation. It doesn't eliminate politics but forces them into a structured, auditable framework with clear off-ramps to discretion when founder intent is truly unrecoverable or problematic.
