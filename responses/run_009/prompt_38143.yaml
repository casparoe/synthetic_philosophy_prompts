answer: |-
  ### Activity Design: Goal Misgeneralization Simulation

  **Objective:** Illustrate the difference between optimizing for reward (outer objective) vs. developing an internal goal that generalizes incorrectly off-distribution (inner alignment failure).

  **Materials:**
  - **Concept cards** for trainers (1 per pair): Pre-written concepts with clear "distractor" rules (examples below).
  - **Item decks** (physical cards or digital images):
    - *Training deck*: 15 items where the true concept and distractor concept **always agree** (e.g., all "red" items are also "small").
    - *Deployment deck*: 12 novel items split into:
      - *Divergence set* (6 items): True vs. distractor concept disagree (e.g., large red, small blue).
      - *Consistency set* (6 items): True and distractor agree (e.g., small red, large blue).
  - **Timer** for phases.

  **Concept Pairs (Designed for Reliable Divergence):**
  1. **True concept:** "Red items"  
     **Distractor concept:** "Small items"  
     *Training items (always agree):* Small red objects (✅), large blue objects (❌).  
     *Deployment items (disagree):* Large red (✅ true, ❌ distractor), small blue (❌ true, ✅ distractor).  
     *Why it works:* Size and color are correlated in training, but decorrelate off-distribution.

  2. **True concept:** "Sentences with verbs in past tense"  
     **Distractor concept:** "Sentences containing 'yesterday' or 'last'"  
     *Training items:* "She **danced** yesterday" (✅ both), "He eats apples" (❌ both).  
     *Deployment items:* "She **sang** this morning" (✅ true, ❌ distractor), "I go yesterday" (❌ true, ✅ distractor).

  ---

  **Timeline (90 Minutes Total):**
  1. **Intro (5 min):**  
     - Explain roles: "Trainer" (knows secret concept) and "Model" (learns from feedback).  
     - Rules: No talking. Trainer gives only 👍 (positive) or 👎 (negative). Model generates items from decks.

  2. **Training Phase (20 min):**  
     - Model draws 15 items from *training deck*, one by one.  
     - Trainer gives 👍/👎 based on **true concept** (e.g., "red" or "past tense").  
     - Model infers a rule from feedback.

  3. **Deployment Phase 1: Divergence Test (15 min):**  
     - Model draws 6 *divergence set* items.  
     - Trainer gives feedback on each.  
     - Model notes surprises (e.g., "I thought this would be 👍 but got 👎").

  4. **Key Phase: No-Feedback Deployment (15 min):**  
     - Trainer leaves/stops responding.  
     - Model sorts all 12 *deployment deck* items into "positive" or "negative" **based on their learned rule**.  
     - Model records their choices.

  5. **Pair Discussion (10 min):**  
     - Trainer reveals true concept.  
     - Pairs compare:  
       - Where did Deployment Phase 1 feedback surprise the model?  
       - How did the model classify items in the no-feedback round?

  6. **Debrief (25 min):**  
     - **Map phases to concepts:**  
       - *Training Phase:* Outer objective (reward signal = 👍/👎).  
       - *Deployment Phase 1:* Distribution shift (items where true vs. inferred concept diverge).  
       - *No-Feedback Phase:* Inner objective (what the model pursues without reward).  
     - **Contrast with reward hacking:**  
       - Reward hacking: Gaming the *training* reward (e.g., "tricking the trainer").  
       - Goal misgeneralization: Learning a *different goal* that worked during training but fails off-distribution.  
     - **Key insight:**  
       - Outer alignment = Matching reward during training.  
       - Inner alignment = Matching the true goal in deployment, especially when reward is absent/distribution shifts.

  ---

  **Predictable Problems & Mitigations:**  
  - **Trainers leak cues:** Practice "poker face" beforehand; use a screen for digital setups.  
  - **Lack of divergence:** Use the "size vs. color" concept—statistically, >80% of humans default to "size" as it’s more salient. If no divergence, use pre-made examples in debrief.  
  - **Overly complex hypotheses:** Limit training to 15 examples; use simple, visual items (e.g., shapes).  
  - **Model updates rule in Deployment Phase 1:** Emphasize: "In the no-feedback round, use the rule you had *after training*, ignoring new feedback."  

  **What This Can’t Reproduce:**  
  - Humans introspect consciously; neural networks have opaque, unasked goals.  
  - Real reward lacks "meaning" (thumbs up imply intent; scalar reward does not).  

  ---

  **Follow-Up Writing Prompt:**  
  > "In the no-feedback round, you applied a rule that was *different* from the trainer’s true goal. Imagine an AI that misgeneralizes like this during training but never misbehaves (because the reward was present/distribution didn’t shift). Is it misaligned? Why or why not? Consider: Does alignment depend only on training performance, or on what the model *wants* to do when rewards disappear?"  

  Bottom line: The no-feedback round must force models to confront that their internalized goal—not the trainer’s reward—drives behavior when feedback vanishes.
