  The scoring of solution families will be brutally brief as requested, focusing on how they fare against the criteria rather than detailed exposition. Quine-style dissolution approaches will likely fail requirement 1 and 2, while epistemic blindspot theories might struggle with 5.

  Important to flag that requirement 3 (about the penultimate evening) and 4b (probabilistic variant) might be inherently incompatible with requirement 1 in some frameworks - that's a key instability. Also requirement 5 could conflict with 3 if we need strong KK principles.

