prompt: |-
  i'm a PhD student in HPS and I record a small podcast where philosophers have to defend their own actual views, not just survey the field for listeners. Next episode my guest is a philosopher who has spent her career on the selective realist reply to the pessimistic meta-induction -- the divide et impera move, where the claim is that the parts of past theories that did the real predictive work (the optical structure Fresnel got right, say) survived into the successor theory, while the idle machinery (the ether as a mechanical medium) got rightly dumped. Episode runs about 40 minutes, she's explicitly agreed to take hard questions, and my audience is mostly other grad students who know the textbook version already, so I want questions that hit the actual pressure points instead. I need at least one question each on:

  - the hindsight problem: she marks off the working posits using the very fact of what survived, so how is her decomposition anything more than reading the answer off the back of the book? And I want the follow-up to be keyed to her likely reply, which is that there were criteria available at the time for telling working from idle parts, criteria that don't peek at the future.
  - whether the view can survive a case where the abandoned part wasn't idle at all but did genuine novel predictive work -- phlogiston is the obvious candidate, but I'd let her choose her own case if she'd rather.
  - the circularity charge: she says truth is the only explanation of predictive success, but that inference is itself an induction over past cases, which is exactly the kind of induction the pessimistic meta-induction poisons. What do I ask next if her answer is that the two inductions just cancel out and realism then wins on the no-miracles side?

  Then one more adversarial question to close with: if the trimming job has to get this fine-grained, has she actually protected scientific realism, or has she quietly retreated to a position a structural realist could sign onto with no complaints -- and does she count that as a concession or a win? Bonus if you can work in a question where she has to stick her neck out about a current theory: which parts of today's physics does her criterion say will still be around in a hundred years, and what does her view cost her if history proves her wrong about that.

  Keep the phrasing conversational, like something I'd actually say to a guest, not like reading a checklist at her. And dont ask her to define basic terms -- my listeners know what the PMA and the no-miracles argument are, they just havn't seen anyone made to defend the details.
reasoning: |-
  Okay, the user is a PhD student in HPS preparing for a podcast episode with a philosopher specializing in selective realism. The main challenge is crafting pointed, adversarial questions that go beyond surface-level discussions, targeting the pressure points of her position. 

  First, I need to unpack the core tensions she'll face: the hindsight problem (accusations of retroactive cherry-picking), abandoned-but-successful components (like phlogiston), circularity in justifying truth via success, and whether her view collapses into structural realism. The audience is grad students familiar with the basics, so questions must avoid definitions and cut straight to philosophical nerves.

  For the hindsight problem, the key is anticipating her likely defense—that historical actors had contemporaneous criteria for distinguishing "working" from "idle" parts—and pressing whether those criteria were truly reliable or just post-hoc rationalizations. Phrasing matters: it should sound conversational but trap her in admitting either arbitrariness or reliance on future knowledge. 

  The phlogiston case needs framing as a direct counterexample: if an abandoned posit generated novel predictions, doesn't that break her survival thesis? Letting her choose an alternative case is strategic—it forces engagement without letting her dodge—but I'll emphasize demanding why *any* such case wouldn't cripple her view. 

  On circularity, if she argues the "no-miracles" induction cancels the pessimism of meta-induction, the follow-up must question why one induction is privileged. The deeper worry is whether *any* inductive defense of realism can escape this loop. Keep the tone sharp but not hostile—"help me understand" softens the challenge. 

  The structural realism comparison is the kill shot. If her selective survival only preserves structure (like Fresnel's equations), hasn't she conceded the game? Bonus points for making her stake her reputation on current theories. The "neck out" question risks embarrassment but raises stakes compellingly. 

  Throughout, avoiding jargon traps is crucial. No "as you know" filler—assume competence but demand rigor. The closing question about cost of being wrong ties it all together: if her predictions fail, does selective realism become unfalsifiable? That’s the real mic-drop moment.
answer: |-
  Here's a set of sharp, conversational questions hitting the pressure points you want, phrased for a podcast dialogue with an expert guest who's ready for a fight:

  1.  **On the Hindsight Problem:**
      *   "Alright, let's start with the elephant in the room: the 'hindsight bias' charge. Critics often say your method of identifying the 'working posits' – like Fresnel's equations – feels like you're using the *future success* we *now know about* to decide what was truly essential back then. It looks like reading the historical answer key. You've argued there were *contemporaneous* criteria – things scientists *at the time* could use to separate the wheat from the chaff, without peeking ahead. Can you walk us through *exactly* what those criteria were for, say, Fresnel? And crucially, were those criteria *reliable guides* at the time? Could a scientist using them *consistently* pick out *only* what would survive, and *avoid* picking bits that seemed 'working' then but we now know were doomed?"

  2.  **On Abandoned-but-Successful Parts (e.g., Phlogiston):**
      *   "Moving to a different kind of challenge: the case where a posit *did* seem to do genuine, novel predictive work, but got abandoned anyway – and arguably *should* have been abandoned. Phlogiston's a classic example – it successfully predicted new metals could be made from calxes, or that plants restored 'injured air'. *By your lights*, was phlogiston a 'working posit' for the phlogiston theorists? If so, how does its eventual rejection square with the idea that working posits survive? If not, *why not*? What's your criterion doing here that excludes phlogiston *despite* its apparent predictive successes? Feel free to pick another case if you prefer, but I'm really interested in how your view handles something that *wasn't* idle machinery but still got tossed."

  3.  **On Circularity & Induction:**
      *   "Let's tackle the meta-level worry about justification. You rely on the No-Miracles Argument: the predictive success of science is best explained by the truth (or approximate truth) of the successful parts. But the *inference* behind the NMA itself seems like an induction: 'Past successful theories had true bits, so current successful theories likely have true bits too.' The Pessimistic Meta-Induction, however, says inductions over past theories *fail* because they were largely false. It feels like these two inductions are locked in a tug-of-war. If your answer is that they cancel out and realism wins because the NMA is *the best explanation*, help me understand: *Why* does the NMA induction get priority here? What breaks the stalemate in favor of realism, given the PMA's historical counterexamples? Isn't privileging the NMA induction just question-begging against the anti-realist?"

  4.  **The Structural Realism Question & Sticking Neck Out (Adversarial Close):**
      *   "Stepping back for the big picture: Your 'divide et impera' move requires incredibly fine-grained ontological surgery – preserving specific equations or structural relationships while jettisoning the underlying entities or mechanisms that originally housed them. When you preserve Fresnel's equations but ditch the mechanical ether, or the quantum formalism while being agnostic about interpretations... doesn't this start looking *suspiciously* like what the Structural Realist claims? They preserve the structure, the relations, the equations – which is *exactly* what survives across theory change according to your view. So, have you actually defended a robust scientific realism about *entities*, or have you strategically retreated to a position where Structural Realism is the *real* winner? Is this a concession, or do you see it as a win for a *refined* realism?"
      *   **Bonus Neck-Out Question:** "And since we're being bold... let's apply your criterion *prospectively*. Take a current, high-stakes theory like the Standard Model of particle physics. Using your *contemporaneous* criteria – no peeking! – which specific parts, which posits or structures, does your view commit you to saying are *most likely* to survive the next major revolution? And conversely, what's the *cost* to selective realism if, a hundred years from now, history shows you were dead wrong about one of those core commitments?"

  **Key conversational elements used:**

  *   **Direct Phrasing:** "Elephant in the room," "Critics often say," "Walk us through *exactly*," "Crucially," "How does that square with," "Let's tackle the meta-level worry," "It feels like," "Help me understand," "Stepping back," "Suspiciously like," "Let's apply your criterion *prospectively*," "Since we're being bold."
  *   **Anticipating Replies:** Explicitly referencing her likely defense ("contemporaneous criteria") and then pushing on *its* reliability. Framing the circularity question around the "tug-of-war" and her potential "cancel out" response.
  *   **Case-Driven:** Anchoring questions in specific historical examples (Fresnel, Phlogiston) and demanding application (Standard Model).
  *   **Adversarial Edge:** "Fine-grained ontological surgery," "Suspiciously like," "Retreated," "Sticking your neck out," "Cost... if history shows you were dead wrong."
  *   **Assumed Knowledge:** References to PMA, NMA, Fresnel, ether, phlogiston, structural realism, Standard Model are made without definition.
  *   **Flow:** Starts with core objection (hindsight), moves to counterexample (phlogiston), tackles foundational worry (circularity/induction), then hits the big-picture implication (structural realism) and future commitment (neck out).

  **Why this works:**

  *   It goes straight to the live philosophical debates within selective realism, not textbook summaries.
  *   It forces her to defend the *mechanism* of her view (contemporaneous criteria), its *scope* (handling phlogiston-like cases), its *justification* (circularity), and its *implications* (relation to structural realism).
  *   The "neck out" question is high-risk/high-reward, making for a compelling podcast moment.
  *   The phrasing is confrontational but respectful and professional – suitable for a guest who agreed to "hard questions" and an audience of peers.

  Good luck with the episode! This sounds like a fantastic discussion.
