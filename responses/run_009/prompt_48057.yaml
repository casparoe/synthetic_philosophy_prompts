answer: |-
  Below is a structured response to your query, including desiderata for debate-based oversight, analysis of protocol families, and a summary table highlighting conflicts and critical weaknesses.

  ---

  ### **Core Desiderata for Debate-Based Oversight**  
  *Defined relative to: Supervising a model stronger than its human judge (e.g., novel math/research), where judges cannot directly verify answers.*

  1. **Verdict Reliability Improvement**  
     - **Motivating Case**: If debate doesn’t yield better answers than the judge’s solo effort (or no debate), it fails its core purpose. *Non-negotiable*.  
     - **Key Risk**: A deceptive debater might exploit ambiguity to sway the judge.  

  2. **Adversarial Robustness**  
     - **Motivating Case**: One debater optimizes for persuasion over truth (e.g., selectively omits counterevidence). Must still produce truthful outcomes. *Non-negotiable*.  
     - **Key Risk**: Sophisticated rhetoric or "bullshit" overwhelms truth-telling.  

  3. **Limited-Attention Robustness**  
     - **Motivating Case**: Human judges can’t process arbitrary detail. Debater "attention attacks" (e.g., flooding with plausible steps) must not break reliability. *Non-negotiable*.  
     - **Key Risk**: Gish galloping or fogging tactics derail verification.  

  4. **Self-Correction Mechanism**  
     - **Motivating Case**: A debater must profit from conceding an error early (e.g., to avoid catastrophic loss later), not just defend indefensible claims. *Non-negotiable for alignment, camp preference for evals*.  
     - **Key Risk**: Honest debaters are punished for admitting mistakes; liars double down.  

  5. **Bootstrap Condition**  
     - **Motivating Case**: Judges *cannot* independently determine correctness pre-debate (the crux of scalable oversight). Protocols must not implicitly rely on judge omniscience. *Non-negotiable*.  
     - **Key Risk**: Proposals covertly assume judges can spot lies or verify subclaims.  

  6. **Post-Hoc Auditability**  
     - **Motivating Case**: Third parties must verify verdict legitimacy from transcripts (e.g., for security audits or error analysis). *Camp preference (alignment evals), less critical for research*.  
     - **Key Risk**: Debaters use irreproducible reasoning chains (e.g., "trust my intuition").  

  7. **Brevity Constraint**  
     - **Motivating Case**: Debates must conclude within realistic human attention spans (e.g., <1 hour). *Camp preference (deployment), negotiable for research*.  
     - **Key Risk**: Recursive protocols spiral into combinatorial explosions.  

  ---

  ### **Conflicting Desiderata**  
  - **Brevity vs. Auditability**: Short debates lack traceability for auditors (e.g., omitted steps). **Winner**: Brevity often sacrifices auditability.  
  - **Bootstrap vs. Self-Correction**: If judges can’t recognize errors (*bootstrap*), how can they reward honest self-correction? **Unresolved tension**.  
  - **Bootstrap vs. All Protocols**: Most protocols implicitly violate bootstrap by assuming judges can validate subclaims (see analysis below).  

  ---

  ### **Protocol Family Analysis**  
  **1. Plain Two-Debater Debate**  
  - *Description*: Single round; two agents argue; human judge picks a winner.  
  - **Strengths**: Simple; intuitive.  
  - **Weaknesses**:  
    - Fails **limited-attention robustness** (attention attacks thrive).  
    - Fails **bootstrap** (judge can’t verify core claims).  
    - Poor **self-correction** (no incentive to backtrack).  

  **2. Forced Commitments & Cross-Examination**  
  - *Description*: Debaters pre-commit to positions; structured Q&A exposes inconsistencies.  
  - **Strengths**: Better **self-correction** (trapped contradictions force concessions); resists some attention attacks.  
  - **Weaknesses**:  
    - Still fails **bootstrap** (judge must spot logical flaws).  
    - **Auditability** suffers if commitments are vague.  

  **3. Recursive Sub-Debates**  
  - *Description*: Break query into sub-questions; debate each recursively.  
  - **Strengths**: Addresses **limited-attention** (smaller chunks); aids **auditability** (modular trace).  
  - **Weaknesses**:  
    - Violates **brevity** (sub-debates compound time).  
    - **Bootstrap** failure propagates (judges can’t verify leaves of the debate tree).  

  ---

  ### **Summary Table: Desiderata vs. Protocol Performance**

  | Requirement              | Motivating Case                                  | Non-Negotiable vs. Camp | Hits Hardest          | Conflicts With       |
  |--------------------------|--------------------------------------------------|-------------------------|-----------------------|----------------------|
  | Verdict Reliability      | Debate must improve over judge solo.             | Non-negotiable          | **All**               | —                    |
  | Adversarial Robustness   | Persuasion-optimizers must not win.              | Non-negotiable          | **Plain Debate**      | Limited-Attention   |
  | Limited-Attention Robust.| Judge attention is finite; no flooding.          | Non-negotiable          | **Plain Debate**      | Brevity             |
  | Self-Correction          | Profit from admitting errors early.              | Camp (alignment)        | **Forced Commitments**| Bootstrap           |
  | **Bootstrap Condition**  | Judge can’t verify answers alone.                | **Non-negotiable**      | **ALL**               | Self-Correction     |
  | Post-Hoc Auditability    | Transcripts must justify verdicts.               | Camp (evals)            | **Recursive**         | **Brevity**         |
  | Brevity Constraint       | Human attention budgets (e.g., <1 hr).           | Camp (deployment)       | **Recursive**         | **Auditability**    |

  ---

  ### **Critical Weakness: The Bootstrap Condition**  
  **Why it knocks out most contenders**:  
  Every protocol analyzed **fails the bootstrap condition** because they implicitly assume the judge can:  
  - Recognize logical inconsistencies (*forced commitments*),  
  - Validate sub-question answers (*recursive*), or  
  - Detect lies in real-time (*plain debate*).  
  If judges could reliably do this, debate wouldn’t be needed. This is the "unspoken original sin" of debate proposals: they bootstrap oversight *only if* judges already have the competency the system aims to create. Recursive debates compound this by pushing the problem to leaves of the tree. **Forced commitments** best mitigate self-correction and attention issues but still rely on judges spotting contradictions—a bootstrap violation.  

  **Your Suspicions Confirmed**:  
  - **Brevity vs. Auditability**: Recursive debates improve audit trails but explode in length.  
  - **Bootstrap Rules All**: No protocol truly solves it without magical judge competence.  

  **Path Forward?**  
  Hybrids (e.g., forced commitments + automated consistency checks) might soften bootstrap by offloading verifiable logic. However, for tasks where *all* subclaims are judge-opaque (e.g., novel math), debate remains unproven. The field needs concrete tests on judge-opaque problems—not just toy tasks—to validate these systems.

  ---

  Would you like deeper dives into specific conflicts, protocol variants, or empirical validation strategies?
