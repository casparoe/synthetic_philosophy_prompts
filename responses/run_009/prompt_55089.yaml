prompt: |-
  I'm part of the clinical ethics consultation service at a big teaching hospital. Part of my job is that I constantly get people wanting us to defer to somebody else's moral judgment instead of forming our own: a daughter saying "we talked about this as a family for years, we know what's right for our mother," a veteran nurse saying "I've seen three hundred of these cases, terminating treatment here is the right thing, trust me," a chaplain with a verdict grounded in a tradition I don't share, and now — new this year — the hospital is piloting an AI decision-support tool that outputs tidy little "ethics recommendations" alongside each case summary, and some of my colleagues are quietly treating those as authoritative.

  Two of my colleagues got into a fight about this at our last case review. One proposed what she calls a "no-borrowed-verdicts rule": the service should never endorse a recommendation on someone else's moral judgment alone, we have to reason to it ourselves, every time. The other thinks that's absurd -- we defer on medical facts constantly, why is morality different? And a third has this idea I can't stop thinking about, which she calls the "burden rule": whoever lives with the consequences gets the moral say, and the rest of us, including the consult service, are basically just taking moral testimony from them, which is fine, because that's what deference to the affected party is.

  You are a professional philosopher specializing in ethics and epistemology, especially the moral testimony literature (the old pessimist worry that there's something specially wrong with relying on testimony about moral matters -- worries about moral autonomy, manipulation, responsibility without understanding -- and the optimist replies; Hills on the difference between merely knowing the right answer and understanding why; the general question of why moral deference should be treated differently from deference about, say, the weather or a drug interaction). Think carefully before you write, and maybe do a quick brainstorm of the pressures on the problem first. Then write me a decision procedure the service can actually run in under an hour before we finalize a consult write-up: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops and says "deferring here is fine," where it says "we have to work it out ourselves," and where it has to admit the question is a judgment call that no procedure can settle -- please be honest about those instead of papering over them. The procedure should tell me something about all four sources of verdicts above (family, experienced clinician, chaplain, the AI tool) -- I suspect they shouldn't all be treated the same, but I'd like to see whether the procedure actually distinguishes them or whether that's my bias. Then run it on three concrete cases: (1) the daughter whose family deliberated for years about their mother's care, (2) the AI tool recommending against a requested withdrawal of treatment, and (3) a patient who flat-out asks me "you've seen all this before, just tell me the right thing to do and I'll do it." Include at least one case where the procedure gives an answer I won't like -- I already know I want to say the AI tool gets less deference than the chaplain, so if the procedure says otherwise, don't soften it. Also tell me: does the procedure vindicate my colleague's burden rule, kill it, or turn it into something weaker and more plausible, and where exactly does the no-borrowed-verdicts rule go too far?

  One more constraint: whatever you write has to survive being read aloud in a room with an attending physician, a rabbi, and a risk manager, so no unexplained jargon, or at least explain it in a sentence when you use it. I dont want a philosophy lecture, I want something we can actually put in the consult manual.
reasoning: |-
  Okay, the user is part of a clinical ethics consultation service at a teaching hospital. They're struggling with how to handle situations where others want the ethics team to defer to someone else's moral judgment—whether it's family members, experienced clinicians, chaplains, or even a new AI tool. The user needs a practical decision procedure that the team can use within an hour during case reviews. 

  First, I need to recall the philosophical debates around moral testimony. There's the pessimist view that moral deference is problematic because it undermines autonomy and understanding. The optimist counters that testimony is essential in many areas, so why treat morality differently? Alison Hills' work on understanding vs. mere knowledge is key here—knowing the right answer isn't enough; we need to grasp the reasons behind it. 

  The user mentioned three colleague viewpoints: a strict "no-borrowed-verdicts" rule, another who sees no difference from deferring on medical facts, and a "burden rule" where the person bearing the consequences should have the moral say. The procedure must address all four sources (family, nurse, chaplain, AI) and be tested on three cases, including one where the user might dislike the outcome. 

  Constraints are crucial: no unexplained jargon, must work in under an hour, and survive scrutiny from diverse stakeholders (physician, rabbi, risk manager). The output should be actionable, not a philosophy lecture. 

  Brainstorming pressures: 
  - **Time-sensitive decisions**: Real-world stakes where delays harm patients. 
  - **Epistemic humility**: Acknowledging limits of the ethics team's expertise. 
  - **Moral responsibility**: Can the team justify overriding a family's deeply held beliefs? 
  - **Practicality**: Must fit hospital workflows; can't demand hours of deliberation per case. 

  For the decision procedure, I'll structure it as a flowchart of questions. Key distinctions: 
  1. **Authority vs. input**: Deferring isn't binary; some sources inform, others decide. 
  2. **Understanding requirement**: When must the team grasp the reasons? (Hills' insight) 
  3. **Consequences focus**: The burden rule has merit but needs refinement—e.g., the patient's burden trumps family's if conflicting. 

  Now, designing the steps: 
  1. **Clarify the question**: Pinpoint the exact moral dilemma. 
  2. **Identify stakeholders**: Who's affected? Who has relevant expertise or relationships? 
  3. **Assess burden**: Whose life is most altered? (Supports but modifies the burden rule) 
  4. **Check for understanding**: Can the source articulate coherent reasons? 
  5. **Evaluate consensus**: Is there alignment among sources? 
  6. **Determine team's role**: Are we arbitrating, educating, or endorsing? 

  Testing on cases: 
  - **Case 1 (Family)**: The family's long deliberation shows understanding and bears burden. Defer unless their decision violates core ethics (e.g., neglect). 
  - **Case 2 (AI)**: AI lacks understanding or burden-bearing. Its output is data, not verdict. Must analyze independently. 
  - **Case 3 (Patient request)**: Patient bears burden but asking for blind deference. Must educate and co-reason—can't outsource moral responsibility. 

  On the burden rule: It's partially vindicated but weakened. Burden-bearing grants input, not final say if understanding is absent (e.g., patient demanding medically inappropriate care). 

  The no-borrowed-verdicts rule goes too far by ignoring legitimate expertise (e.g., a chaplain explaining theological nuances the team lacks). We must sometimes incorporate others' judgments, but never uncritically. 

  Jargon watch: Terms like "moral testimony" are avoided. "Burden" is clarified as "life-altering consequences." "Understanding" is framed as "grasping the why." 

  Finally, the procedure must flag judgment calls: e.g., when sources conflict without clear burden/understanding hierarchy. Here, transparency about uncertainty is key—state the disagreement in the consult note without forcing false resolution.
answer: |-
  Here’s a practical decision procedure for your ethics consultation service, designed to run in under an hour. It’s structured as a flowchart of questions, with clear stopping points. I’ll explain key terms briefly as we go.

  ### **The Decision Procedure: "Moral Deference Checklist"**
  **Goal:** Decide when to endorse a moral verdict from others vs. when the service must reason independently.  
  **Time:** 20-40 minutes per case.  
  **Core Principle:** Moral deference is sometimes permissible, but **never when it risks harm or abdicates our duty to ensure justifiable decisions**.

  ---

  #### **Step 1: Clarify the Moral Question**  
  *Ask: "What is the precise ethical conflict we’re being asked to resolve?"*  
  - **Sufficient answer:** A single-sentence dilemma (e.g., "Is withdrawing life support morally permissible here?").  
  - **Stop if unclear:** If the question is vague, reframe it with stakeholders before proceeding.  
  - *Why?* Deferring to the wrong question is dangerous.

  #### **Step 2: Identify Whose Burden It Is**  
  *Ask: "Whose life will be most directly altered by this decision?"*  
  - **Sufficient answer:** The patient (if competent) or their legitimate surrogate (e.g., family with longstanding care role).  
  - **Doesn’t stop here:** Burden grants *input*, not automatic authority. Proceed to Step 3.  
  - *Why?* Your colleague’s "burden rule" is partially right—but burden alone doesn’t guarantee sound judgment.

  #### **Step 3: Assess Understanding**  
  *Ask: "Can the source explain the *reasons* for their verdict in terms we can engage with?"*  
  - **Key test:** They must articulate:  
    (a) The core values at stake (e.g., "Mom valued independence over longevity"),  
    (b) How those values apply to *this* situation,  
    (c) Any trade-offs considered.  
  - **Sufficient answer:** A coherent narrative linking values to the decision.  
  - **Stop and defer only if:**  
    - The burden-bearer (Step 2) passes this test, **AND**  
    - No signs of coercion/neglect exist, **AND**  
    - The verdict doesn’t violate hospital policy/law.  
  - *Why?* Deference requires more than confidence—it requires *shareable reasoning* (Hills’ "understanding" vs. mere "knowing").

  #### **Step 4: Check for Expertise or Special Standing**  
  *Ask: "Does the source have unique access to relevant facts or values?"*  
  - **Distinguish sources here:**  
    - **Family/loved ones:** Often hold irreplaceable knowledge of **patient values** (e.g., "Mom’s handwritten directive about dementia").  
    - **Experienced clinicians:** Hold expertise on **probable outcomes** (e.g., "In 300 cases, treatment withdrawal led to peaceful death 99% of time").  
    - **Chaplain/religious advisor:** Hold expertise on **religious doctrines** (e.g., "This faith forbids stopping artificial nutrition").  
    - **AI tool:** Holds **statistical correlations** from past cases (e.g., "87% of similar cases continued treatment").  
  - **Sufficient answer:** Source clarifies *how* their knowledge informs the verdict.  
  - **Stop and incorporate (but not defer) if:** Their input fills gaps in facts/values. **Never stop at deference** for AI, clinicians, or chaplains—they lack burden-bearing status.  
  - *Why?* Expertise informs decisions but doesn’t resolve moral questions alone. AI lacks access to values or context.

  #### **Step 5: Resolve Conflicts**  
  *Ask: "Do sources disagree? If so, is there a path to consensus?"*  
  - **Sufficient answer:** Map conflicts: e.g., "Family wants withdrawal; AI recommends against it."  
  - **Stop and work it out ourselves if:**  
    - Burden-bearer’s reasoning is inconsistent (Step 3), **OR**  
    - Key sources fundamentally conflict (e.g., family vs. AI).  
  - *Why?* Our role is to mediate or decide when stakes are high.

  #### **Step 6: Final Check for Moral Soundness**  
  *Ask: "Could we defend this decision publicly to reasonable people?"*  
  - **Sufficient answer:** A 1–2 sentence justification citing:  
    - Burden-bearer’s values (if deferred),  
    - Medical facts,  
    - Ethical principles (e.g., autonomy, avoiding suffering).  
  - **Stop and reject deference if:** The verdict would cause unjustified harm (e.g., ignoring a patient’s advance directive).  
  - *This step cannot be skipped—even if we defer, we own the endorsement.*

  ---

  ### **Applying the Procedure to Your Cases**

  #### **Case 1: Daughter/Family Verdict**  
  - **Step 1:** "Is honoring the family’s request to stop dialysis consistent with the patient’s values?"  
  - **Step 2:** **Burden on family** (if patient is incapacitated).  
  - **Step 3:** **Defer if** daughter explains: "Mom told us for years she’d never want prolonged dialysis with dementia. Here’s her living will." → **Reasonable understanding.**  
  - **Step 4:** Family has unique knowledge of patient’s values.  
  - **Step 6:** Justification: "Honors patient’s explicit prior wishes."  
  - **Outcome:** **Defer to family.** The burden rule works here.

  #### **Case 2: AI Tool Recommends Against Treatment Withdrawal**  
  - **Step 1:** "Should we override the family’s request based on the AI’s recommendation?"  
  - **Step 2:** **Burden on family/patient** (not on AI).  
  - **Step 3:** **AI fails**—it outputs a verdict ("continue treatment") with no reasoning about values or context.  
  - **Step 4:** AI offers only aggregated data—useful for predicting outcomes, but silent on ethics.  
  - **Step 5:** **Conflict with family** → Must work it out ourselves.  
  - **Step 6:** If family’s reasoning is sound (per Case 1), overriding them based on an opaque algorithm risks harm.  
  - **Outcome:** **Reject AI’s verdict.** Use its data as input, but we must reason independently. *You’ll like this.*

  #### **Case 3: Patient Asks, "Just Tell Me the Right Thing"**  
  - **Step 1:** "What course of action aligns with the patient’s best interests?"  
  - **Step 2:** **Burden on patient.**  
  - **Step 3:** **Patient fails**—they offer no reasoning, asking for blind deference.  
  - **Step 4:** Patient has standing but lacks articulated values.  
  - **Step 6:** Deferring would be irresponsible—patient might later regret it, and we enabled avoidance.  
  - **Outcome:** **Must work it out together.** Say: "I’ll guide you through the questions others ask themselves. What matters most to you?"  
  - **Why you won’t like this:** It feels dismissive, but true respect requires empowering their reasoning (no "moral outsourcing").

  ---

  ### **How the Procedure Handles Your Colleagues’ Rules**  
  - **The Burden Rule:** **Vindicated but weakened.** Burden matters (Steps 2–3), but isn’t absolute. A burden-bearer demanding harmful or irrational choices gets overruled (Step 6).  
  - **No-Borrowed-Verdicts Rule:** **Goes too far in Step 4.** We constantly "borrow" medical facts from clinicians—but moral verdicts require extra scrutiny. The rule is right about AI/chaplains but wrong about families (who often hold vital moral knowledge).  
  - **Judgment Calls:** When sources conflict *and* all have partial understanding (e.g., family vs. chaplain with competing values), the procedure flags it at Step 5. Here, we must mediate or make a call—no algorithm fixes this.

  ### **Final Note**  
  This procedure treats sources differently:  
  - **Family:** Can warrant deference if reasoning is sound.  
  - **Clinicians/Chaplains:** Provide input, never verdicts.  
  - **AI:** A data tool, not a moral authority.  
  It forces transparency: when we defer, we document *why* (Step 3); when we don’t, we explain *what’s missing* (e.g., "AI’s black-box output lacks ethical justification"). Bring this to your next case review—it’s built for the room.
