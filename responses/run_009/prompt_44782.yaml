ility axioms, Dutch books and so on — since nothing in the room punishes incoherent bookmakers unless you build that in, but tell me if I'm wrong or if the game can partially capture it. And predict what will go sideways the first time I run it — I'm guessing someone posts absurd odds on the one-off events for laughs and I need a way to absorb that. Assume no calculators and no actual gambling adminstrator skills on my part.
