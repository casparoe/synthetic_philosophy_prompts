  ### Philosophy of Science: Probability Interpretations Game  
  **Goal:** Students confront the limitations of frequentism by setting odds on events where long-run frequencies are unavailable, leading them to naturally rely on physical setups (propensity) or personal judgment (subjectivism).  

  ---

  ### **Game Rules: "Probability Bookmakers"**  
  **Setup:**  
  - **Students:** 18 students. 6 become **bookmakers** (1 per event), 12 become **bettors**.  
  - **Points:** Everyone starts with 100 points. Bets use points, not money.  
  - **Odds Format:** Bookmakers post probabilities (e.g., 0.3 = 30% chance). Probabilities must be between 0.1 and 0.9 (to avoid bankruptcy).  
  - **Betting:**  
    - Bookmakers post odds for **one assigned event** on the board.  
    - Bettors choose to **accept** or **refuse** each posted odds.  
    - Each bettor can place **one bet per event** (max 6 bets total).  
    - Bet size: **10 points** per bet.  
    - Bettors pick **for** (event happens) or **against** (event doesn’t happen).  
  - **Payouts:**  
    - **Bet FOR + event happens:** Bettor wins `10 / p` points (e.g., if \(p = 0.2\), win 50 points total: 40 profit + 10 returned).  
    - **Bet FOR + event fails:** Bettor loses 10 points.  
    - **Bet AGAINST + event fails:** Bettor wins `10 / (1 - p)` points.  
    - **Bet AGAINST + event happens:** Bettor loses 10 points.  
  - **Resolving Events:** Events resolved during/after class (see timeline).  

  ---

  ### **Event List**  
  **Design Goals:**  
  - Mix repeatable, one-off, and unrepeatable events.  
  - Include one event where frequency vs. propensity **clash**.  
  - Concrete, resolvable in one session.  

  | Event | Type | Resolution Method | Frequency vs. Propensity Clash? |  
  |-------|------|-------------------|----------------------------------|  
  | 1. **Die roll**: A standard die under a cup shows ⚅ (six). | Repeatable | Roll once publicly. | No (frequentism clear: 1/6) |  
  | 2. **Coin dump**: A handful of 10 coins dumped on a table lands with ≥7 heads. | Repeatable | Dump coins publicly. | No (frequentism computable) |  
  | 3. **"Lucky" coin flip**: A visibly **bent coin** (held up for inspection) lands heads. *But*: Mention it was flipped 10 times earlier with 5 heads. | Repeatable (but suspicious) | Flip once publicly. | **YES** – Physical bias (propensity) vs. past frequency (frequentism). |  
  | 4. **Coffee temp**: The instructor’s coffee is cold (touch-test) by class end. | One-off physical | Check at end of class. | No (propensity natural: heat transfer) |  
  | 5. **Chair squeak**: The squeaky chair (point to it) squeaks when *Student A* (pick a volunteer) sits at class end. | One-off physical | Student A sits publicly. | No (propensity: mechanics + wear) |  
  | 6. **Sneaker count**: The # of students wearing sneakers in this room is **even** at class end. | Unrepeatable | Count sneakers publicly. | No (subjective: no physical setup/frequency) |  
  | 7. **Paper throw**: A crumpled paper ball thrown by the instructor hits the trash can from 10 ft away. | Unrepeatable | Instructor throws once at class end. | No (subjective: skill estimate) |  

  **Key Clash Event (Event 3):**  
  - **Bent coin** visibly favors tails (e.g., weighted/bent), but past "data" shows 5/10 heads.  
  - Forces choice: Trust the physical setup (propensity → odds ≠ 0.5) or past frequency (frequentism → odds = 0.5)?  

  ---

  ### **Timeline (75 mins)**  
  1. **Setup (5 mins)**:  
     - Assign roles: 6 bookmakers (1 per event), 12 bettors.  
     - Explain rules, payouts, and events.  

  2. **Bookmaking (10 mins)**:  
     - Bookmakers post probabilities for their event on the board.  

  3. **Betting (15 mins)**:  
     - Bettors decide which odds to accept (write bets on slips: event, for/against).  
     - Instructor collects slips and records bets.  

  4. **Resolve Events (20 mins)**:  
     - **Immediate resolution (Events 1–3)**:  
       - Roll die (Event 1), dump coins (Event 2), flip bent coin (Event 3).  
     - **End-of-class resolution (Events 4–7)**:  
       - Check coffee (Event 4), chair squeak (Event 5), sneaker count (Event 6), paper throw (Event 7).  

  5. **Payouts (5 mins)**:  
     - Instructor calculates payouts (no calculators: use fractions/simplify).  
     - Adjust points on the board.  

  6. **Debrief (20 mins)**:  
     - **Step 1:** Ask students:  
       - *"How did you set odds for the die/coins? Why not 0.1 or 0.9?"* → **Frequentism** named (reliance on long-run symmetry).  
       - *"For the bent coin, why did some set odds ≠0.5? For the chair/coffee, what did you consider?"* → **Propensity** named (physical setup matters).  
       - *"How did you bet on sneakers/paper throw? What if I asked about rain in 2047?"* → **Subjectivism** named (personal judgment).  
     - **Step 2:** Formalize terms:  
       - **Frequentism**: "You used long-run frequencies for repeatable events."  
       - **Propensity**: "You considered physical properties (bent coin, chair wear) for one-offs."  
       - **Subjectivism**: "You used gut feelings for truly unique bets."  
     - **Step 3:** Highlight the clash:  
       - *"For the bent coin, did you trust the past data (frequency) or the crooked edge (propensity)? That’s the debate!"*  

  ---

  ### **What the Game Captures (and What It Misses)**  
  **Captures:**  
  - The **descriptive reality** of probability: Students *use* all three approaches naturally.  
  - **Frequency’s limits**: Bettors struggle with one-offs/unrepeatables (e.g., sneaker count).  
  - **Propensity vs. frequency clash**: The bent coin event forces a tangible choice.  

  **Misses:**  
  - **Normative coherence (Dutch books)**:  
    - The game doesn’t punish incoherent odds (e.g., a bookmaker posting `P(A) = 0.4` and `P(not A) = 0.7`).  
    - *Why?* Bets are on single events—no combined bets to exploit inconsistencies.  
    - **Fix if needed**: Add a compound event (e.g., "Die shows 6 AND coffee is cold"), but this complicates the game.  
  - **Deep subjectivist foundations**:  
    - Degrees of belief aren’t challenged (e.g., why *should* odds obey probability axioms?).  

  ---

  ### **Predictions of Chaos (and Fixes)**  
  **Problem 1: Absurd odds on one-offs (e.g., 0.9 for rain in 2047).**  
  - **Why?** Students treat unrepeatables as jokes.  
  - **Fix:**  
    - Set the 0.1–0.9 bounds.  
    - Warn: *"If you post 0.9 for an unlikely event, bettors will bet against you and bankrupt you!"* (e.g., a 0.9 probability pays 11.1 points if the event fails—easy profit for bettors).  

  **Problem 2: Bettors refuse to bet on subjective events.**  
  - **Why?** Unrepeatables feel "unscientific."  
  - **Fix:**  
    - Encourage: *"Use your best guess—points are free!"*  
    - Reward participation (e.g., "Most adventurous bettor" bonus).  

  **Problem 3: Math slowdowns (payout calculations).**  
  - **Why?** No calculators + fractional payouts.  
  - **Fix:**  
    - Simplify denominators (e.g., if \(p = 0.25\), payout = 40 points).  
    - Prep a cheat sheet: `P = 0.2 → 50 pts`; `P = 0.75 → 13.3 pts`, etc.  

  ---

  ### **Instructor Notes**  
  - **Props Needed:** Die, 10 coins, visibly bent coin, coffee cup, squeaky chair, paper ball, trash can.  
  - **No Gambling Admin Needed:** Use point tallies on the board; bets recorded on paper slips.  
  - **Ethical Safeguards:** No real money, no personal events (e.g., "Will *you* fail?").  

  This game makes the problem visceral: students will *feel* the gap between repeatable frequencies and one-off judgments. By the debrief, they’ll have already lived the three interpretations—you just name what they did.
