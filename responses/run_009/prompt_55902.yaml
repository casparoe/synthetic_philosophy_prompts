prompt: |-
  i work at a mail sorting hub, and our system reads handwritten addresses in two steps: software trained on millions of sample addresses classifies each character on its own, and whenever its confidence on a character drops below some threshold the image gets routed to a human, who looks at the whole address — street name, city, ZIP — and decides what the scrawl must be. what theory of what makes an 'a' an 'a' does this two-step practice presuppose? the machine part seems to treat letter identity as similarity to a cloud of past examples, but the exemplars don't share any single stroke or shape, so similarity to what exactly? and the human fallback leans on context, which suggests 'a'-ness is partly constituted by what the rest of the envelope says. so do the two steps presuppose the same thing, or does one treat the letter as intrinsic to the mark and the other as partly a fact about the whole word? also where does style fit in — a frilly Victorian 'a' and a bare geometric one are somehow the same letter, and i want to know if that's the same fact that lets the machine recognize my terrible handwritting. tell me what the practice strictly requires versus what it's merely compatible with, where it's genuinely underdetermined between theories, and what would actually have to change in the sorting system if you rebuilt it on a rival view of letter identity. no headings, bullets, bold, or tables — just continuous prose, like an email
