  Let me unpack their three layered requests: First, they want the most tribunal-relevant contested questions ranked. Second, practical implications for the top 2-3. Third, which single question deserves years of study. The examples given show they're thinking about real cases - like when deception occurs between Catholic and non-Catholic spouses, or how pastors use "tactful silence."

  *scratches head* The tricky part is balancing Augustine's absolute prohibition ("never lie") against the practical realities of tribunal work. For instance: If a woman claims her husband deceived her about wanting children, does it matter if he spoke false words or just let her assume something? That's where the assertion vs. non-assertive conduct distinction becomes critical. 

  *flips through mental notes on Augustine* His later Contra mendacium seems stricter, but the earlier De mendacio was more dialectical. And Gratian's Decretum synthesized it all messily. The user's right - this isn't about slogans but untangling a knot. 

  For the top questions, I'd rank: 
  1) Whether "lying" covers only false assertions or also non-assertive deception (like silence) - because so many nullity cases hinge on omissions. 
  2) Whether the wrong is primarily about harming the deceived or corrupting the liar - as that changes how severely tribunals should weigh deceit in consent. 
  3) Whether truth-telling binds equally with non-Catholics - critical for mixed marriages.

  The assertion/non-assertive line is the most upstream. Why? Because if Augustine only condemns explicit false statements, then tribunal standards for "deception" might exclude common pastoral practices like tactful silence during pre-marriage counseling. But if his "signs" include implied messages, suddenly many standard approaches become suspect. That single thread unravels entire workflows.

  *checks user's example about injury vs. sign disorder* Exactly! If the wrong is about corrupting the speaker, then a Catholic deceiving a non-Catholic spouse might still nullify marriage even if no "harm" was intended. But if it's about injury to the deceived, the spouse's non-Catholic status might lessen the obligation. Huge implications.

  For study priority, I'd say question #1 hands down. Why? Because resolving whether Augustine's prohibition extends beyond words would immediately clarify 80% of tribunal scenarios involving "deception." And it's tractable through close reading - especially comparing his treatment of biblical figures like Jacob (who deceived Isaac through actions) in both treatises. 

  *imagines user's relief* They don't need more bibliography; they need to know where to point their limited study time. This question is the linchpin - get this right, and other issues like "harm vs. corruption" become secondary in practice. If I'm wrong, it'd only be if new evidence showed Augustine considered verbal lies categorically different from deceptive silence... but his own examples suggest otherwise.
answer: |-
  Based on your role and the concrete needs of tribunal adjudication, here is the prioritized analysis of Augustine's teaching on lying, focusing on its impact on marriage nullity causes:

  ### I. Ranking of Contested Questions by Tribunal Impact (Highest to Lowest)
  1.  **Scope of "Lying": Does it cover only false assertions, or also true assertions meant to mislead, and non-assertive misleading conduct (e.g., silence, selective emphasis, evasion)?**  
      *This is paramount.* Your tribunal constantly assesses whether conduct (pre- or post-consent) constitutes deceit sufficient to vitiate consent. Augustine's core definition (mind/speech disconnect) focuses on *assertion*. Yet tribunal cases often involve omissions, strategic silence, or technically true but misleading statements by parties, pastors, or advocates. *Ambiguity:* "Contra mendacium" condemns deceptive infiltration, suggesting broader scope, while "De mendacio" (§§ 3.3-4, 14.25) discusses "keeping truth hidden" and distinguishes *not revealing* from *asserting falsehood*. Gratian (C.22 q.2) blurs this, citing Augustine on concealment.

  2.  **Nature of the Wrong: Is the core evil the injury to the deceived party, the corruption of the speaker, or the disorder in the sign-thing relationship?**  
      *Crucial for assessing gravity and relevance.* Nullity requires deception to be *material* and *directly related to consent*. If the wrong is primarily injury to the deceived, deception harming only the *deceiver's* soul might be less relevant to consent's validity. If it's the sign-thing disorder, *any* intentional disconnect contaminates the act, regardless of harm. Augustine emphasizes speaker corruption ("Contra mend." § 12: "pernicious to the soul") *and* sign disorder ("De mend." § 10.24: "perverting the nature of signs"). Injury is secondary. *Impact:* Determines whether to weigh deception's *effects* on the victim-party or focus solely on the *intent and act* of the speaker.

  3.  **Duty of Truthfulness: Is the prohibition absolute only among Christians ("neighbors in the faith"), or universal?** ("Contra mend." § 19)  
      *Highly relevant in mixed marriages.* If truth is owed only to fellow believers, deception by/against a non-Catholic spouse might be viewed differently. Augustine wrote "Contra mendacium" specifically about deceiving heretics *within the Christian fold*, arguing truth is owed to those who share faith. His broader writings suggest a universal duty, but this passage creates tension. *Impact:* Affects cases where one party is non-Catholic or lapsed – a common scenario.

  4.  **Inducing False Belief Without Assertion: Is knowingly allowing/perpetuating a false belief (without speech) equivalent to lying?**  
      *Important but often subsumed under Question 1.* Augustine explicitly distinguishes silence/omission from lying ("De mend." § 5.7, 14.25; "Contra mend." § 12), though he may condemn it as a *distinct* sin. Tribunal cases heavily involve omissions (e.g., failing to disclose prior marriage attempts, infertility). The gravity distinction matters.

  5.  **Authority of De Mendacio vs. Contra Mendacium:**  
      *Less urgent for adjudication.* While the dialectical method of "De mendacio" shows complexity, Augustine's later "Contra mendacium" represents his definitive, pastoral stance. Gratian and tradition treat both as authoritative, synthesizing them. The core prohibition remains consistent. Focus on reconciling the *substance* (which the tradition did) rather than the method.

  ---

  ### II. Practical Impact of Top Questions in Tribunal Work
  1.  **Scope of "Lying" (Assertion vs. Non-Assertive Conduct):**
      *   **Turns On:** What constitutes "deception" for nullity? Is it only explicit false statements, or does it include deliberate omissions, evasive answers, misleading partial truths, or even conduct implying falsehood?
      *   **Concrete Tribunal Impact:**
          *   **Pastoral Preparation:** If Augustine only condemns false assertions, common practices like tactful silence on sensitive topics (e.g., past trauma impacting capacity) or emphasizing positive aspects while downplaying challenges are *not* lies. If his "signs" include *implicit assertions* or *duty-bound disclosures*, these practices become highly suspect. Your example is spot-on: this reading directly challenges standard pre-marital counseling methods.
          *   **Proving Concealment:** A petitioner alleging the respondent concealed a history of incapacity (e.g., severe addiction, undisclosed child) must prove *intentional deception*. If "lying" requires a false *statement*, mere silence might be insufficient proof unless a duty to disclose existed. If non-assertive misleading falls under Augustine's prohibition, the standard of proof for deceit is lower, and tribunals must scrutinize omissions much more closely.
          *   **Advocate/Staff Conduct:** Is it permissible for tribunal staff to use strategic ambiguity (without falsehood) to manage difficult parties? Augustine's "sign disorder" view might condemn this more readily than an "injury-only" view.

  2.  **Nature of the Wrong (Injury vs. Corruption vs. Sign Disorder):**
      *   **Turns On:** How gravely does a proven deception impact the validity of consent? Is the focus on the deceived party's *understanding* being corrupted, or on the *deceiver's* moral act vitiating the consent itself?
      *   **Concrete Tribunal Impact:**
          *   **Gravity Assessment:** If the wrong is primarily injury to the deceived, a tribunal might demand proof the deception *actually caused* a mistaken consent (e.g., "Had I known X, I wouldn't have married"). If the wrong is the speaker's corruption or sign disorder, the *intent to deceive* about something material *itself* potentially invalidates consent, regardless of the victim's actual reliance or outcome. This shifts the burden of proof and the weight given to intent.
          *   **Materiality Standard:** The "injury" lens ties materiality closely to the *specific deceived party's* values/perspective. The "corruption/sign" lens suggests a more objective standard: deception about anything essential to the *nature* of marriage (fides, proles, sacramentum) is inherently grave because it disorders the consent-sign.
          *   **Respondent's Culpability:** If the core wrong is the respondent's self-corruption, this might be relevant to assessing *their* understanding of marriage, even if the petitioner wasn't significantly harmed. It could indirectly support claims of the respondent's own incapacity or simulation.

  3.  **Duty to Non-Catholics:**
      *   **Turns On:** Is deception by or against a non-Catholic party in a marriage involving a Catholic materially different in gravity or kind?
      *   **Concrete Tribunal Impact:**
          *   **Mixed Marriages:** If Augustine restricts the absolute duty to those "in the faith," a tribunal might be more lenient in assessing deception *by* a non-Catholic respondent (e.g., feigning belief to marry a Catholic) or even *towards* a non-Catholic petitioner by a Catholic respondent, regarding it as less intrinsically violative of the marital covenant *in the eyes of canon law*. This could affect judgments on materiality and simulation.
          *   **Good Faith Error:** Could a Catholic party's deception of a non-Catholic (e.g., about canonical form) be seen as less culpable or less relevant to consent if the duty is weaker? Conversely, does deception *by* the non-Catholic carry less weight in vitiating the Catholic's consent?
          *   **Pastoral Implications:** Affects guidance given to pastors preparing mixed marriages and handling disclosures.

  ---

  ### III. The Single Question for Deep Study: Scope of "Lying" (Assertion vs. Non-Assertive Conduct)
  **Why This One?**

  1.  **Most Upstream & Consequential:** This question fundamentally defines what constitutes "deception" in the tribunal's purview. Resolving it directly determines:
      *   The **admissibility and weight** of evidence related to omissions, evasions, and implied falsehoods.
      *   The **legitimacy of standard pastoral practices** around pre-marital disclosure and counseling.
      *   The **interpretation of "concealment"** in grounds for nullity (e.g., Can. 1098).
      *   The **threshold for proof of deceit**. If non-assertive conduct qualifies, proof of *intent to mislead* becomes paramount in many more cases.
      Resolving this simplifies others: A broad view of "lying" encompassing non-assertive deception makes the "Nature of the Wrong" question *more critical* (as more conduct falls under prohibition). A narrow view (only false assertions) lessens the immediate pressure to resolve the "Duty to Non-Catholics" question for many omission-based cases.

  2.  **Highest Frequency in Cases:** Allegations involving concealment, half-truths, or misleading impressions are ubiquitous in marriage nullity causes. This question arises constantly; the others arise situationally.

  3.  **Tractability through Close Reading:** The texts offer rich material:
      *   Analyze Augustine's *examples*: Jacob's deception of Isaac (using kidskin/goat smell - *action*, not just words - Gen 27). How does he characterize this in both treatises?
      *   Scrutinize his *distinctions*: "hiding truth" vs. "uttering falsehood" ("De mend." 3.3, 5.7, 14.25), "concealing thoughts" vs. "falsely signifying" ("Contra mend." 12).
      *   Examine his *definition*: "Aliud in pectore, aliud in voce" - Does "voice" (*vox*) imply only speech, or can it encompass communicative signs? Does "significare" imply assertion?
      *   Contextualize "Contra mendacium" § 10: Condemning heretics who "lie in wait ... by pretending one thing and doing another." Is this about *words* or *actions*?
      *   Compare Scriptural treatments: Rahab (hiding spies - Josh 2), Hebrew midwives (Ex 1:19) – Does Augustine see their *deception* as permissible non-lying, or as sinful lying excused? His stance is complex but reveals boundaries.

  **What Would Change the Ranking?**
  If your tribunal *exclusively* encountered cases involving explicit false statements (rare), or if the "Duty to Non-Catholics" dominated your docket (e.g., diocese with very high mixed marriage rates and specific patterns of deceit), the rankings could shift. However, the pervasive nature of non-assertive deception in human relationships and marriage contexts makes Question 1 the most universally impactful upstream question.

  **Conclusion:** Focus your study on rigorously defining the boundary between "lying" (as Augustine understood it) and other forms of deception (silence, evasion, implication) within his texts and their direct Scholastic reception (especially Gratian's synthesis). This will provide the strongest foundation for evaluating the most common and practically significant claims of deception impacting marital consent.
