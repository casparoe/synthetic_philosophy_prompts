prompt: |-
  I keep getting into it with my brother about torture and the ticking time bomb, and I realize I've never actually written down my own views, so here goes. My gut calls on cases:

  Known nuke under the city, known guy who planted it, four hours to go, he's not talking: fine. Do it, and honestly I think I'd do it myself.

  Same setup but we're only like 70% sure he's the guy: not fine anymore.

  A police sniper taking a shot at a hostage taker when she's only 70% confident she can hit him without hitting the hostage: fine. This one bugs me because I can't see why 70% is enough when the trigger gets a lethal outcome but not when it's torture.

  The state doing it completely off the books — no protocol, no legal cover, guy just grabs the pliers and accepts he might be prosecuted after, betting on a pardon: fine. Actually kind of admirable. The state passing a statute that authorizes torture in ticking bomb cases in advance, with safeguards: makes my skin crawl, and I'm pretty sure not fine, even though the statute is the one that would get due process right. But I'm also fine with the state having a standing policy for when snipers may shoot. So my rule can't just be "the state may never plan violence in advance."

  Torturing him after the bomb is found and defused, as punishment for planting it: obviously not fine, even though he deserves it more than anyone. So it's not about what he deserves.

  The one I keep flip-flopping on: the bomb is under a stadium, and the guy won't talk, but his wife — completely innocent, knew nothing about the plot — might know the disarm code without realizing what she knows. Torturing him feels permissible. Torturing her feels monstrous. And I cannot give a single good reason why, given that she's the only path to saving eighty thousand people, and he's already told us he won't break.

  So: is there one principle that gets all or most of these verdicts, or am I just going to have to give one up? I'd want the principle stated precisely enough that it decides the wife case, and I'd want you to be honest about which of my verdicts it can't save — I suspect the sniper one and the statute one are where something has to break, but maybe not the ones I think. Keep it under 500 words and in american english please, and lead with the principle itself in a sentence or two before anything else.
reasoning: |-
  Okay, the user is grappling with a complex ethical dilemma about torture in ticking time bomb scenarios. They've presented several nuanced cases where their moral intuition gives different verdicts, and they're seeking a unifying principle that can resolve these conflicts.

  The core challenge here is reconciling their instinctive responses: they approve of torture when certainty is absolute (known bomber, known bomb) but reject it when probability drops to 70%. They're comfortable with lethal force by snipers at 70% confidence but not torture at the same probability. They admire off-the-books state torture but recoil at legalized protocols. They see torturing a guilty bomber as permissible but find torturing his innocent wife monstrous despite identical stakes.

  I notice three key tensions in their position:
  First, the probability paradox - why does 70% suffice for lethal force but not coercion?
  Second, the institutionalization dilemma - why approve extra-legal action but reject legal frameworks?
  Third, the innocence boundary - what makes torturing the wife different when consequences are identical?

  The principle I'm considering focuses on the distinction between preventing imminent harm versus imposing punishment. This aligns with their rejection of post-bomb torture as punitive. It also explains the wife case: torturing her isn't harm prevention (she isn't causing harm) but instrumentalizing her suffering.

  For the sniper case, the probabilistic element works because the sniper is targeting the direct threat. With torture, the 70% uncertainty means you might be coercing someone who cannot prevent harm. The off-the-books approval fits because it maintains torture as an aberration rather than normalizing it, while legalization would institutionalize violence against the defenseless.

  The user seems to value moral consistency but struggles with emotional asymmetry - they feel the wife's torture viscerally while rationalizing the bomber's. Their "admirable" comment about extra-legal action suggests they prioritize saving lives over procedural purity, yet fear systemic corruption.

  The unresolved tension lies in the sniper comparison. A sniper uses lethal force preventively against a direct threat, while torture uses prolonged suffering to extract information. The immediacy and target differentiation might explain their different probability thresholds. This might be where their intuition needs refinement - either by accepting higher standards for sniper shots or acknowledging that torture's irreversible cruelty demands near-certainty.
answer: |-
  Here's a unifying principle:

  **The state may only intentionally inflict severe, non-consensual harm on an individual to directly prevent imminent, catastrophic harm caused by that individual's own deliberate action or ongoing threat, and only when the necessity and proportionality are overwhelmingly certain.**

  Now, applying it:

  1.  **Known Bomber (Certainty):** Permissible. He directly caused the threat; torture directly prevents catastrophic harm; necessity/certainty is absolute.
  2.  **70% Certain Bomber:** **Not permissible.** Overwhelming certainty lacking (30% chance he's innocent/not the source).
  3.  **Sniper (70%):** **Permissible (but clashes).** *Why it fits (mostly):* The sniper targets the *direct, imminent threat* (hostage-taker) to stop harm *they are actively causing*. Probability relates to *skill/risk*, not the *identity* of the threat. *The clash:* Your principle demands overwhelming *certainty of necessity*, which 70% arguably isn't. This is the tension point.
  4.  **Off-the-Books Torture:** **Permissible (arguably).** It meets the core principle (preventing catastrophe caused by the individual). The lack of authorization avoids institutionalizing the practice, fitting the principle's focus on *exceptional, direct prevention*.
  5.  **Torture Statute:** **Not permissible.** Institutionalizing torture violates the principle. It creates a *system* for inflicting harm, detached from the specific, imminent, overwhelming-certainty scenario required. It normalizes the unacceptable.
  6.  **Post-Bomb Torture:** **Not permissible.** Not preventing imminent harm; purely punitive/retributive.
  7.  **The Wife:** **Not permissible.** She did not cause the threat or pose an ongoing threat herself. Torturing her isn't stopping harm *she* is responsible for; it's using her suffering purely instrumentally to extract information. She lacks the required causal link to the imminent harm.

  **What Breaks:**

  *   **The Sniper Case (70%):** This is the weak spot for your principle. Your intuition accepts the sniper's risk because the target *is* the direct threat, and the uncertainty is about collateral damage *during* the necessary act of stopping that threat. Torture at 70% involves uncertainty about whether the person *is* the source *before* the harm is inflicted. The principle demands near-absolute certainty *before* inflicting severe harm, which the sniper case tests. You might need to refine the certainty requirement for *interrupting active threats* vs. *coercing information*.
  *   **The Statute:** Your principle clearly rejects it, matching your intuition. No break here.

  **The core distinction is between harming someone *who is the source of the imminent catastrophe* to stop it immediately, versus harming anyone else (including the innocent or the merely suspected) to gain information, or punishing after the fact.** The wife case fails because she isn't the source.
