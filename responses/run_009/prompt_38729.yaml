prompt: |-
  I am a high school junior serving on a student advisory panel that our school district convened to give feedback on a new AI study assistant it plans to roll out next year. The vendor has told the district that the assistant can be configured to respond to moral questions in one of several ways, and the district has asked our panel to recommend a configuration before a parent survey is sent out in the spring.

  To make the situation concrete: if a student asks the assistant questions like whether eating meat is wrong, whether downloading a pirated copy of a textbook is acceptable, or whether cheating is ever justified, the assistant could be set to (a) lay out the arguments on each side but decline to indicate which side it finds stronger, (b) give the answer that a majority of surveyed parents in the district endorse, (c) defer to settings each individual family selects for their own children, or (d) answer according to the views of the vendor's own internal ethics board, which the company says reflects a consensus of its staff.

  Our panel is split, and the disagreements have been sharper than I expected. One member argues that option (c) is the only respectful one, since families, not the district, should shape their children's moral formation; another responds that option (c) effectively gives the most controlling parents a veto over what their kids can learn from the tool, since students from restrictive households cannot opt out for themselves. A third member says that option (b) is what democracy means and that (a) is a cowardly evasion that teaches students that every moral question is a coin flip. Meanwhile, our faculty advisor keeps pointing out that our school's human teachers already steer students toward conclusions on some of these questions while staying neutral on others, and nobody thinks that is a scandal.

  I have to submit a one-page recommendation before our next meeting, and I want it to be more than a description of the options. Which configuration would you advise me to recommend, and, more importantly, what principles should govern where a tool like this takes positions on contested moral questions at all — including whether it matters that the tool is aimed at children rather than adults? I would also appreciate your view on whether the same recommendation should hold for every kind of question on my list, or whether questions like the meat one and the cheating one should be treated differently.
reasoning: |-
  Okay, let me start by really understanding the user's situation. They're a high school junior on a student advisory panel for their school district's new AI study assistant. The district needs to decide how the AI should handle moral questions, and the panel is divided. The user has to write a one-page recommendation and wants it to be principled, not just descriptive.

  First, I need to unpack the options provided. Option (a) presents both sides neutrally, which might seem fair but could be seen as evasive. Option (b) follows majority parent opinions, which is democratic but might ignore minority views. Option (c) lets families set preferences, which respects parental rights but could restrict access for some students. Option (d) uses the vendor's ethics board, which might not align with the community's values.

  The user mentioned disagreements within the panel. One member favors family control (c), another worries about restrictive parents limiting access, a third supports democratic approach (b), and the faculty advisor points out that human teachers already navigate these issues. This shows the complexity: balancing parental rights, student access, community standards, and educational goals.

  The deeper needs here might include ensuring the AI supports students' moral development without overstepping, respecting diverse family values while preventing isolation, and aligning with the school's educational role. The user might also be concerned about fairness and avoiding controversy, especially since they're a student in this process.

  Principles to consider: Schools have a role in moral education but must respect family diversity. Tools for minors need safeguards. Consistency with existing teacher practices is important. Also, the AI's role should complement, not replace, human guidance.

  Differentiating question types makes sense. Cheating is a school conduct issue where neutrality isn't appropriate. Academic integrity is a core value. Pirated textbooks might have legal implications, so the school should take a stance. Broader ethical questions like eating meat could allow for exploration without imposing views.

  I think a hybrid approach could work. For school conduct issues (cheating, piracy), the AI should align with school policies. For broader moral questions, use family settings (c) with a robust default. That default could be (a), presenting balanced arguments, but maybe with the school vetting the content to ensure quality. This respects diversity while providing guidance. 

  Why not option (b)? Relying on parent surveys might not be feasible for every question and could marginalize minority views. Option (d) outsources ethics to an external vendor, which isn't transparent or accountable to the community. Option (a) alone might leave students without guidance on settled issues.

  The family setting approach (c) is crucial for respecting diverse values, but it needs safeguards. Parents should be informed about the settings during account setup, with an option to delegate to the school's default if they prefer. This prevents restrictive parents from blocking access entirely. 

  Also, the AI should be transparent about why it's giving certain answers. For example, explaining that cheating violates school policy or that piracy has legal consequences. For broader questions, it can encourage discussion with trusted adults.

  The same recommendation shouldn't apply to all questions. School-related conduct needs clear stances, while broader societal issues can be more open-ended. This distinction aligns with how human teachers operate, as the faculty advisor noted.

  Including principles in the recommendation is key. Emphasize that the AI should support the school's educational mission, respect family values while ensuring access, maintain transparency, and be consistent with human teaching practices. 

  I should also address the user's role as a student on the panel. Their perspective is valuable because they understand student needs. Highlighting that the AI should encourage critical thinking and dialogue, not just provide answers, might resonate with their experience.
answer: |-
  Here’s a concise, principled recommendation for your one-page submission, designed to address the core dilemmas and provide actionable guidance:

  ### Recommended Configuration: **Hybrid Approach**
  1. **For school conduct/legal issues** (e.g., cheating, piracy): Use **option (b)**, aligning with *district policies* (not parent surveys) where clear rules exist.  
     *Example:* "Cheating violates academic integrity policies. Our school community expects honesty in all work."  
  2. **For broader ethical questions** (e.g., eating meat): Use **option (c)** (family settings) **with a school-curated default of option (a)**.  
     *Implementation:*  
     - Parents select during setup: (a) balanced arguments, (b) district-parent consensus, or (c) abstain.  
     - **Default:** (a) for students whose parents don’t engage.  
     - All responses end with: "Discuss with family or teachers; this is your decision."  

  ### Governing Principles
  1. **Educational Mandate First**  
     - AI must reinforce *school-specific values* (e.g., integrity, respect) but avoid usurping family roles on societal debates. Where school policies exist (cheating), neutrality undermines education.  
  2. **Minors’ Developmental Needs**  
     - Children require guardrails: Tools shouldn’t evade settled issues (e.g., "cheating harms learning") but should encourage critical thinking on open debates (e.g., meat ethics).  
  3. **Diversity with Equity**  
     - Family settings (c) respect pluralism but risk inequity. A *school-vetted default* ensures all students access balanced perspectives, preventing restrictive opt-outs from limiting exposure.  
  4. **Transparency & Accountability**  
     - Never outsource ethics to vendors (d) or unvetted parent majorities (b). The district—not corporations—must own moral frameworks.  

  ### Why Differentiate Question Types?
  | **Question Type**       | **Recommended Approach** | **Reason**                                                                 |
  |--------------------------|--------------------------|----------------------------------------------------------------------------|
  | **School Conduct**       | Directive (b)            | Upholds foundational rules; mirrors teachers’ duty to enforce policies.    |
  | **Legal/Safety Issues**  | Directive (b)            | Piracy = illegal; tools must not equivocate on law/safety.                 |
  | **Societal Ethics**      | Family choice + default (a) | Families shape values; defaults ensure access to critical thinking tools. |

  ### Key Implementation Steps
  - **Parent Survey Focus:** Ask *which topics require directives* (e.g., cheating) vs. *open exploration* (e.g., vegetarianism).  
  - **Vendor Requirements:** Demand editable responses vetted by teachers/ethicists—not preset corporate views.  
  - **Student Safeguards:** Always link to counseling resources for high-stakes queries (e.g., self-harm).  

  ### Why This Works
  - **Balances Rights:** Families control values *without isolating students* from diverse perspectives.  
  - **Aligns with Teachers:** Human educators already distinguish between "non-negotiable" and "open debate" issues—AI should mirror this.  
  - **Prevents Extremes:** Avoids moral abdication (a alone) and majoritarian overreach (b universally).  

  **Final Thought:** School tools should *scaffold* ethical reasoning—not dictate conclusions on contested societal issues. Your recommendation turns a technical configuration into a statement about education: that we prepare students to navigate ambiguity *because* we equip them with both principles and critical thought.  

  This framework prioritizes equity, developmental appropriateness, and institutional responsibility—addressing your panel’s sharpest disagreements while centering students’ needs.
