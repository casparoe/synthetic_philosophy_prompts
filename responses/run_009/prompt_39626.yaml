answer: |-
  The argument your friend presents is a sophisticated rendition of the challenges raised by Lewis Carroll's regress, and it aims to undermine the rational authority of mathematics by showing that deductive inference ultimately rests on non-logical foundations. However, the argument goes astray at step 6: "Whatever cannot be deductively established has, as an authority, only a conventional or psychological standing." This step is a false equivalence that conflates the lack of deductive justification with a lack of rational authority, ignoring other possible sources of rational grounding. Below, I'll explain why step 6 is the critical flaw, why rejecting it preserves the rational authority of mathematics, and what the costs of this rejection entail. I'll also address your desire to preserve steps 2 and 3, as they are central to the regress problem.

  ### Why Step 6 is the False Step
  Step 6 claims that anything not deductively established (i.e., not proven through a chain of logical inference from premises) can only derive authority from convention (arbitrary human agreements) or psychology (contingent facts about human cognition). This is an overreach because:
  - **It ignores non-deductive forms of rational authority**: Rational justification does not require deductive proof alone. For instance:
    - **Foundationalist epistemology** holds that certain basic beliefs or principles (like logical rules) are self-evident, intrinsically credible, or necessary for rational thought. Their authority comes from their role in enabling coherent reasoning, not from convention or psychology. For example, modus ponens (the inference rule at issue in Carroll's dialogue) can be seen as a constitutive norm of rationality—rejecting it would make coherent thought impossible, so it is rationally indispensable.
    - **Pragmatic or transcendental justification**: Logical rules can be justified as preconditions for meaningful discourse or inquiry. If we did not accept modus ponens, we could not engage in any rational argument, including arguments against logic itself. This "transcendental" grounding is rational but not deductive, as it arises from the conditions for the possibility of reasoning.
  - **It conflates descriptive and normative authority**: The regress shows that inference rules cannot be deductively justified without circularity, but this does not reduce their authority to mere convention or psychology. Convention is changeable (e.g., we could adopt different social rules), and psychology is descriptive (explaining how we think), but logic is normative (prescribing how we ought to think). The authority of logic lies in its correctness—e.g., modus ponens preserves truth regardless of human practices. Carroll's Tortoise can refuse to apply the rule, but this only highlights that logic requires active inference; it doesn't show that the rule itself lacks rational force.
  - **Counterexamples from mathematics and epistemology**: 
    - Mathematical axioms (e.g., those of Peano arithmetic) are not deductively proven but are often justified by mathematical intuition, which is considered a rational faculty. Similarly, inference rules are justified by logical intuition.
    - Perceptual beliefs (e.g., "I see a tree") are not deductive but gain authority from empirical evidence, which is rational but not conventional or psychological in a reductive sense.
    In the context of logic, step 6 would imply that all basic logical principles are arbitrary, which contradicts the universality and necessity attributed to them in rational discourse.

  By rejecting step 6, you avoid the conclusion that logic's authority is merely conventional or psychological. Instead, you can maintain that inference rules have rational authority through their foundational role in reasoning—grounded in intuition, pragmatic necessity, or the structure of rationality itself.

  ### Why the Other Steps Can Stand (Especially Steps 2 and 3)
  - **Steps 1–3 are sound and worth keeping**: Step 1 defines deductive justification correctly, and step 2 accurately describes Carroll's regress, where adding inference rules as premises fails to compel the Tortoise to accept the conclusion. Step 3 follows: premises alone cannot compel conclusion-acceptance without an external rule or disposition. This is a valid insight from the regress—it shows that inference is an act, not just a set of statements, and requires something beyond premises (like a cognitive practice).
  - **Steps 4–5 are acceptable but incomplete**: Step 4 correctly states that the inference rule cannot be justified deductively without regress. Step 5 then concludes that the rule's authority is not deductively established, deriving instead from a practice or disposition. This is consistent with the regress problem. However, step 5 does not imply that this authority is non-rational—it only says it is not "logical" in the narrow sense of deductively proven. The mistake comes in step 6, which misinterprets "not deductively established" as "only conventional or psychological."
  - **Steps 7–8 collapse without step 6**: If step 6 is false, then step 7 (deductive inference has merely conventional/psychological authority) and step 8 (mathematical proof has no distinct rational authority) no longer follow. Rational authority can be preserved through non-deductive means.

  ### What Rejecting Step 6 Costs
  Rejecting step 6 requires accepting that rational authority can stem from sources other than deductive proof. Specifically:
  - **Cost: Embracing foundationalism or non-deductivism in epistemology**. You must allow that some elements of reasoning—such as basic logical rules, intuitions, or pragmatic norms—are rationally justified without being inferred. These are "bedrock" principles that stop the regress:
    - **Foundationalism**: Inference rules (like modus ponens) are basic and self-justifying. Their authority comes from their self-evidence or necessity for rational thought.
    - **Pragmatic or coherentist approaches**: Rules are justified by their indispensability for coherent reasoning or successful inquiry (e.g., without them, we couldn't do science or mathematics).
  - **Implications for mathematics**: Mathematical proofs still derive rational authority from deductive inference, but the inference rules themselves rely on a non-deductive foundation. This doesn't make mathematics conventional or psychological; it means its ultimate basis is in the structure of rationality. For example:
    - We might justify logical rules through mathematical intuition (as in Gödel's platonism) or as preconditions for formal systems.
    - This preserves mathematics as objectively true and rationally binding, even if not all elements are deductively proven.
  - **Philosophical cost**: You must abandon the idea that all rational justification must be deductive. This might feel unsatisfying to those who demand that everything be "proven," but it aligns with mainstream epistemology (e.g., in the work of Kant, Wittgenstein, or contemporary foundationalists). Carroll's regress doesn't undermine logic; it reveals that logic must start somewhere—with rules we grasp non-inferentially.

  ### Addressing Your Suspicion of a Subject Change
  You suspected that the argument changes the subject between steps 3 and 8, but the issue is not a subject change—it's a subtle reduction in step 6. Steps 1–5 focus on the mechanics of inference (how premises and rules relate), but step 6 shifts to a claim about all epistemic authority, overgeneralizing from the regress. Specifically:
  - Steps 1–5 address the need for an external element to inference (a rule or practice).
  - Step 6 erroneously equates "non-deductive" with "non-rational," reducing all authority to convention or psychology.
  - This overgeneralization is unobjectionable only if you accept a narrow, deductivist view of rationality—which step 6 assumes without justification. Rejecting this allows rationality to include intuitive or pragmatic elements.

  In summary, step 6 is the false step. Rejecting it costs accepting that rational authority has non-deductive sources, but this cost is reasonable and preserves the distinctively rational force of mathematics. The regress (steps 2–3) remains a valuable insight: it shows that inference is a practice, not just a list of premises, but this practice is rationally authoritative.
