prompt: |-
  You are an experienced teacher of epistemology who has trained graduate TAs for years; think carefully and brainstorm the options before committing to a single recommendation. I'm a PhD student in philosophy, TA-ing a large intro epistemology course, and next week I lead my first fifty-minute section on the norms of assertion — the question of what makes an assertion proper or improper: must you know what you assert, must you believe it, or is it enough that it be true? The lecturer has already stated the three main positions in lecture, so the section is mine to structure, and what I want from you is a plan for the explanation rather than the explanation itself.

  A postdoc in my lab suggested a framing I find attractive but don't fully trust: introduce the debate through the data first — the way "how do you know?" seems to demand an answer, the felt oddness of asserting a lottery ticket will lose while believing it will, the Moore-paradoxical sound of flatly asserting p while denying that you know it — and only then let the candidate norms be read off the data, rather than stating each norm up front and testing it against cases. I'm torn between that data-first route and the more standard textbook route of laying out knowledge, truth, and belief norms as rivals and then working through the counterexamples. Which order do you recommend, and what does each order presuppose that the other leaves out? Relatedly, which single case should carry the whole section? Lottery propositions seem ideal because they strain the truth and belief norms without obviously straining knowledge, but I worry the probabilistic machinery will eat the clock; tell me what a good carrying case here must have and must lack, and whether I'm wrong to discount, say, a self-assertion or expert-deference case instead.

  Then the misconceptions, which I'd like mapped to the sequence: I predict students will hear "norm" as a moral rule or a rule of etiquette, will quietly equate knowledge with certainty so that the knowledge norm seems to license only the trivially obvious, and will conflate the norm of assertion with Gricean norms of conversation — I'd like to know exactly where each of those should be headed off rather than after the fact. My postdoc also insists I teach the Williamson-style analogy between assertion and action — that knowledge relates to asserting roughly as intending relates to acting — and I can't tell whether that is load-bearing for the section or a distracting aside; I'd value your judgment on whether it earns its place. Finally, tell me what to openly refuse to cover at this level and say so to the students (contextualism about "knows"? the scorekeeping literature?), and propose one closing question I could ask that would reveal whether they've genuinely grasped the distinction between a norm's being violated and its being the wrong norm, rather than having merely memorized the labels.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a PhD student TA-ing an intro epistemology course, focusing on the norms of assertion. They need a lesson plan structure and are torn between a data-first approach and the standard textbook method. The postdoc recommended data-first, but the user is unsure. 

  First, I should consider why the data-first approach might be better. The user mentioned that "how do you know?" challenges are common and that Moorean paradoxes feel intuitive. Starting with these examples could engage students by connecting to their experiences. But I need to weigh this against the clarity of presenting theories upfront. The standard approach might be more straightforward but risks being dry. 

  The user is concerned about time, especially with lottery cases involving probability. While lottery cases are classic, explaining probabilistic justification might eat up time. Alternative cases like self-assertions (e.g., "I have a headache") could be quicker but may not challenge truth norms as effectively. Need to find a balance between effectiveness and time efficiency.

  Next, misconceptions. Students might confuse epistemic norms with moral or social rules. This needs addressing early. Also, equating knowledge with certainty could make the knowledge norm seem too strict. The Gricean confusion is another point. Clarifying these during the initial definitions is crucial. 

  The Williamson analogy. The user wonders if it's essential. While it deepens understanding, it might complicate the lesson. For an intro section, it's probably better to skip it unless there's time. Focus on core norms and counterexamples instead. 

  Scope management is important. The user should avoid contextualism and scorekeeping. Explicitly tell students these are advanced topics. This keeps the session focused. 

  For the closing question, testing the grasp of norm violation vs. wrong norm is key. A case like asserting a true belief without knowledge (e.g., the stopped clock) could work. Ask why it's improper even if true, highlighting that the norm isn't about truth but knowledge. 

  Putting it all together: Start with data, define norms, use lottery case, address misconceptions early, skip Williamson, set boundaries, end with the clock case question. Need to ensure each segment fits within the 50-minute timeframe without rushing.
answer: |-
  Here’s a battle-tested lesson plan structure prioritizing clarity, engagement, and conceptual depth for your 50-minute section, followed by a breakdown of key decisions:

  **Recommended Order: Data-First with Structured Elicitation**  
  *(Start with intuitions → Elicit norms as explanations → Test norms against counterexamples)*

  **Why Data-First Wins for Intro Sections:**
  1.  **Engagement & Motivation:** Starts with relatable linguistic phenomena ("How do you know?" challenges, lottery hesitancy, Moorean absurdity) rather than abstract theory. Students *feel* the puzzle.
  2.  **Active Learning:** Forces students to generate hypotheses (norms) *from* data, mimicking philosophical inquiry. This builds investment.
  3.  **Avoids Premature Commitment:** Prevents students from latching onto the first norm stated ("Knowledge Norm sounds strict, I'll root for that!") without seeing *why* it was proposed.
  4.  **Highlights Explanatory Power:** Makes clear that norms are *theories* trying to explain our linguistic practices and intuitions. The norms "earn their keep."
  5.  **Smooths Over "Norm" Confusion:** Starting with concrete reactions ("Why did that feel weird?") grounds the discussion in observable phenomena before introducing the technical term "norm."

  **What the Textbook Order Lacks:** It risks feeling like a taxonomy of arbitrary rules ("Here are 3 options, now let's break them"). It presupposes students understand the *point* of positing norms before seeing the phenomena they explain. The "counterexample game" can feel detached.

  **The Single "Carrying Case": Lottery Proposition**  
  *(e.g., "Your ticket lost" based only on long odds)*

  *   **Why it Works:**
      *   **Hits All Three Norms:** Clearly violates Knowledge Norm (you don't *know* it lost). *Strains* Truth Norm (it's likely true, but feels improper) and Belief Norm (you might rationally *believe* it lost, but still feels improper to assert). This creates the core puzzle perfectly.
      *   **Intuitive & Relatable:** Students grasp probability (even without formalism). The "lottery intuition" is strong.
      *   **Efficient:** Avoids complexities of self-knowledge ("I have a headache" – seems fine without *knowing*?) or expertise (deference – introduces social/pragmatic factors muddying core epistemic norms). *Self-assertion and expert cases are excellent secondary counterexamples for Truth/Belief norms later, but not as the primary driver.*
  *   **Mitigating Probabilistic Worries:** DON'T dive into probabilistic *justification*. Focus ONLY on: "Do you *know* it lost? (No). Is it probably true? (Yes). Do you believe it? (Probably). Yet, does it feel okay to flatly assert it? (No!). Why?" *Keep it purely intuitive.*

  **Addressing Misconceptions Proactively (Where & How):**

  1.  **"Norm" ≠ Moral/Etiquette Rule:**
      *   **When:** Immediately after introducing the term "norm of assertion" (likely when first stating the Knowledge Norm hypothesis elicited from the Lottery/Moorean data).
      *   **How:** "Crucially, we're talking about an *epistemic* norm here – a rule about what makes an assertion *epistemically proper or improper*, grounded in truth/conveying accurate information. It's not primarily about politeness or moral rightness (though those might sometimes overlap). Think 'correct vs. incorrect' given the goal of sharing knowledge."
  2.  **Knowledge ≠ Certainty:**
      *   **When:** When first discussing the Knowledge Norm itself.
      *   **How:** Explicitly state: "Remember, 'knowledge' here is the fallibilist notion we've been using all course. You can know something based on good evidence even if there's a tiny chance you're wrong. The Knowledge Norm *doesn't* require absolute, Cartesian certainty. You know lots of things you assert daily!" *Reinforce with everyday examples.*
  3.  **Not (Just) Gricean Conversation Norms:**
      *   **When:** When discussing counterexamples challenging the Truth or Belief Norms (e.g., why asserting a true belief you lack justification for feels wrong).
      *   **How:** "One might think 'Be truthful' (Grice's Quality) is enough. But the Lottery case *is* likely truthful, yet improper. Grice focuses on successful communication. Our epistemic norm focuses on the *speaker's epistemic standing* itself. They can come apart."

  **The Williamson Analogy: Skip It (For This Section)**
  *   **Why:** It's conceptually valuable but *not* load-bearing for understanding the core debate or the key intuitions/counterexamples at the intro level.
  *   **Risk:** It adds significant complexity (intentions, actions vs. assertions) without directly helping students grasp why the Lottery assertion feels wrong or why Moorean assertions are absurd. It's a meta-theoretical justification *for* the Knowledge Norm, not a tool for elucidating the core phenomena. It will eat time and distract. *File it away for an advanced seminar or if a super-keen student asks.*

  **What to Openly Refuse to Cover (State Clearly):**
  *   "Today, we're focusing on *what the core epistemic norm of assertion itself is:* Knowledge, Belief, or Truth. We *won't* be diving into:
      *   **Contextualism about 'knows':** Whether the standards for 'knowing' shift with context. (That's a different debate about knowledge itself).
      *   **Assertion & Conversational Scorekeeping:** How assertions update shared conversational commitments (e.g., Robert Stalnaker's work). That's fascinating, but it's about the *pragmatic effects* of assertion, not necessarily the fundamental epistemic rule governing it.
      *   **Deep Dives into Justification:** We'll assume a standard fallibilist notion of justification as discussed in lecture."
  *   **Phrasing:** "To keep focused on the core puzzle today, we're setting aside X, Y, and Z. These are important topics, but they belong in more advanced discussions of assertion or knowledge."

  **The Perfect Closing Question (Revealing Grasp of Norm vs. Violation):**
  > "Imagine someone asserts, 'The library closes at 6 PM today.' They confidently believe this because they saw a sign *last semester* saying the library always closes at 6 PM. Unbeknownst to them, the hours changed yesterday, but *by sheer coincidence*, today *is* a special holiday and it actually *does* close at 6 PM. So, their assertion is true, and they believe it. However, their belief is unjustified (based on outdated info). **According to the Knowledge Norm, is their assertion proper or improper? Why? If you think it's improper, does this show the Knowledge Norm is *wrong*, or does it show something else?**"

  *   **Why it Works:**
      *   **Violation, not Counterexample:** It's a clear Gettier-style case. The assertion violates the Knowledge Norm (they don't know), but it's *not* a counterexample *to* the Knowledge Norm. The norm *predicts* it should be improper, which matches our intuition. This forces students to see the difference between a norm *correctly identifying an impropriety* and a norm *failing to account for a propriety*.
      *   **Tests Key Concepts:** Requires understanding that the Knowledge Norm demands *knowledge*, not just true belief, and that a norm being *violated* doesn't mean the norm is incorrect; it might mean the speaker did something wrong *according to that norm*.
      *   **Contrasts Rivals:** Highlights why a Truth Norm (true? proper!) or Belief Norm (believed? proper!) would give the *wrong* answer here, providing indirect support for the Knowledge Norm.

  **The 50-Minute Blueprint:**

  1.  **(5 min) Hook & Data:** Start with "How do you know?" challenge (everyday occurrence). Elicit: Why is this a natural response? What does it presuppose about assertion? Introduce Lottery assertion (elicit intuition: improper). Introduce Moorean assertion ("P, but I don't know P" - elicit absurdity).
  2.  **(10 min) Eliciting Norms:** Ask: "What rule must be governing proper assertion to explain why these cases feel odd/wrong?" Guide discussion towards hypotheses: Need to *know*? (KN). Need to *believe*? (BN). Need it to be *true*? (TN). Write them clearly.
  3.  **(15 min) Testing with Lottery (KN Focus):** Deep dive. Why improper? KN explains it (no knowledge). Does BN explain it? (Maybe they believe it? Still feels wrong). Does TN explain it? (Probably true? Still feels wrong). KN emerges as strongest *for this case*.
  4.  **(10 min) Counterexamples & Refining:** Test KN? Moorean ("P but I don't know P") - KN says improper (good!). Test TN: Asserting a true belief based on a lucky guess (e.g., "That's a Venus flytrap" said by someone who just guessed, but it is). *True, but improper?* (Elicit intuition, KN explains). Test BN: Self-assertion? ("I have a headache" - seems proper, even if you haven't *checked* you 'know' in a strong sense? *Trouble for KN?* (Introduce fallibilism reminder). *Belief without evidence?* (Improper, KN explains).
  5.  **(5 min) Misconception Patrol & Scope:** Quickly reinforce: Epistemic norm ≠ politeness/morality (after KN discussion). Knowledge ≠ certainty (when defending KN against self-assertion). Not Grice (when contrasting TN with lucky guess). State exclusions (Contextualism, Scorekeeping).
  6.  **(5 min) Closing & Assessment:** Pose the "Changed Library Hours" case. Have students discuss in pairs/groups briefly. Take 2-3 answers. Emphasize the distinction: KN *says* this is improper (no knowledge). Our intuition agrees (lucky true belief isn't proper assertion). This *supports* KN; it's a violation, not a counterexample. *This* is the core philosophical move.

  This structure leverages the power of the data-first approach to generate engagement and understanding of the norms' purpose, uses the lottery case efficiently as the central pillar, preempts key confusions, avoids distracting tangents, and ends with a question that truly tests conceptual grasp. Good luck with your section!
