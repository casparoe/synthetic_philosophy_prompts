prompt: |-
  my dept has a weekly phil bio reading group and for over a year now it's basically been two senior postdocs arguing past each other about the units of selection, and i think its time someone made them do an adversarial collaboration. one is a hardcore gene-centric type -- selection is always ultimately about allele frequencies, group selection is at best a bookkeeping trick and at worst the averaging fallacy in a lab coat. the other is a multilevel selection person -- runs everything through the Price equation, says the between-group and within-group covariance terms are a genuine causal decomposition, thinks cases like eusociality or microbial biofilms are textbook MLS. they've agreed to let me draft the joint statement (lol) and i need help.

  write the document i should bring them. i want:

  1. a numbered section of claims BOTH can sign -- they should agree on stuff like the Price equation's applicability, that the selection of / selection for distinction matters, that naive group selectionism in the 60s really was sloppy, and that the MLS and gene-centric framings are formally intertranslatable in many toy cases.
  2. a disagreements table where each disagreement is worded so its own side would actually accept the wording. e.g. the MLS person says the between-group term isolates a real causal component, the gene person says cross-level byproducts make it a redescription of individual-level selection -- but phrased fair to both.
  3. the cruxes. my guesses: (a) whether the equivalence results show one framing is vacuous or both are genuine causal decompositions, (b) whether group-level properties can be causes in their own right, (c) whether "which level selection acts on" is partly a verbal dispute, and if so which part.
  4. for each crux, something both would agree bears on it -- e.g. measuring between-group variance and migration rates in actual natural populations, or cases where the two framings make different predictions about transient dynamics rather than equilibria -- with each side's prediction written down in advance.

  please make the agreed claims non-vacuous (not just "selection happens") and don't let either side sound like a strawman. the gene person is smart, not a Dawkins parrot, and the MLS person knows the history of the group selection controversy cold. around 900-1100 words for the document itself.
