prompt: |-
  I write novels (literary stuff under my own name, one long-running mystery series under a pen name) and I've been staring at a Ship of Theseus problem in my own files for months now. Ten years and eleven drafts into one book, and at this point literally nothing survives from draft one: not the plot, not the protagonist (he became a she, then a different she), not the setting, not a single sentence. My agent insists it's still the same book, just grown up; my writing group says it's a different novel wearing the first one's file name; and I honestly can't tell anymore. And it's not just the manuscript — the same thing keeps coming up with characters (I have one who survived four books but got a new backstory, new voice, and new goals in each one), and now with the series itself, since my publisher brought in a co-writer for the lastest installment while my name stays on the cover.

  So what I'm after is not another wikipedia-tier retelling of the Greek ship. I want a procedure I can actually run — a checklist of tests, in order, with clear stop conditions — that takes the real philosophical positions on identity over time (continuity of matter, continuity of form or structure, continuity of function, whatever the narrative-identity folks would add) and translates them into questions a working novelist can answer about her own files. For each test, tell me: what answer counts as same, what counts as different, and which tests actually settle anything versus which just restate the question in fancier words. And be honest about the points where the procedure has to give up and hand it back to my judgment. Then run it on three cases: (1) the eleven-draft novel where nothing original survives but I made every change myself, one at a time, over a decade; (2) the character who kept only her name across four books; (3) the series installment that's mostly someone else's prose but follows my outline and my characters. I'd actually like it if the procedure gives me an answer I hate on at least one of these, because my gut says all three are "the same," and I have a suspicion that's just nostalgia talking.
reasoning: |-
  Okay, the user is a novelist dealing with a Ship of Theseus problem across multiple dimensions of their work. Let me unpack this carefully. 

  First, the core tension: they need operational clarity, not philosophy 101. Their frustration with "wikipedia-tier retellings" tells me they've already done the basic research. What they're really seeking is a decision-making framework tailored to creative work - something that acknowledges art's fluid nature while providing concrete evaluation steps.

  Hmm, their three cases are brilliantly chosen to test different aspects of identity:
  1) The novel's evolution through authorial control (gradual replacement)
  2) Character consistency despite radical reinvention (name as only constant)
  3) Collaborative authorship (shared creative ownership)

  The emotional subtext is important too. When they say "I'd actually like an answer I hate," that's vulnerability disguised as intellectual rigor. They suspect nostalgia clouds their judgment and want the system to override that. There's also implied anxiety about creative legitimacy - especially with the co-written book still bearing their name.

  For the procedure, I'll need to:
  - Identify which philosophical principles translate to writing
  - Define measurable thresholds for each
  - Build in escape hatches where subjectivity is unavoidable
  - Make the tests sequence logically (structural before functional before narrative)

  The character case is particularly thorny. A name alone feels insufficient for continuity, but writers do treat renamed characters as new entities. Maybe I should distinguish between in-universe identity (what readers experience) and creative lineage (the author's process). 

  For the co-written book... oof. The publisher's branding choice complicates things. The procedure must separate legal naming from creative essence. If the co-writer introduced new thematic layers, that might tip the balance toward "different work" despite the outline.

  Most importantly, the system must honor that writing isn't shipbuilding. Some tests will fail by design because art resists binary categorization. That's not a flaw - it's why we need the procedure to explicitly say "Here's where you decide."
answer: |-
  Here's a procedural framework based on core philosophical identity criteria, translated into practical tests for a novelist. The tests are sequenced from most objective to most subjective, with clear thresholds and explicit "judgment call" points. It prioritizes *settling* the question where possible and flags ambiguous cases.

  **The Identity Test Procedure for Narrative Works:**

  1.  **Test 1: Core Narrative Function (Teleology / Purpose)**
      *   **Question:** Does the current entity serve the same fundamental *purpose* or *intent* as the original within its narrative context?
      *   **Novelist's Question:** What was the core *why* of the original? (e.g., "Explore guilt through a failed marriage," "Solve the locked-room murder at the manor," "Show the cost of ambition in politics").
      *   **Threshold - Same:** The core purpose remains demonstrably central and unchanged. Minor thematic additions/explorations are acceptable.
      *   **Threshold - Different:** The core purpose has been replaced or fundamentally subverted (e.g., a mystery becoming a romance; a character study becoming a political thriller).
      *   **Settling Power:** **High.** If this differs, the entity is *different*. Proceed only if "Same".
      *   **Judgment Call?** Defining the "core purpose" requires authorial judgment, but *once defined*, the comparison is relatively clear.

  2.  **Test 2: Causal Continuity (Spatio-Temporal Path / Origin)**
      *   **Question:** Is the current entity the direct, unbroken causal result of modifications to the original entity?
      *   **Novelist's Question:** Did this entity evolve *directly* from the previous version through a continuous chain of authorial decisions *aimed at modifying that specific entity*? (e.g., Draft 2 was *revising* Draft 1; Book 2's character was *intended as the continuation* of Book 1's character).
      *   **Threshold - Same:** The entity was created *by modifying the prior version*, not created anew independently, even if the changes were extensive.
      *   **Threshold - Different:** The entity was created *de novo* (from scratch) and merely incorporates *ideas* or *inspiration* from the prior entity, or the chain of direct modification was broken (e.g., you deleted the file and started over; you created a new character sheet unrelated to the old one).
      *   **Settling Power:** **High.** If causal continuity is broken, the entity is *different*. Proceed only if "Same" OR if core function also differs (confirming difference).
      *   **Judgment Call?** Assessing the *intent* and *process* of creation is key. Was it revision or replacement?

  3.  **Test 3: Structural Continuity (Form / Pattern)**
      *   **Question:** Does the current entity retain the essential structural framework or relational pattern of the original?
      *   **Novelist's Question:**
          *   *Novel/Series:* Do the core structural elements remain? (e.g., Key plot beats/arcs; Central relationships/dynamics; Primary setting/context; Narrative POV/voice *style* - even if specific sentences change).
          *   *Character:* Does the character retain the core defining relationships, role within the plot, or fundamental internal conflict/drive? (e.g., "The detective solving the case," "The mentor guiding the protagonist," "The character struggling with loyalty vs. ambition").
      *   **Threshold - Same:** The essential structural skeleton remains intact, even if details flesh it out differently. Significant *additions* are acceptable if the core remains.
      *   **Threshold - Different:** The core structure/pattern/role has been fundamentally dismantled and replaced (e.g., Protagonist becomes antagonist; The manor mystery plot is replaced by a corporate espionage plot; The mentor character becomes the main villain with a wholly new role).
      *   **Settling Power:** **Medium-High.** A "Different" result strongly indicates a new entity, especially combined with significant material change. A "Same" result, especially after passing Tests 1 & 2, strongly indicates persistence.
      *   **Judgment Call?** Defining the "essential structural skeleton" requires judgment, but comparing key narrative blueprints (outlines, character role descriptions) can make this concrete.

  4.  **Test 4: Material Continuity (Substance)**
      *   **Question:** Does any identifiable, non-trivial material from the original entity persist in the current entity?
      *   **Novelist's Question:** Are there specific, concrete elements carried over? (e.g., Sentences, paragraphs, scenes; Character name, specific key memories/traits/actions; Series title, core setting, core characters).
      *   **Threshold - Same:** At least *some* non-trivial, identifiable material persists unchanged (e.g., a pivotal scene, a character's core trauma, the series protagonist).
      *   **Threshold - Different:** *No* concrete, identifiable material survives unchanged. Everything has been replaced or so fundamentally altered it's unrecognizable *as the original element*.
      *   **Settling Power:** **Low Alone, Medium with Context.** Failure here doesn't *necessarily* mean difference if the other tests pass (see Ship of Theseus paradox). Success here *supports* sameness if other tests also pass or are ambiguous.
      *   **Judgment Call?** Defining "non-trivial" and "identifiable" requires judgment. Is a character name alone "non-trivial"? Usually not.

  **Procedure Flow:**
  1.  Run **Test 1 (Function)**. If "Different," **STOP: Different Entity.** If "Same," proceed.
  2.  Run **Test 2 (Causal Continuity)**. If "Different," **STOP: Different Entity.** If "Same," proceed.
  3.  Run **Test 3 (Structure)**.
      *   If "Same," proceed to Test 4 (Material) for confirmation/support, but **Likely Same Entity.**
      *   If "Different," **Likely Different Entity.** Proceed to Test 4 to confirm.
  4.  Run **Test 4 (Material)**.
      *   If Test 3 was "Same," Test 4 result (Same or Different) is supportive but not definitive. **Likely Same Entity.**
      *   If Test 3 was "Different," and Test 4 is also "Different," **Confirm Different Entity.**
      *   If Test 3 was "Different," but Test 4 is "Same," **AMBIGUOUS - Judgment Call Required.** (Is the surviving material significant *enough* to anchor identity despite structural change?).

  **Applying the Procedure:**

  **Case 1: The Eleven-Draft Novel**
  *   **Test 1 (Function):** *Presumably Same.* (You imply the core thematic drive or genre intent likely remained, even if expressed differently).
  *   **Test 2 (Causal Continuity):** **Same.** Each draft was a direct revision of the previous one. Unbroken chain of modification.
  *   **Test 3 (Structure):** *Likely Different.* You state "nothing survives," including plot and protagonist. This strongly suggests the *core structural framework* (the specific plot arc, the central character's role/journey) was replaced, not just modified. Key relationships and dynamics likely shifted fundamentally.
  *   **Test 4 (Material):** **Different.** "Not a single sentence" survives.
  *   **Result:** **Likely Different Entity.** Test 2 (Causal) passes, but Test 3 (Structure) fails decisively, and Test 4 (Material) confirms the lack of concrete persistence. The core *form* changed, even if the *intent* (Test 1) and *lineage* (Test 2) remained. Your gut ("same") conflicts, likely due to Test 2 (the decade of labor) and nostalgia. Philosophically, this leans towards the Structuralist view: identity requires persistence of form. The procedure gives you the answer you suspected you might hate.

  **Case 2: The Character Across Four Books**
  *   **Test 1 (Function):** *Potentially Variable.* Did the character's *core narrative role* change? (e.g., Was she always "the protagonist's conflicted ally"? Or did she shift from ally to antagonist to mentor?). **Judgment Call Needed on Core Function per book.** *Assume "Changed" for this test if role shifted fundamentally.*
  *   **Test 2 (Causal Continuity):** **Same.** Each iteration was intended as the *same character* in the next book, revised within the series context.
  *   **Test 3 (Structure):** *Likely Different.* New backstory, voice, and goals each book imply the *core internal structure* (motivation, history, personality expression) and potentially *core relationships/role* were replaced, not evolved. The name is a placeholder filled with different content.
  *   **Test 4 (Material):** **Same (Minimally).** The name persists. (Is this "non-trivial"? Arguably yes for a character, as it's the primary identifier).
  *   **Result:** **AMBIGUOUS / Likely Different Entities.** Test 2 passes (lineage), and Test 4 passes minimally (name). However, Test 1 (Function/Role) may have changed, and Test 3 (Structure) likely failed significantly each time. The persistence of the name (Material) and authorial intent (Causal) creates tension with the lack of persistent structure/function. **Strong Judgment Call Required:** Does the *name alone*, combined with the *authorial intent of continuity* (Test 2), outweigh the complete overhaul of substance, structure, and potentially function each time? *Realistically, for readers and narrative coherence, each book likely presents a* **Different Character** *wearing the same name tag.* Your gut ("same") is heavily influenced by Test 2 (intent).

  **Case 3: Co-Written Series Installment**
  *   **Test 1 (Function):** **Same.** It follows your outline and characters, implying the core plot function, character arcs, and likely thematic purpose remain intact.
  *   **Test 2 (Causal Continuity):** **Ambiguous/Leans Different.** While based on your outline (a prior state), the *prose execution* was done by another person. It's not a direct modification of *your prior draft* by you. It's a new implementation based on your blueprint. The causal chain for the *manuscript* is broken; it's a new artifact built to your specs. The *story* has continuity via the outline.
  *   **Test 3 (Structure):** **Same.** Your outline defined the core structure (plot beats, character journeys, relationships). The co-writer implemented this structure.
  *   **Test 4 (Material):** **Different.** "Mostly someone else's prose." Your original manuscript material isn't present; new prose fills the structure.
  *   **Result:** **AMBIGUOUS / Judgment Call Leaning Same.** This case highlights the difference between the *story* (Structure/Function) and the *manuscript* (Material/Causal Execution). Test 1 (Function) and Test 3 (Structure) pass, indicating the *narrative entity* is the same. Test 2 (Causal Continuity of the *manuscript*) is broken, and Test 4 (Material) fails, indicating the *physical text* is a different entity. **Judgment Call:** What are you asking about? The *narrative/story installment* in the series? **Same.** (It fulfills the same function and structure in the series sequence). The *specific manuscript artifact*? **Different.** (It's a distinct textual object created by a different primary author). Your name on the cover reflects authorship of the *story/outline* (the design), not necessarily the specific prose execution. Your gut ("same") is correct for the *narrative*, but not for the *textual artifact*.

  **Conclusions & Caveats:**

  1.  **Narrative Identity is Multilayered:** This procedure shows identity isn't binary. A *story* can persist while the *text* changes entirely (Case 1 & 3). A *character concept* can persist in name/intent while the *actual depicted character* changes (Case 2). A *series entry* can be the same narratively while the *manuscript* is different (Case 3).
  2.  **Structure & Function Rule:** Tests 1 (Function) and 3 (Structure) are the most decisive for narrative identity. If these change, the entity is different, regardless of lineage (Test 2) or residual material (Test 4). Case 1 failed here.
  3.  **Causal Continuity is Author-Centric:** Test 2 reflects *your process* and intent. It explains why *you* feel continuity (especially in Cases 1 & 2), but it doesn't guarantee narrative identity for the *reader* if structure/function changes.
  4.  **Material is Weakest:** Test 4 (Material) is easily lost in narrative evolution. Its absence alone doesn't destroy identity if Structure/Function remain (Ship of Theseus), but its presence can support identity in ambiguous cases.
  5.  **Judgment is Inescapable:** Defining core purpose (T1), essential structure (T3), and non-trivial material (T4) requires your authorial perspective. Ambiguous results (like Case 2 and aspects of Case 3) force a judgment call based on what *you* consider the core of the entity.
  6.  **Your Gut vs. The Procedure:** Your gut feeling of "sameness" heavily weights causal continuity (T2 - your labor and intent) and potentially minimal material persistence (T4 - a name). The procedure challenges this by prioritizing the persistence of the actual narrative *structure* and *function* (T1 & T3) as experienced by the reader.

  **Recommendation:** Use this procedure to clarify *what aspect* of your work has persisted and what has changed. It likely confirms that while the *process artifact* (the file, the labor history) has continuity, the *narrative entity itself* in Case 1 (and possibly Case 2) has become something new. This doesn't invalidate your decade of work; it simply recognizes the transformative power of revision. For Case 3, it clarifies the distinction between the story and the prose. This framework arms you with concrete criteria to move beyond "gut feeling" and make informed decisions about how you discuss and present these works.
