  Philosophy of bio student here, currently writing my term paper for a course where we spent like two weeks on the Gould–Lewontin spandrels critique. My professor is a big fan of Elisabeth Lloyd's byproduct account of the female orgasm (that it's basically the developmental byproduct of selection on the male orgasm, like male nipples), and I bought it at first but now I'm second-guessing myself. So here's my question: what's your actual credence that the female orgasm is a nonadaptive byproduct rather than an adaptation in its own right? I don't want "it depends on how you define adaptation" -- I want a number. But decompose the reasoning for me: how much rides on the comparative evidence (the stuff about orgasm and ovulation-triggering in other species, whether the byproduct story actually explains why it's so variable between women), how much on whether the proposed adaptive functions (the upsuck hypothesis, the pair-bonding story) are genuinely dead or just badly tested, how much on a general prior about how often complex biological features turn out to be spandrels vs adaptations, and any other terms you think belong. Give each a rough probability with one line of justification, then combine them. Finally, tell me which sub-question your final number is most sensitive to, and what evidence would actually move it the most. For context, I'm sitting at like 0.55 myself and my TA seems to be closer to 0.9, so I'd also be curious where you think the disagreement between those two positions most likely lives.
