  Okay, let me tackle this philosophy of biology student's question. They're writing a term paper on the Gould-Lewontin spandrels critique and are specifically focused on Elisabeth Lloyd's byproduct theory of the female orgasm. They want a numerical credence that it's a nonadaptive byproduct rather than an adaptation, with decomposed reasoning. 

