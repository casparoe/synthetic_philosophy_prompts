prompt: |-
  I work as a country analyst for a food-security early-warning service. Our bulletins currently tag each emerging crisis as either a natural disaster (drought, flood, pest) or a political emergency, and the tag drives our recommendation: food aid shipments versus pressure on the government over procurement, pricing, and export policy. I've been reading about Sen's entitlement approach and want it turned into something I can actually use. Please write a decision procedure I can run in the first weeks of a suspected crisis, using only data that arrives quickly (market prices, wage series, distress sales of livestock and land, migration, grain movements) rather than mortality figures, which come too late to matter. The procedure should start, as Sen insists, from who has lost the ability to command food and why, rather than from aggregate food availability — but it must also say when availability really is the binding constraint, so we don't deny aid to a genuine harvest collapse. Specify the questions to ask in order, what counts as a sufficient answer to each, at what point the classification shifts from natural disaster to political failure, and where the procedure has to stop and hand the call to human judgment. Then run it on three scenarios: (1) a 20% harvest shortfall in a functioning market economy where wages hold; (2) a normal-harvest year in which inflation and lost purchasing power price grain out of reach of rural laborers, on the Bengal 1943 pattern; (3) a blight-driven harvest failure in a country whose government keeps exporting grain to service contracts, as in the Irish and late-Soviet cases. Include where the procedure gives an answer our donors won't like — such as laying the crisis at an ally's policy — and be explicit about what the procedure cannot settle.
reasoning: |-
  We are creating a decision procedure based on Sen's entitlement approach, which focuses on the ability of different groups to command food through legal means available in the society (e.g., production, trade, labor, inheritance, transfer). The goal is to classify the crisis as either a natural disaster (where aggregate food availability is the binding constraint) or a political emergency (where the distribution and access mechanisms are failing, even if aggregate availability is adequate). We will use early and quickly available data.

  The procedure is structured as a decision tree with sequential questions. We start with the most immediate indicators and move to more complex ones. We must also determine when to stop and rely on human judgment.

  **Key Indicators:**
  1. **Market prices:** Sharp increases in food prices, particularly in affected regions.
  2. **Wage series:** Changes in real wages (especially for rural laborers).
  3. **Distress sales:** Reports of distress sales of productive assets (livestock, land) by vulnerable groups.
  4. **Migration:** Unusual patterns of migration (especially from rural to urban areas or to other regions).
  5. **Grain movements:** Data on grain flows (exports, imports, internal trade, government procurement and distribution).

  **Decision Procedure:**

  **Step 1: Check for sudden shifts in food prices.**
     - **Question:** Have food prices (especially staple grains) risen sharply in the affected region(s) relative to the national average and relative to the previous season? And relative to non-food prices?
     - **Sufficient answer:** A sharp rise (e.g., more than 30% above the usual seasonal variation) in the affected region(s) that is not matched by similar rises in non-food prices and that is above the national average (if available) is a strong indicator of an access problem. But note: if the price rise is widespread and not just in isolated regions, it might indicate a broader availability issue.
     - **Follow-up:** Compare the price rise with changes in wages and other income sources (for the vulnerable groups) to see if purchasing power is eroding.

  **Step 2: Examine wage and employment data.**
     - **Question:** For the vulnerable groups (e.g., landless laborers, smallholders), are nominal wages keeping pace with food inflation? If not, what is the change in real wages?
     - **Sufficient answer:** A significant decline (e.g., more than 20%) in real wages (or a failure of wages to rise in line with food prices) for vulnerable groups indicates a loss of entitlement through the labor mechanism. This is a key sign of an entitlement failure even without a harvest shortfall.

  **Step 3: Look for distress sales of assets.**
     - **Question:** Are there reports of distress sales of productive assets (livestock, land, tools) by vulnerable groups? And are these sales at prices below normal?
     - **Sufficient answer:** An increase in such sales (especially if they are at depressed prices) is an indicator that households are coping by depleting their productive base, which is a sign of severe entitlement failure and future vulnerability.

  **Step 4: Monitor migration patterns.**
     - **Question:** Is there unusual migration (e.g., from rural areas to cities or to other regions) that is driven by food insecurity? (Note: This may be harder to quantify quickly, but reports from local sources can help.)
     - **Sufficient answer:** Reports of significant migration that is attributed to food shortages or loss of livelihoods (as opposed to other factors like conflict) can be a sign of entitlement failure.

  **Step 5: Track grain movements.**
     - **Question:** What is happening to grain flows? Specifically, is grain moving out of the affected region (either through exports or to other regions within the country) while the local population faces shortages? Is the government continuing to procure grain for export or for stockpiling? Is there evidence of hoarding by traders?
     - **Sufficient answer:** If grain is leaving the affected region despite local shortages and rising prices, it points to a failure of distribution and entitlement protection. This is a strong indicator of a political emergency.

  **Step 6: Assess aggregate availability.**
     - **Question:** What is the overall food availability in the country/region? (We use early harvest forecasts, satellite data, and trade data to estimate aggregate supply, but note that these are imperfect and may not be available immediately. However, we are looking for a major shortfall that could explain the crisis.)
     - **Sufficient answer:** If there is a significant (e.g., >15%) shortfall in aggregate production and the crisis is widespread, then the natural disaster tag may be appropriate. However, even in such cases, we must check whether the crisis is being exacerbated by policy failures (like exports) that turn a natural disaster into a famine.

  **Decision Rules for Classification:**
  - **Natural disaster:** The crisis is driven by a significant aggregate shortfall (Step 6) and there is no evidence of major entitlement failures (i.e., no sharp price rises relative to wages, no distress sales, no grain movements out of the region). However, note that even in a natural disaster, if the government fails to respond appropriately (e.g., by allowing exports) then it becomes a political emergency.
  - **Political emergency:** The crisis occurs despite adequate aggregate availability (Step 6 does not show a major shortfall) OR even if there is a shortfall, the crisis is being made worse by policy failures (e.g., exports during a shortfall, failure to provide transfers, price controls that disrupt markets) and there is evidence of entitlement failure (Steps 1-5). In particular, if we see:
    - Sharp price rises without corresponding wage increases (Steps 1 and 2)
    - Distress sales (Step 3)
    - Migration due to hunger (Step 4)
    - Grain moving out of the affected region (Step 5)

  **Handoff to Human Judgment:**
  - The procedure stops and requires human judgment when:
    1. Data is conflicting or unavailable for key steps (e.g., we have price spikes but no wage data, and we cannot determine real wages).
    2. There is evidence of both a significant aggregate shortfall and major policy failures (e.g., the government is exporting during a shortfall). In such cases, the crisis may be a compound of both, and the response may need to address both.
    3. When the crisis is unfolding in a complex environment (e.g., conflict zones) where data is particularly unreliable or where multiple factors are at play.

  **Now, apply the procedure to the three scenarios:**

  **Scenario 1: A 20% harvest shortfall in a functioning market economy where wages hold.**
  - Step 1: Food prices rise sharply in the affected region (due to shortfall) but non-food prices are stable. National average prices may also rise but less sharply. → Indicator of a problem.
  - Step 2: Nominal wages rise in line with food inflation (or real wages hold). → No entitlement failure via labor.
  - Step 3: No distress sales of assets. → No sign of severe coping.
  - Step 4: No unusual migration. → No sign of distress migration.
  - Step 5: Grain movements: Grain may flow into the region from other regions or imports (if the market is functioning). → No evidence of grain leaving the region.
  - Step 6: Aggregate availability is down by 20%, which is significant.

  **Classification:** Natural disaster. The binding constraint is aggregate availability. The market is functioning (wages adjust, no distress sales, grain flows in) so the crisis is due to the harvest shortfall. Recommendation: food aid shipments to supplement availability.

  **Scenario 2: Normal-harvest year with inflation and lost purchasing power for rural laborers (Bengal 1943 pattern).**
  - Step 1: Sharp rise in food prices, while non-food prices are relatively stable (or rise less). → Strong indicator.
  - Step 2: Real wages for rural laborers fall significantly because wages do not keep up with food inflation. → Clear entitlement failure via labor.
  - Step 3: Distress sales of assets are reported. → Households are coping by selling assets.
  - Step 4: Migration increases from rural areas to cities in search of work and food. → Distress migration.
  - Step 5: Grain movements: Grain may be moving out of rural areas to urban centers or for export (as in Bengal, where grain was diverted for the war effort). → This is a key indicator of political failure.
  - Step 6: Aggregate availability is normal (or even above average). → No aggregate shortfall.

  **Classification:** Political emergency. The crisis is due to a failure of entitlements: laborers cannot command food because their wages are too low relative to prices, and grain is being diverted. The government's policies (or lack thereof) are failing to protect the vulnerable. Recommendation: pressure on the government over procurement, pricing, and export policies, and possibly direct transfers to laborers.

  **Scenario 3: Blight-driven harvest failure in a country that continues exporting grain (Irish and late-Soviet cases).**
  - Step 1: Sharp rise in food prices in the affected region. → Indicator of problem.
  - Step 2: Real wages may fall if employment in agriculture drops and wages don't adjust upward (or if inflation erodes them). → Likely entitlement failure.
  - Step 3: Distress sales of assets occur. → Coping mechanism.
  - Step 4: Migration may occur (e.g., in the Irish case, mass migration). → Distress migration.
  - Step 5: Grain movements: Exports continue despite the shortfall. → This is a critical policy failure.
  - Step 6: Aggregate availability is down (due to blight) but the country is still exporting. → The government is exacerbating the shortfall by reducing domestic availability.

  **Classification:** Political emergency. Although there is a natural disaster (harvest failure), the government's policy of continuing exports turns it into a famine. The binding constraint is not just the harvest but the policy. This may be unpopular with donors if the government is an ally. Recommendation: pressure on the government to halt exports and release grain stocks, plus humanitarian aid to fill the gap.

  **Where the procedure gives an answer donors won't like:**
  - In Scenario 3, the procedure clearly points to the government's export policy as a key factor. If the government is an ally of the donors, they may be reluctant to apply pressure. The procedure, however, must call it as it is: a political emergency requiring policy change.

  **What the procedure cannot settle:**
  - The procedure cannot determine the exact magnitude of the crisis (number of people affected, severity) without mortality or malnutrition data, which come late.
  - It cannot account for all local variations, especially in large and diverse countries.
  - It cannot fully capture the impact of informal safety nets or community support.
  - In complex emergencies (e.g., with conflict or governance breakdown), the data may be too scarce or unreliable, and human judgment is essential.

  **Final Note:** This procedure is a systematic way to apply Sen's ideas. However, it requires timely and reliable data. In practice, the analyst must be ready to update the classification as new data arrives and to use their judgment when the data is ambiguous.
answer: |-
  Here's a decision procedure translating Sen's entitlement approach into actionable steps for crisis classification, using rapid-onset indicators. The core logic: **Track changes in *ability to acquire food* across key groups, then verify aggregate availability.**

  ### Decision Procedure: Entitlement Failure Assessment (EFA)
  **Phase 1: Identify Vulnerable Groups (First 48-72 Hours)**  
  *Question: Which group’s consumption is most threatened?*  
  - **Sources:** Local field reports, labor union data, NGO alerts.  
  - **Sufficient Answer:** Pinpoint 1-2 groups facing earliest distress signals (e.g., "landless laborers in District X report skipped meals"). Proceed if a specific group is identified; else escalate to human judgment.

  **Phase 2: Diagnose Entitlement Failure Mechanism (Days 3-10)**  
  *Ask sequentially until one mechanism is confirmed:*

  1. **Labor Entitlement Collapse?**  
     *Question: Is real wage decline outpacing food price inflation for the vulnerable group?*  
     - **Sources:** Daily wage data (farm/construction), grain price indices.  
     - **Sufficient Answer:** Real wages down >15% YoY in affected zone → **Labor entitlement failure.** Proceed to Phase 3.  
     - *If wages stable:* Move to Q2.

  2. **Trade Entitlement Collapse?**  
     *Question: Are distress sales of productive assets (livestock/land) surging while food prices rise?*  
     - **Sources:** Market inventories (trader surveys), land registry anomalies.  
     - **Sufficient Answer:** Livestock sales >30% above seasonal norm + land transactions up >20% → **Trade entitlement failure.** Proceed to Phase 3.  
     - *If no distress sales:* Move to Q3.

  3. **Transfer Entitlement Collapse?**  
     *Question: Are remittances/migration spiking from the vulnerable group’s region?*  
     - **Sources:** Money transfer flows, bus/train occupancy, border post data.  
     - **Sufficient Answer:** Migration/remittances >25% above normal → **Transfer entitlement failure.** Proceed to Phase 3.  
     - *If no migration surge:* Move to Q4.

  4. **Production Entitlement Collapse?**  
     *Question: Is crop loss localized to the vulnerable group’s own farms?*  
     - **Sources:** Satellite imagery (NDVI), crop trader loss estimates.  
     - **Sufficient Answer:** Yield loss >25% for smallholders only → **Production entitlement failure.** Proceed to Phase 3.  
     - *If losses broad:* Proceed to Phase 3.

  **Phase 3: Test Aggregate Availability (Days 7-14)**  
  *Question: Is net grain availability (production + imports - exports) ≥90% of baseline demand?*  
  - **Sources:** Customs data, miller/trader stocks, port manifests.  
  - **Sufficient Answer:**  
    - **Availability ≥90%:** Crisis is **political emergency** (entitlement failure dominant).  
    - **Availability <90%:** Move to Phase 4.  

  **Phase 4: Policy Stress Test (Critical for Availability <90%)**  
  *Question: Are grain flows exacerbating shortage?*  
  - **Sources:** Export licenses, railway shipment logs, market price arbitrage gaps.  
  - **Sufficient Answer:**  
    - Exports >5% of pre-crisis volume OR subsidized urban shipments continuing → **Political emergency** (policy failure turns natural disaster into famine).  
    - No adverse grain flows → **Natural disaster** (availability is binding constraint).  

  ### Classification Thresholds
  - **Natural Disaster:** Only if Phase 3 shows availability <90% *and* Phase 4 shows no adverse policy.  
  - **Political Emergency:**  
    - Any entitlement failure (Phase 2) + adequate aggregate availability (Phase 3 ≥90%), OR  
    - Adverse policy in Phase 4 (even with availability <90%).  

  ### Handoff to Human Judgment When:
  1. Data conflict (e.g., wages stable but distress sales surge).  
  2. Vulnerable group unclear (e.g., urban vs. rural poor both struggling).  
  3. "Gray zone" availability (85-90% of demand).  
  4. Geopolitical sensitivities override data (e.g., ally implicated).  

  ---

  ### Scenario Testing
  **Scenario 1: 20% Harvest Shortfall, Functioning Markets, Stable Wages**  
  - **Phase 1:** Landless laborers report food anxiety.  
  - **Phase 2:**  
    - Q1: Real wages unchanged → No labor failure.  
    - Q2: No distress asset sales → No trade failure.  
    - Q3: Migration normal → No transfer failure.  
    - Q4: Harvest loss broad (all farms) → Proceed to Phase 3.  
  - **Phase 3:** Availability = 80% of demand (<90%) → Proceed to Phase 4.  
  - **Phase 4:** No exports/grain hoarding → **Natural disaster.**  
  *Recommendation: Food aid shipments.*  

  **Scenario 2: Normal Harvest, Inflation Erodes Wages (Bengal 1943)**  
  - **Phase 1:** Rural laborers unable to buy rice.  
  - **Phase 2:**  
    - Q1: Real wages down 40% (prices up, wages flat) → **Labor entitlement failure.**  
  - **Phase 3:** Availability = 105% of demand (normal harvest) → **Political emergency.**  
  *Recommendation: Pressure government on price controls/rationing. Donor friction: Must confront ally over wage suppression policies.*  

  **Scenario 3: Blight-Driven Shortfall, Continued Exports (Ireland 1845/Soviet 1932)**  
  - **Phase 1:** Small farmers starving.  
  - **Phase 2:** Q4: Crop loss confirmed → Proceed to Phase 3.  
  - **Phase 3:** Availability = 75% of demand (<90%) → Proceed to Phase 4.  
  - **Phase 4:** Exports at 100% of pre-crisis volume → **Political emergency.**  
  *Recommendation: Demand export halt + aid. Donor friction: Accusing ally of famine-creation.*  

  ---

  ### Limitations & Unsettled Issues
  1. **Data Gaps:** Silent on intra-household gender disparities (e.g., women eating last).  
  2. **Informal Economies:** Cannot capture black-market price distortions fully.  
  3. **Non-Food Factors:** Ignores health/sanitation collapse amplifying famine.  
  4. **Causality Uncertainty:** Cannot prove malice (e.g., exports due to corruption vs. debt obligations).  
  5. **Elite Capture:** Misses local power dynamics blocking aid (e.g., warlords diverting shipments).  

  **Operational Note:** This procedure flags *mechanism*, not severity. Pair with rapid nutrition surveys (MUAC screenings) to triage response scale. When policy failure is indicated, supplement with political economy analysis to tailor pressure tactics.
