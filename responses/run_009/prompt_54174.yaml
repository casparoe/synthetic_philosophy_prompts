prompt: |-
  I teach a graduate seminar in philosophy of cognitive science, and I've coined a label for an argument form my students keep gesturing at: complexity-theoretic debunking. The argument runs as follows. Cognitive science attributes to humans a task — belief revision, planning, tracking the mental states of many agents at once — whose general form is NP-hard or worse; since humans lack the time and memory that exact solution requires, the faculty cannot be doing what the theory says it does; therefore the theory misdescribes cognition. Before we assess particular uses of the argument, I want the standards fixed. Please write the desiderata a psychological theory must meet to be immune to complexity-theoretic debunking: what it must establish about the task as humans actually confront it rather than in the worst case, what room remains for approximation and satisficing without collapsing into saying the theory was wrong all along, what tractability should even mean for a bounded agent, and what a debunker is entitled to conclude from a bare hardness result. Give the motivating case behind each requirement, and flag within an item any tension you suspect it cannot jointly satisfy with another. Please respond with exactly five numbered desiderata, each a sentence or two, with no introduction or conclusion, and use American English spelling throughout.
reasoning: |-
  Okay, let me approach this complexity-theoretic debunking problem systematically. The professor wants five crisp desiderata for psychological theories to avoid being undermined by computational hardness arguments. 

  First, I recall that NP-hardness describes worst-case scenarios that may not reflect real-world instances. Humans likely face structured inputs with exploitable regularities, so the first desideratum should require characterizing real problem distributions - perhaps citing vision science where hard problems become tractable due to natural constraints.

  Second, approximation needs clear handling. Theories shouldn't claim exact solutions if cognition uses heuristics, but we must distinguish between "good enough" approximations versus fundamentally mistaken descriptions. Resource-rational modeling could be a good reference point here.

  Third, tractability definitions must respect biological constraints. Unlike Turing machines, neural systems have intrinsic parallelism and noise tolerance - connectionist models demonstrate this well. This might conflict with desideratum two's precision requirements.

  Fourth, debunkers must justify worst-case relevance. If they cite hardness without showing worst cases occur in cognition, like certain planning problems that rarely manifest, their argument weakens considerably.

  Fifth, theories deserve credit for satisficing strategies. Many cognitive tasks (e.g. intuitive physics) use fast approximations rather than exact solutions - prospect theory in economics illustrates this principle. This links back to desideratum two but emphasizes descriptive adequacy over normative ideals.

  Throughout, I'll watch for tensions between approximation validity and theoretical accuracy, plus conflicts in defining tractability for wetware versus algorithms. The examples should anchor each point in cognitive science practice.
answer: |-
  Here are five numbered desiderata:

  1. **Characterize the actual input distribution:** The theory must specify the statistical properties or structural constraints of problem instances humans typically encounter, demonstrating they differ from worst-case scenarios that drive hardness results. Motivating case: Vision research shows NP-hard problems become tractable under natural image statistics despite worst-case complexity.

  2. **Define valid approximation criteria:** It must establish performance thresholds (e.g., bounded error rates, satisficing goals) that count as successful task completion, showing these are achievable with tractable methods. Motivating case: Approximate Bayesian models achieve descriptive adequacy without exact computation, avoiding collapse into falsity if deviations stay within empirically observed tolerance.

  3. **Articulate resource-bound tractability:** Tractability must be defined relative to human-scale time, memory, and neural architecture—not asymptotic complexity—with evidence that proposed mechanisms operate within these bounds. Motivating case: Connectionist models implement parallel processing that circumvents serial complexity barriers, though this risks tension with desideratum 2 if approximation criteria lack mathematical rigor.

  4. **Demonstrate worst-case irrelevance:** The theory should provide empirical or analytical justification that pathological instances triggering intractability rarely or never occur in ecological contexts. Motivating case: Human planning avoids combinatorial explosions by leveraging spatial and temporal locality, rendering worst-case planning problems non-ecological; failure here creates tension with desideratum 1's demand for distributional specificity.

  5. **Credit satisficing strategies:** Where exact solutions are intractable, the theory must receive credit if it accurately describes satisficing heuristics actually used, rather than being dismissed for not modeling exact computation. Motivating case: Prospect theory’s rank-dependent probability weighting explains choices better than exact expected utility despite the latter’s normative status, illustrating immunity to debunking via descriptive adequacy.
