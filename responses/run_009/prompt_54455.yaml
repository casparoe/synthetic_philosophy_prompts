        - The third version: requires an improper prior with infinite expectation, which cannot be simulated on a finite machine.

     The residue report:

        What translates cleanly:

          - The structure of the random variables: we model the pair of envelopes with a random variable S (the smaller amount) and an indicator I for which envelope we picked. Then Z = S*(1+I) and the other envelope is W = S*(2-I). All the algebra of expectations and conditioning is standard probability.

