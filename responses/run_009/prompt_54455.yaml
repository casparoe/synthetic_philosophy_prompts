          - The lesson about decision theory: the paradox might be used to argue that we should condition on the observed amount. But our analysis shows that conditioning is valid and leads to the correct conditional expected gain, which may be positive or negative depending on the observed amount. The issue is not with conditioning per se but with the assumption of equal probabilities without a proper distribution.

