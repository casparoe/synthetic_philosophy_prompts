answer: |-
  ### What the two sides actually want
  The patchers aim to salvage Bayesianism's internal coherence by developing formal adjustments that allow old evidence to confirm new theories. They seek a *technical fix* within the probability calculus—like conditioning on entailment discovery—to preserve Bayesianism as a complete logic of confirmation. The dissolvers, however, want to expose a *fundamental limitation* of Bayesianism: its inability to model conceptual revolutions. They argue the "problem" is a pseudo-issue arising from idealizing agents with static hypothesis spaces, and demand redirecting focus to how theories are invented, not just evaluated. Patchers prioritize saving the formalism; dissolvers prioritize diagnosing its incompleteness.

  ### Verbal or real, and why
  The disagreement is **real and substantive**, rooted in conflicting views of Bayesianism's scope. Patchers treat confirmation as a *synchronic logical relation* between theory and evidence, solvable by tweaking probability assignments (e.g., P(GR entails evidence) < 1 pre-discovery). Dissolvers see confirmation as *diachronic and historical*, requiring modeling how new theories emerge—a process Bayesianism’s fixed-hypothesis-space framework explicitly excludes. The entailment "patch" fails for dissolvers because it either:  
  - Smuggles in counterfactual priors over unrealized theories (begging the question), or  
  - Makes confirmation depend on agents’ ignorance of logical implications (a subjective artifact).  
  Patchers accept this trade-off as necessary; dissolvers deem it a fatal concession that Bayesianism cannot handle scientific change. This isn’t about words—it’s about whether Bayesianism is *broken* or merely *unfinished*.

  ### Where the hidden question sits
  The core rift concerns **temporal ontology in epistemology**: Is confirmation a timeless logical relation, or an irreducibly historical process? Patchers implicitly endorse the former; dissolvers the latter. This manifests in two hidden questions:  
  1. **What is being confirmed?** Patchers focus on *theories-as-logical-structures*; dissolvers on *theories-as-historical-entities* (e.g., GR *as it was proposed*).  
  2. **What does "learning" mean?** For patchers, learning is *adding propositions to a fixed space*; for dissolvers, it includes *expanding the hypothesis space itself*.  
  The dissolver’s objection that entailment patches are "circular" reveals this: They demand a model where the theory’s *existence* is part of the evidence-update, not its entailments alone. The patcher’s machinery lacks resources for this.

  ### What progress would even look like
  Progress requires **integrating diachronic theory-generation into confirmation models**. Concretely:  
  - A formal account of *how hypothesis spaces evolve* during scientific revolutions, perhaps using dynamic logics or category theory.  
  - A demonstration that *post-hoc confirmation by old evidence* emerges naturally when modeling theory-creation (e.g., showing GR’s fit to Mercury’s data increases *because* it solved a known anomaly).  
  - Crucially, it must avoid *ad hoc* fixes (e.g., pretending agents forgot evidence) while respecting that confirmation is *agent-relative but not arbitrary*. Success would be a model where:  
    (a) Old evidence confirms *because* it was historically unexplained,  
    (b) Bayesian updates play a role *after* theory-creation,  
    (c) Conceptual innovation isn’t reduced to logical deduction.  
  Short of this, the debate remains stalemated: Patches feel unsatisfying; dissolution feels like surrender. The literature stalls because the target—modeling insight—is deeper than Bayes alone.
