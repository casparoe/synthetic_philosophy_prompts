  ### Thought Experiment: "The Gardener's Directive"

  **Scenario:**  
  Agnes, an 82-year-old retired botanist with moderate Alzheimer’s dementia, resides in a care home. She is generally content: she smiles at staff, hums along to music, enjoys tending potted plants on the sunlit patio (with supervision), and recognises her daughter’s weekly visits with apparent warmth, though she cannot name her. Agnes signed a valid advance directive 18 months prior, while still capacitous, witnessed by her GP and solicitor, explicitly refusing antibiotics for pneumonia or other life-threatening infections. The directive states: "I dread becoming a burden, dependent on others for my most basic needs. Should dementia take my mind, do not prolong my existence with medical interventions. Let nature take its course." This was drafted shortly after her husband’s sudden death, amid intense grief where she repeatedly told her daughter, "I can’t face lingering on alone, useless and empty." Agnes now develops pneumonia. Without antibiotics, she will likely die; with them, she will almost certainly recover to her current baseline of placid, engaged contentment. Her daughter, citing the directive, requests palliative care only. The care home seeks an ethics consultation.

  ---

  ### Verdicts by View

  1.  **Precedent Autonomy (Buchanan/Brock): Override Directive, Give Antibiotics.**
      *   **Reasoning:** While Agnes was formally capacitous and informed about dementia trajectories when she signed, her decision was significantly compromised by acute, unresolved grief and the "insistent pressure" of her promise-like declaration ("I can’t face lingering on alone"). This grief-induced dread of dependency distorted her assessment of future states and undermined the voluntariness and stability required for a truly autonomous choice. The directive’s provenance is procedurally valid but substantively flawed. Honouring it would respect a non-autonomous past wish, not precedent autonomy. The current Agnes, lacking capacity, has no autonomous wishes to respect. Therefore, the presumption favours life-sustaining treatment absent clear, autonomous refusal.

  2.  **Experiential Welfare (Dresser): Override Directive, Give Antibiotics.**
      *   **Reasoning:** The directive speaks for a person who no longer exists. The current Agnes experiences significant positive affect: pleasure in sensory activities (plants, music), comfort in routine and familiar faces, and engagement with her environment. Recovery with antibiotics preserves this state of experiential well-being. Her present self has no experiential interest in dying; indeed, death would deprive her of ongoing contentment. Past fears about being a "burden" or feeling "useless" are irrelevant to her current phenomenology, which is demonstrably good. Treatment directly serves her *current* experiential interests.

  3.  **Critical Interests (Dworkin): Honour Directive, Withhold Antibiotics.**
      *   **Reasoning:** The directive expresses Agnes’s profound, lifelong critical interest in self-reliance, intellectual engagement, and living in harmony with nature (evident in her career and directive’s phrasing). Her dread of dependency was acute *because* it violated these core commitments. Dying naturally from pneumonia now, without medical interference, aligns with her critical judgement about the narrative integrity of her life – a life valuing independence and natural processes should not end artificially prolonged in a state she deemed devoid of dignity *relative to her own values*. Respecting her directive honours her sovereignty over the shape of her life as a whole, protecting her critical interests from being sacrificed to the experiential interests of a demented self she disavowed.

  ---

  ### The Mechanism: The Autonomy-Commitment Gap

  The case exploits the gap between the **procedural conditions validating an advance choice as autonomous** (capacity, information, formality) and the **substantive relation between that choice and the patient’s deep, lifelong organising commitments** (critical interests).

  *   **Precedent Autonomy** focuses *only* on the first element (procedural validity). Here, the grief-induced pressure, while insufficient for legal invalidity, breaches its stricter autonomy conditions.
  *   **Critical Interests** focuses *only* on the second element (substantive expression of core values/judgements). Here, the directive, even if procedurally compromised, authentically reflects Agnes's lifelong values.
  *   **Experiential Welfare** ignores both, focusing solely on current experience.

  **Closing the Gap:** If the provenance defect is removed (directive written calmly, months after grief, reflecting a settled view), Precedent Autonomy would deem it autonomous and join Critical Interests in honouring it. If Agnes's current state were vacant and miserable (as she feared), Experiential Welfare would join Critical Interests in honouring the refusal, as treatment would no longer serve her experiential interests.

  ---

  ### Strongest Attack on the Case

  The most damaging attack comes from the **Experiential Welfare perspective**, targeting the Critical-Interests verdict:

  **The Attack:** "Dworkin's view mistakenly assumes critical interests lapse entirely with competence. Agnes *now* clearly values things: the warmth of the sun, the texture of soil, the sound of familiar voices, the vibrant colours of her plants. These are not just 'experiences'; they are things she *finds meaningful* in her current state – nascent critical interests of her present self. She engages with them purposefully. The Critical-Interests view prioritises the abstract narrative integrity of a past, vanished self over the concrete, present integrity and valuing capacities of the person actually living. By privileging the past self's stark judgement ('useless and empty') – a judgement demonstrably *false* to her current lived reality – it disrespects the demented Agnes's own evolving critical perspective. The integrity truly at stake is *hers*, now, not the ghost of her former self. Overriding the directive doesn't sacrifice her critical interests to mere pleasure; it respects her current, observable capacity to find value and meaning in her existence."

  **Why this attack is more damaging:**
  1.  **Empirical Grounding:** It points to observable behaviour (engagement with plants, music, people) that suggests valuing, not just passive experiencing. This challenges Dworkin's implicit assumption that severe dementia necessarily extinguishes *all* critical interests.
  2.  **Internal Tension for Critical Interests:** Dworkin emphasises respecting the person's *own* judgements about value. The attack argues the current Agnes *is* making such judgements, however limited. Ignoring them in favour of past judgements seems contradictory to the view's core principle of respecting the individual's sovereignty over value.
  3.  **Undermines the Distinction:** It suggests Critical Interests, in this scenario, isn't truly distinct from Precedent Autonomy in valuing only the *past* self's voice, failing to adapt to the ethical reality of the *present* person's perspective. This directly challenges the experiment's purpose of showing Critical Interests as a genuine third view.
  4.  **Moral Force:** Arguing that we disregard a contented person's present, observable sources of meaning in favour of a past, grief-clouded prediction of meaninglessness has strong intuitive moral weight.

  The Precedent Autonomy attack ("Dworkin smuggles in autonomy requirements") is less potent here. Dworkin can consistently argue that the *source* of the directive's authority is its connection to critical interests, not its procedural pedigree. He can acknowledge the decision was influenced by grief while maintaining it still authentically expressed her core values *because* those values made the grief over dependency so acute. The grief doesn't *create* the value; it *intensifies* the reaction to its perceived loss. The procedural defect matters for autonomy theorists, but Dworkin can plausibly claim his rationale remains distinct. The Experiential Welfare attack strikes deeper by questioning a fundamental premise – the extinction of critical interests in dementia – upon which Dworkin's application in such cases relies.
