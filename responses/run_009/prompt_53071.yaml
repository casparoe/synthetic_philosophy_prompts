   The logical dimensions we might consider (inspired by the request and typical issues in the demarcation problem):

   1. **Response to anomalies**: Does one abandon a theory when faced with an anomaly (like the Uranus orbit) or protect it with ad hoc adjustments? But note: sometimes ad hoc adjustments are later vindicated (like Neptune). So we must be careful.

   2. **Immunizing strategies**: Are immunizing patches (as in Marxism or psychoanalysis) acceptable? Or do they make a theory unscientific?

   3. **Risky predictions and failure**: What if a theory makes risky predictions that fail (like creationism's gaps in the fossil record)? Does that falsify the theory? And if not, why?

   4. **Falsificationism as demarcation vs. as norm**: We must separate the idea of falsification as a criterion for what is science (demarcation) from the idea that scientists should try to falsify their theories (methodological norm). Some might accept the latter but not the former.

   5. **Unit of appraisal**: Is the unit a single theory at a time (e.g., Newtonian mechanics) or a historical series (e.g., from Newton to Einstein)?

   6. **Role of auxiliary assumptions**: When a prediction fails, is it the theory that is falsified or the auxiliary assumptions? How do we decide?

   7. **Degrees of scientific character**: Is demarcation a sharp line or a matter of degree? And is it even possible to have a clear demarcation?

   8. **The goal of science**: Is it about truth, empirical adequacy, problem-solving, or something else?

