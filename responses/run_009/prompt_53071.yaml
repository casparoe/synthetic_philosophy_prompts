  ### Decision Tree for the Demarcation Problem  
  *Based on reactions to concrete cases in the history and philosophy of science. Each branch is answerable without knowing the outcome, using real-world examples to probe underlying principles.*

  ---

  #### **Branch Questions**  
  1. **Leverrier’s Neptune**: When Uranus’ orbit violated Newtonian predictions, Leverrier postulated Neptune (later confirmed). Was this move *legitimate science* or *ad hoc evasion*?  
     - **Legitimate science** → Q2  
     - **Ad hoc evasion** → Q3  

  2. **Marxism/psychoanalysis immunization**: Defenders explain away failures (e.g., revolution not occurring due to "false consciousness"). Is this *scientifically acceptable*?  
     - **Acceptable** → Q4  
     - **Unacceptable** → Q5  

  3. **Creationist predictions**: Creationism predicted fossil gaps, but transitions were found. Does this failure *falsify creationism*?  
     - **Yes** → *Naive falsificationism* (Leaf A)  
     - **No** → Q6  

  4. **Auxiliary hypotheses in crises**: When a theory faces anomalies (e.g., Mercury’s orbit defying Newton), should scientists prioritize *saving the core theory* or *exploring alternatives*?  
     - **Save the core** → *Immunization-tolerant view* (Leaf D)  
     - **Explore alternatives** → Q7  

  5. **Falsifiability as a norm**: Should scientists *actively seek to falsify* their theories (e.g., designing high-risk experiments)?  
     - **Yes** → Q8  
     - **No** → *Pragmatic conservatism* (Leaf G)  

  6. **Unit of appraisal**: Is scientific progress judged by *single theories* (e.g., Newton alone) or *historical series* (e.g., Newton → Einstein)?  
     - **Single theory** → Q9  
     - **Historical series** → *Sophisticated falsificationism* (Leaf B)  

  7. **Demarcation necessity**: Can science be distinguished from pseudoscience *by a universal criterion*?  
     - **Yes** → *Problem-solving rationality* (Leaf C)  
     - **No** → Q10  

  8. **Unfalsifiable but useful**: Can untestable claims (e.g., string theory’s multiverse) be *scientifically valuable*?  
     - **Yes** → *Science as practice* (Leaf F)  
     - **No** → *Naive falsificationism* (Leaf A)  

  9. **Anomalies and theory rejection**: Should *one counterexample* suffice to reject a theory (e.g., one black swan falsifies "all swans are white")?  
     - **Yes** → *Naive falsificationism* (Leaf A)  
     - **No** → *Sophisticated falsificationism* (Leaf B)  

  10. **Cluster characteristics**: Can pseudoscience (e.g., astrology) share *some features* with science (e.g., data collection) yet remain distinct?  
      - **Yes** → *Family-resemblance view* (Leaf E)  
      - **No** → *Demarcation is a pseudo-problem* (Leaf H)  

  ---

  #### **Leaves (Positions)**  
  - **A. Naive falsificationism** (Popper early): Demarcation by testability; *one anomaly falsifies*. Ignores role of auxiliaries.  
  - **B. Sophisticated falsificationism** (Lakatos): Demarcation by *progressive research programs* (predict novel facts). Unit: historical series.  
  - **C. Problem-solving rationality** (Laudan): Demarcation by *effectiveness at solving empirical problems*. Falsifiability unnecessary.  
  - **D. Immunization-tolerant view**: Immunizing patches are valid if *coherent within the framework* (e.g., neo-Darwinism adding genetic drift).  
  - **E. Family-resemblance view** (Wittgensteinian): No sharp criterion; science identified by *cluster traits* (e.g., peer review, predictive success).  
  - **F. Science as practice**: Demarcation by *methodological norms* (e.g., empirical scrutiny) — not theory content.  
  - **G. Pragmatic conservatism**: Preserving theories is rational; *falsification is impractical*. Demarcation irrelevant to practice.  
  - **H. Demarcation is a pseudo-problem** (Feyerabend): No meaningful distinction; "anything goes" in knowledge production.  

  ---

  #### **Limitations & Unoccupied Regions**  
  1. **Indistinguishable leaves**:  
     - **Sophisticated falsificationism (B)** and **Problem-solving rationality (C)** *cannot be fully separated*. Both emphasize progress (novel predictions vs. problem-solving), and real-world judgments often blur them (e.g., evaluating evolutionary biology).  
     - **Science as practice (F)** and **Family-resemblance (E)** overlap on methodology. Cases like peer-reviewed parapsychology challenge clean division.  

  2. **Unoccupied regions (diagnoses)**:  
     - **"Immunization without progress"**: Allows ad hoc patches *and* demands novel predictions. → *Incoherent* (self-contradictory).  
     - **"Falsificationism without units"**: Demands falsification but rejects both single theories and historical series. → *Unworkable* (no appraisal mechanism).  
     - **"Radical instrumentalism"**: Claims science *only* seeks predictions, ignoring explanation. → *Unattractive* (fails to capture scientific aims, e.g., quantum mechanics).  
     - **"Universal Bayesianism"**: Demarcation by probabilistic confirmation *alone*. → *Unexplored* (no prominent defender; clashes with underdetermination).  

  ---

  ### **Tree Workflow**  
  - **Path to leaves**:  
    - A: 1(Ad hoc) → 3(Yes) *or* 1(Legitimate) → 2(Unacceptable) → 5(Yes) → 8(No) *or* 9(Yes).  
    - B: 1(Legitimate) → 2(Unacceptable) → 5(Yes) → 8(Yes) → 6(Historical) *or* 9(No).  
    - C: 1(Legitimate) → 4(Explore alternatives) → 7(Yes).  
    - D: 1(Legitimate) → 2(Acceptable) → 4(Save core).  
    - E: 1(Legitimate) → 2(Acceptable) → 4(Explore) → 7(No) → 10(Yes).  
    - F: 1(Legitimate) → 2(Unacceptable) → 5(No) → 8(Yes).  
    - G: 1(Legitimate) → 2(Unacceptable) → 5(No).  
    - H: 1(Legitimate) → 2(Acceptable) → 4(Explore) → 7(No) → 10(No).  

  This tree prioritizes *case-driven reasoning* over labels, exposing tensions in demarcation (e.g., Q1 pits empiricism against conservatism). Unoccupied regions highlight why certain hybrids lack advocates. Use it to spark debate in seminars!
