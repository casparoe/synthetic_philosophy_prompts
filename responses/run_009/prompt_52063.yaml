prompt: |-
  For a graduate seminar paper I'm drafting on W. E. B. Du Bois as a literary gatekeeper, I want to work out what rule actually generates his editorial verdicts on works of fiction, rather than the rule he said he was following, before I commit to an interpretation. His track record, as I've assembled it from The Crisis and his essays: he condemned Thomas Dixon Jr.'s The Clansman as mendacious pro-Klan propaganda; in the 1926 Crisis symposium on how the Negro should be portrayed in art, he pressed writers toward truthful depictions serving the race's own purposes and was suspicious of portraits shaped by white approval; in the essay Criteria of Negro Art he declared that all art is propaganda, while insisting that truthful ugliness, suffering, and heroism all belong in the picture so long as the work reveals the race's humanity; he reviewed Claude McKay's Home to Harlem in 1928 with something close to disgust, reporting that reading it left him feeling like he needed a bath, and he was plainly irritated that white readers were devouring its cabarets, casual sex, and shiftlessness; and, as far as I can tell, he was reliably warm toward Jessie Fauset's fiction of striving Black middle-class life.

  The test case I want to pose is hypothetical, so treat it as fully specified rather than looking for it. Suppose it is 1929 and a first novel, Red Dirt Sunday, arrives: a naturalist novel by a young Black writer about a Mississippi Delta sharecropper family crushed by debt peonage, gambling, colorism, a hypocritical preacher, and finally a white mob. The prose is genuinely distinguished, the indictment of the plantation economy is unmistakable and sincere, and there is one thin counterweight of aspiration, a daughter who dreams of Fisk. There is no uplift arc and no organized resistance. The book is issued by a major New York house, sells overwhelmingly to white readers, and is celebrated by white critics as raw, authentic, and refreshingly free of what one of them calls the propaganda novel.

  What would Du Bois's verdict be? I'm less interested in the answer than in the machinery: identify at least two rules that fit the track record equally well — for instance, one keyed to whether the work truthfully advances the race's cause, one keyed to whose appetite it feeds and whose praise it wins — and say what each predicts about Red Dirt Sunday, since they seem to me to diverge on it. Then give your best guess and the reasons for preferring it, and tell me what further case, or what minimal change to this one, would most cleanly separate the candidate rules. I'd also like to know if there's a verdict he could render here that his track record genuinely underdetermines, and what principle he'd be committing himself to either way.
reasoning: |-
  Okay, the user is working on a graduate seminar paper about W.E.B. Du Bois as a literary gatekeeper. They want to understand the actual rules behind his editorial verdicts, not just what he claimed. They've provided a track record of Du Bois's reactions to various works: condemning *The Clansman* as propaganda, his stance in the 1926 symposium, his "Criteria of Negro Art" essay, his negative review of McKay's *Home to Harlem*, and his support for Jessie Fauset's work. 

  Now they've created a hypothetical test case: a 1929 naturalist novel called *Red Dirt Sunday* about a sharecropper family facing systemic oppression, with distinguished prose but no uplift arc. It's published by a major house, sells mostly to white readers, and is praised by white critics as "authentic" and free from propaganda. The user wants me to identify at least two rules that explain Du Bois's past decisions, apply them to this test case, predict how each rule would judge the novel, choose the best prediction with reasons, and suggest a way to test the rules further.

  First, I need to extract potential rules from Du Bois's track record. Rule 1 could be **Truthful Instrumentality**: Art must be both factually accurate and serve the race's advancement. This explains why he rejected Dixon's lies and McKay's focus on debauchery (which he saw as damaging) while supporting Fauset's respectable portrayals. Rule 2 might be **Audience/Reception Sovereignty**: The work's value depends heavily on who consumes it and how it's framed by dominant groups. This fits his irritation at McKay being embraced by white readers for "primitive" tropes and his suspicion of art shaped for white approval.

  Applying these to *Red Dirt Sunday*: Rule 1 might approve it because it truthfully exposes oppression (aligned with "truthful ugliness" from his criteria) and has the aspirational daughter, even if it lacks organized resistance. Rule 2 would likely condemn it because white audiences are consuming it as "raw authenticity" – a framing that ignores systemic critique and treats Black suffering as spectacle, much like his concern with McKay.

  My best guess is Du Bois would reject this novel. His critique of McKay centered on white consumption of unflattering content, and here white praise explicitly celebrates the absence of "propaganda" – which Du Bois would see as co-optation. The lack of counterbalance (only one thin aspirational thread) makes it closer to McKay than to his acceptance of "truthful ugliness" in other contexts. 

  To test these rules further, a modified case where a novel with identical content is embraced *by Black audiences* as galvanizing would split the predictions: Rule 1 might still approve (truthful service), while Rule 2 could shift to approval (better audience/reception). Alternatively, adding organized resistance would satisfy Rule 1's instrumental need but leave Rule 2 wary if whites still consumed it as exotic. 

  The underdetermined verdict would be if the novel had stronger aspirational elements but still won white praise. Du Bois might wrestle between valuing the truth/service and distrusting the reception, forcing him to commit to whether audience reception overrides content or vice versa.
answer: |-
  Based on Du Bois's documented positions and your meticulously assembled track record, two distinct, internally consistent "rules" can be extrapolated to explain his verdicts. These rules diverge significantly when applied to your hypothetical *Red Dirt Sunday*.

  **Rule 1: Truthful Instrumentality for Racial Advancement**
  *   **Core Principle:** A work's value is determined by its **truthfulness** in depicting the Black experience *and* its clear **instrumentality** in serving the cause of racial justice, dignity, and self-determination. Truth includes suffering and ugliness, but it *must* be presented in a way that ultimately reveals Black humanity and potential, countering racist narratives and motivating progress. The work's *function* (propaganda in the broad sense) is paramount.
  *   **Fits Track Record:**
      *   *The Clansman:* Condemned for mendacity (lacking truth) and serving white supremacy (harmful instrumentality).
      *   1926 Symposium & Criteria of Negro Art: Emphasizes truthful depiction *in service of* the race's own purposes and propaganda for justice. Truthful ugliness/suffering is acceptable *if* it reveals humanity and serves the cause.
      *   *Home to Harlem:* Condemned (despite partial truth about certain experiences) because its focus on the "lowest" aspects, devoid of counterbalancing dignity/aspiration, failed to reveal full humanity *and* served white voyeurism (harmful instrumentality/anti-propaganda).
      *   Fauset's Fiction: Embraced because it truthfully depicted striving middle-class life, revealed Black capability and aspiration, and served the cause of racial dignity and uplift (positive instrumentality).
  *   **Prediction for *Red Dirt Sunday*:** **Likely Approbation (with possible reservations).**
      *   *Truthfulness:* The novel's depiction of crushing oppression (debt peonage, colorism, hypocritical religion, mob violence) aligns with Du Bois's acceptance of "truthful ugliness" as necessary. The indictment of the plantation economy is sincere and accurate.
      *   *Instrumentality:* While lacking organized resistance or an uplift arc, the daughter's dream of Fisk provides a crucial, if "thin," counterweight of aspiration and potential. The work's core function is an unmistakable, sincere indictment of systemic injustice – propaganda *for* the cause. Its naturalism reveals the brutal reality Black people face, demanding change. Du Bois might wish for *more* explicit hope or resistance, but the truthful depiction of systemic evil *and* the presence of aspiration (however faint) likely meet his instrumental bar, especially compared to McKay's perceived celebration of degradation. The white audience/praise is secondary to the work's inherent truthful purpose.

  **Rule 2: Audience Sovereignty & Anti-Commodification**
  *   **Core Principle:** A work's value is heavily contingent on **who consumes it, how they interpret it, and whose interests its reception serves.** Du Bois is deeply suspicious of art consumed primarily by a white audience seeking "authenticity" that reinforces their existing biases or satisfies prurient interest, regardless of the author's intent or the work's inherent content. Art consumed as a commodity of Black pain or exoticism by the dominant group is inherently problematic, especially if it lacks strong counter-narratives of dignity/agency within the text to resist misappropriation. White praise framing the work as "free of propaganda" is a major red flag.
  *   **Fits Track Record:**
      *   *The Clansman:* Explicitly created *for* a white supremacist audience, serving their agenda.
      *   1926 Symposium & Criteria of Negro Art: Suspicion of portraits shaped by white approval implies awareness of audience influence on creation *and* reception.
      *   *Home to Harlem:* The core objection centers on white readers "devouring" its depictions for lurid enjoyment ("felt like needing a bath"). McKay's content became a commodity fulfilling white stereotypes, irrespective of any authorial critique.
      *   Fauset's Fiction: Likely consumed more by a Black and/or sympathetic white audience seeking affirmation of Black middle-class respectability and achievement, not prurient interest.
  *   **Prediction for *Red Dirt Sunday*:** **Likely Condemnation.**
      *   *Audience/Reception:* The novel sells "overwhelmingly to white readers" and is "celebrated by white critics as raw, authentic, and refreshingly free of... propaganda." This directly mirrors Du Bois's disgust with *Home to Harlem*. White readers are consuming unrelenting Black suffering and degradation as "authentic" spectacle, explicitly praising its *lack* of the very "propaganda" (i.e., purposeful messaging for justice) Du Bois deemed essential. The "thin counterweight" of aspiration is likely insufficient to prevent the work from being commodified as raw Black pain for white consumption. The "naturalism" and lack of resistance make it *easier* for white readers to interpret the crushing oppression as inherent or inevitable, not systemic.

  **Best Guess & Reasoning:**

  I predict **Du Bois would condemn *Red Dirt Sunday*, aligning more strongly with Rule 2 (Audience Sovereignty & Anti-Commodification).**

  *   **McKay Parallel:** The reception scenario is *too* similar to *Home to Harlem*. The overwhelming white readership celebrating its "raw authenticity" while explicitly rejecting "propaganda" would trigger Du Bois's deepest suspicion and likely disgust. He would see the white critics' praise as proof the novel was failing its instrumental purpose and instead serving white voyeurism.
  *   **Thinness of Aspiration:** The "one thin counterweight" is unlikely to satisfy Du Bois's need for a work to actively "reveal the race's humanity" *against* the tide of suffering presented, especially when the reception suggests this element is being ignored or minimized by the audience embracing it. Naturalism without a strong counter-narrative risks confirming stereotypes for the white gaze.
  *   **"Free of Propaganda" as Poison Pill:** The white critics' specific framing of the novel as refreshingly lacking "propaganda" would be anathema to Du Bois, who declared "all art is propaganda." He would interpret this praise as evidence the novel was *not* successfully functioning as propaganda *for* the race, which Rule 1 requires, making its instrumental value highly suspect. This reception likely overrides the sincere indictment inherent in the text for Du Bois.
  *   **Instrumentality Undercut:** While the indictment is sincere, Rule 2 suggests Du Bois would question *whom* this indictment serves if it's primarily consumed as authentic spectacle by the oppressor group. Does it galvanize Black readers or motivate white allies? Or does it satisfy a morbid curiosity or reinforce a sense of white superiority/pity? The described reception strongly points to the latter.

  **Clearest Test Case to Separate Rules:**

  Modify *Red Dirt Sunday* **only by its reception:** Imagine identical content (distinguished prose, crushing oppression, thin aspirational thread, no organized resistance, major publisher) but now it becomes a *cause célèbre* **within the Black community**, particularly among intellectuals and activists. It sparks intense discussion about the realities of peonage and violence, validates shared experiences, and is seen as a powerful, galvanizing indictment, despite its bleakness. White critics are more muted or even dismissive, perhaps finding it "depressing" or "propagandistic."

  *   **Rule 1 (Truthful Instrumentality):** Would likely **approve**. The content is truthful, the indictment serves the cause (especially now galvanizing the Black community), and the aspiration, while thin, exists. White dismissal might even be a badge of honor.
  *   **Rule 2 (Audience Sovereignty):** Would likely **approve**. The primary audience is now the Black community, consuming it for validation and motivation (instrumentality). White disinterest or dismissal signals it's *not* being commodified for their voyeurism. The work serves Black purposes.

  **Underdetermined Verdict & Principle:**

  A verdict on *Red Dirt Sunday* that the track record genuinely underdetermines is **qualified approval based solely on artistic merit despite problematic reception.**

  *   **The Track Record:** Du Bois consistently subordinates pure aesthetics to purpose (propaganda) and is hypersensitive to white reception. He praised Fauset and others for artistry *within* works serving the cause. His disgust at McKay overrode any literary qualities. Condemning Dixon wasn't about literary merit. There's no clear case where he championed a work *despite* it being consumed in a way he found deeply objectionable, especially if it lacked strong internal counter-narratives.
  *   **The Commitment:** If Du Bois *did* praise *Red Dirt Sunday* despite the reception because of its "genuinely distinguished prose" and "unmistakable and sincere" indictment, he would be committing to a principle he never explicitly championed: **Aesthetic Autonomy.** This would mean that the inherent artistic value of a truthful, sincere depiction could, at least sometimes, outweigh the negative implications of its reception by the dominant group, even if it lacked a strong aspirational counterweight. This contradicts his stated views on propaganda and his evident practice regarding McKay. Such a verdict would be genuinely surprising based on the evidence provided. It would suggest a more nuanced, or perhaps inconsistent, application of his stated principles than the track record reveals.
