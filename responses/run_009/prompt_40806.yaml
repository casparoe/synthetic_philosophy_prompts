prompt: |-
  I'm teaching a seminar on moral sentimentalism this term, and next unit is Adam Smith. I want to run a little exercise with my eight students and I'd like your help setting up the answer key. The plan: I compress Smith's verdicts across the examples in the Theory of Moral Sentiments into a bare track record, spring a new case on the class, and have them predict the verdict from the record alone — no consulting the text mid-exercise. Here's the record as I've been paraphrasing it (my compression, not his wording): he condemns our disposition to admire the rich and look down on the poor, calling it roughly the single biggest source of corruption in our moral judgments; yet in the very same discussion he treats the poor man's son who ruins his youth chasing wealth as driven by a deception of nature — one the poor man's son would see through and curse in calmer moments — and that same deception is what rouses and keeps up the industry of mankind, so admiration of the great is somehow both corrupting and load-bearing; he disapproves of the man of system, who treats citizens like pieces on a chessboard, while approving the public-spirited person who works with the prejudices of the people rather than against them; he holds that resentment is a proper sentiment in some degree and that spectators go along with punishment, but that they cannot go along with violent or excessive revenge, and that even the condemned man wins some sympathy from the crowd once he submits; he ranks acting from a desire to be worthy of approbation above acting for praise itself, and treats praise that isn't merited as yielding little solid satisfaction; and he admires self-command while criticizing the Stoics for pushing indifference to all emotion too far. One of my students has decided Smith is basically a proto-utilitarian and wont let it go, so I'm curious whether the record actually supports that.

  The new case I want to spring: a celebrated founder-philanthropist dies, and a few years later it comes out that the fortune was founded on a fraud — early investors were quietly wiped out, and without the fraud none of the later philanthropy happens. The philanthropy itself was real and enormous. Even after the revelation the hospitals keep his name, the public mostly says it cant bring itself to hate him, and the museum attendance actually went up.

  Since I want to compare answers across groups, give it to me in a fixed shape: exactly five numbered points, each a sentence or two, no intro or conclusion. Points one through three: the three candidate rules that best fit the track record, each with what it predicts Smith would say about the founder case (if you think there's a genuine fourth rule, fold it into whichever point it belongs with, dont add a sixth point). Point four: your best guess as to Smith's actual verdict, with your reason for weighting that rule over the others. Point five: the single further case — hypothetical is fine — that would most cleanly split the candidate rules apart. And please dont let every rule quietly collapse into usefulness; my proto-utilitarian student will try that move, and I want the rules to be ones a careful reader of Smith could actually hold.
reasoning: |-
  Okay, the user is teaching a seminar on Adam Smith's moral sentimentalism and needs help setting up an exercise. They've compiled a track record of Smith's verdicts from *The Theory of Moral Sentiments* and want students to predict Smith's judgment on a new case about a fraudulent founder-philanthropist. The case involves a philanthropist whose wealth came from fraud, but whose philanthropy was real and beneficial. After the fraud is revealed, the public still doesn't hate him, and institutions keep his name.

  First, I need to recall Smith's key ideas. He condemns admiring the rich but notes this "deception" drives industry. He criticizes the "man of system" but values working with people's prejudices. Resentment is okay, but not excessive revenge. Acting to be worthy of praise is better than seeking praise itself. Self-command is good, but Stoic indifference is too extreme. The student arguing Smith is proto-utilitarian might overemphasize utility, but Smith's focus is on sentiments and propriety.

  The user wants exactly five points. Points 1-3: three candidate rules fitting the track record, each with a prediction for the case. Point 4: best guess of Smith's actual verdict and why that rule is weighted higher. Point 5: a splitting case to differentiate the rules.

  Candidate rules: 
  1. Sympathetic Propriety Rule: Judgments based on spectator sympathy. Propriety matters more than outcomes. For the case, spectators might sympathize with the founder's later philanthropy but condemn the fraud. Mixed verdict: disapprove fraud but acknowledge public's sympathy.
  2. Natural Deception and Social Function Rule: Admiration of wealth is corrupting but drives progress. Public benefits might justify the deception. Prediction: Ambivalent, focusing on societal benefits despite corruption.
  3. Motive and Merit Rule: Motives matter. Acting for approbation vs. merit. Fraudulent motives condemn him, even if philanthropy had good effects. Prediction: Disapproval because initial motives were corrupt.

  Point 4: Best guess. Smith would condemn the founder because sympathy can't overlook the fraud. The fraud lacks propriety, and admiration here is corrupt. Sympathetic Propriety Rule is key because propriety is central, and spectators can't sympathize with injustice. The public's reaction is part of the deception Smith criticizes.

  Point 5: A splitting case. A scenario where motives are pure but outcomes bad vs. motives corrupt but outcomes good. Example: A well-intentioned reformer causes harm vs. a selfish merchant whose actions unintentionally help. This splits Rule 1 (sympathy for intentions) from Rule 3 (motive focus) and Rule 2 (outcomes).

  Need to ensure rules don't collapse into utility. Rule 2 includes social function but isn't purely utilitarian because Smith's deception is about psychological drives, not just outcomes. Rule 3 emphasizes motives over results. The splitting case clearly distinguishes intent vs. outcomes.
answer: |-
  Here is the answer key structured as requested:

  1. **Sympathetic Propriety Rule**: Smith judges acts by whether impartial spectators can sympathize with the motives/responses involved. Prediction: **Disapproval**. Spectators cannot sympathize with the fraud (improper resentment toward victims) but *can* sympathize with post-revelation public ambivalence (as submission to fate). Mixed verdict: condemn fraud yet acknowledge complex public sentiment.  
  2. **Natural Deception Social Function Rule**: Socially useful "deceptions" (e.g., wealth pursuit driving industry) are tolerated despite moral costs if they sustain progress. Prediction: **Ambivalent acceptance**. The fraud enabled philanthropy (social benefit), mirroring the "poor man's son" deception—corrupt yet functional. Public gratitude post-revelation reflects ingrained, useful admiration.  
  3. **Motive Merit Rule**: Moral worth depends on praiseworthy *motives* (desire for *worthiness*, not praise) and merit-based satisfaction. Prediction: **Strong condemnation**. Founding fraud reveals corrupt motives (greed/deceit), making later philanthropy meritless "praise without desert." Self-command was absent in fraud; submission post-revelation doesn’t redeem initial vice.  

  4. **Actual Verdict Prediction & Weighting**: **Smith condemns the founder decisively**. Sympathetic Propriety Rule weighs heaviest: spectators cannot sympathize with the *injustice* of fraud (unlike submitted punishment), making admiration corrupt per his wealth critique. The public’s ambivalence reflects the *very corruption* Smith laments—admiring outcomes while ignoring improper means. Motive Merit Rule reinforces this (fraud voids merit), while Social Function is secondary here; Smith critiques functional deceptions *as corruptions*, not endorsements.  

  5. **Splitting Case**: *A reclusive merchant, acting solely for personal comfort (no desire for praise/worthiness), accidentally funds a lifesaving town bridge via reckless speculation that ruins a rival. The public reveres him.*  
     - Rule 1: Approves (spectators sympathize with relief/gratitude, not his motives).  
     - Rule 2: Approves (social benefit outweighs corrupt motives).  
     - Rule 3: Condemns (no virtuous motive; undeserved praise).  

  ---
  ### Design Notes:
  - **Anti-Utility Guard**: Rules avoid collapsing into utility by centering Smith’s mechanisms: Rule 1 (sympathy/propriety), Rule 2 (natural deception’s psychological function ≠ outcome optimization), Rule 3 (motive desert). The splitting case isolates intent vs. outcome.  
  - **Proto-Utilitarian Counter**: The track record shows Smith prioritizing *propriety of sentiment* over consequences (e.g., condemning wealth admiration despite its benefits). Rule 3’s "merit" focus further diverges from utility.  
  - **Verdict Rationale**: Smith’s fraud condemnation would stress *spectator inability to sympathize with injustice* (cf. his resentment limits) and the *corrosive disconnect* between public admiration and moral desert (wealth corruption theme).  
  - **Exercise Fit**: The splitting case forces debate between sympathy (Rule 1), social function (Rule 2), and motive (Rule 3), preventing utilitarian conflation.
