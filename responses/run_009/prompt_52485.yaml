  Then there's the luck/relational divide. Anderson/Scheffler aren't just refining distribution patterns; they're rejecting the entire project. For them, equality is about relationships, not allocations. Luck egalitarians focus on "who gets what based on what they're responsible for," while relational egalitarians care about "how people relate to each other in society." When relational critics say letting the imprudent perish is stigmatizing, and luck egalitarians counter with thresholds or refined responsibility conditions, they're talking past each other. The luck egalitarian sees a fixed injustice; the relational sees a violation of social dignity. Concrete cases like religious observance subsidies highlight this: one side sees unfair disadvantage, the other sees potential stigmatization through pity-based aid. So it's not verbal confusion—it's fundamentally different normative foundations.

