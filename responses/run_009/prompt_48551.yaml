  We are designing an in-class betting game to illustrate the Principal Principle and the concept of admissibility. The goal is to show students when to defer to the stated chance and when not to, based on the admissibility of additional evidence.

  Game Overview:
  - The game uses chips for betting (no real money) and a leaderboard.
  - There will be multiple rounds, each with a different setup (spinner, dice, urn, etc.).
  - In each round, students are given some evidence (like a stated chance, or additional information) and then they place bets on the outcome (which will be revealed by the device).
  - The house (the instructor) will offer bets at odds that are fair only if the student's credence matches the true chance (or the rational credence given the evidence). Students who have the correct credence break even on average, while those with the wrong credence lose money.

  Key Rounds:
  1. Round 1: Basic deference. Students are given the true chance and no other evidence. They should defer.
  2. Round 2: Inadmissible evidence. Students are given the chance and then extra information that is clearly inadmissible (e.g., a tip about the outcome). They should not defer to the chance.
  3. Round 3: Contested admissibility. Students are given a chance from a "theory card" and then get a leak that the theory is about to be refuted. This information is inadmissible because it undercuts the chance statement. They should not defer.

  Trading Mechanic:
  - Each student starts with 100 chips.
  - In each round, the house will offer a bet on the outcome (say, a binary event: A or not-A). The house will set the odds based on the stated chance (or the true chance, if known). But note: the house will set the odds in a way that is fair for the true chance at the time of betting, but if the student has extra information that changes the chance, then the house odds might be exploitable or disadvantageous.
