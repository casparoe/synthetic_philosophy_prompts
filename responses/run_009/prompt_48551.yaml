  Example bet: 
  - The house offers a bet that pays 1 chip if event A occurs, and 0 otherwise. The house sells this bet at a price equal to the stated chance (so if the stated chance is 0.6, the price is 0.6 chips). Alternatively, to make it more engaging, we can use a betting slip that costs 1 chip and pays out 1/p chips if A occurs (so that the expected return is 1 if the probability is p). But to keep it simple, we can use a linear bet.

