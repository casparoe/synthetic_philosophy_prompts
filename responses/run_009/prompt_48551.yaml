answer: |-
  ### Principal Principle Betting Game: Classroom Activity Design

  **Objective**: Illustrate the content of Lewis's Principal Principle by forcing students to confront when deference to stated chances is rational (admissible evidence) vs. when it leads to losses (inadmissible evidence). The game uses tangible setups to show that "admissibility" is not circular—it is defined by evidence that *undercuts the chance mechanism itself* or *directly predicts the outcome*.

  ---

  #### **Materials**
  - **Physical devices**: 
    - *Round 1*: Spinner with 60% blue, 40% red sectors (true chance: 0.6 blue).
    - *Round 2*: Double-headed coin (true chance: 1.0 heads) and a fair coin (true chance: 0.5 heads).
    - *Round 3*: Urn with 1 red ball and 19 green balls (true chance: 0.05 red).  
  - **Theory cards**: Printed statements of "objective chances" (sometimes false).  
  - **Betting chips**: 100 chips per student.  
  - **Leaderboard**: Track chip totals publicly.  
  - **Evidence cards**: For Rounds 2–3 (tips/leaks).  

  ---

  #### **Game Rules & Trading Mechanics**  
  - **Betting**:  
    - House sells "outcome tickets" (e.g., "blue spinner" ticket) at price = stated chance (e.g., ticket for blue costs 60 chips, pays 100 if blue wins).  
    - Students buy/sell tickets based on their credence. Rationale:  
      - If credence > price → **buy** (expect profit).  
      - If credence < price → **sell** (expect profit).  
      - If credence = price → **abstain** (break even).  
  - **Key twist**: House sets prices **before** extra evidence is revealed. Prices stay fixed.  
  - **Scoring**: Chips gained/lost after each outcome. Leaderboard updates incentivize competition.  

  ---

  #### **Round Sequence (Total: 60 minutes)**  
  1. **Round 1: Calibration Report (15 mins)**  
     - **Setup**: Spinner (true chance: 0.6 blue).  
     - **Evidence**: Calibration report: "Chance of blue is 0.6."  
     - **Admissible**: Yes.  
     - **Goal**: Deference is rational.  
     - **Execution**:  
       - House sells blue tickets at 60 chips.  
       - Students trade. Spinner is spun.  
       - **Expected outcome**: Traders break even on average. Second-guessers (e.g., those who buy/sell heavily) lose to variance.  
     - **Debrief hook**: "Why did trusting the report not hurt you?"  

  2. **Round 2: Inadmissible Tip (20 mins)**  
     - **Setup**: Double-headed coin (true chance: 1.0 heads).  
     - **Evidence**:  
       - Theory card: "Chance of heads is 0.5."  
       - *Mid-round tip*: "Source X (90% accurate) says: outcome is tails." (False; coin is double-headed).  
     - **Admissible**: No (tip predicts outcome).  
     - **Goal**: Deference loses; tip should override.  
     - **Execution**:  
       - House sets head-ticket price at 50 chips (per theory card).  
       - Tip is revealed. Students trade.  
       - Coin flipped → heads (exposing tip as false).  
       - **Punishment**: Students who defer to 0.5 and buy/sell lose. Those who ignore theory and bet on heads (credence 1.0) profit.  
     - **Debrief hook**: "Why did the tip—even though wrong—make deference irrational?"  

  3. **Round 3: Refuted Theory (25 mins)**  
     - **Setup**: Urn with 1 red ball (true chance: 0.05 red).  
     - **Evidence**:  
       - Theory card: "Chance of red is 0.8."  
       - *Mid-round leak*: "Lab error: urn has only 1 red ball, not 16."  
     - **Admissible**: No (leak undercuts chance mechanism).  
     - **Goal**: Deference loses; leak should override.  
     - **Execution**:  
       - House sets red-ticket price at 80 chips (per theory card).  
       - Leak revealed. Students trade.  
       - Ball drawn → green (true chance 0.95).  
       - **Punishment**: Students who defer to 0.8 and buy red tickets lose chips. Those who sell (credence 0.05) profit.  
     - **Debrief hook**: "Why did the leak change rational credence, even without outcome data?"  

  ---

  #### **Debrief (30 mins)**  
  - **Map game moments to the Principle**:  
    | Game Moment              | Idea                                        |  
    |--------------------------|--------------------------------------------|  
    | Round 1: Break-even      | Admissible evidence = chance is trustworthy. Deference is optimal. |  
    | Round 2: Tip overrides   | Inadmissible evidence = information about outcome. Chance does *not* summarize all relevant facts. |  
    | Round 3: Leak overrides  | Inadmissible evidence = undercuts chance mechanism. Chance statement is obsolete. |  
  - **Settle the argument**:  
    - Your friend is wrong—the Principle is **not empty**. "Admissible" is defined by **causal role**: evidence is inadmissible if it *bypasses or invalidates the chance mechanism* (e.g., the leak) or *directly references the outcome* (e.g., the tip).  
    - The game shows **where content lives**: in the empirical fact that chances are summaries of *mechanistic setups*. When setups change or outcomes are known, chances lose authority.  

  ---

  #### **Predictable Problems & Fixes**  
  1. **Problem**: Students confuse "admissibility" with "reliability" (e.g., trust the tip in Round 2 despite its falsity).  
     - **Fix**: Emphasize *inadmissibility ≠ truth*. The tip was wrong but still inadmissible because it predicted the outcome.  
  2. **Problem**: Betting mechanics slow down the game.  
     - **Fix**: Use pre-printed betting slips; limit trade time to 2 mins/round.  
  3. **Problem**: Random outcomes contradict expectations (e.g., red ball drawn in Round 3).  
     - **Fix**: Calculate expected profits during debrief. Stress that rational credence maximizes *long-run* profit.  

  ---

  #### **What the Game Cannot Reproduce**  
  - **Inferring chances from setups**: The Principal Principle assumes chances are *given*, not inferred. The game can’t show how to handle ambiguous evidence (e.g., "Is this die loaded?") where chances are unknown. You’ll need to explain:  
    > "The Principle doesn’t tell you how to *find* chances—only how to use them once you have trustworthy reports. Inference is where Bayesian updating shines."  

