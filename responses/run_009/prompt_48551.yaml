  ### How This Settles Your Argument  
  - **You win**: The game proves the Principle has **non-circular content**. "Admissible" is pinned to *empirical conditions*: evidence that invalidates the chance mechanism (the leak) or directly references the outcome (the tip) breaks deference. The students' losses in Rounds 2–3 show that admissibility is not tautological—it is defined by the causal structure of evidence.  
  - **Bonus**: When your friend visits, the Round 3 "refuted theory" moment will hit hard. The leak isn’t "about the outcome"—it’s about the *mechanism*—yet it’s inadmissible. This forces him to concede that "admissible" has substantive criteria.  

  **Pro tip**: Run the game twice—once for practice, once "for real." The second run sharpens strategic play, making the admissibility lesson visceral.
