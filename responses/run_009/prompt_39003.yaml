prompt: |-
  My friend from a political philosophy seminar I took a few years ago has developed a fairly settled line on when secession is legitimate, and I'd like to predict where she'll land on a new case. Her verdicts so far: she thought Scotland's 2014 referendum was entirely legitimate and that Westminster was right to permit it, holding that a Yes vote would have created a genuine duty to negotiate secession in good faith. On Quebec, she thinks Canada was right to allow the 1995 referendum, but she insists a bare 50-per-cent-plus-one Yes would not have sufficed — she wants a clear majority, comfortably above half, though I've never pinned down whether she means a clear majority of votes cast or of the whole electorate. On Catalonia in 2017, she sided with Madrid: the unilateral referendum was illegitimate, the Spanish state was entitled to prevent it, and nothing followed from the roughly ninety per cent Yes vote on a turnout of about forty-three per cent — though when I pressed her on whether a cleanly run unilateral vote with high turnout and a solid Yes would have changed her answer, she deflected. On Kosovo, she thinks the 2008 declaration of independence was legitimate and deserved recognition, despite being unilateral and flatly contrary to the Serbian constitutional order, given the mass expulsions that preceded it. On Crimea in 2014, she thinks the referendum was void regardless of what Crimeans actually wanted, because it was conducted under foreign military occupation. And she's entirely comfortable with the dissolution of Czechoslovakia in 1993, even though no referendum was ever held — the parliaments legislated it after national elections, and that was enough for her.

  The new case is hypothetical, but I've tried to make it test her principles rather than flatter them. Imagine Norland: a culturally distinct, somewhat wealthier province of a stable federal democracy with impeccable democratic credentials and no history of oppression or discrimination against the region. A secessionist party wins the provincial election on an explicit mandate; the national government, citing constitutional indivisibility, refuses any referendum. The province holds one anyway. The first vote returns sixty-one per cent Yes on seventy-six per cent turnout; two years later, after the national government again refuses to negotiate, a second returns sixty-four per cent Yes on seventy-nine per cent turnout — which, as I make it, is just over half of the registered electorate. International observers certify both votes as free and clean, and no foreign power is involved in any way.

  What will she say about Norland — that there's a pro tanto claim to statehood others ought to act on, or that the national government remains within its rights to hold the state together indefinitely? I'm less interested in the verdict itself than in the rule she seems to be running. As far as I can see, at least two fit her track record: a consent-based rule on which legitimacy requires either the host state's agreement or a remedial grievance, and a rule on which legitimacy tracks a sufficiently strong, sustained, and uncoerced expression of the region's will, with Kosovo's grievance as merely one way of marking seriousness. There are also the sub-questions I can't resolve from her record: whether the velvet divorce shows she can live with no referendum at all if the political class agrees, and whether her "clear majority" means of votes cast (which Norland clears comfortably) or of the whole electorate (which Norland clears only by a whisker, on the second vote). Please give me your best guess at her verdict with your reasons, the rival rules that fit her record and what each predicts about Norland, where they genuinely diverge, and then the further case — a tweak to the Norland scenario or a new case altogether — that would best tell those rules apart.
reasoning: |-
  Okay, let me approach this methodically. The user presents a fascinating puzzle about predicting a friend's political philosophy stance on secession, using her past judgments as clues. The core challenge is reverse-engineering her underlying principles from fragmented positions on real-world cases.

  First, I need to map her existing verdicts clearly:

  - Scotland 2014: Legitimate because UK consented
  - Quebec 1995: Legitimate vote but requires supermajority (undefined scale)
  - Catalonia 2017: Illegitimate without Spanish consent
  - Kosovo 2008: Legitimate despite Serbia's objection due to remedial grievance
  - Crimea 2014: Illegitimate under occupation regardless of popular will
  - Czechoslovakia 1993: Legitimate without referendum through elite consensus

  The hypothetical Norland case adds complexity: unilateral referendum with 64% yes (79% turnout) in a prosperous region with no oppression, certified as clean. The key tension is whether her framework requires state consent OR remedial justification OR if strong democratic expression alone suffices.

  I notice two plausible competing principles emerging from her record:

  1) The Consent/Remedial Model: Secession requires either host state approval or severe rights violations. This fits her rejection of Catalonia (no consent, no grievance) and acceptance of Kosovo (remedial case). Norland would fail both tests.

  2) The Expressive Democratic Will Model: Where popular desire is overwhelming and persistent, it creates legitimacy regardless of consent. This could reconcile Quebec's supermajority expectation with Kosovo's exceptionalism as intensity indicators. Norland's strong dual votes might satisfy this.

  The Czechoslovakian case introduces a third variable - elite consensus as alternative validation. But since Norland's national government opposes, this doesn't apply.

  On the unresolved "clear majority" question: Quebec's ambiguity suggests she may prioritize vote-share over electorate-share, as Norland's 64% far exceeds 50%+1. But Czechoslovakia shows process flexibility when elites agree.

  For prediction, the Consent/Remedial model seems dominant in her reasoning because:
  - She explicitly rejected Catalonia's unilateral vote despite high yes percentage
  - Kosovo was framed as exception due to atrocities, not democratic intensity
  - She deflected when asked about high-turnout Catalonia scenario, avoiding endorsement of pure will-based justification

  Thus, Norland lacks both state consent and remedial grounds, so she'd likely deem it illegitimate. The velvet divorce exception proves the rule - it had elite consensus.

  To test between models, I'd propose a tweaked Norland: same facts but add historical cultural suppression (remedial element) OR have national parliament narrowly approve the referendum (consent). Each model would split differently on these variants.
answer: |-
  Based on your friend's consistent pattern of reasoning, I predict she will **reject Norland's unilateral secession as illegitimate**, arguing the national government is within its rights to hold the state together. Here's the breakdown of her likely reasoning, the competing rules, and how to test them:

  ---

  ### **Predicted Verdict on Norland: Illegitimate**
  1. **No Host-State Consent:**  
     Norland's national government explicitly refused a referendum, mirroring Spain/Catalonia (which she rejected). Her deflection on Catalonia's hypothetical "clean vote" suggests consent remains non-negotiable absent exceptional justification.  

  2. **No Remedial Grievance:**  
     Norland has "no history of oppression or discrimination," eliminating the Kosovo exception (which she framed as legitimizing unilateralism due to "mass expulsions"). Crimea’s occupation further shows she discounts popular will under coercion, but Norland’s clean vote lacks such taint.  

  3. **Supermajority Ambiguity Resolved:**  
     - Her Quebec stance requires a "clear majority, comfortably above half." Norland’s 64% Yes (of votes cast) likely clears this *if* she means votes cast.  
     - **But**: Czechoslovakia’s dissolution without *any* referendum shows elite agreement can substitute for popular consultation. Here, the national government *opposes* secession, so elite consensus is absent. Her silence on electorate-wide thresholds in Quebec suggests votes cast suffice, but Norland’s legitimacy fails on prior grounds.  

  4. **Kosovo as the Exception, Not the Rule:**  
     She treats Kosovo’s remedial case as singular ("*given* the mass expulsions"), not a template for unilateralism. Norland’s prosperity and stability contrast sharply.  

  **Her likely conclusion:** Secession requires either state consent *or* a severe, Kosovo-level grievance. Norland has neither, so its referendums—however clean—create no duty to negotiate.  

  ---

  ### **Two Rival Rules Fitting Her Record**  
  Both models accommodate her past verdicts but diverge sharply on Norland:  

  1. **The Consent/Remedial Model**  
     - **Rule**: Legitimacy requires either (a) host-state consent *or* (b) a severe remedial grievance (systematic oppression, violence, or rights violations).  
     - **Fits her record**:  
       - *Consent path*: Scotland (UK permitted), Quebec (Canada permitted), Czechoslovakia (elite consensus).  
       - *Remedial path*: Kosovo (expulsions justified unilateralism).  
       - *Rejects*: Catalonia (no consent/grievance), Crimea (coercion voids will).  
     - **Norland prediction**: **Illegitimate**—no consent, no grievance.  

  2. **The Expressive Democratic Will Model**  
     - **Rule**: Legitimacy requires a *sustained, unambiguous, and uncoerced* expression of popular will. Grievances or consent are proxies for gauging seriousness, not strict requirements.  
     - **Fits her record**:  
       - Quebec’s supermajority demand and Kosovo’s urgency both signal "serious" will.  
       - Scotland/Quebec consent reflects trust in process, not a standalone principle.  
       - Czechoslovakia’s elite deal implies presumed popular acquiescence.  
       - Rejects Crimea due to coercion (will not uncoerced).  
     - **Norland prediction**: **Legitimate**—64% Yes over two high-turnout votes shows clear, persistent will.  

  ---

  ### **Where the Rules Genuinely Diverge**  
  The core conflict is **whether democratic will alone can justify secession without state consent or grievance**:  
  - **Consent/Remedial Model**: Unilateral secession is never legitimate without grievance. "Clean" votes like Catalonia/Norland are irrelevant.  
  - **Expressive Will Model**: Sufficiently robust democratic expression (e.g., Norland’s 64% over two votes) *creates* legitimacy, even without consent. Grievances merely help demonstrate resolve.  

  Her deflection on Catalonia’s hypothetical clean vote suggests she adheres to **Consent/Remedial**. If she endorsed pure democratic will, Catalonia’s scenario would have been a clear "yes."  

  ---

  ### **The Crucial Test Case: Differentiating the Rules**  
  **Tweak Norland to add a moderate grievance**:  
  > *Same as original, but Norland recently suffered cultural suppression (e.g., banned language in schools, dismantled regional institutions). The national government dismisses these concerns as "exaggerated."*  

  - **Consent/Remedial Model**: Still **illegitimate**. Grievance must reach Kosovo-level severity (e.g., ethnic cleansing, systemic violence)—not "mere" discrimination.  
  - **Expressive Will Model**: **Legitimate**. Grievance + strong democratic mandate signals seriousness, even if not catastrophic.  

  **Why this works**:  
  1. Her Kosovo stance sets a high bar for remedial cases. If she rejects this tweaked Norland, she prioritizes consent/severity.  
  2. If she accepts it, she uses grievance as a proxy for democratic seriousness (Expressive Will model).  

  **Alternative test (no grievance, but elite consensus)**:  
  > *After Norland’s second vote, the national parliament narrowly votes to authorize negotiations (e.g., 51% support), though the constitution still forbids secession.*  

  - **Consent/Remedial Model**: **Legitimate**. State consent exists (like Scotland/Quebec).  
  - **Expressive Will Model**: Also legitimate, but now *both* models agree—making it less diagnostic.  

  ---

  ### **Summary**  
  - **Your friend’s likely Norland verdict**: Illegitimate (prioritizing consent/remedial grounds).  
  - **Her implied rule**: Secession requires host-state consent *or* Kosovo-level grievances. Democratic will alone is insufficient.  
  - **Smoking-gun test**: Add a non-catastrophic grievance to Norland. If she still rejects it, Consent/Remedial is confirmed. If she accepts, Expressive Will gains support.  

  This tracks her deflection on Catalonia and her insistence that Kosovo’s gravity *justified* ignoring Serbia—not that popular will alone could. The velvet divorce shows process flexibility, but only when elites agree, which Norland lacks.
